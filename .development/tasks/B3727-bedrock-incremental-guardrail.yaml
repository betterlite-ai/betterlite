    why: _incremental_scan_cache method — resolves shared proxy cache vs process-local fallback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L3082-L3092
    why: _bedrock_response_has_masked_output method — detects whether guardrail returned masked/anonymized content.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L3094-L3145
    why: _apply_incremental_request_scan method — filters texts by session, skips call when nothing is new, returns None on masked output.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L3147-L3286
    why: apply_guardrail method — generic hook accepting text batch, selecting messages by input_type, calling make_bedrock_api_request, applying masking and write-back.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L3276-L3286
    why: Exception handling — HTTPException and ModifyResponseException propagate as-is, others are wrapped.
dod:
  - text: _incremental_scan_cache returns the shared proxy cache when proxy_logging_obj is available and has internal_usage_cache.dual_cache, otherwise returns process-local fallback.
    proof: [incremental-cache]
  - text: _bedrock_response_has_masked_output returns true only when the response has non-empty text in the "output" or "outputs" field, meaning the guardrail masked/anonymized content.
    proof: [masked-detection]
  - text: _apply_incremental_request_scan calls filter_new_texts_for_session, skips the Bedrock call when no new texts are found, returns None when masked output is detected, and calls mark_texts_scanned on success.
    proof: [incremental-scan]
  - text: apply_guardrail handles input_type "request" with INPUT source (user content) and "response" with OUTPUT source (model content), using synthetic mock messages for response scans.
    proof: [apply-guardrail-sources]
  - text: apply_guardrail calls _select_messages_for_apply_guardrail, skips scan when skip_scan is true, and applies masking write-back through _merge_masked_texts.
    proof: [apply-guardrail-selection]
  - text: apply_guardrail logs debug messages on entry, exit and when content is empty/new, and logs errors on exception.
    proof: [apply-guardrail-logging]
  - text: HTTPException and ModifyResponseException from guardrail blocks are re-raised; other exceptions are wrapped in Exception with the guardrail error message.
    proof: [apply-guardrail-errors]
