oracle_cases: []
deviations:
  - what: The incremental scan cache is optional; when unavailable, every request is treated as a full scan.
    why: The proxy's internal_usage_cache may not be initialized in offline/test contexts; fallback behavior matches LiteLLM's process-local guard against missing state.
  - what: Session deduplication is recorded only on successful full scans; masked incremental results do not update the session cache, forcing a full rescan on the next request.
    why: When incremental masking fails to apply to skipped context, the full scan must include all messages, so session state from a partial scan would corrupt the next request.
out_of_scope:
  - "The filter_new_texts_for_session and mark_texts_scanned methods, which belong to the guardrail framework (U1) and are called from _apply_incremental_request_scan."
  - "Synthetic message and response constructors (ChatCompletionUserMessage, ModelResponse, Choices, Message) from the wire format crate, used to build scan inputs for response-type calls."
  - "HTTPException and ModifyResponseException construction, raised by upstream guardrail execution and re-raised from apply_guardrail."
pitfalls:
  - "The incremental cache must check for None/missing proxy_logging_obj at import time because it may be initialized after the guardrail, so a try/except block with a fallback is required."
  - "Masked output detection iterates both 'output' and 'outputs' fields; early return on first match avoids unnecessary field lookups when masking is found."
  - "_apply_incremental_request_scan returns None (not None inputs) to signal that the caller must retry with a full scan; an empty new_texts list returns inputs (skip call but no retry)."
  - "Bedrock response extraction uses get(field) or [] to handle missing fields without panicking; items may be non-dict types, so isinstance checks are required."
  - "Synthetic response construction for OUTPUT scans must map each filtered message to a choice with ascending index and stop finish_reason, matching Bedrock's response structure."
  - "The _select_messages_for_apply_guardrail call must receive the exact same inputs and texts lists that will be written back; mismatches between filtered_messages and scanned_slice positions cause masking write-back to skip silently."
  - "Exception handling must re-raise HTTPException and ModifyResponseException before the generic catch-all, or the caller loses the ability to return the correct HTTP status code."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
