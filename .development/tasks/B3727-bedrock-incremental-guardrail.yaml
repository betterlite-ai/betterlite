id: B3727
title: Bedrock incremental and unified guardrail application
description: >-
  Build session-deduplicated request scanning and generic text-batch guardrail application
  with selective masking. Implement `_incremental_scan_cache`, `_bedrock_response_has_masked_output`,
  `_apply_incremental_request_scan`, and `apply_guardrail` as methods on the `BedrockGuardrail`
  struct. When incremental mode is active, the cache tracks which message segments a session
  has already scanned by session_id and message hash. A masked incremental result forces a
  full-context rescan without recording session progress, while absent or newly empty content
  skips the scan entirely. The generic `apply_guardrail` method accepts a batch of texts and
  applies the guardrail through the ApplyGuardrail request, handling both INPUT (request)
  and OUTPUT (response) scan types. Bedrock errors are propagated and rewritten for the proxy;
  guardrail blocks raise exceptions that preserve the correct HTTP status. The incremental
  cache uses the shared proxy cache when available, falling back to a process-local DualCache
  singleton in test/offline contexts.
scope:
  paths:
    - crates/betterlite-guardrails/src/bedrock_incremental_guardrail.rs
    - crates/betterlite-guardrails/src/bedrock_incremental_guardrail/**
  lint_tables: false
references:
