deviations: []
out_of_scope:
- Decoding a provider's raw chunk, `_dispatch_provider_chunk`, `chunk_creator` and the `handle_*` methods are B5653.
- "`__next__`, `__anext__`, `__init__`, closing, logging and caching are B5654."
- The Python classes a caller holds are B5657, and the iterator face is B158.
pitfalls:
- '`raise_on_model_repetition` needs two chunks in `chunks`, skips ones with no choices, and resets the count to 1 when content is None or has length 2 or less.'
- The hidden params merge order is caller values, then `custom_llm_provider` and `created_at`, then the wrapper's base values, so the base wins.
- The `delta` of a usage-only chunk is empty, so check `usage` before the empty check or the last usage is lost.
- '`finish_reason_handler` prefers `received_finish_reason`, then `intermittent_finish_reason`, then `stop`, and only a plain `stop` turns into `tool_calls`.'
- In `resolve_provider_reported_cost` a bool gives None even though Python counts it as a number, and a dict uses its `total_cost`.
review_level: standard
budget:
