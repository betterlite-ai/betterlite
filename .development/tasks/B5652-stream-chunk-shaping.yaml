dod:
- text: A created chunk keeps one id, created time and system fingerprint across the stream, with hidden params merged in LiteLLM's order.
  proof: [chunk-creation, oracle, helper-python]
- text: The non-empty check keeps a chunk with content, tool calls, function calls, reasoning, audio or provider fields, and drops an empty one.
  proof: [non-empty, oracle, helper-python]
- text: The send decision strips repeated roles, holds and flushes held text, keeps usage after a finish reason and sends one last chunk with the mapped reason.
  proof: [processed-chunk, oracle, helper-python]
- text: Reasoning merges into content between `<think>` and `</think>` only when the option is on.
  proof: [thinking-merge, oracle, helper-python]
- text: The repetition guard raises at the limit with LiteLLM's message, and short or empty content restarts the count.
  proof: [repetition, oracle, helper-python]
- text: Sagemaker chunks hold back a partial special token, and other providers pass through.
  proof: [special-tokens, oracle, helper-python]
- text: Finish reason falls back to `stop`, turns into `tool_calls` after a tool call and maps unknown values with a warning.
  proof: [finish-reason, oracle, helper-python]
- text: Total usage keeps LiteLLM's rule across chunks, with cache fields filled in and provider cost copied to hidden params.
  proof: [usage-totals, oracle, helper-python]
- text: Generic chunks and SSE data lines convert as in LiteLLM.
  proof: [generic-chunks, sse-data, oracle, helper-python]
- text: Provider hidden params and the served service tier land on the chunk.
  proof: [hidden-params, oracle, helper-python]
- text: Shaping seeds added to the helper corpus parse and replay, one per helper family.
  proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
  - id: chunk-creation
    why: Chunks of one stream differ in id or hidden params.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::creator_/)'
  - id: non-empty
    why: A chunk with real data is dropped.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::non_empty_/)'
  - id: processed-chunk
    why: The caller sees a repeated role, a lost finish reason or no final chunk.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::processed_/)'
  - id: thinking-merge
    why: Think tags open twice or never close.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::thinking_/)'
  - id: repetition
    why: A stuck model streams forever, or a real repeat fails.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::repetition_/)'
  - id: special-tokens
    why: Template tokens reach the caller.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::special_tokens_/)'
  - id: finish-reason
    why: Tool calls end with `stop`.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::finish_reason_/)'
  - id: usage-totals
    why: Stream usage or cost differs from LiteLLM.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::usage_/)'
  - id: generic-chunks
    why: A custom provider's chunk is refused or misread.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::generic_/)'
  - id: sse-data
    why: A `data:` prefix reaches the JSON parser.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::sse_/)'
  - id: hidden-params
    why: The response model or service tier gets lost.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^stream_chunk_shaping::tests::hidden_/)'
  - id: helper-python
    why: This proves a real b5652 adapter exists and type checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5652)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5652 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5652/pyrightconfig.json
  - id: helper-case-corpus
    why: Parsing seeds for b5652 have to replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/stream_chunk_shaping-*")" && grep -lE '^[[:space:]]+b5652:' tools/oracle/fuzz/corpus/helper_case/stream_chunk_shaping-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
