id: B5652
title: Stream chunk shaping
description: >-
  `CustomStreamWrapper` in litellm_core_utils/streaming_handler.py is one large class that turns provider chunks into the
  chunks a caller sees. This task builds the part of it that needs no provider and no IO: the chunk types, the per-stream
  state and the rules that decide what a chunk looks like and whether it is sent at all. B5653 feeds it decoded provider
  data and B5654 drives it.


  In betterlite-streaming add `stream_chunk_shaping`. `StreamChunk` is the Rust form of `ModelResponseStream`: `id`,
  `object`, `created`, `model`, `system_fingerprint`, `choices`, `usage`, `provider_specific_fields`, and `hidden_params` as
  a `serde_json::Map`. `StreamChoice` holds `index`, `delta`, `finish_reason` and `logprobs`. `StreamDelta` holds `content`,
  `role`, `function_call`, `tool_calls`, `audio`, `images`, `annotations`, `reasoning_content`, `thinking_blocks` and
  `provider_specific_fields`. Any field a provider sends beyond these stays in an `extra` map, since the caller sees it.
  `ChunkShaper` holds what the wrapper keeps on `self`: `sent_first_chunk`, `sent_last_chunk`, `holding_chunk`,
  `response_uptil_now`, `received_finish_reason`, `intermittent_finish_reason`, `tool_call`, `chunks`, the response id, the
  model, the provider and `merge_reasoning_content_in_choices`.


  Build these on it, with LiteLLM's method name in snake case without the leading underscore:
  `model_response_creator` (L727-L778), `is_delta_empty` (L780), `set_model_id` (L786-L802),
  `copy_model_response_level_provider_specific_fields` (L804-L817), `is_chunk_non_empty` (L819-L866), `strip_role_from_delta`
  (L868-L880), the special delta helpers (L882-L943), `return_processed_chunk_logic` (L945-L1065),
  `optional_combine_thinking_block_in_choices` (L1067-L1101), `check_special_tokens` (L480-L513),
  `raise_on_model_repetition` (L440-L478), `check_is_function_call` (L414-L423), `check_send_stream_usage` (L411),
  `finish_reason_handler` (L1715-L1728), `record_usage_only_chunk` (L1730-L1738), `resolve_provider_reported_cost`
  (L1741-L1752) and `propagate_usage_cost_to_hidden_params` (L1755-L1766). `set_model_id`, `is_chunk_non_empty` and the rest
  take the chunk as an argument and hold no IO, so a helper case can call each one.


  The module-level pieces go here too: `stamp_served_service_tier` (L75), `provider_response_model` (L171),
  `parsed_provider_hidden_params` (L176), `provider_hidden_params` (L185), `strip_sse_data_from_chunk` (L2328-L2361),
  `cache_token_count` (L2364), `backfill_missing_cache_usage_fields` (L2372-L2390), `coerce_token_details` (L2396),
  `calculate_total_usage` (L2407-L2458), `generic_chunk_has_all_required_fields` (L2461) and
  `convert_generic_chunk_to_model_response_stream` (L2471-L2494).


  The two limits arrive as arguments and not from a global: `repeated_chunk_limit` (`REPEATED_STREAMING_CHUNK_LIMIT`) and
  the list of usage cost providers (`_USAGE_COST_HEADER_PROVIDERS`). Errors are one `StreamShapeError` with the fields the
  mapped exception needs: `raise_on_model_repetition` gives "The model is repeating the same chunk = {last_content}." with
  empty model and provider, as an internal server error. A small `mapped_finish_reason` table sits in this module and is
  ported from `_FINISH_REASON_MAP` in litellm_core_utils/core_helpers.py L253-L258: an unknown value logs "Unmapped
  finish_reason '%s', defaulting to 'stop'" at warning level and gives `stop`. betterlite-openai has the same table as
  `pub(crate)`, and this crate doesn't depend on that one.


  Test names sit in `stream_chunk_shaping::tests` and start with `creator_`, `non_empty_`, `processed_`, `thinking_`,
  `repetition_`, `special_tokens_`, `finish_reason_`, `usage_`, `generic_`, `sse_` and `hidden_`.
