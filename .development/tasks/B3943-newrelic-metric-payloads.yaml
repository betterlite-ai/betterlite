deviations:
  - what: Remaining budget is computed as max_budget - spend - cost without clamping to zero or any minimum.
    why: LiteLLM's NewRelicMetricsLogger._team_budget_metrics preserves the unclamped calculation; a negative remaining budget is visible and actionable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L158
out_of_scope:
  - Metric API delivery, retries, gzip compression and queue management (B3944 owns NewRelicMetricsLogger and its flush/drain state machine).
  - NEWRELIC_METRICS_MAX_BATCH_SIZE, NEWRELIC_METRICS_MAX_RETRY_QUEUE_SIZE and NEWRELIC_METRICS_MAX_DRAIN_PASSES constants (B3944 owns these delivery limits).
  - NewRelicMetricsLogger.__init__ and all delivery methods (B3944 owns the logger class and its batch/drain logic).
pitfalls:
  - "Region strings are lowercased before lookup; the endpoint table keys are lowercase 'us' and 'eu'."
  - "Team ID and alias extraction uses a specific preference order: user_api_key_team_id/team_id for ID, and user_api_key_team_alias/team_alias for alias."
  - "Status defaults to \"success\" (string), not an enum variant; convert using str()."
  - "Duration is milliseconds (response_time is seconds); convert with * 1000.0 and keep as float."
  - "Attribute values must be truncated at 255 characters; use value[:255] on strings."
  - "Empty attribute values (empty strings) are omitted, not included with empty values."
  - "Team budget gauges appear only when team_max_budget is not None; records without budget metadata produce no gauge metrics."
  - "Remaining budget is unclamped: team_max_budget - team_spend - response_cost, even if negative."
  - "Interval.ms must have a floor of 1 millisecond; use max(1, int((now - window_start) * 1000))."
  - "Bucket order is stable via insertion order; use dict.fromkeys to preserve first-seen order across multiple identical bucket keys."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
