    why: Region endpoint table (US/EU) and default region constant.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/newrelic.py#L41-L52
    why: Metric API attribute limit (255 chars), metric name constants for requests, cost, tokens and budget gauges.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/newrelic.py#L55-L132
    why: TypedDict definitions for summary values, count/gauge/summary metrics, metric envelope and NewRelicMetricRecord with bucket_key property.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L73-L85
    why: resolve_newrelic_metric_endpoint with region lowercasing, unknown-region warning, and US fallback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L87-L108
    why: _metric_record_from_payload extracting fields from StandardLoggingPayload metadata and root, with defaults.
