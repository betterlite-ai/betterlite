    why: _bucket_metrics creating count metrics and summary metric per aggregated bucket with 255-char attribute truncation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L149-L167
    why: _team_budget_gauges computing max_budget and remaining_budget from latest record, emitting only when team_max_budget is present.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L169-L174
    why: _team_budget_metrics selecting latest record per team and collecting gauges from each.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L176-L194
    why: build_metric_payload assembling one envelope with timestamp (ms), interval.ms (actual window, 1ms floor), bucket metrics and team gauges.
dod:
  - text: Region resolution selects the correct endpoint for 'us' and 'eu', logs unknown-region warning with supported list, falls back to us on unknown or None, and never accepts arbitrary URLs.
    proof: [region-resolution-tests]
  - text: Metric records extract team_id, team_alias, model_group, model, custom_llm_provider, status, response_cost, prompt_tokens, completion_tokens, total_tokens, duration_ms from StandardLoggingPayload with empty-string defaults.
    proof: [metric-record-tests, oracle]
  - text: Bucket aggregation creates count metrics for requests, cost_usd, prompt_tokens, completion_tokens, total_tokens and one duration summary with min/max/sum/count over all records in the bucket.
    proof: [bucket-aggregation-tests, oracle]
  - text: Team budget gauges are included once per team from the latest record in the batch, omitted if team_max_budget is None, and remaining_budget is unclamped (team_max_budget - team_spend - response_cost).
    proof: [budget-gauge-tests, oracle]
  - text: Attributes are truncated to 255 characters; empty values (team_id and team_alias both empty) are omitted entirely from the map.
    proof: [attribute-truncation-tests, oracle]
  - text: Bucket order is stable and preserves first-seen order (dict.fromkeys maintains order in Rust iteration).
    proof: [bucket-order-tests]
  - text: Interval.ms is computed as max(1, ceil((now - window_start) * 1000)) at flush time, and timestamp uses window_start * 1000 milliseconds since epoch.
    proof: [envelope-timing-tests, oracle]
checks:
  optional: [mutants]
  commands:
    - id: region-resolution-tests
      why: Region resolution falls back incorrectly or accepts invalid endpoints.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::region_resolution(::|$)/)'
    - id: metric-record-tests
      why: Records fail to extract from payloads or apply wrong defaults.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::metric_record(::|$)/)'
    - id: bucket-aggregation-tests
      why: Aggregation fails to count, sum or compute summaries over buckets.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::bucket_aggregation(::|$)/)'
    - id: budget-gauge-tests
      why: Budget gauges omit teams, use wrong latest record, or clamp remaining budget.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::budget_gauges(::|$)/)'
    - id: attribute-truncation-tests
      why: Attributes are not truncated or empty attributes are included.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::attribute_truncation(::|$)/)'
    - id: bucket-order-tests
      why: Bucket order changes or does not match first-seen order.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::bucket_order(::|$)/)'
    - id: envelope-timing-tests
      why: Interval or timestamp computation is wrong or interval never reaches minimum 1ms.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::envelope_timing(::|$)/)'
