id: B3943
title: New Relic team metric records and aggregation
description: >-
  Build typed team metric records and aggregate per-request counts, duration summaries
  and per-team budget gauges into a Metric API envelope. Resolve newrelic_region to a fixed
  region-specific endpoint table (us: https://metric-api.newrelic.com/metric/v1, eu: https://metric-api.eu.newrelic.com/metric/v1);
  unknown regions log a warning, list supported regions and fall back to us. The metric
  payload contains one envelope aggregating records by (team_id, team_alias, model_group, model,
  custom_llm_provider, status) into one count metric per counter field (requests, cost_usd,
  prompt_tokens, completion_tokens, total_tokens) plus one duration summary metric with
  count/sum/min/max. Team budget gauges (max_budget and remaining_budget) are added once per team,
  taken from the team's latest record in the batch. Remaining budget is team_max_budget minus
  team_spend minus response_cost, never clamped. Attribute values are truncated to 255 characters.
  Interval is computed at flush time as max(1, ceil((now - window_start) * 1000)) milliseconds,
  so the flush window is the real interval seen by the client. Empty attributes (all-empty team id/alias)
  are omitted from the attributes map. Bucket order is stable: first-seen order is preserved by
  iterating bucket_key in the order they first appeared in the record sequence. All money remains Decimal.

  Region resolution is a pure function with no config file read: it takes a region string parameter
  (case-insensitive, from a per-request credential value or config injection), maps lowercase strings
  to the fixed endpoint table, warns on unknown regions listing supported options, and falls back to
  the US endpoint.
scope:
  paths:
    - crates/betterlite-logging/src/newrelic_metrics.rs
    - crates/betterlite-logging/src/newrelic_metrics/**
    - tools/oracle/cases/logging/newrelic-metrics/**
    - Cargo.toml
    - deny.toml
    - tools/oracle/helpers/b3943.py
    - tools/oracle/helpers/b3943/**
    - tools/oracle/src/helpers/logging/b3943.rs
    - tools/oracle/src/helpers/logging/b3943/**
  lint_tables: false
