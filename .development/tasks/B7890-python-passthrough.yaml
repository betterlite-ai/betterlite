dod:
- text: Every function keeps LiteLLM's name and parameters, and a keyword LiteLLM refuses is refused here.
  proof: [passthrough-signature]
- text: "A passthrough call returns the same status, headers and body as LiteLLM against one local server, a stream gives the same bytes, and the helpers give the same output for the same input."
  proof: [passthrough-calls]
- text: A provider error keeps its class and cause, and an unsupported Python object raises `UnsupportedCallArgument`.
  proof: [passthrough-errors]
- text: The native register function and conversion have tests without an interpreter.
  proof: [passthrough-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: passthrough-signature
    why: A caller's keyword is accepted or refused wrongly.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_passthrough.py -k signature
  - id: passthrough-calls
    why: A result differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_passthrough.py -k calls
  - id: passthrough-errors
    why: An error class or message changes.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_passthrough.py -k 'error or unsupported'
  - id: passthrough-native
    why: A field changes on the way.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^passthrough_calls::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Strict typing has to hold for these calls.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: The return value is a betterlite `PassthroughResponse` and not an `httpx.Response`.
  why: The wheel does not depend on httpx. The attributes callers use (`status_code`, `headers`, `content`, `text`, `json()`, `raise_for_status()`) are the same.
- what: This task has no helper oracle cases.
  why: The functions call a native session, so pytest compares both packages against one local server.
out_of_scope:
- "Provider execution, policies and the stream relay belong to B3571 and B3572."
- "The proxy-side pass-through routes are not part of this entry."
pitfalls:
- "`json` is a keyword and shadows the module name inside the function, so do not import `json` at that scope."
- "`forward_headers_from_request` drops hop-by-hop headers, and the list is owned by Rust (B3571)."
- "The async route sets `kwargs[\"allm_passthrough_route\"]` before it resolves the provider, and Rust does the same."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
