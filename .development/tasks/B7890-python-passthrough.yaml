id: B7890
title: Python passthrough routes, helpers and timeouts
description: >-
  This task adds the passthrough functions: `llm_passthrough_route` and `allm_passthrough_route` (litellm/passthrough/main.py), `BasePassthroughUtils.get_merged_query_parameters`, `forward_headers_from_request` and `CommonUtils.encode_bedrock_runtime_modelid_arn` (passthrough/utils.py), and `resolve_pass_through_request_timeout` and `resolve_llm_passthrough_timeout` (passthrough/timeout_utils.py). Rust runs them (B3571 header, query and timeout policies, B3572 the stream relay).


  Native side, the family `passthrough_calls`: `src/passthrough_calls.rs` with `register` that adds `NativePassthroughSession`, `NativePassthroughStream` and `NativePassthroughError`, and `src/passthrough_calls/convert.rs` with tests `request_*` and `error_*`. The architect writes the `lib.rs` line.


  Python side, `python/betterlite/passthrough/main.py`, `utils.py`, `timeout_utils.py` and `__init__.py`. `llm_passthrough_route(*, method, endpoint, model, custom_llm_provider, api_base, api_key, request_query_params, request_headers, content, data, files, json, params, cookies, client, **kwargs)` returns a `PassthroughResponse` with `status_code`, `headers` and `content`/`text`/`json()`, or a stream of bytes when the upstream answers with a stream. The async function gives an async iterator of bytes and the sync function a plain iterator. `content`, `data`, `files`, `json`, `params` and `cookies` are converted to plain JSON or bytes before the native call. Python objects that cannot cross to Rust (`client`, `shared_session`) raise `UnsupportedCallArgument` from B158.
