deviations: []
out_of_scope:
  - "The handlers and their per-resolver route functions: B3096, B3097 and B3098. The cache activity handler: B3099."
  - "The resolvers, their prefixes, tags and operation names: B3094 and B3095."
  - "The other spend routes, layers and production adapters: B8661 merges the user agent analytics routes (B3100, B3101), GET /gateway/daily/activity (B3102) and GET /agent/daily/activity (B4787) after this one in app/spend.rs; B8662 merges B069's spend report and spend log routes; B8660 passes the budget services to the auth slots and the reservation call; the edge part (B8680) installs B8270's release layer. This task mounts only daily_activity_router::routes()."
pitfalls:
  - "The customer resolver has two prefixes; /end_user is the same handler set as /customer, registered once per prefix, never merged into /customer."
  - "cache_leakage_keys is added after export and only for the user entity; adding it for team gives a route LiteLLM does not have."
  - "B3099's route belongs to analytics_router, not to the daily activity router, so add it once after the loop and not per resolver."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
