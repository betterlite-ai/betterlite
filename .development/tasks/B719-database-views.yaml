dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: joined_token_view, concurrent_create_race,
      view_privilege_warning, postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The offline admin command invokes the native operation and preserves its exit/error contract.
    proof:
      - admin-tests
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_views::tests::/)
        - test(/replays_the_/)'
    - id: admin-tests
      why: The offline command does not dispatch the named native operation or reject bad arguments.
      run: cargo nextest run --locked -p betterlite-db-admin --no-tests=fail -E 'test(/^database_views::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_views::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_views::tests::postgres_failure_effects$/)'
oracle_cases: []
deviations: []
