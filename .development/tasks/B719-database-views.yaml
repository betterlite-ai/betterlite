id: B719
title: Runtime and offline compatibility views
description: >-
  Build betterlite-db::database_views from litellm/proxy/db/create_views.py and the offline
  db_scripts/create_views.py operation. Own SupportsExecuteRaw/SupportsRawQueries contracts,
  create_view_tolerating_race, create_missing_views, should_create_missing_views and the offline
  check_view_exists. The runtime bootstrap caller in B124 owns its separate required-view repair,
  DATABASE_SCHEMA selection and missing-usage-view warning; this service has no privilege-warning
  fallback. Database errors not explicitly tolerated below propagate to that caller.

  Runtime creation probes SELECT 1 FROM the quoted relation LIMIT 1, in this order:
  LiteLLM_VerificationTokenView, MonthlyGlobalSpend, Last30dKeysBySpend, Last30dModelsBySpend,
  MonthlyGlobalSpendPerKey, MonthlyGlobalSpendPerUserPerKey, DailyTagSpend,
  Last30dTopEndUsersSpend. A successful probe, including zero rows, logs '<name> Exists!' and
  leaves the existing definition alone; even a same-named table satisfies the probe. On errors,
  lowercase the message and attempt CREATE only if it contains 'does not exist', 'no such table'
  or 'undefined table'. Bare 'undefined', undefined-function/column errors, permission denial and
  connection failures propagate. The predicate is the source's message containment, not an
  invented single-SQLSTATE allowlist. Use the native error's server message without a new decoder.

  The race-tolerant CREATE helper executes the supplied compiled DDL, logs '<name> Created!' on
  success, and treats lowercased error messages containing 'already exists', 'duplicate object'
  or 'duplicate table' as success with '<name> already created by a concurrent replica'. It does
  not re-probe or validate the winner's definition. Other errors stop the sequence; earlier successful
  view creations remain committed. Cancellation is not converted into successful creation.

  The runtime verification view uses v.* from LiteLLM_VerificationToken, LEFT JOINs TeamTable on
  team_id and ProjectTable on project_id, and adds team_spend, team_max_budget,
  team_model_max_budget, team_tpm_limit, team_rpm_limit, team_tpd_limit and project_alias. Preserve
  tokens with missing/null team/project and SQL NULL joined fields. Its CREATE has no OR REPLACE.
  The offline verification view is older: v.* plus only team_spend, team_max_budget, team_tpm_limit
  and team_rpm_limit, with the team LEFT JOIN and no project join. Do not silently upgrade that
  projection or change an existing offline-created view during the runtime existence probe.

  Both modes share the remaining seven definitions. MonthlyGlobalSpend groups DATE(startTime)
  as date and SUM(spend) as spend. MonthlyGlobalSpendPerKey adds api_key to output and grouping;
  MonthlyGlobalSpendPerUserPerKey also adds quoted "user". These use the inclusive lower bound
  startTime >= CURRENT_DATE - INTERVAL '30 days', not the calendar month or a rolling 720-hour
  instant; there is no upper bound, so future records count. Preserve database session timezone,
  SUM/null behavior, negative spend and absence of implicit sorting. Last30dKeysBySpend LEFT JOINs
  api_key to token, groups by api_key/key_alias/key_name, emits total_spend descending and retains
  deleted keys with NULL aliases. Last30dModelsBySpend groups by model with the same date bound,
  excluding model='' and SQL NULL, emits total_spend descending with no arbitrary limit.

  DailyTagSpend has no time filter: jsonb_array_elements_text(request_tags) creates one row per
  occurrence, grouped as individual_request_tag with DATE(startTime) as spend_date, COUNT(*) as
  log_count and SUM(spend) as total_spend. Duplicate tags multiply count/spend; empty arrays produce
  no rows, SQL NULL produces none, and a JSON scalar/object can make a later SELECT fail. These
  six aggregate views use CREATE OR REPLACE only after a failed existence probe.

  Last30dTopEndUsersSpend emits end_user, COUNT(*) total_events and SUM(spend) total_spend,
  groups end_user, orders total_spend descending and limits 100 without a secondary tie-breaker.
  Apply the same inclusive date bound and end_user <> '' AND end_user <> user. The unquoted
  PostgreSQL user keyword is the current database user, not the SpendLogs column named "user";
  preserve this distinction with independently seeded values. NULL end_user is excluded. This
  definition uses CREATE VIEW, not OR REPLACE. Do not encrypt, hash or normalize any projected key.

  should_create_missing_views queries pg_class.reltuples::BIGINT for the unqualified quoted
  LiteLLM_SpendLogs regclass and logs 'Estimated Row count of LiteLLM_SpendLogs = ...'. Return true
  only for a nonempty list with a first dict containing non-NULL reltuples equal to 0 or -1,
  then debug 'Should create views'. Empty result, wrong shape, missing/null/other estimate returns
  false; a missing relation or query failure propagates. This is a statistics estimate, never
  SELECT COUNT(*): unanalysed nonempty tables may still return -1. The helper itself does not
  check existing views or read DATABASE_SCHEMA.

  Expose the offline operation through betterlite-db-admin's database-views command using B710
  connection settings. Its Prisma transport timeout literal is 60000 seconds; retain that command
  deadline with a native connection instead of assuming milliseconds. Connect first, then probe
  the same eight names. Unlike runtime bootstrap, any ordinary probe exception attempts CREATE,
  and offline CREATE has no race-tolerant catch. Print '<name> Exists!' or '<name> Created!' to
  stdout after each successful step. A failed CREATE aborts, prints no Created line for that view,
  leaves prior views committed and exits nonzero; the script does not wrap the batch in a transaction.
  Normal completion exits zero. Reject unknown CLI arguments before connecting. Reuse compiled
  aggregate SQL between the two modes while retaining their verification projection/error differences.

  B860 Postgres tests use POSTGRES_TEST_URL or testcontainers, with no skipped database checks.
  Seed times relative to the database CURRENT_DATE, deleted joins, duplicate tags, negative spend,
  current-user/end-user differences and 101 distinct end users; compare exact rows and catalog
  column lists. Force real permission, missing-table and concurrent-create failures. These functions
  perform database effects, so they are not HelperCase operations and introduce no byte parser.

  The two sources contain about 397 nonblank noncomment lines, mostly repeated SQL. Reusing the
  seven identical aggregate definitions reduces native production to about 240 lines; allow 360
  Postgres/unit tests, 75 CLI/tests and 35 wiring, 710 within 800. Count production SQL and keep
  view definitions, runtime control flow and offline dispatch in separate modules below 300 lines.
scope:
  paths:
    - crates/betterlite-db/src/database_views.rs
    - crates/betterlite-db/src/database_views/**
    - crates/betterlite-db/Cargo.toml
    - Cargo.toml
    - tools/betterlite-db-admin/Cargo.toml
    - tools/betterlite-db-admin/src/main.rs
    - tools/betterlite-db-admin/src/commands.rs
    - tools/betterlite-db-admin/src/database_views.rs
    - tools/betterlite-db-admin/src/database_views/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/create_views.py#L7-L46
    why: Database protocols and the exact case-insensitive message-marker predicates.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/create_views.py#L49-L248
    why: Runtime view order, columns, joins, date bounds, tag expansion and unquoted user keyword.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/create_views.py#L251-L279
    why: Statistics-estimate query, row-shape checks and the two accepted estimates.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/db_scripts/create_views.py#L11-L207
    why: Offline timeout, older verification projection, broad probe catch and stdout behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L4642-L4729
    why: B124's caller owns required-view repair, DATABASE_SCHEMA and usage-tab warnings, not this service.
dod:
  - text: 'Runtime tests name view_probe_order, empty_existing_relation_is_kept,
      same_named_table_is_not_replaced, missing_message_markers_case_insensitive,
      undefined_function_and_column_not_missing, privilege_error_propagates,
      duplicate_message_markers_tolerated_without_reprobe, other_create_error_stops_sequence,
      cancelled_create_is_not_success, postgres_concurrent_create_race and
      postgres_failed_create_preserves_previous_views. Check exact per-view debug messages.'
    proof: [behavior-tests, postgres-tests]
  - text: 'SQL cases name postgres_runtime_and_offline_verification_columns,
      left_joins_keep_missing_team_project_and_key, inclusive_thirty_day_midnight,
      future_and_negative_spend_included, monthly_views_group_by_exact_dimensions,
      models_exclude_empty_and_null, keys_group_alias_and_name,
      tags_all_dates_and_duplicate_occurrences, tags_empty_null_and_scalar,
      end_users_compare_database_user_not_row_user and end_users_descending_top_hundred.
      Test each aggregate view independently rather than only counting the eight objects.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Estimate cases name zero_and_minus_one_enable_bootstrap, positive_estimate_disables,
      missing_null_and_malformed_estimate_disable, estimate_error_propagates and
      unanalysed_nonempty_table_can_enable. Offline tests name dispatches_native_operation,
      rejects_bad_arguments, offline_timeout_sixty_thousand_seconds,
      offline_probe_error_still_attempts_create, offline_duplicate_create_is_fatal,
      offline_stdout_order_and_exit_status and offline_views_are_not_runtime_upgraded.'
    proof: [behavior-tests, admin-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: View contents, bootstrap eligibility and distinct runtime/offline failures need domain assertions.
      run: cargo nextest run --locked -p betterlite-db -p betterlite-db-admin --no-tests=fail -E 'test(/^database_views::tests::/)'
    - id: admin-tests
      why: The command must actually dispatch and reject bad arguments before database connection.
      run: cargo nextest run --locked -p betterlite-db-admin --no-tests=fail -E 'test(/database_views::tests::dispatches_native_operation$/)' && cargo nextest run --locked -p betterlite-db-admin --no-tests=fail -E 'test(/database_views::tests::rejects_bad_arguments$/)'
    - id: postgres-tests
      why: Projections, concurrent creation and partial progress must be checked against Postgres itself.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_views::tests::postgres_runtime_and_offline_verification_columns$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_views::tests::postgres_concurrent_create_race$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_views::tests::postgres_failed_create_preserves_previous_views$/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B874 owns parse_csv_value and migrate_verification_tokens in db_scripts/migrate_keys.py and
    apply_db_fixes in db_scripts/update_unassigned_teams.py.
  - B124 owns PrismaClient.check_view_exists in proxy/utils.py, including its different required-view
    repair projection, DATABASE_SCHEMA default public, health check and missing-usage-view warning.
pitfalls:
  - Last30dTopEndUsersSpend compares end_user with PostgreSQL's current user because user is unquoted.
  - Runtime bootstrap accepts an existing offline verification view without adding its missing columns.
  - DailyTagSpend has no thirty-day bound and counts repeated tags more than once per request.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: standard
