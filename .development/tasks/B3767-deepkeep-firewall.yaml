id: B3767
title: DeepKeep firewall evaluation
description: >-
  Implement DeepKeep AI Firewall guardrail's API endpoint normalization, metadata extraction and merging,
  fixed firewall identity, HTTP POST transport to the normalized endpoint, BLOCKED action enforcement, and
  replacement semantics where empty returned arrays replace originals. Fail-open behavior applies only when
  the upstream service is unreachable (connection failures, timeouts, or HTTP 502/503/504 status codes).
  Dynamic parameters must not override the configured firewall_id.


  Configuration carries: `api_key` (required, reads DEEPKEEP_API_KEY), `api_base` (required, reads
  DEEPKEEP_API_BASE, normalized to end with /v3/openai/beta/litellm_basic_guardrail_api), `deepkeep_firewall_id`
  (required, reads DEEPKEEP_FIREWALL_ID), `unreachable_fallback` (nested under optional_params, fail_open or
  fail_closed, default fail_closed), and `extra_headers` (optional, mapping of header name to value; list form
  is rejected with a warning). HTTP headers include Content-Type (application/json), X-API-Key (api_key value),
  plus any extra_headers.


  Metadata extraction merges litellm_metadata and metadata dicts, extracting user_api_key_* fields
  (hash, alias, user_id, user_email, team_id, team_alias, end_user_id, org_id) and treating user_api_key_token
  as an alias for user_api_key_hash when the hash is not explicitly provided. The request payload carries
  texts, images, tools, tool_calls, structured_messages, the merged user metadata, litellm_version, model,
  input_type, litellm_call_id, litellm_trace_id and fixed firewall_id that cannot be overridden by dynamic parameters.
  The additional_provider_specific_params field merges the fixed firewall_id with any dynamic extra_body parameters
  from get_guardrail_dynamic_request_body_params, filtering out firewall_id from the dynamic merge so it cannot override
  the configured identity.


  Response action == BLOCKED raises GuardrailRaisedException with blocked_reason or default message.
  Return inputs merge original content with any guardrail-modified values (texts, images, tools, tool_calls,
  structured_messages) from the response, checking presence with `is not None` so that empty-list
  replacements are preserved and honored.  Supported event hooks are pre_call, post_call and during_call.

