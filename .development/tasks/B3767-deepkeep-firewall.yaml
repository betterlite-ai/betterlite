dod:
  - text: Endpoint normalization appends /v3/openai/beta/litellm_basic_guardrail_api to api_base if not already present,
      stripping trailing slashes to avoid duplication.
    proof: [oracle]
  - text: Firewall ID from configuration is passed to the API and cannot be overridden by dynamic parameters.
    proof: [deepkeep-tests]
  - text: Metadata extraction merges litellm_metadata and metadata dicts, extracting user_api_key_* fields and
      treating user_api_key_token as a fallback for user_api_key_hash when the hash is not present.
    proof: [deepkeep-tests]
  - text: Request payload carries all required fields including texts, images, tools, tool_calls, structured_messages,
      merged user metadata, litellm_version, model, input_type, litellm_call_id, litellm_trace_id and fixed firewall_id.
      The additional_provider_specific_params field merges the fixed firewall_id with any dynamic extra_body parameters,
      filtering out firewall_id from the dynamic merge.
    proof: [oracle]
  - text: BLOCKED action raises GuardrailRaisedException with blocked_reason or default error message.
    proof: [oracle]
  - text: Non-BLOCKED actions return inputs with original content or guardrail-modified values, preserving empty-list
      replacements (texts=[], images=[], etc.) when the guardrail returns them.
    proof: [deepkeep-tests]
  - text: Fail-open applies only when the service is unreachable (connection failures, timeouts, HTTP 502/503/504);
      other upstream errors such as 401 or 400 raise DeepKeepGuardrailAPIError with the HTTP status/error details.
    proof: [deepkeep-tests, oracle]
  - text: Configuration loads api_key (required, DEEPKEEP_API_KEY env), api_base (required, DEEPKEEP_API_BASE env),
      deepkeep_firewall_id (required, DEEPKEEP_FIREWALL_ID env), unreachable_fallback (optional, nested under optional_params,
      default fail_closed) and extra_headers (optional mapping; list form is rejected with a warning).
    proof: [deepkeep-tests, config-load]
