deviations:
  - what: DeepKeep error messages use betterlite's own wording in failure scenarios, not LiteLLM's exact text.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status codes unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/deepkeep/deepkeep.py#L260-L280
  - what: Extra headers passed as a list instead of a mapping are rejected with a warning and ignored, rather than raising an error.
    why: LiteLLM warns and ignores, preserving fail-open behavior on config misunderstandings.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/deepkeep/deepkeep.py#L156-L162
out_of_scope:
  - Lifecycle hook entry points (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook
    wrapper logic); B3664/B3665/B3666 (parts of B104) orchestrate when DeepKeep guardrails are invoked.
  - The threshold-based decision whether to run guardrail on a particular request (should_run_guardrail);
    B3664/B3665/B3666 (parts of B104) own that decision logic.
  - Other guardrail providers (AIM, Akto, Cisco, etc.); each gets its own task.
pitfalls:
  - >-
    Endpoint normalization must check if api_base already ends with the guardrail endpoint path to avoid duplication.
  - >-
    Firewall ID must be fixed from configuration and never overridden by dynamic parameters; filter out firewall_id
    from dynamic_params to ensure this.
  - >-
    Metadata extraction must check presence of user_api_key_hash before using user_api_key_token as a fallback;
    do not use token as the hash if hash is already present.
  - >-
    Empty-list replacements (e.g., texts: [], images: []) must be preserved when present and honored in the
    returned inputs, not treated as falsy and replaced with originals.
  - >-
    Fail-open applies only to connection failures (httpx.RequestError), timeouts (Timeout) and HTTP 502/503/504;
    other errors such as 401 or 400 raise DeepKeepGuardrailAPIError, not GuardrailRaisedException.
  - >-
    additional_provider_specific_params forwards every dynamic extra_body param from get_guardrail_dynamic_request_body_params
    (not just firewall_id), so a worker must not special-case or drop the other dynamic keys when building that merge.
  - >-
    DeepKeep API key must never be logged or shown in Debug output; mark the field as SecretString and use it only
    in the X-API-Key header.
  - >-
    Extra headers as a list (from litellm_params.extra_headers in gateway route config) must be rejected with a warning,
    not passed through or raise an error.
  - >-
    Response .json() must be called on the httpx response object; use a helper to extract the typed body.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
