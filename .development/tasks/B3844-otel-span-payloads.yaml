id: B3844
title: OTel inference and MCP payload projections
description: >-
  LiteLLM's OTel V2 logger builds one frozen record per span from the StandardLoggingPayload of a closed request, and its mappers only read those records. This task ports the records for an LLM call, an MCP tool call and an MCP tools/list call, plus the primitive attribute setter the vendor mappers write through. B3843 already gives `LLMRequestParams`, `LLMUsage`, `LLMCost`, `SpanError`, `ServerInfo` and the `helpers` module. B5240 gives `output_choices` and `finish_reasons`. Nothing calls the new records yet: B3852 wires them into the logger.


  `crates/betterlite-logging/src/otel/model/payloads/tool_definition.rs` holds `ToolDefinition { name: String, description: Option<String>, parameters_json: Option<String> }`, deriving `serde::Serialize`, and `extract_tools(model_parameters: &MetadataMap) -> Vec<ToolDefinition>`. It reads `tools` when that is a list, else `functions` when that is a list, else returns nothing. For each object entry, the function object is `entry["function"]` when that key exists and the entry itself when it doesn't. The function must be an object with a non-empty string `name`, and an entry that fails this is skipped. `description` is the string value. `parameters_json` is `serde_json::to_string` of `parameters` unless that is null.


  `payloads/llm_call.rs` holds `EmbeddingOutput { count: usize, dimensions: Option<usize> }`, deriving `serde::Serialize`, with `from_response(response: &MetadataMap) -> Option<Self>`. It looks at the object rows of `data`. No rows gives None. `count` is the number of rows, and `dimensions` is the length of the first row's `embedding` when that is an array and None otherwise (a base64 embedding is a string). LiteLLM's `as_json` gets no Rust method, because rule no-one-line-functions refuses it: B3845 runs `serde_json::to_string` on the struct and gets the same `{"count":..,"dimensions":..}` object.


  The same file holds `LLMCallOptions { capture_content: bool, time_to_first_chunk_seconds: Option<Decimal>, request_route: Option<String>, trace: TraceControls, session_id: Option<String> }`, deriving `Default`, and `LLMCallSpanData`. LiteLLM's factory takes six arguments and `clippy.toml` sets `too-many-arguments-threshold = 5`, so the options travel in that struct. `LLMCallSpanData` has these public fields: `operation: GenAIOperation`, `provider: String`, `request_model: String`, `response_model: Option<String>`, `response_id: Option<String>`, `request_params: LLMRequestParams`, `usage: LLMUsage`, `finish_reasons: Vec<String>`, `error: Option<SpanError>`, `response_cost: Option<Decimal>`, `server: Option<ServerInfo>`, `identity: RequestIdentity`, `is_streaming: Option<bool>`, `cost: LLMCost`, `tools: Vec<ToolDefinition>`, `messages_in: Vec<MetadataMap>`, `choices_out: Vec<MetadataMap>`, `system_fingerprint: Option<String>`, `time_to_first_chunk_seconds: Option<Decimal>`, `output_type: Option<GenAIOutputType>`, `call_type: Option<String>`, `request_route: Option<String>`, `trace: TraceControls`, `session_id: Option<String>`, `embedding_output: Option<EmbeddingOutput>`. It derives `Clone` and `Debug`.


  `LLMCallSpanData::from_standard_logging_payload(payload: &Payload, options: LLMCallOptions) -> Result<Self, MetadataError>` works like this. `RequestContext::from_standard_logging_payload(payload)?` gives `request_model`, `response_model`, `api_base` and `identity`. The payload converts once to a flat `MetadataMap` with `serde_json::from_value(serde_json::to_value(payload)?)?`, as `metadata/llm_call_event.rs` does, because `LLMUsage::from_payload` reads named `Payload` fields such as `prompt_tokens`. The response map is the `extra` of `Response::Object`, and an empty map for `Text`, `Items` and `Null`. `call_type` and `custom_llm_provider` are the string values, or "" when absent, passed to `resolve_operation`, `resolve_output_type` and `resolve_provider` from `otel::vocabulary::resolvers`. `response_id` and `system_fingerprint` are the response's `id` and `system_fingerprint` strings. `request_params` and `tools` both read the `model_parameters` object, or an empty map when it is absent. `usage` is `LLMUsage::from_payload`. `cost` is `LLMCost::from_breakdown` of the `cost_breakdown` object, or the default when it is absent. `error` is `SpanError::from_payload(&payload.extra)`. `response_cost` is `payload.response_cost`. `server` is `ServerInfo::from_api_base(context.api_base.as_deref())`. `is_streaming` is the bool `stream`. The `call_type` field keeps the text and is None when that text is empty. `request_route` is the option when non-empty, else `identity.request_route`. `session_id` is the option when non-empty, else None. `trace` and `time_to_first_chunk_seconds` come straight from the options.


  Content capture decides three fields. `finish_reasons` and `tools` are always filled, with `finish_reasons` read from `output_choices(response)`. With `capture_content` on, `messages_in` is `helpers::dicts` of `messages`, `choices_out` is that `output_choices` result, and `embedding_output` is `EmbeddingOutput::from_response(response)` when the operation is `GenAIOperation::Embeddings`. With it off, the two lists are empty and `embedding_output` is None.


  `payloads/mcp_call.rs` holds the MCP records. `MCPToolCallSpanData` has `operation: GenAIOperation`, `method: MCPMethod`, `tool_name: String`, `server_name: Option<String>`, `server_address: Option<String>`, `server_port: Option<u16>`, `session_id: Option<String>`, `arguments_json: Option<String>`, `result_json: Option<String>`, `error: Option<SpanError>`, `response_cost: Option<Decimal>`, `identity: RequestIdentity`. `from_standard_logging_payload(payload: &Payload, capture_content: bool) -> Result<Self, MetadataError>` reads the tool metadata from `payload.metadata.extra["mcp_tool_call_metadata"]`, an empty map unless that is an object. `method` is `MCPMethod::ToolsCall`, `operation` is `resolve_operation` of the call type, `tool_name` is `name` or "", `server_name` is `mcp_server_name` and `session_id` is `mcp_session_id`. With capture on and a value that isn't null, `arguments_json` and `result_json` are `helpers::json_or_none` of `arguments` and `result`. Otherwise they are None. `error`, `response_cost` and `identity` read as they do for an LLM call.


  `server_address` and `server_port` split `mcp_server_resource`, a redacted `scheme://host[:port]` origin, the way Python's `urlsplit` does. Write this by hand on the text instead of using `url::Url`, as `ServerInfo::from_api_base` does. An absent or empty value, or a value without `://`, gives no address and no port. The scheme is the text before `://`, lowercased. The authority is the text after it up to the first `/`, `?` or `#`, with everything through the last `@` removed. With a `[`, the host sits between the brackets and the port follows `]:`, and an unmatched bracket gives neither value. Without one, the host is the text before the first `:` and the port the text after it. The host is lowercased. An empty port text counts as no port. A port text that isn't all ASCII digits, or that falls outside 0 to 65535, gives neither value, and an empty host gives neither value. A missing port or port 0 takes the default of 443 for `https`, 80 for `http`, and None for any other scheme.


  `MCPListToolsSpanData` has `method: MCPMethod`, `session_id: Option<String>`, `error: Option<SpanError>`, `identity: RequestIdentity`, and `from_standard_logging_payload(payload: &Payload) -> Result<Self, MetadataError>`. `method` is `MCPMethod::ToolsList` and `session_id` is always None. LiteLLM's `capture_content` argument here is never read, so the Rust function doesn't take it.


  LiteLLM's `is_mcp_tool_call` and `is_mcp_list_tools` would be one-line functions, and rule no-one-line-functions refuses those. The logger only ever asks them in sequence (logger.py L340-L342). Build one `PayloadKind` enum instead, with variants `McpToolCall`, `McpListTools` and `Inference`, and `PayloadKind::from_payload(payload: &Payload) -> Self`. A non-empty tool metadata map or a `call_type` of `call_mcp_tool` gives `McpToolCall`. Failing that, a `call_type` of `list_mcp_tools` gives `McpListTools`. Anything else gives `Inference`.


  `crates/betterlite-logging/src/otel/span_attributes.rs` holds the setter. `primitive_value(value: &OtelModelValue) -> opentelemetry::Value` is LiteLLM's `cast_as_primitive_value_type`: null gives the empty string, a string or bool stays what it is, a number becomes `I64` when `Number::as_i64` holds it and `F64` otherwise, and an array or object becomes its `serde_json::to_string` text, or the empty string if that fails. `safe_set_attribute` is an extension trait, `SafeSetAttribute`, with one method `safe_set_attribute(&mut self, key: &str, value: &OtelModelValue)` and a blanket `impl<S: opentelemetry::trace::Span> SafeSetAttribute for S`. A trait implementation is exempt from rule no-one-line-functions, and the vendor mappers get the method call they expect. `LLMObsAttributes` is the Rust form of `BaseLLMObsOTELAttributes`: a trait with two associated functions that have empty default bodies, `set_messages<S: Span>(_span: &mut S, _kwargs: &MetadataMap)` and `set_response_output_messages<S: Span>(_span: &mut S, _response: &OtelModelValue)`. Tests read attributes back through `opentelemetry_sdk::trace::InMemorySpanExporter`, already available through the crate's `testing` feature.


  Tests sit in each module's `tests.rs`, declared with `#[path]` as in `payloads/server.rs`. The oracle adapter is operation `b3844`, with these tagged inputs: `{"function": "primitive_value", "value": ...}`, `{"function": "tools", "value": {...}}`, `{"function": "embedding_output", "value": {...}}`, `{"function": "llm_call", "payload": {...}, "capture_content": true, "time_to_first_chunk_seconds": 1.5, "request_route": "...", "session_id": "..."}` with the last three optional, `{"function": "mcp_tool_call", "payload": {...}, "capture_content": true}`, `{"function": "mcp_list_tools", "payload": {...}}` and `{"function": "payload_kind", "payload": {...}}`. Both adapters answer `{"result": ...}` with one plain JSON object per record and the same keys on both sides: the record's fields, with `usage` spelled out field by field as `tools/oracle/src/helpers/logging/b3843.rs` does, `identity` reduced to `call_id` and `request_route`, enums as their text, and `trace` left out. `payload_kind` answers `mcp_tool_call`, `mcp_list_tools` or `inference`, and the Python side asks `is_mcp_tool_call` first, then `is_mcp_list_tools`. Every case gets a fuzz seed of the same content at `tools/oracle/fuzz/corpus/helper_case/otel-span-payloads-<case>.yaml`.

