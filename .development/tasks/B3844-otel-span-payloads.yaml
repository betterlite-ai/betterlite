dod:
  - text: extract_tools reads tools, then functions, in both the wrapper and bare shapes, and skips unusable entries.
    proof: [tool-definitions, oracle, helper-python]
  - text: EmbeddingOutput counts the rows and reports dimensions from the first row only when it holds an array.
    proof: [embedding-output, oracle, helper-python]
  - text: LLMCallSpanData fills every metadata field from the payload as LiteLLM does.
    proof: [llm-call-fields, oracle, helper-python]
  - text: capture_content gates messages_in, choices_out and embedding_output only, and finish_reasons and tools stay filled with it off.
    proof: [llm-call-capture, oracle, helper-python]
  - text: LLMCallOptions passes the route, session, trace and time to first chunk through, with an empty route or session treated as absent.
    proof: [llm-call-options, oracle, helper-python]
  - text: MCPToolCallSpanData reads the tool metadata and gates arguments and result on capture, skipping null values.
    proof: [mcp-tool-call, oracle, helper-python]
  - text: mcp_server_resource splits into address and port as urlsplit does, with the scheme default and no address for an origin it can't read.
    proof: [mcp-origin, oracle, helper-python]
  - text: MCPListToolsSpanData carries the tools/list method, no session id, the error and the identity.
    proof: [mcp-list-tools, oracle, helper-python]
  - text: PayloadKind picks McpToolCall, then McpListTools, then Inference, in the logger's order.
    proof: [payload-kind, oracle, helper-python]
  - text: primitive_value casts null, strings, bools, whole numbers and floats as LiteLLM does, and turns arrays and objects into text.
    proof: [primitive-values, oracle, helper-python]
  - text: safe_set_attribute writes the primitive value on a real span under the given key.
    proof: [safe-set-attribute]
  - text: A type that implements LLMObsAttributes without overriding anything writes no attribute.
    proof: [llm-obs-defaults]
  - text: Every oracle case has a seed in the helper case corpus and the corpus replays.
    proof: [helper-case-corpus]

checks:
  optional: []
  commands:
    - id: tool-definitions
      why: the tool tests are missing or a shape, fallback or skipped entry differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::tool_definition::tests::/)'
    - id: embedding-output
      why: the embedding test is missing or the count or dimensions differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::llm_call::tests::embedding_output_matches_litellm($|::)/)'
    - id: llm-call-fields
      why: the field test is missing or a span field is read from the wrong place
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::llm_call::tests::span_fields_match_litellm($|::)/)'
    - id: llm-call-capture
      why: the capture test is missing or content leaks with capture off, or metadata goes missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::llm_call::tests::capture_gates_content_only($|::)/)'
    - id: llm-call-options
      why: the options test is missing or an option doesn't reach the span
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::llm_call::tests::call_options_reach_the_span($|::)/)'
    - id: mcp-tool-call
      why: the tool call test is missing or a field or capture gate differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::mcp_call::tests::tool_call_span_matches_litellm($|::)/)'
    - id: mcp-origin
      why: the origin test is missing or an address or port differs from urlsplit
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::mcp_call::tests::upstream_origin_splits_like_urlsplit($|::)/)'
    - id: mcp-list-tools
      why: the list tools test is missing or a field differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::mcp_call::tests::list_tools_span_matches_litellm($|::)/)'
    - id: payload-kind
      why: the kind test is missing or a payload lands on the wrong span
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::mcp_call::tests::payload_kind_picks_the_span($|::)/)'
    - id: primitive-values
      why: the cast test is missing or a value keeps the wrong type
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::span_attributes::tests::primitive_value_matches_litellm($|::)/)'
    - id: safe-set-attribute
      why: the setter test is missing or a span doesn't receive the attribute
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::span_attributes::tests::safe_set_attribute_writes_primitives($|::)/)'
    - id: llm-obs-defaults
      why: the default test is missing or a default function writes to the span
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::span_attributes::tests::llm_obs_defaults_write_nothing($|::)/)'
    - id: helper-python
      why: the oracle adapter is untouched or fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3844.py tools/oracle/helpers/b3844)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: the span payload seeds are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/otel-span-payloads-*")" && grep -lE '^[[:space:]]+"?b3844"?:' tools/oracle/fuzz/corpus/helper_case/otel-span-payloads-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

