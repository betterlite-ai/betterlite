pitfalls:
  - The `tools` key wins whenever it holds a list, so `tools` set to `[]` with a full `functions` list gives no tools.
  - 'An entry `{"function": null, "name": "x"}` is skipped, because LiteLLM tests that the key exists before it looks at the value, so never fall back to the entry on null.'
  - Don't use `helpers::json_or_none` for `parameters`, since it passes a string through as is, where LiteLLM's `json.dumps` quotes it.
  - '`helpers::json_or_none` turns `OtelModelValue::Null(())` into the text `null`, so `arguments: null` needs the null test first or the span gets a `null` attribute.'
  - 'A row with no `embedding` key still counts, so `{"data": [{"object": "embedding"}]}` gives count 1 and dimensions None.'
  - '`tools` is not gated by capture, even though `parameters_json` comes from the request.'
  - Derive `finish_reasons` from the `output_choices` result before the capture gate, or a span with capture off loses its finish reasons.
  - '`embedding_output` needs both capture on and `GenAIOperation::Embeddings`, so a chat response with a `data` list gets None.'
  - '`LLMUsage::from_payload` needs `prompt_tokens`. `Payload` holds it as a named field and not in `extra`, so passing `&payload.extra` gives empty usage.'
  - '`Response::Object` keeps `model` outside `extra`, and `RequestContext` already reads it, so the response map passed to `output_choices` has no `model` key.'
  - Python `resolve_provider(None)` gives "" and Rust takes `&str`, so pass "" for an absent provider and don't error.
  - The record has 25 fields and functions stop at 40 lines, so build the fields that don't depend on capture in one private function and apply the content fields with `Self { messages_in, choices_out, embedding_output, ..base }`.
  - '`mcp_tool_call_metadata` sits at `payload.metadata.extra`, not `payload.extra`, so reading the top level always gives an empty map.'
  - An empty metadata object `{}` is not a tool call unless `call_type` says so, and a stamped payload with `call_type` set to `list_mcp_tools` is a tool call, because the logger asks that question first.
  - The redactor strips IPv6 brackets, so `http://fe80::1%25eth0` reaches this code, its host reads as `fe80` and its port text `:1%25eth0` fails, and that origin must give no address at all, not an address with no port.
  - '`url::Url` is the wrong tool here: `port()` drops a port equal to the scheme default, `host_str()` keeps IPv6 brackets, and `port_or_known_default()` gives 21 for `ftp`, where LiteLLM gives None.'
  - Port 0 takes the default because LiteLLM writes `port or default_port`, so `https://h:0` gives 443 and `ftp://h:0` gives no port.
  - The scheme test is case-insensitive through `urlsplit`, so `HTTPS://Example.com` gives host `example.com` and port 443.
  - A `bool` is an int subclass in Python, but `primitive_value` must keep `OtelModelValue::Bool` as `Value::Bool` and `1.0` as `F64`, and `Number::as_i64` returns None for the text `1.0`, so ask it first.
  - The Rust adapter can't pass a `Decimal` to `json!`, since its default serde form is a string, so turn `response_cost` and `time_to_first_chunk_seconds` into numbers with `rust_decimal::prelude::ToPrimitive::to_f64` before comparing.
  - '`LLMUsage` and `GenAIOperation` have no `serde::Serialize`, and `usage.rs` isn''t in this scope, so the adapter lists their fields and text by hand.'
  - LiteLLM casts an array or object with `str()`, and docs/compatibility.md leaves that text out of the contract, so test those two in Rust only, with no oracle case.

