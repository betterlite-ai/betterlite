id: B1050
title: Batch create route
description: >-
  Install create batch routes with managed-input validation, authorized provider/locally-executed selection and
  batch-precall quota hooks. Publish batch/file mappings through batch-managed-records and preserve source routing
  hints and user/team identity.


  POST /{provider}/v1/batches, /v1/batches and /batches preserve malformed team enforced_batch_output_expires_after=500,
  managed target count !=1=400 Expected 1 model, router missing=500, and missing provider/OpenAI credential fallback=404
  No such File object. enable_loadbalancing_on_batch_endpoints selects its deprecated router branch. The enterprise
  hook does not mint batch IDs or insert managed rows here; preserve MIT model-embedded IDs and the no-hook failure
  paths.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-server/src/api/batch_create_route.rs, crates/betterlite-core/src/api/batch_create_route.rs.
  Use BatchCreateRouteInput and BatchCreateRouteResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /{provider}/v1/batches; POST /v1/batches; POST /batches. Each
  alias is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts its
  child factories without re-registering their methods/paths.


  Route input projections: _create_batch_data.input_file_id (absent None); data.metadata (absent None); data.model
  (absent None); data.custom_llm_provider (absent None); data.litellm_call_id (absent ''); _create_batch_data.model
  (absent None); request.query_params.model (absent None); request.headers.x-litellm-model (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:308 status_code=500, exception_detail=FastAPI detail object; endpoints.py:315
  status_code=500, exception_detail=FastAPI detail object; endpoints.py:393 status_code=500, exception_detail=FastAPI
  detail object; endpoints.py:405 status_code=400, exception_detail=FastAPI detail object; endpoints.py:414 status_code=500,
  exception_detail=FastAPI detail object. Compare the actual source status, error type, param and code; ignore only
  error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions managed_batch_create_route, native_batch_create_route, executed_batch_create_route,
  unmanaged_input_rejected, create_limit_error, batch_expiry_malformed_500, batch_target_count_400, batch_no_router_500,
  batch_no_key_404, route_aliases, auth_missing, auth_invalid under api::batch_create_route::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.enable_loadbalancing_on_batch_endpoints
  defaults to None (only literal true enables). No environment reads occur outside betterlite-config. Test api::batch_create_route::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/batches_endpoints/endpoints.py: create_batch (L233-L524). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 246 owned nonblank/non-comment/non-docstring Python lines (262 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 266 implementation,
  112 behavior tests, 144 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds
  and 38 wiring; 593 total within the 600-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1020 (File credentials), B1036 (Batch
  provider create), B1041 (Batch managed records), B1047 (Batch precall), B1049 (Executed batch runner), B1087 (Api
  boundaries), B1112 (Batch route support), B1100 (Shared request body decoding), B162 (Python Router class), B732
  (Typed authentication principals and grant resolution), B855 (Authenticated request admission and budget handoff),
  B756 (Authentication header selection and mode dispatch), B1021 (File upload options), B1019 (File routing ids),
  B1048 (Executed batch input), B003 (HTTP server, health routes and master key auth), B1139 (Stateful HTTP oracle
  scenarios), B856 (Management oracle namespaces and Postgres test fixture), B002 (Load LiteLLM config.yaml into
  typed config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids
  retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
