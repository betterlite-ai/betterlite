deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
- StorageBackendFileService upload continuation L111-L124, _discard_orphaned_content, _create_unified_file_id and
  _store_in_managed_files have no reachable OSS caller without the enterprise hook; retain storage-only upload and
  object construction, not managed registration/cleanup.
pitfalls:
- target_model_names fails before upload when the managed hook is absent, so an OSS failure creates no orphan to
  clean up.
- The storage-only result uses file- plus 24 UUID hex characters and stores the backend URL in hidden metadata;
  it is not a unified managed-file ID.
review_level: security
budget:
