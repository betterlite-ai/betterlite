id: B1027
title: Storage backend selection and file upload service
description: >-
  Implement the whole get_storage_backend factory above B1025/B1026, and the complete
  StorageBackendFileService.upload_file_to_storage_backend and _create_file_object_with_storage_metadata
  functions in betterlite-core::api::file_storage_service. The factory recognizes exactly azure_storage
  and litellm_db. Instantiate the backend before checking target_model_names, so configuration errors
  take precedence over unavailable managed-file registration. A factory ValueError becomes
  ProxyException invalid_request_error/target_storage/400; upload-time errors propagate normally.

  Without the enterprise hook, nonempty target_model_names fails before any storage write. With no
  targets, write bytes and return a normal uploaded file; do not create managed metadata rows or
  ownership mappings. Inject clock and UUID for native projection tests. Hidden storage_backend and
  storage_url values are retained internally but not exposed as new public fields. Neither a
  successful write nor object construction implies a transaction with later metadata registration.

  Use B2401's file_storage_service SDK HTTP operation for actual Azure service calls against the
  mock and native B726-backed repository tests for database storage. The B171 helper of the same
  name tests only pure file-object projection with fixed clock/UUID. Route registration and multipart
  decoding stay in B1032; do not depend on it. Tests use api::file_storage_service::tests.
  Owned factory/service spans contain 141 nonblank, non-comment lines. Allow 150 implementation,
  125 tests, 105 cases, 115 adapters and 35 wiring lines: 530 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_storage_service.rs
  - crates/betterlite-core/src/api/file_storage_service/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/file_storage_service.rs
  - tools/oracle/src/helpers/core_ops/file_storage_service/**
  - tools/oracle/helpers/file_storage_service.py
  - tools/oracle/helpers/file_storage_service/**
  - tools/oracle/fuzz/corpus/helper_case/file_storage_service-*
  - tools/oracle/cases/helpers/file-storage-service/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/file_storage_service.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/file_storage_service.py
  - tools/oracle/cases/sdk-http/file-storage-service/**
  - tools/oracle/fuzz/corpus/sdk_http_case/file-storage-service-*
