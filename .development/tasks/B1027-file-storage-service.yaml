checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_service::/)
      - test(/::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_storage_service.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_storage_service-*)"
      && grep -qE "^[[:space:]]+file_storage_service:" tools/oracle/fuzz/corpus/helper_case/file_storage_service-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-storage-service)"
  - id: case-storage-file-object
    why: the storage-file-object source behavior is not independently tested
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_service::tests::storage_file_object($|::)/)'
  - id: case-storage-only-upload
    why: the storage-only-upload source behavior is not independently tested
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_service::tests::storage_only_upload($|::)/)'
  - id: case-storage-targets-400-before-write
