id: B1027
title: File storage service
description: >-
  Upload storage-only files and construct their MIT OpenAIFileObject/hidden storage metadata. A nonempty target_model_names
  with no BaseFileEndpoints hook returns 400 invalid_request_error, param target_model_names, code 400 before upload.
  With no targets, return after the storage write: no managed ID, managed row or hook is created. Unknown target_storage
  returns 400 invalid_request_error/target_storage/400. Preserve the generated file-<24 hex> ID, uploaded status
  and storage metadata.


  _store_in_managed_files, _create_unified_file_id and orphan cleanup are unreachable from the OSS upload path:
  targets fail before the upload, and no targets returns before registration. Their warning/cleanup cases are removed
  rather than activating that hook-only branch.


  Implement crates/betterlite-core/src/api/file_storage_service.rs. Use FileStorageServiceInput and FileStorageServiceResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): storage_backend_service.py:67 type='invalid_request_error', param='target_storage', code=400;
  storage_backend_service.py:77 type='invalid_request_error', param='target_model_names', code=400. Compare the
  actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs functions storage_file_object, storage_only_upload, storage_targets_400_befor_a0fe, unknown_storage_backend_400
  under api::file_storage_service::tests; each independently drives the production result and effects described
  here. HelperCase replay remains in B171.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileStorageService in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_storage_service: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership in litellm/proxy/openai_files_endpoints/storage_backend_service.py: upload_file_to_storage_backend
  L36-L110; _create_file_object_with_storage_metadata L141-L182. These ranges stop at the absent-hook guards; excluded
  continuations are listed below.


  Sizing: 75 owned nonblank/non-comment/non-docstring Python lines (101 nonblank/non-comment physical lines including
  docstrings), counted over the disjoint ranges above. Estimate 95 implementation, 64 behavior tests, 48 oracle
  fixtures, 90 Rust/Python adapters, 0 config tests/seeds and 30 wiring: 327 total within the 400-line cap. No owned
  decoder/fuzz work is required.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1018 (MIT resource owner compatibility),
  B1021 (File upload options), B1025 (File storage contracts), B1026 (File azure storage), B1087 (Api boundaries).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
