id: B326
title: Router budget windows and lossless spend synchronization
description: Implement provider/deployment/tag budget windows and Decimal spend updates using B068 normalized
  call cost and B304 state. Add the typed budget config and register/unregister hooks for B302 catalog
  changes. Separate queued increments from copied shared totals and preserve updates on failed/cancelled
  flushes. Reuse B071's duration/window primitives where available without changing account budget reservations.
  Build no routing filter in this part. Use the existing Rust crate boundaries from B004 and B008; integrate
  through the server when the provider dispatcher or callbacks live in another core crate. This task's
  source slices are the linked ranges, not a port of their Python classes. Add the listed oracle cases
  and the matching adapters to B301's component runner where state is not observable over HTTP; adapters
  call production logic and never reproduce it. Use deterministic candidate sets or supplied random samples
  for comparisons, and separate seeded distribution tests for random choices. Extend the existing config_yaml
  fuzz target and committed corpus for every newly accepted config form; unsupported keys still fail by
  full path. Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle
  cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/routing-budget-state/**
  - tools/oracle/src/router_probes/routing_budget_state/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/routing_budget_state.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L290-L489
  why: Window starts, increments and detached flush queues.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L491-L695
  why: Cost callbacks, synchronization and retry-safe draining.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L795-L935
  why: Budget initialization and runtime catalog lifecycle.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the routing_budget_state prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(routing_budget_state)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/routing-budget-state/window-start-and-reset.yaml
- tools/oracle/cases/routing/routing-budget-state/decimal-small-increments.yaml
- tools/oracle/cases/routing/routing-budget-state/provider-and-deployment-cost.yaml
- tools/oracle/cases/routing/routing-budget-state/tag-cost-once-per-tag-entry.yaml
- tools/oracle/cases/routing/routing-budget-state/flush-failure-requeues.yaml
- tools/oracle/cases/routing/routing-budget-state/increments-during-flush.yaml
- tools/oracle/cases/routing/routing-budget-state/shutdown-flush.yaml
- tools/oracle/cases/routing/routing-budget-state/websocket-wrapper-no-double-cost.yaml
deviations: []
out_of_scope:
- Key/team spend database writes (B069/B070).
- Selection filtering (B020).
pitfalls:
- Money remains Decimal through serialization and Redis operations; do not use float-based INCRBYFLOAT
  blindly.
- Cancellation after detaching a batch must not lose that batch.
- The zero-budget behavior is a separate filter concern, not an accounting default.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
