id: B326
title: Router budget windows and lossless spend synchronization
description: 'Implement Decimal router spend increments and synchronization over B383 budget windows using
  B068 normalized cost and B304 callbacks. Preserve the budget limiter''s pinned detach/requeue behavior,
  which differs from the generic B304 counter failure path. Retain in-flight increments and flush server-owned
  work on shutdown; B020 owns filtering. Implement the owned native service in crates/betterlite-router/src/routing_budget_state.rs.
  Add ProbeOperation::RoutingBudgetState in tools/oracle/src/router_probes/mod.rs and the corresponding B326 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/budget_limiter.py: _sum_increments_by_key
  (L98-L103), RouterBudgetLimiting._increment_spend_in_current_window (L392-L412), RouterBudgetLimiting._get_redis_increment_queue_lock
  (L414-L415), RouterBudgetLimiting._detach_queued_increment_operations (L417-L426), RouterBudgetLimiting._clear_detached_increment_operations
  (L428-L430), RouterBudgetLimiting._requeue_detached_increment_operations (L432-L453), RouterBudgetLimiting._flush_queued_increment_operations
  (L455-L457), RouterBudgetLimiting._await_flush_task (L459-L469), RouterBudgetLimiting._write_queued_increment_operations
  (L471-L489), RouterBudgetLimiting.async_log_success_event (L491-L546), RouterBudgetLimiting._increment_spend_for_key
  (L548-L595), RouterBudgetLimiting.periodic_sync_in_memory_spend_with_redis (L597-L613), RouterBudgetLimiting._push_in_memory_increments_to_redis
  (L615-L629), RouterBudgetLimiting._flush_queued_increments_with_lock (L631-L633), RouterBudgetLimiting._sync_in_memory_spend_with_redis
  (L635-L655), RouterBudgetLimiting._flush_increments_then_copy_redis_spend (L657-L695). Implement these
  behaviors through the typed Rust services above; synchronous facades and structural accessors reuse
  the same primitive instead of separate ports.'
