deviations:
  - what: >-
      team_metadata is carried raw on RequestIdentity and filtered only at baggage promotion time
      via an allowlist, not at identity creation. An empty team_metadata dict is stored as None.
    why: >-
      The filtering policy is a configuration concern (baggage_team_metadata_keys), not a parsing concern.
      Deferring the filter allows the identity to be reused across different baggage policies.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/model/baggage.py#L102-L118

out_of_scope:
  - Baggage read/write and BaggageSpanProcessor lifecycle; owned by the span processor framework.
  - Span creation, naming and attribute stamping; owned by span builders and attributes that consume this metadata.
  - Route model group lookups and deployment resolution; the caller passes already-resolved model names.
  - Session id policy (minting, echo-check); this task only reads and filters per the caller's provided logic.
  - Langfuse SDK integration and header propagation; this task only parses the headers and request fields.
  - Metadata sanitization (secrets redaction, PII masking); this task reads raw metadata without transformation.
  - CustomLogger and live callback dispatch; this task only provides data structures for callbacks to populate.

pitfalls:
  - >-
      team_metadata is carried raw and filtered only at promotion time. An empty dict must be stored as None
      so the empty case is not promoted as "{}".
  - >-
      The user_api_key_team_id key is canonical and prefers over the bare team_id alias; always check the
      canonical key first or the returned team_id may be empty when the alias is populated.
  - >-
      Session id filtering for minted ids uses SESSION_ID_GENERATED_METADATA_KEY in the same metadata dict as the id.
      A minted id echoing trace_id is checked after filtering; a litellm_session_id header takes the minted check.
  - >-
      Header values (langfuse_* prefix) for trace controls win over body values unconditionally; a None header
      does not fall through to the body — only the absence of a header causes fallback.
  - >-
      resolve_provider_model reads deployment first (from metadata), then litellm_model_name, then model. The model
      field is already reconstructed to the provider-prefixed deployment name, so it's the fallback, not the primary.
  - >-
      time_to_first_chunk_seconds is None for non-streaming calls, even if timestamps are present. Check stream: true
      in optional_params before subtracting times.
  - >-
      Metadata flattening uses dotted keys (e.g. "requester_metadata.user_id") so dotted lookups in promote
      must use the exact dotted key, not nested dict access.
  - >-
      Tags are validated as a tuple of objects by Pydantic; non-string entries are silently dropped. An empty
      tags list is stored as an empty tuple, never None.

