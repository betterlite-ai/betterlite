dod:
  - text: >-
      RequestIdentity parses team_id (preferring user_api_key_team_id over team_id),
      team_alias, team_metadata, key_hash, end_user, and call_id from StandardLoggingPayload metadata.
      provider_model is resolved from the payload (preferring deployment, then litellm_model_name, then model).
      request_route is extracted from metadata. Metadata leaves are flattened to dotted keys.
    proof: [identity-parsing-tests]
  - text: >-
      RequestIdentity.from_user_api_key_auth seeds identity at the auth boundary with team and key fields,
      extracting user_id, org_id, key_alias, end_user_id from the auth object. requester_metadata is flattened
      and carried under the requester_metadata prefix. provider_model is absent at auth time and filled from payload.
    proof: [identity-from-auth-tests]
  - text: >-
      RequestContext wraps RequestIdentity and adds request_model (user-facing group, fallback call model),
      response_model, model_group, model_id, api_base. The model split is correct on both proxy (group vs deployment)
      and SDK paths (same model).
    proof: [context-parsing-tests]
  - text: >-
      LLMCallEvent parses live callback kwargs and carries call_id, payload, dynamic_params, auth_metadata,
      is_no_upstream_call (from LITELLM_LOGGING_NO_UPSTREAM_LLM_CALL), upstream_started (api_call_start_time set),
      provisional span name, time_to_first_chunk_seconds (for streaming only), trace controls, and session_id.
    proof: [llm-call-event-tests]
  - text: >-
      caller_session_id ignores minted session ids (those carrying SESSION_ID_GENERATED_METADATA_KEY),
      prefers litellm_session_id header over body, and falls back to trace.session_id only when no minted ids exist.
      Minted ids echoing trace_id are also filtered.
    proof: [session-id-tests]
  - text: >-
      time_to_first_chunk_seconds is None for non-streaming calls; for streaming, it subtracts api_call_start_time
      from completion_start_time and returns seconds (or None if either is missing).
    proof: [time-to-chunk-tests]
  - text: >-
      promoted_baggage filters identity values to promoted_keys and metadata leaves to metadata_keys and team_metadata to team_metadata_keys.
      Team metadata is JSON-serialized only when allowlisted keys exist; empty metadata is dropped. promoted_metadata builds the
      litellm.metadata.* namespace from the allowlisted flattened keys.
    proof: [baggage-promotion-tests]
  - text: >-
      auth_metadata is extracted from payload (once call closes) or litellm_params (at pre_call for tracer resolution).
      Values are strings only; non-string entries are dropped. model_from_request_data and metadata_from_request_data
      read the requester_metadata snapshot from pre-call data.
    proof: [metadata-extraction-tests]
  - text: >-
      resolve_provider_model prefers deployment (from metadata), then litellm_model_name (hidden params),
      then model (top-level, already reconstructed). flatten_metadata walks nested dicts and yields (dotted_key, str_value) tuples.
      _team_metadata_dict returns the raw mapping or None when empty.
    proof: [helper-function-tests]

checks:
  optional: []
  commands:
    - id: identity-parsing-tests
      why: RequestIdentity must parse all fields from StandardLoggingPayload metadata and resolve provider_model correctly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::request_identity::parse::/)'
    - id: identity-from-auth-tests
      why: RequestIdentity.from_user_api_key_auth must seed identity at auth boundary with key/team fields and flatten requester_metadata.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::request_identity::from_auth::/)'
    - id: context-parsing-tests
      why: RequestContext must wrap identity and resolve request_model, response_model, model_group correctly on both proxy and SDK paths.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::request_context::/)'
    - id: llm-call-event-tests
      why: LLMCallEvent must parse live callback kwargs with all fields including dynamic_params, auth_metadata, and upstream_started flag.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::llm_call_event::/)'
    - id: session-id-tests
      why: caller_session_id must filter minted ids and prefer header over body, falling back to trace.session_id only when no minted ids exist.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::metadata::session_id::/)'
    - id: time-to-chunk-tests
      why: time_to_first_chunk_seconds must be None for non-streaming and compute seconds difference for streaming.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::metadata::time_to_chunk::/)'
    - id: baggage-promotion-tests
      why: promoted_baggage and promoted_metadata must filter to allowlisted keys and serialize team metadata as JSON when non-empty.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::baggage::/)'
    - id: metadata-extraction-tests
      why: auth_metadata, model_from_request_data, and metadata_from_request_data must extract values from payload and kwargs correctly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::metadata::extraction::/)'
    - id: helper-function-tests
      why: resolve_provider_model, flatten_metadata, and _team_metadata_dict helper functions must work correctly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::metadata::helpers::/)'
    - id: helper-python
      why: The independently invoked MIT helper semantics must match the production functions.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3841::/)'
    - id: helper-case-corpus
      why: Oracle helper cases and corpus must replay with the new request identity decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/request-identity tools/oracle/fuzz/corpus/helper_case/request-identity-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

