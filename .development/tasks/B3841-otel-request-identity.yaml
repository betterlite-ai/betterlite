id: B3841
title: OTel request identity and baggage projections
description: >-
  Build request identity parsing from StandardLoggingPayload and UserAPIKeyAuth
  at the proxy auth boundary and from closed-request payloads. Resolve request-vs-provider
  model split (user-facing group vs. dispatched deployment). Promote filtered identity
  values into Baggage labels so child spans inherit caller context, including team_id,
  team_alias, key_hash, end_user, request_model, provider_model and filtered team metadata.
  The task does not handle Baggage read/write or span processor lifecycle; it provides
  immutable data structures and helpers the span processor and OTel callbacks read.

  RequestIdentity is a frozen dataclass with call_id, team_id, team_alias, team_metadata
  (raw, filtered at baggage-promotion time), key_hash, end_user, provider_model (filled
  from payload only), request_route, and a flattened metadata dict. RequestIdentity.from_payload
  parses from StandardLoggingPayload metadata (team_id prefers user_api_key_team_id), resolves
  provider_model from deployment/litellm_model_name/model. RequestIdentity.from_user_api_key_auth
  seeds identity at the auth boundary from UserAPIKeyAuth fields, flattening requester_metadata
  under requester_metadata.* keys and provider_model filled from payload only. RequestContext
  wraps RequestIdentity with request_model, response_model, model_group, model_id and api_base
  from the closed payload. LLMCallEvent wraps live callback kwargs with call_id, payload,
  dynamic_params, auth_metadata (key/team config from auth), is_no_upstream_call,
  upstream_started, provisional_span_name, time_to_first_chunk_seconds and session_id.
  Helper functions extract caller_session_id (ignoring minted ids, preferring headers),
  time_to_first_chunk_seconds (seconds for streaming only), auth_metadata (string values only),
  model_from_request_data, metadata_from_request_data, flatten_metadata (dotted-key leaves),
  resolve_provider_model and _team_metadata_dict. promoted_baggage filters identity values
  to promoted_keys and metadata/team_metadata to their allowlists, JSON-serializing only
  allowlisted team metadata. promoted_metadata builds the litellm.metadata.* namespace from
  flattened metadata keys. Count: **414 lines** (metadata.py 325 + baggage.py 89).

