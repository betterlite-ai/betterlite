id: B1032
title: File upload route
description: >-
  Register file upload aliases and execute the MIT upload-routing plan, retaining the absent managed_files hook
  behavior and native/storage paths. Do not create a substitute managed hook or publish enterprise mappings.


  POST /{provider}/v1/files, /v1/files and /files accept purpose, target_model_names, target_storage, custom_llm_provider
  (openai), litellm_metadata, passthrough and expires_after[anchor|seconds]. Invalid purpose is 400 param purpose;
  each expires_after validation failure is 400; malformed team enforced_file_expires_after is 500; missing create
  result is 500. Preserve litellm_batch_guardrail in the successful result. managed-multi-model-upload reaches the
  absent-hook 500 internal_server_error, param null, code 500 unless an earlier validation fails. Use B900 multipart
  HTTP captures.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-server/src/api/file_upload_route.rs, crates/betterlite-core/src/api/file_upload_route.rs.
  Use FileUploadRouteInput and FileUploadRouteResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /{provider}/v1/files; POST /v1/files; POST /files. Each alias
  is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts its child
  factories without re-registering their methods/paths.


  Route input projections: data.purpose (absent None); data.file (absent None); data.metadata (absent None); data.litellm_metadata
  (absent None); data.litellm_call_id (absent '').


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): files_endpoints.py:635 type='invalid_request_error', param='purpose', code=400; files_endpoints.py:867
  status_code=500, exception_detail=FastAPI detail object; files_endpoints.py:697 status_code=400, exception_detail=FastAPI
  detail object; files_endpoints.py:706 status_code=400, exception_detail=FastAPI detail object; files_endpoints.py:716
  status_code=400, exception_detail=FastAPI detail object; files_endpoints.py:727 status_code=400, exception_detail=FastAPI
  detail object; files_endpoints.py:825 status_code=500, exception_detail=FastAPI detail object; files_endpoints.py:832
  status_code=500, exception_detail=FastAPI detail object; files_endpoints.py:911 type=openai_error_type(e, error_status_code(e,
  status.HTTP_400_BAD_REQUEST)), param=openai_error_param(e), code=error_status_code(e, status.HTTP_400_BAD_REQUEST);
  files_endpoints.py:919 type=openai_error_type(e, error_status_code(e, 500)), param=openai_error_param(e), code=error_status_code(e,
  500); files_endpoints.py:738 status_code=400, exception_detail=FastAPI detail object. Compare the actual source
  status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions file_upload_route, managed_multi_model_upload, storage_upload_route,
  upload_partial_failure, batch_validation_before_f_239a, invalid_purpose_400, expiry_anchor_invalid, expiry_seconds_invalid,
  team_expiry_malformed_500, create_file_empty_500, batch_guardrail_summary, route_aliases, auth_missing, auth_invalid
  under api::file_upload_route::tests. Each named function drives production code and asserts its case result; use
  named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): general_settings.max_file_size_mb
  defaults to None; general_settings.allowed_file_extensions defaults to None; general_settings.blocked_file_extensions
  defaults to None; litellm_settings.enable_loadbalancing_on_batch_endpoints defaults to None; general_settings.max_batch_file_size_mb
  defaults to None. No environment reads occur outside betterlite-config. Test api::file_upload_route::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/openai_files_endpoints/files_endpoints.py: create_file (L545-L927). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 316 owned nonblank/non-comment/non-docstring Python lines (330 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 336 implementation,
  124 behavior tests, 168 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 45 config tests/seeds
  and 38 wiring; 711 total within the 720-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B900 (Multipart oracle), B1018 (MIT
  resource owner compatibility), B1027 (File storage service), B1028 (File provider write), B1031 (File upload routing),
  B1087 (Api boundaries), B1100 (Shared request body decoding), B1103 (Authenticated request preparation), B1139
  (Stateful HTTP oracle scenarios), B732 (Typed authentication principals and grant resolution), B855 (Authenticated
  request admission and budget handoff), B756 (Authentication header selection and mode dispatch), B1022 (File upload
  validation), B1021 (File upload options), B1101 (Shared multipart and form extraction), B003 (HTTP server, health
  routes and master key auth), B856 (Management oracle namespaces and Postgres test fixture), B002 (Load LiteLLM
  config.yaml into typed config). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
