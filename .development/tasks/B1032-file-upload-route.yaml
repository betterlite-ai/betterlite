dod:
- text: >-
    file_upload_route posts note.txt containing hello with purpose=assistants; the mock receives those bytes,
    filename and purpose and returns id=file_a,object=file,bytes=5,created_at=1,filename=note.txt,purpose=assistants.
    Client status is 200 with those fields. Repeat for every accepted non-batch purpose. With plain
    litellm_metadata='{"tag":"ignored"}' and litellm_metadata[tag]=kept, the pre-call capture contains tag=kept.
    With only the plain field it contains no tag. Native hook variants return null, a replacement data record,
    an OpenAIFileObject id=file_b and an unrelated scalar; only the file object replaces the successful response.
    Hidden model_id=dep_a,cache_key=cache_a,api_base=https://mock.test/v1?secret=x produce x-litellm-model-id=dep_a,
    x-litellm-cache-key=cache_a and x-litellm-model-api-base=https://mock.test/v1; absent hidden fields omit these
    headers. x-litellm-version is present; allowed_model_region=eu yields x-litellm-model-region=eu.
  proof:
  - case-file-upload-route
  - oracle
- text: >-
    managed_multi_model_upload sends purpose=assistants,file=note.txt,target_model_names=model_a,model_b.
    Without enterprise, status is 500, type=internal_server_error,param=null,code="500",message="Managed files
    hook not found" and neither model receives an upload. No managed-file row is published.
  proof:
  - case-managed-multi-model-upload
  - oracle
- text: >-
    storage_upload_route posts purpose=assistants,file=note.txt,target_storage=azure_storage to a configured mock storage
    backend through B1031. Expect 200 with its file id and bytes=5, B1026's create/append/flush sequence containing hello and zero
    model-provider calls. With target_storage=default and no targets/model, the default OpenAI mock receives one
    upload instead. B1027 owns storage id formatting and credentials; compare its full returned record unchanged.
  proof:
  - case-storage-upload-route
  - oracle
- text: >-
    upload_partial_failure makes the provider reject a valid upload with status=429,type=rate_limit_error,
    message=slow down,param=null. Expect 429,rate_limit_error,null,code="429" and one failure-hook call, with no
    success status or success hook. Native variants fail the pre-hook, route service and success hook in turn;
    all owned redaction/rewrite spools close exactly once. A success-hook failure occurs after success status was
    enqueued and after the remote file was created: the route returns 500/internal_server_error/null/"500",
    runs the failure hook and does not issue compensating deletion. No transaction is implied.
  proof:
  - case-upload-partial-failure
  - oracle
- text: >-
    batch_validation_before_forward posts purpose=batch and an empty input.jsonl; expect 400,invalid_request_error,
    param=file,code="400",message="Batch input file has no request lines. The file was not forwarded to the provider."
    Valid JSONL {custom_id:r1,method:POST,url:/v1/chat/completions,body:{model:model_a,messages:[]}} reaches the mock
    unchanged. Under max_file_size_mb=1, 1048576 bytes pass and 1048577 bytes yield 413,invalid_request_error,file,"413";
    positive non-batch limits stop reading after limit+1. Test allowed_file_extensions=[.jsonl] with report.txt
    and blocked_file_extensions=[.exe] with report.EXE: both fail 400,invalid_request_error,file,"400" before a
    provider call, with the corresponding not-in-allowed or blocked message from B1022. Batch size and native
    Vertex passthrough row-shape errors reuse B1022's fixtures through this route. Enabling load balancing sends
    the valid row's model_a to its configured deployment; null/false use the default provider path.
  proof:
  - case-batch-validation-before-forward
  - oracle
- text: >-
    invalid_purpose_400 sends purpose=unknown with note.txt and receives 400,invalid_request_error,purpose,"400",
    message="Invalid purpose: unknown. Must be one of: ('assistants', 'assistants_output', 'batch', 'batch_output',
    'fine-tune', 'fine-tune-results', 'vision', 'user_data', 'evals', 'messages')". For the same purpose with
    filename=../note.txt, the filename error wins with param=file. With a safe filename and require_managed_files=true,
    missing targets produces 400,invalid_request_error,null,"400" with the target_model_names-required message,
    before purpose validation. With targets=model_a and model=model_a, the model-not-allowed requirement wins.
  proof:
  - case-invalid-purpose-400
  - oracle
- text: >-
    expiry_anchor_invalid sends created_at without seconds, and seconds=60 without anchor; each returns
    400,invalid_request_error,null,"400" and the detail-error text "Both expires_after[anchor] and expires_after[seconds]
    must be provided if expires_after is specified". anchor=updated_at,seconds=60 yields "expires_after[anchor]
    must be 'created_at', got 'updated_at'". Sending a file part as the anchor yields "expires_after[anchor] must
    be a string, not a file upload". Each message retains this handler's stringified detail mapping wrapper.
  proof:
  - case-expiry-anchor-invalid
  - oracle
- text: >-
    expiry_seconds_invalid uses anchor=created_at and seconds=abc; expect 400,invalid_request_error,null,"400"
    and the stringified detail error "expires_after[seconds] must be a valid integer, got 'abc': invalid literal
    for int() with base 10: 'abc'". A file-valued seconds yields "expires_after[seconds] must be a string, not a
    file upload" at the same status. Values " 7 ", "+3", "1_000", "0" and "-1" reach the provider as 7,3,1000,0,-1
    with anchor=created_at. The mock accepts them with 200; no new positive-expiry validator is added here.
  proof:
  - case-expiry-seconds-invalid
  - oracle
- text: >-
    team_expiry_malformed_500 authenticates a team whose enforced_file_expires_after is {anchor:created_at},
    then {seconds:60}, then {anchor:updated_at,seconds:60}. Each yields 500,internal_server_error,null,"500";
    missing fields say "Server configuration error: team metadata field 'enforced_file_expires_after' is malformed
    - must contain 'anchor' and 'seconds' keys. Contact your team or proxy admin to fix this setting." The last
    says "Server configuration error: team metadata field 'enforced_file_expires_after' has invalid anchor
    'updated_at' - must be 'created_at'. Contact your team or proxy admin to fix this setting." Messages retain
    the detail mapping wrapper. Team {anchor:created_at,seconds:"120"} overrides client seconds=60 upstream;
    null leaves 60 unchanged. Team seconds=abc gives 500/internal_server_error/null/"500" with Python's int error.
  proof:
  - case-team-expiry-malformed-500
  - oracle
- text: >-
    create_file_empty_500 supplies a valid typed upload to the native route with an injected route_create_file
    service returning no file. Expect 500,internal_server_error,null,"500", message="{'error': 'Failed to create
    file. Please try again.'}", one failure hook and no success status/hook. This defensive callback-result
    branch is a native test; the HTTP oracle does not monkeypatch a FastAPI handler.
  proof:
  - case-create-file-empty-500
- text: >-
    batch_guardrail_summary sends two valid batch rows r1/r2; B1023's configured mock guardrail changes only r2.
    The provider receives the rewritten r2 and unchanged r1; client 200 includes litellm_batch_guardrail equal to
    the scanner's two-record report. Captured success-hook metadata already has batch_guardrail; warning logging
    reports one changed record out of two before that hook. A scan with no changes leaves bytes unchanged and
    omits the response report and warning. Passthrough=true uses the native Vertex shape and B1031's scan policy.
  proof:
  - case-batch-guardrail-summary
  - oracle
- text: >-
    route_aliases posts the valid five-byte file to /files, /v1/files and /openai/v1/files and gets 200,file_a
    from one mock upload each. Configure OpenAI and Azure mock credentials, then prove path=openai beats
    header=azure, header=openai beats query/body=azure, query=openai beats body=azure, body=openai is used alone,
    and no hint defaults to openai. Every selected OpenAI mock returns file_a and the Azure mock sees zero calls;
    repeat with an empty higher-priority hint to prove fallthrough. Header spelling is custom-llm-provider,
    query/form spelling custom_llm_provider. None of these aliases mounts the route twice.
  proof:
  - case-route-aliases
  - oracle
- text: >-
    auth_missing sends the otherwise valid multipart upload without Authorization while master key sk-test is
    configured. Expect 401,type=auth_error,param="None",code="401" and zero upload or storage calls.
  proof:
  - case-auth-missing
  - oracle
- text: >-
    auth_invalid sends Authorization: Bearer sk-wrong with that same valid upload and receives
    401,type=auth_error,param="None",code="401". No validation or provider-side upload runs.
  proof:
  - case-auth-invalid
  - oracle
- text: >-
    required_upload_fields omits purpose, then file, then both. Authenticated requests receive 422 with a detail
    array whose missing-field items have type=missing,loc=[body,purpose] or [body,file],msg="Field required".
    The public_validation_errors projection removes input and ctx entirely, even when validation supplied them.
    There is no OpenAI error envelope and no provider call. Supplying both fields exits this validation path.
  proof: [required-fields, oracle]
- text: >-
    upload_form_and_configuration_edges posts passthrough=on/yes/1 and false/off/0: FastAPI recognizes
    the corresponding booleans; an unrecognized value gives 422 detail with type=bool_parsing,
    loc=[body,passthrough],msg="Input should be a valid boolean, unable to interpret input" before
    orchestration. general_settings.max_batch_file_size_mb="1" or true is coerced to 1 by this route's
    adapter; 1.5 fails with 500/internal_server_error/null/"500" and the adapter's int_from_float error,
    without provider upload. Team enforced_file_expires_after={anchor:created_at,seconds:true} sends 1;
    seconds=1.9 truncates to 1. These are not client-positive-range validations. All route exceptions
    invoke the failure hook before EXCEPTION "litellm.proxy.proxy_server.create_file(): Exception
    occured - <error>"; successful expiry selection emits DEBUG "create_file expires_after: <value>".
  proof: [form-config-edges, oracle]
- text: New multipart fixtures capture both the client envelope and the provider's received bytes through B900.
  proof:
  - new-oracle-cases
  - oracle
