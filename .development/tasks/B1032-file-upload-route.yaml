id: B1032
title: File upload route
description: >-
  Own the complete create_file handler at files_endpoints.py:545-927, with its decorators at 530-544.
  Register POST /{provider}/v1/files, /v1/files and /files in betterlite-server::api::file_upload_route.
  Implement its upload lifecycle in betterlite-core::api::file_upload_route, using B1031 for routing and
  scanning, B1024 for rewritten JSONL, B1022 for validation and B1021 for target/model/storage extraction.
  B206 owns get_or_create_metadata_bucket; B2400 owns the known-model predicate used by the load-balancing branch.
  B900 sends multipart requests through both running proxies; it records provider uploads rather than
  invoking the FastAPI function. B1139/B856 supply keys and team metadata. Configure master key sk-test
  for every authenticated case. B003 supplies FastAPI-compatible required-field errors and final error
  serialization; B004 supplies response headers; B012 supplies observable pre/success/failure hooks.

  purpose and file are required multipart fields. Defaults are target_model_names="", target_storage=default,
  custom_llm_provider=openai and passthrough=false. Provider resolution uses path, custom-llm-provider header,
  custom_llm_provider query, body, then openai, with empty values falling through. B2400 owns those accessors.
  The declared plain litellm_metadata form value is unused; only litellm_metadata[...] fields are extracted by
  B1101. Preserve B1100's cached body and B1103's authenticated request data. No second multipart parser is added.

  Reject an unsafe filename before reading the upload. Batch uploads retain their seekable source; other
  purposes read at most max_file_size_mb*1048576+1 bytes when that setting is positive. Then resolve targets,
  enforce require_managed_files, validate purpose, apply size/extension rules, validate passthrough and check
  batch JSONL, in that order. Supported purposes are assistants, assistants_output, batch, batch_output,
  fine-tune, fine-tune-results, vision, user_data, evals and messages. Keep scan work off the async executor.

  Parse expires_after[anchor] and expires_after[seconds] together. Seconds uses Python integer semantics,
  including whitespace, signs and underscores; this handler does not enforce a positive range. Team metadata
  enforced_file_expires_after, when non-null, replaces the client expiry after validation and batch scanning.
  Its anchor must be created_at and it must have seconds; malformed team settings are server errors.

  Pass purpose and UploadedFileInfo{filename,content_type,size} to the acreate_file pre-call hook, then remove
  those temporary fields. A null hook return retains data. Scan metadata chooses truthy metadata before
  litellm_metadata, otherwise an empty mapping. Record changed-line batch_guardrail metadata and its warning
  before calling the provider. Own and close only the redaction/rewrite spools in finally, on success or failure.
  Keep the original UploadFile lifetime with B1101. If load balancing is exactly true, extract the first JSON
  object's model and ask the injected known-model lookup before B1031 selects the upload path.

  On a non-null response, enqueue update_request_status with status=success and litellm_call_id default ""
  before the success hook. Replace the response only if that hook returns an OpenAIFileObject; attach the
  guardrail report afterward. B004 headers use hidden model_id/cache_key/api_base or "", version and the
  principal's allowed_model_region. The failure hook runs before error conversion. Preserve ProxyException;
  map HTTPException with B003's status-sensitive mapper, not B2400's internal_server_error-only mapper.
  HTTP 400 here has type invalid_request_error, param null, code "400"; 500 has internal_server_error,
  null, "500". Validation failures carrying param=file or purpose retain it. Compare error messages too.

  Consume B1022's loader-tested omitted/null/positive/zero/negative max_file_size_mb and
  max_batch_file_size_mb, absent/empty/[.jsonl] allowed_file_extensions and absent/empty/[.exe]
  blocked_file_extensions. B1031 owns loader cases for enable_loadbalancing_on_batch_endpoints.
  Defaults for all five are null. Reject bool/string general upload-size values and non-string extension lists
  via B1022. This handler's int-or-null batch-size adapter accepts "1" and true as 1, but rejects 1.5.
  B1021 owns require_managed_files (default false).
  Route cases below load those settings through the existing Config fixture setup; no duplicate config
  module or YAML decoder is added here. The native B1087 cap still applies when no source cap is set.

  Tests below live in api::file_upload_route::tests, with each named case exercising production code. Callback
  return-type, empty-result and spool-lifetime branches use injected native services; all provider-reaching cases
  use HTTP with the mock provider. No helper oracle is needed. Counted source is 330 nonblank/non-comment lines,
  316 excluding docstrings; budget 790 lines comprises 325 implementation, 220 behavior tests, 205 fixtures
  and 40 wiring. Reusing the dependency-owned config tests leaves room for coercion edge cases.
  Typed services and shared multipart fixtures keep the complete function
  together instead of dividing its control flow across tasks.
