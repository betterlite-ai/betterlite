deviations:
- what: >-
    Managed multi-model uploads currently return 500/internal_server_error/param=null/code="500" with "Managed files
    hook not found" and make no provider calls. Whether betterlite should implement managed files/batches remains
    Max's decision; this task does not create an enterprise replacement.
  why: The pinned open-source installation has no managed_files hook. Max's managed files and batches choice is still open; keep MIT behavior without adding a license check.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L471-L480
- what: >-
    The B1101 native multipart cap rejects a request over 16 MiB with 413/invalid_request_error/param=file/code=request_too_large,
    even when general_settings.max_file_size_mb is null. The source handler has no equivalent default upload cap.
  why: Preserve the existing bounded-input decision; configured source limits retain their own string status codes.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L593-L606
out_of_scope:
- 'litellm/proxy/openai_files_endpoints/files_endpoints.py: B1031 owns _names_a_litellm_executed_provider L111-L113,
  _litellm_executed_batch_input_model L116-L165, set_files_config L181-L195, get_files_provider_config L198-L209,
  _deployment_provider L212-L214, _resolves_to_vertex_deployments_only L217-L224, _validate_passthrough_upload L227-L289,
  _scan_batch_upload L292-L329, get_first_json_object L332-L351, get_model_from_json_obj L354-L363, _deprecated_loadbalanced_create_file
  L366-L378, route_create_file L381-L527.'
- 'litellm/proxy/openai_files_endpoints/files_endpoints.py: B1033 owns get_file_content L945-L1233.'
- 'litellm/proxy/openai_files_endpoints/files_endpoints.py: B1034 owns get_file L1251-L1431, _as_file_list_page
  L1652-L1655, list_files L1673-L1860.'
- 'litellm/proxy/openai_files_endpoints/files_endpoints.py: B087 owns delete_file L1449-L1649.'
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
