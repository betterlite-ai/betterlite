dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: numeric_user_id, unknown_enforced_user,
      header_precedence, standard_header_order_casefold, customer_mapping_order,
      malformed_mapping_skipped, absent_mapped_header_blocks_legacy, legacy_whitespace_name,
      body_metadata_safety_precedence, metadata_json_object_only, id_trim_blank_bool_structure,
      json_identifier_opt_in, malformed_json_identifier_kept, validation_off_no_db_passthrough,
      positive_cache_300, negative_cache_60, unknown_cache_value_miss,
      key_empty_budget_preserves_id, global_empty_budget_does_not,
      end_user_before_user, email_only_with_at, no_user_upsert,
      lookup_errors_debug_then_negative, cache_failures_propagate and unknown_id_dropped_not_denied.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^end_user_identity::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/end_user_identity.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/end-user-identity-*")"
        && grep -rlq "end_user_identity" tools/oracle/fuzz/corpus/helper_case/end-user-identity-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::end_user_identity::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/end-user-identity-*")"
        && grep -rlq "validate_end_user_id_in_db" crates/betterlite-config/fuzz/corpus/config_yaml/end-user-identity-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::end_user_identity::tests::/)
        - test(/replays_the_/)'
