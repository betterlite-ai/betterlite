  - 'The oracle helper for this task is pre-registered as end_user_identity in the server group. Replace the stub Op in tools/oracle/src/helpers/server/end_user_identity.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/end_user_identity.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
