id: B880
title: End-user identity extraction and registry validation
description: >-
  Extract end-user identity from typed body/header inputs, coerce supported numeric IDs and validate configured
  database existence without widening key/team scope. Preserve user_header_mappings precedence and validate_end_user_id_in_db=false
  default. Accept parsed request fields; HTTP request decoding remains the request envelope owner.

  Extraction checks case-insensitive x-litellm-customer-id before x-litellm-end-user-id, then configured
  CUSTOMER-role mappings in list order, then deprecated general_settings.user_header_name only if no
  usable mapping names exist. Mappings accept a dict or list, skip non-dicts/missing role/missing header,
  compare the role case-insensitively and lowercase the header name. A mapping whose header is absent
  still suppresses the deprecated header fallback. Deprecated names must be nonblank strings but retain
  their original whitespace for matching. Next try body.user, litellm_metadata.user, metadata.user_id
  and safety_identifier in that order. Metadata may be a dictionary or JSON string decoded by B192;
  malformed JSON and nonobjects act as empty objects. The JSON decoder and its fuzz target stay B192's.

  ID coercion drops None, booleans and structured objects; numbers become their Python-compatible text,
  strings are trimmed and blank becomes None. With validate_end_user_id_in_db enabled, strings starting
  with { or [ are dropped only when B192 parsing actually yields an object/array; malformed strings and
  other JSON scalars survive. Disabled validation preserves JSON-encoded identifiers. No ID means None.
  Validation disabled or no DB returns the supplied ID unchanged. With a DB use the raw-cache key
  end_user_validation:<id>, treating exactly "valid" and "invalid" as hits. A positive hit preserves
  the ID. A negative hit preserves it only when max_end_user_budget_id is truthy or the key's
  end_user_budget_id is not None (including empty string); otherwise return None, never an auth error.

  On a cache miss, call B739 get_end_user_object first, then B736 get_user_object with user_id_upsert=false,
  check_db_only=false and user_email=id only when it contains @. Either non-null row validates the ID.
  Each lookup failure, including a budget failure, debug-logs and falls through to the next lookup;
  two failures become invalid. Cache "valid" for 300 seconds or "invalid" for 60 before returning.
  B2315 owns the raw-cache view. Cache read/write errors propagate, and no database row is created by
  this resolver itself. Compare storage through POSTGRES_TEST_URL, using testcontainers only when absent.


  Build the production end_user_identity module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  resolve_and_validate_end_user_id (L1981-L2041; 53 source lines), _end_user_id_exists_in_db (L2044-L2083;
  38 source lines). litellm/proxy/auth/auth_utils.py: get_customer_user_header_from_mapping (L1511-L1530;
  18 source lines), _get_customer_id_from_standard_headers (L1533-L1557; 21 source lines), _coerce_user_id_to_str
  (L1560-L1592; 26 source lines), get_end_user_id_from_request_body (L1595-L1678; 52 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.validate_end_user_id_in_db=False;
  litellm_settings.max_end_user_budget_id=None; general_settings.user_header_mappings=None;
  general_settings.user_header_name=None. The 300/60-second validation TTLs are constants, not settings.


  Add the end_user_identity operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a end-user-identity-*
  seed to B171 helper_case, which already owns this decoder.


  Exercise registry misses and caller-visible validation through real inference requests. End-user rows
  live in B860 Postgres fixtures (POSTGRES_TEST_URL when available, otherwise testcontainers); use fixed
  cache clocks to prove the separate valid and invalid TTLs without timing-dependent sleeps.


  Write betterlite-config::end_user_identity::tests::validation_default_off, budget_id_none_and_empty,
  mapping_dict_and_list, deprecated_header_loads and malformed_mapping_entries_skipped.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  Sizing: 208 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  220 production, 260 behavior/Postgres tests, 75 adapters, 65 wiring and 60 config lines,
  680 within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::end_user_identity::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
