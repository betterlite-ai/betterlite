dod:
  - text: Every Hub request carries huggingface_hub's headers and goes through the same hook, with the offline error, the trace id, the debug log and the warning header handled the same way.
    proof: [hub-requests]
  - text: Retries, waits, Retry-After and the last-try rule match huggingface_hub's backoff functions.
    proof: [hub-retries]
  - text: Every Hub error class comes back as its own typed variant in hf_raise_for_status's order, with status, URL, server message and request id.
    proof: [hub-errors]
  - text: File metadata, redirects, the token drop, resume and the size check match get_hf_file_metadata and http_get.
    proof: [hub-metadata-and-get]
  - text: The response header parsers have a fuzz target and a committed corpus that replays.
    proof: [hub-response-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: hub-requests
      why: the request test is missing or a header, hook step or warning differs from huggingface_hub
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^hub_client::tests::requests_follow_huggingface_hub($|::)/)'
    - id: hub-retries
      why: the retry test is missing or a retry, wait or last-try result differs from huggingface_hub
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^hub_client::tests::retries_follow_huggingface_hub($|::)/)'
    - id: hub-errors
      why: the error test is missing or an error class, its order or its facts differ from huggingface_hub
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^hub_client::tests::errors_follow_huggingface_hub($|::)/)'
    - id: hub-metadata-and-get
      why: the metadata and GET test is missing or a URL, redirect, header or byte count differs from huggingface_hub
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^hub_client::tests::metadata_and_get_follow_huggingface_hub($|::)/)'
    - id: hub-response-corpus
      why: the fuzz target or a new corpus file is missing, or the replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-http/fuzz/corpus/hub_response)"
        && test -f crates/betterlite-http/fuzz/fuzz_targets/hub_response.rs
        && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^hub_client::tests::replays_the_hub_response_corpus($|::)/)'
oracle_cases: []
deviations:
  - what: The User-Agent is "betterlite/{version}", plus "; origin/{HF_HUB_USER_AGENT_ORIGIN}" when set, where huggingface_hub sends "unknown/None; hf_hub/1.32.0; python/{version}" and the versions of torch and other installed Python packages.
    why: >-
      betterlite has no Python, torch or fastai, so those parts would be made up. The Hub uses the user agent for statistics only.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/utils/_headers.py#L157-L201
  - what: Files stored with Xet download over plain HTTP from the resolve URL, as huggingface_hub does with HF_HUB_DISABLE_XET=1. LiteLLM's lock installs hf-xet on x86_64 and arm64, so there huggingface_hub fetches those files through Xet.
    why: >-
      The Hub serves the same bytes over HTTP for every file, and no Rust Xet client is pinned. The file on disk and its etag are the same.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/file_download.py#L494-L601
  - what: The GET sends no Accept-Encoding, where httpx asks for gzip and deflate.
    why: >-
      reqwest is built without its gzip feature, so the server sends the file as is. The bytes written to disk are the same, since httpx decodes the body before http_get writes it.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/file_download.py#L299-L331
out_of_scope:
  - The env settings, paths and token lookup belong to B5085; OIDC and OAuth refresh belong to B5088.
  - The cache folder, locks, symlinks and the cache fallback belong to B5087.
  - HF_DEBUG's curl log, the progress bars, telemetry and hf_transfer are not on the tokenizer path and are not built.
  - close_session after a ConnectError resets a Python client pool; reqwest manages its own pool, so there is nothing to port.
pitfalls:
  - _parse_retry_after reads only a value made of digits, so a Retry-After of "1.5" or an HTTP date falls back to the doubling wait.
  - http_stream_backoff retries only status codes, never exceptions; http_get's own loop retries the connection errors.
  - get_hf_file_metadata follows a redirect only when it stays on the same host or a Hub host; a redirect to another host, such as the CDN, ends the loop and its Location becomes the metadata location.
  - _normalize_etag uses lstrip("W/") and so removes any run of the characters "W" and "/" from the left, not just the prefix "W/".
  - The authorization header must not follow a redirect to a host outside url_hosts, such as the CDN that serves the file.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
