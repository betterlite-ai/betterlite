id: B5086
title: Hugging Face Hub requests and file metadata like huggingface_hub
description: >-
  LiteLLM reaches the Hugging Face Hub through one call: tokenizers' Tokenizer.from_pretrained asks huggingface_hub 1.32.0 for hf_hub_download(repo_id, "tokenizer.json", revision, token) (tokenizers v0.23.1 tokenizer.rs L786-L812). This task builds the request layer under that download in crates/betterlite-http/src/hub_client.rs and hub_client/**: the client, headers, the per-request hook, retries, Hub errors, the HEAD that reads file metadata and the streamed GET. B5087 builds the cache folder on top. Port the huggingface_hub functions in the references for the path a tokenizer download reaches and match what they do on the wire: the same requests, headers, retries, sleeps, warnings and logs, and the same error kinds in the same order. Messages are betterlite's own (docs/compatibility.md) but carry the same facts: status, URL, server message and request id.


  Client. HubClient::new takes B5085's settings and token lookup, a ProxiedClient from B173 built with the env proxy settings (httpx trusts the environment by default, and LiteLLM's DISABLE_AIOHTTP_TRUST_ENV does not reach huggingface_hub), a clock and a sleeper. Like default_client_factory it follows redirects and takes its timeout per call. When B5085 says hf_transfer_deprecated, log huggingface_hub's FutureWarning text once when the client is built. Before writing the client, compare the hf-hub crate and say in the PR why it does or does not fit; use it only if every check below passes with it.


  Headers and hook. Build headers like build_hf_headers and _http_user_agent: authorization "Bearer {token}" when B5085's resolve returns a token, and the user agent (see the deviation). Every request, redirects included, goes through the hook hf_request_event_hook describes: fail with an offline error when B5085's offline flag is set, add X-Amzn-Trace-Id from X-Request-Id or a new uuid4, and log at debug "Request {id}: {method} {url} (authenticated: {bool})". Download calls add the header flag_as_download_call sets. Read X-HF-Warning on every response and log each topic once (_warn_on_warning_headers); the seen set belongs to the client, not to module state.


  Retries. Port _http_backoff_base, http_backoff and http_stream_backoff with their defaults, status lists, exception lists, wait doubling, Retry-After handling (digits only, through _parse_retry_after), their log texts and the last-try rule: after the last allowed try a retry status goes through hf_raise_for_status, and a non-retry status is returned. Port parse_ratelimit_headers for the 429 text. Sleeps go through the injected sleeper.


  Errors. hf_raise_for_status becomes a typed HubError enum with one variant per error class, checked in the same order: repository not found or gated or disabled, revision not found, entry not found, bad request, forbidden, range not satisfiable, then the generic HTTP error. Bucket and job branches can't be reached from a model file download and are not built. Each variant keeps the status, the URL, the server message from X-Error-Message or the JSON body, and the request id from X-Request-Id, X-Amzn-Trace-Id or X-Amz-Cf-Id.


  Metadata and GET. hf_hub_url builds "{endpoint}/{repo_id}/resolve/{revision}/{filename}" with huggingface_hub's quoting. get_hf_file_metadata sends HEAD with Accept-Encoding identity, follows redirects itself through _httpx_follow_hub_redirects_with_backoff (only to the same host or a Hub host, with the same redirect cap), drops authorization when the final location leaves the Hub hosts from B5085's url_hosts, and returns commit hash, normalized etag (_normalize_etag), location and size from the headers it names. http_get streams the file into a writer the caller passes, sends the Range header from _adjust_range_header when resuming, retries a ConnectError, timeout or protocol error the way it does (count, warning text, 1-second sleep, counter reset after data), and checks the byte count against the expected size with the same error.


  Tests. The tests run a local Hub on 127.0.0.1 and point B5085's endpoint at it. hub_client::tests::requests_follow_huggingface_hub covers headers, the hook, the trace id, the offline error and the warning header. hub_client::tests::retries_follow_huggingface_hub covers every retry status, Retry-After, the last try and the sleeps. hub_client::tests::errors_follow_huggingface_hub covers every error variant and request id source. hub_client::tests::metadata_and_get_follow_huggingface_hub covers the URL quoting, relative and cross-host redirects, the dropped token, etag normalization, resume and the size check. hub_client::tests::replays_the_hub_response_corpus feeds each corpus file to the header parsers.
scope:
  paths:
    - crates/betterlite-http/src/hub_client.rs
    - crates/betterlite-http/src/hub_client/**
    - crates/betterlite-http/Cargo.toml
    - crates/betterlite-http/fuzz/Cargo.toml
    - crates/betterlite-http/fuzz/fuzz_targets/hub_response.rs
    - crates/betterlite-http/fuzz/corpus/hub_response/**
    - Cargo.toml
    - Cargo.lock
  lint_tables: false
references:
  - url: https://github.com/huggingface/tokenizers/blob/v0.23.1/bindings/python/src/tokenizer.rs#L786-L812
    why: from_pretrained calls hf_hub_download for tokenizer.json with the revision and an optional token, and passes no user agent.
