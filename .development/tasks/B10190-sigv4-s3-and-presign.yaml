id: B10190
title: The S3 signer and the ElastiCache and RDS presigners sign through betterlite-sigv4
description: >-
  Three SigV4 signers are left once B10191 lands, and each builds the aws-sigv4 identity, signing parameters and signable request itself instead of calling betterlite-sigv4 (lines at main 6a51ccf2b26). A fourth already calls it after B10173 but in the wrong mode: betterlite-rag signs its S3 requests the way it signs Bedrock Agent.


  The S3 signer. betterlite-logging's `sign_request` (crates/betterlite-logging/src/s3_transport/signing.rs L67-L122) ports botocore's S3SigV4Auth, which LiteLLM's S3 logger and Bedrock file uploads both call (references): the default settings with the path signed as sent and single percent encoding (L91-L97), the payload hash taken from the caller. Its `Credentials` (L21-L26) has the same three fields as betterlite_sigv4's. Five places call it: `put_attempt` in s3_transport/upload.rs L104, `object_request` in download.rs L33, `signed_upload_headers` in finops/focus/destinations/focus_s3_destination.rs L154, betterlite-bedrock's `sign_s3_request` (crates/betterlite-bedrock/src/s3_signing/signer.rs L123-L138) and betterlite-server's `S3Reader::signed_headers` (crates/betterlite-server/src/bucket_config/s3_reader.rs L172-L180). The last two also copy betterlite-bedrock's Credentials into logging's field by field (signer.rs L132-L136, s3_reader.rs L143-L147). B10173 gives `Signable` the mode `SigningMode::S3SigV4Auth` with exactly those settings, so the signer goes. In s3_transport/signing.rs, `RequestToSign` and `sign_request` go, the private `SERVICE` becomes `pub const S3_SERVICE: &str = "s3";`, and the struct becomes `pub use betterlite_sigv4::credentials::Credentials;`, so its importers (server, legacy_s3, s3_batch, focus and the b3993 oracle helper) stay as they are. CredentialError, CredentialSource, StaticCredentials, Clock and SystemClock stay. Each of the five callers builds a betterlite_sigv4 Signable with its method, URL and headers, its body (the PUT body in upload.rs, focus and Bedrock, an empty slice for the two GETs), S3_SERVICE, the region, the credentials, `now` and `S3SigV4Auth`, and calls sign_request. Every caller already sends x-amz-content-sha256 in those headers, so B10173's `payload` signs that hash just as `RequestToSign.content_sha256` did. S3TransportError's `Parameters` and `Signing` (s3_transport/error.rs L34-L37) become one `Signing(#[from] SigV4Error)` with the text "the S3 request could not be signed". betterlite-bedrock's `S3SigningError::Sign` (s3_signing.rs L59-L60) keeps its text and its box and wraps SigV4Error, and `From<S3TransportError>` (L70-L74) becomes `From<SigV4Error>`, so the test at s3_signing/tests/signer.rs L310 still matches `Sign`. The Bedrock signer passes `credentials` straight in, and its SIGNED_HEADERS lookup (signer.rs L25-L30, L139-L143) compares names with eq_ignore_ascii_case, since the returned names are now botocore's spelling. betterlite-server's `S3Reader.credentials` takes the shared type, so L143-L147 becomes `Some(credentials)`. betterlite-logging drops aws-sigv4 and aws-smithy-runtime-api, which nothing uses after B10191 and this task; betterlite-server adds betterlite-sigv4.


  betterlite-rag's S3 calls. The RAG client's `signed_request_with` (crates/betterlite-rag/src/bedrock_ingestion/client.rs L123-L163) signs every service the Bedrock ingestion reaches through one Signable, and B10173 gives it mode `SigV4Auth`. Two of those requests go to S3: `create_bucket` (bedrock_ingestion/resources.rs L205-L233) and the provisioning `put_object` (bedrock_provisioning/calls/s3.rs L19-L44, sent by provision.rs L217-L230). LiteLLM makes both through boto3's S3 client (`_get_boto3_client("s3")`, then `create_bucket` and `put_object`, references), and botocore signs every S3 client request with S3SigV4Auth whatever the call. `object_key` (calls/s3.rs L11-L17) already percent-encodes each key segment, so the default mode encodes its `%` a second time in the canonical path, and S3 answers SignatureDoesNotMatch for a key with a space or any other encoded byte. The Signable at client.rs L139 sets `mode` to `SigningMode::S3SigV4Auth` when `request.service == S3_SERVICE` (client.rs L28) and to `SigningMode::SigV4Auth` otherwise. That is botocore's own rule, a signer per service, and S3 Vectors, Bedrock Agent, STS, IAM and OpenSearch Serverless keep SigV4Auth because their botocore models say v4.


  The presigners. ElastiCache's `presign_connect_url` (crates/betterlite-config/src/sections/redis_credentials/aws.rs L89-L133) and RDS's `db_auth_token` (crates/betterlite-db/src/rds_credentials/signer.rs L40-L75) are the same steps twice: an identity, default settings with `SignatureLocation::QueryParams` and an expiry, a GET with an empty body, `sign`, then the query parameters appended to the operation's own query. Both port botocore's SigV4QueryAuth: ElastiCache calls it directly and RDS through boto3's generate_db_auth_token (references). sign.rs gains `pub fn presign_request(request: &Signable<'_>, expires_in: Duration) -> Result<Vec<(String, String)>, SigV4Error>`. It signs with the mode's settings, the signature location QueryParams and `expires_in`, and answers the parameters unencoded in botocore's order: X-Amz-Algorithm, X-Amz-Credential, X-Amz-Date, X-Amz-Expires, X-Amz-SignedHeaders, X-Amz-Security-Token when the credentials carry one, and X-Amz-Signature last. aws-sigv4 puts the token after the signature; botocore appends the signature at the very end, as the pinned RDS answers show (crates/betterlite-db/src/rds_credentials/fixtures/botocore-1.43.118.json L81). sign_request and presign_request share one private function in sign.rs that builds the identity, the parameters and the signable request and signs, so the steps exist once.


  ElastiCache calls presign_request with GET, `https://{cache_name}/?{connect_query}`, no headers, an empty body, service elasticache, the region, `Credentials::from(&credentials)` (B10191's From impl), `now`, `SigV4Auth` and `Duration::from_secs(token_ttl_seconds)`, and appends the pairs with form_urlencoded as it does now. ElastiCacheSigningError's `SigningParams`, `SignableRequest` and `Sign` (aws.rs L56-L70) become one `Sign { #[source] source: SigV4Error }` with "failed to sign the ElastiCache connect request: {source}"; `AwsCredentialsResolver` and the `Credentials` variant keep the aws type. betterlite-config drops aws-sigv4 and aws-smithy-runtime-api (only aws.rs uses them), keeps aws-credential-types and adds betterlite-sigv4. RDS calls presign_request with GET, its URI, the one host header `signed_host` gives (that function stays: botocore signs the lowercase host without the default port, L49-L50 and L78-L84), an empty body, service rds-db, the region, `Credentials::from(&self.session.credentials)`, the clock's now, `SigV4Auth` and `Duration::from_secs(RDS_TOKEN_LIFETIME_SECONDS)`. `token_query` (L86-L101) loses its signature argument and the special case and appends every pair encoded with RDS_ESCAPE. RdsCredentialsError's `SigningParams`, `SignableRequest` and `Sign` (error.rs L69-L83) become one `Sign { #[source] source: SigV4Error }` with "signing the RDS authentication token failed". betterlite-db drops aws-sigv4 (the `aws_sigv4` in its MCP tests is a string), keeps aws-smithy-runtime-api and aws-credential-types and adds betterlite-sigv4.


  Tests. betterlite-sigv4's sign/tests.rs takes the S3 answers that leave with s3_transport/signing.rs, with the same inputs (crates/betterlite-logging/src/s3_transport/signing/tests.rs L12-L58): `s3_sigv4_auth_signs_a_put_like_botocore` (PUT_AUTHORIZATION, X-Amz-Date, the token), `s3_sigv4_auth_signs_a_get_like_botocore` (GET_AUTHORIZATION), `s3_sigv4_auth_sends_no_token_without_one`, `s3_sigv4_auth_signs_the_payload_hash_header` (a different x-amz-content-sha256 value changes the signature) and `s3_sigv4_auth_signs_the_path_as_sent`. That file keeps only `the_system_clock_reads_the_current_time`. The presign tests are `presign_matches_the_botocore_elasticache_answer` (GET https://cache.example/?Action=connect&User=app, elasticache, eu-west-1, the Unix epoch, 900 seconds, key AKIAIOSFODNN7EXAMPLE, signature e1e4ce13c45cfa056cbbb7bf8235fe64d59d0f2b10176bea67739664779bcfd4 from crates/betterlite-config/src/sections/redis_credentials/tests.rs L557-L566), `presign_puts_the_security_token_before_the_signature` and `presign_signs_the_expiry` (X-Amz-Expires is the given seconds). redis_credentials/tests.rs gains `elasticache_provider_puts_the_session_token_before_the_signature`. upload/tests.rs L522-L541 and download/tests.rs L252-L270 compute their expected Authorization with the shared signer and find it ignoring case, and s3_reader/tests.rs L245-L294 and module_download/tests.rs L108 and L144 compare names ignoring case. The RDS botocore answers, the ElastiCache answer in config, the S3 log transport and Bedrock S3 helper cases must pass unchanged. betterlite-rag's bedrock_ingestion/client/tests.rs gains `client_signs_s3_with_the_path_as_sent`, a signed_request_with PUT to https://example-bucket.s3.us-west-2.amazonaws.com/docs/my%20file.pdf with its x-amz-content-sha256 header that sends the Authorization betterlite_sigv4's sign_request gives the same request in mode S3SigV4Auth, which differs from the SigV4Auth one, and `client_signs_other_services_in_the_default_mode`, the same check for service bedrock on the path /knowledgebases/KB%201/datasources/ in mode SigV4Auth.


  What users see: S3 requests carry Authorization, X-Amz-Date and X-Amz-Security-Token in botocore's spelling instead of lowercase, as LiteLLM sends them; header names are case-insensitive on the wire. An ElastiCache token built from credentials with a session token now lists X-Amz-Security-Token before X-Amz-Signature, as LiteLLM's does. betterlite-rag uploads a file whose S3 key needs percent-encoding, and S3 no longer refuses it. Nothing else changes.
