    why: botocore resolves s3v4 for every S3 client, which auth.py L1218 maps to S3SigV4Auth.
dod:
  - text: betterlite-logging has no S3 signer or Credentials struct of its own, no caller converts Credentials field by field, and logging, config and db build no aws-sigv4 signing parameters and drop aws-sigv4.
    proof: [no-signing-copies]
  - text: The S3SigV4Auth mode matches botocore's S3 answers, and presign_request matches botocore's ElastiCache answer, orders the token before the signature and signs the expiry.
    proof: [sigv4-tests]
  - text: S3 log uploads and downloads, FOCUS S3 deliveries, Bedrock S3 uploads and bucket config reads still sign as LiteLLM does.
    proof: [no-signing-copies, s3-transport-tests, s3-transport-cases, bedrock-s3-tests, bedrock-s3-cases, server-s3-tests]
  - text: ElastiCache and RDS tokens still match botocore, and an ElastiCache token with a session token lists it before the signature.
    proof: [no-signing-copies, elasticache-token-order, redis-credentials-tests, redis-credentials-cases, rds-tests]
  - text: betterlite-rag signs CreateBucket and PutObject with S3SigV4Auth, the path as sent, and every other service it calls with SigV4Auth, as boto3's clients do.
    proof: [rag-s3-signing, rag-tests]
checks:
  optional: [mutants]
  commands:
    - id: no-signing-copies
      why: a crate still builds its own aws-sigv4 signing parameters, logging keeps its S3 signer or Credentials struct, a caller still copies credentials field by field, or a crate that no longer signs keeps aws-sigv4
      run: test -z "$(grep -rlE 'v4::SigningParams|SigningSettings|SignableRequest|aws_sigv4' crates/betterlite-logging/src crates/betterlite-config/src crates/betterlite-db/src/rds_credentials)" && test -z "$(grep -rnE 'RequestToSign|SigningCredentials' crates/betterlite-logging/src crates/betterlite-bedrock/src/s3_signing crates/betterlite-server/src/bucket_config)" && test -z "$(grep -n 'pub struct Credentials' crates/betterlite-logging/src/s3_transport/signing.rs)" && test -z "$(grep -nE '^aws-sigv4 ' crates/betterlite-logging/Cargo.toml crates/betterlite-config/Cargo.toml crates/betterlite-db/Cargo.toml)"
    - id: sigv4-tests
      why: the S3 mode or presign_request is missing, signs differently from botocore, or orders the token after the signature
      run: grep -q "fn presign_request" crates/betterlite-sigv4/src/sign.rs && cargo nextest run --locked -p betterlite-sigv4 --no-tests=fail -E 'test(/^sign::tests::/)'
    - id: s3-transport-tests
      why: an S3 log upload, download or FOCUS delivery lost a signed header or its error mapping
      run: grep -q S3SigV4Auth crates/betterlite-logging/src/s3_transport/upload.rs && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E '(test(/^s3_transport::/) | test(/^finops::focus::(.*::)?focus_s3_destination::/) | test(/^(s3_batch|legacy_s3|s3_audit)::/)) - test(/replays_the_/)'
    - id: s3-transport-cases
      why: the S3 log transport helper cases no longer match LiteLLM's signed requests
      run: grep -q S3SigV4Auth crates/betterlite-logging/src/s3_transport/upload.rs && cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-logging -- tools/oracle/cases/s3_log_transport
    - id: bedrock-s3-tests
      why: the Bedrock S3 upload lost a signed header, its botocore order or its error variant
      run: grep -q betterlite_sigv4 crates/betterlite-bedrock/src/s3_signing/signer.rs && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^s3_signing::/) - test(/replays_the_/)'
    - id: bedrock-s3-cases
      why: the Bedrock S3 signing helper cases no longer match LiteLLM's signed upload
      run: grep -q betterlite_sigv4 crates/betterlite-bedrock/src/s3_signing/signer.rs && cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-bedrock -- tools/oracle/cases/helpers/providers/bedrock-services-s3-signing
    - id: server-s3-tests
      why: a bucket config read or module download is no longer signed
      run: grep -q S3SigV4Auth crates/betterlite-server/src/bucket_config/s3_reader.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bucket_config::(s3_reader|module_download)::/)'
    - id: elasticache-token-order
      why: an ElastiCache token with a session token still lists it after the signature
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::redis_credentials::tests::elasticache_provider_puts_the_session_token_before_the_signature$/)'
    - id: redis-credentials-tests
      why: the ElastiCache token or the server's Redis IAM auth changed
      run: grep -q presign_request crates/betterlite-config/src/sections/redis_credentials/aws.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::redis_credentials::/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^redis_cloud_auth::/)'
    - id: redis-credentials-cases
      why: the Redis credential helper cases no longer match LiteLLM
      run: grep -q presign_request crates/betterlite-config/src/sections/redis_credentials/aws.rs && cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-config -- tools/oracle/cases/helpers/redis-credentials
    - id: rds-tests
      why: an RDS token no longer matches botocore's answers or maps its signing error
      run: grep -q presign_request crates/betterlite-db/src/rds_credentials/signer.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^rds_credentials::/)'
    - id: rag-s3-signing
      why: betterlite-rag still signs S3 in the default mode, or moved another service off it
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::client::tests::client_signs_s3_with_the_path_as_sent$/)' && cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::client::tests::client_signs_other_services_in_the_default_mode$/)'
    - id: rag-tests
      why: the mode choice broke a RAG ingestion, provisioning or S3 Vectors request
      run: grep -q S3SigV4Auth crates/betterlite-rag/src/bedrock_ingestion/client.rs && cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^(bedrock_ingestion|bedrock_provisioning|s3_vectors_ingestion|s3_vectors_search|s3_vectors_workflow)::/) - test(/replays_the_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The five header signers in betterlite-secret-managers, betterlite-logging's SQS and DynamoDB, betterlite-http and betterlite-openai: B10191."
  - "The credential side: ElastiCache's AwsCredentialsResolver, RDS's credential selection and STS flows, the S3 CredentialSource and the server's resolve_credentials keep their types and logic, since the credential chain is B10174 and B10175 work."
  - "S3 presigning (botocore's S3SigV4QueryAuth with UNSIGNED-PAYLOAD): nothing presigns S3."
pitfalls:
  - "Compare the service with S3_SERVICE exactly: S3 Vectors' `s3vectors` starts with s3 but botocore signs it with SigV4Auth, and Bedrock Agent paths such as /knowledgebases/KB%201%2F2/ keep their double encoding."
  - "aws-sigv4 returns X-Amz-Signature before X-Amz-Security-Token; presign_request moves the signature to the end, and RDS's token_query must not add it a second time."
  - "s3_transport/signing.rs's `pub use` must keep the name Credentials: server, legacy_s3, s3_batch, focus and tools/oracle/src/helpers/logging/b3993.rs import it from there, and helper files stay as they are."
  - "The S3 callers' header lists already hold x-amz-content-sha256 in LiteLLM's position; keep it there and let payload read it, rather than switching to aws-sigv4's XAmzSha256 checksum kind, which appends a second copy."
  - "server s3_reader/tests.rs L245-L247 still expects x-amz-content-sha256 first: only the signed headers' spelling changes, not the order of the prepared ones."
  - "ElastiCache's known answer at redis_credentials/tests.rs L557-L566 has no session token, so it keeps passing; the new order shows only in the new test."
  - "RDS_ESCAPE stays in betterlite-db: presign_request answers unencoded values and each presigner keeps the encoding botocore gives its query."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
