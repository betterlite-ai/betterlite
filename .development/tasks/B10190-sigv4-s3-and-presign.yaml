    why: _sign_put, S3SigV4Auth over the PUT the S3 log transport ports.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L936-L971
    why: the S3 GET signed with S3SigV4Auth and the empty-body x-amz-content-sha256 header.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/files/transformation.py#L1125-L1172
    why: the Bedrock file upload signed with S3SigV4Auth, which betterlite-bedrock's sign_s3_request ports.
