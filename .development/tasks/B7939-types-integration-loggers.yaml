out_of_scope:
- >-
  slack_alerting, the interception configs and the Bedrock knowledge base types are in B7940. Prometheus is in B7937 and B7938.
pitfalls:
- >-
  `DDLLMObsError` and `Message` in `datadog_llm_obs.py` are TypedDicts with short names; keep the names, since callers import them by module.
- >-
  `langfuse_otel.py` and `weave_otel.py` each define a span attribute Enum (`LangfuseSpanAttributes`, `WeaveSpanAttributes`). Compare every value, since the strings are the attribute keys sent to the backend.
dod:
- text: Every name in the covered LiteLLM files exists with the same keys, required keys, Literal values, Enum members and field defaults.
  proof: [names]
- text: Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: names
    why: A name, key or value differs from LiteLLM.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_integration_loggers.py -k names
  - id: python-lint
    why: Strict typing has to hold for every ported module.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Names imported from the openai, httpx or pydantic packages are replaced by local equivalents or left out.
  why: The wheel depends only on python-dotenv.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
