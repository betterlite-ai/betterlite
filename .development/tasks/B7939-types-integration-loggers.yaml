id: B7939
title: Python types for logger integrations argilla to zerobus (types/integrations, observability and storage)
description: >-
  This task ports the small logger integration type files into `crates/betterlite-python/python/betterlite/types/integrations/`: `argilla`, `arize`, `arize_phoenix`,
  `azure_sentinel`, `base_health_check`, `cloudzero`, `custom_logger`, `datadog`, `datadog_cost_management`, `datadog_llm_obs`,
  `datadog_metrics`, `gcs_bucket`, `langfuse`, `langfuse_otel`, `langsmith`, `newrelic`, `pagerduty`, `pointfive`, `posthog`, `s3_v2`,
  `weave_otel` and `zerobus`. It is Python only.


  `custom_logger.py` is the base for the others: `StandardCustomLoggerInitParams` (pydantic), which `AzureSentinelInitParams`,
  `DatadogInitParams`, `DatadogCostManagementInitParams`, `NewRelicInitParams`, `PointFiveInitParams` and `ZerobusInitParams` extend.
  It also has `AgenticLoopSafetyError(ValueError)`, `AgenticLoopRequestPatch`, `AgenticLoopPlan` and two functions,
  `is_interception_internal_key` and `converted_stream_requested`. `CBFRecord` in `cloudzero.py` subclasses `dict[str, Any]`. Some files
  use `NamedTuple` (`CredentialsKey` in langsmith.py) or plain classes (`BatchGroup`, `NewRelicMetricRecord`, `PointFiveUploadTarget`,
  `PointFiveUploadFailure`, `ZerobusConnection`, `ZerobusAccessToken`, `ZerobusIngestFailure`). `StandardLoggingUserAPIKeyMetadata`, used by
  `PagerDutyInternalEvent`, comes from `types/utils.py` (B5657's area). The OTEL files each define a pydantic config and a `str` Enum of span
  attribute names.
