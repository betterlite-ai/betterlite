id: B4115
title: Execute intercepted searches and standalone search turns
description: >-
  Build search execution with configured credentials/options, rich-input capability checks
  and Perplexity fallback, plus the search-only Messages short circuit. Preserve the native
  versus text synthetic response shapes and let search failures become typed outcomes at the
  same boundary as the source.

  Implement crates/betterlite-websearch/src/execution.rs with six entry points on
  WebSearchExecution:

  - `try_short_circuit_search(model, messages, tools, custom_llm_provider, kwargs)`
    detects web-search-only Messages requests, executes the search directly, and returns
    a synthetic Anthropic response with server_tool_use + web_search_tool_result + text
    content blocks for native clients (via is_anthropic_native_web_search_tool), or just
    text block for non-native callers. Returns None to continue normal routing if not a
    short-circuit candidate. Reuses B4111's is_web_search_tool and B219's get_last_user_message.
    Does not call _execute_search directly; delegates to _short_circuit_search_outcome.

  - `_short_circuit_search_outcome(query, kwargs)` executes the search through _execute_search
    and converts both successful results and exceptions to SearchOutcome (SearchSucceeded or
    SearchFailed). Catches every exception from _execute_search, including authorization
    failures, and passes the exception type to WebSearchTransformation.search_outcome
    for error classification.

  - `_rich_search_input(tool_input)` extracts optional objective and up-to-five search_queries
    from a tool input dict, returning RichWebSearchInput or None. Reuses B4111's RichWebSearchInput
    typedef.

  - `_provider_supports_rich_search(search_provider)` checks whether the provider's BaseSearchConfig
    accepts objective + multi-query input via ProviderConfigManager.get_provider_search_config().
    Returns false if search_provider is missing or config is None.

  - `_execute_search(query, kwargs, rich)` executes a single search via litellm.asearch with
    configured credentials/options. Calls B4114's _select_search_tool_from_router, _authorize_search_tool,
    _selected_search_tool_name, _get_user_api_key_auth_from_kwargs, _get_parent_request_correlation,
    _build_search_request_metadata. Reads litellm_params from search_tool config, extracts
    search_provider and passes remaining values to litellm.asearch. Forwards rich input only
    to providers whose config.supports_rich_search_input() is true. Builds metadata for spend
    tracking against the originating key/team. Falls back to perplexity if no search_provider
    is configured. Returns (formatted_text, SearchResponse | None) so callers preserve both
    the text for follow-up LLM calls and the structured SearchResponse for building native
    web_search_tool_result blocks. Calls B4113's WebSearchTransformation.format_search_response
    to format results as text. Raises exceptions on provider/authorization/network failures;
    _short_circuit_search_outcome catches and converts to SearchFailed.

  - `_create_empty_search_result()` returns ("No search query provided", None) for tool calls
    without queries.

  Preserve native versus text response shapes: when a native Anthropic tool is present,
  emit both web_search_tool_result blocks (one server_tool_use, one web_search_tool_result
  with success or error variant, one text block); when only text is expected, emit single
  text block. Each web_search_tool_result block is built by B4113's build_web_search_outcome_block,
  which returns either build_web_search_tool_result_block (with results list) or
  build_web_search_tool_result_error_block (with error_code: too_many_requests |
  invalid_tool_input | unavailable) based on the SearchOutcome variant.

  Configuration keys: search_tool_name, search_provider, objective (under litellm_params of each
  configured search tool). Environment variable fallback: none (search_provider defaults to
  perplexity). Pinned defaults: enabled_providers=['bedrock'] when absent, empty list when
  present.

  Write oracle cases under tools/oracle/cases/chat/ covering:
  - Successful short-circuit search with native tool → three content blocks
  - Successful short-circuit search without native tool → text block only
  - Short-circuit on provider not in enabled list → returns None
  - Short-circuit when provider handles_web_search_natively → returns None
  - Tools present but not all are web search → returns None
  - No query in last user message → returns None
  - Provider search config supports rich input → queries passed as list
  - Provider search config does not support rich input → query passed as string
  - Rate limit error in _execute_search → web_search_tool_result error block
  - Invalid tool input error → web_search_tool_result error block
  - Other exception → web_search_tool_result error block (unavailable)
  - Rich search input validation (up to 5 queries, non-empty strings)
  - Perplexity fallback when no router or no search tools

