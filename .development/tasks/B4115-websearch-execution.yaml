dod:
  - text: >-
      try_short_circuit_search returns a synthetic Anthropic response with server_tool_use,
      web_search_tool_result, and text blocks when native_tool is present; returns response
      with text block only when native_tool is None; returns None on non-short-circuit paths.
      web_search_tool_result blocks carry success variant (with results list) or error variant
      (with error_code: too_many_requests, invalid_tool_input, or unavailable).
    proof:
      - oracle
  - text: >-
      _short_circuit_search_outcome catches every exception from _execute_search, converts both
      search results and exceptions to SearchOutcome (SearchSucceeded or SearchFailed), and
      passes the exception to search_error_code for error classification.
    proof:
      - oracle
  - text: >-
      _rich_search_input extracts objective and up-to-five search_queries from tool input,
      returning RichWebSearchInput {objective?, search_queries?} or None.
    proof:
      - websearch-execution-tests
  - text: >-
      _provider_supports_rich_search returns true only when search_provider config exists
      and its supports_rich_search_input() is true.
    proof:
      - websearch-execution-tests
  - text: >-
      _execute_search calls _authorize_search_tool before litellm.asearch. Authorization exceptions
      are caught by _short_circuit_search_outcome and converted to SearchFailed.
    proof:
      - oracle
  - text: >-
      _execute_search reads search_provider and configured_search_kwargs from search_tool's
      litellm_params, forwards search_provider and configured_search_kwargs to litellm.asearch
      along with rich input (queries as list if provider supports it, query string otherwise).
    proof:
      - oracle
  - text: >-
      _execute_search returns (formatted_text, SearchResponse | None) with text formatted by
      WebSearchTransformation.format_search_response and SearchResponse preserved for native
      blocks.
    proof:
      - websearch-execution-tests
  - text: >-
      Every listed oracle case exercises the production operation and asserts exact response
      shape, content blocks, error codes and status; only /error/message may be ignored for
      betterlite wording.
    proof:
      - oracle

