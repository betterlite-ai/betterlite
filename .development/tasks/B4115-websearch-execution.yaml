deviations:
  - what: >-
      betterlite calls B4114's authorization functions directly (not through a search-execution
      wrapper), preserving the exact Python structure where _authorize_search_tool checks key first,
      then team.
    why: Faithful port of LiteLLM behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/websearch_interception/handler.py#L1626-L1668

out_of_scope:
  - Search tool configuration and callback initialization (B4116).
  - Search loop eligibility checks and agentic reruns (B4117).
  - Search result messages and native citation blocks (B4113).
  - Search tool selection authorization (B4114).
  - Streaming search calls (pre-converted to non-streaming by earlier hooks).
  - litellm.asearch provider implementation and search response parsing.
  - Spend logging and metadata attribution (handled by litellm.asearch and B247).

pitfalls:
  - try_short_circuit_search checks ProviderConfigManager.get_provider_anthropic_messages_config
    to avoid short-circuiting providers that handle web search natively (bedrock, vertex_ai,
    azure_ai, anthropic); github_copilot has a config but returns handles_web_search_natively()
    false, so short-circuit runs for it.
  - _short_circuit_search_outcome catches every exception from _execute_search, including
    authorization failures raised by _authorize_search_tool, and converts all exceptions to
    SearchFailed via WebSearchTransformation.search_outcome, passing the exception type for
    error_code classification.
  - Rich search input is passed to litellm.asearch only when _provider_supports_rich_search
    returns true; all other providers receive query as a string, not a list.
  - web_search_tool_result blocks come from WebSearchTransformation.build_web_search_outcome_block,
    which returns either success (with results list) or error (with error_code) variant based on
    SearchOutcome type.
  - _execute_search forwards search credentials only when configured (search_tool.litellm_params).
    When no search tool is configured, it falls back to perplexity without explicit credentials.

review_level: security
