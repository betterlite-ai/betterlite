deviations: []
out_of_scope:
  - "main.py _oidc_token_cache_ttl, _get_oidc_allowed_credential_dirs, _resolve_oidc_file_path, _get_oidc_http_handler, _OidcTokenClaims and OIDC boundary constants: B4411."
  - "main.py str_to_bool, get_secret_str, get_secret_bool and get_secret, including the Google, GitHub, Azure, file and env_path OIDC branches, manager dispatch and environment fallback: B8500. This task adds HTTP evidence and changes none of those functions."
  - "main.py normalize_nonempty_secret_str, secret_manager_would_be_consulted and _should_read_secret_from_secret_manager: B4410; its earlier boolean helper remains B4410's, while B8500 owns the lookup's string-to-bool behavior."
  - "get_azure_ad_token_provider.py infer_credential_type_from_environment and get_azure_ad_token_provider, including every credential-selection branch: B677, whose covers includes that file."
  - "Manager implementations, transport-level operations and their existing helper evidence: B4412-B4421. AWS/Vault/CyberArk write and rotation operations are called by the virtual-key owners, not by a new secret-manager HTTP route."
  - "Production manager selection and Azure Key Vault construction: B8590; production OIDC/Azure lookup ports: B8612; lifespan and Shared composition: B8613 and B8610. Config reload/resolution is B8379's path with B002's loader; it is not implemented in an oracle adapter."
  - "Vault/CyberArk override runtime state and routes: B1646-B1648 and B8383. Guardrail initializer consumers and registry arms: B8290 and B8521. AzureBlobStorageLogger and the Azure file backend: B4000 and B1026."
  - "Chat handlers and aliases belong to their existing server route owners. B8650 mounts cache routes; B8626, B8701 and B8728 mount MCP routes. No mount belongs to this task."
  - "The three-line Readme.md contains no functions or additional client behavior to port; it is context for the credential comparisons."
pitfalls:
  - "A test that supplies the resolved api_key directly never exercises get_secret, even when its filename says OIDC."
  - "CircleCI uses CIRCLE_OIDC_TOKEN and circleci_v2 uses CIRCLE_OIDC_TOKEN_V2; distinct fixture values make a mistaken shared branch observable."
  - "With an installed readable manager, a name excluded by hosted_keys still passes through the manager branch's literal-boolean rule, where lowercase true and false stay text."
  - "aws-oidc-before-manager must include the OIDC name in hosted_keys, otherwise an incorrect dispatcher could pass by taking LOCAL."
  - "The harness substitutes {{upstream}} inside config, not inside case env; the AWS guard endpoint is deliberately a fixed loopback refusal endpoint and is never a successful secret backend."
  - "An Azure Key Vault initialization failure is logged and swallowed; a helper that directly raises the constructor error would test a different boundary."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
