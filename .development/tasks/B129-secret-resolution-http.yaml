id: B129
title: Prove secret resolution reaches proxy credentials over HTTP
description: >-
  The secret-manager parts implement the readers and B8500 implements get_secret, but their cases do not boot the
  proxy. Add the missing HTTP comparisons that follow a secret reference from config loading into the provider's
  Authorization header or the proxy's master-key check. This is a cases-only task: B8590 selects the manager,
  B8612 builds the production SecretLookup, B8613 constructs it during startup and B8610 carries it in Shared.
  Use those implementations and the existing chat router. Register no route and copy no secret-resolution logic.
  If a case exposes a production defect, report its owning module for a follow-up instead of widening this task.

  Write the sixteen files below under tools/oracle/cases/secret-managers/http/. Use the harness's existing HTTP
  Case format, which omits kind; kind: helper would bypass the boundary being tested. Each case boots both proxies
  with its own config and environment. Use a deployment named secret-model, model openai/gpt-4o, api_base
  "{{upstream}}", router_settings.num_retries 0, a non-streaming user message, and a deterministic successful
  chat-completion mock response. The model's api_key is the reference under test, never the already-resolved value.
  Unless overridden below, general_settings.master_key is oracle-master and the request sends Bearer oracle-master.
  All credentials are unmistakable fixture strings. Compare response status and body, content-type, and the
  captured upstream authorization and content-type headers; do not ignore authorization, the upstream path, or
  the model. Follow the existing chat cases for any generated response identifiers that need a narrow ignore.

  Environment cases. env-provider-key uses os.environ/ORACLE_PROVIDER_SECRET with a non-boolean value and POST
  /v1/chat/completions. env-prefix-removal uses os.environ/os.environ/ORACLE_PROVIDER_SECRET and POST
  /chat/completions; get_secret removes every os.environ/ occurrence once the name starts with that prefix.
  Both must send the fixture value as Bearer authentication to the mock, never the reference spelling or the
  incoming master key.

  OIDC cases use api_key references beginning os.environ/oidc/. oidc-env-token names env/ORACLE_OIDC_TOKEN.
  oidc-env-audience-slashes names env/team/service/token, sets that exact environment name, and sends POST
  /engines/secret-model/chat/completions: the audience retains its slashes. oidc-circleci-token names
  circleci/https://service.example/audience and sets CIRCLE_OIDC_TOKEN. oidc-circleci-v2-token uses circleci_v2
  and POST /openai/deployments/secret-model/chat/completions. Set CIRCLE_OIDC_TOKEN and CIRCLE_OIDC_TOKEN_V2
  to different strings in both CircleCI cases, so using the wrong variable changes the captured header.
  oidc-string-token sets ORACLE_OIDC_TOKEN to the string "true": the OIDC return happens before ordinary
  environment boolean conversion, so the provider receives Bearer true. These cases use no identity service.

  Master-key cases. master-env-key sets general_settings.master_key to os.environ/ORACLE_PROXY_SECRET and sends
  that resolved value to POST /v1/chat/completions. master-oidc-key uses os.environ/oidc/env/ORACLE_PROXY_SECRET
  instead. Give the deployment a different provider credential in both cases and compare the upstream header,
  proving proxy authentication and provider authentication use their respective secrets. master-missing-key uses
  the same resolved OIDC master key but omits Authorization entirely: compare LiteLLM's 401 and error type, param
  and code, ignore only /error/message with the reason "betterlite writes its own message", and provide no upstream
  answers. No upstream request may occur on that refusal.

  Manager gates. Configure general_settings.key_management_system: aws_secret_manager and its sibling
  key_management_settings mapping. Set AWS_REGION_NAME to us-east-1, static fixture AWS_ACCESS_KEY_ID and
  AWS_SECRET_ACCESS_KEY, AWS_EC2_METADATA_DISABLED to "true", and AWS_BEDROCK_RUNTIME_ENDPOINT to
  http://127.0.0.1:1. No successful case needs an AWS request; the loopback endpoint prevents a mistaken read from
  reaching AWS. Keep the ordinary master key outside hosted_keys. aws-hosted-excluded sets hosted_keys to
  [OTHER_SECRET], leaves access_mode absent (read_only), and resolves os.environ/ORACLE_PROVIDER_SECRET whose
  value is the string "true". A configured readable manager routes this excluded name through LOCAL and keeps
  lowercase true as text, so the upstream header is Bearer true. aws-hosted-empty uses hosted_keys: [] and an
  ordinary fixture provider key. aws-write-only lists ORACLE_PROVIDER_SECRET in hosted_keys but sets access_mode:
  write_only; it must still read the environment and complete without contacting the manager. aws-read-and-write
  uses access_mode: read_and_write, excludes the provider key and supplies the string "false", which stays text
  in the manager branch. aws-oidc-before-manager lists oidc/env/ORACLE_OIDC_TOKEN in hosted_keys with read_only
  and resolves that OIDC reference: token acquisition returns before manager dispatch, including before the allowlist.

  azure-vault-without-uri selects azure_key_vault with no AZURE_KEY_VAULT_URI and resolves a normal environment
  provider key. LiteLLM logs the initialization failure, installs no manager and continues serving with that key.
  Use an isolated case environment (an empty URI also produces the same no-client outcome if the harness's
  inherited environment needs clearing). Do not turn this warn-and-continue branch into a startup-failure case.

  The inherited chat paths are /v1/chat/completions, /chat/completions, /engines/{model:path}/chat/completions and
  /openai/deployments/{model:path}/chat/completions. The cases above exercise each without adding aliases.
  Omitted manager settings retain B4410's defaults: hosted_keys null, access_mode read_only, primary_secret_name
  null and store_virtual_keys false. Do not send boolean values where an API credential is declared a string;
  the lowercase-token cases deliberately stay on branches that return strings. There is no new decoder or
  configuration key, so this task adds neither a fuzz target nor another config section.
