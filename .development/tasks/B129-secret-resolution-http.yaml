  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L11931-L11957
    why: Context only, starting at the decorators for all four existing authenticated chat paths.
dod:
  - text: Environment and OIDC references resolve through the booted proxy and reach the mock provider as the correct bearer credential on the existing chat aliases.
    proof: [http-cases-added, oracle]
  - text: The resolved master key authenticates the proxy independently of the provider key, and a missing caller key produces the matching 401 envelope without a provider call.
    proof: [http-cases-added, oracle]
  - text: Configured AWS manager access modes and hosted_keys retain their environment and OIDC bypass behavior, and Azure Key Vault initialization without a URI leaves environment reads usable.
    proof: [http-cases-added, oracle]
checks:
  optional: []
  commands:
    - id: http-cases-added
      why: The branch has no new booted-proxy secret-resolution cases; existing helper cases cannot satisfy this task.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/secret-managers/http)"
