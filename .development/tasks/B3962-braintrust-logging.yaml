id: B3962
title: Braintrust project resolution and event logging
description: >-
  Build Braintrust event logging with project-name resolution, caching and insertion records.
  Implement initialization with API key validation, sync and async project-ID retrieval with
  fallback to default-project creation, and event payload construction. Read BRAINTRUST_API_KEY
  and BRAINTRUST_API_BASE (default https://api.braintrustdata.com/v1) from B002; use B173's
  pooled HTTP handler for sync and async POST requests; build on B189's CustomLogger contract.

  Implement a cache mapping project names to project IDs, keyed by name and holding resolved IDs
  across event callbacks. The sync project-resolution path POSTs to /project; the async path
  POSTs to /project/register. Resolve project_id from metadata or create a default "litellm"
  project using /project endpoint in both sync and async paths. Missing BRAINTRUST_API_KEY fails
  validation at initialization; transient HTTP failures re-raise httpx.HTTPStatusError with
  response.text.

  Apply root-only tags: tags appear only when root_span_id is absent (non-root spans omit tags).
  Tags are built from litellm.langfuse_default_tags list: when a metadata key appears in that
  list, emit key:value pairs. Preserve string-only metadata extensions: only string values from
  dynamic_metadata extend standard_logging_object when the key is absent (existing keys never
  overwritten); non-string values pass through unchanged.

  Preserve sync vs async time-to-first-token calculation: sync uses end_time.timestamp() -
  start_time.timestamp(); async uses completion_start_time.timestamp() -
  api_call_start_time.timestamp() when both are present. Both success paths extract prompt
  tokens, completion tokens, total tokens, cost and start/end timestamps into metrics.

  Span structure: span_name (default "Chat Completion") feeds span_attributes.name; root_span_id,
  span_id and span_parents (comma-separated string converted to list) are top-level request_data
  keys when truthy. Output field is always built from choices: initialized [] and reassigned only
  for ModelResponse/TextCompletionResponse, producing empty output arrays for embeddings and
  images. The failure callback is a no-op pass-through. Mock infrastructure remains in LiteLLM's
  test harness; test seams supplied by B191.
