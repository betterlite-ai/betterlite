deviations:
  - what: >-
      The output field is always built from the choices array (initialized as empty list and reassigned
      only for ModelResponse/TextCompletionResponse), so embedding and image responses produce an empty output
      array instead of their underlying response_obj.data.
    why: >-
      LiteLLM's code structure initializes choices as an empty list and only reassigns for specific response types;
      the final check (if choices is not None: request_data["output"] = [choice.dict() for choice in choices])
      is always true since choices is never None, resulting in empty arrays for embeddings/images.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/braintrust_logging.py#L135-L149

  - what: >-
      Metadata values extend standard_logging_object only when the key is absent; existing keys are never
      overwritten.
    why: >-
      The source code checks (if isinstance(value, str) and key not in standard_logging_object) before adding,
      so absent keys are extended but present keys are preserved unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/braintrust_logging.py#L176-L179
out_of_scope:
  - B002 owns environment variable lookup and API key loading through B002's config resolution.
  - B173 owns the HTTP handler pool and sync/async request execution.
  - B189 owns CustomLogger initialization contract.
  - litellm.utils.get_logging_id is called but its result is discarded (line 186/311); the owner of this function is not determined by this task.
  - Mock infrastructure (should_use_braintrust_mock, create_mock_braintrust_client) remains in LiteLLM's test harness; test fixtures supplied by B191.

pitfalls:
  - BRAINTRUST_API_KEY is a secret; keep it in secrecy::SecretString and never log its value.
  - The sync project endpoint is /project, but async uses /project/register. Both can create or get a project; only differentiate on the call, not on error handling.
  - span_parents is a comma-separated string in metadata; parse it to a list and filter empty strings after splitting.
  - Tags are only applied when root_span_id is absent. A presence check on root_span_id (not a truthy check) determines tag inclusion.
  - The output field must always be present in request_data, even if empty; never omit it.
  - HTTPStatusError.response.text is the error message; betterlite re-raises it. Do not suppress HTTP errors; let them propagate.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
