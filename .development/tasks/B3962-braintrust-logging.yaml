dod:
  - text: BraintrustLogger initializes with API key validation, default HTTP handler setup and empty project ID cache.
    proof: [braintrust-init-test]

  - text: validate_environment raises when BRAINTRUST_API_KEY is missing (passed as argument or via B002 environment lookup).
    proof: [braintrust-validation-test, braintrust-validation-oracle]

  - text: "Sync project-ID retrieval queries /project endpoint; async queries /project/register. Both cache by name and retry failed lookups; cache miss creates the project. HTTPStatusError re-raises with response.text."
    proof: [braintrust-project-test, braintrust-project-oracle]

  - text: Default project named "litellm" is created via POST /project when no project_id or project_name is supplied, and cached as default_project_id in both sync and async paths.
    proof: [braintrust-default-test, braintrust-default-oracle]

  - text: "Sync time-to-first-token is end_time.timestamp() - start_time.timestamp(); async is completion_start_time.timestamp() - api_call_start_time.timestamp() when both are present."
    proof: [braintrust-ttft-test, braintrust-ttft-oracle]

  - text: "Tags are applied only when root_span_id is absent (non-root spans carry no tags). Tags come from litellm.langfuse_default_tags list intersection with metadata keys."
    proof: [braintrust-tags-test, braintrust-tags-oracle]

  - text: "span_name (default 'Chat Completion') is written to span_attributes.name; root_span_id, span_id and span_parents (comma-separated string converted to list) are top-level request_data keys when truthy."
    proof: [braintrust-span-test, braintrust-span-oracle]

  - text: "String metadata values extend standard_logging_object only when the key is absent; existing keys are never overwritten."
    proof: [braintrust-metadata-test, braintrust-metadata-oracle]

  - text: "Output field is built from choices: [] when choices are None/falsy, [choice.dict() for choice in choices] when truthy. Embedding responses (call_type='embedding' or EmbeddingResponse type) initialize choices=[] and produce empty output."
    proof: [braintrust-output-test, braintrust-output-oracle]

  - text: "Metrics object includes prompt_tokens, completion_tokens, total_tokens, total_cost, start and end as timestamps. Only built when usage_obj is present."
    proof: [braintrust-metrics-test, braintrust-metrics-oracle]

  - text: "Insertion endpoint is POST /project_logs/{project_id}/insert with payload {\"events\": [request_data]}. Successful sync sends complete; failed sends raise."
    proof: [braintrust-insert-test, braintrust-insert-oracle]
