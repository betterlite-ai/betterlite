id: B811
title: Delete and archive teams with reference cleanup
description: >-
  Implement POST /team/delete as the source's ordered deletion workflow, not one transaction. Missing
  database is 500 detail.error="No db connected"; null team_ids is 400 "No team id passed in". Empty
  lists succeed with deleted_teams=[] and duplicates are not normalized. Read each requested team and
  authorize B800 TEAM_OR_ORG_ADMIN before any archive write. Both missing rows and read exceptions become
  404 "Team not found, passed team_id=..."; model validation is outside that catch. Scope denial uses
  B800 team_access_denied. Cases delete_empty_and_null, all_targets_before_archive, read_error_is_404
  and delete_scope_matrix distinguish these paths and preserve requested response order.

  Archive all teams with one UTC deleted_at, caller user_id/api_key and the raw optional
  litellm-changed-by header. JSON-encode non-null members_with_roles, metadata, model_spend,
  model_max_budget and router_settings; discard litellm_model_table, object_permission, id,
  budget_limits and default_team_member_models. Preserve stored ciphertext inside metadata without
  decrypting or re-encrypting it. Empty records skip create_many. Then, when B065 enables auditing,
  re-read each team, skip missing rows and schedule deleted events with before_value=json(exclude_none),
  updated_values="{}", a UUID/time, caller API key and B065's authorized changed_by resolution. The
  archive header is deliberately raw while the audit identity is policy controlled. Cases archive_json
  and audit_archive_identity_difference prove that distinction; audit settings and their loader belong
  to B065 rather than a new config key here.

  Fetch key rows and B738 JWT mapping cache keys, archive nonempty keys through B777, delete team keys
  through B124, then issue B784 deletion audit events, B734 key-cache invalidation and B878 JWT eviction.
  Next call B836 delete_team_models. A failure at any stage preserves prior archives, deletions and
  scheduled events. Sweep every user with SQL array_remove(teams,$1) WHERE $1=ANY(teams), once per input
  ID, then delete memberships. Resolve member cache IDs from the saved roster after this first sweep:
  include all non-null IDs (including empty strings), resolve only email-only members with one B723
  case-insensitive find_by_emails call per team, and return a sorted unique union. Cases
  key_archive_delete_cache_order, model_failure_leaves_prior_effects, stale_user_reference_sweep and
  email_only_identity_recovery inspect these effects rather than promising whole-request rollback.

  Only the final team deletion and second sweep share a transaction. Acquire B819 TEAM_ADVISORY_LOCK_SQL
  for every sorted input ID, delete team rows, repeat the user-array sweep and membership deletion on
  that same connection, then commit. Concurrent member_add uses the same lock; retain unrelated team
  array additions. Immediately afterward evict team ID/alias caches concurrently through B734, then
  for each team B878-evict user IDs and concurrently invalidate member spend state through B734. Finally
  emit B807 metrics from empty rosters and invoke B819 access-group sync for each saved team. Cache or
  sync failures propagate after deletion; metric failure retains B807's warn/drop behavior. Native
  postgres_failure_effects injects failure at each stage, postgres_pinned_rows checks archives and
  sweeps, and postgres_member_add_delete_race proves the advisory-lock boundary. Post-commit cache
  failure and sync order have named tests post_commit_cache_failure and empty_roster_metric_then_sync.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  delete_team (L4313-L4510; 147 source lines), _sweep_deleted_team_references (L4513-L4532; 15 source
  lines), _sweep_deleted_team_references_tx (L4535-L4542; 7 source lines), _invalidate_deleted_key_cache
  (L4545-L4561; 16 source lines), _invalidate_deleted_team_cache (L4564-L4579; 16 source lines), _invalidate_deleted_team_member_cache
  (L4582-L4591; 10 source lines), _evict_deleted_team_member_cache (L4594-L4609; 16 source lines), _resolve_deleted_team_member_user_ids
  (L4612-L4619; 8 source lines), _deleted_team_member_user_ids (L4622-L4636; 13 source lines), _transform_teams_to_deleted_records
  (L4639-L4684; 41 source lines), _save_deleted_team_records (L4687-L4694; 8 source lines), _persist_deleted_team_records
  (L4697-L4712; 16 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/delete -> delete_team. For each
  route exercise the named cases through B001 and B052, comparing status, B003 error type/param/code,
  JSON content-type and deleted_teams. The handler has only the per-team lookup catch described above;
  it does not call handle_exception_on_proxy. B865 wraps this route and must not hide its partial effects.


  Archive/delete fixtures must inspect retained rows through B860's POSTGRES_TEST_URL database;
  use testcontainers only without that variable, and treat connection/start errors as test failures.


  Sizing: 313 nonblank, noncomment function lines including docstrings, plus the owned three-line SQL
  declaration at L390-L392; allow 300 production, 400 behavior/Postgres tests, 0 helper adapters,
  80 route/manifests/wiring, 0 decoder/fuzz and 0 config lines, 780 changed lines within an 800-line gate.


