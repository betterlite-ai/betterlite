id: B1419
title: Cohere rerank versions and query guardrails
description: >-
  Build cohere_rerank over B1013's rerank records and decoder, with V1/V2 selected by
  an explicit version value. V1 sends max_chunks_per_doc and V2 max_tokens_per_doc;
  both carry query, documents, top_n, rank_fields and return_documents. Mapping defaults
  return_documents to true and retains nullable fields, then request construction requires
  query/documents by key presence and removes None through the RerankRequest projection.
  Ignore instruction and the other version's limit. Trim trailing slashes from a truthy
  base and append the entire /v1/rerank or /v2/rerank suffix unless already present;
  defaults are https://api.cohere.ai/v1/rerank and https://api.cohere.ai/v2/rerank.

  Resolve a None key from COHERE_API_KEY, CO_API_KEY, then litellm.cohere_key in truthy
  order; fail with ValueError only if the final result is None, accepting an explicit
  empty string. Caller headers overwrite Authorization, accept and content-type defaults.
  Add cohere_rerank_settings in betterlite-config to load these two environment variables
  and litellm_settings.cohere_key, with precedence, missing and empty cases. This is
  different from chat's global-key order. Responses use B1013's existing byte decoder
  and RerankResponse construction; wrap only JSON-read failures in B1414's CohereError
  with upstream status. Neither variant checks status inside its response transformation.
  get_error_class drops passed headers, and inherited cost computation stays in B1013.

  In betterlite-core::cohere_rerank_guardrail implement CohereRerankHandler through B104.
  Scan query followed by instruction when each is a string, including empty strings;
  documents never enter the hook. Include a truthy model, pass the original request_data,
  and replace only returned positions. A short texts result preserves unreturned fields;
  extra positions are ignored. Output processing returns the response without calling
  the hook. Export rerank and arerank translation mappings for B037 to register.

  Two pure helper operations, cohere_rerank_plan and rerank_guardrail_fields, invoke the
  pinned config and a fixture guardrail respectively. New seeds for each must be parsed
  with their exact call tag and a nonempty-count assertion. No decoder is introduced here;
  malformed reply cases exercise B1013's decoder through the provider wrapper. The owned
  files total 312 nonblank/noncomment lines (131+80+92+9), plus the four-line legacy
  handler documentation. Allocate 280 production, 230 cross-crate tests, 155 adapters
  and 100 configuration/export lines, maximum 800.
scope:
  paths:
    - crates/betterlite-openai/src/{lib,error,cohere_rerank}.rs
    - crates/betterlite-openai/src/cohere_rerank/**
    - crates/betterlite-core/src/{lib,cohere_rerank_guardrail}.rs
    - crates/betterlite-core/src/cohere_rerank_guardrail/**
    - crates/betterlite-config/src/{lib,settings,providers}.rs
    - crates/betterlite-config/src/providers/{mod,cohere_rerank}.rs
    - crates/betterlite-config/tests/cohere_rerank_settings.rs
    - tools/oracle/src/helpers/core_ops/cohere_rerank_plan.rs
    - tools/oracle/src/helpers/core_ops/cohere_rerank_plan/**
    - tools/oracle/helpers/cohere_rerank_plan.py
    - tools/oracle/helpers/cohere_rerank_plan/**
    - tools/oracle/src/helpers/core_ops/rerank_guardrail_fields.rs
    - tools/oracle/src/helpers/core_ops/rerank_guardrail_fields/**
    - tools/oracle/helpers/rerank_guardrail_fields.py
    - tools/oracle/helpers/rerank_guardrail_fields/**
    - tools/oracle/cases/helpers/{cohere-rerank-plan,rerank-guardrail-fields}/**
    - tools/oracle/fuzz/corpus/helper_case/{cohere_rerank_plan,rerank_guardrail_fields}*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/cohere/rerank/transformation.py#L16-L154
    why: V1 fields, None-only key failure, caller header overrides and direct response projection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/cohere/rerank_v2/transformation.py#L7-L90
    why: V2 changes the endpoint and per-document token limit.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/cohere/rerank/guardrail_translation/handler.py#L19-L121
    why: Instruction joins query in stable order while documents and output remain untouched.
dod:
  - text: Rerank version changes the URL and document limit while preserving credential and header precedence.
    proof: [cohere-rerank-tests, cohere-rerank-settings, rerank-helpers-python, oracle]
  - text: Guardrails scan both request strings and write back only returned positions.
    proof: [cohere-rerank-tests, rerank-helpers-python, oracle]
  - text: Both helper operations have fresh seeds selecting their exact typed variants.
    proof: [rerank-helper-seeds]
checks:
  optional: [mutants]
  commands:
    - id: cohere-rerank-tests
      run: cargo nextest run --locked -p betterlite-openai -p betterlite-core --no-tests=fail -E 'test(/^cohere_rerank::/) | test(/^cohere_rerank_guardrail::/)'
      why: Wire plans and guarded field writeback live in different crates and both need assertions.
    - id: cohere-rerank-settings
      run: cargo nextest run --locked -p betterlite-config --test cohere_rerank_settings --no-tests=fail
      why: The loader must recognize the provider global as well as both environment aliases.
    - id: rerank-helpers-python
      run: test -f tools/oracle/helpers/cohere_rerank_plan.py && test -f tools/oracle/helpers/rerank_guardrail_fields.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: The two adapters must call the actual config and guardrail translation methods.
    - id: rerank-helper-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/cohere_rerank_plan*')" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/rerank_guardrail_fields*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::core_ops::cohere_rerank_plan::/) | test(/^helpers::core_ops::rerank_guardrail_fields::/)'
      why: Neither a config-only seed nor a guardrail-only seed proves both operations are wired.
oracle_cases:
  - tools/oracle/cases/helpers/cohere-rerank-plan/versioned-limits-and-suffix.yaml
  - tools/oracle/cases/helpers/cohere-rerank-plan/key-fallback-and-header-override.yaml
  - tools/oracle/cases/helpers/cohere-rerank-plan/null-projection-and-response-error.yaml
  - tools/oracle/cases/helpers/rerank-guardrail-fields/empty-query-and-instruction.yaml
  - tools/oracle/cases/helpers/rerank-guardrail-fields/short-result-documents-untouched.yaml
  - tools/oracle/cases/helpers/rerank-guardrail-fields/output-no-hook.yaml
deviations: []
out_of_scope:
  - B085 owns rerank HTTP aliases and B1014 call orchestration; B037 composes this provider and the two guardrail mappings.
  - B104 retains the general guardrail interface/registry and B1013 retains common rerank validation, decoding and inherited search-unit pricing.
pitfalls:
  - 'The oracle helper for this task is pre-registered as cohere_rerank_plan and rerank_guardrail_fields in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/cohere_rerank_plan.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/cohere_rerank_plan.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Passing an already versioned base ending in /v1 appends another /v1/rerank in the V1 implementation.
  - Empty instruction strings are scanned because the guardrail checks type rather than truthiness.
  - A partial guardrail result leaves the unmatched original request field in place.
budget: {max_changed_lines: 800, max_new_expects: 0}
review_level: security
