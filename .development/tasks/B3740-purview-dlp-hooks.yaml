deviations:
- what: Oracle cases do not cover non-content streamed responses (e.g. embeddings, rerank) that pass through with zero DLP scanning.
  why: Purview's processing is limited to ModelResponse, TextCompletionResponse and ResponsesAPIResponse types; non-content response types are intentionally not scanned, matching LiteLLM's behavior. Oracle cases cover the scannable response paths and failure modes.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L569-L573
- what: betterlite uses the unresolved U6 contract for response iteration in place of MockResponseIterator from litellm.llms.base_llm.base_model_iterator.
  why: U6 contract is not finalized; the exact location and API are determined by B104.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/base_model_iterator.py#L1
- what: betterlite does not decorate hooks with @log_guardrail_information; that decorator is resolved in U1.
  why: U1 contract for guardrail logging decoration and standard logging object updates is not finalized; determined by B104.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_guardrail.py#L1
- what: betterlite's logging hook delegates to async_logging_hook when async context is detected, without explicit framework dispatch.
  why: Framework dispatch and CustomGuardrail callback resolution are determined by B104 (U3).
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_registry.py#L1
out_of_scope:
- Bedrock guardrails (B3720–B3727), Azure guardrails (B3728–B3730), OpenAI guardrails (B3731), Model Armor (B3732–B3735), IBM guardrails (B3736–B3737), Agent 365 (B3741–B3742).
- B3738's Graph authentication, B3739's DLP evaluation and text extraction.
- B2227's stream assembly and chunk building.
- B732's auth context and user identity accessors.
- Framework guardrail registry, initialization and decorator contract (B104, U1, U3).
- Response/error record construction and wire format (U6).
- The async-context detection and background-thread scheduling are production behavior; duplicates in logging bridge are acceptable for clarity.
pitfalls:
- asyncio.get_running_loop() raises RuntimeError in sync context; catch it to detect the no-loop case for background scheduling.
- The logging_hook is sync and must return (kwargs, result) immediately even when scheduling background audit; never await or block.
- Responses API streams emit typed events where the final event carries the full ResponsesAPIResponse; detect them separately from chat/completion delta streams.
- Both audit_prompt and audit_response calls invoke _check_content with block_on_violation=False; exceptions are logged but not raised.
- The streaming iterator hook buffers all_chunks before assembly; do not yield any chunk until the scan passes.
- stream_chunk_builder may return None if chunks cannot be assembled; fail closed with HTTP 400 with message "Unable to assemble streamed response for scanning; blocking response." rather than silently passing through.
- Incomplete Responses API stream (events seen but no final response.completed/response.failed/response.incomplete carrying a ResponsesAPIResponse) fails closed with HTTP 400 and message "Incomplete Responses API stream — no final response event received for DLP scanning; blocking response."
- Non-content streamed responses (e.g. embeddings or rerank) that assemble to something other than ModelResponse/TextCompletionResponse/ResponsesAPIResponse pass through unchanged with zero DLP scanning. Purview cannot scan these response types and betterlite follows that limitation.
- Token-ID prompts (flat list[int] or list[list[int]] or mixed) are rejected before scanning; empty/whitespace-only strings pass through with None from completion_prompt_to_str.
- async_pre_call_hook routes Responses API calls (call_type in ("responses", "aresponses")) via _responses_api_input_to_str before the generic messages branch; this routing decision applies only to blocking pre-call scan and mirrors async_logging_hook's routing for consistency.
- async_logging_hook also routes Responses API calls via _responses_api_input_to_str with the same call_type dispatch; audit prompt and response are scanned independently with block_on_violation=False.
- The replacement response on Responses API is accessed via _completion_response_text_parts on the assembled response body, not from the streamed events.
