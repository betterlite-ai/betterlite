id: B3740
title: Purview blocking streaming and audit hooks
description: >-
  Build blocking request/response/buffered-stream hooks and nonblocking audit hooks for Microsoft Purview DLP guardrail.
  Scan user prompts synchronously before LLM execution and LLM responses asynchronously after completion, raising 400 on
  policy blocks. Buffer entire streaming responses before scanning and fail closed if assembly fails. Implement sync
  logging hook that detects running event loop and either defers to async_logging_hook through the framework or schedules
  it on a background daemon thread; async_logging_hook audits prompt and response independently without raising
  exceptions. Reuse B3738 base constructor, B3739 evaluation/text extraction, B2227 stream assembly and B732 authenticated
  context. Preserve the pinned async-context detection with asyncio.get_running_loop() and Responses API special handling.
  Each hook returns the original arguments/response unchanged on success or raises HTTPException(400) on policy block.
