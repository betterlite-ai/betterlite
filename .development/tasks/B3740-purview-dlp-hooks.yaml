  why: async_post_call_streaming_iterator_hook buffering entire stream, Responses API special handling and fail-closed assembly.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L596-L642
  why: logging_hook sync/async context detection and background thread scheduling with _log_safe and _run_in_new_loop helpers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L644-L702
  why: async_logging_hook independent prompt and response audits without raising exceptions.
dod:
- text: async_pre_call_hook routes Responses API calls via _responses_api_input_to_str before the generic messages branch,
    rejects token-ID completion prompts with HTTP 400 before scanning, scans extracted prompt text with block_on_violation=True,
    and returns original data on success.
  proof:
  - purview-pre-call-hook
  - purview-dlp-oracle
- text: async_post_call_success_hook scans non-streaming responses extracted via _completion_response_text_parts, and returns
    the original response unchanged on success.
  proof:
  - purview-post-success-hook
  - purview-dlp-oracle
- text: async_post_call_streaming_iterator_hook buffers all chunks, detects Responses API streams and assembles them via
    _assemble_responses_api_from_chunks, assembles chat/completion streams via stream_chunk_builder, fails closed with HTTP 400
    on assembly failure or incomplete Responses API stream, and re-yields original chunks after a clean scan.
  proof:
  - purview-streaming-hook
  - purview-dlp-oracle
- text: logging_hook detects running event loop with asyncio.get_running_loop(), defers to framework's async_logging_hook in
    async context, and schedules async_logging_hook on background daemon thread with new_event_loop() in sync context.
  proof:
  - purview-logging-hook
  - purview-dlp-oracle
- text: async_logging_hook audits prompt and response independently, logs errors but never raises exceptions, and handles
    missing user_id by skipping audit.
  proof:
  - purview-async-logging-hook
  - purview-dlp-oracle
- text: Oracle cases exercise all code paths including Responses API pre-call routing, streaming assembly failures, and incomplete
    Responses API streams.
  proof:
  - purview-dlp-oracle
