id: B348
title: Router settings and field metadata endpoints
description: 'Serve GET /router/settings and GET /router/fields using typed response models and B066 configuration
  provenance. Report effective values, configuration overrides, field defaults, available strategies and
  priority-group support from the implemented router. Keep field definitions in a reviewed static catalog
  and reproduce source metadata through snapshots/oracle cases. Reuse B052 authentication. This source
  file defines read endpoints only; settings mutations remain B066''s configuration API. Implement the
  owned native service in crates/betterlite-server/src/router_settings.rs. Add ProbeOperation::RouterSettings in
  tools/oracle/src/router_probes/mod.rs and the corresponding B348 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/proxy/management_endpoints/router_settings_endpoints.py:
  _router_setting_source (L52-L61), _get_routing_strategies_from_router_class (L64-L80), get_router_settings
  (L89-L164), get_router_fields (L173-L213). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
scope:
  paths:
  - crates/betterlite-server/src/router_settings.rs
  - crates/betterlite-server/src/router_settings/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/error.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/mod/**
  - crates/betterlite-server/src/routing/router_settings.rs
  - crates/betterlite-server/src/routing/router_settings/**
  - tools/oracle/src/router_probes/router_settings.rs
  - tools/oracle/src/router_probes/router_settings/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/router_settings.py
  - tools/oracle/cases/routing/router-settings/**
  - tools/oracle/helpers/b348.py
  - tools/oracle/helpers/b348/**
  - tools/oracle/src/helpers/server/b348.rs
  - tools/oracle/src/helpers/server/b348/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/router_settings_endpoints.py#L29-L213
  why: Read endpoints, effective value precedence and source metadata.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/router_settings_endpoints.py#L70-L273
  why: Router field definitions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/router_settings_endpoints.py#L173-L213
  why: Previously uncovered helper owned by this task.
dod:
- text: Write tests named router_settings_behaviors and router_settings_boundaries under router_settings::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - router-settings-behaviors
  - router-settings-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: router-settings-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::router_settings_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: router-settings-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::router_settings_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/router_settings.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/router_settings.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/router-settings/settings-current-values.yaml
- tools/oracle/cases/routing/router-settings/fields-with-null-values.yaml
- tools/oracle/cases/routing/router-settings/config-over-runtime.yaml
- tools/oracle/cases/routing/router-settings/source-default-unset-override.yaml
- tools/oracle/cases/routing/router-settings/routing-groups-present.yaml
- tools/oracle/cases/routing/router-settings/strategy-options.yaml
- tools/oracle/cases/routing/router-settings/authentication-required.yaml
deviations: []
out_of_scope:
- General config write persistence (B066).
- Per-key/team weights validation (B023).
- 'litellm/types/management_endpoints/router_settings_endpoints.py: B018 owns: FallbackCreateRequest.validate_fallback_models
  (L27-L32), FallbackCreateRequest.validate_model (L36-L39).'
pitfalls:
- Do not invent a PUT /router/settings route; the pinned file provides two GET routes.
- The runtime stores routing groups separately, so they must not disappear from introspection.
- Never serialize provider credentials through default_litellm_params.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
