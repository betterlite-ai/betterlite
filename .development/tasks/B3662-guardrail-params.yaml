deviations:
  - what: >-
      A key under `guardrails[].litellm_params` that no section reads fails the config load with `ConfigError::Unsupported`. LiteLLM keeps such a key through `extra="allow"`.
    why: >-
      The loader refuses keys nothing reads, so a misspelled guardrail setting can't be ignored without notice. Three section tests on main pin this.
  - what: >-
      In a request body, provider keys outside `BASE_KEYS` and `PARAM_KEYS` are kept in `extra` with no type check, and provider mixin validators don't run at this layer. LiteLLM's `LitellmParams` checks them against every provider mixin for every entry.
    why: >-
      The provider models live in their own sections and tasks, and betterlite-config holds only some of them. A bad provider value fails when that provider's code reads it.
  - what: >-
      `timeout` text such as `nan`, `inf` or `1_000` is refused, where Python's `float()` takes it, and the message is `timeout must be numeric` without the value.
    why: >-
      Text goes through the shared number parser from docs/compatibility.md, a timeout that isn't finite can't be used, and the value may come from a variable that holds a secret.
  - what: >-
      `rejected` reasons and decoder errors name the bad field and don't quote its value, unlike pydantic's message.
    why: >-
      The secrets-stay-secret rule, since a mistyped field can hold a key.

out_of_scope:
  - >-
    The rest of litellm/types/guardrails.py belongs to the tasks that cover it: B3660 owns `SupportedGuardrailIntegrations`, `Role`, `GuardrailItem`, `PiiEntityType` and `PiiAction`, and B3661 owns the Bedrock, LakeraV2, Lasso, DeepKeep, Pillar, Noma, Zscaler and Javelin config models.
  - >-
    `guardrailConfig` at litellm/types/guardrails.py line 1301 has no caller at the pin. The `guardrailConfig` hits in the Bedrock code are a different thing.
  - >-
    `__contains__`, `get` and `__getitem__` on `LitellmParams` exist for Python callers that treat it as a dict; Rust callers read fields directly.
  - >-
    `PresidioPerRequestConfig` is on main in `crates/betterlite-guardrails/src/presidio_actions/request_data.rs`, and `ContentFilterAction`, `BlockedWord` and `ContentFilterPattern` are on main in `sections::content_filter_records`.
  - >-
    `DecisionModelGuardrailConfigModel` in decision_model.py and `_parse_checks` in guardrail_hooks/decision_model/__init__.py belong to B108's decision_model guardrail. It imports `DecisionModelCheck` from here.
  - >-
    Checking mode text against a guardrail's supported hooks is `_validate_event_hook` in custom_guardrail.py, owned by B3664.
  - >-
    The log line for a skipped entry, legacy `initialize_guardrails` and reading `litellm_settings.guardrails` into `GuardrailItemSpec` are in init_guardrails.py, owned by B3683.
  - >-
    `LitellmParams(**data)` and the `api_key` and `api_base` handling in guardrail_registry.py are owned by B3682.
  - >-
    The admin routes in guardrail_endpoints.py, their masking, `model_dump(exclude_none=True)`, the PATCH merge and the 422 answers are owned by B3684 to B3687.
  - >-
    Provider mixin fields and validators stay with each provider's task, for example B3810 for `default_action` and `on_disallowed_action`, B3751 for Akto and B3784 for Ovalix. This task only lowercases those two keys in a body.

pitfalls:
  - >-
    With serde_json `arbitrary_precision` on (core, harness, logging, models and others turn it on, and features unify), a float such as `timeout: 1.5` reaches the untagged `GuardrailValue` in crates/betterlite-config/src/sections/guardrail_identity/item.rs as the object `{"$serde_json::private::Number": ...}`. Numbers in extras must stay numbers, so use a hand-written Deserialize or go through serde_json::Value.
  - >-
    Pydantic takes a redeclared field from the first listed base, so `unreachable_fallback` on `LitellmParams` comes from Headroom with `fail_closed`, even for a typesafe entry where the TypeSafe mixin says `fail_open`.
  - >-
    `normalize_lowercase` runs only on declared fields, so on `BaseLitellmParams` a `mode`, `default_action` or `on_disallowed_action` key sits in the extras and keeps its case.
  - >-
    `normalize_lowercase` leaves a `Mode` mapping alone, so `tags` and `default` keep their case, and `on_violation` isn't in its list at all.
  - >-
    `default_on` is fixed to false only in `LitellmParams.__init__`, so a `BaseLitellmParams` dump shows it as null.
  - >-
    `coerce_timeout` exists only on `LitellmParams`, so `timeout: "30"` is fine there and is a refused type on `BaseLitellmParams`.
  - >-
    `betterlite_env::number` returns `Ok(None)` for blank text, but `float("   ")` fails in LiteLLM, so only the exact `""` gives null and a `None` from the parser is `InvalidTimeout`.
  - >-
    `str::parse::<f64>` takes `nan` and `inf`, so check `is_finite` after `betterlite_env::number`.
  - >-
    `sensitive_data_route_to_model: ""` with `on_sensitive_data: route` is refused like an unset value, because LiteLLM checks `not self.sensitive_data_route_to_model`.
  - >-
    PATCH treats an explicit `api_base: null` as sent, so dropping null keys before decoding must not lose them from `sent_fields`.
  - >-
    `checks` is untagged and `BedrockChecksConfigModel` needs at least one check, so `checks: {}` is refused rather than read as the list form.
  - >-
    `max_input_chars` defaults to 24000 and `max_concurrent_decision_calls` to 8 only on `DecisionModelGuardrailConfigModel`; on these types both stay unset.
  - >-
    Existing section tests build entries without `mode`, so a missing `mode` must land in `rejected` and never fail the load.
  - >-
    `model_dump` writes a check's defaulted `threshold` and `action`, so the Serialize side of `DecisionModelCheck` must not skip defaults.

