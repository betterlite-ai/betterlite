dod:
  - text: >-
      An empty map gives a `BaseLitellmParams` with LiteLLM's defaults: `fail_on_error`, `sanitize_error_detail` and `sticky_session_routing` true, `unreachable_fallback` `fail_closed`, the false-by-default bools false, and unset fields null in the dump.
    proof: [defaults-tests, oracle, helper-python]
  - text: >-
      `BASE_KEYS` holds exactly the keys a default `BaseLitellmParams` serializes.
    proof: [keys-tests]
  - text: >-
      `max_input_chars: 0`, `max_concurrent_decision_calls: 0` and an unknown `on_violation`, `unreachable_fallback` or `on_sensitive_data` are refused with `InvalidField` naming the field.
    proof: [limits-tests, oracle, helper-python]
  - text: >-
      A key outside `BASE_KEYS` in a body lands in `extra` and comes back in the dump unchanged, and `PARAM_KEYS` stay in `extra` on `BaseLitellmParams` but not on `LitellmParams`.
    proof: [extras-tests, oracle, helper-python]
  - text: >-
      `unreachable_fallback` and `on_sensitive_data` are lowercased on both types. `mode` text and list items, `default_action` and `on_disallowed_action` are lowercased on `LitellmParams` and left alone in the extras of `BaseLitellmParams`.
    proof: [lowercase-tests, oracle, helper-python]
  - text: >-
      `mode` accepts text, a list and a `tags` mapping with an optional `default`, the mapping keeps its case, and a mapping without `tags` is refused.
    proof: [mode-tests, oracle, helper-python]
  - text: >-
      `on_sensitive_data: route` is refused with `sensitive_data_route_to_model` unset or empty and accepted when it's set, on both types.
    proof: [route-rule-tests, oracle, helper-python]
  - text: >-
      `on_violation` of `block` or `alert` is refused unless `guardrail` is `mcp_security`, and `warn` and `end_session` pass for any guardrail.
    proof: [violation-rule-tests, oracle, helper-python]
  - text: >-
      `checks` in list form is refused unless `guardrail` is `decision_model`.
    proof: [checks-rule-tests, oracle, helper-python]
  - text: >-
      `DecisionModelCheck` refuses an empty name, empty or blank instructions, a threshold outside 0.0 to 1.0 and an unknown action, and defaults `threshold` to 0.7 and `action` to `block`.
    proof: [decision-check-tests, oracle, helper-python]
  - text: >-
      On `LitellmParams` a numeric `timeout` and numeric text give a float, `""` gives null, and other text, blank text and non-finite text are refused. `BaseLitellmParams` takes only a number.
    proof: [timeout-tests, oracle, helper-python]
  - text: >-
      An absent or null `default_on` is false on `LitellmParams` and null on `BaseLitellmParams`.
    proof: [default-on-tests, oracle, helper-python]
  - text: >-
      `sent_fields` returns only the keys the body sent, an explicit null stays null, and lowercased values come back lowercased.
    proof: [sent-fields-tests, oracle, helper-python]
  - text: >-
      The Debug text of `BaseLitellmParams`, `LitellmParams`, `Guardrail` and `Settings`, and the text of every `GuardrailParamsError`, contain neither `api_key`, `credentials`, an extra's value nor the bad value of a refused field, while the serialized dump still holds `api_key` and `credentials` as text.
    proof: [secret-tests]
  - text: >-
      `ContentFilterConfigModel` round-trips its seven fields and refuses a `pattern_type` other than `prebuilt` or `regex`.
    proof: [content-filter-tests, oracle, helper-python]
  - text: >-
      `Guardrail`, `GuardrailEventHooks`, `DynamicGuardrailParams`, `GuardrailDefinitionLocation`, `PiiEntityCategoryMap`, `GuardrailItemSpec`, `GuardrailInfoResponse`, `ListGuardrailsResponse`, `GuardrailUiAddSettings`, `ApplyGuardrailRequest`, `ApplyGuardrailResponse` and `PatchGuardrailRequest` carry LiteLLM's wire names and defaults, and `ApplyGuardrailRequest` and `PatchGuardrailRequest` ignore unknown keys. `Guardrail` also has `team_id: Option<String>`, `None` after a config load.
    proof: [record-tests, oracle, helper-python]
  - text: >-
      A YAML entry with `mode: pre_call` loads through `ConfigLoader` into `config.sections.guardrail_params.guardrails`, and a named test loads every key in `BASE_KEYS` and `PARAM_KEYS`.
    proof: [section-load-tests]
  - text: >-
      A bad entry lands in `rejected` with its name and a reason, and the entries around it still load in file order.
    proof: [section-reject-tests]
  - text: >-
      A key no section reads on a guardrail entry still fails the load with `ConfigError::Unsupported`, and every existing section test still passes with this view in place.
    proof: [section-unknown-tests, section-regression]
  - text: >-
      `os.environ/` text resolves in nested mappings and mappings inside lists, stays as written for plain text list items, gives null for a missing or empty variable, and goes through the shared parsers for bool and number keys, with bad text rejecting only that entry and naming the variable.
    proof: [env-tests]
  - text: >-
      `LakeraCategoryThresholds` lives in the section and the existing Lakera tests pass through the re-export.
    proof: [lakera-tests]
  - text: >-
      New valid, truncated and non-UTF-8 byte seeds replay through the three decoders without a panic.
    proof: [decoder-corpus]
  - text: >-
      New helper seeds replay through the shared helper-case parser.
    proof: [helper-case-corpus]

  - text: "A float in an extras value, such as `timeout: 1.5`, stays a number after decoding even with serde_json `arbitrary_precision` on, and a test named `extras_keep_float_numbers` proves it."
    proof: [extras-tests]
checks:
  optional: [mutants]
  commands:
    - id: defaults-tests
      why: field defaults or the null-for-unset dump are missing
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::guardrail_params::tests::defaults_/) - test(replays_the_guardrail_params_corpus)'
    - id: keys-tests
      why: the key table has drifted from the struct
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::guardrail_params::tests::keys_/) - test(replays_the_guardrail_params_corpus)'
    - id: limits-tests
      why: positive limits or closed sets accept values LiteLLM refuses
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::guardrail_params::tests::limits_/) - test(replays_the_guardrail_params_corpus)'
    - id: extras-tests
      why: undeclared body keys are dropped or kept in the wrong type
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::guardrail_params::tests::extras_/) - test(replays_the_guardrail_params_corpus)'
    - id: lowercase-tests
      why: normalize_lowercase behavior is missing or runs on the wrong type
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::guardrail_params::tests::lowercase_/) - test(replays_the_guardrail_params_corpus)'
    - id: mode-tests
      why: one of the three mode shapes doesn't parse or the mapping changes case
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::guardrail_params::tests::mode_/) - test(replays_the_guardrail_params_corpus)'
    - id: route-rule-tests
      why: the sensitive data routing rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::guardrail_params::tests::route_rule_/) - test(replays_the_guardrail_params_corpus)'
    - id: violation-rule-tests
      why: the on_violation rule for mcp_security is missing
      run: >-
