id: B3662
title: Guardrail mode validation and request configuration
description: >-
  Add the `guardrail_params` config section: the typed form of one entry under the top-level `guardrails:` list, and of the guardrail bodies the admin routes will take. No config view reads `mode` today, so a real LiteLLM entry with `mode: pre_call` fails to load with `ConfigError::Unsupported`. After this task that entry loads and later tasks read `config.sections.guardrail_params.guardrails`.

  Put the view in `crates/betterlite-config/src/sections/guardrail_params.rs` (`Raw`, `Settings`, `impl Section for Raw`, the `pub mod` lines) and the rest in these files under `guardrail_params/`, each below 300 lines: `error.rs` (`GuardrailParamsError`, a thiserror enum), `keys.rs`, `opaque.rs`, `content_filter.rs`, `decision_check.rs`, `mode.rs`, `base.rs`, `params.rs`, `environment.rs`, `records.rs`, `routes.rs`, `decode.rs`, `tests.rs`. Add `serde_path_to_error = "0.1.20"` and `chrono.workspace = true` to `crates/betterlite-config/Cargo.toml`; both are already in `Cargo.lock`.

  `opaque.rs` holds `OpaqueParams`, a `#[serde(transparent)]` newtype over `BTreeMap<String, GuardrailValue>` with a hand-written Debug that prints only the keys. `GuardrailValue` already exists in `sections::guardrail_identity::item`. Provider secrets such as `aws_secret_access_key`, `client_secret` and `akto_api_key` land in these maps, so no derived Debug may reach their values.

  `base.rs` holds `BaseParamFields`, one field for each of the 40 fields LiteLLM's `BaseLitellmParams` declares from line 908 to line 1149, deriving Serialize and Deserialize. `api_key` and `credentials` are `Option<SecretString>`. `experimental_use_latest_role_message_only`, `only_scan_new_messages` and `skip_unscannable_attachments` are `bool` defaulting to false. `fail_on_error`, `sanitize_error_detail` and `sticky_session_routing` are `bool` defaulting to true (`serde-inline-default` is already a dependency). `unreachable_fallback` is `UnreachableFallback` (`fail_closed` by default, `fail_open`). `on_violation` is `Option<OnViolation>` (`warn`, `end_session`, `block`, `alert`) and `on_sensitive_data` is `Option<OnSensitiveData>` (`block`, `route`). `max_input_chars` and `max_concurrent_decision_calls` are `Option<NonZeroU64>`, because LiteLLM declares `gt=0`. `end_session_after_n_fails` is `Option<i64>`, `timeout` is `Option<f64>`, `extra_headers` is `Option<Vec<String>>`, `category_thresholds` is `Option<LakeraCategoryThresholds>`, and `detect_secrets_config` and `additional_provider_specific_params` are `Option<OpaqueParams>`. The rest are `Option<bool>` or `Option<String>` as declared. Three names pass the 30-character limit, so keep the wire name with `#[serde(rename)]`: `latest_role_message_only`, `provider_specific_params`, `skip_system_message`.

  `BaseLitellmParams` has `fields: BaseParamFields`, `content_filter: ContentFilterConfigModel`, `extra: OpaqueParams` and two private `BTreeSet<String>` fields, `sent_keys` and `null_keys`. Serialize flattens the first three and skips the sets, with `api_key` and `credentials` written as text through `serialize_with` and `expose_secret`, because stored rows need the text and B3684 masks before it builds a response. So a dump has every declared key, unset ones as null, then the extras, the same shape as `model_dump()`. Deserialize goes through `#[serde(try_from = "BTreeMap<String, GuardrailValue>")]` so every path runs the same checks.

  The `TryFrom` works in this order. Record every key in `sent_keys` and the null ones in `null_keys`. Drop the null keys, so they take their default as docs/compatibility.md says. Lowercase `unreachable_fallback` and `on_sensitive_data` when they are text. Write the map with `serde_json::to_vec`, then decode `BaseParamFields` and `ContentFilterConfigModel` from those bytes with `serde_path_to_error::deserialize`. Put every key missing from `BASE_KEYS` into `extra`. Last, `on_sensitive_data: route` with `sensitive_data_route_to_model` unset or empty is an error with LiteLLM's message. A failed decode becomes `GuardrailParamsError::InvalidField { field }` holding the text of `error.path()` and nothing else, since serde's own message quotes the bad value. Going through bytes also means no `serde_json::Value` appears, so `max_new_expects` stays 0. Use `#[serde(flatten)]` only for Serialize: `serde_path_to_error` loses the path through a flattened Deserialize.

  Add `BaseLitellmParams::sent_fields(&self) -> Result<BTreeMap<String, GuardrailValue>, GuardrailParamsError>` for the PATCH route, the same result as `model_dump(exclude_unset=True)`: dump self, keep `sent_keys`, and write null for every key in `null_keys`.

  `keys.rs` holds four constants. `BASE_KEYS` is the 47 names of `BaseParamFields` and `ContentFilterConfigModel`. `PARAM_KEYS` is `guardrail`, `decision_model`, `checks`, `mode`. `BOOL_KEYS` and `NUMBER_KEYS` are the declared bool and number keys, with `timeout`, `max_input_chars`, `max_concurrent_decision_calls` and `end_session_after_n_fails` as the numbers.

  `content_filter.rs` holds `ContentFilterConfigModel` with its seven optional fields: `patterns`, `blocked_words`, `categories`, and the text fields `blocked_words_file`, `severity_threshold`, `pattern_redaction_format`, `keyword_redaction_tag`. LiteLLM's `BaseLitellmParams` inherits this class, so the keys sit directly on the entry. Reuse `ContentFilterPattern`, `BlockedWord` and `ContentFilterCategoryConfig` from `sections::content_filter_records`. `ContentFilterPattern.pattern_type` stays a `String` on main, because `crates/betterlite-guardrails/src/pattern_matching.rs` reports unknown types itself. This model does its own check: a `pattern_type` other than `prebuilt` or `regex` is `InvalidField`.

  `mode.rs` holds `ModeTarget` (untagged, `One(String)`, `Many(Vec<String>)`), `Mode` (`tags: BTreeMap<String, ModeTarget>`, required, and `default: Option<ModeTarget>`) and `LitellmParamsMode` (untagged, `One(String)`, `Many(Vec<String>)`, `Tagged(Mode)`). This task doesn't compare mode text against `GuardrailEventHooks`.

  `decision_check.rs` holds `DecisionModelCheck` and `GuardrailChecks`. `DecisionModelCheck` has `name` (not empty), `instructions` (not empty, not blank after trim), `threshold` (default 0.7, from 0.0 to 1.0 inclusive) and `action`, `DecisionCheckAction` with `block` by default and `log`. `GuardrailChecks` is untagged, `Bedrock(BedrockChecksConfigModel)` and `Decision(Vec<DecisionModelCheck>)`. B3661 builds `BedrockChecksConfigModel` under `sections::guardrail_translation`.

  `params.rs` holds `LitellmParams` with `base: BaseLitellmParams`, `guardrail: String`, `decision_model: Option<String>`, `checks: Option<GuardrailChecks>`, `mode: LitellmParamsMode`, and the same serde shape as the base: Serialize flattens `base`, Deserialize goes through `TryFrom<BTreeMap<String, GuardrailValue>>`. Before it builds the base, the `TryFrom` lowercases `mode`, `default_action` and `on_disallowed_action` (text, and the text items of a list; a mapping stays as it is), turns `timeout` text into a number, and sets an absent or null `default_on` to false. `""` as `timeout` removes the key; other text goes through `betterlite_env::number::<f64>("timeout", text)` and anything not finite is `GuardrailParamsError::InvalidTimeout`. After the base it decodes the four `PARAM_KEYS` the same path-tracking way, removes them from `base.extra`, and applies two rules with LiteLLM's messages: `on_violation` of `block` or `alert` needs `guardrail: mcp_security`, and `checks` in list form needs `guardrail: decision_model`. A missing or null `guardrail` or `mode` is `MissingField { field }`.

  `records.rs` holds the plain types: `Guardrail` (`guardrail_id`, `guardrail_name`, `litellm_params`, `guardrail_info`, `policy_template`, `created_at`, `updated_at`, with the two times as `Option<DateTime<Utc>>`, and `team_id: Option<String>`; LiteLLM's TypedDict has no such field, but approve stores it in memory and the v2 list reads it, so it is `None` for config guardrails and set for database ones, and a config entry never supplies it), `GuardrailEventHooks` (the eight hooks from `pre_call` to `realtime_input_transcription`, wire names as in LiteLLM), `DynamicGuardrailParams` (`extra_body`), `GuardrailDefinitionLocation` (`db`, `config`), `PiiEntityCategoryMap`, `GuardrailItemSpec` (`callbacks` required, `default_on`, `logging_only`, `enabled_roles: Option<Vec<Role>>`, `callback_args`) and `LakeraCategoryThresholds`. Move that last one out of `crates/betterlite-guardrails/src/lakera.rs` unchanged and `pub use` it there so `lakera/tests.rs` keeps compiling; the guardrails crate depends on config, so config can't import it from there. Every Python `dict` in `records.rs` and `routes.rs` is a `BTreeMap<String, GuardrailValue>`.

  `routes.rs` holds the admin route records: `GuardrailInfoResponse` (`guardrail_definition_location` defaults to `config`, `litellm_params: Option<BaseLitellmParams>`), `ListGuardrailsResponse`, `GuardrailUiAddSettings` (LiteLLM's `GuardrailUIAddGuardrailSettings`, shortened for the 30-character limit; `decision_model_providers` defaults to empty), `ApplyGuardrailRequest` (`input_type` defaults to `request`, `entities: Option<Vec<PiiEntityType>>`), `ApplyGuardrailResponse` and `PatchGuardrailRequest` (`litellm_params: Option<BaseLitellmParams>`). All ignore unknown body keys, as a default pydantic model does.

  The section view: `Raw { guardrails: Vec<RawEntry> }` with `#[serde(default)]`, where `RawEntry` reads `guardrail_name`, `guardrail_id`, `guardrail_info`, `policy_template`, `created_at`, `updated_at` with the types `Guardrail` declares, and `litellm_params` as `KnownParams`. `KnownParams` wraps a `BTreeMap<String, GuardrailValue>` and has a small hand-written Deserialize with a map visitor: a key in `BASE_KEYS` or `PARAM_KEYS` is read as `GuardrailValue`, and any other key is read with `map.next_value::<IgnoredAny>()`. `serde_ignored` only reports what goes through `IgnoredAny`, so a key no section reads stays `ConfigError::Unsupported`. Never read the whole map as a `BTreeMap`: that marks every key as read and breaks `generic_guardrail_api_config_retains_unknown_paths`, `grayswan_config_retains_unknown_paths` and `lasso_config_retains_unknown_paths`. So a `LitellmParams` built from config has an empty `extra`, and provider keys stay with the provider's own section. A `LitellmParams` built from a request body keeps them.

  `Settings` has `guardrails: Vec<Guardrail>` and `rejected: Vec<RejectedGuardrail>` (`guardrail_name`, `reason: String`), deriving Debug, Clone and Default. `convert` walks the entries in file order, resolves env references, then calls `LitellmParams::try_from`. A failure pushes a `RejectedGuardrail` and the load goes on, because `init_guardrails_v2` logs and skips a bad entry and starts the proxy without it. B3683 writes that log line from `rejected`.

  `environment.rs` follows `_resolved_config_value` in proxy_server.py. Text starting with `os.environ/` is replaced by the variable's value, a mapping's values recurse, and a list recurses only into items that are mappings, so a plain text item in a list stays as written. A missing or empty variable gives null. When a top-level key in `BOOL_KEYS` or `NUMBER_KEYS` was resolved from a variable, its text goes through `betterlite_env::flag` or `betterlite_env::number`, and bad text rejects that entry through `GuardrailParamsError::Environment` naming the variable. Call `EnvironmentLookup::lookup` directly: `resolve_string` in resolve.rs turns a missing variable into a load error, and LiteLLM doesn't.

  `decode.rs` names the byte decoders for outside input: `decode_litellm_params(body: &[u8])`, `decode_patch_request(body: &[u8])` and `decode_apply_request(body: &[u8])`, each returning `Result<_, GuardrailParamsError>` through `serde_path_to_error` over `serde_json::Deserializer::from_slice`. The routes that call them (B3684 to B3687) own the body size limit, and serde_json's recursion limit of 128 bounds nesting. Add the fuzz target `guardrail_params` at `crates/betterlite-config/fuzz/fuzz_targets/guardrail_params.rs`, feeding the same bytes to all three, with a `[[bin]]` entry in `crates/betterlite-config/fuzz/Cargo.toml` (`test = false`, `doc = false`, `bench = false`). Seed `crates/betterlite-config/fuzz/corpus/guardrail_params/` with a valid params body, a valid patch body, a valid apply body, truncated JSON and bytes that aren't UTF-8. Add `replays_the_guardrail_params_corpus` to tests.rs, shaped like `replays_the_collector_settings_corpus` in `crates/betterlite-config/src/collector/tests.rs`.

  The helper operation the skeleton created for this task takes `function` and `body`, with `function` one of `base_params`, `litellm_params`, `patch_request`, `apply_request`, `content_filter`. Both sides answer `{"accepted": false}` when validation fails and `{"accepted": true, "dump": ...}` otherwise, so no error class or message is compared. The Python side calls `BaseLitellmParams.model_validate(body)`, `LitellmParams(**body)`, `PatchGuardrailRequest(**body)`, `ApplyGuardrailRequest(**body)` or `ContentFilterConfigModel(**body)`, then `model_dump(mode="json")`. LiteLLM's `LitellmParams` dump also holds every provider mixin field, so for `litellm_params` the Python side keeps only `BaseLitellmParams.model_fields`, the four `PARAM_KEYS` and keys sent in the body. For `patch_request` the dump is `litellm_params.model_dump(mode="json", exclude_unset=True)` on one side and `sent_fields()` on the other. Add one seed per helper case under `tools/oracle/fuzz/corpus/helper_case/guardrail-params-*`.

  Tests live in `guardrail_params/tests.rs`, with rstest for tables, and start with the prefix their check filters on: `defaults_`, `keys_`, `limits_`, `extras_`, `lowercase_`, `mode_`, `route_rule_`, `violation_rule_`, `checks_rule_`, `decision_check_`, `timeout_`, `default_on_`, `sent_fields_`, `secret_`, `content_filter_`, `record_`, `section_load_`, `section_reject_`, `section_unknown_`, `env_`. `keys_` compares `BASE_KEYS` with the keys of a serialized default so the two can't drift. `section_load_every_declared_key` loads one YAML entry that sets every name in `BASE_KEYS` and `PARAM_KEYS`, because a config key counts as supported only when a named test loads it.

