deviations:
  - what: The hit list in a flagged moderation verdict names categories in sorted order, where LiteLLM keeps the order of the response's `categories` object.
    why: >-
      `OtelModelValue::Object` is a `BTreeMap`, so the key order is gone by the time the payload reaches this code. The verdict text exists only on the captured output attribute. Keeping the order would mean changing the shared value type that B3892 merged. The oracle case sends its categories in sorted order.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/model/payloads.py#L839-L847

out_of_scope:
  - LLMCallSpanData and the capture gate on choices (payloads.py L398-L491), EmbeddingOutput, ToolDefinition, _tool_from_entry, _extract_tools, the MCP span records and their predicates belong to B3844.
  - _parse_error (payloads.py L940-L951) is already built as SpanError::from_payload by B3843, and B3844 calls it.
  - LLMRequestParams, LLMUsage, LLMCost, SpanError, ServerInfo, GuardrailSpanData, ServiceSpanData, ProxyRequestSpanData, sanitize_event_metadata and the helpers _cache_token_value, _json_or_none, _guardrail_mode_str, _total_masked_entities and _dicts (payloads.py L67-L365 and L632-L725) are merged under B3843.
  - Reading choices into span attributes belongs to the mappers in B3845 and B3846.

pitfalls:
  - 'The completion rewrite tests `"message" not in choice`, so `{"message": null, "text": "hi"}` passes through unchanged and the check must be `contains_key`, not a null test.'
  - The rewritten choice always has a `finish_reason` key, null when the source choice had none, and it keeps keys such as `index` and `logprobs`.
  - An empty `choices` list gives an empty result, so the next reader runs, but a non-empty list ends the chain even when no choice has a `message` or `text`.
  - Responses content is null only when no part holds a string, so a single `output_text` part with `text` set to "" gives "" and not null.
  - The tool-call `arguments` field reads `input` for `custom_tool_call` only, and `type` in the result is always `function`, even for a custom tool.
  - A Responses output holding only `reasoning` items returns nothing from that reader, so the chain moves on and may end empty.
  - Moderation, rerank and search all read `results`, so one list can fall through two readers before search picks up its `title`.
  - OCR keeps `markdown` set to "" because its filter is `is not None`, while transcription drops `text` set to "".
  - 'A flagged result counts a category only when its value is the bool true, so `{"hate": 1}` gives plain `flagged`.'
  - Rust prints the f64 `1.0` as `1` with `{}`, so format the rerank score with `{:?}` to get LiteLLM's `[0] 1.0`.
  - An image `url` of "" is still a location, so the summary is "" and the choice exists with empty content, or `<revised_prompt>` plus a newline when a prompt is present.
  - The `b64_json` size can go below zero, since the one-character text `=` gives `-1 bytes`, so count in `i64` with `i64::try_from` and not in `usize`.
  - '`num_bytes` set to 0 still makes a choice, because LiteLLM tests `size is None`.'
  - Python's `as_str` stringifies numbers but `OtelModelValue::as_str` returns None for them, and docs/compatibility.md lets that stand, so a case must send strings where LiteLLM declares strings.

review_level: standard

budget:
