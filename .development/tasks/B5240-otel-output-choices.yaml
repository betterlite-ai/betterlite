    why: The three readers of `results`, moderation, rerank and search.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/model/payloads.py#L876-L905
    why: Image and binary size summaries.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/model/payloads.py#L908-L937
    why: The Responses part text, tool call and finish reason helpers.

dod:
  - text: output_choices tries the readers in LiteLLM's order, returns the first non-empty result, and returns an empty list when nothing matches.
    proof: [reader-order, oracle, helper-python]
  - text: Chat choices pass through unchanged, and a text-completion choice becomes a chat-shaped choice that keeps its other keys.
    proof: [completion-choices, oracle, helper-python]
  - text: A Responses API output folds into one choice with LiteLLM's role, content, refusal, tool calls and finish reason.
    proof: [responses-choices, oracle, helper-python]
  - text: OCR pages and transcription text become text choices, with empty markdown kept and empty transcription text dropped.
    proof: [document-text, oracle, helper-python]
  - text: Moderation, rerank and search results become LiteLLM's joined lines, and results a reader can't use are skipped.
    proof: [result-lines, oracle, helper-python]
  - text: Image and binary responses become location or size summaries and never carry the bytes.
    proof: [media-summaries, oracle, helper-python]
  - text: finish_reasons returns each non-empty finish_reason in choice order.
    proof: [finish-reasons, oracle, helper-python]
  - text: Every oracle case has a seed in the helper case corpus and the corpus replays.
    proof: [helper-case-corpus]

checks:
  optional: []
  commands:
    - id: reader-order
      why: the order test is missing or a later reader beats an earlier one
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::output_choices::tests::first_non_empty_reader_wins($|::)/)'
    - id: completion-choices
      why: the completion test is missing or a rewritten choice loses a key or keeps text
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::output_choices::tests::completion_choices_match_litellm($|::)/)'
    - id: responses-choices
      why: the Responses test is missing or a field of the folded choice differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::output_choices::tests::responses_output_folds_into_one_choice($|::)/)'
    - id: document-text
      why: the OCR and transcription test is missing or an empty value is treated wrongly
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::output_choices::tests::ocr_and_transcription_text($|::)/)'
    - id: result-lines
      why: the results test is missing or a moderation, rerank or search line differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::output_choices::tests::moderation_rerank_and_search_lines($|::)/)'
    - id: media-summaries
      why: the media test is missing or an image or binary summary differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::output_choices::tests::media_becomes_size_summaries($|::)/)'
    - id: finish-reasons
      why: the finish reason test is missing or an empty or absent reason is kept
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::output_choices::tests::finish_reasons_keep_non_empty_values($|::)/)'
    - id: helper-python
      why: the oracle adapter is untouched or fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5240.py tools/oracle/helpers/b5240)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: the output choice seeds are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/otel-output-choices-*")" && grep -lE '^[[:space:]]+"?b5240"?:' tools/oracle/fuzz/corpus/helper_case/otel-output-choices-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

