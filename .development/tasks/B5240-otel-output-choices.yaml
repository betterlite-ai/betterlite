id: B5240
title: OTel response output choices
description: >-
  LiteLLM's OTel model folds the `response` field of a StandardLoggingPayload into chat-shaped choices, so vendor mappers read one shape whichever endpoint ran. This task ports that fold and nothing else. B3844 calls it from `LLMCallSpanData`, and no span or route uses it yet.


  Build `crates/betterlite-logging/src/otel/model/payloads/output_choices.rs` with two public functions. `output_choices(response: &MetadataMap) -> Vec<MetadataMap>` is LiteLLM's `_output_choices`. `finish_reasons(choices: &[MetadataMap]) -> Vec<String>` is `_finish_reasons`: it keeps each non-empty `finish_reason` string. `MetadataMap` is `crate::otel::model::metadata::wire::MetadataMap`, a `BTreeMap<String, OtelModelValue>`. The return type stays a map because a chat choice passes through with whatever keys the provider sent. Keep the readers below private and put them in `output_choices/responses.rs` and `output_choices/summaries.rs`, so each file stays under 300 lines. Tests go in `output_choices/tests.rs`, declared with `#[path = "output_choices/tests.rs"] mod tests;` as the sibling modules do. Reuse `helpers::dicts` and `helpers::float_value` from `payloads/helpers.rs` and `as_int` from `otel::model::utils::coercion`.


  `output_choices` runs its readers in this order and returns the first result that isn't empty: completion, responses, OCR, transcription, moderation, rerank, search, image, binary. When all of them are empty it returns an empty list.


  Two shapes recur. A text choice is `{"message": {"role": "assistant", "content": <text>, "refusal": null, "tool_calls": null}, "finish_reason": null}`. A joined choice is one text choice whose content is the parts joined with two newlines, and no parts means no choice.


  Completion reads the objects in `choices`. A choice with no `message` key and a string `text` is rewritten: its other keys stay, `text` goes, `message` becomes the text choice's message with that text as content, and `finish_reason` is the choice's own string or null. Every other choice passes through unchanged.


  Responses reads the objects in `output`. Message items have `type` `message`. Tool items have `type` `function_call` or `custom_tool_call`. With neither kind it returns nothing. Otherwise it returns one choice. Its role is the first non-empty `role` among the message items, or `assistant`. Its content joins, with no separator, the `text` of every `output_text` part across the message items' `content`, and its refusal does the same with the `refusal` field of `refusal` parts. Each is null only when no part of that type holds a string. Its `tool_calls` is the list of tool calls, or null when there are none. A tool call is `{"id": <call_id, else id, else "">, "type": "function", "function": {"name": <name or "">, "arguments": <input for custom_tool_call, arguments otherwise, or "">}}`. The finish reason comes from the response's `status`: `completed` gives `tool_calls` when there are tool calls and `stop` when there aren't, `incomplete` gives `content_filter` when `incomplete_details.reason` is `content_filter` and `length` otherwise, and any other status gives null.


  OCR makes a joined choice from the `markdown` string of each object in `pages`. Transcription makes a text choice from a non-empty string `text`.


  Moderation reads the objects in `results`, skips those whose `flagged` isn't a bool, and makes a joined choice of one verdict each: `not flagged`, `flagged: a, b` naming the `categories` keys whose value is true, or `flagged` when none is. Rerank reads the same `results` and needs `index` through `as_int` and `relevance_score` through `float_value`. It makes a joined choice of `[index] score` lines, each followed by a newline and `document.text` when that text is non-empty, and skips results missing either number. Search reads the same `results`. For each it joins the non-empty `title`, `url` and `snippet` with one newline, skips a result with none of them, and makes a joined choice of those lines.


  Image reads the objects in `data`. An object's location is its `url` when that is a string, even an empty one. Failing that, a string `b64_json` gives `b64_json image (N bytes)`, where N is the string's length times 3, divided by 4 with the remainder dropped, minus the number of `=` signs in its last two characters. A non-empty `revised_prompt` goes on its own line before the location. Objects with no location are skipped and the rest make a joined choice. Binary reads `num_bytes` through `as_int` and makes one text choice: `<content_type> (<size> bytes)` with a non-empty `content_type`, `<size> bytes` without. The bytes themselves never reach a choice.


  The oracle adapter is operation `b5240`, with tagged inputs `{"function": "output_choices", "response": {...}}` and `{"function": "finish_reasons", "choices": [...]}`. The Python side calls `payloads._output_choices` and `payloads._finish_reasons` and answers `{"result": ...}` the way `tools/oracle/helpers/b3843.py` does. Every case gets a fuzz seed of the same content at `tools/oracle/fuzz/corpus/helper_case/otel-output-choices-<case>.yaml`.

