id: B4081
title: Extract comparable shadow responses and billed call costs
description: >-
  Build response evidence readers and typed shadow/judge outcomes in betterlite-core::shadow_evidence,
  extracting judgeable text from chat and Responses API surfaces with tool serialization, reading
  response costs from deployment-stamped values with fallback to the public price map, and
  assembling typed result records for shadow and judge calls.

  From chat responses, extract the assistant message's prose and any tool calls, serializing each
  call as `[tool call] name(arguments)`. From Responses API responses, validate and extract the
  output_text property and tool calls the same way. Both surfaces feed the same signature:
  read field values from mappings or typed objects (dicts or dataclass-like). Responses with no
  readable text and no tool calls produce empty string only when the reply is truly empty; any
  readable message or choice counts. Finish reason comes from the choice; if no choice is
  readable, return "unknown".

  Cost for a shadow or judge call reads from response._hidden_params.response_cost first (the
  router client's stamped cost from deployment pricing). If absent or unreadable, fall back to
  litellm.completion_cost with the response object, returning zero for unmapped models instead
  of raising an error. Cost must be precise through Decimal. Confidence in judge verdicts is also
  Decimal and clamped to [0, 1] after parsing. Store failure reasons with exception class, source
  location and message, capped at 500 characters per attempt, so similar failures group by cause.

  Routing decisions embed cost and tier labels a later stage needs: preserve the routing_decision
  metadata key (empty when a plain model served the request), extract tier_label or tier field,
  and extract classifier_cost from the decision. These are separate from the response-level costs.

  Three result records capture what attempt rows will record: _CallFailure (error, cost,
  classifier_cost), _ShadowResponse (text, model, tier, cost, classifier_cost) and _JudgeVerdict
  (preference, confidence, cost), all frozen dataclasses. Every zero/default is stored explicitly
  so attempts never lose a cost or confidence signal due to null coalescing.

  Responses API validation errors and unknown call types are silent skips, never failures: a
  request the owner cannot judge is forwarded without evaluation, maintaining the original path.
  Preserve first-fence extraction in JSON parsing (B4080), outermost-brace fallback and
  non-object rejection.

