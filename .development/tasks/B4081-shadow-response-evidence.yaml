deviations:
  - what: Costs are Decimal throughout instead of float, preserving precision for billing.
    why: betterlite uses rust_decimal for financial accuracy; LiteLLM uses float but the semantic behavior (stamped cost fallback, unmapped zero) is identical.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L513-L531
  - what: Confidence in judge verdicts is Decimal and clamped to [0, 1] after parsing.
    why: Decimal enforces precision and the clamp prevents invalid percentages downstream.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L726-L730
  - what: Field readers use serde_json::Value for dict access and typed objects for duck-typed reads.
    why: Rust requires explicit type handling; the behavior (try dict.get, fall back to field access) matches the source.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L181-L192

out_of_scope:
  - "Sampling logic and job loading: owned by B4083."
  - "Judge execution and pairwise verdict generation: owned by B4084."
  - "Guardrail snapshot capture and request normalization: owned by B4082."
  - "Judge target resolution and dispatch: owned by B4080."
  - "Shadow evaluation pipeline orchestration: owned by B4085."
  - "Funnel event recording and spending: owned by B4083."
  - "litellm.completion_cost: a native SDK operation this task reads from; owned elsewhere."

pitfalls:
  - "Field readers must handle both dict-like and typed objects; a dict without a key returns None, not KeyError."
  - "Tool call invocation names can be None or missing entirely; use \"unnamed\" as the fallback, never panicking on missing fields."
  - "Empty responses have no message or choice at all; distinguish from no prose+no tools (empty) versus unreadable (different trace)."
  - "Finish reason is always a string even when read from untyped dicts; unreadable choice gives \"unknown\", not None."
  - "Responses API output_text is a property, never a serialized field; dict-shaped responses must validate through the owner type to access it."
  - "Tool type checking for Responses API uses item.type in {function_call, custom_tool_call}; do not match partial strings."
  - "Deployment-stamped cost in response._hidden_params is read-only visibility; if absent, the price map lookup is the source of truth, never the request metadata."
  - "Failure details must include the raising frame's filename (basename only) and line number; omit if no traceback exists."
  - "Judge reply shape is description-only; never quote the response content itself in diagnostics (responses.model, finish_reason and content size only)."
  - "Routing decisions are optional metadata; absence is not an error, just an empty dict that yields no tier or classifier cost."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
