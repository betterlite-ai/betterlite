dod:
  - text: Chat response text extraction reads prose from content and serializes tool calls as `[tool call] name(arguments)`, joining them with prose if both present.
    proof: [response-text-tests]
  - text: Responses API object validation rejects unmappable responses and returns empty text for unmappable output; output_text aggregation joins message items without separators.
    proof: [responses-text-tests]
  - text: Tool call reading handles tool_calls arrays, function_call singlets and custom_tool_call types with name and arguments/input fields.
    proof: [response-text-tests, responses-text-tests]
  - text: Finish reason returns the choice's finish_reason or "unknown" when no readable choice exists.
    proof: [response-text-tests]
  - text: Call cost reads response._hidden_params.response_cost first; when absent, calls completion_cost(response) and returns zero for unmapped models instead of raising.
    proof: [cost-tests, shadow-evidence-oracle]
  - text: Failure detail includes exception class, source location (filename:line) and message, capped at 500 characters.
    proof: [failure-tests]
  - text: Judge reply shape describes finish_reason, content size and model; shape-only output never includes quoted response content.
    proof: [judge-reply-tests]
  - text: Routing decision reads metadata, returns empty dict when absent, and extracts tier_label/tier and classifier_cost.
    proof: [routing-tests]
  - text: _CallFailure, _ShadowResponse and _JudgeVerdict are frozen dataclasses with Decimal cost/classifier_cost and Decimal confidence [0, 1] in verdicts.
    proof: [record-tests]
  - text: Empty chat response (no message or no prose and no tool calls) returns empty string, not an error.
    proof: [response-text-tests]

checks:
  optional: [mutants]
  commands:
    - id: response-text-tests
      why: chat response text extraction fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_evidence::chat_text::/)'
    - id: responses-text-tests
      why: Responses API text extraction fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_evidence::responses_text::/)'
    - id: cost-tests
      why: call cost calculation fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_evidence::cost::/)'
    - id: failure-tests
      why: failure detail formatting fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_evidence::failure::/)'
    - id: judge-reply-tests
      why: judge reply shape detection fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_evidence::judge_reply::/)'
    - id: routing-tests
      why: routing decision extraction fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_evidence::routing::/)'
    - id: record-tests
      why: result record construction or types fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_evidence::records::/)'
    - id: shadow-evidence-oracle
      why: response evidence behavior differs from pinned LiteLLM
      run: test -f tools/oracle/cases/helpers/shadow-evidence/basic-chat-response.yaml && cargo build --locked -p betterlite-oracle && target/debug/betterlite-oracle tools/oracle/cases/helpers/shadow-evidence

