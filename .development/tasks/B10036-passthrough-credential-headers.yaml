id: B10036
title: Pass-through request logging redacts the caller's credential headers
description: >-
  Fix a secret leak that B3610 ported from LiteLLM. request_headers_json in
  crates/betterlite-server/src/passthrough/request_context.rs copies every incoming header unchanged into
  litellm_params.proxy_server_request.headers. So the caller's authorization, x-api-key, x-litellm-api-key, cookie
  and proxy-authorization values reach the logging callbacks and, through build_failure_payload, the pass-through
  failure hook's request_data. LiteLLM does the same: _init_kwargs_for_pass_through_endpoint stores request.headers
  as is, at d665dc1a and still in 1.106.4. B3610's reviewer found it and the architect decided to fix it, since a
  leaked secret is fixed and recorded as a deviation.


  The fix keeps every header name and replaces the value of each credential header with the redaction value. The
  list of credential header names already exists as CREDENTIAL_HEADER_NAMES in
  crates/betterlite-server/src/mcp/catalog_guard/headers.rs, next to REDACTED_VALUE ("***REDACTED***"). Both move to a
  new crate-level module, crates/betterlite-server/src/credential_headers.rs, as pub(crate) items, and
  catalog_guard/headers.rs and request_context.rs both use them from there. catalog_guard's own redaction keeps its
  behavior. The other headers, the repeated-header join and the skip of non-UTF-8 values stay as B3610 built them.
scope:
  paths:
  - crates/betterlite-server/src/credential_headers.rs
  - crates/betterlite-server/src/mcp/catalog_guard/headers.rs
  - crates/betterlite-server/src/passthrough/request_context.rs
  - crates/betterlite-server/src/passthrough/tests/request_context.rs
  - crates/betterlite-server/src/passthrough/tests/failure_payload.rs
  - docs/deviations/B10036.yaml
  lint_tables: false
references:
- why: LiteLLM stores the raw request headers in the pass-through kwargs.
  url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L650-L660
dod:
- text: >-
    CREDENTIAL_HEADER_NAMES and REDACTED_VALUE live once, in crates/betterlite-server/src/credential_headers.rs, and
    catalog_guard/headers.rs and request_context.rs both use them; neither file keeps its own copy of the list or the
    value.
  proof: [passthrough-kwargs, catalog-guard]
- text: >-
    A pass-through request with authorization, x-litellm-api-key and cookie headers plus an x-custom header gives
    proxy_server_request.headers with "***REDACTED***" for the three credential headers and the x-custom value
    unchanged, in the init kwargs and in the failure payload's request_data.
  proof: [passthrough-kwargs]
- text: >-
    docs/deviations/B10036.yaml has one row: the pass-through kwargs keep credential header names with a redacted
    value, where LiteLLM stores request.headers as is, linking the reference above.
  proof: [passthrough-kwargs]
checks:
  optional: []
  commands:
  - id: passthrough-kwargs
    why: The pass-through init kwargs or failure payload tests are missing or fail.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::passthrough_(init_kwargs|build_failure_payload)($|::)/) - test(/replays_the_/)'
  - id: catalog-guard
    why: The MCP catalog guard header redaction broke.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::/) - test(/replays_the_/)'
oracle_cases: []
deviations:
- what: >-
    The pass-through kwargs keep every request header name but store "***REDACTED***" for the credential headers
    (authorization, api-key, x-api-key, x-goog-api-key, ocp-apim-subscription-key, x-litellm-api-key, cookie,
    proxy-authorization). LiteLLM stores request.headers as is.
  why: >-
    The raw values reach every logging callback and the pass-through failure hook, so the caller's keys and session
    cookie would leak into logs and third-party loggers.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L650-L660
out_of_scope:
- A custom key header set through litellm_key_header_name. The pass-through request context has no settings view today, and catalog_guard handles that name on its own.
- The other credential header lists in other crates (betterlite-models, betterlite-harness, betterlite-error and others). Their sets differ and none is in betterlite-server.
- The upstream headers the pass-through sends to the provider. Only the logged copy of the incoming headers changes.
pitfalls:
- HeaderMap names are already lowercase, so a lookup in CREDENTIAL_HEADER_NAMES needs no case change.
- A repeated credential header is still one key with the redaction value, not a joined list of redaction values.
review_level: standard
budget:
  max_changed_lines: 140
  max_new_expects: 0
