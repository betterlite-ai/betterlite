id: B867
title: Management route permission tables
description: >-
  Define typed permission-route constants for mcp_management_routes, agent_management_routes, master_key_only_routes,
  key_management_routes, team_service_account_key_routes, management_routes, spend_tracking_routes, global_spend_tracking_routes,
  internal_user_routes, internal_user_view_only_routes, org_admin_only_routes, admin_viewer_routes, org_admin_allowed_routes.
  Preserve every pinned literal, alias, template and enum expansion; these are policy data, not HTTP route
  registrations. Serve the named groups to route matching and role policy without importing endpoint modules.
  B207 still owns call-type mapping; B124 no longer owns these table entries. No URL is fetched and no
  caller string can create a new enum group.


  Build the production management_routes module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/_types.py:
  LiteLLMRoutes.mcp_management_routes (L583-L587; 5 source lines), LiteLLMRoutes.agent_management_routes
  (L606-L612; 7 source lines), LiteLLMRoutes.master_key_only_routes (L688-L692; 5 source lines), LiteLLMRoutes.key_management_routes
  (L694-L719; 26 source lines), LiteLLMRoutes.team_service_account_key_routes (L721-L724; 4 source lines),
  LiteLLMRoutes.management_routes (L726-L782; 53 source lines), LiteLLMRoutes.spend_tracking_routes (L784-L805;
  18 source lines), LiteLLMRoutes.global_spend_tracking_routes (L807-L821; 14 source lines), LiteLLMRoutes.internal_user_routes
  (L885-L913; 25 source lines), LiteLLMRoutes.internal_user_view_only_routes (L915-L929; 13 source lines),
  LiteLLMRoutes.org_admin_only_routes (L1024-L1036; 7 source lines), LiteLLMRoutes.admin_viewer_routes
  (L1050-L1126; 59 source lines), LiteLLMRoutes.org_admin_allowed_routes (L1129-L1129; 1 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the management_routes operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a management-routes-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 237 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  237 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 474 changed lines estimated within a 475-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
