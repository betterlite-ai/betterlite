id: B867
title: Management route permission tables
description: >-
  Supply management permission tables in betterlite-auth without registering handlers. Own
  KeyManagementRoutes as well as the eleven LiteLLMRoutes groups below. B868 owns the eight MCP/agent
  management literals because its composites also use them; import those slices here. Role evaluation
  stays in B742/B883, and no endpoint service, database, setting or monetary conversion is called here.

  KeyManagementRoutes declares /key/generate, /key/update, /key/delete, /key/regenerate,
  /key/service-account/generate, /key/{key_id}/regenerate, /key/block, /key/unblock,
  /key/bulk_update, /team/key/bulk_update, /key/{key_id}/reset_spend, /key/access_group_assignment,
  /auto_router/manage, /key/info, /key/health, /key/list, /key/aliases, /team/daily/activity,
  /team/daily/activity/aggregated, /spend/logs and /spend/logs/v2 in that order. Preserve the
  corresponding named enum variants. access_group_assignment is an opt-in field permission, not a
  registered path. key_management_routes orders generate/update/delete/info/regenerate/service-account/
  path-regenerate/list/block/unblock/bulk-update/team-bulk-update, then team activity and its aggregated
  peer, /team/daily/activity/aggregated/keys, /search, /model_top_keys (the latter two under the same
  aggregated prefix), /team/daily/activity/export, both spend-log variants, reset-spend, aliases,
  access-group-assignment and auto-router-manage. It omits KEY_HEALTH. team_service_account_key_routes
  is the two-element tuple /key/generate then /key/update; master_key_only_routes is
  /global/spend/reset, /memory-usage-in-mem-cache, /memory-usage-in-mem-cache-items.

  management_routes starts /user/new, /management/v1/users/bulk, /user/update, /user/bulk_update,
  /user/delete, /management/v1/users/bulk_delete, /user/info, /user/list; then the user daily family
  /user/daily/activity with suffixes '', /aggregated, /aggregated/keys, /aggregated/search,
  /aggregated/model_top_keys, /export, /aggregated/cache_leakage_keys in that order. Continue
  /team/new, /team/update, /team/{team_id}, /team/delete, /team/list, /v2/team/list, /team/info,
  /team/block, /team/unblock, /team/available, /team/metadata_schema, /team/permissions_list,
  /team/permissions_update, /team/permissions_bulk_update; the same daily family under /team without
  cache_leakage_keys; /team/spend/by_user, /gateway/daily/activity, /model/new, /model/update,
  /model/delete, /model/info, then /jwt/key/mapping with suffixes /new, /update, /delete, /list, /info.
  Append key_management_routes, B868 mcp_management_routes, then B868 agent_management_routes.

  spend_tracking_routes contains /spend/keys, /spend/users, /spend/tags, /spend/calculate, /spend/logs,
  /spend/logs/v2, /spend/logs/ui, /spend/logs/ui/{request_id}, /spend/logs/session/ui,
  /key/spend/report, /user/spend/report, /team/spend/report, /organization/spend/report,
  /management/v1/spend_logs/end_users, /management/v1/spend_logs/users, /cost/estimate.
  global_spend_tracking_routes instead contains /global/spend/logs, /global/spend,
  /global/spend/keys, /teams, /end_users, /models (each under /global/spend),
  /global/predict/spend/logs, /global/spend/report, /global/spend/provider, /global/spend/tags,
  /global/spend/all_tag_names, /spend/capture_rate. The global group is not folded into either
  internal-user group.

  internal_user_routes starts /global/activity, /global/activity/model, /global/activity/cache_hits;
  the six daily-family literals under /tag, then /tag/list; /v1/models/{model_id}, /models/{model_id},
  /guardrails/list, /v2/guardrails/list, /project/list, /project/info, /search_tools/list,
  /search_tools/ui/available_providers. Append spend_tracking, key_management, then B868 compliance.
  internal_user_view_only_routes appends compliance and the seven tag literals to spend_tracking,
  and never appends key_management. org_admin_only_routes is exactly /organization/info,
  /organization/delete, /organization/member_add, /organization/member_update,
  /organization/member_delete; deleting a member must stay in this organization-gated group.

  admin_viewer_routes begins /user/list, /user/available_users, /user/available_roles; the seven user,
  six team and six tag daily literals followed by /tag/list; /audit, /audit/{id}; the three global
  activity literals; /customer/list, /customer/info, /spend/logs/session/ui and both management spend-log
  facets. Continue /callbacks/list, /callbacks/configs, /get/config/callbacks, /alerting/settings,
  /config/list, /config/field/info, /budget/list, /management/v1/budgets, /budget/settings,
  /invitation/info, /guardrails/list, /v2/guardrails/list, /guardrails/submissions,
  /guardrails/submissions/{guardrail_id}, /guardrails/usage/overview, /policies/attachments/list,
  /get/mcp_semantic_filter_settings, /schedule/model_cost_map_reload/status, /model/cost_map/source,
  /auto_router/classifier/default_prompt. Append spend_tracking then B868 info_routes. This table
  does not replace B742's safe-method rule: a new GET route need not appear here. Finally
  org_admin_allowed_routes concatenates org_admin_only, management, B868 self_managed and admin_viewer,
  preserving duplicates and their order. No table here decides whether its handler authorizes a caller.

  Production ownership in litellm/proxy/_types.py: KeyManagementRoutes (L287-L325),
  LiteLLMRoutes.master_key_only_routes (L688-L692; 5 source lines), LiteLLMRoutes.key_management_routes
  (L694-L719; 26 source lines), LiteLLMRoutes.team_service_account_key_routes (L721-L724; 4 source lines),
  LiteLLMRoutes.management_routes (L726-L782; 53 source lines), LiteLLMRoutes.spend_tracking_routes (L784-L805;
  18 source lines), LiteLLMRoutes.global_spend_tracking_routes (L807-L821; 14 source lines), LiteLLMRoutes.internal_user_routes
  (L885-L913; 25 source lines), LiteLLMRoutes.internal_user_view_only_routes (L915-L929; 13 source lines),
  LiteLLMRoutes.org_admin_only_routes (L1024-L1036; 7 source lines), LiteLLMRoutes.admin_viewer_routes
  (L1050-L1126; 59 source lines), LiteLLMRoutes.org_admin_allowed_routes (L1129-L1129; 1 source lines).


  B856 Management::auth exposes the immutable tables, and Python reads the original enum values.
  Compare whole ordered arrays for each named group and all enum name/value pairs. Native
  literal_cases has a named rstest row for each path and table; group_expansion checks exact
  concatenations, internal_roles_exclude_global_spend and key_health_not_key_management protect
  omissions. B171 owns unknown helper tags and decoder replay; there is no new byte boundary.
  Keep the declarations and adjacent tests in domain submodules below 300 lines.

  Count 247 nonblank noncomment declaration lines, excluding the enum docstring. Reserve 255
  production, 250 table tests, 80 adapter and 30 dispatch lines: 615 within a 650-line gate.
