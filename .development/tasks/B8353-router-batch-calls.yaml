dod:
  - text: A file upload goes to every healthy deployment with its own request copy, the JSONL model is rewritten when B1035 says so, and the answer carries `model_file_id_mapping`.
    proof: [batch-calls-file]
  - text: Vector store create routes by model, or goes to the call type table without one.
    proof: [batch-calls-vector-create]
  - text: Batch create and cancel run the fallback executor with their metadata key, and cancel merges the deployment credentials.
    proof: [batch-calls-create, batch-calls-cancel]
  - text: Batch retrieve tries every deployment, returns the first batch, and raises the first error or LiteLLM's messages otherwise.
    proof: [batch-calls-retrieve]
  - text: Batch list merges the pages of every deployment and ignores failures.
    proof: [batch-calls-list]
checks:
  optional: []
  commands:
  - id: batch-calls-file
    why: A deployment is skipped, the JSONL keeps the public model, or the id mapping is missing.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::file_/)'
  - id: batch-calls-vector-create
    why: A vector store create without a model fails, or one with a model skips selection.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::vector_create_/)'
  - id: batch-calls-create
    why: Batch create uses the wrong metadata key or no slot.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::batch_create_/)'
  - id: batch-calls-cancel
    why: Batch cancel loses the deployment credentials or leaks `litellm_credential_name`.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::batch_cancel_/)'
  - id: batch-calls-retrieve
    why: Retrieve stops at the first failing deployment or raises the wrong error.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::batch_retrieve_/)'
  - id: batch-calls-list
    why: Pages are dropped or `has_more` is lost.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::batch_list_/)'
oracle_cases: []
deviations:
  - what: Each call type reaches its provider function through an injected executor, and no `litellm.<call>` module function is looked up.
    why: Rust has no module state, and the rules ask for constructor wiring.
out_of_scope:
  - "B1051 calls `aretrieve_batch` from the proxy route and owns its HTTP cases; B8355 passes the executors from the Python crate."
  - "B1035 owns the JSONL rewrite, B082 the file id mapping, B303 credentials, slots and request update, B016 selection and healthy deployments, B310 the fallback executor, B844 the model list."
  - "Router._override_vector_store_methods_for_router has a docstring and no statements at the pin, so there is nothing to build."
pitfalls:
  - "`aretrieve_batch` drops `custom_llm_provider` from both the request copy and the params before adding the resolved one, so a request value never overrides the deployment."
  - "`create_file_attempt` refuses a missing `file` or `purpose` per deployment, after `total_calls` is already incremented."
  - "`alist_batches` takes `last_id` from the last answer even when it is null, so a later empty page clears it."
  - "`avector_store_create` with a model has no retries; only the no-model path goes through the call type table."
  - "There is no exception alert sink: `router_settings.alerting_config` is refused at config load with an error naming the key, so LiteLLM's `send_llm_exception_alert` call point is left out."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
