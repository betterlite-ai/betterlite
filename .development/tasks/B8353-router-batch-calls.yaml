id: B8353
title: Router file, vector store create, batch cancel and list calls
description: >-
  The Python `Router` exposes `acreate_file`, `avector_store_create`, `acreate_batch`, `aretrieve_batch`, `acancel_batch` and `alist_batches`. B10143 builds `acreate_batch` and B10142 `aretrieve_batch`, each as an object of its own, because the batch routes (B1050, B1051) need only those two. This task builds the other four and one object that holds all six, next to B6020's and B8352's, so the Python crate (B8355) calls the same code.


  Put the code in the new module `crates/betterlite-sdk/src/router_batch_calls.rs` and its folder. `RouterBatchCalls` is built from B6020's `RouterCompletionParts` (selection, fallback executor, slots, clients, counters, `cache_responses`), B10142's `ModelDeploymentList` and `HealthyDeploymentList` ports, B303's credential lookup and one `GenericCallExecutor` (B6021's trait) per call type: `acreate_file`, `avector_store_create`, `acreate_batch`, `aretrieve_batch`, `acancel_batch` and `alist_batches`. It builds B10143's `RouterBatchCreate` and B10142's `RouterBatchRetrieve` from the same parts, lists and the `acreate_batch` and `aretrieve_batch` executors, and forwards those two calls to them unchanged. A missing executor answers `GenericError::UnknownCallType` with the name. The provider for a deployment comes from B014's `get_llm_provider` on `litellm_params.model` and `custom_llm_provider`, and the deployment's own `custom_llm_provider` wins over the inferred one. betterlite-sdk may not depend on betterlite-router, so B303's credential lookup is a port: a small trait this module defines with only that call. The model list and the healthy deployment list are B10142's ports; use them and do not declare them again.


  `acreate_file` (router.py L5997-L6018) sets `model`, puts `create_file_attempt` under `original_function`, runs B310's update-before-fallbacks step and the fallback-with-retries executor. `create_file_attempt` (L6020-L6137) asks B10142's healthy deployment list (B016) for the healthy deployments of the group (fake message `files-api-fake-text`, `specific_deployment` taken out), and uploads the file to every one of them at once. For each deployment: deep-copy the request, update the copy with the deployment under the function name `acreate_file` (B303), add one to `total_calls`, and refuse with the message `file and file_purpose are required for create_file` when `file` or `purpose` is missing. When B1035's `should_replace_model_in_jsonl(purpose, passthrough)` is true, B1035's `replace_model_in_jsonl` rewrites the JSONL `model` fields to the provider's stripped model name. For the `litellm_proxy` provider add `target_model_names` set to the stripped name to `extra_body`, keeping the keys already there. A deployment with `gcs_bucket_name` copies it into `litellm_metadata.gcs_bucket_name`. Hold the slot, call the executor with params, `custom_llm_provider`, `caching`, `client`, then the copy, and add one to `success_calls`. With no answers, fail with `No healthy deployments found.`. Return the first answer with hidden param `model_file_id_mapping` set to B082's `add_model_file_id_mappings` for the deployments and answers. A failure adds one to `fail_calls` for the group name.


  `avector_store_create(model, request)` (L6140-L6216). With no model, run B8354's call type table for `avector_store_create`. Otherwise pick one deployment (fake message `vector-store-api-fake-text`), update the request under the function name `avector_store_create`, take the client, add one to `total_calls`, hold the slot and call the executor with params, `custom_llm_provider`, `caching`, `client` and the request. There is no fallback executor on this path.


  `acancel_batch` (L6424-L6453) sets `model`, puts its attempt under `original_function`, runs update-before-fallbacks with the metadata key that `_get_router_metadata_variable_name` gives for `_acancel_batch` (B6021 reads the same helper), and runs the fallback executor. Its attempt (L6455-L6517) picks one deployment (fake message `batch-api-fake-text`), merges B303's `get_deployment_credentials_with_provider` for the picked deployment id (or the group name when there is no id) into the params, drops `litellm_credential_name`, updates the request under `_acancel_batch`, adds one to `total_calls`, holds the slot and calls the executor with params, `custom_llm_provider`, `caching`, `client` and the request. Errors add one to `fail_calls` for the group and stamp the failed deployment (B017).


  `alist_batches(model, request)` (L6519-L6562) takes the group's deployments from B10142's model list, runs the executor for every one of them with params then request, ignores failures, and merges the lists into `{"object":"list","data":[...],"first_id":...,"last_id":...,"has_more":...}`: `first_id` from the first answer that has one, `last_id` from the last answer, `data` joined in order, `has_more` true when any answer says so. get_model_list always answers a list at the pin, so a group with no deployments gives that object with empty `data`.


  Tests are in `router_batch_calls/tests.rs`, driven by fake executors and fake router services, with names that start with `file_`, `vector_create_`, `batch_cancel_`, `batch_list_` and `batch_forward_`. The `batch_forward_` tests check that `acreate_batch` and `aretrieve_batch` reach B10143's and B10142's objects with this object's executors, and that a list without one of those executors answers UnknownCallType. There is no fuzz target: B1035 owns the JSONL rewrite.


  Router adapters. B8631 builds `RouterCalls` in crates/betterlite-server/src/app/inference/router_calls but leaves
  this task out, since no core route uses the batch calls. Once this module is merged, implement the credential lookup
  there over the startup router, one plain adapter as B8631 does: get_deployment_credentials_with_provider (B303's
  deployment_clients.rs). Reuse B10142's model list and healthy list adapters from router_calls/batch_retrieve.rs.
  Add `batch` to RouterCalls, built from the same RouterCompletionParts and executor list as RouterSingleCalls, and test
  there that the credential lookup returns the deployment's own custom_llm_provider over the inferred one.
scope:
  paths:
  - crates/betterlite-sdk/src/router_batch_calls.rs
  - crates/betterlite-sdk/src/router_batch_calls/**
  - crates/betterlite-server/src/app/inference/router_calls.rs
  - crates/betterlite-server/src/app/inference/router_calls/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L5997-L6137
    why: The file upload to every healthy deployment and the file id mapping.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L6140-L6224
    why: Vector store create with and without a model.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L6424-L6562
    why: Batch cancel with credentials and the batch list merge.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/batch_utils.py#L63-L153
    why: The JSONL rewrite rule and the metadata key helper.
dod:
  - text: A file upload goes to every healthy deployment with its own request copy, the JSONL model is rewritten when B1035 says so, and the answer carries `model_file_id_mapping`.
    proof: [batch-calls-file]
  - text: Vector store create routes by model, or goes to the call type table without one.
    proof: [batch-calls-vector-create]
  - text: Batch cancel runs the fallback executor with its metadata key and merges the deployment credentials.
    proof: [batch-calls-cancel]
  - text: Batch list merges the pages of every deployment and ignores failures.
    proof: [batch-calls-list]
  - text: Batch create and retrieve go to B10143's and B10142's objects with this object's executors, and a missing executor answers UnknownCallType.
    proof: [batch-calls-forward]
checks:
  optional: []
  commands:
  - id: batch-calls-file
    why: A deployment is skipped, the JSONL keeps the public model, or the id mapping is missing.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::file_/)'
  - id: batch-calls-vector-create
    why: A vector store create without a model fails, or one with a model skips selection.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::vector_create_/)'
  - id: batch-calls-cancel
    why: Batch cancel loses the deployment credentials or leaks `litellm_credential_name`.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::batch_cancel_/)'
  - id: batch-calls-list
    why: Pages are dropped or `has_more` is lost.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::batch_list_/)'
  - id: batch-calls-forward
    why: Batch create or retrieve does not reach the split objects, or a missing executor is skipped silently.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_calls::tests::batch_forward_/)'
oracle_cases: []
deviations:
  - what: Each call type reaches its provider function through an injected executor, and no `litellm.<call>` module function is looked up.
    why: Rust has no module state, and the rules ask for constructor wiring.
out_of_scope:
  - "B10143 builds `acreate_batch` and `_acreate_batch`, and B10142 `aretrieve_batch` with the model list and healthy deployment ports and their server adapters; B1050 and B1051 call those from the batch routes. B8355 passes the executors from the Python crate."
  - "B1035 owns the JSONL rewrite, B082 the file id mapping, B303 credentials, slots and request update, B016 selection and healthy deployments, B310 the fallback executor, B844 the model list; the healthy deployments and the model list reach this module through B10142's ports."
  - "Router._override_vector_store_methods_for_router has a docstring and no statements at the pin, so there is nothing to build."
pitfalls:
  - "The credential lookup adapter lets the deployment's own custom_llm_provider win over the inferred one; keep the provider the router returns."
  - "`create_file_attempt` refuses a missing `file` or `purpose` per deployment, after `total_calls` is already incremented."
  - "`alist_batches` takes `last_id` from the last answer even when it is null, so a later empty page clears it."
  - "`avector_store_create` with a model has no retries; only the no-model path goes through the call type table."
  - "There is no exception alert sink: `router_settings.alerting_config` is refused at config load with an error naming the key, so LiteLLM's `send_llm_exception_alert` call point is left out."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
