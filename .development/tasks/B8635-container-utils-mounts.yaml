dod:
- text: The container and container file routes answer through the booted proxy as LiteLLM does, through ContainerRequests and the router's container executors.
  proof: [mount-tests, mount-cases, oracle]
- text: The /utils routes are mounted and answer as LiteLLM does.
  proof: [mount-tests, mount-cases, oracle]
- text: /v1/models drops the entries the listing callbacks hide.
  proof: [mount-tests]
- text: The cursor routes get the startup router views as their ServedModelLookup.
  proof: [mount-tests]
checks:
  optional: []
  commands:
  - id: mount-tests
    why: a mount, ContainerRequests, the id decoder, the listing filter or the router view hand-over is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::containers::/) | test(/^app::inference::utility::/) | test(/^model_list::/) | test(/^api::cursor_responses_compat::/)'
  - id: mount-cases
    why: without new case files the oracle compares nothing for these mounts
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/container-file-routes tools/oracle/cases/api/container-routes tools/oracle/cases/utils/wiring)"
