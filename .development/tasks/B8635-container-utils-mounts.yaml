id: B8635
title: Container, utils and model listing wiring
description: >-
  The last inference wiring part mounts the /utils routes no B1100 entry merges and adds the listing filter to /v1/models. The container routes are deferred: B7326 and B3372 later fill routes/containers.rs and routes/container_files.rs and merge them themselves, after this task. B8598 builds the /utils routes in crates/betterlite-server/src/utility_routes.rs and leaves the mount and the listing filter call from /v1/models. Code goes in crates/betterlite-server, module `app::inference::utility` (utility.rs and utility/), plus the edit named below. Every name stays at 30 characters or fewer.


  Utils. Merge B8598's `utility_routes::routes()` in `mount`, built with `state.shared.router`, `state.shared.proxy_logging` and the B195, B196, B175, B2219, B884 and B5368 pieces its state names. /v1/models listing filter: in crates/betterlite-server/src/model_list.rs, the handler reads the authenticated caller and `Extension<Arc<ServerState>>` from the request (B1100 adds ServerState as the outermost Extension layer), and passes the listed entries through B8598's `kept_listing_entries(entries, auth)` before it answers, as LiteLLM's model_list calls _entries_kept_by_listing_callbacks. B851's /model/info calls deployment_hidden and hidden_listing_names itself, so it needs nothing here.


  Proof. HTTP oracle cases through the booted proxy, with an `openai/` deployment whose api_base is the mock upstream: tools/oracle/cases/utils/wiring/supported-params.yaml (GET /utils/supported_openai_params?model=gpt-4o), token-counter.yaml (POST /utils/token_counter with a model and two messages) and transform-request.yaml (POST /utils/transform_request for an openai chat call). Unit tests in utility/tests.rs check that the utils routes answer their paths through `mount` and that /v1/models drops an entry a fake listing callback hides; model_list tests keep passing.
scope:
  paths:
  - crates/betterlite-server/src/app/inference.rs
  - crates/betterlite-server/src/app/inference/containers.rs
  - crates/betterlite-server/src/app/inference/containers/**
  - crates/betterlite-server/src/app/inference/utility.rs
  - crates/betterlite-server/src/app/inference/utility/**
  - crates/betterlite-server/src/routes/container_files.rs
  - crates/betterlite-server/src/routes/containers.rs
  - crates/betterlite-server/src/routes/cursor_responses_compat.rs
  - crates/betterlite-server/src/model_list.rs
  - crates/betterlite-server/src/model_list/**
  - tools/oracle/cases/api/container-file-routes/**
  - tools/oracle/fixtures/container-file-routes/**
  - tools/oracle/cases/api/container-routes/**
  - tools/oracle/fixtures/container-routes/**
  - tools/oracle/cases/utils/wiring/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L11510-L11560
  why: The listing callback helpers and the /v1/models and /models decorators.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L11685-L11760
  why: Where model_list calls _entries_kept_by_listing_callbacks in the admin and caller branches.
dod:
- text: The /utils routes are mounted and answer as LiteLLM does.
  proof: [mount-tests, mount-cases, oracle]
- text: /v1/models drops the entries the listing callbacks hide.
  proof: [mount-tests]
checks:
  optional: []
  commands:
  - id: mount-tests
    why: the utils mount or the listing filter is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::utility::/) | test(/^model_list::/)'
  - id: mount-cases
    why: without new case files the oracle compares nothing for these mounts
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/utils/wiring)"
oracle_cases:
- tools/oracle/cases/utils/wiring/supported-params.yaml
- tools/oracle/cases/utils/wiring/token-counter.yaml
- tools/oracle/cases/utils/wiring/transform-request.yaml
deviations: []
out_of_scope:
- "The container routes, their mount lines, ContainerRequests and their cases: B7326 and B3372. The /utils handlers and the listing filters: B8598. The listing hook itself: B8399."
- "The router views: B8611. The cursor routes and their router view hand-over: B940."
- "/model/info's use of the listing filters: B851 calls them itself."
pitfalls:
- 'Add the utils router to mount on its own line, and never merge a route a B1100 entry already merges, or axum panics on a duplicate path.'
- 'LiteLLM filters the (response id, lookup id) entries after the hidden and undiscoverable names are removed and before each model info is built, in both the admin branch and the caller branch, and in the caller branch before alias_listing_entries.'
- 'model_list.rs is mounted by routes.rs, which this task must not edit, so the handler reads its state from the request extensions instead of a new parameter.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
