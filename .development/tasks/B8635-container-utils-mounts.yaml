deviations: []
out_of_scope:
- "Container route behavior and request shaping: B3371, B3372, B7326 and B7430. The /utils handlers and the listing filters: B8598. The listing hook itself: B8399."
- "The router views: B8611. The cursor routes: B940."
- "/model/info's use of the listing filters: B851 calls them itself."
pitfalls:
- 'B8634 already fills mount; add the two container routers and the utils router after its merges, and never merge a route a B1100 entry already merges, or axum panics on a duplicate path.'
- 'The direct container call is required and the router one optional, so a proxy with no deployments still serves /v1/containers through DirectContainer.'
- 'LiteLLM filters the (response id, lookup id) entries after the hidden and undiscoverable names are removed and before each model info is built, in both the admin branch and the caller branch, and in the caller branch before alias_listing_entries.'
- 'model_list.rs is mounted by routes.rs, which this task must not edit, so the handler reads its state from the request extensions instead of a new parameter.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
