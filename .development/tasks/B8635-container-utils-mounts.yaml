id: B8635
title: Container, utils and model listing wiring
description: >-
  The last inference wiring part mounts the route families no B1100 entry merges and passes the router views to the routes that wait for them. routes.rs on main declares `container_files` and `containers`, but B1100's stub list has neither and router() merges neither; B3372 (api::container_file_routes) and B7326 (api::container_routes) build the handlers and leave the registration. B8598 builds the /utils routes in crates/betterlite-server/src/utility_routes.rs and leaves the mount and the listing filter call from /v1/models. B940 takes `ServedModelLookup` through its constructor and leaves the implementation. Code goes in crates/betterlite-server, module `app::inference::containers` (containers.rs and containers/) and `app::inference::utility` (utility.rs and utility/), plus the edits named below. Every name stays at 30 characters or fewer.


  Containers. Fill crates/betterlite-server/src/routes/container_files.rs and routes/containers.rs with `routes(state: &Arc<ServerState>) -> Router` each, building B3372's `ContainerFileRoutes` and B7326's `ContainerRoutes` with their production parts, and merge both in `app::inference::mount` after B8634's routers. The parts: B3371's own `ContainerAccess` adapter over B3362; for B7326, `ContainerOwners` and `ContainerPages` over B3362's ownership store and list_owned_containers, reading `state.shared.db` (an `Option<Arc<PostgresStore>>`; with None, B3362 decides the answer); and one `ContainerRequests` type in containers/ that implements B3371's `RequestProcessing`, with `app::inference::pre_call_step(state)` (B8802) as the pre-call step B3371's state takes. Its process(data, route_type, caller) runs the same steps B085 runs for rerank: B1103's request preparation, B8393's pre-call hook, then B7430's `ContainerCall` dispatch entry with the route type, where the router side is the container executors of `RouterCalls.generic` (B8631) and the direct side is B7430's DirectContainer. Its handle_exception runs B8395's post_call_failure_hook and returns B003's ProxyException serialization. B7430's `ContainerIdDecoder` is implemented in containers/ over B903's managed container id decoding.


  Utils. Merge B8598's `utility_routes::routes()` in `mount`, built with `state.shared.router`, `state.shared.proxy_logging` and the B195, B196, B175, B2219, B884 and B5368 pieces its state names. /v1/models listing filter: in crates/betterlite-server/src/model_list.rs, the handler reads the authenticated caller and `Extension<Arc<ServerState>>` from the request (B1100 adds ServerState as the outermost Extension layer), and passes the listed entries through B8598's `kept_listing_entries(entries, auth)` before it answers, as LiteLLM's model_list calls _entries_kept_by_listing_callbacks. B851's /model/info calls deployment_hidden and hidden_listing_names itself, so it needs nothing here.


  Router views. In crates/betterlite-server/src/routes/cursor_responses_compat.rs, call `state.shared.router_views.current()` once per request and pass that Option to B940's ServedModelLookup port instead of None. router_views is the `Arc<RouterViews>` adapter B8611 builds over B8351's CatalogQueries and B302; current() gives None while no router is loaded, which B940 treats as a missing router.


  Proof. HTTP oracle cases through the booted proxy, with an `openai/` deployment whose api_base is the mock upstream: tools/oracle/cases/utils/wiring/supported-params.yaml (GET /utils/supported_openai_params?model=gpt-4o), token-counter.yaml (POST /utils/token_counter with a model and two messages) and transform-request.yaml (POST /utils/transform_request for an openai chat call). B3372 and B7326 cannot run HTTP cases at their own gates because this task mounts their routes, so their cases and fixtures live here: tools/oracle/cases/api/container-file-routes/ (container-file-json-routes, container-file-content, container-file-forbidden, container-file-upload, container-file-upload-errors, container-file-form-overwrite, container-file-auth) with tools/oracle/fixtures/container-file-routes/, and tools/oracle/cases/api/container-routes/ (container-create, container-create-provider, container-list, container-list-owned, container-list-limit, container-item, container-forbidden, container-auth) with tools/oracle/fixtures/container-routes/. Write each one as the "HTTP oracle cases" paragraph of B3372 and of B7326 describes it (master_key sk-test, a second non-admin virtual key, the OpenAI mock provider's container endpoints). Unit tests in containers/tests.rs and utility/tests.rs check that each route family answers its paths through `mount`, that ContainerRequests runs the failure hook on an error, and that /v1/models drops an entry a fake listing callback hides; model_list tests keep passing.
