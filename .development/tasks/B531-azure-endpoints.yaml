id: B531
title: Azure v1 and deployment endpoint construction
description: >-
  Add AzureEndpoint and AzureClientInputs projections; replace Python SDK construction/cache wrappers with the B173
  HTTP pool and per-request Azure credential provider. Resolve api_base/api_key/api_version, AZURE_API_BASE, AZURE_OPENAI_API_KEY,
  AZURE_API_KEY and AZURE_API_VERSION in config; preserve AZURE_DEFAULT_API_VERSION=2025-02-01-preview when omitted.
  v1/latest/preview choose v1 paths, dated versions use deployment paths, and existing api-version query wins. Cover
  Cloudflare gateway shape as a configured endpoint, without selecting a new executable provider. Forward caller
  deadline; retries stay with the router.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  select_azure_base_url_or_endpoint L287-L296; BaseAzureLLM.get_azure_openai_client L480-L600; BaseAzureLLM.initialize_azure_sdk_client
  L602-L696; BaseAzureLLM._init_azure_client_for_cloudflare_ai_gateway L698-L750; BaseAzureLLM._base_validate_azure_environment
  L753-L778; BaseAzureLLM._get_base_azure_url L781-L830; BaseAzureLLM.get_azure_v1_image_url L833-L856; BaseAzureLLM._is_azure_v1_api_version
  L859-L862; BaseAzureLLM._resolve_env_var L864-L876; get_azure_credentials L885-L904. litellm/llms/azure/azure.py:
  _check_dynamic_azure_params L115-L133.


  Implement crates/betterlite-azure/src/endpoints.rs with adjacent tests under endpoints/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_endpoints in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function endpoints_cases in betterlite-azure with these exact named cases (one per oracle file):
  credential_precedence, default_api_version, deployment_base_url, v1_latest_preview, query_api_version_wins, append_route_once,
  cloudflare_base_model, separate_token_client_identity. Each case exercises its named outcome independently; use
  stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response
  and captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_endpoints* using HelperCase: kind: helper
  and the externally tagged azure_endpoints variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_endpoints that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/endpoints.rs
  and its loader wiring: AZURE_API_BASE, AZURE_OPENAI_API_KEY, AZURE_API_KEY, AZURE_API_VERSION, AZURE_API_TYPE.
  Module-level settings enter litellm_settings; deployment settings enter litellm_params; environment lookup is
  injected. Keep the defaults and precedence specified above and in the linked branches; existing key owners remain
  unchanged. Write config rstest azure_endpoints_config_cases with named cases loads_azure_api_base, loads_azure_openai_api_key,
  loads_azure_api_key, loads_azure_api_version, loads_azure_api_type, plus rejects_unrelated_key. Each loads case
  calls the real config loader with that key and asserts the resolved value, default, precedence and secret redaction
  where applicable. Seed B002 config_yaml with new azure_endpoints* files for every key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_endpoints_credential_identity_isolation in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_endpoints_secret_safe_failure in betterlite-azure for this Rust-specific invariant; it
  is not a Python oracle case.


  Budget from 360 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 375 production lines, 182 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 0 parser target/replay lines, 40 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 709 planned, 725 maximum changed lines.
