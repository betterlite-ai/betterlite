  commands:
  - id: case-default-api-version
    why: initialize_azure_sdk_client uses api_version unchanged unless None, then AZURE_API_VERSION default litellm.AZURE_DEFAULT_API_VERSION=2025-02-01-preview.
      max_retries missing/None uses DEFAULT_MAX_RETRIES from its same-named environment variable, default 2; any
      other value is passed unchanged. timeout is included only when not None.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::endpoints_cases::case_[0-9]+_default_api_version$/)'
  - id: case-cloudflare-base-model
    why: A supplied Cloudflare client returns unchanged. Otherwise ensure one trailing slash and append model literally,
      passing api_version/base_url/http_client=litellm.client_session/max_retries/timeout. api_key when not None
      wins over token; exchange oidc/ through B530 only in the token branch, then include a non-None provider too.
      Tenant/client/scope use dict.get defaults, so explicit None suppresses their environment fallback.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::endpoints_cases::case_[0-9]+_cloudflare_base_model$/)'
  - id: case-separate-token-client-identity
    why: Cache identity includes is_async, hashed string azure_ad_token and a provider identity string with callable
      object identity, tenant_id, client_id, SHA256 client_secret, username, SHA256 password and scope. B004 cached-client
      accessors remain shared. Explicit client bypasses construction, is cached as not owned, and for Azure SDK
      clients only setdefault api-version on its dict _custom_query.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::endpoints_cases::case_[0-9]+_separate_token_client_identity$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_endpoints.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_endpoints*")"
      && grep -lq 'azure_endpoints' tools/oracle/fuzz/corpus/helper_case/azure_endpoints* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_endpoints$/)' && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_endpoints_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_endpoints_secret_safe_failure$/)'
  - id: case-azure-sdk-client-mode
    why: Only the original passed api_version v1/latest/preview selects standard OpenAI/AsyncOpenAI; a v1 resolved
      later from the environment still takes the AzureOpenAI branch. A valid cached OpenAI/Azure SDK client is returned
      before initialization; other cached types are ignored.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::endpoints_cases::case_[0-9]+_azure_sdk_client_mode$/)'
  - id: case-azure-initializer-credentials
    why: Use B2200 None-aware lookup for tenant/client/secret/username/password/scope, default scope only when None.
      Without a truthy api_key and with provider=None, truthy tenant/client/secret builds B673. Username/password
      builds B675 whenever provider remains None, even with an API key. Any non-None oidc/ token invokes B530; otherwise
      no key/provider plus literal-True refresh enables B529 cached refresh and swallows ValueError only.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::endpoints_cases::case_[0-9]+_azure_initializer_credentials$/)'
  - id: case-azure-v1-client-projection
    why: Use api_key or provider or azure_ad_token in that order as the v1 SDK key, allowing a callable provider
      on every request; async offloads the sync callable. Set base_url literally to <api_base>/openai/v1/, without
      trimming or deployment removal, and forward only timeout/max_retries/http_client when present.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::endpoints_cases::case_[0-9]+_azure_v1_client_projection$/)'
  - id: case-dynamic-api-version
    why: _check_dynamic_azure_params returns True for no client, or a non-None api_version unequal to client._custom_query[api-version];
      other parameters are ignored. A supplied api_version with missing query key raises KeyError, rather than silently
      treating it as changed.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::endpoints_cases::case_[0-9]+_dynamic_api_version$/)'
  - id: config-default-max-retries
    why: DEFAULT_MAX_RETRIES lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_clients_config_cases::case_[0-9]+_loads_default_max_retries$/)'
  - id: config-azure-default-api-version
