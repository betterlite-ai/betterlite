id: B531
title: Azure v1 and deployment endpoint construction
description: >-
  Add AzureEndpoint and AzureClientInputs projections; replace Python SDK construction/cache wrappers with the B173
  HTTP pool and per-request Azure credential provider. Consume B2200 URL/key/version resolution; preserve the distinct
  client-constructor version fallback described below. Cover Cloudflare gateway shape as a configured endpoint,
  without selecting a new executable provider. Forward caller deadline; retries stay with the router.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  BaseAzureLLM.get_azure_openai_client L480-L600; BaseAzureLLM.initialize_azure_sdk_client L602-L696; BaseAzureLLM._init_azure_client_for_cloudflare_ai_gateway
  L698-L750. litellm/llms/azure/azure.py: _check_dynamic_azure_params L115-L133.


  Named case contracts: default_api_version: initialize_azure_sdk_client uses api_version unchanged unless None,
  then AZURE_API_VERSION default litellm.AZURE_DEFAULT_API_VERSION=2025-02-01-preview. max_retries missing/None
  uses DEFAULT_MAX_RETRIES from its same-named environment variable, default 2; any other value is passed unchanged.
  timeout is included only when not None. cloudflare_base_model: A supplied Cloudflare client returns unchanged.
  Otherwise ensure one trailing slash and append model literally, passing api_version/base_url/http_client=litellm.client_session/max_retries/timeout.
  api_key when not None wins over token; exchange oidc/ through B530 only in the token branch, then include a non-None
  provider too. Tenant/client/scope use dict.get defaults, so explicit None suppresses their environment fallback.
  separate_token_client_identity: Cache identity includes is_async, hashed string azure_ad_token and a provider
  identity string with callable object identity, tenant_id, client_id, SHA256 client_secret, username, SHA256 password
  and scope. B004 cached-client accessors remain shared. Explicit client bypasses construction, is cached as not
  owned, and for Azure SDK clients only setdefault api-version on its dict _custom_query. azure_sdk_client_mode:
  Only the original passed api_version v1/latest/preview selects standard OpenAI/AsyncOpenAI; a v1 resolved later
  from the environment still takes the AzureOpenAI branch. A valid cached OpenAI/Azure SDK client is returned before
  initialization; other cached types are ignored. azure_initializer_credentials: Use B2200 None-aware lookup for
  tenant/client/secret/username/password/scope, default scope only when None. Without a truthy api_key and with
  provider=None, truthy tenant/client/secret builds B673. Username/password builds B675 whenever provider remains
  None, even with an API key. Any non-None oidc/ token invokes B530; otherwise no key/provider plus literal-True
  refresh enables B529 cached refresh and swallows ValueError only. azure_v1_client_projection: Use api_key or provider
  or azure_ad_token in that order as the v1 SDK key, allowing a callable provider on every request; async offloads
  the sync callable. Set base_url literally to <api_base>/openai/v1/, without trimming or deployment removal, and
  forward only timeout/max_retries/http_client when present. dynamic_api_version: _check_dynamic_azure_params returns
  True for no client, or a non-None api_version unequal to client._custom_query[api-version]; other parameters are
  ignored. A supplied api_version with missing query key raises KeyError, rather than silently treating it as changed.


  Load DEFAULT_MAX_RETRIES, AZURE_DEFAULT_API_VERSION through betterlite-config, with injected environment lookup
  and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest azure_clients_config_cases; each named loads_<key> case invokes the real B002 loader, checks
  explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Implement crates/betterlite-azure/src/endpoints.rs with adjacent tests under endpoints/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function endpoints_cases in betterlite-azure with these exact named cases (one per oracle file):
  default_api_version, cloudflare_base_model, separate_token_client_identity, azure_sdk_client_mode, azure_initializer_credentials,
  azure_v1_client_projection, dynamic_api_version. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_endpoints* using HelperCase: kind: helper
  and the externally tagged azure_endpoints variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_endpoints that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Reuse B2200 Azure URL/key/version loading and B529 credential settings. This task owns no duplicate environment
  loader.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_endpoints_credential_identity_isolation in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_endpoints_secret_safe_failure in betterlite-azure for this Rust-specific invariant; it
  is not a Python oracle case.


  Budget from 242 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 275 production lines, 255 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 710 planned, 725 maximum changed lines.
