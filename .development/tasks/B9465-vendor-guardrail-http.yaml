id: B9465
title: Booted-proxy cases for the Noma, Noma v2, Onyx, Ovalix, Pangea, Prompt Security, Repello, custom code and LLM judge guardrails
description: >-
  The Noma, Noma v2, Onyx, Ovalix, Pangea, Prompt Security, Repello, custom code and LLM judge classes were planned
  before any chat route ran a guardrail, so they only have helper cases or Rust tests. This task adds the booted-proxy
  HTTP cases that show each configured guardrail really runs on a chat request: B3780 and B3781 build Noma, B3782
  Noma v2, B3783 Onyx, B3784 Ovalix, B3785 Pangea, B3791 and B3792 Prompt Security, B3793 and B3794 Repello, B3801 to
  B3803 the custom code guardrail and B3809 the judge; B8521 registers the wire names, B8666 runs a held guardrail
  through its class, B8613 installs the callbacks, B8399 runs the proxy hooks, B3683 starts the config guardrails, B004
  serves the chat route and B9850 lets a case skip one captured request body. It writes no code and registers no
  route, guardrail kind or class. A case that fails because a class answers differently from
  LiteLLM goes back to that class's task as a finding and is never fixed here.


  Cases go in tools/oracle/cases/guardrails/m-z-vendor-http. Use the booted-proxy case format with master key
  oracle-master, one deployment `chat` on `openai/gpt-oracle` with api_base {{upstream}} and api_key oracle-key, and
  router_settings.num_retries 0. Every vendor endpoint is the same mock, so the ordered upstream queue holds the
  guardrail calls and the model call in the order the hooks make them. Configure each guardrail in the top-level
  `guardrails:` list and select it with the request body's `guardrails` list. Compare status, content-type,
  x-litellm-applied-guardrails where the class records it, and the error type, param and code. On an error ignore
  /error/message only where it embeds the HTTP client's own error text, with that reason; keep every structured detail
  field compared. Compare the upstream requests the mock captured, so a 200 cannot hide a skipped scan, and list the
  vendor headers named below in upstream_headers. Ignore generated ids and timestamps in a 200 body with a reason, and
  nothing else. Every case calls /v1/chat/completions.


  Noma (guardrail noma, api_base {{upstream}}, api_key oracle-noma-key, so calls go to /ai-dr/v2/prompt/scan; list
  authorization, content-type and x-noma-request-id). noma-block-request: mode pre_call and a verdict that flags the
  prompt; the client gets 400 with {"error": "Request blocked by Noma guardrail", "details": the verdict} and the model
  is never called. noma-allow: a clean verdict and the model answers. noma-monitor-mode: monitor_mode true and a
  flagging verdict, so the model still answers. noma-block-response: mode post_call; the model answers and the verdict
  flags the response. noma-failure-blocks: the scan answers 500 with block_failures at its default true.
  noma-failure-open: block_failures false and a 500, so the model answers.


  Noma v2 (guardrail noma_v2, api_base {{upstream}}, api_key oracle-noma-key, so calls go to /litellm/guardrail;
  list authorization and content-type). Its scan body carries request_data (the whole chat request minus messages)
  and litellm_logging_obj (the logging object's model_call_details), and both hold each gateway's own call state, so
  every Noma v2 case names `/upstream/0/body` with that reason; the scan's path and headers and the model request
  after it stay compared. noma-v2-block-request: mode pre_call and an answer with action BLOCKED; the client gets 400
  with {"error": "Request blocked by Noma guardrail", "details": the answer} and the model is never called.
  noma-v2-intervened: action GUARDRAIL_INTERVENED with texts ["oracle text, cleaned"], and the model receives that
  text in place of the user message. noma-v2-failure-open: block_failures false and a 500, so the model answers.


  Onyx (guardrail onyx, api_base {{upstream}}, api_key oracle-onyx-key, so calls go to
  /guard/evaluate/v1/oracle-onyx-key/litellm with the key in the compared path; list content-type). Its request scan
  sends proxy_server_request, which holds each gateway's own URL and Host header, and conversation_id, the call id, so
  every Onyx case names `/upstream/0/body` with that reason. onyx-block-request: mode pre_call and the answer
  {"allowed": false, "violated_rules": ["pii", "secrets"]}; the client gets 400 with "Request blocked by Onyx Guard.
  Violations: pii, secrets." and the model is never called. onyx-allow: {"allowed": true} and the model answers.
  onyx-error-open: the evaluation answers 500, apply_guardrail logs it and returns the inputs, so the model answers.


  Ovalix (guardrail ovalix, tracker_api_base {{upstream}}, tracker_api_key oracle-ovalix-key, application_id
  oracle-app, so calls go to /tracking/custom_application/checkpoint; list authorization and content-type).
  ovalix-block-request: pre_checkpoint_id set and the checkpoint answers action_type block with modified_data.content;
  the client gets 400 with that content as the message, unwrapped. ovalix-correct-request: action_type allow with
  modified_data.content and the model receives the corrected text. ovalix-correct-response: post_checkpoint_id set and
  the checkpoint rewrites the answer the client gets. ovalix-checkpoint-error: the checkpoint answers 500 and the client
  gets "Ovalix guardrail error: ..."; ignore the text after the colon with the HTTP client reason.


  Pangea (guardrail pangea, api_base {{upstream}}, api_key oracle-pangea-key, so calls go to /v1beta/guard; list
  authorization and content-type). pangea-block-input: mode pre_call, pangea_input_recipe set, and the answer has
  result.blocked true; the client gets 400 with {"error": "Violated Pangea guardrail policy", "guardrail_name": ...}.
  pangea-transform-input: result.transformed true with output messages and the model receives them.
  pangea-block-output: mode post_call and a blocked answer for the response scan. pangea-api-error: the guard answers
  500 and the client gets 500 with "Error in Pangea Guardrail"; ignore only the exceptions field, with the HTTP client
  reason.


  Prompt Security (guardrail prompt_security, api_base {{upstream}}, api_key oracle-ps-key, so calls go to
  /api/protect; list app-id and content-type). ps-block-prompt: mode pre_call and result.prompt.action block with two
  violations; the client gets 400 "Blocked by Prompt Security, Violations: a, b". ps-modify-prompt: action modify with
  modified_messages and the model receives them. ps-block-response: mode post_call and result.response.action block.
  ps-allow: action log and the model answers. A key alias on the caller adds X-LiteLLM-Key-Alias; the cases use the
  master key, which has none.


  Repello (guardrail repelloai, api_base {{upstream}}, api_key oracle-repello-key and asset_id oracle-asset, so calls
  go to /analyze/prompt and /analyze/response; list x-api-key and content-type). repello-prompt-blocked: verdict
  blocked with policies_violated; the client gets 400 with the formatted policy list. repello-prompt-passed: verdict
  passed and the model answers. repello-response-blocked: mode post_call and a blocked response verdict.
  repello-misconfigured: the analyzer answers 401 and the client gets 500 with "RepelloAI Argus guardrail is
  misconfigured". repello-unreachable: the analyzer answers 503 with unreachable_fallback at its default fail_closed and
  the client gets 500 "RepelloAI Argus guardrail unreachable". repello-fail-open: unreachable_fallback fail_open and a
  503, so the model answers.


  Custom code (guardrail custom_code with litellm_params.custom_code holding a sync apply_guardrail that uses the
  regex_match, block, allow and modify primitives; no vendor call). custom-code-block-request: mode pre_call and a text
  that matches; LiteLLM raises its passthrough exception, so the client gets 200 with the reason as the assistant
  message and the model is never called. custom-code-block-response: mode post_call; the model answers and the client
  gets 400 with {"error": reason, "guardrail": name, "detection_info": ...}. custom-code-modify: the code returns
  modify with new texts and the model receives them. custom-code-allow: no match and the model answers.


  LLM judge (guardrail llm_as_a_judge, judge_model chat, one criterion with weight 100, overall_threshold 80; the judge
  call is a chat completion to the same mock). judge-block-request: mode pre_call and the judge answers JSON with
  overall_score 40; the client gets 422 with "LLM judge rejected request: score below threshold", the score, the
  threshold and the verdicts, and the model is never called. judge-pass: score 90, then the model answers.
  judge-log-only: on_failure log and score 40, so the model answers. judge-block-response: mode post_call; the model
  answers, the judge scores 40 and the client gets 422. judge-fails-open: the judge call answers 500 and the model
  answers. The captured judge request shows LiteLLM's system prompt, the criteria block, response_format json_object
  and temperature 0.


  no-auth: a Pangea guardrail with default_on true and no Authorization header; the 401 comes before any upstream
  call.
scope:
