dod:
  - text: Booted-proxy cases show Noma blocking a request and a response, allowing, monitoring and both block_failures settings.
    proof: [oracle]
  - text: Booted-proxy cases show Noma v2 blocking a request, replacing its text and failing open with block_failures false, with the scan's path and headers compared.
    proof: [oracle]
  - text: Booted-proxy cases show Onyx blocking a request with its violated rules, allowing, and failing open on an evaluation error, with the scan's path compared.
    proof: [oracle]
  - text: Booted-proxy cases show Ovalix blocking and correcting a request, correcting a response and failing on a checkpoint error.
    proof: [oracle]
  - text: Booted-proxy cases show Pangea blocking input and output, transforming input and wrapping an API error.
    proof: [oracle]
  - text: Booted-proxy cases show Prompt Security blocking and modifying a prompt, blocking a response and allowing.
    proof: [oracle]
  - text: Booted-proxy cases show Repello blocking a prompt and a response, passing, and its misconfigured, fail-closed and fail-open answers.
    proof: [oracle]
  - text: Booted-proxy cases show the custom code guardrail's passthrough block, response block, modify and allow results.
    proof: [oracle]
  - text: Booted-proxy cases show the LLM judge blocking a request and a response with 422, passing, logging only and failing open, and an unauthenticated request is refused before any scan.
    proof: [oracle]
