out_of_scope:
  - "The classes and their initializers: B3780 and B3781 (Noma), B3782 (Noma v2), B3783 (Onyx), B3784 (Ovalix), B3785 (Pangea), B3791 and B3792 (Prompt Security), B3793 and B3794 (Repello), B3801 to B3803 (custom code) and B3809 (judge). Registry arms: B8521. Running a held guardrail: B8666. Installing callbacks: B8613. Proxy hook dispatch: B8399. Config guardrail startup: B3683."
  - "The `/upstream/{i}/body` selector the Onyx and Noma v2 cases use: B9850. The fields inside those scan bodies (Onyx's proxy_server_request, Noma v2's request_data and litellm_logging_obj) are left to B3783's and B3782's tests."
  - "Prompt Security file and image sanitization (/api/sanitizeFile): B3791's helper cases cover it."
  - "Streamed responses: Noma's buffered stream (B3781) and Repello's stream blocking (B3794) own that code; the streaming cases across guardrails are B8993's."
  - "The decision_model, promptguard, qostodian_nexus, qualifire, singulr and zscaler_ai_guard cases: B108. The Presidio, Pillar, TypeSafe, XecGuard and Straiker cases: B9464."
pitfalls:
  - "Only the Onyx and Noma v2 cases skip a scan body; every other case compares each captured body whole. Noma puts litellm_call_id in x-noma-context.sessionId and in X-Noma-Request-ID, so send x-litellm-call-id oracle-call-1 on every Noma request (LiteLLM honors it in common_request_processing.py L273-L276)."
  - "Onyx has no fail-closed setting: apply_guardrail re-raises only its own 400 HTTPException and returns the inputs unchanged on any other error, a 500 from the evaluation included."
  - "Noma v2 is its own wire name, noma_v2; guardrail noma with use_v2 true reaches the same class, but the cases use noma_v2 so they never depend on the use_v2 string parsing in initialize_guardrail."
  - "Ovalix's session_id holds the UTC date, so both sides of one case agree unless the run crosses midnight UTC; rerun such a failure rather than ignoring the field."
  - "Ovalix answers with modified_data.content for both block and correction; an action_type block on the first text raises, on a later text it only replaces that text."
  - "Prompt Security sends its key in an APP-ID header, not a Bearer token, and scans each response text with its own protect call."
  - "Repello maps 400, 401, 403, 404 and 422 from the analyzer to 500 misconfigured, and only HTTP errors go through unreachable_fallback."
  - "The custom code pre-call block is a 200 with the reason as the assistant message, not an error; only the post-call block is a 400."
  - "The judge calls the router with judge_model, so the judge request and the model request land on the same mock in order; num_retries 0 keeps a judge 500 to one call."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
