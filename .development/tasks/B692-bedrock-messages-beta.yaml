- text: 'web_search_rejection: Only inspect tools when it is a list. Find the first dict matching B568 is_anthropic_native_web_search_tool
    (type string starts web_search_). Reject it with BadRequestError status 400, llm_provider=bedrock and the requested
    model; do not invent param/code fields. Exact message: Bedrock does not support Anthropic''s server-side web
    search tool (tool type ''{type}'', model ''{model}''). To use web search with this model, enable LiteLLM''s
    web search interception so the proxy executes the search instead: https://docs.litellm.ai/docs/integrations/websearch_interception.
    Alternatively, remove the web_search tool from the request. Converted function tools and bare-name tools pass.
    B119 owns callbacks:[websearch_interception] configuration and interception, not this leaf.'
