id: B692
title: Bedrock Messages beta headers and unsupported fields
description: >-
  Port native Messages tool-search/version beta policy, context-management filtering and unsupported-field/web-search
  behavior using B960 beta filtering. B621 owns cache/thinking policy; requests compose both.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeMessagesConfig._is_claude_4_5_on_bedrock L389-L401; AmazonAnthropicClaudeMessagesConfig._supports_tool_search_on_bedrock
  L403-L420; AmazonAnthropicClaudeMessagesConfig._get_tool_search_beta_header_for_bedrock L422-L451; AmazonAnthropicClaudeMessagesConfig._filter_context_management_for_bedrock_invoke
  L471-L512; AmazonAnthropicClaudeMessagesConfig._get_bedrock_invoke_anthropic_beta_headers L514-L602; AmazonAnthropicClaudeMessagesConfig._reject_unsupported_web_search_tools
  L605-L641; AmazonAnthropicClaudeMessagesConfig._strip_unsupported_bedrock_invoke_fields L643-L654.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Reuse get_anthropic_beta_from_headers from B599 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse bedrock_supports_tool_search from B690 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse is_claude_4_5_on_bedrock from B690 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/bedrock_messages_beta.rs with adjacent tests under bedrock_messages_beta/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation bedrock_messages_beta in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_messages_beta_cases in betterlite-bedrock with these exact named cases (one per
  oracle file): tool_search_beta, context_filter, web_search_rejection, unsupported_fields, beta_provider_filter.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_messages_beta* using HelperCase: kind:
  helper and the externally tagged bedrock_messages_beta variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_messages_beta that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 215 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 445 planned, 450 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/bedrock_messages_beta.rs
  - crates/betterlite-bedrock/src/bedrock_messages_beta/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_messages_beta.rs
  - tools/oracle/src/helpers/bedrock_messages_beta/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_messages_beta.py
  - tools/oracle/cases/helpers/providers/bedrock-messages-beta/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_messages_beta*
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py#L389-L654
  why: >-
    Own AmazonAnthropicClaudeMessagesConfig._is_claude_4_5_on_bedrock, AmazonAnthropicClaudeMessagesConfig._supports_tool_search_on_bedrock,
    AmazonAnthropicClaudeMessagesConfig._get_tool_search_beta_header_for_bedrock, AmazonAnthropicClaudeMessagesConfig._filter_context_management_for_bedrock_invoke,
    AmazonAnthropicClaudeMessagesConfig._get_bedrock_invoke_anthropic_beta_headers, AmazonAnthropicClaudeMessagesConfig._reject_unsupported_web_search_tools,
    AmazonAnthropicClaudeMessagesConfig._strip_unsupported_bedrock_invoke_fields. Other functions in this file remain
    with the owners listed below.
dod:
- text: 'tool search beta: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-messages-beta/tool-search-beta.yaml.'
  proof:
  - case-tool-search-beta
  - oracle
  - helper-python
- text: 'context filter: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-messages-beta/context-filter.yaml.'
  proof:
  - case-context-filter
  - oracle
  - helper-python
- text: 'web search rejection: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-messages-beta/web-search-rejection.yaml.'
  proof:
  - case-web-search-rejection
  - oracle
  - helper-python
- text: 'unsupported fields: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-messages-beta/unsupported-fields.yaml.'
  proof:
  - case-unsupported-fields
  - oracle
  - helper-python
- text: 'beta provider filter: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-messages-beta/beta-provider-filter.yaml.'
  proof:
  - case-beta-provider-filter
  - oracle
  - helper-python
- text: New bedrock_messages_beta seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-tool-search-beta
    why: The tool-search-beta behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_messages_beta_cases::case_[0-9]+_tool_search_beta$/)'
  - id: case-context-filter
    why: The context-filter behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_messages_beta_cases::case_[0-9]+_context_filter$/)'
  - id: case-web-search-rejection
    why: The web-search-rejection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_messages_beta_cases::case_[0-9]+_web_search_rejection$/)'
  - id: case-unsupported-fields
    why: The unsupported-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_messages_beta_cases::case_[0-9]+_unsupported_fields$/)'
  - id: case-beta-provider-filter
    why: The beta-provider-filter behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_messages_beta_cases::case_[0-9]+_beta_provider_filter$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_messages_beta.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_messages_beta*")"
      && grep -lq 'bedrock_messages_beta' tools/oracle/fuzz/corpus/helper_case/bedrock_messages_beta* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_messages_beta$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
