id: B692
title: Bedrock Messages beta headers and unsupported fields
description: >-
  Port native Messages tool-search/version beta policy, context-management filtering and unsupported-field/web-search
  behavior using B960 beta filtering. B621 owns cache/thinking policy; requests compose both.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeMessagesConfig.custom_llm_provider L82-L83; AmazonAnthropicClaudeMessagesConfig.beta_headers_provider
  L86-L87; AmazonAnthropicClaudeMessagesConfig._supports_tool_search_on_bedrock L403-L420; AmazonAnthropicClaudeMessagesConfig._get_tool_search_beta_header_for_bedrock
  L422-L451; AmazonAnthropicClaudeMessagesConfig._filter_context_management_for_bedrock_invoke L471-L512; AmazonAnthropicClaudeMessagesConfig._get_bedrock_invoke_anthropic_beta_headers
  L514-L602; AmazonAnthropicClaudeMessagesConfig._reject_unsupported_web_search_tools L605-L641; AmazonAnthropicClaudeMessagesConfig._strip_unsupported_bedrock_invoke_fields
  L643-L654.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  with direct dependencies. Provider leaves must never import betterlite-core, and no copied helper algorithm is
  permitted.


  Reuse get_anthropic_beta_from_headers from B599 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse bedrock_supports_tool_search from B690 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse is_claude_4_5_on_bedrock from B690 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: tool_search_beta: For tool search without programmatic calling or input examples, remove
  advanced-tool-use-2025-11-20 from the current set and add tool-search-tool-2025-10-19 only when B690 supports
  it. Otherwise leave the set untouched. If tool-search-tool-2025-10-19 exists after adjustment, also add tool-examples-2025-10-29,
  even when the tool-search beta came from the user. context_filter: For a non-dict context_management do nothing
  here. A dict with missing/non-list edits is removed; for a list retain only dict edits with type compact_20260112
  or clear_tool_uses_20250919, preserving order and every edit field. If none remain remove the whole context_management;
  otherwise preserve its other fields and replace edits. Add compact-2026-01-12 and context-management-2025-06-27
  for the respective retained types. clear_thinking_20251015 is consumed by B621 before this filtering and is not
  forwarded. No warning is emitted for dropped edits. web_search_rejection: Only inspect tools when it is a list.
  Find the first dict matching B568 is_anthropic_native_web_search_tool (type string starts web_search_). Reject
  it with BadRequestError status 400, llm_provider=bedrock and the requested model; do not invent param/code fields.
  Exact message: Bedrock does not support Anthropic's server-side web search tool (tool type '{type}', model '{model}').
  To use web search with this model, enable LiteLLM's web search interception so the proxy executes the search instead:
  https://docs.litellm.ai/docs/integrations/websearch_interception. Alternatively, remove the web_search tool from
  the request. Converted function tools and bare-name tools pass. B119 owns callbacks:[websearch_interception] configuration
  and interception, not this leaf. unsupported_fields: Retain exactly anthropic_version,max_tokens,messages,anthropic_beta,system,stop_sequences,temperature,top_p,top_k,tools,tool_choice,thinking,metadata,output_config,safeguards,context_management,
  preserving input values and order without validating nested types. Return a fresh mapping. If other keys exist,
  sort them and debug-log Bedrock Invoke: stripping unsupported top-level request fields: %s. Do not emit a warning
  or claim output_config is always removed; it is on this allowlist. beta_provider_filter: Use B568 feature predicates
  on original options.tools and messages for file IDs; use required outgoing request.messages for mid-conversation
  output_config and tool-change predicates, and outgoing thinking for display updates. Call B568 get_anthropic_beta_list
  with provider=bedrock,prompt_caching_set=False. Union B599 user headers and auto betas, add interleaved-thinking-2025-05-14
  when clear-thinking injection returned True, fine-grained-tool-streaming-2025-05-14 for eager tools, and dangerous-tool-use-2026-09-03
  whenever original options.safeguards is not None, including []. Apply context filtering, tool-search adjustment
  and tool-examples addition, then B960 filtering to the entire set using beta_headers_provider. Sort the resulting
  list; unlike B618, user betas are filtered too. provider_beta_identity: custom_llm_provider returns bedrock; beta_headers_provider
  returns that value or bedrock when a subclass value is falsey. _supports_tool_search_on_bedrock delegates B690,
  preserving its catalog and fallback outcomes. unsupported_user_beta_warning: Individually filter each original
  user beta through B960; collect and sort only those yielding no result, then warn exactly Bedrock Invoke: dropping
  unsupported anthropic-beta values from client headers: %s. Bedrock has no mapping entry for these; forwarding
  them would cause a 400. A beta transformed to another nonempty value is not reported as dropped. Preserve Python
  sorted-list display in the warning; no warning when the dropped list is empty.


  Implement crates/betterlite-bedrock/src/bedrock_messages_beta.rs with adjacent tests under bedrock_messages_beta/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_messages_beta_cases in betterlite-bedrock with these exact named cases (one per
  oracle file): tool_search_beta, context_filter, web_search_rejection, unsupported_fields, beta_provider_filter,
  provider_beta_identity, unsupported_user_beta_warning. Each case exercises its named outcome independently; use
  stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must
  not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_messages_beta* using HelperCase: kind:
  helper and the externally tagged bedrock_messages_beta variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_messages_beta that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 209 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 250 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 625 planned, 625 maximum changed lines.
