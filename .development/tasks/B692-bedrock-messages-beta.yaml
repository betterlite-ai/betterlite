    from the current set and add tool-search-tool-2025-10-19 only when B690 supports it. Otherwise leave the set
    untouched. If tool-search-tool-2025-10-19 exists after adjustment, also add tool-examples-2025-10-29, even when
    the tool-search beta came from the user.'
  proof:
  - case-tool-search-beta
  - oracle
  - helper-python
- text: 'context_filter: For a non-dict context_management do nothing here. A dict with missing/non-list edits is
    removed; for a list retain only dict edits with type compact_20260112 or clear_tool_uses_20250919, preserving
    order and every edit field. If none remain remove the whole context_management; otherwise preserve its other
    fields and replace edits. Add compact-2026-01-12 and context-management-2025-06-27 for the respective retained
    types. clear_thinking_20251015 is consumed by B621 before this filtering and is not forwarded. No warning is
    emitted for dropped edits.'
