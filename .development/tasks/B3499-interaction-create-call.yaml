      why: create() or acreate() missing, incorrect model/agent resolution, wrong dispatch path, missing polling, or exception handling broken
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::interactions::create::/)'

oracle_cases: []

deviations:
  - what: "Background polling is not scheduled in the synchronous create() path; only acreate() schedules polling after success."
    why: "LiteLLM preserves this design: sync calls return immediately without spawning background tasks, keeping the sync contract simple and deterministic."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/main.py#L195-L341"
  - what: "The @client decorator in LiteLLM (a lifecycle hook for installing telemetry and client patterns) is applied to both functions; betterlite applies the same decorator where it exists in the server crate."
    why: "The decorator setup and lifecycle are owned by the server task that installs it; this task uses it where available in its crates."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/main.py#L70"
  - what: "Context propagation in acreate() is done via contextvars.copy_context() before running create in an executor; betterlite propagates B198's context directly since Rust async does not require this pattern."
    why: "Rust async/await and contextvars (tokio::task::spawn, tracing::Instrument) handle context propagation differently than Python's asyncio; betterlite preserves the effect (context available to the spawned task) without the Python mechanics."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/main.py#L169-L171"
  - what: "Provider selection and optional-parameter extraction are pure functions called by create(), not methods on a global object; they take provider and kwargs as arguments."
    why: "Rust functions receive their inputs explicitly, avoiding globals; dependencies are passed through function arguments."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/main.py#L291-L298"

out_of_scope:
  - "Model/agent resolution via B174's get_llm_provider; this task calls it."
  - "Provider config selection via B3490; this task calls it."
  - "Optional-parameter extraction via B3490; this task calls it."
  - "Native interaction creation via B3493; this task calls it."
  - "Responses bridge dispatch via B3498; this task calls it."
  - "Background polling scheduling via B3481's crates/betterlite-interactions module; this task calls it."
  - "Exception type selection via B185/B186; this task calls it."
  - "Context propagation setup via B198; this task calls it."
  - "Logging metadata update via B247; this task calls it."

pitfalls:
  - "The model/agent correction must clear model when both are set and model equals agent (string comparison); this preserves the routing logic where a caller mistakenly duplicates the agent name as the model."
  - "Provider selection returns None for empty string, None input, or unsupported provider names; None triggers the Responses bridge, not a fallback to 'gemini'. The Gemini default is applied only when the input provider is not set or when agent is provided without model."
  - "Optional-parameter extraction preserves explicit false and empty values; a caller passing background=false wants immediate polling, while omitting background uses the provider default. The extraction does not insert defaults."
  - "Background polling is scheduled only in acreate(), not in create(). The sync path returns immediately; callers that want async behavior must call acreate()."
  - "Native calls update logging before calling create_interaction; bridge calls do not update logging here (B3498 may handle its own logging)."
  - "Exception wrapping must preserve the original exception via the 'source' field and include all local_vars (completion_kwargs) for debugging; custom_llm_provider is determined by resolution logic, not taken from input."
  - "The @client decorator (if present) marks the function as a client entry point for telemetry and lifecycle tracking; this is applied by the server layer, not by this task's functions."

review_level: standard
