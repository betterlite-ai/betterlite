dod:
  - text: "create() accepts all OpenAPI parameters and **kwargs, resolves model/agent to a provider, selects native or Responses dispatch, and returns the operation result (response or iterator) or raises an exception."
    proof: [create-call-tests]
  - text: "acreate() accepts the same parameters, delegates to create() in a thread pool, schedules background polling on success, and propagates context via contextvars.copy_context()."
    proof: [create-call-tests]
  - text: "Model/agent resolution applies the correction (if agent and model == agent, clear model), defaults to 'gemini' when agent is set without model, and resolves via B174's get_llm_provider when model is provided."
    proof: [create-call-tests]
  - text: "Provider selection returns None for unsupported providers; if None or custom_llm_provider == 'litellm_responses', the bridge path (B3498) is taken; otherwise the native path (B3493) is taken."
    proof: [create-call-tests]
  - text: "Optional-parameter extraction filters to the OpenAPI spec fields (tools, system_instruction, generation_config, stream, store, background, environment, response_modalities, response_format, response_mime_type, previous_interaction_id, agent_config) using B3490's utility."
    proof: [create-call-tests]
  - text: "Native calls update logging metadata via B247's update_from_kwargs with model, optional_params and custom_llm_provider before calling B3493's create_interaction."
    proof: [create-call-tests]
  - text: "Bridge calls invoke B3498's interactions_api_handler with model, input, optional_params, custom_llm_provider, _is_async and stream flags."
    proof: [create-call-tests]
  - text: "Background polling is scheduled in acreate() only (not in sync create()) via B3481's maybe_schedule_background_interaction_cost_polling with response, create_kwargs and custom_llm_provider."
    proof: [create-call-tests]
  - text: "Exceptions are wrapped via B185/B186's exception_type with model, custom_llm_provider, original_exception, completion_kwargs and extra_kwargs, preserving the original exception chain."
    proof: [create-call-tests]

checks:
  optional: []
  commands:
