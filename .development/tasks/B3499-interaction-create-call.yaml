id: B3499
title: Create native or Responses-backed interactions
description: >-
  Implement sync and async interaction creation with model/agent resolution,
  native/bridge selection and async background-poll scheduling.
  Build the public create() and acreate() entry points that accept all OpenAPI
  parameters (model, agent, input, tools, system_instruction, generation_config,
  stream, store, background, environment, response_modalities, response_format,
  response_mime_type, previous_interaction_id, extra_headers, extra_body, timeout,
  custom_llm_provider and **kwargs).
  Apply routing logic: if agent is provided and model equals agent, clear model;
  if agent and no model, default custom_llm_provider to 'gemini'; if model,
  resolve provider via B174's get_llm_provider; otherwise default to 'gemini'.
  Call B3490's get_provider_interactions_api_config to select provider
  (GoogleAIStudioInteractionsConfig, VertexAIInteractionsConfig, or None);
  extract optional parameters using B3490's get_requested_interactions_api_optional_params.
  If provider is 'litellm_responses' or the config is None, call B3498's
  interactions_api_handler with the request prepared for the Responses bridge.
  Otherwise, call B3493's create_interaction with the native provider config.
  In the async path only, schedule background polling via B3481's
  maybe_schedule_background_interaction_cost_polling if the create succeeds.
  The sync path does not poll, matching LiteLLM's design.
  Preserve the custom_llm_provider default, error wrapping via B185/B186's
  exception_type, and context propagation via B198.
  Update logging metadata via B247's update_from_kwargs for native calls only.

