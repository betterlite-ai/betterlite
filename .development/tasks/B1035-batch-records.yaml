  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai -p betterlite-provider --no-tests=fail
      -E 'test(/^api::batch_records::/) - test(/::replays_corpus$/)'
  - id: case-jsonl-embedded-newline
    why: the jsonl-embedded-newline behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_records::tests::jsonl_embedded_newline($|::)/)'
  - id: case-replace-body-model
    why: the replace-body-model behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_records::tests::replace_body_model($|::)/)'
  - id: case-preserve-custom-id
    why: the preserve-custom-id behavior or its assertions are absent
