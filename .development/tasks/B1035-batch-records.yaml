id: B1035
title: Batch records
description: >-
  Define typed batch create/list/retrieve/cancel contracts and normalize JSONL model rewriting, including the source
  embedded-newline recovery. Preserve custom_id and operation URL, reuse B207 call types, and expose explicit source-aware
  malformed-row outcomes.


  validate_batch_list_limit raises 400 invalid_request_error with param limit. Its internal openai_code is integer_below_min_value
  or integer_above_max_value, but the actual ProxyException HTTP error.code is the string "400" because to_dict
  omits openai_code. The helper adapter compares the internal bound tag separately; route parity must retain the
  string wire code. Build CreateBatchRequest/LiteLLMBatchCreateRequest/Retrieve/Cancel/List records, pinned endpoint
  literals, completion_window=24h, output_expires_after and LiteLLMBatch.usage.


  Implement crates/betterlite-core/src/api/batch_records.rs, crates/betterlite-openai/src/api/batch_records.rs,
  crates/betterlite-provider/src/api/batch_records.rs. Use BatchRecordsInput and BatchRecordsResult with typed nested
  records; inject only the clock, repositories, transports and resolved settings this slice uses through constructors.
  Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): common_utils.py:12 type='invalid_request_error', param='limit', code=400, openai_code=openai_code.
  Compare the actual source status, error type, param and code; ignore only error wording except in message-extraction
  tests.


  Write adjacent tests.rs behavior functions jsonl_embedded_newline, replace_body_model, preserve_custom_id, native_model_no_replace,
  batch_retrieve_call_type, batch_limit_below, batch_limit_above under api::batch_records::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  The production external-byte decoder is betterlite-openai::api::batch_records::decode_batch_records(bytes: &[u8],
  limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/batch_records.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-openai/fuzz/fuzz_targets/batch_records.rs passes arbitrary bounded bytes to that exact decoder;
  api::batch_records::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  Register HelperCall::BatchRecords in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_records: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/batches/transformation.py: BaseBatchesConfig.__init__ (L34-L35); litellm/llms/base_llm/batches/transformation.py:
  BaseBatchesConfig.custom_llm_provider (L39-L40); litellm/llms/base_llm/batches/transformation.py: BaseBatchesConfig.get_config
  (L43-L60); litellm/llms/base_llm/batches/transformation.py: BaseBatchesConfig.validate_environment (L63-L87);
  litellm/llms/base_llm/batches/transformation.py: BaseBatchesConfig.get_complete_batch_url (L90-L112); litellm/llms/base_llm/batches/transformation.py:
  BaseBatchesConfig.transform_create_batch_request (L115-L133); litellm/llms/base_llm/batches/transformation.py:
  BaseBatchesConfig.transform_create_batch_response (L136-L154); litellm/llms/base_llm/batches/transformation.py:
  BaseBatchesConfig.transform_retrieve_batch_request (L157-L173); litellm/llms/base_llm/batches/transformation.py:
  BaseBatchesConfig.transform_retrieve_batch_response (L176-L194); litellm/llms/base_llm/batches/transformation.py:
  BaseBatchesConfig.get_error_class (L197-L208); litellm/router_utils/batch_utils.py: InMemoryFile.__init__ (L12-L15);
  litellm/router_utils/batch_utils.py: parse_jsonl_with_embedded_newlines (L18-L60); litellm/router_utils/batch_utils.py:
  should_replace_model_in_jsonl (L63-L73); litellm/router_utils/batch_utils.py: replace_model_in_jsonl (L76-L150);
  litellm/router_utils/batch_utils.py: _get_router_metadata_variable_name (L153-L173); litellm/router_utils/batch_utils.py:
  is_batch_retrieve_call_type (L184-L191); litellm/proxy/batches_endpoints/common_utils.py: validate_batch_list_limit
  (L4-L18); litellm/types/utils.py: LiteLLMBatch.__contains__ (L4324-L4326); litellm/types/utils.py: LiteLLMBatch.get
  (L4328-L4330); litellm/types/utils.py: LiteLLMBatch.__getitem__ (L4332-L4334); litellm/types/utils.py: LiteLLMBatch.json
  (L4336-L4341). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 271 owned nonblank/non-comment/non-docstring Python lines (393 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 291 implementation,
  82 behavior tests, 84 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  46 wiring; 653 total within the 660-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B207 (Route and call-type metadata matching), B1015 (File contracts), B1087 (Api
  boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids
  retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
