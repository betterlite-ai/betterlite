  - id: case-native-model-no-replace
    why: the native-model-no-replace behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_records::tests::native_model_no_replace($|::)/)'
  - id: case-batch-retrieve-call-type
    why: the batch-retrieve-call-type behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_records::tests::batch_retrieve_call_type($|::)/)'
  - id: case-batch-limit-below
    why: the batch-limit-below behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_records::tests::batch_limit_below($|::)/)'
  - id: case-batch-limit-above
    why: the batch-limit-above behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_records::tests::batch_limit_above($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/batch_records)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/batch_records.rs && grep -qF "decode_batch_records"
      crates/betterlite-openai/fuzz/fuzz_targets/batch_records.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::batch_records::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/batch_records.py && uv run --locked --project tools/oracle/litellm ruff check
      tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/batch_records-*)"
      && grep -qE "^[[:space:]]+batch_records:" tools/oracle/fuzz/corpus/helper_case/batch_records-* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/batch-records)"
