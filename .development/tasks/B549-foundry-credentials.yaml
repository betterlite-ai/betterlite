    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::foundry_credentials_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/foundry_credentials*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_credentials_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_credentials_secret_safe_failure$/)'
  - id: case-foundry-settings
    why: Model-info accessors resolve api_base or litellm.api_base or AZURE_AI_API_BASE and api_key or litellm.api_key
      or AZURE_AI_API_KEY. get_azure_ai_entra_token validates supplied mapping or empty GenericLiteLLMParams and
      calls B529 with its cognitive-services default scope.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_foundry_settings$/)'
  - id: case-foundry-reasoning-tool-gate
    why: When reasoning_effort is None use B502 is_model_gpt_6_plus_model; any supplied value, including empty mapping/string,
      uses is_model_gpt_5_6_plus_model. Preserve that supplied-versus-absent distinction.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_foundry_reasoning_tool_gate$/)'
