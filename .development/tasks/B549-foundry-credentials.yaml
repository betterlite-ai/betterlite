  - mutants
  commands:
  - id: case-foundry-host-boundary
    why: Model-inference base requires hostname ending .services.ai.azure.com and path without /openai/deployments;
      no HTTPS requirement. api-key host selection accepts suffix .services.ai.azure.com or .openai.azure.com, excluding
      the bare domains and suffix-confusion hosts; other bases use Authorization.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_foundry_host_boundary$/)'
  - id: case-openai-v1-api-key-header
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-credentials/openai-v1-api-key-header.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_openai_v1_api_key_header$/)'
  - id: case-explicit-key-before-entra
    why: get_azure_ai_auth_headers sends a truthy supplied key under the chosen header, adding Bearer only when
      that name is exactly Authorization; otherwise B529 token lookup supplies Authorization Bearer. No key/token
      raises the Missing Azure AI credentials ValueError naming api_key/AZURE_AI_API_KEY, tenant/client/secret,
      token/OIDC/managed identity and enable_azure_ad_token_refresh=True. This function does not itself read the
      key environment.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_explicit_key_before_entra$/)'
  - id: case-missing-credentials
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-credentials/missing-credentials.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_missing_credentials$/)'
  - id: case-agent-entra-scope
    why: 'A2A scope defaults https://ai.azure.com/.default; choose tenant/client/secret grant, then client/username/password
      grant, then oidc/ token only with tenant/client, then static non-oidc token. Otherwise ValueError Azure AI
      agent Entra ID credentials did not resolve to a token. plus the literal configuration-help text at common_utils.py
      L55-L59. Async header resolution offloads this function and returns Authorization: Bearer <token>.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_agent_entra_scope$/)'
  - id: case-agent-config-only-credentials
    why: A2A agent auth resolves only nonempty strings among azure_ad_token,client_secret,azure_password,tenant_id,client_id,azure_username,azure_scope,
      resolving os.environ/ references through B129. has_azure_entra_params checks truthy azure_ad_token/client_secret/azure_password
      only; tenant/client alone do not qualify.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_agent_config_only_credentials$/)'
  - id: case-native-responses-eligibility
    why: Resolve base through model-info accessor; a non-None non-v1-host rejects native Responses. None model is
      accepted, case-insensitive claude rejects, otherwise only route=default qualifies. Route agents wins on case-sensitive
      agents/ substring; then case-insensitive model_router or model-router anywhere chooses model_router; everything
      else default.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_native_responses_eligibility$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_credentials.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_credentials*")"
      && grep -lq 'foundry_credentials' tools/oracle/fuzz/corpus/helper_case/foundry_credentials* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_credentials$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-azure-ai-api-base
    why: The AZURE_AI_API_BASE setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::foundry_credentials_config_cases::case_[0-9]+_loads_azure_ai_api_base$/)'
      && grep -lq 'AZURE_AI_API_BASE' crates/betterlite-config/fuzz/corpus/config_yaml/foundry_credentials*
