id: B549
title: Foundry endpoint and authentication settings
description: >-
  Create betterlite-foundry with FoundrySettings and resolved AuthHeaders. Load AZURE_AI_API_BASE/AZURE_AI_API_KEY
  and Azure Entra settings only at config time. Select Bearer versus api-key by the configured host boundary and
  give agents a distinct default scope https://ai.azure.com/.default. Keep explicit agent credentials isolated from
  ambient Azure deployment credentials; a caller cannot replace the operator endpoint or scope. Native Responses
  eligibility is a metadata query over model/base.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/common_utils.py:
  is_foundry_model_inference_base L18-L23; is_azure_openai_v1_host L26-L28; api_key_header_for_base L31-L32; get_azure_ai_entra_token
  L35-L47; has_azure_entra_params L61-L64; _resolve_config_secret L67-L70; get_azure_ai_agent_entra_token L73-L106;
  resolve_azure_ai_agent_auth_header L109-L111; get_azure_ai_auth_headers L114-L137; azure_ai_supports_native_responses
  L143-L151; foundry_chat_rejects_function_tools_while_reasoning L154-L159; AzureFoundryModelInfo.get_api_base L229-L230;
  AzureFoundryModelInfo.get_api_key L233-L234; AzureFoundryModelInfo.get_azure_ai_route L169-L191.


  get_azure_ai_route is local to this slice because azure_ai_supports_native_responses calls it and B562 consumes
  both. get_azure_ai_agent_entra_token, resolve_azure_ai_agent_auth_header and has_azure_entra_params are A2A helpers
  used by llms/a2a/common_utils.py and chat/transformation.py; Foundry agents instead use B529 get_azure_ad_token
  with forced ai.azure.com scope.


  Reuse OpenAIGPT5Config.is_model_gpt_5_6_plus_model from B502 (litellm/llms/openai/chat/gpt_5_transformation.py);
  its implementation remains with that prerequisite.


  Reuse OpenAIGPT5Config.is_model_gpt_6_plus_model from B502 (litellm/llms/openai/chat/gpt_5_transformation.py);
  its implementation remains with that prerequisite.


  Reuse get_azure_ad_token from B529 (litellm/llms/azure/common_utils.py); its implementation remains with that
  prerequisite.


  Reuse get_azure_ad_token_from_oidc from B530 (litellm/llms/azure/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse get_azure_ad_token_from_entra_id from B673 (litellm/llms/azure/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse get_azure_ad_token_from_username_password from B675 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-foundry/src/credentials.rs with adjacent tests under credentials/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation foundry_credentials in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function credentials_cases in betterlite-foundry with these exact named cases (one per oracle file):
  foundry_host_boundary, openai_v1_api_key_header, explicit_key_before_entra, missing_credentials, agent_entra_scope,
  agent_config_only_credentials, native_responses_eligibility. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_credentials* using HelperCase: kind:
  helper and the externally tagged foundry_credentials variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_credentials that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/foundry/credentials.rs
  and its loader wiring: AZURE_AI_API_BASE, AZURE_AI_API_KEY. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest foundry_credentials_config_cases
  with named cases loads_azure_ai_api_base, loads_azure_ai_api_key, plus rejects_unrelated_key. Each loads case
  calls the real config loader with that key and asserts the resolved value, default, precedence and secret redaction
  where applicable. Seed B002 config_yaml with new foundry_credentials* files for every key; reuse its parser/fuzz
  target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone foundry_credentials_credential_identity_isolation in betterlite-foundry for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone foundry_credentials_secret_safe_failure in betterlite-foundry for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 125 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 155 production lines, 152 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 0 parser target/replay lines, 31 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 446 planned, 450 maximum changed lines.
