checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-host-boundary
    why: The foundry-host-boundary behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_foundry_host_boundary$/)'
  - id: case-openai-v1-api-key-header
    why: The openai-v1-api-key-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_openai_v1_api_key_header$/)'
  - id: case-explicit-key-before-entra
    why: The explicit-key-before-entra behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_explicit_key_before_entra$/)'
  - id: case-missing-credentials
    why: The missing-credentials behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_missing_credentials$/)'
  - id: case-agent-entra-scope
    why: The agent-entra-scope behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_agent_entra_scope$/)'
  - id: case-agent-config-only-credentials
    why: The agent-config-only-credentials behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_agent_config_only_credentials$/)'
  - id: case-native-responses-eligibility
    why: The native-responses-eligibility behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_native_responses_eligibility$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_credentials.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_credentials*")"
      && grep -lq 'foundry_credentials' tools/oracle/fuzz/corpus/helper_case/foundry_credentials* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_credentials$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-azure-ai-api-base
    why: The AZURE_AI_API_BASE setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::foundry_credentials_config_cases::case_[0-9]+_loads_azure_ai_api_base$/)'
      && grep -lq 'AZURE_AI_API_BASE' crates/betterlite-config/fuzz/corpus/config_yaml/foundry_credentials*
  - id: config-azure-ai-api-key
    why: The AZURE_AI_API_KEY setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::foundry_credentials_config_cases::case_[0-9]+_loads_azure_ai_api_key$/)'
      && grep -lq 'AZURE_AI_API_KEY' crates/betterlite-config/fuzz/corpus/config_yaml/foundry_credentials*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::foundry_credentials_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/foundry_credentials*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_credentials_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_credentials_secret_safe_failure$/)'
