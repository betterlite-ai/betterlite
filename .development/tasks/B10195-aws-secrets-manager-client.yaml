id: B10195
title: key_management_system aws_secret_manager installs a working AWS Secrets Manager client that signs through the credential chain
description: >-
  A proxy with `key_management_system: aws_secret_manager` gets no AWS Secrets Manager client. The binary's `aws_secret_client` (crates/betterlite/src/config_boot/secret_manager.rs L226-L229) validates the region and installs `SecretManagerClient::Uninitialized`, so every secret read reports the client mismatch and falls back to the environment value (docs/deviations/B8590.yaml L15-L17). LiteLLM builds `AWSSecretsManagerV2` from key_management_settings at boot (proxy_server.py L7196-L7207, aws_secret_manager_v2.py L88-L120), and each request takes the instance's role, session, region, external id, profile, web identity and STS settings into `_get_boto_credentials_from_optional_params` (L631-L699), which picks the region by `_get_aws_region_name` and calls `resolve_credentials` (base_aws_llm.py L1536-L1568, L732-L790). betterlite-secret-managers already has the manager, `AwsSecretsManager<Resolver, Transport>` (crates/betterlite-secret-managers/src/aws.rs L20-L31), its signing and reads (aws/request_signing, aws_secret_reads) and its loader `load_aws_secret_manager` (aws/client_init.rs L45-L71), but no production credential resolver, no transport and no bridge to the dispatch protocol `AwsSecretsManagerClient` (secret_read_dispatch/protocols.rs L46-L52). B10175's chain is that resolver.


  The resolver. A new file crates/betterlite-bedrock/src/credentials/chain/secret_manager.rs, declared in chain.rs, holds `impl CredentialResolver for AwsCredentialChain` (the sync trait at aws/request_signing.rs L44-L51) with a new `SecretManagerCredentialError` (thiserror: `Region(#[source] AwsEndpointError)`, `Credentials(#[source] CredentialError)`, `Runtime(#[source] io::Error)` and `CurrentThreadRuntime` with the text "AWS Secrets Manager credentials cannot be resolved on a current-thread runtime"). It ports `_get_boto_credentials_from_optional_params`: the region is `llm_region_name` (aws_endpoints/region.rs L47-L64) with the taken `aws_region_name` as explicit, no model, AWS_REGION_NAME and AWS_REGION from `native.environment` and AWS_DEFAULT_REGION as the session region; the nine auth fields are taken out of the params into an `AwsSettings` literal with that region, the way signing/target.rs's `auth_settings` (L82-L99) fills one; the credentials come from the chain's `resolve_credentials(&settings, Some(&region))`; and it answers `AwsCredentialsInfo` with the region, the taken `aws_bedrock_runtime_endpoint` and those credentials. The trait is sync and its callers run both at boot, before the server runtime exists (crates/betterlite-server/src/server/component.rs L35 and L50), and inside the server's multi-thread runtime. So the async call runs through `block_in_place` and the current handle on a multi-thread runtime, as crates/betterlite-core/src/api/decisions_send/signing.rs L22-L33 does; outside any runtime on a current-thread runtime built for the call; and a current-thread runtime answers `CurrentThreadRuntime`. `AwsCredentialsInfo.credentials` (request_signing.rs L37-L42) becomes betterlite_sigv4's `Credentials`, so the chain's answer reaches the signer as it is and the signer's conversion from the aws-credential-types value goes; the test resolvers follow.


  The transport. A new file crates/betterlite-secret-managers/src/secret_read_dispatch/aws_http.rs, declared with `pub mod aws_http;` in secret_read_dispatch.rs, holds `pub struct AwsHttpTransport { pub exchange: Arc<dyn HttpExchange> }` implementing `AwsTransport` (request_signing.rs L125-L132) through `exchange.send` and `AwsBlockingTransport` (aws_secret_reads/blocking.rs L13-L18) through `exchange.send_blocking`, the way vault_http.rs L14-L76 builds an HttpRequest from its request and checks the size limit. A body over `max_response_bytes` is `TransportError::ResponseTooLarge`, and an exchange failure is `TransportError::Failed`.


  The dispatch bridge. aws_secret_reads/blocking.rs gains `impl<Resolver, Transport> AwsSecretsManagerClient for AwsSecretsManager<Resolver, Transport>` (Resolver: CredentialResolver + Send + Sync, Transport: AwsBlockingTransport). Its `sync_read_secret(secret_name, primary_secret_name)` calls the manager's own sync read with no params and no timeout and maps a failure to `AwsSecretsManagerError::Transport(io::Error::other(error))`, so the read error stays as the source.


  The boot. `aws_secret_client` keeps `validate_aws_secret_manager(env)` and then calls `load_aws_secret_manager(true, &settings, dependencies, &mut slot)`. settings is an `AwsKeyManagementSettings` filled from key_management_settings' nine AWS fields (crates/betterlite-config/src/sections/key_management_settings.rs L59-L77), like LiteLLM's aws_kwargs. dependencies are the env map, `Arc::new(AwsHttpTransport { exchange: Arc::new(ReqwestExchange::default()) })`, the chain from `AwsCredentialChain::from_environment(env.clone(), &client, Arc::new(SecretLookup::environment_only()))` over `ProxiedClient::outbound(&Arc::new(ProxyPolicy::resolve(&ProxyTrust::default(), env)?))` (the pair at crates/betterlite-server/src/python_hooks/bucket_fetcher.rs L82-L83), a `dns_suffix` that answers `get_aws_partition(Some(region)).dns_suffix` (crates/betterlite-context/src/aws_partition.rs L17-L42) and `SystemTime::now`. slot is a private struct in the binary implementing `AwsSecretManagerRuntime` (client_init.rs L23-L32) that keeps the client as `SecretManagerClient::AwsSecretManager(Arc::new(client))`, which build_client answers. A failing step is a `ConfigBootError::Step` through the file's `step_error`, named "initializing the AWS Secrets Manager client". The binary adds betterlite-bedrock, betterlite-context and betterlite-http to its dependencies. docs/deviations/B8590.yaml's row drops aws_secret_manager from its list of systems that install Uninitialized.


  Tests. credentials/chain/tests gains `secret_manager_params_resolve_through_the_chain`, an rstest over B10175's chain fixture with AWS_EC2_METADATA_DISABLED=true: static keys with a region answer those keys, the region and the runtime endpoint and leave the params' fields None; no region takes AWS_REGION_NAME, then AWS_REGION, then us-west-2; and a role name reaches the fixture's AssumeRole. It runs once from a plain #[test] (no runtime) and once from `#[tokio::test(flavor = "multi_thread")]`; `a_current_thread_runtime_refuses_secret_manager_credentials` checks the refusal. secret_read_dispatch/tests gains secret_dispatch_aws_http.rs, mounted in tests.rs, with `aws_http_transport_posts_the_signed_request` (sync and async, over the test socket the Vault transport tests use, tests/secret_dispatch_vault/socket.rs) and `aws_http_transport_refuses_a_large_reply`. aws_secret_reads/tests.rs gains `the_dispatch_client_reads_through_the_manager`: the manager over its FakeResolver and FakeTransport, used as `Arc<dyn AwsSecretsManagerClient>`, answers a direct secret and a primary-secret entry, and a transport failure keeps its read error as the source. In the binary, `aws_secret_manager_installs_the_v2_client` checks that `select_secret_manager(Some("aws_secret_manager"), ...)` with keys and AWS_REGION_NAME answers a client whose class_name is "AWSSecretsManagerV2", and `aws_secret_manager_warns_without_a_region` (config_boot/secret_manager/tests.rs L303-L317) expects that name instead of "NoneType" and keeps its warning check.


  What users see. `key_management_system: aws_secret_manager` now reads `os.environ/` values and stored virtual keys from AWS Secrets Manager with the role, profile, web identity or static keys from key_management_settings and the environment, as LiteLLM does, instead of logging a client mismatch and using the environment value.
