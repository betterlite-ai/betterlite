dod:
  - text: The secret manager's CredentialResolver is async, AwsCredentialChain implements it with LiteLLM's region and parameter rules, and the manager has no blocking path.
    proof: [installed, resolver-tests, secret-manager-tests]
  - text: AwsHttpTransport carries the manager's signed requests, the chain gives KMS the SDK default chain, and both dispatch clients answer their async-path error.
    proof: [resolver-tests, secret-manager-tests]
  - text: aws_secret_manager and aws_kms install their clients at boot and B8590's row no longer lists them.
    proof: [boot-tests, installed]
checks:
  optional: [mutants]
  commands:
    - id: installed
      why: the boot still installs Uninitialized for an AWS system, the deviation row still lists them, or the blocking path is left
      run: |-
        test -z "$(grep -n 'aws_kms, aws_secret_manager and google_secret_manager' docs/deviations/B8590.yaml)" &&
        grep -q 'SecretManagerClient::AwsSecretManager' crates/betterlite/src/config_boot/secret_manager.rs &&
        grep -q 'SecretManagerClient::AwsKms' crates/betterlite/src/config_boot/secret_manager.rs &&
        grep -q 'impl CredentialResolver for AwsCredentialChain' crates/betterlite-bedrock/src/credentials/chain/secret_manager.rs &&
        test -z "$(grep -rn 'AwsBlockingTransport\|fn blocking_post_action' crates/betterlite-secret-managers/src)"
    - id: resolver-tests
      why: the chain resolves the wrong region or settings for the secret manager, or KMS gets a chain other than the SDK default
      run: grep -rq 'fn secret_manager_params_resolve_through_the_chain' crates/betterlite-bedrock/src/credentials/chain && grep -rq 'fn kms_credentials_use_the_sdk_default_chain' crates/betterlite-bedrock/src/credentials/chain && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^credentials::chain::/)'
    - id: secret-manager-tests
      why: the transport drops the signed request or the size limit, an async read lost its credentials, or a dispatch client reads instead of answering its error
      run: grep -q 'fn aws_http_transport_posts_the_signed_request' crates/betterlite-secret-managers/src/secret_read_dispatch/tests/secret_dispatch_aws_http.rs && grep -q 'fn sync_reads_need_the_async_path' crates/betterlite-secret-managers/src/aws_secret_reads/tests.rs && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^(secret_read_dispatch|aws_secret_reads|aws_secrets|aws|aws_kms)::/)'
    - id: boot-tests
      why: the boot does not install an AWS client, or a config_boot expectation broke
      run: grep -q 'fn aws_secret_manager_installs_the_v2_client' crates/betterlite/src/config_boot/secret_manager/tests.rs && grep -q 'fn aws_kms_installs_the_kms_client' crates/betterlite/src/config_boot/secret_manager/tests.rs && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^config_boot::/)'
oracle_cases: []
deviations:
  - what: A sync secret read through aws_secret_manager and a sync decrypt through aws_kms answer an error, and SecretLookup logs it and reads the environment value.
    why: The credential chain is async and the dispatch protocols are sync; the rules allow no sync bridge, so only async callers sign through the chain.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L173-L232
out_of_scope:
  - "Making SecretLookup::get_secret and the dispatch protocols async, so that config-boot os.environ/ reads reach AWS Secrets Manager and KMS: a decision for the architect."
  - "B8375's USE_AWS_KMS step passes the chain's kms_credentials() to decrypt_env_var; B8375 builds that call."
  - "The other systems in B8590's row (Azure Key Vault, Google KMS, Google Secret Manager, custom)."
  - "The SigV4 steps in aws/request_signing/sigv4.rs: B10191."
pitfalls:
  - "betterlite-secret-managers sits below betterlite-bedrock: the resolver and the KMS provider live in bedrock, the transport and the dispatch clients in secret-managers, and secret-managers never names AwsCredentialChain."
  - "No block_on, block_in_place or runtime built inside a call: the sync paths answer their error instead."
  - "The manager's chain is its own, built at boot over an environment-only SecretLookup: the server's Shared chain does not exist yet when the secret manager loads."
  - "Take each AwsOptionalParams field (Option::take), as LiteLLM pops them, so the params left after the call hold no credentials."
  - "kms_credentials must not apply LiteLLM's AWS_ROLE_NAME or AWS_PROFILE_NAME: boto3's KMS client reads only the SDK names."
  - "Every test map that reaches the SDK chain sets AWS_EC2_METADATA_DISABLED=true and gives keys, so nothing reaches instance metadata."
review_level: security
budget:
  max_changed_lines: 1250
  max_new_expects: 0
