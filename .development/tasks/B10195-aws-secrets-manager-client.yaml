id: B10195
title: The aws_secret_manager and aws_kms clients sign through the credential chain, with an async credential resolver
description: >-
  A proxy with `key_management_system: aws_secret_manager` gets no AWS Secrets Manager client. With `aws_kms` it gets no KMS client either (L105-L108 install Uninitialized through validated_client), and the startup decrypt of LITELLM_SECRET_AWS_KMS_ values that B8375 calls, `decrypt_env_var` (crates/betterlite-secret-managers/src/aws_kms/environment.rs L7-L24), takes an optional credentials provider that nothing builds, where LiteLLM's `load_aws_kms` makes a boto3 KMS client with the default chain at AWS_REGION_NAME (aws_secret_manager.py L24-L40) and proxy_cli.py L1187-L1196 decrypts at start. The binary's `aws_secret_client` (crates/betterlite/src/config_boot/secret_manager.rs L226-L229) validates the region and installs `SecretManagerClient::Uninitialized`, so every secret read reports the client mismatch and falls back to the environment value (docs/deviations/B8590.yaml L15-L17). LiteLLM builds `AWSSecretsManagerV2` from key_management_settings at boot (proxy_server.py L7196-L7207, aws_secret_manager_v2.py L88-L120), and each request takes the instance's role, session, region, external id, profile, web identity and STS settings into `_get_boto_credentials_from_optional_params` (L631-L699), which picks the region by `_get_aws_region_name` and calls `resolve_credentials` (base_aws_llm.py L1536-L1568, L732-L790). betterlite-secret-managers already has the manager, `AwsSecretsManager<Resolver, Transport>` (crates/betterlite-secret-managers/src/aws.rs L20-L31), its signing and reads (aws/request_signing, aws_secret_reads) and its loader `load_aws_secret_manager` (aws/client_init.rs L45-L71), but no production credential resolver, no transport and no bridge to the dispatch protocol `AwsSecretsManagerClient` (secret_read_dispatch/protocols.rs L46-L52). B10175's chain is that resolver.


  The resolver. `CredentialResolver` (aws/request_signing.rs L44-L51) becomes `#[async_trait] pub trait CredentialResolver: Send + Sync` with `async fn resolve_credentials(&self, optional_params: &mut AwsOptionalParams) -> Result<AwsCredentialsInfo, Self::Error>`, as B10173 did for Polly's resolver, since the chain is async and the rules allow no sync bridge. `prepare_request` (request_signing/prepare_request.rs L30-L104) becomes async and awaits it, and `async_post_action` (post_action.rs L66-L77) awaits prepare_request. The manager's blocking path cannot await, so it goes: `AwsBlockingTransport`, `blocking_post_action`, the manager's `sync_read_secret` and `sync_read_from_primary` (aws_secret_reads/blocking.rs) and their tests. `AwsReadError` (aws_secret_reads.rs L30-L39) gains `SyncRead` with the text "AWS Secrets Manager reads need the async path, since its credential chain is async", which AwsSecretClient's `BaseSecretManager::sync_read_secret` (aws_secrets/manager.rs) answers. The 15 tokio tests in aws_secret_reads/tests.rs and the test resolvers in aws/client_init/aws_client_init/tests.rs, aws/request_signing/aws_request_signing/support.rs, aws_secret_reads/tests.rs and aws_secrets/tests/support.rs follow: their async reads await the resolver, and each sync read becomes a check for SyncRead. `AwsCredentialsInfo.credentials` (request_signing.rs L37-L42) becomes betterlite_sigv4's `Credentials`, so the chain's answer reaches the signer as it is, and the `Credentials::from(&held)` call B10191 puts in the secret-managers signer goes.


  A new file crates/betterlite-bedrock/src/credentials/chain/secret_manager.rs, declared in chain.rs, holds `impl CredentialResolver for AwsCredentialChain` with a new `SecretManagerCredentialError` (thiserror: `Region(#[source] AwsEndpointError)` and `Credentials(#[source] CredentialError)`). It ports `_get_boto_credentials_from_optional_params`: the region is `llm_region_name` (aws_endpoints/region.rs L47-L64) with the taken `aws_region_name` as explicit, no model, AWS_REGION_NAME and AWS_REGION from `native.environment` and AWS_DEFAULT_REGION as the session region; the nine auth fields are taken out of the params into an `AwsSettings` literal with that region, the way signing/target.rs's `auth_settings` (L82-L99) fills one; the credentials are `self.resolve_credentials(&settings, Some(&region)).await`; and it answers `AwsCredentialsInfo` with the region, the taken `aws_bedrock_runtime_endpoint` and those credentials. The same file holds `pub fn kms_credentials(&self) -> SharedCredentialsProvider` on the chain: a private `SdkDefaultChain { native: Arc<NativeSources>, region: Option<String> }` implementing aws-credential-types' `ProvideCredentials` by loading `native.loader` with only AWS_REGION_NAME set and asking its credentials provider, the SDK default chain boto3's KMS client uses, so no credentials are copied between types.


  The transport. A new file crates/betterlite-secret-managers/src/secret_read_dispatch/aws_http.rs, declared with `pub mod aws_http;` in secret_read_dispatch.rs, holds `pub struct AwsHttpTransport { pub exchange: Arc<dyn HttpExchange> }` implementing `AwsTransport` (request_signing.rs L125-L132) through `exchange.send`, the way vault_http.rs L14-L76 builds an HttpRequest from its request and checks the size limit. A body over `max_response_bytes` is `TransportError::ResponseTooLarge`, and an exchange failure is `TransportError::Failed`.


  The dispatch clients. The dispatch protocols are sync (secret_read_dispatch/protocols.rs L36-L52) and the only production reader, `SecretLookup::get_secret` (secret_lookup.rs L38-L62), is sync, so neither client can reach the async chain: `impl AwsSecretsManagerClient for AwsSecretsManager<Resolver, Transport>` (in aws_secret_reads.rs) answers `AwsSecretsManagerError::Transport(io::Error::other(AwsReadError::SyncRead))`, and a new `KmsClient { client: Arc<aws_sdk_kms::Client> }` in aws_kms.rs implements `AwsKmsClient` by answering a new `AwsKmsError::SyncDecrypt` ("AWS KMS decrypts need the async path, since its credential chain is async"). SecretLookup then logs and reads the environment value (secret_lookup/manager.rs L41-L48), as it does for Uninitialized today. Async callers (BaseSecretManager through AwsSecretClient, and `decrypt_env_var`) sign through the chain.


  The boot. `aws_secret_client` keeps `validate_aws_secret_manager(env)` and then calls `load_aws_secret_manager(true, &settings, dependencies, &mut slot)`. settings is an `AwsKeyManagementSettings` filled from key_management_settings' nine AWS fields (crates/betterlite-config/src/sections/key_management_settings.rs L59-L77), like LiteLLM's aws_kwargs. dependencies are the env map, `Arc::new(AwsHttpTransport { exchange: Arc::new(ReqwestExchange::default()) })`, the chain from `AwsCredentialChain::from_environment(env.clone(), &client, Arc::new(SecretLookup::environment_only()))` over `ProxiedClient::outbound(&Arc::new(ProxyPolicy::resolve(&ProxyTrust::default(), env)?))` (the pair at crates/betterlite-server/src/python_hooks/bucket_fetcher.rs L82-L83), a `dns_suffix` that answers `get_aws_partition(Some(region)).dns_suffix` (crates/betterlite-context/src/aws_partition.rs L17-L42) and `SystemTime::now`. slot is a private struct in the binary implementing `AwsSecretManagerRuntime` (client_init.rs L23-L32) that keeps the client as `SecretManagerClient::AwsSecretManager(Arc::new(client))`, which build_client answers. A failing step is a `ConfigBootError::Step` through the file's `step_error`, named "initializing the AWS Secrets Manager client". For aws_kms, build_client keeps `validate_aws_kms(env)` and installs `SecretManagerClient::AwsKms(Arc::new(KmsClient { client }))` over `aws_kms::initialization::build_client` (initialization.rs L34-L57, made `pub`) with a `SharedHttpClient` over the proxied client (`AwsDuplexClient::from_proxied`, as B10175 builds NativeSources), the chain's `kms_credentials()` and a 60 second timeout. The binary adds betterlite-bedrock and betterlite-context to its dependencies; it already has betterlite-http (crates/betterlite/Cargo.toml L17). docs/deviations/B8590.yaml's row drops aws_kms and aws_secret_manager from its list of systems that install Uninitialized, and this task's deviation row says that their sync reads and decrypts fall back to the environment value.


  Tests. credentials/chain/tests gains `secret_manager_params_resolve_through_the_chain`, an rstest over B10175's chain fixture with AWS_EC2_METADATA_DISABLED=true: static keys with a region answer those keys, the region and the runtime endpoint and leave the params' fields None; no region takes AWS_REGION_NAME, then AWS_REGION, then us-west-2; and a role name reaches the fixture's AssumeRole. `kms_credentials_use_the_sdk_default_chain` checks that the provider answers AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY from the chain's map and ignores AWS_ROLE_NAME. secret_read_dispatch/tests gains secret_dispatch_aws_http.rs, mounted in tests.rs, with `aws_http_transport_posts_the_signed_request` (over the test socket the Vault transport tests use, tests/secret_dispatch_vault/socket.rs) and `aws_http_transport_refuses_a_large_reply`. aws_secret_reads/tests.rs gains `sync_reads_need_the_async_path`: the AwsSecretClient's sync read and the manager used as `Arc<dyn AwsSecretsManagerClient>` both answer SyncRead and send nothing. aws_kms/tests.rs gains `the_dispatch_kms_client_needs_the_async_path`. In the binary, `aws_secret_manager_installs_the_v2_client` and `aws_kms_installs_the_kms_client` check that `select_secret_manager` with keys and AWS_REGION_NAME answers a client whose class_name is "AWSSecretsManagerV2" and "AWSKeyManagementService", and `aws_secret_manager_warns_without_a_region` (config_boot/secret_manager/tests.rs L303-L317) expects "AWSSecretsManagerV2" instead of "NoneType" and keeps its warning check.


  What users see. `decrypt_env_var` and the async secret manager calls (stored virtual keys through BaseSecretManager) sign with the chain's credentials, as LiteLLM's clients do. A sync `os.environ/` read through aws_secret_manager or aws_kms still logs and falls back to the environment value, now with the async-path error instead of the client mismatch.
