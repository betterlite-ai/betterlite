references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7196-L7207
    why: the proxy loads AWSSecretsManagerV2 with the key management settings when key_management_system is aws_secret_manager.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L88-L120
    why: load_aws_secret_manager copies the nine AWS settings and kms_key_id into the client and installs it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L631-L699
    why: _prepare_request fills the instance settings into optional_params and resolves credentials and region from them for each request.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L1536-L1568
    why: _get_boto_credentials_from_optional_params pops the region, the auth params and the runtime endpoint and calls resolve_credentials.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L732-L790
    why: _get_aws_region_name takes the explicit region, then AWS_REGION_NAME, AWS_REGION, the boto3 session region and us-west-2.
dod:
  - text: AwsCredentialChain implements the secret manager's CredentialResolver with LiteLLM's region and parameter rules and works with no runtime and on a multi-thread runtime.
    proof: [resolver-tests]
  - text: AwsHttpTransport carries the manager's signed requests over the shared HTTP exchange, and the manager answers the dispatch protocol.
    proof: [secret-manager-tests]
  - text: aws_secret_manager installs an AWSSecretsManagerV2 client at boot and B8590's row no longer lists it.
    proof: [boot-tests, installed]
checks:
  optional: [mutants]
  commands:
    - id: installed
      why: the boot still installs Uninitialized for aws_secret_manager or the deviation row still lists it
      run: |-
        test -z "$(grep -n 'aws_secret_manager and google_secret_manager' docs/deviations/B8590.yaml)" &&
        grep -q 'SecretManagerClient::AwsSecretManager' crates/betterlite/src/config_boot/secret_manager.rs &&
        grep -q 'impl CredentialResolver for AwsCredentialChain' crates/betterlite-bedrock/src/credentials/chain/secret_manager.rs
    - id: resolver-tests
      why: the chain resolves the wrong region or settings for the secret manager, or the sync bridge fails in one of its contexts
      run: grep -rq 'fn secret_manager_params_resolve_through_the_chain' crates/betterlite-bedrock/src/credentials/chain && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^credentials::chain::/)'
    - id: secret-manager-tests
      why: the transport drops the signed request or the size limit, or the dispatch bridge loses a read or its error
      run: grep -q 'fn aws_http_transport_posts_the_signed_request' crates/betterlite-secret-managers/src/secret_read_dispatch/tests/secret_dispatch_aws_http.rs && grep -q 'fn the_dispatch_client_reads_through_the_manager' crates/betterlite-secret-managers/src/aws_secret_reads/tests.rs && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^(secret_read_dispatch|aws_secret_reads|aws_secrets|aws)::/)'
    - id: boot-tests
      why: the boot does not install the AWS client, or a config_boot expectation broke
      run: grep -q 'fn aws_secret_manager_installs_the_v2_client' crates/betterlite/src/config_boot/secret_manager/tests.rs && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^config_boot::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "AWS KMS (`key_management_system: aws_kms`), which still installs Uninitialized: its client uses the SDK default chain, as LiteLLM's load_aws_kms does (aws_secret_manager.py L24-L40), and needs no credential chain."
  - "The other systems in B8590's row (Azure Key Vault, Google KMS, Google Secret Manager, custom)."
  - "Sync reads inside the server runtime: ReqwestExchange's blocking send refuses them (reqwest_exchange.rs L90-L95), as it does for Vault and CyberArk."
  - "The SigV4 steps in aws/request_signing/sigv4.rs: B10191."
pitfalls:
  - "betterlite-secret-managers sits below betterlite-bedrock: the resolver impl lives in bedrock, the transport and the dispatch bridge in secret-managers, and secret-managers never names AwsCredentialChain."
  - "block_in_place panics on a current-thread runtime and building a runtime inside one panics too, so check the flavor first and answer CurrentThreadRuntime."
  - "The manager's chain is its own, built at boot over an environment-only SecretLookup: the server's Shared chain does not exist yet when the secret manager loads."
  - "Take each AwsOptionalParams field (Option::take), as LiteLLM pops them, so the params left after the call hold no credentials."
  - "Every test map that reaches the SDK chain sets AWS_EC2_METADATA_DISABLED=true and gives keys, so nothing reaches instance metadata."
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
