id: B9690
title: Prove the deployed-model table, detail, credential, health and price requests through the booted proxy
description: >-
  Add HTTP oracle cases for the exact requests the Models + Endpoints page sends from its
  Deployed Models table, the model detail and edit view, the LLM Credentials, Health Status,
  Price Data and Access Group Budgets tabs, and the model storage settings modal. B9090 takes
  in every covered file unchanged from the hash-checked archive and B9091 builds it, so no
  React function is ported and no patch is needed: none of these components gates an MIT
  control on premiumUser. Every route below already has a backend owner. This task registers
  no handler and adds no product code; it adds case files under tools/oracle/cases/ui/model-deployments.

  Default auth is Authorization: Bearer <session key>; the retained client swaps in the
  discovered auth_header_name. GETs carry no body. JSON writes send Content-Type
  application/json. Compare status, content-type, error type/param/code and the full stable
  response projection the page reads; capture only generated ids, timestamps and the session
  key. Use B860's per-peer Postgres fixture with B5076's Prisma bootstrap, master key
  oracle-master, store_model_in_db true, a fixed proxy_admin, a proxy_admin_viewer and an
  internal_user from the existing key seeds, and the local upstream mock as api_base.

  Table and detail reads. AllModelsTab calls useModelsInfo, and it sends GET /v2/model/info
  with include_team_models=true, page=<pageIndex+1>, size=<pageSize> (default 50) and
  exclude_auto_routers=true, plus search, teamId, sortBy, sortOrder, model, access_group and
  wildcard_only=true only when set; trimmed empty values are omitted. HealthStatusPanel sends
  the same path without exclude_auto_routers, and the detail view sends page=1,size=50 with
  modelId=<id>. The page reads data[].model_name, litellm_params.model/custom_llm_provider/
  api_base/litellm_credential_name/tags, model_info.id/db_model/team_id/access_groups/mode/
  created_at/updated_at/created_by and the total_count/current_page/total_pages envelope.
  B850 owns the route. Its planned v2-info-page, v2-filter-sort and v2-team-scope cases are
  generic; none sends include_team_models with exclude_auto_routers, so add the default page,
  a search+sort page, a team filter, an access_group filter and wildcard_only over a config
  holding a plain deployment, a db deployment, a team deployment, a wildcard openai/* and an
  auto_router/complexity_router deployment that the table must not count. model_info_view then
  sends GET /v1/model/info?litellm_model_id=<id> (B851) and reads data[0] including
  litellm_model_name and model_info, and GET /credentials/by_model/<id> (B1601) reading
  credential_name, credential_values and credential_info. B851's v1-info and B1601's
  model-id-precedence cases use other ids; add the detail sequence for one db model.

  Writes from the table and detail. The pause switch sends PATCH /model/<id>/update with
  exactly {blocked:true} or {blocked:false}. The edit form sends PATCH /model/<id>/update with
  {model_name, litellm_params, model_info}: per-million prices divided by 1e6 into
  input_cost_per_token/output_cost_per_token, an explicit null when a touched price is cleared,
  cache_read_input_token_cost following input cost when only that changed,
  cache_creation_input_token_cost null when cleared, vector_store_ids [] when cleared,
  cache_control_injection_points null when control was removed, and model_info.access_groups,
  health_check_model and team_id from the form. Masked secrets are stripped before sending.
  Credential rotation in update_model_credentials_modal sends the same PATCH with only the new
  litellm_params secret fields. B835 owns PATCH; its blocked-admin-policy, clear-credential
  and patch-preserves-secret cases do not send these page bodies, so add pause/resume, a
  price set then clear followed by a /v2/model/info read-back, and a rotation that keeps the
  stored secret masked in every response. Delete sends POST /model/delete with {id} (B838)
  from both the table and the detail; add a delete followed by the table read. A config-only
  model's patch and delete must keep B835/B838's real refusal, never a client-side success.

  Credentials tab. CredentialsPanel lists through useCredentials, GET /credentials reading
  credentials[].credential_name/credential_info, creates with POST /credentials
  {credential_name, credential_values, credential_info:{custom_llm_provider}}, updates with
  PATCH /credentials/<name> and the same shape, and deletes with DELETE /credentials/<name>.
  The detail's reuse action POSTs {credential_name, model_id, credential_info:
  {custom_llm_provider}} with no credential_values. B1601 owns all of these (create, list,
  by_model, delete, patch decorators); its create-and-duplicate and patch-rename cases are
  close but use other bodies. Add one create, rename, model-id reuse and delete transcript
  and check that credential_values never come back unmasked in the list.

  Health. The detail's Test Connection sends POST /health/test_connection with
  {litellm_params:{custom_llm_provider, litellm_credential_name, model}, model_info:{id, mode},
  mode}. The page treats an HTTP 200 whose status is "error" as a failure, so compare a
  success and a 200-with-error body. B4446 owns this route; reuse its
  deployment-id-lookup-preferred case only if its body is identical. HealthCheckComponent
  sends GET /health/latest, reading latest_health_checks keyed by model id (status,
  error_message, response_time_ms, checked_at) and total_models, and per model GET
  /health?model_id=<encodeURIComponent(id)>, reading healthy_count, unhealthy_count and
  unhealthy_endpoints[0].error. B4445 owns both and B8540 mounts them; B4445 plans only the
  no-database and unknown-id cases, so add a populated latest table after one stored check
  and a single-model check against the healthy and a failing mock deployment.

  Price data. PriceDataManagementTab and price_data_reload send GET
  /public/litellm_model_cost_map without auth (B077, reuse its cost-map-local case), GET
  /schedule/model_cost_map_reload/status reading scheduled, interval_hours, last_run,
  next_run, GET /model/cost_map/source, POST /reload/model_cost_map with no body, POST
  /schedule/model_cost_map_reload?hours=<n> and DELETE /schedule/model_cost_map_reload.
  B8586 owns them and B8676 mounts them; B8676's cases only cover missing database, zero
  hours, non-admin and source. Point LITELLM_MODEL_COST_MAP_URL (default the GitHub raw
  model_prices_and_context_window.json) at the case's upstream mock so no case fetches the
  internet, then compare reload, schedule 6 hours, status, cancel and status again.

  Access group budgets and storage. AccessGroupBudgetsPanel reads GET /access_group/list
  (B2341) through the typed client and its rows' access_group, model_names and budget fields;
  saving sends PUT /access_group/<name>/budget with only the filled max_budget, soft_budget and
  budget_duration (blank fields omitted, numbers not strings) and clearing sends DELETE
  /access_group/<name>/budget with no body (B825). Add set, partial update and clear with list
  read-backs. ModelSettingsModal reads GET /config/list?config_type=general_settings and
  toggles storage with POST /config/field/update {field_name:"store_model_in_db",
  field_value:<bool>, config_type:"general_settings"} (B8595, mounted by B8675); add the
  toggle and its list read-back. general_settings.store_model_in_db defaults to false.

  Shared lookups are not duplicated: /model_group/info, /tag/list, /v2/guardrails/list and
  the /models scope=expand selector reuse B9735's cases, and /team/list belongs to B9731.
  Finish with one viewer case and one internal-user case that send the pause PATCH, the
  credential POST and the budget PUT and keep the real server denial. About 600 case lines.
scope:
  paths:
    - tools/oracle/cases/ui/model-deployments/**
  lint_tables: false
