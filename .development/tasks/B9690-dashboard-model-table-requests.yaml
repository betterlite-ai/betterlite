dod:
  - text: The table's page, search, sort, team, access-group and wildcard queries and the detail's v1 and credential reads return the fields the page reads, with auto-routers excluded.
    proof: [model-table-cases, oracle]
  - text: Pause, edit with cleared prices, credential rotation, credential CRUD, delete, connection test, health reads, cost map reload and schedule, access-group budgets and the storage toggle match LiteLLM and persist on read-back.
    proof: [model-table-cases, oracle]
  - text: Viewer and internal-user sessions get the server's denial for the same writes.
    proof: [model-table-cases, oracle]
checks:
  optional: []
  commands:
    - id: model-table-cases
      why: No booted-proxy case sends the page's exact model table, detail, credential, health, price or budget requests.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/model-deployments)" &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/ui/model-deployments
oracle_cases:
  - tools/oracle/cases/ui/model-deployments/table-page-filters.yaml
  - tools/oracle/cases/ui/model-deployments/detail-v1-and-credential-lookup.yaml
  - tools/oracle/cases/ui/model-deployments/pause-edit-and-price-clear.yaml
  - tools/oracle/cases/ui/model-deployments/credential-rotation-masked.yaml
  - tools/oracle/cases/ui/model-deployments/credentials-tab-crud.yaml
  - tools/oracle/cases/ui/model-deployments/connection-test-and-delete.yaml
  - tools/oracle/cases/ui/model-deployments/health-latest-and-single.yaml
  - tools/oracle/cases/ui/model-deployments/price-data-reload-schedule.yaml
  - tools/oracle/cases/ui/model-deployments/access-group-budget-set-clear.yaml
  - tools/oracle/cases/ui/model-deployments/storage-setting-toggle.yaml
  - tools/oracle/cases/ui/model-deployments/viewer-and-member-denials.yaml
deviations: []
out_of_scope:
  - B9090 retains every unchanged function in the covered page, panel, table, detail and credential files; B9091 builds them and B146 drives them in the browser.
  - B850, B851, B835, B838, B1601, B4445, B4446, B8586, B2341, B825 and B8595 own the handlers; B8540, B8676 and B8675 own their mounts. No route is registered here.
  - B9735 owns the shared /model_group/info, /tag/list, guardrail and /models selector cases; B9731 owns /team/list and TeamInfoView; PassThroughPanel's requests belong to B150's pass-through child.
  - Auto-router listing, creation and editing, the add-model form and its provider fields are B9691's; router, alias and retry settings are B9692's.
pitfalls:
  - The table always sends exclude_auto_routers=true but HealthStatusPanel does not, so the two lists count different rows.
  - The edit PATCH sends explicit null to remove a price override; dropping the key leaves the old price in place.
  - POST /health/test_connection can answer 200 with status "error", and the page treats that as a failed test.
  - /health/latest keys rows by model_id and falls back to model_name only when the stored row has no id.
  - A cost map reload with the default LITELLM_MODEL_COST_MAP_URL reaches GitHub, so every case must point it at the mock.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
