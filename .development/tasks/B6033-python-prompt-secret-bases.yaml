id: B6033
title: Python CustomPromptManagement, CustomSecretManager and BaseSecretManager
description: >-
  Users subclass `CustomPromptManagement` to fetch prompts and `CustomSecretManager` to read secrets from their own store.
  After `import betterlite as litellm`, the same subclasses must work unchanged. This task ports the three classes to
  Python. It is Python only: no Rust file changes.


  Put the code in `python/betterlite/_integrations/custom_prompt_management.py`, `custom_secret_manager.py` and
  `base_secret_manager.py`, and add re-export modules at `python/betterlite/integrations/custom_prompt_management.py`,
  `python/betterlite/integrations/custom_secret_manager.py` and `python/betterlite/secret_managers/base_secret_manager.py`.
  Do not create any `__init__.py` outside `_integrations`. The architect writes those.


  `CustomPromptManagement` inherits `CustomLogger` (B6030) and, in LiteLLM, `PromptManagementBase`. Port the methods of
  `custom_prompt_management.py` with the same names, parameters and defaults. Port the part of
  `litellm/integrations/prompt_management_base.py` that the class reaches (`should_run_prompt_management`,
  `_compile_prompt_helper`, `get_chat_completion_prompt` and what they call), because its base class has no owner yet and
  the subclass cannot work without it. B4050 builds the Rust prompt contracts, but nothing exposes them to Python, so the
  Python code here is a plain port.


  `BaseSecretManager` is an abstract class. Port its abstract methods, `get_secret_from_manager`-style helpers and its
  rotation methods with the same signatures and results as LiteLLM, using `abc` and `asyncio` from the standard library.
  `CustomSecretManager` inherits it and calls the user's methods; keep its `secret_manager_name`, its `key_management_system`
  value and its error behavior. Do not add a dependency. B4410 and B4419 build the same behavior in Rust for the gateway,
  and no call into them is planned.


  `custom_sso_handler.py` is covered but not built: `custom_sso_handler` has no caller at the pin (see B063's out of scope).
  Leave it out and say so in the test file with one comment line.
scope:
  paths:
  - crates/betterlite-python/python/betterlite/_integrations/custom_prompt_management.py
  - crates/betterlite-python/python/betterlite/_integrations/prompt_management_base.py
  - crates/betterlite-python/python/betterlite/_integrations/custom_secret_manager.py
  - crates/betterlite-python/python/betterlite/_integrations/base_secret_manager.py
  - crates/betterlite-python/python/betterlite/integrations/custom_prompt_management.py
  - crates/betterlite-python/python/betterlite/integrations/custom_secret_manager.py
  - crates/betterlite-python/python/betterlite/secret_managers/base_secret_manager.py
  - crates/betterlite-python/tests/test_prompt_secret_bases.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_prompt_management.py
  why: The prompt management class.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prompt_management_base.py
  why: The base class it inherits.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_secret_manager.py
  why: The custom secret manager.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/base_secret_manager.py
  why: The abstract base and rotation methods.
dod:
- text: A LiteLLM `CustomPromptManagement` subclass runs on both packages and its prompt call returns the same model, messages and params.
  proof: [prompt-bases]
- text: '`should_run_prompt_management` and the prompt compile helper give the same results as LiteLLM for a prompt id, no id, and a missing prompt.'
  proof: [prompt-bases]
- text: A LiteLLM `CustomSecretManager` subclass reads, writes and deletes through both packages, and the abstract methods stay abstract.
  proof: [secret-bases]
- text: Rotation methods on `BaseSecretManager` give the same results and raise the same errors as LiteLLM.
  proof: [secret-bases]
- text: The re-export modules expose the same names as LiteLLM's modules.
  proof: [prompt-bases, secret-bases]
- text: Python files pass ruff and basedpyright in strict mode.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: prompt-bases
    why: A prompt management method differs.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_prompt_secret_bases.py -k prompt
  - id: secret-bases
    why: A secret manager method differs.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_prompt_secret_bases.py -k secret
  - id: python-lint
    why: Strict typing has to hold for every new module.
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Prompt and secret manager logic is a Python port and does not call the Rust code of B4050 and B4410.
  why: No native bridge for those modules is planned. The classes are for users' own subclasses and hold little logic.
out_of_scope:
- '`custom_sso_handler.py`: no caller at the pin.'
- Prompt management backends such as Langfuse, Humanloop or Dotprompt, and the secret manager backends, belong to their own entries.
- The Rust prompt contracts (B4050) and secret manager code (B4410, B4419).
- The `__init__.py` files outside `_integrations` are written by the architect.
pitfalls:
- A subclass may override only some methods. Keep every default body and every `NotImplementedError` as LiteLLM has them.
- 'Do not use `Any`, `cast` or `type: ignore`. Use `JsonValue` and Protocols.'
- The abstract methods must make instance creation fail for a subclass that skips them, as in LiteLLM.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
