id: B337
title: Cache-cost-aware complexity placement
description: Integrate B075's existing cache prediction service with B334 placement and B325 affinity
  observations. Add cache_aware_routing configuration and the bounded prediction deadline; preserve the
  original classified route when prediction is unavailable. Carry the selected cost comparison as Decimal
  and update decision metadata through B012. This part only orchestrates the prediction and placement;
  B075 owns cache observations, provider token-count calls and pricing eligibility. Use the existing Rust
  crate boundaries from B004 and B008; integrate through the server when the provider dispatcher or callbacks
  live in another core crate. This task's source slices are the linked ranges, not a port of their Python
  classes. Add the listed oracle cases and the matching adapters to B301's component runner where state
  is not observable over HTTP; adapters call production logic and never reproduce it. Use deterministic
  candidate sets or supplied random samples for comparisons, and separate seeded distribution tests for
  random choices. Extend the existing config_yaml fuzz target and committed corpus for every newly accepted
  config form; unsupported keys still fail by full path. Keep the implementation, adapters and tests within
  600 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/cache-cost-routing/**
  - tools/oracle/src/router_probes/cache_cost_routing/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/cache_cost_routing.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L4427-L4472
  why: Cache choice integration and decision stamp.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/README.md#L74-L108
  why: Supported surface and prediction restrictions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/cache_aware_routing.py#L318-L343
  why: B075 prediction API and bounded failure recovery.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the cache_cost_routing prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(cache_cost_routing)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/cache-cost-routing/disabled-no-prediction.yaml
- tools/oracle/cases/routing/cache-cost-routing/warmer-higher-tier-cheaper.yaml
- tools/oracle/cases/routing/cache-cost-routing/equal-cost-no-change.yaml
- tools/oracle/cases/routing/cache-cost-routing/never-lower-required-tier.yaml
- tools/oracle/cases/routing/cache-cost-routing/unknown-prices-keep-route.yaml
- tools/oracle/cases/routing/cache-cost-routing/prediction-timeout.yaml
- tools/oracle/cases/routing/cache-cost-routing/context-fit-rechecked.yaml
- tools/oracle/cases/routing/cache-cost-routing/unsupported-shape-no-adjustment.yaml
deviations: []
out_of_scope:
- Implementing the cache prediction engine or prewarming provider caches.
pitfalls:
- Do not call count_tokens at all when no eligible warm alternative exists.
- This dependency is B075, not the generic response cache B125.
- The architect must expose B075's prediction service through the server adapter before dispatch.
review_level: security
budget:
  max_changed_lines: 600
  max_new_expects: 0
