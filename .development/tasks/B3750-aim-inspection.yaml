    why: The build_inspection_messages, apply_redacted_messages_back, has_non_string_content and is_string_batch_input functions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_guardrail.py
    why: The CustomGuardrail base class and its timeout field.
dod:
  - text: Request anonymization with role projection matches LiteLLM on the analysis request sent to /fw/v1/analyze.
    proof: [oracle]
  - text: Block action on input raises 400 invalid_request_error with the detection message.
    proof: [oracle]
  - text: Anonymize action applies redacted messages to both messages and input fields of the request.
    proof: [aim-tests]
  - text: Multimodal input with anonymize action and non-string content raises 400 instead of silently dropping audio/images.
    proof: [aim-tests]
  - text: Output anonymization redacts a single response message or returns detection_message on block.
    proof: [aim-tests]
  - text: Websocket output streaming reads verified_chunk, yields them as ModelResponseStream, handles blocking_message
      and cancels the sender when Aim stops sending chunks.
    proof: [aim-tests]
  - text: Batch-size validation rejects anonymize action when redacted message count does not match inspected input count.
    proof: [aim-tests]
  - text: Configuration loads api_key (required, AIM_API_KEY env), api_base (default https://api.aim.security, AIM_API_BASE env),
      and inspect_embeddings (default false).
    proof: [aim-tests, config-load]
checks:
  optional: []
  commands:
    - id: aim-tests
      why: the aim guardrail tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails -p betterlite-server --no-tests=fail -E 'test(/aim_guardrail/)'
    - id: config-load
      why: the AIM configuration does not load from files or environment
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/aim.*config/)'
oracle_cases:
  - tools/oracle/cases/guardrails/aim/pre-call-analysis-success.yaml
  - tools/oracle/cases/guardrails/aim/role-projection.yaml
  - tools/oracle/cases/guardrails/aim/block-action.yaml
  - tools/oracle/cases/guardrails/aim/anonymize-action.yaml
  - tools/oracle/cases/guardrails/aim/anonymize-multimodal-rejection.yaml
  - tools/oracle/cases/guardrails/aim/output-block-action.yaml
  - tools/oracle/cases/guardrails/aim/output-anonymize-action.yaml
  - tools/oracle/cases/guardrails/aim/output-streaming-verified-chunks.yaml
  - tools/oracle/cases/guardrails/aim/output-streaming-blocking-message.yaml
  - tools/oracle/cases/guardrails/aim/missing-api-key.yaml
deviations:
  - what: AIM configuration returns detection_message with betterlite's own wording, not LiteLLM's.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status and code unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/aim/aim.py#L213-L229
out_of_scope:
  - Lifecycle hook entry points (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook wrapper logic);
    B107 orchestrates when AIM guardrails are invoked.
  - The threshold-based decision whether to run inspection on a particular request; B219 and other tasks handle that.
  - Other guardrail providers (Akto, Cisco, etc.); each gets its own task.
pitfalls:
  - Role projection must map any role outside {system, user, assistant} to user, not drop the message or error.
  - apply_redacted_messages_back must write to both messages and input fields because Responses API reads from input.
  - Multimodal requests with anonymize action and non-string content must raise 400, not silently drop parts.
  - Websocket streaming sender task must be canceled if Aim stops sending verified chunks, to prevent background
    leaks.
  - Configuration api_base must handle both http:// and https:// prefixes when converting to ws:// or wss:// for
    websocket.
  - AIM_API_KEY must never be logged or shown in Debug output. Mark the field as SecretString and use it only in
    the Authorization header construction.
review_level: security
budget:
  max_changed_lines: 700
  max_new_expects: 1
