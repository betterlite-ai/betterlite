id: B3750
title: AIM inspection transport and redaction
description: >-
  Implement AIM guardrail's HTTP POST transport to /fw/v1/analyze, role projection for validation, request and output
  anonymization by applying redacted message batches, and websocket streaming for output inspection. Preserve batch-size
  validation (redacted count must match inspected message count) and multimodal rejection (anonymize action fails on
  non-text content unless the batch input is string-only, so text rewrites never silently drop audio/images).


  Configuration carries api_key (required, reads AIM_API_KEY), api_base (optional, default https://api.aim.security,
  reads AIM_API_BASE) and inspect_embeddings (boolean, default false, whether to send /embeddings input to Aim).
  HTTP headers include Authorization (Bearer token), x-aim-litellm-hook (pre_call, moderation, or output),
  x-aim-litellm-version (litellm version), x-aim-call-id (litellm_call_id if present), x-aim-user-email
  (from metadata.headers.x-aim-user-email if present) and x-aim-gateway-key-alias (key_alias if present).


  Role projection: OpenAI schema rejects bare tool/function roles without their required fields. Flatten the inspection
  message list and rewrite roles outside {system, user, assistant} to user so AIM validation succeeds. Required actions
  from /fw/v1/analyze are: monitor_action (log and continue), block_action (raise 400 invalid_request_error with
  detection_message), anonymize_action (apply redacted_chat.all_redacted_messages to the request, or on output return
  the single redacted message content). Validation error on malformed redacted response raises 400.


  Request anonymization calls apply_redacted_messages_back (from B3664) to write both messages and input fields,
  since Responses API calls read input. Output anonymization returns redacted message content or detection_message.
  Websocket forwarding sends inspection messages plus the output message to Aim's /fw/v1/analyze/stream, reads
  verified_chunk (yield as ModelResponseStream) or blocking_message (raise StreamingCallbackError), and cancels
  the sender task if Aim stops sending verified chunks.
