    why: The complete AimGuardrail class and all method implementations.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/aim.py
    why: The AimGuardrailConfigModel with api_key, api_base and inspect_embeddings fields.
