id: B332
title: Capability forecasts and calibrated routing thresholds
description: Implement the capability classifier over B331's bounded call engine with the pinned prompt
  and strict forecast schema. Parse bare, fenced and prose-wrapped JSON, validate rule/boundary consistency,
  and compute threshold and optional calibrated probability before selecting a configured efficient/capable
  tier. Use a maintained Decimal math implementation for logit/sigmoid; the architect must approve the
  precision and numeric comparison contract before dispatch. Add exact model-selection boundary cases
  and independently compare diagnostic probabilities within an explicitly justified precision rule. Use
  the existing Rust crate boundaries from B004 and B008; integrate through the server when the provider
  dispatcher or callbacks live in another core crate. This task's source slices are the linked ranges,
  not a port of their Python classes. Add the listed oracle cases and the matching adapters to B301's
  component runner where state is not observable over HTTP; adapters call production logic and never reproduce
  it. Use deterministic candidate sets or supplied random samples for comparisons, and separate seeded
  distribution tests for random choices. Extend the existing config_yaml fuzz target and committed corpus
  for every newly accepted config form; unsupported keys still fail by full path. Add a cargo-fuzz target
  capability_reply under crates/betterlite-router/fuzz and a normal replays_the_capability_reply_corpus
  test using the production parser. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/capability-classifier/**
  - tools/oracle/src/router_probes/capability-classifier/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/capability_classifier.py
  - tools/oracle/litellm/probes/registry.py
  - Cargo.toml
  - deny.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/capability_classifier.py#L17-L227
  why: Prompt, forecast validation, epsilon threshold and JSON extraction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L605-L675
  why: Calibration and capability config.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2046-L2104
  why: Fail-closed capable-tier outcome.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2502-L2569
  why: Structured call and calibration path.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(capability_classifier)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/capability_reply.rs && test -n "$(ls -A crates/betterlite-router/fuzz/corpus/capability_reply)"
      && cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_capability_reply_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/capability-classifier/supported-threshold.yaml
- tools/oracle/cases/routing/capability-classifier/uncertain-and-unmatched-step.yaml
- tools/oracle/cases/routing/capability-classifier/unsupported-two-steps.yaml
- tools/oracle/cases/routing/capability-classifier/inclusive-epsilon-boundary.yaml
- tools/oracle/cases/routing/capability-classifier/invalid-rule-boundary.yaml
- tools/oracle/cases/routing/capability-classifier/fenced-prose-json.yaml
- tools/oracle/cases/routing/capability-classifier/calibration-clips-endpoints.yaml
- tools/oracle/cases/routing/capability-classifier/malformed-fails-capable.yaml
- tools/oracle/cases/routing/capability-classifier/redact-crux-retain-derived-signals.yaml
deviations: []
out_of_scope:
- LLM-v2's two-solver forecast and profile presets.
- Training or fitting calibration parameters.
pitfalls:
- A malformed forecast fails toward the capable tier rather than the heuristic default.
- No tolerance may hide a different selected tier.
- The pinned prompt is MIT material in this checkout; no proprietary classifier source is needed.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
