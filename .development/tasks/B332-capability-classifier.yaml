id: B332
title: Capability forecasts and calibrated routing thresholds
description: 'Compose B394 CapabilityForecast parsing/calibration with B331 calls and B330 context. Implement
  capability_llm dispatch, efficient/capable tier validation, prompt-policy conflicts and capable-tier
  failure outcomes. Retain redaction and caller cost attribution; exact selection is checked even when
  diagnostic probabilities have a declared tolerance. Configuration boundary keys introduced or consumed
  here: capability_classifier_config. Pinned declaration defaults: capability_classifier_config=None.
  Resolve env values once in betterlite-config, never in router code. Implement the owned native service
  in crates/betterlite-router/src/capability_classifier.rs. Add ProbeOperation::CapabilityClassifier in tools/oracle/src/router_probes/mod.rs
  and the corresponding B332 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/config.py:
  ComplexityRouterConfig._validate_capability_classifier_config (L1636-L1646), ComplexityRouterConfig._validate_capability_classifier_tiers
  (L1660-L1681), ComplexityRouterConfig._validate_capability_classifier_prompt_policy (L1684-L1704). Implement
  these behaviors through the typed Rust services above; synchronous facades and structural accessors
  reuse the same primitive instead of separate ports.'
