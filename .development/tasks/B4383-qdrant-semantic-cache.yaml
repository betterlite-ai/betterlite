id: B4383
title: Initialize Qdrant collections and search scoped semantic responses
description: >-
  Build Qdrant semantic-cache collection initialization, payload indexing and synchronous/asynchronous reads and writes through betterlite-http.
  The Qdrant transport replaces LiteLLM's httpx client and all direct HTTP calls. Collection name and similarity_threshold are required constructor arguments.
  Resolve os.environ/ values before URL fallback: explicit qdrant_api_base wins, then QDRANT_URL, then QDRANT_API_BASE; api_key looks for explicit value, then QDRANT_API_KEY.
  Collection size defaults to 1536 (QDRANT_VECTOR_SIZE) and quantile to 0.99 (QDRANT_SCALAR_QUANTILE); the config task owns these keys.
  Preserve binary/scalar/product quantization choices, warn and skip on index creation failures, and preserve the existing-collection path's lack of quantization validation.
  Key filtering and post-search payload validation both enforce isolation: every hit with matching cache key proceeds, old payloads without the cache_key field miss with zero similarity, and mismatched keys miss the same way.
  Searches use one result with payloads, quantization rescore with 3.0 oversampling, and equality meets the threshold.
  Reads propagate operation errors; batch operations propagate gather errors without Redis's broad error-to-miss conversion.
  Copy the async httpx client lookup from B173 and UUID generation from B198 instead of using LiteLLM's functions.
  Config loading replaces environment lookups at the constructor boundary using B002's lookup and secret resolution (os.environ/ prefix only).
scope:
