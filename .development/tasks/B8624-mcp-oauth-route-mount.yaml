  - tools/oracle/cases/http/mcp-wiring-oauth/authorization-server-root.yaml
deviations: []
out_of_scope:
  - "Route behavior: B4678, B7321 and B7972."
  - "The browser routes and /v1/mcp/server/oauth: B8702. The BYOK consent routes GET and POST /v1/mcp/oauth/authorize: B4677 through B1100's routes/mcp_byok_consent."
  - "The /mcp transport and its path routes: B8592 and the B136 server.py work."
pitfalls:
  - B4677 and B4678 must share one AuthCodeStore; two instances make every BYOK token request fail with an unknown code.
  - These routes go through mount_public; mounting them inside the auth layers turns every discovery request from an MCP client into a 401.
  - A first-segment path parameter named anything but mcp_server_name makes matchit refuse the merge at startup.
  - Compute well_known_root_suffix once and pass it to both B4678 and B7972, so their paths agree.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
