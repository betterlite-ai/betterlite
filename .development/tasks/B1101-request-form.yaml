- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/http_parsing_utils.py#L89-L159
  why: Own numeric annotation selection and coercion, including Python's accepted integer/float strings and unchanged invalid values.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/http_parsing_utils.py#L390-L617
  why: Own upload sizing, ordered repeated fields, file tuple conversion, method/media dispatch and bracket metadata conflict handling.
dod:
- text: >-
    repeated_plain_last_wins decodes a form with model=first followed by model=last and returns model="last".
    A single upload a.txt with bytes "abc" and MIME text/plain becomes [("a.txt","abc","text/plain")]. A list
    beginning with an upload reads each entry in order; ["plain",upload] remains unchanged, while [upload,"plain"]
    fails on the second entry's missing read method after reading the first. Empty lists stay empty.
  proof:
  - case-repeated-plain-last-wins
  - oracle
  - helper-python
- text: >-
    array_form_preserves_order sends timestamp_granularities[]=word then timestamp_granularities[]=segment;
    the result is timestamp_granularities=["word","segment"]. Plain x=leaf followed by x[]=child fails when
    appending to a scalar, while x[]=child followed by x=leaf returns x="leaf".
  proof:
  - case-array-form-preserves-order
  - oracle
  - helper-python
- text: >-
    numeric_form_coercion selects int, float and their optional/qualified forms, excluding bool, Literal[3], list[int]
    and int|float. Int inputs " 7 ", "+3", "1_000" and "١٢" become 7, 3, 1000 and 12; "3.5", "nan", "inf"
    stay strings. Float inputs " 7 ", "+3", "1_000", "1e2", "nan", "inf" and "-Infinity" become 7, 3, 1000,
    100, NaN, positive infinity and negative infinity. "bad" and nonstring true are unchanged; unknown fields are untouched.
  proof:
  - case-numeric-form-coercion
  - oracle
  - helper-python
- text: >-
    nested_form_metadata maps litellm_metadata[a][b]=v to {a:{b:"v"}}. Ordered a=leaf then a/b=deep returns {a:"leaf"}
    with a warning; reverse order returns {a:"leaf"} without warning. litellm_metadata[a]]] becomes a,
    litellm_metadata[litellm_metadata[a]] also becomes a, and litellm_metadata[a][] creates {a:{"":"v"}}.
    litellm_metadata[]=v and UploadFile metadata entries are dropped with warnings; other prefixes are ignored.
    An explicit prefix metadata[ parses metadata[team]=t into {team:"t"}; empty input returns {}.
  proof:
  - case-nested-form-metadata
  - oracle
  - helper-python
- text: >-
    upload_size_unset checks size=None and size=1048576 with no configured model limit: both return true and
    metadata.file_size_in_mb is respectively 0 and 1. Existing metadata.team="t" survives. Router absent,
    model outside router_model_names, deployment absent and limit=None skip model-limit enforcement. A deployment
    lookup exception logs an error and returns true. These inputs remain below the native 16 MiB safety cap.
  proof:
  - case-upload-size-unset
  - oracle
  - helper-python
- text: >-
    request_body_dispatch sends POST application/json with {"x":1}, POST application/x-www-form-urlencoded with
    x=1, and POST multipart/form-data with boundary=test carrying x=1; results are {x:1}, {x:"1"}, {x:"1"}.
    POST text/plain raises ValueError with source message "Unsupported content type: text/plain"; absent content-type
    raises the same class with an empty suffix. GET, DELETE and PUT return {} even with JSON bytes present.
  proof: [case-body-dispatch, oracle, helper-python]
- text: loads_settings distinguishes omitted/null max_file_size_mb from a configured limit of 1 MiB and replays those configs.
  proof:
  - config-tests
  - config-corpus
- text: decode_request_form receives both Content-Type bytes and body bytes from HTTP, fuzz and replay, including mismatched boundaries.
  proof:
  - parser-corpus
- text: The request_form operation compares independent native and pinned coercion results and ordered upload reads.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: This branch adds the listed form scenarios; the complete server/core/config behavior suite runs alongside parity.
  proof:
  - new-oracle-cases
  - oracle
  - helper-python
  - helper-corpus
  - behavior-tests
- text: >-
    compatibility_deviations loads max_file_size_mb=1 and a matching router model: sizes 1048575 and 1048576 pass,
    1048577 returns 400 bad_request/param=file/code="400". Open-source LiteLLM without premium rejects all three
    with that same tuple and premium-related wording. With the model limit unset, 16777216 bytes pass and 16777217
    return native 413 invalid_request_error/param=file/code=request_too_large; LiteLLM has no such default cap.
  proof:
  - deviation-tests
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail
      -E 'test(/^api::request_form::/) - test(/::replays_corpus$/)'
  - id: case-repeated-plain-last-wins
    why: the repeated-plain-last-wins behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::repeated_plain_last_wins($|::)/)'
  - id: case-array-form-preserves-order
    why: the array-form-preserves-order behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::array_form_preserves_order($|::)/)'
  - id: case-numeric-form-coercion
    why: the numeric-form-coercion behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::numeric_form_coercion($|::)/)'
  - id: case-nested-form-metadata
    why: the nested-form-metadata behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::nested_form_metadata($|::)/)'
  - id: case-upload-size-unset
    why: the upload-size-premium-parity behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::upload_size_unset($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::request_form::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/request-form-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: case-body-dispatch
    why: non-POST bodies are read or unsupported POST media types are silently accepted
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::request_body_dispatch($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/request_form)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/request_form.rs && grep -qF "decode_request_form" crates/betterlite-server/fuzz/fuzz_targets/request_form.rs
      && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/request_form.py && uv run --locked --project tools/oracle/litellm ruff check
      tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/request_form-*)"
      && grep -qE "^[[:space:]]+request_form:" tools/oracle/fuzz/corpus/helper_case/request_form-* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/request-form)"
  - id: deviation-tests
    why: the shared upload-size policy differs without an explicit native assertion
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::compatibility_deviations($|::)/)'
