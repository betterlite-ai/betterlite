deviations:
- what: 'Configured model_list[].litellm_params.max_file_size_mb applies to every transcription caller: within-limit
    uploads proceed, oversize returns 400 bad_request, param file, code 400. LiteLLM rejects even within-limit uploads
    without premium with that same status/type/param/code and premium-related wording. When unset, betterlite caps
    uploads at 16 MiB and returns 413 invalid_request_error/file/request_too_large.'
  why: The architect removed paid-tier checks; bounded-inputs requires a finite default.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/http_parsing_utils.py#L390-L450
