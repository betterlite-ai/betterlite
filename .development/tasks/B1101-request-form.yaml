checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail
      -E 'test(/^api::request_form::/) - test(/::replays_corpus$/)'
  - id: case-repeated-plain-last-wins
    why: the repeated-plain-last-wins behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::repeated_plain_last_wins($|::)/)'
  - id: case-array-form-preserves-order
    why: the array-form-preserves-order behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::array_form_preserves_order($|::)/)'
  - id: case-numeric-form-coercion
    why: the numeric-form-coercion behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::numeric_form_coercion($|::)/)'
  - id: case-nested-form-metadata
    why: the nested-form-metadata behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::nested_form_metadata($|::)/)'
  - id: case-upload-size-unset
    why: the upload-size-premium-parity behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::upload_size_unset($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::request_form::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/request-form-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/request_form)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/request_form.rs && grep -qF "decode_request_form" crates/betterlite-server/fuzz/fuzz_targets/request_form.rs
      && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/request_form.py && uv run --locked --project tools/oracle/litellm ruff check
      tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/request_form-*)"
      && grep -qE "^[[:space:]]+request_form:" tools/oracle/fuzz/corpus/helper_case/request_form-* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/request-form)"
  - id: deviation-tests
    why: the shared upload-size policy differs without an explicit native assertion
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_form::tests::compatibility_deviations($|::)/)'
