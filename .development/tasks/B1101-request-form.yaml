id: B1101
title: Shared multipart and form extraction
description: >-
  Implement ordered multipart/form extraction, numeric field coercion, nested metadata extraction and bounded upload
  reads. Return FormParts with filenames, MIME and repeated fields intact until LiteLLM chooses the last plain value
  or a key[] list.
  Numeric eligibility unwraps Required/NotRequired and optional annotations, but excludes bool, Literal, containers
  and unions containing more than one non-null type. Coercion leaves unparseable strings and nonstrings unchanged.
  Match Python scalar syntax, including surrounding whitespace, a leading plus, underscores, Unicode decimal digits
  and float nan/inf. Carry non-finite values as explicit typed variants until the consumer chooses its wire format;
  helper comparison projects them as nan, positive_infinity or negative_infinity rather than invalid JSON numbers.

  check_file_size_under_limit always writes metadata.file_size_in_mb using bytes/(1024*1024), treating absent file.size
  as zero. Consult B844 get_deployment_by_model_group_name only if a router exists and model belongs to router_model_names.
  A missing deployment/limit does not apply a model limit; a lookup exception logs an error and also falls through.
  A configured limit allows equality and rejects only greater size. Preserve existing metadata keys.

  get_request_body dispatches only POST: JSON uses B1100, form uses get_form_data, other media types raise ValueError
  with source message "Unsupported content type: <content-type>"; every non-POST returns {} without reading bytes.
  convert_upload_files_to_file_data wraps one upload in a one-element list. A list is treated as uploads only when
  its first item has read; mixed lists therefore depend on the first item, not a scan for any upload.

  Nested metadata defaults to prefix litellm_metadata[. Ignore other keys; skip UploadFile values with a warning.
  Remove every occurrence of the prefix, strip all trailing ] characters, then split on ][. Empty first components
  warn and drop. A deeper path encountered after a scalar parent warns and drops; a later scalar leaf overwrites
  an earlier subtree silently. Preserve input order, intermediate empty components and non-string values.


  Put multipart decoding in betterlite-server::api::request_form and decoded-field coercion in
  betterlite-core::api::request_form. FormParts keeps field order and bounded upload bytes; B1087 ApiLimits bounds
  the body, headers and part count before allocation. Resolve model upload limits through the config/router interfaces.


  File-size errors carry HTTP 400, type=bad_request, param=file and serialized code="400". The source messages
  distinguish "Tried setting max_file_size_mb for /audio/transcriptions" from "File size is too large";
  betterlite uses its own wording while retaining those fields. The premium-only rejection is removed as decided below.


  The DoD names the tests in api::request_form::tests. Exercise multipart decoding in server tests and numeric/metadata
  policy in core tests; keep replays_corpus separate so corpus-only coverage cannot satisfy behavior checks.


  In betterlite-config, loads_settings parses an omitted max_file_size_mb as None, explicit null as None and
  model_list[].litellm_params.max_file_size_mb=1 as a one-MiB model limit. Assert the key is absent from the
  unsupported-key report and that the loaded value reaches file-size checking. Add these three configurations
  to B002's config_yaml corpus, using its production loader.


  The production external-byte decoder is betterlite-server::api::request_form::decode_request_form(bytes: &[u8],
  content_type: &[u8], limits: &ApiLimits), for Content-Type boundary plus bounded multipart/urlencoded bytes. Place its implementation
  in crates/betterlite-server/src/api/request_form.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-server/fuzz/fuzz_targets/request_form.rs passes arbitrary bounded bytes to that exact decoder;
  api::request_form::tests::replays_corpus replays newly committed seeds through the same function. Fuzz inputs begin
  with a two-byte big-endian header length, followed by exactly that many Content-Type bytes, then body bytes;
  truncated headers are rejected by the harness before calling the decoder. Mutate the multipart boundary in both
  locations independently, including quoted, missing and mismatched boundaries. Transform-only
  helpers reuse the already decoded records.


  Register HelperCall::RequestForm in the Rust helper dispatcher and request_form in Python dispatch.py.
  call: {request_form: ...} selects the case operation. Python calls the pinned parsing/coercion functions;
  Rust calls the server/core modules. Upload fixtures expose bounded byte reads and ordered warnings for comparison.
  HTTP authentication and route error mapping remain in the consuming image, audio and file route tasks.


  Callable ownership: litellm/proxy/common_utils/http_parsing_utils.py: _unqualified (L89-L94); litellm/proxy/common_utils/http_parsing_utils.py:
  _union_members (L97-L102); litellm/proxy/common_utils/http_parsing_utils.py: _numeric_form_type (L105-L115); litellm/proxy/common_utils/http_parsing_utils.py:
  numeric_form_fields (L118-L131); litellm/proxy/common_utils/http_parsing_utils.py: _numeric_form_value (L134-L140);
  litellm/proxy/common_utils/http_parsing_utils.py: coerce_numeric_form_fields (L143-L157); litellm/proxy/common_utils/http_parsing_utils.py:
  check_file_size_under_limit (L390-L450); litellm/proxy/common_utils/http_parsing_utils.py: get_form_data (L453-L467);
  litellm/proxy/common_utils/http_parsing_utils.py: convert_upload_files_to_file_data (L470-L512); litellm/proxy/common_utils/http_parsing_utils.py:
  get_request_body (L515-L527); litellm/proxy/common_utils/http_parsing_utils.py: extract_nested_form_metadata (L530-L615).
  All eleven functions are owned whole; the Rust annotation policy is a closed set of native numeric field descriptors.


  Sizing: 169 owned nonblank/non-comment/non-docstring Python lines (237 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 189 implementation,
  160 behavior tests, 110 oracle fixtures, 100 Rust/Python adapters, 70 decoder fuzz/replay, 40 config tests/seeds
  and 38 wiring; 707 total within the 730-line cap. The estimate includes tests and adapters, not just production
  code.


  B003 supplies request/error types, B900 multipart fixtures, B171 helper transport, B1087 bounded input policy,
  B1100 cached JSON/media-type handling, B844 model-group deployment lookup and B002 config loading.


  compatibility_deviations exercises the transcription upload-size differences below; ordinary helper parity uses
  an unset configured limit and a body below the native safety cap.
