id: B1101
title: Shared multipart and form extraction
description: >-
  Implement ordered multipart/form extraction, numeric field coercion, nested metadata extraction and bounded upload
  reads. Return FormParts with filenames, MIME and repeated fields intact until LiteLLM chooses the last plain value
  or a key[] list.


  Implement crates/betterlite-server/src/api/request_form.rs, crates/betterlite-core/src/api/request_form.rs. Use
  RequestFormInput and RequestFormResult with typed nested records; inject only the clock, repositories, transports
  and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient
  environment or duplicate credential resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): http_parsing_utils.py:436 code=status.HTTP_400_BAD_REQUEST, type='bad_request', param='file';
  http_parsing_utils.py:443 code=status.HTTP_400_BAD_REQUEST, type='bad_request', param='file'. Compare the actual
  source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions repeated_plain_last_wins, array_form_preserves_order, numeric_form_coercion,
  nested_form_metadata, upload_size_unset under api::request_form::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): model_list[].litellm_params.max_file_size_mb
  defaults to None; source premium gate is deliberately removed, source oversize 400 bad_request param file. No
  environment reads occur outside betterlite-config. Test api::request_form::tests::loads_settings uses the production
  Config loader and an injected environment map, with a named rstest case for every key above, explicit override,
  unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key
  report; a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder
  rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-server::api::request_form::decode_request_form(bytes: &[u8],
  limits: &ApiLimits), for Content-Type boundary plus bounded multipart/urlencoded bytes. Place its implementation
  in crates/betterlite-server/src/api/request_form.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-server/fuzz/fuzz_targets/request_form.rs passes arbitrary bounded bytes to that exact decoder;
  api::request_form::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  Register HelperCall::RequestForm in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {request_form: <typed input>}; operation is
  only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and Python
  invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered diagnostics/effects,
  never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/common_utils/http_parsing_utils.py: _unqualified (L89-L94); litellm/proxy/common_utils/http_parsing_utils.py:
  _union_members (L97-L102); litellm/proxy/common_utils/http_parsing_utils.py: _numeric_form_type (L105-L115); litellm/proxy/common_utils/http_parsing_utils.py:
  numeric_form_fields (L118-L131); litellm/proxy/common_utils/http_parsing_utils.py: _numeric_form_value (L134-L140);
  litellm/proxy/common_utils/http_parsing_utils.py: coerce_numeric_form_fields (L143-L157); litellm/proxy/common_utils/http_parsing_utils.py:
  check_file_size_under_limit (L390-L450); litellm/proxy/common_utils/http_parsing_utils.py: get_form_data (L453-L467);
  litellm/proxy/common_utils/http_parsing_utils.py: convert_upload_files_to_file_data (L470-L512); litellm/proxy/common_utils/http_parsing_utils.py:
  get_request_body (L515-L527); litellm/proxy/common_utils/http_parsing_utils.py: extract_nested_form_metadata (L530-L615).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 169 owned nonblank/non-comment/non-docstring Python lines (237 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 189 implementation,
  94 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 38 wiring; 564 total within the 570-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B900 (Multipart oracle), B171 (Direct
  helper oracle and URL path encoding), B1087 (Api boundaries), B1100 (Shared request body decoding), B002 (Load
  LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.


  compatibility_deviations exercises the transcription upload-size differences below; ordinary helper parity uses
  an unset configured limit and a body below the native safety cap.
