- B082, B083 and B1032 own image, transcription and file-upload HTTP routing and authentication.
pitfalls:
- 'The oracle helper for this task is pre-registered as request_form in the server group. Replace the stub Op in tools/oracle/src/helpers/server/request_form.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/request_form.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Metadata conflicts are order-sensitive; sorting form keys changes which subtree survives and whether a warning is emitted.
- Python float("nan") succeeds; leaving the original string is not equivalent to carrying a non-finite numeric value.
- max_file_size_mb is checked with > after converting bytes to MiB; an equal-sized file is allowed once the premium gate is removed.
review_level: security
budget:
  max_changed_lines: 730
  max_new_expects: 1
