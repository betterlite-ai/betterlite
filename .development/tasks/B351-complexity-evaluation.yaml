id: B351
title: Pinned complexity evaluation corpus and bundled presets
description: 'Package the pinned auto-router presets as typed embedded data that the later public-endpoint
  task can serve, and port the source evaluation dataset and report computation into oracle tooling. Reuse
  the production classifier and profile catalog; validate every embedded preset with the actual config
  loader. Retain the source attribution and version, and compare exact source classifications separately
  from its acceptable-tier accuracy score. Keep evaluation commands under tools/oracle, never invoke Python
  from the serving process. Implement the owned native service in crates/betterlite-router/src/complexity_evaluation.rs.
  Add ProbeOperation::ComplexityEvaluation in tools/oracle/src/router_probes/mod.rs and the corresponding B351 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/evals/eval_complexity_router.py:
  run_eval (L234-L308), main (L311-L325). Implement these behaviors through the typed Rust services above;
  synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
scope:
  paths:
  - crates/betterlite-router/src/complexity_evaluation.rs
  - crates/betterlite-router/src/complexity_evaluation/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/mod/**
  - crates/betterlite-server/src/routing/complexity_evaluation.rs
  - crates/betterlite-server/src/routing/complexity_evaluation/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/strategy/**
  - crates/betterlite-router/src/context.rs
  - crates/betterlite-router/src/context/**
  - tools/oracle/src/router_probes/complexity_evaluation.rs
  - tools/oracle/src/router_probes/complexity_evaluation/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/complexity_evaluation.py
  - tools/oracle/cases/routing/complexity-evaluation/**
  - tools/oracle/helpers/b351.py
  - tools/oracle/helpers/b351/**
  - tools/oracle/src/helpers/router/b351.rs
  - tools/oracle/src/helpers/router/b351/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/evals/eval_complexity_router.py#L26-L329
  why: Pinned prompt dataset, acceptable-tier scoring and result thresholds.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/autorouter_presets.json#L1-L141
  why: Bundled configurations to validate and expose as typed data.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_endpoints.py#L498-L572
  why: The later public-endpoint owner's catalog consumer.
dod:
- text: Write tests named complexity_evaluation_behaviors and complexity_evaluation_boundaries under complexity_evaluation::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - complexity-evaluation-behaviors
  - complexity-evaluation-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: complexity-evaluation-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::complexity_evaluation_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: complexity-evaluation-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::complexity_evaluation_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/complexity_evaluation.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/complexity_evaluation.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/complexity-evaluation/all-pinned-eval-prompts.yaml
- tools/oracle/cases/routing/complexity-evaluation/acceptable-tier-versus-exact-match.yaml
- tools/oracle/cases/routing/complexity-evaluation/evaluation-failure-report.yaml
- tools/oracle/cases/routing/complexity-evaluation/system-prompt-invariance.yaml
- tools/oracle/cases/routing/complexity-evaluation/all-bundled-presets-parse.yaml
- tools/oracle/cases/routing/complexity-evaluation/unknown-preset-id.yaml
- tools/oracle/cases/routing/complexity-evaluation/pinned-fuse-catalog.yaml
deviations: []
out_of_scope:
- Remote preset fetching and public HTTP handlers, owned by the public-endpoint backlog entry.
- Training or improving classifier accuracy against the pin.
- litellm/router_strategy/complexity_router/evals/__init__.py has no functions at the pin; its exports/data
  are accounted for by the owning native module, with no Python wrapper port.
pitfalls:
- The reference evaluator allows acceptable tiers for its accuracy report; that must not weaken exact
  cross-implementation oracle comparison.
- Do not replace shipped model names with newer recommendations or fetch remote presets.
- The CLI evaluator belongs to tooling; no serving-process subprocess is permitted.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
