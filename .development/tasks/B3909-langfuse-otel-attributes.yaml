oracle_cases: []

deviations:
  - what: >-
      Unresolved dependencies (add_metadata_from_header from B3905, safe_set_attribute implementation,
      safe_json_dumps from B192) are injected or called directly. add_metadata_from_header may fail to import
      or execute, and in that case metadata enrichment is skipped silently.
    why: >-
      These functions are owned by B3905 and B192, which provide the metadata projection and JSON serialization
      layers. B3909 calls them; when unavailable, header enrichment fails gracefully and the base metadata dict
      remains unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_otel.py#L72-L81

out_of_scope:
  - OpenTelemetry logger initialization and lifecycle, owned by B3903.
  - Langfuse tracing setup and export channel, owned by B3903 and B3901.
  - Trace and observation ID resolution primitives, owned by B3901.
  - Content and metadata projections (extraction, transformation, session detection), owned by B3905.
  - Generation assembly and span finalization, owned by B3906.
  - Langfuse OTEL configuration, authorization headers and config building, owned by B3910.
  - Dynamic OTEL header/config construction for team-scoped logging, owned by B3910.

pitfalls:
  - 'LangfuseLLMObsOTELAttributes inherits from BaseLLMObsOTELAttributes; set_messages and set_response_output_messages
    override abstract methods with @staticmethod and @override decorators, matching the base class protocol.'
  - 'get_output_content_by_type returns empty string ("") for None input, not None itself; the serial form of None
    does not appear in OTEL attribute values.'
  - 'Embedding responses match both call_type=="embedding" and isinstance(response_obj, EmbeddingResponse); either
    condition suffices to return "embedding-output".'
  - 'Response output Pydantic model serialization uses model_dump_json(), not json.dumps(model.model_dump()), to
    preserve the model''s JSON encoding scheme.'
  - 'Tool call arguments are parsed from the function''s arguments field with json.loads on string, or used as-is
    if already a dict; JSONDecodeError falls back to empty object {}.'
  - 'Output items (reasoning, message, function_call) are extracted as a list and only set the attribute if the
    list is non-empty; empty list triggers no attribute write.'
  - 'Metadata version field checks trace_version first, then version; only one is used, not both as separate
    fields.'
  - 'Complex metadata values (lists, dicts) are JSON-serialized before setting as OTEL attributes; the entire
    value is JSON-stringified, not field-by-field.'
  - 'Trace ID hex normalization (remove dashes: trace_id.replace("-", "")) applies only to trace_id, not to
    other ID fields like parent_observation_id or generation_id.'
  - 'safe_set_attribute is a utility that safely handles OTEL span attribute setting; exceptions in setting an
    individual attribute do not stop the process, and subsequent attributes are still set.'
  - 'The fallback for add_metadata_from_header import failure uses a bare except clause, catching all exceptions
    and silently continuing; header enrichment simply does not happen in that case.'

