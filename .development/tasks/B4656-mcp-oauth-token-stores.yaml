dod:
  - text: >-
      OAuthToken is a frozen dataclass holding access_token, expires_at (epoch or None), refresh_token (optional),
      scopes (tuple of strings), and identity_binding_proof (optional); repr masks secrets (access_token and refresh_token).
    proof: [token-types, token-tests]
  - text: >-
      TokenStoreUnavailable is raised when the backing store is unreachable; distinct from None for "not authorized".
      OAuthTokenStore and InvalidatableOAuthTokenStore protocols define fetch and invalidate methods with correct signatures.
    proof: [store-protocols, token-tests]
  - text: >-
      InMemoryTokenCacheBackend is a per-process cache with bounded size (default 4096), wall-clock TTL, and FIFO eviction
      (oldest entry evicted on overflow); never evicts on hit and respects TTL expiry.
    proof: [cache-backend-tests, cache-eviction]
  - text: >-
      CachedOAuthTokenStore caches positive tokens only, serving cached tokens while unexpired (minus expiry_skew_seconds),
      falling through on miss, never caching misses, and propagating TokenStoreUnavailable without caching.
    proof: [cached-store-tests, cache-expiry, cache-misses]
  - text: >-
      OAuthTokenCacheCodec encodes tokens with identity proof under "litellm-bound-oauth-v1:" prefix as JSON, or bearer-only;
      decodes legacy entries without proof and returns None on validation error or missing blob.
    proof: [codec-tests, codec-encoding, codec-legacy]
  - text: >-
      DualCacheTokenCacheBackend degrades cache and codec failures to safe values: cache misses on read errors, no-ops on set/delete errors,
      and returns None on undecryptable entries with debug logging.
    proof: [dual-cache-tests, dual-cache-degradation]
  - text: >-
      RefreshCoordinator protocol and InProcessRefreshCoordinator implement per-(user, server) single-flight:
      first caller refreshes, concurrent callers await the same in-flight task and share its result.
    proof: [refresh-coordinator-tests, refresh-singleflight]
  - text: >-
      RefreshingTokenStore proactively refreshes near-expiry tokens (within expiry_skew_seconds) via injected TokenRefresher
      and RefreshCoordinator, returning None when refresh fails, and preserving unexpired tokens.
    proof: [refresh-store-tests, refresh-expiry]
  - text: >-
      V2PerUserTokenStore reads persisted authorization_code credential via injected CredentialReader and returns typed OAuthToken,
      with helper functions parsing ISO expiry to epoch, validating scopes and binding proof, and handling missing/malformed fields.
    proof: [v2-store-tests, v2-parsing]
  - text: >-
      PresentedOAuthTokenStore serves one in-hand token for preview calls, ignoring (user_id, server_id) keys.
    proof: [preview-store-tests]
  - text: >-
      DualCacheTokenCacheBackend.delete() catches exceptions (e.g. cache unavailable or delete failed),
      logs a debug message, and completes as a no-op without propagating the error.
    proof: [dual-cache-tests, dual-cache-delete-failure]
  - text: >-
      DualCacheTokenCacheBackend.set() skips writing when ttl_seconds <= 0, returning immediately without caching.
    proof: [dual-cache-tests, dual-cache-set-ttl-zero]
  - text: >-
      The key_prefix literal "mcp:per_user_token:" is preserved exactly for cross-replica cutover compatibility with v1 cache entries.
    proof: [dual-cache-tests, dual-cache-key-prefix]
  - text: >-
      New oracle helper operation for OAuth token stores integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: token-types
      why: OAuthToken structure or identity_binding_proof field is missing.
      run: grep -qE 'struct OAuthToken|dataclass.*OAuthToken' crates/betterlite-server/src/mcp/outbound_credentials.rs && grep -qE 'identity_binding_proof|binding_proof' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: store-protocols
      why: OAuthTokenStore or InvalidatableOAuthTokenStore protocol is missing.
      run: grep -qE 'trait OAuthTokenStore|pub trait OAuthTokenStore' crates/betterlite-server/src/mcp/outbound_credentials.rs && grep -qE 'trait InvalidatableOAuthTokenStore' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: cache-backend-tests
      why: InMemoryTokenCacheBackend tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*cache.*backend/) - test(/replays_corpus$/)'
    - id: cached-store-tests
      why: CachedOAuthTokenStore tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*cached/) - test(/replays_corpus$/)'
    - id: token-tests
      why: Core token type and store protocol tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*token/) - test(/replays_corpus$/)'
    - id: codec-tests
      why: OAuthTokenCacheCodec encoding/decoding tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*codec/) - test(/replays_corpus$/)'
    - id: dual-cache-tests
      why: DualCacheTokenCacheBackend tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*dual/) - test(/replays_corpus$/)'
    - id: refresh-coordinator-tests
      why: RefreshCoordinator and InProcessRefreshCoordinator tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*coordinator/) - test(/replays_corpus$/)'
    - id: refresh-store-tests
      why: RefreshingTokenStore tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*refresh/) - test(/replays_corpus$/)'
    - id: v2-store-tests
      why: V2PerUserTokenStore tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*v2/) - test(/replays_corpus$/)'
    - id: preview-store-tests
      why: PresentedOAuthTokenStore tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*presented/) - test(/replays_corpus$/)'
    - id: cache-eviction
      why: InMemoryTokenCacheBackend does not evict oldest entry on overflow.
      run: grep -qE 'max_size|overflow|evict' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: cache-expiry
      why: CachedOAuthTokenStore does not respect expiry_skew_seconds.
      run: grep -qE 'expiry_skew|skew_seconds' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: cache-misses
      why: CachedOAuthTokenStore does not implement in-process cache using InMemoryTokenCacheBackend or does not handle misses correctly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*cached.*never.*miss/)'
    - id: codec-encoding
      why: OAuthTokenCacheCodec does not encode bound entries with "litellm-bound-oauth-v1:" prefix.
      run: grep -qE 'litellm-bound-oauth-v1|bound.*prefix' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: codec-legacy
      why: OAuthTokenCacheCodec does not decode legacy bearer-only entries.
      run: grep -qE 'legacy|bearer.*only' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: dual-cache-degradation
      why: DualCacheTokenCacheBackend does not catch and log cache/codec exceptions.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*dual.*degrade/)'
    - id: dual-cache-delete-failure
      why: DualCacheTokenCacheBackend.delete() does not catch exceptions and degrade to a no-op.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*dual.*delete.*failure/)'
    - id: dual-cache-set-ttl-zero
      why: DualCacheTokenCacheBackend.set() does not skip writing when ttl_seconds <= 0.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::.*dual.*ttl.*zero/)'
    - id: dual-cache-key-prefix
      why: DualCacheTokenCacheBackend does not use exact key_prefix "mcp:per_user_token:" for cross-replica compatibility.
      run: grep -qE 'mcp:per_user_token:' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: refresh-singleflight
      why: InProcessRefreshCoordinator does not implement per-key single-flight.
      run: grep -qE 'inflight|in_flight|single.flight' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: refresh-expiry
      why: RefreshingTokenStore does not check expiry_skew_seconds before refreshing.
      run: grep -qE 'is_expired|expiry_skew' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: v2-parsing
      why: V2PerUserTokenStore does not validate credential fields or convert ISO expiry to epoch.
      run: grep -qE 'iso_to_epoch|fromisoformat|timestamp' crates/betterlite-server/src/mcp/outbound_credentials.rs
    - id: helper-python
      why: The oracle helper adapter is missing or Python type checking fails.
      run: test -f tools/oracle/helpers/b4656.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/oauth_token_stores-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

