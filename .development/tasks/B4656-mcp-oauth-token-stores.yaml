id: B4656
title: MCP OAuth token stores and cache codecs
description: >-
  Build OAuth token store abstractions and implementations in betterlite-server::mcp::outbound_credentials.
  Implement core token types (OAuthToken with access token, expiry, refresh token, scopes, and identity binding proof),
  per-user token store protocols, cache backends (in-process and Redis), codec for encrypted token serialization,
  token refresh coordination for single-flight per (user, server) pair, and caching + refresh layers that wrap the inner store.

  OAuthToken is a frozen dataclass holding access_token (string), expires_at (epoch seconds or None), refresh_token
  (optional), scopes (tuple of strings), and identity_binding_proof (optional); its repr masks secrets.
  TokenStoreUnavailable is raised when the backing store is unreachable (distinct from None for "not authorized").
  OAuthTokenStore is a protocol for per-user token lookup by (user_id, server_id); InvalidatableOAuthTokenStore
  extends it with an invalidate method for dropping cached entries after reauth.

  TokenRefresher is a protocol that mints a fresh token from an expired one and persists it, taking (user_id, server_id, token)
  and returning a fresh token or None. TokenCacheBackend is a protocol for storage under (user_id, server_id) with TTL.
  InMemoryTokenCacheBackend is the default per-process backend (bounded dict with wall-clock TTL, evicts oldest on overflow).
  CachedOAuthTokenStore wraps an inner store with expiry-aware caching: caches positive tokens only (never misses), serves
  cached tokens while unexpired (minus expiry_skew_seconds), falls through to inner store on miss, and propagates TokenStoreUnavailable.

  OAuthTokenCacheCodec holds encrypt/decrypt callables and encodes tokens (with identity proof or bearer-only),
  decoding legacy entries without proof. Bound entries have "litellm-bound-oauth-v1:" prefix and contain access_token + proof
  as JSON; unbound entries are bare encrypted access tokens. A missing or undecryptable entry reads as None.
  DualCacheTokenCacheBackend implements TokenCacheBackend using an AsyncCache (Redis-like) and OAuthTokenCacheCodec,
  degrading cache/codec failures to safe values (cache misses on read, no-ops on write/delete).

  RefreshCoordinator is a protocol ensuring one refresh runs per (user_id, server_id) at a time, with run() accepting
  a refresh callable and a reread callable (for cross-replica losers to re-read the persisted token).
  InProcessRefreshCoordinator implements in-process single-flight: first caller per key refreshes, concurrent callers
  await the same in-flight task and share its result. RefreshingTokenStore wraps an inner store and proactively refreshes
  near-expiry tokens via the injected TokenRefresher and RefreshCoordinator, returning None when refresh fails (triggering a challenge).

  V2PerUserTokenStore reads the user's persisted authorization_code credential via an injected CredentialReader,
  validating the decoded payload at the boundary and returning a typed OAuthToken. Helper functions _iso_to_epoch,
  _to_scopes, and _to_oauth_token parse and validate credential fields. Refresh and caching are owned by wrapping layers.
  PresentedOAuthTokenStore serves one in-hand token for preview calls (no DB, no cache).

