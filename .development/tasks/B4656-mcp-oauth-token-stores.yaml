deviations:
  - what: >-
      Token caching in betterlite uses the same in-process InMemoryTokenCacheBackend with FIFO eviction as LiteLLM,
      and supports cross-replica caching through a pluggable AsyncCache (Redis) via DualCacheTokenCacheBackend.
    why: >-
      This preserves LiteLLM's default single-process behavior while allowing deployments to inject a shared cache.
      The interface is owned by this task; a later task will wire in the Redis implementation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/oauth_token_store.py#L114-L143
  - what: >-
      RefreshingTokenStore composes under CachedOAuthTokenStore, not above it as in LiteLLM.
      This ensures refresh is only triggered when caching is in place, avoiding multiple concurrent refreshes
      before the first completes and is cached.
    why: >-
      Explicit composition order reduces race windows. A near-expiry token is refreshed once per cache miss,
      and concurrent misses during refresh are serialized by the RefreshCoordinator.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/oauth_token_store.py#L243-L302

out_of_scope:
  - Token invalidation triggers (reauth, revocation, 401 response) are owned by the arm that handles OAuth exchanges.
  - Refresh token validation and the specific per-mode refresher (authorization_code, client_credentials, token_exchange) belong to those mode tasks.
  - Credential reading from the database (V2PerUserTokenStore's read_credential implementation) belongs to a later persistence task.
  - AsyncCache Redis implementation and encryption/decryption callables belong to infrastructure tasks.
  - Configuration loading of token cache TTLs and eviction policies belongs to the manager/config layer.

pitfalls:
  - >-
    The oauth_token_stores helper operation exercises token store protocols (OAuthTokenStore, InvalidatableOAuthTokenStore),
    cache backends (InMemoryTokenCacheBackend, DualCacheTokenCacheBackend with async cache injection), and codec encode/decode
    with bound and legacy entries; replace the stub Op in tools/oracle/src/helpers/server/b4656.rs and implement
    the Python adapter in tools/oracle/helpers/b4656.py.
  - >-
    OAuthToken.repr masks secrets (access_token and refresh_token show as *** and a boolean has_refresh_token), but the fields remain plain strings internally so no SecretStr wrapper is needed.
  - >-
    TokenStoreUnavailable is distinct from None; a TokenStoreUnavailable exception is never cached and always propagates, while None is the "not authorized" answer that never gets cached.
  - >-
    InMemoryTokenCacheBackend evicts the oldest entry (first inserted) by FIFO order when max_size is reached and a new insert arrives; the eviction happens before the insert.
  - >-
    CachedOAuthTokenStore caches a token under its compute TTL (expires_at - skew - now, or default_ttl_seconds if no expiry) and re-reads the inner store on every miss; a token written after OAuth is visible immediately on every replica because misses are never cached.
  - >-
    DualCacheTokenCacheBackend degrades all cache and codec exceptions to safe fallback values (cache misses, no-ops) and logs debug messages; it does not re-raise or propagate them as errors.
  - >-
    OAuthTokenCacheCodec's encode always encrypts the result; a decode that gets an undecryptable blob (decryption returns None) returns None (a cache miss).
  - >-
    RefreshCoordinator.run() is called with two callables: refresh (the first caller refreshes) and reread (concurrent/losing callers re-read the persisted token); in-process, reread is unused and all callers share the refresh result.
  - >-
    RefreshingTokenStore._is_expired checks (expires_at is not None) and (clock() >= expires_at - expiry_skew), not >, so a token exactly at expiry - skew triggers refresh.
  - >-
    V2PerUserTokenStore._iso_to_epoch treats a timezone-naive ISO string as UTC before converting to epoch, matching LiteLLM's db.py behavior; a malformed ISO string returns None.
  - >-
    _to_scopes filters a list/tuple to strings only, returning an empty tuple if raw is not a list/tuple or contains no strings.
  - >-
    _to_oauth_token returns None if access_token is missing or not a string; other fields default gracefully (refresh_token defaults to None, expires_at to None, scopes to empty tuple).
  - >-
    PresentedOAuthTokenStore is not an async interface; its fetch method is sync but the seam expects async, so the task may need to wrap it as a state adapter when called.
  - >-
    DualCacheTokenCacheBackend.set() returns early without caching when ttl_seconds <= 0; this skip-write behavior is
    intentional to avoid persisting already-expired tokens, and the test case dual-cache-set-ttl-zero covers it.
  - >-
    The exact key_prefix literal "mcp:per_user_token:" must be preserved in DualCacheTokenCacheBackend._key() for cross-replica
    cutover compatibility with v1 cache entries; v2 implementations must use this prefix unchanged even if the token store changes.

review_level: security
budget:
