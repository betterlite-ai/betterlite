checks:
  optional:
  - mutants
  commands:
  - id: case-oidc-form-grant
    why: POST form fields client_id, grant_type=client_credentials, scope, client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer
      and client_assertion=<resolved oidc token>; use default scope https://cognitiveservices.azure.com/.default
      only for None, retaining an explicit empty string.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_oidc_form_grant$/)'
  - id: case-authority-tenant-path
    why: Authority comes from AZURE_AUTHORITY_HOST with default https://login.microsoftonline.com; build <authority>/<tenant>/oauth2/v2.0/token
      literally without stripping a trailing slash. Client/tenant use truthy explicit values then AZURE_CLIENT_ID/AZURE_TENANT_ID;
      empty environment values survive the None-only validation.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_authority_tenant_path$/)'
  - id: case-missing-client-tenant
    why: Missing client or tenant None raises AzureOpenAIError 422 message AZURE_CLIENT_ID and AZURE_TENANT_ID must
      be set before secret resolution or transport.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_missing_client_tenant$/)'
  - id: case-unresolved-oidc-token
    why: Resolve the complete azure_ad_token string through B129 get_secret_str; None raises AzureOpenAIError 401
      message OIDC token could not be retrieved from secret manager.; an empty resolved token is sent.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_unresolved_oidc_token$/)'
  - id: case-missing-access-token
    why: A missing/null access_token raises AzureOpenAIError 422 message Azure AD Token access_token not returned;
      check it before expires_in.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_missing_access_token$/)'
  - id: case-missing-expires-in
    why: A missing/null expires_in raises AzureOpenAIError 422 message Azure AD Token expires_in not returned; zero
      is passed as the cache TTL, not rejected.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_missing_expires_in$/)'
  - id: case-cached-unexpired-token
    why: Return any non-None cache value before HTTP. The source JSON cache identity includes azure_client_id, azure_tenant_id,
      azure_authority_host and resolved oidc_token; Rust additionally includes scope as the declared deviation.
      Scope isolation is a standalone Rust test, not a matching Python oracle case.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_cached_unexpired_token$/)'
  - id: case-expired-token-refresh
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-oidc-exchange/expired-token-refresh.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_expired_token_refresh$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_oidc_exchange.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_oidc_exchange*")"
      && grep -lq 'azure_oidc_exchange' tools/oracle/fuzz/corpus/helper_case/azure_oidc_exchange* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_oidc_exchange$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_oidc_exchange)"
      && grep -q 'decode_azure_oidc_token' crates/betterlite-azure/fuzz/fuzz_targets/azure_oidc_exchange.rs && cargo
      nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_oidc_exchange_corpus$/)'
  - id: config-azure-authority-host
    why: The AZURE_AUTHORITY_HOST setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_oidc_exchange_config_cases::case_[0-9]+_loads_azure_authority_host$/)'
      && grep -lq 'AZURE_AUTHORITY_HOST' crates/betterlite-config/fuzz/corpus/config_yaml/azure_oidc_exchange*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_oidc_exchange_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/azure_oidc_exchange*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_oidc_exchange_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_oidc_exchange_secret_safe_failure$/)'
  - id: case-oidc-http-failure
    why: Any status other than 200, including other 2xx statuses, raises AzureOpenAIError preserving status and
      response.text as message. Invalid JSON on 200 propagates from the JSON decoder.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_oidc_http_failure$/)'
