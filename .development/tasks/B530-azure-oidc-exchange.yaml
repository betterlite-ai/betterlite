id: B530
title: Azure federated OIDC token exchange
description: >-
  Implement AzureOidcExchange with injected configured authority, secret resolver, clock and cache. AZURE_AUTHORITY_HOST
  defaults to https://login.microsoftonline.com; resolve the caller deployment tenant/client ids, scope and oidc/
  reference through config/secret-manager seams. Keep client assertion and access_token secret, key the cache by
  authority/tenant/client/scope/assertion identity, and retain the source expiry and missing-token-field errors.
  All token URLs derive from operator configuration, never request payloads.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  get_azure_ad_token_from_oidc L199-L284.


  The OIDC grant is a lower-level input to B529 selection; it depends on the shared Azure error/credential records
  from B673, never on the composed credential resolver.


  Implement crates/betterlite-azure/src/oidc_exchange.rs with adjacent tests under oidc_exchange/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_oidc_exchange in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function oidc_exchange_cases in betterlite-azure with these exact named cases (one per oracle file):
  oidc_form_grant, authority_tenant_path, missing_client_tenant, unresolved_oidc_token, missing_access_token, missing_expires_in,
  cached_unexpired_token, expired_token_refresh. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and
  captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_oidc_exchange* using HelperCase: kind:
  helper and the externally tagged azure_oidc_exchange variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_oidc_exchange that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_azure_oidc_token consumes OAuth token response bytes in crates/betterlite-azure/src/oidc_exchange.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_oidc_exchange.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_oidc_exchange.
  The adjacent test replays_the_azure_oidc_exchange_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/oidc_exchange.rs
  and its loader wiring: AZURE_AUTHORITY_HOST. Module-level settings enter litellm_settings; deployment settings
  enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above and in
  the linked branches; existing key owners remain unchanged. Write config rstest azure_oidc_exchange_config_cases
  with named cases loads_azure_authority_host, plus rejects_unrelated_key. Each loads case calls the real config
  loader with that key and asserts the resolved value, default, precedence and secret redaction where applicable.
  Seed B002 config_yaml with new azure_oidc_exchange* files for every key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_oidc_exchange_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_oidc_exchange_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 72 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 105 production lines, 154 behavior/config-test lines, 87 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 28 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 454 planned, 475 maximum changed lines.
