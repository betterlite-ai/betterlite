  commands:
  - id: case-oidc-form-grant
    why: The oidc-form-grant behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::oidc_exchange_cases::case_[0-9]+_oidc_form_grant$/)'
  - id: case-authority-tenant-path
    why: The authority-tenant-path behavior is missing or differs from its pinned fixture.
