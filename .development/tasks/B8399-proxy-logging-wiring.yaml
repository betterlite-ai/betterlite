    why: ProxyLogging construction, startup, update_values, proxy hooks, callback init and update_request_status.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/__init__.py
    why: PROXY_HOOKS and get_proxy_hook.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py
    why: Where ProxyLogging is created and startup_event is called.
dod:
  - text: ProxyLogging starts with LiteLLM's defaults and update_values registers SlackAlerting by the alerting rules.
    proof: [wiring-tests]
  - text: startup_event starts the daily report, hanging request and deprecation tasks once each, and init_callbacks registers the open-source proxy hooks, skipping database hooks without a database.
    proof: [wiring-tests]
  - text: The adapters and ports forward to the parts that own each behavior.
    proof: [wiring-tests]
  - text: Pre, during and post call guardrail blocks and the applied guardrails header match LiteLLM through the booted proxy.
    proof: [oracle]
  - text: >-
      adapters.rs implements B8464's McpGuardrailHooks: pre_call_hook forwards to B8393's PreCallHook::run, during_call_hook to B8392's during_call_hook, and the payload conversions to B8401.
    proof: [wiring-tests]
checks:
  optional: []
  commands:
    - id: wiring-tests
      why: ProxyLogging state, startup, callback init or a port is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^proxy_logging::/)'
oracle_cases:
  - tools/oracle/cases/guardrails/proxy-logging/pre-call-block.yaml
  - tools/oracle/cases/guardrails/proxy-logging/during-call-block.yaml
  - tools/oracle/cases/guardrails/proxy-logging/post-call-block.yaml
  - tools/oracle/cases/guardrails/proxy-logging/applied-guardrails-header.yaml
deviations:
  - what: No email logger is created, so email budget alerts never send.
    why: The email loggers ship only in litellm_enterprise; open-source LiteLLM leaves email_logging_instance None too.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L1215-L1220
out_of_scope:
  - "Hook behavior: B8390 to B8395 and B8401. The streaming wrapper: B6370."
  - "Enterprise proxy hooks (ENTERPRISE_PROXY_HOOKS, managed_files) and email loggers: not built."
pitfalls:
  - startup_event and update_values can both schedule the deprecation check, so the started flag must be checked in one place.
  - The SlackAlerting callback is added only for daily_reports, outage_alerts or region_outage_alerts, but the response time callback for any slack or ms_teams alerting.
  - init_callbacks replaces string callbacks in place, keeping their position in the list, since hook order follows the list.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
