id: B8399
title: Assemble ProxyLogging and wire its hooks into the proxy
description: >-
  The parts B8390 to B8395 and B8401 build ProxyLogging's pieces behind traits. This task builds the one `ProxyLogging` value the server holds, implements those traits over the real callbacks, router, caches and alerting, and hands the hook services to the tasks that asked for them. It also adds the HTTP oracle cases the parts left to it. Code goes in crates/betterlite-server/src/proxy_logging.rs and proxy_logging/ (state.rs, startup.rs, adapters.rs, ports.rs, tests.rs), following the composition style of .development/tasks/B8157-self-hosted-dispatch.yaml.

  state.rs. `ProxyLogging::new(user_api_key_cache, premium_user)` holds what LiteLLM's __init__ sets (L1194-L1232): an internal usage DualCache with a 1 second in-memory TTL (`InternalUsageCache` is a forwarder over it and is not a separate type), the cache control check, alerting None, alerting_threshold 300, alert_types DEFAULT_ALERT_TYPES, alert_to_webhook_url None, the SlackAlerting value (B4021), service logging, the spend update writer, an empty proxy hook map, B8390's `CallbackCache`, and the three started flags. No email logger: `_get_email_logger_class` needs litellm_enterprise. `update_values` (L1294-L1347) stores each given value, and when any alerting value changed schedules the deprecation check, updates SlackAlerting, and for slack or ms_teams alerting registers SlackAlerting as a callback when daily_reports, outage_alerts or region_outage_alerts is an alert type, and its response_taking_too_long_callback as a success callback; a Redis cache goes to the usage cache, the spend update buffer and the pod lock manager. ProxyLogging also takes guardrail callbacks from a live source added after construction: `add_guardrail_callbacks(&self, source: Arc<dyn GuardrailCallbackSource>)`, where `GuardrailCallbackSource` is a Send and Sync trait declared in this module with one method returning a boxed future of the B8390 GuardrailCallback trait objects held at that moment. ProxyLogging asks the source every time it lists its callbacks and lists the result next to the logging callbacks; it never keeps a startup snapshot, because the database poll and the management routes add and remove guardrails at runtime (B8613 passes B8666's GuardrailClasses::callbacks() through it, so this module never names a B8666 type), and public getters return the internal usage DualCache, alerting, alert_types, the alerting args and the SlackAlerting value for B8656.

  startup.rs. `startup_event(router, redis_usage_cache)` (L1234-L1292) in LiteLLM's order: SlackAlerting gets the router, update_values with the Redis cache, the scheduled daily report when daily_reports is an alert type and not yet started, the hanging request check when llm_requests_hanging is, then the deprecation check when alerting is set and it has not started. `init_callbacks` (L1349-L1425): register each `PROXY_HOOKS` entry from litellm/proxy/hooks/__init__.py (parallel_request_limiter, cache_control_check over B3705's `hooks::cache_control_permissions::CacheControlPermissions` with its Forbidden error answered as a 403, the max iterations and max budget per session limiters, sensitive_data_routing and the rest of the open-source map, not ENTERPRISE_PROXY_HOOKS), skipping one that needs the database when there is none with the debug line "Skipping proxy hook %s: it requires a database and no prisma client is configured"; register service logging; resolve each string callback through the B8740 `LoggerResolver` init_callbacks takes as its first argument, register each by-name proxy hook of its second argument `hooks: Vec<(String, Arc<dyn ProxyCallback>)>` at that name's place in the callbacks list (B8742 calls init_callbacks from app::callbacks::start before the listener opens; startup_event and the lifespan never call it), stop startup with the RegistryError when a configured name is not available, and register each resolved logger as `CallbackSink::Logger` in B189's registry for the success, failure and async lists; route string success and failure callbacks to their event. `get_proxy_hook(name)` reads the map.

  adapters.rs. Implement B8390's `ProxyCallback` and `GuardrailCallback` over B189's registered callbacks, B5471's guardrail settings, B3665's gate and B3666's marker; B6370's `CallbackSet` and `PipelineSource` over B8390 and B8391 (plus B8393's handle_pipeline_result); B8391's `DeploymentGuardrails`, B8392's `GuardrailBalancer` and B8398's `ListingRouter` over the router; B8393's `PromptTemplates` over B4058; B8394's `A2aText`; B8393's `AlertHooks` and B8395's ports over SlackAlerting and the logging object; B8396's `HealthFailureReporter` and `ProxyStateSink`. Pass B3680's `MetadataGuardrailRecorder` (LiteLLM's add_guardrail_to_applied_guardrails_header) wherever a hook takes an `AppliedGuardrailRecorder`.

  ports.rs. The services other tasks inject: the ProxyLogging hooks service B084 and B1126 take (pre_call, post_call_failure), the guardrails-only pre-call port B1023 calls with `guardrails_only` and `has_pre_call_guardrails`, the failure hook port B941 records, and the disconnect release B2400 selects. Each forwards to the part that owns the behavior.

  HTTP oracle cases in tools/oracle/cases/guardrails/proxy-logging/ boot the proxy with `generic_guardrail_api` guardrails (B3771) against the mock provider: a pre_call guardrail that blocks a chat request (status, error type and message), a during_call guardrail that blocks, a post_call guardrail that blocks the response, and a passing guardrail whose name shows in the x-litellm-applied-guardrails response header.
