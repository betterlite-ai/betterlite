id: B990
title: Claude gateway settings
description: >-
  Serve managed Claude Code gateway settings and accepted OTLP metrics/logs/traces endpoints. Add typed general_settings.claude_code_gateway_managed_settings
  with the source absent behavior, reuse the gateway enable/auth dependencies and accept opaque bounded OTLP bodies
  without inventing a telemetry exporter.


  Implement crates/betterlite-server/src/api/claude_gateway_settings.rs, crates/betterlite-core/src/api/claude_gateway_settings.rs.
  Use ClaudeGatewaySettingsInput and ClaudeGatewaySettingsResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /claude_code_gateway/managed/settings; POST /claude_code_gateway/v1/metrics;
  POST /claude_code_gateway/v1/logs; POST /claude_code_gateway/v1/traces. Each alias is exercised through the booted
  proxy. Every route factory is mounted once; a family composer mounts its child factories without re-registering
  their methods/paths.


  Route input projections: request.headers.If-None-Match (absent None).


  Write adjacent tests.rs behavior functions managed_settings_present, managed_settings_absent, gateway_auth_required,
  otlp_body_accepted, route_aliases, auth_missing, auth_invalid under api::claude_gateway_settings::tests. Each
  named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/anthropic_endpoints/gateway_endpoints.py: managed_settings (L356-L370); litellm/proxy/anthropic_endpoints/gateway_endpoints.py:
  _skip_otlp_body_parsing (L373-L374); litellm/proxy/anthropic_endpoints/gateway_endpoints.py: _accept_otlp (L380-L382);
  litellm/proxy/anthropic_endpoints/gateway_endpoints.py: otlp_metrics (L386-L387); litellm/proxy/anthropic_endpoints/gateway_endpoints.py:
  otlp_logs (L391-L392); litellm/proxy/anthropic_endpoints/gateway_endpoints.py: otlp_traces (L396-L397). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 29 owned nonblank/non-comment/non-docstring Python lines (29 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 49 implementation,
  82 behavior tests, 84 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 253 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B171 (Direct helper oracle and URL
  path encoding), B1087 (Api boundaries), B1132 (Claude gateway enable and settings policy), B732 (Typed authentication
  principals and grant resolution), B855 (Authenticated request admission and budget handoff), B756 (Authentication
  header selection and mode dispatch), B1100 (Shared request body decoding), B003 (HTTP server, health routes and
  master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces and Postgres test
  fixture). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
