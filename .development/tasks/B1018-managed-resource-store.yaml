checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::/)
      - test(/::replays_corpus$/)'
  - id: case-legacy-user-owner
    why: the legacy-user-owner behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::tests::legacy_user_owner($|::)/)'
  - id: case-scope-precedence
    why: the scope-precedence behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::tests::scope_precedence($|::)/)'
  - id: case-duplicate-key-scope
    why: the duplicate-key-scope behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::tests::duplicate_key_scope($|::)/)'
  - id: case-identityless-no-shared-owner
    why: the identityless-no-shared-owner behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::tests::identityless_no_shared_owner($|::)/)'
  - id: case-none-context-bypass
    why: the none-context-bypass behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::tests::none_context_bypass($|::)/)'
  - id: case-proxy-admin-bypass
    why: the proxy-admin-bypass behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::tests::proxy_admin_bypass($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/managed_resource_store.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/managed_resource_store-*)"
      && grep -qE "^[[:space:]]+managed_resource_store:" tools/oracle/fuzz/corpus/helper_case/managed_resource_store-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/managed-resource-store)"
