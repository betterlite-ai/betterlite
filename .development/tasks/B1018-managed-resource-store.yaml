- 'litellm/llms/base_llm/managed_resources/base_managed_resource.py: all BaseManagedResource methods, protocol declarations
  and creation/mapping template bodies have no MIT subclass/caller at the pin. B726 owns the real managed-row repositories;
  B1017 owns isolation.py predicates. Do not construct an enterprise-equivalent managed_files hook.'
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- A missing principal bypasses this low-level predicate, but an identity-less authenticated principal has no owner
  scopes; HTTP authentication remains in the calling route.
- Only PROXY_ADMIN gets the role bypass; a raw user ID remains valid for rows written before prefixed scopes.
