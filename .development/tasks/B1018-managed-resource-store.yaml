id: B1018
title: MIT resource owner compatibility
description: >-
  Port all four resource_ownership.py functions, including the nested ordered deduplication helper,
  to betterlite-core::api::managed_resource_store. They supply ownership scopes to MIT containers,
  skills and transcription logging. Accept B732 principals, return typed scopes or a boolean, and
  perform no database work. Raw user ids remain valid for older rows. Scope order is raw user,
  user:, team:, org:, key:api_key, key:token; primary ownership is the first nonempty identity in
  user/team/org/api_key/token order. Missing and empty identities do not invent a shared owner.

  The managed_resources package initializer only reexports B1016 codecs and BaseManagedResource.
  Its abstract base has no MIT subclass at this pin. Preserve the absent managed_files hook in
  route callers; this task must not create enterprise-equivalent lifecycle or storage operations.
  The active implementation is 72 nonblank, non-comment lines in resource_ownership.py; allow 90
  Rust lines, 120 native assertions, 80 cases, 80 adapter lines and 30 wiring lines, 400 total.

  Put the named tests in api::managed_resource_store::tests. The B171 adapter calls the pinned
  predicates directly using UserAPIKeyAuth, and registers call: {managed_resource_store: ...} in
  both dispatchers. Values and ordered scopes are the oracle result; no route or parser is added.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/managed_resource_store.rs
  - crates/betterlite-core/src/api/managed_resource_store/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/managed_resource_store.rs
  - tools/oracle/src/helpers/core_ops/managed_resource_store/**
  - tools/oracle/helpers/managed_resource_store.py
  - tools/oracle/helpers/managed_resource_store/**
  - tools/oracle/fuzz/corpus/helper_case/managed_resource_store-*
  - tools/oracle/cases/helpers/managed-resource-store/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/resource_ownership.py#L6-L92
  why: Owns the admin predicate, ordered scope collection, primary scope selection and owner comparison.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/managed_resources/__init__.py#L1-L43
  why: Package exports introduce no lifecycle implementation; codecs are B1016 and the abstract base is inactive without enterprise.
dod:
- text: >-
    ordered_owner_scopes gives user_id=u, team_id=t, org_id=o, api_key=a, token=b and expects
    [u, user:u, team:t, org:o, key:a, key:b], primary=u, and access=true for each of those six
    owners but false for user:v. Empty identity fields are omitted from this list.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    primary_scope_fallback removes user, then team, then org, then api_key from that principal
    and expects team:t, org:o, key:a, key:b in turn. Removing token too returns null and [].
    duplicate_key_scopes sets api_key=token=a and expects only one key:a; user_id=user:u also
    retains the raw user:u before the distinct user:user:u scope.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    missing_owner_context contrasts principal=null (is_proxy_admin=false, scopes=[], primary=null,
    access=true even for owner=null) with an authenticated identity-less internal_user (same
    empty scopes, but access=false for null, empty and foreign owners). A non-admin identified
    principal also gets false for owner=null.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    admin_role_boundary supplies enum and string proxy_admin and expects is_proxy_admin=true and
    access=true to an unrelated or null owner. proxy_admin_viewer and internal_user get false
    absent a matching scope; a view-only principal may still access its own raw or prefixed user id.
  proof: [behavior-tests, oracle, helper-python]
- text: Ownership helpers have new independently executed fixtures and an externally tagged parser seed.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: owner-scope order or bypass policy is untested
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_store::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: the owner predicate adapter cannot run independently
    run: test -f tools/oracle/helpers/managed_resource_store.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: no added managed_resource_store operation reaches the helper decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/managed_resource_store-*)" && grep -qE '^[[:space:]]+managed_resource_store:' tools/oracle/fuzz/corpus/helper_case/managed_resource_store-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: owner compatibility adds no oracle inputs
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/managed-resource-store)"
oracle_cases:
- tools/oracle/cases/helpers/managed-resource-store/ordered-owner-scopes.yaml
- tools/oracle/cases/helpers/managed-resource-store/primary-scope-fallback.yaml
- tools/oracle/cases/helpers/managed-resource-store/duplicate-key-scopes.yaml
- tools/oracle/cases/helpers/managed-resource-store/missing-owner-context.yaml
- tools/oracle/cases/helpers/managed-resource-store/admin-role-boundary.yaml
deviations: []
out_of_scope:
- >-
  base_managed_resource.py's protocols and every BaseManagedResource method (constructor, table/type
  properties, format/create/store/get/delete/access/mapping/filter/list methods) have no MIT
  subclass/caller at the pin. Do not instantiate that abstract template or emulate managed_files.
- B1016 owns the utility functions reexported by managed_resources/__init__.py; B158-B161 own Python package exports.
- B1017 owns isolation.py, whose token-first identity and admin-view policy intentionally differ.
pitfalls:
- 'The oracle helper for this task is pre-registered as managed_resource_store in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/managed_resource_store.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/managed_resource_store.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Missing principal bypass is a low-level caller contract, not an instruction to bypass HTTP authentication.
- api_key precedes token here; using isolation.py's token-first rule changes which existing rows a key can access.
- A raw user id is the primary scope even though the same principal also has a user-prefixed scope.
review_level: security
budget:
  max_changed_lines: 400
  max_new_expects: 0
