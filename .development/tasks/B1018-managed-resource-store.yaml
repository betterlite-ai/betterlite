id: B1018
title: MIT resource owner compatibility
description: >-
  Implement the live MIT resource_ownership.py predicates over B732 principal records. Retain raw legacy user IDs
  and ordered user:, team:, org:, key: scopes, deduplicating api_key/token collisions; choose primary user then
  team then org then api_key then token. Identity-less authenticated callers have no scopes; no-user context and
  PROXY_ADMIN retain their source bypass.


  BaseManagedResource.can_user_access_unified_resource_id, get_unified_resource_id, _resource_table and list_user_resources
  remain documented MIT templates: no MIT subclass/caller. Their paging contract is default 20, id > after, created_at
  descending, has_more when the page is full; do not activate new creation behavior to test them.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  user_can_access_resource_owner(None, authenticated_non_admin) is false, while user_api_key_dict=None is true.
  Read/cache storage remains B726; these predicates do not add transactions, rows or managed hook methods.


  Implement crates/betterlite-core/src/api/managed_resource_store.rs. Use ManagedResourceStoreInput and ManagedResourceStoreResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions legacy_user_owner, scope_precedence, duplicate_key_scope, identityless_no_shared_owner,
  none_context_bypass, proxy_admin_bypass under api::managed_resource_store::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ManagedResourceStore in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {managed_resource_store: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/common_utils/resource_ownership.py: is_proxy_admin (L6-L13); litellm/proxy/common_utils/resource_ownership.py:
  get_resource_owner_scopes (L16-L53); litellm/proxy/common_utils/resource_ownership.py: get_primary_resource_owner_scope
  (L56-L79); litellm/proxy/common_utils/resource_ownership.py: user_can_access_resource_owner (L82-L92). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 85 owned nonblank/non-comment/non-docstring Python lines (113 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 105 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 373 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B732 (Typed authentication principals and grant resolution), B171 (Direct helper oracle
  and URL path encoding), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
