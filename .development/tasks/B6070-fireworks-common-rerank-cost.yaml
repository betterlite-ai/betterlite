dod:
  - text: Key resolution, session affinity and the mixin header merge match LiteLLM.
    proof: [fw-common-tests, oracle, helper-python]
  - text: The embedding param list and copy rule match LiteLLM.
    proof: [fw-embedding-tests, oracle]
  - text: Base-model tiers and the three-step model info fallback give LiteLLM's names and costs.
    proof: [fw-cost-tests, oracle]
  - text: Rerank URL, params, headers, request body and response projection match LiteLLM.
    proof: [fw-rerank-tests, oracle]
  - text: The rerank decoder rejects over 1 MiB and malformed JSON with a typed error, and the corpus replays.
    proof: [fw-rerank-corpus]
  - text: The new helper cases replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: fw-common-tests
      why: Key order, session id rules or the header merge are missing.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_common::/)'
    - id: fw-embedding-tests
      why: The nomic-ai dimensions rule is missing.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_embedding::/)'
    - id: fw-cost-tests
      why: Tier names or the model info fallback order differ from LiteLLM.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_cost::/)'
    - id: fw-rerank-tests
      why: Rerank URL, params, headers, request or response rules are missing.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_rerank::/) - test(replays_the_rerank_response_corpus)'
    - id: fw-rerank-corpus
      why: The rerank decoder fuzz target or its replay corpus is missing or fails.
      run: >-
        test -f crates/betterlite-openai/fuzz/fuzz_targets/fireworks_ai_rerank_response.rs &&
        grep -q 'name = "fireworks_ai_rerank_response"' crates/betterlite-openai/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/fireworks_ai_rerank_response)" &&
        cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_rerank_response_corpus)'
    - id: helper-python
      why: The strict oracle adapter lint or type checks fail.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b6070.py)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Newly added cases are absent or do not replay.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/fireworks_ai_common-*")" &&
        grep -lE '^[[:space:]]+b6070:' tools/oracle/fuzz/corpus/helper_case/fireworks_ai_common-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/fireworks-ai-common/api-key-order.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/session-affinity.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/mixin-headers.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/embedding-params.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/base-model-tiers.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/cost-model-fallback.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/rerank-url.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/rerank-request-and-params.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/rerank-headers.yaml
  - tools/oracle/cases/helpers/fireworks-ai-common/rerank-response.yaml
deviations:
  - what: A missing query or documents in a rerank request, and a result without index or relevance_score, are typed errors that name the field, not bare ValueErrors.
    why: The compatibility rules reject a value the declared type cannot hold at the point it enters; the status follows B2454's mapping of request errors.
  - what: Cost reads the four tier limits from a FireworksPricingTiers value the caller built from env, and takes the billing instant as an argument.
    why: A provider leaf reads no env var or clock; the defaults and env names are LiteLLM's.
out_of_scope:
  - B1672 owns cache_pricing.py (with_default_cache_read_rate) and generic_cost_per_token; B2222 owns resolve_fireworks_resource_name; B2219 owns get_model_info.
  - FireworksAIEmbeddingConfig.is_fireworks_embedding_model has no caller at the pin, so it is not built and gets no case.
  - B1686 owns the fireworks_ai branch of the cost dispatch in litellm/cost_calculator.py and calls cost_per_token here.
  - B2454 owns the rerank HTTP execution and B1013 owns the rerank records and get_optional_rerank_params. B8310 wires these modules into dispatch.
  - The embedding request itself is OpenAI-shaped and goes through the generic embedding path; this task owns only the param list.
pitfalls:
  - 'A MoE name whose product is above the 176 limit does not stop in the MoE branch: "8x30b" (240) falls to the (\d+)b search, reads 30 and returns "fireworks-ai-above-16b", while "8x22b" (176) is still "fireworks-ai-56b-to-176b".'
  - The first (\d+)b match decides the tier, so "llama-v3-70b-instruct" uses 70 and a name with no digits before b returns "fireworks-ai-default".
  - cost_per_token tries the provider-qualified lookup first and the unqualified one second, so a failure of the first never reaches the caller.
  - The session affinity check on existing headers ignores case, but the rerank Authorization override matches the exact key "Authorization" only.
  - A rerank body whose "data" is an empty list falls to "results" and ends as an error when that is absent too.
  - The mixin lets a caller Authorization replace the Bearer value because the headers are spread after it.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
