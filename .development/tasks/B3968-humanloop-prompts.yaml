dod:
  - text: HumanLoopPromptManager caches prompts by ID only with configured TTL, defaulting to 60 seconds.
    proof: [humanloop-tests]
  - text: Cache miss triggers a GET request to /v5/prompts/{id} with X-Api-Key header.
    proof: [humanloop-tests]
  - text: >-
      A non-2xx response from /v5/prompts/{id} raises an Exception with the exact
      message "Error getting prompt from Humanloop: " followed by the response text.
    proof: [humanloop-tests]
  - text: >-
      The template field in the API response is branched by type (dict becomes a
      single-item list, list is used as-is, other types raise ValueError).
    proof: [humanloop-tests]
  - text: >-
      An invalid template type raises ValueError with the exact message
      "Invalid template message type: " followed by the type representation.
    proof: [humanloop-tests]
  - text: Prompt templates are compiled in place by substituting {{variable}} placeholders with values from prompt_variables.
    proof: [humanloop-tests]
  - text: Model is extracted from fetched prompt response with fallback to caller model; prompt_id is required and missing raises an error.
    proof: [humanloop-tests]
  - text: Optional parameters from the fetched response (those in litellm.OPENAI_CHAT_COMPLETION_PARAMS) override caller parameters.
    proof: [humanloop-tests]
  - text: When HUMANLOOP_API_KEY is missing or None, HumanloopLogger falls back to parent class behavior unchanged.
    proof: [humanloop-tests]
  - text: HumanloopLogger.get_chat_completion_prompt enforces prompt_id is required, merges fetched model and parameters, and ignores ignore_prompt_manager_* arguments.
    proof: [humanloop-tests]

checks:
  optional: []
  commands:
