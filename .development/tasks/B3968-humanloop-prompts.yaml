id: B3968
title: Humanloop prompt fetching caching and compilation
description: >-
  Build Humanloop prompt lookup, local caching, variable compilation and model/parameter
  replacement. Preserve the missing-key passthrough and the source's in-place template
  compilation semantics rather than treating this file as an event exporter.

  Implement HumanLoopPromptManager extending DualCache with a local memory-only cache,
  caching only by prompt ID with a configurable TTL (default 60 seconds). On cache miss,
  fetch prompts from the Humanloop API at /v5/prompts/{id} with X-Api-Key authentication.
  Compile prompts by substituting {{variable}} template placeholders with values from
  prompt_variables, mutating the message list in place. Extract model and optional
  parameters (those in litellm.OPENAI_CHAT_COMPLETION_PARAMS) from the fetched prompt
  response, applying them as overrides to caller parameters.

  Implement HumanloopLogger extending CustomLogger with get_chat_completion_prompt
  override. When no API key is configured, fall back to the parent class behavior
  unchanged. When an API key is present, fetch the prompt by ID, compile it with
  caller variables, and override model and optional parameters. The ignore_prompt_manager_*
  arguments are not honored by this override.

  Load HUMANLOOP_API_KEY (required to enable) from environment or dynamic_callback_params.
  Load HUMANLOOP_PROMPT_CACHE_TTL_SECONDS from config (default 60). Treat missing
  prompt_id as an error and missing API key as fallback to parent behavior.

