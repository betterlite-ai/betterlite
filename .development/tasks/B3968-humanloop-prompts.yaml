      why: the humanloop tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^humanloop_prompts::/) - test(/replays_the_/)'

oracle_cases: []

deviations:
  - what: Cache keys include only the prompt ID; no credential scoping or credential-based isolation of cached entries.
    why: The source caches by prompt ID only and mutates templates in place on compilation; credential-isolated cache keys or template copying would change behavior beyond the pin.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/humanloop.py#L35-L110

out_of_scope:
  - The full get_secret_str provider-backed secret resolution beyond B002's environment subset.
  - CustomLogger.get_chat_completion_prompt fallback dispatch beyond parent class behavior.
  - Prompt manager pre-hook and post-hook execution.

pitfalls:
  - "HTTP errors from the Humanloop API are caught as httpx.HTTPStatusError and re-raised as a generic Exception with the response text; the original status code is lost in the exception."
  - "The template field branching checks for dict or list only; any other JSON type (string, number, null) raises ValueError with the type representation."
  - Template compilation mutates the message list in place; a cached template is mutated on every compile call and subsequent compilations of the same cached template see previous compilation results.
  - The placeholder format is {{variable}} (double braces), converted to {variable} (single braces) for string.format() substitution.
  - Optional parameters from the response override caller parameters; parameter precedence is caller defaults, then fetched optional_params.
  - Missing prompt_id raises an error; missing API key falls through to parent class without error.
  - The ignore_prompt_manager_model and ignore_prompt_manager_optional_params arguments are not honored; the implementation always applies fetched values.

