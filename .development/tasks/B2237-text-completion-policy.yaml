id: B2237
title: OpenAI text completion policy
description: >-
  Implement the shared native OpenAI text-completion config, prompt projection and optional chat-response conversion
  below provider dispatch and public completion routes. Config constructors consume resolved SDK settings; B159
  owns Python class-setting assignment, while native instances retain isolated settings.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/completion/transformation.py:
  OpenAITextCompletionConfig.__init__ L57-L75; get_config L77-L79; convert_to_chat_model_response_object L81-L119;
  get_supported_openai_params L121-L144; transform_text_completion_request L146-L158. litellm/llms/openai/completion/utils.py:
  is_tokens_or_list_of_tokens L13-L22; _transform_prompt L25-L45. litellm/utils.py: ProviderConfigManager.get_provider_text_completion_config
  selection L9281-L9292.


  Named case contracts: text_config_values: best_of, echo, frequency_penalty, logit_bias, logprobs, max_tokens,
  n, presence_penalty, stop and suffix default None; temperature/top_p use inherited B668 defaults. Constructor
  stores only non-None values, including0/false/empty, get_config reuses B668 and retains inherited non-None settings.
  Repeated SDK constructor calls update class fields through B159, not ambient native process state. text_parameter_allowlist:
  Exact ordered allowlist: functions, function_call, temperature, top_p, n, stream, stream_options, stop, max_tokens,
  presence_penalty, frequency_penalty, logit_bias, user, response_format, seed, tools, tool_choice, max_retries,
  logprobs, top_logprobs, extra_headers. Constructor best_of/echo/suffix do not appear in this list. Model name
  does not change the list. single_prompt_tokens: One message with truthy list content that is all integers or all
  lists of integers passes that content through unchanged; Python bool counts as int and nested empty lists qualify.
  Empty content list falls through B218 convert_content_list_to_str. Wrong or mixed list content uses B218 conversion,
  with its errors unchanged. multiple_prompt_strings: Zero messages produces [] rather than empty string. Multiple
  messages produce one B218 converted string per message, preserving order; never flatten token arrays across messages.
  One ordinary message becomes one string, not a singleton list. Transformation returns model/prompt then optional_params
  overlay, including replacement model/prompt; headers are unused. text_reply_as_chat: Require both response_object
  and model_response_object or raise ValueError Error in response object format. Every text choice becomes assistant
  Message with text, sequential enumerate index (ignore source index), required finish_reason and logprobs default
  None. Replace choices, copy usage/id/model only when keys exist, retain other target fields, and set hidden original_response
  to the exact text response object. Empty choices accepted, malformed choices rethrow. text_config_selection: Closed
  tag selector chooses FireworksAITextCompletionConfig for FIREWORKS_AI, TogetherAITextCompletionConfig for TOGETHER_AI,
  InceptionTextCompletionConfig for TEXT_COMPLETION_INCEPTION, else OpenAITextCompletionConfig. Model unused. Concrete
  provider config construction remains at caller composition, with constructors supplied by installed provider families.


  get_config follows BaseTextCompletionConfig to B2202 BaseConfig.get_config in Python MRO; do not bypass that base
  collection rule when composing the inherited OpenAI policy.


  Implement crates/betterlite-openai/src/text_completion_policy.rs with adjacent tests under text_completion_policy/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function text_completion_policy_cases in betterlite-openai with these exact named cases (one per
  oracle file): text_config_values, text_parameter_allowlist, single_prompt_tokens, multiple_prompt_strings, text_reply_as_chat,
  text_config_selection. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/text_completion_policy* using HelperCase: kind:
  helper and the externally tagged text_completion_policy variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_text_completion_policy that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 134 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 245 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 580 planned, 600 maximum changed lines.
