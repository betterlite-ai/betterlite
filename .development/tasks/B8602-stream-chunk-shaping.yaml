id: B8602
title: Streaming chunk shaping and SSE frame helpers
description: >-
  Build the per-chunk helpers of LiteLLM's proxy streaming generator (litellm/proxy/proxy_server.py L9344-L9623): the stream item types, the client model and fallback metadata reads, the fallback metadata event, the model restamp, the chunk serializer, the injected usage check and the SSE frame helpers. They are pure functions over JSON, and the SSE data generator (B8604) calls them in order. Everything goes in crates/betterlite-server, module `stream_chunks` (stream_chunks.rs and stream_chunks/), with tests in stream_chunks/tests.rs, plus one config section. Every name stays at 30 characters or fewer.

  Types. `ChunkKind` is `ModelStream` (LiteLLM's ModelResponseStream), `ModelFull` (ModelResponse), `Event` (any other pydantic object that reaches the generator, such as a Responses API event; these accept extra fields) and `Plain` (a dict). `StreamChunk { body: Map<String, Value>, kind: ChunkKind, hidden: Map<String, Value> }`: `body` holds the fields the object would dump (null fields may be present and are dropped when serialized) and `hidden` is its `_hidden_params`. `StreamItem` is `Chunk(StreamChunk)`, `Bytes(Bytes)` or `Text(String)`, the three shapes the generator sees. `StreamItem::hidden_params(&self) -> Option<&Map<String, Value>>` gives the chunk's map and None for bytes and text. Constants: `DONE_FRAME` is "data: [DONE]\n\n", `SSE_FRAME_DELIMITERS` is ["\r\n\r\n", "\n\n", "\r\r"] in that order and `MAX_RAW_SSE_BUFFER_CHARS` is 8 * 1024 * 1024.

  `client_requested_model(request_data: &Map<String, Value>) -> String` replaces _get_client_requested_model_for_streaming (L9344-L9356): `_litellm_client_requested_model` when it is a JSON string, else `model` when it is a string, else "".
  `is_positive_int_like(value: Option<&Value>) -> bool` replaces _is_positive_int_like (L9359-L9363), Python's `int(value) > 0` with TypeError and ValueError giving false. A JSON integer counts as itself, a JSON float is truncated toward zero (2.7 is 2, 0.9 is 0), and a string is parsed like Python's int(): surrounding whitespace, an optional sign, ASCII digits with single underscores between digits, and nothing else ("2.5" fails). Everything else is false.
  `include_fallback_errors(expose: bool, request_data) -> bool` replaces _should_include_fallback_errors (L9366-L9369): `expose` is `general_settings.expose_fallback_errors_to_caller`, and the request must also carry `include_fallback_errors` as the JSON bool true.
  `FallbackMeta { attempted: bool, model: Option<String>, errors: Vec<Map<String, Value>> }` and `fallback_metadata(hidden: &Map<String, Value>) -> FallbackMeta` replace _get_streaming_fallback_metadata (L9372-L9386). `hidden["additional_headers"]` must be an object and its `x-litellm-attempted-fallbacks` must be positive-int-like, or the answer is not attempted with no model and no errors. Then attempted is true, `model` is `x-litellm-model-group` when it is a non-empty string, and `errors` comes from B398's port of get_fallback_errors_from_headers in betterlite-router's fallback_observations module (a list keeps its object items, a string is parsed as a JSON list, anything else gives no errors). Call that function; do not copy it.
  `fallback_event_frame(model: Option<&str>, errors: &[Map<String, Value>], created: i64) -> String` replaces _format_fallback_metadata_sse_event (L9389-L9407). The payload has id "litellm-fallback-metadata", object "chat.completion.chunk", `created` (the caller passes the unix seconds), model (the model or ""), choices [] and `litellm_fallback` with `fallback_model` (the model or JSON null) and `errors`. The frame is "data: " + JSON + "\n\n".

  `should_return_raw_model_name(request_data) -> bool` replaces _should_return_raw_model_name (common_request_processing.py L279-L283): true when `metadata` or `litellm_metadata` is an object whose `_complexity_router_return_raw_model_name` is the JSON bool true.
  `RouterCheck` is `fn(&str) -> bool`, the Azure Model Router test (_is_azure_model_router_request, common_request_processing.py L1291-L1310). This task takes it as a value and never names the real check: B8632 passes B562's is_model_router_call, called with the model name and no hidden params, and the tests pass fakes such as a function that answers true only for "my-model-router".
  `RestampInput<'a> { requested_model: &'a str, request_data: &'a Map<String, Value>, fallback_attempted: bool, fallback_model: Option<&'a str>, is_model_router: RouterCheck }` and `restamp_chunk_model(item: &mut StreamItem, input: &RestampInput<'_>, mismatch_logged: bool) -> bool` replace _restamp_streaming_chunk_model (L9410-L9473); the result is the new mismatch_logged. The caller builds RestampInput, so the check is named where the input is made. In order: when should_return_raw_model_name is true, change nothing. The target is `fallback_model` when a fallback was attempted, else `requested_model`; change nothing when the target is missing or empty or the item is not a Chunk. When no fallback was attempted, change nothing when `(input.is_model_router)(input.requested_model)` is true, and change nothing when `request_data["fastest_response"]` is the JSON bool true. When `body["model"]` already equals the target, change nothing. Otherwise, the first time only, log at debug "litellm_call_id={id}: streaming chunk model mismatch - target={target} downstream={downstream} fallback_was_attempted={flag}. Overriding chunk model to target." and return true; then set `body["model"]` to the target for every chunk kind, adding the key when it is missing.
  `serialize_chunk(chunk: &StreamChunk) -> String` replaces _serialize_streaming_chunk and _fast_serialize_simple_model_response_stream (L9476-L9560). LiteLLM writes `model_dump_json(exclude_none=True, exclude_unset=True)`, and its fast path for simple text chunks writes the same keys and values, so there is one rule: the body as compact JSON with every null-valued key removed from every object at any depth (null items inside arrays stay). A `Plain` chunk is written as its body JSON with nothing removed; LiteLLM writes the dict's Python repr there, and docs/compatibility.md covers repr text.
  `is_usage_artifact(chunk: &StreamChunk) -> bool` replaces _is_injected_stream_usage_artifact and _is_empty_streaming_choice (L9563-L9579). Only a ModelStream chunk can be one, and only when its `provider_specific_fields` is missing or null. Then it is one when every entry of `choices` is empty, so a missing, null or empty list counts. A choice is empty when `finish_reason` and `logprobs` are missing or null and `delta` is missing, null, or an object whose values are all null.
  `chunk_response_text(chunk: &StreamChunk) -> String` is the standard branch of litellm.get_response_string (utils.py L5419-L5432), which the generator uses to grow `str_so_far`. Join, for every choice, `delta.content` of a ModelStream chunk or `message.content` of a ModelFull chunk when it is not null: a string as it is and any other value as its JSON text. Other kinds give "".
  `sse_data_frame(payload: &str) -> String` replaces _format_streaming_sse_chunk (L9603-L9606): "data: " + payload + "\n\n". `pop_sse_frame(buffer: &str) -> (Option<String>, String)` replaces _pop_complete_sse_frame (L9614-L9623): find each delimiter's first position, take the earliest, and return the text up to and including that delimiter as the frame plus the rest; with no delimiter return (None, the whole buffer). `ends_with_frame_delimiter(text: &str) -> bool` is the `endswith(_SSE_FRAME_DELIMITERS)` test the generator uses twice.

  Config. Section `fallback_errors` in crates/betterlite-config/src/sections/fallback_errors.rs owns `general_settings.expose_fallback_errors_to_caller`, a bool that defaults to false (LiteLLM reads it with general_settings.get, so missing or null means off). The section type is `FallbackErrors { expose_to_caller: bool }` with a Default of false. It reaches the generator, and B8605's pre-call flag drop, as config.sections.fallback_errors. Its test `sections::fallback_errors::tests::loads_expose_flag` loads the production Config with the key true, false and missing.

  Tests live in stream_chunks/tests.rs and the section's tests.rs. Helper oracle cases compare the pure functions with LiteLLM through the operation named b8602; the Python side builds a ModelResponseStream or ModelResponse from the case JSON for ModelStream and ModelFull chunks, a dict for Plain, and masks `created` in the fallback event. The Rust side of b8602 passes a RouterCheck that always answers false, so the restamp cases only use model names that LiteLLM's AzureFoundryModelInfo.is_model_router_call rejects (plain names such as gpt-4o); the router skip is proven by unit tests with a fake check.
scope:
  paths:
  - crates/betterlite-server/src/stream_chunks.rs
  - crates/betterlite-server/src/stream_chunks/**
  - crates/betterlite-config/src/sections/fallback_errors.rs
  - crates/betterlite-config/src/sections/fallback_errors/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/fallback-errors-*
  - tools/oracle/cases/helpers/stream-chunks/**
  - tools/oracle/helpers/b8602.py
  - tools/oracle/helpers/b8602/**
  - tools/oracle/src/helpers/server/b8602.rs
  - tools/oracle/src/helpers/server/b8602/**
  lint_tables: false
