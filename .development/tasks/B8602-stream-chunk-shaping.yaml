dod:
- text: >-
    client_requested_model prefers a string _litellm_client_requested_model, then a string model, then "",
    and is_positive_int_like accepts 2, 2.7, "3" and " +4 " and rejects 0, 0.9, "2.5", "abc" and null.
  proof: [chunk-tests, oracle, helper-python]
- text: >-
    fallback_metadata reports no fallback without additional_headers or a positive attempt count, reports the model group only when it is
    a non-empty string, and reads the errors from a list or a JSON string; fallback_event_frame writes the fixed id, object, empty choices,
    "" as the top-level model and null as fallback_model when there is no model.
  proof: [chunk-tests, oracle, helper-python]
- text: >-
    restamp_chunk_model sets the client model (or the fallback model after a fallback) on chat chunks and Responses events, adds the key
    when it is missing, leaves bytes, text and matching chunks alone, and skips the raw-name flag, an empty target, an Azure model router
    name and fastest_response, the last two only when no fallback happened; it logs the mismatch once.
  proof: [chunk-tests, oracle, helper-python]
- text: >-
    serialize_chunk drops null keys at every depth for model and event chunks and keeps a plain chunk's body as it is;
    is_usage_artifact is true only for a ModelStream chunk without provider_specific_fields whose choices are all empty or absent.
  proof: [chunk-tests, oracle, helper-python]
- text: >-
    pop_sse_frame splits at the earliest of the three delimiters with the delimiter kept in the frame, and returns no frame and the whole
    buffer when none is present; sse_data_frame and chunk_response_text match LiteLLM.
  proof: [chunk-tests, oracle, helper-python]
- text: general_settings.expose_fallback_errors_to_caller loads as true, false and missing (false), and include_fallback_errors needs both the setting and the request flag.
  proof: [config-tests, config-corpus, chunk-tests]
checks:
  optional: [mutants]
  commands:
  - id: chunk-tests
    why: a chunk helper, the restamp rules, the serializer, the usage check or the frame helpers are missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^stream_chunks::/)'
  - id: config-tests
    why: the expose_fallback_errors_to_caller key is never loaded by the real Config loader
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::fallback_errors::tests::loads_expose_flag($|::)/)'
  - id: config-corpus
    why: the new key has no config replay seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/fallback-errors-*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the chunk helpers have no pinned LiteLLM comparison through the b8602 helper
    run: grep -qE '^[[:space:]]+b8602:' tools/oracle/fuzz/corpus/helper_case/b8602-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/stream-chunks/requested-model-and-int-like.yaml
- tools/oracle/cases/helpers/stream-chunks/fallback-metadata-headers.yaml
- tools/oracle/cases/helpers/stream-chunks/fallback-event-payload.yaml
- tools/oracle/cases/helpers/stream-chunks/restamp-chat-and-events.yaml
- tools/oracle/cases/helpers/stream-chunks/restamp-skip-rules.yaml
- tools/oracle/cases/helpers/stream-chunks/serialize-drops-nulls.yaml
- tools/oracle/cases/helpers/stream-chunks/usage-artifact-shapes.yaml
- tools/oracle/cases/helpers/stream-chunks/sse-frame-split.yaml
- tools/oracle/cases/helpers/stream-chunks/response-text.yaml
deviations:
- what: Chunks are JSON maps tagged with a ChunkKind instead of pydantic objects, so the restamp cannot fail to set a model and LiteLLM's "failed to override chunk.model" error log has no counterpart.
  why: The objects that reach the generator either have a model field or accept extra fields, so the visible output is the same.
out_of_scope:
- "data_generator (L9280-L9287): no caller at the pin. async_assistants_data_generator (L9290-L9341): B089."
- "_apply_streaming_chunk_hooks (L9582-L9600) and async_data_generator (L9830-L10079): B8604. The keepalive helpers (L9626-L9827): B8603."
- "get_hidden_params_dict and get_fallback_errors_from_headers (add_retry_fallback_headers.py): B398, and this task calls them. AzureFoundryModelInfo.is_model_router_call: B562; this task only takes a RouterCheck, and B8632 passes B562's is_model_router_call."
- "The rest of litellm/proxy/proxy_server.py: owners by area are listed in the proxy_server.py inventory head of B1216, B1125, B850, B848, B779, B899, B849 and B851."
pitfalls:
- 'x-litellm-attempted-fallbacks as the string "2.5" is not a fallback (Python int("2.5") fails), while the number 2.5 is (int(2.5) is 2).'
- 'A fallback can be attempted with no usable x-litellm-model-group; the restamp target is then missing and the chunk keeps the model the provider sent.'
- 'Responses API events get a top-level "model" key from the restamp, because LiteLLM sets the attribute on objects that allow extra fields.'
- 'The Azure model router and fastest_response skips apply only before a fallback; after one, the fallback model is stamped even on those requests.'
- 'The router check is called with `requested_model` only, never with the fallback model or the chunk''s own model, and it is skipped entirely once a fallback was attempted.'
- 'The fallback event has "model": "" at the top level but "fallback_model": null inside litellm_fallback when no model group is known.'
- 'is_usage_artifact is true for a chunk whose choices list is empty or missing, since all() over nothing is true.'
- 'pop_sse_frame picks the earliest position across all three delimiters, not the first delimiter in list order that appears.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
