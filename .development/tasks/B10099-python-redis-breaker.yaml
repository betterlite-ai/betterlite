id: B10099
title: The Python package's native Redis handles open LiteLLM's Redis circuit breaker
description: >-
  LiteLLM's RedisCache runs every Redis call under a RedisCircuitBreaker. After REDIS_CIRCUIT_BREAKER_FAILURE_THRESHOLD
  consecutive health failures the breaker opens, and Redis calls fail fast with RedisCircuitBreakerOpenError until
  REDIS_CIRCUIT_BREAKER_RECOVERY_TIMEOUT has passed. B8066 builds the Python package's native Redis handles in
  crates/betterlite-python/src/cache_backends/redis.rs with a QuietGate that never opens, so a dead Redis keeps taking
  every call there.


  betterlite already has the breaker: PolicyGate in crates/betterlite-server/src/redis_cache_wiring/gate.rs, with its
  failure classing in gate/failure_class.rs, implements betterlite-redis's BreakerGate over betterlite-router's
  RedisFailurePolicy, and logs through log_breaker_event and log_redis_failure in
  crates/betterlite-server/src/routing/redis_failure_policy.rs. betterlite-python can't depend on betterlite-server.
  It may depend on betterlite-router (deny.toml lists betterlite-python as a wrapper of betterlite-router), and
  PolicyGate needs nothing from betterlite-server but those two log helpers.


  So the gate, its failure classing, its tests and the two log helpers move down into betterlite-router beside
  redis_failure_policy, betterlite-server uses them from there, and the Python native Redis handles build a PolicyGate
  from the same REDIS_CIRCUIT_BREAKER_* settings in place of QuietGate. Nothing stays behind as a copy.
scope:
  paths:
  - crates/betterlite-router/src/redis_failure_policy.rs
  - crates/betterlite-router/src/redis_failure_policy/**
  - crates/betterlite-router/Cargo.toml
  - crates/betterlite-server/src/redis_cache_wiring.rs
  - crates/betterlite-server/src/redis_cache_wiring/**
  - crates/betterlite-server/src/routing.rs
  - crates/betterlite-server/src/routing/redis_failure_policy.rs
  - crates/betterlite-server/src/routing/redis_failure_policy/**
  - crates/betterlite-server/src/routing/routing_value_store.rs
  - crates/betterlite-server/src/routing/request_scheduler/tests.rs
  - crates/betterlite-server/src/coord_redis_boot/build.rs
  - crates/betterlite-server/src/coord_redis_boot/error.rs
  - crates/betterlite-server/src/coord_redis_boot/init.rs
  - crates/betterlite-server/src/coord_redis_boot/tests/support.rs
  - crates/betterlite-python/Cargo.toml
