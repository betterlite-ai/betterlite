id: B3652
title: Azure Speech passthrough duration and cost
description: >-
  Implement Azure Speech passthrough logging handler that classifies requests by route,
  derives the billed audio duration, and emits standardized cost payloads. Handlers work
  on three Azure Speech routes: short audio (immediate processing), fast transcription
  (synchronous), and batch transcription (asynchronous).

  Build three route classifiers that inspect the URL path to distinguish between
  short-audio, fast-transcription and batch paths using prefix matching and path-suffix
  tests. Extract model names from the route classification so cost lookups work correctly
  (azure_speech/short-audio, azure_speech/fast-transcription, azure_speech/batch-transcription).

  Derive billed duration by route: short audio uses the maximum of uploaded audio duration
  (calculated from the raw request body bytes) and the recognized audio duration (decoded
  from response Offset and Duration in 100-nanosecond ticks); fast transcription uses the
  durationMilliseconds field from the response body; batch routes report zero duration and
  zero cost. When response parsing fails, fall back to zero duration and zero cost.

  Calculate cost using the transcription_cost function with AZURE_SPEECH_PRICING_MODEL
  ("azure/speech/azure-stt") and the derived duration in seconds. When cost lookup fails,
  log a warning and return zero cost so the spend record is not dropped. Update the
  response cost on the logging object and include it in the returned kwargs. Preserve
  the source's warn-and-return fallback pattern, so billing survives transient pricing
  failures.

  Implement azure_speech_handler as the main entry point, taking httpx response,
  response body, logging object, URL route and timing metadata. Build StandardPassThroughResponseObject,
  update model_call_details with the derived model name and response cost, and return
  a payload with the standard logging object attached. On any unhandled exception, return
  a fallback payload that preserves the response and original kwargs without costing.
scope:
  paths:
    - crates/betterlite-core/src/api/passthrough_logging/azure_speech.rs
    - crates/betterlite-core/src/api/passthrough_logging/azure_speech/**
  lint_tables: false
