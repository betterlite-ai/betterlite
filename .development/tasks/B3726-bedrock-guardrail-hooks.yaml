deviations:
  - what: >-
      Streaming error handling defers to keepalive_ping_has_fired to determine whether
      a service error raised after chunk consumption can reach the client via HTTP status
      or must travel as a frame. Once a keepalive ping has flushed headers, only frames
      can be sent; earlier, a raise can return an HTTP error. Bedrock policy blocks are
      emitted as error frames once assembled; they do not propagate as exceptions.
    why: >-
      Streaming responses have already flushed headers by the time chunks are yielded.
      A service error early in the stream can raise, but once keepalive pings have been
      sent, the HTTP status is locked and the error must be serialized as an SSE frame
      (matching Anthropic's own behavior). Blocks always travel as frames to preserve
      the response shape the client expects, and original token usage is carried from
      the upstream call, not re-calculated.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2814-L2847

  - what: >-
      Responses-API routes delegate to UnifiedLLMGuardrails for scanning because the
      unified framework owns the translation layer that decodes Responses events into
      messages and responses; the native Bedrock hook cannot assemble Responses chunks
      because they are neither chat-completion SSE nor Anthropic SSE frames.
    why: >-
      Responses API is a distinct event stream format with its own assembly rules.
      Attempting to scan it with native code would duplicate translation logic and
      require the Bedrock hook to understand the Responses wire format, which belongs
      to the unified framework. Delegating preserves separation of concerns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2760-L2776

out_of_scope:
  - B3721 owns _prepare_guardrail_messages_for_role, _update_messages_with_updated_bedrock_guardrail_response, _merge_filtered_messages, and _apply_masking_to_response; this task calls them.
  - B3723 owns constructor streaming_params fields (_set_streaming_params); this task reads them via _streams_incrementally.
  - B3724 owns make_bedrock_api_request; this task calls it from all hooks.
  - B207 owns get_call_types_for_route from betterlite-core::routes; this task calls it to detect Responses API.
  - B2227 owns stream_chunk_builder and the streaming assembly; this task calls them to reconstruct responses.
  - B732 owns AuthContext and user principal accessors; this task reads request_route from the auth dict.
  - B3669 owns assemble_anthropic_sse_stream, anthropic_sse_chunks_from_response, anthropic_sse_error_frames, is_raw_sse_stream and model_response_text (litellm/proxy/guardrails/anthropic_sse.py); this task calls them.
  - U1 (should_run_guardrail, get_guardrails_messages_for_call_type, UnifiedLLMGuardrails, AnthropicMessagesHandler) are unresolved and must be provided elsewhere.
  - U3 (add_guardrail_to_applied_guardrails_header) and U6 (keepalive_ping_has_fired, serialize_http_exception_detail, MockResponseIterator) are unresolved.
  - UnifiedLLMGuardrails.async_post_call_streaming_iterator_hook is called via delegation when incremental/Responses modes are active.

pitfalls:
  - "_RESPONSES_API_CALL_TYPES must be a frozenset containing exactly CallTypes.responses and CallTypes.aresponses; the constant is used to check route support via membership test."
  - "_is_responses_api_route returns false (not None) when request_route is None; the function checks call_types membership only if get_call_types_for_route returns a non-None result."
  - "_streams_incrementally returns false when mask_response_content is true because masking requires the full assembled response; incremental yields would pass incomplete content to the masking layer."
  - "async_pre_call_hook and async_moderation_hook share the same implementation pattern; the only difference is the event_type parameter (pre_call vs during_call/during_mcp_call) and exception handling (pre_call suppresses ModifyResponseException in its hook context, during_call lets it propagate)."
  - "async_post_call_success_hook filters responses that have no text content (e.g., tool-only choices) and skips scanning for them, since Bedrock requires non-empty content."
  - "Streaming error handling checks both is_block (structured detail + 400 status for blocks) and headers_flushed (keepalive timing) before deciding to raise vs emit a frame; raw_sse is also required for the block detection logic."
  - "ModifyResponseException in streaming context must preserve the model and original response before constructing a replacement, since the exception carries usage that will be lost when the response is replaced; the original_response field is populated by this hook."
  - "Empty assembled responses (no text content) are passed through via all_chunks without scanning; the check for isinstance(assembled_model_response, ModelResponse) guards against TextCompletionResponse or None."
  - "keepalive_ping_has_fired takes elapsed seconds and interval seconds as arguments; the elapsed time is calculated from time.monotonic() to match the source's calculation."
  - "MockResponseIterator must be awaited like an async generator; yielding from it requires async for, not a direct yield of the iterator."

