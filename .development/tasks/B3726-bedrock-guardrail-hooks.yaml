id: B3726
title: Bedrock native guardrail hooks and buffered streams
description: >-
  Build the native pre/during/post-call hooks and buffered streaming branch, including
  Anthropic block framing and original token usage on replacement responses. Delegate
  incremental and Responses streaming to the unified framework with the source's buffering
  defaults.

  Implement async_pre_call_hook to validate and mask user messages before the LLM call,
  using should_run_guardrail and get_guardrails_messages_for_call_type to select messages,
  _prepare_guardrail_messages_for_role to filter role-qualified content, then call
  make_bedrock_api_request for INPUT scanning, apply the response masking via
  _update_messages_with_updated_bedrock_guardrail_response and _merge_filtered_messages,
  and add the guardrail name to the applied-guardrails header. The hook returns the request
  dict with updated messages, or the original dict unmodified when the guardrail does not run.

  Implement async_moderation_hook (during-call) identically to async_pre_call_hook except
  it accepts during_call or during_mcp_call event types and lets ModifyResponseException
  propagate so the endpoint handler returns a block response, since the LLM call is
  already in-flight in an asyncio.gather and cannot be cancelled from here.

  Implement async_post_call_success_hook to scan the model response OUTPUT and apply
  masking to it, but only when the response carries text content (filter out tool-only
  responses). Wrap the make_bedrock_api_request call to attach original_response before
  rethrowing ModifyResponseException so the endpoint handler carries original token usage
  in the block response. Apply masking via _apply_masking_to_response, then add the
  guardrail name to the response header.

  Implement async_post_call_streaming_iterator_hook to collect all chunks from the
  upstream response, assemble them (handling both chat-completion chunks and raw
  Anthropic SSE separately), scan the assembled OUTPUT, apply masking, and yield chunks
  for the masked response. When _streams_incrementally returns true, delegate to
  UnifiedLLMGuardrails with buffer_until_moderated_default=False. When the route is
  Responses API, delegate to UnifiedLLMGuardrails with buffer_until_moderated_default=True.
  For Anthropic SSE streams (raw_sse=true), detect blocks via status 400 and structured
  detail, then emit error or block frames without raising (headers already flushed); use
  keepalive_ping_has_fired to decide whether a service error can be raised. Non-Anthropic
  streams yield chunks from the assembled response via MockResponseIterator. When a
  ModifyResponseException is caught, preserve the original model/usage and emit block
  frames instead of raising.

  Implement _streams_incrementally to return false if masking is enabled (full buffering),
  true if buffering is disabled, or check streaming_buffer_release_on_scan and
  streaming_end_of_stream_only to decide between incremental and full-buffer modes.

  Implement _is_responses_api_route to use get_call_types_for_route and check whether the
  route supports Responses API call types. Store the Responses call-type constant in
  _RESPONSES_API_CALL_TYPES as a frozenset of CallTypes.responses and CallTypes.aresponses.

