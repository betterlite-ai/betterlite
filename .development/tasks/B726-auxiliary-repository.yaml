id: B726
title: Managed resources and transaction repositories
description: >-
  Expose typed TableRepository handles only for the enumerated tables, ManagedBatchRepository compare-and-set,
  ManagedFileContentRepository, AutoRouterSessionRepository and UserBannerRepository. Implement spend-reset
  and budget-cascade units of work over the same DbSession transaction, retaining omission versus zero.
  Register repository exports without a dynamic table-name execution API.


  Build the production auxiliary_repository module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/table_repositories.py:
  PrismaTableRepository.__init__ (L24-L26; 3 source lines), PrismaTableRepository.prisma_client (L29-L32;
  4 source lines), PrismaTableRepository.table (L35-L39; 5 source lines). litellm/repositories/managed_batch_repository.py:
  _batch_of (L11-L12; 2 source lines), ManagedBatchRepository.load_batch (L18-L20; 3 source lines), ManagedBatchRepository.load_status
  (L22-L24; 3 source lines), ManagedBatchRepository.compare_and_set (L26-L37; 12 source lines), ManagedBatchRepository.touch
  (L39-L43; 5 source lines), ManagedBatchRepository._find_row (L45-L46; 2 source lines). litellm/repositories/managed_file_content_repository.py:
  ManagedFileContentRepository.store (L12-L16; 4 source lines), ManagedFileContentRepository.load (L18-L22;
  5 source lines), ManagedFileContentRepository.delete (L24-L30; 6 source lines). litellm/repositories/autorouter_session_repository.py:
  AutoRouterSessionRepository.table (L17-L18; 2 source lines), AutoRouterSessionRepository.model_class
  (L21-L22; 2 source lines), AutoRouterSessionRepository.find_latest_for_key (L24-L34; 10 source lines).
  litellm/repositories/user_banner_repository.py: UserBannerRepository.get_raw_settings (L14-L16; 3 source
  lines), UserBannerRepository.upsert_settings (L18-L23; 6 source lines). litellm/repositories/unit_of_work.py:
  _spend_reset_data (L27-L29; 3 source lines), KeySpendResetWrites.queue_spend_reset (L36-L40; 5 source
  lines), UserSpendResetWrites.queue_spend_reset (L47-L51; 5 source lines), TeamSpendResetWrites.queue_spend_reset
  (L58-L62; 5 source lines), LinkedSpendResetWrites.queue_spend_zero (L69-L70; 2 source lines), LinkedSpendResetWrites.queue_spend_decrement
  (L72-L78; 7 source lines), BudgetWindowWrites.queue_window_advance (L85-L88; 4 source lines), spend_reset_unit_of_work
  (L118-L125; 8 source lines), budget_cascade_unit_of_work (L129-L143; 15 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the auxiliary_repository operation under B856 Management::database. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a auxiliary-repository-* seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 131 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  131 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 380 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
