id: B726
title: Typed table adapters and managed-resource repositories
description: >-
  Build betterlite-db::auxiliary_repository for PrismaTableRepository, its 58 concrete table
  bindings, ManagedBatchRepository, ManagedFileContentRepository, AutoRouterSessionRepository and
  UserBannerRepository. Re-export B2311's split spend-reset unit-of-work types; do not duplicate
  its queued transactions. B700 supplies database/table contracts, B714 read/write handle selection,
  B858 the auto-router row and B1035 LiteLLMBatch. Add the missing direct dependency on B4144's
  wrap_table_actions_for_config_sync, called by the shared table property. No repository imports
  an upper management route or duplicates its row schema.

  PrismaTableRepository constructor stores the optional client and use_writer=false. Accessing
  prisma_client with None raises RuntimeError 'No DB Connected. See - https://docs.litellm.ai/docs/proxy/virtual_keys'.
  table selects writer_db only when use_writer is true, otherwise db, then wraps the exact static
  table in B4144's config-sync adapter. Keep distinct native typed handles, never a user-facing
  arbitrary table-name/SQL API. Record_to_dict and rich object-permission/team repositories live
  in B700/B725/B724; the same-named passthrough classes here remain separate raw-table adapters.

  Preserve all 58 table_name literals, each with prefix litellm_: policytable, agentstable,
  agentidentity, retiredagentidentity, verifiedsubject, objectpermissiontable, guardrailstable,
  mcpservertable, managedobjecttable, organizationmembership, spendlogs, budgetwindowspend,
  claudecodeplugintable, teammembership, endusertable, managedvectorstorestable,
  mcpusercredentials, mcpserveroauthclient, prompttable, tagtable, modelaccessgroupbudgettable,
  invitationlink, jwtkeymapping, managedfiletable, memorytable, searchtoolstable, configoverrides,
  mcptoolsettable, tooltable, deletedverificationtoken, workflowrun, modeltable, accessgrouptable,
  ssoconfig, uisettings, dailyguardrailmetrics, dailyguardrailusageunits, policyattachmenttable,
  teamtable, deletedteamtable, skillstable, cacheconfig, managedvectorstoreindextable,
  workflowmessage, dailytagspend, spendlogtoolindex, dailytoolspend, dailymodelusage,
  spendlogguardrailindex, usernotifications, healthchecktable, deprecatedverificationtoken,
  workflowevent, dailypolicymetrics, adaptiverouterstate, auditlog, adaptiveroutersession and
  retiredagent. These map to the correspondingly named classes in table_repositories.py, including
  plural Agents/Guardrails/Skills and ManagedVectorStores. Test each binding with the named
  table_binding_<suffix> rstest case and actual pg_catalog-backed table identity.

  B4144 wraps writes only for its configured table allowlist and create/create_many/update/update_many/
  upsert/delete/delete_many. Reads pass through and a database failure prevents publication. A
  successful write, including a zero-row update_many, precedes publication and its original result
  is returned. The production publisher treats absent Redis as a no-op and catches ordinary Redis
  failures with warning 'config sync publish for <object_type> failed: ...'; the committed database
  write still succeeds. An explicitly injected publisher exception can propagate after the commit,
  and cancellation is not an ordinary caught Redis error. Preserve those distinct paths without
  promising a database/Redis transaction or duplicating B4144's allowlist.

  ManagedBatchRepository binds litellm_managedobjecttable. _find_row uses find_first by
  unified_object_id, with no owner/status/order filter. load_batch returns None for no row or a
  falsey file_object (None, empty string/map/list, false, zero); a truthy string goes through
  LiteLLMBatch.model_validate_json, other truthy objects through model_validate. A string containing
  JSON null/{} is itself truthy, so validation runs and fails required batch fields. load_status
  returns the raw stored status or None without validating file_object. compare_and_set runs one
  UPDATE MANY with predicate {unified_object_id: batch.id, **unchanged}; unchanged wins if it also
  contains unified_object_id. Do not silently force batch.id back into that predicate. Write only
  file_object=batch.model_dump_json(), status=batch.status and updated_by including None. Return
  affected_rows>0, not exactly one, with no implicit status guard beyond the caller's unchanged
  map. touch updates only updated_by for all matching unified ids and returns nothing, even on zero
  matches. SQL/validation failures propagate with no warning-and-drop fallback.

  ManagedFileContentRepository uses litellm_managedfilecontenttable. store always creates a new
  row and returns its generated id, even for empty bytes; it does not replace an existing file.
  The pinned Prisma Base64 adapter transports bytes to PostgreSQL BYTEA; native SQLx binds/reads
  the same bytes directly, with no extra base64 layer in storage. load by id returns None if absent
  or the exact bytes otherwise, distinguishing b'' from missing. delete is idempotent only for
  RecordNotFoundError: native zero deleted rows is success, while constraint/permission/connection
  failures propagate. This content is neither encrypted nor a stored credential.

  AutoRouterSessionRepository uses client.db.litellm_autoroutersession and B858 row conversion.
  find_latest_for_key filters BOTH api_key and session_id in SQL, orders last_turn_at descending
  and takes the first row across router ids. No hashing, cross-key fallback, ascending tie-breaker
  or NULLS LAST clause is added; preserve Postgres DESC null ordering and unspecified equal-time
  ties. Missing rows return None and invalid rows propagate through B700/B858.

  UserBannerRepository binds litellm_uisettings with USER_BANNER_ROW_ID='user_banner'. get_raw_settings
  returns the stored ui_settings value unchanged or None when absent; it does not JSON-decode a
  string. upsert_settings stores the exact payload string: create id/ui_settings, update only
  ui_settings, discard the returned row. It uses B4144's normal publication wrapper, with writes
  already committed before best-effort Redis publication. Other UI-setting ids remain untouched.

  These standalone MIT repository services do not construct the enterprise-only managed_files hook.
  Keep the current no-hook behavior while Max decides whether to build a native managed service:
  the existing LiteLLM-executed batch caller still returns 400 invalid_request_error, param null,
  code '400', with 'LiteLLM-executed batches need a database: set DATABASE_URL so LiteLLM can keep
  the batch and its files' when that hook is unavailable, even if DATABASE_URL is configured.
  B086/B087 and their route parts own those HTTP cases; this task installs no hook or endpoint.

  Real Postgres tests use POSTGRES_TEST_URL or testcontainers and fail if unavailable. Assert raw
  table binding, write/publication order, compare-and-set races, byte-for-byte file content, key/session
  isolation and banner identity. Only pure _batch_of enters B856's auxiliary_repository helper and
  B171 seeds; effectful repositories never run through a mocked helper adapter. decode_managed_batch_record
  bounds newly parsed stored batch JSON at 1048576 bytes/depth 64 and uses B1035's actual batch
  contract. Its managed_batch_record fuzz target in B2307's workspace covers truncation, duplicate
  fields, scalar/object inputs and limits. No separate parser is needed for typed BYTEA values.

  Moving unit_of_work.py to B2311 leaves 243 nonblank noncomment lines including all table
  declarations and protocols. Allow 275 production, 330 Postgres/unit tests, 55 oracle adapters,
  45 decoder/fuzz and 35 wiring, 740 within 800. Keep table bindings and each repository in
  separate modules below 300 lines; no exclusion hides production SQL or declarations.
scope:
  paths:
    - crates/betterlite-db/src/auxiliary_repository.rs
    - crates/betterlite-db/src/auxiliary_repository/**
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/managed_batch_record.rs
    - crates/betterlite-db/fuzz/corpus/managed_batch_record/**
    - tools/oracle/src/helpers/db/auxiliary_repository.rs
    - tools/oracle/src/helpers/db/auxiliary_repository/**
    - tools/oracle/helpers/auxiliary_repository.py
    - tools/oracle/helpers/auxiliary_repository/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/auxiliary-repository/**
    - tools/oracle/fuzz/corpus/helper_case/auxiliary-repository-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/table_repositories.py#L19-L271
    why: Exact raw table bindings, optional writer selection, missing-client error and config wrapper call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/managed_batch_repository.py#L11-L46
    why: Batch falsey-load behavior, validation, merge-order CAS predicate and touch fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/managed_file_content_repository.py#L9-L30
    why: Create-only BYTEA content storage and deletion swallowing only not-found.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/autorouter_session_repository.py#L15-L34
    why: Exact key/session partition and descending latest-row selection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/user_banner_repository.py#L8-L23
    why: Fixed banner row id and verbatim string upsert/raw read.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/config_sync_pubsub.py#L101-L160
    why: B4144's best-effort production publisher differs from an injected raising publisher.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/batches_endpoints/endpoints.py#L89-L105
    why: Current missing-managed-hook error remains with the batch route owner pending Max's decision.
dod:
  - text: 'Every listed table has its table_binding_<suffix> case. Tests also name
      missing_client_is_lazy_exact_error, default_read_and_explicit_writer,
      configured_tables_publish_after_write, reads_and_unconfigured_tables_do_not_publish,
      failed_database_write_does_not_publish, zero_row_write_still_publishes,
      redis_missing_is_noop, redis_publish_failure_warns_but_write_succeeds and
      injected_publish_failure_after_commit. Check B4144 behavior through the actual wrapper.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Batch tests name batch_object_and_json_string_validation, batch_required_fields_fail,
      batch_missing_or_falsey_blob_returns_none, truthy_null_json_is_validated,
      status_load_ignores_corrupt_blob, postgres_batch_compare_and_set_race,
      unchanged_predicate_overrides_batch_id, cas_multiple_matches_returns_true,
      cas_only_three_fields_including_null_author, touch_only_author_zero_match_ok and
      batch_database_errors_propagate. Only the two pure validation cases enter the helper oracle.'
    proof: [behavior-tests, postgres-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Storage/session/banner cases name postgres_file_bytes_new_ids_and_empty_content,
      file_missing_vs_empty, file_delete_missing_only_is_swallowed,
      postgres_latest_session_exact_key_partition, session_desc_null_and_tie_semantics,
      session_missing_or_invalid_row, postgres_banner_verbatim_singleton,
      banner_absent_and_raw_json_value and banner_write_failure_preserves_old_value.
      native_managed_batch_record_limits plus replays_the_managed_batch_record_corpus prove
      the explicit stored-batch decoder limits.'
    proof: [behavior-tests, postgres-tests, parser-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Static table identity and each repository branch must be tested outside corpus replay.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^auxiliary_repository::tests::/) - test(replays_the_managed_batch_record_corpus)'
    - id: postgres-tests
      why: CAS races, raw byte storage, key isolation and singleton upserts need actual rows.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/auxiliary_repository::tests::postgres_batch_compare_and_set_race$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/auxiliary_repository::tests::postgres_file_bytes_new_ids_and_empty_content$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/auxiliary_repository::tests::postgres_latest_session_exact_key_partition$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/auxiliary_repository::tests::postgres_banner_verbatim_singleton$/)'
    - id: helper-python
      why: The adapter must invoke _batch_of and B1035's pinned batch type, without database mocks.
      run: test -f tools/oracle/helpers/auxiliary_repository.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Require new auxiliary_repository batch-validation seeds in the existing helper corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auxiliary-repository-*")" && grep -rlq auxiliary_repository tools/oracle/fuzz/corpus/helper_case/auxiliary-repository-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: Malformed stored batch records must replay the production decoding boundary.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/managed_batch_record.rs && grep -q managed_batch_record crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/managed_batch_record)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_managed_batch_record_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/auxiliary-repository/batch-object-and-json.yaml
  - tools/oracle/cases/helpers/auxiliary-repository/batch-validation-errors.yaml
deviations:
  - what: Stored managed-batch JSON above 1048576 bytes or depth 64 fails with a typed decode-limit error.
    why: Bound the database-record parser; native_managed_batch_record_limits tests both boundaries.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/managed_batch_repository.py#L11-L20
  - what: Repository availability does not enable managed files/batches; without the enterprise-created hook, the executed-batch route retains 400 invalid_request_error with param null and code '400', even with a configured database.
    why: Keep the current missing-hook behavior while Max decides whether betterlite should build a native managed service. B086/B087 route parts own its HTTP equality cases.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/batches_endpoints/endpoints.py#L89-L105
out_of_scope:
  - B2311 owns every function/dataclass in unit_of_work.py and the narrow reset-data helper;
    this task only re-exports those types for repository consumers.
  - repositories/__init__.py re-exports B700/B722/B723/B724/B725/B726/B2311 implementations;
    expose native modules without importing the higher-level repositories back into this service.
  - B4144 owns config-sync table/write allowlists and publication. B1035 owns LiteLLMBatch fields;
    B858 owns AutoRouterSession rows, and B086/B087 own managed-file/batch feature and route decisions.
pitfalls:
  - 'The oracle helper for this task is pre-registered as auxiliary_repository in the db group. Replace the stub Op in tools/oracle/src/helpers/db/auxiliary_repository.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/auxiliary_repository.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The caller's unchanged map can override compare_and_set's initial unified_object_id predicate.
  - File store always inserts a new row; idempotent deletion does not imply content replacement.
  - load_status can succeed even when file_object is invalid and load_batch would fail.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
