dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: batch_compare_and_set,
      file_content_replacement, latest_key_session, banner_upsert, reset_transaction_rollback, budget_cascade,
      postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^auxiliary_repository::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auxiliary_repository.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auxiliary-repository-*")"
        && grep -rlq "auxiliary_repository" tools/oracle/fuzz/corpus/helper_case/auxiliary-repository-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/auxiliary_repository::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/auxiliary_repository::tests::postgres_failure_effects$/)'
oracle_cases:
  - tools/oracle/cases/helpers/auxiliary-repository/batch-compare-and-set.yaml
  - tools/oracle/cases/helpers/auxiliary-repository/file-content-replacement.yaml
  - tools/oracle/cases/helpers/auxiliary-repository/latest-key-session.yaml
  - tools/oracle/cases/helpers/auxiliary-repository/banner-upsert.yaml
  - tools/oracle/cases/helpers/auxiliary-repository/reset-transaction-rollback.yaml
  - tools/oracle/cases/helpers/auxiliary-repository/budget-cascade.yaml
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - ManagedBatch compare-and-set must match the previous status inside the UPDATE predicate.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: security
