    - tools/oracle/helpers/auxiliary_repository.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/database.rs
    - tools/oracle/helpers/management/database.py
    - tools/oracle/cases/helpers/auxiliary-repository/**
    - tools/oracle/fuzz/corpus/helper_case/auxiliary-repository-*
  lint_tables: false
