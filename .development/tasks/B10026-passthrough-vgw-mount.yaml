deviations: []
out_of_scope:
  - "The route logic: B3627. The shared state, the router hop and the processor: B8640. The Fal, AssemblyAI and TinyFish mounts: B8609."
pitfalls:
  - "The GigaChat client keeps its own pool and timeouts; building it per request drops the connect timeout LiteLLM sets."
  - "B3627 builds one Router for all three paths; merge it once, not once per route."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
