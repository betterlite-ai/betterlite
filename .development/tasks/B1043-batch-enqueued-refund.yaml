    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_refund::/)
      - test(/::replays_corpus$/)'
  - id: case-terminal-refund-once
    why: the terminal-refund-once behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_refund::tests::terminal_refund_once($|::)/)'
  - id: case-cancelling-refund
    why: the cancelling-refund behavior or its assertions are absent
