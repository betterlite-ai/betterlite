- 'The oracle helper for this task is pre-registered as batch_enqueued_refund in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/batch_enqueued_refund.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/batch_enqueued_refund.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
