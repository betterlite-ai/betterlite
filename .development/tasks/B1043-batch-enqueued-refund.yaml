id: B1043
title: Batch enqueued refund
description: >-
  Persist and consume batch enqueued-token reservations, canonicalize provider IDs and refund exactly once across
  the source terminal statuses including cancelling. Keep Redis/local backend ownership, tombstone TTL and concurrent
  duplicate-poll behavior in typed records. Refund statuses are completed, complete, failed, expired, cancelled
  and cancelling; reuse the 691200-second reservation TTL.


  Implement crates/betterlite-core/src/api/batch_enqueued_refund.rs. Use BatchEnqueuedRefundInput and BatchEnqueuedRefundResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions terminal_refund_once, cancelling_refund, reservation_tombstone, local_backend_refund,
  duplicate_refund_race under api::batch_enqueued_refund::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::BatchEnqueuedRefund in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_enqueued_refund: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore.refund (L328-L350);
  litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._refund_redis_reservation (L352-L364); litellm/proxy/hooks/batch_enqueued_tokens.py:
  BatchEnqueuedTokenStore.save_reservation (L366-L396); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore.pop_reservation
  (L398-L421); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._pop_redis_record (L423-L438);
  litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._pop_local_record (L440-L450). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 115 owned nonblank/non-comment/non-docstring Python lines (115 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 135 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 385 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B126 (Redis, Redis Cluster and Valkey), B171 (Direct helper oracle and URL path encoding),
  B1042 (Batch enqueued reserve), B1087 (Api boundaries). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
