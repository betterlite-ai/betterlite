id: B5094
title: Clear the legacy lists of the one-line, impl Trait and into rules
description: >-
  Three ast-grep rules landed with the code already on main listed under their ignores, so new code is checked at
  once: no-padded-one-line-functions (145 functions in 102 files), no-impl-trait-arguments (9 arguments in 8
  files) and no-unnamed-into (3 calls in 2 files). This task fixes that code and empties the three lists, leaving
  only the "**/tests.rs" and "**/tests/**" globs that no-padded-one-line-functions shares with no-one-line-functions.
  Run `ast-grep scan --filter '^no-(padded-one-line-functions|impl-trait-arguments|unnamed-into)$'` after taking a
  file off a list to see what it holds.


  A padded function is a one-line let followed by a one-line tail that uses it, which rule no-one-line-functions
  calls a throwaway let. Delete the function and write its two lines where it's called, as one expression when that
  reads well, at every caller, tests included. Don't move the body into another wrapper, a trait impl, a match or a
  closure, and don't pad it differently: the review treats that as the same defect. When the body reads a private
  field from another module, give the field the visibility its callers need (pub(super), pub(crate) or pub), the way
  the rule already makes callers write a struct literal instead of calling a constructor. When a function's callers
  can't reach what its body uses without exposing a field that guards an invariant (a Mutex taken with its poison
  handling, a lock held across two calls), leave that function and its file on the list and name each one in notes
  with the reason; the architect decides those.


  An impl Trait argument becomes a named generic parameter with a where clause, as rule explicit-not-verbose says. An
  unnamed .into() names its target: Target::from(value). Neither changes behavior or a caller.


  Nothing a user can observe changes. Every existing test keeps passing unchanged apart from calls to a deleted
  function, and no test is deleted.
