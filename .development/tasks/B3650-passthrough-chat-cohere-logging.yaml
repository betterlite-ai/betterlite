oracle_cases: []
deviations:
  - what: LiteLLM's abstract class and subclass become a trait plus two structs, and the handlers take a typed input struct instead of **kwargs.
    why: Rust has no keyword spreading; B3606's adapter builds the struct from the same values.
  - what: A failed embed branch is caught as a typed error. LiteLLM's blanket `except Exception` also catches Python bugs such as a missing attribute.
    why: Rust has no runtime attribute errors, and the no-panics rule leaves typed errors as the only case.
  - what: The standard logging object is not pretty printed to the debug log here; B3630 does that for the chat path.
    why: The embed branch in LiteLLM never logs it either, so there is nothing to port.
out_of_scope:
  - "create_response_logging_payload, end_user_from_request_body and the ResponseLoggingKwargs type: B3630 owns them; this task calls them."
  - "The Anthropic, Vertex and Gemini handlers and their stream builders: B3631, B3634, B3638, B3639 and B3640 own them."
  - "The OpenAI override of _get_user_from_metadata and the two calls the OpenAI handler makes into passthrough_chat_handler: B3637 owns the OpenAI handler and calls this task's PassthroughChatLogger."
  - "CohereV2ChatConfig transform_response (B1416), the Cohere embedding parse and usage (B1417, B1418), the Cohere stream iterators (B1414), chunk_creator (B5653), ChunkShaper (B5652) and stream_chunk_builder (B2227)."
  - "The route predicate is_cohere_route and the success handler's dispatch: B3605 and B3606 own them."
  - "_get_user_from_metadata of the base class is the same code as B3630's end_user_from_request_body, so no second copy is built here."
pitfalls:
  - The Cohere stream builder uses the V1 CohereModelResponseIterator even for /v2/chat, and each chunk is a str, so a line that still starts with "data:" fails the JSON decode and the error escapes; only StopIteration and StopAsyncIteration are caught.
  - The embed route test needs "/v1/embed" present and "/v1/embeddings" absent, so "/v1/embed/xyz" is an embed route and "/v1/embeddings" is not.
  - request_body["texts"] wins only when it is truthy; an empty list or null falls to request_body["input"], which defaults to an empty list.
  - The embed branch calls get_standard_logging_object_payload and throws the result away, unlike the chat path that stores it in kwargs["standard_logging_object"] and rewrites the response id and model.
  - The embed branch sets only litellm_params["proxy_server_request"] (setdefault then update), so other litellm_params keys survive, where B3630's chat payload step writes the same key through its own rule.
  - A failed embed branch leaves kwargs["response_cost"], ["model"] and ["custom_llm_provider"] set, and the chat fallback receives them as its kwargs.
  - The embed branch writes cost to the response's _hidden_params["response_cost"] (creating the dict when missing) so later cost code does not price the response again.
  - handle_logging_llm_collected_chunks logs "Anthropic passthrough endpoint" for every provider, and it has no caller at the pin (the base class method is never reached); the method is built because B3630 and B3606 name it, but no case can reach it.
  - A list response body reaches the Cohere handler as an empty object (success_handler passes {} for non-dicts), so model falls to request_body or the empty string.
review_level: security
