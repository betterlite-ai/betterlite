dod:
  - text: passthrough_chat_handler picks the model from the request body, then the response body, then the empty string, transforms the reply through the provider, runs create_response_logging_payload and returns the transformed response with the kwargs; a transform error is returned.
    proof: [chat-tests]
  - text: handle_logging_llm_collected_chunks builds the response from the chunks and returns it with the payload kwargs; a None build logs the error text and returns no result and empty kwargs.
    proof: [chunks-tests]
  - text: The Cohere handler sends only routes containing "/v1/embed" and not "/v1/embeddings" to the embed branch and every other route to the chat handler.
    proof: [cohere-route-tests]
  - text: The embed branch runs its steps in order, takes texts before input, stores the cost in the hidden params, replaces only proxy_server_request, drops the standard logging object and writes the three call log values.
    proof: [cohere-embed-tests]
  - text: An error in the embed branch falls back to the chat handler with the kwargs the branch had already written, and a chat error after that is returned.
    proof: [cohere-fallback-tests]
  - text: The Cohere stream builder uses the V1 decoder, skips None chunks, stops at end of stream and returns other decode errors.
    proof: [cohere-stream-tests]
