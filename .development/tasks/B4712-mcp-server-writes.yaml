    why: Advisory lock-based write with collision check and transaction boundary enforcement.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L954-L974
    why: create_mcp_server with UUID generation, audit fields, and env var decryption on returned row.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L976-L1011
