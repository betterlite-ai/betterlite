id: B4712
title: MCP persistent writes, drafts and server deletion
description: >-
  Build persistent MCP server writes, draft lifecycle, and safe server deletion in betterlite-server::mcp::server_writes.
  Implement create_mcp_server, create_mcp_server_if_identifier_free, create_draft_mcp_server, update_mcp_server,
  delete_mcp_server, and supporting functions that manage the LiteLLM_MCPServerTable with full encryption lifecycle,
  advisory-lock collision detection on server_name/alias, draft TTL expiry, and per-user credential/OAuth cleanup
  on delete. Preserve LiteLLM's behavior on partial updates (exclude_unset semantics so omitted fields keep DB values),
  identifier-free inserts via advisory locks, draft-row transience (create-if-absent and prune-on-write), OAuth token
  purge on identity-change, and soft-error handling for orphaned credential cleanup. Support config keys
  litellm.mcp_tool_search, litellm_settings.mcp_tool_search for search config with top_k (default 5, range 1–100),
  similarity_threshold (default 0, range 0–1), embedding_model absent by default, and core_tools empty by default.
  Preserve legacy JSON coerce_top_k fallback. Encrypt global-scoped env vars at rest and manage credentials blob
  migration on auth_type changes. Database operations use Prisma transactions with pg_advisory_xact_lock for
  collision detection and best-effort cleanup on delete (credential rows, env var rows, OAuth client rows, token cache
  invalidation).
