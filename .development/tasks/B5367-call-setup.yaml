id: B5367
title: Call setup, dynamic callbacks, guardrail lists and deployment hooks
description: >-
  Every SDK call passes through `function_setup` before the provider sees it. It registers callbacks named in the request,
  builds the logging object, runs pre-call rules and cleans the messages. Build that step and the small functions around it
  in `crates/betterlite-sdk/src/call_setup.rs`, with submodules under `call_setup/`. B5368 calls all of it.


  `function_setup` (L981-L1344) takes the function name, a `Rules` value from B200, a start time and the request as a
  `serde_json::Map`, and returns the logging state from B247 with the changed request. A `callbacks` entry in the request is
  registered in the input, success, failure and async lists without duplicates. Async callables move to the async lists,
  and dynamodb and openmeter count as async. The dynamic success and failure callback entries are popped from the request.
  `logger_fn` is kept, the first message text comes from a match on the call type, pre-call rules run, thought signatures
  are removed for a non-Gemini target through B5366, and `turn_off_message_logging` is honored. The lists live in a
  `CallbackLists` struct the caller passes in, using the callback types B247 and B248 define.


  Callback bookkeeping: `custom_llm_setup` (L572-L581) adds each custom provider name to the provider list and the custom
  provider list when it is missing.
  `_add_custom_logger_callback_to_specific_event` (L584-L621), `_custom_logger_class_exists_in_success_callbacks`
  (L624-L639), `_custom_logger_class_exists_in_failure_callbacks` (L642-L657) and `_is_same_registered_custom_logger`
  (L660-L668) keep one logger per class and callback name. `get_dynamic_callbacks` (L722-L728) returns a copy of the global list with the request's entries added.


  Guardrails and credentials: `get_request_guardrails` (L671-L678) reads `metadata.requester_metadata.guardrails`.
  `get_applied_guardrails` (L681-L696) lists each named guardrail callback that is on by default or requested. `load_credentials_from_list`
  (L699-L719) finds `litellm_credential_name` through a `CredentialLookup` trait, copies the values into the request
  without replacing what the caller set, and returns a warning when no credential matches. B1601 supplies the real lookup.
  Credential values are `SecretString`.


  Deployment hooks (L1475-L1584) run over a `DeploymentHook` trait with three methods and a guardrail marker. An unknown
  call type becomes `None`. The pre-call hook passes a request copy through each callback and takes any non-empty result,
  and an error goes to the caller. The success hook does the same with the response, but logs an error and moves to the next
  callback unless that callback is a guardrail, and a guardrail's error goes to the caller. The failure hook drops
  `attempted_targets` from the request data, reads an integer `fallback_depth` from it, and logs every callback error.
  `_run_success_deployment_hook_on_converted_chat_stream` (L883-L906) runs the success hook on a converted stream.


  Correlation and request flags: a `CallOutcome` enum separates a finished response, a chat stream and a Responses API
  stream, so `_is_streaming_response_for_correlation` (L841-L873) and `_is_converted_stream_result` (L876-L880) are matches.
  `_restore_correlation_context_if_supported` (L826-L838) becomes a plain trait call since Rust has no stand-in objects.
  `_is_async_request` (L2318-L2348) tests acompletion, aembedding, aimg_generation, amoderation, atext_completion,
  atranscription, arerank, _arealtime, acreate_batch, acreate_fine_tuning_job, aresponses and is_pass_through.
  `_is_streaming_request` is L2361-L2373.


  Text helpers: `_ocr_document_summary` (L954-L971) reduces a document to a short log text. A data URL becomes
  "header (N chars)", other locations stay, a file gives its kind with a name or a byte count, and a non-mapping gives
  "default-message-value". The file input is a closed `OcrFile` enum. `get_logging_id` (L7952-L7957) gives
  "time-" plus `%H-%M-%S-%f` plus "_" plus the response id, or `None`. `print_args_passed_to_litellm` (L7909-L7949) returns
  the debug text as `Option<String>`, skips the inner call of an async pair, and runs B244's
  `redact_credentials_in_payload` on the request first.


  The oracle operation is `b5367`. Its Python adapter sets `litellm.callbacks` and the callback lists to fixture stubs,
  calls the `litellm.utils` function and reports the changed request and the lists by name.
scope:
  paths:
  - crates/betterlite-sdk/Cargo.toml
  - crates/betterlite-sdk/src/call_setup.rs
  - crates/betterlite-sdk/src/call_setup/**
  - tools/oracle/cases/helpers/call-setup/**
  - "tools/oracle/fuzz/corpus/helper_case/call_setup-*"
  - tools/oracle/helpers/b5367.py
  - tools/oracle/helpers/b5367/**
  - tools/oracle/src/helpers/sdk/b5367.rs
  - tools/oracle/src/helpers/sdk/b5367/**
  lint_tables: false
