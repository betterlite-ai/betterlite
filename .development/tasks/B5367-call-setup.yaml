dod:
- text: >-
    A `callbacks` entry lands in the same lists as in LiteLLM with no duplicates, and two loggers of one class with
    different callback names both stay.
  proof: [callback-lists, oracle, helper-python]
- text: >-
    `function_setup` leaves the same request and lists as LiteLLM for a chat call, a text call, an embedding call and a call
    with dynamic success and failure callbacks.
  proof: [function-setup, oracle, helper-python]
- text: A failing pre-call rule stops the call with LiteLLM's error, before any provider call.
  proof: [function-setup, oracle, helper-python]
- text: >-
    Guardrail lists match LiteLLM for default-on and requested guardrails, and a guardrail not listed anywhere is left out.
  proof: [guardrail-lists, oracle, helper-python]
- text: >-
    `load_credentials_from_list` copies values only where the request has none, warns on an unknown name, and the Debug
    text of the result shows no credential value.
  proof: [credential-list, oracle, helper-python]
- text: >-
    The pre-call hook surfaces a callback error, the success hook surfaces only a guardrail's error, and the failure hook
    surfaces none and never gives a callback `attempted_targets` or a way to change the caller's error.
  proof: [deployment-hooks]
- text: Async and streaming flags match LiteLLM for every listed key.
  proof: [request-flags, oracle, helper-python]
- text: >-
    The OCR summary, logging id and debug text match the source, and the debug text never holds an API key from the request.
  proof: [text-helpers]
- text: New helper corpus seeds call `b5367` and replay through the shared parser.
  proof: [helper-case-corpus]
checks:
  optional: []
  commands:
  - id: callback-lists
    why: A callback is lost, doubled or put in the wrong list.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^call_setup::.*callback/)'
  - id: function-setup
    why: The setup order or the changed request differs.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^call_setup::.*function_setup/)'
  - id: guardrail-lists
    why: A guardrail runs that nobody asked for, or one is skipped.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^call_setup::.*guardrail_list/)'
  - id: credential-list
    why: Credentials overwrite caller values or show up in text.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^call_setup::.*credential/)'
  - id: deployment-hooks
    why: A hook's error rule is swapped with another's.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^call_setup::.*deployment_hook/)'
  - id: request-flags
    why: A call is treated as sync or non-streaming by mistake.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^call_setup::.*request_flag/)'
  - id: text-helpers
    why: Log text changes or a key slips through.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^call_setup::.*(ocr_summary|logging_id|debug_text)/)'
  - id: helper-python
    why: This proves a real b5367 adapter exists and type checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5367)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers/b5367 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5367/pyrightconfig.json
  - id: helper-case-corpus
    why: Parsing seeds for b5367 have to replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/call_setup-*")"
      && grep -lE '^[[:space:]]+b5367:' tools/oracle/fuzz/corpus/helper_case/call_setup-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
