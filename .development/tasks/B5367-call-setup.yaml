- tools/oracle/cases/helpers/call-setup/guardrail-lists.yaml
- tools/oracle/cases/helpers/call-setup/credential-list.yaml
- tools/oracle/cases/helpers/call-setup/request-flags.yaml
deviations:
- what: >-
    `_snapshot_exception_for_hook` L129-L151 and `_accepts_fallback_depth_kwarg_for_class` L117-L126 are not built. A failure
    callback gets a shared reference to the error, and the trait method always takes `fallback_depth`.
  why: A shared reference can't change the caller's error, and a Rust trait has one signature, so neither Python workaround applies.
- what: The debug text shows request values as JSON, where LiteLLM uses Python `repr`.
  why: It's a debug line. Nothing parses it.
- what: Callback lists, the credential lookup and the debug flag come in as arguments.
  why: The inject-dependencies rule bars the module-level lists LiteLLM reads.
out_of_scope:
- >-
  The wrapper that calls this code is B5368. `check_coroutine` L1470-L1472 is not built, because Rust's async is in the type.
- The real credential store is B1601, and the Python names for these functions arrive with B158 and B166.
- Owners for the rest of litellm/utils.py are in the B157 inventory.
pitfalls:
- >-
  The three deployment hooks have three error rules on purpose. Don't share one loop between them: a broken logger must
  not fail a finished request, and a guardrail's block must.
- >-
  `attempted_targets` is shared across every fallback hop. If a failure callback could record on it, the router would skip
  a deployment it never tried.
- >-
  Sync calls never stamp correlation ids (`supports_correlation_logging=False`), and only the async wrapper asks whether
  a result is a stream. A plain thread is reused across requests, so a sync stamp would land on a later request's logs.
- '`_is_same_registered_custom_logger` compares the exact class, so a subclass is a different logger.'
- Redact before formatting in the debug text. A value formatted first can't be taken back out.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
