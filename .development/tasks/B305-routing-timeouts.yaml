- tools/oracle/cases/routing/routing-timeouts/cancellation-stops-upstream.yaml
deviations: []
out_of_scope:
- Retry scheduling, which B017 composes with this timeout plan.
- HTTP connection-pool policy already owned by B009.
- 'litellm/timeout.py timeout/decorator/wrapper/async_wrapper and _LoopWrapper.__init__/run/stop_loop
  are uncalled at the pin: rg found no imports or @timeout uses in litellm/. No replacement or bug fix
  is required.'
- 'litellm/timeout.py: No callers at the pinned commit; no implementation is required: timeout (L24-L88),
  timeout.decorator (L39-L86), timeout.decorator.wrapper (L41-L64), timeout.decorator.wrapper.async_func
  (L42-L43), timeout.decorator.async_wrapper (L67-L82), _LoopWrapper.__init__ (L99-L101), _LoopWrapper.run
  (L103-L112), _LoopWrapper.stop_loop (L114-L117).'
pitfalls:
- B004's prose default is provisional; the pinned completion helper distinguishes an unset timeout from
  explicit 6000.
- Do not reset an overall deadline when an attempt changes deployments.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
