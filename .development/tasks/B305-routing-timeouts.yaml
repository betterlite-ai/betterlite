id: B305
title: Resolve router and provider timeouts
description: Replace the provisional B004 timeout resolution with a typed timeout plan shared by router
  attempts and B009 transport calls. Preserve whether the global request timeout was explicitly configured,
  including an explicitly configured default numeric value. Distinguish whole routing deadline, individual
  attempt timeout and streaming timeout; convert decimal seconds with checked arithmetic. Wire cancellation
  through the existing stream and client layers. The standalone timeout decorator's ignored async override
  is not a contract to silently copy; record the explicit correction below and keep its regression outside
  parity comparisons. Use the existing Rust crate boundaries from B004 and B008; integrate through the
  server when the provider dispatcher or callbacks live in another core crate. This task's source slices
  are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target
  and committed corpus for every newly accepted config form; unsupported keys still fail by full path.
  Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle cases are
  budget-excluded by checks.yaml. Extend B004's typed chat request fields only for the routing controls
  this task consumes, and extend its existing chat_request fuzz corpus; router-only fields never reach
  the provider body.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-http/**
  - crates/betterlite-openai/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/routing-timeouts/**
  - tools/oracle/src/router_probes/routing_timeouts/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/routing_timeouts.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/completion_timeout.py#L12-L70
  why: Provider completion timeout fallback and precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/request_timeout_resolver.py#L19-L29
  why: Explicit global setting distinction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4122-L4162
  why: Router stream and nonstream precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/timeout.py#L24-L104
  why: Standalone decorator and its async override discrepancy.
dod:
- text: Every listed case compares production behavior against pinned LiteLLM; any declared difference
    asserts exact reference and Rust outcomes through B361 instead of ignoring the difference.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the routing_timeouts prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
- text: Routing controls have valid and invalid chat parser corpus seeds and are consumed before upstream
    serialization.
  proof:
  - chat-corpus
  - oracle
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(routing_timeouts)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
  - id: chat-corpus
    why: routing request controls lack chat parser corpus coverage or replay fails
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
oracle_cases:
- tools/oracle/cases/routing/routing-timeouts/unset-versus-explicit-6000.yaml
- tools/oracle/cases/routing/routing-timeouts/model-versus-request-timeout.yaml
- tools/oracle/cases/routing/routing-timeouts/stream-precedence.yaml
- tools/oracle/cases/routing/routing-timeouts/transport-read-timeout.yaml
- tools/oracle/cases/routing/routing-timeouts/attempt-408.yaml
- tools/oracle/cases/routing/routing-timeouts/cancellation-stops-upstream.yaml
deviations:
- what: A configured force_timeout bounds the async operation rather than only changing the timeout error
    text.
  why: The pinned standalone async decorator calculates an override but passes timeout_duration to wait_for;
    betterlite must enforce configured waits.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/timeout.py#L81-L104
out_of_scope:
- Retry scheduling, which B017 composes with this timeout plan.
- HTTP connection-pool policy already owned by B009.
pitfalls:
- B004's prose default is provisional; the pinned completion helper distinguishes an unset timeout from
  explicit 6000.
- Do not reset an overall deadline when an attempt changes deployments.
- The architect must acknowledge the standalone async override correction before dispatch.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
