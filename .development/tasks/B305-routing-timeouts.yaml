id: B305
title: Resolve router and provider timeouts
description: 'Replace the provisional B004 timeout resolution with a typed timeout plan shared by router
  attempts and B009 transport calls. Preserve whether the global request timeout was explicitly configured,
  including an explicitly configured default numeric value. Distinguish whole routing deadline, individual
  attempt timeout and streaming timeout; convert decimal seconds with checked arithmetic. Wire cancellation
  through the existing stream and client layers. Configuration boundary keys introduced or consumed here:
  timeout, stream_timeout, request_timeout. Pinned declaration defaults: timeout=None; stream_timeout=None.
  Resolve env values once in betterlite-config, never in router code. Implement the owned native service
  in crates/betterlite-router/src/routing_timeouts.rs. Add ProbeOperation::RoutingTimeouts in tools/oracle/src/router_probes/mod.rs
  and the corresponding B305 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/litellm_core_utils/completion_timeout.py:
  CompletionTimeout._fallback_when_no_explicit_timeout (L17-L30), CompletionTimeout.resolve (L33-L70).
  Implement these behaviors through the typed Rust services above; synchronous facades and structural
  accessors reuse the same primitive instead of separate ports. Function coverage in litellm/litellm_core_utils/request_timeout_resolver.py:
  get_configured_request_timeout (L20-L29). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
