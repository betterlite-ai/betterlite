  why: Router stream and nonstream precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4156-L4247
  why: Previously uncovered helper owned by this task.
dod:
- text: Write tests named routing_timeouts_behaviors and routing_timeouts_boundaries under routing_timeouts::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - routing-timeouts-behaviors
  - routing-timeouts-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/routing-timeouts-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/routing-timeouts-invalid.yaml;
    the valid seed contains timeout. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - routing-timeouts-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-timeouts-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::routing_timeouts_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: routing-timeouts-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::routing_timeouts_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/routing_timeouts.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/routing_timeouts.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/routing-timeouts-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/routing-timeouts-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/routing-timeouts-" && grep -Fq 'timeout' crates/betterlite-config/fuzz/corpus/config_yaml/routing-timeouts-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/routing-timeouts/unset-versus-explicit-6000.yaml
- tools/oracle/cases/routing/routing-timeouts/model-versus-request-timeout.yaml
- tools/oracle/cases/routing/routing-timeouts/stream-precedence.yaml
- tools/oracle/cases/routing/routing-timeouts/transport-read-timeout.yaml
