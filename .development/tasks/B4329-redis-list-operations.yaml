id: B4329
title: Push and drain Redis lists across Redis and Valkey versions
description: >-
  Implement async_rpush, async_rpush_and_trim, async_rpush_pipeline and async_lpop methods
  that move elements through Redis lists with version-dependent behavior. Preserve the distinction
  between Redis >= 7.0 (LPOP with count parameter) and Redis < 7.0 (single LPOP loop through
  pipelines), including the regrouping of flat results back to per-key lists. Handle byte-to-string
  decoding with a fallback when decoding fails, and propagate command errors without retrying
  an ambiguously applied push or pop. Inject circuit breaker guards and service success/failure
  hooks; operate on namespaced keys and parse the Redis version from cache state.


  Configuration boundary keys consumed: LITELLM_REDIS_MAJOR_VERSION (integer, default from
  B002). This task owns no new keys. Spend queues depend on these operations to move entries
  through Redis lists, and the service hooks inject observability without circular dependencies.


  Owned functions in litellm/caching/redis_cache.py:

  - `:2052-2103` async_rpush with circuit breaker, namespace fix, timing, success/failure hooks
  - `:2105-2150` async_rpush_and_trim with transactional RPUSH+LTRIM pipeline
  - `:2152-2166` _pipeline_rpush_helper that enqueues namespaced RPUSH commands
  - `:2168-2225` async_rpush_pipeline with per-operation isolation and error propagation
  - `:2227-2238` handle_lpop_count_for_older_redis_versions that loops LPOP for Redis < 7
  - `:2240-2302` async_lpop with version check, byte decoding, hooks and error handling
  - `:2304-2361` _pipeline_lpop_helper that regroupes flat results for older Redis versions
  - `:2363-2420` async_lpop_pipeline with per-operation results and error propagation


  Direct dependencies: B393 `_redis_circuit_breaker_guard` and `log_redis_failure` wrap and
  log failures; B4324 `check_and_fix_namespace`, `_parse_redis_major_version` and
  `_get_call_stack_info` supply namespace, version and diagnostic projections; B4325
  `_async_commands` supplies the reusable Redis transport; B012 supplies `service_logger_obj` injected
  service hooks. B4290 must cover the RedisPipelineRpushOperation and RedisPipelineLpopOperation
  record contracts (key, values; key, count). No async task, queue or timeout for list operations
  is owned here; timeouts come from the Redis client and the circuit breaker.


  Valkey is wire-compatible transport plus numeric version parsing here, not a separate semantic
  backend. The single-pop loop for Redis < 7 preserves positional LPOP results in order; the newer
  bulk pipeline regrouping preserves which results belong to which operation.


  Configuration keys: the Redis major version comes from B002's DEFAULT_REDIS_MAJOR_VERSION
  config binding (B002 env LITELLM_REDIS_MAJOR_VERSION, default 7 as integer). This task
  reads it once through the injected version parser and uses it to dispatch between code paths.
  No new config keys, env vars or defaults are introduced.
