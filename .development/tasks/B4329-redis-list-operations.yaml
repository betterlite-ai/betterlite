deviations:
  - what: >-
      RedisPipelineRpushOperation and RedisPipelineLpopOperation record contracts are specified
      in litellm/types/caching.py and must be resolved by B4290 (not yet materialized as a concrete
      task). Until then, define these TypedDicts locally: RedisPipelineRpushOperation with fields
      {"key": str, "values": Sequence[Any]} and RedisPipelineLpopOperation with fields
      {"key": str, "count": int | None}.
    why: >-
      B4290 is proposed in the outline but has no task file yet. These record contracts are
      essential for the pipeline method signatures. betterlite must define them locally or
      through B4329's scope until B4290 materializes.
  - what: >-
      Service logging hooks (async_service_success_hook, async_service_failure_hook) are
      supplied by B012. This task assumes B012's logging_pipeline integration is available
      and that service_logger_obj is injected into RedisCache at construction.
    why: >-
      B012 owns the complete service event dispatch and hook registry. This task integrates with
      that existing infrastructure and does not reimplement service logging.
  - what: >-
      In the older Redis < 7 path, handle_lpop_count_for_older_redis_versions loops LPOP commands
      through a single pipeline with one execute() per iteration. A more efficient design would
      batch all commands and execute once; betterlite preserves the pinned behavior to keep the
      positional order of pops stable.
    why: LiteLLM's single-pop loop gives callers a predictable order even under list mutations; a faster batch could reorder results if the list changes between commands.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/redis_cache.py#L2227-L2238
  - what: Pipeline RPUSH and LPOP operations raise on the first error without attempting recovery. No retry or partial success is available; the entire pipeline fails.
    why: LiteLLM does not retry failed list operations. A partial success would require splitting the caller's operation semantics by position, which is not specified.
out_of_scope:
  - B393 owns the circuit breaker guard and failure logging that wraps these operations.
  - B4324 owns the namespace fix, version parsing and call stack extraction.
  - B4325 owns the _async_commands transport and client reuse contract.
  - B4290 owns the RedisPipelineRpushOperation and RedisPipelineLpopOperation type contracts (not yet materialized).
  - B012 owns the ServiceLogging hook injection and async emission.
  - Spend queue buffering and flushing belongs to the callers, not list operations themselves.
pitfalls:
  - >-
      The oracle helper for this task is pre-registered as b4329 in the redis group. Replace the
      stub Op in tools/oracle/src/helpers/redis/b4329.rs with an impl Helper whose Input captures
      the operation parameters, and write run in tools/oracle/helpers/b4329.py to invoke betterlite's
      list methods and return typed output. The registry files (helpers/mod.rs, redis/mod.rs,
      dispatch.py) are not this task's to edit.
  - "Redis < 7.0 has no count parameter on LPOP: the handle_lpop_count_for_older_redis_versions loop must execute the pipeline after each LPOP command, not batch all commands and execute once, to preserve positional order."
  - "The _pipeline_lpop_helper regrouping for Redis < 7 must filter None values per-key and collect them back into a list. A None at the end of a list signals an empty slot, not the end of results."
  - "Byte-to-string decoding must not panic on decode failure. The code catches UnicodeDecodeError and returns the original bytes, matching LiteLLM's fallback."
  - "Service hooks fire after the operation completes, not before. They are asyncio.create_task calls, so the main request does not wait for them; the logger must be prepared for concurrent hook firings."
  - "RPUSH and LPOP errors propagate directly without retry. Do not add exponential backoff or retry loops; the circuit breaker handles repeated failures at a higher level."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
