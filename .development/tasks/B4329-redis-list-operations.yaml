dod:
  - text: Write tests named list_operations_behaviors covering RPUSH, transactional RPUSH+LTRIM, pipelined RPUSH and LPOP. Table tests with rstest compare Redis >= 7 and Redis < 7 dispatch, byte decoding, empty lists, and error propagation.
    proof:
      - list-operations-behaviors
  - text: Every listed oracle case exercises the production operation and asserts exact list state, decoded values, per-operation results, and error codes; only /error/message may be ignored for betterlite wording.
    proof:
      - oracle
  - text: Per-operation pipeline LPOP results stay isolated even when one operation's list is empty. The flat-result regrouping for Redis < 7 preserves positional correspondence for each operation.
    proof:
      - oracle
      - list-operations-behaviors
  - text: Byte-to-string decoding preserves the fallback when UTF-8 decode fails; the original bytes are returned.
    proof:
      - oracle
      - list-operations-behaviors
  - text: Command errors in pipelines raise immediately without silent swallow; the circuit breaker's failure recording happens only on the outer operation.
    proof:
      - oracle
      - list-operations-behaviors
  - text: Service success and failure hooks fire with timing, operation name and call stack info, and are called via async fire-and-forget (create_task) without blocking.
    proof:
      - oracle
      - list-operations-behaviors
checks:
  optional: []
  commands:
    - id: list-operations-behaviors
      why: the list operations behavior test is missing or fails
      run: cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(/::list_operations_behaviors(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: layering
      why: deny.toml does not keep betterlite-redis behind betterlite
      run: grep -qE 'crate = "betterlite-redis", wrappers = \["betterlite"\]' deny.toml
