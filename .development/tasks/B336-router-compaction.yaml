id: B336
title: Complexity routing through context compaction
description: 'Integrate B100 compaction with B385 typed summary inputs and B386 context-fit checks. Own
  pending state, recursion protection, native/client-managed routing, authorized summary calls and post-summary
  revalidation. Adapt through server services for B080/B081, charge B068/B012 caller cost and preserve
  cancellation. Keep the integration adapter in betterlite-server in this task module; consume predecessor
  public interfaces without editing their implementation crates. Configuration boundary keys introduced
  or consumed here: context_compaction. Pinned declaration defaults: context_compaction=ContextCompactionConfig.
  Resolve env values once in betterlite-config, never in router code. Implement the owned native service
  in crates/betterlite-router/src/router_compaction.rs. Add ProbeOperation::RouterCompaction in tools/oracle/src/router_probes/mod.rs
  and the corresponding B336 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/context_compaction.py:
  CompactionExecutor.__call__ (L51-L53), surface_for_call (L68-L69), native_compaction_call (L79-L86),
  native_compaction_parent (L89-L91), initialize_compaction_state (L94-L96), arm_compaction (L99-L123),
  _has_compactor (L126-L138), _client_managed (L141-L150), is_native_compaction_call (L153-L154), reject_recursive_compactor
  (L157-L159), compaction_pending (L162-L164), _reject (L167-L170), _generate_summary (L317-L336), compact_to_fit
  (L360-L371), _check_client_managed_admission (L374-L387), _compact_to_fit (L416-L515). Implement these
  behaviors through the typed Rust services above; synchronous facades and structural accessors reuse
  the same primitive instead of separate ports.'
