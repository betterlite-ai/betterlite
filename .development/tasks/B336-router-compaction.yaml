out_of_scope:
- B100's general compression API.
- Changing the user's tool outputs beyond the pinned compaction contract.
- B385 owns compaction history partition and fit inputs; consume its tested public interface.
- 'litellm/router_strategy/complexity_router/context_compaction.py: B385 owns: _unavailable (L173-L176),
  _blocks (L179-L181), _tool_ids (L184-L202), _history (L205-L232), _count (L235-L241), _budget (L244-L263),
  _compactor_model (L266-L297), _native_prefix (L300-L314), _compactor_input (L339-L357), _portable_history
  (L390-L413).'
pitfalls:
- Do not implement a second summarizer or a new provider endpoint in this task.
- A successful summary can still exceed the target context and must be checked again.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
