id: B336
title: Complexity routing through context compaction
description: 'Integrate B3545 native compaction with B385 typed summary inputs and B386 context-fit checks. Own
  arming, recursion protection, native/client-managed routing, authorized summary calls and post-summary
  revalidation. Adapt through server services for B080/B081, charge B068 caller cost and preserve
  cancellation. Keep the integration adapter in betterlite-server in this task module; consume predecessor
  public interfaces without editing their implementation crates. B10153 parses context_compaction into
  config.sections.router_compaction (ContextCompactionConfig, Off for false or null) and builds the state in
  betterlite-router compaction_state: CompactionState, SharedCompactionState, initialize_compaction_state, client_managed
  and compaction_pending. This task arms that state, picks the summary handle its Summary type parameter holds,
  fills it and calls those names; it never builds a second state or a second client-managed check. Implement the owned native service
  in crates/betterlite-router/src/router_compaction.rs. B301 registers ProbeOperation::RouterCompaction and its Python entry as stubs, so fill only tools/oracle/src/router_probes/router_compaction.rs and tools/oracle/litellm/probes/router_compaction.py and leave mod.rs and registry.py as they are; the adapters only call
  production services. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/context_compaction.py:
  surface_for_call (L68-L69), arm_compaction (L99-L123),
  _has_compactor (L126-L138), reject_recursive_compactor
  (L157-L159), _reject (L167-L170), _generate_summary (L317-L336), compact_to_fit
  (L360-L371), _check_client_managed_admission (L374-L387), _compact_to_fit (L416-L515). Implement these
  behaviors through the typed Rust services above; synchronous facades and structural accessors reuse
  the same primitive instead of separate ports. B10084 builds the executor trait and the child-call scope in
  betterlite-router compaction_executor: CompactionExecutor (L51-L53) with CompactionExecutorError,
  native_compaction_call (L79-L86), native_compaction_parent (L89-L91) and is_native_compaction_call (L153-L154).
  Call them from there: _generate_summary runs the executor or the direct dispatch inside
  native_compaction_call(None, None, ...), the native-child checks of _compact_to_fit and reject_recursive_compactor
  read is_native_compaction_call, and an executor failure is answered as the BadRequestError it stands for.
  Leave strategy.rs, context.rs, routes.rs and state.rs as they are and build only in the modules this task owns; B366 composes this service.
  B8630''s RouterCompletion compaction adapter hands the request back unchanged until this task lands; replace it
  in crates/betterlite-server/src/app/inference/router_completion with one over compact_to_fit that passes None for
  the executor, since no gateway chat, messages or responses request reaches RouterCompletion''s attempt (the chat
  route dispatches through B014''s ChatExecutor) and B9810 passes the loopback executor on the route path instead.'
