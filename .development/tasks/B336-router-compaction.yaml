id: B336
title: Complexity routing through context compaction
description: Integrate B100's existing compaction implementation with complexity-router context placement.
  Add typed compaction configuration, a request-owned pending state and recursion protection; adapt the
  native Messages/Responses and portable chat histories without altering provider-specific parsers. Preserve
  complete tool call/result pairs, protected system context and post-compaction fit validation. Charge
  the internal compactor call to the original caller through B068/B012. Use the existing Rust crate boundaries
  from B004 and B008; integrate through the server when the provider dispatcher or callbacks live in another
  core crate. This task's source slices are the linked ranges, not a port of their Python classes. Add
  the listed oracle cases and the matching adapters to B301's component runner where state is not observable
  over HTTP; adapters call production logic and never reproduce it. Use deterministic candidate sets or
  supplied random samples for comparisons, and separate seeded distribution tests for random choices.
  Extend the existing config_yaml fuzz target and committed corpus for every newly accepted config form;
  unsupported keys still fail by full path. Keep the implementation, adapters and tests within 800 changed
  lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/router-compaction/**
  - tools/oracle/src/router_probes/router_compaction/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/router_compaction.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/context_compaction.py#L68-L170
  why: Native surface mapping, client-managed modes and recursion guard.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/context_compaction.py#L184-L357
  why: History pairs, budgets and summarizer call.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/context_compaction.py#L360-L515
  why: Compaction execution and final admission.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the router_compaction prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(router_compaction)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/router-compaction/native-versus-portable.yaml
- tools/oracle/cases/routing/router-compaction/client-managed-compaction.yaml
- tools/oracle/cases/routing/router-compaction/tool-pairs-kept.yaml
- tools/oracle/cases/routing/router-compaction/recursive-compactor-rejected.yaml
- tools/oracle/cases/routing/router-compaction/summary-fit-recheck.yaml
- tools/oracle/cases/routing/router-compaction/summary-timeout.yaml
- tools/oracle/cases/routing/router-compaction/no-compactor-available.yaml
- tools/oracle/cases/routing/router-compaction/caller-cost-attribution.yaml
deviations: []
out_of_scope:
- B100's general compression API.
- Changing the user's tool outputs beyond the pinned compaction contract.
pitfalls:
- Do not implement a second summarizer or a new provider endpoint in this task.
- A successful summary can still exceed the target context and must be checked again.
- B100's exact adapter paths must be added by the architect if its implementation is outside the scoped
  crates.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
