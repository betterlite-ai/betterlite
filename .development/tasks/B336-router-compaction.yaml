- Changing the user's tool outputs beyond the pinned compaction contract.
- B385 owns compaction history partition and fit inputs; consume its tested public interface.
- 'litellm/router_strategy/complexity_router/context_compaction.py: B385 owns: _unavailable (L173-L176),
  _blocks (L179-L181), _tool_ids (L184-L202), _history (L205-L232), _count (L235-L241), _budget (L244-L263),
  _compactor_model (L266-L297), _native_prefix (L300-L314), _compactor_input (L339-L357), _portable_history
  (L390-L413).'
- 'litellm/router_strategy/complexity_router/context_compaction.py: B10084 owns CompactionExecutor.__call__ (L51-L53)
  with CompactionExecutorError, native_compaction_call (L79-L86), native_compaction_parent (L89-L91) and
  is_native_compaction_call (L153-L154). This task calls them.'
- 'litellm/router_strategy/complexity_router/context_compaction.py and config.py: B10153 owns CompactionState (L59-L65),
  initialize_compaction_state (L94-L96), _client_managed (L141-L150), compaction_pending (L162-L164), ContextCompactionConfig
  (config.py L844-L850) and _normalize_context_compaction (config.py L1342-L1343). This task calls them.'
pitfalls:
- Do not implement a second summarizer or a new provider endpoint in this task.
- A successful summary can still exceed the target context and must be checked again.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
- "The entry that asks for a summary receives B8291's compaction loopback executor as an argument, typed by B10084's CompactionExecutor trait. B8291 builds that executor in betterlite-server, above this crate, so this task never builds or imports it."
- "compact_to_fit takes the executor as `Option<&dyn CompactionExecutor>` on every call, standing in for LiteLLM's compaction_executor context variable: None is the direct router dispatch of L317-L336. B9810 passes the loopback executor on the gateway routes, and B8630's adapter for B6020's and B6021's compaction port passes None."
- "B10084's CompactionExecutor::execute takes four arguments, `protocol`, `payload`, `parent_model` and `logging_disabled: bool`. Decide the flag right before the summary starts, as L486-L499 does: betterlite_logging::spend_bodies::redaction::should_redact_message_logging with the parent payload as litellm_params, the dynamic callback params B188's logging_privacy::request builds from that payload, and litellm_settings.turn_off_message_logging (default false) taken in the service's constructor, then OR it with the PrivacyContext the call already carries (B188). Pass that one value to the executor, and run the direct dispatch under the same PrivacyContext. Add betterlite-logging to crates/betterlite-router/Cargo.toml if it is not there yet."
- "The summary request's metadata keeps user_api_key_auth only when no executor is given (L465-L475): the loopback child authenticates again from the parent's headers."
review_level: standard
