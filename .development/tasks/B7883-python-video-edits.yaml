id: B7883
title: Python video characters, edit, extension and the videos package
description: >-
  This is the last part of the videos entry. It adds `video_create_character`, `avideo_create_character`, `video_get_character`, `avideo_get_character`, `video_edit`, `avideo_edit`, `video_extension` and `avideo_extension`, `videos/utils.py` and the `videos` package files (`main.py`, `__init__.py`). Rust runs the provider calls (B3341 characters, B3342 edit and extension).


  Native side, the family `video_edits`: `src/video_edits.rs` with `register` that adds `NativeVideoEditSession` and `NativeVideoEditError`, and `src/video_edits/convert.rs` with tests `request_*` and `error_*`. The architect writes the `lib.rs` line.


  Python side, `python/betterlite/videos/_edits.py` and `_utils.py`, plus `main.py` and `__init__.py` that re-export the names of B7882 and this task. Character create takes a name and a video file (bytes, path or open file) and defaults to OpenAI with a 600 second timeout, like the source. `utils.py` (L1-L98) holds request parameter helpers that become plain functions with the same output. Python objects that cannot cross to Rust (`client`, `shared_session`) raise `UnsupportedCallArgument` from B158.
scope:
  paths:
  - crates/betterlite-python/src/video_edits.rs
  - crates/betterlite-python/src/video_edits/**
  - crates/betterlite-python/python/betterlite/_native_video_edits.pyi
  - crates/betterlite-python/python/betterlite/videos/_edits.py
  - crates/betterlite-python/python/betterlite/videos/_utils.py
  - crates/betterlite-python/python/betterlite/videos/main.py
  - crates/betterlite-python/python/betterlite/videos/__init__.py
  - crates/betterlite-python/tests/test_videos_edits.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L1086-L1340
  why: character create and get, sync and async
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/main.py#L1341-L1611
  why: video_edit and video_extension, sync and async
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/utils.py#L1-L98
  why: request parameter helpers
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/videos/__init__.py#L1-L43
  why: the exported names
dod:
- text: Every function keeps LiteLLM's name and parameters, and a keyword LiteLLM refuses is refused here.
  proof: [videos-edits-signature]
- text: "Characters, edits and extensions return the same objects as LiteLLM, and the package exports every name of both video parts."
  proof: [videos-edits-calls]
- text: A provider error keeps its class and cause, and an unsupported Python object raises `UnsupportedCallArgument`.
  proof: [videos-edits-errors]
- text: The native register function and conversion have tests without an interpreter.
  proof: [videos-edits-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: videos-edits-signature
    why: A caller's keyword is accepted or refused wrongly.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_videos_edits.py -k signature
  - id: videos-edits-calls
    why: A result differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_videos_edits.py -k calls
  - id: videos-edits-errors
    why: An error class or message changes.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_videos_edits.py -k 'error or unsupported'
  - id: videos-edits-native
    why: A field changes on the way.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^video_edits::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Strict typing has to hold for these calls.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Each function keeps the 600 second default timeout only for the character calls.
  why: The source does so, and the other calls use the standard timeout.
- what: This task has no helper oracle cases.
  why: The functions call a native session, so pytest compares both packages against one local server.
out_of_scope:
- "Generation, content, remix, list and status are B7882."
- "Provider execution belongs to B3341 and B3342."
pitfalls:
- "`video_get_character` takes a character id and no video file."
- "`video_extension` and `video_edit` take a video id or a file, and both need `prompt`."
- "`videos/__init__.py` also exports the typed request classes. They come from B167."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
