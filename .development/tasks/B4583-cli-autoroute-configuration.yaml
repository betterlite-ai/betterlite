  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/wizard.py#L1-L88
    why: The interactivity check, the fuzzy picker's single- and multi-select behavior, and keyword parsing.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/wizard.py#L75-L87
    why: The keyword-tier prompt's per-tier defaults and its comma-splitting parse.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/wizard.py#L93-L175
    why: Master-key persistence across reconfigures and run_configure_wizard's full orchestration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/wizard.py#L115-L118
