id: B4583
title: Local autoroute configuration and interactive tier selection
description: >-
  Build the autoroute configuration and wizard modules for betterlite-cli, letting a user
  discover the chat and embedding models their key can reach, assign models to complexity
  tiers, and generate the ephemeral proxy's model_list. autoroute::config defines the
  DiscoveredModel, AutorouteConfig, ClassifierChoice and SemanticMatchingChoice types plus
  the closed Tier enum (Simple, Medium, Complex, Reasoning), validates that a config
  references only discovered models through a ConfigError, and builds the generated
  model_list: one litellm_proxy/* deployment per referenced model, deduplicated and sorted
  by name, plus one deployment named by the literal string "autorouter". autoroute::wizard
  defines the ModelDiscoveryClient and Prompter traits the interactive flow runs against,
  and run_configure_wizard, which discovers models through the injected client, prompts for
  each tier's models through the injected Prompter (backed by the inquire crate's fuzzy
  Select and MultiSelect in production, a scripted fake in tests), optionally configures an
  LLM classifier and semantic keyword matching, and writes the generated document to the
  path autoroute::paths resolves under a caller-supplied home directory. autoroute::paths
  exports the four functions (autoroute_dir, config_path, log_path, pid_record_path) that
  this module and B4584's process lifecycle code both resolve paths through. Preserve the
  literal "autorouter" model name, the deduplicated and sorted deployment list, reusing a
  persisted master_key across reconfigures, the per-tier keyword defaults for semantic
  matching, and match_threshold's 0.5 default, which the wizard never prompts for. The
  is_interactive flag is an injected parameter, not a direct terminal check; the wizard
  calls B192's ensure_private_dir and B4575's secure_create to write the file.

scope:
  paths:
    - crates/betterlite-cli/src/autoroute/config.rs
    - crates/betterlite-cli/src/autoroute/config/**
    - crates/betterlite-cli/src/autoroute/wizard.rs
    - crates/betterlite-cli/src/autoroute/wizard/**
    - crates/betterlite-cli/src/autoroute/paths.rs
    - crates/betterlite-cli/src/autoroute/paths/**
    - crates/betterlite-cli/Cargo.toml
    - Cargo.lock
  lint_tables: false
