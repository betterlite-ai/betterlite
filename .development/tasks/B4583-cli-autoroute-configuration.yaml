  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/config.py#L48-L93
    why: Classifier and semantic matching types (HeuristicClassifier, LLMClassifier, SemanticMatching, etc.) and DEFAULT_KEYWORD_TIER_RULES.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/config.py#L95-L132
    why: AutorouteConfig's field set and validate_config's checks, one per field that can name an unknown model.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/config.py#L134-L198
    why: Model list generation with _litellm_proxy_deployment, build_generated_model_list with deduplication and sorted names.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/config.py#L215-L230
