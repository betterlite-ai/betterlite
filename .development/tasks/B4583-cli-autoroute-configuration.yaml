id: B4583
title: Local autoroute configuration and interactive tier selection
description: >-
  Build the autoroute configuration and wizard modules for betterlite-management-cli,
  enabling users to discover accessible models, assign them to complexity tiers, and
  configure the ephemeral proxy's model_list. The config module defines data structures
  (AutorouteConfig, ClassifierChoice, SemanticMatchingChoice), validates that a config
  references only discovered models, and generates the proxy's model_list with one
  litellm_proxy/* deployment per model and one auto_router/complexity_router root. The
  wizard walks an interactive user through model discovery via GET /v1/models, prompts
  for tier assignments using fuzzy searching, guides optional classifier and semantic-matching
  setup, and writes the generated config to ~/.litellm/autorouter/config.yaml. Preserve
  literal "autorouter" routing model name, sorted deployment deduplication, persisted
  master-key reuse across reconfigures, fuzzy selection UI defaults, and per-tier keyword
  defaults for semantic rules. Interactive checks enforce terminal attachment and call
  secure_create to write the YAML file (B4575 dependency).

scope:
  paths:
    - tools/management-cli/src/autoroute/config.rs
    - tools/management-cli/src/autoroute/config/**
    - tools/management-cli/src/autoroute/wizard.rs
    - tools/management-cli/src/autoroute/wizard/**
    - tools/management-cli/src/autoroute/paths.rs
  lint_tables: false
references:
