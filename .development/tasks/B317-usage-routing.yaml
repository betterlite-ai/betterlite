id: B317
title: Legacy usage-based routing windows
description: Implement usage-based-routing with B304's per-group minute maps and B013 input token estimates.
  Record successful response usage and retain the legacy selector as a distinct enum variant rather than
  aliasing it to v2. Add deterministic component probes for map insertion order, zero limits and exact
  rate boundaries. Use the existing Rust crate boundaries from B004 and B008; integrate through the server
  when the provider dispatcher or callbacks live in another core crate. This task's source slices are
  the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target
  and committed corpus for every newly accepted config form; unsupported keys still fail by full path.
  Keep the implementation, adapters and tests within 650 changed lines; fixtures and oracle cases are
  budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/usage-routing/**
  - tools/oracle/src/router_probes/usage-routing/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/usage_routing.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm.py#L26-L146
  why: Window keys and token/request observations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm.py#L148-L236
  why: Legacy tie order and limit boundaries.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(usage_routing)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/usage-routing/lowest-absolute-tpm.yaml
- tools/oracle/cases/routing/usage-routing/first-tie-wins.yaml
- tools/oracle/cases/routing/usage-routing/minute-rollover.yaml
- tools/oracle/cases/routing/usage-routing/rpm-plus-one-equals-limit.yaml
- tools/oracle/cases/routing/usage-routing/zero-limit.yaml
- tools/oracle/cases/routing/usage-routing/missing-counter.yaml
- tools/oracle/cases/routing/usage-routing/removed-deployment-ignored.yaml
- tools/oracle/cases/routing/usage-routing/token-count-failure.yaml
deviations: []
out_of_scope:
- V2 atomic pre-call accounting (B318).
pitfalls:
- Lowest absolute TPM is not lowest utilization percentage.
- The RPM equality boundary differs from several other limit checks.
- A removed deployment's cached count must not put it back in the candidate list.
review_level: standard
budget:
  max_changed_lines: 650
  max_new_expects: 0
