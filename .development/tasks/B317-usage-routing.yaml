id: B317
title: Legacy usage-based routing windows
description: 'Implement usage-based-routing with B304''s per-group minute maps and B013 input token estimates.
  Record successful response usage and retain the legacy selector as a distinct enum variant rather than
  aliasing it to v2. Add deterministic component probes for map insertion order, zero limits and exact
  rate boundaries. Configuration boundary keys introduced or consumed here: routing_strategy. Pinned declaration
  defaults: routing_strategy=''simple-shuffle''. Resolve env values once in betterlite-config, never in
  router code. Implement the owned native service in crates/betterlite-router/src/usage_routing.rs. Add
  ProbeOperation::UsageRouting in tools/oracle/src/router_probes/mod.rs and the corresponding B317 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/lowest_tpm_rpm.py:
  LowestTPMLoggingHandler.__init__ (L26-L28), LowestTPMLoggingHandler.log_success_event (L30-L82), LowestTPMLoggingHandler.async_log_success_event
  (L84-L146), LowestTPMLoggingHandler.get_available_deployments (L148-L236). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
scope:
  paths:
  - crates/betterlite-router/src/usage_routing.rs
  - crates/betterlite-router/src/usage_routing/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/mod/**
  - crates/betterlite-server/src/routing/usage_routing.rs
  - crates/betterlite-server/src/routing/usage_routing/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/strategy/**
  - crates/betterlite-router/src/context.rs
  - crates/betterlite-router/src/context/**
  - tools/oracle/src/router_probes/usage_routing.rs
  - tools/oracle/src/router_probes/usage_routing/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/usage_routing.py
  - tools/oracle/cases/routing/usage-routing/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/usage-routing-*
  - crates/betterlite-config/fuzz/Cargo.toml
  - crates/betterlite-config/src/sections/usage_routing.rs
  - crates/betterlite-config/src/sections/usage_routing/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm.py#L26-L146
  why: Window keys and token/request observations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm.py#L148-L236
  why: Legacy tie order and limit boundaries.
dod:
- text: Write tests named usage_routing_behaviors and usage_routing_boundaries under usage_routing::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - usage-routing-behaviors
  - usage-routing-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/usage-routing-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/usage-routing-invalid.yaml;
    the valid seed contains routing_strategy. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - usage-routing-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: usage-routing-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::usage_routing_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: usage-routing-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::usage_routing_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/usage_routing.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/usage_routing.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/usage-routing-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/usage-routing-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/usage-routing-" && grep -Fq 'routing_strategy' crates/betterlite-config/fuzz/corpus/config_yaml/usage-routing-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/usage-routing/lowest-absolute-tpm.yaml
- tools/oracle/cases/routing/usage-routing/first-tie-wins.yaml
- tools/oracle/cases/routing/usage-routing/minute-rollover.yaml
- tools/oracle/cases/routing/usage-routing/rpm-plus-one-equals-limit.yaml
- tools/oracle/cases/routing/usage-routing/zero-limit.yaml
- tools/oracle/cases/routing/usage-routing/missing-counter.yaml
- tools/oracle/cases/routing/usage-routing/removed-deployment-ignored.yaml
- tools/oracle/cases/routing/usage-routing/token-count-failure.yaml
deviations: []
out_of_scope:
- V2 atomic pre-call accounting (B318).
pitfalls:
- Lowest absolute TPM is not lowest utilization percentage.
- The RPM equality boundary differs from several other limit checks.
- A removed deployment's cached count must not put it back in the candidate list.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
