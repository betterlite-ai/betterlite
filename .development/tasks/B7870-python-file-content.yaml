id: B7870
title: Python file_content, afile_content and the streaming file response
description: >-
  A LiteLLM user downloads a stored file with `litellm.file_content(file_id=..., custom_llm_provider="openai")` and can pass
  `stream=True` to get the bytes in chunks. This task makes the same calls work from the betterlite wheel. Python gathers
  the arguments into JSON, calls a native session, and wraps what comes back in Python objects. The download, the provider
  choice and the logging live in Rust (B1030 and B1080), so no provider logic is written here.


  Native side, the family `file_content`. `src/file_content.rs` has `pub(crate) fn register(module: &Bound<'_, PyModule>) ->
  PyResult<()>` that adds the class `NativeFileContentSession`, the class `NativeFileStream` and the exception
  `NativeFileContentError` (made with `pyo3::create_exception!`, error JSON keys as in B5659). The architect writes the `mod`
  and `register` lines in `src/lib.rs` and the import line in the `.pyi` package, so never edit `lib.rs`. The session takes JSON
  settings text, like B5659's. `content(payload_text, blobs)` blocks with the GIL released and `acontent(payload_text, blobs)`
  returns an awaitable. A non-streaming call returns JSON with the response headers and the body as the first blob entry, so
  the file bytes cross once and never as base64. A call with `stream=True` returns a `NativeFileStream` with `next_chunk()`,
  `anext_chunk()`, `close()` and `aclose()` that give `bytes` or `None` at the end. Conversion code is in
  `src/file_content/convert.rs` and its tests start with `request_` and `error_`.


  Python side, in `python/betterlite/files/_content.py` and `python/betterlite/files/streaming.py`. `file_content(file_id,
  custom_llm_provider="openai", extra_headers=None, extra_body=None, chunk_size=1024 * 1024, stream=False, **kwargs)` and
  `afile_content` keep LiteLLM's names, order and defaults (a test compares `inspect.signature`). `afile_content` is a
  coroutine function, and `file_content(..., afile_content=True)` returns a coroutine, as `file_content` does at
  files/main.py L853. The plain result is `HttpxBinaryResponseContent`: keep its `.content`, `.text`, `.headers`, `.status_code`,
  `.json()` and `.read()` over the bytes. With `stream=True` the result is `FileContentStreamingResult(stream_iterator,
  headers)` from files/types.py, and `stream_iterator` is a `FileContentStreamingResponse`.


  `FileContentStreamingResponse` (files/streaming.py L17-L191) wraps the native stream. `__iter__` and `__next__` raise
  `TypeError("File content stream does not support sync iteration")` when the native stream has no sync path, and
  `__aiter__` and `__anext__` do the same with "async iteration". `close()` and `aclose()` are idempotent. After a close,
  iteration yields nothing. The success and failure callbacks run once, when the iterator stops or fails: that part is
  Rust's (B1080), so Python only needs `_hidden_params` with `litellm_model_name` and `response_cost` (None), plus `file_id`,
  `model`, `custom_llm_provider` and `standard_logging_object` as plain attributes.


  `FilesAPIUtils` (files/utils.py L23-L45) is built here. Use B6040's `to_call_payload`, `call_native`, `acall_native`,
  `read_settings` and `proxy_headers`. The files package `__init__` and `main.py` belong to B7871. B7871 depends on this task.
