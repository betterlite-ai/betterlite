dod:
- text: "`file_content` and `afile_content` keep LiteLLM's signature, and `afile_content` is a coroutine function."
  proof: [content-signature]
- text: A plain call against the local server gives bytes, headers and status equal to LiteLLM's, and `file_content(afile_content=True)` returns a coroutine.
  proof: [content-plain]
- text: "`stream=True` gives the same chunks on the sync and async paths, closes cleanly, and refuses the wrong iteration path with LiteLLM's TypeError text."
  proof: [content-stream]
- text: A provider 404 raises the matching exception class with the native error as cause.
  proof: [content-error]
- text: The native register function adds the session, the stream and the error class, and conversion has tests without an interpreter.
  proof: [content-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: content-signature
    why: A caller's keyword is refused.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_file_content.py -k signature
  - id: content-plain
    why: The bytes or headers differ from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_file_content.py -k plain
  - id: content-stream
    why: A stream never ends, loses a chunk or skips the TypeError.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_file_content.py -k stream
  - id: content-error
    why: A missing file raises a generic exception.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_file_content.py -k error
  - id: content-native
    why: A header or body is lost on the way across.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^file_content::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Strict typing has to hold for the streaming wrapper.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`FileContentStreamingResponse.stream_iterator` is a native stream handle and not the provider's httpx iterator."
  why: The bytes come from Rust. Iteration, close and the callbacks behave the same, but `isinstance(stream_iterator, httpx.Response)` is false.
- what: The `client` argument of `file_content_streaming` is not accepted.
  why: A Python HTTP client can't drive the Rust one, so a call that passes `client` raises `UnsupportedCallArgument` (B158).
- what: This task has no helper oracle cases.
  why: The tests compare both packages against one local server. That covers more than a helper call would.
out_of_scope:
- "`_should_sdk_support_streaming` L83-L90 and `_file_content_logging_obj` L92-L113 belong to B1030, and the provider choice inside `file_content_streaming` from L1034 is Rust."
- "`create_file`, `file_retrieve`, `file_delete` and `file_list` belong to B7871, and the `files` package `__init__` and `main.py` are written there."
- "The `@client` wrapper behavior (callbacks, retries, caching) belongs to B5368 and runs on the Rust side."
pitfalls:
- "`close()` swaps the inner iterator for an empty one before closing it, so a second `next()` after `close()` ends the loop instead of raising."
- "An async-only native stream must still allow `close()` from sync code, and a sync-only one must allow `aclose()`, since LiteLLM tries both close methods."
- "`chunk_size` is bytes and defaults to 1048576, so a test that streams a small file sees one chunk, not many."
- "The non-streaming bytes arrive as a blob, so build `HttpxBinaryResponseContent` from the blob and don't decode text from the JSON."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
