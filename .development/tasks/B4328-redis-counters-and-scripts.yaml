dod:
  - text: >-
      `increment_cache` sends INCRBY, then TTL, then EXPIRE only when TTL answered
      exactly -1. It returns the INCRBY reply. A TTL of -2 or a positive TTL sends no
      EXPIRE. A given `ttl` of 30.9 sets 30, a missing `ttl` sets `default_ttl`, NaN
      sets `default_ttl`, and infinity returns `InvalidTtl` with nothing sent. The key
      is namespaced once even when it already carries the prefix.
    proof: [increment-tests]
  - text: >-
      `increment_with_floor` and `async_increment_with_floor` send EVAL with the B4324
      script, numkeys 1, the namespaced key, the value and the TTL as text. An integer
      reply and a bulk-string reply both give the count, and a nil or array reply
      gives `UnexpectedReply`. A server error comes back unchanged.
    proof: [floor-tests]
  - text: >-
      `batch_get_counts` and `async_batch_get_counts` return one entry per key in input
      order with `None` for a miss and integers decoded from text. A non-numeric value
      and a server error both return an error and never an empty list. Empty input
      returns an empty list and the fake records no command. Keys are namespaced, and
      two Cluster nodes still give input order.
    proof: [counts-tests]
  - text: >-
      `async_scan_iter` sends the namespaced pattern plus `*` with `COUNT`, follows the
      cursor until it is `0`, and stops as soon as `count` keys are collected, with no
      further SCAN. On a Cluster client it scans each primary from `CLUSTER SLOTS`
      once, addressed to that node, with the cap shared across nodes. The hooks
      get success and failure events named `async_scan_iter`.
    proof: [scan-tests]
  - text: >-
      `async_register_script` sends nothing. `run` sends EVALSHA with the SHA-1 of the
      source, namespaced keys and untouched args. After a NOSCRIPT reply it sends
      SCRIPT LOAD once and repeats the EVALSHA, and a second NOSCRIPT is returned. Any
      other error is returned with no SCRIPT LOAD. On two Cluster nodes the EVALSHA
      goes to the node owning the first key. `sha1` equals the SHA-1 of `source`.
    proof: [scripts-tests]
  - text: >-
      `async_set_max` sends the exact Lua text above with the namespaced key, the value
      as text and `used_ttl` as text. A missing `ttl` sends `default_ttl`. A bulk-string
      reply is parsed to a float, a nil reply gives `None`, and NaN or infinity returns
      `NonFiniteValue` with nothing sent.
    proof: [set-max-tests]
  - text: >-
      `incr_by_float_with_ttl` sends INCRBYFLOAT alone with no TTL, INCRBYFLOAT then
      EXPIRE in one pipeline with `refresh_ttl`, and INCRBYFLOAT then TTL without it,
      plus one standalone EXPIRE only when TTL answered -1. `pipeline_increment` sends
      one pipeline with an EXPIRE only after the operations that carry a TTL, returns
      one float per operation in order, and sends nothing for an empty list.
    proof: [float-increment-tests]
  - text: >-
      `increment_cache` and `async_scan_iter` fire the hooks once per timed call on
      success and once on failure with the operation name. Each guarded method enters
      the gate once and exits it once on success, and an open breaker returns
      `Breaker` with nothing sent. No error text, log line or hook argument holds a
      password, a token or a value read from Redis.
    proof: [hooks-and-gate-tests]

