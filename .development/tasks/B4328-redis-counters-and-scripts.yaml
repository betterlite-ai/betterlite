deviations:
  - what: >-
      No throttled failure log runs inside these methods. A failure writes a plain
      `tracing::error!` line.
    why: The throttle belongs to B393's `log_redis_failure`, and the gate carries the failure there.
  - what: >-
      The hooks are called inline and get the operation name only. LiteLLM sends the
      async hooks through `asyncio.create_task` and adds a "current <- caller" string
      read from the Python stack.
    why: A Rust call has no frame names to report, and the hook implementer can spawn if it needs to.
  - what: >-
      `async_register_script` keeps no executor cache per event loop and no entry in
      `in_memory_llm_clients_cache`. `RegisteredScript` is a SHA-1 and the source text.
    why: A script object holds no connection in redis-rs and betterlite has one runtime, so the per-loop binding has nothing to protect.
  - what: >-
      The `client` argument of the script runner is not built, and neither is the
      `script_load` and `evalsha` branch for clients without `register_script`.
    why: No caller passes `client=` at the pin, and redis-py's async RedisCluster has `register_script`, so that branch never runs.
  - what: >-
      `async_scan_iter` on a Cluster client scans the primaries one after another.
      redis-py reads the first batch of every node before it continues node by node,
      so with a `count` cap the returned keys can differ. The `hasattr(scan_iter)`
      branch that returns an empty list is not built.
    why: The key order of SCAN is undefined anyway, and redis-py's async RedisCluster has `scan_iter`, so that branch never runs.
  - what: >-
      `async_set_max` rejects a NaN or infinite `value` with `NonFiniteValue`. LiteLLM
      sends the text and lets the Lua comparison decide.
    why: The Lua result for those strings depends on the server's Lua build, and an error that names the field is the rule in docs/compatibility.md.
  - what: >-
      `increment_cache` returns `InvalidTtl` for an infinite `ttl`. LiteLLM's `int()`
      raises `OverflowError` there, outside its own try block.
    why: Both are errors the caller sees before any Redis call.

out_of_scope:
  - "Opening connections, sync client reuse, `RedisTransport`, `mget` and `async_mget`; B5220 and B4325 own them and this task calls them."
  - "`check_and_fix_namespace`, `_decoded_counts`, `_INCREMENT_WITH_FLOOR_LUA`, `_LUA_COUNT` and `_OPTIONAL_COUNTS`; B4324 owns them. The two float helpers keep B4324's planners and add only the sending."
  - "`RedisCache.async_increment` (L1419-L1476) and `async_increment_pipeline` (L1954-L2017); B360 owns them and calls `incr_by_float_with_ttl` and `pipeline_increment` here."
  - "`RedisCircuitBreaker`, `_run_under_circuit_breaker` and `_redis_circuit_breaker_guard` around `run_script` and every other method; B393 owns them and B5630 implements `BreakerGate` over it."
  - "`_get_async_client_cache_key`, `init_async_client` and `_async_commands`; B4325 owns them. Scripts here don't need the client cache key."
  - "`BaseCache.get_ttl`; B4290 owns the contract and this task applies its rule to `increment_cache` and `async_set_max` locally."
  - "`async_register_script` callers (the rate limiters, session limits, login throttle, pod lock manager); each caller task owns its script text and its use of `RegisteredScript::run`."
  - "Batch execution of scripts and counters in `litellm/caching/redis_batch.py`; B4330 owns it and reads `RegisteredScript::sha1`."

pitfalls:
  - >-
    `increment_cache` asks for the TTL and sets the expiry only when the reply is
    exactly -1. A key with an expiry, or a TTL of -2, must send no EXPIRE.
  - >-
    `async_set_max` falls back to `default_ttl` when `ttl` is None, so 0 appears in
    ARGV[2] only when the caller passes 0. The script skips EXPIRE when ARGV[2] is
    not above 0.
  - >-
    Namespace `KEYS` only. Script `ARGV` can hold any text, and prefixing it would
    corrupt the arguments.
  - >-
    `async_scan_iter` namespaces the pattern, then appends `*`. A pattern that already
    starts with `namespace:` is not prefixed twice, and `*` is appended even when the
    pattern already ends in one.
  - >-
    A SCAN cursor is a string. Compare it with `"0"`, not with an integer parse that
    fails on a large cursor, and send `COUNT 0` only when the caller asks for it,
    since the server rejects it.
  - >-
    A script with no keys has numkeys 0 and the Cluster routes it to a random node.
    Don't add a fake key.
  - >-
    `batch_get_counts` must not reuse a swallowing read path. A caller that falls back
    to its own numbers on Redis failure needs the error.
  - >-
    The sync methods call `LiveSyncClient::query`, which holds a mutex over network
    I/O. Don't call them from async code outside `spawn_blocking`, and don't use them
    in tests that run on the Tokio test runtime thread.
  - >-
    Don't hold `LiveAsyncClient::Cluster`'s connection across two awaits by reference.
    Clone it per SCAN, since `route_command` takes `&mut self`.
  - Keep each file under 300 lines, one per area, with `redis_counters.rs` holding only the types and the error.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
