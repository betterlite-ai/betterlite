id: B4328
title: Read Redis counters and execute namespaced Lua operations
description: >-
  B5220 opens live connections and B4325 hands out the reusable client. This task
  adds the module `redis_counters` to betterlite-redis. It is the counter side of
  LiteLLM's `RedisCache`: increments, floor-clamped in-flight counters, counter
  reads, key scans, the max-only setter and registered Lua scripts. Every key goes
  through `cache_primitives::namespace::check_and_fix_namespace` first. No new
  dependency is needed: `redis`, `tokio`, `tracing` and `thiserror` already come
  from B5220 and B4325.

  Public API. `RedisCounters` has public fields `transport: Arc<RedisTransport>`,
  `namespace: Option<String>`, `default_ttl: i64`, `hooks: Arc<dyn ServiceHooks>`
  and `gate: Arc<dyn BreakerGate>`, and the constructor `RedisCounters::new` takes
  the same five in that order. `default_ttl` is LiteLLM's `BaseCache.default_ttl`
  (60, or `litellm.default_redis_ttl` when set); the caller resolves it.
  `ServiceHooks`, `ServiceEvent`, `BreakerGate`, `BreakerAdmission` and
  `BreakerOpen` come from B4325's module `redis_client_reuse`, and this task
  declares none of them. They stand in for `service_logger_obj.service_success_hook`
  and `service_failure_hook` (B012) and for B393's breaker, and B5630 implements
  both. The hooks are sync, so the implementer must not block. The error type
  `RedisCountersError` is a `thiserror` enum owned by this module, with
  `Client(#[from] LiveClientError)`, `Reuse(#[from] ClientReuseError)`,
  `Decode(#[from] DecodeError)`, `Breaker(#[from] BreakerOpen)`,
  `UnexpectedReply { operation: &'static str }`, `InvalidTtl` and
  `NonFiniteValue`. The module reaches Redis only through `RedisTransport`,
  `LiveAsyncClient::query` and `LiveSyncClient::query`.

  Guard rule, as in B4327. A guarded method calls `gate.enter(name)` first, and an
  open breaker returns `RedisCountersError::Breaker` with nothing sent. On `Err` from
  the body it calls `gate.record_failure(&error)` and returns the error. On `Ok` it
  calls `gate.exit(admission)` once. The guarded methods are `increment_with_floor`,
  `async_increment_with_floor`, `batch_get_counts`, `async_batch_get_counts`,
  `async_scan_iter` and `async_set_max`, the ones LiteLLM wraps in
  `_redis_circuit_breaker_guard`. `increment_cache`, `RegisteredScript::run`,
  `incr_by_float_with_ttl` and `pipeline_increment` take no gate call here. B360's
  guarded `async_increment` and `async_increment_pipeline` wrap the last two,
  LiteLLM does not guard `increment_cache`, and script callers guard `run`. No
  method here swallows an error, so `gate.swallowed` is never called. A test gate
  and a test hook in `redis_counters/tests/support.rs` record every call.

  Sync methods. These block on the network and are for sync call sites only, as
  `LiveSyncClient::query` says. `fn increment_cache(&self, key: &str, value: i64,
  ttl: Option<f64>) -> Result<i64, RedisCountersError>` (L851-L906) works out
  `set_ttl` as LiteLLM's `get_ttl` does: `ttl` cut toward zero with `as i64`, NaN
  falls to `default_ttl`, and an infinite value returns `InvalidTtl`. It sends
  `INCRBY key value` and keeps the integer reply as the result. It then sends `TTL
  key`, and only when the reply is exactly -1 sends `EXPIRE key set_ttl`. A reply
  of -2 sends nothing. `hooks.success` fires for the calls named
  `increment_cache`, `increment_cache_ttl` and `increment_cache_expire`, each
  event with its own duration. Any failure calls `hooks.failure` with the call
  type `increment_cache` and the error,
  writes a `tracing::error!` line that names the operation and carries the error
  text, and returns the error. A failure after the INCRBY leaves the increment
  applied, because LiteLLM has no transaction there either. `fn
  increment_with_floor(&self, key: &str, value: i64, ttl: i64) -> Result<i64, ..>`
  (L908-L926) sends `EVAL` with `cache_primitives::decode::INCREMENT_WITH_FLOOR_LUA`,
  numkeys 1, the namespaced key, then `value` and `ttl` as decimal text. An integer
  reply is the count. A bulk-string reply goes through
  `decode::validate_lua_count`. Anything else is `UnexpectedReply`. `fn
  batch_get_counts(&self, key_list: &[String]) -> Result<Vec<Option<i64>>, ..>`
  (L928-L937) namespaces every key, calls `RedisTransport::mget` and turns each
  `redis::Value` into `Option<Vec<u8>>`: `Nil` is `None`, a bulk string is `Some`,
  and anything else is `UnexpectedReply`. Then it calls `decode::decoded_counts`.
  A failure surfaces. It is not swallowed the way `batch_get_cache` swallows it.
  An empty list returns an empty list and sends nothing.

  Async methods. `async fn async_batch_get_counts` (L939-L943) is the same with
  `async_mget`. `async fn async_increment_with_floor` (L1515-L1520) is the sync
  floor method over `RedisTransport::async_client` and
  `AsyncRedisCommands::eval`, using `RedisScalar::Text` for the key and both
  numbers, and the same reply rule. `async fn async_set_max(&self, key: &str,
  value: f64, ttl: Option<i64>) -> Result<Option<f64>, ..>` (L1478-L1513) takes
  `used_ttl` as `ttl` or `default_ttl`. A `value` that is NaN or infinite returns
  `NonFiniteValue` before anything is sent, because Lua cannot compare it. It sends
  `EVAL` with numkeys 1, the namespaced key, `value.to_string()` and
  `used_ttl.to_string()`, and the script is this text exactly, joined by single
  spaces, so the bytes match LiteLLM's: `local cur = redis.call('GET', KEYS[1]) if
  cur == false or tonumber(cur) < tonumber(ARGV[1]) then redis.call('SET',
  KEYS[1], ARGV[1]) if tonumber(ARGV[2]) > 0 then redis.call('EXPIRE', KEYS[1],
  ARGV[2]) end return ARGV[1] end return cur`. Keep it as one `const` in
  `redis_counters/set_max.rs`. A `Nil` reply returns `None`. A bulk string is
  parsed as `f64`, and a parse failure is `UnexpectedReply`. The TTL is passed
  only to the script, so `0` or a negative value sets no expiry. A stored value
  that is not a number makes Lua raise, and the error comes back unchanged.

  Scan. `async fn async_scan_iter(&self, pattern: &str, count: usize) ->
  Result<Vec<Vec<u8>>, ..>` (L945-L993) builds `match_pattern` as the namespaced
  pattern followed by `*`, so the pattern is a prefix and its own glob characters
  stay live. It loops `SCAN <cursor> MATCH <match_pattern> COUNT <count>` from
  cursor `0` until the server returns cursor `0`, and stops at once, mid-batch,
  when the collected list reaches `count`. Keys come back as raw bytes. On a
  `LiveAsyncClient::Cluster` client the kind decides, not the family, as in B4325.
  Send `CLUSTER SLOTS` through `query`, take the first node in every slot entry
  (the primary), drop repeated host and port pairs keeping the first seen order,
  and run the cursor loop on each primary in turn. Send each SCAN with
  `ClusterConnection::route_command` on a clone of the connection and
  `RoutingInfo::SingleNode(SingleNodeRoutingInfo::ByAddress { host, port })`.
  redis-rs 1.7.0 has no cluster scan, and `SCAN` is unrouted without an address.
  The `count` cap covers all primaries together. `hooks.success` fires for
  `async_scan_iter` on return and `hooks.failure` before the error is returned.

  Scripts. `fn async_register_script(&self, script: &str) -> RegisteredScript`
  (L995-L1083) is infallible and sends nothing. `RegisteredScript` has the public
  fields `source: String` and `sha1: String`, which is
  `redis::Script::new(script).get_hash()`, and it keeps the transport and the
  namespace. B4330 reads `sha1` to build its pipelined EVALSHA. `async fn
  run(&self, keys: &[String], args: &[RedisScalar]) -> Result<redis::Value, ..>`
  namespaces `keys` and leaves `args` untouched. It sends `EVALSHA sha1 numkeys
  keys.. args..` through `LiveAsyncClient::query::<redis::Value>`. When the error's
  `kind()` is `ErrorKind::Server(ServerErrorKind::NoScript)`, it sends `SCRIPT
  LOAD source` once and repeats the EVALSHA once, which is what redis-py's
  `AsyncScript.__call__` does. A second failure is returned. Any other error is
  returned at once. A Cluster connection routes `SCRIPT LOAD` to every node by
  itself and routes EVALSHA by the first key.

  Float increments. These two are the I/O half of B4324's pure planners in
  `cache_primitives::float_ttl` and `cache_primitives::pipeline_increment`. `async
  fn incr_by_float_with_ttl(&self, key: &str, value: f64, ttl: Option<i64>,
  refresh_ttl: bool) -> Result<f64, ..>` (L1400-L1416) takes an already namespaced
  key. With no `ttl` it sends INCRBYFLOAT alone. Otherwise it runs a pipeline built
  with `pipeline(false)` holding INCRBYFLOAT and then, per
  `plan_ttl_followup`, either `EXPIRE key ttl` or `TTL key`. A reply of -1 to TTL,
  by `needs_standalone_expire`, sends one more `EXPIRE key ttl`. The first pipeline
  error is returned. `async fn pipeline_increment(&self, increment_list:
  &[IncrementOperation]) -> Result<Vec<f64>, ..>` (L1931-L1952) builds its steps
  with `plan_pipeline_steps(operations, namespace)`, runs one `pipeline(false)`
  `execute`, parses the reply of each `IncrByFloat` step as `f64` (bulk string or
  double), treats an `Expire` reply as no float, and returns `float_replies`. An
  empty list sends nothing and returns an empty list. B360's `async_increment` and
  `async_increment_pipeline` call these two.

  Tests. Every test talks to B5220's fake server at
  `crate::redis_live_client::tests::fake_server`, since CI has no Redis service.
  Build a `RedisTransport` with the fake's port in the settings. Declare
  `#[cfg(test)] mod tests;`, put the group list in `redis_counters/tests.rs`, and
  give each group below one file under `redis_counters/tests/`, so test paths read
  `redis_counters::tests::<group>::<name>`. Scripted replies come from the fake's
  per-command table, and tests read its recorded commands to check the bytes sent.

scope:
  paths:
    - crates/betterlite-redis/src/redis_counters.rs
    - crates/betterlite-redis/src/redis_counters/**
  lint_tables: false

