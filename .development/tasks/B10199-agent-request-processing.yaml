dod:
  - text: GoogleAgents implements AgentRequestProcessing for UserAPIKeyAuth, and the five agent routes reach the Gemini upstream through the call steps and B10200's config, answering LiteLLM's JSON with the custom headers.
    proof: [agents-tests, production-impl]
  - text: With a router, the five agent route types skip model routing and run the direct call; /v1/messages chooses as before.
    proof: [steps-tests, agents-tests]
  - text: The port answers LlmApiFailure, every failure goes through handle_llm_api_exception, and B3508's route tests still pass on the new shapes.
    proof: [routes-tests, agents-tests]
  - text: A banned key inside litellm_params_template is refused with the auth stage's 401 unless allow_client_side_credentials is true.
    proof: [agents-tests]
  - text: The pipeline writes no exception mapping, header builder, body tail or provider config of its own.
    proof: [no-copies]
  - text: docs/deviations/B10199.yaml lists this task's rows.
    proof: [deviation-rows]
checks:
  optional: [mutants]
  commands:
    - id: agents-tests
      why: a route does not reach the upstream, a step is skipped, the template scan is missing, or a failure answers wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::google_agents::/)'
    - id: production-impl
      why: no production value implements the port
      run: grep -rq 'impl AgentRequestProcessing<UserAPIKeyAuth> for GoogleAgents' crates/betterlite-server/src/app/inference/google_agents.rs crates/betterlite-server/src/app/inference/google_agents
    - id: steps-tests
      why: the agent route types still read the model, reach RouterGeneric, or changed what /v1/messages chooses
      run: grep -rq 'fn agent_route_types_skip_model_routing' crates/betterlite-server/src/messages_call/tests.rs crates/betterlite-server/src/messages_call/tests && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^messages_call::/)'
    - id: routes-tests
      why: the port change broke a B3508 route test, or the port still answers PreCallFailure
      run: grep -q 'LlmApiFailure' crates/betterlite-server/src/api/agents/collection_routes/processing.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::agents::collection_routes::/) | test(/^auth::request_body_safety::/)'
    - id: no-copies
      why: the pipeline holds its own exception mapping, header input, body tail, hooks port or Gemini config
      run: test -z "$(grep -rnE 'fn (handle_llm_api_exception|header_input|header_cost|finish_body)\b|trait [A-Za-z]*Hooks|impl (AgentsApiConfig|AgentsConfig|ErrorClasses) for|is_unsafe_header_name' crates/betterlite-server/src/app/inference/google_agents.rs crates/betterlite-server/src/app/inference/google_agents)"
    - id: deviation-rows
      why: this task's deviations are not recorded
      run: test -s docs/deviations/B10199.yaml && grep -q 'litellm_params_template' docs/deviations/B10199.yaml && grep -q 'user_config' docs/deviations/B10199.yaml
oracle_cases: []
deviations:
  - what: A banned key (api_base, base_url, user_config and the rest of the list) inside litellm_params_template is refused with the 401 auth_error the auth stage gives the same key at the body root, unless general_settings.allow_client_side_credentials is true; LiteLLM merges it unchecked and sends the request to the named host.
    why: Security fix (SSRF); LiteLLM scans only the body root, extra_body and litellm_embedding_config, and the GET routes have no body at all.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L477-L530
  - what: POST /v1beta/agents without a text name answers 400 invalid_request_error with param name, where LiteLLM's acreate(**data) raises a TypeError that _handle_llm_api_exception answers with a 500.
    why: A 500 for a missing required field is a bug no setup relies on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/agents/main.py#L98-L109
  - what: A request whose data carries user_config (reachable only with allow_client_side_credentials true) gets a 400 with "user_config is not supported on acreate_agent" or the route type it came with, where LiteLLM builds a Router from it and runs the call.
    why: B9800 does not build per-request routers; /v1/messages and the Google routes answer the same way.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L513-L514
  - what: The agent calls run none of LiteLLM's @client success or failure callbacks, so logging integrations and spend logs get no row for them; the pre-call and the ProxyLogging hooks still run.
    why: No production port of LiteLLM's client wrapper runs for proxy-side SDK calls yet; these calls cost nothing, so no budget or spend total changes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L1976-L2000
  - what: A create body with stream true answers the agent as JSON, where LiteLLM takes its streaming branch for a response that is not a stream, async_data_generator's `async for` over the record raises, and the 200 event stream carries only the error frame (proxy_server.py L9899, L10031-L10069).
    why: The streaming branch over a pydantic record is a bug no setup relies on; the agent calls have no stream form.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L2665-L2668
out_of_scope:
  - "Mounting the routes, passing GoogleAgents into AgentCollectionState and the HTTP oracle cases: B8774."
  - "The Gemini agents config and the oracle adapters that used their own: B10200."
  - "handle_llm_api_exception, the pre-call step, the router routing, ProxyLogging and api::response_tail: B10178, B8801 and B8802, B10196, B8399, B081."
  - "The key guard and the template merge themselves: B3508. The admin role check in guards.rs: B10171."
  - "The model-free branches of the container (L586-L598) and interaction (L599-L606) route types: their route tasks, B7326 and B3507."
pitfalls:
  - "LiteLLM checks the block list before the agents branch, so a body model that the router fully blocks still answers the 403 before any agent call; keep skips_model_routing after that check, never before it."
  - "Scan the merged data before the key guard, so a banned template key answers the auth 401 even for a non-admin caller without api_key, the way LiteLLM's auth check runs before its handler."
  - "page_size and page_token reach the config through kwargs, not as named arguments; B10200's config sends them only when truthy, so pass them through unchanged."
  - "Hold the call's LoggingState in the dispatch value and never hold a std Mutex guard across the SDK call's await; take it out, run the call, put it back."
  - "MessagesCallSteps takes read_through None here: these route types carry no model, so route_request's read-through retry never fires for them."
  - "The template scan reads the slot from the Arc<ServerState> extension that routes.rs L303 layers over every app::mount route, so in production it always runs; the google_agents tests that drive collection_routes::routes directly add `Extension(Arc::clone(&state))` themselves, or the 401 test passes for the wrong reason. B3508's own route tests carry no extension and skip the scan by design."
  - "B10183 renames ROUTE_TYPE to a field and B10196 adds router_routing; read messages_call.rs and app/inference on main when this task starts."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
