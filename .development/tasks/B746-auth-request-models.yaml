id: B746
title: Resolve requested models before authorization
description: >-
  Resolve requested models without granting access or creating managed resources. Candidate collection
  accepts scalar/list/tuple/set values, skips None, splits strings on commas, trims whitespace,
  stringifies other values and drops empty strings; deduplicate by first occurrence. Exact mapping
  keys win over the first case-insensitive match. Markers are case-insensitive substring tests.
  Own the marker/ID-field constants at auth_utils.py L1681-L1728 alongside their consumers.

  Start with body.model, then body.target_model_names for files/batches/vector_stores or a falsey body
  model, dict session.model for /realtime/client_secrets and /realtime/calls, and dict completion.model
  for /evals. Routing sources apply to /files, /batches, /vector_stores, /skills, /evals, /fine_tuning
  and /videos. Files/batches/skills/evals append query.model then x-litellm-model; files/batches/
  fine_tuning append query.target_model_names. Inspect body IDs in order: file_id, input_file_id,
  output_file_id, error_file_id, batch_id, fine_tuning_job_id, training_file, validation_file,
  vector_store_id, video_id, character_id. Other routes ignore these ID hints.

  Nonempty string IDs try B1019 legacy file/batch hints, B1016 unified IDs, then B2324 video/character
  decoding for the corresponding field names. Each family independently catches errors, logs DEBUG
  and retains already-appended candidates before the next family. Resolve model_id through B302,
  keeping the original when unknown or after a DEBUG-logged failure; append target_model_names next.
  Nonstring/empty IDs yield no hints. /cost/predict-cache instead requires string current_deployment_id
  and candidate_deployment_id, both catalog entries and each entry's team_id None or equal to the
  caller team; return their model names in order, deduplicated, ignoring ordinary body/header sources.
  Format zero candidates as None, one as a string, many as a list.

  A dispatched endpoint marked __litellm_pass_through_endpoint__ exactly True skips extraction;
  built-in handlers at a colliding custom path still enforce models. Provider pass-through detection
  separately checks presence of path_params.endpoint. With no candidate, try /openai/deployments/<model>,
  then non-Vertex /v1beta/models/ or /beta/models/ and ^/models/ up to ':', preserving embedded slashes,
  or Vertex /models/<id> for a case-insensitive /vertex prefix. Bedrock, /azure/ or /azure_ai/, and
  /nvidia_nim/ helpers then override even an explicit body model on a nonnull match. B2324 Bedrock
  count_tokens/invalid paths give no override; B2324 matches Azure catalog segments after prefix removal
  and selects the longest exclusive-NIM model-group prefix. Missing router keeps the earlier candidate.


  B2324 moves the small video/character and Bedrock decoders below authentication instead of depending
  on upper B093/B102 handlers. An uninstalled decoder is not equivalent to malformed input: these MIT
  modules exist at the pin. Recognizing a managed file/batch ID does not enable the enterprise-only
  managed hook; the open product choice remains with the file/batch route owners.


  Build the production auth_request_models module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  _append_model_candidates (L1731-L1743; 12 source lines), _dedupe_model_candidates (L1746-L1751; 6 source
  lines), _get_case_insensitive_mapping_value (L1754-L1763; 10 source lines), _route_matches_any_marker
  (L1766-L1768; 3 source lines), _route_uses_model_routing_sources (L1771-L1772; 2 source lines), _extract_models_from_managed_resource_id
  (L1775-L1842; 60 source lines), _resolve_model_id_with_router (L1845-L1852; 8 source lines), get_cache_prediction_deployments
  (L1855-L1864; 10 source lines), _cache_prediction_model_candidates (L1867-L1877; 11 source lines), _extract_model_candidates_from_request
  (L1880-L1943; 60 source lines), _format_model_candidates (L1946-L1953; 8 source lines), request_dispatched_to_pass_through_endpoint
  (L1956-L1974; 15 source lines), request_dispatched_to_provider_pass_through (L1977-L1979; 3 source lines),
  get_model_from_request (L1982-L2061; 59 source lines), _router_model_from_azure_route (L2064-L2068;
  5 source lines), _model_from_bedrock_route (L2071-L2083; 12 source lines).


  Add the auth_request_models operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-request-models-*
  seed to B171 helper_case, which already owns this decoder.


  HTTP dispatch tests use built-in paths and a colliding custom passthrough path to prove the actual
  selected handler controls model extraction. Pure hint cases compare candidate order and DEBUG
  fallback only; they cannot assert that an extracted model has been authorized.


  Model extraction uses typed request/catalog snapshots and B2324/B1016/B1019 decoders, without
  Postgres or a new decoder. The MIT managed-ID parsers remain usable with the enterprise hook absent.


  Sizing: 284 function lines plus 46 constant-table lines; allow 285 production, 300 tests,
  85 adapters and 65 wiring, 735 within 800. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_request_models::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
