id: B203
title: Streaming text completions and completion bridge
description: >-
  Extend B202 text completions with incremental SSE and the text/chat transformation bridge required by the provider
  framework. Reuse B005's framing parser and B010's typed stream lifecycle, add only text-choice chunk decoding
  and explicit bridge mapping, and preserve finish reasons, multi-choice indices, logprobs and usage. A chat request
  routed to a text-completion deployment selects the bridge explicitly; ordinary chat and ordinary text-completion
  routes retain their own result types. Add HTTP oracle cases for both request paths, usage/options and errors before
  streaming starts; fuzz text_stream decoding with arbitrary read boundaries and replay its corpus. Add pause-controlled
  timing and client-disconnect tests that prove incremental delivery and upstream cancellation without buffering
  a whole completion.  Own the reverse direction too: /v1/completions on openai/gpt-4o or another installed chat
  provider builds chat messages and converts chat responses to text with convert_chat_to_text_completion; streaming
  uses TextCompletionStreamWrapper semantics. Native providers added later reuse this same direction. Match completion-to-chat
  dispatch for ft:babbage-002, ft:davinci-002 and openai_text_completion_compatible_providers. Add the text-stream
  variants to B014 and text-stream privacy/logging to B188/B252 seams. Budget 290 stream/bridges, 120 integration,
  330 tests/fuzz (740 total). Write the behavior rstest functions text_streaming_text_stream_tests_behavior in adjacent tests.rs
  files, with a named case for each behavior and failure in the DoD; corpus replay tests have separate names.


  The OpenAI text provider call path is now below the API layer: B2237 owns completion/transformation.py and completion/utils.py
  plus the text config selector; B2238 owns completion/handler.py. Call these leaves directly, including config
  defaults, prompt preparation, optional chat conversion and sync/async send/stream behavior. Public routes and
  bridges remain with B202/B203.
