id: B791
title: User info and administrator projections
description: >-
  Implement /user/info and /v2/user/info with owner/admin/org/team visibility checks, scoped key/team
  lists and enterprise metadata redaction. Preserve disable_master_key_return=false source setting while
  ensuring response secrets are only exposed by the specifically authorized source branch. No paid tier
  gate restricts the response.


  Build the production user_info module in betterlite-server; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _enforce_user_info_access (L763-L790; 24 source lines), _UserInfoDataClient.get_data (L795-L795; 1 source
  lines), _UserInfoDataClient.get_data (L798-L804; 7 source lines), _UserInfoDataClient.get_data (L807-L813;
  7 source lines), _get_user_info_keys (L816-L824; 9 source lines), _get_user_info_teams (L827-L876; 43
  source lines), _redact_scim_enterprise_metadata (L884-L893; 10 source lines), _build_user_info_response
  (L896-L924; 26 source lines), user_info (L934-L1005; 59 source lines), _check_user_info_v2_access (L1008-L1064;
  38 source lines), user_info_v2 (L1074-L1170; 80 source lines), _fetch_admin_teams_and_keys_rows (L1173-L1176;
  4 source lines), _get_user_info_for_proxy_admin (L1179-L1241; 49 source lines), _process_keys_for_user_info
  (L1244-L1283; 34 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.disable_master_key_return=False;
  disable_master_key_return=False.


  Register these actual HTTP routes and aliases exactly once: GET /user/info -> user_info; GET /v2/user/info
  -> user_info_v2. For each route send a typed successful request, an invalid or missing target, and a
  caller lacking that route permission through B001 HttpCase against the running pinned MIT proxy and
  betterlite. Public login/session routes instead prove bad credentials or invalid/expired codes. Compare
  status, response model including null/absent fields, error type/param/code, content-type, redirect/cookie
  headers and litellm-changed-by where read. Do not reduce endpoint checks to direct helper invocations.
  handle_exception_on_proxy controls management error mapping; keep source partial writes visible in fixture
  inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::user_info::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 391 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  391 production, 151 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 657 changed lines estimated within a 675-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
