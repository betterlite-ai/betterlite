id: B791
title: User info and administrator projections
description: >-
  Implement authenticated GET /user/info and GET /v2/user/info, both with B865 management effects.
  Both query parameters user_id default null. These are unpaginated reads with no premium_user
  branch. V1 normalizes the raw query through B2334, then rechecks resolved ownership: null,
  proxy_admin/proxy_admin_viewer or exact caller ID passes; otherwise HTTPException 403 names
  target and caller IDs. A literal-plus/space mismatch must not bypass this recheck. V1 checks
  DB after authorization; absent DB raises the ordinary database-not-connected exception.
  Omitted ID for an admin-view caller selects the all-teams/keys projection; otherwise default
  to caller ID. Missing user, including an unbound caller, raises 404 'User {user_id} not found'.
  Cases v1_self_default, v1_admin_explicit_target, v1_other_forbidden, plus_space_recheck,
  v1_unbound_missing, v1_missing_user and v1_database_absent pin these branches.

  V1 loads teams before keys. Call B813 list-team service with synthetic path /user/info and
  requested ID; accept only a list result. Merge the target row's truthy list of teams with
  the first list, preserving first occurrence by team_id; the helper's null-target fallback
  fetches caller teams. Only the FIRST list is supplied for key-alias enrichment, even if a
  team appears in the merged list. Sort returned teams by team_alias or empty string. Cases
  team_merge_order_and_dedup, caller_team_fallback, nonlist_team_result and alias_uses_first_list
  cover these details. Use an injected B813 service, not a call to its HTTP handler.

  Build user_id,user_info,keys,teams. If user_info is null but keys is not, synthesize
  spend=sum(key.spend default 0). Strip password from dict/model user_info, set missing metadata
  to null, and remove only scim_enterprise,scim_entitlements,scim_roles from metadata dicts.
  Other metadata and non-dictionaries pass through the helper; malformed values may fail
  response validation. Add non-null model_max_budget_usage from B071 with entity USER, ID,
  user's model budgets and limiter dual cache. Cases response_nulls_and_spend, password_removed,
  directory_metadata_redacted, metadata_other_values_preserved and model_budget_usage pin this.

  V2 checks DB FIRST (HTTPException 500 CommonProxyErrors.db_not_connected_error), reparses raw
  user_id only when it contains a space, then defaults null to caller ID. Still-null ID raises
  400 'user_id is required. Either pass it as a query parameter or authenticate with a user-bound
  key.' Admin-view and self fetch target with object_permission included. Otherwise fetch
  caller, require truthy caller.teams, fetch target once, then all caller teams; a B800
  team-admin membership permits a target whose teams contains that team's ID. Org-admin alone
  grants nothing. Missing and unauthorized targets both produce 404 'User not found: {user_id}';
  unexpected reads propagate, never become a false 404. Cases v2_self_default, v2_admin_view,
  v2_team_admin_shared_team, v2_org_admin_not_sufficient, v2_missing_and_forbidden_equal,
  v2_unbound_400, v2_database_first and v2_db_failure_500 assert reads and object_permission.

  V2 returns only user_id,user_email,user_alias,user_role,spend,max_budget,models,budget_duration,
  budget_reset_at,metadata,created_at,updated_at,sso_user_id,teams,object_permission,
  model_max_budget,model_max_budget_usage. Missing spend defaults 0, falsey models/teams become
  empty lists, other optional values stay null. Apply directory redaction and B071 usage.
  Spend is the current resettable counter, not lifetime usage; no keys or team objects and
  no pagination. Cases v2_projection_defaults and v2_reset_counter_not_history compare all fields.

  Admin V1 uses one Postgres query with independent json_agg subqueries: all teams and keys
  excluding team_id=litellm-dashboard while retaining null team IDs. Null aggregates become [],
  null key models becomes []; validate rows and sort teams by alias-or-empty. Empty query
  result or invalid rows fail. Fetch admin's own row afterwards, remove password ONLY: this
  branch does NOT redact SCIM metadata or add model usage. Cases admin_global_projection,
  admin_empty_aggregates, admin_invalid_row, admin_self_missing and admin_metadata_asymmetry.

  Key projection preserves order and all row fields including stored token hash; it does not
  decrypt credentials. Null input becomes []. Only exact master-hash match AND the setting
  disable_master_key_return is boolean true drops a master row (default false; string 'true'
  and integer 1 do not). Dump via model_dump, falling back to dict on any exception; exclude
  dashboard tokens. Non-null team IDs get first matching alias or JSON null; no team gets
  literal string 'None'. Cases key_master_exact_boolean, key_ui_session_filtered,
  key_dump_fallback and key_alias_null_vs_string cover these branches.

  Each route's own except logs then calls B124 handle_exception_on_proxy: HTTPException becomes
  internal_server_error with its status and param from detail or string 'None'; ordinary errors
  become 500, existing ProxyException passes through. Preserve B2334 query-decoder errors under
  this mapping. Cases route_error_mapping and query_decoder_error compare status,type,message,
  param,code; auth failures before handlers remain B052's.


  Build the production user_info module in betterlite-server; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _enforce_user_info_access (L763-L790; 24 source lines), _UserInfoDataClient.get_data (L795-L795; 1 source
  lines), _UserInfoDataClient.get_data (L798-L804; 7 source lines), _UserInfoDataClient.get_data (L807-L813;
  7 source lines), _get_user_info_keys (L816-L824; 9 source lines), _get_user_info_teams (L827-L876; 43
  source lines), _redact_scim_enterprise_metadata (L884-L893; 10 source lines), _build_user_info_response
  (L896-L924; 26 source lines), user_info (L934-L1005; 59 source lines), _check_user_info_v2_access (L1008-L1064;
  38 source lines), user_info_v2 (L1074-L1170; 80 source lines), _fetch_admin_teams_and_keys_rows (L1173-L1176;
  4 source lines), _get_user_info_for_proxy_admin (L1179-L1241; 49 source lines), _process_keys_for_user_info
  (L1244-L1283; 34 source lines).


  Pinned setting: general_settings.disable_master_key_return=false, read at L1258-L1263.
  Preserve its exact-boolean predicate at the B002 configuration boundary.


  B001 HTTP cases exercise both routes against running gateways. Native cases cover helper-only
  null/nonlist/fallback branches. Postgres checks use POSTGRES_TEST_URL or testcontainers and
  fail if infrastructure is unavailable. There are no database writes.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Config cases master_return_default_false and master_return_exact_boolean call B002 and inspect
  keys for absent,false,true,string and numeric settings. Seed config_yaml with the real nested
  setting; this component has no fallback parser.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 391 source lines before docstring removal including declarations and SQL; allow
  315 production, 350 behavior/Postgres tests, 70 wiring and 50 config lines, 785 changed lines
  within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
