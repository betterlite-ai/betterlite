dod:
  - text: >-
      Lasso async_pre_call_hook expands messages via _expand_messages_for_classification,
      calls _run_lasso_guardrail with message_type=PROMPT, and applies masked messages back
      to request via _map_masked_messages_back when mask=True and violations are detected.
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      Lasso async_moderation_hook calls _run_lasso_guardrail with message_type=PROMPT for
      during-call inspection and applies masking to current request state via _map_masked_messages_back.
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      Lasso async_post_call_success_hook extracts response.choices[].message content and tool_calls,
      builds inspection_messages, calls _run_lasso_guardrail with message_type=COMPLETION,
      and applies masked output to response via _apply_masking_to_model_response.
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      _run_lasso_guardrail selects /classify (default) or /classifix (when mask=True and
      not has_non_string_content), expands messages for inspection via _expand_messages_for_classification,
      and delegates to _handle_classification or _handle_masking based on self.mask and multimodal detection.
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      _map_masked_messages_back preserves original message structure while applying masked content,
      tracking tool_use by id and tool_result by tool_use_id, and rewrites text positionally only when
      text message counts match; falls back to no rewrite on count mismatch.
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      _update_tool_calls_from_masked rewrites msg.tool_calls[].function.arguments from a
      dict keyed by call_id (from masked_tool_calls), preserving call order and other fields.
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      _expand_messages_for_classification flattens tool_use (with id, name, input) and tool_result
      (with tool_use_id, content) blocks into Lasso-format dicts, preserves original message count for
      Responses-API input routing, and handles role precedence (model > user).
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      _apply_masking_to_model_response writes masked content back to response.choices[],
      handling model-response (text/assistant role) and text-completion (text field) shapes,
      removing reasoning_content/thinking_blocks/reasoning_items on fallback to block.
    proof: [lasso-masking-behaviors, lasso-masking-oracle]
  - text: >-
      Lakera _mask_pii_in_messages applies [MASKED TYPE] tokens by detector_type, working backward through
      indices to preserve validity, and counting entity detections by type.
    proof: [lakera-pii-behaviors, lakera-pii-oracle]
  - text: >-
      Lakera _is_only_pii_violation returns true when breakdown contains only pii/* detectors,
      triggering auto-mask without blocking or advisory.
    proof: [lakera-pii-behaviors, lakera-pii-oracle]
  - text: >-
      Lakera _get_http_exception_for_blocked_guardrail builds HTTPException with 400 status and
      renders guardrail response violations in detail.
    proof: [lakera-pii-behaviors, lakera-pii-oracle]
  - text: >-
      Python adapters for lasso_masking and lakera_pii invoke production logic from covered functions,
      pass strict ruff/basedpyright without Any or broad suppressions, and register helper operations
      in tools/oracle/src/helpers.
    proof: [helper-python, helper-registration]
  - text: No oracle HTTP cases; masking operations are pure functions only.
    proof: []

checks:
  optional: []
  commands:
    - id: lasso-masking-behaviors
      why: Lasso masking and lifecycle tests are absent or fail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/::lasso_masking_behaviors(::|$)/) or test(/::lasso_masking_lifecycle(::|$)/)'
    - id: lasso-masking-oracle
      why: Oracle cases for Lasso masking are missing or fail
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/lasso-masking)" && cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/lasso-masking/
    - id: lakera-pii-behaviors
      why: Lakera PII detection and masking tests are absent or fail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/::lakera_pii_behaviors(::|$)/) or test(/::lakera_pii_masking(::|$)/)'
    - id: lakera-pii-oracle
      why: Oracle cases for Lakera PII are missing or fail
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/lakera-pii)" && cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/lakera-pii/
    - id: helper-python
      why: Python adapters are missing, unregistered, untyped or fail lint
      run: test -f tools/oracle/helpers/b3779.py && test -f tools/oracle/helpers/b3779.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-registration
      why: Helper operations are unregistered
      run: grep -q 'LassoMasking' tools/oracle/src/helpers/guardrails/*.rs && grep -q 'LakeraProcessing' tools/oracle/src/helpers/guardrails/*.rs

