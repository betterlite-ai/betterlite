deviations:
  - what: >-
      Lasso message expansion for classification creates synthetic Lasso-format dicts from tool_use and
      tool_result blocks, losing some OpenAI field information (tool_calls array, tool_call_id). These
      fields are preserved in the original request and restored after masking via _map_masked_messages_back
      and _update_tool_calls_from_masked, not by passing them through Lasso's inspection.
    why: >-
      Lasso's API expects a flattened message list for inspection; the original OpenAI structure is
      required by downstream providers but not meaningful for PII/safety analysis.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L642-L721
  - what: >-
      Lasso masking of Responses-API input field writes back to data["input"] as a newline-joined
      string of masked_for_input text parts, not as a list or structured object.
    why: >-
      Responses-API input is always a string in the request; joining masked text parts preserves
      that format while avoiding silent data loss on mixed text/media input.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L434-L475
  - what: >-
      Lasso _map_masked_messages_back skips positional text rewrite when text message counts between
      original and masked do not match, avoiding wrong-message corruption; returns original messages
      in that case and logs the mismatch.
    why: >-
      Message count mismatch indicates Lasso dropped or synthesized messages; applying masked content
      at wrong positions corrupts the request, so fallback to no rewrite is safer.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L477-L563
  - what: >-
      Lasso _apply_masking_to_model_response removes reasoning_content, thinking_blocks, reasoning_items
      fields by catching exceptions on immutable response shapes; fallback is to set field to None if
      deletion fails.
    why: >-
      Reasoning fields are present on some model responses (Claude with extended thinking) but not on
      all response shapes; exception handling allows graceful degradation when fields are read-only.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L918-L973
  - what: >-
      Lakera PII-only violations are auto-masked in place regardless of on_flagged setting, overriding
      block/advisory policies for safety.
    why: >-
      Exposing raw PII to satisfy an advisory note or block message is strictly less safe than masking it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lakera_ai_v2.py#L821-L842

out_of_scope:
  - >-
    B3778 owns Lasso constructor, helper functions, _prepare_headers, _prepare_payload, _call_lasso_api,
    _process_lasso_response, error handling, and config model; this task calls those as public exports.
  - >-
    B107 owns Lakera lifecycle hooks (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook,
    async_post_call_streaming_iterator_hook) and Lakera advisory policy (inject_system_message,
    update_in_memory_litellm_params). This task owns pure masking and classification primitives only.
  - >-
    Framework logging decorators, dynamic request params, transport primitives (F, H, E framework owners);
    this task calls logging_guardrail_information and standard logging helpers only.
  - >-
    call_v2_guard is owned by B107 as part of Lakera's lifecycle entry points; this task does not
    directly call or own it. The _mask_pii_in_messages, _is_only_pii_violation, and
    _get_http_exception_for_blocked_guardrail functions are pure helpers that receive the violation
    results from call_v2_guard through B107's orchestration.

pitfalls:
  - Lasso message expansion creates synthetic Lasso-format messages for inspection but loses OpenAI field
    information; those fields must be preserved in the original request and restored after masking.
  - Lasso _map_masked_messages_back skips positional text rewrite on count mismatch; logging the mismatch
    helps debug why content wasn't masked.
  - Lasso tool_calls rewrite uses call_id as key and preserves call order; _update_tool_calls_from_masked
    must iterate choices[].message.tool_calls and match by id.
  - Lasso Responses-API input rewrite joins masked_for_input text parts with newlines, not as a list.
  - Lasso reasoning field removal catches exceptions because some response shapes are immutable; fallback
    is setattr(..., None).
  - Lakera _mask_pii_in_messages works backward through indices to preserve string validity after each replacement.
  - Lakera PII-only violations are auto-masked before on_flagged routing checks, overriding other policies.

review_level: standard
