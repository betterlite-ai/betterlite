    why: _map_masked_messages_back maps Lasso-format masked response back onto OpenAI-format messages, preserving structure and handling tool_use/tool_result ordering
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L565-L587
