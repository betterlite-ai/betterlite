id: B3779
title: Lasso masking and Lakera PII primitives
description: >-
  Implement Lasso message expansion and masking while preserving tool-call shape and positional safeguards.
  For Lasso: async_pre_call_hook, async_moderation_hook, async_post_call_success_hook dispatch to
  _run_lasso_guardrail which selects /classify (classification only) or /classifix (classification with
  masking response). When mask=True and no multimodal content, _handle_masking applies Lasso's returned
  masked messages back to the request via _map_masked_messages_back, including tool-call argument redaction
  through _update_tool_calls_from_masked. Message expansion (_expand_messages_for_classification) flattens
  tool_use/tool_result blocks for inspection; post-call wraps response.choices[].message tool calls and
  content into inspection messages, then applies Lasso's masked output back via _apply_masking_to_model_response.

  For Lakera: build independent PII span masking, PII-only classification and block-error constructor.
  Lakera's lifecycle hooks validate requests and responses through call_v2_guard, routing PII-only violations
  to _mask_pii_in_messages when safe (no multimodal, no combined messages+input, no unmaskable fields), or
  to block/inject_system_message per on_flagged setting. PII masking handles both instructions (Responses-API)
  and messages, with scope filtering per skip_system_message_in_guardrail and skip_tool_message_in_guardrail flags.
  Lakera's lifecycle and advisory policy remain in B107; this task owns only the pure masking and classification
  helpers. Depends on B3778 for Lasso constructor, API call, helper functions, and config model.

