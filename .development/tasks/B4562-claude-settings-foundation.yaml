    why: ClaudeSettingsError, claude_settings_path, settings_file_owners and configure_state_path.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L134-L159
    why: The four model-choice types (StaticToken, KeepModel, UnpinModel, StartOn).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L221-L304
