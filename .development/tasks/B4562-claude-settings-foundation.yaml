id: B4562
title: Claude settings merge, private writes and status installation
description: >-
  Build Claude settings paths, model-choice types, the settings merge and the durable settings write in
  crates/betterlite-cli/src/claude_settings.rs and its paths, choices, merge, io, statusline_install and error
  submodules. claude_settings.rs stays the parent module: it declares every submodule, including the nested
  receipts module B4563 writes, and re-exports the public surface those submodules build.

  When `lite configure claude`, `lite up` or `lite autoroute start` runs, merge_claude_settings patches
  ~/.claude/settings.json to inject ANTHROPIC_BASE_URL, ANTHROPIC_AUTH_TOKEN and optional model pins, then
  removes conflicting credentials (apiKeyHelper, a stray ANTHROPIC_API_KEY) so Claude Code sends only one
  path. write_claude_settings lands the result through B192's staged private JSON, writing through a
  symlinked settings.json rather than replacing the link, so a dotfiles-repo symlink stays intact.
  refuse_while_owned stops a write while `lite up` or `lite autoroute start` already holds a backup it will
  restore.

  install_statusline_script no longer installs a script file. The status line is the CLI binary's own
  `statusline` subcommand (B4586), so this function only resolves the binary's own path, through
  std::env::current_exe() by default or an injected path in tests, and quotes it (B4560's quote_for_cmd on
  Windows, the shlex crate elsewhere) into the command line that Claude Code's statusLine setting and the
  Codex Stop hook both run. It never calls B4586's code, only its subcommand name, and B4586 never calls back
  into this task. See the deviation entry below for why this differs from LiteLLM's install.

  Preserve ownership guards (a settings file holds at most one of the `lite up` or `lite autoroute start`
  backups at a time), symlink targets, a user-owned status line (with_status_line leaves an existing
  statusLine entry alone unless it already runs betterlite's command), credential-slot replacement and
  optional default/tier model pinning (StaticToken, KeepModel, UnpinModel, StartOn). B4563's receipts module
  imports these path, merge and type contracts; it never calls write_claude_settings or
  install_statusline_script directly.
scope:
  paths:
    - crates/betterlite-cli/src/claude_settings.rs
    - crates/betterlite-cli/src/claude_settings/error.rs
    - crates/betterlite-cli/src/claude_settings/error/**
    - crates/betterlite-cli/src/claude_settings/paths.rs
    - crates/betterlite-cli/src/claude_settings/paths/**
    - crates/betterlite-cli/src/claude_settings/choices.rs
    - crates/betterlite-cli/src/claude_settings/choices/**
    - crates/betterlite-cli/src/claude_settings/merge.rs
    - crates/betterlite-cli/src/claude_settings/merge/**
    - crates/betterlite-cli/src/claude_settings/io.rs
    - crates/betterlite-cli/src/claude_settings/io/**
    - crates/betterlite-cli/src/claude_settings/statusline_install.rs
    - crates/betterlite-cli/src/claude_settings/statusline_install/**
    - crates/betterlite-cli/Cargo.toml
    - Cargo.lock
  lint_tables: false
