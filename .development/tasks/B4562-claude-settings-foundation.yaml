    why: Path and key constants, owned-path sets and STARTING_MODEL_ROLE.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L85-L99
