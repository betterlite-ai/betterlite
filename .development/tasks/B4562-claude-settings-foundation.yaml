dod:
  - text: claude_settings_path resolves CLAUDE_CONFIG_DIR when set, else ~/.claude/settings.json; settings_file_owners and configure_state_path key their result off whether the resolved path is that default.
    proof: [claude-settings-paths]
  - text: refuse_while_owned returns a ClaudeSettingsError naming an owner's start and stop commands while that owner's backup file exists, and returns nothing when neither backup exists.
    proof: [claude-settings-paths]
  - text: StaticToken, KeepModel, UnpinModel and StartOn are the four model-choice values merge_claude_settings and B4563's transaction accept; StartOn carries the model id STARTING_MODEL_ROLE documents.
    proof: [claude-settings-choices]
  - text: merge_claude_settings injects ANTHROPIC_BASE_URL and ANTHROPIC_AUTH_TOKEN, drops apiKeyHelper and any ANTHROPIC_API_KEY, sets the two ENABLE_* defaults only when missing, and applies default_model/tier_model only when given.
    proof: [claude-settings-merge]
  - text: with_status_line replaces an absent statusLine entry or one that already runs betterlite's command, and leaves any other command alone.
    proof: [claude-settings-merge]
  - text: load_json_or_empty returns an empty document for a missing or blank file and a ClaudeSettingsError for a file whose contents are not a JSON object.
    proof: [claude-settings-io]
  - text: write_claude_settings stages the document as private JSON and commits it to the settings file's resolved symlink target, never through the link itself.
    proof: [claude-settings-io]
  - text: install_statusline_script resolves std::env::current_exe() by default, accepts an injected path for tests, and returns the quoted "<binary> statusline" command line, using B4560's quote_for_cmd on Windows and the shlex crate elsewhere.
    proof: [claude-settings-statusline-install]
  - text: ClaudeSettingsError carries a source error for every failure above (an unreadable or non-object settings file, a failed write, a failed current_exe() resolution, a failed quote).
    proof: [claude-settings-error]
checks:
  optional: []
  commands:
    - id: claude-settings-paths
      why: settings path resolution, the two settings-file owners or refuse_while_owned's refusal are missing or wrong
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::paths::/)'
    - id: claude-settings-choices
      why: the model-choice types are missing or do not match what merge_claude_settings and B4563 expect
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::choices::/)'
    - id: claude-settings-merge
      why: merge_claude_settings or with_status_line keep, drop or overwrite the wrong keys
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::merge::/)'
    - id: claude-settings-io
      why: load_json_or_empty or write_claude_settings do not read, stage or commit the settings document correctly
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::io::/)'
    - id: claude-settings-statusline-install
      why: install_statusline_script does not resolve or quote the binary path, or does not accept an injected path for tests
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::statusline_install::/)'
    - id: claude-settings-error
      why: ClaudeSettingsError does not cover one of the failure paths above, or drops its source error
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::error::/)'
oracle_cases: []
deviations:
  - what: install_statusline_script builds the command line for the CLI binary's own `statusline` subcommand instead of installing a copy of a versioned status-line script file.
    why: In Rust the status line is a subcommand of the one betterlite binary (B4586), not a separate file LiteLLM ships and versions; there is nothing left to copy, lock or version-compare.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L307-L363
out_of_scope:
  - Receipt/fingerprint logic, the configure/unconfigure transaction and ownership restoration. B4563 owns configure_claude_settings and unconfigure_claude_settings in the nested receipts module.
  - Team-specific or PKCE-credential model choices and command wiring. This task only defines the four model-choice types and the merge rule that accepts them; command-level behavior stays in B4575/B4577.
  - The statusline subcommand's own rendering and session logic. B4586 owns crates/betterlite-cli/src/statusline.rs; this task only needs the subcommand's name, never B4586's code, and B4586 never depends on this task.
  - Full credential/token renewal, storage or keyring integration. B4574 and B4592 own credential lifecycle; this task's StaticToken only carries an already-resolved token string into merge_claude_settings.
pitfalls:
  - install_statusline_script does not write anything to disk; it only resolves and quotes a path. A caller that wants the result installed into Claude Code's statusLine setting still has to pass it through merge_claude_settings and write_claude_settings itself.
  - CLAUDE_CONFIG_DIR may point anywhere; a non-default settings.json gets its own configure_state_path keyed by its resolved path. Never assume settings live under ~/.claude/.
  - Configure, up and autoroute-start each have their own backup path (BACKUP_PATH vs AUTOROUTE_BACKUP_PATH). refuse_while_owned checks both on entry, so the file is only ever held by one owner at a time.
  - merge_claude_settings removes apiKeyHelper and any ANTHROPIC_API_KEY slot so Claude Code cannot choose between credentials; a missing credential slot is simply absent from the output, never an error.
  - Symlinks are detected with is_symlink(), not by inspecting the parent directory; write-target resolution only ever applies to the final settings file, never to an intermediate directory.
  - shlex's quoting and quote_for_cmd solve different problems, a POSIX shell's word-splitting versus cmd.exe's own parser plus the C runtime's argv split; do not use one for the other's platform.
  - shlex is already in Cargo.lock as a transitive dependency at 2.0.1; add it to crates/betterlite-cli/Cargo.toml pinned to that same release so cargo deny never sees two versions of the crate.
review_level: standard
budget:
  max_changed_lines: 1500
