id: B1439
title: GDCH credential exchange and audience-isolated token caching
description: >-
  Add gdc_auth in betterlite-provider for GDCGeminiConfig's constructor/auth state,
  _fetch_auth, _with_gdch_audience, _cached_fetch_token, _load_creds_from_key and
  validate_environment. B1438 supplies endpoint/project and bool-or-path settings.
  Validate base, then key, then effective project before loading credentials; missing
  values or bad project become B184 AuthenticationError 401 for gdc. All keys, EC
  material and access tokens remain secret-bearing and redacted. decode_gdc_key takes
  bounded UTF-8 credential bytes: invalid JSON is an ordinary bearer token, while valid
  JSON must be an object with type=gdch_service_account. Reject arrays, scalars and other
  Google credential kinds as authentication failures, without visiting their endpoints.

  Load format_version=1, private_key_id, private_key, name, project and token_uri,
  plus optional ca_cert_path, from the trusted configured credential descriptor.
  Mirror the pinned google-auth 2.52.0 GDCH exchange rather than substituting ordinary
  Google service-account OAuth or ADC. Use jsonwebtoken with rust_crypto for ES256/ES384;
  RustCrypto p256/p384 converts the accepted SEC1 or PKCS8 PEM into signing input.
  Keep cryptographic parsing/signing in those libraries; josekit is unsuitable because
  the repository bans its OpenSSL dependency. Missing/invalid key fields map to the
  source credential-load failure; do not infer an RSA credential from a GDCH type tag.
  Create JWT iss/sub=system:serviceaccount:{credential_project}:{name}, aud=token_uri,
  iat=clock and exp=clock+3600, with the private_key_id in kid. Bind the exchange audience
  to B1438's scheme://netloc, independently of the credential's project.

  POST JSON through B173 with grant_type=urn:ietf:params:oauth:token-type:token-exchange,
  requested_token_type=urn:ietf:params:oauth:token-type:access_token,
  subject_token_type=urn:k8s:params:oauth:token-type:serviceaccount, audience and the signed
  subject_token. Credential ca_cert_path overrides session ssl_verify when present;
  otherwise use B1438's SSL_VERIFY result. Keep local CA loading injected and bounded.
  Decode the bounded token reply in decode_gdc_token_reply; require access_token and
  accept expires_in as seconds or an integer string. Missing expiry means no expiry.
  Retain the SDK's three attempts for 500/503/504/408/429 or exact error/error_description
  internal_failure, server_error or temporarily_unavailable, using injected 1s then 2s
  waits with 10 percent jitter. Other failures stop immediately; HTTP transport itself
  still retries nothing. Apply the configured outbound deadline across all attempts.

  With caching false, bind and refresh a new handle each time. With caching true, key
  the bound handle by audience.rstrip('/') and credential identity: the exact secret
  api_key value when supplied, otherwise the injected source-handle identity. Reuse a
  truthy token only while valid; the SDK marks it expired 225 seconds before expiry.
  Insert the bound handle before refresh and retain it on refresh failure. Serialize
  the source cache's refresh critical section using a cancellation-safe request lease,
  without holding a Rust mutex guard across await. Cache only configured credential/
  audience pairs, bounded by the loaded deployment inventory; request values do not
  create credential identities or token endpoints. Tests assert cross-audience and
  cross-credential separation, one refresh for simultaneous callers and lease release.

  A service-account token overwrites exact Authorization. A plain token is inserted only
  when exact Authorization is absent, so lowercase authorization does not suppress it.
  Add Content-Type only when neither content-type nor Content-Type exists. Remove every
  case variant of x-goog-user-project, then set projects/{effective_project}. Preserve
  the original headers otherwise. Helper gdc_auth_projection uses fixture credential
  constructors solely to inspect source key-kind selection and header output; it never
  loads a real private key, refreshes or opens a path. New call.gdc_auth_projection seeds
  cover JSON-versus-bearer classification and header casing. Native scripted-transport
  tests verify actual JWT claims, exchange, retry/expiry and caching; fuzz both decoders
  with a tagged gdc_auth_payload target. The remaining source methods contain 114
  nonblank/noncomment lines plus credential declarations; the SDK exchange adds about
  110 lines of logic. Allocate 310 production, 240 tests, 95 adapters, 95 fuzz/replay and
  55 dependency/export lines, maximum 800.
scope:
  paths:
    - Cargo.toml
    - Cargo.lock
    - crates/betterlite-provider/Cargo.toml
    - crates/betterlite-provider/src/{lib,error,gdc_auth}.rs
    - crates/betterlite-provider/src/gdc_auth/**
    - crates/betterlite-provider/fuzz/Cargo.toml
    - crates/betterlite-provider/fuzz/fuzz_targets/gdc_auth_payload.rs
    - crates/betterlite-provider/fuzz/corpus/gdc_auth_payload/**
    - tools/oracle/src/helpers/provider/gdc_auth_projection.rs
    - tools/oracle/src/helpers/provider/gdc_auth_projection/**
    - tools/oracle/helpers/gdc_auth_projection.py
    - tools/oracle/helpers/gdc_auth_projection/**
    - tools/oracle/cases/helpers/gdc-auth-projection/**
    - tools/oracle/fuzz/corpus/helper_case/gdc_auth_projection*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gdc/chat/transformation.py#L34-L56
    why: Audience-bound credential protocol and per-config cache state.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gdc/chat/transformation.py#L164-L293
    why: Key-kind restriction, token refresh/cache identity and quota-project header replacement.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/uv.lock#L2475-L2485
    why: Pins google-auth 2.52.0, whose GDCH credential exchange is the required SDK behavior.
  - url: https://files.pythonhosted.org/packages/ee/fc/2cdc74252746f547f81ff3f02d4d4234a3f411b5de5b61af97e633a060b9/google_auth-2.52.0-py3-none-any.whl
    why: Read google/oauth2/gdch_credentials.py, google/oauth2/_client.py and credential validity helpers from this exact archive.
  - url: https://docs.rs/jsonwebtoken/latest/jsonwebtoken/enum.Algorithm.html
    why: Use library ES256 and ES384 signing rather than writing ECDSA or JWS encoding.
dod:
  - text: GDC distinguishes bearer keys from the restricted GDCH JSON credential type without leaking secrets.
    proof: [gdc-auth-tests, gdc-auth-python, oracle]
  - text: Signed exchange, retries and cached validity preserve audience and credential identity across concurrent callers.
    proof: [gdc-auth-tests]
  - text: Header casing and quota-project replacement match source projections.
    proof: [gdc-auth-tests, gdc-auth-python, oracle]
  - text: Both auth decoders and the projection helper exercise newly added corpus inputs.
    proof: [gdc-auth-corpus, gdc-auth-seeds]
checks:
  optional: []
  commands:
    - id: gdc-auth-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^gdc_auth::/) - test(replays_gdc_auth_payload_corpus)'
      why: Auth tests verify real signed claims and scripted token exchange, including refresh failure and cancellation.
    - id: gdc-auth-python
      run: test -f tools/oracle/helpers/gdc_auth_projection.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Restrict the oracle helper to fixture constructors and deterministic header/key-kind projections.
    - id: gdc-auth-corpus
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/gdc_auth_payload.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/gdc_auth_payload)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_gdc_auth_payload_corpus)'
      why: Credential JSON and token response bytes are separate tagged inputs to the same bounded replay target.
    - id: gdc-auth-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/gdc_auth_projection*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::provider::gdc_auth_projection::/)'
      why: New seeds assert gdc_auth_projection and cover both credential classification and header replacement.
oracle_cases:
  - tools/oracle/cases/helpers/gdc-auth-projection/invalid-json-is-bearer.yaml
  - tools/oracle/cases/helpers/gdc-auth-projection/valid-json-other-credential-rejected.yaml
  - tools/oracle/cases/helpers/gdc-auth-projection/gdch-audience-and-credential-identity.yaml
  - tools/oracle/cases/helpers/gdc-auth-projection/authorization-and-quota-header-casing.yaml
deviations: []
out_of_scope:
  - B1438 owns project/location selection, URL preparation, bool parsing and request-body cleanup in the covered GDC file.
  - B038 resolves server GDC key/base aliases and calls this auth adapter from the provider binding.
pitfalls:
  - 'The oracle helper for this task is pre-registered as gdc_auth_projection in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/gdc_auth_projection.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/gdc_auth_projection.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A syntactically valid JSON string is rejected as a credential object; only a JSON parse failure selects plain bearer mode.
  - GDC caches by both audience and credential identity, never by project or model alone.
  - A failed refresh leaves its bound credential handle installed for the next attempt.
budget: {max_changed_lines: 800, max_new_expects: 0}
review_level: security
