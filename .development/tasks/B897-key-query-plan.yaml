pitfalls:
  - 'The oracle helper for this task is pre-registered as key_query_plan in the server group. Replace the stub Op in tools/oracle/src/helpers/server/key_query_plan.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/key_query_plan.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - organization_id and exclude_team_id constrain only the own-key arm; team_id is a global filter.
  - Explicit sorting loses the token tie-breaker, and count may observe a later database state.
