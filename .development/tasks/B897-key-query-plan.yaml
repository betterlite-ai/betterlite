id: B897
title: Key SQL filters and paging query plans
description: >-
  Build predicates and query keys after B781 authorizes visibility. Every query excludes
  team_id litellm-dashboard but includes NULL team_id. Visibility ORs the own-user condition,
  optional created_by, admin-team keys and member-only service accounts. The own-user condition
  combines truthy string user_id (exact or insensitive substring), exclude_team_id and organization_id;
  those last two are NOT global filters on other OR arms. include_created_by_keys plus truthy
  user_id grants unscoped creator visibility when member_team_ids is None, personal creator keys
  for [], and current-team or personal creator keys for a nonempty list. Admin teams grant all
  keys; other member teams grant only user_id NULL keys. No arms leaves just UI-session exclusion.

  Globally AND key_alias (exact or insensitive substring), key_hash exact, search (exact token OR
  insensitive alias substring), team_id, project_id, access_group_id hasSome, agent_id, expiry and
  status. Empty strings skip filters. expires active means null or >= now; expired means nonnull
  < now; other values are ignored here. Status revoked means blocked True; active/expired require
  blocked None/False plus expiry. deleted chooses the archive table without an added status
  predicate; other statuses add nothing. Own the declarations at L6465-L6473, including blocked
  and expires defaults None. Status derivation gives revoked priority, assumes UTC for naive
  expiry and treats equality as active. Bind query values and reproduce the pinned Prisma contains
  operator; compare percent, underscore and backslash inputs against actual Postgres fixtures before
  choosing the SQL translation. This is not a prefix-search predicate.

  Sort columns are spend, max_budget, created_at, updated_at, token and key_alias. None sort_by
  returns None without validating order; invalid column/order raises HTTP 400 detail.error naming
  the permitted values. Order lowercases to asc/desc. Default sort is created_at desc then token
  desc; explicit sort has no extra tie-breaker. Defaults are return_full_object False,
  include_created_by_keys False, sort_order desc, substring flags False, other optional inputs
  None. Page/size are required by the caller; skip=(page-1)*size and total_pages is ceiling division,
  without local clamping or validation.

  Fetch page then count with the same predicates, without a snapshot transaction. Live rows include
  object_permission and litellm_budget_table; deleted rows do not. expand containing user gathers
  unique truthy owner/creator ids, fetches users once if nonempty, attaches full owner data and
  creator user_id/user_email/user_alias, and leaves missing users absent. Unknown expansions do
  nothing. Dump rows via model_dump then dict fallback. Every live row calls B816's permission
  attachment, even for token-only output. Full-object True or expand user returns B2314 auth rows
  or B720 deleted rows retaining deletion fields; otherwise return token strings. No derived status
  is inserted by this loop. Own KeyListResponseObject at _types.py L4884-L4888: keys and nullable
  total_count/current_page/total_pages. Queries propagate failures; debug diagnostics expose filters,
  skip/take, fetched count and total count. Postgres tests use POSTGRES_TEST_URL or testcontainers;
  only pure predicate/status/sort helpers enter oracle equality.


  Build the production key_query_plan module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _derive_key_status (L6476-L6483; 8 source lines), _validate_sort_params (L6843-L6872; 24 source lines),
  _build_expires_where_clause (L6875-L6878; 4 source lines), _not_blocked_where_clause (L6881-L6882; 2
  source lines), _build_status_where_clause (L6885-L6890; 6 source lines), _build_key_search_where (L6893-L6900;
  8 source lines), _build_key_filter_conditions (L6903-L7037; 111 source lines), _list_key_helper (L7040-L7222;
  156 source lines), _get_condition_to_filter_out_ui_session_tokens (L7225-L7234; 10 source lines).


  Add the key_query_plan operation under B856 Management::keys. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-query-plan-*
  seed to B171 helper_case, which already owns this decoder.


  Sizing: 329 lines before docstring exclusion plus the local declarations; allow 310 production/SQL,
  350 behavior/Postgres tests, 65 pure adapters and 30 wiring, 755 within 800. Only fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
