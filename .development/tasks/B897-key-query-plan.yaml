dod:
  - text: 'Cases ui_team_null_or_not_dashboard, own_admin_member_visibility,
      own_arm_org_and_excluded_team_not_global, creator_none_empty_current_teams,
      member_service_accounts_only, no_visibility_arm, all_global_filters_intersect,
      exact_token_or_alias_substring_search, empty_filters_skip, expiry_before_equal_after,
      blocked_null_false_true, revoked_precedes_expiry, naive_expiry_utc,
      unknown_expiry_status_ignored_here, sort_six_columns_casefolded_order,
      sort_missing_skips_invalid_order, sort_errors_400, default_tiebreaker_only,
      page_then_count_not_snapshot, deleted_table_no_live_relations, expand_owner_and_creator,
      expand_missing_users_and_unknown_names, token_only_still_attaches_permission,
      dump_fallback, full_live_vs_archived_rows, empty_page_zero_pages,
      query_failures_propagate, postgres_visibility_matrix and postgres_contains_metacharacters
      cover the complete plan.'
    proof:
      - behavior-tests
      - postgres-tests
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: postgres-tests
      why: NULL visibility, archive projection and page/count sequencing require real rows.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_query_plan::tests::postgres::/)'
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_query_plan::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/key_query_plan.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/key-query-plan-*")"
        && grep -rlq "key_query_plan" tools/oracle/fuzz/corpus/helper_case/key-query-plan-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
