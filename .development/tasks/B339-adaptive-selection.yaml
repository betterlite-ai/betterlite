id: B339
title: Adaptive request classification and bandit selection
description: 'Implement BanditCell, cold priors, capped posterior updates and Thompson selection over
  B388 typed preferences and B013 Decimal costs. Reuse rand_distr Beta sampling after a dependency comparison;
  accept scripted samples for cross-language oracle cases and seed the production sampler separately.
  Normalize monetary costs in Decimal before checked conversion of the dimensionless score into the statistical
  module. Nonmonetary statistical arithmetic uses f64 only in bandit_math; put one module-level #[expect(clippy::float_arithmetic,
  reason = "pinned statistical routing arithmetic")] there, counted in this task budget. Money, prices,
  spend and budgets stay rust_decimal::Decimal, including database and wire boundaries. Reject nonfinite
  statistical input. Assert selected model/tier exactly; any opt-in tolerance is for diagnostic scores
  only, never a different selection. Implement the owned native service in crates/betterlite-router/src/adaptive_selection.rs.
  Add ProbeOperation::AdaptiveSelection in tools/oracle/src/router_probes/mod.rs and the corresponding B339 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/adaptive_router/adaptive_router.py:
  _default_prefs (L70-L72), AdaptiveRouter.__init__ (L89-L115), AdaptiveRouter._init_cold_start_cells
  (L119-L124), AdaptiveRouter.async_pre_routing_hook (L169-L218), AdaptiveRouter.pick_model (L222-L239),
  AdaptiveRouter.get_state_snapshot (L241-L278), AdaptiveRouter._extract_min_quality_tier (L281-L309),
  AdaptiveRouter._eligible_models (L311-L318). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Function coverage in litellm/router_strategy/adaptive_router/bandit.py: BanditCell.mean (L36-L38), BanditCell.total_samples
  (L41-L42), initial_cell (L45-L61), apply_delta (L64-L75), thompson_sample (L78-L81), normalized_cost
  (L84-L94), score (L97-L109), pick_best (L112-L137). Implement these behaviors through the typed Rust
  services above; synchronous facades and structural accessors reuse the same primitive instead of separate
  ports. If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001 only on its
  explicitly named score/probability pointer. Selection, tie order, counts, statuses, money and provider
  requests remain exact. Six-decimal wire signals are compared after the source rounding, without widening
  tolerance.'
