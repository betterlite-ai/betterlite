id: B339
title: Adaptive request classification and bandit selection
description: Add adaptive_router configuration, the pinned request-type classifier, cold-start cells,
  cost normalization and score-based selection as typed modules. Expose the choice through B016, accept
  scripted quality samples for the deterministic oracle and separately test the production sampling distribution
  with a fixed seed. The production sampler must be a reviewed library solution compatible with the no-floats
  rule; this task is not dispatchable until the architect resolves that numeric dependency and precision
  contract. Keep nonmonetary posterior arithmetic distinct from Decimal money and reject invalid preferences
  before starting the router. Use the existing Rust crate boundaries from B004 and B008; integrate through
  the server when the provider dispatcher or callbacks live in another core crate. This task's source
  slices are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the
  matching adapters to B301's component runner where state is not observable over HTTP; adapters call
  production logic and never reproduce it. Use deterministic candidate sets or supplied random samples
  for comparisons, and separate seeded distribution tests for random choices. Extend the existing config_yaml
  fuzz target and committed corpus for every newly accepted config form; unsupported keys still fail by
  full path. Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle
  cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/adaptive-selection/**
  - tools/oracle/src/router_probes/adaptive_selection/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/adaptive_selection.py
  - tools/oracle/litellm/probes/registry.py
  - Cargo.toml
  - deny.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/classifier.py#L18-L139
  why: Request-type classifier precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/bandit.py#L29-L137
  why: Cold priors, cap, sampling and score.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L89-L124
  why: Initialization.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L169-L318
  why: Selection, minimum quality and header metadata.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/README.md#L1-L88
  why: State and attribution contract.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the adaptive_selection prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(adaptive_selection)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/adaptive-selection/request-type-precedence.yaml
- tools/oracle/cases/routing/adaptive-selection/cold-prior-strength-bonus.yaml
- tools/oracle/cases/routing/adaptive-selection/sample-cap.yaml
- tools/oracle/cases/routing/adaptive-selection/cost-normalization-no-spread.yaml
- tools/oracle/cases/routing/adaptive-selection/scripted-sample-winner.yaml
- tools/oracle/cases/routing/adaptive-selection/minimum-quality-header.yaml
- tools/oracle/cases/routing/adaptive-selection/no-eligible-default.yaml
- tools/oracle/cases/routing/adaptive-selection/one-adaptive-router-per-instance.yaml
deviations: []
out_of_scope:
- Feedback attribution (B340) and database flushing (B341).
pitfalls:
- Python and Rust RNG seeds do not produce comparable Beta samples.
- Persisted alpha/beta rows are deltas, not full posterior cells.
- No worker may add a lint exception or hand-written statistical sampler to escape the pending numeric
  decision.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
