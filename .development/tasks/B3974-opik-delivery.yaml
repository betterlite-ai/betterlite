id: B3974
title: Opik callback delivery and native client selection
description: >-
  Implement Opik callback construction and delivery, routing requests through the native Opik SDK when available
  and falling back to HTTP batch delivery otherwise. Preserve trace-before-span ordering and enforce the distinction
  between synchronous status 204 validation and asynchronous acceptance of 3xx+ status codes.

  The OpikLogger constructor resolves configuration through B3973's get_opik_config_variable, storing project name,
  API base URL (default https://www.comet.com/opik/api), API key, and workspace name. It initializes HTTP clients
  from B173 and optionally caches a native Opik SDK client via opik_client.get_client_cached() when the opik Python
  package is available. Failed async context setup logs a warning and leaves flush_lock as None, allowing sync-only
  operation.

  Success events call _should_skip_event to return early when standard_logging_object is missing. They then call
  B3973's build_opik_payload to construct trace and span records. When the native client is present, call its trace()
  and span() methods in order (trace first if present, span always). When absent, enqueue __dict__ representations
  to the batch queue and flush on size threshold. Async success uses log_queue for queueing; sync success sends
  immediately via _sync_send for both trace and span.

  The _sync_send helper sends a POST to the supplied URL with trace/span batch envelope, expecting HTTP 204 and
  raising on mismatch. _submit_batch handles async POSTs with lenient status code acceptance (any non-error response
  OK, 3xx+ logged but not raised). async_send_batch calls B3973's get_traces_and_spans_from_payload to classify
  the queue, sends traces then spans in separate requests, and logs event counts.

  Preserve the three-stage configuration fallback (user value, environment, default) and the distinction between
  async trace/span method calls requiring opik_client availability. The native client branch is live code, not dead
  code; preserve opik_client.get_client_cached() calls and reevaluate only when the native Opik task is explicitly
  scoped.

