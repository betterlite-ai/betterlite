id: B4808
title: Watsonx Orchestrate runs, polling and stream fallback
description: >-
  Build WXO run submission, terminal-state polling and buffered streaming adaptation
  using B4807 credentials and projections. Preserve the fallback boundary: only a
  transport failure before the streaming POST returns may submit a separate non-streaming run.

  Implement run submission via POST to the base URL `/v1/orchestrate/runs` (non-streaming)
  and `/v1/orchestrate/runs/stream` (streaming), extracting run_id from responses and building
  properly typed request bodies. Poll up to 90 times at 2-second intervals until a terminal
  state (completed, succeeded, failed, error, cancelled) is reached. Accept success states
  (completed, succeeded); terminate and fail for non-success terminal states (failed, error,
  cancelled). Implement a typed run decoder that safely parses run event JSON from both
  polling responses and SSE stream payloads without panicking on malformed input. Handle
  SSE streaming response content detection: non-SSE responses (application/json) are polled
  after read; text/event-stream responses are fully accumulated and parsed line-by-line,
  skipping malformed JSON and [DONE] markers. Implement a bounded SSE accumulator for
  fragmented line input that tracks line boundaries across chunk boundaries.

  Implement streaming fallback as a transport-only boundary: catch httpx.TransportError
  before the streaming POST response is returned, call handle_non_streaming, extract result text,
  and emit fake streaming events from the projection. Do not re-poll or fetch a run after
  HTTP status error, body-read failure, or JSON decode failure in the streaming path.

  Request timeouts: 90 seconds non-streaming, 120 seconds streaming. Implement the config
  contract (BaseA2AProviderConfig) by wrapping handler functions with request parameter
  extraction and error handling. Name test modules after the domain (watsonx_run_polling,
  watsonx_run_fallback, watsonx_stream_accumulator), not the task ID. Fuzz the run event
  decoder with a corpus seed containing valid/malformed/truncated JSON run payloads and
  fragmented SSE lines. Provide helper adapters that expose handler methods to oracle cases
  so submission, polling, streaming and fallback behavior can be validated against LiteLLM.
  Write oracle cases for the non-streaming flow (submission + poll), streaming success path
  (SSE), stream fallback on transport failure, fallback not triggered on post-response errors,
  content-type detection, and terminal-state classification.
scope:
