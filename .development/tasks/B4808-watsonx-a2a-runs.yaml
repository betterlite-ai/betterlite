dod:
- text: >-
    Run submission sends POST to /v1/orchestrate/runs (non-streaming) and /v1/orchestrate/runs/stream (streaming)
    with extracted litellm_params, base URL construction, auth headers and body from B4807 projections.
  proof: [watsonx-run-submission]
- text: >-
    Polling loop sleeps 2 seconds, polls /v1/orchestrate/runs/{run_id}, detects terminal states (completed,
    succeeded, failed, error, cancelled) and returns run data on success or raises after 90 attempts.
  proof: [watsonx-run-polling]
- text: >-
    Run event decoder parses JSON from both response bodies and SSE line payloads without panicking on
    malformed input; fuzz corpus contains valid/invalid/truncated JSON and multiline SSE payloads.
  proof: [watsonx-run-event-fuzz]
- text: >-
    SSE accumulator collects complete data, payloads line-by-line, skipping lines not starting with "data:",
    ignoring malformed JSON and [DONE], and preserving payload boundaries across fragmented input.
  proof: [watsonx-stream-accumulator]
- text: >-
    Content-type detection distinguishes text/event-stream from other responses; non-SSE responses are read
    and polled, SSE responses are accumulated line-by-line.
  proof: [watsonx-content-detection]
- text: >-
    Streaming fallback catches TransportError before response is returned, calls non-streaming handler, extracts
    result text, and emits fake streaming from B4807 projection without re-polling.
  proof: [watsonx-stream-fallback]
- text: >-
    Streaming POST that returns non-2xx status, experiences body-read failure, or fails JSON decoding after
    raise_for_status propagates the error without submitting a non-streaming fallback run.
  proof: [watsonx-stream-fallback]
- text: >-
    Non-streaming timeout is 90 seconds, streaming timeout is 120 seconds, both applied to client creation
    in handler implementations.
  proof: [watsonx-run-polling]
- text: >-
    BaseA2AProviderConfig implementation extracts litellm_params, calls typed handler and returns or yields
    properly formatted A2A responses from B4807 projections.
  proof: [watsonx-config-contract]
- text: >-
    Every oracle case for run submission, polling success/failure, streaming with SSE, fallback on TransportError,
    and content-type detection matches LiteLLM behavior.
  proof: [watsonx-oracle-cases]
checks:
  optional:
  - mutants
  commands:
  - id: watsonx-run-event-fuzz
    why: run event fuzz target or corpus is missing, or replaying the corpus fails
    run: >-
      test -f crates/betterlite-a2a/fuzz/fuzz_targets/watsonx_run_event.rs && test -n "$(ls -A crates/betterlite-a2a/fuzz/corpus/watsonx_run_event)"
      && cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(replays_the_watsonx_run_event_corpus)'
  - id: watsonx-run-submission
    why: run submission tests fail or do not exist
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_run::.*submission/)'
  - id: watsonx-run-polling
    why: polling loop or timeout tests fail or do not exist
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_run::.*polling/) | test(/^watsonx_run::.*timeout/)'
  - id: watsonx-stream-accumulator
    why: SSE line accumulation or fragmented input handling fails or tests do not exist
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_run::.*accumulator/)'
  - id: watsonx-content-detection
    why: content-type detection for SSE vs JSON response fails or tests do not exist
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_run::.*content/)'
  - id: watsonx-stream-fallback
    why: streaming fallback on TransportError fails or tests do not exist
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_run::.*fallback/)'
  - id: watsonx-config-contract
    why: config wrapper or BaseA2AProviderConfig implementation tests fail or do not exist
    run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^watsonx_run::.*(handler|config)/)'
  - id: watsonx-oracle-cases
    why: oracle cases fail or do not exist
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/watsonx-orchestrate)" && cargo nextest run --locked --no-tests=fail --package betterlite-oracle -E 'test(watsonx_run|watsonx_stream)'
