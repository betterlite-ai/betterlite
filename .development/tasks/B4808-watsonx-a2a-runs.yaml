deviations:
- what: >-
    Streaming fallback only catches transport failures (httpx.TransportError equivalent) before the POST returns.
    HTTP error status codes and body-read failures do not trigger fallback; those errors propagate.
  why: >-
    Preserve the boundary that fallback is pre-submission only; post-submission failures cannot safely assume
    no work occurred on the remote agent.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/providers/watsonx_orchestrate/handler.py#L351-L378
out_of_scope:
- "Run result text extraction and fake streaming event building belong to B4807; this task uses them as a projection."
- "HTTP client creation and pooling belong to B173; this task calls injected client with configured timeouts."
- "Token retrieval and caching belong to B4807; this task calls the bearer token function and builds auth headers."
- "Config extraction and validation belong to B4807; this task receives validated WXORequestParams."
- "Error classification and recovery belong to B4813; streaming failures are not retried with localhost fallback here."
pitfalls:
- "The fallback boundary is transport-only: catch the error before the response object is returned by client.post(),
  not after headers or body chunks have arrived."
- "Polling sleeps before each GET, not after, so 90 attempts spends up to 180 seconds even if all succeed."
- "Run event decoder must handle both polling GET responses (direct JSON) and SSE stream data: payloads (JSON strings
  from line content after \"data:\")."
- "Content-type detection checks the response header after the POST succeeds; non-SSE responses still need polling."
- "SSE line accumulator must handle \"data:\" prefixes, payload JSON, and [DONE] marker on any line."
- "Terminal states include both success (completed, succeeded) and failure (failed, error, cancelled); poll until
  any terminal state is reached, then check success separately."
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
