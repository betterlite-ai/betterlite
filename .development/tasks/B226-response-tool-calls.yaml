id: B226
title: Normalized response tool-call extraction
description: >-
  Implement Every function and NormalizedToolCall in this range, including get_tool_calls_from_response, has_tool_with_name
  and resolve_structured_messages and their private parsing/selection helpers. Handle typed bounded projections
  of chat, Responses and Anthropic envelopes without importing future endpoint crates. Preserve all-choice selection
  and call IDs. Router B016/B021, guardrails B100 and spend index B069 consume these helpers directly. All functions
  are pure and bounded, use injected policy and preserve source values. Budget 280 transforms/types, 110 adapters,
  300 tests and 60 wiring (750 total). Add the response_tool_calls cargo-fuzz target, call the production parser,
  and commit/replay malformed and boundary seeds. Write the behavior rstest functions b226_behavior_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. Register helper operations response_tool_calls in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/lib.rs
  - crates/betterlite-prompts/src/error.rs
  - crates/betterlite-prompts/src/response_tool_calls.rs
  - crates/betterlite-prompts/src/response_tool_calls/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/response-tool-calls/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-prompts/fuzz/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L5372-L5673
  why: Exact function/branch ownership.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
- text: The outside-byte parser has its target and newly committed production replay corpus.
  proof:
  - response-tool-calls-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::b226_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'response_tool_calls' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: response-tool-calls-corpus
    why: the required new behavior or its evidence is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-prompts/fuzz/corpus/response_tool_calls)"
      && test -f crates/betterlite-prompts/fuzz/fuzz_targets/response_tool_calls.rs && test -n "$(ls -A crates/betterlite-prompts/fuzz/corpus/response_tool_calls)"
      && cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(replays_the_response_tool_calls_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/response-tool-calls/chat-first-choice.yaml
- tools/oracle/cases/helpers/response-tool-calls/chat-all-choices.yaml
- tools/oracle/cases/helpers/response-tool-calls/responses-function.yaml
- tools/oracle/cases/helpers/response-tool-calls/anthropic-tool-use.yaml
- tools/oracle/cases/helpers/response-tool-calls/has-tool.yaml
- tools/oracle/cases/helpers/response-tool-calls/structured-messages.yaml
- tools/oracle/cases/helpers/response-tool-calls/malformed-arguments.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B180 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
