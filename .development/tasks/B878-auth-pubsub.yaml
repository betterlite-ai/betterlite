id: B878
title: Publish and consume auth cache invalidations
description: >-
  Implement bounded typed auth invalidation message encoding/decoding, Redis publication and the owned
  subscriber lifecycle. decode_invalidation(&[u8]) feeds the production message decoder in the fuzz target.
  Inject LocalEviction::apply(Invalidation)->Result<(),CacheError>; B734 supplies the concrete entity-key
  eviction actions. Preserve local eviction before publication and warning-only transport failure without
  a dependency back to mutation endpoints.

  Use B120 coordination_redis_cache and pubsub-capable client selection, B126 Redis transport,
  B733 cache access and this
  task's LocalEviction interface. Channel is litellm_proxy.auth_cache_invalidation without a namespace;
  otherwise prefix namespace plus colon, including an empty namespace. JSON contains cache_key and
  only non-null new_value/ttl. Decode bytes with replacement UTF-8, require a JSON object and string
  cache_key (empty is accepted), ignore extra fields and use the last duplicate field. Numeric values
  exclude booleans; missing/null/string/bool new_value becomes a delete, and invalid ttl becomes None.
  Despite its name, _finite_number_or_none accepts nonfinite floats; the recorded numeric deviation
  below prevents them entering Decimal counters. The subscriber silently ignores malformed payloads.

  No coordination Redis means publication is a no-op. Remove completed pending tasks before checking
  the 1024 pending limit; at capacity warn and drop this publication, retaining local eviction and
  leaving other workers stale until TTL. Limit Redis calls to 16 in flight. Yield after scheduling,
  without waiting for the publish reply. Redis/client failures warn and never fail the mutation.
  evict_and_broadcast handles keys in supplied order, attempting deletion then publication for each;
  a failed local deletion warns but still publishes and proceeds to later keys. Track these tasks in
  the server's owned task set so shutdown cancels/drains them.

  Subscriber start is idempotent while a task exists; stop before start is a no-op, otherwise clear
  the task slot, cancel and await it. Subscribe before reading with ignore_subscribe_messages=true and
  a one-second poll timeout; empty polls continue. Failures warn and reconnect after 5,10,20,40,60,60
  seconds, resetting to 5 immediately after each successful subscribe. Always close the pubsub in
  finally, with close failures debug-only; cancellation escapes without backoff. Decode message.data
  only from a dictionary. A numeric new_value sets only additional in-memory caches, forwarding ttl,
  and leaves the primary user cache alone. Delete invalidations select the primary cache through
  in_memory_cache_for and delete from all additional caches, without touching Redis or republishing.


  Build the production auth_pubsub module in betterlite-auth; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/auth_cache_invalidation_pubsub.py:
  auth_cache_invalidation_channel (L29-L32; 4 source lines), _cache_invalidation_message_json (L42-L44;
  3 source lines), _finite_number_or_none (L47-L50; 4 source lines), _message_from_data (L53-L71; 19 source
  lines), _publish_to_redis (L74-L80; 7 source lines), publish_auth_cache_invalidation (L83-L123; 39 source
  lines), evict_and_broadcast (L126-L144; 18 source lines), AuthCacheInvalidationSubscriber.__init__ (L150-L159;
  10 source lines), AuthCacheInvalidationSubscriber.start (L161-L164; 4 source lines), AuthCacheInvalidationSubscriber.stop
  (L166-L175; 10 source lines), AuthCacheInvalidationSubscriber._run (L177-L198; 22 source lines), AuthCacheInvalidationSubscriber._consume
  (L200-L205; 6 source lines), AuthCacheInvalidationSubscriber._apply_message (L207-L218; 12 source lines),
  AuthCacheInvalidationSubscriber._close_pubsub (L221-L225; 5 source lines).


  Add the auth_pubsub operation under B856 Management::auth. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-pubsub-*
  seed to B171 helper_case, which already owns this decoder.


  This task owns the outside-byte boundary auth_pubsub::decode_invalidation(&[u8]) -> Result<TypedValue,DecodeError>
  for Redis invalidation message bytes. Production calls this decoder before its typed policy functions;
  the cargo-fuzz target auth_pubsub calls that same function. Seed valid, truncated, malformed, duplicate-field
  and limit-boundary inputs and add auth_pubsub::tests::replays_the_auth_pubsub_corpus. Reuse B002 limits
  for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string decoder cap bytes
  at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or fetching URLs. B733
  owns crates/betterlite-auth/fuzz; depend on it and register this decoder target without recreating the
  workspace.


  Sizing: 163 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  190 production, 260 behavior tests, 75 adapters, 30 wiring and 55 fuzz lines, 610 within a 650-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: message_byte_limit, message_depth_limit,
  nonfinite_counter_dropped and shutdown_drains_publishes.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
