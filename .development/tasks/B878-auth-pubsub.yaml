dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: local_eviction_before_publish,
      redis_outage_warning, spend_floor_message, malformed_message, shutdown_closes_pubsub,
      namespace_none_empty_present, json_omits_nulls, utf8_replacement, empty_cache_key,
      extra_and_duplicate_fields, numeric_bool_string_null_matrix, no_redis_noop,
      completed_publish_slots_reused, pending_1024_warns_drops, at_most_16_inflight,
      publish_does_not_wait, eviction_failure_still_publishes, key_effect_order,
      start_idempotent_stop_restart, poll_timeout_and_empty, reconnect_backoff_cap_reset,
      cancellation_no_backoff, close_failure_debug, set_additional_only and delete_all_local_only.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The production decode_invalidation decoder is used by the service and its fuzz target and rejects
      malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'message_byte_limit, message_depth_limit, nonfinite_counter_dropped and shutdown_drains_publishes prove the explicit deviations.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_pubsub::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_pubsub.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-pubsub-*")"
        && grep -rlq "auth_pubsub" tools/oracle/fuzz/corpus/helper_case/auth-pubsub-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/auth_pubsub.rs && grep -q "auth_pubsub" crates/betterlite-auth/fuzz/Cargo.toml
        && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-auth/fuzz/corpus/auth_pubsub)"
        && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(replays_the_auth_pubsub_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/auth-pubsub/local-eviction-before-publish.yaml
  - tools/oracle/cases/helpers/auth-pubsub/redis-outage-warning.yaml
  - tools/oracle/cases/helpers/auth-pubsub/spend-floor-message.yaml
  - tools/oracle/cases/helpers/auth-pubsub/malformed-message.yaml
  - tools/oracle/cases/helpers/auth-pubsub/shutdown-closes-pubsub.yaml
  - tools/oracle/cases/helpers/auth-pubsub/message-shapes.yaml
  - tools/oracle/cases/helpers/auth-pubsub/publish-capacity.yaml
  - tools/oracle/cases/helpers/auth-pubsub/subscriber-reconnect.yaml
  - tools/oracle/cases/helpers/auth-pubsub/set-versus-delete.yaml
deviations:
  - what: New otherwise unbounded byte decoders reject over 1048576 bytes or JSON depth 64, respecting
      smaller inherited limits.
    why: Bound the specific outside-byte decoder named in this task; typed helpers inherit no artificial
      parser behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/auth_cache_invalidation_pubsub.py#L53-L71
  - what: Invalidations with nonfinite numeric values are warned and dropped instead of storing NaN or Infinity in a counter.
    why: Monetary counters use Decimal and cannot represent nonfinite values; a dropped message must not become a delete.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/auth_cache_invalidation_pubsub.py#L47-L50
  - what: Shutdown cancels and drains pending publications instead of leaving detached tasks.
    why: The async-hygiene rule requires server-owned work; normal publication remains asynchronous and best-effort.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/auth_cache_invalidation_pubsub.py#L117-L123
out_of_scope: []
pitfalls:
  - 'The oracle helper for this task is pre-registered as auth_pubsub in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/pubsub.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/auth_pubsub.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A spend reset SET received by its publishing worker must not delete the freshly reset counter or floor marker.
  - Subscription success resets backoff before consumption, so repeated consume failures each wait five seconds.
budget:
  max_changed_lines: 650
  max_new_expects: 0
review_level: security
