checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_principal_metadata::/)
      - test(/::replays_corpus$/)'
  - id: case-principal-tags-precedence
    why: the principal-tags-precedence behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_principal_metadata::tests::principal_tags_precedence($|::)/)'
  - id: case-caller-tags-distinct
    why: the caller-tags-distinct behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_principal_metadata::tests::caller_tags_distinct($|::)/)'
  - id: case-callback-policy-from-key
    why: the callback-policy-from-key behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_principal_metadata::tests::callback_policy_from_key($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/request_principal_metadata.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/request_principal_metadata-*)"
      && grep -qE "^[[:space:]]+request_principal_metadata:" tools/oracle/fuzz/corpus/helper_case/request_principal_metadata-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/request-principal-metadata)"
