id: B1106
title: Principal metadata and tags
description: >-
  Project authenticated key/team/project/user budget facts, tag provenance and callback policy into trusted request
  metadata. Keep caller_tags distinct from inherited_tags and preserve ordered merge precedence.


  Implement crates/betterlite-core/src/api/request_principal_metadata.rs. Use RequestPrincipalMetadaInput and RequestPrincipalMetadaResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions principal_tags_precedence, caller_tags_distinct, callback_policy_from_key
  under api::request_principal_metadata::tests. Each named function drives production code and asserts its case
  result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RequestPrincipalMetadata in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {request_principal_metadata: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.get_logged_api_key (L1615-L1618);
  litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.get_sanitized_user_information_from_key (L1621-L1650);
  litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.add_user_api_key_auth_to_request_metadata (L1653-L1703);
  litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.add_management_endpoint_metadata_to_request_metadata
  (L1706-L1732); litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.add_key_level_controls (L1735-L1778);
  litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup._merge_tags (L1781-L1802); litellm/proxy/litellm_pre_call_utils.py:
  LiteLLMProxyRequestSetup.add_team_based_callbacks_from_config (L1805-L1831); litellm/proxy/litellm_pre_call_utils.py:
  LiteLLMProxyRequestSetup.add_request_tag_to_metadata (L1834-L1852); litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.pre_seed_litellm_metadata_for_route
  (L1855-L1873); litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.apply_key_tags_pre_auth (L1876-L1896);
  litellm/proxy/litellm_pre_call_utils.py: LiteLLMProxyRequestSetup.apply_client_tag_policy_pre_auth (L1899-L1948).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 238 owned nonblank/non-comment/non-docstring Python lines (283 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 258 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 472 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B732 (Typed authentication principals and grant resolution), B171 (Direct helper oracle
  and URL path encoding), B1087 (Api boundaries), B1105 (Untrusted request controls), B1100 (Shared request body
  decoding). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.
