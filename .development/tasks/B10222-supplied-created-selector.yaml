references: []
dod:
  - text: betterlite-http's selected_client module holds the one Selected with choose and get, and no module in core, provider or openai declares its own enum over a supplied and a created client, video_remix_list_transport's Chosen included, or re-exports the moved one.
    proof: [selected-home, selected-copies]
  - text: Every user names betterlite_http::selected_client::Selected, and the owners' tests in core, provider and openai pass unchanged.
    proof: [selected-core-tests, selected-provider-tests, selected-openai-tests]
checks:
  optional: []
  commands:
    - id: selected-home
      why: the enum, its choose or its get did not reach betterlite-http's selected_client module
      run: |-
        grep -qxF "pub enum Selected<'client, Client> {" crates/betterlite-http/src/selected_client.rs &&
        grep -qF "pub fn choose<Build>(supplied: Option<&'client Client>, build: Build)" crates/betterlite-http/src/selected_client.rs &&
        grep -qxF '    pub const fn get(&self) -> &Client {' crates/betterlite-http/src/selected_client.rs
    - id: selected-copies
      why: a handler module, the openai container transport included, still declares its own Supplied and Created client enum, video_remix_list_transport keeps Chosen, or a module re-exports the shared enum
      run: |-
        test -z "$(grep -rlE '^ +Supplied\(&.[a-z]+ Client\),$' crates tools --include='*.rs' | grep -vxF crates/betterlite-http/src/selected_client.rs)" &&
        test -z "$(grep -rnw 'Selected' crates/betterlite-openai/src/containers/container_file_http/transport.rs)" &&
        test -z "$(grep -rnwE 'Chosen|Pooled' crates/betterlite-core/src/api/video_remix_list_transport --include='*.rs')" &&
        test -z "$(grep -rnE '^ *pub(\([a-z]+\))? use .*\bSelected\b' crates tools --include='*.rs')"
    - id: selected-core-tests
      why: a core handler no longer sends with the supplied client of its class or the one its source built
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(file_http_metadata|file_http_upload|genai_http|responses_compact_http|responses_create_http|responses_read_http|responses_write_http|vector_file_http_create_list|vector_file_http_read|vector_file_http_write|vector_search_execution|vector_store_http_create_read|vector_store_http_write|video_edit_transport|video_remix_list_transport|video_status_transport|videos_http_transport|container_collection_http|container_resource_http|container_file_list)::/) - test(/replays_/)'
    - id: selected-provider-tests
      why: the provider image generation, rerank, speech or transcription handler lost its client choice
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::(image_generation_http|rerank_http|speech_http|transcription_http)::/) - test(/replays_/)'
    - id: selected-openai-tests
      why: the openai container file transport no longer picks the supplied client or builds its own through choose
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^containers::container_file_http::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The enums the description lists as not copies: azure speech's Selected struct, the two boxed trait-object selectors in core vector_store_search and foundry agent_runs, the three logger enums, the three enums that borrow in both variants and the two response copies."
  - "The 21 select functions themselves (select_client, choose_async and the like): each checks a different client class, reads different params and returns its module's own error, so they stay."
  - "The rest of the openai container transport (ClientSource, BlockingClient, AsyncClient, ContainerHttpRequest and the reply types) is container-specific and stays in transport.rs."
  - "The per-module LogContext borrow pairs in the same service files, which B10216 also leaves out."
pitfalls:
  - "B10200 and B10216 edit most of these files before this task and shift the line numbers above, so find each site with `grep -rnwE 'Selected|Chosen' <module dir>` instead of by line; a dispatched run builds nothing, and each missed import costs a CI round."
  - "Move the openai block without edits: its `get` has no `#[must_use]` and `choose` still answers PoolError, so the six container callers compile as they are; only the PoolError import becomes `crate::proxy::pool::PoolError`."
  - "A `pub use` of the moved enum, in transport.rs or anywhere else, or a `type Selected<'c, C> = ...` alias is the same copy under a new name; import the betterlite_http path in each file that names the type."
  - "container_collection_http.rs L90 declares an unrelated tuple alias named `Chosen` over Selected; it stays, so the Chosen check looks only in video_remix_list_transport."
  - "core container_resource_http.rs has 300 of its 300 lines on main; a new import line there breaks the cap, so fold it into the existing line as `use betterlite_http::{proxy::transport_error::TransportError, selected_client::Selected};`, and count again after B10200 lands."
  - "video_edit_transport's and video_status_transport's copies are `pub`, but nothing outside their own modules names them, not betterlite-python and not the oracle, so no other crate needs an edit."
review_level: standard
budget:
  max_changed_lines: 600
  max_new_expects: 0
