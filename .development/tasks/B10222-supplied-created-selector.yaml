references: []
dod:
  - text: No core or provider handler module declares its own enum over a supplied and a created client, video_remix_list_transport's Chosen is gone, nothing re-exports the enum under another path, and betterlite-openai's Selected is the one left.
    proof: [selected-copies]
  - text: Every former copy's module and its child files name betterlite-openai's Selected, and the owners' tests in core and provider pass unchanged.
    proof: [selected-core-tests, selected-provider-tests]
checks:
  optional: []
  commands:
    - id: selected-copies
      why: a handler module still declares its own Supplied and Created client enum, video_remix_list_transport keeps Chosen, or a module re-exports the shared enum
      run: |-
        test -z "$(grep -rlE '^ +Supplied\(&.[a-z]+ Client\),$' crates tools --include='*.rs' | grep -vxF crates/betterlite-openai/src/containers/container_file_http/transport.rs)" &&
        test -z "$(grep -rnwE 'Chosen|Pooled' crates/betterlite-core/src/api/video_remix_list_transport --include='*.rs')" &&
        test -z "$(grep -rnE '^ *pub(\([a-z]+\))? use .*\bSelected\b' crates tools --include='*.rs')" &&
        grep -qxF "pub enum Selected<'client, Client> {" crates/betterlite-openai/src/containers/container_file_http/transport.rs
    - id: selected-core-tests
      why: a core handler no longer sends with the supplied client of its class or the one its source built
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(file_http_metadata|file_http_upload|genai_http|responses_compact_http|responses_create_http|responses_read_http|responses_write_http|vector_file_http_create_list|vector_file_http_read|vector_file_http_write|vector_search_execution|vector_store_http_create_read|vector_store_http_write|video_edit_transport|video_remix_list_transport|video_status_transport|videos_http_transport)::/) - test(/replays_/)'
    - id: selected-provider-tests
      why: the provider image generation, rerank, speech or transcription handler lost its client choice
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^api::(image_generation_http|rerank_http|speech_http|transcription_http)::/) - test(/replays_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The enums the description lists as not copies: azure speech's Selected struct, the two boxed trait-object selectors in core vector_store_search and foundry agent_runs, the three logger enums, the three enums that borrow in both variants and the two response copies."
  - "The 21 select functions themselves (select_client, choose_async and the like): each checks a different client class, reads different params and returns its module's own error, so they stay."
  - "Moving the enum out of betterlite-openai into betterlite-http: every user depends on betterlite-openai today, so the move waits for a user below it."
  - "The per-module LogContext borrow pairs in the same service files, which B10216 also leaves out."
pitfalls:
  - "B10200 edits most of these files before this task and shifts the line numbers above, so find each site with `grep -rnwE 'Selected|Chosen' <module dir>` instead of by line; a dispatched run builds nothing, and each missed import costs a CI round."
  - "The openai file is not in scope and must not change: its `get` has no `#[must_use]` and its `choose` returns PoolError, and the containers build against it as it is."
  - "A `pub use` of the openai enum, or a `type Selected<'c, C> = ...` alias in a module, is the same copy under a new name; import the openai path in each file that names the type."
  - "container_collection_http.rs L90 declares an unrelated tuple alias named `Chosen`; only video_remix_list_transport's enum goes, so the Chosen check looks only in that module."
  - "video_edit_transport's and video_status_transport's copies are `pub`, but nothing outside their own modules names them, not betterlite-python and not the oracle, so no other crate needs an edit."
review_level: standard
budget:
  max_changed_lines: 550
  max_new_expects: 0
