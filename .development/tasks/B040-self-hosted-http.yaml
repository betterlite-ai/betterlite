deviations: []
out_of_scope:
  - "The README contains no functions. Implementation of hosted chat/embedding belongs to B8150; hosted rerank, Responses, image edit, transcription, video and decisions to B8151; Docker, llamafile, LM Studio, Oobabooga, Xinference and Lemonade cost to B8152. References to those files are HTTP test context, not another implementation claim."
  - "The three initializer factories get_hosted_vllm_image_edit_config, get_hosted_vllm_video_config and get_xinference_image_generation_config construct B8151/B8152 configs at the B5360/B3332 selector seams. Retain those concrete constructions; a one-line Python factory needs no new Rust wrapper."
  - "B8157 owns the eight self-hosted _complete_* functions and embedding dispatch arms in main.py, Lemonade custom_llm_provider/get_config/get_models/transform_response and Ollama listing. B1440 owns the shared llamafile/lm_studio embedding branch. The OpenAI encoding resolution is B024 composition over B006; B044 applies the same main.py branch to litellm_proxy. B2220/B2224 retain Lemonade constructors/metadata."
  - "B010 owns the closed executable provider/operation registries. Preregistering B8157's missing self_hosted_dispatch seam is an architect correction recorded in the planner report; neither HTTP fixture task edits those shared files."
  - "All other main.py functions retain their existing owners, enumerated in B024's function inventory; this task's covers no longer claim main.py. utils.py parameter dispatch remains B5363/B175 and selection remains B2230/B5360/B3332/B3513. B1686 owns calling Lemonade cost_per_token."
  - "B004/B005/B006, B080, B082, B083, B085 and B3343 own the inference route families. B8610 owns root composition, B8634 Decisions/SystemOne mounting and B8636 production rerank/Responses ports. B8626/B8701/B8728 mount MCP, not self-hosted provider routes. B8609 with B8640/B8690 already owns the VLLM passthrough route and its HTTP cases."
  - "B9200 owns native Ollama/Triton/Petals and dynamic metadata HTTP cases; B8153/B8154/B8155/B8156 and B2223 implement them. vllm in-process and Petals local inference retain B8153's existing unapproved error-policy question, not a new deviation here. Python provider type exports remain B7929."
pitfalls:
  - "The README's encoding-format environment fallback belongs to the OpenAI embedding branch; applying it to hosted_vllm would break servers that reject the field."
  - "Hosted-vLLM embeddings omit the fake-api-key bearer while Responses and rerank send it; a shared fake-key rule would erase this difference."
  - "The hosted transcription URL always appends /v1/audio/transcriptions unless already complete, so a base ending /v1 would produce /v1/v1/audio/transcriptions."
  - "Oobabooga's chat dispatch deliberately passes no key, but its embedding dispatch forwards the key as Token; the two cases must not share an expected header."
  - "The video reference rejection must occur before any upstream call; a returned 4xx from a mock video service would not prove that check."
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
