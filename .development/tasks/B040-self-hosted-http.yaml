dod:
  - text: Compatible chat calls select the self-hosted transforms through the existing aliases and preserve tool, schema, URL, credential and response-model behavior.
    proof: [chat-cases, oracle]
  - text: Hosted, llamafile, LM Studio, Xinference and Oobabooga embedding requests reach their actual handlers, including their different authorization and usage rules.
    proof: [embedding-cases, oracle]
  - text: The README encoding-format precedence is observable on the OpenAI-compatible upstream request while hosted_vllm does not inject the environment default.
    proof: [encoding-cases, embedding-cases, oracle]
  - text: All hosted-vLLM media configurations and Xinference image generation work through the already registered public route aliases and preserve validation failures before upstream traffic.
    proof: [media-cases, oracle]
  - text: Proxy authentication and a provider 429 retain status, error type, param, code and stable headers without exposing configured credentials.
    proof: [error-cases, oracle]
checks:
  optional: []
  commands:
    - id: chat-cases
      why: The compatible chat adapters need new booted-proxy proof beyond their helper corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-compatible/chat)"
    - id: embedding-cases
      why: An OpenAI-only embedding case cannot establish the self-hosted handlers' distinct auth and response shaping.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-compatible/embedding)"
    - id: encoding-cases
      why: The remaining README contract needs requests proving the precedence and omission rules.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-compatible/encoding)"
    - id: media-cases
      why: Provider helper transforms must be exercised behind the public API-family routes.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-compatible/media)"
    - id: error-cases
      why: Successful requests alone do not prove authentication or provider error projection.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-compatible/errors)"
