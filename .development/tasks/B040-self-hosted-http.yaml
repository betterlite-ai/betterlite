id: B040
title: Compatible self-hosted inference and hosted-vLLM media HTTP parity
description: >-
  Finish the self-hosted umbrella with HTTP verification of its existing components.
  B8150 to B8157 planned helper cases, leaving the booted proxy untested for these
  providers. Their transforms and dispatch already have owners. The only exclusively
  claimed source left here is hosted_vllm/embedding/README.md, whose important contract
  is that hosted_vllm embeddings do not apply the OpenAI encoding-format default.
  Add cases for that distinction, compatible server chat/embedding calls and the
  hosted-vLLM media configurations. B9200 independently covers native Ollama, Triton,
  Petals and dynamic model metadata. No route, provider registry or production module
  is added here; report a failing implementation to its named owner.

  All cases are kind: http and run against the booted betterlite binary and pinned
  LiteLLM using the existing oracle, never --self-check as the task's parity proof.
  Use general_settings.master_key=sk-test, router_settings.num_retries=0, explicit
  model_info.id values, a fixed x-litellm-call-id and model_list deployment aliases.
  Provider URLs come from litellm_params.api_base or a named environment variable set
  to {{upstream}}. Disable background health checks. The cases compare upstream
  method/path/body, Authorization and content-type where applicable, the response
  status/body/content-type and stable x-litellm-* headers. Keep error type, param and
  code; ignore /error/message with the reason that betterlite writes its own prose.
  Generated request ids, timing fields and timestamps use only narrow documented
  ignores. Keep response usage, provider model names and upstream paths visible.

  Compatible chat. hosted-chat uses hosted_vllm/test-chat with a named custom tool,
  strict/additionalProperties in its schema and a user file content item whose format
  is video/mp4 and file_data is a data URI. Compare the upstream function tool and
  video_url item, and exercise thinking with an explicit reasoning_effort so the
  explicit choice wins. Include an assistant text/tool_use content list and an
  existing tool-call id to prove the actual B8150 message conversion runs.
  docker-chat uses docker_model_runner/ai/test, a content list and
  max_completion_tokens=7: the configured base ends /engines/llama.cpp/ and the target
  is /engines/llama.cpp/v1/chat/completions with max_tokens=7 and string content.
  llamafile-chat checks the configured key and /v1/chat/completions path.
  lm-studio-chat uses response_format={type: json_schema, schema: {type: object}}
  and checks wrapping under json_schema.schema. oobabooga-chat sets an explicit key
  but verifies that _complete_oobabooga's api_key=None prevents a Token header on
  chat; the base has no /v1 suffix because that handler appends /v1/chat/completions.
  lemonade-chat compares the response model lemonade/test-chat, even when the mock's
  OpenAI-shaped reply names a different model. These calls also prove B2230's selected
  configurations reach B8157 instead of falling through to plain OpenAI execution.

  The existing chat aliases are POST /v1/chat/completions, /chat/completions,
  /engines/{model:path}/chat/completions and
  /openai/deployments/{model:path}/chat/completions. Distribute the six chat cases
  across all four, with path models naming configured public aliases. This task never
  registers any alias again. Defaults exercised by these calls remain in their
  existing configuration owners: HOSTED_VLLM_API_BASE has no default and
  HOSTED_VLLM_API_KEY falls back to fake-api-key; Docker uses
  http://localhost:22088/engines/llama.cpp and dummy-key; llamafile uses
  http://127.0.0.1:8080/v1 and fake-api-key; LM_STUDIO_API_BASE is unset and its key
  falls back to fake-api-key. Lemonade's base defaults to http://localhost:8000/api/v1
  and its metadata sentinel key is lemonade. Explicit mock bases prevent connections
  to any of those default services. The cases consume existing loaders, not new keys.

  Embedding cases use POST /v1/embeddings, /embeddings,
  /engines/{model:path}/embeddings and /openai/deployments/{model:path}/embeddings.
  hosted-embedding configures a base ending /v1/embeddings/ and no provider key,
  sends a string input and sets LITELLM_DEFAULT_EMBEDDING_ENCODING_FORMAT=base64.
  The outbound URL has only one embeddings suffix, input is a list, the provider
  prefix is removed and neither encoding_format nor Authorization is injected.
  A second step explicitly sets encoding_format=float and dimensions=2 and verifies
  those fields survive. compatible-embeddings exercises separate llamafile and
  lm_studio deployments through B1440's shared embedding call with model/input,
  explicit deployment keys and extra_headers; compare the actual missing-only
  credential and header forwarding without applying their chat defaults to embeddings.
  xinference-embedding omits its provider key and checks stub-xinference-key at the
  configured base. oobabooga-embedding uses a key, receives Token rather than Bearer,
  forwards input without a model field, and returns two upstream embeddings: the
  response uses only the first vector and computes usage from its length.

  The README matrix uses openai/test-embed with the mock serving the compatible
  embedding endpoint. encoding-request sets request=float, deployment=base64 and
  environment=base64; encoding-config omits the request value and sets
  litellm_params.encoding_format=float with environment=base64; encoding-env has
  only LITELLM_DEFAULT_EMBEDDING_ENCODING_FORMAT=float; encoding-omitted leaves all
  three absent; encoding-none uses the literal none as the winning deployment value
  over environment=base64. The first three forward float, and the last two omit the
  field, including the SDK's implicit base64 default. Compare outbound bodies, not
  just the returned vectors. Source ownership stays B024's OpenAI embedding composition
  and B006's transport; B8157/B8150 own the separate hosted path. No default is
  invented for LITELLM_DEFAULT_EMBEDDING_ENCODING_FORMAT, which is unset by default.

  Media cases use B8151 via the already selected API families. rerank sends query,
  documents, top_n and valid truncation fields to hosted_vllm/test-rerank, with a
  configured base ending /v1/rerank. Check rewriting to /rerank, no null options in
  the body, and usage.total_tokens becoming both billed_units.total_tokens and
  tokens.input_tokens. Set a caller-supplied provider Authorization header and verify
  it takes precedence. rerank-invalid uses an invalid truncation_side and compares
  the 400 error with no provider request. responses uses hosted_vllm/test-responses
  and a base ending /v1/: the provider receives /v1/responses and Bearer fake-api-key
  when no key is set, unlike keyless hosted embeddings. Return a valid fixed Responses
  object, preserving its output, status and usage rather than a chat-shaped reply.

  image-edit uses B900 multipart input with a tiny valid PNG, prompt, model and size;
  the target is /v1/images/edits with a configured bearer key. A second step requests
  quality with drop_params=false and checks the unsupported-param result before any
  provider request. transcription uploads a tiny valid WAV with language and prompt,
  configured base={{upstream}} rather than {{upstream}}/v1, and compares the multipart
  request at /v1/audio/transcriptions and the returned text. video sends prompt,
  width, height, num_frames, generate_sound=false and structured extra_params to
  /v1/videos and checks form serialization, including the literal false string and
  structured JSON field; no input_reference is required. video-unsafe sends a
  structured image_reference containing image_url=http://127.0.0.1/private and
  requires the same rejection as the pinned provider with no media fetch or video
  request. This tests an existing B8151 validation rule, not a new permission policy.
  decisions makes both OpenAI-format and SystemOne-format requests to hosted_vllm
  with a named choice question, uses B3510's declared request/response records and
  verifies B3513/B3514's selected config, upstream /v1/systemone URL and absent
  Authorization when the placeholder key resolves to None. xinference-image sends prompt, n, size and
  response_format through the generation route and compares the existing selected
  XInferenceImageGenerationConfig's options and returned image data.

  Use steps for media aliases under the same config: rerank is POST /v2/rerank,
  /v1/rerank and /rerank; Responses is POST /v1/responses, /responses and
  /openai/v1/responses; image edits is POST /v1/images/edits, /images/edits and
  /openai/deployments/{model:path}/images/edits; generation has the same three forms
  ending /images/generations. Transcription is POST /v1/audio/transcriptions and
  /audio/transcriptions; video create is POST /v1/videos and /videos; decisions is
  POST /v1/decisions and /decisions; SystemOne is POST /v1/systemone and /systemone.
  Route owners already supply their other verbs and resource routes. The media-auth
  case repeats these representative family calls without a key and compares 401
  without an upstream call. upstream-error supplies a hosted-vLLM 429 with a fixed
  provider request-id header and checks the public error and retry/header projection
  with retries disabled. These are real HTTP errors, not helper exception classes.

  Keep the PNG/WAV fixtures in
  tools/oracle/fixtures/multipart-oracle/self-hosted-compatible; fixture names are
  relative to multipart-oracle, such as self-hosted-compatible/image.png. Existing multipart
  and case decoders suffice, so there is no new byte parser or fuzz target. There
  are zero new LiteLLM implementation lines; roughly 750 lines of compact fixtures
  and alias steps fit this part. The independent native-protocol fixture work is
  split into B9200 to keep either worker below the fixture budget.
scope:
  paths:
    - tools/oracle/cases/self-hosted-compatible/**
    - tools/oracle/fixtures/multipart-oracle/self-hosted-compatible/**
  lint_tables: false
