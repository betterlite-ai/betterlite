id: B315
title: Latency and first-token latency selection
description: 'Implement latency-based-routing selection over B389 samples, B013 capacity facts and B016
  candidate sets. Apply latency buffer, streaming TTFT/percentile rules and random ties with injected
  choices. Expose only the implemented routing_strategy_args; no callback accounting is duplicated. Configuration
  boundary keys introduced or consumed here: routing_strategy. Pinned declaration defaults: routing_strategy=''simple-shuffle''.
  Resolve env values once in betterlite-config, never in router code. Statistical arithmetic may use finite
  f64 only in latency_rank_math with one module-level #[expect(clippy::float_arithmetic, reason = "pinned
  statistical routing arithmetic")], counted in max_new_expects. Keep every price/spend/budget Decimal
  and compare selected model/tier exactly; diagnostic score tolerances cannot hide a selection difference.
  Implement the owned native service in crates/betterlite-router/src/latency_routing.rs. Add ProbeOperation::LatencyRouting
  in tools/oracle/src/router_probes/mod.rs and the corresponding B315 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/lowest_latency.py:
  LowestLatencyLoggingHandler._get_available_deployments (L370-L498), LowestLatencyLoggingHandler.async_get_available_deployments
  (L500-L523), LowestLatencyLoggingHandler.get_available_deployments (L525-L549). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001
  only on its explicitly named score/probability pointer. Selection, tie order, counts, statuses, money
  and provider requests remain exact. Six-decimal wire signals are compared after the source rounding,
  without widening tolerance.'
