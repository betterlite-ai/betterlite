deviations: []
out_of_scope:
- Cost selection or adaptive quality scoring.
- B389 owns latency and first-token observations; consume its tested public interface.
- 'litellm/router_strategy/lowest_latency.py: B389 owns: _average_latency (L34-L37), _percentile_latency
  (L40-L43), _ttft_seconds (L46-L49), LowestLatencyLoggingHandler.__init__ (L57-L59), LowestLatencyLoggingHandler.log_success_event
  (L61-L182), LowestLatencyLoggingHandler.async_log_failure_event (L184-L241), LowestLatencyLoggingHandler.async_log_success_event
  (L243-L368).'
pitfalls:
- Streaming selection uses TTFT only when usable TTFT samples exist.
- Compare the eligible tie set rather than Python and Rust random sequences.
- A missing observation is not the same as a failed request.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
