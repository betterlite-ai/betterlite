id: B315
title: Latency and first-token latency selection
description: Implement the latency selector and its success/failure observations over B304. Store bounded
  durations and samples, compute averages and configured TTFT percentiles without floats, and use B013
  token estimates for capacity screening. Expose routing_strategy_args only for the implemented latency
  fields. Test candidate sets before random tie-breaking and separately test seeded selection. Use the
  existing Rust crate boundaries from B004 and B008; integrate through the server when the provider dispatcher
  or callbacks live in another core crate. This task's source slices are the linked ranges, not a port
  of their Python classes. Add the listed oracle cases and the matching adapters to B301's component runner
  where state is not observable over HTTP; adapters call production logic and never reproduce it. Use
  deterministic candidate sets or supplied random samples for comparisons, and separate seeded distribution
  tests for random choices. Extend the existing config_yaml fuzz target and committed corpus for every
  newly accepted config form; unsupported keys still fail by full path. Keep the implementation, adapters
  and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/latency-routing/**
  - tools/oracle/src/router_probes/latency_routing/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/latency_routing.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L34-L368
  why: Latency/TTFT observations, failure penalties and bounded samples.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L370-L549
  why: Capacity checks, percentile and latency buffer.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the latency_routing prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(latency_routing)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/latency-routing/unseen-deployment.yaml
- tools/oracle/cases/routing/latency-routing/nonstream-mean.yaml
- tools/oracle/cases/routing/latency-routing/stream-ttft-mean.yaml
- tools/oracle/cases/routing/latency-routing/ttft-percentile-boundary.yaml
- tools/oracle/cases/routing/latency-routing/latency-buffer-inclusion.yaml
- tools/oracle/cases/routing/latency-routing/rate-limited-fastest.yaml
- tools/oracle/cases/routing/latency-routing/failure-penalty.yaml
- tools/oracle/cases/routing/latency-routing/stale-window.yaml
deviations: []
out_of_scope:
- Cost selection or adaptive quality scoring.
pitfalls:
- Streaming selection uses TTFT only when usable TTFT samples exist.
- Compare the eligible tie set rather than Python and Rust random sequences.
- A missing observation is not the same as a failed request.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
