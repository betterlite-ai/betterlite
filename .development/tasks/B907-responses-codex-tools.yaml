id: B907
title: Responses custom tools and tool choices
description: >-
  Implement custom/freeform tool conversion in betterlite-core::api::responses_codex_tools.
  Own custom_tools.py, the _attribute_fields/_input_item_role helpers and all three complete
  tool-choice methods in transformation.py. Re-export B2410's Codex history and additional-tools
  preparation from this family surface; those two files are covered by B2410 alone.
  Keep provider capability filtering separate from custom-to-function conversion.

  unwrap_custom_tool_arguments parses an untrusted JSON string only through 1,000,000 Python
  characters. Name the native decoder unwrap_custom_arguments(bytes, limits), preserving
  the character threshold and B1087's outer byte bound. Fuzz it and replay new corpus through
  replays_corpus. The responses_codex_tools helper calls the actual pinned methods; its
  projection preserves JSON string spelling, Python str fallbacks and complete tool schemas.
  Count 245 nonblank/non-comment owned lines after B2410's split. Budget 255 implementation,
  190 tests, 105 fixtures, 85 adapters, 65 fuzz/replay and 25 wiring: 725 lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_codex_tools.rs
  - crates/betterlite-core/src/api/responses_codex_tools/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/responses_codex_tools.rs
  - crates/betterlite-core/fuzz/corpus/responses_codex_tools/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_codex_tools.rs
  - tools/oracle/src/helpers/core_ops/responses_codex_tools/**
  - tools/oracle/helpers/responses_codex_tools.py
  - tools/oracle/helpers/responses_codex_tools/**
  - tools/oracle/fuzz/corpus/helper_case/responses_codex_tools-*
  - tools/oracle/cases/helpers/responses-codex-tools/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/custom_tools.py#L1-L213
  why: Own every custom-tool helper, including strict allowed_callers and bounded JSON unwrapping.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L179-L186
  why: Attribute-to-dict conversion and falsy-role default are shared by input/tool consumers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L227-L308
  why: Complete request tool-choice normalization and reverse Responses choice conversion, including decorators.
dod:
- text: >-
    custom_names extracts custom tool name=edit at top level and one namespace level,
    ignoring empty names, invalid records and deeper namespaces. Membership is exact and
    case-sensitive. Item IDs function_call/call_a -> fc_call_a and custom_tool_call/call_a ->
    ctc_call_a; empty IDs, unknown types and strings already starting fc or ctc stay unchanged,
    even fcabc without an underscore.
  proof: [tool-tests, oracle, tool-adapter]
- text: >-
    custom_schema sends type=custom,name=edit,description=Apply,format={syntax:lark,definition:start},
    allowed_callers=[direct]. Expect type=function,allowed_callers=[direct],function.name=edit,
    description="Apply\n\nFormat:\n```lark\nstart\n```",parameters={type:object,
    properties:{content:{type:string,description:"The edit content following the specified format"}},
    required:[content]}. Missing/non-string name or description becomes "". Missing/invalid/empty
    format contributes no suffix. Null allowed_callers omits the key; [] stays []; a string,
    tuple or [1] raises ValueError("allowed_callers must be a list of strings"). Non-custom returns null.
  proof: [tool-tests, oracle, tool-adapter]
- text: >-
    argument_strings serializes a dict {x:1} to '{"x": 1}', null/empty string to the supplied
    default (default=""), and other strings unchanged. Custom completed calls unwrap
    '{"content":"patch"}' to input=patch, '{"content":null}' to input="None", and content=7
    to "7". Empty input -> ""; malformed JSON, arrays and objects without content stay raw.
    Exactly 1,000,000 characters are parsed, 1,000,001 are returned untouched, including Unicode.
    Noncompleted custom calls output input=""; ordinary calls retain arguments at every status.
    Both keep call_id/name/status and use the item-ID rule above.
  proof: [tool-tests, oracle, tool-adapter, argument-corpus]
- text: >-
    tool_choices maps null->null and every string unchanged for requests. Dict type=auto/none
    becomes that string; required/tool/any becomes required. A truthy function.name keeps the
    entire original dict; type=function,name=f becomes {type:function,function:{name:f}}, with
    absent name falling back to required. type=custom uses top-level name before custom.name
    and also falls back to required. Unknown dicts/numbers pass through the request helper.
    Reverse conversion maps null/invalid values to auto, preserves valid Responses choices,
    flattens a chat function.name=f to {type:function,name:f}, and preserves a custom choice as
    {type:custom,name:edit} instead of relabeling it as function.
  proof: [tool-tests, oracle, tool-adapter]
- text: >-
    record_helpers gives a no-__dict__ value -> {}, a pair-iterable object -> its dictionary,
    and a __dict__ object yielding nonpairs -> the original conversion error. Role missing,
    null or "" defaults user; role=assistant stays assistant and a truthy unusual role is
    forwarded without validation. B2410's preparation exports remain callable through this module.
  proof: [tool-tests, oracle, tool-adapter]
checks:
  optional: []
  commands:
  - id: tool-tests
    why: custom tools or choices change names, payloads, schemas or defaults
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::/) - test(/::replays_corpus$/)'
  - id: tool-adapter
    why: the custom-tool operation has no checked independent Python projection
    run: test -f tools/oracle/helpers/responses_codex_tools.py && grep -qE '^[[:space:]]+responses_codex_tools:' tools/oracle/fuzz/corpus/helper_case/responses_codex_tools-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: argument-corpus
    why: the JSON argument decoder lacks new boundary and malformed-input seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_codex_tools)" && grep -qF unwrap_custom_arguments crates/betterlite-core/fuzz/fuzz_targets/responses_codex_tools.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::replays_corpus$/)'
