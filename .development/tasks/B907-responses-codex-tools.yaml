id: B907
title: Responses codex tools
description: >-
  Normalize Codex agent_message, context_compaction and local_shell_call items, hoist additional_tools and translate
  custom/freeform tools using typed records. Keep custom tool grammar and allowed_callers validation separate from
  provider capability filtering; use a named dropped-tool warning rather than losing unsupported tools invisibly.


  Implement crates/betterlite-core/src/api/responses_codex_tools.rs. Use ResponsesCodexToolsInput and ResponsesCodexToolsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions agent_message_text, context_compaction_item, local_shell_call, additional_tools_hoisting,
  custom_tool_grammar, invalid_allowed_callers under api::responses_codex_tools::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::responses_codex_tools::decode_responses_codex_tools(bytes:
  &[u8], limits: &ApiLimits), for json.loads input arguments at litellm/responses/litellm_completion_transformation/custom_tools.py:110.
  Place its implementation in crates/betterlite-core/src/api/responses_codex_tools.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/responses_codex_tools.rs passes arbitrary
  bounded bytes to that exact decoder; api::responses_codex_tools::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesCodexTools in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_codex_tools: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/responses/codex_compat.py: _agent_message_text (L57-L63); litellm/llms/base_llm/responses/codex_compat.py:
  _normalize_agent_message_item (L66-L75); litellm/llms/base_llm/responses/codex_compat.py: _normalize_context_compaction_item
  (L78-L83); litellm/llms/base_llm/responses/codex_compat.py: _normalize_local_shell_call_item (L86-L97); litellm/llms/base_llm/responses/codex_compat.py:
  _normalize_input_item (L100-L111); litellm/llms/base_llm/responses/codex_compat.py: normalize_codex_input_items
  (L114-L134); litellm/llms/base_llm/responses/codex_compat.py: drop_unsupported_tools (L137-L154); litellm/responses/additional_tools.py:
  _is_additional_tools_item (L28-L32); litellm/responses/additional_tools.py: _tools_of_item (L35-L40); litellm/responses/additional_tools.py:
  hoist_additional_tools (L43-L60); litellm/responses/litellm_completion_transformation/custom_tools.py: openai_shaped_tool_call_item_id
  (L35-L39); litellm/responses/litellm_completion_transformation/custom_tools.py: _tool_name_fields_of (L48-L52);
  litellm/responses/litellm_completion_transformation/custom_tools.py: _custom_tool_name_of (L55-L59); litellm/responses/litellm_completion_transformation/custom_tools.py:
  _nested_tools_of (L62-L66); litellm/responses/litellm_completion_transformation/custom_tools.py: extract_custom_tool_names
  (L69-L73); litellm/responses/litellm_completion_transformation/custom_tools.py: is_custom_tool_call (L76-L78);
  litellm/responses/litellm_completion_transformation/custom_tools.py: serialize_tool_call_arguments (L81-L93);
  litellm/responses/litellm_completion_transformation/custom_tools.py: unwrap_custom_tool_arguments (L96-L115);
  litellm/responses/litellm_completion_transformation/custom_tools.py: build_tool_call_item_kwargs (L118-L151);
  litellm/responses/litellm_completion_transformation/custom_tools.py: validated_allowed_callers (L162-L166); litellm/responses/litellm_completion_transformation/custom_tools.py:
  custom_tool_grammar_suffix (L169-L176); litellm/responses/litellm_completion_transformation/custom_tools.py: convert_custom_tool_to_function_tool
  (L179-L213); litellm/responses/litellm_completion_transformation/transformation.py: _attribute_fields (L179-L182);
  litellm/responses/litellm_completion_transformation/transformation.py: _input_item_role (L185-L186); litellm/responses/litellm_completion_transformation/transformation.py:
  LiteLLMCompletionResponsesConfig._transform_tool_choice (L228-L287); litellm/responses/litellm_completion_transformation/transformation.py:
  LiteLLMCompletionResponsesConfig._transform_tool_choice_for_responses_api_response (L290-L296); litellm/responses/litellm_completion_transformation/transformation.py:
  LiteLLMCompletionResponsesConfig._chat_tool_choice_as_responses_api_tool_choice (L299-L308). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 323 owned nonblank/non-comment/non-docstring Python lines (409 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 343 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 671 total within the 680-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B1087 (Api
  boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids
  retain ownership on the provider and keys/data branches.
