- tools/oracle/cases/helpers/responses-codex-tools/custom-names.yaml
- tools/oracle/cases/helpers/responses-codex-tools/custom-schema.yaml
- tools/oracle/cases/helpers/responses-codex-tools/argument-strings.yaml
- tools/oracle/cases/helpers/responses-codex-tools/tool-choices.yaml
- tools/oracle/cases/helpers/responses-codex-tools/record-helpers.yaml
deviations: []
out_of_scope:
- B2410 owns every function in codex_compat.py and additional_tools.py, including their diagnostics; they are dependencies re-exported here.
- Other methods in transformation.py belong to B908 options, B909 input dispatch, B910 reasoning merging, B911 repair, B912 tool results, B913 namespaces, B914 output assembly, B915 sessions and B1115 details.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_codex_tools in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_codex_tools.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_codex_tools.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The unwrapping cap counts characters, not UTF-8 bytes, and over-cap input is preserved rather than rejected by this helper.
- startswith(fc) and startswith(ctc) do not require an underscore, so fcabc must not become fc_fcabc.
- A custom call emits its unwrapped input only at status=completed; partial statuses intentionally expose an empty input.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
