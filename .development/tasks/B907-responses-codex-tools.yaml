  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::/)
      - test(/::replays_corpus$/)'
  - id: case-agent-message-text
    why: the agent-message-text behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::agent_message_text($|::)/)'
  - id: case-context-compaction-item
    why: the context-compaction-item behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::context_compaction_item($|::)/)'
  - id: case-local-shell-call
    why: the local-shell-call behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::local_shell_call($|::)/)'
  - id: case-additional-tools-hoisting
    why: the additional-tools-hoisting behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::additional_tools_hoisting($|::)/)'
  - id: case-custom-tool-grammar
    why: the custom-tool-grammar behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::custom_tool_grammar($|::)/)'
  - id: case-invalid-allowed-callers
    why: the invalid-allowed-callers behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::invalid_allowed_callers($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_codex_tools)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/responses_codex_tools.rs && grep -qF "decode_responses_codex_tools"
      crates/betterlite-core/fuzz/fuzz_targets/responses_codex_tools.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::responses_codex_tools::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_codex_tools.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_codex_tools-*)"
      && grep -qE "^[[:space:]]+responses_codex_tools:" tools/oracle/fuzz/corpus/helper_case/responses_codex_tools-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-codex-tools)"
