id: B910
title: Responses reasoning and assistant merging
description: >-
  Implement the three complete assistant-merge methods at transformation.py L731-L922 in
  betterlite-core::api::responses_reasoning_merge. Reasoning-only turns carry content=null;
  their text joins with newlines and signed thinking blocks prepend in original order to
  the next assistant. If a user/tool boundary intervenes, rebuild the pending standalone
  turns instead. Target assistant records are mutated as in LiteLLM; the outer list is new.
  Trailing hosted-search merging is a separate operation and must not merge arbitrary turns.

  Add responses_reasoning_merge helper comparisons for dict and typed chat records. B004
  supplies their representations. The methods only transform records and need no byte parser.
  There are 173 nonblank/non-comment source lines, including nested helpers and docstrings;
  budget 170 native lines, 120 tests, 75 fixtures, 75 adapters and 20 wiring, totaling 460.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_reasoning_merge.rs
  - crates/betterlite-core/src/api/responses_reasoning_merge/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_reasoning_merge.rs
  - tools/oracle/src/helpers/core_ops/responses_reasoning_merge/**
  - tools/oracle/helpers/responses_reasoning_merge.py
  - tools/oracle/helpers/responses_reasoning_merge/**
  - tools/oracle/fuzz/corpus/helper_case/responses_reasoning_merge-*
  - tools/oracle/cases/helpers/responses-reasoning-merge/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L731-L922
  why: Own standalone reasoning construction, pending-reasoning flushing and the complete trailing-assistant merge.
dod:
- text: >-
    reasoning_before_answer sends assistant(content=null,reasoning_content=a,thinking_blocks=[A]),
    assistant(content=null,reasoning_content=b,thinking_blocks=[B]), then assistant(content=answer,
    reasoning_content=c,thinking_blocks=[C]). Expect one answer turn with reasoning_content="a\nb\nc"
    and blocks [A,B,C], unchanged answer content and target fields. A tool-calling assistant
    is also a target. Non-string reasoning and non-list/empty thinking blocks do not count as pending.
  proof: [merge-tests, oracle, merge-adapter]
- text: >-
    reasoning_boundaries sends a pending reasoning turn followed by user content=q, then another
    pending turn at EOF; expect both standalone assistant turns retained in place with content=null.
    Rebuilt turns carry only role/content plus nonempty reasoning_content/thinking_blocks,
    dropping unrelated source keys. Assistant content="" or [] is not null and therefore ends
    pending accumulation. A standalone builder with no text/blocks emits {role:assistant,content:null}.
  proof: [merge-tests, oracle, merge-adapter]
- text: >-
    trailing_assistant merges last={role:assistant,content:a,tool_calls:[c]} and one new
    assistant content=b into content=[{type:text,text:a},{type:text,text:b}], retaining tool_calls.
    With falsy prior content it takes the new content directly. Existing list blocks stay ordered.
    New fields other than content are not copied. hosted_search=true allows merging without
    prior tool_calls; its default false does not.
  proof: [merge-tests, oracle, merge-adapter]
- text: >-
    trailing_rejections returns null for no prior messages, zero/two new messages, a typed
    non-dict last message, either non-assistant role, truthy new tool_calls or new content=null.
    An empty new content string can still merge. The last-message adapter preserves extra keys
    and malformed content raises its validation error rather than silently dropping a block.
  proof: [merge-tests, oracle, merge-adapter]
checks:
  optional: []
  commands:
  - id: merge-tests
    why: reasoning crosses a role boundary or changes signed-block order
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_reasoning_merge::/)'
  - id: merge-adapter
    why: assistant merge fixtures lack a typed pinned implementation
    run: test -f tools/oracle/helpers/responses_reasoning_merge.py && grep -qE '^[[:space:]]+responses_reasoning_merge:' tools/oracle/fuzz/corpus/helper_case/responses_reasoning_merge-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-reasoning-merge/reasoning-before-answer.yaml
- tools/oracle/cases/helpers/responses-reasoning-merge/reasoning-boundaries.yaml
- tools/oracle/cases/helpers/responses-reasoning-merge/trailing-assistant.yaml
- tools/oracle/cases/helpers/responses-reasoning-merge/trailing-rejections.yaml
deviations: []
out_of_scope:
- _deduplicate_tool_call_output_messages L925-L985 and _ensure_tool_call_output_has_corresponding_tool_call L988-L995 have no caller at the pin; neither receives implementation or cases.
- Other transformation.py methods belong to B907 custom tools, B908 options, B909 input dispatch, B911 history repair, B912 tool results, B913 namespaces, B914 output assembly, B915 sessions and B1115 output details.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_reasoning_merge in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_reasoning_merge.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_reasoning_merge.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- content="" is a merge target, not a reasoning-only pending turn; the test is specifically content is None.
- Reconstructing standalone reasoning discards extra source fields, whereas merging into a target preserves that target's fields.
- The trailing merge requires a dict last message even though reasoning merging accepts attribute-based records.
review_level: standard
budget:
  max_changed_lines: 460
  max_new_expects: 1
