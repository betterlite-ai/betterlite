oracle_cases: []
deviations:
  - what: >-
      Python-specific behavior: LiteLLM resolves environment variables at
      runtime when allow_env_credentials is true and explicit base URL is
      missing, isolating explicit credentials from environment fallback. Clock
      and UUID are injected standard-library/library facilities, not
      dependencies on a task-owned service.
    why: >-
      Betterlite resolves these at credential selection time. Environment
      isolation is enforced through the allow_env_credentials flag and explicit
      parameter precedence.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langsmith.py#L100-L127
out_of_scope:
  - Logger lifecycle and batching, owned by B112.
  - LangSmith HTTP delivery, owned by B112.
  - Dynamic callback parameters and cache, owned by other tasks.
pitfalls:
  - Default run name is 'LLMRun' from LANGSMITH_DEFAULT_RUN_NAME environment
    variable with 'LLMRun' fallback; metadata dict project_name defaults to
    LANGSMITH_PROJECT credential, not the run-name default.
  - Default LangSmith project is 'litellm-completion'; this applies only when
    neither parameter nor environment variable is set.
  - Session ID is suppressed when it exactly equals trace_id, preventing
    LangSmith rejection of a run-body session ID that duplicates the tracer
    session UUID.
  - Root-run consistency requires runs with no parent_run_id and no dotted_order
    to have trace_id matching run_id; LangSmith rejects entire batch if any run
    violates this rule.
  - Dotted-order format is timestamp strftime("%Y%m%dT%H%M%S%fZ") concatenated
    with run_id as string, not separately formatted; no separator between
    timestamp and ID.
  - _redact_metadata only redacts requester_metadata if it is a dict; non-dict
    values are left unchanged.
  - Extra metadata elevation checks session_id, thread_id and conversation_id
    only in requester_metadata; if present at top level, values are not
    overwritten or duplicated.
  - _build_outputs_with_usage uses payload["prompt_tokens"] / payload["completion_tokens"]
    defaults, returning 0 if keys missing; total_cost defaults similarly.
  - allow_env_credentials false with None langsmith_base_url (not just explicit
    URL) blocks environment fallback; the logic is allow_env_credentials false
    AND base_url is not None.

