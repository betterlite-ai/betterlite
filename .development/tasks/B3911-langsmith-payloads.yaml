id: B3911
title: LangSmith credentials and run payloads
description: >-
  Build typed LangSmith credential resolution and run-payload projection in
  betterlite-logging, isolating explicit-base-URL credentials from environment
  secrets. Extract and redact metadata including nested requester_metadata,
  suppress session IDs that duplicate trace IDs, enforce consistent trace and
  dotted-order values, and serialize run outputs with usage tokens and cost.

  Credential resolution reads LANGSMITH_API_KEY, LANGSMITH_PROJECT (default
  'litellm-completion'), LANGSMITH_BASE_URL (default
  'https://api.smith.langchain.com'), and LANGSMITH_TENANT_ID from environment
  or request-supplied parameters, isolating explicit-base-URL credentials from
  environment-fallback credentials across deployments. Metadata extraction
  normalizes run_name (default 'LLMRun' from LANGSMITH_DEFAULT_RUN_NAME env var),
  run_id, parent_run_id, trace_id, session_id and dotted_order from
  litellm_params.metadata. Redaction applies recursively to nested
  requester_metadata so no credentials appear in run bodies. Session ID
  suppression strips session_id when it equals trace_id. Dotted-order format
  is UTC timestamp (YYYYMMDDTHHMMSSfZ) concatenated with run ID string. Root-run
  consistency ensures runs without parent_run_id and dotted_order have trace_id
  matching the run ID; batches fail on trace_id/dotted_order mismatch in any
  run. Outputs reshape StandardLoggingPayload response and usage into LangSmith
  run format with input_tokens, output_tokens, total_tokens and total_cost
  fields.

  Functions to port: get_credentials_from_env (reads env or parameter values with
  fallbacks; allow_env_credentials flag isolates explicit-base-URL credentials
  from environment), _get_credentials_to_use_for_request (selects default or
  dynamic credentials by key/team), _extract_metadata_fields (normalizes
  metadata dict keys to run fields), _redact_metadata (applies
  redact_user_api_key_info to top level and nested requester_metadata),
  _build_extra_metadata (elevates session/thread/conversation IDs from nested
  requester_metadata to top level), _build_outputs_with_usage (maps
  StandardLoggingPayload response and usage to run outputs dict), _ensure_required_ids
  (generates UUID defaults for missing run_id, enforces trace_id==run_id for root
  runs, generates dotted_order prefix if missing), _prepare_log_data (orchestrates
  extraction, redaction, suppression and output building), _get_sampling_rate_to_use_for_request
  (returns dynamic or default sampling rate as float), make_dot_order (formats UTC
  timestamp + run ID).

  Direct dependencies: B002 for environment and config resolution; B188 for
  redact_user_api_key_info; B254 for StandardLoggingPayload, response, usage
  and error projections, StandardCallbackDynamicParams.

