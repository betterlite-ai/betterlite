dod:
  - text: get_credentials_from_env returns LANGSMITH_API_KEY, PROJECT (default
      'litellm-completion'), BASE_URL (default 'https://api.smith.langchain.com')
      and TENANT_ID from parameters or environment.
    proof: [credentials-env-tests]

  - text: allow_env_credentials false and langsmith_base_url provided isolates
      explicit-base-URL credentials from environment fallback, blocking env-var
      lookups for all four credential fields.
    proof: [credentials-isolation-tests]

  - text: _extract_metadata_fields normalizes metadata dict keys to run_name
      (default 'LLMRun'), run_id, parent_run_id, trace_id, session_id and
      dotted_order, reading from litellm_params.metadata.
    proof: [metadata-extraction-tests]

  - text: _redact_metadata applies redact_user_api_key_info to top-level metadata
      and recursively to nested requester_metadata dict if present.
    proof: [metadata-redaction-tests]

  - text: _build_extra_metadata elevates session_id, thread_id and conversation_id
      from requester_metadata to top-level extra dict if not already present,
      then redacts the result.
    proof: [extra-metadata-tests]

  - text: >-
      _build_outputs_with_usage maps StandardLoggingPayload response to dict
      outputs or {"output": response} for non-dict, adds usage_metadata with
      input_tokens, output_tokens, total_tokens and total_cost fields.
    proof: [outputs-usage-tests]

  - text: _ensure_required_ids generates UUID for missing run_id; sets trace_id
      to run_id if run has no parent_run_id and no dotted_order (root run);
      generates dotted_order prefix from timestamp if missing.
    proof: [id-consistency-tests]

  - text: _prepare_log_data orchestrates credential lookup, metadata extraction,
      redaction, extra-metadata elevation, session-ID suppression when it equals
      trace_id, output building, and ID enforcement to produce a complete run
      object with name, run_type, inputs, outputs, session_name, timestamps,
      tags, extra fields and optional error/run_id/parent_run_id/trace_id/session_id/dotted_order
      fields.
    proof: [log-data-assembly-tests]

  - text: _prepare_log_data raises exception if standard_logging_object is missing
      from kwargs.
    proof: [log-data-missing-payload-tests]

  - text: _get_sampling_rate_to_use_for_request returns langsmith_sampling_rate
      float from standard_callback_dynamic_params if present, otherwise returns
      default sampling_rate.
    proof: [sampling-rate-tests]

  - text: _get_credentials_to_use_for_request resolves all four credential fields
      from standard_callback_dynamic_params if present (with allow_env_credentials
      true only when langsmith_base_url is None), otherwise returns
      default_credentials.
    proof: [credentials-selection-tests]

  - text: make_dot_order formats UTC datetime as YYYYMMDDTHHMMSSfZ concatenated
      with run_id string.
    proof: [dot-order-format-tests]
