id: B10175
title: The server builds one production AWS credential chain, and Vertex workload identity resolves through it
description: >-
  betterlite has LiteLLM's whole credential resolution, `AwsCredentialResolver` in crates/betterlite-bedrock/src/credentials.rs L19-L25 (static keys, session token, profile, assumed role, web identity, then the AWS SDK default chain with environment keys, IRSA, container and instance metadata), but no production code builds one: it needs a CredentialCache, NativeSources, a SecretLookup and StsClientKwargs, and only tests make them (credentials/tests/support.rs L260-L295 and L349-L392). So every production AWS path that should resolve credentials passes a stub or has no caller. The server's Vertex embeddings answer an AWS workload identity pool credential with `UnavailableAws` (crates/betterlite-server/src/server/chat_setup/vertex_embedding/executor.rs L29-L38, used at L89), "AWS credential provider is unavailable", where LiteLLM's VertexAIAwsWifAuth calls BaseAWSLLM.get_credentials (vertex_ai_aws_wif.py L53-L120). This task builds the chain once in betterlite-bedrock, gives the server one instance and hands it to Vertex. B10176 hands it to the Python sessions; the other AWS callers take it from `Shared` when their tasks wire them. The decision is .development/decisions/2026-11-27-aws-credential-chain.md.


  The chain. A new module crates/betterlite-bedrock/src/credentials/chain.rs, declared with `pub mod chain;` in credentials.rs, holds `#[derive(Clone)] pub struct AwsCredentialChain { pub cache: Arc<CredentialCache>, pub native: Arc<NativeSources>, pub secrets: Arc<SecretLookup>, pub max_policy_size: i64 }`. A clone shares the one cache, like LiteLLM's class-level `_shared_iam_cache` (base_aws_llm.py L227-L238). `AwsCredentialChain::from_environment(environment: BTreeMap<String, String>, client: &ProxiedClient, secrets: Arc<SecretLookup>) -> Result<Self, ChainError>` builds: max_policy_size from `bedrock_web_identity::Raw::default().convert(&environment)` (BEDROCK_MAX_POLICY_SIZE, default 75, crates/betterlite-config/src/sections/bedrock_web_identity.rs L22-L40); `NativeSources` (aws_settings/sources.rs L43-L50) as a struct literal with that map, `Fs::real()`, `SharedHttpClient::new(AwsDuplexClient::from_proxied(client))` so STS and the SDK chain go through the proxy and TLS policy of the given client, `SharedTimeSource::default()`, `SharedAsyncSleep::new(TokioSleep::new())` and a 60 second timeout, the values betterlite-python's MCP signer uses (crates/betterlite-python/src/mcp/setup.rs L118-L125); and `CredentialCache::new` over a DualLocalCache whose memory is `LocalTtlCache::with_clock(Some(1000), None, None, 1024, <wall clock in seconds>)` (BEDROCK_IAM_CACHE_MAX_ENTRIES, constants.py L533; credential_cache.rs L74-L85 refuses any other capacity), with a Redactor of MINIMUM_CUSTOM_KEY_LENGTH and an emit that drops events, as python guardrail_call/functions.rs L22-L44 builds its cache. `ChainError` (thiserror, in chain.rs) has one variant per failing step with its source: the section, the local cache, the redactor and the credential cache.


  Two methods port LiteLLM's two entry points. `pub async fn get_credentials(&self, settings: &AwsSettings, ssl_verify: Option<&VerifySetting>) -> Result<Credentials, CredentialError>` (base_aws_llm.py L346-L510) and `pub async fn resolve_credentials(&self, settings: &AwsSettings, region: Option<&str>) -> Result<Credentials, CredentialError>` (L512-L526) each build the STS client settings for this call and then borrow an `AwsCredentialResolver` over the chain's parts and call its method of the same name. The STS settings are `sts_client_kwargs(&StsSettings { endpoint: settings.sts_endpoint, aws_region: AWS_REGION, aws_default_region: AWS_DEFAULT_REGION, configured_region: <the call's region, else settings.region_name> }, Verification::Enabled)` (aws_endpoints/sts.rs L47-L56) with the two variables read from `native.environment`, as `_build_sts_client_kwargs` and `_resolve_sts_region` do per call (L818-L843). An invalid STS endpoint is a new `CredentialError::StsEndpoint(#[from] AwsEndpointError)` (credentials/error.rs), transparent. The chain implements B10174's `credentials::CredentialSource` with `resolve_credentials(&settings, Some(&region))`.


  Seams it implements now. Vertex: `impl AwsCredentialsResolver for AwsCredentialChain` in crates/betterlite-vertex/src/aws_federation.rs beside the resolver's impl (L119-L126), calling `get_credentials(settings, None)`; credential_sources/aws.rs's blanket impl (L22-L35) then makes `Arc<dyn AwsCredentialsSource>` from it. Polly: `impl CredentialResolver for AwsCredentialChain` (B10173's async core trait, polly/speech/credentials.rs) in a new file credentials/chain/polly.rs, declared in chain.rs. It puts the ten `CredentialSources` fields into an `AwsSettings` literal (keys and tokens as SecretString, the rest None) and calls `get_credentials(&settings, None)`, as `_sign_polly_request` calls get_credentials with those ten arguments (aws_polly/text_to_speech/transformation.py L253-L309); a failure is `SpeechError::Credentials` with the boxed source. B047 wires Polly to the speech dispatch with it.


  The server root. A new file crates/betterlite-server/src/server/shared_state.rs, declared with `mod shared_state;` in server.rs, holds `pub(crate) fn shared(bundled_catalog: Arc<ModelCatalog>, client: ProxiedClient, environment: BTreeMap<String, String>) -> Result<Shared, ChainError>`. It builds the chain over that map, the client and an environment-only SecretLookup (`manager: None` and `crate::jobs::ptu::attribution::NoOidc` for the three ports, as app/spend.rs L45-L51 does), and answers the Shared literal. `Shared` (state/shared.rs L6-L9) gains `pub aws_credentials: AwsCredentialChain`. `application()` (server.rs L179-L190) replaces its Shared literal with `shared(Arc::clone(&executor.bundled_catalog), executor.client.clone(), process_environment())` and maps a failure to a new `ServerError::AwsCredentials(#[source] ChainError)` (server.rs L55); server.rs has 295 of its 300 lines, so the net change there stays under five. `vertex_embedding_calls` (chat_setup/vertex_embedding.rs L44) takes `aws: &AwsCredentialChain` as a fourth argument, and application() passes `&shared.aws_credentials`. `VertexCredentialExecutor` gains `aws: Arc<dyn AwsCredentialsSource>`, set from `Arc::new(aws.clone())`, and `LoadDeps.aws` (executor.rs L89) clones it. `UnavailableAws` and its comment go. Every test that writes a `Shared` literal calls `shared(..., BTreeMap::new())` instead, so no test reads the process environment: auth/auth_model_lists/tests.rs, auth/current_spend/tests.rs, cost_service/tests.rs, routes/chat/streaming/recovery/tests.rs, routes/chat/streaming/tests.rs, routes/chat/tests/anthropic.rs, routes/chat/tests/stream/tests.rs, routes/chat/tests/unknown_model_cases.rs, routes/completions/tests/anthropic.rs, routes/completions/tests.rs, routes/tests.rs, savings/tests.rs, server/chat_setup/provider_call/tests.rs and spend/runtime/tests.rs.


  Tests. crates/betterlite-bedrock/src/credentials/chain/tests.rs (`credentials::chain::tests`) builds every chain from a hand-built map that always holds `AWS_EC2_METADATA_DISABLED=true` and never HOME, so nothing reaches instance metadata or the developer's ~/.aws, and uses a ProxiedClient with no proxy. It checks that from_environment reads BEDROCK_MAX_POLICY_SIZE (120 when set, 75 when absent) and refuses a non-number with the section error; that static keys in the settings come back as given, with the session token; that with no keys in the settings, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN in the map come back; that `aws_profile_name` reads that profile from a temporary credentials file named by AWS_SHARED_CREDENTIALS_FILE and AWS_CONFIG_FILE in the map, and the profile wins over keys in the map; that a clone and the original hold the same cache (`Arc::ptr_eq`); that an STS endpoint that is not a URL is `CredentialError::StsEndpoint`; and, through the CredentialSource and Polly impls, that each answers the static keys it was given. In betterlite-vertex, aws_federation's tests gain `chain_signs_the_caller_identity_request`: `credentials_from_explicit_aws` over a chain with static keys in the AWS params signs the GetCallerIdentity request with that access key id. In betterlite-server, vertex_embedding/tests.rs replaces `an_aws_federated_credential_has_no_provider` (L138-L145) with `an_aws_federated_credential_resolves_through_the_chain`: the executor built with a chain over static keys answers those keys through LoadDeps.aws.


  What users see. A proxy deployment of Vertex AI whose credential file is an AWS workload identity pool config (`environment_id` aws) now gets AWS credentials the way LiteLLM does: from the AWS params in the file, else the AWS SDK default chain (AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, AWS_PROFILE, IRSA web identity, container and instance metadata). Before, every such call failed with "AWS credential provider is unavailable".
