    why: the process-wide IAM credential cache with BEDROCK_IAM_CACHE_MAX_ENTRIES and its striped fetch locks, the one cache every chain clone shares.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L346-L526
    why: get_credentials and resolve_credentials, the two entry points the chain exposes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L818-L843
    why: _resolve_sts_region and _build_sts_client_kwargs, built again for every call.
