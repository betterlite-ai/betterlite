dod:
  - text: AwsCredentialChain::from_environment builds the cache with capacity 1000, the native sources over the given client and the policy size from BEDROCK_MAX_POLICY_SIZE, and a clone shares the cache.
    proof: [chain-tests]
  - text: The chain answers static keys, environment keys and a profile from the map, builds the STS settings per call, and implements CredentialSource, Polly's CredentialResolver and Vertex's AwsCredentialsResolver.
    proof: [chain-tests, vertex-tests]
  - text: The server builds the chain once into Shared.aws_credentials, Vertex embeddings resolve AWS workload identity through it, UnavailableAws is gone, and no server test reads the process environment for it.
    proof: [server-tests, no-stub]
checks:
  optional: [mutants]
  commands:
    - id: chain-tests
      why: the chain misses a source, builds a second cache, reads the policy size wrong or skips the per-call STS settings
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^credentials::/)'
    - id: vertex-tests
      why: the Vertex federation no longer signs with the chain's credentials
      run: grep -rq 'fn chain_signs_the_caller_identity_request' crates/betterlite-vertex/src/aws_federation && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^aws_federation::/)'
    - id: server-tests
      why: the server does not hand the chain to Vertex, or a Shared literal broke a route test
      run: grep -q 'fn an_aws_federated_credential_resolves_through_the_chain' crates/betterlite-server/src/server/chat_setup/vertex_embedding/tests.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::vertex_embedding::/) | test(/^state::/) | test(/^routes::/) | test(/^auth::(auth_model_lists|current_spend)::/) | test(/^(cost_service|savings|spend::runtime)::/) | test(/^server::chat_setup::provider_call::/)'
    - id: no-stub
      why: the server still answers AWS workload identity with a stub, or builds Shared without the chain
      run: test -z "$(grep -rn 'UnavailableAws' crates/betterlite-server/src)" && grep -q 'aws_credentials' crates/betterlite-server/src/state/shared.rs && test "$(grep -rn 'AwsCredentialChain::from_environment' crates/betterlite-server/src | grep -vc '/tests')" = 1
oracle_cases: []
deviations:
  - what: >-
      The chain reads LiteLLM's own AWS_* fallbacks (AWS_REGION_NAME, AWS_SESSION_NAME, AWS_PROFILE_NAME, AWS_ROLE_NAME, AWS_WEB_IDENTITY_TOKEN, AWS_STS_ENDPOINT, AWS_EXTERNAL_ID) only where the caller already put them into the settings, as the config's model_list snapshot does. For a Vertex AWS workload identity file without those params, only the AWS SDK's own names apply (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_PROFILE, AWS_ROLE_ARN with AWS_WEB_IDENTITY_TOKEN_FILE, container and instance metadata).
    why: >-
      get_credentials applies those fallbacks inside itself (base_aws_llm.py L364-L393), but betterlite applies them at two callers instead (crates/betterlite-config/src/sections/bedrock_settings.rs L142-L181 and crates/betterlite-bedrock/src/transcription/auth.rs L87-L111). Moving one copy into the resolver is a separate change; until then this row says what the chain does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L364-L393
out_of_scope:
  - "The Python sessions' chain (Vertex workload identity in genai, the Bedrock pass-through after B10166): B10176."
  - "The server's other AWS callers, which take Shared.aws_credentials when their tasks wire them: B8607 and B3621 (Bedrock and Comprehend pass-through), B3625 and B8931 (Transcribe), B092 (Textract OCR), B047 (Polly), B8631 and B8694 (the Bedrock pass-through port)."
  - "Realtime, transcription and RAG ingestion seams (RealtimeCredentials, ChainCredentials, RagCredentialResolver): no production caller builds those calls yet, so their impls come with the task that wires each call."
  - "A production OidcHttp: none exists (only stubs such as crates/betterlite-server/src/jobs/ptu/attribution.rs L44-L66), so an `oidc/` web identity token fails in the server's lookup, as it does for every other server secret today."
  - "Moving LiteLLM's AWS_* fallbacks into the resolver and dropping the two caller copies: see the deviation."
  - "The server's private NativeSources build for bucket config reads (crates/betterlite-server/src/bucket_config/s3_reader.rs L261-L276) and the Redis ElastiCache provider that reads the process environment through aws_config::defaults (crates/betterlite-server/src/redis_cloud_auth/aws.rs L21-L26)."
pitfalls:
  - "Never let a test reach the network: an empty map makes aws-config try container and instance metadata with the 60 second timeout. Every test map sets AWS_EC2_METADATA_DISABLED=true and leaves out AWS_CONTAINER_CREDENTIALS_FULL_URI and AWS_CONTAINER_CREDENTIALS_RELATIVE_URI, and every test that resolves gives keys or a profile."
  - "Tests build their maps by hand and never call process_environment(); only application() reads the process environment, through betterlite-config."
  - "StsClientKwargs.verify is read by nothing (grep the crate): the STS client goes through the chain's ProxiedClient and its TLS policy, so Verification::Enabled is the honest value, and ssl_verify keeps its role in the cache key."
  - "CredentialCache::new refuses any capacity but 1000; LocalTtlCache::with_clock takes the capacity as an i64."
  - "server.rs has 295 lines and a 300-line limit: the Shared literal leaves it for shared_state.rs, and the new error variant and mod line must fit in what that frees."
  - "Keep one chain per process in the server: Shared holds it, application() builds it, and vertex_embedding_calls borrows it; no second from_environment call anywhere in betterlite-server."
  - "B8610 rebuilds Shared later and keeps aws_credentials, built over its manager-backed SecretLookup."
review_level: security
budget:
  max_changed_lines: 1100
  max_new_expects: 0
