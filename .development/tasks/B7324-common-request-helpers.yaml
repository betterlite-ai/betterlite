dod:
- text: >-
    coerce_keepalive_interval returns None for None, a non-number text, a text like "inf", zero, a negative value and a value Duration cannot hold,
    and returns the seconds for 5, "5", " 2.5 " and "1e1".
  proof: [keepalive-tests, oracle, helper-python]
- text: >-
    agreed_keepalive_interval uses the one keepalive_seconds value all deployments share (5 and 5.0 are the same value, "5" is another),
    uses the global value when they differ, when one has no value, or when the list is empty, and returns None for a shared 0 even with a global value set.
  proof: [keepalive-tests, oracle, helper-python]
- text: ttft_keepalive_interval returns None unless stream is the JSON bool true, and looks up deployments only for a string model with a router.
  proof: [keepalive-tests]
- text: >-
    exception_detail_parts gives the four detail shapes (string, flat error string, nested error.message, top-level message) and the JSON text fallback,
    and sse_error_payload gives the status, type, param and code fallbacks, the default message, the key order and the merged provider_specific_fields.
  proof: [error-frame-tests, oracle, helper-python]
- text: sse_error_frames gives the error frame and then the DONE frame, in that order.
  proof: [error-frame-tests]
- text: >-
    open_sse_before_first_byte with no usable interval awaits the future and returns its result or its error unchanged,
    and with an interval returns the same result with nothing written early when the future finishes inside one interval.
  proof: [first-byte-tests]
- text: >-
    When the future is slower than one interval the 200 response opens with a ping, repeats the ping every interval, carries the content type with charset=utf-8
    and the Cache-Control and X-Accel-Buffering headers, and relays a streaming result unchanged.
  proof: [first-byte-tests]
- text: >-
    A late Plain result is written as one data frame followed by the DONE frame, with {} for an empty body.
    A late failure is written as the error frame and the DONE frame, using the hook's replacement when it gives one,
    the hook's raised replacement when it raises one, and the original when the hook is missing, gives none or breaks.
  proof: [first-byte-tests]
- text: Dropping the response body while the future is still pending drops the future.
  proof: [first-byte-tests]
- text: >-
    LlmPassthroughProcessor sends route type "allm_passthrough_route" and the call fields to the port, returns Streaming and Direct replies as they are,
    turns an Upstream reply into a response with the upstream status, body and filtered headers merged with the call's response headers,
    and returns a port failure through the exception mapper.
  proof: [passthrough-tests]
- text: SelectDataGenerator calls the port with the flag it was built with, true and false.
  proof: [select-tests]
