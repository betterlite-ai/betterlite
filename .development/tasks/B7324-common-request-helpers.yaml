    run: test -f tools/oracle/helpers/b7324.py && grep -qE '^[[:space:]]+b7324:' tools/oracle/fuzz/corpus/helper_case/b7324-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
