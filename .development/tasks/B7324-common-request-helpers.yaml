id: B7324
title: Common request processing helpers
description: >-
  Build the shared pieces of LiteLLM's litellm/proxy/common_request_processing.py that the pass-through, RAG and Responses routes call: the SSE keepalive wrapper that opens a response before the first upstream byte, the error frames it ends with, the keepalive interval lookup, the passthrough request processor, and the stream generator selector. Everything goes in crates/betterlite-server. Every name below is at most 30 characters.

  Module keepalive_interval. `PingSetting` is the closed set `Seconds(f64)` or `Text(String)` (LiteLLM's `float | str | None`; None is `Option::None`). `coerce_keepalive_interval(setting: Option<&PingSetting>) -> Option<Duration>` replaces coerce_keepalive_interval (sse_keepalive.py L22-L30). None gives None. A Text value is parsed like Python's float(): surrounding whitespace is ignored, a sign, a decimal point, an exponent and single underscores between digits are accepted, and anything else gives None. A value that is not finite or is zero or below gives None. A value that Duration cannot hold also gives None.
  `agreed_keepalive_interval(deployments, global_interval)` replaces resolve_ttft_keepalive_interval (sse_keepalive.py L180-L199) and `keepalive_seconds_of` replaces _keepalive_param. `deployments` is a slice of JSON objects. For each one read `litellm_params.keepalive_seconds`: a JSON number or string counts, anything else (a missing key, null, a bool, an array, an object, or a `litellm_params` that is not an object) counts as "no value". Collect the distinct values, where two numbers are equal when they are equal as f64 and a string never equals a number. When exactly one distinct value remains (a missing value is a value too), coerce that one. In every other case, an empty slice included, coerce `global_interval`. A deployment value of 0 therefore turns the interval off, since coercion rejects it, and does not fall back to the global value.
  `ttft_keepalive_interval(request_data, deployments, global_interval)` replaces ttft_keepalive_interval (common_request_processing.py L1129-L1144). `request_data` is the JSON object. It returns None unless `request_data["stream"]` is the JSON bool true. `deployments` is what the router lists for the requested model: the caller passes the list for `request_data["model"]` when that is a JSON string and a router exists, and an empty slice otherwise. The lookup itself is the trait `DeploymentLookup` declared here with one method `deployments_for(&self, model_name: &str) -> Vec<Value>`; the architect wires B844's router listing to it, and tests use a fake. A small `ttft_interval_for(lookup: Option<&dyn DeploymentLookup>, request_data, global_interval)` does the model check and the lookup, then calls the function above. The global value is the `litellm.sse_keepalive_ping_interval_seconds` setting (B002, default none).

  Module sse_error_frames. `SseFailure` is the typed input that stands for LiteLLM's exception: `status_code: Option<u16>`, `code: Option<String>` (ProxyException's stringified code), `error_type: Option<String>`, `param: Option<String>`, `detail: Option<Value>` (an HTTPException's detail), `provider_specific_fields: Option<Map<String, Value>>`.
  `exception_detail_parts(detail: &Value) -> (String, Option<Map>)` replaces serialize_http_exception_detail (L570-L598). A string gives (the string, None). An object: if `error` is a string, give (that string, the object); else if `error` is an object whose `message` is a string, give (that message, the object); else if the object's own `message` is a string, give (that message, the object); else give (the object as JSON text, the object). Any other JSON value gives (its text, None).
  `sse_error_payload(failure: &SseFailure) -> (u16, Map)` replaces sse_error_payload (L929-L951). The status is `status_code`; when missing, `code` if it is non-empty ASCII digits; else 500. The message comes from exception_detail_parts of `detail`, and a failure with no detail uses the text "Error processing stream start". `type` is `error_type` unless it is missing or the text "None"; then 401 gives authentication_error, 403 permission_error, 429 rate_limit_error, any other status below 500 invalid_request_error and the rest internal_server_error. `param` is `param` unless it is missing or the text "None"; then JSON null. `code` is the status as a string. The object has the keys message, type, param, code in that order. The merged fields are the failure's own provider_specific_fields with the structured fields from exception_detail_parts laid over them; they are added as a last key `provider_specific_fields` only when the merge is not empty.
  `sse_error_frames(error: &Map) -> [String; 2]` replaces _sse_error_frames (L954-L956): `data: {"error": <error>}\n\n` and then `data: [DONE]\n\n`. JSON text follows docs/compatibility.md.

  Module first_byte_sse. `open_sse_before_first_byte(produce_response, ping_interval_seconds, media_type, on_late_failure)` replaces open_sse_before_first_byte (L1213-L1288) with its helpers _relay_late_response (L1170-L1186) and _sanitized_late_failure (L1189-L1210). `produce_response` is a future of `Result<ProducedResponse, SseFailure>`. `ProducedResponse` is the closed set `Streaming(StreamedResponse)` (status, headers, a boxed byte stream) or `Plain(Response)` (a complete axum response). `ping_interval_seconds` is `Option<PingSetting>`, `media_type` is a `&str` that callers set to "text/event-stream" by default, and `on_late_failure` is `Option<&dyn LateFailureHook>`. The trait `LateFailureHook` has one async method `late_failure(&self, failure: &SseFailure) -> Result<Option<SseFailure>, HookRaised>`; `HookRaised` is `Replacement(SseFailure)` (the hook raised an HTTP error to put in the frame) or `Broken(String)` (any other failure of the hook). The function returns `Result<Response, SseFailure>`.
  Steps. Coerce the interval; with None just await the future and return its result converted to a response (an Err comes back unchanged). Otherwise wait for the future for one interval. If it finished, return it exactly as above and write nothing early. If not, log at info "no upstream response after %ss, opening the SSE response early and sending keepalives" and return a 200 response now, with content-type `media_type; charset=utf-8` and the headers `Cache-Control: no-cache` and `X-Accel-Buffering: no`. Its body is a stream that owns the future and polls it itself, so dropping the body drops the future (the client left, so the upstream call is cancelled); do not spawn a task. The body writes the bytes `: ping\n\n`, waits one interval, and repeats while the future is not finished. When the future finishes with Err, log at error "request failed after its SSE keepalive had opened the response: %s", ask the hook for the replacement (below), build sse_error_payload from the result, write the two sse_error_frames and end. When it finishes with Ok(Streaming), relay every chunk unchanged. When it finishes with Ok(Plain), write `data: ` + the body bytes (or `{}` when the body is empty) + `\n\n`, then `data: [DONE]\n\n`; the status and headers of that response are lost because the 200 line is already sent.
  Hook answer: with no hook the original failure is used. A hook that returns Some(replacement) gives the replacement, Ok(None) gives the original, `Replacement(f)` gives f, and `Broken` is logged at error "post_call_failure_hook raised while reporting a late failure: %s" and gives the original.

  Module passthrough_processor. `PassthroughCall<Key, Router>` is the record every passthrough route builds: `record: IndexMap<String, Value>` (the data map, key order kept), `request: axum::http::request::Parts`, `response_headers: HeaderMap` (the headers of the response object the route owns), `key: Key`, `router: Option<Router>`, `model: Option<String>`. `Key` and `Router` are the key and router handle types of the route, so this module names neither. The trait `PassthroughProcessor<Key, Router>` has one async method `process_passthrough(&self, call: PassthroughCall<Key, Router>) -> Result<Response, Self::Error>` and an associated `type Error`. B3620 and the other passthrough route tasks import both from here.
  `LlmPassthroughProcessor` implements it and replaces base_passthrough_process_llm_request (L3074-L3132) plus the exception mapping every caller wraps around it. It is built with two ports, both declared here, and nothing else. `LlmRequestProcessor` has one async method `base_process_llm_request(&self, call: BaseProcessCall<Key, Router>) -> Result<ProcessedReply, Self::Error>`. `BaseProcessCall` borrows the same fields as PassthroughCall plus `route_type`, which this task always sets to the text "allm_passthrough_route". `ProcessedReply` is the closed set `Streaming(Response)`, `Direct(Response)` and `Upstream(UpstreamReply)`, and `UpstreamReply` is `{ status: StatusCode, headers: HeaderMap, body: Bytes }` with the body already read. `ExceptionMapper` has one async method `handle_llm_api_exception(&self, error: E, key: &Key) -> Mapped`; its result is what the route returns as the error. The architect wires the real ports (the base_process_llm_request pipeline, _handle_llm_api_exception, proxy_logging_obj, general_settings, proxy_config and the user_* CLI values live behind them); tests use recording fakes.
  Steps. Call the port. Streaming and Direct replies are returned as they are. An Upstream reply becomes a response with the upstream status, the body, and the headers from betterlite-http's get_response_headers(upstream headers, no call id, custom headers = `response_headers` of the call). That function drops content-length, transfer-encoding, content-encoding, server, date, connection and keep-alive from both maps. An Err from the port goes through the mapper and is returned.

  Module data_generator_select. `AsyncDataGenerator` is the port for LiteLLM's async_data_generator (proxy_server.py L9830-L10079) with one method `generate(&self, input: GeneratorInput<Key>) -> Self::Stream`; `GeneratorInput` holds `response`, `key`, `request_data` (a JSON map) and `request: Option<Parts>`, plus `responses_stream_errors: bool`. `SelectDataGenerator<G>` is built with the port and the flag, and `select(response, key, request_data, request)` replaces select_data_generator (proxy_server.py L10082-L10096) by calling the port with the flag it was built with. The Python call sites that pass `responses_stream_errors=True` through functools.partial (Responses routes) build it with true; every other site builds it with false. async_data_generator itself and its helpers are not built here (see out_of_scope).

  Tests live in tests.rs files next to each module. The first-byte tests use tokio's paused clock (`tokio::time::pause`) so they do not sleep. Helper oracle cases cover the pure functions with the operation named b7324.
