deviations:
- what: The router listing, the generator, the request pipeline and the exception mapper are traits (DeploymentLookup, AsyncDataGenerator, LlmRequestProcessor, ExceptionMapper), and the passthrough route state (proxy_logging_obj, general_settings, proxy_config, the user_* values) sits behind them.
  why: LiteLLM reads these from proxy_server globals and imports them inside the functions; betterlite wires dependencies through constructors. What a client sees is the same.
- what: A late streaming response is relayed by dropping its stream, with no separate close call.
  why: Python must aclose the upstream generator by hand; in Rust dropping the stream closes the upstream connection.
- what: The keepalive wrapper polls the upstream future inside the response body instead of running it in a task, so a vanished client cancels it by dropping the body.
  why: rules.yaml async-hygiene forbids detached tasks; the visible behavior (ping, replay, cancel on disconnect) is the same.
- what: The passthrough processor returns the exception mapper's result for a port failure; LiteLLM's callers do that mapping in their own except clause.
  why: Every caller does the same mapping, so it lives in one place and the route tasks only forward the result.
- what: An interval that Duration cannot hold counts as no interval.
  why: Python would raise OverflowError inside asyncio; the response stays unwrapped instead.
out_of_scope:
- "async_data_generator (proxy_server.py L9830-L10079) and its helpers (L9280-L9830: _get_client_requested_model_for_streaming, the fallback metadata helpers, _restamp_streaming_chunk_model, _iter_with_keepalive, _keepalive_from_deployment_config, _resolve_keepalive_seconds, _make_keepalive_resolver and the SSE frame helpers) are owned by B7980 (Proxy streaming data generator). The merged chat streaming relay (stream_chat and relay_sse in crates/betterlite-server/src/routes/chat/streaming.rs) relays chat SSE only and does not do the restamp, fallback metadata or keepalive work. This task only builds the selector and the AsyncDataGenerator port in front of it. See notes."
- "ProxyBaseLLMRequestProcessing.base_process_llm_request, _process_llm_request, common_processing_pre_call_logic, get_custom_headers, create_response, _handle_llm_api_exception, async_streaming_data_generator and the rest of the class: no task builds the shared class. The LlmRequestProcessor and ExceptionMapper ports stand in for it. For the chat route the merged code is chat_completion and execute_chat (LlmRequestProcessor), failure (ExceptionMapper, ChatError to response) and success_headers, stream_headers and failure_headers in crates/betterlite-server/src/routes/chat/headers.rs (get_custom_headers), all under crates/betterlite-server/src/routes/chat.rs."
- "proxy_exception_from_http_exception (L601-L614) and the response-cost, guardrail and Azure model-router helpers (L1291-L1600): their callers are outside this task."
- "_UpstreamClosingStreamingResponse, _aclose_late_response, _buffer_first_chunk_honoring_disconnect and the client disconnect helpers (L286-L475, L809-L926): they exist for create_response and the Starlette close protocol, and no function built here calls them."
- "wrap_passthrough_sse_bytes_with_keepalive_pings, advance_sse_tail, seal_open_sse_frame and the rest of sse_keepalive.py: B005 covers the file and no function built here calls them."
- "get_response_headers (betterlite-http, B3600) and the HTTP body read: this task calls them."
- "The route handlers that call open_sse_before_first_byte and the processor: B3615, B3620, B3627, B3628, B3465 and the other passthrough and RAG tasks."
pitfalls:
- 'The late Plain replay writes `data: ` plus the body bytes, and `{}` when the body is empty, under the 200 line that is already sent, so an upstream error body reaches the client as a data frame and the real status is lost.'
- 'The early response content-type is `text/event-stream; charset=utf-8`, because Starlette adds the charset to every text media type; the caller''s media_type argument has no charset.'
- 'The first ping is written right after the first interval passes, not at time zero, so a future that finishes inside the interval writes no byte and the response is byte-identical to an unwrapped one.'
- 'A plain failure with no detail uses the message "Error processing stream start", not the failure''s own text; only HTTPException-style failures carry a detail.'
- 'The error type text "None" (the string) counts as missing for type and param, and param then becomes JSON null; code is always the status as a string.'
- 'The status of a failure is its status_code even when code also exists; code is used only when status_code is missing, and only when it is all ASCII digits.'
- 'agreed_keepalive_interval treats a deployment with no keepalive_seconds as its own value, so one deployment without the key makes the group disagree and the global value wins.'
- 'A shared keepalive_seconds of 0 disables the interval even when the global value is set, because coercion turns 0 into None before the global value is considered.'
- 'ttft_keepalive_interval answers None for stream values other than the JSON bool true, such as the string "true" or 1.'
- 'The passthrough processor''s route type is "allm_passthrough_route" and nothing else; the upstream reply headers keep the route''s own response headers on top, and content-length from either map is dropped.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
