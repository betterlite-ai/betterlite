    why: the interval coercion, the deployment agreement rule or the stream gate is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^keepalive_interval::/)'
  - id: error-frame-tests
    why: the detail shapes, the status and type fallbacks or the end frames are missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^sse_error_frames::/)'
  - id: first-byte-tests
    why: the fast path, the ping loop, the late frames, the hook rules or the drop behavior is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^first_byte_sse::/)'
  - id: passthrough-tests
    why: the passthrough processor sends the wrong route type, mishandles a reply branch or skips the exception mapper
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_processor::/)'
  - id: select-tests
    why: the generator selector drops or inverts the responses_stream_errors flag
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^data_generator_select::/)'
