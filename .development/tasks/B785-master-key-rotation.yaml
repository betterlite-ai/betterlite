id: B785
title: Master key and encrypted credential rotation routes
description: >-
  Implement POST /credentials/migrate-encryption and GET /credentials/migrate-encryption/check.
  Split the concrete master rotation service into B2331 and its MCP primitives into B2332 so the
  HTTP task does not create a reverse dependency on B139 or B061's same-key migration caller.
  B895 owns the actual /key/regenerate master-key branch; do not register it here or invent an
  old/new-key request body. _rotate_master_key's current_master_key argument is unused in source.

  Both routes first require user_role exactly proxy_admin; viewer, team/org admin and ordinary
  user receive HTTPException 403 with detail.error set to CommonProxyErrors.not_allowed_access.
  Only then check DB presence, raising HTTPException 500 detail.error for database-not-connected.
  There is no local except block or management decorator: HTTP errors retain detail envelopes
  with no type/param/code. Unexpected errors use B124's outer 500 error message/type envelope
  (no param/code), including RuntimeError from an unavailable migration algorithm or salt.
  Cases migration_admin_only, migration_denial_before_database, migration_no_database,
  migration_algorithm_gate_error and migration_missing_salt_error compare those distinctions;
  use README-permitted betterlite error wording without embedding credential values.

  POST dry_run is a query boolean default false, not a body field. Delegate prisma, caller and
  that flag to B061 migrate_encryption, then return status='success', dry_run and report.as_dict().
  The source service requires general_settings.encryption_algorithm case-insensitively equal
  to aes-256-gcm (no trim), even for dry_run. GET calls B061 check_encryption without a caller
  or dry_run argument and returns status='success',report only; it does not require the AES
  migration gate. Cases migration_dry_run_default_false, migration_query_bool_422,
  migration_body_flag_ignored, migration_dry_run_gate_required and check_legacy_algorithm_allowed
  prove these route contracts. Settings parsing, salt precedence and migration walkers remain B061/B2303.

  Reports contain residual_legacy,total_undecryptable and locations keyed by source location name;
  every location has scanned,migrated,already_v2,plaintext,undecryptable,legacy, including zeros.
  Preserve unchanged B061 report counters and do not claim success means every ciphertext migrated:
  unreadable values can remain with a successful report. Cases report_zero_fields,
  report_undecryptable_success, check_omits_dry_run and migration_repeat_residual_counts cover it.
  A POST dry-run and every GET perform no writes; a real POST can partially migrate stores and
  returns counts from the service's bracketing scans. Cases dry_run_rows_unchanged,
  check_rows_unchanged and migration_partial_effects inspect Postgres state. No route reads
  litellm-changed-by, writes audit rows or directly changes runtime master-key configuration.


  Build the production master_key_rotation module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _require_proxy_admin (L5368-L5375; 7 source lines),
  migrate_encryption_endpoint (L5383-L5415; 30 source lines), check_encryption_endpoint (L5423-L5445;
  21 source lines).


  Exercise both exact paths through B001 against booted proxies with separate encrypted fixtures.
  The migration and scanner services are dependencies, not reimplemented in route adapters.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 58 nonblank, noncomment pinned source lines including docstrings before translation; allow
  80 production, 250 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 395 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
