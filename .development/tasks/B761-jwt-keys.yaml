dod:
  - text: 'Additional named cases: discovery_substring_detection_and_exact_cache_keys,
      fresh_nonnull_and_lock_recheck, numeric_timestamp_not_string, stale_age_equal_negative_missing,
      live_ttl_reduction_applies_to_old_copy, cache_write_order_and_partial_failure,
      only_transport_outage_is_backed_off, stale_warning_does_not_extend_life,
      discovery_status_parse_missing_uri_errors, jwks_status_parse_log_and_keys_envelope,
      absent_empty_and_ordered_url_list, kid_miss_continues_without_refresh,
      first_outage_stops_url_iteration_with_503_fields, key_dict_cardinality_and_last_matching_kid,
      no_registered_agents_defaults, email_last_segment_case_sensitive.'
    proof:
      - behavior-tests
  - text: 'Implement the owned behavior and ordered failure effects; named tests: configured_jwks, oidc_discovery,
      fresh_cache, stale_on_transient_outage, stale_window_exhausted, kid_mismatch, malformed_jwks, negative_stale_ttl_validation,
      zero_stale_ttl_fail_closed, configured_stale_ttl, transport_three_attempts, http_error_no_transport_retry,
      outage_backoff_30_seconds, concurrent_refresh_single_flight.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The production decode_discovery_document decoder is used by the service and its fuzz target
      and rejects malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'Native discovery_and_jwks_byte_depth_limits_return_auth_error proves bounded JSON failure maps
      to 401 auth_error without retry or stale fallback.'
    proof:
      - behavior-tests
  - text: The real HTTP exception mapper preserves invalid-token and unavailable-key failures before identity
      lookup.
    proof:
      - oracle
      - stage-wiring-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_keys::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/jwt_keys.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/jwt-keys-*")"
        && grep -rlq "jwt_keys" tools/oracle/fuzz/corpus/helper_case/jwt-keys-* && cargo nextest run --locked
        -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^jwt_keys::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/jwt-keys-*")"
        && grep -rlq "JWT_PUBLIC_KEY_URL" crates/betterlite-config/fuzz/corpus/config_yaml/jwt-keys-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
