id: B761
title: JWKS and OIDC discovery caching
description: >-
  Implement JwksResolver with configured issuer/discovery/JWKS destinations, injected HTTP pool, clock
  and cache. Preserve fresh/stale cache windows, transient retry classes, single-flight refresh and typed
  503 on unavailable keys. The JWKS URI may come only from a configured trusted discovery document; token
  jku/x5u and arbitrary issuer URLs never become outbound destinations. public_key_ttl defaults 600 seconds
  and public_key_stale_ttl defaults 3600 seconds. Preserve the unconstrained public_key_ttl value at this
  boundary; public_key_stale_ttl is constrained to >=0, with zero disabling stale fallback and a negative
  value producing settings validation failure. Do not invent a warning-and-default path. Retain three
  transport-error fetch attempts with 0.25 and 0.5-second delays, 30-second unreachable-result backoff,
  and the distinct HTTP-status error path; these are injected-clock tests, not live sleeps.


  Discovery detection is substring .well-known/openid-configuration anywhere in the configured URL,
  not a suffix test. Cache discovery under litellm_oidc_discovery_<url> and keys under
  litellm_jwt_auth_keys_<resolved-url>. Nonnull fresh cache hits bypass refresh; acquire a per-key lock
  on misses and recheck. Cache timestamp accepts numeric int/float, including Python bool, not numeric
  strings. On a refresh, check the unreachable marker before fetching; only JWKSUnreachableError
  stores a 30-second marker. Success writes fresh value, then stale copy, then wall-clock write time,
  the latter two only for positive stale TTL and with ttl+stale_ttl. Writes are sequential, not atomic;
  cache errors propagate and prior writes remain. A stale copy needs both value and numeric timestamp,
  allows age exactly ttl+stale_ttl and negative age, and uses current settings so lowering stale TTL
  takes effect immediately. A served stale copy emits WARN with age/remaining lifetime; it does not
  renew those timestamps. Missing/expired/disabled stale data rethrows the outage.

  Own the cache/retry constants at handle_jwt.py L102-L107: stale value prefix litellm_stale_,
  write-time prefix litellm_stale_written_at_, outage prefix litellm_jwks_unreachable_, attempts=3,
  retry delay=0.25 and outage TTL=30.


  Each transport failure before the last attempt WARNs and waits 0.25 then 0.5 seconds. A third
  transport failure becomes JWKSUnreachableError; status errors, JSON errors and cache errors are
  never retried or stale-eligible. Discovery requires exactly status 200, valid JSON and a truthy
  jwks_uri; failures retain the distinct status/body, parse and missing-field messages. DEBUG logs
  bracket discovery fetching/resolution. JWKS likewise requires 200; JSON failure ERROR-logs response
  text then raises Error parsing response: <error>. Check server logs for original response. Use its
  keys member when present, otherwise the response itself; never strip key material to just kid.


  JWT_PUBLIC_KEY_URL absent raises Missing JWT Public Key URL from environment.; present empty or
  comma/whitespace-only gives an empty URL list and a no-matching-key error. Trim comma-separated URLs
  and try in order. Only NoMatchingJWTPublicKeyError DEBUG-logs and continues; an unreachable first
  endpoint ERROR-logs and immediately returns 503 auth_provider_unavailable, param string None, with
  the signature-could-not-be-verified/retry-shortly message. Other errors propagate through B757 as
  auth_error 401. A kid miss never forces refresh of an otherwise fresh cache. parse_keys preserves
  the peculiar cardinality rules: a length-one dict or list accepts matching kid or absent requested
  kid; longer lists require a nonnull matching kid and choose the last match; longer dicts iterate
  field names and yield no key. Empty values yield none. NoRegisteredAgents returns empty/None.
  Domain checks default unrestricted; otherwise compare the final @ segment exactly, case-sensitive,
  without validating email structure. There are no database writes and no caller-selected fetch URLs.


  Build the production jwt_keys module in betterlite-auth; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  _JWTAuthSettings.issuers (L116-L116; 1 source lines), _JWTAuthSettings.public_key_ttl (L119-L119; 1
  source lines), _JWTAuthSettings.public_key_stale_ttl (L122-L122; 1 source lines), _OIDCDiscoveryResponse.json
  (L134-L134; 1 source lines), _UserInfoResponse.json (L140-L140; 1 source lines), AgentLookup.get_agent_list
  (L165-L165; 1 source lines), AgentLookup.get_agent_by_id (L167-L168; 2 source lines), AgentLookup.get_agent_by_name
  (L170-L171; 2 source lines), _NoRegisteredAgents.get_agent_list (L177-L178; 2 source lines), _NoRegisteredAgents.get_agent_by_id
  (L180-L181; 2 source lines), _NoRegisteredAgents.get_agent_by_name (L183-L184; 2 source lines), _discovery_document
  (L187-L189; 3 source lines), _userinfo_document (L192-L194; 3 source lines), jwks_unavailable_exception
  (L197-L206; 10 source lines), JWTHandler._resolve_jwks_url (L748-L763; 15 source lines), JWTHandler._get_with_transient_retries
  (L765-L784; 19 source lines), JWTHandler._get_cached_value (L786-L788; 3 source lines), JWTHandler._get_cached_timestamp
  (L790-L793; 3 source lines), JWTHandler._put_cached_value (L795-L796; 2 source lines), JWTHandler._cached_with_stale_fallback
  (L798-L817; 19 source lines), JWTHandler._refresh_or_serve_stale (L819-L859; 39 source lines), JWTHandler._stale_copy_age
  (L861-L863; 3 source lines), JWTHandler._refresh_or_record_outage (L865-L898; 31 source lines), JWTHandler._fetch_jwks_uri_from_discovery
  (L900-L917; 16 source lines), JWTHandler._get_public_key_cache_ttl (L919-L923; 5 source lines), JWTHandler._get_public_key_stale_ttl
  (L925-L929; 5 source lines), JWTHandler._fetch_jwks_keys (L931-L945; 13 source lines), JWTHandler._get_public_key_from_jwks_url
  (L947-L960; 12 source lines), JWTHandler.get_public_key (L962-L979; 14 source lines), JWTHandler.parse_keys
  (L981-L997; 16 source lines), JWTHandler.is_allowed_domain (L999-L1007; 8 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): JWT_PUBLIC_KEY_URL=None;
  litellm_jwtauth.user_allowed_email_domain=None; litellm_jwtauth.public_key_ttl=600; litellm_jwtauth.public_key_stale_ttl=DEFAULT_JWKS_STALE_TTL.


  Add the jwt_keys operation under B856 Management::jwt. Python calls only the owned MIT helper with injected
  clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm. Rust
  invokes the production module. Compare typed values, exception status/type/param/code, ordered warnings
  and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-keys-* seed
  to B171 helper_case, which already owns this decoder.


  Write betterlite-config::jwt_keys::tests::ttl_defaults_600_and_3600, ttl_unconstrained_stale_nonnegative,
  stale_zero_disables_and_negative_rejects, jwt_public_url_absent_empty_and_comma_list,
  email_domain_default_none_and_exact_match. Invalid settings fail validation, not fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary jwt_keys::decode_discovery_document(&[u8]) -> Result<TypedValue,DecodeError>
  for OIDC discovery, JWKS and userinfo response JSON. Production calls this decoder before its typed
  policy functions; the cargo-fuzz target jwt_keys calls that same function. Seed valid, truncated, malformed,
  duplicate-field and limit-boundary inputs and add jwt_keys::tests::replays_the_jwt_keys_corpus. Reuse
  B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string decoder
  cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or fetching
  URLs. B733 owns crates/betterlite-auth/fuzz; depend on it and register this decoder target without recreating
  the workspace.


  JWKS helper comparisons inject an HTTP source and clocks, covering stale-cache behavior without
  contacting a live identity provider. Native decoder-bound cases remain separate from equal MIT inputs.


  Sizing: 255 production, 290 table-driven tests, 80 helper adapters, 50 wiring, 65 decoder/fuzz and
  60 config lines, 800 changed lines. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: discovery_and_jwks_byte_depth_limits_return_auth_error.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Pin externally visible verification/key-fetch failures through B001 HTTP cases against the real MIT
  proxy and betterlite, using B860 independent databases and a configured local JWKS mock. Register this
  production pre-identity stage through B732; a rejected signature or unavailable key must pass through
  the real HTTP auth exception mapper before any identity lookup or downstream handler. Compare status
  and error type/param/code, including unavailable-key 503 versus invalid-token 401. Successful claim
  projections remain helper cases until B053 installs the complete JWT identity backend; do not use a
  fabricated HTTP success. Server registration tests live at auth::jwt_keys::tests::stage_is_registered
  and failure_stops_downstream, within the existing behavior-test allowance.
