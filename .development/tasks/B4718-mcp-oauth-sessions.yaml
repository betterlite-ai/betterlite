id: B4718
title: MCP temporary OAuth sessions and shared draft lookup
description: >-
  Build the short-lived MCP server session that the admin "Authorize and fetch token" flow runs on, the lookup that finds it again, and the one route that creates it: POST /v1/mcp/server/oauth/session (add_session_mcp_server). A session is a server the admin has not saved yet. The browser then calls /register, /authorize and /token for it, and those calls can land on any worker or replica, so the session has to be findable from all of them. B4719 builds those three routes on top of the lookup from this task.


  Code goes in betterlite-server, module mcp::oauth_sessions: crates/betterlite-server/src/mcp/oauth_sessions.rs, oauth_sessions/store.rs, oauth_sessions/redis_copy.rs, oauth_sessions/record.rs, oauth_sessions/route.rs and a tests.rs beside each file. The skeleton adds the dependencies on betterlite-mcp and betterlite-cache to betterlite-server; this task does not edit Cargo.toml. Nothing here keeps global state: the process-local table, the clock, the cipher, the optional Redis backend and the database port are all fields of one struct, SessionStore, built by the composition root and shared behind the caller's own pointer. LiteLLM's module-level dict _temporary_mcp_servers becomes the private field `local: Mutex<HashMap<String, LocalEntry>>`, where LocalEntry { server: MCPServer, expires_at: DateTime<Utc> } is LiteLLM's _TemporaryMCPServerEntry.


  Constants, spelled as in LiteLLM: TEMPORARY_MCP_SERVER_TTL_SECONDS = 300 and TEMPORARY_MCP_SERVER_REDIS_KEY_PREFIX = "litellm:mcp:temporary_server". Neither is configurable.


  Functions to build (LiteLLM name in backticks). Types come from other tasks: MCPServer and OAuth2Flow from B6590, LiteLLM_MCPServerTable from B858, NewMCPServerRequest and its checks from B4716, redaction and credential inheritance from B4717, the draft rows from B4711 and B4712, the registry lookups from B4731, build_mcp_server_from_table from B6592, the response cache backend trait from B4290 (read its exact name and method signatures in crates/betterlite-cache/src/backend.rs once B4290 has merged) and the stored cipher from B1600.

  1. record.rs, `build_temporary_record` (`_build_temporary_mcp_server_record`), inputs: the request, created_by: Option<&str>, server_id and now. It returns a LiteLLM_MCPServerTable with created_at and updated_at both set to now, created_by and updated_by both set to created_by, teams set to the empty list, allowed_tools and extra_headers set to the request value or the empty list, and server_name set to the request's server_name, else its alias, else the server_id (the first non-empty one). These fields copy over from the request: alias, description, url, transport, auth_type, credentials, mcp_access_groups, mcp_info, static_headers, command, args, env, issuer, authorization_url, token_url, registration_url, allow_all_keys, available_on_public_internet, timeout, max_concurrent_requests. Every other row field keeps its default. In particular approval_status is not set, so the table value is not a draft; only the database row written in step 4 is a draft. Read the row type from B858 and match every field it has.

  2. store.rs, local table. `prune_expired` (`_prune_expired_temporary_mcp_servers`) removes every entry whose expires_at is at or before now, and does nothing on an empty table. `cache_local` (`_cache_temporary_mcp_server`) takes the server and ttl_seconds, raises ttl_seconds to at least 1, prunes, stores the entry under server.server_id with expires_at = now + ttl (replacing an earlier entry for that id, which refreshes the lifetime), and returns the server. The clock is a field, so tests move time without sleeping.

  3. store.rs, `get_cached_temporary_server` (`get_cached_temporary_mcp_server`), input: server_id. It prunes the local table first. Then three sources are tried in this order and the first hit wins: the local table; the shared draft row (step 5); the Redis copy (step 6). A hit in the draft row or in Redis is returned as is and is never written into the local table, so a Redis entry cannot live longer than its own TTL. A database error from the draft read is not caught and reaches the caller. SessionStore implements B4731's TempLookup port (temp_server(server_id) -> Result<Option<MCPServer>, ResolveError>) with this function, so resolve_server can call it.

  4. store.rs, draft row writes. `persist_draft` (`_persist_draft_mcp_server`), inputs: the request, server_id and created_by. When the database port reports no database (LiteLLM's _get_prisma_client_or_none is None; B4711 owns that accessor) it returns Ok and writes nothing. Otherwise it calls B4712's create_draft_mcp_server with ttl_seconds = 300 and the given server_id. A failure is returned, not swallowed, because a missing shared row is the very bug the draft row exists to fix. The request passed in still holds plain credentials; create_draft_mcp_server encrypts them.

  5. store.rs, `draft_as_server` (`_get_draft_mcp_server_as_mcp_server`), input: server_id. No database gives None. Otherwise B4712's get_draft_mcp_server(server_id, ttl_seconds = 300) decides; None gives None. A row is turned into a runtime MCPServer with B6592's build_mcp_server_from_table with its default credentials_are_encrypted (true), because get_draft_mcp_server decrypts only the global env var values and leaves the credentials blob encrypted. B4712's text names get_draft_mcp_server only in a pitfall, so check that it exists; if it does not, say so in the report instead of writing it here.

  6. redis_copy.rs, `write_redis_copy` (`_cache_temporary_mcp_server_in_redis`), inputs: server and ttl_seconds. It is best effort and returns nothing: every failure is a tracing::debug line and the function returns. No Redis backend (the field is None) returns at once. The value is the server serialized to JSON, encrypted with B1600's encrypt_value_helper, stored under "<prefix>:<server_id>" with ttl = max(1, ttl_seconds). An encryption error or a backend write error is logged at debug and ignored. `read_redis_copy` (`_get_temporary_mcp_server_from_redis`), input: server_id. No backend gives None. A backend read error gives None (debug log). A value that is not a string gives None, so an old plain dict payload is rejected. The string is decrypted with B1600's decrypt_value_helper using the field label "temporary_mcp_server" and the debug error mode, and a failed decrypt gives None. Then the JSON is parsed, a value that is not an object gives None, and MCPServer deserialization decides the rest; a failure at any step is a debug log and None. MCPServer needs Serialize for the write; B6590 derives only Deserialize, see the report notes.

  7. store.rs, `resolve_session_id` (`_resolve_session_server_id`), input: the request. No server_id on the request gives a fresh UUID v4 string (the random source is a field, so tests fix it). A supplied id is kept only when B4731's server_by_id(server_id, None) finds a server in the registry (the edit form re-authorizing a saved server). Else, with no database, the supplied id is kept. Else B4711's get_mcp_server reads the row for that id: no row, or a row whose approval_status is draft, gives a fresh UUID; any other row keeps the supplied id. This is what stops a second session from adopting the URL and client credentials of a first one. Database errors are returned.

  8. route.rs, `add_session_server` (`add_session_mcp_server`) for POST /v1/mcp/server/oauth/session, wrapped by B865's management_endpoint_wrapper like every management route, status 200, authenticated with the normal user_api_key_auth dependency (the cookie fallback of _mcp_oauth_user_api_key_auth belongs to B4719). The body is NewMCPServerRequest. The optional litellm-changed-by header is declared and never read. Steps in this exact order: (a) B4716's validate_and_normalize_mcp_server_payload (400 on a bad name); (b) B4716's stamp_omitted_oauth2_flow; (c) a caller whose user_role is not PROXY_ADMIN gets 403 with body {"detail": {"error": "User does not have permission to create temporary mcp servers. You can only create temporary mcp servers if you are a PROXY_ADMIN."}}, so PROXY_ADMIN_VIEW_ONLY is refused too; (d) created_by is the caller's user_id, else "default_user_id" (LITELLM_PROXY_ADMIN_NAME); (e) B4717's inherit_credentials_from_existing_server on the request; (f) resolve_session_id and build_temporary_record; (g) inside one error scope: build_mcp_server_from_table(record, credentials_are_encrypted = false), then cache_local, then persist_draft, then write_redis_copy, in that order; any error in this scope is logged and becomes 500 with detail {"error": "Error caching temporary mcp server: <error text>"}. The id lookup in (f) runs before that scope, so its errors are not wrapped in that message. The response body is B4717's redact_mcp_credentials applied to the record from (f), so scopes and admin config survive and every secret is dropped.

  9. store.rs, `cached_temporary_server_or_404` (`_get_cached_temporary_mcp_server_or_404`), inputs: server_id, the caller's auth, and the optional request. The client ip is B743's get_mcp_client_ip(request), None when there is no request. It calls B4731's resolve_server with this store as the temp lookup, no database lookup, id_client_ip None, name_client_ip the client ip and match_name true. Then authorize_server with is_admin_view from B2314's user_api_key_has_admin_view, not_found_detail {"error": "MCP server <id> not found"}, forbidden_detail {"error": "Access denied to MCP server <id>"} and non_admin_missing NotFound. It returns the runtime MCPServer. A resolution without a runtime cannot happen with these two sources; return a typed error variant for it instead of an assert, and the route layer maps it to 500.

  Errors: one SessionError enum (thiserror) in oauth_sessions.rs with a variant per failure above, wrapping the upstream error types with #[from] where they exist, and a status mapping used by the route.

  Tests use synthetic servers (ids like test-session-1, urls like https://mcp.example.test/sse), a fake clock, a fake Redis backend that can be set to fail each operation, a fake cipher that can fail, and an in-memory fake for the database port. The HTTP cases run the booted proxy with a master key and no database and no response cache, so they cover the in-memory path only.

