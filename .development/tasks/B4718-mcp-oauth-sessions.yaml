deviations:
  - what: The Redis copy is skipped when no backend is configured, like LiteLLM when litellm.cache is None; there is no check for a missing method on the backend.
    why: A backend is a typed value in betterlite, so a backend without async_set_cache or async_get_cache cannot exist.
  - what: Redis payloads written by betterlite are not guaranteed to be readable by a LiteLLM process, and the reverse is also not promised.
    why: The payload is MCPServer serialized with serde and then encrypted; LiteLLM's model_dump field set differs in detail. Both sides only ever read their own copy during the five-minute life of a session.
  - what: A resolution without a runtime server returns a typed error and the route answers 500, where LiteLLM's assert raises AssertionError.
    why: Production code carries no assert; the case cannot occur with a temp lookup and a registry as the only two sources.

out_of_scope:
  - "B4711 owns _get_prisma_client_or_none, get_prisma_client_or_throw and get_mcp_server; this task calls them."
  - "B4712 owns create_draft_mcp_server, _prune_expired_draft_mcp_servers and get_draft_mcp_server (db.py L1013-L1100); this task calls them."
  - "B4716 owns validate_and_normalize_mcp_server_payload, stamp_omitted_oauth2_flow and NewMCPServerRequest; B4717 owns _redact_mcp_credentials and _inherit_credentials_from_existing_server."
  - "B4731 owns resolve_mcp_server, authorize_mcp_server and get_mcp_server_by_id (server_resolution.py and the registry reads); B6592 owns build_mcp_server_from_table."
  - "B4719 owns _mcp_oauth_user_api_key_auth (cookie and delegate_auth_to_upstream fallbacks) and the three routes mcp_authorize, mcp_token and mcp_register that call cached_temporary_server_or_404."
  - "B4729 and B4730 own the connection preview and test routes; they use their own staging, not this store."
  - "B865 owns management_endpoint_wrapper, B743 owns IPAddressUtils.get_mcp_client_ip, B2314 owns UserAPIKeyAuth and user_api_key_has_admin_view, B1600 owns encrypt_value_helper and decrypt_value_helper."
  - "The response cache instance (litellm.cache) and its backends are owned by B4290 and B4299; the composition root hands this store the backend or None."

pitfalls:
  - The admin check comes after validate_and_normalize_mcp_server_payload and stamp_omitted_oauth2_flow, so a non-admin sending a bad server name gets 400 and only a valid payload reaches the 403.
  - Only PROXY_ADMIN may create a session; PROXY_ADMIN_VIEW_ONLY gets the same 403 text as an ordinary user.
  - The id lookup (resolve_session_id) runs before the error scope, so a database error there is not wrapped in "Error caching temporary mcp server:".
  - The local table is written before the draft row, so when the draft write fails the 500 is returned but the local entry stays for the rest of its 300 seconds.
  - The record is built with credentials_are_encrypted = false (plain credentials from the request), but a draft row read back later must use the default true, since its credentials blob is encrypted at rest.
  - get_draft_mcp_server decrypts only the global env var values; do not decrypt the credentials a second time.
  - A draft row or Redis hit must not be copied into the local table, or a session could outlive its Redis TTL.
  - Redis values are encrypted strings only; a plain dict payload from an older build is rejected, not parsed.
  - The decrypt call uses the label "temporary_mcp_server" and the debug error mode, so a bad value logs at debug and returns None instead of raising.
  - A supplied server_id that names a draft row is replaced by a fresh UUID, so two sessions can never share one id by accident.
  - With no database the supplied id is kept as is, so oracle cases that run without a database can assert the exact id.
  - id_client_ip is always None for the session lookup and name_client_ip is the request ip; the other order would hide a server from its own admin.
  - The response is the redacted table record, not the runtime MCPServer, so created_at and updated_at appear and authentication_token never does.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
