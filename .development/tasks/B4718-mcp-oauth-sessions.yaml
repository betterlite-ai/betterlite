dod:
  - text: >-
      The local table keeps a session for exactly 300 seconds, prunes expired entries on every write and every lookup,
      refreshes the lifetime when the same id is stored again, and raises a ttl below 1 to 1.
    proof: [session-tests]
  - text: >-
      get_cached_temporary_server tries the local table, then the draft row, then the Redis copy, returns the first hit,
      never writes a draft or Redis hit into the local table, and returns a draft-read database error to the caller.
    proof: [session-tests]
  - text: >-
      The Redis copy is stored encrypted under "litellm:mcp:temporary_server:<server_id>" with ttl max(1, ttl_seconds).
      A missing backend, a failed encryption or a failed write is ignored with a debug log.
    proof: [session-tests]
  - text: >-
      Reading the Redis copy gives None for a missing backend, a backend error, a non-string value, a failed decrypt,
      invalid JSON, a JSON value that is not an object and an object that is not a valid MCPServer, and gives the server otherwise.
    proof: [session-tests]
  - text: >-
      persist_draft writes nothing when there is no database, calls create_draft_mcp_server with ttl 300 and the given id
      otherwise, and returns its error. draft_as_server returns None with no database or no live draft and builds the
      runtime server with credentials_are_encrypted true.
    proof: [session-tests]
  - text: >-
      resolve_session_id returns a fresh UUID when no id is supplied, keeps an id that names a registry server, keeps the
      supplied id when there is no database, and returns a fresh UUID when the id has no row or names a draft row.
    proof: [session-tests]
  - text: >-
      build_temporary_record picks server_name from server_name, then alias, then server_id, stamps both timestamps and
      both audit fields, sets teams to the empty list and copies the listed request fields.
    proof: [session-tests]
  - text: >-
      cached_temporary_server_or_404 passes match_name true, no id ip and the client ip from the request, answers 404 for an
      unknown id, 403 for a non-admin caller on a temporary session, and returns the runtime server for an admin view.
    proof: [session-tests]
  - text: >-
      POST /v1/mcp/server/oauth/session answers 200 with the credential-redacted record for a master-key caller, keeps a
      supplied server_id when there is no database, mints a new id when none is supplied, and keeps scopes while dropping
      auth_value and client_secret from the response.
    proof: [oracle]
  - text: >-
      The route validates the payload before the role check (a bad name gives 400 even for a non-admin), answers 403 with the
      exact error text for any role except PROXY_ADMIN, answers 401 without credentials, and wraps an error from the caching
      step as 500 "Error caching temporary mcp server: <error>".
    proof: [oracle, session-tests]
  - text: >-
      Every default, error text and ignore-and-continue path a user can observe is in a named test or oracle case with a literal
      input and outcome.
    proof: [session-tests]

checks:
  optional:
    - mutants
  commands:
    - id: session-tests
      why: the session store, the three-source lookup, the Redis copy, the id rule and the route steps have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth_sessions::/)'

