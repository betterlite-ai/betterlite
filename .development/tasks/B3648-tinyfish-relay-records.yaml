deviations:
  - what: "Invalid TINYFISH_COST_PER_STEP values log a warning and use the default 0.016. LiteLLM preserves this behavior; betterlite records the case and continues."
    why: Logging continues with a safe default rather than failing the request. This preserves LiteLLM's warn-and-return pattern for configuration errors."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L92-L104
  - what: "Malformed UTF-8 in SSE frames is replaced with U+FFFD (replacement character) rather than rejected. This preserves stream processing even when frames are corrupted."
    why: SSE processing is best-effort; a corrupted frame should not drop the entire run's billing. The same behavior appears in other stream parsers."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L82-L83
  - what: "The first SSE frame carrying a run_id is used; if multiple frames carry different run_id values, the first is retained and later ones ignored."
    why: Run IDs should be consistent across frames. The first one is treated as authoritative; later changes likely indicate corrupted data or a server bug."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L411-L425

out_of_scope:
  - B002 owns configuration/environment variable resolution. This task calls get_secret_str for api_base and parses TINYFISH_COST_PER_STEP; the env value and defaults are resolved here.
  - B190 owns the standard logging payload builder; this task calls it to build the logged response.
  - The authenticated-run field gates and envelope-field rejection logic belong to B3626; this task defines the field sets and validation rules, and B3626 enforces them in the route handler.
  - Async run polling, terminal-status detection, and SSE chunk collection belong to B3649; this task defines policy for billing and records run data, while B3649 owns the poller lifetime and dispatch to the logging sink.
  - The request/response body and request headers are available to the handler; this task does not parse or modify them.

pitfalls:
  - "Endpoint validation checks path segments split on '/' after stripping leading slash; empty segments before the colon-check are caught first (path starts with '/' and no double slashes)."
  - "The allowed POST run paths are /v1/automation/run, /v1/automation/run-async, and /v1/automation/run-sse. GET /v1/runs/{id} and POST /v1/runs/{id}/cancel are distinct operations; do not group them with the run-submit paths."
  - "API base hostname comparison uses urlparse().hostname on both the env/default API base and the request URL; a schemeless API base resolves to None and always differs."
  - "TinyfishRun is a TypedDict with all fields using ReadOnly; a mutable record is not the same type. The JSON adapter validates the shape; parse failures log a warning and return None."
  - "Cost per step is a float; invalid env values must be caught before use. Parsing via float() with a ValueError fallback matches LiteLLM's pattern."
  - "Billing task cleanup uses add_done_callback for both removal and cancellation logging; both callbacks fire, so don't duplicate the logic."
  - "SSE chunk iteration skips non-'data:' lines; a line starting 'data:' is followed by content that must be JSON-decoded. Invalid JSON is caught and skipped, not logged with every chunk."
  - "The model name 'tinyfish/automation-run' is stamped into every payload; requests do not supply it and it is not negotiable."
  - "Run ID extraction from SSE is ordered; the first frame carrying a run_id wins. Subsequent frames are parsed but their run_id (if different) is ignored."
  - "Completed runs invoice completed status exactly: COMPLETED runs charge, FAILED/CANCELLED/pending runs charge zero. The status field must be read from the run object after polling."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
