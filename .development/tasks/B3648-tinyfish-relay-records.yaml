id: B3648
title: TinyFish run policy and billing records
description: >-
  Build TinyFish URL/rate settings, permitted endpoint checks, run/SSE parsing
  and logged billing payloads. Keep these below both the forwarding routes and
  asynchronous pollers, with completed-only step pricing and saved request
  attribution.

  The task implements policy and record types for TinyFish automation runs in
  the pass-through logging layer. Resolve the TinyFish agent API base (HTTPS
  promotion from env variable or default) and cost per step (float from env or
  0.016 default). Validate endpoint paths: reject empty segments, dot segments,
  and paths outside the permitted POST /v1/automation/* submission routes and
  GET /v1/runs/{run_id} and POST /v1/runs/{run_id}/cancel operations. Policy
  checks separate billing operations from GET list/account operations without
  implementing route enforcement.

  TinyfishRun records are null-heavy until terminal; every field tolerates None
  to handle polling responses that evolve to completion. Parse run objects from
  JSON with validation-on-error logging; unpriced non-COMPLETED runs (FAILED,
  CANCELLED, in-progress) charge zero. Completed runs invoice num_of_steps times
  the cost per step.

  Build helper functions for TinyFish URL hostname matching, API base resolution
  with HTTPS promotion, cost-per-step parsing with warning/default fallback,
  async run billing with SSE-poller spawn tracking, and SSE frame run-ID
  extraction. Preserve the first SSE run ID found, nullable run fields, UTF-8
  replacement decoding on malformed data, and the model name tinyfish/automation-run
  stamped in all logging payloads.

  Build in crates/betterlite-server as the pass_through_logging::tinyfish module.

