    why: TinyfishRun TypedDict, constants, endpoint validation, authenticated-run and envelope field gates.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L1-L140
    why: Logging payload class, billing task registry, SSE poller tracking, API base/cost resolution, URL checking, run parsing, cost calculation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L366-L425
    why: Payload building, SSE chunk parsing for run ID extraction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/tinyfish_passthrough_logging_handler.py#L86-L110
    why: API base resolution (HTTPS promotion), cost-per-step parsing, and hostname matching implementations.

dod:
  - text: >-
      TinyfishRun records parse from JSON with all fields nullable, preserving
      status, num_of_steps and run_id for cost calculation.
    proof: [tinyfish-run-parsing-tests, oracle]
  - text: >-
      Endpoint paths reject empty/dot segments, only allow POST /v1/automation/{run,run-async,run-sse}
      and POST /v1/runs/{id}/cancel and GET /v1/runs/{id} operations.
    proof: [endpoint-validation-tests]
  - text: >-
      API base resolves from TINYFISH_AGENT_API_BASE env variable or default,
      with host-only values promoted to HTTPS.
    proof: [api-base-resolution-tests]
  - text: >-
      Cost per step resolves from TINYFISH_COST_PER_STEP env variable with
      warning/default fallback on parse failure, using 0.016 default.
    proof: [cost-per-step-resolution-tests]
  - text: >-
      Run cost returns None for non-COMPLETED runs or missing num_of_steps,
      and num_of_steps * cost_per_step for COMPLETED runs.
    proof: [run-cost-calculation-tests]
  - text: >-
      Hostname matching compares the parsed URL against the resolved API base hostname.
    proof: [hostname-matching-tests]
  - text: >-
      SSE run ID extraction finds the first "data:" line, parses it as JSON,
      and extracts run_id from the parsed TinyfishRun; returns None if not found.
    proof: [sse-run-extraction-tests]
  - text: >-
      Billing task tracking registers asyncio tasks with weak reference cleanup
      and exception logging on cancellation.
    proof: [billing-task-registration-tests]
  - text: >-
      Requests are logged for billing only if they are POST with /v1/automation/
      in the path; GET /v1/runs/* and POST /v1/runs/{id}/cancel are not logged.
    proof: [request-logging-filter-tests]
  - text: >-
      The async route detector identifies POST /v1/automation/run-async requests
      by checking if the URL path ends with that suffix.
    proof: [async-route-detection-tests]

checks:
  optional: []
  commands:
    - id: tinyfish-run-parsing-tests
      why: TinyfishRun parsing does not handle nullable fields or validation errors correctly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(run_parsing|parse_run)/)'
    - id: endpoint-validation-tests
      why: Endpoint validation does not reject empty/dot segments or accept only allowed operations.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(endpoint_validation|allowed_endpoint)/)'
    - id: api-base-resolution-tests
      why: API base resolution does not promote host-only values or uses default incorrectly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(api_base_resolution|resolve.*api_base)/)'
    - id: cost-per-step-resolution-tests
      why: Cost per step resolution does not handle invalid input or uses incorrect default.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(cost_resolution|resolve.*cost)/)'
    - id: run-cost-calculation-tests
      why: Run cost calculation does not price completed runs or returns wrong costs.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(run_cost|cost_for_run)/)'
    - id: hostname-matching-tests
      why: Hostname matching does not correctly compare against the resolved API base.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(hostname|url_matching)/)'
    - id: sse-run-extraction-tests
      why: SSE run ID extraction does not find the first run_id or fails on malformed data.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(sse_extraction|run_id_from)/)'
    - id: billing-task-registration-tests
      why: Billing task registration does not hold tasks or log cancellation.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(task_registration|billing_task)/)'
    - id: request-logging-filter-tests
      why: Request logging filter does not correctly identify POST /v1/automation/* requests or rejects GET/cancel operations.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(request_logging|should_log)/)'
    - id: async-route-detection-tests
      why: Async route detection does not correctly identify /v1/automation/run-async or identifies wrong paths.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::tinyfish::(async_route|is_run_async)/)'

