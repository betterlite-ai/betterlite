    - tools/oracle/cases/server/pass-through-logging/tinyfish/**
    - tools/oracle/helpers/b3648.py
    - tools/oracle/helpers/b3648/**
    - tools/oracle/src/helpers/server/b3648.rs
    - tools/oracle/src/helpers/server/b3648/**
    - crates/betterlite-models/src/tinyfish/**
  lint_tables: false

