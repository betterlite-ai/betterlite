id: B3907
title: Langfuse logger lifecycle and credential selection
description: >-
  Build the LangFuseLogger class and LangFuseHandler selection logic in crates/betterlite-logging,
  composing the lower-level services (B3900 settings, B3903 tracing, B3904 REST client, B3905 projections, B3906 logging)
  into logger initialization, event dispatch, and per-request logger selection.
  Preserve the MAX_LANGFUSE_INITIALIZED_CLIENTS budget, project-link lookup failure tolerance,
  release-on-REST-construction-failure behavior, and meaningful-environment cache identity.
  For global loggers, resolve credentials from environment and config (B3900, B188 validation).
  For dynamic loggers, extract credentials from standard_callback_dynamic_params and cache by credential signature.
  Omit environment overrides that match the deployment default or are empty/whitespace, so credential-only differences
  do not mint duplicate SDK clients. Warn if Langfuse is configured both at proxy startup and in a dynamic request (B3900).
  Return trace/generation IDs from events; log failures and return (None, None) without raising.

scope:
  paths:
    - Cargo.toml
    - crates/betterlite-logging/src/langfuse_logger.rs
    - crates/betterlite-logging/src/langfuse_logger/**
    - crates/betterlite-logging/src/langfuse_handler.rs
    - crates/betterlite-logging/src/langfuse_handler/**
  lint_tables: false

