id: B958
title: Messages errors
description: >-
  Define native Anthropic request/response/error records and error conversion over B184/B011. Preserve Anthropic
  error.type/status, nested error extraction and single-frame SSE formatting; reuse existing betterlite-anthropic
  content blocks instead of creating incompatible copies.


  Put Anthropic wire records in betterlite-anthropic (the existing provider wire crate), retaining open-string passthrough
  error.type and extra keys. nested-provider-message and anthropic-passthrough compare /error/message because extraction
  itself is under test; do not ignore it.


  Provider behavior comes through B010 prepared operation/capability values; no provider umbrella is a scheduling
  dependency.


  AnthropicExceptionMapping.extract_error_message (litellm/anthropic_interface/exceptions/exception_mapping_utils.py:L72-L89)
  has no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and
  no behavior case exercises that unused entry point.


  nested-provider-message and anthropic-passthrough call transform_to_anthropic_error, whose live _extract_message_from_dict
  branch supplies message extraction; the unused extract_error_message wrapper is excluded.


  Implement crates/betterlite-anthropic/src/api/messages_errors.rs. Use MessagesErrorsInput and MessagesErrorsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions authentication_error_envelope, rate_limit_error_envelope, nested_provider_message,
  sse_error_single_frame, response_stop_details, anthropic_passthrough under api::messages_errors::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-anthropic::api::messages_errors::decode_messages_errors(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-anthropic/src/api/messages_errors.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-anthropic/fuzz/fuzz_targets/messages_errors.rs passes arbitrary bounded bytes to that
  exact decoder; api::messages_errors::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  Register HelperCall::MessagesErrors in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_errors: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicExceptionMapping.get_error_type
  (L36-L38); litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicExceptionMapping.create_error_response
  (L41-L69); litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicExceptionMapping._is_anthropic_error_dict
  (L92-L107); litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicExceptionMapping._extract_message_from_dict
  (L110-L123); litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicExceptionMapping.transform_to_anthropic_error
  (L126-L169); litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicErrorSseFrame.__new__
  (L184-L188); litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicErrorSseFrame.json_body
  (L190-L195); litellm/anthropic_interface/exceptions/exception_mapping_utils.py: anthropic_error_sse_frame (L198-L202).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 200 owned nonblank/non-comment/non-docstring Python lines (285 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 220 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 548 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B011 (Exception types and provider error mapping), B171 (Direct helper oracle and URL
  path encoding), B184 (Shared provider error taxonomy), B1087 (Api boundaries). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
