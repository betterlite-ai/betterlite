out_of_scope:
- 'litellm/anthropic_interface/exceptions/exception_mapping_utils.py: AnthropicExceptionMapping.extract_error_message
  L72-L89 are out of scope: no MIT runtime caller at the pin; unused entry point is not rebuilt.'
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- An Anthropic-shaped error object passes through unchanged, including an unknown error.type and extra fields.
- AnthropicExceptionMapping._is_anthropic_error_dict uses parsed.get('type'); retain its missing-value behavior
  and field spelling in the typed projection.
