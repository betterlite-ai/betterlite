id: B958
title: Messages error envelopes and wire records
description: >-
  Implement AnthropicExceptionMapping and AnthropicErrorSseFrame in betterlite-anthropic::api::messages_errors.
  Own the complete live functions in exception_mapping_utils.py, the exported exception records, AnthropicMetadata
  and anthropic_response.py records. Reuse B184's shared provider taxonomy without depending on core. The wire
  representation must retain unknown provider fields and distinguish omitted fields from null; TypedDict annotations
  do not validate incoming Anthropic-shaped dictionaries at runtime.

  decode_messages_errors(bytes, WireDecodeLimits) parses bounded JSON error/response records at the wire boundary;
  WireDecodeLimits contains max_json_bytes, max_event_bytes and max_items. The transform operation also accepts raw
  provider message text and uses the same bounded JSON machinery, falling back to the original text on malformed
  JSON or a non-object. Its fuzz target and replays_corpus test cover both inputs with a leading selector byte.
  No HTTP response is manufactured by these helpers: callers choose the status, and the error body has no added
  param or code fields. B081 owns HTTP headers and status integration.

  Register HelperCall::MessagesErrors with actions transform, frame and wire_roundtrip, in both helper dispatchers.
  Python calls the pinned live methods, including frame.json_body; the native adapter calls the production wire
  module. Compare extracted messages exactly because extraction is this task's behavior. The status and request-id
  tables below use rstest names for each input. There are no environment variables or config defaults here.

  The linked owned ranges contain 276 nonblank/non-comment physical lines including type annotations and docstrings.
  Allow 220 implementation, 150 tests, 110 fixtures, 95 adapters, 65 fuzz/replay and 30 wiring lines, 670 total.
scope:
  paths:
  - crates/betterlite-anthropic/Cargo.toml
  - crates/betterlite-anthropic/src/lib.rs
  - crates/betterlite-anthropic/src/api.rs
  - crates/betterlite-anthropic/src/api/messages_errors.rs
  - crates/betterlite-anthropic/src/api/messages_errors/**
  - crates/betterlite-anthropic/fuzz/Cargo.toml
  - crates/betterlite-anthropic/fuzz/fuzz_targets/messages_errors.rs
  - crates/betterlite-anthropic/fuzz/corpus/messages_errors/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/messages_errors.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/messages_errors.py
  - tools/oracle/fuzz/corpus/helper_case/messages_errors-*
  - tools/oracle/cases/helpers/messages-errors/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_interface/exceptions/exception_mapping_utils.py#L14-L69
  why: Own the eight status mappings, api_error fallback and truthy request_id insertion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_interface/exceptions/exception_mapping_utils.py#L91-L202
  why: Own provider-message extraction, Anthropic passthrough and a status-bearing single SSE frame.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_interface/exceptions/exceptions.py#L1-L45
  why: Error detail includes optional provider_specific_fields and litellm_call_id, without param or code defaults.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/anthropic_interface/exceptions/__init__.py#L1-L23
  why: These public exports refer to the same error records and frame implementation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/anthropic_messages/anthropic_request.py#L1-L11
  why: AnthropicMetadata has one optional user_id field whose default is null.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/anthropic_messages/anthropic_response.py#L1-L107
  why: Own response content variants, optional usage counters, refusal details, compaction and safeguard fields.
dod:
- text: >-
    status_error_types transforms raw_message=broken with statuses 400,401,403,404,413,429,500,529,418 into
    type=error and error.type respectively invalid_request_error,authentication_error,permission_error,not_found_error,
    request_too_large,rate_limit_error,api_error,overloaded_error,api_error; error.message=broken and no param/code.
    request_id=null or empty omits request_id; req_a includes request_id=req_a.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    provider_message_precedence sends detail.message=inner with Message=aws/message=generic and gets inner;
    detail={} preserves the entire raw JSON string even if Message exists. Without a dict detail, Message=aws wins
    over message=generic; empty Message falls through to generic; both empty retain the raw string. detail.message=null
    stays null. Inputs [1], null, "quoted", and malformed { all become their literal raw strings.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    anthropic_error_passthrough sends type=error,error={type:vendor_error,message:bad,code:provider},extra=7 at status=401.
    The returned dict is unchanged except an absent request_id receives req_new. Existing request_id=null or req_old
    is never overwritten. Missing inner type, missing message, error=[] and top-level type=other fail passthrough
    and become authentication_error with the complete raw JSON message; an inner type=null still passes the key test.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    status_bearing_error_frame constructs status=429/raw_message=slow and emits exactly one event named error,
    data={type:error,error:{type:rate_limit_error,message:slow}} and a blank terminator. The frame retains status=429.
    json_body(null) preserves it; json_body(call_a) adds error.litellm_call_id=call_a without modifying the original
    frame or body. An empty string call id is inserted too, because only null disables this operation.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    response_optional_fields roundtrips an assistant message with text/citations, tool_use id/input/name, thinking
    signature, redacted_thinking data and compaction blocks; stop_reason covers end_turn,max_tokens,stop_sequence,
    tool_use,refusal,compaction,null. Preserve stop_details, context_management, safeguard_results, usage.iterations,
    server_tool_use and both cache counters without inventing absent fields. Metadata {} defaults user_id to null;
    metadata {user_id:alice,extra:7} retains only user_id=alice through the pinned Pydantic model.
  proof: [behavior-tests, oracle, helper-python]
- text: Raw-message and wire JSON limits reject oversized input before allocation, and the production decoder replays new malformed UTF-8/JSON seeds.
  proof: [parser-corpus, behavior-tests]
- text: Both helper implementations execute the newly registered messages_errors tag and compare real transformation results.
  proof: [helper-corpus, new-oracle-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: error mapping, passthrough or wire optionality has no production regression coverage
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::/) - test(/::replays_corpus$/)'
  - id: parser-corpus
    why: raw provider JSON can bypass the fuzzed decoder
    run: test -f crates/betterlite-anthropic/fuzz/fuzz_targets/messages_errors.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-anthropic/fuzz/corpus/messages_errors)" && cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::tests::replays_corpus$/)'
  - id: helper-python
    why: the pinned exception mapper is not independently executable
    run: test -f tools/oracle/helpers/messages_errors.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the messages_errors enum tag is absent from parser replay
    run: grep -qE '^[[:space:]]+messages_errors:' tools/oracle/fuzz/corpus/helper_case/messages_errors-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new error-envelope parity inputs were committed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-errors)"
oracle_cases:
- tools/oracle/cases/helpers/messages-errors/status-error-types.yaml
- tools/oracle/cases/helpers/messages-errors/provider-message-precedence.yaml
- tools/oracle/cases/helpers/messages-errors/anthropic-error-passthrough.yaml
- tools/oracle/cases/helpers/messages-errors/status-bearing-error-frame.yaml
- tools/oracle/cases/helpers/messages-errors/response-optional-fields.yaml
deviations: []
out_of_scope:
- AnthropicExceptionMapping.extract_error_message L72-L89 has no caller at the pin; the live transform uses _extract_message_from_dict instead.
- B081 owns HTTP error status and headers; B978 owns non-error SSE decoding and response-to-event conversion.
- B184 owns shared provider exception types; this leaf module does not perform provider exception dispatch.
pitfalls:
- An existing request_id key with null blocks insertion just as a nonempty id does.
- Presence of inner type/message keys, not their value types, determines whether an Anthropic error passes through.
- A dict detail without message suppresses the otherwise usable top-level Message field.
review_level: standard
budget:
  max_changed_lines: 680
  max_new_expects: 0
