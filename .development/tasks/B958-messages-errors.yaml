checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::/)
      - test(/::replays_corpus$/)'
  - id: case-authentication-error-envelope
    why: the authentication-error-envelope behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::tests::authentication_error_envelope($|::)/)'
  - id: case-rate-limit-error-envelope
    why: the rate-limit-error-envelope behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::tests::rate_limit_error_envelope($|::)/)'
  - id: case-nested-provider-message
    why: the nested-provider-message behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::tests::nested_provider_message($|::)/)'
  - id: case-sse-error-single-frame
    why: the sse-error-single-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::tests::sse_error_single_frame($|::)/)'
  - id: case-response-stop-details
    why: the response-stop-details behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::tests::response_stop_details($|::)/)'
  - id: case-anthropic-passthrough
    why: the anthropic-passthrough behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^api::messages_errors::tests::anthropic_passthrough($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-anthropic/fuzz/corpus/messages_errors)"
      && test -f crates/betterlite-anthropic/fuzz/fuzz_targets/messages_errors.rs && grep -qF "decode_messages_errors"
      crates/betterlite-anthropic/fuzz/fuzz_targets/messages_errors.rs && cargo nextest run --locked -p betterlite-anthropic
      --no-tests=fail -E 'test(/^api::messages_errors::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_errors.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_errors-*)"
      && grep -qE "^[[:space:]]+messages_errors:" tools/oracle/fuzz/corpus/helper_case/messages_errors-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-errors)"
