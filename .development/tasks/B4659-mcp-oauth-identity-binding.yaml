dod:
  - text: "binding_proof gives the lowercase SHA-256 hex of Python's json.dumps text with sorted keys, comma-space and colon-space separators and ensure_ascii escapes, byte for byte, for ASCII, non-ASCII and astral characters in the ids and the issuer."
    proof: [proof-tests, helper-oracle, helper-tests, helper-python]
  - text: "credential_binding_matches is false for a missing or empty stored proof, a proof for another user, server, principal or binding, and a caller with no principal, and true only for the current proof."
    proof: [proof-tests, helper-oracle, helper-tests, helper-python]
  - text: "principals_match trims and case-folds for an email claim or a user_email caller and compares exactly otherwise, and caller_principal gives the user id itself for caller_field user_id without a lookup."
    proof: [principal-tests, helper-oracle, helper-tests, helper-python]
  - text: "upstream_principal needs a non-empty string claim and, for email with require_email_verified, an email_verified that is JSON true."
    proof: [principal-tests, helper-oracle, helper-tests, helper-python]
  - text: "verify_id_token accepts RS, PS and ES256/384 tokens and rejects none, HS256, EdDSA, ES512, a bad signature and a key that does not match the algorithm."
    proof: [id-token-tests, helper-oracle, helper-tests, helper-python]
  - text: "Key selection takes the first key when the token has no kid, the first key with the same kid otherwise, and gives the not found rejection when none matches."
    proof: [id-token-tests, helper-oracle, helper-tests, helper-python]
  - text: "The claim checks require iss, exp, aud, sub and iat, reject exp equal to now, a future iat or nbf, a wrong issuer, an audience outside the binding list, a non-string sub or jti, and accept aud as a string or a list."
    proof: [id-token-tests, helper-oracle, helper-tests, helper-python]
  - text: "verify_id_token and keys_from_document never panic on arbitrary bytes and the added corpus replays through them."
    proof: [token-corpus]
  - text: "IssuerJwks uses jwks_url when set, otherwise discovers it from the trimmed issuer, fetches discovery every time, caches only the JWKS document for 3600 seconds and not on error, and reports the discovery and no keys array errors."
    proof: [jwks-tests]
  - text: "A refresh_token grant with no id_token passes only when the presented refresh token equals the caller's stored one and the stored proof still matches, fails for None and for a Proven envelope, and fails closed on a store error."
    proof: [refresh-tests, helper-oracle, helper-tests, helper-python]
  - text: "enforce_oauth_identity_binding does nothing for no binding or a disabled one, follows the nine steps in order, checks the nonce only for authorization_code when enforce or a nonce is given, and fails with the exact descriptions the task spells out."
    proof: [enforce-tests, helper-oracle, helper-tests, helper-python]
  - text: "Enforce returns the proof on success and BindingDenied with status 403 and the five-key detail on a rejection, and audit returns no proof, logs the warning on a rejection and never errors."
    proof: [enforce-tests, helper-oracle, helper-tests, helper-python]
  - text: "IdentityBinder implements B4715's OauthBindingPort, enforce calls enforce_oauth_identity_binding with no nonce and proof_matches is false for a server with no binding."
    proof: [enforce-tests]
  - text: "The oracle cases and the corpus seeds agree with LiteLLM on binding_proof, principals_match, credential_binding_matches and enforce."
    proof: [helper-oracle, helper-tests, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: proof-tests
      why: the proof text differs from Python's json.dumps or the match check accepts a stale proof
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_identity_binding::proof::tests::/)'
    - id: principal-tests
      why: the principal comparison or the claim rules differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_identity_binding::principal::tests::/)'
    - id: id-token-tests
      why: the id_token verification accepts a forbidden algorithm, picks the wrong key or skips a claim rule
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_identity_binding::id_token::tests::/) - test(replays_the_id_token_corpus)'
    - id: token-corpus
      why: the oauth_id_token fuzz target, its added corpus or its replay test is missing or fails
      run: >-
        test -f crates/betterlite-mcp/fuzz/fuzz_targets/oauth_id_token.rs &&
        grep -q oauth_id_token crates/betterlite-mcp/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/oauth_id_token)" &&
        cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(replays_the_id_token_corpus)'
    - id: jwks-tests
      why: the JWKS fetch, discovery or cache rules differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_identity_binding::jwks::tests::/)'
    - id: refresh-tests
      why: the refresh token ownership check passes a token that is not the caller's stored credential
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_identity_binding::refresh::tests::/)'
    - id: enforce-tests
      why: the order of the checks, the mode handling or the 403 detail differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^oauth_identity_binding::enforce::tests::/)'
    - id: helper-tests
      why: the helper adapter does not reach the production functions
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::mcp::b4659::/) - test(/replays_the_/)'
    - id: helper-oracle
      why: the helper cases are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-oauth-identity-binding)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/mcp-oauth-identity-binding
    - id: helper-python
      why: the Python helper adapter is unchanged or fails the strict checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4659.py tools/oracle/helpers/b4659)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-oauth-identity-binding seed reaches the shared parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-oauth-identity-binding-*')" &&
