id: B4659
title: MCP upstream OAuth identity binding
description: >-
  An MCP server can be marked so that a per-user OAuth token is only stored for the person it belongs to. Without this, a user signed in upstream as one account can finish the OAuth flow and have that token saved under a different gateway user (a confused deputy). In LiteLLM the code is oauth_identity_binding.py (423 lines). Before the token endpoint returns, stores or caches an exchanged token, it checks the upstream id_token (signature from the issuer's JWKS, issuer, audience, expiry, nonce), reads one claim from it, and compares that claim with the gateway caller's own identity. In enforce mode a mismatch answers 403 and nothing is stored. In audit mode it only logs. B4675, B4676, B4679 and the stored-token code (B4713, B4715) call this module, so every public name below is spelled as written.


  Put the code in the new module oauth_identity_binding of betterlite-mcp: crates/betterlite-mcp/src/oauth_identity_binding.rs holds the types, the port traits and the re-exports, and the submodules are proof, principal, id_token, jwks, refresh and enforce, each with a tests.rs beside it. Add to crates/betterlite-mcp/Cargo.toml: jsonwebtoken (jsonwebtoken.workspace = true, B762 adds it to the workspace with its features), subtle (subtle.workspace = true), caseless = "0.2.2" (already used by betterlite-roi) and tracing is already there. The binding policy type comes from B6590, in crates/betterlite-mcp/src/server_record.rs: MCPServer (fields server_id and oauth_identity_binding: Option<MCPOAuthIdentityBinding>) and MCPOAuthIdentityBinding with mode (Disabled, Audit, Enforce), issuer, jwks_url, audiences, principal_claim, caller_field (UserEmail or UserId) and require_email_verified. Read that file for the exact enum names and use them, do not copy the types.


  Ports. LiteLLM takes three async callables with production defaults. The module has no globals and betterlite-mcp cannot reach the database, the pool or the active-user code, so each is a trait taken as a generic parameter (native async fn in the trait, not dyn), like B4658's SubjectStore. JsonGet has `async fn get_json(&self, url: &str) -> Result<serde_json::Value, JsonGetError>` and stands for the Oauth2Check pooled client: a non-2xx status or a body that is not JSON is an Err whose Display text is the cause. ActiveUserEmail has `async fn active_user_email(&self, user_id: &str) -> Option<String>` and stands for load_active_user_by_id with the cache source: None for every failure and for a user with no email. UserCredentialStore has `async fn oauth_credential(&self, user_id: &str, server_id: &str) -> Result<Option<StoredOAuthCredential>, CredentialReadError>` where StoredOAuthCredential holds refresh_token: Option<SecretString> and identity_binding_proof: Option<String>. B137 wires the production implementations, so this task tests with fakes.


  Public API, all in oauth_identity_binding. RefreshOwnership is Proven (the gateway unwrapped the refresh token from its own sealed envelope) or Presented(SecretString). A grant with no ownership is Option<RefreshOwnership> = None. VerifiedRefreshToken { refresh_token: SecretString, binding_proof: String }. BindingDenied { code: RejectionCode, description: String, server_id: String } with RejectionCode::PrincipalMismatch ("oauth_principal_mismatch") and RejectionCode::BindingFailed ("oauth_identity_binding_failed"), as_str on the code, status() -> u16 giving 403, and detail() -> serde_json::Value giving the object {"error": code, "error_description": description, "server_id": server_id, "credential_owner": "caller", "credential_stored": false}. The trait BindingValidator is LiteLLM's Protocol that B4676 and the refresher take: `async fn validate(&self, server: &MCPServer, token_response: &serde_json::Map<String, serde_json::Value>, litellm_user_id: Option<&str>, grant_type: &str, refresh_ownership: Option<&RefreshOwnership>) -> Result<Option<String>, BindingDenied>`. The struct IdentityBinder<J, U, S, K> holds jwks: IssuerJwks<J>, users: U (ActiveUserEmail), store: S (UserCredentialStore) and a clock `Arc<dyn Fn() -> DateTime<Utc> + Send + Sync>`. It implements BindingValidator and also has the inherent `enforce_oauth_identity_binding(&self, server, token_response, litellm_user_id, grant_type, refresh_ownership, expected_nonce: Option<&str>) -> Result<Option<String>, BindingDenied>`, which the authorization_code path calls with the transaction nonce. The name enforce_oauth_identity_binding is exactly 30 characters, the limit, so do not lengthen it or any other name here. Also public: `current_binding_proof(users: &impl ActiveUserEmail, binding, user_id, server_id) -> Option<String>` and `credential_binding_matches(users: &impl ActiveUserEmail, binding, user_id, server_id, stored_proof: Option<&str>) -> bool`.


  proof. binding_proof(binding, user_id, server_id, principal) -> String is the lowercase SHA-256 hex of the text Python's json.dumps(..., sort_keys=True) writes for the 5-item array ["oidc-nonce-v1", server_id, user_id, principal, binding dumped as a JSON object]. The stored value is compared with proofs LiteLLM already wrote, so the bytes must match exactly: separators ", " and ": ", keys sorted, and ensure_ascii, meaning every char above 0x7f is written as \uXXXX in lowercase hex, an astral char as a surrogate pair, while 0x7f itself stays raw; quote, backslash, \n, \r, \t, \b, \f use their short escapes and other controls below 0x20 use \u00xx. serde_json's compact writer differs, so write a small serde_json Formatter for this, in proof.rs. The binding object has the keys audiences (array, order kept), caller_field ("user_email" or "user_id"), issuer, jwks_url (string or null), mode ("audit" or "enforce"), principal_claim and require_email_verified (true or false). A worked line: for server_id "srv", user_id "u1", principal "a@b.c" and the default binding with issuer "https://i", audiences ["x"], mode enforce, the text is ["oidc-nonce-v1", "srv", "u1", "a@b.c", {"audiences": ["x"], "caller_field": "user_email", "issuer": "https://i", "jwks_url": null, "mode": "enforce", "principal_claim": "email", "require_email_verified": true}]. current_binding_proof asks the caller principal (below) and gives None when it is None or empty, otherwise the proof. credential_binding_matches is false when stored_proof is None or empty, false when current_binding_proof is None, and otherwise a constant-time comparison (subtle ConstantTimeEq on the bytes).


  principal. caller_principal(users, binding, user_id) -> Option<String>: for caller_field UserId it is user_id itself, with no lookup. For UserEmail it is users.active_user_email(user_id). principals_match(upstream, caller, binding) -> bool: when principal_claim == "email" or caller_field is UserEmail, compare Unicode default case-folded (caseless::default_case_fold_str, the same as Python's casefold) trimmed text; otherwise compare exactly. upstream_principal(claims, binding) -> Result<String, Rejection> reads claims[principal_claim]; it must be a non-empty string, else the rejection "id_token has no usable '<claim>' claim". When principal_claim == "email" and require_email_verified, claims["email_verified"] must be the JSON value true (the string "true" is not enough), else "id_token email is not verified (email_verified is not true)".


  id_token. verify_id_token(id_token: &str, keys: &[serde_json::Value], binding, now: DateTime<Utc>) -> Result<serde_json::Map<String, serde_json::Value>, Rejection>. This function reads bytes from an upstream server, so it is the fuzzed decoder (see Fuzz). It never panics and every failure is a Rejection with code BindingFailed. Step one, pick the key: read the unverified header; a header that does not parse gives "invalid id_token header or issuer signing key". Take header "kid" (missing or null means no kid). If there is no kid, the first key in the list is used, whatever it is. With a kid, the first key whose own "kid" equals it. No match gives "id_token signing key (kid='<kid>') not found in the issuer's JWKS". The chosen key is converted to a decoding key; a failure gives "invalid id_token header or issuer signing key" and the next key is not tried. Step two, verify the signature with jsonwebtoken, switching its own exp, nbf, aud and iss checks off and clearing its required claims, because the claim rules below are applied by hand: allowed algorithms are RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384 only (see the ES512 deviation). A header alg outside the list, including none and every HS*, fails. Failures read "id_token validation failed: <cause>". Step three, claims, zero leeway. iss, exp, aud, sub and iat must all be present and not null. A present iat must be a number and not in the future (iat > now fails). A present nbf must be a number and nbf > now fails. exp must be a number and exp <= now fails (an exp equal to now is expired). iss must be a string equal to binding.issuer. aud, which must be non-empty, is a string or an array of strings (any other shape fails) and passes when at least one entry of binding.audiences is among the token's audiences. sub must be a string. jti, if present, must be a string. Numbers may be integers or floats; a float is cut toward zero like Python's int().


  jwks. IssuerJwks<J: JsonGet> has a constructor taking the JsonGet and a clock, and `async fn issuer_keys(&self, binding) -> Result<Vec<serde_json::Value>, JwksError>`. The URL is binding.jwks_url when it is set and non-empty. Otherwise it GETs discovery_url = issuer with trailing "/" characters removed + "/.well-known/openid-configuration" and takes the "jwks_uri" string from the answer; a missing, non-string or empty value is the error "OIDC discovery at <discovery_url> returned no jwks_uri". Discovery is not cached and runs on every call that has no jwks_url, because LiteLLM only caches by the resolved JWKS URL. The JWKS document is cached under its URL for 3600 seconds (fixed): a hit returns the cached array. A miss GETs the URL, and the answer must be an object with a "keys" array, else the error "JWKS document at <url> has no 'keys' array" and nothing is cached. keys_from_document(document, url) -> Result<Vec<serde_json::Value>, JwksError> is that check and is also fuzzed. The cache is a Mutex'd map inside IssuerJwks, never a static, and an entry is expired when now is strictly after its expiry, like LiteLLM's InMemoryCache. There is no stale copy, no retry and no single-flight, so two misses at once both fetch. The token's jku and x5u headers are never used.


  refresh. A refresh_token grant whose token response has no id_token cannot be checked against a principal, so ownership of the refresh token is checked instead. evaluate_refresh_ownership(store, users, binding, user_id: Option<&str>, server_id, ownership) -> Result<String, Rejection>: None gives "refresh_token grant without an id_token carries no refresh token to prove ownership of"; Proven gives "an identity envelope alone does not prove upstream principal binding" (the envelope never carries the upstream principal, so it can't stand in for an id_token); Presented needs a user_id, else "the request carries no resolvable LiteLLM user identity to bind the credential to". It then calls load_stored_refresh_token(store, users, binding, user_id, server_id) -> Option<VerifiedRefreshToken>: store.oauth_credential, and an Err, a missing row, a credential_binding_matches that is false (with the stored identity_binding_proof), or a missing or empty refresh_token or proof all give None. Any store error fails closed as None and never surfaces. If the result is None or its refresh_token differs from the presented one (constant-time), the rejection is "the presented refresh_token is not the caller's stored credential for this server". Otherwise the result is the stored binding_proof, which is returned as the proof.


  enforce. enforce_oauth_identity_binding does this in order. No binding on the server, or a mode that is not Audit or Enforce, returns Ok(None) with no work. Then it evaluates: (1) token_response["id_token"]; when it is not a non-empty string, a grant_type other than "refresh_token" is the rejection "the upstream token response carries no id_token to bind the credential to a principal", and "refresh_token" goes to evaluate_refresh_ownership and returns its result. (2) litellm_user_id missing or empty gives "the request carries no resolvable LiteLLM user identity to bind the credential to". (3) issuer_keys; an Err gives "could not fetch the issuer's JWKS: <error>". (4) verify_id_token. (5) when grant_type == "authorization_code" and (mode is Enforce or expected_nonce is Some), the token's "nonce" claim must be a string and expected_nonce a non-empty value that is equal in constant time, else "id_token nonce does not match the authenticated authorization transaction"; note that the audit mode with no expected nonce skips this. (6) upstream_principal. (7) caller_principal; None or empty gives "the LiteLLM user has no '<caller_field>' to compare the upstream principal against", with caller_field spelled user_email or user_id. (8) principals_match false gives code PrincipalMismatch with the description "The browser account does not match the selected credential owner." (9) success gives binding_proof(binding, user_id, server_id, caller). On a success string, Enforce mode returns Ok(Some(proof)) and Audit returns Ok(None). On a rejection, Audit logs tracing::warn "oauth_identity_binding audit: server=<id> user=<id> grant=<grant> rejected=<code> (<description>)" and returns Ok(None), and Enforce returns Err(BindingDenied). The refresh-ownership success path returns the stored proof the same way.


  Port for betterlite-db. B4715 (betterlite-db) cannot import this crate, so it declares the trait `OauthBindingPort` in its module oauth_token_resolution. Implement that trait for IdentityBinder in the enforce submodule (its tests sit in enforce/tests.rs), with Server = MCPServer, Ownership = RefreshOwnership and Denied = BindingDenied. Its enforce calls enforce_oauth_identity_binding with expected_nonce None, and its proof_matches reads the server oauth_identity_binding and calls credential_binding_matches, giving false when the server has no binding. Add betterlite-db to crates/betterlite-mcp/Cargo.toml if B6590 has not yet.

  Tests use fakes for the three ports, a fixed now, and ids made up for the test. Signed id_tokens in tests are made with a throwaway RSA key and a throwaway EC P-256 key stored as test fixtures in the tests.rs files or a fixtures folder under the module, and their JWKs sit beside them. No route reaches this code yet (B4675 and B4676 add the callers), so the HTTP oracle cases come with the umbrella B137. This task has helper cases for the pure behavior: the helper operation b4659 takes a field function (binding_proof, principals_match, credential_binding_matches or enforce). The Python side builds the MCPServer and MCPOAuthIdentityBinding from the case and calls _binding_proof, _principals_match, credential_binding_matches or enforce_oauth_identity_binding, with the three LiteLLM injection points (jwks_fetcher, caller_principal_loader, stored_refresh_token_loader) replaced by functions that return what the case lists. The Rust side calls the production functions through fakes built from the same case. Each case returns either the proof string or the error detail (status, error, error_description, server_id). Signed id_tokens go into the cases as literal strings made once with a throwaway key and exp 9999999999 (year 2286) and iat 1700000000, because LiteLLM reads the real clock; an expired case uses exp 1. Cases ignore /error_description for any signature or JWT library message, with the reason that the text is PyJWT's, and compare it for the messages this task spells out. Add an mcp-oauth-identity-binding-* seed to the helper_case corpus for each function.


  Fuzz. verify_id_token reads an id_token an upstream server wrote, and keys_from_document reads the JWKS body. The cargo-fuzz target oauth_id_token in crates/betterlite-mcp/fuzz feeds arbitrary bytes, read as lossy UTF-8, to verify_id_token with a fixed RSA JWK and a fixed binding, and the same bytes parsed with serde_json::from_slice to keys_from_document. The test oauth_identity_binding::id_token::tests::replays_the_id_token_corpus replays crates/betterlite-mcp/fuzz/corpus/oauth_id_token through both. Add corpus files: a valid compact token, a token with each part cut, one with an alg of none, and a JWKS document with no keys array. Register the bin in crates/betterlite-mcp/fuzz/Cargo.toml and add serde_json to its dependencies.
scope:
  paths:
    - crates/betterlite-mcp/src/oauth_identity_binding.rs
    - crates/betterlite-mcp/src/oauth_identity_binding/**
    - crates/betterlite-mcp/Cargo.toml
    - crates/betterlite-mcp/fuzz/Cargo.toml
    - crates/betterlite-mcp/fuzz/fuzz_targets/oauth_id_token.rs
    - crates/betterlite-mcp/fuzz/corpus/oauth_id_token/**
    - Cargo.lock
    - tools/oracle/cases/helpers/mcp-oauth-identity-binding/**
    - tools/oracle/fuzz/corpus/helper_case/mcp-oauth-identity-binding-*
    - tools/oracle/helpers/b4659.py
    - tools/oracle/helpers/b4659/**
    - tools/oracle/src/helpers/mcp/b4659.rs
    - tools/oracle/src/helpers/mcp/b4659/**
  lint_tables: false
