deviations:
  - what: An id_token signed with ES512 is rejected with oauth_identity_binding_failed in all modes. LiteLLM accepts it.
    why: The jsonwebtoken crate has no ES512, and B762 carries a separate RustCrypto p521 path. Failing closed is safe, and the open question for the architect is whether to reuse B762's verifier.
  - what: Every failure while verifying the signature or the claims becomes a binding rejection (403 in enforce mode). LiteLLM only catches PyJWT's InvalidTokenError, so a key whose type does not fit the token's alg raises InvalidKeyError and escapes as a 500.
    why: A failing check must never turn into a server error or a skipped check.
  - what: The 403 or audit description for a signature or claim failure carries the Rust library's cause text and not PyJWT's.
    why: The wording comes from different libraries. The code and every description this task spells out stay the same, and the oracle cases ignore /error_description for these.
  - what: The JWKS cache belongs to the IssuerJwks value the composition root builds, not to a module-level InMemoryCache, and it has no 200 item cap.
    why: The repo rules forbid module-level state, and one entry per configured issuer never reaches the cap. The 3600 second lifetime and the strict expiry check are kept.
  - what: Outbound JWKS and discovery requests use the B173 pooled client through the JsonGet port, so its timeouts and body size caps apply, and they replace httpx's defaults.
    why: Every outbound request in betterlite goes through the pool.
  - what: Trimming uses Rust's trim, which does not strip the four ASCII separators 0x1c to 0x1f that Python's str.strip removes.
    why: Only matters for an account name that starts or ends with one of those control characters.
out_of_scope:
  - "bridge_token_flow.load_active_user_by_id: B4658 owns it. The production ActiveUserEmail is a thin impl on B4658's ActiveSubjects (load_active_user with the cache source, keeping user_email), written in the composition root B137."
  - "get_user_oauth_credential and the credential decryption: B4713 owns them. The production UserCredentialStore over them is written in the composition root B137."
  - "The production JsonGet over the B173 pooled client with httpxSpecialProvider.Oauth2Check semantics: written in the composition root B137, since betterlite-mcp does not depend on betterlite-http."
  - "discoverable_endpoints.py token and authorize routes: B4675 and B4676 call enforce_oauth_identity_binding and pass the nonce. refresh_user_oauth_token in db.py: B4715. per_user_oauth_store.py and authz_code_refresher.py: their owners call credential_binding_matches and BindingValidator."
  - "MCPServer and MCPOAuthIdentityBinding and the rule that a binding needs gateway managed per-user OAuth: B6590."
  - "Disabling the direct oauth-user-credential POST in enforce mode: that check is in the route, not in this file."
pitfalls:
  - audit mode returns no proof even when the check passes, so a stored credential for an audit server never carries identity_binding_proof; only enforce mode returns the string.
  - The early refresh check in discoverable_endpoints and the refresher passes an empty token response, so the refresh branch must work on {} and must not need an id_token.
  - Discovery is fetched on every call without a jwks_url, since the cache key is the resolved JWKS URL; caching the discovery answer would change when a rotated jwks_uri is noticed.
  - A token with no kid takes the first key of the JWKS even when that key is for encryption, and a token with a kid does not match a JWKS key that has no kid.
  - exp equal to the current second is expired, while an iat or nbf equal to the current second is valid.
  - The nonce check reads grant_type == "authorization_code" and not the mode alone, so audit mode with an expected nonce checks it and enforce with no nonce fails.
  - The proof contains the whole binding, so changing audiences, issuer or jwks_url of a server makes every stored credential fail credential_binding_matches and forces a new sign-in.
  - email_verified must be the JSON boolean true; the string "true" and 1 are not verified.
  - A case-folded comparison also applies when principal_claim is "sub" but caller_field is user_email; only the pair sub plus user_id compares exactly.
  - load_stored_refresh_token swallows every store error and returns None, so a database outage reads as "not the caller's stored credential" and not as a 500.
  - The Proven envelope never passes alone, because an envelope the gateway sealed says nothing about which upstream account the refresh token belongs to.
  - Python's json.dumps keeps 0x7f raw but escapes every char above it, and writes an astral char as two \ud8xx\udcxx escapes; serde_json's default writer would keep them raw and give another hash.
