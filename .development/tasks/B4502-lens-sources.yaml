  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L114-L173
    why: SourceReader.sample pagination with cursor/offset, metadata filtering and Execution record construction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L175-L204
    why: SourceReader.content 40-span pagination, TracePart construction and partial/truncated detection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L206-L219
    why: SourceReader.verify_evidence quote matching through storage count.
dod:
  - text: All row types (ActivityAvailability, ExecutionRow, PartRow, CountRow, AgentRow) decode from JSON with field constraints matching the pinned source; deserialization rejects extra fields and enforces type safety.
    proof: [row-validation-tests]
  - text: execution_id encodes 3-tuple or 4-tuple to base64-urlsafe JSON with no padding; parse_execution decodes back with legacy 3-element support, returning empty string for missing trace_ref.
    proof: [execution-id-tests]
  - text: parameters builds read-only mapping with all_teams (int), team, key_hash, filter_keys, filter_values from scope and settings filters in the correct order.
    proof: [parameters-tests]
  - text: selection_id derives stable ID from execution by joining source, team, and (trace_ref or trace_id) with null bytes, matching the pinned algorithm exactly.
    proof: [selection-id-tests]
  - text: SourceReader.availability queries storage and returns first ActivityAvailability row or default (both traces and requests false); agents returns tuple of agent_name strings from all rows.
    proof: [availability-agents-tests]
  - text: SourceReader.sample applies scope/filter parameters, validates ExecutionRow items, filters out litellm.api_key_hash metadata, computes next_cursor (last selection_key if exactly 100 rows), computes next_offset (offset+len(rows) only when continuing), and constructs Execution records with filtered metadata.
    proof: [sample-pagination-tests, sample-boundaries-tests]
  - text: Sample pagination always returns page_size 100; next_offset is computed only when offset+len(rows) < eligible (if preview) or selected (otherwise), preserving cursor-based continuation.
    proof: [sample-boundaries-tests]
  - text: SourceReader.content validates PartRow items, constructs TracePart records with execution_id, span_id, parent_span_id, name, kind, content and truncated flag; next_cursor is last span_id only when exactly 40 rows returned.
    proof: [content-pagination-tests]
  - text: ExecutionContent.partial is true when root_seen is false or any row's truncated value is nonzero; computed as logical OR of the conditions.
    proof: [content-truncation-tests, content-partial-tests]
  - text: SourceReader.verify_evidence queries storage with execution/evidence parameters and returns true only when storage returns at least one row with count > 0.
    proof: [evidence-validation-tests]
  - text: Metadata filtering excludes litellm.api_key_hash by key name and enforces key length 0 < len(k) <= 200 and value length 0 < len(v) <= 500, dropping invalid pairs silently.
    proof: [sample-metadata-tests]
  - text: Opaque-ID fuzz target feeds arbitrary bytes to parse_execution and storage-row decoder, validating recovery of valid tuples/rows or correct errors on malformed base64, truncated JSON, and invalid element counts.
    proof: [lens-sources-fuzz, lens-sources-corpus]
checks:
  optional: [mutants]
  commands:
    - id: row-validation-tests
      why: Row types do not decode from JSON or field constraints are missing.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::(activity_availability|execution_row|part_row|count_row|agent_row)::/)'
    - id: execution-id-tests
      why: execution_id encoding or parse_execution decoding does not handle 3-element and 4-element tuples or legacy compatibility.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::(execution_id|parse_execution)::/)'
    - id: parameters-tests
      why: parameters mapping or read-only dict construction is missing or incorrect.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::parameters::/)'
    - id: selection-id-tests
      why: selection_id derivation or null-byte joining is incorrect.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::selection_id::/)'
    - id: availability-agents-tests
      why: SourceReader.availability or agents methods are missing or do not validate storage responses.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::source_reader::(availability|agents)::/)'
    - id: sample-pagination-tests
      why: SourceReader.sample does not apply filters, paginate, validate rows or construct Execution records.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::source_reader_sample::/)'
    - id: sample-boundaries-tests
      why: Sample pagination does not correctly compute next_cursor/next_offset at page boundaries or validate 100-row page size.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::sample_boundaries::/)'
    - id: sample-metadata-tests
      why: Sample does not filter litellm.api_key_hash or does not enforce metadata key/value length constraints.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::sample_metadata::/)'
    - id: content-pagination-tests
      why: SourceReader.content does not fetch span pages, construct TracePart records, or compute pagination cursors.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::source_reader_content::/)'
    - id: content-truncation-tests
      why: ExecutionContent.partial detection of root_seen or truncated flags is missing.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::content_truncation::/)'
    - id: content-partial-tests
      why: ExecutionContent.partial flag does not use bitwise-or logic for root_seen and truncated detection.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::content_partial::/)'
    - id: evidence-validation-tests
      why: SourceReader.verify_evidence does not query storage or validate count > 0.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(/^sources::verify_evidence::/)'
    - id: lens-sources-fuzz
      why: Byte-string decoder for opaque IDs and storage rows lacks implementation or corpus replay.
      run: cargo nextest run --locked -p betterlite-lens --no-tests=fail -E 'test(replays_the_lens_sources_corpus)'
    - id: lens-sources-corpus
      why: No seed corpus exists for opaque ID or storage row decoding fuzzing.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-lens/fuzz/corpus/lens_sources/lens-*)"
