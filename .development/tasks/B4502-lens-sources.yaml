id: B4502
title: Read Lens activity samples and verify stored evidence
description: >-
  Build crates/betterlite-lens/src/sources module with the typed storage port,
  row adapters, and SourceReader that projects activity availability, agents,
  execution samples, execution content pages and stored evidence verification.
  The module implements opaque execution ID encoding and decoding (supporting
  both three-element and four-element tuples for legacy compatibility), stable
  selection ID derivation, parameter mapping for storage queries, and sample/
  content pagination with strict validation and constraint enforcement. Preserve
  100-row sample pages, 40-span content pages, metadata-key hiding (rejection of
  litellm.api_key_hash attributes), and the offset increment semantics (offset
  increased only when page continues). Storage trait is an injected port; the
  concrete lens_availability, lens_agents, lens_sample, lens_content,
  lens_evidence implementations belong to a different task (G1).
  ActivityAvailability records default both traces and requests to false.
  ExecutionRow, PartRow, CountRow, AgentRow are row types decoded from storage
  responses with strict field validation. Functions execution_id (encode tuple
  to base64 JSON), parse_execution (decode back with legacy 3-element support),
  parameters (build storage query mapping from scope and filters), and
  selection_id (derive stable ID from execution) are pure and testable.
  SourceReader takes injected Storage and implements availability (select first
  row or default), agents (project agent_name tuple), sample (apply filters/
  pagination, validate rows, construct Execution records with filtered metadata,
  compute next_cursor/offset), content (fetch span pages, construct TracePart
  records, detect root_seen and truncation), and verify_evidence (quote matching
  through storage). Byte-string decoders for opaque IDs need corpus-backed fuzz
  coverage including legacy 3-element forms and malformed inputs.
