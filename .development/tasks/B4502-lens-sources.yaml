deviations:
  - what: Row types use serde's `#[serde(deny_unknown_fields)]` instead of Pydantic's `extra="forbid"`.
    why: Serde provides the same strict field validation across both server and worker without accepting unrecognized fields.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L34-L71
  - what: Storage is defined as an async Rust trait with method signatures rather than a concrete ClickHouseStorage implementation.
    why: The trait is an injected port; the concrete storage implementation (G1 in the outline) lives in a separate task not yet assigned.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L26-L31
  - what: Opaque execution IDs use base64-urlsafe encoding without padding, matching Python's urlsafe_b64encode byte-for-byte.
    why: Deterministic encoding ensures legacy 3-element IDs round-trip correctly and selection IDs are reproducible.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L74-L75
  - what: Metadata filtering is implemented as an iterator filter during execution construction, not as field-level validators.
    why: Post-deserialization filtering is more testable and allows per-row decisions on validity vs. constraint enforcement.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L165-L169
out_of_scope:
  - B4500 owns Scope, LensSettings, MetadataFilter, Execution, ExecutionContent, Evidence and TracePart record definitions and validation, and adds `pub mod sources;` to crates/betterlite-lens/src/lib.rs as a parent module declaration.
  - B4501 owns LensRepository and database persistence; calls SourceReader for content/evidence queries.
  - Concrete Storage trait implementations (lens_availability, lens_agents, lens_sample, lens_content, lens_evidence methods) are assigned to G1 (outstanding architectural decision).
  - B4503/B4505 own HTTP routes that wrap SourceReader methods and deserialize request parameters.
  - B4507, B4508, B4509 own extraction/investigation/analysis stages that consume ExecutionContent and Evidence records.
  - B132 owns worker executable that calls SourceReader through injected dependencies.
pitfalls:
  - "Dependency: crates/betterlite-lens/src/lib.rs must declare `pub mod sources;` before this module compiles; B4500 owns this parent module declaration."
  - "Dependency: tools/oracle/src/helpers/lens.rs must register `\"lens_sources\" => sources,` and tools/oracle/src/helpers/lens/b4502.rs must exist as a stub before the oracle helper can compile; this registration is outside this task's scope."
  - 'Opaque execution IDs encode 3-element or 4-element tuples as JSON arrays with base64-urlsafe no-padding encoding; parse_execution decodes without padding and interprets missing fourth element as empty string for trace_ref, enabling legacy 3-element compatibility.'
  - 'Selection ID joins source, team, and (trace_ref if present else trace_id) with null bytes (`\\0` / chr(0)); never use space, underscore or other separators, as the result must be a stable, opaque identifier.'
  - 'SourceReader.sample computes next_offset only when offset+len(rows) < eligible (if preview mode) or selected (normal mode); pages returning fewer rows than page_size (100) signal the end and have next_offset=None.'
  - 'Metadata filtering during sample construction: skip litellm.api_key_hash by exact key match, enforce key length 0 < len(k) <= 200 and value length 0 < len(v) <= 500, dropping oversized pairs silently without error.'
  - 'SourceReader.content returns next_cursor (the last span_id) only when the response contains exactly 40 rows; fewer rows indicate no more pages remain.'
  - 'ExecutionContent.partial flag is true when root_seen is false OR any PartRow.truncated value is nonzero (i.e., partial |= any(truncated)); both conditions are checked independently.'
  - 'SourceReader.availability queries storage and returns the first ActivityAvailability from the result, or a default ActivityAvailability(traces=false, requests=false) if storage returns empty.'
  - 'SourceReader.agents queries storage and returns a tuple of agent_name strings from all AgentRow results; empty storage returns an empty tuple, not None.'
  - 'The fuzz target for opaque IDs and storage rows must test: base64 decode errors (invalid padding, non-base64 chars), truncated JSON (incomplete tuples), 3-element legacy tuples, 5+ element tuples, and completely malformed input.'
