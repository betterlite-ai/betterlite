    why: Row type definitions (ActivityAvailability, ExecutionRow, PartRow, CountRow, AgentRow) and TypeAdapters for JSON validation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L26-L31
    why: Storage protocol with five async methods (lens_availability, lens_agents, lens_sample, lens_content, lens_evidence).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/sources.py#L74-L99
