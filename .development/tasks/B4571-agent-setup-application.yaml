dod:
  - text: >-
      resolve_credential takes the given key, else the context key unless it came from the token file, and rejects a missing, blank or control-character key with errors that carry LiteLLM's facts.
    proof: [setup-credential]
  - text: >-
      The listing sends the Claude Code headers only for Claude Code and does not follow a redirect, maps each failure kind to its error, repairs a rejected key once under LiteLLM's three conditions, and validates a model by source_model, then id, with at most 20 ids in the error.
    proof: [setup-listing]
  - text: >-
      prepare picks the default, base URL and key as LiteLLM does with and without edit_connection, keeps the current key on an empty entry, runs the pickers in interactive mode or on repair_model, requires a Codex model before any prompt or request, and builds the profile or the invalid-setup error.
    proof: [setup-prepare]
  - text: >-
      configure_targets rejects --model with --default-model, preflights every target before preparing any and prepares every target before applying any, saves each profile before its settings, and prints LiteLLM's lines, symlink notes and the saved-setup error.
    proof: [setup-apply]
  - text: >-
      pick_targets and both model pickers pass LiteLLM's messages, choices and preselected rows to the prompter, ask again on an empty target answer, return targets in claude, codex order and map the keep row to none.
    proof: [setup-pickers]
checks:
  optional: []
  commands:
    - id: setup-credential
      why: the credential tests are missing or the key choice or a rejection differs from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^agent_setup::.*tests::credential_/)'
    - id: setup-listing
      why: the listing tests are missing or the headers, redirects, an error kind, the repair rule or model validation differs from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^agent_setup::.*tests::listing_/)'
    - id: setup-prepare
      why: the prepare tests are missing or the default, base URL, key reuse, picker trigger or saved profile differs from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^agent_setup::.*tests::prepare_/)'
    - id: setup-apply
      why: the apply tests are missing or the preflight, prepare, save and apply order, a printed line or the saved-setup error differs from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^agent_setup::.*tests::apply_/)'
    - id: setup-pickers
      why: the picker tests are missing or a message, choice, preselected row or the returned order differs from the description
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^agent_setup::.*tests::pickers_/)'
oracle_cases: []
deviations:
  - what: >-
      The target checkbox, the two model pickers and the URL and key prompts are drawn by dialoguer. Their messages, choices, preselected rows, the empty-answer rules and the hidden key entry are LiteLLM's, but the look, the key bindings and the fuzzy match ranking differ from InquirerPy's and click's.
    why: >-
      Porting InquirerPy's terminal widgets is a large job for screens only a person reads. Every non-interactive path takes its values from options and the saved setup, and those stay LiteLLM's.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/configure_setup.py#L224-L259
out_of_scope:
  - The configure, reconfigure and unconfigure commands, their options, the "Gateway URL" prompt in configure.py and setup_locks around configure_targets are B4572's and B4570's. The CLI root declares the agent_setup module and maps Usage and the other errors to exit codes (main.py, B134).
  - "interactive_configure (configure_setup.py L425-L437) has no caller at the pin: configure.py only imports and re-exports it (L35 and L306), and a Rust binary has no embedders, so no task ports it. B4572's out_of_scope line that gives it to B4571 is outdated."
  - SavedSetup and its validation, the resolved settings path, read_saved_setup, save_setup and the targets list are B4570's.
  - configure_claude_settings and preflight_claude_settings are B4563's. claude_settings_path, configure_state_path, settings_file_owners, StaticToken, StartOn, UnpinModel and STARTING_MODEL_ROLE are B4562's.
  - configure_codex_settings and preflight_codex_settings are B4569's, and codex_config_path is B4564's.
  - fetch_model_listing, ListedModel, ListingFailure and the listing error are B4565's. normalize_base_url and the context values are B4560's.
  - The server's Claude Code model view keyed on x-gateway-client (model_listing_utils.py L120) belongs to the model list routes, not to this client.
pitfalls:
  - >-
    configure_targets prepares every target before it applies any, so a Codex listing failure leaves Claude Code's settings untouched even when claude comes first.
  - >-
    The profile is saved before its settings are applied, so an apply error still leaves a saved setup, and the error has to say so and name lite configure {target}.
  - >-
    The picker count matches "claude" or "anthropic" anywhere in the id and in any case (an re.IGNORECASE search), so "Claude-3" and "my-anthropic-proxy" both count.
  - >-
    Claude Code saves the source name and starts on the id found for it again at apply time. Two ids may share a source_model, so --model with the second id starts on the first one; that is LiteLLM's behavior and stays. Codex validates its model but writes it as given.
  - >-
    Repair needs a saved setup, a non-interactive run and a terminal on stdin; a first-time setup or a piped run fails on a rejected key without a prompt.
  - >-
    The saved settings_path must be the exact string B4570's read_saved_setup compares against, or the next run reports the profile as invalid. Use B4570's resolved path; std::fs::canonicalize fails on a settings file that does not exist yet, while Python's Path.resolve does not.
  - >-
    The symlink notes print the link target as Path.resolve gives it, and only after the settings were written and the stdout lines printed.
  - >-
    dialoguer pulls console and fuzzy-matcher, and neither is in Cargo.lock yet. Turn its default features off, enable fuzzy-select and password, and pick a release whose dependencies cargo deny accepts.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
