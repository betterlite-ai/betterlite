id: B4571
title: Validate and apply agent gateway setup
description: >-
  Build the setup flow behind lite configure and lite reconfigure in Rust, ported from LiteLLM's litellm/proxy/client/cli/commands/configure_setup.py: resolve_credential, the model listing with key repair, the per-target prepare step, the target and model pickers, and configure_targets. The code lives in tools/management-cli/src/agent_setup.rs and agent_setup/**, and exports resolve_credential, pick_targets, configure_targets and MODEL_OPTION_HELP for B4572's commands. configure_targets takes B4560's context values (base_url, base_url_explicit, api_key and api_key_from_token_file), the process environment as a map, a prompter, whether stdin is a terminal (std::io::IsTerminal at the call site) and two writers for stdout and stderr, and returns Ok or this module's error enum. The enum has a Usage variant for LiteLLM's click.UsageError (the root prints it on stderr and exits 2) and plain variants for every click.ClickException (the root prints the text as one line on stderr and exits 1). The prompter is a trait for LiteLLM's prompts (the target checkbox, the Claude Code and Codex model pickers, the gateway URL and the hidden key entries); the real one uses dialoguer and tests pass a scripted one that records what it was asked.

  docs/compatibility.md decides what is ported. The order of preflight, prepare, save and apply, the request sent, the saved values it reuses, the prompts' messages, choices and defaults, the lines printed on stdout, the two symlink notes on stderr, the exit codes and the streams stay LiteLLM's. Python's habits are not copied. The context comes typed from B4560 instead of pydantic's model_validate of ctx.obj, picker answers come back typed instead of through TypeAdapter.validate_python, and a model name in an error is plain text, not a repr. ListedModel declares id and source_model as non-empty strings (pi.py L58-L62), so LiteLLM's "source_model or id" and "source or ..." are None checks here and give the same result for every listing of the declared type. Error texts are betterlite's own words, as rule errors-match-litellm says, and each carries LiteLLM's facts: the value at fault, the base URL, the HTTP status, and the option or command that fixes it.

  resolve_credential(context, api_key) uses api_key when given, else the context api_key unless api_key_from_token_file is true. None is an error that asks for a long-lived virtual key through --api-key, lite --api-key or LITELLM_PROXY_API_KEY and says the lite login credential expires within a day and is never written into agent settings. A key that trims to nothing, or has any character at or below U+0020 or equal to U+007F, is an error. It returns B4562's StaticToken.

  Listing. The models come from B4565's fetch_model_listing without following redirects. For Claude Code it adds anthropic-version: 2023-06-01 and x-gateway-client: claude-code (model_listing_utils.py L29-L31); Codex gets no extra header. Each failure kind has its error. Rejected names the HTTP status and asks for a valid --api-key. Unreachable asks whether the proxy at the base URL is running and whether --base-url or LITELLM_PROXY_URL is right. Empty repeats the listing's message and says Claude Code or Codex would have nothing to run. Any other kind says the proxy at the base URL answered and asks to check that it is a healthy LiteLLM proxy. Repair is on when a saved setup exists, the run is not interactive and stdin is a terminal. Then a rejected listing asks for "Replacement virtual key" (hidden, asked again when empty), resolves it, and lists once more; a second failure is the error for its kind. Every other failure, and every failure without repair, is its error at once. A name's starting model is the id of the first listed model whose source_model equals it, else the first listed id equal to it, else none. A name with no starting model is an error that gives the name, the base URL and the first 20 listed ids joined by ", ".

  prepare(target, saved, model, default_model). The default is none with default_model, else the model given, else the saved model. Codex with no default outside interactive mode is Usage: the --model option is missing and first-time Codex setup needs a starting model. This check runs before any prompt or request. With edit_connection, the prompt "Claude gateway URL" or "Codex gateway URL" offers the context base_url when there is no saved setup or base_url_explicit is set, and the saved base_url otherwise. The answer goes through B4560's normalize_base_url (its error is Usage) and loses one trailing "/v1". The key to keep is the supplied key (the context api_key unless it came from the token file), else the saved key when the saved base_url equals the new one. With one to keep, the prompt is "Virtual key (press Enter to keep the current key)" and an empty entry keeps it; without one, the prompt is "Virtual key" and an empty entry asks again. Without edit_connection, the base URL is chosen the same way with no prompt, and the key is the supplied key, else the saved key for that same URL. When that key does not resolve, a saved setup exists for another URL and no key was supplied, the error says the gateway changed, the saved key was not used and --api-key is needed for the new gateway. Then the listing and repair run. repair_model is true when repair is on, a default exists and it has no starting model. In interactive mode or on repair_model, Claude Code picks from the source names (source_model, else id) and Codex from the ids; otherwise the choice is the default. The Codex picker always returns a model and the non-interactive path already required one, so LiteLLM's check at configure_setup.py L352-L353 cannot fire and the types make it unneeded. The choice is validated as above. The model to save is the source name of that starting model for Claude Code and the choice as given for Codex. The profile is B4570's SavedSetup with the target, B4570's resolved settings path for the target, the base URL, the key from the listing step and that model. A profile B4570 rejects is an error that says the gateway setup is invalid and no settings were changed.

  configure_targets with both model and default_model is Usage. It preflights every target in order (B4563's preflight_claude_settings on B4562's claude_settings_path, B4569's preflight_codex_settings on B4564's codex_config_path, both from the environment map). It then prepares every target with B4570's read_saved_setup, and only then goes through the prepared setups, calling B4570's save_setup on each before applying it. Claude Code looks the saved model up again, applies through B4563's configure_claude_settings with StartOn(starting id) or UnpinModel when there is none, and prints LiteLLM's five lines (configure_setup.py L195-L211). The picker count there is the number of listed ids that contain "claude" or "anthropic" in any case. Codex validates the saved model, applies it as saved through B4569's configure_codex_settings and prints its three lines (L269-L271). When the settings path is a symlink, each prints LiteLLM's note on stderr (L212-L217 and L272-L273) with the link target. An error in this step keeps its cause, says the target's setup was saved and names lite configure {target} to retry. After each apply it prints "Setup saved. Edit with `lite reconfigure {target}`; remove saved settings and key with `lite unconfigure {target} --forget`."

  Pickers. pick_targets(defaults, edit) shows "Claude Code (CLI)" and "Codex (CLI)" with the defaults checked. Its message is "Which agents should be edited? Unselected agents keep their current setup" when editing and "Which agents should route through LiteLLM?" otherwise. An empty answer shows "Pick at least one." and asks again, and the picks come back in claude, codex order. The Claude Code picker asks "Model Claude Code starts on (type to filter; /model switches any time):" with "Keep Claude Code's own default" first, then the source names. It preselects the default when it is among them and the keep row otherwise, and the keep row returns none. The Codex picker asks "Model Codex starts on (type to filter):" over the ids and preselects the default when listed, else the first id.

  Tests. Test functions live in tests.rs files under agent_setup/ with the name prefixes the checks select: credential_, listing_, prepare_, apply_ and pickers_. They run against a local HTTP server on 127.0.0.1:0 (axum is in Cargo.lock) that serves /v1/models with canned statuses, bodies and redirects and records the request headers. They use a scripted prompter, an explicit terminal flag, and temp directories named in the environment map, so no test touches the real home directory or a terminal. They compare the exact stdout and stderr bytes for the lines LiteLLM prints, and assert the returned error variant and the facts its message carries for betterlite's own error texts.
scope:
  paths:
    - tools/management-cli/Cargo.toml
    - Cargo.lock
    - tools/management-cli/src/agent_setup.rs
    - tools/management-cli/src/agent_setup/**
  lint_tables: false
