id: B4571
title: Validate and apply agent gateway setup
description: >-
  Build credential and model validation, interactive selections, saved-setup repair and ordered
  application for Claude Code and Codex configuration. Preflight each selected target's settings
  before applying any, refuse login-derived credentials for permanent setup, and save a valid
  profile before attempting its settings write. The module handles the common flow: resolve
  credentials from --api-key, LITELLM_PROXY_API_KEY, or a saved profile; list available models
  from the gateway with key repair on rejection; validate model selections against the listing;
  and apply Claude and Codex settings in order with atomic profile saves. Default model pinning
  is optional for Claude, required for first-time Codex. Codex setup requires either --model or
  interactive selection. Model selection uses fuzzy search for Claude and Codex separately,
  showing source_model names when available. The module enforces that login tokens (from `lite
  login` with PKCE) are never written into settings; permanent setup requires a long-lived
  virtual key. Connection validation includes a repair loop for rejection on changed gateways.
  All model listings filter to the gateway's advertised models; model search for Codex treats
  all listed models as valid, while Claude Code filters to ids containing "claude" or "anthropic"
  in the picker. The listed model count and format diagnostics preserve the distinction between
  proxies that serve all models at the same names and those that differ in picker visibility.
  Failures abort the transaction and save the attempted profile so the user can retry with a
  corrected key; successful application saves the profile first, then applies settings, and
  reports success with next-step guidance.
scope:
