deviations: []
out_of_scope:
  - "No route and no production port: B8610 composes the app, B8621 to B8623 build the MCP identity, token and OAuth state, B8624 and B8702 mount the OAuth routes, B8626 the /mcp-rest routes and B8728 the /mcp transport. Their own HTTP cases are not repeated here, and neither are B136's upstream conversation cases."
  - "outbound_credentials/__init__.py (re-exports only) and every function in outbound_credentials/resolver.py (_NullOAuthTokenStore, _NullTokenExchanger, UpstreamCredentialProvider and its arms, _id_jag_slot_key, _id_jag_fingerprint, _client_auth_fingerprint, _not_implemented, resolve_credentials_with_source): B4667. The Byok key source arm returns not_implemented, since no code builds a Byok source at the pin."
  - "auth/litellm_auth_handler.py MCPAuthenticatedUser: B8200."
  - "user_api_key_auth_mcp.py, header and target parsing: B4654 owns _parse_mcp_server_names_from_path, the MCPRequestHandler header name constants, extract_target_server_names_from_path, _resolve_target_server_names, _get_mcp_auth_header_from_headers, _get_mcp_server_auth_headers_from_headers, _get_oauth2_headers_from_headers, get_mcp_client_side_auth_header_name, get_litellm_api_key_from_headers, _safe_get_headers_from_scope, _reject_duplicate_authorization, get_mcp_access_groups_from_headers and get_mcp_access_groups_from_scope."
  - "user_api_key_auth_mcp.py, admission fallbacks: B7490 owns _is_mcp_passthrough_cold_start, _is_legacy_delegate_cold_start, _has_client_supplied_mcp_auth, _gateway_dcr_challenge_target, _is_gateway_dcr_challenge_scope, _gateway_dcr_challenge, _admission_failure_fallback, DcrBridgeTarget, _target_servers_are_true_passthrough, _single_dcr_bridge_delegate_target and _dcr_bridge_invalid_token_challenge."
  - "user_api_key_auth_mcp.py, live credential checks: B4679 owns _is_litellm_auth_admission_error, _explicit_credential_matches_envelope, _is_mcp_admitted_user_subject, _is_gateway_admission_credential, _scrub_gateway_admission_credentials, _run_pre_db_read_auth_checks, _reload_admitted_key, _raise_503_if_db_unavailable, _reject_if_admitted_owner_scim_deactivated, _enforce_admitted_live_policy and _admitted_key_is_active."
  - "user_api_key_auth_mcp.py, request admission: B4673 owns process_mcp_request with its mock_body, _admit_dcr_bridge_delegate, _open_dcr_bridge_envelope, _admit_dcr_bridge_dual_credential, _admit_dcr_bridge_authorization, _admit_gateway_session, _reload_admitted_principal and reload_admitted_user."
  - "user_api_key_auth_mcp.py, server access and attribution: B4671 owns MCPServerAccess, get_allowed_mcp_servers, get_mcp_server_access, _admitted_subject_team_rpm_limits, _scoped_source_auth, admitted_subject_sources, _roster_team_object, admitted_source_grants, _toolset_scope, resolve_admitted_subject_servers, billing_auth_for_tool_call and attributing_source_for_server."
  - "user_api_key_auth_mcp.py, ceilings: B4670 owns _agent_capped_servers, _apply_primary_org_ceiling, _apply_agent_and_org_tool_ceilings, _get_allowed_mcp_servers_for_org, _get_allowed_mcp_servers_for_end_user, _get_allowed_mcp_servers_for_user, _apply_user_server_ceiling, apply_agent_caller_ceiling, _user_places_mcp_ceiling, admin_view_unscoped, _apply_user_tool_ceiling, apply_agent_caller_tool_ceiling, _apply_end_user_tool_ceiling, get_allowed_mcp_servers_for_agent, _get_agent_access_group_server_ceiling and get_agent_tool_permissions_for_server."
  - "user_api_key_auth_mcp.py, tool grants: B4672 owns _narrow_tools_to_toolset, resolve_admitted_subject_tools, get_allowed_tools_for_server, tool_is_granted, is_tool_allowed_for_server and is_tool_allowed, and notes that _as_list (a list copy) needs no Rust function."
  - "user_api_key_auth_mcp.py, object permissions: B4668 owns UnloadableEntitlementError, _get_key_object_permission, team_object_permission, key_object_permission_hydrated, _get_team_object_permission, _toolset_tool_permissions, _toolset_tools_for_server, _union_tool_grants, _key_object_permission_hydrated, _key_or_team_declares_toolsets, _load_named_object_permission, _get_org_object_permission, _get_end_user_object_permission, _get_user_object_permission, _user_object_permission_id, _agent_object_permission_id and _get_agent_object_permission."
