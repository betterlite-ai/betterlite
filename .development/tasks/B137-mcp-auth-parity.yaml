    why: process_mcp_request picks the admission arm from the explicit key, the bridge envelope and session prefixes, the pass-through targets and the oauth2 headers; the admission cases walk these arms.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L233-L361
    why: The gateway challenge target, its scope test, the challenge text and _admission_failure_fallback with its cold-start branches.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L929-L1038
