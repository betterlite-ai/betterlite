pitfalls:
  - "auth_type oauth2 without oauth2_flow stops LiteLLM at startup (\"auth_type oauth2 requires an explicit oauth2_flow\"), so the m2m server sets oauth2_flow client_credentials."
  - "dcr_bridge is accepted only with auth_type true_passthrough or oauth_delegate, and _single_dcr_bridge_delegate_target needs oauth_delegate, so the bridge server must be oauth_delegate for the bridge arms to run."
  - "OAuth servers without explicit endpoints trigger metadata discovery that reads the upstream script; give each one authorization_url and token_url, or token_exchange_endpoint, and check with --self-check that no discovery request eats an answer."
  - "The prefixes route to different arms: llm_session_ and llm_srefresh_ go to the session arm, llm_env_ and llm_refresh_ to the bridge arms; a forged value must start with the exact prefix of the arm it tests."
  - "x-litellm-api-key makes the explicit-key arm win over every other arm, so the bearer and bridge admission cases must not send it, while the outbound credential cases must."
  - "The opt-out literal is \"no-mcp-servers\"; it zeroes the key's servers even when its team grants some."
  - "invalid_client, unauthorized_client, unsupported_grant_type, invalid_target and invalid_scope from the exchange endpoint are gateway faults and never produce the challenge; claims is read only when it is a non-empty string."
  - "Without PROXY_BASE_URL each peer writes its own host and port into resource_metadata, and ignoring the header to hide that would hide the behavior under test."
  - "access_groups on a config server grant additively through mcp_access_groups even when the key's own mcp_servers list leaves the server out."
