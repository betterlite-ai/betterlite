id: B137
title: MCP auth, grants and outbound credential parity through the booted proxy
description: >-
  Finish the MCP auth umbrella with HTTP evidence, not new code. Its parts build MCP request admission (B4654, B4673,
  B4679, B7490), server and tool grants (B4668 to B4672), the outbound credential modes (B4661, B4664, B4665, B4667)
  and the gateway OAuth server (B4666, B4674, B4676). Each of them planned helper cases only, because no route reached
  its code yet, and left the HTTP cases to this umbrella. B8621 to B8623 now build the production ports and B8624,
  B8626, B8702 and B8728 mount the routes, but those mount tasks carry only their route tasks' cases and a few wiring
  cases. This task writes the missing HTTP oracle cases in tools/oracle/cases/http/mcp-auth-parity/ and adds no product
  code and no route. When a case shows betterlite differs from LiteLLM, report blocked and name the part that owns the
  behavior (the out_of_scope list below maps every function), since this task's scope holds no product code.


  Before writing a case, run it with `cargo run --locked -p betterlite-oracle -- --self-check
  tools/oracle/cases/http/mcp-auth-parity` so LiteLLM shows every upstream request it makes, and keep each upstream
  script strict: list exactly the answers LiteLLM consumes and nothing more.


  Shared setup. general_settings.master_key is oracle-master in every case. Set the env var PROXY_BASE_URL to
  https://gateway.example.test in every case that compares a WWW-Authenticate header, so the resource_metadata URLs
  name the same origin on both peers instead of each gateway's own port. The MCP request envelope is a POST with
  Content-Type application/json, Accept "application/json, text/event-stream", MCP-Protocol-Version 2025-03-26 and the
  body {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-03-26",
  "capabilities": {}, "clientInfo": {"name": "oracle-client", "version": "1"}}}, as B8728's transport cases send it.
  Servers go in the top-level mcp_servers map of config.yaml:

  alpha and beta are managed OpenAPI servers, so their tools register from a local spec at startup and listing them
  needs no MCP upstream: server_id test-alpha (test-beta), url "{{upstream}}", auth_type none, spec_path
  tools/oracle/cases/http/mcp-auth-parity/fixtures/openapi.json (repository-root-relative, so both gateways read the
  same file), and alpha also has access_groups [group-a]. The fixture is an OpenAPI 3.0.3 document with two POST
  operations, /echo (operationId echo) and /other (operationId other), each taking a JSON body {text: string}.

  bridge: server_id test-bridge, url "{{upstream}}/mcp", auth_type oauth_delegate, dcr_bridge true,
  authorization_url "{{upstream}}/authorize", token_url "{{upstream}}/token".
  pass: server_id test-pass, url "{{upstream}}/mcp", auth_type true_passthrough.
  obo: server_id test-obo, url "{{upstream}}/mcp", auth_type oauth2_token_exchange, token_exchange_endpoint
  "{{upstream}}/token", client_id obo-client, client_secret obo-secret, audience api://oracle-upstream.
  jag: server_id test-jag, url "{{upstream}}/mcp", auth_type oauth2_id_jag, token_exchange_endpoint
  "{{upstream}}/org-token", id_jag_resource_token_endpoint "{{upstream}}/resource-token", client_id jag-client,
  client_secret jag-secret.
  m2m: server_id test-m2m, url "{{upstream}}/mcp", auth_type oauth2, oauth2_flow client_credentials, client_id
  m2m-client, client_secret m2m-secret, token_url "{{upstream}}/token", scopes [tools.read].

  Each case configures only the servers it needs.


  Grant cases (B4668 to B4672, through B8626's /mcp-rest routes). These are `kind: http_scenario` cases with
  general_settings.database_url "{{postgres}}" and alpha and beta configured. Setup steps create the principals
  through the management routes with the master key and capture what the next step needs: POST /key/generate (capture
  /key as a secret), POST /team/new (capture /team_id), POST /user/new and POST /organization/new (capture
  /organization_id), each carrying an object_permission body. A setup step ignores only the fields each peer generates
  (the key, token hashes, ids, timestamps), one pointer per field with the reason that it is generated per peer, and
  still compares status. The last step sends the captured key as Authorization: Bearer.

  key-server-grant-list: a key with object_permission {mcp_servers: [test-alpha]} lists GET /mcp-rest/tools/list and
  sees only alpha's tools. key-server-grant-call-denied: the same key sends POST /mcp-rest/tools/call {server_id:
  test-beta, name: echo, arguments: {text: hi}} and gets LiteLLM's 403 access_denied before any upstream request.
  key-no-mcp-servers: mcp_servers ["no-mcp-servers"] lists nothing. key-tool-permission-list: object_permission
  {mcp_tool_permissions: {test-alpha: [echo]}} lists alpha's echo and not alpha's other. key-tool-permission-call-denied:
  that key calls other on test-alpha and gets the 403 tool denial, with no upstream request. team-grant-inherited: a
  team with mcp_servers [test-beta] and a key in it with no permission of its own sees beta only. team-key-intersection:
  the same team and a key with mcp_servers [test-alpha, test-beta] sees beta only. require-key-access-defined: as
  team-grant-inherited with general_settings.require_key_mcp_access_defined true, so the key sees nothing.
  access-group-grant: a key with mcp_servers [test-beta] and mcp_access_groups [group-a] sees both, since access group
  grants add on top. user-ceiling: POST /user/new for user mcp-user with mcp_servers [test-alpha], then a key for
  mcp-user with mcp_servers [test-alpha, test-beta] sees alpha only. org-ceiling: an organization with mcp_servers
  [test-alpha], a team in it, and a key in that team with mcp_servers [test-alpha, test-beta] sees alpha only.


  Admission cases (B4654, B4673, B4679, B7490, through B8728's /mcp routes). `kind: http`, no database, upstream []
  unless a case says otherwise. session-bearer-forged: POST /mcp/ with Authorization: Bearer llm_session_forged answers
  the gateway's 401 authentication_required with WWW-Authenticate carrying error="invalid_token" and the aggregate
  resource_metadata. bad-bearer-aggregate: Authorization: Bearer sk-not-a-key on POST /mcp/ falls back to the same
  invalid_token challenge. explicit-key-wrong: x-litellm-api-key: sk-not-a-key on POST /mcp/ answers the key auth's own
  401 with no challenge. bridge-cold-start: POST /mcp/bridge with no credential is admitted anonymously and then gets
  the per-server resource_metadata challenge. bridge-forged-envelope: Authorization: Bearer llm_env_forged on POST
  /mcp/bridge fails envelope admission with the same 401 and per-server invalid_token challenge as bridge-bad-bearer. bridge-bad-bearer: Authorization: Bearer
  sk-not-a-key on POST /mcp/bridge answers 401 "Invalid or expired credential" with the per-server invalid_token
  challenge. passthrough-header-cold-start: POST /mcp/ with x-mcp-servers: pass and no credential is admitted as a
  pass-through cold start, the gateway probes the upstream, and the upstream script answers that probe 401 with
  WWW-Authenticate 'Bearer resource_metadata="https://upstream.example.test/.well-known/oauth-protected-resource/mcp"',
  which the client must receive unchanged.


  Outbound credential cases (B4661, B4664, B4665, B4667, through B8728 and B8626). `kind: http`, no database. Every
  request carries x-litellm-api-key: oracle-master. token-exchange-no-subject: POST /mcp/obo with no Authorization gets
  the RFC 9728 challenge with error="invalid_token" before any upstream request. token-exchange-idp-rejects: the same
  with Authorization: Bearer subject-token-1, and the upstream answers the exchange POST to /token with 400 {"error":
  "invalid_grant"}: the client gets the invalid_token challenge, and the case compares the recorded exchange request.
  token-exchange-step-up: the upstream answers 400 {"error": "interaction_required", "claims":
  "{\"access_token\":{\"acrs\":{\"essential\":true,\"value\":\"c1\"}}}"} and the challenge carries
  error="insufficient_claims" and the claims base64-encoded. token-exchange-gateway-fault: the upstream answers 400
  {"error": "invalid_client"}, a gateway fault and not a subject rejection, so the answer is the mapped error status
  and not the challenge. id-jag-no-assertion: POST /mcp/jag with no Authorization and no database has no stored SSO
  assertion to exchange, so the pre-flight answers the status raise_public maps the resolver's error to.
  client-credentials-token-rejected: GET /mcp-rest/tools/list?server_id=test-m2m with Authorization: Bearer
  oracle-master, the upstream answering the token POST 401 {"error": "invalid_client"}; compare the answer and the
  recorded client_credentials token request (its form and authorization header).


  Gateway OAuth cases (B4666, B4674, B4676, through B8624's and B8702's routes). No database.
  gateway-dcr-refresh-forged is a `kind: http_scenario`: POST /register with {client_name: oracle-cli, redirect_uris:
  ["http://127.0.0.1:33418/callback"], grant_types: [authorization_code, refresh_token], token_endpoint_auth_method:
  none} registers an aggregate client (capture /client_id, ignore the sealed /client_id and /client_id_issued_at with
  that reason), then POST /token as a form (body_kind bytes, Content-Type application/x-www-form-urlencoded) with
  grant_type=refresh_token, the captured client_id and refresh_token=llm_srefresh_forged answers invalid_grant.
  gateway-dcr-code-forged: the same registration, then grant_type=authorization_code with code=forged-code,
  redirect_uri=http://127.0.0.1:33418/callback and code_verifier=oracle-verifier-0123456789012345678901234567890 answers
  invalid_grant. bridge-refresh-envelope-forged is a `kind: http`: POST /bridge/token as a form with
  grant_type=refresh_token, client_id=bridge and refresh_token=llm_refresh_forged, compared as LiteLLM answers it.


  Every comparison checks status, content-type and any WWW-Authenticate header. Keep error, error_description, type,
  param and code where the surface gives them; ignore only wording at its exact pointer, with the repository's wording
  reason, and never a WWW-Authenticate value. Add one corpus seed per case kind: an mcp-auth-parity-* file in
  tools/oracle/fuzz/corpus/http_case for a `kind: http` case and one in tools/oracle/fuzz/corpus/http_scenarios for a
  scenario, so the existing decoders replay them.
scope:
  paths:
    - tools/oracle/cases/http/mcp-auth-parity/**
    - tools/oracle/fuzz/corpus/http_case/mcp-auth-parity-*
    - tools/oracle/fuzz/corpus/http_scenarios/mcp-auth-parity-*
  lint_tables: false
references:
