  - url: https://docs.litellm.ai/docs/mcp
    why: How operators configure MCP servers, auth types and key, team and access group permissions.
dod:
  - text: Key, team, access group, user and organization grants decide which servers and tools a key lists and calls through /mcp-rest, as in LiteLLM.
    proof: [case-files, oracle]
  - text: Forged session, envelope and key credentials, bridge and pass-through cold starts get LiteLLM's status and WWW-Authenticate challenge on /mcp.
    proof: [case-files, oracle]
  - text: Token exchange, ID-JAG and client_credentials servers send LiteLLM's token requests and map each failure to LiteLLM's challenge or status.
    proof: [case-files, oracle]
  - text: Aggregate DCR registration and forged refresh, code and bridge refresh grants answer as LiteLLM does.
    proof: [case-files, oracle]
  - text: The new transcripts parse through the existing HTTP case and scenario decoders.
    proof: [http-corpus, scenario-corpus]
checks:
  optional: []
  commands:
    - id: case-files
      why: No newly added MCP auth case exists or the shared OpenAPI fixture is missing.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/mcp-auth-parity)" && test -f tools/oracle/cases/http/mcp-auth-parity/fixtures/openapi.json
    - id: http-corpus
      why: The single-request cases never reach the HTTP case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/http_case/mcp-auth-parity-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
    - id: scenario-corpus
      why: The scenario cases never reach the scenario parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/http_scenarios/mcp-auth-parity-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^http_scenarios::tests::replays_corpus$/)'
