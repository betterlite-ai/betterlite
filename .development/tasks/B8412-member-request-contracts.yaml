id: B8412
title: Team and organization member request contracts
description: >-
  Build the team and organization request records from litellm/proxy/_types.py that the team delete, team callback, team member, organization member and organization update routes decode, with their pydantic validators. B1231 builds the main team create and update contracts and leaves these out; no route task declares them. Nothing here touches the database.

  Module `member_request_contracts` in betterlite-server (crates/betterlite-server/src/member_request_contracts.rs, submodules team.rs, callbacks.rs, members.rs and organization.rs under crates/betterlite-server/src/member_request_contracts/, each with its tests). Each record has `from_value(value: &serde_json::Value) -> Result<Self, MemberContractError>`: before-validators run on the raw JSON object, then the fields decode, then after-validators run. `MemberContractError` (thiserror) has `Validation { message: String }` for a validator's text and `Decode { source: serde_json::Error }`; both are a 422 at the route. Unknown keys are ignored unless a record says otherwise.

  team.rs. `DeleteTeamRequest { team_ids: Vec<String> }` requires team_ids; its field validator distinct_team_ids keeps the first occurrence of each id and drops later repeats, in input order (Python's dict.fromkeys), so a repeated id is deleted and audited once.

  callbacks.rs. `AddTeamCallback { callback_name: String, callback_type: Option<CallbackType>, callback_vars: BTreeMap<String, String> }`, where CallbackType is success, failure or success_and_failure and defaults to success_and_failure (an explicit null stays null); callback_vars is required. Before-validator validate_callback_vars walks the raw callback_vars object in order: a key that is not a StandardCallbackDynamicParams name fails with "Invalid callback variable: {key}. Must be one of {valid_keys}"; each value is turned into its string form (a JSON string as is, a number as its decimal text); then the env-reference check runs with source "key/team callback metadata", the langfuse_environment value check runs for key langfuse_environment and the span-scope check for langfuse_span_scope. Use B188's code in betterlite-logging (crates/betterlite-logging/src/logging_privacy/callbacks.rs: the SUPPORTED name list, validate_environment and SpanScope) for the name list and the two langfuse checks; do not copy them. B188 has no public env-reference check, see the pitfalls. `TeamCallbackMetadata { success_callback, failure_callback, callbacks: Option<Vec<String>>, callback_vars: Option<BTreeMap<String, String>> }` with defaults [], [], [] and {}. Its before-validator drops each of those four keys whose value is null; then, when every value left in the object is null (an object with no keys left counts), the result is the four defaults; otherwise, when callback_vars is present, every key of it must be a StandardCallbackDynamicParams name, with the same error text as above. Values are not checked here.

  members.rs. `OrgMember` flattens B859's MemberBase (user_id, user_email in crates/betterlite-db/src/team_rows/member.rs) and requires role, one of org_admin, internal_user and internal_user_viewer (B2314's UserRole). `MemberAddRequest { member: OneOrMany<Member> }` with B859's Member: a list of objects becomes a list of Member, a single object becomes one Member; a Member error is reported as a validation error of the whole request. `TeamMemberAddRequest` adds team_id (required), max_budget_in_team, budget_duration and allowed_models (default None). `OrgMemberAddRequest { member: OneOrMany<OrgMember> }`, and `OrganizationMemberAddRequest` adds organization_id (required) and max_budget_in_organization (default None). `TeamMemberDeleteRequest` and `OrganizationMemberDeleteRequest` reuse B2363's member identity check (Either user id or user email must be provided) and add team_id or organization_id, required. `TeamMemberUpdateRequest` extends TeamMemberDeleteRequest with max_budget_in_team, role (admin or user), tpm_limit, rpm_limit, budget_duration, allowed_models, temp_budget_increase (at least 0 and finite) and temp_budget_expiry (a datetime), all default None. After-validator validate_temp_budget: when exactly one of temp_budget_increase and temp_budget_expiry is set, fail with "temp_budget_increase and temp_budget_expiry must be set together". `OrganizationMemberUpdateRequest` extends OrganizationMemberDeleteRequest with max_budget_in_organization and role (any UserRole or null); field validator validate_role fails a role outside ROLES_WITHIN_ORG with "Invalid role. Must be one of: ['org_admin', 'internal_user', 'internal_user_viewer']". Export `ROLES_WITHIN_ORG` (org_admin, internal_user, internal_user_viewer, in that order).

  organization.rs. Export `MANAGEMENT_METADATA_FIELDS`, the 19 names of LiteLLM_ManagementEndpoint_MetadataFields (L5069-L5089) in order. `OrganizationTableUpdate` flattens B2310's LiteLLMBudgetTable and adds organization_id, organization_alias, budget_id, spend, metadata, models, updated_by, object_permission (B770's LiteLLM_ObjectPermissionBase), model_tpm_limit and model_rpm_limit, all default None. Before-validator set_model_info: for each metadata field name in order whose raw value is present and not null, create metadata as {} when it is missing or null, set metadata[name] to the value and remove the name from the top level. `OrganizationUpdateRequestV2` forbids unknown keys (a 422), has organization_alias, models, metadata, tpm_limit, rpm_limit, max_budget, soft_budget, max_parallel_requests, model_max_budget, budget_duration and object_permission, all default None, and records which keys were present (`fields_set() -> &BTreeSet<String>`), because B2342 writes only present keys. `OrganizationTableWithMembers` flattens the OrganizationTable row in crates/betterlite-db/src/resource_rows/organization.rs and adds members (B2310's OrganizationMembership rows, default []), teams (B859's LiteLLMTeamTable rows, default []), litellm_budget_table (default None), created_at and updated_at (required).

  Fuzz target `member_request_contracts` in crates/betterlite-server/fuzz: parse the input bytes as JSON and run every from_value on it; none may panic. Replay its corpus in the test `replays_the_member_request_contracts_corpus`.
scope:
  paths:
    - crates/betterlite-server/src/member_request_contracts.rs
    - crates/betterlite-server/src/member_request_contracts/**
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/member_request_contracts.rs
    - crates/betterlite-server/fuzz/corpus/member_request_contracts/**
    - tools/oracle/cases/helpers/member-request-contracts/**
    - tools/oracle/helpers/b8412.py
    - tools/oracle/helpers/b8412/**
    - tools/oracle/src/helpers/server/b8412.rs
    - tools/oracle/src/helpers/server/b8412/**
  lint_tables: false
references:
