    why: DeleteTeamRequest and distinct_team_ids.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2333-L2402
    why: AddTeamCallback and TeamCallbackMetadata with both validate_callback_vars validators.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/initialize_dynamic_callback_params.py#L58-L90
    why: The env-reference and langfuse value checks the callback validator calls; B188 owns them.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2148-L2153
