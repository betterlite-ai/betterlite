  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L4606-L4646
    why: MemberAddRequest and OrgMemberAddRequest with their member conversion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L4678-L4796
    why: Team and organization member add, delete and update requests, validate_temp_budget, ROLES_WITHIN_ORG and validate_role.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L3607-L3672
    why: LiteLLM_OrganizationTableUpdate and set_model_info, OrganizationUpdateRequestV2 and LiteLLM_OrganizationTableWithMembers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L5069-L5089
    why: The metadata field names moved into metadata.
dod:
  - text: DeleteTeamRequest keeps the first occurrence of each team id in input order.
    proof: [team-tests, oracle, helper-python]
  - text: AddTeamCallback rejects an unknown callback variable, turns values into strings and runs the env-reference and langfuse checks; TeamCallbackMetadata drops null keys, gives the four defaults when nothing else is set and checks only variable names.
    proof: [callback-tests, oracle, helper-python]
  - text: Member add requests take one member or a list, and the org member role accepts only the three org roles.
    proof: [member-tests, oracle, helper-python]
  - text: A team member update with only one of temp_budget_increase and temp_budget_expiry fails, and an organization member update with a role outside the org roles fails, both with LiteLLM's message.
    proof: [member-tests, oracle, helper-python]
  - text: The organization update moves every set metadata field name into metadata, the v2 patch forbids unknown keys and records present keys, and the with-members record keeps its defaults.
    proof: [organization-tests, oracle, helper-python]
  - text: Newly added corpus inputs replay through every decoder without a panic.
    proof: [member-corpus]
checks:
  optional: [mutants]
  commands:
    - id: team-tests
      why: the team delete request deduplication is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^member_request_contracts::team::/)'
    - id: callback-tests
      why: the team callback request or metadata validators are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^member_request_contracts::callbacks::/)'
    - id: member-tests
      why: the member add, delete or update requests or their validators are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^member_request_contracts::members::/)'
    - id: organization-tests
      why: the organization update records or the metadata field move are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^member_request_contracts::organization::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b8412)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b8412 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b8412/pyrightconfig.json
    - id: member-corpus
      why: the member contracts fuzz target or its fresh replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/member_request_contracts.rs &&
        grep -q 'name = "member_request_contracts"' crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/member_request_contracts)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_member_request_contracts_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/member-request-contracts/delete-team-duplicates.yaml
  - tools/oracle/cases/helpers/member-request-contracts/callback-invalid-variable.yaml
  - tools/oracle/cases/helpers/member-request-contracts/callback-metadata-nulls.yaml
  - tools/oracle/cases/helpers/member-request-contracts/member-add-one-or-many.yaml
  - tools/oracle/cases/helpers/member-request-contracts/temp-budget-pair.yaml
  - tools/oracle/cases/helpers/member-request-contracts/org-member-role.yaml
  - tools/oracle/cases/helpers/member-request-contracts/organization-metadata-move.yaml
  - tools/oracle/cases/helpers/member-request-contracts/organization-v2-unknown-key.yaml
deviations:
  - what: The invalid callback variable message lists the valid names sorted, where LiteLLM prints a Python set whose order changes between processes.
    why: The set order is not stable even in LiteLLM; oracle cases compare the status and the text up to "Must be one of".
  - what: A failing record returns a typed MemberContractError with the validator's text; the pydantic error list is not rebuilt.
    why: The routes own the 422 body; the status and the message a user reads stay LiteLLM's.
out_of_scope:
  - "Member, MemberBase and LiteLLMTeamTable: B859. LiteLLMBudgetTable and OrganizationMembership: B2310. The member identity check: B2363. LiteLLM_ObjectPermissionBase: B770. UserRole: B2314. The callback name list and value checks: B188."
  - "Team create, update and patch contracts and the bulk member records: B1231."
  - "The routes that decode these records: B811, B057, B1210, B807, B808, B828, B827 and B2342."
  - "NewProjectRequest.set_model_info and UpdateProjectRequest.set_model_info (L3694-L3761): the project routes ship only in litellm-enterprise, and open-source LiteLLM never builds these requests."
pitfalls:
  - 'TeamCallbackMetadata tests all() over the values left after dropping nulls, so {} and {"callbacks": null} both give the four defaults, while {"other": 1} does not.'
  - AddTeamCallback reads callback_vars with a default of {}, so a body without callback_vars passes the validator and then fails as a missing required field.
  - OrgMemberAddRequest converts a list only when every item is an object; a mixed list is decoded as it is and fails on the non-object item.
  - validate_temp_budget is an after-validator, so a negative temp_budget_increase fails its ge=0 bound before the pairing rule runs.
  - set_model_info moves a metadata field into metadata only when its value is not null, and it overwrites a key of the same name that the caller already put in metadata.
  - "B188 is merged and its env-reference check (contains_environment_reference in logging_privacy/callbacks.rs) is private. Its public callback_metadata skips that check for destination fields such as langfuse_host and returns B188's own error text, so do not call it here: test the string form with value.contains(\"os.environ/\") and fail with LiteLLM's _raise_env_reference_error message for that param and source."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
