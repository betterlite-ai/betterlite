id: B087
title: File deletion and file route composition
description: >-
  Implement whole delete_file in betterlite-server::api::managed_file_routes with typed lifecycle
  policy in betterlite-core::api::managed_file_routes. Register DELETE /files/{file_id:path},
  /v1/files/{file_id:path} and /{provider}/v1/files/{file_id:path}. Compose B1032's upload,
  B1033's content and B1034's metadata/list factories exactly once; those parts remain the sole
  owners of their routes. Route ordering must keep the content suffix ahead of generic catch-all ids.

  Preserve MIT behavior without the managed_files hook. Requirements run before raw-cloud role
  checking; provider hints precede common pre-call logic and an additional B1103 authenticated-data
  preparation. Then B1020 model routing precedes legacy managed-ID handling, with B1028 executing
  deletes. No managed repository, ownership filter or storage backend is called on this reachable
  path. Successful model-routed delete returns the provider's id without re-encoding it.

  Add B900 HTTP scenarios with mock provider, master key sk-test and B1139 ordinary/admin keys.
  The family integration case uploads, retrieves, downloads, lists and deletes a native file through
  the composed routes, checking actual upstream effects. Native tests are in
  api::managed_file_routes::tests in server/core; no helper oracle or new decoder. Complete handler
  plus decorators has 191 nonblank/non-comment lines. Budget 190 implementation, 145 tests,
  195 cases and 40 composition/wiring lines, totaling 570.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/api/managed_file_routes.rs
  - crates/betterlite-server/src/api/managed_file_routes/**
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/managed_file_routes.rs
  - crates/betterlite-core/src/api/managed_file_routes/**
  - tools/oracle/cases/api/managed-file-routes/**
  - tools/oracle/fixtures/http-scenarios/managed-file-routes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L1434-L1649
  why: Delete aliases, raw cloud admin gate, credential routing and source error mapping.
dod:
- text: >-
    delete_aliases_and_family sends DELETE /files/f,/v1/files/f,/openai/v1/files/f: each gets
    200,{id:f,object:file,deleted:true} from one provider DELETE. A composed upload/read/content/list/
    delete sequence reaches each child factory once without duplicate registration or content being
    interpreted as part of a metadata id. The provider receives slash-bearing ids through its path
    encoder. Missing/invalid auth gives 401/auth_error/param="None"/code="401", the B756 message,
    and no common hook or upstream deletion with the fixed master key configured.
  proof: [delete-tests, oracle, new-cases]
- text: >-
    cloud_delete_role_gate sends s3://bucket/key or gs://bucket/key with an ordinary key or
    proxy_admin_viewer: 403/permission_error/null/"403",message="Raw cloud storage file ids can
    only be deleted by a proxy admin key. Use the LiteLLM managed file id returned when the file
    was created." proxy_admin passes this gate and dispatches through its selected provider,
    retaining B2208/B1028's provider-side storage authorization; it does not bypass those checks.
    The gate runs before provider hints/common pre-call. Match only B2208's exact URI prefixes,
    without normalizing arbitrary strings into newly blocked cloud ids.
  proof: [delete-tests, oracle, new-cases]
- text: >-
    delete_managed_gate sends an unrouted legacy unified id with require_managed_files=false:
    500/internal_server_error/null/"500",message="Managed files hook not found", no DB read/write
    and no provider request. require_managed_files=true produces "Managed resource ownership
    validation is unavailable." at 500 for that id; a raw f or raw cloud id gets B1021's required
    managed-file 400/invalid_request_error/null/"400" before the cloud role gate. Explicit model
    routing is attempted before legacy detection when the requirement is disabled.
  proof: [delete-tests, oracle, new-cases]
- text: >-
    delete_credential_routing proves truthy path>custom-llm-provider header>custom_llm_provider
    query>body>openai with empty fallthrough. Encoded model m authorizes and overrides those hints;
    credentials carry the internal snapshot, decoded file id goes upstream, and result id stays f,
    not the caller's encoded id. Unknown/forbidden model errors come from B1020 before deletion.
    Unrouted requests remove file_id from data, apply team-provider credentials then supply file_id
    once. Common processing uses route_type=afile_delete and B1103 preparation follows it again.
  proof: [delete-tests, oracle, new-cases]
- text: >-
    delete_status_headers_and_failures gets provider deleted=false as a successful 200, preserving
    that boolean; no extra delete or cleanup occurs. Enqueue success using litellm_call_id default
    "", then B004 headers from hidden model_id/cache_key/api_base or "", version and allowed_model_region.
    No post-call success hook runs. Hidden d/c/https://mock.test/v1?secret=x yields x-litellm-model-id=d,
    x-litellm-cache-key=c,x-litellm-model-api-base=https://mock.test/v1; absent values omit these headers.
    Upstream 404 type=invalid_request_error,param=file_id,message=missing maps to 404 with code="404";
    HTTPException403 maps permission_error, absent status defaults 500/internal_server_error, and
    missing or literal "None" param normalizes to null. Failure hook runs before EXCEPTION
    "litellm.proxy.proxy_server.delete_file(): Exception occured - <error>". Model success logs DEBUG
    "Deleted file using model: m" plus ", original_id: f" when original id is truthy.
  proof: [delete-tests, oracle, new-cases]
checks:
  optional: []
  commands:
  - id: delete-tests
    why: composed routes, credential deletion or cloud role enforcement is absent
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::managed_file_routes::tests::/) - test(/replays_/)'
  - id: new-cases
    why: delete aliases and family composition have no new HTTP fixtures
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/managed-file-routes)"
oracle_cases:
- tools/oracle/cases/api/managed-file-routes/delete-aliases-and-family.yaml
- tools/oracle/cases/api/managed-file-routes/cloud-delete-role-gate.yaml
- tools/oracle/cases/api/managed-file-routes/delete-managed-gate.yaml
- tools/oracle/cases/api/managed-file-routes/delete-credential-routing.yaml
- tools/oracle/cases/api/managed-file-routes/delete-status-headers-and-failures.yaml
deviations:
- what: Legacy managed deletion without model routing returns 500 internal_server_error/code="500", message="Managed files hook not found", and leaves stored rows/content untouched.
  why: Max's managed files and batches decision is open; preserve the absent-hook MIT behavior without importing enterprise code or imposing a license check.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L1561-L1569
out_of_scope:
- B1031 owns upload helpers, B1032 upload registration, B1033 content registration/pump and B1034 get/list registration/page projection. This task only composes those factories.
- The managed continuation L1570-L1593 has no reachable MIT caller. Router/type checks and managed_files.afile_delete are not replaced with a fabricated hook, repository cleanup or B1018 owner policy.
- B1020/B1021/B1019 own credential/requirement/ID rules, B2208 cloud classification, B003/B004 error/custom-header policy, B124 proxy callbacks and B1103 authenticated data preparation.
pitfalls:
- A proxy_admin_viewer is not permitted by the raw-cloud deletion check.
- Delete does not restore a model-embedded id into the returned FileDeleted object.
- Native provider deletion succeeds without any managed metadata transaction.
review_level: security
budget:
  max_changed_lines: 570
  max_new_expects: 0
