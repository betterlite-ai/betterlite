id: B087
title: Managed file routes
description: >-
  Finish file delete routes and managed-file lifecycle integration over provider/storage deletion and authorized
  metadata cleanup. Export the managed-file/credential services used directly by batches, fine-tuning, assistants
  and vector stores; do not add a second resource owner policy.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Reuse B2208 cloud-storage URI/credential authorization directly where the owned native storage path calls cloud_storage_security;
  B1021 supplies the trusted deployment snapshot.


  Implement crates/betterlite-server/src/api/managed_file_routes.rs, crates/betterlite-core/src/api/managed_file_routes.rs.
  Use ManagedFileRoutesInput and ManagedFileRoutesResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: DELETE /{provider}/v1/files/{file_id:path}; DELETE /v1/files/{file_id:path};
  DELETE /files/{file_id:path}. Each alias is exercised through the booted proxy. Every route factory is mounted
  once; a family composer mounts its child factories without re-registering their methods/paths.


  Route input projections: data.file_id (absent None); data.litellm_call_id (absent '').


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): files_endpoints.py:1488 status_code=403, exception_detail=FastAPI detail string; files_endpoints.py:1636
  type=openai_error_type(e, error_status_code(e, status.HTTP_400_BAD_REQUEST)), param=openai_error_param(e), code=error_status_code(e,
  status.HTTP_400_BAD_REQUEST); files_endpoints.py:1644 type=openai_error_type(e, error_status_code(e, 500)), param=openai_error_param(e),
  code=error_status_code(e, 500); files_endpoints.py:1564 type=ProxyErrorTypes.internal_server_error.value, param=None,
  code=500; files_endpoints.py:1571 type=ProxyErrorTypes.internal_server_error.value, param=None, code=500; files_endpoints.py:1578
  type=ProxyErrorTypes.internal_server_error.value, param=None, code=500. Compare the actual source status, error
  type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions managed_file_no_hook_500, native_file_delete, raw_cloud_admin_dispatch,
  raw_cloud_nonadmin_403, native_provider_delete_error, route_aliases, auth_missing, auth_invalid under api::managed_file_routes::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/openai_files_endpoints/files_endpoints.py: delete_file (L1449-L1649). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 180 owned nonblank/non-comment/non-docstring Python lines (191 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 200 implementation,
  88 behavior tests, 96 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 422 total within the 430-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1017 (Managed resource access), B1018
  (MIT resource owner compatibility), B1020 (File credentials), B1027 (File storage service), B1028 (File provider
  write), B1032 (File upload route), B1033 (File content route), B1034 (File read route), B1087 (Api boundaries),
  B1103 (Authenticated request preparation), B732 (Typed authentication principals and grant resolution), B855 (Authenticated
  request admission and budget handoff), B756 (Authentication header selection and mode dispatch), B1021 (File upload
  options), B1019 (File routing ids), B003 (HTTP server, health routes and master key auth), B1139 (Stateful HTTP
  oracle scenarios), B856 (Management oracle namespaces and Postgres test fixture). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For a unified managed ID that does not take the earlier model-encoded route, absent managed_files returns 500
  internal_server_error, param null, code 500. Raw cloud URI deletion is 403 for a non-PROXY_ADMIN caller; admin
  only bypasses that URI guard and proceeds through the native dispatch branch. No cross-owner managed-hook denial
  or multi-provider managed deletion is available in OSS. Model-embedded native IDs and configured team credentials
  remain functional.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
