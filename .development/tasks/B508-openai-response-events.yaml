id: B508
title: OpenAI Responses replies and event decoding
description: >-
  Add ResponsesReply and a closed known-event enum with a named bounded extension payload for GenericEvent. Reuse
  SSE framing and retain completed/incomplete/failed terminal replies, including reverse terminal selection, created_at
  conversion and response-header processing. Preserve the typed lax-validation outcome with a diagnostic when Python
  model_construct is used. Native websocket support and fake-stream capability are metadata for endpoint orchestration,
  not a websocket server.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/responses/transformation.py:
  OpenAIResponsesAPIConfig.transform_response_api_response L558-L587; OpenAIResponsesAPIConfig.validate_environment
  L589-L602; OpenAIResponsesAPIConfig.get_complete_url L604-L623; OpenAIResponsesAPIConfig.transform_streaming_response
  L625-L656; OpenAIResponsesAPIConfig.parse_terminal_event_from_stream_chunks L659-L666; OpenAIResponsesAPIConfig.parse_terminal_response_from_stream_chunks
  L669-L671; OpenAIResponsesAPIConfig.get_event_model_class L674-L730; OpenAIResponsesAPIConfig.should_fake_stream
  L732-L752; OpenAIResponsesAPIConfig.supports_native_websocket L754-L756.


  Named case contracts: created_at_conversion: Create replies use B004 created conversion: None or unconvertible
  values use the injected current integer time, numbers truncate toward zero and numeric strings convert through
  the source numeric semantics. Missing created_at or malformed JSON raises OpenAIError with raw status/body diagnostic.
  lax_response_validation: ValidationError logs debug and returns model_construct preserving fields; record raw
  headers in hidden_params.headers and B206 processed headers in hidden_params.additional_headers. missing_error_code:
  A dictionary error with missing or None code is copied and assigned unknown_error before event validation; non-None
  codes and nondictionary errors survive unchanged. unknown_generic_event: Unknown types, response.reasoning_summary_*
  and response.custom_tool_call_input.* events use GenericEvent preserving payload; response.shell_call.in_progress,
  response.shell_call.completed and response.shell_call_output.done explicitly do likewise. last_terminal_wins:
  Scan chunks in reverse and try completed, incomplete, failed validators; strip only an exact leading data: plus
  space, skip ValueError and return the last valid terminal event or its response. non_native_streaming_model: Fake
  streaming only when stream is exactly true, model is not None and supports_native_streaming returns exactly false;
  catalog lookup exceptions log debug and return false. supports_native_websocket is always true. known_event_variants:
  Use typed B1113 records for response.created/in_progress/completed/failed/incomplete; response.output_item.added/done;
  response.content_part.added/done; response.output_text.delta/done and response.output_text.annotation.added; response.refusal.delta/done;
  response.function_call_arguments.delta/done; response.file_search_call.in_progress/searching/completed; response.web_search_call.in_progress/searching/completed;
  response.mcp_list_tools.in_progress/completed/failed; response.mcp_call.in_progress/completed/failed and response.mcp_call_arguments.delta/done;
  image_generation.partial_image; and error. Invalid typed payloads log debug then use lax construction. responses_auth_headers:
  Resolve litellm_params.api_key, litellm.api_key, litellm.openai_key, OPENAI_API_KEY; setdefault Content-Type to
  application/json and overwrite Authorization with Bearer {key}, including None. Only OPENAI may replace it with
  B501 workload-identity token, using litellm_params.api_base. responses_base_url: Resolve api_base, litellm.api_base,
  OPENAI_BASE_URL, OPENAI_API_BASE, https://api.openai.com/v1, trim trailing slashes and append /responses literally,
  even if an existing endpoint/query is present.


  Write standalone Rust test openai_response_events_credential_identity_isolation in betterlite-openai: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test openai_response_events_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-openai/src/response_events.rs with adjacent tests under response_events/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_response_events in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function response_events_cases in betterlite-openai with these exact named cases (one per oracle
  file): created_at_conversion, lax_response_validation, missing_error_code, unknown_generic_event, completed_incomplete_failed,
  last_terminal_wins, no_terminal_event, non_native_streaming_model, known_event_variants, responses_auth_headers,
  responses_base_url. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_response_events* using HelperCase: kind:
  helper and the externally tagged openai_response_events variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_response_events that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_response_event consumes Responses SSE data bytes after B005 framing in crates/betterlite-openai/src/response_events.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_response_events.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_response_events.
  The adjacent test replays_the_openai_response_events_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 174 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 220 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 670 planned, 675 maximum changed lines.
