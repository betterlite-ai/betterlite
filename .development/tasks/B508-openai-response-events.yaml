  commands:
  - id: case-created-at-conversion
    why: The created-at-conversion behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_events_cases::case_[0-9]+_created_at_conversion$/)'
  - id: case-lax-response-validation
    why: The lax-response-validation behavior is missing or differs from its pinned fixture.
