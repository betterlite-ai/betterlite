pitfalls:
- 'The oracle helper for this task is pre-registered as openai_response_events in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/response_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_response_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The event mapping omits reasoning-summary and custom-tool-input enums despite their presence in ResponsesAPIStreamEvents;
  they intentionally reach GenericEvent.
- Terminal parsing is strict and can ignore a malformed terminal event that transform_streaming_response would retain
  through lax construction.
- The Content-Type default checks exactly that casing, unlike the chat header helper that checks two spellings.
