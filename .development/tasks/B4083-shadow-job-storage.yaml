id: B4083
title: Load shadow jobs and persist attempts and funnel counters
description: >-
  Build job admission and attempt recording for shadow evaluations, with pod-local funnel
  tracking. Shadow jobs are configuration rows that define which requests to sample, which
  routers to compare, and spending/turn limits. The sampling hook loads active jobs through
  a short-TTL cache so configuration changes take effect within one cache interval, queries
  the database to build attempt statistics per job, and records verdicts and errors to the
  attempt table. A pod-local counter batches sampling-outcome increments (not sampled,
  unjudgeable, shed, withheld) and flushes them to the database on a timer, so job results
  state what share of eligible traffic they represent.

  Build betterlite-server with the job admission and loading logic, injecting the database
  client and cache primitives the proxy supplies. Own the job data type, validation, and
  the in-memory cache wrapper that reads active jobs grouped by target. Record attempt rows
  with verdict and error shapes matching what the evaluation pipeline calls with (real/shadow/tie,
  confidence as Decimal, costs as Decimal). The cache starts empty, holds four jobs, and
  refreshes every ten seconds. Cache failures return empty without storing, so a DB blip
  pauses sampling for one request and retries on the next. Validation rejects unknown
  directions and reverse jobs without a baseline model, failing attempts closed.

  Build crates/betterlite-db with shadow table queries: find_many active jobs by unstopped
  status and future end time, and group_by to count attempts and sum costs per job. Build
  one shadow evaluation schema migration if needed and own the three tables LiteLLM defines
  (litellm_shadowevaljob, litellm_shadowevalattempt, litellm_shadowevalfunnel).

  Pod-local funnel counters are a simple dictionary cleared before each database flush. The
  flush snapshots the dictionary, clears it, then upserts each job's counters atomically,
  dropping the batch on any failure (a repeated increment is worse than an undercount).
  Flush errors are logged at error level and swallowed so the counter queue never blocks.
  The queue supplies only this task's record calls; the spend update job calls the flush
  and the pending-events check.

  Job rows carry team-aware and model-group-scoped targeting (key, team, or user). Reverse
  jobs have exactly one router in their scope, and forward jobs skip traffic any candidate
  router served. Team-scoped targeting supports JWT-authenticated traffic without keys.
  Load all active jobs in one read, validate each with Pydantic to reject invalid rows,
  group by target key, and cache the grouped result. Attempt insertion names every cost
  type the eval pipeline bills (call costs, classifier costs, judge costs).
