deviations:
  - what: Cache failures return empty rather than retrying immediately, so sampling pauses for one request while the next request fills the cache.
    why: Keep the sampling loop lock-free and avoid blocking on transient DB issues; the ten-second TTL bounds the pause.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L851-L903
  - what: >-
      betterlite's spend counter callables (async function to read current spend for a job,
      async function to increment a job's spend counter) are injected through the shadow
      job loader struct as Fields: read_spend receives (counter_key: String, fallback_spend: f64,
      max_budget: f64) -> Future<f64>, write_spend receives (counter_key: String, cost: f64) ->
      Future<()>. Production defaults delegate to B2321::get_current_spend (read side) and
      B3015::increment_spend_counter (write side); tests inject in-memory implementations.
    why: >-
      The cross-pod spend counter is external to the shadow pipeline. B4083 takes these
      callables through explicit fields rather than reading proxy globals, so tests control
      counter behavior and the pipeline degrades gracefully on counter unavailability
      (reads return the fallback spend floor, writes log and continue). The spend writer is
      called before the attempt insert, so a lost row still closes the job's budget gate on
      the next read via the fallback floor. These callables are optional to preserve test
      isolation; they are not listed in depends_on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L828-L845
  - what: Funnel flush drops the batch on any database error instead of retrying, since a repeated increment is worse than an undercount.
    why: Advisory counters should degrade gracefully; the spend update job runs periodically and will retry on the next cycle.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/shadow_eval_funnel.py#L47-L65
out_of_scope:
  - Shadow evaluation execution (B4084), spending logic (B4081/B4085), verdict parsing and judging (B4080).
  - Snapshot capture and request normalization (B4082).
  - Virtual key and team budget checks; injection of those checks into the spend gate is B4085.
  - "get_current_spend production implementation: owned by B2321 (betterlite-auth::current_spend); this task receives it as an injected callable."
  - "increment_spend_counter production implementation: owned by B3015 (betterlite-auth::spend_writes); this task receives it as an injected callable."
pitfalls:
  - Reverse jobs validate to exactly one router via the arm_router_names property, which merges router_name and router_names fields.
  - The cache is typed as InMemoryCache with hardcoded capacity four and TTL ten seconds; do not parameterize these.
  - Error messages from exceptions are truncated after 500 characters; longer messages get cut off by the database insert.
  - Funnel recording is synchronous (no async lock) so the hook's read-modify-write on the shared event loop cannot interleave with the flush's snapshot.
  - "Spend counter write happens before the attempt insert, so a lost row still closes the job's budget gate: the counter is the source of truth, not the row."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
