dod:
  - text: ActiveShadowEvalJob validates direction and baseline_model consistency, and rejects reverse jobs without exactly one router.
    proof: [job-validation]
  - text: Job loading queries the database, aggregates attempt stats per job, groups by target, and caches the result for ten seconds.
    proof: [oracle, job-loading-tests]
  - text: A cache miss or DB error returns empty without storing, so sampling pauses and the next request retries.
    proof: [job-loading-tests]
  - text: Funnel events are recorded to a pod-local dictionary and flushed atomically per job, dropping the batch on failure.
    proof: [funnel-tests]
  - text: Attempt insertion includes every cost type (call cost, classifier cost, judge cost) as Decimal and error messages truncated to 500 characters.
    proof: [oracle, attempt-recording-tests]
  - text: Direction-based admission filters forward-job traffic not served by any candidate router, and reverse-job traffic from exactly one router.
    proof: [oracle, admission-tests]
  - text: Model-group scope resolution uses the injected router's alias map and accepts traffic only matching job-scoped groups.
    proof: [oracle, admission-tests]
  - text: When eval_spend is positive, the job's spend counter is incremented before the attempt row is inserted, so a lost row still closes the job's budget gate on the next read.
    proof: [oracle, spend-write-ordering-tests]
checks:
  optional: []
  commands:
    - id: job-validation
      why: ActiveShadowEvalJob model validation does not reject invalid direction or baseline_model mismatch.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(shadow_eval_job_validation)'
    - id: job-loading-tests
      why: Job loading, caching, or error handling fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(shadow_eval_job_loading)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(shadow_eval_job_)'
    - id: funnel-tests
      why: Funnel recording or flushing fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(shadow_eval_funnel)'
    - id: attempt-recording-tests
      why: Attempt insertion with costs and error truncation fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(shadow_eval_attempt)'
    - id: admission-tests
      why: Direction-based or scope-based admission filtering fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/shadow_eval.*admission|shadow_eval.*scope/)'
    - id: spend-write-ordering-tests
      why: Spend counter increment before attempt insert does not happen or is not verified.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(shadow_eval.*spend.*write.*order)'
