id: B346
title: Priority queues and scheduled routing
description: Add a per-model scheduler using B304 state and an injected clock/request ID source. Wire
  priority/default_priority requests through B017 without recursively rescheduling the same request. Preserve
  the pinned ordering and healthy-candidate polling decisions, and report the prioritization header. Bound
  the queue to a proposed 1024 pending requests per model and use the existing routing deadline; remove
  entries on success, timeout and cancellation. Use an atomic store operation for shared queue updates.
  The new cap and cleanup correction are explicit deviations requiring architect acknowledgement. Use
  the existing Rust crate boundaries from B004 and B008; integrate through the server when the provider
  dispatcher or callbacks live in another core crate. This task's source slices are the linked ranges,
  not a port of their Python classes. Add the listed oracle cases and the matching adapters to B301's
  component runner where state is not observable over HTTP; adapters call production logic and never reproduce
  it. Use deterministic candidate sets or supplied random samples for comparisons, and separate seeded
  distribution tests for random choices. Extend the existing config_yaml fuzz target and committed corpus
  for every newly accepted config form; unsupported keys still fail by full path. Keep the implementation,
  adapters and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
  Extend B004's typed chat request fields only for the routing controls this task consumes, and extend
  its existing chat_request fuzz corpus; router-only fields never reach the provider body.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - crates/betterlite-openai/**
  - tools/oracle/cases/routing/request-scheduler/**
  - tools/oracle/src/router_probes/request_scheduler/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/request_scheduler.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/scheduler.py#L12-L137
  why: Queue ordering, poll/peek and removal.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/scheduler.py#L1-L7
  why: Named priority values.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4395-L4514
  why: Scheduled call lifecycle and headers.
dod:
- text: Every listed case compares production behavior against pinned LiteLLM; any declared difference
    asserts exact reference and Rust outcomes through B361 instead of ignoring the difference.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the request_scheduler prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
- text: Routing controls have valid and invalid chat parser corpus seeds and are consumed before upstream
    serialization.
  proof:
  - chat-corpus
  - oracle
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(request_scheduler)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
  - id: chat-corpus
    why: routing request controls lack chat parser corpus coverage or replay fails
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
oracle_cases:
- tools/oracle/cases/routing/request-scheduler/lower-priority-number-first.yaml
- tools/oracle/cases/routing/request-scheduler/equal-priority-request-id-order.yaml
- tools/oracle/cases/routing/request-scheduler/model-isolation.yaml
- tools/oracle/cases/routing/request-scheduler/healthy-candidate-bypasses-head.yaml
- tools/oracle/cases/routing/request-scheduler/unhealthy-head-may-run.yaml
- tools/oracle/cases/routing/request-scheduler/peek-does-not-pop.yaml
- tools/oracle/cases/routing/request-scheduler/poll-deadline.yaml
- tools/oracle/cases/routing/request-scheduler/prioritization-header.yaml
deviations:
- what: Scheduler queues have a 1024-request per-model cap, reject overflow with 429, and always remove
    completed or cancelled entries.
  why: The bounded-inputs and async-hygiene rules forbid unbounded queues and orphaned entries.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/scheduler.py#L43-L101
out_of_scope:
- Global admission middleware (B022).
- Replacing the selector's health or capacity checks.
pitfalls:
- Equal priorities use request ID ordering, not FIFO arrival order.
- The pinned healthy-deployment poll path leaves a queue entry; cleanup must be tested as a deliberate
  correction.
- The architect must approve the 1024-entry per-model cap and 429 overflow response before dispatch.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
