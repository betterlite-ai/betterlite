id: B346
title: Priority queues and scheduled routing
description: 'Add a per-model scheduler using B360 state and an injected clock/request ID source. Wire
  priority/default_priority requests through B017 without recursively rescheduling the same request. Preserve
  the pinned ordering and healthy-candidate polling decisions, and report the prioritization header. Bound
  the queue to 1024 pending requests per model and use the existing routing deadline; remove entries on
  success, timeout and cancellation. Use an atomic store operation for shared queue updates. The cap and
  completed/cancelled-entry cleanup are declared deviations because the pin has no queue bound. Resolve
  polling_interval with truthiness against DEFAULT_POLLING_INTERVAL, env default 0.03 seconds; shared
  queue local TTL uses DEFAULT_IN_MEMORY_TTL, env default 5 seconds. priority defaults through default_priority
  (None unless configured); enum High=0, Medium=128, Low=255. Keep the inherited routing deadline. Configuration
  boundary keys introduced or consumed here: polling_interval, default_priority, DEFAULT_POLLING_INTERVAL,
  DEFAULT_IN_MEMORY_TTL. Implement the owned native service in crates/betterlite-router/src/request_scheduler.rs.
  Add ProbeOperation::RequestScheduler in tools/oracle/src/router_probes/mod.rs and the corresponding B346 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/scheduler.py: Scheduler.__init__ (L26-L40),
  Scheduler.add_request (L42-L50), Scheduler.poll (L52-L85), Scheduler.remove_request (L87-L96), Scheduler.peek
  (L98-L112), Scheduler.get_queue_status (L114-L116), Scheduler.get_queue (L118-L129), Scheduler.save_queue
  (L131-L137). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
