  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/usage_endpoints.py#L227-L992
    why: Remaining records, aggregates and all four usage routes are already assigned, including their mounts and HTTP cases.
dod:
  - text: The real live Vigil class honors config/env precedence, sequential sanitization, retry, block and partial fail-open over chat HTTP.
    proof: [oracle]
  - text: Both direct-apply paths use the same live class, honor input_type, skip blank scans and retain authentication.
    proof: [oracle]
  - text: Provider scan ids reach success and blocked response headers with correct stage deduplication, and caller metadata cannot forge them or disable global scans.
    proof: [oracle]
  - text: Creating, replacing and deleting a guardrail changes direct-apply behavior immediately in the same booted proxy.
    proof: [oracle]
