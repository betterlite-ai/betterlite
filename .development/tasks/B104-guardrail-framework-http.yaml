  - tools/oracle/cases/guardrails/framework-http/vigil-env-and-explicit.yaml
  - tools/oracle/cases/guardrails/framework-http/vigil-post-block.yaml
  - tools/oracle/cases/guardrails/framework-http/vigil-transient-retry.yaml
