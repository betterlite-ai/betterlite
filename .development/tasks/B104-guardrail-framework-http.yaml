id: B104
title: Guardrail framework registry and API integration parity
description: >-
  Finish the framework's integration evidence without registering any route. The
  base class, registry, translation dispatch, invocation records, admin handlers,
  usage queries and mounts already have concrete owners. The actual code remainder
  is B8990's Vigil class and B8994's scan metadata utilities; the independently
  runnable media, native-protocol and native-stream suites are B8991-B8993. Here
  add about 750 lines of HTTP fixtures under guardrails/framework-http through the
  real startup, live callback source and mounted inference/direct-apply/admin APIs.
  No new decoder, config key, runtime callback class or helper oracle is needed.

  Use the existing four POST chat decorators: /v1/chat/completions,
  /chat/completions, /engines/{model}/chat/completions and
  /openai/deployments/{model}/chat/completions. Configure general_settings.master_key,
  an OpenAI mock deployment, and guardrails with their actual wire names. Spread
  these aliases across the scenarios. Configure Vigil using guardrail vigil_guard,
  mode pre_call or post_call, api_base, api_key, and unreachable_fallback as needed.
  An environment-default case omits the two credentials in guardrails config and
  supplies VIGIL_GUARD_URL and VIGIL_GUARD_API_KEY through the case's env map. A second
  named guardrail in the same config has explicit credentials; selecting it in the
  next request proves their precedence. Check the
  exact /v1/guard/analyze request path, Bearer header, source user_input/model_output,
  text and metadata, and the absence of another provider call after an intervention.

  A pre-call SANITIZED result rewrites the provider's messages, without leaving
  original structured_messages able to overwrite the result. A post-call BLOCKED
  result returns the source's guardrail error status, type, param and code instead
  of the model response. A transient backend failure followed by ALLOWED makes
  exactly two analysis attempts. A fail_open case sanitizes the first of two user
  text messages, fails the second scan, and forwards the first rewrite plus the
  untouched second message, with no later analysis. An unknown decision under the
  default fail_closed policy becomes the unwrapped backend-policy failure rather
  than an explicit blocked_content intervention. Capture the actual pinned error
  fields; do not manufacture a generic 500 or erase the reason with ignore rules.

  Call both POST /guardrails/apply_guardrail and /apply_guardrail with guardrail_name
  and text. Test explicit input_type request and response against a Vigil guardrail
  supporting both: the same live class must send user_input then model_output and
  return the sanitized text. A blank text is passed through with no analysis call.
  Include an unauthenticated step and compare the real auth error, with neither
  scanner nor model traffic. These are the existing B3687/B8668 endpoints; the
  task must not add aliases or call the route functions from a helper.

  Scan-header scenarios use openai_moderation and panw_prisma_airs with the valid
  class configurations already used by B3731/B3788, pointing their providers at
  the mock. One allowed moderation response and one flagged response each carry
  a known moderation id. Both must record that id before the result leaves live
  dispatch; compare x-litellm-guardrail-scan-id and
  x-litellm-guardrail-scan-metadata on the actual success/failure HTTP responses,
  plus x-litellm-applied-guardrails when the reference emits it. For Prisma, run
  pre_call and post_call with the same id and confirm one id but two scan entries
  with their respective stages; preserve entry order, provider and guardrail name.
  Add forged internal scan/applied metadata to the allowed request and prove only
  server-recorded values reach the headers. B8994's helper cases own the 2048 limit
  and both-bucket projection; this suite proves that production actually calls it.

  A trusted-opt-out case sets a default_on generic_guardrail_api and submits
  disable_global_guardrails/opted_out_global_guardrails in caller metadata and
  litellm_metadata, including forged user_api_key_metadata. Its blocking scan still
  runs because opt-outs are taken from authenticated key/team metadata after
  B1137 intake. This does not introduce a license requirement; no enterprise-only
  module or feature token is used.

  Finally use a real PostgreSQL oracle fixture and the existing multi-step/capture
  format for POST /guardrails, PUT /guardrails/{guardrail_id} and
  DELETE /guardrails/{guardrail_id}. Create a named generic API guardrail, immediately
  apply it through /apply_guardrail, change its name/configuration, then apply the
  updated name and delete it. After deletion direct apply returns 404. Capture the
  assigned id between steps and compare the scanner calls before and after the
  update. The scenario must work in one process without restarting or waiting for
  a poll: it proves B8666 reads the live B3683 registry instead of a startup snapshot.
  Use valid declarations, not deliberately failing synchronization, so it requires
  no timing sleeps and claims no transaction stronger than LiteLLM's write order.

  All cases compare status, complete error type/param/code, selected headers,
  returned JSON and upstream path/method/auth/body. Only dynamic ids, timestamps
  and measured durations may be normalized. The ordinary oracle gate is the proof
  against betterlite; a LiteLLM self-check only checks fixture correctness. If one
  of the existing owners lacks its composition call, report that owner instead of
  duplicating a mount or adding a fixture-only dispatch route.
