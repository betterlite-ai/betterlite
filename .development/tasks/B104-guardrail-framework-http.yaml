out_of_scope:
  - "custom_guardrail.py myCustomGuardrail.__init__, async_pre_call_hook, async_moderation_hook and async_post_call_success_hook: no caller at the pin; the configured example module is proxy/example_config_yaml/custom_guardrail.py, not this claimed path."
  - "unified_guardrail/__init__.py endpoint_translation_mappings and __all__: no caller at the pin; real discovery scans llms packages for guardrail_translation_mappings and is B3679/B3680."
  - "usage_endpoints.py _resolve_usage_window, _counter_name, _team_of, _key_of, _row_untracked_units, _row_tracked_cost, _sum_counter_units, _sum_untracked_units, _sum_tracked_cost, _by, _first_match, _status_from_fail_rate, _trend_from_comparison, _aggregate_daily_metrics, _prev_fail_rates, _chart_from_metrics, _get_guardrail_field and its overloads, _to_dict, _field_str, _get_guardrail_attrs, _guardrail_overview_rows and _policy_overview_rows are B3689, as are UsageChartPoint, _MetricTotals, _PrevPeriodCounts, _DailyPassBlocked, UsageOverviewRow and UsageOverviewResponse."
  - "usage_endpoints.py _guardrails_table, _policies_table, _daily_guardrail_metrics_table, _daily_policy_metrics_table, _find_daily_guardrail_metrics, _find_daily_policy_metrics, _daily_guardrail_usage_units_table, _find_daily_guardrail_usage_units, _GuardrailRunInfo, EMPTY_OVERVIEW, UsageUnitsDailyPoint, UsageDetailResponse, UsageLogEntry, UsageLogsResponse, _build_usage_logs_where, _usage_log_entry_from_row, _snippet, _input_snippet_for_log and the four route functions guardrails_usage_overview, guardrails_usage_detail, guardrails_usage_logs and policies_usage_overview are B8772. It also mounts GET /guardrails/usage/overview, /guardrails/usage/detail/{guardrail_id}, /guardrails/usage/logs and /policies/usage/overview and owns their HTTP evidence."
  - B5471 owns the base class/failures/default apply contract, B3664 invocation logging, B3665 gates/dynamic parameters and B3666 scan cache and deployment hooks; B3688 owns compliance redaction including redact_nested_match_and_regex_keys.
  - B3682/B3683 own registry and runtime, B8521 concrete hook specifications, B8666 live class construction, B8613 startup and B8399 callback dispatch; B8610 owns the root and B8667/B8668/B8669/B8790 the existing guardrail area mounts.
  - B8990 owns Vigil orchestration and B8994 shared scan metadata; B8991-B8993 own the independent deferred HTTP suites and are not dependencies of this suite because it does not consume their files.
pitfalls:
  - The two B104-exclusive files are unused examples/exports, so their presence in coverage does not justify a second framework implementation.
  - A new scan id must survive a flagged moderation error, not just the successful inference path.
  - Direct apply performs a live registry lookup and cannot use a callback list frozen at startup.
  - Caller metadata named user_api_key_metadata is still untrusted until normal request intake replaces it with authenticated state.
  - A fail-open scan keeps earlier sanitization; forwarding the entire original request would discard an already accepted rewrite.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
