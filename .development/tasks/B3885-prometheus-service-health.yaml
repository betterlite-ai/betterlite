deviations:
  - what: |-
      PrometheusServicesLogger stores all collectors in a single list per service
      and dispatches operations by type checking (isinstance) followed by metric name
      checking ("total_requests" in obj._name or "failed_requests" in obj._name).
      The failed_requests and total_requests counters are both the Rust Counter type
      and must be distinguished by their metric name suffix, not by type alone.
    why: |-
      LiteLLM creates two counters with different label sets for each service
      and identifies them by name. Betterlite follows the same pattern: iterate,
      check type, then check name to apply the correct increment pattern (with or
      without error_class/function_name labels).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus_services.py#L199-L278
  - what: Betterlite uses ServiceLoggerPayload and ServiceTypes from B012's logging types,
      not re-defined here.
    why: These types are the contract between B012's dispatcher and this logger; keeping
      them in one place avoids duplication and keeps logging types cohesive.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/services.py#L93-L105

out_of_scope:
  - |-
    Test-only instrumentation: mock_testing field and mock_testing_success_calls/
    mock_testing_failure_calls counters have no production caller; they support unit testing
    of the logger in isolation.
  - |-
    Reading config values directly; B012 and B002 supply the service configuration and the
    prometheus_latency_buckets setting.
  - |-
    Callback registration and dispatcher dispatch logic; B012 owns the service-event dispatch contract
    and invokes this part's hooks.
  - |-
    Prometheus collector instantiation and native prometheus_client APIs; B3874 supplies those.

pitfalls:
  - |-
    ServiceTypes is an enum with many queue types; DEFAULT_SERVICE_CONFIGS is a dict, not all
    services are configured (only those in the dict get config). Always check the config dict before
    defaulting to DEFAULT_METRICS.
  - |-
    _names_to_collectors is an internal prometheus_client detail; the fallback to collecting all metrics
    must work when it is missing.
  - |-
    The failed_requests and total_requests counters are both the Counter type and stored in the same
    list; they must be distinguished by metric name ("total_requests" in obj._name or "failed_requests"
    in obj._name), not by type. Renaming either metric breaks the dispatch pattern.
  - |-
    The failed_requests counter gets additional_labels [error_class, function_name] but total_requests does not;
    the increment_counter method must handle both cases and pass labels only to the correct counter.
  - |-
    event_metadata may be None or missing gauge_labels/gauge_value; the async success hook must check before calling
    update_gauge, defaulting to empty string and 0 if missing.
  - |-
    The latency_buckets tuple must match exactly; a mismatch between declared labelnames and provided
    values causes runtime errors in prometheus_client.
  - |-
    The sync hooks have no caller at the pin; the dispatcher queues an async path that calls the async hooks.
    Build the sync bodies for backwards-compatibility, but do not expect them to receive traffic in tests.

