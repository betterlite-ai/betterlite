id: B3885
title: Prometheus service health metrics
description: >-
  Port litellm/integrations/prometheus_services.py:1-278 to Rust in
  crates/betterlite-prometheus to expose a service-specific histogram, counter and gauge
  registry, consume the existing async service-event phase, reuse registered collectors,
  and preserve failure labels error_class/function_name and metadata-provided gauge
  labels/values.

  Build PrometheusServicesLogger, which scans the configured service types and their
  metrics from B012's DEFAULT_SERVICE_CONFIGS and initializes only those metrics needed
  for each service. The logger stores collectors in a map from service name to a list of
  Histogram, Counter, and Gauge objects. The registry lookup via is_metric_registered uses
  prometheus_client's _names_to_collectors for O(1) lookup; _get_metric retrieves a metric
  from the registry by name. The factory methods create_histogram, create_gauge and
  create_counter return existing metrics if already registered, or create new ones with
  the service name as the only label for histogram/gauge, or service name plus
  error_class/function_name for the failed_requests counter.

  The emit methods observe_histogram, update_gauge and increment_counter call the
  underlying metric's labels(), observe(), set() or inc() methods. The latency_buckets
  are read from B3870's LATENCY_BUCKETS constant, or overridden by
  litellm.prometheus_latency_buckets if set.

  Implement synchronous hooks service_success_hook and service_failure_hook, which
  iterate through the service's metric list, check type (isinstance Histogram/Counter),
  then check metric name to distinguish failed_requests from total_requests counters,
  and increment or observe with the appropriate labels. These hooks receive no traffic
  in production at the pin; the dispatcher calls the async versions instead. They are
  included for backwards-compatibility and dependency closure (tasks B757, B4327, B4328
  list them as dependencies).

  Implement async_service_success_hook, which receives a ServiceLoggerPayload and calls
  observe_histogram for any Histogram in the service's metric list and increment_counter
  for the total_requests Counter by name. If the payload carries event_metadata with
  gauge_labels and gauge_value, also call update_gauge for any Gauge in the list.

  Implement async_service_failure_hook, which receives a ServiceLoggerPayload and an error,
  extracts error_class from the exception and function_name from payload.call_type, and
  calls increment_counter for every Counter in the service's metric list. For the
  failed_requests counter (identified by name), pass error_class and function_name as
  additional labels; for the total_requests counter, pass only the service label.

