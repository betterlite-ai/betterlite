oracle_cases: []

deviations:
  - what: "Async wrappers call sync counterparts via thread pool and contextvars copy, matching the @client decorator pattern in LiteLLM."
    why: "Getting and updating evals uses the same executor-based async pattern as other operation families; betterlite's observability layer handles logging and context propagation instead of the @client decorator."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L415-469
  - what: "Metadata filtering preserves the exact internal keys list from LiteLLM and applies extra_body overwrites afterward, allowing extra_body.metadata to bypass filtering."
    why: "This security-sensitive behavior matches LiteLLM exactly and must be tested explicitly; the filtering is not a 'fix' but the intended wire behavior."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L686-728

out_of_scope:
  - Provider factory (ProviderConfigManager.get_provider_evals_api_config).
  - HTTP handler implementation and transport dispatch.
  - Request/response transformation for OpenAI (B523).
  - Logging infrastructure and observability (B247).
  - Exception type mapping (B185, B186).
  - Async runtime and request tracing.

pitfalls:
  - "metadata filtering must preserve the exact 20+ internal keys from LiteLLM; a missing key in the exclusion set creates a security gap. Do not 'fix' or reorganize the list."
  - "Filtered metadata must be included in the update request only if non-empty; an empty filtered_metadata dict should not add a metadata key to the request."
  - "extra_body is applied after filtering and can restore metadata or override any field, including name and eval_id from the path."
  - "get_eval accepts extra_query but does not forward it; update_eval accepts extra_query but does not forward it. This is intentional; do not add query param forwarding."
  - "extra_query is a parameter name but the code path does not use it; accepting it preserves the API surface but forwarding it would be incorrect per the LiteLLM behavior."
  - "Async wrappers must handle both direct returns and coroutines; contextvars.copy_context and loop.run_in_executor preserve request context across the thread boundary."
  - "In get_eval and update_eval, store local_vars = locals() before the try block so that all function parameters (eval_id, name, metadata, extra_headers, extra_query, extra_body, timeout, custom_llm_provider) and their defaults are captured for error reporting."
  - "Both functions reuse module-level DEFAULT_OPENAI_API_BASE and BaseLLMHTTPHandler() from B3421's scope."

