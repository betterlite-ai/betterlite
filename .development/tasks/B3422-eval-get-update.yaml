id: B3422
title: Eval retrieval and update operations
description: >-
  Build eval retrieval and update orchestration in `betterlite-core::api::eval_get_update`. Implement `get_eval`, `aget_eval`, `update_eval`, and `aupdate_eval` with native sync/async semantics, preserving the exact internal-metadata exclusion set and the subsequent `extra_body` overwrite behavior.

  In `get_eval`: accept `eval_id` (required), `extra_headers`, `extra_query` (accepted but not forwarded), `timeout`, and `custom_llm_provider`. Select provider as in B3421: `custom_llm_provider` becomes `"openai"` if `None`. Validate environment, transform the request (no body reading), call the logging updater with `eval_id` as an optional param, dispatch to the transport handler with resolved timeout.

  In `update_eval`: accept `eval_id` (required), `name` (optional), `metadata` (optional, filtered to exclude internal keys), `extra_headers`, `extra_query` (accepted but not forwarded), `extra_body`, `timeout`, and `custom_llm_provider`. Build `UpdateEvalRequest` with only name and filtered metadata, apply `extra_body` overwrites afterward (including `extra_body.metadata` which can bypass earlier filtering), validate environment, transform, log with the full request body as optional params, dispatch with resolved timeout.

  The internal metadata exclusion set includes: headers, requester_metadata, user_api_key_hash, user_api_key_alias, user_api_key_spend, user_api_key_max_budget, user_api_key_team_id, user_api_key_user_id, user_api_key_org_id, user_api_key_team_alias, user_api_key_end_user_id, user_api_key_user_email, user_api_key_request_route, user_api_key_budget_reset_at, user_api_key_auth_metadata, user_api_key, user_api_end_user_max_budget, user_api_key_auth, litellm_api_version, global_max_parallel_requests, user_api_key_team_max_budget, user_api_key_team_spend, user_api_key_model_max_budget, user_api_key_user_spend, user_api_key_user_max_budget, user_api_key_metadata, endpoint, litellm_parent_otel_span, requester_ip_address, user_agent. Only include filtered metadata if the result is non-empty; omit the metadata key entirely if all keys were filtered out. After filtering, apply `extra_body` which can add back metadata or override any field.

  Async wrappers `aget_eval` and `aupdate_eval` run their sync counterparts in a thread pool via `loop.run_in_executor`, copy context with `contextvars.copy_context`, and await the result. If the result is a coroutine, await it; otherwise return it. Both async and sync versions share module-level `DEFAULT_OPENAI_API_BASE` and `BaseLLMHTTPHandler()` from B3421's scope.

  Unsupported providers are rejected with `ValueError`. Exception mapping uses `litellm.exception_type` dispatch: OpenAI errors through B185, other or unmapped errors through B186. Store `local_vars = locals()` before the try block.

