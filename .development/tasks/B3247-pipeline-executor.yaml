deviations:
  - what: "The 400 detail after `Invalid pipeline` plus a colon and space is betterlite's own reason text (built from B3240's validation messages) and not pydantic's multi-line ValidationError text."
    why: Pydantic's text includes its library version URL and line layout, which no Rust validator produces; status 400 and the prefix match.
  - what: The 422 body for a bad request body uses the server's shared validation response and its wording, not FastAPI's `loc` and `msg` strings.
    why: Every route in the server shares one validation response shape, and this route follows it.
  - what: The unified guardrail is passed to B3680's hooks as a typed argument and `guardrail_to_apply` is never a key in the request data.
    why: LiteLLM's unified hooks pop that key before returning, so no data ever carries it; the typed argument is the same in effect (B3680 states the same deviation).

out_of_scope:
  - "B3246 owns UndeliverableStreamRewrite, _StreamRewriteObserver, _ScannedTextRecorder, _LegacyHookStreamAdapter, _release_original_chunks, _run_streaming_step, supports_unified_execution, supports_streaming_execution and find_guardrail_callback (pipeline_executor.py L52-L266, L292-L304, L428-L484, L600-L625). This task only calls them."
  - "B3240 owns PipelineStep, GuardrailPipeline, PipelineStepResult, PipelineExecutionResult and the action and mode validation (pipeline_types.py)."
  - "B3680 owns UnifiedLLMGuardrails pre_call and post_call_success; B3666 owns mark_pre_call_hook_ran; B5471 owns CustomGuardrail's is_guardrail_intervention (as GuardrailFailure::is_intervention) and scan_raw_request."
  - "B2204 owns independent_snapshot; B206 owns get_metadata_variable_name_from_kwargs and get_or_create_metadata_bucket."
  - "B3244 and B3248 own the other routes of policy_endpoints.py; B8393 owns ProxyLogging._handle_pipeline_result and _maybe_execute_pipelines (the execute_steps caller at L2218 of litellm/proxy/utils.py), B8391 owns _policy_pipelines, and B6370 owns _pipeline_gated_stream (the caller at L4056)."
  - "No task owns the production implementation of the guardrail handle's own pre-call and post-call hooks for registered non-unified guardrails; this task defines how it calls them (see notes) and tests with fakes."

pitfalls:
  - "The `metadata.guardrails` override is written to the working data on every step, so `_restore_request_guardrails` must run on the allow result or later lifecycle stages lose the request's own `guardrails` list."
  - "A post_call step always chains its returned response into the next step (key `response`) even when `pass_data` is false, and a pre_call step chains only with `pass_data`."
  - "A `scan_raw_request` guardrail returns data that is thrown away, and in post_call with the unified path it gets no guardrail argument at all, so it is skipped with outcome `pass`."
  - "`mark_pre_call_hook_ran` runs on the returned map too, so the marker `_pre_call_executed_guardrails` shows up in that step's `modified_data`."
  - "The finally-block append runs on the early return for a missing translation as well, and only when the payload is the raw snapshot copy and not `data`."
  - "`modify_response_message` falls back to the error detail only when the step's message is none or empty, and `original_exception` is set on block but never on modify_response."
  - "`str(HTTPException)` with an empty detail is `<status>: `, not an empty string, so an empty-detail 400 gives `400: ` as the error message."
  - "`duration_seconds` differs every run, so every HTTP and helper case that returns step results must ignore it by pointer."
  - "An unconfigured guardrail name is outcome `error`, which maps through `on_error` first, so `on_error: next` lets the pipeline pass where `on_fail: block` would stop it."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
