dod:
  - text: >-
      execute_steps runs steps in order, maps each outcome to on_pass, on_fail or on_error (falling back to on_fail), stops on allow, block and
      modify_response, continues on next, and allows after the last step; block and modify_response carry the guardrail information, the
      step's exception and the message rules.
    proof: [executor-loop-tests, oracle, helper-python]
  - text: >-
      pass_data steps and every post_call step merge their returned data over the working data, and the allow result restores the
      request's own metadata.guardrails (kept, stripped or dropped as the helper rules say).
    proof: [executor-data-tests, oracle, helper-python]
  - text: >-
      A step whose guardrail is not registered, whose mode is unsupported, or that runs on a stream without a translation returns outcome error
      with LiteLLM's exact detail text, and a missing guardrail logs the not-found warning.
    proof: [executor-step-tests, oracle, helper-python]
  - text: >-
      A step runs the unified path for a unified guardrail only outside streaming, uses the guardrail's own hooks otherwise, marks the
      pre-call hook as run, and treats scan_raw_request guardrails as block-only on the raw snapshot.
    proof: [executor-step-tests, oracle, helper-python]
  - text: >-
      Intervention failures become outcome fail and every other failure becomes outcome error, with the extracted message, and the failure
      is kept for the block result.
    proof: [executor-step-tests, oracle, helper-python]
  - text: >-
      A streaming post_call step with chunks and a translation calls B3246's streaming step with the payload and the request's logging object, and
      reports pass.
    proof: [executor-stream-tests]
  - text: >-
      The request-data helpers append and carry guardrail information, keep the aliasing result of LiteLLM for lists that already exist, and
      extract error messages including the empty-detail HTTP case.
    proof: [executor-data-tests, oracle, helper-python]
  - text: >-
      POST /policies/test-pipeline returns the execution result fields, answers 400 `Invalid pipeline: ...` for a bad pipeline, 422 for a bad
      body, 500 for an executor error, and keeps LiteLLM's auth behavior.
    proof: [route-tests, oracle, request-corpus]
  - text: >-
      The pipeline test request decoder rejects malformed bytes and wrong shapes without panicking and has committed corpus inputs.
    proof: [request-corpus]

checks:
  optional: []
  commands:
    - id: executor-loop-tests
      why: the step loop, action routing or terminal results are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::pipeline_executor::.*tests::loop_/)'
    - id: executor-step-tests
      why: the single-step runner, its mode arms or its outcome classification are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::pipeline_executor::.*tests::step_/)'
    - id: executor-data-tests
      why: a request-data helper or the merge rules are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::pipeline_executor::.*tests::data_/)'
    - id: executor-stream-tests
      why: the streaming arm does not call the B3246 step the way the description says
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::pipeline_executor::.*tests::stream_/)'
    - id: route-tests
      why: the test-pipeline route or its errors are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pipeline_test_route::/) - test(replays_the_pipeline_test_request_corpus)'
    - id: request-corpus
      why: the request decoder has no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/pipeline_test_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_pipeline_test_request_corpus)'
    - id: helper-python
      why: the Python oracle helper adapter for this task fails strict Python checks
      run: test -f tools/oracle/helpers/b3247.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
