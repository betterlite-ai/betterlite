id: B3078
title: Configure and flush the optional billing metrics recorder
description: >-
  Add crates/betterlite-billing to build and manage the optional mTLS OTLP metrics recorder.
  The recorder increments one counter per billable request, reporting deployment identity through a validated TLS client certificate instead of a license key in the payload.
  Build the configuration loader that reads LITELLM_BILLING_METRICS_ENDPOINT, LITELLM_BILLING_METRICS_CLIENT_CERT, LITELLM_BILLING_METRICS_CLIENT_KEY, the optional LITELLM_BILLING_METRICS_CA_CERT, and LITELLM_BILLING_METRICS_EXPORT_INTERVAL_MS (default 60000 ms) environment variables.
  Each certificate variable accepts either a filesystem path or inline PEM content beginning with -----BEGIN; inline PEM is written to a private temporary directory on startup.
  Return None from the loader when any of the three required values (endpoint, client cert, client key) are missing, logging a warning that names the variable.
  Return None when credential resolution fails (permission denied, unwritable temp directory) and log a warning with the system error.
  Return None when a resolved path does not exist or is not readable, logging a warning that lists every unreadable path by its variable name.
  The endpoint must end with /v1/metrics after trimming trailing slashes; add that suffix if absent.
  Build the MeterProvider with OpenTelemetry's OTLPMetricExporter presenting the client certificate and key, with the system trust store as default and a custom CA cert only when provided.
  Build a BillingMetricsRecorder that owns the provider and increments a counter named litellm.enterprise.billable_requests with attributes for the billable category, HTTP route, status code and optional model ID.
  Add a module-local ActiveRecorderRegistry that holds one recorder at a time, with set and pop methods for factory and shutdown hooks.
  Build a factory function that takes premium (bool), license_data (optional dict/record with user_id key), and litellm_version (str) parameters.
  The factory returns None when the deployment is not licensed (debug log), loads config and returns None on any config error, builds the provider and recorder and returns None if the exporter fails (warning log).
  The factory extracts the license ID from the user_id key of the license_data dict, which becomes the litellm.license.id attribute on exported metrics (only present when license_data provides a user_id).
  Build a shutdown function that pops the active recorder and calls its shutdown with a five-second timeout, logging a warning if the final flush fails.
  The factory logs success with the endpoint and export interval in milliseconds when the recorder starts.
  Never gate configured metering on the premium flag after the initial check; an unlicensed deployment gets no recorder, but a licensed one with environment configuration gets metering regardless of the tier decision.
  Add configuration in betterlite-config for the four environment variable names (endpoint, client cert, client key, CA cert) and the export interval (default 60 seconds).
