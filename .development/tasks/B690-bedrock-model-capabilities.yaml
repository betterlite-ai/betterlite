  - id: case-strict-tools-fallback
    why: A B2203 base not starting with anthropic returns False. For anthropic bases try the base then the base
      stripped of trailing -vN(:revision), deduplicated. Each candidate calls shared model-info lookup with provider
      bedrock; an actual boolean bedrock_converse_supports_strict_tools wins. Otherwise a string returned key selects
      the B2203 local packaged entry and its actual bool. Suppress all exceptions per candidate and continue; absent
      flags default True.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_model_capabilities_cases::case_[0-9]+_strict_tools_fallback$/)'
  - id: case-tool-search
    why: Call B688 provider-aware supports_tool_search with provider bedrock. An explicit False beats fallback generalizations;
      do not hardcode Claude version strings here.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_model_capabilities_cases::case_[0-9]+_tool_search$/)'
  - id: case-effort-ceiling
    why: Only dict output_config with effort in low, medium, high, max, xhigh is considered, in that ascending order
      (xhigh is above max). Fetch model info using the original model/provider bedrock; exceptions leave the dict
      unchanged. Accept a string ceiling in that vocabulary, else use a string key to the local packaged map. Clamp
      in place only if effort ranks higher; preserve all other fields and emit no warning. Unknown effort does nothing;
      unhashable effort retains the source type error.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_model_capabilities_cases::case_[0-9]+_effort_ceiling$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_model_capabilities.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_model_capabilities*")"
      && grep -lq 'bedrock_model_capabilities' tools/oracle/fuzz/corpus/helper_case/bedrock_model_capabilities*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_model_capabilities$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-parallel-tools
    why: Only supports_parallel_tool_use_config is True in either raw or B2203 base-model entry enables it. Falsey
      entries act as {}; truthy malformed entries fail. Do not treat integer 1 as True.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_model_capabilities_cases::case_[0-9]+_parallel_tools$/)'
