id: B690
title: Bedrock model capabilities and Mantle endpoint policy
description: >-
  Port catalog-backed Converse/tool/schema capability predicates, effort ceilings and Mantle endpoint selection.
  B598 owns route tags and request-specific route selection; these predicates do not dispatch HTTP.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  _mantle_api_base_from_env L1009-L1014; bedrock_supports_openai_responses L1017-L1036; build_mantle_messages_url
  L1039-L1061; bedrock_converse_supports_parallel_tool_use_config L1102-L1106; bedrock_model_accepts_cache_points
  L1109-L1133; bedrock_supports_tool_search L1136-L1147; is_claude_4_5_on_bedrock L1150-L1163; bedrock_converse_supports_strict_tools
  L1169-L1185; _get_bedrock_converse_strict_tools_flag L1188-L1208; normalize_bedrock_opus_output_config_effort
  L1211-L1235; _get_bedrock_output_config_effort_ceiling L1238-L1261.


  Reuse AnthropicModelInfo._supports_model_capability from B688 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: mantle_api_base: Choose truthy api_base, then truthy aws_bedrock_runtime_endpoint, then
  BEDROCK_MANTLE_API_BASE. Only the environment value strips trailing slashes then /openai/v1 or /v1 (in that order);
  explicit bases keep those suffixes. Strip trailing slashes from the chosen override, preserve an exact /anthropic/v1/messages
  suffix or append it. With no truthy override use https://bedrock-mantle.{region}.api.aws/anthropic/v1/messages,
  without region or China-domain validation. native_responses: For a truthy model inspect raw model then bedrock/model
  keys only. True when either mapping has /v1/responses membership in supported_endpoints or (); a string also uses
  Python substring membership. Missing/empty model and absent maps return False, with no aliases or family heuristic;
  invalid non-iterable supported_endpoints propagates its type error. cache_point_unknown_model: None permits cache
  points. A case-sensitive (^|[./])openai\. match forbids them before catalog lookup. Otherwise inspect raw/base
  entries that are non-None: no entries permits caching, while any existing entry must declare supports_prompt_caching
  is True. An empty dict is an existing negative entry; malformed entries raise. strict_tools_fallback: A B2203
  base not starting with anthropic returns False. For anthropic bases try the base then the base stripped of trailing
  -vN(:revision), deduplicated. Each candidate calls shared model-info lookup with provider bedrock; an actual boolean
  bedrock_converse_supports_strict_tools wins. Otherwise a string returned key selects the B2203 local packaged
  entry and its actual bool. Suppress all exceptions per candidate and continue; absent flags default True. tool_search:
  Call B688 provider-aware supports_tool_search with provider bedrock. An explicit False beats fallback generalizations;
  do not hardcode Claude version strings here. effort_ceiling: Only dict output_config with effort in low, medium,
  high, max, xhigh is considered, in that ascending order (xhigh is above max). Fetch model info using the original
  model/provider bedrock; exceptions leave the dict unchanged. Accept a string ceiling in that vocabulary, else
  use a string key to the local packaged map. Clamp in place only if effort ranks higher; preserve all other fields
  and emit no warning. Unknown effort does nothing; unhashable effort retains the source type error. parallel_tools:
  Only supports_parallel_tool_use_config is True in either raw or B2203 base-model entry enables it. Falsey entries
  act as {}; truthy malformed entries fail. Do not treat integer 1 as True. extended_cache_ttl: The function named
  is_claude_4_5_on_bedrock checks cache_creation_input_token_cost_above_1hr is not None on raw/base entries. Zero
  and False therefore enable the one-hour TTL, with no Claude-family or version check.


  The callable returned by B2203 get_cached_model_info is invoked through B2225 full model-info lookup, including
  its supported-parameter query, provider overlay and cache behavior; do not substitute B2219 helper-only metadata.


  Implement crates/betterlite-bedrock/src/bedrock_model_capabilities.rs with adjacent tests under bedrock_model_capabilities/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_model_capabilities_cases in betterlite-bedrock with these exact named cases (one
  per oracle file): mantle_api_base, native_responses, cache_point_unknown_model, strict_tools_fallback, tool_search,
  effort_ceiling, parallel_tools, extended_cache_ttl. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_model_capabilities* using HelperCase:
  kind: helper and the externally tagged bedrock_model_capabilities variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_model_capabilities that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Reuse B2207's BEDROCK_MANTLE_API_BASE loader (absent None); no duplicate setting is owned here.


  Budget from 175 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 245 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 610 planned, 625 maximum changed lines.
