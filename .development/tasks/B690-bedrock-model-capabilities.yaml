  commands:
  - id: case-mantle-api-base
    why: Choose truthy api_base, then truthy aws_bedrock_runtime_endpoint, then BEDROCK_MANTLE_API_BASE. Only the
      environment value strips trailing slashes then /openai/v1 or /v1 (in that order); explicit bases keep those
      suffixes. Strip trailing slashes from the chosen override, preserve an exact /anthropic/v1/messages suffix
      or append it. With no truthy override use https://bedrock-mantle.{region}.api.aws/anthropic/v1/messages, without
      region or China-domain validation.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_model_capabilities_cases::case_[0-9]+_mantle_api_base$/)'
  - id: case-native-responses
    why: For a truthy model inspect raw model then bedrock/model keys only. True when either mapping has /v1/responses
      membership in supported_endpoints or (); a string also uses Python substring membership. Missing/empty model
      and absent maps return False, with no aliases or family heuristic; invalid non-iterable supported_endpoints
      propagates its type error.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_model_capabilities_cases::case_[0-9]+_native_responses$/)'
  - id: case-cache-point-unknown-model
    why: 'None permits cache points. A case-sensitive (^|[./])openai\. match forbids them before catalog lookup.
      Otherwise inspect raw/base entries that are non-None: no entries permits caching, while any existing entry
