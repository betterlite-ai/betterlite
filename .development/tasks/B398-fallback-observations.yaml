  - mutants
  commands:
  - id: fallback-observations-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::fallback_observations_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: fallback-observations-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::fallback_observations_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/fallback_observations.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/fallback_observations.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
