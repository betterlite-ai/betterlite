id: B398
title: Fallback events and response metadata
description: 'Implement redacted fallback error details, success/failure callback events and typed retry/fallback
  headers. Keep errors and hidden stream metadata separate from already-sent HTTP headers, with caller-sensitive
  fields redacted. B310 calls this service; it makes no provider call or authorization decision. ROUTER_FALLBACK_ERROR_DETAIL_MAX_CHARS
  is 2000, with no environment override; retain credential masking before truncation. Implement the owned
  native service in crates/betterlite-router/src/fallback_observations.rs. Add ProbeOperation::FallbackObservations in
  tools/oracle/src/router_probes/mod.rs and the corresponding B398 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_utils/add_retry_fallback_headers.py:
  get_fallback_error_info (L228-L238), _coerce_error_dicts (L241-L242), get_fallback_errors_from_headers
  (L245-L258), _add_headers_to_response (L261-L281), add_fallback_headers_to_response (L301-L334). Implement
  these behaviors through the typed Rust services above; synchronous facades and structural accessors
  reuse the same primitive instead of separate ports. Function coverage in litellm/router_utils/common_utils.py:
  truncate_fallback_error_detail (L64-L77), format_no_fallback_group_message (L80-L92), format_fallback_outcome_message
  (L95-L107). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports. Function coverage in litellm/router_utils/fallback_event_handlers.py:
  log_success_fallback_event (L722-L747), log_failure_fallback_event (L750-L775). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
