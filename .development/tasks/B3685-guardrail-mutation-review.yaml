dod:
  - text: A key check failure answers the usual 401 body on all six routes, and a body that fails validation answers 422 in FastAPI's shape only after the key check passes.
    proof: [write-body-tests]
  - text: Every route refuses a caller whose role is not exactly proxy_admin with 403 and the right detail text before it looks at the database, and answers 500 "Prisma client not initialized" when there is no database.
    proof: [write-route-tests, review-route-tests]
  - text: Create writes the row, starts the guardrail in memory as a db guardrail, answers with the request plus the new id, deletes the row and answers 400 on a configuration error, and still answers 200 on any other start error.
    proof: [write-route-tests]
  - text: Replace and patch answer 404 for a missing row, write the row, sync memory, and on a configuration error write the old values back and answer 422. Patch merges only the sent params keys over the stored ones, and an empty guardrail_info object replaces the stored one.
    proof: [write-route-tests]
  - text: Delete answers 404 for a missing row, removes the row whatever its status, removes the guardrail from memory and answers the message body.
    proof: [write-route-tests]
  - text: Approve and reject answer 404 and 400 with LiteLLM's texts, reject only changes the status, and approve activates the row before reading the params, starts the guardrail in memory, and answers 200 with a warning when the start fails.
    proof: [review-route-tests]
  - text: The write and patch body decoders never panic on any bytes and the fuzz corpus replays.
    proof: [decoder-corpus]

  - text: The handlers are tested with tower's oneshot over the module's own Router and fake ports. B8667 mounts the routes and owns their HTTP oracle cases, so write no HTTP case here.
    proof: [write-route-tests]
checks:
  optional: []
  commands:
    - id: write-body-tests
      why: the body decoders, the 422 shape or the check order are missing or wrong
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^guardrails::admin_mutations::tests::(body_|auth_)/) - test(replays_the_guardrail_write_corpus)'
    - id: write-route-tests
      why: a create, replace, patch or delete branch is missing or wrong
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^guardrails::admin_mutations::tests::(create_|replace_|patch_|delete_)/)'
    - id: review-route-tests
      why: an approve or reject branch is missing or wrong
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^guardrails::admin_mutations::tests::review_/)'
    - id: decoder-corpus
      why: the fuzz target for the write body decoders or its fresh corpus is missing or fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/guardrail_write_body.rs &&
        grep -q 'name = "guardrail_write_body"' crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/guardrail_write_body)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_guardrail_write_corpus)'

oracle_cases: []

deviations:
  - what: The 200 body of create and replace carries `litellm_params` as B3662 serializes it (the keys set plus the base defaults), where LiteLLM dumps every field of every provider mixin as null.
    why: B3662's `LitellmParams` serializer deliberately leaves out the mixin fields, and no DB-free oracle case can see the difference. The stored row is identical.
  - what: A 422 for an invalid patched `litellm_params` carries B3662's error text (field path and reason), not pydantic's multi-line text.
    why: Pydantic's text is a repr of a Python exception and has no Rust equivalent.

out_of_scope:
  - "GET /guardrails/list, /v2/guardrails/list, GET /guardrails/{guardrail_id} and its /info alias, the two ui routes and masking: B3684."
  - "POST /guardrails/register, GET /guardrails/submissions, GET /guardrails/submissions/{guardrail_id}, `_row_to_submission_item`, `_parse_json_field`, `_get_user_team_ids` and the custom-code test route with its helpers (L2038-L2335): B3686."
  - "category_yaml, major_airlines, validate_blocked_words_file (L1450-L1620) and apply_guardrail (L2337-L2457): B3687."
  - "The `GUARDRAIL_REGISTRY` module-level object and the `_create_guardrail_row`, `_delete_guardrail_row` and `_find_team_guardrail_rows` helpers: no module state in Rust. This task creates and deletes rows through B3682's registry; `_create_guardrail_row` and `_find_team_guardrail_rows` have no caller here."
  - "`_as_str_object_mapping` and `_guardrails_table` (L80-L95): typing helpers and the repository handle, replaced by B3682's registry and `ReviewRows`."
  - "The form-field helpers `_get_field_type_from_annotation` and the rest of L1621-L1908: B6560 to B6562."
  - "get_guardrail_by_name_from_db: no caller in the routes of this task."

pitfalls:
  - "PUT and PATCH write the new values to the database before they start them in memory, so a bad configuration is rejected only after the write. The write-back on a 422 is the only repair; keep that order and do not validate first."
  - "The create rollback deletes the row only for the six configuration variants. Any other start error leaves the new row in place and still answers 200 with the guardrail id."
  - "PUT syncs memory with the row the update returned, and PATCH syncs with the merged `Guardrail` it built. The two inputs differ in `team_id` and `status`, so do not share one code path for them."
  - "PATCH treats `guardrail_info: {}` as sent and replaces the stored info with it, while `guardrail_info: null` counts as not sent."
  - "PATCH merges by the keys the client sent, so `\"default_on\": false` is a sent key and overwrites a stored true, while a key left out keeps the stored value."
  - "Approve flips the row to `active` before it checks the params, so a row with empty params ends active in the database and the call answers 500."
  - "Approve calls `initialize_guardrail`, which builds nothing when the id is already held and only rewrites the source to `db`. An approved row whose id equals a config guardrail's id does not replace its live callbacks."
  - "Delete does not filter on status, and neither does the read before it, so an admin can delete `pending_review` and `rejected` rows by id. Reject only changes the status and leaves the row."
  - "FastAPI checks the key first, then the body; a missing `guardrail` key is a 422 for an admin, and a non-admin with a bad body also gets 422, not 403."
  - "The 403 text differs between the routes: 'Admin access required to manage guardrails' for create, replace, patch and delete, and 'Admin access required' for approve and reject."
  - "The 404 text differs too: 'Guardrail with ID {id} not found' for the guardrail routes and 'Guardrail submission not found' for approve and reject."
  - "Hold the handler write lock only around the in-memory call. Awaiting the database with the lock held stalls every request that reads a callback."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
