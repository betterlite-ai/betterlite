id: B3685
title: Guardrail mutation and submission decisions
description: >-
  Build the write side of the guardrail admin API in betterlite-server: create, replace, patch and delete a guardrail row, and approve or reject a team submission. Everything goes in crates/betterlite-server/src/guardrails/admin_mutations.rs and admin_mutations/. The read routes are B3684's, register, the submission lists and the custom-code test route are B3686's, and B3687 owns the catalog and apply routes. None of them lives here.

  Routes, all behind the normal key check first. `POST /guardrails`, `PUT /guardrails/{guardrail_id}`, `PATCH /guardrails/{guardrail_id}`, `DELETE /guardrails/{guardrail_id}`, `POST /guardrails/submissions/{guardrail_id}/approve` and `POST /guardrails/submissions/{guardrail_id}/reject`. Expose `pub fn routes<R, S>(state: MutationState<R, S>) -> Router` the way the sibling modules in crates/betterlite-server/src/guardrails/ do and read their pattern first. B8667 mounts it, so do not touch app.rs. Do not register `GET /guardrails/{guardrail_id}` or `/guardrails/register`: axum panics on a duplicate method and path, and those belong to B3684 and B3686.

  State and types. `MutationState<R: GuardrailRows, S: ReviewRows>` holds `database: Option<MutationDatabase<R, S>>`, where `None` means the proxy runs without a database. `MutationDatabase` holds `Arc<GuardrailRuntime<R>>` (B3683, crates/betterlite-guardrails/src/guardrail_startup/runtime.rs: `handler()` is a `tokio::sync::RwLock<InMemoryGuardrailHandler>`, `registry()` is B3682's `GuardrailRegistry<R>`) and `Arc<S>`. Types from earlier tasks: `Guardrail`, `LitellmParams`, `BaseLitellmParams`, `PatchGuardrailRequest` with its `sent_fields()` and the decoders `decode_litellm_params` and `decode_patch_request` are B3662's (betterlite-config, sections::guardrail_params). `RegistryError`, `GuardrailRows`, `GuardrailRegistry` and the handler methods `initialize_guardrail`, `delete_in_memory_guardrail` and `sync_guardrail_from_db` are B3682's and B3683's. The admin test is B732's rule that only the exact role `proxy_admin` counts (a `proxy_admin_viewer` is refused). Read each file for exact names before you write code.

  `review_rows.rs` holds the second persistence seam, because B3682's row type leaves out `status`, `team_id` and `reviewed_at`. `ReviewRow { guardrail_id, guardrail_name, litellm_params: Option<serde_json::Value>, guardrail_info: Option<serde_json::Value>, team_id: Option<String>, status: String }`. `ReviewRows` is a trait of async methods in the `impl Future + Send` style B3682 uses: `find_unique(&self, guardrail_id: &str) -> Result<Option<ReviewRow>, ReviewRowsError>` and `set_status(&self, guardrail_id: &str, status: &str, now: DateTime<Utc>) -> Result<(), ReviewRowsError>`, which writes `status`, `reviewed_at` and `updated_at` and nothing else. `PostgresReviewRows` implements it over B726's `litellm_guardrailstable` binding (crates/betterlite-db/src/auxiliary_repository, its `table_binding_guardrailstable` case shows the handle), using the binding's `find_unique` and `update`. Write no SQL. Use the write handle B726 gives for writes so config sync publishes after the update.

  `body.rs` holds the one decoder for outside bytes, `decode_write_request(body: &[u8]) -> Result<WriteRequest, BodyError>`, used by POST and PUT. The body is `{"guardrail": {...}}`. `guardrail_name` is required text, `litellm_params` is required and goes through `decode_litellm_params`, and `guardrail_info` is an optional object or null. `guardrail_id`, `policy_template`, `created_at` and `updated_at` are accepted as `Guardrail` declares them. Unknown keys are ignored. Read it with `serde_path_to_error` over `serde_json::Deserializer::from_slice`. A failure answers 422 in FastAPI's validation shape (`detail` is a list of `{type, loc, msg, input}`); reuse the helper the sibling guardrail routes use for that body, and if none exists build `loc` as `["body", "guardrail", <path>]`. The PATCH body goes through B3662's `decode_patch_request`, with the same 422 shape and `loc` starting at `["body"]`. Add the fuzz target `guardrail_write_body` at crates/betterlite-server/fuzz/fuzz_targets/guardrail_write_body.rs feeding the same bytes to `decode_write_request` and `decode_patch_request`, with a `[[bin]]` entry in crates/betterlite-server/fuzz/Cargo.toml (`test = false`, `doc = false`, `bench = false`). Seed crates/betterlite-server/fuzz/corpus/guardrail_write_body/ with a valid create body, a valid patch body, truncated JSON, a body with a null `litellm_params` and bytes that are not UTF-8. Add `replays_the_guardrail_write_corpus` to tests.rs, shaped like `replays_the_ocr_json_body_corpus` in crates/betterlite-server/src/api/ocr_request/tests.rs. The module path to `decode_write_request` must be `pub` for the fuzz crate.

  Order of every route, which the tests pin: key check (401), then body validation (422, only for POST, PUT and PATCH), then the admin test (403, detail "Admin access required to manage guardrails" for the four guardrail routes and "Admin access required" for approve and reject), then a missing database (500, detail "Prisma client not initialized"), then the work. Every unexpected error inside the work becomes 500 with the error text as `detail`; an HTTP error raised inside passes through unchanged.

  `create.rs`, `POST /guardrails` (create_guardrail, L335-L441). Call `registry.add_guardrail_to_db(&guardrail, now)`. Then take the handler write lock and call `initialize_guardrail(guardrail_with_id, Db)`; never hold the lock across the database call. When initialization fails with a configuration error, delete the row (`registry.delete_guardrail_from_db`), log a warning "Rollback failed for guardrail '{id}': {error}" if that delete fails, and answer 400 with detail "Guardrail configuration error: {error}". The configuration errors are exactly the `RegistryError` variants `Unsupported`, `MissingGuardrailType`, `ScanOnlyUnsupported`, `ScanOnlyWithSkipTool`, `Base` and `InitFailed` (LiteLLM's ValueError and TypeError; the custom code compile error of B3803 joins them if the registry ever returns it, see the notes). Any other initialization error only logs a warning "Immediate sync: Failed to initialize guardrail '{name}' (ID: {id}) in memory: {error}" and the route still answers 200. A success logs at info "Immediate sync: Successfully initialized guardrail '{name}' (ID: {id})". The body of the 200 is the request guardrail plus the new `guardrail_id`: the keys the client sent (`guardrail_name`, `litellm_params`, `guardrail_info` only when sent), and nothing from the row, so no timestamps. A database error is 500 and is logged with "Error adding guardrail to db: {error}".

  `replace.rs`, `PUT /guardrails/{guardrail_id}` (update_guardrail, L444-L565). Read the row with `registry.get_guardrail_by_id_from_db`; none gives 404 with detail "Guardrail with ID {guardrail_id} not found". Call `update_guardrail_in_db(id, request.guardrail, now)`. Then take the write lock and call `sync_guardrail_from_db` with the updated row as a `Guardrail`. A configuration error (the same six variants) writes the previously read guardrail back with `update_guardrail_in_db` and answers 422 with detail "Invalid guardrail configuration, update rejected: {error}". If the write-back itself fails, that error ends in the outer 500. Any other error from the sync logs a warning "Immediate sync: Failed to update '{name}' (ID: {id}) in memory: {error}" and the route answers 200. The 200 body is the updated row as the database returned it: `guardrail_id`, `guardrail_name`, `litellm_params`, `guardrail_info`, `team_id`, `created_at`, `updated_at`, `status`, `submitted_at`, `reviewed_at`. Build it with the `Guardrail` fields B3682 returns plus the extra columns from `ReviewRows::find_unique` read after the update; if that second read makes the route cost two reads, say so in the code comment and keep it.

  `patch.rs`, `PATCH /guardrails/{guardrail_id}` (patch_guardrail, L1129-L1294). Read the row (404 text as above). `guardrail_name` is the request's when sent (not null), else the stored one, and `guardrail_name or ""` when both are missing. The params start as the stored `litellm_params` decoded through `decode_litellm_params`. When the request sent `litellm_params`, merge in only the keys the client sent (`sent_fields()` of B3662, which stands in for pydantic's `exclude_unset`) over the stored keys, then decode again; a decode error answers 422 with detail "Invalid guardrail configuration, update rejected: {error}". `guardrail_info` is the request's when sent (an empty object counts as sent), else the stored one, else `{}`. Write with `update_guardrail_in_db`, then sync with the merged `Guardrail` (not the row), and the rollback on a configuration error writes back the stored name, stored params and stored info and answers 422 with the same detail. The log line on a database error is "Error updating guardrail: {error}". The 200 body is the same row as PUT.

  `delete.rs`, `DELETE /guardrails/{guardrail_id}` (delete_guardrail, L567-L693). Read the row (404 text as above), call `delete_guardrail_from_db`, then `delete_in_memory_guardrail` under the write lock. Rust's removal cannot fail, so the warning branch is not built. The info log is "Immediate sync: Successfully removed guardrail 'Unknown' (ID: {id}) from memory" (LiteLLM logs 'Unknown' because the delete result holds only the message). The body is `{"message": "Guardrail {id} deleted successfully"}`. The by-id read has no status filter, so a `pending_review` or `rejected` row is deleted too.

  `review.rs`, approve (L1004-L1083) and reject (L1085-L1127). Both read `ReviewRows::find_unique`; none gives 404 "Guardrail submission not found", and a status other than `pending_review` gives 400 "Guardrail is not pending review (status={status})". Reject calls `set_status(id, "rejected", now)` and answers `{"guardrail_id", "status": "rejected", "message": "Guardrail rejected"}`; memory is not touched. Approve calls `set_status(id, "active", now)` first. Only then does it read the stored params: `parse_json_object(value)` returns the object for a JSON object or for text that parses to a JSON object, and `None` otherwise (this file keeps its own private copy, since LiteLLM's `_parse_json_field` belongs to B3686's file). An empty or missing params object answers 500 "Guardrail litellm_params is missing or invalid" after the row is already active, and nothing is rolled back. Otherwise build a `Guardrail` from the row (`guardrail_id`, `guardrail_name`, params decoded through `decode_litellm_params`, `guardrail_info` or `{}`, and `team_id` from the row, which B3662's `Guardrail` record carries), take the write lock and call `initialize_guardrail(guardrail, Db)`. Success answers `{"guardrail_id", "status": "active", "message": "Guardrail approved"}` and logs "Approved guardrail {name} (ID: {id}) and initialized in memory". Any initialization error, including a params decode error, logs a warning "Failed to initialize approved guardrail {id} in memory: {error}" and answers 200 with the same three keys plus `warning`: "Guardrail was marked active but failed to initialize in memory: {error}. It will be picked up on the next sync cycle." Logged errors for the outer 500 are "Error approving guardrail submission: {error}" and "Error rejecting guardrail submission: {error}". Error text never holds a parameter value, since the params carry keys: show only B3662's field path.

  Oracle. The HTTP cases boot LiteLLM and betterlite without a database and compare status, headers and body. They cover the key check, body validation and the missing database (the master key counts as `proxy_admin`). Non-admin 403, every database branch, the rollbacks and the memory effects are covered by the named Rust tests with fake `GuardrailRows` and `ReviewRows` implementations and a fake auth context.

