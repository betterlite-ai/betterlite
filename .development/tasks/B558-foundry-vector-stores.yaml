  why: >-
    Own AzureAIVectorStoreConfig.__init__, AzureAIVectorStoreConfig.get_vector_store_endpoints_by_type, AzureAIVectorStoreConfig.get_auth_credentials,
    AzureAIVectorStoreConfig.validate_environment, AzureAIVectorStoreConfig.get_complete_url, AzureAIVectorStoreConfig.transform_search_vector_store_request,
    AzureAIVectorStoreConfig.atransform_search_vector_store_request, AzureAIVectorStoreConfig._search_request, AzureAIVectorStoreConfig.transform_search_vector_store_response,
    AzureAIVectorStoreConfig.transform_create_vector_store_request, AzureAIVectorStoreConfig.transform_create_vector_store_response.
    Other functions in this file remain with the owners listed below.
