id: B558
title: Foundry Azure AI Search vector queries
description: >-
  Add AzureSearchStoreRequest/Reply for endpoint-by-store-type resolution, search payload options, vectorQueries
  and retrieval results. Supply any query embedding as an injected existing embedding executor rather than importing
  an upper pipeline into the leaf provider. Preserve source citations/document metadata and unsupported create behavior.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/vector_stores/transformation.py:
  AzureAIVectorStoreConfig.__init__ L41-L42; AzureAIVectorStoreConfig.get_vector_store_endpoints_by_type L44-L71;
  AzureAIVectorStoreConfig.get_auth_credentials L73-L82; AzureAIVectorStoreConfig.validate_environment L84-L87;
  AzureAIVectorStoreConfig.get_complete_url L89-L112; AzureAIVectorStoreConfig.transform_search_vector_store_request
  L114-L135; AzureAIVectorStoreConfig.atransform_search_vector_store_request L137-L158; AzureAIVectorStoreConfig._search_request
  L161-L180; AzureAIVectorStoreConfig.transform_search_vector_store_response L182-L259; AzureAIVectorStoreConfig.transform_create_vector_store_request
  L261-L266; AzureAIVectorStoreConfig.transform_create_vector_store_response L268-L269.


  Implement crates/betterlite-foundry/src/vector_stores.rs with adjacent tests under vector_stores/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation foundry_vector_stores in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function vector_stores_cases in betterlite-foundry with these exact named cases (one per oracle file):
  store_type_endpoints, auth_credentials, search_query_fields, vector_query_with_embedding, document_score_citation,
  unsupported_store_create. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream
  request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_vector_stores* using HelperCase: kind:
  helper and the externally tagged foundry_vector_stores variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_vector_stores that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_azure_search_reply consumes Azure AI Search JSON response bytes in crates/betterlite-foundry/src/vector_stores.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_vector_stores.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_vector_stores.
  The adjacent test replays_the_foundry_vector_stores_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 188 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 473 planned, 475 maximum changed lines.
