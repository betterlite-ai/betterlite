out_of_scope:
- B026 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_vector_stores in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/vector_stores.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_vector_stores.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Metadata exclusion always removes the literal contentVector, even when azure_search_vector_field names a different
  vector column.
- The index ID is interpolated without path encoding in this source; adding encoding silently would alter the captured
  request.
