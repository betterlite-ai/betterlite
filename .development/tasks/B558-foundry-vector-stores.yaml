id: B558
title: Foundry Azure AI Search vector queries
description: >-
  Add AzureSearchStoreRequest/Reply for endpoint-by-store-type resolution, search payload options, vectorQueries
  and retrieval results. Supply any query embedding as an injected existing embedding executor rather than importing
  an upper pipeline into the leaf provider. Preserve source citations/document metadata and unsupported create behavior.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/vector_stores/transformation.py:
  AzureAIVectorStoreConfig.__init__ L41-L42; AzureAIVectorStoreConfig.get_vector_store_endpoints_by_type L44-L71;
  AzureAIVectorStoreConfig.get_auth_credentials L73-L82; AzureAIVectorStoreConfig.validate_environment L84-L87;
  AzureAIVectorStoreConfig.get_complete_url L89-L112; AzureAIVectorStoreConfig.transform_search_vector_store_request
  L114-L135; AzureAIVectorStoreConfig.atransform_search_vector_store_request L137-L158; AzureAIVectorStoreConfig._search_request
  L161-L180; AzureAIVectorStoreConfig.transform_search_vector_store_response L182-L259; AzureAIVectorStoreConfig.transform_create_vector_store_request
  L261-L266; AzureAIVectorStoreConfig.transform_create_vector_store_response L268-L269.


  Named case contracts: store_type_endpoints: Read map is GET /indexes/ plus POST /docs/search,/docs/suggest,/docs/autocomplete,/analyze;
  write map is POST /docs/index. These are literal substring patterns, not placeholders. Exercise the B1058 consumer
  with write classification first, including an index named analyze, so batch writes cannot gain a read classification.
  auth_credentials: get_auth_credentials rejects only api_key=None with ValueError api_key is required and returns
  api-key otherwise, including empty. Environment validation calls B2200 then overwrites Content-Type=application/json.
  search_query_fields: Use B1059 query_text/embed_query or aembed_query first. Set logging input,embedding_model=litellm_embedding_model,top_k;
  top_k defaults10 only when absent and vector field defaults contentVector only when absent. Body is search=*,
  vectorQueries=[{vector,fields,kind:vector,k:top_k}], select=id,content, top=top_k. Ignore extra_body and other
  search options. vector_query_with_embedding: Use the injected B1059 embedding executor and preserve query-vector
  order; URL is <api_base>/indexes/<vector_store_id>/docs/search?api-version=2024-07-01 with literal unencoded vector_store_id,
  not B206 segment encoding. document_score_citation: Missing value defaults []; per result default id/content to
  empty and @search.score to0.0, emit one text content, file_id=id, filename=Document <id>, copy metadata except
  id/content/contentVector/@search.score and overwrite document_id=id. Return object=vector_store.search_results.page
  with logging input default empty as search_query. unsupported_store_create: Both create request and response raise
  bare NotImplementedError. Search JSON/type/validation failures are caught and rethrown through B1058 get_error_class
  with str(error), original response status and headers, even a 200 status. azure_search_endpoint: Truthy api_base
  is trimmed and returned; otherwise require truthy litellm_params.azure_search_service_name or the Azure AI Search
  service name is required diagnostic naming the setting/api_base. Construct https://<name>.search.windows.net literally.


  Load azure_search_service_name, azure_search_vector_field through betterlite-config, with injected environment
  lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest foundry_vector_store_config_cases; each named loads_<key> case invokes the real B002 loader,
  checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Write standalone Rust test foundry_vector_store_credential_identity_isolation in betterlite-foundry: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test foundry_vector_store_secret_safe_failure in betterlite-foundry: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-foundry/src/vector_stores.rs with adjacent tests under vector_stores/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function vector_stores_cases in betterlite-foundry with these exact named cases (one per oracle file):
  store_type_endpoints, auth_credentials, search_query_fields, vector_query_with_embedding, document_score_citation,
  unsupported_store_create, azure_search_endpoint. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_vector_stores* using HelperCase: kind:
  helper and the externally tagged foundry_vector_stores variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_vector_stores that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_azure_search_reply consumes Azure AI Search JSON response bytes in crates/betterlite-foundry/src/vector_stores.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_vector_stores.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_vector_stores.
  The adjacent test replays_the_foundry_vector_stores_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 188 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 200 production lines, 235 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 45 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
