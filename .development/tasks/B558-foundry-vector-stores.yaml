checks:
  optional:
  - mutants
  commands:
  - id: case-store-type-endpoints
    why: Read map is GET /indexes/ plus POST /docs/search,/docs/suggest,/docs/autocomplete,/analyze; write map is
      POST /docs/index. These are literal substring patterns, not placeholders. Exercise the B1058 consumer with
      write classification first, including an index named analyze, so batch writes cannot gain a read classification.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_store_type_endpoints$/)'
  - id: case-auth-credentials
    why: get_auth_credentials rejects only api_key=None with ValueError api_key is required and returns api-key
      otherwise, including empty. Environment validation calls B2200 then overwrites Content-Type=application/json.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_auth_credentials$/)'
  - id: case-search-query-fields
    why: Use B1059 query_text/embed_query or aembed_query first. Set logging input,embedding_model=litellm_embedding_model,top_k;
      top_k defaults10 only when absent and vector field defaults contentVector only when absent. Body is search=*,
      vectorQueries=[{vector,fields,kind:vector,k:top_k}], select=id,content, top=top_k. Ignore extra_body and other
      search options.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_search_query_fields$/)'
  - id: case-vector-query-with-embedding
    why: Use the injected B1059 embedding executor and preserve query-vector order; URL is <api_base>/indexes/<vector_store_id>/docs/search?api-version=2024-07-01
      with literal unencoded vector_store_id, not B206 segment encoding.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_vector_query_with_embedding$/)'
  - id: case-document-score-citation
    why: Missing value defaults []; per result default id/content to empty and @search.score to0.0, emit one text
      content, file_id=id, filename=Document <id>, copy metadata except id/content/contentVector/@search.score and
      overwrite document_id=id. Return object=vector_store.search_results.page with logging input default empty
      as search_query.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_document_score_citation$/)'
  - id: case-unsupported-store-create
    why: Both create request and response raise bare NotImplementedError. Search JSON/type/validation failures are
      caught and rethrown through B1058 get_error_class with str(error), original response status and headers, even
      a 200 status.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_unsupported_store_create$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_vector_stores.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_vector_stores*")"
      && grep -lq 'foundry_vector_stores' tools/oracle/fuzz/corpus/helper_case/foundry_vector_stores* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_vector_stores$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_vector_stores)"
      && grep -q 'decode_azure_search_reply' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_vector_stores.rs
      && cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_vector_stores_corpus$/)'
  - id: case-azure-search-endpoint
    why: Truthy api_base is trimmed and returned; otherwise require truthy litellm_params.azure_search_service_name
      or the Azure AI Search service name is required diagnostic naming the setting/api_base. Construct https://<name>.search.windows.net
      literally.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::vector_stores_cases::case_[0-9]+_azure_search_endpoint$/)'
  - id: config-azure-search-service-name
    why: azure_search_service_name lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::foundry_vector_store_config_cases::case_[0-9]+_loads_azure_search_service_name$/)'
  - id: config-azure-search-vector-field
    why: azure_search_vector_field lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::foundry_vector_store_config_cases::case_[0-9]+_loads_azure_search_vector_field$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_vector_store_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::foundry_vector_store_secret_safe_failure$/)'
