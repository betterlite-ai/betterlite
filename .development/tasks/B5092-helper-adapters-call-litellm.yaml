id: B5092
title: Oracle helper adapters call LiteLLM
description: >-
  Five oracle helper adapters in tools/oracle/helpers are Python written for the oracle and never import litellm:
  b3973.py (Opik, from B3973), codex_history_tools.py (B2410), file_type_records.py (B1128), model_fields.py (B205)
  and price_fields.py (B204). Their cases compare betterlite with that Python and prove nothing about LiteLLM, so
  .ast-grep/rules/helper-imports-litellm.yml lists them under ignores. This task rewrites b3973.py,
  codex_history_tools.py and file_type_records.py to import litellm and call the LiteLLM functions their cases are
  about, fixes the native code where LiteLLM answers differently, and deletes the model_fields and price_fields
  operations, since LiteLLM has no function that does what they test. Behavior that leaves the oracle moves to named
  Rust unit tests next to the native code. Then the five files come off the ignores list.


  Rules for every rewritten adapter. Each keeps its operation name and, where it can, its input shape. The Python
  result goes through json.loads(json.dumps(...)) the way model_metadata_projection.py does, so tuples come back as
  lists. B5091 lands first, so a helper comparison skips the error class, the error message and warning messages,
  and compares ok, the value and the error's status, type, param and code. dispatch.py sets all four to null for a
  Python exception, so every native helper error here keeps them null too. The Rust modules
  tools/oracle/src/helpers/logging/b3973.rs, core_ops/codex_history_tools.rs and openai/file_type_records.rs call the
  native function that matches the LiteLLM function the Python side calls, and decode their input into typed structs
  or an enum tagged on the function or operation field instead of reading serde_json::Value by hand.


  Opik uuid (function uuid, case uuid7-generation.yaml, input unchanged). Python calls create_uuid7 from
  litellm.integrations.opik.utils, parses the text with uuid.UUID and returns {version, variant, canonical}: the
  version number, bytes[8] >> 6, and whether str() of the parsed UUID equals the text create_uuid7 returned. Rust
  does the same with betterlite_logging::opik::uuid7::create_uuid7, Uuid::get_version_num, as_bytes()[8] >> 6 and
  the hyphenated text. Both sides answer {version: 7, variant: 2, canonical: true}.


  Opik config (function config). The input becomes {environment, config_file, lookups} where environment maps env
  names to values, config_file is the text of an Opik config file or absent, and each lookup is {key, user, default}
  with user and default optional. The answer is {values: [...]}, one entry per lookup in order, null when nothing
  answers. Python makes a tempfile.TemporaryDirectory, writes config_file into a file there with
  write_text(encoding="utf-8", newline="") when it is given, patches litellm.integrations.opik.utils.CONFIG_FILE_PATH_DEFAULT
  to that file (to a path in the same folder that does not exist when config_file is absent), and inside
  unittest.mock.patch.dict(os.environ, environment, clear=True) calls get_opik_config_variable(key, user, default) for
  each lookup. LiteLLM returns the user value when it is not None, then the env var OPIK_ plus the key in upper case,
  then the key from the file's opik section, then the default. It reads and parses the file only when the user value
  and the env var are both None, and does it again on every such lookup, so a broken file fails only a lookup that
  reaches it. The file holds nothing but the case's own text, so the oracle cache key still covers everything the
  helper reads.


  Native config changes in crates/betterlite-logging/src/opik/config.rs. get_config_variable becomes
  get_config_variable(key, user_value, environment, config_file: Option<&str>, default_value) -> Result<Option<String>,
  ConfigFileError>. It keeps the order above, parses config_file only when the user value and the env var give
  nothing, and looks the key up exactly as given: the parser lowercases keys, so an upper-case key never matches the
  file. read_config_section moves to a new module crates/betterlite-logging/src/opik/config_file.rs (add pub mod
  config_file; to opik.rs) as read_config_section(contents: &str) -> Result<BTreeMap<String, String>,
  ConfigFileError>, and reads text the way CPython 3.13's configparser.ConfigParser() with its defaults reads a file.
  ConfigFileError is a thiserror enum in that module with one variant per failure below, and its messages name the
  section, the option or the line number and never a value, since the file holds API keys. If config_file.rs grows
  past 300 lines, put interpolation in config_file/interpolate.rs.


  The parser rules, from CPython 3.13 configparser. Lines end at \n, \r\n or a lone \r. A line whose stripped text
  starts with # or ; is a comment: it is skipped, adds nothing to a value and changes no state. There are no inline
  comments, so a # or ; inside a value stays. An empty line adds an empty line to the current option's value. A line
  indented deeper than the line that started the current option continues that value with its stripped text, and
  this is decided before the header check, so a deeper-indented [x] is value text. Otherwise a line whose stripped
  text starts with [ and has a ] after at least one more character is a section header: the name is the text between
  the first [ and the last ], case-sensitive, and text after that ] is ignored. A line before any header fails at
  once. [DEFAULT] may appear more than once, and any other section that appears twice fails at once. Any other line is an option: the key is the text
  before the first = or :, right-trimmed and lowercased, and the value is the rest, stripped. A line with no = or :
  and a line with an empty key fail once the whole text is read. A key repeated in one section fails at once, and
  that counts the blocks of a repeated [DEFAULT] as one section. A value's lines join with \n and trailing
  whitespace is trimmed. Then every section other than DEFAULT takes DEFAULT's options under its own and each value
  is interpolated. %% becomes %. %(name)s becomes the merged value of the lowercased name, interpolated again when
  that value holds a %, and nesting deeper than 10 fails. A missing name fails, and any other % fails, a trailing %
  or %(name) without s included. LiteLLM builds every section's items before it picks opik, so a bad % in any
  section, or in DEFAULT when some section exists, fails the read, while a file that has only DEFAULT reads as empty.
  read_config_section returns the section named exactly opik with DEFAULT merged in, or an empty map.


  Opik usage. LiteLLM's create_usage_object reads a Usage object, and Usage turns an absent or null prompt_tokens,
  completion_tokens or total_tokens into 0 and does not compute the total. So the span's usage always has all three
  keys. Change create_usage_object in config.rs so each of the three keys is present, with 0 for an absent or null
  count and the given value otherwise.


  Opik metadata (function metadata). The input becomes {litellm_metadata, standard_logging_metadata} and the answer
  {metadata}. Python calls extract_opik_metadata from litellm.integrations.opik.opik_payload_builder.extractors, and
  Rust calls betterlite_logging::opik::metadata::extract_opik_metadata. metadata-merging.yaml carries the three
  sources the old case merged by hand: litellm_metadata {opik: {project_name: request, tags: [r]}} and
  standard_logging_metadata {user_api_key_auth_metadata: {opik: {project_name: auth, auth_only: a}},
  requester_metadata: {opik: {project_name: requester}}}. The new metadata-missing-sections.yaml sends
  litellm_metadata {} and standard_logging_metadata {user_api_key_auth_metadata: null, requester_metadata: {opik:
  null}}, and both sides answer {metadata: {}}.


  Opik payload (function payload). The input becomes {project_name, trace_id, parent_span_id, response, input, output,
  metadata, tags, provider, cost}. Python builds usage with create_usage_object(Usage(**response["usage"])) from
  litellm.types.utils, calls build_span_payload from litellm.integrations.opik.opik_payload_builder.payload_builders
  with start 2026-01-01T00:00:00Z and end 2026-01-01T00:00:01Z as UTC datetimes, passes [dataclasses.asdict(span)]
  through get_traces_and_spans_from_payload, takes the one span and drops id, start_time and end_time. Rust calls
  betterlite_logging::opik::payload::build_span_payload with the same window and drops the same three keys. The id is
  random, and timestamp fraction digits are not in the contract. payload-construction.yaml sends project_name p,
  trace_id trace, parent_span_id parent, response {model: test-model, object: chat.completion, created: 42, usage:
  {prompt_tokens: 3, completion_tokens: null}}, input {q: 1}, output {a: 2}, metadata {k: v}, tags [t], provider
  openai and cost 0.5, and the span's usage is {completion_tokens: 0, prompt_tokens: 3, total_tokens: 0}.


  Opik config cases, all with ASCII text and \n line ends. config-resolution.yaml becomes environment
  {OPIK_URL_OVERRIDE: env, OPIK_WORKSPACE: ""}, config_file "[opik]\nurl_override = file\nproject_name = team\n" and
  lookups for: url_override with user "user" (user wins), url_override (env wins), workspace with default "d" (the
  empty env value wins), project_name with default "d" (the file), api_key with default "d" (the default) and api_key
  (null). New config-file-ini-forms.yaml has a [DEFAULT] section with project_name = base, an [OPIK] section that is
  ignored, and an [opik] section with URL_OVERRIDE: https://host/api, api_key = first followed by a comment line and
  an indented second line, note = 100%% %(project_name)s, and comment lines starting with # and ;. Its lookups
  url_override, api_key, note, project_name and URL_OVERRIDE answer https://host/api, "first\nsecond", "100% base",
  base and null. New config-file-duplicate-key.yaml has url_override = a and URL_OVERRIDE = b in [opik] and fails. New
  config-file-bad-percent.yaml has [other] with broken = 50% plus a valid [opik], and a lookup that reaches the file
  fails. New config-file-unread-when-answered.yaml sends the same broken file with every lookup answered by a user
  value or an env var, and succeeds.


  Opik native tests. In crates/betterlite-logging/src/opik/tests/config.rs (opik_config_tests),
  config_priority_and_partial_usage gives way to config_priority_reads_the_file_last (user, env, file, default and
  none, with the file given as text), usage_object_fills_missing_counts_with_zero (absent, null and present counts)
  and config_lookup_skips_a_bad_file_when_answered (a broken file and a lookup the user value or env var answers is
  Ok). The two parser tests there import read_config_section from config_file and take its Result. Add
  crates/betterlite-logging/src/opik/tests/config_file.rs, mounted in src/opik/tests.rs as #[path =
  "tests/config_file.rs"] mod opik_config_file_tests;, with tests whose names start with config_file_ for a line before
  any header, a line without = or :, an empty key, a repeated section, a key repeated across two [DEFAULT] blocks,
  nesting past 10, a missing name, a trailing %, a bad % only in DEFAULT with and without another section, a header
  with text after its ], a deeper-indented [x] that continues a value, a lone \r line end, and an upper-case section
  name that is not opik. Each failure test also checks that the error text holds no value from the file. Add a
  cargo-fuzz target crates/betterlite-logging/fuzz/fuzz_targets/opik_config_file.rs that passes valid UTF-8 input to
  read_config_section, its [[bin]] entry in crates/betterlite-logging/fuzz/Cargo.toml next to otlp_decode, a committed
  corpus under crates/betterlite-logging/fuzz/corpus/opik_config_file with one file per rule above, and an rstest
  config_file_replays_the_corpus in tests/config_file.rs that reads every corpus file with
  #[files("fuzz/corpus/opik_config_file/*")] and runs it through read_config_section. In tests/payload.rs,
  span_payload_links_trace_and_strips_nulls now expects all three usage keys.


  Codex history (operation codex_history_tools). Python imports normalize_codex_input_items and drop_unsupported_tools
  from litellm.llms.base_llm.responses.codex_compat and hoist_additional_tools from litellm.responses.additional_tools.
  normalize answers {input, rewritten_types}, drop_unsupported_tools answers {tools, dropped_types} (supported_types
  passes as a frozenset), and hoist_additional_tools answers {input, tools, hoisted}, with tools passed as None when
  the case has none. Both sides parse the arguments string of each function_call item in a normalize answer as JSON
  before they return it, since json.dumps spacing and escaping are not in the contract. The answer drops debug: LiteLLM's
  HoistedAdditionalTools has only input, tools and hoisted, its line is a verbose_logger.debug call, and log text is
  betterlite's own. The native HoistedAdditionalTools keeps its debug field, and its unit test
  hoists_vendor_tools_and_keeps_existing_order keeps checking it. The Rust Input becomes an enum tagged on operation
  (normalize {input}, drop_unsupported_tools {tools, supported_types}, hoist_additional_tools {input, tools}).
  additional-tools.yaml, additional-tools-malformed.yaml, unsupported-tools.yaml and compaction-shell.yaml keep their
  inputs. agent-history.yaml sends string text only: content [{type: output_text, text: a}, {encrypted_content: b},
  {text: c, encrypted_content: ignored}, 7] plus an item {type: other, value: kept}, and the message text is abc.
  regressions.yaml sends an agent_message without content (dropped), a local_shell_call c1 whose action has a command
  [echo, a word with an accented letter and an emoji] and an env whose LANG value is non-ASCII, a local_shell_call c2
  without action (arguments {}), a local_shell_call without call_id (dropped), and no stray tools key. The old inputs
  text: 0, text: [] and the ensure_ascii arguments test Python truthiness and json.dumps formatting. The contract
  leaves both out, and the native tests normalizes_and_reports_dropped_codex_items,
  agent_message_uses_fallback_after_empty_container and local_shell_arguments_escape_non_ascii_like_python_json
  already cover them. The native codex code does not change.


  File types (operation file_type_records). Python imports FileType, get_file_mime_type_from_extension,
  get_file_extension_from_mime_type and is_gemini_1_5_accepted_file_type from litellm.types.files and deletes its
  copied tables. mime_extension_table answers [{extension, mime}], mime_lookup_edges answers {extensions: [mime per
  extension], mimes: [extension per mime]}, and gemini_file_acceptance answers [is_gemini_1_5_accepted_file_type(FileType(name))
  per name]. An unknown extension or mime raises ValueError. The Rust Input takes function as an enum and file_types
  as Vec<FileType> through FileType's own serde names (3GPP included), so parse_file_type goes away, and a
  FileTypeError becomes the helper error. The three cases keep their inputs. New mime-lookup-unknown-extension.yaml
  sends mime_extension_table with extensions [exe] and new mime-lookup-unknown-mime.yaml sends mime_lookup_edges with
  mimes [application/x-unknown]; both fail on both sides. The native file type code does not change.


  Model fields (operation model_fields) has no LiteLLM counterpart: LiteLLM keeps a catalog entry as a plain dict and
  types nothing. The fields its callers read come out of _get_model_info_helper, and the model_metadata_projection
  helper already calls it. Delete tools/oracle/helpers/model_fields.py,
  tools/oracle/src/helpers/models/model_fields.rs and model_fields/tests.rs, the "model_fields" entries in dispatch.py
  OPERATIONS and in tools/oracle/src/helpers/models.rs (that line also holds model_metadata_projection, keep it), the
  eight seeds tools/oracle/fuzz/corpus/helper_case/model_fields-*.yaml, and tools/oracle/cases/helpers/model-fields.
  limits, provider-mode, omitted-false and reasoning-levels move to two new model_metadata_projection cases in
  tools/oracle/cases/helpers/providers/model-metadata-projection with key fixture/model, model fixture/model and
  provider fixture: metadata-limits-and-flags.yaml (entry litellm_provider fixture, mode chat, max_input_tokens
  128000, max_output_tokens 16384, rpm 10000, supports_vision false, supports_function_calling true) and
  metadata-reasoning-levels.yaml (entry default_reasoning_effort low, reasoning_effort_levels [low, medium, high],
  bedrock_output_config_effort_ceiling xhigh). documentation-entry is typed parsing LiteLLM never does, and the native
  test the_documentation_sample_entry_fails_typed_parsing covers it. runtime-unknown-field returns a key list
  LiteLLM never builds, and runtime_parsing_accepts_an_unknown_field_and_warns_with_its_path covers it.
  modalities-regions reads supported_modalities, and no LiteLLM reader projects it; regions belong to B2225's
  get_supported_regions, and the modalities_and_regions rstest case covers the parsing. For fallback-generalizations,
  LiteLLM's _finalize_model_cost_map pops the block out of the map and hands its rules to the fallback_generalizations
  module untyped. The catalog-generalizations cases already call that module, and the native test
  fallback_generalization_rules_type_their_declaration_without_executing_it covers the typed parse. In crates/betterlite-models/src/entry/tests.rs add a test reasoning_levels_keep_values that parses the old
  reasoning-levels entry and asserts default_reasoning_effort low, reasoning_effort_levels [low, medium, high] and
  bedrock_output_ceiling xhigh.


  Price fields (operation price_fields) has no LiteLLM counterpart either: LiteLLM reads prices as JSON floats, while
  the old adapter parsed the source lexeme with Decimal to check betterlite's exact decimals against itself. Delete
  tools/oracle/helpers/price_fields.py, tools/oracle/src/helpers/models/price_fields.rs and price_fields/tests.rs, the
  "price_fields" entries in dispatch.py OPERATIONS and in models.rs, the seeds price_fields-fraction.yaml and
  price_fields-nested.yaml, and tools/oracle/cases/helpers/price-fields. Port each of its six cases to
  crates/betterlite-models/src/price_fields/tests.rs. fraction is already the exact_digits rstest case. Add one test
  per other case, each asserting every parsed field of its source: price_case_absent_optional_fields_stay_default,
  price_case_exponent_and_trailing_zero_keep_their_value (output_cost_per_token 1.2e-7 and cost_per_second 0.0050),
  price_case_nested_and_sample_prices_keep_every_field, price_case_tier_keeps_every_price_and_range and
  price_case_off_peak_keeps_windows_and_prices, with the source text of the case of the same name. In
  docs/deviations/B204.yaml, entry 1's why drops the clause about the Python adapter.


  The rule. Take the five files off the ignores list of .ast-grep/rules/helper-imports-litellm.yml so only
  tools/oracle/helpers/dispatch.py stays, and change the note to say that dispatch.py routes requests and is exempt.
  ast-grep scan of tools/oracle/helpers with that rule must find nothing. Run ruff and basedpyright on the helpers.


  dispatch.py and models.rs are shared registry files that worker.md says a helper task leaves alone. This task is
  the named exception: it removes exactly the two operations above from both and changes nothing else in them.
