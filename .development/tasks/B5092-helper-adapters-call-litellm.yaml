deviations: []
out_of_scope:
- OpikLogger and build_opik_payload end to end, callback delivery and the client choice; B3974 owns them.
- A response without a usage object; LiteLLM raises AttributeError there, so no case sends one.
- The warning for a tags header in opik/metadata.rs; this task does not touch the header path.
- Python habits in the native codex code (the text 0 and text [] fallbacks, ensure_ascii arguments); the native tests keep them as they are.
- get_supported_regions and region filtering; B2225 owns them.
- HTTP cases for Opik, codex or file uploads.
- Any other helper operation, and every dispatch.py or models.rs line besides the two removed operations.
pitfalls:
- The Python config adapter writes only the case's config_file text into its temp file, so the oracle cache key stays valid; never let it read the real ~/.opik.config.
- Create the TemporaryDirectory before patch.dict(os.environ, environment, clear=True), since tempfile reads TMPDIR from the environment.
- Parse the file lazily on the native side too; config-file-unread-when-answered fails if the parser runs before the user value and env var are checked.
- Interpolate every section, not just opik; config-file-bad-percent puts its bad % in another section.
- Section names are case-sensitive while option keys are lowercased, so [OPIK] is a different section and URL_OVERRIDE in the file is url_override.
- A deeper-indented line continues the current value before any header check, and a comment line between value lines adds nothing to the value.
- Keep config text in the cases ASCII with \n line ends; the lone \r and other line ends go in native tests.
- ConfigFileError messages must never carry a value from the file, since the file holds API keys.
- Usage turns a null count into 0 and does not add up total_tokens, so total_tokens stays 0 when only the other two are given.
- Compare function_call arguments parsed on both sides, never as text.
- models.rs line 17 also registers model_metadata_projection; remove only the model_fields pair.
- B5091 edits tools/oracle/cases/helpers/model-fields/documentation-entry.yaml before this task deletes the folder; delete it anyway.
- B3974 calls get_config_variable later, so keep its new signature and error type plain and documented in the module.
