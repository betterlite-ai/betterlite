dod:
- text: >-
    b3973.py, codex_history_tools.py and file_type_records.py import litellm and call the LiteLLM functions named in
    the description, the five files are off the rule's ignores list, the note names only dispatch.py, ast-grep finds
    nothing, and ruff and basedpyright pass on the helpers.
  proof:
  - helper-imports
  - helper-python
- text: >-
    The model_fields and price_fields operations are gone: no adapter, no Rust module, no registry or dispatch entry,
    no seed and no case folder.
  proof:
  - removed-operations
- text: >-
    get_config_variable takes the config file text, answers user, env, file, default in that order, parses the file
    only when user and env give nothing, and create_usage_object always returns the three counts with 0 for an absent
    or null one.
  proof:
  - opik-config
- text: >-
    read_config_section follows CPython 3.13 configparser defaults for comments, continuations, headers, DEFAULT,
    delimiters, lowercased keys, duplicates and interpolation, and its errors never carry a value.
  proof:
  - config-file-tests
- text: The Opik config parser has a cargo-fuzz target with a committed corpus, and a normal test replays every corpus file.
  proof:
  - config-file-corpus
- text: >-
    The behavior the deleted operations tested lives in named native tests: five price_case_ tests in
    price_fields/tests.rs and reasoning_levels_keep_values in entry/tests.rs.
  proof:
  - model-tests
- text: Every kept, rewritten and new case under oracle_cases matches LiteLLM.
  proof:
