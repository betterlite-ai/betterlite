checks:
  optional: [mutants]
  commands:
  - id: helper-imports
    why: a moved adapter is still on the ignores list, the note still names it, or an adapter does not import litellm
    run: |-
      test "$(grep -c '^  - tools/oracle/helpers/[a-z0-9_]*\.py$' .ast-grep/rules/helper-imports-litellm.yml)" = 1 && grep -qx '  - tools/oracle/helpers/dispatch.py' .ast-grep/rules/helper-imports-litellm.yml && ! grep -qE 'predate|b3973|codex_history_tools|file_type_records|model_fields|price_fields' .ast-grep/rules/helper-imports-litellm.yml && ast-grep scan --rule .ast-grep/rules/helper-imports-litellm.yml tools/oracle/helpers
  - id: helper-python
    why: the rewritten adapters fail ruff or basedpyright
    run: |-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: removed-operations
    why: a piece of the model_fields or price_fields operation is still there
    run: |-
      ! grep -qE '"(model_fields|price_fields)"' tools/oracle/helpers/dispatch.py tools/oracle/src/helpers/models.rs && test ! -e tools/oracle/helpers/model_fields.py && test ! -e tools/oracle/helpers/price_fields.py && test ! -e tools/oracle/src/helpers/models/model_fields.rs && test ! -e tools/oracle/src/helpers/models/model_fields && test ! -e tools/oracle/src/helpers/models/price_fields.rs && test ! -e tools/oracle/src/helpers/models/price_fields && test ! -e tools/oracle/cases/helpers/model-fields && test ! -e tools/oracle/cases/helpers/price-fields && test -z "$(ls tools/oracle/fuzz/corpus/helper_case | grep -E '^(model|price)_fields-')"
  - id: opik-config
    why: the config lookup order, the lazy file read or the zero-filled usage counts are wrong or untested
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'binary(opik) & test(/^opik_config_tests::(config_priority_reads_the_file_last|usage_object_fills_missing_counts_with_zero|config_lookup_skips_a_bad_file_when_answered)$/)'
  - id: config-file-tests
    why: the config file parser reads a form differently from CPython configparser, or an error shows a value
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E '(binary(opik) & test(/^opik_config_file_tests::config_file_/)) - test(/config_file_replays_the_corpus/)'
  - id: config-file-corpus
    why: the fuzz target or its corpus is missing, or no test replays the corpus
    run: |-
      test -f crates/betterlite-logging/fuzz/fuzz_targets/opik_config_file.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-logging/fuzz/corpus/opik_config_file)" && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'binary(opik) & test(/config_file_replays_the_corpus/)'
  - id: model-tests
    why: a case removed from the oracle has no native test in its place
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^price_fields::tests::price_case_/) | test(/^entry::tests::reasoning_levels_keep_values$/)'
