id: B3040
title: Request quota scopes and deployment health policy
description: >-
  Build the part of the v3 limiter that turns one request into its ordered list of RateLimitDescriptor records
  (B3031). It owns the api_key, user, team, team_member and end_user descriptors, the dynamic-limit policy that
  decides whether the api_key limits are enforced, the deployment health check behind that policy, and the one
  function that calls every other descriptor builder in LiteLLM's order. Nothing here reads Redis, counts or
  raises a rate-limit error. The result goes to should_rate_limit (B3036).

  Three places: a Rust module request_scopes in betterlite-rate-limit, a small read-only view module in
  betterlite-auth, and one config section in betterlite-config.

  Why a view module. The fields of UserAPIKeyAuth are pub(crate) in betterlite-auth and betterlite-rate-limit
  is another crate. B745 adds public readers for api_key, org_id, team_id, project_id, organization_rpm_limit and
  organization_tpm_limit, and this task uses those. It needs more: rpm_limit, tpm_limit, max_parallel_requests,
  budget_throttle_pct, user_id, user_rpm_limit, user_tpm_limit, team_rpm_limit, team_tpm_limit,
  team_member_rpm_limit, team_member_tpm_limit, end_user_id, end_user_rpm_limit, end_user_tpm_limit, the key's
  agent_id, invoked_agent_id, managed_agent_policy, invoked_agent_policy and the two metadata strings
  rpm_limit_type and tpm_limit_type. So the module request_quota_view in betterlite-auth adds one method
  UserAPIKeyAuth::request_quota_view(&self) -> RequestQuotaView<'_>. RequestQuotaView is a plain struct of
  borrowed Option<&str>, Option<i64>, Option<&AgentResponse> and the throttle percentage in the type B2325's
  throttled_limit takes. It holds no logic. rpm_limit_type and tpm_limit_type are read from the key's metadata
  map and are some only when the value is a JSON string (a number, bool or null gives none, as in
  _build_request_rate_limit_descriptors). The method lives in the auth crate so it can reach the pub(crate)
  fields. Do not edit B745's readers or any other file of resolved_key.

  Module request_scopes, in four submodules that each own their error type if they can fail.

  limit_policy holds the three small policy functions. is_dynamic_rate_limiting_enabled(rpm_limit_type,
  tpm_limit_type) is true when either is exactly "dynamic". should_enforce_rate_limit(limit_type,
  model_has_failures) returns model_has_failures when limit_type is "dynamic" and true for every other value,
  including none and "guaranteed_throughput" and "best_effort_throughput". get_enforced_limit(limit_value,
  limit_type, model_has_failures) returns none when limit_value is none, the value when should_enforce is true,
  and none otherwise.

  deployment_health holds _check_model_has_recent_failures. LiteLLM imports proxy_server.llm_router inside the
  function, and the rules forbid that, so the module defines an async trait DeploymentHealthSource with two
  methods. deployments_for_model(model) returns Result<Option<Vec<DeploymentRef>>, DeploymentHealthError>:
  none means there is no router, and DeploymentRef carries an Option<String> deployment id (the router's
  get_model_list(model_name=model) and each entry's model_info.id). failures_this_minute(deployment_id) returns
  Result<i64, DeploymentHealthError> (B304's get_deployment_failures_for_current_minute, 0 when nothing is
  stored). B3055 builds the production source over the router and B304's counter. DeploymentHealthPolicy is a
  struct made with the source and the threshold i64 and has the async method model_has_recent_failures(model) ->
  bool. It never returns an error. Behavior, in order: no router gives false; an empty or missing deployment list
  gives false; each deployment is checked in list order, a deployment with a missing or empty id is skipped, and
  the first one whose failure count is strictly greater than the threshold gives true and logs at DEBUG
  "[Dynamic Rate Limit] Deployment <id> has <count> failures in current minute - enforcing rate limits for model
  <model>"; when none is over, log at DEBUG "[Dynamic Rate Limit] No failures detected for model <model> -
  allowing dynamic exceeding" and give false; any DeploymentHealthError from either source method logs at DEBUG
  "Error checking model failure status: <error>, defaulting to enforce limits" and gives true (fail safe).

  key_scopes holds create_rate_limit_descriptors, the port of _create_rate_limit_descriptors. It is a method of
  a struct RequestScopeBuilder that is made with the window size (rate_limiter_settings.window_size from B3031,
  default 60), B3038's ModelDescriptorBuilder and B3039's identity descriptor builders, and takes the caller's
  UserAPIKeyAuth, the request body, rpm_limit_type, tpm_limit_type, model_has_failures and call_type (an
  Option<&str>). It returns a Vec<RateLimitDescriptor> and appends in exactly this order, each only when its
  condition holds. Every descriptor carries rate_limit.window_size equal to the builder's window size.
  1. "api_key": api_key is set and not empty, and at least one of rpm_limit, tpm_limit and max_parallel_requests
     is not none. Value is the api_key. throttle = budget_throttle_pct. requests_per_unit is get_enforced_limit
     over throttled_limit(rpm_limit, throttle) with rpm_limit_type; tokens_per_unit is get_enforced_limit over
     throttled_limit(tpm_limit, throttle) with tpm_limit_type; max_parallel_requests is copied unchanged and is
     never throttled or made dynamic. throttled_limit is B2325's function in betterlite-auth.
  2. "user": user_id is set and not empty, and user_rpm_limit or user_tpm_limit is not none. Value user_id.
  3. "team": team_id is set and not empty, and team_rpm_limit or team_tpm_limit is not none. Value team_id.
  4. "team_member": user_id is set and not empty, and team_member_rpm_limit or team_member_tpm_limit is not
     none. Value is the text "<team_id>:<user_id>", and an absent team_id prints as the text "None".
  5. "end_user": end_user_id is set and not empty, and end_user_rpm_limit or end_user_tpm_limit is not none.
  6. The model_per_key descriptor: B3038's key_model_descriptor with the request's "model" when it is a string.
  7. The tag_per_key descriptors: B3039's port of _add_tag_per_key_rate_limit_descriptor with the request body.
  8. The MCP pair, only when call_type is exactly "call_mcp_tool" and the body has no "server_id" key: B3039's
     mcp_per_key builder, then its mcp_per_team builder, both with the body's "mcp_server_name" (a string or none).
  9. The model_per_team descriptor: B3038's team_model_descriptor with the request model when it is a string.
  10. Agents. The resolved agent id is B3039's _get_resolved_agent_id port (the key's agent_id first, then the
     body's metadata.agent_id). Walk the list (resolved id, invoked_agent_id) with duplicates removed and
     entries that are none skipped (an empty string is not skipped). For each id call B3039's
     _create_agent_rate_limit_descriptors with the body, and with managed_agent_policy when the id equals the
     key's agent_id, otherwise invoked_agent_policy. Append the descriptors it returns.
  The data this function reads from the body is only "model", "mcp_server_name" and the key "server_id". It does
  not call the project, organization or tag-resolver builders, and it does not reorder anything.

  request_assembly holds build_request_rate_limit_descriptors, the port of _build_request_rate_limit_descriptors,
  and is the one place that fixes the final order. It is an async method of RequestScopeBuilder taking the
  caller, the body and call_type, and returns Vec<RateLimitDescriptor>. Steps: read rpm_limit_type and
  tpm_limit_type from the view; take the model only when the body's "model" is a string; compute
  model_has_failures as DeploymentHealthPolicy::model_has_recent_failures(model) only when a model exists
  (non-empty) and is_dynamic_rate_limiting_enabled is true, otherwise false; call create_rate_limit_descriptors;
  then append, in this order, B3038's project_model_descriptor and project_io_descriptors (the latter takes the
  &mut Vec<RateLimitDescriptor> that B3042 also passes); then append B3038's organization_descriptors, then
  B3039's tag descriptors (_create_tag_rate_limit_descriptors, which awaits the tag resolver). The final order
  is therefore api_key, user, team, team_member, end_user, model_per_key, tag_per_key, mcp_per_key, mcp_per_team,
  model_per_team, agent and agent_session descriptors, model_per_project, model_per_project_itpm,
  model_per_project_otpm, organization, model_per_organization, then tag. A test asserts this full order with
  every scope present.

  Config section dynamic_rate_limit_health (crates/betterlite-config/src/sections/dynamic_rate_limit_health.rs)
  reads env DYNAMIC_RATE_LIMIT_ERROR_THRESHOLD_PER_MINUTE as a base-10 integer, default 1, and exposes it as
  config.sections.dynamic_rate_limit_health. A value that is not an integer is a typed load error. The section
  is a stub that the architect declares in sections.rs.

  The module name is request_scopes, not a task id. Direct dependencies: B304 (the failure counter the
  production health source reads), B732 and B2314 (UserAPIKeyAuth), B745 (readers and key limit lookups),
  B2325 (throttled_limit), B3031 (records, window size, ModelGroupResolver), B3038 (model, project and
  organization builders), B3039 (tag, MCP and agent builders, the tag resolver).
scope:
  paths:
    - crates/betterlite-rate-limit/src/request_scopes.rs
    - crates/betterlite-rate-limit/src/request_scopes/**
    - crates/betterlite-auth/src/request_quota_view.rs
    - crates/betterlite-auth/src/request_quota_view/**
    - crates/betterlite-config/src/sections/dynamic_rate_limit_health.rs
    - crates/betterlite-config/src/sections/dynamic_rate_limit_health/**
    - tools/oracle/cases/helpers/rate-limit-request-scopes/**
    - "tools/oracle/fuzz/corpus/helper_case/rate_limit_request_scopes-*"
    - tools/oracle/helpers/b3040.py
    - tools/oracle/helpers/b3040/**
    - tools/oracle/src/helpers/rate_limit/b3040.rs
    - tools/oracle/src/helpers/rate_limit/b3040/**
  lint_tables: false
