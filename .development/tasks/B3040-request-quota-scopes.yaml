dod:
  - text: is_dynamic_rate_limiting_enabled is true when either type is exactly "dynamic"; should_enforce_rate_limit gives model_has_failures for "dynamic" and true for none and every other string; get_enforced_limit gives none for a none limit.
    proof: [limit-policy-tests, rate-limit-request-scopes-oracle, helper-python, helper-case-corpus]
  - text: The api_key descriptor needs a non-empty api_key and one of rpm_limit, tpm_limit and max_parallel_requests, throttles rpm and tpm with budget_throttle_pct before the dynamic policy, and copies max_parallel_requests unchanged.
    proof: [key-scope-tests, rate-limit-request-scopes-oracle, helper-python, helper-case-corpus]
  - text: With rpm_limit_type "dynamic" and no recent failures the api_key descriptor is still emitted, with requests_per_unit none.
    proof: [key-scope-tests, rate-limit-request-scopes-oracle, helper-python, helper-case-corpus]
  - text: The user, team and end_user descriptors each need a non-empty id and at least one of their two limits, and carry the window size.
    proof: [key-scope-tests, rate-limit-request-scopes-oracle, helper-python, helper-case-corpus]
  - text: The team_member descriptor needs user_id, not team_id, and its value is "<team_id>:<user_id>" with the text "None" for an absent team_id.
    proof: [key-scope-tests, rate-limit-request-scopes-oracle, helper-python, helper-case-corpus]
  - text: The MCP builders run only for call_type "call_mcp_tool" without a "server_id" key in the body, and the agent loop removes duplicate ids, skips none and picks managed_agent_policy only for the key's own agent_id.
    proof: [key-scope-tests, rate-limit-request-scopes-oracle, helper-python, helper-case-corpus]
  - text: create_rate_limit_descriptors appends in the order api_key, user, team, team_member, end_user, model_per_key, tag_per_key, MCP, model_per_team, agents.
    proof: [key-scope-tests, rate-limit-request-scopes-oracle, helper-python, helper-case-corpus]
  - text: The health policy returns false for no router and for no deployments, skips deployments without an id, returns true only when a count is strictly above the threshold, and returns true when either source method fails.
    proof: [deployment-health-tests]
  - text: The assembly reads rpm_limit_type and tpm_limit_type only from string values in the key metadata, asks the health policy only for a non-empty string model with a dynamic type, and never asks it otherwise.
    proof: [request-assembly-tests]
  - text: The assembled list ends with the project, project input, project output, organization and tag descriptors after the key-scope list, in that order, and a test with every scope present asserts the full order.
    proof: [request-assembly-tests]
  - text: RequestQuotaView returns the listed fields of UserAPIKeyAuth and none for rpm_limit_type and tpm_limit_type unless the metadata value is a string.
    proof: [quota-view-tests]
  - text: DYNAMIC_RATE_LIMIT_ERROR_THRESHOLD_PER_MINUTE defaults to 1, loads an integer from the env and rejects text that is not an integer.
    proof: [config-tests]
checks:
  optional: [mutants]
  commands:
    - id: limit-policy-tests
      why: the dynamic policy tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^request_scopes::limit_policy::/)'
    - id: key-scope-tests
      why: the key, user, team, team member, end user, MCP or agent ordering tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^request_scopes::key_scopes::/)'
    - id: deployment-health-tests
      why: the deployment health policy tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^request_scopes::deployment_health::/)'
    - id: request-assembly-tests
      why: the final descriptor order or the health guard tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^request_scopes::request_assembly::/)'
    - id: quota-view-tests
      why: the auth view tests are missing or fail
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^request_quota_view::/)'
    - id: config-tests
      why: the dynamic_rate_limit_health section does not load its threshold from a named test
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::dynamic_rate_limit_health::/)'
    - id: rate-limit-request-scopes-oracle
      why: the oracle cases for the key descriptors and the dynamic policy are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/rate-limit-request-scopes)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/rate-limit-request-scopes
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3040)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3040 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3040/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added request-scope cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/rate_limit_request_scopes-*")" &&
        grep -lE '^[[:space:]]+b3040:' tools/oracle/fuzz/corpus/helper_case/rate_limit_request_scopes-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/rate-limit-request-scopes/dynamic-policy.yaml
  - tools/oracle/cases/helpers/rate-limit-request-scopes/api-key-throttled.yaml
  - tools/oracle/cases/helpers/rate-limit-request-scopes/api-key-dynamic-no-failures.yaml
  - tools/oracle/cases/helpers/rate-limit-request-scopes/user-team-end-user.yaml
  - tools/oracle/cases/helpers/rate-limit-request-scopes/team-member-no-team.yaml
  - tools/oracle/cases/helpers/rate-limit-request-scopes/mcp-call-type-gate.yaml
  - tools/oracle/cases/helpers/rate-limit-request-scopes/agent-ids-and-policy.yaml
  - tools/oracle/cases/helpers/rate-limit-request-scopes/descriptor-order.yaml
deviations:
  - what: The deployment health check reads the router through the DeploymentHealthSource trait that B3055 builds, not through an import of the proxy's global router.
    why: The rules forbid module-level state, and betterlite-rate-limit must not depend on the router crate. The behavior, including false for no router and true on any error, is the same.
  - what: A DYNAMIC_RATE_LIMIT_ERROR_THRESHOLD_PER_MINUTE that is not a plain base-10 integer (Python also takes underscores such as "1_0") fails config loading with a typed error.
    why: LiteLLM fails at import with a ValueError; betterlite reports it when the config loads. Surrounding whitespace and a leading sign are accepted.
  - what: The oracle compares the descriptor builders with the deployment health result passed in as model_has_failures, not with a live router.
    why: A helper adapter cannot reach proxy_server globals, so the health policy itself is covered by Rust tests that inject a source. The assembly guard is covered by Rust tests too.
out_of_scope:
  - "Model, model_per_key, model_per_team, project and organization builders and key_owns_tpm_from_request_metadata: B3038."
  - "Tag, MCP, agent and session descriptor builders, _get_resolved_agent_id, _get_session_id_from_data and the tag resolver: B3039. This task only calls them."
  - "throttled_limit and budget_throttle_percentage: B2325. get_deployment_failures_for_current_minute and the router's failure counters: B304."
  - "The production DeploymentHealthSource, the pre-call hook that calls build_request_rate_limit_descriptors, the stash.tpm_limited_tags line and get_rate_limiter_for_call_type: B3055."
  - "Counting, windows, gauges and admission over the finished list: B3036 and B3035. Token reservation over the list: B3042 and B3043."
  - "The unused parent_otel_span argument of _check_model_has_recent_failures and the unused parent span in _build_request_rate_limit_descriptors: no caller reads it at the pin."
  - "_handle_rate_limit_error: B3030."
pitfalls:
  - Only the api_key descriptor goes through get_enforced_limit and throttled_limit; the user, team, team_member and end_user limits are copied as they are, so a dynamic type never relaxes them.
  - throttled_limit runs before get_enforced_limit, so a throttled key under a dynamic type with no failures still ends with requests_per_unit none.
  - A dynamic key with no recent failures still gets an api_key descriptor with both limits none, and it is not dropped, so max_parallel_requests alone can still bind.
  - team_member is gated on user_id and not on team_id, and its value is built by formatting, so a key without a team gives "None:<user_id>" and all such users share the same text prefix.
  - The api_key, user, team and end_user ids are checked for truthiness, so an empty string adds nothing, while the limits are checked with "is not None", so a limit of 0 does add a descriptor.
  - The MCP builders are skipped when the body has a "server_id" key, because the REST MCP path passes the raw body here before the server is resolved; only the later synthetic payload carries it.
  - The agent loop removes duplicate ids with dict.fromkeys, so a key whose agent_id equals invoked_agent_id is processed once and uses managed_agent_policy, not the invoked policy.
  - An empty-string agent id is not none, so it is not skipped by the loop; B3039 decides what an empty id yields.
  - The health check runs only when the model is a non-empty string and a type is "dynamic", so a key without a dynamic type never triggers a router lookup, and a missing model never does either.
  - The failure comparison is strictly greater than the threshold, so with the default 1 a deployment needs 2 failures in the current minute to turn enforcement on.
  - Any error while reading deployments or counters means "has failures", the safe direction that enforces limits; it must never become a false.
  - model_per_team sits after the MCP builders and before the agents inside create_rate_limit_descriptors, while model_per_project, the project input and output descriptors and the organization ones are appended later by the assembly, so do not move any of them into the other function.
  - tpm_limited_tags in the caller is computed from the final list by key "tag", so the tag descriptors must stay last and keep their tokens_per_unit.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
