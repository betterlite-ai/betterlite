checks:
  optional:
  - mutants
  commands:
  - id: case-character-create-get
    why: Create appends /characters and starts multipart with (name,(None,name)), then B672 adds video. Retrieve
      decodes character envelope and path-encodes field_name=character_id before /characters/<id>. Both responses
      validate CharacterObject without provider wrapping.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::video_edits_cases::case_[0-9]+_character_create_get$/)'
  - id: case-video-edit-prompt
    why: Edits use /edits. A non-None video_file takes precedence over video_id and yields a video file tuple plus
      prompt form fields; extra_body overwrites prompt. Without a file, decode video_id and send JSON {prompt,video:{id}}
      with extra_body merged last and no files.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::video_edits_cases::case_[0-9]+_video_edit_prompt$/)'
  - id: case-video-extension
    why: Extensions use /extensions and JSON {prompt,seconds,video:{id:<original id>}}, preserving seconds as supplied;
      extra_body can overwrite every field. Edit/extension responses wrap a truthy id only when custom_llm_provider
      is truthy, with model=None and no synthetic usage.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::video_edits_cases::case_[0-9]+_video_extension$/)'
  - id: case-video-part-filename
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-video-edits/video-part-filename.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::video_edits_cases::case_[0-9]+_video_part_filename$/)'
  - id: case-known-extension-mime
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-video-edits/known-extension-mime.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::video_edits_cases::case_[0-9]+_known_extension_mime$/)'
  - id: case-fallback-octet-stream
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-video-edits/fallback-octet-stream.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::video_edits_cases::case_[0-9]+_fallback_octet_stream$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_video_edits.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_video_edits*")"
      && grep -lq 'openai_video_edits' tools/oracle/fuzz/corpus/helper_case/openai_video_edits* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_video_edits$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_video_edits)"
      && grep -q 'decode_character_reply' crates/betterlite-openai/fuzz/fuzz_targets/openai_video_edits.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_video_edits_corpus$/)'
  - id: case-unused-prefetched-source
    why: The OpenAI edit transform ignores prefetched_source_data and request_data; passing either cannot fetch
      media or alter the body or result.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::video_edits_cases::case_[0-9]+_unused_prefetched_source$/)'
