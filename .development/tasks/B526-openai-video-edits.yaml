id: B526
title: OpenAI video edits extensions and characters
description: >-
  Extend video types with character create/retrieve, edit and extension provider calls, using the B672 shared image/video
  file-part helpers. Reuse the native/provider ID codec from videos and preserve file tuple metadata and MIME inference.
  Existing create uses these helpers through typed supplied files.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/videos/transformation.py:
  OpenAIVideoConfig.transform_video_create_character_request L463-L474; OpenAIVideoConfig.transform_video_create_character_response
  L476-L481; OpenAIVideoConfig.transform_video_get_character_request L483-L493; OpenAIVideoConfig.transform_video_get_character_response
  L495-L500; OpenAIVideoConfig.transform_video_edit_request L502-L528; OpenAIVideoConfig.transform_video_edit_response
  L530-L540; OpenAIVideoConfig.transform_video_extension_request L542-L561; OpenAIVideoConfig.transform_video_extension_response
  L563-L572.


  Reuse encode_video_id_with_provider from B672 (litellm/types/videos/utils.py); its implementation remains with
  that prerequisite.


  Reuse extract_original_character_id from B672 (litellm/types/videos/utils.py); its implementation remains with
  that prerequisite.


  Reuse extract_original_video_id from B672 (litellm/types/videos/utils.py); its implementation remains with that
  prerequisite.


  Named case contracts: character_create_get: Create appends /characters and starts multipart with (name,(None,name)),
  then B672 adds video. Retrieve decodes character envelope and path-encodes field_name=character_id before /characters/<id>.
  Both responses validate CharacterObject without provider wrapping. video_edit_prompt: Edits use /edits. A non-None
  video_file takes precedence over video_id and yields a video file tuple plus prompt form fields; extra_body overwrites
  prompt. Without a file, decode video_id and send JSON {prompt,video:{id}} with extra_body merged last and no files.
  video_extension: Extensions use /extensions and JSON {prompt,seconds,video:{id:<original id>}}, preserving seconds
  as supplied; extra_body can overwrite every field. Edit/extension responses wrap a truthy id only when custom_llm_provider
  is truthy, with model=None and no synthetic usage. unused_prefetched_source: The OpenAI edit transform ignores
  prefetched_source_data and request_data; passing either cannot fetch media or alter the body or result.


  Implement crates/betterlite-openai/src/video_edits.rs with adjacent tests under video_edits/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function video_edits_cases in betterlite-openai with these exact named cases (one per oracle file):
  character_create_get, video_edit_prompt, video_extension, video_part_filename, known_extension_mime, fallback_octet_stream,
  unused_prefetched_source. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_video_edits* using HelperCase: kind: helper
  and the externally tagged openai_video_edits variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_video_edits that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_character_reply consumes character JSON response bytes in crates/betterlite-openai/src/video_edits.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_video_edits.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_video_edits.
  The adjacent test replays_the_openai_video_edits_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 101 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 130 production lines, 155 behavior/config-test lines,
  90 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 455 planned, 475 maximum changed lines.
