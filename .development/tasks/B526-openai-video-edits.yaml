pitfalls:
- 'The oracle helper for this task is pre-registered as openai_video_edits in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/video_edits.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_video_edits.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- video_file is checked against None, so an empty supplied file still selects multipart instead of the video ID.
- Character response IDs are not wrapped by these methods despite retrieve accepting wrapped IDs.
