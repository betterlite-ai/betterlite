    OpenAIVideoConfig.transform_video_edit_request, OpenAIVideoConfig.transform_video_edit_response, OpenAIVideoConfig.transform_video_extension_request,
    OpenAIVideoConfig.transform_video_extension_response. Other functions in this file remain with the owners listed
    below.
