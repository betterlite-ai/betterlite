id: B10060
title: Deployment credential lookup and merge
description: >-
  File, batch and vector routes look up a deployment's credentials in the router and merge them into the request data. LiteLLM does it with two small functions of litellm/proxy/openai_files_endpoints/common_utils.py: get_credentials_for_model (L351-L391) and prepare_data_with_credentials (L622-L644). Both were planned inside B1020, which waits on the key and access-group tasks for its authorization code, so B1044's batch limiter (which calls only the lookup) and B1080's file stream (which calls only the merge) waited with it. Build both here, with the port the lookup reads through and the trusted snapshot the merge takes, as module api::model_credentials in betterlite-core (crates/betterlite-core/src/api/model_credentials.rs, an empty stub the skeleton declares in api.rs, with tests in model_credentials/tests.rs). The module sits outside B1020's api::file_credentials on purpose, so the two tasks never share files. B1020 then calls both functions and asks the same port for its own lookups (common_utils.py L501 with a team id, L595 without).


  The port. betterlite-router depends on betterlite-core, so core cannot call the router. Declare a one-method trait here, credentials_with_provider(model_id, team_id: Option<&str>), answering Router.get_deployment_credentials_with_provider (router.py L10599) as Result<Option<JsonObject>, _> with betterlite_models::model_registration::JsonObject. On main, B2306's credentials_with_provider in betterlite-router deployment_credentials::resolve computes that answer, and its CredentialParams.fields is that JsonObject, so an implementation over it is a thin adapter. That implementation is not part of this task; tests use a fake. A port failure keeps the implementation's error as the source of a variant of this module's error enum, never as text.


  get_credentials_for_model(source, model_id, operation_context) -> Result<JsonObject, CredentialLookupError>, where source is an Option of the port (LiteLLM's llm_router may be None). No source fails first with RouterMissing: status 500 and detail {"error": "Router not initialized. Cannot use model-based routing."}. Otherwise ask the port with team_id None. None is ModelNotFound, carrying B9964's ProxyModelNotFoundError::new(operation_context, model_id, false) with its status 400. Some(credentials) is returned unchanged. LiteLLM's default operation_context is "file operation"; Rust has no default arguments, so export it as a constant and let each caller pass its own (B1044 passes "batch input file read (rate limiting)"). RouterMissing and ModelNotFound are both HTTPException in LiteLLM and B1044 swallows exactly those two, while a port failure propagates, so the enum keeps the three apart.


  prepare_data_with_credentials(data: &mut JsonObject, credentials: &JsonObject, file_id: Option<&str>, include_internal_credentials: bool) -> Option<TrustedCredentials>, in LiteLLM's order. First every credential key is written into data, the way dict.update does it: an existing key keeps its position and takes the credential's value, a new key is appended. Then the snapshot is taken when asked. Then custom_llm_provider leaves data (shift_remove, so the other keys keep their order). Then file_id is set when given: Some("") writes an empty id, None leaves data's file_id alone.


  The snapshot. LiteLLM stores it in data under _litellm_internal_model_credentials as a read-only MappingProxyType. A JsonObject cannot carry a typed value, and betterlite-models' RequestCall refuses that key from a request, so the snapshot is returned as B176's betterlite_models::controls::call_params::TrustedCredentials, the type core's file_provider_read target already takes, and the caller hands it to the call. With include_internal_credentials true the function also drops any _litellm_internal_model_credentials key the caller's data carried, since in LiteLLM the trusted snapshot overwrites it; with false it returns None and leaves that key alone. A public trusted_snapshot(credentials) builds the snapshot, and B1020's add_internal_model_credentials (L578-L600) calls it too: every text credential, model and custom_llm_provider included, as a SecretString. Object and list values (vertex_credentials as an object, aws_session_tags, bedrock_tags) stay out, since TrustedCredentials holds text and the snapshot's readers at the pin read text fields only (cloud_storage_security.py L123, bedrock/files/transformation.py L193).


  Oracle. Helper cases on the b10060 operation cover the lookup with a scripted router answer (no router, a null answer, credentials) and the merge with data, credentials, file_id and the flag. The Python adapter passes a stand-in router whose get_deployment_credentials_with_provider returns the scripted answer, and reads the snapshot back out of data. The answer is the merged data without the snapshot key, the snapshot's text fields as a map or null, and the error status and detail. B1020's planned credential-merge-and-snapshot case moves here. No byte parser is added, so there is no fuzz target. Budget from about 30 owned LiteLLM lines: about 120 production lines, 120 adapter lines and 180 test lines.
scope:
  paths:
    - crates/betterlite-core/src/api/model_credentials.rs
    - crates/betterlite-core/src/api/model_credentials/**
    - tools/oracle/src/helpers/core_ops/b10060.rs
    - tools/oracle/src/helpers/core_ops/b10060/**
    - tools/oracle/helpers/b10060.py
    - tools/oracle/helpers/b10060/**
    - tools/oracle/cases/helpers/model-credentials/**
    - tools/oracle/fuzz/corpus/helper_case/model-credentials-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L351-L391
    why: Owned. get_credentials_for_model, the router check before the lookup and the not-found error with retry false.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L622-L644
    why: Owned. prepare_data_with_credentials, the merge order, the snapshot and the file_id overwrite.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L10599-L10601
    why: Router.get_deployment_credentials_with_provider, the answer the port stands for.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L154-L160
    why: ProxyModelNotFoundError, which B9964 ports as betterlite_error::proxy_model_not_found.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/batch_rate_limiter.py#L210-L229
    why: B1044's call, which swallows the HTTP errors of the lookup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py#L37-L48
    why: B1080's call, which merges into a copy with include_internal_credentials true.
dod:
  - text: >-
      get_credentials_for_model with no source fails with status 500 and detail.error "Router not initialized. Cannot use model-based routing." before any lookup; a null answer fails with status 400 and detail.error "batch input file read (rate limiting): Invalid model name passed in model=m. Call `/v1/models` to view available models for your key." with retryable_with_model_read_through false; credentials come back unchanged, and the port is asked with team_id None.
    proof: [lookup-tests, oracle, helper-python]
  - text: >-
      A caller can tell RouterMissing and ModelNotFound from a port failure, and a port failure keeps its source error.
    proof: [lookup-tests]
  - text: >-
      Credentials {api_key: server, model: resolved, custom_llm_provider: openai} merged into data {api_key: caller, x: 1, custom_llm_provider: azure} give {api_key: server, x: 1, model: resolved} in that order; file_id None leaves data's file_id, and file_id "" writes an empty id.
    proof: [merge-tests, oracle, helper-python]
  - text: >-
      include_internal_credentials true returns a TrustedCredentials with every text credential, model and custom_llm_provider included, that later changes to credentials or data cannot change, and removes a caller-supplied _litellm_internal_model_credentials key from data; false returns None and leaves that key in place.
    proof: [snapshot-tests, oracle, helper-python]
  - text: A new b10060 seed reaches the shared helper case parser.
    proof: [helper-case-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
    - id: lookup-tests
      why: the lookup tests are missing, or the lookup skips the router check, changes the error text or mixes the error kinds
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::model_credentials::(.*::)?lookup_/)'
    - id: merge-tests
      why: the merge tests are missing, or the merge keeps custom_llm_provider, reorders keys or mishandles file_id
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::model_credentials::(.*::)?merge_/)'
    - id: snapshot-tests
      why: the snapshot tests are missing, or the snapshot loses a text credential or follows later changes
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::model_credentials::(.*::)?snapshot_/)'
    - id: helper-python
      why: the b10060 adapter is missing or fails the strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10060.py tools/oracle/helpers/b10060)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no new b10060 seed reaches the shared helper case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/model-credentials-*")" &&
        grep -lE 'b10060"?:' tools/oracle/fuzz/corpus/helper_case/model-credentials-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-core-ops --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/model-credentials/credential-lookup.yaml
  - tools/oracle/cases/helpers/model-credentials/credential-merge-and-snapshot.yaml
  - tools/oracle/cases/helpers/model-credentials/merge-key-order.yaml
deviations: []
out_of_scope:
  - "extract_model_from_sources, authorize_model_for_key, get_authorized_credentials_for_model, get_team_provider_credentials, apply_team_provider_credentials, add_internal_model_credentials, add_deployment_model_info and handle_model_based_routing (the rest of common_utils.py L317-L709): B1020, which calls this module."
  - "The port's production implementation over betterlite-router's credentials_with_provider (B2306) and the router's credential list: the server wiring that builds the file and batch services, as for B1020's other ports."
  - "ProxyModelNotFoundError and its text: B9964. The snapshot's SDK readers (cloud_storage_security.py, bedrock files): their provider tasks."
pitfalls:
  - The router check runs before the lookup, so a missing router is a 500 even for a model nobody configured.
  - custom_llm_provider leaves data after the merge, so a provider the caller put in data goes too, not only the credential's.
  - The snapshot is taken from credentials before custom_llm_provider leaves data, so it still holds custom_llm_provider and model.
  - The lookup passes no team_id; B1020's team search passes one through the same port, so the port keeps the parameter.
  - data and credentials hold API keys as plain JSON text, so no log line or error text here prints either map.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
