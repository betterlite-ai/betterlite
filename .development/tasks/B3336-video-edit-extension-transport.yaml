dod:
  - text: Each sync handler returns its async handler's future when `_is_async` is true, before any client is picked, and an unknown provider name fails before error conversion.
    proof: [edit-transport-tests, extension-transport-tests]
  - text: Edit and extension use a supplied client only when its mode matches, otherwise a pooled one with ssl_verify from the params; validate_environment gets api_key or the params' api_key, headers are re-updated with the extra headers, and get_complete_url gets an empty model.
    proof: [edit-transport-tests, extension-transport-tests]
  - text: Edit calls get_video_edit_prefetch_params; when it returns a pair it POSTs the JSON body to the prefetch URL with the timeout, checks the status, and passes the decoded JSON to transform_video_edit_request; when it returns none the prefetched data is none.
    proof: [edit-transport-tests]
  - text: Edit sends a multipart POST when the request transform returns non-empty files and a JSON POST otherwise, both with the timeout, and returns transform_video_edit_response called with request_data = data.
    proof: [edit-transport-tests]
  - text: Edit logs pre_call with input = the prompt, an empty api_key and additional_args complete_input_dict, api_base, headers and video_id, after the request transform and before the send.
    proof: [edit-transport-tests]
  - text: Extension calls transform_video_extension_request with seconds, logs the same pre_call shape, POSTs the JSON body with the timeout and returns transform_video_extension_response.
    proof: [extension-transport-tests]
  - text: Extension errors from the request transform or from pre_call are returned unconverted, while edit errors from the same two steps are converted.
    proof: [transport-error-tests]
  - text: A 4xx or 5xx on the prefetch POST or the main send, and an error from either response transform, become the provider's error class with the HTTP status, headers and body text; a prefetch JSON decode error is not converted.
    proof: [transport-error-tests]
  - text: Calling a sync handler with `_is_async` false inside a running async runtime returns the typed error with status 500.
    proof: [transport-error-tests]
checks:
  optional: []
  commands:
    - id: edit-transport-tests
      why: the edit handler tests are missing or the prefetch, multipart-or-JSON choice, logging or client choice differ
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_edit_transport::(.*::)?edit_transport_behavior::/)'
    - id: extension-transport-tests
      why: the extension handler tests are missing or the request order, timeout or hand-off differ
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_edit_transport::(.*::)?extension_transport_behavior::/)'
    - id: transport-error-tests
      why: the conversion boundary differs between edit and extension, or the runtime guard is missing
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_edit_transport::(.*::)?transport_error_behavior::/)'
oracle_cases: []
deviations:
  - what: A sync handler called from inside a running async runtime returns a typed error with status 500 and message "video sync handler cannot run inside a running runtime".
    why: Python runs sync code on the caller's thread; blocking on a Rust future inside a runtime would deadlock.
  - what: The client mode check is a type match on the supplied client, not isinstance.
    why: Rust clients are typed, so the outcome is the same.
out_of_scope:
  - "async_video_delete_handler (llm_http_handler.py 8528-8602): no caller at the pin."
  - "Generation and content handlers are owned by B3333; remix and list by B3334; character by B3335; status by B3337."
  - "Shared _handle_error (6052-6111) is owned by B2402; this task calls it."
  - "Pooled client construction and limits are owned by B173; pre_call logging by B249."
  - "The edit and extension request and response transforms of each provider (B526 OpenAI, B547, B1361-B1364, and the Fal and Runway tasks); this task calls them only through the B3331 trait."
  - "The edit and extension call functions in litellm/videos/main.py (id decoding, provider lookup, logging setup) are not owned by this task."
pitfalls:
  - Edit puts the request transform and pre_call inside the try block, but extension puts both before it, so only edit converts their errors.
  - The edit prefetch POST has its own try block with a status check, and the `.json()` decode comes after it and is not converted.
  - Edit picks multipart by whether `files` is truthy, so an empty files map must send JSON.
  - The edit response transform also gets `request_data` = data; the extension one does not.
  - Edit and extension use the same `api_key or litellm_params api_key` fallback as remix; no caller passes api_key, so the params' key is the one used.
  - Extension takes `seconds` as a string and hands it to the transform unchanged; do not parse it.
  - The async path builds the pooled client from the provider name before the headers step, so an unknown provider name fails first.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
