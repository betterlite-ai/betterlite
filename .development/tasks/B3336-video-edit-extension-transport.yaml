id: B3336
title: Video edit and extension transport
description: >-
  Build the HTTP handlers for video edit and video extension in betterlite-core, module `api::video_edit_transport`.
  They are the four LiteLLM methods video_edit_handler, async_video_edit_handler, video_extension_handler and async_video_extension_handler.
  Each takes the prompt, the video id, a `BaseVideoConfig` (B3331), the provider name, the call's litellm params, the logging object (B249),
  and the optional extra headers, extra body, timeout, client and api_key. Edit also takes an optional video file; extension also takes `seconds` (a string).
  Create the typed error enum `VideoEditTransportError` in this module. It wraps B2402's transport error conversion, so a failure inside a try block
  becomes the provider's error class the same way LiteLLM's `_handle_error` does.

  Steps shared by all four, in this order. The sync handler returns the async handler's future when `_is_async` is true, before any client is picked.
  Pick the client: use the supplied one only when it has the right mode (sync for the sync path, async for the async path), otherwise take a pooled one from B173
  built with `ssl_verify` from the litellm params (default none). The async pool is keyed by the provider name, and an unknown provider name fails there,
  outside every try block, so the provider error class does not convert it.
  Call `validate_environment` with api_key set to the argument or else the params' api_key, headers set to the extra headers or an empty map, model set to the empty string.
  Then update the returned headers with the extra headers again. Call `get_complete_url` with model empty and the params' api_base.

  Extension continues: call `transform_video_extension_request` (prompt, video id, seconds, api base, params, headers, extra body) to get `(url, data)`.
  This call and the pre_call below sit outside the try block, so their errors are not converted. pre_call has input = the prompt, api_key empty,
  additional_args holding complete_input_dict = data, api_base = url, headers and video_id. Then, inside the try block, POST `data` as JSON with the timeout,
  and return `transform_video_extension_response` (raw response, logging object, provider name).

  Edit continues differently. First call `get_video_edit_prefetch_params` (video id, api base, params, headers). When it returns `(prefetch_url, prefetch_body)`,
  POST the body as JSON to that URL with the headers and the timeout, inside its own try block, and then check the status; a 4xx or 5xx raises and goes through error conversion.
  The decoded JSON of that response is `prefetched_source_data`, and decoding happens after the try block, so a decode error is not converted. When it returns none, the data is none.
  Then, inside one try block: call `transform_video_edit_request` (prompt, video id, video file, api base, params, headers, extra body, prefetched data) to get `(url, data, files)`,
  call pre_call (same shape as extension), and send. When `files` is non-empty send a multipart POST with `data` as the form fields and `files` as the parts, with the timeout;
  otherwise send `data` as JSON. Check the status, then return `transform_video_edit_response` (raw response, logging object, provider name, request_data = data).
  The request transform and pre_call are inside the edit try block, so their errors are converted too. This is the opposite of extension.

  Both send paths call raise_for_status, so any 4xx or 5xx response reaches error conversion before the response transform. The response status text and headers feed the converted error.
  Model each handler pair as a method on one struct holding the injected B173 client factories, the B249 logging handle and the B2402 error converter. The provider config is a trait object argument.
  Tests use a local mock server and a fake `BaseVideoConfig` with recording methods. Name the rstest functions `edit_transport_behavior`, `extension_transport_behavior`
  and `transport_error_behavior`, with one named case per DoD item. The task changes no wire format, so there is no fuzz target.
