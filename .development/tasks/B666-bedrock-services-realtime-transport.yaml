  - oracle
  - helper-python
- text: >-
    initial session configuration: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-realtime-transport/initial-session-configuration.yaml.
  proof:
  - case-initial-session-configuration
  - oracle
  - helper-python
- text: >-
