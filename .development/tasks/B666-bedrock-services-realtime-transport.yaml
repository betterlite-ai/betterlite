id: B666
title: Bedrock bidirectional realtime transport
description: >-
  Add owned Bedrock bidirectional-stream connection via a maintained AWS Bedrock Runtime SDK/client and injected
  HTTP connector housed in betterlite-http. Reuse established credentials, TLS/proxy and deadlines; no SDK may read
  ambient env or create a hidden production client. Expose a bounded session input/output pair consumed by the event
  bridge. Preserve first-message configuration, credential failure, provider failure and close sequencing; track
  and join all session work. This final transport/session part calls B667 forwarding pumps directly; B667 depends
  only on the lower event/session traits and never on this task. Do not hide a reversed ownership edge behind an
  injected session-runner callback.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/handler.py:
  BedrockRealtime.async_realtime L242-L346; BedrockRealtime._run_session L348-L411; BedrockRealtime._bridge L413-L457.


  Use aws-sdk-bedrockruntime Client::invoke_model_with_bidirectional_stream, which is present in the Rust SDK; configure
  an injected Smithy HttpClient/connector, credentials, region and disabled retries through B173. A reqwest-only
  connector does not prove bidirectional HTTP/2 support: test interleaved request/response events through the chosen
  HTTP/2 connector.


  Named case contracts: bidirectional_runtime_target: Before credentials/connection call B665 _pending_session_update,
  rejecting committed replay. Region onlyfallsback through B591 when explicit aws_region_name isNone; empty explicit
  is retained. Endpoint precedence api_base isnotNone (includingempty),then aws_bedrock_runtime_endpoint isnotNone,else
  https://bedrock-runtime.{region}.{B198 DNS}. Ignore api_key,timeout and unrelatedkwargs in this ownedPythonpreparation;
  no bearer auth or provider-localtimeout. Invoke SDK operation with model_id exactlysupplied, without modelroute
  stripping. initial_session_configuration: Create fresh B661 transformation state,openstream,then send session.created
  only when pending_session_update isNone; even empty pending string suppresses it. Initial seven state fields allNone.
  No initial Bedrock sessionStart/promptStart is sent automatically; B667 forwards/replays clientupdate. Failure
  openingstream or sendingcreated escapesbeforebridge but still closesownedSDKclient. credential_failure: Build
  AwsAuthParams from access_key,secret_key,session_token,session_name,profile_name,role_name,web_identity_token,sts_endpoint,external_id,session_tags
  and call B594 resolve_credentials via B595 run_aws_signing withselectedregion. None result -> B682401 message
  No AWS credentials found for Bedrock realtime. Set aws_* params in litellm_params or configure credentials in
  the environment. Otherwise freezecredentials through same blocking seam and pass explicit access/secret/token
  to staticSDKresolver. Keep source errors for malformedsessiontags/credentiallookup; no ambientSDKcredential chainafterthispoint.
  upstream_session_failure: Afterbridge collect B664 leftover usage events filteredB665 and append to logged events.
  If any, B250 dispatch_success_handlers(list,prefer_async_handlers=True) is enqueued through B191 ensure_initialized_and_enqueue,then
  model_call_details.realtime_session_success_logged=True. This happens BEFORE checkingproviderfailure; enqueue
  failure prevents flagassignment. No logs ->noflag. Providerfailure withclient_disconnected logs stream failed
  after the client disconnected andreturnsnormally; otherwise B665 _raise_provider_failure records/mutates committedscope
  andraisesmappederror. session_close_sequence: Once SDKclientcreated, finallyclose it via B665 helper regardless
  of open/session/bridge/logging failure; closeExceptionsuppressed. Pumps perform B667 inputhalfclose/clientEOFclose.
  Providerfailure nevertriggers an extra forcedclientclose here. NativeRAII/taskguards mustcancel andjoinbothdirections
  when outerfuture isdropped; prove with existing aws_duplex_cancel_reaps_io test in betterlite-http. bridge_completion_race:
  Start B667 client and provider pumps,collect successfully forwarded selected loggingevents,waitFIRST_COMPLETED.
  client_disconnected is true only if clienttaskdone,notcancelled,and noexception at thispoint. CancelBOTHtasks
  thenjoinboth with exceptionscollected. Provider_failure is client exception first,elseprovider exception,elseNone;
  cancellation/BaseException without Exception membership isnotfailure. Preserve events collected before failure.
  python_sdk_boundary: Oracle captures AsyncBedrockRuntimeConfig.resolve endpoint_uri,region,StaticCredentialsResolver,transport
  and InvokeModelWithBidirectionalStreamOperationInput; Rust uses aws-sdk-bedrockruntime with explicitconnector/credentials.
  Python package import/version checks belongB159; absentpackageerror isnotmanufactured in nativegateway. The liveSDK
  seam is replacedbeforeexternalIO inoracle; RustHTTP/2fixture separatelyproves interleavedrequest/response before
  requestEOF.


  Implement crates/betterlite-bedrock/src/realtime_transport.rs with adjacent tests under realtime_transport/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_realtime_transport in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_transport_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): bidirectional_runtime_target, initial_session_configuration, credential_failure, upstream_session_failure,
  session_close_sequence, bridge_completion_race, python_sdk_boundary. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_transport* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_transport variant inside call. Do not put the
  Python stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_transport
  that parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on
  zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_realtime_transport_credential_identity_isolation in betterlite-bedrock for this
  Rust-specific invariant; it is not a Python oracle case.


  Write standalone bedrock_services_realtime_transport_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  The HTTP/2 connector lives in betterlite-http/src/aws_duplex.rs. Write standalone aws_duplex_interleaved_events
  and aws_duplex_cancel_reaps_io in betterlite-http, using a fixture peer to prove that response events arrive before
  request EOF and cancellation joins both IO directions.


  Budget from 191 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 335 production lines, 300 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 790 planned, 800 maximum changed lines. The production allowance includes 120 lines for the referenced
  SDK protocol that LiteLLM delegates.

   Keep at most one event per direction in flight and await its sink before pulling the next event, matching the
  source forwarding awaits; introduce no queue-size setting or extra protocol queue; retain the source ordered logged-event
  handoff to the common logging worker.
