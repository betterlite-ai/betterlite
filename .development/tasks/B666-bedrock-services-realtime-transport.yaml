id: B666
title: Bedrock bidirectional realtime transport
description: >-
  Add owned Bedrock bidirectional-stream connection via a maintained AWS Bedrock Runtime SDK/client and injected
  HTTP connector housed in betterlite-http. Reuse established credentials, TLS/proxy and deadlines; no SDK may read
  ambient env or create a hidden production client. Expose a bounded session input/output pair consumed by the event
  bridge. Preserve first-message configuration, credential failure, provider failure and close sequencing; track
  and join all session work. Split connection setup from the source _run_session/_bridge orchestration through an
  injected session-runner callback: this slice opens/closes the native connection and calls that typed callback,
  while B667 supplies event pumping. Local fixture callbacks prove setup and cleanup without importing the later
  bridge.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/handler.py:
  BedrockRealtime.async_realtime L242-L346; BedrockRealtime._run_session L348-L411; BedrockRealtime._bridge L413-L457.


  Use aws-sdk-bedrockruntime Client::invoke_model_with_bidirectional_stream, which is present in the Rust SDK; configure
  an injected Smithy HttpClient/connector, credentials, region and disabled retries through B173. A reqwest-only
  connector does not prove bidirectional HTTP/2 support: test interleaved request/response events through the chosen
  HTTP/2 connector.


  Implement crates/betterlite-bedrock/src/realtime_transport.rs with adjacent tests under realtime_transport/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_realtime_transport in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_transport_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): bidirectional_runtime_target, initial_session_configuration, credential_failure, upstream_session_failure,
  session_close_sequence. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_transport* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_transport variant inside call. Do not put the
  Python stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_transport
  that parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on
  zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_realtime_transport_credential_identity_isolation in betterlite-bedrock for this
  Rust-specific invariant; it is not a Python oracle case.


  Write standalone bedrock_services_realtime_transport_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  The HTTP/2 connector lives in betterlite-http/src/aws_duplex.rs. Write standalone aws_duplex_interleaved_events
  and aws_duplex_cancel_reaps_io in betterlite-http, using a fixture peer to prove that response events arrive before
  request EOF and cancellation joins both IO directions.


  Budget from 191 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 335 production lines, 170 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 625 planned, 625 maximum changed lines. The production allowance includes 120 lines for the referenced
  SDK protocol that LiteLLM delegates.

   Keep at most one event per direction in flight and await its sink before pulling the next event, matching the
  source forwarding awaits; introduce no queue-size setting or unbounded intermediate event list.
