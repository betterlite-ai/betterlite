checks:
  optional:
  - mutants
  commands:
  - id: case-bidirectional-runtime-target
    why: The bidirectional-runtime-target behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_transport_cases::case_[0-9]+_bidirectional_runtime_target$/)'
  - id: case-initial-session-configuration
    why: The initial-session-configuration behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_transport_cases::case_[0-9]+_initial_session_configuration$/)'
  - id: case-credential-failure
    why: The credential-failure behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_transport_cases::case_[0-9]+_credential_failure$/)'
  - id: case-upstream-session-failure
    why: The upstream-session-failure behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_transport_cases::case_[0-9]+_upstream_session_failure$/)'
  - id: case-session-close-sequence
    why: The session-close-sequence behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_transport_cases::case_[0-9]+_session_close_sequence$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_realtime_transport.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_transport*")"
      && grep -lq 'bedrock_services_realtime_transport' tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_transport*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_realtime_transport$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_realtime_transport_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_realtime_transport_secret_safe_failure$/)'
  - id: duplex-interleaving
    why: The chosen HTTP/2 connector buffers the request to EOF instead of supporting duplex IO.
    run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/::aws_duplex_interleaved_events$/)'
  - id: duplex-cancellation
    why: Dropping a duplex session leaves request or response IO running.
    run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/::aws_duplex_cancel_reaps_io$/)'
