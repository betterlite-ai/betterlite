- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/realtime/handler.py#L242-L457
  why: Own BedrockRealtime.async_realtime, BedrockRealtime._run_session, BedrockRealtime._bridge. Other functions
    in this file remain with the owners listed below.
