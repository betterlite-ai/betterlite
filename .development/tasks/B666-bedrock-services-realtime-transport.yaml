  - crates/betterlite-http/Cargo.toml
  - crates/betterlite-http/src/lib.rs
  - crates/betterlite-http/src/error.rs
  - crates/betterlite-http/src/aws_duplex.rs
  - crates/betterlite-http/src/aws_duplex/**
  - tools/oracle/Cargo.toml
