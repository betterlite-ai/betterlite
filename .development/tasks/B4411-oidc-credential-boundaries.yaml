  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L30-L46
    why: _oidc_token_cache_ttl JWT decoding and TTL calculation
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L49-L67
    why: oidc_allowed_dirs default paths and environment override with normalization
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L70-L93
    why: _resolve_oidc_file_path absolute path validation and containment check
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L96-L109
    why: _get_oidc_http_handler factory with timeout configuration
dod:
  - text: >-
      _oidc_token_cache_ttl splits the token on ".", decodes the second segment with base64url,
      parses JSON to _OidcTokenClaims, reads the exp field (float), and returns min(max_ttl, exp - now - margin),
      falling back to max_ttl on any decode/parse/overflow error.
    proof: [oidc-ttl-bounds]
  - text: >-
      _OidcTokenClaims is a model with an optional exp field (float or None),
      and _OIDC_TOKEN_EXPIRY_MARGIN_SECONDS is 60.
    proof: [oidc-types]
  - text: >-
      oidc_allowed_dirs reads LITELLM_OIDC_ALLOWED_CREDENTIAL_DIRS (comma-separated, stripped),
      defaults to /var/run/secrets,/run/secrets, and returns a list of realpath-normalized absolute paths.
    proof: [oidc-allowed-dirs]
  - text: >-
      _resolve_oidc_file_path rejects non-absolute paths with a ValueError naming the required format,
      validates the resolved path falls within at least one allowed directory using commonpath,
      and handles Windows drive-difference errors by continuing to the next directory.
    proof: [oidc-path-containment]
  - text: >-
      _get_oidc_http_handler creates an HTTPHandler with timeout 600.0 seconds and connect timeout 5.0 seconds,
      and accepts an optional timeout parameter (defaults to None).
    proof: [oidc-http-handler]
  - text: >-
      JWT payload parsing is fuzzed with a cargo-fuzz target at crates/betterlite-secret-managers/fuzz/fuzz_targets/oidc_jwt_payload.rs,
      and a test named replays_the_oidc_jwt_payload_corpus replays every corpus file without panicking.
    proof: [oidc-jwt-fuzz-corpus]
  - text: >-
      Path resolution bounds file-system operations and symlink-escape cases are tested with explicit paths
      including relative links, absolute links, nested directories and attempts to traverse up.
    proof: [oidc-path-cases]
checks:
  optional: []
  commands:
    - id: oidc-types
      why: the OIDC token claims model or expiry margin does not match LiteLLM
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^oidc_types::/)'
    - id: oidc-ttl-bounds
      why: the JWT payload decoder or TTL calculation is incorrect
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^oidc_ttl_bounds::/)'
    - id: oidc-allowed-dirs
      why: the allowed credential directory resolution does not match LiteLLM
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^oidc_allowed_dirs::/)'
    - id: oidc-path-containment
      why: the path resolution or containment check is incorrect
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^oidc_path_containment::/)'
    - id: oidc-http-handler
      why: the HTTP handler factory does not match LiteLLM
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^oidc_http_handler::/)'
    - id: oidc-path-cases
      why: path resolution does not handle symlinks, relative paths or containment correctly
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^oidc_path_cases::/)'
    - id: oidc-jwt-fuzz-corpus
      why: the JWT payload fuzz target or its corpus is missing, or replaying the corpus fails
      run: test -f crates/betterlite-secret-managers/fuzz/fuzz_targets/oidc_jwt_payload.rs && test "$(ls crates/betterlite-secret-managers/fuzz/corpus/oidc_jwt_payload 2>/dev/null | wc -l)" -ge 1 && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(replays_the_oidc_jwt_payload_corpus)'
oracle_cases: []
deviations:
  - what: oidc_allowed_dirs normalizes all configured paths with realpath, even if a path is relative; LiteLLM does not reject relative paths in the configuration.
    why: Betterlite normalizes at parse time so every allowed directory is absolute and canonical, preventing path-traversal bypasses and symlink escapes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L60-L67
  - what: Path containment uses realpath on both the requested file and each allowed directory, then commonpath to verify the allowed directory is a prefix.
    why: This matches LiteLLM's intent (checking os.path.commonpath equality) and handles Windows drive-difference errors like LiteLLM does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L81-L89
  - what: TTL calculation caps at 1 second minimum (exp - now - margin) to avoid zero or negative cache entries; LiteLLM returns a 0 or negative result, which the caching layer must handle.
    why: Betterlite's cache abstraction rejects non-positive TTLs, so an expired or near-expiry token returns max_ttl instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L30-L46
out_of_scope:
  - Token acquisition from OIDC providers (GitHub, CircleCI, Azure, Google metadata, etc.). That remains in B129 get_secret.
  - Caching layer and in-memory TTL enforcement. B2226 (local-ttl-cache) and B129 handle that.
  - Virtual key and credential rotation.
pitfalls:
  - The JWT exp claim is a float (Unix timestamp in seconds); compare and truncate to integers before arithmetic to avoid overflow.
  - The base64url padding is reconstructed by counting remainder characters and adding "=" signs; no padding in the URL form means implicit trailing nulls.
  - commonpath raises ValueError on Windows when paths are on different drives; treat that as not-matching and continue to the next directory.
  - Symlinks and relative paths in allowed directories are resolved with realpath before checking containment; a symlink pointing outside the allowed tree is blocked.
  - An unreadable or missing LITELLM_OIDC_ALLOWED_CREDENTIAL_DIRS defaults to the standard container mount points; do not fail if the env var is absent.
  - The function names oidc_allowed_dirs (public) must stay under 30 characters; other private helpers (_oidc_token_cache_ttl, _resolve_oidc_file_path, _get_oidc_http_handler) also respect the limit.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
