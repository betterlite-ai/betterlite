id: B4411
title: Bound OIDC token lifetime and credential file access
description: >-
  Build OIDC token expiry calculation from JWT payload, allowed credential-path resolution
  and the OIDC transport factory. Keep token acquisition and provider selection in B129,
  so this lower layer never calls get_secret.

  Implement _oidc_token_cache_ttl to extract and validate the exp claim from a JWT token
  (base64-decode the middle segment, parse JSON), cap the TTL by token expiry minus a 60-second
  margin, and fall back to max_ttl on malformed or missing exp. Add _OidcTokenClaims model
  with optional exp field and _OIDC_TOKEN_EXPIRY_MARGIN_SECONDS constant (60 seconds).

  Implement oidc_allowed_dirs to return normalized absolute paths from LITELLM_OIDC_ALLOWED_CREDENTIAL_DIRS
  environment variable (comma-separated), or default to /var/run/secrets,/run/secrets. Each path is resolved with realpath.

  Implement _resolve_oidc_file_path to accept a requested file path, validate it is absolute,
  resolve it with realpath, verify it falls within one of the allowed directories using commonpath
  containment check, and raise ValueError with guidance if not. Handle Windows drive differences where commonpath raises.

  Implement _get_oidc_http_handler to create an HTTPHandler with timeout 600 seconds and connect
  timeout 5 seconds, using the injected HTTPHandler from B173's betterlite-http.

  Config accepts LITELLM_OIDC_ALLOWED_CREDENTIAL_DIRS through environment lookup (B002);
  no new config section is added. All path inputs and JWT payloads are bounded and tested with fuzz.
scope:
  paths:
    - crates/betterlite-secret-managers/src/oidc.rs
    - crates/betterlite-secret-managers/src/oidc/**
    - crates/betterlite-secret-managers/fuzz/fuzz_targets/oidc_jwt_payload.rs
    - crates/betterlite-secret-managers/fuzz/corpus/oidc_jwt_payload/**
  lint_tables: false
