checks:
  optional:
  - mutants
  commands:
  - id: case-consecutive-guarded-user-text
    why: The consecutive-guarded-user-text behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::converse_messages_cases::case_[0-9]+_consecutive_guarded_user_text$/)'
  - id: case-orphan-tool-with-modify-params
    why: The orphan-tool-with-modify-params behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::converse_messages_cases::case_[0-9]+_orphan_tool_with_modify_params$/)'
  - id: case-orphan-tool-error
    why: The orphan-tool-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::converse_messages_cases::case_[0-9]+_orphan_tool_error$/)'
  - id: case-system-around-tool-result
