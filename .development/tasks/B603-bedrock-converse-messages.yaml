id: B603
title: Bedrock Converse system and orphan-tool handling
description: >-
  Add ConverseMessagePolicy ahead of B181 message construction, including guarded text, orphaned-tool neutralization
  and placement of system runs around tool results. Preserve modify_params gating and stable order; existing prompt
  helpers remain the sole owners of image/document/tool block conversion.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig._convert_consecutive_user_messages_to_guarded_text L169-L218; AmazonConverseConfig._has_orphaned_tool_blocks
  L221-L225; AmazonConverseConfig._neutralize_orphaned_tool_blocks L228-L278; AmazonConverseConfig._handle_orphaned_tool_blocks
  L281-L296; AmazonConverseConfig._assistant_has_tool_calls L1356-L1357; AmazonConverseConfig._opens_with_tool_result
  L1360-L1371; AmazonConverseConfig._system_run_before L1373-L1378; AmazonConverseConfig._system_run_end L1380-L1384;
  AmazonConverseConfig._reordered_around_tool_results L1386-L1423; AmazonConverseConfig._system_role_message_as_user
  L1425-L1441; AmazonConverseConfig._converted_or_kept L1443-L1448; AmazonConverseConfig._converted_text_blocks
  L1450-L1459; AmazonConverseConfig._text_part L1462-L1465; AmazonConverseConfig._converted_text_block L1468-L1471;
  AmazonConverseConfig._transform_system_message L1473-L1506.


  Named case contracts: consecutive_guarded_user_text: Only guardrailConfig key presence enables conversion, including
  valueNone/false. Scan contiguous role=user suffix from end; none -> original list. Otherwise deepcopy all messages,
  and for each suffix user with list content skip the whole message if any dict type=guarded_text already exists.
  Other dict type=text becomes exactly {type:guarded_text,text:<required text>}, dropping cache_control/extra fields;
  nontext parts retained. String content including empty becomes one guarded_text block; other content types unchanged.
  Earlier user turns are not touched by this suffix helper. orphan_tool_with_modify_params: With neutralization
  disabled, any tools key present (evenNone/[]) skips the legacy check. Otherwise B2202 has_tool_call_blocks detects
  non-None tool_calls on anyrole, including[]. If modify_params truthy set tools to B2202 dummy_tool literal function
  and retain messages. Plain tool/function result without tool_calls does not trigger this legacy path. orphan_tool_error:
  With neutralization disabled, absent tools, B2202 tool-call predicate true and modify_params false, UnsupportedParamsError400:
  Bedrock doesn't support tool calling without `tools=` param specified. Pass `tools=` param OR set `litellm.modify_params
  = True` // `litellm_settings::modify_params: True` to add dummy tool to the request. model empty string, providerbedrock,
  no param/code supplied. system_around_tool_result: Use B221 dict/object role and content accessors. Tool-result
  turn is roletool or roleuser whose first content part type=tool_result; rolefunction never qualifies and a later
  tool_result part does not qualify. Move a consecutive mid-history system run only when immediately preceded by
  assistant with truthy tool_calls and followed by one or more contiguous result turns; place the whole system run
  after the final result. Preserve all other order and leading cached prefix. No movement for assistant tool_calls=[]
  or incomplete adjacency. system_role_as_user: Hoist only the leading role=system run; developer is not system.
  Later systems become user content with first exact text Operator note (not from the user): the following was originally
  a mid-conversation system-role reminder. followed by nonempty text parts. Empty/no-text later system disappears.
  Nonempty string including whitespace survives; list selects dict type=text with truthy text, discards other blocks/extra
  fields. Preserve per-part cache_control iff non-None; string uses message-level cache_control. Converted message
  drops other outer fields. system_text_cache_control: Leading system string truthy ->text block then B602 cache
  point from message; list emits each type=text truthy part then its own cache point, ignoring message-level cache_control.
  Empty strings/no-text content produce no system/cache blocks. A later converted system keeps cache_control on
  its text blocks but not on the generated operator note. Both sync/async request assembly use exactly this helper.
  orphan_neutralization_default: litellm_settings.bedrock_neutralize_orphaned_tool_blocks defaultsTrue and uses
  truthiness. With it on, any truthy optional tools prevents rewriting; otherwise orphan means assistant with truthy
  tool_calls or any roletool/function. Warn litellm.bedrock: request has tool blocks in message history but no `tools=`
  param; neutralizing orphaned tool blocks to text so Bedrock accepts the request without a toolConfig. Non-text
  tool-result payloads are dropped. Pass `tools=` to preserve structured tool calling. This default path does not
  depend on modify_params. orphan_text_projection: Assistant with calls becomes only roleassistant/content: B218
  flattening plus newline-joined [tool call <id>: <name>(<arguments>)] (omit id space when falsey, default falseyname
  unknown_tool and arguments empty). Empty base text skipped without stripping it. Tool/function becomes only roleuser/content
  [tool result for <tool_call_id or name or unknown>: <stripped flattened result or <non-text tool result omitted>>].
  With guardrailConfig present, wrap every such result in guarded_text even mid-history. Drop other fields on rewritten
  messages; unchanged messages retain their fields.


  Load bedrock_neutralize_orphaned_tool_blocks through betterlite-config, with injected environment lookup and the
  defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest bedrock_converse_messages_config_cases; each named loads_<key> case invokes the real B002 loader,
  checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Use shared modify_params configuration from B2202: litellm_settings.modify_params defaultsfalse; LITELLM_MODIFY_PARAMS
  uses Python bool of the environment string, so every nonempty string (including false and0) is true, empty/unset
  false. B218 owns content flattening/search-result text and B221 owns message/part accessors. No image or file
  is fetched in this policy.


  Implement crates/betterlite-bedrock/src/converse_messages.rs with adjacent tests under converse_messages/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_converse_messages in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_messages_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): consecutive_guarded_user_text, orphan_tool_with_modify_params, orphan_tool_error, system_around_tool_result,
  system_role_as_user, system_text_cache_control, orphan_neutralization_default, orphan_text_projection. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_messages* using HelperCase:
  kind: helper and the externally tagged bedrock_converse_messages variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_messages that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 233 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 245 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
