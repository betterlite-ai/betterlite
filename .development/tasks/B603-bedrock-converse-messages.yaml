id: B603
title: Bedrock Converse system and orphan-tool handling
description: >-
  Add ConverseMessagePolicy ahead of B181 message construction, including guarded text, orphaned-tool neutralization
  and placement of system runs around tool results. Preserve modify_params gating and stable order; existing prompt
  helpers remain the sole owners of image/document/tool block conversion.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig._convert_consecutive_user_messages_to_guarded_text L169-L218; AmazonConverseConfig._has_orphaned_tool_blocks
  L221-L225; AmazonConverseConfig._neutralize_orphaned_tool_blocks L228-L278; AmazonConverseConfig._handle_orphaned_tool_blocks
  L281-L296; AmazonConverseConfig._assistant_has_tool_calls L1356-L1357; AmazonConverseConfig._opens_with_tool_result
  L1360-L1371; AmazonConverseConfig._system_run_before L1373-L1378; AmazonConverseConfig._system_run_end L1380-L1384;
  AmazonConverseConfig._reordered_around_tool_results L1386-L1423; AmazonConverseConfig._system_role_message_as_user
  L1425-L1441; AmazonConverseConfig._converted_or_kept L1443-L1448; AmazonConverseConfig._converted_text_blocks
  L1450-L1459; AmazonConverseConfig._text_part L1462-L1465; AmazonConverseConfig._converted_text_block L1468-L1471;
  AmazonConverseConfig._transform_system_message L1473-L1506.


  Implement crates/betterlite-bedrock/src/converse_messages.rs with adjacent tests under converse_messages/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_converse_messages in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_messages_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): consecutive_guarded_user_text, orphan_tool_with_modify_params, orphan_tool_error, system_around_tool_result,
  system_role_as_user, system_text_cache_control. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and
  captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_messages* using HelperCase:
  kind: helper and the externally tagged bedrock_converse_messages variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_messages that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 233 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 458 planned, 475 maximum changed lines.
