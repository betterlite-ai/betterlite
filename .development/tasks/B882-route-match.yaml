dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: azure_alias, bedrock_invoke,
      path_template, wildcard_boundary, allowed_route_enum_expansion, sibling_prefix_denied,
      classifier_table_groups, nonstring_route_false, azure_two_segments_and_engine,
      mcp_get_one_segment_only, info_exact_management_patterns, placeholder_nonempty_segment,
      path_placeholder_slash_colon_newline, google_colon_suffix_boundary,
      regex_metacharacters_and_final_newline, final_star_empty_suffix, inner_star_not_wildcard,
      empty_allowlist_denies, expansion_unknown_and_duplicates, method_missing_nonstrings,
      method_other_error_propagates, assistant_substrings, generate_content_case,
      scope_path_beats_host_url, app_root_precedence, root_exact_and_sibling and route_getter_debug_fallback.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^route_match::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/route_match.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/route-match-*")"
        && grep -rlq "route_match" tools/oracle/fuzz/corpus/helper_case/route-match-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::route_match::tests::/)
        - test(/replays_the_/)'
