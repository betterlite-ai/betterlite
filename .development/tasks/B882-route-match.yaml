id: B882
title: Route template wildcard and allowlist matching
description: >-
  Implement the pinned route classifier, enum expansion, template and wildcard matching over the separate
  route tables. Prefix matching for registered /provider/ routes requires a trailing slash; /fake-openai-proxy-600
  is not /fake-openai-proxy. Request method distinguishes GET MCP discovery from protected mutation. Match
  already-decoded bounded paths using the existing route decoder.

  Classify LLM routes using B866/B867/B868's exact OpenAI, Anthropic, Google and native tables, MCP
  and agent inference access patterns, then OpenAI templates/wildcards, Google/Anthropic templates,
  Azure aliases and mapped-provider prefixes. Nonstrings are false. Azure's special regex accepts
  /openai/deployments/<segment>/<segment>/chat/completions and /engines/<segment>/chat/completions;
  do not broaden that special case to a single deployment segment. Management uses check_route_access;
  info is exact table membership. GET MCP discovery accepts /v1/mcp/server or exactly one nonempty
  child segment, not a trailing slash, approve suffix or mutation method. Missing request is false.

  Templates substitute {name} with one nonempty segment; {name:path} accepts slashes, colons and
  newlines unless a literal colon follows the placeholder, in which case it stops before any colon.
  Preserve Python's anchored regex semantics, including regex metacharacters in the surrounding
  pattern and its final-newline boundary; do not silently convert every pattern to an escaped literal.
  Wildcards are recognized only by a final *, which means raw prefix matching, including empty suffix.
  The separate allowed-route matcher accepts exact equality or prefix plus slash; it is not the
  wildcard matcher. check_route_access tries exact, trailing-wildcard and then template/regex matching;
  an empty list denies. get_actual_routes expands named LiteLLMRoutes groups, preserves duplicates
  and literal unknown names; set-valued group ordering is not a compatibility promise.

  _get_request_method uppercases a string and returns None for missing request, missing method,
  AttributeError/KeyError or nonstring values. Other getter failures propagate. Assistant detection
  is the case-sensitive substring test thread or assistant in the canonical route; generate-content
  detection is case-sensitive generateContent or streamGenerateContent anywhere in the string.
  These helpers return booleans, not HTTP errors; callers own denial envelopes.

  Move auth_utils.get_request_route (L668-L703) below its B741 caller into this task because assistant
  detection calls it. It reads the authoritative scope path rather than Host-derived URL path, takes
  app_root_path before root_path, strips trailing slashes from the root and removes it only at a whole
  segment boundary. An exact root becomes /. Non-dict scope or exceptions fall back to string URL path;
  exceptions debug-log. B741 retains route templates, normalization and additional-public-route policy
  and consumes this lower helper instead of being a reverse dependency.


  Build the production route_match module in betterlite-auth; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/route_checks.py:
  RouteChecks.is_llm_api_route (L385-L447; 42 source lines), RouteChecks._is_get_mcp_server_discovery_route
  (L450-L470; 19 source lines), RouteChecks.is_management_route (L473-L477; 5 source lines), RouteChecks.is_info_route
  (L480-L484; 5 source lines), RouteChecks._is_azure_openai_route (L487-L503; 13 source lines), RouteChecks._route_matches_pattern
  (L506-L548; 23 source lines), RouteChecks._is_wildcard_pattern (L551-L555; 5 source lines), RouteChecks.route_matches_wildcard_pattern
  (L558-L584; 19 source lines), RouteChecks._route_matches_allowed_route (L587-L610; 19 source lines),
  RouteChecks.check_route_access (L613-L652; 22 source lines), RouteChecks._is_assistants_api_request
  (L765-L781; 13 source lines), RouteChecks.is_generate_content_route (L784-L794; 10 source lines), RouteChecks._get_request_method
  (L655-L666; 10 source lines). litellm/proxy/auth/auth_checks.py: get_actual_routes (L1420-L1432; 12
  source lines).


  Add the route_match operation under B856 Management::auth. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a route-match-*
  seed to B171 helper_case, which already owns this decoder.


  Route matching is a pure policy input. Compare the original path strings and group tables in helper
  cases; native B732 wiring then checks that a matching result reaches its consumer without registering
  duplicate routes or inventing a database dependency.


  Sizing: 217 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  240 production, 250 behavior tests, 75 helper adapters and 65 wiring lines, 630 within a 650-line gate;
  this includes the moved route getter's 21 executable lines. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::route_match::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
