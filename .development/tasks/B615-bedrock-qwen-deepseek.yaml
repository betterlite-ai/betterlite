id: B615
title: Bedrock Qwen and DeepSeek reasoning replies
description: >-
  Add Qwen2/Qwen3/DeepSeek parameter, prompt and reply projections, sharing native base transport and bounded reasoning-tag
  decoding. Preserve usage, finish reasons and reasoning_content separately from visible text; local templates only.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen2_transformation.py:
  AmazonQwen2Config.transform_response L37-L95. litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen3_transformation.py:
  AmazonQwen3Config.__init__ L38-L50; AmazonQwen3Config.get_supported_openai_params L52-L60; AmazonQwen3Config.map_openai_params
  L62-L82; AmazonQwen3Config.transform_request L84-L115; AmazonQwen3Config._convert_messages_to_prompt L117-L161;
  AmazonQwen3Config.transform_response L163-L219. litellm/llms/bedrock/chat/invoke_transformations/amazon_deepseek_transformation.py:
  AmazonDeepSeekR1Config.transform_response L32-L79.


  Reuse AmazonInvokeConfig.__init__ from B611 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  The DeepSeekR1StreamingIterator and its stream-chunk case belong to B609; this leaf only normalizes buffered replies
  and parameters.


  Implement crates/betterlite-bedrock/src/qwen_deepseek.rs with adjacent tests under qwen_deepseek/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_qwen_deepseek in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function qwen_deepseek_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  qwen2_output, qwen3_chat_prompt, qwen3_options, qwen3_reasoning_content, deepseek_buffered_response. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use
  the booted proxy and assert both client response and captured upstream request. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_qwen_deepseek* using HelperCase: kind:
  helper and the externally tagged bedrock_qwen_deepseek variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_qwen_deepseek that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_qwen_reply consumes Qwen/DeepSeek provider JSON reply bytes in crates/betterlite-bedrock/src/qwen_deepseek.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_qwen_deepseek.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_qwen_deepseek.
  The adjacent test replays_the_bedrock_qwen_deepseek_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 247 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 515 planned, 525 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/qwen_deepseek.rs
  - crates/betterlite-bedrock/src/qwen_deepseek/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_qwen_deepseek.rs
  - tools/oracle/src/helpers/bedrock_qwen_deepseek/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_qwen_deepseek.py
  - tools/oracle/cases/helpers/providers/bedrock-qwen-deepseek/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_qwen_deepseek*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_qwen_deepseek.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_qwen_deepseek/**
  lint_tables: false
