dod:
- text: 'qwen2 output: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-qwen-deepseek/qwen2-output.yaml.'
  proof:
  - case-qwen2-output
  - oracle
  - helper-python
- text: 'qwen3 chat prompt: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-qwen-deepseek/qwen3-chat-prompt.yaml.'
  proof:
  - case-qwen3-chat-prompt
  - oracle
  - helper-python
- text: 'qwen3 options: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-qwen-deepseek/qwen3-options.yaml.'
  proof:
  - case-qwen3-options
  - oracle
  - helper-python
- text: >-
    qwen3 reasoning content: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-qwen-deepseek/qwen3-reasoning-content.yaml.
  proof:
