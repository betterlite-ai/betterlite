checks:
  optional:
  - mutants
  commands:
  - id: case-qwen2-output
    why: The qwen2-output behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::qwen_deepseek_cases::case_[0-9]+_qwen2_output$/)'
  - id: case-qwen3-chat-prompt
    why: The qwen3-chat-prompt behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::qwen_deepseek_cases::case_[0-9]+_qwen3_chat_prompt$/)'
  - id: case-qwen3-options
    why: The qwen3-options behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::qwen_deepseek_cases::case_[0-9]+_qwen3_options$/)'
  - id: case-qwen3-reasoning-content
    why: The qwen3-reasoning-content behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::qwen_deepseek_cases::case_[0-9]+_qwen3_reasoning_content$/)'
  - id: case-deepseek-buffered-response
    why: The deepseek-buffered-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::qwen_deepseek_cases::case_[0-9]+_deepseek_buffered_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_qwen_deepseek.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_qwen_deepseek*")"
      && grep -lq 'bedrock_qwen_deepseek' tools/oracle/fuzz/corpus/helper_case/bedrock_qwen_deepseek* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_qwen_deepseek$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_qwen_deepseek)"
      && grep -q 'decode_qwen_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_qwen_deepseek.rs && cargo
      nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_qwen_deepseek_corpus$/)'
