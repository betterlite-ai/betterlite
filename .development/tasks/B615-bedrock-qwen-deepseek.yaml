  litellm/llms/bedrock/chat/invoke_transformations/amazon_deepseek_transformation.py: AmazonDeepseekR1ResponseIterator.__init__
  L83-L85; AmazonDeepseekR1ResponseIterator.chunk_parser L87-L121 belong to B609; reuse that implementation or its
