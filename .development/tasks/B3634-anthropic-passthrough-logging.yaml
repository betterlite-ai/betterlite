dod:
  - text: A status 200 response on a route containing "/v1/messages/batches" goes to B3633's batch_creation_handler, and its result and kwargs come back as the outcome; any other status on that route takes the normal transform path.
    proof: [anthropic-tests, anthropic-oracle]
  - text: The batches results transform is chosen only when the route contains both "messages/batches" and "results"; every other route uses the chat transform, which gets the request speed as an optional param.
    proof: [anthropic-tests, anthropic-oracle]
  - text: The payload step sets response_cost and model on the kwargs and the call log, resolves the costing model first, and gives a cache hit a cost of 0.0.
    proof: [anthropic-tests, anthropic-oracle]
  - text: complete_streaming_response is written to the call log only when stream is exactly true, and the stored copy carries the final id and model.
    proof: [anthropic-tests, anthropic-oracle]
  - text: A request body with an end user replaces litellm_params.proxy_server_request with a body holding that user and keeps the other litellm_params keys.
    proof: [anthropic-tests, anthropic-oracle]
  - text: The response id is the upstream id when it is non-empty and the call log's litellm_call_id otherwise; custom_llm_provider is set to "anthropic" only when it was missing or empty.
    proof: [anthropic-tests, anthropic-oracle]
  - text: An error inside the payload step is logged with the "Error creating Anthropic response logging payload" text and the kwargs built so far come back without an error.
    proof: [anthropic-tests]
  - text: The collected-chunks handler uses the logged model, B3632's response builder and the id from the message_start event, and returns no result with empty kwargs and the error log when nothing could be built.
    proof: [anthropic-tests, anthropic-oracle]
  - text: A typed error from the chunk readers or the stream builder comes back as Err and converts into HandlerError.
    proof: [anthropic-tests]
  - text: The helper adapter's Python passes the strict lint and type check.
    proof: [helper-python]
checks:
  optional: []
  commands:
    - id: anthropic-tests
      why: the batch branch, config choice, payload steps or collected-chunks handler are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::anthropic_passthrough_logging::tests::anthropic_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3634)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3634 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3634/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/anthropic_passthrough_logging-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: anthropic-oracle
      why: newly added helper cases are absent, do not use the b3634 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/anthropic-passthrough-logging)" &&
        grep -rlE '^[[:space:]]+b3634:' tools/oracle/cases/helpers/anthropic-passthrough-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/anthropic-passthrough-logging
