id: B3634
title: Anthropic passthrough response logging
description: >-
  Build the Anthropic leaf of pass-through response logging in betterlite-server, in the module anthropic_passthrough_logging (crates/betterlite-server/src/pass_through_logging/anthropic_passthrough_logging.rs and its folder; the skeleton declares it).
  It turns a relayed Anthropic response, whole or streamed, into the response object and the kwargs that the success logger prices and writes as spend. A wrong cost or a missing model here means wrong spend for the key, so the cost order and the call log writes below are exact.
  Nothing here holds module-level state. The struct takes its collaborators in its constructor. This task writes glue and the order of calls; the work itself is done by tasks that are already merged, so call them and do not copy their logic.


  Collaborators, called and not defined here. B3630: cost_relevant_speed, resolve_costing_model, compute_response_cost, resolve_logged_model, extract_response_id_from_chunks, end_user_from_request_body, optional_str, and its typed kwargs struct ResponseLoggingKwargs (response_payload module). B3632: build_streaming_response_for_logging(call_log, request_body, all_chunks, model) -> Result<Option<AssembledResponse>, InterruptedStreamUsageError>. B3633: AnthropicBatchLogging, BatchCreationInput, BatchCreationLogged and its batch_creation_handler. B580: AnthropicConfig.transform_response. B587: AnthropicBatchesConfig.transform_response. B247: CallLog, the per-call log (LiteLLM's logging object with model_call_details and litellm_call_id). B3608: CollectedChunksHandler, CollectedChunksCall and HandlerOutcome. B3605: the response-object enum and the typed kwargs map that HandlerOutcome holds. Read the merged code for the exact Rust names and signatures and use them; the names above are the roles. If a function you need is not there, say so in the report notes and stop.


  Constructor and public surface, pinned. B3606 (the provider dispatcher) and B102 (the wiring) call these, so names and argument lists do not change.
  `pub struct AnthropicPassthroughLogger` with `AnthropicPassthroughLogger::new(batch_logging: AnthropicBatchLogging, cost: <the Arc cost collaborator that B3630's compute_response_cost takes>) -> AnthropicPassthroughLogger`.
  `pub struct AnthropicPassthroughInput<'a> { pub status_code: u16, pub response_headers: &'a http::HeaderMap, pub response_text: &'a str, pub response_body: &'a serde_json::Map<String, serde_json::Value>, pub url_route: &'a str, pub start_time: DateTime<Utc>, pub end_time: DateTime<Utc>, pub request_body: &'a serde_json::Map<String, serde_json::Value>, pub kwargs: <B3605 typed kwargs map> }`. response_text is the whole buffered upstream body as text (LiteLLM's httpx_response.text). response_body is that body parsed as an object, or an empty map when the body was a list or absent (B3606 does that shaping). LiteLLM's result and cache_hit arguments are not used by this handler, so they are not in the struct.
  `impl AnthropicPassthroughLogger { pub fn anthropic_passthrough_handler(&self, input: AnthropicPassthroughInput<'_>, call_log: &mut CallLog) -> Result<HandlerOutcome, AnthropicPassthroughError> }`. It is synchronous.
  `impl CollectedChunksHandler for AnthropicPassthroughLogger`, the streaming entry that B3608 calls once a stream ends.
  AnthropicPassthroughError is this module's own thiserror enum with variants for a failed response transform (source B580's or B587's error), a failed stream build (source B3632's InterruptedStreamUsageError) and a failed message_start read (source B3630's stream_fields error). It must convert into B3608's HandlerError so the stream seam can return it. Where the module needs a CallLog from the logging object handle in CollectedChunksCall, get it the way B3640's collected-chunks handlers do.


  anthropic_passthrough_handler, in LiteLLM's order.
  1. Batch branch. When url_route contains the text "/v1/messages/batches" anywhere (a plain substring test, not B3630's is_collection_route) and status_code is exactly 200, call B3633's batch_creation_handler and return its result. Build BatchCreationInput with status_code, the body bytes (response_text as bytes), url_route, start_time, request_body (Some of the map) and request_metadata, which is kwargs litellm_params.metadata with a missing or null litellm_params or metadata counted as empty. Turn the BatchCreationLogged into a HandlerOutcome: its result becomes the chat variant of B3605's response-object enum field by field (id, model, object, created, the one choice with its message and provider_specific_fields), and its kwargs (response_cost, model, batch_id, unified_object_id, batch_job_state) go into the typed kwargs map. LiteLLM's `request_body or kwargs.get("request_body", {})` fallback can never reach a different value (a request_body key in kwargs would already be a TypeError in the caller), so the request body is used as given.
  2. Model and speed. model is response_body["model"] when it is a string, else "". speed is B3630's cost_relevant_speed(request_body).
  3. Pick the transform. When url_route contains both "messages/batches" and "results" (two separate case-sensitive substring tests, anywhere, either order), use B587's AnthropicBatchesConfig.transform_response. Otherwise use B580's AnthropicConfig.transform_response. This is LiteLLM's get_anthropic_config (llms/anthropic/__init__.py L7-L13); B027, the Anthropic provider umbrella, owns that selector at the composition level, and a task never depends on an umbrella, so write the two tests inline in the handler. Call the chosen transform with: the raw upstream response (status, headers, response_text), a fresh empty chat response, the model from step 2, no messages, optional params {"speed": speed} when speed is set and empty otherwise, empty api key, empty request data, empty litellm params, json_mode false, and the token encoding the merged transform asks for. A transform error comes back as Err; LiteLLM lets the exception rise.
  4. Payload. Call create_anthropic_response_logging_payload (below) with that response, the model, the input kwargs, the times, the call log and response_id = optional_str(response_body["id"]). Return HandlerOutcome with the response as result and the returned kwargs.


  create_anthropic_response_logging_payload(response, model, kwargs, start_time, end_time, call_log, response_id) -> kwargs. It is `pub(crate)` and never returns an error. Steps, in this order; the effect of a finished step stays when a later one fails.
  1. Outside the guarded block: when the call log's "stream" entry is exactly true, store the response in the call log under "complete_streaming_response". Store it only for a stream. The redaction step scrubs that entry only when stream is true, so storing it for a non-streaming call would let message text skip redaction.
  2. model = B3630's resolve_costing_model(model, call_log). response_cost = B3630's compute_response_cost(response, model, call_log) (0.0 on an exact cache hit).
  3. Set kwargs response_cost and model. Set the call log's "response_cost" to the cost (the pass-through success path reads spend from there and not from kwargs).
  4. When the kwargs carry a passthrough logging payload that is not empty: user = B3630's end_user_from_request_body(payload.request_body) when that request body is present and not empty. When user is found, set kwargs litellm_params.proxy_server_request to {"body": {"user": user}}, replacing whatever was in proxy_server_request and keeping the other litellm_params keys (LiteLLM's setdefault then update).
  5. Log the kwargs at debug level as indented JSON.
  6. Set response.id = response_id when it is some and not empty, else the call log's litellm_call_id. Set response.model = model. Set the call log's "model" = model. When the call log's "custom_llm_provider" is missing or empty, set it to "anthropic". When the stream rule of step 1 holds, store the response in "complete_streaming_response" again, so the stored copy carries the id and model (LiteLLM shares one object; Rust holds a copy).
  Any error in steps 2 to 6 logs at error level "Error creating Anthropic response logging payload: {error}" and returns the kwargs as they stand at that point.
  This is not B3630's create_response_logging_payload. The Anthropic copy builds no standard_logging_object, resolves the costing model first, writes the stream entry and the "anthropic" provider, and takes the response id as an argument.


  Collected chunks (CollectedChunksHandler::handle). call.lines are the stream split into text lines; wrap each as a text entry of the chunk type B3630's stream_fields already uses. Do not define another chunk type.
  1. model = B3630's resolve_logged_model(call_log, request_body, all_chunks). call.model is not used for Anthropic.
  2. response = B3632's build_streaming_response_for_logging(call_log, request_body, all_chunks, model).
  3. When that gives none, log at error level "Unable to build complete streaming response for Anthropic passthrough endpoint, not logging..." and return no result with empty kwargs.
  4. Otherwise call create_anthropic_response_logging_payload with an empty kwargs, the model, the times, the call log and response_id = B3630's extract_response_id_from_chunks(all_chunks), and return the response with those kwargs.
  A typed error from B3630's chunk readers (invalid UTF-8) or from B3632 is returned as Err, as LiteLLM lets UnicodeDecodeError rise. endpoint_type and the passthrough success handler argument of LiteLLM's signature are not used.


  Tests: module tests under pass_through_logging::anthropic_passthrough_logging::tests, every name starting anthropic_. Fakes stand in for the cost collaborator and the batch registry; the real B3630 helpers run. Cover: the batch branch taken for 200 with a "/v1/messages/batches" route and a "/v1/messages/batches/x/results" route (still taken, because of the substring test) and not taken for a 400 on the same route; the get_anthropic_config tests (both substrings needed, either order); speed passed to the transform; the payload steps in order with a failure at the cost step leaving model unset and kwargs untouched by later steps; complete_streaming_response stored only when stream is true and carrying the final id and model; proxy_server_request replacement that keeps other litellm_params keys; id fallback to litellm_call_id for none and for an empty string; custom_llm_provider kept when already set; the collected-chunks none case with its log line; and a typed UTF-8 error coming out as Err.
  Oracle: this code is not reached by a route until B3606 and B102 wire it, so the cases are helper cases through the helper operation named after this task. The adapter calls the pinned Python static methods (anthropic_passthrough_handler with an httpx.Response, _create_anthropic_response_logging_payload and _handle_logging_anthropic_collected_chunks) on a real litellm Logging object with a fixed litellm_call_id, with LITELLM_RUST=false and the local model cost map, and returns the kwargs, the response id and model, and the model_call_details entries that were written. It never copies the algorithm. B3606 and B102 add the HTTP cases.
