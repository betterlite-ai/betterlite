  - tools/oracle/cases/helpers/anthropic-passthrough-logging/payload-end-user-replaces-proxy-server-request.yaml
  - tools/oracle/cases/helpers/anthropic-passthrough-logging/payload-empty-response-id-uses-call-id.yaml
  - tools/oracle/cases/helpers/anthropic-passthrough-logging/payload-cache-hit-zero-cost.yaml
  - tools/oracle/cases/helpers/anthropic-passthrough-logging/chunks-complete-stream-logged.yaml
  - tools/oracle/cases/helpers/anthropic-passthrough-logging/chunks-no-message-start-unknown-model.yaml
deviations:
  - what: The handler takes the upstream body as text plus a parsed object, and has no result or cache_hit argument.
    why: LiteLLM passes an httpx.Response and never reads result or cache_hit in this handler; Rust has no httpx object, so the two views of the body are explicit.
  - what: The response is stored in complete_streaming_response twice for a stream (before the guarded block, and again once id and model are set).
    why: LiteLLM stores one shared object that later steps mutate in place; Rust holds a copy, so the second store gives the same final state.
  - what: Errors are typed errors. LiteLLM's blanket `except Exception` in the payload step catches only the typed errors of the steps it wraps, and a bad UTF-8 chunk is an Err where LiteLLM lets UnicodeDecodeError rise.
    why: Rust has no runtime attribute errors and a panic is banned by the no-panics rule, so the typed error is the only failure left.
  - what: The batch result is converted into the chat variant of B3605's response-object enum.
    why: LiteLLM returns a ModelResponse built by hand in batch_creation_handler; the enum has no batch variant, and the downstream logger reads it as a chat response.
out_of_scope:
  - "batch_creation_handler, _store_batch_managed_object and get_actual_model_id_from_router: B3633 owns Anthropic batch logging and this task only calls it."
  - "record_partial_usage_for_failure, _build_streaming_response_for_logging, _assemble_streaming_response, _usage_only_response_or_none, _stream_was_interrupted, _recover_interrupted_stream_output_tokens and _clear_placeholder_cost: B3632 owns them. Their callers on the failure path are in B3609."
  - "_split_sse_chunk_into_events, _build_complete_streaming_response, _collapse_pure_text_chunks, _build_complete_streaming_response_legacy, _extract_sse_data and _build_usage_only_response_from_chunks: B3631 owns the stream reconstruction."
  - "_cost_relevant_speed, _resolve_costing_model, _resolve_logged_model, _cost_partial_stream_or_zero, _compute_response_cost, _extract_message_start_field, _extract_model_from_anthropic_chunks, _extract_response_id_from_anthropic_chunks and _get_user_from_metadata: B3630 owns them and its covers include the file."
  - "AnthropicConfig.transform_response (B580), AnthropicBatchesConfig.transform_response (B587) and get_anthropic_config as the umbrella's own selector (B027)."
  - "Choosing this handler for a route (is_anthropic_route, TRACKED_ANTHROPIC_ROUTES) and the adapter that reshapes ProviderLogInput into AnthropicPassthroughInput: B3606 owns them."
  - "The Anthropic frame probes and the stream routing that call the CollectedChunksHandler: B3608 owns them."
pitfalls:
  - The batch branch tests the substring "/v1/messages/batches" and status 200, so a 200 results download at ".../v1/messages/batches/{id}/results" goes to batch_creation_handler and becomes a "failed" record; AnthropicBatchesConfig is reached only for a non-200 status or a route without the "/v1/" prefix.
  - The batches transform needs both "messages/batches" and "results" in the route; "messages/batches" alone, such as a status poll, uses the chat transform.
  - complete_streaming_response must be written only when model_call_details["stream"] is exactly true; writing it for a non-streaming call lets message text skip redaction.
  - The costing model comes from resolve_costing_model before the cost is computed, and the same resolved model is what lands in kwargs["model"], the response and model_call_details["model"].
  - A cost error at step 2 leaves kwargs without response_cost and model and leaves the call log without response_cost, model and custom_llm_provider; the handler still returns normally with the result.
  - The response id uses `response_id or litellm_call_id`, so an empty string from the upstream falls back to the call id, and a non-string id was already turned into none by optional_str.
  - proxy_server_request is replaced as a whole, so any earlier proxy_server_request keys (headers, url) are lost when an end user is found; other litellm_params keys stay.
  - custom_llm_provider is set to "anthropic" only when the call log has none or an empty one; a value such as "bedrock" set earlier stays.
  - In the streaming path kwargs start empty, so there is no passthrough logging payload and no end-user step.
  - Anthropic's own payload step builds no standard_logging_object; do not call B3630's create_response_logging_payload here.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
