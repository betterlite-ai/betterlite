deviations:
  - what: admit_managed_actor and prepare_agent_invocation take the registry, the grant resolver and the read-through as arguments, and return AdmissionError { status, detail } instead of raising HTTPException.
    why: betterlite has no global registry and no exceptions; the caller turns the error into the same status and string detail.
  - what: A JSON bool in cost_per_query is an invalid price (503), and a numeric string is accepted.
    why: Pydantic's lax float mode decides bool handling beyond the declared type, and the worker writes no case for it. The numeric string is kept so a price an admin saved as text still works.
  - what: validate_managed_identity_request takes an IdentityRequest with an explicit Absent, Null or Value identity, not LiteLLM's TypedDict key test.
    why: A typed record cannot test for a missing key. The three states give LiteLLM's results.
out_of_scope:
  - "managed_agent_route_allowed, managed_inference_request, managed_agent_policy, actor_admission_failure, invocation_target and the route sets in managed_authorization.py L14-L139 and L192-L218 belong to B4772. This task calls actor_admission_failure only."
  - "The call sequence in user_api_key_auth.py L3270-L3312 (admit, the route 403 'Agent identities can only access inference and agent discovery routes', the inference request, the invocation target, the centralized checks) is not built here; see the notes."
  - "AgentIdentityStore and its methods belong to B4773. AgentRegistry belongs to B4776. is_agent_allowed and verified_human_agent_grants belong to B4780."
  - "POST, PUT, PATCH and DELETE on /v1/agents belong to B4785, which calls validate_managed_identity_request, check_agent_management_permission and reject_legacy_identity (B4772). The kill switch and make_public routes belong to B4786, the list and by-id routes to B4784."
  - "The registry reload behind ReadThrough (registry_read_through._resync_agents) is B8231's and B8645 backs the port with it; this task defines the port only."
  - "Filling IdentitySettings from config and env (B002 and B869 hold the keys) is B8647's and is not built here."
pitfalls:
  - The delegation flag is cleared in the first statement of admit_managed_actor, before the agent id check, so a key without an agent id also loses it.
  - Step c (no store) and step e (agent row missing) look alike but differ; only step c raises 503, step e raises 403 "Agent no longer exists" and only when a context exists or the agent was retired.
  - The policy fields are assigned before the delegated grant check, so a request that fails step j has still been marked on auth; the caller discards auth on error.
  - The grant check in step j is skipped when the flag was true, which is how a JWT or SSO path that already verified the human avoids a second database read.
  - is_agent_allowed is not asked for a plain agent called by a plain key (step g returns first), so such a request never reaches the store grant checks.
  - billing_agent_policy is set in prepare_agent_invocation only when auth.agent_id is None; a managed agent key keeps the policy that admit_managed_actor put there.
  - The price is read from the effective agent, which is the store row when a store exists and the registry copy otherwise, and the registry copy can be older.
  - cost_per_query is validated even when it is 0 or the agent is cheap; an invalid value fails the request with 503 rather than falling back to 0.
  - trusted_agent_issuers drops an entry for an empty audience string or an empty list, but the global JWT_ISSUER check still counts the dropped entry as present, so JWT_ISSUER equal to a dropped entry's issuer is not appended.
  - The delegated-mode rule in validate_managed_identity_request is `mode != autonomous`, so mode both also needs MICROSOFT_TENANT and MICROSOFT_CLIENT_ID.
  - A request with identity null returns Ok even when the existing agent has a bound identity; unbinding is not checked here.
  - EntraIdentityConfig validation lowercases and hyphenates UUIDs, so the issuer is built from the normalized tenant_id, not from the text the client sent.
  - The status route does not call check_feature_access_for_user, unlike the list route; only the proxy_admin check guards it.
  - The role text in the 403 detail is the role's value (internal_user), not an enum name.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
