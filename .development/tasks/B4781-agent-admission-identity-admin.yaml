dod:
  - text: admit_managed_actor clears the one-shot delegation flag first, returns Ok without an agent id, and with no store returns Ok for a plain agent and 503 "Managed agent policy requires a database" when a context exists or the registered agent is managed.
    proof: [admit-tests]
  - text: With a store, a missing agent answers 403 "Agent no longer exists" when a context exists or the agent was retired, and Ok otherwise; a store failure goes out as 503 or 403 by its code; a non-managed agent returns Ok without touching auth.
    proof: [admit-tests]
  - text: A managed agent with jwt claims and no context answers 403 "A managed agent requires a matching verified identity", and an admission failure from actor_admission_failure answers 403 with its message.
    proof: [admit-tests]
  - text: A successful admission sets managed_agent_policy, billing_agent_policy and requires_fresh_policy, and a delegated context that was not verified by the flag must hold the agent in the human's grants or answers 403 "The delegated user is not permitted to invoke this agent".
    proof: [admit-tests]
  - text: prepare_agent_invocation returns Ok for an unknown target, answers 503 without a store for a managed agent, 403 "Invoked agent no longer exists" when the store lost it, and returns without changes for a plain agent called by a plain key.
    proof: [invoke-tests]
  - text: prepare_agent_invocation answers 403 "The caller is not permitted to invoke this agent" when is_agent_allowed is false, and otherwise sets invoked_agent_id and invoked_agent_policy, and billing_agent_policy only when the key has no agent id and the target is managed.
    proof: [invoke-tests]
  - text: The invocation price is 0 when billable is false, the litellm_params cost_per_query when valid, and an invalid price answers 503 "Agent invocation price is invalid" without changing agent_invocation_cost.
    proof: [invoke-tests]
  - text: When the registry misses, prepare_agent_invocation tries the read-through port once and looks again only when it returned true.
    proof: [invoke-tests]
  - text: check_agent_management_permission passes only for proxy_admin and answers 403 with the object detail "Only proxy admins can create, update, or delete agents. Your role=<role>" for every other role, a proxy_admin_viewer included.
    proof: [permission-tests]
  - text: trusted_agent_issuers is empty without enable_jwt_auth, keeps only configured issuers with a non-empty audience and audience validation on, appends JWT_ISSUER once when JWT_AUDIENCE is set and no configured entry has that issuer, and keeps duplicates.
    proof: [issuers-tests]
  - text: validate_managed_identity_request passes when there is no identity, answers 400 for an invalid Entra config, for an untrusted issuer, and for delegated or both mode without the matching MICROSOFT_TENANT and a MICROSOFT_CLIENT_ID, and takes the identity and mode from the existing agent when the request omits them.
    proof: [validate-tests]
  - text: The identity_admin modules permission and validate are pub(crate), and validate exports IdentityRequest, IdentityField, IdentitySettings and validate_managed_identity_request for B4785.
    proof: [validate-tests]
  - text: GET /v1/agents/identity/providers answers the issuer list for an admin, and 403 for a non-admin, and GET /v1/agents/{agent_id}/identity answers 403 for a non-admin, 503 or 403 by failure code, 404 "Agent not found", and the status body for a found agent.
    proof: [route-tests]
  - text: The two identity handlers are tested with tower's oneshot over agent_identity_routes and fake ports; B8647 mounts them and proves the HTTP answers (401 without a key, the issuer list, the no-database 503) with the oracle cases moved there.
    proof: [route-tests]
  - text: The oracle helper cases for admission and invocation give LiteLLM's answers on the same fake store and registry.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: admit-tests
      why: admit_managed_actor is missing or differs in the flag reset, the no-database branch, the retired branch, the policy assignment or the delegated grant check
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^managed_admission::admit::/)'
    - id: invoke-tests
      why: prepare_agent_invocation is missing or differs in its lookup, its managed checks, its auth assignments or its price rule
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^managed_admission::invoke::/)'
    - id: permission-tests
      why: the admin-only check is missing or lets another role pass or changes the detail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::identity_admin::permission::/)'
    - id: issuers-tests
      why: the trusted issuer list differs in the JWT switch, the audience filter or the global issuer rule
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::identity_admin::issuers::/)'
    - id: validate-tests
      why: the managed identity request check is missing or differs in its order or its four 400 answers
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::identity_admin::validate::/)'
    - id: route-tests
      why: the two identity routes are missing or differ in their order of checks, status codes or bodies
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::identity_admin::routes::/)'
