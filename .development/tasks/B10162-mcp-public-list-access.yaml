    why: make_mcp_servers_public assigns litellm.public_mcp_servers the request's ids as they are.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L659
    why: _redact_mcp_credentials reads the same global, None read as empty.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L506
    why: The default, public_mcp_servers None.
dod:
  - text: public_mcp_servers returns the stored list in order, empty when unset.
    proof: [public-list-tests]
  - text: set_public_mcp_servers replaces the list as given, order and duplicates kept, an empty list clears it, and is_server_public with no explicit list sees the new list.
    proof: [public-list-tests]
