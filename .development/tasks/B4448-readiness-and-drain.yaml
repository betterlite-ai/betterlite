id: B4448
title: Readiness diagnostics, backlog counters and graceful drain routes
description: >-
  Build the probe-facing half of LiteLLM's health routes in betterlite-server, in a new module `health_readiness`,
  plus the process-wide shutdown state that /health/drain flips. LiteLLM's source is
  litellm/proxy/health_endpoints/_health_endpoints.py (lines 1412-2015, minus the liveliness GET) and
  litellm/proxy/shutdown/graceful_shutdown_manager.py. Split Rust files at the repository 300-line limit:
  shutdown_state, db_readiness, readiness_details, readiness_routes and callback_listing under
  crates/betterlite-server/src/health_readiness/, with `health_readiness.rs` declaring them.

  Shutdown state. `ShutdownState` is an owned value built at startup (no global, no lazy static) and shared as an Arc.
  It holds an in-flight counter source taken from B022 (read crates/betterlite-server/src/admission_control.rs for its
  public in-flight and stats accessors and call them; add no second counter), a shutting-down flag, a
  drain-performed flag and the timeout. It has `is_shutting_down()`, `start_shutdown()` and
  `wait_for_drain(timeout: Option<Duration>, exclude_self: bool) -> u64`. start_shutdown is idempotent: a second call
  changes nothing and logs nothing; the first logs `graceful_shutdown_started in_flight_requests=<n>` at info.
  wait_for_drain returns 0 at once when a drain already ran (the flag is set on entry, before any waiting), so a
  preStop drain followed by the SIGTERM drain never waits twice. The target is 1 when exclude_self is true (the
  /health/drain request counts itself), else 0. A timeout of zero or less returns max(0, initial - target) at once.
  Otherwise poll every 100 ms: when current <= target return max(0, initial - current) and log
  `graceful_shutdown_complete drained_requests=<n> elapsed_s=<x.xx>`; at the timeout log a warning
  `graceful_shutdown_timeout in_flight_requests=<n> elapsed_s=<x.xx> timeout_s=<t>` and return max(0, initial - current);
  every 5 s of waiting log `drain_waiting in_flight_requests=<n> elapsed_s=<x.xx>`. Use tokio::time (not std
  Instant or sleep) so tests run under tokio's paused clock. The timeout comes from the config section below. This task
  does not call start_shutdown on SIGTERM: the existing signal code in crates/betterlite-server/src/shutdown.rs
  (B003) and the lifespan owner call it (see notes in the report).

  Config section `health_readiness`, in crates/betterlite-config/src/sections/health_readiness.rs. It reads
  general_settings.allow_public_health_readiness_details (default false, true only for boolean true),
  general_settings.enable_drain_endpoint (default false, true only for boolean true),
  general_settings.drain_endpoint_token (a string, kept as secrecy::SecretString; empty or non-string falls to the env
  var DRAIN_ENDPOINT_TOKEN, and an empty env var means no token), env GRACEFUL_SHUTDOWN_TIMEOUT (seconds, default 30.0;
  a value that is not a number logs a warning naming the raw value and uses 30.0), env
  PROXY_DB_LOOKUP_STALL_WINDOW_SECONDS (default 30, clamped to at least 0.0), and env LITELLM_DISABLE_NO_REDIS_WARNING
  (boolean, default false). Use betterlite_env helpers as sections/aiohttp_transport_toggle.rs does. It also exposes
  the resolved litellm_settings.request_timeout (default 6000) for /settings, taken from the value B002 already
  resolves. Settings reach this module as config.sections.health_readiness.

  Database readiness (`db_readiness`). `DbReadiness` owns the cached state and is built with an injected
  `DatabaseProbe` trait (defined here): `async health_check()`, `async attempt_reconnect(reason, timeout, lock_timeout)`
  and `async live_worker_count() -> Option<u32>`, plus `configured() -> bool`. The cache starts as "unknown" with a
  last-updated instant and sits behind a Mutex in the struct. check(): if cached status is "connected" and younger than 15 s,
  return it. Else, no database configured gives "disconnected" (cached). Else run health_check under a 2.0 s timeout:
  success caches "connected". Any failure caches "disconnected"; when B872's `is_database_transport_error` says the
  failure is a transport error, log a warning, call attempt_reconnect(reason "health_readiness_check", both timeouts 2.0 s),
  re-run health_check under 2.0 s and on success cache "connected" and log info `reconnect succeeded`; if the
  reconnect or second check fails log error `reconnect failed` and return "disconnected". The whole check is wrapped in
  a 4.0 s deadline; on expiry return status "disconnected" with the previous last-updated and do not touch the cache.
  `readiness_db_status(status)`: any status other than "connected" is returned as is; "connected" becomes "stalled" when
  B715's stall tracker `stalled_within(stall_window)` is true. `resolve_public_db()`: no database configured gives
  "Not connected" and never a 503; otherwise compute the status and answer 503 when it is not "connected" and B1217's
  `should_allow_request_on_db_unavailable` is false. `show_no_redis_warning()`: false when Redis is configured
  anywhere (the coordination cache or the router's own Redis, reported by `ReadinessSources::redis_configured`), false
  when LITELLM_DISABLE_NO_REDIS_WARNING is true, true when no database is configured, else true unless
  live_worker_count() is exactly Some(1) (None counts as not one). `show_env_credential_login_warning()` calls B788's
  `is_env_credential_login_enabled` with the general settings.

  Readiness details (`readiness_details`). Inputs come through a second injected trait `ReadinessSources` (async where
  noted): `success_callback_names()` (names from B189's registry, via `callback_name`), `cache_report()` (async),
  `redis_configured()`, `log_level()` (name such as "INFO" or "DEBUG") and `version()`. `cache_report` is None when no
  cache exists, the cache type string, or, for a Redis semantic cache, an object `{"type": <type>, "index_info": <value>}`
  where a failing index lookup becomes the string `index does not exist - error: <error text>`. The value comes from B4382's `RedisSemanticCache::index_info(&self) -> Result<Json, RedisSemanticError>`, whose Display text is the bare Redis error, so build the string from that text and add no other prefix. Build the body: status
  "healthy", db, cache, litellm_version, success_callbacks, use_aiohttp_transport (false when B173's
  aiohttp_transport_toggle section says disabled, else true), log_level, is_detailed_debug (true when the effective level
  is debug or lower), show_no_redis_warning, show_env_credential_login_warning. With a database configured, db is the
  readiness_db_status string and the response flips to 503 when it is not "connected" unless
  should_allow_request_on_db_unavailable is true; without a database db is "Not connected" and the status stays 200.
  Any failure building the body is HTTP 503 with detail `Service Unhealthy (<error>)`.

  Routes (`readiness_routes`, one function that returns the router with its state; B8540 mounts it). Each
  path is listed with its aliases:
  GET /health/readiness: unauthenticated. If shutting down: 503 and `{"status": "shutting_down"}`, checked first. Else
  if allow_public_health_readiness_details: the detailed body above (same 503 rule). Else `{"status": "healthy", "db":
  <resolve_public_db>}`.
  GET /health/readiness/details: authenticated with B052's user_api_key_auth; always the detailed body, and it does not
  look at the shutdown flag.
  GET /health/backlog: authenticated; `{"in_flight_requests", "admitted_requests", "queued_requests",
  "rejected_requests"}` from the B022 in-flight count and admission stats (rejected_requests is the stats' total
  rejected count).
  GET /health/drain: unauthenticated by key. If enable_drain_endpoint is not true: 404 detail "Not Found". If a token is
  configured and the X-Drain-Token header (empty if absent) differs in a constant-time comparison: 401 detail "Invalid or
  missing X-Drain-Token". Else start_shutdown, wait_for_drain(exclude_self true), answer `{"status": "drained",
  "drained_requests": <n>}`. With no token configured, the enable flag is the only gate.
  OPTIONS /health/readiness, /health/liveliness and /health/liveness: 200, empty body, headers Allow "GET, OPTIONS",
  Access-Control-Allow-Methods "GET, OPTIONS", Access-Control-Allow-Headers "*".
  GET /health/license: authenticated. See the deviation: betterlite has no license check, so it always answers
  `{"has_license": false, "license_type": "community", "expiration_date": null, "allowed_features": [], "limits":
  {"max_users": null, "max_teams": null}}`.
  GET /settings and GET /active/callbacks: authenticated, same handler (`callback_listing`). Body keys: alerting (the
  general_settings.alerting value as text, "None" when absent, a list rendered as `['a', 'b']`), litellm.callbacks,
  litellm.input_callback, litellm.failure_callback, litellm.success_callback, litellm._async_success_callback,
  litellm._async_failure_callback, litellm._async_input_callback (each a list of names), all_litellm_callbacks (the seven
  lists concatenated in that order), num_callbacks (its length), num_alerting (length of general_settings.alerting when it
  is a list, else 0) and litellm.request_timeout. Also public here: `callback_name(callback) -> String`, which B4447 calls;
  it returns the callback's registered name.

  Existing code. B003 already registers GET /health/readiness in crates/betterlite-server/src/routes.rs, and axum panics on a duplicate route. This task registers its router nowhere: B8610 moves B003's readiness handler out of routes.rs into the app/health.rs stub, and B8540 mounts readiness_routes through app::health in its place. The master-key check in crates/betterlite-server/src/auth.rs and the route admission in crates/betterlite-server/src/auth/route_match.rs both skip a short list of paths now (liveliness, liveness, readiness). B4448 extends both lists so the drain route, the three OPTIONS paths and /health/readiness skip master-key auth as in LiteLLM.

  Tests live in `health_readiness::tests` (any submodule below it), with these prefixes: `shutdown_`, `drain_wait_`,
  `db_`, `stall_`, `no_redis_`, `public_`, `details_`, `backlog_`, `drain_route_`, `options_`, `license_`, `callbacks_`,
  `settings_`. Every branch in the description gets a named case; time-dependent ones use tokio's paused clock and
  fake DatabaseProbe, ReadinessSources and in-flight sources. Config tests live in sections::health_readiness::tests.
  The HTTP oracle cases run through the booted proxy.

scope:
  paths:
    - crates/betterlite-server/src/health_readiness.rs
    - crates/betterlite-server/src/health_readiness/**
    - crates/betterlite-server/src/auth.rs
    - crates/betterlite-server/src/auth/route_match.rs
    - crates/betterlite-config/src/sections/health_readiness.rs
    - crates/betterlite-config/src/sections/health_readiness/**
    - "crates/betterlite-config/fuzz/corpus/config_yaml/health-readiness-*"
    - tools/oracle/helpers/b4448.py
    - tools/oracle/helpers/b4448/**
    - tools/oracle/src/helpers/server/b4448.rs
    - tools/oracle/src/helpers/server/b4448/**
  lint_tables: false

