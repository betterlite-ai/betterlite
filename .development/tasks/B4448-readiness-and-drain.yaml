dod:
  - text: start_shutdown is idempotent, and wait_for_drain returns the drained count (initial minus current, never below zero), honours exclude_self, and returns 0 at once on its second call.
    proof: [shutdown-tests]
  - text: A zero or negative timeout returns immediately, a timeout while requests remain returns what drained so far, and GRACEFUL_SHUTDOWN_TIMEOUT defaults to 30.0 and falls back with a warning on a non-number.
    proof: [shutdown-tests, health-readiness-config-tests]
  - text: The DB readiness check caches only "connected" for 15 s, reconnects only after a transport error, caps the whole check at 4 s without touching the cache, and reports "stalled" only over a connected ping.
    proof: [db-readiness-tests]
  - text: show_no_redis_warning follows Redis presence, the LITELLM_DISABLE_NO_REDIS_WARNING flag, a missing database and a worker count other than exactly one.
    proof: [db-readiness-tests]
  - text: The public GET /health/readiness answers 503 shutting_down first, then the detailed body when allow_public_health_readiness_details is true, else status and db with a 503 for an unreachable database unless requests are allowed on unavailability. the drain route, the three OPTIONS paths and /health/readiness pass master-key auth and route admission without a key.
    proof: [route-tests]
  - text: GET /health/readiness/details needs a key, returns every documented field, and returns 503 with "Service Unhealthy (...)" when building the body fails.
    proof: [details-tests]
  - text: GET /health/backlog needs a key and returns the four counters from the in-flight count and admission stats.
    proof: [route-tests]
  - text: GET /health/drain returns 404 when disabled, 401 on a missing or wrong X-Drain-Token, and otherwise starts shutdown and returns the drained count.
    proof: [route-tests]
  - text: The three OPTIONS routes answer 200 with the Allow and Access-Control headers.
    proof: [route-tests]
  - text: GET /health/license answers the community body, and /settings and /active/callbacks return the listing with the concatenated list, counts and request_timeout.
    proof: [route-tests]
  - text: The health_readiness section loads every key and env var above with its default, and the config corpus has the new seeds.
    proof: [health-readiness-config-tests, config-corpus]

  - text: The handlers are tested with tower's oneshot over readiness_routes and fake ports; B8540 mounts the router and proves the HTTP answers with the oracle cases moved there.
    proof: [route-tests]
checks:
  optional: [mutants]
  commands:
    - id: shutdown-tests
      why: the shutdown state, drain wait or its log and timeout behavior is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_readiness::(.*::)?tests::(shutdown_|drain_wait_)/)'
    - id: db-readiness-tests
      why: DB readiness caching, deadlines, reconnect, stall or no-Redis warning behavior is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_readiness::(.*::)?tests::(db_|stall_|no_redis_)/)'
    - id: details-tests
      why: the detailed readiness body or its 503 rules are missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_readiness::(.*::)?tests::details_/)'
    - id: route-tests
      why: a route, its auth, status code, header or body is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_readiness::(.*::)?tests::(public_|backlog_|drain_route_|options_|license_|callbacks_|settings_)/)'
    - id: health-readiness-config-tests
      why: the health_readiness section keys, env vars or defaults are missing
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::health_readiness::/) - test(replays_the_config_yaml_corpus)'
    - id: config-corpus
      why: the new health-readiness config seeds are missing or do not replay
      run: >-
        git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml | grep -Fq "/health-readiness-" &&
        grep -Fq 'enable_drain_endpoint' crates/betterlite-config/fuzz/corpus/config_yaml/health-readiness-valid.yaml &&
        test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'

oracle_cases: []

deviations:
  - what: /health/license always answers the community body, with has_license false.
    why: betterlite has no license check or enterprise tier. This is also what LiteLLM answers with no LITELLM_LICENSE set.
  - what: GRACEFUL_SHUTDOWN_TIMEOUT and DRAIN_ENDPOINT_TOKEN are read once when the config loads, not on every call.
    why: The repository rule keeps environment reads inside the config crate.
  - what: use_aiohttp_transport in the detailed readiness body reports B173's disable toggle only (false when disabled, else true), and ignores LITELLM_HTTP2.
    why: The Rust client has one transport, so the field is informational. Open question in the report notes.
  - what: The _async_* callback lists in /settings repeat the matching sync list, and callback names are betterlite's registered names.
    why: B189's registry has no sync and async split and no Python objects, so the Python __name__ and class-name fallbacks do not exist.
  - what: litellm_version in the detailed body is betterlite's own version string.
    why: There is no LiteLLM version to report.
  - what: The drain, backlog, readiness and details error text for 401 and 404 keeps LiteLLM's detail strings, and error messages elsewhere are betterlite's own.
    why: Probes and preStop hooks key off the status code, and the oracle ignores only /error/message where LiteLLM's text differs.

out_of_scope:
  - "The proxy lifespan and its shutdown calls: B8374. The liveliness and liveness handlers over ShutdownState and the SIGTERM flag: B8540."
  - "GET /health/liveliness and /health/liveness (the GET handlers): B003 owns them. They must read this module's ShutdownState instead of B003's bare flag; B8540 does that wiring."
  - "Calling start_shutdown and wait_for_drain from the SIGTERM path and the lifespan teardown (proxy_server.py lines 1584-1591): the startup and shutdown owner does it with the ShutdownState built here."
  - "The production DatabaseProbe and ReadinessSources implementations over the database, cache and Redis crates: B8540 builds them. This task defines the traits and fakes only."
  - "test_endpoint, health_services_endpoint, get_callback_identifier and every other route above line 1412 of the file: B4447 and B4444 to B4446 own them. B4447 calls `callback_name` from here."
  - "_read_license_data and _read_allowed_features: no license source exists in betterlite, and the deviation answers the route with the constant body."
  - "SIGTERM handling and axum graceful serve: B003 owns crates/betterlite-server/src/shutdown.rs."
  - "Admission middleware and the in-flight counter: B022 owns them. This task only reads them."

pitfalls:
  - "wait_for_drain sets its drain-performed flag before any waiting, so /health/drain followed by the SIGTERM drain returns 0 the second time and never doubles the wait."
  - "The drain route passes exclude_self true because the request counts itself; confirm in B022's code that its counter includes the current request, and keep the target of 1 only if it does."
  - "A configured empty drain_endpoint_token (or a non-string) falls to the DRAIN_ENDPOINT_TOKEN env var, and with neither the route needs no token."
  - "The X-Drain-Token comparison is constant time, an absent header compares as the empty string, and the token never appears in a log or Debug output."
  - "Only a \"connected\" status is served from the 15 s cache; \"disconnected\" and \"unknown\" re-probe on every call."
  - "The 4 s deadline returns \"disconnected\" with the old last-updated instant and leaves the cache as it was, so one slow probe does not poison the next."
  - "The word stalled replaces only a successful connected status; a failed ping stays disconnected even when lookups also stalled."
  - "A 503 from the DB status needs a configured database; \"Not connected\" stays 200, and allow_requests_on_db_unavailable keeps 200 while db still reports the bad state."
  - "The authenticated /health/readiness/details ignores the shutdown flag, while the public route checks it before anything else, including before the allow_public flag."
  - "A live_worker_count of None (census failed) is not 1, so the no-Redis warning stays on."
  - "/health/backlog reports rejected_requests from the stats' total rejected count, not from a per-reason counter."
  - "/settings and /active/callbacks are one handler on two paths, so register both on the same function and not twice with different state."
  - "GET /health/drain, OPTIONS and /health/readiness carry no key check, so auth.rs and auth/route_match.rs must exempt them (both are in scope); the other health routes keep their key check."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
