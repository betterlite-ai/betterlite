dod:
  - text: build_from_table decrypts auth_value, client_id, client_secret and client_private_key only when credentials_are_encrypted, and falls back to the row columns as described.
    proof: [build-credentials-tests]
  - text: The AWS fields decrypt the three secrets only, and the remaining AWS fields pass through.
    proof: [build-credentials-tests]
  - text: The record defaults (protocol_version, subject_token_type, signing alg, token exchange profile, public internet flag) and the column-then-blob fallbacks match the Python.
    proof: [build-fields-tests]
  - text: configured_scopes is set only for a non-empty list of non-empty strings, and scopes come from the credentials or the gated metadata.
    proof: [build-fields-tests]
  - text: The OAuth metadata step defers, fetches, anchors and gates exactly as the item text says, including deferred servers making no fetch.
    proof: [build-oauth-tests]
  - text: deserialize_json_dict, deserialize_json_list and normalize_cost_info accept the stored shapes and give empty values for anything else.
    proof: [build-json-tests]
  - text: Each warn helper logs its message once under the stated condition.
    proof: [build-warn-tests]
  - text: assign_unique_short_prefix finds a free prefix by rehashing and errors after 1024 attempts, and warn_if_newly_blocked_stdio warns only on a new block.
    proof: [build-prefix-tests]

checks:
  optional: []
  commands:
    - id: build-credentials-tests
      why: a credential or AWS field is decrypted wrongly or not at all
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_build::tests::credentials_/)'
    - id: build-fields-tests
      why: a record default, fallback or scope rule is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_build::tests::fields_/)'
    - id: build-oauth-tests
      why: the table OAuth metadata step differs from the Python
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_build::tests::oauth_/)'
    - id: build-json-tests
      why: a stored JSON shape is not accepted or a bad one does not give an empty value
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_build::tests::json_/)'
    - id: build-warn-tests
      why: a warning is missing, repeated or has the wrong text
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_build::tests::warn_/)'
    - id: build-prefix-tests
      why: the unique prefix search or the stdio warning is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_build::tests::prefix_/)'

oracle_cases: []

deviations:
  - what: Collaborators (decryption, fetcher, stdio policy) are constructor arguments of ServerBuilder, and getattr defaults become typed Option fields on the row struct.
    why: the repo wires dependencies through constructors and has no reflection.
  - what: Errors are a BuildError enum (bad protocol_version, bad JSON, prefix exhaustion), not Pydantic ValidationError and RuntimeError.
    why: typed errors, no Python exception hierarchy.

out_of_scope:
  - "The OAuth rules and the fetch: B6760 and B6761."
  - "DiscoverySlots and set_deferred: B6762 (this task calls them)."
  - "The MCPServer record and the table row type: B6590 and B858."
  - "Building a record from the config file: B6764."
  - "Registry writes, add_server and update_server: B6765."
  - "stdio_gate (is_mcp_stdio_blocked, warn_if_mcp_stdio_blocked): no owner found, see the architect notes; this task only takes the StdioPolicy trait."
  - "decrypt_global_env_var_values and MCPEnvVar: B4710. decrypt_value_helper: B2303."

pitfalls:
  - "Decrypt with return_original_value semantics: a value that does not decrypt is kept as stored, never turned into an error."
  - "client_private_key is decrypted through decrypt_credential_field, but client_private_key_id is not."
  - "The AWS access key id is not a secret in the Python code path; decrypt exactly the fields Python decrypts and no others."
  - "oauth2_flow on the record is explicit_oauth2_flow of the row column, not the inferred flow."
  - "Env vars are decrypted only when env_vars_are_encrypted, which defaults to credentials_are_encrypted."
  - "The unique prefix search counts attempts from 0 and stops at 1024 total, and a server that already owns the prefix keeps it."
  - "Token exchange fields read the credentials blob only as a fallback for rows saved before the columns existed."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
