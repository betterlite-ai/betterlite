    why: set_config's normalizer dispatch, the unknown-key UsageError and the "Set" output line.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/config.py#L120-L139
    why: get_config's per-key and listing modes, and the exit(1) on a missing key.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/config.py#L142-L152
    why: unset_config's two output lines.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/_cli_context.py#L1-L19
    why: CliContextValues and cli_context_values, the minimal half of the type this task merges into CliContext.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/auth.py#L90-L95
    why: CliContextObj, the richer half of the type, with base_url_explicit and api_key_from_token_file.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/main.py#L93-L131
    why: cli()'s ctx.obj construction; B134's root resolves CliContext the same way, this task only defines it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/cmd_quoting.py#L1-L26
    why: quote_for_cmd and _double_trailing_backslashes, the cmd.exe/C-runtime double-escaping algorithm.
