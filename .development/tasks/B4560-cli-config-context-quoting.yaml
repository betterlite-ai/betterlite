id: B4560
title: CLI configuration, context and Windows argument quoting
description: >-
  Build local CLI configuration, a typed CLI context value and cmd.exe-compatible argument quoting for
  betterlite-cli, ported from LiteLLM's commands/config.py, commands/_cli_context.py and commands/cmd_quoting.py.
  Cargo.toml gains clap (4.6.7, derive feature, already resolved in Cargo.lock through crates/betterlite's own
  binary) for the config subcommand, and betterlite-logging (path dependency, already resolved elsewhere in the
  workspace) for B192's ensure_private_dir and write_private_json; Cargo.lock records both.

  config.rs owns the config file at ~/.litellm/config.json, a flat string-to-string map. config_file_path(environment:
  &betterlite_config::loader::EnvironmentLookup) joins environment.system_home() with .litellm/config.json and
  returns None when the environment has no home directory; it never creates a directory itself. load_config(environment,
  warnings: &mut dyn Write) returns an empty BTreeMap when the file is missing or when config_file_path returns
  None, with no warning either way. When the file exists but fails to read or its contents don't parse as a JSON
  object of strings, it writes "Warning: ignoring invalid config file {path}: {error}" to warnings and still returns
  an empty map. save_config(config, environment) resolves the path, calls B192's ensure_private_dir on its parent
  directory and write_private_json to persist the map with owner-only permissions, and returns this module's own
  ConfigError wrapping any failure from either call as its source.

  A closed ConfigKey enum (BaseUrl, HiddenCommands) backs the two settable keys; normalize_base_url(value: &str)
  and a private hidden-commands normalizer are its two per-key validators, dispatched from set_config instead of
  a dict lookup. normalize_base_url rejects any byte at or below 32 or equal to 127 with "base_url must not contain
  whitespace or control characters", then requires an http or https URL with a host (a parse failure from the url
  crate counts the same as an explicit scheme or host mismatch: "base_url must be a full http:// or https:// URL
  including a host"), then rejects a literal "?" or "#" anywhere in the raw value ("base_url must not include a
  query string or fragment"), then rejects embedded userinfo ("base_url must not contain credentials; pass --api-key
  separately"), and finally returns the value with every trailing "/" trimmed. parse_hidden_commands(raw: Option<&str>)
  splits on commas, trims each part, drops empty parts and collects the rest into a BTreeSet<String>, sorted unlike
  LiteLLM's frozenset so two reads of the same stored value always list the same order; hidden_command_names(environment)
  reads the hidden_commands entry through it. The private hidden-commands normalizer takes the raw value being set,
  rejects it through parse_hidden_commands when that yields no names ("hidden_commands must be a comma-separated
  list of command names, e.g. `lite config set hidden_commands codex,opencode`. To list everything again, run `lite
  config unset hidden_commands`"), rejects any name containing a space ("hidden_commands entries must be single
  command names, without spaces"), and otherwise returns the names sorted and comma-joined, the form the file stores.

  ConfigCommand is a clap::Subcommand (Set { key, value }, Get { key: Option<String> }, Unset { key }), and
  run_config_command(command, environment, stdout, stderr) is its single entry point, returning Result<(), ConfigError>.
  Set dispatches key through ConfigKey, normalizes value with the matching validator, saves the merged map, and
  prints "Set {key} = {value} in {path}" (the normalized value and the resolved path) to stdout; an unrecognized
  key returns ConfigError::Usage before anything is saved, with "Unknown config key '{key}'. Allowed keys: base_url,
  hidden_commands". Get with a key prints the stored value to stdout, or returns ConfigError::KeyNotSet (the root
  prints "{key} is not set" to stderr and exits 1, the code LiteLLM's sys.exit(1) already uses); with no key it
  prints "(no config set)" when the map is empty, otherwise one "{key} = {value}" line per entry. Unset prints
  "{key} was not set" when the key is absent, or removes it, saves, and prints "Removed {key} from {path}" when
  it was present.

  ConfigError has one Usage(String) variant for every validation failure above (the root prints the text and exits
  2, matching click.UsageError), a KeyNotSet(String) variant for Get's missing-key case (exit 1), and a Save
  variant wrapping B192's failure as its source (exit 1); B134's root matches on these three the same way it
  matches every other command module's own error enum.

  cli_context.rs defines CliContext, the one Rust type for the two TypedDicts LiteLLM splits across _cli_context.py
  (CliContextValues: base_url, api_key) and auth.py (the richer CliContextObj, which adds base_url_explicit and
  api_key_from_token_file; secret_vault stays out, B4590 owns it and passes it to consumers on its own). CliContext
  derives Default, Debug and Clone, with four public fields: base_url (String, "" by default), base_url_explicit
  (bool, false by default), api_key (Option<secrecy::SecretString>, None by default) and api_key_from_token_file
  (bool, false by default); SecretString's own Debug keeps a formatted CliContext from ever printing a held key.
  Resolving a real CliContext from --base-url/--api-key, LITELLM_PROXY_URL/LITELLM_PROXY_API_KEY, this task's own
  config file and a saved token file is B134's job in main.rs, the way main.py's cli() callback does it inline
  (lines 93-131); this task owns only the type and its default, which every command receives as a plain parameter
  and reads through its public fields, never through a getter.

  cmd_quoting.rs ports quote_for_cmd and its private backslash-doubling helper unchanged in algorithm: quote_for_cmd(token:
  &str) -> String splits token on '"', doubles only the run of backslashes standing at the end of each part (never
  a backslash earlier in it), rejoins the parts with a doubled quote between them, replaces every '%' in the
  result with "%%cd:~,%" so cmd.exe's variable expansion can't match a pair across the guard, and wraps the whole
  thing in a leading and trailing quote.
scope:
  paths:
    - crates/betterlite-cli/src/config.rs
    - crates/betterlite-cli/src/config/**
    - crates/betterlite-cli/src/cli_context.rs
    - crates/betterlite-cli/src/cli_context/**
    - crates/betterlite-cli/src/cmd_quoting.rs
    - crates/betterlite-cli/src/cmd_quoting/**
    - crates/betterlite-cli/Cargo.toml
    - Cargo.lock
  lint_tables: false
