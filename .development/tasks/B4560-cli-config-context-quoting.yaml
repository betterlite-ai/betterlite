id: B4560
title: CLI configuration, context and Windows argument quoting
description: >-
  Build local CLI configuration, typed command context and cmd.exe-compatible argument quoting
  for betterlite-management-cli. Config file lives in ~/.litellm/config.json and holds string
  key-value pairs. Load returns empty dict on missing file; warnings mention the file and exception
  except when Path.home() raises RuntimeError (returns {} silently). Persist through B192's
  ensure_private_dir and write_private_json. The set_config, get_config and unset_config commands
  output exact text: set outputs "Set {key} = {value} in {path}", get outputs the value or
  "{key} is not set" to stderr with exit code 1 if missing, and lists "key = value" or "(no config set)"
  for all-keys mode; unset outputs "{key} was not set" or "Removed {key} from {path}". Base_url
  normalizes by stripping trailing slashes and validates: rejects whitespace/control chars (ord <= 32
  or ord == 127), requires http/https scheme with netloc, forbids query/fragment/credentials.
  Hidden_commands splits comma-separated names, rejects spaces and missing entries, returns sorted
  deduplicated list. Unknown keys raise UsageError with the list of allowed keys.

  CLI context stores resolved base_url and optional api_key on the click context object under
  key "obj" as a TypedDict with ReadOnly fields. Missing fields default to empty string and None.

  cmd.exe argument quoting protects tokens against two parsers: cmd.exe stops quoted strings on
  lone `"`, so embedded quotes double; the C runtime's argv split treats backslashes as escaping
  the immediately following quote, so every backslash run before a quote is doubled. cmd.exe also
  expands `%VAR%`, so each literal `%` is prefixed with `%%cd:~,` (the zero-length substring of
  the always-defined `cd` variable).

scope:
  paths:
    - tools/management-cli/src/config.rs
    - tools/management-cli/src/config/**
    - tools/management-cli/src/cli_context.rs
    - tools/management-cli/src/cli_context/**
    - tools/management-cli/src/cmd_quoting.rs
    - tools/management-cli/src/cmd_quoting/**
    - tools/management-cli/Cargo.toml
  lint_tables: false
