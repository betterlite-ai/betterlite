    why: Url::parse rejects malformed input outright where Python's urlparse never raises; normalize_base_url maps
      that failure to the same missing-host message as an explicit mismatch.
  - url: https://docs.rs/clap/4.6.7/clap/derive.Subcommand.html
    why: ConfigCommand's three variants become `lite config set|get|unset` the way every sibling command group
      derives Subcommand.
dod:
  - text: >-
      load_config returns an empty map when the file is missing and also when the injected environment has no
      home directory, with no warning either time. When the file exists but fails to read or doesn't parse as a
      JSON object of strings, it prints "Warning: ignoring invalid config file {path}: {error}" to the given writer
      and still returns an empty map.
    proof: [config-load]
  - text: >-
      config_file_path joins the injected environment's home directory with .litellm/config.json without creating
      it, and returns None when the environment reports no home directory.
    proof: [config-path]
  - text: >-
      save_config calls B192's ensure_private_dir on the config directory and write_private_json to persist the
      map, and returns ConfigError::Save wrapping a failure from either call as its source.
    proof: [config-save]
  - text: >-
      normalize_base_url rejects control characters, then a missing http/https scheme or host (a url-crate parse
      failure included), then a query string or fragment, then embedded credentials, in that order, and otherwise
      strips every trailing slash from the value.
    proof: [url-validation]
  - text: >-
      run_config_command's Set variant normalizes the given value through the key's validator, saves it, and
      prints "Set {key} = {value} in {path}" with the normalized value; an unrecognized key returns
      ConfigError::Usage naming base_url and hidden_commands as the allowed keys, before anything is saved.
    proof: [set-config-output]
  - text: >-
      Get with a key prints the stored value, or returns ConfigError::KeyNotSet for an absent one; with no key it
      prints "(no config set)" for an empty map, otherwise one "{key} = {value}" line per stored entry.
    proof: [get-config-output]
  - text: >-
      Unset prints "{key} was not set" for an absent key, or removes it, saves, and prints "Removed {key} from
      {path}" for a present one.
    proof: [unset-config-output]
  - text: >-
      parse_hidden_commands splits a stored value on commas, trims each part, drops empty parts and collects the
      rest into a sorted set; hidden_command_names reads the hidden_commands config entry through it, and both
      return an empty set for an absent or empty value.
    proof: [hidden-commands-parsing]
  - text: >-
      The hidden-commands validator rejects a value with no usable names and any name containing a space, and
      otherwise returns the names sorted and comma-joined for storage.
    proof: [hidden-commands-validate]
  - text: >-
      CliContext derives Default with an empty base_url, base_url_explicit false, api_key None and
      api_key_from_token_file false; formatting a value whose api_key holds a real secret through its Debug
      implementation never includes that secret's text.
    proof: [cli-context]
  - text: >-
      quote_for_cmd doubles only the run of backslashes at the end of each segment split on '"', doubles the
      embedded quote between segments, replaces every '%' with "%%cd:~,%", and wraps the result in a leading and
      trailing quote.
    proof: [cmd-quoting]
checks:
  optional: []
  commands:
    - id: config-load
      why: load_config does not return an empty map on a missing file or an unknown home directory, or does not
        warn on a read or parse failure.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^config::.*tests::load_/)'
    - id: config-path
      why: config_file_path does not resolve .litellm/config.json under the injected home directory or does not
        return None without one.
      run: >-
        cargo nextest run --locked -p betterlite-cli --no-tests=fail -E
        'test(/^config::.*tests::config_file_path_/)'
    - id: config-save
      why: save_config does not call B192's helpers or does not wrap their failure as ConfigError::Save.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^config::.*tests::save_/)'
    - id: url-validation
      why: normalize_base_url does not validate control characters, scheme/host, query/fragment or credentials
        in order, or does not strip trailing slashes.
      run: >-
        cargo nextest run --locked -p betterlite-cli --no-tests=fail -E
        'test(/^config::.*tests::normalize_base_url_/)'
    - id: set-config-output
      why: Set does not normalize and save the value, print the "Set" line, or reject an unknown key before saving.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^config::.*tests::set_config_/)'
    - id: get-config-output
      why: Get does not print the stored value, return KeyNotSet for an absent one, or list every entry correctly.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^config::.*tests::get_config_/)'
    - id: unset-config-output
      why: Unset does not report an absent key or does not remove, save and report a present one.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^config::.*tests::unset_config_/)'
    - id: hidden-commands-parsing
      why: parse_hidden_commands or hidden_command_names does not split, trim and dedupe into a sorted set.
      run: >-
        cargo nextest run --locked -p betterlite-cli --no-tests=fail -E
        'test(/^config::.*tests::(parse_hidden_commands|hidden_command_names)_/)'
    - id: hidden-commands-validate
      why: the hidden-commands validator does not reject an empty value or a spaced name, or does not sort and
        join the result.
      run: >-
        cargo nextest run --locked -p betterlite-cli --no-tests=fail -E
        'test(/^config::.*tests::normalize_hidden_commands_/)'
    - id: cli-context
      why: CliContext's Default does not match LiteLLM's unset values, or its Debug leaks a held api_key.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^cli_context::/)'
    - id: cmd-quoting
      why: quote_for_cmd does not double trailing backslashes, double embedded quotes or guard percent signs.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^cmd_quoting::/)'
oracle_cases: []
deviations:
  - what: >-
      Get with no key lists every stored entry in key-sorted order. LiteLLM's load_config hands back whatever
      Mapping the JSON object produced, so a hand-edited config.json lists its keys in file order instead.
    why: >-
      betterlite stores config in a BTreeMap, which already gives load_config and save_config a deterministic
      order for free; every key set_config ever writes is one of its two allowed names, so a file this CLI wrote
      itself shows no difference. Only a file someone edited by hand to put hidden_commands ahead of base_url
      would list differently.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/config.py#L120-L139
out_of_scope:
  - >-
    Credential storage, keyring access, token files and token records; B4574, B4590, B4591 and B4592 own them and
    must land before any CLI command calls into them.
  - >-
    The shared HTTP client and every command's own request; crates/betterlite-cli/src/commands.rs (B4580) and
    each command module build those on top of the CliContext this task defines.
  - >-
    The CLI root, its clap command tree, resolving flags/env vars/the config file/a token file into a real
    CliContext, and turning any command's error into an exit code; B134 owns crates/betterlite-cli/src/main.rs.
  - >-
    The statusline subcommand and deleting tools/management-cli; B4586 owns that port.
pitfalls:
  - >-
    load_config has two distinct empty-result paths and they must stay distinct: a missing file or an unknown
    home directory returns an empty map silently, while an existing file that fails to read or parse returns an
    empty map with a warning.
  - >-
    normalize_base_url's control-character check reads bytes, not chars, at or below 32 or equal to 127; that
    already catches tab, newline, NUL and DEL without decoding anything wider.
  - >-
    config_file_path and load_config never create ~/.litellm; only save_config's call into B192's
    ensure_private_dir creates it, and only once a value is actually set.
  - >-
    quote_for_cmd's backslash doubling touches only the run sitting at the end of each segment split on '"',
    never a backslash earlier in the same segment.
  - >-
    The string set_config actually stores for hidden_commands comes from the private normalizer (sorted,
    comma-joined), not from parse_hidden_commands's BTreeSet; the two are read-side and write-side respectively.
  - >-
    CliContext's Default must match every field LiteLLM's two context shapes default to when absent (base_url
    "", base_url_explicit false, api_key None, api_key_from_token_file false); this module never reads an
    environment variable or a file to build one.
  - >-
    A malformed base_url with no recognizable scheme at all can make url::Url::parse return Err before any host
    check runs; that Err must still produce "base_url must be a full http:// or https:// URL including a host",
    not the url crate's own parse-error text.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
