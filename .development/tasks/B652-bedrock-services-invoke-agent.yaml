id: B652
title: Bedrock InvokeAgent requests and trace replies
description: >-
  Add InvokeAgentRequest/Reply with agent id/alias/session inputs, signed agent-runtime URLs and event stream reply
  aggregation. Preserve trace/preprocessing/orchestration usage and decoded text chunks without exposing trace payloads
  in logs. The public agent gateway API remains B050/B141; this is a provider adapter callable as chat.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_agent/transformation.py:
  AmazonInvokeAgentConfig.__init__ L49-L51; AmazonInvokeAgentConfig.get_supported_openai_params L53-L61; AmazonInvokeAgentConfig.map_openai_params
  L63-L73; AmazonInvokeAgentConfig.get_complete_url L75-L106; AmazonInvokeAgentConfig.sign_request L108-L129; AmazonInvokeAgentConfig._get_agent_id_and_alias_id
  L131-L142; AmazonInvokeAgentConfig._get_session_id L144-L146; AmazonInvokeAgentConfig.transform_request L148-L162;
  AmazonInvokeAgentConfig.validate_environment L475-L485; AmazonInvokeAgentConfig.get_error_class L487-L488; AmazonInvokeAgentConfig.should_fake_stream
  L490-L496.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse get_bedrock_response_stream_shape from B599 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: agent_id_alias_path: Require exactly3 slash segments and leading agent or ValueError Invalid
  model format. Expected format: 'model=agent/AGENT_ID/ALIAS_ID'. Empty id/alias pass this shape check and are then
  handled by B171 encode_url_path_segment. Resolve B591 runtime endpoint_type agent with optional_params.aws_bedrock_runtime_endpoint
  and region; append /agents/{encoded agent}/agentAliases/{encoded alias}/sessions/{encoded session}/text without
  trimming endpoint slash. API base takes the source endpoint precedence; use endpoint_url, not proxy_endpoint_url.
  session_id: Truthy optional_params.sessionID is used unchanged, else str(uuid4); encode the path segment through
  B171 and inject UUID for cases. A falsey explicit value generates a fresh ID, and no ID is written back into optional_params.
  agent_input_text: Use only the last message through B218 convert_content_list_to_str; empty messages retains indexing
  failure. Emit inputText=query,enableTrace=True, then overlay ALL optional_params so caller inputText/enableTrace
  can override these defaults and sessionID/auth-related options are not automatically removed from body here. agent_signing_and_capability:
  Initialize BaseConfig B2202 and BaseAWS B590. Supported OpenAI parameters [], map_openai_params returns the supplied
  optional map unchanged, validate_environment returns headers unchanged. should_fake_stream alwaysTrue independent
  of flags. _sign_request delegates B595 service bedrock with every supplied argument; error class B682 preserves
  status/message/headers. Compose the final response with B2209 rather than a second parser.


  Load sessionID through betterlite-config, with injected environment lookup and the defaults/precedence stated
  here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest invoke_agent_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Deployment sessionID defaults None; request optional_params uses the same field. Reuse B591 runtime endpoint/region
  inputs and B590 credential loaders without duplicate defaults. Response trace diagnostics follow B2209 redaction
  deviation.


  Write standalone Rust test invoke_agent_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test invoke_agent_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/invoke_agent.rs with adjacent tests under invoke_agent/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_invoke_agent in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_agent_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  agent_id_alias_path, session_id, agent_input_text, agent_signing_and_capability. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_invoke_agent* using HelperCase:
  kind: helper and the externally tagged bedrock_services_invoke_agent variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_invoke_agent that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Byte decoding and parser fuzzing are B2209; this request/configuration part transforms already parsed records.


  Budget from 118 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 170 production lines, 220 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 555 planned, 575 maximum changed lines.
