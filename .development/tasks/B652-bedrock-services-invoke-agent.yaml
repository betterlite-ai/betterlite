checks:
  optional:
  - mutants
  commands:
  - id: case-agent-id-alias-path
    why: The agent-id-alias-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_agent_id_alias_path$/)'
  - id: case-session-id
    why: The session-id behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_session_id$/)'
  - id: case-agent-input-text
    why: The agent-input-text behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_agent_input_text$/)'
  - id: case-agent-event-stream-content
    why: The agent-event-stream-content behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_agent_event_stream_content$/)'
  - id: case-preprocess-trace-usage
    why: The preprocess-trace-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_preprocess_trace_usage$/)'
  - id: case-orchestration-model
    why: The orchestration-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_orchestration_model$/)'
  - id: case-agent-error-frame
    why: The agent-error-frame behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_agent_error_frame$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_invoke_agent.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_invoke_agent*")"
      && grep -lq 'bedrock_services_invoke_agent' tools/oracle/fuzz/corpus/helper_case/bedrock_services_invoke_agent*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_invoke_agent$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_invoke_agent)"
      && grep -q 'decode_agent_trace' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_invoke_agent.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_invoke_agent_corpus$/)'
