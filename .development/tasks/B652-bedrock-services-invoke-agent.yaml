checks:
  optional:
  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_invoke_agent.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_invoke_agent*")"
      && grep -lq 'bedrock_services_invoke_agent' tools/oracle/fuzz/corpus/helper_case/bedrock_services_invoke_agent*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_invoke_agent$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-agent-id-alias-path
    why: 'Require exactly3 slash segments and leading agent or ValueError Invalid model format. Expected format:
      ''model=agent/AGENT_ID/ALIAS_ID''. Empty id/alias pass this shape check and are then handled by B171 encode_url_path_segment.
      Resolve B591 runtime endpoint_type agent with optional_params.aws_bedrock_runtime_endpoint and region; append
      /agents/{encoded agent}/agentAliases/{encoded alias}/sessions/{encoded session}/text without trimming endpoint
      slash. API base takes the source endpoint precedence; use endpoint_url, not proxy_endpoint_url.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_agent_id_alias_path$/)'
  - id: case-session-id
    why: Truthy optional_params.sessionID is used unchanged, else str(uuid4); encode the path segment through B171
      and inject UUID for cases. A falsey explicit value generates a fresh ID, and no ID is written back into optional_params.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_session_id$/)'
  - id: case-agent-input-text
    why: Use only the last message through B218 convert_content_list_to_str; empty messages retains indexing failure.
      Emit inputText=query,enableTrace=True, then overlay ALL optional_params so caller inputText/enableTrace can
      override these defaults and sessionID/auth-related options are not automatically removed from body here.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_agent_input_text$/)'
  - id: case-agent-signing-and-capability
    why: Initialize BaseConfig B2202 and BaseAWS B590. Supported OpenAI parameters [], map_openai_params returns
      the supplied optional map unchanged, validate_environment returns headers unchanged. should_fake_stream alwaysTrue
      independent of flags. _sign_request delegates B595 service bedrock with every supplied argument; error class
      B682 preserves status/message/headers. Compose the final response with B2209 rather than a second parser.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_cases::case_[0-9]+_agent_signing_and_capability$/)'
  - id: config-sessionid
    why: sessionID lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::invoke_agent_config_cases::case_[0-9]+_loads_sessionid$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_agent_secret_safe_failure$/)'
