out_of_scope:
- B030 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- AmazonInvokeAgentConfig reply methods L164-L473 are B2209; all other functions in this file are owned here.
- 'Function ownership inventory litellm/llms/bedrock/chat/invoke_agent/transformation.py: AmazonInvokeAgentConfig._parse_aws_event_stream
  L164-L224; AmazonInvokeAgentConfig._parse_message_from_event L226-L264; AmazonInvokeAgentConfig._extract_headers_from_event
  L266-L280; AmazonInvokeAgentConfig._get_response_stream_shape L282-L285; AmazonInvokeAgentConfig._extract_response_content
  L287-L308; AmazonInvokeAgentConfig._extract_usage_info L310-L341; AmazonInvokeAgentConfig._is_trace_event L343-L348;
  AmazonInvokeAgentConfig._get_trace_data L350-L357; AmazonInvokeAgentConfig._extract_and_update_preprocessing_usage
  L359-L382; AmazonInvokeAgentConfig._extract_orchestration_model L384-L396; AmazonInvokeAgentConfig._build_model_response
  L398-L428; AmazonInvokeAgentConfig.transform_response L430-L473 belong to B2209.'
pitfalls:
- The body overlays optional_params after inputText and enableTrace, so explicit values can replace both computed
  defaults.
- An agent model must have exactly three segments; percent encoding occurs after splitting and cannot make a literal
  slash part of an ID.
