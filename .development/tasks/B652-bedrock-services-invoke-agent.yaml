- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_agent/transformation.py#L49-L496
  why: Own AmazonInvokeAgentConfig.__init__, AmazonInvokeAgentConfig.get_supported_openai_params, AmazonInvokeAgentConfig.map_openai_params,
    AmazonInvokeAgentConfig.get_complete_url, AmazonInvokeAgentConfig.sign_request, AmazonInvokeAgentConfig._get_agent_id_and_alias_id,
    AmazonInvokeAgentConfig._get_session_id, AmazonInvokeAgentConfig.transform_request, AmazonInvokeAgentConfig._parse_aws_event_stream,
    AmazonInvokeAgentConfig._parse_message_from_event, AmazonInvokeAgentConfig._extract_headers_from_event, AmazonInvokeAgentConfig._get_response_stream_shape,
    AmazonInvokeAgentConfig._extract_response_content, AmazonInvokeAgentConfig._extract_usage_info, AmazonInvokeAgentConfig._is_trace_event,
    AmazonInvokeAgentConfig._get_trace_data, AmazonInvokeAgentConfig._extract_and_update_preprocessing_usage, AmazonInvokeAgentConfig._extract_orchestration_model,
    AmazonInvokeAgentConfig._build_model_response, AmazonInvokeAgentConfig.transform_response, AmazonInvokeAgentConfig.validate_environment,
    AmazonInvokeAgentConfig.get_error_class, AmazonInvokeAgentConfig.should_fake_stream. Other functions in this
    file remain with the owners listed below.
