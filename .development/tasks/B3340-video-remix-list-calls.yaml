      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_list_call::mock_response/)'
    - id: list-pagination-preserved
      why: video_list does not preserve after, limit and order as pagination parameters
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_list_call::pagination_params/)'
    - id: list-call-type
      why: video_list does not set logging call type to CallTypes.video_list
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_list_call::call_type/)'
    - id: async-list-wrapper
      why: avideo_list does not wrap, copy context, or execute in event loop correctly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_list_call::async_wrapper/)'
    - id: list-overload-declarations
      why: overload declarations for avideo_list=True/False do not exist or have wrong types
      run: cargo build --locked -p betterlite-core
    - id: list-unsupported-provider
      why: video_list does not raise ValueError for unsupported provider or message is wrong
