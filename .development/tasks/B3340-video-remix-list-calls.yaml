id: B3340
title: Video remix and listing calls
description: >-
  Build the synchronous and asynchronous video remix and listing call functions in
  betterlite-core::api. Implement video_remix and avideo_remix for remixing completed
  videos with updated prompts, and video_list and avideo_list for paginating and filtering
  video collections.

  For remix operations, attempt to decode custom_llm_provider from the video_id using
  B672's decode_video_id_with_provider when not explicitly provided, falling back to
  OpenAI if decoding returns None or empty string. Default timeout to 600 seconds.
  Support mock response decoding from JSON string. Set logging call type to
  CallTypes.video_remix. Overload declarations provide type checking for both sync and
  async dispatch paths (avideo_remix=True returns Coroutine, avideo_remix=False returns
  VideoObject). The runtime video_remix implementation uses a dispatch flag to return
  either a Coroutine or a direct VideoObject.

  For list operations, preserve the asymmetry between sync and async: sync list defaults
  directly to OpenAI without provider inference, while async list attempts provider
  inference using B174's get_llm_provider with an empty model string before dispatch
  when custom_llm_provider is not explicitly provided. Default timeout to 600 seconds.
  Support mock response decoding as a list of JSON-decodable items. Set logging call type
  to CallTypes.video_list. Do not treat after, limit and order parameters as video-ID
  lookup keys; pass them directly to the list handler. Overload declarations provide type
  checking for both sync and async dispatch paths (avideo_list=True returns Coroutine,
  avideo_list=False returns list[VideoObject]). The runtime video_list implementation
  uses a dispatch flag to return either a Coroutine or a direct list.

  Both async wrappers (avideo_remix and avideo_list) use partial, contextvars.copy_context,
  and loop.run_in_executor to wrap their sync counterparts, preserving the context-run
  pattern and awaiting the coroutine result if needed.

  Add oracle cases covering remix provider decoding with fallback, remix timeout default,
  remix mock response decoding, list provider defaults (sync vs async asymmetry), list
  timeout default, list mock response decoding as list of objects, list pagination
  parameters, and async wrapper execution for both operations.

