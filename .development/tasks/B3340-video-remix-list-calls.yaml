deviations:
  - what: "video_remix timeout defaults to 600 seconds instead of the constant DEFAULT_REQUEST_TIMEOUT; when timeout is falsey (0, None, empty), DEFAULT_REQUEST_TIMEOUT is used as fallback."
    why: "LiteLLM's video_remix has an explicit default of 600 in the function signature and checks for falsey timeout before using the constant."
  - what: "video_list has asymmetric provider defaults: sync list defaults directly to openai, while async list attempts provider inference with empty model using get_llm_provider."
    why: "LiteLLM preserves this asymmetry intentionally; async list calls get_llm_provider to infer provider from context when not explicitly provided, while sync defaults without inference."
  - what: "video_list mock response is a list that is JSON-decoded to a list of dicts, each of which constructs a VideoObject."
    why: "LiteLLM's video_list returns a list[VideoObject] and handles mock responses by decoding and constructing per item."
  - what: "video_list pagination parameters after, limit and order are passed directly to the handler as query parameters, not treated as video-ID lookup keys."
    why: "LiteLLM video_list preserves these as standard paginated-list query parameters sent to the API."
  - what: "video_remix and video_list both use CallTypes.video_remix and CallTypes.video_list for logging call type."
    why: "These distinct call types allow logging and monitoring systems to differentiate remix and list operations from other video operations."
