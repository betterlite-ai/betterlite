checks:
  optional: []
  commands:
    - id: remix-timeout-default
      why: video_remix does not default timeout to 600 or does not fall back to DEFAULT_REQUEST_TIMEOUT when falsey
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_remix_call::remix_timeout/)'
    - id: remix-provider-fallback
      why: video_remix does not decode provider from video_id or does not fall back to OpenAI
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_remix_call::remix_provider/)'
    - id: remix-mock-response
      why: video_remix does not handle mock_response or does not JSON-decode string values
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_remix_call::mock_response/)'
    - id: remix-call-type
      why: video_remix does not set logging call type to CallTypes.video_remix
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_remix_call::call_type/)'
    - id: async-remix-wrapper
      why: avideo_remix does not wrap, copy context, or execute in event loop correctly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_remix_call::async_wrapper/)'
    - id: remix-overload-declarations
      why: overload declarations for avideo_remix=True/False do not exist or have wrong types
      run: cargo build --locked -p betterlite-core
    - id: remix-unsupported-provider
      why: video_remix does not raise ValueError for unsupported provider or message is wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_remix_call::unsupported_provider/)'
    - id: list-sync-default-openai
      why: video_list sync does not default custom_llm_provider directly to openai
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_list_call::sync_default_openai/)'
    - id: list-async-inference
      why: avideo_list does not attempt provider inference using get_llm_provider with empty model
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_list_call::async_inference/)'
    - id: list-timeout-default
