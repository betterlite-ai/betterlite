pitfalls:
  - "video_remix timeout defaults to 600 seconds (not empty string or None); defaulting happens before handler call."
  - "video_remix decodes provider from video_id only when not explicitly provided; decode_video_id_with_provider returns a dict with custom_llm_provider key that may be None or empty, requiring fallback to OpenAI."
  - "video_remix mock response is a dict that must be JSON-decoded if provided as a string; handle JSON decode errors gracefully."
  - "video_list has asymmetric provider handling: sync list defaults directly to openai without calling get_llm_provider, while async list calls get_llm_provider(model='') before wrapping."
  - "video_list mock response is a list of dicts, not a single dict; each item becomes a VideoObject."
  - "video_list pagination parameters after, limit and order are not video-ID lookups; they are standard query parameters preserved as-is to the handler."
  - "Both functions raise ValueError when provider config is None (unsupported provider); the error message must include the operation name (remix or list) and provider name."
  - "avideo_remix and avideo_list wrap the sync function with partial, copy contextvars.copy_context, and run in the event loop executor; preserve the context-run pattern."
  - "video_remix has overload declarations for type checking (avideo_remix=True returns Coroutine, avideo_remix=False returns VideoObject) but a single runtime implementation."
  - "video_list has overload declarations for type checking (avideo_list=True returns Coroutine, avideo_list=False returns list[VideoObject]) but a single runtime implementation."
  - "CallTypes.video_remix and CallTypes.video_list are the correct logging call types; logging_obj.call_type must be set after optional params are prepared but before dispatch."
