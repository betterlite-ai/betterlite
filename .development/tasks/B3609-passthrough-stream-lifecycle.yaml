  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L139-L275
    why: chunk_processor is the async generator managing stream iteration, cost injection, first-token stamping, failure scheduling, and exactly-once logging dispatch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L167-L189
    why: Cost-injection flag resolution reads include_cost_in_streaming_usage, model availability, and endpoint-type restrictions once per stream.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L193-L275
    why: Hot path (no injection), cost-injection path, exception handling, and finally-block logging semantics including GeneratorExit, partial-billing preservation and deferred-dispatch wiring.

dod:
  - text: PassThroughStreamContext is a frozen dataclass with success_handler, url_route, and start_time fields.
    proof: [stream-context-tests]
  - text: _stamp_first_chunk_if_needed sets completion_start_time on the first call per stream and idempotently returns on subsequent calls.
    proof: [first-token-stamp-tests]
  - text: schedule_failure_logging skips TinyFish streams with active pollers, reconstructs partial usage from collected bytes, and dispatches failure handlers with exception and traceback.
    proof: [stream-failure-scheduling-tests, oracle]
  - text: record_partial_usage_failure extracts Usage objects via shared reconstruction or Anthropic handler, records the usage with response cost, and logs exceptions without crashing.
    proof: [partial-usage-recording-tests, oracle]
  - text: chunk_processor buffers all chunks, stamps first token on the first chunk, and iterates complete frames without modifying chunks in the no-injection path.
    proof: [chunk-iteration-hot-path-tests, oracle]
  - text: Cost-injection flag is resolved once at stream start using include_cost_in_streaming_usage, model availability, and endpoint-type restrictions; cost injection applies only to Anthropic, OpenAI and Vertex rawPredict/streamRawPredict.
    proof: [cost-injection-flag-tests]
  - text: In the cost-injection path, chunk_processor collects complete SSE frames and passes them to _process_chunk_with_cost_injection, yielding the transformed chunk without buffering incomplete frames.
    proof: [cost-injection-frame-handling-tests, oracle]
  - text: On stream completion with status < 400, deferred logging is scheduled if the success handler armed it, or immediate logging is enqueued in the finally block if not.
    proof: [exactly-once-logging-completion-tests, oracle]
  - text: GeneratorExit and upstream Exception paths call schedule_failure_logging with partial raw_bytes and re-raise; deferred and immediate scheduling never happen on error paths.
    proof: [stream-failure-exception-handling-tests, oracle]
  - text: Budget-reservation callbacks are bound after successful logging enqueue only, and never when failure scheduling occurs.
    proof: [budget-reservation-binding-tests, oracle]
  - text: TinyFish run_id detection in the hot path scans frames on first match and halts scanning after poller spawns; late run_ids found at logging time are passed to the poller instead of reconstructing.
    proof: [tinyfish-run-id-detection-tests, oracle]

checks:
  optional: []
  commands:
  - id: stream-context-tests
    why: PassThroughStreamContext is missing, incomplete, or has wrong field names.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::context/)'
  - id: first-token-stamp-tests
    why: _stamp_first_chunk_if_needed does not set completion_start_time on the first call or re-sets it on subsequent calls.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::first_token/)'
  - id: stream-failure-scheduling-tests
    why: schedule_failure_logging fails to skip TinyFish, record partial usage, or dispatch failure handlers with exception and traceback.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::failure_scheduling/)'
  - id: partial-usage-recording-tests
    why: record_partial_usage_failure does not extract Usage, record it with response cost, or handle exceptions safely.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::partial_usage/)'
  - id: chunk-iteration-hot-path-tests
    why: chunk_processor does not buffer chunks, stamp first token, or pass through chunks unchanged in the no-injection path.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::chunk_iteration/)'
  - id: cost-injection-flag-tests
    why: Cost-injection flag resolution does not read include_cost_in_streaming_usage, model availability, or endpoint-type restrictions, or applies to unsupported endpoint types.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::cost_injection_flag/)'
  - id: cost-injection-frame-handling-tests
    why: chunk_processor does not collect complete SSE frames, pass them to _process_chunk_with_cost_injection, or yield transformed chunks correctly.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::cost_injection_frames/)'
  - id: exactly-once-logging-completion-tests
    why: chunk_processor schedules both deferred and immediate logging, misses deferred when armed, or fails to enqueue on clean completion.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::exactly_once_logging/)'
  - id: stream-failure-exception-handling-tests
    why: chunk_processor does not schedule failure logging on GeneratorExit or Exception, or schedules logging on error paths.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::exception_handling/)'
  - id: budget-reservation-binding-tests
    why: Budget-reservation callbacks are not bound after successful enqueue, or are bound on error paths.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::budget_binding/)'
  - id: tinyfish-run-id-detection-tests
    why: TinyFish run_id detection fails to scan frames on first match, halt scanning after poller spawn, or handle late run_ids at logging time.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^passthrough_stream_lifecycle::tinyfish_run_id/)'

