deviations:
  - what: >-
      PassThroughStreamContext field is named success_handler (29 characters) instead of
      passthrough_success_handler_obj (31 characters), keeping identifier names under the
      30-character limit enforced by clippy clear-names rules.
    why: >-
      Rust identifier names must not exceed 30 characters per rules.yaml clear-names enforcement;
      the shorter name preserves semantic clarity while conforming to project standards.
  - what: >-
      Function is named schedule_failure_logging (24 characters) instead of schedule_stream_failure_logging
      (31 characters), and record_partial_usage_failure (29 characters) instead of _record_partial_usage_for_failure
      (33 characters), keeping identifiers under the 30-character limit.
    why: >-
      Rust identifier names must not exceed 30 characters per rules.yaml clear-names enforcement;
      shorter names preserve semantic clarity and follow domain-based naming conventions.
  - what: >-
      record_partial_usage_failure uses the shared provider reconstruction path
      (_build_passthrough_logging_result) to extract Usage, except for Anthropic which
      has a dedicated handler (AnthropicPassthroughLoggingHandler.record_partial_usage_for_failure).
    why: >-
      LiteLLM lines 98-136 show the Anthropic handler is called directly (line 106-108) while
      other endpoints reconstruct via _build_passthrough_logging_result (line 113-123). This
      task implements the Anthropic delegation and the reconstruction wrapper; provider-leaf
      owners implement the _handle_logging_*_collected_chunks handlers (gap A).
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L105-L128
  - what: >-
      TinyFish streams with an active poller (detected via sse_poller_spawned) skip failure
      logging entirely because the poller owns the authoritative billing row and would collide
      on request_id if this task logged a failure row.
    why: >-
      LiteLLM lines 79-80 and 318-319 check sse_poller_spawned and return early. The poller
      is started on the first run_id frame and tracks stream status independently; betterlite
      preserves this exclusive-billing model to avoid double-logging.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L79-L80
  - what: >-
      Deferred-logging wiring checks _on_deferred_stream_complete on the logging object; if
      set and the stream completed cleanly (status < 400), the logging coroutine is parked
      on litellm_logging_obj._deferred_stream_complete_args instead of being enqueued
      immediately.
    why: >-
      LiteLLM lines 236-242 show the deferred-dispatch path is armed by post-call guardrails;
      this task wires the condition without building the guardrail mechanism itself (gap D).
      The finally block ensures exactly-once logging regardless of which path runs.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L235-L242
  - what: >-
      Cost injection reads _process_chunk_with_cost_injection from ProxyBaseLLMRequestProcessing
      (B124/gap D); this task routes complete SSE frames to it and yields the transformed
      chunk without buffering incomplete trailing frames.
    why: >-
      LiteLLM lines 222-223 call _process_chunk_with_cost_injection on split_complete_sse_frames;
      betterlite defers the transformer implementation to gap D and focuses this task on the
      stream-lifecycle mechanics and logging dispatch.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L220-L226

out_of_scope:
  - "B3600 owns PassthroughStandardLoggingPayload and EndpointType enum."
  - "B3605 owns PassThroughEndpointLogging state and success-dispatch helpers."
  - "B3608 owns _route_streaming_logging_to_handler, _build_passthrough_logging_result, and _extract_model_for_cost_injection; they are called by chunk_processor but built by B3608."
  - "B191 owns GLOBAL_LOGGING_WORKER.ensure_initialized_and_enqueue for logging dispatch."
  - "B247 owns Logging._update_completion_start_time for first-token timestamp."
  - "B251 owns record_partial_usage_for_failure and dispatch_failure_handlers for failure accounting."
  - "B1719 owns bind_budget_reservation_to_callbacks for spend-tracking attachment."
  - "B005 owns split_complete_sse_frames for SSE frame reassembly."
  - "ProxyBaseLLMRequestProcessing._process_chunk_with_cost_injection (gap D) owns cost injection into SSE frames; this task routes frames to it."
  - "Provider-leaf tasks (gap A) own handle_logging_tinyfish_collected_chunks, start_sse_run_billing, run_id_from_sse_frames, sse_poller_spawned, and AnthropicPassthroughLoggingHandler.record_partial_usage_for_failure."

pitfalls:
  - "GeneratorExit is not caught by `except Exception`; the finally block must ensure partial usage is logged even on client disconnect (LIT-2642)."
  - "Upstream 4xx/5xx responses are already logged as failure before chunk_processor starts; do not re-log them as success in the finally block."
  - "The logging_scheduled flag tracks whether deferred logging was armed or immediate logging was enqueued; the finally block only enqueues if this flag is still False."
  - "Cost-injection flag is resolved once at stream start; reading include_cost_in_streaming_usage per-chunk creates unnecessary branching."
  - "TinyFish scanning halts after the first run_id is found and the poller spawns; do not re-scan frames after that point."
  - "Incomplete SSE frames at stream end are yielded as-is without padding or reassembly; split_complete_sse_frames handles the split and incomplete_tail goes through."
  - "Exception traceback is captured with traceback.format_exc() at the point of the exception; pass it to dispatch_failure_handlers for logging."
  - "Budget reservation binding (bind_budget_reservation_to_callbacks) happens only after successful logging enqueue, not on error paths or when logging_scheduled is False."
  - "Deferred logging wiring requires litellm_logging_obj._deferred_stream_complete_args to be a tuple containing the coroutine; the finally block reads _on_deferred_stream_complete to check if deferred dispatch is armed."
  - "Response status code < 400 is the gate for logging decisions; 400+ responses are already logged as failure elsewhere and must not be double-logged here."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
