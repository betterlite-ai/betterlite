id: B3609
title: Pass-through stream lifecycle and failure logging
description: >-
  Drive chunk iteration, first-token timestamps, cancellation and exactly-once
  terminal accounting. Preserve partial-usage recording and failure scheduling when
  reading or transforming an upstream chunk fails. Implement the stream-failure
  protocol that schedules deferred logging when a stream disconnects mid-transfer
  or a chunk-reading exception bubbles up, including partial usage preservation
  for spend tracking when the upstream response status is successful (< 400).

  Build PassThroughStreamContext as a frozen dataclass holding the success handler,
  route URL and stream start time; use it to wire request metadata to failure
  logging without carrying full state through nested scopes. Implement
  _stamp_first_chunk_if_needed to set completion_start_time on the first chunk
  received, matching LiteLLM's timestamp anchor. Build schedule_failure_logging
  to skip TinyFish streams already tracked by an active poller, record partial usage
  from collected chunks (Anthropic via dedicated handler, others via reconstruction),
  and dispatch failure handlers with the accumulated exception traceback.

  Implement record_partial_usage_failure to extract a Usage object from
  collected bytes using the shared provider reconstruction path, then call
  litellm_logging_obj.record_partial_usage_for_failure with the extracted usage and
  response cost. On Anthropic, call the Anthropic-specific partial-usage handler
  instead. Catch and log any exception from reconstruction so a formatting error
  in the response does not prevent the logging request from completing.

  Build chunk_processor as an async generator that yields chunks from the upstream
  response and buffers them for end-of-stream logging, stamping first-token time on
  the first chunk and optionally injecting costs into complete SSE frames. Resolve
  the cost-injection flag once at stream start (reading include_cost_in_streaming_usage,
  model availability, and endpoint-type restrictions) so per-chunk branching stays
  minimal. In the no-injection hot path, iterate chunks, buffer them, stamp first
  token, and for TinyFish only, scan for run_id in complete frames and spawn billing
  on first match. In the cost-injection path, collect complete frames via
  split_complete_sse_frames and pass them to _process_chunk_with_cost_injection
  (gap D), yielding the transformed chunk. On GeneratorExit (client disconnect) or
  upstream Exception, call schedule_failure_logging with the exception and
  partial raw_bytes before re-raising. On clean completion (all chunks iterated,
  status < 400), schedule deferred logging if the success handler armed it, or
  enqueue immediate logging in the finally block if deferred was not scheduled. Bind
  budget-reservation callbacks after successful enqueue to attach spend-tracking
  callbacks to the request. Never double-log via deferred and immediate paths.

  Preserve the ordered semantics of the finally block: GeneratorExit and Exception
  paths skip logging, success paths schedule deferred (if armed) or immediate (if not),
  and the finally block ensures exactly-once enqueue of the chosen path. Document
  the LIT-2642 and LIT-3798 behaviors and the partial-billing preservation across
  disconnect and exception paths.

