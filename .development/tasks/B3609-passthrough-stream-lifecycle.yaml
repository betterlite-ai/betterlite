    why: schedule_stream_failure_logging skips TinyFish with active poller, records partial usage, and dispatches failure handlers with exception and traceback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/streaming_handler.py#L98-L136
