pitfalls:
- 'The oracle helper for this task is pre-registered as openai_threads in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/threads.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_threads.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Thread projections deliberately discard SDK extension fields while message projection validates the whole SDK
  record.
- A missing message status becomes completed, but an empty-string status is not treated as missing.
