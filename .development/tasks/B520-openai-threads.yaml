  commands:
  - id: case-create-thread-initial-messages
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-threads/create-thread-initial-messages.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::threads_cases::case_[0-9]+_create_thread_initial_messages$/)'
  - id: case-retrieve-thread
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-threads/retrieve-thread.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::threads_cases::case_[0-9]+_retrieve_thread$/)'
  - id: case-append-multimodal-message
    why: Forward thread_id plus every add_message_data field unchanged. If the returned SDK message has no status
      or status=None, insert completed before OpenAIMessage validation; preserve every existing non-null status.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::threads_cases::case_[0-9]+_append_multimodal_message$/)'
  - id: case-list-messages-no-query
    why: Call beta.threads.messages.list(thread_id=thread_id) only, with no pagination/query arguments, and return
      the SDK cursor page unchanged.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::threads_cases::case_[0-9]+_list_messages_no_query$/)'
  - id: case-thread-metadata
    why: Thread creation includes messages and metadata whenever they are not None, including empty list/object.
      Creation and retrieval project only id, created_at, metadata and object from the SDK thread.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::threads_cases::case_[0-9]+_thread_metadata$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_threads.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_threads*")"
      && grep -lq 'openai_threads' tools/oracle/fuzz/corpus/helper_case/openai_threads* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_threads$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_threads)"
      && grep -q 'decode_thread_message_reply' crates/betterlite-openai/fuzz/fuzz_targets/openai_threads.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_threads_corpus$/)'
  - id: case-assistants-beta-default
    why: 'The SDK beta threads and threads.messages namespaces supply OpenAI-Beta: assistants=v2 for create/retrieve/list/add-message;
      capture each operation in the same case contract used by assistants and vector stores.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::threads_cases::case_[0-9]+_assistants_beta_default$/)'
