id: B520
title: OpenAI thread and message operations
description: >-
  Implement typed thread create/retrieve and message append/list operations using B519 assistant wire types. Every
  call sends OpenAI-Beta: assistants=v2 as the pinned OpenAI SDK does. Listing messages sends thread_id only and
  no query parameters. delete_thread has no caller at the pin and is excluded.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/openai.py: OpenAIAssistantsAPI.a_add_message
  L2532-L2563; OpenAIAssistantsAPI.add_message L2568-L2580; OpenAIAssistantsAPI.add_message L2583-L2595; OpenAIAssistantsAPI.add_message
  L2599-L2642; OpenAIAssistantsAPI.async_get_messages L2644-L2665; OpenAIAssistantsAPI.get_messages L2670-L2681;
  OpenAIAssistantsAPI.get_messages L2684-L2695; OpenAIAssistantsAPI.get_messages L2699-L2731; OpenAIAssistantsAPI.async_create_thread
  L2735-L2768; OpenAIAssistantsAPI.create_thread L2773-L2785; OpenAIAssistantsAPI.create_thread L2788-L2800; OpenAIAssistantsAPI.create_thread
  L2804-L2859; OpenAIAssistantsAPI.async_get_thread L2861-L2887; OpenAIAssistantsAPI.get_thread L2892-L2903; OpenAIAssistantsAPI.get_thread
  L2906-L2917; OpenAIAssistantsAPI.get_thread L2921-L2958.


  Named case contracts: append_multimodal_message: Forward thread_id plus every add_message_data field unchanged.
  If the returned SDK message has no status or status=None, insert completed before OpenAIMessage validation; preserve
  every existing non-null status. list_messages_no_query: Call beta.threads.messages.list(thread_id=thread_id) only,
  with no pagination/query arguments, and return the SDK cursor page unchanged. thread_metadata: Thread creation
  includes messages and metadata whenever they are not None, including empty list/object. Creation and retrieval
  project only id, created_at, metadata and object from the SDK thread. assistants_beta_default: The SDK beta threads
  and threads.messages namespaces supply OpenAI-Beta: assistants=v2 for create/retrieve/list/add-message; capture
  each operation in the same case contract used by assistants and vector stores. thread_async_dispatch: Only acreate_thread/aget_thread/a_add_message/aget_messages
  flags equal to the literal True select their async branches; use B519 client constructors and preserve SDK errors
  without catches.


  Implement crates/betterlite-openai/src/threads.rs with adjacent tests under threads/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation openai_threads in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function threads_cases in betterlite-openai with these exact named cases (one per oracle file): create_thread_initial_messages,
  retrieve_thread, append_multimodal_message, list_messages_no_query, thread_metadata, assistants_beta_default,
  thread_async_dispatch. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_threads* using HelperCase: kind: helper
  and the externally tagged openai_threads variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_openai_threads that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_thread_message_reply consumes thread or message JSON response bytes in crates/betterlite-openai/src/threads.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_threads.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_threads.
  The adjacent test replays_the_openai_threads_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 366 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 385 production lines, 210 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 785 planned, 800 maximum changed lines.
