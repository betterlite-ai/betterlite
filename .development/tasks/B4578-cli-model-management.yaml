dod:
  - text: >-
      list_models outputs a table with id, object, created (formatted timestamp or datetime)
      and owned_by columns, each cell as plain JSON-typed text (a string as it is, a number as
      its JSON text, empty for absent or null), or the response as JSON when --format=json is
      specified.
    proof: [list-models]
  - text: >-
      add_model parses multiple --param and --info as key=value, splits each on the first =,
      builds model_params and model_info dicts, and calls client.models.new().
    proof: [add-model]
  - text: >-
      delete_model calls client.models.delete(model_id=model_id) and outputs the result.
    proof: [delete-model]
  - text: >-
      get_model requires either --id or --name (at least one), rejects both missing with
      a UsageError, and calls client.models.get().
    proof: [get-model]
  - text: >-
      get_models_info outputs a table with flexible --columns (default public_model,upstream_model,
      updated_at) from a fixed set of column configs, each cell as plain JSON-typed text the
      same way as list_models, warns to stderr for unknown columns but renders the valid ones,
      or the response as JSON when --format=json is specified.
    proof: [info-models]
  - text: >-
      update_model parses multiple --param and --info like add_model and calls
      client.models.update(model_id=..., model_params=..., model_info=...).
    proof: [update-model]
  - text: >-
      format_cost_per_1k_tokens takes cost as a number, multiplies it by 1000 and formats it
      to 4 decimal places with a $ prefix ($X.XXXX), and returns an empty string when cost is
      absent or null. A cost of another type is an error that names the field; there is no
      string-to-float conversion and no textual fallback.
    proof: [cost-format]
  - text: >-
      format_iso_datetime_str parses an RFC 3339 datetime string directly, Z suffix or numeric
      offset alike, formats it to YYYY-MM-DD HH:MM, and returns an empty string when the value
      is absent or null. A value that isn't a valid RFC 3339 string is an error that names the
      field.
    proof: [iso-format]
  - text: >-
      format_timestamp takes a Unix timestamp as an integer, formats it to YYYY-MM-DD HH:MM,
      and returns an empty string when it is absent or null. list_models reads the created
      field typed as that integer directly, with no digit-string-to-integer conversion.
    proof: [unix-format]
  - text: >-
      import_models loads YAML, validates model_list key exists and is a list, filters by
      model_id regex and access_groups regex, displays filtered models table regardless of
      --dry-run, silently ignores API errors in the import loop, and shows provider summary.
    proof: [import-models]
  - text: >-
      filter_model returns false only when model_name is absent or null, litellm_params is
      absent or null, or model_id is absent, null or not a string, or when model_id doesn't
      match model_regex (if given), or no access_groups string matches access_group_regex
      (if given). A model_name, model_id or litellm_params that is present but empty still
      passes the filter.
    proof: [filter-model]
  - text: >-
      print_models_table skips if the list is empty, else prints a table with model_name,
      upstream model_id, and access_groups_str (comma-space joined or empty if none).
    proof: [print-models]
  - text: >-
      print_summary_table prints provider counts per provider and a Total row with the sum,
      with the Total row visually distinguished through the table library's own styling, not
      literal markup text in the cell.
    proof: [print-summary]
