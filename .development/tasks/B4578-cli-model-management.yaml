id: B4578
title: CLI model management and YAML imports
description: >-
  Build the models command group for the management CLI, porting LiteLLM's model management
  from litellm/proxy/client/cli/commands/models.py to Rust. Commands dispatch through
  an injected HTTP client (from B4560's CLI context) to model endpoints: list with table/json
  output, add and update with multiple --param and --info key=value options split on the first
  =, delete and get (by --id or --name, at least one required), info with flexible --columns
  selection (defaults to public_model,upstream_model,updated_at), and import from YAML files
  with --dry-run and regex filtering on litellm_params.model and model_info.access_groups.

  Formatting helpers take typed fields, not raw JSON values: an ISO datetime string, a Unix
  timestamp integer, or a per-token cost number. Each one renders an absent or null field as
  an empty string and a present field as given: a datetime to minute-resolution YYYY-MM-DD HH:MM
  (the parser reads RFC 3339 directly, Z suffix or numeric offset alike, with no text
  substitution first), a Unix timestamp to the same YYYY-MM-DD HH:MM format, and a cost to a
  dollar amount per 1000 tokens with 4 decimal places. A field present but of the wrong type
  is an error that names the field, not a fallback to its literal text.

  Import validates that model_list key exists and holds a list, filters models by regex against
  model_id and access_groups, displays filtered models in a table (regardless of --dry-run;
  rejected models are never shown), counts attempts per provider (even on API errors), and
  shows a provider summary. Dry-run changes the table title but does not call client.models.new().
  API errors in the import loop are silently ignored (try/except). Info command warns to stderr
  for unknown columns but continues rendering valid ones.

  Tests. Test functions live in tests.rs files under models/ with the name prefixes the checks
  select: list_, add_, delete_, get_, info_, update_, cost_, iso_, unix_, import_, filter_,
  print_ and summary_ under commands::models. They run each command against a fake of the
  injected client from B4560's context that records each call and returns a canned response,
  and compare stdout and stderr against the exact lines and tables this task describes.
scope:
  paths:
    - tools/management-cli/src/commands/models.rs
    - tools/management-cli/src/commands/models/**
  lint_tables: false
