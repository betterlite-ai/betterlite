  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_beta_protocol::/)
      - test(/::replays_corpus$/)'
  - id: case-beta-session-audio-map
    why: the beta-session-audio-map behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_beta_protocol::tests::beta_session_audio_map($|::)/)'
  - id: case-ga-event-to-beta
    why: the ga-event-to-beta behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_beta_protocol::tests::ga_event_to_beta($|::)/)'
  - id: case-ga-only-event-drop
    why: the ga-only-event-drop behavior or its assertions are absent
