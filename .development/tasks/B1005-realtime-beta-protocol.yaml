id: B1005
title: Realtime beta protocol
description: >-
  Translate client beta session updates to GA and returned GA events/content types back to beta. Keep flat/nested
  audio settings, voice, output modalities, PCM/G711 mappings and dropped GA-only events source-compatible; expose
  a pure normalizer for the relay.


  Reuse B1004 decode_realtime_contract for _decode_json_object call sites; calling a lower decoder does not define
  another fuzz target.


  Implement crates/betterlite-core/src/api/realtime_beta_protocol.rs. Use RealtimeBetaProtocolInput and RealtimeBetaProtocolResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions beta_session_audio_map, ga_event_to_beta, ga_only_event_drop, g711_audio_format,
  nested_ga_unchanged under api::realtime_beta_protocol::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RealtimeBetaProtocol in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_beta_protocol: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._detect_beta_header (L1157-L1174);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._remap_beta_session_to_ga (L1177-L1257); litellm/litellm_core_utils/realtime_streaming.py:
  RealTimeStreaming._translate_event_to_beta (L1260-L1293); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._translate_item_content_types
  (L1296-L1307); litellm/litellm_core_utils/realtime_streaming.py: client_sent_openai_beta_realtime_header (L1592-L1594).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 92 owned nonblank/non-comment/non-docstring Python lines (119 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 112 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 362 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1004 (Realtime contracts), B1087 (Api
  boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids
  retain ownership on the provider and keys/data branches.
