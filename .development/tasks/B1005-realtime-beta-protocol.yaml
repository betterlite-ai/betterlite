id: B1005
title: Realtime beta protocol
description: >-
  Port the five complete beta compatibility helpers in realtime_streaming.py to
  betterlite-core::api::realtime_beta_protocol. Own _detect_beta_header,
  client_sent_openai_beta_realtime_header, _remap_beta_session_to_ga,
  _translate_event_to_beta and _translate_item_content_types, plus their three mapping constants
  at 215-234. These are pure record transforms, not a relay or WebSocket handshake owner.
  Raw header bytes decode as Latin-1. Detection is case-insensitive and tests substring realtime=v1,
  not a parsed token equality. Any header inspection exception returns false.

  Beta session remapping makes a shallow copy, preserves unrelated keys, removes legacy keys and
  gives the remapped values precedence over corresponding nested GA fields. Existing nested audio
  objects can be mutated because the Python copy is shallow; native ownership must reproduce the
  resulting value, not promise immutable shared aliases. Outgoing events translate item content
  and response.output content even when the event name itself is unknown. No byte parser belongs
  here; B1004 supplies parsed records and B171 the typed helper case decoder.

  Register HelperCall::RealtimeBetaProtocol and independent Python calls, with tests under
  api::realtime_beta_protocol::tests. Count 120 nonblank/non-comment function lines plus 19 mapping
  lines. Budget 125 implementation,120 tests,95 fixtures,85 adapters and 25 wiring =450 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/realtime_beta_protocol.rs
  - crates/betterlite-core/src/api/realtime_beta_protocol/**
  - tools/oracle/src/helpers/core_ops/realtime_beta_protocol.rs
  - tools/oracle/src/helpers/core_ops/realtime_beta_protocol/**
  - tools/oracle/helpers/realtime_beta_protocol.py
  - tools/oracle/helpers/realtime_beta_protocol/**
  - tools/oracle/cases/helpers/realtime-beta-protocol/**
  - tools/oracle/fuzz/corpus/helper_case/realtime-beta-protocol-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L215-L234
  why: Exact audio format, event name and content name tables used by the transformations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L1156-L1307
  why: Whole header detector and all three record transformations, including GA-only event drops.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L1592-L1594
  why: Public beta-header helper delegates to the same detector used by session initialization.
dod:
- text: >-
    beta_header_detection tests byte and string headers OpenAI-Beta=REALTIME=V1, mixed casing,
    "other, realtime=v1" and "realtime=v10": all true because matching is a substring. Missing header,
    realtime=v2 and a scope access failure are false. Duplicate headers succeed if any matches;
    unrelated Latin-1 bytes do not fail UTF-8 decoding because UTF-8 is not used here.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    beta_session_audio_mapping sends modalities=[TEXT,AUDIO],voice=alloy,input_audio_format=pcm16,
    output_audio_format=g711_ulaw,turn_detection={type:server_vad},input_audio_transcription={model:whisper-1}.
    Expect type=realtime,output_modalities=[audio],audio.output.voice=alloy,input.format={type:audio/pcm,
    rate:24000},output.format={type:audio/G711-ulaw,rate:8000},nested turn_detection/transcription and
    no legacy keys. g711_alaw maps to audio/G711-alaw,rate8000; unknown strings and already-object formats
    pass through. Text-only becomes [text]; empty/null/unknown modalities removes modalities without
    adding output_modalities. An existing output_modalities wins even when null; explicit session.type
    including null survives. Instructions,tools and future fields remain unchanged.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    beta_session_nested_precedence supplies existing audio.input={format:old,noise_reduction:{type:near_field}}
    and flat input_audio_format=pcm16. Expect new format and retained noise_reduction; flat voice replaces
    nested voice while retaining other output keys. A legacy field explicitly null overwrites the nested
    value with null. A malformed modalities element that lacks lower() raises; this helper does not silently
    repair arbitrary types. Caller relay fallback is B1009's responsibility.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    ga_events_for_beta maps conversation.item.added -> conversation.item.created and the six
    response.output_text/output_audio/output_audio_transcript delta/done names to response.text/audio/
    audio_transcript delta/done. conversation.item.done returns None and is dropped. Translate content
    output_text -> text and output_audio -> audio inside item.content and every object in response.output;
    preserve other content blocks and nonobject list entries. Unknown event names still get nested
    content translation; events with no relevant nested records retain their original value.
  proof: [behavior-tests, oracle, helper-python]
- text: The helper operation and its four independent fixture groups are newly added.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Every legacy mapping and its precedence must be covered by domain tests.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_beta_protocol::tests::/)'
  - id: helper-python
    why: Beta conversion is compared against the actual pure source methods.
    run: test -f tools/oracle/helpers/realtime_beta_protocol.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: Beta operations need a tagged seed in the shared decoder corpus.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime-beta-protocol-*)" && grep -qE '^[[:space:]]+realtime_beta_protocol:' tools/oracle/fuzz/corpus/helper_case/realtime-beta-protocol-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Complete mapping tables need new source parity fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-beta-protocol)"
oracle_cases:
- tools/oracle/cases/helpers/realtime-beta-protocol/beta-header-detection.yaml
- tools/oracle/cases/helpers/realtime-beta-protocol/beta-session-audio-mapping.yaml
- tools/oracle/cases/helpers/realtime-beta-protocol/beta-session-nested-precedence.yaml
- tools/oracle/cases/helpers/realtime-beta-protocol/ga-events-for-beta.yaml
deviations: []
out_of_scope:
- B1004 owns protocols/frame decoding; B1006 session initialization/logging; B1110 send/enforcement; B1124 buffering; B2455 guardrail policy; B1007 guardrail execution; B1008 backend relay; B1009 client relay. The unused _has_realtime_guardrails has no caller at the pin.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_beta_protocol in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/realtime_beta_protocol.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_beta_protocol.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- realtime=v10 also matches realtime=v1; replacing substring detection with strict token parsing changes behavior.
- conversation.item.done is dropped, while response.done still carries translated nested content.
- Legacy audio fields override existing GA nested values, including an explicit null.
review_level: standard
budget:
  max_changed_lines: 450
  max_new_expects: 0
