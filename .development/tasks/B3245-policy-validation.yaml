oracle_cases: []
deviations:
  - what: "Registry lookup failures (missing guardrail handler, unexpected exception) return an empty set and log a warning instead of surfacing an error."
    why: "LiteLLM calls get_available_guardrails and silently continues on failure; betterlite preserves the graceful degradation."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L73-L82
  - what: "Database and router lookup failures (Prisma unavailable, router unavailable, query exceptions) return true (assume valid) and log a warning."
    why: "LiteLLM degrades gracefully when the database or router is not available; validation assumes entities exist rather than blocking configuration."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L94-L155
  - what: "find_invalid_scope_entries is not called within validate_policies; callers must call it explicitly to validate scope."
    why: "LiteLLM's validate_policies does not validate scope entries; scope validation is a separate operation available to callers that need it."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L296-L360
  - what: "Wildcard pattern detection uses trailing-star matching (RouteChecks._is_wildcard_pattern); patterns like 'team-*' or 'model-*' are treated as patterns and never validated."
    why: "LiteLLM and betterlite-auth both treat only trailing-star patterns as valid wildcards; regex patterns are not supported in scope validation."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L176-L220
out_of_scope:
  - "PolicyValidator.is_wildcard_pattern (policy_validator.py L53-L64): no caller at the pin; active scope validation calls RouteChecks._is_wildcard_pattern instead."
  - "GuardrailRegistry.list_in_memory_guardrails (unresolved): B104 has no concrete task file to determine its owner."
  - "PolicyValidateRequest (validation_types.py L69-L78): request envelope for /policy/validate route owned by B3250; route parsing is proven by B3250's oracle cases."
  - "PolicyRegistry._parse_policy: owned by B3241 since B3245 calls it from validate_policy_config."
  - "RouteChecks._is_wildcard_pattern: owned by B882 since B3245 calls it for pattern detection."
  - "VerificationTokenRepository and TeamRepository database operations: owned by B722 and B724 respectively; B3245 uses their table.find_first methods."
  - "PatternMatchRouter.get_deployments_by_pattern: owned by B367 since B3245 calls it for model validation."
pitfalls:
  - "validate_db parameter in validate_policies and validate_policy_config is accepted but never read; the Rust port keeps the parameter inert rather than inventing gating logic."
  - "Empty guardrail registry returns empty set from get_available_guardrails; validate_policies then skips guardrail validation (no errors when registry is empty)."
  - "Database and router lookup failures return true, not false, so missing dependencies do not block policy validation."
  - "find_invalid_scope_entries is not called by validate_policies; callers must invoke it separately to validate concrete scope entries."
  - "Inheritance validation uses set() to detect cycles; the parent must be added to visited before recursing to catch parent-child cycles."
  - "Maximum inheritance depth is exactly 100; depth=0 triggers the depth-exceeded error, so max_depth starts at 100 for a policy with no parents."
  - "Wildcard detection uses only trailing '*'; patterns like 'team-prod' or 'model_gpt4*' without trailing star are treated as concrete and validated by existence."
  - "Pipeline step validation checks two invariants: step.guardrail must be in policy.guardrails.add AND in the registry; both failures are errors."
  - "validate_policy_config returns early with parse errors and does not call validate_policies when any policy fails to parse."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
