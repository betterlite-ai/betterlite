id: B3245
title: Policy validation and concrete attachment scopes
description: >-
  Build validation types and the `PolicyValidator` to check policy configuration
  correctness, guardrail registry membership, team/key existence, model resolution,
  and inheritance chain validity. Validate policies at configuration time, catching
  invalid guardrails, undefined parents, circular inheritance and depth limits,
  missing scope entities, and pipeline step guardrail references.

  Preserve warning-and-assume-valid on database and router lookup failures when no
  storage is available, empty-registry guardrail validation bypass (no checks when
  the registry is empty), and the absence of scope validation in validate_policies
  itself (only find_invalid_scope_entries validates concrete scope entries).

  Validation type records include error enum variants (INVALID_GUARDRAIL, INVALID_TEAM,
  INVALID_KEY, INVALID_MODEL, INVALID_INHERITANCE, CIRCULAR_INHERITANCE, INVALID_SCOPE,
  INVALID_SYNTAX), error records with policy name, error type, message, field and
  value, request/response envelopes and response records with valid boolean and error/warning
  lists. Wildcard pattern detection uses trailing-star matching; patterns like "team-*"
  are never validated by existence since they may match future entities.
scope:
  paths:
    - crates/betterlite-policy/src/validation.rs
    - crates/betterlite-policy/src/validation/**
    - tools/oracle/cases/policy-validation/**
  lint_tables: false
