    why: "validate_policies checks guardrails and inheritance; no scope validation in this method."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L362-L403
    why: "_validate_pipeline checks guardrail membership and registry existence in pipeline steps."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L405-L452
    why: "validate_policy_config parses raw config and calls validate_policies; handles parse errors."
dod:
  - text: "PolicyValidationErrorType enum has INVALID_GUARDRAIL, INVALID_TEAM, INVALID_KEY, INVALID_MODEL, INVALID_INHERITANCE, CIRCULAR_INHERITANCE, INVALID_SCOPE and INVALID_SYNTAX variants."
    proof: [error-types]
  - text: "PolicyValidationError record holds policy_name, error_type, message, field and value, all with exact LiteLLM field names and semantics."
    proof: [error-records]
  - text: "PolicyValidationResponse holds valid boolean and errors/warnings lists; valid is true iff errors list is empty."
    proof: [response-records]
  - text: "PolicyValidator::new takes optional database and router dependencies; both are None-safe with graceful degradation."
    proof: [validator-init]
  - text: "get_available_guardrails calls IN_MEMORY_GUARDRAIL_HANDLER.list_in_memory_guardrails and returns a set of guardrail names, or empty set on error with warning logged."
    proof: [guardrail-lookup]
  - text: "check_team_alias_exists returns true when the prisma client is None or the team alias exists; warns and returns true on database error."
    proof: [team-alias-checks]
  - text: "check_key_alias_exists returns true when the prisma client is None or the key alias exists; warns and returns true on database error."
    proof: [key-alias-checks]
  - text: "check_model_exists returns true when the router is None, the model is in router.model_names, or matches via pattern_router.get_deployments_by_pattern; warns and returns true on router error."
    proof: [model-checks]
  - text: "find_invalid_scope_entries returns errors only for concrete (non-wildcard) entries that do not exist; patterns with trailing star are skipped and never validated."
    proof: [scope-validation]
  - text: "find_invalid_scope_entries uses RouteChecks._is_wildcard_pattern to detect patterns; only trailing-star patterns match the detection rule."
    proof: [scope-pattern-detection]
  - text: "_validate_inheritance_chain detects circular inheritance, missing parent policies, and depth exceeding 100; parent_not_found is a blocking error."
    proof: [inheritance-validation]
  - text: "validate_policies calls get_available_guardrails once and checks every add/remove guardrail; errors on invalid guardrails in add list only when registry is non-empty."
    proof: [policy-guardrail-validation]
  - text: "Invalid guardrails in guardrails.remove produce warnings (non-blocking), not errors, when the registry is non-empty; empty registry skips the check for remove as well."
    proof: [policy-guardrail-warning]
  - text: "validate_policies calls _validate_pipeline and _validate_inheritance_chain; it does not call find_invalid_scope_entries."
    proof: [policy-validation-structure]
  - text: "_validate_pipeline checks that every guardrail in pipeline.steps is in the policy's guardrails.add list and exists in the registry (when registry is non-empty)."
    proof: [pipeline-validation]
  - text: "validate_policy_config parses each policy using PolicyRegistry._parse_policy; returns early with parse errors if any policy fails to parse."
    proof: [config-parsing]
  - text: "validate_policy_config returns PolicyValidationResponse with valid=false and only errors when parse errors exist; parse errors do not trigger validate_policies."
    proof: [config-parse-error-handling]
