    why: "get_available_guardrails reads IN_MEMORY_GUARDRAIL_HANDLER; warns on registry failure and returns empty set."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L84-L104
    why: "check_team_alias_exists queries database or assumes valid; warns on error."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L106-L126
    why: "check_key_alias_exists queries database or assumes valid; warns on error."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L128-L155
    why: "check_model_exists checks router model_names and pattern_router, or assumes valid; warns on error."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L157-L174
    why: "_scope_error builds error messages for invalid team/key/model with wildcard suggestion."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_validator.py#L176-L220
    why: "find_invalid_scope_entries validates concrete scope entries, skipping wildcard patterns."
