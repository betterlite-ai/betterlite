id: B2239
title: Injected verbose logging hooks
description: >-
  Implement injected logger/console verbose hooks below stream assembly and logging callbacks, preserving their
  different boolean guards. Apply B187 redaction to emitted payloads; never let logging failures change the request
  result. This task reads resolved settings, not process globals.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/main.py: print_verbose L8836-L8842.
  litellm/utils.py: print_verbose L544-L559; _print_verbose_is_active L562-L567.


  Named case contracts: main_verbose_guard: main.print_verbose always emits debug, then console only for truthy
  litellm.set_verbose. Default false. A logger exception prevents console emission because both are in the same
  try; logger and console exceptions are swallowed. utils_verbose_levels: utils.print_verbose defaults logger_only=false
  and log_level=DEBUG. Exact DEBUG/INFO/ERROR choose their logger method; an unknown level emits no logger record.
  Console requires set_verbose is True and logger_only is False, not general truthiness. A logger exception prevents
  console; either sink failure is swallowed. verbose_active: _print_verbose_is_active returns true only for set_verbose
  is True or logger enabled DEBUG. Logging module set_verbose and exposed litellm.set_verbose are distinct source
  values; inject the latter for console guards. Reuse the same resolved setting as both verbose entry points. redacted_verbose_payload:
  Both hooks redact credential/body values through B187 before a sink sees them; fixture sink errors do not expose
  secret payloads in outward failure. This is the repository privacy deviation, with logging level and suppression
  preserved.


  Load set_verbose through betterlite-config, with injected environment lookup and the defaults/precedence stated
  here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest verbose_hooks_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Implement crates/betterlite-logging/src/verbose_hooks.rs with adjacent tests under verbose_hooks/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function verbose_hooks_cases in betterlite-logging with these exact named cases (one per oracle file):
  main_verbose_guard, utils_verbose_levels, verbose_active, redacted_verbose_payload. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/verbose_hooks* using HelperCase: kind: helper
  and the externally tagged verbose_hooks variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_verbose_hooks that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 29 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 75 production lines, 130 behavior/config-test lines, 90 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 365 planned, 400 maximum changed lines.
