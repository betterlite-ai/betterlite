- tools/oracle/cases/helpers/providers/verbose-hooks/redacted-verbose-payload.yaml
deviations:
- what: Verbose logger and console payloads are redacted before emission; LiteLLM can print raw supplied payloads.
  why: The repository requires secrets and message bodies to stay out of diagnostic logs. Preserve source sink ordering
    and failure suppression.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L544-L559
