checks:
  optional:
  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/verbose_hooks.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/verbose_hooks*")"
      && grep -lq 'verbose_hooks' tools/oracle/fuzz/corpus/helper_case/verbose_hooks* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_verbose_hooks$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-main-verbose-guard
    why: main.print_verbose always emits debug, then console only for truthy litellm.set_verbose. Default false.
      A logger exception prevents console emission because both are in the same try; logger and console exceptions
      are swallowed.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::verbose_hooks_cases::case_[0-9]+_main_verbose_guard$/)'
  - id: case-utils-verbose-levels
    why: utils.print_verbose defaults logger_only=false and log_level=DEBUG. Exact DEBUG/INFO/ERROR choose their
      logger method; an unknown level emits no logger record. Console requires set_verbose is True and logger_only
      is False, not general truthiness. A logger exception prevents console; either sink failure is swallowed.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::verbose_hooks_cases::case_[0-9]+_utils_verbose_levels$/)'
  - id: case-verbose-active
    why: _print_verbose_is_active returns true only for set_verbose is True or logger enabled DEBUG. Logging module
      set_verbose and exposed litellm.set_verbose are distinct source values; inject the latter for console guards.
      Reuse the same resolved setting as both verbose entry points.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::verbose_hooks_cases::case_[0-9]+_verbose_active$/)'
  - id: case-redacted-verbose-payload
    why: Both hooks redact credential/body values through B187 before a sink sees them; fixture sink errors do not
      expose secret payloads in outward failure. This is the repository privacy deviation, with logging level and
      suppression preserved.
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::verbose_hooks_cases::case_[0-9]+_redacted_verbose_payload$/)'
  - id: config-set-verbose
    why: set_verbose lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::verbose_hooks_config_cases::case_[0-9]+_loads_set_verbose$/)'
