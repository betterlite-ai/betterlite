    why: "Team reset phase: reset_budget_for_litellm_teams and _reset_budget_for_litellm_teams_chunk."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/reset_budget_job.py#L1376-L1410
    why: "Single window reset logic: _reset_expired_window with cache and DB row updates."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/reset_budget_job.py#L1413-L1449
