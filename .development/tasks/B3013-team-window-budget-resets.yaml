deviations:
  - what: Window counter resets fail gracefully on Redis write with a warning; the in-memory counter is set regardless. Subsequent requests see the new counter value.
    why: The maintained window row is best-effort for optimization; counter reset must not fail the entire window reset. The cache is the source of truth until the next read rehydrates from Redis.
  - what: "Malformed budget_duration in a window (unparseable by duration_in_seconds) is logged as a warning and the window's row roll is skipped in _roll_window_spend_row; the reset_at was already advanced to the fallback value before the roll call, so only the database row optimization is lost."
    why: Reset-at advancement happens before the roll attempt, so a failed roll leaves the JSON reset_at at its new fallback value. The row will be retried on the next sweep; stopping the entire page on one bad entry would pin that window's carry-over pending repair.
  - what: A window with non-string reset_at or missing budget_duration raises and aborts the remaining pages for that entity source this tick, caught and logged by reset_budget_windows with source name and exception.
    why: These corruptions occur at counter-key construction or expiry parsing (before the reset attempt), so they abort the walk. Healthy windows on other pages are skipped until the next tick; manual repair or retrying the corrupted batch is required.
  - what: Keyset pagination never terminates early due to a page limit; it walks to the end of the table because process lease release prevents inter-process position memory and an artificial cap would starve tail rows indefinitely.
    why: LiteLLM's design requires unbounded walks per sweep tick; artificial caps introduce windows pinned at budget limit forever. The strict cursor advancement guarantees termination without bound.
out_of_scope:
  - "Team reset calculation (_reset_budget_for_team) is owned by B3009; this task only writes the updated rows and resets budget windows."
  - "B2317 owns compute_budget_reset_at; this task uses it as supplied."
  - "B1735 owns roll_window_spend_row; this task calls it as a helper for window maintenance."
  - "Redis counter write and TTL operations are owned by B360; this task receives the DualCache interface."
  - "Local cache get/set operations are owned by B2226; in-memory counter writes use it."
  - "Service event emission is owned by B1690; failure handling uses the injected contract."
pitfalls:
  - "Window reset_at is stored in JSON as ISO format string (isoformat()); parsing must handle both 'Z' and '+00:00' suffixes for UTC."
  - "Carry-over spend depends on _rollover_enabled() and the rollover cap from max_budget; neither check applies to windows without a max_budget field."
  - "Keyset pagination uses raw SQL for budget_limits reads because prisma-client-python cannot filter on Json? columns; table and column names are module constants, never input or user-derived."
  - "Failed Redis writes in _reset_expired_window are logged as warnings only; process proceeds to maintain the row and rewrite JSON, so the counter may not sync."
  - "Multiple windows per row are processed in order; a failure on one window does not stop others in the same row, but a DB write failure stops the entire page."
  - "Team reset phase calls B3009's _reset_budget_for_team helper, which is distinct from the window reset operations even though both may update the same row."
  - "In _reset_expired_window, reset_at is unconditionally advanced to the new value (line 1402) before _roll_window_spend_row is called (line 1403); duration parsing failures inside the roll log a warning and skip only the row update, not the JSON reset_at advancement."
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 2
