id: B3013
title: Reset team budgets and keyset-paged budget windows
description: >-
  Implement `betterlite-db::team_window_reset` to reset expired team budgets and
  update keyset-paged budget windows for keys and teams. Reset team spending and
  budget_reset_at timestamps using B3009's shared reset helpers and cache
  invalidation. Handle individual budget windows stored as JSON in budget_limits
  columns for keys and teams, resetting expired windows and advancing their
  reset timestamps without cascading rollover to linked rows (window resets
  are independent, not tied to the key/team budget cascade). Preserve the
  window reset path's order: cache write for carry-over spend, maintained-window-row
  roll via B1735, budget_limits JSON rewrite, with all Redis/maintained-row failures
  treated as warnings without stopping the reset.

  Config keys: `budget_duration` and `max_budget` in window objects.
  Cache keys: `spend:key:*:window:*`, `spend:team:*:window:*` for window counters.
  DB tables: LiteLLM_VerificationToken (keys), LiteLLM_TeamTable (teams).
scope:
  paths:
    - crates/betterlite-db/**
    - crates/betterlite-auth/**
    - crates/betterlite-config/**
    - tools/oracle/cases/team-window-reset/**
  lint_tables: false
