  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/reset_budget_job.py#L1451-L1470
    why: "Carry-over spend calculation for rollover: _window_carried_spend."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/reset_budget_job.py#L1471-L1485
    why: "Window reset orchestration: reset_budget_windows and per-source iteration."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/reset_budget_job.py#L1486-L1517
    why: "Keyset pagination and termination: _reset_windows_for with cursor-driven table walk."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/reset_budget_job.py#L1518-L1559
    why: "Single page processing and row write: _reset_window_page with JSON persistence."
dod:
  - text: reset_budget_for_litellm_teams iterates teams due for reset in chunks, calls B3009's _reset_budget_for_team for each, persists spend/budget_reset_at updates via _write_team_reset_updates, and invalidates spend counters keyed as spend:team:{team_id}.
    proof: [team-resets]
  - text: Team reset updates write only spend decrements and budget_reset_at advances through the spend_reset_unit_of_work, matching the architecture of B3012's key/user resets.
    proof: [team-writes]
  - text: Reset-at time computation calls B2317's compute_budget_reset_at with the budget_duration and current reset settings to set the next window expiry.
    proof: [reset-at-computation]
  - text: Window reset path reads budget_limits JSON (list of {budget_duration, max_budget, reset_at}) for each row, checks each window's reset_at <= now, and resets only expired windows without touching others.
    proof: [window-expiry-check]
  - text: Expired window reset writes new carry-over spend to both in-memory and Redis caches with warning-only failures, updates the window's reset_at timestamp in the JSON, and rolls the window spend row via B1735's roll_window_spend_row.
    proof: [window-cache-roll]
  - text: Window carry-over spend is computed from the current counter value and the rollover cap if rollover is enabled; reads that fail or return non-float fall back to zero.
    proof: [carry-over-cases]
  - text: "Malformed window input (non-string reset_at or missing budget_duration) raises and aborts the remaining pages for that entity source this tick, caught and logged by reset_budget_windows; healthy windows are reset independently."
    proof: [json-persist-cases]
  - text: Keyset pagination for keys and teams walks rows in primary-key order with a SQL cursor, processes one page per _reset_window_page call, and terminates when fewer rows than RESET_BUDGET_JOB_BATCH_SIZE are returned.
    proof: [keyset-pagination]
