    why: AnthropicTextConfig.max_tokens_to_sample lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::anthropic_legacy_config_cases::case_[0-9]+_loads_anthropictextconfig_max_tokens_to_sample$/)'
  - id: config-anthropictextconfig-stop-sequences
