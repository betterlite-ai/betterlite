- tools/oracle/cases/helpers/providers/anthropic-completion/legacy-options.yaml
- tools/oracle/cases/helpers/providers/anthropic-completion/legacy-response-stop-reason.yaml
- tools/oracle/cases/helpers/providers/anthropic-completion/legacy-stream-chunk.yaml
- tools/oracle/cases/helpers/providers/anthropic-completion/legacy-auth.yaml
