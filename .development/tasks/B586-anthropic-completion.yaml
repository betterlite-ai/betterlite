    why: AnthropicTextConfig.top_k lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::anthropic_legacy_config_cases::case_[0-9]+_loads_anthropictextconfig_top_k$/)'
  - id: config-anthropictextconfig-metadata
    why: AnthropicTextConfig.metadata lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::anthropic_legacy_config_cases::case_[0-9]+_loads_anthropictextconfig_metadata$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::legacy_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::legacy_secret_safe_failure$/)'
