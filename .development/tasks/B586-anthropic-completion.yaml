checks:
  optional:
  - mutants
  commands:
  - id: case-legacy-model-selection
    why: Only exact claude-2 or claude-instant-1 match, with no prefix stripping/case folding/version extension.
      Other routing predicates remain B027.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::completion_cases::case_[0-9]+_legacy_model_selection$/)'
  - id: case-human-assistant-prompt
    why: Use model-specific litellm.custom_prompt_dict when key exists, requiring roles,initial_prompt_value,final_prompt_value
      and invoking B177 custom_prompt; otherwise B177 prompt_factory(model,messages,provider=anthropic). Cast resulting
      prompt to str. Repeat same prompt construction for response usage, not request_data.prompt.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::completion_cases::case_[0-9]+_human_assistant_prompt$/)'
  - id: case-legacy-options
    why: Constructor sets non-None class defaults max_tokens_to_sample=DEFAULT_MAX_TOKENS env4096, stop_sequences,temperature,top_p,top_k,metadata.
      Initial class max sample is litellm.max_tokens=DEFAULT_MAX_TOKENS, then constructor default overwrites it.
      B2202 get_config fills only absent option keys; body model/prompt appear first so optional overrides win.
      Allowlist stream,max_tokens,max_completion_tokens,stop,temperature,top_p,extra_headers,user; max aliases overwrite
      max_tokens_to_sample in input order without rounding/clamping, stream onlyTrue, stop B2201, temperature/top_p
      copied, user->metadata.user_id with no validation evenNone. extra_headers is advertised but not mapped here.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::completion_cases::case_[0-9]+_legacy_options$/)'
  - id: case-legacy-response-stop-reason
    why: JSON failure raises AnthropicTextError with raw text/status; error key raises str(error)/rawstatus. Nonempty
      completion replaces content; empty completion retains existing content. stop_reason is copied without B206
      mapping. Tokenize regenerated prompt and final content using explicit encoding or B195 litellm.encoding; set
      created current inttime/model=request model and summedUsage; keep initialized id.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::completion_cases::case_[0-9]+_legacy_response_stop_reason$/)'
  - id: case-legacy-stream-chunk
    why: 'index=int(get(index,0)); only string non-None completion becomes text, elseempty. finish_reason=get(stop_reason)
      or empty; then check !=None means is_finished ALWAYS true, including missing/None/empty stop_reason. No tool/usage/provider
      fields. JSONDecodeError caught as ValueError Failed to decode JSON from chunk: <chunk>, other conversion errors
      retain class.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::completion_cases::case_[0-9]+_legacy_stream_chunk$/)'
  - id: case-legacy-auth
    why: api_key=None raises ValueError Missing Anthropic API Key - A call is being made to anthropic but no key
      is set either in the environment variables or via params; empty accepted. Overwrite accept=application/json,anthropic-version=2023-06-01,content-type=application/json,x-api-key=key;
      no OAuth handling and no env lookup inside validator.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::completion_cases::case_[0-9]+_legacy_auth$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_completion.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_completion*")"
      && grep -lq 'anthropic_completion' tools/oracle/fuzz/corpus/helper_case/anthropic_completion* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_completion$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-anthropic/fuzz/corpus/anthropic_completion)"
      && grep -q 'decode_legacy_anthropic_reply' crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_completion.rs
      && cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::replays_the_anthropic_completion_corpus$/)'
  - id: case-legacy-error-envelope
    why: AnthropicTextError always synthesizes POST https://api.anthropic.com/v1/complete and same-status response
      via B2202 BaseLLMException; get_error_class ignores supplied headers. Iterator construction delegates B005
