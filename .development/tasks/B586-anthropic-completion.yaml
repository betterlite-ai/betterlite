id: B586
title: Legacy Anthropic completions
description: >-
  Add legacy Anthropic completion configuration, Human/Assistant prompt formation and /v1/complete request/response/stream
  conversion. Select this path only for the source legacy text-model names; share existing text-completion and chat
  bridge records and stream framing.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/completion/transformation.py:
  AnthropicTextError.__init__ L40-L50; AnthropicTextConfig.__init__ L67-L79; AnthropicTextConfig.validate_environment
  L82-L103; AnthropicTextConfig.transform_request L105-L128; AnthropicTextConfig.get_supported_openai_params L130-L143;
  AnthropicTextConfig.map_openai_params L145-L176; AnthropicTextConfig.transform_response L178-L223; AnthropicTextConfig.get_error_class
  L225-L229; AnthropicTextConfig._is_anthropic_text_model L232-L233; AnthropicTextConfig._get_anthropic_text_prompt_from_messages
  L235-L249; AnthropicTextConfig.get_model_response_iterator L251-L261; AnthropicTextCompletionResponseIterator.chunk_parser
  L265-L293.


  Reuse B2201 _map_stop_sequences and the B195 litellm.encoding-equivalent engine for the completion token estimate;
  no new tokenizer acquisition is owned here.


  Named case contracts: legacy_model_selection: Only exact claude-2 or claude-instant-1 match, with no prefix stripping/case
  folding/version extension. Other routing predicates remain B027. human_assistant_prompt: Use model-specific litellm.custom_prompt_dict
  when key exists, requiring roles,initial_prompt_value,final_prompt_value and invoking B177 custom_prompt; otherwise
  B177 prompt_factory(model,messages,provider=anthropic). Cast resulting prompt to str. Repeat same prompt construction
  for response usage, not request_data.prompt. legacy_options: Constructor sets non-None class defaults max_tokens_to_sample=DEFAULT_MAX_TOKENS
  env4096, stop_sequences,temperature,top_p,top_k,metadata. Initial class max sample is litellm.max_tokens=DEFAULT_MAX_TOKENS,
  then constructor default overwrites it. B2202 get_config fills only absent option keys; body model/prompt appear
  first so optional overrides win. Allowlist stream,max_tokens,max_completion_tokens,stop,temperature,top_p,extra_headers,user;
  max aliases overwrite max_tokens_to_sample in input order without rounding/clamping, stream onlyTrue, stop B2201,
  temperature/top_p copied, user->metadata.user_id with no validation evenNone. extra_headers is advertised but
  not mapped here. legacy_response_stop_reason: JSON failure raises AnthropicTextError with raw text/status; error
  key raises str(error)/rawstatus. Nonempty completion replaces content; empty completion retains existing content.
  stop_reason is copied without B206 mapping. Tokenize regenerated prompt and final content using explicit encoding
  or B195 litellm.encoding; set created current inttime/model=request model and summedUsage; keep initialized id.
  legacy_stream_chunk: index=int(get(index,0)); only string non-None completion becomes text, elseempty. finish_reason=get(stop_reason)
  or empty; then check !=None means is_finished ALWAYS true, including missing/None/empty stop_reason. No tool/usage/provider
  fields. JSONDecodeError caught as ValueError Failed to decode JSON from chunk: <chunk>, other conversion errors
  retain class. legacy_auth: api_key=None raises ValueError Missing Anthropic API Key - A call is being made to
  anthropic but no key is set either in the environment variables or via params; empty accepted. Overwrite accept=application/json,anthropic-version=2023-06-01,content-type=application/json,x-api-key=key;
  no OAuth handling and no env lookup inside validator. legacy_error_envelope: AnthropicTextError always synthesizes
  POST https://api.anthropic.com/v1/complete and same-status response via B2202 BaseLLMException; get_error_class
  ignores supplied headers. Iterator construction delegates B005 shared BaseModelResponseIterator semantics with
  supplied sync_stream/json_mode.


  Load AnthropicTextConfig.max_tokens_to_sample, AnthropicTextConfig.stop_sequences, AnthropicTextConfig.temperature,
  AnthropicTextConfig.top_p, AnthropicTextConfig.top_k, AnthropicTextConfig.metadata through betterlite-config,
  with injected environment lookup and the defaults/precedence stated here. Deployment inputs use litellm_params
  and global inputs use litellm_settings. Add config rstest anthropic_legacy_config_cases; each named loads_<key>
  case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml parser seeds. Reject
  unrelated keys.


  Reuse B2202 DEFAULT_MAX_TOKENS loader and B177 custom_prompt_dict loader, rather than introducing new environment
  spellings.


  Write standalone Rust test legacy_credential_identity_isolation in betterlite-anthropic: Distinct configured identities
  cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle case.


  Write standalone Rust test legacy_secret_safe_failure in betterlite-anthropic: Debug and owned failure paths do
  not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct constructor/helper prerequisites used by this slice: B2214. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-anthropic/src/completion.rs with adjacent tests under completion/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_completion in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function completion_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  legacy_model_selection, human_assistant_prompt, legacy_options, legacy_response_stop_reason, legacy_stream_chunk,
  legacy_auth, legacy_error_envelope. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_completion* using HelperCase: kind:
  helper and the externally tagged anthropic_completion variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_completion that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_legacy_anthropic_reply consumes legacy completion JSON/event bytes in crates/betterlite-anthropic/src/completion.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_completion.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_completion.
  The adjacent test replays_the_anthropic_completion_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 211 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 230 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 65 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 725 planned, 725 maximum changed lines.
