id: B3881
title: Prometheus deployment outcomes and fallbacks
description: >-
  Port the PrometheusLogger methods that record what happened to one deployment or one fallback. Everything goes in
  crates/betterlite-logging/src/prometheus_deployment.rs. It writes through the collector handles B3874 builds, builds
  labels with the label factory B3873 supplies, increments counters through inc_labeled_counter from B3876, and reads
  no config. The module has one error enum, PrometheusDeploymentError, that wraps the error of the counter and gauge
  interface. Time comes from the typed instants in the payload, never from the system clock.

  Deployment state, from set_litellm_deployment_state, set_deployment_healthy, set_deployment_partial_outage and
  set_deployment_complete_outage. A DeploymentState enum has Healthy = 0, PartialOutage = 1 and CompleteOutage = 2.
  set_litellm_deployment_state(state, litellm_model_name, model_id: Option, api_base: Option, api_provider) builds labels
  with prometheus_label_factory from the label list of litellm_deployment_state and a UserAPIKeyLabelValues holding only
  those four fields, with no label context, and sets the gauge litellm_deployment_state to the state number. The three
  named setters call it with 0, 1 and 2. The router cooldown code (B308) calls the complete outage setter.

  Cooldown and callback counters. increment_deployment_cooled_down(litellm_model_name, model_id, api_base, api_provider,
  exception_status) sanitizes each of the five strings with B3870's sanitize function for label values and increments
  litellm_deployment_cooled_down by 1 with the five values as positional label values, in the order litellm_model_name,
  model_id, api_base, api_provider, exception_status. It does not use the label factory, so custom metadata and tag labels
  never reach it. increment_callback_logging_failure(callback_name) increments litellm_callback_logging_failures_metric by
  1 with the single label callback_name, unsanitized and without the factory. record_managed_batch_created(model, api_provider,
  user, user_email, api_key_alias: all Option<String>) increments litellm_managed_batch_created_total by 1 with those five fixed
  labels. It catches any collector error and logs it at warning as "Error recording batch created metric: <error>".

  Fallback events, from log_success_fallback_event and log_failure_fallback_event. Both take original_model_group, the
  request kwargs (with an optional model, an optional tags list and a metadata bucket) and a typed view of the original
  exception. Pick the bucket with B206's get_metadata_variable_name_from_kwargs ("litellm_metadata" when the kwargs have that
  key, else "metadata"), read it as the metadata map (empty when absent or null), and call B253's get_standard_logging_metadata
  on it. Build UserAPIKeyLabelValues with requested_model = the bounded requested model label of original_model_group with
  router_originated = true (B3880), fallback_model = kwargs model, hashed_api_key = user_api_key_hash, api_key_alias =
  user_api_key_alias, team = user_api_key_team_id, team_alias = user_api_key_team_alias, exception_status = str of the
  exception status_code, exception_class = B3880's get_exception_class_name of the exception, and tags = the kwargs tags (empty
  when absent). Make a fresh label context from it. The success event increments litellm_deployment_successful_fallbacks and the
  failure event litellm_deployment_failed_fallbacks, each by 1 through inc_labeled_counter. Both write one debug log line first
  ("Prometheus: log_success_fallback_event, original_model_group: ..." and the failure twin). Errors go back to the caller.

  Deployment failure, from set_llm_deployment_failure_metrics. The input is the request kwargs (model, exception, stream
  unused, litellm_params with custom_llm_provider, litellm_metadata, metadata and the flag proxy_rejected_before_routing, and
  the standard_logging_object). Steps in order, all inside one catch-all that logs at debug "Prometheus Error:
  set_llm_deployment_failure_metrics. Exception occured - <error>" and returns nothing.
  1. Read model_group, api_base and model_id from the payload. When model_id is absent, take it from litellm_params
  litellm_metadata.model_info.id, then from litellm_params metadata.model_info.id. When model_group is absent, take it from
  litellm_params litellm_metadata.model_group, then from metadata.model_group. llm_provider is litellm_params custom_llm_provider.
  2. Return when B3880's should_skip_metrics_for_invalid_key says so for these kwargs and payload.
  3. Call B3880's extract_deployment_failure_label_values. hashed_api_key, api_key_alias, team, team_alias, client_ip and
  user_agent are that result, and when it is falsy the payload metadata value (user_api_key_hash, user_api_key_alias,
  user_api_key_team_id, user_api_key_team_alias, requester_ip_address, user_agent). user_email is that result only.
  4. exception_status: when an exception exists, it is the text of the exception status_code, and when that text is "None" or empty
  and the exception has a code that is not null, the text of the code. An exception whose status_code and code are both missing
  therefore gives the literal text "None".
  5. deployment_selected is true when model_id is nonempty and litellm_params has no true proxy_rejected_before_routing. When
  selected: litellm_model_name = kwargs model, model_id, api_base and api_provider (= llm_provider) as read, requested_model =
  model_group or the kwargs model, model_group as read. When not selected: litellm_model_name, model_id, api_base and api_provider
  are all the empty string, requested_model = the bounded label (router_originated = true) of the kwargs model or, if that is
  empty, model_group, or "" when the label is None, and model_group = the bounded label of model_group (router_originated = true).
  6. Build UserAPIKeyLabelValues with those fields plus exception_status, exception_class (B3880's get_exception_class_name, only
  when an exception exists), the identity fields from step 3, tags = payload request_tags (empty when absent), client_ip and
  user_agent. Make one label context from it.
  7. Only when selected, call set_deployment_partial_outage with the kwargs model (or ""), model_id, api_base and llm_provider (or "").
  8. When an exception exists, increment litellm_deployment_failure_responses by 1 through inc_labeled_counter with the context.
  9. Always increment litellm_deployment_total_requests by 1 the same way.

  Deployment success, from set_llm_deployment_success_metrics. The input is the request kwargs, start_time, end_time, the request's
  UserAPIKeyLabelValues, output_tokens (default 1.0) and the request's label context. It sits inside one catch-all that logs the
  error at error level with "Prometheus Error: set_llm_deployment_success_metrics. Exception occured - <error>" and returns nothing.
  Steps in order.
  1. Return when the payload (standard_logging_object) is absent. Return when should_skip_metrics_for_invalid_key (B3880) is true for
  the kwargs, enum values and payload.
  2. api_base is the payload api_base. litellm_params is kwargs litellm_params (empty when absent). The metadata comes from B206's
  get_litellm_metadata_from_kwargs, model_info from its model_info (empty when absent), model_id from model_info id, llm_provider
  from litellm_params custom_llm_provider, litellm_model_name from the kwargs model.
  3. When model_info or litellm_params is nonempty, call B3879's set_deployment_tpm_rpm_limit_metrics with model_info, litellm_params,
  the model name, model_id, api_base, llm_provider and the enum values model_group.
  4. Read x_ratelimit_remaining_requests and x_ratelimit_remaining_tokens from payload hidden_params additional_headers when that map
  is nonempty. Read hidden_params litellm_overhead_time_ms.
  5. When the overhead is present and nonzero, observe litellm_overhead_latency_metric with overhead_ms / 1000, labels from the label factory
  with the metric's own label list and the context. Then call B3878's set_overhead_with_guardrails_metric, always.
  6. When the remaining requests value is present and nonzero, set litellm_remaining_requests_metric to it; same for tokens and
  litellm_remaining_tokens_metric. Both use the factory with their own label lists and the context. A header value may be a number or a
  numeric string; a string that is not a number is the failure that the catch-all logs.
  7. set_deployment_healthy with kwargs model (or ""), model_id (or ""), api_base (or "") and llm_provider (or "").
  8. Increment litellm_deployment_success_responses, then litellm_deployment_total_requests, each by 1 through inc_labeled_counter with
  the enum values and the context.
  9. Latency: response time is end_time minus start_time. When the kwargs stream flag is exactly true, the first-token time is the kwargs
  completion_start_time (end_time when absent) minus start_time. The latency is the first-token time unless it is absent or exactly zero,
  and then the response time. When output_tokens is present and above 0, observe litellm_deployment_latency_per_output_token with
  latency_seconds / output_tokens, labels from the factory with the metric's own list and the context.

  Tests live under prometheus_deployment/tests/ with the module names deployment_state, callback_counters, fallback_events,
  failure_outcome and success_outcome. Use a recording fake of the counter, gauge and histogram interface, so a test checks the metric
  name, labels, amount and call order, and a fake of the B3880, B3878 and B3879 functions that records its calls.

  Oracle helper cases call the helper operation b3881. Its Python adapter patches PrometheusLogger._inc_labeled_counter and the
  collector attributes with recorders, calls the real unbound LiteLLM methods on a bare stand-in object, and returns the recorded
  (metric, labels, value) list. B111 adds the scrape cases through the booted proxy.

