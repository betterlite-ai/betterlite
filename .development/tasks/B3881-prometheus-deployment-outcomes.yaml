dod:
  - text: set_litellm_deployment_state sets litellm_deployment_state to 0, 1 or 2 through the three setters, with only the four deployment labels and no label context.
    proof: [deployment-state-tests, outcome-oracle-cases]
  - text: increment_deployment_cooled_down increments litellm_deployment_cooled_down by 1 with five sanitized positional values in schema order, and never calls the label factory.
    proof: [callback-counter-tests]
  - text: increment_callback_logging_failure increments litellm_callback_logging_failures_metric with the label callback_name only.
    proof: [callback-counter-tests]
  - text: record_managed_batch_created increments its counter with the five fixed labels, and a collector error is caught and logged at warning, not returned.
    proof: [callback-counter-tests]
  - text: Success and failure fallback events increment litellm_deployment_successful_fallbacks and litellm_deployment_failed_fallbacks once, with the bounded requested model, fallback model, key and team identity, exception status and class, and tags.
    proof: [fallback-event-tests, outcome-oracle-cases]
  - text: A fallback event reads its metadata from litellm_metadata when the kwargs have that key and from metadata otherwise, and an exception without a status_code gives the exception_status text "None".
    proof: [fallback-event-tests, outcome-oracle-cases]
  - text: A failure with a selected deployment sets the partial outage state, increments the failure counter when an exception exists, and always increments the total counter, in that order.
    proof: [failure-outcome-tests, outcome-oracle-cases]
  - text: A failure with no model_id, or with proxy_rejected_before_routing true, leaves the deployment labels empty, bounds requested_model and model_group, and does not set an outage state.
    proof: [failure-outcome-tests, outcome-oracle-cases]
  - text: Failure model_id and model_group fall back to litellm_metadata and then metadata, and identity labels fall back from the B3880 result to the payload metadata.
    proof: [failure-outcome-tests, outcome-oracle-cases]
  - text: Failure exception_status uses status_code, then code, and ends as the text "None" when neither exists.
    proof: [failure-outcome-tests, outcome-oracle-cases]
  - text: A failure for an invalid-key request records nothing, and any error inside the failure function is logged at debug and never returned.
    proof: [failure-outcome-tests]
  - text: A success with no payload, or for an invalid-key request, records nothing and returns.
    proof: [success-outcome-tests]
  - text: "A success writes in this order: deployment limits (B3879), overhead histogram, guardrail overhead (B3878), remaining requests, remaining tokens, healthy state, success counter, total counter, latency per output token."
    proof: [success-outcome-tests, outcome-oracle-cases]
  - text: Remaining requests and tokens gauges and the overhead histogram are skipped for absent or zero values, and set for nonzero ones.
    proof: [success-outcome-tests]
  - text: A streaming success measures latency from completion_start_time, falling back to the response time when the first-token time is exactly zero; a non-streaming success uses the response time.
    proof: [success-outcome-tests]
  - text: Latency per output token is observed only when output_tokens is above 0, and equals latency seconds divided by output_tokens.
    proof: [success-outcome-tests]
  - text: An error inside the success function is logged at error level and never returned, and the writes after the failing one do not happen.
    proof: [success-outcome-tests]
  - text: Oracle helper cases for the failure, fallback and success labels and amounts run against LiteLLM and betterlite with equal output.
    proof: [outcome-oracle-cases, helper-python]

checks:
  optional: []
  commands:
    - id: deployment-state-tests
      why: the deployment state setters or their labels are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_deployment::deployment_state::/)'
    - id: callback-counter-tests
      why: the cooled down, callback failure or managed batch counters are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_deployment::callback_counters::/)'
    - id: fallback-event-tests
      why: the fallback event counters or their label values are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_deployment::fallback_events::/)'
    - id: failure-outcome-tests
      why: the deployment failure labels, fallbacks or write order are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_deployment::failure_outcome::/)'
    - id: success-outcome-tests
      why: the deployment success writes, order or latency choice are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_deployment::success_outcome::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3881)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3881 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3881/pyrightconfig.json
    - id: outcome-oracle-cases
      why: the oracle helper cases are absent or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/prometheus-deployment)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/prometheus-deployment

oracle_cases:
  - tools/oracle/cases/helpers/prometheus-deployment/failure-selected-deployment.yaml
  - tools/oracle/cases/helpers/prometheus-deployment/failure-rejected-before-routing.yaml
  - tools/oracle/cases/helpers/prometheus-deployment/failure-exception-status.yaml
  - tools/oracle/cases/helpers/prometheus-deployment/failure-metadata-fallbacks.yaml
  - tools/oracle/cases/helpers/prometheus-deployment/fallback-events.yaml
  - tools/oracle/cases/helpers/prometheus-deployment/success-write-order.yaml
  - tools/oracle/cases/helpers/prometheus-deployment/success-latency-choice.yaml

deviations:
  - what: Timestamps are one typed instant, and the latency math cannot fail on a mix of naive and timezone-aware datetimes.
    why: Python only fails there because datetimes carry two kinds; the typed payload from B254 has one, as B3878 also records.
  - what: A collector or label error comes back as PrometheusDeploymentError where LiteLLM raises, and the failure and success functions catch it and log, as LiteLLM's catch-all does.
    why: Errors are typed values; the visible result (the request is unaffected, later writes skipped) is the same.
  - what: A remaining-requests or remaining-tokens header that is a numeric string is parsed as a number and set; any other string is the logged failure.
    why: prometheus_client converts the value with float(), so "10" works in LiteLLM; the typed payload keeps header values as JSON values.
  - what: The router view and the metadata bucket come in as arguments, not from proxy_server globals.
    why: Dependencies come in through constructors and module-level state is forbidden.

out_of_scope:
  - "async_log_success_event orchestration, the order of its calls, the invalid-key skip around the whole hook and the construction of UserAPIKeyLabelValues from the payload: B111 owns them."
  - "async_log_failure_event, async_post_call_failure_hook and the proxy failure counters: B3880 owns the label helpers and B111 the hooks. This task only covers set_llm_deployment_failure_metrics."
  - "_set_deployment_tpm_rpm_limit_metrics and _async_set_router_remaining_metrics: B3879. set_overhead_with_guardrails_metric and record_guardrail_metrics: B3878."
  - "extract_status_code, should_skip_metrics_for_invalid_key, extract_deployment_failure_label_values, get_exception_class_name, bounded_requested_model_label: B3880."
  - "get_labels_for_metric, the collectors and _ExcludedLabelMetric: B3874. Registration of every metric used here: B3875. inc_labeled_counter and the end-user series cap: B3876."
  - "track_provider_remaining_budget and _safe_get_remaining_budget: B3882. Budget gauges and their refresh: B3882, B3883 and B3884."
  - "record_managed_file_size, record_managed_batch_duration, record_managed_file_created, record_managed_file_deleted, record_check_batch_cost_run and record_check_batch_cost_error: no caller at the pin (only tests call them), so they are not built and their collectors stay registered by B3875 with no writer."
  - "Callers of the state setters and counters in router_utils/cooldown_callbacks.py (B308), router_utils/fallback_event_handlers.py (B309), litellm_logging.py _handle_callback_failure and the batch executor: they call this module's functions."
  - "get_metadata_variable_name_from_kwargs and get_litellm_metadata_from_kwargs: B206. get_standard_logging_metadata: B253. Payload types and hidden_params: B254."

pitfalls:
  - "The failure exception_status is built with str(), so a missing status_code gives the text 'None', and when there is no code either it stays 'None' instead of being empty."
  - "A rejected-before-routing failure puts the kwargs model in requested_model and leaves litellm_model_name, model_id, api_base and api_provider as empty strings, not None, and sets no outage state."
  - "The failure label identity falls through falsy values (or), so an empty string from the B3880 result moves on to the payload metadata."
  - "The overhead and remaining gauge checks are truthiness checks, so an overhead of 0 or a remaining value of 0 records nothing."
  - "A zero-length first-token time is falsy in LiteLLM, so a streaming request with completion_start_time equal to start_time uses the response time."
  - "kwargs stream is compared with true exactly; a missing flag or null keeps the response time."
  - "set_overhead_with_guardrails_metric (B3878) is called even when the plain overhead histogram was skipped."
  - "The success path catches with an error-level log and the failure path with a debug log; swapping them changes what operators see."
  - "increment_deployment_cooled_down passes positional values that pair with the metric's full label list, so a prometheus_metrics_config include list for that metric changes the pairing exactly as in LiteLLM; keep the zip with the original names and drop only the excluded ones."
  - "Both fallback events build a fresh label context from their own values; the requested_model there is bounded with router_originated = true, so an unknown group name passes through unchanged."
  - "The success enum values already carry model_group, so the B3879 call reads it from there and not from the payload."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
