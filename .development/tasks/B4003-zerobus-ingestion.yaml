    - Cargo.toml
    - crates/betterlite-logging/src/zerobus/client.rs
    - crates/betterlite-logging/src/zerobus/row.rs
    - crates/betterlite-logging/fuzz/Cargo.toml
    - crates/betterlite-logging/fuzz/fuzz_targets/zerobus_token_response.rs
    - crates/betterlite-logging/fuzz/corpus/zerobus_token_response/**
    - crates/betterlite-logging/src/zerobus/client/**
    - crates/betterlite-logging/src/zerobus/row/**
  lint_tables: false
