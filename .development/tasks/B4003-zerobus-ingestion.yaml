id: B4003
title: Shape Zerobus rows and authenticate table ingestion
description: >-
  Implement the fixed trace-row projection from StandardLoggingPayload to Delta table rows and the table-scoped Zerobus OAuth/ingest client.
  The client mints and caches an OAuth token for each table, using 60-second leeway to refresh before expiry, and publishes row batches with retryable and permanent failure classification.
  The row projection maps StandardLoggingPayload fields to Delta TRACE_TABLE_COLUMNS with fixed scalar types and VARIANT-encoded nested objects.

  Implement ZerobusIngestClient with zero-cost async token locking and status-code-based retryability: token requests with 401 are permanent, ingest requests with 401 discard the cached token and are retryable, and ingest requests with 408/429/500/502/503/504 retry; other errors are permanent unless transport failures occur.
  Preserve timeout behavior by letting asyncio.Lock, httpx timeouts and litellm.Timeout propagate; no artificial retries, only status classification.
  Map nonpositive timestamps to null and positive seconds to epoch microseconds; reject booleans as numbers but accept them as the stream and cache_hit fields.
  Encode nested fields (messages, response, metadata, etc.) as JSON strings via safe_dumps for VARIANT columns; monetary scalars (response_cost, saved_cache_cost) use Decimal internally.
  Authorization details grant catalog/schema use plus table SELECT/MODIFY per Databricks documentation.
  Owned types: ZerobusInitParams, ZerobusConnection, ZerobusAccessToken, ZerobusIngestFailure and RETRYABLE_INGEST_STATUS_CODES constant.
scope:
