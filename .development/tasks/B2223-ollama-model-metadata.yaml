checks:
  optional:
  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/ollama_model_metadata.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/ollama_model_metadata*")"
      && grep -lq 'ollama_model_metadata' tools/oracle/fuzz/corpus/helper_case/ollama_model_metadata* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_ollama_model_metadata$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-configured-origin-auth
    why: 'Base chooses explicit truthy, OLLAMA_API_BASE, http://localhost:11434. Strip trailing slashes then one
      suffix in order /api/generate, /api/chat, /api/embed, /api/embeddings, /api/show, /api/tags. Key chooses explicit
      truthy, raw OLLAMA_API_KEY environment, global api_key, global openai_key, then secret-manager OLLAMA_API_KEY.
      With an explicitly supplied base (even empty) and no truthy explicit key, suppress all ambient auth. Only
      a truthy key sends Authorization: Bearer {key}.'
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::ollama_model_metadata_cases::case_[0-9]+_configured_origin_auth$/)'
  - id: case-static-catalog-first
    why: Remove one ollama/ or ollama_chat/ prefix. If any of original, stripped, ollama/stripped or ollama_chat/stripped
      matches a catalog key case-insensitively, get_model_info returns None without HTTP, deferring to static metadata.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::ollama_model_metadata_cases::case_[0-9]+_static_catalog_first$/)'
  - id: case-runtime-model-query
    why: 'POST {server_base}/api/show with JSON {name: stripped_model}. Transport and raise_for_status failures
      log OllamaError: Could not get model info. and return key=stripped, provider=ollama, mode=chat, zero token
      prices, max_tokens/max_input_tokens/max_output_tokens=None, with no supports_function_calling field.'
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::ollama_model_metadata_cases::case_[0-9]+_runtime_model_query$/)'
  - id: case-runtime-model-fields
    why: After a successful HTTP status, decode JSON outside the transport catch; invalid JSON or malformed model_info
      therefore propagates to the outer resolver warning/fallback. Select the first insertion-ordered model_info
      key containing context_length without numeric validation, and copy its value to all three token limits. supports_function_calling
      is whether lower-case str(template or empty string) contains tools; return explicit False when absent. Prices
      remain zero.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::ollama_model_metadata_cases::case_[0-9]+_runtime_model_fields$/)'
  - id: config-ollama-api-key
    why: OLLAMA_API_KEY lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::ollama_model_metadata_config_cases::case_[0-9]+_loads_ollama_api_key$/)'
  - id: config-ollama-api-base
    why: OLLAMA_API_BASE lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::ollama_model_metadata_config_cases::case_[0-9]+_loads_ollama_api_base$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::ollama_model_metadata_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::ollama_model_metadata_secret_safe_failure$/)'
  - id: parser-corpus
    why: Outside bytes lack replay through the actual decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-models/fuzz/corpus/ollama_model_reply)"
      && grep -q 'decode_ollama_model_reply' crates/betterlite-models/fuzz/fuzz_targets/ollama_model_reply.rs &&
      cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::replays_the_ollama_model_reply_corpus$/)'
