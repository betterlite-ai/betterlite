id: B2223
title: Ollama runtime model metadata
description: >-
  Provide the configured Ollama model-info protocol below the shared catalog resolver and self-hosted provider.
  Use injected transport and config; never use a request-supplied URL as an outbound authority.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/ollama/common_utils.py:
  get_api_key L55-L69; get_api_base L71-L76; get_server_api_base L78-L91; _strip_ollama_model_prefix L136-L140;
  _is_static_ollama_model L142-L154; _supports_function_calling L156-L159; _get_max_tokens L161-L168; get_runtime_model_info
  L170-L217; get_model_info L219-L227.


  Named case contracts: configured_origin_auth: Base chooses explicit truthy, OLLAMA_API_BASE, http://localhost:11434.
  Strip trailing slashes then one suffix in order /api/generate, /api/chat, /api/embed, /api/embeddings, /api/show,
  /api/tags. Key chooses explicit truthy, raw OLLAMA_API_KEY environment, global api_key, global openai_key, then
  secret-manager OLLAMA_API_KEY. With an explicitly supplied base (even empty) and no truthy explicit key, suppress
  all ambient auth. Only a truthy key sends Authorization: Bearer {key}. static_catalog_first: Remove one ollama/
  or ollama_chat/ prefix. If any of original, stripped, ollama/stripped or ollama_chat/stripped matches a catalog
  key case-insensitively, get_model_info returns None without HTTP, deferring to static metadata. runtime_model_query:
  POST {server_base}/api/show with JSON {name: stripped_model}. Transport and raise_for_status failures log OllamaError:
  Could not get model info. and return key=stripped, provider=ollama, mode=chat, zero token prices, max_tokens/max_input_tokens/max_output_tokens=None,
  with no supports_function_calling field. runtime_model_fields: After a successful HTTP status, decode JSON outside
  the transport catch; invalid JSON or malformed model_info therefore propagates to the outer resolver warning/fallback.
  Select the first insertion-ordered model_info key containing context_length without numeric validation, and copy
  its value to all three token limits. supports_function_calling is whether lower-case str(template or empty string)
  contains tools; return explicit False when absent. Prices remain zero.


  Load OLLAMA_API_KEY, OLLAMA_API_BASE through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest ollama_model_metadata_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  OLLAMA_API_KEY and OLLAMA_API_BASE are absent by default (None); shared global api_key/openai_key loaders stay
  B500. The explicit-base ambient-auth suppression applies even when base normalization later falls back to the
  environment/default.


  Write standalone Rust test ollama_model_metadata_credential_identity_isolation in betterlite-models: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test ollama_model_metadata_secret_safe_failure in betterlite-models: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Outside-byte boundary: decode_ollama_model_reply consumes bounded upstream JSON bytes after a successful /api/show
  response in crates/betterlite-models/src/ollama_model_metadata.rs or its scoped child module. Use that production
  decoder from the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-models/fuzz/fuzz_targets/ollama_model_reply.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_ollama_model_reply_corpus
  that checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Implement crates/betterlite-models/src/ollama_model_metadata.rs with adjacent tests under ollama_model_metadata/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function ollama_model_metadata_cases in betterlite-models with these exact named cases (one per oracle
  file): configured_origin_auth, static_catalog_first, runtime_model_query, runtime_model_fields. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/ollama_model_metadata* using HelperCase: kind:
  helper and the externally tagged ollama_model_metadata variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_ollama_model_metadata that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 112 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 195 production lines, 215 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 65 parser target/replay lines, 45 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 660 planned, 675 maximum changed lines.
