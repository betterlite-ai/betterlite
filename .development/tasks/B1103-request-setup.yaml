id: B1103
title: Authenticated request preparation
description: >-
  Implement add_litellm_data_to_request as a native preparation pipeline over typed request, principal, deployment
  and logging inputs. Call the below helper owners in the pinned order; no route rebuilds this function or imports
  proxy_server globals.


  Compose B1137 RequestIntake (sanitized data, selected metadata slot, forwarding and safe header views, principal
  update), then apply key/team/project metadata, policy and aliases in L2340-L2580 order. This extraction passes
  typed state forward; no preparation stage calls its parent.


  Install this preparation stage in the existing B004 chat HTTP pipeline via server state. Its HTTP oracle cases
  use POST /v1/chat/completions with configured mock provider and seeded key/team facts; no test-only route is added
  and no Python adapter invokes add_litellm_data_to_request directly.


  Implement crates/betterlite-server/src/api/request_setup.rs, crates/betterlite-core/src/api/request_setup.rs.
  Use RequestSetupInput and RequestSetupResult with typed nested records; inject only the clock, repositories, transports
  and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient
  environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions team_project_metadata_order, alias_after_policy, credential_override_after_ff29
  under api::request_setup::tests. Each named function drives production code and asserts its case result; use named
  rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): general_settings.use_x_forwarded_for
  defaults to None. No environment reads occur outside betterlite-config. Test api::request_setup::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/litellm_pre_call_utils.py: add_litellm_data_to_request (L2340-L2580). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 160 owned nonblank/non-comment/non-docstring Python lines (160 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 180 implementation,
  58 behavior tests, 36 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  38 wiring; 345 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B732 (Typed authentication principals
  and grant resolution), B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B1100 (Shared
  request body decoding), B1102 (Request model and destination policy), B1104 (Request headers and tracing), B1105
  (Untrusted request controls), B1106 (Principal metadata and tags), B1107 (Team model aliases and credentials),
  B1108 (Request guardrail selection), B1109 (Request setup options and session policy), B1137 (Request intake and
  safe snapshots), B002 (Load LiteLLM config.yaml into typed config), B004 (OpenAI chat completions without streaming),
  B855 (Authenticated request admission and budget handoff), B1139 (Stateful HTTP oracle scenarios). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
