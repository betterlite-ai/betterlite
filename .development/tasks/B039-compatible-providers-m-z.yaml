dod:
  - text: Maritalk, Nadir and OVHCloud dispatch with their own key and base precedence, forwarded fields and hooks.
    proof: [compat-m-z-tests, compat-m-z-settings, compat-m-z-http, oracle]
  - text: Nebius, Wandb, SambaNova and OVHCloud embeddings use their own key, base and handler.
    proof: [compat-m-z-tests, compat-m-z-settings, compat-m-z-http, oracle]
  - text: M to Z hosts select their own leaves through executable dispatch and preserve auth, error and upstream contracts.
    proof: [compat-m-z-tests, compat-m-z-http, oracle]
checks:
  optional: []
  commands:
    - id: compat-m-z-tests
      why: Dispatch tests must reach each leaf and capture hook order and forwarded client arguments
      run: cargo nextest run --locked -p betterlite-provider -p betterlite-core --no-tests=fail -E 'test(/^compatible_providers_m_z::/)'
    - id: compat-m-z-settings
      why: Main-dispatch globals and env aliases need loader coverage beyond provider config identity methods
      run: cargo nextest run --locked -p betterlite-config --test compatible_providers_m_z --no-tests=fail
    - id: compat-m-z-http
      why: Exercise booted gateways with fresh provider scenarios, never only a selector helper
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/compatible-m-z)" && cargo run --locked -p betterlite-oracle -- tools/oracle/cases/providers/compatible-m-z
oracle_cases:
  - tools/oracle/cases/providers/compatible-m-z/small-host-chat-policies.yaml
  - tools/oracle/cases/providers/compatible-m-z/maritalk-key-and-base.yaml
  - tools/oracle/cases/providers/compatible-m-z/nadir-cost-and-headers.yaml
  - tools/oracle/cases/providers/compatible-m-z/ovhcloud-chat-and-stream.yaml
  - tools/oracle/cases/providers/compatible-m-z/moonshot-tool-choice-and-reasoning.yaml
  - tools/oracle/cases/providers/compatible-m-z/sambanova-chat-and-embedding.yaml
  - tools/oracle/cases/providers/compatible-m-z/nebius-wandb-embeddings.yaml
  - tools/oracle/cases/providers/compatible-m-z/ovhcloud-embedding-and-transcription.yaml
  - tools/oracle/cases/providers/compatible-m-z/scaleway-transcription.yaml
  - tools/oracle/cases/providers/compatible-m-z/sail-chat-and-responses.yaml
  - tools/oracle/cases/providers/compatible-m-z/auth-errors-and-upstream-failures.yaml
deviations: []
out_of_scope:
  - B6410 to B6414 own the leaf source for the M to Z providers. B038 owns the A to L dispatchers, the JSON chat execution and the compatible_providers module this task extends.
  - B210 and B211 own the identity defaults, B2230 the chat selector, B5360 the media selector and B5363 the embedding optional params.
  - Other main.py functions keep the callable owners recorded by B500. The three dispatchers and four embedding branches named here are the only main.py bodies owned by this task.
  - B004, B006, B202, B203 and B1428 keep route registration, wire parsing and the OpenAI-like chat execution. This task supplies operation bindings only.
  - The Meta Muse realtime config (B6414) is reached by the realtime services under B1004, not by this task.
pitfalls:
  - Nadir runs post_call even for async and stream results, and OVHCloud and Maritalk never do.
  - OVHCloud chat reads litellm.ovhcloud_key but OVHCloud embedding does not.
  - Nebius' embedding default base has no scheme and must stay as written.
  - Nadir forwards litellm.headers when the context has none, and OVHCloud forwards only the context headers.
review_level: security
budget:
  max_changed_lines: 600
  max_new_expects: 0
