deviations:
  - what: The server span starts inside the root path, admission control, size limit, gzip, security header and Redis batch layers, so a 413 from the size limit or a request refused by admission control has no SERVER span.
    why: Those layers are applied in server.rs outside router(), and app::wrap is the outermost hook an area part has. LiteLLM's FastAPIInstrumentor wraps the whole middleware stack.
  - what: The SERVER span name and http.route use the request path, not the route template, for routes outside the sixteen passthrough prefixes.
    why: axum resolves the matched route inside the router, after an outer layer has to name the span.
  - what: The admin UI is read from the ui folder next to the betterlite executable or LITELLM_UI_PATH, not from a folder inside the Python package.
    why: betterlite ships no packaged UI build; with no valid folder nothing is mounted, as LiteLLM does when its folder is missing.
  - what: A panic is the only failure the outer 500 handler catches; a route error that is not a ProxyFailure keeps the response its route built.
    why: Rust handlers return responses instead of raising, so only a panic reaches the outermost layer unhandled.
out_of_scope:
  - "The handlers, CORS settings and UI folder logic themselves: B8591. ProxyException: B8410. The span policy and passthrough name: B8250. The request root slot: B3847. The metrics middleware: B3889. The accumulator and flush_gateway_requests: B3102. The release layer: B8270, its releaser: B8481. PrometheusAuthMiddleware and metrics_router: B3886."
  - "The root path, admission control, size limit, gzip, security header and Redis batch layers: B4200, B022, B122 and B8295, installed in server.rs. The periodic gateway request flush: B8372. The final drain at shutdown: B8613's stop. The Shared fields gateway_requests and budget: B8610."
  - "Public routes, docs pages and the OpenAPI document: B8681. Lens routes: B8682. Health routes and the background health loop: B8540."
pitfalls:
  - axum applies a layer only to routes added before it; wrap runs after mount_public, so the layers cover public routes too, while a layer added in edge::mount would miss them.
  - CORS must sit outside the auth layers, otherwise a browser preflight without a key gets 401 and the admin UI cannot call the API.
  - Billable metrics sits inside the budget release layer and outside Prometheus auth and CORS in LiteLLM; a different order would count CORS preflights or miss the budget release.
  - The release layer must sit outside the auth layers; inside them, B1225's write into its slot happens before the slot exists.
  - /metrics merged through mount would hit the key layer, so require_auth_for_metrics_endpoint false would still answer 401.
  - With LITELLM_CORS_ORIGINS unset and no credentials variable, credentials are off and the origin header is "*"; any explicit list turns credentials on unless LITELLM_CORS_ALLOW_CREDENTIALS says otherwise.
  - error_map must not touch a 405 a route built itself with a body; only axum's empty router answer becomes the Starlette detail.
  - CatchPanicLayer must sit inside the span layer, or a panicking request leaves its span without the 500 status.
  - Build no second GatewayRequestAccumulator; the sink, B8372's flush job and B8613's shutdown drain must see one instance, or counts recorded between flushes are lost.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
