dod:
  - text: wrap applies error_map, CORS, Prometheus auth, billable metrics, budget release, the panic handler and the server span in that order from the innermost, and mount_public merges /metrics and the UI mounts without a fallback.
    proof: [layers-tests, ui-tests]
  - text: A ProxyFailure, a management problem and axum's empty 405 are answered by B8591's handlers with the request in hand, and other responses pass unchanged.
    proof: [layers-tests, oracle]
  - text: CORS preflight and simple answers match Starlette for the wildcard, listed, refused and credentials settings, also on a 401.
    proof: [layers-tests, oracle]
  - text: /metrics answers through the Prometheus auth layer and B3886's router as LiteLLM does, with and without require_auth_for_metrics_endpoint, and is not mounted when prometheus is not in litellm_settings.callbacks.
    proof: [layers-tests, oracle]
  - text: A panic in a route answers LiteLLM's 500 internal_server_error envelope.
    proof: [layers-tests]
  - text: Billable requests reach the shared gateway request accumulator only with a database, and the release layer gets the shared budget releaser.
    proof: [layers-tests]
  - text: The span layer opens one named SERVER span per request outside the excluded paths only when the OTel V2 gate is on.
    proof: [layers-tests]
  - text: The UI folder is served at /ui, /_next and /litellm-asset-prefix/_next without a key, and nothing is mounted when the folder is invalid.
    proof: [ui-tests]
  - text: The seven edge layer cases and the fourteen /metrics cases moved from B3886 match LiteLLM through the booted proxy.
    proof: [layer-cases, oracle]
checks:
  optional: []
  commands:
    - id: layers-tests
      why: a layer is missing, sits in the wrong order or answers differently from the LiteLLM handler it installs
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::edge::layers::/)'
    - id: ui-tests
      why: the UI static mounts serve the wrong files, need a key or mount a broken folder
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::edge::ui::/)'
    - id: layer-cases
      why: without new case files the oracle proof compares nothing for the installed layers and the metrics endpoint
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/edge/layers tools/oracle/cases/prometheus-scrape)"
