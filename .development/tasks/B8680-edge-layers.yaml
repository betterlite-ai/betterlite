id: B8680
title: Edge layers, the outer error handlers, CORS, the metrics endpoint and the admin UI static mounts
description: >-
  Several finished or planned tasks built a layer, a handler or a job that sits around every route, and none installs it
  on the app: B8591's exception handlers, CORS settings and UI folder setup, B3889's billable request metrics middleware
  (merged, never installed), B8270's budget reservation release layer, B3886's PrometheusAuthMiddleware and /metrics
  router and B8250's server span policy. This task installs them
  in crates/betterlite-server/src/app/edge.rs and its modules app/edge/layers.rs, app/edge/layers/, app/edge/ui.rs and
  app/edge/ui/ (declared by the skeleton), in the order LiteLLM's proxy applies them. It edits no other file of another
  area, and never routes.rs, server.rs or app.rs.


  The order in LiteLLM. Starlette builds its stack as ServerErrorMiddleware (the `Exception` handler,
  otel_unhandled_exception_handler) outside everything, then the user middleware with the last added outermost, then
  ExceptionMiddleware (the ProxyException, HTTPException, ManagementProblem and RequestValidationError handlers) right
  around the routes. proxy_server.py adds CORSMiddleware first (L2430-L2437), then PrometheusAuthMiddleware,
  BillableRequestMetricsMiddleware, BudgetReservationReleaseMiddleware, RedisRequestBatchMiddleware,
  InFlightRequestsMiddleware, SecurityHeadersMiddleware and GZipBufferedResponseMiddleware (L2439-L2474), and later
  RequestSizeLimitMiddleware, AdmissionControlMiddleware and the root path middleware (L20014-L20039).
  instrument_fastapi_app (L1744-L1746) wraps the whole stack in the OpenTelemetry server middleware. In betterlite,
  server.rs wraps router() in B4200's root path layer and B122's request_stack (size limit, gzip, security headers, Redis
  batch), and router() calls `app::wrap` last, so everything edge::wrap adds sits inside B122's Redis batch layer and
  outside the auth layers and every route. That matches LiteLLM for every layer below except the server span (see
  deviations).


  `wrap(router, state)` in app/edge.rs applies, from the innermost to the outermost, so each later `.layer` call wraps
  the earlier ones:

  1. `layers::error_map`, the ExceptionMiddleware place. A middleware fn that keeps the request's method, path and
  headers, runs the inner service and rewrites three kinds of answer. A response whose extensions hold a
  `layers::error_map::ProxyFailure` (a pub struct holding a B8410 ProxyException; its IntoResponse renders
  `{"error": exception.to_body()}` with the status from the code, or 500 when the code is absent, and puts the exception
  into the extensions) is answered again by B8591's `proxy_exception_response` with the request, so the call id header,
  the access denial log, the span close and the OTLP answer for ingest requests all apply. A response holding B8591's
  management problem is answered by `management_problem_response`. An empty-bodied 405 that axum's router produced (no
  content type, the `allow` header set) becomes B8591's `http_exception_response` for status 405 and detail
  "Method Not Allowed" with the same `allow` header, which is Starlette's `{"detail": "Method Not Allowed"}` answer.
  Every other response passes unchanged.

  2. CORS. `cors_config(LITELLM_CORS_ORIGINS, LITELLM_CORS_ALLOW_CREDENTIALS)` from B8591 with both values read from the
  process environment once in wrap, then B8591's `cors_layer`. Starlette answers a preflight (OPTIONS with Origin and
  Access-Control-Request-Method) itself, before routing and auth, with 200, body "OK", content type
  text/plain; charset=utf-8, access-control-allow-methods "DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT",
  access-control-max-age "600", the requested headers echoed in access-control-allow-headers, and 400 "Disallowed CORS
  origin" (also "Disallowed CORS method" and "Disallowed CORS headers" joined by ", ") for a refused origin. On a simple
  request it adds access-control-allow-origin ("*" for the wildcard without credentials, else the request's Origin with
  vary: Origin), access-control-allow-credentials "true" when on, and access-control-expose-headers with
  LITELLM_UI_ALLOW_HEADERS. Run the cases below against B8591's cors_layer; where tower-http's CorsLayer answers a
  preflight differently (it sends an empty body and no max-age by default), write the preflight answer in
  layers/cors.rs so the cases match, and keep B8591's cors_config as the only source of the settings.

  3. Prometheus auth. B3886's PrometheusAuthMiddleware (crates/betterlite-server/src/prometheus_auth_middleware.rs),
  built with the settings it reads (require_auth_for_metrics_endpoint, default true) and B052's virtual key auth from
  the server state, exactly as B3886's constructor asks. It acts only on /metrics and paths under /metrics/.

  4. Billable request metrics. `middleware::from_fn_with_state(Arc<BillableRequestMetrics>, record_billable_request)`
  from B3889 (crates/betterlite-server/src/middleware/billable_request_metrics.rs on main). The sink factory returns a
  `layers::billable::AccumulatorSink` over `state.shared.gateway_requests` (B3102's GatewayRequestAccumulator, the one
  instance B8372's periodic flush job and B8613's shutdown drain use) when `state.shared.db` is Some, and None otherwise,
  as LiteLLM's `sink_factory=lambda: gateway_request_accumulator if prisma_client is not None else None` (L2468) does.
  AccumulatorSink implements B3889's GatewayRequestSink by calling the accumulator's record with the category, route and
  status code, and maps the accumulator's error into GatewayRequestSinkError::Failed. The recorder factory is None: the
  enterprise billing recorder is not built (B3889's deviation).

  5. Budget reservation release. B8270's release layer (crates/betterlite-server/src/middleware/budget_release.rs) with
  the ReservationReleaser that `state.shared.budget` (B8481's BudgetServices) holds; read budget_services.rs for the
  accessor. L2470-L2471 add it just before RedisRequestBatchMiddleware, so it sits directly inside B122's Redis batch
  layer and outside billable metrics. It must stay outside the auth layers, because B1225 writes the reservation into
  the slot this layer creates for the request.

  6. The outer 500 handler. tower-http's CatchPanicLayer with a custom handler that returns B8591's
  `unhandled_error_response` for the panic: 500 {"error": {"message": "Internal server error", "type":
  "internal_server_error"}}, the "Unhandled exception in request: <type>" log with the panic message as the type text,
  and the span closed with 500. B789 and every other route rely on this envelope for unexpected failures. The
  database-unavailable branch of unhandled_error_response applies to errors, not panics, so it stays in B8591's function
  for routes that call it.

  7. Server span, outermost of wrap. `ServerSpanPolicy::from_gate(is_otel_v2_enabled(), env)` from B8250 and B3842, read
  once in wrap; None installs nothing, and an invalid OTEL_PYTHON_FASTAPI_EXCLUDED_URLS entry logs the error at debug
  and installs nothing, as instrument_fastapi_app's outer except does. With a policy, `layers::server_span` opens one
  SERVER span per HTTP request whose path is not excluded, through the global tracer provider the proxy publishes after
  config load. It extracts the inbound traceparent and tracestate with the global propagator as the parent context,
  names the span "{METHOD} {path}", sets http.request.method, url.path and http.route, applies
  `passthrough_span_name(method, path)` (name and http.route) when the span is recording, anchors the span in B3847's
  request root slot for the request's task so later callbacks parent under it, sets http.response.status_code and an
  error status on a 5xx answer, and ends the span when the response body is finished or dropped. WebSocket upgrades are
  spanned like any GET.


  Public mounts, merged by `mount_public` (none of them has a key dependency in LiteLLM). The /metrics endpoint is B3886's
  `metrics_router(state.shared.prometheus_registry.clone())`, merged only when `prometheus` is in config.sections.callback_settings.callbacks, since LiteLLM mounts it only then (callback_utils.py L407-L410); the Prometheus auth layer above decides whether it needs a key, so it must not sit behind
  the key auth layers. The admin UI static mounts live in app/edge/ui.rs. At mount time, with the env read once: B8591's
  `select_ui_folder(env, packaged)` where packaged is the `ui` folder next to the running executable
  (std::env::current_exe), then B8591's restructure step and root path rewrite with the server root path from B4200's
  request_root_paths section, then three tower-http ServeDir services: `/_next` and `/litellm-asset-prefix/_next` over
  `<folder>/_next`, and `/ui` over the folder with index.html served for a directory (StaticFiles html=True). When the
  chosen folder fails B8591's validate_ui_folder, or any step fails, log it and mount nothing, as LiteLLM's outer try at
  L2125-L2427 swallows the error; those paths then answer the app's 404. Use nest_service, never a router fallback
  (B8610: only pass_through sets the fallback).


  start(state) stays the empty stub. The periodic gateway request flush (update_gateway_requests_job, L10679-L10686)
  is B8372's background job over the same `state.shared.gateway_requests`, and the final drain at shutdown (L1132) is
  B8613's stop.


  Tests, in app/edge/layers/tests.rs (names start with `layers_`) and app/edge/ui/tests.rs (names start with `ui_`),
  build a Router with test routes, call wrap or mount_public and send requests with tower's oneshot: a
  ProxyFailure answer is re-rendered with the call id header when general_settings asks for it; a 405 gets the JSON
  detail and the allow header; any other response passes byte for byte; the preflight and simple CORS answers for unset,
  listed and refused origins; /metrics with require_auth_for_metrics_endpoint on answers 401 without a key and the scrape
  with one, while /v1/models is never touched by the Prometheus layer; a panicking route answers the 500 envelope and the
  server still answers the next request; the sink gets category, route and status once per billable request and is never
  called without a database; a reservation stamped by an inner handler reaches the releaser after the response; the span
  layer with an in-memory exporter makes one SERVER span with the passthrough name for /openai/v1/models, none for
  /health/readiness, a remote parent from a traceparent header and an error status on 500, and none at all when the gate
  is off; the UI mounts serve index.html at /ui/, an asset under /_next and under
  /litellm-asset-prefix/_next from a temp folder, and nothing when the folder has no index.html.


  HTTP oracle cases through the booted proxy, master key set, no database. New, in tools/oracle/cases/edge/layers/:
  cors-preflight-wildcard (OPTIONS /v1/chat/completions, Origin http://client.example, Access-Control-Request-Method
  POST, Access-Control-Request-Headers authorization,content-type, no key), cors-preflight-listed-origin
  (LITELLM_CORS_ORIGINS "http://client.example, http://other.example", same request), cors-preflight-refused-origin
  (same env, Origin http://evil.example), cors-simple-request-headers (GET /health/liveliness with Origin, no key),
  cors-on-unauthorized (POST /v1/chat/completions with Origin and no key: the 401 carries the CORS headers),
  cors-credentials-env-false (LITELLM_CORS_ALLOW_CREDENTIALS "false" with a listed origin) and
  method-not-allowed-detail (GET /v1/embeddings with the master key: 405, the JSON detail and the allow header). Moved
  here from B3886, which could not pass them before this mount: the 14 cases in tools/oracle/cases/prometheus-scrape/
  listed under oracle_cases; write each from B3886's text.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/app/edge.rs
    - crates/betterlite-server/src/app/edge/layers.rs
    - crates/betterlite-server/src/app/edge/layers/**
    - crates/betterlite-server/src/app/edge/ui.rs
    - crates/betterlite-server/src/app/edge/ui/**
    - tools/oracle/cases/edge/layers/**
    - tools/oracle/cases/prometheus-scrape/**
  lint_tables: false
