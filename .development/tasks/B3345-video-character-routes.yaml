id: B3345
title: Video character HTTP routes
description: >-
  Register the two character routes of litellm/proxy/video_endpoints/endpoints.py once, in
  betterlite-server::api::video_character_routes: POST /v1/videos/characters and POST /videos/characters
  (video_create_character), and GET /v1/videos/characters/{character_id} and GET /videos/characters/{character_id}
  (video_get_character). Both sit behind B052 virtual key authentication and carry tags=["videos"]. There is no
  /openai/v1 alias. The routes are mounted from their own route stub, crates/betterlite-server/src/routes/video_character.rs,
  which B1100 registers; this task fills it and leaves routes.rs, state.rs and api.rs as they are. The other
  routes of the same LiteLLM file belong to B3343 and B3344, so register nothing under /videos except these two paths.

  Create reads the form with B1101 (fields and uploads) and B1100 (the cached body). The multipart field video is
  required and name is required: a request without either gets FastAPI's own 422 with a detail list, before any
  processing. The uploaded video becomes a named byte buffer through B082's upload-to-buffer helper (filename kept,
  bytes kept) and is stored as data["video"]. Then: target_model_names is run through B3330's
  extract_model_from_target_model_names; when it returns a name and data has no truthy model, data["model"] is set
  to that name. The provider is the first truthy of: B2400's header reader (custom-llm-provider), B2400's query
  reader (custom_llm_provider), B3330's get_custom_provider_from_data(data) (the body field, then the extra_body
  field), and the literal "openai". The result is written to data["custom_llm_provider"]. B004's
  base_process_llm_request is called with the VideoCreateCharacter core entry (LiteLLM route_type "avideo_create_character"), model=None and the usual
  user_model, user_temperature, user_request_timeout, user_max_tokens, user_api_base and version values. The entry's
  dispatch calls B3341's avideo_create_character; B004 owns the response headers and _handle_llm_api_exception; every
  exception from the call goes through that handler.
  After a successful call, and only when target_model_names gave a name, the response id is encoded: provider is the
  response's _hidden_params custom_llm_provider, else the resolved provider, else "openai"; model id is _hidden_params
  model_id, else data["model"]; B3330's encode_character_id_in_response does the work (B672's codec). Without
  target_model_names the id is returned as the provider sent it.

  Get takes character_id from the path. data starts as {"character_id": <path value>}. B672's
  decode_character_id_with_provider splits the path value into provider, model id and the raw id; when the raw id is
  truthy it replaces data["character_id"] (a plain id decodes to itself). The provider is the first truthy of: header
  custom-llm-provider, query custom_llm_provider, the request body field custom_llm_provider (B2400's body reader,
  which reads the cached body and treats an empty GET body as {}), the provider decoded from the id, and "openai".
  When the decoded model id is truthy and a router exists, B844's resolve_model_name_from_model_id is asked for a
  model name, and a non-empty answer is stored as data["model"]; with no router or no answer, data has no model key.
  B004 is called the same way with the VideoGetCharacter entry (route_type "avideo_get_character"), and its dispatch calls B3341's avideo_get_character. After success, only when the original path
  value began with the literal "character_", the response id is encoded again: provider is the decoded provider, else
  the resolved provider, else "openai"; the model id is the decoded model id. A path value that does not start with
  "character_" gets the provider's response back unchanged. B672's encoder returns an id unchanged when it already
  decodes with a provider, and when provider or id is empty.

  Dispatch. Fill the two core entries B014 registers for these calls: operation/video_create_character.rs with
  dispatch/video_create_character.rs and operation/video_get_character.rs with dispatch/video_get_character.rs. Each
  replaces its NotBuilt stub and stub test. Leave operation.rs and dispatch.rs as they are.

  No new byte decoder: the body and form decoding stay with B1100 and B1101, so there is no fuzz target. Count
  about 130 nonblank, non-comment LiteLLM lines (endpoints.py L516-L722); budget 220 implementation, 260 tests,
  230 HTTP fixtures and 40 wiring lines. Every HTTP scenario boots both gateways with master_key=sk-test and a
  model_list entry whose api_base is the mock upstream; the multipart case uses the oracle's multipart capture, not
  a helper adapter.

scope:
  paths:
    - crates/betterlite-server/src/api/video_character_routes.rs
    - crates/betterlite-server/src/api/video_character_routes/**
    - crates/betterlite-server/src/routes/video_character.rs
    - crates/betterlite-server/src/routes/video_character/**
    - crates/betterlite-core/src/operation/video_create_character.rs
    - crates/betterlite-core/src/operation/video_create_character/**
    - crates/betterlite-core/src/dispatch/video_create_character.rs
    - crates/betterlite-core/src/dispatch/video_create_character/**
    - crates/betterlite-core/src/operation/video_get_character.rs
    - crates/betterlite-core/src/operation/video_get_character/**
    - crates/betterlite-core/src/dispatch/video_get_character.rs
    - crates/betterlite-core/src/dispatch/video_get_character/**
    - tools/oracle/cases/api/video-character-routes/**
    - tools/oracle/fixtures/video-character-routes/**
    - tools/oracle/helpers/b3345.py
    - tools/oracle/helpers/b3345/**
    - tools/oracle/src/helpers/server/b3345.rs
    - tools/oracle/src/helpers/server/b3345/**
