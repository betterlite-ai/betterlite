  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/image_endpoints/endpoints.py#L45-L64
    why: B082 owns uploadfile_to_bytesio and batch_to_bytesio, which the create route reuses for the video file.

dod:
  - text: >-
      character_route_aliases: POST /v1/videos/characters and POST /videos/characters, each with a multipart video
      file and name=hero and Bearer sk-test, reach one mock upload call each and return 200 with object "character".
      GET /v1/videos/characters/char_1 and GET /videos/characters/char_1 reach one mock fetch each. POST on the get
      path and GET on the create path answer as the other routes' tables do (no handler of this task runs), and
      /openai/v1/videos/characters is 404. Nothing is registered twice.
    proof: [route-tests, oracle]
  - text: >-
      create_form_validation: a create request with no video part, and one with no name field, each get HTTP 422
      with a detail list that names the missing field (loc ["body","video"] or ["body","name"], type "missing"),
      and cause zero upstream calls. A request with both reaches the upstream with the uploaded filename and bytes
      unchanged.
    proof: [route-tests, oracle]
  - text: >-
      create_provider_precedence: with name and video present, header custom-llm-provider=azure beats query
      custom_llm_provider=vertex_ai, which beats form field custom_llm_provider=openai, which beats extra_body
      '{"custom_llm_provider":"anthropic"}'. A form field with an empty value falls through to the next source, and
      with all sources absent the provider is "openai". Each choice is checked on the data that reaches B004
      (data["custom_llm_provider"]).
    proof: [route-tests]
  - text: >-
      create_target_model: target_model_names="m1, m2" with no model sets model to m1; target_model_names="" or
      absent leaves model unset; an explicit non-empty model field stays and is not replaced by the target name.
      With target_model_names set and a deployment with model_info id dep1, the response id is
      "character_" plus the base64 of "litellm:custom_llm_provider:openai;model_id:dep1;character_id:char_abc".
      Without target_model_names the id is the provider's "char_abc".
    proof: [route-tests, oracle]
  - text: >-
      get_id_decoding: a path id made by the encoder for provider openai, model id dep1 and id char_abc sends
      character_id=char_abc upstream, selects provider openai, and sets data["model"] to the router model name for
      dep1; a plain id char_9 is sent as char_9 with provider "openai" and no model key. An undecodable
      "character_!!!" keeps its full text as character_id.
    proof: [route-tests, oracle]
  - text: >-
      get_provider_precedence: header beats query, query beats body field custom_llm_provider (a JSON body on the
      GET), the body beats the provider inside the id, and the id's provider beats the "openai" default. Each case
      sends a character id whose encoded provider differs from the other sources.
    proof: [route-tests, oracle]
  - text: >-
      get_response_encoding: a request for an id starting with "character_" returns the response id encoded again
      with the decoded provider and model id, so the client sees the same id it sent; a request for plain char_9
      returns the provider's id with no encoding. With no router, or a model id the router cannot resolve, the
      request still runs and data has no model key.
    proof: [route-tests, oracle]
  - text: >-
      character_error_envelopes: with no Authorization header and with Bearer sk-wrong, both methods return the
      B052 auth failure (401, error.type auth_error) with zero upstream calls. An upstream 404
      {"error":{"message":"no character"}} on GET and an upstream 400 on create reach the client through B004's
      error mapping with the same status, error type, param and code as LiteLLM, plus x-litellm-call-id.
    proof: [route-tests, oracle]
  - text: The branch adds every HTTP scenario above as new oracle case files.
    proof: [new-cases, oracle]

checks:
  optional: []
  commands:
    - id: route-tests
      why: The two routes and their aliases, form checks, provider order, model choice and id encoding need behavior tests in the server crate.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_character_routes::tests::(character_route_aliases|create_form_validation|create_provider_precedence|create_target_model|get_id_decoding|get_provider_precedence|get_response_encoding|character_error_envelopes)($|::)/)'
    - id: new-cases
      why: Route behavior must be compared through both proxies with newly added HTTP cases.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/video-character-routes)" && test -f tools/oracle/cases/api/video-character-routes/character-route-aliases.yaml && test -f tools/oracle/cases/api/video-character-routes/create-form-validation.yaml && test -f tools/oracle/cases/api/video-character-routes/create-target-model.yaml && test -f tools/oracle/cases/api/video-character-routes/get-id-decoding.yaml && test -f tools/oracle/cases/api/video-character-routes/get-provider-precedence.yaml && test -f tools/oracle/cases/api/video-character-routes/get-response-encoding.yaml && test -f tools/oracle/cases/api/video-character-routes/character-error-envelopes.yaml

oracle_cases:
