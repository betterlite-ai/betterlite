  - tools/oracle/cases/api/video-character-routes/create-form-validation.yaml
  - tools/oracle/cases/api/video-character-routes/create-target-model.yaml
  - tools/oracle/cases/api/video-character-routes/get-id-decoding.yaml
  - tools/oracle/cases/api/video-character-routes/get-provider-precedence.yaml
  - tools/oracle/cases/api/video-character-routes/get-response-encoding.yaml
  - tools/oracle/cases/api/video-character-routes/character-error-envelopes.yaml

deviations:
  - what: >-
      GET /v1/videos/characters and GET /videos/characters answer 405 (the path exists for POST only). LiteLLM
      sends that GET to video_status with the video id "characters".
    why: >-
      axum picks the static path over a parameter path and does not fall back across methods. The id "characters"
      is not a real video id, so no client depends on it. Open question in the notes.
  - what: >-
      GET /v1/videos/characters/content answers from the character route, with character_id "content". LiteLLM
      sends it to video_content with video_id "characters".
    why: axum prefers the static "characters" segment over the {video_id} parameter. The same applies to /videos/characters/content.

out_of_scope:
  - B3341 owns avideo_create_character and avideo_get_character and their call-level defaults; this task supplies data to B004 and fills the two core entries that call them.
  - B3330 owns extract_model_from_target_model_names, get_custom_provider_from_data, encode_character_id_in_response and the CharacterObject record; B672 owns the id codec.
  - B004 owns base_process_llm_request and _handle_llm_api_exception with their error envelopes and headers; B1100 owns _read_request_body; B1101 owns multipart parsing; B2400 owns the three provider readers; B844 owns resolve_model_name_from_model_id; B052 owns authentication.
  - B082 owns uploadfile_to_bytesio and batch_to_bytesio in image_endpoints/endpoints.py.
  - B3343 and B3344 own video_generation, video_list, video_status, video_content and video_remix in the same file; video_edit and video_extension (L725-L923) belong to B6360 and are not built here.

pitfalls:
  - The get route reads the provider from the request body before the provider in the id, but the create route has no body reader of its own and takes the form field through get_custom_provider_from_data; do not use one order for both.
  - Create encodes the response id only when target_model_names gave a name, but get encodes whenever the path id starts with "character_"; a "character_" prefix test on the response id would be wrong.
  - data["character_id"] is replaced by the decoded id only when that id is truthy; an empty decode must keep the path value.
  - The provider fallback on create uses the response's _hidden_params custom_llm_provider before the request's provider, so a router deployment on azure encodes azure even when the request resolved to "openai".
  - data["model"] on get is written only when resolve_model_name_from_model_id returns a non-empty name; do not write None or an empty string.
  - base_process_llm_request gets model=None on both routes; the model travels only inside data.
  - A multipart name field and video part are checked by FastAPI-style validation before any hook runs, and the 422 body is a detail list, not an OpenAI error object.

budget:
  max_changed_lines: 1500
  max_new_expects: 0

review_level: standard
