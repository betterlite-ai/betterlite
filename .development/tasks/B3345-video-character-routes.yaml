    why: Both create decorators (/v1/videos/characters, /videos/characters), the File and Form signature, the model and provider steps, and the id encoding after the call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/video_endpoints/endpoints.py#L619-L722
    why: Both get decorators, the id decode, the provider order that puts the request body before the id, the router model lookup and the re-encode on the character_ prefix.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/video_endpoints/utils.py#L8-L66
