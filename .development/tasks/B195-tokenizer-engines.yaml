id: B195
title: Offline tokenizer engines and assets
description: >-
  Create betterlite-tokenizer with injected immutable tokenizer engines and bounded encode/decode/count APIs, loading
  the pinned bundled assets offline. Cover cl100k_base, o200k_base and p50k_base (cache name ec7223a39ce59f226a68acc30dc1af2788490e15,
  50280 ranks) plus the Anthropic Hugging Face tokenizer JSON, and expose an internal typed local-bytes constructor
  for tests; model_info.custom_tokenizer remains unsupported and fails startup until Max decides. Compare kitoken's
  typed-error Tiktoken/Hugging Face converters with tiktoken-rs and tokenizers; prefer kitoken if its oracle conformance
  passes, retaining concrete conversion/encode/decode error sources. Do not adopt anyhow or boxed-error APIs, mutate
  global TIKTOKEN_CACHE_DIR, fetch a model from a request name, or silently fall back when a configured custom asset
  is invalid. Copy assets byte-for-byte into fixtures, store immutable instances in a bounded constructor-owned
  cache, cap text/asset bytes and token output, and run CPU-heavy work through a bounded owned blocking facility.
  Add tokenizer_engine helper cases forcing LiteLLM's Python tokenizer backend, and tokenizer_asset plus tokenizer_input
  fuzz targets.  Seed B171's shared helper_case corpus with every added operation and replay it through the common
  typed parser. Resolve CUSTOM_TIKTOKEN_CACHE_DIR through config (default bundled asset directory), without mutating
  global TIKTOKEN_CACHE_DIR. Resolve TOKEN_COUNTER_MAX_CONCURRENT_COUNTS with default 4 and range 1-256; malformed/out-of-range
  values warn and use 4. Force LITELLM_RUST=false and call rust_bridge/tokenizer.py _python_encoding/PythonHuggingFaceTokenizer
  for Python oracle output; tokenizer.py 38-217 is the Rust codec wrapper, not the Python backend. No catalog dependency
  is needed for named engines. Write the behavior rstest functions b195_tokenizer_engine_tests_behavior in adjacent
  tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have separate
  names. Register helper operations tokenizer_engine in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed. Budget 250 engine/cache, 100 adapters,
  220 tests, 100 fuzz/replay and 100 config/wiring (770 total). Own token_counter.py offload limiter helpers 343-361
  and utils.py backend/selection 2376-2470 only for already packaged engines; undecided remote/custom acquisition
  is excluded.
scope:
  paths:
  - Cargo.toml
  - deny.toml
  - crates/betterlite-tokenizer/**
  - crates/betterlite-config/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/tokenizer-engine/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/tokenizer.py#L38-L217
  why: Rust-codec OpenAIEncoding interface; do not use this as the Python oracle implementation.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/tokenizer.py#L221-L388
  why: Hugging Face wrapper and special-token handling.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/default_encoding.py#L1-L52
  why: Bundled offline cache and explicit custom directory.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2376-L2470
  why: Tokenizer selection helper.
- url: https://docs.rs/kitoken/latest/kitoken/convert/index.html
  why: Existing converters for both asset formats.
- url: https://docs.rs/kitoken/latest/kitoken/convert/enum.ConversionError.html
  why: Concrete error sources compatible with repository rules.
- url: https://docs.rs/tokenizers/latest/tokenizers/tokenizer/type.Error.html
  why: An erased error boundary must not be adopted without a rules change.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rust_bridge/tokenizer.py#L64-L89
  why: Python tiktoken and packaged Anthropic backend selection.
dod:
- text: >-
    Encode/decode/count outputs match Python for every bundled vocabulary, Unicode, whitespace, special tokens and
    malformed IDs.
  proof:
  - oracle
  - helper-python
- text: All four tokenizer assets match their pinned checksums and startup/counting succeeds with network disabled.
  proof:
  - tokenizer-assets
  - tokenizer-engine-tests
- text: >-
    Custom invalid assets fail explicitly; concurrency, input/output caps and bounded CPU offload prevent unbounded
    allocations or runtime blocking.
  proof:
  - tokenizer-engine-tests
- text: Asset/input/config parsers have nonempty corpus replay.
  proof:
  - tokenizer-asset-corpus
  - tokenizer-input-corpus
  - config-yaml-corpus
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: tokenizer-engine-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/::b195_tokenizer_engine_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: tokenizer-asset-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/tokenizer_asset)"
      && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/tokenizer_asset.rs && test -n "$(ls -A crates/betterlite-tokenizer/fuzz/corpus/tokenizer_asset)"
      && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(replays_the_tokenizer_asset_corpus)'
  - id: tokenizer-input-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/tokenizer_input)"
      && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/tokenizer_input.rs && test -n "$(ls -A crates/betterlite-tokenizer/fuzz/corpus/tokenizer_input)"
      && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(replays_the_tokenizer_input_corpus)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'CUSTOM_TIKTOKEN_CACHE_DIR' crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq 'TOKEN_COUNTER_MAX_CONCURRENT_COUNTS'
      crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: tokenizer-assets
    why: a bundled tokenizer asset differs from the pinned source
    run: 'cd crates/betterlite-tokenizer/fixtures && sha256sum --check --quiet <<''SUMS''

      223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7  9b5ad71b2ce5302211f9c61530b329a4922fc6a4

      446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  fb374d419588a4632f3f557e76b4b70aebbca790

      94b5ca7dff4d00767bc256fdd1b27e5b17361d7b8a5f968547f9f23eb70d2069  ec7223a39ce59f226a68acc30dc1af2788490e15

      c241737df24b4e7f7c9af4fdcee29a0ca903dcb288a8b753bc346a3092911767  anthropic_tokenizer.json

      SUMS'
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'tokenizer_engine' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/tokenizer-engine/cl100k.yaml
- tools/oracle/cases/helpers/tokenizer-engine/o200k.yaml
- tools/oracle/cases/helpers/tokenizer-engine/p50k.yaml
- tools/oracle/cases/helpers/tokenizer-engine/anthropic.yaml
- tools/oracle/cases/helpers/tokenizer-engine/unicode-whitespace.yaml
- tools/oracle/cases/helpers/tokenizer-engine/special-tokens.yaml
- tools/oracle/cases/helpers/tokenizer-engine/decode-bytes.yaml
- tools/oracle/cases/helpers/tokenizer-engine/invalid-id.yaml
- tools/oracle/cases/helpers/tokenizer-engine/custom-local.yaml
deviations:
- what: >-
    Open, waiting for Max: bundle the three model-family Hugging Face tokenizer.json assets at pinned revisions
    after license review, or behave as disable_hf_tokenizer_download=true and use OpenAI tokenizers.
  why: >-
    The pinned helper downloads Xenova/c4ai-command-r-v01-tokenizer, hf-internal-testing/llama-tokenizer and Xenova/llama-3-tokenizer.
    Keep current offline engines and do not implement a selection policy dependent on this choice; model_info.custom_tokenizer
    fails startup until decided.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2376-L2470
out_of_scope:
- Message/tool/image accounting is B196-B197.
- Python mutable tokenizer methods and SDK pretrained-download convenience are B166.
- >-
  Automatic family selection requiring the three missing HF repositories stays blocked by the open decision; supplied
  local bytes are an internal API only, not a new configuration key.
pitfalls:
- >-
  The oracle must force the Python backend and use the same vocabulary bytes, not LiteLLM's optional Rust implementation.
- A library's default model-name lookup may differ from LiteLLM's normalization even when its BPE is correct.
- >-
  Concrete source errors are required; converting a boxed tokenizer error to a string is not a compliant fallback.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
