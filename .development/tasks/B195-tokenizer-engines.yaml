id: B195
title: Tokenizer engines, bundled assets and Hugging Face tokenizers
description: >-
  LiteLLM counts tokens with tiktoken encodings it ships, with the Anthropic tokenizer JSON it ships, and with three tokenizers it downloads from the Hugging Face Hub: Xenova/c4ai-command-r-v01-tokenizer for command-r, hf-internal-testing/llama-tokenizer for llama-2 and replicate models, and Xenova/llama-3-tokenizer for llama-3 (utils.py L2426-L2469). An operator can also name any Hub tokenizer as a custom tokenizer (utils.py L2395-L2400, L2518-L2547). Max decided on 2026-10-31 that betterlite downloads from Hugging Face wherever LiteLLM does, with no deviation. This task builds the engines and the selection in crates/betterlite-tokenizer/src/engine.rs and engine/**, and downloads through B5087's hf_hub_download with B5085's settings and token, so the URLs, cache folder, retries, failures and fallbacks are huggingface_hub's.


  Engines. Compare kitoken, tiktoken-rs and the tokenizers crate. Prefer kitoken when its output matches the oracle, since the tokenizers crate returns Box<dyn Error> and rules.yaml bans boxed errors; keep the library's concrete error as the source of a typed EngineError. Bundle cl100k_base, o200k_base, p50k_base and anthropic_tokenizer.json byte for byte from LiteLLM's tokenizers folder into crates/betterlite-tokenizer/fixtures (default_encoding.py L1-L52); p50k_edit and o200k_harmony reuse those files the way tiktoken's constructors do. r50k_base and gpt2 are not bundled by LiteLLM, so tiktoken fetches them from openaipublic.blob.core.windows.net (read_file_cached): fetch them the same way through B173's client in betterlite-http, with the sha256 check, and keep them in CUSTOM_TIKTOKEN_CACHE_DIR under the sha1 of the URL when that variable is set. Count with disallowed_special empty (utils.py L2472-L2491), decode Hugging Face output with special added tokens stripped (tokenizer.py L378-L388), and run counting through a limiter of TOKEN_COUNTER_MAX_CONCURRENT_COUNTS (token_counter.py L340-L361) on the bounded blocking facility the caller passes in.


  Selection (utils.py L2376-L2469). select(model, custom) returns a huggingface_tokenizer or an openai_tokenizer. With a custom tokenizer (identifier, revision, auth token), download its tokenizer.json through B5087 with the auth token as an explicit token, keep it in an LRU of the same size as _select_custom_tokenizer_helper's, and let a failure reach the caller. Without one: when litellm_settings.disable_hf_tokenizer_download is true, return cl100k_base. Otherwise pick the kind in LiteLLM's order with B193's catalog lists (cohere_models, anthropic_models), load a Hub kind with revision "main" and the implicit token, build the engine from the downloaded bytes, and cache it per kind for the life of the process. Any failure logs at debug "Error selecting tokenizer: {error}" and returns cl100k_base. Also build main.py L9394-L9397's accessor to the default encoding; B196 owns its caller.


  Settings. The config section tokenizer_engines (crates/betterlite-config/src/sections/tokenizer_engines.rs and tokenizer_engines/**) reads litellm_settings.disable_hf_tokenizer_download (bool, default unset), CUSTOM_TIKTOKEN_CACHE_DIR and TOKEN_COUNTER_MAX_CONCURRENT_COUNTS (default 4, range 1 to 256; a bad value logs LiteLLM's warning and uses 4).


  Tests and oracle. engine::tests::engines_follow_litellm covers each bundled encoding, Unicode, whitespace, special tokens, bad ids and the r50k_base fetch against a local server. engine::tests::selection_follows_litellm runs a local Hub on 127.0.0.1 through B5085's endpoint and covers every kind, the disable switch, the cache, a Hub that is down, offline mode with and without a cached file, and a custom tokenizer with and without a token. engine::tests::limits_hold covers the concurrency limiter and the input and output caps. sections::tokenizer_engines::tests::settings_follow_litellm loads every setting. The helper operation tokenizer_engine is already registered; force LITELLM_RUST=false so the oracle uses _python_encoding and PythonHuggingFaceTokenizer (rust_bridge/tokenizer.py L64-L108), and build Hugging Face cases from tokenizer.json bytes with from_str so no case needs the network.
scope:
  paths:
    - crates/betterlite-tokenizer/src/engine.rs
    - crates/betterlite-tokenizer/src/engine/**
    - crates/betterlite-tokenizer/Cargo.toml
    - crates/betterlite-tokenizer/fixtures/**
    - crates/betterlite-tokenizer/fuzz/**
    - crates/betterlite-config/src/sections/tokenizer_engines.rs
    - crates/betterlite-config/src/sections/tokenizer_engines/**
    - "crates/betterlite-config/fuzz/corpus/config_yaml/tokenizer-engines-*"
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/tokenizer/engine.rs
    - tools/oracle/src/helpers/tokenizer/engine/**
    - tools/oracle/helpers/tokenizer_engine.py
    - tools/oracle/helpers/tokenizer_engine/**
    - tools/oracle/cases/helpers/tokenizer-engine/**
    - "tools/oracle/fuzz/corpus/helper_case/tokenizer_engine-*"
    - Cargo.toml
    - Cargo.lock
  lint_tables: false
references:
