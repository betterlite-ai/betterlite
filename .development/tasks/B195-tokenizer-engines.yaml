dod:
  - text: Encode, decode and count match Python for every bundled encoding and for Hugging Face tokenizers built from bytes, with Unicode, whitespace, special tokens and bad ids.
    proof: [engines, oracle, helper-python]
  - text: Hub tokenizers download through hf-hub with B5085's endpoint, cache and token, and fall back to the cache, answer offline, time out and retry where huggingface_hub does.
    proof: [hub-download]
  - text: Selection picks the same tokenizer as LiteLLM for every kind, honors the disable switch, and falls back to cl100k_base where LiteLLM does.
    proof: [selection]
  - text: The bundled assets match their pinned checksums.
    proof: [tokenizer-assets]
  - text: The limiter, input and output caps hold.
    proof: [limits]
  - text: The three settings load as LiteLLM reads them.
    proof: [tokenizer-settings, config-yaml-corpus]
  - text: The asset and input parsers and every added helper operation have committed corpora that replay.
    proof: [tokenizer-asset-corpus, tokenizer-input-corpus, helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: engines
      why: the engine test is missing or an encoding differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::engines_follow_litellm($|::)/)'
    - id: selection
      why: the selection test is missing or a kind, download, cache or fallback differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::selection_follows_litellm($|::)/)'
    - id: hub-download
      why: the hub download test is missing or a URL, token, cache fallback, offline answer, timeout or retry differs from huggingface_hub
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::hub_download_follows_huggingface_hub($|::)/)'
    - id: limits
      why: the limits test is missing or a cap or the limiter does not hold
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::limits_hold($|::)/)'
    - id: tokenizer-settings
      why: the settings test is missing or a setting loads differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::tokenizer_engines::tests::settings_follow_litellm($|::)/)'
    - id: tokenizer-assets
      why: a bundled tokenizer asset differs from the pinned source
      run: 'cd crates/betterlite-tokenizer/fixtures && sha256sum --check --quiet <<''SUMS''

        223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7  9b5ad71b2ce5302211f9c61530b329a4922fc6a4

        446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  fb374d419588a4632f3f557e76b4b70aebbca790

        94b5ca7dff4d00767bc256fdd1b27e5b17361d7b8a5f968547f9f23eb70d2069  ec7223a39ce59f226a68acc30dc1af2788490e15

        c241737df24b4e7f7c9af4fdcee29a0ca903dcb288a8b753bc346a3092911767  anthropic_tokenizer.json

        SUMS'
    - id: tokenizer-asset-corpus
      why: the fuzz target or a new corpus file is missing, or the replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/tokenizer_asset)"
        && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/tokenizer_asset.rs
        && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::replays_the_tokenizer_asset_corpus($|::)/)'
    - id: tokenizer-input-corpus
      why: the fuzz target or a new corpus file is missing, or the replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/tokenizer_input)"
        && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/tokenizer_input.rs
        && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::replays_the_tokenizer_input_corpus($|::)/)'
    - id: config-yaml-corpus
      why: the config corpus lacks a tokenizer-engines seed with the new key, or the replay fails
      run: >-
        git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml | grep -Fq "/tokenizer-engines-"
        && grep -rlq 'disable_hf_tokenizer_download' crates/betterlite-config/fuzz/corpus/config_yaml
        && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: the oracle adapter fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: a tokenizer_engine seed is missing or the helper corpus replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/tokenizer_engine-*")"
        && grep -lq 'tokenizer_engine' tools/oracle/fuzz/corpus/helper_case/tokenizer_engine-*
        && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
