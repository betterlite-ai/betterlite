id: B195
title: Tokenizer engines, bundled assets and Hugging Face tokenizers through hf-hub
description: >-
  LiteLLM counts tokens with tiktoken encodings it ships, with the Anthropic tokenizer JSON it ships, and with three tokenizers it downloads from the Hugging Face Hub: Xenova/c4ai-command-r-v01-tokenizer for command-r, hf-internal-testing/llama-tokenizer for llama-2 and replicate models, and Xenova/llama-3-tokenizer for llama-3 (utils.py L2426-L2469). An operator can also name any Hub tokenizer as a custom tokenizer (utils.py L2395-L2400, L2518-L2547). Max decided on 2026-10-31 that betterlite downloads from Hugging Face wherever LiteLLM does, through crates.io libraries, porting only what they lack. This task builds the engines and the selection in crates/betterlite-tokenizer/src/engine.rs and engine/**, and downloads tokenizer.json through the hf-hub crate (=1.0.0) with B5085's settings and the token from B5085 and B5088.


  Engines. Hugging Face tokenizers and anthropic_tokenizer.json load with the tokenizers crate pinned at =0.23.1, the version in LiteLLM's uv.lock, with default-features = false and features = ["onig"], the regex backend of the Python wheel. Keep its http feature off: it pulls hf-hub 0.4.1, a second hf-hub that multiple-versions = "deny" rejects, so the file comes from this task's hf-hub download and loads with Tokenizer::from_bytes. tokenizers::Error is a Box<dyn Error>; Max allowed it on 2026-10-31 as the #[source] of one typed EngineError variant per operation (load, encode, decode), never turned into a string. For the tiktoken encodings compare kitoken and tiktoken-rs and pick the one whose output matches the oracle, with its concrete error as the source of a typed EngineError. Bundle cl100k_base, o200k_base, p50k_base and anthropic_tokenizer.json byte for byte from LiteLLM's tokenizers folder into crates/betterlite-tokenizer/fixtures (default_encoding.py L1-L52); p50k_edit and o200k_harmony reuse those files the way tiktoken's constructors do. r50k_base and gpt2 are not bundled by LiteLLM, so tiktoken fetches them from openaipublic.blob.core.windows.net (read_file_cached): fetch them the same way through B173's client in betterlite-http, with the sha256 check, and keep them in CUSTOM_TIKTOKEN_CACHE_DIR under the sha1 of the URL when that variable is set. Count with disallowed_special empty (utils.py L2472-L2491), decode Hugging Face output with special added tokens stripped (tokenizer.py L378-L388), and run counting through a limiter of TOKEN_COUNTER_MAX_CONCURRENT_COUNTS (token_counter.py L340-L361) on the bounded blocking facility the caller passes in.


  Hub download (crates/betterlite-tokenizer/src/engine/hub.rs). Build an HFClient with HFClientBuilder: endpoint and cache_dir from B5085's endpoint and hub_cache, and token only when the B5085 and B5088 lookup returns one. Split the repo id with split_id and call model(owner, name).download_file() with filename "tokenizer.json" and the revision. Log B5085's hf_transfer_deprecated warning once when the first client is built. hf-hub lacks three parts of hf_hub_download, so build them around the call. Offline: when B5085's offline is set, pass local_files_only(true), so only the cache answers. Cache fallback: huggingface_hub falls back to the cached file on every Hub HTTP error except RevisionNotFound and RemoteEntryNotFound, on a connection error, a timeout and a metadata error (file_download.py L1818-L1838), while hf-hub falls back only on transient errors; so after any HFError except RevisionNotFound and EntryNotFound, call again with local_files_only(true) and return that file, or the first error when the cache has none. Timeouts: hf-hub sets none. Bound the time until DownloadEvent::Start (it fires after the HEAD) by B5085's etag_timeout and treat its expiry as a timeout for the fallback. When the first error is a timeout, a connection error or status 408, 429, 500, 502, 503 or 504 and the cache has no file, run the call once more bounded by 60 seconds, as _ETAG_RETRY_TIMEOUT does (file_download.py L1166-L1185). After Start, fail with a typed timeout error when no Progress or AggregateProgress event arrives for download_timeout seconds. The settings, the token lookup and the clock come in through the constructor.


  Selection (utils.py L2376-L2469). select(model, custom) returns a huggingface_tokenizer or an openai_tokenizer. With a custom tokenizer (identifier, revision, auth token), download its tokenizer.json with the auth token as an explicit token, keep it in an LRU of the same size as _select_custom_tokenizer_helper's, and let a failure reach the caller. Without one: when litellm_settings.disable_hf_tokenizer_download is true, return cl100k_base. Otherwise pick the kind in LiteLLM's order with B193's catalog lists (cohere_models, anthropic_models), load a Hub kind with revision "main" and the implicit token, build the engine from the downloaded bytes, and cache it per kind for the life of the process. Any failure logs at debug "Error selecting tokenizer: {error}" and returns cl100k_base. Also build main.py L9394-L9397's accessor to the default encoding; B196 owns its caller.


  Settings. The config section tokenizer_engines (crates/betterlite-config/src/sections/tokenizer_engines.rs and tokenizer_engines/**) reads litellm_settings.disable_hf_tokenizer_download (bool, default unset), CUSTOM_TIKTOKEN_CACHE_DIR and TOKEN_COUNTER_MAX_CONCURRENT_COUNTS (default 4, range 1 to 256; a bad value logs LiteLLM's warning and uses 4).


  Dependency policy. hf-hub and tokenizers add about 100 crates. Scope deny.toml and add only what they need, each with a one-line comment: hf-hub, reqwest-middleware, xet-client and xet-runtime as reqwest wrappers on line 72; skips for base64@0.13.1, darling@0.20.11, darling_core@0.20.11, darling_macro@0.20.11 and core-foundation@0.9.4; one-crate MPL-2.0 license exceptions for colored and option-ext (both reached through xet-runtime); and RUSTSEC-2024-0436 (paste is unmaintained, reached through tokenizers) in the advisories ignore list. Use hf-hub's rustls-tls feature so no OpenSSL enters.


  Tests and oracle. engine::tests::engines_follow_litellm covers each bundled encoding, Unicode, whitespace, special tokens, bad ids and the r50k_base fetch against a local server. engine::tests::hub_download_follows_huggingface_hub runs a local Hub on 127.0.0.1 through B5085's endpoint and covers a fresh download, a cached file with the same etag, offline with and without a cached file, a 401, a 404 repo and a 503 with a cached file, a missing revision and a missing file without fallback, a HEAD past etag_timeout, the 60-second retry with no cached file, a stalled body past download_timeout, the token header present and absent, and a custom tokenizer's explicit token. engine::tests::selection_follows_litellm covers every kind, the disable switch, the per-kind cache, a failed download falling back to cl100k_base and a custom tokenizer's failure reaching the caller. engine::tests::limits_hold covers the concurrency limiter and the input and output caps. sections::tokenizer_engines::tests::settings_follow_litellm loads every setting. The helper operation tokenizer_engine is already registered; force LITELLM_RUST=false so the oracle uses _python_encoding and PythonHuggingFaceTokenizer (rust_bridge/tokenizer.py L64-L108), and build Hugging Face cases from tokenizer.json bytes with from_str so no case needs the network.
