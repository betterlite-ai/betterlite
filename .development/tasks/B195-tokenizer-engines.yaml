    why: _select_tokenizer, the custom and default helpers, the disable switch, the kind order and _load_huggingface_tokenizer with the three repos.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2472-L2547
    why: encode, decode, create_pretrained_tokenizer and create_tokenizer.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L1529-L1531
    why: disable_hf_tokenizer_download, unset by default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/default_encoding.py#L1-L52
    why: The bundled tiktoken folder, CUSTOM_TIKTOKEN_CACHE_DIR and the cl100k_base load.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rust_bridge/tokenizer.py#L64-L108
