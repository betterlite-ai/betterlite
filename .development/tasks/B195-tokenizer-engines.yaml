dod:
  - text: Encode, decode and count match Python for every bundled encoding and for Hugging Face tokenizers built from bytes, with Unicode, whitespace, special tokens and bad ids.
    proof: [engines, oracle, helper-python]
  - text: Selection picks the same tokenizer as LiteLLM for every kind, downloads Hub tokenizers through B5087, honors the disable switch, and falls back to cl100k_base where LiteLLM does.
    proof: [selection]
  - text: The bundled assets match their pinned checksums.
    proof: [tokenizer-assets]
  - text: The limiter, input and output caps hold.
    proof: [limits]
  - text: The three settings load as LiteLLM reads them.
    proof: [tokenizer-settings, config-yaml-corpus]
  - text: The asset and input parsers and every added helper operation have committed corpora that replay.
    proof: [tokenizer-asset-corpus, tokenizer-input-corpus, helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: engines
      why: the engine test is missing or an encoding differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::engines_follow_litellm($|::)/)'
    - id: selection
      why: the selection test is missing or a kind, download, cache or fallback differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::selection_follows_litellm($|::)/)'
    - id: limits
      why: the limits test is missing or a cap or the limiter does not hold
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::limits_hold($|::)/)'
    - id: tokenizer-settings
      why: the settings test is missing or a setting loads differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::tokenizer_engines::tests::settings_follow_litellm($|::)/)'
    - id: tokenizer-assets
      why: a bundled tokenizer asset differs from the pinned source
      run: 'cd crates/betterlite-tokenizer/fixtures && sha256sum --check --quiet <<''SUMS''

        223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7  9b5ad71b2ce5302211f9c61530b329a4922fc6a4

        446a9538cb6c348e3516120d7c08b09f57c36495e2acfffe59a5bf8b0cfb1a2d  fb374d419588a4632f3f557e76b4b70aebbca790

        94b5ca7dff4d00767bc256fdd1b27e5b17361d7b8a5f968547f9f23eb70d2069  ec7223a39ce59f226a68acc30dc1af2788490e15

        c241737df24b4e7f7c9af4fdcee29a0ca903dcb288a8b753bc346a3092911767  anthropic_tokenizer.json

        SUMS'
    - id: tokenizer-asset-corpus
      why: the fuzz target or a new corpus file is missing, or the replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/tokenizer_asset)"
        && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/tokenizer_asset.rs
        && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::replays_the_tokenizer_asset_corpus($|::)/)'
    - id: tokenizer-input-corpus
      why: the fuzz target or a new corpus file is missing, or the replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/tokenizer_input)"
        && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/tokenizer_input.rs
        && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^engine::tests::replays_the_tokenizer_input_corpus($|::)/)'
    - id: config-yaml-corpus
      why: the config corpus lacks a tokenizer-engines seed with the new key, or the replay fails
      run: >-
        git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml | grep -Fq "/tokenizer-engines-"
        && grep -rlq 'disable_hf_tokenizer_download' crates/betterlite-config/fuzz/corpus/config_yaml
        && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: the oracle adapter fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: a tokenizer_engine seed is missing or the helper corpus replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/tokenizer_engine-*")"
        && grep -lq 'tokenizer_engine' tools/oracle/fuzz/corpus/helper_case/tokenizer_engine-*
        && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/tokenizer-engine/cl100k.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/o200k.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/p50k.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/anthropic.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/unicode-whitespace.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/special-tokens.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/decode-bytes.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/invalid-id.yaml
  - tools/oracle/cases/helpers/tokenizer-engine/custom-local.yaml
deviations:
  - what: When CUSTOM_TIKTOKEN_CACHE_DIR is unset, a fetched r50k_base or gpt2 file stays in memory for the life of the process, where tiktoken writes it into the tokenizers folder inside LiteLLM's installed package.
    why: >-
      betterlite's bundled assets are compiled into the binary, so there is no package folder to write into. The fetch, the URL and the hash check are the same; only the copy on disk is missing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/default_encoding.py#L20-L30
out_of_scope:
  - Hub settings, the token, requests, the cache download and OAuth belong to B5085, B5086, B5087 and B5088.
  - Message, tool and image accounting belongs to B196 and B197; the encoding name for a model (token_counter.py L663-L690) belongs to B259.
  - The /utils/token_counter handler that reads model_info.custom_tokenizer (proxy_server.py L14024-L14058) calls this task's select but is not built here; its owner is still open.
  - Python's mutable tokenizer methods and the SDK pretrained-download helpers belong to B166.
  - LiteLLM's optional Rust codec (tokenizer.py L38-L217, LITELLM_RUST) is not ported; the Python backend is the reference.
pitfalls:
  - _select_tokenizer_helper checks `disable_hf_tokenizer_download is True`, so only true turns downloads off; false and unset both download.
  - The kind order is cohere, anthropic, llama-2 or replicate, llama-3, so "replicate/meta/llama-3-70b" gets the llama-2 tokenizer.
  - The cohere check reads the model name as given, while the llama checks lowercase it.
  - lru_cache never caches an exception, so a failed Hub download is tried again on the next call; cache only successes.
  - A failed default selection falls back to cl100k_base with a debug log and never reaches the client; only a custom tokenizer's failure does.
  - Name every corpus seed tools/oracle/fuzz/corpus/helper_case/tokenizer_engine-<case>.yaml; the rest of that folder belongs to other tasks.
  - The oracle helper is pre-registered as tokenizer_engine in the tokenizer group; replace the stub Op in tools/oracle/src/helpers/tokenizer/engine.rs and write run in tools/oracle/helpers/tokenizer_engine.py, and leave the registry files alone.
  - A library's own model-name lookup can differ from LiteLLM's selection even when its BPE is right, so select by LiteLLM's rules only.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
