deviations:
  - what: When CUSTOM_TIKTOKEN_CACHE_DIR is unset, a fetched r50k_base or gpt2 file stays in memory for the life of the process, where tiktoken writes it into the tokenizers folder inside LiteLLM's installed package.
    why: >-
      betterlite's bundled assets are compiled into the binary, so there is no package folder to write into. The fetch, the URL and the hash check are the same; only the copy on disk is missing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/default_encoding.py#L20-L30
  - what: Hub requests send hf-hub's user agent, "hf-hub/1.0.0" with HF_HUB_USER_AGENT_ORIGIN appended when set, where huggingface_hub sends its own name, version and Python details.
    why: >-
      Sending another library's name and Python version from a Rust binary would misreport the client to the Hub. The URLs, headers that carry meaning and the token are the same.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/utils/_headers.py#L157-L203
  - what: When the token lookup finds no token, hf-hub runs its own lookup, so an HF_TOKEN made only of whitespace is sent as written and a missing HF_TOKEN_PATH file falls through to {HF_HOME}/token, where huggingface_hub sends no token.
    why: >-
      HFClientBuilder has no way to say "no token"; without one it calls its own resolve_token. Both cases need a broken setup to reach. An upstream option is an open question for Max.
    link: https://docs.rs/hf-hub/1.0.0/hf_hub/struct.HFClientBuilder.html
  - what: HF_HUB_DISABLE_XET is not read. A file the Hub serves through Xet downloads through hf-xet even when the variable is set.
    why: >-
      hf-hub always uses hf-xet when the HEAD answer carries X-Xet-Hash and has no switch to turn it off. The bytes and the cache path are the same.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/constants.py#L343
  - what: HF_HUB_DISABLE_SYMLINKS and HF_HUB_DISABLE_SYMLINKS_WARNING are not read. The cache always links snapshot files to blobs.
    why: >-
      hf-hub has no switch for copies. betterlite ships for Linux and macOS, where symlinks work and huggingface_hub links too unless told otherwise.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/constants.py#L277-L281
  - what: An HF_ENDPOINT mirror that answers the metadata request with an absolute redirect fails the metadata step and falls back to the cache, where huggingface_hub follows a redirect to the same host or a Hub host.
    why: >-
      hf-hub's metadata request follows only relative redirects. The Hub itself redirects relatively, so only such a mirror sees it.
    link: https://github.com/huggingface/hf-hub/issues/163
  - what: A proxy failure falls back to the cache, where huggingface_hub raises ProxyError.
    why: >-
      hf-hub reports a proxy failure as a connection error and the two cannot be told apart.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/file_download.py#L1818-L1820
  - what: hf-hub retries a request up to 5 times with backoff on 408, 429, 500, 502, 503, 504 and connection errors before the cache fallback, where huggingface_hub's first metadata request tries once.
    why: >-
      hf-hub's retry is the same list huggingface_hub uses on its second try. The etag_timeout bound still holds, so a user sees the same fallback, only after more tries.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/utils/_http.py#L451-L456
  - what: A custom tokenizer's failed download reaches the caller with hf-hub's error text, where huggingface_hub raises its own exception message.
    why: >-
      The text comes from a different library. The failure and when it happens are the same.
    link: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/file_download.py#L1925-L1960
out_of_scope:
  - Hub settings and the token lookup belong to B5085, OIDC and OAuth refresh to B5088. The requests, the cache layout, locks, retries and Xet are hf-hub's.
  - HUGGINGFACE_CO_STAGING is read by B5085; this task only uses the endpoint and token path it gives.
  - Message, tool and image accounting belongs to B196 and B197; the encoding name for a model (token_counter.py L663-L690) belongs to B259.
  - The /utils/token_counter handler that reads model_info.custom_tokenizer (proxy_server.py L14024-L14058) calls this task's select but is not built here; its owner is still open.
  - Python's mutable tokenizer methods and the SDK pretrained-download helpers belong to B166.
  - LiteLLM's optional Rust codec (tokenizer.py L38-L217, LITELLM_RUST) is not ported; the Python backend is the reference.
  - Progress bars, telemetry and HF_XET_HIGH_PERFORMANCE tuning are not built.
pitfalls:
  - _select_tokenizer_helper checks `disable_hf_tokenizer_download is True`, so only true turns downloads off; false and unset both download.
  - The kind order is cohere, anthropic, llama-2 or replicate, llama-3, so "replicate/meta/llama-3-70b" gets the llama-2 tokenizer.
  - The cohere check reads the model name as given, while the llama checks lowercase it.
  - lru_cache never caches an exception, so a failed Hub download is tried again on the next call; cache only successes.
  - A failed default selection falls back to cl100k_base with a debug log and never reaches the client; only a custom tokenizer's failure does.
  - huggingface_hub raises RepositoryNotFound, gated and 401 errors as they are when the cache has no file, and wraps the rest in LocalEntryNotFoundError; keep that split in the typed error.
  - Without a token hf-hub reads HF_TOKEN and {HF_HOME}/token from the process env, so the hub test sets HF_HOME to a temp folder and checks that HF_TOKEN is unset before it asserts no Authorization header.
  - The xet crates turn on reqwest's default features (system-proxy, charset, http2) for the whole workspace; check that betterlite-http's clients keep the proxy settings they set.
  - tokenizers with onig builds C code through onig_sys and cc; keep esaxx_fast and progressbar off.
  - Name every corpus seed tools/oracle/fuzz/corpus/helper_case/tokenizer_engine-<case>.yaml; the rest of that folder belongs to other tasks.
  - The oracle helper is pre-registered as tokenizer_engine in the tokenizer group; replace the stub Op in tools/oracle/src/helpers/tokenizer/engine.rs and write run in tools/oracle/helpers/tokenizer_engine.py, and leave the registry files alone.
  - A library's own model-name lookup can differ from LiteLLM's selection even when its BPE is right, so select by LiteLLM's rules only.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
