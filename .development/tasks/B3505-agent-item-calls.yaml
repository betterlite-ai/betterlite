    - crates/betterlite-core/src/api/agents/item.rs
    - crates/betterlite-core/src/api/agents/item/**
    - tools/oracle/helpers/b3505.py
    - tools/oracle/helpers/b3505/**
    - tools/oracle/src/helpers/core_ops/b3505.rs
    - tools/oracle/src/helpers/core_ops/b3505/**
