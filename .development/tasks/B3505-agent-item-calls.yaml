  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/agents/http_handler.py#L292-L444
    why: delete_agent and list_agent_versions HTTP methods that B3505 calls for deletion and version listing.

dod:
  - text: >-
      Sync and async get/delete/list_versions operations match LiteLLM on the HTTP request sent
      upstream (method, path, body, headers) and on typed response.
    proof:
      - oracle
  - text: >-
      Default provider is Gemini; when absent from args or kwargs.custom_llm_provider, all six
      calls use "gemini".
    proof:
      - behavior-tests
  - text: >-
      Agent name is forwarded into the logging object's optional_params dict under the key "name"
      before HTTP delegation.
    proof:
      - behavior-tests
  - text: >-
      All three operations call B3501's _get_agents_api_config and _make_logging_obj with the
      operation call_type (get_agent, delete_agent, list_agent_versions) and name as the
      optional param.
    proof:
      - behavior-tests
  - text: >-
      Exceptions wrap the original error through litellm.exception_type with the agent name
      (not empty string) as the model, the provider and completion/extra kwargs.
    proof:
      - behavior-tests
  - text: >-
      Async variants delegate to their sync counterparts using loop.run_in_executor with
      contextvars.copy_context, passing an operation-specific flag (aget_agent, adelete_agent,
      alist_agent_versions) in kwargs.
    proof:
      - behavior-tests

checks:
  optional: []
  commands:
