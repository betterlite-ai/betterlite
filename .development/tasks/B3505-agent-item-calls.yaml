deviations: []

out_of_scope:
  - B3501 owns provider/logging setup (_get_agents_api_config, _make_logging_obj).
  - B3502 owns get_agent HTTP handler.
  - B3503 owns delete_agent and list_agent_versions HTTP handlers.
  - B185/B186 exception_type construction; this task only calls it.
  - B198 timeout/context propagation; this task forwards kwargs unmodified.
  - Async infrastructure (@client decorator, contextvars, executor) reused from betterlite's own patterns.

pitfalls:
  - >-
    Agent name is the primary operation identifier and must be available before HTTP delegation
    for use in logging and exception construction. Default provider assignment (to "gemini" when
    absent) happens in both async and sync paths through the parameter or kwargs.get pattern,
    ensuring both name and provider are available for these metadata fields.
  - >-
    Agent name is operation metadata, not the model name. Exception construction and logging
    both use the agent name passed to the function, not an empty string or provider name.
    All six operations pass name as the sole optional_param in _make_logging_obj.
  - >-
    Async wrappers use loop.run_in_executor with partial(ctx.run, func) where ctx is
    contextvars.copy_context(). The pattern reuses the existing client decorator lifecycle,
    not reimplemented async/sync wrappers or context copying on the sync side.
  - >-
    The three operation flags (aget_agent, adelete_agent, alist_agent_versions) are popped
    from kwargs before HTTP delegation, not passed downstream. Each async variant checks for
    its flag and routes to either the executor path (if true) or direct return (if coroutine).

review_level: standard
budget:
