id: B3505
title: Retrieve delete and list versions of managed agents
description: >-
  Expose the remaining sync/async named-agent operations, keeping name-based error/log metadata
  and the explicit default provider. Implement aget, get, adelete, delete, alist_versions and
  list_versions entry points. Each pair follows the async-to-sync pattern: the async variant
  calls loop.run_in_executor with a context copy forwarding to its sync counterpart, passing
  an operation-specific flag in kwargs. Both sync and async return typed results from agents.types
  (AgentCreateResponse for get, AgentDeleteResult for delete, AgentVersionsResponse for list_versions).
  Default provider is Gemini when absent from args or kwargs.custom_llm_provider. All three operations
  acquire the agents config through B3501's _get_agents_api_config and build logging metadata
  with operation name (get_agent, delete_agent, list_agent_versions) and name as the optional
  param. Delegate HTTP work to B3502 (get_agent) or B3503 (delete_agent, list_agent_versions).
  Wrap exceptions through litellm.exception_type with the agent name (not empty string) as model,
  provider and original exception. Implement the six functions in crates/betterlite-core/src/api/agents.rs
  and their Rust/Python oracle adapters.

scope:
