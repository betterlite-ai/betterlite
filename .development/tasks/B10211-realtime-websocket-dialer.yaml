id: B10211
title: A production realtime WebSocket dialer over one shared tokio-tungstenite client
description: >-
  Nothing in production dials a provider's realtime WebSocket. B2457 declared `RealtimeWebSocketDialer` (crates/betterlite-core/src/api/realtime_backend_transport/dial.rs L56) and B1127 declared `RealtimeProbeDialer` (crates/betterlite-core/src/api/realtime_connection_plan.rs L98), and every impl of them, and of `RealtimeBackend` and `RealtimeBackendSource` apart from SizeLimitedSource, is a test or oracle fake. The Aim and Cato guardrails meanwhile open their own tokio-tungstenite sockets (crates/betterlite-guardrails/src/aim/transport.rs L102, crates/betterlite-guardrails/src/cato/transport/websocket.rs L64) with the same request, cap, TLS, timeout and split reader code. This task builds one WebSocket client in betterlite-http, the proxy choice websockets makes in betterlite-config and the dialer over both in betterlite-core, and moves Aim and Cato onto the client. B10213 runs realtime sessions over the dialer, B1125 and B10212 reach it through B10213, and B8642's pass-through connector opens its socket through the same client.


  Shared client (crates/betterlite-http/src/websocket_client.rs and websocket_client/). Main declares `pub mod websocket_client;` over a one-line file. `connect(request: WebSocketRequest<'_>) -> Result<WebSocketConnection, WebSocketClientError>` opens one socket the way websockets 15.0.1's `connect` does, with no retry. WebSocketRequest holds the url; the headers as ordered (name, value) pairs, added to the handshake in their order after the ones tungstenite writes; `tls: Option<Arc<rustls::ClientConfig>>`, where None keeps tokio-tungstenite's own rustls with the platform roots (what Aim and Cato use today) and a ws:// URL is always plain TCP; `max_message_size: usize`, set as tungstenite's max_message_size and max_frame_size; `open_timeout: Duration`, one deadline over the TCP connect, the proxy tunnel, TLS and the upgrade; `keepalive: Option<Keepalive>` with `interval` and `timeout`; and `proxy: Option<&ProxyServer>` from betterlite_config::proxy. Through a proxy, open the tunnel with hyper-util's `client::legacy::connect::proxy::Tunnel` (features client-legacy, client-proxy and tokio; hyper-util 0.1.21 is already in Cargo.lock) over its HttpConnector, with `Proxy-Authorization: Basic` built from the server's credentials, then run TLS and the upgrade over the tunneled stream with tokio-tungstenite 0.30.0's `client_async_tls_with_config` (features connect, handshake and rustls-tls-native-roots, as betterlite-guardrails has them). Write no CONNECT parser.


  WebSocketConnection holds `sender: WebSocketSender` and `receiver: WebSocketReceiver` over the split stream, with the sink behind one tokio Mutex both halves share. The sender has send_text, send_binary and close(code, reason). The receiver's recv answers the next Text or Binary message, a peer close with its code and reason, or the end of the stream without a close frame, and skips Ping, Pong and bare frames, since tungstenite answers pings itself. With keepalive set, recv sends a ping every interval and, when no pong arrives within timeout, closes the socket with 1011 and reason `keepalive ping timeout` and answers `WebSocketClientError::KeepaliveTimeout`. WebSocketClientError (in websocket_client/error.rs) tells apart Timeout, Io (DNS, TCP and the TLS handshake), Tls (building the config), `Status { status: u16 }` for an upgrade answered with anything but 101, `ProxyStatus { status: u16 }` for a CONNECT answered with anything but 2xx, `Capacity { size, max_size }` for an oversized message, Url, KeepaliveTimeout and Protocol for every other tungstenite error. No variant's message names the URL or a header value.


  Proxy choice (crates/betterlite-config/src/proxy.rs). `ProxyPolicy::websocket_route(&self, url: &Url) -> Option<&ProxyRoute>` is websockets' get_proxy (uri.py L192-L225): no route when the private `bypasses(no_proxy, ..)` matches "host:port", with the URL's port or its scheme default; otherwise the first of `wss`, `socks`, `https` for a wss:// URL, or of `ws`, `socks`, `https`, `http` for a ws:// URL, found in `primary`. It never reads `all` or the netrc `fallback`. A route found under `socks` answers `ProxyRoute::Unsupported { scheme: "socks5h" }` even when its value parsed as an http:// proxy, because websockets rewrites such a value to socks5h://. `route` and its callers stay as they are.


  Dialer (crates/betterlite-core/src/api/realtime_websocket_dialer.rs and realtime_websocket_dialer/). Main declares `pub mod realtime_websocket_dialer;` in api.rs. `WebSocketDialer { proxy: Arc<ProxyPolicy> }` implements RealtimeWebSocketDialer, and connect(request) runs these steps.

  1. Parse the URL. A scheme other than ws or wss is `DialError::WebSocket` (websockets' InvalidURI).

  2. `RealtimeSsl::Shared` or `Insecure` with a ws:// URL is `DialError::Other` with the message "ssl argument is incompatible with a ws:// URI", the ValueError websockets raises before any I/O and the case B2457's deviation row leaves to the dialer. Insecure passes `websocket_client_config(&Verification::Disabled)` as tls, Shared(verification) passes `websocket_client_config(&verification)`, and Disabled passes None for the plain ws:// socket. A config error is `DialError::Other`.

  3. The proxy is `self.proxy.websocket_route(url)`. Forward(server) tunnels through it. Unsupported with a scheme that starts with socks is `DialError::Other` with "python-socks is required to use a SOCKS proxy", the ImportError LiteLLM raises because its lock has no python-socks. Any other Unsupported scheme is `DialError::Other` naming the scheme (see deviations), and Invalid is `DialError::WebSocket` (websockets' InvalidProxy).

  4. Connect with `max_message_size: request.max_size + 1`, so SizeLimitedSource still decides the exact boundary, `request.open_timeout`, keepalive every 20 seconds with a 20 second timeout (websockets' ping_interval and ping_timeout), and request.headers in their order.

  5. Map the errors so open_realtime_backend_ws retries exactly what LiteLLM retries: Timeout is `DialError::Timeout` "timed out during opening handshake"; Io is `DialError::Os` with the io error's text; Status is `DialError::InvalidStatus { status_code, message: "server rejected WebSocket connection: HTTP <status>" }`; ProxyStatus is `DialError::WebSocket` "proxy rejected connection: HTTP <status>"; Url and Protocol are `DialError::WebSocket`.

  6. Answer `ConnectedBackend { sender, source: Some(source) }`. The sender implements RealtimeBackend over WebSocketSender: send writes Text or Binary, close sends 1000 with an empty reason, and recv answers a WebSocketError saying the receiving half is the relay's source. The source implements RealtimeBackendSource over WebSocketReceiver: recv(None) answers text as Text and binary as Binary, recv(Some(true)) decodes binary as UTF-8 text, recv(Some(false)) answers text as its bytes. A peer close is `RelayReceiveError::Closed(ConnectionClosed { received: Some(CloseFrame { code, reason }), .. })`, an end without a close frame is Closed with `received: None` and message "no close frame received or sent", a keepalive timeout is Closed with `received: None` and message "sent 1011 (internal error) keepalive ping timeout; no close frame received", a Capacity error first closes the backend with 1009 and then answers the same Closed value SizeLimitedSource builds from `betterlite_openai::realtime::message_cap::oversized_message_close`, and any other error is `RelayReceiveError::Failed`.


  Probe. WebSocketDialer also implements RealtimeProbeDialer: probe(connection) runs steps 1 to 4 with the connection's url, headers, ssl and max_size, websockets' default open timeout of 10 seconds and no keepalive, closes with 1000 once the upgrade succeeds and answers Ok, as `async with websockets.connect(...): return True` does (realtime_api/main.py L720-L742). A failure is a ProbeDialError whose class is the websockets or Python class LiteLLM would raise (InvalidStatus with `status: Some(status)`, TimeoutError, OSError, InvalidProxyStatus, InvalidURI, ValueError, ImportError) and whose message is the DialError text from step 5.


  Aim and Cato (crates/betterlite-guardrails/src/aim/ and cato/). AimWebSocketConnector::connect and Cato's WebSocketConnector::connect call the shared client with their own caps (MAX_STREAM_FRAME_BYTES, MAX_FRAME_BYTES), their open timeout, no keepalive and no proxy, so what they send and accept does not change. Aim passes tls None. Cato passes None for no ssl or SystemRoots and `websocket_client_config` of its verification otherwise, keeping rustls_connector's error mapping. Their TungsteniteReader and TungsteniteWriter become adapters over WebSocketReceiver and WebSocketSender that keep their read and write timeouts and their frame shapes (Aim answers text or UTF-8 binary as a String, Cato answers bytes). `AimError::WebSocket` and `CatoError::WebSocket` carry WebSocketClientError in place of tungstenite::Error, and a connect timeout stays AimError::ConnectTimeout and CatoError::ConnectTimeout. When nothing outside tests in betterlite-guardrails uses tokio-tungstenite any more, move it to its dev-dependencies.


  Tests. websocket_client::tests run a local tokio-tungstenite server, a TLS one with an rcgen certificate over tokio-rustls (both already dev-dependencies of betterlite-http) and a local CONNECT proxy, and check: headers arrive in order; a 403 upgrade is Status 403; a proxy 407 is ProxyStatus 407 and the proxy saw `Proxy-Authorization: Basic` for user:secret; a hung upgrade is Timeout after open_timeout; a message one byte over max_message_size is Capacity; a server that never answers pings ends recv with KeepaliveTimeout and the server sees close 1011 `keepalive ping timeout`; a server close 4000 "bye" reaches recv with its code and reason. proxy::tests add websocket_route tests for the scheme order of both URL kinds, NO_PROXY with and without a port, ALL_PROXY ignored, the socks rewrite and DISABLE_AIOHTTP_TRUST_ENV. api::realtime_websocket_dialer::tests drive WebSocketDialer through open_realtime_backend_ws against local servers: a 401 upgrade is InvalidStatus 401 after one attempt, a hung upgrade is retried three times, Shared with a ws:// URL is the ValueError message with no connection made, a SOCKS_PROXY is the ImportError message, a frame of max_size + 1 bytes and one far over it both close the session with 1009 "message too big", a missed pong reaches the relay as the keepalive Closed value, and the probe answers Ok on a 101 and InvalidStatus on a 403.
