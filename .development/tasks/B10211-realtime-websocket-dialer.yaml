    - crates/betterlite-http/src/websocket_client.rs
    - crates/betterlite-http/src/websocket_client/**
    - crates/betterlite-config/src/proxy.rs
    - crates/betterlite-config/src/proxy/**
    - crates/betterlite-core/src/api/realtime_websocket_dialer.rs
    - crates/betterlite-core/src/api/realtime_websocket_dialer/**
    - crates/betterlite-guardrails/src/aim/transport.rs
    - crates/betterlite-guardrails/src/aim/error.rs
    - crates/betterlite-guardrails/src/aim/tests/**
    - crates/betterlite-guardrails/src/cato/transport/websocket.rs
    - crates/betterlite-guardrails/src/cato/error.rs
    - crates/betterlite-guardrails/src/cato/tests/**
    - Cargo.lock
    - docs/deviations/B10211.yaml
  lint_tables: false
