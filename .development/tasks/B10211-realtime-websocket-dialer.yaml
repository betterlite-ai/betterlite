dod:
  - text: The shared client opens plain, TLS and tunneled sockets with ordered headers, one open deadline, a message cap, a keepalive and typed errors, and its halves send and receive independently.
    proof: [client-tests]
  - text: websocket_route chooses the proxy websockets would, and every other proxy caller is unchanged.
    proof: [proxy-tests]
  - text: WebSocketDialer implements RealtimeWebSocketDialer and RealtimeProbeDialer with the error classes and texts LiteLLM's retry and close paths read, and its halves implement RealtimeBackend and RealtimeBackendSource with the 1009 and keepalive closes.
    proof: [dialer-tests, production-impl]
  - text: Aim and Cato open their sockets through the shared client, and their tests still pass.
    proof: [guardrail-tests, no-copies]
  - text: docs/deviations/B10211.yaml lists this task's rows.
    proof: [deviation-rows]
checks:
  optional: [mutants]
  commands:
    - id: client-tests
      why: a socket opens wrong, a header is lost or reordered, the proxy or TLS path fails, or a limit or the keepalive is missing
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^websocket_client::/)'
    - id: proxy-tests
      why: websocket_route picks the wrong proxy, or the HTTP routes changed
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^proxy::tests::websocket_route/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^proxy::/)'
    - id: dialer-tests
      why: the dialer retries the wrong failures, sends the wrong texts, misses the 1009 or keepalive close, or the probe answers wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_websocket_dialer::/)'
    - id: production-impl
      why: a transport trait still has no production impl
      run: for name in RealtimeWebSocketDialer RealtimeProbeDialer RealtimeBackend RealtimeBackendSource; do test -n "$(grep -rl --exclude-dir=tests "impl $name for" crates/betterlite-core/src/api/realtime_websocket_dialer.rs crates/betterlite-core/src/api/realtime_websocket_dialer)" || exit 1; done
    - id: guardrail-tests
      why: Aim or Cato still connect on their own, or their behavior changed
      run: grep -q 'websocket_client' crates/betterlite-guardrails/src/aim/transport.rs && grep -q 'websocket_client' crates/betterlite-guardrails/src/cato/transport/websocket.rs && cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^aim::/) | test(/^cato::/)'
    - id: no-copies
      why: a crate outside the shared client still builds its own tungstenite handshake
      run: test -z "$(grep -rnE --exclude-dir=tests 'connect_async|client_async|into_client_request' crates/betterlite-guardrails/src crates/betterlite-core/src/api/realtime_websocket_dialer.rs crates/betterlite-core/src/api/realtime_websocket_dialer)"
    - id: deviation-rows
      why: this task's deviations are not recorded
      run: test -s docs/deviations/B10211.yaml && grep -q 'permessage-deflate' docs/deviations/B10211.yaml && grep -q 'SSL_ECDH_CURVE' docs/deviations/B10211.yaml && grep -q 'DISABLE_AIOHTTP_TRUST_ENV' docs/deviations/B10211.yaml
oracle_cases: []
deviations:
  - what: Realtime, Aim and Cato sockets offer no permessage-deflate extension, where websockets 15.0.1 offers it by default.
    why: tungstenite has no deflate support; a provider that requires compression answers the upgrade as it would to any client without it.
    link: https://github.com/python-websockets/websockets/blob/15.0.1/src/websockets/asyncio/client.py#L304
  - what: The upgrade and the proxy CONNECT carry no `User-Agent` header, where websockets sends `Python/3.x websockets/15.0.1`.
    why: The text names Python's runtime version, and no provider at the pin reads it.
    link: https://github.com/python-websockets/websockets/blob/15.0.1/src/websockets/asyncio/client.py#L307
  - what: SSL_ECDH_CURVE and litellm.ssl_ecdh_curve are not applied to realtime sockets; ssl_verify, SSL_CERT_FILE and the CA bundle are.
    why: RealtimeSsl carries only a Verification, and websocket_client_config builds the shared config without a curve.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L406
  - what: An https:// proxy URL in WSS_PROXY, WS_PROXY, HTTPS_PROXY or HTTP_PROXY fails the realtime connection with an error naming the scheme, where websockets opens TLS to the proxy.
    why: betterlite-config parses only http:// proxies; the realtime client sees the same close as any other connection error.
    link: https://github.com/python-websockets/websockets/blob/15.0.1/src/websockets/asyncio/client.py#L800-L812
  - what: DISABLE_AIOHTTP_TRUST_ENV (or general_settings.disable_aiohttp_trust_env) also turns off environment proxies for realtime sockets, where websockets reads them regardless.
    why: websocket_route reads the same primary routes the HTTP clients use, and ProxyPolicy::resolve clears them under that flag.
    link: https://github.com/python-websockets/websockets/blob/15.0.1/src/websockets/uri.py#L192-L225
out_of_scope:
  - "The production RealtimeSessionRelay, the OpenAI, xAI and Azure direct sessions and the executor of B1011's connection plans: B10213."
  - "Python _arealtime: B10212. The proxy's realtime route: B1125. The pass-through socket adapters: B8642, and it opens its socket through this client."
  - "Building a production RealtimeProbe with this dialer in the server's health backend: not planned yet (see the notes)."
pitfalls:
  - "tungstenite never sends pings, so the 20 second keepalive is the receiver's job, and it only runs while something polls recv; the relay always polls the backend source, so do not spawn a ping task."
  - "B1008 turns a backend close without a received frame into code 1006 with the error text as the client's close reason, so the source's messages must be websockets' exact `sent 1011 (internal error) keepalive ping timeout; no close frame received` and `no close frame received or sent`."
  - "Gemini puts its key in the URL query (`?key=`) and OpenAI and Azure send it in the Authorization and api-key headers; B2457 logs a DialError message and sends it to the client, so no message may carry the URL or a header value."
  - "Build the Basic value from ProxyCredentials' username and exposed password and mark the HeaderValue sensitive, since hyper-util's Tunnel sends Proxy-Authorization only through with_auth."
  - "ProxyPolicy::route falls back to `all` for httpx, but websockets ignores ALL_PROXY; websocket_route must not read it."
  - "The bypass check gets \"host:port\" the way websockets calls urllib's proxy_bypass; bypasses already splits a numeric port off, so a NO_PROXY entry example.com still matches example.com:443."
  - "A std Mutex guard must never live across an await; the shared sink sits behind a tokio Mutex."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
