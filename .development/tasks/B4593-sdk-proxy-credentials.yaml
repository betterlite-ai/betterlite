  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy_auth/credentials.py#L56-L60
    why: _AzureAccessToken property contracts for token and expires_on.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy_auth/credentials.py#L66-L66
    why: _AzureTokenCredential.get_token method contract.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy_auth/credentials.py#L90-L115
    why: AzureADCredential initialization and get_token, preserving lazy credential resolution and caching.
