id: B4593
title: SDK proxy OAuth credentials and bearer headers
description: >-
  Build the SDK's configurable token-credential contract, lazy Azure credential
  wrapper, OAuth2 client-credentials exchange and cached bearer-header generation.
  Preserve both 60-second refresh buffers and propagate acquisition errors to the
  existing caller, which decides whether to warn and continue.

  AccessToken is a typed record holding expires_on and a secrecy::SecretString token.
  TokenCredential is a protocol for any credential provider's get_token(scope) → AccessToken.

  AzureADCredential wraps Azure's identity credentials (DefaultAzureCredential or injected)
  and converts the token format. Resolve DefaultAzureCredential on first get_token call,
  caching the credential thereafter. If azure-identity is not installed, raise ImportError
  with the installation command. An injected credential supplied at init never attempts
  to import.

  GenericOAuth2Credential implements client_credentials grant for any OAuth2 provider.
  Initialize with client_id, client_secret as secrecy::SecretString (read from config
  or arguments), and token_url from config. On get_token(scope), return cached token
  if expires_on > now + 60 seconds; otherwise POST to token_url with grant_type=client_credentials,
  client_id, client_secret, and scope, using the pooled HTTP client from B173 with its
  default timeout. Default missing expires_in to 3600 seconds. Store client_secret as
  secrecy::SecretString and never log or expose it. Return cached token of type AccessToken
  with expires_on computed from response expires_in. Do not key cached token by scope.

  ProxyAuthHandler holds a credential and scope, caching the token obtained from
  get_credential.get_token(scope). get_token() returns cached token if expires_on > now + 60,
  else refreshes by calling the credential. get_auth_headers() returns {Authorization:
  "Bearer <token>"} where token is the secret string value.

  Every token and secret field holding a JWT or client secret must be secrecy::SecretString,
  never logged, never exposed in Debug output, and compared in constant time where needed.
  No type in the crate derives Debug on a field holding a SecretString without explicit
  redaction. The task includes a check that greps for SecretString in the credential
  implementations and that verifies secrets are not exposed through Debug output.
scope:
  paths:
    - crates/betterlite-sdk/Cargo.toml
    - crates/betterlite-sdk/src/proxy_auth.rs
    - crates/betterlite-sdk/src/proxy_auth/**
    - crates/betterlite-sdk/src/proxy_auth/tests.rs
    - tools/oracle/src/helpers/sdk/proxy_auth.rs
    - tools/oracle/src/helpers/sdk/proxy_auth/**
    - tools/oracle/helpers/proxy_auth.py
    - tools/oracle/helpers/proxy_auth/**
    - tools/oracle/cases/helpers/proxy-auth/**
  lint_tables: false
