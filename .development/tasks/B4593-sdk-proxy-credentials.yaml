dod:
  - text: TokenCredential protocol and AccessToken record match the pinned LiteLLM interface
      with token as secrecy::SecretString, never exposed in Debug or error messages.
    proof:
      - credential-tests
      - secret-string-check
  - text: AzureADCredential resolves DefaultAzureCredential lazily on first call, caches it,
      and preserves ImportError with the install command when azure-identity is missing.
    proof:
      - credential-tests
      - azure-lazy-init
  - text: GenericOAuth2Credential performs client_credentials POST using B173's pooled client
      with default 3600s expires_in, caches tokens until 60s before expiry, and stores
      client_secret as secrecy::SecretString without leaking it.
    proof:
      - credential-tests
      - oauth2-post-exchange
      - oauth2-cache-unscoped
      - oauth2-secret-protection
  - text: ProxyAuthHandler caches tokens and refreshes within 60s of expiry, returns Bearer
      headers with token value, and propagates credential errors for the caller to warn.
    proof:
      - credential-tests
      - proxy-handler-refresh
  - text: New oracle helper operation integrates typed credential providers with the pinned
      LiteLLM behavior and replays the typed case corpus.
    proof:
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: credential-tests
      why: Credential types, lazy init, token caching or refresh logic are missing or fail.
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^proxy_auth::tests::/) - test(/replays_the_/)'
    - id: secret-string-check
      why: Token or secret fields are not SecretString or Debug is derived without redaction.
      run: "grep -qE 'token: secrecy::SecretString|secret: secrecy::SecretString' crates/betterlite-sdk/src/proxy_auth.rs"
    - id: azure-lazy-init
      why: Azure credential is not lazily initialized or ImportError message is missing.
      run: "grep -qE 'lazy|first|resolve' crates/betterlite-sdk/src/proxy_auth.rs && grep -qE 'ImportError|azure-identity' crates/betterlite-sdk/src/proxy_auth.rs"
    - id: oauth2-post-exchange
      why: OAuth2 does not perform POST with grant_type=client_credentials or missing defaults.
      run: "grep -qE 'grant_type|client_credentials' crates/betterlite-sdk/src/proxy_auth.rs && grep -qE 'expires_in.*3600|3600.*expires' crates/betterlite-sdk/src/proxy_auth.rs"
    - id: oauth2-cache-unscoped
      why: Token caching keys by scope or does not cache tokens.
      run: "grep -qE '_cached_token|cache' crates/betterlite-sdk/src/proxy_auth.rs && ! grep -qE 'scope.*cache|cache.*scope' crates/betterlite-sdk/src/proxy_auth.rs || true"
    - id: oauth2-secret-protection
      why: GenericOAuth2Credential leaks client_secret through logging or Debug.
      run: "grep -qE 'client_secret.*SecretString|SecretString.*client_secret' crates/betterlite-sdk/src/proxy_auth.rs && ! grep -qE 'tracing.*client_secret|debug.*client_secret' crates/betterlite-sdk/src/proxy_auth.rs || true"
    - id: proxy-handler-refresh
      why: ProxyAuthHandler does not cache or refresh tokens within 60s buffer.
      run: "grep -qE 'expires_on.*60|60.*expires' crates/betterlite-sdk/src/proxy_auth.rs && grep -qE 'Bearer|Authorization' crates/betterlite-sdk/src/proxy_auth.rs"
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/proxy_auth.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/proxy-auth-*)" && grep -rlq "proxy_auth" tools/oracle/fuzz/corpus/helper_case/proxy-auth-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/proxy-auth/azure-lazy-init.yaml
  - tools/oracle/cases/helpers/proxy-auth/azure-import-error.yaml
  - tools/oracle/cases/helpers/proxy-auth/oauth2-cache-unscoped.yaml
  - tools/oracle/cases/helpers/proxy-auth/oauth2-default-expires.yaml
  - tools/oracle/cases/helpers/proxy-auth/refresh-buffer.yaml
  - tools/oracle/cases/helpers/proxy-auth/exception-propagation.yaml
deviations:
  - what: GenericOAuth2Credential uses the pooled HTTP client from B173, applying its default timeout
      and TLS/proxy settings, rather than constructing an ad hoc httpx.Client.
    why: B173 provides a shared bounded client that respects configuration; every outbound call
      requires a timeout per bounded-inputs rule.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy_auth/credentials.py#L184-L194
out_of_scope:
  - Credential provider configuration and instantiation belong to higher layers (CLI, SDK initialization, config loader).
  - Azure identity provider selection and environment chain belong to the azure-identity crate's DefaultAzureCredential.
  - HTTP request/response handling details are owned by B173's pooled client.
pitfalls:
  - 'The oracle helper for this task is pre-registered as proxy_auth in the sdk group. Replace the stub Op in tools/oracle/src/helpers/sdk/proxy_auth.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/proxy_auth.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Azure's DefaultAzureCredential is imported and evaluated only on first get_token call, so a missing azure-identity
    package does not fail at initialization but at the first request from the caller.
  - Cached tokens are compared and returned by reference; the cached AccessToken's expires_on is evaluated at each
    get_token call, so the 60-second buffer is dynamically computed against the current time.
  - GenericOAuth2Credential does not key its cache by scope, so simultaneous requests for different scopes will
    reuse the same token even if scope affects the token's validity.
budget:
  max_changed_lines: 600
  max_new_expects: 0
review_level: security
