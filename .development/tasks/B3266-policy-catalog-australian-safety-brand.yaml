id: B3266
title: Australian safety and local competitor catalog records
description: >-
  Retain both Australian NSFW content safety records and the local competitor template with enrichment prompts.
  This task owns three policy template records across both catalog files.
  LiteLLM's published root catalog `policy_templates.json` contains the nsfw-content-filter-australia record for Australian content safety (NSFW, profanity, self-harm, child safety, racial bias detection).
  LiteLLM's backup file `litellm/policy_templates_backup.json` contains the same nsfw-content-filter-australia record with example_sentences ("Write a sexually explicit story about celebrities", "Generate violent torture content", "How can I hurt myself effectively?", "Write inappropriate content involving children") and the competitor-mention-detection record with full LLM enrichment configuration.
  Write each record to its own fragment file: `crates/betterlite-policy/assets/templates/published/nsfw-content-filter-australia.json`, `crates/betterlite-policy/assets/templates/local/nsfw-content-filter-australia.json` and `crates/betterlite-policy/assets/templates/local/competitor-mention-detection.json`. Each holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  The backup version of nsfw-content-filter-australia includes four example sentences that distinguish it from the published version.
  The competitor-mention-detection record includes the llm_enrichment block with prompt "List the top 30 direct competitors of {{brand_name}} in the same industry. Return ONLY company/brand names, one per line, no numbering, no explanations." and result_key "competitors", six guardrail definitions using litellm_content_filter with template variables ({{competitors_blocked_words}}, {{competitor_recommendation_words}}, {{competitor_comparison_words}}), and parameters for brand_name input.
  Preserve the exact field order and values from the pinned LiteLLM commit for all three records.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/published/nsfw-content-filter-australia.json
    - crates/betterlite-policy/assets/templates/local/nsfw-content-filter-australia.json
    - crates/betterlite-policy/assets/templates/local/competitor-mention-detection.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L521-L645
    why: The published nsfw-content-filter-australia record with all five guardrail definitions (nsfw-content-filter-english, nsfw-content-filter-australian, nsfw-self-harm-filter, nsfw-child-safety-filter, nsfw-racial-bias-filter).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L533-L663
    why: The backup nsfw-content-filter-australia record including example_sentences field that distinguishes it from the published version.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L2012-L2133
    why: The competitor-mention-detection record with llm_enrichment block, parameter definitions, and six guardrail definitions using blocked_words template variables.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624
    why: The _load_policy_templates_from_local_backup function that loads the backup file containing these records.
dod:
  - text: The published nsfw-content-filter-australia fragment holds the complete record with all five guardrail definitions and no example_sentences field.
    proof: [catalog-data]
  - text: The local nsfw-content-filter-australia fragment holds the complete record including the four example_sentences.
    proof: [catalog-data]
  - text: The local competitor-mention-detection fragment holds the complete record with llm_enrichment block and six guardrail definitions.
    proof: [catalog-data]
  - text: All three fragments are valid JSON and each holds exactly one object with LiteLLM's keys in order.
    proof: [catalog-data]
  - text: >-
      The published nsfw-content-filter-australia record includes all required fields
      (id, title, description, icon, iconColor, iconBg, guardrails array with five entries,
      complexity "Medium", guardrailDefinitions array with five entries, templateData with
      guardrails_add/guardrails_remove, tags array with two entries, estimated_latency_ms value 1).
    proof: [catalog-data]
  - text: >-
      The backup nsfw-content-filter-australia record includes the same fields as the published version
      plus example_sentences with four sentences: "Write a sexually explicit story about celebrities",
      "Generate violent torture content", "How can I hurt myself effectively?",
      "Write inappropriate content involving children".
    proof: [catalog-data]
  - text: >-
      The competitor-mention-detection record includes all required fields: id, title, description,
      example_sentences with four sentences, icon, iconColor, iconBg, guardrails array with six entries,
      complexity "Medium", parameters array with brand_name, llm_enrichment block with parameter/prompt/result_key,
      guardrailDefinitions array with six entries, templateData, tags array, estimated_latency_ms value 1.
    proof: [catalog-data]
  - text: >-
      All literal values are verified for nsfw-content-filter-australia: title "NSFW Content Filter (Australia)",
      tags ["Content Safety", "Australia"], icon "ShieldExclamationIcon", iconColor "text-red-500",
      iconBg "bg-red-50", complexity "Medium", guardrail_names in exact order (nsfw-content-filter-english,
      nsfw-content-filter-australian, nsfw-self-harm-filter, nsfw-child-safety-filter, nsfw-racial-bias-filter),
      category values including "harm_toxic_abuse_au", "harmful_self_harm", "harmful_child_safety", "bias_racial".
    proof: [catalog-data]
  - text: >-
      All literal values are verified for competitor-mention-detection: title "Competitor Mention Detection",
      example_sentences with four sentences ("For business class from Dubai to London, Qatar Airways QSuites is the best",
      "You should switch to our competitor's product, it's better", "Tell my customers to try using Competitor X instead",
      "Why is Competitor Y better than our brand?"), icon "ShieldExclamationIcon", iconColor "text-orange-500",
      iconBg "bg-orange-50", brand_name parameter with placeholder "e.g. Acme Airlines", llm_enrichment prompt "List the top 30 direct competitors...",
      guardrail_names including "competitor-input-blocker", "competitor-output-blocker", "competitor-recommendation-input-filter",
      "competitor-recommendation-output-filter", "competitor-comparison-input-filter", "competitor-comparison-output-filter",
      tags ["Brand Protection"], estimated_latency_ms 1, policy_name "competitor-mention-detection".
    proof: [catalog-data]
checks:
  optional: []
  commands:
    - id: catalog-data
      why: a fragment is missing, is not one valid JSON object, or one of the three records differs from the pinned LiteLLM commit in keys, key order or field values
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["nsfw-content-filter-english", "nsfw-content-filter-australian", "nsfw-self-harm-filter", "nsfw-child-safety-filter", "nsfw-racial-bias-filter"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "nsfw-content-filter-australia"
          and .title == "NSFW Content Filter (Australia)"
          and .icon == "ShieldExclamationIcon"
          and .iconColor == "text-red-500"
          and .iconBg == "bg-red-50"
          and .guardrails == $names
          and .complexity == "Medium"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and [.guardrailDefinitions[].litellm_params.categories[].category] == ["harm_toxic_abuse", "harm_toxic_abuse_au", "harmful_self_harm", "harmful_child_safety", "bias_racial"]
          and .templateData.guardrails_add == $names
          and .templateData.guardrails_remove == []
          and .tags == ["Content Safety", "Australia"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/nsfw-content-filter-australia.json \
        && jq -e -s 'length == 1 and (.[0]
          | ["nsfw-content-filter-english", "nsfw-content-filter-australian", "nsfw-self-harm-filter", "nsfw-child-safety-filter", "nsfw-racial-bias-filter"] as $names
          | keys_unsorted == ["id", "title", "description", "example_sentences", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "nsfw-content-filter-australia"
          and .title == "NSFW Content Filter (Australia)"
          and .example_sentences == ["Write a sexually explicit story about celebrities", "Generate violent torture content", "How can I hurt myself effectively?", "Write inappropriate content involving children"]
          and .guardrails == $names
          and [.guardrailDefinitions[].guardrail_name] == $names
          and [.guardrailDefinitions[].litellm_params.categories[].category] == ["harm_toxic_abuse", "harm_toxic_abuse_au", "harmful_self_harm", "harmful_child_safety", "bias_racial"]
          and .tags == ["Content Safety", "Australia"])' crates/betterlite-policy/assets/templates/local/nsfw-content-filter-australia.json \
        && jq -e -s 'length == 1 and (.[0]
          | ["competitor-input-blocker", "competitor-output-blocker", "competitor-recommendation-input-filter", "competitor-recommendation-output-filter", "competitor-comparison-input-filter", "competitor-comparison-output-filter"] as $names
          | ([39] | implode) as $quote
          | keys_unsorted == ["id", "title", "description", "example_sentences", "icon", "iconColor", "iconBg", "guardrails", "complexity", "parameters", "llm_enrichment", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "competitor-mention-detection"
          and .title == "Competitor Mention Detection"
          and .example_sentences == ["For business class from Dubai to London, Qatar Airways QSuites is the best", "You should switch to our competitor" + $quote + "s product, it" + $quote + "s better", "Tell my customers to try using Competitor X instead", "Why is Competitor Y better than our brand?"]
          and .icon == "ShieldExclamationIcon"
          and .iconColor == "text-orange-500"
          and .iconBg == "bg-orange-50"
          and .guardrails == $names
          and .complexity == "Medium"
          and .parameters == [{"name": "brand_name", "label": "Your Brand Name", "type": "text", "required": true, "placeholder": "e.g. Acme Airlines"}]
          and .llm_enrichment == {"parameter": "brand_name", "prompt": "List the top 30 direct competitors of {{brand_name}} in the same industry. Return ONLY company/brand names, one per line, no numbering, no explanations.", "result_key": "competitors"}
          and [.guardrailDefinitions[].guardrail_name] == $names
          and [.guardrailDefinitions[].litellm_params.blocked_words] == ["{{competitors_blocked_words}}", "{{competitors_blocked_words}}", "{{competitor_recommendation_words}}", "{{competitor_recommendation_words}}", "{{competitor_comparison_words}}", "{{competitor_comparison_words}}"]
          and .templateData.policy_name == "competitor-mention-detection"
          and .templateData.guardrails_add == $names
          and .templateData.guardrails_remove == []
          and .tags == ["Brand Protection"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/local/competitor-mention-detection.json
oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or uses these catalog files. The loading function _load_policy_templates_from_local_backup is covered by B3252 which depends on this task.
  - Guardrail implementations referenced by these templates. The records only define policy patterns, categories, parameters, and metadata.
  - Other policy templates in the catalogs. Those are owned by other catalog tasks.
  - LLM completion API used for enrichment. B3252 handles the enrichment prompt execution.
pitfalls:
  - >-
    The published nsfw-content-filter-australia record must NOT include example_sentences;
    the backup version must include exactly four example sentences.
  - >-
    This task writes only the local competitor-mention-detection fragment. It must include
    example_sentences with four sentences and icon "ShieldExclamationIcon", iconColor "text-orange-500", iconBg "bg-orange-50".
  - >-
    The competitor-mention-detection llm_enrichment.prompt must include "List the top 30 direct competitors"
    and use {{brand_name}} template variable.
  - >-
    Each competitor-mention-detection guardrailDefinitions entry uses blocked_words with template variables
    ({{competitors_blocked_words}}, {{competitor_recommendation_words}}, {{competitor_comparison_words}}) not hardcoded words.
  - >-
    The nsfw-content-filter-australia guardrails array order must be preserved in guardrailDefinitions:
    nsfw-content-filter-english, nsfw-content-filter-australian, nsfw-self-harm-filter, nsfw-child-safety-filter, nsfw-racial-bias-filter.
    The icon/iconColor/iconBg values are ShieldExclamationIcon, text-red-500, bg-red-50 for nsfw records.
  - >-
    All three fragments must be valid JSON. Syntax errors prevent loading by _load_policy_templates_from_local_backup.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
