id: B240
title: Vertex and Gemini error classifiers
description: >-
  Implement every classifier/helper function in exception_mapping_utils.py 1143-1363, preserving ordered predicates
  over B236 typed facts and B184 taxonomy. Each branch-N case invokes one family with input reaching the condition
  at pinned source line N; add distinct fallback cases per family and named rstest rows for every status/string
  predicate, including combinations and unmatched inputs. Never combine two families in one call. Do not instantiate
  cloud SDK clients. Budget 280 classifiers, 110 adapters, 320 tests and 50 wiring (760 total). Write the behavior
  rstest functions b240_behavior_tests_behavior in adjacent tests.rs files, with a named case for each behavior
  and failure in the DoD; corpus replay tests have separate names. Register helper operations vertex_errors in tools/oracle/src/helpers/mod.rs
  and tools/oracle/helpers/dispatch.py; each operation has its own Rust and Python adapter file and corpus seed.
  Every error case ignores /error/message with reason betterlite writes its own message; never copy AnthropicError
  or other LiteLLM branding prefixes.
scope:
  paths:
  - crates/betterlite-error/src/lib.rs
  - crates/betterlite-error/src/error.rs
  - crates/betterlite-error/src/vertex_errors.rs
  - crates/betterlite-error/src/vertex_errors/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/vertex-errors/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1143-L1363
  why: All function bodies and predicates in this bounded family slice.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/::b240_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'vertex_errors' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vertex-errors/branch-1153.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1167.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1173.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1180.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1192.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1199.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1213.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1230.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1250.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1272.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1279.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1280.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1294.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1300.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1313.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1319.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1326.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1340.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1352.yaml
- tools/oracle/cases/helpers/vertex-errors/branch-1358.yaml
- tools/oracle/cases/helpers/vertex-errors/generic-fallback.yaml
- tools/oracle/cases/helpers/vertex-errors/competing-message-status.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B186 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
