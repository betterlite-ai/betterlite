checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::ingest_request::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b3462.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails
        replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/ingest-request-*")"
        && grep -rlq "parse_rag_ingest_request\|ingest_request" tools/oracle/fuzz/corpus/helper_case/ingest-request-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: content-fuzz-corpus
      why: The RAG JSON decoder has no fuzz corpus or the corpus does not replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-core/fuzz/corpus/rag_json_decoder/")"
        && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(replays_the_rag_json_decoder_corpus)'

