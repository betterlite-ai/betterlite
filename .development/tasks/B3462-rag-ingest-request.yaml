deviations:
  - what: Blocked credential field validation order is deterministic in betterlite,
      checking fields in the listed sequence. LiteLLM checks by iterating a Python
      set literal (endpoints.py:497-512), which has no guaranteed order across runs
      due to hash randomization (PYTHONHASHSEED).
    why: Deterministic validation order makes behavior predictable and testable.
      The set contains exactly the 14 fields that must be blocked; the iteration
      order does not affect which fields are rejected, only the sequence of error
      checks when multiple blocked fields are present in a single request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/endpoints.py#L497-L512
  - what: URL and file_id inputs bypass upload scanning; only multipart or base64
      file uploads go through validation. The decoded request returns tuples of
      (ingest_options, file_data, file_url, file_id) where file_data is
      (safe_filename, content_bytes, content_type) after security validation, or
      None when no file is present.
    why: Decoding is independent of storage and ingestion; the request shape matches
      the pin's multipart and JSON branches with safe filename generation deferred
      to validation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/endpoints.py#L404-L525

out_of_scope:
  - B1103 owns `add_litellm_data_to_request` and related request setup that follows
    this decoder in the final rag_ingest route.

pitfalls:
  - 'The multipart form field holding request options is named `request`, not `ingest_options`; JSON bodies use `ingest_options` as the top-level key.'
  - 'Base64 decoding failures raise a 400 HTTPException with a descriptive error message; base64 content is validated through the entire decode path, not with a try-except that silently ignores errors.'
  - 'Credential field blocking checks vector_store as a dict before iterating its keys; a non-dict vector_store config passes through to later callers that validate it.'
  - 'The decoder reads at most `MAX_UPLOAD_SIZE_BYTES+1` from multipart uploads to detect oversized files without buffering the entire payload into memory.'
  - 'File data returned from multipart is (filename, bytes, content_type) after _secure_uploaded_file validates and replaces the filename with a server-generated safe name and updates content_type from the detected format.'
  - 'URL and file_id inputs are returned as-is without validation; only multipart/base64 file uploads go through the security validator.'

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
