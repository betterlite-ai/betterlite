id: B3462
title: Decode and secure RAG ingestion requests
description: >-
  Build the HTTP ingestion decoder that parses multipart and JSON request bodies,
  validates uploaded file bytes against size and format restrictions, and rejects
  user-supplied credentials before returning document bytes for ingestion.

  Own `_secure_uploaded_file` at `litellm/proxy/rag_endpoints/endpoints.py:391-401`
  and `parse_rag_ingest_request` at `:404-525`. The decoder accepts two input
  shapes: multipart/form-data with a file upload and a JSON `request` field
  containing ingest_options, or application/json body with ingest_options and
  optional file, file_url, or file_id. Base64-encoded file objects in JSON decode
  their `content` field before validation.

  Uploaded files are immediately validated through the injected upload security
  contract, raising a 400 error when validation fails and returning
  server-generated safe filenames and content types when it succeeds. Three
  sources are required: at least one of file (multipart upload or base64 JSON),
  file_url, or file_id must be present. ingest_options must contain a vector_store
  object. URL and file-ID inputs bypass upload scanning; only multipart or base64
  file uploads go through the validation chain. The multipart field holding request
  options is called `request` (not `ingest_options`). All 14 credential fields in
  vector_store are rejected in a deterministic order (betterlite-defined):
  vertex_credentials, vertex_ai_credentials, aws_access_key_id,
  aws_secret_access_key, aws_session_token, aws_web_identity_token,
  aws_role_name, aws_session_name, aws_profile_name, aws_sts_endpoint,
  aws_external_id, azure_ad_token, api_key, api_base. Each blocked field
  receives a 400 error naming it before returning the parsed request.

  Direct dependencies: **B3452** — `validate_upload`, `RejectedUpload`,
  `MAX_UPLOAD_SIZE_BYTES`; **B1100** — `_safe_get_request_headers`,
  `_read_request_body`; **B1101** — `get_form_data`. Build the two functions in
  betterlite-core::rag as a request-parsing module. Test corpus and behavior cover
  multipart with file, multipart with base64 JSON, JSON with inline base64, JSON
  with URL, JSON with file_id, missing sources, invalid base64, missing vector_store,
  and all blocked credential fields. Fuzz the JSON-in-form and base64 decoders with
  bounded arbitrary payloads.

