id: B3545
title: Native compaction capability and summary dispatch
description: >-
  Build Anthropic native-compaction selection, conflict checks, summarize request
  options and signed summary extraction, plus the SDK chat/Messages dispatch adapter.
  Preserve false-on-capability-lookup-failure and reject summary extraction unless
  exactly one correctly signed nonblank compaction block is present.

  CompactionProtocol is a Literal["chat", "messages"] discriminator. The
  NativeCompactionProvider protocol defines the four methods that dispatch providers
  (Anthropic, others) must implement: supports_native_compaction, compatible_defaults,
  request_kwargs, and extract_summary. get_native_compaction_provider returns the
  provider if the model supports compaction, or None (not an error) if capability
  lookup fails or the model does not support it.

  supports_native_compaction checks model metadata via B2225's get_model_info
  for the supports_anthropic_compaction flag, falling back to false on any
  exception (malformed model name, network error, missing provider). The custom
  provider prefix (openai/, anthropic/) is stripped before lookup. Other custom
  llm providers are unsupported.

  compatible_defaults returns false if any conflicting parameter is set:
  context_management, response_format, stop, stop_sequences, or tool_choice.
  Null/None values pass; only truthy values trigger rejection.

  request_kwargs returns the compaction operation {type: "summarize"} and the
  anthropic-beta header "compact-2026-09-04" via extra_headers. Both are wrapped
  in read-only TypedDicts and re-exported from the protocol module.

  _native_blocks extracts compaction blocks from the response based on protocol.
  For "messages", blocks come from content if stop_reason is "compaction"; for
  "chat", blocks come from provider_specific_fields.compaction_blocks inside
  choices[0].message if exactly one choice exists. Empty tuple if not found.

  extract_summary requires exactly one block with type=="compaction", a
  nonblank string signature, and nonblank string content. Returns None if the
  block count is not 1, type is wrong, signature is absent or blank, or
  content is absent/blank after stripping.

  dispatch routes the call through the router: for "messages", calls
  router.aanthropic_messages with custom_llm_provider=None, client=None and
  all payload fields; for "chat", calls router.acompletion with model, messages,
  stream=false and the remaining fields via MappingProxyType.
