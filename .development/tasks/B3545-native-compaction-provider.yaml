dod:
  - text: Native compaction provider is returned for models with supports_anthropic_compaction metadata, and None when capability lookup fails or the provider is unsupported.
    proof: [capability-tests]
  - text: Protocol type is dispatched correctly; "messages" routes to aanthropic_messages and "chat" routes to acompletion with stream=false.
    proof: [oracle]
  - text: Compatible defaults rejects context_management, response_format, stop, stop_sequences and tool_choice if set to truthy values.
    proof: [conflict-tests]
  - text: Native blocks are extracted from the response based on protocol; empty tuple if not found.
    proof: [oracle]
  - text: Summary extraction requires exactly one compaction block with type=="compaction", nonblank signature and nonblank content; returns None otherwise.
    proof: [oracle]
  - text: Request kwargs include the compaction operation and the compact-2026-09-04 anthropic-beta header.
    proof: [request-kwargs-cases]
  - text: Model name prefix is stripped (openai/, anthropic/) before metadata lookup.
    proof: [capability-tests]
checks:
  optional: []
  commands:
    - id: capability-tests
      why: Native compaction capability detection with model prefix stripping and exception handling must pass.
      run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^native_compaction_capability::/)'
    - id: conflict-tests
      why: Compatible defaults conflict detection must pass for all five conflict fields.
      run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^native_compaction_defaults::/)'
    - id: request-kwargs-cases
      why: Request kwargs building must include compaction operation and beta header.
      run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/^native_compaction_request_kwargs::/)'
oracle_cases:
  - tools/oracle/cases/anthropic/native_compaction/dispatch.yaml
  - tools/oracle/cases/anthropic/native_compaction/blocks.yaml
  - tools/oracle/cases/anthropic/native_compaction/signature.yaml
  - tools/oracle/cases/anthropic/native_compaction/content.yaml
  - tools/oracle/cases/anthropic/native_compaction/protocol.yaml
deviations:
out_of_scope:
  - B2225 owns get_model_info and model metadata; this task only calls it with model and custom_llm_provider="anthropic".
  - B5078 owns Router.aanthropic_messages and Router.acompletion dispatcher implementations; this task calls them with validated payloads.
  - Protocol validation of Mapping and list types is handled by TypeAdapter; this task uses it for validation, not reimplements Pydantic.
  - Anthropic tool exchange validation belongs to B3540; native compaction extracts summary only from the response.
pitfalls:
  - Exception handling in supports_native_compaction must return false, not raise; network errors and malformed model names are treated as unsupported.
  - "Protocol must be exactly \"messages\" or \"chat\"; any other value is invalid, though the protocol dispatch is enforced at type level."
  - Summary extraction requires exactly one block; zero, two, or more blocks all return None.
  - "Signature must be a nonblank string; null, empty string, or non-string types all reject extraction."
  - "Content must be a nonblank string after strip(); null, empty string, non-string, or whitespace-only content all reject extraction."
  - "Block type must be exactly \"compaction\"; other type values (or missing type) reject extraction."
  - For chat protocol, exactly one choice must exist; zero or multiple choices return empty tuple.
  - "The \"compact-2026-09-04\" header value is literal and must not change without a breaking version bump."
  - "Conflict field names must include all five: context_management, response_format, stop, stop_sequences, tool_choice."
  - "Model prefix stripping applies only to openai/ and anthropic/ prefixes; custom_llm_provider=None accepts unprefixed models, custom_llm_provider=\"openai\" returns false, custom_llm_provider=\"anthropic\" checks metadata."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
