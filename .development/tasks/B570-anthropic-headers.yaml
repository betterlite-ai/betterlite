pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_headers in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/headers.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_headers.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- anthropic-beta is joined from a Python set, so compare the token set without erasing spelling or membership differences.
- An explicitly empty listed_ids replacement adds source_model but still falls back to the original id because the
  two checks use is not None and truthiness.
- A resolved empty API key is not None, so it blocks ANTHROPIC_AUTH_TOKEN fallback without necessarily producing
  an authentication header.
