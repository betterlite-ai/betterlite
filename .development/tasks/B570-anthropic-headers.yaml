id: B570
title: Anthropic request headers and model discovery
description: >-
  Add AnthropicHeaders as per-request immutable header preparation, merging caller-safe beta values with derived
  features and native auth. Preserve version/content/accept defaults, Vertex beta special cases and response header
  aliases. Return typed model discovery records from the injected catalog; avoid network model discovery in pure
  probes.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  AnthropicModelInfo.get_anthropic_headers L951-L1046; AnthropicModelInfo.validate_environment L1048-L1120; process_anthropic_headers
  L1783-L1797; _anthropic_model_entry L1800-L1815; create_anthropic_model_list_response L1818-L1844.


  create_anthropic_model_list_response serves Anthropic-format /v1/models callers in proxy_server.py L11592, L11711
  and L11771. B567 owns AnthropicModelInfo.get_models network discovery; this task only projects supplied ModelInfo
  records.


  Named case contracts: default_native_version: Default anthropic-version to 2023-06-01 and accept/content-type
  to application/json; a truthy explicit version overrides it. Prompt caching and PDF use alone add no beta. api_key_and_bearer:
  Use B567 key/OAuth resolution, then ANTHROPIC_AUTH_TOKEN only when the resolved API key is None; native keys use
  x-api-key unless the B567 custom-base bearer policy applies. oauth_beta_merge: A key starting sk-ant-oat sends
  authorization: Bearer {key}, anthropic-dangerous-direct-browser-access: true and oauth-2025-04-20; merge caller
  betas without duplicates. derived_beta_union: file_id adds files-api-2025-04-14 and code-execution-2025-05-22;
  MCP adds mcp-client-2025-04-04; tool search, programmatic calls and input_examples each add advanced-tool-use-2025-11-20;
  effort adds effort-2025-11-24; code execution adds code-execution-2025-08-25; skills adds skills-2025-10-02. Use
  independently enabled flags so each implication can fail alone. vertex_web_search_beta: Vertex suppresses every
  derived/user beta except web-search-2025-03-05 when web_search_tool_used is true; ordinary native web search alone
  adds no beta. response_header_prefixes: Prefix every input response header with llm_provider-; additionally map
  anthropic-ratelimit-requests-limit/remaining to x-ratelimit-limit/remaining-requests and anthropic-ratelimit-tokens-limit/remaining
  to x-ratelimit-limit/remaining-tokens. catalog_model_list: Return every input model as type model with display_name
  defaulting to id, max_input_tokens and max_tokens from max_output_tokens (nullable); has_more is false, first_id/last_id
  are null for an empty list. listed_ids changes id and adds source_model, while display_names keys use the source
  id. auth_missing_401: Neither ANTHROPIC_API_KEY nor ANTHROPIC_AUTH_TOKEN resolving raises AuthenticationError
  401 for provider anthropic and the requested model; identify both environment variables in the missing-credential
  diagnostic, comparing type/param/code but ignoring message wording. conversation_betas: Output-config history
  adds mid-conversation-output-config-2026-07-01; display updates adds thinking-display-updates-2026-08-18; tool-change
  history adds mid-conversation-tool-changes-2026-07-01; computer-tool beta comes from B568. catalog_created_at_default:
  Resolve DEFAULT_MODEL_CREATED_AT_TIME from the same env var, default 1677610602, and convert to UTC ISO format
  ending Z; invalid noninteger environment values fail config loading. header_merge_precedence: validate_environment
  overlays generated headers over caller headers; api_base falls back to litellm_params.api_base only when None
  and litellm_params.use_bearer_for_custom_base defaults false.


  The Python beta construction uses a set. Both helper adapters project anthropic-beta to a sorted unique list before
  comparison, retaining exact token spelling and all other headers; do not require comma ordering or pin PYTHONHASHSEED
  to hide the nondeterminism. B567 owns ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN loading; reuse its named loader
  tests.


  Load use_bearer_for_custom_base, DEFAULT_MODEL_CREATED_AT_TIME through betterlite-config, with injected environment
  lookup and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest anthropic_headers_config_cases; each named loads_<key> case invokes the real B002 loader, checks
  explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  Write standalone Rust test anthropic_headers_credential_identity_isolation in betterlite-anthropic: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test anthropic_headers_secret_safe_failure in betterlite-anthropic: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-anthropic/src/headers.rs with adjacent tests under headers/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function headers_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  default_native_version, api_key_and_bearer, oauth_beta_merge, derived_beta_union, vertex_web_search_beta, user_beta_preserved,
  response_header_prefixes, catalog_model_list, auth_missing_401, conversation_betas, catalog_created_at_default,
  header_merge_precedence. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_headers* using HelperCase: kind: helper
  and the externally tagged anthropic_headers variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_headers that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 196 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 240 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 60 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
