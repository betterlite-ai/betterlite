id: B1378
title: Configure Gemini Live sessions and normalize GA client options
description: >-
  Implement gemini_live_setup owning realtime/transformation.py L84-L98, L112-L115,
  L191-L211, L277-L522, L642-L677 and L1646-L1693: 307 nonblank noncomment lines,
  plus setup/activity types at gemini.py L102-L151. Resolve gemini_live_defer_setup from
  litellm_settings or LITELLM_GEMINI_LIVE_DEFER_SETUP, default false; environment parsing
  is lower-case equality to true without whitespace trimming. Config test
  loads_gemini_live_defer_setup must exercise both forms. requires_session_configuration
  returns its inverse. Studio Live defaults base to wss://generativelanguage.googleapis.com
  only for None, converts http(s) schemes and appends the v1beta GenerativeService RPC
  path plus raw key query; only None triggers B1331 key fallback or missing-key error.
  Preserve empty explicit values and redact the key from diagnostics. Headers are unchanged.
  Map instructions, temperature, max_response_output_tokens, modalities, tools via B1308,
  input_audio_transcription, turn_detection and voice via B1309. Tools sit outside
  generationConfig; transcription is enabled by any non-None value. Drop OpenAI voices
  alloy/ash/ballad/cedar/coral/echo/marin/sage/shimmer/verse case-insensitively with the
  source warning. semantic_vad without create_response is omitted; an explicit boolean
  create_response controls disabled inversely, server_vad defaults enabled, other forms
  disabled. Preserve integer prefix/silence durations, including Python bool-as-int.
  Normalize output_modalities only when modalities is absent, nested audio.input.transcription
  only when its flat key is absent, nested turn detection only without a flat dict, and
  truthy audio.output.voice over the flat voice. Catalog lookup tries exact model then the
  first-prefix-stripped model and gemini/variant. Default output is TEXT for mode
  audio_transcription, AUDIO otherwise; remove TEXT for audio-only models and AUDIO for
  text-only models, supplying the compatible modality when removal leaves none.
  First session.update sends one setup with model=models/model, default modality and input
  transcription; later updates send nothing, warning specifically for create_response=false.
  Automatic setup sends the same default modality/transcription but no output transcription.
  decode_gemini_live_setup reads setup JSON for consumers. session.created lowers setup
  modalities, strips the final /models/ prefix, copies instructions only when a string and
  uses injected event UUID plus logging session ID. Helper gemini_live_setup cases ga_aliases,
  nested_voice_wins, stock_voice_warning, semantic_vad_override, native_audio_coercion,
  transcription_model_default, first_setup, later_guardrail_update, created_model_name and
  empty_explicit_key cover these branches. Budget 310 implementation, 65 config, 180 tests,
  100 adapters and 95 fuzz lines, cap 800.
scope:
