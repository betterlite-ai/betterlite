    why: The endpoint-not-configured text, the discovery join, bridge relay and S256 checks.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L1357-L1672
    why: Persisted client resolution, reuse, stale check and persistence.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L1687-L1815
    why: Upstream registration post, ephemeral client mint and its policy.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L1818-L1923
    why: The needed-endpoint gates and register_client_with_server.
  - url: https://www.rfc-editor.org/rfc/rfc7591
    why: The registration request and response shapes.

dod:
  - text: endpoint_not_configured_detail, the two needed-endpoint gates, server_with_endpoints, bridge_relays_registration and require_s256 give LiteLLM's results, texts included.
    proof: [dcr-tests]
  - text: Persisted client resolution never reads the store for a server with a row, reads it for a rowless config-declared server only, and treats a store failure as no client.
    proof: [dcr-tests]
  - text: persist_registration skips client-forwarded servers, fails on a response without client_id, reuses a stored client, stores only client_secret_basic as the method, and falls back to the store upsert and in-memory overlay when no row updates.
    proof: [dcr-tests]
  - text: The ephemeral client is minted once per server and base url within 600 seconds, single-flight per server, normalizes the auth method and answers 502 for an unusable response.
    proof: [dcr-tests]
  - text: resolve_ephemeral_client returns None for modes that do not mint and fails before any upstream call for a missing authorization url, a non-S256 pair or an untrusted redirect.
    proof: [dcr-tests]
  - text: register_client_with_server follows the dummy, reuse, stale, relay, persist and redirect_uris rewrite rules in LiteLLM's order.
    proof: [dcr-tests]

checks:
  optional: []
  commands:
    - id: dcr-tests
      why: the shared checks, persisted client logic, ephemeral mint or register flow have no passing behavior tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::dcr_flows::/)'

oracle_cases: []

deviations:
  - what: A registration reply whose body is not JSON answers 502 with a string detail.
    why: LiteLLM's response.json() raises and the proxy answers 500; a typed 502 is the honest status and the case cannot be reached with a working IdP.
  - what: The ephemeral client cache and mint locks live in one DcrFlows value, not in module globals.
    why: Repository rule says no module-level state. Behavior for one process is the same.

out_of_scope:
  - "authorize_with_server and exchange_token_with_server: B7532."
  - "State, sealed codes, client_supplied_redirect_uris and redeem_passthrough_code: B7530. The route layer and the OauthFlows implementation: B7321."
  - "ensure_oauth2: B4719 (oauth2_gate.rs)."
  - "hydrate_config_server_dcr_client, PersistedDcrCredentials, parse_persisted_credentials, decrypt_credential: B6595."
  - "The faults package (classify_upstream_dcr_rejection, dcr_fault_detail): B7970, which implements the FaultRenderer port; this task only uses the port."
  - "The POST /register route (register_client): B7971."

pitfalls:
  - The stale check in register uses the stored registration_url field, while the relay and registration decisions use the effective url, so they differ for a discovered server.
  - A server that has a row is never matched against the config store, even when its row has no client_id, so a colliding server id cannot inherit a config server's client.
  - Only the exact text client_secret_basic is stored as the auth method; client_secret_post and every other value are stored as null.
  - The mint lock is keyed by server_id but the cache key also has the base url, so two origins mint twice yet never race on one server.
  - The reused outcome from persist_registration returns the dummy reply, not the upstream body.
  - grant_types, response_types and the auth method default differently for a relay bridge ("authorization_code" and "refresh_token", "code", "none") and for every other server (empty).
  - fallback_client_id is used before server_name for the dummy client_id, and server_name can be empty.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
