dod:
  - text: >-
      The AttributeMapper trait is implemented with one map method dispatched on payload type,
      returning an empty dict for unknown spans.
    proof: [mapper-protocol]
  - text: >-
      GenAI and legacy mappers each implement the AttributeMapper trait with their own tables.
      LLM call spans include tool definitions up to the budget; service spans include db_span_attributes
      (from B3848); guardrail spans include all named attributes; MCP spans omit guardrail/service keys.
    proof: [genai-mapper, legacy-mapper]
  - text: >-
      Mappers dispatch on span type and apply their extractor table, dropping None-valued entries.
      Tool definitions are collected with tool_attr_budget distributing the span-wide ceiling across mappers.
    proof: [mapper-dispatch, tool-budget]
  - text: >-
      Message serialization preserves multimodal content lists and tool-call fields; output_messages extracts
      the message from each choice; stringify_message and serialize_messages handle fallbacks on JSON encode failure.
    proof: [message-serialization]
  - text: >-
      Legacy transformation functions normalize messages/choices/Responses API output into {role, parts} format,
      handling both string and list content, multimodal parts, Pydantic models and LiteLLM wrapper objects.
    proof: [legacy-transforms]
  - text: >-
      set_tools_attributes emits name/description/parameters off raw function dicts with every field always written
      (None coerced to empty string, missing parameters serialized as JSON string "null"), using legacy llm.request.functions.* prefixes.
      _tool_calls_kv_pair emits only name/arguments off Function's own fields and only when truthy, using gen_ai.completions.*.function_call.* prefixes.
    proof: [tool-functions, helper-python]
checks:
  optional: []
  commands:
    - id: mapper-protocol
      why: The AttributeMapper trait does not exist or lacks the required map method
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::base::tests::mapper_protocol(::|$)/)'
    - id: genai-mapper
      why: GenAI mapper attributes, dispatch or tool collection fail
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::genai::tests::(::|$)/) - test(/replays_the_/)'
    - id: legacy-mapper
      why: Legacy mapper attributes, dispatch or tool collection fail
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::legacy::tests::(::|$)/) - test(/replays_the_/)'
    - id: mapper-dispatch
      why: Mappers do not dispatch on span type or return incorrect results
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::dispatch_tests::(::|$)/)'
    - id: tool-budget
      why: Tool attribute budget is not computed or is not split across mappers
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::utils::tests::tool_budget(::|$)/)'
    - id: message-serialization
      why: Message serialization, multimodal content extraction or fallback handling fails
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_transforms::message_tests::(::|$)/)'
    - id: legacy-transforms
      why: Message/choice/Responses transformation functions do not produce {role, parts} output
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_transforms::legacy_tests::(::|$)/)'
    - id: tool-functions
      why: set_tools_attributes or _tool_calls_kv_pair produce incorrect key prefixes or missing attributes
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_transforms::tool_functions_tests::(::|$)/)'
    - id: helper-python
      why: The independently invoked MIT helper semantics must match the production functions.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3845::/)'
