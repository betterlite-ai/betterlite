id: B3845
title: OTel GenAI and legacy attribute mapping
description: >-
  Implement the attribute mapper contract and two mappers that transform span payloads into flat attribute dictionaries.
  The GenAI mapper emits the canonical OpenTelemetry GenAI semantic-convention attributes (gen_ai.*, litellm.*, Server.*, Error.*),
  keying all attribute names and enums so the engine itself never references them directly.
  The legacy mapper emits older semconv-ai / Traceloop naming (gen_ai.system, gen_ai.usage.*, llm.is_streaming) plus bare unprefixed service keys
  for backends that consume those names.

  Each mapper declares one extractor table per span kind (LLMCallSpanData, MCPToolCallSpanData, MCPListToolsSpanData, GuardrailSpanData, ServiceSpanData)
  mapping semantic keys to lambda extractors. The `map` method dispatches on span type, applies the appropriate table, and drops None-valued entries.

  For LLM call spans, both mappers project tool definitions with a shared budget that reserves space for multiple active vocabularies.
  Include utility functions for tool attribute budgeting, JSON serialization of messages and tool parameters, extracting message content from multimodal dicts,
  and applying extractor tables to span payloads. Keep message/choice/Responses transformations below GenAI mapping as complete functions
  for legacy attribute writers, preserving the exact LiteLLM conversions of string/list/object content into OTEL "parts" arrays.

  Implement set_tools_attributes, which hardcodes its own behavior independent of shared tables: pulls name/description/parameters directly off raw tool.get('function') dicts
  and writes every field through safe_set_attribute with None coerced to empty string and missing parameters serialized as the JSON string "null".
  Implement _tool_calls_kv_pair, which walks Function.__annotations__.keys() (name and arguments only, no description/parameters) and emits keys only when the value is truthy.
  Implement the four complete legacy transformation functions that normalize messages and Responses API output into the "{role, parts}" format.
