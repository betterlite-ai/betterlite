deviations: []
out_of_scope:
  - Mapper registry and resolve_mappers dispatch; that lives in B3846.
  - Message attribute population from request payloads; that is B3844's inference span projection.
  - Service datastore attribute names beyond db_span_attributes; db_system and db.statement belong to B3848.
  - Tool name/description extraction from parsed definitions; payload construction is B3843's ToolDefinition.
pitfalls:
  - The span-wide tool definition budget (32 attributes) is split across N active mappers; a mapper's share is budget/N rounded down, with at least 1 tool always kept legible even when N is large.
  - LiteLLM's GenAI mapper accesses error.error_type and error.message; the error record is optional and both fields may be None independently.
  - serialize_messages returns None on an empty list, not an empty JSON array, so downstream code omits the key from sparse spans.
  - Responses API items are Pydantic v2 models from the openai SDK with a model_dump() method, not dict-like objects with .get(); _to_dict handles both forms.
  - The cost breakdown keys in LiteLLM's GenAI mapper are "input", "output", "cache_read", "cache_creation", "tool_usage", "original", "discount_amount", "discount_percent", "margin_fixed_amount", "margin_percent", "margin_total_amount", all optional (None-valued when absent).
  - Tool definitions are limited by the budget before the span attribute limit; exceed the budget and the oldest tools are silently dropped.
review_level: standard
budget:
