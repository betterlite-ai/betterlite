id: B946
title: Responses file search tools
description: >-
  Define file_search function-tool replacement, result/citation shaping and query extraction using typed vector-search
  results from B090. Preserve include selection and file_citation indexes while keeping provider response assembly
  independent from retrieval execution.


  should_use_emulated_file_search (litellm/responses/file_search/emulated_handler.py:L47-L57) has no MIT runtime
  caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and no behavior case
  exercises that unused entry point.


  Implement crates/betterlite-core/src/api/responses_file_search_tools.rs. Use ResponsesFileSearchTooInput and ResponsesFileSearchTooResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions file_search_tool_replacement, include_search_results, file_citation_offsets,
  multiple_queries under api::responses_file_search_tools::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesFileSearchTools in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_file_search_tools: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/file_search/emulated_handler.py: _build_function_tool (L65-L105); litellm/responses/file_search/emulated_handler.py:
  _replace_file_search_tools (L108-L132); litellm/responses/file_search/emulated_handler.py: _get_field (L186-L190);
  litellm/responses/file_search/emulated_handler.py: _joined_content_text (L193-L197); litellm/responses/file_search/emulated_handler.py:
  _format_search_results_as_tool_output (L200-L225); litellm/responses/file_search/emulated_handler.py: _build_search_results_for_include
  (L228-L252); litellm/responses/file_search/emulated_handler.py: _build_file_search_call_output (L255-L279); litellm/responses/file_search/emulated_handler.py:
  _build_file_citation_annotations (L282-L309); litellm/responses/file_search/emulated_handler.py: _build_message_output
  (L312-L328); litellm/responses/file_search/emulated_handler.py: _extract_text_from_responses_output (L331-L342);
  litellm/responses/file_search/emulated_handler.py: _synthesize_responses_api_response (L345-L384); litellm/responses/file_search/emulated_handler.py:
  _prepare_emulated_file_search_call (L398-L413); litellm/responses/file_search/emulated_handler.py: _extract_tool_call_fields
  (L416-L425); litellm/responses/file_search/emulated_handler.py: _resolve_queries_from_args (L428-L437). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 219 owned nonblank/non-comment/non-docstring Python lines (267 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 239 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 471 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B090 (Vector stores), B171 (Direct helper oracle and URL path encoding), B902 (Responses
  shapes), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.
