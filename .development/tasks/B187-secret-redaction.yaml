id: B187
title: Secret and internal-detail redaction
description: >-
  Finish betterlite-redact secret text and internal-detail redaction from every function in secret_redaction.py
  18-147, composing B244 structured masking and B243 event scrubbing through an injected Redactor. Compile regexes
  in the constructor; use linear regex matching plus bounded delimiter scans for lookaround cases. Match all roughly
  25 case-insensitive pattern alternations, preserving benign lookalikes; AKIA, sk- and Bearer are case-insensitive.
  Do not clone the Python Rust bridge: force LITELLM_RUST=false for Python oracle children before import. redaction
  fuzzing feeds text and bounded structured projections. Budget 270 text scrubbers, 100 adapters, 320 tests/fuzz
  and 50 wiring (740 total). Write the behavior rstest functions secret_redaction_redaction_tests_behavior in adjacent tests.rs
  files, with a named case for each behavior and failure in the DoD; corpus replay tests have separate names. Register
  helper operations redaction in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py; each operation
  has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - deny.toml
  - crates/betterlite-redact/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/redact/redaction.rs
  - tools/oracle/src/helpers/redact/redaction/**
  - tools/oracle/helpers/redaction.py
  - tools/oracle/helpers/redaction/**
  - tools/oracle/cases/helpers/redaction/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/secret_redaction.py#L18-L147
  why: Secret patterns, internal details and structured value replacement.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rust_bridge/configuration.py#L9-L33
  why: LITELLM_RUST selects the Python fallback before import.
dod:
- text: >-
    All secret families, key-name masking, internal paths/hosts and benign lookalikes match the listed direct helper
    cases.
  proof:
  - oracle
  - helper-python
- text: >-
    Malformed credential strings, large near-matches and deep structures terminate within bounds without exposing
    supplied secret sentinels in errors or Debug.
  proof:
  - redaction-tests
  - redaction-corpus
- text: Structured scrubbing retains non-secret values and container shape and cannot mutate the caller's payload.
  proof:
  - redaction-tests
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: redaction-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-redact --no-tests=fail -E 'test(/::secret_redaction_redaction_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: redaction-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-redact/fuzz/corpus/redaction)"
      && test -f crates/betterlite-redact/fuzz/fuzz_targets/redaction.rs && test -n "$(ls -A crates/betterlite-redact/fuzz/corpus/redaction)"
      && cargo nextest run --locked -p betterlite-redact --no-tests=fail -E 'test(replays_the_redaction_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'redaction' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/redaction/pem.yaml
- tools/oracle/cases/helpers/redaction/bearer-basic-jwt.yaml
- tools/oracle/cases/helpers/redaction/provider-keys.yaml
- tools/oracle/cases/helpers/redaction/cloud-credentials.yaml
- tools/oracle/cases/helpers/redaction/url-query-sas.yaml
- tools/oracle/cases/helpers/redaction/database-userinfo.yaml
- tools/oracle/cases/helpers/redaction/service-account.yaml
- tools/oracle/cases/helpers/redaction/traceback-path-host.yaml
- tools/oracle/cases/helpers/redaction/benign-lookalikes.yaml
- tools/oracle/cases/helpers/redaction/mixed-case-secrets.yaml
- tools/oracle/cases/helpers/redaction/query-lookbehind.yaml
- tools/oracle/cases/helpers/redaction/near-match-limit.yaml
deviations: []
out_of_scope:
- Content privacy policy and callback trust boundaries are B188.
- Sentry setup/export and third-party logger integration are later M5 tasks.
- All sensitive_data_masker functions are B244; all sentry_scrubbing functions are B243.
- >-
  Structured depth/byte bounds replace containers with REDACTED (B244), while the Sentry walker uses [Filtered]
  (B243).
pitfalls:
- 'The oracle helper for this task is pre-registered as redaction in the redact group. Replace the stub Op in tools/oracle/src/helpers/redact/redaction.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/redaction.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Secret-bearing URLs can have several query parameters; scrubbing the first must not expose the next.
- Error causes may contain secrets even when their outer Display message is safe.
- The Python redactor delegates through a Rust bridge; the oracle must explicitly select its Python fallback.
- The joined secret regex uses re.IGNORECASE; lowercase AWS prefixes and mixed-case Bearer must still match.
- Set LITELLM_RUST=false before importing the oracle module to force Python behavior.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
