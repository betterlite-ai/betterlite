id: B187
title: Secret and internal-detail redaction
description: >-
  Create betterlite-redact as a dependency-light redaction crate shared by errors and logging, with no dependency
  on either. Implement secret-text, structured-key/value and client-infrastructure scrubbing for the pinned pattern
  families; use secrecy at credential boundaries and scrub ordinary untrusted text before any diagnostic emission.
  Compile patterns in the injected redactor constructor rather than globals. Compare a maintained linear-time regex
  engine plus explicit delimiter handling with backtracking alternatives; Python lookbehind must not be copied into
  an incompatible Rust engine or replaced by unbounded backtracking. Support typed structured traversal through
  an explicitly named passthrough field only, retaining container shape and rejecting excessive bytes/depth. Add
  redaction helper cases covering each credential family and benign lookalikes, and a redaction fuzz target with
  replay. Budget 300 scrubber lines, 90 adapters and 350 tests. Seed B171's shared helper_case corpus with every
  added operation and replay it through the common typed parser.
scope:
  paths:
  - Cargo.toml
  - deny.toml
  - crates/betterlite-redact/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/redaction/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/secret_redaction.py#L18-L147
  why: Secret patterns, internal details and structured value replacement.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/sensitive_data_masker.py#L33-L307
  why: Structured credential masking.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/sentry_scrubbing.py#L34-L152
  why: Event/repr field scrubbing without enabling a Sentry exporter.
dod:
- text: All secret families, key-name masking, internal paths/hosts and benign lookalikes match the listed direct
    helper cases.
  proof:
  - oracle
- text: >-
    Malformed credential strings, large near-matches and deep structures terminate within bounds without exposing
    supplied secret sentinels in errors or Debug.
  proof:
  - redaction-tests
  - redaction-corpus
- text: Structured scrubbing retains non-secret values and container shape and cannot mutate the caller's payload.
  proof:
  - redaction-tests
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: redaction-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-redact --no-tests=fail -E 'test(/redaction/)'
  - id: redaction-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f crates/betterlite-redact/fuzz/fuzz_targets/redaction.rs && test -n "$(ls -A crates/betterlite-redact/fuzz/corpus/redaction)"
      && cargo nextest run --locked -p betterlite-redact --no-tests=fail -E 'test(replays_the_redaction_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/redaction/pem.yaml
- tools/oracle/cases/helpers/redaction/bearer-basic-jwt.yaml
- tools/oracle/cases/helpers/redaction/provider-keys.yaml
- tools/oracle/cases/helpers/redaction/cloud-credentials.yaml
- tools/oracle/cases/helpers/redaction/url-query-sas.yaml
- tools/oracle/cases/helpers/redaction/database-userinfo.yaml
- tools/oracle/cases/helpers/redaction/structured-short-secret.yaml
- tools/oracle/cases/helpers/redaction/service-account.yaml
- tools/oracle/cases/helpers/redaction/traceback-path-host.yaml
- tools/oracle/cases/helpers/redaction/benign-lookalikes.yaml
- tools/oracle/cases/helpers/redaction/sentry-json-string.yaml
deviations: []
out_of_scope:
- Content privacy policy and callback trust boundaries are B188.
- Sentry setup/export and third-party logger integration are later M5 tasks.
pitfalls:
- Secret-bearing URLs can have several query parameters; scrubbing the first must not expose the next.
- Error causes may contain secrets even when their outer Display message is safe.
- The Python redactor delegates through a Rust bridge; the oracle must explicitly select its Python fallback.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
