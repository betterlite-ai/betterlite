deviations:
  - what: Authorization header is always built by _get_headers with Content-Type and Accept headers; when api_key is None, Authorization is omitted.
    why: LiteLLM does the same; the spec does not require dropping all headers when the key is absent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/generic_prompt_management/generic_prompt_manager.py#L86-L94
  - what: Variable substitution with {key} and {{key}} syntax happens on every cache hit with variables, not just on cache misses; a cached prompt is re-substituted rather than cached-post-substitution.
    why: LiteLLM does the same; the cache stores the raw template and applies variables on every retrieval.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/generic_prompt_management/generic_prompt_manager.py#L350-L385
out_of_scope:
  - "get_chat_completion_prompt (L424-L454) and async_get_chat_completion_prompt (L387-L422): these methods delegate to PromptManagementBase methods owned by B4058. This task builds the _compile_prompt_helper and async_compile_prompt_helper methods that do the actual compilation; B4058 wraps them with the completion hooks and the should_run_prompt_management gate."
  - "set_global_generic_prompt_config (__init__.py#L19-L31) and global_generic_prompt_config (__init__.py#L16): betterlite does not support runtime global configuration; users configure generic_prompt_config through the config file instead. This task builds the config-driven prompt_initializer; runtime globals are not betterlite's pattern."
  - "Integration with routing, retries, fallbacks, or logging: these tasks call this task but are not called by it."
  - "CustomPromptManagement base class and PromptManagementBase completion hooks: these are owned by B4050."
  - "PromptSpec, PromptInfo, and PromptLiteLLMParams types: owned by B4050."
pitfalls:
  - "The _get_headers method must construct a dict literal, not return the same dict across calls; modifying the returned dict would mutate a shared instance."
  - "Cache key construction uses colon separators: prompt_id:label:version; all three are included even when some are None, so None values appear in the key string."
  - "_apply_variables must substitute every occurrence of each variable in each message; a message with multiple occurrences of the same variable gets all of them replaced."
  - "_apply_variables supports both {key} and {{key}} syntax (double braces); it replaces the {variable_name} form first, then the {{variable_name}} form, so a template can use either or both."
  - "The _compile_prompt_helper and async_compile_prompt_helper methods raise ValueError wrapping any exception, including from API fetch, JSON parsing, and variable application."
  - "should_run_prompt_management returns true when prompt_id is not None or when provider_specific_query_params exist in the PromptSpec's litellm_params; an empty dict of params still counts as present."
review_level: security
budget:
  max_changed_lines: 1000
