id: B4057
title: Generic prompt API fetching and compilation cache
description: >-
  Build GenericPromptManager integrating with the prompt management system to fetch
  and cache prompts from any API implementing the /beta/litellm_prompt_management endpoint.
  The manager initializes with api_base, optional api_key, timeout, and optional prompt_id,
  storing these to fetch prompts on compile_prompt calls. Every API request includes an
  Authorization header when api_key is present, as Bearer {api_key}. The in-memory cache
  maps (prompt_id, label, version) tuples to compiled results; _get_cache_key builds
  the tuple and _common_caching_logic checks the cache and optionally applies variables
  before returning. The cache persists across requests and persists across variable
  substitutions, so a prior cache hit with no variables can be returned directly to
  satisfy a second identical request with variables. Implement cache management with
  _get_cache_key, _common_caching_logic, and clear_cache; the latter empties the cache
  so a subsequent compile_prompt re-fetches from the API. The _compile_prompt_helper
  and async_compile_prompt_helper methods fetch the API response, parse it into a
  PromptManagementClient record, cache the result, and apply prompt variables using
  {variable_name} or {{variable_name}} syntax before returning. The _apply_variables
  method substitutes every occurrence of each variable in the template messages' content
  fields. Build prompt_initializer and prompt_initializer_registry in __init__.py; the
  initializer takes PromptLiteLLMParams and PromptSpec, extracts api_base (required),
  api_key (optional), timeout (defaults to 30), and provider_specific_query_params,
  and builds a GenericPromptManager instance. The registry maps
  SupportedPromptIntegrations.GENERIC_PROMPT_MANAGEMENT to the initializer function.
  Preserve every behavior from the reference code: default timeout 30 seconds, Bearer
  prefix in the Authorization header, cache-after-fetch semantics, the syntax for both
  {key} and {{key}} variables, the API endpoint and param names.
