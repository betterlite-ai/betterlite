id: B1036
title: Batch provider create
description: >-
  Implement provider batch creation and timeout precedence using B010 and configured provider credentials. Preserve
  input_file_id, endpoint, completion_window and metadata; use base transform contracts and provider adapters from
  M3 without endpoint-specific transport duplication.


  Implement crates/betterlite-core/src/api/batch_provider_create.rs. Use BatchProviderCreateInput and BatchProviderCreateResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions batch_create_body, completion_window, timeout_precedence, provider_create_error
  under api::batch_provider_create::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.api_base
  defaults to None; env.OPENAI_BASE_URL defaults to unset (None); env.OPENAI_API_BASE defaults to unset (None);
  litellm_settings.organization defaults to None; env.OPENAI_ORGANIZATION defaults to None; litellm_settings.api_key
  defaults to None; litellm_settings.openai_key defaults to None; env.OPENAI_API_KEY defaults to unset (None); env.AZURE_API_BASE
  defaults to unset (None); litellm_settings.api_version defaults to None; env.AZURE_API_VERSION defaults to unset
  (None); litellm_settings.azure_key defaults to None; env.AZURE_OPENAI_API_KEY defaults to unset (None); env.AZURE_API_KEY
  defaults to unset (None); env.AZURE_AD_TOKEN defaults to unset (None); litellm_settings.vertex_project defaults
  to None; env.VERTEXAI_PROJECT defaults to unset (None); litellm_settings.vertex_location defaults to None; env.VERTEXAI_LOCATION
  defaults to unset (None); env.VERTEXAI_CREDENTIALS defaults to unset (None). No environment reads occur outside
  betterlite-config. Test api::batch_provider_create::tests::loads_settings uses the production Config loader and
  an injected environment map, with a named rstest case for every key above, explicit override, unset/default and
  invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key report; a
  grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder rather
  than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::BatchProviderCreate in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_provider_create: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/batches/main.py: _resolve_timeout (L68-L104); litellm/batches/main.py: acreate_batch
  (L108-L168); litellm/batches/main.py: create_batch (L172-L375). Abstract/protocol declarations map to native types
  and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 257 owned nonblank/non-comment/non-docstring Python lines (275 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 277 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 90 config tests/seeds and
  30 wiring; 599 total within the 600-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B171 (Direct helper oracle and URL path encoding),
  B1019 (File routing ids), B1035 (Batch records), B1087 (Api boundaries), B517 (OpenAI batch lifecycle), B002 (Load
  LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
