    why: process_response and store_valid_response, the facts read after validation.
  - url: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/response.py#L24-L326
    why: Response construction (DTD refusal, encrypted assertions) and is_valid, every check and its order.
  - url: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/response.py#L328-L617
    why: Status, Conditions and AuthnStatement counts, audiences, issuers, NameID, session and attribute reads.
  - url: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/response.py#L619-L793
    why: One assertion, the signed-element rules and the 300 s timestamp drift.
  - url: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/utils.py#L306-L327
    why: get_self_url_no_query, the receiving URL for Destination and Recipient.
  - url: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/utils.py#L398-L428
    why: parse_SAML_to_time and now() in whole UTC seconds.
  - url: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/settings.py#L286-L333
    why: Security defaults LiteLLM leaves alone, wantAttributeStatement and allowRepeatAttributeName among them.
  - url: https://docs.rs/samael/0.0.22/samael/crypto/trait.CryptoProvider.html
    why: reduce_xml_to_signed and ReduceMode, the only samael call.
dod:
  - text: >-
      A response is accepted only when every Response or Assertion signature verifies against the IdP signing
      certificates in the merged settings; unsigned, wrong-key, SHA-1 signed, tampered, wrapped and DOCTYPE
      responses, encrypted assertions and a setup with no IdP certificate are refused whatever SAML_STRICT and the two want flags say.
    proof: [saml-signature-verifier]
  - text: >-
      With SAML_STRICT on, a response passes python3-saml 1.16.0's is_valid checks with their literals, including the
      300 s drift on Conditions only, the required AttributeStatement, Destination and Recipient against the receiving
      URL, audience, issuers, SessionNotOnOrAfter, the bearer SubjectConfirmation and both want flags; SAML_STRICT=false
      skips exactly that block.
    proof: [saml-signature-rules, saml-signature-verifier]
  - text: >-
      VerifiedResponse carries only signed identity facts, and a repeated attribute Name, a missing or empty NameID in
      strict mode and an SPNameQualifier other than the SP entity id are refused.
    proof: [saml-signature-rules, saml-signature-verifier]
  - text: The port takes the merged settings and the provider clock, prepared_settings is public, and B1625's provider and entrypoint tests pass on it.
    proof: [saml-port-tests]
  - text: >-
      samael comes in only through betterlite-auth's non-default saml feature, forwarded by betterlite-server and
      betterlite; no workspace member's default graph and no feature of the wheel reaches it, and cargo deny passes
      with the approved wrappers and skips.
    proof: [saml-feature-wiring, saml-deny-wrappers, deny]
  - text: The saml feature passes clippy with -D warnings over every target of betterlite-auth.
    proof: [saml-feature-clippy]
  - text: >-
      CI installs libclang-dev, libxml2-dev, libxmlsec1-dev, libssl-dev and pkg-config only in the task part of a task
      whose file names --features saml and in the saml part, and every run that tests everything starts that part.
    proof: [saml-ci-wiring]
  - text: B1631's signer signs the Assertion, the Response or both and still passes its ruff and basedpyright checks.
    proof: [saml-fixture-driver]
checks:
  optional: []
  commands:
    - id: saml-signature-rules
      why: The response rules are missing or don't build without the saml feature.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^saml_signature::/)'
    - id: saml-signature-verifier
      why: The samael verifier is missing or accepts a response python3-saml refuses.
      run: cargo nextest run --locked -p betterlite-auth --features saml --no-tests=fail -E 'test(/^saml_signature::xmlsec::/)'
    - id: saml-feature-clippy
      why: Code behind the saml feature fails clippy; the gate's default build never compiles it.
      run: cargo clippy --locked --all-targets -p betterlite-auth --features saml -- -D warnings
    - id: saml-port-tests
      why: The port doesn't pass settings and time, or B1625's tests break on the new port.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^saml_provider::.*verify_response_passes_the_settings_and_the_clock$/)' && cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail -E 'test(/^saml_provider::/) | test(/^saml_entrypoints::/)'
    - id: saml-feature-wiring
      why: The feature isn't forwarded, or samael reaches a default build or the wheel.
      run: |-
        set -e
        cargo tree --locked -p betterlite-server --features saml -e normal -i samael | grep -q -x 'samael v0.0.22'
        cargo tree --locked -p betterlite --features saml -e normal -i samael | grep -q -x 'samael v0.0.22'
        if cargo tree --locked --workspace -i samael > /dev/null 2>&1; then echo "a workspace member turns samael on by default"; exit 1; fi
        if cargo tree --locked -p betterlite-python --all-features -i samael > /dev/null 2>&1; then echo "a betterlite-python feature reaches samael"; exit 1; fi
    - id: saml-deny-wrappers
      why: deny.toml lacks the openssl wrappers Max approved for samael.
      run: |-
        set -e
        grep -q -F '{ crate = "openssl", use-instead = "rustls", wrappers = ["samael"] }' deny.toml
        grep -q -F '{ crate = "openssl-sys", use-instead = "rustls", wrappers = ["openssl", "samael"] }' deny.toml
    - id: saml-ci-wiring
      why: CI never installs the native libraries for the feature or never builds it after merge.
      run: |-
        set -e
        grep -q -F 'echo "saml=true"' .github/workflows/gate-part.yml
        grep -q -F 'libclang-dev libxml2-dev libxmlsec1-dev libssl-dev pkg-config' .github/workflows/gate-part.yml
        grep -q -E '^ +saml\)$' .github/workflows/gate-part.yml
        grep -q -F '["saml"]' .github/workflows/gate.yml
    - id: saml-fixture-driver
      why: The oracle signer can't sign the Response, or its Python fails the folder's checks.
      run: |-
        set -e
        grep -q -E '^    signed_element: ' tools/oracle/fixtures/saml-idp/driver.py
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/fixtures/saml-idp
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/fixtures/saml-idp/pyrightconfig.json
oracle_cases: []
deviations:
  - what: >-
      A signature whose ds:SignatureMethod is rsa-sha1 or dsa-sha1, or whose ds:DigestMethod is sha1, is refused, as
      python3-saml 1.16.0 does with rejectDeprecatedAlgorithm on; LiteLLM leaves that setting at its default false, so it
      accepts SHA-1 signed login responses.
    why: >-
      SHA-1 is broken for collisions, and a forged signature on a login response is an account takeover. Okta, Entra ID,
      Google and ADFS sign with SHA-256 by default, so only an IdP still set to SHA-1 has to change.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/sso/saml_sso.py#L184-L222
  - what: >-
      A strict response is not validated against python3-saml's saml-schema-protocol-2.0.xsd; the typed model, the
      one-assertion rule and the signature placement rules refuse malformed documents instead, so a response that
      breaks only the schema can pass where LiteLLM answers 401.
    why: The XSD bundle and a schema validator are outside python3-saml's call path this task ports, and every rule an attacker needs to break is checked directly.
    link: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/response.py#L101-L107
  - what: An AttributeValue that holds a saml:NameID child contributes the NameID text, where python3-saml adds a dict that LiteLLM's attribute mapping then fails on.
    why: VerifiedAttribute carries strings, and the dict form gives a LiteLLM user nothing but a 401.
    link: https://github.com/SAML-Toolkits/python3-saml/blob/v1.16.0/src/onelogin/saml2/response.py#L604-L612
out_of_scope:
  - B1626 owns the ACS form, browser binding, the replay guard, identity mapping and the SAML callback HTTP cases; it calls prepared_settings and verify_response.
  - Picking XmlSignatureVerifier under cfg(feature = "saml") where the server builds SamlProvider belongs to that construction site (B063, then B1626).
  - Decrypting assertions, SP keys and SAML logout; LiteLLM configures none of them.
  - Release builds with the feature; nothing in packaging/ or python-wheels.yml turns it on.
pitfalls:
  - Element and decode_document are pub(crate), so a pub function taking &Element trips private_interfaces and a pub(crate) one only xmlsec calls trips dead_code in the default build; pub functions take bytes, &MergedSettings or this task's own model types, and the Element walk stays private behind a pub parse.
  - samael's ServiceProvider::parse_xml_response skips signature verification when it has no IdP signing certificate and adds a 90 s IssueInstant cap python3-saml lacks, so call reduce_xml_to_signed directly and refuse an empty certificate list first.
  - The response's own ds:KeyInfo X509Certificate is attacker input; only settings.idp certificates verify.
  - ALLOWED_CLOCK_DRIFT 300 applies to Conditions NotBefore and NotOnOrAfter only; SubjectConfirmationData times compare with now exactly.
  - wantAttributeStatement defaults to True in python3-saml and LiteLLM never sets it, so a strict response without saml:AttributeStatement is refused.
  - Recipient passes when it contains the receiving URL as a substring, while Destination must start with it.
  - SAML_STRICT=false skips want_assertions_signed, so a Response-only signature is accepted there but refused in strict mode under the default SAML_WANT_ASSERTIONS_SIGNED=true.
  - An unsigned Response wrapper can carry its own Subject next to the signed Assertion, so no identity fact may come from the original document.
  - xmlsec's canonicalization and RSA over a body up to B1626's 5 MiB cap block the thread, so they run in spawn_blocking and nowhere else.
  - IdpMetadataError has no PartialEq, so SamlVerificationError loses its derive and B1625's two verify_response tests switch to matches!; saml_provider/tests.rs is near its 1000-line cap.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
