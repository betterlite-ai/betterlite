    why: handle_acs, the call site; process_response with the browser cookie as request_id, then get_errors and is_authenticated.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/sso/saml_sso.py#L184-L222
