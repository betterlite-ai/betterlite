id: B10228
title: Verify SAML response signatures with samael behind a non-default saml feature
description: >-
  B1625 left SAML login with a SamlResponseVerifier port in crates/betterlite-auth/src/saml_provider/verify.rs and
  only UnavailableSamlVerifier behind it, so no response is ever accepted. This task adds the real verifier on samael
  0.0.22 with xmlsec, behind a `saml` cargo feature that is off by default (Max, 11-28): OpenSSL, libxml2 and xmlsec
  stay out of the default build, the gateway and backend images and the Python wheels. B1626 then calls it from POST
  /sso/saml/callback. LiteLLM's handle_acs hands the whole check to one python3-saml 1.16.0 call,
  auth.process_response(request_id=browser_request_id). It runs Response.is_valid and then store_valid_response,
  and this task ports what that call checks and what it reads, with LiteLLM's settings from _build_settings.


  Feature wiring. betterlite-auth gets `samael = { version = "0.0.22", optional = true }` in [dependencies] (name
  order) and a new `[features]` table with `saml = ["dep:samael", "tokio/rt"]`; betterlite-server adds `saml =
  ["betterlite-auth/saml"]` to its [features] table next to testing; crates/betterlite gets `[features]` with `saml =
  ["betterlite-server/saml"]`. No other Cargo.toml and no pyproject.toml names the feature, so `cargo build -p
  betterlite --features saml` is the only way in, and betterlite-python, betterlite-gateway and betterlite-backend
  never link it.


  The port. Once B1625 has merged, change the trait method to `verify(&self, request: &VerifyRequest<'_>, settings:
  &MergedSettings, now: i64)`, keep UnavailableSamlVerifier answering Unavailable, make SamlProvider::prepared_settings
  pub, and make SamlProvider::verify_response take `settings: &MergedSettings` and pass `(self.clock)()`. B1626 then
  loads the settings with prepared_settings(urls, false) and gets the 501, 502 and 500 answers LiteLLM's
  _build_auth raises before process_response, then calls verify_response. A test named
  verify_response_passes_the_settings_and_the_clock proves the verifier gets both. SamlVerificationError::Rejected
  becomes `Rejected(#[from] ResponseRejection)`, with ResponseRejection defined in this task's module, one variant per
  python3-saml validation failure below; XML errors keep B1625's IdpMetadataError as their source, and
  `#[cfg(feature = "saml")] Signature(#[source] samael::crypto::CryptoError)` keeps xmlsec's. Update B1625's
  RejectingVerifier fake and its two verify_response tests.


  Module saml_signature in betterlite-auth (crates/betterlite-auth/src/saml_signature.rs and saml_signature/**). Only
  one submodule, declared `#[cfg(feature = "saml")] pub mod xmlsec;` in saml_signature.rs, names samael: it holds
  XmlSignatureVerifier, a unit struct implementing SamlResponseVerifier. Everything else compiles in the default build
  and is pub, so the gate's clippy lints it and main's scheduled runs test it: ResponseRejection, a typed model of the
  Response and its Assertion read from B1625's decode_document Element tree (saml_provider::idp_metadata::parse, reuse
  it, don't copy it), the checks over that model, the signing-certificate list and the projection into B1625's
  VerifiedResponse and VerifiedAssertion. Tests of that part live in the tests.rs beside each of those modules, on
  hand-written unsigned XML; tests of XmlSignatureVerifier live in saml_signature/xmlsec/tests.rs on the signed fixtures.


  What verify does, in python3-saml's order. (1) decode_document on response_xml, so a DOCTYPE or an entity is refused
  before libxml2 parses anything, as python3-saml's to_etree forbids DTDs. (2) An EncryptedAssertion or an EncryptedID
  is refused: LiteLLM configures no SP key, so python3-saml's decryption fails and handle_acs answers 401. (3) Version
  is "2.0", the Response has an ID, samlp:Status/samlp:StatusCode exists and its Value,
  when set, is urn:oasis:names:tc:SAML:2.0:status:Success, and the document holds exactly one saml:Assertion. (4) Signature
  placement as process_signed_elements and validate_signed_elements check it: each ds:Signature's parent is the
  samlp:Response or the saml:Assertion and has a non-empty ID, no two share an ID, a non-empty first ds:Reference URI is
  "#" plus that ID and no URI repeats, at most two signatures, and a Response signature sits only at
  /samlp:Response/ds:Signature and an Assertion one only at /samlp:Response/saml:Assertion/ds:Signature. (5) When
  settings.strict holds (SAML_STRICT, default true): the Response InResponseTo equals expected_request_id when both
  are present; exactly one Conditions; Conditions NotBefore later than now + 300 or NotOnOrAfter + 300 at or before now
  is refused; exactly one AuthnStatement; at least one AttributeStatement; no EncryptedAttribute; a non-empty
  Destination must start with the receiving URL after both have scheme and host lowercased, Destination="" is
  refused and a missing one passes; when any Audience is present, sp_entity_id is one of them; the Response Issuer
  (at most one, empty text ignored) and exactly one Assertion Issuer equal the IdP entity id; a SessionNotOnOrAfter at
  or before now is refused; at least one SubjectConfirmation whose Method is absent or
  urn:oasis:names:tc:SAML:2.0:cm:bearer has a SubjectConfirmationData whose InResponseTo, when it and the Response's
  are both set, matches, whose Recipient, when set, contains the receiving URL, whose NotOnOrAfter, when set, is after now
  and whose NotBefore, when set, is not after now; want_assertions_signed requires the Assertion signature and want_messages_signed
  the Response one. The receiving URL is `<scheme>://<host[:port]>/sso/saml/callback` taken from settings.acs_url,
  as python3-saml's get_self_url_no_query builds it from LiteLLM's http_host and script_name. (6) Whatever strict and
  the two flags say, at least one of the two signatures must exist. (7) The IdP certificates are
  settings.idp.x509_cert_multi.signing when it is non-empty, else settings.idp.x509_cert, each stripped of PEM armor
  and whitespace and base64-decoded; an empty list is refused here. (8) XmlSignatureVerifier passes the bytes and the
  certificates to `<samael::crypto::Crypto as CryptoProvider>::reduce_xml_to_signed` with
  ReduceMode::ValidateAndMarkNoAncestors inside tokio::task::spawn_blocking, awaiting the handle in place; it fails
  unless every signature verifies, and its output holds only verified content. (9) Identity facts come from that
  output, decoded again: the assertion whose ID matches the original's, its NameID (in strict mode a missing or empty
  NameID is refused, since LiteLLM sets wantNameId, and an SPNameQualifier must equal sp_entity_id), the NameID Format,
  SessionIndex, Issuer, Audiences, the first non-empty SubjectConfirmationData InResponseTo, and the attributes by
  Name with each value trimmed and empty ones dropped; a repeated Attribute Name is refused, since
  allowRepeatAttributeName defaults to false. not_on_or_after is the NotOnOrAfter of the SubjectConfirmationData that
  passed step 5, or None outside strict mode, so B1626 falls back to 3600 seconds. The Response's InResponseTo, Issuer
  and Destination come from the original root, and signed_response says whether a verified signature covers them.
  Timestamps parse like parse_SAML_to_time: yyyy-mm-ddThh:mm:ss, an optional fraction that is ignored, an optional Z,
  UTC; anything else is refused. A ds:SignatureMethod of rsa-sha1 or dsa-sha1 or a ds:DigestMethod of sha1 in any
  signature is refused before xmlsec runs, as process_signed_elements does with rejectDeprecatedAlgorithm on;
  LiteLLM leaves that setting at its default false and accepts SHA-1, so this is a deviation.


  Known LiteLLM bug to keep: the receiving URL drops any path in PROXY_BASE_URL while the IdP posts to the ACS URL that
  keeps it, so every strict response fails Destination there; list it under kept_bugs with the _prepare_request_data
  link.


  Fixtures. crates/betterlite-auth/src/saml_signature/fixtures/ holds idp-cert.pem and one XML file per case, made
  once and never at test time. Make a throwaway key and certificate in $TMPDIR with `openssl req -x509 -newkey
  rsa:2048 -sha256 -nodes -days 36500 -subj /CN=betterlite-saml-test-idp -keyout "$TMPDIR/saml-idp/key.pem" -out
  "$TMPDIR/saml-idp/cert.pem"`. Add `signed_element: Literal["assertion", "response", "both"] = "assertion"` to
  SigningInput in B1631's tools/oracle/fixtures/saml-idp/driver.py: response signs the finished samlp:Response with the
  same OneLogin_Saml2_Utils.add_sign call, both signs the assertion first and then the response, and mutation unsigned
  still signs nothing. Add `algorithm: Literal["sha256", "sha1"] = "sha256"` beside it: sha1 passes
  sign_algorithm=OneLogin_Saml2_Constants.RSA_SHA1 and digest_algorithm=OneLogin_Saml2_Constants.SHA1 to every add_sign; B1631's Rust side keeps sending the old input. Sign each case with `jq -n ... | uv run --locked
  --project tools/oracle/litellm python tools/oracle/fixtures/saml-idp/driver.py | base64 -d`, with key_directory
  $TMPDIR/saml-idp, issuer https://idp.example.test/metadata, subject alice@example.test, attributes {"email":
  ["alice@example.test"]}, audience https://proxy.example.test/sso/saml/metadata, destination
  https://proxy.example.test/sso/saml/callback, in_response_to ONELOGIN_request_1, assertion_id _assertion_1,
  issue_instant and not_before 2026-01-01T00:00:00Z and not_on_or_after 2026-01-01T01:00:00Z. The cases are
  signed-assertion, signed-response and signed-both (signed_element), signed-sha1 (algorithm sha1),
  unsigned, wrong-key, wrong-audience, wrong-destination and subject-confirmation-only (the driver's mutations), and expired (not_before
  2000-01-01T00:00:00Z, not_on_or_after 2000-01-01T01:00:00Z). Derive three more from signed-assertion.xml with perl:
  tampered (the NameID changed to mallory@example.test after signing), wrapped (an unsigned copy of the Assertion with
  ID _assertion_2 and NameID mallory@example.test inserted before the signed one) and doctype (`<!DOCTYPE
  samlp:Response [<!ENTITY e "x">]>` after the XML declaration). Copy cert.pem to fixtures/idp-cert.pem and delete the
  key; regenerating means every file again with a new key. Tests pass now = 1767227400 (2026-01-01T00:30:00Z) except
  at a boundary.


  CI. In .github/workflows/gate-part.yml, "Find the toolchains the task needs" adds `if grep -q -F -- '--features
  saml' "$file"; then echo "saml=true" >> "$GITHUB_OUTPUT"; fi`, and a new step after it, "Install the SAML signature
  libraries", runs `apt-get install --yes --no-install-recommends libclang-dev libxml2-dev libxmlsec1-dev libssl-dev
  pkg-config` if `steps.toolchains.outputs.saml == 'true' || matrix.part == 'saml'`, with a one-line comment that
  samael's build script runs bindgen and xmlsec1-config. The part case in "Run the gate's checks" gets a `saml)` branch
  that exports the rustc-turns.sh RUSTC_WRAPPER like the tests parts, runs `cargo clippy --locked --all-targets -p
  betterlite-auth -p betterlite-server --features betterlite-server/saml -- -D warnings || exit 1` and then `exec
  cargo nextest run --locked --no-tests=fail -p betterlite-auth --features saml -E 'test(/^saml_signature::/)'`. In
  .github/workflows/gate.yml the find step appends "saml" to the parts when all_tests is set, after the cache line,
  so the 01:17 UTC run and every run that tests everything build the feature, while pull requests, the queue and
  pushes build it only for a task that names it.


  deny.toml. The two bans become `{ crate = "openssl", use-instead = "rustls", wrappers = ["samael"] }` and `{ crate =
  "openssl-sys", use-instead = "rustls", wrappers = ["openssl", "samael"] }`, and skip gets "itertools@0.13.0",
  "openssl-probe@0.1.6", "prettyplease@0.2.37" and "shlex@1.3.0" under a one-line comment: bindgen 0.72 pulls the
  first, third and fourth and samael openssl-probe 0.1, beside the locked itertools 0.14 and 0.15, openssl-probe 0.2.2,
  prettyplease 0.3.0 and shlex 2.0.1. With samael added on 11-28 those six were cargo deny's only errors, and Max
  approved them; licenses, advisories and sources pass. samael 0.0.22 dates from 2026-07-07.


  The task has no mutants check: the mutants parts build default features, where the xmlsec module is not compiled,
  so its mutants could only be missed. Size: the call covers about 580 python3-saml code lines (is_valid 208, the
  getters 146, the signed-element rules 102, the rest under 35 each), about 450 of them live under LiteLLM's settings;
  estimate 520 Rust lines for the model, rules and facts, 60 for the xmlsec module, 70 for the port and its error, 40
  for CI, deny and manifests and 15 for the driver, near 700 counted lines.
scope:
  paths:
    - deny.toml
    - .github/workflows/gate.yml
    - .github/workflows/gate-part.yml
    - crates/betterlite-auth/src/saml_signature.rs
    - crates/betterlite-auth/src/saml_signature/**
    - crates/betterlite-auth/src/saml_provider/verify.rs
    - crates/betterlite-auth/src/saml_provider/provider.rs
    - crates/betterlite-auth/src/saml_provider/tests.rs
    - crates/betterlite-auth/src/saml_provider/tests/**
    - tools/oracle/fixtures/saml-idp/driver.py
  lint_tables: false
references:
