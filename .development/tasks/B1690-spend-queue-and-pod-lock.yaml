id: B1690
title: Supply bounded spend queues and Redis pod leases
description: >-
  Implement BaseUpdateQueue as betterlite-db::queues::memory and PodLockManager as
  betterlite-db::queues::pod_lock, covering both complete source files. A memory queue
  awaits capacity on add, preserves FIFO order and drains at most MAX_IN_MEMORY_QUEUE_FLUSH_COUNT
  available records per pass. Invoke its typed enqueue observer after admission; the base
  observer is empty, while later queue implementations supply metrics. Keep ownership of
  queued records through cancellation and shutdown instead of spawning a task per record.
  Warn when MAX_SIZE_IN_MEMORY_QUEUE is at least queue capacity, without silently changing
  the threshold. No debug event may include the raw spend update.
  Each PodLockManager gets one UUID v4 owner ID. Its key is cronjob_lock:{cronjob_id}; use
  B126's JSON-string cache encoding for the owner value. Acquire with SET NX and EX, taking
  truthy supplied ttl or DEFAULT_CRON_JOB_LOCK_TTL_SECONDS. No cache returns None, successful
  SET returns true, and a failed SET reads the owner: matching this pod returns true only
  when allow_reentrant, default true. Reentrant acquisition does not renew expiry. Contention
  and Redis/decode errors return false, with sanitized diagnostics. Only the reentrant
  success branch emits the source acquired event; an initial successful SET does not.
  Release uses the source Lua compare-and-delete, comparing the JSON-encoded owner, with a
  cached script handle. On script failure clear that handle, warn, then use the same GET,
  owner comparison and DEL fallback as a cache with no scripting. Preserve that fallback's
  non-atomic semantics in a controlled race test. Release errors are logged and swallowed;
  emit the released event only for result one. Decode legacy byte owner values as strict
  UTF-8 in decode_pod_owner(bytes), exercised by a db-crate fuzz target and replay.
  Send acquired/released service events through B012's typed service sink and B191's owned
  delivery mechanism: service POD_LOCK_MANAGER, call_type _emit_acquired_lock_event or
  _emit_released_lock_event, gauge_labels job:pod, gauge_value one/zero, and duration equal
  to the default TTL even when a custom lease duration was requested.
  Load LITELLM_ASYNCIO_QUEUE_MAXSIZE=1000, MAX_SIZE_IN_MEMORY_QUEUE=floor(capacity*0.8),
  MAX_IN_MEMORY_QUEUE_FLUSH_COUNT=1000 and DEFAULT_CRON_JOB_LOCK_TTL_SECONDS=60 in config's
  spend_queue module. decode_spend_queue_setting(name,text) parses integer environment
  values; loads_spend_queue_settings must exercise actual loader defaults and overrides.
  Queue capacity and default TTL must be positive, while a nonpositive flush count retains
  the source's empty drain. Reject arithmetic overflow with the offending setting name.
  Add an owned OracleRedis fixture to tools/oracle: launch the installed redis-server on
  an isolated temporary directory/port, wait for PING, expose a URI only to fixture config,
  and kill/wait/remove resources on drop or explicit shutdown. Never connect these tests
  to a user's Redis. Native tests use both a recording cache and real Redis for NX/expiry,
  JSON comparison, stale-owner release, reacquisition and cancellation. The pure pod_lock_key
  helper compares source key formatting; all lease outcomes are asserted by native tests.
  The two files contain 238 nonblank lines; fit queue/lease logic in 250, config/fixtures in
  130, behavior tests in 240 and adapters/fuzz in 180 changed lines.
scope:
  paths:
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/src/queues.rs
    - crates/betterlite-db/src/queues/memory.rs
    - crates/betterlite-db/src/queues/memory/**
    - crates/betterlite-db/src/queues/pod_lock.rs
    - crates/betterlite-db/src/queues/pod_lock/**
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/pod_owner.rs
    - crates/betterlite-db/fuzz/corpus/pod_owner/**
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/spend_queue.rs
    - crates/betterlite-config/src/spend_queue/**
    - crates/betterlite-config/fuzz/Cargo.toml
    - crates/betterlite-config/fuzz/fuzz_targets/spend_queue_setting.rs
    - crates/betterlite-config/fuzz/corpus/spend_queue_setting/**
    - tools/oracle/Cargo.toml
    - tools/oracle/src/lib.rs
    - tools/oracle/src/redis_fixture.rs
    - tools/oracle/src/redis_fixture/**
    - tools/oracle/src/helpers/mod.rs
    - tools/oracle/src/helpers/pod_lock_key.rs
    - tools/oracle/helpers/dispatch.py
    - tools/oracle/helpers/pod_lock_key.py
    - tools/oracle/cases/helpers/pod-lock-key/**
    - tools/oracle/fuzz/corpus/helper_case/pod-lock-key-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/base_update_queue.py#L1-L57
    why: Capacity backpressure, warning threshold, capped FIFO drain and enqueue observer.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/pod_lock_manager.py#L19-L218
    why: JSON-encoded lease ownership, reentrancy, Lua fallback and asymmetric service events.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L400-L414
    why: Queue capacity and computed aggregation threshold defaults.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1813-L1813
    why: Default cron lease TTL environment setting.
dod:
  - text: Spend queue admission and draining retain FIFO, cap, warning and cancellation behavior without losing ownership of admitted records.
    proof: [spend-memory-tests, spend-queue-config-tests]
  - text: Lease acquisition, expiry and release agree with the source's owner encoding, reentrancy and fallback, including event emission conditions.
    proof: [pod-lease-tests, redis-fixture-tests, oracle, pod-key-python, pod-key-corpus]
  - text: Queue settings and owner bytes use named production decoders with malformed-input replay and loader coverage.
    proof: [spend-queue-config-tests, queue-setting-corpus, pod-owner-corpus]
checks:
  optional: [mutants]
  commands:
    - id: spend-memory-tests
      why: Admission backpressure or a partial drain changes which spend updates remain owned.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^queues::memory::/)'
    - id: pod-lease-tests
      why: Redis lease tests miss ownership, encoding, stale-owner or failure fallback behavior.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^queues::pod_lock::/) - test(replays_the_pod_owner_corpus)'
    - id: redis-fixture-tests
      why: The disposable Redis process is not reachable or survives fixture teardown.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^redis_fixture::/)'
    - id: spend-queue-config-tests
      why: Spend queue and default lock settings are not resolved by the real config loader.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(loads_spend_queue_settings) | (test(/^spend_queue::/) - test(replays_the_spend_queue_setting_corpus))'
    - id: queue-setting-corpus
      why: Integer queue settings lack new fuzz inputs or decoder replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/spend_queue_setting)" && test -f crates/betterlite-config/fuzz/fuzz_targets/spend_queue_setting.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_spend_queue_setting_corpus)'
    - id: pod-owner-corpus
      why: Redis owner-byte decoding lacks its db-local target and new corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/pod_owner)" && test -f crates/betterlite-db/fuzz/fuzz_targets/pod_owner.rs && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_pod_owner_corpus)'
    - id: pod-key-python
      why: The key-format operation has no checked source adapter.
      run: test -f tools/oracle/helpers/pod_lock_key.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: pod-key-corpus
      why: Job-name key construction is absent from helper parser seeds.
      run: grep -rlq 'pod_lock_key:' tools/oracle/fuzz/corpus/helper_case/pod-lock-key-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/pod-lock-key/job-names-retain-colons-and-unicode.yaml
deviations:
  - what: Nonpositive LITELLM_ASYNCIO_QUEUE_MAXSIZE or DEFAULT_CRON_JOB_LOCK_TTL_SECONDS prevents startup with a named configuration error; spend update bodies are omitted from debug logs.
    why: The source permits an unbounded asyncio queue and logs raw updates, conflicting with bounded memory and secret-redaction rules.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_transaction_queue/base_update_queue.py#L23-L39
out_of_scope:
  - Specialized queue aggregation, Redis spill buffers, spend cleanup and database writer orchestration remain B070 and its later splits; no such worker is started here.
  - B126 supplies Redis command/client behavior and B012 supplies service event records; lease policy and spend-queue settings are owned here.
pitfalls:
  - Lua compares the stored JSON string, including its quotes, rather than the unencoded UUID.
  - A reentrant acquire succeeds without extending the original TTL and is the only acquire path that emits the gauge event.
  - A Lua failure intentionally reaches GET plus DEL, so the fallback cannot be described as atomic.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
