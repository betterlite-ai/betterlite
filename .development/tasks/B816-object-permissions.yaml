id: B816
title: Object permission writes and cache coherence
description: >-
  Implement ObjectPermissionPatch and object-permission attach/upsert/update helpers over ObjectPermissionRepository.
  Preserve explicit field deletion, absent nested object behavior and shared cache invalidation across
  key/user/team/org objects. Grant-specific validators are separate services.


  Build the production object_permissions module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/object_permission_utils.py:
  attach_object_permission_to_dict (L35-L73; 33 source lines), prepare_object_permission_upsert (L82-L129;
  46 source lines), handle_update_object_permission_common (L132-L183; 43 source lines), invalidate_cached_object_permissions
  (L186-L199; 13 source lines), _set_object_permission (L202-L237; 28 source lines), _mcp_tool_permission_entries
  (L324-L332; 9 source lines), reject_ambiguous_mcp_tool_permission_keys (L335-L371; 36 source lines).


  Add the object_permissions operation under B856 Management::models. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a object-permissions-* seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This task owns the outside-byte boundary object_permissions::decode_object_permission(&[u8]) -> Result<TypedValue,DecodeError>
  for stored/request object permission JSON. Production calls this decoder before its typed policy functions;
  the cargo-fuzz target object_permissions calls that same function. Seed valid, truncated, malformed,
  duplicate-field and limit-boundary inputs and add object_permissions::tests::replays_the_object_permissions_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B770 owns crates/betterlite-server/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 208 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  208 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 502 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
