pitfalls:
- 'The oracle helper for this task is pre-registered as chat_mcp_loop in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/chat_mcp_loop.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/chat_mcp_loop.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- chat_completions_handler.py:407 emits the diagnostic 'Follow-up stream was not created despite having tool results';
  retain its level and fallback instead of turning it into a hard error.
- chat_completions_handler.py:483 emits the diagnostic 'Follow-up stream created successfully'; retain its level
  and fallback instead of turning it into a hard error.
