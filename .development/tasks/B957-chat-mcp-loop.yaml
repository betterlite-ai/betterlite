checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_mcp_loop::/) - test(/::replays_corpus$/)'
  - id: case-chat-mcp-tool-loop
    why: the chat-mcp-tool-loop behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_mcp_loop::tests::chat_mcp_tool_loop($|::)/)'
  - id: case-chat-mcp-single-followup
    why: the chat-mcp-single-followup behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_mcp_loop::tests::chat_mcp_single_followup($|::)/)'
  - id: case-chat-mcp-stream-followup
    why: the chat-mcp-stream-followup behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_mcp_loop::tests::chat_mcp_stream_followup($|::)/)'
  - id: case-chat-mcp-failure
    why: the chat-mcp-failure behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_mcp_loop::tests::chat_mcp_failure($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/chat_mcp_loop.py && uv run --locked --project tools/oracle/litellm ruff check
      tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/chat_mcp_loop-*)"
      && grep -qE "^[[:space:]]+chat_mcp_loop:" tools/oracle/fuzz/corpus/helper_case/chat_mcp_loop-* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/chat-mcp-loop)"
