id: B957
title: Chat mcp loop
description: >-
  Execute chat MCP tool results and its single follow-up call with responses-mcp-execute and responses-mcp-followup,
  preserving completion logging, usage and streamed terminal behavior. Drain the initial inner stream so its terminal
  logging completes, and set trusted skip_mcp_handler on the streaming follow-up. Do not impose the separate Responses
  five-round state machine on this chat-specific two-phase flow.


  Implement crates/betterlite-core/src/api/chat_mcp_loop.rs. Use ChatMcpLoopInput and ChatMcpLoopResult with typed
  nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions chat_mcp_tool_loop, chat_mcp_single_followup, chat_mcp_stream_followup,
  chat_mcp_failure under api::chat_mcp_loop::tests. Each named function drives production code and asserts its case
  result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ChatMcpLoop in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {chat_mcp_loop: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/mcp/chat_completions_handler.py: acompletion_with_mcp (L328-L651). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 232 owned nonblank/non-comment/non-docstring Python lines (234 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 252 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 484 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B950 (Responses mcp execute), B951 (Responses mcp followup), B956
  (Chat mcp plans), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
