id: B4744
title: MCP transports and negotiated session lifecycle
description: >-
  Build MCPClient session and transport management in betterlite-mcp::client::sessions. Establish
  stdio, SSE and streamable HTTP transports, forward callbacks to the MCP SDK, negotiate legacy
  protocol versions, run supplied operations inside initialized sessions, and close sessions,
  transports and HTTP clients under bounded cleanup with cancellation safety.

  _create_transport_context selects the appropriate transport based on transport_type. For stdio,
  pass stdio_config (command, args, env dict) to StdioServerParameters and return stdio_client.
  For SSE, call sse_client with the server URL, client timeout, auth headers and httpx factory.
  For HTTP (default), call streamable_http_client with the server URL and httpx client; return
  the HTTP client for cleanup. Pass headers built by _get_auth_headers (owned by B4741) to the
  transports that use HTTP.

  _get_safe_stdio_env returns a minimal allowlist of environment variables for the stdio subprocess
  when env is None, preserving PATH, HOME, USER, LOGNAME, TMPDIR, SHELL, LANG, LC_ALL, and system
  paths (SYSTEMROOT, COMSPEC, etc.) plus Node caches (NPM_CONFIG_CACHE, PNPM_HOME, XDG_*). When
  provided_env is a dict, return it unchanged. Inject MCP_NPM_CACHE_DIR from config as the default
  NPM_CONFIG_CACHE when absent from both the environment and the allowlist. A subprocess must die
  with its owner; enforce the repository process rule.

  _initialize_session sends an InitializeRequest or calls session.initialize based on protocol_version.
  For "auto" mode, call session.initialize and reject non-legacy versions with MCPError code -32022.
  For explicit mode, send an InitializeRequest with the configured version, client implementation
  (name "litellm", version from package), and capabilities (sampling and elicitation callbacks when
  supplied). Adopt the result, send InitializedNotification and raise -32022 if the server rejected
  the configured version.

  _execute_session_operation opens the transport context, creates a session with the message handler,
  runs the supplied operation inside a fresh session, and closes session, transport and HTTP client
  in the pin's order with bounded cleanup. Store stripped initialization instructions in
  _last_initialize_instructions (empty string becomes None). Preserve the original stream/operation
  failure when transport teardown also fails, handling cancellation safely: a cancellation during
  session setup propagates, but final cancellations during cleanup are shielded and reported as
  timeout. Normalize only SDK read timeouts via as_mcp_read_timeout (owned by B4743); relay
  application errors with their original code unchanged. Session cleanup has a 5-second bound;
  final HTTP close has one second. A message handler called from the stream converts ValueError,
  httpx.HTTPError and OSError to RuntimeError so the SDK closes pending requests.

  run_with_session opens a transport, runs _execute_session_operation with the provided operation,
  and closes the HTTP client under a 1-second bound. Propagate cancellation and errors, logging at
  debug level when quiet_on_error (used by callers that own exceptions like call_tool under
  raise_on_error) to avoid duplicating error lines, else warning. Normalize MCP SDK read timeouts
  only, preserving numeric code and relayed application errors.

  _create_httpx_client_factory returns a factory function that builds httpx2.AsyncClient instances
  with TLS configuration from get_ssl_configuration (owned by B172) and auth precedence: explicit factory
  auth (passed by the SDK), then _resolved_auth (owned by B4741), then _aws_auth (owned by B4742), then None.
  Guard redirects with credential_redirect_hook to prevent leaking credentials when following a Location
  header out of the configured credential slot; hook failure (return None) means deny the redirect.
  Attach event hooks for response error capture and request redirect guarding. The factory ignores
  MCP SDK calls that pass auth= (sse_client, streamable_http_client do not), so fallback auth
  supplies the configured credentials.

  The session message handler installed by _execute_session_operation intercepts stream errors
  (ValueError, httpx2.HTTPError, OSError), stores them in a future for the operation to see, and
  raises RuntimeError to close pending requests.

  Use MCP SDK transports/session machinery without rebuilding JSON-RPC/SSE/HTTP handling; task
  authors comparing Rust SDK support must verify the pinned legacy negotiation and callback behavior
  work on Rust equivalents. Omit pragma/comment directives the SDK does not emit. Environment
  lookup comes from B002 (MCP_NPM_CACHE_DIR, stdio allowlist); TLS policy from B172 (get_ssl_configuration);
  credential headers and resolved auth from B4741 (_get_auth_headers, _credential_slot, _resolved_auth);
  AWS auth from B4742 (_aws_auth); HTTP cleanup from B4743 (_MCPHTTPClient, send, _first_non_cancelled_cause,
  as_mcp_read_timeout, _run_bounded_cleanup). Unresolved direct callees are credential_redirect_hook and
  capture_upstream_error_response; their implementations must be lower than the manager that constructs
  this client (question 1 in the outline).

