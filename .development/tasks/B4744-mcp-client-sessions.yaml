deviations:
  - what: Subprocess environment only allowlists safe standard variables plus Node caches; credentials and keys never leak to subprocesses.
    why: Stdio MCPs inherited all parent environment variables in LiteLLM, exposing OPENAI_API_KEY and other secrets. Betterlite protects the subprocess surface via allowlisting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L497-L541
  - what: credential_redirect_hook (litellm/types/mcp.py:364-380) and capture_upstream_error_response (litellm/proxy/_experimental/mcp_server/mcp_debug.py:579-598) are called by _create_httpx_client_factory but are not owned by any task in depends_on. Their owner is pending resolution of B136 (umbrella, unsplit).
    why: These functions belong to lower modules not yet assigned; this client code calls them but cannot own them or have them as dependencies without creating a cycle. They must be available by the time the client factory runs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L802-L811
  - what: Protocol negotiation omits pragma and comment directives the SDK does not emit.
    why: Betterlite builds equivalent MCP client behavior; unnecessary pragmas would accumulate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L543-L570

out_of_scope:
  - Tool listing, execution and resource operations; those belong to B4745 and B4746.
  - Credential resolution, AWS signing and header construction; those are B4741 and B4742.
  - HTTP error propagation and response stream ownership; those are B4743.
  - MCP wire protocol implementation; the SDK provides transport and session machinery.
  - Manager construction and credential installation; those come from B140.
  - Config loading and environment variable resolution; those are B002.

pitfalls:
  - >-
    _create_transport_context must return None for http_client when transport is stdio or SSE,
    so cleanup only closes clients that need it.
  - >-
    _get_safe_stdio_env blocks os.environ access; environment lookup comes through the supplied
    environment parameter or B002's config resolution.
  - >-
    StdioServerParameters holds command and args as strings and list; env is a dict or None.
    Mismatch types cause runtime errors.
  - >-
    _initialize_session raises MCPError code -32022 for both auto-reject and explicit version
    mismatch. A task that routes on -32022 must distinguish the cause using the error message.
  - >-
    Session message handler runs inside the SDK's message-reading loop. An exception it raises
    closes pending requests. Do not log or handle exceptions silently here; let them propagate.
  - >-
    _last_initialize_instructions is mutable state; a new session overwrites it. Tests must not
    assume it persists across runs.
  - >-
    Cleanup bounds are strict: session/transport use a 5-second deadline, HTTP close uses 1 second.
    A process that hangs past 5 seconds is killed (cancellation).
  - >-
    The factory receives auth= from sse_client and streamable_http_client only when the SDK has
    explicit auth (rare); fallback auth is the configured credentials or AWS flow.
  - >-
    credential_redirect_hook is an unresolved callee; capture_upstream_error_response is also
    unresolved. Both must be owned by a lower task before this ships.
  - >-
    _execute_session_operation always shields cleanup scopes to prevent cancellation from abandoning
    teardown; caller cancellation only propagates if cleanup itself times out.

review_level: security
