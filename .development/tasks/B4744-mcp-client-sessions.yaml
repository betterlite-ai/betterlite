      _create_transport_context, _get_safe_stdio_env, _initialize_session, _execute_session_operation,
      run_with_session and _create_httpx_client_factory are implemented with correct transport selection,
      environment filtering, protocol negotiation, session lifecycle, cleanup bounds and auth precedence.
    proof: [sessions-tests, sessions-clippy]
  - text: New oracle helper operation for MCP sessions integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: sessions-tests
      why: the required behavior tests fail or the filter selects no tests
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client::sessions::/) - test(/replays_the_/)'
    - id: sessions-clippy
      why: clippy catches issues in sessions code
      run: cargo clippy --locked -p betterlite-mcp --all-targets -- -D warnings
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4744.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/mcp-sessions-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

