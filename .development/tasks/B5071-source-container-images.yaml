id: B5071
title: Native source and database container images
description: >-
  Build runtime and database Docker images from the Rust workspace. Both images run betterlite as the main process with TCP 4000 exposed.
  The root Dockerfile builds the source in a rust:1.98.0-bookworm builder stage with cargo build --release --locked -p betterlite -p betterlite-db-admin,
  copies both binaries to /usr/local/bin in the runtime stage, and copies the admin UI export of B9091 beside them. The
  export comes in as a BuildKit named context, `--build-context dashboard=target/dashboard/dist`, and the runtime stage copies its `ui` folder
  to /usr/local/bin/ui (a sibling of the binary, as B8680 expects). No logo files are copied, since the branding is a text wordmark. Node and npm never
  enter a builder or runtime stage of these images. There is no Prisma CLI or query engine in the image and no prisma generation at build time.
  Dockerfile.database uses the same build stages but does not add the public Wolfi repository. Both runtime stages are minimal: they copy
  only the two binaries and the docker scripts from builder and the ui folder from the dashboard context.
  The native binaries (betterlite and betterlite-db-admin) sit in /usr/local/bin, there is no Python environment, schema.prisma, prisma_migration.py or enterprise/ directory,
  and runtime invokes the prod_entrypoint.sh script (provided by B5070) with the command ["--port", "4000"]. Both images include bash and pgbouncer.
  The native server does not support Datadog instrumentation through ddtrace at this stage; USE_DDTRACE has no effect (a future capability M12).

  CI runs every check inside rust:1.98.0-slim-trixie with no docker binary, so no check builds or runs an image. Add one text check script,
  `packaging/docker/tests/source_images.sh`, that reads both Dockerfiles with only bash, grep and test, stops at the first problem and prints
  the file and the line it misses. It checks: both files exist; the builder stage is `FROM rust:1.98.0-bookworm AS builder` and runs
  `cargo build --release --locked -p betterlite -p betterlite-db-admin`; the runtime stage copies /usr/local/bin/betterlite,
  /usr/local/bin/betterlite-db-admin and /app/docker from builder and the `ui` folder of the `dashboard` build context to /usr/local/bin/ui;
  no FROM line names a node image, no line runs npm or npx, and no line names an .ico, .svg or .png file; each file has `EXPOSE 4000/tcp`,
  `ENTRYPOINT ["/app/docker/prod_entrypoint.sh"]` and `CMD ["--port", "4000"]`; each runtime stage installs bash and copies
  /usr/local/bin/pgbouncer; the root Dockerfile adds https://packages.wolfi.dev/os to /etc/apk/repositories and Dockerfile.database has no
  packages.wolfi.dev line.
scope:
  paths:
    - packaging/docker/Dockerfile
    - packaging/docker/Dockerfile.database
    - packaging/docker/tests/source_images.sh
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/Dockerfile#L1-L169
    why: Root image recipe with uvbin, pgbouncer-builder, ui-builder, builder and runtime stages; base images and pinned versions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/Dockerfile#L118-L169
    why: Runtime stage layers, package installs, binary copies, ENTRYPOINT and CMD.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/docker/Dockerfile.database#L1-L162
    why: Database image recipe; identical to root except runtime stage omits public Wolfi repository at line 126 of root.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/Dockerfile#L110-L112
    why: Prisma binary cache directory and generation at build time; native images exclude the generate step.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/Dockerfile#L91-L95
    why: UI bundle clear and COPY from ui-builder; betterlite serves the UI from a static folder at runtime.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2129-L2131
    why: LiteLLM resolves the UI path from site-packages; betterlite reads a static folder instead.
dod:
  - text: Both Dockerfiles build the source in the rust:1.98.0-bookworm builder stage with cargo build --release --locked -p betterlite -p betterlite-db-admin and expose port 4000.
    proof: [script-syntax, images-check]
  - text: Both runtime stages copy betterlite and betterlite-db-admin from builder to /usr/local/bin.
    proof: [images-check]
  - text: The images do not run prisma generate at build time; the command fails if attempted (production safety).
    proof: [no-prisma-generation-root, no-prisma-generation-database]
  - text: The root Dockerfile adds the public Wolfi repository; Dockerfile.database does not.
    proof: [images-check]
  - text: Both runtime stages copy the ui folder of the dashboard build context (the B9091 export) to /usr/local/bin/ui, and neither Dockerfile uses a Node image, runs npm or names a logo file.
    proof: [images-check]
  - text: Both runtime stages copy the docker scripts from builder, install bash, copy pgbouncer, and set ENTRYPOINT to the prod_entrypoint.sh script with no arguments and CMD to --port 4000.
    proof: [images-check]
checks:
  optional: []
  commands:
    - id: script-syntax
      why: the image check script has a bash syntax error
      run: bash -n packaging/docker/tests/source_images.sh
    - id: images-check
      why: a Dockerfile misses a stage, copy, port, entrypoint or repository line this task lists, or uses Node, npm or a logo file
      run: bash packaging/docker/tests/source_images.sh
    - id: no-prisma-generation-root
      why: packaging/docker/Dockerfile includes prisma generate at build time, violating production safety constraints
      run: 'test ! -f packaging/docker/Dockerfile || ! grep -q "prisma generate" packaging/docker/Dockerfile'
    - id: no-prisma-generation-database
      why: packaging/docker/Dockerfile.database includes prisma generate at build time, violating production safety constraints
      run: 'test ! -f packaging/docker/Dockerfile.database || ! grep -q "prisma generate" packaging/docker/Dockerfile.database'
oracle_cases: []
deviations:
  - what: The native images omit the prisma generate build step. LiteLLM generates the Prisma client at build time; betterlite omits it since the native server does not use the generated client.
    why: B051 and B1232 own the native migration command and omit client generation, so the Dockerfile matches that architecture.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/Dockerfile#L110-L112
  - what: The native server does not support ddtrace instrumentation in production. USE_DDTRACE is parsed by the entrypoint script (B5070) but has no effect on the native binary.
    why: Rust ddtrace integration is a future capability (M12). The entrypoint script supports the hook to avoid breaking container configuration.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/docker/prod_entrypoint.sh
  - what: The images exclude enterprise COPY directives present in the LiteLLM Dockerfile (root lines 75, 150; database lines 73, 141).
    why: betterlite has no enterprise directory or feature. The template does not reference enterprise.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/Dockerfile#L75
  - what: The checks read the Dockerfiles as text and do not build the images.
    why: CI runs the gate inside rust:1.98.0-slim-trixie with no docker binary, and the gate sandbox cannot reach the Docker socket; B8233 and B5073 check their Dockerfiles the same way.
out_of_scope:
  - B003 builds and packages the betterlite binary; this task only includes it in the runtime image.
  - B1232 builds and packages betterlite-db-admin; this task only includes it in the runtime image.
  - B5070 provides the shell entrypoint scripts; this task invokes them during build. The enterprise no-op hook packaging/docker/build_admin_ui.sh is not used for the UI.
  - B9091 owns the UI build and its export under target/dashboard/dist, and B144 the dashboard as a whole; this task only copies that export's ui folder into the images.
  - PgBouncer configuration and startup contract; this task bundles the binary but B003 calls start_in_container_pgbouncer.
  - Python callback runtime and its dependencies; betterlite retains the capability (M12) but does not build it yet.
pitfalls:
  - >-
    The prod_entrypoint.sh script is provided by B5070 at packaging/docker/prod_entrypoint.sh and referenced at container runtime.
    The Dockerfile COPY --from=builder ensures the script is at the correct runtime path.
  - >-
    The native server reads the UI from the ui folder beside the binary, not from a Python package. The image build never runs npm:
    B9091's build.sh prepares target/dashboard/dist first and the Dockerfile only copies from the named context.
  - >-
    Both images use identical build stages except the runtime stage. Root adds the public Wolfi repository and the
    database image omits it.
  - >-
    The database image is not migration-only; it runs the same proxy entrypoint and commands as the root image. Migration
    is a separate invocation path.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
