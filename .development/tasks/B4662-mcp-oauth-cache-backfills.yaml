deviations:
  - what: >-
      OAuth2TokenCache keying is per-identity (server_id:hash(material)) instead of per-server, so config changes
      (scopes, client_secret, upstream_resource, auth_method) trigger a cache miss and token refresh.
    why: >-
      LiteLLM keyed by server_id alone and served stale tokens across config edits. Per-identity matching ensures
      every configuration carries fresh credentials and is auditable per-request (server_id is a cache key component).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/oauth2_token_cache.py#L43-L81
  - what: >-
      oauth2_flow backfill never stamps client_credentials (left to human assertion via dashboard or API);
      ambiguous rows (M2M shape without interactive signal) are warned and left unstamped.
    why: >-
      M2M credentials are asserted by config, not inferred. An ambiguous row could be either interactive
      (DCR-registered with no sign-in yet) or M2M (static credentials), and stamping client_credentials
      would route per-user traffic through the proxy's stored credential forever. A completed interactive
      sign-in heals the row via per_user_tokens signal at the next boot.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/oauth2_flow_backfill.py#L1-L35
  - what: >-
      issuer stamp backfill only heals rows where configured endpoints and stamped issuer share the same origin,
      and skips rows with no configured endpoints (canonical shape of deliberate pins).
    why: >-
      The discovery write-back was an unintended side effect; stamped rows are rare and narrow healing to
      rows created by that write (endpoints present + origin match) avoids clearing admin pins. Each heal
      logs the cleared issuer for manual restoration if needed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/oauth_issuer_stamp_backfill.py#L1-L37

out_of_scope:
  - MCPOAuth2TokenCache is per-replica in-memory only; Redis-backed M2M token storage belongs to a later task.
  - Encryption and decryption implementations (encrypt_value_helper, decrypt_value_helper) are provided by betterlite-mcp or config crates.
  - Token endpoint client authentication (client_secret_basic, client_secret_post, auth_method normalization) is owned by B4650.
  - OAuthToken and OAuthTokenCacheCodec (bound token encoding with identity proof, bearer-only encoding) are owned by B4656.
  - Refresh token coordination (RefreshCoordinator, RefreshingTokenStore) is owned by B4657.
  - CredentialReader interface that V2PerUserTokenStore uses to read persisted authorization_code credentials belongs to a later persistence task.
  - Configuration loading of token cache TTLs (MCP_OAUTH2_TOKEN_CACHE_*) and per-user TTL rules belongs to the config/manager layer.
  - OAuth discovery and issuer resolution in the read path belong to later tasks; backfill runs once at startup.
  - per-user token invalidation triggers (reauth, revocation, 401 response handlers) belong to the arm that handles OAuth token refreshes.

pitfalls:
  - >-
    MCPOAuth2TokenCache._token_identity joins server_id with a SHA256 hash of token request material (in \x00 order:
    token_url, client_id, client_secret, scopes joined with space, upstream_resource, auth_method), so the same server
    with different credentials produces different cache keys; a config change (any of the six inputs) misses the cache.
  - >-
    async_get_token uses fast-path cache check without lock (returns immediately if hit) then slow-path lock + double-check
    before fetch; this reduces lock contention but the second check after lock acquire is mandatory (another task may have
    completed a fetch while this task waited for the lock).
  - >-
    MCPOAuth2TokenCache._fetch_token parses expires_in as int, defaulting to MCP_OAUTH2_TOKEN_CACHE_DEFAULT_TTL if the field is
    missing, null, or non-numeric (e.g. a string); this matches LiteLLM's lenient behavior for providers that return unexpected types.
  - >-
    TTL calculation: (expires_in - MCP_OAUTH2_TOKEN_EXPIRY_BUFFER_SECONDS), capped to >= MCP_OAUTH2_TOKEN_CACHE_MIN_TTL.
    A token with very short lifetime or missing expires_in gets the buffer + min TTL rules applied, so the cache entry always
    expires before or as the real token does.
  - >-
    MCPPerUserTokenCache.set and delete catch all exceptions and degrade to no-op with debug logging (cache unavailable, decryption
    failure, delete failure); they never propagate errors, so token fetch falls back to the non-cached path.
  - >-
    _compute_per_user_token_ttl returns max(ttl, 1) so TTL is always at least 1 second, preventing zero or negative TTLs
    that would break Redis or cache behavior.
  - >-
    classify_null_flow_row signal order is strict: per_user_tokens > authorization_url > registration_url > ambiguous_m2m_shape > interactive_default.
    An oauth2 row with per-user tokens is definitively interactive (only interactive flow mints per-user tokens), so that signal
    overrides everything; a registration_url proves DCR (interactive only), overriding the ambiguous shape.
  - >-
    backfill_null_oauth2_flows uses update_many to batch stamp all rows with the same flow value, reducing database round-trips;
    each stamped row gets updated_by=oauth2_flow_backfill for audit trail and idempotency.
  - >-
    _decrypted_credentials on oauth2_flow_backfill handles three input forms: None (return None), string (parse as JSON), dict (use as-is).
    Parsing failures return None (ambiguous row). The result is MCPCredentials (a dict that must contain client_id and client_secret strings to count as M2M).
  - >-
    _is_stamped_issuer_row checks updated_by == mcp_oauth_discovery (the actor the removed write recorded), issuer must be non-empty,
    auth_type must be in (oauth2, true_passthrough, oauth_delegate), endpoints must be present and non-empty, and all configured endpoints'
    origins must match the issuer's origin (using canonicalize_url_identity for consistent origin comparison).
  - >-
    _origin splits a URL into scheme-and-authority, so https://example.com:443/path and https://example.com/path have the same origin
    (the default port is normalized by canonicalize_url_identity); origins without scheme or netloc return None.
  - >-
    backfill_discovery_stamped_issuers is idempotent: it clears issuer to None and sets updated_by to _BACKFILL_ACTOR, so a row that
    already has _BACKFILL_ACTOR as updated_by will not match the query filter (updated_by == _DISCOVERY_ACTOR) on the next boot.
  - >-
    The oauth_caches helper operation exercises MCPOAuth2TokenCache (identity, singleflight, fetch, TTL buffer, invalidation),
    MCPPerUserTokenCache (get, set, delete with encryption), _compute_per_user_token_ttl, classify_null_flow_row with all signal paths,
    _is_stamped_issuer_row with matched and unmatched cases, and backfill entry/exit; replace the stub Op in
    tools/oracle/src/helpers/server/b4662.rs and implement the Python adapter in tools/oracle/helpers/b4662.py.

