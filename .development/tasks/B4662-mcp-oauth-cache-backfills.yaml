dod:
  - text: >-
      MCPOAuth2TokenCache inherits InMemoryCache, caches by token identity (server_id:hash(material)),
      uses per-identity asyncio.Lock for single-flight, and double-checks cached entry after lock acquire.
    proof: [oauth2-cache-structure, oauth2-cache-singleflight]
  - text: >-
      _token_identity hashes token_url, client_id, client_secret, scopes, upstream_resource, and token_endpoint_auth_method;
      the hash is joined with server_id as key; changing any material misses the cache.
    proof: [oauth2-cache-identity]
  - text: >-
      async_get_token returns access token string (never None) when config complete, None when client_credentials not configured,
      fast-path checking cache without lock, slow-path acquiring lock and double-checking before fetch.
    proof: [oauth2-cache-get-token]
  - text: >-
      _fetch_token POSTs to effective_token_url with grant_type=client_credentials and token_request (headers, body with client auth),
      parses access_token and expires_in from JSON response, defaulting expires_in to MCP_OAUTH2_TOKEN_CACHE_DEFAULT_TTL if missing/invalid.
    proof: [oauth2-cache-fetch-token]
  - text: >-
      _fetch_token applies MCP_OAUTH2_TOKEN_EXPIRY_BUFFER_SECONDS to expires_in, caps result to >= MCP_OAUTH2_TOKEN_CACHE_MIN_TTL,
      returns (access_token, ttl), raises ValueError on HTTP error or missing access_token.
    proof: [oauth2-cache-ttl-buffer]
  - text: >-
      MCPOAuth2TokenCache.invalidate removes every cached token for a server by matching prefix server_id: without lock
      (iteration is safe on dict removal within the loop).
    proof: [oauth2-cache-invalidate]
  - text: >-
      MCPPerUserTokenCache stores tokens in user_api_key_cache with Redis key MCP_PER_USER_TOKEN_REDIS_KEY_PREFIX:user_id:server_id
      and encrypted value via OAuthTokenCacheCodec; get_token decrypts and returns OAuthToken or None on missing/decryption failure.
    proof: [per-user-cache-storage]
  - text: >-
      _compute_per_user_token_ttl uses server.token_storage_ttl_seconds capped by token lifetime (expires_in - buffer),
      derives from expires_in (minus buffer) if no configured TTL, falls back to MCP_PER_USER_TOKEN_DEFAULT_TTL; always returns >= 1.
    proof: [per-user-cache-ttl]
  - text: >-
      MCPPerUserTokenCache.set encrypts OAuthToken via codec and stores in user_api_key_cache with computed TTL,
      catches exceptions and debug-logs, completing as no-op on failure.
    proof: [per-user-cache-set]
  - text: >-
      MCPPerUserTokenCache.delete uses evict_and_broadcast to invalidate token in Redis and broadcast to peer workers' in-memory layers,
      catches exceptions and debug-logs, completing as no-op on failure.
    proof: [per-user-cache-delete]
  - text: >-
      classify_null_flow_row takes has_per_user_tokens flag and MCPCredentials; returns (flow, rule) where flow is "authorization_code",
      "client_credentials" or None; rules follow signal strength (per_user_tokens, authorization_url, registration_url, ambiguous_m2m_shape, interactive_default).
    proof: [flow-classification]
  - text: >-
      backfill_null_oauth2_flows queries auth_type=oauth2 rows with oauth2_flow=null, reads per-user credential rows,
      classifies each, logs warnings for ambiguous (flow=None), updates stamped rows, returns dict of rule counts.
    proof: [flow-backfill]
  - text: >-
      _is_stamped_issuer_row checks (updated_by == mcp_oauth_discovery, issuer set, auth_type in oauth2/true_passthrough/oauth_delegate,
      endpoints present, endpoint origins match issuer origin); all clauses must hold for predicate to be true.
    proof: [issuer-predicate]
  - text: >-
      backfill_discovery_stamped_issuers queries candidate rows, filters via _is_stamped_issuer_row, clears issuer to None
      and sets updated_by=mcp_oauth_issuer_stamp_backfill, per-row catches exceptions and continues, returns count healed.
    proof: [issuer-backfill]
  - text: >-
      resolve_mcp_auth resolves the auth value for an MCP server with priority order: mcp_auth_header (per-request override)
      takes precedence, then OAuth2 client_credentials token (auto-fetched and cached), then server.authentication_token (static token).
    proof: [auth-resolution-priority]
  - text: >-
      resolved_token_header answers which upstream header the resolved auth value belongs in, using the same two inputs as
      resolve_mcp_auth; returns None to keep the default auth_type, or the upstream_token_header when mcp_auth_header is absent.
    proof: [auth-resolution-header]
  - text: >-
      New oracle helper operation for OAuth caches integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: oauth2-cache-structure
      why: MCPOAuth2TokenCache or _locks dict is missing.
      run: grep -qE 'struct MCPOAuth2TokenCache|MCPOAuth2TokenCache.*{' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: oauth2-cache-singleflight
      why: Per-identity asyncio.Lock or _get_lock is missing.
      run: grep -qE 'asyncio\.Lock|_get_lock' crates/betterlite-server/src/mcp/oauth_caches.rs || grep -qE 'Mutex|RwLock' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: oauth2-cache-identity
      why: _token_identity does not hash token request material or does not include server_id prefix.
      run: grep -qE '_token_identity|token_identity' crates/betterlite-server/src/mcp/oauth_caches.rs && grep -qE 'sha256|hash256|hmac' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: oauth2-cache-get-token
      why: async_get_token is missing or does not implement double-check pattern.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth.*get.*token/) - test(/replays_corpus$/)'
    - id: oauth2-cache-fetch-token
      why: _fetch_token is missing or does not POST to token_url.
      run: grep -qE '_fetch_token|fetch_token' crates/betterlite-server/src/mcp/oauth_caches.rs && grep -qE 'grant_type.*client_credentials|client_credentials.*grant' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: oauth2-cache-ttl-buffer
      why: _fetch_token does not apply expiry buffer or cap to min TTL.
      run: grep -qE 'EXPIRY_BUFFER|CACHE_MIN_TTL|min_ttl' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: oauth2-cache-invalidate
      why: invalidate is missing or does not remove tokens by server_id prefix.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth.*invalidate/) - test(/replays_corpus$/)'
    - id: per-user-cache-storage
      why: MCPPerUserTokenCache or key/encryption logic is missing.
      run: grep -qE 'MCPPerUserTokenCache|per_user.*cache' crates/betterlite-server/src/mcp/oauth_caches.rs && grep -qE 'encrypt|decrypt|codec' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: per-user-cache-ttl
      why: _compute_per_user_token_ttl is missing or does not cap lifetime and apply defaults.
      run: grep -qE '_compute_per_user_token_ttl|compute.*ttl' crates/betterlite-server/src/mcp/oauth_caches.rs && grep -qE 'min|max|lifetime|expires_in' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: per-user-cache-set
      why: MCPPerUserTokenCache.set is missing or does not handle encryption/persistence errors.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth.*set/) - test(/replays_corpus$/)'
    - id: per-user-cache-delete
      why: MCPPerUserTokenCache.delete is missing or does not broadcast to peers.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::oauth.*delete/) - test(/replays_corpus$/)'
    - id: flow-classification
      why: classify_null_flow_row is missing or does not implement signal priority.
      run: grep -qE 'classify.*flow|flow.*classify' crates/betterlite-server/src/mcp/backfills.rs && grep -qE 'per_user|authorization_url|registration_url|ambiguous|interactive' crates/betterlite-server/src/mcp/backfills.rs
    - id: flow-backfill
      why: backfill_null_oauth2_flows is missing or does not stamp rows.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::backfill.*flow/) - test(/replays_corpus$/)'
    - id: issuer-predicate
      why: _is_stamped_issuer_row is missing or does not check all clauses.
      run: grep -qE '_is_stamped_issuer_row|stamped.*issuer' crates/betterlite-server/src/mcp/backfills.rs && grep -qE 'updated_by|issuer|auth_type|endpoint' crates/betterlite-server/src/mcp/backfills.rs
    - id: issuer-backfill
      why: backfill_discovery_stamped_issuers is missing or does not heal rows.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::backfill.*issuer/) - test(/replays_corpus$/)'
    - id: helper-python
      why: The oracle helper adapter is missing or Python type checking fails.
      run: test -f tools/oracle/helpers/b4662.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/oauth_caches-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: auth-resolution-priority
      why: resolve_mcp_auth does not implement the correct priority order or does not call async_get_token for OAuth2.
      run: grep -qE 'resolve_mcp_auth|resolve.*auth' crates/betterlite-server/src/mcp/oauth_caches.rs && grep -qE 'mcp_auth_header|client_credentials|authentication_token' crates/betterlite-server/src/mcp/oauth_caches.rs
    - id: auth-resolution-header
      why: resolved_token_header does not return upstream_token_header or does not handle mcp_auth_header correctly.
      run: grep -qE 'resolved_token_header|token_header' crates/betterlite-server/src/mcp/oauth_caches.rs && grep -qE 'upstream_token_header' crates/betterlite-server/src/mcp/oauth_caches.rs

