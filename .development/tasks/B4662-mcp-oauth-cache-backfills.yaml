id: B4662
title: MCP legacy OAuth cache and persisted configuration backfills
description: >-
  Build the legacy OAuth token caching layer for MCP servers configured with client credentials,
  plus startup backfills that heal persisted oauth2_flow and issuer stamp rows created before the
  write-side validations and migrations landed.

  MCPOAuth2TokenCache is an in-memory cache for OAuth2 client_credentials tokens keyed by the
  identity of the token request (server_id plus hash of token_url, client_id, client_secret,
  scopes, upstream_resource, token_endpoint_auth_method), not by server_id alone. Caches per-identity
  asyncio.Lock to prevent duplicate concurrent fetches. Inherits from LiteLLM's InMemoryCache for
  TTL-based storage and eviction. async_get_token returns a valid access token, fast-path checking
  the cache without locking, slow path acquiring the per-identity lock then double-checking before
  fetching. _fetch_token POSTs to effective_token_url with grant_type=client_credentials, parses
  expires_in from response (defaulting to MCP_OAUTH2_TOKEN_CACHE_DEFAULT_TTL if missing or non-numeric),
  applies MCP_OAUTH2_TOKEN_EXPIRY_BUFFER_SECONDS, and caps TTL to MCP_OAUTH2_TOKEN_CACHE_MIN_TTL.
  invalidate removes every cached token for a server by prefix.

  MCPPerUserTokenCache is Redis-backed storage for per-user OAuth2 access tokens using LiteLLM's
  user_api_key_cache (DualCache with optional Redis) and NaCl encryption via encrypt_value_helper and
  decrypt_value_helper. Cache keys are MCP_PER_USER_TOKEN_REDIS_KEY_PREFIX:user_id:server_id. Values are
  OAuthToken encrypted via OAuthTokenCacheCodec. get_token returns OAuthToken or None; get returns
  access_token string or None. set stores token with computed TTL; _compute_per_user_token_ttl uses
  server.token_storage_ttl_seconds capped by token lifetime (expires_in minus MCP_PER_USER_TOKEN_EXPIRY_BUFFER_SECONDS)
  or falls back to MCP_PER_USER_TOKEN_DEFAULT_TTL. delete invalidates token in Redis and every peer worker's
  in-memory layer via auth_cache_invalidation_pubsub.evict_and_broadcast.

  oauth2_flow_backfill classifies every auth_type=oauth2 row whose oauth2_flow is null at startup,
  stamping provable ones and warning on ambiguous ones. Flow is "authorization_code" or "client_credentials";
  BackfillRule names which signal triggered the classification. Protocols _MCPServerRow, _MCPUserCredentialRow,
  _MCPServerTable, _MCPUserCredentialsTable narrow the untyped Prisma client. _mcp_server_table and
  _mcp_user_credentials_table return typed table accessors. classify_null_flow_row takes per-user_tokens flag
  (whether any oauth2 type rows exist for the server), authorization_url, registration_url, token_url, and
  credentials (MCPCredentials dict or None); returns (flow, rule) where flow is "authorization_code",
  "client_credentials" or None, and rule names the signal. Signal order (strongest first): per_user_tokens
  (interactive only), authorization_url (interactive requires endpoint), registration_url (DCR for interactive),
  ambiguous_m2m_shape (M2M without authorization signal, left unstamped), interactive_default. Never stamps
  client_credentials; M2M is asserted by human. backfill_null_oauth2_flows queries null rows, reads per-user
  token rows to find which servers have interactive tokens, classifies each row, logs warnings for ambiguous,
  updates stamped rows with oauth2_flow value and updated_by=oauth2_flow_backfill, returns dict of rule counts.

  oauth_issuer_stamp_backfill heals rows whose issuer column was written by discovery (GH #34985), making
  them issuer-anchored (RFC 8414 section 3.3), ignoring their configured endpoints, and fail-closed on
  failed discovery. Deletes the write-back from code, but cannot fix rows already stamped. Heals those by
  clearing the stamp via two narrow clauses: configured endpoints must be present (deliberate pins often have
  none), and issuer origin must match configured endpoints' origins (admin intent that would be discarded).
  Protocols _MCPServerRow narrows the row. _origin extracts scheme-and-authority identity using shared
  canonicalize_url_identity. _is_stamped_issuer_row checks (updated_by == mcp_oauth_discovery, issuer set,
  auth_type in oauth2/true_passthrough/oauth_delegate, endpoints present and origins match issuer).
  backfill_discovery_stamped_issuers queries candidate rows, filters via _is_stamped_issuer_row, updates
  issuer to None and updated_by=mcp_oauth_issuer_stamp_backfill, returns count healed. Idempotent: healed
  rows no longer match updated_by filter.

scope:
  paths:
    - crates/betterlite-server/src/mcp/oauth_caches.rs
    - crates/betterlite-server/src/mcp/oauth_caches/**
    - crates/betterlite-server/src/mcp/backfills.rs
    - crates/betterlite-server/src/mcp/backfills/**
    - tools/oracle/cases/mcp-oauth-caches/**
    - tools/oracle/fuzz/corpus/helper_case/oauth_caches-*
    - tools/oracle/helpers/b4662.py
    - tools/oracle/helpers/b4662/**
    - tools/oracle/src/helpers/server/b4662.rs
    - tools/oracle/src/helpers/server/b4662/**
  lint_tables: false

