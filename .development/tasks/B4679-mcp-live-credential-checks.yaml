dod:
  - text: admitted_key_is_active is false for blocked equal to true, for an expiry strictly before now and for an expiry text that can't be parsed, true for blocked false or unset, for no expiry and for an expiry equal to now, and a naive expiry text counts as UTC.
    proof: [admitted-active-tests, helper-oracle, helper-tests, helper-python]
  - text: key_identity gives the stored token hash, the user_id and the admitted-user marker of a key, with None for a key that has no token or no user_id, and clear_budget_reservation leaves the reservation empty.
    proof: [admitted-reader-tests]
  - text: is_gateway_admission_credential is true for a session access value, a session refresh value, a bridge access envelope and a bridge refresh envelope, with or without a Bearer prefix in any case, and false for a plain upstream token and for no value.
    proof: [credential-shape-tests, helper-oracle, helper-tests, helper-python]
  - text: The scrub empties the oauth2 map for an admitted subject or a credential-shaped Authorization value, and keeps a plain upstream token.
    proof: [credential-scrub-tests, helper-oracle, helper-tests, helper-python]
  - text: The scrub drops an authorization pair from raw_headers only for an admitted subject, drops a credential-shaped value under any header name, clears a credential-shaped mcp_auth_header, and removes credential values and then empty aliases from the per-server map.
    proof: [credential-scrub-tests, helper-oracle, helper-tests, helper-python]
  - text: reload_admitted_key returns the master key admin without a database and without an active or SCIM check, and otherwise maps no database to 500, Refused to 401, DatabaseUnavailable to 503 with its message, Other to KeyRead, and a blocked or expired key to 401.
    proof: [key-reload-tests]
  - text: reload_admitted_key passes check_db_only to the store and runs the owner check only after the active check, so an inactive key never reads its owner.
    proof: [key-reload-tests]
  - text: reject_if_owner_scim_deactivated gives 401 only for an owner row whose scim_active is the JSON value false, and passes a key with no user_id, a read error, a missing row, no metadata, a null, 0 or the string "false" without failing.
    proof: [owner-scim-tests]
  - text: enforce_live_policy clears the budget reservation, calls the route gate before the common checks, stops at the first failure and never runs the common checks after a route failure.
    proof: [live-policy-tests]
  - text: enforce_live_policy returns a gate rejection unchanged, maps a budget error to its own status and message, a database outage to 503 with its message and anything else to 401.
    proof: [live-policy-tests]
  - text: explicit_credential_matches_envelope matches a key_hash subject by the hash of the presented token or by the stored token hash, matches a user_id subject only for the same non-empty user_id, and refuses everything else.
    proof: [envelope-match-tests, helper-oracle, helper-tests, helper-python]
  - text: is_auth_admission_error is true for HTTP 401 and a proxy code of "401", and false for other statuses, other codes, a non-numeric code and a missing code.
    proof: [admission-error-tests, helper-oracle, helper-tests, helper-python]
  - text: LiveAdmittedKeyStore maps a refused key read to Refused, an outage anywhere in the cause chain to DatabaseUnavailable with B1217's message, and every other error to Other, and reads the user without upsert.
    proof: [live-store-tests]
  - text: LiveAdmissionGates maps each dependency error to Rejected, BudgetExceeded, DatabaseUnavailable or Unclassified as the description gives, and runs the body decode before the pre-DB checks.
    proof: [live-gates-tests]
  - text: The oracle cases and the corpus seeds agree with LiteLLM on the five pure operations.
    proof: [helper-oracle, helper-tests, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: admitted-active-tests
      why: the active key gate for an admitted key is missing, reads blocked or the expiry differently, or counts an expiry equal to now as expired
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^admitted_key::tests::active_/)'
    - id: admitted-reader-tests
      why: the key reader gives the wrong field or the reservation is not cleared
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^admitted_key::tests::reader_/)'
    - id: credential-shape-tests
      why: a gateway credential is not recognised, or a plain upstream token is
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^credential_scrub::tests::shape_/)'
    - id: credential-scrub-tests
      why: a gateway credential survives in an egress header, or a legitimate upstream token is dropped
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^credential_scrub::tests::scrub_/)'
    - id: key-reload-tests
      why: a key reload failure gets the wrong status, or the master key path needs a database
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::live_admission::key_reload::tests::reload_/)'
    - id: owner-scim-tests
      why: the owner check fails closed, so a database blip would revoke a live key, or it misses a deactivated owner
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::live_admission::owner_scim::tests::owner_/)'
    - id: live-policy-tests
      why: the policy gates run in the wrong order or a gate failure gets the wrong status
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::live_admission::live_policy::tests::policy_/)'
    - id: envelope-match-tests
      why: an explicit credential is matched to the wrong envelope subject
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::live_admission::envelope_match::tests::envelope_/)'
    - id: admission-error-tests
      why: a 401 admission error is missed or another status is taken for one
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::live_admission::envelope_match::tests::admission_error_/)'
    - id: live-store-tests
      why: the production store maps a lookup error to the wrong KeyReadFailure
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::live_admission::live_store::tests::/)'
    - id: live-gates-tests
      why: the production gates map a dependency error to the wrong GateFailure or run the checks out of order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::live_admission::live_gates::tests::/)'
    - id: helper-tests
      why: the helper adapter does not reach the production functions
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::auth::b4679::/) - test(/replays_the_/)'
    - id: helper-oracle
      why: the helper cases are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-live-admission)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/mcp-live-admission
    - id: helper-python
      why: the Python helper adapter is unchanged or fails the strict checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4679.py tools/oracle/helpers/b4679)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-live-admission seed reaches the shared parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-live-admission-*')" &&
        grep -rlq b4679 tools/oracle/fuzz/corpus/helper_case/mcp-live-admission-* &&
