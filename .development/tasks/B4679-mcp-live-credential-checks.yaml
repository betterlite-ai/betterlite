id: B4679
title: MCP live credential checks and gateway credential scrubbing
description: >-
  An MCP request that carries a gateway credential has to be re-checked against live state before it is trusted, and a gateway credential must never leave the gateway in a header sent to an upstream server. In LiteLLM that is the key reload and policy half of MCPRequestHandler in user_api_key_auth_mcp.py, the egress scrub, and a few small checks the admission arms call. B4673 owns the admission arms and calls this code, and so do B4671 and B4672, so every name below is public and spelled as written here.


  The code goes in three crates and none of them gains a dependency on a crate above it. UserAPIKeyAuth keeps its fields pub(crate), so everything that reads or clears one lives in betterlite-auth, in the new module admitted_key. The egress scrub is pure and sits beside the bearer tests it uses, in betterlite-mcp, in the new module credential_scrub. Everything that reads a store or runs a gate goes in betterlite-server, in the new module mcp::live_admission. B4658 already adds betterlite-models to crates/betterlite-auth/Cargo.toml and betterlite-mcp to crates/betterlite-server/Cargo.toml, and this task relies on both, so it edits no Cargo.toml. Dependency code sits in these modules: betterlite_auth::subject_state::master_key_admin_auth and SubjectStateError (B4658), betterlite_mcp::bridge_credentials::is_bridge_envelope_shaped and betterlite_mcp::session_credentials::is_session_bearer_shaped (B4653), betterlite_mcp::envelope identity type (B4651), betterlite_auth::auth_key_lookup (B738), betterlite_auth::auth_user_lookup (B736), betterlite_auth::auth_request_policy (B744), betterlite_auth::virtual_key_routes (B883), betterlite_auth::central_auth_checks (B1221), betterlite_server::api::request_body (B1100) and betterlite_db::database_availability (B1217). hash_token and UserAPIKeyAuth come from B2314. This task uses nothing else from B4658: it does not use key_is_active, user_scim_deactivated or mcp::active_subjects.


  admitted_key, in crates/betterlite-auth/src/admitted_key.rs with a tests.rs beside it. admitted_key_is_active(key: &UserAPIKeyAuth, now: DateTime<Utc>) -> bool is LiteLLM's _admitted_key_is_active. A key with blocked equal to Some(true) is inactive, and any other blocked value counts as not blocked. No expiry is active. Expiry::DateTime compares as it stands. Expiry::Text goes through betterlite_models::savings_evidence::billed_at::decode_billed_at, which reads a naive value as UTC. The key is inactive only when the expiry is strictly before now, so an expiry equal to now is active. A text that can't be parsed makes the key inactive (see deviations). key_identity(key: &UserAPIKeyAuth) -> KeyIdentity<'_> returns the three fields the server needs: token_hash: Option<&str> (the stored hash in view.token.token), user_id: Option<&str> and mcp_admitted_user_subject: bool (the server-only marker B4671 and B4673 read). clear_budget_reservation(key: &mut UserAPIKeyAuth) sets extra.budget_reservation to None. Use betterlite_secrets or secrecy's expose_secret only inside key_identity, for the stored token hash.


  credential_scrub, in crates/betterlite-mcp/src/credential_scrub.rs with a tests.rs beside it. is_gateway_admission_credential(value: Option<&str>) -> bool is true when the value is Some and either is_session_bearer_shaped or is_bridge_envelope_shaped accepts it. Both of those strip an optional Bearer scheme first, so a value such as "Bearer llm_env_..." counts. EgressHeaders holds oauth2_headers: BTreeMap<String, String>, raw_headers: Vec<(String, String)> in request order, mcp_auth_header: Option<String> and mcp_server_auth_headers: BTreeMap<String, BTreeMap<String, String>>. scrub_gateway_admission_credentials(admitted: bool, headers: EgressHeaders) -> EgressHeaders applies four steps in this order. One, the oauth2 map is emptied when admitted is true or when its "Authorization" value is a gateway credential. Two, raw_headers drops every pair whose name equals authorization ignoring ASCII case when admitted is true, and every pair whose value is a gateway credential, whatever its name. Three, mcp_auth_header becomes None when it is a gateway credential. Four, in each per-server map the credential values are removed, and then every alias whose map is now empty is removed, including an alias that was empty before. A non-empty empty-check applies only when the outer map is non-empty, so an empty outer map stays empty. Python's None and {} for oauth2_headers and mcp_server_auth_headers are the same empty map here, and the helper compares them as equal.


  mcp::live_admission, in crates/betterlite-server/src/mcp/live_admission.rs, with the submodules key_reload, owner_scim, live_policy, envelope_match, live_store and live_gates, each with a tests.rs beside it. The root file holds the types and the two ports. The ports are native async fn in a trait taken as a generic parameter, not dyn, like B4658's SubjectStore.


  AdmittedKeyStore is the port to the stores. It has the associated types KeyFault and UserFault, both std::error::Error + 'static, and the methods now() -> DateTime<Utc>, has_database() -> bool, key_by_hash(key_hash: &str, check_db_only: bool) -> Result<UserAPIKeyAuth, KeyReadFailure<Self::KeyFault>> and user_by_id(user_id: &str) -> Result<Option<LiteLLMUserTable>, Self::UserFault>. KeyReadFailure<F> is Refused (LiteLLM's ProxyException or HTTPException), DatabaseUnavailable { message: String } and Other(F). LiteLLMUserTable is in crates/betterlite-db/src/identity_rows/user.rs.


  AdmissionGates is the port to the policy checks. It has the associated type Rejection (std::error::Error + 'static, the auth error value the dependency task raises for an HTTPException or ProxyException) and three methods. pre_db_read_checks(&self, request: &AdmissionRequest) is LiteLLM's _run_pre_db_read_auth_checks: read the body, then run the request size, body safety, IP and route allowlist checks, and return the first rejection as it is. route_allowed(&self, key: &UserAPIKeyAuth, request: &AdmissionRequest) is RouteChecks.should_call_route and is not async. common_checks(&self, key: &UserAPIKeyAuth, request: &AdmissionRequest) is _run_centralized_common_checks. Each returns Result<(), GateFailure<Self::Rejection>>. GateFailure<G> is Rejected(G), BudgetExceeded { status: u16, message: String }, DatabaseUnavailable { message: String } and Unclassified. AdmissionRequest { route: String, method: http::Method, headers: http::HeaderMap, client_ip: Option<String>, body: bytes::Bytes } is what B4673 builds from the incoming request.


  LiveAdmission<K: AdmittedKeyStore, G: AdmissionGates> has public fields store, gates and settings, and callers write the struct literal. LiveAdmissionSettings holds master_key: Option<SecretString> (the proxy master key) and admin_name: String (litellm_proxy_admin_name, default LITELLM_PROXY_ADMIN_NAME "default_user_id"). B8621 fills it, and this task reads no config key or env var. AdmissionRejection<K, G> is the one error type of this module, a thiserror enum with Http { status: u16, detail: String }, Gate(G), Subject (wrapping B4658's SubjectStateError with #[from]) and KeyRead(K), where K and G are the store's KeyFault and the gate's Rejection. Http carries the exact status and detail LiteLLM raises. INVALID_CREDENTIAL_DETAIL is "Invalid or expired credential".


  key_reload. reload_admitted_key(&self, key_hash: &str, check_db_only: bool) -> Result<UserAPIKeyAuth, AdmissionRejection<..>> is _reload_admitted_key. First master_key_admin_auth(key_hash, settings.master_key.as_ref(), &settings.admin_name): Ok(Some(key)) is returned at once, before any database check, active check or SCIM check. An Err is AdmissionRejection::Subject. Then has_database false gives Http 500 "Server misconfigured: no database connection". Then store.key_by_hash: Refused gives Http 401 with INVALID_CREDENTIAL_DETAIL, DatabaseUnavailable { message } gives Http 503 with that message, and Other(fault) gives KeyRead(fault), which stands for LiteLLM re-raising the original exception. Then a key that fails admitted_key_is_active at store.now() gives Http 401. Last, owner_scim runs and the key is returned.


  owner_scim. reject_if_owner_scim_deactivated(&self, key: &UserAPIKeyAuth) -> Result<(), AdmissionRejection<..>> is _reject_if_admitted_owner_scim_deactivated and fails open on purpose. With no user_id from key_identity it returns Ok. It reads the owner with store.user_by_id (a cache-first read with no upsert). Any read error logs at debug "bridge admission: user lookup failed, skipping SCIM gate: %s" with the error text and returns Ok. A missing row, a row with no metadata and a row whose scim_active is anything other than the JSON value false (metadata entry JsonData::Bool(false)) return Ok. Only that exact false gives Http 401 with INVALID_CREDENTIAL_DETAIL.


  live_policy. enforce_live_policy(&self, admitted: &mut UserAPIKeyAuth, request: &AdmissionRequest) -> Result<(), AdmissionRejection<..>> is _enforce_admitted_live_policy. It calls clear_budget_reservation, then gates.route_allowed, then gates.common_checks, and stops at the first failure, so the route gate runs first and a failure there never reaches the common checks. A failure maps as follows: Rejected(g) becomes Gate(g) unchanged, BudgetExceeded { status, message } becomes Http with that status and message, DatabaseUnavailable { message } becomes Http 503 with that message, and Unclassified becomes Http 401 with INVALID_CREDENTIAL_DETAIL. The mapping is one plain function over GateFailure with its own tests.


  envelope_match. explicit_credential_matches_envelope(key: &UserAPIKeyAuth, presented_token: &str, identity: &EnvelopeIdentity) -> bool is _explicit_credential_matches_envelope. A KeyHash subject matches when identity.subject equals B2314's hash_token(presented_token) (plain SHA-256 lowercase hex) or equals key_identity(key).token_hash. A UserId subject matches only when key_identity(key).user_id is Some and equals identity.subject. is_auth_admission_error(error: AdmissionErrorCode<'_>) -> bool is _is_litellm_auth_admission_error. AdmissionErrorCode is HttpStatus(u16) and ProxyCode(Option<&str>). HttpStatus is true only for 401. ProxyCode is true when the text, with surrounding whitespace removed, parses as the decimal integer 401, and a missing, non-numeric or other code gives false. B4673 builds the value from the exception it caught.


  live_store. LiveAdmittedKeyStore is the production AdmittedKeyStore. Its fields are the B738 key lookup, the B736 UserLookup, the database handle and the wall clock, as a struct literal, and no database handle means has_database false. KeyFault is B738's lookup error and UserFault is B736's. key_by_hash calls get_key_object with the hash and check_db_only. An error B738 raises as a ProxyException or HTTPException (including the 401 for a missing row) is Refused. For any other error B1217's find_database_service_unavailable_error_in_chain walks the whole cause chain: a hit is DatabaseUnavailable with the text from B1217's database_unavailable_message, and no hit is Other(error). user_by_id calls get_user_object with user_id_upsert false and check_db_only false and returns its error unchanged. Keep the error mapping in plain functions over those error values, so its tests run without Postgres.


  live_gates. LiveAdmissionGates is the production AdmissionGates. Its fields are the state objects B744, B883 and B1221 register under crates/betterlite-server/src/state/ and B1100's body decoder, as a struct literal. pre_db_read_checks decodes the body with B1100 and passes the result, the route and the request to B744's pre-DB stage, which runs size, body safety, IP, then route in that order. route_allowed calls B883's should_call_route. common_checks reads the body with B1100 and calls B1221's centralized common checks. A dependency error that is an HTTPException or ProxyException analog becomes Rejected. A budget error becomes BudgetExceeded with the status the error carries. A database-unavailable error found by B1217's chain search becomes DatabaseUnavailable. Anything else becomes Unclassified. Keep these mappings in plain functions over the error values too.


  Tests use a fake AdmittedKeyStore that records its calls, a fake AdmissionGates that records the order of its calls, a fixed now and synthetic keys. Test names start with the prefixes the check filters name. No route reaches this code yet, so the helper operation b4679 covers the five pure functions and the umbrella adds the HTTP cases. The Python side calls MCPRequestHandler._is_gateway_admission_credential, MCPRequestHandler._scrub_gateway_admission_credentials, MCPRequestHandler._admitted_key_is_active, _explicit_credential_matches_envelope and _is_litellm_auth_admission_error, building UserAPIKeyAuth, EnvelopeIdentity, HTTPException and ProxyException from the case. The Rust side calls is_gateway_admission_credential, scrub_gateway_admission_credentials, admitted_key_is_active, explicit_credential_matches_envelope and is_auth_admission_error. Expiry cases use dates far in the past or future, because LiteLLM reads the real clock. Gateway credential values in cases are plain strings with the prefixes llm_env_, llm_refresh_, llm_session_ and llm_srefresh_ and a few made-up characters after them, since the shape tests never decode. Add an mcp-live-admission-* seed to the helper_case corpus for each operation.
