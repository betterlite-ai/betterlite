deviations:
  - what: An expiry text that can't be parsed makes admitted_key_is_active false, so the request gets a 401.
    why: LiteLLM's _admitted_key_is_active lets datetime.fromisoformat raise and the caller answers an opaque 500. A key with an unreadable expiry can never be admitted either way, and the sibling check _key_is_active in bridge_token_flow.py already treats it as inactive.
  - what: An expiry text of a bare date followed by Z, such as 2099-01-01Z, parses as midnight UTC.
    why: decode_billed_at rewrites Z to +00:00 before it parses. The key table's expires column is a DateTime, so a stored row can't hold this text.
  - what: A proxy code such as "4_01" or a non-ASCII digit string is not taken for 401 by is_auth_admission_error.
    why: Python's int() accepts underscore separators and other Unicode digits, and no ProxyException in LiteLLM is built with such a code.
out_of_scope:
  - "user_api_key_auth_mcp.py: B4673 owns process_mcp_request (L417), _single_dcr_bridge_delegate_target, _admit_dcr_bridge_delegate, _open_dcr_bridge_envelope, _admit_dcr_bridge_dual_credential, _admit_dcr_bridge_authorization, _dcr_bridge_invalid_token_challenge, _admit_gateway_session, _reload_admitted_principal, reload_admitted_user, _admission_failure_fallback, _gateway_dcr_challenge and its target and scope helpers, and the cold-start checks. It calls everything built here."
  - "user_api_key_auth_mcp.py: reload_admitted_user stays with B4673 because it calls _admitted_subject_team_rpm_limits, which B4668 assigns to B4671, and B4671 depends on this task."
  - "user_api_key_auth_mcp.py: B4654 owns _parse_mcp_server_names_from_path, the header parsers, get_litellm_api_key_from_headers, _safe_get_headers_from_scope and _reject_duplicate_authorization. B4668, B4669, B4670, B4671 and B4672 own everything from get_mcp_server_access down."
  - "user_api_key_auth_mcp.py: _as_list, UnloadableEntitlementError, _has_client_supplied_mcp_auth, _agent_capped_servers, MCPServerAccess and DcrBridgeTarget have no named owner among the MCP admission tasks; they are small types and helpers the grant and admission tasks define where they use them."
  - "master_key_admin_auth, key_is_active, user_scim_deactivated and the active_subjects module: B4658. This task calls only master_key_admin_auth."
  - "The bearer shape tests, envelope and session token opening: B4653. Envelope identity types: B4651. get_key_object and get_user_object: B738 and B736. The route, pre-DB and common-check gates: B883, B744 and B1221. Body decoding: B1100. Outage classification: B1217."
  - "Wiring LiveAdmission, LiveAdmittedKeyStore and LiveAdmissionGates into the application state: B8621."
pitfalls:
  - The master key admin is returned before the database check, the active check and the SCIM check, so a proxy with no database still admits it.
  - The owner SCIM check is the one fail-open step, so any read error and a missing owner row pass, while the active check just before it fails closed.
  - Only a key with blocked equal to true is inactive here, so blocked unset or false stays active.
  - An expiry equal to now is still active, because LiteLLM tests expiry >= now.
  - The outage search walks the whole cause chain, because get_key_object wraps some failures in another exception, while B4658's key path asks only about the error itself.
  - A key read error that is neither a ProxyException nor an outage is re-raised and is not a 401, so it must stay a distinct KeyRead error for the route to render.
  - The route gate runs before the common checks inside the same try, so a route failure takes the same mapping as any other gate failure and never reaches the common checks.
  - A gate that raised HTTPException or ProxyException keeps its own status, and only an untyped failure becomes 401, since a blanket 401 would tell an over-budget caller that their credential is bad.
  - The budget reservation is cleared on the reloaded key before the gates run, so a stale reservation from a cached key can't be charged again.
  - The scrub tests the value after the optional Bearer prefix is stripped, so "Bearer llm_env_..." is dropped as well as the bare envelope.
  - A credential-shaped value is dropped under any raw header name, but the authorization name itself is dropped only for an admitted subject, so a plain upstream Authorization on a key-admitted request is kept.
  - A per-server alias that ends up empty is removed, and an alias that was already empty is removed too.
  - The envelope match compares against the plain SHA-256 hex of the presented token and also against the key's stored token, because a mapped JWT key stores a hashed-jwt- value that no hash of the presented token equals.
  - The admission error check reads a ProxyException code as text and parses it, so "401" is true, "abc" and a missing code are false and never an error.
  - UserAPIKeyAuth::construct strips server-only fields, so tests that need the admitted-user marker or a budget reservation must set them through the trusted setters B2314 gives, and this task adds no setter for the marker.
