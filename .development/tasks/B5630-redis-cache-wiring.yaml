id: B5630
title: Wire RedisCache to the breaker, service logging and config
description: >-
  B5640 builds `RedisCache` in betterlite-redis, where the breaker and the service
  logger are only the traits `BreakerGate` and `ServiceHooks`. This task fills those
  traits and reads the two cache settings from config. It adds the config section
  `redis_cache` and the module `redis_cache_wiring` in betterlite-server. Nothing
  calls the builder yet: B360, B4299 and B126 call it when they bring up their caches.

  Why betterlite-server. The gate needs `RedisFailurePolicy` from betterlite-router,
  the hooks need betterlite-logging, and both traits live in betterlite-redis. Only
  betterlite-server sees all three. betterlite-redis can't take betterlite-router, and
  betterlite-cache can't either, since the router reaches it through `DualCache`.
  Add `betterlite-redis` and `redis` to `crates/betterlite-server/Cargo.toml`, and
  `betterlite-logging` if B012 left it out.

  Config section. `crates/betterlite-config/src/sections/redis_cache.rs` has a `Raw`
  view of `litellm_settings.cache`, `litellm_settings.default_redis_ttl`,
  `litellm_settings.cache_params.default_redis_ttl` and
  `litellm_settings.cache_params.redis_flush_size`, built the way `redis_credentials.rs`
  reaches `cache_params`. `Settings` has `default_ttl: i64` and `redis_flush_size:
  Option<usize>`, read as `config.sections.redis_cache`.

  `cache_params` counts only when `litellm_settings.cache` is the boolean `true`,
  because the proxy reads it in that branch and nowhere else (L6304 and L6548 of
  `proxy_server.py`). Read `cache` through an untagged enum like `ScalarBool` in
  `redis_credentials.rs`, so text turns the switch off and is not a load error. The
  TTL is `cache_params.default_redis_ttl` when the switch is on, else
  `litellm_settings.default_redis_ttl`, else 60. Read each with `resolve_number` and
  `parse_float`, so `os.environ/NAME` works, then cut toward zero like Python's `int()`.
  Take `value.trunc()`, write it with `format!("{:.0}", ..)` and parse that text as
  `i64`, because the rules forbid `as` (`truncate_float_code` in
  `crates/betterlite-error/src/parse.rs` does the same). A failed parse is
  `ConfigError::InvalidInteger`, and `inf` and `NaN` fail the same way with no branch
  of their own. 0 and negative values stay as they are. Read `redis_flush_size` with
  `resolve_number` and a `usize` parser shaped like `parse_integer`, under the same
  switch. It stays `None` when unset, because only the response cache passes it
  (`caching.py` L213-L219). `Router._create_redis_cache` never does, and B4327's 100
  covers that instance.

  Gate. `PolicyGate` implements `BreakerGate` over B393's `RedisFailurePolicy`, one per
  `RedisCache`, because LiteLLM gives each instance its own breaker (L663-L667). B393's
  task names no Rust method, so read `crates/betterlite-router/src/redis_failure_policy.rs`
  on main and use its public operations for the steps below. `PolicyGate` has the
  fields `policy`, `next_call: AtomicU64` and `swallowed_calls: Mutex<BTreeSet<u64>>`.

  `enter(name)` asks the policy whether it is open, and when it is, returns
  `BreakerOpen` with `name`. Otherwise the admission's `u64` holds the policy's
  generation in the high 32 bits and the next call number in the low 32 bits.

  `exit(admission)` removes the number from `swallowed_calls`, and returns with no
  success when it was there. It also returns with no success when the policy's
  generation differs from the admission's. Otherwise it records a success (L520-L533).

  `record_failure(error)` keeps LiteLLM's filter (L549-L551): only a health failure
  reaches the policy, with `is_timeout` set for a timeout. `swallowed(admission,
  error)` applies the same filter, records the failure, and adds the admission's number
  to `swallowed_calls` (L434-L446). A command error or a decode error is no health
  failure, so it changes nothing, and that lets a caller reach `swallowed` after
  `exit` for a bad cached value with no entry left behind. B4327's sync
  `batch_get_cache` calls `swallowed` with no `exit` after a failed read, so cap the
  set: after an insert, drop the lowest entries past `SWALLOWED_CALLS_KEPT` (4096). A
  dropped entry costs one wrongly counted success, never a leak.

  Health check. Hand the error to B393's classifier of `_is_redis_health_failure` and
  `is_redis_timeout_failure`. If that takes a typed cause and not a `dyn Error`, walk
  `error.source()` to the first `redis::RedisError` or `std::io::Error` and map it with
  the `redis` crate's own kind checks. LiteLLM's health list is connection errors,
  timeouts, `BusyLoadingError`, `ClusterDownError` and `OSError` (L318-L333). When
  the failure passes the filter, also give it to B393's counterpart of
  `log_redis_failure` with the text "Redis operation failed", so timeout lines stay
  throttled. B4327 to B4329 write plain lines and count on this.

  Hooks. `ServiceEventHooks` implements `ServiceHooks` over B012's service events, and
  it is shared by every cache. B012's task names no Rust type either, so read
  `crates/betterlite-logging/src/logging_service_events.rs` on main. `success` sends
  a service event with service `redis`, `call_type`, `duration` in seconds, `is_error`
  false, and `event_metadata` of `{"key": key}` when `event.key` is `Some`. `failure`
  sends the same with `is_error` true and the error text. Start and end times, if
  B012's event wants them, come from B012's injected clock with start as end minus
  `duration`. Both trait methods are sync and must not block. If B012's entry point is
  async, spawn it on a `tokio::runtime::Handle` the struct holds, because sync cache
  methods run on `spawn_blocking` threads and on plain threads with no runtime
  context, as LiteLLM's `_dispatch_from_sync` allows for.

  Builder. `RedisCacheWiring` has public fields, and callers write the struct literal:
  `factory: Arc<LiveClientFactory>`, `store: Arc<RedisClientStore>`, `hooks: Arc<dyn
  ServiceHooks>`, B393's settings from `config.sections.redis_failure_policy`,
  `default_ttl: i64` from `config.sections.redis_cache.default_ttl`, and
  `default_major_version: u32` from
  `config.sections.redis_cache_primitives.default_redis_major_version`.
  `RedisCacheRequest` has `overrides: RedisOverrides`, `family: RedisCacheFamily`,
  `namespace: Option<String>` and `redis_flush_size: Option<usize>`. `async fn build<E:
  EnvironmentLookup>(&self, request: RedisCacheRequest, env: &E) -> Result<RedisCache,
  RedisCacheWiringError>` makes a new policy and `PolicyGate`, fills
  `RedisCacheOptions`, and awaits `RedisCache::connect`. That is where the namespace
  goes in and where `setup_health_pings` gets called, inside `connect`.
  `RedisCacheWiringError` is a `thiserror` enum owned by this module. Split the code
  into `redis_cache_wiring/gate.rs`, `hooks.rs` and `build.rs`.

  Tests. The section's tests sit in its `tests.rs` under `sections::redis_cache::tests`,
  named by the prefixes `ttl_`, `flush_size_` and `cache_switch_`. They use
  `ConfigLoader { lookup }.load(yaml)`. Wiring tests sit under
  `redis_cache_wiring/tests/`, one file per group. The fake Redis server is private to
  betterlite-redis, so `build` tests use a closed loopback port: `connect` must return
  `Ok` with the version read failing. The gate tests use a real `RedisFailurePolicy`
  and no connection.

  The oracle helper op `b5630` has one function, `cache_defaults`, with the inputs
  `default_redis_ttl` and `redis_flush_size`. Its Rust side builds a config YAML with
  `cache: true` and both keys under `cache_params`, loads it with `ConfigLoader`, and
  returns `default_ttl` and `redis_flush_size.unwrap_or(100)`. Its Python side sets
  `litellm.default_redis_ttl`, patches `litellm._redis.get_redis_client` and
  `get_redis_connection_pool` with stubs, replaces `RedisCache._setup_health_pings`
  with a no-op, builds a real `RedisCache(redis_flush_size=...)`, and returns its
  `default_ttl` and `redis_flush_size`. Each case file is `kind: helper` with `call:
  {b5630: {function: cache_defaults, ...}}`.

scope:
  paths:
    - crates/betterlite-config/src/sections/redis_cache.rs
    - crates/betterlite-config/src/sections/redis_cache/**
    - "crates/betterlite-config/fuzz/corpus/config_yaml/redis-cache-defaults-*"
    - crates/betterlite-server/src/redis_cache_wiring.rs
    - crates/betterlite-server/src/redis_cache_wiring/**
    - crates/betterlite-server/Cargo.toml
    - Cargo.lock
    - tools/oracle/cases/helpers/redis-cache-defaults/**
    - "tools/oracle/fuzz/corpus/helper_case/redis_cache_defaults-*"
    - tools/oracle/helpers/b5630.py
    - tools/oracle/helpers/b5630/**
    - tools/oracle/src/helpers/config/b5630.rs
    - tools/oracle/src/helpers/config/b5630/**
  lint_tables: false

