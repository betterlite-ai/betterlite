dod:
  - text: >-
      `default_ttl` is 60 when nothing is set, comes from
      `litellm_settings.default_redis_ttl` or `cache_params.default_redis_ttl`, cuts a
      float toward zero (`60.9` gives 60, `-0.5` gives 0), keeps 0, resolves
      `os.environ/NAME`, and fails the load for `.inf` and `.nan`.
    proof: [config-ttl-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `redis_flush_size` is `None` when unset, is the given number otherwise, and fails
      the load for a negative value.
    proof: [config-flush-size-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `cache_params` keys count only when `litellm_settings.cache` is the boolean `true`,
      and then `cache_params.default_redis_ttl` wins over
      `litellm_settings.default_redis_ttl`.
    proof: [config-cache-switch-tests]
  - text: >-
      `crates/betterlite-config/fuzz/corpus/config_yaml/redis-cache-defaults-valid.yaml`
      holds `default_redis_ttl` and `redis_flush_size` under `cache_params`, and
      `redis-cache-defaults-invalid.yaml` holds a TTL of `.inf`. Both replay through the
      config parser.
    proof: [config-corpus]
  - text: >-
      `PolicyGate::enter` returns `BreakerOpen` with the method name when the policy is
      open, and an admission otherwise. `exit` records a success, and records none when
      the generation moved after `enter`.
    proof: [gate-admission-tests]
  - text: >-
      After `swallowed` with a health failure, `exit` of that admission records no success
      while `exit` of a second concurrent admission still does. The set never
      passes `SWALLOWED_CALLS_KEPT`, and an admission with no `exit` leaves it bounded.
    proof: [gate-swallowed-tests]
  - text: >-
      `record_failure` and `swallowed` count connection errors and timeouts on the policy,
      flag timeouts as such, and ignore a command error and a decode error.
    proof: [gate-failure-tests]
  - text: >-
      `ServiceEventHooks` sends a `redis` service event with the call type, the duration
      in seconds and the key metadata, sends the error text on failure, and doesn't panic
      when called from a thread with no runtime context.
    proof: [hooks-tests]
  - text: >-
      `RedisCacheWiring::build` returns a `RedisCache` with the configured `default_ttl`,
      the request's namespace and `default_major_version` while Redis is unreachable, and
      two caches get two gates, so opening one leaves the other closed.
    proof: [build-tests]
  - text: Mutants in the changed config section code are caught.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: config-ttl-tests
      why: The default TTL key, its cut or its 60 default is missing
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::redis_cache::tests::ttl_/)'
    - id: config-flush-size-tests
      why: The flush size key is missing
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::redis_cache::tests::flush_size_/)'
    - id: config-cache-switch-tests
      why: The cache switch or the order between the two TTL keys is missing
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::redis_cache::tests::cache_switch_/)'
    - id: config-corpus
      why: The new config seeds are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/redis-cache-defaults-*")" &&
        grep -Fq 'default_redis_ttl' crates/betterlite-config/fuzz/corpus/config_yaml/redis-cache-defaults-valid.yaml &&
        grep -Fq 'redis_flush_size' crates/betterlite-config/fuzz/corpus/config_yaml/redis-cache-defaults-valid.yaml &&
        test -f crates/betterlite-config/fuzz/corpus/config_yaml/redis-cache-defaults-invalid.yaml &&
        test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: gate-admission-tests
      why: The gate's enter and exit are missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^redis_cache_wiring::tests::gate_admission::/)'
    - id: gate-swallowed-tests
      why: The per call swallow marker or its cap is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^redis_cache_wiring::tests::gate_swallowed::/)'
    - id: gate-failure-tests
      why: The health failure filter is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^redis_cache_wiring::tests::gate_failures::/)'
    - id: hooks-tests
      why: The service event adapter is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^redis_cache_wiring::tests::hooks::/)'
    - id: build-tests
      why: The builder or the gate per cache is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^redis_cache_wiring::tests::build::/)'
    - id: helper-python
      why: The Python side of cache_defaults has a lint or type error
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5630)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5630 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5630/pyrightconfig.json
    - id: helper-case-corpus
      why: The new cache default cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/redis_cache_defaults-*")" &&
        grep -lE '^[[:space:]]+b5630:' tools/oracle/fuzz/corpus/helper_case/redis_cache_defaults-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/redis-cache-defaults/ttl-unset-is-sixty.yaml
  - tools/oracle/cases/helpers/redis-cache-defaults/ttl-float-cuts-toward-zero.yaml
  - tools/oracle/cases/helpers/redis-cache-defaults/ttl-negative-float-cuts-up.yaml
  - tools/oracle/cases/helpers/redis-cache-defaults/ttl-zero-stays-zero.yaml
  - tools/oracle/cases/helpers/redis-cache-defaults/flush-size-unset-is-one-hundred.yaml
  - tools/oracle/cases/helpers/redis-cache-defaults/flush-size-given.yaml

deviations:
  - what: >-
      The order of keys under `litellm_settings` doesn't matter, and every cache gets the
      same TTL. `cache_params.default_redis_ttl` wins, else
      `litellm_settings.default_redis_ttl`. LiteLLM walks the keys in YAML order, so a
      `default_redis_ttl` written after `cache: true` misses the response cache but
      reaches caches built later.
    why: Settings resolve once at load, and a TTL that depends on YAML key order is an accident of the loop.
  - what: >-
      A boolean `default_redis_ttl` fails the load, where Python's `int(True)` gives 1. Text
      with a fraction is accepted and cut, where `int("60.5")` raises at startup.
    why: "`resolve_number` is the shared reader for numbers, and it rejects booleans and reads text as a float."
  - what: >-
      A negative or text `redis_flush_size` fails the load. LiteLLM starts, then flushes on
      every write for a negative value and raises `TypeError` at the first buffered write
      for text.
    why: B4327 takes a `usize`, and a load error tells the operator sooner.
  - what: >-
      A service event carries no `parent_otel_span` and no `caller`. LiteLLM sends both.
    why: B4325's `ServiceEvent` has neither field, and Rust has no frame names to walk.
  - what: >-
      The swallow marker belongs to one admission. LiteLLM's ContextVar spans the whole
      task, so when a guarded call swallows a failure inside another guarded call, the outer
      call counts no success either. Here `batch_cache_write` still counts a success after
      its inner pipeline swallowed a failure, and that resets the failure streak.
    why: The rules forbid ContextVar style state, and `batch_cache_write` is the only nested guard in the file.
  - what: >-
      Failures reach B393's throttled log with the fixed text "Redis operation failed".
      LiteLLM passes each method's own message to `log_redis_failure`.
    why: "`BreakerGate` gets the error and no message. The method's own text still goes out on its plain `tracing` line."

out_of_scope:
  - "`RedisCache.__init__`, `async_increment`, `async_get_cache`, `async_batch_get_cache`, `async_increment_pipeline`, `async_get_ttl` and `async_refresh_ttl`; B5640 owns them. This task hands `RedisCache::connect` what it needs."
  - "`RedisCircuitBreaker`, the failure classifiers, `log_redis_failure` and the `REDIS_CIRCUIT_BREAKER_*` settings; B393 owns them."
  - "`ServiceLogging`, its callback list and every exporter; B012 and the M5 exporter tasks own them."
  - "`DEFAULT_REDIS_MAJOR_VERSION`; B4324's section `redis_cache_primitives` already reads it."
  - "`RedisClusterCache`, `_build_redis_usage_cache`, `GcpTokenFetcher`, `AzureTokenFetcher`, `AwsCredentialsResolver` and the production credential source given to `LiveClientFactory`; B126 owns them."
  - "The other `cache_params` keys (`host`, `port`, `password`, `namespace`, `type`) and the `Cache` wrapper; B4299 owns them and passes them in `RedisCacheRequest`."
  - "`default_in_memory_ttl` and `dual_cache.py`'s use of `default_redis_ttl`; B4293 owns them."
  - "Building caches at server startup; B360, B4299 and B126 call `RedisCacheWiring::build`, and B126 adds the HTTP oracle cases."

pitfalls:
  - >-
      Don't treat a `default_redis_ttl` of 0 as unset. LiteLLM tests `is not None`, so 0
      gives `default_ttl` 0 and every `SET` then fails on `EX 0`.
  - >-
      `-0.5` cuts to `-0` in `format!`, and that parses as 0 in `i64`. Rounding instead of
      cutting turns `60.9` into 61.
  - >-
      `litellm_settings.cache` set to the text `"true"` is off, because the proxy tests
      `value is True`.
  - >-
      Build a new `RedisFailurePolicy` in every `build`. A shared one lets the response
      cache's outage open the breaker on the router's Redis.
  - >-
      A shared `AtomicU64` counter of swallowed failures looks simpler than the set, but
      then a success overlapping another call's failure is thrown away, the bug L434-L446
      warns about.
  - >-
      `exit` must remove the call number even when the generation moved, or the entry stays
      until the cap pushes it out.
  - >-
      `tokio::spawn` panics on a thread with no runtime, so sync cache paths need the stored
      `Handle`.
  - >-
      Restore `litellm.default_redis_ttl` in a `finally` in the Python adapter. One helper
      process runs every case, so a leaked value changes the next case's answer.
  - >-
      `BreakerOpen` must never reach `record_failure`. `enter` returns it before the body
      runs, so a test that sees it there has a broken guard.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
