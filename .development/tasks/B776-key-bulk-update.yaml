id: B776
title: Bulk key and team-key update routes
description: >-
  Implement /key/bulk_update and /team/key/bulk_update using the same KeyPatchPlan and single-key update
  executor B1220 _process_single_key_update, not B775's single-key HTTP handler. Execute sequentially
  as LiteLLM does: later entries observe earlier writes and failures do not abort subsequent entries.


  Build the production key_bulk_update module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  bulk_update_keys (L3627-L3783; 139 source lines), _build_failed_team_key_update (L3786-L3812; 25 source
  lines), bulk_update_team_keys (L3822-L4000; 153 source lines).

  bulk_admin_only gives HTTP 403 detail.error before the DB check; bulk_no_db is 500, bulk_empty
  and bulk_over_500 are 400. Exactly 500 is accepted. bulk_duplicate_repeated processes duplicates
  repeatedly and total_requested includes them. bulk_presence converts each item's exclude_unset
  dump into B770 UpdateKeyRequest, preserving explicit null. Pass changed-by (default None), router,
  caches/logging and B1224's custom update/policy hooks into B1220. result_order keeps original
  order separately within successful_updates and failed_updates; all_failed_still_200 is valid.

  failure_http_dict extracts detail.error or str(exception); failure_http_string uses detail;
  failure_proxy_message uses ProxyException.message; failure_other uses str(exception). For ordinary
  bulk, failure_info_refetch calls B124 PrismaClient.get_data(token=input,table_name='key',
  query_type='find_unique'), uses model_dump before legacy dict, and removes token from nonempty
  key_info. failure_refetch_swallowed returns key_info=null on any refetch error. Never roll back
  earlier row writes. Redact raw keys from the source's exception log; preserve failed_reason
  semantics with betterlite wording and no credential fragments.

  team_no_db precedes team_id_empty (500 then 400). team_input_limit checks the original key_ids
  length before deduplication, even with all_keys_in_team=true. team_all_active queries team_id,
  blocked=false OR null, expires=null OR strictly greater than UTC now, order token asc, take=501;
  team_all_over_limit gives 400 before membership checking. team_expiry_equal_now is excluded.
  Explicit key_ids include blocked/expired keys, hash only sk- via B770, deduplicate by hash and
  preserve the first raw identifier (duplicate_selection). Fetch rows scoped to the specified team.

  empty_team_still_authorizes uses B800 KEY_UPDATE permission with a synthetic row token
  '__team_scope_auth_check__', team_id=request.team_id, models=[] when no rows exist. It does not
  require a role named team-admin separately from B800's grant. passthrough_before_empty checks
  B861's metadata.allowed_passthrough_routes guard, then team_empty is 404 detail.error.
  Missing/wrong-team explicit keys are per-item 404 failures in a 200 response. Team updates merge
  key and validated team_id with exclude_unset update_fields, use preloaded existing rows, and
  report total_requested after deduplication. team_failure_uses_snapshot returns the preloaded row
  minus token, never the ordinary route's post-failure refetch. Failure logs omit the source's
  hash prefix too. No new rate/config/env setting controls the literal batch limit 500.


  Register these actual HTTP routes and aliases exactly once: POST /key/bulk_update -> bulk_update_keys;
  POST /team/key/bulk_update -> bulk_update_team_keys. Their outer failures are uncaught HTTPException
  passed through B865 and serialized as FastAPI detail objects; they have no error.type/param/code.
  Neither route calls handle_exception_on_proxy. Item errors are failed_reason strings, not HTTP error
  envelopes. B052 may reject authentication earlier. HTTP cases compare these shapes, status and JSON
  content-type; only diagnostic text is ignored. Inspect writes with POSTGRES_TEST_URL or testcontainers.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 317 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  317 production, 340 behavior/Postgres tests and 65 route/manifests/wiring lines,
  722 changed lines within a 775-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
