- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L12627-L12921
  why: Implementation boundary verified against the pinned checkout.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/common_utils.py#L43-L61
  why: Previously uncovered helper owned by this task.
dod:
- text: Write tests named deployment_catalog_behaviors and deployment_catalog_boundaries under deployment_catalog::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - deployment-catalog-behaviors
  - deployment-catalog-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/deployment-catalog-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/deployment-catalog-invalid.yaml;
    the valid seed contains model_group_alias. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - deployment-catalog-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: deployment-catalog-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::deployment_catalog_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: deployment-catalog-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::deployment_catalog_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/deployment_catalog.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/deployment_catalog.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/deployment-catalog-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/deployment-catalog-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/deployment-catalog-" && grep -Fq 'model_group_alias' crates/betterlite-config/fuzz/corpus/config_yaml/deployment-catalog-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
