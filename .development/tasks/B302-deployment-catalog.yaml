id: B302
title: Deployment catalog, aliases and wildcard routes
description: 'Resolve aliases, literal deployment IDs, team-visible names and wildcard fallback over B368
  DeploymentCatalog and B367 PatternCatalog. Return CatalogMatch with canonical group, candidate IDs and
  alias provenance. Accept a server-supplied authorized candidate view; caller metadata cannot create
  team authority. Wire lookup into existing chat and embedding selection without rebuilding clients or
  catalog mutation. Configuration boundary keys introduced or consumed here: model_group_alias. Pinned
  declaration defaults: model_group_alias={}. Resolve env values once in betterlite-config, never in router
  code. Implement the owned native service in crates/betterlite-router/src/deployment_catalog.rs. Add
  ProbeOperation::DeploymentCatalog in tools/oracle/src/router_probes/mod.rs and the corresponding B302 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router.py:
  Router._get_model_from_alias (L12627-L12635), Router._get_deployment_by_litellm_model (L12637-L12641),
  Router._try_early_resolve_deployments_for_model_not_in_names (L12643-L12688), Router._team_deployments_across_teams
  (L12690-L12713), Router.deployments_for_request (L12715-L12727), Router._is_strategy_marker_deployment
  (L12730-L12735), Router._common_checks_available_deployment (L12737-L12908), Router._drop_strategy_markers
  (L12910-L12921). Implement these behaviors through the typed Rust services above; synchronous facades
  and structural accessors reuse the same primitive instead of separate ports.'
