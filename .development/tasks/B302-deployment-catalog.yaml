id: B302
title: Deployment catalog, aliases and wildcard routes
description: Extend the B008 router with an immutable deployment catalog, stable explicit/generated IDs,
  ordered duplicate-name pools, aliases, wildcard substitution and transactional add/upsert/remove operations.
  Preserve catalog snapshots held by in-flight requests. Wire the catalog into existing chat and embeddings
  selection; do not rebuild providers in the selector. Put team authorization behind an explicit server-supplied
  candidate view, implemented in B319, rather than trusting request metadata. Use the existing Rust crate
  boundaries from B004 and B008; integrate through the server when the provider dispatcher or callbacks
  live in another core crate. This task's source slices are the linked ranges, not a port of their Python
  classes. Add the listed oracle cases and the matching adapters to B301's component runner where state
  is not observable over HTTP; adapters call production logic and never reproduce it. Use deterministic
  candidate sets or supplied random samples for comparisons, and separate seeded distribution tests for
  random choices. Extend the existing config_yaml fuzz target and committed corpus for every newly accepted
  config form; unsupported keys still fail by full path. Keep the implementation, adapters and tests within
  800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/deployment-catalog/**
  - tools/oracle/src/router_probes/deployment-catalog/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/deployment_catalog.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pattern_match_deployments.py#L16-L247
  why: Pattern precedence, substitutions and removal.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L9519-L10023
  why: Catalog mutations and rollback.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L12627-L12910
  why: Aliases, specific deployment selection and candidate resolution.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(deployment_catalog)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/deployment-catalog/duplicate-groups.yaml
- tools/oracle/cases/routing/deployment-catalog/alias-and-deployment-id.yaml
- tools/oracle/cases/routing/deployment-catalog/wildcard-specificity.yaml
- tools/oracle/cases/routing/deployment-catalog/wildcard-multiple-captures.yaml
- tools/oracle/cases/routing/deployment-catalog/failed-upsert-keeps-snapshot.yaml
- tools/oracle/cases/routing/deployment-catalog/remove-last-pattern.yaml
- tools/oracle/cases/routing/deployment-catalog/unknown-model.yaml
deviations: []
out_of_scope:
- SDK class wrappers (B162).
- Endpoint-specific provider operations remain in B014 and the endpoint tasks.
pitfalls:
- Only stars are expanded by the wildcard compiler; do not substitute a general regex router.
- Generated IDs must not expose credentials.
- Do not enable a config field before its consumer exists.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
