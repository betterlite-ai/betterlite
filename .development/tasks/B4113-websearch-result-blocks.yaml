id: B4113
title: Search result messages and native citation blocks
description: >-
  Build response builders that transform search outcomes into message format for agentic loop
  follow-ups and native Anthropic citation blocks. Preserve the two-message shape for Anthropic
  (assistant with tool_use blocks + user with tool_result blocks), the separate messages list for
  OpenAI (assistant with tool_calls + separate tool messages), the additive `snippet` field alongside
  the empty `encrypted_content`, the `srvtoolu_` ID prefix in native result pairs, and fallback text
  formatting when structured SearchResponse is absent.

  Build ten transformation and citation-block functions. In the transformation module: `transform_response`
  routes by response_format to either `_transform_response_anthropic` or `_transform_response_openai`; both
  accept tool_calls (dicts with id/name/input) and search_results (strings). `_transform_response_anthropic`
  prepends thinking_blocks if present (required by Anthropic API) and returns (assistant_message, user_message).
  `_transform_response_openai` returns (assistant_message, tool_messages list). `search_error_code` matches
  BaseException to WebSearchToolResultErrorCode: RateLimitError to "too_many_requests", BadRequestError to
  "invalid_tool_input", others to "unavailable". `search_outcome` converts execution results (exceptions,
  (text, SearchResponse) tuples or (text, None)) to SearchOutcome with logged errors. `search_outcome_text`
  extracts text from SearchSucceeded or formats SearchFailed as "Search failed: {message}". `format_search_response`
  builds readable text from SearchResponse.results with "Title: ...\nURL: ...\nSnippet: ..." per result or str(result).

  In the transformation module, build three native result block functions. `build_web_search_tool_result_block`
  constructs Anthropic-native blocks with type, tool_use_id, content (list of result items with url/title/page_age
  /encrypted_content/snippet). `build_web_search_tool_result_error_block` returns block with error_code.
  `build_web_search_outcome_block` dispatches SearchOutcome to one of the two builders.

  In the handler module, build four native-block injection functions. `_build_native_result_blocks` zips
  tool_calls with search_outcomes and returns tuple of (server_tool_use, web_search_tool_result) pairs.
  `_tool_call_query` extracts query from tool_call["input"] dict. `_native_result_pair` builds one pair with
  srvtoolu_<uuid> id. `_inject_native_blocks` prepends blocks to response.content (dict or object), catching
  AttributeError/TypeError. `async_post_agentic_loop_response_hook` reads WEBSEARCH_NATIVE_BLOCKS_METADATA_KEY
  from plan.metadata and injects blocks if present.

  Direct dependencies: B4111 for SearchSucceeded/SearchFailed/AnthropicSearchQuery/AnthropicServerToolUseBlock
  and B184 for RateLimitError/BadRequestError classification.

