dod:
  - text: >-
      transform_response returns (assistant_message, user_or_tool_messages) matching
      LiteLLM: for Anthropic, assistant with prepended thinking blocks then tool_use blocks,
      user message with tool_result blocks keyed by tool_use_id. For OpenAI, assistant with
      tool_calls and separate tool messages with tool_call_id keys.
    proof: [transformation-tests, helper-cases]
  - text: >-
      Thinking blocks from Anthropic responses are prepended to assistant_content before
      tool_use blocks when present, required by Anthropic API when extended thinking is enabled.
    proof: [transformation-tests, helper-cases]
  - text: >-
      search_error_code classifies exceptions: RateLimitError to too_many_requests,
      BadRequestError to invalid_tool_input, others to unavailable.
    proof: [transformation-tests]
  - text: >-
      search_outcome classifies result tuples: (str, SearchResponse) to SearchSucceeded,
      (str, None) to SearchSucceeded with response=None, BaseException to SearchFailed with
      error code, unexpected types to SearchSucceeded with string conversion.
    proof: [transformation-tests, helper-cases]
  - text: >-
      search_outcome_text extracts text: SearchSucceeded returns text, SearchFailed returns
      prefixed error message.
    proof: [transformation-tests]
  - text: >-
      format_search_response formats SearchResponse as text: iterate results emitting
      "Title: {}\nURL: {}\nSnippet: {}" separated by "\n\n"; if no results, return string conversion.
    proof: [transformation-tests, helper-cases]
  - text: >-
      build_web_search_tool_result_block returns web_search_tool_result block with url, title,
      page_age, empty encrypted_content, additive snippet per result. Empty response emits block
      with empty content list.
    proof: [transformation-tests, helper-cases]
  - text: >-
      build_web_search_tool_result_error_block returns block with error_code from
      WebSearchToolResultErrorCode.
    proof: [transformation-tests]
  - text: >-
      _build_native_result_blocks zips tool_calls with search_outcomes and returns tuple of
      (server_tool_use_block, web_search_tool_result) pairs. Each pair uses fresh srvtoolu_* id.
    proof: [native-blocks-tests, helper-cases]
  - text: >-
      _tool_call_query extracts query string from tool_call input dict, returning empty string
      if missing or not a string.
    proof: [native-blocks-tests]
  - text: >-
      _native_result_pair constructs pair with AnthropicSearchQuery and AnthropicServerToolUseBlock,
      calling model_dump() to serialize. Tool use id matches query string.
    proof: [native-blocks-tests, helper-cases]
  - text: >-
      _inject_native_blocks prepends native blocks to response content (dict field or object
      attribute), handles both dict and object form, gracefully falls through if object refuses write.
    proof: [native-blocks-tests]
  - text: Every listed transformation case (Anthropic, OpenAI, thinking blocks, error codes) matches LiteLLM.
    proof: [helper-cases]
  - text: Every listed native block case (single result, multiple results, error, empty) matches LiteLLM.
    proof: [helper-cases]

checks:
  optional: []
  commands:
    - id: transformation-tests
      why: transformation functions fail or do not exist
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^(search_error|search_outcome|format_search|transform_response|build_web_search)/)'
    - id: native-blocks-tests
      why: native result block functions fail or do not exist
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^(build_native|tool_call_query|native_result_pair|inject_native|post_agentic)/)'
    - id: helper-cases
      why: helper cases fail against LiteLLM or helper operation does not exist
      run: cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/helpers/websearch_result_blocks/

