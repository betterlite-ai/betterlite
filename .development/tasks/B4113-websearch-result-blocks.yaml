deviations:
  - what: >-
      betterlite returns message objects as Rust structs from transform_response,
      while LiteLLM returns dicts. The wire format is identical; the type system
      requires explicit returns.
    why: Rust's type system requires explicit message structures; Python uses implicit dicts.
  - what: >-
      Thinking blocks in Anthropic responses are preserved as a list prepended to
      assistant_content before tool_use blocks, matching LiteLLM's order when extended
      thinking is enabled.
    why: The Anthropic API requires thinking blocks to come first in the content list.
  - what: >-
      When format_search_response encounters a SearchResponse without results, it returns
      the result object as a string, matching LiteLLM's fallback behavior.
    why: Graceful handling of partial or missing structured data.

out_of_scope:
  - SearchResponse contract, the external search-execution provider record.
  - Native Anthropic web_search_* type detection (owned by B4111).
  - Actual search execution via litellm.asearch (owned by B4115).
  - Integration with agentic loop callbacks and async logging (owned by B4118/B4119).
  - Chat Completions or Responses API format detection (owned by B4112).
  - Web search tool recognition functions (owned by B4111).

pitfalls:
  - Helper cases for this task test pure transformation and block-building functions in the websearch_result_blocks oracle helper.
  - Arguments in OpenAI responses may be a JSON string or already a dict; normalize to dict for internal use and JSON for the wire.
  - The Responses API does not receive a transform_response call; output handling is separate.
  - Tool use IDs in tool_call dicts must match exactly in result blocks; generate srvtoolu_* IDs not toolu_*.
  - _inject_native_blocks handles both dict and object responses; catch AttributeError and TypeError gracefully.
  - search_outcome_text for SearchFailed returns the message with prefix not the error code.

review_level: standard
