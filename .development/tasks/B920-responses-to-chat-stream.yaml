id: B920
title: Responses to chat stream
description: >-
  Add an incremental Responses-to-chat stream state machine with stable stream ID and sequential tool indexes. Translate
  text, reasoning, function/custom/code-interpreter/web-search events and served service tier; reuse B005 event
  framing and preserve incremental delivery.


  Implement crates/betterlite-core/src/api/responses_to_chat_stream.rs. Use ResponsesToChatStreamInput and ResponsesToChatStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions text_delta, interleaved_tool_indices, reasoning_delta, service_tier_on_usage,
  terminal_incomplete, split_network_frame under api::responses_to_chat_stream::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::responses_to_chat_stream::decode_responses_to_chat_stre(bytes:
  &[u8], limits: &ApiLimits), for json.loads input str_line at litellm/completion_extras/litellm_responses_transformation/transformation.py:1355.
  Place its implementation in crates/betterlite-core/src/api/responses_to_chat_stream.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/responses_to_chat_stream.rs passes arbitrary
  bounded bytes to that exact decoder; api::responses_to_chat_stream::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesToChatStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_to_chat_stream: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator.__init__
  (L1329-L1338); litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator._handle_string_chunk
  (L1340-L1355); litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator._sequential_tool_call_index
  (L1358-L1373); litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator.translate_responses_chunk_to_openai_stream
  (L1376-L1636); litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator.chunk_parser
  (L1638-L1656); litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator._remember_served_service_tier
  (L1658-L1664); litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator._with_served_service_tier
  (L1666-L1669); litellm/completion_extras/litellm_responses_transformation/transformation.py: OpenAiResponsesToChatCompletionStreamIterator._with_stream_scoped_id
  (L1671-L1676). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 274 owned nonblank/non-comment/non-docstring Python lines (298 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 294 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 622 total within the 630-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B005 (Streaming chat completions), B171 (Direct helper oracle and URL path encoding),
  B912 (Responses tool results), B919 (Response chat result), B1087 (Api boundaries), B917 (Response chat history),
  B906 (Responses usage). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
