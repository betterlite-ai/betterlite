checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::/)
      - test(/::replays_corpus$/)'
  - id: case-text-delta
    why: the text-delta behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::text_delta($|::)/)'
  - id: case-interleaved-tool-indices
    why: the interleaved-tool-indices behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::interleaved_tool_indices($|::)/)'
  - id: case-reasoning-delta
    why: the reasoning-delta behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::reasoning_delta($|::)/)'
  - id: case-service-tier-on-usage
    why: the service-tier-on-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::service_tier_on_usage($|::)/)'
  - id: case-terminal-incomplete
    why: the terminal-incomplete behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::terminal_incomplete($|::)/)'
  - id: case-split-network-frame
    why: the split-network-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::split_network_frame($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_to_chat_stream)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/responses_to_chat_stream.rs && grep -qF "decode_responses_to_chat_stre"
      crates/betterlite-core/fuzz/fuzz_targets/responses_to_chat_stream.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_to_chat_stream.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_to_chat_stream-*)"
      && grep -qE "^[[:space:]]+responses_to_chat_stream:" tools/oracle/fuzz/corpus/helper_case/responses_to_chat_stream-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-to-chat-stream)"
