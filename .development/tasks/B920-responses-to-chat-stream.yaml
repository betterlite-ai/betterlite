id: B920
title: Translate Responses events into a chat stream
description: >-
  Implement api::responses_to_chat_stream as the complete OpenAiResponsesToChatCompletionStreamIterator
  class plus get_model_response_iterator. Its event translator is a pure state machine over
  B004/B1113 records, with B917 identity/tool/reasoning helpers and B906 usage. B010 supplies
  base iteration and B2214 its constructor; B005 supplies transport framing. B921 owns the
  provider call and HTTP stream tests. Here B171 compares deterministic decoded event
  sequences and individual stateless translations without substituting for provider I/O.

  Keep one chat ID, served service tier and output-index map per iterator. Expose
  decode_responses_chat_event_line(bytes,limits) for the actual _handle_string_chunk boundary;
  use B1087 limits and a same-named fuzz target with replays_corpus. This parser differs
  from B2412 recovery and must not silently discard malformed JSON. Register
  responses_to_chat_stream with typed event/line/stateless modes. Owned source is 305
  nonblank/non-comment lines; allow 310 implementation, 180 tests, 120 cases, 85 adapters,
  55 decoder/fuzz and 25 wiring lines, totaling 775.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_to_chat_stream.rs
  - crates/betterlite-core/src/api/responses_to_chat_stream/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/responses_chat_event_line.rs
  - crates/betterlite-core/fuzz/corpus/responses_chat_event_line/**
  - tools/oracle/src/helpers/core_ops/responses_to_chat_stream.rs
  - tools/oracle/src/helpers/core_ops/responses_to_chat_stream/**
  - tools/oracle/helpers/responses_to_chat_stream.py
  - tools/oracle/helpers/responses_to_chat_stream/**
  - tools/oracle/fuzz/corpus/helper_case/responses_to_chat_stream-*
  - tools/oracle/cases/helpers/responses-to-chat-stream/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L983-L989
  why: Iterator construction moves whole from B919, removing a result-to-stream dependency inversion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L1329-L1676
  why: Complete stream class includes raw-line decoding, one unsplit event translator and per-stream identity/tier state.
dod:
- text: >-
    event_line_decoding returns GenericStreamingChunk(text="",tool_use=null,is_finished=false,
    finish_reason="",usage=null) for empty lines or lines starting event:. Typed models
    use model_dump. For other strings remove everything through the first data: anywhere,
    then parse JSON; "prefix data:{\"type\":\"unknown\"}" is accepted. Invalid JSON and
    [DONE] raise decoder errors rather than returning a no-op; plain "{" has pinned
    JSONDecodeError message "Expecting property name enclosed in double quotes: line 1 column 2 (char 1)".
    Typed empty chunks raise ValueError "Chat provider: Empty parsed_chunk"; nonempty
    list [1] raises "Chat provider: Invalid chunk type <class 'list'>" with no HTTP fields.
  proof: [stream-tests, oracle, stream-adapter, stream-corpus]
- text: >-
    stream_identity sends response.created with wrapped id=resp_a followed by text delta hi
    and terminal output. Every returned chat chunk has upstream id=resp_a. If an unknown
    event arrives first, its B004-generated ID becomes the stream ID and later created IDs
    do not replace it. Separate iterators never share IDs. object=chat.completion.chunk or
    missing type with a nonempty choices list passes through B004 construction; other
    unknown events yield choice index=0,content="",finish_reason=null and debug
    "Chat provider: Unhandled event type '%s', creating empty chunk".
  proof: [stream-tests, oracle, stream-adapter]
- text: >-
    sequential_tool_indices sends function/custom output_item.added at output indices 2,5,2;
    tool indices are 0,1,0 with a stream map and 2,5,2 without one. B917 supplies names,
    IDs and provider fields; empty converted name becomes null, empty converted arguments
    fall back to event.arguments then "". function_call_arguments.delta and
    custom_tool_call_input.delta produce tool type=function,id=null,name=null with the same
    mapped index. Missing output_index defaults 0. Empty/null delta raises ValueError
    "Chat provider: Invalid function argument delta {'type': 'response.function_call_arguments.delta', 'delta': ''}"
    for the empty-string fixture; test custom input too.
  proof: [stream-tests, oracle, stream-adapter]
- text: >-
    item_done_is_not_terminal emits no finish_reason for output_item.done messages or calls.
    Stateless tool done returns the complete call from B917; stateful tool done returns
    an empty Delta so arguments are not duplicated. Message done gives content="".
    Text delta="" is valid, delta=hi gives content=hi, and absent/null text delta raises
    ValueError "Chat provider: Invalid text delta {'type': 'response.output_text.delta'}"
    for the absent fixture. reasoning_summary_text.delta with text=x uses summary_index
    as choice index and reasoning_content=x; empty reasoning delta becomes the unknown-event no-op.
  proof: [stream-tests, oracle, stream-adapter]
- text: >-
    terminal_finish_and_usage maps response.completed to tool_calls only when output has
    dict function_call/custom_tool_call; otherwise stop, including apply_patch alone.
    response.incomplete maps reason=content_filter to content_filter and all other/missing
    reasons to length. Return content="",all B917 reasoning_items or null,B906 usage only
    for truthy usage, and nonnull B917 provider metadata under provider_specific_fields or
    null. response.failed is unhandled here and yields a nonterminal empty chunk; B927
    owns provider stream error conversion before this bridge.
  proof: [stream-tests, oracle, stream-adapter]
- text: >-
    served_tier_continuity remembers nonempty string response.service_tier from any event,
    carries it onto later chunks that lack a nonnull tier and updates it on a new nonempty
    tier. Empty/nonstring tiers do not reset remembered state. A terminal explicit empty
    string remains empty because its chunk already has a nonnull tier. Each chunk_parser
    call logs "Chat provider: transform_streaming_response called with chunk: %s";
    translation logs "Chat provider: Processing event type: %s" except chat passthrough,
    and created logs "Chat provider: response.created -> %s".
  proof: [stream-tests, oracle, stream-adapter]
checks:
  optional: []
  commands:
  - id: stream-tests
    why: event translation loses indices, identity, terminal state or served tier
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::/) - test(/::replays_corpus$/)'
  - id: stream-corpus
    why: raw event lines do not pass through the fuzzed production boundary
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/responses_chat_event_line.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_chat_event_line)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_to_chat_stream::tests::replays_corpus$/)'
  - id: stream-adapter
    why: pure stream translation is not compared independently with pinned events
    run: test -f tools/oracle/helpers/responses_to_chat_stream.py && grep -qE '^[[:space:]]+responses_to_chat_stream:' tools/oracle/fuzz/corpus/helper_case/responses_to_chat_stream-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-to-chat-stream/event-line-decoding.yaml
- tools/oracle/cases/helpers/responses-to-chat-stream/stream-identity.yaml
- tools/oracle/cases/helpers/responses-to-chat-stream/sequential-tool-indices.yaml
- tools/oracle/cases/helpers/responses-to-chat-stream/item-done-is-not-terminal.yaml
- tools/oracle/cases/helpers/responses-to-chat-stream/terminal-finish-and-usage.yaml
- tools/oracle/cases/helpers/responses-to-chat-stream/served-tier-continuity.yaml
deviations: []
out_of_scope:
- B917 owns shared reasoning/history, B918 requests, B919 final nonstreaming results, B1136 content and B2412 recorded SSE recovery; the unused status helper remains excluded.
- B921 performs HTTP and tests network splits/cancellation; these helper cases exercise only this class's decoded event and raw-line transformations.
- BaseModelResponseIterator methods belong to B010/B2214 and generic framing to B005.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_to_chat_stream in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_to_chat_stream.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_to_chat_stream.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- output_item.done must not emit tool_calls as a finish reason or later calls disappear.
- The first translated chunk fixes the ID even when it precedes response.created.
- Empty text deltas are valid, while empty function/custom argument deltas are errors.
review_level: standard
budget:
  max_changed_lines: 775
  max_new_expects: 1
