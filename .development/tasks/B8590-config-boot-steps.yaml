    why: _BLOCKED_ENV_KEYS and _load_environment_variables, the skip order and the os.environ/ branch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6222-L6233
    why: _warn_on_misplaced_jwt_keys.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6097-L6105
    why: load_credential_list.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7046-L7098
    why: _init_non_llm_configs with the agents fallback and the worker_registry premium gate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7100-L7138
    why: _init_policy_engine.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7140-L7177
    why: _load_alerting_settings and its callback loop.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7179-L7239
    why: initialize_secret_manager's dispatch on key_management_system.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2719-L2745
    why: load_from_azure_key_vault, which logs instead of raising.
dod:
  - text: env_overlay skips every blocked key and the MCP stdio flag with their warnings, resolves os.environ/ values through the secret lookup and stringifies the rest.
    proof: [config-boot-tests]
  - text: misplaced_jwt_keys and credential_list match LiteLLM for present, absent and empty keys.
    proof: [config-boot-tests]
  - text: load_non_llm_configs calls the registry ports in LiteLLM's order with the agents and agent_list fallback, and worker_registry fails with the premium text.
    proof: [config-boot-tests]
  - text: init_policy_engine and load_alerting_settings skip on missing keys and pass the defaults (alerting_threshold 600) through the ports.
    proof: [config-boot-tests]
  - text: select_secret_manager accepts the eight systems, refuses any other value with the LiteLLM text, and leaves Azure Key Vault without a URI unset.
    proof: [config-boot-tests]
checks:
  optional: [mutants]
  commands:
    - id: config-boot-tests
      why: a load_config step is missing or differs from LiteLLM
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^config_boot::/)'
oracle_cases: []
deviations:
  - what: environment_variables from the config file go into an overlay map that betterlite's own env reads use, not into the process environment.
    why: Rust code reads settings through the env map it is handed; writing the process environment after threads start is unsound.
  - what: LITELLM_LICENSE in environment_variables does not re-check a premium license.
    why: betterlite has no paid tier.
out_of_scope:
  - "Calling these steps at startup in load_config order: B8374. Building the production SecretLookup with real HTTP: the wave 17 cache and secrets wiring part."
  - "The response cache build (_init_cache) is B5630 with B8377's usage cache selection; switch_on_llm_response_caching is the wave 17 cache and secrets wiring part's CacheReinit for B8502."
  - "The registries behind the ports: MCP tools B4680, agents B4776, MCP servers B6764, policies B3250, alerting update_values B8399."
  - "The router settings hierarchy (_parse_router_settings_value, get_hierarchical_router_settings): B881."
pitfalls:
  - A config with an explicit null agents key does not fall back to agent_list, since LiteLLM reads config.get("agents", config.get("agent_list")).
  - BLOCKED_ENV_KEYS is case-sensitive, so "Path" or "ld_preload" pass through.
  - An os.environ/ value that resolves to nothing leaves the key unset rather than writing the literal reference.
  - alerting entries named "slack" are skipped in the callback loop but still reach update_alerting.
  - The secret manager comparison is on the exact lower-case enum value strings.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
