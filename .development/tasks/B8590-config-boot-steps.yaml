id: B8590
title: Config load steps for environment, credentials, registries, policies, alerting and secret managers
description: >-
  ProxyConfig.load_config in LiteLLM calls a row of small helpers that no other task builds. This task ports them as
  plain functions in crates/betterlite/src/config_boot.rs (module declared by the skeleton), next to B8374's lifespan,
  which calls them in load_config order. Error enum ConfigBootError in the module's own files.


  `env_overlay(config, process_env, secrets)` ports _load_environment_variables. It reads the top-level
  `environment_variables` mapping and returns a `BTreeMap<String, String>` that starts as a copy of process_env and
  gets each config entry laid over it, in file order. Skip a key in BLOCKED_ENV_KEYS (PATH, LD_PRELOAD,
  LD_LIBRARY_PATH, DYLD_LIBRARY_PATH, DYLD_INSERT_LIBRARIES, PYTHONPATH, PYTHONSTARTUP, PYTHONHOME, HOME, USER, SHELL,
  LOGNAME, NO_PROXY, no_proxy; exact, case-sensitive match) with the warning "Skipping blocked environment variable key:
  <key>". Skip the MCP stdio flag key (the key B3211's is_mcp_stdio_flag_key accepts) with the warning "Ignoring
  <MCP_STDIO_ENABLED_ENV_VAR> set in the config file. Set it in the proxy's environment instead". A string value that
  starts with "os.environ/" is resolved through B8500's `SecretLookup::get_secret_str` and set only when it resolves;
  any other value is stored as its string form (numbers and booleans as Python's str() prints them: True, False, 1.5).
  The overlay is what B8374 hands to every later env read, since betterlite does not write the process environment.


  `misplaced_jwt_keys(config)` ports _warn_on_misplaced_jwt_keys: it returns the subset of enable_jwt_auth and
  litellm_jwtauth (in that order) found at the top level and logs one warning naming them, joined with ", ".
  `credential_list(config)` ports load_credential_list: the top-level credential_list parsed into B1601's
  CredentialItem records, empty when the key is missing, null or an empty list.


  `load_non_llm_configs(config, config_file_path, ports)` ports _init_non_llm_configs. In this order: mcp_tools
  (when truthy) goes to ports.mcp_tools with the config file path; agents, or agent_list when agents is absent (an
  explicit null agents key wins and skips both), goes to ports.agents; mcp_servers (when truthy) goes to
  ports.mcp_servers with litellm_settings.mcp_aliases; vector_store_registry (when truthy) goes to
  ports.vector_stores. worker_registry, when truthy, fails with ConfigBootError::WorkerRegistryNeedsPremium whose text
  is "Trying to use `worker_registry`" followed by LiteLLM's CommonProxyErrors.not_premium_user text, because
  open-source LiteLLM without a license refuses it the same way; otherwise the worker list is empty. The ports are one
  trait `NonLlmRegistries` with four methods, so the wave 17 wiring part plugs in B4680, B4776, B6764 and the vector
  store registry.


  `init_policy_engine(config, has_db, ports)` ports _init_policy_engine: no config or a falsy policies key does
  nothing; otherwise it calls ports.init_policies(policies, policy_attachments, validate_db = has_db,
  fail_on_error = true) and returns its error. `load_alerting_settings(general_settings, ports)` ports
  _load_alerting_settings: when general_settings.alerting is absent or null it does nothing; otherwise it calls
  ports.update_alerting with alerting, alerting_threshold (default 600), alert_types, alert_to_webhook_url,
  alerting_args and alert_type_config, then for each entry other than "slack" that is a known custom-logger callback
  name it asks ports.add_alerting_logger(name, alerting_args) to register it; unknown names are skipped.


  `select_secret_manager(key_management_system, config_file_path, env)` ports initialize_secret_manager and
  load_from_azure_key_vault. None does nothing. The accepted values are KeyManagementSystem's: azure_key_vault,
  google_kms, aws_secret_manager, aws_kms, google_secret_manager, hashicorp_vault, cyberark, custom. Any other string
  fails with ConfigBootError::InvalidKeyManagementSystem and the text "Invalid Key Management System selected". It
  returns the B4421 ManagerState (client handle plus settings) that B8500's SecretLookup.manager holds; azure_key_vault
  without AZURE_KEY_VAULT_URI logs LiteLLM's error and installs no client instead of failing, google_kms and aws_kms go
  through B4412, custom through B4419.
scope:
  paths:
    - crates/betterlite/src/config_boot.rs
    - crates/betterlite/src/config_boot/**
  lint_tables: false
references:
