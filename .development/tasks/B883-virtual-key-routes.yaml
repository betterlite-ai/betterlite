pitfalls:
  - Empty allowed_passthrough_routes on a key falls back to the team's list; it is not an explicit deny.
  - password_reset_required changes only the final denial, so allowed password-change routes still work.
  - JWT team wildcard filtering strips stars and slashes before matching, excluding blanket grants.
