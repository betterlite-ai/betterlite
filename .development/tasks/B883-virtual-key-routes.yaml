dod:
  - text: 'Named grant cases: mit_enterprise_import_absent, routes_none_allows, routes_nonlist_allows,
      routes_empty_allows, explicit_route_grant, named_group_grant, wildcard_before_denial,
      team_pass_through_grant, empty_key_uses_team, nonempty_key_overrides_team, missing_metadata_grant,
      null_metadata_grants, jwt_team_only, jwt_mapped_key_excluded, jwt_blanket_denied, jwt_group_denied,
      jwt_explicit_prefix, mcp_discovery_get, mcp_discovery_write_denied, auto_router_get,
      auto_router_write_denied, agent_compatibility_grant, password_reset_denied,
      password_reset_allowed_route, virtual_route_denied, registered_protected_route,
      absent_auth_unprotected and passthrough_denial_precedes_reset.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^virtual_key_routes::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/virtual_key_routes.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/virtual-key-routes-*")"
        && grep -rlq "virtual_key_routes" tools/oracle/fuzz/corpus/helper_case/virtual-key-routes-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^virtual_key_routes::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/virtual-key-routes-*")"
        && grep -rlq "team_allowed_routes" crates/betterlite-config/fuzz/corpus/config_yaml/virtual-key-routes-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::virtual_key_routes::tests::/)
        - test(/replays_the_/)'
