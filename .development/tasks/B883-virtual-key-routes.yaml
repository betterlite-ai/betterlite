id: B883
title: Virtual-key route grants and pass-through policy
description: >-
  Authorize virtual-key allowed_routes and pass-through route grants with method-aware RouteMatch. Call
  B2302's concrete PassThroughRegistry lookup; B102 later supplies its handler registrations to that same
  registry. This check enforces protection only when registered metadata has auth exactly true; absent auth
  does not pass that identity check. should_call_route skips a failed enterprise import, then checks the
  virtual-key grants for every role; there is no premium_user branch or deviation here. Do not depend on the B102 umbrella, whose endpoint installation
  requires auth.


  Build the production virtual_key_routes module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/route_checks.py:
  RouteChecks.should_call_route (L72-L91; 17 source lines), RouteChecks.is_virtual_key_allowed_to_call_route
  (L94-L210; 80 source lines), RouteChecks.is_auth_enforced_pass_through_route (L669-L684; 14 source lines),
  RouteChecks._auth_pass_through_denied_exception (L687-L694; 8 source lines), RouteChecks.jwt_team_routes_grant_pass_through
  (L697-L707; 11 source lines), RouteChecks._jwt_team_allowed_routes (L710-L717; 6 source lines), RouteChecks._require_auth_pass_through_access
  (L720-L733; 14 source lines), RouteChecks.check_passthrough_route_access (L736-L762; 23 source lines).


  None, non-list and empty allowed_routes return true before any denial, including password-reset metadata.
  For a nonempty list, try explicit path/prefix matches, named LiteLLMRoutes groups from B866/B867/B868,
  then wildcard matches through B882. openai_routes and llm_api_routes group matches require a separate
  grant for registered auth=true pass-through routes. llm_api_routes also grants GET /auto_router/session,
  registered unprotected pass-throughs, GET /v1/mcp/server and /v1/mcp/server/{server_id}, and the agent
  registry routes in B867. It does not waive the agent handler's write authorization. Exact and wildcard
  matches return before the remembered protected-pass-through denial; preserve that ordering.

  If no grant matches, protected pass-through gets HTTP 403 with instructions to configure
  allowed_passthrough_routes. Otherwise metadata.password_reset_required is True gives a separate 403
  directing the user to POST /user/password/change or /ui/change-password and then another login; only
  after this branch is the ordinary virtual-route 403 used. B757 translates each HTTPException to
  auth_error, param string None and code 403; compare those fields and ignore /error/message wording.

  Metadata grants choose the key's truthy allowed_passthrough_routes, otherwise the team's, otherwise [].
  Missing keys or two null values deny. A nonempty key list overrides the team rather than unioning with
  it. JWT team grants apply only with jwt_claims present, token absent and team_id present; mapped virtual
  keys stay key-scoped. JWT path grants skip * and /* and never expand group names such as openai_routes.
  _require_auth_pass_through_access tries the metadata grant before those explicit JWT paths, then raises
  the protected-pass-through 403.

  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.team_allowed_routes=['openai_routes',
  'info_routes', 'mcp_routes', '/v1/messages', '/v1/messages/count_tokens'].


  Add the virtual_key_routes operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a virtual-key-routes-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::virtual_key_routes::tests::loads_team_routes, default_team_routes,
  empty_team_routes and malformed_team_routes. Missing uses the five-route default; [] is accepted;
  null, a scalar or a non-string item fails the list[str] settings validation instead of falling back.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 173 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  173 production, 265 behavior tests, 80 helper adapters, 65 route/manifests/wiring and 60 config lines,
  643 changed lines estimated within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::virtual_key_routes::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.


  Registry grant scenarios use B2302's completed lookup against equivalent snapshots in the helper cases.
  General pass_through_endpoints configuration stays rejected until B102 installs its handlers;
  B102 owns those enabled-route HTTP cases. This task pins its static virtual-route denial
  through real HTTP before downstream dispatch.
