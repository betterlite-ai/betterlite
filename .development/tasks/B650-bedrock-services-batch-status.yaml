checks:
  optional:
  - mutants
  commands:
  - id: case-batch-status-table
    why: The batch-status-table behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_status_cases::case_[0-9]+_batch_status_table$/)'
  - id: case-unknown-status-default
    why: The unknown-status-default behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_status_cases::case_[0-9]+_unknown_status_default$/)'
  - id: case-timestamps-and-null-fields
    why: The timestamps-and-null-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_status_cases::case_[0-9]+_timestamps_and_null_fields$/)'
  - id: case-record-counts
    why: The record-counts behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::batch_status_cases::case_[0-9]+_record_counts$/)'
  - id: case-output-uri-prediction
