id: B650
title: Bedrock batch status and result metadata
description: >-
  Add BatchStatusReply projection for timestamps/status, request counts, input/output configurations, error metadata
  and predicted output-file ids. Preserve unknown-status fallback to validating and any source warning rather than
  strict rejection; derive stable timestamp values through injected time.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/batches/transformation.py:
  BedrockBatchesConfig.transform_retrieve_batch_request L396-L454; BedrockBatchesConfig._parse_timestamps_and_status
  L456-L508; BedrockBatchesConfig._extract_file_configs L510-L528; BedrockBatchesConfig._extract_errors_and_metadata
  L530-L567; BedrockBatchesConfig.transform_retrieve_batch_response L569-L653; BedrockBatchesConfig.get_error_class
  L655-L659. litellm/llms/bedrock/batches/handler.py: _sigv4_config L36-L39; _extract_region_from_bedrock_arn L42-L50;
  _extract_job_id_from_arn L53-L57; _predict_output_file_uri L60-L79; _record_counts_from_response L82-L92; _to_epoch
  L95-L102.


  Implement crates/betterlite-bedrock/src/batch_status.rs with adjacent tests under batch_status/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_batch_status in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batch_status_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  batch_status_table, unknown_status_default, timestamps_and_null_fields, record_counts, output_uri_prediction,
  errors_and_metadata, titan_batch_token_usage. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and
  captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_status* using HelperCase:
  kind: helper and the externally tagged bedrock_services_batch_status variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_batch_status that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_batch_status consumes model-invocation-job status JSON bytes in crates/betterlite-bedrock/src/batch_status.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_batch_status.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_batch_status.
  The adjacent test replays_the_bedrock_services_batch_status_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 271 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 561 planned, 575 maximum changed lines.
