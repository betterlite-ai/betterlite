id: B650
title: Bedrock batch status and result metadata
description: >-
  Add BatchStatusReply projection for timestamps/status, request counts, input/output configurations, error metadata
  and predicted output-file ids. Preserve unknown-status fallback to validating and any source warning rather than
  strict rejection; derive stable timestamp values through injected time.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/batches/transformation.py:
  BedrockBatchesConfig.transform_retrieve_batch_request L396-L454; BedrockBatchesConfig._parse_timestamps_and_status
  L456-L508; BedrockBatchesConfig._extract_file_configs L510-L528; BedrockBatchesConfig._extract_errors_and_metadata
  L530-L567; BedrockBatchesConfig.transform_retrieve_batch_response L569-L653; BedrockBatchesConfig.get_error_class
  L655-L659. litellm/llms/bedrock/batches/handler.py: _sigv4_config L36-L39; _extract_region_from_bedrock_arn L42-L50;
  _extract_job_id_from_arn L53-L57; _predict_output_file_uri L60-L79; _record_counts_from_response L82-L92; _to_epoch
  L95-L102. litellm/llms/bedrock/common_utils.py: CommonBatchFilesUtils.get_error_class L2023-L2027.


  Named case contracts: batch_status_table: decode_batch_status uses exactly the B649 creation status map: Submitted/Validating
  validating; Scheduled/InProgress in_progress; PartiallyCompleted/Completed completed; Failed failed; Stopping
  cancelling; Stopped cancelled; Expired expired. Run the same table cases in both tasks. object batch, endpoint
  /v1/chat/completions,completion_window 24h,jobArn default empty,error_file_id/finalizing_at/expired_at/cancelling_at/request_counts
  None. unknown_status_default: Missing status defaults Submitted; explicit None or any unknown status stringifies
  and falls back validating without warning. JSON parse failure -> ValueError Failed to parse Bedrock batch response:
  {error}; no own non-2xx guard. Preserve malformed record-shape failure rather than silently replacing with {}.
  timestamps_and_null_fields: ISO parser converts str(value), replaces every Z with +00:00, truncates timestamp
  toward zero, and silently returns None on malformed/falsey input. Pin oracle timezone for naive inputs. created_at
  from submitTime or current clock (epoch0 also falls back); in_progress_at from lastModifiedTime only Validating/Scheduled/InProgress;
  completed_at from endTime only Completed/PartiallyCompleted; failed_at only Failed; cancelled_at only Stopped;
  expires_at from jobExpirationTime for every status. Other timestamp fields remain None. record_counts: Handler
  helper requires totalRecordCount and successRecordCount Python ints, accepting bool and negative values; missing/wrong
  type yields None. failed is integer errorRecordCount (bool included), otherwise0. Do not clamp totals or derive
  failures by subtraction. This helper is used by B651, while generic transform_retrieve_batch_response keeps request_counts
  None. output_uri_prediction: Require truthy output_prefix,input_uri,job_id and nonempty final slash component
  of input_uri. Append slash to output_prefix only if absent, then job_id/basename.out. Preserve percent encoding
  and query text literally; no S3 authorization, listing or read. Missing ingredients return None. _extract_job_id_from_arn
  requires literal :model-invocation-job/ anywhere, then returns final slash component or None; it does not validate
  ARN. errors_and_metadata: Truthy response message produces Errors object=list with one BatchError message and
  code=str(raw HTTP status), otherwise errors None. Enrich only jobName,clientRequestToken,modelId,roleArn,timeoutDurationInHours,vpcConfig;
  omit None, JSON-dump dict/list (SDK unserializable fallback str), stringify other values with Python semantics.
  No warning, OpenAI sixteen-key limit or safe_dumps here. Both get_error_class methods delegate to B682 BedrockError
  with unchanged status,message,headers. retrieve_signed_request: Require B198 is_bedrock_arn prefix or ValueError
  Invalid batch_id format. Expected ARN, got: {batch_id}; split colon fewer than6 -> Invalid ARN format: {batch_id};
  region not matching ^[a-z][a-z0-9-]*$ -> Invalid region in ARN: {batch_id}. URL https://bedrock.{arn_region}.{partition_suffix}/model-invocation-job/{quote(full_arn,safe="")}.
  Merge B596 then B595 sign service bedrock/method GET/data={}; return GET,url,headers,data=None. Do not overwrite
  signer aws_region_name with ARN region: URL and signing region can differ at the pin. file_config_shapes: Require
  nested dicts inputDataConfig.s3InputDataConfig, otherwise input_file_id empty. Require nested dicts outputDataConfig.s3OutputDataConfig,
  otherwise output_file_id None; absent outer/nested dictionaries default {}, so missing s3Uri in valid dictionaries
  yields empty string. This generic projection exposes the supplied output prefix and does not call the handler
  prediction helper. handler_region_and_time: _extract_region_from_bedrock_arn returns fourth colon component only
  when at least4 parts and third is bedrock; empty/errors -> None, without ARN-prefix or region-regex validation.
  _to_epoch accepts int/float including bool and datetime, truncates to integer; None/strings -> None, while nonfinite
  float conversion raises. _sigv4_config sets signature_version=v4. These B651 SDK-seam helpers differ from the
  stricter generic request/ISO parser above.


  Implement crates/betterlite-bedrock/src/batch_status.rs with adjacent tests under batch_status/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batch_status_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  batch_status_table, unknown_status_default, timestamps_and_null_fields, record_counts, output_uri_prediction,
  errors_and_metadata, retrieve_signed_request, file_config_shapes, handler_region_and_time. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_batch_status* using HelperCase:
  kind: helper and the externally tagged bedrock_services_batch_status variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_batch_status that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_batch_status consumes model-invocation-job status JSON bytes in crates/betterlite-bedrock/src/batch_status.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_batch_status.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_batch_status.
  The adjacent test replays_the_bedrock_services_batch_status_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 276 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 310 production lines, 285 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 790 planned, 800 maximum changed lines.
