id: B10011
title: SSO assertion cache, persistence and retention
description: >-
  After an SSO login LiteLLM keeps the user's IdP id_token, but only while some MCP server uses auth_type oauth2_id_jag, so that server can later spend it as an RFC 8693 subject_token. The dashboard login (B1624) and the CLI login (B1614) call retain_sso_identity_assertion_for_ema, and B1617's post-login diagnostics ask ema_assertion_retention_enabled. This task builds that write side of sso_assertion_store.py, so those logins don't wait on the MCP egress work: the assertion cache, the store struct with persist, the retention gate and retain, and the config section for the cache. B4663 adds the reads and the SsoAssertionStore port on the same struct.


  Layout. crates/betterlite-mcp/src/sso_assertions/cache.rs and sso_assertions/store.rs, each with a tests.rs in its folder, and the section crates/betterlite-config/src/sections/mcp_sso_assertion_cache.rs. All three are empty stubs on main. This task uses B10003's SsoIdentityAssertion and encode_payload as they are, B10010's AssertionRows and its shared MemoryAssertionRows fake, and B1600's DbCipher. Names stop at 30 characters, so ema_assertion_retention_enabled is retention_enabled, persist_sso_identity_assertion is persist and retain_sso_identity_assertion_for_ema is retain; B1617 and B1624 use the LiteLLM names in their text.


  sso_assertions::cache. SsoAssertionCache has the shape of ByokCredentialCache in credential_contracts::byok_cache: pub fields ttl, max_size, clock: Box<dyn Clock> (that file's trait) and a Mutex over the entries and one u64 epoch. Callers build it with a struct literal and share one Arc. epoch() reads the counter. get clones a live entry; an expired one is removed and reads as a miss. set_if_unchanged(user_id, assertion, seen_epoch) writes only if the epoch still equals seen_epoch. invalidate(user_id) adds one to the epoch and then removes the entry. InMemoryCache's limits carry over: a write first drops expired entries, then drops the entries with the earliest expiry until the cache is below max_size, max_size 0 stores nothing, and rewriting a live key replaces the value and keeps the first expiry. The cache never judges an assertion's own expires_at.


  sso_assertions::store. DbSsoAssertionStore<R: AssertionRows> has pub fields rows: Option<R>, cipher: DbCipher, cache: Arc<SsoAssertionCache> and config_declares_id_jag: bool. rows None stands for LiteLLM's prisma_client None. B8620 builds the one cache and computes config_declares_id_jag from the config file's mcp_servers, and B8622 builds the store. The fields stay pub because B4663 adds fetch and fetch_uncached in its own module. persist(user_id, assertion) with no rows returns Ok and does nothing else; otherwise it encodes with encode_payload, encrypts under the current key, upserts and then invalidates the cache. An encrypt or upsert failure returns this module's error enum, which B4664 wraps as the source of its AssertionStoreUnavailable. retention_enabled is true when config_declares_id_jag is true (no query), false with no rows, otherwise id_jag_server_exists. retain(user_id, assertion: Option<&SsoIdentityAssertion>) returns unit: None does nothing, a false gate does nothing, and a failure in the gate or in persist logs the warning "Failed to persist the SSO identity assertion for EMA egress (user_id=%s): %s" and is swallowed, because the login must not fail on this write.


  Config. The section mcp_sso_assertion_cache reads two env vars with betterlite_env::number and no YAML key: MCP_SSO_ASSERTION_CACHE_TTL_SECONDS (default 60) and MCP_OAUTH2_TOKEN_CACHE_MAX_SIZE (default 200). Settings has ttl_seconds: u64 and max_size: usize. Its tests are sections::mcp_sso_assertion_cache::tests::uses_litellm_defaults, reads_both_env_vars and rejects_a_non_number.


  This task parses no outside bytes of its own; the payload JSON is B10003's encode_payload.


  Oracle. Helper cases on the b10011 operation; no route reaches this code yet, and the SSO callback tasks add the HTTP cases. The Python adapter imports the Prisma double from B10010's tools/oracle/helpers/b10010/prisma_double.py, sets LITELLM_SALT_KEY to a fixed value, patches litellm.proxy.proxy_server.prisma_client and global_mcp_server_manager as LiteLLM's test_sso_assertion_store.py does, and runs the pinned SSOAssertionCache, persist_sso_identity_assertion, ema_assertion_retention_enabled and retain_sso_identity_assertion_for_ema. The Rust side runs the same steps over MemoryAssertionRows. A case is a list of steps (cache_set with the current epoch, cache_get, invalidate, persist, retention, retain) and the answer is each step's result, the decrypted fields of the stored row, the warning lines and the read and write counts, never ciphertext, because the nonce differs per run. Cache expiry stays in native tests, since LiteLLM's cache takes no clock here.
