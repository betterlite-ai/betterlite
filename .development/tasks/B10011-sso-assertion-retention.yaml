    - crates/betterlite-mcp/src/sso_assertions/cache.rs
    - crates/betterlite-mcp/src/sso_assertions/cache/**
    - crates/betterlite-mcp/src/sso_assertions/store.rs
    - crates/betterlite-mcp/src/sso_assertions/store/**
    - crates/betterlite-mcp/Cargo.toml
    - crates/betterlite-config/src/sections/mcp_sso_assertion_cache.rs
    - crates/betterlite-config/src/sections/mcp_sso_assertion_cache/**
    - Cargo.lock
    - tools/oracle/cases/helpers/sso-assertion-retention/**
    - tools/oracle/fuzz/corpus/helper_case/sso-assertion-retention-*
    - tools/oracle/helpers/b10011.py
