dod:
  - text: get returns a live entry and reads an expired one as a miss, and rewriting a live key keeps its first expiry.
    proof: [cache-tests]
  - text: set_if_unchanged writes nothing after an invalidate for this user or any other user, and writes when the epoch is unchanged.
    proof: [cache-tests, oracle, helper-python]
  - text: A full cache drops expired entries first and then the earliest expiry, and max_size 0 stores nothing.
    proof: [cache-tests]
  - text: persist upserts the encrypted payload and then invalidates the cache, leaves the cache alone when the upsert fails, and does nothing with no database.
    proof: [store-tests, oracle, helper-python]
  - text: retention_enabled is true from the config flag without a query, false with no database, and otherwise follows the row lookup.
    proof: [store-tests, oracle, helper-python]
  - text: retain does nothing for None or a false gate, and logs the fixed warning and returns normally when the gate or the write fails.
    proof: [store-tests, oracle, helper-python]
  - text: The token and refresh token text appear in no Debug output, log line or error text of persist, retain or the cache.
    proof: [store-tests]
  - text: The section gives 60 and 200 with no env vars, reads both env vars, and fails the load naming the variable for a value that isn't a number.
    proof: [settings-tests]
  - text: The b10011 adapter passes the strict Python checks and a new helper seed names the operation.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: cache-tests
      why: The epoch, expiry or eviction tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^sso_assertions::cache::tests::/)'
    - id: store-tests
      why: The persist, retention or retain tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^sso_assertions::store::tests::/)'
    - id: settings-tests
      why: The env var tests for the cache section are missing or fail.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_sso_assertion_cache::tests::/)'
    - id: helper-python
      why: The b10011 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10011.py tools/oracle/helpers/b10011)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10011 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/sso-assertion-retention-*")" &&
        grep -lE 'b10011"?:' tools/oracle/fuzz/corpus/helper_case/sso-assertion-retention-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-mcp --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/sso-assertion-retention/persist-invalidates-cache.yaml
  - tools/oracle/cases/helpers/sso-assertion-retention/retention-gate.yaml
  - tools/oracle/cases/helpers/sso-assertion-retention/retain-swallows-failure.yaml
deviations:
  - what: The cache is one instance B8620 builds and shares, not the module global _ASSERTION_CACHE, so the epoch lives on that instance.
    why: betterlite keeps no module state. A reader sees the same behavior as long as every store shares the one Arc.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_store.py#L119
  - what: A negative MCP_SSO_ASSERTION_CACHE_TTL_SECONDS or MCP_OAUTH2_TOKEN_CACHE_MAX_SIZE fails the config load naming the variable. LiteLLM's int() takes it, a negative TTL then expires entries at once, and a negative size makes eviction pop an empty heap.
    why: Neither value has a meaning below zero, so the mistake surfaces at startup instead of in a login.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L180-L182
out_of_scope:
  - "SSOAssertionCache.flush: no caller at the pin; only LiteLLM's tests call it."
  - "AssertionRows, PostgresAssertionRows, MemoryAssertionRows, the Prisma double and rotate_sso_identity_assertions_master_key: B10010."
  - "_read_assertion_from_db, fetch_sso_identity_assertion, AssertionStoreUnavailable, the SSOAssertionStore protocol and DbSSOAssertionStore's fetch and fetch_uncached: B4663."
  - "SSOIdentityAssertion, assertion_from_sso_login, assertion_expired and the payload encode and decode: B10003."
  - "Calling retain from the logins: B1624 (dashboard) and B1614 (CLI). Building the assertion from the token response: B1623. The capture-gap warnings over retention_enabled: B1617."
  - "Building the one cache and config_declares_id_jag: B8620. Building the store and handing it to the credential resolver: B8622. Renewing a stale assertion: B4664."
pitfalls:
  - "The epoch is one counter for the whole cache, so a login by user A also stops user B's in-flight fetch from caching; that lost write is LiteLLM's behavior, so don't key the epoch by user."
  - "persist invalidates only after the upsert returns; invalidating first opens a gap for a reader to cache the old row."
  - "invalidate bumps the epoch before removing the entry, so a concurrent reader can't see a gap where the entry is gone and the old epoch still holds."
  - "The cache keeps assertions past their exp; B4667 and B4664 judge expiry, so a filter here would silently stop the refresher from seeing a stale token."
  - "retention_enabled must ask the database row and never the in-memory server registry, because that registry can be stale in both directions across pods."
  - "retain is the only swallow: persist returns its error, and B4664 relies on seeing it."
  - "MCP_SSO_ASSERTION_CACHE_TTL_SECONDS=0 expires entries at once here; LiteLLM's default_ttl or 600 turns it into ten minutes, and docs/compatibility.md says an explicit 0 is used as given."
  - "MCP_OAUTH2_TOKEN_CACHE_MAX_SIZE is shared with LiteLLM's OAuth token caches; read the env var, and don't add a new name for this cache."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
