    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/provider_metadata_factory.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/provider_metadata_factory*")"
      && grep -lq 'provider_metadata_factory' tools/oracle/fuzz/corpus/helper_case/provider_metadata_factory* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_provider_metadata_factory$/)'
