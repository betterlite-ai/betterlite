id: B2220
title: Provider model metadata factory
description: >-
  Select a closed metadata adapter independently of executable provider registration. This is the shared ProviderConfigManager
  model-info selector, not the chat-config selector or B157 Python export layer. Parameterized class defaults are
  stored as injected immutable settings; metadata selection never opens a connection.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/utils.py: ProviderConfigManager.get_provider_model_info
  L9294-L9342; get_provider_info L5888-L5903. litellm/llms/base_llm/base_utils.py: BaseLLMModelInfo.get_provider_info
  L44-L51; BaseLLMModelInfo.get_model_cost_key L53-L59. litellm/llms/xai/common_utils.py: XAIModelInfo.get_provider_info
  L24-L33. litellm/llms/fireworks_ai/chat/transformation.py: FireworksAIConfig.__init__ L163-L195. litellm/llms/lemonade/chat/transformation.py:
  LemonadeChatConfig.__init__ L42-L61. litellm/llms/azure_ai/common_utils.py: AzureFoundryModelInfo.__init__ L165-L166.


  Named case contracts: metadata_adapter_selection: Select fireworks_ai=FireworksAIConfig, openai=OpenAIGPTConfig,
  gemini=GeminiModelInfo, vertex_ai=VertexAIModelInfo, litellm_proxy=LiteLLMProxyChatConfig, topaz=TopazModelInfo,
  anthropic=AnthropicModelInfo, xai=XAIModelInfo, ollama/ollama_chat=OllamaModelInfo, vllm/hosted_vllm=VLLMModelInfo,
  lemonade=LemonadeChatConfig, clarifai=ClarifaiConfig, edenai=EdenAIChatConfig, bedrock=BedrockModelInfo, azure_ai=AzureFoundryModelInfo(model).
  Every other enum returns None. Do not use substring/provider-prefix matching in this selector. provider_info_projection:
  Base get_provider_info and get_model_cost_key return None. XAI returns exactly supports_web_search=True. Fireworks
  provider info and cost-key mapping delegate B2222. Other selected adapters retain inherited None for these methods.
  get_provider_info selects only a nonempty exact known provider string, otherwise returns None; exceptions from
  a selected adapter propagate. metadata_constructors: The Foundry constructor stores model, including None. Fireworks
  first invokes B668 OpenAIGPTConfig constructor with frequency_penalty, max_tokens, n, stop, temperature, top_p
  and response_format, then stores every non-None own argument. Own arguments tools, tool_choice, max_tokens, temperature,
  top_p, top_k, frequency_penalty, presence_penalty, n, stop, response_format, user, logprobs, reasoning_effort,
  prompt_truncate_len and context_length_exceeded_behavior all default None. Lemonade stores non-None repeat_penalty,
  functions, logit_bias, max_completion_tokens, max_tokens, n, presence_penalty, stop, temperature, top_p, top_k,
  response_format and tools, all default None. Empty/False/zero values are retained; None does not erase a previous
  setting. Zero-argument metadata construction therefore leaves configured defaults unchanged. dynamic_metadata_separation:
  The selector exposes the Ollama/Lemonade dynamic get_model_info operations owned by B2223/B2224, but selection
  alone does not call them. B2219 invokes a selected dynamic method before static lookup. A selected VLLM adapter
  supplies model listing, not a get_model_info method; do not invent an HTTP query for it.


  Implement crates/betterlite-models/src/provider_metadata_factory.rs with adjacent tests under provider_metadata_factory/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function provider_metadata_factory_cases in betterlite-models with these exact named cases (one per
  oracle file): metadata_adapter_selection, provider_info_projection, metadata_constructors, dynamic_metadata_separation.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/provider_metadata_factory* using HelperCase:
  kind: helper and the externally tagged provider_metadata_factory variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_provider_metadata_factory that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 133 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 150 production lines, 260 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 555 planned, 575 maximum changed lines.
