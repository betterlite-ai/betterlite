deviations: []
out_of_scope:
  - "The handlers: B3426, B3427 and B3428. The pre-call step: B8801 and B8802. The eval run cases: B8776."
pitfalls:
  - "GET /v1/evals/{eval_id}, POST /v1/evals/{eval_id} and DELETE /v1/evals/{eval_id} come from two routers on one path, so a router built with `route` twice for that path panics at startup; merge whole routers."
  - "Each router needs the same production pre-call Arc; a router left with PreCallStep::standalone skips the guardrail and alias hooks without any error."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
