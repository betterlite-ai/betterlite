  - tools/oracle/cases/evals/mutation/update-eval-basic.yaml
  - tools/oracle/cases/evals/mutation/update-eval-model-body.yaml
  - tools/oracle/cases/evals/mutation/update-eval-model-query.yaml
  - tools/oracle/cases/evals/mutation/update-eval-model-header.yaml
  - tools/oracle/cases/evals/mutation/update-eval-provider-body.yaml
  - tools/oracle/cases/evals/mutation/update-eval-provider-null.yaml
  - tools/oracle/cases/evals/mutation/delete-eval-basic.yaml
  - tools/oracle/cases/evals/mutation/delete-eval-model-body.yaml
  - tools/oracle/cases/evals/mutation/delete-eval-path-override.yaml
  - tools/oracle/cases/evals/mutation/delete-eval-provider-null.yaml
  - tools/oracle/cases/evals/mutation/cancel-eval-basic.yaml
  - tools/oracle/cases/evals/mutation/cancel-eval-model-header.yaml
  - tools/oracle/cases/evals/mutation/cancel-eval-provider-default.yaml
