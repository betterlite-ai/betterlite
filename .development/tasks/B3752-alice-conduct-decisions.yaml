id: B3752
title: Alice evaluation and Conduct decision helpers
description: >-
  Implement Alice's credential-stripping bounded serialization, evaluation and enforcement for ALLOW, BLOCK, MASK and DETECT verdicts,
  including outage handling with fail_open and fail_closed policies. Also provide Conduct's request payload construction,
  decision status resolution and verdict recording helpers that the optional external guardrail package integrates with.


  Alice forwards the hook's arguments without renaming or selecting any fields, since which parts are worth evaluating
  are decided by Alice, not here. Configuration carries api_key (required, reads ALICE_API_KEY), api_base (optional,
  default https://api.alice.io, reads ALICE_API_BASE) and unreachable_fallback (fail_closed or fail_open, default fail_closed).
  HTTP headers include Content-Type (application/json) and af-api-key (bearer token). The evaluation endpoint is
  /v2/evaluate/litellm under api_base. ALLOW passes the request through; BLOCK raises 400 invalid_request_error with
  the detected message; MASK applies positional text replacements to the texts field in strict order (a single malformed
  replacement blocks the whole verdict); DETECT logs the correlation ID and categories and allows the request.
  When all five input fields (texts, images, tools, tool_calls, structured_messages) are empty or absent, apply_guardrail returns inputs unchanged without calling Alice.
  Outage handling replaces any connection failure, timeout, 5xx response, decode error or malformed verdict with the
  configured unreachable_fallback behavior: fail_closed raises 400 invalid_request_error, fail_open returns the original
  inputs and logs the error at critical level. Verdict application uses a mechanical JSON serialization that drops only
  what cannot be JSON-encoded: at depth 12 or more, or when a traversal cycles, return null; dict keys must be strings
  and cannot be in {secret_fields, api_key, raw_headers, headers, provider_specific_header}; lists and objects are
  size-capped at 5000 items; anything else (bytes, datetime, OpenTelemetry span) returns null.


  Conduct's role is to adapt the optional external ``conduct-litellm-guard>=0.2.5`` package to LiteLLM's guardrail contract.
  request_payload builds the payload by copying request_data with prompt set to None and taking either structured_messages
  from inputs or constructing user messages from texts; it returns None if input_type is not "request" so Conduct checks
  only on pre_call. decision_status returns "guardrail_flagged" if the verdict is warning or advisory, else "success".
  record_decision calls add_standard_logging_guardrail_information_to_request_data (from B3664) with the verdict and status.
  apply_conduct_guardrail calls the check, raises the blocked exception on block/approval verdicts, records the decision
  and returns inputs unchanged. binds_unreachable_fallback detects whether the optional package's ConductGuard class
  accepts an unreachable_fallback parameter by inspecting its __init__ signature. The Python module-level names (initialize_guardrail,
  guardrail_initializer_registry, guardrail_class_registry) are owned by B107; Conduct's own initializer, @log_guardrail_information wrapper, and
  call-site orchestration stay with B107.
