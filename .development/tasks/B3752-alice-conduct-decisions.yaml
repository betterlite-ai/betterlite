deviations:
  - what: When Alice is unreachable with fail_closed policy, betterlite raises GuardrailRaisedException with status_code 400 (invalid_request_error), not 503 (service_unavailable).
    why: GuardrailRaisedException defaults to status_code=400 when not passed explicitly. The _on_unreachable method in alice.py:304-316 does not pass status_code, so the default applies. This matches BLOCK and MASK verdicts which also take the default 400.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L1090-L1110
  - what: Alice error messages use betterlite's own wording in outage scenarios, not LiteLLM's exact text.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status codes unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/alice/alice.py#L304-L317
  - what: MASK verdict that cannot be applied in full is refused outright rather than partially applied.
    why: LiteLLM's behavior; a single out-of-range or malformed replacement blocks the whole verdict so content Alice meant to replace never reaches the model unmasked.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/alice/alice.py#L267-L292
out_of_scope:
  - Lifecycle hook entry points (apply_guardrail decorator wrapper logic); B107 orchestrates when Alice guardrails are invoked and integrates the initialized callbacks into the logging pipeline.
  - The threshold-based decision whether to run Alice on a particular request; B219 and other tasks handle that.
  - Conduct's initializer, @log_guardrail_information wrapper, adapter class and call-site orchestration logic; B107 integrates the helpers.
  - The optional external conduct-litellm-guard package implementation and its ConductGuard class; betterlite only adapts it.
  - Other guardrail providers (Akto, Cisco, etc.); each gets its own task.
pitfalls:
  - apply_guardrail checks empty inputs with `not any(inputs.get(field) for field in _SELECTABLE_INPUT_FIELDS)` where the five fields are ("texts", "images", "tools", "tool_calls", "structured_messages"). This treats falsy values (empty lists, empty strings, None, 0) as empty, so a request with neither texts nor images nor any other input field skips Alice entirely.
  - Text replacement indices must be validated strictly; a single out-of-range index blocks the entire MASK verdict.
  - JSON serialization must visit every value in request_data recursively and strip credential keys at any nesting depth, not just the root.
  - Depth and cycle limits prevent serialization of malformed or circular objects; both return null, not raise.
  - Size cap of 5000 items per container is applied during islice, not after building the whole structure.
  - Outage handling must catch both network failures (timeout, HTTPStatusError) and payload errors (decode, malformed verdict).
  - 5xx errors (500-599) are treated as Alice outages and follow unreachable_fallback; 4xx errors propagate without fallback.
  - fail_open must log the error at critical level, not silent; fail_closed must raise 400, not drop the request.
  - ALICE_API_KEY must never be logged or shown in Debug output; mark as SecretString.
  - Conduct's request_payload must return None when input_type is "response", not attempt to check response inputs.
  - binds_unreachable_fallback inspects the guardrail class's __init__ signature, not the instance; it is called at module import time.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
