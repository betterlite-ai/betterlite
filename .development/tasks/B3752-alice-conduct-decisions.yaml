dod:
  - text: When all five input fields (texts, images, tools, tool_calls, structured_messages) are empty or absent, apply_guardrail returns inputs unchanged without calling Alice.
    proof: [oracle]
  - text: When at least one input field is populated, apply_guardrail sends credential-stripped bounded JSON to /v2/evaluate/litellm, with depth, cycle and size limits matching LiteLLM.
    proof: [oracle]
  - text: ALLOW verdict returns inputs unchanged; BLOCK raises 400 invalid_request_error with the message.
    proof: [oracle]
  - text: MASK verdict applies positional text replacements to the texts field in strict order, raising 400 if any replacement is malformed or out of range.
    proof: [alice-tests]
  - text: DETECT verdict logs the correlation ID and categories at warning level and returns inputs unchanged.
    proof: [alice-tests]
  - text: Unrecognized verdict (not in {ALLOW, BLOCK, MASK, DETECT}) falls through to outage handling.
    proof: [alice-tests]
  - text: Connection failure, timeout, 5xx response, decode error or malformed verdict body follows unreachable_fallback policy.
    proof: [alice-tests]
  - text: fail_open policy logs the error at critical level and returns inputs unchanged; fail_closed raises 400 invalid_request_error.
    proof: [alice-tests]
  - text: Credential keys {secret_fields, api_key, raw_headers, headers, provider_specific_header} are stripped from request_data at any nesting depth.
    proof: [alice-tests]
  - text: JSON serialization respects 12-level depth limit, 5000-item size cap per container, and drops cycles and non-JSON-native objects.
    proof: [alice-tests]
  - text: Objects exposing model_dump(mode="json") are recursively serialized through that method; objects whose model_dump raises are dropped as null.
    proof: [alice-tests]
  - text: Configuration loads api_key (required, ALICE_API_KEY env), api_base (optional, ALICE_API_BASE env, default https://api.alice.io),
      and unreachable_fallback (optional, default fail_closed).
    proof: [alice-tests, config-load]
  - text: Missing or empty api_key in both config and ALICE_API_KEY environment variable raises AliceGuardrailMissingSecrets on initialization.
    proof: [oracle]
  - text: Conduct request_payload builds from request_data with prompt null, using structured_messages or constructing user messages from texts.
    proof: [conduct-tests]
  - text: Conduct request_payload returns None when input_type is not "request", skipping the Conduct check on response inputs.
    proof: [conduct-tests]
  - text: Conduct decision_status returns "guardrail_flagged" for warning/advisory verdicts, else "success".
    proof: [conduct-tests]
  - text: Conduct record_decision calls add_standard_logging_guardrail_information_to_request_data with verdict and status.
    proof: [conduct-tests]
  - text: Conduct apply_conduct_guardrail raises the blocked exception on block/approval verdicts, records the decision, and returns inputs unchanged.
    proof: [conduct-tests]
  - text: binds_unreachable_fallback detects unreachable_fallback parameter by inspecting __init__ signature of the guardrail class.
    proof: [conduct-tests]
checks:
  optional: [mutants]
  commands:
    - id: alice-tests
      why: the alice guardrail evaluation and enforcement tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails -p betterlite-server --no-tests=fail -E 'test(/alice_guardrail/)'
    - id: conduct-tests
      why: the conduct guardrail decision and payload helpers fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails -p betterlite-server --no-tests=fail -E 'test(/conduct_guardrail/)'
    - id: config-load
      why: the Alice configuration does not load from files or environment
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/alice.*config/)'
