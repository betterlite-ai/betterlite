dod:
  - text: Native chat requests, reasoning, tools, usage and stream replies match LiteLLM through the booted proxy, including Petals form forwarding and Triton's endpoint-dependent request shape.
    proof: [native-cases, oracle]
  - text: Ollama and Triton embeddings preserve their native payloads and usage, and token-id input is rejected before an Ollama inference request.
    proof: [embedding-cases, oracle]
  - text: Model listings and metadata reach the selected live adapter with the correct credentials, prefixes, limits and fallback results through both public aliases.
    proof: [metadata-cases, oracle]
  - text: Missing keys fail before any inference or listing upstream call and retain the pinned status, type, param and code.
    proof: [auth-case, oracle]
checks:
  optional: []
  commands:
    - id: native-cases
      why: Native protocol checks must be added on this branch rather than passing only existing helper cases.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-native/chat)"
    - id: embedding-cases
      why: The two embedding protocols and provider-specific input rejection need real proxy requests.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-native/embedding)"
    - id: metadata-cases
      why: Pure metadata helpers do not prove that public listing and info routes select those adapters.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-native/metadata)"
    - id: auth-case
      why: No unauthenticated request may be mistaken for a provider protocol test.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/self-hosted-native/auth-required.yaml)"
oracle_cases:
  - tools/oracle/cases/self-hosted-native/chat/ollama-chat.yaml
  - tools/oracle/cases/self-hosted-native/chat/ollama-chat-stream.yaml
  - tools/oracle/cases/self-hosted-native/chat/ollama-generate.yaml
  - tools/oracle/cases/self-hosted-native/chat/ollama-generate-stream.yaml
  - tools/oracle/cases/self-hosted-native/chat/triton-generate.yaml
  - tools/oracle/cases/self-hosted-native/chat/triton-infer.yaml
  - tools/oracle/cases/self-hosted-native/chat/triton-stream.yaml
  - tools/oracle/cases/self-hosted-native/chat/petals-http.yaml
  - tools/oracle/cases/self-hosted-native/embedding/embeddings.yaml
  - tools/oracle/cases/self-hosted-native/embedding/ollama-token-input.yaml
  - tools/oracle/cases/self-hosted-native/metadata/ollama-listing.yaml
  - tools/oracle/cases/self-hosted-native/metadata/lemonade-listing.yaml
  - tools/oracle/cases/self-hosted-native/metadata/ollama-metadata.yaml
  - tools/oracle/cases/self-hosted-native/metadata/lemonade-metadata.yaml
  - tools/oracle/cases/self-hosted-native/metadata/metadata-fallback.yaml
  - tools/oracle/cases/self-hosted-native/auth-required.yaml
deviations: []
out_of_scope:
  - "All functions in ollama/chat/transformation.py belong to B8155. All functions in ollama/completion/transformation.py and the async embedding helpers/handler in completion/handler.py belong to B8156; the synchronous handler is not used by the proxy. TokenEncoder.encode is a tokenizer protocol, supplied by B195/B196, not a second tokenizer."
  - "ollama/common_utils.py is split by function: OllamaError belongs to B8155; _reencode_as_jpeg and _convert_image to B8156; get_api_key, get_api_base, get_server_api_base, _strip_ollama_model_prefix, _is_static_ollama_model, _supports_function_calling, _get_max_tokens, get_runtime_model_info and get_model_info to B2223; get_models, validate_environment and get_base_model to B8157. Their coverage-glob corrections are planner report notes, not worker edits."
  - "Every function in triton/common_utils.py, completion/transformation.py and embedding/transformation.py belongs to B8154; completion/handler.py contains only a docstring. types/llms/ollama.py and the empty triton.py remain B7929, not new native types."
  - "PetalsError, PetalsConfig and the remote completion handler belong to B8153. The transformation class's transform_request/transform_response raise NotImplementedError and are not the live dispatch path. petals/completion/handler.py::embedding has no caller at the pin. The local torch branch and in-process vLLM behavior retain B8153's existing deviation pending the architect's decision; no new local-engine contract is chosen here."
  - "B8157 owns main.py self-hosted dispatch and Lemonade get_models; B2220 owns its constructor and B2224 its metadata. B2328/B759 own enumeration and wildcard expansion. B007/B851 own model routes, B004/B005/B006 inference routes and B8610 server composition. B8609/B8690 already own /vllm passthrough composition and HTTP cases."
  - "The executable SelfHosted provider/operation stub must be installed by B010 before B8157 runs; the planner report specifies this shared-registry correction. This task consumes that dispatch and never alters registry variants."
pitfalls:
  - "Ollama /api/embed does not inherit the chat handler's Authorization header; compare the actual embedding request rather than imposing chat authentication on it."
  - "A catalog-known Ollama model bypasses /api/show, so a static model name cannot prove runtime metadata wiring."
  - "Lemonade metadata uses the environment base on this info route; the enrichment helper does not pass the deployment's api_base into get_model_info."
  - "Triton infer defaults max_tokens to 20, whereas generate uses DEFAULT_MAX_TOKENS_FOR_TRITON; keep the cases separate."
  - "Existing HTTP raw-body fixtures can carry NDJSON; adding a new upstream event format would unnecessarily change the shared oracle parser."
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
