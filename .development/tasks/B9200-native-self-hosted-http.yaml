id: B9200
title: Native self-hosted inference and metadata HTTP parity
description: >-
  B8157 connects the self-hosted provider implementations to inference, but its oracle
  cases and those of B8153 to B8156 only exercise helpers. Add the missing booted-proxy
  HTTP cases for Ollama, Triton and the remote Petals handler, then exercise Ollama and
  Lemonade metadata through the existing model routes. This is a fixture task: the
  provider transforms, config loaders, dispatch and routes remain with their owners.
  A mismatch identifies a fix for that owner's module; do not copy an implementation
  into an oracle adapter or widen this task into another dispatcher.

  Use kind: http, general_settings.master_key=sk-test, Authorization: Bearer sk-test,
  router_settings.num_retries=0, and configured model_list entries whose litellm_params
  contain the provider-prefixed model and api_base pointing to {{upstream}}. Background
  health checks stay disabled. Give each deployment a fixed model_info.id and each call
  a fixed x-litellm-call-id. Keep all outbound origins in configuration. Use the B900
  raw upstream answer body: {body_kind: bytes, fixture: <path>, content_type: <type>} for
  newline-delimited Ollama replies; events would prepend SSE data: and test a different
  input protocol. Commit the small NDJSON files under
  tools/oracle/fixtures/multipart-oracle/self-hosted-native and use fixture names
  relative to multipart-oracle, such as self-hosted-native/chat.ndjson.
  Existing case, JSON, multipart, stream and provider decoders are reused; no new
  decoder, fuzz target, helper operation or config section is needed.

  Chat cases. ollama-chat uses ollama_chat/llama3.1 and sends max_tokens, frequency_penalty,
  response_format=json_object and an assistant function call with JSON-string arguments.
  The /api/chat capture has options.num_predict, options.repeat_penalty, top-level format,
  and object arguments. Reply with message.thinking, content, a complete tool call,
  done_reason and explicit prompt_eval_count/eval_count; compare the model prefix,
  reasoning_content, tool_calls finish reason and usage. ollama-chat-stream returns
  NDJSON with separate thinking, content and done records, explicit usage on the last
  record and stream_options.include_usage=true on the client call. Compare the actual
  OpenAI SSE frames, final reason and usage, ignoring only generated ids/timestamps.
  ollama-generate sends ollama/llama3.1 with max_tokens and reasoning_effort=high, verifies
  /api/generate, a prompt instead of messages, options.num_predict and top-level think,
  and returns a thinking field plus response and token counts. ollama-generate-stream
  returns separate <think>, reasoning, </think>, answer and done NDJSON records and
  verifies reasoning deltas and final usage through the generate iterator.

  triton-generate configures api_base={{upstream}}/v2/models/test/generate, sends
  max_tokens=7 and checks text_input, parameters and stream=false against a text_output
  reply. triton-infer changes the base suffix to /infer and sends two messages: only
  the first content becomes inputs[name=text_input], with shape [1], datatype BYTES;
  the default max_tokens input is INT32 with data [20]. triton-stream starts with the
  /generate base and stream=true, checks the /generate_stream upstream path, and serves
  text_output/is_finished/stop_reason records. petals-http uses petals/test-model with
  an explicit remote base, max_tokens=7 and stream=true: the outbound request is form
  data with inputs and max_new_tokens, not an OpenAI JSON body, and the single outputs
  reply is converted into the proxy's synthetic stream. No torch or local vLLM engine
  is installed or started.

  embeddings uses two steps, both POST /v1/embeddings. The ollama/test-embed deployment
  reaches /api/embed with input as a string list, dimensions/truncate/keep_alive at the
  top level and an ordinary provider option under options. Return embeddings and
  prompt_eval_count=9; verify object=list, model=ollama/test-embed and total_tokens=9.
  The triton/test-embed deployment has a complete configured /infer URL, receives the
  input_text BYTES tensor, and returns one output of shape [2,2] with four values;
  compare both indexed vectors and request-derived usage. ollama-token-input sends a
  token-id array, a declared embedding input type which this provider rejects; compare
  the 400 error's type, param and code and require no inference upstream request.

  Model cases use GET /models and /v1/models for listings, and GET /model/info and
  /v1/model/info for metadata, using steps for the aliases. ollama-listing configures
  model_name=ollama/*, backend ollama/*, an explicit server base and
  litellm_settings.check_provider_endpoint=true (default false, loaded by B2328).
  Return tags with duplicate names and one already prefixed name; compare the sorted
  deduplicated public ids, /api/tags and absence of Authorization when only an ambient
  OLLAMA_API_KEY was supplied with the explicit base. A second deployment with an
  explicit key must send that key. lemonade-listing instead expands lemonade/* from
  {data: [{id: test-model}]} at the configured /models URL; the sentinel key lemonade
  sends no Authorization for this metadata request. Both cases keep credential values
  out of the client response.

  ollama-metadata sets OLLAMA_API_BASE={{upstream}} and uses a noncatalog model so the
  metadata resolver queries /api/show with {name: test-runtime}; the response has
  model_info.llama.context_length=8192 and a template containing tools. Assert the
  three token limits and supports_function_calling in model_info. lemonade-metadata
  sets LEMONADE_API_BASE={{upstream}}/api/v1 and uses lemonade/team/test-runtime;
  GET /models/team%2Ftest-runtime returns recipe_options.ctx_size=8192,
  max_input_tokens=4096 and max_output_tokens=512. Check context precedence and
  max_tokens=512 rather than 8192. Supply metadata replies for any startup lookup as
  well as the route lookup; do not mask their upstream paths or silently substitute a
  static catalog record. metadata-fallback supplies non-2xx metadata replies and
  compares the successful listing with absent limits; preserve B849's public price
  projection, including null prices when its unpriced stamp overrides provider zeros.

  Chat routes already registered by B004/B005 are POST /v1/chat/completions,
  /chat/completions, /engines/{model:path}/chat/completions and
  /openai/deployments/{model:path}/chat/completions. Embedding routes owned by B006 are
  POST /v1/embeddings, /embeddings, /engines/{model:path}/embeddings and
  /openai/deployments/{model:path}/embeddings. Distribute the inference cases across
  those aliases using configured public deployment names; never add a route.
  auth-required makes unauthenticated chat, embedding and model-list requests and
  verifies 401 with no provider call. Compare status, error type/param/code, response
  content-type and x-litellm-call-id, upstream method/path/body and Authorization when
  the protocol sends it. Ignore /error/message only because betterlite writes its own
  error prose. Neither usage nor model prefixes nor upstream credentials may be ignored.
  B040 covers the compatible providers and media independently. This task owns zero
  new LiteLLM implementation lines; allow roughly 600 fixture lines including streams.
scope:
  paths:
    - tools/oracle/cases/self-hosted-native/**
    - tools/oracle/fixtures/multipart-oracle/self-hosted-native/**
  lint_tables: false
