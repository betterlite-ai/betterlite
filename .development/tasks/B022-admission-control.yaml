id: B022
title: Per-worker admission and in-flight tracking
description: Add the admission middleware and in-flight observations to the axum server. Parse the pinned
  general_settings keys in betterlite-config, use bounded queue slots and an owned response-body guard
  so streams retain admission until completion/disconnect, and preserve health/metrics exemptions under
  the configured root path. Keep route-registration priority as an axum routing audit; do not mistake
  hot_routes_first for request priority scheduling. Reject invalid enabled admission settings at startup
  instead of silently disabling protection. Use B300 barrier scenarios for overload, timeout and streaming
  release. Use the existing Rust crate boundaries from B004 and B008; integrate through the server when
  the provider dispatcher or callbacks live in another core crate. This task's source slices are the linked
  ranges, not a port of their Python classes. Add the listed oracle cases and the matching adapters to
  B301's component runner where state is not observable over HTTP; adapters call production logic and
  never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons, and
  separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target and
  committed corpus for every newly accepted config form; unsupported keys still fail by full path. Keep
  the implementation, adapters and tests within 800 changed lines; fixtures and oracle cases are budget-excluded
  by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/admission-control/**
  - tools/oracle/src/router_probes/admission_control/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/admission_control.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/admission_control_middleware.py#L18-L219
  why: Exempt paths, slots, queue and cancellation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/admission_control_middleware.py#L276-L309
  why: Settings validation and overload response.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/in_flight_requests_middleware.py#L18-L84
  why: Per-process observations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_priority.py#L8-L24
  why: Registration optimization, not a scheduling policy.
dod:
- text: Every listed case compares production behavior against pinned LiteLLM; any declared difference
    asserts exact reference and Rust outcomes through B361 instead of ignoring the difference.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the admission_control prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(admission_control)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/admission-control/disabled-admission.yaml
- tools/oracle/cases/routing/admission-control/immediate-admission.yaml
- tools/oracle/cases/routing/admission-control/bounded-queue.yaml
- tools/oracle/cases/routing/admission-control/queue-full-503.yaml
- tools/oracle/cases/routing/admission-control/queue-timeout-503.yaml
- tools/oracle/cases/routing/admission-control/health-and-metrics-exempt.yaml
- tools/oracle/cases/routing/admission-control/root-path-boundary.yaml
- tools/oracle/cases/routing/admission-control/stream-body-holds-slot.yaml
- tools/oracle/cases/routing/admission-control/disconnect-releases.yaml
deviations:
- what: Invalid enabled admission settings fail startup instead of disabling admission control.
  why: The no-silent-drops rule requires an explicit error for unusable configuration.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/admission_control_middleware.py#L286-L309
out_of_scope:
- Implementing a Prometheus exporter (B111) or new health endpoints (B130).
- Reordering middleware to bypass authentication.
pitfalls:
- Admission overload returns 503 with retry-after, whereas a deployment capacity rejection is 429.
- An axum handler returning a streaming response does not mean the stream has completed.
- B122 owns root-path and request-size middleware; preserve its ordering and normalization.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
