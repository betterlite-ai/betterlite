dod:
- text: Write tests named admission_control_behaviors and admission_control_boundaries under admission_control::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - admission-control-behaviors
  - admission-control-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/admission-control-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/admission-control-invalid.yaml;
    the valid seed contains max_in_flight_requests_per_worker. The cargo-fuzz target config_yaml and normal
    replays_the_config_yaml_corpus test call the production bounded parser. Both new files must be added
    relative to GATE_BASE.
  proof:
  - config-corpus
  - admission-control-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: admission-control-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::admission_control_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: admission-control-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::admission_control_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/admission_control.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/admission_control.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/admission-control-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/admission-control-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/admission-control-" && grep -Fq 'max_in_flight_requests_per_worker' crates/betterlite-config/fuzz/corpus/config_yaml/admission-control-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
