id: B022
title: Per-worker admission and in-flight tracking
description: 'Add the admission middleware and in-flight observations to the axum server. Parse the pinned
  general_settings keys in betterlite-config, use bounded queue slots and an owned response-body guard
  so streams retain admission until completion/disconnect, and preserve health/metrics exemptions under
  the configured root path. Keep route-registration priority as an axum routing audit; do not mistake
  hot_routes_first for request priority scheduling. For invalid enabled settings, disable admission with
  a warning, matching the pinned fallback; do not fail startup. Use B300 barrier scenarios for overload,
  timeout and streaming release. Configuration boundary keys introduced or consumed here: max_in_flight_requests_per_worker,
  max_queued_requests_per_worker, admission_queue_timeout_seconds. max_in_flight_requests_per_worker is
  absent by default (disabled); max_queued_requests_per_worker defaults to the configured in-flight maximum;
  admission_queue_timeout_seconds defaults to 1.0. Invalid values warn and disable. Implement the owned
  native service in crates/betterlite-server/src/admission_control.rs. Add ProbeOperation::AdmissionControl in tools/oracle/src/router_probes/mod.rs
  and the corresponding B022 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/proxy/middleware/admission_control_middleware.py:
  _Gauge.inc (L44-L44), _Gauge.dec (L46-L46), _CounterChild.inc (L51-L51), _Counter.labels (L56-L56),
  AdmissionControlState.__init__ (L69-L77), AdmissionControlState.get_stats (L79-L84), AdmissionControlState.get_semaphore
  (L86-L94), AdmissionControlState.record_admission (L96-L100), AdmissionControlState.record_release (L102-L106),
  AdmissionControlState.record_queue (L108-L112), AdmissionControlState.record_dequeue (L114-L118), AdmissionControlState.record_rejection
  (L120-L124), AdmissionControlState._get_metrics (L126-L130), AdmissionControlMiddleware.__init__ (L134-L142),
  AdmissionControlMiddleware.__call__ (L144-L185), _get_route_path (L188-L198), _create_gauge (L201-L209),
  create_prometheus_admission_metrics (L212-L234), get_admission_control_stats (L240-L241), _hashable
  (L250-L251), _parse_admission_control_settings (L260-L281), get_admission_control_settings (L284-L292),
  _overloaded_response (L295-L309). Implement these behaviors through the typed Rust services above; synchronous
  facades and structural accessors reuse the same primitive instead of separate ports. Function coverage
  in litellm/proxy/middleware/in_flight_requests_middleware.py: InFlightRequestsMiddleware.__init__ (L33-L34),
  InFlightRequestsMiddleware.__call__ (L36-L50), InFlightRequestsMiddleware.get_count (L53-L55), InFlightRequestsMiddleware._get_gauge
  (L58-L79), get_in_flight_requests (L82-L84). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Function coverage in litellm/proxy/route_priority.py: _is_hot (L19-L20), hot_routes_first (L23-L24).
  Implement these behaviors through the typed Rust services above; synchronous facades and structural
  accessors reuse the same primitive instead of separate ports.'
