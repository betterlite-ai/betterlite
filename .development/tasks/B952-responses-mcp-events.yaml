id: B952
title: Responses MCP event records
description: >-
  Implement the five complete pure event helpers at the top of
  litellm/responses/mcp/mcp_streaming_iterator.py. They consume already decoded ResponsesAPIResponse, MCP tool
  records, and call-result strings; they do not perform provider, database, filesystem, environment, config, or
  HTTP work. Share the resulting records between native Responses streaming and the chat bridge; route and provider
  behavior remains with the callers.


  Preserve these helper contracts exactly. _output_items(response) returns tuple(response.output), retaining order
  and object values. _function_call_id(item) reads type from a dict via item.get or from an object via item.type;
  anything other than the exact string "function_call" returns None. For that type it reads call_id first and uses
  id only when call_id is falsy, then returns the chosen value only when it is a string. _set_event_field(event,
  name, value) calls setattr, including for a new field, and returns None.


  create_mcp_list_tools_events returns three normal-path records in order. Record one is
  MCPListToolsInProgressEvent with type "response.mcp_list_tools.in_progress", sequence_number 1, output_index 0,
  and the supplied base_item_id. Record two is MCPListToolsCompletedEvent with type
  "response.mcp_list_tools.completed", sequence_number 2, output_index 0, and that same item id. Record three is
  OutputItemDoneEvent with type "response.output_item.done", output_index 0, its default sequence_number 1, and an
  item with id=base_item_id, type="mcp_list_tools", server_label, and tools. The first mapping's server_label is
  str(value), or "" when absent or None; later mappings cannot replace it. Each pre-processed tool stays in order
  and has name default "unknown", description default "", annotations exactly {read_only: false}, and input_schema
  only when the object has that attribute. user_api_key_auth is accepted but unused. The local server-name
  extraction considers only string server_url values beginning "litellm_proxy/mcp/" and has no effect on output.


  If list-tools construction raises any Exception, preserve earlier records, log the exact error diagnostic
  "Error creating MCP list tools events: %s" at error level, print the traceback, append
  MCPListToolsFailedEvent with type "response.mcp_list_tools.failed", sequence_number 2, output_index 0, and the
  supplied item id, then append OutputItemDoneEvent with type "response.output_item.done", output_index 0,
  sequence_number 1, and item {id: base_item_id, type: "mcp_list_tools", server_label: "", tools: []}. Normal
  success logs the exact debug message "Created %s MCP discovery events" with len(events)=3.


  create_mcp_call_events preserves result=None, base_item_id=None, sequence_start=1, and output_index=0 as its
  defaults. It uses a truthy supplied base_item_id, otherwise an injected ID source produces "mcp_" plus eight
  hexadecimal characters. tool_call_id is accepted but never appears in an event. It always emits, in order,
  response.mcp_call.in_progress at sequence_start, response.mcp_call_arguments.delta at sequence_start+1 with the
  exact arguments string as delta, and response.mcp_call_arguments.done at sequence_start+2 with that exact string
  as arguments; all carry the chosen item id and output_index. For result not None, it then emits
  response.mcp_call.completed at sequence_start+3 and response.output_item.done with default sequence_number 1.
  That item's fields are id=item_id, type="mcp_call", approval_request_id="mcpr_" plus eight hexadecimal
  characters, arguments, error=null, name=tool_name, output=result, and server_label="litellm". For result exactly
  None, it emits only response.mcp_call.failed at sequence_start+3 and no output_item.done. Thus result "" is a
  completion, while the default None is a failure. Inject ID generation through the construction boundary and use
  deterministic IDs in tests and the oracle; do not use ambient UUID state.


  Implement crates/betterlite-core/src/api/responses_mcp_events.rs with typed input/result records and adjacent
  tests. Use B198's injected ID/context boundary and B902's Responses event/object shapes. Do not recreate
  credential resolution and do not add ApiLimits: this slice has no outside-byte decoder or size guard. Register
  HelperCall::ResponsesMcpEvents in the B171 oracle. Each helper case runs Rust production code and the pinned MIT
  Python helper independently with deterministic IDs and compares event order, literal fields, defaults, mutations,
  and diagnostics. This is a pure helper task, so it has no HTTP route case or mock-provider call.


  Add behavior tests under api::responses_mcp_events::tests named
  output_items_and_function_call_id, set_event_field, list_tools_success, list_tools_failure, mcp_call_success,
  mcp_call_failure, and mcp_call_defaults_and_offsets. Use named rstest inputs for dict/object, missing/falsy field,
  server-label, tool-format, and sequence variations. Keep corpus replay under the separate test name
  replays_corpus; this task transforms typed values and adds no cargo-fuzz decoder target.


  The owned Python lines are 38-261: _output_items L38-L40, _function_call_id L43-L53, _set_event_field L56-L58,
  create_mcp_list_tools_events L61-L177, and create_mcp_call_events L180-L261. The iterator class beginning at
  L264 belongs wholly to B953 and B954.
