dod:
- text: 'For response.output=["first", {type: "function_call", call_id: "", id: "fallback-7"}], _output_items returns the two values in a tuple and _function_call_id returns "fallback-7"; for {type: "message", id: "ignored"}, an object with type "function_call" and call_id "object-8", and a function_call with id 9, it returns None for the message and non-string chosen id and "object-8" for the object.'
  proof:
  - case-output-items-and-function-call-id
  - oracle
- text: 'Given an event whose output_index is 1, name "output_index", and value 4, _set_event_field changes output_index to 4 and returns None; given name "custom_marker" and value "kept", it adds that field and serialization retains "kept".'
  proof:
  - case-set-event-field
  - oracle
- text: 'With user_api_key_auth null, base_item_id mcp_base01, mappings [{server_url: "litellm_proxy/mcp/weather", server_label: "weather"}, {server_url: "https://host.example/mcp/other", server_label: "ignored"}], and tools [{name: "search", description: "find", input_schema: {type: "object"}}, {}], list-tools returns exactly three ordered records with types response.mcp_list_tools.in_progress, response.mcp_list_tools.completed, and response.output_item.done, sequence numbers 1, 2, and default 1, output_index 0, server_label "weather", and tools [{name: "search", description: "find", annotations: {read_only: false}, input_schema: {type: "object"}}, {name: "unknown", description: "", annotations: {read_only: false}}]; the second URL does not alter the result and the debug count is 3.'
  proof:
  - case-list-tools-success
  - oracle
- text: 'With base_item_id mcp_bad01 and a pre-processed tool whose name property raises RuntimeError("boom"), list-tools keeps its first two records, logs Error creating MCP list tools events: boom at error level, prints the traceback, and appends failed sequence 2 plus output_item.done sequence 1 with item {id: "mcp_bad01", type: "mcp_list_tools", server_label: "", tools: []}.'
  proof:
  - case-list-tools-failure
  - oracle
- text: 'A successful call with tool_name weather, tool_call_id upstream-call-7, arguments "{\\"city\\":\\"Berlin\\"}", result "{\\"temp\\":7}", base_item_id mcp_call01, sequence_start 4, and output_index 3 produces five ordered records with sequences 4, 5, 6, and 7, exact argument/result strings, no tool_call_id field, server_label "litellm", error null, and deterministic IDs mcp_call01 and mcpr_22222222 when the injected approval-ID source returns 22222222.'
  proof:
  - case-mcp-call-success
  - oracle
- text: 'A failed call with tool_name weather, tool_call_id upstream-call-7, arguments "{}", result null, base_item_id mcp_call02, sequence_start 9, and output_index 5 produces in_progress/delta/done at sequences 9, 10, and 11, then only response.mcp_call.failed at sequence 12 with item_id mcp_call02 and output_index 5; it never emits response.output_item.done.'
  proof:
  - case-mcp-call-failure
  - oracle
- text: 'With tool_name "", tool_call_id null, arguments "", omitted result/base_item_id/sequence_start/output_index, and a fresh deterministic ID source returning 11111111 then 22222222, defaults produce failed at sequence 4 with item_id mcp_11111111 and output_index 0; with the same inputs and a fresh source, result "" produces completed plus output_item.done, whose item_id is mcp_11111111, approval_request_id is mcpr_22222222, server_label is "litellm", and output is "".'
  proof:
  - case-mcp-call-defaults-and-offsets
  - oracle
- text: 'The Rust and Python helper adapters execute independently through B171, replay the externally tagged responses_mcp_events seeds, and compare values plus ordered diagnostics.'
  proof:
  - oracle
  - helper-python
  - helper-corpus
  - new-oracle-cases
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The production event service or a named behavior test is absent; corpus replay alone is insufficient.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::/) - test(/::replays_corpus$/)'
  - id: case-output-items-and-function-call-id
    why: Tuple conversion, dict/object lookup, falsy fallback, or non-function drop behavior is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::tests::output_items_and_function_call_id($|::)/)'
  - id: case-set-event-field
    why: Generic event mutation or its None return contract is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::tests::set_event_field($|::)/)'
  - id: case-list-tools-success
    why: The normal three-event list-tools sequence or a literal formatted field is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::tests::list_tools_success($|::)/)'
  - id: case-list-tools-failure
    why: The caught list-tools exception fallback, diagnostic, or empty output item is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::tests::list_tools_failure($|::)/)'
  - id: case-mcp-call-success
    why: The five-record successful call sequence, approval id, output fields, or sequence offset is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::tests::mcp_call_success($|::)/)'
  - id: case-mcp-call-failure
    why: The None-result failed event or absence of output_item.done is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::tests::mcp_call_failure($|::)/)'
  - id: case-mcp-call-defaults-and-offsets
    why: Defaults, empty-result distinction, generated ID format, or output-index default is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_events::tests::mcp_call_defaults_and_offsets($|::)/)'
  - id: helper-python
    why: The Python adapter or deterministic-ID setup fails strict lint or typing checks.
    run: test -f tools/oracle/helpers/responses_mcp_events.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The helper parser has no new B952 seed or cannot replay responses_mcp_events.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_mcp_events-*)" && grep -qE "^[[:space:]]+responses_mcp_events:" tools/oracle/fuzz/corpus/helper_case/responses_mcp_events-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: No new B952 helper case was added for the event contracts.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-mcp-events)"
