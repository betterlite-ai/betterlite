id: B952
title: Responses mcp events
description: >-
  Produce typed mcp_list_tools and mcp_call lifecycle events with injected IDs and source output indexes. Share
  these event records across native Responses and bridged chat MCP streams; this unit performs no discovery or remote
  calls.


  Implement crates/betterlite-core/src/api/responses_mcp_events.rs. Use ResponsesMcpEventsInput and ResponsesMcpEventsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions list_tools_start_done, mcp_call_arguments, mcp_call_failed, output_index_offset
  under api::responses_mcp_events::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesMcpEvents in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_mcp_events: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/mcp/mcp_streaming_iterator.py: _output_items (L38-L40); litellm/responses/mcp/mcp_streaming_iterator.py:
  _function_call_id (L43-L53); litellm/responses/mcp/mcp_streaming_iterator.py: _set_event_field (L56-L58); litellm/responses/mcp/mcp_streaming_iterator.py:
  create_mcp_list_tools_events (L61-L177); litellm/responses/mcp/mcp_streaming_iterator.py: create_mcp_call_events
  (L180-L261). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 173 owned nonblank/non-comment/non-docstring Python lines (178 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 193 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 425 total within the 430-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B198 (Injected call context and shared
  settings), B902 (Responses shapes), B1087 (Api boundaries). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
