deviations: []
out_of_scope:
- 'litellm/responses/mcp/mcp_streaming_iterator.py: B953 owns MCPEnhancedStreamingIterator.__init__ L276-L352, _extract_mcp_headers_from_params L354-L409, _should_auto_execute_tools L411-L417, _make_stream_error_event L419-L431, __aiter__ L433-L434, _handle_initial_response_phase L517-L577, _is_response_completed L579-L584, _follow_up_pending L586-L588, _round_output_width L590-L592, _absorb_round L594-L606, _compose_round_chunk L608-L653, _process_base_iterator_chunk L655-L685, and _create_initial_response_iterator L687-L727.'
- 'litellm/responses/mcp/mcp_streaming_iterator.py: B954 owns MCPEnhancedStreamingIterator.__anext__ L436-L445, _anext_impl L447-L515, _generate_tool_execution_events L731-L880, _create_follow_up_iterator L882-L951, __iter__ L953-L954, and __next__ L956-L974.'
- 'litellm/responses/main.py: B955 owns the native/managed MCP dispatch caller; B952 supplies only its already constructed discovery records.'
- 'litellm/responses/mcp/litellm_proxy_mcp_handler.py: B950 owns tool execution and calls create_mcp_call_events; B952 does not select, authorize, execute, or send a provider request.'
- 'litellm/responses/mcp/request_context.py and litellm/responses/mcp/litellm_proxy_mcp_handler.py: B948, B949, B950, and B951 own selection, discovery, execution, persistence, and follow-up values passed into these pure constructors.'
- 'The Responses stream type and event model declarations belong to B902/B1113; B952 consumes them and does not add provider-specific transformations or route registration.'
- 'No env var, config key, query parameter, HTTP error, database write, warning-and-drop branch, or outside-byte decoder exists in the five owned callables at the pinned commit.'
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_mcp_events in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_mcp_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_mcp_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'create_mcp_list_tools_events computes server names only for string server_url values beginning litellm_proxy/mcp/ and then never reads that list, so filtering or rewriting events from server_url changes LiteLLM behavior.'
- 'create_mcp_call_events tests result is not None rather than truthiness, so result "" emits completed plus output_item.done while result None emits failed with no output item.'
- 'tool_call_id is an input to create_mcp_call_events but is never copied into an event or output item; deriving the public item id or approval_request_id from it changes the contract.'
- 'The successful list-tools path logs Created %s MCP discovery events with three events, while the caught exception path logs Error creating MCP list tools events: %s, prints a traceback, and still returns a failed event plus an empty output item.'
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
