deviations:
  - what: Until a native ClickHouse trace backend and OTLP codec are assigned, a configured ClickHouse receiver without an injected backend warns and remains unavailable even when CLICKHOUSE_URL names a working store. Otherwise authorized receiver-dependent requests return HTTP 501, with B3867's detail JSON or OTLP message body and no OpenAI type/param/code fields; auth and missing-query-secret errors retain precedence.
    why: The existing tasks leave the excluded native bridge unimplemented. Returning success with a fake store would lose trace data; the architect must assign the missing backend and remove this limitation before advertising enabled ingestion.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/tracing_runtime.py#L35-L66
out_of_scope:
  - B8910 owns the remaining logger.py factories/publication/accessor and runtime.py hooks; B3852 owns the inference/MCP callback methods and B3853 the remaining callback methods. No class is recreated by this composition.
  - langfuse_logger.py's four methods and mount.py's naming/instrumentation policy are B8250; B8680 owns the actual server-span layer. The _RenameableSpan protocol has no runtime implementation to port.
  - The otel, model, plumbing, agentops, levo, weave and tracing __init__.py files only re-export their existing owners' types (B3840-B3844, B3848, B3863 and B3867); they add no executable remainder.
  - The Arize README's prompt-client/template/manager behavior is B3864, including its explicitly uncalled list/reload/test_connection helpers. Levo setup and delivery are B3850/B3863/B8746. The OTel README describes B3840-B3869/B8250/B8910 composition rather than another implementation.
  - tracing/AGENTS.md's tenant stamping, confirmed ingest and query behavior stay B3865/B3866/B3867; native codec/storage G2 has no assigned owner and is the recorded limitation, not a new implementation hidden in this mount.
  - docker-compose.tracing.yml and tracing-config.yaml are B5075. No deployment file is changed here.
  - B8374/B8613 own the rest of proxy_server.py startup/shutdown, B8380-B8385/B8590 config operations, B8399 proxy logging, and B124's named route/config parts the remaining functions; this task owns only the two application handoffs referenced above.
  - B052/B757 own auth ordering, B1228 management payload construction, B3858 legacy service/management methods, and B8870 under B124 tenant destination resolution/delivery integration. Existing B8626/B8701/B8728 MCP mounts and B8720's missing MCP carrier integration are not rebuilt here.
pitfalls:
  - Publishing before init_callbacks creates a second generic provider and separates HTTP roots from preset LLM spans.
  - Attaching identity inside the auth phase loses it when that phase restores its context; destinations intentionally attach earlier.
  - Trace query dependencies check the master key even when no receiver exists, so query-without-master-key must not be flattened to the ordinary unavailable response.
  - A client HTTP response comparison alone cannot prove OTel export; the boot tests must inspect the actual recorder's span graph.
  - The caller must merge the existing trace router once; registering its paths a second time panics during axum construction.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
