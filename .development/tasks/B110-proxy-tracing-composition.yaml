dod:
  - text: Startup publishes the existing canonical callback's provider after catalog initialization, and real chat/stream/auth paths export one correctly parented trace with the expected Langfuse and identity timing.
    proof: [tracing-boot-tests, oracle]
  - text: >-
      LangfuseStreamAssembler assembles raw Anthropic SSE frames and chat chunks, so a streamed /v1/messages response
      stamps its assembled message as the Langfuse root output.
    proof: [tracing-boot-tests]
  - text: Auth and management adapters call their owned services without duplicate root creation, duplicate management emission or changes to the client error/success response.
    proof: [adapter-tests, tracing-boot-tests, oracle]
  - text: The seven trace routes are merged once with normal auth, receive the lifespan's optional receiver and storage, preserve unavailable responses, and do not gain aliases.
    proof: [receiver-boot-tests, oracle]
  - text: A missing native store is warned and returns 501 without accepting trace rows; an injected receiver reaches routes and closes its automatic spend logger once after serving.
    proof: [receiver-boot-tests]
checks:
  optional: []
  commands:
    - id: tracing-boot-tests
      why: HTTP requests never reach the real callback graph or export an orphaned, duplicated or incorrectly timed span.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::callbacks::telemetry::tests::tracing::/)'
    - id: adapter-tests
      why: Auth or management ports remain empty, point at a second logger or ignore their V2 skip behavior.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::callbacks::telemetry::tests::adapters::/)'
    - id: receiver-boot-tests
      why: Route composition, receiver lifetime, unavailable storage behavior or alias exclusion is missing.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::callbacks::telemetry::tests::receiver::/)'
