    - crates/betterlite-server/src/app/callbacks/telemetry.rs
    - crates/betterlite-server/src/app/callbacks/telemetry/**
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/cases/http/otel-composition/**
    - tools/oracle/cases/http/trace-runtime/**
  lint_tables: false
