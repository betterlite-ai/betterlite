id: B110
title: Connect proxy tracing services and prove their HTTP behavior
description: >-
  Finish the OTel umbrella with application composition, not another implementation of its
  callbacks or routes. B8910 owns logger construction and publication, B8911 owns receiver
  lifetime, B8680 installs the HTTP SERVER-span layer and B3867 registers the seven trace paths.
  Build betterlite-server::app::callbacks::telemetry with its own TelemetryError and adjacent
  tests. The module takes explicit TelemetryInputs: B8742's live callback catalog, the single
  B8910 logger runtime, B8911's optional started receiver, B198's request context and the
  resolved config. No additional logger registry, environment snapshot, provider or auth
  lookup is created. The architect adds the shared call sites and resource fields listed in
  the report before dispatch; this task's scope contains only the implementation they call.

  Expose start, mount and the auth/management adapters. start runs after B8742 finishes
  init_callbacks, before the first request, and publishes B8910's selected provider only when
  B3842's already resolved LITELLM_OTEL_V2 flag is true (default false). Publication failure
  logs at debug and leaves the rest of the server running. It must see the catalog's existing
  instances in construction order, including a Langfuse wrapper, rather than resolve otel
  again and manufacture a second generic logger. The server span layer and the auth provider
  accessor use this same runtime. B8911's receiver startup/close remain in the lifespan, not
  in route constructors; provide its receiver to B3867's request state and its storage to
  provide_storage. Implement B8911's factory/handle ports over B3867's receiver when a concrete
  storage factory is supplied. Route assembly never runs schema initialization.

  mount merges B3867's router exactly once inside the normal key-auth layers. It registers no
  route itself. Paths are POST and GET /v1/traces, POST /v1/traces/query, GET
  /v1/traces/query/help, GET /v1/traces/{trace_id}, GET
  /v1/traces/{trace_id}/spans/{span_id}, and GET
  /v1/traces/{trace_id}/spans/{span_id}/error; there are no /traces, /openai/v1/traces or
  provider-prefixed aliases. B8610's aggregator and B8680's wrap keep their existing order.
  The MCP mounts B8626, B8701 and B8728 are unrelated and must not be merged again.

  Auth adapters supply B052/B757's existing hooks with the registered legacy or V2 logger.
  Parent creation calls B8910's legacy create_litellm_proxy_request_started_span, or B3853's
  V2 anchor capture; the latter reuses B8680's active SERVER span. B757 owns received-at,
  idempotence, safe headers and route-attribute conditions. Route its phase and identity hooks
  through B8910's optional runtime and its pre-call failure hook through B3853. B052 retains
  the order: destinations inside auth, identity baggage after auth closes, then deferred body
  failure. B8870, under B124, supplies the TenantDestinations adapter, and B124 owns its HTTP cases;
  it calls B8910's fan_out_provider and is not rebuilt here. B3847 already implements
  _get_parent_otel_span_from_kwargs for provider/cache callers. For management, implement
  B1228's OTel transport using B3858's success/failure hooks; B1228 keeps its early skip when
  V2 is enabled, request-body reading and sanitization. No span transport performs a second
  authentication or changes a handler's status or response.

  Add kind: http oracle cases through the booted proxy for the logging parts that previously had
  only helper coverage. Use an OpenAI mock deployment named tracing-chat and the pinned
  openai/gpt-4o model. Exercise POST /v1/chat/completions with legacy otel, V2 otel, V2
  langfuse_otel without content capture, V2 Langfuse streaming with SPAN_AND_EVENT capture,
  and V2 levo with LEVOAI_API_KEY, LEVOAI_ORG_ID, LEVOAI_WORKSPACE_ID and
  LEVOAI_COLLECTOR_URL. Generic equality cases use the console exporter; vendor equality
  cases use unreachable loopback endpoints and fixed dummy credentials, proving exporter
  failure does not alter the client response without sending telemetry to a vendor. Configure
  callback_settings.otel for generic overrides and the existing preset settings for vendor
  callbacks. The client comparisons include successful bodies/chunks, provider failure,
  missing key and malformed JSON with the correct status, error type, param, code and
  content-type; ignore /error/message with the repository's wording reason. Dynamic ids and
  timestamps may be ignored individually, never entire choices, errors or headers.

  Build the production StreamOutputAssembler, B3857's port in betterlite-logging otel::content_projections, in telemetry
  as the unit struct `LangfuseStreamAssembler`. assemble_sse calls B3669's assemble_anthropic_sse_stream on the frames
  with restore_identity off and returns the ModelResponse serialized to an OtelModelValue object, or None when that gives
  None. assemble_chat calls B2227's stream_chunk_builder with the chunks and messages and returns its chat ModelResponse
  the same way, or None on its error. The shared call site that builds the B8910 runtime passes
  `Arc::new(LangfuseStreamAssembler)`. Boot test tracing::messages_stream_root_output streams POST /v1/messages through
  langfuse_otel with content capture on and asserts that the root observation output is the assembled assistant message
  as LiteLLM's stream_output renders it; a raw stream without message_start stamps no output.

  Native boot tests in telemetry/tests/ assert the exported spans, since the existing HTTP
  oracle compares client/upstream traffic and does not collect OTLP exports. Drive the real
  application against a mock provider and an injected recording exporter, not a hand-built
  callback event. Prove one root and one LLM child in the same trace, remote traceparent
  continuation, auth as a live phase, no phantom CLIENT span on auth/body rejection, retained
  identity after the phase closes, Langfuse root IO before root close, one close after stream
  completion and no duplicate legacy management span with V2 enabled. Test the transport
  adapter separately with B1228's sanitized management payload and a recording B3858 sink.
  A provider that fails export must not alter a successful chat response. Existing schema,
  payload, mapper, capture and service tests remain with their parts; these tests prove their
  composition. Do not add an oracle helper for mutable server state.

  Trace-route HTTP cases cover all seven methods/paths with tracing disabled and a master
  key, plus missing auth, enabled clickhouse with CLICKHOUSE_URL absent, query without a
  configured master key, and /traces remaining absent. Compare ordinary JSON and OTLP/JSON
  error content types separately and preserve Retry-After where returned. Ordinary HTTPException
  bodies have detail, and OTLP/JSON errors have message, without OpenAI type/param/code fields;
  ignore only /detail or /message for their error wording. The current oracle's parse_body
  assumes UTF-8 except for application/octet-stream, so cover OTLP protobuf error bytes and
  content-type in the native boot tests until a bounded protobuf comparison adapter is assigned.
  Do not discard the whole protobuf body to make an equality case pass. No receiver returns B3867's 501;
  a missing query secret retains its 503. B3867 owns successful ingest/query cases and all
  receiver/parser behavior, so do not recreate its cases here. Test state handoff with an
  injected working receiver: ingest must reach it, its storage must reach query handlers,
  and the retained spend logger must close once after the server exits.

  There is currently no concrete native ClickHouse trace store or native OTLP codec owner:
  B3865/B3866/B3867 call it G2, and the bridge is excluded by litellm.yaml. Until the architect
  assigns that prerequisite, production factory absence is an explicit warned unavailable
  receiver, including with CLICKHOUSE_URL set; trace routes return 501 rather than accepting
  and discarding spans. Record this temporary difference below. Never use an in-memory store
  as production success. The injected receiver tests must still prove the complete lifetime
  and mount. Allow about 250 adapter lines and 400 boot-test/fixture lines; the Python decision
  and lifecycle functions were split into B8910/B8911 so catalog callers do not depend on this
  server composition task. This module introduces no decoder or config key.
