checks:
  optional:
  - mutants
  commands:
  - id: case-eval-create-update
    why: The eval-create-update behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_create_update$/)'
  - id: case-eval-list-pagination
    why: The eval-list-pagination behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_list_pagination$/)'
  - id: case-eval-get-delete-cancel
    why: The eval-get-delete-cancel behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_get_delete_cancel$/)'
  - id: case-run-create-data-source
    why: The run-create-data-source behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_run_create_data_source$/)'
  - id: case-run-list-pagination
    why: The run-list-pagination behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_run_list_pagination$/)'
  - id: case-run-get-cancel-delete
    why: The run-get-cancel-delete behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_run_get_cancel_delete$/)'
  - id: case-malformed-json-error
    why: The malformed-json-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_malformed_json_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_evals.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_evals*")"
      && grep -lq 'openai_evals' tools/oracle/fuzz/corpus/helper_case/openai_evals* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_evals$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_evals)"
      && grep -q 'decode_eval_reply' crates/betterlite-openai/fuzz/fuzz_targets/openai_evals.rs && cargo nextest
      run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_evals_corpus$/)'
