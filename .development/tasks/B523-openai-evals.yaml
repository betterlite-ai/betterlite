  - mutants
  commands:
  - id: case-eval-create-update
    why: Create/update and create-run omit only top-level None values, preserving false, zero, empty containers
      and nested nulls. Update returns URL, original headers and filtered body.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_create_update$/)'
  - id: case-eval-list-pagination
    why: List uses truthy litellm_params.api_base or https://api.openai.com, not global base/env fallbacks. Forward
      only truthy limit, after, before, order and order_by without stringifying limit; ignore other query keys.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_list_pagination$/)'
  - id: case-eval-get-delete-cancel
    why: Get/delete eval return URL and original headers; cancel appends /cancel and returns an empty body. Eval
      ID encoding delegates to B206 with field_name=eval_id.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_get_delete_cancel$/)'
  - id: case-run-create-data-source
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-evals/run-create-data-source.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_run_create_data_source$/)'
  - id: case-run-list-pagination
    why: Run list has the same base and truthiness rules but omits order_by entirely; path is /v1/evals/{encoded
      eval_id}/runs.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_run_list_pagination$/)'
  - id: case-run-get-cancel-delete
    why: Run get/delete use /v1/evals/{encoded eval_id}/runs/{encoded run_id}; cancel appends /cancel. Both run
      delete and cancel include {}, while get returns URL and headers only.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_run_get_cancel_delete$/)'
  - id: case-malformed-json-error
    why: Every response first calls raw_response.json and then its operation-specific model validator; JSON/model-validation
      errors propagate without conversion into a provider-specific error.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_malformed_json_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_evals.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_evals*")"
      && grep -lq 'openai_evals' tools/oracle/fuzz/corpus/helper_case/openai_evals* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_evals$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_evals)"
      && grep -q 'decode_eval_reply' crates/betterlite-openai/fuzz/fuzz_targets/openai_evals.rs && cargo nextest
      run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_evals_corpus$/)'
  - id: case-eval-auth-required
    why: Resolve litellm_params.api_key, litellm.api_key, litellm.openai_key, OPENAI_API_KEY in order by truthiness.
      If none resolves, raise ValueError OPENAI_API_KEY is required for Evals API. Otherwise overwrite Authorization
      with Bearer <key> and Content-Type with application/json.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_auth_required$/)'
  - id: case-eval-url-literal-append
    why: 'get_complete_url defaults only None to https://api.openai.com and appends /v1/{endpoint}, or /v1/evals/{encoded
      eval_id} when eval_id is truthy. It does not strip slashes or /v1: retain duplicate slashes and /v1/v1 for
      corresponding bases.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::evals_cases::case_[0-9]+_eval_url_literal_append$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_evals_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_evals_secret_safe_failure$/)'
