out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as openai_evals in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/evals.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_evals.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The request helpers return different tuple shapes; treating every second element as a body would send auth headers
  in JSON.
- An empty eval_id chooses the collection path in get_complete_url, but create/list-run always invoke the path-segment
  encoder.
