id: B523
title: OpenAI evals and eval runs
description: >-
  Add typed EvalDefinition/EvalRun and provider operations for eval create/list/get/update/delete/cancel and run
  create/list/get/cancel/delete. Keep data-source/testing criteria in explicitly named bounded extension fields
  where the pinned SDK permits arbitrary schemas; lifecycle paths and pagination are typed.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/evals/transformation.py:
  _parsed_response_json L35-L36; OpenAIEvalsConfig.custom_llm_provider L43-L44; OpenAIEvalsConfig.validate_environment
  L46-L65; OpenAIEvalsConfig.get_complete_url L67-L80; OpenAIEvalsConfig.transform_create_eval_request L82-L94;
  OpenAIEvalsConfig.transform_create_eval_response L96-L105; OpenAIEvalsConfig.transform_list_evals_request L107-L138;
  OpenAIEvalsConfig.transform_list_evals_response L140-L149; OpenAIEvalsConfig.transform_get_eval_request L151-L163;
  OpenAIEvalsConfig.transform_get_eval_response L165-L174; OpenAIEvalsConfig.transform_update_eval_request L176-L192;
  OpenAIEvalsConfig.transform_update_eval_response L194-L203; OpenAIEvalsConfig.transform_delete_eval_request L205-L217;
  OpenAIEvalsConfig.transform_delete_eval_response L219-L228; OpenAIEvalsConfig.transform_cancel_eval_request L230-L245;
  OpenAIEvalsConfig.transform_cancel_eval_response L247-L256; OpenAIEvalsConfig.transform_create_run_request L259-L279;
  OpenAIEvalsConfig.transform_create_run_response L281-L290; OpenAIEvalsConfig.transform_list_runs_request L292-L323;
  OpenAIEvalsConfig.transform_list_runs_response L325-L334; OpenAIEvalsConfig.transform_get_run_request L336-L351;
  OpenAIEvalsConfig.transform_get_run_response L353-L362; OpenAIEvalsConfig.transform_cancel_run_request L364-L382;
  OpenAIEvalsConfig.transform_cancel_run_response L384-L393; OpenAIEvalsConfig.transform_delete_run_request L395-L413;
  OpenAIEvalsConfig.transform_delete_run_response L415-L424.


  Named case contracts: eval_create_update: Create/update and create-run omit only top-level None values, preserving
  false, zero, empty containers and nested nulls. Update returns URL, original headers and filtered body. eval_list_pagination:
  List uses truthy litellm_params.api_base or https://api.openai.com, not global base/env fallbacks. Forward only
  truthy limit, after, before, order and order_by without stringifying limit; ignore other query keys. eval_get_delete_cancel:
  Get/delete eval return URL and original headers; cancel appends /cancel and returns an empty body. Eval ID encoding
  delegates to B206 with field_name=eval_id. run_list_pagination: Run list has the same base and truthiness rules
  but omits order_by entirely; path is /v1/evals/{encoded eval_id}/runs. run_get_cancel_delete: Run get/delete use
  /v1/evals/{encoded eval_id}/runs/{encoded run_id}; cancel appends /cancel. Both run delete and cancel include
  {}, while get returns URL and headers only. malformed_json_error: Every response first calls raw_response.json
  and then its operation-specific model validator; JSON/model-validation errors propagate without conversion into
  a provider-specific error. eval_auth_required: Resolve litellm_params.api_key, litellm.api_key, litellm.openai_key,
  OPENAI_API_KEY in order by truthiness. If none resolves, raise ValueError OPENAI_API_KEY is required for Evals
  API. Otherwise overwrite Authorization with Bearer <key> and Content-Type with application/json. eval_url_literal_append:
  get_complete_url defaults only None to https://api.openai.com and appends /v1/{endpoint}, or /v1/evals/{encoded
  eval_id} when eval_id is truthy. It does not strip slashes or /v1: retain duplicate slashes and /v1/v1 for corresponding
  bases.


  Write standalone Rust test openai_evals_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_evals_secret_safe_failure in betterlite-openai: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-openai/src/evals.rs with adjacent tests under evals/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation openai_evals in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function evals_cases in betterlite-openai with these exact named cases (one per oracle file): eval_create_update,
  eval_list_pagination, eval_get_delete_cancel, run_create_data_source, run_list_pagination, run_get_cancel_delete,
  malformed_json_error, eval_auth_required, eval_url_literal_append. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_evals* using HelperCase: kind: helper
  and the externally tagged openai_evals variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_openai_evals that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_eval_reply consumes eval/run JSON response bytes in crates/betterlite-openai/src/evals.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_evals.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_evals.
  The adjacent test replays_the_openai_evals_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 300 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 325 production lines, 235 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 755 planned, 775 maximum changed lines.
