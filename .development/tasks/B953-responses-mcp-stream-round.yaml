id: B953
title: Responses mcp stream round
description: >-
  Implement initial MCP Responses streaming phases and output-index remapping over response events, tracking pending
  followups and round width. Consume discovery results and event constructors as explicit inputs; preserve terminal
  event deferral until tool execution has finished.


  When the source calls _generate_tool_execution_events or _anext_impl, return RoundAction::ExecuteTools or RoundAction::Advance
  with retained round state. B954 consumes these actions and drives follow-up execution; B953 never calls its driver.
  Assert terminal deferral and action order in the round tests.


  Implement crates/betterlite-core/src/api/responses_mcp_stream_round.rs. Use ResponsesMcpStreamRounInput and ResponsesMcpStreamRounResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions list_tools_before_model, initial_response_tool_call, round_output_offset,
  terminal_deferred, stream_error_frame under api::responses_mcp_stream_round::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesMcpStreamRound in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_mcp_stream_round: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator.__init__ (L276-L352);
  litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._extract_mcp_headers_from_params
  (L354-L409); litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._should_auto_execute_tools
  (L411-L417); litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._make_stream_error_event
  (L419-L431); litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator.__aiter__ (L433-L434);
  litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._handle_initial_response_phase (L517-L577);
  litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._is_response_completed (L579-L584);
  litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._follow_up_pending (L586-L588);
  litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._round_output_width (L590-L592);
  litellm/responses/mcp/mcp_streaming_iterator.py: MCPEnhancedStreamingIterator._absorb_round (L594-L606); litellm/responses/mcp/mcp_streaming_iterator.py:
  MCPEnhancedStreamingIterator._compose_round_chunk (L608-L653); litellm/responses/mcp/mcp_streaming_iterator.py:
  MCPEnhancedStreamingIterator._process_base_iterator_chunk (L655-L685); litellm/responses/mcp/mcp_streaming_iterator.py:
  MCPEnhancedStreamingIterator._create_initial_response_iterator (L687-L727). Abstract/protocol declarations map
  to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 256 owned nonblank/non-comment/non-docstring Python lines (279 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 276 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 526 total within the 530-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B925 (Responses stream events), B949
  (Responses mcp discovery), B952 (Responses mcp events), B1087 (Api boundaries), B950 (Responses mcp execute),
  B932 (Responses create call). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.
