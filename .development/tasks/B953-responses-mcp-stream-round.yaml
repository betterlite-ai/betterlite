checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::/)
      - test(/::replays_corpus$/)'
  - id: case-list-tools-before-model
    why: the list-tools-before-model behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::list_tools_before_model($|::)/)'
  - id: case-initial-response-tool-call
    why: the initial-response-tool-call behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::initial_response_tool_call($|::)/)'
  - id: case-round-output-offset
    why: the round-output-offset behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::round_output_offset($|::)/)'
  - id: case-terminal-deferred
    why: the terminal-deferred behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::terminal_deferred($|::)/)'
  - id: case-stream-error-frame
    why: the stream-error-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::stream_error_frame($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_mcp_stream_round.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_mcp_stream_round-*)"
      && grep -qE "^[[:space:]]+responses_mcp_stream_round:" tools/oracle/fuzz/corpus/helper_case/responses_mcp_stream_round-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-mcp-stream-round)"
