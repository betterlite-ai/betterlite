id: B953
title: Responses mcp stream round
description: >-
  Build the round-state half of LiteLLM's MCPEnhancedStreamingIterator for Responses streaming. The implementation
  owns construction, MCP-header state, the initial response phase, output-index accounting, response-ID repair,
  terminal-event deferral, and the initial provider-call preparation. Keep B954's iteration/tool-execution loop behind
  an explicit action seam: when a completed response has auto-executable tool calls, B953 returns an ExecuteTools
  transition with the collected response and retained round state; it does not call B954 methods directly. A later
  Advance transition resumes the same round state after B954 has supplied tool results.

  Implement crates/betterlite-core/src/api/responses_mcp_stream_round.rs with typed round input, transition and
  result records. Inject the already decoded event stream, B949 discovery output, B950 tool-selection decision,
  B932 provider-call service, logger and ID source at construction; do not read environment variables or credentials
  from this module. Reuse B925 event/iterator types and B1087 limits. The initial provider call must set
  stream=True, copy every original request parameter including tools, and expose its provider HTTP transcript through
  a mock-provider case; B953 does not register a gateway route.

  The constructor must preserve these LiteLLM defaults: mcp_tools_with_litellm_proxy=None becomes [],
  user_api_key_auth=None, original_request_params=None becomes {}, model absent becomes "unknown",
  custom_llm_provider absent becomes None, phase="initial_response", finished=False, mcp_discovery_generated=True,
  is_async=True, initial_events_emitted=False, _cached_response_id=None, _initial_creation_error=None,
  _stream_error=None, _error_event_emitted=False, _last_sequence_number=0, _round_index=0,
  _output_index_offset=0, _round_max_output_index=-1, and empty composed/pending/event lists. Header extraction
  preserves raw_headers=None until a header source exists, reads secret_fields.raw_headers, and merges each MCP tool's
  headers after request headers; the B905 contract supplies default x-mcp-auth and its
  LITELLM_MCP_CLIENT_SIDE_AUTH_HEADER_NAME / mcp_client_side_auth_header_name overrides.

  Preserve exact round behavior. Emit the base response.output_item.added event before queued discovery events;
  discovery events retain their input order. A response.completed chunk is a completion only when its type is exactly
  "response.completed". Integer output_index values update the round maximum and gain the accumulated offset on later
  rounds. A round width is max(len(response.output), _round_max_output_index + 1); absorbing a round removes function
  calls whose tool_call_id was answered, appends pending mcp_call items, advances the offset by width plus pending
  item count, clears pending items and resets the maximum to -1. Follow-up response.created and response.in_progress
  events are dropped when _round_index > 0. A gateway-executed response.completed is deferred; after tool results,
  the final completed response contains composed prior items followed by its own output.

  A stream error event has type "response.error", the next sequence number, error.type "mcp_gateway_error",
  param=None, code=str(status_code) such as "502" when the exception has status_code=502, otherwise code
  "internal_error", and message=str(exception) or "MCP gateway stream failed" when no exception exists. The initial
  provider preparation calls B932's aresponses seam with stream=True; an async iterable/iterator response is retained
  and its model, litellm_metadata (default {}), and custom_llm_provider metadata are copied. A non-stream response
  logs exactly "Got non-streaming response: %s" at warning level, stores no iterator and finishes. Any exception logs
  exactly "Error creating initial response iterator: %s" at error level, prints its traceback, stores the exception in
  _initial_creation_error and _stream_error, and still permits already generated discovery events to be emitted before
  the error event. The initial call also logs exactly "Making LLM call with %s tools" at debug level, with tools_count=0
  when tools is absent or empty.

  Add tests.rs under api::responses_mcp_stream_round::tests with the exact behavior functions
  constructor_defaults_and_headers, list_tools_before_model, initial_response_tool_call, round_output_offset,
  terminal_deferred, stream_error_frame and initial_provider_http_stream. Use deterministic IDs and event sequences;
  the first six are pure typed-state tests, while initial_provider_http_stream runs the initial aresponses call through
  the mock provider. Do not add a decoder fuzz target: this task transforms typed events and streams, and B925/B932
  own byte decoding.

  Register HelperCall::ResponsesMcpStreamRound in tools/oracle/src/helpers/mod.rs and helpers.rs when required, add
  tools/oracle/helpers/responses_mcp_stream_round.py and externally tagged helper seeds under
  tools/oracle/fuzz/corpus/helper_case/responses_mcp_stream_round-*. Compare ordered events, dropped/retained chunks,
  action transitions, diagnostics and mutations against independently scripted pinned behavior; do not compare random
  response IDs. The provider-facing transcript is the HTTP case listed below, not a second route registration.

  Owned LiteLLM callables are MCPEnhancedStreamingIterator.__init__ L276-L352,
  _extract_mcp_headers_from_params L354-L409, _should_auto_execute_tools L411-L417,
  _make_stream_error_event L419-L431, __aiter__ L433-L434, _handle_initial_response_phase L517-L577,
  _is_response_completed L579-L584, _follow_up_pending L586-L588, _round_output_width L590-L592,
  _absorb_round L594-L606, _compose_round_chunk L608-L653, _process_base_iterator_chunk L655-L685 and
  _create_initial_response_iterator L687-L729. These are complete methods; no method is split by line range.

  The owned ranges contain 279 nonblank, non-comment physical lines. Budget 300 implementation lines, 150 native
  behavior lines, 85 helper fixtures/adapters, 35 provider transcript/wiring and 30 tests/oracle plumbing: 600
  changed lines. Direct inputs are B171, B925, B949, B950, B952, B932 and B1087.
