dod:
- text: >-
    constructor_defaults_and_headers: constructing with base_iterator=null, mcp_events=[], tool_server_map={} and
    original_request_params=null yields model="unknown", phase="initial_response", finished=false, is_async=true,
    _last_sequence_number=0, _round_index=0, _output_index_offset=0, _round_max_output_index=-1, raw_headers=null,
    empty pending/composed/tool-execution lists and null error/response fields; a second input with
    secret_fields.raw_headers={"x-mcp-auth":"Bearer old","x-mcp-alpha-authorization":"Bearer scoped",
    "authorization":"Bearer oauth"} and an MCP tool headers map {"x-mcp-alpha-x-api-key":"tool-key",
    "x-client":"tool"} retains all request headers and lets tool headers win in raw_headers, while B905 returns
    mcp_auth_header="Bearer old", mcp_server_auth_headers={"alpha":{"Authorization":"Bearer scoped",
    "x-api-key":"tool-key"}}, and oauth2_headers={"Authorization":"Bearer oauth"}.
  proof: [case-constructor-defaults-and-headers, oracle, helper-python]
- text: >-
    list_tools_before_model: an initial stream whose first event is response.output_item.added and whose queued
    discovery records have types response.mcp_list_tools.in_progress then response.mcp_list_tools.completed emits
    the base output_item.added first, then those two discovery records in order, then the next base event; an empty
    base iterator still drains discovery records before StopAsyncIteration.
  proof: [case-list-tools-before-model, oracle, helper-python]
- text: >-
    initial_response_tool_call: with should_auto_execute=true and response id="resp_initial" containing one
    function_call with call_id="call_1" and output_index=0, response.output_item.added is forwarded, the completed
    response is retained for B954 as ExecuteTools state, and the response.completed event is not emitted before tool
    execution supplies results; should_auto_execute=false forwards the same response.completed event unchanged.
  proof: [case-initial-response-tool-call, oracle, helper-python]
- text: >-
    round_output_offset: absorbing a round with output indexes 0 and 1 and one answered function call removes that
    function_call, keeps the other output in order, appends the pending mcp_call item at index 2, advances the offset
    from 0 to 3, clears pending items and resets _round_max_output_index to -1; a follow-up output_index=0 becomes 3,
    while follow-up response.created and response.in_progress are dropped when _round_index=1. If the first response
    event caches id="resp_initial" and a later response event carries id="resp_wrong", the later event is rewritten to
    id="resp_initial" before composition; a non-integer output_index is left unchanged.
  proof: [case-round-output-offset, oracle, helper-python]
- text: >-
    terminal_deferred: a response.completed event with an auto-executable call returns no client chunk and emits the
    ExecuteTools transition before any terminal event; after B954 supplies the call result, a final response.completed
    carries the absorbed prior output followed by the final response output, with no duplicate response.created or
    response.in_progress from the follow-up round.
  proof: [case-terminal-deferred, oracle, helper-python]
- text: >-
    stream_error_frame: with _last_sequence_number=8 and an exception carrying status_code=502 and text
    "upstream failed", the next frame is type="response.error", sequence_number=9, error.type="mcp_gateway_error",
    error.code="502", error.message="upstream failed" and error.param=null; with no exception, code is
    "internal_error" and message is exactly "MCP gateway stream failed".
  proof: [case-stream-error-frame, oracle, helper-python]
- text: >-
    initial_provider_http_stream: the initial aresponses call copies model="oracle-model", input="hello", tools,
    custom_llm_provider="openai", and every original parameter, overwrites stream from false to true, sends that
    request to the mock provider, retains its async stream, and copies provider model="oracle-model",
    litellm_metadata={} and custom_llm_provider="openai"; a non-stream response logs the warning, stores no iterator
    and finishes, while a provider exception logs "Error creating initial response iterator: %s", stores both error
    fields and still drains queued discovery frames first. The debug call log is "Making LLM call with %s tools" and
    reports 0 when the copied request has no tools.
  proof: [case-initial-provider-http-stream, oracle, helper-python]
- text: >-
    The Rust/Python helper adapter uses the externally tagged responses_mcp_stream_round operation and every added
    helper seed replays through the shared production parser; the provider transcript is a separate HTTP case and
    compares the request sent to the mock upstream as well as the client stream.
  proof: [helper-python, helper-corpus, oracle, new-oracle-cases]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The round module or one of its named production tests is absent, leaving constructor, offsets, deferral or errors unchecked.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::/) - test(/::replays_corpus$/)'
  - id: case-constructor-defaults-and-headers
    why: The constructor's literal defaults or request/tool header merge assertions are absent.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::constructor_defaults_and_headers($|::)/)'
  - id: case-list-tools-before-model
    why: Discovery records could be emitted before response.output_item.added or in the wrong order.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::list_tools_before_model($|::)/)'
  - id: case-initial-response-tool-call
    why: Auto-executable completion could be emitted before B954 receives retained round state.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::initial_response_tool_call($|::)/)'
  - id: case-round-output-offset
    why: Answered calls, pending MCP items or follow-up indexes could corrupt the accumulated output offset.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::round_output_offset($|::)/)'
  - id: case-terminal-deferred
    why: A gateway-executed response.completed could leak before tool execution or duplicate follow-up lifecycle frames.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::terminal_deferred($|::)/)'
  - id: case-stream-error-frame
    why: Status-code conversion or the no-exception fallback message could change the observable error frame.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::stream_error_frame($|::)/)'
  - id: case-initial-provider-http-stream
    why: The initial provider call could omit copied parameters, fail to force stream=true, or lose provider metadata.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_mcp_stream_round::tests::initial_provider_http_stream($|::)/)'
  - id: helper-python
    why: The independently scripted helper adapter is absent or fails strict Python checks.
    run: test -f tools/oracle/helpers/responses_mcp_stream_round.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The new helper operation has no prefixed seed or the shared parser cannot replay it.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_mcp_stream_round-*)" && grep -qE "^[[:space:]]+responses_mcp_stream_round:" tools/oracle/fuzz/corpus/helper_case/responses_mcp_stream_round-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: A named helper or provider transcript was not added on this branch.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-mcp-stream-round tools/oracle/cases/responses-mcp-stream-round)"
