out_of_scope:
- 'litellm/responses/mcp/mcp_streaming_iterator.py: B952 owns _output_items L38-L40, _function_call_id L43-L53, _set_event_field L56-L58, create_mcp_list_tools_events L61-L177 and create_mcp_call_events L180-L261; B953 consumes their typed records and does not copy them.'
- 'litellm/responses/mcp/mcp_streaming_iterator.py: B954 owns MCPEnhancedStreamingIterator.__anext__ L436-L445, _anext_impl L447-L515, _generate_tool_execution_events L731-L880, _create_follow_up_iterator L882-L951, __iter__ L953-L954 and __next__ L956-L974; B953 emits actions instead of calling these methods.'
- 'litellm/responses/mcp/litellm_proxy_mcp_handler.py: B950 owns _should_auto_execute_tools L540-L563, _extract_tool_calls_from_response L566-L577 and _extract_tool_call_details L604-L635; B953 consumes their decision and tool records.'
- 'litellm/responses/utils.py: B905 owns ResponsesAPIRequestUtils.extract_mcp_headers_from_request L1070-L1137 and the LITELLM_MCP_CLIENT_SIDE_AUTH_HEADER_NAME / mcp_client_side_auth_header_name precedence; B953 preserves the header values returned at its call boundary.'
- 'litellm/responses/main.py: B932 owns aresponses L576-L761; B953 owns only the initial iterator call-site preparation and uses the injected/mock provider seam.'
- 'litellm/responses/streaming_iterator.py: B925 owns BaseResponsesAPIStreamingIterator and its byte/event decoding; B953 consumes decoded ResponsesAPIResponse and ResponsesAPIStreamingResponse values.'
- 'Gateway route registration, authentication envelopes, all response route aliases and HTTP status mapping remain with B955 and the Responses route tasks; this task adds only the provider transcript required for its SDK call.'
- 'No enterprise-only hook, callback or deployment branch is read or implemented.'
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_mcp_stream_round in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_mcp_stream_round.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_mcp_stream_round.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'The source suppresses response.completed only after _generate_tool_execution_events marks the current collected response as the tool-result source; suppressing every completed event would lose a final text response.'
- 'A streamed output_index can exceed len(response.output)-1; width must retain max(_round_max_output_index + 1, len(output)) or the next MCP item collides with a prior index.'
- 'Tool headers update raw_headers after request headers and after server-specific extraction, so x-mcp-alpha-x-api-key="tool-key" wins without replacing x-mcp-alpha-authorization="Bearer scoped".'
- 'The error event uses code="502" as a string when status_code=502 and uses code="internal_error" only when status_code is absent; param remains null in both cases.'
- 'Initial-call failure stores the exception and prints its traceback but does not set phase="finished" until queued discovery events have been drained.'
review_level: standard
budget:
  max_changed_lines: 600
  max_new_expects: 1
