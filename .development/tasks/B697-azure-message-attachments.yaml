checks:
  optional:
  - mutants
  commands:
  - id: case-append-message
    why: Pass thread_id positionally and all message_data fields to beta.threads.messages.create. Missing status
      or status=None becomes completed before validating response.dict() as OpenAIMessage; preserve existing non-None
      status including empty string and resulting validation errors. Do not filter message_data using the separate
      legacy mapper here.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_append_message$/)'
  - id: case-list-messages-no-query
    why: Call beta.threads.messages.list(thread_id=thread_id) with no order/limit/before/after and return the SDK
      cursor page unchanged. Only literal True aget_messages/a_add_message selects async; no catches are added.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_list_messages_no_query$/)'
  - id: case-attachment-tools
    why: 'The legacy mapper supported list is role,content,attachments,metadata. Role/metadata pass through; string
      content passes, non-string raises UnsupportedParamsError400 Azure only accepts content as a string. Unknown
      keys silently drop. A list attachments collects each file_id but NEVER assigns that list to optional_params:
      valid attachments disappear, tools are not inspected, and any preexisting optional attachments/file_ids remain
      unchanged.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_attachment_tools$/)'
  - id: case-invalid-attachment-drop
    why: For a list item missing file_id, only global litellm.drop_params is literal True skips it silently with
      no warning; there is no per-call flag. Continue validating later items. A valid list still produces no new
      attachment/file_ids field.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_invalid_attachment_drop$/)'
  - id: case-invalid-attachment-error
    why: With drop_params False, missing file_id raises UnsupportedParamsError400 Azure doesn't support {value}.
      To drop it from the call, set `litellm.drop_params = True. Non-list attachments always raises Invalid param.
      attachments should always be a list. Got={type(value)}, Expected=List. Raw value={value}, even when drop_params
      True. Preserve malformed item containment/indexing failures; do not add file_search/code_interpreter validation.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_invalid_attachment_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_message_attachments.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_message_attachments*")"
      && grep -lq 'azure_message_attachments' tools/oracle/fuzz/corpus/helper_case/azure_message_attachments* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_message_attachments$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-assistants-beta-default
    why: 'For append/list use OpenAI-Beta: assistants=v2 through the same SDK beta header contract as B519/B520/B527/B686;
      Azure endpoint/version remains B686.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_assistants_beta_default$/)'
  - id: case-azure-message-client-inputs
    why: Both sync and async call B686 with api_key/base/version,azure_ad_token,timeout,max_retries,client and litellm_params,
      preserving the B686 ignored explicit arguments and provided-client behavior. SDK failures propagate without
      conversion; no env read or new parser exists here.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_azure_message_client_inputs$/)'
