checks:
  optional:
  - mutants
  commands:
  - id: case-append-message
    why: The append-message behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_append_message$/)'
  - id: case-list-messages-no-query
    why: The list-messages-no-query behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_list_messages_no_query$/)'
  - id: case-attachment-tools
    why: The attachment-tools behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_attachment_tools$/)'
  - id: case-invalid-attachment-drop
    why: The invalid-attachment-drop behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_invalid_attachment_drop$/)'
  - id: case-invalid-attachment-error
    why: The invalid-attachment-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_message_attachments_cases::case_[0-9]+_invalid_attachment_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_message_attachments.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_message_attachments*")"
      && grep -lq 'azure_message_attachments' tools/oracle/fuzz/corpus/helper_case/azure_message_attachments* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_message_attachments$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
