id: B697
title: Azure message creation and attachment policy
description: >-
  Port Azure message append/list and the legacy attachment parameter mapper with its actual drop_params behavior,
  sharing B520 wire records and B686 client preparation. B687 retains thread create/retrieve.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/assistants.py:
  AzureAssistantsAPI.a_add_message L194-L229; AzureAssistantsAPI.add_message L234-L248; AzureAssistantsAPI.add_message
  L251-L265; AzureAssistantsAPI.add_message L269-L318; AzureAssistantsAPI.async_get_messages L320-L345; AzureAssistantsAPI.get_messages
  L350-L363; AzureAssistantsAPI.get_messages L366-L379; AzureAssistantsAPI.get_messages L383-L421. litellm/llms/azure/azure.py:
  AzureOpenAIAssistantsAPIConfig.__init__ L66-L69; AzureOpenAIAssistantsAPIConfig.get_supported_openai_create_message_params
  L71-L77; AzureOpenAIAssistantsAPIConfig.map_openai_params_create_message_params L79-L112.


  Named case contracts: append_message: Pass thread_id positionally and all message_data fields to beta.threads.messages.create.
  Missing status or status=None becomes completed before validating response.dict() as OpenAIMessage; preserve existing
  non-None status including empty string and resulting validation errors. Do not filter message_data using the separate
  legacy mapper here. list_messages_no_query: Call beta.threads.messages.list(thread_id=thread_id) with no order/limit/before/after
  and return the SDK cursor page unchanged. Only literal True aget_messages/a_add_message selects async; no catches
  are added. attachment_tools: The legacy mapper supported list is role,content,attachments,metadata. Role/metadata
  pass through; string content passes, non-string raises UnsupportedParamsError400 Azure only accepts content as
  a string. Unknown keys silently drop. A list attachments collects each file_id but NEVER assigns that list to
  optional_params: valid attachments disappear, tools are not inspected, and any preexisting optional attachments/file_ids
  remain unchanged. invalid_attachment_drop: For a list item missing file_id, only global litellm.drop_params is
  literal True skips it silently with no warning; there is no per-call flag. Continue validating later items. A
  valid list still produces no new attachment/file_ids field. invalid_attachment_error: With drop_params False,
  missing file_id raises UnsupportedParamsError400 Azure doesn't support {value}. To drop it from the call, set
  `litellm.drop_params = True. Non-list attachments always raises Invalid param. attachments should always be a
  list. Got={type(value)}, Expected=List. Raw value={value}, even when drop_params True. Preserve malformed item
  containment/indexing failures; do not add file_search/code_interpreter validation. assistants_beta_default: For
  append/list use OpenAI-Beta: assistants=v2 through the same SDK beta header contract as B519/B520/B527/B686; Azure
  endpoint/version remains B686. azure_message_client_inputs: Both sync and async call B686 with api_key/base/version,azure_ad_token,timeout,max_retries,client
  and litellm_params, preserving the B686 ignored explicit arguments and provided-client behavior. SDK failures
  propagate without conversion; no env read or new parser exists here.


  Use the existing lower config record for litellm.drop_params (default False); no new config key is introduced.
  B184 owns UnsupportedParamsError/status400 and its unset param/code; do not manufacture attachment-specific param
  names. B520 supplies the SDK message wire decoder; B686 supplies Azure client construction.


  Implement crates/betterlite-azure/src/azure_message_attachments.rs with adjacent tests under azure_message_attachments/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_message_attachments_cases in betterlite-azure with these exact named cases (one per
  oracle file): append_message, list_messages_no_query, attachment_tools, invalid_attachment_drop, invalid_attachment_error,
  assistants_beta_default, azure_message_client_inputs. Each case exercises its named outcome independently; use
  stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must
  not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_message_attachments* using HelperCase:
  kind: helper and the externally tagged azure_message_attachments variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_azure_message_attachments that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 246 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 250 production lines, 245 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines.
