deviations:
  - what: The stopped logger ignores exceptions when scheduling _final_drain() on shutdown, so it never panics into the cache eviction path.
    why: Eviction should always complete, and if the event loop is shutting down there may be no running loop to schedule the task.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L229-L232
  - what: A record appended by a callback after stop() is left for its own drain, never dropped at the final pass with records that were queued at drain start.
    why: "Fairness: every record gets the full three-pass retry budget, not fewer attempts because a callback raced the drain."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/newrelic/newrelic_metrics.py#L250-L269
out_of_scope:
  - Metric record construction and aggregation (B3943 owns _metric_record_from_payload, build_metric_payload and limits).
  - HTTP client setup (B173 owns get_async_httpx_client and POST transport).
  - JSON serialization (B192 owns safe_dumps).
  - Base batch logger (B256 owns CustomBatchLogger.__init__, periodic_flush scheduling and batch_size/max_queue_size initialization).
pitfalls:
  - "The newrelic_api_key is passed explicitly to __init__; there is no environment fallback. An empty or missing key raises ValueError immediately."
  - "The Api-Key header value must be passed exactly as newrelic_api_key; do not add a Bearer prefix or modify the value."
  - "408 and 429 must be retried; 403 is a permanent credential failure and must be dropped with a diagnostic message naming it."
  - "Other 4xx statuses are permanent failures (bad request, not found, etc.) and must be dropped, never retried."
  - "5xx statuses and network errors (HTTPStatusError caught, or any exception during the post) must be requeued."
  - "_requeue() prepends the batch in place (never self.log_queue = batch + self.log_queue): records appended concurrently must survive."
  - "max_queue_size overflow drops only the oldest records, preserving newer records and any record appended during the requeue operation."
  - "A stopped logger's _drain_with_retry() loop must take a snapshot of the queue before the first pass attempt, not at the start of each pass."
  - "Records appended during drain that were not in the snapshot must not be dropped at the final pass; they are left for a subsequent serialized drain."
  - "Backoff between drain passes is 2^pass seconds: 0, 1, 2 seconds (three passes total)."
  - "flush_queue() must limit chunk attempts to ceil(queued / batch_size) where queued is the count at lock release, never loop until empty."
  - "The interval.ms must use the real flush window start time (the previous last_flush_time) as window_start, not the current time."
  - "Request body is gzipped; Content-Type and Content-Encoding headers must reflect gzipped JSON, not raw JSON."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
