id: B3944
title: New Relic metric delivery, retries and eviction drain
description: >-
  Implement NewRelicMetricsLogger delivery, retry, and drain state machine for team metric batches.
  Deliver team metrics using explicit team credentials only (no environment fallback), gzip
  request bodies with Content-Type application/json and Content-Encoding gzip, split large payloads
  into 200-record chunks (NEWRELIC_METRICS_MAX_BATCH_SIZE), and cap retried records at 10,000
  (NEWRELIC_METRICS_MAX_RETRY_QUEUE_SIZE). Classify HTTP responses: 408 (request timeout) and 429
  (rate limit) requeue for retry with exponential backoff; other 4xx drops with a diagnostic message
  (permanent failures like 403 credential rejection); 5xx and network errors requeue. When the queue
  exceeds max_queue_size after a retry requeue, drop the oldest records first and log the count.
  Implement stop() called on cache eviction: set stopped flag and schedule _final_drain() as a fire-and-forget
  task, guarded against a shutdown race. For a stopped logger, every new async_log_success_event or
  async_log_failure_event calls _drain_with_retry(). The _drain_with_retry() loop attempts delivery
  on every queued record across up to three passes (NEWRELIC_METRICS_MAX_DRAIN_PASSES) with 2^pass
  seconds backoff between attempts, never stopping at the first failing chunk so a persistent
  head failure does not starve the tail. After the final pass, drop any records still queued that
  were present at drain start (a record appended by a callback during drain is left for its own drain).
  Use max(1, int((now - window_start) * 1000)) for interval.ms; it is the real flush window, not a
  fixed config value. The periodic_flush() task runs until stopped, calling flush_queue() at a 5-second
  interval. flush_queue() takes the queue under flush_lock, empties it to a local snapshot, releases
  the lock, splits into batch_size chunks without exceeding the queued count at lock time, and stops
  at the first failing chunk (unlike drain, which attempts all chunks). Every async send is isolated
  under async_send_batch() so concurrent requests append to the queue without blocking send.
