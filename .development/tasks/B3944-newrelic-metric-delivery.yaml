dod:
  - text: NewRelicMetricsLogger requires an explicit newrelic_api_key and rejects missing or empty keys with a detailed error.
    proof: [init-validation-tests]
  - text: Credentials are never read from the environment; the logger takes the API key as a constructor parameter only.
    proof: [credential-isolation-tests]
  - text: 408 and 429 status codes are retried; other 4xx status codes drop the batch with a diagnostic message; 5xx and network errors requeue for retry.
    proof: [response-classification-tests, oracle]
  - text: Retried batches are prepended to the queue in chronological order (oldest records dropped first on overflow) and capped at max_queue_size=10000 records.
    proof: [requeue-and-overflow-tests, oracle]
  - text: The stopped logger returns a bool from stop() guarded against shutdown race and schedules _final_drain() as a fire-and-forget task.
    proof: [stop-safety-tests]
  - text: A stopped logger with subsequent async_log_success_event or async_log_failure_event calls drains on every new record through _drain_with_retry().
    proof: [post-stop-callback-tests]
  - text: _drain_with_retry() attempts delivery on every queued record up to three passes with 2^pass second backoff (0s, 1s, 2s), never stops at the first failing chunk, and drops only survivors at the final pass.
    proof: [drain-behavior-tests, oracle]
  - text: A record appended by a callback during drain is not dropped after the final pass, so it is left for its own serialized drain.
    proof: [drain-callback-interleave-tests]
  - text: flush_queue() limits chunk attempts to the current queue size at lock release (records appended mid-flush belong to the next window), stops at the first failing chunk, and logs progress.
    proof: [flush-behavior-tests, oracle]
  - text: Requests are gzipped with Content-Type application/json, Content-Encoding gzip, and Api-Key header.
    proof: [gzip-headers-tests, oracle]
  - text: Interval.ms is computed as max(1, int((now - window_start) * 1000)) in milliseconds, where window_start is the flush start time at lock release.
    proof: [interval-ms-tests, oracle]
checks:
  optional: [mutants]
  commands:
    - id: init-validation-tests
      why: Initialization rejects empty keys or accepts missing credentials.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::init_validation(::|$)/)'
    - id: credential-isolation-tests
      why: Credentials fall back to environment variables or are read at wrong point.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::credential_isolation(::|$)/)'
    - id: response-classification-tests
      why: Response status codes are classified incorrectly for retry/drop decision.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::response_classification(::|$)/)'
    - id: requeue-and-overflow-tests
      why: Retry queue prepends incorrectly, exceeds max_queue_size, or does not drop oldest.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::requeue_and_overflow(::|$)/)'
    - id: stop-safety-tests
      why: stop() panics, does not schedule final drain, or fails on shutdown race.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::stop_safety(::|$)/)'
    - id: post-stop-callback-tests
      why: Stopped logger does not drain on new callbacks or drains incorrectly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::post_stop_callback(::|$)/)'
    - id: drain-behavior-tests
      why: Drain does not attempt all passes, stops at first failure, or drops records prematurely.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::drain_behavior(::|$)/)'
    - id: drain-callback-interleave-tests
      why: Records appended during drain are dropped or stranded.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::drain_callback_interleave(::|$)/)'
    - id: flush-behavior-tests
      why: flush_queue stops at first failure, exceeds current queue size, or does not limit chunks.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::flush_behavior(::|$)/)'
    - id: gzip-headers-tests
      why: Gzip compression is missing, headers are wrong, or Api-Key is malformed.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::gzip_headers(::|$)/)'
    - id: interval-ms-tests
      why: Interval computation is wrong, floor is not applied, or window_start is incorrect.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^newrelic_metrics::tests::interval_ms(::|$)/)'
