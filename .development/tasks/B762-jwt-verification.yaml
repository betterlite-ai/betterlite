id: B762
title: Verify JWT signatures and trusted issuers
description: >-
  Implement JwtVerifier with jsonwebtoken and RustCrypto p521 for ES512; do not use josekit or openssl.
  Allow exactly RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512 and EdDSA, never HS* or
  none; bind verification to a compatible configured key and preserve JWK versus PEM X.509 input. Default
  leeway is zero. JWT_AUDIENCE and JWT_ISSUER both default absent: retain signature/time checks and the
  source once-only warning when both are absent, including unmatched-issuer fallback. Per-issuer audience
  remains required unless disable_audience_validation is explicitly true. Do not add an issuer-specific
  algorithm configuration key. OIDC userinfo uses only configured endpoints and maps a validated response
  into the same verified-identity type. Strip all caller-supplied _litellm_* internal claim keys from
  verified payloads before trusted normalized claims are added. decode_signed_jwt(&[u8]) is the bounded
  compact/JWK/claim decoder exercised by the fuzz target.


  Build the production jwt_verification module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTHandler.get_oidc_userinfo (L1009-L1066; 42 source lines), JWTHandler._build_decode_kwargs (L1071-L1107;
  32 source lines), JWTHandler.managed_issuer_is_trusted (L1109-L1116; 8 source lines), JWTHandler._get_configured_issuer
  (L1118-L1139; 17 source lines), JWTHandler._get_jwks_url_for_issuer (L1141-L1146; 4 source lines), JWTHandler._get_claim_value_for_issuer_mapping
  (L1148-L1163; 15 source lines), JWTHandler._apply_issuer_claim_mappings (L1165-L1187; 21 source lines),
  JWTHandler._get_jwk_from_public_key (L1189-L1194; 6 source lines), JWTHandler._get_decode_options (L1196-L1215;
  14 source lines), JWTHandler._decode_jwt_with_public_key (L1217-L1261; 43 source lines), JWTHandler._auth_jwt_with_issuer
  (L1263-L1293; 29 source lines), JWTHandler.auth_jwt (L1295-L1335; 33 source lines), JWTHandler.close
  (L1337-L1338; 2 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): JWT_AUDIENCE=None;
  JWT_ISSUER=None; litellm_jwtauth.oidc_userinfo_endpoint=None; litellm_jwtauth.oidc_userinfo_cache_ttl=300;
  litellm_jwtauth.issuers=None.


  Add the jwt_verification operation under B856 Management::jwt. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-verification-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::jwt_verification::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary jwt_verification::decode_signed_jwt(&[u8]) -> Result<TypedValue,DecodeError>
  for compact token, JWK and signed claim JSON. Production calls this decoder before its typed policy
  functions; the cargo-fuzz target jwt_verification calls that same function. Seed valid, truncated, malformed,
  duplicate-field and limit-boundary inputs and add jwt_verification::tests::replays_the_jwt_verification_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B733 owns crates/betterlite-auth/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 266 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  266 production, 180 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 50 config lines, 636 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Pin externally visible verification/key-fetch failures through B001 HTTP cases against the real MIT
  proxy and betterlite, using B860 independent databases and a configured local JWKS mock. Register this
  production pre-identity stage through B732; a rejected signature or unavailable key must pass through
  the real HTTP auth exception mapper before any identity lookup or downstream handler. Compare status
  and error type/param/code, including unavailable-key 503 versus invalid-token 401. Successful claim
  projections remain helper cases until B053 installs the complete JWT identity backend; do not use a
  fabricated HTTP success. Server registration tests live at auth::jwt_verification::tests::stage_is_registered
  and failure_stops_downstream, within the existing behavior-test allowance.
