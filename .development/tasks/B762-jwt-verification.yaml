dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: valid_signature, wrong_signature,
      algorithm_confusion, wrong_audience, wrong_issuer, expired_token, issuer_claim_map, userinfo_failure,
      unscoped_warning_once, unmatched_issuer_fallback, pem_certificate, rs256, rs384, rs512, ps256, ps384,
      ps512, es256, es384, es512, eddsa, injected_litellm_team_id_stripped.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The production decode_signed_jwt decoder is used by the service and its fuzz target and rejects
      malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.'
    proof:
      - behavior-tests
  - text: The real HTTP exception mapper preserves invalid-token and unavailable-key failures before identity
      lookup.
    proof:
      - oracle
      - stage-wiring-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_verification::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/jwt_verification.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/jwt-verification-*")"
        && grep -rlq "jwt_verification" tools/oracle/fuzz/corpus/helper_case/jwt-verification-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^jwt_verification::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/jwt-verification-*")"
        && grep -rlq "JWT_AUDIENCE" crates/betterlite-config/fuzz/corpus/config_yaml/jwt-verification-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/jwt_verification.rs && grep -q "jwt_verification"
        crates/betterlite-auth/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-auth/fuzz/corpus/jwt_verification)" && cargo nextest run --locked -p betterlite-auth
        --no-tests=fail -E 'test(replays_the_jwt_verification_corpus)'
    - id: stage-wiring-tests
      why: The actual server fails to invoke the verification stage or map its public failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::jwt_verification::tests::/)
        - test(/replays_the_/)'
