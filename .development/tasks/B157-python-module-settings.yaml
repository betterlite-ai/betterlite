  `_accepts_fallback_depth_kwarg_for_class` L117-L126, signature reflection; `_snapshot_exception_for_hook` L129-L151;
  `check_coroutine` L1470-L1472; Protocol classes L910-L951; `__getattr__` L10427-L10439;
  `get_utc_datetime` L5435-L5436, one line over the caller's clock.
