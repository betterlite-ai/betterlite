- >-
  litellm/__init__.py `__getattr__` L2342-L2545 and `_AGENT_EXPORTS` are not built: litellm.yaml excludes the lazy import
  registry, and the functions they reach arrive under their own names with B158 and B166.
pitfalls:
- >-
  Read each env default as written. Some settings test `== "True"`, others lower-case the value or fall back to another
  name, and a shared helper would flatten those differences.
- >-
  A mutable default shared between two names stays shared only where LiteLLM shares it. Don't make two names point to one
  list by accident.
- '`importlib.reload` rebinds the module, so read values through `vars(betterlite)` after the reload, not through a name imported earlier.'
- >-
  Dict order can differ in the model sets, and sets hold no order. Compare as sets or sorted lists, not by text.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
