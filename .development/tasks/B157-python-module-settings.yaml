id: B157
title: The betterlite Python package over the Rust core, with LiteLLM's module-level settings
description: >-
  A LiteLLM user sets things like `litellm.drop_params = True` or reads `litellm.model_cost` at module level. After
  `import betterlite as litellm`, those same names must exist with the same defaults. B5369 gave us a wheel and a native
  module, and this task fills in the settings. It's Python only: no Rust file changes.


  The source is litellm/__init__.py up to L2314, 408 module-level assignments. Put them in plain modules under
  `python/betterlite/_settings/` grouped as the source groups them (callbacks, keys, params, model sets, provider lists), and
  import each name in `python/betterlite/__init__.py` by name. Names stay rebindable, since users assign to them. Python
  files follow the 300-line limit, so several settings modules are expected.


  Import order matters. litellm/__init__.py loads `.env` first: when `LITELLM_MODE` (default "DEV") equals "DEV" it calls
  `dotenv.load_dotenv(override=_dev_env_hot_reload_enabled())`, and `_dev_env_hot_reload_enabled` is true when
  `LITELLM_DEV_ENV_HOT_RELOAD` equals "True". Settings with env defaults read the environment after that load. They include
  the `drop_params` flag, `LITELLM_MODIFY_PARAMS`, `LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES`,
  `LITELLM_ROUTE_ALL_CHAT_OPENAI_TO_RESPONSES`, `LITELLM_GEMINI_LIVE_DEFER_SETUP`,
  `LITELLM_ENABLE_ANTHROPIC_PROMPT_CACHING`, `LITELLM_ANTHROPIC_PROMPT_CACHING_TTL`, `LITELLM_MODEL_COST_MAP_URL`,
  `LITELLM_BLOG_POSTS_URL`, `LITELLM_ANTHROPIC_BETA_HEADERS_URL` and `LITELLM_AUTOROUTER_PRESETS_URL`.


  `model_cost` comes from `_native.bundled_model_cost_json()` and the provider model sets from
  `_native.provider_model_sets()`. Lists that start empty, like `callbacks`, are new list objects so one module's change
  doesn't reach another's. Plain constants keep their value: `AZURE_DEFAULT_API_VERSION` is "2025-02-01-preview",
  `WATSONX_DEFAULT_API_VERSION` is "2024-03-13", `COHERE_DEFAULT_EMBEDDING_INPUT_TYPE` is "search_document",
  `budget_exceeded_status_code` is 422 and `allowed_fails` is 3.


  Also bring over `MyLocal` (a `threading.local` whose `user` starts as "Hello World"), `_thread_context`, `identify`
  (stores `event_details["user"]` when present), `set_global_bitbucket_config` and `set_global_gitlab_config`. Skip
  `mark_litellm_import_complete()`: it sits next to the cost map fetch in litellm_core_utils/get_model_cost_map.py L207, and
  betterlite fetches nothing at import.


  The test file holds an explicit tuple of names. Each is compared with `vars(betterlite)[name] == vars(litellm)[name]`, so
  no reflection or lazy lookup is involved. Env-default cases use `monkeypatch.setenv` and `importlib.reload(betterlite)` over
  their own explicit list. `LITELLM_LOCAL_MODEL_COST_MAP=True` keeps LiteLLM on its bundled map, so both sides load the same
  data. The check commands set it.
scope:
  paths:
  - crates/betterlite-python/python/betterlite/__init__.py
  - crates/betterlite-python/python/betterlite/_settings/**
  - crates/betterlite-python/tests/test_module_settings.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L14-L30
  why: The .env load comes before any setting.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L577-L590
  why: Thread local user and identify.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L1545-L1560
  why: The two global config setters.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L1-L2314
  why: All settings. Work through this file from the top.
dod:
- text: >-
    Every name in the explicit tuple exists in betterlite and equals LiteLLM's default, and the tuple covers every module
    level assignment in litellm/__init__.py L1-L2314 not listed in `out_of_scope`.
  proof: [setting-defaults]
- text: >-
    Each env-default setting follows its env value after a reload, the same way LiteLLM parses it, including an unset value.
  proof: [env-defaults]
- text: A `.env` file in the working folder is read in DEV mode, is skipped in another mode, and overrides only under the hot reload flag.
  proof: [env-defaults]
- text: '`model_cost` and each provider model set equal LiteLLM''s, and assigning to one in a test leaves the native data alone.'
  proof: [model-data]
- text: '`identify` stores the user per thread, and the two config setters change the matching global.'
  proof: [module-helpers]
- text: After `import betterlite as litellm`, `litellm.drop_params = True` holds on the next read.
  proof: [module-helpers]
- text: Python files pass ruff and basedpyright in strict mode.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: setting-defaults
    why: A setting is missing or its default differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_module_settings.py -k setting_default
  - id: env-defaults
    why: An env name or its parsing differs after a reload.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_module_settings.py -k env_default
  - id: model-data
    why: The cost map or a provider set doesn't match the pin.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_module_settings.py -k model_data
  - id: module-helpers
    why: A helper leaks across threads or a setter misses its global.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm
      --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_module_settings.py -k module_helper
  - id: python-lint
    why: Strict typing has to hold for every settings module.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests
      && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: The cost map is the pinned text in the wheel. Nothing is fetched at import, whatever `LITELLM_LOCAL_MODEL_COST_MAP` says.
  why: A network call during import is slow and breaks offline use, and `register_model` covers runtime changes.
- what: Settings that hold a LiteLLM class instance or type alias keep the name and hold a plain value or `None`.
  why: Those classes arrive with the tasks that build them. The test file lists each such name with its reason.
- what: This task has no helper oracle cases.
  why: The test imports both packages and compares them, and that covers more than a helper call would.
