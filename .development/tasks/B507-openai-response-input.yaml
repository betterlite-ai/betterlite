id: B507
title: OpenAI Responses replay input and tool schemas
description: >-
  Add typed ResponsesInput and ResponsesTool with bounded provider extension fields, and prepare replay-safe input
  without mutating callers. Use the schema helper and an explicit lax reasoning-item representation for the source
  validation fallback. It is not permission to reject data which Python retains.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/responses/transformation.py:
  OpenAIResponsesAPIConfig.transform_responses_api_request L283-L311; OpenAIResponsesAPIConfig._prepared_input_and_tools
  L313-L328; OpenAIResponsesAPIConfig._tools_with_object_parameters L330-L341; OpenAIResponsesAPIConfig._tool_with_object_parameters
  L343-L359; OpenAIResponsesAPIConfig.remove_cache_control_flag_from_input_and_tools L361-L391; OpenAIResponsesAPIConfig._drop_foreign_tool_call_item_ids
  L393-L397; OpenAIResponsesAPIConfig._without_foreign_tool_call_item_id L400-L408; OpenAIResponsesAPIConfig._sanitized_tool_schemas_for_openai
  L410-L438; OpenAIResponsesAPIConfig._rejects_top_level_schema_combinators L441-L444; OpenAIResponsesAPIConfig._combinator_gate_model
  L447-L450; OpenAIResponsesAPIConfig._sanitized_tool_entry L453-L477; OpenAIResponsesAPIConfig._sanitized_tools
  L480-L488; OpenAIResponsesAPIConfig._validate_input_param L490-L518; OpenAIResponsesAPIConfig._handle_reasoning_item
  L520-L556.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Named case contracts: string_schema_object: Decode string tools[i].parameters with B192 safe_json_loads only when
  it yields an object; retain an existing object, None, absent parameters and nondictionary tool entries. invalid_string_schema:
  A string decoding to a nonobject or malformed JSON, or a nonstring/nonobject parameters value, raises BadRequestError
  400 with model/provider and a diagnostic naming tools[index].parameters and the original Python type. recursive_tool_namespace:
  Walk nested tools lists for schema sanitation, retain nondictionary entries and unrelated fields, and preserve
  unchanged entries; string-to-object parameters decoding applies only to the outer tool list before this recursive
  walk. foreign_tool_item_id: For OPENAI/AZURE list input remove a string id from function_call unless it starts
  fc, and from custom_tool_call unless it starts ctc; preserve call_id, nonstring ids, other item types, string
  input and other providers. cache_control_in_input_and_tools: Use B219 recursive filter to remove cache_control
  from dictionary input/tool entries; preserve nondictionaries and strings. Validate input first, remove cache markers
  second, decode schemas third, sanitize fourth, then remove foreign ids. reasoning_summary_and_null: Pydantic input
  items dump with exclude_none=True; reasoning dictionaries attempt ResponseReasoningItem validation, default summary
  to reasoning_content truncated at 100 characters plus ... only if longer. On any exception log debug and keep
  the original item except None status/content/encrypted_content; do not retain an invented summary from the failed
  attempt. gpt4_schema_combinators: For OPENAI/AZURE flatten top-level combinators and drop invalid Python regex
  when the last model component (or ft: base segment) starts gpt-4, gpt-3.5, chatgpt-4o, o1, o3 or o4. gpt5_keeps_combinators:
  Other model families, including unknown Azure deployment names, retain combinators but still drop invalid Python
  regex; other providers skip all schema sanitation. base_model_gate: Nonempty string litellm_params.model_info.base_model
  overrides the model name for the combinator gate; wrong type/empty/missing base_model falls back to model. replay_body_overlay:
  The final body contains model, prepared input and optional parameters with sanitized tools only when present;
  preserve absent versus empty tools and source duplicate-key errors if options repeat model/input.


  Implement crates/betterlite-openai/src/response_input.rs with adjacent tests under response_input/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_response_input in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function response_input_cases in betterlite-openai with these exact named cases (one per oracle file):
  string_schema_object, invalid_string_schema, recursive_tool_namespace, foreign_tool_item_id, cache_control_in_input_and_tools,
  reasoning_summary_and_null, gpt4_schema_combinators, gpt5_keeps_combinators, base_model_gate, replay_body_overlay.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_response_input* using HelperCase: kind:
  helper and the externally tagged openai_response_input variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_response_input that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_response_tool_schema consumes JSON schema strings in Responses tools in crates/betterlite-openai/src/response_input.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_response_input.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_response_input.
  The adjacent test replays_the_openai_response_input_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 235 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 285 production lines, 200 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 675 planned, 675 maximum changed lines.
