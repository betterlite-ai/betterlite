    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_response_input)"
      && grep -q 'decode_response_tool_schema' crates/betterlite-openai/fuzz/fuzz_targets/openai_response_input.rs
