    OpenAIResponsesAPIConfig._without_foreign_tool_call_item_id, OpenAIResponsesAPIConfig._sanitized_tool_schemas_for_openai,
    OpenAIResponsesAPIConfig._rejects_top_level_schema_combinators, OpenAIResponsesAPIConfig._combinator_gate_model,
    OpenAIResponsesAPIConfig._sanitized_tool_entry, OpenAIResponsesAPIConfig._sanitized_tools, OpenAIResponsesAPIConfig._validate_input_param,
    OpenAIResponsesAPIConfig._handle_reasoning_item. Other functions in this file remain with the owners listed
    below.
