  - tools/oracle/helpers/openai_response_input.py
  - tools/oracle/cases/helpers/providers/openai-response-input/**
  - tools/oracle/fuzz/corpus/helper_case/openai_response_input*
  - crates/betterlite-openai/fuzz/Cargo.toml
