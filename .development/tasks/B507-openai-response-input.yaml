  - id: case-string-schema-object
    why: The string-schema-object behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_input_cases::case_[0-9]+_string_schema_object$/)'
