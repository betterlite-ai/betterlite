pitfalls:
- 'The oracle helper for this task is pre-registered as openai_response_input in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/response_input.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_response_input.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The accepted tool-id prefixes are fc and ctc, not fc_ and ctc_, so a stricter underscore check drops IDs LiteLLM
  retains.
- Reasoning validation fallback filters the original item, not the temporary dictionary that received the generated
  summary.
- Nested namespace schemas receive recursive sanitation but not recursive JSON-string decoding.
