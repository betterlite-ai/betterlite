    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_response_input*")"
      && grep -lq 'openai_response_input' tools/oracle/fuzz/corpus/helper_case/openai_response_input* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_response_input$/)'
