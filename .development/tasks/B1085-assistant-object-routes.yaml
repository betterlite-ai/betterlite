id: B1085
title: Assistant object routes
description: >-
  Implement the complete get_assistants, create_assistant and delete_assistant handlers in
  server::api::assistant_object_routes. Register GET and POST /v1/assistants and /assistants, and DELETE
  /v1/assistants/{assistant_id:path} and /assistants/{assistant_id:path}, exactly once. The delete identifier
  is a catch-all path parameter; the other assistant resource routes do not have that converter.

  Each handler starts with data={}, calls B1103 authenticated request preparation, then B2489's assistant
  dispatcher. Only POST decodes the body, through B2489 decode_assistant_body; GET reads but ignores it,
  and DELETE does not read it. Await the real SDK result, schedule B012 update_request_status(success),
  and use B004 get_custom_headers with the request and complete hidden params. There is no success-hook
  invocation here. All failures call B012 post_call_failure_hook with the current data before conversion.
  Keep these legacy route conversions separate from B2400's newer endpoint error helper.

  The decorator-inclusive range has 227 nonblank/non-comment lines. Budget 175 handler/wiring lines,
  170 behavior tests, 230 HTTP fixtures, 40 callback fixtures and 25 existing-decoder seeds, 640 total.
  Cases boot both proxies with a non-secret master key, assistant_settings pointing at the mock provider,
  no enterprise package and SDK retries disabled. They compare real client responses and provider captures;
  the callback recorder observes production hooks without calling FastAPI functions as helper cases.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/api/assistant_object_routes.rs
  - crates/betterlite-server/src/api/assistant_object_routes/**
  - crates/betterlite-server/fuzz/corpus/assistant_body/object-*
  - tools/oracle/cases/api/assistant-object-routes/**
  - tools/oracle/fixtures/assistant-object-routes/**
  - tools/oracle/helpers/b1085.py
  - tools/oracle/helpers/b1085/**
  - tools/oracle/src/helpers/server/b1085.rs
  - tools/oracle/src/helpers/server/b1085/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L13056-L13322
  why: All three whole handlers, their six decorators, and the list-versus-write exception-code difference.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1892-L1910
  why: The shared exception handler casts ProxyException.code to int; the literal string None is not a valid status.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2049-L2079
  why: Failure during exception rendering produces the sanitized internal_server_error envelope, without param or code.
dod:
- text: >-
    assistant_object_aliases sends all six method/path combinations with valid auth. Create sends
    {model:gpt-4o-mini,name:helper,instructions:be brief,tools:[{type:code_interpreter}],metadata:{team:demo}};
    mock assistant asst_a returns HTTP 200 unchanged. GET returns the mocked object=list,data=[asst_a],
    has_more=false page; DELETE asst_a returns {id:asst_a,object:assistant.deleted,deleted:true},200.
    DELETE /assistants/folder/asst_a reaches the SDK with the full folder/asst_a identifier instead of a
    router 404. Assert captured paths using B1130's SDK path handling, not a second encoder in this handler.
  proof: [object-tests, oracle]
- text: >-
    assistant_list_ignores_pagination sends GET ?limit=1&order=asc&after=asst_old&before=asst_new plus a
    valid JSON body containing those fields and custom_llm_provider=azure. None becomes an SDK list argument;
    configured OpenAI still receives the default list request. DELETE body {assistant_id:other} likewise
    cannot override its path id. Query api-version remains B1103's separate request-setup behavior.
  proof: [object-tests, oracle]
- text: >-
    assistant_body_failure sends a truncated { and an empty POST body under valid auth. Strict decoding
    fails, makes zero provider requests, calls the failure hook with the pre-decode {}, and responds 500,
    type="None",param="None",code="500". Reference messages are respectively "unexpected end of data:
    line 1 column 2 (char 1)" and "Input is a zero-length, empty document: line 1 column 1 (char 0)".
    Valid [] or null is not coerced to {}; request preparation fails with 500 and the same type/param/code.
    Capture its ordinary exception string; B011's allowed wording difference does not ignore envelope fields.
    Commit these bytes and duplicate model keys to the shared assistant_body corpus.
  proof: [object-tests, oracle, body-corpus]
- text: >-
    assistant_router_and_config_errors runs each method with no llm_router and gets 500,{error:{message:
    "{'error': 'No models configured on proxy'}",type:"None",param:"None",code:"500"}}, with no provider
    traffic. With a router but no assistant_settings/provider, preserve B2489's multiline required-provider
    message and the same 500/type/param/code. A plain exception's absent status defaults to 500; an injected
    HTTPException(418,detail={reason:teapot}) gives 418,type="None",param="None",code="418",message=
    "{'reason': 'teapot'}". Failure logging emits the operation-specific error and debug traceback once.
  proof: [object-tests, oracle]
- text: >-
    assistant_list_and_write_error_codes supplies provider HTTP 404 with {error:{message:missing assistant,
    type:invalid_request_error,param:assistant_id,code:missing_assistant}}. Async SDK mapping has null
    type/param/code. GET uses status_code and returns 404,type=null,param=null,code="404"; separately stored
    openai_code is not emitted. POST and DELETE pass null code into ProxyException, whose code becomes
    "None"; int("None") fails in the shared handler. Expect HTTP 500 with exactly {error:{message:
    "Internal server error",type:internal_server_error}}, with param/code absent, rather than a fabricated
    404. A callback exception with numeric code=409,status_code=502 instead yields 409 on writes and 502
    on GET; an absent code uses status_code. Preserve explicit type/param null versus absent -> "None".
  proof: [object-tests, oracle]
- text: >-
    assistant_headers_and_hooks verifies hidden model_id=deployment_a,cache_key=cache_a,api_base=
    https://provider.test/v1?token=secret yield x-litellm-model-id=deployment_a,x-litellm-cache-key=cache_a,
    x-litellm-model-api-base=https://provider.test/v1 through B004; hidden null/empty values omit these
    headers. Request call id and allowed_model_region reach that same helper, and x-litellm-version is
    present. With call id absent schedule status(success,""); with call_a schedule status(success,call_a).
    These success paths do not call post_call_success_hook; failures call only the failure hook before
    conversion. Use server-owned task tracking for the scheduled status job and drain on shutdown.
  proof: [object-tests, oracle]
- text: >-
    assistant_object_auth denies missing and invalid credentials on all six aliases before provider HTTP.
    Compare B003/B732's 401,authentication_error,param=null,code="401" envelope, and successful master-key
    requests use the exact same endpoint fixture. Auth policy and its message redaction remain those owners.
  proof: [object-tests, oracle]
checks:
  optional: []
  commands:
  - id: object-tests
    why: object aliases, ignored inputs or legacy error conversion are absent from the production routes
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::assistant_object_routes::tests::/) - test(/::replays_corpus$/)'
  - id: body-corpus
    why: object-body regressions are not replayed through the shared strict decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/assistant_body/object-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::assistant_dispatch::tests::replays_corpus$/)'
