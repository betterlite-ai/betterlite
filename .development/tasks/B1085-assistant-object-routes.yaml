deviations: []
out_of_scope:
- B2489 owns assistant_settings, SDK dispatch and strict JSON decoding; B1055/B1130 own provider behavior reached through it.
- B1103 supplies the complete add_litellm_data_to_request interface, B004 the custom-header projection, B012 hook/status effects and B003 shared final error rendering.
- B1086 owns thread/message handlers, B089 run handling and its stream generator, B083 audio routes and B1125 realtime. All other proxy_server.py functions retain B124's proxy bootstrap/support ownership and its existing extracted task owners.
pitfalls:
- GET assistants discards both its JSON body and limit/order/cursor query arguments.
- DELETE uses assistant_id:path, so replacing it with a single-segment extractor loses accepted identifiers.
- A null SDK code on POST or DELETE produces a second exception during status conversion and the sanitized 500 envelope.
review_level: security
budget:
  max_changed_lines: 700
  max_new_expects: 0
