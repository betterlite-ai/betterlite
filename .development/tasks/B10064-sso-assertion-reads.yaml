deviations: []
out_of_scope:
  - "SSOAssertionCache, persist_sso_identity_assertion, ema_assertion_retention_enabled, retain_sso_identity_assertion_for_ema, the DbSSOAssertionStore struct and the mcp_sso_assertion_cache section: B10011."
  - "_assertion_table, _mcp_server_table, _SSOAssertionTable and _MCPServerTable: B10010's AssertionRows replaces them. rotate_sso_identity_assertions_master_key: B10010."
  - "SSOIdentityAssertion, _IdTokenClaims, _StoredAssertionPayload, assertion_from_sso_login, assertion_expired and the payload encode and decode, with their fuzz target and login and expiry cases: B10003."
  - "decrypt_value_helper (the StoredCipher): B1600."
  - "Reading through SsoAssertionStore in the id_jag credential path and judging expiry there: B4667. RefreshingSSOAssertionStore and renewing a stale assertion: B4664."
  - "Building the store with its rows and cipher and handing it to the credential resolver: B8622."
  - "idp_token_exchange.py, the other half of what was B4663: B4663."
pitfalls:
  - "fetch reads seen_epoch after the cache miss and before the row read; reading it after the row read lets a login slip between the two and the old assertion comes back for a full TTL."
  - "Only a found assertion is cached, so a user who has no row yet gets a row read on every fetch and their first login takes effect at once."
  - "An expired assertion still comes back from fetch: the id_jag path (B4667) and the renewing store (B4664) decide what is stale, and a filter here would hide stale tokens from the refresher."
  - "fetch and fetch_uncached return AssertionStoreUnavailable for a row read failure; only B10011's retain swallows errors, so don't add a catch-all here."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
