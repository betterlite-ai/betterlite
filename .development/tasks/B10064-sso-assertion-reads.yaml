    - crates/betterlite-mcp/src/sso_assertions/read.rs
    - crates/betterlite-mcp/src/sso_assertions/read/**
    - tools/oracle/cases/helpers/sso-assertion-reads/**
    - tools/oracle/fuzz/corpus/helper_case/sso-assertion-reads-*
    - tools/oracle/helpers/b10064.py
    - tools/oracle/helpers/b10064/**
    - tools/oracle/src/helpers/mcp/b10064.rs
    - tools/oracle/src/helpers/mcp/b10064/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_store.py#L224-L314
    why: Owned. The row read, the cached fetch, AssertionStoreUnavailable, the store protocol and DbSSOAssertionStore's two methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/resolver.py#L234-L248
    why: Call site. The id_jag arm reads through fetch and turns AssertionStoreUnavailable into a 503, in B4667's code.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_refresher.py#L461-L470
    why: Call site. The refresher reads through fetch_uncached, so that method stays public.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/unit/proxy/_experimental/mcp_server/outbound_credentials/test_sso_assertion_store.py#L57-L70
    why: LiteLLM's own Prisma double; B10010 wrote the shared one the adapter imports.
dod:
  - text: A stored payload with only some fields, and one whose expires_at text has no offset, reads back through the store with the same fields as in LiteLLM.
    proof: [read-tests, oracle, helper-python]
  - text: A row LiteLLM encrypted opens to the same fields here.
    proof: [oracle, helper-python]
  - text: The token and refresh token text appear in no Debug output, log line or error text of fetch or fetch_uncached.
    proof: [read-tests]
  - text: fetch skips the row read on a hit, caches a found assertion, reads the row again after an absent result, and returns an expired assertion unjudged.
    proof: [read-tests, oracle, helper-python]
  - text: An invalidate that lands during a fetch's row read stops that fetch from caching the old assertion.
    proof: [read-tests, oracle, helper-python]
  - text: fetch_uncached reads the row every time and leaves the cache as it was.
    proof: [read-tests, oracle, helper-python]
  - text: A row that won't decrypt reads as absent, and a payload that won't parse logs the fixed warning and reads as absent; neither reaches the caller as an error.
    proof: [read-tests, oracle, helper-python]
  - text: A row read failure is AssertionStoreUnavailable from fetch and fetch_uncached, and no database at all reads as absent.
    proof: [read-tests, oracle, helper-python]
  - text: The b10064 adapter passes the strict Python checks and a new helper seed names the operation.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: read-tests
      why: The fetch and fetch_uncached tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^sso_assertions::read::tests::/)'
    - id: helper-python
      why: The b10064 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10064.py tools/oracle/helpers/b10064)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10064 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/sso-assertion-reads-*")" &&
        grep -lE 'b10064"?:' tools/oracle/fuzz/corpus/helper_case/sso-assertion-reads-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-mcp --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
