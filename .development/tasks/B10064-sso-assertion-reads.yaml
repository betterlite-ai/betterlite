id: B10064
title: SSO assertion reads and the assertion store port
description: >-
  An MCP server with auth_type oauth2_id_jag spends the IdP id_token a user's SSO login kept as an RFC 8693 subject_token (LiteLLM calls this EMA egress). The id_jag credential path (B4667) and the renewing store (B4664) read that token through one port, LiteLLM's SSOAssertionStore protocol. This task builds the read side of sso_assertion_store.py: the port, its outage error, and DbSSOAssertionStore's fetch and fetch_uncached. The rest of the file is on main already: B10003 the record and its payload, B10010 the rows and the master-key rotation, and B10011 the cache, the store struct with persist, the retention gate and retain. B4663 kept only the IdP exchange, so the credential path waits on this read side alone.


  Layout. betterlite-mcp, submodule sso_assertions::read: crates/betterlite-mcp/src/sso_assertions/read.rs, with its tests in read/tests.rs. The file is an empty stub that sso_assertions.rs declares. B10003's assertion module (SsoIdentityAssertion, decode_payload), B10010's sso_assertion_rows in betterlite-db (AssertionRows, MemoryAssertionRows and the decrypt field name and policy), B1600's DbCipher and B10011's cache and store modules are used as they are. Names stop at 30 characters, so fetch_sso_identity_assertion becomes DbSsoAssertionStore::fetch and _read_assertion_from_db becomes fetch_uncached.


  The port. trait SsoAssertionStore has fn fetch(&self, user_id: &str) -> impl Future<Output = Result<Option<SsoIdentityAssertion>, AssertionStoreUnavailable>> + Send, the same shape as AssertionRows. Ok(None) means the user never signed in through SSO, or what is stored can't be used; AssertionStoreUnavailable means the store could not answer. AssertionStoreUnavailable keeps its cause as #[source] Box<dyn Error + Send + Sync>, so B4664 can raise it from an IdP failure too. The store is B10011's DbSsoAssertionStore<R: AssertionRows> with its pub fields rows, cipher, cache and config_declares_id_jag; this module adds an inherent impl block with fetch_uncached and implements SsoAssertionStore for it. Do not move or copy the struct.


  fetch returns a cache hit, otherwise reads the cache epoch, calls fetch_uncached and caches a found assertion with set_if_unchanged and that epoch. fetch_uncached never touches the cache: rows None (LiteLLM's prisma_client None) or no row is None, the row is decrypted with B10010's field name and policy, a failed decrypt is None, and a payload that B10003's decode_payload refuses logs the warning "Stored SSO identity assertion for user_id=%s could not be parsed; treating as absent." and is None. A row read failure is AssertionStoreUnavailable from both methods. Neither method judges expiry.


  This task parses no outside bytes of its own: the payload text from a database row goes through B10003's decode_payload, and B10003's sso_assertion_decode fuzz target covers it.


  Oracle. Helper cases on the b10064 operation; no route reaches this code yet. The Python adapter reuses B10010's Prisma double (tools/oracle/helpers/b10010/prisma_double.py), fixes LITELLM_SALT_KEY, points litellm.proxy.proxy_server.prisma_client at the double as LiteLLM's test_sso_assertion_store.py does, and calls the pinned DbSSOAssertionStore methods; the Rust side takes the same steps over B10010's MemoryAssertionRows. A case lists its steps (fetch, fetch_uncached, and B10011's persist when a row must exist first). Each step reports the decrypted fields it got and the double's read and write counts; ciphertext never appears, since every encryption draws a fresh nonce. exp values in cases are whole seconds, and no case waits for a cache entry to expire, because LiteLLM's cache takes no clock here.
