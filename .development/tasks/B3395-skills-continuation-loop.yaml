dod:
  - text: post_call_success returns None when neither litellm_metadata nor metadata enables code execution, and reads the flag from metadata when litellm_metadata has it false or unset.
    proof: [detection-gate]
  - text: Skill files are taken from litellm_metadata unless that map is absent or empty, then from metadata; inner maps are merged in order with later paths winning; an empty merge returns None.
    proof: [detection-gate]
  - text: No tool calls, or only tool calls whose names are neither "litellm_code_execution" nor start with "litellm_skill_", returns None and never calls the continuation.
    proof: [detection-tools]
  - text: Malformed OpenAI tool-call arguments JSON comes back as SkillsLoopError::ToolCalls, not as None.
    proof: [detection-tools]
  - text: A litellm_code_execution call runs execute_code with input["code"] (empty when missing), a litellm_skill_ call runs execute_skill_tool, and any other name gets the result text "Tool '<name>' not handled".
    proof: [loop-dispatch]
  - text: Each round appends the assistant message with converted content blocks, then a user message of tool_result blocks with tool_use_id and content, and the continuation receives the model, the whole message list so far, the unchanged tools and max_tokens (4096 when the request has none).
    proof: [loop-messages]
  - text: Content blocks convert as specified for Dict responses (objects kept, other values become text blocks) and Object responses (type, id, name, input, text), and ObjectResponse carries stop_reason.
    proof: [loop-messages]
  - text: The loop returns the current response with generated files attached when stop_reason is not "tool_use" or there are no tool calls, and returns after exactly max_iterations rounds with the max-iterations warning (0 rounds when max_iterations is 0).
    proof: [loop-termination]
  - text: A continuation that returns None or an error ends the loop with the original first response plus the generated files, and the error is not raised.
    proof: [loop-failure]
  - text: B3394's hook tests still pass after the two added fields.
    proof: [skills-regression]
  - text: The loop and detection match the pinned hook on scripted responses, sandbox outcomes and continuation results.
    proof: [oracle, helper-python, helper-case-corpus, new-oracle-cases]
  - text: Every mutant in the continuation module is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: detection-gate
      why: the enabled flag, the metadata fallback or the skill file merge is wrong or untested
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::continuation::tests::detection_gate/)'
    - id: detection-tools
      why: executable tool names, the no-tool-calls exit or the argument error path is wrong or untested
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::continuation::tests::detection_tools/)'
    - id: loop-dispatch
      why: tool calls are not routed to execute_code, execute_skill_tool or the not-handled text
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::continuation::tests::loop_dispatch/)'
    - id: loop-messages
      why: the assistant and tool_result messages, the content block conversion or the continuation request are wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::continuation::tests::loop_messages/)'
    - id: loop-termination
      why: the finished exit, the iteration cap or the file attachment at exit is wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::continuation::tests::loop_termination/)'
    - id: loop-failure
      why: a failed or empty continuation does not return the original response with the files
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::continuation::tests::loop_failure/)'
    - id: skills-regression
      why: the added ObjectResponse and ContentBlock fields broke B3394's tests
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::/) - test(/^api::skills::continuation::/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3395)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3395 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3395/pyrightconfig.json
    - id: helper-case-corpus
      why: the added helper cases have no seed in the helper corpus or the shared parser rejects them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/skills_continuation-*")" &&
        grep -lE '^[[:space:]]+b3395:' tools/oracle/fuzz/corpus/helper_case/skills_continuation-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: new-oracle-cases
      why: no new oracle case exists on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/skills-continuation)"
