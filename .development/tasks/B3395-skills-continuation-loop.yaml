  - tools/oracle/cases/helpers/skills-continuation/continuation-none.yaml
deviations:
  - what: A tool call with no name is treated as the name "" (not executable in detection, "Tool '' not handled" in the loop).
    why: LiteLLM calls .startswith on None and raises AttributeError; a typed Option<String> has no such crash and the request would only fail on a model that sent a nameless tool_use.
  - what: A non-object entry in a Dict response's content array becomes a text block holding the entry as JSON text.
    why: LiteLLM writes Python's str(entry), which is repr text that docs/compatibility.md excludes; real Messages responses only hold objects here.
  - what: input["code"] that is not a JSON string is treated as "".
    why: LiteLLM would pass the raw value to the sandbox; the typed executor takes a string, and the model's tool schema declares code as a string.
  - what: The loop takes a typed response, so LiteLLM's "response is None" early return has no counterpart.
    why: A missing response cannot be built in Rust; the caller decides whether a hook runs at all.
  - what: The Messages call is the injected MessagesContinuation trait, not a direct call into B1134's dispatch.
    why: It keeps this task independent of B1134's types and lets tests script the model; the composing task supplies the real adapter.
out_of_scope:
  - "async_pre_call_hook, _process_for_messages_api and _fetch_skill_from_db (main.py L118-L254, L325-L348) stay with B095, the umbrella that wires the hook."
  - "_process_non_anthropic_model, _is_anthropic_model, _execute_code_loop, _execute_code_tool, _first_choice and the _Chat* protocols (main.py L47-L86, L256-L323, L350-L369, L715-L876) have no caller at the pin: only async_post_call_success_deployment_hook runs, and it calls the Messages loop. Their cases are dropped too."
  - "_extract_tool_calls, _execute_code, _execute_skill_tool and _attach_files_to_response are B3394's; call them, do not copy them."
  - "SkillsSandboxExecutor (the real sandbox) is B1506; this task only uses the SkillsSandbox trait that B3394 defined."
  - "The Messages API call itself, acreate, is B1134. The adapter that implements MessagesContinuation over it, and the registration of the hook in the callback list, belong to B095."
  - "litellm.utils.async_post_call_success_deployment_hook, the loop over callbacks that logs a failing hook and moves on, belongs to the callback registry tasks."
pitfalls:
  - The enabled flag and the skill files each fall back from litellm_metadata to metadata on a falsy value, so an empty `_skill_files` map in litellm_metadata still reads metadata's.
  - Both the stop test and the empty-tool-call test end the loop, but only the exact string "tool_use" continues it; "max_tokens" with tool calls present also stops.
  - On a failed or empty continuation the loop returns the first response passed in, not the latest one, so tool results the model already saw are dropped from what the client gets.
  - Each continuation call gets only model, messages, tools and max_tokens; system, temperature, tool_choice and the injected container are not forwarded.
  - The assistant message is pushed before the stop test, so a final round also adds one message that no continuation ever sees.
  - A skill tool name such as "litellm_skill_abc" matches by prefix, while the code tool matches by equality; "litellm_code_execution_x" is neither.
  - Generated files accumulate across all rounds and are attached once, at whichever exit is taken; the attach function leaves the response alone when the list is empty.
  - max_tokens defaults to the literal 4096 in this loop, independent of the DEFAULT_MAX_TOKENS setting.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 2
