id: B3395
title: Skill tool detection and Messages continuation loop
description: >-
  Build the post-call half of LiteLLM's SkillsInjectionHook in betterlite-core: decide whether a finished model response
  needs the skill code loop, and if so run the loop that executes the model's tool calls in the sandbox, feeds the
  results back to the model through the Messages API, and returns the last response with the generated files attached.
  B3394 already built the hook struct, settings, tool-call extraction, execute_code, execute_skill_tool and
  attach_files_to_response under crates/betterlite-core/src/api/skills/hook/. Read those files first and reuse them as they
  are. This task adds a sibling module, crates/betterlite-core/src/api/skills/continuation.rs with its folder. The
  architect's skeleton creates the empty file and declares it in skills.rs, so do not touch skills.rs. Write
  `impl<PromptHandler: Sync, Sandbox: SkillsSandbox + Sync> SkillsInjectionHook<PromptHandler, Sandbox>` blocks in the new
  module. Use tracing for the log lines below with LiteLLM's wording and the "SkillsInjectionHook: " prefix.

  Request data. The loop reads the request dict that the pre-call hook (B095) built. Model it as a typed record in
  continuation/request.rs: `SkillsRequestData { model: String, messages: Vec<Value>, tools: Vec<Value>, max_tokens:
  Option<u64>, litellm_metadata: Option<RequestMetadata>, metadata: Option<RequestMetadata> }` and `RequestMetadata {
  code_execution_enabled: bool, skill_files: IndexMap<String, SkillFiles> }` (the keys `_litellm_code_execution_enabled` and
  `_skill_files`, keyed by skill id). Derive Debug, Clone, Default. A missing model is "", missing messages and tools are
  empty, and a missing max_tokens means 4096 (LiteLLM's literal default in the loop; it does not read DEFAULT_MAX_TOKENS).
  `Value` is allowed here for message and tool bodies: the module opens with one `#![expect(clippy::disallowed_types, reason =
  "...")]` like hook.rs.

  Detection: `pub async fn post_call_success<C: MessagesContinuation + Sync>(&self, request_data: &SkillsRequestData,
  response: HookResponse, continuation: &C) -> Result<Option<HookResponse>, SkillsLoopError>` mirrors
  async_post_call_success_deployment_hook. In order:
  1. Enabled means litellm_metadata.code_execution_enabled is true, else metadata.code_execution_enabled is true. Not enabled
  returns Ok(None).
  2. Skill files come from litellm_metadata.skill_files, and when that map is absent or empty from metadata.skill_files
  (LiteLLM's `a or b` on dicts). Merge the inner maps of the chosen outer map, in order, into one SkillFiles; a later path
  replaces an earlier one with the same path. An empty merge logs the warning "SkillsInjectionHook: No skill files found,
  cannot execute code" and returns Ok(None).
  3. Call B3394's extract_tool_calls on the response. Its ToolCallError (malformed OpenAI arguments JSON) is not caught:
  return it as SkillsLoopError::ToolCalls. An empty list returns Ok(None).
  4. A tool call is executable when its name equals "litellm_code_execution" (LiteLLMInternalTools.CODE_EXECUTION) or starts
  with LITELLM_SKILL_ID_PREFIX ("litellm_skill_", already a constant in hook/settings.rs). If no call is executable, return
  Ok(None). Otherwise log the debug line "SkillsInjectionHook: Detected tool call, starting execution loop" and return
  Ok(Some(...)) from the loop.

  Loop: `pub async fn execute_messages_loop<C: MessagesContinuation + Sync>(&self, data: &SkillsRequestData, response:
  HookResponse, skill_files: &SkillFiles, continuation: &C) -> Result<HookResponse, SkillsLoopError>` mirrors
  _execute_code_loop_messages_api. Setup: messages is a copy of data.messages, tools is data.tools, max_tokens is
  data.max_tokens or 4096, generated_files starts empty, current_response starts as the response. The sandbox is
  `self.executor` (the composing code builds it from settings.sandbox_timeout; the loop never reads that field). Repeat up to
  `self.settings.max_iterations` times (a value of 0 skips straight to the max-iterations exit); `iteration` counts from 0:
  1. extract_tool_calls(current_response) (errors propagate). Read stop_reason: the "stop_reason" string of a Dict response,
  the stop_reason field of an Object response.
  2. Build the assistant message {"role": "assistant", "content": [blocks]} and push it to messages. Blocks come from the
  response content: a Dict response uses its "content" array (absent or null means empty); an Object response uses
  ObjectResponse.content. A JSON object block in a Dict is kept as it is. A non-object value in a Dict array becomes
  {"type": "text", "text": <the value as JSON text>}. An Object block becomes the JSON object model_dump gives: "type" (kind),
  "id" and "name" when present, "input", and "text" when present.
  3. Finished test: stop_reason is not exactly "tool_use", or the tool-call list is empty. Then log "SkillsInjectionHook: Loop
  completed after {iteration + 1} iterations, {file count} files generated" at debug and return attach_files_to_response(
  current_response, generated_files).
  4. For each tool call in order, with name = its name or "" and id = its id (an absent id is sent as JSON null): name equal to
  "litellm_code_execution" runs `self.execute_code(code, skill_files, &mut generated_files)` where code is the string at
  input["code"], else ""; a name starting with the skill prefix runs `self.execute_skill_tool(name, input, skill_files, &mut
  generated_files)`; any other name gives the text "Tool '{name}' not handled". Each result becomes {"type": "tool_result",
  "tool_use_id": id, "content": result_text}.
  5. Push {"role": "user", "content": [tool results]} to messages. Log "SkillsInjectionHook: Making LLM call iteration
  {iteration + 2}" at debug. Call `continuation.create` with ContinuationRequest { model: data.model, messages: a clone of
  messages, tools: data.tools, max_tokens }. Ok(Some(next)) becomes current_response. Ok(None) logs the error "SkillsInjectionHook:
  LLM call returned None" and returns attach_files_to_response of the ORIGINAL response (the one passed in, not
  current_response) with all files so far. Err(e) logs "SkillsInjectionHook: LLM call failed: {e}" and does the same. The
  continuation error is never raised.
  After the last iteration, log the warning "SkillsInjectionHook: Max iterations ({n}) reached" and return
  attach_files_to_response(current_response, generated_files).

  The continuation seam. LiteLLM calls `litellm.anthropic.acreate(model=, messages=, tools=, max_tokens=)`, which is
  B1134's Messages dispatch. Define the trait in continuation/messages.rs instead of depending on B1134:

      pub trait MessagesContinuation {
          type Error: Display;
          fn create(&self, request: &ContinuationRequest) -> impl Future<Output = Result<Option<HookResponse>, Self::Error>> + Send;
      }

  ContinuationRequest holds model: String, messages: Vec<Value>, tools: Vec<Value>, max_tokens: u64. Follow the style of
  the SkillsSandbox trait in hook/execution.rs (impl Future, no async-trait). Only these four fields reach the Messages
  call: system, temperature, tool_choice and every other request field are dropped on continuation, as in LiteLLM. Tests
  use a scripted fake that records each ContinuationRequest and returns queued results.

  Changes to B3394's files, kept small. LiteLLM reads `stop_reason` and the full content of typed responses, and B3394's
  ObjectResponse has no stop_reason and ContentBlock has no text. Add `pub stop_reason: Option<String>` to ObjectResponse and
  `pub text: Option<String>` to ContentBlock in hook/response.rs, and add the missing field to every struct literal in
  crates/betterlite-core/src/api/skills/tests/** (None). Change nothing else there. SkillsLoopError lives in
  continuation/error.rs as a thiserror enum with the one variant ToolCalls(#[from] ToolCallError).

  Size. The two owned Python spans are about 145 non-blank, non-comment lines, so this is one task. Estimated 330 lines of
  Rust, 360 of tests, and the oracle adapters the skeleton adds. No byte parser is involved (the tool-call JSON parse is
  B3394's), so there is no fuzz target; the helper seed corpus only replays the oracle case shape.
