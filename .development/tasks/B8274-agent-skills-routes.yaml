id: B8274
title: Serve the public agent skills index and archive routes
description: >-
  Register three unauthenticated GET routes in betterlite-server, from LiteLLM's discovery_endpoints/agent_skills_endpoints.py: `/.well-known/agent-skills/index.json`, its hidden alias `/.well-known/skills/index.json` (same handler, left out of the OpenAPI document) and `/v1/skills/{skill_id}/archive`. Code in `crates/betterlite-server/src/agent_skills_routes.rs` and its folder; `pub fn routes()` is built like the sibling route modules and B8648 mounts it. Discovery clients (`npx skills add <proxy url>`) send no key, so none of the three routes has the key check.

  Off switch. The route state takes `index_enabled: bool` from the config key `litellm_settings.public_skills_index` (default false, LiteLLM's `litellm.public_skills_index`), read by this task's config section public_skills_index. When it is not true, all three routes answer 404 `{"detail": "Not Found"}` before anything else runs, the stored skills are not read, and no archive is built.

  Reads. The state also takes the stored-skill reader from B3212 (a list of up to 1000 skills, newest first, and a get by id that gives `None` for an unknown id) and B3210's `build_skill_archive` (it gives the archive `content`, `digest`, `declared_name`, `declared_description`, or nothing for a bad upload). Both are called through constructor-given traits so the tests use fakes. Building an archive is blocking work, so run it with `spawn_blocking`. A stored skill is read as: `skill_id`, `display_title` (optional), `description` (optional), `file_content` (optional bytes), `updated_at` (optional datetime).

  Archive cache. Keep a cache of built archives with at most 128 entries and a one-hour time to live, built on B2226's local TTL cache. The key is `<skill_id>:<updated_at in ISO format>`; a skill with no `updated_at` is never cached, and an archive larger than 524288 bytes is built but not cached. `_archive_for(skill)`: no `file_content` gives no archive; a cache hit returns the cached archive; otherwise build it; if the build gives nothing, log at warning "Agent Skills index: skipping skill <id>, its upload is not a zip holding SKILL.md at the root of a single top-level folder" and give no archive.

  Index route. After the off switch, list the stored skills, walk them in reverse order (oldest first), build or fetch each archive, and keep the skills that have one. Name each kept skill: take the first non-empty slug of `archive.declared_name`, `display_title`, `skill_id`, else `skill`. A slug is the lowercase text with every run of characters outside `[a-z0-9]` replaced by one `-`, then `-` trimmed from both ends, cut to 64 characters, trailing `-` trimmed again; an empty result is no slug. Make the names unique: group equal names, keep the order of the skills inside a group, and give the first of a group its name and the n-th (n from 2) the name cut to `64 - len(suffix)` characters, trailing `-` trimmed, plus the suffix `-<n>`. Description: the first of `archive.declared_description`, `skill.description`, `skill.display_title` that is not empty after trimming, trimmed; if none, the unique name. Cut it to 1024 characters. The entry is `{name, type: "archive", description, url, digest}` with `type` always `archive`, `digest` from the archive and `url` from B7323's custom URL builder with route `v1/skills/<skill_id>/archive` and this request's base URL. The body is `{"$schema": "https://schemas.agentskills.io/discovery/0.2.0/schema.json", "skills": [entries]}`, the `$schema` key first.

  Archive route. After the off switch, get the skill by `skill_id`; a lookup error from B3212 for a missing skill counts as no skill. With no skill or no archive, answer 404 `{"detail": "No installable skill archive for: <skill_id>"}`. Otherwise answer 200 with the archive bytes, `Content-Type: application/zip` and `Content-Disposition: attachment; filename="<skill_id>.zip"`.
