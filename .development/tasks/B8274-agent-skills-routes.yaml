dod:
  - text: The three routes exist for GET only, need no key, and the alias is left out of the OpenAPI document.
    proof: [route-tests]
  - text: With public_skills_index off (the default) all three answer 404 "Not Found" without reading any skill.
    proof: [route-tests]
  - text: The index lists installable skills oldest first, skips skills with no file or a bad archive, and carries name, type, description, url and digest with the $schema key first.
    proof: [index-tests]
  - text: Names are slugs of at most 64 characters, fall back through declared name, title and id to "skill", and duplicates get -2, -3 suffixes within the 64-character limit.
    proof: [name-tests]
  - text: Descriptions follow the declared, stored, title, name order, are trimmed and cut at 1024 characters.
    proof: [name-tests]
  - text: The archive route returns the zip with the attachment header, and gives 404 with the skill id for an unknown skill or an unusable upload.
    proof: [archive-tests]
  - text: Archives are cached by id and updated_at for an hour, up to 128 entries and 512 KiB each, and a skill with no updated_at is rebuilt every time.
    proof: [cache-tests]
  - text: The config section public_skills_index (crates/betterlite-config/src/sections/public_skills_index.rs, under litellm_settings) adds the bool field public_skills_index, true only when litellm_settings.public_skills_index is the YAML boolean true and false when the key is absent or holds any other value; its tests load a config with the key set to true and one without it.
    proof: [config-tests]
  - text: The handlers are tested with tower's oneshot over routes() and fake ports; B8648 mounts them outside the key check and proves the HTTP answers with the oracle cases moved there.
    proof: [route-tests, archive-tests]
checks:
  optional: [mutants]
  commands:
    - id: route-tests
      why: a route, its method, the open access or the off switch is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_skills_routes::tests::route_/)'
    - id: index-tests
      why: the index order, filter or entry shape is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_skills_routes::tests::index_/)'
    - id: name-tests
      why: slug, unique name or description rules are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_skills_routes::tests::name_/)'
    - id: archive-tests
      why: the archive download or its 404 is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_skills_routes::tests::archive_/)'
    - id: cache-tests
      why: the archive cache key or limits are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_skills_routes::tests::cache_/)'
    - id: config-tests
      why: the public_skills_index config field is missing or a config with or without the key reads wrongly
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::public_skills_index::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "SkillArchive and build_skill_archive: B3210. Stored skill reads and owner checks: B3212. The TTL cache itself: B2226. get_custom_url: B7323."
  - "Creating, listing and deleting skills through /v1/skills: other entries."
  - "Mounting routes() and handing config.sections.public_skills_index to the route state: B8648."
pitfalls:
  - "The off switch runs before the skill lookup, so a disabled proxy answers 404 even for an id that does not exist, with the plain Not Found body, not the archive message."
  - "The index walks the stored list in reverse, so the oldest skill comes first and wins the plain name; the newest gets the -2 suffix."
  - "Duplicate numbering follows the position in the sorted-by-name group, which keeps the original order inside a group because the sort is stable."
  - "The suffix cut uses the length of the suffix, so a 64-character name plus -2 becomes 62 characters plus -2."
  - "A skill whose build fails is logged at warning on every index call unless it was cached; failures are not cached."
  - "The archive route needs the same enabled check as the index, since it serves every stored skill to anyone."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
