  - text: >-
      Cases org_lookup_value_error, direct_teams_bypass_cache, unexpected_lookup_error_propagates,
      admin_view_unrestricted, org_own_union, org_other_user_intersection, foreign_org_403,
      regular_other_user_401, regular_default_self, legacy_explicit_self, legacy_roster_filter,
      exact_and_prefix_search, insensitive_alias, search_and_scope_intersection, explicit_org_wins,
      missing_user_404, deleted_members_has, empty_membership_skips_query, nonmember_team_404,
      access_groups_deduplicated_missing_omitted, groups_without_db_empty, batched_key_counts,
      empty_page_no_count_query, missing_count_zero, model_dump_fallback, nonlist_roster_empty,
      deleted_row_projection and live_counts exercise each projection and query branch.
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_list_query::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/team_list_query.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/team-list-query-*")"
        && grep -rlq "team_list_query" tools/oracle/fuzz/corpus/helper_case/team-list-query-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
