id: B1209
title: Team list scope and response query preparation
description: >-
  Build the visibility/query projections consumed by B813. B736 get_user_object uses user_id_upsert=False;
  organization-admin discovery returns None on ValueError, missing user or no org_admin memberships.
  Own-team lookup uses check_db_only=True and returns () only for UserNotFoundError or a missing user.
  Keep other errors visible. B2314 supplies user_api_key_has_admin_view; B742 supplies allowed_route_check_inside_route,
  B801 the typed tables/log sanitizer, B724 TeamRepository and B1231 response types.

  V2 admin/viewer callers retain any requested user_id without org scope. Org admins cannot request
  an organization outside their administered IDs (403 detail.error). Own queries clear user_id and
  union administered organizations with DB-direct team memberships; other-user queries retain user_id
  and do not add the caller's teams. Other callers failing the route check get 401 detail.error;
  accepted callers default user_id to their own ID. Legacy /team/list differs: ordinary own-query must
  explicitly match user_id, and own queries filter all teams by roster user_id across organizations.
  Org-admin non-own queries read only org teams and optionally filter their roster, including model table.

  Query predicates ignore falsy team_id/team_alias/search/organization_id. Alias search is insensitive
  contains; search ORs that with exact team_id by default, or case-sensitive startsWith for prefix.
  Explicit organization_id wins; otherwise org/own membership union is nested in AND so search cannot
  broaden it. A requested user's ValueError or missing row is 404; deleted-table queries use members.has
  even with no current teams. Live queries with no teams return None (skip SQL), a nonmember exact
  team_id is 404, and other live queries use team_id.in. All helper failures remain HTTPException with
  detail.error until the calling route maps them.

  Access groups: empty IDs or absent DB returns {}, otherwise deduplicate IDs into one query and omit
  missing rows silently. Count keys with one GROUP BY team_id restricted to the page's truthy IDs;
  empty pages skip SQL and absent _count.team_id means zero. Response conversion tries model_dump then
  dict on any failure. Deleted rows use their own model; live non-list members_with_roles becomes [],
  members_count is its length, and absent/empty team ID or missing key count means keys_count=0.
  Test reads with POSTGRES_TEST_URL or testcontainers; only pure predicates/row projections enter the
  helper oracle. This component does not validate sorting or expand group resources into team models.


  Build the production team_list_query module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  _get_org_admin_org_ids (L5291-L5322; 29 source lines), _get_user_team_ids_from_db (L5325-L5342; 18 source
  lines), _build_team_list_where_conditions (L5345-L5436; 77 source lines), _batch_resolve_access_group_resources
  (L5439-L5455; 15 source lines), _convert_teams_to_response_models (L5458-L5488; 30 source lines), _get_keys_count_by_team
  (L5491-L5513; 21 source lines), _enforce_list_team_v2_access (L5516-L5588; 62 source lines), _authorize_and_filter_teams
  (L5783-L5854; 63 source lines).


  The B856 Management::teams helper operation invokes only _convert_teams_to_response_models with
  typed rows and precomputed key counts. B171 supplies its decoder. The query builder itself can load
  a user, so its filtering cases, authorization, access-group fetch and GROUP BY counts all run against
  the native repository services and Postgres; they are not pure helper cases.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 315 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  315 production, 275 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 685 changed lines estimated within a 725-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
