deviations: []
out_of_scope:
- >-
  LangfuseObservation.trace_id property: no caller at the pin; production uses the
  resolved trace ID returned from generation assembly, accessed via LangfuseObservation.id
  and span end lifecycle which are built here.
- >-
  LangfuseTracing, export channels, and the OTLP exporter are owned by B3903; these primitives
  never call them. The OTel Span, Tracer and Context types are library interfaces, not B3903 ownership.
- >-
  Configuration (LANGFUSE_SAMPLE_RATE, LANGFUSE_TIMEOUT, etc.) is owned by B3900;
  this task provides the projections and primitives only.
- >-
  LiteLLM's per-provider dispatch functions are out of scope; this task handles only the
  observation/span abstractions shared across providers.
pitfalls:
- >-
  resolve_observation_id returns None for empty/nil input, but resolve_trace_id
  generates a random ID when input is empty. Both hash non-canonical strings to 32/16
  hex characters respectively; only UUIDs and valid hex pass through unchanged.
- >-
  The tracer's ID generator is injected from the OTel provider; do not use OTel's global
  provider or invoke the generator outside the request context where context variables are set.
- >-
  Metadata value serialization preserves ints in the JSON-safe range [-2^53+1, 2^53-1]
  but stringifies larger ints and floats, matching what a JSON reader would do.
- >-
  Parent context creation differs on existing_trace: a fresh trace uses a new root context,
  while existing_trace hangs under a synthetic parent to signal append-only to the server.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 2
