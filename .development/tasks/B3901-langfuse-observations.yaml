  - crates/betterlite-logging/src/langfuse_observations.rs
  - crates/betterlite-logging/src/langfuse_observations/**
  - tools/oracle/cases/helpers/langfuse-observations/**
  - tools/oracle/helpers/b3901.py
  - tools/oracle/helpers/b3901/**
  - tools/oracle/src/helpers/logging/b3901.rs
  - tools/oracle/src/helpers/logging/b3901/**
  lint_tables: false
