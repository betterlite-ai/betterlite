id: B3901
title: Langfuse observation attributes and span identity
description: >-
  Build the typed observation/span primitives in betterlite-logging, starting with timestamp
  conversion to OTel nanoseconds, stable ID normalization and hashing, trace and generation
  attributes, and span lifecycle management. Provide a LangfuseObservation type wrapping an
  OTel Span with its resolved ID, a context-variable-based ID generator to hand out requested
  trace and span IDs, and a TraceIdHashSampler for sampling on trace ID SHA256 rather than
  low bits. The trace_attributes and observation_attributes functions project v2's per-field
  arguments into OTel span attributes, handling scalar fields, sequences, and flattened metadata;
  required to support child observations, trace updates, and prompt links in later tasks. Keep
  the provider and tracer injected so primitives never acquire an export channel or mutate the
  host's global OTel state. Write the behavior rstest functions observation_attributes_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD.
scope:
