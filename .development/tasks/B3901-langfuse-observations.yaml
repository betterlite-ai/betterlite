  why: Timestamp conversion to unix nanoseconds, serialization helpers, trace and observation attribute projection.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_sdk.py#L288-L301
  why: LangfuseObservation type with id and trace_id properties.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_sdk.py#L303-L460
  why: Observation lifecycle (end, start_generation, start_child_span), requested-ID context variables and generator, parent context builder, TraceIdHashSampler.
dod:
- text: Timestamp normalization, ID resolution, and attribute projection match pinned behavior.
  proof:
  - oracle
  - helper-python
- text: >-
    Trace and observation attributes flatten metadata, serialize non-native types, and preserve
    prompt links and public flags as OTel span attributes.
  proof:
  - observation-attributes-tests
- text: >-
    Requested span and trace IDs flow through context variables; trace ID sampling on SHA256
    matches the sampler's output; parent context carries explicit and existing-trace semantics.
  proof:
  - observation-attributes-tests
- text: >-
    LangfuseObservation ID property reads span context; child spans inherit parent public flag;
    span end time converts to nanoseconds.
  proof:
  - observation-attributes-tests
checks:
  optional: []
  commands:
  - id: observation-attributes-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::observation_attributes_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
