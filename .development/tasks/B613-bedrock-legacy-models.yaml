id: B613
title: Bedrock classic model parameter maps
description: >-
  Add compact typed configuration/mapping tables for AI21 Jurassic, Cohere command, Llama, Mistral, Titan and Claude2.
  Reuse existing base request/reply transport and prompt services; keep the persistent configured defaults that
  later calls observe, represented as typed settings rather than mutable Python classes. Preserve family token/stop/sampling
  parameter renames and legacy model list.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_ai21_transformation.py:
  AmazonAI21Config.__init__ L39-L54; AmazonAI21Config.get_config L57-L73; AmazonAI21Config.get_supported_openai_params
  L75-L81; AmazonAI21Config.map_openai_params L83-L99. litellm/llms/bedrock/chat/invoke_transformations/amazon_cohere_transformation.py:
  AmazonCohereConfig.__init__ L24-L35; AmazonCohereConfig.get_config L38-L54; AmazonCohereConfig.get_supported_openai_params
  L56-L58; AmazonCohereConfig.map_openai_params L60-L73. litellm/llms/bedrock/chat/invoke_transformations/amazon_llama_transformation.py:
  AmazonLlamaConfig.__init__ L25-L35; AmazonLlamaConfig.get_config L38-L54; AmazonLlamaConfig.get_supported_openai_params
  L56-L62; AmazonLlamaConfig.map_openai_params L64-L80. litellm/llms/bedrock/chat/invoke_transformations/amazon_mistral_transformation.py:
  AmazonMistralConfig.__init__ L32-L45; AmazonMistralConfig.get_config L48-L64; AmazonMistralConfig.get_supported_openai_params
  L66-L67; AmazonMistralConfig.map_openai_params L69-L87; AmazonMistralConfig.get_outputText L90-L111. litellm/llms/bedrock/chat/invoke_transformations/amazon_titan_transformation.py:
  AmazonTitanConfig.__init__ L29-L41; AmazonTitanConfig.get_config L44-L60; AmazonTitanConfig._map_and_modify_arg
  L62-L83; AmazonTitanConfig.get_supported_openai_params L85-L93; AmazonTitanConfig.map_openai_params L95-L114.
  litellm/llms/bedrock/chat/invoke_transformations/anthropic_claude2_transformation.py: AmazonAnthropicConfig.__init__
  L30-L42; AmazonAnthropicConfig.get_config L45-L60; AmazonAnthropicConfig.get_supported_openai_params L70-L78;
  AmazonAnthropicConfig.map_openai_params L80-L98.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse AmazonInvokeConfig.__init__ from B2205 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: ai21_penalties: AI21 supports exactly max_tokens,temperature,top_p,stream in that order.
  Map max_tokens to maxTokens, top_p to topP and copy temperature/stream, including False/None. Ignore max_completion_tokens,stop
  and penalties in the mapper; configured penalties still survive get_config and B611 default insertion. cohere_max_tokens:
  Delegate both supported names and mapping to B037 CohereChatConfig. The ordered list is stream,temperature,max_tokens,max_completion_tokens,top_p,frequency_penalty,presence_penalty,stop,n,tools,tool_choice,seed,extra_headers.
  Map both token aliases to max_tokens, n to num_generations, top_p to p, stop to stop_sequences without wrapping
  strings, and copy stream,temperature,frequency_penalty,presence_penalty,tools,seed. Ignore tool_choice/extra_headers
  despite their presence in the supported list; preserve input order for alias collisions. llama_generation_length:
  Llama supports max_tokens,temperature,top_p,stream in that order. Map max_tokens to max_gen_len, and copy temperature,top_p,stream.
  Ignore max_completion_tokens and stop. Its configured maxTokenCount/topP keys are not these mapped wire keys;
  preserve both rather than silently renaming the class defaults. mistral_max_tokens: Mistral supports max_tokens,temperature,top_p,stop,stream
  in that order and copies those fields unchanged. top_k is a configured default but absent from this mapper and
  supported list. Ignore unknown inputs and preserve existing optional_params. mistral_output_text: When choices
  is present, take choices[0].message.content and its finish_reason verbatim, even if outputs also exists. Otherwise
  outputs[0].text and stop_reason win. No finish-reason normalization occurs. If neither key exists, raise B682
  BedrockError 400 with exact message Unexpected mistral completion response. Malformed selected lists/records propagate
  their own errors from this helper; B612 may wrap them. legacy_config_defaults: All six constructors write only
  arguments other than None, retaining explicit False/0/empty values and prior settings when a later constructor
  omits them. AI21 fields are maxTokens,temperature,topP,stopSequences,frequencePenalty,presencePenalty,countPenalty
  (preserve frequencePenalty spelling); Cohere max_tokens,temperature,return_likelihood; Llama maxTokenCount,temperature,topP;
  Mistral max_tokens,temperature,top_p,top_k,stop; Titan maxTokenCount,stopSequences,temperature,topP. These declared
  defaults are None. Claude2 max_tokens_to_sample initially uses litellm.max_tokens from B2202 (DEFAULT_MAX_TOKENS=4096),
  with stop_sequences,temperature,top_k,top_p,anthropic_version None. Do not substitute the docstring example bedrock-2023-05-31
  for None. legacy_config_projection: get_config reads only the concrete class dictionary, excluding dunder names,
  functions,builtins,classmethod,staticmethod and None; the five non-Claude classes also exclude _abc names. Preserve
  other single-underscore values and descriptors. All constructors except Claude2 call B2205 AmazonInvokeConfig.__init__;
  Claude2 only sets its own defaults. Reset global class state between oracle rows and exercise persistence across
  two calls within a row. titan_stop_filter: Titan supports max_tokens,max_completion_tokens,stop,temperature,top_p,stream.
  Both token aliases write maxTokenCount in input order; top_p writes topP and stop writes stopSequences. Filtering
  depends on global litellm.drop_params truthiness, not the method drop_params argument: only provider=bedrock plus
  case-sensitive amazon in model filters. For list input retain elements matching ^(\|+|User:)$ in order, including
  the regex dollar behavior before a final newline; other sequences and strings become []. Without the filter condition
  preserve the stop value unchanged. No warning is emitted. claude2_parameters: Supported names are max_tokens,max_completion_tokens,temperature,stop,top_p,stream.
  Both token aliases write max_tokens_to_sample; stop writes stop_sequences; temperature/top_p copy; stream writes
  only for literal True, leaving an existing stream value untouched for False/None. Unknown inputs are ignored.


  Load AmazonAI21Config.maxTokens, AmazonAI21Config.temperature, AmazonAI21Config.topP, AmazonAI21Config.stopSequences,
  AmazonAI21Config.frequencePenalty, AmazonAI21Config.presencePenalty, AmazonAI21Config.countPenalty, AmazonCohereConfig.max_tokens,
  AmazonCohereConfig.temperature, AmazonCohereConfig.return_likelihood, AmazonLlamaConfig.maxTokenCount, AmazonLlamaConfig.temperature,
  AmazonLlamaConfig.topP, AmazonMistralConfig.max_tokens, AmazonMistralConfig.temperature, AmazonMistralConfig.top_p,
  AmazonMistralConfig.top_k, AmazonMistralConfig.stop, AmazonTitanConfig.maxTokenCount, AmazonTitanConfig.stopSequences,
  AmazonTitanConfig.temperature, AmazonTitanConfig.topP, AmazonAnthropicConfig.max_tokens_to_sample, AmazonAnthropicConfig.stop_sequences,
  AmazonAnthropicConfig.temperature, AmazonAnthropicConfig.top_k, AmazonAnthropicConfig.top_p, AmazonAnthropicConfig.anthropic_version
  through betterlite-config, with injected environment lookup and the defaults/precedence stated here. Deployment
  inputs use litellm_params and global inputs use litellm_settings. Add config rstest bedrock_legacy_models_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Load litellm.drop_params through the existing B2201 loader (default False), and litellm.max_tokens through B2202.
  The cases above exercise their consumers; no second parser or alternative defaults belong here. B037 owns the
  native CohereChatConfig methods called by this task; add direct dependency by id even while its task file is absent.


  AmazonAnthropicConfig.get_legacy_anthropic_model_names belong to B2231; delegate those calls directly and retain
  only the remaining owned bodies.


  Implement crates/betterlite-bedrock/src/legacy_models.rs with adjacent tests under legacy_models/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_legacy_models in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function legacy_models_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  ai21_penalties, cohere_max_tokens, llama_generation_length, mistral_max_tokens, mistral_output_text, legacy_config_defaults,
  legacy_config_projection, titan_stop_filter, claude2_parameters. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_legacy_models* using HelperCase: kind:
  helper and the externally tagged bedrock_legacy_models variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_legacy_models that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 358 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 290 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 90 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 800 planned, 800 maximum changed lines.
