checks:
  optional:
  - mutants
  commands:
  - id: case-ai21-penalties
    why: The ai21-penalties behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::legacy_models_cases::case_[0-9]+_ai21_penalties$/)'
  - id: case-cohere-max-tokens
    why: The cohere-max-tokens behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::legacy_models_cases::case_[0-9]+_cohere_max_tokens$/)'
  - id: case-llama-generation-length
    why: The llama-generation-length behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::legacy_models_cases::case_[0-9]+_llama_generation_length$/)'
  - id: case-mistral-max-tokens
    why: The mistral-max-tokens behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::legacy_models_cases::case_[0-9]+_mistral_max_tokens$/)'
  - id: case-titan-text-generation-config
    why: The titan-text-generation-config behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::legacy_models_cases::case_[0-9]+_titan_text_generation_config$/)'
  - id: case-claude2-legacy-names
    why: The claude2-legacy-names behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::legacy_models_cases::case_[0-9]+_claude2_legacy_names$/)'
  - id: case-mistral-output-text
    why: The mistral-output-text behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::legacy_models_cases::case_[0-9]+_mistral_output_text$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_legacy_models.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_legacy_models*")"
      && grep -lq 'bedrock_legacy_models' tools/oracle/fuzz/corpus/helper_case/bedrock_legacy_models* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_legacy_models$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
