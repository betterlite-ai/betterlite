id: B994
title: Claude skill write
description: >-
  Implement the proxy's local skill create/delete and search validation over B051's skill records, reusing skill_visibility
  and grants. This owns proxy-managed storage and routing only; provider skill transport and SDK operations remain
  B095, which consumes B081 and therefore cannot be a dependency.


  Implement crates/betterlite-server/src/api/claude_skill_write.rs, crates/betterlite-core/src/api/claude_skill_write.rs.
  Use ClaudeSkillWriteInput and ClaudeSkillWriteResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/skills; DELETE /v1/skills/{skill_id}. Each alias is exercised
  through the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without
  re-registering their methods/paths.


  Route input projections: data.model (absent None); request.query_params.model (absent None); request.headers.x-litellm-model
  (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): skills_endpoints.py:45 status_code=status_code, exception_detail=FastAPI detail string. Compare
  the actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions skill_create, skill_delete_owner, skill_delete_denied, invalid_skill_search,
  duplicate_skill, route_aliases, auth_missing, auth_invalid under api::claude_skill_write::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.skill_search_embedding_model
  defaults to None. No environment reads occur outside betterlite-config. Test api::claude_skill_write::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-server::api::claude_skill_write::decode_claude_skill_write(bytes:
  &[u8], limits: &ApiLimits), for orjson.loads input body at litellm/proxy/anthropic_endpoints/skills_endpoints.py:463.
  Place its implementation in crates/betterlite-server/src/api/claude_skill_write.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/claude_skill_write.rs passes arbitrary
  bounded bytes to that exact decoder; api::claude_skill_write::tests::replays_corpus replays newly committed seeds
  through the same function. Transform-only helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/anthropic_endpoints/skills_endpoints.py: _skill_search_error (L43-L45); litellm/proxy/anthropic_endpoints/skills_endpoints.py:
  _search_skills (L48-L80); litellm/proxy/anthropic_endpoints/skills_endpoints.py: create_skill (L89-L178); litellm/proxy/anthropic_endpoints/skills_endpoints.py:
  delete_skill (L414-L504). Abstract/protocol declarations map to native types and synchronous/async wrappers share
  one implementation; a partial function span is the explicit preparation/transition stage described above, with
  typed values passed to the following stage.


  Sizing: 155 owned nonblank/non-comment/non-docstring Python lines (196 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 175 implementation,
  88 behavior tests, 96 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds and
  38 wiring; 490 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B1101 (Shared
  multipart and form extraction), B726 (Managed resources and transaction repositories), B858 (Typed managed-resource
  and analytics rows), B732 (Typed authentication principals and grant resolution), B855 (Authenticated request
  admission and budget handoff), B756 (Authentication header selection and mode dispatch), B1140 (Claude plugin
  and skill policy), B003 (HTTP server, health routes and master key auth), B1139 (Stateful HTTP oracle scenarios),
  B856 (Management oracle namespaces and Postgres test fixture), B002 (Load LiteLLM config.yaml into typed config).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
