id: B717
title: Native migration recovery and drift guards
description: >-
  Implement the native v2 MigrationRecovery state machine with bounded attempts, permission-failure classification
  and completion recovery through MigrationLedger and MigrationDeploy. Preserve contention accounting
  and replica-identity ordering. Delegate ahead-of-head warnings, partition/Lens guards and invalid-index
  repair to B857 and replica identity to B718.


  Build the production migration_recovery module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm-proxy-extras/litellm_proxy_extras/utils.py:
  ProxyExtrasDBManager._is_permission_error (L409-L433; 21 source lines), ProxyExtrasDBManager._setup_database_v2
  (L951-L990; 36 source lines), ProxyExtrasDBManager._run_database_v2 (L993-L1101; 94 source lines), ProxyExtrasDBManager._v2_failed_migration_name
  (L1104-L1111; 8 source lines), ProxyExtrasDBManager._v2_failed_migration_started_at (L1114-L1116; 3
  source lines), ProxyExtrasDBManager._v2_roll_back_migration_best_effort (L1119-L1129; 10 source lines),
  ProxyExtrasDBManager._budget_after_deploy_failure (L1132-L1226; 87 source lines), ProxyExtrasDBManager.apply_replica_identity_full_if_requested
  (L1252-L1282; 29 source lines). litellm/proxy/proxy_cli.py: resolve_v2_migration_resolver (L184-L191;
  7 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DATABASE_URL=None;
  DIRECT_URL=None.


  LITELLM_SET_REPLICA_IDENTITY_FULL=false controls B718 replica identity updates. USE_V2_MIGRATION_RESOLVER
  defaults true; false and B121 --use_legacy_migration_resolver start with v2 and warn. B121 --use_prisma_db_push
  and migrations/run.py USE_PRISMA_DB_PUSH request the unsupported destructive schema-diff operation;
  reject with guidance to use pinned migrations or baseline an already-current schema.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::migration_recovery::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Startup configuration seeds belong
  to B051; this orchestration task only consumes resolved settings.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 295 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  295 production, 151 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 526 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Migration orchestration consumes the typed startup settings; configuration behavior tests prove warning/deviation
  decisions, but this task adds no config-corpus or parser-corpus check.


  Native-only deviation tests in this production module: native_legacy_resolver_settings_start_native_v2_with_a_warning_use_prisma_db.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
