id: B717
title: Native migration recovery and drift guards
description: >-
  Implement betterlite-db::migration_recovery as the native v2 resolver over B873 MigrationDeploy and
  B716 MigrationLedger. Own _is_permission_error, _setup_database_v2, _run_database_v2,
  _v2_failed_migration_name/_v2_failed_migration_started_at projections,
  _v2_roll_back_migration_best_effort, _budget_after_deploy_failure and
  apply_replica_identity_full_if_requested from extras/utils.py, plus proxy_cli.py's
  resolve_v2_migration_resolver. Do not call back up to B051 for command timeouts: B716 now owns
  prisma_command_timeout and prisma_migrate_deploy_timeout as well as lock timeout parsing.

  Before a migrate pass require a truthy DATABASE_URL, otherwise raise RuntimeError with
  'DATABASE_URL is required for v2 migrations', even when DIRECT_URL exists. Select a truthy DIRECT_URL
  or the writer URL for the lock connection, strip Prisma-only params through B711, and select the
  namespace from DATABASE_URL's first nonblank schema or public through B716. Recovery accepts only
  a single packaged migration name: reject directory traversal, any backslash and names absent from
  the compiled catalog without opening a coordinator. Under B716's migration lock, try confirmed
  completion first, then inert-migration rollback only if completion returned false. A true result
  ends the current deploy pass at a committed recovery checkpoint; start a fresh pass afterward.
  A nonempty preexisting schema without history similarly invokes B716 baseline under the coordinator
  and then starts another pass. Baseline/recovery failures propagate immediately.

  Ask B857 to warn about ahead-of-head history at each deploy pass; that informational check cannot
  block deployment. Each pass starts four failure attempts and B716's configured contention budget
  (default 600 seconds). Each deploy call receives B716's deploy timeout, default 600 with its
  documented command-timeout precedence. Success returns true and logs completion. Timeout warns
  with attempt number, elapsed limit and LITELLM_PRISMA_MIGRATE_DEPLOY_TIMEOUT guidance, then consumes
  one failure attempt. For any branch that consumes an attempt, sleep a random integer in [5,14]
  seconds before continuing, including after the fourth consumed attempt. Contention consumes only
  its measured monotonic elapsed time and does not take that extra sleep. Recovery checkpoints reset
  both budgets for the next pass; there is no single four-attempt cap across successful checkpoints.

  Represent the native equivalents of Prisma P3005 (nonempty unbaselined schema), P3009 (unfinished
  history), P3018 (failed migration step) and P1002 advisory-lock contention as typed deploy outcomes
  carrying exact ledger identity and SQLSTATE, not a new parser of Prisma stderr. The reference
  name extraction prioritizes P3009 over P3018 and accepts digit-plus-underscore names, independently
  of B716's stricter fourteen-digit timestamp ranking. P3009 start-time matching uses the exact
  escaped migration name. Native outcomes must retain the actual started_at identity rather than
  finding an arbitrary failed row by name. Completion recovery runs before budget classification,
  including before permission-error rejection, because verified completion is stronger evidence.

  For an unresolved P3009-equivalent, require name and started_at before consulting B716's failed
  logs/recovered-row queries. Logs containing the case-sensitive marker 'deadlock detected' cause
  an informational deadlock-race message, best-effort history rollback and one spent attempt. Otherwise
  an already finished or rolled-back row with that exact identity logs concurrent recovery and spends
  one attempt. Missing identity, unavailable/empty logs without recovery, or uncertain completion
  stops startup. Preserve the full source recovery guidance beginning 'Migration completion could
  not be verified. LiteLLM startup has stopped.': inspect the named SQL, actual objects/data and logs;
  only resolve applied after proving every change is present, or rolled back after proving no changes
  remain/undoing partial changes. Resolving history does not undo SQL, and restarting alone does not
  resolve uncertainty. Test the complete message, including both operator recovery choices.

  For P3018-equivalent failure, permission rejection takes precedence over deadlock retry. The source
  recognizes, case-insensitively, 'Database error code: 42501', 'must be owner of table', 'permission
  denied for schema', 'permission denied for table' and 'must be owner of schema'. Native SQLSTATE
  42501 maps to this permission outcome; preserve the message 'Database migration failed due to
  insufficient permissions. Please grant the required privileges and retry.' and attached native
  error detail. Do not mark it applied or rolled back. A named deadlock instead rolls back failed
  history best-effort and spends an attempt. Other step failures stop with 'Database migration failed
  and cannot be auto-recovered. Manual intervention required.' and detail. Outside those outcomes,
  a deadlock consumes an attempt before the advisory-lock contention branch; unrecognized failures
  use the same manual-intervention error. Exhaustion reports four attempts that made no progress,
  identifies timeouts/deadlock retries and advises checking connectivity, load and _prisma_migrations
  and raising LITELLM_PRISMA_MIGRATE_DEPLOY_TIMEOUT for timeouts.

  Best-effort rolled-back resolution is a separate history operation before the next deploy attempt;
  it does not roll back already committed DDL or replay the migration. Mark the failed, unfinished,
  non-rolled-back records for the named migration rolled_back_at while preserving checksum, logs,
  started_at and applied_steps_count. Completed records are not rewritten. Source resolve-command
  failure and timeout are silently ignored here so the next pass can inspect the actual ledger state;
  native database failure/timeout must likewise leave the attempt consumed and continue without a
  new warning. Other failures, including cancellation, propagate. Test successful marking and a
  permission-denied marker write separately; never assume rollback bookkeeping succeeded.

  Resolve USE_V2_MIGRATION_RESOLVER with default true through B2307's extras str_to_bool (no stripping,
  'on' is false); the CLI legacy flag forces false before the env value is considered. Keep the current
  deviation: requested legacy mode starts native v2 with a warning. USE_PRISMA_DB_PUSH defaults absent
  and uses that same boolean parser in migrations/run.py; the CLI --use_prisma_db_push supplies a
  separate boolean. When either requests push, reject before any database mutation with guidance to
  use pinned migrations or baseline an already-current schema. The v1 diff-and-force and accept-data-loss
  paths remain excluded. No generic invalid_value_fallback case belongs to these permissive booleans.

  LITELLM_SET_REPLICA_IDENTITY_FULL defaults absent/false and uses the same extras boolean parser.
  apply_replica_identity_full_if_requested returns false without calling B718 when disabled; when
  enabled it delegates to B718 and returns that result. The source catches migration-path discovery
  OSError, logs 'Could not resolve the migrations directory for the REPLICA IDENTITY FULL step,
  skipping it. Error: ...' and returns false. Native compiled catalogs eliminate that filesystem step,
  while B718 still owns statement/connection errors and their nonfatal result. B051 invokes this
  optional helper after successful setup; the retry loop itself must not run it after every attempt.

  Exercise recovery through real isolated Postgres ledger/catalog fixtures from B860 using
  POSTGRES_TEST_URL or testcontainers. Verify separate committed checkpoints, failed marker updates,
  preserved partial DDL and permission failures; use deterministic clocks/jitter injection for budgets.
  Compare pinned error-guidance fixtures without spawning a gateway Prisma CLI. Config tests load the
  three mode/replica env settings through B002 and consume B716's timeout values. Typed deploy outcomes
  introduce no byte parser; do not add unused regex/fuzz code just to imitate subprocess stderr.

  The reference ownership is 295 nonblank noncomment lines including docstrings. Allow 300 native
  orchestration, 340 recovery/Postgres tests, 70 config/tests and 35 wiring lines, 745 within 800.
  Keep mode policy, failure recovery and retry orchestration in source files below 300 lines.
scope:
  paths:
    - crates/betterlite-db/src/migration_recovery.rs
    - crates/betterlite-db/src/migration_recovery/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-config/src/migration_recovery.rs
    - crates/betterlite-config/src/migration_recovery/**
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/loader.rs
    - crates/betterlite-config/src/raw.rs
    - crates/betterlite-config/tests/**
    - crates/betterlite-config/src/resolve.rs
    - crates/betterlite-config/src/types.rs
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/fuzz/corpus/config_yaml/migration-recovery-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L409-L433
    why: Permission-failure indicators and their case-insensitive matching.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L951-L1101
    why: Coordinator callbacks, checkpoint passes, timeout and retry budgets, sleep order and exhaustion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L1104-L1226
    why: Migration identity, silent best-effort rollback, error precedence and complete manual recovery guidance.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L1252-L1282
    why: Actual replica-identity env read and nonfatal discovery failure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L184-L191
    why: Legacy CLI flag precedence over the default-true environment selector.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/migrations/run.py#L50-L63
    why: Actual migration-job reads of USE_V2_MIGRATION_RESOLVER and USE_PRISMA_DB_PUSH.
dod:
  - text: 'Setup/checkpoint tests cover writer_url_required_even_with_direct,
      direct_lock_url_writer_namespace, recovery_rejects_path_and_unknown_name,
      completion_before_inert_rollback, baseline_checkpoint_before_new_pass,
      recovery_checkpoint_resets_budgets, callback_failure_propagates,
      ahead_history_warning_is_nonfatal and completion_evidence_before_permission_classification.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Failure/budget tests cover timeout_warning_and_attempt_spend, integer_jitter_five_to_fourteen,
      exhausted_attempt_still_sleeps, contention_only_elapsed_budget, contention_exhaustion,
      unfinished_history_exact_identity, ledger_deadlock_rolls_back_before_retry,
      concurrent_recovered_row_spends_attempt, uncertain_completion_full_guidance,
      permission_patterns_and_sqlstate, permission_before_deadlock,
      named_step_deadlock, bare_deadlock_before_contention, unknown_failure_manual_intervention,
      exhaustion_full_message, native_diagnostics_carry_sqlstate_and_ledger_identity,
      postgres_rollback_marker_preserves_history,
      postgres_failed_marker_write_is_silent, completed_history_not_rewritten,
      rollback_cancel_propagates and postgres_partial_ddl_not_undone.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Config and delegation tests prove mode_env_defaults, extras_boolean_spellings,
      legacy_cli_flag_precedence, native_legacy_mode_warns_and_runs_v2,
      native_requested_db_push_rejected_before_mutation, replica_identity_disabled_no_call,
      replica_identity_result_forwarded and shared_timeout_policy_consumed.'
    proof: [config-tests, config-corpus, behavior-tests]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Each checkpoint, error classification, retry budget and mode branch must pass independently.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^migration_recovery::tests::/)'
    - id: postgres-tests
      why: Marker writes and failed recovery must preserve the actual ledger and partially committed SQL.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/migration_recovery::tests::postgres_rollback_marker_preserves_history$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/migration_recovery::tests::postgres_failed_marker_write_is_silent$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/migration_recovery::tests::postgres_partial_ddl_not_undone$/)'
    - id: config-tests
      why: Env selectors and caller-supplied timeouts must drive the production native resolver.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^migration_recovery::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: Added migration mode inputs must replay through the actual config decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/migration-recovery-*")" && grep -rlq USE_V2_MIGRATION_RESOLVER crates/betterlite-config/fuzz/corpus/config_yaml/migration-recovery-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases: []
deviations:
  - what: Legacy resolver requests warn and run native v2; --use_prisma_db_push and truthy
      USE_PRISMA_DB_PUSH stop startup before mutation with pinned-migration/baseline guidance.
    why: Preserve the existing native plan; no destructive schema-diff engine is implemented.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L993-L1037
  - what: Migration diagnostics attach native SQLSTATE and ledger identity instead of Prisma CLI
      stderr/P-code output; compiled migrations need no working-directory change or Prisma path discovery.
    why: Native deployment preserves the recovery decisions and manual-recovery guidance without
      fabricating subprocess failures or parsing a CLI that the gateway cannot run.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L1041-L1282
out_of_scope:
  - B716 owns ledger reads, completion/inert recovery, baseline, locks, attempt-budget arithmetic,
    _prisma_schema_param and command/deploy/lock timeout accessors. B873 owns SQL deployment and
    migration_files; B711 owns _strip_prisma_query_params/_libpq_tls_params.
  - B857 owns ahead-of-head diagnostics, pending Lens/partition guards and invalid-index repair;
    B718 owns the REPLICA IDENTITY FULL statement and its failure logging.
  - B051 owns setup_database, build_request_log_indexes, run_migration_job and
    start_request_log_index_build, including post-setup replica-identity ordering.
  - The native-v2 deviation excludes _get_prisma_env, _get_prisma_command, _get_prisma_dir,
    _create_baseline_migration, _without_sql_comments, _without_spend_logs_pk_clauses,
    filter_partitioned_spend_logs_diff, _roll_back_migration, _resolve_specific_migration,
    _is_idempotent_error, _resolve_all_migrations, _mark_migrations_applied, _run_migrations
    and _filter_migration_job_owned_drift. _roll_back_migration_best_effort and _mark_migration_applied
    have no caller at the pin. Do not confuse those with the live _v2_ rollback helper owned here.
  - B2307 owns extras str_to_bool and CLI query/timeout-option helpers; B121 owns the remaining
    proxy_cli.py shell and flag declarations, while this task owns resolve_v2_migration_resolver.
pitfalls:
  - A confirmed recovery checkpoint restarts the per-pass budgets; it is not one of the four failed attempts.
  - Best-effort rollback failure is silent and still consumes an attempt, so a retry must reread history.
  - Replica identity runs through the outer setup caller after success, not inside every retry pass.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
