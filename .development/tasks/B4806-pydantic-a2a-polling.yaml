id: B4806
title: Pydantic AI submission, polling and provider entry points
description: >-
  Build Pydantic AI agent request submission, polling for task completion, and provider entry points.
  Pydantic AI agents follow the A2A protocol but do not support streaming natively, so implement polling
  for non-streaming requests and delegate fake streaming through B4805's response projection.
  Remove None values recursively from request dictionaries before sending; force message.kind="message"
  in the A2A message object. Send JSON-RPC requests to message/send at the configured api_base URL
  after stripping trailing slashes. If the initial response is not completed and contains a truthy task ID,
  poll tasks/get up to 30 times at 0.5-second intervals, using request IDs of form {request_id}-poll-{attempt}.
  Return completed tasks; fail on failed or canceled states. If a response lacks a task ID, return it raw
  even when not completed. The default transport timeout is 60 seconds. Preserve forwarded headers on every
  poll. Implement PydanticAITransformation (request cleanup, submission, polling, result projection),
  PydanticAIHandler (non-streaming and streaming entry points), and PydanticAIProviderConfig (provider
  contract implementation). Non-streaming returns a transformed A2A response; streaming delegates to B4805's
  fake_streaming_from_response. Typing uses the same Pydantic protocol checks as the source (model_dump
  and dict methods) and maintains distinction between raw task data for streaming and projected Message
  data for non-streaming.

