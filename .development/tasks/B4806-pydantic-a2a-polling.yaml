dod:
- text: Non-streaming requests remove all None values recursively from parameters and enforce message.kind="message"
    before sending to message/send.
  proof:
  - oracle
- text: Polling loops run up to 30 times at 0.5-second intervals using {request_id}-poll-{attempt} request IDs,
    returning on completed state and failing on failed or canceled states.
  proof:
  - oracle
- text: If polling exhausts all 30 attempts without completion, raise TimeoutError with message "Task {task_id}
    did not complete within 15.0 seconds".
  proof:
  - oracle
- text: Responses lacking a task ID return immediately as raw data without polling, even when not completed.
  proof:
  - oracle
- text: Streamed requests receive raw task responses from submission/polling and project them through B4805's
    fake_streaming_from_response without additional transformation.
  proof:
  - oracle
- text: Forwarded headers from the initial request are preserved on every poll.
  proof:
  - oracle
- text: The default transport timeout is 60 seconds and is configurable per request.
  proof:
  - oracle
- text: Pydantic models using model_dump or dict protocols are detected and converted to dictionaries without
    panics on type mismatches.
  proof:
  - a2a-pydantic-tests
- text: Every listed pydantic_ai_agents case matches LiteLLM on the client response and polling behavior.
  proof:
  - oracle

