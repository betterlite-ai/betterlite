deviations:
- what: Pydantic model detection uses Rust's type system instead of isinstance checks; models implementing
    the expected serialization protocol are accepted without runtime protocol checking.
  why: Rust requires explicit trait bounds at compile time rather than runtime duck typing.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/providers/pydantic_ai_agents/transformation.py#L83-L93

out_of_scope:
- The handler entry point registration or routing logic (B4809 composes this provider config).
- Session ID scoping and principal handling (B4802).
- Response metadata and event construction (B4805).
- Request header merging and agent parameter filtering (B4809).

pitfalls:
- Recursive None removal must handle both dict and list values without panics on non-JSON types.
  Validate at the boundary using serde_json types where the source comes from untrusted input.
- Poll request IDs use the format {request_id}-poll-{attempt}, where attempt is 0-indexed and goes to 29.
  A misformatted ID breaks oracle matching.
- The message kind enforcement must happen after None removal, since it modifies the nested message object
  in place. A stale reference breaks the transformation chain.
- message/send is the fixed method name; no variant like message_send or MessageSend.
- The api_base.rstrip('/') call removes all trailing slashes, not just one. An endpoint with query params
  still works because rstrip operates on the trailing suffix.
- A response with state=completed but no result or invalid task structure still counts as completed and exits
  the polling loop. Do not add secondary validation beyond state comparison.

review_level: standard

budget:
