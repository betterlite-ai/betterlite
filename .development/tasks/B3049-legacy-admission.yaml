id: B3049
title: Legacy key user and team admission
description: >-
  Build the admission step of LiteLLM's legacy per-minute limiter: `_PROXY_MaxParallelRequestsHandler.async_pre_call_hook`,
  the function that decides, per request, whether a key, a key-and-model pair, a user, a team and an end user are still under
  their limits. LiteLLM runs it instead of the v3 limiter only when the env var `LEGACY_MULTI_INSTANCE_RATE_LIMITING` is
  `true`; choosing between the two limiters is the umbrella's wiring, not this task. B3047 already owns the pieces this hook
  calls (the handler holding the usage cache, `check_key_in_limits`, `get_all_cache_objects`, `raise_rate_limit_error`,
  `CacheObject`, `time_to_next_minute`, `print_verbose`). Call them, do not copy them. B3048 owns the success and failure
  callbacks that later add tokens and release counts.

  Add `crates/betterlite-rate-limit/src/legacy_admission.rs`. It exposes `LegacyAdmission`, built with the B3047 handler and
  the clock B3047 uses, and one method `pre_call(&self, principal: &UserApiKeyAuth, request: &mut AdmissionRequest) ->
  Result<(), LegacyAdmissionError>`. `UserApiKeyAuth` is the B2314 record. `AdmissionRequest` has `model: Option<String>` and
  `metadata: serde_json::Map<String, Value>`. LiteLLM's `data is None` becomes an empty request. The two unused arguments
  `cache` and `call_type` are not carried over. `LegacyAdmissionError` is this module's error enum: it wraps the B3047 429
  error and the cache error and adds no new status.

  Steps, in LiteLLM's order. Any step that raises stops the request and the later steps do not run.

  1. Print "Inside Max Parallel Request Pre-Call Hook" through B3047's `print_verbose`.

  2. Read the effective limits. `api_key` is B1106's `get_logged_api_key` (the key alias for a session token that has one,
  otherwise `api_key`). `max_parallel_requests` is the key's value, or `i64::MAX` (Python's `sys.maxsize`) when absent.
  `tpm_limit` and `rpm_limit` are the key's values run through B2325's `throttled_limit` with the key's `budget_throttle_pct`,
  and `i64::MAX` when the result is absent. User, team and end-user limits are never throttled.

  3. Global parallel cap. Read `metadata.global_max_parallel_requests`. When it is present, read the counter
  `global_max_parallel_requests` from the usage cache (local only). A missing counter counts as 1. When the counter is greater
  than or equal to the cap, call B3047's `raise_rate_limit_error` with detail `Hit Global Limit: Limit={cap}, current:
  {counter}` and the request model, so the type is CONCURRENT_REQUESTS. Otherwise increment the counter by 1 (local only).
  This increment is written immediately, so it stays even when a later step raises.

  4. Build the minute id `precise_minute` as `%Y-%m-%d-%H-%M` of the local wall clock (the process time zone, not UTC), then
  call B3047's `get_all_cache_objects` once with these keys, each present only when its parts are not None: the literal
  `global_max_parallel_requests` (only when the cap is present), `{api_key}::{precise_minute}::request_count`,
  `{api_key}::{model}::{precise_minute}::request_count` (needs api_key and model), `{user_id}::...`, `{team_id}::...`,
  `{end_user_id}::...` with the same suffix. Pass the principal's parent span as LiteLLM does.

  5. Key check. When `api_key` is present, call `check_key_in_limits` with the key's three limits, `current` from the key
  entry, the key counter id and type `key`. The returned counters are not used.

  6. Key-and-model check. Ask B745 for `get_key_model_tpm_limit` and `get_key_model_rpm_limit` with the request model. When
  either map is present (not None, an empty map counts as present), run the check with `max_parallel_requests = i64::MAX`.
  The per-model limits are `map.get(model)` read only when the model is present and the map is non-empty. The limit passed on
  is the per-model limit, or `i64::MAX` when it is absent or `0` (Python's `or`, so a configured zero is not enforced here).
  The counter id is `{api_key}::{model}::{precise_minute}::request_count` even when api_key or model is None (the text `None`
  is written into the id), and `current` is the key-model entry. The type is `model_per_key`. From the returned counters set
  `litellm-key-remaining-tokens-{model}` to `tpm_limit_for_model - current_tpm` and `litellm-key-remaining-requests-{model}`
  to `rpm_limit_for_model - current_rpm` when that per-model limit is not None (zero included), else null, and write both
  into `request.metadata`.

  7. User check. When `user_id` is not None (an empty string counts), use `user_tpm_limit` and `user_rpm_limit` (absent means
  `i64::MAX`), `max_parallel_requests = i64::MAX`, the counter id `{user_id}::{precise_minute}::request_count`, the `user`
  entry and type `user`.

  8. Team check. Same shape for `team_id`, with `team_tpm_limit` and `team_rpm_limit`, the `team` entry and type `team`.

  9. End-user check. Run only when `end_user_id` is truthy (None and the empty string both skip it), with
  `end_user_tpm_limit` and `end_user_rpm_limit`, the `end_user` entry and type `customer`. Note the entry lookup in step 4
  accepts an empty string, only this check does not.

  10. Spawn, without waiting, one call to the cache's `async_batch_set_cache` with every `(counter id, new counters)` pair
  the earlier checks collected, `ttl = 60` and no local-only flag. The list is passed even when empty. If the spawned write
  fails, log the error at error level; the request is still admitted.

  The collected list is shared: each `check_key_in_limits` call appends its own pair and writes the whole list so far with
  `local_only = true` (B3047 does that). Keep this order of writes: counters of the dimensions that passed stay written when a
  later dimension raises.

  Defaults are LiteLLM's. Names for tests live under `legacy_admission::tests`. Use the prefixes the checks below filter on.
  Each test drives `LegacyAdmission::pre_call` with a recording in-memory cache and a fixed clock, and asserts the calls it
  made and the error it returned. Name one test per case; use named rstest inputs for related values.

  No outside bytes are parsed here and the metadata is already decoded JSON, so there is no fuzz target. No route reaches the
  limiter at this commit (the umbrella registers it), so there are no HTTP oracle cases and no helper cases: the helper
  adapter can't run the hook against proxy globals. The umbrella adds the HTTP cases that send `LEGACY_MULTI_INSTANCE_RATE_LIMITING=true`.

scope:
  paths:
    - crates/betterlite-rate-limit/src/legacy_admission.rs
    - crates/betterlite-rate-limit/src/legacy_admission/**
    - crates/betterlite-rate-limit/Cargo.toml
  lint_tables: false

