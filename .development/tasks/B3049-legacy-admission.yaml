dod:
  - text: With metadata.global_max_parallel_requests absent the global counter is neither read nor changed, and the first batch read gets None for its global key.
    proof: [global-cap-tests]
  - text: With the cap present, a counter at or above it raises the CONCURRENT_REQUESTS 429 "Hit Global Limit" with the cap and counter in the detail, and a counter below it (or missing, which counts as 1) is incremented by 1, local only.
    proof: [global-cap-tests]
  - text: The six cache ids use precise_minute built from one local-time reading as `%Y-%m-%d-%H-%M`, and each id is None exactly when LiteLLM's conditions say so (api_key, model, user_id, team_id, end_user_id not None).
    proof: [cache-key-tests]
  - text: The key's max_parallel_requests, tpm and rpm default to i64::MAX when absent, and the key's tpm and rpm go through throttled_limit with budget_throttle_pct, while user, team and end-user limits are not throttled.
    proof: [key-limit-tests]
  - text: The key check runs only when the logged api key is present, uses type `key`, and a key over a limit surfaces B3047's 429.
    proof: [key-limit-tests]
  - text: The key-and-model check runs only when the tpm map or the rpm map is not None, uses the per-model limit with `or i64::MAX` semantics (zero or missing becomes unlimited), and the id contains `None` text for a missing api_key or model.
    proof: [model-limit-tests]
  - text: The remaining-token and remaining-request values are written to metadata as `litellm-key-remaining-tokens-{model}` and `litellm-key-remaining-requests-{model}` from the returned counters, null when the per-model limit is None and a numeric value (zero included) otherwise.
    proof: [remaining-metadata-tests]
  - text: The user check runs for any non-None user_id including an empty string, with type `user` and unlimited defaults.
    proof: [user-team-tests]
  - text: The team check runs for any non-None team_id, with type `team` and unlimited defaults.
    proof: [user-team-tests]
  - text: The end-user check runs only for a truthy end_user_id, uses type `customer`, and an empty end_user_id skips the check while still being looked up in the batch read.
    proof: [end-user-tests]
  - text: The checks run in the order global, key, key-and-model, user, team, end user, and counters of passed dimensions stay written when a later one raises.
    proof: [order-and-write-tests]
  - text: After all checks pass, one detached batch write carries every collected pair with ttl 60 and no local-only flag, an empty list included, and a failure of that write is logged and does not fail the request.
    proof: [final-write-tests]

checks:
  optional: []
  commands:
    - id: global-cap-tests
      why: the global parallel cap is not read, compared, raised on or incremented as LiteLLM does
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::global_cap_/)'
    - id: cache-key-tests
      why: the minute id or one of the six batch-read ids differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::cache_key_/)'
    - id: key-limit-tests
      why: the key check, its defaults or the budget throttle are missing
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::key_limit_/)'
    - id: model-limit-tests
      why: the key-and-model check is skipped, wrongly gated or treats a zero limit as enforced
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::model_limit_/)'
    - id: remaining-metadata-tests
      why: the remaining-limit metadata is missing or computed from the wrong counters
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::remaining_metadata_/)'
    - id: user-team-tests
      why: user or team admission is missing, or uses the wrong gate or limits
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::(user|team)_limit_/)'
    - id: end-user-tests
      why: end-user admission is missing or uses the wrong gate
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::end_user_limit_/)'
    - id: order-and-write-tests
      why: the checks run in a different order or the earlier counters are lost when a later check raises
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::order_/)'
    - id: final-write-tests
      why: the detached batch write is missing, awaited, local-only, has another ttl, or its failure fails the request
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_admission::tests::final_write_/)'

oracle_cases: []

deviations:
  - what: precise_minute is built from one clock reading. LiteLLM reads the clock three times (date, hour, minute).
    why: Three reads can straddle a midnight, hour or minute change and build an id that never existed. One reading cannot, and it matches LiteLLM whenever the reads agree.
  - what: A failure of the detached final batch write is logged at error level.
    why: Python's event loop prints an unretrieved task exception; a Rust task would drop it silently.
  - what: The arguments `cache` and `call_type` are not accepted.
    why: LiteLLM never reads them in this hook, and an unused parameter would only invite a reader to guess its purpose.

out_of_scope:
  - "Choosing the legacy limiter when `LEGACY_MULTI_INSTANCE_RATE_LIMITING` is `true` and registering it in the hook chain; the umbrella B072 does this and adds the HTTP oracle cases."
  - "`check_key_in_limits`, `get_all_cache_objects`, `raise_rate_limit_error`, `time_to_next_minute`, `print_verbose` and `CacheObject`; B3047 owns them."
  - "`async_log_success_event`, `async_log_failure_event`, `get_internal_user_object` and `async_post_call_success_hook` (L492-L855), which add tokens, release counts and attach headers; B3048 owns them."
  - "`get_key_model_tpm_limit`, `get_key_model_rpm_limit` (B745), `throttled_limit` (B2325) and `get_logged_api_key` (B1106)."
  - "The `UserAPIKeyAuth` record (B2314) and the usage cache's get, increment and batch methods (InternalUsageCache, B124); no part of B124 has a Rust task yet, so this task uses them through the handler B3047 holds."

pitfalls:
  - "The key-and-model limits use Python's `tpm_limit_for_model or sys.maxsize`, so a configured per-model limit of 0 is unlimited here, while the same 0 on the key itself raises through check_key_in_limits."
  - "The remaining-limit math uses `is not None`, not truthiness, so a per-model limit of 0 still yields `0 - current` (a negative number) in `litellm-key-remaining-tokens-{model}`."
  - "The key-and-model counter id is built with f-strings, so a missing api_key or model puts the text `None` into the id, and the batch read only fills that entry when both are present, so `current` is None on every request in that case."
  - "The user and team gates are `is not None`, the end-user gate is truthiness, but the end-user id in the batch read is `is not None`; an empty end_user_id is read from the cache and never checked."
  - "The global counter is incremented before any dimension is checked and is never rolled back when a later check raises."
  - "Only the key's tpm and rpm are throttled; the throttle uses `budget_throttle_pct` from the principal, which B2314 marks as not serialized."
  - "`metadata.global_max_parallel_requests` is read from the request metadata that earlier hooks filled; reading it from the key would change which requests are capped."
  - "The minute id uses local time (`datetime.now()`), so a process in another time zone rolls to a new counter at its own local minute, not at UTC."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
