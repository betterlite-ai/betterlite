    mantle responses url: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-mantle-responses/mantle-responses-url.yaml.
  proof:
  - case-mantle-responses-url
  - oracle
  - helper-python
- text: >-
    mantle response options: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-mantle-responses/mantle-response-options.yaml.
  proof:
  - case-mantle-response-options
  - oracle
  - helper-python
- text: 'mantle model name: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-mantle-responses/mantle-model-name.yaml.'
  proof:
  - case-mantle-model-name
  - oracle
  - helper-python
- text: >-
    unsupported params 400: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-mantle-responses/unsupported-params-400.yaml.
  proof:
  - case-unsupported-params-400
  - oracle
  - helper-python
- text: >-
    mantle response auth: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-mantle-responses/mantle-response-auth.yaml.
  proof:
  - case-mantle-response-auth
  - oracle
  - helper-python
- text: >-
    unsupported params warn drop: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-mantle-responses/unsupported-params-warn-drop.yaml.
  proof:
  - case-unsupported-params-warn-drop
  - oracle
  - helper-python
- text: >-
    openai project header: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-mantle-responses/openai-project-header.yaml.
  proof:
  - case-openai-project-header
  - oracle
  - helper-python
- text: New bedrock_mantle_responses seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-mantle-responses-url
    why: The mantle-responses-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_responses_cases::case_[0-9]+_mantle_responses_url$/)'
  - id: case-mantle-response-options
    why: The mantle-response-options behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_responses_cases::case_[0-9]+_mantle_response_options$/)'
  - id: case-mantle-model-name
    why: The mantle-model-name behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_responses_cases::case_[0-9]+_mantle_model_name$/)'
  - id: case-unsupported-params-400
    why: The unsupported-params-400 behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_responses_cases::case_[0-9]+_unsupported_params_400$/)'
  - id: case-mantle-response-auth
    why: The mantle-response-auth behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_responses_cases::case_[0-9]+_mantle_response_auth$/)'
  - id: case-unsupported-params-warn-drop
    why: The unsupported-params-warn-drop behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_responses_cases::case_[0-9]+_unsupported_params_warn_drop$/)'
  - id: case-openai-project-header
    why: The openai-project-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::mantle_responses_cases::case_[0-9]+_openai_project_header$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_mantle_responses.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_responses*")"
      && grep -lq 'bedrock_mantle_responses' tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_responses* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_mantle_responses$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
