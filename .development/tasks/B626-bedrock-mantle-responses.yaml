id: B626
title: Bedrock Mantle standalone Responses
description: >-
  Add standalone Mantle Responses mapping over shared Responses records. Preserve supported options, provider identity,
  model names, response paths, signing and native websocket capability metadata; do not duplicate OpenAI response
  decoding.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock_mantle/responses/transformation.py:
  BedrockMantleResponsesAPIConfig.__init__ L63-L70; BedrockMantleResponsesAPIConfig.custom_llm_provider L73-L74;
  BedrockMantleResponsesAPIConfig.get_error_class L76-L79; BedrockMantleResponsesAPIConfig.get_complete_url L81-L99;
  BedrockMantleResponsesAPIConfig.validate_environment L101-L108; BedrockMantleResponsesAPIConfig.supports_native_file_search
  L110-L111; BedrockMantleResponsesAPIConfig.supports_native_websocket L113-L114; BedrockMantleResponsesAPIConfig._filter_unsupported_tools
  L117-L126; BedrockMantleResponsesAPIConfig._handle_unsupported_service_tier L129-L148; BedrockMantleResponsesAPIConfig._handle_unsupported_reasoning_summary
  L150-L181; BedrockMantleResponsesAPIConfig.transform_responses_api_request L183-L212; BedrockMantleResponsesAPIConfig._params_with_hoisted_tools
  L215-L221; BedrockMantleResponsesAPIConfig._model_map_lookup_name L224-L225; BedrockMantleResponsesAPIConfig.map_openai_params
  L227-L257.


  litellm_params.aws_bedrock_project_id becomes OpenAI-Project; B598 owns the shared request-scoped setting and
  loader. service_tier outside auto/default and reasoning.summary other than auto raise UnsupportedParamsError status
  400 when drop_params is false; otherwise warn and drop. B907 supplies hoist_additional_tools, normalize_codex_input_items
  and drop_unsupported_tools through its lower typed helper implementation, with a direct dependency by id.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  with direct dependencies. Provider leaves must never import betterlite-core, and no copied helper algorithm is
  permitted.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: mantle_responses_url: Constructor calls the B2202 no-op base Responses initializer, keeps
  a truthy injected aws_signer or creates B590 BaseAWSLLM, and stores use_openai_path default True. Provider identity
  is BEDROCK_MANTLE. Resolve region through B2207 with litellm_params copied and api_base overwritten even when
  None. Choose truthy explicit base, BEDROCK_MANTLE_API_BASE, then https://bedrock-mantle.{region}.api.aws, strip
  trailing slashes, and remove only the first matching suffix: /openai/v1/responses,/v1/responses,/responses,/openai/v1,/v1.
  A recognized Mantle hostname is replaced by canonical https://bedrock-mantle.{resolved_region}.api.aws, discarding
  its remaining path; custom hosts retain theirs. Append /openai/v1/responses when use_openai_path is truthy, otherwise
  /v1/responses. mantle_response_options: First call B506 parent option mapping, then service-tier handling, then
  reasoning-summary handling. Missing or None service_tier and exact auto/default pass unchanged. Set membership
  is not string validation: an unhashable value fails before the UnsupportedParamsError branch. Only on use_openai_path
  with a dict reasoning record inspect reasoning.summary; missing/None or exact string auto pass unchanged. The
  standard /v1 path preserves all summary values. Use the supplied drop_params argument, whose configured default/precedence
  remains B2201/B176, without another global read. mantle_model_name: _model_map_lookup_name takes the last slash-separated
  segment and removes one leading openai.; empty/trailing-slash inputs can therefore produce an empty lookup name.
  This catalog lookup hook does not rewrite the outbound model argument passed to B507. unsupported_params_400:
  With drop_params falsey, an unsupported hashable service tier raises UnsupportedParamsError 400 and exact message
  bedrock_mantle does not support service_tier={value!r}; the Bedrock Mantle Responses API only accepts 'auto' or
  'default'. Set `drop_params: true` (litellm_settings or this deployment's litellm_params) to have LiteLLM drop
  it, or remove service_tier from the client (Codex CLI sends it when a speed tier is set in ~/.codex/config.toml).
  For an unsupported summary on the OpenAI path, raise UnsupportedParamsError 400 and bedrock_mantle does not support
  reasoning.summary={summary!r} for {model!r}; the Bedrock Mantle OpenAI Responses path only accepts 'auto'. Set
  `drop_params: true` (litellm_settings or this deployment's litellm_params) to have LiteLLM drop it, or set `model_reasoning_summary
  = "auto"` in the client (Codex CLI: ~/.codex/config.toml). Preserve Python repr and service-tier-first failure
  order. mantle_response_auth: Missing/falsey litellm_params becomes an empty GenericLiteLLMParams. Resolve api_key
  through B2207; a truthy bearer overwrites exact Authorization with Bearer {token}. No bearer leaves any existing
  Authorization header untouched here; B625 signing later removes it before SigV4. get_error_class preserves supplied
  message/status/headers through B682. supports_native_file_search and supports_native_websocket are both False,
  independent of the model. unsupported_params_warn_drop: With truthy drop_params, unsupported tier warns Bedrock
  Mantle Responses API: dropping unsupported service_tier %r (supported: %s). using the value and ['auto', 'default'],
  then returns a copy without service_tier. Unsupported summary warns Bedrock Mantle Responses API: dropping unsupported
  reasoning.summary %r (supported: %s). with ['auto']; remove only summary, retaining other reasoning fields, or
  remove reasoning entirely when empty. Neither helper mutates its input while dropping. openai_project_header:
  A truthy litellm_params.aws_bedrock_project_id overwrites exact OpenAI-Project on the same headers map and otherwise
  leaves it unchanged. Differently cased caller keys are not removed here. Reuse the B598 default-None loader and
  the B625 project-header cases. mantle_tool_filter: Allow exactly function,mcp,custom,namespace,tool_search,web_search
  through B907 drop_unsupported_tools; retain nondict tool entries and their order. Unsupported types, including
  absent type displayed as None, are reported as a sorted unique list; if nonempty warn Bedrock Mantle Responses
  API: dropping unsupported tool type(s) %s (supported: %s). with sorted allowed names ['custom','function','mcp','namespace','tool_search','web_search'].
  This drop happens regardless of drop_params. In map_openai_params, falsey tools pass unchanged, a list is used
  directly and any other truthy value is wrapped as one item. Assign the filtered list or pop tools if no entries
  remain. mantle_input_hoisting: Request transformation first calls B907 hoist_additional_tools on input and params.tools,
  then normalize_codex_input_items on hoisted.input. If rewritten types are nonempty, warn Bedrock Mantle Responses
  API: rewrote Codex input item type(s) %s that Mantle rejects. using the sorted type list, including types whose
  empty records were dropped. Only when hoisted.hoisted is truthy copy params and filter the combined hoisted.tools
  with the same allowlist; set tools when any remain, otherwise remove it. If no tools were actually hoisted, reuse
  the original optional-params record even if empty additional_tools items were removed from input. Delegate B507
  transform_responses_api_request with the original model, normalized input and selected params; preserve its body/error
  behavior.


  Write standalone Rust test mantle_responses_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test mantle_responses_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/mantle_responses.rs with adjacent tests under mantle_responses/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function mantle_responses_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): mantle_responses_url, mantle_response_options, mantle_model_name, unsupported_params_400, mantle_response_auth,
  unsupported_params_warn_drop, openai_project_header, mantle_tool_filter, mantle_input_hoisting. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_responses* using HelperCase: kind:
  helper and the externally tagged bedrock_mantle_responses variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_mantle_responses that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 171 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 295 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 660 planned, 675 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/mantle_responses.rs
  - crates/betterlite-bedrock/src/mantle_responses/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/mantle_responses.rs
  - tools/oracle/src/helpers/bedrock/mantle_responses/**
  - tools/oracle/helpers/bedrock_mantle_responses.py
  - tools/oracle/helpers/bedrock_mantle_responses/**
  - tools/oracle/cases/helpers/providers/bedrock-mantle-responses/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_mantle_responses*
  lint_tables: false
