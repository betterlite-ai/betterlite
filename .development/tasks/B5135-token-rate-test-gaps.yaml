dod:
  - text: >-
      batch-families-cross-different-thresholds.yaml sets output_cost_per_token_above_1500_tokens_batches
      "0.000005" and expects output 0.000005 at 2000 prompt tokens, and
      batch_families_select_independent_thresholds asserts the output tier rate too. Both fail once the
      output family borrows the input family's threshold or every family shares one threshold set.
    proof: [changed-cases, token-rate-tests, oracle]
  - text: >-
      fast-priority-and-invalid-nonnull-rate.yaml sets a standard output_cost_per_token 0.000003 and still
      expects output_rate 0, so it fails once an invalid nonnull output_cost_per_token_priority takes the
      missing key fallback.
    proof: [changed-cases, oracle]
  - text: >-
      The three reasoning cases with no off-peak block expect the tier reasoning rate, the tier output rate
      and the priority reasoning key, and the two native reasoning tests assert the same. They fail once
      tiered_reasoning_rate is ignored or the service reasoning key branch is deleted.
    proof: [token-rate-cases, token-rate-tests, oracle]
  - text: >-
      malformed-price-on-highest-crossed-threshold.yaml and
      malformed_price_on_crossed_threshold_keeps_that_threshold expect input 0.000001 and output 0.000008,
      and fail once a malformed price on a crossed threshold is skipped like a null.
    proof: [token-rate-cases, token-rate-tests, oracle]
  - text: >-
      crossed-threshold-overrides-every-rate.yaml and crossed_threshold_overrides_every_rate assert all five
      above-threshold rates, the two priority threshold cases and service_tier_threshold_keys_follow_the_request_tier
      assert the suffixed and fallback keys, and each fails once one lookup or the tier suffix is dropped
      from apply_threshold_overrides.
    proof: [token-rate-cases, token-rate-tests, oracle]
  - text: >-
      highest-crossed-nonnull-threshold-wins.yaml and highest_crossed_nonnull_threshold_wins expect the
      above_200 price at 300 prompt tokens beside a null above_250, and fail once the sort is ascending or
      the null skip is gone.
    proof: [token-rate-cases, token-rate-tests, oracle]
  - text: >-
      The three image token cases and image_token_rate_stands_in_for_unpriced_output expect
      output_cost_per_image_token for an absent or zero output price and the output price otherwise, and
      fail once the substitution in initial_base_rates is deleted.
    proof: [token-rate-cases, token-rate-tests, oracle]
  - text: >-
      xai-batch-threshold-is-inclusive.yaml, openai-batch-threshold-is-strict.yaml and
      batch_threshold_matches_provider_rule expect the 1k batch tier for xai and the flat batch rate for
      openai at exactly 1000 prompt tokens, and fail once batch rates compare strictly for xai.
    proof: [token-rate-cases, token-rate-tests, oracle]
  - text: >-
      deployment-keeps-every-custom-pricing-field.yaml sets all 119 CustomPricingLiteLLMParams fields to
      distinct values of their declared types and matches LiteLLM's 117 kept fields, so it fails once any
      wire name in deployment.rs is misspelled or missing.
    proof: [token-rate-cases, deployment-fields, oracle]
  - text: >-
      model-one-hour-zero-stays-zero.yaml, model-one-hour-price-survives-off-peak-creation.yaml and
      model_one_hour_price_is_kept expect the model's own one-hour price (0, then 0.000006 under an open
      off-peak window), and fail once resolve_standard_cost drops it.
    proof: [token-rate-cases, token-rate-tests, oracle]
checks:
  optional: []
  commands:
    - id: token-rate-tests
      why: The nine new native tests and the batch output tier key must exist and pass, or the branches they guard stay untested.
      run: test "$(grep -cE '^fn (reasoning_uses_selected_tier_rate_before_model_rate|reasoning_prefers_service_reasoning_key_over_service_output|malformed_price_on_crossed_threshold_keeps_that_threshold|crossed_threshold_overrides_every_rate|service_tier_threshold_keys_follow_the_request_tier|highest_crossed_nonnull_threshold_wins|image_token_rate_stands_in_for_unpriced_output|batch_threshold_matches_provider_rule|model_one_hour_price_is_kept)\(' crates/betterlite-models/src/token_rates/tests.rs)" = 9 && grep -q output_cost_per_token_above_1500_tokens_batches crates/betterlite-models/src/token_rates/tests.rs && cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^token_rates::/)'
    - id: token-rate-cases
      why: The sixteen new oracle cases must be added, not folded into the existing ones.
      run: test "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/token-rates | wc -l)" = 16
    - id: changed-cases
      why: The batch family and invalid nonnull cases must gain the keys that let them fail.
      run: grep -q output_cost_per_token_above_1500_tokens_batches tools/oracle/cases/helpers/token-rates/batch-families-cross-different-thresholds.yaml && grep -qE '^ +output_cost_per_token:[[:space:]]' tools/oracle/cases/helpers/token-rates/fast-priority-and-invalid-nonnull-rate.yaml
    - id: deployment-fields
      why: The deployment case must set every one of the 119 custom pricing fields.
      run: test "$(grep -cE '^ {6}[a-z][a-z0-9_]*:' tools/oracle/cases/helpers/token-rates/deployment-keeps-every-custom-pricing-field.yaml)" = 119
