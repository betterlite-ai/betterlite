out_of_scope:
  - >-
    The finding that ServiceTier::ALL in rates.rs must try _ultrafast before _fast is left out as wrong.
    LiteLLM sorts its suffixes longest first (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L63-L68) and ALL already holds the same order, but
    no order can change a result: "_fast" never occurs inside "_ultrafast", since the letter before
    "fast" there is "a", so a case with an absent ultrafast rate can't fail on the order it names.
  - >-
    Source files stay as they are: betterlite matches LiteLLM on every behavior above, and the oracle
    adapters tools/oracle/src/helpers/models/token_rates.rs and tools/oracle/helpers/token_rates.py
    already accept every input these cases send.
pitfalls:
  - >-
    The priority threshold key puts the suffix last, input_cost_per_token_above_100_tokens_priority; the
    input_cost_per_token_priority_above_200k_tokens spelling in LiteLLM's comment at https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L690-L692
    is never a candidate, since it doesn't start with input_cost_per_token_above_.
  - >-
    The one-hour above-threshold key has the threshold after the 1hr part,
    cache_creation_input_token_cost_above_1hr_above_100_tokens, and a key spelled any other way is
    ignored on both sides.
  - >-
    The null threshold in highest-crossed-nonnull-threshold-wins.yaml is YAML null. The string "null" is
    a malformed price: it selects its threshold and keeps the default instead of being skipped.
  - >-
    The reasoning cases leave off_peak_pricing out, since an open window with output_cost_per_reasoning_token
    returns before the tier and service steps they are meant to reach.
  - >-
    A tier table goes in the case's tiered_pricing field, as in tier-table-output-fallback-and-one-hour-zero.yaml;
    the Python adapter moves it into model_info, while a copy written inside model_info never reaches the
    Rust tier selection.
  - >-
    In the deployment case output_vector_size gets an int and search_context_cost_per_query a dict, and
    all 119 keys sit six spaces in under model_info, the indent the deployment-fields check counts.
  - >-
    No new case or test should fail on today's main; one that does shows a real difference from LiteLLM,
