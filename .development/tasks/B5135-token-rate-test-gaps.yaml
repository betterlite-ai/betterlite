    why: Service tier key suffix, threshold text parsing and the strict or inclusive crossing rule.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L294-L367
    why: Per-family batch thresholds, the priced tier and the tier reasoning rate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L585-L612
    why: Read only (B1669 owns it); a present one-hour price passes the off-peak step untouched.
