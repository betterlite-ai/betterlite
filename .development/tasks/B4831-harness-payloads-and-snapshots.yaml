id: B4831
title: Normalize harness payloads and derive workspace changes
description: >-
  Implement JSONL/object extraction, strict output schemas, tool-name expansion and skill file reads, together with workspace hashing and text diffs. Preserve the 50 MiB snapshot file limit, 16 MiB text capture budget, 256 KiB diff limit, sorted changes and symlink skips.

  Tool-name helpers map between harness-native tool names (which may be client-specific) and a normalized vocabulary shared across harnesses (read, write, edit, bash, etc.). normalize_tool_name reverses one mapping; native_tool_names expands multiple normalized names to their native equivalents. structured_output_instruction and strict_json_schema build instructions and schemas suitable for agent frameworks and OpenAI structured outputs. last_json_object finds the final JSON object in a text response. decode_json_line parses JSONL records from harness stderr and stdout. stderr_tail_text joins non-blank lines from stderr with newlines. read_skill_files collects (path, bytes) tuples from a skill folder, checking for a SKILL.md manifest.

  Snapshot functions hash workspace files and detect changes. snapshot_local_sync hashes every regular file under a root, skipping symlinks and the directories listed in HARNESS_SNAPSHOT_SKIP_DIRS: .git, node_modules, .venv, venv, __pycache__, .mypy_cache, .pytest_cache, .ruff_cache. diff_snapshots compares two snapshots to list created, modified and deleted files in sorted order. capture_text_contents reads small text files (<256 KiB) before a turn, with a total budget of 16 MiB (HARNESS_SNAPSHOT_MAX_TOTAL_BYTES), so "modified"/"deleted" diffs can include the old contents. build_file_changes constructs FileChange events for each difference, reading the new contents and building unified diffs. _as_text returns None for binary files (containing null bytes) or non-UTF-8 data. Files >50 MiB (HARNESS_SNAPSHOT_MAX_FILE_BYTES) are excluded entirely from snapshots.

scope:
  paths:
    - crates/betterlite-harness/src/payloads.rs
    - crates/betterlite-harness/src/snapshots.rs
    - crates/betterlite-harness/fuzz/fuzz_targets/payloads.rs
    - crates/betterlite-harness/fuzz/corpus/payloads/**
    - crates/betterlite-harness/fuzz/fuzz_targets/snapshots.rs
    - crates/betterlite-harness/fuzz/corpus/snapshots/**
    - crates/betterlite-harness/src/payloads/**
    - crates/betterlite-harness/src/snapshots/**
  lint_tables: false
