id: B224
title: Anthropic tool-history repair
description: >-
  Implement _sanitize_empty_text_content, _add_missing_tool_results, _is_orphaned_tool_result, _declared_tool_call_ids,
  group_tool_exchanges, _iter_tool_exchange_groups, sanitize_messages_for_tool_calling and _drop_unsignable_thinking_blocks.
  modify_params gates structural repairs; empty text normalization is unconditional. Return repair indices without
  content. All functions are pure and bounded, use injected policy and preserve source values. Budget 280 transforms/types,
  110 adapters, 300 tests and 60 wiring (750 total). Write the behavior rstest functions anthropic_history_behavior_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. Register helper operations anthropic_history in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/lib.rs
  - crates/betterlite-prompts/src/error.rs
  - crates/betterlite-prompts/src/anthropic_history.rs
  - crates/betterlite-prompts/src/anthropic_history/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/anthropic-history/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L1989-L2339
  why: Exact function/branch ownership.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::anthropic_history_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'anthropic_history' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/anthropic-history/missing-result.yaml
- tools/oracle/cases/helpers/anthropic-history/orphan-result.yaml
- tools/oracle/cases/helpers/anthropic-history/duplicate-result.yaml
- tools/oracle/cases/helpers/anthropic-history/reused-id-next-turn.yaml
- tools/oracle/cases/helpers/anthropic-history/repair-disabled.yaml
- tools/oracle/cases/helpers/anthropic-history/empty-text.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B180 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
