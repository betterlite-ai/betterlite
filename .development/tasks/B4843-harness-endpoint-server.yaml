id: B4843
title: Serve authenticated per-session harness model endpoints
description: >-
  A CLI harness inside the sandbox sends its model calls to a small HTTP server on the host, bound to loopback and protected
  by a random per-session token. This task builds that server: start it on a free port, route the six paths, check the
  token, parse the body, hand the request to the relay, and stop it. Everything else is built already and is called, not
  rebuilt. B4841 (crates/betterlite-harness/src/endpoint.rs) owns `ModelEndpoint` with its fields, `token`, `usage`, the
  auth check (`_authorized`, `_unauthorized`), `_json`, `_error`, `_secrets`, `_record`, `route_of` and `extract_token`.
  B4842 (crates/betterlite-harness/src/relay.rs) owns the per-request work: `_forward` for gateway mode and `_call_sdk` for
  SDK mode, `RelayReply` and the `GatewaySend` and `SdkCalls` traits. Read both files on main for the exact Rust names and
  signatures before you write code, and do not copy their logic.


  Put the code in a new module `serve` (crates/betterlite-harness/src/serve.rs and src/serve/), because endpoint.rs belongs
  to B4841. The module has `EndpointServer` (the port of `ModelEndpoint.start`, `stop`, `__aenter__`, `__aexit__` and `url`),
  `serve/routes.rs` (the port of `_build_app`, `_handle` and `_models`), `serve/body.rs` (request body parsing) and
  `ServeError`, the module's own error enum (thiserror) with variants for a bind failure and for a failed stop.


  Start (`start`, L406-L418). `EndpointServer::start` takes an `Arc<ModelEndpoint>`, the gateway sender and the SDK caller
  as arguments, so tests inject fakes. The gateway sender is `Arc<dyn GatewaySend>`; `_gateway_client` (L430-L441) becomes a
  plain function `gateway_sender` that returns the injected sender when there is one, and otherwise B4842's production
  sender around a shared `betterlite_http::ProxiedClient` with the 600 second deadline (`HARNESS_ENDPOINT_REQUEST_TIMEOUT_SECONDS`).
  The sender is built only when the endpoint has a gateway target, as Python builds its client only then. Bind a
  `tokio::net::TcpListener` on `127.0.0.1` (`HARNESS_ENDPOINT_HOST`) with port 0, read the chosen port from `local_addr()`,
  and run `axum::serve` on it in a spawned task with `with_graceful_shutdown`. The accessors are `port()`, `url()` (the text
  `http://127.0.0.1:<port>`) and `endpoint()` (the shared `ModelEndpoint`, so the session runtime reads its usage). A
  bind failure returns `ServeError` and leaves nothing running.


  Stop (`stop`, L419-L429). Signal the graceful shutdown, then wait for the server task for at most 5 seconds
  (`HARNESS_PROCESS_KILL_GRACE_SECONDS`, uvicorn's `timeout_graceful_shutdown`). When the wait runs out, abort the task, so
  open connections and streaming bodies are dropped; B4842's record guard then still records their usage. Stopping twice, or
  stopping a server that never started, does nothing. Never close the gateway sender: it may be shared or injected. After
  stop the port refuses connections.


  Routes (`_build_app`, L467-L484). POST on `/messages`, `/chat/completions`, `/responses` and the same three under `/v1`
  (`/v1/messages`, `/v1/chat/completions`, `/v1/responses`) all go to one handler. GET on `/models` and `/v1/models` go to
  the models handler. Build the paths from the two prefixes `""` and `"/v1"` and the three route names, not as six literals
  written by hand. Any other path is 404 and any other method on these paths is 405, both with an empty body that
  carries no secrets.


  Models (`_models`, L512-L518). With a bad token, answer B4841's 401 reply. Otherwise answer 200 with
  `{"object": "list", "data": [...]}`. `data` holds one entry `{"id": <model>, "object": "model", "created": 0, "owned_by":
  "litellm"}` when the endpoint has a model, and is empty when it has none.


  Handle (`_handle`, L519-L532). Check the token first with B4841's check, and answer 401 before reading the body. Then
  parse the body with `parse_request_body(bytes) -> Result<serde_json::Map, BodyError>`: it accepts exactly one JSON object
  and nothing else. Invalid JSON, invalid UTF-8 and an empty body are status 400 through B4841's `_error`, with error type
  `JSONDecodeError` (invalid UTF-8: `UnicodeDecodeError`). A valid JSON value that is not an object (an array, a string, a
  number, `null`) is status 400 with error type `ValueError` and message `request body must be a JSON object`. Error
  messages for the JSON cases are betterlite's own. Cap the body read at 64 MiB with axum's body limit, since the listener
  is local but a harness can send large contexts; a larger body is 413. Then take `route_of` of the request path. With a gateway target, call B4842's
  forward with the request headers, the route and the body. Without one, call B4842's SDK call with the route and the body.
  Turn the `RelayReply` into the axum response: `Json { status, body }` becomes a JSON response with that status, and
  `Stream { status, headers, media_type, body }` becomes a streaming response with those headers and the media type, and the
  body stream passed through without buffering or changing a byte.


  Decoder fuzzing. `parse_request_body` reads bytes from outside. Add the cargo-fuzz target
  crates/betterlite-harness/fuzz/fuzz_targets/endpoint_body.rs, which calls it on arbitrary bytes and checks that it never
  panics and that a success is always an object. Add at least four corpus seeds under
  crates/betterlite-harness/fuzz/corpus/endpoint_body/ (an object, an empty file, an array, bad UTF-8) and a test named
  `replays_the_endpoint_body_corpus` that runs every file of that folder through the function. The fuzz Cargo.toml is written
  by the architect.


  This task adds `axum` (workspace dependency) and the `net`, `sync` and `macros` features of `tokio` to
  crates/betterlite-harness/Cargo.toml; B4842 added the http, core and sdk crates. axum does not depend on the harness
  crate, so there is no cycle. Tests use real loopback sockets on port 0 with a hand-written HTTP/1.1 client over
  `tokio::net::TcpStream` and fake `GatewaySend` and `SdkCalls` implementations; no external network. The local endpoint is
  not a proxy route, so the task has no HTTP oracle cases.
scope:
  paths:
    - crates/betterlite-harness/Cargo.toml
    - Cargo.lock
    - crates/betterlite-harness/src/serve.rs
    - crates/betterlite-harness/src/serve/**
    - crates/betterlite-harness/fuzz/fuzz_targets/endpoint_body.rs
    - crates/betterlite-harness/fuzz/corpus/endpoint_body/**
  lint_tables: false
