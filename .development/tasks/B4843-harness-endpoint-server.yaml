dod:
  - text: >-
      A started server listens on 127.0.0.1 at a free port, `url()` is `http://127.0.0.1:<port>`, and after `stop` the port
      refuses connections; stopping twice does nothing.
    proof: [serve-lifecycle]
  - text: >-
      A stop with a request still streaming waits at most 5 seconds, then drops the connection, and the dropped relay still
      records its usage.
    proof: [serve-lifecycle]
  - text: >-
      POST to each of `/messages`, `/chat/completions`, `/responses` and their `/v1` forms reaches the handler, GET on
      `/models` and `/v1/models` reaches the models handler, and an unknown path is 404 and a wrong method is 405.
    proof: [serve-routes]
  - text: >-
      A POST or GET without the session token, or with a wrong one, is 401 with error type `authentication_error`, and the
      body is not read or relayed; the token is accepted as `Authorization: Bearer` and as `x-api-key`.
    proof: [serve-routes]
  - text: >-
      The models list holds the endpoint model with owned_by `litellm` and created 0, and is empty when the endpoint has no
      model.
    proof: [serve-routes]
  - text: >-
      Invalid JSON, invalid UTF-8 and an empty body are 400 with type `JSONDecodeError` or `UnicodeDecodeError`, and a JSON
      array, string, number or null is 400 with type `ValueError`; none of them reaches the relay and no secret appears in
      the message.
    proof: [serve-routes, serve-body]
  - text: >-
      A request on an endpoint with a gateway target goes to the gateway forward and one without goes to the SDK call, with
      the route from `route_of` and the parsed object; a JSON reply and a streaming reply are returned with the relay's
      status, headers and bytes unchanged.
    proof: [serve-routes]
  - text: >-
      `parse_request_body` accepts exactly one JSON object, and the fuzz target and a nonempty corpus replay without a panic.
    proof: [serve-body, serve-body-corpus]
  - text: The harness crate depends on axum and the tokio net feature and builds with no dependency cycle.
    proof: [serve-deps]
checks:
  optional: []
  commands:
    - id: serve-lifecycle
      why: server start, port reporting, stop, the 5 second grace or double stop is missing or wrong
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^serve::tests::lifecycle/)'
    - id: serve-routes
      why: route table, token check, models list, error replies or the gateway and SDK dispatch is missing or wrong
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^serve::routes::/)'
    - id: serve-body
      why: request body parsing accepts or rejects the wrong input
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^serve::body::/) - test(replays_the_endpoint_body_corpus)'
    - id: serve-body-corpus
      why: the fuzz target, its corpus or the replay test is missing
      run: test -f crates/betterlite-harness/fuzz/fuzz_targets/endpoint_body.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-harness/fuzz/corpus/endpoint_body)" && cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(replays_the_endpoint_body_corpus)'
    - id: serve-deps
      why: the harness crate does not yet depend on axum
      run: grep -q '^axum' crates/betterlite-harness/Cargo.toml && cargo tree --locked -p betterlite-harness -e normal > /dev/null
oracle_cases: []
deviations:
  - what: The listener is bound before the server task starts, so there is no startup wait loop and no 10 second startup timeout (`HARNESS_ENDPOINT_STARTUP_TIMEOUT_SECONDS`); a bind failure returns an error at once.
    why: Rust knows the port as soon as the bind returns; Python had to poll uvicorn's `started` flag.
  - what: starlette and uvicorn are not optional, so the `MISSING_DEPS_MESSAGE` install error and `_load_server_deps` do not exist.
    why: axum is compiled into the binary; there is nothing to import at runtime.
  - what: A request body over 64 MiB is answered with 413.
    why: Starlette reads any size into memory; a local endpoint still should not let a runaway client exhaust the host. No harness sends a body near this size.
  - what: Error text for invalid JSON is betterlite's own, with Python's exception class names kept as the error type.
    why: Error messages are betterlite's own under rule errors-match-litellm; the type name is what a harness client can match on.
  - what: The server does not install or avoid signal handlers (`capture_signals`, `install_signal_handlers`).
    why: axum never touches the host process's signals, so the Python workaround has nothing to port.
  - what: 404 and 405 replies have an empty body, not Starlette's plain-text "Not Found" and "Method Not Allowed".
    why: No harness reads these bodies; axum's defaults are kept.
out_of_scope:
  - ModelEndpoint fields, the session token, usage tracker, auth check, `_json`, `_error`, `_secrets`, `_record`, `route_of`, `extract_token` and the header and chunk helpers (B4841).
  - The gateway forward, SDK call, SDK stream, `RelayReply`, `GatewaySend`, `SdkCalls` and the production gateway sender (B4842).
  - Opening and closing the endpoint around a session and reading its usage into the session result (`runtime.py` `_open_endpoint` and `_close_endpoint`, owned by the runtime task).
  - "`_noop`, `_ServerDeps`, `_load_server_deps` and `_build_server`'s signal-handler patches: no Rust equivalent, see deviations."
pitfalls:
  - "`_handle` checks the token before it reads the body, so an unauthenticated request with a huge or invalid body gets 401, not 400."
  - "Python parses with `json.loads`, so a body of `null`, `[]` or `\"x\"` is valid JSON and must fail the object check with `ValueError`, not the parse step with `JSONDecodeError`."
  - "Both prefixes apply to POST and to GET models: `/v1/models` and `/models` exist, but there is no `/v1/v1/...` and no GET on `/messages`."
  - "The token can arrive as `Authorization: Bearer <token>` or as `x-api-key`, and `extract_token` looks at the bearer header first; reuse B4841's check, do not re-parse headers here."
  - "`_models` returns an empty `data` list, not `[{\"id\": null}]`, when the endpoint has no model."
  - "The port is 0 on purpose: two sessions on one host must never share a port, so tests start two servers and compare ports."
  - "On stop, aborting the server task must drop in-flight response bodies; a body held somewhere else would keep B4842's record guard from firing."
  - "The gateway sender exists only in gateway mode; building a `ProxiedClient` for an SDK-mode endpoint would open a pool nobody uses."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
