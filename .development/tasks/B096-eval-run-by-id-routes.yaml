deviations:
  - what: A cancel or delete body that isn't valid JSON, or is JSON but not an object, answers 400 invalid_request_error with param request_body instead of LiteLLM's 500 "Internal Server Error" text.
    why: LiteLLM calls orjson.loads and then indexes the result outside its try block, so the error escapes to Starlette's plain 500; betterlite answers it as the client error it is, the same way B3426, B3427 and B3428 answer it for the other eval routes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_evals_endpoints/endpoints.py#L899-L905
out_of_scope:
  - "The other eight eval routes: B3426, B3427 and B3428; their mount and HTTP cases: B8775 and B8776."
  - "aget_run, acancel_run and adelete_run: B3425. Their HTTP handlers: B9371. The provider transforms: B523. The reply models: B3420."
  - "The call path after pre-call (blocked check, deployment credentials, not-found): B9372. The pre-call step: B8801 and B8802."
  - "ProxyBaseLLMRequestProcessing.base_process_llm_request and _handle_llm_api_exception in litellm/proxy/common_request_processing.py: B004; authentication: B756."
  - "litellm/evals/__init__.py only re-exports the main.py functions; the Python package's evals module is B7886. litellm/proxy/openai_evals_endpoints/__init__.py only re-exports the router."
pitfalls:
  - "get_run takes the model from the header first and cancel_run and delete_run from the body first (`data.get(\"model\") or query or header`); copying one rule to all three routes breaks two of them."
  - "cancel_run is POST on /v1/evals/{eval_id}/runs/{run_id}; the docstring's curl with /cancel is wrong, so that URL is a 404, and only the upstream URL gets /cancel."
  - "get_run sets custom_llm_provider from the query unconditionally (its data never has the key), while cancel and delete keep a body key even when it is null."
  - "FastAPI serializes the reply through response_model, so extra upstream fields are dropped and every unset optional Run field comes back as null; returning the upstream JSON as is shows a different body."
  - "An upstream 404 on GET reaches transform_get_run_response because LiteLLM's GET doesn't raise for status, so its answer differs from the 409 on cancel that goes through _handle_error; the cases must take both from LiteLLM, not guess."
  - "The no-router not-found message for cancel names \"/evals/{eval_id}/runs/{run_id}/cancel\", the endpoint mapping's text, not the route path."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
