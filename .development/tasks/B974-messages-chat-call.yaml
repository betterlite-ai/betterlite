id: B974
title: Execute Messages through the chat adapter
description: >-
  Implement api::messages_chat_call for adapters/handler.py _prepare_completion_kwargs and both complete
  handler methods at L466-L824, plus ANTHROPIC_ONLY_REQUEST_KEYS and the adapter instance. Compose B967 input/
  output translation, B973 context preparation, B2433 reasoning policy, B962 local-model/logging helpers and
  B014 completion execution. Sync and async calls share native preparation but preserve their different proxy
  router fallback behavior. stream defaults false; max_tokens is required here, with no DEFAULT_MAX_TOKENS lookup.

  HelperCall::MessagesCompletionArguments tests only the pure kwargs builder with a typed adapter-result seam
  for its otherwise unreachable null-result failure. SdkHttpCall::MessagesChatCall uses B2401 for both sync and
  async executions, including actual streaming HTTP and summary requests. Return normalized decoded Anthropic
  events while retaining raw frames as artifacts. Do not invoke a FastAPI function. B967/B977 own stream parsing
  and emission; this task introduces no new byte decoder or config setting. Own 289 nonblank/non-comment physical
  lines plus the two constant/instance assignments; budget 270 implementation, 175 tests, 180 fixtures,
  130 adapters and 35 wiring, 790 total. Tests use api::messages_chat_call.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/messages_chat_call.rs
  - crates/betterlite-core/src/api/messages_chat_call/**
  - tools/oracle/src/helpers/core_ops/messages_completion_arguments.rs
  - tools/oracle/src/helpers/core_ops/messages_completion_arguments/**
  - tools/oracle/helpers/messages_completion_arguments.py
  - tools/oracle/helpers/messages_completion_arguments/**
  - tools/oracle/cases/helpers/messages-completion-arguments/**
  - tools/oracle/fuzz/corpus/helper_case/messages_completion_arguments-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/messages_chat_call.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/messages_chat_call.py
  - tools/oracle/cases/sdk-http/messages-chat-call/**
  - tools/oracle/fuzz/corpus/sdk_http_case/messages-chat-call-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/handler.py#L39-L49
  why: Own the exact output_config/safeguards exclusion set and completion kwargs shape.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/handler.py#L466-L601
  why: Whole request assembly, non-null versus truthy parameters, extras precedence and reasoning-policy order.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/handler.py#L603-L824
  why: Both handlers retain complete call argument lists, distinct router fallback and all adapter-null errors.
dod:
- text: >-
    completion_argument_presence always translates model/messages/max_tokens. Empty metadata,stop_sequences,
    system,thinking,tool_choice,tools,output_format are omitted before translation; temperature=0,top_k=0,top_p=0
    remain. output_config is forwarded to the translator whenever its extra key exists, including null/{}.
    Nonstring custom_llm_provider is passed to the translator as null. A null translated request raises
    ValueError("Failed to translate request to OpenAI format") before completion; no HTTP status/param/code is invented.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    extras_and_logging_precedence excludes exactly output_config,safeguards,anthropic_messages from raw extras.
    Other non-null extras fill only absent translated keys; translated temperature/max_tokens win conflicts.
    Explicit non-null prompt_cache_key overrides even with ""; null does not override a derived key. stream=true
    inserts stream=true,stream_options={include_usage:true}; false/null omits these unless an otherwise allowed
    raw extra fills a missing key. A real litellm_logging_obj gets call_type=anthropic_messages and the current
    stream_options (null if absent) before merge; an unrelated object is not mutated. Normalize effort, promote
    OpenAI thinking, then recover plain-chat effort in that exact order through B2433.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    messages_chat_http sends max_tokens=32,model=openai/gpt-4o-mini,messages=[{role:user,content:Hi}],temperature=0
    and api_key=sk-test. Both sync and async make one POST /v1/chat/completions with model=gpt-4o-mini, user Hi,
    max_tokens=32,temperature=0 and Authorization="Bearer sk-test". Mock chat id=chat_a,assistant text=Hello,
    finish_reason=stop,usage=5/2 yields B967's message response with text Hello,stop_reason=end_turn and usage5/2.
    Raw output_config,safeguards and anthropic_messages never reach provider JSON; configured schema travels as response_format.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    sync_async_context_routing pops context_management and litellm_router before main completion. Async uses
    explicit non-null router else the proxy fallback; sync uses only the explicit router and never borrows the
    proxy's async clients. Sync skips context preparation only when context_management is null and no client
    compaction block exists; explicit {} still enters preparation. Both pass extracted proxy metadata/principal
    to B973 and use returned messages/system even when empty. A compact case captures summary then main HTTP;
    a clear case shows cleared history in main HTTP, for both call modes. _is_async=true selects the async path.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    restored_tools_and_polyfill sends a 65-character tool name and a mock call using B1117's truncated name.
    Output tool_use restores the original name. A successful summary adds its compaction block before the main
    answer, with context_management.applied_edits and usage.iterations from the same PolyfillResult. Context-only
    errors retain their literal status/message from B973 and prevent the main request.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    streamed_chat_result sends stream=true and expects stream_options.include_usage=true in the captured POST.
    Mock text/finish/usage chunks produce message_start,content_block_start,content_block_delta,content_block_stop,
    message_delta,message_stop through B967/B977 for sync and async. The stream's model is local_model_name of
    the original requested model, not a responses/-rewritten target; tool map,polyfill result and actual logging
    object are forwarded. B967-null output raises ValueError("Failed to transform streaming response") after
    the provider call; null nonstream output raises ValueError("Failed to transform response to Anthropic format").
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    chat_provider_failure gives one mock 401 with retries disabled and expects B011 AuthenticationError status401,
    type/param/code null, with its captured message subject only to B011 wording normalization. This handler
    does not catch or remap it to a proxy envelope. A stream failure remains a B977 error event, not a second POST.
  proof: [behavior-tests, oracle, python-adapters]
- text: Argument and HTTP variants are independently exercised by newly added fixtures and shared-decoder seeds.
  proof: [new-cases, corpus, oracle, python-adapters]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: final kwargs or sync/async execution behavior is absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_call::/)'
  - id: python-adapters
    why: the argument or provider-execution adapter is not independently checked
    run: test -f tools/oracle/helpers/messages_completion_arguments.py && test -f tools/oracle/sdk_http/messages_chat_call.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpus
    why: a chat-call operation cannot be selected by the oracle
    run: grep -qE '^[[:space:]]+messages_completion_arguments:' tools/oracle/fuzz/corpus/helper_case/messages_completion_arguments-* && grep -qE '^[[:space:]]+messages_chat_call:' tools/oracle/fuzz/corpus/sdk_http_case/messages-chat-call-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus) | test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: kwargs and provider traffic have no new comparison fixtures
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-completion-arguments)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/messages-chat-call)"
