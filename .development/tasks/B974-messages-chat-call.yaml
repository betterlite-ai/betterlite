deviations: []
out_of_scope:
- B973 owns adapters/handler.py L51-L312; B2433 owns L322-L464 reasoning policy. Shared type aliases have no extra behavior.
- B967 owns translation/factory composition, B977 actual streaming, B962 model-name/logging helpers and B014 provider completion orchestration.
- B081 owns auth, aliases and Messages HTTP error envelopes; this SDK handler never registers a route.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_completion_arguments in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_completion_arguments.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_completion_arguments.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Sync context management must not attach the proxy router implicitly because its clients belong to another event loop.
- Explicit prompt_cache_key overrides a translated key even when it is the empty string.
- Re-merging output_config after translation leaks an Anthropic-only parameter to chat providers.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
