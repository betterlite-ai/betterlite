  commands:
    - id: codex-settings-fingerprinting
      why: Receipt path derivation, snapshot extraction, or fingerprint determinism is missing or incorrect.
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_settings::tests::(?:receipt_path_deterministic|snapshot_missing_sentinel|fingerprint_determinism|snapshot_extracted_correct|snapshot_restored_modified|snapshot_missing_returns_none)/)'
    - id: codex-settings-version-check
      why: Version check against 0.129.0 or version command parsing is missing or incorrect.
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_settings::tests::(?:version_gate_met|version_gate_old_rejected|version_not_installed)/)'
    - id: codex-settings-configure-flow
      why: Receipt staging order, settings commit failure handling, or Authorization header building is incorrect.
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_settings::tests::(?:configure_receipt_staged_first|configure_settings_failure_discards_settings_keeps_receipt|configure_settings_rollback_restores_receipt|configure_builds_authorization_header|configure_selects_model_and_provider)/)'
    - id: codex-settings-unconfigure-outcome
      why: Unconfigure does not correctly classify restored, kept or file_removed fields.
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_settings::tests::(?:unconfigure_restored_classification|unconfigure_kept_classification|unconfigure_file_removed_classification)/)'
    - id: codex-settings-preflight
      why: Preflight validation for version, TOML structure or receipt is missing or does not fail correctly on invalid input.
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^codex_settings::tests::(?:preflight_codex_validates_version|preflight_codex_validates_toml|preflight_codex_validates_receipt)/)'
oracle_cases: []
deviations: []
out_of_scope:
  - Command registration and CLI integration. B4571 owns configure_codex and reconfigure_codex commands;
    B4572 owns unconfigure_codex. This task builds the configuration logic only.
  - Management client HTTP calls to the proxy. The CLI dispatches configure operations with injected
    HTTP clients, not direct calls to server route handlers.
  - Claude settings configuration, merge logic and receipts. B4562 and B4563 own those; this task
    handles only Codex (OpenAI-style) provider settings in TOML.
pitfalls:
  - >-
    Fingerprints must hash the "missing" sentinel (JSON null or a string "missing") the same way as absent values,
    so restore-only-owned behavior works correctly across Codex versions.
  - >-
    Receipt paths are keyed by the resolved settings_path, so symlinks and relative paths must be resolved before hashing.
    Multiple receipts for the same logical config are an error.
  - >-
    The Authorization header is built directly from api_key without additional escaping or encoding; the value must
    survive TOML parsing and be read back byte-for-byte by Codex.
  - >-
    Commit order matters: stage receipt first, then settings, so that a settings-commit failure leaves a usable receipt
    for retry. Rollback must restore the receipt to its prior state if settings fails.
  - >-
    TOML modification preserves comments and whitespace through tomlkit; naive re-parsing or string substitution loses
    both and corrupts user edits.
  - >-
    Unconfigure classifies fields independently: restored (changed), kept (unchanged), file_removed (whole file deleted).
    A field in `kept` is still owned but unchanged, so no action is needed.
  - >-
    The 0.129.0 version gate is not negotiable; older Codex versions allow repository settings to redirect authenticated
    requests, creating a security issue.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
