id: B4569
title: Persistent Codex provider settings and undo
description: >-
  Build TOML-based Codex provider configuration with comment preservation, fingerprint-based ownership
  and safe undo. Stage the receipt JSON before the settings file so that settings-write failures leave
  a usable receipt for retry; on settings failure, restore the receipt to its prior state and discard
  the staged settings.

  The Codex agent reads base_url and model from its home/config.toml. configure_codex_settings injects
  the proxy gateway URL, an Authorization header with the API key, and the selected model. Ownership
  is tracked per field using SHA256 fingerprints: a field is ours if its current fingerprint matches
  what we wrote. Unconfigure restores only our owned fields, leaves unknown fields untouched, and
  classifies each field as restored (changed), kept (unchanged), or removed (file deleted if empty).

  Receipt files live in ~/.litellm/codex_configure_<hash>.json, keyed by the resolved settings path,
  so each settings file gets its own undo receipt. require_safe_codex does a version preflight:
  the Codex CLI must be 0.129.0 or newer (stable) because older versions allow repository settings
  to redirect authenticated requests.

  Snapshots are TOML fragments with structure {value: <thing>}, so fingerprints hash both the value
  and the "missing" sentinel identically across multiple reads. The Authorization header is built
  directly from the api_key parameter and written into settings.toml as Bearer <api_key>, so this
  entire task is the receipt/fingerprint machinery for installing and later removing that credential
  from the user's Codex config.

  Preserve comment and whitespace preservation from tomlkit (no re-parsing), the SHA256 fingerprint
  algorithm, the receipt-first-then-settings commit order, rollback-on-failure paths with receipt
  restoration, field classification (restored/kept/file_removed) on unconfigure, and the 0.129.0
  version gate.
