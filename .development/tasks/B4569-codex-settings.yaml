dod:
  - text: >-
      Case receipt_path_deterministic verifies that codex_configure_state_path returns the same path
      for the same settings_path across multiple calls. Case snapshot_missing_sentinel verifies that
      _fingerprint returns the same hash for None (missing) as for the string "missing". Case
      fingerprint_determinism verifies that _fingerprint returns the same hash for the same TOML value
      across multiple invocations.
    proof: [codex-settings-fingerprinting]
  - text: >-
      Case snapshot_extracted_correct and snapshot_restored_modified verify that _snapshot extracts the
      correct value from nested TOML paths and that modifications apply correctly to the document.
      Case snapshot_missing_returns_none verifies None for missing paths.
    proof: [codex-settings-fingerprinting]
  - text: >-
      Case version_gate_met verifies that require_safe_codex succeeds for version 0.129.0 and newer.
      Case version_gate_old_rejected verifies that 0.128.9 is rejected. Case version_not_installed
      verifies that missing Codex (codex --version fails) raises CodexSettingsError.
    proof: [codex-settings-version-check]
  - text: >-
      Case configure_receipt_staged_first verifies that configure_codex_settings stages the receipt JSON
      before the settings TOML. Case configure_settings_failure_discards_settings_keeps_receipt verifies
      that if the settings commit fails, the receipt remains and the settings are discarded. Case
      configure_settings_rollback_restores_receipt verifies that if settings commit fails and an earlier
      receipt existed, it is restored and receipt-restore failures halt the rollback with a specific error.
    proof: [codex-settings-configure-flow]
  - text: >-
      Case configure_builds_authorization_header verifies that the Authorization header is set to
      f"Bearer {api_key}" and appears in the provider config at model_providers.litellm.http_headers.
      Case configure_selects_model_and_provider verifies that model_provider is set to CODEX_PROXY_PROVIDER
      and model is set to the selected model name.
    proof: [codex-settings-configure-flow]
  - text: >-
      Case unconfigure_restored_classification verifies that fields owned by an earlier configure
      (fingerprint matches) that differ from the current document are listed as restored. Case
      unconfigure_kept_classification verifies that owned fields that still match their receipt
      snapshot are listed as kept. Case unconfigure_file_removed_classification verifies that
      file_removed is true only when the resulting document is empty and the file did not exist before.
    proof: [codex-settings-unconfigure-outcome]
  - text: >-
      Case preflight_codex_validates_version verifies that preflight_codex_settings runs the version check.
      Case preflight_codex_validates_toml verifies that it parses and validates the TOML structure
      (model_providers must be a table). Case preflight_codex_validates_receipt verifies that it checks
      for a valid existing receipt.
    proof: [codex-settings-preflight]
