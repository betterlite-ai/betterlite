checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_history::/) - test(/::replays_corpus$/)'
  - id: case-latest-compaction-cut
    why: the latest-compaction-cut behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_history::tests::latest_compaction_cut($|::)/)'
  - id: case-summary-in-system
    why: the summary-in-system behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_history::tests::summary_in_system($|::)/)'
  - id: case-trigger-token-threshold
    why: the trigger-token-threshold behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_history::tests::trigger_token_threshold($|::)/)'
  - id: case-last-user-question-preserved
    why: the last-user-question-preserved behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_history::tests::last_user_question_preserved($|::)/)'
  - id: case-client-compaction-history
    why: the client-compaction-history behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_history::tests::client_compaction_history($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/summary_history.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/summary_history-*)"
      && grep -qE "^[[:space:]]+summary_history:" tools/oracle/fuzz/corpus/helper_case/summary_history-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/summary-history)"
