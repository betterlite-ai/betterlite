id: B971
title: Preserve history and build compaction summary prompts
description: >-
  Implement summary_history for all compact.py helpers at L630-L1016 and apply_client_compaction_block_history
  L1114-L1157, plus _PROPAGATED_METADATA_KEYS and _SUMMARY_TAG_RE. These operate on parsed messages and response
  text; provider response byte decoding stays with the provider. Use B964 message conversion with
  preserve_midturn_system=true, B2431 tool conversion, B013 token counting, B968 constants/results and B969's
  identity/tool-result predicates. No summary is sent here. Do not depend on B972 or its execution part, which
  call these helpers.

  Register HelperCall::SummaryHistory actions for slicing, trigger, prompts, metadata, count, extraction and
  client_history. Token-count fixtures record the exact calls and use scripted counts plus a real B013 case.
  Independently invoke the Python helpers, including their diagnostic fallbacks. Keep message copying and
  concatenation separate from transport. Tests under api::summary_history cover each named case below.
  The owned spans have 358 nonblank/non-comment physical lines plus 19 metadata/regex lines; allow 310 production,
  170 tests, 160 fixtures, 100 adapters and 35 wiring, 775 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/summary_history.rs
  - crates/betterlite-core/src/api/summary_history/**
  - tools/oracle/src/helpers/core_ops/summary_history.rs
  - tools/oracle/src/helpers/core_ops/summary_history/**
  - tools/oracle/helpers/summary_history.py
  - tools/oracle/helpers/summary_history/**
  - tools/oracle/fuzz/corpus/helper_case/summary_history-*
  - tools/oracle/cases/helpers/summary-history/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L73-L92
  why: The complete metadata allowlist and case-insensitive multiline summary tag matcher.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L630-L855
  why: Latest-block slicing, strict trigger validation, prompt selection, metadata and downstream-shaped token counting.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L858-L1016
  why: Text flattening differs between counting and summary prompts; user-turn merging avoids consecutive user messages.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L1114-L1157
  why: Client-supplied compaction blocks take effect even without a context_management edit.
dod:
- text: >-
    latest_compaction_boundary puts two compaction blocks in one turn and another in an earlier turn. Select the
    final block by message then block index regardless of role; remove all earlier messages and same-turn blocks,
    retain that block and the following tail. No block returns original messages and null. Stripping removes all
    compaction blocks, drops turns whose list becomes empty (including already-empty lists), leaves scalar content
    and other fields unchanged, and does not mutate inputs.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    summary_system_shapes prefixes summary S as "Previous conversation summary: S" for null system, and
    "Previous conversation summary: S\n\nX" for string X. A list modifies only its first text block, preserving
    cache_control and using empty text for null/missing text; no text block inserts a new text block first.
    Null-system prefixes rstrip trailing whitespace. Counting flattens nonempty string text blocks with one newline;
    summary system messages join them with two newlines, ignore non-text/nonstrings and return null for no text.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    compaction_trigger_validation defaults missing/null/false/empty trigger and missing value to 150000.
    Truthy non-dict trigger warns trigger_not_a_dict_using_default; type=tool_uses warns
    unsupported_trigger_type_tool_uses_using_input_tokens but still uses its integer value. Noninteger value "60000"
    warns trigger_value_not_int_using_default and returns 150000. Value 50000 succeeds, while 49999 and booleans
    raise status 400 with "context_management.compact_20260112.trigger.value must be at least 50000 tokens";
    no type/param/code is added by this exception helper. Combined warnings retain source order.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    summary_instruction_selection preserves custom instructions "  summarize  " exactly and does not append a
    tool prohibition. Missing/nonstring/whitespace-only instructions use B968's exact default instructions, adding
    " Do not call any tools while writing this summary; respond with text only." only for nonempty tools.
    extract_summary_text accepts case-insensitive multiline <SUMMARY> A\nB </SUMMARY>, returns "A\nB", picks the
    first non-greedy match, and returns null for absent tags, empty text or a whitespace-only first match even if
    a later summary is nonempty.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    summary_metadata_allowlist retains present values including null for exactly user_api_key,user_api_key_alias,
    user_api_key_team_id,user_api_key_team_alias,user_api_key_user_id,user_api_key_user_email,user_api_key_org_id,
    user_api_key_project_id,user_api_key_end_user_id,user_api_end_user_max_budget,user_api_key_model_max_budget,
    user_api_key_team_model_max_budget,user_api_key_user_model_max_budget,user_api_key_end_user_model_max_budget,
    litellm_call_id,litellm_parent_otel_span. Missing/empty parent returns {}; arbitrary client keys and
    allowed_model_region are dropped. The latter travels separately in B2432.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    effective_token_components strips compaction blocks, converts messages with preserve_midturn_system=true
    and tools to function schema, and counts model/messages/tools once. A nonempty compaction content adds a
    separate text count; system text adds another. Counts 10,3,4 return 17; null compaction prevents that 3.
    Translation failure logs debug "compact_20260112: anthropic→openai translation failed during token count, falling back to raw messages: broken"
    and uses stripped raw messages; tool conversion failure logs the analogous "anthropic→openai tools translation failed during token count, falling back to raw tools: broken"
    and passes raw tools. Empty tools become null. Counter errors propagate to the execution task.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    summary_messages_merge_user prepends usable system text, strips compaction blocks and preserves midturn system
    through B964. Final user content Q becomes "Q\n\nP" for prompt P; null/empty becomes P; a list appends
    {type:text,text:P}; an unexpected scalar 7 becomes [7,{type:text,text:P}]. An assistant final turn or no
    history adds {role:user,content:P}. Translation failure warns
    "compact_20260112: anthropic→openai translation failed when building summary call; falling back to raw shape: broken"
    and still performs system prepend and user merge on raw stripped history.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    last_real_user_question skips tool_result-only and empty-list user turns, strips tool_result blocks from mixed
    user content, retains images/text/unknown blocks and message fields, and accepts scalar null/empty user content
    unchanged. No eligible turn returns [{role:user,content:"Please continue based on the conversation summary above."}].
    Non-user turns do not qualify.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    client_compaction_without_edit returns null with no compaction block. With one, preserve all post-block turns,
    prefix only a nonempty string summary, strip blocks and use the synthetic/last-question fallback only if no
    downstream messages remain. Return applied_edits=[],compaction_block=null,iterations_usage=null; emit info
    "compact_20260112: client compaction block in message history; applying slice-only forwarding (no context_management edit)"
    and, for S, "compact_20260112: compaction summary added to main call system prefix (1 chars)".
  proof: [behavior-tests, oracle, helper-python]
- text: History fixtures and the summary_history tag are new and independently executable.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: a history boundary, literal prompt or metadata field is missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_history::/)'
  - id: helper-python
    why: the history comparison does not invoke the pinned helper
    run: test -f tools/oracle/helpers/summary_history.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the shared helper parser does not recognize summary_history
    run: grep -qE '^[[:space:]]+summary_history:' tools/oracle/fuzz/corpus/helper_case/summary_history-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: there are no newly authored history scenarios
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/summary-history)"
oracle_cases:
- tools/oracle/cases/helpers/summary-history/latest-compaction-boundary.yaml
- tools/oracle/cases/helpers/summary-history/summary-system-shapes.yaml
- tools/oracle/cases/helpers/summary-history/compaction-trigger-validation.yaml
- tools/oracle/cases/helpers/summary-history/summary-instruction-selection.yaml
- tools/oracle/cases/helpers/summary-history/summary-metadata-allowlist.yaml
- tools/oracle/cases/helpers/summary-history/effective-token-components.yaml
- tools/oracle/cases/helpers/summary-history/summary-messages-merge-user.yaml
- tools/oracle/cases/helpers/summary-history/last-real-user-question.yaml
- tools/oracle/cases/helpers/summary-history/client-compaction-without-edit.yaml
deviations: []
out_of_scope:
- B969 owns compact.py L97-L392 primitive predicates/settings/access; B970 owns L395-L627 budget and rate checks.
- B2432 owns compact.py L1019-L1111 and L1160-L1380 provider calls/execution, and B972 owns dispatcher.py.
- B013 owns tokenization and model metadata; B964/B2431 own adapter message/tool conversion and their internal warnings.
pitfalls:
- 'The oracle helper for this task is pre-registered as summary_history in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/summary_history.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/summary_history.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A compaction block can appear on any role and within a larger content array; slicing only whole turns loses the boundary.
- Counted system blocks use one newline, whereas summary-request system blocks use two.
- A successful summary needs one eligible user turn; slice-only forwarding must keep the entire recent tail.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
