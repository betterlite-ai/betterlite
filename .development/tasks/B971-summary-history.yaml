id: B971
title: Summary history
description: >-
  Build compacted history, trigger token count, summary prompt and last-user-question preservation from typed Anthropic
  messages. Use local B013 token counting with bounded CPU work, preserve compaction block boundaries and metadata
  provenance, and never fetch tokenizer assets.


  Implement crates/betterlite-core/src/api/summary_history.rs. Use SummaryHistoryInput and SummaryHistoryResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions latest_compaction_cut, summary_in_system, trigger_token_threshold,
  last_user_question_preserved, client_compaction_history under api::summary_history::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::SummaryHistory in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {summary_history: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _find_latest_compaction_index
  (L630-L646); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _slice_around_compaction_block
  (L649-L676); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _strip_compaction_blocks
  (L679-L698); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _augment_system_with_summary
  (L701-L718); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _resolve_trigger_tokens
  (L721-L752); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _build_summary_prompt
  (L755-L762); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _propagate_metadata (L765-L782);
  litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _count_effective_tokens (L785-L855);
  litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _system_to_text (L858-L874); litellm/llms/anthropic/pass_through/context_management/editors/compact.py:
  _select_last_user_question (L877-L912); litellm/llms/anthropic/pass_through/context_management/editors/compact.py:
  _extract_summary_text (L915-L922); litellm/llms/anthropic/pass_through/context_management/editors/compact.py:
  _system_to_openai_message (L925-L943); litellm/llms/anthropic/pass_through/context_management/editors/compact.py:
  _build_summary_messages (L946-L996); litellm/llms/anthropic/pass_through/context_management/editors/compact.py:
  _is_user_message (L999-L1000); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _append_text_to_content
  (L1003-L1016); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: apply_client_compaction_block_history
  (L1114-L1157). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 286 owned nonblank/non-comment/non-docstring Python lines (358 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 306 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 556 total within the 560-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B013 (Model cost map, provider capability data and token counting), B171 (Direct helper
  oracle and URL path encoding), B958 (Messages errors), B1087 (Api boundaries), B969 (Summary model access). These
  are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on
  the provider and keys/data branches.
