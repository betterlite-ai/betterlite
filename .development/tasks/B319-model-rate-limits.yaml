id: B319
title: Strategy-independent model RPM and TPM checks
description: 'Add the enforce_model_rate_limits optional pre-call check to the B016 pipeline, using B304
  state and B011 rate-limit metadata. Keep its counters and callback accounting compatible with other
  strategy consumers, and expose a reservation hook that B019''s ITPM/OTPM part can compose before these
  checks. Reuse the existing token accounting rather than add a second estimator. Configuration boundary
  keys introduced or consumed here: optional_pre_call_checks. Pinned declaration defaults: optional_pre_call_checks=None.
  Resolve env values once in betterlite-config, never in router code. Implement the owned native service
  in crates/betterlite-router/src/model_rate_limits.rs. Add ProbeOperation::ModelRateLimits in tools/oracle/src/router_probes/mod.rs
  and the corresponding B319 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_utils/pre_call_checks/model_rate_limit_check.py:
  ModelRateLimitingCheck.__init__ (L61-L65), ModelRateLimitingCheck._warn_io_token_and_tpm_rpm_coexist_once
  (L67-L81), ModelRateLimitingCheck._refund_io_token_reservation_if_any (L83-L86), ModelRateLimitingCheck._async_refund_io_token_reservation_if_any
  (L88-L98), ModelRateLimitingCheck._get_deployment_limits (L100-L128), ModelRateLimitingCheck._get_cache_keys
  (L130-L138), ModelRateLimitingCheck._get_current_tpm (L140-L148), ModelRateLimitingCheck._async_get_current_tpm
  (L150-L158), ModelRateLimitingCheck.pre_call_check (L160-L237), ModelRateLimitingCheck.async_pre_call_check
  (L239-L324), ModelRateLimitingCheck.async_log_success_event (L326-L382), ModelRateLimitingCheck.async_log_failure_event
  (L384-L395), ModelRateLimitingCheck.log_success_event (L397-L440), ModelRateLimitingCheck.log_failure_event
  (L442-L447). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports.'
