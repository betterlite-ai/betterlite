deviations: []
out_of_scope:
- Virtual-key and team rate-limit middleware (B072).
- Input/output token reservations (B019).
pitfalls:
- A rate-limit rejection and a Redis failure have different behavior.
- The check must run before the provider call under every configured strategy.
- RPM counts rejected increment-first attempts according to the pinned code.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
