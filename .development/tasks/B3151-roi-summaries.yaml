id: B3151
title: ROI identity matching and report summaries
description: >-
  Build deterministic identity matching and report aggregation in `betterlite-roi::summary`,
  with the summary response models it returns. Keep manual overrides via identity-map lookups,
  ambiguous-email outcomes when a person has multiple emails in the spend and pulls,
  eligible-cohort rules (spend known, estimated pulls exist, all pending pulls reviewed),
  unavailable-repository suppression of cost/efficiency ratios, sorting by hours descending
  then person id ascending for people and by merge date descending for pulls, and deduplication
  of logins and match methods by first occurrence preserving insertion order.

  match_identity consults mappings first (override by GitHub login casefolded), then matches
  candidate emails against observed gateway emails (from spend records), returning address
  and method: manual/profile email/commit email/ambiguous emails/email unavailable/no gateway match.
  An ambiguous result stops processing for that pull and flags it unmatched; email unavailable
  means no email candidates found; no gateway match means candidates exist but do not overlap
  observed emails. _person_key collapses identities: a normalized email if available, otherwise
  gateway:<user_id> or github:<login_casefolded>.

  summarize assembles the ROISummary response by building person records from spend and pull
  records keyed by _person_key, aggregating hours/spend/pull counts per person, computing
  cohort eligibility (spend non-null, estimated_prs > 0, pending_prs == 0), and selecting
  cost_per_hour only for eligible people with spend and hours > 0 and complete scope (all
  repositories available). Daily trend sums eligible spend and estimated hours by date, and
  ratio metrics (cost_per_hour, hours_per_dollar) return null when denominators are zero or
  scope is incomplete (unavailable_repos present). ROIIdentityMapUpdate and ROIIdentityMapResponse
  transmit identity-map edits to the API with login normalization and embed summary results
  in the response.

  Preserve the email match logic, cohort-only metrics, person-key collapsing, and the exact
  sort order; test every path through match_identity and the four ratio-null conditions.

scope:
  paths:
    - crates/betterlite-roi/src/summary.rs
    - crates/betterlite-roi/src/summary/**
    - crates/betterlite-roi/fuzz/Cargo.toml
    - crates/betterlite-roi/fuzz/fuzz_targets/identity_map.rs
    - crates/betterlite-roi/fuzz/corpus/identity_map/**
  lint_tables: false

