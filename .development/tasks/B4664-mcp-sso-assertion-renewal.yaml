dod:
  - text: sso_client_config returns the endpoint, client id and secret from the three GENERIC_ variables, is None when any is missing or empty, and picks client_secret_post only when GENERIC_INCLUDE_CLIENT_ID lowercased is "true".
    proof: [config-tests, oracle, helper-python]
  - text: A refresh with no refresh token, and a refresh with no configured client, each return Rejected without any IdP call, and the missing token is checked first.
    proof: [refresher-tests, oracle, helper-python]
  - text: The refresh posts grant_type=refresh_token and the carried token with HTTP Basic headers for client_secret_basic and client_id and client_secret in the form for client_secret_post.
    proof: [refresher-tests, oracle, helper-python]
  - text: A rotated refresh token from the IdP replaces the stored one, and an omitted or empty one keeps the carried token.
    proof: [refresher-tests, oracle, helper-python]
  - text: A response without a usable id_token is Rejected with the fixed detail and nothing is written.
    proof: [refresher-tests, oracle, helper-python]
  - text: A newer stored row, one whose id_token differs from the one the renewal started from, is kept and not overwritten, and the refresh still returns the renewed assertion.
    proof: [refresher-tests, oracle, helper-python]
  - text: A failing row read or write during write-back is Unavailable with the fixed detail, and the renewed refresh token is not written.
    proof: [refresher-tests, oracle, helper-python]
  - text: The transport maps a 4xx to Rejected, and a 3xx, a 5xx, a non-object 2xx body and an unreachable endpoint to Unavailable, without the URL, form or body in the detail.
    proof: [transport-tests]
  - text: An assertion that is None or still more than 60 seconds from its exp is returned by fetch without any IdP call.
    proof: [store-tests, oracle, helper-python]
  - text: An assertion inside the 60 second skew is renewed once, written, and returned from an uncached read.
    proof: [store-tests, oracle, helper-python]
  - text: A Rejected renewal leaves the expired assertion in place and returns it, and an Unavailable renewal fails fetch with AssertionStoreUnavailable.
    proof: [store-tests, oracle, helper-python]
  - text: Concurrent in-process fetches of one expiring user make one IdP call, and a failed renewal reaches every one of them.
    proof: [store-tests]
  - text: The refresh step skips the IdP when its fresh read shows another replica already renewed the row.
    proof: [store-tests, oracle, helper-python]
  - text: A cross-replica loser whose reread still finds the row expiring fails with the fixed retry message, and one that finds it renewed returns the new assertion.
    proof: [store-tests, oracle, helper-python]
  - text: The distributed coordinator is used once the factory yields one and is kept, and the in-process one is used while the factory yields None.
    proof: [store-tests]
  - text: No id_token, refresh token or client secret appears in any Debug output, log line or error text.
    proof: [refresher-tests, store-tests]
checks:
  optional: []
  commands:
    - id: config-tests
      why: The client configuration tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::sso_assertion_refresher::client_config::tests::/)'
    - id: transport-tests
      why: The outcome mapping tests for the refresh transport are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::sso_assertion_refresher::transport::tests::/)'
    - id: refresher-tests
      why: The refresh order, form, rotation or write-back tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::sso_assertion_refresher::refresher::tests::/)'
    - id: store-tests
      why: The lazy renewal, single-flight or coordinator choice tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::sso_assertion_refresher::store::tests::/)'
    - id: helper-python
      why: The b4664 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4664.py tools/oracle/helpers/b4664)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4664 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/mcp-sso-refresher-*")" &&
        grep -lE 'b4664"?:' tools/oracle/fuzz/corpus/helper_case/mcp-sso-refresher-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
