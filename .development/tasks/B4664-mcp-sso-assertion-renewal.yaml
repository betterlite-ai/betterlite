deviations:
  - what: "The refresh POST carries an Accept header (application/json), and a 2xx body that is not a JSON object is reported with the fixed detail 'the IdP token endpoint returned a non-object response' for both a non-JSON and a non-object body."
    why: The POST goes through B4661's pooled grant poster, which adds that header and cannot tell the two body shapes apart. The detail only reaches logs and AssertionStoreUnavailable, which the resolver replaces with a generic 503 text, so no client sees the difference.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_refresher.py#L217-L237
  - what: A response body over the pool's size cap is Unavailable, and so is any 3xx. LiteLLM reads any size.
    why: Every outbound call is bounded by B173's caps. A 3xx is already Unavailable in LiteLLM because raise_for_status rejects it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_refresher.py#L217-L237
  - what: The generic SSO client settings come from a map the composition root passes through SsoClientSource, not from os.environ at the moment of each call.
    why: betterlite reads no process environment outside config loading. Who fills the map is the SSO settings task's decision.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_refresher.py#L133-L161
out_of_scope:
  - "default_sso_assertion_store: composition, done by the server's composition root from the types here, B4663's DbSsoAssertionStore and B4657's coordinator factory."
  - "post_form and HttpxTokenEndpointTransport's httpx calls: replaced by GrantPostTransport over B4661's HttpGrantPost, which B173's pooled client backs."
  - "The ID-JAG exchange, the slot key, the fingerprint and invalidate_credentials in resolver.py: B4667, which covers the whole file. This task's covers no longer name resolver.py."
  - "The sso_assertion_store module, assertion_from_sso_login, assertion_expired and DbSsoAssertionStore: B4663. The OAuth token stores and coordinators: B4656 and B4657. build_token_endpoint_client_auth: B4650."
  - "Filling the GENERIC_TOKEN_ENDPOINT, GENERIC_CLIENT_ID, GENERIC_CLIENT_SECRET and GENERIC_INCLUDE_CLIENT_ID map from the stored SSO settings, and reconciling them at startup: the SSO settings tasks. The login path's own reading of GENERIC_SCOPE is theirs too; only the warning text names it here."
  - "HTTP oracle cases: no route reaches this code yet, so the umbrella that wires the id_jag egress adds them."
pitfalls:
  - "The missing refresh token is checked before the missing client, so an assertion with neither logs the offline_access warning and not the client one."
  - "Only a 4xx from the IdP is Rejected; a 429 is a 4xx too, so it tells the user to sign in again, as LiteLLM does. Do not widen it to retry on 429."
  - "A renewal the write-back skipped because a newer row exists still returns Ok(renewed), and the caller reads the newer row anyway through the uncached read."
  - "The skip test compares id_token text with the token the renewal started from, not the refresh token; a login that landed with the same id_token but a rotated refresh token is overwritten."
  - "A renewed assertion goes through assertion_from_sso_login, which logs its own 'could not be decoded' warning for an undecodable id_token before this task logs the no-usable-id_token one, so two lines appear."
  - "client_secret_basic and client_secret_post differ in where the secret goes; a form for basic must not also carry client_id or client_secret."
  - "fetch re-reads the row uncached after the coordinator returns, because the inner cache can still hold the old assertion for its TTL; B4663's persist invalidates it, but a skipped write does not."
  - "A Rejected renewal returns nothing from the refresh step, so fetch hands back the still-expired assertion and the id_jag path's own assertion_expired check produces the sign-in-again 412."
  - "The refresh step re-reads before redeeming; skipping that read would spend a refresh token another replica just rotated, and an IdP that detects reuse can revoke the whole grant."
  - "The factory is asked again on every fetch while it returns None, so a Redis client wired after startup is picked up; once it returns Some the value is kept and the factory is not asked again."
  - "Log lines name user_id but never a token, the client secret or the form; a test builds a renewal with a recognizable secret and asserts it is absent from every captured log line."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
