id: B4664
title: "MCP SSO assertion renewal"
description: >-
  An ID-JAG agent spends the user's stored IdP id_token as the subject_token of leg 1, and that token dies at its exp, usually within an hour. LiteLLM's sso_assertion_refresher.py renews it: when a read finds the assertion about to expire, it redeems the refresh token stored beside it at the IdP's token endpoint, stores the answer and returns the new assertion. This task ports that file. The ID-JAG two-leg exchange itself (resolver.py's _id_jag_exchange) already belongs to B4667, so this task builds no resolver code and B4664's covers list no longer names resolver.py. No route reaches this code yet, so it is typed functions and ports, tested natively and with helper oracle cases.

  Layout. Everything goes in betterlite-server, module mcp::outbound_credentials::sso_assertion_refresher, because it needs B4656's RefreshCoordinator and B4657's coordinator factory, which live in that crate, and betterlite-server may depend on betterlite-mcp. Submodules: client_config, failure, transport, refresher and store. Do not edit crates/betterlite-server/Cargo.toml: B4661 already added betterlite-mcp and the other dependencies this task uses; if one is still missing, say so in your report as a blocker. Names stop at 30 characters, so LiteLLM's RefreshingSSOAssertionStore is RefreshingAssertionStore and SSOAssertionRefresher is AssertionRefresher. Types that B4650, B4656, B4657, B4661 and B4663 build are used under the Rust names those tasks chose; read them in the code on main first and, if a signature differs from this text, adapt at the call site and never edit another task's file.

  client_config. SsoClientConfig { token_endpoint: String, client_id: String, client_secret: SecretString, auth_method } where auth_method is B4650's token-endpoint auth method type (client_secret_basic or client_secret_post). sso_client_config(env: &BTreeMap<String, String>) -> Option<SsoClientConfig> reads GENERIC_TOKEN_ENDPOINT, GENERIC_CLIENT_ID and GENERIC_CLIENT_SECRET. If any of the three is missing or empty it returns None, which is an ordinary state and logs nothing. auth_method is client_secret_post when GENERIC_INCLUDE_CLIENT_ID, lowercased, equals "true" (default "false" when absent), otherwise client_secret_basic. The caller passes the map, so this task does not read the process environment. trait SsoClientSource has fn client(&self) -> Option<SsoClientConfig> and is read on every refresh, because LiteLLM reads os.environ on every call. The composition root implements it over live settings.

  failure. RefreshFailure { kind: RefreshFailureKind, detail: String } where RefreshFailureKind is Rejected (settled: this refresh token never works again, so the user must sign in) or Unavailable (transient: the same attempt may work later). Constructors rejected(detail) and unavailable(detail). Consumers match on kind with no wildcard arm.

  transport. trait RefreshTransport has async fn post(&self, url: &str, form: &BTreeMap<String, String>, headers: &BTreeMap<String, String>) -> Result<serde_json::Map<String, Value>, RefreshFailure>. The production type GrantPostTransport<P> wraps B4661's M2mTokenEndpointPost (token_post.rs) and maps its TokenEndpointOutcome: Success { body } is Ok(body). Denied with a status from 400 to 499 is Rejected "the IdP refused the refresh with status N". Denied with any other status (3xx, 5xx, or the 2xx that B4661 uses for a body that is not a JSON object) is Unavailable, "the IdP token endpoint answered with status N" for a non-2xx status and "the IdP token endpoint returned a non-object response" for a 2xx one. Unreachable is Unavailable "the IdP token endpoint is unreachable". The split matters because a 400 invalid_grant means the user must act, while a timeout or a 5xx means wait. Failure details never carry the URL, the form or the body.

  refresher. trait AssertionAccess has async fn read(&self, user_id: &str) -> Result<Option<SsoIdentityAssertion>, AssertionStoreUnavailable> and async fn write(&self, user_id: &str, assertion: &SsoIdentityAssertion) -> Result<(), AssertionStoreUnavailable>, using B4663's types. store.rs implements it for B4663's DbSsoAssertionStore<R>: read is fetch_uncached and write is persist, with a persist error wrapped in AssertionStoreUnavailable as the source. AssertionRefresher<T: RefreshTransport, C: SsoClientSource, A: AssertionAccess> has a constructor taking the three. refresh(user_id, assertion: &SsoIdentityAssertion) -> Result<SsoIdentityAssertion, RefreshFailure> runs in this order. (1) No refresh_token: log the warning "ID-JAG: the stored IdP identity assertion for user_id=%s has expired and no refresh token was captured with it, so it cannot be renewed without another interactive sign-in. Add 'offline_access' to GENERIC_SCOPE so the SSO login captures one." and return Rejected "no refresh token was captured at sign-in". (2) client() is None: log "ID-JAG: the stored IdP identity assertion for user_id=%s has expired and cannot be renewed because the generic SSO client is not configured (GENERIC_TOKEN_ENDPOINT, GENERIC_CLIENT_ID, GENERIC_CLIENT_SECRET)." and return Rejected "the generic SSO client is not configured". (3) Build the client auth with B4650's build_token_client_auth from auth_method, client_id and client_secret; its error cannot happen after step 2 and maps to the same Rejected as step 2. (4) POST the form grant_type=refresh_token, refresh_token=<carried token>, plus the auth body (client_id and client_secret for client_secret_post, nothing for basic), with the auth headers (Authorization: Basic for client_secret_basic), to token_endpoint. A transport failure is returned as it is. (5) On a body, rotated = the body's refresh_token when it is a non-empty string, else the carried token. Call B4663's assertion_from_sso_login with the body's id_token and that refresh token as untyped JSON values, so the renewal passes the same validator as a login. None logs "ID-JAG: the IdP accepted the refresh for user_id=%s but returned no usable id_token, so there is nothing to assert upstream. The SSO client's grant needs the 'openid' scope for the token endpoint to return one on a refresh." and returns Rejected "the IdP's refresh response carried no usable id_token". (6) Store it. Read the user's row through A::read; if a row exists and its id_token differs from the id_token this renewal started from, log at info "ID-JAG: a newer IdP identity assertion for user_id=%s was stored while this renewal was in flight; keeping the stored one." and skip the write, which still returns Ok(renewed). Otherwise A::write. A read or write error logs the warning "ID-JAG: could not persist the renewed IdP identity assertion for user_id=%s, so the rotated refresh token is lost and this user will have to sign in again once the renewed token expires: %s" and returns Unavailable "the renewed IdP identity assertion could not be persisted".

  store. RefreshingAssertionStore<I, T, C, A, F> wraps an inner B4663 SsoAssertionStore and implements the same trait, so the id_jag credential path is unchanged. Fields: inner: I, refresher: AssertionRefresher<T, C, A>, access: Arc<A> (LiteLLM's fresh_read), factory: F (a trait CoordinatorFactory with fn coordinator(&self) -> Option<Arc<dyn the B4656 coordinator>>, implemented over B4657's refresh_coordinator_factory by the composition root), an InProcessRefreshCoordinator from B4656, the built distributed coordinator in a Mutex<Option<..>>, skew: Duration (default 60 seconds) and clock: Box<dyn Clock> (B4650's credential_contracts::byok_cache trait). fetch(user_id): read inner.fetch (its AssertionStoreUnavailable goes straight up). An assertion that is None, or not expiring, is returned untouched. Expiring means assertion_expired(assertion, clock.now() + skew). Otherwise run the coordinator once for the key (user_id, "sso_identity_assertion") with a refresh step and a reread step, then return access.read(user_id), uncached, as the answer. The coordinator is the distributed one once the factory has produced one, else the in-process one; the factory is asked again on every call until it yields Some, and the first Some is kept.

  The refresh step re-reads the row through access first. If it is None or no longer expiring (another replica renewed it) it returns without redeeming. Otherwise it calls refresher.refresh: Ok returns, Rejected returns (the expired assertion stays and the caller's own expiry check sends the user to sign in again), Unavailable becomes AssertionStoreUnavailable with the detail as its cause. The reread step runs for a cross-replica loser: it re-reads through access, and if the row is still expiring it fails with AssertionStoreUnavailable "the IdP identity assertion for user_id=<id> was being renewed by another replica and is not yet current; retry shortly". LiteLLM's coordinator protocol types both steps as returning an optional OAuthToken and propagates their errors to every waiter; both steps here return nothing. A failure of the refresh step reaches every concurrent in-process caller, and a Redis loser gets its own reread's outcome.

  Wiring. default_sso_assertion_store (the function that builds DbSSOAssertionStore, the transport and the store) is composition, not logic: the composition root builds RefreshingAssertionStore from the parts above and hands it to B4667's resolver as its SsoAssertionStore.

  Oracle. Helper cases on the b4664 operation. The Python adapter runs the pinned SSOAssertionRefresher and RefreshingSSOAssertionStore with a scripted TokenEndpointTransport (the case lists the outcome: a body, rejected or unavailable, and records the url, form and headers it received), an in-memory assertion map as inner store, read and write, a fixed clock, and either LiteLLM's in-process coordinator or a loser coordinator that runs only the reread step. Id tokens are unsigned three-segment JWTs the adapter builds from a claims object in the case (header {"alg":"none"}, base64url without padding, empty signature); the Rust side builds the same text. exp values are whole seconds. The output of a step is its result kind, the detail text, the form and headers sent, the writes made and the number of IdP posts. Logs, the Redis coordinator and the live HTTP transport stay in native tests.
