id: B968
title: Messages context clear
description: >-
  Implement typed context-management edits, ordered editor dispatch and clear_tool_uses_20250919. Export EditOutcome
  containing transformed messages, applied edits and diagnostics; the compact editor is injected as the separate
  messages-compaction service, with no recursive crate dependency. Keep default input token trigger 100000, keep=3
  tool uses, and placeholder [Cleared by context management].


  Implement crates/betterlite-core/src/api/messages_context_clear.rs. Use MessagesContextClearInput and MessagesContextClearResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions clear_trigger_input_tokens, keep_recent_tool_uses, exclude_last_completed_tool,
  unknown_edit_warning, applied_edit_response under api::messages_context_clear::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesContextClear in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_context_clear: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/context_management/dispatcher.py: _edits_from (L29-L33);
  litellm/llms/anthropic/pass_through/context_management/dispatcher.py: _normalize_spec (L36-L46); litellm/llms/anthropic/pass_through/context_management/dispatcher.py:
  _wrap_editor_return (L49-L69); litellm/llms/anthropic/pass_through/context_management/dispatcher.py: apply_context_management
  (L72-L151); litellm/llms/anthropic/pass_through/context_management/editors/clear_tool_uses.py: _count_tool_uses
  (L30-L45); litellm/llms/anthropic/pass_through/context_management/editors/clear_tool_uses.py: _collect_tool_use_ids_in_order
  (L48-L59); litellm/llms/anthropic/pass_through/context_management/editors/clear_tool_uses.py: _trigger_met (L62-L86);
  litellm/llms/anthropic/pass_through/context_management/editors/clear_tool_uses.py: _resolve_keep_count (L89-L96);
  litellm/llms/anthropic/pass_through/context_management/editors/clear_tool_uses.py: _last_completed_tool_use_id
  (L99-L112); litellm/llms/anthropic/pass_through/context_management/editors/clear_tool_uses.py: _clear_tool_results
  (L115-L150); litellm/llms/anthropic/pass_through/context_management/editors/clear_tool_uses.py: apply_clear_tool_uses_20250919
  (L153-L213); litellm/llms/anthropic/pass_through/context_management/errors.py: AnthropicContextManagementError.__init__
  (L11-L14); litellm/llms/anthropic/pass_through/context_management/placeholders.py: build_cleared_tool_result_content
  (L8-L14); litellm/llms/anthropic/pass_through/context_management/result.py: PolyfillResult.applied_edits_for_response
  (L28-L49). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 333 owned nonblank/non-comment/non-docstring Python lines (383 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 353 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 603 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B958 (Messages errors), B1087 (Api
  boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids
  retain ownership on the provider and keys/data branches.
