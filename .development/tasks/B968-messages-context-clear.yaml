    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_context_clear::/)
      - test(/::replays_corpus$/)'
  - id: case-clear-trigger-input-tokens
    why: the clear-trigger-input-tokens behavior or its assertions are absent
