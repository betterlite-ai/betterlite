id: B968
title: Clear tool results and carry context-management outcomes
description: >-
  Implement clear_tool_uses_20250919, its counting/trigger/keep/result helpers, cleared-content placeholders,
  AnthropicContextManagementError, PolyfillResult and the context constants in betterlite-core::api::messages_context_clear.
  The dispatcher moves whole to B972 because it calls the compaction implementation that consumes these result types.
  B013 supplies token counting and B958 the wire records. The clear editor never invokes a provider.

  Count tool_use blocks with string ids chronologically, including duplicates and empty strings. Clearing replaces
  only matching tool_result.content and never edits tool inputs. Always protect the latest completed tool-result id,
  even with keep=0. Preserve input messages, copy only changed records and report the number of result blocks
  actually replaced, which can differ from the number of ids selected. The system argument is accepted but is
  never included in token counts by this editor.

  Add HelperCall::MessagesContextClear with editor, visible_edits and constants actions. Use a scripted B013
  token-counter seam on both sides to prove strict thresholds and call ordering independently of tokenizers;
  include one real token-counter parity fixture. All input is parsed, so no new fuzz decoder belongs here.
  Own 250 nonblank/non-comment lines in the linked implementation ranges without dispatcher.py. Allow 230 implementation, 150 tests, 145 fixtures,
  90 adapters and 35 wiring, 650 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_context_clear.rs
  - crates/betterlite-core/src/api/messages_context_clear/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/messages_context_clear.rs
  - tools/oracle/src/helpers/core_ops/messages_context_clear/**
  - tools/oracle/helpers/messages_context_clear.py
  - tools/oracle/helpers/messages_context_clear/**
  - tools/oracle/fuzz/corpus/helper_case/messages_context_clear-*
  - tools/oracle/cases/helpers/messages-context-clear/**
  - Cargo.lock
  lint_tables: false
