  why: Own the complete editor and all helper functions, including latest-completed protection and ignored knobs.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/constants.py#L1-L45
  why: Own shared literal defaults consumed by clear and compaction editors.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/placeholders.py#L1-L14
  why: Cleared content preserves string-versus-block-list shape only.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/result.py#L1-L49
  why: PolyfillResult filters successful no-op compaction edits while retaining errors and warnings.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/errors.py#L1-L14
  why: The context exception carries only its supplied status and message; the route supplies its envelope.
dod:
- text: >-
    clear_trigger_thresholds omits trigger or gives {} and counts tokens against 100000; 100000 does not trigger,
    100001 does. Unknown trigger.type also uses input-token counting. Noninteger token value falls back to 100000.
    trigger={type:tool_uses,value:3} counts four string-id tool_use blocks and triggers, while three does not;
    noninteger tool threshold returns false without counting tokens. Boolean thresholds follow Python integer
    semantics (false=0,true=1). Missing/nonstring tool ids do not count; empty string ids do.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    keep_and_latest_result uses ids a,b,c,d and completed results a,b,c,d. Default keep=3 clears only a; keep=0
    clears a,b,c while d is protected. Negative/noninteger keep.value or keep.type=input_tokens uses 3; explicit
    keep.value=true uses 1. At most keep_count tool-use blocks returns no edit. Unmatched result ids are untouched;
    duplicate matching results each increment cleared_tool_uses. No actual replacements returns the original list
    and null edit without an after-token count.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    cleared_content_and_usage replaces scalar/null content with "[Cleared by context management]" and any list
    with [{type:text,text:"[Cleared by context management]"}], retaining other block/message fields and the input
    history. Script counts before=120,after=80 to obtain cleared_input_tokens=40; after=130 floors it at 0.
    Input-token triggers reuse the original count; tool-use triggers count before only after a replacement succeeds.
    All counts receive model/messages/tools, never system. Result type is clear_tool_uses_20250919.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    ignored_clear_knobs supplies clear_at_least=null,exclude_tools=[lookup],clear_tool_inputs=false and emits
    one warning for each present key in that exact order even when no trigger fires. When clearing succeeds,
    applied.warnings=[clear_at_least_ignored,exclude_tools_ignored,clear_tool_inputs_ignored]; the excluded lookup
    still clears and tool_use.input stays intact. With no applied edit, only diagnostics expose the ignored knobs.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    visible_polyfill_edits defaults applied_edits=[],compaction_block=null,iterations_usage=null. A compact_20260112
    edit without block/error/warnings is omitted; truthy error or warnings keeps it, and any non-null compaction
    block keeps all compact edits. Other edit types always remain, including empty dict. No visible edits returns
    null. AnthropicContextManagementError(status_code=403,message=denied) retains 403/denied and lacks type/param/code.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    context_constant_values asserts clear_tool_uses_20250919,100000,3 and the cleared placeholder, plus
    compact_20260112,150000,50000,4096,60.0,context_management_summary_max_tokens,context_management_summary_model
    and "Previous conversation summary: ". The default instructions concatenate exactly "You have written a partial
    transcript for the initial task above. Please write a summary of the transcript. The purpose of this summary is
    to provide continuity so you can continue to make progress towards solving the task in a future context, where
    the raw history above may not be accessible and will be replaced with this summary. Write down anything that
    would be helpful, including the state, next steps, learnings etc. You must wrap your summary in a <summary></summary>
    block." The tool suffix is " Do not call any tools while writing this summary; respond with text only.".
  proof: [behavior-tests, oracle, helper-python]
- text: New clear-editor fixtures include independent token effects and a parser seed selecting messages_context_clear.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: context clearing, trigger edges or result visibility is not covered beside production code
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_context_clear::/)'
  - id: helper-python
    why: clear-editor comparison lacks the pinned independent implementation
    run: test -f tools/oracle/helpers/messages_context_clear.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the clearing operation cannot be decoded by the oracle
    run: grep -qE '^[[:space:]]+messages_context_clear:' tools/oracle/fuzz/corpus/helper_case/messages_context_clear-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no new clearing or result-visibility inputs exist
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-context-clear)"
oracle_cases:
- tools/oracle/cases/helpers/messages-context-clear/clear-trigger-thresholds.yaml
- tools/oracle/cases/helpers/messages-context-clear/keep-and-latest-result.yaml
- tools/oracle/cases/helpers/messages-context-clear/cleared-content-and-usage.yaml
- tools/oracle/cases/helpers/messages-context-clear/ignored-clear-knobs.yaml
- tools/oracle/cases/helpers/messages-context-clear/visible-polyfill-edits.yaml
- tools/oracle/cases/helpers/messages-context-clear/context-constant-values.yaml
deviations: []
out_of_scope:
- B972 owns every function in dispatcher.py; its compaction callee consumes this task's types and cannot be a prerequisite of this leaf.
- B969/B970/B971 own summary policy and history helpers in editors/compact.py; B972 and its execution part own compaction dispatch/provider I/O.
- B013 owns token_counter and B081 maps context exceptions to HTTP responses.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_context_clear in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_context_clear.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_context_clear.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The latest completed result stays even when keep=0, so clearing every historical tool result is incorrect.
- Ignored-knob warnings are emitted before the trigger check and may be the only observable effect.
- A compaction edit with no visible effect is hidden, whereas a clear edit is always returned when present.
review_level: standard
budget:
  max_changed_lines: 680
  max_new_expects: 0
