dod:
  - text: Add-model creates, the form connection test and the provider, credential and access-group reads match LiteLLM through the booted proxy.
    proof: [model-form-cases, oracle]
  - text: Auto-router prompt, availability, validation, routing test, create, both edit bodies and delete match LiteLLM.
    proof: [model-form-cases, oracle]
  - text: The Team-BYOK controls work without a paid claim while team scope rules and server checks stay in force.
    proof: [model-form-components, model-form-cases, oracle]
checks:
  optional: []
  commands:
    - id: model-form-cases
      why: No booted-proxy case sends the add-model or auto-router form bodies.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/model-forms)" &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/ui/model-forms
    - id: model-form-components
      why: The retained form keeps the paid gate or sends a different body after the patch.
      run: bash tools/dashboard/build.sh check ui/dashboard/tests/model-forms
oracle_cases:
  - tools/oracle/cases/ui/model-forms/access-group-names-only.yaml
  - tools/oracle/cases/ui/model-forms/create-two-mappings.yaml
  - tools/oracle/cases/ui/model-forms/create-wildcard-provider.yaml
  - tools/oracle/cases/ui/model-forms/create-priced-and-read-back.yaml
  - tools/oracle/cases/ui/model-forms/create-team-model-admin-eligible-mit.yaml
  - tools/oracle/cases/ui/model-forms/create-team-model-foreign-team-denied.yaml
  - tools/oracle/cases/ui/model-forms/unsaved-form-connection-test.yaml
  - tools/oracle/cases/ui/model-forms/classifier-default-and-assembled-prompt.yaml
  - tools/oracle/cases/ui/model-forms/availability-and-validation.yaml
  - tools/oracle/cases/ui/model-forms/routing-test-saved-and-unsaved.yaml
  - tools/oracle/cases/ui/model-forms/tier-connection-tests.yaml
  - tools/oracle/cases/ui/model-forms/auto-router-create-edit-delete.yaml
  - tools/oracle/cases/ui/model-forms/member-managed-router-edit.yaml
deviations:
  - what: The add-model form enables the Team-BYOK switch and team picker without premiumUser, and a team-scoped create is not refused for missing a license.
    why: README decision of 2026-10-24 has no paid tier; B1215 and B832 already remove the backend license branch and keep the team-admin check.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/add_model/AddModelForm.tsx#L336-L381
out_of_scope:
  - B9090 retains every unpatched function under add_model, edit_auto_router and AutoRouters; B9091 builds them and B146 drives the forms in the browser.
  - B1215, B835, B838, B840, B349, B379, B3190, B3192, B1601, B4446, B007, B004 and B006 own the handlers; B8676 and B8681 own the public mounts.
  - The deployed table, detail and credential tab are B9690's; router settings and fallbacks are B9692's.
pitfalls:
  - A form with two model mappings sends two POST /model/new requests; a case that sends one body proves nothing about the second.
  - cache_read_input_token_cost copies the already divided input price, so dividing again sends a value a million times too small.
  - The member-managed edit sends only litellm_params; a full body from a team member is refused differently.
  - The availability query is debounced, so the browser sends one POST per settled config, not one per keystroke.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
