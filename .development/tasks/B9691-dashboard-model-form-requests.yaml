id: B9691
title: Prove the add-model and auto-router form requests and drop the team-model paid gate
description: >-
  Add HTTP oracle cases for the requests the Add Model and Auto Routers tabs send, and a
  reviewed 80-model-forms.patch that removes the one premiumUser gate in these forms. B9090
  takes in the covered files unchanged and B9091 builds them; nothing in the React tree is
  ported. Every route has a backend owner, so no handler is registered here.

  The paid gate. AddModelForm disables the Team-BYOK Model switch and the TeamDropdown when
  premiumUser is false and shows "This is an enterprise-only feature. Upgrade to premium to
  restrict model+credential combinations to a specific team." The backend mirror is
  can_user_make_team_model_call: it raises 403 not_premium_user before the team-admin check.
  Under the no-paid-tier decision B1215 and B832 already drop that license branch and keep the
  proxy-admin and team-admin rule. The patch enables both controls, drops the tooltip text and
  keeps the (isAdmin || !isTeamAdmin) visibility, the team-required scope from
  modelCreationScope and the required-team validation. Do not set premium_user anywhere.
  ui/dashboard/tests/model-forms/upstream-tests.json reruns the retained
  AddModelForm.integration.test.tsx, handle_add_model_submit.test.tsx,
  add_auto_router_tab.integration.test.tsx and edit_auto_router_modal.integration.test.tsx; the
  patch changes only the enterprise-only assertions at L330-L355 of the first one. A new
  component test there renders the form with premiumUser false and checks that the switch is
  enabled and that submitting with a team sends model_info.team_id.

  Add-model requests. The form loads provider metadata from GET /public/providers/fields (no
  auth, B3190, mounted by B8676 and B8681), credentials from GET /credentials (B1601),
  guardrail and tag lists (B9735's cases), and model access groups through GET
  /models?include_model_access_groups=True&only_model_access_groups=True, the capitalized
  strings modelAvailableCall(token,"","",false,null,true,true) sends with
  return_wildcard_routes left out (B007). B9735's models-ui-flags-and-team-scope is about
  the team and expand flags, so add access-group-names-only with this exact pair, reading
  data[].id and checking that plain model names are absent. prepareModelAddRequest
  sends one POST /model/new per model mapping, body {model_name, litellm_params, model_info}:
  per-million input/output prices divided by 1e6, cache_read_input_token_cost defaulting to the
  converted input price, cache_creation_input_token_cost left out when blank, custom_llm_provider
  mapped through provider_map, base_model, team_id, mode and model_access_group moved into
  model_info (as access_groups), litellm_extra_params and model_info_params JSON spread into
  their objects, PTU fields as numbers and ISO UTC strings, and the all-wildcard choice turned
  into <provider>/*. B1215 owns POST /model/new and B838 the delete. Its planned cases send
  minimal bodies; add a two-mapping create, a wildcard create, a priced create read back through
  /v2/model/info, a team create by a proxy admin and by a team admin, and a team create for a
  team the caller does not administer that must stay 403. The team-create cases set
  native_feature_eligibility true (B1644) because stock LiteLLM answers not_premium_user there.
  The Test Connect button sends POST /health/test_connection with the prepared
  litellm_params and model_info and mode (B4446); B9690 covers the detail-page body, so add
  only the unsaved-form body with an inline api_key and a credential name.

  Auto-router requests. The complexity tab reads GET /public/complexity_router/scorer_defaults
  and GET /public/autorouter_presets (B3192 under B077), the classifier prompt editor sends GET
  /auto_router/classifier/default_prompt?context_window_size=<n>&tier_labels=<JSON array>&classification_rubric=<text>
  and the opening prompt editor POSTs the same path with {context_window_size,
  tier_definitions or tier_labels plus classification_rubric, classification_prompt?,
  classification_examples?} (B840). Availability polls POST /auto_router/availability
  {complexity_router_config, team_id?, saved_model_id?} after a 300 ms debounce and Save
  first sends POST /auto_router/validate_complexity_router_config {complexity_router_config,
  team_id?} (B379). The routing tester sends POST /auto_router/test_routing {prompt,
  complexity_router_config, saved_model_id?, default_model?, router_name?, team_id?} (B349)
  and the connection tester sends, per tier model group, POST /v1/chat/completions
  {model, messages:[{role:"user",content:"test from litellm"}], ...requestParams} or POST
  /v1/embeddings {model, input:"test from litellm"} (B004, B006). handleAddAutoRouterSubmit
  then sends POST /model/new {model_name, litellm_params:{model:"auto_router/complexity_router",
  complexity_router_config, complexity_router_default_model, compression fields when set},
  model_info:{team_id?, access_groups?}}. AutoRoutersPanel lists through /v2/model/info
  (B850, covered by B9690) and deletes with POST /model/delete {id}. edit_auto_router_modal
  validates, then sends PATCH /model/<id>/update with {model_name, litellm_params (the stored
  params with the new complexity_router_config, default model and compression patch),
  model_info with access_groups}, or for a member-managed router only {litellm_params:
  {complexity_router_config, complexity_router_default_model}}; the legacy semantic router
  sends auto_router_config, auto_router_default_model and auto_router_embedding_model (B835).
  Add the default-prompt GET and POST, an availability call with a missing tier model, a
  failing and a passing validation, a test_routing call against saved and unsaved configs, the
  create, both edit bodies, a delete and the member-managed edit by a team member.

  Use B860's Postgres fixture with B5076's bootstrap, store_model_in_db true and mock upstream
  deployments for every tier model so no case reaches a provider. Compare status, error
  type/param/code and the stable bodies the forms read. Coverage audit: no on-disk case sends
  any of these bodies; the owners' planned cases (B1215 create-minimal, B379 and B349 config
  checks, B840 default-prompt) use generic configs. Reuse an owner case that is already on disk
  and byte-identical; otherwise add the page one. About 60 patch, 120 component-test and 520
  case lines.
scope:
