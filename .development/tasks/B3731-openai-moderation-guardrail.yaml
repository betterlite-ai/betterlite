dod:
  - text: >-
      OpenAIModerationGuardrail.__init__ accepts guardrail_name, api_key, api_base, model,
      streaming_end_of_stream_only, streaming_sampling_rate, and kwargs; validates api_key is not empty;
      stores api_key (env -> litellm.api_key -> litellm.openai_key), api_base (default https://api.openai.com/v1),
      model (default omni-moderation-latest), streaming_end_of_stream_only (default false),
      streaming_sampling_rate (default 5), and chains parent __init__.
    proof: [openai-moderation-tests]
  - text: >-
      _get_api_key returns OPENAI_API_KEY env var, litellm.api_key, litellm.openai_key
      in that precedence, and falls back to get_secret_str("OPENAI_API_KEY") placeholder.
    proof: [openai-moderation-tests]
  - text: >-
      async_make_request POSTs to {api_base}/moderations with {"model": model, "input": text},
      Bearer {api_key} authorization, application/json content-type, request timeout applied,
      parses response.json() into OpenAIModerationResponse, and raises HTTPException with the upstream response's status_code on non-200 status.
    proof: [openai-moderation-tests, openai-moderation-oracle]
  - text: >-
      _check_moderation_result iterates all results entries, checks each result.flagged,
      extracts category names where categories[name] is true from each result, raises HTTPException 400 with
      violated_categories and category_scores if any category across all results is flagged.
    proof: [openai-moderation-tests]
  - text: >-
      apply_guardrail prefers structured_messages (calls get_user_prompt), falls back to texts
      (joins with newline), returns inputs unchanged if no text to moderate, stashes full moderation
      response in request_data["metadata"]["_openai_moderation_response"], calls add_guardrail_scan_id,
      checks result and raises if blocked.
    proof: [openai-moderation-tests]
  - text: >-
      _process_response pops "_openai_moderation_response" from request_data["metadata"],
      falls back to "allow" if no response stashed, calls add_standard_logging_guardrail_information_to_request_data
      with status "success", tracing_detail from _build_tracing_detail, returns response unchanged.
    proof: [openai-moderation-tests]
  - text: >-
      _process_error classifies exception as guardrail_intervened or guardrail_failed_to_respond,
      pops stashed response from metadata, falls back to exception, calls add_standard_logging_guardrail_information_to_request_data
      with appropriate status and tracing detail, re-raises exception.
    proof: [openai-moderation-tests]
  - text: >-
      _build_tracing_detail iterates every entry in results, extracts flagged category names from each
      result's categories dict, returns GuardrailTracingDetail(violation_categories=[...]) with all flagged
      categories across all results, or None if no categories are flagged.
    proof: [openai-moderation-tests]
  - text: >-
      get_config_model returns OpenAIModerationGuardrailConfigModel class.
    proof: [openai-moderation-tests]
  - text: >-
      get_supported_event_hooks returns list with pre_call, during_call, and post_call hooks.
    proof: [openai-moderation-tests]
  - text: >-
      OpenAIModerationGuardrailConfigModel holds api_key (default None), api_base
      (default https://api.openai.com/v1), model (default omni-moderation-latest),
      streaming_end_of_stream_only (default false), streaming_sampling_rate (default 5),
      and ui_friendly_name() returns "OpenAI Moderation".
    proof: [openai-moderation-tests]
  - text: >-
      BaseOpenAIModerationGuardrailConfigModel holds model field with default omni-moderation-latest.
    proof: [openai-moderation-tests]
  - text: >-
      OpenAIGuardrailBase.get_user_prompt delegates to get_last_user_message(messages) from B219.
    proof: [openai-moderation-tests]
