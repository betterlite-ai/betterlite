id: B3731
title: OpenAI moderation guardrail
description: >-
  Build the OpenAI Moderation guardrail with client initialization, structured-message
  and text extraction, first-result blocking and full-response telemetry with category labels.
  Preserve environment/global key precedence (OPENAI_API_KEY env, then litellm.api_key,
  then litellm.openai_key), the omni-moderation-latest default model, and unified stream
  sampling settings (streaming_end_of_stream_only default false, streaming_sampling_rate
  default 5).

  The guardrail makes async requests to the OpenAI Moderation API, checks the first result
  for flagged content, and raises HTTPException with 400 status if any category is violated.
  Stash the full moderation response in request_data["metadata"]["_openai_moderation_response"]
  for per-request telemetry, using pop() to avoid race conditions with concurrent requests.
  Extract flagged category names for GuardrailTracingDetail to keep category_scores map out
  of indexed fields that hit backend length limits.

  apply_guardrail accepts GenericGuardrailAPIInputs, prefers structured_messages over texts,
  extracts text via get_user_prompt or joins texts, returns inputs unchanged (moderation
  does not modify), and delegates to the framework's decorator for exception dispatch.
scope:
