deviations:
  - what: >-
      When OPENAI_API_KEY is missing from environment and litellm.api_key and litellm.openai_key are not set,
      betterlite raises ValueError, whereas LiteLLM calls get_secret_str("OPENAI_API_KEY") to consult
      its configured secret manager.
    why: Full secret-manager dispatch is unresolved (U4); betterlite uses only the env var lookup supplied by B002.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/openai/moderations.py#L90-L102
  - what: >-
      When apply_guardrail raises an HTTPException for a policy block, betterlite does not invoke
      add_guardrail_scan_id for the failed call, whereas LiteLLM logs scan_id through the decorator
      even on violations.
    why: add_guardrail_scan_id registration and invocation is unresolved (U3); the full response is
      available for logging through _process_error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/openai/moderations.py#L223-L229
out_of_scope:
  - Guardrail decorator registration and CustomGuardrail.__init__; those are owned by B104 (U1).
  - add_guardrail_scan_id, add_guardrail_to_applied_guardrails_header and logging-object helpers; owned by B104 (U3).
  - get_secret_str and full secret-manager dispatch; owned by B129 (U4).
  - OpenAIModerationResponse constructor and wire format; owned by B004 (OpenAI chat completions without streaming).
  - Request/response routing and framework dispatch; those come from the guardrail lifecycle in B104.
pitfalls:
  - >-
      Moderation does not fail closed on network error; _process_error logs the exception and re-raises,
      so the caller decides fail_on_error behavior. Do not swallow exceptions or return a default "allow".
  - >-
      The response stash uses a dict key "_openai_moderation_response" in request_data["metadata"],
      which must exist before stashing. Initialize metadata = {} if request_data["metadata"] is missing.
  - >-
      apply_guardrail returns inputs unchanged; moderation only blocks, never masks or modifies content.
      Confirm that the returned inputs object is the same instance passed in, not a copy.
  - >-
      get_user_prompt returns None if no last user message exists; apply_guardrail checks for this and
      falls back to texts, then returns early if both are empty. Do not raise on missing text.
  - >-
      The category names in OpenAI's response are the keys of the categories dict; extract them by iterating
      the dict, not by assuming a fixed set of names.
  - >-
      HTTPException detail must be a dict, not a string, for proper JSON serialization. Include error and details keys.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
