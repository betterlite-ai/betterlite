pitfalls:
- 'The oracle helper for this task is pre-registered as openai_files in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/files.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_files.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The synchronous paths use a type cast rather than an isinstance guard, so the async-client ValueError must not
  be invented for sync retrieve/list.
- The chunk iterator owns context exit; closing only the outer FileContentStreamingResult would leak an entered
  response.
