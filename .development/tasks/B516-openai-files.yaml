id: B516
title: OpenAI file lifecycle and streaming content
description: >-
  Add FileCreate/FileQuery/FileObject and provider methods for upload, retrieve, list, delete and content. File
  content is a bounded owned byte stream, not text JSON. Preserve upload/content extra-body fields and SDK file-id
  path encoding; list only forwards purpose, not pagination. B087 composes the public file routes; B161 supplies
  synchronous Python file handles.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/openai.py: OpenAIFilesAPI.__init__
  L1680-L1681; OpenAIFilesAPI.get_openai_client L1683-L1711; OpenAIFilesAPI.acreate_file L1713-L1719; OpenAIFilesAPI.create_file
  L1721-L1753; OpenAIFilesAPI.afile_content L1755-L1761; OpenAIFilesAPI.file_content L1763-L1799; OpenAIFilesAPI.afile_content_streaming
  L1801-L1825; OpenAIFilesAPI.file_content_streaming L1827-L1881; OpenAIFilesAPI.aretrieve_file L1883-L1889; OpenAIFilesAPI.retrieve_file
  L1891-L1927; OpenAIFilesAPI.adelete_file L1929-L1935; OpenAIFilesAPI.delete_file L1937-L1973; OpenAIFilesAPI.alist_files
  L1975-L1984; OpenAIFilesAPI.list_files L1986-L2026.


  Named case contracts: upload_purpose: files.create receives every CreateFileRequest field, including purpose and
  file, then revalidates model_dump as OpenAIFileObject. Retrieve/delete return the SDK FileObject/FileDeleted unchanged.
  list_purpose_pagination: files.list receives purpose only when it is a string (including empty); otherwise it
  receives no arguments. The SDK cursor page is returned unchanged; no after/limit fields are accepted by this wrapper.
  binary_file_content: Buffered content wraps response.response as HttpxBinaryResponseContent. Streaming enters
  with_streaming_response.content before returning, copies headers and yields raw bytes with default chunk_size=1048576;
  an explicit chunk_size reaches iter_bytes unchanged. stream_content_cancel: Both generators close the response
  context in finally: normal completion passes three None values; BaseException, including cancellation, is rethrown
  and its type/value/traceback reaches context exit. Cover normal end and early generator close with controlled
  fixtures. sdk_client_argument_projection: Construct the SDK client only when client is None: api_base becomes
  base_url; omit None-valued api_key, timeout, max_retries and organization, but retain empty strings/zero. A supplied
  client wins without rebuilding it. Async selection requires the boolean True. sdk_client_missing: A fixture returning
  no client raises ValueError: OpenAI client is not initialized. Make sure api_key is passed or OPENAI_API_KEY is
  set in the environment. sdk_client_wrong_async: Selecting async with a non-AsyncOpenAI client raises ValueError:
  OpenAI client is not an instance of AsyncOpenAI. Make sure you passed an AsyncOpenAI client. sdk_error_passthrough:
  SDK exceptions retain their status, type, param, code and message; these lifecycle wrappers do not catch or normalize
  them.


  The helper adapter captures SDK methods and their path/arguments; public file route status/error envelopes belong
  to the B1020-family API tasks. Provider-native file upload remains supported; no enterprise managed_files hook
  or managed storage is created here.


  Write standalone Rust test openai_files_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_files_secret_safe_failure in betterlite-openai: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-openai/src/files.rs with adjacent tests under files/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function files_cases in betterlite-openai with these exact named cases (one per oracle file): upload_purpose,
  list_purpose_pagination, retrieve_escaped_id, delete_object, binary_file_content, stream_content_cancel, sdk_client_argument_projection,
  sdk_client_missing, sdk_client_wrong_async, sdk_error_passthrough. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_files* using HelperCase: kind: helper
  and the externally tagged openai_files variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_openai_files that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_file_object consumes file metadata JSON response bytes in crates/betterlite-openai/src/files.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_files.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_files.
  The adjacent test replays_the_openai_files_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 317 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 345 production lines, 235 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 770 planned, 775 maximum changed lines.
