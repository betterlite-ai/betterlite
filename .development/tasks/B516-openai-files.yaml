  optional:
  - mutants
  commands:
  - id: case-upload-purpose
    why: files.create receives every CreateFileRequest field, including purpose and file, then revalidates model_dump
      as OpenAIFileObject. Retrieve/delete return the SDK FileObject/FileDeleted unchanged.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_upload_purpose$/)'
  - id: case-list-purpose-pagination
    why: files.list receives purpose only when it is a string (including empty); otherwise it receives no arguments.
      The SDK cursor page is returned unchanged; no after/limit fields are accepted by this wrapper.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_list_purpose_pagination$/)'
  - id: case-retrieve-escaped-id
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-files/retrieve-escaped-id.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_retrieve_escaped_id$/)'
  - id: case-delete-object
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-files/delete-object.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_delete_object$/)'
  - id: case-binary-file-content
    why: Buffered content wraps response.response as HttpxBinaryResponseContent. Streaming enters with_streaming_response.content
      before returning, copies headers and yields raw bytes with default chunk_size=1048576; an explicit chunk_size
      reaches iter_bytes unchanged.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_binary_file_content$/)'
  - id: case-stream-content-cancel
    why: 'Both generators close the response context in finally: normal completion passes three None values; BaseException,
      including cancellation, is rethrown and its type/value/traceback reaches context exit. Cover normal end and
      early generator close with controlled fixtures.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_stream_content_cancel$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_files.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_files*")"
      && grep -lq 'openai_files' tools/oracle/fuzz/corpus/helper_case/openai_files* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_files$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_files)"
      && grep -q 'decode_file_object' crates/betterlite-openai/fuzz/fuzz_targets/openai_files.rs && cargo nextest
      run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_files_corpus$/)'
  - id: case-sdk-client-argument-projection
    why: 'Construct the SDK client only when client is None: api_base becomes base_url; omit None-valued api_key,
      timeout, max_retries and organization, but retain empty strings/zero. A supplied client wins without rebuilding
      it. Async selection requires the boolean True.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_sdk_client_argument_projection$/)'
  - id: case-sdk-client-missing
    why: 'A fixture returning no client raises ValueError: OpenAI client is not initialized. Make sure api_key is
      passed or OPENAI_API_KEY is set in the environment.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_sdk_client_missing$/)'
  - id: case-sdk-client-wrong-async
    why: 'Selecting async with a non-AsyncOpenAI client raises ValueError: OpenAI client is not an instance of AsyncOpenAI.
      Make sure you passed an AsyncOpenAI client.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_sdk_client_wrong_async$/)'
  - id: case-sdk-error-passthrough
    why: SDK exceptions retain their status, type, param, code and message; these lifecycle wrappers do not catch
      or normalize them.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_sdk_error_passthrough$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_files_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_files_secret_safe_failure$/)'
