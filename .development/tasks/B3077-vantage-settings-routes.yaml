deviations:
  - what: Update returns 404 when settings do not exist, instead of failing with a more generic error.
    why: LiteLLM explicitly checks and returns 404 with message "Vantage settings not found. Please initialize settings first using /vantage/init".
  - what: API key and integration token are masked with the first 4 and last 4 characters visible; betterlite uses SensitiveDataMasker identical to LiteLLM.
    why: LiteLLM's masking behavior preserves endpoint transparency across both implementations.
  - what: Delete operation removes the callback registration from the in-memory callback manager, preventing the scheduler from triggering further exports.
    why: LiteLLM deregisters the VantageLogger callback on deletion to ensure the scheduler stops firing; removal does not cancel already-bound jobs, only prevents new triggers.
out_of_scope:
  - Settings accessor functions (_get_vantage_settings, _set_vantage_settings) owned by B3075.
  - Setup detection functions (is_vantage_setup_in_db, is_vantage_setup_in_config, is_vantage_setup) owned by B3075.
  - Helper function _get_registered_vantage_logger owned by B073.
  - Dry-run export route (vantage_dry_run_export) owned by B073.
  - Actual export route (vantage_export) owned by B073.
  - Request/response model definitions (VantageInitRequest, VantageSettingsUpdate, VantageSettingsView, VantageExportRequest, VantageExportResponse, VantageDryRunRequest) owned by B3079.
  - User role predicate (user_api_key_has_admin_view) owned by B3079.
  - SensitiveDataMasker implementation owned by B244.
  - Database table and configuration repository owned by B725.
  - VantageLogger implementation and export methods owned by B3067.
  - Encryption/decryption utilities owned by B1600.
  - User authentication dependency injection owned by B052.
  - Callback removal implementation owned by B189.
pitfalls:
  - Update endpoint requires at least one field (api_key, integration_token, or base_url) to be provided; reject requests with all fields None with 400 "At least one field must be provided for update".
  - Update endpoint checks for empty settings and returns 404 with message "Vantage settings not found. Please initialize settings first using /vantage/init"; the 404 comes from explicit check, not from missing settings.
  - Decryption of api_key and integration_token on read may fail; decryption failure raises HTTPException with 500 status and descriptive error message.
  - DELETE endpoint deletes the database row first (ConfigRepository.table.delete), then deregisters the VantageLogger callback afterward using remove_callbacks_by_type; removing the registry entry does not itself cancel an already-bound scheduler job.
  - All error responses use CommonProxyErrors enum values, matching LiteLLM's CommonProxyErrors.not_allowed_access, CommonProxyErrors.db_not_connected_error.
  - The base_url field must have default "https://api.vantage.sh" matching VantageInitRequest; during updates, preserve existing base_url if not provided.
review_level: security
