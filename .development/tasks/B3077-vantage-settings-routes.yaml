dod:
  - text: GET /vantage/settings returns 200 with masked API key and integration token, or 200 with null fields if unconfigured, accessible only to admin and admin-view roles.
    proof: [get-settings-cases]
  - text: PUT /vantage/settings returns 400 with message "At least one field must be provided for update" when no fields are provided, before checking database state.
    proof: [update-no-fields-cases]
  - text: PUT /vantage/settings updates only provided fields when at least one is supplied, returns 404 if settings do not exist, accessible only to PROXY_ADMIN role.
    proof: [update-settings-cases]
  - text: POST /vantage/init stores encrypted API key and integration token in database, fails with 403 for non-admin, accessible only to PROXY_ADMIN.
    proof: [init-settings-cases]
  - text: DELETE /vantage/delete removes Vantage settings from database and deregisters the VantageLogger callback, fails with 404 if settings are absent, accessible only to PROXY_ADMIN.
    proof: [delete-settings-cases]
  - text: All routes return 403 (not_allowed_access) when user lacks required role; 422 when request body validation fails; 500 when database is unavailable.
    proof: [auth-error-cases]
  - text: Decryption failures in update and GET routes raise HTTPException with 500 status and descriptive error message.
    proof: [decryption-error-cases]
  - text: API key and integration token masking uses SensitiveDataMasker.mask_dict preserving first 4 and last 4 characters matching LiteLLM behavior.
    proof: [masking-cases]
checks:
  optional: []
  commands:
    - id: get-settings-cases
      why: GET /vantage/settings route does not return masked settings or handle missing configuration
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::(get_settings|missing_settings)/)'
    - id: update-no-fields-cases
      why: PUT /vantage/settings route does not reject requests with no fields provided
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::update_no_fields/)'
    - id: update-settings-cases
      why: PUT /vantage/settings route does not update fields or handle missing settings
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::(update_settings|update_before_init)/)'
    - id: init-settings-cases
      why: POST /vantage/init route does not store encrypted settings or enforce admin role
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::init_settings/)'
    - id: delete-settings-cases
      why: DELETE /vantage/delete route does not remove settings, deregister callbacks, or handle absent configuration
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::delete_settings/)'
    - id: auth-error-cases
      why: Authorization and validation error responses do not match LiteLLM behavior
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::(auth_|validation_)/)'
    - id: decryption-error-cases
      why: Decryption failure handling does not raise appropriate errors
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::decrypt/)'
    - id: masking-cases
      why: API key and integration token masking does not preserve first 4 and last 4 characters
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::vantage_routes::mask/)'
