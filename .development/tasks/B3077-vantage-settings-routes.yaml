id: B3077
title: Expose Vantage settings management routes
description: >-
  Register four HTTP routes for Vantage FinOps management in betterlite-server.
  Implement GET /vantage/settings to view current configuration with masking;
  PUT /vantage/settings for partial updates; POST /vantage/init for initial setup;
  and DELETE /vantage/delete to remove configuration and deregister the callback.
  Enforce admin-only mutations with admin-or-viewer read access for GET.
  Preserve exception handling for database unavailability, update-before-init ordering,
  and decryption failures; return 400 when PUT receives no fields to update, 422 for invalid request bodies, 403 for authorization,
  404 when settings are absent and cannot be updated, and 500 for unrecoverable errors.
  Sensitive API keys and integration tokens are masked with first and last 4 characters visible using B244's masker.
  Deletion removes both database configuration and the in-memory VantageLogger callback registration,
  so subsequent export requests must reinitialize or use an already-registered logger.
scope:
