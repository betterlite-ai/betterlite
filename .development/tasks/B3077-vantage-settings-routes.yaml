    - crates/betterlite-server/src/finops/vantage_routes.rs
    - crates/betterlite-server/src/finops/vantage_routes/**
    - tools/oracle/cases/finops/vantage-routes/**
    - tools/oracle/helpers/b3077.py
    - tools/oracle/helpers/b3077/**
    - tools/oracle/src/helpers/server/b3077.rs
    - tools/oracle/src/helpers/server/b3077/**
  lint_tables: false
