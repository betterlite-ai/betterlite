deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B186 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as native_errors_b in the error group. Replace the stub Op in tools/oracle/src/helpers/error/native_errors_b.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/native_errors_b.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
