id: B1117
title: Messages content primitives and capability markers
description: >-
  Implement the whole value-only helper slice of
  litellm/llms/anthropic/pass_through/adapters/transformation.py in
  betterlite-core::api::messages_content_primitives. The owned functions are
  _optional_attr, _as_string_mapping, _thought_signature, _compaction_blocks,
  _is_openai_function_tool, is_provider_native_tool_dict and truncate_tool_name
  (L25-L93); target_supports_mid_conversation_system and _chat_tool_param
  (L213-L225); LiteLLMAnthropicMessagesAdapter's signature, cache-marker,
  translatable-parameter and web-search helpers (L357-L454); its model/cache
  predicates (L672-L700); and its image/tool-result helpers (L1290-L1343).
  Keep each function together; the surrounding import block and every other
  method in transformation.py belong to the owners listed below.

  Match the pinned literals. A tool name of at most 64 Unicode characters is
  returned unchanged; a longer name is 55 Unicode characters, an underscore,
  and the first 8 lowercase hexadecimal characters of SHA-256 over the full
  UTF-8 name. Native-tool detection requires exactly one dict-valued key and
  rejects the six Anthropic schema keys name, type, input_schema, description,
  cache_control and strict. Tool-call output reads thought_signature while
  tool_use input reads signature. Cache control is copied only for a truthy
  marker and an accepted Claude, Bedrock ARN or Gemini model. A prompt marker
  is selected by key presence and delegated to B216; None is dropped there,
  while false and 0 remain present.

  Register messages_content_primitives in B171's helper enum and Python
  dispatcher. The Python side must create attribute-bearing typed tool-call
  probes as well as a separately tested raw dict; it must invoke B218, B216,
  B568 and B2221 at their seams rather than copy their algorithms. Image
  conversion only produces a data URL or passes through an existing URL; it
  never downloads a URL. This is parsed-record transformation, so add no
  external-byte parser or fuzz target. The owned ranges contain 215
  nonblank/non-comment lines excluding the import context. Reserve 200
  implementation, 180 behavior tests, 125 fixtures, 85 adapters and 30
  wiring lines, 620 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/messages_content_primitives.rs
  - crates/betterlite-core/src/api/messages_content_primitives/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/messages_content_primitives.rs
  - tools/oracle/src/helpers/core_ops/messages_content_primitives/**
  - tools/oracle/helpers/messages_content_primitives.py
  - tools/oracle/helpers/messages_content_primitives/**
  - tools/oracle/fuzz/corpus/helper_case/messages_content_primitives-*
  - tools/oracle/cases/helpers/messages-content-primitives/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L25-L93
  why: The six small projections establish mapping defaults, compaction filtering, schema-key exclusions and the 64-character name hash contract.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L213-L225
  why: The wrapper has a falsey-model short circuit, while the tool constructor distinguishes omitted eager_input_streaming from an explicit boolean.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L357-L454
  why: These methods select outer versus nested signatures, preserve cache markers, expose the exact translated-key inventory and recognize legacy web search.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L672-L700
  why: The model predicates use case-insensitive substrings and the Bedrock service segment to decide cache-control eligibility.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L1290-L1343
  why: The image and tool-result projection preserves scalar content, collapses one text part and filters malformed blocks.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L224-L234
  why: B218 supplies the base64 default image/jpeg, empty-data result, URL string pass-through and non-string URL result.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L1689-L1693
  why: B216 defines which prompt_cache_breakpoint values survive the owned key-presence check.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/common_utils.py#L297-L306
  why: B568 supplies top-level-over-nested eager-input precedence and the UnsupportedParamsError boundary.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L3061-L3067
  why: B2221 is the exact supports_mid_conversation_system delegate whose arguments and returned boolean must pass through.
dod:
- text: >-
    tool_names_and_native_tools: is_provider_native_tool_dict({web_search:{}})
    returns true, while {}, {web_search:{},other:{}} and {web_search:true}
    return false; each one-key dict {name:{}}, {type:{}}, {input_schema:{}},
    {description:{}}, {cache_control:{}} and {strict:{}} also returns false.
    _is_openai_function_tool returns true only for {type:function,function:null}
    (and a dict-valued function), not for {type:function}, {type:custom,function:{}},
    or {function:{}}. truncate_tool_name returns the exact input for "" and
    a 64-character name, and maps 65 a characters to 55 a characters followed
    by _635361c4; a 65-character name with the same prefix but a different
    suffix gets a different 8-hex hash. The prefix counts Unicode characters
    and the hash consumes the complete UTF-8 name.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    signature_and_compaction: an attribute-bearing tool call with outer
    provider_specific_fields={thought_signature:outer} and nested
    function.provider_specific_fields={thought_signature:inner} returns "outer";
    a truthy outer {other:x} returns null instead of falling back, an outer {}
    falls back to "inner", a non-string thought_signature=7 returns null, and
    thought_signature="" returns the empty string. A raw dict with those keys
    is not treated as an attribute-bearing tool call and returns null. Tool-use
    content reads provider_specific_fields.signature="sig" (including "") and
    ignores thought_signature; a missing/non-mapping provider_specific_fields or
    signature=7 returns null. _compaction_blocks keeps only mapping blocks with
    type=compaction from list or tuple compaction_blocks, returns them in order,
    and returns an empty tuple for absent, null, a dict or a scalar value.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    cache_and_feature_markers: target_supports_mid_conversation_system(null,
    "anthropic") and target_supports_mid_conversation_system("", "anthropic")
    return false without calling B2221; with model="claude-3-opus"
    and custom_llm_provider="anthropic", its result equals B2221's
    supports_mid_conversation_system("claude-3-opus","anthropic") result,
    proving both arguments and the returned boolean are forwarded. For
    _chat_tool_param, absent or null eager_input_streaming omits the field,
    false remains false even when the nested value is true, and
    {function:{eager_input_streaming:true}} supplies true when top-level is
    absent; a non-mapping tool=7 also omits the field. {eager_input_streaming:"true"} propagates
    B568's status=400 UnsupportedParamsError with message
    "litellm.UnsupportedParamsError: eager_input_streaming must be a boolean"
    and param=null, code=null. A truthy cache_control={type:ephemeral,ttl:1h}
    is copied to a dict target for model="anthropic/claude-3-opus",
    model="gemini/gemini-2.5-pro" and model="arn:aws:bedrock:us-east-1:123:application-inference-profile/id",
    but not for model="arn:aws:sagemaker:us-east-1:123:endpoint/my-bedrock-endpoint",
    model="openai/gpt-4o", model=null, model="" or cache_control={}; model matching
    "ANTHROPIC" or "CLAUDE" is case-insensitive. An absent prompt_cache_breakpoint
    leaves the target unchanged, null is dropped by B216, and false or 0 is
    retained. translatable_anthropic_params returns exactly
    [messages,metadata,system,tool_choice,tools,thinking,output_format,output_config,stop_sequences].
    _is_web_search_tool returns true for type="web_search_20260209", type="web_search"
    and name="web_search" without input_schema; name="web_search" with
    input_schema={} and type="function" return false.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    image_source_projection: a dict {type:base64,data:YWJj} becomes
    "data:image/jpeg;base64,YWJj" through B218, while media_type=application/pdf
    becomes "data:application/pdf;base64,YWJj"; absent or empty data returns
    null, and a non-dict source returns null before B218. {type:url,url:"https://image.test/a"}
    returns that URL without network I/O, url=7 returns the empty string, and
    an unknown type returns null. _tool_result_image_part accepts image and
    document blocks with a valid source as {type:image_url,image_url:{url:<url>}},
    but drops a non-dict/invalid source. _tool_result_part maps string "hello"
    to text, non-dicts and unknown types to null, text with text=null or 0 to
    text="", tool_reference with missing or null tool_name to tool_name="", and both
    image/document types through the image projection.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    tool_result_content_shape: raw string "hello" survives; null, 7 and {} become
    the empty string; [] and a list whose entries all drop become the empty
    string; ["a"] collapses to {type:text,text:"a"}'s string "a"; and
    ["a",{type:text,text:7}] remains an ordered list with text "a" and "7".
    A list containing valid image and text parts remains a list, while invalid
    images, unsupported blocks and arbitrary non-dict items disappear. The
    helper and oracle fixtures independently exercise attribute objects, raw
    mappings, scalar/list content and every delegated marker outcome above.
  proof: [behavior-tests, new-cases, oracle, helper-python, helper-corpus]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The production module is missing branch-specific tests for signatures, markers, model predicates and tool-result shapes.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_content_primitives::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: The independent pinned adapters for typed attributes, raw mappings and delegated outcomes are absent or fail strict checks.
    run: test -f tools/oracle/helpers/messages_content_primitives.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/messages_content_primitives.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The messages_content_primitives HelperCase variant is not represented by a newly added shared-parser seed or cannot replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_content_primitives-*)" && grep -qE '^[[:space:]]+messages_content_primitives:' tools/oracle/fuzz/corpus/helper_case/messages_content_primitives-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: The named primitive scenarios have no newly added parity fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-content-primitives)"
oracle_cases:
- tools/oracle/cases/helpers/messages-content-primitives/tool-names-and-native-tools.yaml
- tools/oracle/cases/helpers/messages-content-primitives/signature-and-compaction.yaml
- tools/oracle/cases/helpers/messages-content-primitives/cache-and-feature-markers.yaml
- tools/oracle/cases/helpers/messages-content-primitives/image-source-projection.yaml
- tools/oracle/cases/helpers/messages-content-primitives/tool-result-content-shape.yaml
deviations: []
out_of_scope:
- create_tool_name_mapping L94-L114 and translate_thinking_for_model L703-L737 have no caller at the pinned commit; no behavior case is needed for either.
- B964 owns LiteLLMAnthropicMessagesAdapter.__init__ L351-L353 and translate_anthropic_messages_to_openai L456-L639; B965 owns translate_anthropic_thinking_to_reasoning_effort L642-L669, _apply_reasoning_summary_wrapping L739-L761 and the non-tool option methods in L923-L1212.
- B2431 owns the tool/schema methods L763-L921, L1039-L1052, L1066-L1099 and L1175-L1201; B966 owns output and streaming conversion L1345-L1766; B967 owns AnthropicAdapter and request composition L229-L345,L1214-L1288.
- B218 owns anthropic_image_source_to_openai_url; B216 owns with_prompt_cache_breakpoint; B568 owns eager_input_streaming_flag; B2221 owns supports_mid_conversation_system. This task calls each at its seam and does not reimplement it.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_content_primitives in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_content_primitives.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_content_primitives.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A truthy outer provider_specific_fields mapping without thought_signature prevents the nested function mapping from being consulted; an empty mapping has the opposite fallback behavior.
- _add_prompt_cache_breakpoint_if_present checks key presence, but B216 drops only None, so false and 0 must not be normalized away.
- A non-string URL from a url source becomes the empty string through B218, whereas an invalid source type becomes None; treating both as the same drop changes the projection.
- One surviving text part collapses to a scalar string, but two surviving parts, including text plus an image, remain a list.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
