id: B9694
title: Prove the playground, compare, compliance, agent builder and transform-request requests through the booted proxy
description: >-
  Add HTTP oracle cases for the inference and helper requests the Playground page, its
  Compare and Compliance tabs, the agent builder and the Transform Request page send. B9090
  takes in the covered files unchanged, including uploadValidation.ts that B4921 names, and
  B9091 builds them; nothing is ported. B147 left the shared components/llm_calls chat and
  Responses builders to this page task. None of these components checks premiumUser, so there
  is no patch. Every route has an owner and no handler is registered here.

  How the page sends. The OpenAI SDK client is created with baseURL set to the proxy base
  without /v1, so the SDK calls go to /chat/completions, /responses, /images/generations,
  /images/edits, /audio/speech and /audio/transcriptions, with Authorization: Bearer <key>
  (the session key or a key typed into the page). Every call adds x-litellm-tags: <tags joined
  by ","> when tags are chosen, plus any custom headers from the settings panel; for fetch
  calls the auth and Content-Type headers win over custom ones with the same name.

  Chat completions (B004 non-stream, B005 stream). Body {model, litellm_trace_id,
  messages, vector_store_ids?, guardrails?, policies?, tools?, tool_choice:"auto" when tools,
  temperature?, max_tokens?, mock_testing_fallbacks:true?}; streaming adds stream:true and
  stream_options:{include_usage:true}, non-streaming sends stream:false and reads the
  x-litellm-cache-key header. MCP selection becomes tools of type "mcp" with server_label
  "litellm", server_url "litellm_proxy/mcp" for all servers, "litellm_proxy/mcp/<alias or
  server_name>" with allowed_tools for one server, or server_label <toolset name> and
  "litellm_proxy/mcp/<encoded toolset name>" for a toolset, all with require_approval "never".
  The stream reader uses delta.content, delta.reasoning_content,
  delta.provider_specific_fields.search_results and mcp_list_tools/mcp_tool_calls/
  mcp_call_results, and the last chunk's usage including completion_tokens_details and cost.
  The on-disk chat/openai-stream-usage case sends a plain body without litellm_trace_id or
  tags, so add a streamed and a non-streamed playground body with tags, a vector store, a
  guardrail and temperature, a mock_testing_fallbacks request, and an MCP-tools request against
  a mock MCP server (B8648 does not apply; MCP execution is B4727/B4728's).

  Responses (B080). Body {model, input, litellm_trace_id, previous_response_id?,
  vector_store_ids?, guardrails?, policies?, tools?, tool_choice:"auto"}; here MCP tools use
  absolute server_url "<proxy base>/mcp" or "<proxy base>/mcp/<encoded server_name>" with
  server_label set to the server name, and code interpreter adds {type:"code_interpreter",
  container:{type:"auto"}}. CodeInterpreterOutput then fetches GET
  /v1/containers/<container_id>/files/<file_id>/content (B3371, B3372). Add a two-turn
  Responses chat that sends previous_response_id, and a code-interpreter turn whose container
  file is read back from the mock. The Anthropic tab sends POST /v1/messages {model, messages,
  stream, max_tokens:1024, litellm_trace_id} with the bearer key (B081); add stream and non-
  stream. The interactions tab sends POST /v1beta/interactions {model, input, stream:true,
  previous_interaction_id?} (B3507, mounted by B8774); add a two-turn case. Embeddings send
  POST /embeddings {model, input} by fetch (B006); images send POST /images/generations
  {model, prompt} and, for each uploaded image separately, multipart POST /images/edits with
  model, image and prompt (B082); audio sends POST /audio/speech {model, input, voice,
  response_format?} and multipart POST /audio/transcriptions with model, file, language?,
  prompt?, response_format?, temperature? (B083). The realtime tab opens
  <ws base>/v1/realtime?model=<m> with subprotocols ["realtime",
  "openai-insecure-api-key.<key>"] (B1125); the on-disk
  harness/websocket-oracle/auth-subprotocol.yaml already sends that handshake, so reuse it.

  Agents (B8589, mounted by B8648). The agent picker reads GET /v1/agents (B4784, mounted by
  B8647) and modelInfoCall page 1 size 200 for litellm_agent/ models (B850). Sending to an
  agent posts JSON-RPC {jsonrpc:"2.0", id, method:"message/send", params:{message:{role:
  "user", parts:[{kind:"text", text}], messageId}, metadata:{guardrails}?}} to POST
  /a2a/<agent_id>/message/send; Compare streams with method "message/stream" to POST
  /a2a/<agent_id> and reads the SSE frames. Point the agent at a mock A2A server and add one
  of each. AgentBuilderView creates POST /model/new {model_name, litellm_params:{model:
  "litellm_agent/<underlying>", litellm_system_prompt?, temperature, max_tokens, tools},
  model_info:{}} (B1215) and reads model_id from the answer, updates with PATCH
  /model/<id>/update and the same params plus the stored model_info (B835), deletes with POST
  /model/delete (B838) and makes a key with POST /key/generate {user_id, models:[<agent
  name>], key_alias:"Agent: <agent name>"} (B055). Add the create, a chat through the new agent
  model that B8253 resolves, the key creation, the update and the delete.

  Compliance (B3251, mounted by B8790). The quick test sends POST
  /utils/test_policies_and_guardrails {policy_names, guardrail_names, inputs:{texts:[t]},
  inputs_list, request_data:{}, input_type:"request", agent_id} with unset fields as explicit
  null and reads inputs.texts and guardrail_errors[].guardrail_name/message; the batch run sends
  inputs_list:[{texts:[t]}...] and, in chat-completions mode with a fixed agent, agent_id, and
  reads results[].guardrail_errors. When the backend mode is a model it instead sends a chat
  completion. B9752 explicitly does not cover this route; add a passing and a blocked quick
  test, a batch, and the batch with agent_id. Guardrail, policy, tag, vector store and MCP
  selectors reuse B9735's cases, and the MCP tool list and call reuse B9735's
  mcp-toolsets-and-tools and B9762's call-with-provider-auth-and-guardrails.

  Transform request (B8598, mounted by B8635). TransformRequestPanel sends POST
  /utils/transform_request {call_type:"completion", request_body:<parsed JSON>} and reads
  raw_request_api_base, raw_request_body and raw_request_headers; add a mock-provider model
  and a body the safety check rejects with 400.

  Use B860's Postgres fixture with B5076's bootstrap and mock upstreams for every provider,
  agent and MCP server; no case reaches the internet. Compare status, content type, SSE frame
  order where the page reads it and the stable body fields above. About 700 case lines.
