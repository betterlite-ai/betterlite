    why: Embeddings by fetch to <base>/embeddings.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/playground/llm_calls/image_edits.tsx#L30-L55
