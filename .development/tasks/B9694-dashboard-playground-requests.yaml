  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/playground/components/chat_ui/AgentBuilderView.tsx#L336-L440
    why: Agent model create, update, key and delete requests.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/playground/components/compareUI/CompareUI.tsx#L576-L625
    why: Compare uses the A2A stream or the shared chat builder per panel.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L1266-L1295
    why: Transform request call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/transform-request/TransformRequestPanel.tsx#L75-L100
    why: call_type completion and the raw request fields shown.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L14139-L14158
    why: B8598's /utils/transform_request handler.
dod:
  - text: Chat, Responses, Anthropic, embeddings, image and audio requests in the playground's exact shapes match LiteLLM, streamed where the page streams.
    proof: [playground-cases, oracle]
  - text: The agent builder's create, chat, key, update and delete match LiteLLM.
    proof: [playground-cases, oracle]
  - text: The transform request page matches LiteLLM.
    proof: [playground-cases, oracle]
checks:
  optional: []
  commands:
    - id: playground-cases
      why: No booted-proxy case sends the playground's inference bodies or agent builder writes.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/playground)" &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/ui/playground
oracle_cases:
  - tools/oracle/cases/ui/playground/chat-stream-tags-and-options.yaml
  - tools/oracle/cases/ui/playground/chat-non-stream-cache-header.yaml
  - tools/oracle/cases/ui/playground/chat-mock-fallbacks.yaml
  - tools/oracle/cases/ui/playground/responses-two-turns.yaml
  - tools/oracle/cases/ui/playground/anthropic-stream-and-plain.yaml
  - tools/oracle/cases/ui/playground/embeddings-unversioned-path.yaml
  - tools/oracle/cases/ui/playground/images-generate-and-edit.yaml
  - tools/oracle/cases/ui/playground/audio-speech-and-transcription.yaml
  - tools/oracle/cases/ui/playground/agent-builder-lifecycle.yaml
  - tools/oracle/cases/ui/playground/transform-request.yaml
deviations: []
out_of_scope:
  - B9090 retains every function in the playground, compare, compliance, chat_ui and transform-request files, including uploadValidation.ts; B9091 builds them and B146 drives the playground in the browser.
  - "B004, B005, B006, B080, B081, B082, B083, B8253, B1215, B835, B838, B055 and B8598 own the handlers and B8635 the transform request mount. Deferred cases go to their owners: chat-mcp-tools to B140, responses-code-interpreter-file to B3372, interactions-two-turns to B8774, a2a-send-and-stream to B8648 with B8589, B4784 and B8647, compliance-quick-and-batch to B8790, and the realtime handshake reuse to B1125."
  - MCP tool listing and calling cases stay with B8626 and B9762; this task builds its own listed inference transcripts and consumes no B9735 selector case or component test.
pitfalls:
  - The SDK calls have no /v1 prefix, so a gateway that only mounts /v1/chat/completions fails every playground request while the generic cases pass.
  - Image edits with several files are several requests, one image each.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
