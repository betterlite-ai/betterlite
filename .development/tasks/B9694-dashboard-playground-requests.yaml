dod:
  - text: Chat, Responses, Anthropic, interactions, embeddings, image and audio requests in the playground's exact shapes match LiteLLM, streamed where the page streams.
    proof: [playground-cases, oracle]
  - text: A2A send and stream, the agent builder's create, chat, key, update and delete, and the code interpreter file read match LiteLLM.
    proof: [playground-cases, oracle]
  - text: Compliance quick and batch tests and the transform request page match LiteLLM.
    proof: [playground-cases, oracle]
checks:
  optional: []
  commands:
    - id: playground-cases
      why: No booted-proxy case sends the playground's inference bodies, A2A calls, agent builder writes or compliance tests.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/playground)" &&
        ! grep -rlq '^kind: helper$' tools/oracle/cases/ui/playground
oracle_cases:
  - tools/oracle/cases/ui/playground/chat-stream-tags-and-options.yaml
  - tools/oracle/cases/ui/playground/chat-non-stream-cache-header.yaml
  - tools/oracle/cases/ui/playground/chat-mock-fallbacks.yaml
  - tools/oracle/cases/ui/playground/chat-mcp-tools.yaml
  - tools/oracle/cases/ui/playground/responses-two-turns.yaml
  - tools/oracle/cases/ui/playground/responses-code-interpreter-file.yaml
  - tools/oracle/cases/ui/playground/anthropic-stream-and-plain.yaml
  - tools/oracle/cases/ui/playground/interactions-two-turns.yaml
  - tools/oracle/cases/ui/playground/embeddings-unversioned-path.yaml
  - tools/oracle/cases/ui/playground/images-generate-and-edit.yaml
  - tools/oracle/cases/ui/playground/audio-speech-and-transcription.yaml
  - tools/oracle/cases/ui/playground/a2a-send-and-stream.yaml
  - tools/oracle/cases/ui/playground/agent-builder-lifecycle.yaml
  - tools/oracle/cases/ui/playground/compliance-quick-and-batch.yaml
  - tools/oracle/cases/ui/playground/transform-request.yaml
  - tools/oracle/cases/harness/websocket-oracle/auth-subprotocol.yaml
deviations: []
out_of_scope:
  - B9090 retains every function in the playground, compare, compliance, chat_ui and transform-request files, including uploadValidation.ts; B9091 builds them and B146 drives the playground in the browser.
  - B004, B005, B006, B080, B081, B082, B083, B1125, B3371, B3372, B3507, B8589, B8253, B1215, B835, B838, B055, B3251 and B8598 own the handlers; B8774, B8648, B8647, B8790 and B8635 own the mounts.
  - MCP tool listing and calling are B9735's and B9762's cases; MCP execution inside a completion is B4727/B4728's behavior, checked here only through the playground body.
pitfalls:
  - The SDK calls have no /v1 prefix, so a gateway that only mounts /v1/chat/completions fails every playground request while the generic cases pass.
  - Chat MCP tools use the litellm_proxy/mcp pseudo-URL but Responses MCP tools use the absolute proxy URL; one case per form is needed.
  - The compliance call sends unset fields as explicit null, and a handler that treats null differently from absent changes the result.
  - Image edits with several files are several requests, one image each.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
