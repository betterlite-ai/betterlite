id: B619
title: Bedrock OpenAI Invoke and runtime request mapping
description: >-
  Add Bedrock OpenAI Invoke/runtime chat request overrides: signed endpoint construction, region-from-model path,
  max_completion_tokens and refused option/effort handling. Preserve typed OpenAI messages and forward-compatible
  reasoning options using catalog metadata.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_openai_transformation.py:
  AmazonBedrockOpenAIConfig.__init__ L47-L49; AmazonBedrockOpenAIConfig.custom_llm_provider L52-L53; AmazonBedrockOpenAIConfig._get_openai_model_id
  L55-L68; AmazonBedrockOpenAIConfig.get_complete_url L70-L106; AmazonBedrockOpenAIConfig.sign_request L108-L132;
  AmazonBedrockOpenAIConfig.transform_request L134-L161; AmazonBedrockOpenAIConfig.validate_environment L163-L181;
  AmazonBedrockOpenAIConfig.get_error_class L183-L185. litellm/llms/bedrock/chat/chat_completions/transformation.py:
  with_max_completion_tokens L243-L258; AmazonBedrockRuntimeChatCompletionsConfig.__init__ L262-L264; AmazonBedrockRuntimeChatCompletionsConfig.custom_llm_provider
  L267-L268; AmazonBedrockRuntimeChatCompletionsConfig.uses_async_transform_request L271-L272; AmazonBedrockRuntimeChatCompletionsConfig.get_error_class
  L274-L280; AmazonBedrockRuntimeChatCompletionsConfig.validate_environment L282-L300; AmazonBedrockRuntimeChatCompletionsConfig.get_complete_url
  L302-L329; AmazonBedrockRuntimeChatCompletionsConfig._params_with_region_from_path L331-L337; AmazonBedrockRuntimeChatCompletionsConfig.sign_request
  L339-L360; AmazonBedrockRuntimeChatCompletionsConfig.map_openai_params L362-L405; AmazonBedrockRuntimeChatCompletionsConfig._inference_params
  L407-L414; AmazonBedrockRuntimeChatCompletionsConfig.transform_request L416-L431; AmazonBedrockRuntimeChatCompletionsConfig.async_transform_request
  L433-L448; AmazonBedrockRuntimeChatCompletionsConfig.get_supported_openai_params L489-L502; AmazonBedrockRuntimeChatCompletionsConfig.get_model_response_iterator
  L504-L514.


  remote-url-current-rejection supplies an http:// image or PDF URL requiring local bytes and expects ImageFetchError
  status 400 before transport under the current open request-download decision; inject the same failed-download
  seam into the pinned helper. Inline bytes continue to compare normally; provider-forwardable URL descriptors remain
  unchanged where the source forwards them.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse bedrock_bearer_token from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse split_bedrock_region_path from B2203 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse bedrock_request_metadata_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation
  remains with that prerequisite.


  Reuse merge_bedrock_invoke_headers from B596 (litellm/llms/bedrock/request_metadata.py); its implementation remains
  with that prerequisite.


  Reuse OpenAIGPTConfig.__init__ from B668 (litellm/llms/openai/chat/gpt_transformation.py); its implementation
  remains with that prerequisite.


  Named case contracts: openai_invoke_model_id: Initialize B668 OpenAIGPTConfig and B590 BaseAWSLLM; provider is
  bedrock. Remove one leading bedrock/ and then one leading openai/, without stripping invoke/ or arbitrary prefixes.
  Resolve region from original model/options with B591, obtain its endpoint, and apply B2203 resource-specific ARN
  slash encoding to the stripped model. Any truthy stream selects /model/{id}/invoke-with-response-stream; otherwise
  /invoke. Return endpoint_url rather than proxy_endpoint_url and preserve trailing endpoint slashes. runtime_chat_completions_url:
  Runtime config initializes B038 OpenAILikeChatConfig and keeps a truthy supplied signer or creates B590 BaseAWSLLM.
  Provider is bedrock and async transform is supported. If explicit api_base is not None and contains chat/completions
  anywhere, return it with trailing slashes removed without region resolution. Otherwise resolve B591 using path-region
  options, accept aws_bedrock_runtime_endpoint only when it is a string, and use the returned proxy_endpoint_url
  stripped of trailing slash. Preserve a suffix /openai/v1/chat/completions, append /chat/completions to /openai/v1,
  otherwise append /openai/v1/chat/completions. region_in_path: B2203 split_bedrock_region_path extracts only a
  pinned full region. If no region or optional_params.aws_region_name is not None, return the original options;
  empty string is an explicit override. Otherwise return a copy with that region, including when the old value was
  None. Use this same record for B591 endpoint region resolution and B595 signing; do not mutate original options.
  max_completion_tokens: with_max_completion_tokens leaves a record without max_tokens unchanged. Otherwise create
  a copy removing max_tokens and inserting max_completion_tokens from it before copying remaining fields, so an
  explicit max_completion_tokens wins even when None. Preserve every other value. Runtime mapper first calls B038
  parent mapping with replace_max_completion_tokens_with_max_tokens default False forwarded unchanged, then validates
  both mapped and raw input as dict[str,object]. refused_options_drop_or_error: Compute B620 malformed effort and
  parameters refused while reasoning from raw non_default_params. If either global litellm.drop_params or the argument
  is truthy, silently drop both sets from mapped params; otherwise malformed effort fails first with UnsupportedParamsError
  400 and message {model} takes reasoning_effort as a string on Bedrock's Chat Completions endpoint, not {python_type_name}.
  Send one of its named efforts, or set `litellm.drop_params = True` to drop it. The second error is {model} doesn't
  support {sorted_refused_list} while reasoning is active on Bedrock's Chat Completions endpoint. Set reasoning_effort
  to 'none' to send them, or set `litellm.drop_params = True` to drop them. Preserve Python type names and sorted
  quoted list display. Then apply token alias conversion and B620 effort-value removal; refusal of a string value
  such as Grok none silently drops it even with drop_params false. bedrock_openai_auth: Runtime validate_environment
  delegates B038 with api_key=B590 bedrock_bearer_token(api_key), preserving its explicit-empty versus missing behavior;
  inherited header construction and caller precedence remain B038/B668. Runtime signing uses its injected signer
  with service_name=bedrock and path-region options. Both configs expose B682 BedrockError with supplied message/status/headers,
  without another wrapper. Use the same bearer and credential-isolation cases as B590/B595. openai_invoke_body:
  Pop stream from original options, then copy all remaining fields except the twelve B590 authentication names.
  Delegate B503 GPT request conversion with the stripped OpenAI model ID and original messages/litellm_params/headers.
  validate_environment only runs B596 owned metadata-header removal/merge with no guardrail headers or added bearer
  key; preserve the exact same metadata cases as base Invoke. Signing delegates B595 _sign_request(service_name=bedrock)
  with every input unchanged. runtime_body_and_supported: Sync and async validate optional_params as dict[str,object],
  remove only B590 authentication names into a copy, strip region/routing model prefixes through B2203, inline media
  through B183 with should_inline=inline_remote_image_urls, then call the matching B038 parent transform. Unlike
  Invoke, stream is not removed here. Supported params preserve parent order minus n and B620 family-refused fields,
  then append reasoning_effort only when absent and B688 supports_reasoning(model,bedrock) is true. get_model_response_iterator
  always constructs B620 BedrockRuntimeChatCompletionsStreamingHandler with stream,sync_stream,json_mode unchanged.


  Global litellm.drop_params is loaded by B2201 with default False; use its existing loader. Add standalone Rust
  test bedrock_openai_never_fetches_request_urls for an otherwise valid public image URL that B183 would need to
  inline: ImageFetchError 400 and zero outbound attempts. Preserve forwardable descriptors and inline data. The
  helper oracle remote_url_current_rejection uses blocked loopback input at the pinned B183 seam.


  Write standalone Rust test bedrock_openai_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test bedrock_openai_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Shared metadata calls are B2219 _get_model_info_helper and B2221 _supports_factory/declared_value_factory/is_explicitly_disabled_factory;
  reuse those implementations directly. B157 is only the public Python facade and is not a dependency of these provider
  predicates.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-bedrock/src/openai_invoke.rs with adjacent tests under openai_invoke/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_invoke_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  openai_invoke_model_id, runtime_chat_completions_url, region_in_path, max_completion_tokens, refused_options_drop_or_error,
  bedrock_openai_auth, remote_url_current_rejection, openai_invoke_body, runtime_body_and_supported. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_openai_invoke* using HelperCase: kind:
  helper and the externally tagged bedrock_openai_invoke variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_openai_invoke that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 323 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 300 production lines, 315 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
