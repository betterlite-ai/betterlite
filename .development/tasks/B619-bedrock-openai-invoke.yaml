checks:
  optional:
  - mutants
  commands:
  - id: case-openai-invoke-model-id
    why: The openai-invoke-model-id behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::openai_invoke_cases::case_[0-9]+_openai_invoke_model_id$/)'
  - id: case-runtime-chat-completions-url
    why: The runtime-chat-completions-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::openai_invoke_cases::case_[0-9]+_runtime_chat_completions_url$/)'
  - id: case-region-in-path
    why: The region-in-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::openai_invoke_cases::case_[0-9]+_region_in_path$/)'
  - id: case-max-completion-tokens
    why: The max-completion-tokens behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::openai_invoke_cases::case_[0-9]+_max_completion_tokens$/)'
  - id: case-refused-options-drop-or-error
    why: The refused-options-drop-or-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::openai_invoke_cases::case_[0-9]+_refused_options_drop_or_error$/)'
  - id: case-bedrock-openai-auth
    why: The bedrock-openai-auth behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::openai_invoke_cases::case_[0-9]+_bedrock_openai_auth$/)'
  - id: case-remote-url-current-rejection
    why: The remote-url-current-rejection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::openai_invoke_cases::case_[0-9]+_remote_url_current_rejection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_openai_invoke.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_openai_invoke*")"
      && grep -lq 'bedrock_openai_invoke' tools/oracle/fuzz/corpus/helper_case/bedrock_openai_invoke* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_openai_invoke$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
