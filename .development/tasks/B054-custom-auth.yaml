id: B054
title: Python custom authentication and validation integration
description: >-
  Connect B165 Python callable loading to general_settings.custom_auth and install litellm_jwtauth.custom_validate
  for B053 authenticate_jwt. The MIT custom-auth result must validate as UserAPIKeyAuth; a string result
  fails with 401. litellm_settings.enable_post_custom_auth_checks=false controls the shared post-custom
  checks and warning-once path. Preserve source exception causes; execute Python through the bounded bridge
  with a concrete 30-second deadline mapped to 504 timeout_error.


  Build the production custom_auth module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  custom_auth_common_checks_warning (L1361-L1375; 15 source lines), warn_once_if_custom_auth_skips_common_checks
  (L1381-L1397; 17 source lines), log_once_if_budget_reservation_disabled (L1400-L1415; 16 source lines).
  litellm/proxy/auth/user_api_key_auth.py: _run_post_custom_auth_checks (L3769-L3935; 132 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.custom_auth_run_common_checks=False;
  custom_auth_run_common_checks=False.


  general_settings.custom_auth=None; litellm_jwtauth.custom_validate=None; litellm_settings.enable_post_custom_auth_checks=false.
  Custom validation is installed into B053, not a separate general_settings switch.


  Add the custom_auth operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a custom-auth-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::custom_auth::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 180 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  180 production, 151 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 511 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_custom_python_auth_validation_calls_time_out_after_30_seconds_with_htt.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
