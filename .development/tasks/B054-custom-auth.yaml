id: B054
title: Python authentication hooks and post-custom checks
description: >-
  Install B165 Python loading into B052's custom backend port for general_settings.custom_auth and
  B869's optional litellm_jwtauth.custom_validate port. The normal MIT custom callable is awaited with
  request and api_key; its result must validate as B732 UserAPIKeyAuth, not a string bearer. Preserve
  source validation exceptions through B757. Installed hooks have a native 30-second deadline with
  504 timeout_error; startup rejects configured but unloaded callables. No example callable is enabled
  by default. B053/B875 own JWT/backend dispatch, not a new general_settings validation switch here.

  Own auth_utils.py custom_auth_common_checks_warning L1361-L1375, warn_once_if_custom_auth_skips_common_checks
  L1381-L1397, log_once_if_budget_reservation_disabled L1400-L1415 and their boolean emission flags.
  The custom warning exists only when custom auth is configured and common checks are falsey; it
  names unenforced DB team/project budgets, model allowlists and per-model limits, says returned-token
  limits still apply, and tells operators to set general_settings.custom_auth_run_common_checks=true
  with the source custom-auth docs URL. Only an actual WARNING emission sets the process-wide flag.
  Reservation INFO likewise emits once only when disabled, explaining concurrent read-time overshoot
  and restoring disable_budget_reservation=False. No configuration read is hidden inside these helpers.

  Own user_api_key_auth.py _run_post_custom_auth_checks L3769-L3935. The caller's separate
  litellm_settings.enable_post_custom_auth_checks flag defaults false; enabling it does not enable
  general_settings.custom_auth_run_common_checks (also false). First B889 loads a nonnull end_user_id
  and applies its budget. When a row exists and common checks are falsey, B739 enforces the end-user
  hard budget immediately, before expiry and zero-price detection. Expiry accepts datetime or ISO text,
  assumes UTC for naive values, and rejects strictly before now, allowing equality. Return401 expired_key
  with both timestamps and B881's abbreviated token param, or empty param for falsey token.

  Only truthy common-checks calls B889 key/fallback access. Resolve current model(s) through B881;
  B750 zero-price recognition needs a router and nonnull model. Non-skipped budgets with nonempty dict
  key model budgets, model list and nonnull token call B753 fallback checks in order; unlike the ordinary
  key path there is no database prerequisite here. Recompute models after rewrites. Always call B753
  user budget lookup and assign its result to user_model_max_budget, even for free/unenforceable models;
  this overwrites a custom value with null on failed/absent lookup. Enforce user model budgets only when
  not skipped and models exist. End-user model budgets additionally need a nonempty dict and nonnull
  end_user_id; use B755's limiter port and preserve its exception behavior. Finally a nonnull project ID
  loads B879 and updates project_metadata/alias only for a returned row. Return the resulting token.
  This helper does not call centralized common_checks or reserve budgets; B1221/B1225 do that later.

  Implement custom_auth in betterlite-server with files below300 lines. B856 Management::models
  custom_auth adapters invoke only owned MIT helpers with injected collaborators and production Rust;
  use B171 helper_case seeds. B001 HTTP cases exercise the real backend with B860 Postgres fixtures
  using POSTGRES_TEST_URL or testcontainers. B002 loader tests callable_settings_default_none,
  post_and_common_flags_independent_defaults_false, invalid_bool_rejected and configured_hook_must_load
  use actual nested settings and config_yaml seeds. Reuse B165 decoding/deadline infrastructure; no
  new parser. Allow 210 production, 260 tests, 80 adapters, 90 wiring and 70 config lines, 710 within750.
