references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L1361-L1415
    why: Warning/INFO messages, process flags and actual emission conditions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L3769-L3935
    why: Owned post-custom sequence and actual common-checks setting reads.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1568-L1583
    why: Custom callable validation and separate post-check enable flag.
dod:
  - text: 'Named cases: structured_hook_result_and_string401, hook_exception_causes,
      hook_absent_not_example, warning_conditions_exact_message_and_once_flag,
      no_warning_does_not_set_flag, reservation_info_disabled_and_once,
      post_and_common_flags_four_combinations, end_user_hard_before_expiry_even_zero_cost,
      expiry_iso_datetime_naive_equal_and_masked_or_empty_param,
      common_flag_controls_access_only, key_model_budget_without_database,
      fallback_recomputed_for_later_checks, free_model_still_attaches_user_budget,
      failed_user_lookup_overwrites_custom_budget_null, user_then_end_user_model_checks,
      project_metadata_refresh_missing_row_unchanged, no_common_gate_or_reservation_here,
      native_python_auth_deadline_30_seconds_returns_504_timeout_error.'
    proof: [behavior-tests, oracle]
  - text: Actual config-loader tests, helper adapters and new shared decoder seeds are exercised.
    proof: [config-tests, config-corpus, helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Hook integration or post-custom ordering differs from the owned code.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^custom_auth::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: Independent hook settings are ignored or conflated.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^custom_auth::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: Configuration boundary seed is absent or fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/custom-auth-*")" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: The independent MIT adapter is absent or fails strict checks.
      run: test -f tools/oracle/helpers/custom_auth.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new shared helper seed exists or replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/custom-auth-*")" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/custom-auth/warning-and-reservation-log-flags.yaml
  - tools/oracle/cases/helpers/custom-auth/post-check-order-and-field-updates.yaml
  - tools/oracle/cases/auth/custom-auth/structured-principal-and-invalid-string.yaml
  - tools/oracle/cases/auth/custom-auth/post-and-common-flags.yaml
  - tools/oracle/cases/auth/custom-auth/expiry-and-end-user-budget.yaml
deviations:
  - what: Custom Python auth/validation calls time out after 30 seconds with 504 timeout_error.
    why: Source sets no local deadline; native_python_auth_deadline_30_seconds_returns_504_timeout_error proves bounded waits.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1568-L1579
out_of_scope:
  - B052 owns preflight dispatch; B053/B875 JWT/custom backend selection; B165 callable transport/loading.
  - B1221 owns centralized common checks and B1225 budget reservation handoff.
pitfalls:
  - 'The oracle helper for this task is pre-registered as custom_auth in the server group. Replace the stub Op in tools/oracle/src/helpers/server/custom_auth.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/custom_auth.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Zero-price detection occurs after the immediate end-user hard-budget check on the no-common-checks path.
  - The two custom-check switches are independent and control different stages.
budget:
  max_changed_lines: 750
  max_new_expects: 0
review_level: security
