    why: Regex matching for tool_name and tool_type patterns; helper for rule matching.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/tool_permission.py#L9-L54
    why: ToolPermissionRule structure with tool_name, tool_type, decision and allowed_param_patterns.
