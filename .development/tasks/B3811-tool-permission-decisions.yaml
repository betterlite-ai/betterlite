id: B3811
title: Evaluate ordered tool permissions and nested argument patterns
description: >-
  Implement tool permission evaluation with ordered rule matching and nested argument pattern validation.
  Given a tool name, tool type and optional function arguments, evaluate rules in order to determine if
  the tool is allowed, checking both tool_name/tool_type regex matches and optional allowed_param_patterns
  constraints on nested argument values. Rules are pre-compiled by B3810.
  _get_permission_for_tool_call returns (is_allowed, matched_rule_id, message) with detailed permission/denial
  reasoning, defaulting to default_action when no rule matches.
  Tool argument paths use dot notation (field.nested.key) and array notation (field[]
  for items in an array) to specify constraints on nested values that must match as strings
  against their patterns. Arguments missing required paths fail matching.
  A tool_call carries function.name and type, and the flow checks rules until one matches, then returns
  whether it is allowed (decision == "allow") or denied.
  Evaluation succeeds without arguments when a matching rule has no allowed_param_patterns.
  When matching fails due to an argument error (parse, missing, pattern), continue to the next rule;
  fall back to default_action if none match, preserving the last pattern failure message for context when denying.
  The task provides evaluation functions for request and response hooks to call; B3812 wraps this
  for request enforcement and B3813 wraps it for response enforcement.
