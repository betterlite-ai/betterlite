dod:
  - text: "`acompletion` and `completion` return B158's response objects with `_hidden_params` filled, against a local mock server."
    proof: [router-calls]
  - text: Streams from both forms yield chunk objects, end cleanly, and show the hidden params of the current source after a mid-stream fallback.
    proof: [router-streams]
  - text: "`anthropic_messages` returns the response dict or yields raw bytes when streaming."
    proof: [router-messages]
  - text: Native errors become the B163 classes with retry counts set, and a batch returns failures as items.
    proof: [router-errors]
  - text: The file stays under the 300-line limit and passes strict basedpyright and ruff.
    proof: [python-lint]
checks:
  optional: []
  commands:
  - id: router-calls
    why: A call returns the wrong type or loses the hidden params.
    run: $U crates/betterlite-python/tests/test_router_calls.py -k calls
  - id: router-streams
    why: A stream never ends or shows stale hidden params.
    run: $U crates/betterlite-python/tests/test_router_calls.py -k streams
  - id: router-messages
    why: Anthropic bytes are decoded, re-encoded or dropped.
    run: $U crates/betterlite-python/tests/test_router_calls.py -k messages
  - id: router-errors
    why: An error class or retry count is wrong, or a batch raises for one item.
    run: $U crates/betterlite-python/tests/test_router_calls.py -k errors
  - id: python-lint
    why: Type drift against the stubs.
    run: $LINT
oracle_cases: []
deviations:
  - what: A native error carries `num_retries` and `max_retries` taken from the Rust call, and the Python side adds nothing.
    why: LiteLLM sets them in the retry loop; here the loop is Rust.
out_of_scope:
  - "Routing, retry, fallback and cooldown logic is B6020 and B6021. The native bridge is B6022. Router construction and settings JSON is B162's last part."
  - "Other Router call types (embeddings, images, audio and the like) are plugged in by later parts."
pitfalls:
  - "Do not call `asyncio.run` or start a thread for `completion`; the native blocking method releases the GIL."
  - "A stream's `hidden_params()` must be read on each access, never copied once."
  - "A batch error item is an exception object in the list. Raising it hides the other results."
  - "Do not decode the anthropic bytes: callers forward them as they are."
review_level: standard
budget:
  max_changed_lines: 1200
  max_new_expects: 0
