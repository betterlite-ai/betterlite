dod:
  - text: >-
      _StreamedChoiceState is a frozen dataclass holding buffered_text, yielded_masked_text_len,
      committed_detections, latest_detections, and next_trim_len, all with defaults.
    proof: [streaming-state-tests]

  - text: >-
      _StreamedScanPlan is a frozen dataclass holding context_chars, exception_phrases tuple,
      and conditional_words tuple, all with defaults.
    proof: [streaming-state-tests]

  - text: >-
      _streamed_scan_plan returns a plan with context_chars = max(512, longest keyword length),
      exception_phrases from all loaded categories, and conditional_words from all conditional categories.
    proof: [streaming-plan-tests]

  - text: >-
      _cut_breaks_wider_context returns true if any exception phrase appears in buffered_lower
      but not in tail_lower, or if any conditional word appears in the cut sentence (last
      sentence of head + first sentence of tail, split by sentence terminators).
    proof: [streaming-context-tests]

  - text: >-
      _trim_streamed_choice_buffer returns the deferred state (next_trim_len += context_chars)
      when buffered_text <= max(2 * context_chars, next_trim_len), deferring trim.
    proof: [streaming-trim-tests]

  - text: >-
      _trim_streamed_choice_buffer defers when _cut_breaks_wider_context returns true,
      checking that exception phrases or conditional sentences do not straddle the cut boundary.
    proof: [streaming-trim-tests]

  - text: >-
      _trim_streamed_choice_buffer defers when _filter_single_text raises any exception
      while scanning head or tail, falling back to retry with larger buffer.
    proof: [streaming-trim-tests]

  - text: >-
      _trim_streamed_choice_buffer defers when masked_head + masked_tail != masked_text,
      indicating a match or phrase straddles the cut boundary.
    proof: [streaming-trim-tests]

  - text: >-
      _trim_streamed_choice_buffer defers when len(masked_head) > state.yielded_masked_text_len,
      meaning the masked prefix has not yet been fully yielded to the client.
    proof: [streaming-trim-tests]

  - text: >-
      _trim_streamed_choice_buffer returns a trimmed state with buffered_text = tail,
      yielded_masked_text_len -= len(masked_head), committed_detections += head_detections,
      and next_trim_len = 0, when all deferral conditions are false.
    proof: [streaming-trim-tests]

  - text: >-
      _merge_detections returns a tuple of detections keeping only the first occurrence
      of each unique detection, removing duplicates by value not identity.
    proof: [streaming-merge-tests]

  - text: >-
      stream_filter_hook accepts user_api_key_dict, response (AsyncGenerator), and request_data,
      and yields ModelResponseStream items with masked content.
    proof: [streaming-hook-tests, streaming-hook-oracle]

  - text: >-
      stream_filter_hook maintains state_by_choice dict mapping choice_index to _StreamedChoiceState,
      processing each new chunk and final flag per choice index.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook extracts content, choice_index, and finish_reason (is_final) from
      each choice's delta, handling missing or non-integer indices by defaulting to 0.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook skips choices with no content and no final flag, continuing to
      next choice without yielding.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook appends a synthetic space to text_to_scan when is_final is true,
      triggering word-boundary (\b) regex matches, and strips the space from masked_text before yielding.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook calculates safe_to_yield_len = max(yielded_masked_text_len,
      len(masked_text) - (0 if is_final else 50)), preserving the 50-character holdback for non-final chunks.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook sets choice.delta.content = masked_text[yielded_masked_text_len:safe_to_yield_len],
      yielding only the safe portion of newly masked text.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook calls _trim_streamed_choice_buffer on non-final chunks, applying
      the buffer trimming strategy, and does not trim final chunks.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook raises HTTPException immediately on BLOCK detections during
      _filter_single_text, updating state with latest detections before raising.
    proof: [streaming-hook-tests, streaming-hook-oracle]

  - text: >-
      stream_filter_hook catches non-HTTPException exceptions from _filter_single_text,
      logs the error, falls back to unmasked text_to_scan, and retains previous latest_detections.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook merges committed and latest detections from all choice states,
      deduplicating them, counting masked entities, and calling _log_guardrail_information.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook sets status = "guardrail_intervened" on HTTPException, "success"
      on normal completion, and "guardrail_failed_to_respond" on other exceptions.
    proof: [streaming-hook-tests, streaming-hook-oracle]

  - text: >-
      stream_filter_hook accumulates scan_seconds from _filter_single_text perf_counter
      timing, adds trim perf_counter timing, and passes total duration to _log_guardrail_information.
    proof: [streaming-hook-tests]

  - text: >-
      stream_filter_hook writes a finally-block to _log_guardrail_information even when
      the stream is cancelled, raising HTTPException, or encountering other exceptions.
    proof: [streaming-hook-oracle]

checks:
  optional: []
  commands:
    - id: streaming-state-tests
      why: _StreamedChoiceState or _StreamedScanPlan is not a frozen dataclass with correct fields
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_filter_streaming::state/)'

    - id: streaming-plan-tests
      why: _streamed_scan_plan does not construct correct plan values or tests are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_filter_streaming::plan/)'

    - id: streaming-context-tests
      why: _cut_breaks_wider_context does not check exception phrases or conditional words
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_filter_streaming::context/)'

    - id: streaming-trim-tests
      why: _trim_streamed_choice_buffer does not defer or trim correctly under all conditions
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_filter_streaming::trim/)'

    - id: streaming-merge-tests
      why: _merge_detections does not deduplicate detections or tests are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_filter_streaming::merge/)'

    - id: streaming-hook-tests
      why: stream_filter_hook does not process chunks, apply holdback, or log correctly
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_filter_streaming::hook/)'

    - id: streaming-hook-oracle
      why: stream_filter_hook cases do not match LiteLLM behavior on holdback, trim, or logging
      run: cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/guardrails/

