deviations: []

out_of_scope:
  - SSE decoder and streaming framework integration; stream_filter_hook accepts already-decoded ModelResponseStream items.
  - apply_guardrail (the nonstreaming guardrail constructor) and its request path; stream_filter_hook is the post-call path only.
  - CustomGuardrail base and logging callback dispatch; owned by B104.

pitfalls:
  - >-
      The synthetic space appended to text_to_scan for final chunks must be stripped from
      masked_text before yielding, else the space appears in the stream output.
  - >-
      state.yielded_masked_text_len tracks the masked text length, not the original length;
      len(masked_head) comparison must use masked_head length, not original head length.
  - >-
      _trim_streamed_choice_buffer must collect head_detections via a mutable list passed to
      _filter_single_text; do not reuse the same list across multiple scans.
  - >-
      safe_to_yield_len is max(previous.yielded_masked_text_len, len(masked) - holdback),
      ensuring it never goes backward even if a new chunk yields less text than before.
  - >-
      The next_trim_len deferral mechanism must accumulate (increment by context_chars each defer),
      not reset to the buffered length; otherwise buffering stalls when content is constant-length.
  - >-
      HTTPException raised by _filter_single_text updates state with latest_detections before
      re-raising, so the finally-block includes those detections in the logged response.
  - >-
      Detections from split choices must be merged by value (equality), not by identity,
      because _filter_single_text constructs new detection objects on each call.
  - >-
      choice_index extraction must handle missing index attributes and non-integer values
      (e.g., string indices); default to 0 rather than raising.
  - >-
      Duration passed to _log_guardrail_information is accumulated perf_counter time from
      both scan and trim operations, not wall-clock time; do not use datetime.now() delta.

review_level: standard
