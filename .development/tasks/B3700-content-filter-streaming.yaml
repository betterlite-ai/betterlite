id: B3700
title: Content filter streaming holdback and buffer trimming
description: >-
  Build per-choice buffered scanning with a 50-character holdback and 512-character
  default context, widened to accommodate the longest configured keyword. Defer trim
  decisions when exception phrases straddle the cut boundary, unfinished conditional
  sentences span the cut, the masked halves differ from the whole (masked match straddles cut),
  or the prefix has not yet been yielded to the client. Move trimmed detections to committed;
  merge deduplicated detections at stream end. Preserve final-chunk space handling, detection
  deduplication and finally-block tracing even when the stream is cancelled or raises.

  B3700 defines CONTENT_FILTER_STREAMING_SCAN_CONTEXT_CHARS (512) and
  CONTENT_FILTER_STREAMING_HOLDBACK_CHARS (50) locally. The streaming hook accepts
  decoded chunks; it does not own an SSE decoder or call apply_guardrail. Warning and
  raw-text fallback behavior matches the nonstreaming filter's exception handling.

