id: B320
title: Typed tag selectors and bounded header patterns
description: 'Implement typed tag tokens, positive/required/excluded matching and configured header patterns
  as a pure candidate matcher. Compile bounded configured patterns once using a maintained regex library;
  warn once and skip syntactically invalid patterns. Keep trusted inherited constraints separate from
  caller tags in the input type so B321 can apply policy without parsing the same strings twice. Use a
  maintained Python-compatible regex implementation with an explicit work bound. Unsupported valid Python
  constructs or exhausted work produce a named warning and skip the pattern; never silently reinterpret
  it. Configuration boundary keys introduced or consumed here: tag_regex, tags. Pinned declaration defaults:
  tag_regex=None; tags=None. Resolve env values once in betterlite-config, never in router code. Implement
  the owned native service in crates/betterlite-router/src/tag_matchers.rs. Add ProbeOperation::TagMatchers in
  tools/oracle/src/router_probes/mod.rs and the corresponding B320 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/tag_based_routing.py:
  _TagLitellmParamsLike.get (L30-L30), _TagLitellmParamsLike.get (L32-L32), _TagLitellmParamsLike.get
  (L34-L34), _ModelInfoLike.get (L39-L39), _ModelInfoLike.get (L41-L41), _DeploymentLike.get (L46-L46),
  _DeploymentLike.get (L48-L48), _DeploymentLike.get (L50-L50), _MetadataLike.get (L55-L55), _MetadataLike.get
  (L57-L57), _MetadataLike.get (L59-L59), _MetadataLike.get (L61-L61), _MetadataLike.__contains__ (L62-L62),
  _MetadataLike.__setitem__ (L63-L63), _NestedLitellmParamsLike.get (L67-L69), _RequestKwargsLike.get
  (L74-L74), _RequestKwargsLike.get (L76-L76), _RequestKwargsLike.__contains__ (L77-L77), _RequestKwargsLike.__getitem__
  (L79-L79), _RequestKwargsLike.__getitem__ (L81-L81), _is_valid_deployment_tag_regex (L87-L107), is_valid_deployment_tag
  (L110-L135), _match_deployment (L138-L180), _bare_tag_value (L183-L191), _strip_routing_prefix (L194-L215),
  _split_tags (L218-L222), _exclude_deployments (L225-L231), _require_all_tags (L234-L240), _default_tagged_pool
  (L243-L247), _known_tag_values (L250-L253), _unknown_required_tag_hides_an_answer (L256-L277). Implement
  these behaviors through the typed Rust services above; synchronous facades and structural accessors
  reuse the same primitive instead of separate ports. Bound the tag_match outside-byte parser to 1048576
  bytes before decoding; on excess use its typed invalid-input outcome (classifier/observation consumers
  keep their pinned warning/fallback path).'
