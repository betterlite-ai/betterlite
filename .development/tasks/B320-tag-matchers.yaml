dod:
- text: Write tests named tag_matchers_behaviors and tag_matchers_boundaries under tag_matchers::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - tag-matchers-behaviors
  - tag-matchers-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/tag-matchers-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/tag-matchers-invalid.yaml;
    the valid seed contains tag_regex. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - tag-matchers-boundaries
- text: Add crates/betterlite-router/fuzz/corpus/tag_match/tag-matchers-valid.json and crates/betterlite-router/fuzz/corpus/tag_match/tag-matchers-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target tag_match and normal replays_the_tag_match_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - tag-matchers-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: tag-matchers-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::tag_matchers_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: tag-matchers-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::tag_matchers_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/tag_matchers.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/tag_matchers.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/tag-matchers-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/tag-matchers-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/tag-matchers-" && grep -Fq 'tag_regex' crates/betterlite-config/fuzz/corpus/config_yaml/tag-matchers-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-router/fuzz/corpus/tag_match/tag-matchers-valid.json && test -f crates/betterlite-router/fuzz/corpus/tag_match/tag-matchers-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/tag_match
      | grep -Fq "/tag-matchers-" && test -f crates/betterlite-router/fuzz/fuzz_targets/tag_match.rs && cargo
      nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_tag_match_corpus)'
