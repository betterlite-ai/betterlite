deviations:
- what: A regex exceeding 2048 pattern bytes or 100000 match steps is warned about and skipped.
  why: The pin has no execution bound; bounded-inputs requires one. Keep supported Python syntax and first-match
    semantics within the bound.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/tag_based_routing.py#L87-L107
- what: The tag_match byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/tag_based_routing.py#L87-L277
out_of_scope:
- Chain fail-open policy and metadata mutation (B321).
- 'litellm/router_strategy/tag_based_routing.py: B321 owns: _chain_allows_fail_open (L280-L288), _trusted_only_pool
  (L291-L320), _resolve_or_fail_open (L323-L349), _resolve_constraint_only_pool (L352-L377), _all_deployments_or_fallback
  (L380-L388), _chain_tag_filtering_override (L391-L410), _inherited_constraint_sets (L413-L432), _tag_known_to_group
  (L435-L450), _request_tags_after_router_consumption (L453-L474), get_deployments_for_tag (L477-L647),
  _tags_in_metadata (L650-L665), _get_tags_from_request_kwargs (L668-L695).'
pitfalls:
- A header-regex match cannot bypass a failed strict all-tags constraint.
- Caller input must not supply a new executable regex.
- Report unsupported Python regex constructs rather than approximating them silently.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
