id: B4292
title: Retire evicted clients and reuse logging clients safely
description: >-
  Build client lifecycle management for HTTP/SDK clients that the LLM client cache evicts.
  Implement deferred closing with loop-scoped cache keys to prevent event loop errors and
  reuse logging clients safely by credential set.

  Evicted clients are never closed immediately: a request holding the client just before
  eviction is still using it, and closing underneath that request raises an error. Instead,
  schedule closing once two conditions hold: a 900-second grace window has passed since eviction
  (default EVICTED_LLM_CLIENT_CLOSE_GRACE_SECONDS), and the client reports no connection in flight.

  Clients supplied by the caller are left alone; only clients litellm created are closed.
  Queued clients are bucketed by closure capability (sync anywhere, async on-loop, or a specific loop)
  and ordered by deadline, so a reap operation walks only entries that are due.
  The queue holds clients weakly, so grace windows never keep alive anything garbage collection would have reclaimed.
  Queue capacity is capped at 10000 pending closes (default EVICTED_LLM_CLIENT_CLOSE_MAX_PENDING).

  LLMClientCache wraps InMemoryCache with event-loop-aware key decoration: the running event loop ID
  is appended to cache keys to prevent "event loop closed" errors when clients are reused across event loops.
  On eviction, clients are scheduled for deferred closing and a reap is triggered.

  DynamicLoggingCache reuses logging clients (e.g., LangfuseLogger) by credential set and service name,
  avoiding memory leaks from initializing new logging clients on each request. Entries are cached
  with a default TTL matching HTTPX client TTL (3600 seconds). Evicted loggers that have a stop() method
  are called to release resource slots and end periodic tasks.

  ServiceTraceIDCache associates service trace IDs with call IDs and service names, keyed as "service_name:call_id".
