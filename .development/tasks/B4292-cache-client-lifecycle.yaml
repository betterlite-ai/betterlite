dod:
  - text: Evicted clients are scheduled for closing only if owned (marked via litellm-created flag); caller-supplied clients are never touched.
    proof: [client-ownership-tests]
  - text: >-
      A client is closed only after a 900-second grace window has passed AND the client reports no connection in flight.
      A client with a connection in flight is re-enqueued with a new deadline. Idleness is checked via httpcore pool
      busy-connection detection, aiohttp _acquired connector state, or direct lease accounting; clients that cannot report
      state are treated as idle, falling back to the grace window alone.
    proof: [client-grace-and-idle-tests]
  - text: >-
      Clients that close synchronously are closed from the cache's read path. Clients that close asynchronously are closed
      only from an event loop, captured when the client is scheduled. Buckets are organized by closure capability
      (sync anywhere, async on-loop, specific loop) and ordered by deadline for efficient reaping.
    proof: [client-loop-scoping-tests]
  - text: >-
      The pending queue never grows beyond 10000 pending closes. Cache keys are decorated with the running event loop ID
      to prevent event loop closed errors. On eviction, the client is scheduled for deferred closing and a reap is triggered.
    proof: [queue-capacity-and-llm-cache-tests]
  - text: >-
      Logging clients are cached by credential set and service name (credentials + service_name SHA256 key).
      On eviction, if the logger has a stop() method, it is called; exceptions are logged but do not block eviction.
      Default TTL matches the HTTPX client TTL (3600 seconds).
    proof: [logging-client-reuse-tests]
  - text: >-
      Service trace IDs are cached with keys formatted as "service_name:call_id". Lookups return the cached trace ID
      or None if not found or expired.
    proof: [service-trace-id-tests]
