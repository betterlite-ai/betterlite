  optional: []
  commands:
    - id: client-ownership-tests
      why: client ownership tracking and eviction filtering is incorrect
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/evicted_client.*ownership|owned_client/)'
    - id: client-grace-and-idle-tests
      why: grace period or idle connection detection is broken
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/evicted_client.*grace|idle_connection|in_flight/)'
    - id: client-loop-scoping-tests
      why: loop-scoped closing or bucket organization is broken
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/evicted_client.*loop|async_close|bucket/)'
    - id: queue-capacity-and-llm-cache-tests
      why: queue capacity enforcement or LLMClientCache event loop scoping is broken
      run: cargo nextest run --locked -p betterlite-cache -p betterlite-context --no-tests=fail -E 'test(/evicted_client.*pending|queue_capacity|llm_cache|event_loop_key/)'
    - id: logging-client-reuse-tests
      why: logging client caching by credential set or stop() invocation is broken
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/dynamic_logging_cache|logging_client/)'
    - id: service-trace-id-tests
      why: service trace ID caching is broken
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/service_trace_id|trace_id_cache/)'
oracle_cases: []
deviations:
  - what: >-
      betterlite uses Rust async/await and Arc/Weak for reference handling instead of Python's reference cycles and
      weakref module. Loop IDs are obtained via task-local context rather than asyncio.get_running_loop().
    why: "Rust has no reference cycles; Arc/Weak provides the needed ownership semantics. Task-local context is the idiomatic Rust equivalent to Python's get_running_loop()."
  - what: >-
      Connection idleness is checked via trait-based inspection of httpx transport and async runtime state rather than
      direct attribute access to untyped transport objects.
    why: "Rust requires typed inspection; we encapsulate transport type inspection in a trait method."
  - what: >-
      Logging client reuse uses credential hashing and string concatenation for keys instead of arbitrary JSON sort/SHA256.
      The service_trace_id cache uses simple string keys instead of Python string formatting.
    why: "Rust uses typed keys and serde serialization for hashing; string concatenation is simpler and deterministic for fixed format."
out_of_scope:
  - >-
    B2226 owns InMemoryCache.__init__, check_value_size, _is_key_expired, _remove_key, allow_ttl_override,
    set_cache, evict_element_if_expired, get_cache, delete_cache, and the cache_dict/ttl_dict state that
    LLMClientCache, DynamicLoggingCache (via LangfuseInMemoryCache), and ServiceTraceIDCache wrap
    as dependencies. They are reused as-is, not reimplemented. This task wraps these methods and extends
    their behavior with event loop scoping, client lifecycle management and credential-keyed logging-client reuse.
  - >-
    B390 owns async_set_cache, async_set_cache_pipeline, async_set_cache_sadd, batch_get_cache and
    increment_cache in InMemoryCache; specialty cache classes inherit or delegate to these async adapters.
  - >-
    Concrete logger stop() implementations (LangFuseLogger.stop(), NewRelicMetricsLogger.stop(), others)
    belong to their respective observability integrations. This task calls stop() on evicted loggers but
    does not implement the logger lifecycle itself.
  - >-
    Python SDK internals: the inspection of OpenAI/Azure SDK internals (aclose/close methods, _client/_transport
    attributes) is abstracted behind a typed trait interface injected at initialization.
pitfalls:
  - >-
    A weak reference to a client is used to avoid keeping it alive while grace passes. When the client is collected,
    dead refs at the front of each bucket are dropped during enqueue to amortize cleanup cost and keep pending_count accurate.
  - >-
    Grace deadlines always move forward; appending re-enqueued clients to their bucket keeps each bucket ordered by deadline
    without needing to sort. A client re-enqueued with a new deadline due to inflight connections goes to the back.
  - >-
    Loop ID bucketing: if loop_id is None, the client cannot be closed on any loop; _CLOSABLE_ON_ANY_LOOP is used only
    for async clients captured on no loop (impossible in practice but handled for safety). A specific loop ID bucket is used
    for clients captured on a particular loop.
  - >-
    LLMClientCache appends the stringified loop ID to cache keys as "{key}-{loop_id}". This must match exactly; different
    loops produce different keys. If the running loop changes, the key changes, and a miss is correct.
  - >-
    DynamicLoggingCache keys credentials and service_name together; changing either produces a new key and a new logger.
    The cache does not merge entries with the same logger; credential immutability is assumed.
  - >-
    Logging client stop() is called without arguments and exceptions are suppressed; it must not raise or the logger is
    leaked. Typifying logger stop() as a simple Fn(&mut self) avoids Option/callback overhead.
  - >-
    ServiceTraceIDCache is backed by a simple InMemoryCache with no customization. TTL and size limits inherit from the
    underlying cache; no special handling is needed.
  - >-
    Async clients queued on a loop that closes before reap is called will be dropped by weak-ref GC; the weak ref returns
    None and the entry is cleaned up. No panic or blocking occurs.
