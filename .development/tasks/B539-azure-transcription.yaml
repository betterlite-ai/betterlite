out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_transcription in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/transcription.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_transcription.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A failed RecognitionStatus can carry HTTP status 200 because the source preserves the raw status instead of inventing
  an error status.
- The top-level async transcription branch loses api_version; a shared sync/async call builder must retain that
  asymmetry.
