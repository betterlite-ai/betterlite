  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/transcription.rs
  - crates/betterlite-azure/src/transcription/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/azure/transcription.rs
  - tools/oracle/src/helpers/azure/transcription/**
  - tools/oracle/helpers/azure_transcription.py
  - tools/oracle/helpers/azure_transcription/**
  - tools/oracle/cases/helpers/providers/azure-transcription/**
  - tools/oracle/fuzz/corpus/helper_case/azure_transcription*
  - crates/betterlite-azure/fuzz/Cargo.toml
  - crates/betterlite-azure/fuzz/fuzz_targets/azure_transcription.rs
  - crates/betterlite-azure/fuzz/corpus/azure_transcription/**
  - crates/betterlite-config/Cargo.toml
  - crates/betterlite-config/fuzz/corpus/config_yaml/azure_transcription*
