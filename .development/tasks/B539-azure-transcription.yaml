id: B539
title: Azure native and OpenAI transcription
description: >-
  Add AzureTranscription mapping for cognitive/STT hosts and deployment OpenAI audio transcription. Preserve region
  inference, response-format projection and text extraction from the native reply; share multipart upload descriptors
  and error handling with OpenAI transcription. Native speech requires api_base/api_key or AZURE_SPEECH_API_BASE/AZURE_SPEECH_API_KEY,
  has no endpoint/key default, and uses language en-US when omitted.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/audio_transcription/transformation.py:
  AzureSpeechAudioTranscriptionConfig.get_supported_openai_params L44-L45; AzureSpeechAudioTranscriptionConfig.map_openai_params
  L47-L58; AzureSpeechAudioTranscriptionConfig.validate_environment L60-L81; AzureSpeechAudioTranscriptionConfig.get_complete_url
  L83-L109; AzureSpeechAudioTranscriptionConfig.transform_audio_transcription_request L111-L123; AzureSpeechAudioTranscriptionConfig.transform_audio_transcription_response
  L125-L141; AzureSpeechAudioTranscriptionConfig.get_error_class L143-L148; AzureSpeechAudioTranscriptionConfig._resolve_stt_base_url
  L150-L171; AzureSpeechAudioTranscriptionConfig._is_cognitive_services_endpoint L173-L174; AzureSpeechAudioTranscriptionConfig._is_stt_endpoint
  L176-L177; AzureSpeechAudioTranscriptionConfig._is_azure_openai_endpoint L179-L180; AzureSpeechAudioTranscriptionConfig._extract_region_from_hostname
  L182-L185; AzureSpeechAudioTranscriptionConfig._build_stt_base_url L187-L190; AzureSpeechAudioTranscriptionConfig._get_azure_response_format
  L192-L195; AzureSpeechAudioTranscriptionConfig._extract_text L197-L207. litellm/llms/azure/audio_transcriptions.py:
  AzureAudioTranscription.audio_transcriptions L24-L111; AzureAudioTranscription.async_audio_transcriptions L113-L205.


  Reuse extract_duration_from_srt_or_vtt from B515 (litellm/utils.py); its implementation remains with that prerequisite.


  Named case contracts: cognitive_stt_base: Exact api.cognitive.microsoft.com or its dot suffix converts to https://<region>.stt.speech.microsoft.com,
  including the bare-domain case with no region. An STT host retains parsed scheme and hostname only, dropping port/path/query;
  custom bases retain their trimmed original string. regional_stt_host: Append /speech/recognition/conversation/cognitiveservices/v1
  and URL-encoded language/format. language defaults en-US only when absent; verbose_json maps detailed and every
  other format maps simple. Map only language/response_format from non_default_params into options, ignoring drop_params.
  native_json_text_extraction: RecognitionStatus missing/None or Success is accepted; every other value raises AzureSpeechAudioTranscriptionException
  with raw response status/headers and Azure AI Speech transcription failed with RecognitionStatus=<value>. Prefer
  string DisplayText even empty; otherwise first NBest dict Display or Lexical or empty. Preserve the whole JSON
  in _hidden_params. verbose_transcript: Sync calls audio.transcriptions.create and projects BaseModel.model_dump
  or text. Async uses with_raw_response, preserves headers and for a string adds _audio_transcription_duration through
  B515 SRT/VTT extraction. Both supply hidden model/custom_llm_provider; async rejects a wrong projected type with
  AzureOpenAIError 500 response is not an instance of TranscriptionResponse and otherwise rethrows original failures.
  file_language_prompt: Native request uses B1001 process_audio_file bytes and content_type with files=None, not
  multipart. OpenAI-compatible request builds {model,file,**options}, allowing option overrides, and delegates client
  construction to B531; separate azure_ad_token/max_retries arguments are not forwarded there. native_transcription_headers:
  Key resolves explicit api_key or AZURE_SPEECH_API_KEY; falsy result raises AzureSpeechAudioTranscriptionException
  401 api_key is required for Azure AI Speech transcription. Copy headers, overwrite Ocp-Apim-Subscription-Key and
  Accept=application/json, preserve exact Content-Type if present otherwise audio/wav. native_transcription_url_errors:
  Base resolves explicit api_base or AZURE_SPEECH_API_BASE; None raises AzureSpeechAudioTranscriptionException 400
  with required-base diagnostic and Cognitive Services/STT domain examples. A hostname ending .openai.azure.com
  raises 400 Azure AI Speech transcription requires a Cognitive Services or STT Speech endpoint, not an Azure OpenAI
  endpoint. azure_transcription_async_version: The public atranscription=True branch does not pass api_version to
  its async helper, so it defaults None there; sync forwards it. Exact SDK checks reject standard v1 OpenAI clients
  with AzureOpenAIError 500 azure_client is not an instance of AzureOpenAI or async_azure_client is not an instance
  of AsyncAzureOpenAI.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B2202. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-azure/src/transcription.rs with adjacent tests under transcription/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function transcription_cases in betterlite-azure with these exact named cases (one per oracle file):
  openai_transcription_route, cognitive_stt_base, regional_stt_host, native_json_text_extraction, verbose_transcript,
  file_language_prompt, native_transcription_headers, native_transcription_url_errors, azure_transcription_async_version.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_transcription* using HelperCase: kind:
  helper and the externally tagged azure_transcription variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_transcription that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_native_transcription consumes Azure native transcription JSON response bytes in
  crates/betterlite-azure/src/transcription.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_transcription.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_transcription.
  The adjacent test replays_the_azure_transcription_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/transcription.rs
  and its loader wiring: AZURE_SPEECH_API_BASE, AZURE_SPEECH_API_KEY. Module-level settings enter litellm_settings;
  deployment settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified
  above and in the linked branches; existing key owners remain unchanged. Write config rstest azure_transcription_config_cases
  with named cases loads_azure_speech_api_base, loads_azure_speech_api_key, plus rejects_unrelated_key. Each loads
  case calls the real config loader with that key and asserts the resolved value, default, precedence and secret
  redaction where applicable. Seed B002 config_yaml with new azure_transcription* files for every key; reuse its
  parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_transcription_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_transcription_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 306 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 330 production lines, 235 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 40 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 800 planned, 800 maximum changed lines.
