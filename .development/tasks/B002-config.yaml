id: B002
title: Load LiteLLM config.yaml into typed config
description: >-
  Add crates/betterlite-config. It reads a LiteLLM config.yaml and returns typed structs the rest of betterlite uses, so users keep the config file they already have.
  Cover what the next tasks need: model_list (model_name; litellm_params with model, api_base, api_key, api_version, timeout, stream_timeout, max_retries, rpm, tpm and weight; model_info.id), general_settings.master_key, router_settings (routing_strategy, num_retries, timeout, allowed_fails, cooldown_time, fallbacks), litellm_settings (num_retries, request_timeout, drop_params) and environment_variables.
  A value written as os.environ/NAME resolves from the environment at load time, the way LiteLLM's get_secret does. The environment reaches the loader through its constructor as a lookup the caller supplies, so tests pass a map and only the binary passes the real process environment.
  Any key betterlite does not support yet makes loading fail with one error that lists every such key by its path, for example router_settings.routing_strategy_args. Nothing is dropped silently, and several deployments under one model_name stay several deployments in file order.
  Parse YAML with serde-saphyr (serde_yaml is deprecated) and collect ignored keys with serde_ignored instead of a hand-written visitor.
  Copy LiteLLM's 23 example configs from the pinned commit into crates/betterlite-config/tests/fixtures/litellm/ byte for byte and snapshot what loading each one gives, with insta: the typed config summary, or the error with its full list of unsupported keys.
  Add a cargo-fuzz target that feeds arbitrary bytes to the loader, seed its corpus with the 23 fixtures, and replay every corpus file in a normal test named replays_the_config_yaml_corpus (rule fuzz-parsers).
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-config/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L3241-L3272
    why: The six top-level sections of a LiteLLM config.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L322-L544
    why: Every litellm_params key LiteLLM knows; betterlite types the ones listed in the description.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L147-L172
    why: The router_settings keys.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L189
    why: How LiteLLM resolves os.environ/NAME.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5511
    why: LiteLLM also supports an include key that pulls in other files; betterlite reports it as unsupported for now.
  - url: https://github.com/BerriAI/litellm/tree/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/example_config_yaml
    why: The 23 example configs to copy as fixtures.
  - url: https://docs.rs/serde_ignored/0.1.14/serde_ignored/
    why: Collects every ignored key path in one pass.
  - url: https://docs.rs/secrecy/0.10.3/secrecy/
    why: api_key and master_key never show up in Debug output or logs.
dod:
  - text: The fixtures are LiteLLM's 23 example configs, byte for byte.
    proof: [fixtures-pinned]
  - text: Every fixture has an insta snapshot of its load result, and none of them panics.
    proof: [config-tests]
  - text: An unsupported key fails loading with one error that lists every unsupported key path.
    proof: [config-tests]
  - text: Several deployments under one model_name load as several deployments, in file order.
    proof: [config-tests]
  - text: os.environ/NAME resolves through the supplied lookup, and a missing variable fails with the variable name and the key path.
    proof: [config-tests]
  - text: Debug output of a loaded config never contains an api_key or master_key value.
    proof: [config-tests]
  - text: The loader has a cargo-fuzz target at crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs, and replays_the_config_yaml_corpus loads every file in its corpus, at least the 23 fixtures, without a panic.
    proof: [config-fuzz-corpus]
  - text: Every mutant in the loader is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: config-fuzz-corpus
      why: the config fuzz target or its seeded corpus is missing, or replaying the corpus fails
      run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test "$(ls crates/betterlite-config/fuzz/corpus/config_yaml | wc -l)" -ge 23 && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: config-tests
      why: the config crate's tests fail, do not exist, or have snapshots that were not accepted
      run: INSTA_UPDATE=no cargo nextest run --locked -p betterlite-config --no-tests=fail
    - id: fixtures-pinned
      why: a fixture is missing or differs from LiteLLM's file at the pinned commit
      run: |
        cd crates/betterlite-config/tests/fixtures/litellm && test "$(ls | wc -l)" -eq 23 && sha256sum --check --quiet <<'SUMS'
