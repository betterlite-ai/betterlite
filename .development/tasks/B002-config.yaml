oracle_cases: []
deviations:
  - what: Keys betterlite does not support yet stop the process at startup with a list of them.
    why: LiteLLM accepts and quietly ignores many keys, so a typo or an unsupported feature runs with different behavior than the user wrote down. A loud failure is cheaper than a silent one.
out_of_scope:
  - Behavior behind the keys (routing, retries, fallbacks). This task only loads and types them.
  - The include key, secret managers other than environment variables, and config stored in a database.
pitfalls:
  - "std::env::var is disallowed outside the config path. The one place that reads the real process environment gets one #[expect(clippy::disallowed_methods, reason = ...)]."
  - std::env::set_var is unsafe in edition 2024 and unsafe code is forbidden. That is one more reason the environment comes in through the constructor.
  - LiteLLM accepts numbers written as strings in some fields. Follow what the fixtures need and snapshot the result instead of guessing.
  - Run cargo insta review or cargo insta accept locally to write the snapshots, then commit them. The gate runs with INSTA_UPDATE=no.
  - cargo fuzz init writes a fuzz/.gitignore that ignores corpus/. Drop that line, since the corpus is committed and replayed.
  - The fuzz crate is its own workspace and runs on nightly. The replay test runs on the pinned stable toolchain and calls the loader directly, so it needs no fuzz dependency.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
