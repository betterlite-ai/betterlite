dod:
  - text: >-
      run_login takes --config-claude and --pkce with the injected context, secret vault and HTTP transport; when
      config_claude is set it resolves the settings path and calls refuse_while_owned with settings_file_owners
      first, turning a ClaudeSettingsError into betterlite's own error naming "Cannot configure Claude Code, so
      not logging in" before any network call; it then dispatches to _pkce_login or _sso_login and turns a caught
      cancellation into a plain message rather than an error exit.
    proof: [login-dispatch]
  - text: >-
      _pkce_login calls B4574's run_pkce_login, returns with the printed reason on a PkceFailure answer with
      nothing saved, otherwise builds the record with B4574's pkce_token_record, saves it through B4574's
      stored-token replacement, and calls _finish_login with the resulting save outcome.
    proof: [pkce-dispatch]
  - text: >-
      _sso_login starts the SSO flow through B4576, opens the verification URL, polls for completion, builds a
      B4591 CliTokenRecord from the result with LiteLLM's placeholder fields on success, saves and finishes the
      same way as the PKCE path, and prints a timeout message with no error exit when polling never completes.
    proof: [sso-token-save]
  - text: >-
      _finish_login prints the success message and token prefix, B4574's storage notice, and B4575's Claude Code
      configuration step when requested; a B4592 CredentialNotSaved or CredentialNotRecorded outcome stops there,
      and every other outcome continues to the usable-CLI line and calls commands_listing::show_commands.
    proof: [finish-login]
  - text: >-
      resolve_api_key returns the context's --api-key when present, otherwise B4574's stored key lookup; with
      neither available it runs run_login once and re-reads the key when the process is interactive, and returns
      betterlite's own named error for a non-interactive miss or a login that still produces no key.
    proof: [resolve-api-key]
  - text: >-
      agent_commands builds one clap command per entry in B4564's known-agent table, named and hidden per that
      table, each taking --skip-verify and forwarded trailing arguments, with a short help string matching the
      per-agent description commands_listing reuses.
    proof: [agent-commands-factory]
  - text: >-
      Each agent command's run function resolves the key, prints the routing notice naming the display name and
