    proof: [agent-dispatch-launch]
  - text: >-
      show_commands lists the static commands with LiteLLM's descriptions, appends every agent command's name and
      short help from agent_commands, appends version, help and quit, filters the combined list through B4560's
      hidden_command_names, and prints one line per visible command with LiteLLM's column padding.
    proof: [command-listing]
checks:
  optional: []
  commands:
    - id: login-dispatch
      why: run_login does not run the config-claude guard before either flow, or does not dispatch to the right flow
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^login::.*tests::login_dispatch_/)'
    - id: pkce-dispatch
      why: _pkce_login does not check PkceFailure, does not save through the stored-token replacement, or skips _finish_login
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^login::.*tests::pkce_login_/)'
    - id: sso-token-save
      why: _sso_login does not build the token record with LiteLLM's placeholder fields, or does not save and finish the same way as PKCE
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^login::.*tests::sso_login_/)'
    - id: finish-login
      why: _finish_login does not print the storage notice, misses the CredentialNotSaved/CredentialNotRecorded stop, or skips show_commands
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^login::.*tests::finish_login_/)'
    - id: resolve-api-key
      why: resolve_api_key does not return the explicit key, the stored key, or the interactive login fallback in order
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^agent_dispatch::.*tests::resolve_api_key_/)'
    - id: agent-commands-factory
      why: agent_commands does not build one command per known agent, or drops the hidden flag or short help text
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^agent_dispatch::.*tests::agent_commands_/)'
    - id: agent-dispatch-launch
      why: the per-agent launch helper does not resolve the key, print the routing notice or call run_agent in order
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^agent_dispatch::.*tests::launch_/)'
    - id: command-listing
      why: show_commands does not build the full list, filter by hidden_command_names, or print LiteLLM's padding
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^commands_listing::.*tests::show_commands_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - styled_prompt (interface.py:12-73), setup_shell (interface.py:109-119), handle_special_commands (interface.py:122-139), execute_command (interface.py:142-180) and interactive_shell (interface.py:183-211), the interactive shell loop and its banner, prompt and special-command handling. Owned by B134.
  - _configure_claude_code (auth.py:786-810) and the settings.json write it makes, the Claude Code configuration step this task calls but does not implement. Owned by B4575 (session), which calls into B4563's configure_claude_settings.
  - claude_settings_path, refuse_while_owned, settings_file_owners and ClaudeSettingsError. This task calls them for the preflight guard but does not define them. Owned by B4562.
  - run_pkce_login, pkce_token_record and the stored-token replacement (auth.py:831-842), the credential orchestration this task calls. Owned by B4574 (credentials).
  - The PKCE protocol itself (discovery, loopback callback, token exchange, revoke_credential) and the PkceFailure/RevocationUnavailable/Http types. Owned by B4573.
  - The SSO flow and polling implementation (auth.py:575-784, start/poll/team selection). Owned by B4576.
  - CliTokenRecord, its field defaults and freshness check. Owned by B4591. The save/clear outcome types (SecretSave, CredentialNotSaved, CredentialNotRecorded) are owned by B4592.
  - Agent environment construction, key verification, process handoff and model sync, owned by B4564 and B4568. This task calls resolve_api_key and run_agent but does not build the environment or the launch pipeline.
  - The CLI context type and hidden_command_names, owned by B4560.
  - Browser opening, terminal output and the clock are injected dependencies.
pitfalls:
  - The config-claude preflight guard must stop before either login flow starts, so a refusal (another `lite up` or `lite autoroute start` already holding the backup) never follows a completed SSO or PKCE exchange.
  - "_finish_login must branch on the save outcome's specific variant. CredentialNotSaved and CredentialNotRecorded both stop before the usable-CLI line, while every keychain fallback variant still counts as a successful save and continues."
  - _sso_login's inline token record uses LiteLLM's placeholder fields ("unknown", "cli", an empty jwt_token); a record read back later treats an empty string the same as an absent field, matching B4591's own defaults rather than a distinct unset value.
  - agent_commands' per-agent hidden flag only changes clap's own help listing; commands_listing's filter is B4560's separate, operator-configured hidden_command_names, and an agent absent from one list can still appear in the other.
  - resolve_api_key's interactive fallback re-reads the stored key after running run_login rather than trusting whatever run_login prints, so a login that saves for a different base_url still leaves resolve_api_key with its own named error, not a crash.
  - The per-agent launch helper prints the routing notice before run_agent's own key verification, so the message can appear even when the key is rejected a moment later.
  - show_commands' order (static commands, then every agent command, then version/help/quit) and column padding must match LiteLLM exactly, since the interactive shell's help output is this list verbatim.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
