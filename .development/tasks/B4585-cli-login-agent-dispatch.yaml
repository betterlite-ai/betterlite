out_of_scope:
  - styled_prompt (interface.py:12-73); returns user input from a styled terminal box. Owned by B134 (interactive shell).
  - setup_shell (interface.py:109-119); calls show_banner and show_commands to initialize interactive session. Owned by B134.
  - handle_special_commands (interface.py:122-139); dispatches exit/quit/help/clear commands in interactive shell. Owned by B134.
  - execute_command (interface.py:142-180); parses and invokes registered CLI commands within the interactive session. Owned by B134.
  - interactive_shell (interface.py:183-211); main event loop that calls setup_shell, styled_prompt, handle_special_commands, execute_command. Owned by B134.
  - _configure_claude_code (auth.py:786-810); configures Claude Code settings with base_url and api_key. Owned by B4575 (session/backup).
  - _replace_stored_token (auth.py:831-842); loads previous token, saves new one, revokes old refresh token. Owned by B4574 (credential lifecycle).
  - PKCE protocol details (registration, discovery, token exchange, revocation); owned by B4573.
  - SSO team selection and polling orchestration (_start_cli_sso_flow, _poll_for_authentication); owned by B4576.
  - Credential storage and freshness checking (get_stored_api_key, load_token, save_token, fresh_api_key); owned by B4574.
  - Browser opening, terminal output, and logging infrastructure are injected dependencies in the test adapter.
pitfalls:
  - "resolve_api_key returns the explicit --api-key flag value immediately without any freshness check or login attempt; stored credentials are the only ones checked for renewal."
  - "login command must handle LITELLM_CLI_SOURCE_IDENTIFIER and preserve SSO URL construction (source, key, user_code parameters) exactly as in source."
  - "_finish_login must print storage_notice before displaying CLI usage, since the notice may report keyring failures that affect credential persistence."
  - "show_commands must call hidden_command_names() to filter the static and dynamic command lists, since operators may hide commands via configuration."
  - "agent_commands() returns a tuple; the Click command tree iterates and registers each command, so the factory must not call any Click decorators or registration itself."
  - "Each agent command must check _is_interactive() before invoking login, so resolve_api_key can distinguish between --api-key requirements and login fallback."
  - "Login cycle: _finish_login calls show_commands, which calls agent_commands(), which _make_agent_command creates commands that call resolve_api_key, which can call login. This is internal; the root CLI never directly calls show_commands."
review_level: security
