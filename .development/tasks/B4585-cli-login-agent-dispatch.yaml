id: B4585
title: Login and agent command dispatch with shared command listings
description: >-
  Build the login command dispatcher, PKCE and SSO entry points, and the agent command factory
  with environment variable routing. Implement login orchestration (discovery, browser, SSO polling, token storage);
  agent command registration, dynamic help generation, and credential/key resolution for unattended launches.
  Build the shared command listing shown after login and in interactive shell help. The login command accepts
  --pkce (PKCE flow with refresh token) or SSO default, dispatches to _start_cli_sso_flow/_poll_for_authentication
  or _pkce_login (run_pkce_login), handles PkceFailure/RevocationUnavailable, saves token via _replace_stored_token,
  and displays agent commands on success via show_commands. The agent_commands() factory builds one Click command per
  known agent (claude, codex, etc.), each invoking resolve_api_key to check for --api-key or stored credential (with
  login fallback for interactive use), then run_agent with the proxy key in environment. show_commands displays the full
  available command list filtered by hidden_command_names, recomputed after login so agent commands appear. These
  dispatch/listing boundaries stay together because login success displays agents, while agent commands invoke login
  before launching; splitting either breaks the cycle. Coordinate with B4573 (PKCE protocol), B4574 (credential storage/freshness/renewal),
  B4575 (session backup), B4576 (SSO polling/team selection).
