id: B4585
title: Login and agent command dispatch with shared command listings
description: >-
  Build the login command, the per-agent command dispatcher and the shared command listing of
  betterlite-cli, ported from LiteLLM's litellm/proxy/client/cli/commands/auth.py (login,
  _pkce_login, _finish_login), commands/agents.py (resolve_api_key, _launch,
  _make_agent_command, agent_commands) and interface.py (show_commands). login.rs lives in
  crates/betterlite-cli/src/login.rs and login/**, agent_dispatch.rs in
  crates/betterlite-cli/src/agent_dispatch.rs and agent_dispatch/**, and commands_listing.rs in
  crates/betterlite-cli/src/commands_listing.rs and commands_listing/**. Each module exposes a
  clap argument type and a run function the CLI root mounts; none of them touches main.rs, which
  B134 owns.

  run_login takes the --config-claude and --pkce flags, B4560's context, an injected secret
  vault and HTTP transport, and a clock. When config_claude is set it resolves the settings path
  with B4562's claude_settings_path and calls refuse_while_owned with settings_file_owners
  before either login flow starts, turning a ClaudeSettingsError into betterlite's own error
  carrying "Cannot configure Claude Code, so not logging in" and the cause (auth.py L876-890).
  It then dispatches to _pkce_login when --pkce is set, otherwise to _sso_login, and turns a
  caught cancellation into a plain message rather than an error exit (auth.py L955-964).

  _pkce_login calls B4574's run_pkce_login with the injected HTTP transport (auth.py L845-852).
  A PkceFailure answer, B4573's type, prints its reason and returns with nothing saved.
  Otherwise it builds the token record with B4574's pkce_token_record, saves it through B4574's
  stored-token replacement (which itself calls B4573's revocation path for the previous
  credential), and calls _finish_login with the resulting save outcome.

  _sso_login starts the proxy's CLI SSO flow through B4576, opens the verification URL with the
  injected browser opener, shows the verification code and session id, and polls for completion
  through B4576. On success it builds a B4591 CliTokenRecord directly from the result: the
  context base_url with trailing slashes stripped, the returned api_key and user_id, "unknown"
  for user_email, "cli" for user_role, "Authorization" for auth_header_name, an empty jwt_token
  and the current timestamp, matching LiteLLM's placeholders (auth.py L924-946). It saves the
  record the same way as the PKCE path and calls _finish_login. Polling that never completes
  prints a timeout message and returns without an error exit (auth.py L947-953).

  _finish_login prints the success message and a twenty-character token prefix, then B4574's
  storage notice for the save outcome, then B4575's Claude Code configuration step when
  config_claude is set (auth.py L811-828). When the save outcome is B4592's CredentialNotSaved
  or CredentialNotRecorded it stops there; every other outcome, including every keychain-
  unavailable fallback, continues to the "you can now use the CLI" line and calls
  commands_listing::show_commands.

  resolve_api_key returns the context's --api-key when present, otherwise B4574's stored key
  lookup for the context base_url (agents.py L828-846). With neither available and the process
  interactive, it prints a notice, runs run_login once, and re-reads the stored key; without a
  terminal it is betterlite's own error naming LITELLM_PROXY_API_KEY or `lite login`, and a
  login that still produces no key is a separate named error.

  agent_commands builds one clap command per agent in B4564's known-agent table (agents.py
  L895-897), hidden per that table's own hidden set (a clap-level hide, separate from B4560's
  hidden_command_names), each taking --skip-verify and forwarded trailing arguments (agents.py
  L849-870). Each command's run function resolves the key, prints the routing notice naming the
  agent's display name and the base URL, calls B4568's run_agent with the resolved key and
  skip_verify, and turns an AgentRunError from B4564 or B4568 into betterlite's own CLI-facing
  error (agents.py L873-892).

  commands_listing::show_commands lists login, logout, whoami, models, credentials, chat, http,
  keys, teams and users with LiteLLM's own descriptions, appends every agent command's name and
  short help from agent_commands, appends version, help and quit, filters the combined list
  through B4560's hidden_command_names, and prints one line per visible command with LiteLLM's
  column padding (interface.py L76-106).
scope:
  paths:
    - crates/betterlite-cli/src/login.rs
    - crates/betterlite-cli/src/login/**
    - crates/betterlite-cli/src/agent_dispatch.rs
    - crates/betterlite-cli/src/agent_dispatch/**
    - crates/betterlite-cli/src/commands_listing.rs
    - crates/betterlite-cli/src/commands_listing/**
  lint_tables: false
