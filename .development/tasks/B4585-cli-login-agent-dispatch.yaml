dod:
  - text: login command accepts --pkce and --config-claude flags and dispatches to _pkce_login (PKCE flow) or SSO default (browser/polling flow).
    proof: [login-dispatch]
  - text: _pkce_login calls run_pkce_login, checks PkceFailure outcome, calls _replace_stored_token to persist token, calls _finish_login.
    proof: [pkce-dispatch]
  - text: _finish_login displays "Login successful!", prints token prefix, calls storage_notice, optionally calls _configure_claude_code, displays CLI usage and show_commands.
    proof: [finish-login]
  - text: resolve_api_key returns --api-key if present, loads stored token with get_stored_api_key when no key given, invokes login interactively for unattended fallback.
    proof: [api-key-resolution]
  - text: agent_commands() returns tuple of Click commands, one per known agent binary (claude, codex, etc.) with dynamic display name and hidden flag.
    proof: [agent-commands-factory]
  - text: Each agent command calls resolve_api_key, displays routing notice, calls run_agent with proxy base_url and api_key, passes _restore_controlling_terminal when interactive.
    proof: [agent-launch]
  - text: show_commands builds list of static commands (login, logout, whoami, etc.), adds agent commands from agent_commands(), filters by hidden_command_names(), prints each with description.
    proof: [command-listing]
  - text: Login success branch for SSO (non-PKCE) saves token via _replace_stored_token with SSO-derived api_key, user_id, timestamp; matches CliTokenData shape.
    proof: [sso-token-save]
