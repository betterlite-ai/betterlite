id: B904
title: Response id traversal
description: >-
  Compose response-id-codecs over typed response outputs, annotations, code-interpreter containers and inbound reasoning
  items. Export rewrite, restore, collect-container-IDs and strip-encrypted-reasoning operations; preserve readable
  reasoning text and do not double-encode already managed response IDs.


  Implement crates/betterlite-core/src/api/response_id_traversal.rs. Use ResponseIdTraversalInput and ResponseIdTraversalResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions nested_container_annotations, encrypted_item_without_id, restore_wrapped_reasoning,
  already_encoded_response, strip_keeps_readable_text under api::response_id_traversal::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponseIdTraversal in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_id_traversal: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/utils.py: ResponsesAPIRequestUtils._update_responses_api_response_id_with_model_id
  (L312-L317); litellm/responses/utils.py: ResponsesAPIRequestUtils._update_responses_api_response_id_with_model_id
  (L321-L326); litellm/responses/utils.py: ResponsesAPIRequestUtils._update_responses_api_response_id_with_model_id
  (L331-L382); litellm/responses/utils.py: ResponsesAPIRequestUtils._update_encrypted_content_item_ids_in_response
  (L467-L523); litellm/responses/utils.py: ResponsesAPIRequestUtils._restore_encrypted_content_item_ids_in_input
  (L526-L556); litellm/responses/utils.py: ResponsesAPIRequestUtils.strip_encrypted_reasoning_from_input (L559-L578);
  litellm/responses/utils.py: ResponsesAPIRequestUtils._without_encrypted_reasoning (L581-L595); litellm/responses/utils.py:
  ResponsesAPIRequestUtils._has_readable_text (L598-L608); litellm/responses/utils.py: ResponsesAPIRequestUtils._encode_container_ids_in_annotations
  (L800-L813); litellm/responses/utils.py: ResponsesAPIRequestUtils._encode_container_ids_in_message_content (L816-L837);
  litellm/responses/utils.py: ResponsesAPIRequestUtils._encode_container_id_on_output_item (L840-L914); litellm/responses/utils.py:
  ResponsesAPIRequestUtils._collect_container_ids_from_annotations (L917-L924); litellm/responses/utils.py: ResponsesAPIRequestUtils._collect_container_ids_from_message_content
  (L927-L944); litellm/responses/utils.py: ResponsesAPIRequestUtils._collect_container_ids_from_output_item (L947-L983);
  litellm/responses/utils.py: ResponsesAPIRequestUtils.collect_container_ids_from_responses_response (L986-L1000);
  litellm/responses/utils.py: ResponsesAPIRequestUtils._update_container_ids_in_response (L1003-L1033). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 344 owned nonblank/non-comment/non-docstring Python lines (383 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 364 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 614 total within the 620-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B903 (Response
  id codecs), B1087 (Api boundaries), B905 (Responses parameters). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
