checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_traversal::/)
      - test(/::replays_corpus$/)'
  - id: case-nested-container-annotations
    why: the nested-container-annotations behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_traversal::tests::nested_container_annotations($|::)/)'
  - id: case-encrypted-item-without-id
    why: the encrypted-item-without-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_traversal::tests::encrypted_item_without_id($|::)/)'
  - id: case-restore-wrapped-reasoning
    why: the restore-wrapped-reasoning behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_traversal::tests::restore_wrapped_reasoning($|::)/)'
  - id: case-already-encoded-response
    why: the already-encoded-response behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_traversal::tests::already_encoded_response($|::)/)'
  - id: case-strip-keeps-readable-text
    why: the strip-keeps-readable-text behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_traversal::tests::strip_keeps_readable_text($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/response_id_traversal.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/response_id_traversal-*)"
      && grep -qE "^[[:space:]]+response_id_traversal:" tools/oracle/fuzz/corpus/helper_case/response_id_traversal-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/response-id-traversal)"
