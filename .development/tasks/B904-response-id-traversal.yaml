id: B904
title: Response id traversal
description: >-
  Traverse parsed Responses output in betterlite-core::api::response_id_traversal, using
  B903's codecs to advertise routing metadata and restore upstream IDs. Own every complete
  method in the three ranges below, including the nested _maybe_encode function. The first
  two overload declarations are type information, not separate implementations. Metadata is
  litellm_metadata.model_info.id, absent/null model_info becoming {}; encrypted-content
  rewriting runs only when encrypted_content_affinity_enabled is truthy.

  The response rewrite mutates the supplied response, then visits encrypted content and
  containers in that order. Missing id or an already encoded response id returns immediately,
  before either traversal. Preserve dictionary and typed-object behavior. Input restoration
  visits dictionary list items only. Reasoning stripping must mutate the existing list so
  fallback snapshots sharing it observe the removals. Container collection returns unique
  IDs with no promised ordering; sort only the oracle projection, not the production result.
  Register response_id_traversal in B171 and use readonly-object fixtures to expose swallowed
  assignment failures. No external-byte parser is introduced by these record transformations.

  Count 383 nonblank, non-comment Python lines, including overloads/docstrings. Budget 350
  implementation, 190 tests, 115 fixtures, 85 adapters and 30 wiring, totaling 770.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/response_id_traversal.rs
  - crates/betterlite-core/src/api/response_id_traversal/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/response_id_traversal.rs
  - tools/oracle/src/helpers/core_ops/response_id_traversal/**
  - tools/oracle/helpers/response_id_traversal.py
  - tools/oracle/helpers/response_id_traversal/**
  - tools/oracle/fuzz/corpus/helper_case/response_id_traversal-*
  - tools/oracle/cases/helpers/response-id-traversal/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L311-L382
  why: Response ID rewrite, early exits and ordered affinity/container processing.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L466-L608
  why: Complete encrypted-output, input-restoration and readable-reasoning stripping operations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L799-L1033
  why: Recursive container rewrite and collection across tool calls and message annotations.
dod:
- text: >-
    response_rewrite supplies id=resp_a,provider=openai,model_info.id=dep_a and expects
    B903's response envelope carrying openai,dep_a,resp_a. Absent/null metadata encodes
    missing model as "None". Missing id and an already managed id leave even raw nested
    container/encrypted-content fields untouched. Empty id is encoded, not treated as absent.
  proof: [traversal-tests, oracle, traversal-adapter]
- text: >-
    encrypted_output supplies output=[{id:rs_a,encrypted_content:cipher},{encrypted_content:cipher}]
    with model=dep_a and affinity enabled. Both contents become litellm_enc wrappers; only
    the first gains an encitem_ id. Empty model, non-list output, empty/non-string encrypted
    content and disabled affinity leave those items unchanged. A readonly object's AttributeError
    on either assignment is swallowed independently, with no diagnostic or request failure.
  proof: [traversal-tests, oracle, traversal-adapter]
- text: >-
    input_restore turns the two wrapped items back into id=rs_a,encrypted_content=cipher
    and encrypted_content=cipher respectively. Plain strings, non-list inputs, non-dict list
    items, non-string fields and malformed wrappers survive unchanged. Restoration unwraps
    one layer; a twice-wrapped content retains its inner wrapper.
  proof: [traversal-tests, oracle, traversal-adapter]
- text: >-
    reasoning_strip removes {type:reasoning,id:r,encrypted_content:cipher,summary:[]} entirely.
    With summary=" text " or summary=[{text:" "}], it retains the item but removes id and
    encrypted_content; summary=" " alone is not readable. Readable content works likewise.
    Non-reasoning items and falsy encrypted_content remain. A supplied predicate selecting
    only id=r leaves id=s encrypted. The original list identity and surviving order remain.
  proof: [traversal-tests, oracle, traversal-adapter]
- text: >-
    container_walk supplies top-level container_id=c1, nested code_interpreter_call.container_id=c2,
    and message.content[].annotations[].container_id=c3; all receive cntr_ envelopes carrying
    openai,dep_a and their original IDs. Non-message content annotations are not visited.
    Managed IDs with a non-null decoded provider are unchanged; an envelope whose provider
    is null is wrapped again. String "" is encoded, while null/numeric IDs are ignored.
    Readonly object assignment failure logs debug "Could not set container_id on streaming
    output item" and continues through nested objects and message content.
  proof: [traversal-tests, oracle, traversal-adapter]
- text: >-
    container_collection reads the same paths from dicts and objects, deduplicates c1,c1,c2
    to the set {c1,c2}, ignores empty/non-string IDs, and returns [] for null or absent output.
    The encoder and collector ignore non-list annotation/content containers; collection
    neither decodes managed IDs nor mutates any item.
  proof: [traversal-tests, oracle, traversal-adapter]
checks:
  optional: []
  commands:
  - id: traversal-tests
    why: nested rewrites, mutation order or failure fallbacks differ
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_id_traversal::/)'
  - id: traversal-adapter
    why: the traversal adapter lacks independent object/dict cases or fails typing
    run: test -f tools/oracle/helpers/response_id_traversal.py && grep -qE '^[[:space:]]+response_id_traversal:' tools/oracle/fuzz/corpus/helper_case/response_id_traversal-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/response-id-traversal/response-rewrite.yaml
- tools/oracle/cases/helpers/response-id-traversal/encrypted-output.yaml
- tools/oracle/cases/helpers/response-id-traversal/input-restore.yaml
- tools/oracle/cases/helpers/response-id-traversal/reasoning-strip.yaml
- tools/oracle/cases/helpers/response-id-traversal/container-walk.yaml
- tools/oracle/cases/helpers/response-id-traversal/container-collection.yaml
deviations: []
out_of_scope:
- B903 owns codec functions in responses/utils.py; its decode_container_id_to_original facade has no caller at the pin.
- B905 owns prompt/parameter helpers and _is_object_dict/_is_object_sequence; B906 owns token-detail and usage helpers in the same file.
- B929 authorizes response IDs and B930 chooses deployment affinity; these traversal methods perform neither check.
pitfalls:
- 'The oracle helper for this task is pre-registered as response_id_traversal in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/response_id_traversal.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/response_id_traversal.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Rebuilding a new reasoning list would leave the router's fallback snapshot holding the original encrypted items.
- An already encoded response ID skips container rewriting too; checking each nested field first changes that early return.
- List text blocks use truthiness, so a whitespace-only block counts as readable while a whitespace-only summary string does not.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
