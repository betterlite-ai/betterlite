  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/custom_logger_registry.py#L65-L146
    why: CALLBACK_CLASS_STR_TO_CLASS_TYPE and the enterprise names it gains only when litellm_enterprise imports.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/routing_groups.py#L20
