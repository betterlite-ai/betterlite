  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/guardrails.py#L92-L154
    why: SupportedGuardrailIntegrations values. GuardrailEventHooks is at L1305-L1315 of the same file.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/caching.py#L9-L20
    why: LiteLLMCacheType values. KeyManagementSystem is litellm/types/secret_managers/main.py L7-L18.
dod:
  - text: >-
      A key is credential-like when a part of the lowercased key split on "_" is one of the nineteen parts: api_base, redis_host and User_Password_hash are, key-name, apikey and passwords are not, and key_management_system is not although it holds key.
    proof: [credential-keys, oracle, helper-python]
  - text: >-
      true and false render under any key; a known string renders only under a key that is not credential-like; an array renders its rendering items as [a, b] or nothing; numbers, null and objects never render.
    proof: [value-rendering, oracle, helper-python]
  - text: >-
      safe_config_lines returns general_settings, litellm_settings, litellm_settings.cache_params, router_settings, guardrails[i].litellm_params and model_list lines in that order; a section that is not an object gives no lines, an entry of guardrails that is not an object keeps its index, and model_list gives one line of sorted distinct known providers or none.
    proof: [section-lines, oracle, helper-python]
  - text: >-
      Every name of the five known-key tables and of the known-value table matches LiteLLM at the pin, and the enterprise-only callback names are absent.
    proof: [name-tables, oracle, helper-python]
  - text: >-
      build_proxy_environment_report and build_proxy_bug_report pass Surface::Proxy and the snapshot's safe_config_lines to B4170's builders; the bug report keeps the exception type, the frame of the given location and the three call fields.
    proof: [report-builders]
  - text: A new b10058 seed reaches the shared helper case parser.
    proof: [helper-case-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
    - id: credential-keys
      why: the credential-like key test is missing or lets a credential key through
      run: cargo nextest run --locked -p betterlite-reporting --no-tests=fail -E 'test(/^safe_proxy_config::(.*::)?credential_key_/)'
    - id: value-rendering
      why: value rendering tests are missing or render a value LiteLLM drops
      run: cargo nextest run --locked -p betterlite-reporting --no-tests=fail -E 'test(/^safe_proxy_config::(.*::)?render_/)'
    - id: section-lines
      why: section order, the non-object fallbacks, guardrail indexes or the provider line are untested or wrong
      run: cargo nextest run --locked -p betterlite-reporting --no-tests=fail -E 'test(/^safe_proxy_config::(.*::)?section_/)'
    - id: name-tables
      why: the name tables are missing a LiteLLM name or hold one LiteLLM does not have
      run: cargo nextest run --locked -p betterlite-reporting --no-tests=fail -E 'test(/^safe_proxy_config::(.*::)?table_/)'
    - id: report-builders
      why: a report builder skips the proxy surface or the safe config lines
      run: cargo nextest run --locked -p betterlite-reporting --no-tests=fail -E 'test(/^safe_proxy_config::(.*::)?report_/)'
    - id: helper-python
      why: the b10058 adapter is missing or fails the strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10058.py tools/oracle/helpers/b10058)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no new b10058 seed reaches the shared helper case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/safe-proxy-config-*")" &&
        grep -lE 'b10058"?:' tools/oracle/fuzz/corpus/helper_case/safe-proxy-config-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-reporting --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/safe-proxy-config/credential-keys.yaml
  - tools/oracle/cases/helpers/safe-proxy-config/value-rendering.yaml
  - tools/oracle/cases/helpers/safe-proxy-config/section-shapes.yaml
  - tools/oracle/cases/helpers/safe-proxy-config/known-key-tables.yaml
  - tools/oracle/cases/helpers/safe-proxy-config/known-value-tables.yaml
deviations:
  - what: Lines inside one section come in sorted key order, not in the order the config file lists the keys.
    why: The snapshot holds serde_json objects, and this workspace builds serde_json without preserve_order, so object keys are sorted; turning that feature on would reorder every JSON map in the server build. Which lines appear and their text stay the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/bug_report_config.py#L145-L150
out_of_scope:
  - "GET /debug/report (debug_utils.py L789-L805), its proxy admin check and its auth: B4171."
  - "_proxy_config_lines (L201-L207) reads proxy_server globals; the caller's ProxyConfigSnapshot replaces it. Building that snapshot from the loaded config and handing it to the route and the exception paths: the server callers, B4171 for the route, B2400's diagnostic service and B8591's handlers."
  - "build_bug_report, build_environment_report, KNOWN_PROVIDERS, the provider filter and the report records: B4170. should_report_bug, bug_report_notice and strip_bug_report_notice: B4170, called by B2400 and B8591."
pitfalls:
  - The key is split on "_" only, so key-name and apiKey are not credential-like, while user_password_hash is, through its password part.
  - A boolean renders under a credential-like key (redis_host true gives a line), but a string never does there, even a known one such as a provider name.
  - The provider prefix must be in KNOWN_PROVIDERS, so GPT-4/claude gives no provider, and a model without "/" gives none either.
  - CALLBACK_CLASS_STR_TO_CLASS_TYPE gains pagerduty, generic_api, resend_email, sendgrid_email and smtp_email only when litellm_enterprise imports, so they stay out unless another source of the known-value table names them.
  - litellm/__init__.py binds many names inside if and try blocks; _module_level_names reads only the module's top-level statements, so those names are not litellm_settings keys.
  - general_settings comes from the second argument, so a general_settings key inside config is never read.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
