id: B10058
title: Safe proxy config lines for bug reports
description: >-
  LiteLLM puts a few config lines into every proxy bug report and into the answer of GET /debug/report: keys LiteLLM itself defines, with values that are booleans or names LiteLLM itself defines, so nothing an operator typed (a key, a URL, a host) can reach a public GitHub issue link. litellm/proxy/bug_report_config.py builds them. Three tasks need them: B2400's exception conversion logs build_proxy_bug_report for an unexpected error, B8591's app exception handlers do the same, and B4171's GET /debug/report returns build_proxy_environment_report. Build the whole file here as module safe_proxy_config in betterlite-reporting (crates/betterlite-reporting/src/safe_proxy_config.rs, the empty stub lib.rs already declares, with tests in safe_proxy_config/tests.rs). It registers no route and needs no auth; B4171 keeps the route.


  Inputs. LiteLLM reads proxy_server.proxy_config.config (the loaded config.yaml) and the general_settings global. Here the caller passes both in a `ProxyConfigSnapshot { config: serde_json::Map<String, Value>, general_settings: serde_json::Map<String, Value> }` that the server builds once from the config it loaded. Move serde_json from betterlite-reporting's dev-dependencies to its dependencies; the crate gains no betterlite crate dependency.


  safe_config_lines(config, general_settings) returns the lines of six sections in this order, with nothing between them: general_settings.<key> over the general_settings argument (not config["general_settings"]); litellm_settings.<key> over config["litellm_settings"]; litellm_settings.cache_params.<key> over that map's "cache_params"; router_settings.<key> over config["router_settings"]; guardrails[<i>].litellm_params.<key> over the litellm_params of entry i of config["guardrails"]; then model_list[*].provider. A section value that is not an object (for guardrails and model_list, not an array) counts as empty, like LiteLLM's _object_map and _object_list. Every guardrails entry takes an index, an entry that is not an object included. A line is `<section>.<key> = <rendered>`, kept only when the key is in that section's known-key table and the value renders. Inside a section, lines follow the map's key order.


  Rendering, as _render_json does it. true and false render as `true` and `false` under any key. A string renders as itself only when it is in the known-value table and the key is not credential-like. An array renders each item with the same key, drops the items that do not render and gives `[a, b]` joined with ", ", or nothing when no item renders; a nested array renders as one bracketed item. Numbers, null and objects never render. A key is credential-like when any part of the lowercased key split on "_" is one of key, keys, secret, secrets, token, password, passwd, credential, credentials, url, uri, dsn, host, hosts, base, endpoint, cert, pem or salt, except the exact key key_management_system.


  model_list. For each deployment, litellm_params.model names a provider only when it is a string with a "/" and the part before the first "/" is in B4170's KNOWN_PROVIDERS (LiteLLM's allowlisted). The distinct providers, sorted, give one line `model_list[*].provider = [a, b]`, or no line at all.


  Name tables. LiteLLM computes its tables from its own code at runtime; here they are static data read from the pinned sources. The known-key tables are ConfigGeneralSettings's fields for general_settings; the module-level names of litellm/__init__.py for litellm_settings (targets of plain and annotated assignments to a bare name and the names an import-from binds, top level only, so a name bound inside an if or try block or by a plain `import x` does not count); Cache.__init__'s parameters for cache_params and Router.__init__'s for router_settings, both without self; and the guardrail LitellmParams model fields, every mixin's fields included, for guardrails. The known-value table joins VALID_ROUTING_STRATEGIES, KNOWN_PROVIDERS, litellm._known_custom_logger_compatible_callbacks, the keys of CustomLoggerRegistry.CALLBACK_CLASS_STR_TO_CLASS_TYPE and the values of LiteLLMCacheType, KeyManagementSystem, SupportedGuardrailIntegrations and GuardrailEventHooks. The tables come to about 1,300 names, so store each as one whitespace-separated &str in the style of KNOWN_PROVIDERS, in a submodule, and keep every source file under 300 lines. Read KNOWN_PROVIDERS from bug_report::providers instead of copying it; the skeleton made that module pub(crate) in bug_report.rs for this.


  Reports. build_proxy_environment_report(snapshot, host) calls B4170's build_environment_report with Surface::Proxy and the snapshot's safe_config_lines. build_proxy_bug_report(exception, location, call fields, snapshot, host) calls B4170's build_bug_report with a CallContext of Surface::Proxy, the call_type, custom_llm_provider and stream the caller gives (None by default in LiteLLM) and the same lines; the location is the &Location B9979 made build_bug_report take, captured by the caller where the error was created.


  Oracle. Helper cases on the b10058 operation compare safe_config_lines only: the input is {config, general_settings} and the answer is the list of lines. The Python adapter calls the pinned safe_config_lines with the two mappings. The two report builders read proxy_server globals in LiteLLM, so native tests cover them. The helper runner hands both sides serde_json values, so case files list keys in sorted order inside each section. No byte parser is added, so there is no fuzz target. Budget from about 170 owned LiteLLM lines plus the tables: about 260 production lines, 200 table lines, 120 adapter lines and 300 test lines.
scope:
  paths:
    - crates/betterlite-reporting/Cargo.toml
    - crates/betterlite-reporting/src/safe_proxy_config.rs
    - crates/betterlite-reporting/src/safe_proxy_config/**
    - tools/oracle/src/helpers/reporting/Cargo.toml
    - tools/oracle/src/helpers/reporting/b10058.rs
    - tools/oracle/src/helpers/reporting/b10058/**
    - tools/oracle/helpers/b10058.py
    - tools/oracle/helpers/b10058/**
    - tools/oracle/cases/helpers/safe-proxy-config/**
    - tools/oracle/fuzz/corpus/helper_case/safe-proxy-config-*
    - Cargo.lock
  lint_tables: false
