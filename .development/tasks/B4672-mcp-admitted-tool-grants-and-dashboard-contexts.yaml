dod:
  - text: >-
      allowed_tools_for_server returns None for no auth and returns managed_agent_tools for a managed agent with the error returned and not turned into a deny;
      a keyless admitted user is answered by admitted_subject_tools before any key or team read.
    proof: [allowed-tools-tests]
  - text: >-
      The key and team step reads the key permission as it sits on the auth and the team permission from the port, adds the key's toolset tools through the registry and the team's through toolset_tools_for_server,
      and combines them: both non-empty gives the intersection, only a non-empty team gives the team list, otherwise the key list exactly as it is.
    proof: [allowed-tools-tests]
  - text: >-
      The end user, user, agent caller, and agent and org tool ceilings run in that order on the combined list, with keyless_source passed to the user and the agent and org steps.
    proof: [allowed-tools-tests]
  - text: >-
      Any error after the managed check gives Some(empty) when it is an Unloadable error, when keyless_source is true or when the auth is an admitted subject, and None for key auth otherwise.
    proof: [allowed-tools-tests]
  - text: >-
      admitted_subject_tools reads the user's own source and each team source that grants the server, passes keyless_source true, unions their tools sorted and de-duplicated,
      returns on the first unrestricted source, and lets only the user's own source in through an open channel or an unscoped admin view.
    proof: [admitted-tools-tests]
  - text: >-
      narrow_to_toolset leaves the tools alone with no toolset scope, gives the sorted scoped tools when the tools are unrestricted, their sorted intersection otherwise,
      and an empty list for a server the scope does not name; it is applied on both return paths of admitted_subject_tools.
    proof: [admitted-tools-tests]
  - text: >-
      tool_is_granted is true for None and for an exact bare name in the list and false for an empty list or any other spelling; server_is_allowed is false for an empty list and true only for a listed name.
      is_tool_allowed_for_server answers through allowed_tools_for_server and tool_is_granted.
    proof: [checks-tests, helper-case-corpus, helper-python, helper-tests, oracle]
  - text: >-
      managed_agent_tools returns Some(empty) for a server outside the managed servers, the agent's own tools sorted for an autonomous agent, Some(empty) for a delegated agent with no user,
      and the intersection with the human's tools (limited to the agent's team, or to no team when it has none) for a delegated agent; a failure inside the body is the policy_unavailable identity failure with the message "Agent tool policy is unavailable".
    proof: [managed-tools-tests]
  - text: >-
      with_team_id changes only team_id, with_parent_span_of copies only the trace span handle, and own_grant_view reports the object permission presence, its id and the admin view flag.
    proof: [session-auth-tests]
  - text: >-
      is_ui_session_credential needs the dashboard team id and a non-empty user_id; is_keyless_mcp_subject is true for a session credential or an admitted subject;
      resolve_ui_session_team_ids returns the user's teams de-duplicated in order, keeps the dashboard team id, and returns an empty list for a non-session credential, no database, a read error, a missing user or no teams.
    proof: [contexts-tests]
  - text: >-
      admitted_user_context returns None for a non-session credential and for a reload error, and otherwise the reloaded user with the session's trace span;
      acting_user_auth keeps a non-session credential and an admin view session and otherwise returns the admitted user or the session itself.
    proof: [contexts-tests]
  - text: >-
      build_effective_auth_contexts returns one copy per real team (or the auth itself) followed by the admitted context when there is one, and can_access_mcp_server is true at the first context whose server list holds the server and returns a list error.
    proof: [contexts-tests]
  - text: >-
      toolset_grant_contexts returns a virtual key as its own single source and a keyless subject as the user's source plus one per live roster team;
      restricts_mcp is true for any non-empty server, toolset, tool permission or access group field and false for an absent or empty permission.
    proof: [toolsets-tests, helper-case-corpus, helper-python, helper-tests, oracle]
  - text: >-
      granted_toolset_ids gives a source that declares MCP grants of its own only its own toolsets, lets a source that declares none inherit its team's, gives nothing to a key's team under
      require_key_mcp_access_defined, always inherits for a keyless subject, and drops an unreadable own grant or unreadable team without failing the other sources.
    proof: [toolsets-tests]
  - text: The production reads map B4668's and B736's results to ToolReads and SessionReads values, keeping Unloadable apart from Failed.
    proof: [reads-tests]
  - text: Helper cases for tool_is_granted, server_is_allowed and restricts_mcp are present, replay through the shared parser and agree with LiteLLM.
    proof: [helper-case-corpus, helper-python, helper-tests, oracle]

checks:
  optional: []
  commands:
    - id: allowed-tools-tests
      why: the key and team tool combination, the ceiling order or the deny-on-fault guard is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^tool_access::allowed_tools::tests::/)'
    - id: admitted-tools-tests
      why: the admitted subject tool union, the open channel rule or the toolset narrowing is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^tool_access::admitted_subject::tests::/)'
    - id: checks-tests
      why: tool_is_granted, server_is_allowed or is_tool_allowed_for_server is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^tool_access::checks::tests::/)'
    - id: managed-tools-tests
      why: the managed agent tool list, the delegated human branch or the policy_unavailable conversion is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^tool_access::managed::tests::/)'
    - id: session-auth-tests
      why: the session auth copies or the own grant view are missing or touch the wrong fields
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^session_auth::tests::/)'
    - id: contexts-tests
      why: the dashboard session identity, its team ids or the effective auth contexts are missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^ui_session::contexts::tests::/)'
    - id: toolsets-tests
      why: the per-source toolset grant resolution or restricts_mcp is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^ui_session::toolsets::tests::/)'
    - id: reads-tests
      why: the production reads map a store result to the wrong port value
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::tool_session_reads::tests::/)'
    - id: helper-tests
      why: the helper adapter does not reach the production functions
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::mcp::b4672::/) - test(/replays_the_/)'
    - id: helper-python
      why: the Python helper adapter is missing or fails the strict checks
      run: test -f tools/oracle/helpers/b4672.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-tool-grants helper case reaches the shared parser
