    - crates/betterlite-mcp/src/tool_access.rs
    - crates/betterlite-mcp/src/tool_access/**
    - crates/betterlite-mcp/src/ui_session.rs
    - crates/betterlite-mcp/src/ui_session/**
    - crates/betterlite-auth/src/session_auth.rs
    - crates/betterlite-auth/src/session_auth/**
    - crates/betterlite-server/src/mcp/tool_session_reads.rs
    - crates/betterlite-server/src/mcp/tool_session_reads/**
