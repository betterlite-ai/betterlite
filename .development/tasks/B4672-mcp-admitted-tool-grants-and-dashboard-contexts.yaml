deviations:
  - what: Reads go through typed ports (ToolReads, SessionReads, ContextServers and B4671's and B4670's ports) instead of importing proxy_server globals (prisma_client, user_api_key_cache, global_mcp_server_manager).
    why: betterlite has no module-level state; the observable results are the same.
  - what: LiteLLM's optional callable parameters on the ui_session_utils functions (admitted_context, admitted_sources, effective_contexts, team_object_permission, own_object_permission, allowed_servers) become the ports above; there is no per-call override.
    why: those parameters exist so tests can swap a function; the ports do the same job without closures.
  - what: granted_toolset_ids reads its contexts one after another and returns a sorted set; LiteLLM runs them together with asyncio.gather and returns a frozenset.
    why: no context read can fail and the result is a set, so only timing differs.
  - what: Every Err from reload_admitted_user is treated as the HTTPException case in admitted_user_context (warn and return None); LiteLLM lets a non-HTTP exception escape.
    why: the port returns one error type and B4673's reload raises HTTP errors for every failure a caller can see; see notes.
  - what: Tool lists LiteLLM builds from a Python set on the key and team path come back de-duplicated in first-seen order; the admitted subject list stays sorted as in LiteLLM.
    why: Python's set order is not stable, so no client can rely on it; tests compare as sets where order is not part of the contract.
  - what: Only tool_is_granted, server_is_allowed and restricts_mcp have oracle cases; every other function is covered by Rust tests with fakes.
    why: the rest read proxy_server globals, and a helper adapter cannot drive them; the HTTP cases come with the routes B4726 to B4728 and B137.

