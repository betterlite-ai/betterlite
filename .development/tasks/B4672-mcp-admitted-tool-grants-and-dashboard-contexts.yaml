  - "apply_end_user_tool_ceiling, apply_user_tool_ceiling, apply_agent_caller_tool_ceiling, get_agent_tool_permissions_for_server, _apply_agent_and_org_tool_ceilings and admin_view_unscoped: B4670. This task calls them."
