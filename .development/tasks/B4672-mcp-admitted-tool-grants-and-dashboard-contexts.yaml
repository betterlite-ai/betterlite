pitfalls:
  - The key path in allowed_tools_for_server reads the key's permission straight from the auth (no database read), while granted_toolset_ids hydrates it by object_permission_id; do not hydrate in one and skip it in the other.
  - The key's toolsets go through the registry resolver, which turns a read fault into an empty map, but the team's toolsets go through toolset_tools_for_server, which raises Unloadable; so an unreadable key toolset reads as no tool restriction and an unreadable team toolset denies.
  - Python tests the team and key lists for truthiness, so a team list of Some(empty) falls through to the key list, and a non-empty team list with an empty key list is the team list alone; only two non-empty lists intersect, and that intersection can be empty.
  - A fault returns Some(empty) for an Unloadable error, for keyless_source and for an admitted subject, but None (allow all) for an ordinary key, so the same error denies one caller shape and opens another.
  - The managed agent check sits outside the guard, so its failure is a 503 identity error and not an empty list; managed_agent_tools has its own guard whose message is "Agent tool policy is unavailable", different from the "Agent MCP policy is unavailable" that the server check inside it can return.
  - Each source is resolved with keyless_source = true; without it a fault inside one source would return None and win the union as allow-all.
  - One unrestricted source (None) ends admitted_subject_tools at once and the later sources are not read, and the toolset narrowing still applies to that None result.
  - An open channel server (operator_open_server_ids, or admin_view_unscoped) is reachable for the user's own source only (no team_id); it confers reachability, not a ceiling waiver, so that source's own tool permissions and the org tool ceiling still bind.
  - A toolset scope that resolves to an empty map is not the same as no scope, narrowing then gives Some(empty) for every server, and only a missing mcp_toolset_id leaves the tools alone.
  - server_is_allowed (LiteLLM's is_tool_allowed) compares a server name against a list of allowed servers and has nothing to do with tools; tool_is_granted compares the bare tool name exactly, with no prefix stripping.
  - A delegated managed agent with no team_id passes an EMPTY team set to admitted_subject_tools, not None, so only the human's own grants count; None would mean every team the human is in.
  - resolve_ui_session_team_ids keeps the dashboard team id "litellm-dashboard", while B4669's user_team_ids drops it; do not reuse the B4669 read here.
  - is_ui_session_credential needs a non-empty user_id, and an admin view session keeps its own auth in acting_user_auth even when the user could be admitted.
  - build_effective_auth_contexts puts the admitted context LAST and keeps the per-team copies even when the admitted context exists; a session with no resolved teams contributes the session auth itself.
  - own_toolset_ids returns None (inherit the team) only when the source's permission row names nothing MCP-related; a row that exists but is empty on all four fields inherits, a named row that cannot be read grants nothing, and neither case fails the other sources.
  - under require_key_mcp_access_defined a virtual key's context inherits nothing from its team, but a keyless subject always does, since its team sources are separate contexts.

