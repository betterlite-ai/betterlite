    - "tools/oracle/fuzz/corpus/helper_case/mcp-tool-grants-*"
    - tools/oracle/helpers/b4672.py
    - tools/oracle/helpers/b4672/**
    - tools/oracle/src/helpers/mcp/b4672.rs
    - tools/oracle/src/helpers/mcp/b4672/**
  lint_tables: false

