dod:
  - text: passthrough_vertex_base_url returns the global, regional and multi-region hosts with a trailing slash, and the Required and InvalidFormat errors for None and for a bad location, including one with a trailing newline.
    proof: [base-url-tests, oracle]
  - text: resolve_vertex_router_model lets router project and location win over the URL's only when non-empty, strips the provider prefix from the model in both endpoints (all occurrences), and returns the deployment's model info only when it is an object.
    proof: [router-model-tests]
  - text: resolve_vertex_router_model returns the original inputs, project and location included, for a missing router, a missing deployment, a lookup error and a provider resolution error.
    proof: [router-model-tests]
  - text: override_vertex_params replaces project and location only with non-empty string values and keeps the URL value otherwise, with the three warnings for an empty litellm_params and for each missing value.
    proof: [override-params-tests, oracle]
  - text: allowed_vertex_headers returns only anthropic-beta and content-type, vertex_upstream_headers drops anthropic-beta only on a count-tokens route, and is_vertex_count_tokens_route matches on the segment before the first colon.
    proof: [header-filter-tests, oracle]
  - text: prepare_vertex_auth_headers forwards the filtered caller headers with headers_passed_through true when no credentials and no router credentials exist, and passes B3603's 401 through.
    proof: [credentialless-tests]
  - text: prepare_vertex_auth_headers with credentials or router credentials calls the token functions with the exact arguments, takes the returned project, sends only the allowed headers plus a Bearer Authorization, and never logs the token.
    proof: [credentialed-tests]
checks:
  optional: []
  commands:
    - id: base-url-tests
      why: the Vertex base URL is wrong for a location or a bad location is accepted
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_auth::tests::base_url(::|$)/)'
    - id: router-model-tests
      why: the router model resolution picks the wrong project, endpoint or fallback
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_auth::tests::router_model(::|$)/)'
    - id: override-params-tests
      why: the vector store override replaces a value it should keep or skips a warning
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_auth::tests::override_params(::|$)/)'
    - id: header-filter-tests
      why: a caller header leaks upstream, or anthropic-beta is kept on a count-tokens route
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_auth::tests::header_filter(::|$)/)'
    - id: credentialless-tests
      why: the credential-less branch builds the wrong headers or loses the 401
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_auth::tests::credentialless(::|$)/)'
    - id: credentialed-tests
      why: the token calls get wrong arguments, the headers carry extra values or the token is logged
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_auth::tests::credentialed(::|$)/)'
