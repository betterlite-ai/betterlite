deviations:
  - what: A location with a trailing newline, such as `us-central1` followed by a newline, is rejected as InvalidFormat.
    why: Python's `$` also matches before a final newline, so LiteLLM accepts it and builds a host name with a newline in it that no client can use. Rejecting is the only sane result.
  - what: The "No vertex credentials found" ValueError is not built.
    why: After the credential-less branch has taken its case, the remaining inputs always include credentials with a project or router credentials, so the error cannot fire. The Rust input type cannot express the impossible case.
  - what: The router lookup is the VertexDeploymentLookup trait and the vector store record is RouterCredentials.
    why: The module sits above B396's router service and B1061's store type and takes only the fields it reads. What a client sees is the same.
out_of_scope:
  - "Every @router.api_route in the Vertex section, _base_vertex_proxy_route, BaseVertexAIPassThroughHandler and its two subclasses, get_vertex_pass_through_handler and the default base URL wrapper: B3623 owns them and calls this module."
  - "_normalize_credential_value, _is_authenticated_caller_jwt, _is_authenticated_caller_secret, _operator_configured_caller_key_header_names, _caller_headers_without_litellm_secrets, _forwarded_headers_for_credentialless_vertex_passthrough and the Vertex, Anthropic and Bedrock header sets: B3603 owns them; this task only calls the Vertex credential-less function."
  - "get_vertex_credentials, VertexPassThroughCredentials and the default Vertex config: B3602 owns them (the record is `crate::pass_through_credentials::VertexPassThroughCredentials`); B3623 passes the record in."
  - "_ensure_access_token_async and _get_token_and_url: B1303 and B1304 own them; this task calls them."
  - "Router.get_available_deployment_for_pass_through: B396 owns it."
  - "get_vertex_model_id_from_url, get_vertex_project_id_from_url, get_vertex_location_from_url and construct_target_url: B1304 owns them; B3623 calls them before this module."
  - "_upstream_headers_for_anthropic_route and _upstream_headers_for_bedrock_agent_runtime_route: B3603 owns the filters and B3620 and B3625 call them."
pitfalls:
  - "The blanket except in _resolve_vertex_model_from_router resets the project and location too, so a get_llm_provider failure after the router values were read returns the URL's values, not the router's."
  - "str.replace changes every occurrence of the model id in the endpoint, including one inside the project or publisher part; copy that, do not replace only the model segment."
  - "The router deployment's `vertex_project` and `vertex_location` are checked for truthiness, so an empty string keeps the URL value."
  - "With router_credentials present the credential string is None even when vertex_credentials has one; the router credentials do not carry a key file."
  - "The token returned by _ensure_access_token_async comes with a project, and that project replaces the one passed in, so a project the credentials supply reaches the target URL."
  - "The Authorization key is spelled `Authorization` in the result, while the filtered caller headers are lower case; a caller `authorization` cannot appear in branch two because only two names are allowed."
  - "On a count-tokens route only the header named anthropic-beta is removed, and only from the headers handed to the upstream call; the credential-less caller headers keep every other name B3603 let through."
  - "headers_passed_through true is what makes B3623 add the 'No credentials found on proxy for project_name=...' text to a ProxyException, so it must be true for branch one only."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
