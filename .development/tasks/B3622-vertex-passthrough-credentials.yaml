id: B3622
title: Pass-through Vertex credential preparation
description: >-
  Build the code that decides which Vertex project, location, model name and upstream headers a Vertex pass-through call uses, as the module vertex_passthrough_auth in crates/betterlite-server.
  The route task B3623 calls it from its shared Vertex route and registers every route, so this task adds no HTTP route and no HTTP oracle case.
  Every name below is at most 30 characters; LiteLLM's longer names are renamed on purpose.
  Nothing here calls B3618: its helpers (provider_target_url, router_request_metadata, relay_router_model and the rest) serve the other provider routes, and the Vertex route needs none of them.

  Base URL. `passthrough_vertex_base_url(location: Option<&str>)` replaces get_vertex_base_url in llm_passthrough_endpoints.py and returns the base with a trailing slash.
  `global` gives `https://aiplatform.googleapis.com/`. None is the error `Required` (LiteLLM raises ValueError "vertex_location is required").
  A location that does not match `^[a-z][a-z0-9-]*$` is the error `InvalidFormat` (LiteLLM: "Invalid vertex_location format"). Match the whole string, so a trailing newline is rejected too.
  A location with no `-` gives `https://aiplatform.{location}.rep.googleapis.com/`, any other gives `https://{location}-aiplatform.googleapis.com/`.
  The error enum is `VertexLocationError`. B3623 turns Required into its own 400 before it calls this function and lets InvalidFormat become a 500, as LiteLLM does.
  This is not B1305's get_vertex_base_url in betterlite-vertex. The proxy copy has its own location checks and its own errors, so write it here and do not call the other one.

  Router model. `resolve_vertex_router_model` replaces _resolve_vertex_model_from_router. It takes the model id from the URL, the router (an Option of the trait `VertexDeploymentLookup` declared in this module), the encoded endpoint, the endpoint, the URL's project and location, and returns `ResolvedVertexModel { encoded_endpoint, endpoint, project, location, deployment_model_info: Option<Map> }`.
  The trait has one method, `deployment_for_pass_through(model) -> Result<Option<Deployment>, LookupError>`, backed by B396's synchronous pass-through selection (Router.get_available_deployment_for_pass_through). B8641 wires the real router (PassthroughLookup); tests use a fake.
  Steps in order:
  1. No router gives the inputs back unchanged with model info None.
  2. Ask the lookup for the model id. No deployment (None) gives the inputs back with model info None.
  3. Take `litellm_params` and `model_info` from the deployment. The model info counts only when it is a JSON object; anything else is None.
  4. A non-empty `vertex_project` in litellm_params replaces the project, and a non-empty `vertex_location` replaces the location. Router values win over the URL. An empty string or a missing key leaves the URL value.
  5. When litellm_params `model` is non-empty, resolve it with B174's get_llm_provider (model only) and take the model name without the provider prefix, for example `vertex_ai/gemini-2.0-flash-exp` gives `gemini-2.0-flash-exp`. When that name is non-empty and different from the URL's model id, replace every occurrence of the model id in both the encoded endpoint and the endpoint with it (plain string replace of all occurrences, like Python's str.replace).
  6. Return the new endpoints, project, location and the model info.
  Any error from the lookup (no deployment has use_in_pass_through, a blocked or rate-limited model) or from the provider resolution is swallowed with one debug log line that names the model id and the error, and then the function returns the inputs unchanged with model info None. That includes the project and location, which step 4 may already have replaced: the failure path returns the original values, not the partly updated ones.
  Log only model names and providers. Never log a key or credential.

  Vector store credentials. `override_vertex_params(router_credentials, project, location)` replaces _override_vertex_params_from_router_credentials and returns `(Option<String>, Option<String>)`.
  `router_credentials` is `Option<&RouterCredentials>`, a record declared here with one field, `litellm_params: Option<Map>`. B3623 builds it from the vector store record that B1061 returns.
  None returns the inputs unchanged. A record whose litellm_params is missing, not an object or empty logs the warning "Vector store credentials found but litellm_params is empty" and returns the inputs unchanged.
  Otherwise read `vertex_project` and `vertex_location` from litellm_params; a value counts only when it is a non-empty string. Each one that counts replaces the URL value, each one that does not logs a warning ("Vector store credentials found but missing vertex_project in litellm_params", and the same for vertex_location). Keep the debug lines for the overrides too.

  Allowed caller headers. `allowed_vertex_headers(request)` replaces get_vertex_ai_allowed_incoming_headers. It reads the request headers through B1100's cached header read (never mutate the cached map) and returns a new map with only `anthropic-beta` and `content-type`, when the request has them. LiteLLM's ALLOWED_VERTEX_AI_PASSTHROUGH_HEADERS is exactly those two names; keep them in one const array.
  `is_vertex_count_tokens_route(endpoint)` replaces _is_vertex_anthropic_count_tokens_route: it is true when the part after the last `/` and before the first `:` equals `count-tokens`.
  `vertex_upstream_headers(endpoint, headers)` replaces _upstream_headers_for_vertex_route: for a count-tokens route it returns a copy without any header whose lower-cased name is `anthropic-beta`, otherwise the same headers.

  Auth preparation. `prepare_vertex_auth_headers` replaces _prepare_vertex_auth_headers (async). It takes the request, `vertex_credentials: Option<VertexPassThroughCredentials>` (the record B3602 owns, `crate::pass_through_credentials::VertexPassThroughCredentials`), `router_credentials: Option<&RouterCredentials>`, the project, the location and the authenticated key. It returns `VertexAuthPrep { headers, headers_passed_through: bool, project, location }`.
  Branch one: when router_credentials is None and the credentials are None or have no project, call B3603's `_forwarded_headers_for_credentialless_vertex_passthrough` with the request and key and use its result as the headers (its 401 when the caller sent no Google credential passes through unchanged), set headers_passed_through to true, leave project and location as given, and debug-log only the header names, never the values.
  Branch two, in every other case:
  - With router_credentials present the credential string is None (the token comes from application default credentials) and the project and location stay as given.
  - Without router_credentials the credentials record is present with a project (branch one covers every other combination, so the old "No vertex credentials found" error cannot happen; model the input so it cannot be built). Its project replaces the project, its location replaces the location only when it is not None, and its `vertex_credentials` is the credential string.
  - Call B1303's `_ensure_access_token_async` with that credential string, the project and custom_llm_provider `vertex_ai_beta`. It returns the token and a project; the returned project replaces the project.
  - Call B1304's `_get_token_and_url` with model "", that token, no gemini api key, the credential string, the project, the location, stream false, custom_llm_provider `vertex_ai_beta` and api_base "". Keep the token from the first element and drop the URL.
  - The headers are allowed_vertex_headers of the request plus `Authorization: Bearer {token}`, with the token held as a secret value that never reaches a log or an error text.
  - headers_passed_through is false.
  LiteLLM builds a new VertexBase for every call, so every call starts from an empty token cache. Do the same: create a fresh B1302 token state per call and share nothing between requests.
