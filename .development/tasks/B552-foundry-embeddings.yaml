  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_embeddings in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/embeddings.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_embeddings.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
