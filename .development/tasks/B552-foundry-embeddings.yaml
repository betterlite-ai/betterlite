- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/embed/cohere_transformation.py#L21-L86
  why: >-
    Own AzureAICohereConfig.__init__, AzureAICohereConfig._map_azure_model_group, AzureAICohereConfig._transform_request_image_embeddings,
    AzureAICohereConfig._transform_request, AzureAICohereConfig._transform_response. Other functions in this file
    remain with the owners listed below.
