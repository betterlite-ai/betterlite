checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-models-embeddings-route
    why: Only B549 recognized model-inference bases gain /models unless their trimmed path already ends /models;
      preserve query/fragment. Image request URL then concatenates /images/embeddings literally. Sync requires non-None
      base/key with ValueError naming AZURE_AI_API_BASE/AZURE_AI_API_KEY; async has no corresponding guard and sends
      Authorization Bearer <key>.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_foundry_models_embeddings_route$/)'
  - id: case-cohere-model-group
    why: A truthy llm_provider-azureml-model-group sets response.model; map offer-cohere-embed-multili-paygo to
      Cohere-embed-v3-multilingual and offer-cohere-embed-english-paygo to Cohere-embed-v3-english, keeping all
      other names.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_cohere_model_group$/)'
  - id: case-text-input-type-truncate
    why: 'Classify images using is_base64_encoded only, preserving each original string in input:[{image:<string>}];
      all options are copied to both projections. The filtered text request is used only as a nonempty test: the
      actual inherited OpenAI embedding call receives the original unfiltered input, including image strings.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_text_input_type_truncate$/)'
  - id: case-inline-image-embedding
    why: Images run before the text call in both modes. A suitable supplied HTTP client is reused; sync replacement
      uses timeout and concurrent_limit=1, async uses B173 azure_ai client with timeout. JSON response is projected
      by B004 embedding conversion with response headers; no request URL download occurs.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_inline_image_embedding$/)'
  - id: case-response-model-index-usage
    why: Interleave image/text data by recorded source indices when both are non-None, otherwise assign the available
      list; preserve upstream entry indices without renumbering. Read truthy llm_provider-num_tokens from hidden
      additional_headers and int-convert it into prompt_tokens, creating Usage if absent; other token counts are
      not recomputed.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_response_model_index_usage$/)'
  - id: case-embedding-error
    why: A performed image call returning data=None raises Exception /image/embeddings route returned None Embeddings.;
      text None raises /v1/embeddings route returned None Embeddings. Preserve HTTP/JSON/int conversion failures
      and short result-list indexing failures without new wrapping.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_embedding_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_embeddings.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_embeddings*")"
      && grep -lq 'foundry_embeddings' tools/oracle/fuzz/corpus/helper_case/foundry_embeddings* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_embeddings$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_embeddings)"
      && grep -q 'decode_foundry_embedding' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_embeddings.rs &&
