checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-models-embeddings-route
    why: The foundry-models-embeddings-route behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_foundry_models_embeddings_route$/)'
  - id: case-cohere-model-group
    why: The cohere-model-group behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_cohere_model_group$/)'
  - id: case-text-input-type-truncate
    why: The text-input-type-truncate behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_text_input_type_truncate$/)'
  - id: case-inline-image-embedding
    why: The inline-image-embedding behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_inline_image_embedding$/)'
  - id: case-response-model-index-usage
    why: The response-model-index-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_response_model_index_usage$/)'
  - id: case-embedding-error
    why: The embedding-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::embeddings_cases::case_[0-9]+_embedding_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_embeddings.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_embeddings*")"
      && grep -lq 'foundry_embeddings' tools/oracle/fuzz/corpus/helper_case/foundry_embeddings* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_embeddings$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_embeddings)"
      && grep -q 'decode_foundry_embedding' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_embeddings.rs &&
      cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_embeddings_corpus$/)'
