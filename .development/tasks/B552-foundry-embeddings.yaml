id: B552
title: Foundry text and image embeddings
description: >-
  Add FoundryEmbeddingOptions and Cohere text/image input projection over existing embedding records. Use configured
  model route and image descriptors, preserve input_type/truncate and response index/model/usage normalization,
  and never fetch a request image URL to fill a byte field.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/embed/handler.py:
  _foundry_models_route_base L21-L28; AzureAIEmbedding._process_response L32-L62; AzureAIEmbedding.async_image_embedding
  L64-L99; AzureAIEmbedding.image_embedding L101-L142; AzureAIEmbedding.async_embedding L144-L205; AzureAIEmbedding.embedding
  L207-L294. litellm/llms/azure_ai/embed/cohere_transformation.py: AzureAICohereConfig.__init__ L21-L22; AzureAICohereConfig._map_azure_model_group
  L24-L30; AzureAICohereConfig._transform_request_image_embeddings L32-L40; AzureAICohereConfig._transform_request
  L42-L68; AzureAICohereConfig._transform_response L70-L86.


  Reuse is_foundry_model_inference_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains
  with that prerequisite.


  Implement crates/betterlite-foundry/src/embeddings.rs with adjacent tests under embeddings/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation foundry_embeddings in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function embeddings_cases in betterlite-foundry with these exact named cases (one per oracle file):
  foundry_models_embeddings_route, cohere_model_group, text_input_type_truncate, inline_image_embedding, response_model_index_usage,
  embedding_error. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_embeddings* using HelperCase: kind: helper
  and the externally tagged foundry_embeddings variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_foundry_embeddings that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_foundry_embedding consumes Foundry embedding JSON response bytes in crates/betterlite-foundry/src/embeddings.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_embeddings.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_embeddings.
  The adjacent test replays_the_foundry_embeddings_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 295 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 315 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 573 planned, 575 maximum changed lines.
