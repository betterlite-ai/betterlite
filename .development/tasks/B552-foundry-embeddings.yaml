  why: >-
    Own _foundry_models_route_base, AzureAIEmbedding._process_response, AzureAIEmbedding.async_image_embedding,
    AzureAIEmbedding.image_embedding, AzureAIEmbedding.async_embedding, AzureAIEmbedding.embedding. Other functions
