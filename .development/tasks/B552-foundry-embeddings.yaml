  - oracle
  - helper-python
- text: 'cohere model group: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-embeddings/cohere-model-group.yaml.'
  proof:
  - case-cohere-model-group
  - oracle
  - helper-python
- text: >-
    text input type truncate: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-embeddings/text-input-type-truncate.yaml.
  proof:
