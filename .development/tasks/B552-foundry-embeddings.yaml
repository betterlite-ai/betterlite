  - tools/oracle/helpers/foundry_embeddings.py
  - tools/oracle/cases/helpers/providers/foundry-embeddings/**
  - tools/oracle/fuzz/corpus/helper_case/foundry_embeddings*
  - crates/betterlite-foundry/fuzz/Cargo.toml
