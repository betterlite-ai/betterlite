- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/sandbox/sandbox_tools.py#L49-L55
  why: Registry registration and lookup operations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/sandbox/main.py#L32-L61
  why: Internal kwargs declaration (litellm_logging_obj, litellm_call_id, litellm_trace_id, litellm_metadata), config getter, kwarg filtering, and per-operation logging.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/sandbox/main.py#L64-L116
  why: Three public lifecycle operations with @client decoration.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9918-L9934
