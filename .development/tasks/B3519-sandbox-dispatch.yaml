deviations:
- what: >-
    acode_interpreter_tool convenience wrapper is not implemented; callers split into
    separate create/run/delete calls.
  why: >-
    No production caller at the pin; integration tests call operations separately, and
    the interception handler composes them explicitly.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/sandbox/main.py#L119-L146
- what: >-
    clear_sandbox_tools is not exported; registry replacement is the only production
    mechanism.
  why: >-
    No production caller at the pin; only test fixtures invoke it, and register_sandbox_tools([])
    replaces the registry identically.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/sandbox/sandbox_tools.py#L58-L59
out_of_scope:
- >-
  The __getattr__ lazy re-export of litellm.harness sandbox (local, docker, etc) is not
  implemented; harness sandboxes live in betterlite-harness and are imported directly.
- >-
  E2B and OpenSandbox concrete implementations are provided by B3516 and B3518; this task
  only calls their acreate_sandbox/arun_code/adelete_sandbox methods.
- >-
  Secret manager dispatch for non-os.environ/ prefixes is deferred to a named B129 leaf;
  this task resolves only the os.environ/ case directly.
pitfalls:
- >-
  Warning-and-skip for malformed entries must occur during registry loading, not on lookup;
  missing provider/name fields are logged but not fatal.
- >-
  Internal kwargs (litellm_logging_obj, litellm_call_id, litellm_trace_id, litellm_metadata)
  must be filtered before forwarding to adapter methods, or they will pollute provider request bodies.
- >-
  The get_secret_str call in _resolve_secret_value applies only to values starting with
  os.environ/; other strings pass through unchanged and other prefixes fail at manager
  dispatch time.
- >-
  Per-operation logging must use the operation name (create_sandbox, run_code, delete_sandbox)
  not the task id, and must be called after config resolution but before forwarding to
  the adapter.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
