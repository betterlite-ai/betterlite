- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/code_interpreter_interception/handler.py#L745-L779
  why: Calls to three public lifecycle operations through resolved tool parameters.
dod:
- text: >-
    Registry accepts configured sandbox_tools list, skips malformed entries with warnings,
    and replaces previous registry on every register_sandbox_tools call.
  proof:
  - sandbox-registry-tests
  - config-sandbox-loader
- text: >-
    All three public lifecycle operations forward to concrete adapters, accept optional
    api_key/api_base overrides, filter internal kwargs, and invoke logging with
    operation-specific model names.
  proof:
  - sandbox-lifecycle-tests
  - oracle
- text: >-
    Secret resolution for os.environ/ prefix occurs during registry load; unsupported
    prefix values remain as strings, and missing environment variables resolve to None.
  proof:
  - sandbox-registry-tests
- text: >-
    Calling acreate_sandbox, arun_code, or adelete_sandbox with an unsupported or unregistered
    provider string (not E2B or OpenSandbox) raises ValueError with a message naming the provider.
  proof:
  - sandbox-provider-error
checks:
  optional:
  - mutants
  commands:
  - id: sandbox-registry-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^sandbox_registry::/) -
      test(/replays_the_/)'
  - id: sandbox-lifecycle-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^sandbox_dispatch::/) -
      test(/replays_the_/)'
  - id: config-sandbox-loader
    why: the configured sandbox_tools section is not accepted
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::sandbox_dispatch::/) -
      test(/replays_the_/)'
  - id: sandbox-provider-error
    why: unsupported provider strings do not raise ValueError or the test is missing
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^sandbox_dispatch::.*unsupported_provider/)'
