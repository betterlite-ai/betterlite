id: B3519
title: Sandbox tool registry and public lifecycle dispatch
description: >-
  Build the configured sandbox tool registry and three live public lifecycle entrypoints
  over the concrete adapters (E2B from B3516 and OpenSandbox from B3518) in betterlite-core.
  Preserve warning-and-skip behavior for malformed registry entries, last-entry-wins name
  replacement, registry replacement semantics, internal-kwarg filtering and per-operation
  logging through Logging.update_from_kwargs with operation-specific model names. Registry
  entries map a configured name to a provider/api_key/api_base triple; credentials prefixed
  with os.environ/ are resolved through get_secret_str. The three public operations
  (acreate_sandbox, arun_code, adelete_sandbox) are @client-decorated so logging/tracing
  behavior matches the existing call pipeline. Each operation accepts a provider string,
  resolves its concrete adapter through the factory, and forwards prepared parameters.
  The configuration loads sandbox_tools from the proxy config section; add config-loader
  tests and fuzz the registry entry structure.
scope:
  paths:
  - crates/betterlite-core/src/skills/sandbox.rs
  - crates/betterlite-core/src/skills/sandbox/**
  - crates/betterlite-models/src/sandbox_dispatch.rs
  - tools/oracle/cases/sandbox/**
  - crates/betterlite-config/src/sections/sandbox_dispatch.rs
  - crates/betterlite-config/src/sections/sandbox_dispatch/**
  - tools/oracle/helpers/b3519.py
  - tools/oracle/helpers/b3519/**
  - tools/oracle/src/helpers/core_ops/b3519.rs
  - tools/oracle/src/helpers/core_ops/b3519/**
  - crates/betterlite-models/src/sandbox_dispatch/**
  lint_tables: false
