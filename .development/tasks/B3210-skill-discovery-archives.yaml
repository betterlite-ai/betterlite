    why: Module constants, timestamps and frozen dataclass definition.
dod:
  - text: >-
      SkillArchive exposes content (bytes), digest (str with "sha256:" prefix and lowercase hex),
      and optional declared_name and declared_description fields.
    proof: [archive-structure-tests]
  - text: >-
      The builder accepts uploaded ZIP bytes, validates member count (≤ 1000), unpacked size (≤ 50 MiB),
      detects a common root folder, and flattens paths by stripping that root.
    proof: [archive-structure-tests]
  - text: >-
      Paths are normalized by rejecting null bytes, backslashes, leading slashes, drive letters and . or .. segments;
      duplicate flattened names are rejected.
    proof: [archive-structure-tests, archive-path-normalization-oracle]
  - text: >-
      The builder requires SKILL.md at the archive root and returns None when it is missing,
      when a ZIP read fails, or when member validation fails.
    proof: [archive-structure-tests]
  - text: >-
      SKILL.md frontmatter is YAML between --- delimiters; malformed YAML or non-dict results are treated as empty.
      Field values are stripped of whitespace; empty strings become None.
    proof: [archive-manifest-parsing-oracle]
  - text: >-
      Repacked ZIP entries use 1980-01-01 timestamps, deflate compression, 0o644 << 16 external attributes,
      and are sorted by flattened name.
    proof: [archive-digest-reproducibility, archive-zip-corpus]
  - text: >-
      The digest is the literal "sha256:" prefix followed by the lowercase hex SHA-256 of the repacked archive bytes.
    proof: [archive-digest-reproducibility]
  - text: >-
      Helper-oracle cases exercise the full archive pipeline and compare SkillArchive output
      against the pinned Python implementation.
    proof: [helper-python, helper-case-corpus]
  - text: >-
      The ZIP/frontmatter fuzz target has a committed nonempty corpus and replays successfully.
    proof: [archive-zip-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: archive-structure-tests
      why: archive structure, validation or flattening tests fail or the filter selects no tests
      run: >-
        cargo nextest run --locked -p betterlite-http --no-tests=fail -E
        'test(/^skill_archive::/) - test(/replays_the_/)'
    - id: archive-path-normalization-oracle
      why: path normalization cases are missing, malformed or fail
      run: >-
        test -d tools/oracle/cases/helpers/skill-archive &&
        grep -rlq 'path.*normaliz\|backslash\|drive' tools/oracle/cases/helpers/skill-archive &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/skill-archive
    - id: archive-manifest-parsing-oracle
      why: frontmatter parsing cases are missing, malformed or fail
      run: >-
        grep -rlq 'frontmatter\|manifest\|yaml' tools/oracle/cases/helpers/skill-archive &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/skill-archive
    - id: archive-digest-reproducibility
      why: digest format case is missing, does not assert "sha256:" prefix, or archive bytes diverge from LiteLLM
      run: >-
        grep -rlq 'sha256:' tools/oracle/cases/helpers/skill-archive &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/skill-archive
    - id: archive-zip-corpus
      why: the ZIP fuzz target or nonempty committed corpus is missing, or corpus replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-http/fuzz/corpus/skill_archive_zip)" &&
        test -f crates/betterlite-http/fuzz/fuzz_targets/skill_archive_zip.rs &&
        test -n "$(ls -A crates/betterlite-http/fuzz/corpus/skill_archive_zip)" &&
        cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(replays_the_skill_archive_zip_corpus)'
    - id: helper-python
      why: the oracle adapters are missing, unchanged, or fail strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" &&
        grep -rlq 'build_skill_archive' tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: helper cases are missing, the shared fuzz corpus is not updated, or corpus replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
        grep -rlq 'skill_archive\|build_skill_archive' tools/oracle/fuzz/corpus/helper_case &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

