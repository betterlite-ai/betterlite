out_of_scope:
  - Archive serving, discovery routes and index composition belong to B078.
  - URL composition and manifest text joining belong to B3211.
  - Stored skill reads and database queries belong to B3212.

pitfalls:
  - 'The oracle helper for this task is pre-registered as skill_discovery_archives in the http group. Replace the stub Op in tools/oracle/src/helpers/http/skill_discovery_archives.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/skill_discovery_archives.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - "The digest field is the literal string \"sha256:\" (with colon) followed by the lowercase hex SHA-256; neither the prefix nor the hex are optional."
  - "Path normalization must reject paths with null bytes, backslashes, leading slashes, Windows drive letters, and . or .. segments before checking for duplicates."
  - "A single-folder upload is detected by finding a common root prefix among all flattened paths; if all paths start with \"folder/\", the prefix is \"folder/\", not \"folder\"."
  - "YAML frontmatter parsing must tolerate decode errors with replacement and non-dict results; both become empty frontmatter."
  - "Frontmatter field values are stripped of whitespace after retrieval; a field containing only whitespace becomes None, not an empty string."
  - "ZIP entries are repacked in sorted order by flattened name; sort stability matters for reproducible digests."
  - "The 1980-01-01 timestamp is final; any deviation breaks digest reproducibility and the published index."
  - "Member count includes all nondirectory entries in the uploaded ZIP; directories are never counted."
  - "Unpacked size is the sum of file_size from ZipInfo, not the sum of actual decompressed bytes read."
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
