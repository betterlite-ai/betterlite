id: B3210
title: Build reproducible installable skill archives
description: >-
  Build SkillArchive in betterlite-http::skill_archive, a pure decoder/repacker that accepts
  a stored ZIP upload and returns archive bytes, SHA-256 digest, and optional manifest fields.
  The archive is rebuilt with fixed timestamps (1980-01-01), deflate compression, and 0o644 << 16
  external attributes to ensure reproducible digests. The digest field is the literal string
  "sha256:" followed by the lowercase hex SHA-256 digest of the archive bytes.

  The parser validates and flattens a single-folder upload where every file sits under one
  top-level directory: strip that root and rebuild the ZIP so discovery clients read SKILL.md
  from the archive root. Preserve safe path normalization (reject null bytes, backslashes,
  leading slashes, drive letters, and . or .. segments), detect one-folder layouts by finding
  a common root prefix, and tolerate malformed YAML frontmatter as empty metadata. Reject archives
  with more than 1,000 nondirectory entries, more than 50 MiB unpacked bytes, unsafe paths,
  or duplicate flattened names. Require the root SKILL.md; return None for any caught ZIP read
  failure, missing SKILL.md or duplicate/unsafe member names.

  Manifest frontmatter is YAML between --- delimiters at the start of SKILL.md; decode with
  replacement, strip whitespace from field values and return None for empty strings. Expose
  SkillArchive::content (bytes), digest (str), declared_name and declared_description (both str | None).

  Add independent helper-oracle comparisons through B171's HelperCall dispatch with build_skill_archive
  as a pure helper operation. The operation is already registered with Rust and Python adapters, a new corpus seed directory,
  and cases covering ZIP structure validation, frontmatter parsing, path flattening and digest
  reproducibility. Add a production ZIP/frontmatter fuzz target to crates/betterlite-http/fuzz
  and replay its corpus through the archive builder.

scope:
