    - Cargo.toml
    - crates/betterlite-http/Cargo.toml
    - crates/betterlite-http/src/skill_archive.rs
    - crates/betterlite-http/src/skill_archive/**
    - crates/betterlite-http/fuzz/fuzz_targets/skill_archive_zip.rs
    - crates/betterlite-http/fuzz/corpus/skill_archive_zip/**
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/http/skill_discovery_archives.rs
    - tools/oracle/src/helpers/http/skill_discovery_archives/**
    - tools/oracle/helpers/skill_discovery_archives.py
    - tools/oracle/helpers/skill_discovery_archives/**
    - tools/oracle/fuzz/corpus/helper_case/**
    - tools/oracle/cases/helpers/skill-archive/**
  lint_tables: false
