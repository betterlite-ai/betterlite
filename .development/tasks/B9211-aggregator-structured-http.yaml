id: B9211
title: Exercise aggregator Responses, decisions and search through the proxy
description: >-
  Add the HTTP evidence absent from B5832, B5834, B5836, B6080 and B6100's helper suites.
  B8310 and B8311 construct their configs but list only chat and embedding HTTP cases;
  B8634 mounts search and decisions with authentication and invalid-body proofs only.
  Write eight HTTP fixtures in tools/oracle/cases/http/aggregator-structured, using these
  already assigned transports and mounts. No native function, shared registry or Python
  helper is changed. The referenced provider code is context for the cases, with zero
  new implementation lines owned here; approximately 750 fixture lines are expected.

  The four Responses cases use a configured master key and model_list deployments with
  explicit dummy api_key and mock api_base. Set router_settings.num_retries to zero and
  return complete, deterministic OpenAI Responses objects, including fixed ids, model,
  created_at, output and usage. fireworks-responses-folding uses
  fireworks_ai/accounts/fireworks/models/llama-v3p1-8b-instruct, instructions plus leading
  developer/system input and a final user message. Assert the captured instructions join
  and resource name. perplexity-responses-preset uses perplexity/preset/fast-search with
  an input message lacking type: the upstream gets preset fast-search, type message and
  /v1/responses, with no model key. openrouter-responses-auth uses
  openrouter/anthropic/claude-3.5-sonnet and confirms /responses and the configured Bearer
  key, without chat's HTTP-Referer or X-Title headers. edenai-responses-cost uses
  edenai/openai/gpt-4.1-nano and a nonzero numeric usage.cost; retain the returned usage
  and compare the x-litellm-response-cost header. Each case includes an
  upstream error step with a valid provider error body, comparing the resulting status,
  error type, param and code rather than assuming a bare provider exception is the client
  envelope. Keep /error/message ignored solely because betterlite supplies its own words.

  Responses create aliases are POST /v1/responses, /responses and /openai/v1/responses.
  Spread them across the four cases. B080 owns these paths and the response-id wrapping;
  use narrow ignores for process-generated ids only, and keep output, usage and upstream
  JSON compared. GET and DELETE Responses operations stay with their route tests; this
  task is the missing provider-selection proof for creation, not another lifecycle suite.

  openrouter-decisions uses openrouter/typesafe/jev-1.13; perplexity-decisions uses
  perplexity/pplx-decider-v1-27b; cloudflare-decisions uses cloudflare/@cf/cloudflare/clef.
  Start from the checked pinned integration examples' predicate, choice and score question
  shapes, with deterministic provider answers. Exercise both public formats: input plus
  questions list for /decisions, and state plus named questions for /systemone. Compare
  the translated answers, usage, upstream model and URL, rather than a helper's intermediate
  record. OpenRouter posts /alpha/decisions and preserves provider usage.cost. Perplexity
  posts /v1/decisions. Cloudflare with a mock base ending /ai/v1 posts
  /ai/run/@cf/cloudflare/clef, sends model clef and unwraps result.answers. The supported
  route pairs are POST /v1/decisions and /decisions, and POST /v1/systemone and /systemone;
  exercise each once across these cases. Add a no-Authorization step with no upstream call
  and retain the exact HTTP auth status and error fields.

  perplexity-search uses a search_tools entry named research, litellm_params.search_provider
  perplexity, a dummy api_key and a mock api_base; query and max_results are client fields.
  Exercise POST /v1/search/research and /search/research with a conflicting body
  search_tool_name to prove the URL-selected tool wins. Also exercise POST /v1/search and
  /search with search_tool_name research. Capture only query and supported optional fields
  upstream at /search, and return one result with a missing title/snippet and one populated
  result so the public defaults are checked. Keep the distinct search credential policy:
  server resolution recognizes PERPLEXITYAI_API_KEY, not the chat fallback
  PERPLEXITY_API_KEY. The fixture uses the tool's explicit key, so neither public credential
  nor environment fallback is needed. Include one mock 429 with retries disabled.

  All bases stay inside the harness. Use the current HTTP schema, not SDK HTTP or helper
  operations. Client content-type and captured upstream authorization/content-type are
  compared by value; absence of the OpenRouter chat-only headers is compared too. Do not
  ignore complete error, usage, answers, results or upstream-body subtrees. The existing
  oracle decoders handle every fixture; this work requires no parser fuzz target.
scope:
  paths:
    - tools/oracle/cases/http/aggregator-structured/**
  lint_tables: false
