    why: B5832's folding, authorization and resource-name transform exercised over HTTP.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/responses/transformation.py#L25-L125
    why: B5834's preset request and native Responses URL.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/responses/transformation.py#L32-L77
    why: B6080's Responses key and URL differ from its chat policy.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/responses/transformation.py#L29-L80
