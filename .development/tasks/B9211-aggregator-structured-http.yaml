    why: B8276's two format pairs, already mounted by B8634.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/search_endpoints/endpoints.py#L17-L240
    why: Four search aliases and the named tool overwrite before dispatch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/integration/translation/decisions/bases/openrouter.py#L7-L73
    why: Accepted question and provider answer shapes at the pin.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/integration/translation/decisions/bases/cloudflare.py#L7-L61
    why: The Cloudflare model and result envelope used by the HTTP fixture.
dod:
  - text: Four native aggregator Responses configs are selected by real creation routes, with distinct upstream payloads and matching handled errors.
    proof: [responses-cases, oracle]
  - text: OpenRouter, Perplexity and Cloudflare decisions succeed through both public formats and preserve their provider URLs and response projections.
    proof: [decisions-cases, oracle]
  - text: Perplexity named search wins over a conflicting body name, fills missing result fields and returns the pinned rate-limit envelope.
    proof: [search-case, oracle]
checks:
  optional: []
  commands:
    - id: responses-cases
      why: All four distinct Responses provider proofs must be added before this task can pass.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/aggregator-structured)" && test -f tools/oracle/cases/http/aggregator-structured/fireworks-responses-folding.yaml && test -f tools/oracle/cases/http/aggregator-structured/perplexity-responses-preset.yaml && test -f tools/oracle/cases/http/aggregator-structured/openrouter-responses-auth.yaml && test -f tools/oracle/cases/http/aggregator-structured/edenai-responses-cost.yaml
    - id: decisions-cases
      why: A mounted decisions router alone does not prove any of these provider adapters is reachable.
      run: test -f tools/oracle/cases/http/aggregator-structured/openrouter-decisions.yaml && test -f tools/oracle/cases/http/aggregator-structured/perplexity-decisions.yaml && test -f tools/oracle/cases/http/aggregator-structured/cloudflare-decisions.yaml
    - id: search-case
      why: The existing search mount tests never execute a successful Perplexity search.
      run: test -f tools/oracle/cases/http/aggregator-structured/perplexity-search.yaml
oracle_cases:
  - tools/oracle/cases/http/aggregator-structured/fireworks-responses-folding.yaml
  - tools/oracle/cases/http/aggregator-structured/perplexity-responses-preset.yaml
  - tools/oracle/cases/http/aggregator-structured/openrouter-responses-auth.yaml
  - tools/oracle/cases/http/aggregator-structured/edenai-responses-cost.yaml
  - tools/oracle/cases/http/aggregator-structured/openrouter-decisions.yaml
  - tools/oracle/cases/http/aggregator-structured/perplexity-decisions.yaml
  - tools/oracle/cases/http/aggregator-structured/cloudflare-decisions.yaml
  - tools/oracle/cases/http/aggregator-structured/perplexity-search.yaml
deviations: []
out_of_scope:
  - Every method and helper in the referenced transforms stays with B5832, B5834, B5836, B6080 or B6100; B8310 and B8311 keep all provider construction and dispatch code.
  - B080 owns Responses handlers, B8275 search handlers and B8276 decisions handlers; B8634 owns the search/decisions mounts and selectors, with B8610's one area aggregator.
  - B3271 through B3276 own search registration, routing, pricing and transport; B3510 through B3515 own decisions records, translation, preparation and execution.
  - Responses retrieval, deletion, websocket transport and streaming regressions remain with B080 and their existing parts; Eden AI Messages already has B8580 HTTP proofs.
pitfalls:
  - Perplexity preset names replace model in the upstream body, so a generic Responses echo fixture misses the provider transform.
  - Cloudflare's decisions response wraps answers under result while OpenRouter and Perplexity return answers at the root.
  - OpenRouter Responses never adds chat referer defaults; comparing only authorization would miss accidental chat-config selection.
  - Search without a configured named tool can fall through a different routing branch, so the successful case must install research in search_tools.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
