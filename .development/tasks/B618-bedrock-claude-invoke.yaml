deviations:
- what: Never fetch request URLs. A document/image URL requiring local bytes fails with ImageFetchError status 400
    before upstream transport; inline data and descriptors the provider accepts remain supported.
  why: Max must decide whether request URL downloads should be allowed. Preserve local inputs and the no-fetch policy
    while that choice remains open.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/anthropic_claude3_transformation.py#L303-L340
out_of_scope:
- B028 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_claude_invoke in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/claude_invoke.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_claude_invoke.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The tool-search beta is computed from the original tools, while the body uses a renamed and filtered tool list.
- An explicitly supplied user beta bypasses filtering even when the same automatically generated beta would be removed.
