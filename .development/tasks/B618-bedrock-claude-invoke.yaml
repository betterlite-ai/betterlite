    AmazonAnthropicClaudeConfig.transform_request, AmazonAnthropicClaudeConfig.uses_async_transform_request, AmazonAnthropicClaudeConfig.async_transform_request,
    AmazonAnthropicClaudeConfig._build_bedrock_anthropic_request_base, AmazonAnthropicClaudeConfig._compute_bedrock_invoke_beta_headers,
    AmazonAnthropicClaudeConfig._convert_document_url_sources_to_base64, AmazonAnthropicClaudeConfig._normalize_bedrock_tool_search_tools,
    AmazonAnthropicClaudeConfig.transform_response. Other functions in this file remain with the owners listed below.
