id: B618
title: Bedrock Claude chat through Invoke
description: >-
  Add BedrockClaudeRequest override over Anthropic chat transforms, including anthropic_version, model removal,
  beta filtering, effort clamping and tool-search naming. Preserve native output schema and safe response metadata.
  URL document sources that require bytes remain rejected under the open no-fetch decision.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeConfig.custom_llm_provider L67-L68; AmazonAnthropicClaudeConfig.should_strip_billing_metadata
  L70-L71; AmazonAnthropicClaudeConfig.get_supported_openai_params L73-L74; AmazonAnthropicClaudeConfig.map_openai_params
  L76-L139; AmazonAnthropicClaudeConfig._clamp_adaptive_reasoning_effort_for_bedrock L142-L160; AmazonAnthropicClaudeConfig.transform_request
  L162-L189; AmazonAnthropicClaudeConfig.uses_async_transform_request L192-L193; AmazonAnthropicClaudeConfig.async_transform_request
  L195-L209; AmazonAnthropicClaudeConfig._build_bedrock_anthropic_request_base L211-L257; AmazonAnthropicClaudeConfig._compute_bedrock_invoke_beta_headers
  L259-L301; AmazonAnthropicClaudeConfig._convert_document_url_sources_to_base64 L303-L340; AmazonAnthropicClaudeConfig._normalize_bedrock_tool_search_tools
  L342-L365; AmazonAnthropicClaudeConfig.transform_response L367-L394.


  For response_format when supports_native_structured_output is false, map with the temporary claude-3-sonnet-20240229
  catalog model, then restore the original model and remove the generated response-format tool_choice when forced
  tool use is unsupported. Reuse B960 filter_and_transform_beta_headers and its B959 config.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  and list their direct ownership here. Provider leaves must never import betterlite-core, and no copied helper
  algorithm is permitted.


  remote-url-current-rejection supplies an http:// image or PDF URL requiring local bytes and expects ImageFetchError
  status 400 before transport under the current open request-download decision; inject the same failed-download
  seam into the pinned helper. Inline bytes continue to compare normally; provider-forwardable URL descriptors remain
  unchanged where the source forwards them.


  Reuse AnthropicConfig.get_supported_openai_params from B569 (litellm/llms/anthropic/chat/transformation.py); its
  implementation remains with that prerequisite.


  Reuse AnthropicConfig.map_openai_params from B576 (litellm/llms/anthropic/chat/transformation.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicConfig.transform_request from B577 (litellm/llms/anthropic/chat/transformation.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicConfig.transform_response from B580 (litellm/llms/anthropic/chat/transformation.py); its implementation
  remains with that prerequisite.


  Reuse apply_bedrock_invoke_structured_output from B597 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse normalize_custom_field_on_tools from B597 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse normalize_tool_input_schema_types_for_bedrock_invoke from B597 (litellm/llms/bedrock/common_utils.py); its
  implementation remains with that prerequisite.


  Reuse strip_unsupported_bedrock_invoke_output_config_keys from B597 (litellm/llms/bedrock/common_utils.py); its
  implementation remains with that prerequisite.


  Reuse tools_without_eager_input_streaming from B597 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse get_anthropic_beta_from_headers from B599 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse AnthropicModelInfo.forced_tool_use_unsupported from B688 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicModelInfo.translate_legacy_thinking_for_adaptive_model from B688 (litellm/llms/anthropic/common_utils.py);
  its implementation remains with that prerequisite.


  Reuse bedrock_supports_tool_search from B690 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse normalize_bedrock_opus_output_config_effort from B690 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: bedrock_anthropic_version: Provider is bedrock and should_strip_billing_metadata returns
  True. _build_bedrock_anthropic_request_base copies options while removing the twelve B590 authentication fields,
  copies dict output_config before B690 effort normalization, then normalizes tool-search tools and calls B577 AnthropicConfig.transform_request.
  Pop model and stream from the resulting body. Run B597 structured-output and unsupported-output-config helpers,
  set anthropic_version to bedrock-2023-05-31 only when the key is absent (preserve explicit None/empty), then normalize
  tool custom fields/schema types and remove eager_input_streaming with B597. Preserve this order and original output_config
  immutability. adaptive_effort_ceiling: Clamp only when B568 _is_adaptive_thinking_model(model,bedrock) is true
  and raw params.reasoning_effort is a string. Run B690 normalize_bedrock_opus_output_config_effort on {effort:value}
  and write its resulting effort back into the original non_default_params. Preserve nonstring/unknown efforts and
  models without an applicable ceiling as B690 does. The separate output_config copy is clamped again during body
  construction; use the same ceiling cases as B600/B622. bedrock_beta_filter: Read user beta values through B599
  and form a set. Build auto betas with B568 get_anthropic_beta_list using provider=bedrock,prompt_caching_set=False
  and the original tools/messages/options for computer,file-id,MCP,mid-conversation-output and display-updates flags.
  For tool search without programmatic calling or input examples, discard advanced-tool-use-2025-11-20 and add tool-search-tool-2025-10-19
  only when B690 supports it. Eager-input streaming adds fine-grained-tool-streaming-2025-05-14. Run B960 filter_and_transform_beta_headers
  only on auto values not explicitly supplied by the user, then return sorted union with the untouched user set.
  Thus user betas bypass automatic filtering and survive a discard/rewrite. Emit anthropic_beta only for a nonempty
  computed list; otherwise preserve any existing body value. tool_search_tool_name: For falsey or non-list tools
  return the same options unchanged. Otherwise preserve order, silently drop tool_search_tool_bm25_20251119, copy
  tool_search_tool_regex_20251119 to type=tool_search_tool_regex and default a missing name to tool_search_tool_regex
  (retain explicit None/empty), and retain other tool records. Write the new list back into the supplied options;
  malformed nonmapping entries propagate their error. There is no warning for BM25 removal. inline_document: Document
  traversal ignores non-list messages/content, non-dict messages/blocks/sources, non-document blocks, sources whose
  type is not url, and URLs that are not strings. A URL ending case-insensitively in .pdf supplies application/pdf
  to B183 conversion; a query suffix prevents that inference. The source post-download rewrite replaces source with
  only type=base64,media_type,data while retaining other block fields. Successful URL acquisition itself is excluded
  by the declared no-fetch deviation; inline base64 documents stay unchanged and are tested normally. claude_response_usage:
  Delegate the entire response to B580 AnthropicConfig.transform_response with the same model/raw response/preallocated
  response/logging/request_data/messages/options/litellm_params/encoding/api_key/json_mode. Use B580 response, usage,
  metadata and error cases unchanged; no second Bedrock decoder or new status mapping belongs here. response_format_tool_stub:
  Use B569 supported options. Capture requested thinking display updates through B568 before any mapping. If response_format
  is present and B688 supports_native_structured_output(model,bedrock) is false, give B576 the temporary model claude-3-sonnet-20240229.
  Clamp reasoning_effort using the original model first, map options, then B688 translates legacy thinking using
  the original model. If updates were requested and translated thinking is a dict with type=adaptive, replace it
  with exactly {type:adaptive,display:updates}, dropping other thinking fields. forced_tool_choice_removed: After
  restoring the original model, remove mapped tool_choice only when response_format is present, tool_choice is a
  dict named json_tool_call, and B688 forced_tool_use_unsupported(original_model) is true. Other names, non-dicts
  and ordinary requests retain the choice. async_media_order: uses_async_transform_request returns True. Async first
  invokes B183 async_inline_remote_media on messages, then calls this same synchronous transform; errors from inlining
  occur before option/body processing. Sync builds the body before document-URL conversion, then computes beta values.
  Compare those mutation/failure boundaries without making remote calls.


  The existing remote_url_current_rejection oracle row uses a blocked loopback URL at B183 and compares ImageFetchError
  status 400 before transport. Add standalone Rust test claude_invoke_never_fetches_request_urls for an otherwise
  valid public HTTP/PDF URL: assert the same typed rejection and zero outbound attempts. This second test proves
  the declared policy difference and is not a Python remote-fetch oracle.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-bedrock/src/claude_invoke.rs with adjacent tests under claude_invoke/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function claude_invoke_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  bedrock_anthropic_version, adaptive_effort_ceiling, bedrock_beta_filter, tool_search_tool_name, inline_document,
  claude_response_usage, response_format_tool_stub, forced_tool_choice_removed, remote_url_current_rejection, async_media_order.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_claude_invoke* using HelperCase: kind:
  helper and the externally tagged bedrock_claude_invoke variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_claude_invoke that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 277 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 290 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 725 planned, 725 maximum changed lines.
