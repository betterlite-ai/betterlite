  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/claude_invoke.rs
  - crates/betterlite-bedrock/src/claude_invoke/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/claude_invoke.rs
