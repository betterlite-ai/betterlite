id: B671
title: OpenAI assistants and session operation composition
description: >-
  Install assistants, threads/runs, Decisions and realtime session preparation through the provider operation enum,
  forwarding the typed result and errors from the leaf adapters.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Install these completed leaf operations: B519 OpenAI assistant definitions; B520 OpenAI thread and message operations;
  B521 OpenAI thread runs and run streams; B524 OpenAI Decisions intermediate representation; B528 OpenAI realtime
  connection and session requests. Each dispatch fixture must reach its leaf with a fake transport and assert the
  resulting request or reply; accept already normalized settings and reuse leaf errors.


  Named case contracts: assistants: Parameterize B519 assistant create/list/delete, preserving beta headers and
  pagination defaults. threads: Parameterize B520 thread create/retrieve and message create/list; preserve its literal
  header and thread/message body policy. runs: Parameterize B521 buffered and streaming runs, sync/async facade
  variants and tool submission where that leaf exposes it; keep stream and buffered result variants distinct. decisions:
  Call B524 request and response IR projection through executable dispatch with its resolved base URL and API key.
  realtime_session: Call B528 realtime URL/header/session preparation with fixture transport; preserve query handling,
  required headers, event normalization and connection failure.


  Each parameterized operation uses a distinct fixture row in the named case file and reaches the existing leaf
  production entry point. The composition layer introduces no new defaults, headers, errors, parsers or config keys:
  leaf-owned outcomes and warnings pass through unchanged. Test at least one leaf error per family to detect accidental
  conversion to unsupported_operation. No HTTP route is registered or called by these helper cases.


  Implement crates/betterlite-provider/src/openai_assistant_dispatch.rs with adjacent tests under openai_assistant_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation openai_assistant_dispatch in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_assistant_dispatch_cases in betterlite-provider with these exact named cases (one
  per oracle file): assistants, threads, runs, decisions, realtime_session. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_assistant_dispatch* using HelperCase:
  kind: helper and the externally tagged openai_assistant_dispatch variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_openai_assistant_dispatch that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone openai_assistant_dispatch_unsupported_operation in betterlite-provider for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 155 production lines, 210 behavior/config-test lines, 145 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 550 planned, 550 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
