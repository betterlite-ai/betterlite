checks:
  optional:
  - mutants
  commands:
  - id: case-assistants
    why: Parameterize B519 assistant create/list/delete, preserving beta headers and pagination defaults.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_assistant_dispatch_cases::case_[0-9]+_assistants$/)'
  - id: case-threads
    why: Parameterize B520 thread create/retrieve and message create/list; preserve its literal header and thread/message
      body policy.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_assistant_dispatch_cases::case_[0-9]+_threads$/)'
  - id: case-runs
    why: Parameterize B521 buffered and streaming runs, sync/async facade variants and tool submission where that
      leaf exposes it; keep stream and buffered result variants distinct.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_assistant_dispatch_cases::case_[0-9]+_runs$/)'
  - id: case-decisions
    why: Call B524 request and response IR projection through executable dispatch with its resolved base URL and
      API key.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_assistant_dispatch_cases::case_[0-9]+_decisions$/)'
  - id: case-realtime-session
    why: Call B528 realtime URL/header/session preparation with fixture transport; preserve query handling, required
      headers, event normalization and connection failure.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_assistant_dispatch_cases::case_[0-9]+_realtime_session$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_assistant_dispatch.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_assistant_dispatch*")"
      && grep -lq 'openai_assistant_dispatch' tools/oracle/fuzz/corpus/helper_case/openai_assistant_dispatch* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_assistant_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_assistant_dispatch_unsupported_operation$/)'
