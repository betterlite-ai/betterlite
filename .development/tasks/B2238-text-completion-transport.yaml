out_of_scope:
- B2237 owns transformations and config selection; B202/B203 own route registration and public text/chat bridges.
  B005 owns streaming chunk conversion and B004 owns SDK JSON decoding.
pitfalls:
- 'The oracle helper for this task is pre-registered as text_completion_transport in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/text_completion_transport.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/text_completion_transport.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Buffered async resolves its HTTP client through BaseOpenAILLM, while async streaming uses aclient_session directly;
  only the former can select network_mock automatically.
