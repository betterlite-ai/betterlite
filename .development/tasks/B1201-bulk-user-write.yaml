dod:
  - text: 'Pure cases row_contract_defaults_and_ignored_extras, payload_all_fields_and_defaults, payload_callback_encryption_and_original_fallback,
      reset_only_for_truthy_duration, assignment_first_seen_order, metadata_budget_string_only,
      row_teams_requested_order and exception_message_shapes compare exact values. Native cases
      bounded_ten_preserves_order_and_exception_values, empty_batch_no_io, payload_error_before_insert,
      lost_response_all_landed_succeeds, partial_landed_ids_conflict, non_infrastructure_all_landed_conflict,
      failed_readback_no_retries, retry_failures_after_taken, metrics_missing_or_error_continue,
      eviction_error_warns and failed_detach_retains_stale_teams exercise all recovery paths.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'postgres_pinned_rows covers lock-before-read, sequential budget resolution, duplicate new roster
      assignments, skip-duplicate membership inserts, all-existing roster rewrites and requested added IDs.
      postgres_failure_effects injects failures at each transaction write and compensation update, proving
      team rollback, earlier user persistence and warning-only post-commit failures.'
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bulk_user_write::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/bulk_user_write.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bulk-user-write-*")"
        && grep -rlq "bulk_user_write" tools/oracle/fuzz/corpus/helper_case/bulk-user-write-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/bulk_user_write::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/bulk_user_write::tests::postgres_failure_effects$/)'
oracle_cases:
  - tools/oracle/cases/helpers/bulk-user-write/payload-fields-and-defaults.yaml
  - tools/oracle/cases/helpers/bulk-user-write/assignment-order.yaml
  - tools/oracle/cases/helpers/bulk-user-write/row-team-outcomes.yaml
  - tools/oracle/cases/helpers/bulk-user-write/error-message-shapes.yaml
deviations: []
out_of_scope:
  - B893 owns metadata_json_with_limits and delegates callback encryption to B2304; this writer stores its returned string.
  - 'litellm/proxy/management_helpers/bulk_user_creation.py: B793 owns _requested_teams (L195-L201), _row_error
    (L204-L218), _normalized_email (L221-L222), _partition_rows (L225-L257), _existing_user_conflicts
    (L264-L280), _load_teams (L283-L287), _team_permission_error (L290-L293), _unusable_teams (L296-L315),
    _db_failure (L318-L334), _prepare_user (L337-L348), _generate_key (L669-L675), _add_to_organizations
    (L678-L689), _run_per_user (L692-L699), _write_audit_logs (L702-L732), _to_result (L748-L756), _failure_result
    (L759-L760), bulk_create_users (L763-L863).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - A partial landed set after a lost bulk-insert response is treated as conflicting users, not credited to this request.
  - An existing roster member still appears in added and triggers spend-cache invalidation.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
