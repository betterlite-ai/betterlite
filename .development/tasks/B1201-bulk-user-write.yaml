dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: partial_insert, roster_transaction,
      failed_team_detached, postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bulk_user_write::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/bulk_user_write.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bulk-user-write-*")"
        && grep -rlq "bulk_user_write" tools/oracle/fuzz/corpus/helper_case/bulk-user-write-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/bulk_user_write::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/bulk_user_write::tests::postgres_failure_effects$/)'
