id: B1201
title: Bulk user insert and locked team roster writes
description: >-
  Execute prevalidated bulk user inserts and locked team roster assignments with bounded batches and typed
  per-row results. Preserve source failure compensation and failed-team detachment; never promise
  one transaction for the complete bulk request. Return ordered write outcomes to B793 for per-user key/org
  follow-up.

  Own the lower write-side contracts and constants at L75-L166, _ERROR_DETAIL/_JSON_OBJECT at L175-L176,
  _UserCreateData L351-L372 and membership/roster/teams payload declarations L487-L498. B793 constructs these
  contracts; this module never calls its orchestration. Reuse B790's BulkNewUserItem/NewUserRequestTeam.
  _UserRow ignores extra fields, requires user_id, defaults spend to 0.0 and every other optional field to
  None; retain all declared fields, including generation-only duration/key_alias/aliases/config/permissions,
  blocked/agent_id/budget_fallbacks/budget_limits/organizations for B793's subsequent work.

  The insert payload carries user_id, user_email, user_alias, user_role, team_id, max_budget, spend,
  models, metadata, max_parallel_requests, tpm_limit, rpm_limit, budget_duration, budget_reset_at,
  allowed_cache_controls, sso_user_id, object_permission_id, teams and model_max_budget. Falsey spend
  becomes 0.0; falsey models/cache controls become empty arrays; falsey model_max_budget becomes the JSON
  string "{}". Teams retain pending request order. Only truthy budget_duration calls B2317's reset-time
  helper. Metadata goes through B893.metadata_json_with_limits with all seven limit/guardrail/policy/prompt
  overrides and its B2304 callback encryption, including the pinned silent original-value fallback on
  encryption failure. Preparation of all payloads occurs before the bulk-insert try block, so a bad payload
  aborts without starting an INSERT. There is no organization field or key creation in this payload.

  Empty input returns two empty tuples. One create_many INSERT is attempted; any exception logs
  /user/bulk_new: create_many failed, retrying rows individually. Classify it with B872 and read back all
  requested IDs. An infrastructure error with the entire requested set present counts as success; a partial
  set, or any non-infrastructure error, treats present IDs as conflicts, never as successful partial writes.
  Retry absent IDs individually with BULK_NEW_USER_CONCURRENCY=10. The bounded join captures BaseException
  outcomes in input order. Success rows remain in input order; failures list taken IDs first and retry
  failures second. The conflict text is User id=<id> already exists. HTTPException messages use detail.error
  when detail is a mapping, otherwise the mapping/string detail; other exceptions use their string, even
  empty. A failed readback propagates and does not run row retries.

  Group assignments by first-seen team order and then user/team request order, using pending.user_id and
  row.user_email. In each team's transaction acquire B819's TEAM_ADVISORY_LOCK_SQL before B724's locked
  roster read; missing roster raises Team id=<id> does not exist. Existing truthy roster IDs suppress a new
  entry, but duplicate new assignments are not deduplicated against each other. Resolve new member budgets
  sequentially through B862, with the supplied max_budget_in_team, team's default_team_member_models or
  None, budget_duration=None and metadata.team_member_budget_id if it is a string, including empty string.
  Truthy malformed metadata fails validation; falsey metadata and non-string budget IDs give None.
  Construct roster Member records through B859. Insert memberships with skip_duplicates=true, then
  rewrite the roster as old members followed by new
  members, even if there were no new members. Commit before returning all submitted user IDs in added,
  including already-present members. Any transaction exception logs and returns empty after/added with
  Failed to add user to team <id>: <message> for each affected ID; budget/membership/roster writes roll back,
  while earlier user inserts remain.

  _row_teams returns landed teams and failures in requested order; a missing write entry is an error.
  Detach failed teams by updating user.teams only when its landed tuple differs from the requested tuple,
  at concurrency 10. Failed compensation warns with the exception class and leaves the stale tuple.
  Publish B111 team-member metrics first for writes with added members when a logger exists, using the
  full after roster. Metric exceptions debug-log and continue. Then invalidate B734 member spend state
  for every added ID at concurrency 10; eviction failures warn with the class and do not undo writes.


  Build the production bulk_user_write module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/bulk_user_creation.py:
  _user_table (L260-L261; 2 source lines), _user_create_payload (L375-L408; 34 source lines), _bounded
  (L411-L418; 6 source lines), _insert_users (L421-L469; 48 source lines), _assignments_by_team (L472-L484;
  13 source lines), _default_member_budget_id (L501-L510; 10 source lines), _team_tx_db (L513-L514; 2
  source lines), _membership_tx_db (L517-L518; 2 source lines), _write_team_roster (L521-L581; 61 source
  lines), _detach_failed_teams (L584-L601; 18 source lines), _publish_team_writes (L604-L630; 27 source
  lines), _error_message (L185-L192; 8 source lines), _row_teams (L735-L745; 11 source lines).


  B856 Management::users exposes only the pure payload, grouping, row-team and error-message helpers to
  the oracle. Invoke the pinned functions with fixed time and compare complete payloads and messages;
  seed B171 helper_case. Stateful insert, transaction, compensation and publication tests invoke the native
  service with real Postgres and controlled metric/cache failures; no helper case impersonates a route.


  Bulk insert and roster tests require the B860 fixture against POSTGRES_TEST_URL or, when unset,
  testcontainers. Use independent schemas for each readback/compensation scenario and fail if Postgres
  is unavailable. postgres_pinned_rows and postgres_failure_effects assert the durable rows specified below.


  Sizing adds approximately 100 contract/declaration lines to the 242 helper lines before docstring
  exclusion: allow 345 production, 350 transaction/concurrency tests, 55 pure adapters and 30 wiring,
  totaling 780 within 800. Shared row/request decoding stays with B714/B790; no new byte parser or setting.
