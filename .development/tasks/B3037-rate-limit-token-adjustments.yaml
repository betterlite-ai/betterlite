id: B3037
title: Token counter adjustments and reservation deltas
description: >-
  Build token delta operations and apply them with TTL preservation, optionally guarded by the original
  reservation window/backend. Keep positive-only fallback after a failed Redis window guard on the Redis side,
  and the source post-call pipeline failure behavior.

  Token adjustments flow through two paths: a direct increment-with-TTL path for fresh token counts, and a
  window-guarded path for reservation-aware reconciliation. The window-guarded path verifies that the
  reservation window is still active (expected_window_start matches the active window); if verification fails
  on Redis, fall back to a positive-only increment; if verification fails on the local backend, skip the
  increment entirely with no fallback.

  Build two Lua operations: one for preserving existing TTL by checking if a key already has a TTL before
  setting one, and one for atomically checking window validity before incrementing, returning the success
  flag and new counter value. Implement direct script execution grouped by hash tag for Redis cluster
  compatibility, and defer execution through the active_post_call_redis_batch when available, falling back
  to regular pipeline on any error.

  Implement reservation-aware operations in three flavors: direct increment-with-TTL for fresh counts, a
  Redis-backed path for window-guarded operations that validates window identity, and a local-backend path
  for in-memory guarded operations. Route operations to the appropriate applier based on reservation_backend.

  Build project-scoped reservation deltas in two builders: one for simple TPM reconciliation computing
  actual-minus-reserved adjustments only for reserved scopes, and one for project input/output token scopes
  that emits window-guard metadata when the window identity is known.
scope:
