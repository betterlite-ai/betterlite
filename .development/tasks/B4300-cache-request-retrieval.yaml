out_of_scope:
- LiteLLM's `litellm.get_llm_provider` and model/provider resolution; consumed from B174's owned implementation.
- Streaming response conversion and playback; owned by B4302.
- Cache hit logging and callback dispatch; owned by B4301.
- Dynamic cache object construction (memory vs Redis tier selection); owned by B4293.
- Cached embedding response assembly and token merge logic; owned by B4303.
- Request payload assembly and structured response objects; consumed from B004/B005/B189.
- OTel span parent lookup helper; assigned to B110 by existing inventory.
pitfalls:
- Preset cache key computation uses the request's `cache_key` parameter if present, falling back to computing from request kwargs. The preset key is not the embedding-specific per-input key; the two are distinct and must not be confused in cache stamping or retrieval.
- Embedding format validation rejects any cached entry whose format_version does not match EMBEDDING_CACHE_FORMAT_VERSION exactly; partial-version upgrades are not attempted, preserving freshness.
- Calling `_drop_logging_obj_from_kwargs` copies the kwargs dict when litellm_logging_obj is present, so callers must preserve the returned dict through request lifetime to avoid re-parsing or re-computation.
- The sync/async cache read path in _retrieve_from_cache checks `cache._supports_async()` to choose between async_get_cache and get_cache, not the context of the handler; fallback to sync read is transparent to the caller.
