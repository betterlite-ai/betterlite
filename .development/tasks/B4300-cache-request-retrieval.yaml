id: B4300
title: Normalize cache requests and retrieve embedding hits
description: >-
  Build per-request cache state, positional-argument projection and supported-call/store eligibility.
  Retrieve per-input embedding hits, reject stale-format entries and retain the request's preset key
  without keeping a logging-object reference cycle. The CachingHandler holds request kwargs with
  logging objects removed, stores preset cache keys for stream-path re-use, and projects positional
  arguments into kwarg form matching the original function signature. Cache eligibility filters by
  supported call type (completion, embedding, text_completion, transcription, rerank) and cache
  modes (no-cache, no-store controls). For embeddings, retrieve cache hits per input, filter by
  format version (embedding_cache_format_version=2), and return which inputs still need fresh
  lookups. The handler composes memory-store initialization, preset-key tracking and dual-cache
  construction when Redis is available, preserving the handler's lifetime across streaming and
  sync/async dispatch boundaries. No reference cycle to logging objects or stored results.
