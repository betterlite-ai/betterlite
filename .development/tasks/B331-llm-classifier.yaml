id: B331
title: LLM, heuristic-first and hybrid complexity classifiers
description: Add the external classifier request/response path over B014 using B330 context, pinned rubrics
  and custom tier prompt configuration. Implement the typed classifier result parser, bounded timeout/circuit
  state and heuristic/default fallback outcome. Support llm, heuristic_first and hybrid dispatch using
  B328 evidence rather than a new score heuristic. Forward B012 redaction and caller attribution and expose
  classifier cost as Decimal. Use only configured classifier deployment names, never a URL taken from
  request text. Use the existing Rust crate boundaries from B004 and B008; integrate through the server
  when the provider dispatcher or callbacks live in another core crate. This task's source slices are
  the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target
  and committed corpus for every newly accepted config form; unsupported keys still fail by full path.
  Add a cargo-fuzz target classifier_reply under crates/betterlite-router/fuzz and a normal replays_the_classifier_reply_corpus
  test using the production parser. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/llm-classifier/**
  - tools/oracle/src/router_probes/llm-classifier/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/llm_classifier.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L218-L464
  why: Prompt/rubric construction and private verdict handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L1164-L1209
  why: Circuit admission and failure state.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L1958-L2017
  why: Heuristic-first and hybrid decisions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2254-L2299
  why: Failure outcome.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2444-L2500
  why: LLM tier parsing.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2628-L2700
  why: Internal classifier call accounting.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/classification_rubrics.py#L1-L142
  why: Pinned rubrics and calibration examples.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(llm_classifier)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/classifier_reply.rs && test -n "$(ls -A crates/betterlite-router/fuzz/corpus/classifier_reply)"
      && cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_classifier_reply_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/llm-classifier/llm-valid-tier.yaml
- tools/oracle/cases/routing/llm-classifier/custom-tier-label.yaml
- tools/oracle/cases/routing/llm-classifier/malformed-tier-fallback.yaml
- tools/oracle/cases/routing/llm-classifier/heuristic-first-needs-signal.yaml
- tools/oracle/cases/routing/llm-classifier/hybrid-boundary-margin.yaml
- tools/oracle/cases/routing/llm-classifier/image-forces-classifier.yaml
- tools/oracle/cases/routing/llm-classifier/timeout-opens-circuit.yaml
- tools/oracle/cases/routing/llm-classifier/half-open-single-call.yaml
- tools/oracle/cases/routing/llm-classifier/redacted-cost-attribution.yaml
deviations: []
out_of_scope:
- Capability/llm_v2 forecast formats (B332 and a separate follow-up part).
- Python classifier plugins (B021).
pitfalls:
- Classifier cost belongs to the caller even when the classifier fails or the main route changes.
- No-signal score zero does not justify the heuristic-first short circuit.
- Never let a classifier route recursively to itself.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
