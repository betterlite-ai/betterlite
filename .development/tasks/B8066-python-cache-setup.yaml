  - crates/betterlite-python/src/cache_backends.rs
  - crates/betterlite-python/src/cache_backends/**
  - crates/betterlite-python/python/betterlite/_native_cache_backends.pyi
  - crates/betterlite-python/Cargo.toml
  - Cargo.lock
  - crates/betterlite-python/python/betterlite/caching/**
  - crates/betterlite-python/tests/test_cache_setup.py
  - crates/betterlite-python/tests/test_cache_backends.py
  - crates/betterlite-python/tests/fake_redis_server.py
  lint_tables: false
