dod:
- text: "`Cache(...)` for `local`, `redis` and `disk` sets the same public attributes as LiteLLM, including the `ttl` rules and the callback entries added once."
  proof: [cache-setup-init]
- text: "An unsupported `type`, a Redis cluster setting, and a non-default `clock` raise the named errors, and no key or password appears in `repr`."
  proof: [cache-setup-init]
- text: "`enable_cache`, `update_cache` and `disable_cache` leave `betterlite.cache` and the three callback lists as LiteLLM does."
  proof: [cache-setup-switches]
- text: "`InMemoryCache`, `DiskCache`, `RedisCache` and `DualCache` return LiteLLM's values for set, get, increment, delete and ttl, sync and async."
  proof: [cache-setup-backends]
- text: "A user `BaseCache` subclass works as `dynamic_cache_object` of B8065's `get_cache` and `add_cache`."
  proof: [cache-setup-backends]
- text: "`from betterlite.caching import Cache, DualCache, InMemoryCache` works."
  proof: [cache-setup-init]
- text: JSON conversions for every native class parse without an interpreter, and malformed text gives an error, not a panic.
  proof: [cache-setup-native]
- text: The `caching` package passes ruff and strict basedpyright.
  proof: [python-lint]
- text: >-
    This task adds every Cargo.toml dependency it uses and no unused ones.
  proof: [cache-setup-init]
checks:
  optional: []
  commands:
  - id: cache-setup-init
    why: Constructor attributes, errors or exports differ from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cache_setup.py -k "init or import or repr"
  - id: cache-setup-switches
    why: The cache switches leave other state behind.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cache_setup.py -k "enable or update or disable"
  - id: cache-setup-backends
    why: A backend operation differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_cache_backends.py -k ""
  - id: cache-setup-native
    why: A conversion breaks or panics.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^cache_backends::/)'
  - id: python-lint
    why: A strict type error in the caching package.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`s3`, `gcs`, `azure-blob`, `redis-cluster`, `redis-semantic`, `valkey-semantic` and `qdrant-semantic` raise `NotImplementedError`, and their classes are not exported."
  why: Their Rust backends are separate tasks (B4320 and later, B4350 and later, B4380 and later). The error names the type.
- what: "`InMemoryCache` refuses a custom `clock`, and `DiskCache` stores through Rust's disk cache, not the `diskcache` package."
  why: A Python callable cannot drive the Rust cache, and `diskcache` is not a dependency of the wheel. The cache directory layout differs, so a folder written by LiteLLM is not read.
- what: This task has no helper oracle cases.
  why: The pytest files compare both packages, and the backend cases belong to B4290 to B4295.
out_of_scope:
- "Key, lookup and write methods of `Cache` are B8065."
- "`Cache.test_connection` style health checks and the cache settings routes are B4306 to B4309."
- "`DualCache` batch reads and deferred writes (B4294, B4295) are exposed through the same methods LiteLLM has, but their queue rules stay in Rust."
- "`_internal_lru_cache.py` and `Readme.md` of litellm/caching belong to B125's parts."
pitfalls:
- "`enable_cache` does nothing to an existing `betterlite.cache`, and tests must start from `None`."
- "`Cache.__init__` appends to `input_callback` only when `\"cache\"` is missing, and the success lists use the callback manager, so a plain list append is wrong."
- "`ttl` for `local` is overwritten only when `default_in_memory_ttl` is given, and for `redis` only when `default_in_redis_ttl` is given."
- "`DualCache()` with no arguments creates a default `InMemoryCache` and a default `RedisCache`, and the Redis one connects only on first use."
- "A `redis_startup_nodes` list and `REDIS_CLUSTER_NODES` both select cluster mode."
- "A Redis test that skips when `redis-server` is missing checks nothing in CI. Keep every Redis case on the fake server, and have the fake fail the test on a command it does not know."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
