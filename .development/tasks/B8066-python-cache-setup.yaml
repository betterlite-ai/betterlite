id: B8066
title: Python Cache class, cache switches and the local backend classes
description: >-
  Give `betterlite` the cache setup users call: `Cache(...)`, `enable_cache`, `update_cache`, `disable_cache`, `CacheMode`,
  `LiteLLMCacheType`, and the backend classes `BaseCache`, `InMemoryCache`, `DiskCache`, `RedisCache` and `DualCache`. The
  rules are Rust: B4299 configuration and callback lifecycle, B4290 contracts and the memory cache, B4291 disk, B4292 client
  lifecycle, B4293 to B4295 the dual cache. B8065 supplies the operations as the mixin `CacheOperations` and the native
  family `cache` (`NativeCache`). This task adds a second native family `cache_backends` for stand-alone backend handles,
  and the Python classes. `Cache` itself is `class Cache(CacheOperations)`.


  Native family `cache_backends`, as B5659 describes it: `src/cache_backends.rs` with one `register` function, code in
  `src/cache_backends/**`, types in `python/betterlite/_native_cache_backends.pyi`, B5369 declares the `cache_backends` family in `lib.rs` and `_native.pyi` with a stub `register` that this task fills. Pyclasses `NativeMemory`, `NativeDisk`, `NativeRedis` and `NativeDual` are built from JSON settings and have
  `set(key, value_json, ttl)`, `get(key)`, `increment(key, value, ttl)`, `delete(keys)`, `ttl(key)`, `flush()`, `ping()` and
  `close()`, each with an async twin on the Tokio runtime. Conversions sit in `src/cache_backends/convert.rs` with tests named
  `backends_request_` and `backends_result_`.


  Python lives in `python/betterlite/caching/` (the package, not a `_` name, since LiteLLM users import
  `litellm.caching.caching`): `__init__.py` exports by name `Cache`, `LiteLLMCacheType`, `CacheMode`, `DiskCache`,
  `DualCache`, `InMemoryCache`, `RedisCache` and `BaseCache`; `caching.py` holds `Cache`, `CacheMode`, `enable_cache`,
  `update_cache`, `disable_cache` and `print_verbose` (L62); the backend classes are in `in_memory_cache.py`,
  `disk_cache.py`, `redis_cache.py`, `dual_cache.py` and `base_cache.py`. Files stay under 300 lines.


  `Cache.__init__` takes LiteLLM's keyword list in order (L80-L124 of caching.py) and defaults. It picks the backend by `type`:
  `local` gives `InMemoryCache`, `redis` gives `RedisCache` (single node; `redis_startup_nodes` or `REDIS_CLUSTER_NODES`
  raises `NotImplementedError` naming the unbuilt cluster backend), `disk` gives `DiskCache(disk_cache_dir)`. An `_backend`
  argument is used as given. Any other `type` raises `NotImplementedError("... cache type is not built yet")`. It then adds
  `"cache"` to `betterlite.input_callback`, `success_callback` and `_async_success_callback` once, through
  `litellm.logging_callback_manager`-style adders that B5368 provides, and sets the attributes B8065 lists. `ttl` is
  `default_in_memory_ttl` for `local` and `default_in_redis_ttl` for `redis` when those are given (L184-L191), and `namespace`
  goes to Redis. `semantic_cache_scope` is normalised through `SemanticCacheScope` (B4290). It builds a `NativeCache` from the
  same arguments for B8065's methods. Passwords and keys stay out of `repr` and logs.


  `enable_cache(type=LOCAL, host=None, port=None, password=None, supported_call_types=<default>, **kwargs)` adds the three
  callback entries and builds a `Cache` only when `betterlite.cache is None`. `update_cache` always builds a new one.
  `disable_cache` removes the three entries (ignoring `ValueError` for a missing one) and sets `betterlite.cache = None`.
  Their debug lines go through `print_verbose`. `InMemoryCache(max_size_in_memory=200, default_ttl=600, max_size_per_item=1024,
  clock=None)` raises `UnsupportedCallArgument` for a non-default `clock`. `DiskCache(disk_cache_dir=None)` uses
  `.litellm_cache` as default. `DualCache(in_memory_cache=None, redis_cache=None, default_in_memory_ttl=None,
  default_redis_ttl=None, default_redis_batch_cache_expiry=None, default_max_redis_batch_cache_size=...)` composes the
  native handles of its two parts. A user class that subclasses `BaseCache` works as `dynamic_cache_object`.


  Tests build the same objects in LiteLLM and betterlite: `Cache()` attributes, `Cache(type="disk", disk_cache_dir=tmp)`,
  `enable_cache` then `disable_cache` leaving callback lists as before, `update_cache` replacing the cache, the three
  `ttl` rules, an unsupported type, then set/get/increment/delete/ttl on each backend class. The Redis tests run against `tests/fake_redis_server.py`, an in-process RESP server on a thread that this task writes. It answers the commands the backends send (HELLO, CLIENT, SELECT, PING, SET with EX, GET, MGET, INCRBY, EXPIRE, TTL, DEL, FLUSHALL and the pipeline forms) and replies with a RESP error to any other command, so a missing command fails the test. LiteLLM and betterlite connect to the same fake. This is the same idea as the in-process `FakeClient` that the Rust Redis tests use for `AsyncRedisCommands` (crates/betterlite-redis/src/cache_primitives/protocol/tests.rs). No test needs `redis-server` or Docker, and none skips.
scope:
