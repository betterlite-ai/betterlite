id: B3664
title: Guardrail invocation records
description: >-
  Add the module `guardrail_records` to betterlite-guardrails. Every guardrail run in LiteLLM leaves one `StandardLoggingGuardrailInformation` entry in the request's metadata, and DataDog, Langfuse, OTEL and the spend log all read that list. This task builds that entry, cleans the provider's response before it is stored, and replaces the `log_guardrail_information` decorator with a value the caller starts and finishes. It builds on `GuardrailBase`, `GuardrailFailure`, `GuardrailApiInputs` and `GuardrailLogTarget` from B5471. Request bodies are `BTreeMap<String, GuardrailValue>`.

  Types, all with LiteLLM's wire names. `GuardrailStatus` is an enum: `success`, `guardrail_flagged`, `guardrail_intervened`, `guardrail_failed_to_respond`, `not_run`. `GuardrailTracingDetail` (Default) has every field optional: `guardrail_id`, `policy_template`, `detection_method`, `confidence_score: f64`, `classification: GuardrailValue`, `match_details: GuardrailValue`, `patterns_checked: i64`, `alert_recipients: Vec<String>`, `risk_score: f64`, `violation_categories: Vec<String>`, `guardrail_action`, `guardrail_usage: BTreeMap<String, i64>`, `guardrail_cost: Decimal`, `guardrail_cost_by_unit: BTreeMap<String, Option<Decimal>>`, `guardrail_cost_in_spend: bool`. Costs stay `rust_decimal::Decimal` in the struct and are written as JSON numbers by `serialize_with` functions that call `ToPrimitive::to_f64` and `serialize_f64`, because plain Decimal Serialize writes a string and the logging crate reads `guardrail_cost` as a number. `GuardrailRecordMode` (untagged Serialize) is `Event(GuardrailEventHooks)` or `Configured(LitellmParamsMode)`. `GuardrailInvocationRecord` (Serialize) has `guardrail_name`, `guardrail_provider`, `guardrail_mode`, `guardrail_response`, `guardrail_status`, `start_time`, `end_time`, `duration`, `masked_entity_count`, always written even when null, then the tracing fields flattened in and written only when set. `crates/betterlite-logging/src/otel/model/payloads/guardrail.rs` reads the same names.

  `sanitize_guardrail_response(response: GuardrailValue) -> Result<GuardrailValue, GuardrailRecordError>` runs these steps in order. Drop nulls from objects and lists, going at most 20 levels down: the root is level 0, and a value at level 20 is kept as it is, nulls inside included. Then remove the key `secret_fields` from the root when it is an object, and from each object directly inside the root when it is a list. Then call `crate::xecguard_primitives::redaction::redact_match_and_regex_keys`. Then run `serde_json::to_value`, `betterlite_redact::structured::mask_credentials_in_payload` and `serde_json::from_value` back to `GuardrailValue`. Don't reuse `RequestRecordProjection::filter_parameters`, it goes through bytes, and the last paragraph explains why that breaks floats.

  `GuardrailRecordInput` holds the arguments of LiteLLM's `add_standard_logging_guardrail_information_to_request_data`: `guardrail_response: GuardrailValue`, `guardrail_status`, `start_time`, `end_time`, `duration` (`Option<f64>`), `masked_entity_count: Option<BTreeMap<String, i64>>`, `guardrail_provider: Option<String>`, `event_type: Option<GuardrailEventHooks>`, `tracing_detail: Option<GuardrailTracingDetail>`. `GuardrailRecordContext<'a>` groups what stays the same during one run: `base: &'a GuardrailBase`, `request_data: &'a mut BTreeMap<String, GuardrailValue>`, `log_target: Option<&'a mut GuardrailLogTarget>`, `sink: &'a dyn GuardrailSpanSink`. The caller resolves `log_target` once, from the hook's `logging_obj` argument or else the request's logging object.

  `add_guardrail_record(context: &mut GuardrailRecordContext<'_>, input: GuardrailRecordInput) -> Result<(), GuardrailRecordError>` sanitizes the response and builds the record. `guardrail_mode` is `Event` when `event_type` is given, otherwise `Configured` with the base's `event_hook`, or null. It turns the record into a `GuardrailValue` with `to_value` and `from_value`, appends it to the metadata bucket and syncs the log target. Then it calls `sink.emit(&record)` and drops any error at `tracing::debug!`, since a span failure must never touch the request. The metadata bucket is `litellm_metadata` when that key exists in the body, otherwise `metadata`, and a value there that is not an object is replaced by a new empty object. Under the key `standard_logging_guardrail_information`, a missing or null value becomes a one-entry list, a list gets the entry appended, and any other value becomes a list of that value and the entry. `openai_moderation/logging.rs` has its own local write of this key, and B206's helper in betterlite-models works on typed requests, so keep a small private version here.

  `sync_log_target(request_data: &BTreeMap<String, GuardrailValue>, target: &mut GuardrailLogTarget)` copies entries from the bucket to `target.litellm_params` and `target.model_call_params`. Reading never creates the bucket. No bucket or an empty or missing entry list means nothing happens, and a single non-list entry counts as a list of one. Each target that is `Some` gets a `metadata` object when its value is missing or null and a `standard_logging_guardrail_information` list inside it, and an entry is appended only when an equal entry isn't there yet.

  `summarize_guardrail_response(response: Option<&GuardrailValue>, baseline: Option<&BTreeMap<String, GuardrailValue>>, event_type: Option<GuardrailEventHooks>) -> GuardrailValue` keeps user prompts out of the logs. No response gives an empty object. With no baseline, or a response that is not an object, the response is returned as is, so a guardrail's rejection text survives. Otherwise, for `pre_call` the response is first narrowed to the content keys `messages`, `input`, `prompt`, `system`, `instructions`, `tools`, `functions`, `function_call`, `tool_choice`. The two maps are then compared over the union of their keys, without `stream_holdback_chars`, with a missing key equal to null. Any difference gives the text `mask` and none gives `allow`.

  `GuardrailHookName` is an enum of the hooks: `PreCall`, `Moderation`, `PostCallSuccess`, `PostCallStreaming`, `StreamingIterator`, `ApplyGuardrail`. The event type is `pre_call` for `PreCall`, `during_call` for `Moderation`, `post_call` for `PostCallSuccess` and `PostCallStreaming`, and none for the other two. `GuardrailInvocation::begin(hook: GuardrailHookName, request_data: &BTreeMap<String, GuardrailValue>, inputs: Option<&GuardrailApiInputs>, started_at: SystemTime) -> Result<Self, GuardrailRecordError>` runs before the hook and takes the baseline: for `ApplyGuardrail` a copy of `inputs` as a map through `to_value` and `from_value`, for an event type of `pre_call` a copy of the body's content keys, otherwise none. Taking the copy first matters because hooks edit their argument in place. The public field `self_recorded: GuardrailFlag` starts false and replaces LiteLLM's ContextVar, so a concurrent guardrail can't see another's flag.

  `record_own(&mut self, context: &mut GuardrailRecordContext<'_>, input: GuardrailRecordInput)` is what a guardrail calls inside its hook to store a richer entry: it calls `add_guardrail_record` and sets `self_recorded`. `finish_success(self, context: &mut GuardrailRecordContext<'_>, response: Option<GuardrailValue>, finished_at: SystemTime) -> Result<(), GuardrailRecordError>` adds a record with status `success` and the summary as response, unless `self_recorded` or `switches.records_own_information` is on. `finish_failure(self, context: &mut GuardrailRecordContext<'_>, failure: GuardrailFailure, finished_at: SystemTime) -> Result<GuardrailFailure, GuardrailRecordError>` adds a record unless `self_recorded` is on, and hands the failure back for the caller to return. Its status is `guardrail_intervened` when `failure.is_intervention()` and `guardrail_failed_to_respond` otherwise. Its response is the failure's Display text, or `deny` when `switches.deny_text_on_error` is on. Both finish methods sync the log target at the end whether or not they recorded. `start_time` and `end_time` are seconds since the Unix epoch from `duration_since(UNIX_EPOCH)` and `as_secs_f64`, and `duration` is the span between the two times. Times come in as arguments so tests need no clock.

  `GuardrailSpanSink` has one method, `emit(&self, record: &GuardrailInvocationRecord) -> Result<(), GuardrailSpanError>`, so startup can connect it to the OTEL span code without this crate depending on that code. Python wraps every subclass's `apply_guardrail` in `__init_subclass__`. Rust can't, so the code that calls a guardrail hook calls `begin` before it and a finish method after.

  `messages_for_call_type(call_type: &str, data: Option<&BTreeMap<String, GuardrailValue>>, tool_cache: <the cache type of message_inputs>) -> Result<Option<Vec<GuardrailValue>>, GuardrailRecordError>` is LiteLLM's `get_guardrails_messages_for_call_type`. No data gives none. `completion`, `acompletion`, `anthropic_messages`, `call_mcp_tool` and `list_mcp_tools` return the `messages` list. `responses` and `aresponses` give none when `input` is missing or null, and otherwise call `betterlite_core::api::responses_input_messages::message_inputs` with the replay flag false. Read its signature from `crates/betterlite-core/src/api/responses_input_messages.rs`, B909 builds it. Convert in both directions with `to_value` and `from_value`. Any other call type gives none. Add `betterlite-core` to `crates/betterlite-guardrails/Cargo.toml` for this function.

  `GuardrailRecordError` is the module's thiserror enum, with a variant for the JSON conversions. Convert with `to_value` and `from_value` everywhere and never through bytes: the workspace turns on serde_json's `arbitrary_precision`, and `serde_json::from_slice` into the untagged `GuardrailValue` makes a float into the one-key object `{"$serde_json::private::Number": ...}`.

  The task's oracle helper builds a `CustomGuardrail` and calls the function named by `function` with fixed times, so its answers are stable. Copy each helper case into `tools/oracle/fuzz/corpus/helper_case/` with the prefix `guardrail_records-`. Native tests live in `guardrail_records::tests` with the name prefixes in the check filters below.
scope:
  paths:
    - crates/betterlite-guardrails/src/guardrail_records.rs
    - crates/betterlite-guardrails/src/guardrail_records/**
    - crates/betterlite-guardrails/Cargo.toml
    - Cargo.lock
    - tools/oracle/cases/helpers/guardrail-records/**
    - "tools/oracle/fuzz/corpus/helper_case/guardrail_records-*"
    - tools/oracle/helpers/b3664.py
    - tools/oracle/helpers/b3664/**
    - tools/oracle/src/helpers/guardrails/b3664.rs
    - tools/oracle/src/helpers/guardrails/b3664/**
  lint_tables: false
