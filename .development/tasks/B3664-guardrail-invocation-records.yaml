dod:
  - text: A record always has the nine base keys, null where unset, and writes tracing fields flat and only when set.
    proof: [record-tests, oracle, helper-python]
  - text: "`guardrail_mode` is the event type when given, otherwise the base's single hook, hook list or `{tags, default}` object, otherwise null."
    proof: [record-tests, oracle, helper-python]
  - text: A `guardrail_cost` of `1.50` lands in the stored record as `GuardrailValue::Decimal(1.5)`, and a null entry in `guardrail_cost_by_unit` stays null.
    proof: [record-tests]
  - text: A failing span sink doesn't change the stored record or the result, and a working one receives the record once.
    proof: [record-tests]
  - text: 'Sanitizing drops nulls, so `"match": null` disappears and `"match": "x"` becomes `[REDACTED]`, and a null nested at level 20 survives while one at level 19 doesn''t.'
    proof: [sanitize-tests, oracle, helper-python]
  - text: "`secret_fields` is removed from a root object and from objects directly in a root list, and it stays in deeper objects."
    proof: [sanitize-tests, oracle, helper-python]
  - text: Credential-looking keys are masked after the other steps, and floats in the response stay numbers.
    proof: [sanitize-tests]
  - text: The record goes under `litellm_metadata` when that key exists and `metadata` otherwise, a non-object bucket is replaced, and the three append cases (missing, list, other value) give the right list.
    proof: [metadata-tests, oracle, helper-python]
  - text: Syncing fills both targets, creates `metadata` where it is missing or null, skips a `None` target, wraps a single entry and doesn't duplicate an equal entry on a second sync.
    proof: [sync-tests, oracle, helper-python]
  - text: Summarizing gives an empty object for no response, keeps text and non-object responses, gives `allow` and `mask` for equal and changed maps, and treats a key missing on one side and null on the other as equal.
    proof: [summary-tests, oracle, helper-python]
  - text: A `pre_call` summary ignores non-content keys the hook added, and a changed `stream_holdback_chars` alone gives `allow`.
    proof: [summary-tests, oracle, helper-python]
  - text: begin takes the baseline before the hook edits anything, using all inputs for `ApplyGuardrail`, only content keys for `PreCall`, and none for other hooks.
    proof: [invocation-tests]
  - text: Each hook name gives its event type, and a hook with none falls back to the base's `event_hook` in the stored record.
    proof: [invocation-tests]
  - text: finish_success skips the record when `self_recorded` or `records_own_information` is on, and finish_failure skips it only for `self_recorded`.
    proof: [invocation-tests]
  - text: finish_failure stores `guardrail_intervened` or `guardrail_failed_to_respond` with the failure text, stores `deny` when `deny_text_on_error` is on, and returns the failure.
    proof: [invocation-tests]
  - text: Both finish methods sync the log target on every path, a skipped record included.
    proof: [invocation-tests]
  - text: record_own stores the entry and sets `self_recorded`, so one run gives one entry.
    proof: [invocation-tests]
  - text: Times are epoch seconds and `duration` is their span, and a finish time before the start gives 0.0 with no panic.
    proof: [invocation-tests]
  - text: messages_for_call_type returns `messages` for the five chat-like call types, transforms `input` for the two responses call types, gives none for missing data, missing input and other call types.
    proof: [messages-tests]
  - text: Newly added helper corpus cases replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: record-tests
      why: record keys, mode, cost numbers or span emission are wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_records::tests::record_/)'
    - id: sanitize-tests
      why: secrets, match text or credentials reach the stored record
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_records::tests::sanitize_/)'
    - id: metadata-tests
      why: the record lands in the wrong bucket or the append rule is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_records::tests::metadata_/)'
    - id: sync-tests
      why: spend log metadata misses entries or holds duplicates
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_records::tests::sync_/)'
    - id: summary-tests
      why: user prompts reach the logs or the allow and mask verdict is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_records::tests::summary_/)'
    - id: invocation-tests
      why: the begin and finish flow records the wrong thing or too often
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_records::tests::invocation_/)'
    - id: messages-tests
      why: the call type lookup reads the wrong field or skips the transform
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_records::tests::messages_/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3664)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3664 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3664/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added guardrail record cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/guardrail_records-*")" &&
        grep -lE '^[[:space:]]+b3664:' tools/oracle/fuzz/corpus/helper_case/guardrail_records-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/guardrail-records/record-append.yaml
  - tools/oracle/cases/helpers/guardrail-records/record-bucket.yaml
  - tools/oracle/cases/helpers/guardrail-records/sanitize-secrets.yaml
  - tools/oracle/cases/helpers/guardrail-records/sanitize-null-match.yaml
  - tools/oracle/cases/helpers/guardrail-records/summarize-verdict.yaml
  - tools/oracle/cases/helpers/guardrail-records/logging-sync.yaml
deviations:
  - what: A clock that steps back during a guardrail run logs a `duration` of 0.0, where LiteLLM logs a negative number.
    why: "`SystemTime::duration_since` has no negative result."
  - what: A tracing field set to null by a provider is left out of the record, where LiteLLM stores the key with null.
    why: The record holds tracing fields as options, so an unset field and a null one are the same value.
out_of_scope:
  - The sync_wrapper branch of log_guardrail_information has no caller at the pin, since every decorated function is async, so nothing is built for it.
  - B3853 owns emit_guardrail_span. This task only calls the injected GuardrailSpanSink.
  - B206 owns get_or_create_metadata_bucket and get_metadata_variable_name_from_kwargs in betterlite-models, on typed requests.
  - B5471 owns GuardrailBase, GuardrailFailure, the apply_guardrail contract, is_guardrail_intervention, render_violation_message, inject_advisory_message and the other shared behaviors of custom_guardrail.py.
  - B3665 owns should_run_guardrail and the other request and metadata gates of custom_guardrail.py, and B3666 owns the scan cache, the pre-call markers and the deployment and logging hooks.
  - Moving the local records in openai_moderation/logging.rs, content_filter/guardrail_tracing.rs and panw_prisma_airs/audit.rs onto this module.
pitfalls:
  - 'Null dropping must come before redaction, or `"match": null` turns into `"match": "[REDACTED]"` and the logs claim a match that never happened.'
  - "`secret_fields` holds Authorization headers, and LiteLLM only removes it at the root and in the first level of a root list, so match that depth in the record and let credential masking catch the rest."
  - A self-recorded run skips the record on both paths, while `records_own_information` skips only success, so a real failure of such a guardrail is still logged.
  - LiteLLM logs `apply_guardrail` runs with no event type on purpose, so the record shows the configured `event_hook`, not the hook that ran.
  - The pre_call baseline holds only content keys, so comparing the whole returned request would call every run `mask`.
  - A text response must stay text in the summary, since the proxy turns it into a 400 and it isn't user input.
  - "`standard_logging_guardrail_information` is written in two places on purpose: passthrough routes build the spend log from the logging object's own metadata, so a skipped sync leaves `guardrail_information` null there."
  - 'The sink error is the one place errors are dropped, matching the `except Exception: pass` in LiteLLM, and only the span call gets this treatment.'
  - "`to_f64` returns an Option, so the cost serializer maps `None` to `serde::ser::Error::custom` and doesn't unwrap."
  - The sync reads the bucket without creating it, unlike the write path, so an untouched body stays untouched.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
