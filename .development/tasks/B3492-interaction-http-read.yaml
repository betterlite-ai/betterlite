id: B3492
title: Share native HTTP clients and retrieve interactions
description: >-
  Build the HTTP foundation for Interactions and Agents APIs. Add crates/betterlite-http with two modules: betterlite_http::interactions::base for shared HTTP infrastructure and betterlite_http::interactions::get for GET retrieval.
  The base module defines _BaseHTTPHandler with three methods: _handle_error converts httpx.HTTPStatusError to provider-specific exception types via the contract's get_error_class method, passing through other exceptions unchanged; _sync_client returns the supplied HTTPHandler or creates one via _get_httpx_client with ssl_verify from litellm_params; _async_client returns the supplied AsyncHTTPHandler or creates one via get_async_httpx_client, selecting the provider from litellm_params.custom_llm_provider or falling back to "gemini".
  The GET module implements native retrieval for interactions by interaction_id. Both sync and async variants call interactions_api_config.validate_environment to prepare headers, call interactions_api_config.transform_get_interaction_request to build the URL and query params, log pre-call with the interaction_id as input, execute the GET request (without passing timeout), handle errors via _BaseHTTPHandler._handle_error, and call interactions_api_config.transform_get_interaction_response to convert the response.
  This task is the foundation for interaction polling (B3496) and public retrieval (B3495), and shared by agent operations (B3502, B3503) that reuse _BaseHTTPHandler's client resolution without building the full HTTP methods. Provider selection and optional-field extraction are owned by B3490; request/response transformation are owned by the provider contracts (B1369 for Vertex, B1370 for Studio).
