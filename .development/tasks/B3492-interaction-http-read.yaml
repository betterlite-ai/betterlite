checks:
  optional: []
  commands:
    - id: http-base-tests
      why: _BaseHTTPHandler methods are missing, do not correctly handle errors, do not resolve clients, or do not select the provider correctly
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^interactions::base::/) and not test(/replays/)'
    - id: interaction-get-tests
      why: get_interaction or async_get_interaction do not validate headers, construct URLs, log pre-call, handle errors or transform responses correctly
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^interactions::get::/) and not test(/replays/)'
oracle_cases: []
deviations:
  - what: GET requests do not pass the supplied timeout parameter to httpx.get(); they use default timeout behavior.
    why: The LiteLLM source code omits timeout from the GET call at lines 390 and 443, signaling that interaction retrieval does not respect the timeout parameter.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/http_handler.py#L390-L394
  - what: _async_client uses custom_llm_provider from litellm_params.get() (which returns None for unset fields) and falls back to "gemini" only if the field is None or empty, not by suppressing a null value.
    why: GenericLiteLLMParams.get uses getattr; an unset field is None, not a missing dict entry. The fallback happens in Rust at the point of use, not through a default suppression mechanism.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/http_handler.py#L67-L72
out_of_scope:
  - Provider contract methods (validate_environment, transform_get_interaction_request, transform_get_interaction_response, get_error_class). These are owned by B3490 (contract definition) and B1369/B1370 (provider implementations).
  - Streaming iterators for interaction responses. B3491 owns the streaming SSE iterator.
  - Create, delete and cancel operations. These are owned by separate HTTP handler tasks (B3493, B3494).
  - Request/response body construction and transformation. These are delegated to the provider contract methods called by this module.
pitfalls:
  - "The three _BaseHTTPHandler methods (_handle_error, _sync_client, _async_client) are inherited by InteractionsHTTPHandler and other handler subclasses. The error handler accepts Any provider_config because AgentsHTTPHandler passes BaseAgentsAPIConfig, which is structurally compatible with BaseInteractionsAPIConfig but a different type."
  - "GET requests do not pass the timeout parameter (lines 390 and 443 in LiteLLM omit it). This is intentional behavior, not a bug; betterlite preserves this pattern."
  - "_async_client receives custom_llm_provider as a value from litellm_params.get('custom_llm_provider'), which returns None for unset fields. The fallback to 'gemini' is a literal or-null check in Rust, not a default-suppression mechanism."
  - "The interaction_id is logged as input to pre_call, not as a structured field. The api_base (full URL) is logged separately in additional_args."
  - "Error conversion uses provider_config.get_error_class(error_message, status_code, headers), passing the exact signature from the contract. The status code comes from e.response.status_code and headers are dict(e.response.headers)."
  - "The _handle_error method accepts Any provider_config because it is called with both BaseInteractionsAPIConfig and BaseAgentsAPIConfig. Type checking in Rust must allow this structural compatibility."
review_level: standard
