dod:
  - text: "_TRACER_NAME is defined as \"langfuse-sdk\" and returned by provider.get_tracer in build_langfuse_tracing."
    proof: [channels-constants]
  - text: "_CHANNEL_RETIRE_GRACE_SECONDS is 60.0 seconds."
    proof: [channels-constants]
  - text: "_SPAN_LIMITS is configured with max_events=128, max_links=128, max_event_attributes=128, max_link_attributes=128, and UNSET for length limits."
    proof: [channels-constants]
  - text: "LangfuseTracing is an immutable structure containing provider, tracer and ledger with flush and shutdown methods."
    proof: [channels-types]
  - text: "_ExportLedger wraps a SpanExporter and tracks failed_batches count; export increments the counter on non-SUCCESS result."
    proof: [channels-types]
  - text: "acquire_langfuse_tracing accepts public_key, secret_key, base_url, environment, release, flush_interval and mock_mode; returns a LangfuseTracing handle."
    proof: [channels-acquire]
  - text: "The acquisition cache keys on all parameters (public_key, secret_key, base_url, environment, release, sample_rate, flush_at, flush_interval_millis, mock_mode) and holder-counts multiple loggers."
    proof: [channels-acquire]
  - text: "Reacquisition of the same credentials cancels a pending retirement timer and increments the holder count."
    proof: [channels-acquire]
  - text: "release_langfuse_tracing decrements the holder count and schedules a 60-second retirement timer if the count reaches zero."
    proof: [channels-release]
  - text: "The retirement timer is cancelled if the channel is reacquired before it fires."
    proof: [channels-release]
  - text: "flush_langfuse_tracing spawns a parallel worker per channel, waits with a shared deadline across all workers, and returns true only if all completed and flushed successfully."
    proof: [channels-flush]
  - text: "build_langfuse_tracing creates a TracerProvider with a private Resource, sampler (ALWAYS_ON or TraceIdHashSampler), _RequestedIdGenerator, _SPAN_LIMITS, and BatchSpanProcessor with the _ExportLedger wrapper."
    proof: [channels-build]
  - text: "The batch processor is configured with max_queue_size=100000, max_export_batch_size=flush_at, and schedule_delay_millis from flush_interval_millis."
    proof: [channels-build]
  - text: "All cache, holder-counting and timer state is protected by a process-wide lock."
    proof: [channels-sync]
  - text: "OTEL_SDK_DISABLED=true triggers a warning via verbose_logger while the provider is still built."
    proof: [channels-otel-disabled]
  - text: "LANGFUSE_DEBUG parses truthy calls enable_langfuse_debug_logging at acquisition time."
    proof: [channels-debug]

checks:
