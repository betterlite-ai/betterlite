id: B3903
title: Langfuse export channel leases and shutdown
description: >-
  Build the credential/environment/release-specific export-channel cache and its lease, retirement and
  deadline-bounded flush lifecycle in crates/betterlite-logging. The channel manages a private OTel
  provider, 100,000-span queue, and delivery-aware flush accounting. Implement cache keying on
  public_key, secret_key, base_url, environment, release, sample_rate, flush_at, flush_interval_millis
  and mock_mode with automatic cleanup through a 60-second reacquisition grace period. The grace allows
  callbacks that fetch the logger from the cache just before entry expiry, and a logger rebuilt for the same
  credentials picks the channel back up instead of creating new background tasks. Implement the _ExportLedger
  wrapper to track failed-batch counts and distinguish flush success (queue drained and no batches failed)
  from queue-empty. Use owned async/background tasks instead of detached Python threads for flush,
  retirement and span export, retaining thread-safe reference counting and deadline-bounded shutdown across
  all acquired channels. Retain the LangfuseTracing handle (provider, tracer, ledger) as an immutable data
  structure returned on acquire and passed to release. Preserve the _TRACER_NAME constant "langfuse-sdk"
  to match the SDK's scope key used by Langfuse for span attribution. The _SPAN_LIMITS record
  max_attributes=UNSET, max_events=128, max_links=128, max_span_attributes=UNSET, max_event_attributes=128,
  max_link_attributes=128 and length limits UNSET.

scope:
