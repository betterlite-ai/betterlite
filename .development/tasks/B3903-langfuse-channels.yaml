  commands:
    - id: channels-constants
      why: "tracer name, retirement grace and span limits constants are missing or incorrect"
      run: grep -q '"langfuse-sdk"' crates/betterlite-logging/src/langfuse_channels.rs && grep -q '60.0' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'max_events.*128' crates/betterlite-logging/src/langfuse_channels.rs
    - id: channels-types
      why: "LangfuseTracing or _ExportLedger types are missing or incomplete"
      run: grep -q 'struct LangfuseTracing' crates/betterlite-logging/src/langfuse_channels.rs && grep -q '_ExportLedger' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'failed_batches' crates/betterlite-logging/src/langfuse_channels.rs
    - id: channels-acquire
      why: "acquire_langfuse_tracing function or cache implementation is missing or incorrect"
      run: grep -q 'pub.*fn acquire_langfuse_tracing' crates/betterlite-logging/src/langfuse_channels.rs && grep -q '_TracingKey' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'holders' crates/betterlite-logging/src/langfuse_channels.rs
    - id: channels-release
      why: "release_langfuse_tracing function or retirement grace logic is missing or incorrect"
      run: grep -q 'pub.*fn release_langfuse_tracing' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'retire' crates/betterlite-logging/src/langfuse_channels.rs
    - id: channels-flush
      why: "flush_langfuse_tracing function or deadline-bounded flush logic is missing or incorrect"
      run: grep -q 'pub.*fn flush_langfuse_tracing' crates/betterlite-logging/src/langfuse_channels.rs && grep -q '_FlushWorker' crates/betterlite-logging/src/langfuse_channels.rs
    - id: channels-build
      why: "build_langfuse_tracing function or TracerProvider factory is missing or incomplete"
      run: grep -q 'pub.*fn build_langfuse_tracing' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'TracerProvider' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'BatchSpanProcessor' crates/betterlite-logging/src/langfuse_channels.rs
    - id: channels-sync
      why: "cache and lease management tests are missing or fail"
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^langfuse_channels::/) - test(/replays_the_/)'
    - id: channels-otel-disabled
      why: "OTEL_SDK_DISABLED warning is not logged or the provider is not built"
      run: grep -q 'OTEL_SDK_DISABLED' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'verbose_logger' crates/betterlite-logging/src/langfuse_channels.rs
    - id: channels-debug
      why: "LANGFUSE_DEBUG handling or enable_langfuse_debug_logging call is missing"
      run: grep -q 'LANGFUSE_DEBUG' crates/betterlite-logging/src/langfuse_channels.rs && grep -q 'enable_langfuse_debug_logging' crates/betterlite-logging/src/langfuse_channels.rs

oracle_cases: []

deviations:
  - what: "Async/background task ownership replaces Python's detached thread model; Rust cannot match Python's `threading.Timer.daemon=True` exactly, so Tokio background tasks are used with explicit lifetime ownership and graceful shutdown."
    why: "Rust requires explicit ownership; daemon threads have no direct equivalent. The semantics are preserved: background work does not block interpreter shutdown, but with cleaner cancellation semantics."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_sdk.py#L956-L960"
  - what: "The flush deadline is a wall-clock deadline shared across workers rather than a per-worker join timeout, ensuring all workers respect the same timeout floor."
    why: "LiteLLM's _FlushWorker uses monotonic time relative to a shared deadline; this preserves the original semantics of not pushing the deadline out for later channels."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_sdk.py#L997-L1002"

out_of_scope:
  - "SpanExporter implementation and export logic; owned by B3902."
  - "RequestedIdGenerator and TraceIdHashSampler samplers; owned by B3901."
  - "Credential resolution and configuration; owned by B3900."
  - "Logger construction and event dispatch; owned by B3907."
  - "Prompt client creation; owned by B3904."
  - "Span attribute projection; owned by B3905 and B3909."

pitfalls:
  - "The _TRACER_NAME constant must match the SDK's scope string exactly; Langfuse uses it to key span attribution, and foreign spans from any other scope get their attributes echoed into metadata."
  - "The 60-second grace period is checked on reacquisition: _TRACING_LOCK must protect both timer cancellation and holder-count increment to avoid a use-after-shutdown race."
  - "The flush deadline must be enforced as a wall-clock deadline relative to monotonic time, not a per-worker timeout; a worker still blocked at deadline is abandoned rather than pushing the deadline out."
  - "LangfuseTracing is immutable (frozen dataclass in Python); any modifications to its contained objects must go through the lease or exporter, not direct mutation of the returned handle."
  - "The _SPAN_LIMITS record uses OpenTelemetry's SpanLimits.UNSET sentinel for length limits to disable truncation; do not substitute a large number or zero."
  - "The sample_rate and flush_at values in the cache key come from configured_sample_rate() and configured_flush_at(), not the constructor parameters; verify that the key reflects what build_langfuse_tracing actually uses."
  - "Release the channel before shutdown if possible; the grace period is not a guaranteed cleanup path, only a fallback for loggers that linger."
  - "The BatchSpanProcessor must use schedule_delay_millis (not seconds) to configure the flush interval from the float parameter."

review_level: security

budget:
  max_changed_lines: 1000
  max_new_expects: 0
