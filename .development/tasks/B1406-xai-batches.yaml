id: B1406
title: xAI native batches and paged JSONL results
description: >-
  Implement both xai/batches files in betterlite-openai::xai_batches, using B1035 wire
  records and B173 HTTP execution. Their 372 nonblank/noncomment lines share sync/async
  logic; implement one async transport path with typed request plans. Base resolution is
  explicit, XAI_API_BASE, https://api.x.ai/v1, stripping trailing slashes then one /v1.
  B1402 resolves the nonlegacy key; absent keys raise XAIBatchesError 401 and Authorization
  replaces caller auth. Export these helpers for B1407 files. Encode each batch_id as one
  path segment. Create POST /v1/batches with only name and input_file_id; require a truthy
  input file, default name to litellm-batch, and preserve the caller endpoint in the create
  result only. Retrieve GET, cancel POST :cancel, list GET and results GET /results retain
  upstream error statuses/headers. after=None omits pagination_token; an empty after is
  sent, while a falsey limit defaults to 1000. Results continue only while both token and
  result rows are nonempty, preserving page order and application/jsonl content type.

  Decode bounded native batch/list/result JSON through decode_xai_batch. Cancellation
  wins over counters: cancel_by_xai_message distinguishes failed from cancelled; zero
  requests means validating, positive pending in_progress, otherwise completed. Failure
  counts include errors plus cancellations. Parse RFC3339 or date-only timestamps as UTC;
  invalid/missing creation time yields zero, other missing dates null. Completed output
  file IDs equal batch IDs, recognized by batch_. Lists expose first/last IDs and token
  truthiness independent of page length. Each JSONL row unwraps the first response-map
  value, using status_code 200 and its id; absent body uses stringified error code or
  request_failed and null response. Preserve Unicode, terminal newline and Python's
  comma-space/colon-space serialization, with the response body as a bounded passthrough.
  Helper xai_batches checks these pure projections; transport tests script multiple pages,
  status errors and timeout. Bound collected output at the caller's B1035 byte limit and
  propagate its limit error, avoiding an unbounded page vector. Allocate 350 implementation,
  190 tests, 120 reference adapters and 100 fuzz/exports, maximum 800 changed lines.
scope:
  paths:
    - crates/betterlite-openai/src/{lib,error,xai_batches}.rs
    - crates/betterlite-openai/src/xai_batches/**
    - crates/betterlite-openai/fuzz/Cargo.toml
    - crates/betterlite-openai/fuzz/fuzz_targets/xai_batch.rs
    - crates/betterlite-openai/fuzz/corpus/xai_batch/**
    - tools/oracle/src/helpers/openai/xai_batches.rs
    - tools/oracle/src/helpers/openai/xai_batches/**
    - tools/oracle/helpers/xai_batches.py
    - tools/oracle/helpers/xai_batches/**
    - tools/oracle/cases/helpers/xai-batches/**
    - tools/oracle/fuzz/corpus/helper_case/xai_batches*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/batches/transformation.py#L30-L278
    why: Native records, counter status, timestamps, shared credentials and JSONL serialization.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/batches/handler.py#L33-L195
    why: Native CRUD verbs, cursor parameters and results pagination termination.
dod:
  - text: Native batch operations produce the specified URLs, headers and ordered paged output.
    proof: [xai-batch-tests]
  - text: Counter-derived status and JSONL bytes match the pinned batch transformations.
    proof: [xai-batch-tests, xai-batch-python, oracle]
  - text: Native batch envelopes and helper dispatch have new replayed seeds.
    proof: [xai-batch-corpus, xai-batch-seeds]
checks:
  optional: [mutants]
  commands:
    - id: xai-batch-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^xai_batches::/) - test(replays_xai_batch_corpus)'
      why: Empty pages, cancelled counts and endpoint preservation distinguish this API from OpenAI batches.
    - id: xai-batch-python
      run: test -f tools/oracle/helpers/xai_batches.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: JSONL oracle output must be generated by results_to_openai_jsonl itself.
    - id: xai-batch-corpus
      run: test -f crates/betterlite-openai/fuzz/fuzz_targets/xai_batch.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/xai_batch)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_xai_batch_corpus)'
      why: Native state counters and result wrappers are external JSON, not OpenAI reply records.
    - id: xai-batch-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/xai_batches*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::openai::xai_batches::/)'
      why: The shared parser must recognize batch projection fixtures by their variant tag.
oracle_cases:
  - tools/oracle/cases/helpers/xai-batches/create-name-and-missing-input.yaml
  - tools/oracle/cases/helpers/xai-batches/cancel-over-counters.yaml
  - tools/oracle/cases/helpers/xai-batches/date-only-and-invalid-time.yaml
  - tools/oracle/cases/helpers/xai-batches/completed-output-id.yaml
  - tools/oracle/cases/helpers/xai-batches/empty-list-with-token.yaml
  - tools/oracle/cases/helpers/xai-batches/first-response-map-value.yaml
  - tools/oracle/cases/helpers/xai-batches/unicode-jsonl-and-error-code.yaml
  - tools/oracle/cases/helpers/xai-batches/empty-cursor-zero-limit.yaml
deviations: []
out_of_scope:
  - B036 wires native operations to existing batch/file-content dispatch; managed file and batch hooks are not part of either owned source file.
pitfalls:
  - 'The oracle helper for this task is pre-registered as xai_batches in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/xai_batches.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/xai_batches.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Retrieve cannot recover the endpoint supplied on create and reports /v1/chat/completions.
  - An error object is ignored when the same result contains a response body.
  - A nonempty pagination_token on an empty results page terminates collection.
budget: {max_changed_lines: 800, max_new_expects: 1}
review_level: security
