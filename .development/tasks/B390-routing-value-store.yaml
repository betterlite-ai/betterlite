id: B390
title: Typed routing values and bounded local store
description: >-
  Define RouteKey, RouteValue, StoreRead and StoreError plus a bounded in-memory TTL store, ordered batch reads,
  checked integer/Decimal increments and compare-and-set. Values include counter, spend, pin and scheduler tuple
  variants; keep the enum closed. Fuzz stored value bytes and replay valid/malformed seeds. B360 supplies Redis
  transport over this interface. Use InMemoryCache defaults: 200 items, 600-second default TTL and 1024 KiB per
  item, with earliest-expiry eviction after expired entries. Retain exact TTL equality behavior. Bound serialized
  RouteKey to 1024 bytes and reject oversized typed values before allocation. Implement the owned native service
  in crates/betterlite-router/src/routing_value_store.rs. Add ProbeOperation::RoutingValueStore in tools/oracle/src/router_probes/mod.rs
  and the corresponding B390 entry in tools/oracle/litellm/probes/registry.py; the adapters only call production
  services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation
  lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead of copying
  their algorithms. Shared constructor/size/TTL/eviction/get/set/delete are now B2226. Own async_set_cache L179-L180,
  async_set_cache_pipeline L182-L187, async_set_cache_sadd L189-L198, batch_get_cache L223-L228 and increment_cache
  L230-L236, with typed routing value codecs, ordered batch operations and checked atomic increments. Implement
  these behaviors through the typed Rust services above; synchronous facades and structural accessors reuse the
  same primitive instead of separate ports. Bound the route_value outside-byte parser to 1048576 bytes before decoding;
  on excess use its typed invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback
  path).


  Call B2226 for local TTL semantics instead of copying its maps/heap. The shared native size deviation is owned
  there; keep the routing-specific byte parser here.
