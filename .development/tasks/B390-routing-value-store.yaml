deviations:
- what: Routing state keys have a 1024-byte cap and typed serialized values have a 1 MiB cap.
  why: The pin bounds Python object size but not key bytes; bounded-inputs requires explicit byte limits for Redis
    decoding.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/in_memory_cache.py#L32-L91
- what: The route_value byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite limit.
    Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/in_memory_cache.py#L1-L236
out_of_scope:
- B360 owns final integration and the remaining functions listed in its implementation boundary.
- 'litellm/caching/in_memory_cache.py: B125 owns: InMemoryCache.async_get_cache (L238-L239), InMemoryCache.async_batch_get_cache
  (L241-L246), InMemoryCache.async_increment (L248-L249), InMemoryCache.async_increment_pipeline (L251-L258), InMemoryCache.flush_cache
  (L260-L263), InMemoryCache.disconnect (L265-L266), InMemoryCache.delete_cache (L268-L269), InMemoryCache.async_get_ttl
  (L271-L275), InMemoryCache.async_get_oldest_n_keys (L277-L283).'
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become a hard
  request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules at the
  repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
