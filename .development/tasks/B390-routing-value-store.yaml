dod:
- text: Write tests named routing_value_store_behaviors and routing_value_store_boundaries under routing_value_store::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation and
    the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either check.
  proof:
  - routing-value-store-behaviors
  - routing-value-store-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier, provider
    requests, status, code and state changes; only /error/message may be ignored for betterlite wording. Every declared
    deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-router/fuzz/corpus/route_value/routing-value-store-valid.json and crates/betterlite-router/fuzz/corpus/route_value/routing-value-store-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target route_value and normal replays_the_route_value_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - routing-value-store-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-value-store-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::routing_value_store_behaviors(::|$)/) - test(/replays_the_.*_corpus/)'
  - id: routing-value-store-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::routing_value_store_boundaries(::|$)/) - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/routing_value_store.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/routing_value_store.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-router/fuzz/corpus/route_value/routing-value-store-valid.json && test -f crates/betterlite-router/fuzz/corpus/route_value/routing-value-store-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/route_value |
      grep -Fq "/routing-value-store-" && test -f crates/betterlite-router/fuzz/fuzz_targets/route_value.rs && cargo nextest run
      --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_route_value_corpus)'
oracle_cases:
