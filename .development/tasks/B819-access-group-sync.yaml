id: B819
title: Reconcile access-group key and team membership
description: >-
  Implement reverse access-group synchronization without importing the lazily registered access-group
  endpoint router. Key sync uses B726 AccessGroupRepository and B714 writer_wrapper; it creates no
  transaction. Normalize previous/updated nullable group sequences to sets, attach updated-minus-previous
  first, then detach previous-minus-updated. An empty difference skips SQL. Each statement binds the
  existing key token and sorted group IDs, guards membership with ANY, uses array_append/array_remove
  and returns only moved IDs. Do not hash tokens again or update the key row here. In returned-row order,
  B734 _delete_cache_access_object evicts each moved group before the next stage. A cache failure after
  attach leaves that SQL committed and prevents detach; a retry may move no rows and therefore skip that
  failed key-side eviction. Cases key_set_delta_order, unchanged_groups_no_io, attach_cache_failure_stops_detach
  and key_retry_only_moved_caches explicitly prove this source behavior.

  Update synchronization runs only when access_group_ids is in model_fields_set; absent means no-op,
  explicit null/[] removes previous membership. Regeneration first repoints EVERY group currently
  containing the old hash, independent of the stale existing-key snapshot: remove old and new hashes,
  then append the new hash once. Invalidate returned groups, then if data is non-null apply the explicit
  update semantics using the original existing-key grants and new hash. It does not retain the old hash
  for a grace period or edit deprecated-key rows. Cases update_absent_vs_null and regeneration_live_groups
  include duplicate old/new entries, same-token repoint and a changed request; regeneration_failure_order
  verifies the repoint can persist while the later update fails.

  Team reconciliation is different. Own TEAM_ADVISORY_LOCK_SQL="SELECT
  pg_advisory_xact_lock(hashtext($1)) IS NULL AS locked", the remaining SQL constants and typed moved/team
  row projections in both files. Given an existing transaction, acquire that lock, read the team's current
  access_group_ids, and use [] for a missing row or null array. Select affected groups as desired IDs OR
  groups already containing the team, THEN attach desired missing memberships and detach undesired
  memberships on the same transaction. Team SQL COALESCEs nullable assigned_team_ids to empty arrays;
  key SQL deliberately has no COALESCE. Return the pre-write affected IDs, including unchanged desired
  groups, so retries repeat invalidation. Do not begin/commit inside reconcile. sync_team opens its own
  transaction, commits, then invalidates. new_team callers may instead invoke reconcile inside their team
  insert transaction. Cases team_lock_read_reconcile_order, missing_team_detaches_all,
  team_null_arrays_and_unchanged_groups, caller_transaction_rollback and team_retry_invalidates_desired
  exercise these boundaries and concurrent different-team appends.

  Team cache invalidation gathers every supplied ID concurrently with return_exceptions=true and only
  after all attempts raises the first exception in input order. It does not deduplicate input IDs. Cases
  all_cache_attempts_before_first_error and post_commit_eviction_failure preserve that contract. There
  is no warn-and-drop branch in these helpers, no setting, no license check and no route. Caller tasks
  own primary key/team writes and their relative placement before invoking this component.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/access_group_key_sync.py:
  _RawExecutor.query_raw (L50-L50; 1 source lines), _raw_executor (L75-L78; 4 source lines), _invalidate_access_group_cache
  (L81-L94; 12 source lines), _invalidate_moved_groups (L97-L99; 3 source lines), _write_membership (L102-L108;
  7 source lines), sync_key_access_group_membership (L111-L122; 11 source lines), sync_key_update_access_group_membership
  (L125-L146; 21 source lines), sync_key_regeneration_access_group_membership (L149-L175; 26 source lines).
  litellm/proxy/management_helpers/access_group_team_sync.py: AccessGroupSyncTx.query_raw (L73-L73; 1
  source lines), _Transaction.__aenter__ (L77-L77; 1 source lines), _Transaction.__aexit__ (L79-L79; 1
  source lines), _PrismaDb.tx (L83-L83; 1 source lines), _PrismaClient.db (L88-L88; 1 source lines), invalidate_access_group_cache
  (L91-L104; 12 source lines), invalidate_access_group_caches (L107-L120; 13 source lines), reconcile_team_access_group_membership
  (L123-L149; 24 source lines), sync_team_access_group_membership (L152-L157; 5 source lines).


  These functions perform SQL or use proxy-global caches, so there is no pure helper oracle operation.
  Native Postgres tests drive the actual production services; the calling endpoint tasks exercise HTTP
  parity. postgres_pinned_rows covers delta/repoint/reconcile rows and postgres_failure_effects covers
  the distinct key partial writes, team rollback and post-commit cache failures.


  Synchronization tests require B860 Postgres via POSTGRES_TEST_URL or testcontainers if unset;
  connection errors fail, and retries inspect which changed or already-correct group IDs are evicted.


  Sizing: 197 nonblank, noncomment owned lines (106 key-side and 91 team-side), including SQL, row types
  and function docstrings but excluding imports/module docstrings; allow 200 production, 330 native
  tests, 0 helper adapters, 30 wiring, 0 decoder/fuzz and 0 config lines, 560 within a 575-line gate.
