out_of_scope:
  - B770 owns update/regenerate request decoding; B734 owns the cache deletion primitive and its transport details.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Key sync invalidates moved rows only, whereas team sync invalidates all affected desired/existing groups even after an idempotent retry.
  - The key attach and detach statements have no shared transaction in this helper.
