id: B819
title: Reconcile access-group key and team membership
description: >-
  Implement AccessGroupMembershipSync with parameterized writer-transaction SQL for key/team create/update/regeneration
  and removal. Preserve bidirectional assignment arrays and invalidate both moved-from and moved-to group
  identities after commit. Key regeneration swaps hashes consistently with deprecated key overlap.


  Build the production access_group_sync module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/access_group_key_sync.py:
  _RawExecutor.query_raw (L50-L50; 1 source lines), _raw_executor (L75-L78; 4 source lines), _invalidate_access_group_cache
  (L81-L94; 12 source lines), _invalidate_moved_groups (L97-L99; 3 source lines), _write_membership (L102-L108;
  7 source lines), sync_key_access_group_membership (L111-L122; 11 source lines), sync_key_update_access_group_membership
  (L125-L146; 21 source lines), sync_key_regeneration_access_group_membership (L149-L175; 26 source lines).
  litellm/proxy/management_helpers/access_group_team_sync.py: AccessGroupSyncTx.query_raw (L73-L73; 1
  source lines), _Transaction.__aenter__ (L77-L77; 1 source lines), _Transaction.__aexit__ (L79-L79; 1
  source lines), _PrismaDb.tx (L83-L83; 1 source lines), _PrismaClient.db (L88-L88; 1 source lines), invalidate_access_group_cache
  (L91-L104; 12 source lines), invalidate_access_group_caches (L107-L120; 13 source lines), reconcile_team_access_group_membership
  (L123-L149; 24 source lines), sync_team_access_group_membership (L152-L157; 5 source lines).


  Add the access_group_sync operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a access-group-sync-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 144 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  144 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 393 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
