dod:
- text: >-
    image_description_fetching exercises concurrent LLM calls to describe images, ordered appending of
    descriptions to the detections list, filtering each description through _filter_single_text, and appending
    the raw description to HTTP 400 error detail when BLOCK is triggered. A missing/empty image list, no
    configured image_model, or no LLM router skips processing without error. Exception detail includes
    original description text alongside the guardrail error message.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    competitor_intent_detection adds a typed CompetitorIntentDetection record to detections with intent,
    confidence, action_hint, entities, signals and evidence fields from the result. Refuse action raises
    HTTP 400 with status_code/detail error containing the configured refuse_message_template (or a default),
    intent and confidence. Reframe calls the passthrough exception method with the reframe_message_template
    (or a default), supplying request_data and the result as detection_info. Log_only and allow actions
    return normally after appending the detection. Verbose logging records the intent, confidence and
    action_hint for all outcomes.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    mcp_tool_argument_filtering checks _event_hook_is_event_type for pre_mcp_call, calls _get_mcp_tool_name
    to locate mcp_tool_name in request_data, skips if absent, and filters mcp_arguments recursively. Depth
    bound is enforced: passing DEFAULT_MAX_RECURSE_DEPTH to _filter_argument_value, which raises HTTP 400
    with context_label "MCP tool call" when depth is exceeded. Filtered arguments are written back to
    request_data["mcp_arguments"] and request_data["modified_arguments"]. Dict keys are checked for masking
    violations; object keys that match a masking rule raise HTTP 400 with context_label "MCP tool call
    argument" in the error message.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    tool_call_argument_filtering iterates every tool_call in inputs["tool_calls"], extracts the function.arguments
    string, parses it as JSON, and recursively filters the parsed value with _filter_argument_value. Depth
    starts at 0; exceeding DEFAULT_MAX_RECURSE_DEPTH raises HTTP 400 with context_label "tool call" and
    detail containing the depth error. If parsing fails or the result is not dict/list, the arguments string
    is treated as plain text and filtered through _filter_single_text. Filtered arguments are written back
    to tool_call["function"]["arguments"] if the value changed. String values in dicts/lists are masked;
    numeric values and object keys are verified to match no masking patterns (raise HTTP 400 if they do),
    and non-string/non-dict/non-list leaves are passed through unchanged.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    depth_limit_and_config exercises DEFAULT_MAX_RECURSE_DEPTH loading through the production config loader,
    verifies that a depth of N arguments deep raises when N > DEFAULT_MAX_RECURSE_DEPTH, and that N <= DEFAULT_MAX_RECURSE_DEPTH
    succeeds. Config tests invoke the loader for the default (100), overrides and invalid types. JSON
    recursion with lists and dicts is tested. A non-numeric, non-null value in the config fails at consumer
    time, not at load time.
  proof: [config-tests, config-corpus, behavior-tests, oracle]
- text: Config loader, helper adapter and oracle helper match the implementation and new corpus seeds are added.
  proof: [config-tests, helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Image description fetching, competitor policy application, and recursive argument filtering must work without side effects.
    run: cargo nextest run --locked -p betterlite-guardrails -p betterlite-config --no-tests=fail -E 'test(/^(sections::)?content_filter_inputs::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: The referenced helper adapter is missing or strict Python checking fails.
    run: test -f tools/oracle/helpers/b3699.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/content-filter-inputs-*")" && grep -rlq "content_filter_inputs" tools/oracle/fuzz/corpus/helper_case/content-filter-inputs-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-tests
    why: The DEFAULT_MAX_RECURSE_DEPTH configuration loader rejects, ignores or misresolves the setting.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::content_filter_inputs::tests::/) - test(/replays_the_/)'
  - id: config-corpus
    why: The task added no new configuration seed or production config replay fails.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/guardrail-depth-*")" && grep -rlq "default_max_recurse_depth" crates/betterlite-config/fuzz/corpus/config_yaml/guardrail-depth-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
