deviations: []
out_of_scope:
- B3695 owns _filter_single_text, which is called for descriptions, scalar values and keys; this task uses it, does not reimplement it.
- B3696 owns the competitor configuration and text_for_entity_matching; this task accesses prepared refuse/reframe templates and calls the competitor checker's run method.
- B3690 owns typed detection records (ContentFilterDetection, CompetitorIntentDetection, etc.) and the DEFAULT_MAX_RECURSE_DEPTH constant through B002's config section.
- B104 owns CustomGuardrail.raise_passthrough_exception, _event_hook_is_event_type and Router.acompletion; these are unresolved B104 callees available through the parent guardrail class.
- litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py lines outside CF:1456-1872 (e.g., apply_guardrail orchestration, category/pattern compilation, single-text filtering, streaming) are owned by other tasks.
pitfalls:
- Image descriptions are gathered concurrently with asyncio.gather but filtered sequentially in the order they were requested, preserving deterministic ordering. Appending the description to the error detail is necessary for debugging image-based blocks; the description text itself is not masked in the error.
- CompetitorIntentDetection must include all fields (intent, confidence, action_hint, entities, signals, evidence) for tracing and logging to work correctly. Omitting a field changes the action_hint behavior.
- The _filter_argument_value recursion tracks depth starting from 0, not 1. A depth check at the entry point (depth > DEFAULT_MAX_RECURSE_DEPTH) occurs before filtering nested values; an argument at exactly DEFAULT_MAX_RECURSE_DEPTH succeeds, but the first child at DEFAULT_MAX_RECURSE_DEPTH+1 fails.
- JSON parsing failure does not swallow the exception; malformed JSON arguments fall back to text filtering, which may raise a BLOCK exception. This is the pinned behavior and must be preserved.
- Object keys are always checked for masking violations, even if the value is not a string. A numeric key that matches a pattern raises HTTP 400 with the masking error message and the context_label.
review_level: standard
budget:
