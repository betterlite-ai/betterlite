id: B3699
title: Content filtering for images and tool arguments
description: >-
  Build image-description scanning, competitor policy effects and recursive tool/MCP argument filtering
  over the same text evaluator. Images are processed concurrently through an LLM; their ordered descriptions
  are scanned through the content filter. Competitor intent results apply policy: refuse blocks the request
  with HTTP 400, reframe returns a passthrough exception, log_only/allow continues without intervening.
  Tool call arguments are JSON strings parsed and recursively filtered; numeric values and object keys cannot
  be rewritten by masking rules, while string values can. Malformed JSON falls back to treating the entire
  string as text. MCP tool arguments are already-parsed dicts filtered in place. Both recursion paths respect
  DEFAULT_MAX_RECURSE_DEPTH (default 100), blocking requests that exceed it with HTTP 400.

  Owned functions come from CF:1456-1872. _process_images fetches concurrent LLM descriptions and filters
  them, appending image-description context to exceptions. _apply_competitor_intent_policy constructs a
  CompetitorIntentDetection from the result, appends it to detections, then acts on the action_hint: refuse
  raises HTTP 400 with the configured message and confidence, reframe calls raise_passthrough_exception with
  the template message, and log_only/allow returns normally (detection already recorded). Tool-call functions
  parse arguments strings to JSON dicts, filter recursively with _filter_single_text for leaf strings/numbers/keys,
  preserve non-string/non-dict/non-list values unchanged, and reconstruct JSON on write-back. MCP functions
  use the same filter logic on dict-valued arguments, skipping when mcp_tool_name is absent and gating on
  the pre_mcp_call event hook. Both paths use a domain-specific context label in error messages and respect
  the masking behavior of the text evaluator (BLOCK raises, MASK redacts).

  B3695 supplies _filter_single_text; B3696 configures the text and templates; B3690 defines the typed
  detections. B002 extends the config loader for DEFAULT_MAX_RECURSE_DEPTH. Router.acompletion and
  CustomGuardrail.raise_passthrough_exception/_event_hook_is_event_type are unresolved B104 callees.
