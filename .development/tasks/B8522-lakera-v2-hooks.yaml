dod:
  - text: The constructor applies LiteLLM's defaults and env fallbacks, and advisory validation refuses the three invalid setups with LiteLLM's text, also on an in-memory update that then leaves the instance unchanged.
    proof: [lakera-v2-tests, oracle]
  - text: humanize_lakera_block_reasons, unmaskable_reason and build_lakera_inspection_messages give LiteLLM's output.
    proof: [lakera-v2-tests, oracle]
  - text: call_v2_guard sends the documented body and header and records one invocation without the payload key, also on failure.
    proof: [lakera-v2-tests]
  - text: Each hook follows the on_flagged branches for PII-only, mixed and non-PII verdicts, masks or blocks as LiteLLM does, and reports the applied guardrail name.
    proof: [lakera-v2-tests]

checks:
  optional: []
  commands:
    - id: lakera-v2-tests
      why: a Lakera v2 default, branch, mask or record differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^lakera_v2::/)'

deviations:
  - what: The hooks return the applied guardrail name instead of writing the applied-guardrails header themselves.
    why: The header is added by the request dispatcher, so a guardrail never touches the response headers.
  - what: The HTTP client is a constructor argument.
    why: Clients are built once by the caller; LiteLLM calls get_async_httpx_client inside the constructor.

out_of_scope:
  - "_mask_pii_in_messages, _is_only_pii_violation and _get_http_exception_for_blocked_guardrail: B3779 (lakera_pii)."
  - "initialize_lakera_v2 and LakeraV2Args: B3681. Building the guardrail from its CallbackSpec in the registry: B3682."
  - "should_run_guardrail and the _content_utils helpers: B3665. The message scope helpers: B3663. The invocation record: B3664."

pitfalls:
  - 'A template with "{{reason}}" contains the text "{reason}" but has no format field, so it is refused.'
  - 'call_v2_guard pops "payload" from the logged copy because it holds the PII spans, and the response returned to the hook keeps it.'
  - 'Lakera message_id values index the filtered inspection list, so masking writes back through pre_masking_scope_indices, and role checks compare lowercased roles.'
  - 'Monitor mode still masks a PII-only verdict when only the instructions field stands in the way, and logs at error level when it cannot mask.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0

