id: B4124
title: Place prompt cache breakpoints across messages and system
description: >-
  Build ordered injection for Chat Completions and native Messages, preserving existing client marks,
  system-message precedence and reserved tool-config slots. Keep the provisional Responses carry-forward
  behavior and OpenAI explicit-dialect exclusions, including assistant messages and unsupported content-block types.

  This task owns the message-level placement logic that injects cache-control marks (Anthropic dialect)
  or prompt-cache-breakpoint marks (OpenAI dialect) into typed message objects, respecting per-message
  and per-role targeting, skipping assistant messages in OpenAI mode, and enforcing the 4-block provider
  limit. It imports already-counted capacity info (reserved blocks, external breakpoints) and applies
  configured injection points in order, stopping when the budget is exhausted. When points defer to a
  later pass (role-targeted with no index in Chat Completions), it carries them forward with the
  carry-forward flag set. For the native Messages route, it also places marks on the system block,
  converting string system to a structured block when needed.

  Build in `betterlite-prompts::cache_placement` and `betterlite-prompts::cache_placement/**`.
  Preserve index conversion (negative indices, out-of-bounds skips), role-based targeting, the
  stop-when-full guard with warning logs, OpenAI's content-block-type restrictions (text, image,
  image_url, file, input_audio, input_text, input_image, input_file), and assistant-message skip
  semantics. The system-block placement converts string systems to AnthropicSystemMessageContent
  text blocks and applies marks to the last eligible block. Responses carry-forward keeps the
  remaining points in kwargs for the bridge to apply when it builds the chat messages. The config
  order precedence matters: when slots fill, earlier points in the sequence are applied first, later
  ones are skipped or carried forward.

