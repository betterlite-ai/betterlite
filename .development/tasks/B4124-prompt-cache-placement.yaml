dod:
  - text: >-
      Index resolution handles string and int indices, negative wraparound, and out-of-bounds
      silently (no injection, no error). Role-based targeting returns all matching indices in the
      message list. When a point specifies both index and role, only index is used.
    proof: [behavior-tests]
  - text: >-
      Message injection respects the limit, skipping injection when max_blocks is reached.
      Client-marked messages (existing cache_control or prompt_cache_breakpoint) are preserved
      without overwriting. The used-block count is incremented only when injection actually applies
      a mark that was not present. A warning is logged once when the limit is first exceeded.
    proof: [behavior-tests]
  - text: >-
      Anthropic dialect places cache_control dicts on message top level (string content) or on the
      last content-list block. OpenAI dialect places prompt_cache_breakpoint on eligible content blocks
      (text, image, image_url, file, input_audio, input_text, input_image, input_file). Assistant messages
      are skipped entirely in OpenAI mode.
    proof: [behavior-tests]
  - text: >-
      Every message with string content is converted to a single-block text list whenever the request
      carries any injection points, independent of dialect and of whether that message is targeted for
      injection.
    proof: [behavior-tests]
  - text: >-
      Native Messages route: system string is converted to AnthropicSystemMessageContent text block
      when applying a system-role-targeted point. System marks have priority in the budget (applied
      first if there is capacity). Remaining non-message points are returned for downstream handlers.
    proof: [behavior-tests]
  - text: >-
      Chat Completions carry-forward: role-targeted points with no index are held back unconditionally
      when the carry_unmatched flag is set, independent of whether a message of the targeted role is
      currently present in the list. They are returned in kwargs for a later pass. All other remaining
      points are carried forward.
    proof: [behavior-tests]
  - text: >-
      In OpenAI dialect, once a message injection adds a breakpoint, prompt_cache_options is set to
      mode 'explicit' unless already present in non_default_params.
    proof: [behavior-tests]
  - text: Config order precedence is preserved; earlier points win when slots fill.
    proof: [behavior-tests]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case seed replays.
    proof: [oracle, helper-python, helper-case-corpus]
