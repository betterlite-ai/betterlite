pitfalls:
  - 'Index resolution uses the original provided index in the error log but applies the normalized
    one (with negative wraparound) to the list. Out-of-bounds indices fail silently without logging.'
  - 'Negative indices wrap using len(messages) semantics (e.g., -1 = last message, -2 = second-to-last).
    An index like -100 on a 3-message list resolves to 0 after wrapping but stays out of bounds and is skipped.'
  - 'OpenAI content-block types form a closed set: text, image, image_url, file, input_audio, input_text,
    input_image, input_file. Other types (video, pdf, etc.) do not accept prompt_cache_breakpoint and are
    skipped even if targeted by a point. The search finds the last eligible block, not the last block overall.'
  - 'String message content in OpenAI mode becomes [{type: "text", text: original_string}], not passed through
    with_prompt_cache_breakpoint on a text-typed dict; the wrapper function handles the conversion.'
  - 'System-string-to-block conversion happens only when a system-role point applies and system is not yet
    a list. A system that is already a list has the breakpoint applied to its last block if eligible.'
  - 'Remaining points are forwarded only if they are non-empty. The Messages route applies system marks with
    highest priority and reserves capacity in the budget for tool_config and other external points.'
  - 'The oracle helper for this task is pre-registered as b4124 in the prompts group. Replace the
    stub Op in tools/oracle/src/helpers/prompts/b4124.rs with an impl Helper, and write run in
    tools/oracle/helpers/b4124.py. The registry files (helpers/mod.rs, the group files, dispatch.py)
    are not this task''s to edit.'
