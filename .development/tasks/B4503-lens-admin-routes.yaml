dod:
  - text: user_scope returns an all_teams scope for proxy_admin and, for reads only, proxy_admin_viewer, and answers 403 with the write text or the access text for every other role.
    proof: [access-scope-tests]
  - text: get_lens answers 404 "Lens not found" for a missing lens and for a scope that cannot access it, required answers 409, and the repository and storage helpers answer 503 and 501 with the stated details.
    proof: [access-lookup-tests, access-storage-tests]
  - text: validate_selection and validate_model apply the 422, 400 and 403 rules in the stated order.
    proof: [access-selection-tests, access-model-tests]
  - text: The router mounts exactly the 16 listed method and path pairs and no worker route, and static segments win over {lens_id}.
    proof: [router-tests, oracle]
  - text: List, create, read and update lens follow the stated role checks, validation order, created record fields and revision change.
    proof: [lens-routes-tests, oracle]
  - text: Run, run history, one run and cancel follow the stated queueing, job stripping, 404 and cancel transform.
    proof: [run-routes-tests, oracle]
  - text: The finding update replaces status and reason on the matching finding only, and an unknown finding id changes nothing.
    proof: [finding-route-tests]
  - text: The preview route validates the selection first, answers 501 before it checks the role, clamps as_of to the clock and passes the stated start and end milliseconds.
    proof: [preview-route-tests, oracle]
  - text: Worker register stores only the SHA-256 of a "lens-" token, validates the billing key, and returns the token once; billing-key and revoke apply the stated 404, 409 and running-job rules.
    proof: [worker-route-tests, oracle]
  - text: The evidence route checks the lens scope before decoding, answers 404 for bad ids, wrong source and other-team executions, and builds the Execution with the stated fields.
    proof: [evidence-route-tests, oracle]
  - text: Availability and agents answer 200 with empty values when tracing is off, and the list route reports tracing_enabled from the storage.
    proof: [lens-routes-tests, oracle]
checks:
  optional: []
  commands:
    - id: access-scope-tests
      why: user_scope role rules are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_access::scope::/)'
    - id: access-lookup-tests
      why: repository, get_lens or required behavior is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_access::lookup::/)'
    - id: access-storage-tests
      why: the 501 for missing tracing storage is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_access::storage::/)'
    - id: access-selection-tests
      why: execution id selection validation is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_access::selection::/)'
    - id: access-model-tests
      why: the analysis model validation is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_access::model::/)'
    - id: router-tests
      why: the route table is missing or mounts a wrong route
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_admin_routes::router::/)'
    - id: lens-routes-tests
      why: list, create, read, update, availability or agents handlers are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_admin_routes::lenses::/)'
    - id: run-routes-tests
      why: run, history, one run or cancel handlers are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_admin_routes::runs::/)'
    - id: finding-route-tests
      why: the finding update handler is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_admin_routes::findings::/)'
    - id: preview-route-tests
      why: the preview handler is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_admin_routes::preview::/)'
    - id: worker-route-tests
      why: register, billing-key or revoke handlers are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_admin_routes::workers::/)'
    - id: evidence-route-tests
      why: the evidence content handler is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_admin_routes::evidence::/)'
