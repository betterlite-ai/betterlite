id: B4503
title: Lens administration routes and access checks
description: >-
  Build the 16 administrator-facing Lens routes of litellm/proxy/lens/endpoints.py and the access helpers that the worker routes share.
  Two modules in betterlite-server, each a file plus a folder of submodules with adjacent tests.rs files: lens_access (the shared helpers)
  and lens_admin_routes (the handlers and the router). Add betterlite-lens and betterlite-db to the server's Cargo.toml if B4504 has not already (no cycle, the server is the top crate).
  The worker routes (everything under /lens/worker/...), worker_auth, assigned, claim_candidate, validate_finding and merge_results belong to B4505,
  which imports lens_access from this task. This task registers its 16 routes in one function `lens_admin_routes::router(state)` and the wave 17 Lens wiring part composes it, so nothing is registered twice.
  Every route sits behind the existing auth layer (B003 and B052), exactly like the routes of B3125. Every error body is {"detail": "<text>"} with the status below.

  Outside services come through a state struct `LensRoutesState` (`crate::lens_access::state::LensRoutesState`, with the `Clock` and `IdSource` traits beside it in the same file, all `pub(crate)`), built once by the caller and passed to the router: the Lens repository (B4501 LensRepository, absent when the server has no Postgres),
  the trace storage (Option of the B4502 Storage port; the owner of the ClickHouse implementation and of provide_storage is B3867 and the later storage task, this task only reads what the state holds),
  ModelNames (a trait with get_model_names(team_id: Option<&str>) -> Vec<String>, backed by B844 get_model_names on the router, absent when no router is configured),
  KeyResolver (the B4504 port that validate_key takes), a Clock (now in UTC) and an IdSource (new uuid v4 text, and the random bytes for the worker token). Tests use fakes for all of them.
  For the repository in tests, use B4501's fake Database if it exports one; otherwise write a small one in tests.rs that answers by SQL text.

  lens_access::scope: user_scope(auth, write) -> Result<Scope, LensAccessError>. The caller type is B2314's resolved key (UserAPIKeyAuth) and its user_role is the LitellmUserRoles value.
  write = true and role is not proxy_admin: 403 "Only proxy admins can configure or run Lens". Otherwise role proxy_admin or proxy_admin_viewer returns Scope with all_teams = true (team_id and api_key_hash empty).
  Any other role, or no role: 403 "Lens requires proxy administrator access".

  lens_access::lookup: lens_repository(state) returns the repository, or 503 "Lens needs a connected Postgres database" when the state has none.
  get_lens(repo, lens_id, scope): repo.get(lens_id); None, or B4500 can_access(scope, lens.scope) false, is 404 "Lens not found". required(option): None becomes 409 "Lens changed concurrently; retry the operation".
  B4505 calls get_lens with the worker's own scope, so keep it free of any assumption that the scope is all_teams. B4505 imports them by these exact paths, all `pub(crate)` in the same crate (betterlite-server): `crate::lens_access::lookup::get_lens`, `crate::lens_access::lookup::required` and `crate::lens_access::storage::source_reader`. `lens_access.rs` re-exports nothing else.

  lens_access::storage: source_reader(storage) builds a B4502 SourceReader from the state's storage, or fails with 501 and detail "Agent tracing is not enabled. Set `tracing:` in general_settings and CLICKHOUSE_URL." when there is none.

  lens_access::selection: validate_selection(settings). Each entry of settings.execution_ids goes through B4502 parse_execution; a decoding error, or a source that is not "traces" or "requests", is 422 "Choose execution IDs returned by the activity preview".

  lens_access::model: validate_model(settings, auth, state). Run validate_selection first. Then 400 "Choose a model configured on this LiteLLM instance" when the state has no ModelNames or settings.model is not in get_model_names(team_id = the caller's team_id).
  Then take the caller's allowed models list (empty when the key has none). A caller whose role is not proxy_admin, with a non-empty list that holds neither settings.model nor "all-proxy-models", gets 403 "This key does not have access to the analysis model".
  Build that last branch; only write routes call validate_model and they already demand proxy_admin, so no HTTP case reaches it.

  lens_admin_routes, the 16 routes, all under the /lens prefix. Each handler order is: the auth layer, request decoding (body, query), then the handler steps below. A malformed body or query is the server's shared 422 response before any handler step, even for a caller who would get 403.
  Bodies are B4500 records (unknown fields are rejected) and are decoded by B4500's decoders; do not write new record types except Preview and WorkerBilling and WorkerName below.

  lenses: GET /lens. user_scope(read). Response LensList: every Lens that can_access(scope, lens.scope), every Worker likewise, tracing_enabled = the state has storage. The lens list is read before the worker list.
  POST /lens with a LensSettings body. user_scope(write), then validate_model. now = clock; Lens with id = new uuid, scope = the all_teams scope, settings, created_at = now, next_run_at = now, budget_month = now as "%Y-%m", other fields B4500 defaults.
  Apply B4500 queue_job(lens, now, new uuid) and call repo.create on the result; the response is that Lens (revision 1, version 0, one queued job).
  GET /lens/{lens_id}: get_lens with user_scope(read). PUT /lens/{lens_id} with LensSettings: get_lens with user_scope(write) first (404 before any settings check), then validate_model, then repo.update with a transform that sets settings and revision = revision + 1 and keeps the jobs; required(result).

  runs: POST /lens/{lens_id}/runs with RunRequest (settings and lookback_hours both optional). get_lens (write), validate_model only when settings is present, now = clock, job id = new uuid,
  repo.update with B4500 queue_job(lens, now, job id, lookback_hours, settings), required(result). queue_job returns the lens unchanged when a queued or running job exists, so a second run request is a 200 with no new job.
  GET /lens/{lens_id}/runs with query offset (integer, 0 or more, default 0): get_lens (read), then repo.jobs(lens_id, offset), each job returned with sample = null, findings = null and assessments = [].
  GET /lens/{lens_id}/runs/{job_id}: get_lens (read), repo.job(lens_id, job_id), None is 404 "Investigation not found"; the full job is returned.
  POST /lens/{lens_id}/cancel: get_lens (write), now = clock, repo.update with a transform: no current_job returns the lens unchanged, otherwise the job gets status "cancelled", stage "Cancelled", finished_at = now,
  and the lens gets next_run_at = now + settings.interval_minutes minutes (of the lens settings); required(result).

  findings: PATCH /lens/{lens_id}/findings/{finding_id} with FindingUpdate (status, reason default ""). get_lens (write), then repo.update where the finding with that id gets both status and reason replaced; other findings stay; required(result). An id that matches nothing is a 200 with the lens unchanged.

  preview: POST /lens/preview/sample with body Preview: as_of (optional ISO 8601 datetime that must carry an offset), offset (integer 0 or more, default 0), settings (LensSettings), lookback_hours (integer 1 to 8760, default 24).
  Steps in this order: validate_selection(settings); now = the smaller of as_of (or the clock when absent) and the clock; build the SourceReader (501 when there is no storage, which comes before the role check);
  user_scope(read); then reader.sample(scope, settings, start_ms, end_ms, offset, preview = true) with start_ms = (now - lookback_hours hours) in milliseconds and end_ms = (now - 2 minutes) in milliseconds. Return the Sample.

  workers: bodies WorkerBilling { analysis_key_id: 64 lowercase hex characters, exactly the pattern ^[a-f0-9]{64}$ } and WorkerName (the same field plus name, 1 to 100 characters counted as characters, default "Lens worker"); both reject unknown fields.
  POST /lens/workers/register: user_scope(write), validate_key(analysis_key_id) from B4504, then token = "lens-" + the URL-safe base64 text, without padding, of 40 random bytes from IdSource. Worker { id = new uuid, name, scope, analysis_key_id, last_seen = 1970-01-01T00:00:00Z, revoked false }.
  repo.save_worker(worker, lowercase hex SHA-256 of the token's UTF-8 bytes). Response WorkerCreated { worker, token }. The token is shown once and never stored in plain.
  PUT /lens/workers/{worker_id}/billing-key with WorkerBilling: user_scope(write); find the worker in repo.workers() by id; missing or not can_access: 404 "Worker not found"; revoked: 409 "Register a new worker instead of updating revoked access";
  validate_key; repo.set_worker_billing(worker id, key id), None is 409 "Worker access was revoked"; return the updated Worker.
  DELETE /lens/workers/{worker_id}: user_scope(write); the same 404; then scan every job of every lens from repo.lenses(): a job with status "running" and worker_id equal to this worker is 409 "Wait for this worker's investigation to finish or cancel it before revoking access". Otherwise repo.revoke_worker(id) and the response body is the JSON value true.

  evidence: GET /lens/{lens_id}/executions/{execution_id} with query cursor (default "") and offset (0 or more, default 0). get_lens (read) first. Then parse_execution(execution_id): a decoding error is 404 "Execution not found".
  Source other than "traces" or "requests" is the same 404, and so is a lens whose scope is not all_teams when the execution's team differs from lens.scope.team_id. Build Execution { id = the given execution_id, source, trace_id, trace_ref, team_id = the team, name = trace_id, start_time = "", span_count = 1, root_seen = (source is "requests") }.
  Only then build the SourceReader (501 without storage) and return reader.content(lens.scope, execution, cursor, offset).

  availability and agents: GET /lens/activity/available: user_scope(read); with storage, reader.availability(scope), without it ActivityAvailability with traces false and requests false (200, not 501). GET /lens/agents: user_scope(read); with storage reader.agents(scope), without it [].

  Route table: the router mounts exactly these 16 (method path): GET /lens, POST /lens, GET /lens/activity/available, GET /lens/agents, PUT /lens/{lens_id}, POST /lens/{lens_id}/runs, GET /lens/{lens_id}, GET /lens/{lens_id}/runs,
  GET /lens/{lens_id}/runs/{job_id}, POST /lens/{lens_id}/cancel, PATCH /lens/{lens_id}/findings/{finding_id}, POST /lens/preview/sample, POST /lens/workers/register, PUT /lens/workers/{worker_id}/billing-key,
  DELETE /lens/workers/{worker_id}, GET /lens/{lens_id}/executions/{execution_id}. Static segments (agents, activity, preview, workers) must win over {lens_id}, as they do in LiteLLM where they are declared first.
  No /v1 or provider-prefixed alias exists for these routes at the pin.

  Errors: lens_access owns LensAccessError (one variant per status and detail above, with status() and detail()), lens_admin_routes owns LensRouteError that wraps LensAccessError, the B4504 key-validation error, the repository error and the B4502 source error.
  A repository or storage error that is not one of the listed details is a 500 and is not hidden.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/lens_access.rs
    - crates/betterlite-server/src/lens_access/**
    - crates/betterlite-server/src/lens_admin_routes.rs
    - crates/betterlite-server/src/lens_admin_routes/**
    - tools/oracle/cases/http/lens-admin-routes/**
    - tools/oracle/helpers/b4503.py
    - tools/oracle/helpers/b4503/**
    - tools/oracle/src/helpers/server/b4503.rs
    - tools/oracle/src/helpers/server/b4503/**
  lint_tables: false
