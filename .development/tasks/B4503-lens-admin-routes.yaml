deviations:
  - what: The preview window bounds are computed in whole milliseconds from the integer microsecond timestamp, not from a float seconds value multiplied by 1000.
    why: LiteLLM's int(timestamp() * 1000) can land one millisecond low when the float is just under a whole millisecond. Integer arithmetic is exact, and the difference cannot change which executions a preview shows in any way a user could rely on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/endpoints.py#L283-L294
out_of_scope:
  - "B4505 owns the worker routes under /lens/worker (claim, progress, sample, content, model, result, heartbeat), worker_auth, assigned, claim_candidate, validate_finding and merge_results of endpoints.py. It imports get_lens, required and source_reader from this task's lens_access module."
  - "The cases need no database and no tracing store, so rows, paging, 403 for non-admin callers and the success bodies of the database routes are covered by native tests only. The oracle worker sandbox has no Postgres for either gateway."
  - "B4501 owns LensRepository and its SQL, B4500 the records, can_access, queue_job, current_job and replace_job, B4502 the SourceReader, Storage port and parse_execution, B4504 validate_key."
  - "The ClickHouse implementation of the lens_* storage queries and provide_storage are owned by B3867 and the later storage task, not here. No task owns the Lens storage queries yet; the architect names the owner."
  - "B844 owns get_model_names. The route-group task that owns _types.py litellm_native_routes decides which lens paths a non-admin key can reach before user_scope runs."
  - "The wave 17 Lens wiring part composes lens_admin_routes::router with B4505's router and mounts both; this task never mounts itself."
pitfalls:
  - user_scope(read) and user_scope(write) both return the all_teams scope, so for these routes get_lens never answers 404 from can_access; only B4505's worker scope can. Keep the check in get_lens anyway.
  - preview_sample builds the SourceReader before it calls user_scope, so a caller who is not an administrator gets 501 when tracing is off and 403 only when tracing is on.
  - A body that fails decoding is a 422 before the handler runs, so a non-admin key with a bad body gets 422, not 403.
  - update_finding copies status and reason from the body, and reason defaults to "". A request that sends only status clears the finding's old reason.
  - run_lens on a lens that already has a queued or running job returns 200 with the lens unchanged; there is no 409. A later run with new settings is dropped too.
  - update_lens bumps revision by 1 but leaves the queued job's own settings alone. Only a job queued after the update uses the new settings.
  - list_runs removes sample, findings and assessments from every job; read_run returns the full job. Do not strip in the repository call.
  - cancel_lens moves next_run_at to now plus the lens's interval_minutes, and it does so only when a queued or running job exists; with none it returns the lens untouched.
  - The activity availability route answers 200 with both flags false when tracing is off, while the preview and evidence routes answer 501; the agents route answers an empty list.
  - evidence_content calls get_lens before it parses the execution id, so a missing lens is 404 "Lens not found" and a bad id is 404 "Execution not found"; without a database both come after the 503.
  - The evidence route builds root_seen from the source (true only for "requests") and fills start_time with "" and span_count with 1; it does not read storage for them.
  - revoke_worker only looks at jobs inside lens.jobs with status "running"; a queued job has no worker_id and does not block revocation.
  - The register token is shown once. Store only the SHA-256 hex digest through save_worker and never log the token or the digest.
  - A lens with the id "agents", "activity" or "preview" can never be read through GET or POST because the static routes win; this matches LiteLLM, where the static routes are declared first.
  - Strings with min_length or max_length count characters, not bytes, so a worker name of 100 emoji is valid.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
