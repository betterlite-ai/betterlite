- tools/oracle/cases/routing/usage-v2-accounting/success-counted-once.yaml
deviations: []
out_of_scope:
- B318 owns final integration and the remaining functions listed in its implementation boundary.
- 'litellm/router_strategy/lowest_tpm_rpm_v2.py: B318 owns: LowestTPMLoggingHandler_v2._return_potential_deployments
  (L340-L391), LowestTPMLoggingHandler_v2._common_checks_available_deployment (L393-L452), LowestTPMLoggingHandler_v2.usage_counter_keys
  (L454-L465), LowestTPMLoggingHandler_v2.async_get_available_deployments (L467-L573), LowestTPMLoggingHandler_v2.get_available_deployments
  (L575-L672).'
- 'litellm/router_strategy/lowest_tpm_rpm_v2.py: B382 owns: PrefetchedUsage.covers (L51-L52), PrefetchedUsage.values_for
  (L54-L57), PrefetchedUsage.scoped (L61-L66), PrefetchedUsage.active (L69-L70).'
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
