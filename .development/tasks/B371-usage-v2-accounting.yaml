id: B371
title: Usage v2 reservation and callback accounting
description: 'Implement UsageV2Accounting with pre-call RPM increments and success TPM updates over B304
  counters. Preserve local/shared equality boundaries, counted-token metadata and storage-error fallbacks.
  B318 consumes this service but owns candidate ranking and request-prefetch consumption. Configuration
  boundary keys introduced or consumed here: ttl. Pinned declaration defaults: ttl=60. Resolve env values
  once in betterlite-config, never in router code. Usage v2 routing_strategy_args.ttl defaults to 60 seconds
  and its batched-write sync interval is explicitly 0.1 seconds, overriding the generic DEFAULT_REDIS_SYNC_INTERVAL.
  Implement the owned native service in crates/betterlite-router/src/usage_v2_accounting.rs. Add ProbeOperation::UsageV2Accounting
  in tools/oracle/src/router_probes/mod.rs and the corresponding B371 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/lowest_tpm_rpm_v2.py:
  LowestTPMLoggingHandler_v2.__init__ (L91-L99), LowestTPMLoggingHandler_v2.pre_call_check (L101-L174),
  LowestTPMLoggingHandler_v2.async_pre_call_check (L176-L250), LowestTPMLoggingHandler_v2.log_success_event
  (L252-L292), LowestTPMLoggingHandler_v2.async_log_success_event (L294-L338). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
scope:
  paths:
  - crates/betterlite-router/src/usage_v2_accounting.rs
  - crates/betterlite-router/src/usage_v2_accounting/**
  - crates/betterlite-router/src/lib.rs
  - crates/betterlite-router/src/error.rs
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/usage_v2_accounting.rs
  - crates/betterlite-server/src/routing/usage_v2_accounting/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/context.rs
  - tools/oracle/src/router_probes/usage_v2_accounting.rs
  - tools/oracle/src/router_probes/usage_v2_accounting/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/usage_v2_accounting.py
  - tools/oracle/cases/routing/usage-v2-accounting/**
  - crates/betterlite-config/src/lib.rs
  - crates/betterlite-config/src/loader.rs
  - crates/betterlite-config/src/raw.rs
  - crates/betterlite-config/tests/**
  - crates/betterlite-config/src/resolve.rs
  - crates/betterlite-config/src/types.rs
  - crates/betterlite-config/src/router.rs
  - crates/betterlite-config/src/usage_v2_accounting.rs
  - crates/betterlite-config/src/usage_v2_accounting/**
  - crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
  - crates/betterlite-config/fuzz/corpus/config_yaml/usage-v2-accounting-*
  - crates/betterlite-config/fuzz/Cargo.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L91-L338
  why: Implementation boundary verified against the pinned checkout.
dod:
- text: Write tests named usage_v2_accounting_behaviors and usage_v2_accounting_boundaries under usage_v2_accounting::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - usage-v2-accounting-behaviors
  - usage-v2-accounting-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/usage-v2-accounting-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/usage-v2-accounting-invalid.yaml;
    the valid seed contains ttl. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - usage-v2-accounting-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: usage-v2-accounting-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::usage_v2_accounting_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: usage-v2-accounting-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::usage_v2_accounting_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/usage_v2_accounting.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/usage_v2_accounting.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/usage-v2-accounting-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/usage-v2-accounting-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/usage-v2-accounting-" && grep -Fq 'ttl' crates/betterlite-config/fuzz/corpus/config_yaml/usage-v2-accounting-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/usage-v2-accounting/rpm-local-versus-shared-boundary.yaml
- tools/oracle/cases/routing/usage-v2-accounting/concurrent-last-slot.yaml
