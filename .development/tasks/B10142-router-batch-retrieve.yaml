    why: Owned. aretrieve_batch and its nested try_retrieve_batch, the order of the merged arguments and the error order.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L12041-L12078
    why: get_model_list always answers a list, which the model list port mirrors.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L12995-L13047
    why: async_get_healthy_deployments answers a dict for one named deployment and a list after the cooldown filter otherwise.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L3992-L4066
    why: _update_kwargs_with_deployment writes litellm_metadata and model_info on the copy, behind B6020's port.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/batch_utils.py#L153-L173
    why: The metadata key helper that answers litellm_metadata for this call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/batches_endpoints/endpoints.py#L724-L738
    why: Call site in B1051. The route takes this path for a unified id or the load balancing flag.
dod:
  - text: With a model the healthy list is asked with `retrieve-api-fake-text` and the `specific_deployment` taken out of the request; without one every deployment of the model list is tried and `specific_deployment` stays in the request.
    proof: [retrieve-calls]
  - text: Each try gets its own copy of the request, updated under `aretrieve_batch`, with `litellm_metadata.model_group` filled only when it is missing or empty, and the resolved provider replaces any `custom_llm_provider` the request carried.
    proof: [retrieve-calls]
  - text: The batch of the first deployment in list order is returned, even when an earlier deployment failed or answered a stream.
    proof: [retrieve-calls]
  - text: A deployment without `litellm_params.model` fails only its own try; the first recorded error comes back unchanged when no try finds the batch; LiteLLM's `No healthy deployments found.` and `Unable to find batch in any model. Received errors - []` texts are kept.
    proof: [retrieve-failures]
  - text: The server adapters return the router's model list in config order and leave a cooled-down deployment out of the healthy list, and `batch_retrieve` answers through a real router.
    proof: [retrieve-adapters]
checks:
  optional: []
  commands:
    - id: retrieve-calls
      why: the wrong list is asked, a try shares the request, the provider is not the deployment's, or the answer is not the first batch in list order
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_retrieve::/) - test(/failure/)'
    - id: retrieve-failures
      why: one bad deployment stops the search, the wrong error is returned, or LiteLLM's message text differs
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_retrieve::.*failure/)'
    - id: retrieve-adapters
      why: an adapter forwards to the wrong router call or drops the cooldown filter, or batch_retrieve cannot be built
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::router_calls::batch_retrieve::/)'
oracle_cases: []
deviations:
  - what: Each deployment's retrieve goes to the GenericCallExecutor the constructor was given, where LiteLLM calls the module function `litellm.aretrieve_batch`.
    why: betterlite has no module-level call table; the server route and the Python crate pass the provider read in, as the rules ask for constructor wiring.
out_of_scope:
  - "acreate_file, avector_store_create, acancel_batch, alist_batches and RouterBatchCalls: B8353, which reuses this task's two list ports and their server adapters. acreate_batch and _acreate_batch: B10143."
  - "retrieve_batch in litellm/proxy/batches_endpoints/endpoints.py and the aretrieve_batch executor over B1037's provider read: B1051. The Python method: B8355."
  - "get_model_list is B844's, async_get_healthy_deployments B016's, _update_kwargs_with_deployment B303's behind B6020's port, and get_llm_provider sits behind B6021's lookup. This task calls them."
  - "The `Router not yet initialized.` branch has no way in at the pin: get_model_list always answers a list, and async_get_healthy_deployments answers a deployment, a list or an error."
  - "send_llm_exception_alert, fired in the background when the method fails, returns at once without a router slack_alerting_logger, and betterlite refuses router_settings.alerting_config at load, so there is nothing to call."
pitfalls:
  - "`specific_deployment` leaves the request only on the path with a model; on the model list path it stays in and reaches every executor call."
  - "asyncio.gather keeps list order for the answers, but each try appends its error as it fails, so the batch is picked by lowest deployment index and the error by time; a FuturesUnordered over tries tagged with their index gives both."
  - "The request copy is spread last, so leaving its `custom_llm_provider` in place would let a client value override the deployment's provider; drop it from the copy and from data before adding the resolved one."
  - "The provider lookup runs only when the deployment names no provider, and it gets the model alone, without the deployment's api_base or key."
  - "When a model was given, `model_group` comes from the requested group name, not the deployment's `model_name`; the deployment's name is used only on the model list path."
  - "If every deployment answers with a stream or an Http outcome and none fails, the answer is the `Received errors - []` error, not a success."
  - "The healthy list adapter must go through the router's async path that applies cooldowns; the model list must not, so a cooled-down deployment is still in it."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
