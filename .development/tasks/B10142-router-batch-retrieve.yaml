id: B10142
title: Router batch retrieval across deployments
description: >-
  LiteLLM's proxy finds a batch through `Router.aretrieve_batch` when the batch id is a unified id or `litellm_settings.enable_loadbalancing_on_batch_endpoints` is true, and the Python `Router` has the same method. The route is B1051; the Python side reaches it through B8353's RouterBatchCalls and B8355. The router does not know which deployment created the batch, so it asks every deployment of the group at once and returns the first batch one of them knows. B1051 used to wait for all six of B8353's file and batch calls for this one method, so retrieval is its own task.


  Layout. The router logic goes in betterlite-sdk, module `router_batch_retrieve` (crates/betterlite-sdk/src/router_batch_retrieve.rs and its folder, tests in router_batch_retrieve/tests.rs). The server adapters go in betterlite-server, module `app::inference::router_calls::batch_retrieve` (crates/betterlite-server/src/app/inference/router_calls/batch_retrieve.rs and its folder, tests in batch_retrieve/tests.rs). Both files are empty stubs that lib.rs and router_calls.rs already declare; edit neither parent. betterlite-sdk may not depend on betterlite-router or betterlite-server (deny.toml), so the two router lookups this call needs are ports here, and the server module implements them.


  Ports. `ModelDeploymentList` has one method, `model_list(model_name: Option<&str>)`, which is LiteLLM's `Router.get_model_list(model_name)` without a team id and answers a `Vec` of deployments. `HealthyDeploymentList` has one async method, `healthy_deployments(model, messages, specific_deployment, request)`, which is `Router.async_get_healthy_deployments` and answers `HealthyAnswer::One(deployment)` when the request names one deployment (LiteLLM's dict answer) or `HealthyAnswer::Many(deployments)`. A deployment is a `serde_json::Map` in LiteLLM's DeploymentTypedDict shape: `model_name`, `litellm_params`, `model_info`. Keep both ports general, with an optional model name, because B8353 reuses them for `acreate_file` and `alist_batches`. Each port declares its own error type. The request update (B303's `_update_kwargs_with_deployment`) is B6020's port inside `RouterCompletionParts`; use it and do not declare a third trait. The provider lookup (LiteLLM's `get_llm_provider`) is the one B6021's generic attempt uses in the merged router_generic.rs; if router_generic.rs has none, stop and report a blocker instead of building a resolution context here.


  `RouterBatchRetrieve` is built by its constructor from a `&RouterCompletionParts` (B6020; only the request update is used), an `Arc<dyn ModelDeploymentList>`, an `Arc<dyn HealthyDeploymentList>` and one `Arc<dyn GenericCallExecutor>` (B6021's trait) for the call type `aretrieve_batch`. It touches no counter, slot, client or fallback executor, since LiteLLM's method uses none.


  `aretrieve_batch(model: Option<&str>, request: Map)` (router.py L6314-L6422), in order:

  1. The metadata key is `litellm_metadata`, what `_get_router_metadata_variable_name("aretrieve_batch")` answers because the name holds `batch`. The Rust copy of that helper is private to betterlite-core's batch_records module, so write the literal with a one-line comment naming the helper.

  2. With a model, take `specific_deployment` out of the request and ask the healthy list with that model, messages `[{"role":"user","content":"retrieve-api-fake-text"}]`, the taken value and the request. Without a model, take the whole model list (`model_list(None)`), and `specific_deployment` stays in the request. A list error goes back unchanged.

  3. `HealthyAnswer::One` is tried alone. An empty list fails with `No healthy deployments found.`.

  4. Every try runs at once. Read `litellm_params.model`; a deployment without one fails its try with `Model not found in litellm_params for deployment: ` followed by the deployment. Copy `litellm_params` as `data`. The provider is data's `custom_llm_provider` when it is set and not empty, otherwise the provider lookup on the model alone, with no provider hint. Deep copy the request and update the copy with the deployment through B6020's port under the function name `aretrieve_batch`. When the copy's `litellm_metadata.model_group` is missing, null or empty, set it to the requested model, or to the deployment's `model_name` when no model was given. Remove `custom_llm_provider` from the copy and from data. Call the executor with the call type `aretrieve_batch` and one map built in this order, later keys winning: data, then `custom_llm_provider` set to the provider, then the copy. An error anywhere in a try (lookup, update, executor) is recorded, and that try gives no answer.

  5. Return the answer of the first try, in deployment order, whose outcome is a finished JSON body; that is LiteLLM's `isinstance(result, LiteLLMBatch)`. A byte stream or an `Http` outcome is not a batch and is passed over. With no batch, return the first recorded error unchanged. With no batch and no error, fail with `Unable to find batch in any model. Received errors - []`.


  `BatchRetrieveError` is this module's error enum: one variant for each list port's error, one for `No healthy deployments found.`, one for `Unable to find batch in any model. Received errors - []`, one for the missing model, and one that carries a try's lookup, update or executor error as it came, so B1051's error mapping still sees the provider's status. The Display text of each LiteLLM message variant is the exact text above.


  Server adapters. In router_calls/batch_retrieve.rs write one plain struct per port that holds `state.shared.router` (an `Arc<RouterHandle>`) and reads the current router on every call, the way B8631's adapters in router_calls do. The model list adapter forwards to B844's `get_model_list(model_name, None)` in crates/betterlite-router/src/model_catalog_lookup/lookup.rs. The healthy list adapter forwards to B016's healthy deployment path in crates/betterlite-router/src/router_core/pipeline.rs (`healthy_deployments`), where `Candidates::Single` becomes `HealthyAnswer::One` and `Candidates::Pool` becomes `HealthyAnswer::Many`. Both turn each DeploymentSpec into the LiteLLM-shaped map above and map every router error into the port's error. `batch_retrieve(state: &ServerState, executor: Arc<dyn GenericCallExecutor>) -> Result<RouterBatchRetrieve, RouterPortError>` builds the object from B8631's `completion_parts(state)` (a function in router_calls.rs that this child module can call), the two adapters and the executor. The caller passes the executor, because the provider read is the caller's: B1051 builds it over B1037's provider read, and B8353 reuses the two adapters for its own calls.


  Tests. router_batch_retrieve/tests.rs drives the object with fake lists, a fake request update and fake executors, with no network and no clock. Every test of an error path has `failure` in its name and no other test does, so the two checks below select them apart. batch_retrieve/tests.rs builds a real Router from a two-deployment config.yaml the way router_calls/tests.rs does and checks that the model list returns both deployments in config order with their `model_name` and `litellm_params`, that the healthy list leaves out a deployment the router has cooled down while the model list keeps it, and that `batch_retrieve` with a recording executor returns the batch one deployment answers while the other fails.
scope:
  paths:
    - crates/betterlite-sdk/src/router_batch_retrieve.rs
    - crates/betterlite-sdk/src/router_batch_retrieve/**
    - crates/betterlite-server/src/app/inference/router_calls/batch_retrieve.rs
    - crates/betterlite-server/src/app/inference/router_calls/batch_retrieve/**
  lint_tables: false
references:
