id: B832
title: Model mutation fields and delegated write authority
description: >-
  Implement ModelPatch and ModelWriteAccess over stored model/team ownership, credential attachment permissions
  and AWS session-tag authority. Preserve clearable litellm_params and rate-limit requirements. Define
  an injected MemberRouterWrite policy hook for B378, which already depends on B060; configuring member
  router writes without its registration fails instead of granting authority. Remove the tuning license
  quota; do not read enterprise implementation. Inject the B068 PTU enablement flag into the model-info
  clear validation; do not read it from the environment in server code.


  Build the production model_write_fields module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  _canonical_session_tags (L1985-L1986; 2 source lines), ModelManagementAuthChecks.can_user_make_team_model_call
  (L1995-L2015; 21 source lines), ModelManagementAuthChecks.can_user_attach_credential (L2018-L2042; 25
  source lines), ModelManagementAuthChecks.can_user_set_aws_session_tags (L2045-L2064; 20 source lines),
  ModelManagementAuthChecks.allow_team_model_action (L2067-L2098; 29 source lines), ModelManagementAuthChecks.can_user_make_model_call
  (L2101-L2172; 63 source lines).


  Add the model_write_fields operation under B856 Management::models. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a model-write-fields-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 160 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  160 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 397 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
