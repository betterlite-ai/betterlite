id: B839
title: Public model groups and useful links
description: >-
  Implement /model_group/make_public and /model_hub/update_useful_links through ConfigRepository with
  source admin checks and typed fields. Useful link URLs are rendered data only; do not fetch them while
  validating or displaying settings.


  Build the production model_public_settings module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  update_public_model_groups (L2789-L2867; 54 source lines), update_useful_links (L2876-L2934; 40 source
  lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.public_model_groups=None.


  Register these actual HTTP routes and aliases exactly once: POST /model_group/make_public -> update_public_model_groups;
  POST /model_hub/update_useful_links -> update_useful_links. For each route send a typed successful request,
  an invalid or missing target, and a caller lacking that route permission through B001 HttpCase against
  the running pinned MIT proxy and betterlite. Public login/session routes instead prove bad credentials
  or invalid/expired codes. Compare status, response model including null/absent fields, error type/param/code,
  content-type, redirect/cookie headers and litellm-changed-by where read. Do not reduce endpoint checks
  to direct helper invocations. handle_exception_on_proxy controls management error mapping; keep source
  partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::model_public_settings::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 94 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  94 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 357 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
scope:
  paths:
    - crates/betterlite-server/src/model_public_settings.rs
    - crates/betterlite-server/src/model_public_settings/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/model-public-settings/**
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/fuzz/corpus/config_yaml/model-public-settings-*
    - crates/betterlite-config/src/sections/model_public_settings.rs
    - crates/betterlite-config/src/sections/model_public_settings/**
  lint_tables: false
