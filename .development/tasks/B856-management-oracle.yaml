id: B856
title: Management helper namespaces and comparison contracts
description: >-
  Extend B171's existing HelperCall with a closed Management namespace and the domain dispatch files
  models, auth, teams, users, keys, jwt and database. Domain
  operations are added by their task owners; this infrastructure must not depend on those callers.
  Bootstrap one protocol smoke operation Management::Models::PathEncoding that forwards B171's
  existing single/multi-segment encoder, without implementing a second encoder. Python invokes the
  same pinned MIT url_utils functions independently; this case proves namespace dispatch, not model
  authorization. Reject unknown domains, operations, unknown/duplicate input fields and malformed
  union tags through the actual HelperCase decoder before starting a child process.

  Preserve B171's bounded case/output/runtime, fresh child, env_clear allowlist, forced local model
  cost map, one JSON result on stdout and diagnostic stderr. Normal mode invokes native Rust and
  pinned Python separately; self-check invokes Python twice and must not satisfy the normal comparison
  test. Compare typed success or exception class/status/type/message/param/code, preserving missing
  versus null and string versus numeric codes. Keep ordered warning and typed effect sequences; no
  sorting of effects or blanket ignored error messages. compare.ignore remains explicit JSON pointers
  with a reason, and unknown pointers fail rather than silently hiding a mismatch.

  Secret-bearing effect fields are compared before diagnostic redaction. A changed credential still
  fails, but neither expected nor actual secret is printed in stdout/stderr/diff artifacts. Test equal
  secrets, unequal secrets and reordered effects separately; redacting both to the same placeholder
  before comparison would hide a mismatch. Domain adapters declare their typed secret fields rather
  than searching arbitrary JSON strings for credentials. No new database fixture or asyncpg dependency
  is needed for this dispatch work. Database operations are native Postgres tests or B860 booted HTTP
  cases; SELECT 1 is not a LiteLLM helper behavior and does not belong in the equality corpus.


  B860 retains all database fixture selection (POSTGRES_TEST_URL, otherwise testcontainers), isolation
  and HTTP effects. B001 remains the HTTP comparator. This task owns only management protocol records,
  dispatch and comparisons, with an added management seed in the existing helper_case corpus.


  Named tests are namespace_native_dispatch, namespace_python_dispatch, detects_changed_result,
  detects_effect_order, detects_warning_order, exception_null_and_code_types, rejects_unknown_domain,
  rejects_unknown_operation, rejects_duplicate_fields, rejects_unknown_fields, rejects_unknown_ignore,
  secret_mismatch_still_fails, redacts_secret_artifacts and self_check_is_not_native. There are no owned
  LiteLLM functions; budget 180 typed protocol/dispatch, 200 tests, 100 Python and 50 wiring lines,
  530 within 600. Extend B171's decoder/fuzz target instead of adding management_case.
scope:
  paths:
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/oracle/management_oracle.rs
    - tools/oracle/src/helpers/oracle/management_oracle/**
    - tools/oracle/helpers/management_oracle.py
    - tools/oracle/helpers/management_oracle/**
    - tools/oracle/fuzz/corpus/helper_case/management-*
    - tools/oracle/cases/helpers/management/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/url_utils.py#L96-L129
    why: The protocol smoke operation forwards B171's existing pure encoder on both sides.
dod:
  - text: Typed Management dispatch invokes separate Rust/Python operations and detects altered results,
      effects and secrets.
    proof:
      - behavior-tests
      - helper-python
      - oracle
  - text: The existing HelperCase production parser accepts the new management operation and rejects unknown
      fields.
    proof:
      - behavior-tests
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Management dispatch comparison tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::oracle::management_oracle::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The management dispatcher is missing or fails strict Python checks.
      run: test -f tools/oracle/helpers/management_oracle.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The extended production HelperCase decoder rejects its new management seed.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/management-*')" && grep -rlq management tools/oracle/fuzz/corpus/helper_case/management-* && cargo nextest run
        --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/management/model-path-reserved-characters.yaml
  - tools/oracle/cases/helpers/management/model-path-multisegment-unicode.yaml
deviations: []
out_of_scope:
  - Product Postgres repositories and migration behavior belong to B700 and the other database tasks.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as management_oracle in the oracle group. Replace the stub Op in tools/oracle/src/helpers/oracle/management_oracle.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/management_oracle.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Comparing already-redacted effects makes two different credentials appear equal.
  - A successful Python self-check does not exercise the native management dispatcher.
budget:
  max_changed_lines: 600
  max_new_expects: 0
review_level: security
