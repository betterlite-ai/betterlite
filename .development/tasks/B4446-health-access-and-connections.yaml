dod:
  - text: >-
      Access filtering preserves admin/non-admin visibility, team scoping, and caller-specific model grants without
      mutating shared cached results.
    proof: [health-access-tests, oracle, health-access-corpus]
  - text: >-
      Connection tests validate os.environ/ rejection, resolve deployment by ID/name/model-string in order,
      strip mismatched credentials, inherit config parameters, authorize final model calls, and return HTTP 200/error
      for probe errors and HTTP exceptions for validation failures.
    proof: [health-access-tests, oracle, health-access-corpus]
  - text: >-
      Request body and response filtering protect credentials and admin-only fields across all routes.
    proof: [health-access-tests, health-access-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: health-access-tests
      why: Health access filtering or connection test behavior is incorrect or incomplete.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_access_and_connections::tests::/)'
    - id: health-access-corpus
      why: The HTTP-case decoder does not replay the new health-access fixture requests.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/http_case/health-access-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
