id: B4446
title: Scope health visibility and authorize model connection tests
description: >-
  Build health access filtering and credential-safe connection-test preparation in betterlite-server,
  registering POST /health/test_connection. Keep final model-call authorization after health override
  preparation so health_check_params cannot retarget an already authorized probe.

  Proxy-admin and view-only roles both see routing fields (api_base, api_version, aws_bedrock_runtime_endpoint),
  returned in admin-only response payloads. Ordinary callers cannot probe another team's deployment, including
  callers with no team; scoped admin keys still obey their model grants. Cached filtering drops endpoints
  without model_id, shallow-copies rows for filtering, and recalculates counts.

  Connection tests require a DB and reject nested request os.environ/ references with HTTP 400.
  Prefer supplied deployment ID, then proxy model name, then provider model string for lookup. Router lookup
  failure logs and falls back to request parameters only. A different named litellm_credential_name, or any
  disallowed client connection field, strips the configuration's credential and destination fields before
  parameter overlay. Loaded model_info wins over supplied model_info. Preserve HTTP 200 with status error for
  a returned probe error, HTTP exceptions for validation/authorization failures.

  Build the production betterlite-server module in health_access_and_connections, with route registration and
  domain helpers. Reuse the typed dependencies listed in the backlog. Bounded request body decoder and access
  filtering use shared types; connection-test schema needs a fuzzed typed boundary.

  Production ownership, including fields and protocol contracts as native types: litellm/proxy/health_endpoints/_health_endpoints.py:
  _reject_os_environ_references (L87-L117; 22 source lines), _request_inherits_config_credentials (L129-L149; 11 source
  lines), _config_base_for_health_check (L152-L173; 8 source lines), _is_proxy_admin (L921-L933; 6 source lines),
  _strip_admin_only_fields_from_health_result (L936-L950; 8 source lines), _health_accessible_model_names
  (L953-L968; 15 source lines), _caller_may_probe_deployment (L971-L988; 17 source lines), _resolve_targeted_model_ids
  (L991-L1014; 12 source lines), _filter_health_check_results_by_model_ids (L1017-L1039; 11 source lines),
  test_model_connection (L2016-L2234; 132 source lines).

  Owns _CONFIG_CONNECTION_FIELDS at (L120-L126) and _PROXY_ADMIN_ROLES at (L909-L918), 13 counted lines.
  **Count: 255 = 242 function + 13 declaration lines.**

  Direct dependencies:

  - B052: user_api_key_auth on the POST /health/test_connection route.
  - B322: Router._deployment_usable_by_team for team ownership checking in _caller_may_probe_deployment.
  - B401: Deployment.__init__ for native deployment construction in the route.
  - B747: _resolve_key_models_for_auth_check for model-list filtering.
  - B759: get_key_models for scoped model resolution.
  - B832: ModelManagementAuthChecks.can_user_make_model_call for final model-call authorization.
  - B844: Router.get_deployment, get_model_list, get_model_names, should_include_deployment for catalog lookup.
  - B847: Router.get_model_access_groups for model access group resolution.
  - B884: _BANNED_REQUEST_BODY_PARAMS table, a direct data dependency for client credential fields.
  - B4441: deployments_targeted_by_name, _update_litellm_params_for_health_check, run_with_timeout,
    _clean_endpoint_data, and the admin-only display-field set (ADMIN_ONLY_HEALTH_DISPLAY_PARAMS).

  Preserve proxy-admin role check for both full and view-only admins; non-admin callers see health status
  without provider routing detail. Connection tests with no router fallback to request parameters, logging
  misses without erroring. Decoded request body limits respect proxy-configured bounds. Credentials remain
  secret types and never leak to logs. Decode bounded request bytes with a fuzzed typed schema; preserve
  HTTP 200 with status error for probe errors and HTTP exceptions for validation/authorization.

  The direct ahealth_check invocation and credential-field catalog ownership gaps are noted; B884 existing
  rejection of request URLs overrides LiteLLM's opt-in URL behavior—do not permit outbound URLs through
  this route.

