deviations: []
out_of_scope:
  - >-
    litellm/proxy/health_endpoints/_health_endpoints.py: Other tasks own remaining health endpoint functions. B4441 owns
    deployment targeting and param resolution (deployments_targeted_by_name, _update_litellm_params_for_health_check).
    B4443 owns perform_health_check and health-cycle execution. B4445 owns database persistence. B130 (the umbrella) owns
    the main /health and /health/latest routes. The direct ahealth_check invocation (L2212) and credential-field catalog
    (_ADMIN_CONFIG_FIELDS_TO_CLEAR_ON_BASE_OVERRIDE, clientside_credential_keys) ownership is noted in questions.
pitfalls:
  - >-
    Connection test authorization happens after parameter merging and health-check override preparation, so an overridden
    model_info or litellm_params must still pass the final model-call authorization check; do not short-circuit auth
    based on earlier parameter resolution.
  - >-
    The os.environ/ prefix check must traverse nested dicts and lists to reject environment references anywhere in the
    request, not just at the top level.
  - >-
    Cached background health results are copied before filtering so that filtering operations cannot mutate the shared
    cache; copies must be shallow, but endpoint-list modifications must not propagate back.
  - >-
    Credential stripping happens when a request names a different litellm_credential_name or supplies any disallowed
    client connection field; preserve the distinction between no credential name (blank) and a different one (mismatch).
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
