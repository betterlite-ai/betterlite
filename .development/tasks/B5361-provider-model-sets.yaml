id: B5361
title: Provider model sets and the remaining capability flags
description: >-
  LiteLLM keeps one Python set of model names per provider, filled from the cost map, and a map from provider name to
  those sets. `validate_environment`, `register_model` and the Python module all read them. Build them in
  `crates/betterlite-models/src/provider_model_sets.rs` as a `ProviderModelSets` struct the caller owns. No static, no
  global.


  `ProviderModelSet` is a closed enum with one variant per set declared at litellm/__init__.py L602-L718. A table maps
  each `litellm_provider` value to its variant, replacing the if and elif chain of `_populate_provider_model_sets`
  (L753-L1006). The branches that do more than add the key stay as code: openai skips fine-tune keys
  (`is_openai_finetune_model`, L740-L751), bedrock skips `mode` "guardrail" and pricing-only keys
  (`is_bedrock_pricing_only_model`, L720-L738), eleven Vertex branches strip "vertex_ai/" from the key, one branch splits
  on `mode` "chat", and two branches skip names holding "-to-". `add_known_models`
  (L1009-L1017) folds a cost map into the sets and rebuilds the by-provider map, so it becomes a method taking a
  `ModelCatalog`. `_build_models_by_provider` (L1144-L1257) becomes a method returning
  `BTreeMap<String, BTreeSet<String>>`, with unions such as "openai" built from the chat and text sets.


  Also build the capability flags no task owns yet, in `crates/betterlite-models/src/model_capability_flags.rs`. At the
  pin each is one call to `_supports_factory` with a key, so don't write eleven one-line functions. Make a closed enum
  `ModelCapabilityFlag` whose variants name the keys, and one function taking the model, the provider and the flag that
  calls B2221's Rust form of `_supports_factory` in `model_capability_predicates`. The keys are `supports_web_search`,
  `supports_url_context`, `supports_audio_input`, `supports_pdf_input`, `supports_audio_output`,
  `supports_prompt_cache_breakpoint`, `supports_thinking_cache_preservation`, `supports_computer_use`, `supports_vision`,
  `supports_anthropic_thinking_payload` and `supports_embedding_image_input`. `is_vision_explicitly_disabled` is the same
  idea over `is_explicitly_disabled_factory` with the key `supports_vision`.


  The oracle operation is `b5361`. For sets its Python adapter calls `litellm.add_known_models(fixture_map)` after
  clearing the sets and reports them sorted. For flags it calls the `litellm.utils` function on a fixture model.
scope:
  paths:
  - crates/betterlite-models/src/provider_model_sets.rs
  - crates/betterlite-models/src/provider_model_sets/**
  - crates/betterlite-models/src/model_capability_flags.rs
  - crates/betterlite-models/src/model_capability_flags/**
  - tools/oracle/cases/helpers/provider-model-sets/**
  - "tools/oracle/fuzz/corpus/helper_case/provider_model_sets-*"
  - tools/oracle/helpers/b5361.py
  - tools/oracle/helpers/b5361/**
  - tools/oracle/src/helpers/models/b5361.rs
  - tools/oracle/src/helpers/models/b5361/**
  lint_tables: false
