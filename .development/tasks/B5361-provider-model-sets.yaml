dod:
- text: >-
    Filling the sets from a fixture cost map gives the same names per set as LiteLLM, with Bedrock pricing-only keys and
    OpenAI fine-tune keys treated as `_populate_provider_model_sets` treats them.
  proof: [model-sets, oracle, helper-python]
- text: The by-provider map has the same keys and the same names per key as `_build_models_by_provider`.
  proof: [models-by-provider, oracle, helper-python]
- text: >-
    The eleven flags and `is_vision_explicitly_disabled` give LiteLLM's answer for a model that declares the flag, one that declares it
    false and one with no catalog entry.
  proof: [capability-flags, oracle, helper-python]
- text: New helper corpus seeds call `b5361` and replay through the shared parser.
  proof: [helper-case-corpus]
checks:
  optional:
  - mutants
  commands:
  - id: model-sets
    why: A provider value lands in the wrong set, or a skip rule is lost.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^provider_model_sets::.*fill/)'
  - id: models-by-provider
    why: A union or a key of the by-provider map is wrong.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^provider_model_sets::.*by_provider/)'
  - id: capability-flags
    why: A flag is absent or disagrees with the source on a false or missing declaration.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^model_capability_flags::/)'
  - id: helper-python
    why: The b5361 adapter is absent or does not pass ruff and basedpyright.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5361)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers/b5361 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5361/pyrightconfig.json
  - id: helper-case-corpus
    why: No new b5361 seed exists, or a seed does not parse.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/provider_model_sets-*")"
      && grep -lE '^[[:space:]]+b5361:' tools/oracle/fuzz/corpus/helper_case/provider_model_sets-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/provider-model-sets/fill-from-cost-map.yaml
- tools/oracle/cases/helpers/provider-model-sets/skip-rules.yaml
- tools/oracle/cases/helpers/provider-model-sets/by-provider-unions.yaml
- tools/oracle/cases/helpers/provider-model-sets/capability-flags.yaml
- tools/oracle/cases/helpers/provider-model-sets/vision-disabled.yaml
deviations:
- what: The sets live in a struct the caller holds, where LiteLLM has module globals.
  why: >-
    The inject-dependencies rule bars globals. The Python package in B157 still shows them as module attributes through
    the native call B5369 adds.
out_of_scope:
- Exposing the sets as Python attributes is B157, and the native call behind it is B5369.
- Adding one registered model to the sets happens inside `register_model` in B5365, through a method here.
- >-
  `get_supported_regions` L3081-L3121 has no caller at the pin, so it isn't built. The capability functions listed in
  B2221's description stay there. The rest of litellm/__init__.py is B157, and the owner of anything else in
  litellm/utils.py is in the B157 inventory.
pitfalls:
- >-
  The chain is one if and elif ladder, so a key lands in one set at most and the first match wins. The bedrock guardrail
  branch runs before the pricing-only branch. Keep that order when you fold the rows into the table.
- Keep the set order out of any output. Sets in Python have no order, and the helper sorts before comparing.
- >-
  `is_vision_explicitly_disabled` is not the inverse of `supports_vision`: a missing declaration reads as not disabled
  and also as not supported.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
