dod:
  - text: The supported list, its order and the tool, tool_choice and reasoning gates match LiteLLM.
    proof: [fw-params-tests, oracle, helper-python]
  - text: Param mapping covers tool_choice required, response_format with tools, max_completion_tokens, reasoning_effort forms and the thinking conflict.
    proof: [fw-params-tests, oracle]
  - text: extra_body translation covers strip, truncate, chat_template_kwargs and guided params with their precedence rules.
    proof: [fw-params-tests, oracle]
  - text: The new helper cases replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: fw-params-tests
      why: A supported-list gate, a mapping branch or an extra_body rule is missing.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_chat_params::/)'
    - id: helper-python
      why: The strict oracle adapter lint or type checks fail.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b6071.py)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Newly added cases are absent or do not replay.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/fireworks_ai_chat_params-*")" &&
        grep -lE '^[[:space:]]+b6071:' tools/oracle/fuzz/corpus/helper_case/fireworks_ai_chat_params-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/supported-list-gates.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/param-mapping.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/reasoning-effort-forms.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/thinking-conflict.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/response-format-with-tools.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/extra-body-strip-and-truncate.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/chat-template-kwargs.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat-params/guided-params.yaml
deviations: []
out_of_scope:
  - B2222 owns the capability lookups and B2221 the supports_* predicates; this task only calls them.
  - B6072 owns validate_environment, message and tool cleanup, request and response transforms, the stream handler and get_models.
  - B159 owns Python class-attribute assignment for the settings constructor.
  - B041 wires the config into dispatch and the HTTP cases.
pitfalls:
  - The tool_choice, response_format, max_completion_tokens and reasoning_effort branches of map_openai_params are not gated on the supported list, so they apply to models that do not list them.
  - A reasoning_effort of "auto" is dropped and False becomes "none", while a map without an "effort" key becomes None and is dropped.
  - capability_exact returning False does not stop the gate, because the source uses "or" with the predicate, so the predicate can still add tool_choice or reasoning params.
  - is_tools_set reads non_default_params, not optional_params, so tools mapped earlier in the loop do not count.
  - guided params are ignored when response_format is in either optional_params or extra_body, even when that value is null.
  - truncate_prompt_tokens is skipped when prompt_truncate_len exists in extra_body, so the truncate value is then consumed and lost, not passed on.
  - The promoted entries are spread after optional_params, so a promoted reasoning_effort or response_format can only be added when the checks above found none.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
