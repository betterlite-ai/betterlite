dod:
  - text: "AzureSentinelLogger initializes with required environment variables and raises ValueError if any required var is missing."
    proof: [sentinel-init-test, sentinel-init-oracle]

  - text: "AZURE_SENTINEL_DCR_IMMUTABLE_ID and AZURE_SENTINEL_ENDPOINT are required; missing either raises ValueError."
    proof: [sentinel-env-test, sentinel-env-oracle]

  - text: "Authority host normalization strips trailing slashes and prepends https:// to bare hosts; login.microsoftonline.us maps to https://monitor.azure.us/.default."
    proof: [sentinel-authority-test, sentinel-authority-oracle]

  - text: "OAuth token is cached and refreshed with 60-second margin before expiry; default token lifetime is 3,600 seconds if expires_in is missing."
    proof: [sentinel-token-test, sentinel-token-oracle]

  - text: "async_log_success_event and async_log_failure_event both queue StandardLoggingPayload to model queue and trigger threshold send at batch size."
    proof: [sentinel-model-event-test, sentinel-model-event-oracle]

  - text: "When kwargs lacks standard_logging_object, async_log_success_event and async_log_failure_event log a warning and return without queuing, leaving log_queue unchanged and not triggering a send."
    proof: [sentinel-model-event-missing-payload-test, sentinel-model-event-missing-payload-oracle]

  - text: "async_log_audit_log_event queues StandardAuditLogPayload to audit queue and triggers threshold send at batch size."
    proof: [sentinel-audit-event-test, sentinel-audit-event-oracle]

  - text: "Batch sending splits above 1,000,000 UTF-8 bytes or batch_size count, accepts 200/204 responses, and requeues undelivered before new arrivals."
    proof: [sentinel-batch-test, sentinel-batch-oracle]

  - text: "Requeue truncates oldest items when total length exceeds max_queue_size, with warning logged and count of dropped records."
    proof: [sentinel-requeue-test, sentinel-requeue-oracle]

  - text: "Cancellation remainder is retained; delivered halves are never resubmitted after cancellation."
    proof: [sentinel-cancel-test, sentinel-cancel-oracle]

