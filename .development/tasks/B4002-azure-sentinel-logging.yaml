deviations:
  - what: "Azure Sentinel logging uses separate model and audit log queues with independent max_queue_size enforcement."
    why: "LiteLLM uses two separate queue attributes; betterlite reuses the same enforcement mechanism per queue."

  - what: "Audit stream defaults to the model stream name if not explicitly provided."
    why: "LiteLLM's default_audit_stream_name assignment uses the resolved model stream as fallback; matches the pinned behavior."

out_of_scope:
  - "Generic OAuth/credential caching beyond the token cache built directly here; B673 and B677 provide Entra token services for other components."
  - "Connection pooling beyond the httpx client management; httpx owns internals."
  - "Monitoring or observability beyond verbose_logger calls and exception logging."
  - "Callback registration or dispatch routing; B189 owns the callback registry."

pitfalls:
  - "AZURE_SENTINEL_TENANT_ID and AZURE_SENTINEL_CLIENT_ID must be non-empty or the client_credentials flow will fail at token request time."
  - "OAuth token refresh uses a 60-second margin; time.time() < token_expiry - 60 is the check, so a token expiring in exactly 61 seconds will not refresh on the next request."
  - "The audit stream defaults to the model stream, not to Custom-LiteLLM; it only defaults to Custom-LiteLLM if both model stream and audit stream are unset."
  - "Authority host normalization prepends https:// to bare hosts like 'login.microsoftonline.com'; urlparse().hostname on the result is the key for oauth_scope lookup."
  - "Model events check kwargs.get('standard_logging_object', None) and log the exact warning 'Azure Sentinel: standard_logging_object not found in kwargs' before returning early without appending to log_queue or checking batch size. Audit events receive pre-validated typed parameters and queue unconditionally."
  - "Requeue prepends undelivered items from the failed batch before new arrivals, then trims from the end if overflow exceeds max_queue_size; the order is: [undelivered, new arrivals][0 : max_size]."
  - "Batch size is inherited from CustomBatchLogger (default 512); exceeding it OR exceeding 1,000,000 UTF-8 bytes triggers split."
  - "The Logs Ingestion API returns 200 for success and 204 for success with no body; both are treated as successful delivery."
  - "Cancellation exceptions (BatchSendCancelled, asyncio.CancelledError) restore the batch and mark the awaiting_retry flag; permanent errors log and clear the queue."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
