id: B4002
title: Deliver Azure Sentinel model and audit batches
description: >-
  Implement Azure Sentinel logging with independent model and audit log queues,
  OAuth bearer-token authentication, and recursive batch splitting on payload size.
  Build on CustomBatchLogger, handling dual-queue lifecycle with configurable stream names
  and azure-specific authority hosts.

  Read AZURE_SENTINEL_DCR_IMMUTABLE_ID (required), AZURE_SENTINEL_STREAM_NAME (default:
  Custom-LiteLLM), AZURE_SENTINEL_AUDIT_STREAM_NAME (default: AZURE_SENTINEL_STREAM_NAME),
  AZURE_SENTINEL_ENDPOINT (required), AZURE_SENTINEL_TENANT_ID or AZURE_TENANT_ID (required),
  AZURE_SENTINEL_CLIENT_ID or AZURE_CLIENT_ID (required), AZURE_SENTINEL_CLIENT_SECRET or
  AZURE_CLIENT_SECRET (required), and AZURE_SENTINEL_AUTHORITY_HOST or AZURE_AUTHORITY_HOST
  (default: https://login.microsoftonline.com) from B002. Use B256 for batch constructor
  and periodic-flush wiring; B173 for async HTTP POST; B192 for safe_dumps. Logs inherit
  from CustomBatchLogger and queue StandardLoggingPayload; audit logs queue StandardAuditLogPayload
  in a separate queue.

  Model events (async_log_success_event, async_log_failure_event) check kwargs for standard_logging_object
  and return early with a verbose_logger.warning when it is absent, leaving log_queue unchanged and not
  triggering a threshold send. Audit events (async_log_audit_log_event) receive a typed audit payload
  parameter and queue it unconditionally without checks. Normalize authority hosts by stripping trailing
  slashes and prepending https:// to bare hosts. Map known hosts (login.microsoftonline.com,
  login.microsoftonline.us) to their Azure Monitor scopes, falling back to https://monitor.azure.com/.default
  for unknown hosts. OAuth tokens are cached and refreshed 60 seconds before expiry; expiry defaults to
  3,600 seconds if omitted. The Logs Ingestion API uses version 2023-01-01, accepts 200/204 responses,
  and splits batches above 1,000,000 UTF-8 bytes or batch_size count. Requeue survivors before new
  arrivals, cap model and audit queues independently at max_queue_size, and never resubmit delivered
  halves after cancellation. The logger registers as a callback and receives model/audit dispatch.

