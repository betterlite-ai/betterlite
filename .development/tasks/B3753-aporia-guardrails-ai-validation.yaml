checks:
  optional: []
  commands:
    - id: aporia-guardrails-tests
      why: Aporia guardrail tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^aporia_guardrail::/)'
    - id: aporia-oracle
      why: Aporia cases do not match LiteLLM on client response or provider requests
      run: cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/guardrails/
    - id: guardrails-ai-tests
      why: Guardrails AI tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrails_ai_guardrail::/)'
    - id: guardrails-ai-oracle
      why: Guardrails AI cases do not match LiteLLM on client response or provider requests
      run: cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/guardrails/
