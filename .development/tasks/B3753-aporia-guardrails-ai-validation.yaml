  - tools/oracle/cases/guardrails/aporia-moderation-blocked.yaml
  - tools/oracle/cases/guardrails/aporia-post-call.yaml
  - tools/oracle/cases/guardrails/guardrails-ai-init.yaml
  - tools/oracle/cases/guardrails/guardrails-ai-llmoutput.yaml
  - tools/oracle/cases/guardrails/guardrails-ai-inputs.yaml
  - tools/oracle/cases/guardrails/guardrails-ai-blocked.yaml
deviations:
  - what: >-
      When APORIO_API_KEY or APORIO_API_BASE is missing from environment and not
      provided to __init__, LiteLLM raises an uncaught KeyError from __init__
      (not caught by init_guardrails.py's ValueError/TypeError handler). Betterlite's
      behavior differs in how that error is surfaced and handled during initialization.
    why: >-
      Framework initialization is unresolved (F); betterlite's error handling
      strategy during guardrail construction differs from LiteLLM's uncaught propagation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/aporia_ai/aporia_ai.py#L47-L52
  - what: >-
      When should_proceed_based_on_metadata is not available, betterlite skips the
      during_call validation entirely, whereas LiteLLM still evaluates the guardrail.
    why: >-
      Metadata routing framework is unresolved (M); the decision to run is delegated
      to the framework until this helper is owned and called.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/aporia_ai/aporia_ai.py#L189-L206
  - what: >-
      When GUARDRAILS_AI_API_BASE is missing from environment, betterlite uses the
      default http://0.0.0.0:8000, same as LiteLLM, but betterlite requires guard_name
      at construction time and raises if not provided.
    why: >-
      Framework initialization requires guard_name; LiteLLM allows deferred lookup
      but betterlite enforces upfront validation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/guardrails_ai/guardrails_ai.py#L51-L67
  - what: >-
      GuardrailsAI.make_guardrails_ai_api_request_pre_call_request includes a comment
      that this branch does not work with current GuardrailsAI API version and is
      retained for backward compatibility only.
    why: >-
      Legacy API support is retained per LiteLLM at the pinned commit; the "inputs"
      format may not work but is preserved as configured.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/guardrails_ai/guardrails_ai.py#L100-L102
out_of_scope:
  - >-
      Guardrail decorator registration, CustomGuardrail.__init__, should_run_guardrail,
      get_guardrail_dynamic_request_body_params, and log_guardrail_information; owned by B104 (F).
  - >-
      get_async_httpx_client, AsyncHTTPHandler.post, and module_level_aclient.post
      HTTP transport primitives; owned by shared infrastructure (H).
  - >-
      convert_litellm_response_object_to_str response serialization; owned by an
      unresolved logging owner (L).
  - >-
      should_proceed_based_on_metadata metadata routing decision; owned by an
      unresolved metadata owner (M).
  - >-
      add_guardrail_to_applied_guardrails_header callback header registration;
      owned by an unresolved callback owner (A).
  - >-
      get_content_from_model_response and get_last_user_message/set_last_user_message
      response and message extraction; owned by B218 and B219 respectively.
  - >-
      Request/response routing and framework dispatch; those come from the guardrail
      lifecycle in B104.
pitfalls:
  - >-
      Only Aporia's async_moderation_hook (during_call) transforms roles via
      transform_messages; async_post_call_success_hook (post_call) passes the raw,
      untransformed messages from data.get("messages", []) directly to the API.
  - >-
      APORIO_API_KEY and APORIO_API_BASE are the runtime environment variable names
      in LiteLLM; the config field names are spelled differently (api_key, api_base),
      so do not copy the env var names into config defaults.
  - >-
      Aporia action "block" must raise HTTPException 400, not any other status code.
      Non-200 HTTP status also raises 400 with full response detail.
  - >-
      GuardrailsAI.process_input returns modified data dict, and the result is used
      directly as the request data for downstream processing; do not modify messages
      in place without returning the updated data.
  - >-
      The "inputs" API format payload requires an inputs list with exact structure
      (name, shape, data, datatype); the comment states this format does not work
      with current API but must be retained as written.
  - >-
      GuardrailsAI sets validationPassed=false (note the lowercase 'f'), not False or
      false; the TypedDict field name matches the API response exactly.
  - >-
      When get_last_user_message returns None, process_input returns data unchanged,
      not an error or empty dict; the caller handles missing text gracefully.
  - >-
      Both make_guardrails_ai_api_request and make_guardrails_ai_api_request_pre_call_request
      use litellm.module_level_aclient (global async client), not self.async_handler;
      this is preserved from LiteLLM even though Aporia uses self.async_handler.
review_level: standard
