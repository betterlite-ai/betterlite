id: B3753
title: Aporia moderation and Guardrails AI validation
description: >-
  Build Aporia's and Guardrails AI's guardrail implementations. Aporia validates
  requests and responses via its HTTP API with role-filtered message transformation,
  stores action "block" as HTTPException 400, and integrates through pre-call and
  post-call lifecycle hooks. Preserve the runtime environment variable spelling
  APORIO_API_KEY and APORIO_API_BASE despite their different spelling in config
  descriptions. Guardrails AI validates messages via two API formats ("inputs" and
  "llmOutput"), rewrites the last user message with the validated output, and
  integrates as a pre-call hook that also runs as a logging hook. Keep the legacy
  "inputs" payload branch because process_input calls it when configured.

  Aporia role transformation filters messages to supported OpenAI roles (system,
  user, assistant), replacing unsupported roles (tool, etc.) with a placeholder
  role called "other". The prepare_aporia_request method sets validation_target
  to "prompt", "response", or "both" based on what content is present. Aporia uses
  async_handler (initialized in __init__) to POST to {api_base}/validate with
  X-APORIA-API-KEY header and application/json content type; non-200 responses or
  action "block" raise HTTPException 400. Both hooks call should_run_guardrail with
  their event type (during_call, post_call) and should_proceed_based_on_metadata
  for the during_call path.

  Guardrails AI accepts a required guard_name, optional api_base (env
  GUARDRAILS_AI_API_BASE, default http://0.0.0.0:8000), and optional
  guardrails_ai_api_input_format ("inputs" or "llmOutput", default "llmOutput").
  process_input validates message presence, calls get_last_user_message, skips if
  None or not a completion/acompletion call type, then calls one of two API methods
  based on format and replaces the last message with set_last_user_message.
  make_guardrails_ai_api_request POSTs {llmOutput} and on validationPassed=false
  raises HTTPException 400. make_guardrails_ai_api_request_pre_call_request (the
  "inputs" branch) POSTs an inputs list with one text element, parses the outputs
  array, and returns outputs[0].data[0]; this branch includes a comment that it
  does not work with the current API version.
scope:
  paths:
    - crates/betterlite-guardrails/src/aporia_guardrail.rs
    - crates/betterlite-guardrails/src/aporia_guardrail/**
    - crates/betterlite-guardrails/src/guardrails_ai_guardrail.rs
    - crates/betterlite-guardrails/src/guardrails_ai_guardrail/**
    - tools/oracle/helpers/b3753.py
    - tools/oracle/helpers/b3753/**
    - tools/oracle/src/helpers/guardrails/b3753.rs
    - tools/oracle/src/helpers/guardrails/b3753/**
  lint_tables: false
