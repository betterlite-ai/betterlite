dod:
  - text: GET /.well-known/litellm-ui-config and GET /litellm/.well-known/litellm-ui-config return the same JSON with the nine fields in LiteLLM's order, without an Authorization header.
    proof: [discovery-tests, oracle]
  - text: server_root_path is the scalar SERVER_ROOT_PATH and proxy_base_url is PROXY_BASE_URL untouched, null when unset and "" when set but empty.
    proof: [discovery-tests, oracle]
  - text: auto_redirect_to_sso is true only when sso_configured is true and either AUTO_REDIRECT_UI_LOGIN_TO_SSO or general_settings.auto_redirect_ui_login_to_sso is true.
    proof: [discovery-tests, config-tests, oracle]
  - text: admin_ui_disabled follows DISABLE_ADMIN_UI and mcp_stdio_enabled follows LITELLM_ENABLE_MCP_STDIO, both false by default.
    proof: [config-tests, oracle]
  - text: sso_configured and hide_default_credentials_hint are copied from the inputs the server fills from B881 and B799.
    proof: [discovery-tests, oracle]
  - text: A non-empty worker registry gives is_control_plane true and lists each worker; an empty one gives false and an empty list.
    proof: [discovery-tests]
  - text: is_mcp_stdio_flag_key matches LITELLM_ENABLE_MCP_STDIO in any case and nothing else.
    proof: [config-tests]

checks:
  optional: []
  commands:
    - id: discovery-tests
      why: the response model, the field rules or the two routes are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^ui_discovery::/)'
    - id: config-tests
      why: the ui_discovery section does not load its env variables and key, or the flag key check is wrong
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::ui_discovery::/)'

