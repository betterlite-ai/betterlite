  - tools/oracle/cases/helpers/ui-discovery/base-url-and-root-path.yaml
  - tools/oracle/cases/helpers/ui-discovery/auto-redirect-needs-sso.yaml
  - tools/oracle/cases/helpers/ui-discovery/auto-redirect-from-settings.yaml
  - tools/oracle/cases/helpers/ui-discovery/admin-ui-and-stdio-flags.yaml
  - tools/oracle/cases/helpers/ui-discovery/hide-credentials-hint.yaml

deviations:
  - what: sso_configured, hide_default_credentials_hint and the other env flags are read once at startup, not on every request.
    why: betterlite reads the environment only in the config crate and keeps no per-request environment lookups. A user who changes the variable must restart the proxy.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/discovery_endpoints/ui_discovery_endpoints.py#L14-L46
  - what: workers is empty today, because no loader for the worker_registry config key exists in betterlite.
    why: LiteLLM raises at startup for worker_registry unless the proxy has a paid license, and the oracle runs without one, so there is nothing to compare. The response type and the control plane rule are built and tested natively.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7092-L7098

out_of_scope:
  - "get_server_root_path, get_request_root_path and PerRequestRootPathMiddleware (per_request_root_path_middleware.py, proxy/utils.py get_server_root_path): B4200, already built. This task reads its section."
  - "get_proxy_base_url, get_custom_url and join_paths in proxy/utils.py: B7323. The discovery document returns the raw variable."
  - "has_user_setup_sso: B881. should_hide_default_credentials_hint: B799."
  - "is_mcp_stdio_blocked, warn_if_mcp_stdio_blocked and MCP_STDIO_DISABLED_MESSAGE in stdio_gate.py: B4716 builds them next to its StdioPolicy (B136 covers the file)."
  - "WorkerRegistryEntry (control_plane_endpoints.py): B4470."
  - "Every other function in proxy/utils.py: B124 and the tasks split from it."
  - "The worker_registry config loader and its premium gate (proxy_server.py L7092-L7098): B124 umbrella, no task owns it yet."
  - "Mounting the router into the app and the HTTP oracle cases for the two paths: B078."
  - "discovery_endpoints/README.md is documentation only and has no code."

pitfalls:
  - server_root_path comes from the scalar SERVER_ROOT_PATH even when SERVER_ROOT_PATHS matched a prefix for this request, so a request under /tenant-a still returns the scalar value.
  - proxy_base_url set to an empty string returns "" and not null, because LiteLLM only passes None through when the variable is missing.
  - auto_redirect_to_sso is false when no SSO is configured even if AUTO_REDIRECT_UI_LOGIN_TO_SSO is "true".
  - general_settings.auto_redirect_ui_login_to_sso counts only as a real boolean true; a string there is a type error, not a truthy value.
  - mcp_stdio_enabled trims and lowercases its value, while AUTO_REDIRECT_UI_LOGIN_TO_SSO and DISABLE_ADMIN_UI are compared as written in LiteLLM; the shared env bool parser accepts the same set for all three, which docs/compatibility.md allows.
  - The two paths differ only by the /litellm prefix; register both on the one router and do not redirect one to the other.
  - The router returns JSON for the document only; a wrong method on these paths is the app's shared 405 handling, which this task does not change.
review_level: standard

