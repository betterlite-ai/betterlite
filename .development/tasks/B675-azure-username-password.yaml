id: B675
title: Azure username-password grant
description: >-
  Implement UsernamePasswordCredential semantics through pure-Rust form encoding and the B173 client, preserving
  tenant discovery and ROPC response errors captured from the pinned Python identity SDK. Username, password, client
  id and scope are injected; do not invoke browser or command-line authentication.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  get_azure_ad_token_from_username_password L160-L196.


  Named case contracts: password_grant_form: Construct UsernamePasswordCredential with exactly client_id, username
  and password, then get_bearer_token_provider with the supplied scope. Forward spaces/plus/Unicode with form encoding;
  grant_type=password, username/password/client_id and SDK-decorated scope reach the captured ROPC transport, with
  no client_secret or invented tenant argument. default_tenant: The wrapper default scope is https://cognitiveservices.azure.com/.default
  only when omitted; explicit empty/None is forwarded to the SDK. The SDK tenant is organizations, not common and
  not AZURE_TENANT_ID. Authority uses AZURE_AUTHORITY_HOST or public https://login.microsoftonline.com through the
  shared credential inputs; capture discovery before token exchange. invalid_grant: SDK failure raises ClientAuthenticationError
  with Authentication failed: {error_description or error}; preserve upstream error detail through the credential
  error boundary and never retry it as interactive authentication. Missing/invalid identity token claims raise Failed
  to build AuthenticationRecord from unexpected identity token. token_response: The helper returns a callable without
  eagerly requesting a token. First invocation validates password and constructs the authentication record from
  id_token_claims/client_info; then reuse the SDK-compatible token cache. Expiry is request clock+int(expires_in),
  token_type defaults Bearer, refresh_on is optional; do not accept an access_token alone as a complete result.
  username_debug_warning: Emit SDK DeprecationWarning that UsernamePasswordCredential does not support multifactor
  authentication with https://aka.ms/azsdk/identity/mfa. LiteLLM debug includes client_id and only username/password
  is-not-None flags (empty strings count set), followed by token-provider identity, never plaintext username/password.
  username_constructor_failure: Constructor and token-provider construction errors propagate unchanged; no catch
  exists here. Preserve missing/empty client-ID validation and do not convert a failed construction to None. password_scope_decoration:
  The ROPC scope set adds exactly openid, profile and offline_access, deduplicates input and compares the captured
  scope as a set (source order is not stable). A caller scope equal to any reserved value raises ValueError You
  cannot use any scope value that is reserved. before the token request. Do not apply this decoration to the client-credentials
  grant.


  Pin SDK fixture capture to azure-identity 1.25.2 and msal 1.37.0 from LiteLLM uv.lock; reject fixture generation
  with a different version. The old 1.26.0 references were not the locked dependency. Capture the public credential
  transport path, not unused legacy request factories retained in the SDK.


  Implement crates/betterlite-azure/src/azure_username_password.rs with adjacent tests under azure_username_password/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_username_password_cases in betterlite-azure with these exact named cases (one per
  oracle file): password_grant_form, default_tenant, invalid_grant, token_response, username_debug_warning, username_constructor_failure,
  password_scope_decoration. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_username_password* using HelperCase: kind:
  helper and the externally tagged azure_username_password variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_username_password that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_password_token consumes Azure password-grant token response bytes in crates/betterlite-azure/src/azure_username_password.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_username_password.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_username_password.
  The adjacent test replays_the_azure_username_password_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_username_password_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_username_password_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 31 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 235 production lines, 260 behavior/config-test lines, 125 combined
  Rust/Python adapter lines, 60 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 715 planned, 725 maximum changed lines. The production allowance includes 100 lines for the referenced
  SDK protocol that LiteLLM delegates.
