checks:
  optional:
  - mutants
  commands:
  - id: case-password-grant-form
    why: Construct UsernamePasswordCredential with exactly client_id, username and password, then get_bearer_token_provider
      with the supplied scope. Forward spaces/plus/Unicode with form encoding; grant_type=password, username/password/client_id
      and SDK-decorated scope reach the captured ROPC transport, with no client_secret or invented tenant argument.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_password_grant_form$/)'
  - id: case-default-tenant
    why: The wrapper default scope is https://cognitiveservices.azure.com/.default only when omitted; explicit empty/None
      is forwarded to the SDK. The SDK tenant is organizations, not common and not AZURE_TENANT_ID. Authority uses
      AZURE_AUTHORITY_HOST or public https://login.microsoftonline.com through the shared credential inputs; capture
      discovery before token exchange.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_default_tenant$/)'
  - id: case-invalid-grant
    why: 'SDK failure raises ClientAuthenticationError with Authentication failed: {error_description or error};
      preserve upstream error detail through the credential error boundary and never retry it as interactive authentication.
      Missing/invalid identity token claims raise Failed to build AuthenticationRecord from unexpected identity
      token.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_invalid_grant$/)'
  - id: case-token-response
    why: The helper returns a callable without eagerly requesting a token. First invocation validates password and
      constructs the authentication record from id_token_claims/client_info; then reuse the SDK-compatible token
      cache. Expiry is request clock+int(expires_in), token_type defaults Bearer, refresh_on is optional; do not
      accept an access_token alone as a complete result.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_token_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_username_password.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_username_password*")"
      && grep -lq 'azure_username_password' tools/oracle/fuzz/corpus/helper_case/azure_username_password* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_username_password$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_username_password)"
      && grep -q 'decode_password_token' crates/betterlite-azure/fuzz/fuzz_targets/azure_username_password.rs &&
      cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_username_password_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_secret_safe_failure$/)'
  - id: case-username-debug-warning
    why: Emit SDK DeprecationWarning that UsernamePasswordCredential does not support multifactor authentication
      with https://aka.ms/azsdk/identity/mfa. LiteLLM debug includes client_id and only username/password is-not-None
      flags (empty strings count set), followed by token-provider identity, never plaintext username/password.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_username_debug_warning$/)'
  - id: case-username-constructor-failure
    why: Constructor and token-provider construction errors propagate unchanged; no catch exists here. Preserve
      missing/empty client-ID validation and do not convert a failed construction to None.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_username_constructor_failure$/)'
  - id: case-password-scope-decoration
    why: The ROPC scope set adds exactly openid, profile and offline_access, deduplicates input and compares the
      captured scope as a set (source order is not stable). A caller scope equal to any reserved value raises ValueError
      You cannot use any scope value that is reserved. before the token request. Do not apply this decoration to
      the client-credentials grant.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_password_scope_decoration$/)'
