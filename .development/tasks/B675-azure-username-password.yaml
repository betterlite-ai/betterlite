id: B675
title: Azure username-password grant
description: >-
  Implement UsernamePasswordCredential semantics through pure-Rust form encoding and the B173 client, preserving
  tenant discovery and ROPC response errors captured from the pinned Python identity SDK. Username, password, client
  id and scope are injected; do not invoke browser or command-line authentication.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  get_azure_ad_token_from_username_password L160-L196.


  Implement crates/betterlite-azure/src/azure_username_password.rs with adjacent tests under azure_username_password/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_username_password in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_username_password_cases in betterlite-azure with these exact named cases (one per
  oracle file): password_grant_form, default_tenant, invalid_grant, token_response. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy
  and assert both client response and captured upstream request. Existing API tasks retain route registration; this
  task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_username_password* using HelperCase: kind:
  helper and the externally tagged azure_username_password variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_username_password that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_password_token consumes Azure password-grant token response bytes in crates/betterlite-azure/src/azure_username_password.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_username_password.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_username_password.
  The adjacent test replays_the_azure_username_password_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_username_password_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_username_password_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 31 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 165 production lines, 111 behavior/config-test lines, 91 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 462 planned, 475 maximum changed lines. The production allowance includes 100 lines for the referenced
  SDK protocol that LiteLLM delegates.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - Cargo.toml
  - deny.toml
  - crates/betterlite-azure/src/azure_username_password.rs
  - crates/betterlite-azure/src/azure_username_password/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_username_password.rs
  - tools/oracle/src/helpers/azure_username_password/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_username_password.py
  - tools/oracle/cases/helpers/providers/azure-username-password/**
  - tools/oracle/fuzz/corpus/helper_case/azure_username_password*
  - crates/betterlite-azure/fuzz/Cargo.toml
  - crates/betterlite-azure/fuzz/fuzz_targets/azure_username_password.rs
  - crates/betterlite-azure/fuzz/corpus/azure_username_password/**
  lint_tables: false
references:
- url: https://github.com/Azure/azure-sdk-for-python/blob/azure-identity_1.26.0/sdk/identity/azure-identity/azure/identity/_credentials/user_password.py#L65-L94
  why: Credential behavior in the installed oracle azure-identity 1.26.0; capture its transport seam instead of
    copying its Python SDK internals.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/common_utils.py#L160-L196
  why: Own get_azure_ad_token_from_username_password. Other functions in this file remain with the owners listed
    below.
dod:
- text: 'password grant form: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-username-password/password-grant-form.yaml.'
  proof:
  - case-password-grant-form
  - oracle
  - helper-python
- text: 'default tenant: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-username-password/default-tenant.yaml.'
  proof:
  - case-default-tenant
  - oracle
  - helper-python
- text: 'invalid grant: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-username-password/invalid-grant.yaml.'
  proof:
  - case-invalid-grant
  - oracle
  - helper-python
- text: 'token response: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-username-password/token-response.yaml.'
  proof:
  - case-token-response
  - oracle
  - helper-python
- text: New azure_username_password seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_password_token has newly committed malformed and boundary inputs replayed through production parsing.
  proof:
  - parser-corpus
- text: credential identity isolation holds at this task’s owned boundary.
  proof:
  - credential-identity-isolation
- text: secret safe failure holds at this task’s owned boundary.
  proof:
  - secret-safe-failure
checks:
  optional:
  - mutants
  commands:
  - id: case-password-grant-form
    why: The password-grant-form behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_password_grant_form$/)'
  - id: case-default-tenant
    why: The default-tenant behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_default_tenant$/)'
  - id: case-invalid-grant
    why: The invalid-grant behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_invalid_grant$/)'
  - id: case-token-response
    why: The token-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_cases::case_[0-9]+_token_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_username_password.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_username_password*")"
      && grep -lq 'azure_username_password' tools/oracle/fuzz/corpus/helper_case/azure_username_password* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_username_password$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_username_password)"
      && grep -q 'decode_password_token' crates/betterlite-azure/fuzz/fuzz_targets/azure_username_password.rs &&
      cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_username_password_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_username_password_secret_safe_failure$/)'
