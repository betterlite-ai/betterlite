pitfalls:
- 'The oracle helper for this task is pre-registered as azure_username_password in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/username_password.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_username_password.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- AZURE_TENANT_ID does not change the organizations tenant used by this wrapper.
- The wrapper returns a lazy provider, so token-endpoint failures occur when the provider is invoked.
