dod:
  - text: >-
      Settings resolve issuer, audience and ttl through option, env, default; empty strings count as unset; a ttl of zero or below fails; channel_token_ttl follows ttl; empty end_user_claim_sources falls back to the two defaults; allowed_scopes stays None when absent and Some(empty) when given empty.
    proof: [settings-tests]
  - text: >-
      The signing key loads from MCP_JWT_SIGNING_KEY as PEM or file:// path, is generated as RSA-2048 when the variable is unset or empty, a bad key is an error, and the kid is the first 16 hex characters of the SHA-256 of the SPKI DER.
    proof: [key-tests]
  - text: >-
      The JWKS document has one RS256 sig key with kid, n and e in unpadded base64url, and a token signed by the signer verifies against it; max age is 3600 for a persistent key and 300 for a generated one.
    proof: [jwks-tests]
  - text: >-
      JWKS bodies are cached per URI for 3600 seconds and discovery documents for 86400 seconds only when they hold jwks_uri; introspection posts the token form field and rejects an inactive token or a missing endpoint.
    proof: [idp-tests]
  - text: >-
      Incoming JWTs verify against the IdP key chosen by kid (first key when the token has none), use the key's algorithm and not the header's, check expiry always, check audience and issuer only when configured, and fail for an unknown kid, a bad signature and an expired token.
    proof: [incoming-tests]
  - text: >-
      The pre-call flow skips other call types and kid-less list calls, verifies JWT or opaque tokens, maps verification failure to 401 and missing required claims to 403, falls back to the proxy-decoded jwt_claims, merges headers, adds the channel and debug headers when configured and never logs a token.
    proof: [sign-tests]
  - text: >-
      The upstream helper reads the bearer token from the raw authorization header case-insensitively, signs list or call requests, and returns the extra headers unchanged without auth fields.
    proof: [upstream-tests]
  - text: >-
      The cargo-fuzz target mcp_jwt_idp_document exists with seed files added on this branch, and the corpus replays through decode_idp_document without a panic.
    proof: [idp-corpus]

checks:
  optional: []
  commands:
    - id: settings-tests
      why: fails while the env defaults, ttl check or empty-string handling are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_jwt_signer::signer_settings::/)'
    - id: key-tests
      why: fails while key loading, generation or the kid derivation are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_jwt_signer::signing_key::/)'
    - id: jwks-tests
      why: fails while the JWKS document or max age are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_jwt_signer::jwks_document::/)'
    - id: idp-tests
      why: fails while the cached IdP fetches or introspection are missing; tests run a local axum server and a test clock
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_jwt_signer::idp_documents::/) - test(replays_the_mcp_jwt_idp_corpus)'
    - id: incoming-tests
      why: fails while incoming JWT verification is missing or accepts a token it should reject
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_jwt_signer::incoming_token::/)'
    - id: sign-tests
      why: fails while the pre-call flow, its error mapping or its headers are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_jwt_signer::sign_request::/)'
    - id: upstream-tests
      why: fails while the tools/list helper is missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_jwt_signer::upstream_headers::/)'
    - id: idp-corpus
      why: the fuzz target or its fresh seed corpus is missing or does not replay
      run: >-
        test -f crates/betterlite-guardrails/fuzz/fuzz_targets/mcp_jwt_idp_document.rs &&
        grep -q 'name = "mcp_jwt_idp_document"' crates/betterlite-guardrails/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-guardrails/fuzz/corpus/mcp_jwt_idp_document)" &&
        cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(replays_the_mcp_jwt_idp_corpus)'

oracle_cases: []

deviations:
  - what: There is no process-wide signer singleton and no "replacing existing singleton" warning. The caller that wires the guardrail holds the signer and hands it to the routes and to the upstream helper.
    why: The repo rules forbid module-level state; LiteLLM's global only exists so the JWKS route can find the signer.
  - what: The 401 text after the colon is betterlite's own verification error, not PyJWT's wording. Status, the "error" key and the prefix are the same.
    why: PyJWT exception text cannot be reproduced by a Rust JWT library.
  - what: Key PEM files must be unencrypted RSA private keys (PKCS#8 or PKCS#1); LiteLLM's loader has the same limit by passing password None.
    why: Keeps parity; an encrypted key is a startup error in both.

out_of_scope:
  - "initialize_guardrail and the guardrail_initializer_registry in __init__.py (option precedence, mode must be pre_mcp_call, callback registration): B109 wires them."
  - "get_mcp_jwt_signer and the module singleton: B109 holds the signer; no caller needs the global."
  - "The routes for /.well-known/jwks.json and the OIDC document in mcp_server_manager.py and discoverable_endpoints.py: their owners call get_jwks and jwks_max_age."
  - "Claim validation, identity, scope, claim operations, channel claims and the debug header string: B3817 (done)."
  - "The proxy_logging shared cache lookup in inject_mcp_jwt_headers_for_upstream: the hook never reads its cache argument, so betterlite drops it."
  - "Signature of CustomGuardrail, log_guardrail_information and supported_event_hooks: the guardrail framework tasks own them."

pitfalls:
  - Read only `kid` from the unverified header; taking `alg` from the token allows alg:none and HS256-with-public-key attacks, so the algorithm must come from the JWKS key entry.
  - MCP_JWT_SIGNING_KEY set to an empty string means no key, so a generated key is used and jwks_max_age is 300, not an error.
  - The OIDC document is cached only when it has `jwks_uri`; the JWKS cache has no such guard and stores whatever `keys` array came back, including an empty one.
  - A token with exactly two dots is a JWT; a token with any other count goes to introspection, and with no endpoint it is logged and let through unverified.
  - A list_mcp_tools call without an `extra_headers` key in its data is not signed at all; one with an empty `extra_headers` is signed.
  - The tools/list helper strips only the prefix "bearer " (7 characters) after matching case-insensitively, and raw header names are lowercased first.
  - Introspection answers with `active` false or absent are an error, and that error is mapped to 401 like a failed signature.
  - Verified IdP claims win over the proxy-decoded `jwt_claims`; the proxy ones are used only when verification produced none.
  - The 403 for missing required claims is raised after verification and before signing, so a failed verification always shows 401 first.
  - jsonwebtoken requires `exp` and rejects nothing on `nbf` by default; set the validation to require no claims and to check nbf, or tokens PyJWT accepts will fail.

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
