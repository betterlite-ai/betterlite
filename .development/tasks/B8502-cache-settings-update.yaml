id: B8502
title: Save cache settings and reload the cache from the database
description: >-
  Port the write half of litellm/proxy/management_endpoints/cache_settings_endpoints.py: POST /cache/settings
  (update_cache_settings, L567-L675), `CacheSettingsManager` (L331-L419) and the audit row it writes (L262-L328).
  B4306 built the pure helpers, B4307 serves GET /cache/settings and B4308 serves POST /cache/settings/test. Code goes in
  the module `cache_settings_update` of betterlite-server (crates/betterlite-server/src/cache_settings_update.rs and
  cache_settings_update/**), split into `route.rs`, `manager.rs` and `audit.rs`.


  Rebuilding the cache is ProxyConfig._init_cache and switch_on_llm_response_caching in proxy_server.py, which another
  task owns. This module reaches them through the port `CacheReinit` with `fn init_cache(&self, params: &Map<String,
  Json>) -> Result<(), CacheReinitError>` and `fn switch_on_response_caching(&self)`. Tests use a recording fake.


  `CacheSettingsManager` is one shared value with `last_params: Mutex<Option<Map<String, Json>>>` (LiteLLM's class
  variable `_last_cache_params`). `params_equal(a, b)` drops the key "redis_type" and every null value from both, turns
  every value that is not an array or object into its Python `str()` text (true is "True", 1 is "1", 1.5 is "1.5"),
  keeps arrays and objects as they are, and compares the two maps. `update_params(params)` stores a copy.
  `init_from_db(repo, crypto, reinit)` is LiteLLM's init_cache_settings_in_db: read row "cache_config" through B726's
  cache config repository wrapped in B872's call_with_db_reconnect_retry with reason
  "init_cache_settings_in_db_lookup_failure". When the row has non-empty cache_settings, parse it (a JSON string must
  hold an object, an already-parsed object is used as is), decrypt each value as B1600's decrypt_value_helper does with
  return_original_value true, and drop "redis_type". When last_params is set and `params_equal` holds, log at debug
  "Cache settings unchanged, skipping reinitialization" and stop. Otherwise call `init_cache`, store the params, call
  `switch_on_response_caching` and log at info "Cache settings initialized from database". Any error is logged with
  "litellm.proxy.management_endpoints.cache_settings_endpoints.py::CacheSettingsManager::init_cache_settings_in_db -
  <error>" and not returned. Startup and the periodic config reload call it; this task only exposes it.


  POST /cache/settings takes the JSON body {"cache_settings": {...}} (an object is required) and the optional header
  litellm-changed-by. It uses the same key auth and route checks as B4308's /cache/settings/test. Steps:
  1. No database: 500 with {"detail": {"error": "Database not connected. Please connect a database."}}.
  2. store_model_in_db not true (read it the way B1653's coordination Redis routes do): 500 with {"detail": {"error":
  "Set `'STORE_MODEL_IN_DB='True'` in your env to enable this feature."}}.
  3. Read row "cache_config" (no retry here). When it has non-empty cache_settings, `before` is B4306's
  parse_stored_settings of it and `saved` is that map decrypted. The action is "updated" when the row exists, even with
  empty settings, and "created" otherwise.
  4. `settings` = B4306's resolve_cache_url_precedence(merge_over_saved(body.cache_settings, saved)).
  5. Encrypt each value with B1600's encrypt_value_helper and upsert row "cache_config" with the JSON text of the
  encrypted map for both create and update.
  6. Decrypt the encrypted map again, drop "redis_type", call `init_cache` with it, then `update_params`, then
  `switch_on_response_caching`.
  7. Write the audit row through B2330's audit sink when is_audit_logging_enabled is true, on a spawned task that is not
  awaited. The row has a new uuid4 id, updated_at now in UTC, changed_by = the header, else the key's user_id, else
  "default_user_id" (litellm_proxy_admin_name), changed_by_api_key = the key's hashed token, table_name
  "LiteLLM_CacheConfig", object_id "cache_config", the action, updated_values = the JSON text of {"settings":
  redact_settings(settings)} and before_value = the JSON text of {"settings": redact_settings(before)}.
  `redact_settings` maps every key to "***REDACTED***" and gives {} for a missing or empty map. A failed task logs a
  warning "Failed to write cache-settings audit log: <error>".
  8. Answer 200 with {"message": "Cache settings updated successfully", "status": "success", "settings":
  B4306's redact_credentials(settings)}.
  Any error in steps 3 to 7 answers 500 with {"detail": "Error updating cache settings: <error text>"} (a string
  detail, unlike steps 1 and 2) and logs "Error updating cache settings: <error>" at error level.

  Expose `pub fn router(state) -> axum::Router` from route.rs for the architect to merge. Do not touch lib.rs or another
  route list.


  Tests: `cache_settings_update::manager::` (params_equal, skip on equal params, reinit on change, errors logged and
  swallowed), `cache_settings_update::route::` (each 500, merge over saved secrets, encryption round trip, created versus
  updated, the reinit order, the redacted reply) and `cache_settings_update::audit::` (row fields, redaction, disabled
  logging, a failing sink only warns). Helper operation b8502 has the pure functions `cache_params_equal` (inputs
  `params1`, `params2`) and `redact_settings` (input `settings`); its Python side calls
  CacheSettingsManager._cache_params_equal and _redact_settings. HTTP cases run against the booted proxy, which has no
  database.

scope:
