    - crates/betterlite-server/src/cache_settings_update.rs
    - crates/betterlite-server/src/cache_settings_update/**
    - tools/oracle/cases/cache_settings_update/**
    - tools/oracle/cases/helpers/cache-settings-update/**
    - "tools/oracle/fuzz/corpus/helper_case/cache_settings_update-*"
    - tools/oracle/helpers/b8502.py
    - tools/oracle/helpers/b8502/**
    - tools/oracle/src/helpers/server/b8502.rs
    - tools/oracle/src/helpers/server/b8502/**
  lint_tables: false

references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/cache_settings_endpoints.py#L567-L675
    why: The POST /cache/settings decorator, its two 500 checks, the read, merge, encrypt, upsert, reinit and audit order and the reply.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/cache_settings_endpoints.py#L331-L419
    why: CacheSettingsManager, its str() normalisation and the startup reload.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/cache_settings_endpoints.py#L262-L328
    why: _redact_settings, the audit task and its warning.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7575-L7622
    why: _encrypt_env_variables and _decrypt_db_variables encrypt and decrypt each value of the map.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/audit_logs.py#L27-L45
    why: is_audit_logging_enabled, which B2330 ports.

dod:
  - text: params_equal ignores redis_type and nulls and compares Python str() texts, and the startup reload skips equal params and swallows errors.
    proof: [manager-tests, oracle, helper-python]
  - text: POST /cache/settings answers the two configuration 500s, merges over saved secrets, stores the encrypted map and reinitialises the cache in LiteLLM's order.
    proof: [route-tests, oracle]
  - text: The reply redacts credentials and a failure in the body answers the string-detail 500.
    proof: [route-tests]
  - text: The audit row carries the redacted before and after keys and a failing sink only warns.
    proof: [audit-tests, oracle, helper-python]
  - text: New helper corpus cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: manager-tests
      why: params_equal or the startup reload is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_update::manager::/)'
    - id: route-tests
      why: a step of the POST route is missing or out of order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_update::route::/)'
    - id: audit-tests
      why: the audit row or its redaction is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_update::audit::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b8502)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b8502 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b8502/pyrightconfig.json
    - id: helper-case-corpus
      why: new cache-settings helper cases are missing or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/cache_settings_update-*")" &&
        grep -lE '^[[:space:]]+b8502:' tools/oracle/fuzz/corpus/helper_case/cache_settings_update-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/cache_settings_update/post-without-database.yaml
  - tools/oracle/cases/cache_settings_update/post-without-key.yaml
  - tools/oracle/cases/helpers/cache-settings-update/params-equal-str-forms.yaml
  - tools/oracle/cases/helpers/cache-settings-update/params-equal-skips-redis-type.yaml
  - tools/oracle/cases/helpers/cache-settings-update/params-differ-lists.yaml
  - tools/oracle/cases/helpers/cache-settings-update/redact-settings-keys.yaml
  - tools/oracle/cases/helpers/cache-settings-update/redact-settings-empty.yaml

deviations:
  - what: The text after the "Error updating cache settings" prefix is betterlite error text.
    why: Python exception strings have no Rust equivalent; status and prefix match.
  - what: params_equal renders floats with Rust's shortest round-trip form where Python's str() would use exponent form (1e-05).
    why: Both compare one stored map with another, so only the equality result matters and it is the same for values a JSON body carries.

out_of_scope:
  - "GET /cache/settings (B4307) and POST /cache/settings/test (B4308)."
  - "_parse_stored_settings, _resolve_cache_url_precedence, _redact_credentials, _merge_over_saved and the other pure helpers; B4306 built them."
  - "ProxyConfig._init_cache, switch_on_llm_response_caching and the startup and reload calls of init_from_db; the wave 17 cache and secrets wiring part mounts it, with the production CacheReinit impl."
  - "Cache.__init__ behind init_cache; B4299 owns it."
  - "litellm/caching/_internal_lru_cache.py (lru_cache_wrapper): no caller at the pin."
  - "litellm/caching/__init__.py: Python re-exports only."

pitfalls:
  - "The two configuration 500s put an object in detail ({\"error\": ...}); the catch-all 500 puts a string. Keep both shapes."
  - "The audit before_value comes from the stored row before decryption and redaction keeps only its keys, so no secret reaches the audit table."
  - "The route reinitialises from the map decrypted after encryption, not from the request body, and drops redis_type only there; the stored row keeps redis_type."
  - "init_cache runs before update_params, so a failed init_cache answers 500 and keeps the old params. Do not store them first."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
