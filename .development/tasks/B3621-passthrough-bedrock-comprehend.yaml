id: B3621
title: Pass-through Bedrock and Comprehend Medical routes
description: >-
  Register LiteLLM's AWS pass-through routes as the module bedrock_comprehend_routes in crates/betterlite-server.
  Three routes live here: the /bedrock catch-all (which hands every non-agent-runtime endpoint to B3620 and itself serves the Bedrock agent runtime), POST /comprehendmedical/{operation}, and POST /comprehendmedical (the AWS SDK shape).
  The module reads its values from injected parts: the general_settings map (B002), an environment reader (B198 forbids global env reads), B594's credential resolver, B595's SigV4 signer and B3615's create_pass_through_route.
  Every name below is at most 30 characters.

  Routes. All three require the authenticated key (B052's user_api_key_auth).
  `/bedrock/{endpoint:path}` takes GET, POST, PUT, DELETE and PATCH (five methods; B3620's text names four, PATCH is served too). `/comprehendmedical/{operation}` and `/comprehendmedical` take POST only; any other method is axum's 405. There is no /v1, /openai or other alias. The architect adds the three routes to the server route table once.

  Shared state keys. A signed request is sent from request state, not from the incoming body. Before calling the handler from create_pass_through_route, set two request-state values with B3600's keys: LITELLM_PASS_THROUGH_CUSTOM_BODY_STATE_KEY holds the parsed JSON object, and LITELLM_PASS_THROUGH_RAW_BODY_STATE_KEY holds the exact bytes that were signed. Serialize the JSON once, sign those bytes, send those bytes. B3615 clears both keys afterwards.

  `bedrock_proxy_route(endpoint, request, response, auth, deps)` replaces bedrock_proxy_route. Steps in order:
  1. Call B3618's create_request_copy for the request and drop the result (LiteLLM calls it and ignores it).
  2. Read `aws_region_name` from the env var AWS_REGION_NAME only (empty or unset means None). The other two region vars are not used on this route.
  3. If B3620's is_agent_runtime_route(endpoint) is false, return B3620's bedrock_llm_proxy_route(endpoint, request, response, auth, router, deps) unchanged. Nothing below runs.
  4. If B3620's agent_runtime_disabled(general_settings) is true, answer HTTP 403 with the plain string detail "bedrock-agent-runtime pass-through is disabled on this proxy." This check comes after step 3, so model endpoints are never blocked by it.
  5. The base is `https://bedrock-agent-runtime.<region>.<suffix>` where suffix is B198's get_aws_dns_suffix(region). A None region renders as the text "None" in the host, as LiteLLM's f-string does; do not add a check.
  6. Build the target with B3618's provider_target_url(base, endpoint). It drops a query or fragment in the endpoint and adds a leading slash, which is exactly what LiteLLM does here with httpx.URL(endpoint).path and join_base_and_endpoint_path.
  7. Read the JSON body with B1100's body read. A failure is B1100's own 400 (see deviations).
  8. Sign with B595's sign_aws_json_post, run the way B595's run_aws_signing runs it (off the request task). Inputs: credentials from B594's get_credentials called with no arguments (ambient AWS_* env, profile and role resolution, not the region var), service name "bedrock", the region from step 2 (None allowed), the target URL, the serialized body and the single header Content-Type: application/json.
  9. The call is streaming when the substring "stream" occurs anywhere in the full target URL string (scheme, host, path and query). The request body is not looked at. A path such as /agents/x/stream hits it; an agent id that contains "stream" also does.
  10. Custom headers are B3603's upstream_headers_for_bedrock_agent_runtime_route(request, auth, signed_headers). Caller headers survive except LiteLLM credentials, any name the signer set, and content-length, host and accept-encoding; the signed headers win. Do not rebuild this filter here.
  11. Build the handler with B3615's create_pass_through_route(endpoint = the original endpoint string, target = the signed request's URL, custom_headers, is_streaming_request). Set the two request-state values, call the handler with the request, the response and the key, and return what it returns.

  `comprehend_medical_route(operation, request, response, auth, deps)` replaces comprehend_medical_proxy_route. The operation is the path segment, so it is never empty on the {operation} route. Steps in order; every failure is an HTTPException with a plain string detail:
  1. Supported operations are the items of B3651's `supported_operations()` in betterlite-core::relay::comprehend_medical, the keys of its tariff table (DetectEntitiesV2, DetectPHI, InferICD10CM, InferRxNorm, InferSNOMEDCT). Case-sensitive match. Otherwise 400 with detail "Unsupported Comprehend Medical operation: <operation>. Supported operations: <names sorted, joined with ', '>". Sorted order is byte order: DetectEntitiesV2, DetectPHI, InferICD10CM, InferRxNorm, InferSNOMEDCT.
  2. `aws_passthrough_region()` replaces _resolve_aws_passthrough_region. It returns the first non-empty value of AWS_REGION_NAME, AWS_REGION, AWS_DEFAULT_REGION in that order, else None. None gives 400 "AWS region not found. Set AWS_REGION_NAME in the proxy environment."
  3. Read the JSON body with B1100's body read. A read failure is 400 with detail equal to the failure's message text (a plain string, not an object).
  4. A body that is not a JSON object (array, string, number, bool, null) is 400 "Request body must be a JSON object".
  5. A body object with a `stream` key, whatever its value, is 400 "'stream' is not a Comprehend Medical request member".
  6. Target `https://comprehendmedical.<region>.<suffix>/` (suffix from B198). Sign with B595's sign_aws_json_post: credentials from B594's get_credentials with aws_region_name set to the region and nothing else, service name "comprehendmedical", the region, the target, the serialized body, and the headers Content-Type: application/x-amz-json-1.1 and X-Amz-Target: ComprehendMedical_20181030.<operation>. The constant `COMPREHEND_TARGET_PREFIX` is "ComprehendMedical_20181030".
  7. Build the handler with create_pass_through_route(endpoint = the operation, target = the signed URL, custom_headers = the signed request's headers exactly, custom_llm_provider "comprehendmedical", not streaming). No caller header is forwarded on this route. Set the two request-state values like the Bedrock route, call the handler and return its result. B3651's logging reads the operation from the x-amz-target header the signer returned, so keep that header in the custom headers.

  `comprehend_sdk_route(request, response, auth, deps)` replaces comprehend_medical_sdk_proxy_route. Read the `x-amz-target` request header (case-insensitive name, missing means empty). Split at the first ".": the part before it must equal COMPREHEND_TARGET_PREFIX and the part after it must be non-empty, otherwise 400 with detail "Expected an X-Amz-Target header of the form ComprehendMedical_20181030.<Operation>" (the text ends with the literal characters <Operation>). Then return comprehend_medical_route with that operation. A header "ComprehendMedical_20181030.A.B" gives operation "A.B" and so the unsupported-operation 400.
