dod:
  - text: The /bedrock route accepts GET, POST, PUT, DELETE and PATCH, and the two Comprehend routes accept only POST.
    proof: [route-table-tests]
  - text: An endpoint with none of the agent-runtime fragments goes to bedrock_llm_proxy_route unchanged, before the disabled check, the signer and the handler factory are touched.
    proof: [bedrock-dispatch-tests]
  - text: An agent-runtime endpoint is answered 403 with the disabled message when the setting is on, and the check runs only after the dispatch test.
    proof: [agent-gate-tests, oracle]
  - text: The agent-runtime target is https://bedrock-agent-runtime.<region>.<suffix> plus the endpoint path with query and fragment dropped, uses only AWS_REGION_NAME, and renders a missing region as the text None.
    proof: [agent-url-tests]
  - text: The agent-runtime request is signed for service bedrock with the serialized body and the one Content-Type header, the signed bytes are the bytes in the raw-body state value, the parsed object is in the custom-body value, and the streaming flag is a substring test over the full URL.
    proof: [agent-signing-tests]
  - text: The agent-runtime custom headers come from B3603's filter with the signed headers, and the handler is built with the original endpoint and the signed URL.
    proof: [agent-headers-tests]
  - text: comprehend_medical_route checks in order the operation, the region (three env vars in order), the body read, the object shape and the stream key, each with its exact 400 text.
    proof: [comprehend-checks-tests, oracle]
  - text: comprehend_medical_route signs for service comprehendmedical with the X-Amz-Target and JSON 1.1 content-type headers, passes only the signed headers to the handler, uses custom_llm_provider comprehendmedical, and sets both request-state values.
    proof: [comprehend-signing-tests]
  - text: comprehend_sdk_route reads x-amz-target case-insensitively, rejects a wrong prefix or empty operation with the exact 400 text, and forwards the part after the first dot.
    proof: [comprehend-sdk-tests, oracle]
checks:
  optional: []
  commands:
    - id: route-table-tests
      why: a route path or method is missing, or Comprehend accepts a method other than POST
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::route_table(::|$)/)'
    - id: bedrock-dispatch-tests
      why: a model endpoint is not handed to bedrock_llm_proxy_route, or the agent-runtime path runs for it
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::bedrock_dispatch(::|$)/)'
    - id: agent-gate-tests
      why: the disabled 403 is missing, has another text, or runs before the dispatch test
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::agent_gate(::|$)/)'
    - id: agent-url-tests
      why: the agent-runtime host, path join or region source is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::agent_url(::|$)/)'
    - id: agent-signing-tests
      why: the agent-runtime signing inputs, signed bytes, state values or streaming flag are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::agent_signing(::|$)/)'
    - id: agent-headers-tests
      why: caller headers are not filtered through B3603 or the handler gets the wrong endpoint or target
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::agent_headers(::|$)/)'
    - id: comprehend-checks-tests
      why: a Comprehend validation step is missing, out of order, or has the wrong text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::comprehend_checks(::|$)/)'
    - id: comprehend-signing-tests
      why: the Comprehend signing inputs, forwarded headers, provider name or state values are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::comprehend_signing(::|$)/)'
    - id: comprehend-sdk-tests
      why: the SDK route reads the wrong header, splits at the wrong dot, or has the wrong 400 text
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bedrock_comprehend_routes::tests::comprehend_sdk(::|$)/)'
