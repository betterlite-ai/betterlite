  - tools/oracle/cases/server/bedrock-comprehend-routes/comprehend-sdk-empty-operation.yaml
deviations:
  - what: The agent-runtime route reads its body through B1100, so an unreadable body gets B1100's 400, and the Comprehend route puts that read failure's message in the 400 detail string.
    why: LiteLLM's Bedrock branch puts the raw exception object into detail, which cannot be encoded as JSON, and its parser message text is Python's. B3620 already takes B1100's 400 for the model path.
  - what: Settings and environment variables arrive through injected parts (the general_settings map and an environment reader), not from proxy globals or os.environ.
    why: betterlite wires dependencies through constructors; a client sees the same values.
out_of_scope:
  - "bedrock_llm_proxy_route, handle_bedrock_count_tokens, handle_bedrock_passthrough_router_model, _is_bedrock_agent_runtime_route and _is_bedrock_agent_runtime_passthrough_disabled: B3620 owns them; this task calls them."
  - "_upstream_headers_for_bedrock_agent_runtime_route, _caller_headers_without_litellm_secrets and _HEADERS_NEVER_FORWARDED_TO_BEDROCK: B3603."
  - "create_request_copy and provider_target_url (join of base and endpoint path): B3618 and B3600. create_pass_through_route and the state-key cleanup: B3615."
  - "_proxy_general_settings and _json_request_body: not built; the settings map is injected and B1100 reads the body."
  - "get_credentials, sign_aws_json_post and run_aws_signing: B594 and B595. get_aws_dns_suffix: B198."
  - "COMPREHEND_MEDICAL_SUPPORTED_OPERATIONS and the Comprehend Medical cost logging: B3651 (tariff table) and B3606 (dispatch)."
  - "The /bedrock and /comprehendmedical entries in LiteLLMRoutes.llm_api_routes (proxy/_types.py L493-L494) and the /bedrock prefix check in auth_utils.py L2047: the auth route tables, not this module."
pitfalls:
  - "The disabled check runs after the agent-runtime test, so a model endpoint is served even when disable_bedrock_agent_runtime_passthrough is true."
  - "The /bedrock route reads only AWS_REGION_NAME, while the Comprehend route tries AWS_REGION_NAME, AWS_REGION and AWS_DEFAULT_REGION; do not share one reader."
  - "With no region, the agent-runtime host becomes bedrock-agent-runtime.None.amazonaws.com and the request goes out anyway; LiteLLM does not return a 400 here."
  - "get_credentials gets no argument on the Bedrock route but aws_region_name on the Comprehend route; the second changes which region the role and STS lookup uses."
  - "The signature covers the exact body bytes, so the bytes in the raw-body state value must be the ones passed to the signer, never a second serialization of the parsed object."
  - "Streaming on the agent-runtime route is a substring test of \"stream\" over the whole URL, not a body or header check."
  - "The Comprehend route forwards none of the caller's headers; only the signed set (authorization, x-amz-date, x-amz-target, content-type, token) goes upstream."
  - "A Comprehend body with \"stream\": false is still rejected; only the key's presence counts."
  - "The unsupported-operation message lists the names sorted, not in tariff-table order."
  - "The SDK route splits on the first dot only, so an operation that holds more dots stays whole and fails the supported-operation check."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
