id: B4351
title: Store response cache objects in Azure Blob Storage
description: >-
  Build crates/betterlite-cache::azure_blob module with the Azure Blob response-cache backend,
  loading configuration through betterlite-config and storing cache entries in Azure Blob Storage.
  The module exports AzureBlobCache struct with synchronous and asynchronous operations.
  Configuration comes from litellm_settings.cache_params keys: azure_account_url (required),
  azure_blob_container (required). Both parameters are passed to this constructor as account_url
  and container. Credentials are supplied through DefaultAzureCredential, which uses the
  standard Azure credential chain. Cache keys are used as blob names without transformation.
  Container creation is attempted at initialization and suppresses ResourceExistsError; other
  errors propagate. Synchronous writes omit the overwrite flag; asynchronous writes set overwrite=True.
  Serialization happens before the exception handler in both modes, so serialization errors
  propagate while upload failures are logged and swallowed. Reads suppress only ResourceNotFoundError;
  authentication, transport, UTF-8 decoding and JSON parse errors return None through fallthrough.
  TTL kwargs have no storage effect. Disconnect closes the synchronous client first and then
  awaits asynchronous closure. Async operations preserve exception outcomes without blocking.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-cache/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/azure_blob_cache.py#L11-112
    why: The AzureBlobCache class, all owned functions and imports from line 11 through async_set_cache_pipeline.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L80-120
    why: "Cache.__init__ signature; azure_account_url and azure_blob_container are constructor parameters at lines 95-96, passed through cache_params."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L284-288
    why: "AzureBlobCache is instantiated with account_url and container parameters from Cache.__init__."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6308-L6312
    why: "cache_params assembly from litellm_settings; Cache is instantiated with **cache_params."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/base_cache.py
    why: "The BaseCache interface; AzureBlobCache does not call get_ttl or invoke __init__."
  - url: https://learn.microsoft.com/en-us/python/api/azure-storage-blob/azure.storage.blob.blobserviceclient
    why: "The BlobServiceClient and container_client API for synchronous operations."
  - url: https://learn.microsoft.com/en-us/python/api/azure-storage-blob-aio/azure.storage.blob.aio.blobserviceclient
    why: "The async BlobServiceClient API."
  - url: https://learn.microsoft.com/en-us/python/api/azure-identity/azure.identity.defaultazurecredential
    why: "DefaultAzureCredential and its credential chain behavior."
dod:
  - text: >-
      Container creation is attempted at initialization and ResourceExistsError is suppressed.
      All other initialization failures propagate. Both synchronous and asynchronous container
      clients are created and stored.
    proof: [azure-tests]
  - text: >-
      set_cache serializes to JSON before entering the exception handler. Serialization errors
      propagate; upload failures are caught, logged and swallowed.
    proof: [azure-tests]
  - text: >-
      async_set_cache serializes to JSON before entering the exception handler, calls upload_blob
      with overwrite=True, and suppresses all exceptions the same way as set_cache.
    proof: [azure-tests]
  - text: >-
      get_cache downloads the blob, decodes UTF-8, parses JSON and returns the result.
      ResourceNotFoundError returns None; authentication, transport, UTF-8 and JSON errors
      also return None. TTL kwargs are ignored.
    proof: [azure-tests]
  - text: >-
      async_get_cache downloads the blob asynchronously, awaits readall, decodes UTF-8,
      parses JSON and returns the result. ResourceNotFoundError returns None; authentication,
      transport, UTF-8 and JSON errors also return None. TTL kwargs are ignored.
    proof: [azure-tests]
  - text: >-
      async_set_cache_pipeline gathers independent async writes and awaits all of them.
    proof: [azure-tests]
  - text: >-
      disconnect closes the synchronous container client first and then awaits the asynchronous
      container client close.
    proof: [azure-tests]
  - text: >-
      Azure Blob configuration is loaded through betterlite-config from litellm_settings.cache_params;
      azure_account_url and azure_blob_container are both required.
    proof: [config-azure]
  - text: >-
      A blob-body decoder has a cargo-fuzz target at crates/betterlite-cache/fuzz/fuzz_targets/azure_blob_cache_body.rs
      and replays_the_azure_blob_cache_body_corpus parses every file in its corpus without a panic.
    proof: [azure-fuzz-corpus]
checks:
  optional: []
  commands:
    - id: azure-tests
      why: the cache or Azure tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^azure_blob_cache::/)'
    - id: config-azure
      why: Azure Blob settings are not loaded through betterlite-config or azure_account_url and azure_blob_container are not required
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^azure.*config/)'
    - id: azure-fuzz-corpus
      why: the Azure Blob cache body fuzz target or its corpus is missing, or replaying the corpus fails
      run: test -f crates/betterlite-cache/fuzz/fuzz_targets/azure_blob_cache_body.rs && test -n "$(ls -A crates/betterlite-cache/fuzz/corpus/azure_blob_cache_body)" && cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(replays_the_azure_blob_cache_body_corpus)'
oracle_cases: []
deviations:
  - what: "betterlite loads Azure Blob settings from config.yaml under litellm_settings.cache_params instead of environment variables alone."
    why: "LiteLLM accepts both; betterlite centralizes configuration through config.yaml for consistency."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/azure_blob_cache.py#L22-41
  - what: "betterlite requires both azure_account_url and azure_blob_container at construction time; missing values fail the builder."
    why: "LiteLLM accepts them as optional, but these are the only parameters the AzureBlobCache constructor takes. Requiring them upfront prevents silent failures."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/azure_blob_cache.py#L22-41
out_of_scope:
  - "The response-cache facade and integration. This task only builds the storage backend."
  - "The flush_cache method; it has no caller at the pinned commit."
  - "Other cache backends (Redis, in-memory, S3, GCS)."
  - "Cache strategy, TTL inheritance from general_settings or response headers."
  - "Container-wide deletion or management routes."
pitfalls:
  - "Container creation suppresses only ResourceExistsError. All other creation failures propagate and stop initialization."
  - "Synchronous upload omits overwrite=True; asynchronous upload sets it explicitly. The behavior difference is intentional and must be preserved."
  - "Serialization errors in both sync and async modes propagate before entering the exception handler; only upload failures are logged and swallowed."
  - "get_cache returns None for ResourceNotFoundError; other errors (auth, transport, UTF-8, JSON) also return None. There is no distinction between blob-not-found and decode-failed."
  - "disconnect calls container_client.close() synchronously first, then awaits async_container_client.close(). The order matters for resource cleanup."
  - "TTL kwargs are accepted but ignored; this cache backend has no expiration logic."
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
