id: B798
title: User daily activity reports
description: >-
  Register GET /user/daily/activity with B052 authentication and B865's management wrapper. Own
  resolve_user_daily_activity_entity_ids (2866-2875), _resolve_user_email_metadata (2878-2889) and
  get_user_daily_activity (2899-3004) in internal_user_endpoints.py. Build user_activity in betterlite-server.
  B2314's admin-view predicate allows a global report when user_id is absent, otherwise one requested
  user, including an empty string. A non-admin uses B861's required caller identity; absent caller ID
  is 403, and a different requested ID is ScopeDenied 403. Omitted user_id selects the caller despite
  the query documentation saying it is required. An unknown admin-selected user yields an empty report.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  resolve_user_daily_activity_entity_ids (L2866-L2875; 9 source lines), _resolve_user_email_metadata (L2878-L2889;
  12 source lines), get_user_daily_activity (L2899-L3004; 98 source lines).


  start_date/end_date/model/api_key/user_id/timezone default None; page=1 (minimum 1), page_size=50
  (1..1000), include_current_utc_day=false. Missing database is HTTP 500 with db_not_connected_error;
  missing either date is HTTP 400 with Please provide start_date and end_date. These precede the try.
  Forward all filters to B3091.get_daily_activity with table litellm_dailyuserspend, entity_id_field
  user_id, entity_metadata_field=None and timezone_offset_minutes=timezone. B3090 and B3091 own date parsing,
  timezone/current-day extension, query execution and SpendAnalyticsPaginatedResponse, not this route.
  Collect distinct nonempty string user_ids from the returned page, skip the database lookup if none,
  then fetch B723 user rows and attach user_email/user_alias including nulls; absent rows add no entry.
  The route rethrows HTTPException and logs other failures before HTTP 500 Failed to fetch analytics.
  There is no handle_exception_on_proxy call. HTTP fixtures compare B003's actual error envelope,
  type/param/code, status and content-type; ignore only message wording. No response cookie or redirect
  is produced. B790 supplies the typed _user_table accessor; no writes or budget-counter resets occur.


  Exercise independent B860 Postgres databases through POSTGRES_TEST_URL (CI supplies it), using
  testcontainers only when that variable is absent; a configured connection failure fails the test.
  Sizing: 119 nonblank, noncomment source lines, including docstrings; allow 120 production,
  260 behavior/database tests and 65 route wiring lines, 445 within a 475-line gate.


