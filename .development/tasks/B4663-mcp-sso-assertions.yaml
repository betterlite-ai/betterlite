deviations:
  - what: The license gate is not built. TokenExchangePrerequisites has no licensed field, so a gateway with JWT auth and a database exchanges tokens and advertises the grant, where LiteLLM without a license answers unsupported_grant_type with "JWT auth is an enterprise only feature; no license is set".
    why: betterlite has no paid tier and every feature is on. B053 records the same difference for JWT auth itself.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/idp_token_exchange.py#L52-L73
  - what: An id_token over 1048576 bytes or with JSON nested deeper than 64 is treated as undecodable, so it is not retained and the fixed warning is logged. LiteLLM has no such limit.
    why: Every decoder of outside bytes is bounded, and B760's decoder sets these two limits.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_store.py#L146-L152
  - what: The cache is one instance B8620 builds and shares, not the module global _ASSERTION_CACHE, so the epoch lives on that instance.
    why: betterlite keeps no module state. A reader sees the same behavior as long as every store shares the one Arc.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_store.py#L119
  - what: A negative MCP_SSO_ASSERTION_CACHE_TTL_SECONDS or MCP_OAUTH2_TOKEN_CACHE_MAX_SIZE fails the config load naming the variable. LiteLLM's int() takes it, a negative TTL then expires entries at once, and a negative size makes eviction pop an empty heap.
    why: Neither value has a meaning below zero, so the mistake surfaces at startup instead of in a login.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L180-L182
out_of_scope:
  - "SSOAssertionCache.flush: no caller at the pin; only LiteLLM's tests call it."
  - "_assertion_table, _mcp_server_table, _SSOAssertionTable and _MCPServerTable: Prisma typing shims that AssertionRows replaces, so nothing is left to port."
  - "The production AuthorizeSubjectToken over JWTAuthManager.auth_builder (B053) with route EXCHANGE_ROUTE, method POST and empty request data, the production TokenExchangeInputs over general_settings.enable_jwt_auth, the database handle and is_virtual_key_mapping_configured (B869), and the value of config_declares_id_jag from global_mcp_server_manager: the composition that wires POST /token, B136 for discoverable_endpoints.py. These are LiteLLM's read_token_exchange_prerequisites, _maps_jwts_to_virtual_keys and the closure in exchange_idp_subject_token."
  - "The /token grant that consumes SubjectIdentity and SubjectTokenRefusal: B4676. The types themselves, the refusing default and supported_grant_types: B4674."
  - "Capturing the token in the SSO callbacks and calling retain: B1615, B1617, B1623 and B1624."
  - "Reading through SsoAssertionStore in the id_jag credential path: B4667. Renewing a stale assertion: B4664."
  - "The warn-and-continue around rotation in the key rotation endpoint: B1700. The table's entry in the ciphertext migration list: B730."
  - "encrypt_value_helper and decrypt_value_helper (the StoredCipher): B1600. is_jwt: B2314. The unverified claims decoder: B760. The database chain finder: B1217. is_permanent_database_fault: B872."
  - "The table and its migration: B707."
  - "The HTTP cases for POST /token: the task that wires the route, since no route reaches this code yet."
pitfalls:
  - "The migration gives updated_at a DEFAULT and no trigger, so upsert's DO UPDATE arm and update must set updated_at = CURRENT_TIMESTAMP themselves or the column freezes at the first login."
  - "The epoch is one counter for the whole cache, so a login by user A also stops user B's in-flight fetch from caching; that lost write is LiteLLM's behavior, so don't key the epoch by user."
  - "fetch reads seen_epoch after the cache miss and before the row read; reading it after the row read lets a login slip between the two and the old assertion comes back for a full TTL."
  - "Only a found assertion is cached, so a user who has no row yet gets a row read on every fetch and their first login takes effect at once."
  - "persist invalidates only after the upsert returns; invalidating first opens a gap for a reader to cache the old row."
  - "invalidate bumps the epoch before removing the entry, so a concurrent reader can't see a gap where the entry is gone and the old epoch still holds."
  - "datetime.fromtimestamp raises for a year outside 1 to 9999, so exp 253402300800 returns None here too, even though chrono could hold that date."
  - "exp may be fractional (1700000000.5 is a valid NumericDate); std::time::Duration::try_from_secs_f64 turns it into a Duration with no as cast."
  - "expires_at equal to now counts as expired because the test is <=; a < here hands the IdP a token that dies in the same second."
  - "The cache keeps assertions past their exp, and fetch returns them; B4667 and B4664 judge expiry, so a filter here would silently stop the refresher from seeing a stale token."
  - "retention_enabled must ask the database row and never the in-memory server registry, because that registry can be stale in both directions across pods."
  - "id_jag_server_exists must not filter on status or approval_status: LiteLLM's find_first looks at auth_type alone, so a pending server still turns retention on."
  - "retain is the only swallow: fetch and persist return their errors, and rotation stops on a failed update, so a shared catch-all would break B1700's warning."
  - "An undecryptable row in rotation is skipped and left under the old key, and the rotated count only goes up after the update, so skipped plus rotated equals the rows read."
  - "Rotation doesn't touch the cache, since a cached entry holds decrypted fields that stay valid under the new key."
  - "The rotation loop has no transaction, so a failed update leaves earlier rows under the new key; don't wrap it in one."
  - "The denial reason can name the JWKS URL or quote the IdP, so a test must assert the reason's text is absent from the refusal description."
  - "The database chain check runs before the status check, so an HTTP 401 with a transient fault in database_cause is temporarily_unavailable, not invalid_request."
  - "A Proxy code such as \"abc\" or \"429\" is no outage, and only digits count, so \"5xx\" is invalid_request; don't parse with a fallback to 500."
  - "The agent check runs before the user check, so a token with both agent_id and user_id set is refused."
  - "A prerequisites refusal comes before the shape test, so a gateway without JWT auth answers unsupported_grant_type even for the subject token \"garbage\"."
  - "MCP_SSO_ASSERTION_CACHE_TTL_SECONDS=0 expires entries at once here; LiteLLM's default_ttl or 600 turns it into ten minutes, and docs/compatibility.md says an explicit 0 is used as given."
  - "MCP_OAUTH2_TOKEN_CACHE_MAX_SIZE is shared with LiteLLM's OAuth token caches; read the env var, and don't add a new name for this cache."
