id: B4663
title: "MCP SSO assertions and IdP subject-token admission"
description: >-
  Two LiteLLM modules land here. sso_assertion_store.py keeps a user's IdP id_token after an SSO login so an MCP server with auth_type oauth2_id_jag can later spend it as an RFC 8693 subject_token (LiteLLM calls this EMA egress). idp_token_exchange.py admits a native client's IdP JWT at POST /token: the gateway's JWT auth proves the token, and the answer is the user it names or an OAuth refusal. No route reaches either module yet, so this task builds typed functions and ports, and later tasks wire them in.

  Layout. betterlite-mcp gets the modules sso_assertions (submodules assertion, cache, store and rotation) and idp_token_exchange, because B4667 in that crate and the server's SSO callback tasks both need these types. betterlite-db gets sso_assertion_rows, the only place that holds SQL. betterlite-config gets the section mcp_sso_assertion_cache. Add betterlite-auth and betterlite-db as path dependencies in crates/betterlite-mcp/Cargo.toml; neither depends on betterlite-mcp, so there is no cycle. Names stop at 30 characters, so the long LiteLLM names change: fetch_sso_identity_assertion is DbSsoAssertionStore::fetch, persist_sso_identity_assertion is persist, ema_assertion_retention_enabled is retention_enabled, retain_sso_identity_assertion_for_ema is retain, and rotate_sso_identity_assertions_master_key is rotation::rotate_assertions. B1617, B1623 and B1700 use the LiteLLM names in their text.

  sso_assertions::assertion. SsoIdentityAssertion holds id_token: SecretString, refresh_token: Option<SecretString>, issuer: Option<String> and expires_at: Option<DateTime<Utc>>. assertion_from_sso_login(id_token: Option<&serde_json::Value>, refresh_token: Option<&serde_json::Value>) -> Option<SsoIdentityAssertion> takes the fields straight from the provider's untyped token response, since this is the one place they get validated. A missing, non-string or empty id_token returns None with no log line. A missing, non-string or empty refresh_token is dropped and the assertion still stands. Claims are read with no signature check, as LiteLLM does, through B760's betterlite_auth::jwt_claims::decode_unverified_claims. PyJWT's unverified decode also refuses a token whose header segment is not base64url text of a JSON object, whose third segment is not base64url, or whose payload is not a JSON object, so check here whatever B760's decoder leaves out. exp is a JSON number and iss a string; absent and null both mean no value. Any failure logs the warning "SSO id_token could not be decoded or its claims were unusable; not retaining it for EMA egress." and returns None, because a bad token must never fail a login.

  assertion_expired(assertion, now: DateTime<Utc>) -> bool is a match on expires_at: no expiry is false, otherwise expires_at <= now. B4664 passes a future now to ask whether the assertion is about to expire. encode_payload and decode_payload in the same file own the stored JSON: id_token always, and refresh_token, issuer and expires_at only when present. expires_at is ISO 8601 text with an offset. Text with no offset reads as UTC, and that replaces the naive branch in LiteLLM's assertion_expired. A row LiteLLM wrote opens here and a row written here opens in LiteLLM.

  sso_assertions::cache. SsoAssertionCache has the shape of ByokCredentialCache in credential_contracts::byok_cache: pub fields ttl, max_size, clock: Box<dyn Clock> (that file's trait) and a Mutex over the entries and one u64 epoch. Callers build it with a struct literal and share one Arc. get clones a live entry; an expired one is removed and reads as a miss. set_if_unchanged(user_id, assertion, seen_epoch) writes only if the epoch still equals seen_epoch. invalidate(user_id) adds one to the epoch and then removes the entry. InMemoryCache's limits carry over: a write first drops expired entries, then drops the entries with the earliest expiry until the cache is below max_size, max_size 0 stores nothing, and rewriting a live key replaces the value and keeps the first expiry.

  sso_assertion_rows in betterlite-db. AssertionRow { user_id, assertion_b64 } and the trait AssertionRows (native async fn, type Error: std::error::Error + Send + Sync + 'static) with find(user_id), find_all(), upsert(user_id, assertion_b64), update(user_id, assertion_b64) and id_jag_server_exists(). PostgresAssertionRows implements it over PostgresStore::session() with plain SQL on "LiteLLM_SSOIdentityAssertion" and "LiteLLM_MCPServerTable"; sync_store.rs shows the form. upsert is one INSERT with ON CONFLICT (user_id) DO UPDATE. id_jag_server_exists asks for any row with auth_type 'oauth2_id_jag', with no status or approval filter. update on a row that has gone is not an error.

  sso_assertions::store. The port is trait SsoAssertionStore with async fn fetch(&self, user_id: &str) -> Result<Option<SsoIdentityAssertion>, AssertionStoreUnavailable>. AssertionStoreUnavailable keeps its cause as #[source] Box<dyn Error + Send + Sync>. DbSsoAssertionStore<R: AssertionRows> has pub fields rows: Option<R>, cipher: DbCipher, cache: Arc<SsoAssertionCache> and config_declares_id_jag: bool. rows None stands for LiteLLM's prisma_client None. B8620 sets config_declares_id_jag from the config file's mcp_servers.

  fetch returns a cache hit, otherwise reads the epoch, calls fetch_uncached and caches a found assertion with set_if_unchanged. fetch_uncached never touches the cache: no rows or no row is None, the row is decrypted with field name sso_identity_assertion and DecryptPolicy { log: FailureLog::Debug, value: FailureValue::Nothing }, a failed decrypt is None, and a payload that won't parse logs the warning "Stored SSO identity assertion for user_id=%s could not be parsed; treating as absent." and is None. A row read failure is AssertionStoreUnavailable. Neither method judges expiry. persist(user_id, assertion) with no rows returns Ok and does nothing else; otherwise it encodes, encrypts under the current key, upserts and then invalidates the cache. retention_enabled is true when config_declares_id_jag is true (no query), false with no rows, otherwise id_jag_server_exists. retain(user_id, assertion: Option<&SsoIdentityAssertion>) returns unit: None does nothing, a false gate does nothing, and a failure in the gate or in persist logs the warning "Failed to persist the SSO identity assertion for EMA egress (user_id=%s): %s" and is swallowed, because the login must not fail on this write.

  sso_assertions::rotation. rotate_assertions(rows: &R, cipher: &DbCipher, new_master_key: &SecretString) reads find_all and then works one row at a time, so the table's plaintext is never held at once. A row that won't decrypt under the current key logs the warning "rotate_sso_identity_assertions_master_key: could not decrypt assertion for user_id=%s, skipping" and the loop goes on. Otherwise it calls cipher.encrypt_value with Some(new_master_key) and update. The last step logs at info "rotate_sso_identity_assertions_master_key: rotated %d row(s), skipped %d". An encrypt or update failure returns the error at once; B1700 owns the warn-and-continue around this call.

  idp_token_exchange. Constants: EXCHANGE_ROUTE "/token", and the descriptions "subject_token was rejected by the gateway's JWT auth", "the gateway could not verify subject_token because its identity provider or database is unavailable; retry" and "the gateway could not verify subject_token because its database reported a fault that is not a transient outage; retrying will not help until the gateway deployment is repaired". GatewayOutage is the enum Retryable, Faulted. TokenExchangePrerequisites { jwt_auth_enabled, has_database, maps_jwts_to_virtual_keys } has refusal() -> Option<SubjectTokenRefusal>, testing in that order and answering unsupported_grant_type with "JWT auth is not enabled on this gateway, so it cannot exchange IdP tokens", "this gateway has no database, so it cannot exchange IdP tokens" or "this gateway maps IdP tokens to virtual keys, which the exchange does not serve". LiteLLM's available property and token_exchange_available are refusal().is_none() where they are called, because the two agree once the license term is gone, and that value feeds B4674's supported_grant_types.

  Ports. trait TokenExchangeInputs has fn prerequisites(&self) -> TokenExchangePrerequisites, read on every exchange because LiteLLM reads its globals on every exchange. trait AuthorizeSubjectToken has type Context and async fn authorize(&self, subject_token: &str, context: &Self::Context) -> Result<AuthorizedSubject, SubjectTokenDenial>. AuthorizedSubject { user_id, team_id, agent_id }, each Option<String>, is the part of JWTAuthBuilderResult this code reads. SubjectTokenDenial { source: DenialSource, reason: String, database_cause: Option<DbError> } uses betterlite_db::database_faults::DbError, and DenialSource::Http { status: u16 }, Proxy { code: String } and Plain stand for LiteLLM's HTTPException, ProxyException and any other exception. IdpTokenExchange<I, A> { inputs: I, authorizer: A } implements B4674's ExchangeSubjectToken with A::Context as its request context, through identity_from_subject_token.

  identity_from_subject_token runs in this order: the prerequisites' refusal; betterlite_auth::resolved_key::credential::is_jwt false gives invalid_request "subject_token is not a JWT"; authorize, with a denial going to refusal_for; agent_id present gives invalid_request "Agent tokens require direct JWT authentication; this exchange supports users only"; user_id None gives invalid_request "subject_token names no user the gateway knows"; otherwise SubjectIdentity { user_id, team_id }, team_id None included. refusal_for first runs B1217's chain finder (LiteLLM's find_database_service_unavailable_error_in_chain, in betterlite_db::database_availability; read its Rust name there) on database_cause. A fault it finds is Faulted when is_permanent_database_fault is true and Retryable otherwise. With no fault, Http status 500 or more and a Proxy code of digits only with a value of 500 or more are Retryable. No outage logs the warning "token exchange refused a subject_token: %s" and answers invalid_request with the rejected text. An outage logs at error "token exchange could not verify a subject_token, %s: %s" with retryable or faulted and answers temporarily_unavailable with the matching text.

  Config. The section mcp_sso_assertion_cache reads two env vars with betterlite_env::number and no YAML key: MCP_SSO_ASSERTION_CACHE_TTL_SECONDS (default 60) and MCP_OAUTH2_TOKEN_CACHE_MAX_SIZE (default 200). Settings has ttl_seconds: u64 and max_size: usize. Its tests are sections::mcp_sso_assertion_cache::tests::uses_litellm_defaults, reads_both_env_vars and rejects_a_non_number.

  Fuzz. The id_token comes from the IdP and the payload text from a database row. The cargo-fuzz target sso_assertion_decode feeds arbitrary bytes, read as lossy UTF-8, to assertion_from_sso_login as the id_token and to decode_payload. sso_assertions::assertion::tests::replays_the_sso_assertion_corpus replays crates/betterlite-mcp/fuzz/corpus/sso_assertion_decode through the same two functions.

  Oracle. These are helper cases on the b4663 operation, and the HTTP cases come with the route. The Python adapter sets LITELLM_SALT_KEY to a fixed value and runs the pinned functions with a small in-memory prisma double, patching litellm.proxy.proxy_server.prisma_client and global_mcp_server_manager the way LiteLLM's test_sso_assertion_store.py does. The Rust side runs the same steps on an in-memory AssertionRows fake. A store case is a list of steps (fetch, fetch_uncached, persist, retain, rotate) and the output is each step's decrypted fields plus how many reads and writes the double saw, never ciphertext, because the nonce differs per run. For the exchange cases the input names the authorizer's result or failure: the adapter raises the matching HTTPException, ProxyException, plain Exception or database error, and the Rust side builds the matching SubjectTokenDenial. The adapter always passes licensed=True. exp values in cases are whole seconds. Cache expiry stays in native tests, since LiteLLM's cache takes no clock here.
