  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/handle_jwt.py#L276-L280
    why: The three-segment is_jwt test that B2314 already built.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/exception_handler.py#L393-L403
    why: The chain finder B1217 builds; it picks the first permanent fault, else the first outage.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/discoverable_endpoints.py#L2073
    why: Call site. /token passes exchange_idp_subject_token into the grant.
  - url: https://www.rfc-editor.org/rfc/rfc8693.html#section-2.2.2
    why: The token exchange error response; invalid_request is the code for an unacceptable subject token.
dod:
  - text: refusal gives the three unsupported_grant_type descriptions in LiteLLM's order and None when all prerequisites hold.
    proof: [exchange-tests, oracle, helper-python]
  - text: A subject token runs through the prerequisites, the JWT shape test, authorize, the agent check and the user check in that order, and the first failure wins.
    proof: [exchange-tests, oracle, helper-python]
  - text: A token with a user returns SubjectIdentity with its team_id or None, and an agent token or a token with no user is invalid_request with its own description.
    proof: [exchange-tests, oracle, helper-python]
  - text: A plain denial, a 4xx HTTP denial and a Proxy denial with a low or non-numeric code answer invalid_request with the rejected text.
    proof: [exchange-tests, oracle, helper-python]
  - text: A 5xx HTTP denial and a Proxy denial with a digits-only code of 500 or more answer temporarily_unavailable with the retry text.
    proof: [exchange-tests, oracle, helper-python]
  - text: A database cause wins over the status, so a 401 with a transient fault gets the retry text and one with a permanent fault gets the faulted text.
    proof: [exchange-tests, oracle, helper-python]
  - text: The denial reason reaches the warning or error log and never the refusal description.
    proof: [exchange-tests]
  - text: IdpTokenExchange reads the prerequisites on every call and answers through B10063's ExchangeSubjectToken.
    proof: [exchange-tests]
  - text: The b4663 adapter passes the strict Python checks and a new helper seed names the operation.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: exchange-tests
      why: The prerequisite, order or denial classification tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^idp_token_exchange::tests::/)'
    - id: helper-python
      why: The b4663 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4663.py tools/oracle/helpers/b4663)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4663 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/idp-token-exchange-*")" &&
        grep -lE 'b4663"?:' tools/oracle/fuzz/corpus/helper_case/idp-token-exchange-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-mcp --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/idp-token-exchange/prerequisites-refusal-order.yaml
  - tools/oracle/cases/helpers/idp-token-exchange/exchange-identity.yaml
  - tools/oracle/cases/helpers/idp-token-exchange/exchange-not-a-jwt.yaml
  - tools/oracle/cases/helpers/idp-token-exchange/exchange-agent-and-no-user.yaml
  - tools/oracle/cases/helpers/idp-token-exchange/exchange-rejected.yaml
  - tools/oracle/cases/helpers/idp-token-exchange/exchange-gateway-outage.yaml
  - tools/oracle/cases/helpers/idp-token-exchange/exchange-database-fault.yaml
deviations:
  - what: The license gate is not built. TokenExchangePrerequisites has no licensed field, so a gateway with JWT auth and a database exchanges tokens and advertises the grant, where LiteLLM without a license answers unsupported_grant_type with "JWT auth is an enterprise only feature; no license is set".
    why: betterlite has no paid tier and every feature is on. B053 records the same difference for JWT auth itself.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/idp_token_exchange.py#L52-L73
out_of_scope:
  - "The production AuthorizeSubjectToken over JWTAuthManager.auth_builder (B053) with route EXCHANGE_ROUTE, method POST and empty request data, the production TokenExchangeInputs over general_settings.enable_jwt_auth, the database handle and is_virtual_key_mapping_configured (B869): the composition that wires POST /token, B136 for discoverable_endpoints.py. These are LiteLLM's read_token_exchange_prerequisites, _maps_jwts_to_virtual_keys and the closure in exchange_idp_subject_token."
  - "SubjectIdentity, SubjectTokenRefusal, RefusalCode and the ExchangeSubjectToken trait: B10063. The refusing default and supported_grant_types: B4674. The /token grant that consumes the answer: B4676."
  - "The SSO assertion reads in sso_assertion_store.py (SsoAssertionStore, AssertionStoreUnavailable, fetch and fetch_uncached): B10064."
  - "is_jwt: B2314. The database chain finder: B1217. is_permanent_database_fault: B872."
  - "The HTTP cases for POST /token: the task that wires the route, since no route reaches this code yet."
pitfalls:
  - "The denial reason can name the JWKS URL or quote the IdP, so a test must assert the reason's text is absent from the refusal description."
  - "The database chain check runs before the status check, so an HTTP 401 with a transient fault in database_cause is temporarily_unavailable, not invalid_request."
  - "A Proxy code such as \"abc\" or \"429\" is no outage, and only digits count, so \"5xx\" is invalid_request; don't parse with a fallback to 500."
  - "The agent check runs before the user check, so a token with both agent_id and user_id set is refused."
  - "A prerequisites refusal comes before the shape test, so a gateway without JWT auth answers unsupported_grant_type even for the subject token \"garbage\"."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
