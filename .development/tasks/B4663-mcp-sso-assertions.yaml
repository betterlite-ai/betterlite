id: B4663
title: "MCP IdP subject-token admission"
description: >-
  idp_token_exchange.py admits a native client's IdP JWT at the gateway's POST /token (RFC 8693 token exchange): the gateway's JWT auth proves the token, and the answer is the user it names or an OAuth refusal. The values it answers with, SubjectIdentity and SubjectTokenRefusal, and the ExchangeSubjectToken port it implements are B10063's, in gateway_dcr::subject_token. The read side of sso_assertion_store.py that this task once held is B10064's. No route reaches this code yet, so this task builds typed functions and ports, and later tasks wire them in.

  Layout. betterlite-mcp, module idp_token_exchange (crates/betterlite-mcp/src/idp_token_exchange.rs, with its tests in idp_token_exchange/tests.rs), an empty stub lib.rs declares. B10063's RefusalCode gives the three codes used below.

  idp_token_exchange. Constants: EXCHANGE_ROUTE "/token", and the descriptions "subject_token was rejected by the gateway's JWT auth", "the gateway could not verify subject_token because its identity provider or database is unavailable; retry" and "the gateway could not verify subject_token because its database reported a fault that is not a transient outage; retrying will not help until the gateway deployment is repaired". GatewayOutage is the enum Retryable, Faulted. TokenExchangePrerequisites { jwt_auth_enabled, has_database, maps_jwts_to_virtual_keys } has refusal() -> Option<SubjectTokenRefusal>, testing in that order and answering unsupported_grant_type with "JWT auth is not enabled on this gateway, so it cannot exchange IdP tokens", "this gateway has no database, so it cannot exchange IdP tokens" or "this gateway maps IdP tokens to virtual keys, which the exchange does not serve". LiteLLM's available property and token_exchange_available are refusal().is_none() where they are called, because the two agree once the license term is gone, and that value feeds B4674's supported_grant_types.

  Ports. trait TokenExchangeInputs has fn prerequisites(&self) -> TokenExchangePrerequisites, read on every exchange because LiteLLM reads its globals on every exchange. trait AuthorizeSubjectToken has type Context and async fn authorize(&self, subject_token: &str, context: &Self::Context) -> Result<AuthorizedSubject, SubjectTokenDenial>. AuthorizedSubject { user_id, team_id, agent_id }, each Option<String>, is the part of JWTAuthBuilderResult this code reads. SubjectTokenDenial { source: DenialSource, reason: String, database_cause: Option<DbError> } uses betterlite_db::database_faults::DbError, and DenialSource::Http { status: u16 }, Proxy { code: String } and Plain stand for LiteLLM's HTTPException, ProxyException and any other exception. IdpTokenExchange<I, A> { inputs: I, authorizer: A } implements B10063's ExchangeSubjectToken<A::Context> through identity_from_subject_token.

  identity_from_subject_token runs in this order: the prerequisites' refusal; betterlite_auth::resolved_key::credential::is_jwt false gives invalid_request "subject_token is not a JWT"; authorize, with a denial going to refusal_for; agent_id present gives invalid_request "Agent tokens require direct JWT authentication; this exchange supports users only"; user_id None gives invalid_request "subject_token names no user the gateway knows"; otherwise SubjectIdentity { user_id, team_id }, team_id None included. refusal_for first runs B1217's chain finder (LiteLLM's find_database_service_unavailable_error_in_chain, in betterlite_db::database_availability; read its Rust name there) on database_cause. A fault it finds is Faulted when is_permanent_database_fault is true and Retryable otherwise. With no fault, Http status 500 or more and a Proxy code of digits only with a value of 500 or more are Retryable. No outage logs the warning "token exchange refused a subject_token: %s" and answers invalid_request with the rejected text. An outage logs at error "token exchange could not verify a subject_token, %s: %s" with retryable or faulted and answers temporarily_unavailable with the matching text.

  This task parses no outside bytes of its own: the subject token only meets B2314's is_jwt shape test and the injected authorizer.

  Oracle. These are helper cases on the b4663 operation, and the HTTP cases come with the route. A case gives the prerequisites and names the authorizer's result or failure: the adapter runs the pinned identity_from_subject_token with an authorize double that returns the result or raises the matching HTTPException, ProxyException, plain Exception or database error, and the Rust side builds the matching SubjectTokenDenial. The adapter always passes licensed=True.
scope:
  paths:
    - crates/betterlite-mcp/src/idp_token_exchange.rs
    - crates/betterlite-mcp/src/idp_token_exchange/**
    - crates/betterlite-mcp/Cargo.toml
    - Cargo.lock
    - tools/oracle/cases/helpers/idp-token-exchange/**
    - tools/oracle/fuzz/corpus/helper_case/idp-token-exchange-*
    - tools/oracle/helpers/b4663.py
    - tools/oracle/helpers/b4663/**
    - tools/oracle/src/helpers/mcp/b4663.rs
    - tools/oracle/src/helpers/mcp/b4663/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/gateway_dcr_flow.py#L216-L233
