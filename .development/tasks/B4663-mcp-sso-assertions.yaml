dod:
  - text: assertion_from_sso_login returns the id_token, refresh token, issuer and expiry of a decodable token, with issuer and expiry None when the claims are absent or null.
    proof: [assertion-tests, oracle, helper-python]
  - text: A missing, empty or non-string id_token returns None with no log line, and a missing, empty or non-string refresh_token is dropped while the assertion stands.
    proof: [assertion-tests, oracle, helper-python]
  - text: A token that fails decoding, a wrong-typed exp or iss, and an exp outside the years 1 to 9999 each log the fixed warning and return None.
    proof: [assertion-tests, oracle, helper-python]
  - text: assertion_expired is false with no expiry, false before it, true at the exact expiry and after it, and true for a future now past the expiry.
    proof: [assertion-tests, oracle, helper-python]
  - text: A stored payload keeps every field through encode and decode, leaves unset fields out of the JSON, and reads expires_at text with no offset as UTC.
    proof: [assertion-tests, oracle, helper-python]
  - text: A row LiteLLM encrypted opens to the same fields here.
    proof: [oracle, helper-python]
  - text: The token and refresh token text appear in no Debug output, log line or error text.
    proof: [assertion-tests, store-tests]
  - text: The two decoders never panic on arbitrary bytes, and the added corpus replays through them.
    proof: [assertion-corpus]
  - text: get returns a live entry and reads an expired one as a miss, and rewriting a live key keeps its first expiry.
    proof: [cache-tests]
  - text: set_if_unchanged writes nothing after an invalidate for this user or any other user, and writes when the epoch is unchanged.
    proof: [cache-tests]
  - text: A full cache drops expired entries first and then the earliest expiry, and max_size 0 stores nothing.
    proof: [cache-tests]
  - text: fetch skips the row read on a hit, caches a found assertion, reads the row again after an absent result, and returns an expired assertion unjudged.
    proof: [store-tests, oracle, helper-python]
  - text: An invalidate that lands during a fetch's row read stops that fetch from caching the old assertion.
    proof: [store-tests, oracle, helper-python]
  - text: fetch_uncached reads the row every time and leaves the cache as it was.
    proof: [store-tests, oracle, helper-python]
  - text: A row that won't decrypt reads as absent, and a payload that won't parse logs the fixed warning and reads as absent; neither reaches the caller as an error.
    proof: [store-tests, oracle, helper-python]
  - text: A row read failure is AssertionStoreUnavailable from fetch and fetch_uncached, and no database at all reads as absent.
    proof: [store-tests, oracle, helper-python]
  - text: persist upserts the encrypted payload and then invalidates the cache, leaves the cache alone when the upsert fails, and does nothing with no database.
    proof: [store-tests, oracle, helper-python]
  - text: retention_enabled is true from the config flag without a query, false with no database, and otherwise follows the row lookup.
    proof: [store-tests, oracle, helper-python]
  - text: retain does nothing for None or a false gate, and logs the fixed warning and returns normally when the gate or the write fails.
    proof: [store-tests, oracle, helper-python]
  - text: rotate_assertions moves every readable row to the new key and logs the counts, and a row that won't decrypt is skipped with the fixed warning and stays as it was.
    proof: [rotation-tests, oracle, helper-python]
  - text: An update failure during rotation stops at that row and returns the error, with earlier rows left rotated.
    proof: [rotation-tests]
  - text: On real Postgres, upsert creates and replaces a row, upsert and update both move updated_at, find and find_all return the stored text, update on a missing row is not an error, and id_jag_server_exists ignores every column but auth_type.
    proof: [rows-tests]
  - text: refusal gives the three unsupported_grant_type descriptions in LiteLLM's order and None when all prerequisites hold.
    proof: [exchange-tests, oracle, helper-python]
  - text: A subject token runs through the prerequisites, the JWT shape test, authorize, the agent check and the user check in that order, and the first failure wins.
    proof: [exchange-tests, oracle, helper-python]
  - text: A token with a user returns SubjectIdentity with its team_id or None, and an agent token or a token with no user is invalid_request with its own description.
    proof: [exchange-tests, oracle, helper-python]
  - text: A plain denial, a 4xx HTTP denial and a Proxy denial with a low or non-numeric code answer invalid_request with the rejected text.
    proof: [exchange-tests, oracle, helper-python]
  - text: A 5xx HTTP denial and a Proxy denial with a digits-only code of 500 or more answer temporarily_unavailable with the retry text.
    proof: [exchange-tests, oracle, helper-python]
  - text: A database cause wins over the status, so a 401 with a transient fault gets the retry text and one with a permanent fault gets the faulted text.
    proof: [exchange-tests, oracle, helper-python]
  - text: The denial reason reaches the warning or error log and never the refusal description.
    proof: [exchange-tests]
  - text: IdpTokenExchange reads the prerequisites on every call and answers through B4674's ExchangeSubjectToken.
    proof: [exchange-tests]
  - text: The section gives 60 and 200 with no env vars, reads both env vars, and fails the load naming the variable for a value that isn't a number.
    proof: [settings-tests]
  - text: The b4663 adapter passes the strict Python checks and a new helper seed names the operation.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: assertion-tests
      why: The login capture, expiry or stored payload tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^sso_assertions::assertion::tests::/) - test(/replays_the_/)'
    - id: assertion-corpus
      why: The sso_assertion_decode fuzz target, its added corpus or its replay test is missing or fails.
      run: >-
        test -f crates/betterlite-mcp/fuzz/fuzz_targets/sso_assertion_decode.rs &&
        grep -q sso_assertion_decode crates/betterlite-mcp/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/sso_assertion_decode)" &&
        cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(replays_the_sso_assertion_corpus)'
    - id: cache-tests
      why: The epoch, expiry or eviction tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^sso_assertions::cache::tests::/)'
    - id: store-tests
      why: The fetch, persist, retention or retain tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^sso_assertions::store::tests::/)'
    - id: rotation-tests
      why: The master-key rotation tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^sso_assertions::rotation::tests::/)'
    - id: rows-tests
      why: The Postgres row tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^sso_assertion_rows::tests::/)'
    - id: exchange-tests
      why: The prerequisite, order or denial classification tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^idp_token_exchange::tests::/)'
    - id: settings-tests
      why: The env var tests for the cache section are missing or fail.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_sso_assertion_cache::tests::/)'
    - id: helper-python
      why: The b4663 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4663.py tools/oracle/helpers/b4663)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4663 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/mcp-sso-assertions-*")" &&
        grep -lE 'b4663"?:' tools/oracle/fuzz/corpus/helper_case/mcp-sso-assertions-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
