checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail
      -E 'test(/^api::batch_read_routes::/) - test(/::replays_corpus$/)'
  - id: case-batch-retrieve-managed
    why: the batch-retrieve-managed behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::batch_retrieve_managed($|::)/)'
  - id: case-batch-provider-fallback
    why: the batch-provider-fallback behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::batch_provider_fallback($|::)/)'
  - id: case-batch-output-file-rewrite
    why: the batch-output-file-rewrite behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::batch_output_file_rewrite($|::)/)'
  - id: case-terminal-cost-finalization
    why: the terminal-cost-finalization behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::terminal_cost_finalization($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::route_aliases($|::)/)'
  - id: case-auth-missing
    why: the auth-missing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::auth_missing($|::)/)'
  - id: case-auth-invalid
    why: the auth-invalid behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::auth_invalid($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::batch_read_routes::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/batch-read-routes-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/batch-read-routes)"
