dod:
- text: >-
    executed_batch_unavailable GETs the base64 unified id for litellm_proxy;model_id:deploy_a;llm_batch_id:litellm_batch_missing
    with deploy_a allowed and require_managed_files=false. The absent managed hook yields 404 invalid_request_error,
    param=null, code="404", no upstream request and no database mutation, even if a matching managed-object row was seeded.
  proof:
  - case-executed-batch-unavailable
  - oracle
- text: >-
    batch_provider_fallback sends GET /openai/v1/batches/batch_a with header custom-llm-provider=azure and query
    custom_llm_provider=bedrock; OpenAI receives batch_a and the mock 200 object=batch/status=in_progress returns.
    Without a path provider, header=openai beats query=azure; without a header, query=openai beats JSON body
    custom_llm_provider=azure. With all sources absent and an OpenAI key configured, openai is selected. Body-only
    provider=azure is ignored. Provider requests use team credentials when B1020 resolves them.
  proof:
  - case-batch-provider-fallback
  - oracle
- text: >-
    batch_output_file_rewrite retrieves batch_bGl0ZWxsbTpiYXRjaF9hO21vZGVsLGJhdGNoLW1vZGVs for authorized batch-model.
    Upstream receives batch_a with that model's credentials. A mock 200 with id=batch_a, input_file_id=file-in,
    output_file_id=file-out and error_file_id=file-err returns the same model-encoded batch id and file- prefixed
    unpadded base64url encodings of litellm:file-in;model,batch-model, litellm:file-out;model,batch-model and
    litellm:file-err;model,batch-model respectively. Empty/null file ids remain empty/null.
  proof:
  - case-batch-output-file-rewrite
  - oracle
- text: >-
    managed_rows_do_not_shortcut_provider seeds a completed managed-object row for a non-executed unified batch.
    With require_managed_files=false and deploy_a authorized, retrieval still calls the mock and returns its 200
    status=in_progress. The row is unchanged, no cost-finalization/refund hook runs, and batch_ignore_default_logging
    is not set. Pre-existing file mappings may replace input/output/error ids after the provider result; absent
    mappings leave raw ids unchanged and create no managed-file rows.
  proof:
  - case-managed-rows-no-shortcut
  - oracle
- text: route_aliases retrieves batch_a through /batches/batch_a, /v1/batches/batch_a and /openai/v1/batches/batch_a; each returns the mock 200 batch object with x-litellm-call-id.
  proof:
  - case-route-aliases
  - oracle
- text: auth_missing omits authorization from GET /v1/batches/batch_a with a test master key configured; it returns 401 auth_error/param="None"/code="401" and makes no provider call.
  proof:
  - case-auth-missing
  - oracle
- text: auth_invalid sends Bearer sk-invalid to that protected route; it returns 401 auth_error/param="None"/code="401" before provider selection.
  proof:
  - case-auth-invalid
  - oracle
- text: loads_settings accepts omitted, null, false and true enable_loadbalancing_on_batch_endpoints values and the matching config corpus replays.
  proof:
  - config-tests
  - config-corpus
- text: Every batch retrieval fixture is newly added and the complete server/core/config tests run with the HTTP oracle.
  proof:
  - new-oracle-cases
  - behavior-tests
  - oracle
- text: >-
    routing_failures uses a raw batch id with enable_loadbalancing_on_batch_endpoints=true and no router: 500
    internal_server_error/null/"500". Separately omit the flag, all provider sources and every OpenAI key source:
    GET /v1/batches/batch_a returns 404 invalid_request_error/null/"404". Both failures carry x-litellm-call-id and call no provider.
  proof: [case-routing-failures, oracle]
- text: >-
    managed_requirement_precedes_model grants only model other, while the unified id addresses deploy_a.
    With require_managed_files=true, the absent ownership hook returns 500 internal_server_error/null/"500"
    before the model denial. A raw batch_a instead returns 400 internal_server_error/null/"400". With the requirement
    false, the unified id reaches model authorization and returns 403 key_model_access_denied/param=model/code="403".
    None of these cases resolves provider credentials or sends upstream traffic.
  proof: [case-managed-requirement, oracle]
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail
      -E 'test(/^api::batch_read_routes::/) - test(/::replays_corpus$/)'
  - id: case-executed-batch-unavailable
    why: an executed id without the managed hook reaches a provider or a fabricated batch record
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::executed_batch_unavailable($|::)/)'
  - id: case-batch-provider-fallback
    why: the batch-provider-fallback behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::batch_provider_fallback($|::)/)'
  - id: case-batch-output-file-rewrite
    why: the batch-output-file-rewrite behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::batch_output_file_rewrite($|::)/)'
  - id: case-managed-rows-no-shortcut
    why: a managed-object row activates an enterprise-only shortcut
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::managed_rows_do_not_shortcut_provider($|::)/)'
  - id: case-routing-failures
    why: missing router and unservable OpenAI fallback use the same error projection
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::routing_failures($|::)/)'
  - id: case-managed-requirement
    why: model authorization runs before the required managed-id validation
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::managed_requirement_precedes_model($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::route_aliases($|::)/)'
  - id: case-auth-missing
    why: the auth-missing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::auth_missing($|::)/)'
  - id: case-auth-invalid
    why: the auth-invalid behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::batch_read_routes::tests::auth_invalid($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::batch_read_routes::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/batch-read-routes-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/batch-read-routes)"
