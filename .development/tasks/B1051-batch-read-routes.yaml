id: B1051
title: Batch read routes
description: >-
  Install batch retrieve/list routes with managed ownership and source provider fallback. Reconcile provider state,
  managed output IDs, cost finalization and quota refunds before returning a typed batch/list object; do not delete
  completed records while cost polling still owns them.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-server/src/api/batch_read_routes.rs, crates/betterlite-core/src/api/batch_read_routes.rs.
  Use BatchReadRoutesInput and BatchReadRoutesResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /{provider}/v1/batches/{batch_id:path}; GET /v1/batches/{batch_id:path};
  GET /batches/{batch_id:path}. Each alias is exercised through the booted proxy. Every route factory is mounted
  once; a family composer mounts its child factories without re-registering their methods/paths.


  Route input projections: data.file_id (absent original_batch_id); data.litellm_call_id (absent '').


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:726 status_code=500, exception_detail=FastAPI detail object. Compare the actual
  source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions batch_retrieve_managed, batch_provider_fallback, batch_output_file_rewrite,
  terminal_cost_finalization, route_aliases, auth_missing, auth_invalid under api::batch_read_routes::tests. Each
  named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.enable_loadbalancing_on_batch_endpoints
  defaults to None. No environment reads occur outside betterlite-config. Test api::batch_read_routes::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/batches_endpoints/endpoints.py: retrieve_batch (L542-L829). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 238 owned nonblank/non-comment/non-docstring Python lines (249 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 258 implementation,
  82 behavior tests, 84 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  38 wiring; 495 total within the 500-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1017 (Managed resource access), B1037
  (Batch provider read), B1040 (Batch cost finalize), B1041 (Batch managed records), B1043 (Batch enqueued refund),
  B1087 (Api boundaries), B1112 (Batch route support), B1129 (Batch provider list), B1100 (Shared request body decoding),
  B1133 (Batch list route), B732 (Typed authentication principals and grant resolution), B855 (Authenticated request
  admission and budget handoff), B756 (Authentication header selection and mode dispatch), B1019 (File routing ids),
  B1021 (File upload options), B1048 (Executed batch input), B1020 (File credentials), B003 (HTTP server, health
  routes and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces and Postgres
  test fixture), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
