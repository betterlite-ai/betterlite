deviations:
- what: Managed-file ownership and executed-batch retrieval remain unavailable; required managed ownership returns 500 internal_server_error/null/"500", and executed batch retrieval with that requirement off returns 404 invalid_request_error/null/"404".
  why: Pending Max's managed-files/batches decision, retain the open-source no-enterprise behavior rather than recreate the proprietary hook.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1324-L1351
out_of_scope:
- 'litellm/proxy/batches_endpoints/endpoints.py: B1112 owns _request_tags L82-L86, _litellm_executed_batch_runner
  L89-L105, _batch_from_database L108-L131, _raise_when_input_file_must_be_managed L134-L141, _litellm_metadata_of
  L144-L155, _raise_not_found_when_openai_fallback_unservable L158-L172, _resolve_managed_input_file_storage_url
  L175-L197, _create_provider_batch_for_managed_file L200-L215.'
- 'litellm/proxy/batches_endpoints/endpoints.py: B1050 owns create_batch L233-L524.'
- 'litellm/proxy/batches_endpoints/endpoints.py: B1133 owns list_batches L847-L1014.'
- 'litellm/proxy/batches_endpoints/endpoints.py: B086 owns cancel_batch L1032-L1256.'
- The cached terminal response path requires the enterprise managed_files hook; B1041 documents the MIT no-hook early return.
- B1037 owns provider HTTP execution; B162 owns Router.aretrieve_batch, and B1040/B1043 own cost finalization/refund helpers unused by this MIT route path.
pitfalls:
- A GET body custom_llm_provider is not a fallback source; only path, header and query select the provider here.
- An existing managed-object row alone cannot activate terminal retrieval without managed_files.
- prepare_data_with_credentials writes file_id; retrieve_batch must move it to batch_id before calling the SDK.
review_level: security
budget:
  max_changed_lines: 700
  max_new_expects: 0
