id: B1051
title: Batch retrieval route
description: >-
  Implement the complete retrieve_batch handler and its three GET aliases. List registration belongs to B1133.
  Run B1021 validate_managed_id_requirement before decoding the model or preparing the request. B004's
  common_processing_pre_call_logic uses route_type=aretrieve_batch. When a unified id contains a model id,
  resolve it through B844 and call B1020 authorize_model_for_key before any credentials or provider request.
  Fall back to the id itself if the catalog cannot resolve its model name.


  Without enterprise, managed_files is absent: B1112/B1041's database lookup returns (None,None), even for an
  existing managed-object row. An executed-batch id consequently returns 404 invalid_request_error/null/"404".
  The cached terminal-response shortcut is unreachable here. Do not simulate its hook or build automatic batch
  accounting/refunds. For ordinary provider responses, update_batch_in_database is a no-op; after success hooks,
  ensure_batch_response_managed_file_ids may still resolve existing input/output/error file mappings for a unified
  batch id, but it cannot mint new managed file ids. The enterprise cost poller is inactive, so this handler does
  not set litellm_metadata.batch_ignore_default_logging=true.


  Use betterlite-server::api::batch_read_routes for HTTP extraction and betterlite-core::api::batch_read_routes
  for retrieval orchestration. B1087 bounds the addressed id; B1019 decodes it. B012 supplies success/failure hooks
  and tracked request-status updates. The server owns and drains those updates instead of detaching tasks.


  Register exactly these routes in this task: GET /{provider}/v1/batches/{batch_id:path}; GET /v1/batches/{batch_id:path};
  GET /batches/{batch_id:path}. batch_id is a trailing path capture, so it may contain slashes. B086 mounts this
  retrieval factory; it must not register these GET handlers again when composing cancellation and listing.


  Start data with batch_id from the path; never initialize a file_id from an unrelated body projection.
  A model-encoded id selects authorized model credentials, moves the credentials helper's file_id into batch_id,
  adds model and model_info, and sets litellm_metadata.model_group only when absent. B1037 performs the SDK call;
  B1019 encodes the returned batch id and each nonempty input_file_id/output_file_id/error_file_id with that model.
  Otherwise, a unified id or enable_loadbalancing_on_batch_endpoints=true uses Router.aretrieve_batch (B162).
  No router raises HTTPException 500 with source detail {error:"LLM Router not initialized. Ensure models added to proxy."}.
  B2400 converts that to 500 internal_server_error/param=null/code="500".


  The fallback provider is truthy path provider, then custom-llm-provider header, then custom_llm_provider query,
  then openai. There is no body source. Apply team credentials before B1112's unservable-fallback check. If no provider
  was requested and data.api_key, litellm.api_key, litellm.openai_key and OPENAI_API_KEY are all absent/empty, return
  404 invalid_request_error, param=null, code="404", source message "No batch found with id '<id>'.".
  An explicit provider skips this preliminary 404. Error handling awaits the failure hook, logs the exception with
  request_litellm_call_id and delegates to B2400; an existing ProxyException preserves its type/param/code.


  Implement the DoD's named tests under api::batch_read_routes::tests. Fixtures seed an ordinary key and explicit
  model grants; auth tests keep a fixed test master key configured. On success, compare B004's x-litellm-call-id,
  x-litellm-model-id, x-litellm-cache-key and x-litellm-model-api-base headers, including their omission/empty defaults
  when _hidden_params lacks model_id/cache_key/api_base. Error tests compare every error field except message wording.


  betterlite-config::api::batch_read_routes::tests::loads_settings loads omitted/null enable_loadbalancing_on_batch_endpoints
  as None, false as false and true as true; only true selects router fallback for a raw batch id. Seed B002's config_yaml
  corpus with those values. require_managed_files is B1021's false-default setting, not a duplicate declaration here.


  HTTP extraction and B1019 id decoding already bound and parse the input; retrieval adds orchestration, not a new decoder.


  Run each batch fixture through the two HTTP servers and the same mock provider. B1139 isolates the seeded
  managed rows and virtual keys. Match status, typed error fields, selected response headers and provider captures;
  native orchestration tests also assert hook/write order. Every Python dependency is the MIT checkout without enterprise.


  Own retrieve_batch L542-L829, with decorators beginning at L527. Its terminal-cache branch remains documented
  out of scope because it requires the absent enterprise managed_files hook; the function itself has one owner.


  Sizing: 238 owned nonblank/non-comment/non-docstring Python lines (249 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 258 implementation,
  140 behavior tests, 210 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  38 wiring; 679 total within the 700-line cap. The estimate includes tests and adapters, not just production code.


  Direct service owners are B004/B012 for processing/hooks, B844 for resolved model names, B1037 for provider retrieval,
  B162 for Router.aretrieve_batch, B1019-B1021 for ids/credentials/managed requirements, B1041/B1112 for MIT batch support,
  B1048 for batch_error and B2400 for provider-hint accessors/error handling. B732/B855/B756 provide authenticated
  admission; B003/B002/B1087 provide HTTP/config/limits and B1139/B856 supply isolated HTTP fixtures.


  A provider response passes through the success hook before existing file-id normalization, then the tracked
  success-status update is submitted and custom headers are attached. A hook exception enters the failure path;
  do not mark that call successful or return the pre-hook body. B012 owns callback execution and its own failures.


  Errors before common_processing_pre_call_logic may have no call id; request_litellm_call_id returns None in that
  case and B2400 adds no x-litellm-call-id header. Later failures retain the id established by common processing.
