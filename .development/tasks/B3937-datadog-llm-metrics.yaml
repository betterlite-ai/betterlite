id: B3937
title: Datadog LLM span kinds, errors and token metrics
description: >-
  Build span-kind classification, structured errors and token/cost metrics for Datadog LLM Observability spans.
  Implement token counting from tool results and usage object fields, including cache-read and cache-write token
  extraction through injected B1693 cache helpers, with reasoning-token support. Map call-type strings to span kinds
  (llm, tool, task, embedding, retrieval) with non-LLM kinds requiring a parent span ID. Assemble structured error
  information from StandardLoggingPayload failures, preserving error message/type/stack and creating no error object
  when error_information is absent. Build complete span metrics with prompt/completion/total tokens, prompt-cache
  counts clamped at zero on residual, time-to-first-token latency, and reasoning tokens distinguished in
  output_tokens_details. In betterlite's Rust records, represent total_cost as Decimal for higher precision than
  LiteLLM's float. Inject B196's token_counter(model, text) and B1693's extract_cache_read_tokens/extract_cache_creation_tokens;
  inherit tool_output_tokens accumulation and redaction from B3935/B3936.
scope:
  paths:
    - crates/betterlite-logging/src/datadog_llm_metrics.rs
    - crates/betterlite-logging/src/datadog_llm_metrics/**
    - tools/oracle/cases/helpers/datadog-llm-metrics/**
    - Cargo.toml
    - tools/oracle/helpers/b3937.py
    - tools/oracle/helpers/b3937/**
    - tools/oracle/src/helpers/logging/b3937.rs
    - tools/oracle/src/helpers/logging/b3937/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L207-L213
  why: Tool output token counting function from message tool_results.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L240-L254
  why: Reasoning output token extraction from usage object details fields.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L697-L718
  why: Error info assembly from failure payloads with fallback message handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L730-L772
  why: Metrics assembly including cache counts, cost as Decimal, and token distinctions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L842-L943
  why: Span-kind classification mapping call types to DD LLM Obs kinds with parent ID requirement for non-llm.
dod:
- text: Tool output tokens are counted from all tool_results in messages, returning None when none present.
  proof:
  - token-metrics-tests
- text: Reasoning output tokens are extracted from completion_tokens_details or output_tokens_details,
    returning 0.0 when absent or non-numeric.
  proof:
  - token-metrics-tests
- text: Error info is assembled from error_information field on failures, with fallback to error_str,
    and no object created when error_information is absent.
  proof:
  - token-metrics-tests
  - oracle
- text: Span metrics include prompt/completion/total tokens, cost, time-to-first-token, cache read/write counts,
    non-cached input clamped at zero, and reasoning tokens when present.
  proof:
  - token-metrics-tests
  - oracle
- text: Cache read/write tokens are extracted only when present and non-zero, residual input clamps at zero,
    and tool output tokens appear only when counted.
  proof:
  - token-metrics-tests
  - oracle
- text: >-
    Span kinds map call types: chat/completion/LLM types return llm, embedding types return embedding,
    tool/mcp types return tool, retrieval types return retrieval, task/batch/etc types return task.
  proof:
  - oracle
- text: Non-llm span kinds require a parent ID; absent parent defaults to llm kind.
  proof:
  - oracle
  - span-kind-tests
- text: Every span-kind case from the oracle matches LiteLLM's mapping for the call type and parent presence.
  proof:
  - oracle
