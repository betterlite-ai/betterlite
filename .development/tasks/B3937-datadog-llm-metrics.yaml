deviations:
  - what: betterlite represents total_cost as Decimal in its Rust LLMMetrics record type, while LiteLLM uses float.
    why: Decimal provides higher precision for currency calculations than float, preventing rounding errors in cost aggregation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L745
  - what: Cache residual input tokens clamp at zero instead of going negative.
    why: Prevent confusing negative token counts when cache hits exceed total prompt tokens.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L764
  - what: An error status without structured error_information creates no DDLLMObsError object.
    why: Avoid inventing error details where none exist; a status alone carries no object.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L710
out_of_scope:
- Datadog LLM Obs span assembly and delivery (B3938).
- Message redaction and privacy masking (B3936).
- Message and tool-call projection (B3935).
- Prompt latency calculation beyond time_to_first_token (B3936).
pitfalls:
- Tool output tokens are counted only from tool_results in the messages; do not create a token count without
  messages present.
- Cache residual must clamp at zero, never negative. This applies whether both cache types present or just one.
- Reasoning output tokens are only set when present in the usage details; zero is omitted, not emitted as 0.0.
- Non-LLM span kinds (tool, task, embedding, retrieval) require a parent_span_id; absent parent means llm kind.
- An error_information field must be a structured object; use the fallback error_str only when structured info absent.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
