      why: the required tests fail or the filter selects no tests
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^datadog_llm_metrics::token_counting::/) - test(/replays_the_/)'
    - id: span-kind-tests
      why: the span kind mapping tests fail or the filter selects no tests
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^datadog_llm_metrics::span_kind_tests::/) - test(/replays_the_/)'
    - id: metrics-and-error-tests
      why: the metrics assembly and error info tests fail or the filter selects no tests
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail
        -E 'test(/^datadog_llm_metrics::/) - test(/replays_the_/)'
    - id: oracle-metrics
      why: oracle cases are missing or oracle tests fail
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/cases/helpers/datadog-llm-metrics/**")"
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^datadog_llm_metrics::/)'
