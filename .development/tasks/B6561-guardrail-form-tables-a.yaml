    why: A multiselect with options from json_schema_extra.
dod:
  - text: Every provider in the list above that returns a settings model from get_config_model has an entry with its registry key, and the entry projects to the same JSON as LiteLLM's class, ui_friendly_name included.
    proof: [tables-a-tests, oracle, helper-python]
  - text: Nested models, inherited fields, ui_type overrides and json_schema_extra options of the group are in the tables.
    proof: [tables-a-tests, oracle]
  - text: The new helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: tables-a-tests
      why: a table is missing, has a wrong key or does not project to the expected JSON
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::form_tables_a::tests::/)'
    - id: helper-python
      why: the oracle adapter is missing or fails strict lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b6561)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no new helper case was added or the shared parser fails on one
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/guardrail-form-tables-a-*)" &&
        grep -lE '^[[:space:]]+b6561:' tools/oracle/fuzz/corpus/helper_case/guardrail-form-tables-a-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
