deviations:
  - what: Provider settings are written as data tables and no longer read off the classes.
    why: Rust has no annotation reflection, and the oracle cases compare each table to the real class.
out_of_scope:
  - "The types and the projection function: B6560."
  - "The second group of providers (agent_365 to model_armor) and tool_permission: B6562 and B6560."
  - "The settings structs the guardrails use at run time: the provider tasks own them. A table here lists form fields only."
  - "Providers whose class returns no model from get_config_model: LiteLLM leaves them out of the response, so they are not in a table."
pitfalls:
  - "The registry key is not always the folder name: read `guardrail_class_registry` in the folder's `__init__.py` (noma and noma_v2 share one folder, and azure registers two keys)."
  - "A model declared as GuardrailConfigModel[BaseModel] (decision_model and headroom) gives `optional_params` as a plain string field, while an unparametrized parent hides it. The oracle shows which."
  - "A `ui_type` of `GuardrailParamUITypes.BOOL` is an Enum member and goes out as its value, the string 'bool'."
  - "Descriptions are long and sometimes built from implicitly joined string literals, so copy the final joined text, including spaces at the joins."
  - "A field with `default_factory` has no plain default, so check what `field.default` is for it before you decide whether `default_value` is present."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
