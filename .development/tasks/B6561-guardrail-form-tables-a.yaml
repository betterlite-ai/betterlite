id: B6561
title: Guardrail provider form tables, first group
description: >-
  Write the form field tables for the first 25 providers whose guardrail class returns a settings model from `get_config_model`, in crates/betterlite-server/src/guardrails/form_tables_a.rs and form_tables_a/. The route /guardrails/ui/provider_specific_params walks `guardrail_class_registry`, and for each class that returns a model it projects the model's fields and adds `ui_friendly_name`. B6560 owns the `FormModel` and `FormField` types and `project_model`; this task only fills in data with them. Read B6560's `provider_forms/spec.rs` for the exact type shapes before you write a line.

  Expose `pub fn tables_a() -> Vec<(&'static str, FormModel)>`. The first item of each pair is the registry key, the name the provider is registered under in its hook folder's `__init__.py` (`guardrail_class_registry = {...}`); the second is the model with its `ui_friendly_name`. Group the data in files of at most 250 lines, for example `form_tables_a/security.rs`, `form_tables_a/cloud.rs`, `form_tables_a/content.rs` and `form_tables_a/mod_list.rs` for the function that joins them; the names are yours but each file's tests live in `form_tables_a/tests.rs`.

  The providers, by hook folder under litellm/proxy/guardrails/guardrail_hooks/ and the class that holds the fields (types live in litellm/types/proxy/guardrails/guardrail_hooks/<name>.py unless noted): decision_model (DecisionModelGuardrailConfigModel, in the hook file), crowdstrike_aidr, panw_prisma_airs, noma (NomaGuardrailConfigModel, from types/guardrails.py or noma.py, whichever class `get_config_model` returns), noma_v2 (NomaV2GuardrailConfigModel), conduct, typesafe, dynamoai, headroom, promptguard, qualifire, microsoft_purview (purview_dlp.py), block_code_execution, qohash, hiddenlayer, javelin, mcp_end_user_permission, openai (moderations.py), xecguard, azure (prompt_shield.py and text_moderation.py, two keys), alice, litellm_content_filter, zscaler_ai_guard and guardrails_ai. For each, open the hook class, read what `get_config_model` returns and write that model's fields. Some models inherit fields from a parent class (openai_moderation.py has a base and a child, and enkryptai is in B6562); include the inherited fields. `optional_params` is a field of every model that inherits GuardrailConfigModel, and many give it a nested model of its own: write the nested model out.

  Oracle: the helper operation for this task takes `provider`, one of the registry keys above. The Python side finds the class in `guardrail_class_registry`, reads `get_config_model()`, runs `_get_fields_from_model` and adds `ui_friendly_name`, as the route does. The Rust side answers `project_model` of its table plus the same name entry. A provider whose `get_config_model` returns nothing is not in the table and the case for it is not written.
