id: B1058
title: Vector store provider contracts and embedding executors
description: >-
  Implement BaseVectorStoreConfig and VectorStoreEmbeddingExecutor contracts below core, using B1131
  wire records. Core owns the concrete LiteLLMVectorStoreEmbeddingExecutor and RouterVectorStoreEmbeddingExecutor,
  vector_store_request_metadata, and the two VectorStoreRequestUtils filters. Own complete functions through
  transformation.py:253; BaseQueryEmbeddingVectorStoreConfig and BaseDirectVectorStoreConfig are B1059.
  Provider implementations fill the abstract transformations; never create a provider-to-core dependency.

  Direct executors call B006 embeddings with model and input=[query]. Router executors take an injected
  resolved-model/catalog view and embedding execution handle supplied by their router caller. This seam
  provides resolved_litellm_models(model,team_id), get_model_list and embedding/aembedding; this task
  implements the selection logic but does not import the later router consumer. Both selected execution
  paths must actually reach the mock in SDK HTTP tests. Use B2401 VectorStoreEmbeddingExecutor calls
  for those tests and B171 VectorStoreContracts helpers for the pure defaults/filtering/metadata operations.

  Tests in api::vector_store_contracts cover the cases below in core and provider. There is no new byte
  parser: B1131 owns wire JSON and the oracle drivers own their inputs. The implemented ranges contain 216
  nonblank/non-comment lines, including signatures and docstrings. Budget 240 implementation, 185 tests,
  140 adapters, 120 fixtures and 60 wiring/corpus lines, 745 total within 780.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/vector_store_contracts.rs
  - crates/betterlite-core/src/api/vector_store_contracts/**
  - crates/betterlite-provider/src/api.rs
  - crates/betterlite-provider/src/api/vector_store_contracts.rs
  - crates/betterlite-provider/src/api/vector_store_contracts/**
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/vector_store_contracts.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/vector_store_contracts.py
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/vector_store_embedding_executor.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/vector_store_embedding_executor.py
  - tools/oracle/cases/helpers/vector-store-contracts/**
  - tools/oracle/cases/sdk-http/vector-store-embedding-executor/**
  - tools/oracle/fuzz/corpus/helper_case/vector_store_contracts-*
  - tools/oracle/fuzz/corpus/sdk_http_case/vector-store-embedding-executor-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/vector_store/transformation.py#L37-L253
  why: Executor routing, metadata precedence and concrete defaults on the abstract vector-store provider contract.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/utils.py#L10-L54
  why: Search filtering still gives the mapper the original unfiltered params and hardcodes drop_params=false.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/vector_store_integrations/base_vector_store.py#L1-L5
  why: Empty BaseVectorStore subclass has no caller at the pin and contributes no behavior to implement.
dod:
- text: >-
    optional_parameter_filters sends name="",file_ids=[],expires_after=null,chunking_strategy={type:auto},
    metadata={},unknown=1. Create output is {name:"",file_ids:[],chunking_strategy:{type:auto},metadata:{}}.
    Search input filters={},max_num_results=0,ranking_options=null,rewrite_query=false,unknown=1 produces
    {filters:{},max_num_results:0,rewrite_query:false}; its provider mapper receives that output, the entire
    original input including unknown and nulls as non_default_params, and drop_params=false. Mapper-added
    fields survive. Missing fields do not appear and neither filter validates integer ranges.
  proof: [contract-tests, oracle, adapters]
- text: >-
    request_metadata_precedence sends litellm_metadata={team:a},metadata={team:b} and expects {team:a}.
    Empty litellm_metadata={} wins too. A non-dictionary litellm_metadata falls back to dictionary metadata;
    absent/non-dictionary values in both slots produce an empty read-only map. A dictionary with key=1
    fails string-key validation rather than silently converting it. The source dictionaries are not mutated.
  proof: [contract-tests, oracle, adapters]
- text: >-
    base_contract_defaults checks validate_create_vector_store succeeds, supported params=[], map_openai_params
    returns its supplied optional map, sign_request returns the original headers and null signed body,
    calculate_vector_store_cost returns (0,0), and base validate_environment returns {}. get_complete_url
    passes "" and "https://example.test/path" unchanged but null raises ValueError("api_base is required").
    get_error_class("denied",403,{X-Test:x}) raises BaseLLMException with that status,message and header.
    Async search transformation forwards id,query,optional params,base,logging,litellm_params and extra_body
    to the sync transformation once, returning its exact (url,body) pair.
  proof: [contract-tests, oracle, adapters]
- text: >-
    embedding_executor_http sends model=openai/text-embedding-3-small,query=hello,configuration={dimensions:2}
    in sync/async modes. Expect POST /v1/embeddings with model=text-embedding-3-small,input=[hello],dimensions=2;
    mock data=[{object:embedding,index:0,embedding:[0.25,0.5]}],object=list,model=text-embedding-3-small,
    usage={prompt_tokens:1,total_tokens:1} is returned. Direct configuration retains model/input keys and
    supplying them causes duplicate-argument TypeError before HTTP, not an override of the explicit arguments.
  proof: [contract-tests, oracle, adapters]
- text: >-
    router_embedding_metadata uses configuration={model:ignored,input:ignored,metadata:{keep:yes,team:old},dimensions:2}
    and request metadata={team:new,user_api_key_team_id:t}. Execution receives no configured model/input,
    metadata={keep:yes,team:new,user_api_key_team_id:t},dimensions=2 and explicit model/query. A non-map
    configured metadata becomes {}. Non-string user_api_key_team_id causes resolution with team_id=null.
    A nonempty resolved-model result or matching deployment litellm_params.model selects the router;
    empty/absent catalog plus no resolution selects direct execution. Each choice issues one embedding
    HTTP request and returns the mock vector, and metadata remains in logging rather than provider JSON.
  proof: [contract-tests, oracle, adapters]
- text: Both new helper and SDK operation tags have committed parser seeds and replay successfully.
  proof: [case-corpora]
checks:
  optional: []
  commands:
  - id: contract-tests
    why: provider defaults or the embedding executor's routing and metadata policy are absent
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::vector_store_contracts::/) - test(/::replays_corpus$/)'
  - id: adapters
    why: pure contract comparisons or actual embedding HTTP calls lack independent Python execution
    run: test -f tools/oracle/helpers/vector_store_contracts.py && test -f tools/oracle/sdk_http/vector_store_embedding_executor.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: case-corpora
    why: either new oracle variant has no decoder corpus input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_store_contracts-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-store-embedding-executor-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus) | test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/helpers/vector-store-contracts/optional-parameter-filters.yaml
- tools/oracle/cases/helpers/vector-store-contracts/request-metadata-precedence.yaml
- tools/oracle/cases/helpers/vector-store-contracts/base-contract-defaults.yaml
- tools/oracle/cases/sdk-http/vector-store-embedding-executor/embedding-executor-http.yaml
- tools/oracle/cases/sdk-http/vector-store-embedding-executor/router-embedding-metadata.yaml
deviations: []
out_of_scope:
- B1059 owns BaseQueryEmbeddingVectorStoreConfig and BaseDirectVectorStoreConfig, transformation.py:256-432.
- B1131 owns all vector_stores.py and bedrock_knowledgebase.py records and their numeric decoding policy; this task does not own scores.
- BaseVectorStore in integrations/vector_store_integrations/base_vector_store.py has no caller at the pin; its empty inheritance wrapper is not built.
- Router resolution/catalog/execution implementations remain behind the injected caller seam; B006 supplies direct embedding HTTP execution.
pitfalls:
- An empty litellm_metadata dictionary suppresses a populated metadata dictionary.
- Search mapping sees the unfiltered params as well as the filtered optional map and always receives drop_params=false.
- Router embedding removes configured model/input while the direct embedding executor passes them through and can raise duplicate-argument errors.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
