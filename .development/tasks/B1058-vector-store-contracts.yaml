id: B1058
title: Vector store contracts
description: >-
  Define vector store create/search/retrieve/list/update/delete and typed search-result/filter/usage records, reusing
  exact Decimal scores and metadata. Model embedding executor choice as an injected closed enum, and expose base
  provider preparation/signing contracts rather than copying Python inheritance.


  BaseVectorStoreConfig.atransform_search_vector_store_request accepts an injected VectorStoreEmbeddingExecutor
  and prepared query; B1059 implements embedding execution. Do not import B1059 from the base provider contract.


  Implement crates/betterlite-core/src/api/vector_store_contracts.rs, crates/betterlite-openai/src/api/vector_store_contracts.rs,
  crates/betterlite-provider/src/api/vector_store_contracts.rs. Use VectorStoreContractsInput and VectorStoreContractsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions create_optional_fields, provider_endpoint_contract under api::vector_store_contracts::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorStoreContracts in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_store_contracts: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/vector_store/transformation.py: VectorStoreEmbeddingExecutor.embed (L39-L39);
  litellm/llms/base_llm/vector_store/transformation.py: VectorStoreEmbeddingExecutor.aembed (L41-L41); litellm/llms/base_llm/vector_store/transformation.py:
  LiteLLMVectorStoreEmbeddingExecutor.embed (L46-L53); litellm/llms/base_llm/vector_store/transformation.py: LiteLLMVectorStoreEmbeddingExecutor.aembed
  (L55-L62); litellm/llms/base_llm/vector_store/transformation.py: vector_store_request_metadata (L68-L75); litellm/llms/base_llm/vector_store/transformation.py:
  RouterVectorStoreEmbeddingExecutor._embedding_kwargs (L83-L92); litellm/llms/base_llm/vector_store/transformation.py:
  RouterVectorStoreEmbeddingExecutor._router_serves (L94-L100); litellm/llms/base_llm/vector_store/transformation.py:
  RouterVectorStoreEmbeddingExecutor.embed (L102-L110); litellm/llms/base_llm/vector_store/transformation.py: RouterVectorStoreEmbeddingExecutor.aembed
  (L112-L120); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.validate_create_vector_store
  (L124-L125); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.get_supported_openai_params
  (L127-L128); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.map_openai_params (L130-L136);
  litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.get_auth_credentials (L139-L140);
  litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.get_vector_store_endpoints_by_type
  (L143-L144); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.transform_search_vector_store_request
  (L147-L157); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.atransform_search_vector_store_request
  (L159-L183); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.transform_search_vector_store_response
  (L186-L189); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.transform_create_vector_store_request
  (L192-L197); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.transform_create_vector_store_response
  (L200-L201); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.validate_environment
  (L204-L205); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.get_complete_url (L208-L222);
  litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.get_error_class (L224-L231); litellm/llms/base_llm/vector_store/transformation.py:
  BaseVectorStoreConfig.sign_request (L233-L247); litellm/llms/base_llm/vector_store/transformation.py: BaseVectorStoreConfig.calculate_vector_store_cost
  (L249-L253); litellm/vector_stores/utils.py: VectorStoreRequestUtils.get_requested_vector_store_search_optional_param
  (L14-L36); litellm/vector_stores/utils.py: VectorStoreRequestUtils.get_requested_vector_store_create_optional_param
  (L39-L54). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 223 owned nonblank/non-comment/non-docstring Python lines (253 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 243 implementation,
  52 behavior tests, 24 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  46 wiring; 455 total within the 460-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B204 (Typed model price fields and exact decimal parsing), B1087 (Api boundaries),
  B1131 (Vector store wire records). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.
