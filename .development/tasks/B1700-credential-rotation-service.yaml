id: B1700
title: Rotate stored secrets without coupling migration to the HTTP routes
description: >-
  Extract the shared rotation service into betterlite-server::credentials::rotation. Own
  _rotate_master_key and the record-preparation portion of _add_model_to_db, exposed as
  prepare_encrypted_model in betterlite-db::model_secrets so model creation can reuse it.
  The latter encrypts every non-null litellm_params value with B1600, serializes parameters
  and model_info separately, and chooses user_id or default_user_id for both audit fields;
  its caller decides whether to insert. B836 retains creation and capacity-slot handling.
  Accept the current configured cipher and an explicit new key; current_master_key is not
  used for decryption at the pin. Do not switch the running cipher during this operation.
  Model and config scan failures independently skip those stages. For models use B124's
  decrypted/validated deployment projection, prepare all records before entering a two-minute
  transaction, update only litellm_params by model_id, commit, then publish the model-table
  invalidation through B734. Preparation, transaction and publication failures propagate;
  a publication failure cannot roll back the already committed rows.
  Find environment_variables in the config scan, decrypt through B124's read path and apply
  successful values to B1646's runtime snapshot before storing the new encrypted mapping.
  Preserve the read path's refusal to load LITELLM_ENABLE_MCP_STDIO and its
  per-value warning/skip behavior. No decrypted values means no config write. Runtime
  state therefore can change even if the following database update fails.
  Invoke B139's MCP server/OAuth-client, per-user credentials and per-user environment
  rotations, then B137's SSO assertion rotation, with a separate warning-and-continue
  boundary around each. Their partial commits remain visible. Finally scan credentials;
  a failed scan skips that stage, while each credential decrypt/update failure skips only
  that row. Use B1601's update projection, preserve JSON values/info fields, and write the
  principal's actual user_id, including null, as updated_by for credentials. Report counts
  only as diagnostic scan counts, never as proof that every row was rotated.
  Exercise the service against B860 Postgres and a recording invalidation sink, including
  failed scans, pre-transaction model validation, rollback, publication failure, config
  write failure after runtime publication, each MCP-stage failure, and one bad credential
  between two valid ones. This task exposes services and registers no route. The rotation
  function has 135 nonblank source lines and model preparation adds 24; reserve 230 for
  implementation/interfaces and 390 for integration tests and wiring, within 700 lines.
scope:
  paths:
    - crates/betterlite-server/src/credentials.rs
    - crates/betterlite-server/src/credentials/rotation.rs
    - crates/betterlite-server/src/credentials/rotation/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/src/model_secrets.rs
    - crates/betterlite-db/src/model_secrets/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L5211-L5365
    why: Shared rotation sequence and deliberately different failure boundaries.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_management_endpoints.py#L1495-L1525
    why: Own record encryption/preparation; insertion and slot acquisition remain B836.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7575-L7612
    why: Called environment read/write helpers and their runtime side effect, retained by B124.
dod:
  - text: Model rotation commits its own transaction before invalidation and preserves every later stage's independent failure boundary.
    proof: [rotation-tests]
  - text: Prepared model records and credential updates retain their distinct audit-field and serialization rules without changing the running cipher.
    proof: [rotation-tests, model-secret-tests]
checks:
  optional: []
  commands:
    - id: rotation-tests
      why: Fault-injected rotation skips, aborts or commits at the wrong boundary.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^credentials::rotation::/)'
    - id: model-secret-tests
      why: Record preparation loses parameters or uses the wrong key, JSON representation or actor.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^model_secrets::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B785 retains rotation and migration HTTP handlers, authorization and request decoding; its shared _rotate_master_key ownership must move here before execution.
  - B836 retains _add_model_to_db insertion/slot orchestration and all other model-management functions; B124 retains ProxyConfig decryption and environment helpers.
  - B139 owns MCP row formats and all rotate_mcp_* implementations; B137 owns rotate_sso_identity_assertions_master_key and assertion codecs.
  - Other key-management functions remain B770 through B785 and their existing helper leaves.
pitfalls:
  - The explicit current_master_key argument does not override the configured decryption key.
  - A successful model commit followed by failed publication stops rotation with the new ciphertext already stored.
  - Credential updated_by accepts null even though model preparation substitutes default_user_id.
budget:
  max_changed_lines: 700
  max_new_expects: 0
review_level: security
