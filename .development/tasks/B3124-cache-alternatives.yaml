    why: select_cached_model, the order of warm check, authorization, limits, prediction and strict cost comparison.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/cache_aware_routing.py#L229-L343
