    why: The documented supported surface and the cases that keep the classified route.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/unit/proxy/common_utils/test_cache_aware_routing.py
    why: LiteLLM's own tests, the model for the native tests.

dod:
  - text: eligible_models returns the deduplicated tiers at or above the decision tier and returns empty for every refused configuration (unknown tier, unlisted cause, custom tiers, plugins, adaptive, session_affinity, other classification_mode, litellm_params on a tier entry, pool tier values).
    proof: [eligibility-tests, oracle]
  - text: supported_router_marker accepts only auto_router/complexity_router markers with the listed options and rejects an alias with no deployment.
    proof: [eligibility-tests]
  - text: candidate and available skip multi-deployment, blocked, id-less and unsupported deployments, and treat an authorization or health error as unavailable.
    proof: [candidate-tests]
  - text: select_cached_model makes no authorization or provider count call when no alternative is warm, and requires the original to be available.
    proof: [selection-tests]
  - text: select_cached_model picks only a strictly cheaper alternative with cache_state warm or partial, unexpired evidence and a fit within the model limits, and breaks a cost tie in favour of the classified model.
    proof: [selection-tests]
  - text: Output tokens are capped per candidate at min(cache_aware_routing_output_tokens, limit) and a non-positive limit returns None.
    proof: [selection-tests]
  - text: choose_cached_model returns None for each gate (foreign router, plugins, request transforms, pending compaction, bad marker, missing caller, per-key config, bad proxy request, refused request field, wrong limiter).
    proof: [entry-tests]
  - text: choose_cached_model returns None when the deadline expires or any step errors, and logs the debug line once.
    proof: [entry-tests]
  - text: The helper cases for eligible_models match LiteLLM through the oracle.
    proof: [oracle, helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: eligibility-tests
      why: eligible_models or supported_router_marker tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routing::cache_alternatives::tests::eligibility::/)'
    - id: candidate-tests
      why: candidate or availability tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routing::cache_alternatives::tests::candidates::/)'
    - id: selection-tests
      why: warm filtering, authorization order, limits or the cost comparison tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routing::cache_alternatives::tests::selection::/)'
    - id: entry-tests
      why: the proxy-state gates, the deadline or the error-to-None tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routing::cache_alternatives::tests::entry::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3124)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3124 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3124/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/cache_alternatives-*")" &&
        grep -lE '^[[:space:]]+b3124:' tools/oracle/fuzz/corpus/helper_case/cache_alternatives-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/cache-alternatives/eligible-tier-ladder.yaml
  - tools/oracle/cases/helpers/cache-alternatives/eligible-refused-configs.yaml

deviations:
  - what: Errors inside the optional steps are typed `CacheAlternativesError` values that `choose_cached_model` turns into None, instead of one broad `except Exception`.
    why: The rules forbid broad catches. A client sees the same thing as in LiteLLM, the classified model, and the debug log line is kept.
  - what: A max_tokens output limit that is not a positive integer cannot arrive as a bool or a string, since params are typed.
    why: Python's duck typing beyond declared types follows docs/compatibility.md; only zero and negative limits are cases.
  - what: The deadline drops the in-flight prediction futures when it expires.
    why: Python's wait_for cancels the task the same way; Rust cancellation by drop ends provider count requests that are still open.

out_of_scope:
  - "AnthropicCacheRouting and its helpers (from_body, request_body, supports, is_warm, predict, cost, fits, count_tokens), pricing and has_request_transforms: B3123."
  - "Cache observations and the observation store: B3122. Prompt parsing and target resolution: B3120 and B3121."
  - "ComplexityRouter._apply_prompt_cache_routing, the decision stamp and the cache_aware_routing config section: B337."
  - "can_key_call_resolved_model: B886. request_capacity: B3055. compaction_pending: B336. ComplexityRouterConfig: B374."
  - "Router.deployments_for_request, get_model_list and async_get_healthy_deployments: B302 and B844."
  - "The /cost/predict-cache and prompt-caching-requests routes: B3125."

pitfalls:
  - "Equal cost keeps the classified model; the comparison is strictly less than."
  - "The deadline covers `_choose_cached_model` as a whole, including the limiter-gated token counts, so a slow count returns None rather than a late choice."
  - "The expiry check reads the clock again after predictions finish; a fresh evidence entry that expired during the counts is dropped. With `now` given, both reads use it."
  - "Alternatives are authorized and health-checked only when warm, and the original is checked in the same batch; a failed original check returns None even with a good alternative."
  - "Candidates need exactly one deployment per tier model group; two deployments for one model make that model absent, and an absent original returns None."
  - "The metadata key is `metadata` or `litellm_metadata` depending on the endpoint, so read it through the shared name helper, not a fixed key."
  - "A caller whose key has a non-empty `config` is refused, since per-key config can reroute the call after the comparison."
  - "Only the v3 parallel request limiter is accepted; its `request_capacity` is taken for each count, and a denied count means no estimate, not an error."
  - "The request refusal list tests truthiness (an empty guardrails list passes), and it includes `model_info` and `custom_llm_provider`."
  - "A model repeated across tiers competes once under its first tier name, but the tier floor still comes from the decision tier."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
