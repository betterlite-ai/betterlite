id: B4729
title: MCP connection preview staging and test routes
description: >-
  Build the two preview routes an admin uses before saving an MCP server, and the staging step in front of them. Both are POST routes under the router prefix /mcp-rest (LiteLLM mounts this router with that prefix only, so there is no /v1/... or /openai/v1/... alias): POST /mcp-rest/test/connection checks that a not-yet-saved server config can be reached, and POST /mcp-rest/test/tools/list lists its tools. The body of both is a NewMCPServerRequest, the same model the create route takes. Both need a valid key and then the PROXY_ADMIN role. PROXY_ADMIN_VIEW_ONLY and every other role get 403.


  Code goes in betterlite-server, two modules. mcp::preview_staging (crates/betterlite-server/src/mcp/preview_staging.rs, preview_staging/** and a tests.rs beside each file) holds the pure steps. api::mcp_preview_routes (crates/betterlite-server/src/api/mcp_preview_routes.rs, mcp_preview_routes/** and a tests.rs beside each file) holds the two handlers and exposes `pub fn router(state) -> axum::Router`. It never mounts itself, so the B139 umbrella adds it to the app. Add betterlite-mcp and the url crate to crates/betterlite-server/Cargo.toml if the file does not list them yet (B4727 and B4728 may have added betterlite-mcp already, so read the file first). Types and functions of other tasks are used by the names they have on main when this task runs, so read the merged files: NewMCPServerRequest, StdioPolicy and RequestError from B4716 (server_payload), inherit_credentials_from_existing_server from B4717 (mcp::management_visibility), ServerRegistry from B4731 (registry), MCPServer from B6590, MCPAuth from B2305, the OAuth2 header reader and the x-litellm-api-key constant from B4654 (client_headers), UPSTREAM_OAUTH_DISCOVERY_AUTH_TYPES from B6760 (server_oauth), the temporary-client runner and the list betterlite_mcp::mcp_preview::STAGED_AUTH_VALUE_AUTH_TYPES from B4730, MCPClient from B4744 and B4745, and the OpenAPI functions from B4683 (openapi_tools). Do not copy any of them. Logging goes through tracing.


  Module mcp::preview_staging. Function names are LiteLLM's without the leading underscore.

  1. preview_origin(url: Option<&str>) -> Option<(String, String, Option<u16>)>: parse with the url crate and return (scheme, host, port) when the scheme is http or https and a host exists. An absent, empty or unparseable url, another scheme (ws, ftp, file) or a missing host gives None. The port is Url::port(), so an explicit default port (https://a.example:443) is None, exactly like httpx. Hosts compare in lowercase.

  2. stage_server_test(request: NewMCPServerRequest, headers, registry) -> StagedPreview { request, mcp_auth_header: Option<String>, oauth2_headers: Option<BTreeMap<String, String>> } (LiteLLM's _stage_server_test and _StagedServerTest). Both routes call it so both hand the temporary client the same credentials. Steps in order.

  a. saved: when request.server_id is non-empty, registry.server_by_id(server_id, no client ip); otherwise None.

  b. may_inherit is true when auth_type is not one of STAGED_AUTH_VALUE_AUTH_TYPES (api_key, bearer_token, basic, authorization, token; an absent auth_type is not in the list), or when saved exists and preview_origin(saved.url) is Some and equals preview_origin(request.url). So a typed-in secret type can pull the stored secret only when the preview URL has the same scheme, host and port as the saved one. This stops an admin from sending a stored api key to a new host.

  c. request becomes inherit_credentials_from_existing_server(request) when may_inherit, else stays as it is.

  d. mcp_auth_header is credentials["auth_value"] when auth_type is in STAGED_AUTH_VALUE_AUTH_TYPES and credentials is an object; otherwise None. A missing key gives None and a non-string value follows the declared type of MCPCredentials.

  e. oauth2_headers is B4654's OAuth2 header reader applied to the request headers when auth_type is in UPSTREAM_OAUTH_DISCOVERY_AUTH_TYPES (oauth2, true_passthrough, oauth_delegate) AND the x-litellm-api-key header is present and non-empty. Without that primary header the Authorization value is the caller's own LiteLLM key (the admission fallback), so it is never forwarded upstream. Keep LiteLLM's code comment on this as one line.

  f. protocol_version: when saved exists and request.mcp_info has no "protocol_version" key (a missing mcp_info counts as empty), the staged request is a copy whose mcp_info is the old one plus protocol_version = saved.protocol_version. This happens whether or not credentials were inherited, and it stamps the value even when it is the default "auto". Without a saved server, or with the key present, the request is unchanged.

  3. list_tools_within(client, deadline_seconds: f64) -> Result<Option<Vec<Tool>>, ClientError>: call client.list_tools with raise_on_error true, give up after deadline_seconds and return None on that timeout (anyio.move_on_after). An error from list_tools is returned, not swallowed. The client call is cancelled when the deadline passes.

  4. preview_openapi_tools(spec_path: &str) -> serde_json::Value: load the document with B4683's load_openapi_spec_async(spec_path) with no max_bytes, then for each path in the order of the document and each method in the fixed order get, post, put, delete, patch (skip a method the path item lacks): resolved = resolve_operation_params(operation, path_item, components); raw id = operation.operationId or "{method}_{path}" with the method in lowercase; op_id = sanitize_openapi_tool_name(raw id); while op_id is already used, n starts at 1 for this operation, add one, suffix = "_{n}" and op_id = first (128 minus suffix length) characters of the sanitized id plus the suffix (the 128 is B4683's OPENAPI_TOOL_NAME_MAX_LEN; the cut is from the sanitized id, not from the previous candidate); record op_id as used. description = operation.description, defaulting to operation.summary (default empty); the tool's description is description, else summary, else "{METHOD} {path}" with the method in uppercase. Each tool is { "name": op_id, "description": ..., "inputSchema": build_input_schema(resolved) }. Success returns { "tools": [...], "error": null, "message": "Found N tools from OpenAPI spec" }. Any failure to load or read the document logs "Error previewing OpenAPI tools: {error}" at error level and returns { "tools": [], "error": true, "message": "Failed to load OpenAPI spec: {error}" }. The HTTP status is 200 in both cases. A missing "paths" or "components" key counts as an empty object.


  Module api::mcp_preview_routes.

  Handler order for both routes: the key check (auth layer), then the admin check, then staging, and only then the route's own work. The admin check compares the role with PROXY_ADMIN exactly and answers 403 with the body {"detail": {"error": "<text>"}}. The text of /test/connection is "User does not have permission to test MCP server connections. Only PROXY_ADMIN users can perform this action." and of /test/tools/list "User does not have permission to test MCP server tools. Only PROXY_ADMIN users can perform this action.". The body is parsed with NewMCPServerRequest::from_value using the StdioPolicy held in the route state. A RequestError answers 422 in FastAPI's shape {"detail": [{"type", "loc": ["body"], "msg", "input"}]} and the msg for a RequestError::Value is "Value error, " plus the text. The raw request headers go to stage_server_test as they are. The headers for the stdio environment (raw_headers of B4730's runner) come from B1100's safe header reader as a name to value map.

  /test/connection: after staging, call B4730's runner with the staged request, the staged mcp_auth_header and oauth2_headers, the raw headers and the default timeout. The operation opens a session with run_with_session and a no-op body, then returns { "status": "ok" }. The runner's own error value (status "error", error true, message) is returned as is. Both outcomes are HTTP 200.

  /test/tools/list: after staging, a truthy spec_path on the staged request returns preview_openapi_tools(spec_path) without creating a client (only the staging ran before it). Otherwise call the runner with an operation that lists tools. The listing deadline is max(client timeout in seconds, 30.0 seconds), where the client timeout is the client's own timeout when it is set and non-zero, else the 60.0 second default of LITELLM_MCP_CLIENT_TIMEOUT, and the 30.0 is the default of LITELLM_MCP_TOOL_LISTING_TIMEOUT. Both defaults and the env overrides are owned by B4730's constants, so read them there. max() keeps a single slow page inside the client timeout working and lets a per-server timeout above 30 seconds extend the deadline. When list_tools_within returns None, log at warning "MCP tools/list preview timed out after {deadline} seconds while paginating upstream tools" and return { "status": "error", "error": true, "message": "Timed out listing tools after {deadline} seconds. The MCP server may be responding slowly or paginating excessively." }. The deadline prints the way Python prints a float, so 30.0 and 60.0 keep their ".0" (use the Debug format of f64, not Display). On success return { "tools": [each tool serialized with its wire (alias) field names, so inputSchema and not input_schema], "error": null, "message": "Successfully retrieved tools" }. All outcomes are HTTP 200.

  Tests use fakes that record calls (a fake registry, a fake runner, a fake client), synthetic servers and names with the prefix test-. Oracle HTTP cases cover the cases a booted proxy can answer without a reachable MCP server.

