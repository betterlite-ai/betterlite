dod:
  - text: >-
      preview_origin gives (scheme, host, port) for http and https urls with a host, None for an absent, empty, unparseable or non-http url, and drops an explicit default port.
    proof: [staging-tests]
  - text: >-
      stage_server_test inherits stored credentials for a secret-carrying auth type only when the preview url has the saved server's scheme, host and port, always inherits for other auth types, and passes the request through unchanged when there is no saved server.
    proof: [staging-tests]
  - text: >-
      stage_server_test takes mcp_auth_header from credentials.auth_value only for the five secret-carrying auth types, and sets oauth2_headers only for oauth2, true_passthrough and oauth_delegate when the x-litellm-api-key header is non-empty, never from the Authorization fallback alone.
    proof: [staging-tests]
  - text: >-
      stage_server_test copies the saved server's protocol_version into mcp_info only when the key is missing, and leaves a request that already has the key alone.
    proof: [staging-tests]
  - text: >-
      list_tools_within returns the tools, returns None when the deadline passes, and returns a list_tools error instead of hiding it.
    proof: [staging-tests]
  - text: >-
      preview_openapi_tools names tools like LiteLLM (operationId or method_path, sanitized, unique suffix cut to 128 characters, description fallback chain) and returns the two result shapes with HTTP 200 for a load failure.
    proof: [staging-tests]
  - text: >-
      Both routes answer 403 with the exact detail.error text for every role except PROXY_ADMIN, before staging or any client call.
    proof: [route-tests, oracle]
  - text: >-
      /test/connection returns {"status": "ok"} on a reachable server and the runner's error value otherwise, and /test/tools/list returns the tools, the OpenAPI preview for a spec_path without building a client, and the timeout message with the deadline printed as 30.0 or 60.0.
    proof: [route-tests]
  - text: >-
      A body that fails NewMCPServerRequest validation answers 422 in FastAPI's detail list shape and an unreachable server answers 200 with the "the server is unreachable" message.
    proof: [route-tests, oracle]

checks:
  optional: []
  commands:
    - id: staging-tests
      why: preview_origin, the same-origin inheritance rule, the credential and header selection, the protocol_version stamp, the bounded listing or the OpenAPI preview is missing or wrong.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::preview_staging::/)'
    - id: route-tests
      why: the admin gate, the staging call order, the response shapes or the timeout message of the two routes is missing or wrong.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::mcp_preview_routes::/)'

oracle_cases:
  - tools/oracle/cases/http/mcp-rest-preview/connection-regular-user-403.yaml
  - tools/oracle/cases/http/mcp-rest-preview/connection-view-only-admin-403.yaml
  - tools/oracle/cases/http/mcp-rest-preview/tools-list-regular-user-403.yaml
  - tools/oracle/cases/http/mcp-rest-preview/connection-unreachable-server.yaml
  - tools/oracle/cases/http/mcp-rest-preview/connection-missing-url-422.yaml
  - tools/oracle/cases/http/mcp-rest-preview/tools-list-unreachable-server.yaml
  - tools/oracle/cases/http/mcp-rest-preview/tools-list-openapi-missing-file.yaml

deviations:
  - what: The message after the text "Failed to load OpenAPI spec" is the Display text of the B4683 error, not Python exception text.
    why: Only the missing-file text ("OpenAPI spec not found at {location}") is the same in both. HTTP failures and parse failures read differently in Python (httpx and json error strings), and a user gets the same "error true, tools empty" shape either way. The oracle case covers the missing file only.
  - what: A RequestError::Shape answers 422 with serde's text in msg, not Pydantic's text.
    why: Pydantic's error text and type names are library output with no Rust equivalent. Status, loc and the body shape stay the same, and the oracle compares the Value case only.

out_of_scope:
  - "The temporary-client runner (_execute_with_mcp_client), _extract_credentials, the connection error messages with their reference id, the STAGED_AUTH_VALUE_AUTH_TYPES list and the timeout constants: B4730 owns them and this task only calls them."
  - "_inherit_credentials_from_existing_server: B4717. NewMCPServerRequest and its validators: B4716. get_mcp_server_by_id: B4731. The OAuth2 header reader and the x-litellm-api-key name: B4654. UPSTREAM_OAUTH_DISCOVERY_AUTH_TYPES: B6760."
  - "load_openapi_spec_async, sanitize_openapi_tool_name, resolve_operation_params and build_input_schema: B4683. MCPClient list_tools and run_with_session: B4745 and B4744."
  - "The routes /mcp-rest/tools/list and /mcp-rest/tools/call and the helpers around them: B4726, B4727 and B4728."
  - "Mounting the router into the app, and the auth layer that rejects a missing or invalid key before the handler: the B139 umbrella and B742."

pitfalls:
  - The admin check is the only role gate. Routes under /mcp-rest/ skip route_checks (it passes them with "authN/authZ handled by api itself"), so a missing check would let any valid key test connections and make the proxy fetch arbitrary URLs.
  - The same-origin rule compares scheme, host and port of the saved url and the preview url. Comparing only the host, or skipping the rule when the saved url is missing, would let a typed-in url with an api_key auth type receive the stored secret.
  - The inherit step is skipped for the five secret-carrying auth types on a different origin, but it still runs for oauth2 and the other types even when the url differs, because those carry no static secret in auth_value.
  - The oauth2_headers branch needs the x-litellm-api-key header and not just Authorization. When a caller sends only Authorization (the fallback for the LiteLLM key), forwarding it would hand the caller's own LiteLLM key to the previewed server.
  - The protocol_version stamp checks for the key in mcp_info, not for a non-null value, and it runs even when no credentials were inherited. A saved server whose protocol_version is "auto" still stamps "auto".
  - Url::port() drops default ports on its own. Do not use port_or_known_default, or https://a.example and https://a.example:443 would count as different origins and https://a.example:443 against http://a.example:443 would not be told apart by port alone.
  - The timeout message prints the deadline as a Python float. Rust Display for 30.0_f64 gives "30", so use the Debug format to keep "30.0".
  - list_tools_within turns only the deadline into None. An error from list_tools must propagate to the runner, which turns it into the classified connection message. Catching it here would hide the real cause behind the timeout text.
  - The OpenAPI branch runs after staging and before any client exists, so a spec_path request never opens a connection and never needs the credentials staging computed. Do not call the runner for it.
  - The unique-name loop restarts n at 1 for each operation and cuts the sanitized id each time. Carrying n over from the previous operation, or cutting the previous candidate, gives different names from LiteLLM on a third duplicate.
  - Tools are serialized with their wire field names (model_dump by_alias). A tool serialized with Rust field names would drop inputSchema from the dashboard.
  - Every outcome of both routes except the 403 and the 422 is HTTP 200, errors included. The error value is data in the body (status "error" for the runner, error true for the openapi and listing paths), not an HTTP error.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
