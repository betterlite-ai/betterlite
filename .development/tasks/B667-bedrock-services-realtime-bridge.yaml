id: B667
title: Bedrock realtime client and provider event pumping
description: >-
  Connect typed client events and decoded provider events with bounded forwarding and explicit shutdown ownership.
  Preserve provider-native error mapping, input/output half-close and terminal events. B084 owns the public websocket
  route; this service takes an injected websocket-like endpoint and is testable with pause-controlled channels.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/handler.py:
  BedrockRealtime._forward_client_to_bedrock L459-L511; BedrockRealtime._forward_bedrock_to_client L513-L589.


  Named case contracts: client_event_forwarding: B665 _client_messages yields optionalinitial then client reads.
  Parse with B665 preface helper; exact string type session.update stores original message under litellm.bedrock_realtime.pending_session_update
  BEFORE transformation. B662 transform_realtime_request receives original message,model,current session_configuration_request.
  Send every returned string UTF-8 in one native BidirectionalInputPayloadPart/InvokeModelWithBidirectionalStreamInputChunk,
  sequentially awaiting each sink. Only after all frames are accepted call B665 _ack_session_update; False ends
  forwarding. Transform/send/readiness failures propagate, leaving pending replay marker until ack clears it. provider_event_forwarding:
  Await provider output then receive loop. Missing/falsey result.value or payload bytes are skipped. Truthy bytes
  decode strictUTF8, then B665 transform_realtime_response gets a copy of all seven current state fields. Update
  ALL seven shared state fields from returned get values before sending any resulting event. List response sends
  each in order, nonlist is wrapped as one item. SerializeJSON and await each client send; only successfully sent
  events passing B665 _should_log_event are yielded for logging. provider_error_close: Provider await_output/receive,UTF8,transform
  or serialization exceptions propagate and do not close client websocket here, permitting upper fallback policy
  before commit. Client send Exception debugs Bedrock to client forwarding ended: {error} and returns False; stop
  immediately without yielding the failed-send event or closingclient. State updates already performed are notrolledback.
  input_half_close: Always finally call B662 session_close_messages; attempt every closing frame in order, suppressing
  each send Exception separately, then attempt input_stream.close with Exception suppression. Close failure does
  not overwrite the original provider/transform error. A close-message construction failure itself is outside per-send
  suppression. Client receive failures end normally via B665; source no input queue or background frame fan-out.
  output_half_close: Only receive() returningNone is normal provider EOF: debug Bedrock Realtime: Bedrock stream
  ended,attempt client_ws.close() with its default1000 and suppressException,thenreturn. No invented response.done
  or error event is emitted on EOF. cancel_session: Cancellation enters client-pump finally and attempts ordered
  graceful input close; output pump has no explicit websocket-close finally. B666 owns cancellation of both tasks
  and joining their results. Compare the source task/cleanup sequence with controlled async fixtures rather than
  asserting a fabricated provider cancellation frame.


  Implement crates/betterlite-bedrock/src/realtime_bridge.rs with adjacent tests under realtime_bridge/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_bridge_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): client_event_forwarding, provider_event_forwarding, provider_error_close, input_half_close, output_half_close,
  cancel_session. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_bridge* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_bridge variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_bridge that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 112 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 195 production lines, 285 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.

   Keep at most one event per direction in flight and await its sink before pulling the next event, matching the
  source forwarding awaits; introduce no queue-size setting or unbounded intermediate event list.
