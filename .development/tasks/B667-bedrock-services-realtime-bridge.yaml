pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_realtime_bridge in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_realtime_bridge.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_realtime_bridge.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Session state is updated before client delivery, but a failed delivery is excluded from the logged event list.
- Provider failure keeps the client websocket open; only normal provider EOF closes it here.
