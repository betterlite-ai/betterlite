id: B667
title: Bedrock realtime client and provider event pumping
description: >-
  Connect typed client events and decoded provider events with bounded forwarding and explicit shutdown ownership.
  Preserve provider-native error mapping, input/output half-close and terminal events. B084 owns the public websocket
  route; this service takes an injected websocket-like endpoint and is testable with pause-controlled channels.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/handler.py:
  BedrockRealtime._forward_client_to_bedrock L459-L511; BedrockRealtime._forward_bedrock_to_client L513-L589.


  Implement crates/betterlite-bedrock/src/realtime_bridge.rs with adjacent tests under realtime_bridge/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_realtime_bridge in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_bridge_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): client_event_forwarding, provider_event_forwarding, provider_error_close, input_half_close, output_half_close,
  cancel_session. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_bridge* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_bridge variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_bridge that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 112 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 145 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 348 planned, 400 maximum changed lines.

   Keep at most one event per direction in flight and await its sink before pulling the next event, matching the
  source forwarding awaits; introduce no queue-size setting or unbounded intermediate event list.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/realtime_bridge.rs
  - crates/betterlite-bedrock/src/realtime_bridge/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_services_realtime_bridge.rs
  - tools/oracle/src/helpers/bedrock_services_realtime_bridge/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_services_realtime_bridge.py
  - tools/oracle/cases/helpers/providers/bedrock-services-realtime-bridge/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_bridge*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/realtime/handler.py#L459-L589
  why: Own BedrockRealtime._forward_client_to_bedrock, BedrockRealtime._forward_bedrock_to_client. Other functions
    in this file remain with the owners listed below.
dod:
- text: >-
    client event forwarding: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-realtime-bridge/client-event-forwarding.yaml.
  proof:
  - case-client-event-forwarding
  - oracle
  - helper-python
- text: >-
    provider event forwarding: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-realtime-bridge/provider-event-forwarding.yaml.
  proof:
  - case-provider-event-forwarding
  - oracle
  - helper-python
- text: >-
    provider error close: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-realtime-bridge/provider-error-close.yaml.
  proof:
  - case-provider-error-close
  - oracle
  - helper-python
- text: >-
    input half close: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-realtime-bridge/input-half-close.yaml.
  proof:
  - case-input-half-close
  - oracle
  - helper-python
- text: >-
    output half close: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-realtime-bridge/output-half-close.yaml.
  proof:
  - case-output-half-close
  - oracle
  - helper-python
- text: 'cancel session: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-realtime-bridge/cancel-session.yaml.'
  proof:
  - case-cancel-session
  - oracle
  - helper-python
- text: New bedrock_services_realtime_bridge seeds parse as the intended call variant and replay through the shared
    production parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-client-event-forwarding
    why: The client-event-forwarding behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_bridge_cases::case_[0-9]+_client_event_forwarding$/)'
  - id: case-provider-event-forwarding
    why: The provider-event-forwarding behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_bridge_cases::case_[0-9]+_provider_event_forwarding$/)'
  - id: case-provider-error-close
    why: The provider-error-close behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_bridge_cases::case_[0-9]+_provider_error_close$/)'
  - id: case-input-half-close
    why: The input-half-close behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_bridge_cases::case_[0-9]+_input_half_close$/)'
  - id: case-output-half-close
    why: The output-half-close behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_bridge_cases::case_[0-9]+_output_half_close$/)'
  - id: case-cancel-session
    why: The cancel-session behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_bridge_cases::case_[0-9]+_cancel_session$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_realtime_bridge.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_bridge*")"
      && grep -lq 'bedrock_services_realtime_bridge' tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_bridge*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_realtime_bridge$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
