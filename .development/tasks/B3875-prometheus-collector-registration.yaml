id: B3875
title: Prometheus exporter collector registration
description: >-
  Port the constructor of PrometheusLogger, litellm/integrations/prometheus.py lines 267-879, to a new module
  crates/betterlite-logging/src/prometheus_exporter.rs. The constructor creates every collector the exporter ever emits to and registers it.
  After this task the exporter exists with all 81 collectors in place and nothing writes to them yet. B3876, B3877, B3878, B3879, B3881, B3882 and the other emitters
  only read fields from the struct this task builds, so the field names must be exactly LiteLLM's attribute names.

  Public surface. `PrometheusCollectors` is a struct with one public field per collector, named like the LiteLLM attribute (for example
  `litellm_proxy_failed_requests_metric`, `litellm_spend_metric`, `litellm_tokens_metric`). It also holds `label_filters`, `exclude_metrics`, `exclude_labels`,
  the label cache, `latency_buckets` and the `emit_input_sequence_length_label` flag, plus the bounded series tracker. `PrometheusCollectors::register(settings, label_settings, registry)`
  returns `Result<PrometheusCollectors, PrometheusExporterError>`. `PrometheusExporterError` is this module's own thiserror enum and wraps the errors of the steps below.
  `settings` is `PrometheusExporterSettings` (defined here): the raw prometheus_metrics_config list, prometheus_exclude_metrics, prometheus_exclude_labels,
  prometheus_latency_buckets and prometheus_emit_input_sequence_length_label, all read from config.sections.prometheus_exporter (see the config section below).
  `label_settings` is B3872's `PrometheusLabelSettings`.

  Order of work inside register, as LiteLLM does it:
  1. Validate the caller-identity mode (B3870 `validate_prometheus_deployment_and_latency_caller_identity`) before anything registers, so an invalid value never leaves a half-registered set behind.
  2. Parse prometheus_metrics_config into label_filters, then parse prometheus_exclude_metrics and prometheus_exclude_labels into exclude_metrics and exclude_labels. Both come from B3874 (`_parse_prometheus_config`, `_parse_exclude_config`).
  3. Start with an empty label cache (B3874 `get_labels_for_metric` fills it) and set emit_input_sequence_length_label to true only when the setting is exactly true.
  4. latency_buckets is prometheus_latency_buckets when it is set (any list, including an empty one), else B3870's LATENCY_BUCKETS.
  5. Create the bounded series tracker with B3876's default constructor.
  6. Build the counter, gauge and histogram factories with B3874's `_create_metric_factory` equivalent, then create the 81 collectors in the order of the table below.

  Collector table (name given to Prometheus; the struct field is LiteLLM's attribute name). "schema" means labelnames come from B3874 `get_labels_for_metric(<name>)`.
  Counters with schema labels, in order: litellm_proxy_failed_requests_metric, litellm_proxy_total_requests_metric.
  Histograms with schema labels and the latency buckets: litellm_request_total_latency_metric, litellm_llm_api_latency_metric, litellm_llm_api_time_to_first_token_metric.
  Counters with schema labels: litellm_spend_metric; litellm_total_tokens_metric (field litellm_tokens_metric); litellm_input_tokens_metric; litellm_output_tokens_metric;
  litellm_input_cached_tokens_metric; litellm_input_cache_creation_tokens_metric; litellm_input_audio_tokens_metric; litellm_output_reasoning_tokens_metric;
  litellm_output_audio_tokens_metric; litellm_video_duration_seconds_metric; litellm_images_generated_metric.
  Gauges with schema labels: the team, org, api key, user and customer budget gauges (remaining, max and budget_remaining_hours for each, plus litellm_team_members_metric),
  that is litellm_remaining_team_budget_metric, litellm_team_max_budget_metric, litellm_team_budget_remaining_hours_metric, litellm_team_members_metric,
  litellm_remaining_org_budget_metric, litellm_org_max_budget_metric, litellm_org_budget_remaining_hours_metric,
  litellm_remaining_api_key_budget_metric, litellm_api_key_max_budget_metric, litellm_api_key_budget_remaining_hours_metric,
  litellm_remaining_user_budget_metric, litellm_user_max_budget_metric, litellm_user_budget_remaining_hours_metric,
  litellm_remaining_customer_budget_metric, litellm_customer_max_budget_metric, litellm_customer_budget_remaining_hours_metric.
  Gauges with schema labels: litellm_remaining_api_key_requests_for_model, litellm_remaining_api_key_tokens_for_model, litellm_api_key_rate_limit_allowed_metric,
  litellm_api_key_rate_limit_used_metric, litellm_team_rate_limit_allowed_metric, litellm_team_rate_limit_used_metric, litellm_remaining_requests_metric, litellm_remaining_tokens_metric.
  Histograms with schema labels and the latency buckets: litellm_overhead_latency_metric, litellm_overhead_with_guardrails_latency_metric,
  litellm_request_queue_time_seconds (field litellm_request_queue_time_metric).
  Histogram with fixed labels and the latency buckets: litellm_guardrail_latency_seconds with [guardrail_name, status, error_type, hook_type].
  Counters with fixed labels: litellm_guardrail_errors_total with [guardrail_name, error_type, hook_type]; litellm_guardrail_requests_total with [guardrail_name, status, hook_type].
  Gauge with fixed labels: litellm_provider_remaining_budget_metric with [api_provider].
  Gauges with schema labels: litellm_deployment_state, litellm_deployment_tpm_limit, litellm_deployment_rpm_limit.
  Counters with schema labels: litellm_deployment_cooled_down, litellm_deployment_success_responses, litellm_deployment_failure_responses, litellm_deployment_total_requests.
  Histogram with schema labels and NO buckets argument: litellm_deployment_latency_per_output_token. It keeps the Prometheus client default buckets, not latency_buckets.
  Counters with schema labels: litellm_deployment_successful_fallbacks, litellm_deployment_failed_fallbacks.
  Counter with fixed labels: litellm_callback_logging_failures_metric with [callback_name].
  Counters with schema labels: litellm_llm_api_failed_requests_metric, litellm_requests_metric, litellm_zero_cost_requests_total.
  Gauge with schema labels: litellm_spend_capture_rate.
  Counters with schema labels: litellm_cache_hits_metric, litellm_cache_misses_metric, litellm_cached_tokens_metric,
  litellm_provider_cache_read_input_tokens_metric, litellm_provider_cache_creation_input_tokens_metric.
  Gauges with no labels: litellm_total_users, litellm_active_users, litellm_teams_count (fields litellm_total_users_metric, litellm_active_users_metric, litellm_teams_count_metric).
  Counters with fixed labels: litellm_managed_batch_created_total and litellm_managed_file_created_total, both [model, api_provider, user, user_email, api_key_alias].
  Gauge with fixed labels: litellm_managed_file_size_bytes with [purpose, file_type, model, api_provider, user].
  Histogram with fixed labels [model, api_provider] and B3870's BATCH_DURATION_BUCKETS: litellm_managed_batch_duration_seconds.
  Counter with fixed labels: litellm_managed_file_deleted_total with [result].
  Gauge with no labels: litellm_check_batch_cost_jobs_polled.
  Counters with fixed labels: litellm_check_batch_cost_jobs_processed_total with [model, api_provider]; litellm_check_batch_cost_errors_total with [error_type].
  Gauge with no labels: litellm_check_batch_cost_last_run_timestamp.
  Counters with schema labels: litellm_mcp_tool_calls_total, litellm_mcp_tool_call_spend_metric.
  Copy each collector's help text word for word from the LiteLLM source, because /metrics prints it. Several help strings are long or contain typos ("deploymeny" in litellm_deployment_failure_responses); keep them.

  Because the factory is B3874's, a metric that is in exclude_metrics or outside a non-empty enabled set becomes a no-op collector and is not registered, and a metric with excluded labels is registered with the kept labelnames only.
  The fixed label lists above also pass through the factory, so prometheus_exclude_labels removes names from them too.

  Registry. No other task owns one, so this task adds `CollectorRegistry` in crates/betterlite-logging/src/prometheus_exporter/registry.rs. It mirrors prometheus_client's rules.
  A collector registers the sample names it will expose: a counter registers NAME_total and NAME_created (a counter name that already ends in _total, like litellm_guardrail_errors_total, is first stripped of that suffix),
  a gauge registers NAME, a histogram registers NAME_bucket, NAME_count, NAME_sum and NAME_created. Registering a name that is already taken fails with a typed duplicate-timeseries error
  that names the clashing sample names, as prometheus_client does with ValueError. `CollectorRegistry` also offers a lookup by collector name and a listing of registered collectors with kind, help text, labelnames and buckets,
  so B3886's scrape rendering and the oracle helper can read it. A second `register` call against the same registry therefore fails, as a second PrometheusLogger() does in LiteLLM; the callback layer decides when to construct (see out_of_scope).

  A failure while creating any collector stops the constructor and returns the error. Collectors made before it stay registered; there is no rollback, as in LiteLLM. Log the failure at debug level (LiteLLM's print_verbose) and return it.

  Config section. Add crates/betterlite-config/src/sections/prometheus_exporter.rs. It parses litellm_settings.prometheus_latency_buckets (optional list of floats, default none)
  and litellm_settings.prometheus_emit_input_sequence_length_label (bool, default false; only the value true turns it on). Anything else follows config rules already in the crate (typed error on a wrong type).
  The other settings the constructor reads (prometheus_metrics_config, prometheus_exclude_metrics, prometheus_exclude_labels, custom label lists, caller identity) are not parsed here; B3874 and B3872 take them as inputs.

  Oracle. Add helper cases that build the exporter in LiteLLM and in betterlite and compare the registered collectors (name, kind, help text, labelnames, buckets, in creation order).
  The helper operation is named b3875 by the skeleton, takes the settings as inputs and returns that listing. Cases: defaults; exclude_metrics; exclude_labels; prometheus_metrics_config with include_labels for one metric;
  custom prometheus_latency_buckets; prometheus_emit_input_sequence_length_label true; caller identity user_email; caller identity both. Send settings of the declared types only.

scope:
  paths:
    - crates/betterlite-logging/src/prometheus_exporter.rs
    - crates/betterlite-logging/src/prometheus_exporter/**
    - crates/betterlite-config/src/sections/prometheus_exporter.rs
    - crates/betterlite-config/src/sections/prometheus_exporter/**
    - tools/oracle/cases/helpers/prometheus-exporter/**
    - "tools/oracle/fuzz/corpus/helper_case/prometheus_exporter-*"
    - tools/oracle/helpers/b3875.py
    - tools/oracle/helpers/b3875/**
    - tools/oracle/src/helpers/logging/b3875.rs
    - tools/oracle/src/helpers/logging/b3875/**
  lint_tables: false

