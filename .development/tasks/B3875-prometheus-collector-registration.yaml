dod:
  - text: register creates exactly the 81 collectors of the table, each with LiteLLM's Prometheus name, kind, help text, fixed or schema labelnames and bucket choice.
    proof: [exporter-tests, exporter-oracle]
  - text: >-
      Struct fields use LiteLLM's attribute names, including the five that differ from the metric name
      (litellm_tokens_metric, litellm_request_queue_time_metric, litellm_total_users_metric, litellm_active_users_metric, litellm_teams_count_metric).
    proof: [exporter-tests]
  - text: An invalid caller-identity mode fails register before any collector is registered, and the registry stays empty.
    proof: [exporter-tests]
  - text: Histograms use prometheus_latency_buckets when set, else LATENCY_BUCKETS; litellm_managed_batch_duration_seconds uses BATCH_DURATION_BUCKETS; litellm_deployment_latency_per_output_token keeps the client default buckets.
    proof: [exporter-tests, exporter-oracle]
  - text: A metric in prometheus_exclude_metrics is a no-op collector and is absent from the registry; a metric with excluded labels is registered with the kept labelnames only, for schema and fixed label lists alike.
    proof: [exporter-tests, exporter-oracle]
  - text: prometheus_metrics_config include_labels narrow the labelnames of the named metric and nothing else, and the label cache keeps those sets after later toggles change.
    proof: [exporter-tests, exporter-oracle]
  - text: CollectorRegistry registers counter, gauge and histogram sample names as listed above (counter _total stripping, _created, _bucket, _count, _sum) and rejects a clash with a typed duplicate error naming the sample names.
    proof: [registry-tests]
  - text: A second register on the same registry fails with the duplicate error, and collectors created before the failing one stay registered.
    proof: [registry-tests]
  - text: >-
      The config section reads litellm_settings.prometheus_latency_buckets (default none) and prometheus_emit_input_sequence_length_label (default false, only true enables),
      and rejects a wrong type with a typed error.
    proof: [config-tests]
  - text: Oracle helper cases for the eight settings combinations match LiteLLM's registered collector listing.
    proof: [exporter-oracle, helper-python, helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: exporter-tests
      why: the collector table, field names, bucket choices, exclusions or early validation are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_exporter::tests::/) - test(replays_the_helper_case_corpus)'
    - id: registry-tests
      why: sample-name registration or duplicate rejection is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_exporter::registry::tests::/)'
    - id: config-tests
      why: the prometheus_exporter section does not load its two keys or their defaults
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::prometheus_exporter::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3875)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3875 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3875/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added exporter cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/prometheus_exporter-*")" &&
        grep -lE '^[[:space:]]+b3875:' tools/oracle/fuzz/corpus/helper_case/prometheus_exporter-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: exporter-oracle
      why: the registered collector listing differs from LiteLLM's for some settings
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/prometheus-exporter)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/prometheus-exporter

oracle_cases:
  - tools/oracle/cases/helpers/prometheus-exporter/defaults.yaml
  - tools/oracle/cases/helpers/prometheus-exporter/exclude-metrics.yaml
  - tools/oracle/cases/helpers/prometheus-exporter/exclude-labels.yaml
  - tools/oracle/cases/helpers/prometheus-exporter/include-labels-for-one-metric.yaml
  - tools/oracle/cases/helpers/prometheus-exporter/custom-latency-buckets.yaml
  - tools/oracle/cases/helpers/prometheus-exporter/input-sequence-length-label.yaml
  - tools/oracle/cases/helpers/prometheus-exporter/caller-identity-user-email.yaml
  - tools/oracle/cases/helpers/prometheus-exporter/caller-identity-both.yaml

deviations:
  - what: Collectors register in a betterlite CollectorRegistry owned by the exporter, not in a process-global default registry.
    why: Dependencies come in through constructors and module-level state is forbidden; the duplicate-name rules are the same as prometheus_client's.
  - what: A failed constructor returns a typed error and logs at debug level instead of printing through print_verbose and re-raising.
    why: Errors surface as typed values; the visible result (construction fails, earlier collectors stay registered) is the same.
  - what: Metric values are Decimal or integer types from B3874's collector interface, never Python floats.
    why: Money must not pass through binary floats; this task creates collectors only, so the helper listing shows no values.

out_of_scope:
  - "get_instance, the metric factories, _ExcludedLabelMetric, get_labels_for_metric, config parsing and validation and the pretty printers: B3874 owns them and this task calls them."
  - "Label schema (PrometheusMetricLabels.get_labels): B3872 and B3871. Caller-identity validation functions, LATENCY_BUCKETS, BATCH_DURATION_BUCKETS and the metric vocabulary: B3870."
  - "BoundedPrometheusSeriesTracker and _inc_labeled_counter: B3876."
  - "Writing to token, spend and media collectors (lines 1560-1735, 1987-2040): B3877. Latency, overhead and guardrail observations (2253-2365, 3211-3258): B3878."
  - "Budget gauge projection and the budget initialization and cron job (3617-4535): B3882, B3883 and B3884. Rate-limit gauges (2049-2222, 2938-3065): B3879."
  - "Failure hooks, deployment outcome and fallback emission, managed batch and cache emitters (lines 2365-3210, 3259-3600): B3880, B3881 and the owners listed in B111."
  - "_mount_metrics_endpoint (4565-4594), scrape rendering and its auth: B3886. PROMETHEUS_MULTIPROC_DIR handling is there too."
  - "Building the logger on first use and caching it in the callback list (litellm_logging.py:4590-4602): the callback layer from B189 decides when to call register. No planned task claims that call yet; see the notes in the report."
  - "PrometheusServicesLogger and its own service collectors: B3885."
  - "The module-level helpers in lines 91-250 (_bounded_requested_model_label, _get_budget_metrics_per_request_timeout, _get_proxy_llm_router): the emitters that call them own them."

pitfalls:
  - The Prometheus name and the LiteLLM attribute differ for litellm_total_tokens_metric (attribute litellm_tokens_metric), litellm_request_queue_time_seconds, litellm_total_users, litellm_active_users and litellm_teams_count; emitters look fields up by attribute name.
  - litellm_deployment_latency_per_output_token is the only histogram built without a buckets argument, so it must keep the client default buckets and not latency_buckets.
  - The three guardrail collectors, the provider budget gauge, callback failures and the managed batch and check-batch-cost collectors use literal labelnames, not the schema; the factory still strips excluded labels from them.
  - A counter whose name already ends in _total (litellm_guardrail_errors_total, litellm_zero_cost_requests_total, litellm_managed_batch_created_total) registers NAME without the suffix plus NAME_total and NAME_created, so a duplicate check on the raw name misses the clash.
  - "prometheus_latency_buckets set to an empty list is still set: LiteLLM checks `is not None`, not truthiness."
  - Validation of the caller-identity mode runs first on purpose; moving it after the first collector leaves a partly filled registry on a bad value.
  - prometheus_emit_input_sequence_length_label counts only when it is exactly true (`is True`), so the string "true" stays off.
  - The label cache is filled at register time through get_labels_for_metric; toggles changed later must not change the labelnames already used to create collectors.
  - Help strings for litellm_request_total_latency_metric and litellm_request_queue_time_seconds span several concatenated Python string literals with spaces and a double hyphen; join them exactly.
  - litellm_overhead_latency_metric says milliseconds in its help text yet uses latency_buckets in seconds-scale; keep both as they are.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
