id: B10160
title: Guardrail pipeline runs and pipeline result mapping
description: >-
  ProxyLogging runs a request's guardrail pipelines twice: before the provider call in B8393's pre-call hook and after it in B8394's post-call hook. Both go through `_maybe_execute_pipelines`. It runs each pipeline through B3247's executor, and `_handle_pipeline_result` turns the result into changed data, a replacement response or an error (litellm/proxy/utils.py L2183-L2317). These two functions sat inside B8393, so B8394 waited for the whole pre-call walk; this task builds them alone, and B8393, B8394 and B6370's stream gate (through B8399's PipelineSource) call this one copy. Code goes in crates/betterlite-server/src/guardrails/pipeline_execution.rs and pipeline_execution/ (result.rs, tests.rs). The stub file and its `pub mod` line in guardrails.rs are on main.

  Runner, in pipeline_execution.rs. `PipelineExecution::new(executor: Arc<PipelineExecutor>, hooks: Arc<HookExecution>)` holds B3247's executor and B8392's `HookExecution`; B8399 builds the real one. `maybe_execute_pipelines(&self, call: PipelineCall<'_>) -> Result<Option<JsonValue>, ProxyHookError>` takes `data: &mut JsonMap`, the key (`&UserAPIKeyAuth`), the `CallType`, `event_hook: PipelineMode`, `raw_snapshot: Option<&JsonMap>`, `response: Option<&JsonValue>` and `callbacks: &[Arc<dyn ProxyCallback>]` (B8390's resolved callbacks, for the block lookup). It reads the pipelines once with B8391's `policy_pipelines(data)` and returns Ok(None) at once when there are none. For each pipeline whose mode equals event_hook, in order: the step input is data itself while there is no current response, else a copy of data with `response` set to the current response. Call B3247's `execute_steps` with the pipeline's steps and mode, the step input, the key as ExecuteSteps takes it, the call type's LiteLLM name, the policy name and the snapshot, with no chunks and no translation. Pass the result to handle_pipeline_result with the current response as original_response. Then, when there is a current response and the result's modified_data holds `response`, that value becomes the current response for the next pipeline. Return the current response only when it differs from the one passed in, else None.

  The data crosses into B3247's `BTreeMap<String, GuardrailValue>` the way B8392's hook_execution/bridge.rs moves metadata buckets, through `OpaqueParams`, so a number keeps its text. What execute_steps writes into the step input comes back: all of it when the step input is data. With a response, LiteLLM's step input `{**data, "response": ...}` is a shallow copy, so only writes into a `metadata` or `litellm_metadata` map that data already held reach data; a new top-level key, or a bucket execute_steps had to create, stays in the copy. An error out of execute_steps (B3247's `PipelineExecError`) goes up as `ProxyHookError::Other` with its text.

  Result, in result.rs. `handle_pipeline_result(hooks: &HookExecution, callbacks: &[Arc<dyn ProxyCallback>], result: PipelineExecutionResult, data: &mut JsonMap, policy_name: &str, original_response: Option<&JsonValue>) -> Result<(), ProxyHookError>` is a plain function, as LiteLLM's is a staticmethod. original_response is the response on the post-call path, the buffered chunk list as a JSON array on B6370's stream path and None on pre-call. On allow with modified_data, its keys replace data's when original_response is None; with an original response only B8391's `merge_pipeline_metadata_writes` runs, since the request body already went upstream. Every other action first runs merge_pipeline_metadata_writes when modified_data is set, so the failure spend record keeps guardrail cost and status.

  Block. The blocking step is the last step result (none when the list is empty). Its callback is the first in callbacks whose `guardrail()` has that `guardrail_name`, LiteLLM's find_guardrail_callback over litellm.callbacks; when found, record it with B8392's `record_raising_guardrail`. original_exception holds the step's failure, B5471's `GuardrailFailure` boxed by B3247: downcast it and turn it into the ProxyHookError for the same LiteLLM exception. Http stays Http, HttpObject becomes Http with the object as JSON text (the form B8392's enrich_error reads), GuardrailRaised and BlockedPii become GuardrailRaised with their message text, status and blocked_content (false for BlockedPii), ModifyResponse and SensitiveDataRoute keep their variant, and Other stays Other; a box holding any other error type becomes Other with its text. When B8390's `changes_request_flow` is false for that error, enrich it with B8392's `enrich_error` if the callback was found and return it. Otherwise, and when there is no original exception, fail with `ProxyHookError::Http` status 400 and as detail the JSON text of `{"error": {"message": "Content blocked by guardrail pipeline '<policy>'", "type": "guardrail_pipeline_error", "pipeline_context": {"policy": "<policy>", "step_results": [{"guardrail": ..., "outcome": ..., "action": ...}]}}}`, one entry per step result in order, each from guardrail_name, outcome and action_taken.

  Modify response and next. modify_response fails with `ProxyHookError::ModifyResponse` whose message is modify_response_message or "Response modified by pipeline", model is data's `model` text or "unknown", guardrail_name is `pipeline:<policy>`, detection_info is empty and original_response is the one passed in. B3240's `PipelineAction::Next` can reach this function by type though the executor never returns it: after the metadata merge it returns Ok, as LiteLLM's last `return data` does.

  Tests in pipeline_execution/tests.rs build B3247's PipelineExecutor over fake guardrails the way its own tests do, a HookExecution over fakes the way hook_execution/tests does, and fake ProxyCallback guardrails. `run_` tests cover no pipelines, the mode filter, two post_call pipelines chaining a response, None for an unchanged response and on pre-call, the raw snapshot reaching a scan_raw_request step, a block from the second pipeline after the first allowed, and the write-back rule with and without a response. `result_` tests cover each action, the 400 body text, a found callback being recorded and its HTTP detail getting guardrail_name and guardrail_mode, every GuardrailFailure variant's mapping, and recording that still happens when the original failure was a SensitiveDataRoute.

  Oracle. Helper operation b10160 runs handle_pipeline_result alone. A call carries `result` (terminal_action; step_results with guardrail_name, outcome and action_taken; modified_data; modify_response_message; original_exception as null or one of `{kind: http, status, detail}`, `{kind: guardrail_raised, guardrail_name, message, status}`, `{kind: modify_response, message, model}` and `{kind: sensitive_route, route_to_model, session_id}`), `data`, `policy_name` and `original_response`. It answers `{"data": <data after the call>, "raised": null}` or with `raised` set to `{"type": "http", "status_code", "detail"}`, `{"type": "guardrail_raised", "message", "status_code"}` or `{"type": "modify_response", "message", "model", "guardrail_name", "original_response"}`. The Python side builds LiteLLM's PipelineExecutionResult and the exception (HTTPException, GuardrailRaisedException with should_wrap_with_default_message false, ModifyResponseException, SensitiveDataRouteException) and calls `ProxyLogging._handle_pipeline_result` with litellm.callbacks empty, so no guardrail is found or recorded. The Rust side builds B3240's result with the matching boxed GuardrailFailure, a HookExecution from no-op parts and an empty callback list, and answers an Http detail that parses as a JSON object as that object. Add helper_case corpus seeds named pipeline-execution-*.
