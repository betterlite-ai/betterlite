dod:
  - text: maybe_execute_pipelines runs only the pipelines of the given mode in order with the snapshot, chains a replacement response from one pipeline to the next, and returns it only when it changed.
    proof: [run-tests]
  - text: What execute_steps writes into the step input reaches data in full without a response, and only through metadata buckets data already held with one.
    proof: [run-tests]
  - text: allow merges the modified data fully on pre-call and only the metadata buckets when an original response is given; block and modify_response merge the metadata buckets before failing.
    proof: [result-tests, oracle, helper-python]
  - text: block records the blocking guardrail, re-raises an original failure that does not change the request flow with the guardrail context added, and otherwise fails with LiteLLM's 400 guardrail_pipeline_error body.
    proof: [result-tests, oracle, helper-python]
  - text: modify_response fails with ModifyResponse carrying the message or its default, the model or "unknown", "pipeline:<policy>" and the original response.
    proof: [result-tests, oracle, helper-python]
  - text: New pipeline-execution seeds for b10160 replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: run-tests
      why: a pipeline runs in the wrong mode or order, a response does not chain, the replacement comes back unchanged, or step input writes are lost or leak
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::pipeline_execution::tests::run_/)'
    - id: result-tests
      why: an allow merge, the block lookup, re-raise or 400 body, a failure mapping or the modify_response error is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::pipeline_execution::tests::result_/)'
    - id: helper-python
      why: The b10160 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10160.py tools/oracle/helpers/b10160)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10160 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/pipeline-execution-*")" &&
        grep -lE 'b10160"?:' tools/oracle/fuzz/corpus/helper_case/pipeline-execution-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-server --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/pipeline-execution/allow-pre-call-full-merge.yaml
  - tools/oracle/cases/helpers/pipeline-execution/allow-post-call-metadata-only.yaml
  - tools/oracle/cases/helpers/pipeline-execution/block-generic-pipeline-error.yaml
  - tools/oracle/cases/helpers/pipeline-execution/block-reraises-http-exception.yaml
  - tools/oracle/cases/helpers/pipeline-execution/block-flow-changing-original-gives-400.yaml
  - tools/oracle/cases/helpers/pipeline-execution/modify-response-message-and-defaults.yaml
deviations: []
out_of_scope:
  - "The pre-call walk, has_pre_call_guardrails, prompt templates and guardrail metadata: B8393. The post-call hooks that call the runner with event post_call: B8394."
  - "PipelineExecutor.execute_steps and its step runner: B3247; the executor's own find_guardrail_callback: B3246. _policy_pipelines and _merge_pipeline_metadata_writes: B8391. _record_raising_guardrail and enrich_http_exception_with_guardrail_context: B8392's bridge.rs. _exception_changes_request_flow: B8390's changes_request_flow."
  - "_pipeline_gated_stream, the streaming caller of _handle_pipeline_result at L4067: B6370, through B8399's PipelineSource."
  - "Building PipelineExecution from the real executor and hook execution, and the HTTP oracle cases through the booted proxy: B8399."
pitfalls:
  - A block whose original failure is a SensitiveDataRoute or ModifyResponse fails with the generic 400, not with that failure, since a step set to block must block.
  - Pass record_raising_guardrail the error the block raises, never the original SensitiveDataRoute; B8392's function skips a SensitiveDataRoute, while LiteLLM records the blocking guardrail on every pipeline block.
  - An empty modify_response_message falls back to "Response modified by pipeline" the same as a missing one, because LiteLLM uses `or`.
  - Pipelines are read once before the loop, so `_guardrail_pipelines` written by a step changes nothing for this run.
  - On pre-call there is no current response, so the runner returns None even when a step's modified_data holds a `response` key.
  - merge_pipeline_metadata_writes drops the `guardrails` key of each bucket, so a post-call allow never rewrites the request's own guardrail list.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
