id: B227
title: Bedrock image and MIME blocks
description: >-
  Implement _parse_content_type, _parse_mime_type and every BedrockImageProcessor method. Use B183 supplied inline
  bytes and MIME descriptors, preserve data-URL and S3 representations. Remote HTTP fetching remains the open B183
  decision; no network path is added. Budget 280 transforms/types, 100 adapters, 300 tests/fuzz and 70 wiring (750
  total). Write the behavior rstest functions bedrock_images_behavior_tests_behavior in adjacent tests.rs files, with a named
  case for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation bedrock_images is already registered; each operation has its
  own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/bedrock_images.rs
  - crates/betterlite-prompts/src/bedrock_images/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/prompts/bedrock_images.rs
  - tools/oracle/src/helpers/prompts/bedrock_images/**
  - tools/oracle/helpers/bedrock_images.py
  - tools/oracle/helpers/bedrock_images/**
  - tools/oracle/cases/helpers/bedrock-images/**
  - "tools/oracle/fuzz/corpus/helper_case/bedrock_images-*"
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L3375-L3616
  why: Exact function/class ownership.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::bedrock_images_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_images-*")" &&
      grep -lq 'bedrock_images' tools/oracle/fuzz/corpus/helper_case/bedrock_images-* && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/bedrock-images/inline-image.yaml
- tools/oracle/cases/helpers/bedrock-images/mime-parameters.yaml
- tools/oracle/cases/helpers/bedrock-images/s3-image.yaml
- tools/oracle/cases/helpers/bedrock-images/unsupported-format.yaml
deviations:
- what: >-
    Open, waiting for Max: retain no remote media downloads or use SSRF-checked public-URL fetching shared with
    B183.
  why: Keep the current inline-only plan; do not build a download dependency until the decision.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L3431-L3586
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B181 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'Name every corpus seed tools/oracle/fuzz/corpus/helper_case/bedrock_images-<case>.yaml. The rest of that folder belongs to other tasks.'
- 'The oracle helper for this task is pre-registered as bedrock_images in the prompts group. Replace the stub Op in tools/oracle/src/helpers/prompts/bedrock_images.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_images.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
