deviations:
  - what: The Vault manager does not check for a premium license.
    why: betterlite has no paid tier, so there is nothing to gate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/hashicorp_secret_manager.py#L122-L125
  - what: The AppRole token is kept in its own slot, apart from the cached secret bodies.
    why: LiteLLM keeps both in one cache capped at 200 entries, so many cached secrets can evict the token and force an extra login. In its own slot only the lease ends the token.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/hashicorp_secret_manager.py#L129-L131
  - what: An async caller logs in over the async transport.
    why: LiteLLM's _get_request_headers is synchronous, so an async read blocks the event loop for the whole login. betterlite never blocks inside async code.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/hashicorp_secret_manager.py#L378-L396
  - what: A failed login reports the method and the HTTP status or transport error in betterlite's own words, not the text of the Python exception.
    why: The exception text comes from httpx and the JSON decoder and can quote response content, and a login response holds a token.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/hashicorp_secret_manager.py#L218-L219
  - what: A negative HCP_VAULT_REFRESH_INTERVAL or SECRET_MANAGER_REFRESH_INTERVAL is rejected at construction.
    why: The interval is an unsigned number of seconds. LiteLLM accepts a negative number and then expires every entry at once.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/hashicorp_secret_manager.py#L129-L131
  - what: A login response with a negative or fractional lease_duration is a failed login.
    why: Vault sends the lease as whole seconds, so betterlite reads it as an unsigned integer. LiteLLM would pass any number on to its cache.
    link: https://developer.hashicorp.com/vault/api-docs/auth/approle
  - what: A Vault response body over 1 MiB is refused, and the body cache has no separate per-item limit.
    why: Every outside body has a size limit in betterlite. LiteLLM reads any size, and its cache's 1 MiB item check is not needed once the body is capped.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/in_memory_cache.py#L56
out_of_scope:
  - B4417 owns async_read_secret, sync_read_secret, async_write_secret, async_rotate_secret, async_delete_secret, _vault_secret_read_body, the BaseSecretManager impl and every read and write of the body cache.
  - B4410 owns raise_if_unsafe_secret_name, UnsafeSecretNameError and the BaseSecretManager contract.
  - B4421 owns choosing the manager at startup and the dispatch. LiteLLM's constructor also sets litellm.secret_manager_client and litellm._key_management_system (L127-L128). This constructor sets no global, and the caller keeps the manager.
  - B4421 owns the outbound wiring of a real client behind VaultTransport, the same split B4418 used for ConjurTransport.
  - B1647 owns the Vault config override routes, test_hashicorp_vault_connection and HASHICORP_ENV_VAR_MAPPING.
pitfalls:
  - >-
    The three URL segments don't treat an empty override alike. An explicit empty namespace or
    path_prefix, or one of only spaces and slashes, removes the segment even when
    HCP_VAULT_NAMESPACE is set. An explicit empty mount gives the literal secret, not
    HCP_VAULT_MOUNT_NAME. A None override, absent or JSON null, uses the manager's value. So
    Option<String> is enough for each field, and the empty string must stay Some("").
  - >-
    A present `secret_manager_settings` replaces the flat keys completely, even as an empty object:
    `{"secret_manager_settings":{},"namespace":"x"}` uses the manager's namespace, not x. The flat
    keys count only when the nested value is absent or null.
  - >-
    The data key is trimmed of whitespace only, never of slashes, so " /a/ " becomes "/a/". Empty or
    None gives "key".
  - >-
    Don't normalize the URL. The secret name goes in raw, with no percent-encoding (CyberArk does
    encode, Vault doesn't), a trailing slash on HCP_VAULT_ADDR stays and gives `//v1/`, and
    HCP_VAULT_APPROLE_MOUNT_PATH is used as given with no trim. Build the string with format!, not a
    URL type that would change any of these.
  - >-
    X-Vault-Namespace goes on login requests only, and its value isn't trimmed. The secret namespace
    travels in the URL path, so HCP_VAULT_SECRET_NAMESPACE alone sends no login header and
    HCP_VAULT_LOGIN_NAMESPACE never changes a secret URL.
  - >-
    An unset HCP_VAULT_CERT_ROLE sends `{"name":null}`, not `{}`. Keep the key: no
    skip_serializing_if on that field.
  - >-
    TLS login never reuses a token. LiteLLM writes hcp_vault_token to its cache but no production code
    reads that key, so every call logs in again. Don't store the TLS token in the slot. The TLS
    response still needs lease_duration, because LiteLLM reads it and fails the login when it's
    missing.
  - >-
    A lease of 0 means the token is stale as soon as the clock moves, not that it never expires. Don't
    read 0 as "no expiry".
  - >-
    AppRole login follows redirects and TLS login doesn't, because LiteLLM's shared sync client sets
    follow_redirects=True and a bare httpx.Client leaves it off. A standby node in a Vault HA cluster
    answers 307, so AppRole reaches the active node while TLS fails on the 307: raise_for_status
    treats every non-2xx as an error. Set the flag per method, and treat a 3xx that reaches the manager
    as a failed login.
  - >-
    Don't pass serde_json's error along. Its text can quote the rejected value and a login response
    holds a token, so `decode_login_response` drops the source error and `InvalidLogin` carries only
    the method. Call expose_secret only to build a request body or to decode.
  - >-
    `secret_value` walks a serde_json::Value, not a derived struct. The secret object holds whatever the
    user stored, so a number next to the wanted key must not fail the read, and a derived struct would
    reject a repeated key where Python keeps the last one.
  - >-
    The async path calls `send`, never `send_blocking`, and doesn't hold the token slot's mutex across
    the await: read the slot, drop the guard, log in, then lock again to store.
  - >-
    A refresh interval of 0 is used as given (docs/compatibility.md), while LiteLLM's cache turns 0 into
    600 with `default_ttl or 600`. That needs no deviation, but no oracle case may set an interval to 0
    or any variable to an empty string, since those two differ by design.
  - >-
    The base similarity check flags a copy of 8 or more lines at 85 percent. Reuse TtlCache and
    ClientCertificate, and don't paste read_seconds from google_secret_manager/settings.rs: a short loop
    over the two variable names covers the refresh interval.
  - >-
    The Python helper must set premium_user to True before it builds the manager, or LiteLLM refuses
    to start, and it must replace both _get_httpx_client and httpx.Client since the two logins use
    different clients. tools/oracle/helpers/b4418.py shows the clock and client patching.
