id: B4416
title: Authenticate Vault requests and resolve secret targets
description: >-
  Build the core of the HashiCorp Vault manager in the new module
  `betterlite_secret_managers::vault`: its settings, login, the token and namespace a Vault
  call carries, the URL of a secret, and the decoders for Vault's JSON. B4417 builds read,
  write, rotate and delete on top of this module and B1647's connection test calls it too,
  so every name below is public unless it says otherwise. Follow the shape of
  crates/betterlite-secret-managers/src/cyberark.rs: the environment arrives as
  `&BTreeMap<String, String>`, HTTP goes through an injected transport trait with an async
  and a blocking method, and time comes from the existing `crate::cyberark::Clock`. The
  manager is `HashicorpSecretManager<T: VaultTransport>` in vault.rs, built with
  `new(environment, transport, clock) -> Result<Self, VaultInitError>`.


  vault/settings.rs holds `VaultSettings::from_environment(environment)`. An empty variable
  counts as unset. Read HCP_VAULT_ADDR (default http://127.0.0.1:8200), HCP_VAULT_NAMESPACE,
  HCP_VAULT_LOGIN_NAMESPACE, HCP_VAULT_SECRET_NAMESPACE, HCP_VAULT_MOUNT_NAME (default
  secret), HCP_VAULT_PATH_PREFIX, HCP_VAULT_TOKEN, HCP_VAULT_APPROLE_ROLE_ID,
  HCP_VAULT_APPROLE_SECRET_ID, HCP_VAULT_APPROLE_MOUNT_PATH (default approle),
  HCP_VAULT_CLIENT_CERT, HCP_VAULT_CLIENT_KEY and HCP_VAULT_CERT_ROLE. The refresh interval
  comes from HCP_VAULT_REFRESH_INTERVAL, then SECRET_MANAGER_REFRESH_INTERVAL, then 86400
  seconds, each parsed with `betterlite_env::number::<u64>`. A bad value is
  `VaultInitError::RefreshInterval`, carrying the parser's `EnvError`.


  The login method is a closed choice, so `VaultSettings` holds the enum `VaultAuth` with
  `AppRole { role_id, secret_id, mount_path }`, `TlsCert { client_certificate, role }` and
  `Token(SecretString)`. Choose in that order: role id and secret id both present gives
  AppRole, else certificate and key both present gives TlsCert, else a token gives Token, else
  `VaultInitError::MissingCredentials`. AppRole wins even when HCP_VAULT_TOKEN is set, and one
  half of a pair counts for nothing. The role id, secret id and token are `SecretString`.
  `client_certificate` is the existing `crate::cyberark::transport::ClientCertificate`.


  vault/transport.rs defines `VaultTransport` the way cyberark/transport.rs defines
  `ConjurTransport`: `send` returns `impl Future<Output = Result<VaultResponse, Self::Error>> +
  Send` and `send_blocking` makes the same call synchronously. `VaultRequest` has `method`
  (enum `VaultMethod` with Get, Post and Delete, since B4417 needs all three), `url`,
  `token: Option<SecretString>` for the X-Vault-Token header, `namespace: Option<String>` for
  the X-Vault-Namespace header, `body: Option<SecretString>` holding JSON text,
  `client_certificate: Option<ClientCertificate>`, `timeout: Duration`, `follow_redirects:
  bool` and `max_response_bytes: usize`. `VaultResponse` has `status: u16` and `body:
  SecretString`. Export `MAX_RESPONSE_BYTES`, 1 MiB. No real HTTP client is built here: tests
  and the oracle helper use scripted transports.


  vault/auth.rs adds `request_token(&self)` (async) and `request_token_blocking(&self)` to the
  manager, both returning `Result<SecretString, VaultError<T::Error>>`. Token mode returns the
  configured token with no HTTP call. AppRole checks the token slot first, and on a miss POSTs
  `{addr}/v1/auth/{mount_path}/login` with the JSON body `{"role_id":...,"secret_id":...}`, the
  login namespace, a 600 second timeout and follow_redirects true. TlsCert POSTs
  `{addr}/v1/auth/cert/login` with the JSON body `{"name":role}`, the client certificate, the
  login namespace, a 5 second timeout and follow_redirects false, and it logs in on every call.
  Build both bodies from small Serialize structs so serde does the escaping. Split each login
  into one function that builds the request and one that reads the response, as
  cyberark/cyberark_auth.rs does, so the async and blocking paths differ only in the transport
  call.


  The AppRole token lives in its own slot on the manager, `Mutex<Option<CachedToken>>`, with
  expiry set to now plus lease_duration seconds. It counts as expired once `now > expiry`. The
  manager also owns the secret body cache for B4417: the existing
  `crate::cyberark::ttl_cache::TtlCache`, built with the refresh interval as its TTL and reached
  through `pub(crate) fn body_cache(&self)`. The architect's skeleton widens that type to
  pub(crate), so use it and don't write a second cache. Its keys will be secret URLs and its
  values raw response bodies. This task only creates it; reading and writing it is B4417's.


  vault/target.rs defines `VaultSecretSettings` with `namespace`, `mount`, `path_prefix` and
  `data`, all `Option<String>`, and `VaultSecretParams` with `secret_manager_settings:
  Option<VaultSecretSettings>` plus the same four keys flat through `#[serde(flatten)]`. Both
  derive Deserialize and ignore other keys. B4417 uses `VaultSecretParams` as its
  `BaseSecretManager::Params`. `get_url(&self, secret_name, &VaultSecretSettings)` calls
  `raise_if_unsafe_secret_name` first and then returns
  `{addr}/v1/[{namespace}/]{mount}/data/[{path_prefix}/]{secret_name}`. For each of namespace,
  mount and path_prefix: take the override, or the manager's value when the override is None,
  trim whitespace, trim `/`, and treat an empty result as nothing. No namespace or prefix leaves
  that segment out; no mount gives the word secret. `build_secret_target(&self, secret_name,
  Option<&VaultSecretParams>)` picks the settings, calls `get_url` and returns
  `VaultSecretTarget { url, data_key, secret_name }`. Both return
  `Result<_, UnsafeSecretNameError>`. The manager also has `vault_addr()`,
  `vault_login_namespace()` and `vault_secret_namespace()`, the last two giving the override
  variable, else HCP_VAULT_NAMESPACE, as `Option<&str>`. B1647 builds its token lookup from
  `request_token`, `vault_login_namespace` and `vault_addr`.


  vault/response.rs holds three public decoders over raw bytes.
  `decode_login_response(&[u8]) -> Result<VaultLogin, VaultResponseError>` reads
  `auth.client_token` into a SecretString and `auth.lease_duration` as u64.
  `json_object_body(&[u8]) -> Result<serde_json::Map<String, serde_json::Value>,
  VaultResponseError>` is LiteLLM's `_json_object_body`, for B4417.
  `secret_value(&[u8], data_key: &str) -> Option<SecretString>` walks `data`, `data`, then the
  key, and gives None for bad JSON, a missing step, a non-object step or a non-string value.


  vault/error.rs defines `VaultInitError`, `VaultResponseError` and `VaultError<E>`, whose
  variants `Transport { method, source }`, `Status { method, status }`, `ResponseTooLarge {
  method, limit }` and `InvalidLogin { method }` carry the enum `LoginMethod` (AppRole or
  TlsCert). The text starts "Could not authenticate to Vault via AppRole" or "... via TLS cert".
  Any status outside 200 to 299, a body longer than `max_response_bytes`, or a body that doesn't
  decode is a failed login.


  Add the cargo-fuzz target `vault_response` to crates/betterlite-secret-managers/fuzz. It feeds
  the same bytes to all three decoders. Register its [[bin]] in fuzz/Cargo.toml, seed
  fuzz/corpus/vault_response with real login and KV v2 bodies plus broken ones, and add the test
  `replays_the_vault_response_corpus` in `vault::response::tests`, modeled on
  crates/betterlite-secret-managers/src/oidc/tests/oidc_jwt_fuzz_corpus.rs.


  The skeleton adds the oracle helper operation b4416. Its input has the same `env`, `routes` and
  `steps` shape as the b4418 cases in tools/oracle/cases/helpers/cyberark, with the steps
  `{op: token}`, `{op: token_blocking}`, `{op: namespaces}`, `{op: target, name, params}`,
  `{op: value, body, data_key}` and `{op: advance, ms}`. The result lists each step's output and
  every HTTP call with its method, URL, namespace header, JSON body and client certificate paths.
  Failures come back as stable tags such as `missing_credentials`, `login_failed` and
  `unsafe_secret_name`, so Python and Rust compare without their message text.
scope:
  paths:
    - crates/betterlite-secret-managers/src/vault.rs
    - crates/betterlite-secret-managers/src/vault/**
    - crates/betterlite-secret-managers/fuzz/fuzz_targets/vault_response.rs
    - crates/betterlite-secret-managers/fuzz/corpus/vault_response/**
    - tools/oracle/cases/helpers/vault-auth/**
    - tools/oracle/fuzz/corpus/helper_case/vault-auth-*
    - tools/oracle/helpers/b4416.py
    - tools/oracle/helpers/b4416/**
    - tools/oracle/src/helpers/secret_managers/b4416.rs
    - tools/oracle/src/helpers/secret_managers/b4416/**
  lint_tables: false
