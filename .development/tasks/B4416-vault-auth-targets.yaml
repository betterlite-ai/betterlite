dod:
  - text: >-
      The settings reader applies every default, counts an empty variable as unset, resolves the
      refresh interval in order, rejects a bad interval by name and refuses a manager with no
      complete credential. AppRole beats TLS and TLS beats the token, and half a pair is ignored.
    proof: [vault-settings-tests, oracle, vault-helper-corpus]
  - text: >-
      AppRole login sends the right URL, body and namespace, reuses the token until its lease ends
      and logs in again after, on both the async and the blocking path. TLS login sends the
      certificate pair and the role, null included, and logs in on every call. Token mode makes no
      HTTP call.
    proof: [vault-auth-tests, oracle, vault-helper-corpus]
  - text: >-
      A login that fails on transport, status, body size or decoding gives a VaultError naming the
      method, and no token, secret id or response body shows up in the error text or in the Debug
      output of the settings or requests.
    proof: [vault-auth-tests, oracle]
  - text: >-
      Secret URLs and targets match LiteLLM for defaults, namespaces, sanitized mounts and prefixes,
      nested and flat settings, null and empty overrides, data keys and unsafe names, and
      X-Vault-Namespace appears only on login requests.
    proof: [vault-target-tests, oracle, vault-helper-corpus]
  - text: >-
      The three decoders match LiteLLM on valid bodies and never panic on arbitrary bytes, and the
      vault_response fuzz target and its fresh corpus replay.
    proof: [vault-response-tests, vault-response-corpus, oracle]
  - text: The independently invoked LiteLLM helper matches the Rust operation and the new helper-case seed replays.
    proof: [oracle, helper-python, vault-helper-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: vault-settings-tests
      why: settings defaults, refresh interval and login method choice fail or are missing
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^vault::(.*::)?settings::tests::/)'
    - id: vault-auth-tests
      why: login requests, token reuse, failures or redaction fail or are missing
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^vault::(.*::)?auth::tests::/)'
    - id: vault-target-tests
      why: URL and secret target resolution fail or are missing
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^vault::(.*::)?target::tests::/)'
    - id: vault-response-tests
      why: login and secret body decoding fail or are missing
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^vault::(.*::)?response::tests::/) - test(replays_the_vault_response_corpus)'
    - id: vault-response-corpus
      why: the raw-byte decoder fuzz target or its fresh replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-secret-managers/fuzz/fuzz_targets/vault_response.rs &&
        grep -q 'name = "vault_response"' crates/betterlite-secret-managers/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-secret-managers/fuzz/corpus/vault_response)" &&
        cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(replays_the_vault_response_corpus)'
    - id: helper-python
      why: the independent LiteLLM helper is missing or fails ruff or basedpyright
      run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4416.py)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: vault-helper-corpus
      why: newly added Vault helper seeds are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/vault-auth-*")" &&
        grep -lE '^[[:space:]]+b4416:' tools/oracle/fuzz/corpus/helper_case/vault-auth-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
