dod:
  - text: Credential saves preserve metadata before vault write, distinguish vault failure from file failure, and stamp past both stores to prevent old-login selection on clock skew.
    proof: [behavior-tests]
  - text: Credential loads resolve split credentials by timestamp, migrate file secrets into the vault on first read, and rejoin matching timestamps across stores.
    proof: [behavior-tests]
  - text: Credential clear succeeds when the vault erases the entry, reports when it is still held, and keeps scrubbed metadata as an unreachable indicator when the keychain is unreachable.
    proof: [behavior-tests]
  - text: API-key getter checks the origin and returns None when the origin differs, preserving secrets across multiple client instances.
    proof: [behavior-tests]
  - text: All credential outcome types (SecretStored, SecretStranded, CredentialNotSaved/NotRecorded/NotCleared and KeyringDisabled/NotInstalled/Unreachable) are tested as typed contracts.
    proof: [behavior-tests]
  - text: The independently invoked MIT helper matches the production operation and oracle helper cases replay.
    proof: [oracle, helper-python, new-oracle-cases]
