id: B4592
title: CLI credential migration, save and logout
description: >-
  Build the credential lifecycle over the vault and file operations, preserving
  ordered side effects and distinct partial-failure results. Resolve split
  credentials by origin and timestamp, migrate plaintext secrets on reads, and
  retain a scrubbed note when logout cannot confirm that the keychain is empty.

  `save_cli_token` returns a typed outcome distinguishing three cases: the secret
  landed in the vault (SecretStored or one of the vault's error outcomes), the
  vault took it but the file could not record it (CredentialNotRecorded, with the
  vault's entry unreachable), or neither took the secret (CredentialNotSaved,
  when even the fallback file failed). The function stages the metadata before
  touching the vault so a directory that refuses it stops the save before the
  keychain is handed anything. Save stamps the incoming credential's timestamp
  just past the highest one either store already holds, so equal timestamps rejoin
  a single login split across both stores, while a clock stepping backwards does
  not select the older of two logins.

  `clear_cli_token` returns a typed outcome indicating whether the keychain
  confirmed it has no entry left (SecretErased), still holds one
  (SecretStranded), or could not be reached (KeyringDisabled/NotInstalled/Unreachable).
  Logout removes the secret from the file in all cases. When the keychain is
  unreachable, the metadata is kept without the secret so a later logout can
  report that state instead of claiming success. When the file rewrite fails but
  the removal succeeds, the scrubbed metadata is written back to preserve the
  unreachable-keychain warning. When the removal also fails after the rewrite
  fails, the file is left untouched and the error is returned.

  `load_cli_token` and `get_litellm_gateway_api_key` resolve secrets on read:
  when the file holds one and the vault has a different one (by timestamp), the
  file's secret is moved into the vault and scrubbed from the file. When both
  hold the same timestamp's material split across stores, the halves are
  rejoined. The API-key getter checks the origin before reading the vault, so
  a client pointed at a different server sees None even if a credential exists.
  Freshness is checked at the six-minute boundary with strict less-than.

  Build the production credential_lifecycle module in betterlite-cli
  using B4590's SecretVault and B4591's file operations. Use a common type for
  credential records and a common secret type with optional key and refresh_token
  fields. Preserve the split metadata/secret storage, fail-safe abort on
  partial failures, and the timestamp ordering semantics including math.nextafter
  for uniqueness. All six CredentialNotSaved/NotRecorded/NotCleared and three
  SecretWrite/Erase outcome types are built and tested as contracts.
