out_of_scope:
  - B4590 owns SecretVault, SecretWrite, SecretErase outcome types and all keyring adapter implementation; this task calls its read/write/erase contract only.
  - B4591 owns CliTokenRecord, CliTokenSecret record models, file JSON decoders (CliTokenRecord.model_validate_json), file writers, private_json staging/commit operations and is_cli_token_fresh; this task calls those as contracts and does not reimplement them.
  - B192 owns ensure_private_dir, stage_private_json, commit_staged_json, overwrite_private_json, write_private_json in betterlite-logging::private_json; this task calls those contracts.
  - litellm/proxy/client/cli/commands/auth.py:203-215 (load_token/save_token wrapper) and logout caller (line 988) belong to B134; this task provides the lower API only.
  - litellm/setup_wizard.py functions belong to B135 and B4594; this task is not called by the wizard.
pitfalls:
  - Save stages the metadata file before writing the vault so a directory refusing the stage stops the operation before the keychain is touched; reversing this order risks exposing secrets when the file fails but the vault succeeds.
  - Stamping past the highest existing timestamp (including negative infinity for missing entries) requires math.nextafter to ensure unique ordering even when the clock steps backwards.
  - Migration is only for newly inserted vault entries (ones this migration put there); an already-existing vault entry is left alone even if its secret halves the file's material.
  - Clear keeps the scrubbed metadata file when the keychain is unreachable so a later logout can report that state; removing it early would turn a genuine warning into a false success.
  - Resolving split credentials rejoins halves only when both hold the same timestamp; two different timestamps are two separate logins and must never be combined.
  - The API-key getter checks the origin before touching the vault to prevent credential leakage when the client is pointed at a different server.
