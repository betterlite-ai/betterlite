  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/management_endpoints/management_v1.py#L12-L20
    why: B1665 ProblemDetail fields; these routes construct this response rather than an OpenAI error envelope.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: bulk_create_mixed, bulk_delete_mixed,
      unknown_body_422, unknown_delete_query, create_ignores_unknown_query, no_db_problem_503,
      non_admin_route_denied, management_problem_passthrough, create_driver_problem_500,
      delete_driver_problem_500, inner_http_error_becomes_problem, changed_by_forwarded,
      default_no_key, five_hundred_boundary, prefixed_routes_only.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bulk_user_routes::tests::/)
        - test(/replays_the_/)'
