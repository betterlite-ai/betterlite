id: B1222
title: Bulk user management HTTP routes
description: >-
  Register POST /management/v1/users/bulk and /management/v1/users/bulk_delete over B793/B794. Preserve
  the 500-row limit, per-row result indexing, unknown-body-field 422 rejection, unknown-query rejection
  on delete, and application/problem+json errors (503 without a DB, 500 driver failure). B793 owns the
  license-seat policy, including the approved removal of quotas; this route only passes its collaborator.
  B865 management_endpoint_wrapper supplies ordered completion effects.

  Both handlers check DB inside try. Missing DB raises ManagementProblem with type
  urn:litellm:error:database-not-connected, title Database not connected and status 503. ManagementProblem
  from the helper passes through unchanged. Any other Exception, including HTTPException/ProxyException
  raised INSIDE the handler, logs a route-specific exception and becomes a 500 problem with type
  urn:litellm:error:internal-server-error, title Internal server error, and creation/deletion-specific
  detail. Failures in FastAPI dependencies/validation occur outside that catch. These are RFC 9457
  documents, not error.type/param/code envelopes; preserve type/title/status and field presence, with
  betterlite's own detail wording.

  Create passes data.users, auth, DB, license collaborator, litellm_proxy_admin_name and cache to B793
  and returns BulkNewUserResponse unchanged, including ordered data and meta totals. B793 owns
  auto_create_key=false, the unsupported send_invite_email field, row validation and partial team joins.
  Delete passes the entire typed request plus cache/logging/admin-name and litellm-changed-by (None by
  default) to B794, then wraps its ordered results in BulkDeleteUsersResponse(data=results). B007's
  reject_unknown_query_params is installed ONLY on delete: any undeclared query name gives a 400
  urn:litellm:error:unknown-query-parameter problem with sorted names and allowed=[]. Create ignores
  undeclared query parameters. Body/schema limits and per-row permissions stay in the named dependencies.


  Build the production bulk_user_routes module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/management_v1/users.py:
  bulk_create_users_route (L28-L108; 74 source lines), bulk_delete_users_action (L111-L187; 72 source
  lines).


  Register POST /management/v1/users/bulk and POST /management/v1/users/bulk_delete once. The /users/*
  decorator strings are relative to MANAGEMENT_V1_PREFIX, not additional aliases. B001 HTTP cases compare
  JSON successes and application/problem+json failures plus B860 row effects, using POSTGRES_TEST_URL
  or testcontainers. The changed-by header affects deletion audit attribution only.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 146 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  146 production, 220 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 431 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
  paths:
    - crates/betterlite-server/src/bulk_user_routes.rs
    - crates/betterlite-server/src/bulk_user_routes/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/bulk-user-routes/**
    - tools/oracle/helpers/b1222.py
    - tools/oracle/helpers/b1222/**
    - tools/oracle/src/helpers/server/b1222.rs
    - tools/oracle/src/helpers/server/b1222/**
  lint_tables: false
