deviations: []
out_of_scope:
  - B007 owns ManagementProblem, problem_response and reject_unknown_query_params; B1665 owns ProblemDetail and MANAGEMENT_V1_PREFIX; B067 composes this router and is never a dependency.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - A helper's non-ManagementProblem exception becomes 500 even when it carries a 4xx status; dependency authentication failures occur before that catch.
  - Adding the router's relative /users/bulk path as a public alias would expose a route absent from LiteLLM.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
