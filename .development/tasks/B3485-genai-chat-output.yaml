id: B3485
title: Translate chat replies and tool deltas to GenAI
description: >-
  Build the output adapter in crates/betterlite-core::api, translating OpenAI chat completion
  responses and streaming chunks into Google GenAI generate_content format. Map the first choice's
  finish reason and usage into native candidates, and accumulate streaming tool call arguments by
  tool-call index until JSON and a name are both available. Emit the SSE-wrapped async streaming
  iterator that is actually returned by the handler, preserving direct upstream chunk iteration
  without the unused wrapper iterator's EOF flush accumulation.

  The adapter receives either a non-streaming ModelResponse (with choices, usage) or streaming
  ModelResponseStream chunks (with choices, delta) from the completion pipeline. For non-streaming
  responses, it transforms the first choice's message, finish reason and usage into a Google GenAI
  candidates list with content parts, finishReason and usageMetadata. For streaming, it transforms
  each chunk's delta into GenAI parts and accumulates incomplete tool call arguments across chunks
  by tool-call index until both function name and parsed arguments are available, then emits the
  completed function call part. Finish reason strings (stop, length, content_filter, tool_calls, function_call)
  map to Google GenAI reasons (STOP, MAX_TOKENS, SAFETY, STOP, STOP). Usage fields (prompt_tokens,
  completion_tokens, total_tokens) map directly to usageMetadata (promptTokenCount, candidatesTokenCount,
  totalTokenCount). The streaming output is an async iterator of bytes with SSE framing: each
  GenAI object is wrapped as "data: <json>\n\n", and the streaming state (wrapper initialization,
  accumulated tool calls, returned-response flag) is owned here, not in a separate Python object
  wrapper that does not run in production.

  Owned implementation:
  - _ToolCallAccumulator, _GenAIFunctionCall and _GenAIPart TypedDict definitions for streaming
    tool call state and GenAI response structure.
  - GoogleGenAIStreamWrapper __init__ initializing sent_first_chunk flag and accumulated_tool_calls
    dict, both used only by the streaming output path.
  - async_google_genai_sse_wrapper async iterator that yields bytes with SSE "data: " framing.
  - translate_completion_output_params_streaming entry point returning the SSE-wrapped async
    iterator, not a Python object wrapper.
  - translate_completion_to_generate_content non-streaming response transformation, mapping first
    choice message to parts, finish reason and usage to native output format.
  - translate_streaming_completion_to_generate_content streaming chunk transformation, calling
    delta-to-parts with accumulation and emitting GenAI objects only when parts exist or a
    finish reason arrives.
  - _transform_openai_message_to_google_genai_parts extracting text and tool_calls from a
    complete message into GenAI parts.
  - _transform_openai_delta_to_google_genai_parts_with_accumulation extracting text and tool call
    deltas from a chunk delta, accumulating function name and arguments strings by index until
    both are available and JSON parses, then emitting and removing the completed call from the
    accumulator.
  - _map_finish_reason mapping OpenAI reasons to Google GenAI reasons.
  - _map_usage mapping OpenAI usage counts to Google GenAI metadata.

  Reuse B3484's adapter constructor and _EMPTY_STR_MAPPING constant; use it without introducing
  a reverse request-to-output dependency. Base AdapterCompletionStreamWrapper.__init__ supplies
  the stream state: native state initialization (sent_first_chunk, accumulated_tool_calls)
  belongs here, not in a new dependency on Python object wrappers.

  Fuzz accumulated argument-string decoding: malformed JSON in tool call arguments, incomplete
  escape sequences, and completely invalid JSON all eventually surface as non-accumulated when
  JSON parsing fails and the parts are not emitted until a later chunk brings name and valid JSON.
  Test malformed whole-response arguments becoming empty dicts, missing names defaulting to
  undefined_tool_name, and empty arguments strings becoming empty objects when JSON-decoded as
  "{}".

