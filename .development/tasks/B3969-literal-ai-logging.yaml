id: B3969
title: Literal AI step projection and GraphQL batches
description: >-
  Build Literal AI steps and GraphQL query/variable generation, including literal
  prompt attributes and thread/parent/root links. Implement all four success/failure
  callbacks with distinct sync and async flushing behavior: sync _send_batch does
  not clear the queue after posting, while async callbacks trigger flush_queue which
  drains it on success or error.

  Initialize with LITERAL_API_URL (default https://cloud.getliteral.ai), LITERAL_API_KEY
  from environment or constructor parameter, LITERAL_BATCH_SIZE parsed as integer (no
  default), and sync/async HTTP clients from B173. Build step records from standard_logging_payload,
  extracting model_parameters, messages, response and metadata from both clean_metadata
  and litellm_params. Pop tools from settings; preserve message.__literal_prompt__
  attributes for prompt_id/variables injection.

  Generate GraphQL mutation with variable placeholders ($id_0, $threadId_0, ...) and
  ingestStep calls per step, filtering only non-None values into the variables dict.
  Build step record with literalai_thread_id, literalai_parent_id, and literalai_root_run_id
  from metadata, mapping to threadId, parentId and rootRunId respectively, computing
  duration as (end_time - start_time).total_seconds(). Apply tag precedence: tags
  metadata key before literalai_tags key. Preserve x-client-name: litellm header
  and error/success logging on response status.

