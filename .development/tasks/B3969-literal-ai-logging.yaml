deviations:
  - what: x-env header is conditionally added when env parameter is passed to __init__, but no environment variable lookup is specified for this header.
    why: LiteLLM accepts an env parameter in the constructor and may populate the header; betterlite needs explicit configuration of what value to use.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/literal_ai.py#L34-L35

out_of_scope: []

pitfalls:
  - _send_batch does not clear the queue after sending; the base CustomBatchLogger does not auto-drain sync sends, so callers retry on queue overflow.
  - async_send_batch clears the async queue through inherited flush_queue on success or error, while _send_batch does not.
  - GraphQL variables are filtered to non-None values only, avoiding empty/null argument transmission.
  - Literal prompt attributes (prompt_id, variables, uuid) are mutated onto message dicts during _prepare_log_data, not returned separately.
  - Tag precedence reads metadata['tags'] before metadata['literalai_tags']; both keys may be absent.
  - Duration is computed as (end_time - start_time).total_seconds(), a float that should preserve microsecond precision from the timedelta.
  - "x-client-name header is literal \"litellm\", not a placeholder or derived value."

