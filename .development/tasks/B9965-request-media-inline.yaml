id: B9965
title: Inline Vertex and AI Studio request media before conversion
description: >-
  Both Gemini entries refuse request media today. transform_request_body_async in
  crates/betterlite-vertex/src/gemini_request/orchestration/async_media.rs calls reject_inlined_media,
  and transform_request_body never fetches either, so an http:// reference, an https:// reference with
  no explicit or inferable MIME, and a file_id URL all end in gemini_media::process::payload_for's
  MediaError::RemoteMediaRequired, a 400 with code unsupported_remote_media. LiteLLM downloads them:
  async_transform_request_body pre-inlines through async_inline_remote_media with _ai_studio_inlines
  for gemini and _vertex_inlines otherwise (transformation.py L1371-L1373) and then converts, while the
  synchronous path downloads inside _process_gemini_media through convert_to_anthropic_image_obj
  (L574-L582). The decision (B1311's inlines_remote), the fetcher (B5083 through B183's
  RemoteMediaFetcher) and the download policy already exist. Remove the refusal and add the missing
  fetch.


  Add crates/betterlite-vertex/src/gemini_request/media_prepare.rs (the skeleton creates the file and
  declares `pub mod media_prepare;` in gemini_request.rs) with two public items. prepare(messages,
  provider, fetcher, mode) returns the messages with remote media replaced by fetched data URLs, using
  betterlite_prompts::media::inline::{inline_remote_media, async_inline_remote_media} with a predicate
  built from gemini_media::policy::inlines_remote and the part's format, mime_type and content_type
  fields, exactly as reject_inlined_media builds them today. FetchMode::Sequential uses the
  one-at-a-time function and FetchMode::Concurrent the batch one. The error type is
  betterlite_prompts::media::error::MediaError, already the Inline variant of RequestError, so a
  refused URL fails the request before any body is built. Then walk every message's
  provider_specific_fields.images list and inline an entry whose image_url object carries an http or
  https url that inlines_remote accepts. LiteLLM routes assistant images through _process_gemini_media
  for both providers, so this pass always uses GoogleProvider::Vertex: an https url with an image
  extension stays a file_data reference even on Studio, while an http url or an extensionless https url
  is fetched. Rewrite image_url.url with the data URL and keep its other keys. A bare-string image_url
  is skipped because LiteLLM skips it too. Count distinct urls against
  betterlite_prompts::media::limits::MAX_REMOTE_URLS and refuse more with
  MediaError::TooManyRemoteUrls. Fetch with convert_url in Sequential mode and with convert_urls in
  Concurrent mode.


  Move the cache strip, check_and_create_cache, restore and body build into one pub(crate) async fn
  transformed in orchestration.rs that takes a FetchMode, calls prepare on outcome.messages and passes
  the prepared slice to body_from. transform_request_body calls it with Sequential and
  transform_request_body_async with Concurrent; async_media.rs keeps its public signature and
  delegates, and reject_inlined_media disappears with its imports. body_from takes the prepared
  messages as a slice. In studio_chat.rs delete the input::reject_remote_media call, delete
  studio_chat/input.rs and its mod line; Studio's fetch now happens in the shared prepare with
  GoogleProvider::AiStudio, and a part that arrives unprepared still fails in process_media, so
  conversion keeps a last-resort refusal instead of performing I/O. Write the tests first with a
  map-backed fetcher and a refusing one; every one of them fails on main because main never calls the
  fetcher. Put them in gemini_request/tests.rs under names starting media_: download, https with a MIME
  passthrough, http with an extension downloaded, Studio https with an extension downloaded, Files API
  URI not fetched, data URL not fetched, assistant image downloaded, Studio assistant image with an
  extension not fetched, refused fetch fails once with RequestError::Inline and builds no body, and
  sequential fetch order. Replace the two existing inline_policy tests with these.


  Replace the fetch clause of docs/deviations/B1311.yaml row 1 so it lists only the extensionless
  gs:// case and points at the GCS probe B9961 builds. Delete row 1 of docs/deviations/B1321.yaml and
  row 1 of docs/deviations/B1325.yaml. Add docs/deviations/B9965.yaml with two rows. First: the
  synchronous entry fetches every selected url before converting any part, and assistant images are
  fetched after all content parts, where LiteLLM's synchronous path downloads each url while converting
  its part and stops at the first conversion failure. Second: a Studio file part whose download fails
  fails the request, where LiteLLM's synchronous Studio prepass swallows the failure and its walker can
  still forward an https url with an image extension as file_data. Compare the whole body after prepare
  through helper b9965: patch image_handling's convert functions and
  factory.convert_url_to_base64 with a url map, run async_inline_remote_media or inline_remote_media
  with _ai_studio_inlines or _vertex_inlines, then _transform_request_body with
  _get_gcs_object_content_type patched to raise. The owned LiteLLM lines are about 90. The production
  diff is about 300 lines, the adapters about 220 and the cases and seeds about 130.
