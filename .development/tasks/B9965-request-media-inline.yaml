    why: The synchronous download branch inside per-part media processing.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/transformation.py#L946-L971
    why: Assistant images route through per-part processing for both providers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/image_handling.py#L306-L334
    why: The seam's distinct-url traversal and its inline rewrites.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/chat/transformation.py#L113-L173
    why: Studio's own prepass that this task replaces with the shared fetch.
dod:
  - text: Vertex requests download http and extensionless https media into inline_data in both entries.
    proof: [media-tests, oracle, media-python]
  - text: Studio requests download remote media instead of refusing it.
    proof: [media-tests, oracle, media-python]
  - text: A refusing fetcher fails the request once with RequestError::Inline and builds no body.
    proof: [media-tests]
  - text: Assistant images without an image extension are fetched for both providers, and ones with an extension stay file_data.
    proof: [media-tests, oracle]
  - text: The three old deviation rows are gone and docs/deviations/B9965.yaml records the two remaining differences.
    proof: [deviation-rows]
  - text: The new helper seeds decode under call.b9965.
    proof: [media-prepare-seed]
checks:
  optional: []
  commands:
    - id: media-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_request::tests::media_/)'
      why: Both entries must fetch through the injected fetcher and keep passthrough references unfetched.
    - id: studio-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^studio_chat::tests::/)'
      why: Studio conversion must still refuse an unprepared remote part without performing I/O.
    - id: media-python
      run: test -f tools/oracle/helpers/b9965.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: The comparison must call the pinned inline and transform functions with network access replaced by a map.
    - id: media-prepare-seed
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/b9965*')" && cargo nextest run --locked -p betterlite-oracle-vertex --no-tests=fail -E 'test(/^b9965::/)'
      why: New helper seeds must parse the production operation tag and input type.
    - id: deviation-rows
      run: test -f docs/deviations/B9965.yaml && test -z "$(grep -F 'L1373-L1396' docs/deviations/B1321.yaml)" && test -z "$(grep -F 'L113-L173' docs/deviations/B1325.yaml)" && grep -q -F 'gemini/chat/transformation.py#L154-L167' docs/deviations/B9965.yaml
      why: The fixed no-fetch rows must be gone and the Studio fallback difference recorded with its pinned line.
oracle_cases:
  - tools/oracle/cases/helpers/gemini-media-prepare/vertex-download.yaml
  - tools/oracle/cases/helpers/gemini-media-prepare/vertex-https-passthrough.yaml
  - tools/oracle/cases/helpers/gemini-media-prepare/vertex-http-download.yaml
  - tools/oracle/cases/helpers/gemini-media-prepare/studio-download.yaml
  - tools/oracle/cases/helpers/gemini-media-prepare/files-api-passthrough.yaml
  - tools/oracle/cases/helpers/gemini-media-prepare/assistant-image.yaml
  - tools/oracle/cases/helpers/gemini-media-prepare/studio-assistant-image.yaml
  - tools/oracle/cases/helpers/gemini-media-prepare/refused-fetch.yaml
deviations:
  - what: The synchronous entry fetches every selected media url before converting any message part, and assistant images are fetched after all content parts; LiteLLM's synchronous path downloads each url while converting its part and stops at the first conversion failure.
    why: betterlite prepares messages before the shared body build so the conversion code never performs I/O; the asynchronous entry fetches in the same order LiteLLM's async pre-inline does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/transformation.py#L1149-L1194
  - what: A Studio file part whose remote download fails fails the request with 400, where LiteLLM's synchronous Studio prepass swallows the failed file fetch and its walker can still forward an https url with an image extension as file_data.
    why: A failed fetch is treated as final so no request continues with a uri the caller asked the gateway to inline.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/chat/transformation.py#L154-L167
out_of_scope:
  - The cache-prefix conversion in crates/betterlite-vertex/src/cache_prefix/transform.rs (B1317) also converts cached messages through the same fetcher and still refuses an http or extensionless https reference in an implicitly cached prefix.
  - The Google token counter's history conversion in crates/betterlite-vertex/src/google_token_counter/vertex.rs does not run this pass; its media policy belongs to B197.
  - Tool-result media stays with betterlite_prompts::gemini_tool_results (B1128) and already fetches through the same seam.
  - Constructing B5083's Fetcher for the gateway route is B1316 and B1327 wiring, recorded in this task's notes for the architect.
  - The extensionless gs:// reference is B9961.
pitfalls:
  - crates/betterlite-vertex/src/gemini_call/tests/ordered_effects.rs ordered_effects_remote_tool_media_follows_the_branch_transform asserts that the async branch refuses remote tool media with zero fetches. Once prepare fetches it, update that case to the fetched outcome and its fetch count; change nothing else in the file.
  - The oracle helper for this task is pre-registered as b9965 in the vertex group. Replace the stub Op in tools/oracle/src/helpers/vertex/b9965.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/b9965.py. The registry files (tools/oracle/src/helpers/vertex/lib.rs and tools/oracle/helpers/dispatch.py) are not this task's to edit.
  - The predicate reads RemoteMedia.fields, which is the image_url object for an image part and the file object for a file part; reading format from the wrong object turns a passthrough into a download.
  - Assistant images always follow the Vertex predicate, even for gemini, because LiteLLM handles them inside _process_gemini_media and not in the Studio prepass.
  - The seam writes a bare-string image_url back as a data URL string; keep that shape and do not turn it into an object.
  - Only http and https are remote; a data URL or Files API uri must never reach the fetcher.
  - The sync entry must call inline_remote_media and the async entry async_inline_remote_media, so a refusing fetcher shows one convert_url call in the sync test and one convert_urls call in the async test.
  - The test fetcher must record convert_urls as well as convert_url; the old CountingFetch only counted and errored.
  - The two entries must not fetch twice. prepare runs once per request, after the cache stage, and body_from receives its result.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 1}
