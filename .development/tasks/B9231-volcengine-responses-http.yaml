    why: Existing parameter whitelist, credential/base precedence and request construction under test.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/volcengine/responses/transformation.py#L206-L264
    why: Streaming repair and non-streaming response conversion reached through the public route.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/volcengine/responses/transformation.py#L269-L414
    why: Get/delete/input-items/cancel URL and reply policies, including listing defaults and native streaming.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/volcengine/responses/transformation.py#L417-L547
    why: Required-field repair and false native-WebSocket capability remain implemented by B8176.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L194-L216
    why: Three authenticated POST creation aliases, starting at their decorators.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L677-L705
    why: Existing GET aliases used after capturing the response id.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L793-L821
    why: DELETE decorators for each lifecycle flow.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L902-L970
    why: Input-item route aliases and body forwarding; arbitrary URL query controls are not copied here.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L1201-L1224
    why: Cancellation's three POST decorators; no additional mount belongs to this task.
dod:
  - text: Volcengine creation filters the outgoing request and resolves configured versus environment endpoints and keys as the pinned implementation does.
    proof: [volcengine-http-fixtures, oracle]
  - text: A native sparse event stream survives the production Responses route with provider-filled integers and lists preserved in the comparison.
    proof: [volcengine-http-fixtures, oracle]
  - text: Each route prefix supports create, retrieve, list inputs, cancel and delete using the id returned by that proxy, including body-versus-query listing controls.
    proof: [volcengine-http-fixtures, oracle]
  - text: Missing credentials and upstream rejection keep the source status, error type, param and code.
    proof: [volcengine-http-fixtures, oracle]
checks:
  optional: []
  commands:
    - id: volcengine-http-fixtures
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/volcengine-responses)"
        && for case in create-filter env-base-order configured-base missing-key upstream-error sparse-stream
        v1-lifecycle bare-lifecycle openai-lifecycle; do
        test -f "tools/oracle/cases/providers/volcengine-responses/$case.yaml" || exit 1; done
      why: A missing lifecycle flow or request-policy fixture must fail even before parity execution.
oracle_cases:
  - tools/oracle/cases/providers/volcengine-responses/create-filter.yaml
  - tools/oracle/cases/providers/volcengine-responses/env-base-order.yaml
  - tools/oracle/cases/providers/volcengine-responses/configured-base.yaml
  - tools/oracle/cases/providers/volcengine-responses/missing-key.yaml
  - tools/oracle/cases/providers/volcengine-responses/upstream-error.yaml
  - tools/oracle/cases/providers/volcengine-responses/sparse-stream.yaml
  - tools/oracle/cases/providers/volcengine-responses/v1-lifecycle.yaml
  - tools/oracle/cases/providers/volcengine-responses/bare-lifecycle.yaml
  - tools/oracle/cases/providers/volcengine-responses/openai-lifecycle.yaml
deviations: []
out_of_scope:
  - B8176 owns every function in volcengine/responses/transformation.py, including its protocol declarations and private reflection helpers; B8175 owns the shared Volcengine error and base/header functions.
  - B8312 constructs the selected configuration; B5360 selects its tag. This task adds no alternative selector or key resolver.
  - B080 and B938 own all cited endpoint functions and their decorators; B8610/B1100 compose existing route factories and B8636 connects the production stream generator.
  - B506-B509 supply inherited OpenAI Responses transforms. Polling, compact, input_tokens and WebSocket routes are their existing API-family owners' work and do not add a Volcengine override here.
pitfalls:
  - A provider response id is wrapped by the proxy; reuse the captured client id instead of assuming resp_regional can be sent straight to every lifecycle route.
  - VOLCENGINE_API_BASE precedes ARK_API_BASE, but ARK_API_KEY precedes VOLCENGINE_API_KEY.
  - Input listing reads pagination from the GET body; putting limit=2 only in the URL must not turn the default upstream limit into 2.
  - Missing enum discriminators are not repaired into valid values; sparse fixtures omit fields the source can actually default.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
