id: B922
title: Queue tool events for chat-backed Responses streams
description: >-
  Build api::chat_response_stream_tools with the complete stream-state constructor and
  tool/web-search queue methods through L439, plus the three leading item/thinking helpers.
  B907 supplies custom-tool serialization and B913 namespace lookup. Represent shared
  state as a native record consumed by B923/B924; do not import the later stream driver
  merely to mirror Python inheritance. B004/B005 supply chat chunks and wrapper context,
  B902/B1113/B1138 the output/event records. All work here transforms decoded records;
  B924 alone pulls provider chunks.

  B171's chat_response_stream_tools compares queue contents, indices, sequence numbers
  and state changes after scripted operations. Include custom tools as well as ordinary
  calls; their item type changes but this source still emits function argument event types.
  The owned range contains 332 nonblank/non-comment lines. Reserve 315 implementation,
  180 tests, 120 fixtures, 90 adapters and 25 wiring lines: 730 changed lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/chat_response_stream_tools.rs
  - crates/betterlite-core/src/api/chat_response_stream_tools/**
  - tools/oracle/src/helpers/core_ops/chat_response_stream_tools.rs
  - tools/oracle/src/helpers/core_ops/chat_response_stream_tools/**
  - tools/oracle/helpers/chat_response_stream_tools.py
  - tools/oracle/helpers/chat_response_stream_tools/**
  - tools/oracle/fuzz/corpus/helper_case/chat_response_stream_tools-*
  - tools/oracle/cases/helpers/chat-response-stream-tools/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/streaming_iterator.py#L56-L439
  why: Whole state construction, call correlation, ten-character argument chunks, final-call repair and web-search events.
dod:
- text: >-
    stream_state_defaults starts finished and every sent/primed/exhausted/reasoning flag
    false,sequence=0,message_output_index=0,next_tool_output_index=1,all queues/maps empty,
    cached IDs/buffer/model/completed_response null,final_text/reasoning_summary_text="".
    Null metadata becomes {} and logging context comes from the wrapper. Custom names
    and namespace maps come from request.tools. First assign for call c returns 1, repeat c
    stays 1, then d gets 2. Item-ID replacement copies only the first typed matching item;
    dictionaries do not match getattr(type), null replacement ID leaves all items unchanged.
    A dict thinking block with truthy signature OR data counts as signed regardless of type.
  proof: [tool-stream-tests, oracle, tool-stream-adapter]
- text: >-
    call_index_correlation converts index " +2 " to 2,true to 1,2.9 to 2 and preserves
    negative integers; null/invalid values yield no index. Explicit truthy IDs are stringified
    and remembered by index. An ID-less delta reuses that ID until two different explicit
    IDs use the same index, after which ID-less deltas at that index are dropped forever.
    Explicit IDs still work at an ambiguous index; missing index and ID yields "" and no event.
  proof: [tool-stream-tests, oracle, tool-stream-adapter]
- text: >-
    tool_delta_queue receives call c,function f,arguments="12345678901" at fresh state.
    Emit output_item.added at output_index=1,sequence=1,status=in_progress,arguments="",
    then function_call_arguments.delta values "1234567890","1" at sequences 2,3 using
    the same B907 item ID. Subsequent deltas append without another added item. Non-list
    tool_calls,unknown IDs and web-search IDs emit nothing. Missing function name/arguments
    normalize to ""; nonstring arguments use B907 serialization. Namespace f is restored
    only for ordinary function calls; custom calls retain their custom name/input shape.
  proof: [tool-stream-tests, oracle, tool-stream-adapter]
- text: >-
    final_tool_completion emits missing added/delta events before arguments.done and
    output_item.done status=completed, reusing the first emitted item ID. Final arguments
    prefer a nonempty completion payload over accumulated deltas; otherwise use accumulation.
    Already-streamed length is sliced without checking a common prefix, so streamed "ab"
    plus final "XYZ" emits remaining "Z" and done arguments="XYZ". Empty final arguments
    still emit done events. Missing first choice/non-list/empty tools is ignored, and the
    final-queued flag is set even on that empty attempt; a second call never queues more.
  proof: [tool-stream-tests, oracle, tool-stream-adapter]
- text: >-
    hosted_search_reservation accepts web_search_calls as dict values or a list and strips
    one ws_ prefix from each item ID. Reserve the same output index as its tool call and
    retain the latest item. An in_progress item removes already-pending tool events at that
    index, but other statuses do not. During final calls, a known search emits exactly once
    output_item.added with action=null,status=in_progress,then web_search_call.in_progress,
    web_search_call.searching,web_search_call.completed,then output_item.done carrying the
    final item's original status/action. Sequences increase on all five events. Invalid
    web-search records propagate validation errors; missing/empty IDs do not reserve a slot.
  proof: [tool-stream-tests, oracle, tool-stream-adapter]
- text: >-
    reasoning_end_boundary returns false for no choices,truthy reasoning_content or any
    truthy thinking_blocks. Otherwise truthy text,function_call,tool_calls or any nonnull
    finish_reason ends reasoning, including finish_reason=""; empty text alone does not.
    Only the first choice participates. This predicate does not synthesize done events;
    B924 applies it only on the async path, matching the pin.
  proof: [tool-stream-tests, oracle, tool-stream-adapter]
checks:
  optional: []
  commands:
  - id: tool-stream-tests
    why: tool indices, argument slicing or hosted-search queue replacement differs
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_tools::/)'
  - id: tool-stream-adapter
    why: queue effects are not checked against the pinned implementation
    run: test -f tools/oracle/helpers/chat_response_stream_tools.py && grep -qE '^[[:space:]]+chat_response_stream_tools:' tools/oracle/fuzz/corpus/helper_case/chat_response_stream_tools-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/chat-response-stream-tools/stream-state-defaults.yaml
- tools/oracle/cases/helpers/chat-response-stream-tools/call-index-correlation.yaml
- tools/oracle/cases/helpers/chat-response-stream-tools/tool-delta-queue.yaml
- tools/oracle/cases/helpers/chat-response-stream-tools/final-tool-completion.yaml
- tools/oracle/cases/helpers/chat-response-stream-tools/hosted-search-reservation.yaml
- tools/oracle/cases/helpers/chat-response-stream-tools/reasoning-end-boundary.yaml
deviations: []
out_of_scope:
- B923 owns pure item/event construction and chunk assembly at L487-L898; B924 owns priming L441-L485 and all methods L900-L1291.
- B907 owns custom argument decoding/item shape; B913 owns namespace collision and qualification rules.
- Network reads, end-of-stream scheduling and cancellation belong to B924's SDK HTTP cases.
pitfalls:
- 'The oracle helper for this task is pre-registered as chat_response_stream_tools in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/chat_response_stream_tools.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/chat_response_stream_tools.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Ambiguous numeric tool indices stay ambiguous even after later explicit IDs.
- Remaining arguments are sliced by prior length without validating their prefix.
- Hosted search emits a completed event even when its final item retains another status.
review_level: standard
budget:
  max_changed_lines: 730
  max_new_expects: 1
