  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_tools::/)
      - test(/::replays_corpus$/)'
  - id: case-parallel-tool-output-indices
    why: the parallel-tool-output-indices behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_tools::tests::parallel_tool_output_indices($|::)/)'
  - id: case-tool-arguments-delta
