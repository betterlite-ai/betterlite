id: B922
title: Chat response stream tools
description: >-
  Build the tool-event half of chat-to-Responses streaming: allocate output indexes, namespace fields, reserve web-search
  indexes and emit tool delta/done events. Keep accumulated arguments and provider IDs in per-stream typed state
  and never share indexes between streams.


  Implement crates/betterlite-core/src/api/chat_response_stream_tools.rs. Use ChatResponseStreamToolInput and ChatResponseStreamToolResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions parallel_tool_output_indices, tool_arguments_delta, web_search_event_order,
  signed_thinking_boundary, namespace_call_fields under api::chat_response_stream_tools::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ChatResponseStreamTools in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {chat_response_stream_tools: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/streaming_iterator.py: _index_of_output_item_type
  (L56-L60); litellm/responses/litellm_completion_transformation/streaming_iterator.py: _output_items_with_id (L63-L73);
  litellm/responses/litellm_completion_transformation/streaming_iterator.py: _delta_has_signed_thinking_block (L76-L78);
  litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.__init__
  (L86-L149); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._get_or_assign_tool_output_index
  (L151-L158); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._normalize_tool_call_index
  (L160-L167); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._responses_namespace_tool_call_fields
  (L169-L174); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._tool_call_item_kwargs
  (L176-L182); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._is_reasoning_end
  (L184-L195); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._reserve_web_search_indexes
  (L197-L217); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._tool_call_id
  (L219-L232); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._queue_tool_call_delta_events
  (L234-L296); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._queue_final_tool_call_done_events
  (L298-L396); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._queue_web_search_events
  (L398-L439). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 318 owned nonblank/non-comment/non-docstring Python lines (332 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 338 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 588 total within the 590-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B912 (Responses
  tool results), B913 (Responses tool namespaces), B1087 (Api boundaries), B907 (Responses codex tools). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.
