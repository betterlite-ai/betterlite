deviations:
- what: >-
    When neither a proxy-provided Anthropic credential nor a caller-provided
    Anthropic credential (x-api-key or Authorization) is present,
    _upstream_headers_for_anthropic_route raises HTTPException with status 401
    and a descriptive message naming the expected header or environment variable.
  why: >-
    LiteLLM raises an HTTPException in this case to prevent forwarding requests
    with no authentication credential to Anthropic. betterlite preserves this
    behavior exactly.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L2581-L2589
- what: >-
    When neither a proxy-provided Vertex credential nor a caller-provided Vertex
    credential (authorization or x-goog-api-key) is present,
    _forwarded_headers_for_credentialless_vertex_passthrough raises HTTPException
    with status 401 and a descriptive message.
  why: >-
    LiteLLM requires explicit Vertex credentials on the credentialless branch.
    betterlite preserves this behavior to prevent unauthenticated provider calls.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L2569-L2578
- what: >-
    Custom caller-key header names are read from both general_settings.litellm_key_header_name
    (single override) and individual pass-through endpoint configurations (per-endpoint list).
    Both are included in the set of headers to filter out.
  why: >-
    LiteLLM allows operators to configure custom authentication headers at the
    global and per-endpoint level. betterlite supports both to preserve configuration flexibility.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L2499-L2516
out_of_scope:
- >-
  The UserAPIKeyAuth._safe_hash_litellm_api_key method is owned by B770; this task
  calls it for constant-time comparison of stored keys, relying on its implementation.
- >-
  The JWTHandler.get_unverified_claims method and LITELLM_INTERNAL_CLAIMS constant
  are owned by B760; this task uses them for JWT validation without implementing them.
- >-
  The _get_bearer_token and is_no_auth_dev_mode functions are owned by B756;
  this task calls them for credential normalization and no-auth mode detection.
- >-
  The _safe_get_request_headers function is owned by B1100; this task calls it
  to read incoming headers with safe fallback.
- >-
  The SpecialHeaders.litellm_credential_header_names method is owned by a D-gap
  task; this task uses its return value for header filtering sets.
pitfalls:
- >-
  Constant-time comparison must use hmac.compare_digest or equivalent, not ==,
  when comparing sensitive values like keys and JWT tokens to prevent timing attacks.
- >-
  Header names are case-insensitive; all header-name lookups and filtering must
  use .lower() on both the incoming header names and the filter sets.
- >-
  The _normalize_credential_value function must not strip the scheme if _get_bearer_token
  returns empty string; the fallback to the original value is intentional to preserve
  bare tokens and Google credentials that carry no scheme prefix.
- >-
  The _is_authenticated_caller_jwt function must use get_unverified_claims from B760
  to extract claims without validation, matching the JWT that was stored during authentication.
- >-
  The Bedrock signed-headers filtering must exclude header names that match
  signed_headers dict keys exactly; all other caller headers pass through unchanged.
- >-
  The _operator_configured_caller_key_header_names function must preserve deduplication
  order and return a tuple, not a list, to match LiteLLM's contract.
- >-
  The 401 error messages for missing Vertex and Anthropic credentials must match
  LiteLLM exactly, including capitalization and grammar, since clients may parse them.
- >-
  The no-auth dev mode fallback in _is_authenticated_caller_secret must check
  both master_key and user_custom_auth; only when both indicate no auth is enabled
  should the function return false for all values.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
