dod:
- text: >-
    get_litellm_virtual_key returns the x-litellm-api-key header with Bearer
    prefix if present, else the Authorization header, else empty string.
  proof: [virtual-key-cases]
- text: >-
    _normalize_credential_value strips Bearer/Basic/AWS4-HMAC-SHA256 prefixes
    using _get_bearer_token, returns original value as fallback.
  proof: [normalize-cases]
- text: >-
    _operator_configured_caller_key_header_names returns custom key header names
    from general_settings and pass-through endpoint configurations.
  proof: [operator-config-cases]
- text: >-
    _is_authenticated_caller_jwt compares unverified JWT claims (excluding internal
    claims) with stored claims, returns false if claims cannot be parsed.
  proof: [jwt-auth-cases]
- text: >-
    _is_authenticated_caller_secret detects master key, JWT, or stored API key
    with constant-time comparison, returns false in no-auth dev mode without auth.
  proof: [secret-auth-cases]
- text: >-
    _caller_headers_without_litellm_secrets filters by header name and by
    authenticated-secret detection, returns immutable mapping.
  proof: [filter-secrets-cases]
- text: >-
    _forwarded_headers_for_credentialless_vertex_passthrough requires authorization
    or x-goog-api-key in caller headers, raises 401 with standard message if missing.
  proof: [vertex-credentialless-cases]
- text: >-
    _upstream_headers_for_anthropic_route requires authorization or x-api-key
    when no proxy credential is configured, raises 401 with standard message if missing.
  proof: [anthropic-credentialless-cases]
- text: >-
    _upstream_headers_for_bedrock_agent_runtime_route drops headers whose names
    match those in the signed_headers dict, preserves all other caller headers.
  proof: [bedrock-signed-cases]
- text: >-
    Module-level constants match LiteLLM exactly: all header sets, error detail
    messages, and the mapped-route header name.
  proof: [constants-cases]
checks:
  optional: []
  commands:
  - id: virtual-key-cases
    why: >-
      get_litellm_virtual_key tests fail, do not exist, or do not cover both
      x-litellm-api-key and Authorization header cases
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::virtual_key($|::)/)'
  - id: normalize-cases
    why: >-
      _normalize_credential_value tests fail, do not exist, or do not strip
      Bearer/Basic/AWS4-HMAC-SHA256 prefixes correctly
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::normalize($|::)/)'
  - id: operator-config-cases
    why: >-
      _operator_configured_caller_key_header_names tests fail, do not exist,
      or do not read custom headers from config
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::operator_config($|::)/)'
  - id: jwt-auth-cases
    why: >-
      _is_authenticated_caller_jwt tests fail, do not exist, or do not compare
      unverified claims correctly
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::jwt_auth($|::)/)'
  - id: secret-auth-cases
    why: >-
      _is_authenticated_caller_secret tests fail, do not exist, or do not detect
      master key, JWT, and stored API key correctly
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::secret_auth($|::)/)'
  - id: filter-secrets-cases
    why: >-
      _caller_headers_without_litellm_secrets tests fail, do not exist, or do
      not filter by name and authenticated-secret detection correctly
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::filter_secrets($|::)/)'
  - id: vertex-credentialless-cases
    why: >-
      _forwarded_headers_for_credentialless_vertex_passthrough tests fail, do
      not exist, or do not require authorization/x-goog-api-key and raise 401
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::vertex_credentialless($|::)/)'
  - id: anthropic-credentialless-cases
    why: >-
      _upstream_headers_for_anthropic_route tests fail, do not exist, or do not
      require upstream credential when proxy credential missing
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::anthropic_credentialless($|::)/)'
  - id: bedrock-signed-cases
    why: >-
      _upstream_headers_for_bedrock_agent_runtime_route tests fail, do not exist,
      or do not drop headers matching signed-headers dict keys
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::bedrock_signed($|::)/)'
  - id: constants-cases
    why: >-
      module-level constants are missing, incomplete, or have wrong header names
      and error messages
    run: >-
      cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail
      -E 'test(/^passthrough_caller_headers::constants($|::)/)'
