id: B3603
title: Pass-through caller credential filtering
description: >-
  Implement credential filtering for pass-through endpoints, separating authenticated
  LiteLLM credentials from provider credentials when forwarding caller headers.
  Build `get_litellm_virtual_key` to extract and format the API key from request
  headers, prioritizing `x-litellm-api-key` over Authorization. Implement `_normalize_credential_value`
  to strip authentication scheme prefixes (Bearer, Basic, AWS4-HMAC-SHA256) from header values,
  reusing B756's `_get_bearer_token` helper so header comparison strips exactly the schemes
  that `user_api_key_auth` accepts. Build JWT validation through `_is_authenticated_caller_jwt`,
  comparing unverified claims (excluding B760's internal claims) with stored claims. Build
  `_is_authenticated_caller_secret` to determine if a header value is the master key, the JWT
  that authenticated the request, or the stored API key, with fallback to always-false in no-auth
  dev mode without custom auth. Implement `_operator_configured_caller_key_header_names` to read
  custom header names from `general_settings.litellm_key_header_name` and pass-through endpoint
  configurations. Build `_caller_headers_without_litellm_secrets` to filter incoming headers,
  dropping those in `never_forwarded` plus the mapped-route key and operator-configured keys,
  and excluding any value that is an authenticated secret. Build provider-specific filtering
  functions with distinct credentialless branches: `_forwarded_headers_for_credentialless_vertex_passthrough`
  that requires either authorization or x-goog-api-key in the forwarded headers (raising 401
  if missing), `_upstream_headers_for_anthropic_route` that requires either authorization or
  x-api-key when no proxy credential is configured, and `_upstream_headers_for_bedrock_agent_runtime_route`
  that drops headers matching signed headers returned by the signing process. Define header-filtering
  sets as module-level Final frozensets: `_VERTEX_UPSTREAM_CREDENTIAL_HEADERS`, `_HEADERS_NEVER_FORWARDED_TO_VERTEX`,
  `_CREDENTIALLESS_VERTEX_MISSING_CREDENTIAL_DETAIL`, `_ANTHROPIC_UPSTREAM_CREDENTIAL_HEADERS`,
  `_HEADERS_NEVER_FORWARDED_TO_ANTHROPIC`, `_CREDENTIALLESS_ANTHROPIC_MISSING_CREDENTIAL_DETAIL`,
  `_HEADERS_NEVER_FORWARDED_TO_BEDROCK`, and `_MAPPED_ROUTE_CALLER_KEY_HEADER`. The Vertex
  and Anthropic branches drop all LiteLLM credential headers except the ones the upstream
  provider uses, and Bedrock drops all credential headers. Preserve distinct 401 error messages
  for missing Vertex and Anthropic credentials.
scope:
  paths:
  - crates/betterlite-auth/src/passthrough.rs
  - crates/betterlite-auth/src/passthrough/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/passthrough.rs
  - crates/betterlite-server/src/passthrough/**
  - tools/oracle/cases/passthrough/**
  - tools/oracle/helpers/b3603.py
  - tools/oracle/helpers/b3603/**
  - tools/oracle/src/helpers/auth/b3603.rs
  - tools/oracle/src/helpers/auth/b3603/**
  lint_tables: false
