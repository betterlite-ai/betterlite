dod:
  - text: A submission item masks its litellm_params with B3684's mask_sensitive_values and keeps an empty map empty.
    proof: [submissions-item-tests]
  - text: parse_json_field returns an object column as it is, parses JSON text into an object, and gives none for null, bad text and non-objects.
    proof: [submissions-item-tests]
  - text: Register checks team_id, membership, the guardrail type, api_base, mode and name uniqueness in LiteLLM's order with its exact status and detail texts, and stores a pending_review row with the three timestamps, the team and the guardrail_info additions.
    proof: [submissions-register-tests]
  - text: The register body decoder ignores unknown keys, rejects a body without `guardrail_name` or `litellm_params` as 422, survives arbitrary bytes and its seed corpus replays.
    proof: [submissions-register-tests, submissions-corpus]
  - text: The list route gives admins every team row and others only their teams, refuses a team filter outside them with 403, returns the empty answer for a non-admin without teams, counts the summary before the filters and applies status, team and search as LiteLLM does.
    proof: [submissions-read-tests]
  - text: The single read returns the masked item, 404 for a missing row and 403 for a non-admin outside the owning team, and the literal submissions path wins over the `/guardrails/{guardrail_id}` route.
    proof: [submissions-read-tests]
  - text: Without a database register, list and single read answer 500 "Prisma client not initialized", and every route needs a valid key.
    proof: [submissions-read-tests]
  - text: The handlers are tested with tower's oneshot over the module's own Router and fake ports. B8668 mounts the routes and owns their HTTP oracle cases, so write no HTTP case here.
    proof: [submissions-read-tests]
checks:
  optional: []
  commands:
    - id: submissions-item-tests
      why: the column reader or the item projection is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::submissions::tests::(json_field_|item_)/)'
    - id: submissions-register-tests
      why: a register check, its order, its text or the stored row differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::submissions::tests::(register_|body_)/)'
    - id: submissions-read-tests
      why: the list, the single read, the team rules or the no-database answer are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::submissions::tests::(list_|get_|teams_|nodb_)/)'
    - id: submissions-corpus
      why: the fuzz target, its seeds or the replay test are missing
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/guardrail_register)"
        && test -f crates/betterlite-server/fuzz/fuzz_targets/guardrail_register.rs
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_guardrail_register_corpus)'
oracle_cases: []
deviations:
  - what: The guardrail params are stored as plain JSON text of the body's map, without LiteLLM's `safe_dumps` depth marker ("MaxDepthExceeded" past depth 100).
    why: The JSON decoder already refuses nesting past 128 levels with a 422, so the marker cannot be reached.
  - what: A non-text `api_base` in a register body is answered as 400 "litellm_params.api_base must use http or https scheme".
    why: LiteLLM passes any value to `urlparse` and fails with an unhandled error (500); docs/compatibility.md leaves types outside the declared ones undefined, and 400 names the field.
out_of_scope:
  - "approve_guardrail_submission and reject_guardrail_submission (L1004-L1126): B3685, which also owns the status write seam `ReviewRows`."
  - "The list, info and form routes, and `_get_masked_values` as a shared function: B3684 (it owns `mask_sensitive_values`, which this task calls)."
  - "create_guardrail, update_guardrail, delete_guardrail and patch_guardrail (L331-L645 and L1129-L1295): B3685."
  - "category_yaml, major_airlines, validate_blocked_words_file and apply_guardrail (L1450-L1620 and L2337-L2457): B3687."
  - "test_custom_code and its timeout helpers (L2006-L2240): B6670."
  - "`_create_guardrail_row`, `_find_team_guardrail_rows` and `_guardrails_table` as functions: they become the `SubmissionRows` methods here; `_delete_guardrail_row` has no caller in this task and B3685 deletes through B3682's registry."
  - "`_as_str_object_mapping` (L80): a typing helper with no behavior."
pitfalls:
  - "register compares the role with `proxy_admin` exactly, while the two read routes use the admin-view predicate, so a read-only admin can list every submission but cannot register for a team it is not in."
  - "`team_id = request.team_id or key.team_id` treats an empty string as absent, so `\"team_id\": \"\"` falls back to the key's team."
  - "The membership check runs only when the chosen team differs from the key's team, so a key bound to team A registers for A without any team lookup."
  - "`api_base` is checked for presence before its scheme, and `mode` is checked last, so a body with a bad scheme and no mode gets the scheme error."
  - "The duplicate-name check covers every row, including rejected ones and rows without a team."
  - "The summary counts are taken before the `status`, `team_id` and `search` filters, so a filtered list can show fewer submissions than `summary.total`."
  - "A missing status counts as `active` in the summary and in the item, but the `status` filter compares the raw column, so `status=active` skips such a row."
  - "`search` also matches inside the whole info text when the column holds text, so it can hit a key name such as `submitted_by_email`."
  - "`/guardrails/submissions` is also a valid `{guardrail_id}` for B3684's GET route; LiteLLM declares these routes earlier in the file, so they win."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
