id: B140
title: MCP tools in gateway chat and Responses calls through the production MCP area
description: >-
  A chat or Responses request whose tools include `{"type": "mcp", "server_url": "litellm_proxy"}` (or `litellm_proxy/mcp/<name>`, or an http(s) URL ending in /mcp/<name> that the gateway serves) makes LiteLLM list the tools of its own configured MCP servers, hand them to the model, run the tool calls the model makes when require_approval is "never", and make one follow-up model call with the results. The algorithms are built: B956 and B957 for chat (chat_completions_handler.py), B948 to B955 for Responses (litellm_proxy_mcp_handler.py, mcp_streaming_iterator.py, responses/main.py). They reach the MCP manager, the proxy hooks and the model only through the ports their modules declare, and no task implements those ports over the gateway's MCP area, so through the booted proxy a `litellm_proxy` tool reaches nothing. This task writes those adapters once over B8620's McpState and plugs them into the three places a gateway request enters the MCP branch. It mounts no route and ports no LiteLLM algorithm.


  Code goes in crates/betterlite-server/src/app/mcp/llm_tools.rs and app/mcp/llm_tools/ (ports.rs, chat.rs, tests.rs); the skeleton declares `pub mod llm_tools;` in app/mcp.rs. Every name stays at 30 characters or fewer.


  ports.rs. Read the merged modules of B948, B949, B950, B951, B955, B956 and B957 and write one adapter per trait they declare for the MCP manager and the proxy hooks; never declare a parallel trait. `McpLlmTools::from_state(state: &ServerState) -> McpLlmTools` clones the Arc handles each adapter needs from `McpState::shared(state)` and the server state, so a request builds it without I/O. What each LiteLLM call stands for and the betterlite owner the adapter forwards to: global_mcp_server_manager.get_registry, get_mcp_server_by_name and _get_mcp_server_from_tool_name are B4731's registry reads over the shared registry in McpState; get_toolset_by_name_cached and resolve_toolset_tool_permissions are the toolset store and B6593's scope filter (with no database, the lookup answers "no toolset", as LiteLLM's prisma_client None branch does); granted_toolset_ids and _user_has_admin_view come from B8621's caller identity state; get_allowed_mcp_servers, get_mcp_servers_from_ids and _get_allowed_mcp_servers_from_mcp_server_names are B6591's allowed-server union; server.py's _get_tools_from_mcp_servers is B8197's listing and _resolve_display_name_to_original is B8195's; call_tool is B8465's dispatch over `McpState::shared(state).upstream.clients` (B9654), so every upstream request goes through the production runtime with B8194's capture; proxy_logging_obj.post_mcp_call_hook is B8394's MCP result hook and post_call_failure_hook with route "/responses/mcp/call_tool" is B8399's, both on the ProxyLogging the server state holds. The caller's admitted principal, request tags, trace id and the MCP auth headers reach the adapters through the port arguments the core modules pass (B949 resolves them from the request); an adapter reads no header, env var or global of its own.


  chat.rs. The gateway chat route does not go through B5656's completion call: it selects a deployment and sends through B014's ChatExecutor (crates/betterlite-openai/src/chat/execution.rs). LiteLLM runs the MCP branch inside completion() after routing (main.py L5265-L5300), so the follow-up goes to the same deployment with `_skip_mcp_handler` set and never re-enters the branch. `ChatMcpCall` implements B956's and B957's model-call port over the ChatExecutor and the deployment the route selected: a finished call is ChatExecutor::send, a streamed one is ChatExecutor::stream with its SSE body read by betterlite-openai's SseParser and each data payload decoded into the chunk type B957 takes, ending at `[DONE]`. In crates/betterlite-server/src/routes/chat.rs, after the shared pre-call (B8803) and deployment selection, a request whose tools pass B956's gateway split runs B956's plan and B957's loop with McpLlmTools and ChatMcpCall instead of the plain executor call; a finished result goes out through the route's existing JSON path and a streamed one through the route's existing SSE path, so mcp_list_tools, mcp_tool_calls and mcp_call_results arrive in provider_specific_fields as LiteLLM puts them. A request with no gateway MCP tool keeps the route's current path untouched.


  Router completion. B8630 builds B5656's completion targets in crates/betterlite-server/src/app/inference/router_completion.rs, where a model group that takes the RouterCompletion path (B117's prompt-management groups) still gets NoMcpLoop and fails by name. Replace that one value with B5849's ChatMcpRunner built over McpLlmTools. If B5849's constructor takes only resolved settings and no ports, add a constructor in crates/betterlite-sdk/src/mcp_loop.rs that takes B956's and B957's ports and keep the existing one unchanged.


  Responses. B080 assembles B955's dispatch from crates/betterlite-server/src/api/responses_routes.rs through its small core composition module crates/betterlite-core/src/api/responses_routes.rs. Replace whatever manager and hook ports the server side passes there with the McpLlmTools adapters; when the core composition builds those ports itself with no parameter for them, add that one parameter. The dispatch, B954's stream loop and the follow-up through B932 stay as B080 composed them.


  Tests in app::mcp::llm_tools::tests boot B8610's application with a config that names one MCP server, a local rmcp test server over streamable HTTP and a local mock model upstream: a chat request with require_approval "never" lists the server's tools, calls the one tool the model picks and sends one follow-up; the same as a stream; a Responses request through B955 reaches the same tool; a key whose object permission excludes the server sees no tool and makes no upstream MCP request; and an upstream tool error comes back as the "Error executing tool: ..." text in the follow-up's tool message with B8399's failure hook called once.


  HTTP oracle cases in tools/oracle/cases/mcp-llm-tools/ compare the booted proxies. They set up the upstream MCP server the way B136's fixture does: an mcp_servers entry named alpha with transport http and url "{{upstream}}/__mcp_fixture/alpha", answered by the mock's MCP reply correlation, with the model replies on the same scripted upstream in the order LiteLLM sends them. Chat cases post to /v1/chat/completions with model mcp-model (openai/gpt-mcp-upstream on the mock) and the tool `{type: mcp, server_label: alpha, server_url: "litellm_proxy/mcp/alpha", require_approval: never}`: chat-auto-execute, chat-auto-execute-stream, chat-approval-required (require_approval omitted, so one model call and no tools/call), chat-tool-error (tools/call answers isError) and chat-unknown-server (server_url litellm_proxy/mcp/missing, so no MCP request is made). Responses cases post to /v1/responses with the same tool: responses-auto-execute, responses-auto-execute-stream and responses-approval-required. Transport cases call POST /mcp-rest/tools/call (B8626's route) with name alpha-echo through the production runtime: rest-call-redirect-same-origin (the upstream answers the POST with 307 and a relative Location /__mcp_fixture/alpha-moved, followed), rest-call-redirect-cross-origin (307 to http://127.0.0.1:9/mcp, not followed, no request reaches it) and rest-call-upstream-500. Each case checks status, content-type and the body; generated ids and timestamps are ignored at their pointers only. Add one http_case corpus seed per case.
