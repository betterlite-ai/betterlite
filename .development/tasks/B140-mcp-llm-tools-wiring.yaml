    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/app/mcp/llm_tools.rs
    - crates/betterlite-server/src/app/mcp/llm_tools/**
    - crates/betterlite-server/src/routes/chat.rs
    - crates/betterlite-server/src/routes/chat/tests/**
    - crates/betterlite-server/src/api/responses_routes.rs
    - crates/betterlite-core/src/api/responses_routes.rs
    - crates/betterlite-server/src/app/inference/router_completion.rs
    - crates/betterlite-sdk/src/mcp_loop.rs
    - Cargo.lock
    - tools/oracle/cases/mcp-llm-tools/**
    - tools/oracle/fuzz/corpus/http_case/mcp-llm-tools-*
  lint_tables: false
