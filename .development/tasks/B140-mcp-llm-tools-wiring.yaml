dod:
  - text: The manager and hook ports of the chat and Responses MCP modules are implemented over the gateway's MCP area, its upstream runtime and ProxyLogging.
    proof: [llm-tools-tests]
  - text: A gateway chat request with litellm_proxy MCP tools lists, calls and follows up as LiteLLM does, finished and streamed, and a request without them keeps its path.
    proof: [llm-tools-tests, route-tests, case-files, oracle]
  - text: A Responses request with litellm_proxy MCP tools runs B955's dispatch over the production ports.
    proof: [llm-tools-tests, route-tests, case-files, oracle]
  - text: RouterCompletion's targets run the real chat MCP runner instead of NoMcpLoop.
    proof: [route-tests, runner-tests]
  - text: An MCP tool call through the booted proxy follows a same-origin redirect, refuses a cross-origin one and reports an upstream 500 as LiteLLM does.
    proof: [case-files, oracle]
  - text: The new HTTP transcripts replay through the existing HTTP-case decoder.
    proof: [http-corpus]
checks:
  optional: []
  commands:
    - id: llm-tools-tests
      why: An adapter is missing, forwards to the wrong owner, or the booted gateway never reaches the MCP server.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::mcp::llm_tools::/)'
    - id: route-tests
      why: The chat branch, the Responses composition or the router targets broke the tests of the code they changed.
      run: test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-server/src/app/mcp/llm_tools.rs crates/betterlite-server/src/app/mcp/llm_tools)" && cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^routes::chat::/) | test(/^api::responses_routes::/) | test(/^app::inference::router_completion::/)'
    - id: runner-tests
      why: A new ChatMcpRunner constructor broke B5849's runner tests.
      run: test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-server/src/app/inference/router_completion.rs)" && cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^mcp_loop::/)'
    - id: case-files
      why: No new chat, Responses or transport case exists on this branch.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/mcp-llm-tools)"
    - id: http-corpus
      why: The HTTP transcripts never reach the production case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/http_case/mcp-llm-tools-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
oracle_cases:
  - tools/oracle/cases/mcp-llm-tools/chat-auto-execute.yaml
  - tools/oracle/cases/mcp-llm-tools/chat-auto-execute-stream.yaml
  - tools/oracle/cases/mcp-llm-tools/chat-approval-required.yaml
  - tools/oracle/cases/mcp-llm-tools/chat-tool-error.yaml
  - tools/oracle/cases/mcp-llm-tools/chat-unknown-server.yaml
  - tools/oracle/cases/mcp-llm-tools/responses-auto-execute.yaml
  - tools/oracle/cases/mcp-llm-tools/responses-auto-execute-stream.yaml
  - tools/oracle/cases/mcp-llm-tools/responses-approval-required.yaml
  - tools/oracle/cases/mcp-llm-tools/rest-call-redirect-same-origin.yaml
  - tools/oracle/cases/mcp-llm-tools/rest-call-redirect-cross-origin.yaml
  - tools/oracle/cases/mcp-llm-tools/rest-call-upstream-500.yaml
deviations: []
out_of_scope:
  - "litellm/responses/mcp/chat_completions_handler.py: B956 owns _add_mcp_metadata_to_response L24-L82 and acompletion_with_mcp L85-L327, B957 owns L328-L651."
  - "litellm/responses/mcp/litellm_proxy_mcp_handler.py and request_context.py: B948, B949, B950 and B951. litellm/responses/mcp/mcp_streaming_iterator.py: B952, B953 and B954. responses/main.py's MCP dispatch: B955."
  - "litellm/experimental_mcp_client/client.py and tools.py: B4740 to B4746 and B9651 to B9654; Readme.md has no code."
  - "The MCP post-call content hook on loggers (litellm_logging.py L1633-L1709): B9650, called from B950's execution."
  - "Mounting /chat/completions, /v1/responses and /mcp-rest/tools/call: B014, B080 and B8626. The Python SDK's MCP runner: B5849."
  - "The MCP reply id correlation in the oracle mock: B136."
pitfalls:
  - "The branch sits inside the per-deployment call, so a retry or fallback reruns the whole plan with its tool calls, as LiteLLM's router wraps acompletion_with_mcp; don't hoist it above deployment selection."
  - "ChatMcpCall sends straight to the ChatExecutor and never back through routes/chat.rs, while the RouterCompletion path relies on `_skip_mcp_handler: true` in every follow-up; dropping either lists the same tools again and loops."
  - "The chat stream sends mcp_list_tools on the first chunk and mcp_tool_calls and mcp_call_results on the initial stream's final chunk, before the follow-up chunks."
  - "Build McpLlmTools from McpState::shared each request; never open an MCP client or a runtime of its own, or the upstream calls lose B9654's capture and the shutdown tracker."
  - "post_call_failure_hook is skipped when the caller has no admitted principal (user_api_key_auth None), so a master-key-less test must still pass a principal to see the hook."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
