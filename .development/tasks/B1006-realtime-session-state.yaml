id: B1006
title: Realtime session state and billing records
description: >-
  Own RealTimeStreaming.__init__ and the ten complete storage/logging methods at 236-425 in
  betterlite-core::api::realtime_session_state. B1004 owns shared protocols and JSON decoding,
  B1005 header detection, B012 logging callbacks and B191 the bounded logging queue. This task
  supplies per-connection mutable state to the sender, buffer and relays; it must not depend on them.
  All message/input/tool arrays start empty; current IDs/chunks/delta type and session configuration
  start None. Sent/setup-content/synthetic-session/guardrail flags are false, violation count and
  buffered bytes are zero. backend_setup_complete is true with no config or when the config requires
  session configuration. force_transcription_model=None means no forced transcription; any other
  value, including "", initially marks a transcription session. An explicit backend beta flag wins
  over the client's beta-header preference. model defaults "" and request_data defaults {}.

  B002 loads litellm_settings.logged_real_time_event_types=None, a list or "*". None selects
  session.created,response.create,response.done,conversation.item.added,conversation.item.done;
  [] logs no ordinary events. Add loads_realtime_logged_events loader tests and YAML seeds.
  Collect function calls before filtering stored events. Capturing duration/token usage does not
  copy transcript text into response logs and does not duplicate an event already selected for logging.
  Only log_messages enqueues success callbacks and sets realtime_session_success_logged=true.

  B171 helper cases cover pure initialization/storage/collection methods; native queue spies cover
  store_input.pre_call and log_messages submission. No provider SDK or socket is called here.
  Reuse B1004 decoders, including their error/nonobject behavior. Source functions contain 226
  nonblank/non-comment lines, plus eight class/default declarations. Budget 190 state/collection,135 tests,105 fixtures,80 adapters,
  55 config tests/seeds and 35 wiring, 600 lines.
