references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L117-L200
  why: Default event list and complete constructor establish connection-local state without depending on relay methods.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L236-L425
  why: Logging filters, user/tool collection, usage deduplication and bounded callback submission.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L179-L179
  why: The module-level logging selection defaults to None, not an empty list.
dod:
- text: >-
    realtime_initial_state asserts all defaults above and four setup combinations: no config ->complete,
    requires_session_configuration=true ->complete, false ->incomplete, forced model="" ->transcription.
    Client beta=true with explicit backend beta=false keeps those preferences separate. Two sessions
    share no messages, pending frames or violation counts. loads_realtime_logged_events accepts None,[],
    [response.done],"*" through B002 and rejects other scalar types as startup configuration errors.
  proof: [behavior-tests, config-tests, oracle, helper-python]
- text: >-
    realtime_event_storage stores exactly the five default types and drops other types/missing type;
    "*" stores all and [] stores none. Bytes decode as UTF-8, strings as JSON, records directly.
    Unknown event names use the catch-all base object; a typed session validation failure logs debug
    "Error parsing message for logging: %s" and stores the original record. Invalid UTF-8 or JSON
    fails before that fallback. response.done output function_call collects id=call_id or "",type=function,
    function.name=name or "",function.arguments=arguments or default "{}" even when storage is disabled;
    explicit empty/None values are preserved where dict.get returns them. Nonfunction output is ignored.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    realtime_input_collection extracts each nonempty input_text from user conversation.item.create,
    session.update instructions as role=system and nonempty list tools as session_tools. Empty tools
    does not clear the previous list. Backend transcription.completed adds nonempty transcript as user
    content. Malformed JSON, inappropriate object types and missing fields are ignored by the collection
    methods. session.type=transcription and transcription_session.created/updated mark the session;
    a later realtime event never clears that flag. store_input retains a passed dict as input_message,
    but sets {} for string input, then pre_call receives the original message and api_key="".
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    realtime_usage_and_logging supplies transcription.completed with transcript=hello,usage={type:duration,
    seconds:2}. Default filtering stores one usage-only event, with no transcript; "*" stores only the
    ordinary event, not a second usage copy. Missing usage is ignored, even outside transcription mode
    this helper itself does not gate on the session flag. Closing with provider unbilled usage appends
    that same event shape; no config or usage=None is a no-op. log_messages copies nonempty input_messages
    into model_call_details.messages, writes both realtime_tools and realtime_tool_calls if either is
    nonempty, enqueues dispatch_success_handlers(messages,prefer_async_handlers=true) once and immediately
    sets realtime_session_success_logged=true. No logger means no callback or flag mutation. A queue
    submission failure must not falsely set the flag; callback completion is not awaited here.
  proof: [behavior-tests, oracle, helper-python]
- text: New config and helper seeds prove loaded event selection and independent record-level parity.
  proof: [config-corpus, helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Storage filters must not suppress usage/tool accounting or mark an unqueued success.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_session_state::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: The event selection setting needs a real loader test for null, lists and wildcard.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_session_state::tests::loads_realtime_logged_events($|::)/)'
  - id: config-corpus
    why: New logging-selection YAML must pass the existing config decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/realtime-session-state-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: The state adapter must exercise source collection methods without replacing network I/O.
    run: test -f tools/oracle/helpers/realtime_session_state.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: State operation tags require fresh helper input seeds.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime-session-state-*)" && grep -qE '^[[:space:]]+realtime_session_state:' tools/oracle/fuzz/corpus/helper_case/realtime-session-state-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: New session-state fixtures must compare stored records and selected diagnostics.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-session-state)"
oracle_cases:
- tools/oracle/cases/helpers/realtime-session-state/realtime-initial-state.yaml
- tools/oracle/cases/helpers/realtime-session-state/realtime-event-storage.yaml
- tools/oracle/cases/helpers/realtime-session-state/realtime-input-collection.yaml
- tools/oracle/cases/helpers/realtime-session-state/realtime-usage-and-logging.yaml
deviations: []
out_of_scope:
- B1004 owns BackendClose and socket/normalizer protocols; B1005 beta conversion; B1110 sender/enforcement; B1124 buffer methods and caps; B2455 guardrail predicates/setup policy; B1007 runner; B1008 backend methods; B1009 client methods. _has_realtime_guardrails has no caller at the pin.
- B191 bounds submitted logging work and owns shutdown; B012 owns success/pre-call callback execution. The setting's module export remains B157.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_session_state in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/realtime_session_state.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_session_state.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Tool-call collection runs before the event filter, so logged_real_time_event_types=[] must not erase tool accounting.
- An empty tools list leaves earlier session tools intact; it is not a clear operation.
- A successful queue submission sets realtime_session_success_logged before callbacks finish.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
