checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_session_state::/)
      - test(/::replays_corpus$/)'
  - id: case-pre-setup-buffer-cap
    why: the pre-setup-buffer-cap behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_session_state::tests::pre_setup_buffer_cap($|::)/)'
  - id: case-audio-clear-discards-appends
    why: the audio-clear-discards-appends behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_session_state::tests::audio_clear_discards_appends($|::)/)'
  - id: case-transcription-model-pinned
    why: the transcription-model-pinned behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_session_state::tests::transcription_model_pinned($|::)/)'
  - id: case-usage-only-transcription
    why: the usage-only-transcription behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_session_state::tests::usage_only_transcription($|::)/)'
  - id: case-setup-cache-refresh
    why: the setup-cache-refresh behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_session_state::tests::setup_cache_refresh($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_session_state::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/realtime-session-state-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/realtime_session_state)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/realtime_session_state.rs && grep -qF "decode_realtime_session_state"
      crates/betterlite-core/fuzz/fuzz_targets/realtime_session_state.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::realtime_session_state::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/realtime_session_state.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime_session_state-*)"
      && grep -qE "^[[:space:]]+realtime_session_state:" tools/oracle/fuzz/corpus/helper_case/realtime_session_state-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-session-state)"
