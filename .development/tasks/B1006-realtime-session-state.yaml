id: B1006
title: Realtime session state
description: >-
  Own per-connection realtime input/tool/usage capture, authorized transcription-model enforcement and deferred
  setup buffering. Preserve source caps 200 frames and 10 MiB, input_audio_buffer.clear ordering and setup cache
  updates; export state transitions consumed by the relay, without logging raw audio.


  Reuse B1004 decode_realtime_contract for _decode_json_object call sites; calling a lower decoder does not define
  another fuzz target.


  Implement crates/betterlite-core/src/api/realtime_session_state.rs. Use RealtimeSessionStateInput and RealtimeSessionStateResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions pre_setup_buffer_cap, audio_clear_discards_appends, transcription_model_pinned,
  usage_only_transcription, setup_cache_refresh under api::realtime_session_state::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.logged_real_time_event_types
  defaults to None. No environment reads occur outside betterlite-config. Test api::realtime_session_state::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::realtime_session_state::decode_realtime_session_state(bytes:
  &[u8], limits: &ApiLimits), for json.loads input cast(str, message) at litellm/litellm_core_utils/realtime_streaming.py:255;
  json.loads input message at litellm/litellm_core_utils/realtime_streaming.py:276. Place its implementation in
  crates/betterlite-core/src/api/realtime_session_state.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-core/fuzz/fuzz_targets/realtime_session_state.rs passes arbitrary bounded bytes to that
  exact decoder; api::realtime_session_state::tests::replays_corpus replays newly committed seeds through the same
  function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::RealtimeSessionState in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_session_state: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/litellm_core_utils/realtime_streaming.py: BackendClose.message (L45-L48); litellm/litellm_core_utils/realtime_streaming.py:
  backend_close_from (L56-L59); litellm/litellm_core_utils/realtime_streaming.py: ScopedWebSocket.scope (L93-L93);
  litellm/litellm_core_utils/realtime_streaming.py: _ClientWebSocket.send_text (L97-L97); litellm/litellm_core_utils/realtime_streaming.py:
  _ClientWebSocket.receive_text (L98-L98); litellm/litellm_core_utils/realtime_streaming.py: _ClientWebSocket.close
  (L99-L99); litellm/litellm_core_utils/realtime_streaming.py: _LoggingWorker.ensure_initialized_and_enqueue (L103-L103);
  litellm/litellm_core_utils/realtime_streaming.py: RealtimeEventNormalizer.should_drop (L112-L112); litellm/litellm_core_utils/realtime_streaming.py:
  RealtimeEventNormalizer.normalize (L113-L113); litellm/litellm_core_utils/realtime_streaming.py: RealtimeEventNormalizer.patch_outgoing_session
  (L114-L114); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming.__init__ (L127-L200); litellm/litellm_core_utils/realtime_streaming.py:
  RealTimeStreaming._should_store_message (L236-L245); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming.store_message
  (L247-L270); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._collect_user_input_from_client_event
  (L272-L306); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._collect_user_input_from_backend_event
  (L308-L317); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._detect_transcription_session_from_backend
  (L319-L333); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._capture_transcription_usage
  (L335-L362); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._flush_unbilled_transcription_usage
  (L364-L380); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._collect_tool_calls_from_response_done
  (L382-L402); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming.store_input (L404-L409); litellm/litellm_core_utils/realtime_streaming.py:
  RealTimeStreaming.log_messages (L411-L425). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 256 owned nonblank/non-comment/non-docstring Python lines (275 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 276 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 30 wiring; 619 total within the 620-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B012 (Logging pipeline, callback registry and redaction), B171 (Direct helper oracle and
  URL path encoding), B1004 (Realtime contracts), B1087 (Api boundaries), B1124 (Realtime setup buffering), B1005
  (Realtime beta protocol), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
