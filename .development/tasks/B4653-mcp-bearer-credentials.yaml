  why: Scrypt KDF constants, domain-label salts, and envelope_keys_from_master_key function with memory-hard parameters.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/bridge_credentials.py#L85-L159
