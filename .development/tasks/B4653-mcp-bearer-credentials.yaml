  optional: []
  commands:
  - id: bearer-credential-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/::bearer_credential_tests_behavior($|::)/)'
  - id: session-signing-config-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/::session_signing_config_tests_behavior($|::)/)'
  - id: mcp-session-token-signing-config-tests
    why: RS256 and HS256 configuration resolution is tested in betterlite-config
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_bearer_credentials::/)'
