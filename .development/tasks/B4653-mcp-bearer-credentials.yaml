- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/bridge_credentials.py#L161-L245
  why: Bridge envelope result types (NotBridgeEnvelope, BridgeEnvelopeAdmitted, BridgeEnvelopeInvalid, BridgeEnvelopeResult), resolution, server_id binding, Bearer scheme stripping, and cheap prefix check is_bridge_envelope_shaped.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/session_credentials.py#L39-L72
  why: Scrypt KDF constants and session_keys_from_master_key function with same memory-hard parameters under distinct domain label.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/session_credentials.py#L74-L165
  why: Session signing configuration models (MCPSessionTokenSigningSettings, SessionSigningPreviousKey), validation,
    resolve_session_signing_keys, and active_session_signing_keys wiring helper.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/session_credentials.py#L167-L239
