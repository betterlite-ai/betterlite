id: B4653
title: MCP bearer recognition and signing key configuration
description: >-
  Implement bearer token recognition and signing key derivation for the MCP gateway's bridge and session credentials.
  Build two symmetric-key derivation functions using scrypt KDF (RFC 7914) to derive distinct key material from the
  proxy master_key for bridge envelopes and session tokens, so compromise or misuse of one token family never crosses
  into the other. Implement pure classification and resolution functions to recognize bearer tokens by kind (bridge
  access, bridge refresh, session access, session refresh) without decryption, classify them (NotBridgeEnvelope,
  BridgeEnvelopeAdmitted, BridgeEnvelopeInvalid; NotSessionBearer, SessionBearerAdmitted, SessionBearerInvalid),
  and recover signed identity and upstream credentials for admission and forwarding. Add optional asymmetric RS256
  signing configuration for session tokens via general_settings.mcp_session_token_signing, resolving configuration
  from pydantic models, loading PEM key material from inline strings or secret manager references (os.environ/), and
  validating RSA keys at startup so token issuance and admission fail closed on config defects rather than silently
  falling back to HS256. Implement three modules in crates/betterlite-mcp/src: bridge_credentials.rs (bridge envelope
  key derivation and classification), session_credentials.rs (session token key derivation, configuration, and
  classification), and types.rs (pydantic-equivalent models for MCPSessionTokenSigningSettings and its subfields).
  All functions are pure, total over hostile input, and take all key material and the clock as explicit parameters.
  Bearer value handling always strips an optional Bearer scheme prefix before classification. Define oracle cases for
  key derivation (deterministic, memory-hard scrypt), token recognition (cheap prefix tests), envelope/session
  resolution (valid vs invalid, expired, wrong server/client binding, signature mismatch), RS256 configuration
  validation (malformed, missing key material, unresolvable references, invalid PEM), and configuration default
  fallback to HS256 when settings absent. Write behavior rstest functions bearer_credential_tests_behavior and
  session_signing_config_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure
  in the DoD.
scope:
  paths:
  - crates/betterlite-mcp/src/bridge_credentials.rs
  - crates/betterlite-mcp/src/bridge_credentials/**
  - crates/betterlite-mcp/src/session_credentials.rs
  - crates/betterlite-mcp/src/session_credentials/**
  - crates/betterlite-mcp/src/types.rs
  - crates/betterlite-mcp/src/types/**
  - tools/oracle/cases/helpers/bearer-credentials/**
  - tools/oracle/cases/helpers/session-signing-config/**
  - crates/betterlite-config/src/sections/mcp_bearer_credentials.rs
  - crates/betterlite-config/src/sections/mcp_bearer_credentials/**
  - tools/oracle/helpers/b4653.py
  - tools/oracle/helpers/b4653/**
  - tools/oracle/src/helpers/mcp/b4653.rs
  - tools/oracle/src/helpers/mcp/b4653/**
