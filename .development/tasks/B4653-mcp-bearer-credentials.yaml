- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/session_credentials.py#L241-L288
  why: Session refresh token endpoint function (open_session_refresh_bearer), client_id binding, and result types (SessionRefreshOpened, SessionRefreshInvalid, SessionRefreshResult).
dod:
- text: >-
    Key derivation is deterministic and memory-hard: envelope_keys_from_master_key and session_keys_from_master_key
    use scrypt with n=2**15, r=8, p=1 over domain-label salts, produce keys matching LiteLLM exactly, and
    caching on master_key matches the fixed-per-process KDF behavior.
  proof:
  - bearer-credential-tests
  - session-signing-config-tests
- text: >-
    Bearer prefix checks (is_bridge_envelope_shaped, is_session_bearer_shaped) are O(1) string prefix tests that
    never decode or verify signatures; Bearer scheme stripping is symmetric across both modules.
  proof:
  - bearer-credential-tests
  - session-signing-config-tests
- text: >-
    Bridge envelope resolution (resolve_bridge_envelope, open_bridge_refresh_envelope) classify by prefix and
    kind claim, bind server_id to prevent cross-server replay, return the correct result type (NotBridgeEnvelope,
    BridgeEnvelopeAdmitted, BridgeEnvelopeInvalid) without raising, and include upstream_authorization for forwarding.
  proof:
  - oracle
  - bearer-credential-tests
- text: >-
    Session bearer resolution (resolve_session_bearer, open_session_refresh_bearer) classify by prefix and kind,
    bind client_id to prevent cross-client refresh replay, distinguish expired tokens (SessionBearerInvalid with
    expired=true) from tampered or foreign tokens, return the correct result type without raising, and recover
    principal for policy enforcement.
  proof:
  - oracle
  - session-signing-config-tests
- text: >-
    RS256 session signing configuration (mcp_session_token_signing block) validates schema, resolves private and
    previous public PEM material from inline or os.environ/ references, loads RSA keys, rejects config with
    SessionSigningConfigError on any defect (malformed shape, unresolved reference, non-RSA PEM), and defaults
    to HS256-derived key when settings absent.
  proof:
  - oracle
  - session-signing-config-tests
  - mcp-session-token-signing-config-tests
- text: >-
    All public functions are pure (no globals, no side effects), total over hostile input (never raise on bad input),
    and take all key material, clock and server/client bindings as explicit parameters.
  proof:
  - clippy
  - bearer-credential-tests
  - session-signing-config-tests
