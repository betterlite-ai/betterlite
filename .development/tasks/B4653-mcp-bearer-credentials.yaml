deviations:
- what: Betterlite resolves os.environ/ secret references directly without the secret manager abstraction LiteLLM uses.
  why: The betterlite config layer reads from environment; additional indirection adds no value.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/session_credentials.py#L106-L112
out_of_scope:
- Envelope and session token cryptographic operations are in B4651 (envelope.rs) and B4652 (session_token.rs).
- Token endpoint minting and refresh grant handling are in B4657 (token endpoint) and B4676 (gateway token grants).
- MCP admission edge integration and request routing are in B4671 (admitted server access) and B4673 (bearer admission).
- Configuration hot reload and per-proxy settings overrides; all configuration is read at startup from general_settings.
- Refresh token revocation lists or blacklisting; deactivation gates at admission time.
- Asymmetric signing key material generation; operators must provide RS256 keys externally.
pitfalls:
- >-
  Both scrypt KDF domains use distinct salts (_SIGNING_KEY_DOMAIN, _ENCRYPTION_KEY_DOMAIN for bridge;
  _SESSION_SIGNING_KEY_DOMAIN for session); using the same domain or salt between envelope and session key material
  breaks the cryptographic isolation. Never reuse a domain label across modules.
- >-
  The Bearer scheme prefix is case-insensitive (RFC 6750 section 2.1) but the inner envelope/token is case-sensitive;
  strip case-insensitively with .lower() but preserve the inner value exactly.
- >-
  All public classification functions return a discriminated result type (never panic, never raise exceptions on
  hostile input). The result tag is the only route dispatcher; a case-missing branch hides a token family.
- >-
  server_id binding for bridge envelopes and client_id binding for session refresh tokens prevent cross-boundary
  replay; omitting either check is a security defect.
- >-
  RS256 configuration validation runs at startup (via active_session_signing_keys at initialization); do not defer
  it to first use, since token issuance and admission must fail closed on config defects.
- >-
  os.environ/ references are resolved synchronously at configuration load time; they cannot be updated in a live
  process without restarting the gateway.
- >-
  The scrypt result is cached on master_key (via @lru_cache in Python, manually cached in Rust via e.g. Arc + once_cell);
  a master_key rotation invalidates all outstanding tokens, which is the intended behavior.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
