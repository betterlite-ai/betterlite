id: B1300
title: Vertex federation with rotating AWS credentials
description: >-
  Introduce betterlite-vertex and its aws_federation module, connecting B594's AwsCredentialResolver
  to Google's external-account subject-token supplier. Port both functions of VertexAIAwsWifAuth
  and all three AwsCredentialsSupplier methods. A missing or empty aws_region_name fails before
  any AWS resolution. Retain the ten recognized aws_* fields, copy the selection, and resolve
  credentials anew whenever Google requests a subject token so STS rotation takes effect.
  Pass audience, subject_token_type, token_url and service_account_impersonation_url through;
  universe_domain is omitted unless supplied, leaving Google's googleapis.com default. Explicit
  AWS credentials disable metadata discovery. Apply cloud-platform scopes only when required.
  Prefer google-cloud-auth's programmatic external-account supplier over another OAuth exchange;
  choose a policy-compliant release after checking its actual supplier API. Reuse B595 signing
  if the supplier needs an AWS signed subject token. Credentials stay secret across both SDKs.
  This boundary accepts a typed FederationInput from its caller; credential JSON decoding is B1301.
  Register helper call vertex_aws_federation for extract_aws_params and get_aws_region only,
  comparing all_recognized_fields, unknown_field_omitted, absent_aws_fields and fixed_region.
  Native SDK-boundary tests capture constructor arguments and repeated supplier resolution.
  Add rstest cases region_before_aws, rotating_session_token,
  no_metadata_source, impersonation_and_universe and scoped_supplier in aws_federation::tests.
  A new HelperCase seed under call.vertex_aws_federation exercises dispatch in betterlite-oracle.
  The two complete source files contain 130 nonblank noncomment lines (including docstrings);
  budget 240 Rust/SDK glue, 150 tests, 110 adapters and 80 manifests/seed wiring, maximum 650.
scope:
  paths:
    - Cargo.toml
    - Cargo.lock
    - deny.toml
    - crates/betterlite-vertex/Cargo.toml
    - crates/betterlite-vertex/src/lib.rs
    - crates/betterlite-vertex/src/error.rs
    - crates/betterlite-vertex/src/aws_federation.rs
    - crates/betterlite-vertex/src/aws_federation/**
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/vertex/aws_federation.rs
    - tools/oracle/src/helpers/vertex/aws_federation/**
    - tools/oracle/helpers/vertex_aws_federation.py
    - tools/oracle/helpers/vertex_aws_federation/**
    - tools/oracle/cases/helpers/vertex-aws-federation/**
    - tools/oracle/fuzz/corpus/helper_case/vertex_aws_federation*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_aws_wif.py#L20-L120
    why: Complete AWS field selection and federation constructor behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/aws_credentials_supplier.py#L17-L53
    why: Lazy credentials and fixed region supplied on each exchange.
  - url: https://docs.rs/google-cloud-auth/latest/google_cloud_auth/credentials/external_account/index.html
    why: Evaluate the programmatic subject-token supplier without executable credential discovery.
dod:
  - text: AWS supplier rotation, early region validation and forwarded federation options are asserted at the injected SDK boundary.
    proof: [federation-tests]
  - text: Pure AWS field selection and the supplier's configured region match the pinned functions.
    proof: [federation-tests, oracle, federation-python]
  - text: The helper variant reaches the Rust implementation and has a newly committed parser seed.
    proof: [federation-seed]
checks:
  optional: []
  commands:
    - id: federation-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^aws_federation::/)'
      why: Federation tests are missing or the supplier resolves credentials at the wrong time.
    - id: federation-python
      run: test -f tools/oracle/helpers/vertex_aws_federation.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: The independent Google constructor adapter is absent or fails strict typing.
    - id: federation-seed
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/vertex_aws_federation*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::vertex::aws_federation::/)'
      why: Seed tests must parse the new call tag and fail on an empty seed set.
oracle_cases:
  - tools/oracle/cases/helpers/vertex-aws-federation/all-recognized-fields.yaml
  - tools/oracle/cases/helpers/vertex-aws-federation/unknown-field-omitted.yaml
  - tools/oracle/cases/helpers/vertex-aws-federation/absent-aws-fields.yaml
  - tools/oracle/cases/helpers/vertex-aws-federation/fixed-region.yaml
deviations: []
out_of_scope:
  - B594 resolves AWS profiles, AssumeRole and web identity; this task supplies its resulting credentials to Google.
  - B1301 owns VertexBase.load_auth and its external_account dispatch in vertex_llm_base.py.
pitfalls:
  - 'The oracle helper for this task is pre-registered as vertex_aws_federation in the vertex group. Replace the stub Op in tools/oracle/src/helpers/vertex/aws_federation.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vertex_aws_federation.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Supplying only aws_region_name still selects explicit AWS federation and must not silently select Google metadata credentials.
  - A supplier captured as a frozen access-key tuple loses later aws_session_token rotations.
  - The universe_domain field is a federation option, not a replacement inference api_base.
budget:
  max_changed_lines: 650
  max_new_expects: 0
review_level: security
