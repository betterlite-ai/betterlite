deviations:
- what: Unrouted managed-file retrieval returns 500 internal_server_error/code="500" without a hook; listing defaults to provider files and ignores limit/after on that MIT path.
  why: Preserve the current observable behavior while Max decides managed files and batches; this adds no enterprise hook or license gate.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L1350-L1370
out_of_scope:
- B1031 owns upload helpers, B1032 create_file, B1033 get_file_content and B087 delete_file. B1017 owns list-page records and B1019 limit/ID codecs.
- Managed hook retrieval L1361-L1370 and managed listing L1780-L1788 have no reachable MIT caller. They do not justify B1018 ownership filtering or managed repository dependencies here.
- B1020/B886 own credential grants and their errors; B003/B004 own validation/error serialization and custom headers; B124 owns callback execution/status persistence.
pitfalls:
- target_model_names list splitting does not trim spaces or remove empty entries.
- List success hooks replace a page only when they return a single OpenAIFileObject.
- The wrong-looking alist_fine_tuning_jobs call type is observable and must remain until separately changed.
review_level: security
budget:
  max_changed_lines: 750
  max_new_expects: 0
