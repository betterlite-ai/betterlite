id: B1034
title: File read route
description: >-
  Install file retrieve/list routes with managed/native selection, owner-scoped database pagination and provider
  pagination. Keep user-or-team list visibility consistent with individual access and preserve first_id/last_id/has_more.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-server/src/api/file_read_route.rs, crates/betterlite-core/src/api/file_read_route.rs.
  Use FileReadRouteInput and FileReadRouteResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /{provider}/v1/files/{file_id:path}; GET /v1/files/{file_id:path};
  GET /files/{file_id:path}; GET /{provider}/v1/files; GET /v1/files; GET /files. Each alias is exercised through
  the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without re-registering
  their methods/paths.


  Route input projections: data.file_id (absent None); data.litellm_call_id (absent '').


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): files_endpoints.py:1418 type=openai_error_type(e, error_status_code(e, status.HTTP_400_BAD_REQUEST)),
  param=openai_error_param(e), code=error_status_code(e, status.HTTP_400_BAD_REQUEST); files_endpoints.py:1426 type=openai_error_type(e,
  error_status_code(e, 500)), param=openai_error_param(e), code=error_status_code(e, 500); files_endpoints.py:1354
  type=ProxyErrorTypes.internal_server_error.value, param=None, code=500; files_endpoints.py:1361 type=ProxyErrorTypes.internal_server_error.value,
  param=None, code=500; files_endpoints.py:1802 status_code=500, exception_detail=FastAPI detail string; files_endpoints.py:1847
  type=openai_error_type(e, error_status_code(e, status.HTTP_400_BAD_REQUEST)), param=openai_error_param(e), code=error_status_code(e,
  status.HTTP_400_BAD_REQUEST); files_endpoints.py:1855 type=openai_error_type(e, error_status_code(e, 500)), param=openai_error_param(e),
  code=error_status_code(e, 500); files_endpoints.py:1749 status_code=400, exception_detail=FastAPI detail string;
  files_endpoints.py:1754 status_code=500, exception_detail=FastAPI detail string. Compare the actual source status,
  error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions managed_retrieve_no_hook_500, provider_list_team_credentials, native_file_list,
  identityless_provider_list, list_pagination_not_forwarded, route_aliases, auth_missing, auth_invalid under api::file_read_route::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/openai_files_endpoints/files_endpoints.py: get_file (L1251-L1431); litellm/proxy/openai_files_endpoints/files_endpoints.py:
  _as_file_list_page (L1652-L1655); litellm/proxy/openai_files_endpoints/files_endpoints.py: list_files (L1673-L1860).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 334 owned nonblank/non-comment/non-docstring Python lines (354 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 354 implementation,
  88 behavior tests, 96 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 576 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1017 (Managed resource access), B1018
  (MIT resource owner compatibility), B1019 (File routing ids), B1029 (File provider read), B1087 (Api boundaries),
  B732 (Typed authentication principals and grant resolution), B855 (Authenticated request admission and budget
  handoff), B756 (Authentication header selection and mode dispatch), B1021 (File upload options), B1020 (File credentials),
  B003 (HTTP server, health routes and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management
  oracle namespaces and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  The OSS unified retrieve branch without model routing returns 500 internal_server_error/null/500 for the missing
  hook. Listing without an explicit model/provider falls back to openai with team credentials; it does not list
  managed rows by team or owner. Validate limit, but limit/after are not forwarded to afile_list in these branches
  (only purpose is). An identity-less principal in an explicitly auth-disabled fixture still follows provider listing,
  with no managed-row query.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
