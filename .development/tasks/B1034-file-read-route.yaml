id: B1034
title: File metadata and listing HTTP routes
description: >-
  Own complete get_file, list_files and _as_file_list_page, registering GET /files/{file_id:path},
  /v1/files/{file_id:path}, /{provider}/v1/files/{file_id:path}, and GET /files, /v1/files,
  /{provider}/v1/files. Put adapters in betterlite-server::api::file_read_route and typed policy
  in betterlite-core::api::file_read_route. Use B1029 SDK reads, B1020 authorized credentials,
  B1019 ID/list limits, B1017 list-page construction and B004 common pre-call/custom headers.

  Retrieve validates require_managed_files first, then selects provider and performs pre-call
  processing. Model-based routing precedes legacy unified-ID handling. List never calls the managed-ID
  requirement: limit is validated before pre-call and the source route_type is alist_fine_tuning_jobs,
  despite this being Files. Model routing wins over target_model_names and provider hints. MIT has
  no managed hook, so list falls back to provider/openai; limit and after are not sent on that path.

  Keep the complete functions together and exercise every alias with B900 HTTP cases, master key
  sk-test, B1139 seeded ordinary keys/teams and mock provider requests. Pure list-page transformation
  is covered natively; no B171 adapter is needed. Test modules are api::file_read_route::tests in
  server/core. Owned source has 354 nonblank/non-comment lines; budget 280 implementation, 190 tests,
  245 cases and 35 wiring lines, totaling 750. Decoding remains B1100/B1019/provider owned.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/api/file_read_route.rs
  - crates/betterlite-server/src/api/file_read_route/**
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_read_route.rs
  - crates/betterlite-core/src/api/file_read_route/**
  - tools/oracle/cases/api/file-read-route/**
  - tools/oracle/fixtures/http-scenarios/file-read-route/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L1235-L1431
  why: All retrieve decorators and whole model/managed/provider routing with response-id restoration.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L1652-L1860
  why: Whole list page adapter and all listing aliases, including the inherited fine-tuning call type.
dod:
- text: >-
    read_route_aliases sends authenticated GET /files/f,/v1/files/f,/openai/v1/files/f and
    /files,/v1/files,/openai/v1/files; mock metadata returns {id:f,object:file,bytes:3,created_at:1,
    filename:a.txt,purpose:assistants}, each client gets 200 with that object or the provider list.
    Slash-containing ids reach the provider path encoder as one id. Missing/invalid Authorization
    with master key configured returns 401/auth_error/param="None"/code="401" with B756's messages,
    and makes no provider calls. Register each method/path once alongside B1033's content routes.
  proof: [read-tests, oracle, new-cases]
- text: >-
    retrieve_model_and_provider_order proves truthy path>custom-llm-provider header>
    custom_llm_provider query>body>openai, but an authorized encoded model m chooses m's credentials
    before the legacy-id branch. Provider gets decoded f; a truthy returned id is restored to the
    caller's original id when original_file_id is truthy. Empty returned id remains empty. Plain
    model hints go through B1020 too. Unrouted native ids use team credentials; file_id is removed
    from data before the explicit argument is supplied. Common processing route_type=afile_retrieve.
  proof: [read-tests, oracle, new-cases]
- text: >-
    retrieve_managed_requirement sends an unrouted legacy unified id without enterprise: 500,
    internal_server_error,null,"500",message="Managed files hook not found". With require_managed_files=true,
    that id fails earlier with "Managed resource ownership validation is unavailable."; a raw f
    fails 400/invalid_request_error/null/"400" with B1021's exact file requirement message. Missing
    router for a model hint produces 500 and "{'error': 'Router not initialized. Cannot use model-based
    routing.'}". Forbidden model credentials return B1020/B886's 403 before any provider request.
    Unlike content, retrieve has no special raw-cloud-URI rejection; do not add one here.
  proof: [read-tests, oracle, new-cases]
- text: >-
    list_limits_and_ignored_cursor sends limit absent,1,10000 with after=f and receives the same
    provider list; neither limit nor after is forwarded to the MIT provider path. limit=0 returns
    400/invalid_request_error/limit/"400",message="Invalid 'limit': integer below minimum value.
    Expected a value >= 1, but got 0 instead." limit=10001 uses "Invalid 'limit': integer above
    maximum value. Expected a value <= 10000, but got 10001 instead." openai_code is not serialized.
    limit=abc is FastAPI422 detail with loc=[query,limit],type=int_parsing, no OpenAI envelope.
    Invalid bounds fail before the pre-call hook; require_managed_files=true still permits listing.
  proof: [read-tests, oracle, new-cases]
- text: >-
    list_target_selection gives model=m precedence over target_model_names=a,b; without model,
    target_model_names=a,b or a, fails 400/invalid_request_error/null/"400",message="target_model_names
    on list files must be a list of one model name. Example: ['gpt-4o']". Exactly one string is not
    stripped: " m " is authorized/looked up literally. Empty target string falls through. One target
    without a router fails 500/internal_server_error/null/"500",message="LLM Router not initialized.
    Ensure models added to proxy." Otherwise credentials use operation_context="file list" and
    internal snapshot; absent model/target selects path/header/query/body or openai, applying team
    credentials. purpose absent/null/empty/batch passes unchanged; listing does not validate purpose.
  proof: [read-tests, oracle, new-cases]
- text: >-
    list_page_and_hooks converts a native provider list [f,g] to object=list,data=[f,g],first_id=f,
    last_id=g,has_more=false after validating every OpenAIFileObject. Empty list has null first_id/
    last_id; an already constructed page is unchanged. Malformed native list entries fail before
    success hook/status. A null provider response yields 500/internal_server_error/null/"500",
    message="Either 'provider' or 'target_model_names' must be provided e.g. `?target_model_names=gpt-4o`".
    Native hook tests return null, a list page, or OpenAIFileObject: only the file object replaces
    the response. List success hook runs before enqueueing success; retrieve has no success hook.
    List common processing uses alist_fine_tuning_jobs; pin its callback call type explicitly.
  proof: [read-tests, oracle, new-cases]
- text: >-
    read_headers_and_errors uses hidden model_id=d,cache_key=c,api_base=https://mock.test/v1?secret=x:
    response includes x-litellm-model-id=d,x-litellm-cache-key=c,x-litellm-model-api-base=https://mock.test/v1,
    x-litellm-version and allowed-region header from B004; missing hidden values use "" and omit
    corresponding optional headers. Status updates use litellm_call_id or default "". Upstream
    404 type=invalid_request_error,param=file_id,message=missing becomes 404 with code="404";
    HTTPException403 maps permission_error and absent status maps internal_server_error500.
    Literal "None" error param normalizes to null in both catches; list rethrows ProxyException
    unchanged. Failure hook precedes ERROR "litellm.proxy.proxy_server.retrieve_file(): Exception
    occured - <error>" or "litellm.proxy.proxy_server.list_files(): Exception occured - <error>"
    and DEBUG traceback. Routed DEBUG messages include selected model and retrieve original id.
  proof: [read-tests, oracle, new-cases]
checks:
  optional: []
  commands:
  - id: read-tests
    why: retrieve/list route behavior or page projection has no native test
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::file_read_route::tests::/) - test(/replays_/)'
  - id: new-cases
    why: file read aliases and limits have no newly added HTTP scenarios
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/file-read-route)"
