- tools/oracle/cases/api/file-read-route/retrieve-model-and-provider-order.yaml
- tools/oracle/cases/api/file-read-route/retrieve-managed-requirement.yaml
- tools/oracle/cases/api/file-read-route/list-limits-and-ignored-cursor.yaml
