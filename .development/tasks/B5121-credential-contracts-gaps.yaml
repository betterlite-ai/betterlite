id: B5121
title: BYOK cache eviction by LiteLLM's key and credential default cases
description: >-
  B4650 built the MCP credential contracts in crates/betterlite-mcp/src/credential_contracts. An Opus
  review after merge found one behavior gap and two tests that can't fail. This task closes them in the
  same crate, the same b4650 oracle helper and the same credential-contracts case folder.


  Gap one. ByokCredentialCache in byok_cache.rs keys its entries by a (user_id, server_id) tuple and has
  no way to drop a single entry. LiteLLM keys every entry by the string mcp_byok_credential:<user_id>:<server_id>
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_credential_cache.py#L1-L38).
  When a user stores or deletes a BYOK credential, _invalidate_byok_cred_cache drops that key from the
  worker's cache with delete_cache and then publishes the same key, so peer workers drop it too
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/operations.py#L197-L201).
  The save and delete user-credential endpoints call it after their database write
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2446-L2483),
  and so does the BYOK OAuth callback, to clear a cached "no credential" answer
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L915-L921).
  Without that evict, betterlite keeps serving the old credential, or the old absence, for up to 60
  seconds after the user changes it. The fix keys entries by LiteLLM's string, so entries becomes
  Mutex<HashMap<String, (CachedByokCredential, Instant)>>. A new method
  invalidate_byok_credential(&self, user_id: &str, server_id: &str) -> String builds the key, removes
  that one entry and returns the key. Its later caller publishes the returned string, the same way
  LiteLLM publishes cache_key. get_cached_byok_credential and cache_byok_credential build the same
  string. A colon inside an id makes the key ambiguous. LiteLLM joins the parts this way on purpose so
  peers can evict by the published string, and betterlite keeps it.


  Gap two. The byok-cache-key oracle case can't fail today. The ByokCacheKey arm in
  tools/oracle/src/helpers/mcp/b4650.rs formats "{CACHE_KEY_PREFIX}:{user_id}:{server_id}" itself and
  calls no crate code, so a wrong key in byok_cache.rs leaves the case green. The arm must build a
  ByokCredentialCache (BYOK_CREDENTIAL_CACHE_MAX_SIZE, BYOK_CREDENTIAL_CACHE_TTL_SECS, SystemClock, an
  empty map) and answer the key that invalidate_byok_credential returns. byok-cache-key.yaml itself
  stays as it is. A new helper function byok_cache_evict takes user_id, server_id and credential (a
  string or null). It caches the credential, reads it back, evicts the pair and reads it again. The
  Python side calls cache_byok_credential and get_cached_byok_credential, then
  byok_credential_cache.delete_cache(byok_credential_cache_key(user_id, server_id)), the same two lines
  operations.py runs before it publishes. The Rust side calls cache_byok_credential,
  get_cached_byok_credential and invalidate_byok_credential. Both answer
  {"cached_before": true, "cached_after": false} and never echo the credential.


  Gap three. No test pins the config defaults to their values. illegal_state_unrepresentable in
  auth_config/tests.rs builds an AwsSigV4Config from DEFAULT_AWS_SIGV4_SERVICE and then asserts that
  config.service equals DEFAULT_AWS_SIGV4_SERVICE, so it passes for any value of the constant. It must
  compare config.service with the literal "bedrock-agentcore". The auth-config-variants case can't
  catch a wrong default either, since auth_config_variants answers only the kind. LiteLLM's defaults
  are profile rfc8693 and subject_token_type urn:ietf:params:oauth:token-type:access_token for
  TokenExchangeConfig
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L312-L313,
  value at https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp.py#L60),
  signing_alg RS256 for PrivateKeyJwtAuth and subject_token_type
  urn:ietf:params:oauth:token-type:id_token for IdJagConfig
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L322-L359),
  and service bedrock-agentcore with credentials Ambient for AwsSigV4Config
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L440-L449).
  auth_config_variants grows a defaults object on both sides. For token_exchange it holds profile and
  subject_token_type. For id_jag it holds subject_token_type and signing_alg, so both builders switch
  the id_jag client_auth from ClientSecretAuth to PrivateKeyJwtAuth with a placeholder private_key and
  no key_id. The Rust builder fills signing_alg from PRIVATE_KEY_JWT_SIGNING_ALG. For aws_sigv4 it
  holds service and credentials, where credentials is the source tag: "ambient", "static_keys" or
  "assume_role". Every other kind answers an empty defaults object.
scope:
  paths:
    - crates/betterlite-mcp/src/credential_contracts/byok_cache.rs
    - crates/betterlite-mcp/src/credential_contracts/byok_cache/tests.rs
    - crates/betterlite-mcp/src/credential_contracts/auth_config/tests.rs
    - tools/oracle/src/helpers/mcp/b4650.rs
    - tools/oracle/src/helpers/mcp/b4650/tests.rs
    - tools/oracle/helpers/b4650.py
    - tools/oracle/cases/helpers/credential-contracts/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_credential_cache.py#L1-L38
    why: The mcp_byok_credential prefix, the string key from byok_credential_cache_key, and the get and cache functions that both use it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/operations.py#L197-L201
    why: _invalidate_byok_cred_cache drops one key from the local cache, then publishes the same key to peer workers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/in_memory_cache.py#L268-L269
    why: delete_cache removes exactly one key and leaves the rest of the cache alone.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2446-L2483
    why: The save and delete user-credential endpoints invalidate the cached credential right after the database write.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L915-L921
    why: The BYOK OAuth callback invalidates a cached negative result so the user isn't blocked for the TTL.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/auth_cache_invalidation_pubsub.py#L207-L218
    why: A peer worker deletes the published key from each additional in-memory cache. proxy_server.py L8228 passes byok_credential_cache as one of them, so the key must match byte for byte.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L312-L313
    why: TokenExchangeConfig defaults profile to rfc8693 and subject_token_type to DEFAULT_SUBJECT_TOKEN_TYPE.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp.py#L60
    why: DEFAULT_SUBJECT_TOKEN_TYPE is urn:ietf:params:oauth:token-type:access_token.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L322-L359
    why: PrivateKeyJwtAuth defaults signing_alg to RS256 (L329) and IdJagConfig defaults subject_token_type to the id_token URN (L359).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L440-L449
    why: AwsSigV4Config defaults service to bedrock-agentcore and credentials to Ambient().
dod:
  - text: >-
      ByokCredentialCache stores entries under LiteLLM's key. entries_are_keyed_by_litellms_cache_key
      caches a credential for ("user-1", "server-1"), finds "mcp_byok_credential:user-1:server-1" in
      entries, and gets that same literal back from invalidate_byok_credential.
    proof:
      - byok-cache-litellm-key
  - text: >-
      invalidate_byok_credential drops one pair before its TTL ends and leaves the others.
      invalidate_drops_one_entry_before_its_ttl uses a FixedClock that never advances, caches a stored
      credential for two users on one server and a None credential for a third, invalidates the first
      and the third, and then gets None for both of them and the stored credential for the second.
      Every other test in credential_contracts still passes with the String key.
    proof:
      - byok-cache-invalidate
  - text: >-
      The byok-cache-key case runs crate code. The ByokCacheKey arm answers the key that
      invalidate_byok_credential returns and no longer formats the key itself, so the case fails when
      byok_cache.rs builds a different key than LiteLLM.
    proof:
      - case-byok-cache-key
      - oracle
  - text: >-
      byok-cache-evict-stored.yaml (user_id user-evict-stored, credential stored-key) and
      byok-cache-evict-absent.yaml (user_id user-evict-absent, credential null) call byok_cache_evict, and
      both sides answer {"cached_before": true, "cached_after": false} without the credential.
    proof:
      - case-byok-cache-evict
      - helper-python
      - oracle
  - text: >-
      auth_config_variants answers a defaults object on both sides. auth-config-token-exchange-defaults.yaml
      and auth-config-aws-sigv4-defaults.yaml are new, and the existing auth-config-variants.yaml (id_jag,
      now with PrivateKeyJwtAuth) compares its defaults too. Each fails when a betterlite default
      differs from LiteLLM's.
    proof:
      - case-auth-config-defaults
      - helper-python
      - oracle
  - text: >-
      illegal_state_unrepresentable compares config.service with the literal "bedrock-agentcore" in place
      of DEFAULT_AWS_SIGV4_SERVICE, so it fails when the constant changes.
    proof:
      - aws-service-literal
checks:
  optional: [mutants]
  commands:
    - id: byok-cache-litellm-key
      why: the BYOK cache keys entries by a tuple or by a string that differs from mcp_byok_credential:<user_id>:<server_id>
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^credential_contracts::byok_cache::tests::entries_are_keyed_by_litellms_cache_key$/)'
    - id: byok-cache-invalidate
      why: the BYOK cache has no single-entry evict, so a changed credential or a cached absence stays served until its TTL ends
      run: grep -q 'pub fn invalidate_byok_credential' crates/betterlite-mcp/src/credential_contracts/byok_cache.rs && grep -q 'fn invalidate_drops_one_entry_before_its_ttl' crates/betterlite-mcp/src/credential_contracts/byok_cache/tests.rs && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^credential_contracts::/)'
    - id: case-byok-cache-key
      why: the byok-cache-key case compares a key the adapter formats itself, so a wrong crate key stays green
      run: grep -qF '.invalidate_byok_credential(' tools/oracle/src/helpers/mcp/b4650.rs && ! grep -qF 'format!("{CACHE_KEY_PREFIX}' tools/oracle/src/helpers/mcp/b4650.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::replays_b4650_against_litellm::case_[0-9]+_byok_cache_key$/)'
    - id: case-byok-cache-evict
      why: no oracle case evicts one BYOK entry and compares the result with LiteLLM's delete_cache
      run: test "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/credential-contracts/byok-cache-evict-stored.yaml tools/oracle/cases/helpers/credential-contracts/byok-cache-evict-absent.yaml | wc -l)" -eq 2 && grep -q 'case::byok_cache_evict_stored' tools/oracle/src/helpers/mcp/b4650/tests.rs && grep -q 'case::byok_cache_evict_absent' tools/oracle/src/helpers/mcp/b4650/tests.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::replays_b4650_against_litellm::case_[0-9]+_byok_cache_evict_(stored|absent)$/)'
    - id: case-auth-config-defaults
      why: the auth_config_variants answer carries only the kind, so a wrong default in any config stays green
      run: test "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/credential-contracts/auth-config-token-exchange-defaults.yaml tools/oracle/cases/helpers/credential-contracts/auth-config-aws-sigv4-defaults.yaml | wc -l)" -eq 2 && grep -q '"defaults"' tools/oracle/src/helpers/mcp/b4650.rs && grep -q '"defaults"' tools/oracle/helpers/b4650.py && grep -q 'PrivateKeyJwtAuth' tools/oracle/helpers/b4650.py && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::replays_b4650_against_litellm::case_[0-9]+_auth_config_(variants|token_exchange_defaults|aws_sigv4_defaults)$/)'
    - id: helper-python
      why: the b4650 adapter has no byok_cache_evict arm or fails strict Python checks
      run: grep -q '"byok_cache_evict"' tools/oracle/helpers/b4650.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: aws-service-literal
      why: illegal_state_unrepresentable compares the AWS service with the constant it was built from, so it passes for any value
      run: grep -qF 'assert_eq!(config.service, "bedrock-agentcore");' crates/betterlite-mcp/src/credential_contracts/auth_config/tests.rs && ! grep -qF 'assert_eq!(config.service, DEFAULT_AWS_SIGV4_SERVICE)' crates/betterlite-mcp/src/credential_contracts/auth_config/tests.rs && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^credential_contracts::auth_config::tests::illegal_state_unrepresentable$/)'
oracle_cases:
  - tools/oracle/cases/helpers/credential-contracts/result-union.yaml
  - tools/oracle/cases/helpers/credential-contracts/auth-spec-kind.yaml
  - tools/oracle/cases/helpers/credential-contracts/auth-config-variants.yaml
  - tools/oracle/cases/helpers/credential-contracts/auth-config-token-exchange-defaults.yaml
  - tools/oracle/cases/helpers/credential-contracts/auth-config-aws-sigv4-defaults.yaml
  - tools/oracle/cases/helpers/credential-contracts/token-auth-normalize.yaml
  - tools/oracle/cases/helpers/credential-contracts/token-auth-build-basic.yaml
  - tools/oracle/cases/helpers/credential-contracts/token-auth-build-post.yaml
  - tools/oracle/cases/helpers/credential-contracts/byok-cache-key.yaml
  - tools/oracle/cases/helpers/credential-contracts/byok-cache-evict-stored.yaml
  - tools/oracle/cases/helpers/credential-contracts/byok-cache-evict-absent.yaml
deviations: []
out_of_scope:
  - Padded one-line functions anywhere in credential_contracts or the b4650 adapter. They belong to B5094, the task clearing the no-one-line-functions and no-padded-one-line-functions legacy lists. This task does not touch .ast-grep/rules/.
  - Calling invalidate_byok_credential and publishing its key. _invalidate_byok_cred_cache in operations.py belongs to B136, the endpoints that call it belong to the tasks that cover mcp_management_endpoints.py and byok_oauth_endpoints.py, and the publish goes through B878.
  - Wiring the BYOK cache into the auth cache invalidation subscriber as an additional in-memory cache (proxy_server.py L8228). B878 owns the subscriber; this task only makes the stored key match the string a peer receives.
  - InMemoryCache details the review did not raise and no client can see with LiteLLM's call pattern. LiteLLM expires an entry when the clock passes its TTL, not when it reaches it, keeps a live TTL on a repeat set, and evicts the earliest expiry even for a key already present. _get_byok_credential only caches after a miss, so none of these changes what a caller gets.
pitfalls:
  - The key is exactly mcp_byok_credential:<user_id>:<server_id> joined with single colons and no escaping, and a peer's evict only works when the strings match byte for byte.
  - A separate one-line key function or remove(key) wrapper fails no-one-line-functions, and the legacy lists in .ast-grep/rules/ are not this task's to edit, so get, cache and invalidate each build the key inline.
  - invalidate_byok_credential must lock entries with the same PoisonError::into_inner handling that get_cached_byok_credential and cache_byok_credential already use.
  - InMemoryCache is untyped, so b4650.py reaches delete_cache through a typing.Protocol and cast("...", byok_credential_cache), the way tools/oracle/helpers/local_ttl_cache.py does, and not through a pyright ignore.
  - The Python byok_cache_evict arm works on LiteLLM's module-level byok_credential_cache, so each evict case uses its own user_id and the arm always evicts what it cached.
  - The byok_cache_evict answer holds two booleans only; a credential in it would land in the answer cache under target/oracle-answers.
  - The Python credential field is str or None, checked with isinstance like the token_auth_build arm; the Rust Input variant takes Option<String> with serde default.
  - TokenExchangeProfile has no string form, so the Rust adapter maps Rfc8693 to "rfc8693" and EntraObo to "entra_obo" in a match; Python answers config.profile as is.
  - The Python aws_sigv4 answer reads config.credentials.source, and the Rust answer matches AwsCredentialSource with one arm per variant and no wildcard.
  - The oracle answer cache hashes tools/oracle/helpers/b4650.py, so every b4650 case asks LiteLLM again once after the adapter changes.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
