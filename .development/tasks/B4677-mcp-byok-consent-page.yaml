id: B4677
title: MCP BYOK consent page
description: >-
  Implement the BYOK (Bring Your Own Key) OAuth 2.1 authorization endpoint for MCP servers: session validation and authorization code storage for the two-step consent flow where users enter their API key to authorize LiteLLM access to an MCP server. The GET /v1/mcp/oauth/authorize endpoint (unauthenticated) validates OAuth parameters and renders an HTML form. The POST endpoint requires a valid UI session cookie (master-key-signed HS256 JWT), stores a short-lived authorization code (5-minute TTL, 1000-entry capacity limit), and redirects with the code for token exchange (B4678).

  Session identity comes from the UI token cookie with claims: exp (required), login_method ("sso" or "username_password"), and type (rejected if "byok_session"). Session keys starting with sk- are re-resolved against the database to catch revoked sessions from logout or password change, using the session-key DB liveness lookup (get_key_object, hash_token).

  The authorization code store is in-memory with a 300-second TTL per code and a 1000-entry capacity limit; lazy cleanup runs on each request to prevent memory exhaustion. RFC 6749 requirements enforced: response_type must be "code", code_challenge is required, redirect_uri must be a loopback address (127.0.0.1, ::1, localhost over http/https), and client_id is recorded for later verification by B4678. The POST response is a 302 redirect to redirect_uri?code=...&state=... (with & if redirect_uri has existing query string).

scope:
  paths:
    - Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-mcp/**
    - tools/oracle/helpers/b4677.py
    - tools/oracle/helpers/b4677/**
    - tools/oracle/src/helpers/server/b4677.rs
    - tools/oracle/src/helpers/server/b4677/**
