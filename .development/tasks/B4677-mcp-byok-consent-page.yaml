deviations:
  - what: "betterlite renders error responses for invalid parameters (missing code_challenge, invalid response_type, invalid redirect_uri) with betterlite's own error format, not LiteLLM's Python library message names."
    why: "Consistency with betterlite's error responses, and LiteLLM's error messages reference the Python library name."

  - what: "The authorization code store is in-memory HashMap with time-based expiration; no distributed backend is used."
    why: "Matches LiteLLM's single-proxy design. Multi-proxy support with shared state is deferred to B4658 or later tasks."

out_of_scope:
  - "HTML form builder (_build_authorize_html, lines 187-644): Split into B4687 per call-graph split rule."
  - "_user_id_from_session_cookie (lines 85-88): thin wrapper over _session_identity_from_cookie, returns user_id; called from B136's discoverable_endpoints.py lines 425/428, 904/913. Owned by B4678 (shares this file)."
  - "PKCE verification (_verify_pkce function, checking code_verifier against stored code_challenge). Owned by B4678."
  - "OAuth error response formatting (_oauth_token_error). Owned by B4678."
  - "Token endpoint (POST /v1/mcp/oauth/token). Owned by B4678."
  - "OAuth metadata discovery endpoints (/.well-known/oauth-authorization-server, /.well-known/oauth-authorization-server/.../v1/mcp/oauth, /.well-known/oauth-authorization-server/{root_path:path}/v1/mcp/oauth). Owned by B4678."
  - "GET /v1/mcp/oauth/protected-resource (byok_protected_resource_metadata). Owned by B4678."
  - "store_user_credential database write (persisting the credential from the API key field). Owned by B4658."
  - "global_mcp_server_manager and MCP registry lookup (ServerConfig metadata retrieval). Owned by B136."
  - "Session-key DB liveness lookup (get_key_object, hash_token utilities). Owned by B738."
  - "get_request_base_url and validate_loopback_redirect_uri utilities. Owned by B4654."
  - "master_key global. Owned by proxy core config."

pitfalls:
  - "The HTML string is 450+ lines with nested CSS and JavaScript; double-braces {{ }} in CSS must escape single braces correctly in Rust string interpolation to avoid format string collisions."
  - "Session identity extraction requires HS256 decryption with master_key; reject if exp claim is missing (use jwt library's require=[\"exp\"] equivalent) or if payload type equals \"byok_session\"."
  - "The session_key field is optional; older tokens may not have it. Only sk- prefixed keys are looked up against the database; non-sk- tokens pass through."
  - "Authorization codes expire after exactly 300 seconds; test timing must account for clock skew (use frozen_time or similar in tests)."
  - "The capacity limit check for auth code store happens before a new code is generated; at 1000 entries, the next POST is rejected with 503 Service Unavailable."
  - "redirect_uri query string handling: if redirect_uri already contains a query string, use & instead of ? to append code and state parameters."
  - "The form parameters (client_id, redirect_uri, code_challenge, state, server_id) are POST form inputs (not from query parameters); they must be validated in the POST request."
  - "HTML escape function in Rust must match Python's html.escape behavior: escape &, <, >, \", ' characters."
  - "LiteLLM's MCP registry lookup can fail silently (wrapped in try/except); fallback to defaults (server_name=\"MCP Server\", empty access items, empty help URL) instead of returning an error."

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
