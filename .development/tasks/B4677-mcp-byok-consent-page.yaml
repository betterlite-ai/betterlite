  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/oauth_utils.py
    why: >-
      validate_loopback_redirect_uri utility (allows 127.0.0.1, ::1, localhost over http/https);
      get_request_base_url to extract host/port from request

dod:
  - text: The GET /v1/mcp/oauth/authorize endpoint is unauthenticated and returns HTML form with hidden inputs for client_id, redirect_uri, code_challenge, code_challenge_method, state, server_id.
    proof: [byok-consent-get]

  - text: GET /v1/mcp/oauth/authorize validates response_type=code, requires code_challenge, and validates redirect_uri is a loopback address (127.0.0.1, ::1, localhost over http/https), returning 400 for each violation.
    proof: [byok-consent-get, oracle]

  - text: GET /v1/mcp/oauth/authorize resolves server metadata (name, description items, help URL) from the MCP registry using server_id; fallback to "MCP Server" when registry lookup fails.
    proof: [byok-consent-get, mcp-registry]

  - text: The HTML form has two steps (step 1 overview, step 2 API key entry) with progress dots, logos, close button, navigation buttons, access checklist, API key field, save-key toggle with duration pills, and security note.
    proof: [byok-consent-get, form-structure]

  - text: All user-supplied and externally-derived values in the HTML (server_name, client_id, redirect_uri, state, server_id) are HTML-escaped to prevent injection attacks.
    proof: [byok-consent-get, xss-test]

  - text: POST /v1/mcp/oauth/authorize requires a valid UI session cookie (HS256 JWT with master_key, exp claim, login_method in [sso, username_password], type != byok_session), returning 401 login_required without a valid cookie.
    proof: [session-auth, oracle]

  - text: Session keys starting with sk- are re-resolved against the database to validate liveness; non-sk- EXPERIMENTAL_UI_LOGIN tokens bypass the DB check and pass through.
    proof: [session-auth, session-liveness]

  - text: POST /v1/mcp/oauth/authorize validates redirect_uri matches the request, code_challenge_method is S256, stores auth code with api_key, server_id, code_challenge, redirect_uri, client_id, user_id, and expires_at (now + 300 seconds).
    proof: [byok-consent-post, oracle]

  - text: POST /v1/mcp/oauth/authorize returns 503 if authorization code store is at capacity (1000 entries), preventing memory exhaustion from burst of abandoned flows.
    proof: [byok-consent-post, auth-code-limit]

  - text: Authorization codes expire after 300 seconds and are purged lazily on the POST request; expired codes are deleted and cannot be reused.
    proof: [byok-consent-post, auth-code-ttl]

  - text: POST /v1/mcp/oauth/authorize returns 302 redirect to redirect_uri with Location header containing code and state query parameters (& separator if redirect_uri has existing query string).
    proof: [byok-consent-post, oracle]

  - text: Every oracle case matches LiteLLM on HTML form rendered, authorization code stored, redirect URL, and all HTTP response headers, status codes and error bodies.
    proof: [byok-oracle-cases]

checks:
  optional: []
  commands:
    - id: byok-consent-get
      why: GET /v1/mcp/oauth/authorize does not exist, does not render HTML form, or does not validate parameters
      run: cargo nextest run --locked -p betterlite-server -p betterlite-mcp --no-tests=fail -E 'test(/^byok_consent::.*get/)'

    - id: byok-consent-post
      why: POST /v1/mcp/oauth/authorize does not exist, does not validate session, or does not store auth codes
      run: cargo nextest run --locked -p betterlite-server -p betterlite-mcp --no-tests=fail -E 'test(/^byok_consent::.*post/)'

    - id: session-auth
      why: session cookie parsing, validation or liveness check is missing or incorrect
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^byok_session_auth::/)' -E 'test(/^session_identity::/)'

    - id: session-liveness
      why: session key re-resolution against database is missing or does not reject revoked sessions
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^session_key_is_live::/)'

    - id: form-structure
      why: HTML form does not have two-step layout, navigation, progress dots, or other required elements
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^build_authorize_html::/)'

    - id: xss-test
      why: HTML form does not escape user-supplied and externally-derived values
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^byok_consent::.*escape/)'

    - id: mcp-registry
      why: server metadata resolution from MCP registry is missing or incorrect
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^mcp_registry_resolve::/)'

    - id: auth-code-limit
      why: authorization code capacity limit (1000 entries) is not enforced
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^auth_code_limit::/)'

    - id: auth-code-ttl
      why: authorization code expiration (300 seconds) or lazy cleanup is missing
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^auth_code_ttl::/)'

    - id: byok-oracle-cases
      why: oracle cases fail or the GET/POST endpoints do not match LiteLLM on HTML form, auth codes, redirects, headers or error responses
      run: cargo run --locked --quiet -p betterlite-oracle -- --self-check tools/oracle/cases/mcp/byok-consent/ 2>&1 | grep -q "PASS.*byok-consent"

