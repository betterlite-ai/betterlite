      non-sk- EXPERIMENTAL_UI_LOGIN tokens bypass DB check and pass through on 10-minute lifetime

  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L174-L184
    why: >-
      BYOK session auth dependency (_byok_session_auth): validates session identity and liveness,
      returns 401 login_required on failure


  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L70-L74
    why: >-
      Lazy cleanup of expired authorization codes (_purge_expired_codes): called on each POST to
      delete entries with expires_at < now

  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L704-L768
    why: >-
