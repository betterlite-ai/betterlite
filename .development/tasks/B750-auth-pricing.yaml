id: B750
title: Priced and zero-cost model admission
description: >-
  Determine free versus unpriced models using B013's raw cost map and B302's catalog. None model/router
  is not free; an empty model list with a router is free. All model candidates must pass. Only use a
  dict _zero_cost_cache on this router instance; cached False exits, True skips lookup. Missing group,
  None input/output prices, positive prices, absent explicit raw price keys or PTU pricing each logs
  DEBUG and caches False. Explicit means either token-price key exists in model_cost[model_info.id],
  even if its raw value is None; resolved prices must still be nonnull. PTU means both ptu_count and
  cost_per_ptu_per_hour are nonnull, even zero. Resolve aliases through the same catalog in both
  checks. Successful free checks log and cache True; exceptions log and return False without caching.
  Preserve >0 rather than !=0 comparisons, including negative/nonfinite edge inputs, with typed
  numeric classifications and Decimal for finite money. Explicit-cost/PTU/success logs strip CR/LF
  from model names. B302 invalidates the per-router cache on add/remove/upsert, including price changes.

  Unpriced detection returns False for a falsey model/router or unknown group. Any litellm_params
  key containing cost_per or equal to tiered_pricing declares a price even at zero/null. Otherwise
  resolved model info counts nonnull tiered_pricing or a positive numeric non-bool cost_per value,
  including one-level nested dict values; strings and deeper nesting do not count. A group with
  neither that nor explicit raw token pricing is unpriced. Keep model order and duplicates; the
  diagnostic distinguishes singular/plural and names block_requests_for_models_without_pricing and
  input_cost_per_token/output_cost_per_token. B754 owns that switch and rejection, not this detector.

  Project checks skip missing project, reject blocked is True with an ordinary Exception, apply B886
  model grants for truthy model/nonempty project.models with B747 key aliases, then B752 hard before
  soft budget unless skipped. Earlier failures stop subsequent checks. enforce_user_param=false
  requires user presence only for POST LLM routes excluding B868 MCP routes; null/empty user counts
  as present. Missing user raises an ordinary auth exception. reject_clientside_metadata_tags=false
  rejects an LLM request with dict metadata containing tags, including null/empty tags, using
  400 bad_request_error, param metadata.tags, code 400. litellm_metadata is not inspected here.
  B757 maps ordinary project/user errors to 401 auth_error, param string None.

  litellm_settings.max_budget defaults 0. Enforce only positive finite values with known global spend,
  enabled budget checks and an LLM route other than /models or /v1/models. Strictly greater spend
  raises BudgetExceededError entity_type=proxy; equality passes. B757 owns its default 422 envelope.
  Own L888-L909 route constants: discovery /v1/models, /models, /model/info, /v1/model/info,
  /v2/model/info, /model_group/info, /utils/model_info; side effects /health, /health/services,
  /health/test_connection, /auto_router/test_routing. Other non-LLM routes skip budgets. The combined
  request predicate short-circuits on that route result, then applies zero-cost, which can still
  exempt a side-effect route. These functions neither calculate cost nor write spend.


  Build the production auth_pricing module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _get_router_zero_cost_cache (L438-L451; 13 source lines), _is_model_cost_zero (L454-L560; 79 source
  lines), _has_ptu_flat_cost (L567-L581; 13 source lines), _is_cost_explicitly_configured (L584-L607;
  22 source lines), _is_positive_cost (L613-L614; 2 source lines), _entry_has_priced_metric (L617-L627;
  11 source lines), _entry_declares_price (L630-L631; 2 source lines), _model_group_has_pricing (L634-L656;
  20 source lines), model_has_no_cost_mapping (L659-L669; 8 source lines), _unpriced_models_in_request
  (L672-L676; 5 source lines), _unpriced_models_block_message (L679-L686; 8 source lines), _run_project_checks
  (L689-L732; 36 source lines), _enforce_user_param_check (L735-L747; 11 source lines), _reject_clientside_metadata_tags_check
  (L750-L765; 15 source lines), _global_proxy_budget_check (L768-L782; 15 source lines), route_skips_budget_checks
  (L912-L915; 4 source lines), request_skips_budget_checks (L918-L919; 2 source lines).


  Preserve the source's finite/nonfinite pricing predicates at the typed numeric boundary; do not
  round an unknown or nonfinite price into a zero-cost exemption.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.enforce_user_param=False;
  general_settings.reject_clientside_metadata_tags=False; litellm_settings.max_budget=0.0.


  Add the auth_pricing operation under B856 Management::auth. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-pricing-*
  seed to B171 helper_case, which already owns this decoder.


  Request-level checks run on POST /v1/chat/completions with the actual configured catalog and
  general settings. Assert the user-param, client-tag and global-budget envelopes separately;
  zero-cost classification alone is a helper result, not a fabricated successful HTTP response.


  Project cases use B860 on POSTGRES_TEST_URL or testcontainers, separating missing project,
  blocked project and explicit model grants from pricing-map fixtures.


  Config tests pricing_policy_defaults, enforce_user_loaded, reject_tags_loaded and proxy_budget_loaded
  invoke B002 with these exact nested keys and then production admission. There is no duplicate root
  key, dedicated env binding or generic invalid-value fallback. Retain nonfinite numeric classifications
  where the source branches on them; finite money is Decimal.


  B002 decodes pricing/settings records and B1100 decodes requests; these predicates do not add
  another JSON parser or contact a pricing URL.


  Sizing: 266 function lines plus 11 route literals; allow 260 production, 310 tests, 85 adapters,
  65 wiring and 65 config, 785 within 800. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_pricing::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
