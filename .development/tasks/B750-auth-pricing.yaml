      nondict_cache_ignored, missing_group_debug_false, undefined_price_false,
      positive_price_false, explicit_raw_key_required, aliases_same_deployments,
      null_raw_key_still_explicit, ptu_zero_values_not_free, negative_nonfinite_price_edges,
      all_models_required, exception_not_cached, safe_name_diagnostics and refresh_clears_cache.'
    proof:
      - behavior-tests
  - text: 'Pricing cases: override_key_declares_price, null_tiered_override_declares,
      resolved_tiered_nonnull_priced, nested_positive_metric, bool_string_not_price,
      deep_nested_not_price, unknown_group_not_unpriced, duplicates_order_kept and singular_plural_message.
      Project/request cases: blocked_project_first, grant_before_budgets, hard_before_soft,
      skip_keeps_model_check, post_user_presence, null_user_present, mcp_user_exempt,
      tags_presence_rejected, non_llm_tags_ignored and litellm_metadata_unchecked.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Budget cases: zero_negative_budget_disabled, nonfinite_budget_no_rejection,
      missing_spend_skips, equal_budget_allowed, proxy_budget_error_fields,
      models_aliases_exempt, each_discovery_route, each_side_effect_route,
      other_non_llm_skips and free_side_effect_exemption. HTTP cases pin ordinary auth
      401, metadata.tags 400 and budget_exceeded 422 envelopes.'
    proof: [behavior-tests, stage-wiring-tests, oracle]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(/^(auth::)?auth_pricing::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_pricing.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-pricing-*")"
        && grep -rlq "auth_pricing" tools/oracle/fuzz/corpus/helper_case/auth-pricing-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_pricing::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-pricing-*")"
        && grep -rlq "enforce_user_param" crates/betterlite-config/fuzz/corpus/config_yaml/auth-pricing-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_pricing::tests::/)
        - test(/replays_the_/)'
