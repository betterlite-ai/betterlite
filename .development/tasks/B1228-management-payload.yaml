id: B1228
title: Management effect payload sanitization
description: >-
  Build typed sanitized management event payloads, including nested record env-var values, before injected
  alert/span sinks see them. Preserve IDs and nonsecret names while redacting values; the source response
  returned to the caller is not modified by a logging copy.


  Build the production management_payload module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/utils.py:
  _object_mapping (L609-L611; 3 source lines), _object_list (L614-L616; 3 source lines), _redacted_env_var
  (L619-L626; 8 source lines), _redact_record_env_vars (L629-L647; 18 source lines), _redact_env_var_values
  (L650-L666; 15 source lines).


  Add the management_payload operation under B856 Management::models. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a management-payload-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: the owned redaction helpers plus alert/span projections fit 200 production, 180 behavior tests,
  100 helper adapters and 60 wiring lines, 540 estimated within a 600-line gate; fixture exclusions do
  not hide code.


  Also own send_management_endpoint_alert (L559-L606; 39 source lines), _emit_management_endpoint_otel_span
  (L669-L752; 71 source lines) in litellm/proxy/management_helpers/utils.py. Build the nine-function management
  event-to-alert mapping and preserve Unknown user/role fallbacks. For span projection, no logger or OTel
  v2 skips payload building; a missing http_request uses the function name and an empty request body.
  Remove credential fields key/token/api_key/secret/password/access_token/refresh_token/private_key/service_account_key
  from the response copy before nested env redaction. Preserve success/failure payloads and timestamps,
  then call injected ManagementAlertSink and ManagementSpanSink. B116 and B110 implement transports; B865
  calls these concrete projections before cache eviction. Consume a typed request snapshot from B003 instead
  of reparsing its body.
