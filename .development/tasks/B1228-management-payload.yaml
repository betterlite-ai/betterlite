dod:
  - text: 'Cover dict_and_list_only, env_entry_projection_and_nulls, dict_and_model_copy,
      arbitrary_object_unchanged, top_level_and_items_one_level, empty_and_malformed_slots,
      unchanged_caller_response, nine_alert_mappings, absent_logger_sink_unknown_function,
      unknown_actor_defaults, alert_kwargs_and_alias_preserved, alert_failure_propagates,
      legacy_span_without_request, request_route_and_body, otel_v2_skips_all_payload_work,
      top_level_credential_fields_only, response_conversion_failure_silent,
      success_null_result_and_failure_payload, timestamps_and_optional_parent_preserved,
      body_parser_failure_propagates and span_sender_failure_propagates.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Native orchestration tests prove the nine-event map, transport guards and silent response-conversion fallback.
    proof:
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^management_payload::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/management_payload.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/management-payload-*")"
        && grep -rlq "management_payload" tools/oracle/fuzz/corpus/helper_case/management-payload-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
