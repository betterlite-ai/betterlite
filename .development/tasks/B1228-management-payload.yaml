pitfalls:
  - 'The oracle helper for this task is pre-registered as management_payload in the server group. Replace the stub Op in tools/oracle/src/helpers/server/management_payload.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/management_payload.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Endpoints without http_request still need the legacy success/failure span ended using the function
    name.
  - OTel v2 skips the legacy payload entirely; do not emit it twice.
  - Strip top-level credential fields before nested env-var redaction and never mutate the caller response.
