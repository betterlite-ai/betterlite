id: B1228
title: Management effect payload sanitization
description: >-
  Prepare legacy management alerts and OTel payloads without mutating the caller's response. _object_mapping
  recognizes dict only; _object_list recognizes list only. _redacted_env_var reads dict keys or object
  attributes name, scope and description, defaulting each to None, and emits exactly those fields plus
  value="", dropping extra fields. _redact_record_env_vars only changes records whose env_vars is a list:
  shallow-copy dicts or model_copy a BaseModel, leaving other objects unchanged. _redact_env_var_values
  processes top-level env_vars and one items list, preserving item order; it does not recurse arbitrarily.
  Empty env lists remain empty, malformed/non-list slots pass through, and missing attributes become null.


  Build the production management_payload module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/utils.py:
  _object_mapping (L609-L611; 3 source lines), _object_list (L614-L616; 3 source lines), _redacted_env_var
  (L619-L626; 8 source lines), _redact_record_env_vars (L629-L647; 18 source lines), _redact_env_var_values
  (L650-L666; 15 source lines).


  Compare the pure redaction helpers under B856 Management::models using B171 helper_case. Native tests
  exercise alert/span orchestration with B110 span and B4030 alert transports and B1100's production request parsing;
  helper adapters must not invoke handlers or emulate asynchronous transport behavior.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 157 nonblank, noncomment owned source lines allow 200 production, 280 behavior tests,
  65 pure-helper adapters and 60 wiring lines, 605 estimated within a 650-line gate.


  Also own send_management_endpoint_alert (L559-L606; 39 source lines), _emit_management_endpoint_otel_span
  (L669-L752; 71 source lines) in litellm/proxy/management_helpers/utils.py. Build the nine-function management
  event-to-alert mapping: generate_key_fn/new_virtual_key_created, update_key_fn/virtual_key_updated,
  delete_key_fn/virtual_key_deleted, new_team/new_team_created, update_team/team_updated,
  delete_team/team_deleted, new_user/new_internal_user_created, user_update/internal_user_updated,
  delete_user/internal_user_deleted. Missing proxy logger or slack_alerting_instance and unknown functions
  skip alerts. VirtualKeyEvent uses caller user_id/user_role or literal Unknown, key_alias unchanged and
  request_kwargs unchanged. The displayed event_name replaces underscores with spaces and title-cases;
  alert_type retains the enum value. Await B4030's send_virtual_key_event_slack and propagate its error to B865, which owns the
  wrapper's suppression/logging policy. This function performs no extra credential redaction on alert kwargs.


  For spans, no logger or B110 is_otel_v2_enabled=true skips payload building, body parsing and sending.
  B110 owns LITELLM_OTEL_V2 (default false) parsing and cached resolution. With http_request, use B741
  get_request_route and await B1100 _read_request_body; otherwise use the function name and {}. Only on
  success with non-null result try dict(result), remove top-level key/token/api_key/secret/password/
  access_token/refresh_token/private_key/service_account_key, then redact env slots. Any conversion/redaction
  exception silently sets response=None; failure paths and result=None also carry response=None. Do not
  recurse into unrelated nested credentials or change the response returned to the route caller.
  ManagementEndpointLoggingPayload preserves route, request_data, start_time, end_time and exception;
  send the success or failure hook exactly once with parent_otel_span, even when that span is None.
  Body-parser and hook failures escape this function; only response conversion has a local catch. B110/B4030
  own transport formatting and final log redaction; B865 owns invocation order relative to cache eviction.
