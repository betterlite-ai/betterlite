id: B3738
title: Purview Graph authentication scopes and trusted identity
description: >-
  Build the Microsoft Graph OAuth2 client, token caching with 60-second expiry margin,
  and protected scope computation with one-hour LRU caching. Implement user identity
  resolution with trust levels: key/JWT-bound identities (highest priority) separate
  from caller-supplied hints. Handle policy-change invalidation, ETag-driven cache
  coherence and text extraction for DLP evaluation across message types and tool calls.

  In betterlite-guardrails, build the base class `PurviewGuardrailBase` with:
  - OAuth2 token acquisition via client-credentials flow with 60-second expiry margin
    and recomputation after await.
  - Synchronous cache lock (threading.Lock) valid across both async event loops
    (proxy main loop and logging-hook fallback) with no awaits under lock.
  - Protection scope cache as LRU (OrderedDict, 1000-entry capacity) with per-user
    ETag tracking and TTL (3600 seconds, one hour per Microsoft).
  - Policy-change invalidation: when Graph returns protectionScopeState='modified',
    clear that user's scope cache entry.
  - User ID resolution with trust hierarchy: UserAPIKeyAuth.user_id (key/JWT-bound),
    then end_user_id (caller request hint, never trusted for blocking), then
    metadata proxies. Separate trusted-only resolver for blocking DLP.
  - Helper to extract plaintext from tool_calls and function_call arguments
    (both request-path and response-path shapes, dict-style and object-style).
  - Support for OpenAI /v1/completions token-id and string prompts: skip token-id
    lists (no plaintext for Purview), concatenate string lists, mix string/token
    lists by extracting only strings.
  - Completion and chat message text concatenation with \\n\\n separators to preserve
    pattern matching across message boundaries.

