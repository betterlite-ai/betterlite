deviations:
  - what: "Threading lock instead of async lock for scope and token caches. The source holds one lock across both the main asyncio event loop and a separate event loop created by logging_hook thread fallback, which is incompatible with asyncio.Lock due to runtime binding in Python 3.10+."
    why: "betterlite uses std::sync::Mutex for synchronous in-memory dict operations with no awaits under lock, avoiding the event-loop binding issue and supporting both contexts."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/base.py#L76-L83"
  - what: "Policy action evaluation for blocking checks @odata.type field for 'restrictAccessAction' substring and action field for 'restrictAccess' literal."
    why: "LiteLLM's behavior is preserved: both conditions trigger the block check. Rust pattern matching on the same conditions ensures parity."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/base.py#L365-L376"

out_of_scope:
  - "Graph API _graph_post implementation (owned by B173, HTTP client acquisition and POST)"
  - "CustomGuardrail constructor and cooperative super().__init__ call (belongs to B104)"
  - "Standard guardrail logging integration (belongs to B104)"
  - "Configuration environment variable resolution for tenant_id, client_id, client_secret (belongs to B002/B129)"
  - "Purview DLP evaluation logic and hook registration (belongs to B3739, B3740)"
  - "Entra OBO token acquisition for Agent 365 (belongs to B3741)"

pitfalls:
  - "std::sync::Mutex is used instead of tokio::sync::Mutex because scope and token cache operations must succeed from both the main asyncio event loop and logging_hook's created event loop. A synchronous Rust Mutex protects only in-memory dict ops with no awaits inside the lock."
  - "Protection scope cache TTL is 3600 seconds (one hour) per Microsoft Purview recommendations. Token cache margin is exactly 60 seconds: token is valid from time.time() + expires_in, recomputed after await."
  - "User ID resolution _resolve_user_id walks all four sources and returns the first non-None; _resolve_trusted_user_id returns only UserAPIKeyAuth.user_id (omits end_user_id and metadata hints). Separate function _resolve_user_id_from_logging_kwargs reads only proxy-injected user_api_key_user_id."
  - "Tool call argument extraction handles both dict and object message representations (hasattr/getattr fallback) and both tool_calls array and legacy function_call field. Arguments must be stripped and non-empty."
  - "Completion prompts carrying token IDs (int lists, mixed lists with int sub-arrays) return None and log at debug level; string lists are \\n-joined; mixed string/int lists filter to strings only. Empty results return None."
  - "Chat message concatenation uses \\n\\n separators (not \\n alone) to preserve pattern matching across message boundaries. Each message extracts content via convert_content_list_to_str plus tool call arguments."
  - "ETag is read from response headers case-insensitively (etag or ETag). When cached entry exists and TTL not expired, move it to end of OrderedDict (move_to_end). Evict least-recently-used (popitem(last=False)) when cache exceeds 1000 entries."
  - "HTTP graph API base is https://graph.microsoft.com/v1.0, token endpoint is https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token, scope is https://graph.microsoft.com/.default."
  - "Policy-change invalidation: when processContent response has protectionScopeState='modified', pop the user_id from _scope_cache under lock. Next call recomputes scopes."
  - "Graph POST headers use Authorization: Bearer {token} and Content-Type: application/json. ETag If-None-Match is sent only when cached etag is non-empty."

