checks:
  optional:
  - mutants
  commands:
  - id: case-configured-gateway-required
    why: The configured-gateway-required behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_configured_gateway_required$/)'
  - id: case-websearch-tool-suffix
    why: The websearch-tool-suffix behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_websearch_tool_suffix$/)'
  - id: case-query-list-and-200-char-cap
