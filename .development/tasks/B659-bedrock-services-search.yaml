      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_search_config_cases::case_[0-9]+_loads_agentcore_search_tool_name$/)'
      && grep -lq 'AGENTCORE_SEARCH_TOOL_NAME' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_search*
  - id: config-agentcore-mcp-protocol-version
    why: The AGENTCORE_MCP_PROTOCOL_VERSION setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_search_config_cases::case_[0-9]+_loads_agentcore_mcp_protocol_version$/)'
      && grep -lq 'AGENTCORE_MCP_PROTOCOL_VERSION' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_search*
  - id: config-unknown-key
