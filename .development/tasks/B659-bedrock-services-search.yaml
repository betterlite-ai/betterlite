    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::search_cases::case_[0-9]+_mcp_tool_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_search.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_search*")"
      && grep -lq 'bedrock_services_search' tools/oracle/fuzz/corpus/helper_case/bedrock_services_search* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_search$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_search)"
      && grep -q 'decode_mcp_search_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_search.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_search_corpus$/)'
  - id: config-agentcore-gateway-url
    why: The AGENTCORE_GATEWAY_URL setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_services_search_config_cases::case_[0-9]+_loads_agentcore_gateway_url$/)'
      && grep -lq 'AGENTCORE_GATEWAY_URL' crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_services_search*
  - id: config-agentcore-search-tool-name
