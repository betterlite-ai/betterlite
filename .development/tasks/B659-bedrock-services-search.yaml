  why: >-
    Own _gateway_host_match, _credential_safe_transport, _string_field, _to_search_result, _result_items, _parse_result_items,
    _iter_sse_events, AgentCoreSearchConfig.__init__, AgentCoreSearchConfig.ui_friendly_name, AgentCoreSearchConfig.validate_environment,
    AgentCoreSearchConfig.get_complete_url, AgentCoreSearchConfig.transform_search_request, AgentCoreSearchConfig.sign_request,
    AgentCoreSearchConfig._is_configured_gateway, AgentCoreSearchConfig._signing_region, AgentCoreSearchConfig.transform_search_response,
    AgentCoreSearchConfig._tool_error_message, AgentCoreSearchConfig._text_blocks, AgentCoreSearchConfig._parse_mcp_body,
    AgentCoreSearchConfig.get_error_class. Other functions in this file remain with the owners listed below.
