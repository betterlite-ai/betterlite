id: B659
title: Bedrock AgentCore MCP web search
description: >-
  Add AgentCoreSearchRequest/Reply and configured gateway auth. Load AGENTCORE_GATEWAY_URL (required), AGENTCORE_SEARCH_TOOL_NAME
  (web-search-tool___WebSearch) and AGENTCORE_MCP_PROTOCOL_VERSION (2025-03-26) in config. Preserve maxResults=10,
  query truncation to 200 characters, JSON-RPC id=1, ___WebSearch suffix restriction, gateway host/transport checks
  and region selection. Parse JSON and SSE MCP text results through typed bounded records; only the configured search
  connector can be invoked.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/search/transformation.py:
  _gateway_host_match L85-L86; _credential_safe_transport L92-L94; _parseAgentCoreSearchConfig.__init__ L158-L160;
  AgentCoreSearchConfig.ui_friendly_name L163-L164; AgentCoreSearchConfig.validate_environment L166-L187; AgentCoreSearchConfig.get_complete_url
  L189-L203; AgentCoreSearchConfig.transform_search_request L205-L248; AgentCoreSearchConfig.sign_request L250-L321;
  AgentCoreSearchConfig._is_configured_gateway L324-L328; AgentCoreSearchConfig._signing_region L331-L358; AgentCoreSearchConfig.get_error_class
  L447-L457.


  Reuse BaseAWSLLM.__init__ from B590 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that
  prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: configured_gateway_required: Choose truthy explicit api_base then B129 AGENTCORE_GATEWAY_URL
  defaultNone; no automatic /mcp append or trim. Missing/empty -> ValueError AGENTCORE_GATEWAY_URL is not set. Set
  it to your AgentCore Gateway MCP endpoint (https://<gateway-id>.gateway.bedrock-agentcore.<region>.amazonaws.com/mcp)
  or pass api_base. Constructor calls B091 BaseSearch and B590 BaseAWS; UI friendly name Web Search on Amazon Bedrock.
  mcp_request_headers: Overlay Content-Type application/json,Accept application/json, text/event-stream,MCP-Protocol-Version
  = truthy AGENTCORE_MCP_PROTOCOL_VERSION else2025-03-26; these override exact caller header keys. Stateless calls
  perform no MCP initialize handshake. websearch_tool_suffix: Select truthy optional.tool_name,AGENTCORE_SEARCH_TOOL_NAME,default
  web-search-tool___WebSearch. Require exact endswith ___WebSearch or ValueError Invalid AgentCore search tool_name
  '{tool_name}': must end with '___WebSearch' (a web-search connector tool). Other gateway tools cannot be invoked
  through this provider. Suffix alone is accepted; wrong case fails. query_list_and_200_char_cap: Join list query
  with one space, otherwise keep string; truncate first 200 Unicode codepoints. Emit jsonrpc2.0,id1,method tools/call,params.name
  selected tool,params.arguments.query and maxResults. max_results absent default10; explicit None,0,negative or
  >25 is passed unchanged despite docstring1-25. No extra fields copied. https_or_loopback_only: Reject non-dict
  request_data first with TypeError AgentCore search expects a single dict request body. Then require parsed scheme
  https OR host exact localhost,127.0.0.1,::1; the helper accepts any scheme on these loopbacks, even though downstream
  HTTP transport may reject it. Otherwise ValueError Refusing to send AgentCore credentials over plaintext HTTP
  to '{api_base}': a bearer token or SigV4 signature would be readable in transit. Use an https gateway URL (plain
  http is allowed only for localhost). This check precedes credential lookup even if no credentials exist. gateway_bearer_trust:
  Match full parsed host against [a-z0-9-]+\.gateway\.bedrock-agentcore\.([a-z0-9-]+)\.amazonaws\.com (no China
  suffix, no path/query spoof). Call B091 resolve_server_api_key explicit key then AGENTCORE_GATEWAY_TOKEN; default
  trusted api_base equals caller URL only for this hostname match, configured base env AGENTCORE_GATEWAY_URL otherwise.
  Explicit key bypasses server-secret destination check but not transport guard. Server key uses B091 lowercase
  netloc trust including port/userinfo, and its exact refusal error. Truthy token overrides Authorization with Bearer
  and returns UTF-8 JSON without AWS signing. gateway_host_signing: Without bearer require matched gateway host
  OR _is_configured_gateway, which compares parsed hostname ONLY against AGENTCORE_GATEWAY_URL, ignoring port/scheme/path.
  Otherwise ValueError Refusing to send SigV4-signed AgentCore requests to '{api_base}': it is neither an AgentCore
  gateway hostname nor the host in AGENTCORE_GATEWAY_URL. Set AGENTCORE_GATEWAY_URL to authorize a custom gateway
  hostname. This hostname comparison differs from B091 bearer netloc trust. gateway_signing_region: If optional.aws_region_name
  is not None retain it verbatim, including empty. Otherwise region is regex capture for standard gateway host,
  else boto3.Session().region_name from AWS_DEFAULT_REGION/profile chain. Missing falsey configured region -> ValueError
  Cannot derive the SigV4 signing region from api_base '{api_base}' or the AWS configuration chain. Set aws_region_name
  (or AWS_DEFAULT_REGION / a profile region) to the gateway's region when using a custom hostname. No default us-west-2.
  Call B595 _sign_request service bedrock-agentcore with api_key=empty string to disable AWS_BEARER_TOKEN_BEDROCK
  fallback. No runtime bearer token is sent. get_error_class delegates B682 unchanged.


  Load AGENTCORE_GATEWAY_TOKEN, tool_name through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest agentcore_gateway_credentials_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  AGENTCORE_GATEWAY_TOKEN and deployment tool_name default None; the existing AGENTCORE_GATEWAY_URL/SEARCH_TOOL_NAME/MCP_PROTOCOL_VERSION
  loaders test the defaults and precedence above. max_results is an API optional parameter from B091, not a new
  global setting. AWS_DEFAULT_REGION/profile inputs reuse B590 configuration and native AWS credential-chain policy;
  inject session-region lookup in oracle.


  Implement crates/betterlite-bedrock/src/search.rs with adjacent tests under search/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation bedrock_services_search in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function search_cases in betterlite-bedrock with these exact named cases (one per oracle file): configured_gateway_required,
  mcp_request_headers, websearch_tool_suffix, query_list_and_200_char_cap, https_or_loopback_only, gateway_bearer_trust,
  gateway_host_signing, gateway_signing_region. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_search* using HelperCase: kind:
  helper and the externally tagged bedrock_services_search variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_search that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  MCP response JSON/SSE parsing and its production fuzz target belong to B2212; this request part consumes already
  parsed search/config records.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/search.rs
  and its loader wiring: AGENTCORE_GATEWAY_URL, AGENTCORE_SEARCH_TOOL_NAME, AGENTCORE_MCP_PROTOCOL_VERSION. Module-level
  settings enter litellm_settings; deployment settings enter litellm_params; environment lookup is injected. Keep
  the defaults and precedence specified above and in the linked branches; existing key owners remain unchanged.
  Write config rstest bedrock_services_search_config_cases with named cases loads_agentcore_gateway_url, loads_agentcore_search_tool_name,
  loads_agentcore_mcp_protocol_version, plus rejects_unrelated_key. Each loads case calls the real config loader
  with that key and asserts the resolved value, default, precedence and secret redaction where applicable. Seed
  B002 config_yaml with new bedrock_services_search* files for every key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_search_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_services_search_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 183 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 285 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 95 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
