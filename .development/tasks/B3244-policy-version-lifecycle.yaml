dod:
  - text: >-
      get_versions_by_policy_name returns the rows of a name by version_number descending with total_count, and an empty list for an unknown name.
    proof: [list-tests]
  - text: >-
      create_new_version clones the chosen source (an explicit id, else the production row) into a draft with the next number, parent set to the
      source, dates unset, is_latest moved to the new row, and condition and pipeline copied only when present.
    proof: [create-tests]
  - text: >-
      create_new_version fails with LiteLLM's text for a missing source, a source of another name and a name with no production version.
    proof: [create-tests]
  - text: >-
      update_version_status publishes only drafts, sets published_at, and leaves the registry alone.
    proof: [status-tests]
  - text: >-
      update_version_status promotes only a published row, demotes the old production row to published without touching its dates, sets
      production_at, and replaces the registry entry with source db, keeping the config policy when the row is later removed.
    proof: [status-tests]
  - text: >-
      update_version_status rejects an invalid status first, a missing row, a draft promotion, a production or draft-only mismatch and a
      production row asked to become published, each with LiteLLM's text.
    proof: [status-tests]
  - text: >-
      compare_versions reports only differing content fields with version_a and version_b values, ignores metadata, and fails with
      `Policy <id> not found` for a missing side.
    proof: [compare-tests]
  - text: >-
      delete_all_versions removes every row and the registry entry, and adds the config-fallback warning only when a config policy of that
      name exists.
    proof: [delete-tests]
  - text: >-
      The five routes return the documented bodies and map errors to 400, 404 or 500 as the variant table says; every route answers 500
      `Database not connected` without a database and 422 for a bad body or query.
    proof: [route-tests]
  - text: >-
      The two body decoders reject malformed bytes and wrong shapes without panicking and have committed corpus inputs.
    proof: [request-corpus]

  - text: The handlers are tested with tower's oneshot over the module's own Router and fake ports. B8669 mounts the routes and owns their HTTP oracle cases, so write no HTTP case here.
    proof: [route-tests]
checks:
  optional: []
  commands:
    - id: list-tests
      why: version listing, ordering or the empty result is missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^policy_versions::.*tests::list_/)'
    - id: create-tests
      why: draft cloning, numbering, the is_latest move or the source errors are missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^policy_versions::.*tests::create_/)'
    - id: status-tests
      why: a status transition, its error order or the registry swap is missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^policy_versions::.*tests::status_/)'
    - id: compare-tests
      why: the field diff or its not-found errors are missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^policy_versions::.*tests::compare_/)'
    - id: delete-tests
      why: all-versions deletion, the registry removal or the config warning is missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^policy_versions::.*tests::delete_/)'
    - id: route-tests
      why: a version route, its status mapping or the no-database answer is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_version_routes::/) - test(replays_the_policy_version_request_corpus)'
    - id: request-corpus
      why: the body decoders have no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/policy_version_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_policy_version_request_corpus)'

oracle_cases: []

deviations:
  - what: Route errors are mapped from typed `PolicyVersionError` variants, not by searching the message for "not found", "no production", "invalid status", "only draft" or "cannot promote". A database error whose text happens to contain one of those words is 500 here and 404 or 400 in LiteLLM.
    why: Substring matching on error text turns a driver message or a policy name into a wrong status; the listed cases give the same status and text as LiteLLM.
  - what: The 422 body for a bad request body or a missing query parameter uses the server's shared validation response and wording, not FastAPI's `loc` and `msg` strings.
    why: Every route in the server shares one validation response; status 422 matches.
  - what: A `source_policy_id`, `version_status`, `version_a` or `version_b` of the wrong JSON type is 422 from the decoder, like FastAPI, but extra unknown fields in the bodies are ignored as in LiteLLM.
    why: Pydantic's default config ignores extra fields, and so do the decoders.

out_of_scope:
  - "B3242 owns the row type, the version and policy response records, the row-to-response adapter and get_policy_by_id_from_db (resolver_types.py L66-L433, policy_registry.py L57-L162, L564-L589)."
  - "B3241 owns the in-memory registry, parse_policy, add_policy, remove_policy, get_source, list_config_policies and the by-id map (policy_registry.py L163-L380, L590-L605)."
  - "B3243 owns add_policy_to_db, update_policy_in_db, delete_policy_from_db, get_all_policies_from_db, sync_policies_from_db and resolve_guardrails_from_db (policy_registry.py L381-L760)."
  - "B3248 owns the other policy_endpoints.py routes (list, create, get, update, delete by id, resolved-guardrails and the attachment routes); B3247 owns POST /policies/test-pipeline."
  - "B726 owns the policy repository and its table operations; B732 owns the authenticated principal; B855 and B756 own auth admission and header selection."
  - "get_policy_registry() singleton accessor (policy_registry.py L1071-L1081): no module-level state in betterlite; the registry handle is passed in."

pitfalls:
  - "update_version_status rejects `production` to `published`: a `published` target needs a `draft` row, so the docstring's demote-to-published transition does not exist. A production row asked for `published` is `Only draft versions can be published. Current status: 'production'.`"
  - "Promotion demotes the old production row with update-many on `version_status`, `updated_at` and `updated_by` only, so its `published_at` and `production_at` keep their old values, and `is_latest` is never touched by any status change."
  - "The promotion writes the database first and the registry last; when `parse_policy` fails on the stored JSON the rows are already changed and the call fails with the prefix text. Keep that order and do not roll back."
  - "`remove_policy` before `add_policy` matters: it restores the config policy of that name, and `add_policy` then overwrites it with the db version, so the registry source after a promotion is `db`."
  - "In create_new_version the `is_latest` clear runs before the insert and covers every row of the name, so a failed insert leaves a name with no latest row."
  - "The first checks of update_version_status are the invalid status and then the row lookup; `draft` as a target is `Invalid status 'draft'. Use 'published' or 'production'.` even when the row exists."
  - "The compare diff has no key for equal fields, so two identical versions give `field_diffs` as an empty object, not null."
  - "delete_all_versions leaves draft and published versions in the registry's by-id map, so a request body `policy_<uuid>` for a deleted version still resolves until the next sync."
  - "`/policies/compare` takes `version_a` and `version_b` as query parameters, not a path or body, and both are policy_id values."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
