id: B3244
title: Policy version lifecycle and routes
description: >-
  Build the version lifecycle of a policy and the five routes that expose it. A policy name can have many rows in the policy table, one per
  version. A version is `draft`, `published` or `production`, and only the production row of a name is active in the in-memory registry.
  This task lists the versions of a name, clones a new draft, moves a version between statuses, compares two versions and deletes every
  version of a name. B3242 gives the row type, the response record `PolicyDBResponse`, the version records (`PolicyVersionCreateRequest`,
  `PolicyVersionStatusUpdateRequest`, `PolicyVersionListResponse`, `PolicyVersionCompareResponse`), the row-to-response adapter and the
  policy table handle. B3241 gives the in-memory registry with `parse_policy`, `add_policy`, `remove_policy` and `get_source`. B726 gives the
  policy repository. B3243 owns create, update, delete, list and sync for single policies and does not call this task. Use the exact names
  and types as they exist when you start, and re-implement none of them.

  Lifecycle code goes in crates/betterlite-db/src/policy_versions.rs and policy_versions/. Files: list.rs, create.rs, status.rs,
  compare.rs, delete.rs and error.rs. The service struct `PolicyVersions` takes the repository handle and the shared registry handle in
  its constructor, and holds no module-level state (LiteLLM's `get_policy_registry()` singleton becomes that handle). Every method that can
  fail returns `PolicyVersionError`, a `thiserror` enum owned by error.rs. Its variants are typed (database error, `PolicyNotFound`,
  `SourceNotFound`, `SourceNameMismatch`, `NoProduction`, `InvalidStatus`, `OnlyDraftCanBePublished`, `OnlyDraftOrPublished`,
  `DraftCannotBePromoted`, `RegistryParse`), and each variant's `Display` text is exactly LiteLLM's text including the wrapper prefix
  listed below, since the route returns it as `detail`. Log each failure at error level with the same prefix, as LiteLLM does with
  `verbose_proxy_logger.exception`.

  `get_versions_by_policy_name(policy_name)` (policy_registry.py L761-L789). Read every row with that `policy_name`, ordered by
  `version_number` descending, map each with the B3242 adapter and return `PolicyVersionListResponse` with `policy_name`, `versions` and
  `total_count` set to the count. An unknown name is an empty list with `total_count` 0, not an error. A database failure has the text
  `Error getting versions: <cause>`.

  `create_new_version(policy_name, source_policy_id, created_by)` (L791-L875). Pick the source row. With `source_policy_id` set, read that
  row by `policy_id`: a missing row is `Source policy <id> not found`, and a row whose `policy_name` differs is `Source policy name '<row
  name>' does not match '<policy_name>'`. With it unset, take the first row with that name and `version_status` `production`; none is
  `No production version found for policy '<policy_name>'`. Then read the first row of the name ordered by `version_number` descending
  and use its number plus one, or 1 when the name has no rows. Then set `is_latest` to false on every row of the name with one update-many.
  Then insert the draft row with: the name, the new number, `version_status` `draft`, `parent_version_id` the source row's `policy_id`,
  `is_latest` true, `published_at` and `production_at` unset, `inherit` and `description` from the source, `guardrails_add` and
  `guardrails_remove` from the source or an empty list, `created_at` and `updated_at` the current UTC time, and `created_by` and
  `updated_by` both set to `created_by`. `condition` and `pipeline` are copied only when the source has them, as JSON values (LiteLLM
  dumps a dict to a JSON string for Prisma; the Rust repository takes the JSON value, so the stored result is the same). Return the new row
  through the adapter. Every failure above has the prefix `Error creating new version: `. The three steps (read latest, clear
  `is_latest`, insert) are separate statements and are not wrapped in a transaction, as in LiteLLM; keep that order.

  `update_version_status(policy_id, new_status, updated_by)` (L877-L980). Check in this order. `new_status` other than `published` or
  `production` is `Invalid status '<new_status>'. Use 'published' or 'production'.` (checked before any read). Read the row by
  `policy_id`; none is `Policy with ID <policy_id> not found`. Then by target:
  - `published`: the row must be `draft`, else `Only draft versions can be published. Current status: '<current>'.` Update that row to
    `published` with `published_at` and `updated_at` the current time and `updated_by`. Nothing in the in-memory registry changes.
  - `production`: a row that is not `draft` or `published` is `Only draft or published versions can be promoted to production. Current:
    '<current>'.` and a `draft` row is `Cannot promote draft directly to production. Publish the version first.` For a `published` row, first
    update every row of the same name that is `production` to `published`, setting only `version_status`, `updated_at` and `updated_by`.
    Then update this row to `production` with `production_at`, `updated_at` and `updated_by`. Then call the registry's `remove_policy` for
    the name (which restores a config-defined policy of that name when there is one), build the policy with `parse_policy` from the updated
    row's `inherit`, `description`, `guardrails_add`, `guardrails_remove`, `condition` and `pipeline`, and call `add_policy` with the
    default source `db`.
  Return the updated row through the adapter. Every failure has the prefix `Error updating version status: `.

  `compare_versions(policy_id_a, policy_id_b)` (L982-L1033). Read row A, then row B, both by `policy_id`. A missing A is `Policy <id> not
  found` and so is a missing B (A is checked first, after both reads). Map both through the adapter. For each of `inherit`, `description`,
  `guardrails_add`, `guardrails_remove`, `condition` and `pipeline`, in that order, when the two response values are not equal add
  `field_diffs[field] = {version_a: <A value>, version_b: <B value>}`. Equality is JSON value equality, so key order inside `condition`
  does not matter and list order inside `guardrails_add` does. Metadata fields (status, number, dates, users) are never compared.
  Return `PolicyVersionCompareResponse`. Prefix `Error comparing versions: `.

  `delete_all_versions(policy_name)` (L1035-L1068). Delete every row of the name with one delete-many and then call the registry's
  `remove_policy`. The result is `{"message": "All versions of policy '<policy_name>' deleted successfully"}`, plus `"warning": "All DB
  versions were deleted. The config-defined policy with the same name is active again."` when the registry's `get_source(policy_name)` is
  `config` after the removal. An unknown name succeeds with the plain message. Prefix `Error deleting all versions: `. The by-id map
  of draft and published versions in the registry is not touched, as in LiteLLM; B3243's sync refreshes it.

  Routes go in crates/betterlite-server/src/policy_version_routes.rs and policy_version_routes/ (routes.rs, request.rs, error.rs). The state
  struct takes `Option<PolicyVersions>` through its constructor: `None` stands for LiteLLM's `prisma_client is None`. All five routes
  have tag `Policies` and sit in the standard authenticated group (B855 and B756 own the auth); `/policies/...` version paths are not in
  LiteLLM's read-only admin-viewer list, so route access follows the shared route checks for a path they do not list, and this task adds
  no special case. With no database every route answers HTTP 500 with `detail` `Database not connected`, after the body and query
  validation. The routes:
  - GET `/policies/name/{policy_name}/versions` (policy_endpoints.py L222-L244). Returns the list response. Any failure is 500 with the
    error text as `detail`.
  - POST `/policies/name/{policy_name}/versions` (L247-L279). Body `PolicyVersionCreateRequest`; `{}` and `{"source_policy_id": null}`
    are fine, a missing body is the shared 422. `created_by` is the authenticated key's `user_id` (B732's principal). A `SourceNotFound` or
    `NoProduction` failure is 404, any other is 500, both with the error text as `detail`.
  - PUT `/policies/{policy_id}/status` (L282-L320). Body `PolicyVersionStatusUpdateRequest` with a required string `version_status`.
    `updated_by` is the key's `user_id`. `InvalidStatus`, `OnlyDraftCanBePublished`, `OnlyDraftOrPublished` and `DraftCannotBePromoted`
    are 400, `PolicyNotFound` is 404, anything else is 500.
  - GET `/policies/compare` (L323-L351). Required query parameters `version_a` and `version_b` (missing is the shared 422). `PolicyNotFound`
    is 404, anything else 500.
  - DELETE `/policies/name/{policy_name}/all-versions` (L354-L380). Returns the message map. Any failure is 500.
  Axum routing: `/policies/compare` and `/policies/name/...` are static paths and win over `/policies/{policy_id}` that B3248 registers, so
  nothing here conflicts; the umbrella (B079) composes the routers and never registers these again.

  Add two pure decoders in request.rs with the shared 422 response for a failure: `decode_version_create(bytes: &[u8]) ->
  Result<PolicyVersionCreateRequest, PolicyVersionRequestError>` (a JSON object whose optional `source_policy_id` is a string or null) and
  `decode_version_status(bytes: &[u8]) -> Result<PolicyVersionStatusUpdateRequest, PolicyVersionRequestError>` (a JSON object with a
  string `version_status`). Add one cargo-fuzz target that feeds both.

  Tests. Name native tests under `policy_versions::tests` with these prefixes, since the checks filter on them: `list_`, `create_`,
  `status_`, `compare_` and `delete_`. They run against a real Postgres through POSTGRES_TEST_URL or testcontainers, with the registry
  built by B3241. Route tests live in `policy_version_routes::tests`; they check the status mapping for each error variant with a service
  over the test database and the no-database state for the 500. The helper cases of this task are none: the lifecycle reads and writes
  rows, which a helper adapter cannot do.

  Oracle. HTTP cases go in tools/oracle/cases/policies/versions/ and send the real request to the booted proxy with the master key and
  no database, so they cover the no-database 500 for every route, the 422 for a bad body or a missing query parameter (compare the
  status and ignore the validation `detail` text, see deviations) and the 401 without a key. The database paths are covered by the
  native tests.

