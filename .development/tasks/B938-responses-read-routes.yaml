references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L677-L970
  why: Owns retrieval, deletion and input-items handlers and their nine aliases; polling exits before provider exception mapping.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L1201-L1313
  why: Owns cancellation and its three aliases, including the second cache read after mutation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L838-L864
  why: B509 adds limit=20 and order=desc when input_items receives no pagination body fields.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L601-L614
  why: B004 maps provider-flow HTTPException into the OpenAI envelope; polling exceptions never enter this function.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/openai_error_payload.py#L16-L22
  why: Existing provider-id ownership failure uses permission_error for HTTP 403, which the polling deviation must share.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1892-L1919
  why: ProxyException serializes under error while uncaught polling HTTPException retains FastAPI's detail envelope.
dod:
- text: >-
    route_aliases sends all twelve method/path combinations with a valid owner and a fresh resource for each mutation.
    GET returns the mock response with 200; DELETE returns object=response/deleted=true; input_items returns the mock
    object=list/data=[]; cancel returns status=cancelled. Provider flows expose x-litellm-call-id and the processor's
    selected x-litellm-* headers.
  proof: [case-route-aliases, oracle]
- text: >-
    path_overwrites_body sends GET, DELETE, input_items and cancel with body response_id=resp_wrong and a different
    captured id in the path. Only the path's decoded provider id reaches upstream; all four mock successes are 200.
  proof: [case-path-body, oracle]
- text: >-
    input_items_pagination sends ?limit=1&after=item_wrong&order=asc&include=message.input_image.image_url without a body;
    upstream receives only limit=20&order=desc and returns 200 object=list. Another GET supplies JSON limit=2, order=asc,
    after=item_a and include=[message.input_image.image_url]; those body values reach the mock.
  proof: [case-pagination, oracle]
- text: >-
    polling_lifecycle seeds a same-owner litellm_poll_test with status=in_progress and output=[]. GET returns that
    record with 200 and no upstream call. DELETE returns 200 id=litellm_poll_test/object=response/deleted=true and
    removes it. A fresh cancellation returns the reread status=cancelled and retained output=[].
  proof: [case-polling-lifecycle, oracle]
- text: >-
    polling_failures covers GET, DELETE and cancel without Redis (500 detail, no error object) and with Redis but
    no litellm_poll_missing (404 detail, no error object). Source messages are "Redis cache not configured. Polling
    requires Redis." for GET, "Redis cache not configured." for mutations, "Polling response litellm_poll_missing
    not found or expired" for GET, and "Polling response litellm_poll_missing not found" for mutations.
  proof: [case-polling-failures, oracle]
- text: >-
    polling_mutation_races injects delete_polling=false and cancel_polling=false after an existing-state read;
    both return 500 detail (source "Failed to delete polling response" and "Failed to cancel polling response").
    Successful cancel followed by a missing reread returns 200 JSON null. Native repository tests preserve the
    non-atomic read/mutate/read order.
  proof: [case-polling-races]
- text: >-
    provider_owner_denial uses an encrypted provider response minted for team_a with a team_b key. Each operation
    returns 403 permission_error, param=null, code="403", without upstream traffic; x-litellm-call-id is present.
  proof: [case-provider-owner, oracle]
- text: >-
    authentication sends a valid resource path with no authorization and then Bearer sk-invalid against a configured
    master key. Both return 401 auth_error, param="None", code="401", without reading polling state or calling upstream.
  proof: [case-authentication, oracle]
- text: >-
    compatibility_deviations creates polling state as A and attempts get/delete/cancel as B, then as its owner.
    B gets 403 permission_error, param=null, code="403" with unchanged state; A succeeds. Include same-key identity-less
    ownership, another key fingerprint, a legacy record without owner, and missing-record 404 before owner denial.
  proof: [deviation-tests]
- text: HTTP fixtures are added on this branch and both server and core polling tests execute.
  proof: [new-oracle-cases, behavior-tests, oracle]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: response handlers or polling coordination lack executable tests
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::responses_read_routes::/)'
  - id: case-route-aliases
    why: a public lifecycle alias is missing
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::route_aliases($|::)/)'
  - id: case-path-body
    why: a caller body can override the addressed response
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::path_overwrites_body($|::)/)'
  - id: case-pagination
    why: URL pagination is forwarded or JSON body pagination is lost
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::input_items_pagination($|::)/)'
  - id: case-polling-lifecycle
    why: cache retrieval or mutation returns the wrong response body
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::polling_lifecycle($|::)/)'
  - id: case-polling-failures
    why: Redis absence and missing polling state are conflated
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::polling_failures($|::)/)'
  - id: case-polling-races
    why: cancellation invents state or treats a failed mutation as success
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_read_routes::tests::polling_mutation_races($|::)/)'
  - id: case-provider-owner
    why: a cross-team provider id reaches credential routing
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::provider_owner_denial($|::)/)'
  - id: case-authentication
    why: absent or invalid bearer credentials reach lifecycle services
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::authentication($|::)/)'
  - id: deviation-tests
    why: the polling owner check has no HTTP regression test
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::compatibility_deviations($|::)/)'
  - id: new-oracle-cases
    why: the branch has no new response-lifecycle scenarios
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/responses-read-routes)"
oracle_cases:
- tools/oracle/cases/api/responses-read-routes/route-aliases.yaml
- tools/oracle/cases/api/responses-read-routes/path-overwrites-body.yaml
- tools/oracle/cases/api/responses-read-routes/input-items-pagination.yaml
- tools/oracle/cases/api/responses-read-routes/polling-lifecycle.yaml
- tools/oracle/cases/api/responses-read-routes/polling-failures.yaml
- tools/oracle/cases/api/responses-read-routes/provider-owner-denial.yaml
- tools/oracle/cases/api/responses-read-routes/authentication.yaml
deviations:
- what: Polling ids belonging to another owner return 403 permission_error, param=null, code="403" before get/delete/cancel.
  why: The architect approved closing the polling-id authorization bypass; provider-id denials already use this type.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L738-L759
out_of_scope:
- B940 owns the cursor dialect helpers and cursor_model_list/cursor_chat_completions in endpoints.py L77-L191 and L461-L674.
- B080 owns responses_api in endpoints.py L194-L458.
- B939 owns compact_response, the token-counting helpers and responses_input_tokens in endpoints.py L973-L1198.
- B941 owns the WebSocket helpers and responses_websocket_endpoint in endpoints.py L1316-L1620.
- B004 owns request processing and exception mapping; B929 owns provider-id security and B935 the polling repository.
pitfalls:
- input_items has no polling shortcut; a litellm_poll_ id on that route still enters provider processing.
- GET and DELETE can carry JSON bodies here; discarding them changes pagination and path/body precedence.
- A successful cancellation does not guarantee its second cache read still finds a record.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
