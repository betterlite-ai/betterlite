id: B938
title: Responses read and cancellation routes
description: >-
  Implement the complete get_response, delete_response, get_response_input_items and cancel_response handlers in
  betterlite-server::api::responses_read_routes, with their polling coordination in betterlite-core. Register each
  handler with dependencies=[Depends(user_api_key_auth)] and tags=["responses"] at every alias: GET /responses/{response_id},
  /v1/responses/{response_id} and /openai/v1/responses/{response_id}; DELETE at those same three paths; GET
  /responses/{response_id}/input_items, /v1/responses/{response_id}/input_items and
  /openai/v1/responses/{response_id}/input_items; and POST /responses/{response_id}/cancel,
  /v1/responses/{response_id}/cancel and /openai/v1/responses/{response_id}/cancel. B080 mounts this route factory
  once, so this task must not register any of those paths a second time.

  A path response_id beginning with the literal "litellm_poll_" selects polling for get_response, delete_response or
  cancel_response; get_response_input_items never selects polling, even when its path id begins with that prefix. A
  polling handler is constructed with the supplied Redis cache and B935's default ttl=3600 seconds. GET reads
  litellm:polling:response:{response_id} and returns the complete cached object. If Redis is absent, GET returns
  HTTP 500 detail="Redis cache not configured. Polling requires Redis."; if its state is absent, GET returns HTTP 404
  detail="Polling response {response_id} not found or expired". DELETE and cancel have different literals: absent Redis
  returns HTTP 500 detail="Redis cache not configured.", and absent state returns HTTP 404
  detail="Polling response {response_id} not found". These uncaught polling errors use a FastAPI detail body, not an
  error object.

  Preserve polling effects and order. DELETE reads the state, calls delete_polling, then returns
  {"id": response_id, "object": "response", "deleted": true} with status 200 when the mutation succeeds; a false
  delete result returns HTTP 500 detail="Failed to delete polling response". Cancel reads the state, calls
  cancel_polling(response_id) (B935 writes status="cancelled"), rereads the state and returns that complete JSON with status 200; a missing
  reread is JSON null with status 200, and a false cancel result returns HTTP 500 detail="Failed to cancel polling
  response". The owned handlers perform no database writes; B935 owns Redis serialization, TTL and cache mutation.

  Provider branches call B1100's JSON body reader for GET, DELETE, input_items and cancel, then overwrite only
  data["response_id"] with the decoded path value. They retain other body fields, pass model=None, and call B004
  with route_type exactly "aget_responses", "adelete_responses", "alist_input_items" or "acancel_responses", plus
  user_model, user_temperature, user_request_timeout, user_max_tokens, user_api_base and version. Provider failures
  go through B004's _handle_llm_api_exception; successful and mapped responses retain B004's x-litellm-call-id and
  other selected x-litellm-* headers.

  For input_items, the shared pre-call query reader copies only query parameter api-version into data. URL parameters
  limit, after, before, include and order are dropped without a warning. With no body values, B509's provider request
  therefore uses limit=20 and order="desc" and omits after, before and include. Body values after="item_body",
  before="before_body", include=["message.input_image.image_url"], limit=2 and order="asc" are retained, with include
  sent upstream as the comma-joined string "message.input_image.image_url". Null after/before/limit/order and an empty
  include list are omitted by the provider transformation.

  Add native tests under api::responses_read_routes::tests and HTTP scenarios through B1139. Provider cases must use
  the mock provider because every non-polling operation reaches provider I/O through B933 or B1116. Use a fixed test
  master key, B856 ordinary-key rows and B1139's isolated Redis/Postgres setup. Do not add a helper adapter for these
  FastAPI handlers. The owned source slice is 348 nonblank, non-comment physical Python lines; budget 330
  implementation, 190 native tests, 210 scenario fixtures and 40 wiring lines, 770 total.
