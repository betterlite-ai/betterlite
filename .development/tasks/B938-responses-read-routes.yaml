deviations:
- what: >-
    Polling/provider response ids owned by another principal return HTTP 403 with
    error.type="permission_error", error.param=null and error.code="403" before
    GET, DELETE, cancel or input_items provider traffic; the same-owner path
    succeeds after state existence is checked for polling routes, and a missing
    polling state keeps the route-specific 404.
  why: >-
    The architect approved closing the polling-id authorization bypass. The provider-id ownership path already maps 403
    to permission_error, so betterlite gives both addressed-id classes the same client-visible denial type.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/openai_error_payload.py#L16-L22
out_of_scope:
- 'B080 owns responses_api and its POST aliases in endpoints.py L194-L458; this task composes B080''s route factory without registering POST /responses again.'
- 'B940 owns _convert_tool_payload_value L77-L86, _convert_tool_envelope L89-L105, _normalize_tool_dialect L108-L120, _is_chat_completions_body L123-L127, _parse_cursor_model_variant L140-L145, _router_can_serve L148-L155, _resolve_cursor_model_variant L158-L179, _resolve_cursor_model_variant_before_auth L182-L191, cursor_model_list L471-L485 and cursor_chat_completions L496-L674.'
- 'B939 owns compact_response L988-L1052, _proxy_token_counter L1081-L1084, _responses_invalid_request_response L1090-L1099, _missing_responses_param_response L1102-L1107, _responses_input_as_token_count_messages L1110-L1125 and responses_input_tokens L1143-L1198.'
- 'B941 owns _read_ws_model_from_first_frame L1316-L1384, _extract_model_from_first_ws_event L1387-L1396, _routing_hints_from_first_ws_frame L1407-L1419, _responses_ws_failure_frame L1422-L1428, _enforce_responses_ws_first_frame_model_auth L1431-L1471 and responses_websocket_endpoint L1476-L1620.'
- 'B004 owns ProxyBaseLLMRequestProcessing.base_process_llm_request and _handle_llm_api_exception and their provider error envelopes; this task passes the four route_type strings and does not duplicate provider orchestration.'
- 'B1100 owns _read_request_body in common_utils/http_parsing_utils.py L175-L280; this task consumes its parsed mapping and does not add another JSON decoder.'
- 'B929 owns response-id encryption and provider/polling owner extraction; B756 and B855 own user_api_key_auth admission and its authentication error fields.'
- 'B935 owns ResponsePollingHandler.__init__, generate_polling_id, is_polling_id, get_cache_key, get_state, cancel_polling and delete_polling in response_polling/polling_handler.py L18-L38 and L215-L248, including Redis serialization, ttl=3600 and cache writes.'
- 'B933 owns aget_responses, get_responses, alist_input_items and list_input_items; B1116 owns adelete_responses, delete_responses, acancel_responses and cancel_responses; B509 owns the OpenAI input-items URL transformation.'
- 'B732 owns shared authentication principals and request types; B1087 owns ApiLimits; B1139 owns HTTP scenario execution; B856 owns management fixture rows; none of these are reimplemented in the handlers.'
- 'The four handlers perform no database write; Postgres, Redis transport, provider calls and mapped error construction remain with B856/B1139, B126/B935, B933/B1116 and B004 respectively.'
pitfalls:
- 'The polling predicate applies startswith("litellm_poll_") to the path parameter only: a body response_id of "litellm_poll_body" on /v1/responses/resp_provider still takes provider flow and is overwritten with "resp_provider".'
- 'GET, DELETE and cancel parse a provider JSON body before assigning data["response_id"]; model and pagination survive, but a polling id returns before body parsing and never reaches the provider.'
- 'GET uses "Redis cache not configured. Polling requires Redis." and "Polling response <id> not found or expired", while DELETE and cancel use "Redis cache not configured." and "Polling response <id> not found"; sharing one polling error constant changes three observable branches.'
- 'DELETE reads litellm:polling:response:<id> before delete_polling, whereas cancel reads before cancel_polling and again after it; a fake that records only the mutation misses DELETE 404 and cancel JSON null.'
- 'Only api-version is copied from URL query parameters; limit=1, after=item_query, before=before_query, include=message.input_image.image_url and order=asc are dropped, while absent body values become limit=20 and order="desc".'
- 'The provider transformation checks include by truthiness and the other optional parameters against None: include=[], after=null, before=null, limit=null and order=null are omitted rather than forwarded as empty or null values.'
- 'Polling HTTPException responses retain a FastAPI detail field, but provider exceptions pass through B004 and proxy_server emits an error object with a string code and forwarded headers; one shared error serializer changes the wire contract.'
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
