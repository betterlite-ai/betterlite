id: B938
title: Responses read and cancellation routes
description: >-
  Build get_response, delete_response, get_response_input_items and cancel_response in
  betterlite-server::api::responses_read_routes, with polling coordination in the corresponding
  betterlite-core module. Own each complete handler. Register GET and DELETE /responses/{response_id},
  GET /responses/{response_id}/input_items and POST /responses/{response_id}/cancel, plus all four
  operations under /v1/responses and /openai/v1/responses. B080 mounts this factory once.

  Use B756/B855 authentication and admission, B929 response-id authorization, B935 polling storage,
  B933 retrieval/input-item calls and B1116 deletion/cancellation. Call B004's base_process_llm_request
  and _handle_llm_api_exception through their native interfaces. Pass model=None and the existing
  user_model, user_temperature, user_request_timeout, user_max_tokens, user_api_base and version
  settings through that processor; this task adds no config keys. B1100 decodes bodies and B1087
  supplies limits. The route types are aget_responses, adelete_responses, alist_input_items and acancel_responses.

  A non-polling request reads its JSON body even on GET or DELETE, then overwrites response_id with
  the path value. An input_items URL query never supplies after, before, include, limit or order:
  without body overrides the OpenAI request has limit=20 and order=desc. Shared request processing
  still extracts api-version. Preserve its x-litellm-call-id and other response headers.

  Polling get/delete/cancel branch before JSON body parsing and provider processing. Missing Redis
  raises HTTPException 500; missing state raises HTTPException 404. These bypass ProxyException and
  return a detail string, with no error.type, error.param or error.code. GET returns the cached record.
  DELETE returns id equal to the polling path, object=response and deleted=true after successful deletion.
  Cancellation reads state again after cancel_polling succeeds and returns that reread, including null
  if the record disappears. Failed delete/cancel returns 500 detail. Do not synthesize a cancelled record.

  The approved owner-check deviation runs after Redis/state existence checks and before mutation.
  Compare B935's trusted PollOwner, including its key-fingerprint fallback and legacy-owner denial;
  caller metadata cannot assert ownership. Other-owner get/delete/cancel returns 403 with
  error.type=permission_error, error.param=null and error.code="403", without provider traffic or state changes.

  Place the named tests below in api::responses_read_routes::tests. HTTP scenarios use B1139 storage
  isolation, a fixed test master key and B856 ordinary-key rows. Capture provider response ids from
  creation, or seed polling records with their private owner envelope. Compare upstream requests and
  client responses. Ignore only error wording; source detail strings below identify the branch.
  Native HTTP tests cover owner denial; injected repository tests cover mutation races.

  The decorator-inclusive owned spans contain 348 nonblank, non-comment physical Python lines,
  including signatures/docstrings. Allow 330 implementation, 190 native tests, 210 scenario fixture
  and 40 wiring lines, 770 total. Body decoding belongs to B1100; no new parser or helper adapter is needed.
scope:
  paths:
  - crates/betterlite-server/Cargo.toml
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/error.rs
  - crates/betterlite-server/src/api/responses_read_routes.rs
  - crates/betterlite-server/src/api/responses_read_routes/**
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-core/src/api/responses_read_routes.rs
  - crates/betterlite-core/src/api/responses_read_routes/**
  - crates/betterlite-core/src/api.rs
  - Cargo.toml
  - Cargo.lock
  - tools/oracle/cases/api/responses-read-routes/**
  - tools/oracle/fixtures/responses-read-routes/**
