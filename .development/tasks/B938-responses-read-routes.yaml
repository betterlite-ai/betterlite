pitfalls:
- At the pin, authenticated polling reads bypass ResponsesIDSecurity; a decoded polling id alone proves no ownership.
- endpoints.py:741 uses status_code=500, detail='Redis cache not configured. Polling requires Redis.'; preserve
  this envelope rather than a family-wide error default.
