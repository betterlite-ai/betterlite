dod:
- text: >-
    route_aliases sends authenticated mock-provider requests to all twelve
    literal paths: GET /responses/resp_get, /v1/responses/resp_get and
    /openai/v1/responses/resp_get; DELETE /responses/resp_delete,
    /v1/responses/resp_delete and /openai/v1/responses/resp_delete; GET
    /responses/resp_items/input_items, /v1/responses/resp_items/input_items
    and /openai/v1/responses/resp_items/input_items; POST
    /responses/resp_cancel/cancel, /v1/responses/resp_cancel/cancel and
    /openai/v1/responses/resp_cancel/cancel. Each mock success is HTTP 200,
    returns its response/list/delete object and x-litellm-call-id, passes
    model=None, and records exactly aget_responses, adelete_responses,
    alist_input_items or acancel_responses.
  proof: [case-route-aliases, case-provider-flow, oracle]
- text: >-
    provider_body_precedence sends JSON {"response_id":"resp_body","model":"mock-model"} to GET
    /v1/responses/resp_path, DELETE /v1/responses/resp_path, POST /v1/responses/resp_path/cancel and GET
    /v1/responses/resp_path/input_items. Each provider request contains response_id="resp_path", never "resp_body",
    while model="mock-model" remains available to processing.
  proof: [case-provider-body, oracle]
- text: >-
    input_items_query_and_body sends GET /v1/responses/resp_items/input_items?limit=1&after=item_query&before=before_query&order=asc&include=message.input_image.image_url&api-version=2024-10-21
    with an empty JSON body. The provider receives response_id="resp_items", limit=20, order="desc", no after/before/include,
    and api_version="2024-10-21". A body containing after="item_body", before="before_body", include=["message.input_image.image_url"],
    limit=2 and order="asc" yields those exact values, with include="message.input_image.image_url" upstream. A body with
    after=null, before=null, include=[], limit=null and order=null omits all five optional provider query keys. GET
    /v1/responses/litellm_poll_x/input_items with an empty body returns HTTP 200,
    sends response_id="litellm_poll_x" with route_type="alist_input_items" to
    the mock provider, and never returns a polling 404 or 500 detail body.
  proof: [case-input-items, oracle]
- text: >-
    polling_get seeds Redis key litellm:polling:response:litellm_poll_get with id="litellm_poll_get", object="response",
    status="in_progress" and output=[]. GET /v1/responses/litellm_poll_get returns that object with HTTP 200 and no provider
    request. With no Redis cache it returns HTTP 500 detail="Redis cache not configured. Polling requires Redis."; with no
    state it returns HTTP 404 detail="Polling response litellm_poll_missing not found or expired". Both error bodies contain
    detail rather than error.
  proof: [case-polling-get, oracle]
- text: >-
    polling_mutations proves all mutation literals and order in polling_mutations.yaml. DELETE first reads
    litellm:polling:response:litellm_poll_mutate, then deletes it and returns {"id":"litellm_poll_mutate",
    "object":"response","deleted":true}; the successful delete leaves no cache record. For DELETE with no Redis the
    response is HTTP 500 detail="Redis cache not configured.", and for a missing state it is HTTP 404
    detail="Polling response litellm_poll_delete_missing not found". Cancel with no Redis has the same HTTP 500 detail;
    cancel with a missing state has HTTP 404 detail="Polling response litellm_poll_cancel_missing not found". A successful
    cancel writes status="cancelled", rereads and returns the complete state with HTTP 200; an absent reread returns JSON
    null with HTTP 200. False delete_polling and cancel_polling results return HTTP 500 details "Failed to delete polling
    response" and "Failed to cancel polling response" respectively.
  proof: [case-polling-mutations, case-polling-races, oracle]
- text: >-
    polling_owner_denial seeds one encrypted provider response id owned by team_a and
    calls all four literal paths with a team_b key: GET
    /v1/responses/{team_a_owned_id}, DELETE /v1/responses/{team_a_owned_id},
    POST /v1/responses/{team_a_owned_id}/cancel and GET
    /v1/responses/{team_a_owned_id}/input_items. Each returns HTTP 403 with
    error.type="permission_error", error.param=null and error.code="403",
    retains x-litellm-call-id, makes no provider request and leaves Redis unchanged.
    The same owner succeeds after state existence is checked for GET, DELETE and
    cancel; a missing polling id returns its route-specific 404 before denial.
  proof: [case-owner-denial, deviation-tests, oracle]
- text: >-
    authentication calls /v1/responses/resp_auth with no Authorization header and with Authorization: Bearer sk-invalid
    while a fixed master key is configured. Both requests return HTTP 401 with error.type="authentication_error",
    error.param="None" and error.code="401", without reading polling state or calling the mock provider.
  proof: [case-authentication, oracle]
- text: >-
    provider_flow_headers_and_errors sends valid owned provider ids through all four route types. Successful mock responses
    preserve x-litellm-call-id and selected x-litellm-* headers; a provider exception reaches B004's mapper and is returned
    under error with its mapped status, type, param and string code instead of a polling detail body.
  proof: [case-provider-flow, behavior-tests, oracle]
- text: >-
    oracle_cases adds the seven named HTTP scenarios under
    tools/oracle/cases/api/responses-read-routes. input-items.yaml contains the
    literal litellm_poll_x provider request, owner-denial.yaml contains the
    fourth /input_items 403 request, and polling-mutations.yaml records the
    read -> mutation -> reread effects against independent Redis state.
  proof: [new-oracle-cases, behavior-tests, oracle]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The server and core modules must exercise the four handlers and polling coordinator; a passing unrelated test cannot satisfy this task.
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::responses_read_routes::/)'
  - id: case-route-aliases
    why: An advertised /responses, /v1/responses or /openai/v1/responses alias does not reach the expected provider result.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::route_aliases($|::)/)'
  - id: case-provider-body
    why: A route forwards the JSON response_id instead of the path id, or drops the unrelated model field.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::provider_body_precedence($|::)/)'
  - id: case-input-items
    why: This catches URL pagination leakage, missing api-version, wrong 20/desc defaults, null/empty omission, and accidental polling selection for litellm_poll_x/input_items.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::input_items_query_and_body($|::)/)'
  - id: case-polling-get
    why: GET uses the wrong prefix, cache key, status, Redis detail, missing-state detail, object projection or provider bypass.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::polling_get($|::)/)'
  - id: case-polling-mutations
    why: DELETE or cancel uses the GET literals, mutates before its existence read, misses the no-Redis branch, returns the wrong object, or mishandles a missing reread.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::polling_mutations($|::)/)'
  - id: case-polling-races
    why: A false mutation result or an altered read-mutate-reread sequence is not caught in the core coordination tests.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_read_routes::tests::polling_races($|::)/)'
  - id: case-owner-denial
    why: The fourth input_items denial must match the GET, DELETE and cancel permission_error envelope without provider traffic or Redis mutation.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::polling_owner_denial($|::)/)'
  - id: case-authentication
    why: Missing or invalid credentials reach polling state or provider processing, or their 401 fields change.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::authentication($|::)/)'
  - id: case-provider-flow
    why: One of the four route types loses its B004 exception handoff, selected headers or exact provider-flow result.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::provider_flow_headers_and_errors($|::)/)'
  - id: deviation-tests
    why: The intentional polling owner-denial envelope or its same-owner and missing-state ordering lacks a native regression.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_read_routes::tests::compatibility_deviations($|::)/)'
  - id: new-oracle-cases
    why: Each named route behavior needs a concrete fixture, including litellm_poll_x input_items and the fourth owner-denial path.
    run: test -f tools/oracle/cases/api/responses-read-routes/route-aliases.yaml && test -f tools/oracle/cases/api/responses-read-routes/provider-body.yaml && test -f tools/oracle/cases/api/responses-read-routes/input-items.yaml && test -f tools/oracle/cases/api/responses-read-routes/polling-get.yaml && test -f tools/oracle/cases/api/responses-read-routes/polling-mutations.yaml && test -f tools/oracle/cases/api/responses-read-routes/owner-denial.yaml && test -f tools/oracle/cases/api/responses-read-routes/authentication.yaml
