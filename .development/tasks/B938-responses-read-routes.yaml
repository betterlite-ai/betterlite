id: B938
title: Responses read routes
description: >-
  Install the /responses and /v1/responses addressed GET/DELETE/input_items/cancel routes, selecting polling or
  provider lifecycle services after B855 admission and responses-id-security. Retain route aliases, query parameters
  and x-litellm-* response metadata, and keep ownership checks before ID-based credential routing.


  Register GET response, DELETE response, GET input_items and POST cancel under /responses, /v1/responses and /openai/v1/responses.
  Polling get/delete/cancel run before the pinned security hook: missing polling ID returns 404; Redis unavailable
  returns 500. betterlite deliberately checks polling owner before any get/delete/cancel, returning 403 authentication_error
  with param null and code 403 on another owner; native denial tests cover this deviation while HTTP parity cases
  cover allowed owners and source errors. Seed polling records through B1139 rather than invoking handlers directly.


  Implement crates/betterlite-server/src/api/responses_read_routes.rs, crates/betterlite-core/src/api/responses_read_routes.rs.
  Use ResponsesReadRoutesInput and ResponsesReadRoutesResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /v1/responses/{response_id}; GET /responses/{response_id}; GET
  /openai/v1/responses/{response_id}; DELETE /v1/responses/{response_id}; DELETE /responses/{response_id}; DELETE
  /openai/v1/responses/{response_id}; GET /v1/responses/{response_id}/input_items; GET /responses/{response_id}/input_items;
  GET /openai/v1/responses/{response_id}/input_items; POST /v1/responses/{response_id}/cancel; POST /responses/{response_id}/cancel;
  POST /openai/v1/responses/{response_id}/cancel. Each alias is exercised through the booted proxy. Every route
  factory is mounted once; a family composer mounts its child factories without re-registering their methods/paths.


  Extraction uses the typed path/query/body records named by the owned handler signatures.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:741 status_code=500, exception_detail=FastAPI detail string; endpoints.py:752
  status_code=404, exception_detail=FastAPI detail string; endpoints.py:852 status_code=500, exception_detail=FastAPI
  detail string; endpoints.py:860 status_code=404, exception_detail=FastAPI detail string; endpoints.py:868 status_code=500,
  exception_detail=FastAPI detail string; endpoints.py:1262 status_code=500, exception_detail=FastAPI detail string;
  endpoints.py:1270 status_code=404, exception_detail=FastAPI detail string; endpoints.py:1282 status_code=500,
  exception_detail=FastAPI detail string. Compare the actual source status, error type, param and code; ignore only
  error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions get_response_alias, delete_owned_response, input_items_cursor_limit,
  cancel_poll_response, cross_team_before_upstream, poll_id_missing_404, poll_redis_missing_500, openai_get_alias,
  route_aliases, auth_missing, auth_invalid under api::responses_read_routes::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/response_api_endpoints/endpoints.py: get_response (L695-L790); litellm/proxy/response_api_endpoints/endpoints.py:
  delete_response (L811-L899); litellm/proxy/response_api_endpoints/endpoints.py: get_response_input_items (L920-L970);
  litellm/proxy/response_api_endpoints/endpoints.py: cancel_response (L1216-L1313). Abstract/protocol declarations
  map to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 310 owned nonblank/non-comment/non-docstring Python lines (348 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 330 implementation,
  124 behavior tests, 132 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 624 total within the 630-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B171 (Direct helper oracle and
  URL path encoding), B929 (Responses id security), B933 (Responses lifecycle call), B935 (Responses poll state),
  B1087 (Api boundaries), B1116 (Responses delete and cancel calls), B1100 (Shared request body decoding), B1139
  (Stateful HTTP oracle scenarios), B732 (Typed authentication principals and grant resolution), B855 (Authenticated
  request admission and budget handoff), B756 (Authentication header selection and mode dispatch), B856 (Management
  oracle namespaces and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.


  The native compatibility_deviations test drives the booted HTTP server: create a polling response as owner A,
  then attempt get/delete/cancel as owner B with a fresh response per mutation; assert 403 authentication_error,
  param null, code 403, no provider request and no state change. Same-owner A succeeds. Cover the B935 identity-less
  key-fingerprint fallback and missing legacy owner denial; existing missing-ID 404 and Redis-unavailable 500 take
  precedence over owner checking. Use the B935 trusted PollOwner envelope, never caller metadata.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.


  The polling ownership denial uses HTTP 403 and {error: {type: authentication_error, param: null, code: "403"}};
  code is a string. This is a native-only deviation test, not a differential equality seed.
