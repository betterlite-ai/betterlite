    why: The ten supported params, the overlay mapping, the request body and the cost lift.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/common_utils.py#L18-L80
    why: The shared helpers these modules call, built in B6100.
  - url: https://www.edenai.co/docs/api-reference/audio/audio-transcriptions
