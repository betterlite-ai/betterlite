    - crates/betterlite-openai/src/edenai_videos.rs
    - crates/betterlite-openai/src/edenai_videos/**
    - crates/betterlite-openai/src/edenai_speech.rs
    - crates/betterlite-openai/src/edenai_speech/**
    - crates/betterlite-openai/src/edenai_image.rs
    - crates/betterlite-openai/src/edenai_image/**
