id: B5838
title: Eden AI transcription, video, speech and image endpoints
description: >-
  Build the second half of the Eden AI provider (litellm/llms/edenai): audio_transcription, videos, text_to_speech and
  image_generation. B6100 built the first half and edenai_common (EdenAiEnv, EdenAiError, authorized_headers, json_headers,
  endpoint_url, pick and the cost readers); import those and do not write them again. Every family points an OpenAI
  config at https://api.edenai.run/v3, authenticates with the Eden key and lifts the cost Eden reports. All code is pure
  transforms with no network call, no environment read and no route. B8311 wires them into dispatch. Credentials arrive as
  the EdenAiEnv argument; add no config section.

  Modules, all in betterlite-openai, each a file plus a folder with tests.rs: edenai_transcription, edenai_videos,
  edenai_speech, edenai_image. A provider leaf never imports betterlite-core or betterlite-provider, so the records come
  from B1122, B1135 and B997 in betterlite-openai, and B8311 implements the provider traits over these functions.

  edenai_transcription (audio_transcription/transformation.py), over B515's Whisper config. Supported params and
  map_openai_params are B515's Whisper ones, unchanged. The config reports a native transcription endpoint. URL:
  endpoint_url(api_base, "audio/transcriptions"). Headers: authorized_headers with no Content-Type, since the body is
  multipart. The request makes B1001's process_audio_file of the input and builds files as one "file" part of (filename,
  bytes, content type). The form fields are every optional param, then every entry of the optional param extra_body when it is
  a mapping, then model, and the key extra_body itself is dropped. A later duplicate wins, so extra_body overrides a plain
  param and model overrides both. There is no default response_format here, unlike Whisper's verbose_json. The result is
  B1122's AudioTranscriptionRequestData with data and files. The response: when the content-type header does not contain
  the text "application/json" (a plain substring test on the header as sent), the result is a transcription response whose
  text is the body text and nothing else. Otherwise the JSON body is built through B004's convert_to_model_response_object
  with response type audio_transcription, and the cost from the same body goes into hidden params through B1717's
  set_response_cost_in_hidden_params. get_error_class returns EdenAiError, not the OpenAI error.

  edenai_videos (videos/transformation.py), over B525 (which uses B672's id helpers). Headers: authorized_headers with the
  explicit key, else litellm_params.api_key. URL: endpoint_url(api_base, "videos"); the model plays no part. Multipart is off:
  use_multipart_form_data is false. The create request has two paths. When input_reference is a JSON object (file_id or
  image_url), call B525's create transform with input_reference removed from the optional params and return its data plus
  "input_reference" set to a copy of the object, with its files and URL. For any other input_reference (a string or bytes) call
  B525's create transform unchanged, so it becomes a multipart file part. The create reply is B525's reply with the
  usage object rebuilt as the existing usage entries plus provider_reported_cost_usd from the cost in the body bytes, and
  every entry whose value is null is dropped. Eden returns cost 0 on create, so that stays as 0. The status reply does the same
  after the status check below. The content reply returns the body bytes after the status check. The list reply is B525's
  after the status check. The status check is LiteLLM's raise_for_status: any 4xx or 5xx status becomes an error before the
  body is read. get_error_class returns EdenAiError. The other OpenAIVideoConfig methods (delete, remix, content and
  list requests, the characters operations) are not overridden and stay with B525 and B526.

  edenai_speech (text_to_speech/transformation.py), over B1135's contract. Supported params are exactly voice,
  response_format, speed and instructions. map_openai_params returns the voice when it is a string, else none, together with
  the optional params unchanged (it does not filter them). Headers: json_headers. URL: endpoint_url(api_base,
  "audio/speech"). The request body is the ordered pairs model, input, voice, then every optional param, with null values
  removed and a later duplicate key winning, returned as B1135's dict_body. The reply wraps the raw response as binary
  content through B1035's HttpxBinaryResponseContent and calls its set_response_cost with the cost read from the
  x-edenai-cost response header, so a missing header removes any response_cost already stored. get_error_class returns
  EdenAiError.

  edenai_image (image_generation/transformation.py), over B997's contract and B004's response builder. Supported params, in
  this order: background, moderation, n, output_compression, output_format, quality, response_format, size, style, user.
  map_openai_params returns optional_params overlaid with only those keys from non_default_params; anything else is dropped
  without an error and drop_params has no effect. Headers: json_headers. URL: endpoint_url(api_base, "images/generations").
  The request body is model, prompt, then every optional param. The reply is built from the JSON body with response type
  image_generation through convert_to_model_response_object, and the cost from the same body goes into hidden params.
  get_error_class returns EdenAiError. B511's DALL-E and GPT image configs are OpenAI's and are not used.

  The reply decoders take bytes from the provider: decode_transcription_reply for the JSON path and the cost merge for
  video bodies. Add one cargo-fuzz target, edenai_media_reply, that feeds arbitrary bytes and a content-type string to
  both. Helper b5838 calls these functions with typed inputs and compares the pinned LiteLLM classes. Source size is 374
  nonblank, noncomment lines. Plan about 400 production lines, 300 test lines, 190 adapter lines and 80 fuzz and wiring
  lines.
