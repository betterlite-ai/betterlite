dod:
  - text: Transcription builds the multipart form from params, extra_body and model with the right precedence, sets no default response_format, and reads a plain-text or JSON reply with the cost.
    proof: [edenai-transcription-tests, edenai-media-corpus, helper-python, helper-case-corpus]
  - text: Video create sends a JSON input_reference object as JSON and any other reference as a file part, and create and status replies carry provider_reported_cost_usd.
    proof: [edenai-videos-tests, helper-python, helper-case-corpus]
  - text: Video status, content and list replies fail on an error status before the body is read.
    proof: [edenai-videos-tests, helper-case-corpus]
  - text: Speech keeps its four params, builds the null-free body, and stores or clears the response cost from the header.
    proof: [edenai-speech-tests, helper-python, helper-case-corpus]
  - text: Image keeps its ten params in order, drops others silently, builds the body and lifts the cost.
    proof: [edenai-image-tests, helper-python, helper-case-corpus]
  - text: The new helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: edenai-transcription-tests
      why: The transcription request or reply transform is missing or fails
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_transcription::/) - test(replays_the_edenai_media_reply_corpus)'
    - id: edenai-videos-tests
      why: The video request, usage cost or status checks are missing or fail
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_videos::/)'
    - id: edenai-speech-tests
      why: The speech params, body or cost header handling is missing or fails
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_speech::/)'
    - id: edenai-image-tests
      why: The image params, body or cost lift is missing or fails
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_image::/)'
    - id: edenai-media-corpus
      why: The media reply fuzz target or its fresh replay corpus is missing
      run: >-
        test -f crates/betterlite-openai/fuzz/fuzz_targets/edenai_media_reply.rs &&
        grep -q 'name = "edenai_media_reply"' crates/betterlite-openai/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/edenai_media_reply)" &&
        cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_edenai_media_reply_corpus)'
    - id: helper-python
      why: The strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5838.py)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Newly added Eden AI media helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/edenai_media-*")" &&
        grep -lE '^[[:space:]]+b5838:' tools/oracle/fuzz/corpus/helper_case/edenai_media-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/edenai-media/transcription-form-fields.yaml
  - tools/oracle/cases/helpers/edenai-media/transcription-reply-shapes.yaml
  - tools/oracle/cases/helpers/edenai-media/video-create-input-reference.yaml
  - tools/oracle/cases/helpers/edenai-media/video-usage-cost.yaml
  - tools/oracle/cases/helpers/edenai-media/video-error-status.yaml
  - tools/oracle/cases/helpers/edenai-media/speech-params-and-body.yaml
  - tools/oracle/cases/helpers/edenai-media/speech-cost-header.yaml
  - tools/oracle/cases/helpers/edenai-media/image-params-and-request.yaml
deviations:
  - what: On a video status, content or list reply with an error status, betterlite returns EdenAiError with that status, the body text and the headers.
    why: LiteLLM calls raise_for_status and lets httpx.HTTPStatusError escape. The status code reaches the client the same way, and a typed error carries the provider body without Python's exception text.
  - what: A body that has a JSON content-type but is not valid JSON gives EdenAiError with status 502 and a message that names the endpoint.
    why: LiteLLM lets the JSONDecodeError from response.json() escape as an unhandled 500. A typed upstream error is clearer, and the decoder is fuzzed.
out_of_scope:
  - B6100 owns common_utils.py (edenai_common), chat, embedding, responses and messages.
  - B8311 owns the dispatch branches for transcription, video, speech and image in litellm/main.py (the aspeech EdenAITextToSpeechConfig branch at main.py L8319), reading EDENAI_API_KEY and EDENAI_API_BASE into EdenAiEnv and building the configs in dispatch. The ProviderConfigManager entries are B5360's selection.
  - B3332 and B5360 own provider selection for video and media configs, and B2453 owns the native transcription HTTP path and subtitle replies.
  - B515 owns the Whisper params and mapping, B1001 process_audio_file, B525 and B526 the OpenAI video methods Eden does not override, B1035 HttpxBinaryResponseContent, B1717 set_response_cost_in_hidden_params, and B004 convert_to_model_response_object.
  - The logging call logging_obj.post_call(original_response=body) in the image transform belongs to the caller (B249 hooks).
pitfalls:
  - The transcription form is built with a later key winning, so extra_body values override plain optional params and the model argument overrides both.
  - The transcription content-type test is a case-sensitive substring test on the raw header, so "Application/JSON" is treated as plain text.
  - Eden transcription sends no default response_format, so a request without one leaves the field out of the form.
  - A JSON input_reference object stays a JSON field in data and creates no file part, while a string reference becomes a multipart file part even when it looks like a URL.
  - The video usage rebuild drops every null entry, existing usage entries included, but keeps a cost of 0.
  - Video create does not check the status and has no raise_for_status, unlike status, content and list.
  - The speech cost is set from the response header on the binary wrapper, and a reply without the header clears any stored response_cost.
  - Speech map_openai_params returns the optional params unchanged, so a param outside the four supported ones still reaches the body.
  - Image map_openai_params drops unsupported keys even when drop_params is false, unlike most OpenAI-shaped configs.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
