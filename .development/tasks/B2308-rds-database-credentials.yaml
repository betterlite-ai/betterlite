id: B2308
title: RDS database credential selection and token signing
description: >-
  Implement betterlite-db::rds_credentials for init_rds_client and generate_iam_auth_token in
  proxy/auth/rds_iam_token.py. Supply B712 with an injected RDS signer backed by maintained AWS
  credential and SigV4 libraries. Do not hand-write canonical signing or spawn aws. B129 supplies
  get_secret resolution; the database module owns the order in which explicit parameters, environment
  values and AWS credential strategies are selected. Credentials and returned tokens stay secret
  values and are never written to a database or logged. This task is below token URL construction,
  not a dependency on B712's token union or on an LLM provider umbrella.

  init_rds_client's seven optional parameters are aws_access_key_id, aws_secret_access_key,
  aws_region_name, aws_session_name, aws_profile_name, aws_role_name and aws_web_identity_token,
  all default None; timeout defaults None. Read AWS_REGION_NAME then AWS_REGION through B129 before
  resolving any truthy os.environ/ references among those seven parameters, in that order. Resolve
  region from a truthy explicit region, then truthy AWS_REGION_NAME, then truthy AWS_REGION. If none
  exists, fail with "AWS region not set: set AWS_REGION_NAME or AWS_REGION env variable or in .env file"
  before selecting credentials or contacting STS. Do not let an SDK default-region provider silently
  broaden this precedence. A float timeout sets both connect/read timeout; an httpx.Timeout supplies
  its connect/read values; None and other types use SDK defaults in the reference adapter.

  Credential branches test is-not-None, not truthiness. First, when web-identity token, role and
  session name are all non-None, try reading the token argument as a file. Any file-read exception
  falls back to get_secret(argument); None from that lookup fails with
  "OIDC token could not be retrieved from secret manager." An empty string is still passed to STS.
  Call AssumeRoleWithWebIdentity with RoleArn, RoleSessionName, WebIdentityToken and DurationSeconds=3600.
  Its STS client uses the ambient credential chain, not the explicit access/secret pair. Build the
  RDS signer from the returned AccessKeyId, SecretAccessKey and SessionToken, selected region and timeout.
  A valid file takes precedence over a same-named secret and is read without trimming its contents.

  Next, when role and session name are non-None, call AssumeRole with exactly RoleArn and RoleSessionName;
  the STS client receives the explicit access/secret pair, and no DurationSeconds override is supplied.
  Then, a non-None access key chooses direct credentials with that key and the supplied secret, even
  if the secret is None or the key is empty. Then a non-None profile chooses that named SDK profile.
  Otherwise use the ambient AWS credential chain. A role without session name does not trigger either
  role branch. Preserve this priority when several strategies are supplied. Propagate file-secret,
  STS, profile, incomplete-credential, missing response-field and signing failures; do not warn and
  downgrade to another credential strategy. SDK-native authentication errors are not HTTP errors
  created by a management route, and no synthetic status/type/param/code is added here.

  generate_iam_auth_token uses a supplied client without reading env or constructing another client.
  Otherwise pass os.getenv values for AWS_REGION_NAME, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  AWS_SESSION_NAME and AWS_PROFILE_NAME, all absent by default. AWS_ROLE_NAME falls back to AWS_ROLE_ARN
  only when the former is absent, and AWS_WEB_IDENTITY_TOKEN similarly falls back to
  AWS_WEB_IDENTITY_TOKEN_FILE; explicit empty values suppress those fallback aliases. Call the signer
  with DBHostname, Port and DBUsername exactly as supplied, without pre-decoding the username or
  replacing a missing port. The upstream SDK's default token validity is preserved; use pinned
  botocore output at a fixed time to establish the native signer vector. Percent-encode the entire
  returned token with quote(safe=''), including ?, &, =, /, + and %, before handing it to B712.
  This is an encoded database password, not an encryption format or persistent credential record.

  Load the named AWS inputs through B002 with B129 secret references and prove absent, empty and
  explicit alias precedence in config tests. The SDK's ambient chain retains its normal credential
  sources; this code must not inject AWS_SESSION_TOKEN into a branch where the reference supplied
  explicit access/secret credentials without a session token. A temporary role response does carry
  its returned SessionToken. Region validation still precedes any ambient-chain lookup.

  Use a controlled STS HTTP transport and deterministic credentials/clock for Rust integration tests,
  and checked-in request/signature fixtures captured by executing the pinned Python functions with
  botocore's request stubber. Validate their field names, ordering and error effects independently of
  the Rust signer. Include the fixture provenance, pin and fixed time. Do not route AWS network/file
  operations through a purported pure HelperCall or contact real cloud credentials in CI. No Postgres
  fixture is needed. The SDK owns its XML/credential-file decoding; this task adds no custom byte
  decoder. Extend B002's existing config_yaml corpus for secret-reference and alias inputs.

  The two owned functions contain 129 nonblank noncomment source lines including their declarations.
  Allow 220 provider/selection/signing lines, 290 transport and error tests, 100 config/tests and
  40 manifests/fixture wiring, 650 within a 700-line gate. Split selection and signing into files below
  300 lines and keep the credential client injectable for the parent token task.
scope:
  paths:
    - crates/betterlite-db/src/rds_credentials.rs
    - crates/betterlite-db/src/rds_credentials/**
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/fuzz/corpus/config_yaml/rds-credentials-*
    - Cargo.toml
    - Cargo.lock
    - deny.toml
    - crates/betterlite-config/src/sections/rds_credentials.rs
    - crates/betterlite-config/src/sections/rds_credentials/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/rds_iam_token.py#L7-L151
    why: Secret lookup order, region failure, credential branches, STS request fields and timeout mapping.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/rds_iam_token.py#L154-L173
    why: Actual env read sites, absent-only aliases, injected-client bypass and whole-token encoding.
dod:
  - text: 'Selection and failures have named cases: region_lookup_before_parameter_secrets,
      explicit_region_then_custom_then_standard, missing_region_before_credentials,
      seven_parameter_secret_references, float_and_structured_timeout, default_timeout_for_other_types,
      web_identity_before_role_and_keys, web_identity_file_before_secret, file_failure_secret_fallback,
      missing_oidc_exact_error, empty_oidc_reaches_sts, web_identity_duration_3600,
      web_identity_sts_uses_ambient_credentials, role_sts_uses_explicit_credentials,
      role_request_has_no_duration_override, temporary_session_token_reaches_rds,
      direct_keys_before_profile, empty_direct_key_not_ambient, profile_before_ambient,
      role_without_session_falls_through, upstream_failure_no_strategy_fallback,
      missing_sts_response_field_fails, secrets_absent_from_logs.'
    proof: [behavior-tests, reference-fixtures]
  - text: 'Signing tests prove injected_client_bypasses_env, signer_receives_original_endpoint,
      fixed_clock_botocore_signature and whole_token_percent_encoding.'
    proof: [behavior-tests, reference-fixtures]
  - text: 'Actual config loading proves aws_env_defaults, role_alias_absent_vs_empty,
      web_identity_alias_absent_vs_empty, aws_secret_reference_resolution and region_required_before_sdk_defaults.'
    proof: [config-tests, config-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Credential priority, exact STS requests, failures and signing must work without real AWS access.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^rds_credentials::tests::/)'
    - id: reference-fixtures
      why: A second independent pinned botocore fixture must detect native request/signature differences.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/src/rds_credentials/fixtures)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/rds_credentials::tests::fixed_clock_botocore_signature$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/rds_credentials::tests::web_identity_duration_3600$/)'
    - id: config-tests
      why: Env aliases and secret references must resolve through the actual config loader.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rds_credentials::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: New AWS env-resolution inputs must exercise the existing config decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/rds-credentials-*")" && grep -rlq AWS_ROLE_NAME crates/betterlite-config/fuzz/corpus/config_yaml/rds-credentials-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
  - B712 owns token flags, conflict resolution, IAMEndpoint URL construction and expiry hints;
    B854 owns token refresh scheduling and replacing the live database pool.
  - B129 owns get_secret and cloud secret-manager behavior. The AWS SDK owns maintained credential
    providers, STS transport, response decoding and SigV4 signing; do not duplicate them here.
pitfalls:
  - Empty AWS_ROLE_NAME suppresses AWS_ROLE_ARN fallback and still satisfies an is-not-None role branch.
  - An unreadable OIDC path is passed to the secret manager; the exception does not immediately abort signing.
  - Explicit access credentials without a session token must not accidentally inherit an ambient token.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
