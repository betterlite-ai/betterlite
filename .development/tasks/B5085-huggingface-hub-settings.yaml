  - url: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/utils/_auth.py#L449-L456
    why: _clean_token.
  - url: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/utils/_headers.py#L125-L155
    why: get_token_to_send for an explicit token, the implicit-token switch and get_token.
  - url: https://github.com/python/cpython/blob/v3.13.16/Lib/posixpath.py#L229-L333
    why: expanduser and expandvars; expandvars keeps an unknown variable as written.
dod:
  - text: The huggingface_hub section loads every env var above with huggingface_hub's defaults, the staging rules and Python's path expansion, and a bad value stops startup naming the variable.
    proof: [hub-settings]
  - text: The token lookup returns the explicit token as given, honors the implicit-token switch, reads the env token before the token file, and fails with a typed error for an unreadable token file.
    proof: [hub-token]
checks:
  optional:
    - mutants
  commands:
    - id: hub-settings
      why: the settings test is missing or a value, default or path differs from huggingface_hub
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::huggingface_hub::tests::settings_follow_huggingface_hub($|::)/)'
    - id: hub-token
      why: the token test is missing or the lookup order or cleaning differs from huggingface_hub
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^hub_token::tests::token_follows_huggingface_hub($|::)/)'
oracle_cases: []
deviations:
  - what: A path setting that starts with "~name" for another user stops startup with a config error naming the variable, where Python looks that user up in the password database and leaves the text unchanged when the user is unknown.
    why: >-
      Looking up another user's home needs getpwnam. The forbidden-unsafe rule keeps it out of reach, and no pinned crate offers it safely. A path for another user's home is rare in a server config, and failing loudly beats writing to a folder named "~name" under the working directory.
    link: https://github.com/python/cpython/blob/v3.13.16/Lib/posixpath.py#L229-L280
out_of_scope:
  - The download, the cache, retries, Xet and the user agent are hf-hub's; B195 calls it, applies offline and the timeouts, and lists where hf-hub differs.
  - OIDC token exchange, OAuth refresh and the stored tokens file belong to B5088.
  - The Google Colab secret lookup (_auth.py L87-L143) only runs inside Colab notebooks and is not built.
  - HF_HUB_USER_AGENT_ORIGIN is read by hf-hub itself. HF_HUB_DISABLE_SYMLINKS, HF_HUB_DISABLE_SYMLINKS_WARNING and HF_HUB_DISABLE_XET have no hf-hub switch and are B195 deviations. HF_ASSETS_CACHE, HF_XET_CACHE, HF_HUB_DISABLE_PROGRESS_BARS, HF_HUB_DISABLE_TELEMETRY and HF_DEBUG feed code no LiteLLM path reaches. None of them is read here.
pitfalls:
  - huggingface_hub reads `os.environ.get("HF_TOKEN") or os.environ.get("HUGGING_FACE_HUB_TOKEN")`, so HF_TOKEN set to spaces wins, cleans to none and never falls back to HUGGING_FACE_HUB_TOKEN.
  - HF_HUB_OFFLINE set to "0" or "false" is non-empty, so TRANSFORMERS_OFFLINE is never read.
  - huggingface_hub's `_as_int(...) or 10` turns a timeout of 0 into 10; docs/compatibility.md says an explicit value is used as given, so 0 stays 0 seconds and every Hub call times out at once.
  - _is_true reads only 1, ON, YES and TRUE and treats any other text as false; B5090's flag also takes 0, no, off and false and turns other text into a load error, as docs/compatibility.md says.
  - Staging sets HUGGINGFACE_HUB_CACHE after HF_HUB_CACHE was already computed (constants.py L177 runs before L264), so the download cache stays on the production path while the token moves to huggingface_staging.
  - HOME set to an empty string still counts in expanduser, so "~/.cache" becomes "/.cache".
  - clippy.toml bans std::env::var; read every value through the config's environment lookup, never the process env that hf-hub reads.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
