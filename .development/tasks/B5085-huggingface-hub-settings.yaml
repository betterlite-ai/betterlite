id: B5085
title: Hugging Face Hub settings and token for hf-hub
description: >-
  LiteLLM counts tokens for command-r, llama-2 and llama-3 models with tokenizers it downloads from the Hugging Face Hub: tokenizers' Tokenizer.from_pretrained calls huggingface_hub.hf_hub_download (huggingface_hub 1.32.0 and tokenizers 0.23.1 in LiteLLM's uv.lock). Max decided on 2026-10-31 that betterlite downloads from Hugging Face wherever LiteLLM does, through the hf-hub crate (1.0.0), and ports only what hf-hub lacks. hf-hub reads some of huggingface_hub's env vars itself, but it never reads HUGGING_FACE_HUB_TOKEN, TRANSFORMERS_OFFLINE, XDG_CACHE_HOME or either timeout, does not clean the token, and does not expand "~" or "$VAR". This task reads the settings huggingface_hub reads into the config section huggingface_hub and builds the token lookup in crates/betterlite-http/src/hub_token.rs and hub_token/**. B195 passes the endpoint, the cache folder and the token to hf-hub's HFClientBuilder explicitly and applies offline and both timeouts around the download. B5088 adds OIDC and OAuth refresh to the lookup.


  Section huggingface_hub (crates/betterlite-config/src/sections/huggingface_hub.rs and huggingface_hub/**) reads env vars only, through the config's environment lookup, like sections/billing_metrics.rs. Bools go through B5090's flag and integers through B5090's number. It exposes: endpoint, HF_ENDPOINT with trailing "/" stripped, default "https://huggingface.co"; staging (HUGGINGFACE_CO_STAGING) sets the endpoint to "https://hub-ci.huggingface.co" whatever HF_ENDPOINT says; offline, HF_HUB_OFFLINE, or TRANSFORMERS_OFFLINE when HF_HUB_OFFLINE is unset or empty; etag_timeout and download_timeout in whole seconds from HF_HUB_ETAG_TIMEOUT and HF_HUB_DOWNLOAD_TIMEOUT, default 10 each; disable_implicit_token (HF_HUB_DISABLE_IMPLICIT_TOKEN), default false; and env_token, HF_TOKEN, or HUGGING_FACE_HUB_TOKEN when HF_TOKEN is unset or empty, as a SecretString cleaned like _clean_token (drop every "\r" and "\n", strip whitespace, empty means none). hf_transfer_deprecated is true when HF_HUB_ENABLE_HF_TRANSFER is true and HF_XET_HIGH_PERFORMANCE is not; huggingface_hub then raises a FutureWarning on import, and B195 logs the same warning when it builds the client.


  Paths. hf_home is HF_HOME, else "{XDG_CACHE_HOME}/huggingface", else "~/.cache/huggingface". hub_cache is HF_HUB_CACHE, else HUGGINGFACE_HUB_CACHE, else "{hf_home}/hub". token_path is HF_TOKEN_PATH, else "{hf_home}/token". stored_tokens_path is "stored_tokens" in the folder of token_path. Each env-sourced value is expanded the way Python's os.path.expanduser then os.path.expandvars do: a leading "~" alone or before "/" becomes HOME from the lookup (else the current user's home from the home crate) with its trailing "/" stripped, then every $name and ${name} whose name is set in the lookup is replaced and every other one stays as written. Staging changes only the token path: token_path becomes "~/.cache/huggingface_staging/token" while hub_cache and stored_tokens_path keep the values computed before, as constants.py L259-L265 does.


  Token (hub_token). HubToken has two choices, Explicit(SecretString) for a token the caller passes and Implicit, the only two LiteLLM reaches since tokenizers passes token only when LiteLLM has one. resolve(&HubToken) returns Option<SecretString>: Explicit is returned as given, even when empty, so the header becomes "Bearer "; Implicit returns none when disable_implicit_token is set, else env_token, else the token file read fresh on every call and cleaned like _clean_token. A missing token file means no token; any other read failure (a folder, no permission, bytes that are not UTF-8) is a typed HubTokenError carrying the path. The settings and the file reader come in through the constructor, and the read uses tokio::fs so async callers never block. B5088 adds OIDC before the env token and OAuth refresh after the file read, so keep the order in one function.


  Tests. sections::huggingface_hub::tests::settings_follow_huggingface_hub loads the defaults, each env var above, HF_ENDPOINT with a trailing slash, staging with and without HF_ENDPOINT, the TRANSFORMERS_OFFLINE fallback, HF_TOKEN "" falling back to HUGGING_FACE_HUB_TOKEN, a token with "\r\n" inside, "~" and "$VAR" expansion with set and unset names, a timeout of 0, a bad bool and a bad integer. hub_token::tests::token_follows_huggingface_hub covers an explicit token, an empty explicit token, the implicit-token switch, env before file, a missing file, a file with only whitespace and an unreadable path.
scope:
  paths:
    - crates/betterlite-http/src/hub_token.rs
    - crates/betterlite-http/src/hub_token/**
    - crates/betterlite-http/Cargo.toml
    - crates/betterlite-config/src/sections/huggingface_hub.rs
    - crates/betterlite-config/src/sections/huggingface_hub/**
    - crates/betterlite-config/Cargo.toml
    - Cargo.toml
  lint_tables: false
references:
