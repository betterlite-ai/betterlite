    why: LiteLLM's lock pins huggingface-hub 1.32.0 with hf-xet on x86_64 and arm64.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2518-L2532
    why: create_pretrained_tokenizer passes LiteLLM's optional auth token on to from_pretrained.
  - url: https://github.com/huggingface/tokenizers/blob/v0.23.1/bindings/python/src/tokenizer.rs#L786-L812
    why: from_pretrained calls hf_hub_download for tokenizer.json and passes token only when one is given.
  - url: https://docs.rs/hf-hub/1.0.0/hf_hub/struct.HFClientBuilder.html
    why: The builder B195 hands endpoint, cache_dir and token to; without a token it runs its own lookup.
