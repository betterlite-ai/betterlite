  - url: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/constants.py#L159-L194
    why: HF_HOME, the hub cache env vars and the offline switch.
  - url: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/constants.py#L249-L265
    why: The token and stored-tokens paths and how staging moves only the token path.
  - url: https://github.com/huggingface/huggingface_hub/blob/v1.32.0/src/huggingface_hub/constants.py#L287-L313
