    why: reload_admitted_user.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L223-L230
    why: The admitted-user marker the final scrub reads.
dod:
  - text: >-
      admit_mcp_request picks the arm in LiteLLM's order for the well-known route, an explicit key with a bridge envelope, an explicit key alone, passthrough, bridge authorization, session bearer, oauth2 and the plain key.
    proof: [entry-tests]
  - text: >-
      The final scrub runs on every arm and drops the gateway credential from oauth2, raw, mcp-auth and per-server headers, treating a session-admitted subject as admitted.
    proof: [entry-tests]
  - text: >-
      A failed oauth2 or plain admission goes through admission_failure_fallback with bearer_presented true or false, and an error that is not Http or Proxy is not caught.
    proof: [entry-tests]
  - text: >-
      The bridge arms need master_key (500), run the pre-DB gates before the envelope is opened, answer an invalid envelope with the bridge challenge, answer a principal mismatch with 403 oauth_principal_mismatch, and inject the sealed token under the alias first.
    proof: [bridge-tests]
  - text: >-
      The gateway session arm needs master_key (500), fails a bad signing config as 500, challenges an invalid or foreign bearer, converts a 401 from the reload or live policy into the challenge, and lets a 503 through.
    proof: [session-tests]
  - text: >-
      reload_admitted_user maps each read fault, a missing row and scim_active false to LiteLLM's 401, 503 or 500, and stamps the marker, the fresh-policy flag, the user limits and the team rate limits.
    proof: [reload-tests]
checks:
  optional: []
  commands:
    - id: entry-tests
      why: The arm order, the final scrub or the fallback wiring tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::request_admission::entry::/)'
    - id: bridge-tests
      why: The bridge arm tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::request_admission::bridge_arms::/)'
    - id: session-tests
      why: The gateway session arm tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::request_admission::gateway_session::/)'
    - id: reload-tests
      why: The user reload tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::request_admission::user_reload::/)'
deviations:
  - what: Stores, the authenticator and the team limit lookup are generic ports, and the session signing keys come from RequestAdmissionSettings.
    why: betterlite has no proxy_server globals (prisma_client, user_api_key_cache, master_key). The composition root fills the ports.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L1078-L1148
  - what: Rust returns RequestAdmissionError values and the route renders them. LiteLLM raises HTTPException and ProxyException.
    why: Status, detail and headers are kept as LiteLLM sends them.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L416-L630
out_of_scope:
  - "Cold-start checks, challenge builders, _admission_failure_fallback, _target_servers_are_true_passthrough, _single_dcr_bridge_delegate_target and _dcr_bridge_invalid_token_challenge: B7490."
  - "The key reload, the live policy, the SCIM key check, the scrub, the envelope match and the auth error test: B4679. _is_mcp_admitted_user_subject is key_identity there."
  - "Header and path parsing: B4654. Bearer shape tests and token opening: B4653. _admitted_subject_team_rpm_limits: B4671."
  - "MCPRequestHandler methods from get_mcp_server_access down, UnloadableEntitlementError, _as_list and _agent_capped_servers: B4668 to B4672 and B4671."
  - "Registering the /mcp routes and wiring the ports: B137."
pitfalls:
  - The explicit-key test is whether x-litellm-api-key is present at all, so an empty value still takes the explicit arm and fails authentication.
  - The dual-credential arm authenticates the explicit key before it opens the envelope, so a bad key keeps its own 401 or 403 and never reaches the envelope check.
  - A principal mismatch is a 403 and never falls back to either credential alone.
  - The delegate arm's token injection is keyed by alias before server_name, because egress looks up alias first and a caller-supplied x-mcp-{alias}-authorization would otherwise win.
  - The pre-DB gates run before the envelope or session crypto, so a blocked IP is refused before any scrypt work.
  - A 401 from the session reload or live policy becomes the invalid_token challenge, but a 503 database outage passes through as a retryable error.
  - Arm 4 admits an anonymous caller only when no oauth2, per-server or mcp-auth header exists, so a bridge server with any client credential goes to arm 5.
  - The final scrub runs for every arm including the well-known route and treats a session-admitted subject as admitted, which drops every Authorization pair from raw_headers.
  - scim_active counts only as the JSON value false, so a missing key, null or the text "false" does not deactivate.
  - Session signing keys come from resolve_session_signing_keys with the configured SigningConfig; a bad RS256 setting is a 500 and never silently HS256.
review_level: security
oracle_cases: []
budget:
  max_changed_lines: 1500
  max_new_expects: 0
