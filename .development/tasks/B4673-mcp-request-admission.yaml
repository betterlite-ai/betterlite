  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L978-L1076
    why: _admit_gateway_session, the pre-DB gate call and _reload_admitted_principal.
