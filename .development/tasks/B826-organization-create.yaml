dod:
  - text: All named creation cases run through native HTTP with real Postgres, proving status/detail,
      null/absent fields, sequential writes, silent user-lookup failure and no new exception translation.
    proof: [behavior-tests]
  - text: Every org-access and budget-transform case exercises the production helpers; failures prove
      membership scope, null presence and nested-field precedence independently of the create route.
    proof: [behavior-tests]
  - text: native_organization_routes_without_license proves only the license guard is omitted, and the
      MIT equality authentication-before-license case never enables premium_user.
    proof: [behavior-tests, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Organization creation, shared authorization or ordered-failure tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E
        'test(/^organization_create::tests::/) - test(/replays_the_/)'
oracle_cases:
  - tools/oracle/cases/management/organization-create/authentication-before-license.yaml
deviations:
  - what: Authenticated callers reach the organization routes without a license; MIT instead rejects
      them with 403 detail.error beginning Organizations are only available for LiteLLM Enterprise users.
      The subsequent admin checks, database errors and writes are retained.
    why: README Decisions removes the paid tier. native_organization_routes_without_license tests this
      difference; authenticated handler results cannot enter an equality corpus against the MIT router.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L96-L111
out_of_scope:
  - B058 owns get_organization_daily_activity L565-L613 and resolve_organization_daily_activity_scope
    L621-L663 in organization_endpoints.py.
  - B827 owns update_organization L699-L808, handle_update_object_permission L811-L835,
    delete_organization L1006-L1057 and _delete_organization_keys L1060-L1079; B2342 owns v2 update L844-L997.
  - B828 owns organization_member_add L1281-L1397, find_member_if_email L1400-L1420,
    organization_member_update L1430-L1572, organization_member_delete L1580-L1621 and
    add_member_to_organization L1624-L1706; B1212 owns list/info/deprecated-info L1088-L1271.
pitfalls:
  - An empty object_permission creates a row despite the create-route docstring saying otherwise.
  - The swallowed user-row lookup failure changes what can_user_call_model receives after child rows exist.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
