id: B826
title: Organization creation and nested budget writes
description: >-
  Implement organization create types, scope checks, nested budget writes, _set_object_permission and
  POST /organization/new. Preserve source order without a transaction: create budget, create object permission,
  validate model access and then create the organization. Failed later checks may leave earlier rows behind.
  Remove only the enterprise-license guard; all ordinary validation and authorization stays.


  Build the production organization_create module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/organization_endpoints.py:
  _enterprise_license_required (L96-L108; 12 source lines), _ObjectPermissionRow.object_permission_id
  (L116-L116; 1 source lines), _UserTableClient.find_unique (L120-L120; 1 source lines), _BudgetTableClient.create
  (L124-L124; 1 source lines), _ObjectPermissionTableClient.create (L128-L128; 1 source lines), _OrganizationTableClient.create
  (L132-L134; 3 source lines), _OrganizationTableClient.find_unique (L136-L138; 3 source lines), _OrganizationTableClient.find_many
  (L140-L144; 5 source lines), _OrganizationTableClient.update (L146-L151; 6 source lines), _OrganizationTableClient.delete
  (L153-L155; 3 source lines), _OrganizationMembershipTableClient.create (L159-L159; 1 source lines),
  _OrganizationMembershipTableClient.find_unique (L161-L163; 3 source lines), _OrganizationMembershipTableClient.find_many
  (L165-L167; 3 source lines), _OrganizationMembershipTableClient.update (L169-L171; 3 source lines),
  _OrganizationMembershipTableClient.delete (L173-L173; 1 source lines), _OrganizationMembershipTableClient.delete_many
  (L175-L175; 1 source lines), _TeamTableClient.delete_many (L179-L179; 1 source lines), _VerificationTokenTableClient.find_many
  (L183-L183; 1 source lines), _VerificationTokenTableClient.delete_many (L185-L185; 1 source lines),
  _ObjectPermissionTxClient.upsert (L193-L195; 3 source lines), _BudgetTxClient.update (L199-L199; 1 source
  lines), _TransactionTables.litellm_objectpermissiontable (L204-L204; 1 source lines), _TransactionTables.litellm_budgettable
  (L207-L207; 1 source lines), _TransactionTables.litellm_organizationtable (L210-L210; 1 source lines),
  _TransactionManager.__aenter__ (L214-L214; 1 source lines), _TransactionManager.__aexit__ (L216-L221;
  6 source lines), _table (L225-L225; 1 source lines), _table (L229-L229; 1 source lines), _table (L233-L233;
  1 source lines), _table (L237-L237; 1 source lines), _table (L241-L241; 1 source lines), _table (L245-L245;
  1 source lines), _table (L249-L249; 1 source lines), _table (L252-L262; 11 source lines), _verify_org_access
  (L265-L306; 36 source lines), build_budget_write_data (L317-L333; 17 source lines), handle_nested_budget_structure_in_organization_update_request
  (L336-L357; 17 source lines), new_organization (L366-L557; 152 source lines), _set_object_permission
  (L666-L690; 23 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Register these actual HTTP routes and aliases exactly once: POST /organization/new -> new_organization.
  For each route send a typed successful request, an invalid or missing target, and a caller lacking that
  route permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 328 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  328 production, 160 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 553 changed lines estimated within a 575-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
scope:
