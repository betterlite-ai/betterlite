id: B826
title: Organization creation and nested budget writes
description: >-
  Implement organization_create and the shared organization access/write contracts. Own
  organization_endpoints.py L96-L357 (the router license dependency, repository/transaction protocols,
  _table overloads, _verify_org_access and budget transforms), new_organization L366-L557 with its
  L360 decorator, and _set_object_permission L666-L690. POST /organization/new uses B052 authentication
  and B124's NewOrganizationRequest/NewOrganizationResponse. The router-level premium_user guard
  returns 403 in MIT before authenticated handlers run; omit only that guard per README Decisions.
  Native HTTP tests exercise the resulting handlers, while the MIT equality corpus contains only
  authentication failures that precede the license guard. Do not fake an enterprise installation or
  claim an authorized creation success matches the unmodified MIT router.

  NewOrganizationRequest requires organization_alias, defaults models=[] and organization_id,
  budget_id, metadata, model_rpm_limit, model_tpm_limit and object_permission to null. B124/B725 own
  the request and budget row schemas, including null defaults for max_budget, soft_budget,
  max_parallel_requests, tpm_limit, rpm_limit, tpd_limit, model_max_budget, budget_duration,
  allowed_models, temp_budget_increase and temp_budget_expiry. Cases create_request_defaults and
  inherited_budget_fields_preserved verify those projections. The source's .json() returns a mapping,
  not serialized JSON text; use B124's jsonify_object conversion when preparing DB records.

  Handler checks are ordered: missing database gives HTTPException 500 detail.error="DB not connected.
  This endpoint needs a database; set DATABASE_URL to a PostgreSQL connection string (postgresql://...)
  to enable it. See https://docs.litellm.ai/docs/proxy/virtual_keys"; role other than exact proxy_admin,
  including null and proxy_admin_view_only, gives 401 "Only admins can create orgs. Your role is = <role>";
  missing router gives 500 "No models configured on proxy". Then max_budget and soft_budget, in that
  order, reject negative or nonfinite values as 400 "<field> must be a non-negative finite number.
  Received: <value>". Zero is valid; there is no soft-versus-max comparison. Cases create_guard_order,
  create_role_matrix and create_budget_number_matrix name every branch and wire detail.

  If caller.user_id is nonnull, read B723.UserRepository by that ID and validate its row. Swallow ALL
  lookup or validation exceptions silently and continue with no user object. When budget_id is null,
  select only LiteLLM_BudgetTable fields from the exclude-none request, validate the budget record,
  jsonify it, create it through B725, and mutate data.budget_id to its returned ID. Actor columns are
  caller.user_id or litellm_proxy_admin_name. Even a request without budget values creates a budget;
  an explicit ID, including empty string, bypasses creation without a handler existence check.
  Cases user_lookup_failure_is_silent, empty_request_budget_created, explicit_budget_bypasses_create
  and budget_actor_fallback verify exact calls and surviving rows.

  Next _set_object_permission returns null without DB or when object_permission is null. A nonnull
  permission, including {}, calls B816.reject_ambiguous_mcp_tool_permission_keys with existing=None,
  then creates a B725 permission row from exclude-none fields, removes the request's object_permission
  field and returns its ID. It never encrypts these grant lists. Cases permission_none_and_empty,
  ambiguous_permission_stops_after_budget and permission_removed_from_org_payload prevent the docstring's
  incorrect claim that {} means no row from becoming behavior.

  Only after those writes, a caller with models=[] skips model checks. Otherwise requested models=[]
  raises 400 "User not allowed to give access to all models. Select models you want org to have access to.";
  each requested model is checked in order by B886.can_user_call_model with llm_router and the optional
  fetched user object. It does not directly compare the requested list to caller.models. Cases
  unrestricted_caller_skips_model_checks, restricted_caller_all_models_denied and model_check_inputs_order
  verify this boundary. budget_survives_permission_failure and permission_survives_model_denial prove
  that neither earlier write rolls back when a later validation fails.

  Construct LiteLLM_OrganizationTable from the remaining exclude-none payload plus object_permission_id
  and actor columns. For every nonnull field in _ORG_METADATA_FIELDS call B861._set_object_metadata_field:
  model_rpm_limit, model_tpm_limit, model_itpm_limit, model_otpm_limit, default_estimated_output_tokens,
  default_estimated_output_tokens_per_model, mcp_rpm_limit, tag_rpm_limit, rpm_limit_type, tpm_limit_type,
  enforced_params, allowed_vector_store_indexes, enforced_batch_output_expires_after,
  enforced_file_expires_after, throttle_on_budget_exceeded, enable_prompt_caching and end_user_budget_id.
  temp_budget_increase/expiry belong to the budget and are excluded from this list. B124's schema decides
  which attributes are representable; unknown inputs do not acquire new fields here. Jsonify, log
  "new_organization_row: %s" with indent=2 JSON, then create the B723 organization with
  include.litellm_budget_table=true and return it. Cases metadata_field_partition, organization_row_defaults,
  creation_log_before_insert and organization_failure_keeps_children cover that final stage. No duplicate
  alias precheck, cache invalidation, audit wrapper or handle_exception_on_proxy exists here; repository
  errors propagate through B003's server error boundary with prior rows intact.

  _verify_org_access first allows B2314._user_has_admin_view, including view-only proxy administrators.
  Others need a truthy user_id and B736.get_user_object(user_id_upsert=false), then at least one exact
  organization_id membership with role org_admin. Missing user, absent/empty memberships, wrong org
  or other role give 403 with STRING detail="You do not have access to this organization". Lookup
  errors propagate. Cases org_access_admin_view_bypasses_lookup, org_access_missing_user,
  org_access_membership_matrix and org_access_lookup_error protect callers in B827/B828/B1212.

  _BUDGET_SETTABLE_FIELDS is the budget schema's fields minus budget_id; _ORG_COLUMN_FIELDS contains
  organization_alias and models. build_budget_write_data preserves sent values, recomputes
  budget_reset_at through B2317.get_budget_reset_time when a sent budget_duration is a string, clears
  reset_at for a sent nonstring/null duration, and leaves it untouched when duration is omitted. Its
  recomputed reset and supplied updated_by override input values. Cases budget_duration_omitted,
  budget_duration_reset_and_clear and budget_actor_override use a fixed clock/current reset settings.
  The nested-budget transformer shallow-copies input, removes litellm_budget_table, and, if its value
  is truthy, overlays only recognized budget fields INCLUDING budget_id onto top-level values, with
  nested null winning. Falsey nested values are discarded; a truthy nonmapping fails at .items(). Cases
  nested_budget_precedence, nested_budget_falsey_removed and nested_budget_nonmapping_fail pin these rules.

  Keep native record/protocol declarations with these helpers so B827 and its v2 split depend downward.
  Repositories remain B723/B725/B726/B724/B722, and the protocol adapters add no reads on construction.
  B860's Postgres fixture consumes POSTGRES_TEST_URL and falls back to testcontainers only when absent;
  an invalid configured URL fails. Money follows the workspace Decimal conversion rule. This task reads
  no new environment setting: DATABASE_URL occurs in an error, and license state/admin name/reset
  settings come from their existing owners. There is no new byte parser. Count 366 nonblank/noncomment
  lines including complete declarations, decorators and docstrings; allow 330 implementation, 390 native
  tests and 65 registration lines, 785 within 800, splitting Rust implementation files below 300 lines.
