    - crates/betterlite-config/src/provider_budget_view.rs
    - crates/betterlite-config/src/provider_budget_view/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/provider-budget-view-*
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/spend_estimate.rs
