dod:
  - text: Cost estimates honor model-first precedence, last matching deployment and the limited token override contract.
    proof: [estimate-tests, estimate-corpus, oracle]
  - text: Provider budget reads and weekly/monthly query service preserve their source errors and perform no debit.
    proof: [estimate-tests, provider-view-tests, provider-view-corpus, oracle]
checks:
  optional: [mutants]
  commands:
    - id: provider-view-tests
      why: The lower provider reader or its configuration projection is missing.
      run: cargo nextest run --locked -p betterlite-router -p betterlite-config --no-tests=fail -E 'test(/^provider_budget_view::/) + test(loads_provider_budget_view)'
    - id: provider-view-corpus
      why: Provider-budget configuration has no new loader input.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/provider-budget-view-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: estimate-tests
      why: Estimate selection, provider budget projection or alert query execution is absent.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^spend::estimates::/) - test(replays_the_spend_estimate_corpus)'
    - id: estimate-corpus
      why: Estimate-body parsing has no newly committed malformed and precedence samples.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/spend_estimate)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_spend_estimate_corpus)'
oracle_cases:
  - tools/oracle/cases/http/spend-estimates/model-response-precedence-and-missing-messages.yaml
  - tools/oracle/cases/http/spend-estimates/alias-last-deployment-token-overrides.yaml
  - tools/oracle/cases/http/spend-estimates/unmapped-model-and-provider-budget-errors.yaml
  - tools/oracle/cases/http/spend-estimates/provider-spend-and-reset-projection.yaml
deviations: []
out_of_scope:
  - In types/utils.py this leaf extracts BudgetConfig's provider-limit aliases; B014 retains its unrelated shared type helpers and B020/B383 retain non-provider budget policy.
  - B068 performs pricing; B020/B383 retain filtering/window initialization and consume the extracted read view; B116 owns alert delivery using this query service.
  - B020/B326/B383 retain other budget_limiter methods; earlier routing tasks retain unrelated router.py methods.
  - B1721-B1724, B1726/B1727, B1704, B069 and the log-detail/session leaves own the other spend endpoint functions; earlier _types.py owners retain unrelated records.
pitfalls:
  - Estimate selection uses the last deployment in a group and never calls the router's selection strategy.
  - A missing messages field fails a model request even when completion_response would have been sufficient on its own.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
