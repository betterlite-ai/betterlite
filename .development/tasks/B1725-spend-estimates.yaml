id: B1725
title: Calculate request estimates and expose provider budget state
description: >-
  Add POST /spend/calculate and GET /provider/budgets in server::spend::estimates. Decode
  SpendCalculateRequest from bounded JSON with model, messages and completion_response
  optional fields; keep model-first precedence even when a response is also supplied.
  A non-null model requires messages, including an empty list as a supplied value.
  Search B844's deployment list in order, resolving a configured model_group_alias first,
  and retain the last matching deployment. With a match, bill its underlying model and
  only the input/output token overrides from litellm_params. Either non-null override
  constructs CostPerToken; preserve the other absent member's validation behavior. Do not
  infer custom pricing from model_info or choose a load-balanced deployment. Without a
  match, pass the requested model to B068's completion cost. A response-only request uses
  the existing chat ModelResponse decoder before pricing. Missing both inputs is 400.
  Return cost as Decimal JSON. HTTP exceptions become ProxyException with the source's
  type/param defaults of the string None; ModelNotMappedError becomes 400
  invalid_request_error/param model; other cost failures retain available status/type/param
  or default to 500/None/None. This route estimates locally and never sends an inference.
  Extract the provider budget read view into betterlite-router::provider_budget_view,
  below B020/B383: select the cached router limiter, otherwise the first exact router-budget
  callback kind in B189's optional callbacks, never a key-budget subclass. Own the two
  budget_limiter provider read methods and their three-line _get_budget_config_for_provider
  lookup here; inline the lookup into the view rather than adding a forwarding wrapper.
  Look up provider_spend:{provider}:{budget_duration}
  in Redis when attached, otherwise DualCache; a missing value becomes zero, a missing
  provider config becomes null, and Redis errors do not fall back to local spend. TTL null
  produces null; any numeric TTL, including negative values, is added to injected UTC now.
  Load router_settings.provider_budget_config in a lower config::provider_budget_view
  projection (default null), mapping budget_limit/time_period into nullable max_budget and
  budget_duration without interpreting duration syntax. Own this BudgetConfig alias
  projection below the router, preserving the source's nullable fields; the unrelated
  tpm/rpm fields stay with their policy owners. B383 consumes this projection when
  it later initializes windows; this task does not depend on its higher budget policy.
  loads_provider_budget_view proves both fields through config and config_yaml replay.
  Missing router yields its 500 HTTP error through
  B865's proxy exception converter; missing config or limiter follows the same converter's
  ValueError behavior. Iterate configured providers, substitute zero for falsey spend, and
  return budget_limit, time_period, spend and budget_reset_at under providers. Do not refresh
  or debit a budget while serving this read endpoint.
  Also provide the lower report query _get_spend_report_for_time_range used by Slack's
  weekly/monthly reports: parse UTC dates, run team totals followed by expanded-tag totals
  through the inclusive end day, and return the pair. Missing DB logs and returns None;
  query errors log and return None, while date conversion errors occur before the catch.
  Keep this database-facing service independent of the Slack integration to avoid a cycle.
  decode_spend_estimate is fuzzed in the server crate. HTTP oracle cases exercise both
  endpoints with deployment aliases and provider budgets; native PostgreSQL tests prove
  the alert query's ordering and timezone independence. About 345 source lines including
  extracted provider reads and three request/response records receive an 800-line allowance.
