oracle_cases: []
deviations:
- what: Unsupported-provider errors are raised as ValueError when get_provider_interactions_api_config returns None;
    litellm.exception_type then converts this ValueError to the appropriate exception class.
  why: >-
    LiteLLM raises ValueError with the message 'Interactions API not supported for: {provider}' at line 425-426 and
    lets its own exception_type handler convert it. The error class derives from the generic ValueError conversion,
    not from a config method call.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/main.py#L425-L426
out_of_scope:
- Provider selection beyond defaulting to "gemini" when absent. B3490 owns get_provider_interactions_api_config.
- HTTP client initialization or pooling. B3492 owns the HTTP GET operation and client resolution.
- Request/response transformation. B1369 (Vertex) and B1370 (Studio) own provider-specific transforms via the contract.
- Background polling orchestration. B3496 owns scheduling and settlement logic.
- Route handlers for /v1beta/interactions/{id}. B3507 owns the proxy endpoint.
- Streaming responses. B3491 owns the streaming iterator.
pitfalls:
- The default provider is "gemini", not an empty string or None. When custom_llm_provider is absent or None, replace
  it with the literal "gemini" before calling get_provider_interactions_api_config.
- >-
    When get_provider_interactions_api_config returns None, raise ValueError with the message
    'Interactions API not supported for: {provider}'. Do not call a get_error_class method on the config;
    litellm.exception_type will convert the ValueError to the appropriate exception class.
- The logging object's update_from_kwargs method merges metadata and calls update_environment_variables; it does not
  check the no_log flag. The no_log check happens later in B247's should_run_callback when callbacks fire.
- The async aget delegates to get via a thread executor with context propagation using asyncio.get_event_loop().run_in_executor
  and contextvars.copy_context(), preserving request spans and call IDs.
- The _is_async flag is set by aget before delegating to get, signaling that get is being called from an async context;
  get checks this flag to determine whether to return a coroutine or a direct response.
- The interaction_id is logged as part of optional_params in update_from_kwargs, not as a separate structured field.
