id: B3495
title: Retrieve interactions through the public call pipeline
description: >-
  Add the public interaction retrieval API with sync and async retrieval functions. Implement get and aget
  functions that accept an interaction_id, wrap B3492's native HTTP GET operations, apply default Gemini
  provider when none is specified, record per-call logging metadata, and propagate context in the async path.

  The get and aget functions take an interaction_id string, optional provider override, logging object, and
  litellm_params, and return the populated InteractionsAPIResponse from the interaction provider. When
  custom_llm_provider is absent or empty, default to "gemini"; when get_provider_interactions_api_config
  returns None for the provider, raise ValueError with the provider name. The logging object is updated
  via update_from_kwargs with the interaction_id in optional_params and litellm_call_id in litellm_params;
  the actual no-log eligibility check happens in B247's logging pipeline via should_run_callback, not in
  this task. The async variant aget propagates context across the executor boundary using the same pattern
  as B3499's create, so that per-request tracing spans and request IDs follow the async call. The sync variant
  get handles both sync and async callers via a _is_async flag in kwargs (set by aget before delegating).
  All exceptions are caught and re-raised via litellm.exception_type, which converts the ValueError to the
  appropriate exception class.
