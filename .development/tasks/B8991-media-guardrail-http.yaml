out_of_scope:
  - B3677 owns media translation; B1419 owns the rerank handler and B3680 its concrete adapter and registry entry.
  - B083 and B085 own audio and rerank routes; B3343, B3344 and B6360 own the video handlers and their registered route stubs.
  - B8804 supplies production precall processing, B8636 supplies the rerank route ports, and B3666 owns deployment hooks.
  - Existing image, embedding and text-completion HTTP cases remain B3680; this task does not duplicate them.
pitfalls:
  - A transcription test that assumes a proxy post-success hook would prove behavior the pinned audio route does not have.
  - The video registry includes edit and extension call types as well as generation and remix.
  - Rerank documents are deliberately absent from the scanner input even when they contain the sentinel query text.
  - The generic API's intervention token is GUARDRAIL_INTERVENED, not MASK or SANITIZED.
review_level: standard
