    why: Query and instruction positional rewrite; documents and results are not scanned.
dod:
  - text: Speech request rewrites and blocks, transcription input skips and deployment output scans match the running reference over both aliases.
    proof: [oracle]
  - text: All four video operations send the scanned prompt through both aliases, and blocked generation never reaches its provider.
    proof: [oracle]
  - text: Rerank scans query then instruction on every alias, preserves documents and handles a short replacement list without inventing an output scan.
    proof: [oracle]
