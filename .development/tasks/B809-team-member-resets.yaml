      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_member_resets::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_member_resets::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_member_resets::tests::postgres_failure_effects$/)'
