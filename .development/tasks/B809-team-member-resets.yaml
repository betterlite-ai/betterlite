dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: self_reset_denied, negative_spend,
      reset_zero, reset_member_default, shared_budget_unmodified, counter_publication, postgres_pinned_rows,
      postgres_failure_effects, no_database, team_scope_denied, member_missing,
      proxy_self_spend_allowed, own_budget_allowed, missing_reset_to_422, bool_reset_422,
      numeric_string_reset, helper_bool_numeric, wrong_reset_type, nonfinite_spend,
      above_current_spend, above_budget, validation_order, equality_allowed, null_spend_zero,
      missing_budget_uncapped, member_spend_only, spend_cache_failure_committed,
      default_id_wrong_type, default_id_empty_string, dangling_default_disconnect,
      budget_reset_keeps_spend, custom_budget_source, null_budget_source,
      budget_cache_without_new_spend and reset_response_fields.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
