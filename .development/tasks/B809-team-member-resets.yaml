id: B809
title: Reset member spend and restore inherited budgets
description: >-
  Implement the two member reset routes, retaining their distinct self-reset policy. Both first reject
  no database with HTTP 500 DB not connected. prisma_client is None, fetch the team through B737 with
  check_db_only=true and parent_otel_span=None, then require B800 TEAM_OR_ORG_ADMIN (403 otherwise).
  Spend reset additionally rejects target user_id==caller.user_id unless the caller is proxy_admin,
  with 403 Cannot reset your own spend. Ask a proxy admin. Budget reset deliberately has no such check.
  Both find membership by user_id_team_id and return HTTP 404 User <id> is not a member of team <id>.

  B124's ResetSpendRequest requires reset_to and rejects booleans before numeric coercion (422).
  The owned helper itself accepts Python int/float, including bool if directly called; other types
  are 400 reset_to must be a float. Reject negative/nonfinite values (400 finite number >= 0), then
  values above membership.spend or 0 (400 <= current spend), then above a nonnull expanded budget
  (400 <= budget); equal values and zero pass. Use Decimal after the boundary, preserving numeric
  strings accepted by the request model and testing nonfinite helper inputs natively.

  Spend reset expands litellm_budget_table, writes only membership.spend, then calls B734's concrete
  invalidate_team_member_spend_state with new_spend=reset_to. Return team_id/user_id/spend/previous_spend/
  max_budget, including null max_budget if no budget row. Do not reset user/team spend or daily history.
  There is no transaction, advisory lock or compare-and-swap protecting the read/write; cache failure
  leaves the database reset committed. B734 owns floor/counter publication semantics; this route does
  not use KeySpendReset's separate contract.

  _team_default_budget_id validates metadata as a mapping and accepts only a string value, including
  empty string. _existing_team_default_budget_id queries B801's budget table only when a string exists
  and returns None for a dangling reference. Budget reset connects membership to the existing default
  or disconnects it with {disconnect: true}; it never deletes or changes the old/shared budget row or
  membership spend. Then invalidate member spend state WITHOUT new_spend. Return budget_id,
  previous_budget_id and budget_source=team_default or none. The reusable _member_budget_source returns
  custom for a nonnull ID unequal to the default, team_default for an existing default, else none.

  All errors are HTTPException details {error: message} or dependency exceptions. There is no local
  catch or handle_exception_on_proxy call; B003/B865 preserve the actual public envelope. HTTP cases
  assert status/type/param/code, null response fields and content-type, ignoring only message wording.
  These functions read no environment/configuration setting and produce no audit or changed-by event.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  _check_not_resetting_own_spend (L3918-L3928; 11 source lines), _raise_reset_spend_error (L3931-L3933;
  3 source lines), _validate_team_member_reset_spend_value (L3936-L3961; 22 source lines), reset_team_member_spend_fn
  (L3970-L4033; 56 source lines), _team_default_budget_id (L4040-L4043; 4 source lines), _existing_team_default_budget_id
  (L4046-L4053; 8 source lines), _member_budget_source (L4056-L4059; 4 source lines), reset_team_member_budget_fn
  (L4069-L4123; 49 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/{team_id}/member/{user_id}/reset_spend
  -> reset_team_member_spend_fn; POST /team/{team_id}/member/{user_id}/reset_budget -> reset_team_member_budget_fn.
  Exercise both with real membership rows through B001; distinguish an authorized admin resetting
  another member, forbidden own-spend reset, and permitted own-budget reset.


  Reset fixtures use B860 and POSTGRES_TEST_URL (testcontainers only when unset), failing on database
  setup errors and comparing both the member budget row and its spend-cache value after injected faults.


  Sizing: 157 nonblank, noncomment source lines plus metadata view; allow 175 production,
  285 behavior/Postgres tests and 65 route wiring lines, 525 within 550.


  Install B052 and B865 on the two member-reset registrations, retaining each handler's separate catch behavior.
