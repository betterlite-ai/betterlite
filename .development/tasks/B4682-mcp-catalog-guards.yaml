id: B4682
title: MCP catalog pinning and description guardrails
description: >-
  Build catalog override, pin-drift and description-scan services in betterlite-server::mcp::catalog_guard.
  Scan tool descriptions in sequential batches of eight concurrent tools, fail closed per tool on guardrail
  failures, and retain typed blocked-tool and drift alerts without introducing alert delivery here.

  ToolDescriptionScan holds served tools (passed scan) and blocked tools (failed guardrail). The alert() method
  returns a CatalogAlert with signature (comma-joined sorted tool names) and message (one sentence per blocked
  tool) when blocked is non-empty, or None if all tools passed.

  PinnedCatalogDrift holds added, removed and changed tool names. The alert() method returns a CatalogAlert
  with signature (pipe-joined label:names) and message naming the drift type per label, or absent when no
  drift (all three empty).

  apply_description_overrides takes a sequence of MCPTool and a MCPServer, applies tool_name_to_description
  overrides from the server config (keyed by tool name stripped of known prefixes via strip_known_server_prefix),
  and returns a tuple of tools with updated descriptions or originals unchanged.

  strip_known_server_prefix(name, server) removes exactly one of a server's registered prefixes from a tool name.
  The server yields candidate prefixes in order of length (longest first) through iter_known_server_prefixes,
  which includes the current prefix (alias, server_name, or server_id depending on short-prefix mode), short_prefix
  if cached, computed short prefix from server_id, and all historical forms. Candidates are normalized (spaces
  to underscores) and tried longest-first so a prefix containing the separator wins over a shorter leading segment.
  On match, the function returns the bare tool name. Returns name unchanged if server is known but no prefix matches
  (name is unprefixed). Falls back to split_server_prefix_from_name (first separator) only when server is None.

  logging_safe_mcp_headers(raw_headers) sanitizes request headers before guardrail inspection. It drops proxy
  virtual-key headers (including the custom deployment key header from litellm_key_header_name), upstream MCP
  credential headers (the client-side auth header and any headers configured in a server's extra_headers), and
  client-controlled behavior flags (litellm-disable-message-redaction). Host is dropped so the caller cannot
  name the deployment in guardrail payload and spend tracking. Returns a mapping of lowercased header names
  to values, with credential values masked by the proxy's standard redaction rules.

  pin_tool_catalog takes upstream tools and a map of pinned MCPTool by name. It returns a tuple of served
  tools (intersection: upstream tools in pinned_tools, descriptions/schemas from pinned where they differ)
  and a PinnedCatalogDrift if any additions, removals or description/schema changes exist. Additions and
  removals are reported; changed descriptions and schemas are silently restored from the pin without creating
  a warning.

  scan_tool_descriptions takes a sequence of MCPTool and a server context. It scans each tool's description
  and input_schema through the proxy logging guardrail hook with call_type=list_mcp_tools and guardrails_only=True.
  Scanning runs in batches of exactly eight concurrent tools (asyncio.gather in sequential loops). Each scan
  either returns the original tool, returns a masked tool with guardrail-modified description/schema, or on
  exception returns a BlockedTool with name and reason extracted from the exception. Returned ToolDescriptionScan
  separates passed tools (MCPTool instances) from blocked tools (BlockedTool instances) by type check. Tools
  with no scannable text (empty description and empty input_schema) are returned unscanned.

  _block_reason extracts failure detail from an exception: if detail is a mapping with an "error" key,
  return str(error); otherwise return "ExceptionType: message" or just the type name if message is empty.

  _masked_tool applies guardrail result to a tool: validates guarded as a mapping, extracts mcp_tool_description
  and mcp_input_schema fields (defaulting to original values), compares to original, and returns the original
  tool if unchanged or a deep-copied tool with updated fields if changed. Validation uses Pydantic TypeAdapter
  for safety.

