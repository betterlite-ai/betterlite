deviations:
  - what: Guardrail calls are initiated by scan_tool_descriptions with call_type=list_mcp_tools and guardrails_only=True,
      rather than through the complete tool invocation path. In betterlite this is owned by the catalog guard service,
      integrated at discovery time before the full manager/handler stack.
    why: LiteLLM calls guardrails during tool execution in the chat completions flow. betterlite separates catalog
      validation (discovery-time) from invocation (runtime) so guardrails can hide tools upfront. The proxy_logging
      pre_call_hook is the same integration point; the call_type and guardrails_only flag tell the hook to scan
      description/schema only without full invocation context.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_catalog_guard.py#L196-L229
  - what: Tool masking is applied before returning the catalog, preserving deep-copied MCPTool instances with guarded
      description and input_schema. A guardrail failure blocks the entire tool rather than returning a partial result.
    why: LiteLLM masks the tool during catalog filtering. betterlite preserves the same fail-closed behavior; exceptions
      in the guardrail become BlockedTool entries in the scan result, hiding the tool from the served list. The distinction
      between a tool that fails guardrail (BlockedTool) and a tool that is masked (MCPTool with modified fields) is preserved.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_catalog_guard.py#L180-L193
  - what: Batching uses exactly eight concurrent tools per sequential batch, not a different batch size or unlimited concurrency.
    why: LiteLLM uses _CATALOG_SCAN_BATCH_SIZE = 8. betterlite preserves this limit for CPU-bound guardrail checks.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_catalog_guard.py#L55

out_of_scope:
  - Alert delivery and logging; CatalogAlert is a record only, not posted to Slack or stored.
  - Guardrail hook implementation; this task calls the seam but does not implement guardrails.
  - Manager discovery and startup integration; those belong in B138.
  - ProxyLogging, UserAPIKeyAuth and MCPPreCallRequestObject type implementations; those are consumed as type dependencies from B732 and the proxy layer.
  - Helper functions used by strip_known_server_prefix (iter_known_server_prefixes, match_known_server_prefix, split_server_prefix_from_name, get_server_prefix, compute_short_server_prefix, normalize_server_name) are owned here as part of prefix-stripping behavior; their full implementations at utils.py:335-384, 408-443 are available for reference.
  - Helper functions and imports used by logging_safe_mcp_headers (clean_headers, redact_credential_headers, upstream_credential_headers, _custom_litellm_key_header_name, _identity_header_names, _forwarded_upstream_header_names) are owned here as part of header-sanitization behavior; their implementations and external dependencies are available for reference at utils.py:914-1089.

pitfalls:
  - The batch size is exactly eight concurrent tools per sequential batch. Do not change to a different size or make all scanning concurrent at once.
  - Tools with empty description and empty input_schema are not scanned and are returned unchanged, even if other fields might be scannable.
  - 'A guardrail exception blocks the entire tool with reason extracted by _block_reason. If the exception has a detail mapping with an "error" key, use that; otherwise format "Type: message" or just the type name.'
  - '_masked_tool validates guarded as a mapping and extracts mcp_tool_description and mcp_input_schema fields. If either field is missing, use the original value as default. Only return a masked tool if at least one field differs from the original.'
  - 'The pinned_tools map is keyed by tool name (not stripped). apply_description_overrides uses tool_name_to_description (keyed by stripped name). These are different maps with different lookup semantics.'
  - 'PinnedCatalogDrift.alert() returns a signature with pipe-joined "label: names" parts, not comma-separated. Empty drift (all three tuples empty) has no drift return value (None), not an empty alert.'
  - _with_served_entry does a deep copy of the tool. Do not use shallow copy or in-place mutation.
  - 'strip_known_server_prefix tries candidate prefixes longest-first (by string length) so a prefix containing the separator wins. Candidates are normalized (spaces to underscores). Returns name unchanged if a prefix is known but does not match; only falls back to first-separator split when server is None.'
  - 'logging_safe_mcp_headers drops the custom litellm_key_header_name from config, all upstream credential headers (client-side auth header and server extra_headers), and host. It returns lowercased header names with credential values masked by proxy redaction rules.'
  - 'The helper oracle operation is pre-registered as b4682 in the server group. Replace the stub Op in tools/oracle/src/helpers/server/b4682.rs with an impl Helper, and write run in tools/oracle/helpers/b4682.py.'

