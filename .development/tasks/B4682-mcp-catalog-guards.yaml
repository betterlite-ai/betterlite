dod:
  - text: CatalogAlert record with signature and message fields; BlockedTool record with name and reason.
    proof: [catalog-alert-types]
  - text: ToolDescriptionScan record holds served (tuple of Tool) and blocked (tuple of BlockedTool) and implements alert() returning CatalogAlert or None based on blocked content.
    proof: [scan-types, scan-tests]
  - text: PinnedCatalogDrift record holds added, removed, changed (all tuples of strings) and implements alert() returning CatalogAlert with pipe-joined signature and formatted message.
    proof: [drift-types, drift-tests]
  - text: apply_description_overrides applies tool_name_to_description overrides from MCPServer config, keyed by tool name after stripping known prefixes, returning tuple of modified or original tools.
    proof: [scan-tests, override-tests]
  - text: strip_known_server_prefix removes exactly one registered prefix from a tool name by trying longest candidates first;
      returns name unchanged if server is known but no prefix matches, falls back to first-separator split if server is None.
    proof: [prefix-strip-tests, override-tests]
  - text: logging_safe_mcp_headers sanitizes headers for guardrail inspection by dropping proxy virtual-key headers, upstream
      MCP credential headers, client behavior flags (litellm-disable-message-redaction), and host; returns lowercased names with
      credential values masked.
    proof: [header-sanitize-tests, guardrail-call]
  - text: pin_tool_catalog returns served tools (only those in pinned map, with descriptions/schemas from pinned where they differ) and optional PinnedCatalogDrift when additions or removals exist.
    proof: [scan-tests, pinning-tests]
  - text: scan_tool_descriptions scans tools in sequential batches of exactly eight concurrent tools using asyncio.gather, collects passed (MCPTool) and blocked (BlockedTool) separately by type.
    proof: [scan-tests, batch-concurrency]
  - text: scan_tool_descriptions skips tools with no scannable text (empty description and empty input_schema) without calling guardrail.
    proof: [scan-tests, scannable-text]
  - text: _scan_tool catches guardrail exceptions and returns BlockedTool with name and reason extracted by _block_reason.
    proof: [scan-tests, exception-handling]
  - text: _guarded_catalog_entry builds MCPPreCallRequestObject, calls proxy_logging pre_call_hook with call_type=list_mcp_tools and guardrails_only=True, and returns optional guarded mapping.
    proof: [scan-tests, guardrail-call]
  - text: _masked_tool validates guarded result, extracts mcp_tool_description and mcp_input_schema fields, and returns original or deep-copied tool with updates if changed.
    proof: [scan-tests, masking-tests]
  - text: _block_reason extracts error from exception.detail mapping "error" key, or formats type name and message as fallback.
    proof: [scan-tests, error-extraction]
  - text: New oracle helper operation for catalog guard integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: catalog-alert-types
      why: CatalogAlert and BlockedTool record types are missing or incomplete.
      run: grep -qE 'struct (CatalogAlert|BlockedTool)' crates/betterlite-server/src/mcp/catalog_guard.rs && grep -qE 'signature|message|name|reason' crates/betterlite-server/src/mcp/catalog_guard.rs
    - id: scan-types
      why: ToolDescriptionScan record or its structure is missing.
      run: grep -qE 'struct ToolDescriptionScan' crates/betterlite-server/src/mcp/catalog_guard.rs && grep -qE 'served|blocked' crates/betterlite-server/src/mcp/catalog_guard.rs
    - id: scan-tests
      why: Scan tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::/) - test(/replays_the_/)'
    - id: drift-types
      why: PinnedCatalogDrift record or its structure is missing.
      run: grep -qE 'struct PinnedCatalogDrift' crates/betterlite-server/src/mcp/catalog_guard.rs && grep -qE 'added|removed|changed' crates/betterlite-server/src/mcp/catalog_guard.rs
    - id: drift-tests
      why: Drift alert and comparison tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*drift/)'
    - id: override-tests
      why: Description override tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*override/)'
    - id: pinning-tests
      why: Pinning logic tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*pin/)'
    - id: batch-concurrency
      why: Batch scanning with exactly eight concurrent tools is not implemented.
      run: grep -qE '_CATALOG_SCAN_BATCH_SIZE|batch' crates/betterlite-server/src/mcp/catalog_guard.rs && grep -qE 'asyncio.gather|join_all|JoinSet' crates/betterlite-server/src/mcp/catalog_guard.rs
    - id: scannable-text
      why: The _has_scannable_text function is missing or does not skip unscannable tools.
      run: grep -qE 'fn _has_scannable_text|fn has_scannable_text' crates/betterlite-server/src/mcp/catalog_guard.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*scannable/)'
    - id: prefix-strip-tests
      why: strip_known_server_prefix tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*strip.*prefix/)'
    - id: header-sanitize-tests
      why: logging_safe_mcp_headers tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*header.*sanitize|sanitize.*header/)'
    - id: exception-handling
      why: Exception handling and BlockedTool creation is missing.
      run: grep -qE 'BlockedTool|_block_reason' crates/betterlite-server/src/mcp/catalog_guard.rs && grep -qE 'catch|except|match' crates/betterlite-server/src/mcp/catalog_guard.rs
    - id: guardrail-call
      why: Guardrail hook call with correct parameters is missing.
      run: grep -qE 'pre_call_hook|guardrails_only|list_mcp_tools' crates/betterlite-server/src/mcp/catalog_guard.rs
    - id: masking-tests
      why: Masking tests or implementation is missing.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*mask/)'
    - id: error-extraction
      why: Error reason extraction from exceptions is missing or incomplete.
      run: grep -qE '_block_reason' crates/betterlite-server/src/mcp/catalog_guard.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::catalog_guard::tests::.*block/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4682.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/catalog-guard-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

