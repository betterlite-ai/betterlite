out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_other_image_edits in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/other_image_edits.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_other_image_edits.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The execution layer decodes once before the family transform decodes again, changing malformed-JSON error priority.
- Only the first input image reaches the selected provider config.
