checks:
  optional:
  - mutants
  commands:
  - id: case-canvas-edit-dispatch
    why: get_config_class tries B637 Stability substring detection first, then B635 Canvas raw-catalog eligibility,
      matching B635 get_bedrock_image_edit_config_for_model. Instantiate via B2202 empty initializer and pass only
      image[0] for a nonempty image list, otherwise None, along with prompt, original selected model, mutated optional_params
      and empty litellm_params/headers mappings. Ignore the transform's second return value and convert its body
      to a plain mapping. B635 owns all Canvas task/mask behavior.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_canvas_edit_dispatch$/)'
  - id: case-stability-edit-dispatch
    why: The same first-image-only dispatch calls B637 for Stability; it does not fan out n or multiple image entries.
      Unlike Canvas, Stability permits no image and can return an empty image result. Preserve those family differences
      and the same mixed-marker selection priority as the standalone selector.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_stability_edit_dispatch$/)'
  - id: case-edit-signed-request
    why: 'Prepare before choosing transport: B595 credentials from original options/model with B590 bearer token,
      then B591 invoke-provider and model-ID resolution, then B591 proxy endpoint plus /model/{modelId}/invoke without
      trimming a slash. Build body, serialize once to UTF-8 JSON, merge default Content-Type=application/json with
      extra_headers, and sign exact bytes through B595. Send the stored endpoint_url/body with prepared headers
      even if prepared.url differs. B249 pre_call uses prompt, empty api_key and complete_input_dict/api_base/headers.
      Reuse B634 signing and bearer/non-AWS Authorization cases; this edit path has no guardrail-header extraction.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_signed_request$/)'
  - id: case-unknown-edit-model
    why: 'No recognized Stability pattern or Canvas catalog flag raises ValueError Unsupported Bedrock image-edit
      model: {model!r}. Use a stability.* image-edit model id or add supports_nova_canvas_image_edit in model_prices
      for this id. Use the identical case through B635 selector; do not fall back to generic image generation.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_unknown_edit_model$/)'
  - id: case-edit-result-projection
    why: 'After successful transport, optional B249 post_call records prompt, empty api_key, response.text and complete_input_dict;
      debug raw model_response: %s with text. B634 outer JSON decoder runs first, with JSON null -> ValueError Error
      in response object format, got None. Then select/instantiate the family again and pass the original raw response
      to B636/B637, which decodes again. Discard the initially supplied model_response and return the family''s
      fresh response, preserving its error and cost behavior. The outer malformed-JSON error wins over the family-specific
      parse wrapper.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_result_projection$/)'
  - id: case-edit-http-error
    why: Both sync and async paths call raise_for_status; HTTPStatusError becomes B682 BedrockError with response
      status,text,headers,response; timeout becomes status408 Timeout error occurred. Other failures pass unchanged.
      No response logging or family transform occurs after a transport error. Reuse B634 matching cases.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_http_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_image_edits.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits*")"
      && grep -lq 'bedrock_other_image_edits' tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_image_edits$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-edit-transport-selection
    why: Only aimage_edit literally True selects async. Sync uses a matching HTTPHandler or B173 default client
      without passing timeout. Async uses a matching AsyncHTTPHandler or B173 BEDROCK client with params timeout,
      including None. Preserve the same client-selection/timeout cases as B634; body preparation and signing occur
      before async selection.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_transport_selection$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edit_call_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edit_call_secret_safe_failure$/)'
