id: B638
title: Bedrock image edit execution
description: >-
  Compose model-selected image edit preparation and typed response handling through the signed HTTP pool. Preserve
  family-specific payload/media types and explicit unsupported edit model outcomes. Share all file and media transformations
  from predecessor tasks.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_edit/handler.py:
  BedrockImageEdit.get_config_class L58-L67; BedrockImageEdit.image_edit L69-L135; BedrockImageEdit.async_image_edit
  L137-L182; BedrockImageEdit._prepare_request L184-L267; BedrockImageEdit._get_request_body L269-L294; BedrockImageEdit._transform_response_dict_to_openai_response
  L296-L331.


  Reuse B634 decode_bedrock_image_reply for the outer JSON parse and null check, then call B636/B637 provider response
  transformations and their production decoders. Do not introduce a parallel parser. The double parse and its error
  precedence are observable.


  Reuse BedrockAmazonNovaCanvasImageEditConfig._is_nova_canvas_image_edit_model from B635 (litellm/llms/bedrock/image_edit/amazon_nova_canvas_image_edit_transformation.py);
  its implementation remains with that prerequisite.


  Reuse BedrockStabilityImageEditConfig._is_stability_edit_model from B637 (litellm/llms/bedrock/image_edit/stability_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: canvas_edit_dispatch: get_config_class tries B637 Stability substring detection first, then
  B635 Canvas raw-catalog eligibility, matching B635 get_bedrock_image_edit_config_for_model. Instantiate via B2202
  empty initializer and pass only image[0] for a nonempty image list, otherwise None, along with prompt, original
  selected model, mutated optional_params and empty litellm_params/headers mappings. Ignore the transform's second
  return value and convert its body to a plain mapping. B635 owns all Canvas task/mask behavior. stability_edit_dispatch:
  The same first-image-only dispatch calls B637 for Stability; it does not fan out n or multiple image entries.
  Unlike Canvas, Stability permits no image and can return an empty image result. Preserve those family differences
  and the same mixed-marker selection priority as the standalone selector. edit_signed_request: Prepare before choosing
  transport: B595 credentials from original options/model with B590 bearer token, then B591 invoke-provider and
  model-ID resolution, then B591 proxy endpoint plus /model/{modelId}/invoke without trimming a slash. Build body,
  serialize once to UTF-8 JSON, merge default Content-Type=application/json with extra_headers, and sign exact bytes
  through B595. Send the stored endpoint_url/body with prepared headers even if prepared.url differs. B249 pre_call
  uses prompt, empty api_key and complete_input_dict/api_base/headers. Reuse B634 signing and bearer/non-AWS Authorization
  cases; this edit path has no guardrail-header extraction. unknown_edit_model: No recognized Stability pattern
  or Canvas catalog flag raises ValueError Unsupported Bedrock image-edit model: {model!r}. Use a stability.* image-edit
  model id or add supports_nova_canvas_image_edit in model_prices for this id. Use the identical case through B635
  selector; do not fall back to generic image generation. edit_result_projection: After successful transport, optional
  B249 post_call records prompt, empty api_key, response.text and complete_input_dict; debug raw model_response:
  %s with text. B634 outer JSON decoder runs first, with JSON null -> ValueError Error in response object format,
  got None. Then select/instantiate the family again and pass the original raw response to B636/B637, which decodes
  again. Discard the initially supplied model_response and return the family's fresh response, preserving its error
  and cost behavior. The outer malformed-JSON error wins over the family-specific parse wrapper. edit_http_error:
  Both sync and async paths call raise_for_status; HTTPStatusError becomes B682 BedrockError with response status,text,headers,response;
  timeout becomes status408 Timeout error occurred. Other failures pass unchanged. No response logging or family
  transform occurs after a transport error. Reuse B634 matching cases. edit_transport_selection: Only aimage_edit
  literally True selects async. Sync uses a matching HTTPHandler or B173 default client without passing timeout.
  Async uses a matching AsyncHTTPHandler or B173 BEDROCK client with params timeout, including None. Preserve the
  same client-selection/timeout cases as B634; body preparation and signing occur before async selection.


  Write standalone Rust test image_edit_call_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test image_edit_call_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/image_edits.rs with adjacent tests under image_edits/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_edits_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  canvas_edit_dispatch, stability_edit_dispatch, edit_signed_request, unknown_edit_model, edit_result_projection,
  edit_http_error, edit_transport_selection. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits* using HelperCase:
  kind: helper and the externally tagged bedrock_other_image_edits variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_image_edits that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 245 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 245 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 595 planned, 600 maximum changed lines.
