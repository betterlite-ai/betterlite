  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/image_edits.rs
  - crates/betterlite-bedrock/src/image_edits/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/other_image_edits.rs
  - tools/oracle/src/helpers/bedrock/other_image_edits/**
  - tools/oracle/helpers/bedrock_other_image_edits.py
  - tools/oracle/helpers/bedrock_other_image_edits/**
  - tools/oracle/cases/helpers/providers/bedrock-other-image-edits/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits*
  lint_tables: false
