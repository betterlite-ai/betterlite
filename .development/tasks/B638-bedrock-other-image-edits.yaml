id: B638
title: Bedrock image edit execution
description: >-
  Compose model-selected image edit preparation and typed response handling through the signed HTTP pool. Preserve
  family-specific payload/media types and explicit unsupported edit model outcomes. Share all file and media transformations
  from predecessor tasks.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_edit/handler.py:
  BedrockImageEdit.get_config_class L58-L67; BedrockImageEdit.image_edit L69-L135; BedrockImageEdit.async_image_edit
  L137-L182; BedrockImageEdit._prepare_request L184-L267; BedrockImageEdit._get_request_body L269-L294; BedrockImageEdit._transform_response_dict_to_openai_response
  L296-L331.


  Reuse the existing image reply decoder from the image-generation result owner; this slice adds no parallel JSON
  parser.


  Reuse BedrockAmazonNovaCanvasImageEditConfig._is_nova_canvas_image_edit_model from B635 (litellm/llms/bedrock/image_edit/amazon_nova_canvas_image_edit_transformation.py);
  its implementation remains with that prerequisite.


  Reuse BedrockStabilityImageEditConfig._is_stability_edit_model from B637 (litellm/llms/bedrock/image_edit/stability_transformation.py);
  its implementation remains with that prerequisite.


  Implement crates/betterlite-bedrock/src/image_edits.rs with adjacent tests under image_edits/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_image_edits in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_edits_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  canvas_edit_dispatch, stability_edit_dispatch, edit_signed_request, unknown_edit_model, edit_result_projection,
  edit_http_error. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits* using HelperCase:
  kind: helper and the externally tagged bedrock_other_image_edits variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_image_edits that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 245 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 473 planned, 475 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/image_edits.rs
  - crates/betterlite-bedrock/src/image_edits/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_other_image_edits.rs
  - tools/oracle/src/helpers/bedrock_other_image_edits/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_other_image_edits.py
  - tools/oracle/cases/helpers/providers/bedrock-other-image-edits/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/image_edit/handler.py#L58-L331
  why: >-
    Own BedrockImageEdit.get_config_class, BedrockImageEdit.image_edit, BedrockImageEdit.async_image_edit, BedrockImageEdit._prepare_request,
    BedrockImageEdit._get_request_body, BedrockImageEdit._transform_response_dict_to_openai_response. Other functions
    in this file remain with the owners listed below.
dod:
- text: >-
    canvas edit dispatch: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-image-edits/canvas-edit-dispatch.yaml.
  proof:
  - case-canvas-edit-dispatch
  - oracle
  - helper-python
- text: >-
    stability edit dispatch: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-image-edits/stability-edit-dispatch.yaml.
  proof:
  - case-stability-edit-dispatch
  - oracle
  - helper-python
- text: 'edit signed request: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-image-edits/edit-signed-request.yaml.'
  proof:
  - case-edit-signed-request
  - oracle
  - helper-python
- text: 'unknown edit model: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-image-edits/unknown-edit-model.yaml.'
  proof:
  - case-unknown-edit-model
  - oracle
  - helper-python
- text: >-
    edit result projection: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-image-edits/edit-result-projection.yaml.
  proof:
  - case-edit-result-projection
  - oracle
  - helper-python
- text: 'edit http error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-image-edits/edit-http-error.yaml.'
  proof:
  - case-edit-http-error
  - oracle
  - helper-python
- text: New bedrock_other_image_edits seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-canvas-edit-dispatch
    why: The canvas-edit-dispatch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_canvas_edit_dispatch$/)'
  - id: case-stability-edit-dispatch
    why: The stability-edit-dispatch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_stability_edit_dispatch$/)'
  - id: case-edit-signed-request
    why: The edit-signed-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_signed_request$/)'
  - id: case-unknown-edit-model
    why: The unknown-edit-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_unknown_edit_model$/)'
  - id: case-edit-result-projection
    why: The edit-result-projection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_result_projection$/)'
  - id: case-edit-http-error
    why: The edit-http-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::image_edits_cases::case_[0-9]+_edit_http_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_image_edits.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits*")"
      && grep -lq 'bedrock_other_image_edits' tools/oracle/fuzz/corpus/helper_case/bedrock_other_image_edits* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_image_edits$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/bedrock-other-image-edits/canvas-edit-dispatch.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-image-edits/stability-edit-dispatch.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-image-edits/edit-signed-request.yaml
