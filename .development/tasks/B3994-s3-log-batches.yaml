dod:
  - text: >-
      Batch outcomes fresh_work_ordered, requeued_preserved_on_total_failure,
      partial_success_drops_stale_and_terminal, overflow_trims_oldest,
      preserve_retrying_since_on_requeue and raises_only_on_survivors verify
      the queue reconciliation without a live S3 service.
    proof: [batch-behavior-tests]
  - text: >-
      Batch file grouping groups_by_parent, sorts_parents, combines_payloads_to_ndjson,
      earliest_retrying_since and disables_when_cold_storage verify NDJSON
      construction and conditional activation.
    proof: [batch-file-tests]
  - text: >-
      Concurrency bounded_by_limit, context_var_set, limiter_returns_semaphore
      and adaptive_samples_record verify bounded uploads and adaptive integration.
    proof: [bounded-concurrency-tests]
  - text: >-
      The oracle cases batch_full_upload, batch_partial_success, batch_with_adaptive_throttle,
      batch_timeout_classification and batch_file_ndjson_grouping confirm that
      queue state, retries, drops and grouping match the oracle LiteLLM behavior.
    proof: [s3-batch-corpus]
