id: B3994
title: Flush S3 log batches with bounded retries and NDJSON grouping
description: >-
  Implement queue outcome reconciliation, bounded concurrent uploads and optional
  parent-directory NDJSON objects. Keep the sender below B115's timer/registry
  integration and pass its state and upload operation explicitly.

  Owned functions build the batch flush behavior: `_s3_key_parent` splits S3 keys
  at the last slash to identify parent directories; `_upload_semaphore` property
  returns the bounded concurrency limiter (either asyncio.Semaphore or
  AdaptiveConcurrencyLimiter); `_batch_file_mode_active` decides whether to
  group individual elements into parent-directory NDJSON bundles, returning false
  if batch-file mode is disabled or if s3_v2 is the cold-storage logger (which
  requires per-request objects for spend lookups); `_upload_bounded` acquires
  the concurrency permit and runs the upload with the context var `_in_flush`
  set to true; `_upload_outcome` classifies an upload as delivered, retry or
  dropped; `_batch_file_elements` groups uploaded elements by parent key and
  builds NDJSON wrapper objects for groups; `_build_batch_file_element`
  constructs a single batch file from elements, combining their payloads as
  newline-delimited JSON with the earliest element's retrying_since timestamp.

  `async_send_batch` is the primary entry point called by the timer/registry
  loop. It processes the entire log queue, respecting the preserve_events_added_during_flush
  contract. Fresh work (never requeued) precedes requeued work by index order.
  Elements are uploaded concurrently up to the configured limit. If all uploads
  fail, every element (including age-exceeded and terminal) is preserved for the
  next flush. Partial success preserves only retryable elements, dropping those
  that are stale (retrying longer than s3_max_retry_age_seconds) or terminal.
  Overflow above max_queue_size trims the oldest entries when requeue + arrivals
  exceed capacity. Raises S3BatchUploadError only when survivors remain, so the
  inherited flush loop retains queue state.

  UploadOutcome literal values are delivered (successful upload), retry
  (transient failure, keep for next flush), and dropped (terminal failure or
  age-exceeded). S3BatchUploadError.__init__ accepts failed and total counts,
  storing them for reporting via message text.

  Defaults: concurrency limit DEFAULT_S3_MAX_CONCURRENT_UPLOADS (16), batch-file
  upload false, max-retry-age 3600 seconds (explicit null/zero disables), and
  drop on terminal error true. Partition granularity cache keys on the raw
  environment value or configured override, so an injected settings update
  invalidates the cache.

  Resolve s3_batch_file_upload through B002's config loader (key
  S3_BATCH_FILE_UPLOAD_ENV_VAR). Accept a cold-storage key only if its value
  exactly equals the locally computed day or hour key; any mismatch leaves no
  batch file group. Frozen partition granularity respects resolve_s3_partition_granularity's
  caching but remains overridable per instance. When batch-file mode is active,
  preserve individual retry timestamps and use the earliest as the group's
  retrying_since. Fresh elements have retrying_since=None; on first requeue
  during partial success, add the current time.monotonic() unless one exists.

  Do not invoke the upload operation directly from async_send_batch; retrieve it
  from B3993's async_upload_data_to_s3 through self and the upload bounds.
  B347's 1,024-waiter/deadline policy on AdaptiveConcurrencyLimiter must not
  accidentally overload a large flush; use its record() method to report throttled
  samples and let adaptive policy scale down, but do not skip samples or invent
  retries. Every _flush_dropped entry tracks uploaded objects that failed
  terminally; retain them during a full-queue requeue and drop only during
  partial success.
