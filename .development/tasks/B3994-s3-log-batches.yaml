deviations:
  - what: >-
      The concurrency limiter B347 uses a 1,024-waiter deadline and may not scale
      down adaptive concurrency when a large flush holds many waiters beyond the
      deadline. Adaptive sampling still records throttled outcomes per upload, but
      scaling down may lag the flush.
    why: >-
      B347's architecture targets long-lived fine-grained sampling, not bulk flushes.
      Respecting its record() interface maintains compatibility; the scaling lag is
      acceptable because S3 throttle 429/503 causes the upstream client to back off,
      and future flushes adapt from the recorded samples.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L738-L745
out_of_scope:
  - B3990 owns s3BatchLoggingElement type and resolve_s3_partition_granularity; this task's dependencies rely on these.
  - B3993 owns _is_terminal and async_upload_data_to_s3, where _is_terminal is called to classify terminal errors and _flush_dropped is populated when terminal responses occur. This task reads _flush_dropped in _upload_outcome to classify outcomes without calling _is_terminal itself.
  - B002 owns configuration loading and S3_BATCH_FILE_UPLOAD_ENV_VAR resolution.
  - B192 owns safe_dumps for NDJSON payload serialization.
  - B347 owns AdaptiveConcurrencyLimiter and its record() interface.
  - B256 owns the inherited CustomBatchLogger base and its log_queue, periodic_flush, flush_queue and preserve_events_added_during_flush contract.
pitfalls:
  - s3_batch_file_upload warns and disables itself if s3_v2 is the cold_storage_logger; the warning output and return value determine downstream behavior.
  - Fresh and requeued work are interleaved by index order, not segregated into separate rounds; requeue count indexes (stale, stale+1, ...) before (0, 1, ...).
  - A full-queue failure (no uploads delivered) preserves even terminal and stale elements; only partial success allows dropping them.
  - Retrying_since is set only on first requeue during partial success, not on every requeue, so elements remember their initial entry into retry state.
  - AdaptiveConcurrencyLimiter records samples immediately after each PUT, even if the PUT fails; throttled samples classify 429/503 and the SlowDown XML error.
  - The NDJSON batch inherits the earliest element's retrying_since, so a fresh element requeued with stale elements resets retry time to the fresh one's None.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
