      why: The batch queue reconciliation tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^s3_batch::.*::tests::/) - test(/replays_the_/)'
    - id: batch-file-tests
      why: NDJSON grouping and conditional activation tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^s3_batch::.*_batch_file::tests::/)'
    - id: bounded-concurrency-tests
      why: Concurrency limit enforcement and adaptive samples are absent or fail.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^s3_batch::.*_bounded::tests::/)'
    - id: s3-batch-corpus
      why: The oracle corpus seed for S3 batch operations is missing or replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/s3-log-batches-s3-batch-*)" && grep -rlq "b3994" tools/oracle/fuzz/corpus/helper_case/s3-log-batches-s3-batch-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
