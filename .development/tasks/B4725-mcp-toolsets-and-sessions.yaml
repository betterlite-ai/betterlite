pitfalls:
  - 'DELETE /v1/mcp/sessions validates session_id_prefix with Query(min_length=MCP_GATEWAY_SESSION_ID_PREFIX_LENGTH) where MCP_GATEWAY_SESSION_ID_PREFIX_LENGTH is 8 characters; a shorter prefix returns HTTP 422 Unprocessable Entity. Both parameters null returns HTTP 400 with message "Provide session_id_prefix and/or user_id to select the sessions to terminate."'
  - 'GET /v1/mcp/sessions requires PROXY_ADMIN or PROXY_ADMIN_VIEW_ONLY role; other roles return HTTP 403 "Admin access required to view MCP gateway sessions."'
  - 'DELETE /v1/mcp/sessions requires full admin (PROXY_ADMIN); PROXY_ADMIN_VIEW_ONLY returns HTTP 403 "Proxy admin access required to terminate MCP gateway sessions."'
  - 'Toolset mutations (POST, PUT, DELETE) require PROXY_ADMIN role; other roles return HTTP 403.'
  - 'GET /v1/mcp/toolset applies grant filtering: non-admin users see only toolsets in their object_permission.mcp_toolsets list (when present), else all toolsets (admin-view behavior).'
  - 'GET /v1/mcp/toolset/{toolset_id} denies access (403) unless _user_has_admin_view or toolset_id in granted_toolset_ids.'
  - >-
    Duplicate toolset names return HTTP 409; the error message varies for PUT: if toolset_name field is omitted,
    message is "A toolset with that name already exists."; otherwise "A toolset named '{name}' already exists."
  - 'Toolset cache invalidation is called after DB commit via manager.invalidate_toolset_cache(); POST/PUT/DELETE pass the toolset_id when available for targeted invalidation.'

