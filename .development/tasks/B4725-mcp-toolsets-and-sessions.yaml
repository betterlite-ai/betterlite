id: B4725
title: MCP toolset management and gateway session controls
description: >-
  Build five toolset routes and two session routes to manage MCP tool collections and report/terminate gateway sessions.

  The two gateway session routes are read/write: GET `/v1/mcp/sessions` returns `MCPGatewaySessionsResponse` with a report of live sessions on this proxy worker, grouped by AI client and by user, and DELETE `/v1/mcp/sessions` with optional session_id_prefix and user_id query params returns `MCPGatewaySessionsTerminateResponse`. GET requires PROXY_ADMIN or PROXY_ADMIN_VIEW_ONLY role; DELETE requires full proxy admin and at least one selector (status 400 if both null). GET calls `get_mcp_gateway_sessions_report()` with no arguments; DELETE validates session_id_prefix with min_length=8 (MCP_GATEWAY_SESSION_ID_PREFIX_LENGTH), returns 422 if too short, calls `terminate_mcp_gateway_sessions(session_id_prefix=..., user_id=...)` and uses `_user_is_full_admin` for authorization.

  The five toolset routes build CRUD around a toolset entity (server_id, tool_name pairs with a name, optional description and created/updated metadata). POST `/v1/mcp/toolset` (201 Created) requires PROXY_ADMIN role, accepts `NewMCPToolsetRequest`, calls `create_mcp_toolset(prisma_client, payload, touched_by)`, returns the created toolset, catches `UniqueViolationError` as 409 with detail.error "A toolset named '{name}' already exists.", then invalidates the cache. PUT `/v1/mcp/toolset` requires PROXY_ADMIN role, accepts `UpdateMCPToolsetRequest` with partial updates (omitted fields retain stored values, explicit null clears fields except toolset_name and tools which must always exist), calls `update_mcp_toolset(prisma_client, payload, touched_by)`, returns 202 Accepted, catches `UniqueViolationError` as 409, returns 404 if not found, invalidates cache. GET `/v1/mcp/toolset` lists toolsets: full admins see all via `list_mcp_toolsets(prisma_client)`, admin-viewers with object_permission see their granted IDs via `list_mcp_toolsets(prisma_client, toolset_ids=op.mcp_toolsets)`, other keys see granted-toolset-ids only via `granted_toolset_ids(user_api_key_dict)` then `list_mcp_toolsets(prisma_client, toolset_ids=sorted(granted))`. GET `/v1/mcp/toolset/{toolset_id}` fetches one: check authorization via `_user_has_admin_view` or `granted_toolset_ids`, return 403 if denied, call `get_mcp_toolset(prisma_client, toolset_id)`, return 404 if None. DELETE `/v1/mcp/toolset/{toolset_id}` (202 Accepted, empty body) requires PROXY_ADMIN role, calls `delete_mcp_toolset(prisma_client, toolset_id)`, returns 404 if not found, invalidates cache. All four mutation routes capture `litellm_changed_by` header and call `get_audit_log_changed_by(litellm_changed_by=..., user_api_key_dict=..., litellm_proxy_admin_name=...)` or LITELLM_PROXY_ADMIN_NAME fallback, passing touched_by to the DB function. All routes get DB via `get_prisma_client_or_throw("Database not connected...")`. Wrap all routes with `@management_endpoint_wrapper`. Preserve duplicate-name 409 responses, cache invalidation after committed writes, and the mandatory session selector for termination.

  Direct dependencies: B4711 for `get_prisma_client_or_throw` generic DB accessor; B4717 for `_user_is_full_admin` and `_user_has_admin_view`; B065 for `get_audit_log_changed_by`; B865 for `management_endpoint_wrapper` route wrapping; B732 for `AuthContext`, `UserAPIKeyAuth` types and auth dependency registration.

  Missing (Q1/Q2/Q3/Q4/Q6): `get_mcp_gateway_sessions_report`, `terminate_mcp_gateway_sessions`, `create_mcp_toolset`, `list_mcp_toolsets`, `get_mcp_toolset`, `update_mcp_toolset`, `delete_mcp_toolset`, `granted_toolset_ids` callables; manager `invalidate_toolset_cache(toolset_id?)` and admin-view predicate `_user_has_admin_view`; `NewMCPToolsetRequest`, `UpdateMCPToolsetRequest`, `MCPGatewaySessionsResponse`, `MCPGatewaySessionsTerminateResponse` and toolset response model types.

