    why: WebSearchInterceptionLogger.__init__ and _validated_max_agentic_loops, with enabled_providers default and max_agentic_loops validation from B4110.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/websearch_interception/handler.py#L519-L564
