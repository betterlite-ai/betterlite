id: B4116
title: Configure search interception and rewrite outgoing tools
description: >-
  Build callback configuration and pre-call/pre-request tool conversion for websearch interception, retaining the Bedrock-favoring absence-provider default ['bedrock'], explicit empty-list behavior, feature/deployment ceiling precedence and forced-tool-name rewriting. Preserve the different Chat Completions and Responses function shapes and conversion of intercepted streams to buffered calls. The WebSearchInterceptionLogger CustomLogger handles init, YAML loading and initialization from proxy config, followed by two request hooks that detect and rewrite native web_search tools to litellm_web_search before the upstream call, and a helper that resyncs forced tool_choice when the tool names change. Stream-to-non-stream conversion happens in both hooks to buffer the search interception; converted_stream flag travels so a later post-hook can restore the original response shape. When a request carries an Anthropic-native web_search_* tool (detected by type prefix "web_search_"), the hooks set WEBSEARCH_EMIT_NATIVE_BLOCKS_KEY flag so downstream code knows to emit native web_search_tool_result blocks in the final response instead of synthetic text.
scope:
  paths:
    - crates/betterlite-websearch/src/websearch_request_hooks.rs
    - crates/betterlite-websearch/src/websearch_request_hooks/**
    - crates/betterlite-config/src/sections/websearch_request_hooks.rs
    - crates/betterlite-config/src/sections/websearch_request_hooks/**
  lint_tables: false
