  commands:
    - id: io-token-ops-input-validation
      why: _build_io_token_reservation_ops must validate kwargs type and stash presence
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::io_token_ops_input(::|$)/)'"
    - id: io-token-ops-early-exit
      why: _build_io_token_reservation_ops must return empty when reserved counts are zero
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::io_token_ops_early(::|$)/)'"
    - id: io-token-usage-resolution
      why: Usage resolution must try response, combined_usage, aggregate, and reserved in order
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::io_token_usage(::|$)/)'"
    - id: io-token-ops-zero-usage
      why: _build_io_token_reservation_ops returns empty when usage is zero and reservation not released
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::io_token_zero(::|$)/)'"
    - id: io-token-itpm-otpm-split
      why: ITPM ops use billable input; OTPM ops use completion tokens
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::io_token_split(::|$)/)'"
    - id: io-token-release-guarded
      why: "Release-guarded scopes emit zero delta (actual - 0) when released"
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::io_token_released(::|$)/)'"
    - id: scope-enumeration-order
      why: "Scope enumeration must follow stable order: api_key, user, team, team_member, end_user, org, model scopes, agent, agent_session, tags"
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::scope_order(::|$)/)'"
    - id: scope-enumeration-presence-check
      why: Scope enumeration omits scopes with falsy values
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::scope_presence(::|$)/)'"
    - id: scope-enumeration-formatting
      why: "Scope values format team_member as \"team:user\", agent_session as \"agent:session\", and model scopes with \":\" separators"
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::scope_format(::|$)/)'"
    - id: success-ops-origin-exemption
      why: "Success ops return empty when origin is present and not \"autorouter_compaction\""
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::success_ops_exempt(::|$)/)'"
    - id: success-ops-token-resolution
      why: Total tokens resolved via rate-limit-type filter, defaulting to aggregate-only when zero
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::success_ops_tokens(::|$)/)'"
    - id: success-ops-model-selection
      why: "Reconcile model selected as reserved_model or router's model_group"
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::success_ops_model(::|$)/)'"
    - id: success-ops-scope-collection
      why: Scope collection includes all targets plus reserved agent/agent_session scopes
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::success_ops_scopes(::|$)/)'"
    - id: success-ops-key-owned-filtering
      why: model_per_team filtered when key owns model limit
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::success_ops_filtering(::|$)/)'"
    - id: success-ops-budget-release-logging
      why: Debug log emitted when reserved > actual showing release amount
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::success_ops_logging(::|$)/)'"
    - id: success-ops-emission
      why: Pipeline ops built and returned from success event function
      run: "cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^reconciliation_operations::success_ops_emission(::|$)/)'"
    - id: oracle-cases-tests
      why: Oracle cases verify reconciliation across missing usage, aggregate-only, release-guarded, and reserved-vs-actual paths
