id: B3045
title: Build successful token reconciliation operations
description: >-
  Implement token reconciliation for successful rate-limit calls: select scope targets
  and compute actual-minus-reserved deltas for TPM and project I/O quotas. Build two
  orthogonal helper families — scope enumeration for listing possible targets and
  reservation awareness for computing deltas across the collected scopes.

  _build_io_token_reservation_ops reconciles project ITPM/OTPM reservations to billable
  input and completion tokens on success. Fetch the request stash (returning empty if missing),
  read itpm/otpm reserved counts, and resolve actual usage from response, combined_usage_object,
  or aggregate fallback; when usage is unavailable, return empty ops (no reconciliation).
  Build two separate operation sequences (one for ITPM targets with billable input, one for
  OTPM targets with completion output) reusing the delta-calculation pattern from B3037:
  for each scope, emit increment(actual - reserved) for reserved scopes (which got pre-call
  increments) and increment(actual) for unreserved scopes. Release-guarded scopes skip the
  reserved tracking. Response usage via _resolve_io_token_reconcile_usage takes precedence
  over combined_usage_object, then aggregate (total when no input/output split), then fall
  back to reserved counts if usage is missing. Flag the stash's reservation_released state
  when writing ops so later callbacks know to emit zero-refund deltas.

  _collect_tpm_scope_targets enumerates every (scope_key, scope_value) pair from logging metadata
  that *might* carry a TPM counter, independent of which scopes had configured TPM limits at
  pre-call — the caller (e.g., _build_success_event_pipeline_operations) later filters to
  reserved or charged scopes. Enumerate in a stable order: key (by hash), user, team, team_member
  (concat team:user), end_user, organization, then if model_group exists add model_per_key,
  model_per_team, model_per_organization, model_per_project, then agent and agent_session (concat
  agent:session). Add all tpm_limited_tags from the stash in sorted order. Model group is passed
  separately so callers can select its value based on reservation state (reserved_model vs
  router's model_group).

  _build_success_event_pipeline_operations builds pipeline increment ops for TPM counters:
  check origin field (internal calls outside autorouter_compaction are exempt); resolve
  actual tokens via _get_total_tokens_from_usage, defaulting to aggregate-only total; select
  reconcile_model (reserved_model from stash if available, else router's model_group); collect
  all TPM scope targets; filter out model_per_team scopes if the key owns the model limit (from
  request metadata); emit reservation-aware TPM ops on all (filtered) charged targets; log
  release of unused budget when actual < reserved. Return the built pipeline operations list.

  Depends on B206 for get_litellm_metadata_from_kwargs; B3031 for get_request_stash_for_call,
  _call_id_from_callback_kwargs; B3037 for _build_reservation_aware_tpm_ops, _build_project_reservation_ops;
  B3038 for _rate_limited_model, _key_owns_model_tpm_limit_from_request_metadata; B3044 for
  _resolve_io_token_reconcile_usage, _aggregate_only_total_tokens, _response_usage, _get_total_tokens_from_usage.

