    why: _build_io_token_reservation_ops reconciles project ITPM/OTPM reservations with actual usage, handling missing usage and release-guarded scopes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4722-L4784
    why: _collect_tpm_scope_targets enumerates scope pairs in stable order from logging metadata and stash tags.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4882-L4987
    why: _build_success_event_pipeline_operations orchestrates scope collection, filtering, and TPM reconciliation ops on success.

dod:
  - text: _build_io_token_reservation_ops returns empty tuple when kwargs is not a dict or stash is missing.
    proof: [io-token-ops-input-validation]
  - text: _build_io_token_reservation_ops returns empty tuple when both itpm and otpm reserved counts are <= 0.
    proof: [io-token-ops-early-exit]
  - text: _build_io_token_reservation_ops resolves usage from response_obj via _resolve_io_token_reconcile_usage, falling back to combined_usage_object, then aggregate-only total, then reserved counts.
    proof: [io-token-usage-resolution]
  - text: _build_io_token_reservation_ops returns empty tuple when resolved usage has zero tokens and stash.reservation_released is false.
    proof: [io-token-ops-zero-usage]
  - text: "_build_io_token_reservation_ops returns ITPM ops using billable_input tokens for ITPM reserved scopes (actual - reserved delta) and OTPM ops using completion_tokens for OTPM scopes."
    proof: [io-token-itpm-otpm-split]
  - text: "_build_io_token_reservation_ops emits zero-delta ops for release-guarded scopes (actual - 0 for released, else actual - reserved)."
    proof: [io-token-release-guarded]
  - text: "_collect_tpm_scope_targets enumerates scope pairs in order: api_key, user, team, team_member, end_user, organization, then if model_group is present model_per_key/model_per_team/model_per_organization/model_per_project, then agent and agent_session, then all tpm_limited_tags in sorted order."
    proof: [scope-enumeration-order]
  - text: "_collect_tpm_scope_targets omits scopes when their values are missing or falsy (user_api_key, user_id, team_id, etc)."
    proof: [scope-enumeration-presence-check]
  - text: "_collect_tpm_scope_targets formats team_member as \"team_id:user_id\", agent_session as \"agent_id:session_id\", and model scopes with \":\" separators matching the scope key pattern."
    proof: [scope-enumeration-formatting]
  - text: "_build_success_event_pipeline_operations returns empty list when origin metadata is present and not \"autorouter_compaction\"."
    proof: [success-ops-origin-exemption]
  - text: _build_success_event_pipeline_operations resolves total_tokens via _get_total_tokens_from_usage with the configured rate_limit_type, defaulting to aggregate-only total when zero.
    proof: [success-ops-token-resolution]
  - text: "_build_success_event_pipeline_operations selects reconcile_model as reserved_model from stash if available, else _rate_limited_model(model_group) from the router."
    proof: [success-ops-model-selection]
  - text: _build_success_event_pipeline_operations collects TPM scope targets and extends with reserved agent/agent_session scopes not already in targets.
    proof: [success-ops-scope-collection]
  - text: _build_success_event_pipeline_operations filters charged_targets to exclude model_per_team when _key_owns_model_tpm_limit_from_request_metadata is true.
    proof: [success-ops-key-owned-filtering]
  - text: "_build_success_event_pipeline_operations logs debug message when reserved_tokens > actual_tokens, showing release amount."
    proof: [success-ops-budget-release-logging]
  - text: _build_success_event_pipeline_operations emits reservation-aware TPM ops on charged_targets and returns the pipeline operations list.
    proof: [success-ops-emission]
  - text: Every default, token resolution fallback, exemption origin value and scope format a user can observe is in a named oracle case with input and outcome.
    proof: [oracle-cases-tests]

checks:
