deviations:
  - what: >-
      When reconciling ITPM/OTPM usage, if the response carries no usage and combined_usage_object
      also carries none, aggregate-only total (from _aggregate_only_total_tokens) is attempted; if
      no aggregate exists, the reconciliation falls back to using reserved counts as a placeholder.
      This ensures that release-guarded scopes emit zero delta even when usage information is missing.
    why: >-
      When providers return responses without usage data (especially pass-through deployments),
      betterlite must still emit reconciliation ops to settle reserved counts at a reasonable value.
      The fallback to reserved counts represents "assume worst case" and avoids silent under-counting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4670-L4680
  - what: >-
      Scope enumeration includes tpm_limited_tags from the stash in sorted order; tags that are
      not present in the stash are not included, even if configured globally. This matches the
      admission-time set of limited tags and ensures the reconciliation targets are consistent
      with what was reserved at pre-call.
    why: >-
      Tag limits and their scopes are determined at admission time when the request enters; reconciliation
      must target the same scopes to settle the reserved counts accurately. Tags without limits at
      admission should not appear in reconciliation targets.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4958-L4959

out_of_scope:
  - Scope enumeration (model_group selection, conditional scope construction, tag handling) is consumed by the caller and delegated to higher-level admission logic.
  - IO token reconciliation scope filtering and reservation state tracking belong to the admission/reservation builders in B3037/B3042.
  - Usage resolution and aggregate-total extraction belong to B3044.
  - Rate-limit-type filtering and cache-token exclusion belong to B3044.
  - Metadata extraction from litellm_params (litellm_metadata vs metadata fields) belongs to B206.
  - Request stash claim/access and call-ID filtering belong to B3031.
  - Descriptor type conversions and operation emission belong to the later callback assembly in B3046.
  - Pipeline submission and batch result settlement belong to B3046 and the batch limiter (B1044).
  - Model group/alias resolution from router belongs to B3038.
  - Provider resolution and error wrapping belong to B3030.

pitfalls:
  - "Reconciliation targets for ITPM use billable_input_tokens, and OTPM targets use completion_tokens; ensure the token type matches the scope dimension (input vs output)."
  - "Release-guarded reconciliation (when stash.reservation_released is true) emits zero-delta operations (actual - 0); ensure refund-on-failure paths in B3046 match this expectation."
  - "Scope enumeration must preserve order and format: team_member as \"team_id:user_id\" (colon-separated, no spaces), agent_session as \"agent_id:session_id\"; inconsistent formatting breaks matching with pre-call scopes."
  - "Model group is resolved at admission time; reconciliation must use reserved_model (from stash) to settle the counter that was actually incremented, not a re-resolved model that may differ if alias maps changed mid-flight."
  - "Origin metadata field filters internal calls; \"autorouter_compaction\" is the only internal origin that consumes caller limits; other origins (background evaluations, etc.) are exempt from reconciliation."
  - "Aggregate-only total is a fallback when input/output split is unavailable; ensure _aggregate_only_total_tokens is consulted before falling back to reserved counts."
  - "Tag enumeration includes sorted tag strings from the stash's tpm_limited_tags; unsorted enumeration breaks matching with admission-time reserved scopes."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
