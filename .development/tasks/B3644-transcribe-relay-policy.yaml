id: B3644
title: Transcribe passthrough ownership and admission policy
description: >-
  Build Transcribe operation validation, cost eligibility checking, media-bucket policies and owner-tag management. Expose these policy functions below HTTP forwarding and delayed billing, preserving the source's 400/403/404 distinctions and exact owner precedence.

  Build typed records for transcription jobs, policy refusals and job-lookup contracts, plus eleven policy-checking functions that validate requests before routing. Load Amazon Transcribe's operation names from committed static data (refreshed by a tools/ script to track SDK updates). Check whether a StartTranscriptionJob request is priceable (has a cost rate, measurable media format, no custom language models and no surcharges), read media bucket restrictions from config, verify non-admin keys can only use configured buckets and admin-reserved operations, attach the caller's identity as a litellm-owner tag, and check job access by tag on GetTranscriptionJob and DeleteTranscriptionJob.

  Preserve the source's error-code distinctions: 400 for missing identity, malformed tags or caller-supplied litellm-owner; 403 for admin-only operations, role/custom-model/surcharge refusals and bucket mismatches; 404 when a non-admin cannot access a job. Store cost as a pre-rounded integer multiple of cost_per_second.

  A request's media format comes from MediaFormat or the file extension of Media.MediaFileUri. Non-admin requests must keep their transcript in configured S3 buckets and may not set DataAccessRoleArn or JobExecutionSettings. Jobs and media URIs default to the Media.MediaFileUri path style, not the dotted-bucket style. The max-charge constant is 3600 seconds of audio at the cost rate, used as a fallback when media is unreachable.

