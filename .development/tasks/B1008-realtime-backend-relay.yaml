id: B1008
title: Realtime backend relay
description: >-
  Build all seven complete backend methods at realtime_streaming.py:943-1154 in
  betterlite-core::api::realtime_backend_relay. A received frame sets backend_sent_frames before
  UTF-8 decoding or validation. Try recv(decode=false), falling back to recv() only on TypeError.
  Invalid UTF-8 binary frames warn and are skipped. Provider-config transformations update all
  seven state fields before events are processed; a transformation/processing exception is logged
  and skipped. The raw path instead forwards non-JSON/nonobject text unchanged, and unexpected
  processing failures terminate the relay with a synthesized BackendClose.

  B1004 owns decoder/close records, B1005 beta conversion, B1006 storage/usage and success logs,
  B1110 sender/client normalization, B1124 buffer flush and B1007 guardrail execution. B2455 detects
  audio guardrails. B012/B191 supply failure callback dispatch and its bounded queue. Keep the
  transformed and raw paths distinct: only the raw path calls backend transcription-session detection,
  and it bypasses guardrails entirely for transcription-only completed events. The transformed path
  still invokes the guardrail runner but suppresses response.create for known transcription sessions.

  Register B901 service realtime_backend_relay and use actual upstream frames with barriers, not
  helper cases or timing-dependent total ordering. B1004's frame decoder provides fuzz coverage.
  Source contains 168 nonblank/non-comment lines; budget 175 relay,145 tests,135 transcripts,95 adapters,
  30 wiring =580 changed lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/realtime_backend_relay.rs
  - crates/betterlite-core/src/api/realtime_backend_relay/**
  - tools/oracle/src/websocket_driver.rs
  - tools/oracle/src/websocket_driver/realtime_backend_relay.rs
  - tools/oracle/src/helpers/core_ops/realtime_backend_relay.rs
  - tools/oracle/src/helpers/core_ops/realtime_backend_relay/**
  - tools/oracle/helpers/realtime_backend_relay.py
  - tools/oracle/helpers/realtime_backend_relay/**
  - tools/oracle/cases/websocket/realtime-backend-relay/**
  - tools/oracle/fuzz/corpus/websocket_oracle/realtime-backend-relay-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L943-L1154
  why: Complete transformed/raw relay branches, session-ready flush, refusal classification and callback outcomes.
dod:
- text: >-
    backend_frame_decoding sends UTF-8 binary JSON, invalid UTF-8, malformed text and JSON []. Raw mode
    forwards valid objects normalized, skips invalid UTF-8 with "Received non-UTF-8 binary frame from
    backend, skipping.", and forwards malformed/array text unchanged. A dropped normalizer event is not
    stored. GA clients get normalized JSON; beta clients get B1005 names and no conversation.item.done.
    A recv implementation rejecting decode=false is retried without that argument. Even a skipped binary
    frame sets backend_sent_frames=true, affecting later refusal classification.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    transformed_session_ready replaces current_output_item_id,current_response_id,current_delta_chunks,
    current_conversation_id,current_item_chunks,current_delta_type,session_configuration_request from the
    transformer result, including None values. Single event and list results are both accepted. First
    session.created completes deferred setup, sets flushing during repeated buffer drains, then emits
    created; a previously emitted synthetic session causes the real event to become session.updated.
    A failed flush retains unsent frames and resets flushing=false. With audio guardrails, store/forward
    the session event before the one-time disable attempt; a dropped prior attempt can retry on another
    created event. A transform or send error logs "Error processing backend message, skipping: %s" and
    the next frame is still processed; already updated state is not rolled back.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    backend_transcription_turns sends transcription.completed with transcript=hello,item_id=i,usage={type:duration,
    seconds:1}. Both paths collect user input, store and forward the event before guardrail effects. A clean
    conversational session sends response.create even with no guardrail configured; a blocked transcript
    uses B1007's synthetic response sequence. Raw transcription-only mode captures usage and skips the
    guardrail and response.create. Transformed known transcription mode still checks guardrails and captures
    usage but sends no clean response.create. Raw session.created/type=transcription and transcription_session
    created/updated set the mode; transformed session events alone do not. Raw guardrailed session.created
    sends disable after forwarding on every occurrence, without the transformed path's one-time flag check.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    backend_close_and_logging closes 1008 before any frame: flush unbilled usage, enqueue failure handlers
    with prefer_async_handlers=true, set realtime_session_failure_logged=true and return that BackendClose.
    Close1000 without frames or any close after a frame instead queues success logging. A missing logger
    makes failure logging a no-op. Cancellation flushes usage, logs success and propagates cancellation.
    Unexpected raw-path error logs "Error in backend to client send messages: %s", flushes usage, logs
    success and returns 1011 with reason="proxy failed while relaying the upstream websocket". Received
    closes log "Connection closed in backend to client send messages - %s"; no received close maps through
    B1004 to1006. Check callback counts and flags, not asynchronous callback completion time.
  proof: [behavior-tests, oracle, service-python]
- text: Backend relay transcripts and service decoder seeds are new and independently executed.
  proof: [service-corpus, new-cases, oracle, service-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Raw and transformed relays intentionally differ in failure continuation and transcription gating.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_backend_relay::tests::/)'
  - id: service-python
    why: Backend frames must traverse the source relay and a separately captured native connection.
    run: test -f tools/oracle/helpers/realtime_backend_relay_websocket.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: service-corpus
    why: Relay transcripts need fresh typed service seeds.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle/realtime-backend-relay-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: new-cases
    why: Backend relay frames and close classification require new parity fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-backend-relay)"
oracle_cases:
- tools/oracle/cases/websocket/realtime-backend-relay/backend-frame-decoding.yaml
- tools/oracle/cases/websocket/realtime-backend-relay/transformed-session-ready.yaml
- tools/oracle/cases/websocket/realtime-backend-relay/backend-transcription-turns.yaml
- tools/oracle/cases/websocket/realtime-backend-relay/backend-close-and-logging.yaml
deviations: []
out_of_scope:
- B1009 owns bidirectional_forward and final client close. B1110 owns normalized client sends; B1006 owns usage/success accumulation; B2455 owns guardrail detection and B1007 its runner.
- Remaining streaming methods are B1004 contracts, B1005 beta helpers and B1124 buffering. _has_realtime_guardrails has no caller at the pin.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_backend_relay in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/realtime_backend_relay.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_backend_relay.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A malformed received frame still prevents a later non1000 close from being classified as a pre-frame refusal.
- The raw transcript path bypasses beta event translation and uses only GA normalization for its direct client send.
- Transformed-path exceptions are swallowed per frame; the same error in the raw path ends the relay.
review_level: security
budget:
  max_changed_lines: 600
  max_new_expects: 0
