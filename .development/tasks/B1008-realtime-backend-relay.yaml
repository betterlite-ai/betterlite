id: B1008
title: Realtime backend relay
description: >-
  Relay transformed/raw provider realtime frames, capture setup/usage and propagate backend refusal or close codes
  through B009. Compose state, guardrails and beta normalizers, own both pump tasks and stop the peer pump on disconnect
  without leaking pending sends.


  Skip non-UTF-8 binary frames with a warning, forward unparseable text raw, and classify refusal only when close
  != 1000 and no upstream frames were received. Relay exceptions become 1011 with reason proxy failed while relaying
  the upstream websocket. B1009 sends server_error before a non-1000 client close.


  Reuse B1004 decode_realtime_contract for _decode_json_object call sites; calling a lower decoder does not define
  another fuzz target.


  Implement crates/betterlite-core/src/api/realtime_backend_relay.rs. Use RealtimeBackendRelayInput and RealtimeBackendRelayResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions provider_transformed_frame, raw_provider_frame, backend_refusal_once,
  session_created_once, peer_pump_cancel, binary_nonutf8_warning, invalid_json_forward_raw, upstream_refusal_before_frame
  under api::realtime_backend_relay::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RealtimeBackendRelay in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_backend_relay: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._handle_provider_config_message
  (L943-L1025); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._parse_backend_event (L1028-L1034);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._handle_raw_backend_message (L1036-L1074);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._relay_backend_messages (L1076-L1119); litellm/litellm_core_utils/realtime_streaming.py:
  RealTimeStreaming.backend_to_client_send_messages (L1121-L1143); litellm/litellm_core_utils/realtime_streaming.py:
  RealTimeStreaming._backend_refused_session (L1145-L1146); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming.log_backend_refusal
  (L1148-L1154). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 163 owned nonblank/non-comment/non-docstring Python lines (168 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 183 implementation,
  88 behavior tests, 96 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 487 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1005 (Realtime beta protocol), B1006
  (Realtime session state), B1007 (Realtime guardrails), B1087 (Api boundaries), B1110 (Realtime send boundary),
  B1124 (Realtime setup buffering), B1004 (Realtime contracts). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
