id: B3052
title: Dynamic model and priority quota admission
description: >-
  Build the pre-call admission of LiteLLM's saturation-aware limiter: the port of
  `_PROXY_DynamicRateLimitHandlerV3.async_pre_call_hook` and `_check_rate_limits`. B3051 already owns the
  priority lookup, the saturation read and the two descriptor builders. This task decides, for one request,
  which descriptors are enforced, runs the all-or-nothing counter check, and turns an OVER_LIMIT answer into the
  right 429. It reads no config key of its own and checks no license: the only settings it needs is
  `saturation_threshold` (default 0.50), which B3051's section loads.

  One Rust module `dynamic_admission` in betterlite-rate-limit, in these submodules. Each one that can fail owns
  its error enum.

  `limiter_port` holds `AdmissionLimiter`, an async trait that lets tests replace Redis. It has three
  methods: `window_size() -> i64`, `atomic_check_and_increment_by_n(descriptors, increments, parent_span) ->
  Result<RateLimitResponse, AdmissionLimiterError>` and `should_rate_limit(descriptors, parent_span, read_only)
  -> Result<RateLimitResponse, AdmissionLimiterError>`. The production implementation is a small struct built
  from B5660's `RateLimiterAssembly` (its window size, B3034's atomic entry point `atomic_check_and_increment_by_n`
  and B3036's `WindowedAdmission::should_rate_limit`). `AdmissionLimiterError` has one `#[from]` variant for the
  fail-closed `RateLimitUnverifiableError` of B3031 and one `#[from]` variant for every other owner error. These
  two kinds are told apart later, so do not flatten them into one string.

  `enforcement` holds the pure planning step. `plan_enforcement(model_wide, priority_descriptors, saturation,
  saturation_threshold)` returns an `EnforcementPlan` with two lists. `enforced` always starts with the model-wide
  descriptor and adds every priority descriptor only when `saturation >= saturation_threshold` (equal enforces).
  `tracked_only` holds the priority descriptors when they are not enforced, and is empty otherwise. Each enforced
  descriptor gets the same increment `{requests: 1, tokens: 0}`, so the list of increments has the length of
  `enforced`. The model-wide descriptor is B3051's `model_tracking_descriptor` called with
  `high_limit_multiplier = 1`; the priority descriptors are B3051's `priority_based_descriptors`.

  `denial` holds the pure error builders. `build_over_limit_error(plan_kind, request_facts, statuses)`, the port of
  the status loop at L493 to L560, takes the `statuses` of the atomic answer in order and the facts it needs:
  `model`, `priority` (an `Option<String>`), `saturation`, `window_size`, the model group's `tpm` and `rpm`
  (both `Option<i64>`), and the resolved `(model, llm_provider)` pair from B3030's `resolve_llm_provider_for_rate_limit`.
  It skips every status whose code is not "OVER_LIMIT". For the first OVER_LIMIT status it looks at `descriptor_key`:
  - "model_saturation_check" gives a `ProxyRateLimitError` (B3030) with detail `{"error": "Model capacity reached
    for <model>. Priority: <priority>, Rate limit type: <rate_limit_type>, Model TPM: <tpm or not configured>, Model
    RPM: <rpm or not configured>, Remaining: <limit_remaining>"}` and the headers `retry-after` (the window size as
    text), `rate_limit_type` (the status's type as text) and `x-litellm-priority` (the priority, or "default" when
    the priority is none or an empty string).
  - "priority_model" gives a `ProxyRateLimitError` with detail `{"error": "Priority-based rate limit exceeded.
    Model: <model>, Priority: <priority>, Rate limit type: <rate_limit_type>, Model TPM: ..., Model RPM: ...,
    Remaining: <limit_remaining>, Model saturation: <saturation as 1 decimal percent>"}` and the same three headers
    plus `x-litellm-saturation` (the saturation as a 2 decimal percent). It also logs at DEBUG "Enforcing priority
    limits for <model>, saturation: <1 decimal percent>, priority: <priority>".
  - any other descriptor key is skipped and the loop goes on to the next status.
  In both errors `rate_limit_type` on the error is B3030's `map_v3_rate_limit_type` of the status type, and `model`
  and `llm_provider` are the resolved pair. When the loop ends without raising (every OVER_LIMIT status had an
  unknown key, or the list had none), the fail-closed guard runs: log at ERROR "Dynamic rate limiter: OVER_LIMIT
  response with unknown descriptor_key(s) - refusing request. response=<the response>" and return a
  `ProxyRateLimitError` with detail `{"error": "Rate limit exceeded", "descriptor_key": <first OVER_LIMIT status's
  key, or "unknown">, "rate_limit_type": <its type as text, or "unknown">}`, the headers `retry-after` and
  `x-litellm-priority` only, and `rate_limit_type` equal to `map_v3_rate_limit_type` of the status type (none when
  there is no such status). A percent is Python's `{:.1%}`: the saturation times 100.0 printed with that many
  decimals and a "%" sign. An absent priority is printed as the text "None" inside the detail text and as
  "default" in the header; the Python source does both.

  `admission` holds `DynamicAdmission`, built with an `AdmissionLimiter`, B3051's handler (priority lookup,
  saturation read, descriptor builders, router handle) and a `ModelGroupResolver`-compatible provider lookup from
  B3030. It has two methods.

  `check_rate_limits(model, model_group_info, key, priority, saturation)` is the port of `_check_rate_limits`.
  Steps, in order: read the threshold, build the plan, call `atomic_check_and_increment_by_n` with `plan.enforced`
  and its increments and the key's parent span. Log the answer at DEBUG ("Atomic check+increment response: <json>").
  When `overall_code` is "OVER_LIMIT", return the error of `build_over_limit_error`; the provider pair is resolved only
  on this path, once. Otherwise, if `plan.tracked_only` is not empty, call `should_rate_limit(tracked_only, span,
  read_only = false)`, ignore its overall code, and store in the request stash (B3031's `RequestStashSlot`,
  `get_or_create`) a `RateLimitResponse` whose `overall_code` is the atomic answer's code and whose statuses are the
  atomic statuses followed by the tracking statuses. In every other case store the atomic answer unchanged. The
  tracking call increments the priority counters on purpose and its OVER_LIMIT is not an error.

  `pre_call(key, data, call_type, stash)` is the port of `async_pre_call_hook`. Steps: when the request has no model,
  return Ok at once and touch nothing. Call the stash slot's `claim_for_call_id` (B3031). Take the priority from B3051's
  `priority_from_key_dict`. Ask the router for the model group info of the model; when there is none, log at DEBUG
  "No model group info for <model>, allowing request" and return Ok. A router error here is not caught, as in
  LiteLLM. Inside the guarded part: read the saturation with B3051's `_check_model_saturation`, log at DEBUG
  "[Dynamic Rate Limiter] Model=<model>, Saturation=<1 decimal percent>, Threshold=<1 decimal percent>, Priority=<priority>",
  and call `check_rate_limits`. The result of the guarded part is handled in three ways. A `ProxyRateLimitError` is
  returned to the caller. A fail-closed `RateLimitUnverifiableError` (the 503 of B3031) is returned to the caller too,
  because in LiteLLM it is an HTTPException and the hook re-raises those. Any other error is logged at ERROR "Error in
  dynamic rate limiter: <error>, allowing request" and the hook returns Ok, so a Redis or script problem never blocks
  a request. The hook never returns a changed request body.

  Native tests live under `dynamic_admission::tests` and are grouped as `enforcement_`, `denial_`, `admission_` and
  `hook_`, with a fake `AdmissionLimiter` that returns canned answers and records its calls.

  Oracle cases are helper cases because no route on main reaches the dynamic handler yet (see notes). The helper adapter
  for `b3052` builds LiteLLM's `_PROXY_DynamicRateLimitHandlerV3` over an empty `DualCache`, replaces its `v3_limiter`
  with a stub that returns the case's canned atomic answer, calls `_check_rate_limits`, and reports either the stash
  response or the raised error's status, detail and headers.

scope:
  paths:
    - crates/betterlite-rate-limit/src/dynamic_admission.rs
    - crates/betterlite-rate-limit/src/dynamic_admission/**
    - tools/oracle/cases/helpers/dynamic-admission/**
    - tools/oracle/helpers/b3052.py
    - tools/oracle/helpers/b3052/**
    - tools/oracle/src/helpers/rate_limit/b3052.rs
    - tools/oracle/src/helpers/rate_limit/b3052/**
  lint_tables: false

