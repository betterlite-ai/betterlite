  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/dynamic_rate_limiter_v3.py#L443-L520
    why: The OVER_LIMIT loop, the two error texts and headers, and the fail-closed guard for unknown descriptor keys.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/dynamic_rate_limiter_v3.py#L521-L570
    why: Tracking-only increment through should_rate_limit and the two ways the stash response is stored.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/dynamic_rate_limiter_v3.py#L572-L657
    why: async_pre_call_hook, from the missing-model return to the fail-open exception handler.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/dynamic_rate_limiter_v3.py#L165-L230
    why: Read only. Shows the pool keys ("<model>:<priority>", "<model>:default_pool") that the priority descriptors carry; B3051 owns them.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/README.dynamic_rate_limiter_v3.md
    why: Describes the three-phase flow; the numbers in it are stale, so trust the code.

dod:
  - text: With saturation below the threshold only the model-wide descriptor is sent to the atomic check; at exactly the threshold or above, the priority descriptors are sent after it, in order, each with the increment {requests 1, tokens 0}.
    proof: [enforcement-tests, admission-tests]
  - text: The model-wide descriptor is built with high_limit_multiplier 1.
    proof: [admission-tests]
  - text: An OVER_LIMIT answer whose first OVER_LIMIT status is "model_saturation_check" gives the 429 "Model capacity reached for ..." with retry-after, rate_limit_type and x-litellm-priority headers and no saturation header.
    proof: [denial-tests, dynamic-admission-oracle]
  - text: An OVER_LIMIT answer whose first OVER_LIMIT status is "priority_model" gives the 429 "Priority-based rate limit exceeded. ..." with the saturation in the text (1 decimal) and in x-litellm-saturation (2 decimals).
    proof: [denial-tests, dynamic-admission-oracle]
  - text: The error text prints an absent priority as "None", an absent model tpm or rpm as "not configured", and the x-litellm-priority header prints "default" for a none or empty priority.
    proof: [denial-tests, dynamic-admission-oracle]
  - text: OVER_LIMIT statuses with an unknown descriptor key are skipped; if no known key matches, the request is refused with the "Rate limit exceeded" error that carries descriptor_key and rate_limit_type, and with no rate_limit_type header.
    proof: [denial-tests, dynamic-admission-oracle]
  - text: When the priority descriptors are not enforced, they are sent to should_rate_limit with read_only false, their OVER_LIMIT is ignored, and the stash holds the atomic code with the atomic statuses followed by the tracking statuses.
    proof: [admission-tests, dynamic-admission-oracle]
  - text: When the priority descriptors are enforced or absent, the stash holds the atomic answer unchanged and should_rate_limit is not called.
    proof: [admission-tests, dynamic-admission-oracle]
  - text: A request with no model returns Ok without touching the stash, the router or the limiter; a model with no group info returns Ok before any saturation read.
    proof: [hook-tests]
  - text: A ProxyRateLimitError and a fail-closed 503 reach the caller; any other limiter or saturation error is logged and the request is allowed.
    proof: [hook-tests]
  - text: Nothing in the module reads LITELLM_LICENSE or any license state.
    proof: [no-license-gate]

checks:
  optional: [mutants]
  commands:
    - id: enforcement-tests
      why: the enforcement planning tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_admission::enforcement::/)'
    - id: denial-tests
      why: the 429 text, headers and fail-closed guard tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_admission::denial::/)'
    - id: admission-tests
      why: the check_rate_limits tests (atomic call, tracking call, stash) are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_admission::admission::/)'
    - id: hook-tests
      why: the pre-call hook tests (no model, no group info, error handling) are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^dynamic_admission::hook::/)'
    - id: no-license-gate
      why: the module must not look at the license
      run: >-
        test -f crates/betterlite-rate-limit/src/dynamic_admission.rs &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-rate-limit/src/dynamic_admission)" &&
        ! grep -rqi 'litellm_license' crates/betterlite-rate-limit/src/dynamic_admission.rs crates/betterlite-rate-limit/src/dynamic_admission
    - id: dynamic-admission-oracle
      why: the helper cases for the over-limit errors and the stash are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/dynamic-admission)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/dynamic-admission
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3052)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3052 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3052/pyrightconfig.json

oracle_cases:
  - tools/oracle/cases/helpers/dynamic-admission/model-capacity-requests.yaml
  - tools/oracle/cases/helpers/dynamic-admission/model-capacity-tokens-not-configured.yaml
  - tools/oracle/cases/helpers/dynamic-admission/priority-limit-saturated.yaml
  - tools/oracle/cases/helpers/dynamic-admission/priority-none-text-and-header.yaml
  - tools/oracle/cases/helpers/dynamic-admission/priority-empty-string-header.yaml
  - tools/oracle/cases/helpers/dynamic-admission/unknown-descriptor-guard.yaml
  - tools/oracle/cases/helpers/dynamic-admission/unknown-key-then-known-key.yaml
  - tools/oracle/cases/helpers/dynamic-admission/below-threshold-tracking.yaml
  - tools/oracle/cases/helpers/dynamic-admission/at-threshold-enforces.yaml
  - tools/oracle/cases/helpers/dynamic-admission/no-priority-descriptors.yaml

deviations:
  - what: The module reaches the limiter through the AdmissionLimiter trait, not through a v3_limiter attribute on the handler.
    why: The rules forbid module-level state and reflection, and tests need a fake in place of Redis. The calls and their order are the same.
  - what: Nothing checks LITELLM_LICENSE.
    why: The 2026-10-24 decision leaves the license check out. B3051 already does the same for the priority weight, so no path here is gated.
  - what: Until the hook is registered by name and a server gate runs it, no HTTP request reaches this code, so its cases are helper cases.
    why: B3055's server gate runs only the main limiter. The open question is in the architect notes.

out_of_scope:
  - Priority lookup, priority weights, normalization, pool keys, saturation reads, the two descriptor builders and the handler constructor belong to B3051.
  - async_post_call_success_hook, async_log_success_event and the x-litellm-priority and x-litellm-rate-limiter-version response headers belong to B3053.
  - atomic_check_and_increment_by_n and the refunds belong to B3034, should_rate_limit to B3036, the shared limiter assembly to B5660.
  - ProxyRateLimitError, map_v3_rate_limit_type and resolve_llm_provider_for_rate_limit belong to B3030; the stash and the records belong to B3031.
  - _PROXY_DynamicRateLimitHandlerV3.__init__, update_variables and the cache helpers are B3051's; the ones of the older dynamic_rate_limiter.py belong to B3050.
  - Registering the callback name dynamic_rate_limiter_v3 and running this hook from a route (litellm_logging.py L4923 and custom_logger_registry.py L105) has no owner in this task.

pitfalls:
  - The enforcement test is `saturation >= saturation_threshold`, so a saturation of exactly 0.50 enforces the priority limits.
  - The model-wide descriptor is always enforced and is first in the list; the status that names the 429 is the first OVER_LIMIT status the limiter returns, not the first descriptor.
  - The atomic increment is requests 1 and tokens 0, so the tokens limit is only a check here; the tokens are added later by B3053's success hook.
  - The tracking call uses should_rate_limit with read_only false and skip_tpm_check left at its default, so it increments and also reads the tokens limit; its OVER_LIMIT is dropped.
  - The stash gets the atomic overall_code, even if the tracking statuses contain OVER_LIMIT.
  - 'The text "Priority: None" in the detail and the value "default" in the x-litellm-priority header come from different Python expressions (an f-string of the value and priority or "default"), so an empty string gives "Priority: " in the text and "default" in the header.'
  - Only the priority error carries `x-litellm-saturation`, and only the "Rate limit exceeded" guard error omits the `rate_limit_type` header.
  - The `window_size` in `retry-after` comes from the limiter, not from the descriptor's own window_size.
  - The provider pair is resolved once, before the status loop, and only when the answer is OVER_LIMIT.
  - A router error from get_model_group_info is outside the try block in LiteLLM, so it is not turned into "allow".
  - The HTTPException re-raise also covers the fail-closed 503, so do not let the generic error branch swallow it.

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
