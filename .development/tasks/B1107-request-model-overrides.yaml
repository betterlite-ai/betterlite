id: B1107
title: Team model aliases and credentials
description: >-
  Resolve team aliases then key aliases, keeping the pre-alias model for team/project credential overrides. Apply
  credentials after constructing the safe diagnostic view.


  Implement crates/betterlite-core/src/api/request_model_overrides.rs. Use RequestModelOverridesInput and RequestModelOverridesResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions team_then_key_alias, prealias_credential_override, enforced_params_missing
  under api::request_model_overrides::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.enable_model_config_credential_overrides
  defaults to False; general_settings.enforced_params defaults to None. No environment reads occur outside betterlite-config.
  Test api::request_model_overrides::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RequestModelOverrides in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {request_model_overrides: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/litellm_pre_call_utils.py: _warn_stale_team_alias_once (L2583-L2589); litellm/proxy/litellm_pre_call_utils.py:
  _update_model_if_team_alias_exists (L2592-L2667); litellm/proxy/litellm_pre_call_utils.py: _update_model_if_key_alias_exists
  (L2670-L2693); litellm/proxy/litellm_pre_call_utils.py: _apply_credential_overrides_from_model_config (L2696-L2781);
  litellm/proxy/litellm_pre_call_utils.py: _resolve_provider_from_deployment (L2784-L2821); litellm/proxy/litellm_pre_call_utils.py:
  _resolve_credential_from_model_config (L2824-L2876); litellm/proxy/litellm_pre_call_utils.py: _extract_credential_from_entry
  (L2879-L2905); litellm/proxy/litellm_pre_call_utils.py: _get_enforced_params (L2908-L2925); litellm/proxy/litellm_pre_call_utils.py:
  check_if_token_is_service_account (L2928-L2939); litellm/proxy/litellm_pre_call_utils.py: _enforced_params_check
  (L2942-L2978). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 239 owned nonblank/non-comment/non-docstring Python lines (314 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 259 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 509 total within the 510-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B732 (Typed authentication principals and grant resolution), B302 (Deployment catalog,
  aliases and wildcard routes), B303 (Deployment client reuse and parallel request guards), B171 (Direct helper
  oracle and URL path encoding), B1087 (Api boundaries), B1105 (Untrusted request controls), B002 (Load LiteLLM
  config.yaml into typed config). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.
