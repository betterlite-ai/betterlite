id: B830
title: Customer creation and block state
description: >-
  Implement customer_create in betterlite-server. Register POST /customer/new and /end_user/new,
  /customer/block and /end_user/block, /customer/unblock and /end_user/unblock exactly once; the
  end_user aliases are hidden from the schema. Own customer_endpoints.py _typed_table L98-L102,
  cache helpers L108-L124, response conversion L127-L134, block L137-L190, unblock L193-L249,
  new_budget_request L252-L275, permission-update helper L278-L305 and new L308-L492, plus all four
  response classes in types/proxy/management_endpoints/customer_endpoints.py. Use B052 auth, B732
  principals, B124 request contracts, B720 row models, B2310 budget rows, B725 budgets,
  B726 EndUserRepository, B733 cache-key builders,
  B734 evict_and_broadcast, B816 permission helpers, B861 duration validation, B199 duration_in_seconds,
  B844 get_model_names and B124 handle_exception_on_proxy. Do not call the /budget/new handler:
  customer budget creation has different validation and time semantics.

  Block upserts each requested id in order with blocked=true for create and update, collects returned
  rows, then evicts end_user_id:<id> for every input id and end_user_restricted_registry. Empty input
  still invalidates the registry; duplicates remain in the response. Return blocked_users. A missing
  DB first raises "Postgres DB Not connected"; the route catches every exception, logs an error and
  returns HTTPException 500 detail.error=str(e), including cache failures after committed upserts.
  Neither route has a local role guard beyond B052. Unblock always takes ImportError without the
  enterprise folder: 400 detail.error combines "Blocked user check was never set. This call has no
  effect." and the missing-enterprise-Docker diagnostic. It does not modify the database or cache.
  litellm.blocked_user_list and callbacks are read only after that unavailable import, so no setting
  support or successful unblock is built here.

  NewCustomerRequest requires user_id, defaults blocked=false and alias/spend/allowed_model_region/
  default_model/object_permission/budget_id to None, and inherits nullable BudgetNewRequest fields.
  Its shared validator rejects max_budget plus budget_id together (422 schema error), but other
  budget fields plus budget_id are accepted. Require a database before the try block: 500 detail.error
  with the CommonProxyErrors database diagnostic. A supplied default_model requires a router and
  an exact get_model_names member, otherwise 422 with "No models configured on proxy" or the
  "Default Model not on proxy" diagnostic, mapped inside the try to internal_server_error.

  new_budget_request copies every non-null BudgetNewRequest field except budget_id; zero and empty
  model maps count as supplied. Return None only when none remain. Validate budget_duration, then
  compute missing budget_reset_at as naive UTC now plus duration_in_seconds; this is not a standardized
  calendar reset. If present, create the budget first with created_by/updated_by equal to caller
  user_id or "default_user_id". Budget create failure is wrapped as HTTPException 422. Otherwise
  link supplied budget_id without prechecking it. The route does not apply /budget/new's negative,
  non-finite or per-model caps validation; use the shared request decoder's actual accepted values.
  A supplied non-max budget field takes precedence over an existing budget_id by creating a new row.

  Copy non-null non-budget customer fields, then call B816 _set_object_permission before inserting
  the customer. If object_permission remains afterwards, warn and remove it before the insert.
  Include litellm_budget_table and object_permission on the resulting row, evict both customer and
  registry cache keys after insert, then convert to CustomerResponse. No transaction rolls back the
  budget or permission if insertion/eviction fails. A failure containing the exact source substring
  "Unique constraint failed on the fields: (`user_id`)" becomes 400 bad_request param user_id;
  other exceptions pass to B124 handle_exception_on_proxy (HTTP status retained, otherwise 500;
  type internal_server_error, param from openai_error_param). Record code and param as serialized,
  and ignore only diagnostic text in HTTP comparisons.

  CustomerResponse retains B720's end-user fields and nested object permissions, but narrows reverse
  permission relations; its budget is LiteLLM_BudgetTableFull, preserving budget_reset_at and created_at
  while dropping budget audit actor fields. BlockUsersResponse has blocked_users rows;
  UnblockUsersResponse has blocked_users strings; DeleteCustomersResponse has deleted_customers:int
  and message:str. _handle_customer_object_permission_update, used by B831, acts only when the
  object_permission key is present, passes the existing id or None to B816, and sets the outgoing id
  only for a non-null result. It never synthesizes a clear when B816 returns None.

  Use B860 Postgres fixtures via POSTGRES_TEST_URL, falling back to testcontainers; provision failures
  fail tests. postgres_customer_rows covers defaults, supplied/existing/generated budgets, actor
  fallback, ordered duplicate blocks, empty blocks and response filtering. postgres_customer_failures
  injects a second block failure, customer insert failure, budget create failure and cache failure to
  assert prior writes remain. Native permission_residue_warns tests the warning/removal branch with
  an injected permission helper. permission_result_none tests the shared update helper's no-write
  branch. HTTP cases exercise the booted MIT server, including both hidden aliases and real B052
  permission denials; do not call these handlers from a Python helper adapter.

  The owned customer ranges contain 228 nonblank noncomment lines excluding docstrings, including
  route decorators and post-import unblock code; response classes add nine declarations. Allow 250
  production, 325 tests and 75 wiring lines, 650 within 650. Request decoding remains with B124.
scope:
  paths:
    - crates/betterlite-server/src/customer_create.rs
    - crates/betterlite-server/src/customer_create/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/app.rs
    - tools/oracle/cases/management/customer-create/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/customer_endpoints.py#L98-L305
    why: Own shared helpers and block/unblock, including the unconditional MIT import failure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/customer_endpoints.py#L308-L492
    why: Own creation with source write order, residual-permission warning and duplicate-id exception.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/management_endpoints/customer_endpoints.py#L1-L28
    why: Own the customer, block, unblock and deletion response contracts.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2093-L2115
    why: B732 request defaults and max_budget/budget_id exclusion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8205-L8242
    why: Creation delegates most errors to this mapper; block and unblock do not.
dod:
  - text: Customer creation and block/unblock aliases match all named HTTP cases and return the pinned response fields.
    proof: [oracle, behavior-tests]
  - text: postgres_customer_rows and postgres_customer_failures verify ordered writes, cache invalidation and surviving rows.
    proof: [postgres-tests]
  - text: permission_residue_warns and permission_result_none test helper outcomes that require collaborator fault injection.
    proof: [behavior-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Require customer-specific tests beyond fixture replay.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^customer_create::tests::/) - test(/replays_the_/)'
    - id: postgres-tests
      why: Check customer and budget state after success and failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^customer_create::tests::postgres_customer_rows$/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^customer_create::tests::postgres_customer_failures$/)'
