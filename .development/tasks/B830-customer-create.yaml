id: B830
title: Customer creation and block state
description: >-
  Implement typed customer/end_user aliases for create, block and unblock, shared response fields and
  linked default budgets/object permissions. Preserve source user-ID and budget validation and invalidate
  only affected end-user cache keys.


  Build the production customer_create module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/customer_endpoints.py:
  _typed_table (L98-L98; 1 source lines), _typed_table (L100-L100; 1 source lines), _typed_table (L101-L102;
  2 source lines), _evict_end_user_cache_keys (L108-L119; 11 source lines), _end_user_cache_keys (L122-L124;
  3 source lines), _to_customer_response (L127-L134; 7 source lines), block_user (L149-L190; 37 source
  lines), unblock_user (L205-L249; 41 source lines), new_budget_request (L252-L275; 21 source lines),
  _handle_customer_object_permission_update (L278-L305; 26 source lines), new_end_user (L320-L492; 144
  source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.blocked_user_list=None.


  Register these actual HTTP routes and aliases exactly once: POST /end_user/block -> block_user; POST
  /customer/block -> block_user; POST /end_user/unblock -> unblock_user; POST /customer/unblock -> unblock_user;
  POST /end_user/new -> new_end_user; POST /customer/new -> new_end_user. For each route send a typed
  successful request, an invalid or missing target, and a caller lacking that route permission through
  B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session routes instead
  prove bad credentials or invalid/expired codes. Compare status, response model including null/absent
  fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by where read.
  Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls management
  error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::customer_create::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 294 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  294 production, 154 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 563 changed lines estimated within a 575-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
