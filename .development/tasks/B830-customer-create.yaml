deviations: []
out_of_scope:
  - B059 owns resolve_customer_daily_activity_scope L500-L512, customer_daily_activity_is_admin L515-L519, end_user_info L521-L577, list_end_user L837-L891 and get_customer_daily_activity L894-L958 in customer_endpoints.py.
  - B831 owns update_end_user L580-L756 and delete_end_user L759-L834 in customer_endpoints.py.
  - unblock_user L231-L249 requires the unavailable enterprise hook; its blocked_user_list mutation and callback checks are unreachable without it and are not built.
pitfalls:
  - Block writes persistent rows, but MIT unblock fails before looking at those rows.
  - A new budget can remain orphaned after the customer user_id uniqueness check fails.
  - A duration-only customer budget overrides a supplied budget_id even though max_budget plus budget_id is rejected by the request model.
budget:
  max_changed_lines: 650
  max_new_expects: 0
review_level: security
