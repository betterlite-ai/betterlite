  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/endpoints.py#L158-L179
    why: The endpoint's provider check with the same default, and the keys it passes through for managed stores.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/gemini_ingestion.py#L85-L91
    why: The Gemini record keys vector_store_id, api_key and api_base.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/gemini_ingestion.py#L235-L252
    why: white_space_config in chunking_strategy and custom_metadata in the Gemini record.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L139-L145
    why: Vertex creates a corpus when vector_store_id is absent, and reads description.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L351-L364
    why: Vertex sends fixed_length_chunking only with the sizes the client set.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L441-L462
    why: Vertex sends ragFileChunkingConfig only when a size was sent, plus max_embedding_requests_per_min.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L1165-L1215
    why: The vertex_ai_location, vertex_ai_project and vertex_ai_credentials aliases.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/s3_vectors/vector_stores/transformation.py#L49-L73
    why: S3 Vectors takes vector_bucket_name or vector_store_id, and embedding_model or litellm_embedding_model.
