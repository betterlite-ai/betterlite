id: B5134
title: Close the B3450 RAG records audit gaps
description: >-
  B3450 built the RAG ingest records in crates/betterlite-config/src/rag/document.rs, and provider lookup,
  the recursive splitter and PDF extraction in crates/betterlite-core/src/rag/document/. An Opus review
  after merge made 13 findings on it. This task closes them in the same modules, the same b3450 oracle
  helper and the same tools/oracle/cases/document_parsing folder. It wires nothing into a route; B3451,
  B3460 and B3465 do that later.


  Gap one, a vector store record without a provider. LiteLLM reads custom_llm_provider with a default
  of "openai" when it picks the ingestion class
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/main.py#L115-L119),
  in the ingestion base class
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L96-L99)
  and in the endpoint's provider check
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/endpoints.py#L158-L166).
  So {"vector_store": {"vector_store_id": "vs_1"}} ingests into OpenAI there. RAGIngestVectorStoreOptions
  is internally tagged on a required custom_llm_provider, so that body fails to parse today. A record
  without the tag must parse as the Openai variant. An unknown key in it must still fail with an error
  that names the key, the way the api_kye test already checks for a tagged record. serde can't express a
  default tag, so the enum gets a hand-written Deserialize. RAGIngestOptions only ever comes from a JSON
  body or a JSON form field, so the Deserialize may lean on serde_json, for example by reading the record
  as a Box<serde_json::value::RawValue> (the raw_value feature on betterlite-config's serde_json), probing
  custom_llm_provider, then parsing the matching variant struct. A hand-written decoder of request bytes
  gets a cargo-fuzz target, rag_ingest_options, that feeds bytes to serde_json::from_slice::<RAGIngestOptions>,
  with a seeded corpus and a replay test.


  Gap two, the gemini provider. INGESTION_REGISTRY maps gemini
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/main.py#L46-L52)
  and the endpoint's provider check accepts it, even though LiteLLM's own union type leaves it out
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/rag.py#L178-L180).
  GeminiRAGIngestion reads vector_store_id, api_key and api_base
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/gemini_ingestion.py#L85-L91)
  and custom_metadata
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/gemini_ingestion.py#L246-L252),
  and the base class reads litellm_credential_name for every provider
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L69-L94).
  Add GeminiVectorStoreOptions with those five optional fields and a Gemini variant tagged gemini. api_key
  is a SecretString kept out of Debug. custom_metadata is a list of Gemini metadata objects that LiteLLM
  forwards without reading, so it is a serde_json::Value passthrough under #[expect(clippy::disallowed_types)].


  Gap three, Vertex without a corpus id. VertexAIRAGIngestion creates a RAG corpus when vector_store_id is
  missing
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L139-L145),
  and every key of its TypedDict is optional
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/rag.py#L106-L130).
  VertexAIVectorStoreOptions.vector_store_id becomes Option<String>. The test
  vertex_ai_vector_store_options_requires_a_vector_store_id pins the wrong rule and goes;
  vertex_ai_vector_store_options_parse_without_a_vector_store_id replaces it.


  Gap four, S3 Vectors by store id. s3_vectors_ingest_target takes vector_bucket_name or vector_store_id
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/s3_vectors/vector_stores/transformation.py#L49-L58).
  vector_bucket_name becomes Option<String> and the record gains vector_store_id: Option<String>. The
  either-one rule and the id split stay with B3458, the owner of that function. The test
  s3_vectors_options_requires_a_bucket_and_holds_its_aws_credentials is renamed
  s3_vectors_options_hold_a_bucket_and_their_aws_credentials and asserts Some("bucket").


  Gap five, keys LiteLLM reads that deny_unknown_fields rejects. Bedrock reads knowledge_base_id when
  vector_store_id is absent
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/bedrock_ingestion.py#L96-L99).
  Vertex reads description (same link as gap three), vector_db_config and embedding_model
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L189-L192),
  file_description
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L344-L349),
  max_embedding_requests_per_min
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L441-L462),
  litellm_credential_name through the base class, and the vertex_ai_project, vertex_ai_location and
  vertex_ai_credentials aliases
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L88-L94
  through https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L1165-L1215).
  S3 Vectors reads ssl_verify
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/s3_vectors_ingestion.py#L96-L117),
  typed bool | str | None
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L258-L258),
  plus embedding_model and litellm_embedding_model
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/s3_vectors/vector_stores/transformation.py#L61-L73).
  The endpoint passes file_description, max_embedding_requests_per_min and custom_metadata through for
  managed stores
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/endpoints.py#L169-L179).
  Each key becomes an optional field on its record. vertex_ai_credentials is a SecretString like
  vertex_credentials. ssl_verify is a small untagged enum of a bool or a CA bundle path. vector_db_config
  is a Value passthrough under #[expect] for the same reason as custom_metadata. deny_unknown_fields stays,
  so a misspelled key still fails.


  Gap six, chunking keys for providers. LiteLLM's default chunking_strategy is {"type": "auto"}
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L58-L61).
  OpenAI ingestion forwards the whole record to the vector store file call
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/openai_ingestion.py#L104-L141),
  whose shape is type (auto or static) plus static {max_chunk_size_tokens, chunk_overlap_tokens}
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/vector_store_files.py#L14-L26).
  Gemini reads white_space_config {max_tokens_per_chunk, max_overlap_tokens}
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/gemini_ingestion.py#L235-L244).
  RAGChunkingStrategyWire denies all of them, so {"type": "auto"} fails today. Add them as typed optional
  fields: type as an auto or static enum under serde rename "type", static under rename "static", and
  white_space_config, each inner size an Option<i64>. deny_unknown_fields stays, and the splitter ignores
  these fields.


  Gap seven, sizes the client never sent. chunk_size and chunk_overlap get 1000 and 200 at parse time.
  LiteLLM keeps the record as sent and fills the defaults only inside chunk()
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L227-L242).
  Vertex sends a chunking config only when the client set chunk_size or chunk_overlap, and fills a missing
  chunkSize with 1024
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/vertex_ai_ingestion.py#L351-L364
  and the L441-L462 link above). So chunk_size and chunk_overlap become Option<i64>. The defaults move to
  pub const DEFAULT_CHUNK_SIZE: i64 = 1000 and pub const DEFAULT_CHUNK_OVERLAP: i64 = 200 in the same
  module, for B3451's chunk() to apply. separators keep their parse-time default. The test
  chunking_strategy_defaults_to_hardcoded_values asserts the old rule and goes;
  chunking_strategy_leaves_unsent_sizes_empty replaces it, and chunking_strategy_fields asserts Some(500)
  and Some(50).


  Gap eight, line breaks on position moves. pdf.rs calls lopdf's extract_text_with_limit. lopdf starts a
  new line on T*, ', " and ET and ignores Td, TD and Tm. LiteLLM calls pypdf first
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/file_parsers/pdf_parser.py#L10-L68).
  pypdf starts a new line when the text position moves down by more than 0.8 times the scaled font size
  (https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_text_extraction/__init__.py#L100-L185). It checks
  after Td, Tm, T* and Tj, and runs ', " and TD through those
  (https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_page.py#L1940-L1966). So
  "BT /F1 12 Tf 100 700 Td (Hello) Tj 0 -14 Td (World) Tj ET" gives "Hello\nWorld" in LiteLLM and
  "HelloWorld" here. pdf.rs walks each page's operators itself with lopdf's public parts
  (Document::get_page_content_with_limit, Content::decode, Document::get_page_fonts,
  Dictionary::get_font_encoding_with_limit, Document::decode_text), keeps both 64 MiB limits, and emits
  "\n" by pypdf's vertical rule. BT resets the text matrix but not the previous position, ET adds nothing
  (https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_text_extraction/_text_extractor.py#L225-L232), and
  the strip of one trailing "\n" per page goes away with lopdf's ET newline. A horizontal move adds no
  space and TJ keeps lopdf's spacing; that part stays a deviation. No test or case on main can catch the
  gap, since every PDF test shows one line and the cases compared a regex stub (gap twelve).


  Gap nine, total PDF text. The 64 MiB limit holds per stream and per page, with no total. A 200 KB
  request PDF whose 1000 pages share one deflated 64 MiB content stream of Tj text yields about 64 GB of
  text. pypdf has no total either. It bounds each FlateDecode stream at 75,000,000 bytes
  (https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_configuration.py#L60-L64), so LiteLLM runs out of
  memory, and its broad except returns None or the process dies. pdf.rs adds
  MAX_EXTRACTED_PDF_TEXT_BYTES = 67108864 (64 MiB) over the joined output, "\n\n" separators included,
  checked as each page is added, and returns None once the text would pass it. A client then sees what an
  unreadable PDF gives, since chunk() gets no text
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L184-L226).
  For s3_vectors that ends in HTTP 200 with a RAGIngestResponse of status "failed", vector_store_id "",
  file_id null and an error starting "No text content could be extracted from the file for embedding."
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/s3_vectors_ingestion.py#L462-L472,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L363-L371
  and https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/endpoints.py#L654-L687).
  OpenAI, Bedrock, Gemini and Vertex upload the raw file and don't use the chunks, so they see no change.
  This is a deviation.


  Gap ten, chunk output. RecursiveCharacterTextSplitter::new allows chunk_overlap = chunk_size - 1. Then
  merge_splits and force_split advance one split or one character per chunk, and the output grows to about
  the text length times chunk_size. evict_overlap also calls Vec::remove(0), a full shift per eviction.
  LiteLLM's splitter has no bound
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/text_splitters/recursive_character_text_splitter.py#L20-L134).
  TextSplitter::split_text returns Result<Vec<String>, SplitError>. SplitError::OutputTooLarge { limit }
  has the Display text "text splitter output exceeds 268435456 bytes". It fires when the next chunk would
  bring the summed String::len of the output past MAX_SPLIT_OUTPUT_BYTES = 268435456 (256 MiB). The check
  runs before every push on every path: merge_splits, force_split and the depth-bound character fallback.
  The current chunk becomes a VecDeque. chunk() runs for every provider
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/base_ingestion.py#L296-L362),
  so once B3460 wires it, every provider answers HTTP 200 with status "failed", vector_store_id "",
  file_id null and error "text splitter output exceeds 268435456 bytes" (the L363-L371 link above), where
  LiteLLM returns "completed" after building the whole list. This is a deviation. The oracle adapter maps
  SplitError to ValueError like ChunkConfigError, and the existing splitter tests unwrap the Result.


  Gap eleven, the per-page limit has no test. pdf_extracts_a_page_within_the_decompressed_size_limit only
  checks a 5 MB page under the limit, so removing the 64 MiB bound leaves every test green. Add
  pdf_returns_none_past_the_decompressed_page_limit: a FlateDecode content stream that inflates to about
  65 MiB of spaces followed by (Hello) Tj, built with lopdf's Stream::compress, must return None.


  Gap twelve, the helper stubs pypdf. tools/oracle/helpers/b3450.py replaces pypdf and PyPDF2 with a
  regex stub even when they aren't blocked, so pdf-extract-pypdf.yaml compares betterlite with the stub.
  Since PR 563 (https://github.com/betterlite-ai/betterlite/pull/563) the oracle env pins pypdf>=6.16.1,<7.0, LiteLLM's own pin
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/pyproject.toml#L184-L184),
  locked at 6.21.4. The helper drops _TEXT_SHOW_OPERATOR, _StubPage, _StubReader and _install_stub_reader
  and runs extract_text_from_pdf on the real pypdf. block_pypdf true hides pypdf for the call. With
  block_pypdf2 false, PyPDF2 (pypdf's old name, not installed) resolves to the already imported pypdf
  module. Five new cases compare pypdf's text with betterlite's: pdf-extract-line-move-td.yaml (Td),
  pdf-extract-line-move-td-leading.yaml (TD), pdf-extract-line-move-tm.yaml (Tm),
  pdf-extract-bare-t-star.yaml (T* with no TL set, "HelloWorld" in pypdf, "Hello\nWorld" on main) and
  pdf-extract-scaled-tm-small-move.yaml ("/F1 1 Tf 12 0 0 12 100 700 Tm (Hello) Tj 12 0 0 12 100 695 Tm
  (World) Tj", "HelloWorld"). Each declares /F1 as the Type1 font Helvetica.


  Gap thirteen, the force-split case never force-splits. splitter-force-split.yaml uses separators [""],
  so every split is one character, they all go to _merge_splits, and _force_split never runs
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/text_splitters/recursive_character_text_splitter.py#L44-L86).
  It switches to separators ["Q"] with the same text "abcdefgh", chunk_size 4 and chunk_overlap 1, and
  LiteLLM returns ["abcd", "defg", "gh"] through the end - overlap stride
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/text_splitters/recursive_character_text_splitter.py#L121-L134).


  Gap fourteen, provider lookup is checked by expect only. get_ingestion_class_resolves_every_supported_provider
  stays green if gemini resolves to Openai. get_ingestion_class_maps_each_name_to_its_variant replaces it:
  an rstest with one case per name that assert_eq!s the IngestionProvider variant.


  Gaps one and two come from one finding, so the 13 findings make 14 gaps. docs/deviations/B3450.yaml
  gains the two caps from gaps nine and ten. Its lopdf entry says "lopdf reads the same page content and
  text operators natively". Gap eight shows that is false, so it now says what the walk matches and what
  still differs. Its 64 MiB entry says a page past the limit returns None for that page and that pypdf
  has no bound; the whole PDF returns None, and pypdf bounds each stream at 75,000,000 bytes.
scope:
  paths:
    - tools/oracle/cases/document_parsing/**
    - crates/betterlite-core/src/rag/document.rs
    - crates/betterlite-core/src/rag/document/**
    - crates/betterlite-config/src/rag/document.rs
    - crates/betterlite-config/src/rag/document/**
    - crates/betterlite-config/src/sections/rag_records_and_chunking.rs
    - crates/betterlite-config/src/sections/rag_records_and_chunking/**
    - tools/oracle/helpers/b3450.py
    - tools/oracle/helpers/b3450/**
    - tools/oracle/src/helpers/core_ops/b3450.rs
    - tools/oracle/src/helpers/core_ops/b3450/**
    - crates/betterlite-core/fuzz/corpus/pdf_extraction/**
    - crates/betterlite-config/fuzz/fuzz_targets/rag_ingest_options.rs
    - crates/betterlite-config/fuzz/corpus/rag_ingest_options/**
    - docs/deviations/B3450.yaml
  lint_tables: false
references:
