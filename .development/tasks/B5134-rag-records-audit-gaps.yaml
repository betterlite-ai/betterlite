    why: pypdf first, then PyPDF2, pages joined with "\n\n", None on any failure.
  - url: https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_text_extraction/__init__.py#L100-L185
    why: crlf_space_check, the vertical rule for a new line on the combined text and graphics matrix.
  - url: https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_page.py#L1940-L1966
    why: How pypdf runs the quote operators, TJ and TD through T*, Tj, TL and Td.
  - url: https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_text_extraction/_text_extractor.py#L225-L358
    why: BT, ET, Td, Tm and T* handling of the text matrix.
  - url: https://docs.rs/crate/lopdf/0.46.0/source/src/document.rs
    why: get_page_content_with_limit, get_page_fonts and decode_text, the parts the operator walk uses.
dod:
  - text: >-
      A vector store record without custom_llm_provider parses as RAGIngestVectorStoreOptions::Openai, and
      an unknown key in such a record still fails with an error that names the key. A tagged record parses
      as before, and the api_kye test still passes. A cargo-fuzz target rag_ingest_options decodes
      RAGIngestOptions from bytes, and replays_the_rag_ingest_options_corpus replays its seeds.
    proof:
      - config-provider-default
      - config-ingest-fuzz-corpus
  - text: >-
      custom_llm_provider gemini parses as a Gemini variant holding vector_store_id, api_key as a
      SecretString, api_base, custom_metadata and litellm_credential_name, and its Debug output hides the
      key.
    proof:
      - config-gemini
  - text: >-
      A vertex_ai record without vector_store_id parses, and the test that required it is gone.
    proof:
      - config-vertex-optional-id
  - text: >-
      An s3_vectors record with only vector_store_id parses, vector_bucket_name is optional, and the test
      that required the bucket is renamed and asserts Some("bucket").
    proof:
      - config-s3-store-id
  - text: >-
      Each key from gap five parses on its record: knowledge_base_id on bedrock; description,
      vector_db_config, embedding_model, file_description, max_embedding_requests_per_min,
      litellm_credential_name, vertex_ai_project, vertex_ai_location and vertex_ai_credentials on vertex_ai;
      ssl_verify as a bool and as a path, embedding_model and litellm_embedding_model on s3_vectors. The
      rstest vector_store_options_accept_a_key_litellm_reads has one case per key.
    proof:
      - config-litellm-keys
  - text: >-
      chunking_strategy accepts {"type": "auto"}, {"type": "static", "static": {"max_chunk_size_tokens":
      800, "chunk_overlap_tokens": 400}} and {"white_space_config": {"max_tokens_per_chunk": 800,
      "max_overlap_tokens": 400}}, each in a case of chunking_strategy_accepts_a_provider_chunking_key
      named auto, static_tokens and white_space. An unknown chunking key still fails.
    proof:
      - config-chunking-keys
  - text: >-
      chunk_size and chunk_overlap are Option<i64> and stay None when not sent. DEFAULT_CHUNK_SIZE is 1000
      and DEFAULT_CHUNK_OVERLAP is 200. chunking_strategy_leaves_unsent_sizes_empty replaces
      chunking_strategy_defaults_to_hardcoded_values.
    proof:
      - config-unsent-sizes
  - text: >-
      extract_text_from_pdf starts a new line after Td, TD and Tm moves by pypdf's vertical rule, adds none
      for a bare T* with no leading set, for a move below 0.8 times the scaled font size, or for a second BT
      block at the same position. Seven tests named pdf_line_move_* cover these, the five new oracle cases
      match pypdf, every existing pdf_ test still passes, and a new pdf_extraction seed with Td moves
      replays.
    proof:
      - pdf-line-moves
      - pdf-fuzz-corpus
      - oracle
  - text: >-
      extract_text_from_pdf returns None once the joined text would pass MAX_EXTRACTED_PDF_TEXT_BYTES
      (67108864). pdf_returns_none_past_the_total_text_cap shows two pages of 33 MiB of "A" each return
      None while one such page returns its text.
    proof:
      - pdf-text-cap
  - text: >-
      pdf_returns_none_past_the_decompressed_page_limit shows a FlateDecode page that inflates past 64 MiB
      returns None.
    proof:
      - pdf-decompressed-limit
  - text: >-
      split_text returns SplitError::OutputTooLarge with the text "text splitter output exceeds 268435456
      bytes" before the output passes 268435456 bytes, on the force-split path and the merge path, and
      evict_overlap no longer calls Vec::remove(0). chunk_output_cap_stops_the_force_split_path uses
      chunk_size 1000000, chunk_overlap 999999, separators ["Q"] and 1000500 "a" characters;
      chunk_output_cap_stops_the_merge_path uses chunk_size 1000000, chunk_overlap 999998, separators [" "]
      and "a " repeated 600000 times. Every other rag::document test still passes.
    proof:
      - chunk-output-cap
      - oracle
  - text: >-
      tools/oracle/helpers/b3450.py runs extract_text_from_pdf on the real pypdf with no stub reader, and
      passes ruff and basedpyright. pdf-extract-pypdf.yaml, pdf-extract-pypdf2-fallback.yaml and
      pdf-extract-missing-library.yaml still match.
    proof:
      - helper-python
      - oracle
  - text: >-
      splitter-force-split.yaml sends separators ["Q"] with text "abcdefgh", chunk_size 4 and
      chunk_overlap 1, and matches LiteLLM's ["abcd", "defg", "gh"].
    proof:
      - force-split-case
      - oracle
  - text: >-
      get_ingestion_class_maps_each_name_to_its_variant asserts the IngestionProvider variant for openai,
      bedrock, gemini, s3_vectors and vertex_ai, and get_ingestion_class_resolves_every_supported_provider
      is gone.
    proof:
      - provider-mapping
  - text: >-
      docs/deviations/B3450.yaml lists the text cap and the split cap with what a client sees, and its
      lopdf and 64 MiB entries no longer claim that lopdf reads text operators as pypdf does, that a page
      past the limit drops only that page, or that pypdf has no bound.
    proof:
      - deviation-log
checks:
  optional: [mutants]
  commands:
    - id: config-provider-default
      why: a record without custom_llm_provider fails to parse, or a changed record breaks an existing types test
      run: |-
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rag_records_and_chunking::rag::document::tests::types::vector_store_options_without_a_provider_parse_as_openai$/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rag_records_and_chunking::rag::document::tests::types::/) - test(replays_the_rag_ingest_options_corpus)'
    - id: config-ingest-fuzz-corpus
      why: the rag_ingest_options fuzz target or its seeds are missing, or replaying them panics
      run: |-
        test -f crates/betterlite-config/fuzz/fuzz_targets/rag_ingest_options.rs && grep -q 'name = "rag_ingest_options"' crates/betterlite-config/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/rag_ingest_options)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_rag_ingest_options_corpus)'
    - id: config-gemini
      why: custom_llm_provider gemini is rejected, or its record leaks the api key in Debug
      run: |-
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rag_records_and_chunking::rag::document::tests::types::vector_store_options_accept_the_gemini_provider$/)'
    - id: config-vertex-optional-id
      why: a vertex_ai record still needs vector_store_id
      run: |-
        ! grep -q 'fn vertex_ai_vector_store_options_requires_a_vector_store_id' crates/betterlite-config/src/sections/rag_records_and_chunking/rag/document/tests.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rag_records_and_chunking::rag::document::tests::types::vertex_ai_vector_store_options_parse_without_a_vector_store_id$/)'
    - id: config-s3-store-id
      why: an s3_vectors record still needs vector_bucket_name and has no vector_store_id
      run: |-
        ! grep -q 'fn s3_vectors_options_requires_a_bucket' crates/betterlite-config/src/sections/rag_records_and_chunking/rag/document/tests.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rag_records_and_chunking::rag::document::tests::types::s3_vectors_options_parse_with_only_a_vector_store_id$/)'
    - id: config-litellm-keys
      why: a key LiteLLM reads from a vector store record is still rejected as unknown
      run: |-
        test "$(grep -rhoE 'pub (knowledge_base_id|description|vector_db_config|file_description|max_embedding_requests_per_min|vertex_ai_project|vertex_ai_location|vertex_ai_credentials|ssl_verify|litellm_embedding_model|custom_metadata):' crates/betterlite-config/src/rag | sort -u | wc -l)" -eq 11 && test "$(grep -rho 'pub embedding_model:' crates/betterlite-config/src/rag | wc -l)" -ge 3 && test "$(grep -rho 'pub litellm_credential_name:' crates/betterlite-config/src/rag | wc -l)" -ge 5 && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rag_records_and_chunking::rag::document::tests::types::vector_store_options_accept_a_key_litellm_reads::/)'
    - id: config-chunking-keys
      why: chunking_strategy rejects type, static or white_space_config
      run: |-
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::types::chunking_strategy_accepts_a_provider_chunking_key::case_[0-9]+_auto$/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::types::chunking_strategy_accepts_a_provider_chunking_key::case_[0-9]+_static_tokens$/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::types::chunking_strategy_accepts_a_provider_chunking_key::case_[0-9]+_white_space$/)'
    - id: config-unsent-sizes
      why: chunk_size and chunk_overlap still get 1000 and 200 at parse time
      run: |-
        ! grep -q 'fn chunking_strategy_defaults_to_hardcoded_values' crates/betterlite-config/src/sections/rag_records_and_chunking/rag/document/tests.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::rag_records_and_chunking::rag::document::tests::types::chunking_strategy_leaves_unsent_sizes_empty$/)'
    - id: pdf-line-moves
      why: PDF text ignores Td, TD and Tm moves, breaks lines where pypdf doesn't, or an existing PDF test breaks
      run: |-
        test "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/document_parsing/pdf-extract-line-move-td.yaml tools/oracle/cases/document_parsing/pdf-extract-line-move-td-leading.yaml tools/oracle/cases/document_parsing/pdf-extract-line-move-tm.yaml tools/oracle/cases/document_parsing/pdf-extract-bare-t-star.yaml tools/oracle/cases/document_parsing/pdf-extract-scaled-tm-small-move.yaml | wc -l)" -eq 5 && test "$(grep -c '^fn pdf_line_move_' crates/betterlite-core/src/rag/document/tests.rs)" -ge 7 && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::pdf_line_move_/)' && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::pdf_/)'
    - id: pdf-fuzz-corpus
      why: no seed covers the operator walk, or replaying the PDF corpus panics
      run: |-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/pdf_extraction)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(replays_the_pdf_extraction_corpus)'
    - id: pdf-text-cap
      why: the joined PDF text has no total bound
      run: |-
        grep -rq 'MAX_EXTRACTED_PDF_TEXT_BYTES' crates/betterlite-core/src/rag/document && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::pdf_returns_none_past_the_total_text_cap$/)'
    - id: pdf-decompressed-limit
      why: no test fails when the 64 MiB per-page bound is removed
      run: |-
        cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::pdf_returns_none_past_the_decompressed_page_limit$/)'
    - id: chunk-output-cap
      why: the splitter output has no bound when chunk_overlap is close to chunk_size, or a splitter test breaks
      run: |-
        grep -rq 'MAX_SPLIT_OUTPUT_BYTES' crates/betterlite-core/src/rag/document && ! grep -q 'remove(0)' crates/betterlite-core/src/rag/document/splitter.rs && test "$(grep -c '^fn chunk_output_cap_' crates/betterlite-core/src/rag/document/tests.rs)" -ge 2 && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::chunk_output_cap_/)' && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::/) - test(replays_the_pdf_extraction_corpus)'
    - id: provider-mapping
      why: provider lookup is still checked by expect alone
      run: |-
        ! grep -q 'fn get_ingestion_class_resolves_every_supported_provider' crates/betterlite-core/src/rag/document/tests.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::get_ingestion_class_maps_each_name_to_its_variant::case_[0-9]+_/)'
    - id: force-split-case
      why: the force-split case still never reaches _force_split
      run: |-
        grep -Eq '^ *separators: \[ *"Q" *\]' tools/oracle/cases/document_parsing/splitter-force-split.yaml
    - id: helper-python
      why: the PDF helper still stubs pypdf, or the helper fails ruff or basedpyright
      run: |-
        ! grep -qE '_StubReader|_StubPage|_install_stub_reader|_TEXT_SHOW_OPERATOR' tools/oracle/helpers/b3450.py && test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3450.py)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: deviation-log
      why: the deviation log misses a cap or keeps a wrong claim about lopdf or the 64 MiB bound
      run: |-
        test "$(grep -c '^  - what:' docs/deviations/B3450.yaml)" -ge 7 && grep -q '268435456' docs/deviations/B3450.yaml && grep -q '67108864' docs/deviations/B3450.yaml && ! grep -qE 'reads the same page content and text operators natively|returning None for a page that would exceed it|carries no such bound' docs/deviations/B3450.yaml
