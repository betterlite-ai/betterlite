deviations:
  - what: >-
      extract_text_from_pdf returns None once the joined text of all pages, "\n\n" included, would pass
      67108864 bytes (64 MiB). For s3_vectors the ingest then answers HTTP 200 with a RAGIngestResponse of
      status "failed", vector_store_id "", file_id null and the "No text content could be extracted from
      the file for embedding." error, as for an unreadable PDF. Other providers ignore the chunks and see
      no change. LiteLLM and pypdf have no total and build the whole text.
    why: >-
      A 200 KB request PDF whose pages share one deflated 64 MiB content stream expands to about 64 GB of
      text. LiteLLM then runs out of memory, and its broad except returns None or the process dies.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/file_parsers/pdf_parser.py#L10-L68
  - what: >-
      split_text fails with SplitError::OutputTooLarge once its output would pass 268435456 bytes (256 MiB).
      Once the pipeline is wired, POST /v1/rag/ingest then answers HTTP 200 with a RAGIngestResponse of
      status "failed", vector_store_id "", file_id null and error "text splitter output exceeds 268435456
      bytes", for every provider. LiteLLM builds the whole list and goes on.
    why: >-
      With chunk_overlap = chunk_size - 1 the splitter moves one character per chunk, so a 64 MiB text
      with chunk_size 1000 yields about 64 GB of chunks.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/text_splitters/recursive_character_text_splitter.py#L20-L134
  - what: >-
      extract_text_from_pdf walks page operators with lopdf and starts a new line by pypdf's vertical
      rule, but adds no space for a horizontal move and keeps lopdf's TJ spacing (a space after each TJ
      array and for an integer offset below -100). pypdf adds a space when a move or TJ offset passes the
      space width.
    why: >-
      betterlite ships no Python. pypdf's space rule needs each glyph's width, from the font's /Widths or
      from pypdf's metrics tables for the 14 standard fonts, and lopdf has no such tables.
    link: https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_text_extraction/__init__.py#L100-L185
  - what: >-
      extract_text_from_pdf bounds each decompressed stream and each page's content to 64 MiB, and the
      whole PDF returns None when one page passes it. pypdf bounds each FlateDecode stream at 75,000,000
      bytes and fails the same way, so LiteLLM's pdf_parser also returns None.
    why: >-
      lopdf exposes the bound through LoadOptions::with_max_decompressed_size and
      get_page_content_with_limit, and 64 MiB keeps one page below pypdf's own bound.
    link: https://github.com/py-pdf/pypdf/blob/6.21.4/pypdf/_configuration.py#L60-L64
out_of_scope:
  - Padded one-line functions in these files belong to B5094. It clears the no-one-line-functions and no-padded-one-line-functions legacy lists. This task does not touch .ast-grep/rules/.
  - The fixed HTTP status per error class is B5102's and already merged.
  - Applying {"type":"auto"} when chunking_strategy is absent, applying DEFAULT_CHUNK_SIZE and DEFAULT_CHUNK_OVERLAP in chunk(), and reading the provider default inside the pipeline belong to B3451 and B3460. This task only makes the records carry what the client sent.
  - The S3 Vectors either-one rule and the vector_store_id split belong to B3458. Vertex's chunk config and its 1024 fill belong to B3455, Gemini's whiteSpaceConfig defaults of 800 and 400 to B3454, and OpenAI's forwarding of the chunking record to B3453.
  - The endpoint's provider check, its view-only rule and the managed-store merge belong to B3462 and B3463.
  - A cap on page count or on total decompressed bytes across pages. The text cap bounds memory, not the time spent inflating one shared stream per page.
pitfalls:
  - serde's internally tagged enum needs the tag, and serde(untagged) turns "unknown field `api_kye`" into "data did not match any variant", so the default needs a hand-written Deserialize, not an attribute.
  - When the hand-written path hands the whole record to a variant struct with deny_unknown_fields, custom_llm_provider is still in it, while serde's tagged path removes it, so strip it or declare it.
  - serde_json::Value is a disallowed type outside a passthrough, so only custom_metadata and vector_db_config hold one, each under an expect attribute for clippy::disallowed_types with a reason.
  - pypdf's test is distance > 0.8 * min(str_height * scale_prev_y, font_size * scale_y) on tm times cm, so a threshold in points breaks on the common "/F1 1 Tf 12 0 0 12 x y Tm" layout.
  - pypdf keeps a line span, the baseline range of the current line, and measures the distance to it, so a row label between two wrapped baselines doesn't start a line.
  - BT resets tm to identity but leaves tm_prev, and ET only flushes, so a second BT block at the same position continues the line where lopdf added "\n".
  - TL starts at 0, so a bare T* or ' moves nowhere and adds no newline in pypdf, while TD sets TL to -ty before it acts as Td.
  - pdf_returns_none_when_any_page_fails_to_extract must keep passing, so a Tf without operands ("BT Tf ET") still fails the whole PDF, as lopdf's extract_text did with Error::Syntax.
  - The text cap counts the bytes of the joined output with the "\n\n" between pages and gives up at the first page that crosses it, not after reading the rest.
  - The split cap adds the next chunk's String::len to the running total before the push, so the cap tests stop near 268 chunks of about 1 MB instead of building 500 MB.
  - pypdf imports submodules lazily during extract_text, so blocking the name pypdf for the PyPDF2 fallback case breaks those imports unless one extraction runs with pypdf first.
  - The helper answer cache keys on the helper source, so the stubbed answers are never reused once b3450.py changes. Leave BETTERLITE_ORACLE_CACHE unset in the worktree.
  - separators [] stays as given per docs/compatibility.md, even though LiteLLM's "if separators:" treats it as unset.
  - The new deviations go into docs/deviations/B3450.yaml, the log for the code this task fixes; do not start docs/deviations/B5134.yaml.
budget:
  max_changed_lines: 1500
  max_new_expects: 2
review_level: security
