dod:
  - text: "_filter_reserved_headers: removes headers case-insensitively matching authorization, host, x-amz-*, x-amzn-bedrock-agentcore-runtime-* prefixes and logs dropped names"
    proof: [transform-reserved-headers]
  - text: "_request_scoped_runtime_session_id: derives session ID from message.contextId scoped to principal, or returns None if contextId is absent or not a string"
    proof: [transform-session-derivation]
  - text: "_validate_runtime_session_id: accepts session IDs 33–256 characters and raises BadRequestError for out-of-range lengths"
    proof: [transform-session-validation]
  - text: "get_url_and_signed_request: constructs JSON-RPC 2.0 envelope with jsonrpc, method, id, and params fields"
    proof: [transform-envelope]
  - text: "get_url_and_signed_request: filters agent_extra_headers, sets X-Amzn-Bedrock-AgentCore-Runtime-Session-Id and X-Amzn-Bedrock-AgentCore-Runtime-User-Id headers, merges filtered headers, and signs"
    proof: [transform-headers]
  - text: "get_url_and_signed_request: strips bedrock/ prefix from model when present and passes remaining model to AgentCore config"
    proof: [transform-model-prefix]
  - text: "get_url_and_signed_request: returns tuple of (url, signed_headers, signed_body_bytes) where signed_body is bytes and never None"
    proof: [transform-return-types]
  - text: "parse_sse_events: reads lines from async iterator, extracts data: payloads, parses each as JSON, yields parsed dicts, and silently skips non-JSON lines"
    proof: [transform-sse-parsing]
  - text: "handle_non_streaming: calls get_url_and_signed_request, signs request via run_aws_signing, POSTs to signed URL, raises on HTTP error, returns JSON response"
    proof: [handler-non-streaming]
  - text: "handle_streaming: calls get_url_and_signed_request with stream=True, signs request via run_aws_signing, POSTs with stream=True, detects content-type, yields JSON as single event or parses SSE lines"
    proof: [handler-streaming]
  - text: "handle_streaming: checks content-type for application/json and yields response as single event if present, otherwise parses as SSE"
    proof: [handler-content-type]
  - text: "BedrockAgentCoreA2AConfig.handle_non_streaming: raises ValueError 'litellm_params is required for BedrockAgentCoreA2AConfig (must contain model with AgentCore ARN)' when litellm_params is missing"
    proof: [config-non-streaming-missing-params]
  - text: "BedrockAgentCoreA2AConfig.handle_streaming: raises ValueError 'litellm_params is required for BedrockAgentCoreA2AConfig (must contain model with AgentCore ARN)' when litellm_params is missing"
    proof: [config-streaming-missing-params]
  - text: "New oracle helper operation for agentcore_transform integrates with pinned LiteLLM behavior and replays case corpus"
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: transform-reserved-headers
      why: Reserved header filtering is missing or does not case-insensitively match patterns.
      run: grep -qE 'fn _filter_reserved_headers|filter.*header' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'authorization|x-amz|x-amzn-bedrock-agentcore-runtime' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: transform-session-derivation
      why: Session derivation from contextId is missing or does not scope to principal.
      run: grep -qE 'fn _request_scoped_runtime_session_id|context_id' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'scope_session_to_principal' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: transform-session-validation
      why: Session validation bounds checking is missing or does not raise BadRequestError.
      run: grep -qE 'fn _validate_runtime_session_id|RUNTIME_SESSION_ID' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'BadRequestError' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: transform-envelope
      why: JSON-RPC 2.0 envelope construction is missing required fields.
      run: grep -qE 'jsonrpc.*2\.0|"method"|"id"|"params"' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: transform-headers
      why: Header merging before signing is missing or does not apply filtered headers.
      run: grep -qE 'X-Amzn-Bedrock-AgentCore-Runtime-Session-Id|X-Amzn-Bedrock-AgentCore-Runtime-User-Id' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE '_filter_reserved_headers' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: transform-model-prefix
      why: Model prefix stripping is missing or incomplete.
      run: grep -qE 'bedrock/' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'strip_prefix|starts_with.*bedrock' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: transform-return-types
      why: get_url_and_signed_request return type is missing or does not guarantee bytes.
      run: grep -qE 'fn get_url_and_signed_request.*->' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'Vec<u8>|Bytes' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: transform-sse-parsing
      why: SSE parsing is missing or does not skip invalid JSON.
      run: grep -qE 'fn parse_sse_events|aiter_lines' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'data:|json' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: handler-non-streaming
      why: Non-streaming handler is missing or does not POST and return JSON.
      run: grep -qE 'async fn handle_non_streaming' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'client\.post|response\.json' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: handler-streaming
      why: Streaming handler is missing or does not POST with stream=True.
      run: grep -qE 'async fn handle_streaming' crates/betterlite-a2a/src/agentcore_transform.rs && grep -qE 'stream.*true|client\.post' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: handler-content-type
      why: Content-type detection for JSON vs SSE is missing.
      run: grep -qE 'content-type|application/json' crates/betterlite-a2a/src/agentcore_transform.rs
    - id: config-non-streaming-missing-params
      why: Config non-streaming handler does not raise ValueError for missing litellm_params.
      run: grep -qE 'litellm_params is required for BedrockAgentCoreA2AConfig' crates/betterlite-a2a/src/agentcore_transform.rs && cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^agentcore_transform::tests::.*missing_params_non_streaming$/)'
    - id: config-streaming-missing-params
      why: Config streaming handler does not raise ValueError for missing litellm_params.
      run: grep -qE 'litellm_params is required for BedrockAgentCoreA2AConfig' crates/betterlite-a2a/src/agentcore_transform.rs && cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^agentcore_transform::tests::.*missing_params_streaming$/)'
    - id: transform-tests
      why: Transform tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-a2a --no-tests=fail -E 'test(/^agentcore_transform::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4804.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/agentcore-transform-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

