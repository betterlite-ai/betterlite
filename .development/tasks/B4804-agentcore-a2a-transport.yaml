    why: "_validate_runtime_session_id enforces: 33–256 character bounds, raises BadRequestError"
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/providers/bedrock_agentcore/transformation.py#L120-L219
