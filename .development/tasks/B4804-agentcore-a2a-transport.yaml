id: B4804
title: Signed AgentCore A2A requests and response streams
description: >-
  Build native JSON-RPC AgentCore invocation in betterlite-a2a::agentcore_transform
  with signed request envelopes, principal-scoped runtime sessions and reserved-header
  filtering before signing. Expose JSON and line-based SSE replies without completion
  conversion. The transformation layer constructs A2A message → JSON-RPC 2.0 envelope,
  applies principal-derived session IDs, filters reserved headers case-insensitively
  with a warning, and delegates signing to the bedrock-agentcore-request task. The
  handler POSTs to the signed URL and reads responses as either plain JSON or newline-
  delimited SSE `data:` payloads, skipping malformed JSON silently. The config layer
  validates litellm_params availability before invoking handlers, raising ValueError
  with the exact message shown to users if missing. Session ID validation enforces
  33–256 character bounds after principal scoping; the derived value replaces the
  ARN-derived default when contextId is set.

  Config keys: read only the agent's configured `runtimeSessionId` and `runtimeUserId`
  from litellm_params. Environment variables: none new. Env var / config inheritance:
  bedrock signing uses inherited AWS credentials from betterlite-bedrock::signing.

scope:
  paths:
    - crates/betterlite-a2a/src/agentcore_transform.rs
    - crates/betterlite-a2a/src/agentcore_transform/**
    - crates/betterlite-a2a/src/agentcore_transform/tests.rs
    - tools/oracle/cases/helpers/agentcore-transform/**
    - tools/oracle/helpers/b4804.py
    - tools/oracle/helpers/b4804/**
    - tools/oracle/src/helpers/a2a/b4804.rs
    - tools/oracle/src/helpers/a2a/b4804/**
    - crates/betterlite-a2a/src/agentcore_transform/tests/**
  lint_tables: false

