deviations:
  - what: "JSON-RPC 2.0 envelopes: constructed directly in Rust with all fields present (jsonrpc, method, id, params)"
    why: "LiteLLM delegates envelope construction to the SDK. Betterlite builds explicitly to retain control and avoid SDK coupling."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/providers/bedrock_agentcore/transformation.py#L176-L182
  - what: "SSE parsing: silently skips invalid JSON on each line without logging or collecting errors"
    why: "LiteLLM behavior; SSE decoding errors are expected in some responses. Betterlite matches silent-skip for streaming responses."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/providers/bedrock_agentcore/transformation.py#L244-L248
  - what: "Reserved header filtering: case-insensitive across exact-match (authorization, host) and prefix-match (x-amz-*, x-amzn-bedrock-agentcore-runtime-*) categories"
    why: "HTTP headers are case-insensitive per RFC 7230. LiteLLM normalizes to lowercase before checking. Betterlite preserves to prevent header-spoofing bypasses."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/providers/bedrock_agentcore/transformation.py#L70-L74

out_of_scope:
  - Handler invocation from config selection (owned by B4809 completion dispatcher).
  - "AmazonAgentCoreConfig, sign_request, get_complete_url, _get_runtime_session_id, _get_runtime_user_id (owned by B653 bedrock-agentcore-request)"
  - run_aws_signing bounded execution (owned by B595 bedrock signing).
  - get_async_httpx_client and HTTP response handling (owned by B173 http-pool).
  - BadRequestError type (owned by B184 error types).
  - "Session primitives (scope_session_to_principal, get_session_id_from_a2a_params, A2A_USER_API_KEY_HASH_PARAM) (owned by B4802 usage/sessions)"
  - Agent header merging and completion bridge entry (owned by B4809).

pitfalls:
  - "Reserved header filtering: case-insensitive across exact and prefix categories. A header matching either set is dropped with warning at INFO level, not ERROR."
  - "_request_scoped_runtime_session_id: returns None if contextId is absent or non-string; config's fallback is then called"
  - "Session ID length: enforces [33, 256] inclusive; 32-character or 257-character ID raises BadRequestError with exact message naming range"
  - "JSON content-type check: inspects response.headers.get('content-type', '').lower() and uses substring match 'application/json' in content_type"
  - "parse_sse_events: strips each line and checks startswith('data:') before extracting payload; empty data after stripping is skipped"
  - "SSE data lines: must be yielded as parsed JSON dicts, not strings. Invalid JSON is silently skipped with no error collection."
  - "handle_streaming: must consume full response body if JSON (aread()) before yielding; streaming SSE yields incrementally"

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
