id: B5119
title: Close the B237 Azure and OpenRouter error test gaps
description: >-
  B237 ported LiteLLM's _map_azure_exception and _map_openrouter_exception as map_azure_exception in
  crates/betterlite-error/src/azure_openrouter/azure.rs and map_openrouter_exception in
  crates/betterlite-error/src/azure_openrouter/openrouter.rs. They are tested in azure/tests.rs and
  openrouter/tests.rs next to them and by helper cases in tools/oracle/cases/helpers/azure-openrouter-errors/
  that call the azure_openrouter_errors operation. An Opus review after merge found five places where a branch
  has no test or a test can't fail. In all five both classifiers already give LiteLLM's answer, so this task
  changes only those two tests.rs files and adds case files. azure.rs, azure/body.rs and openrouter.rs stay as
  they are. Each new Azure case copies azure-status.yaml: provider azure, model gpt-4, exception_provider Azure,
  error_str "upstream request failed", env {}, compare {ignore: []} and the name
  azure-openrouter-errors-<file stem>. Each new OpenRouter case copies openrouter-provider-error.yaml: provider
  and custom_llm_provider openrouter, exception_provider OpenRouterException and status_code_is_synthesized
  false.


  Gap one. LiteLLM sends a body whose error.code is "invalid_encrypted_content" to BadRequestError with
  llm_provider "azure", before the "invalid_request_error" text and every status branch
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2002-L2021).
  BadRequestError keeps the status of the response it gets, and with no response it answers 400
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L219-L251).
  invalid_encrypted_content_body_code_routes_bad_request sends status 400, and the 400 status branch gives
  BadRequest as well, so deleting the azure_error_code check in encrypted_or_invalid_request keeps it green.
  Replace that test with a new rstest body_code_decides_the_class. Its columns are the body, the status code,
  the expected family and the expected metadata().status_code, and every row sends error_str "boom". Rows
  nested_encrypted_on_server_status (error.code invalid_encrypted_content, status 500, bad_request, 500) and
  nested_encrypted_without_status (the same body, no status, bad_request, 400) cover gap one. Add case
  azure-encrypted-code-no-status.yaml with body error.code invalid_encrypted_content and no status_code. Without
  the check the rows give api and api_connection, and the case answers status 500 where LiteLLM answers 400.


  Gap two. When the body has no error object, LiteLLM takes azure_error_code from the body's top-level code
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1946-L1963).
  That value feeds the content policy branch and the encrypted branch
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1989-L2002).
  For content policy, create_content_policy_violation_error reads type and code from the body itself and falls
  back to invalid_request_error and content_policy_violation
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/exception_mapping.py#L11-L83).
  azure_error_code_falls_back_to_top_level_code_without_error_object sends status 400, and the 400 branch gives
  BadRequest anyway, so deleting the fields.code fallback in azure_error_code in azure/body.rs keeps it green. No
  test or case reaches content policy through the top-level code. Replace that test with rows
  top_level_encrypted_on_server_status (top-level code invalid_encrypted_content, status 500, bad_request, 500)
  and top_level_policy_on_server_status (top-level code content_policy_violation, status 500,
  content_policy_violation, 500) in body_code_decides_the_class. Add cases azure-encrypted-top-level-code.yaml
  and azure-content-policy-top-level-code.yaml with those bodies and status 500. Without the fallback both rows
  give api, and both cases lose their openai_code (invalid_encrypted_content and content_policy_violation).


  Gap three. LiteLLM's Azure 408 branch raises Timeout without exception_status_code, so it answers 408. The 504
  branch passes exception_status_code and answers 504, and any other status becomes APIError with that status
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2072-L2127,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L356-L383).
  Rows status_408, status_504 and status_other of azure_openrouter_errors_behavior_tests_behavior check only the
  family, and no case sends 408, 504 or an unmapped status. So TimeoutStatus(504) changed to TimeoutStatus(408)
  in status_classification, or Api given a fixed 500, keeps everything green. Those three rows stay as family
  checks. Add rows request_timeout_408 ("boom", 408, expects 408), gateway_timeout_504 ("boom", 504, expects
  504) and unmapped_status_418 ("boom", 418, expects 418) to Azure's response_branches_answer_the_provider_status,
  and cases azure-request-timeout.yaml (408), azure-gateway-timeout.yaml (504) and azure-unmapped-status.yaml
  (418).


  Gap four. LiteLLM's OpenRouter 408 branch answers 408 and its 504 branch passes exception_status_code, so it
  answers 504
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2177-L2215).
  Rows status_408 and status_504 of OpenRouter's azure_openrouter_errors_behavior_tests_behavior check only the
  family, so TimeoutStatus(504) changed to TimeoutStatus(408) in openrouter.rs keeps them green. They stay as
  family checks. Add rows status_408 and status_504 to OpenRouter's response_branches_answer_the_provider_status,
  next to status_422, and cases openrouter-request-timeout.yaml (408) and openrouter-gateway-timeout.yaml (504).


  Gap five. LiteLLM's dispatcher sends both azure and azure_text into _map_azure_exception
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2640-L2649).
  Inside it only the missing-credential and "Connection error" branches pass the caller's custom_llm_provider
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2031-L2045).
  Every other branch sets llm_provider "azure", content policy included
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1965-L2030,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2046-L2136,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/exception_mapping.py#L37-L42).
  Every Azure test and case sends custom_llm_provider azure, the same string as the literal. So
  credential_or_connection could use "azure", or another branch could use input.custom_llm_provider, and nothing
  would fail, while an azure_text client would see the wrong provider. Add a new rstest
  provider_split_for_azure_text whose rows set custom_llm_provider azure_text and assert metadata().provider.
  Rows missing_credential_keeps_caller (the api_key sentence, no status) and connection_error_keeps_caller
  ("Connection error talking to Azure", no status) expect azure_text. Rows text_branch_answers_azure ("Internal
  server error occurred", no status), content_policy_answers_azure ("content_policy_violation detected in
  prompt", 400), encrypted_answers_azure ("the signature could not be verified", 500),
  invalid_request_answers_azure ("invalid_request_error: bad field", no status), status_branch_answers_azure
  ("boom", 401) and no_status_answers_azure ("boom", no status) expect azure. Add cases
  azure-text-missing-credential.yaml (the api_key sentence, no status), azure-text-connection-error.yaml
  ("Connection error talking to Azure", no status), azure-text-status.yaml (401) and azure-text-no-status.yaml
  (no status), all with custom_llm_provider azure_text.
