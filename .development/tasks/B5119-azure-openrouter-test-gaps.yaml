out_of_scope:
- >-
  azure.rs, azure/body.rs and openrouter.rs. Both classifiers already give LiteLLM's answer for every input
  above, so no product code changes. A new row or case that fails on today's code is a classifier bug to report
  as a blocker, not something to patch around in tests.rs.
- >-
  The oracle adapters tools/oracle/src/helpers/error/azure_openrouter_errors.rs and
  tools/oracle/helpers/azure_openrouter_errors.py. They already pass body, status_code and custom_llm_provider
  through and leave status_code unset when a case omits it.
- >-
  The fixed status per error class. B5102 already merged it, so the context_window_on_server_status and
  status_422 rows, azure-context-on-server-status.yaml and openrouter-unprocessable.yaml stay as they are.
- >-
  Padded one-line functions. They belong to B5094, and this task doesn't touch the legacy lists under
  .ast-grep/rules/.
pitfalls:
- >-
  Each row and case must reach only the branch it names. error_str must not hold "Internal server error",
  "This model's maximum context length is", "DeploymentNotFound", "could not be verified",
  "invalid_request_error", the api_key sentence, "Connection error" or a content policy substring
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L117-L134)
  unless that is the branch under test. Otherwise a row stays green when its own branch breaks. That is why
  body_code_decides_the_class sends "boom".
- >-
  A no-status row passes None, and a no-status case leaves status_code out entirely. LiteLLM's no-status path
  depends on hasattr(original_exception, "status_code"), and the Python adapter sets status_code and a response
  only when the case gives one.
- >-
  A nested body is `body: {error: {code: ...}}` and a top-level body is `body: {code: ...}` with no error key.
  In Rust, AzureErrorBody and AzureErrorDetail derive Default, so a row can set code and leave the rest to
  Default.
- >-
  Only azure and azure_text reach _map_azure_exception at the pin, so the provider rows use azure_text, not an
  invented provider.
- >-
  The new status rows go into the existing response_branches_answer_the_provider_status functions. Both
  already assert metadata().status_code, so don't add a second function with the same columns.
- >-
  rstest names each row case_<position>_<name>, and inserting rows shifts the positions, so every filter
  matches case_[0-9]+_ before the row name.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
