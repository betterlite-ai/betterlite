checks:
  optional: []
  commands:
  - id: azure-tests
    why: the Azure tests were not touched, or a changed row or one of the other Azure tests fails
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-error/src/azure_openrouter/azure/tests.rs)"
      && cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^azure_openrouter::azure::tests::/)'
  - id: openrouter-tests
    why: the OpenRouter tests were not touched, or a changed row or one of the other OpenRouter tests fails
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-error/src/azure_openrouter/openrouter/tests.rs)"
      && cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^azure_openrouter::openrouter::tests::/)'
  - id: encrypted-body-code
    why: the nested invalid_encrypted_content code is still tested only on status 400, where the status branch gives the same class
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-encrypted-code-no-status.yaml)"
      && ! grep -q 'fn invalid_encrypted_content_body_code_routes_bad_request(' crates/betterlite-error/src/azure_openrouter/azure/tests.rs
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^azure_openrouter::azure::tests::body_code_decides_the_class::case_[0-9]+_(nested_encrypted_on_server_status|nested_encrypted_without_status)$/)'
  - id: top-level-body-code
    why: the top-level body code is still tested only on status 400, and never for content policy
    run: >-
      test "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-encrypted-top-level-code.yaml
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-content-policy-top-level-code.yaml | wc -l)" -eq 2
      && ! grep -q 'fn azure_error_code_falls_back_to_top_level_code_without_error_object(' crates/betterlite-error/src/azure_openrouter/azure/tests.rs
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^azure_openrouter::azure::tests::body_code_decides_the_class::case_[0-9]+_(top_level_encrypted_on_server_status|top_level_policy_on_server_status)$/)'
  - id: azure-status-codes
    why: Azure's 408, 504 and unmapped status branches still have no status assertion or case
    run: >-
      test "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-request-timeout.yaml
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-gateway-timeout.yaml
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-unmapped-status.yaml | wc -l)" -eq 3
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^azure_openrouter::azure::tests::response_branches_answer_the_provider_status::case_[0-9]+_(request_timeout_408|gateway_timeout_504|unmapped_status_418)$/)'
  - id: openrouter-status-codes
    why: OpenRouter's 408 and 504 branches still have no status assertion or case
    run: >-
      test "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
      tools/oracle/cases/helpers/azure-openrouter-errors/openrouter-request-timeout.yaml
      tools/oracle/cases/helpers/azure-openrouter-errors/openrouter-gateway-timeout.yaml | wc -l)" -eq 2
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^azure_openrouter::openrouter::tests::response_branches_answer_the_provider_status::case_[0-9]+_(status_408|status_504)$/)'
  - id: azure-text-provider
    why: no test or case sends azure_text, so the caller's provider and the "azure" literal can be swapped unseen
    run: >-
      test "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-text-missing-credential.yaml
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-text-connection-error.yaml
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-text-status.yaml
      tools/oracle/cases/helpers/azure-openrouter-errors/azure-text-no-status.yaml | wc -l)" -eq 4
      && cargo nextest run --locked -p betterlite-error --no-tests=fail
      -E 'test(/^azure_openrouter::azure::tests::provider_split_for_azure_text::case_[0-9]+_(missing_credential_keeps_caller|connection_error_keeps_caller|text_branch_answers_azure|content_policy_answers_azure|encrypted_answers_azure|invalid_request_answers_azure|status_branch_answers_azure|no_status_answers_azure)$/)'
