id: B373
title: Bounded custom complexity dimensions
description: 'Implement CustomDimension validation and pattern work accounting with binary and match-count
  scores. Preserve the pinned accepted regex grammar and work limits; use a maintained regex parser/engine,
  not an ad hoc regex parser. Extend config_yaml fuzzing with accepted, rejected and boundary patterns.
  Configuration boundary keys introduced or consumed here: custom_dimensions. Pinned declaration defaults:
  custom_dimensions=(). Resolve env values once in betterlite-config, never in router code. MAX_CUSTOM_PATTERN_REPEAT=64,
  MAX_CUSTOM_PATTERN_WORK=2048, MAX_CUSTOM_DIMENSIONS_WORK=8192, MAX_CUSTOM_PATTERN_DEPTH=16 and CUSTOM_PATTERN_SCAN_CHARS=2048
  are source constants, not new environment settings. Implement the owned native service in crates/betterlite-router/src/custom_dimensions.rs.
  Add ProbeOperation::CustomDimensions in tools/oracle/src/router_probes/mod.rs and the corresponding B373 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/config.py:
  _atom_steps (L742-L745), _repeat_cost (L748-L755), _node_cost (L758-L777), _sequence_cost (L780-L795),
  custom_pattern_work (L798-L805), CustomDimension._validate_matchers (L825-L835), CustomDimension.pattern_work
  (L837-L841), ComplexityRouterConfig._validate_custom_dimensions (L1743-L1761). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
