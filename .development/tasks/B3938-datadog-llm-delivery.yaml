id: B3938
title: Datadog LLM span assembly and intake delivery
description: >-
  Implement Datadog LLM Observability span assembly and intake delivery in betterlite-logging: initialize logger with direct API or agent configuration,
  assemble complete LLM observation spans from standard logging payloads, and send intake envelopes to the `/api/intake/llm-obs/v1/trace/spans` endpoint.

  Resolve datadog_llm_observability_params configuration through injected settings (B002's loader). Support agent mode via LITELLM_DD_AGENT_HOST
  with port default LITELLM_DD_LLM_OBS_PORT=8126, and direct API mode via DD_API_KEY and DD_SITE; agent mode does not require DD_API_KEY.
  Override intake_url with DD_BASE_URL environment variable when set.

  Assemble spans with caller-provided span_id and name from request metadata (overriding defaults), trace_id from standard_logging_object or UUID fallback,
  parent_id from metadata or "undefined", and nanosecond-precision start_ns and duration from request timestamps.
  Include input/output message payloads, metadata, error info, span kind, token metrics and cost tags from B3935–B3937 payload construction functions.
  Attach current APM trace ID via _get_apm_trace_id when available (checking current_span.trace_id from the injected tracer).

  Send uncompressed JSON payloads to the intake endpoint with DD-API-KEY header when in direct API mode.
  Accept only HTTP 202 (Accepted) status; other responses raise an exception.
  Support periodic batch flushing through inherited CustomBatchLogger interface with configurable batch_size and timeout.
  Test threshold-send (batch size reached) and inherited periodic-flush paths separately, since swallowed send errors interact with the base flush's queue clearing.
scope:
  paths:
    - crates/betterlite-logging/src/datadog_llm_observability.rs
    - crates/betterlite-logging/src/datadog_llm_observability/**
    - tools/oracle/cases/datadog_llm_observability/**
    - tools/oracle/fuzz/corpus/datadog_llm_obs*
    - Cargo.toml
    - tools/oracle/helpers/b3938.py
    - tools/oracle/helpers/b3938/**
    - tools/oracle/src/helpers/logging/b3938.rs
    - tools/oracle/src/helpers/logging/b3938/**
  lint_tables: false
