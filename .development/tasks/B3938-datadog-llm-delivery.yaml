dod:
  - text: Logger initialization with no dd_agent_host falls back to direct API; explicit dd_api_key and dd_site override environment; DD_API_KEY is required for direct API but not agent mode.
    proof: [endpoint-configuration]
  - text: Agent endpoint uses port LITELLM_DD_LLM_OBS_PORT (default 8126) from environment; direct API endpoint uses DD_SITE environment variable.
    proof: [endpoint-configuration]
  - text: DD_BASE_URL environment variable overrides intake_url when set; when unset, no override is applied.
    proof: [endpoint-configuration]
  - text: datadog_llm_observability_params configuration is resolved from injected settings and passed to inherited CustomBatchLogger initialization.
    proof: [config-resolution]
  - text: Spans are assembled with caller span_id and name from metadata (or generated UUIDs as defaults), trace_id from standard_logging_object or UUID fallback, parent_id from metadata or "undefined".
    proof: [oracle]
  - text: Span start_ns and duration are computed from request timestamps in nanoseconds; no integer overflow on duration calculation.
    proof: [oracle]
  - text: Input and output messages are redacted when payload_logging_is_off returns true; tool definitions are included only when not redacted.
    proof: [oracle]
  - text: Error info, span kind, token metrics and cost tags are assembled from B3935–B3937 functions; metadata enrichment includes router fields when applicable.
    proof: [oracle]
  - text: Current APM trace ID from tracer.current_span.trace_id is attached to payloads as apm_id when available; absence does not fail the request.
    proof: [span-context-attachment]
  - text: Payloads are sent as uncompressed JSON with Content-Type=application/json; DD-API-KEY header is included in direct API mode only.
    proof: [payload-headers]
  - text: Only HTTP 202 (Accepted) status is accepted; other responses raise an exception with status code and response body.
    proof: [http-status-validation]
  - text: Async_log_success_event and async_log_failure_event queue payloads and trigger async_send_batch when batch_size is reached; periodic_flush and threshold-send paths are tested separately.
    proof: [batch-queueing]
  - text: Every helper operation in datadog LLM delivery has a committed shared-parser corpus seed and replays successfully.
    proof: [corpus-replay]
  - text: Mutants in span ID generation, trace ID fallback, APM correlation, message redaction and HTTP status validation are caught by tests.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: endpoint-configuration
      why: endpoint configuration tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_llm_obs_endpoint_configuration_behavior($|::)/)'
    - id: config-resolution
      why: config resolution tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_llm_obs_config_resolution_behavior($|::)/)'
    - id: span-context-attachment
      why: APM trace ID attachment tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_llm_obs_span_context_attachment_behavior($|::)/)'
    - id: payload-headers
      why: payload header tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_llm_obs_payload_headers_behavior($|::)/)'
    - id: http-status-validation
      why: HTTP status validation tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_llm_obs_http_status_validation_behavior($|::)/)'
    - id: batch-queueing
      why: batch queueing and flushing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/datadog_llm_obs_batch_queueing_behavior($|::)/)'
    - id: corpus-replay
      why: the fuzz corpus is missing, empty or replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
        && grep -rlq 'datadog_llm' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
        && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
        --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
