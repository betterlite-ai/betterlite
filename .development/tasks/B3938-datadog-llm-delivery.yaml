deviations:
  - what: When DD_API_KEY is unset in direct API mode, logger initialization raises an exception.
    why: LiteLLM requires explicit credentials for direct API; betterlite enforces the same check at startup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L463-L466
  - what: Agent mode does not require DD_API_KEY; direct API mode requires both DD_API_KEY and DD_SITE to be set.
    why: LiteLLM distinguishes agent and direct API initialization based on LITELLM_DD_AGENT_HOST presence; betterlite follows the same logic.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L451-L467
  - what: Payloads are sent as uncompressed JSON, unlike log delivery which uses gzip compression.
    why: LLM Observability intake endpoint accepts uncompressed JSON; log delivery to /api/v2/logs requires gzip per Datadog specifications.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L591-L595
  - what: When APM trace ID is unavailable, the payload is sent without apm_id; missing apm_id does not fail the request.
    why: APM correlation is best-effort; absence of the active span does not prevent LLM Observability intake.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L677-L679
  - what: Swallowed send errors (network failures, timeouts) are logged but do not requeue or preserve queue state; the queue is cleared after every send attempt.
    why: LiteLLM's LLM Observability intake clears the queue after sending regardless of success; transient failures do not preserve undelivered events for retry.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L600-L610
out_of_scope:
  - Delivery retry, cancellation requeue or 413-splitting logic; LLM Observability intake sends uncompressed JSON and does not split on 413.
  - Health checks; this task focuses on regular span delivery, not intake health monitoring.
  - Team-scoped or key-scoped logger isolation; this task builds the global LLM Observability logger registered by B113.
pitfalls:
  - trace_id and span_id may both come from caller metadata; check both before attaching to payloads as they are independent fields.
  - span_id and name defaults ("litellm_llm_call" for name, UUID for span_id) only apply when metadata does not provide them; do not override caller values.
  - parent_id defaults to "undefined" string (not null) when not provided; this is a literal string value, not a missing field.
  - APM trace ID is checked only on the current span, not root span fallback; if current_span is None or lacks trace_id attribute, apm_id is omitted.
  - HTTP status validation requires exactly 202; status 200, 201 or other 2xx codes are failures and must be raised, not silently accepted.
  - The injected tracer is passed through configuration; access its current_span method defensively without panicking on missing methods.
  - DD_BASE_URL override is set after endpoint configuration; check for it and apply only after agent/direct API URL is established.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
