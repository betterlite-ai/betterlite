    why: _get_datadog_llm_obs_params reads and validates datadog_llm_observability_params override.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog_llm_obs.py#L531-L553
