checks:
  optional:
  - mutants
  commands:
  - id: case-messages-url-normalization
    why: 'Choose truthy explicit api_base or AZURE_API_BASE, no litellm.api_base fallback. None raises ValueError:
      Missing Azure API Base - Please set `api_base` or `AZURE_API_BASE` environment variable. Expected format:
      https://<resource-name>.services.ai.azure.com/anthropic. Strip trailing slashes; any existing /v1/messages
      suffix is accepted. Otherwise truncate at the first /anthropic occurrence anywhere, append /anthropic if absent,
      then /v1/messages; this is literal string matching, not parsed URL path matching.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_cases::case_[0-9]+_messages_url_normalization$/)'
  - id: case-x-api-key-rename
    why: Use the same dict-versus-typed explicit-key insertion and B2200 Azure auth contract as B563. Rename exact
      api-key to x-api-key only if x-api-key is absent; if both exist retain both, including empty existing x-api-key.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_cases::case_[0-9]+_x_api_key_rename$/)'
  - id: case-anthropic-version-default
    why: Set exact lowercase anthropic-version=2023-06-01 and content-type=application/json only when missing, preserving
      present empty values and differently cased keys; delegate beta updates to B960, then return the original api_base
      with headers.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_cases::case_[0-9]+_anthropic_version_default$/)'
  - id: case-cache-control-scope-removal
    why: After B961 request and system-role normalization, mutate only dict cache_control on immediate dict content
      blocks in list system and list message.content. Remove scope alone, retain type/ttl/unknown keys, and leave
      tools, nested blocks, strings and non-dict cache_control unchanged.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_cases::case_[0-9]+_cache_control_scope_removal$/)'
  - id: case-system-role-normalization
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-anthropic-messages/system-role-normalization.yaml.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_cases::case_[0-9]+_system_role_normalization$/)'
  - id: case-native-body-projection
    why: custom_llm_provider=azure_ai and should_strip_billing_metadata=true; use B961 parent transformation and
      _normalize_system_role_messages without copying either implementation.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_cases::case_[0-9]+_native_body_projection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_anthropic_messages.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_anthropic_messages*")"
      && grep -lq 'foundry_anthropic_messages' tools/oracle/fuzz/corpus/helper_case/foundry_anthropic_messages*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_anthropic_messages$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::anthropic_messages_secret_safe_failure$/)'
