  why: Own AzureAnthropicMessagesConfig.custom_llm_provider, AzureAnthropicMessagesConfig.should_strip_billing_metadata,
    AzureAnthropicMessagesConfig.validate_anthropic_messages_environment, AzureAnthropicMessagesConfig.get_complete_url,
    AzureAnthropicMessagesConfig._remove_scope_from_cache_control, AzureAnthropicMessagesConfig.transform_anthropic_messages_request.
    Other functions in this file remain with the owners listed below.
