id: B564
title: Foundry Anthropic Messages requests
description: >-
  Add native FoundryMessagesRequest preparation using the Anthropic wire records already exposed by the provider.
  B961 owns the parent AnthropicMessagesConfig request behavior; this task owns the Azure overrides only and accepts
  pre-normalized Anthropic messages. Oracle adapters isolate these overrides with a superclass seam returning the
  supplied normalized input; they must not recreate the deferred parent algorithm. Preserve /anthropic/v1/messages
  base normalization, system roles and cache_control.scope removal.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/anthropic/messages_transformation.py:
  AzureAnthropicMessagesConfig.custom_llm_provider L22-L23; AzureAnthropicMessagesConfig.should_strip_billing_metadata
  L25-L26; AzureAnthropicMessagesConfig.validate_anthropic_messages_environment L28-L74; AzureAnthropicMessagesConfig.get_complete_url
  L76-L116; AzureAnthropicMessagesConfig._remove_scope_from_cache_control L118-L147; AzureAnthropicMessagesConfig.transform_anthropic_messages_request
  L149-L166.


  Reuse BaseAzureLLM._base_validate_azure_environment from B2200 (litellm/llms/azure/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: messages_url_normalization: Choose truthy explicit api_base or AZURE_API_BASE, no litellm.api_base
  fallback. None raises ValueError: Missing Azure API Base - Please set `api_base` or `AZURE_API_BASE` environment
  variable. Expected format: https://<resource-name>.services.ai.azure.com/anthropic. Strip trailing slashes; any
  existing /v1/messages suffix is accepted. Otherwise truncate at the first /anthropic occurrence anywhere, append
  /anthropic if absent, then /v1/messages; this is literal string matching, not parsed URL path matching. x_api_key_rename:
  Use the same dict-versus-typed explicit-key insertion and B2200 Azure auth contract as B563. Rename exact api-key
  to x-api-key only if x-api-key is absent; if both exist retain both, including empty existing x-api-key. anthropic_version_default:
  Set exact lowercase anthropic-version=2023-06-01 and content-type=application/json only when missing, preserving
  present empty values and differently cased keys; delegate beta updates to B960, then return the original api_base
  with headers. cache_control_scope_removal: After B961 request and system-role normalization, mutate only dict
  cache_control on immediate dict content blocks in list system and list message.content. Remove scope alone, retain
  type/ttl/unknown keys, and leave tools, nested blocks, strings and non-dict cache_control unchanged. native_body_projection:
  custom_llm_provider=azure_ai and should_strip_billing_metadata=true; use B961 parent transformation and _normalize_system_role_messages
  without copying either implementation.


  Write standalone Rust test anthropic_messages_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test anthropic_messages_secret_safe_failure in betterlite-foundry: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-foundry/src/anthropic_messages.rs with adjacent tests under anthropic_messages/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation foundry_anthropic_messages in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function anthropic_messages_cases in betterlite-foundry with these exact named cases (one per oracle
  file): messages_url_normalization, x_api_key_rename, anthropic_version_default, cache_control_scope_removal, system_role_normalization,
  native_body_projection. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_anthropic_messages* using HelperCase:
  kind: helper and the externally tagged foundry_anthropic_messages variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_foundry_anthropic_messages that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 112 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 205 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 520 planned, 525 maximum changed lines.
