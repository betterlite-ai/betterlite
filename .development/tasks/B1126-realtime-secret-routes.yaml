id: B1126
title: Realtime client secrets and transcription sessions
description: >-
  Register client_secrets and transcription_sessions routes, preserving configured provider payloads, status/media
  type passthrough and encrypted ephemeral token wrapping.


  A non-200 upstream response to client_secrets passes through with application/json. Preserve the native source
  session model/type defaults and token lifetime; never synthesize managed ownership.


  Implement crates/betterlite-server/src/api/realtime_secret_routes.rs, crates/betterlite-core/src/api/realtime_secret_routes.rs.
  Use RealtimeSecretRoutesInput and RealtimeSecretRoutesResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/realtime/client_secrets; POST /realtime/client_secrets; POST
  /openai/v1/realtime/client_secrets; POST /v1/realtime/transcription_sessions; POST /realtime/transcription_sessions;
  POST /openai/v1/realtime/transcription_sessions. Each alias is exercised through the booted proxy. Every route
  factory is mounted once; a family composer mounts its child factories without re-registering their methods/paths.


  Extraction uses the typed path/query/body records named by the owned handler signatures.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:316 type=openai_error_type(e, error_status_code(e, 500)), param=openai_error_param(e),
  code=error_status_code(e, 500); endpoints.py:310 type=openai_error_type(e, error_status_code(e, http_status.HTTP_400_BAD_REQUEST)),
  param=openai_error_param(e), code=error_status_code(e, http_status.HTTP_400_BAD_REQUEST); endpoints.py:620 type=openai_error_type(e,
  error_status_code(e, 500)), param=openai_error_param(e), code=error_status_code(e, 500); endpoints.py:614 type=openai_error_type(e,
  error_status_code(e, http_status.HTTP_400_BAD_REQUEST)), param=openai_error_param(e), code=error_status_code(e,
  http_status.HTTP_400_BAD_REQUEST). Compare the actual source status, error type, param and code; ignore only error
  wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions client_secrets_route, transcription_sessions_route, client_secret_upstream_non200,
  route_aliases, auth_missing, auth_invalid under api::realtime_secret_routes::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/realtime_endpoints/endpoints.py: create_realtime_client_secret (L231-L359);
  litellm/proxy/realtime_endpoints/endpoints.py: create_realtime_transcription_session (L536-L658). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 242 owned nonblank/non-comment/non-docstring Python lines (248 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 262 implementation,
  76 behavior tests, 72 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 448 total within the 450-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B855 (Authenticated request admission
  and budget handoff), B1010 (Realtime http calls), B1012 (Realtime ephemeral ids), B1103 (Authenticated request
  preparation), B1100 (Shared request body decoding), B171 (Direct helper oracle and URL path encoding), B1087 (Api
  boundaries), B756 (Authentication header selection and mode dispatch), B1139 (Stateful HTTP oracle scenarios).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
