  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_secret_routes::/)
      - test(/::replays_corpus$/)'
  - id: case-client-secrets-route
    why: the client-secrets-route behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::realtime_secret_routes::tests::client_secrets_route($|::)/)'
  - id: case-transcription-sessions-route
