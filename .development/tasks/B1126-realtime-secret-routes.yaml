id: B1126
title: Realtime client secrets and transcription sessions
description: >-
  Implement both complete secret/session handlers in betterlite-server::api::realtime_secret_routes.
  Register POST /v1/realtime/client_secrets,/realtime/client_secrets,/openai/v1/realtime/client_secrets
  and /v1/realtime/transcription_sessions,/realtime/transcription_sessions,
  /openai/v1/realtime/transcription_sessions once, with B756 authentication. B1100 reads the request
  body and B1004 validates its records. B1012 prepares client-secret model authorization; transcription
  creation calls B886 directly. B1103 enriches data, B124 supplies ProxyLogging hook services,
  B014 routes and B1010 makes provider HTTP calls. B061 encrypts B1012 payloads.

  Client-secret session/model defaults and candidate order come from B1012. Only a root model with no
  session causes the route to create {type:realtime,model:<resolved>}; no session and no root model
  leaves session absent. expires_after is dumped excluding None. Transcription routing uses root model,
  then flat input_audio_transcription.model, then gpt-realtime-whisper; the forwarded transcription_session
  is the original body minus root model, preserving unknown fields. B1010 later locks nested model to
  the authorized routing model. Pre-call hook names and route_type are respectively
  acreate_realtime_client_secret/acreate_realtime_transcription_session.

  Catch preparation/dispatch exceptions and run failure hooks, preserving an existing ProxyException.
  HTTPException message extraction differs: client_secrets uses message-or-str(exception), transcription
  uses detail first. After the try, a returned status other than 200 passes bytes/status through as
  application/json without encryption. JSON parsing, encryption and response validation after a200
  are outside the route catch and use B003's unhandled500 response. No success hook/custom headers run.

  B001/B1139/B856 HTTP cases configure a master key, salt and virtual-key/model grants. Mask only the
  randomized ciphertext across independent runs; assert its presence, difference from plaintext and
  equality of rewritten copies within one response. Native tests decrypt minted tokens and assert every
  payload field against B1012. Reuse B1100/B1004 decoders. Count248 nonblank/non-comment handler lines;
  budget 225 implementation,165 tests,200 HTTP fixtures and 40 wiring =630 changed lines.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/realtime_secret_routes.rs
  - crates/betterlite-server/src/api/realtime_secret_routes/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - tools/oracle/cases/api/realtime-secret-routes/**
  - tools/oracle/fixtures/realtime-secret-routes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/realtime_endpoints/endpoints.py#L216-L359
  why: All client-secret aliases and complete handler, including post-try encryption and response filtering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/realtime_endpoints/endpoints.py#L521-L658
  why: All transcription-session aliases and complete handler; detail extraction and nested-token wrapping differ.
dod:
- text: >-
    secret_route_aliases POSTs authenticated valid JSON separately to all six paths and expects200 and
    exactly one matching provider request per step. Missing/invalid auth with a configured master key gives
    401/authentication_error/param="None"/code="401" and no provider call. Body query parameters do not
    override model routing. An empty client-secret body routes gpt-4o-realtime-preview without inventing
    session; root model=m creates session={type:realtime,model:m}; expires_after={seconds:60} sends anchor=
    created_at and seconds60. Empty transcription body routes gpt-realtime-whisper and sends an empty body.
  proof: [behavior-tests, oracle]
- text: >-
    secret_authorized_models seeds a key allowed model=a. Client-secret realtime session.model=a beats
    root model=b. Transcription session GA model=a and flat model=b authorizes both and rejects b with
    403/key_model_access_denied/param=model/code="403", message="The requested model 'b' is not available
    for this API key, or the model name is invalid. Check the models available to you and try again.".
    With both models allowed, choose GA a, rewrite both nested models to a and remove session.model.
    No nested candidates falls back session.model then root model, checking both distinct candidates;
    no candidates uses gpt-realtime-whisper. Unknown session type is coerced to realtime. The transcription
    route with root model=a,nested model=b authorizes a and B1010 rewrites nested to a before provider I/O,
    preserving language and unknown body fields. Denials make zero provider calls and run failure logging.
  proof: [behavior-tests, oracle]
- text: >-
    client_secret_token_wrapping returns mock {value:ep,expires_at:2000000000,session:{client_secret:{value:ep},
    future:1},extra:ignored}. Expect one encrypted token in value and the existing nested value, raw session
    future retained and top-level extra dropped. Native decryption yields v=realtime_v1,ephemeral_key=ep,
    model_id=<authorized route model>,user_id/team_id from auth or "",expires_at=2000000000,session_type
    selected by B1012. Missing value encrypts an empty key; nested client_secret without value gains no value.
    Missing expiry/session serialize as null. String expiry="2000000000" is not an int for payload encoding,
    so encrypted expires_at=null even though the response model coerces its public expiry to an integer.
    Bool expiry is accepted as int by the source payload check. Nonstring raw value is JSON-encoded in the
    token payload rather than validated by this route; its later legacy-decoding consequences belong to B084.
  proof: [behavior-tests, oracle]
- text: >-
    transcription_token_wrapping encrypts only an object client_secret containing value; missing/null/nonobject
    records follow B1004 response validation, and an object without value is unchanged. Payload uses expiry
    from client_secret.expires_at, authorized routing model and session_type=transcription. Unknown top-level
    response fields survive, unlike client_secrets. A present client_secret.value is replaced once; no
    top-level value rewrite is performed. Native decrypted-field assertions cover missing and noninteger
    expiry, empty owner fields and nested secret equality without comparing nonce-dependent strings.
  proof: [behavior-tests, oracle]
- text: >-
    secret_route_failure_boundaries uses returned201/body=sentinel to prove pass-through without encryption,
    with application/json regardless of upstream content type and no copied provider headers. An SDK-raised
    429 instead becomes429/rate_limit_error/null/"429" unless it supplies its own type/param. Existing
    ProxyException403/type=custom/param=session/code403 retains fields. HTTPException400/detail=blocked
    yields invalid_request_error/null/"400" on both routes, but transcription message is blocked while
    client_secrets uses str(exception). Malformed request JSON and invalid typed fields produce the route's
    mapped500/internal_server_error/null/"500". Malformed200 provider JSON, encryption failure or invalid
    response fields occur after the catch: expect500 {error:{message:"Internal server error",
    type:internal_server_error}} with param/code absent and no route failure-hook invocation. Compare hook
    call types and data snapshots with native spies and the resulting HTTP envelope through both proxies.
  proof: [behavior-tests, oracle]
- text: Each alias and token/error variant has a newly added HTTP fixture.
  proof: [new-cases, oracle]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Model authorization, encrypted payload fields and the post-dispatch error boundary need route tests.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::realtime_secret_routes::tests::/)'
  - id: new-cases
    why: All six secret/session paths must be exercised through booted gateways.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/realtime-secret-routes)"
oracle_cases:
- tools/oracle/cases/api/realtime-secret-routes/secret-route-aliases.yaml
- tools/oracle/cases/api/realtime-secret-routes/secret-authorized-models.yaml
- tools/oracle/cases/api/realtime-secret-routes/client-secret-token-wrapping.yaml
- tools/oracle/cases/api/realtime-secret-routes/transcription-token-wrapping.yaml
- tools/oracle/cases/api/realtime-secret-routes/secret-route-failure-boundaries.yaml
deviations: []
out_of_scope:
- B1012 owns all helpers at43-213; B084 owns proxy_realtime_calls362-518. B061 owns encryption algorithms, salt configuration and nonce generation; B1004 request/response schemas; B1100 body parsing.
- B124 supplies pre_call_hook/post_call_failure_hook without exposing proxy globals to helper adapters; B756 authenticates; B886 owns grant evaluation; B1010/B2456 own provider requests.
pitfalls:
- A returned201 is passed through and never encrypted because the source checks status_code !=200, not generic HTTP success.
- The transcription HTTPException branch uses detail, while client_secrets uses message or str(exception).
- Token expiry uses Python isinstance(value,int), so booleans pass but numeric strings do not.
review_level: security
budget:
  max_changed_lines: 650
  max_new_expects: 0
