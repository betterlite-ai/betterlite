pitfalls:
- Within process_audio_file\'s isinstance(audio_file, (bytes, bytearray)) branch, preserve raise ValueError('process_audio_file
  does not accept bare str inputs. Pass bytes, an open file handle, a (filename, content) tuple, or a pathlib.Path.')
  and its nested guards.
- Within process_audio_file\'s file_content is None branch, preserve raise ValueError('Could not extract file content
  from audio_file') and its nested guards.
