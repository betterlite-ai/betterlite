id: B1001
title: Audio file input
description: >-
  Normalize supplied audio bytes, filename/MIME and health fixture data, produce SHA-256 content hashes and duration
  facts, and normalize language codes. Reuse existing media metadata helpers; trusted SDK local Path handles may
  read files but HTTP form strings must never become paths or URLs.


  Own the opaque get_audio_file_for_health_check WAV fixture under crates/betterlite-core/src/api/audio_file_input/fixtures/;
  do not put this production health fixture in the oracle harness task.


  Implement crates/betterlite-core/src/api/audio_file_input.rs. Use AudioFileInputInput and AudioFileInputResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions raw_bytes_default_wav, filename_mime_fallback, tuple_content_hash,
  bare_string_rejected, language_bcp47, duration_boundary under api::audio_file_input::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::audio_file_input::decode_audio_metadata(bytes: &[u8],
  limits: &ApiLimits), for bounded supplied WAV/MP3/etc bytes passed to the selected audio metadata library. Place
  its implementation in crates/betterlite-core/src/api/audio_file_input.rs and call it from the actual boundary.
  The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/audio_file_input.rs passes arbitrary bounded bytes
  to that exact decoder; api::audio_file_input::tests::replays_corpus replays newly committed seeds through the
  same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::AudioFileInput in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {audio_file_input: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/litellm_core_utils/audio_utils/utils.py: process_audio_file (L36-L129); litellm/litellm_core_utils/audio_utils/utils.py:
  normalize_transcription_language_to_bcp47 (L148-L157); litellm/litellm_core_utils/audio_utils/utils.py: get_audio_file_name
  (L160-L175); litellm/litellm_core_utils/audio_utils/utils.py: get_audio_file_content_hash (L178-L244); litellm/litellm_core_utils/audio_utils/utils.py:
  get_audio_file_for_health_check (L247-L255); litellm/litellm_core_utils/audio_utils/utils.py: calculate_request_duration
  (L258-L331). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 203 owned nonblank/non-comment/non-docstring Python lines (255 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 223 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 551 total within the 560-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B235 (Media metadata and MIME inference),
  B1087 (Api boundaries), B1128 (File type and MIME records). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
