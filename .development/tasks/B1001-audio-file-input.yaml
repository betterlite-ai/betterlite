checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_file_input::/) - test(/::replays_corpus$/)'
  - id: case-raw-bytes-default-wav
    why: the raw-bytes-default-wav behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_file_input::tests::raw_bytes_default_wav($|::)/)'
  - id: case-filename-mime-fallback
    why: the filename-mime-fallback behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_file_input::tests::filename_mime_fallback($|::)/)'
  - id: case-tuple-content-hash
    why: the tuple-content-hash behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_file_input::tests::tuple_content_hash($|::)/)'
  - id: case-bare-string-rejected
    why: the bare-string-rejected behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_file_input::tests::bare_string_rejected($|::)/)'
  - id: case-language-bcp47
    why: the language-bcp47 behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_file_input::tests::language_bcp47($|::)/)'
  - id: case-duration-boundary
    why: the duration-boundary behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::audio_file_input::tests::duration_boundary($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/audio_file_input)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/audio_file_input.rs && grep -qF "decode_audio_metadata"
      crates/betterlite-core/fuzz/fuzz_targets/audio_file_input.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::audio_file_input::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/audio_file_input.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/audio_file_input-*)"
      && grep -qE "^[[:space:]]+audio_file_input:" tools/oracle/fuzz/corpus/helper_case/audio_file_input-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/audio-file-input)"
