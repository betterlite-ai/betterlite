id: B1001
title: Audio input bytes, identity and duration
description: >-
  Implement ProcessedAudioFile, process_audio_file, language normalization, get_audio_file_name,
  get_audio_file_content_hash, health-check audio access and calculate_request_duration. Put provider-consumable
  records/helpers in betterlite-openai::api::audio_file_input so provider leaves never import core. B1128 owns
  filename extension/MIME tables. Strings are metadata, not paths; SDK PathLike opening is B159's responsibility
  through an injected authorized reader. The route cannot create that capability. Raw bytes/bytearray default
  to audio.wav; tuple filename falls back to audio.wav, and its third MIME item is ignored. Process reads from
  the current reader position then seeks to zero, whereas hashing and duration seek to zero then restore the
  original position after successful reading. Preserve their distinct failure paths.

  SHA-256 uses extracted bytes when available, else a truthy fallback filename, else str(file_obj). Bare strings
  are hashed as strings without reading disk. The health probe returns the bundled audio_health_check.wav
  content via an owned handle. Duration is decoded sample count/sample rate, independent of channel count;
  missing soundfile, unsupported extraction and every read/decode error yield None silently. Keep a typed
  unavailable-decoder capability for Python parity; native supported codecs must run the actual bounded
  decode_audio_duration(bytes,limits), fuzzed and corpus-replayed. Compare durations as decimal/rational values.

  Register helper operation audio_file_input with finite read/seek fixtures; authorized local-file fixtures are
  harness-owned, never paths taken from a request. All seven functions have runtime callers in transcription,
  caching or health code. Ownership comprises 226 function/type lines plus the 14-line language table, excluding
  blanks/comments. Budget 230 implementation, 140 tests, 100 cases, 95 adapters, 75 fuzz/replay and 40 wiring,
  680 total. MIME/speech-byte helpers at 337-403 remain B1003's.
scope:
  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/audio_file_input.rs
  - crates/betterlite-openai/src/api/audio_file_input/**
  - crates/betterlite-openai/fuzz/Cargo.toml
  - crates/betterlite-openai/fuzz/fuzz_targets/audio_duration.rs
  - crates/betterlite-openai/fuzz/corpus/audio_duration/**
  - Cargo.toml
  - Cargo.lock
  - tools/oracle/src/helpers/openai/audio_file_input.rs
  - tools/oracle/src/helpers/openai/audio_file_input/**
  - tools/oracle/helpers/audio_file_input.py
  - tools/oracle/helpers/audio_file_input/**
  - tools/oracle/cases/helpers/audio-file-input/**
  - tools/oracle/fixtures/audio-file-input/**
  - tools/oracle/fuzz/corpus/helper_case/audio_file_input-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/audio_utils/utils.py#L20-L331
  why: Own the audio-file contract, stream positions, hash fallbacks, language table and optional duration calculation.
dod:
- text: >-
    audio_input_shapes processes bytes/bytearray abc as {filename:audio.wav,content:abc,content_type:audio/wav}.
    Tuple (voice.MP3,abc,audio/custom) uses audio/mpeg, ignoring its third item; ("",abc) uses audio.wav/audio/wav.
    Unknown/no extension falls back to audio/wav. A stream named voice.wav at offset 1 returns bc and is reset
    to 0. Tuple-held streams follow the same rule. Authorized PathLike fixtures read the file and use its final
    slash-separated component as filename. Empty bytes are valid content, not extraction failure.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    audio_input_rejections passes bare "voice.wav": ValueError with source message "process_audio_file does not
    accept bare str inputs. Pass bytes, an open file handle, a (filename, content) tuple, or a pathlib.Path."
    A tuple with string contents raises the corresponding "process_audio_file does not accept bare str tuple
    contents. Pass bytes, an open file handle, or a pathlib.Path." A one-element tuple raises "Tuple must have
    at least 2 elements: (filename, content)"; integer content and integer input raise "Unsupported content type
    in tuple: <class 'int'>" and "Unsupported audio_file type: <class 'int'>". A reader returning None raises
    "Could not extract file content from audio_file". Read/open/seek failures propagate; none are warnings.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    audio_hash_and_position gives bytes abc, tuple (different,abc) and a seekable abc stream at offset 2:
    all hash to ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad. The stream returns to 2.
    A bare string "abc" yields that same UTF-8 hash without opening a file. Failed read hashes the reader's
    name; failed PathLike open hashes its path; a missing/empty tuple name falls back to str(tuple). A tuple
    string content overrides its filename as the fallback. Record seek/read failures and do not invent restoration
    after a failed read. get_audio_file_name prefers .name, then str, then repr; its result need not be a basename.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    transcription_language_codes maps en/es/de/fr/it/pt/ja/ko/zh/ru/hi/ar to en-US/es-ES/de-DE/fr-FR/it-IT/pt-BR/
    ja-JP/ko-KR/zh-CN/ru-RU/hi-IN/ar-SA. Uppercase EN also becomes en-US. Already hyphenated en-gb remains
    en-gb; unknown zz and whitespace-padded " en " remain unchanged. Do not trim or normalize qualified tags.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    audio_duration_and_health supplies 16000-frame,16000-Hz mono and stereo WAVs: duration=1 for either.
    Bytes, raw bytearray, authorized PathLike and a seekable stream work; stream offsets are restored. Tuple
    contents accept bytes or a reader but not bytearray or PathLike, returning None for the latter two. Bare
    strings, malformed bytes, absent decoder, short tuple and reader/decode exceptions return None without
    warnings. A zero-frame valid file gives 0. Health access returns the bundled WAV's exact bytes from the
    resource, with an owned handle closed by the caller; missing resource propagates its file-open error.
  proof: [behavior-tests, oracle, helper-python, parser-corpus]
- text: The helper tag and audio decoder have new seeds, and every duration corpus input enters decode_audio_duration.
  proof: [helper-corpus, parser-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Extraction, hashing and duration deliberately have different reader and failure semantics.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::audio_file_input::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: The source helper adapter must exist and use typed reader fixtures.
    run: test -f tools/oracle/helpers/audio_file_input.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: Audio helper input must select its own tagged operation.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/audio_file_input-*)" && grep -qE '^[[:space:]]+audio_file_input:' tools/oracle/fuzz/corpus/helper_case/audio_file_input-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: Untrusted audio frames must exercise the production bounded duration decoder.
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/audio_duration.rs && grep -qF decode_audio_duration crates/betterlite-openai/fuzz/fuzz_targets/audio_duration.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/audio_duration)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::audio_file_input::tests::replays_corpus$/)'
  - id: new-cases
    why: Audio identity and stream-position behavior need newly added fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/audio-file-input)"
oracle_cases:
- tools/oracle/cases/helpers/audio-file-input/audio-input-shapes.yaml
- tools/oracle/cases/helpers/audio-file-input/audio-input-rejections.yaml
- tools/oracle/cases/helpers/audio-file-input/audio-hash-and-position.yaml
- tools/oracle/cases/helpers/audio-file-input/transcription-language-codes.yaml
- tools/oracle/cases/helpers/audio-file-input/audio-duration-and-health.yaml
deviations: []
out_of_scope:
- B1003 owns _speech_media_type_for_response_format,resolve_speech_media_type,_adts_aac_frame_media_type,_mpeg_audio_frame_media_type,speech_media_type_from_audio_bytes in the same file.
- B1128 owns get_file_mime_type_from_extension and MIME tables. B159 owns Python PathLike/file capability creation; this task consumes an authorized reader rather than a request filename.
pitfalls:
- 'The oracle helper for this task is pre-registered as audio_file_input in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/audio_file_input.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/audio_file_input.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- process_audio_file ignores a tuple's explicit MIME value and uses its filename extension instead.
- Processing consumes from the current position and resets to zero; hashing and duration read from zero and restore.
- Duration silently ignores PathLike and bytearray inside tuples even though it accepts either as a top-level input.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
