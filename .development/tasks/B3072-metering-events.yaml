dod:
  - text: LagoLogger.__init__ calls super().__init__(), validates environment, and initializes sync and async HTTP handlers from B173 imports.
    proof: [lago-init]
  - text: LagoLogger.validate_environment raises Exception with missing_keys list if LAGO_API_KEY, LAGO_API_BASE or LAGO_API_EVENT_CODE are missing.
    proof: [lago-validate]
  - text: LagoLogger._common_logic extracts model, cost, usage tokens (prompt_tokens, completion_tokens, total_tokens) from response, and resolves subscription ID from charge_by.
    proof: [lago-common]
  - text: Lago charge_by reads LAGO_API_CHARGE_BY (default "end_user_id"), validates it is in ["end_user_id", "team_id", "user_id"], and raises Exception on invalid value.
    proof: [lago-charge-by]
  - text: LagoLogger.log_success_event posts to LAGO_API_BASE/api/v1/events with application/json content type, JSON body containing event{transaction_id (UUID), external_subscription_id, code, properties} and Bearer auth.
    proof: [lago-post]
  - text: LagoLogger.async_log_success_event posts asynchronously with the same payload and auth, re-raising the original HTTP exception after logging response.text at debug level.
    proof: [lago-async]
  - text: OpenMeterLogger.__init__ calls super().__init__(), validates environment, and initializes sync and async HTTP handlers.
    proof: [openmeter-init]
  - text: OpenMeterLogger.validate_environment raises Exception with missing_keys list if OPENMETER_API_KEY is missing.
    proof: [openmeter-validate]
  - text: OpenMeterLogger._common_logic builds CloudEvents with specversion "1.0", type from OPENMETER_EVENT_TYPE (default "litellm_tokens"), id, time, subject, source and data.
    proof: [openmeter-common]
  - text: OpenMeter subject reads from request user if OPENMETER_TRUST_REQUEST_USER is "true" (default), falls back to user_api_key_user_id, and raises Exception if neither is present.
    proof: [openmeter-subject]
  - text: OpenMeterLogger.log_success_event posts to OPENMETER_API_ENDPOINT/api/v1/events (default https://openmeter.cloud/api/v1/events) with application/cloudevents+json content type, CloudEvents JSON and Bearer auth.
    proof: [openmeter-post]
  - text: "OpenMeterLogger.async_log_success_event posts asynchronously with the same payload and auth, wrapping httpx.HTTPStatusError into Exception(f\"OpenMeter logging error: {e.response.text}\")."
    proof: [openmeter-async]

