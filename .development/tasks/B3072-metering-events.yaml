deviations:
  - what: When Lago subscription_id cannot be resolved (all charge_by options are None), an error is raised instead of silently logging.
    why: LiteLLM raises Exception; betterlite preserves this behavior to catch configuration errors early.
  - what: OpenMeter raises an error if both request user and key-bound user_api_key_user_id are missing, rather than using a fallback account.
    why: LiteLLM raises Exception; betterlite preserves this to ensure events are always properly attributed.
  - what: HTTP errors from Lago and OpenMeter cause the callback to raise, which fails the request and stops retry.
    why: LiteLLM's post() raises on HTTP errors; betterlite preserves this error propagation to ensure delivery is observable.

out_of_scope:
  - UUID generation is provided by the uuid crate; this task uses it in the Lago payload.
  - HTTPHandler and get_async_httpx_client are imported from B173; this task uses their post and async post operations.
  - ModelResponse and EmbeddingResponse usage extraction is based on hasattr checks, mirroring LiteLLM's type checking without new dependencies.
  - Date/time formatting is done with chrono or DateTime methods to preserve ISO 8601 format.

pitfalls:
  - "Lago transaction_id is a fresh UUID.v4 for every event; do not reuse the litellm_call_id."
  - "Lago charge_by must select from [end_user_id, team_id, user_id] exactly; empty string or a typo raises Exception."
  - "Lago API_BASE may or may not end with /; check and append /api/v1/events only when needed."
  - "OpenMeter TRUST_REQUEST_USER value is case-insensitive and compared to \"true\"; any other value (including \"True\") disables request user."
  - "OpenMeter subject must always be a string, even if user_api_key_user_id is numeric; convert with to_string()."
  - "OpenMeter API_ENDPOINT defaults to https://openmeter.cloud, not an empty string; concatenate /api/v1/events only once."
  - "Both adapters must call super().__init__() to inherit CustomLogger initialization and callback registration."

