id: B3072
title: Publish Lago and OpenMeter usage events
description: >-
  Implement both Lago and OpenMeter success-callback adapters in
  `betterlite-logging::finops::metering`. Each adapter inherits from
  `CustomLogger` and posts usage events after a successful request.

  Lago posts UUIDs as transaction IDs and routes events to a configured
  subscription (selected from LAGO_API_CHARGE_BY: end_user_id, team_id,
  user_id). OpenMeter sends CloudEvents and distinguishes between
  request-supplied user (when OPENMETER_TRUST_REQUEST_USER is "true",
  the default) and key-bound user_api_key_user_id (the fallback when
  trust is disabled or the request has no user).

  Both adapters extract usage (prompt_tokens, completion_tokens,
  total_tokens) from ModelResponse and EmbeddingResponse when present,
  and extract cost from response_cost in the callback. Preserve sync
  and async event delivery using owned HTTP operations, not a second
  gateway client.

  Configuration: Lago requires LAGO_API_BASE, LAGO_API_KEY and
  LAGO_API_EVENT_CODE; optionally reads LAGO_API_CHARGE_BY (default:
  end_user_id). OpenMeter requires OPENMETER_API_KEY; optionally reads
  OPENMETER_API_ENDPOINT (default: https://openmeter.cloud),
  OPENMETER_EVENT_TYPE (default: litellm_tokens) and
  OPENMETER_TRUST_REQUEST_USER (default: true).

