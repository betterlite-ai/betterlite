deviations:
- what: Pipelined _Increment with explicit TTL always issues EXPIRE; standalone fallback
    via B360's async_increment never refreshes TTL.
  why: The batch engine pipelines both INCRBYFLOAT and EXPIRE for increments with TTL,
    but the standalone recovery path (used for Cluster clients and NOSCRIPT failures)
    goes through B360's nonrefreshing async_increment. This observable difference is
    preserved until a unified TTL contract is established across the routing and general-cache
    surfaces.
out_of_scope:
- B360 owns standalone increment/MGET/GET/SET and their nonrefreshing TTL behavior;
  batch engine calls these for Cluster clients and NOSCRIPT recovery, not reimplementation.
- B393 owns circuit breaker and logging; batch engine calls these services.
- B4324 owns cache namespace and decode logic; batch engine calls these helpers.
- B4325 owns async client initialization and Cluster transport discriminant; batch
  engine calls these to prepare pipelines and decide dispatch.
- B4326 owns async_delete_cache; batch engine calls it in DELETE operation fallback.
- B4327 owns async_set_cache_pipeline_with_ttls; batch engine calls it in SET operation
  fallback.
- 'litellm/caching/redis_batch.py: All functions listed under owned functions above
  are the sole responsibility of this task. No other LiteLLM caching code depends
  on RedisBatch; it is used only through RequestRedisBatches (B4331) at the caller
  entry points in litellm/proxy/proxy_server.py and litellm_logging.py.'
pitfalls:
- Settled hooks run even when cancelled or the batch fails; do not assume the operation
  has a result value.
- Cluster caches dispatch each operation standalone, not as a batch; a caller expecting
  atomicity across operations must handle Cluster separately.
- NOSCRIPT failures trigger standalone retries; callers must not assume the operation
  has a script or does not need one.
- Miss tracking records MGET keys that returned None; later SET or DELETE operations
  clear miss entries for those keys, but subsequent MGET operations rediscover the
  actual stored value if it was written since the earlier MGET.
review_level: standard
budget:
