id: B4330
title: Batch independent Redis operations with isolated results
description: 'Build the nontransactional batch engine and awaitable results so unrelated
  MGET, Lua, increment, SET and DELETE operations share a round trip but keep separate
  results and failures. Preserve per-operation reply widths, NOSCRIPT standalone recovery,
  Cluster standalone execution, flush hooks, miss tracking, settled hooks and cancellation
  cleanup. Reuse B360 async_batch_get_cache and async_increment for standalone fallback
  when a pipeline cannot settle an operation; B393 circuit breaker and logging for
  pipelined failures; B4324 namespace and cache logic helpers; B4325 async client
  reuse and Cluster transport discriminant; B4326 async_delete_cache; B4327 async_set_cache_pipeline_with_ttls;
  G1 get_ttl for operation TTLs; G5 async service success/failure hooks for pipelined
  operations. Every operation declares a future and returns an awaitable BatchResult;
  awaiting any result flushes the batch, settling all declared operations in one pipeline
  round trip. Cluster caches run operations standalone. Pipeline failures set all
  operations to exception; individual operation failures within a successful pipeline
  trigger per-operation standalone retries and keep the batch engine below its declaring
  callers. Miss tracking feeds subsequent read operations on the same request. Settled
  hooks run after all operations are done, even if cancelled or the batch failed.'
