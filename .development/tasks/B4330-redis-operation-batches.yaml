    The first asserts successful operations, pipeline failures, operation failures
    with standalone recovery and miss tracking. The second asserts error fields, cancellation,
    Cluster standalone execution, settled hook ordering and that hooks registered via
    add_flush_hook run at the start of flush(), before pending operations are read.
    Use rstest cases for tables; corpus replay cannot satisfy either check.
