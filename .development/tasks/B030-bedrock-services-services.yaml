id: B030
title: Bedrock service endpoint composition
description: >-
  Finish Bedrock service composition with native configured S3 file and Bedrock batch operations and model-resolution/parameter-pipeline
  wiring. B680 installs agents/Claude Platform and B681 installs Responses/passthrough/search/vector/realtime; depend
  directly on those composition parts and the file/batch leaves. Public routes and batch scheduling remain API-family
  work.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Named case contracts: files_upload_read: Install B644 upload and B645 retrieve/content through B643 authorization
  and parsed file IDs. Assert configured bucket/prefix and credential identity, JSONL transformation, file ID/size
  metadata and byte content. Preserve per-operation access errors; uploads use local file bytes or already supplied
  multipart contents, not downloaded request URLs. files_list_delete: Install B646 list/delete with its actual prefix/list
  request and deletion response. Exercise distinct deployment credentials and foreign bucket rejection via B643/B2208.
  Do not expose legacy dead helper branches as new operations. batch_create: Install B649 native Bedrock batch creation
  with B647 input-record mapping and B648 output-file parsing, B650 request transformation and B651 transport. Preserve
  inputFile/outputS3Uri model invocation fields, signing and caller-provided native job identifiers; errors retain
  the leaf response. This is the open-source Bedrock service path, not the enterprise managed batch runner. batch_retrieve_list_cancel:
  Drive native B649 retrieve/list/cancel and B651 transport, including status mapping, output file conversion, pagination
  and cancellation behavior. The operation enum must call the leaves, not return fixture tags. Keep public batch
  listing and runner choice with B1051/B1133/B1112. installed_service_families: Exercise B680 agents/Claude Platform
  and B681 Responses/passthrough/search/vector/realtime through the same closed dispatcher. Existing model resolution
  B174 and parameter mapping B175 run at the caller boundary; leaf crates do not call the upper dispatcher. native_s3_is_not_managed:
  A configured native Bedrock S3 file/batch call uses only the installed open-source leaves and does not construct
  or register a managed_files hook. Preserve native operation availability even though enterprise-managed IDs/storage
  are unavailable. Proxy managed-hook errors are HTTP cases of B1031/B1032/B1033/B1034/B087 and B1050/B1051/B1133,
  not helper calls into FastAPI globals.


  The current managed-batch source message is LiteLLM-executed batches need a database: set DATABASE_URL so LiteLLM
  can keep the batch and its files. Public route owners apply B184 message rewriting while matching status/type/param/code.
  Request URL downloads remain disabled: local file/multipart bytes are accepted; a route requiring fetched bytes
  fails through its existing media error owner, with zero outbound fetch. The decision to enable request URL downloads
  and to add managed files/batches remains open for Max.


  Write standalone Rust test bedrock_services_dispatch_credential_identity_isolation in betterlite-provider: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test bedrock_services_dispatch_secret_safe_failure in betterlite-provider: Debug and owned
  failure paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-provider/src/bedrock_services_dispatch.rs with adjacent tests under bedrock_services_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  leaf crates remain below this dispatcher and never import it. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_services_dispatch_cases in betterlite-provider with these exact named cases (one
  per oracle file): files_upload_read, files_list_delete, batch_create, batch_retrieve_list_cancel, installed_service_families,
  native_s3_is_not_managed. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_services* using HelperCase:
  kind: helper and the externally tagged bedrock_services_services variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_services that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 180 production lines, 270 behavior/config-test lines, 140 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 625 planned, 625 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
