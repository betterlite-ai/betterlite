deviations:
- what: No enterprise managed-files hook or managed batch store is installed. Native configured Bedrock S3 files/batches
    remain available. A managed multi-model upload fails HTTP 500, type internal_server_error, param None, code
    500 (source message Managed files hook not found); LiteLLM-executed batch creation without ManagedBatchStore
    fails HTTP 400, type invalid_request_error, param None, code 400, with the source database-required message
    even if DATABASE_URL is set.
  why: Keep the open-source behavior while Max decides whether betterlite should implement managed files and batches
    independently. The pinned enterprise hook is absent; native S3 support does not supply it.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L470-L483
out_of_scope:
- B080-B099 own public endpoint routes and resource lifecycles; this task installs typed provider dispatch only.
  B157-B166 own Python SDK facades, callable hooks and SDK module globals.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_services in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/bedrock_services_services.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_services.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Native S3 file support does not create the enterprise managed_files hook.
- A database alone cannot satisfy the managed batch runner guard.
budget:
  max_changed_lines: 625
  max_new_expects: 0
review_level: security
