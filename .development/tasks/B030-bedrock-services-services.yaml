checks:
  optional:
  - mutants
  commands:
  - id: case-files-upload-read
    why: Install B644 upload and B645 retrieve/content through B643 authorization and parsed file IDs. Assert configured
      bucket/prefix and credential identity, JSONL transformation, file ID/size metadata and byte content. Preserve
      per-operation access errors; uploads use local file bytes or already supplied multipart contents, not downloaded
      request URLs.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_files_upload_read$/)'
  - id: case-files-list-delete
    why: Install B646 list/delete with its actual prefix/list request and deletion response. Exercise distinct deployment
      credentials and foreign bucket rejection via B643/B2208. Do not expose legacy dead helper branches as new
      operations.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_files_list_delete$/)'
  - id: case-batch-create
    why: Install B649 native Bedrock batch creation with B647 input-record mapping and B648 output-file parsing,
      B650 request transformation and B651 transport. Preserve inputFile/outputS3Uri model invocation fields, signing
      and caller-provided native job identifiers; errors retain the leaf response. This is the open-source Bedrock
      service path, not the enterprise managed batch runner.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_batch_create$/)'
  - id: case-batch-retrieve-list-cancel
    why: Drive native B649 retrieve/list/cancel and B651 transport, including status mapping, output file conversion,
      pagination and cancellation behavior. The operation enum must call the leaves, not return fixture tags. Keep
      public batch listing and runner choice with B1051/B1133/B1112.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_batch_retrieve_list_cancel$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_services.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_services*")"
      && grep -lq 'bedrock_services_services' tools/oracle/fuzz/corpus/helper_case/bedrock_services_services* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_services$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-installed-service-families
    why: Exercise B680 agents/Claude Platform and B681 Responses/passthrough/search/vector/realtime through the
      same closed dispatcher. Existing model resolution B174 and parameter mapping B175 run at the caller boundary;
      leaf crates do not call the upper dispatcher.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_installed_service_families$/)'
  - id: case-native-s3-is-not-managed
    why: A configured native Bedrock S3 file/batch call uses only the installed open-source leaves and does not
      construct or register a managed_files hook. Preserve native operation availability even though enterprise-managed
      IDs/storage are unavailable. Proxy managed-hook errors are HTTP cases of B1031/B1032/B1033/B1034/B087 and
      B1050/B1051/B1133, not helper calls into FastAPI globals.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_native_s3_is_not_managed$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_secret_safe_failure$/)'
