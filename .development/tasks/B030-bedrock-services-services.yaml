id: B030
title: Bedrock service endpoint composition
description: >-
  Finish Bedrock service composition with managed S3 file and batch operations and model-resolution/parameter-pipeline
  wiring. B680 installs agents/Claude Platform and B681 installs Responses/passthrough/search/vector/realtime; depend
  directly on those composition parts and the file/batch leaves. Public routes and batch scheduling remain API-family
  work.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Implement crates/betterlite-provider/src/bedrock_services_dispatch.rs with adjacent tests under bedrock_services_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation bedrock_services_services in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_services_dispatch_cases in betterlite-provider with these exact named cases (one
  per oracle file): files_upload_read, files_list_delete, batch_create, batch_retrieve_list_cancel. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_services* using HelperCase:
  kind: helper and the externally tagged bedrock_services_services variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_services that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 145 production lines, 81 behavior/config-test lines, 101 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 352 planned, 400 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
scope:
  paths:
  - crates/betterlite-provider/Cargo.toml
  - crates/betterlite-provider/src/lib.rs
  - crates/betterlite-provider/src/error.rs
  - crates/betterlite-provider/src/bedrock_services_dispatch.rs
  - crates/betterlite-provider/src/bedrock_services_dispatch/**
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-provider/src/provider.rs
  - crates/betterlite-provider/src/operation.rs
  - crates/betterlite-provider/src/prepared.rs
  - crates/betterlite-core/src/dispatch.rs
  - crates/betterlite-core/src/operation.rs
  - crates/betterlite-core/Cargo.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_services_services.rs
  - tools/oracle/src/helpers/bedrock_services_services/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_services_services.py
  - tools/oracle/cases/helpers/providers/bedrock-services-services/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_services_services*
  - tools/oracle/cases/helpers/providers/bedrock-services/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9410-L9458
  why: ProviderConfigManager files and batches selections, distinct from the managed-ID codec.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/main.py#L1009-L1018
  why: Bedrock file-content dispatcher calls its handler.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L1066-L1070
  why: Bedrock batch cancellation dispatcher.
dod:
- text: 'files upload read: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services/files-upload-read.yaml.'
  proof:
  - case-files-upload-read
  - oracle
  - helper-python
- text: 'files list delete: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services/files-list-delete.yaml.'
  proof:
  - case-files-list-delete
  - oracle
  - helper-python
- text: 'batch create: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services/batch-create.yaml.'
  proof:
  - case-batch-create
  - oracle
  - helper-python
- text: >-
    batch retrieve list cancel: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services/batch-retrieve-list-cancel.yaml.
  proof:
  - case-batch-retrieve-list-cancel
  - oracle
  - helper-python
- text: New bedrock_services_services seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-files-upload-read
    why: The files-upload-read behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_files_upload_read$/)'
  - id: case-files-list-delete
    why: The files-list-delete behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_files_list_delete$/)'
  - id: case-batch-create
    why: The batch-create behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_batch_create$/)'
  - id: case-batch-retrieve-list-cancel
    why: The batch-retrieve-list-cancel behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_services_dispatch_cases::case_[0-9]+_batch_retrieve_list_cancel$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_services.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_services*")"
      && grep -lq 'bedrock_services_services' tools/oracle/fuzz/corpus/helper_case/bedrock_services_services* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_services$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/bedrock-services/files-upload-read.yaml
- tools/oracle/cases/helpers/providers/bedrock-services/files-list-delete.yaml
- tools/oracle/cases/helpers/providers/bedrock-services/batch-create.yaml
- tools/oracle/cases/helpers/providers/bedrock-services/batch-retrieve-list-cancel.yaml
deviations: []
out_of_scope:
- >-
  B080-B099 own public endpoint routes and resource lifecycles; this task installs typed provider dispatch only.
  B157-B166 own Python SDK facades, callable hooks and SDK module globals.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Keep configured S3/gateway/workspace authorization at the leaf boundary and test every operation family through
  executable dispatch.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: standard
