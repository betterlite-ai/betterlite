id: B724
title: Team row decoding and advisory-locked roster reads
description: >-
  Implement betterlite-db::team_repository for the live TeamRepository constructor, _db, table,
  model_class, _to_model, get_members_with_roles_locked, find_by_id and find_by_organization_id,
  with _PrismaClientView db/writer_db and the live team-table protocol. B700 supplies base operations
  and record_to_dict, B714 selects the supplied database handle, and B859 owns TeamTable/Member
  validation. Include _JSON_ENCODED_TEAM_FIELDS and _MEMBERS_WITH_ROLES_ADAPTER behavior.
  No team creation, archive, deletion or roster mutation operation is implemented by these ranges.

  use_writer defaults false: _db returns client.db, true returns writer_db. table is exactly
  litellm_teamtable on that handle. find_by_id defaults its key column to team_id and delegates to
  B700. find_by_organization_id uses an exact organization_id filter, converts the returned rows
  through _to_model_list and imposes no sort, limit or normalization. Raw table actions expose
  stored fields without invoking _to_model. Missing-client/query/validation failures propagate and
  do not acquire an HTTP status here.

  _to_model(None) returns None. Otherwise form a new mapping from B700 record_to_dict and
  JSON-decode string values only for metadata, model_spend, model_max_budget, router_settings,
  budget_limits and members_with_roles. Decode each once in the input mapping's iteration order.
  A malformed string raises the JSON error immediately, before B859 TeamTable validation; no
  warning or empty-object fallback occurs. Other value shapes pass to B859 unchanged, and the
  original mapping is not mutated. Then invoke TeamTable's own validator, whose different field
  set matters: doubly encoded metadata/model_max_budget/router_settings/budget_limits can receive
  a second parse, while model_spend/members_with_roles cannot. aliases/config/permissions/
  model_aliases are not parsed here but B859 may validate their string text before ignoring them.
  Null/empty-dict roster behavior in a full team is B859's, not the locked reader's shortcut below.

  get_members_with_roles_locked uses the explicit transaction argument, never a new pool connection
  or the repository's selected db handle. Its caller must already hold TEAM_ADVISORY_LOCK_SQL for
  this team on that transaction; B819 owns that lock statement and management callers acquire it.
  This method does not acquire or verify an advisory lock. Execute exactly the parameterized plain
  SELECT members_with_roles FROM "LiteLLM_TeamTable" WHERE team_id=$1. Do not add FOR UPDATE:
  access-group endpoints acquire group/row locks in an order that can deadlock a team-row-first read.
  The advisory lock is the caller's serialization mechanism and must cover its subsequent writes.

  No rows means None (team disappeared), distinct from an existing team with no members. For the
  first row, JSON-decode members_with_roles only if it is a string; a missing column or invalid
  JSON propagates. Any falsey parsed value returns [], including SQL/JSON null, false, numeric
  zero, empty dict, empty list and a decoded empty string. A raw empty string is invalid JSON and
  raises. Any truthy value is validated as list[Member] through B859: preserve list order/duplicate
  identities, require each role and member identity, and reject a nonempty dict/scalar/string or
  malformed member. Do not silently drop a bad member or return None for malformed data. Unlike a
  full TeamTable, this reader does not inspect any budget/metadata field. It performs no write,
  cache invalidation, warning or archive action.

  B860 Postgres tests use POSTGRES_TEST_URL or testcontainers, with setup failures fatal. Prove
  the explicit transaction sees its own uncommitted changes, the missing-versus-empty distinction,
  and serial re-read under caller-held advisory locks with two transactions. A separate row-lock
  holder must not block this plain SELECT. Do not imply protection against writers that ignore the
  advisory-lock protocol. Query/validation failure must leave all rows unchanged. The pure
  _to_model adapter alone enters B856's team_repository helper and B171's envelope corpus; a
  locked database read is never a mocked Python helper operation.

  Expose decode_team_record for the six external stored-string fields and decode_locked_roster for
  the single roster field. Register one team_record fuzz target in B2307's workspace that exercises
  both production entry points, including B859's second-stage validator. Bound each new JSON
  decode at 1048576 bytes/depth 64, returning typed limit errors before falsey conversion. Seed all
  six fields, falsey/truthy scalars, duplicate members, invalid roles, truncation and limit boundaries.
  Pruning the unused convenience paths leaves about 70 nonblank noncomment lines including field
  constants/protocols. Budget 100 native code, 240 behavior/Postgres tests, 60 helper adapters,
  45 decoder/fuzz and 30 wiring, 475 within 550; split parsing and query modules below 300 lines.
scope:
  paths:
    - crates/betterlite-db/src/team_repository.rs
    - crates/betterlite-db/src/team_repository/**
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/team_record.rs
    - crates/betterlite-db/fuzz/corpus/team_record/**
    - tools/oracle/src/helpers/db/team_repository.rs
    - tools/oracle/src/helpers/db/team_repository/**
    - tools/oracle/helpers/team_repository.py
    - tools/oracle/helpers/team_repository/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/team-repository/**
    - tools/oracle/fuzz/corpus/helper_case/team-repository-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/team_repository.py#L69-L122
    why: Read/write handle selection and the six-field repository JSON prepass.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/team_repository.py#L124-L152
    why: Advisory-lock precondition, plain SELECT, absent/falsey/malformed roster paths and team-id default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/team_repository.py#L161-L164
    why: The live exact organization-id list query and row conversion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/team_endpoints.py#L2980-L3014
    why: Caller acquires B819's advisory lock and keeps subsequent member writes on the same transaction.
dod:
  - text: 'Pure row cases name absent_team_record, six_team_json_fields,
      malformed_json_fails_before_model_validation, input_mapping_unchanged,
      second_model_parse_only_for_overlapping_fields, unlisted_model_extras_reach_validator,
      full_team_null_vs_empty_dict_roster and raw_table_fields_bypass_conversion.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Query cases name default_db_and_explicit_writer, team_id_default_and_missing_row,
      organization_id_exact_filter_and_all_rows, postgres_roster_explicit_transaction,
      missing_team_none_existing_empty_team_list, locked_roster_all_falsey_values,
      raw_empty_string_and_malformed_json_fail, truthy_nonlist_and_invalid_member_fail,
      roster_order_and_duplicates_retained, postgres_caller_advisory_lock_serializes_reread,
      postgres_plain_roster_select_avoids_row_lock and query_error_does_not_write.
      Native tests native_team_record_limits and native_locked_roster_limits prove both decoder
      caps; replays_the_team_record_corpus exercises the production functions.'
    proof: [behavior-tests, postgres-tests, parser-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Roster falsey handling and the two JSON-validation stages need distinct checks.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^team_repository::tests::/) - test(replays_the_team_record_corpus)'
    - id: helper-python
      why: The adapter must call pure _to_model and must not simulate a locked database operation.
      run: test -f tools/oracle/helpers/team_repository.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Require new team_repository seeds in the shared typed envelope corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/team-repository-*")" && grep -rlq team_repository tools/oracle/fuzz/corpus/helper_case/team-repository-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Explicit-transaction visibility and the absence of a row lock require real concurrent sessions.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/team_repository::tests::postgres_roster_explicit_transaction$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/team_repository::tests::postgres_caller_advisory_lock_serializes_reread$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/team_repository::tests::postgres_plain_roster_select_avoids_row_lock$/)'
    - id: parser-corpus
      why: Both stored-team and locked-roster decoders must replay hostile input through production code.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/team_record.rs && grep -q team_record crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/team_record)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_team_record_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/team-repository/six-json-fields.yaml
  - tools/oracle/cases/helpers/team-repository/two-stage-model-validation.yaml
deviations:
  - what: Stored team/roster JSON above 1048576 bytes or depth 64 returns a typed decode-limit error.
    why: Bound both newly exposed parsers; native_team_record_limits and native_locked_roster_limits prove this before any falsey roster shortcut.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/team_repository.py#L112-L149
out_of_scope:
  - find_by_alias, find_by_member, find_by_admin, create_team, update_team, delete_team,
    _build_archive_data, update_spend, add_member, remove_member, add_admin, remove_admin,
    add_models and remove_models have no live caller at the pin; do not add their convenience workflows.
  - _TeamArrays, _team_arrays, deleted_table, _TeamTables.litellm_deletedteamtable,
    _TeamTransactionManager and _PrismaTeamDb.tx are used only by those uncalled methods.
    B726 owns the live DeletedTeamRepository and B811 owns team archive/deletion policy.
  - B819 owns TEAM_ADVISORY_LOCK_SQL; B808/B809/B1207 and bulk-user callers acquire the lock
    before calling this repository. This read does not depend on those higher-level workflows.
pitfalls:
  - 'The oracle helper for this task is pre-registered as team_repository in the db group. Replace the stub Op in tools/oracle/src/helpers/db/team_repository.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/team_repository.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - FOR UPDATE is deliberately absent because the caller's advisory lock serializes roster changes without reversing access-group row-lock order.
  - JSON false and zero yield an empty locked roster, while malformed JSON still raises.
  - Repository decoding followed by the model validator can parse overlapping JSON-string fields twice.
budget:
  max_changed_lines: 550
  max_new_expects: 0
review_level: security
