id: B724
title: Team repository and atomic roster writes
description: >-
  Implement TeamRepository with writer-pinned locked roster reads, typed JSON arrays, create/update omissions,
  archive and deletion. Keep member/admin/model list operation ordering and exact archive columns. Concurrent
  roster updates must not overwrite an unrelated committed membership.


  Build the production team_repository module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/team_repository.py:
  _TeamArrays.members (L30-L30; 1 source lines), _TeamArrays.admins (L33-L33; 1 source lines), _TeamArrays.models
  (L36-L36; 1 source lines), _team_arrays (L39-L41; 3 source lines), _TeamTables.litellm_teamtable (L48-L48;
  1 source lines), _TeamTables.litellm_deletedteamtable (L51-L51; 1 source lines), _TeamTransactionManager.__aenter__
  (L55-L55; 1 source lines), _TeamTransactionManager.__aexit__ (L57-L62; 6 source lines), _PrismaTeamDb.tx
  (L66-L66; 1 source lines), _PrismaClientView.db (L71-L71; 1 source lines), _PrismaClientView.writer_db
  (L74-L74; 1 source lines), TeamRepository.__init__ (L91-L93; 3 source lines), TeamRepository._db (L96-L98;
  3 source lines), TeamRepository.table (L101-L102; 2 source lines), TeamRepository.deleted_table (L105-L106;
  2 source lines), TeamRepository.model_class (L109-L110; 2 source lines), TeamRepository._to_model (L112-L122;
  9 source lines), TeamRepository.get_members_with_roles_locked (L124-L149; 24 source lines), TeamRepository.find_by_id
  (L151-L152; 2 source lines), TeamRepository.find_by_alias (L154-L159; 6 source lines), TeamRepository.find_by_organization_id
  (L161-L164; 4 source lines), TeamRepository.find_by_member (L166-L169; 4 source lines), TeamRepository.find_by_admin
  (L171-L174; 4 source lines), TeamRepository.create_team (L176-L225; 49 source lines), TeamRepository.update_team
  (L227-L279; 52 source lines), TeamRepository.delete_team (L281-L306; 22 source lines), TeamRepository._build_archive_data
  (L308-L352; 45 source lines), TeamRepository.update_spend (L354-L356; 3 source lines), TeamRepository.add_member
  (L358-L367; 9 source lines), TeamRepository.remove_member (L369-L381; 11 source lines), TeamRepository.add_admin
  (L383-L392; 9 source lines), TeamRepository.remove_admin (L394-L406; 11 source lines), TeamRepository.add_models
  (L408-L417; 9 source lines), TeamRepository.remove_models (L419-L431; 11 source lines).


  Add the team_repository operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a team-repository-*
  seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 314 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  314 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 563 changed lines estimated within a 575-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
