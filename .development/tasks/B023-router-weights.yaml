id: B023
title: Scoped router weights validation and application
description: 'Finish router settings compatibility with typed scoped weights and reference validation
  in B055/B057 key/team writes and B066 config updates. Call B2301 for deployment reference validation
  against stored and configured entries, respecting authenticated team scope and canonical public model
  names. Apply the validated effective weights through B008''s existing simple-shuffle input and strip
  internal routing controls before provider dispatch. Do not rewrite the weighted-choice algorithm or
  add an endpoint absent from the pin. Fuzz the weights payload parser and seed the config and management
  corpora. Configuration boundary keys introduced or consumed here: weights. Pinned declaration defaults:
  weights=None. Resolve env values once in betterlite-config, never in router code. Implement the owned
  native service in crates/betterlite-server/src/router_weights.rs. Add ProbeOperation::RouterWeights in tools/oracle/src/router_probes/mod.rs
  and the corresponding B023 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. B2301 owns every function and structural type in
  litellm/proxy/management_endpoints/router_weights.py; call its completed validator, which is also
  available to B804 without depending on this composition task. Bound the weights outside-byte parser
  to 1048576 bytes before decoding; on excess use
  its typed invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback
  path).'
