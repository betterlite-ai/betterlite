deviations:
- what: The weights byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/router_weights.py#L67-L129
out_of_scope:
- Key/team CRUD from scratch.
- Settings endpoints already delivered by B348.
pitfalls:
- router_weights.py is a validation helper used by other APIs, not a standalone /router/weights route.
- A database-backed deployment missing from storage cannot be resurrected from stale router memory.
- B008 remains the sole implementation of weighted selection.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
