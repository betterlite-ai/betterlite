  - tools/oracle/cases/mcp-search/semantic-ranking.yaml
  - tools/oracle/cases/mcp-search/core-tools-first.yaml
  - tools/oracle/cases/mcp-search/tool-identity.yaml
  - tools/oracle/cases/mcp-search/empty-query.yaml
budget:
  max_changed_lines: 1000
  max_new_expects: 0
