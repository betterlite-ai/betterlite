id: B225
title: Anthropic user blocks and system projection
description: >-
  Implement The prelude/user-side content conversion of anthropic_messages_pt through the user-message run, as a
  typed user-block builder; also get_system_prompt (2856-2866). The Python adapter calls anthropic_messages_pt with
  user-only fixtures and projects the same output; no invented Python function is compared. All functions are pure
  and bounded, use injected policy and preserve source values. Budget 280 transforms/types, 110 adapters, 300 tests
  and 60 wiring (750 total). Write the behavior rstest functions anthropic_user_blocks_behavior_tests_behavior in adjacent tests.rs
  files, with a named case for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation anthropic_user_blocks is already registered;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/anthropic_user_blocks.rs
  - crates/betterlite-prompts/src/anthropic_user_blocks/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/prompts/anthropic_user_blocks.rs
  - tools/oracle/src/helpers/prompts/anthropic_user_blocks/**
  - tools/oracle/helpers/anthropic_user_blocks.py
  - tools/oracle/helpers/anthropic_user_blocks/**
  - tools/oracle/cases/helpers/anthropic-user-blocks/**
  - "tools/oracle/fuzz/corpus/helper_case/anthropic_user_blocks-*"
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L2345-L2509
  why: Exact function/branch ownership.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L2856-L2866
  why: System prompt extraction.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::anthropic_user_blocks_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_user_blocks-*")" &&
      grep -lq 'anthropic_user_blocks' tools/oracle/fuzz/corpus/helper_case/anthropic_user_blocks-* && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/anthropic-user-blocks/user-text.yaml
- tools/oracle/cases/helpers/anthropic-user-blocks/user-image.yaml
- tools/oracle/cases/helpers/anthropic-user-blocks/user-document.yaml
- tools/oracle/cases/helpers/anthropic-user-blocks/tool-user-run.yaml
- tools/oracle/cases/helpers/anthropic-user-blocks/empty-user.yaml
- tools/oracle/cases/helpers/anthropic-user-blocks/system-prompt.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B180 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'Name every corpus seed tools/oracle/fuzz/corpus/helper_case/anthropic_user_blocks-<case>.yaml. The rest of that folder belongs to other tasks.'
- 'The oracle helper for this task is pre-registered as anthropic_user_blocks in the prompts group. Replace the stub Op in tools/oracle/src/helpers/prompts/anthropic_user_blocks.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_user_blocks.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
