      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/otlp-normalization)" && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && grep -rlq 'otlp_truncate' tools/oracle/fuzz/corpus/helper_case && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^otlp_truncate_helper/)'
    - id: otlp-payload-elision-helper
      why: the _truncate_payload oracle helper case or corpus is missing, or replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/otlp-normalization)" && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && grep -rlq 'otlp_elision' tools/oracle/fuzz/corpus/helper_case && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^otlp_elision_helper/)'
    - id: otlp-content-text-helper
      why: the content_text oracle helper case or corpus is missing, or replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/otlp-normalization)" && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && grep -rlq 'otlp_content_text' tools/oracle/fuzz/corpus/helper_case && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^otlp_content_text_helper/)'
    - id: otlp-ui-content-helper
      why: the to_ui_content oracle helper case or corpus is missing, or replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/otlp-normalization)" && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && grep -rlq 'otlp_ui_content' tools/oracle/fuzz/corpus/helper_case && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^otlp_ui_content_helper/)'
    - id: otlp-response-encoding-helper
      why: the encode_otlp_response oracle helper case or corpus is missing, or replay fails
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/otlp-normalization)" && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && grep -rlq 'otlp_response_encoding' tools/oracle/fuzz/corpus/helper_case && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^otlp_response_encoding_helper/)'
    - id: helper-case-corpus
