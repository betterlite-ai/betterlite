id: B3865
title: OTLP ingest normalization and trace response types
description: >-
  Normalize OTLP payloads into bounded span rows and build the trace response type family. The decoder accepts gzip and identity content encodings and invokes a native codec to parse spans; it normalizes their fields, truncates oversized attributes and message arrays to fit storage, and stamps each span into a SpanRow. Build the message content type algebra so span input/output renders as chat messages, field/value pairs or plain text. Provide OTLP-conformant responses with the correct media type and protobuf or JSON error bodies.

  Owned functions cover message parsing (ChatRole constants and content_text), span-row construction from normalized spans (_span_row with truncation and timestamp handling), attribute value truncation (_truncate for the 64KB limit), message array elision with the newest messages kept (_truncate_payload, _newest_that_fit, _elided), content encoding dispatch (gzip with bounds checks), OTLP response encoding (native protobuf or JSON), and the trace/span/agent tree record types (Span, SpanRow, TraceSummary, Trace, TraceScope, AgentNode, TracePage, SpanDetail, SpendLogRecord and error page).

  Tests snapshot the decode behavior on valid and oversized attributes, gzip boundaries, malformed payloads and message-array elision. A fuzz target feeds the decoder arbitrary bytes, seeded with OTLP fixtures. Oracle helpers validate truncation, role mapping, content parsing and response encoding against LiteLLM at the pinned commit.

