    why: Payload decoding, truncation, encoding of OTLP responses and span-row construction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/tracing/messages.py#L8-L39
    why: ChatRole type and role mapping; content_text projection for message blocks.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/tracing/ui_format.py#L13-L158
    why: UI format records and conversion to messages, fields or text.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/tracing/types.py#L19-L175
    why: SpanType, SpanStatus, Span, AgentNode, TraceSummary, Trace, SpanRow and error page types.
  - url: https://docs.rs/gzip/latest/gzip/
    why: Decoding gzip content encoding.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py
    why: OTLP_MAX_ATTRIBUTE_VALUE_BYTES and OTLP_MAX_BODY_BYTES limits.

dod:
  - text: Gzip decoding rejects bodies larger than OTLP_MAX_BODY_BYTES before decompression and after.
    proof: [otlp-decode-tests]
  - text: Attribute values over 64KB (65536 bytes) are truncated with an ellipsis marker showing byte count.
    proof: [otlp-decode-tests, otlp-truncation-helper]
  - text: Message arrays keep the first message, an elision marker and the newest trailing messages that fit the 64KB (65536-byte) limit, or a shortened first and last if nothing else fits.
    proof: [otlp-decode-tests, otlp-payload-elision-helper]
  - text: Attribute truncation in SpanRow uses only consumed_attributes, excluding the rest even if oversized.
    proof: [otlp-decode-tests]
  - text: Content encoding "identity" and missing encoding both return the body unchanged; "gzip" decompresses; others raise InvalidOTLPPayloadError.
    proof: [otlp-decode-tests]
  - text: >-
      OTLP response with media type application/json and no error returns empty JSON object;
      with error returns `{"message": error_text}`.
    proof: [otlp-response-tests]
  - text: OTLP response with media type application/x-protobuf and no error returns empty bytes; with error returns native_encode_error output.
    proof: [otlp-response-tests]
  - text: Message content_text from Responses-style blocks keeps only text blocks; returns JSON for mixed content.
    proof: [message-content-tests]
  - text: UIContent conversion handles chat messages, key/value fields and plain text, respecting message roles (system, user, assistant, tool) and tool call structure.
    proof: [ui-format-tests]
  - text: Oversized OTLP payloads (body > max) raise OTLPPayloadTooLargeError; malformed JSON raises InvalidOTLPPayloadError; gzip decode errors raise InvalidOTLPPayloadError.
    proof: [otlp-error-tests]
  - text: A fuzz target at crates/betterlite-logging/fuzz/fuzz_targets/otlp_decode.rs feeds arbitrary bytes to decode_otlp and replays_the_otlp_decode_corpus loads every file in its corpus without panic.
    proof: [otlp-fuzz-corpus]
  - text: Oracle helper for _truncate validates truncation to the OTLP_MAX_ATTRIBUTE_VALUE_BYTES limit (64KB) against LiteLLM's implementation.
    proof: [otlp-truncation-helper]
  - text: Oracle helper for _truncate_payload validates message array elision behavior against LiteLLM's payload truncation.
    proof: [otlp-payload-elision-helper]
  - text: Oracle helper for content_text validates ChatRole mapping and message content extraction against LiteLLM's implementation.
    proof: [otlp-content-text-helper]
  - text: Oracle helper for to_ui_content validates conversion to chat messages, fields and text against LiteLLM's UI formatting.
    proof: [otlp-ui-content-helper]
  - text: Oracle helper for encode_otlp_response validates response encoding dispatch (JSON and protobuf) against LiteLLM's implementation.
    proof: [otlp-response-encoding-helper]
  - text: Every mutant in truncation, role mapping, content parsing and response encoding is caught by a test.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: otlp-fuzz-corpus
      why: the OTLP decode fuzz target or corpus is missing, or replaying the corpus fails
      run: test -f crates/betterlite-logging/fuzz/fuzz_targets/otlp_decode.rs && test "$(ls crates/betterlite-logging/fuzz/corpus/otlp_decode | wc -l)" -ge 5 && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(replays_the_otlp_decode_corpus)'
    - id: otlp-decode-tests
      why: decode behavior tests fail, do not exist, or snapshots were not accepted
      run: INSTA_UPDATE=no cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otlp_normalize::/)'
    - id: otlp-response-tests
      why: OTLP response encoding tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otlp_response::/)'
    - id: message-content-tests
      why: message content extraction tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^message_content::/)'
    - id: ui-format-tests
      why: UI format conversion tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^ui_content::/)'
    - id: otlp-error-tests
      why: error handling tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otlp_errors::/)'
    - id: helper-python
      why: the oracle adapters fail strict Python checks
      run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: otlp-truncation-helper
