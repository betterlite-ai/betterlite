deviations:
  - what: Oversized OTLP payloads raise OTLPPayloadTooLargeError instead of silently dropping them.
    why: LiteLLM silently ignores payloads larger than the limit; betterlite fails loudly so operators see the breach instead of missing traces.
  - what: Message array elision prioritizes the first message and newest trailing messages; LiteLLM's behavior is identical in this task's pinned version.
    why: Preserving message context for the operator's debugging while fitting storage constraints.

out_of_scope:
  - Storage of span rows or spend records; B3866 owns that port.
  - Native OTLP decode and error encoding; supplied through the native codec boundary (G2).
  - Projection of AgentNode, TracePage, and SpanDetail from stored span rows; B3866 uses these types to build trace/query records and agent trees.
  - Langfuse root span input/output specialization; B110 owns that override.
  - HTTP request/response handling and auth; B3867 owns the ingest route.

pitfalls:
  - 'The oracle helper for this task is pre-registered as otlp_normalization in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/otlp_normalization.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/otlp_normalization.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - "OTLP_MAX_ATTRIBUTE_VALUE_BYTES and OTLP_MAX_BODY_BYTES come from litellm.constants, not local defaults. Use them as the exact thresholds."
  - "Message array truncation calculates escape overhead (up to 6 bytes per character for JSON encoding). If content is cut, the overflow marker itself counts toward the 64KB (65536-byte) limit."
  - "Role mapping includes LangChain types (human→user, ai→assistant) alongside OpenAI roles. Anything unmapped defaults to user for no tool calls, assistant if the message has tool_calls."
  - "content_text from a Responses block list returns only text content; mixed content (reasoning blocks, tool calls) returns JSON. This preserves readability in the UI."
  - "gzip decompression reads past OTLP_MAX_BODY_BYTES as a check; the exception message names the limit."
  - "The native codec raises OverflowError for payload size and ValueError for malformed content; both wrap into user-facing OTLP errors."
  - "Invalid UTF-8 in attribute values decodes with the ignore strategy, not replace. Truncation keeps only the valid prefix."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 2
