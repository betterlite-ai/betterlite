id: B3692
title: Content category loading and inherited severity policy
description: >-
  Build category decoding, file resolution, conditional inheritance and severity selection over B3691's data roots.
  CategoryConfig holds a single loaded category: its name, description, default action, keywords with severity levels, exceptions, identifier words (for conditional matching), always-block keywords, inherited category names, additional block words, and phrase patterns. The constructor lowercases exceptions, identifier words and block words, compiles phrase patterns to regex, and logs warnings for invalid patterns.
  _load_categories iterates over a list of ContentFilterCategoryConfig records, skips disabled categories, resolves the category file path (custom or default), and loads the category file to build CategoryConfig objects. It validates category_name against the regex `^[a-zA-Z0-9_\-]+$` (preventing path traversal) and warns-and-skips if category_name is missing, not a string, or invalid. It adds keywords to the category_keywords map if their severity meets the configured threshold, adds always_block_keywords to a separate always_block_category_keywords map, and invokes _load_conditional_category for categories with identifier words and either inherited categories or additional block words.
  _load_conditional_category assembles block_words from inherited categories (extracted from their keywords that meet the threshold) plus additional_block_words, then stores the conditional category as identifier_words plus block_words plus action plus severity (always high).
  _load_category_file dispatches to _load_category_file_json for .json files or _read_category_yaml for YAML. It returns a CategoryConfig. YAML files default default_action to "BLOCK" when omitted. It returns a CategoryConfig.
  _read_category_yaml loads and returns the YAML dict as a CategoryFileData TypedDict.
  _load_category_file_json loads the harm_toxic_abuse-style JSON format (list of {id, match (pipe-separated phrases), tags, severity (1-4)}), deduplicates phrases, maps severity 4,3 to high, 2 to medium, 1 to low, and builds keywords from pipe-separated match phrases. Missing or non-integer severity defaults to 2 (medium).
  _should_apply_severity returns true if the given severity (low, medium, high) meets or exceeds the threshold.
  _category_config_view extracts the enabled, action, category_file and category keys from a ContentFilterCategoryConfig dict.
  _resolve_category_file_path returns a file path jailed to DATA_ROOTS unless LITELLM_CONTENT_FILTER_ALLOW_EXTERNAL_PATHS=true. For relative paths it tries suffixes under each root (bundled first) until a file exists. For absolute paths or existing files, it jails them unless allowed. If nothing matches and external paths are disallowed, it raises ValueError for paths that escape the roots.
  _assert_within_data_roots raises ValueError if a path is not inside any of the named roots.
  Dependencies on B3690: construct CategoryFileData and consume ContentFilterCategoryConfig/conditional records. Dependencies on B3691: _load_categories and _load_conditional_category call find_category_file. Dependencies on B002: extend the config loader to support LITELLM_CONTENT_FILTER_ALLOW_EXTERNAL_PATHS. Unresolved: path_utils.is_within and path_utils.try_safe_join.
