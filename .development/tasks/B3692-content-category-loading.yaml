dod:
  - text: CategoryConfig constructor loads from a CategoryFileData TypedDict, lowercases exceptions and word lists, and compiles phrase patterns to regex with warning-and-skip on invalid patterns.
    proof: [category-config-tests]
  - text: _load_categories validates category_name against regex `^[a-zA-Z0-9_\-]+$` and warns-and-skips when category_name is missing, not a string, or fails validation. It iterates categories, skips disabled ones, resolves file paths correctly, and loads each category file. Keywords and always_block_keywords are added to their respective maps only if their severity meets the threshold.
    proof: [category-load-tests]
  - text: _load_conditional_category extracts block_words from inherited categories (keywords that meet the severity threshold) plus additional_block_words, then stores the prepared conditional category record.
    proof: [conditional-load-tests]
  - text: _load_category_file dispatches to _load_category_file_json for .json files and _read_category_yaml for YAML files. YAML files default default_action to "BLOCK" when the YAML omits it.
    proof: [category-file-tests]
  - text: _load_category_file_json deduplicates phrases, maps severity 4-3 to high, 2 to medium, 1 to low, defaults missing or non-integer severity to 2 (medium), and builds keywords from pipe-separated match phrases.
    proof: [category-file-tests]
  - text: _should_apply_severity correctly compares severity levels against a threshold (low, medium, high).
    proof: [severity-tests]
  - text: _resolve_category_file_path jails paths to DATA_ROOTS unless LITELLM_CONTENT_FILTER_ALLOW_EXTERNAL_PATHS=true. For relative paths it tries suffixes under each root. For absolute/existing paths it checks the jail. On failure it raises ValueError.
    proof: [path-resolution-tests]
  - text: _assert_within_data_roots raises ValueError if a path escapes every named root.
    proof: [path-assertion-tests]
  - text: Warning-and-skip behavior is preserved when loading fails; partial updates before later errors are written.
    proof: [partial-update-tests]
