out_of_scope:
  - Final constructor calls to build ContentFilterGuardrail or other guardrails. This task only builds the loaded CategoryConfig records.
  - Request routing or guardrail invocation. This task loads configurations, not routes requests.
  - Pattern matching and keyword detection. B3693, B3694 and B3695 handle the evaluation side.
pitfalls:
  - "Category name validation: _load_categories must reject category names that are missing, not a string, or fail the regex `^[a-zA-Z0-9_\\-]+$` (prevents path traversal like \"../../etc/passwd\"). Warn and skip on all three cases, do not fail the entire load."
  - "JSON phrase deduplication: keep track of seen phrases to avoid inserting the same phrase twice. A set of lowercase phrases prevents duplicates across items."
  - "Inherited category resolution: find_category_file must be called with the inherited category name (with extensions removed), and severity filtering must apply to inherited keywords the same way it applies to local keywords."
  - "Path jailing with try_safe_join: the function returns None if a path escapes the root. When no file exists under any root, raise ValueError to reject attempted path traversal, never silently fall back to an unsafe path."
  - "LITELLM_CONTENT_FILTER_ALLOW_EXTERNAL_PATHS=true bypasses all jailing. In untrusted environments this is a security issue; preserve the warning log."
  - "Phrase pattern compilation: catch re.error and log a warning, then skip the invalid pattern and continue loading the category."
  - "Severity order: low=0, medium=1, high=2. A threshold of \"medium\" means severity must be >= 1, so \"low\" items do not pass."
  - "JSON severity defaults: when a JSON item's severity is missing or not an integer, default to 2 (medium). YAML files default default_action to \"BLOCK\" when the key is omitted."
  - "CategoryConfig constructor must lowercase exceptions, identifier_words and additional_block_words. Lowercasing happens in __init__, not in _load_category_file."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
