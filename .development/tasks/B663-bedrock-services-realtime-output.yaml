  - id: case-assistant-content-start
    why: The assistant-content-start behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_output_cases::case_[0-9]+_assistant_content_start$/)'
  - id: case-generation-stage
    why: The generation-stage behavior is missing or differs from its pinned fixture.
