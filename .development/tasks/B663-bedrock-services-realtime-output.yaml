pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_realtime_output in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_realtime_output.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_realtime_output.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An empty response id and None both allocate a new id, but only None causes response.created to be emitted.
- SPECULATIVE user transcripts remain visible as deltas even though they are omitted from the final transcript buffer.
