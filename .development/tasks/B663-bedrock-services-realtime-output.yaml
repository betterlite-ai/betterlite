id: B663
title: Bedrock realtime content and audio output
description: >-
  Add NovaRealtimeOutput projection for content start, generation stage, speech start, user transcript, speculative/final
  text and audio chunks. Preserve OpenAI item/response ids and event ordering using session-local state; do not
  emit speculative transcript content twice.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/transformation.py:
  BedrockRealtimeConfig.transform_content_start_event L709-L820; BedrockRealtimeConfig._parse_generation_stage L823-L831;
  BedrockRealtimeConfig._current_user_item_id L833-L837; BedrockRealtimeConfig.transform_user_speech_event L839-L847;
  BedrockRealtimeConfig.transform_usage_event L849-L852; BedrockRealtimeConfig.transform_user_transcript_event L895-L907;
  BedrockRealtimeConfig.user_transcript_completed_events L909-L922; BedrockRealtimeConfig.transform_text_output_event
  L924-L964; BedrockRealtimeConfig.transform_audio_output_event L966-L999.


  Named case contracts: assistant_content_start: Role other than exact ASSISTANT emits no events and preserves passed
  response/item/conversation IDs,delta_typeNone. USER+TEXT additionally marks transcriptactive and parses generation
  stage. Other nonassistant roles/types do not reset old transcript state. ASSISTANT determines is_new_response
  only by current_response_id isNone, but allocates resp_/item_/conv_ UUID IDs for any falsey existing value. Thus
  an empty response id gets replaced without response.created. generation_stage: decode_generation_metadata parses
  additionalModelFields only if string; malformed/nondict JSON,absent/nonstring generationStage ->None silently.
  Return any string stage unchanged,includingempty; do not restrict to FINAL/SPECULATIVE enum here. user_speech_event:
  is_speech_start true emits input_audio_buffer.speech_started and forces new item_UUID; false emits speech_stopped
  with current item id,allocatingone if absent. Each has event_UUID and item_id only, no audio timestamps. Speech
  start does not clear existing transcriptbuffer in this helper. user_transcript_final: Every user transcript emits
  conversation.item.input_audio_transcription.delta,content_index0,shared itemid,event_UUID,delta exacttext. Append
  text to completionbuffer unless generation stage exact SPECULATIVE; lowercase speculative still appends. user_transcript_completed_events
  emits nothing for emptybuffer,otherwise one completed event with concatenated transcript and clearsbuffer while
  preserving itemid. speculative_text: SPECULATIVE user text is still emitted as delta, only excluded from completed
  transcript. Assistant transform_text_output_event itself performs no generation-stage suppression; dispatch policy
  belongs B665, so do not filter assistant deltas here. final_text: Read event.textOutput.content defaultempty;
  without truthy item AND response id return[] and original delta accumulator. Otherwise emit response.text.delta
  with indices0,event_UUID,ids,delta text includingempty; initialize accumulator only ifNone,append same event and
  returnit. No completion marker or text joining here. audio_output_delta: Read audioOutput.content defaultempty,requiretruthy
  item/responseids,emit response.audio.delta with indices0,event_UUID,ids,delta unchanged. No base64 decode or rate
  conversion, no text-accumulator mutation. item_id_consistency: User speech/transcript/completed calls share _user_item_id
  until new speech start forces it. Assistant ids are caller-supplied state, separate from user id. transform_usage_event
  stores the supplied cumulative BedrockUsageEvent replacing previous snapshot; it does not sum it or emit an event.
  assistant_event_order: ASSISTANT creates a response.created record (allocating its event UUID even when not emitted),
  emits it only for is_new_response; object realtime.response,status in_progress,output[],conversation_id. Always
  emit response.output_item.added output_index0,item id/object realtime.item,type message,status in_progress,roleassistant,content[].
  Then response.content_part.added content_index0/output_index0,event_UUID,item/response ids,part{text,text:empty}
  only for exact content typeTEXT,otherwise{type:audio,transcript:empty}. Missing type defaultsTEXT; repeated blocks
  repeat output-item/content-part additions.


  Implement crates/betterlite-bedrock/src/realtime_output.rs with adjacent tests under realtime_output/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_output_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): assistant_content_start, generation_stage, user_speech_event, user_transcript_final, speculative_text,
  final_text, audio_output_delta, item_id_consistency, assistant_event_order. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_output* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_output variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_output that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_generation_metadata consumes additionalModelFields JSON strings in Nova output in
  crates/betterlite-bedrock/src/realtime_output.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_realtime_output.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_realtime_output.
  The adjacent test replays_the_bedrock_services_realtime_output_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 212 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 300 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 755 planned, 775 maximum changed lines.
