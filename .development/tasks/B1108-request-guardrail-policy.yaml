checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_guardrail_policy::/)
      - test(/::replays_corpus$/)'
  - id: case-guardrail-policy-order
    why: the guardrail-policy-order behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_guardrail_policy::tests::guardrail_policy_order($|::)/)'
  - id: case-excluded-policy-diagnostic
    why: the excluded-policy-diagnostic behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_guardrail_policy::tests::excluded_policy_diagnostic($|::)/)'
  - id: case-empty-policy-selection
    why: the empty-policy-selection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::request_guardrail_policy::tests::empty_policy_selection($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/request_guardrail_policy.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/request_guardrail_policy-*)"
      && grep -qE "^[[:space:]]+request_guardrail_policy:" tools/oracle/fuzz/corpus/helper_case/request_guardrail_policy-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/request-guardrail-policy)"
