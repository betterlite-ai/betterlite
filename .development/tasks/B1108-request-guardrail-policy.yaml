id: B1108
title: Request guardrail selection
description: >-
  Resolve MIT guardrail metadata and policy selection with injected B104/B105 policy results; preserve override
  order and excluded-policy diagnostics without loading enterprise hooks.


  Implement crates/betterlite-core/src/api/request_guardrail_policy.rs. Use RequestGuardrailPolicyInput and RequestGuardrailPolicyResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions guardrail_policy_order, excluded_policy_diagnostic, empty_policy_selection
  under api::request_guardrail_policy::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RequestGuardrailPolicy in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {request_guardrail_policy: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/proxy/litellm_pre_call_utils.py: _add_guardrails_from_key_or_team_metadata (L2981-L3026);
  litellm/proxy/litellm_pre_call_utils.py: _add_guardrails_from_policies_in_metadata (L3029-L3134); litellm/proxy/litellm_pre_call_utils.py:
  add_guardrails_from_auth_metadata (L3137-L3156); litellm/proxy/litellm_pre_call_utils.py: move_guardrails_to_metadata
  (L3159-L3231); litellm/proxy/litellm_pre_call_utils.py: _is_policy_version_id (L3234-L3238); litellm/proxy/litellm_pre_call_utils.py:
  _extract_policy_id (L3241-L3247); litellm/proxy/litellm_pre_call_utils.py: _match_and_track_policies (L3250-L3311);
  litellm/proxy/litellm_pre_call_utils.py: _apply_resolved_guardrails_to_metadata (L3314-L3366); litellm/proxy/litellm_pre_call_utils.py:
  add_guardrails_from_policy_engine (L3369-L3475). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 320 owned nonblank/non-comment/non-docstring Python lines (376 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 340 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 554 total within the 560-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B732 (Typed authentication principals and grant resolution), B104 (Guardrail framework,
  registry and guardrail API), B105 (Built-in content filter, secret detection and prompt injection checks), B171
  (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B1102 (Request model and destination policy).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
