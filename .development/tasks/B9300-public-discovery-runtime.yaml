id: B9300
title: Native blog feed runtime
description: >-
  The public blog endpoint cannot call B4264's implementation: its fetch and cache
  live only in the oracle helper crate. B10163 moved the RSS parser that B4264 wrote
  and B5100 corrected into betterlite-server::public_endpoints::blog_feed_parser.
  Build the production BlogFeed in betterlite-server::public_endpoints::blog_feed on
  top of it. B077 consumes it when it mounts the public hubs; this task exports no
  HTTP router. Keep the gateway independent of oracle crates.

  The feed's settings come from B10009's config.sections.public_discovery:
  blog_posts_url (the configured key over LITELLM_BLOG_POSTS_URL, default
  https://docs.litellm.ai/blog/rss.xml) and local_blog_posts (LITELLM_LOCAL_BLOG_POSTS,
  default false). B10009 owns that section, its loader tests and its config seeds;
  this task reads no config key and parses no YAML itself.

  BlogPost, with title, description, date and url strings, is B10163's type in
  public_endpoints::blog_feed_parser; BlogPostsResponse with its posts list is built here.
  Bundle the pin's blog_posts.json in this module's assets directory. BlogFeed receives
  B173's ProxiedClient, resolved settings, a clock and a local-post source at construction.
  Parse with B10163's parse_rss_to_posts(text, 1, 64) and leave its module alone: it
  already keeps LiteLLM's item selection, ElementTree text, entity and CR/CRLF handling,
  date projection and whole-document validation, and B4264's and B5100's blog_feed
  oracle cases run through it. Validate the parsed collection as nonempty, warning
  when it is empty.

  fetch_rss_feed sends one asynchronous GET to the configured URL with a five-second
  timeout, no automatic retry and no redirect following, like httpx.get's defaults.
  It accepts only successful statuses and returns text for the parser. Set a 16 MiB
  decoded response cap and pass 64 as the parser's max_depth; the size failure and
  B10163's ParseFailure::TooDeep follow the existing warning-and-bundled-fallback path.
  All network reads use B173's bounded transport. The URL never comes from a public
  request. No lock spans a network await.

  get_blog_posts first checks local mode and loads the backup without touching the
  remote cache. Otherwise take the clock before fetching: return a cached successful
  list only when now minus last_fetch is strictly less than 3600 seconds. A backwards
  clock therefore keeps it valid. A successful fetch and nonempty parse replace the
  cached posts and timestamp with that pre-fetch time. Fetch, XML and empty-result
  failures warn and load the backup without replacing either cache field, so the
  next call retries. A failing backup load propagates to B077's endpoint-level
  fallback; do not convert it into an empty success. Cache state belongs to one
  server instance and is shared by its requests, never by two separately built apps.

  Native tests use a recording transport, injected clock and fallible local source
  for local_mode_skips_fetch, success_is_cached, expires_at_one_hour,
  timestamp_precedes_fetch, failed_refresh_keeps_cache, fallback_is_not_cached,
  deep_nesting_falls_back, backwards_clock_keeps_cache, backup_failure_propagates and
  independent_apps. Real loopback transport tests prove the five-second deadline,
  non-2xx and redirect handling, body cap and cancellation.

  This task adds no oracle case and no fuzz target: the parser is the only byte
  decoder on this path, and B10163 owns its cases, its blog_feed fuzz target and its
  corpus. Stateful cache and network behavior stays in native tests until B077's
  booted HTTP cases. The cited feed implementation has 85 nonblank noncomment lines
  excluding docstrings; with bounds, transport and native tests this stays near 600
  non-test lines.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/public_endpoints/blog_feed.rs
    - crates/betterlite-server/src/public_endpoints/blog_feed/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_blog_posts.py#L24-L160
    why: Native ownership of the records, local loader, HTTP fetch, validation, cache and wrapper; B4264/B5100 previously built only oracle-side versions, and B10163 owns the XML projection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/blog_posts.json#L1-L10
    why: Complete bundled backup, whose content is served when remote loading fails.
dod:
  - text: BlogFeed parses through B10163's parse_rss_to_posts with max_posts 1 and max_depth 64, so a document nested past 64 levels, malformed XML or an empty result warns and serves the bundled posts without touching the cache.
    proof: [behavior-tests]
  - text: Feed calls use the configured URL, five-second bounded transport, correct cache timestamp and TTL, and uncached warning fallback with propagated backup failures.
    proof: [behavior-tests, transport-tests]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Cache timing, fallback state or the parser limits differ from the pinned behavior and the deviation.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^public_endpoints::blog_feed::/) - test(/::transport::/)'
    - id: transport-tests
      why: Real requests retry, follow redirects, exceed their deadline or buffer unbounded RSS bytes.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^public_endpoints::blog_feed::tests::transport::/)'
oracle_cases: []
deviations:
  - what: RSS responses above 16 MiB or XML nested beyond 64 levels warn and serve the bundled posts.
    why: LiteLLM's synchronous whole-document parser has no corresponding input cap; public requests must not cause unbounded buffering or nesting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_blog_posts.py#L64-L75
out_of_scope:
  - B077 owns get_litellm_blog_posts, its final five-post slice, the endpoint-level fallback, hub metadata and HTTP composition; B3192 owns the separate autorouter preset cache.
  - B10163 owns parse_rss_to_posts, BlogPost, ParseFailure and the date parsing in public_endpoints::blog_feed_parser, the blog_feed cargo-fuzz target and its corpus, and the oracle helper's call into them; B4264 and B5100 keep their blog_feed oracle operation and cases.
  - B173 owns HTTP pooling and response limits; this task reuses them.
  - B10009 owns the public_discovery config section (blog_posts_url, LITELLM_LOCAL_BLOG_POSTS, public_mcp_servers, public_mcp_hub_strict_whitelist, public_model_groups_links and DOCS_TITLE), its loader tests and its config_yaml seeds; this task only reads its blog settings.
pitfalls:
  - The endpoint's five-post limit does not change the max_posts of one that get_blog_posts passes to parse_rss_to_posts.
  - A fallback must not overwrite the previous successful cache or last_fetch_time, even after that success has expired.
  - Cache validity uses the clock captured before the GET and the strict comparison against 3600, not completion time or an inclusive boundary.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
