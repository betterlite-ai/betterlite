id: B3365
title: Container retrieve and delete HTTP execution
description: >-
  Implement the container resource HTTP handlers in betterlite-core for retrieve and delete
  operations using decoded container IDs. Preserve logging before send, transport-error
  conversion before response transformation, and client deadline behavior. The retrieve
  handler accepts a container ID, optional headers and query additions, validates the
  provider environment, transforms the request through the provider config, logs the
  pre-call state, sends a GET without timeout argument (using the selected client's
  deadline), and transforms the response. The delete handler follows the same pattern
  with a DELETE request instead. Both handlers support sync and async execution through
  the same facade: the sync variant delegates to a separate async coroutine when
  _is_async=True, while the async implementation awaits. Clients default to a new httpx
  instance (sync or async per variant) when not supplied, selected by type checking.
  Both handlers catch transport exceptions and delegate error conversion to the shared
  _handle_error before raising. Response errors raise through raise_for_error_status
  before transformation.

