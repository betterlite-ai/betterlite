    why: Sync and async retrieve handlers, container ID handling, environment validation, logging, error handling and response transformation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L9229-L9306
