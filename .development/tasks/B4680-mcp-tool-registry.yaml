    - crates/betterlite-mcp/Cargo.toml
    - crates/betterlite-mcp/src/tool_registry.rs
    - crates/betterlite-mcp/src/tool_registry/**
    - crates/betterlite-config/src/sections/mcp_tools.rs
    - crates/betterlite-config/src/sections/mcp_tools/**
    - crates/betterlite-config/fuzz/Cargo.toml
    - crates/betterlite-config/fuzz/fuzz_targets/mcp_tools.rs
    - crates/betterlite-config/fuzz/corpus/mcp_tools/**
    - tools/oracle/cases/helpers/mcp-tool-registry/**
    - tools/oracle/fuzz/corpus/helper_case/mcp-tool-registry-*
    - tools/oracle/helpers/b4680.py
    - tools/oracle/helpers/b4680/**
    - tools/oracle/src/helpers/mcp/b4680.rs
    - tools/oracle/src/helpers/mcp/b4680/**
  lint_tables: false
