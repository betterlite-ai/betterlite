dod:
  - text: register_tool inserts or replaces by name and keeps the first position of a replaced name; get_tool returns the entry or None.
    proof: [registry-tests, oracle]
  - text: list_tools returns insertion order, and a None or empty prefix returns all tools while a non-empty prefix filters by starts-with.
    proof: [registry-tests, oracle]
  - text: unregister_tools_with_prefix removes the matching tools and returns the count, and an empty prefix removes nothing and returns 0.
    proof: [registry-tests, oracle]
  - text: to_sdk_tools gives name, description and inputSchema for each tool in the given order.
    proof: [registry-tests]
  - text: load_tools_from_config fails on a missing config and on a non-mapping entry with LiteLLM's messages, skips entries with a missing or empty name, description or handler, defaults input_schema to {}, warns and skips when the loader returns no handler, and fails when the loader fails.
    proof: [registry-tests, oracle]
  - text: The mcp_tools section reads name, description, input_schema and handler per entry, keeps non-mapping entries as NotAMapping, returns an empty list when the key is absent and rejects a top-level value that is not a list.
    proof: [config-section-tests]
  - text: The mcp_tools decoder has a cargo-fuzz target with a committed corpus that replays without a panic.
    proof: [mcp-tools-fuzz]
  - text: OpenApiToolHandler calls the wrapped tool with the call's arguments and context and keeps UpstreamAuth as ToolHandlerError::OpenApi.
    proof: [registry-tests]
  - text: The oracle helper adapter passes strict Python checks and its seeds replay.
    proof: [helper-python, helper-case-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: registry-tests
      why: the tool_registry behavior tests fail, do not exist, or the filter selects nothing
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^tool_registry::/)'
    - id: config-section-tests
      why: the mcp_tools section tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_tools::/) - test(replays_the_mcp_tools_corpus)'
    - id: registry-clippy
      why: clippy catches issues in the new module, the section and the fuzz target
      run: cargo clippy --locked -p betterlite-mcp -p betterlite-config --all-targets -- -D warnings
    - id: mcp-tools-fuzz
      why: the fuzz target, its added corpus or its replay test is missing or fails
      run: test -f crates/betterlite-config/fuzz/fuzz_targets/mcp_tools.rs && grep -q mcp_tools crates/betterlite-config/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/mcp_tools)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_mcp_tools_corpus)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4680.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-tool-registry-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/mcp-tool-registry/list-all.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/list-prefix.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/list-empty-prefix.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/unregister-prefix.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/unregister-empty-prefix.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/re-register-position.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/load-skips.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/load-defaults.yaml
  - tools/oracle/cases/helpers/mcp-tool-registry/load-errors.yaml
deviations:
  - what: The registry is a value passed through constructors, not the module-level global_mcp_tool_registry.
    why: The repository forbids module-level state. The methods and their results are the same.
  - what: A handler is a Rust ToolHandler, resolved by an injected ToolHandlerLoader, not a Python function imported from a dotted path.
    why: betterlite has no Python interpreter. B165 and B124 supply the real loader. Until then a `handler` string in `mcp_tools` fails startup with the loader's error, never a silent skip.
  - what: ToolHandler receives the per-request OpenApiCallContext as an argument, where LiteLLM's OpenAPI handlers read three ContextVars.
    why: Same reason as B4683. The values and their precedence do not change.
  - what: A top-level `mcp_tools` value that is not a list is a config error naming the key.
    why: LiteLLM would iterate whatever it got (a mapping yields its keys) and fail with the "list of dictionaries" message or a later error. A typed section cannot hold it.
  - what: to_sdk_tools cannot fail with "MCP SDK is not installed".
    why: That ImportError only exists because the Python SDK is optional.
out_of_scope:
  - "register_tools_from_openapi and its suffixing of colliding tool names (_2, _3, ...) in openapi_to_mcp_generator.py: B4683 left it out as having no caller, and the registry is not that caller. Only its own file calls it. The manager (mcp_server_manager.py:2745) does its own loop, names tools with openapi_tool_name plus the server prefix, and calls register_tool directly, so a name collision there replaces the earlier tool. This task keeps that replace behavior."
  - "ToolSchema, ListToolsResponse and ContentItem in litellm/types/mcp_server/tool_registry.py: no caller at the pin. CallToolRequest of that file is shadowed by the MCP SDK type that operations.py imports."
  - "get_instance_fn and the s3:// and gcs:// module loading: B124 and B165 own them and implement ToolHandlerLoader; B4143 owns the module download."
  - "Calling load_tools_from_config at startup (proxy_server.py:7046): B124 remaining work."
  - "The call paths that read the registry (operations.py _handle_local_mcp_tool, the managed OpenAPI handler at mcp_server_manager.py:5732), the 404 for an unknown tool, the 'Error: ...' result for a failing handler and handler_outcome (str(value) as text): B136 manager parts. They call get_tool and ToolHandler::call."
  - "Building OpenApiTool values, prefixed tool names, the registry key and the tool_name_to_mcp_server_name_mapping: B4683 and the B136 manager parts."
pitfalls:
  - >-
    Replacing a tool with the same name keeps its first slot. With an IndexMap use insert, not shift_remove then insert, or the list order changes.
  - >-
    unregister_tools_with_prefix("") returns 0 and removes nothing, while list_tools(Some("")) returns everything. The two empty-prefix rules are opposites, so test both.
  - >-
    The prefix filter is a plain starts-with on the registered name, so "srv_" also matches "srv_x_y". The manager adds the separator itself.
  - >-
    The skip test is Python's `all([name, description, handler])`: a missing key, null and "" all skip. A description of " " does not.
  - >-
    input_schema is read with a default of {}. A key that is present with null passes null on to the tool in LiteLLM; the typed section reads null as {} (list the cause in the section tests).
  - >-
    A loader error stops loading. LiteLLM only skips when the function it got is None, and the entries registered before the failure stay registered.
  - >-
    The handler string is passed through unchanged, with the config file path, because a remote (s3:// or gcs://) module is allowed only when the path is present. Never pass a path for a handler that came from anywhere but config.yaml.
  - >-
    Do not log handler objects or input schemas at debug. The dump in LiteLLM would print them; log tool names only.
  - >-
    ToolHandler is called with **arguments in LiteLLM, so extra or missing keys are the handler's problem. The registry does not validate arguments against input_schema.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
