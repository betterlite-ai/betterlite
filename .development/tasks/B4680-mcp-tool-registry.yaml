id: B4680
title: Local MCP tool registry and configured handlers
description: >-
  Build the local MCP tool registry in betterlite-mcp, module tool_registry, and the config section that feeds it. LiteLLM's MCPToolRegistry is one process-wide dict of tools. The manager fills it with one tool per OpenAPI operation, and `mcp_tools` in config.yaml fills it with tools backed by handler functions. The call path reads it by name. betterlite has no module-level state, so the registry is a value that the startup code builds once and passes to its users through their constructors.

  Types. ToolRegistry holds an IndexMap<String, LocalTool> behind a std::sync::RwLock, and every method takes &self so one Arc<ToolRegistry> can be shared. Never hold the lock across an await. LocalTool is LiteLLM's MCPTool: name, description, input_schema (a serde_json::Map<String, Value>) and handler (Arc<dyn ToolHandler>). It derives Clone. ToolHandler is an async trait with `call(&self, arguments: &serde_json::Map<String, Value>, context: &OpenApiCallContext) -> Result<OpenApiToolOutput, ToolHandlerError>`. Write it as a trait with a boxed future method, since the registry stores it as a trait object. OpenApiCallContext and OpenApiToolOutput come from betterlite-mcp's openapi_tools module (B4683) and are reused as they are, so the per-request headers (BYOK Authorization, forwarded headers, resolved upstream credential) reach a handler without module-level state. LiteLLM passes them through ContextVars. ToolHandlerError has two variants: OpenApi(OpenApiToolError) with #[from] and #[source], so the UpstreamAuth challenge keeps its type up to the caller, and Failed(String) for any other handler failure.

  Methods, all in LiteLLM's order and with its rules:
  - register_tool(name, description, input_schema, handler): insert or replace by name. A replaced name keeps its first position, as a Python dict does. Log "Registered tool: {name}" at debug.
  - get_tool(name) -> Option<LocalTool>: a clone of the entry.
  - list_tools(tool_prefix: Option<&str>) -> Vec<LocalTool>: in insertion order. A prefix that is None or "" returns everything, otherwise only tools whose name starts with it (case-sensitive).
  - unregister_tools_with_prefix(prefix) -> usize: an empty prefix removes nothing and returns 0. Otherwise remove every tool whose name starts with the prefix, log "Unregistered MCP tool {name}" at debug for each, and return the count. The manager calls it when an OpenAPI server leaves, with `normalized_server_prefix + separator`.
  - to_sdk_tools(tools: &[LocalTool]) -> Vec<SdkTool>: LiteLLM's convert_tools_to_mcp_sdk_tool_type. SdkTool is a serde type with name, description and input_schema serialized as `inputSchema`, which is the wire shape of the MCP Tool the manager lists. Look in crates/betterlite-mcp/src/tools/schemas.rs (B4740) and types.rs first and reuse an existing MCP tool type if one has these three fields; make a new SdkTool only if none does.

  Loading `mcp_tools`. load_tools_from_config(entries: Option<&[McpToolEntry]>, config_file_path: Option<&Path>, loader: &dyn ToolHandlerLoader) -> Result<(), ToolRegistryError> is LiteLLM's load_tools_from_config. ToolHandlerLoader is a trait with `load(&self, handler: &str, config_file_path: Option<&Path>) -> Result<Option<Arc<dyn ToolHandler>>, HandlerLoadError>`. It stands in for get_instance_fn, which imports a Python function from a dotted path ("module.function") and, for an s3:// or gcs:// path, downloads and runs a module (only when config_file_path is set). betterlite has no Python interpreter, so this task defines only the trait. B165 (embedded Python) and B124 own the real loader and the call at startup; the tests use a small fake loader that maps fixed strings to fake handlers.
  Before the loop, a None argument fails with the message "mcp_tools_config is required, please set `mcp_tools` in your proxy config" (ToolRegistryError::Missing). Then per entry, in order: an entry that is not a mapping fails with "mcp_tools_config must be a list of dictionaries" (NotAMapping), and entries before it stay registered, as in LiteLLM. An entry with a missing, null or empty name, description or handler is skipped silently (Python `all([...])`). input_schema defaults to {}. Call the loader with the handler string. A loader error ends loading with ToolRegistryError::Handler carrying the cause with #[source]; LiteLLM lets the import error propagate the same way and does not skip. When the loader returns Ok(None), log at warn "Warning: Could not find handler {handler} for tool {name}" and go to the next entry. Otherwise register the tool. After the loop log the list of registered tool names at debug (LiteLLM dumps json of the whole dict; log names only, never handlers).

  Config section. The section crates/betterlite-config/src/sections/mcp_tools.rs reads the top-level `mcp_tools` key of config.yaml. McpToolsSection has `entries: Vec<McpToolEntry>` and an empty list when the key is absent. McpToolEntry is an enum: Tool(McpToolSettings) for a mapping with the optional fields name, description, input_schema (a JSON object) and handler (strings), and NotAMapping for any other YAML value (a string, a number, a list, null). Unknown keys in a mapping are ignored, as LiteLLM ignores them. Only a top-level value that is not a list (for example a mapping) is a config error with the key name `mcp_tools`. Expose `decode_mcp_tools(bytes: &[u8]) -> Result<McpToolsSection, McpToolsError>` which parses YAML bytes with the repo's YAML crate (serde-saphyr, already used by betterlite-config) and reads the key. The fuzz target mcp_tools in crates/betterlite-config/fuzz feeds arbitrary bytes to it and must never panic. Add a committed corpus and a replay test named replays_the_mcp_tools_corpus.

  Registered OpenAPI handlers. OpenApiToolHandler in the module `openapi_handler` holds an OpenApiTool and an Arc<dyn OpenApiTransport> (both from B4683) and implements ToolHandler by calling tool.call(arguments, context, transport) and mapping the Err with ToolHandlerError::OpenApi. It is the value the manager passes to register_tool for each operation. A handler made this way is the whole reason the context travels with the call.

  Tests live in crates/betterlite-mcp/src/tool_registry/tests.rs and tests/ with module names registration, listing, prefix_removal, sdk_tools, config_loading and openapi_handler under tool_registry::, and in crates/betterlite-config/src/sections/mcp_tools/tests.rs for the section.

  Oracle. Helper cases only, since no route reaches the registry yet (the manager parts add the HTTP cases). The helper operation takes `function` (list_tools, unregister_prefix or load_from_config), `tool_names` (names to register in order, each with the handler `builtins.len` on the Python side), `prefix`, and for load_from_config an `mcp_tools` list. The Python side builds an MCPToolRegistry and answers `{"names": [...], "removed": n}` or `{"error": "<ValueError message>"}`; for load_from_config it also answers each tool's description and input_schema. The Rust adapter uses the fake loader that knows only `builtins.len`. Cases: list with no prefix, with a prefix, with an empty prefix, with a prefix that matches nothing; unregister with a matching prefix, with an empty prefix, and a re-registered name keeping its position; load with a skipped entry (no description), a skipped entry (empty handler), a default input_schema, a non-mapping entry, and a missing config.
scope:
