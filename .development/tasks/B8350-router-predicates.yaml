dod:
  - text: The auto, complexity and adaptive checks follow the classifier argument, and the adaptive join needs a truthy `adaptive` in a complexity router config.
    proof: [predicate-kinds]
  - text: The output cap refuses booleans and negatives and truncates numeric strings, and the accepts-param check keeps a param on any lookup error.
    proof: [predicate-params]
  - text: Id sets skip null ids and config rows skip DB rows.
    proof: [predicate-lists]
  - text: The success key skips batch retrieves and rows without a group or id, and turns an integer id into a string.
    proof: [predicate-success-key]
  - text: The mock switches are removed from the request, string values follow str_to_bool, the first true switch picks the error class, and the messages match LiteLLM byte for byte.
    proof: [predicate-mock]
checks:
  optional:
  - mutants
  commands:
  - id: predicate-kinds
    why: A complexity router with the adaptive companion is not counted, or tags lose order.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_predicates::tests::kind_/)'
  - id: predicate-params
    why: A boolean becomes a cap, or a failed provider lookup drops a param.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_predicates::tests::param_/)'
  - id: predicate-lists
    why: A null id enters the set or a DB row is treated as config.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_predicates::tests::list_/)'
  - id: predicate-success-key
    why: A batch retrieve counts as a success or an integer id misses its key.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_predicates::tests::success_key_/)'
  - id: predicate-mock
    why: A mock switch reaches the provider, or the error class or message differs.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^router_predicates::tests::mock_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "B377 owns classify_strategy_router_model, B304 the per-minute success counter and B011 the error classes. Router.deployment_is_active_for_environment is a one-line forward to B364's model_info_is_active_for_environment, so callers use B364."
  - "Calling these functions is the callers' job: B368 (_add_deployment, upsert_deployment), B400 (strategy registration), B401 (_create_deployment), B323 (tier params), B334 (client ceiling), B310 (fallback mock switch) and B306 (retry mock switch)."
  - "Router._get_metadata_variable_name_from_kwargs is a one-line forward to litellm_core_utils get_metadata_variable_name_from_kwargs, so callers use that owner's function and it is not built here."
  - "Router.__init__ registering the success key as a sync success callback is Python wiring; B8356 owns the Python Router class."
  - "Router._cost_map_backend_model and Router._backend_cost_map_keys are B013's: betterlite-models may not depend on betterlite-router, so B013 builds both in betterlite-models."
pitfalls:
  - "`as_output_cap(true)` is none even though Python's `bool` is an `int`, and `\"1e3\"` is 1000 because the string goes through `float` first."
  - "`deployment_accepts_param` answers true when `litellm_params` is empty, before it looks at the allowlist."
  - "`MockTestingParams::take_from` removes the three keys even when they are false, so they never reach a provider."
  - "The mock rate limit switch reads `num_retries` only when the group has exactly one deployment; with two or more it stays none."
  - "The adaptive companion flag is read from `complexity_router_config.adaptive`, not from a top-level `adaptive` key."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
