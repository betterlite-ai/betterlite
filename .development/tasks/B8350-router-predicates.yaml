id: B8350
title: Router deployment predicates and mock test errors
description: >-
  LiteLLM's `Router` carries a set of small checks on one deployment that other router code calls while it adds, upserts, prices or filters deployments. They were left in B162's list, so no task builds them, and the catalog and strategy tasks need them. Build them as plain functions over a deployment's `litellm_params` and `model_info` JSON maps, plus the three mock-testing switches that make the router raise on purpose so a user can test fallbacks and retries.


  Put the code in the new module `crates/betterlite-router/src/router_predicates.rs` and its folder. No static, no global, no I/O. Each function takes the `litellm_params` map, the `model_info` map or a request map as an argument, so the module needs no deployment type from a task above it.


  Strategy router kinds. `is_auto_router(params)`, `is_complexity_router(params)` and `is_adaptive_router(params)` take a `classify: fn(&str) -> Option<&'static str>` argument and call it on `litellm_params.model`. The classifier gives LiteLLM's strategy kind name (`semantic`, `complexity`, `adaptive` or `quality`) or none for a plain model. The caller passes a non-capturing closure over B377's `classify_strategy_router_model` that maps its `StrategyRouterKind` to that name. B377 sits above B368 and B401 in the task graph and its `StrategyRouterKind` lives in betterlite-server, so this module can neither depend on B377 nor name that type. Compare the name with `semantic`, `complexity` and `adaptive` (router.py L9078-L9086, L9138-L9144, L9233-L9235). `joins_adaptive_routing(params)` (L9237-L9250) is true for an adaptive router, false for anything that is not a complexity router, and for a complexity router true only when `complexity_router_config` is set, not empty, and its `adaptive` value is truthy under docs/compatibility.md. `deployment_tags(deployment)` (L9089-L9091) gives `litellm_params.tags` in order, empty when unset.


  Request params. `as_output_cap(value)` (L751-L760) takes a JSON value and gives an integer cap or none: booleans and anything that is not a number or a string give none, a string is parsed as a float first (so `"12.9"` gives 12), the float is truncated toward zero, a parse error or an overflow gives none, and a negative result gives none. `declared_param_allowlist(params)` (L11946-L11950) reads `allowed_openai_params` and keeps only its string entries; a value that is not a list gives an empty set. `deployment_accepts_param(deployment, group, param, support)` (L11953-L11982) is true when the deployment has no `litellm_params`, when `param` is in the allowlist, or when `support.declared_authenticating_provider(model, custom_llm_provider)` is true. Otherwise it resolves the provider for `litellm_params.model` (the group name when the model is empty) and asks for the supported OpenAI params with `base_model` taken from `model_info.base_model` first, then `litellm_params.base_model`. Any lookup error keeps the param (true), a `None` list keeps it, and otherwise the param must be in the list. `ParamSupport` is a trait this module defines with those three lookups, so the router crate does not import the provider crate; the caller passes B014's and B013's functions behind it.


  Deployment lists. `deployment_ids(deployments)` (L11507-L11513) gives the set of `model_info.id` values as strings, skipping a deployment whose `model_info` is missing or whose id is null. `config_deployments(model_list)` (L9146-L9153) yields, in order, every row whose `model_info` is missing, not a map, or has a falsy `db_model`.


  Success key. `success_minute_key(call_type, litellm_params, deployment_id_counter)` is `sync_deployment_callback_on_success` (L8205-L8240): a batch retrieve call type gives none; when `metadata` is missing the answer is none; when `metadata.model_group` or `model_info.id` is missing it is none; an integer id becomes its decimal string; otherwise return the id, which the caller passes to B304's `increment_deployment_successes_for_current_minute`.


  Mock testing. `MockTestingParams::take_from(request)` is `MockRouterTestingParams.from_kwargs` (types/router.py L1084-L1101): it removes `mock_testing_fallbacks`, `mock_testing_context_fallbacks` and `mock_testing_content_policy_fallbacks` from the request map and reads each as a boolean, where a string goes through the same `str_to_bool` rules as LiteLLM's secret manager helper (`true` and `false` in any case, anything else is none) and a JSON boolean is kept. `raise_mock_fallback_error(request, model_group, fallbacks, context_window_fallbacks, content_policy_fallbacks)` is `_handle_mock_testing_fallbacks` (router.py L7612-L7657): the first switch that is exactly true wins, in the order above, and gives B011's `InternalServerError`, `ContextWindowExceededError` or `ContentPolicyViolationError` with `llm_provider` empty, `model` set to the group, and the message `This is a mock exception for model={model_group}, to trigger a fallback. Fallbacks={fallbacks}` for the first. The other two keep LiteLLM's backslash line join, so the message has the newline-free text followed by the run of spaces from the source, then `Context_Window_Fallbacks={...}` or `Context_Policy_Fallbacks={...}`; copy the exact strings from L7641-L7657. `raise_mock_rate_limit(request, model_group, group_deployments)` is `_handle_mock_testing_rate_limit_error` (L7889-L7913): it removes `mock_testing_rate_limit_error` from the request; when exactly one deployment is in the group its `litellm_params.num_retries` is used; when the removed value is true it gives B011's `RateLimitError` with message `This is a mock exception for model={model_group}, to trigger a rate limit error.`, `llm_provider` empty and that `num_retries`. The caller passes the group's deployments, so this module does not look up the catalog.


  Python's `None`, list and dict print forms appear inside the mock messages (`Fallbacks=None`, `Fallbacks=[{'gpt-4': ['gpt-3.5']}]`). Format them with a small writer that prints a JSON value the way Python's `str()` prints the same list or dict, and test it.


  Tests are in `router_predicates/tests.rs`; names start with `kind_`, `param_`, `list_`, `success_key_` and `mock_`. There is no fuzz target, because no function here parses bytes.
