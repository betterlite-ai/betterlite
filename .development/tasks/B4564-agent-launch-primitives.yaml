id: B4564
title: Agent environment profiles and process handoff primitives
description: >-
  Build environment profiles, Codex provider arguments, credential verification and portable
  process handoff. Preserve stdin reattachment, Windows batch quoting, exit-code propagation,
  and the distinction between rejected keys and tolerated non-auth HTTP errors.

  Each agent (Claude, Codex, OpenCode, pi) reads credentials from environment variables or
  sync files; agent_profile maps a command to its display name and env-var families it
  understands. build_agent_env wires base_url and api_key into the environment: ANTHROPIC_BASE_URL
  and ANTHROPIC_AUTH_TOKEN for Claude Code, OPENAI_BASE_URL and OPENAI_API_KEY for Codex and
  OpenCode, and LITELLM_PROXY_API_KEY for pi. ANTHROPIC_API_KEY is dropped so a stray key
  cannot win over the bearer token. ENABLE_TOOL_SEARCH and CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY
  default to true/1 only when not already set.

  codex_proxy_provider returns a frozen mapping of the Codex provider config; _codex_proxy_args
  emits the -c CLI overrides Codex needs since it ignores the env vars and instead dials
  api.openai.com. agent_launch_args returns extra CLI args for an agent; only Codex needs them.

  verify_proxy_key probes /v1/models with the key, distinguishing 401/403 rejections from
  other HTTP errors and connection failures. AgentRunError is raised for unreachable proxies
  and rejected keys only; other non-2xx responses are tolerated since the agent's own call
  is the real test.

  _windows_command routes batch shims (.cmd, .bat) through cmd.exe with proper quoting
  (quote_for_cmd from B4560), since Windows' CreateProcess will not run shims directly.
  AgentRunError is raised for arguments holding line breaks, which cmd would silently truncate.

  _hand_off replaces this process with the agent on Unix (os.execvpe) and spawns a child
  on Windows (subprocess.run), waiting on its exit code since exec has no replacement semantics
  there. _restore_controlling_terminal reopens /dev/tty onto stdin before handoff if stdin
  was detached during browser SSO login, so TUI agents like Claude Code get a live terminal.
  _is_interactive returns whether stdin is a tty.

  Own the shared LITELLM_PROXY_API_KEY_ENV constant at pi.py:24 so environment construction
  and pi settings synchronization both reference it without a reverse data dependency.
