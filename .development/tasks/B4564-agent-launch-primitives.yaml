dod:
  - text: >-
      Cases agent_profile_known, agent_profile_unknown, anthropic_env_routing, anthropic_key_dropped,
      anthropic_discovery_defaults, anthropic_discovery_preserved, openai_env_routing, litellm_env_routing,
      codex_config_path_default, codex_config_path_home_override, codex_stop_hooks_detected,
      codex_stop_hooks_absent, codex_stop_hooks_unreadable_config_returns_false, codex_provider_frozen_mapping,
      codex_args_provider_override, proxy_401_rejected, proxy_403_rejected, proxy_other_tolerated,
      proxy_unreachable_error, windows_shim_routed_through_cmd, windows_non_shim_direct, argument_with_linebreak_rejected,
      unix_exec_process, windows_spawn_child, windows_exit_status_propagated, tty_undetached_and_attached,
      tty_already_attached_unchanged and interactive_true_on_tty verify environment routing, key verification,
      process handoff and terminal reattachment without network calls or subprocess invocation during setup.
    proof: [behavior-tests]
  - text: >-
      The Rust implementation in tools/management-cli/src/agent_launch.rs preserves LiteLLM's env-var precedence
      (ENABLE_TOOL_SEARCH and CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY left untouched when already set,
      including empty strings), provider config structure (codex_proxy_provider returns immutable metadata with
      correct field values), error classification (401/403 rejected vs other HTTP errors tolerated in verify_proxy_key),
      Windows quoting integration (batch shims routed through cmd.exe with quote_for_cmd), and process-replacement
      semantics (os.execvpe on Unix, subprocess.run on Windows with exit code propagation).
    proof: [behavior-tests]
