out_of_scope:
  - B4565 owns prepare_pi and the pi-specific model discovery and sync at agents.py:171-197; it calls _hand_off to invoke the agent after preparation.
  - B4566 owns the OpenCode model listing and provider config projection at agents.py:256-392; it consumes the env routing and profiles from this task but owns the chat-mode filtering and schema.
  - B4568 owns Codex model catalog preparation, stop-hook installation and the orchestration at agents.py:223-239, 508-650, 768-821; it calls _hand_off and consumes the profiles and process primitives.
  - B134 (the final shell and command registration) calls run_agent indirectly through B4568 and B4585; it never calls the environment or process functions directly.
pitfalls:
  - verify_proxy_key returns successfully for any HTTP response except 401 or 403, so other server errors (5xx, timeouts, DNS failures) do not block handoff.
  - build_agent_env copies ENABLE_TOOL_SEARCH and CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY only when not already present, so an empty string in the environment (env var set to "") still counts as present.
  - _windows_command checks only batch shim suffixes (.cmd, .bat), not whether the path actually exists or is executable.
  - On Unix, _hand_off calls os.execvpe with the env dict, which replaces the entire environment; any env vars set locally after build_agent_env returns and before _hand_off is called will be lost.
  - _restore_controlling_terminal silently returns when /dev/tty cannot be opened (e.g., in a container or headless environment), leaving stdin detached; callers should not assume success.
