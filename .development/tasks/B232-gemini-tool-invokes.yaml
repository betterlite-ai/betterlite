id: B232
title: Gemini tool invocations and thought signatures
description: >-
  Implement infer_protocol_value, _gemini_tool_call_invoke_helper, _encode_tool_call_id_with_signature, _get_thought_signature_from_tool,
  _get_dummy_thought_signature and convert_to_gemini_tool_call_invoke. Reuse B178 tool arguments, B179 message types
  and B183 media descriptors; preserve input ownership and bound embedded data. Budget 250 transforms/types, 100
  adapters, 300 tests/fuzz and 60 wiring (710 total). Add the gemini_tool_invokes cargo-fuzz target, call the production
  parser, and commit/replay malformed and boundary seeds. Write the behavior rstest functions gemini_tool_invokes_behavior_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. The helper operation gemini_tool_invokes is already registered;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/lib.rs
  - crates/betterlite-prompts/src/error.rs
  - crates/betterlite-prompts/src/gemini_tool_invokes.rs
  - crates/betterlite-prompts/src/gemini_tool_invokes/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/prompts/gemini_tool_invokes.rs
  - tools/oracle/src/helpers/prompts/gemini_tool_invokes/**
  - tools/oracle/helpers/gemini_tool_invokes.py
  - tools/oracle/helpers/gemini_tool_invokes/**
  - tools/oracle/cases/helpers/gemini-tool-invokes/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-prompts/fuzz/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L1111-L1345
  why: Gemini helper function ownership.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
- text: The outside-byte parser has its target and newly committed production replay corpus.
  proof:
  - gemini-tool-invokes-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::gemini_tool_invokes_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'gemini_tool_invokes' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: gemini-tool-invokes-corpus
    why: the required new behavior or its evidence is missing
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-prompts/fuzz/corpus/gemini_tool_invokes)"
      && test -f crates/betterlite-prompts/fuzz/fuzz_targets/gemini_tool_invokes.rs && test -n "$(ls -A crates/betterlite-prompts/fuzz/corpus/gemini_tool_invokes)"
      && cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(replays_the_gemini_tool_invokes_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/gemini-tool-invokes/signature-id.yaml
- tools/oracle/cases/helpers/gemini-tool-invokes/dummy-signature.yaml
- tools/oracle/cases/helpers/gemini-tool-invokes/parallel-invokes.yaml
- tools/oracle/cases/helpers/gemini-tool-invokes/encoded-id.yaml
- tools/oracle/cases/helpers/gemini-tool-invokes/invalid-signature.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B182 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as gemini_tool_invokes in the prompts group. Replace the stub Op in tools/oracle/src/helpers/prompts/gemini_tool_invokes.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/gemini_tool_invokes.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
