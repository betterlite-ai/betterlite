id: B3260
title: Published Singapore privacy, claims and MCP catalog records
description: >-
  Retain the published Singapore privacy, claims safety and MCP security records as remote-response fixtures in the root catalog.
  LiteLLM's published catalog `policy_templates.json` serves as the remote-response fixture for fetch requests by B3253. This task owns four complete template records: pdpa-singapore (Singapore PDPA—Personal Data Protection with nine guardrails for PII and data transfer), mas-ai-risk-management (Singapore MAS—AI Risk Management for Financial Institutions with five guardrails for fairness, transparency, oversight, governance and security), claims-agent-safety (Claims Agent Chatbot Safety with five guardrails for fraud, PHI disclosure, prior authorization, system override and medical advice), and mcp-security-unregistered-server-block (MCP Security: Block Unregistered Servers with one guardrail for blocking unregistered servers).
  Write each record to its own fragment file under `crates/betterlite-policy/assets/templates/published/`: `mcp-security-unregistered-server-block.json`, `pdpa-singapore.json`, `mas-ai-risk-management.json` and `claims-agent-safety.json`. Each holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  Preserve the exact field order and values from the pinned LiteLLM commit. All four records include id, title, description, icon, iconColor, iconBg, guardrails array, complexity, guardrailDefinitions array with litellm_params, templateData with policy_name and guardrails_add, tags, and estimated_latency_ms (1 for PDPA and MAS and claims, 200 for MCP). No example_sentences field. The three Singapore and claims records use pattern or category-based detection; the MCP record uses custom fields (default_on, on_violation).
scope:
  paths:
    - crates/betterlite-policy/assets/templates/published/mcp-security-unregistered-server-block.json
    - crates/betterlite-policy/assets/templates/published/pdpa-singapore.json
    - crates/betterlite-policy/assets/templates/published/mas-ai-risk-management.json
    - crates/betterlite-policy/assets/templates/published/claims-agent-safety.json
  lint_tables: false
