deviations:
  - what: >-
      Full-payload fallback excludes underscore-prefixed fields, "metadata" and "litellm_logging_obj" from serialized JSON.
    why: Internal logging state and prefixed fields must not be sent to guardrails; this preserves LiteLLM's filtering exactly.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/pass_through/guardrail_translation/handler.py#L82-L84
  - what: >-
      Process methods return original request/response unchanged; guardrail text modifications are never applied to relayed data.
    why: Passthrough guardrails are checks only, not rewrites. Handler is transparent and does not transform the payload.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/pass_through/guardrail_translation/handler.py#L110-L127,129-193
  - what: >-
      Existing litellm_metadata (even when empty dict) prevents user-key metadata injection in process_output_response.
    why: If caller supplies metadata, it takes precedence over auth enrichment, preserving caller intent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/pass_through/guardrail_translation/handler.py#L175-L178
out_of_scope:
  - >-
    PassthroughGuardrailHandler.get_settings (owned by B3601, provider guardrail settings lookup).
  - >-
    JsonPathExtractor.extract_fields (external dependency, not owned by betterlite).
  - >-
    BaseTranslation.transform_user_api_key_dict_to_metadata (owned by B3661, user metadata projection).
  - >-
    CustomGuardrail.apply_guardrail (owned by B3664, guardrail invocation contract).
  - >-
    Guardrail registration and dispatch (owned by B3574, passthrough guardrail dispatcher).
  - >-
    Provider-specific handlers and Bedrock translation (owned by provider-specific tasks).
pitfalls:
  - >-
    The handler always returns original request/response unchanged, even after guardrail application. Guardrail text
    modifications are never applied to relayed data; the handler is check-only, not a rewriter.
  - >-
    _extract_text_for_guardrail returns a string, never None. Empty text_to_check (empty string or whitespace) is falsy
    and skips apply_guardrail call, but the extraction method itself never returns None.
  - >-
    User-key metadata enrichment only happens in process_output_response when litellm_metadata is absent. An empty
    litellm_metadata dict blocks enrichment, preventing caller intent override.
  - >-
    PassThroughGuardrailSettings fields (request_fields, response_fields) are optional; missing fields means use
    full-payload fallback, not no extraction.
  - >-
    safe_dumps must exclude underscore-prefixed keys, "metadata" and "litellm_logging_obj" exactly as LiteLLM does,
    or guardrails may see internal state they should not.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
