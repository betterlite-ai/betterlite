      why: the handler.py scope is incomplete or an owned function is missing
      run: |-
        grep -q 'PassThroughEndpointHandler' crates/betterlite-core/src/passthrough_guardrail.rs && \
        grep -q 'fn.*get_guardrail_settings' crates/betterlite-core/src/passthrough_guardrail.rs && \
        grep -q 'fn.*extract_text_for_guardrail' crates/betterlite-core/src/passthrough_guardrail.rs && \
        grep -q 'fn process_input_messages' crates/betterlite-core/src/passthrough_guardrail.rs && \
        grep -q 'fn process_output_response' crates/betterlite-core/src/passthrough_guardrail.rs && \
        cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^passthrough_guardrail::/)' || cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(passthrough_guardrail)'
