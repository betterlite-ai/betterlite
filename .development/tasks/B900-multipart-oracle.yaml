id: B900
title: Multipart oracle
description: >-
  Extend B171 HttpCase body variants with JSON, ordered multipart parts and fixture bytes, preserving the existing
  JSON/SSE case format and CLI.


  request.body_kind is json (the default), multipart or bytes. With json, request.body remains the legacy bare JSON
  value, even if it has fields named multipart, bytes or json. With multipart, body is a parts record preserving
  order with name, optional filename/content_type, and exactly one text or fixture payload per part. With bytes,
  body is a fixture/content_type record. The explicit discriminator avoids collisions with legacy application JSON.
  upstream answers accept bytes with status/headers. Confine all binary files to tools/oracle/fixtures/multipart-oracle/;
  no case-relative alternative. Limits are 16 MiB per fixture, 128 parts, 16 MiB captured request body. decode_multipart_capture
  reads the bounded Content-Type boundary and bytes of both client and gateway-to-provider requests into ordered
  parts; normalize only boundary tokens, retaining duplicate names/filenames/content types and payloads. Differences
  use /request/parts/0/filename or /upstream/0/parts/0/filename, and /response/bytes for binary responses. decode_http_body
  reads bounded case YAML into these variants; fuzz both production decoders. The sole replay test is multipart_oracle::tests::replays_corpus.
  Self-check reruns the new fixtures plus tools/oracle/cases/chat and tools/oracle/cases/health. WAV health fixture
  ownership moves to B1001.


  Implement tools/oracle/src/multipart_oracle.rs. Use MultipartOracleInput and MultipartOracleResult with typed
  nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Define OracleLimits for the concrete harness caps above; product ApiLimits is not a tooling dependency.


  Write adjacent tests.rs behavior functions ordered_duplicate_parts, binary_answer_exact, multipart_diff_pointer,
  fixture_root_escape_rejected, rejects_unknown_field, rejects_duplicate_field, detects_changed_peer, rejects_oversize_input,
  preserves_legacy_cases under multipart_oracle::tests. Each named function drives production code and asserts its
  case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-oracle::multipart_oracle::decode_http_body(bytes: &[u8], limits:
  &OracleLimits), for bounded HttpCase YAML and captured multipart bytes. Place its implementation in tools/oracle/src/multipart_oracle.rs
  and call it from the actual boundary. The cargo-fuzz target tools/oracle/fuzz/fuzz_targets/multipart_oracle.rs
  passes arbitrary bounded bytes to that exact decoder; multipart_oracle::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  This task owns the declarative types/tooling boundary named above, not additional LiteLLM callables. Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 0 owned nonblank/non-comment/non-docstring Python lines (0 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 240 implementation,
  94 behavior tests, 80 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 504 total within the 510-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
