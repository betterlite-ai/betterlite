checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::/) - test(/::replays_corpus$/)'
  - id: case-ordered-duplicate-parts
    why: the ordered-duplicate-parts behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::ordered_duplicate_parts($|::)/)'
  - id: case-binary-answer-exact
    why: the binary-answer-exact behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::binary_answer_exact($|::)/)'
  - id: case-multipart-diff-pointer
    why: the multipart-diff-pointer behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::multipart_diff_pointer($|::)/)'
  - id: case-fixture-root-escape-rejected
    why: the fixture-root-escape-rejected behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::fixture_root_escape_rejected($|::)/)'
  - id: case-rejects-unknown-field
    why: the rejects-unknown-field behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::rejects_unknown_field($|::)/)'
  - id: case-rejects-duplicate-field
    why: the rejects-duplicate-field behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::rejects_duplicate_field($|::)/)'
  - id: case-detects-changed-peer
    why: the detects-changed-peer behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::detects_changed_peer($|::)/)'
  - id: case-rejects-oversize-input
    why: the rejects-oversize-input behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::rejects_oversize_input($|::)/)'
  - id: case-preserves-legacy-cases
    why: the preserves-legacy-cases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::preserves_legacy_cases($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/multipart_oracle)"
      && test -f tools/oracle/fuzz/fuzz_targets/multipart_oracle.rs && grep -qF "decode_http_body" tools/oracle/fuzz/fuzz_targets/multipart_oracle.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::replays_corpus$/)'
  - id: multipart-corpus
    why: multipart wire bytes never reach their actual production decoder in fuzz/replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/multipart_capture)"
      && grep -qF decode_multipart_capture tools/oracle/fuzz/fuzz_targets/multipart_capture.rs && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^multipart_oracle::tests::replays_corpus$/)'
  - id: harness-self-check
    why: new harness fixtures or backwards-compatible HTTP modes fail
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/harness/multipart-oracle)"
      && cargo run --locked --quiet -p betterlite-oracle -- --self-check tools/oracle/cases/harness/multipart-oracle
      tools/oracle/cases/chat tools/oracle/cases/health
oracle_cases: []
deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
pitfalls:
- get_form_data accumulates key[] values but retains only the last repeated plain key; compare the resulting upstream
  form against that source behavior.
- Multipart boundary strings are random; filenames, content types and ordered payloads are not.
review_level: standard
budget:
  max_changed_lines: 510
  max_new_expects: 0
