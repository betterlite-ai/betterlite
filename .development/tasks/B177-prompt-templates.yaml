- tools/oracle/cases/helpers/prompt-template/custom-roles.yaml
- tools/oracle/cases/helpers/prompt-template/function-prompt.yaml
- tools/oracle/cases/helpers/prompt-template/response-schema-prompt.yaml
- tools/oracle/cases/helpers/prompt-template/default-schema-prompt.yaml
- tools/oracle/cases/helpers/prompt-template/factory-default.yaml
- tools/oracle/cases/helpers/prompt-template/factory-builtin.yaml
- tools/oracle/cases/helpers/prompt-template/bedrock-missing-local-template-raises.yaml
- tools/oracle/cases/helpers/prompt-template/generic-missing-local-template-falls-back.yaml
deviations:
- what: Template lookup uses local files only and never downloads Hugging Face assets. Missing local templates in
    the early Bedrock llama3/llama4 instruct branch raise ValueError No chat template found; the final generic selector
    catches lookup failures and silently uses default_pt.
  why: Keep local-only behavior while Max decides whether validated Hugging Face acquisition should be supported.
    Preserve the source exception boundaries instead of inventing a warning or a Bedrock fallback.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L5305-L5369
out_of_scope:
- Structured Anthropic, Bedrock, Gemini, Cohere and Azure message conversion is B180-B182.
- Image/media conversion is B183; SDK template registration is B157-B166.
- Built-in renderers/default_pt/map_system_message_pt/ollama_pt are B214; Jinja and local token extraction B215.
- prompt_injection_detection_default_pt belongs to B105 guardrails; legacy XML and the uncalled Gemini text/image
  prompt_factory branches are dead at this pin (B180/B182 document them).
pitfalls:
- Whitespace and role delimiters are provider inputs, so do not normalize rendered text in comparisons.
- LiteLLM retries Jinja rendering after changing roles; its docstring alone does not specify the fallback.
- Commit raw template assets as fixtures with their pin; executable Rust code is still counted in the line budget.
- raise_exception returns an Exception value; real render exceptions alone cause role retry, which drops add_generation_prompt.
- minijinja Python string methods require minijinja-contrib pycompat.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
