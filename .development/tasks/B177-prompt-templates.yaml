id: B177
title: Text prompt templates and local Jinja rendering
description: >-
  Finish the closed prompt selector and custom/function/schema text prompts in betterlite-prompts/src/factory.rs.
  Compose B214 built-in families and B215 local Jinja with custom_prompt and prompt_factory model selection (factory.py
  5164-5369); preserve default_pt fallback only inside the final try/except (5327-5369). The earlier Bedrock llama3/llama4
  instruct branch (5305-5309) propagates ValueError No chat template found from the local template lookup, without
  fallback or warning. Support existing initial_prompt_value, roles, final_prompt_value, bos_token and eos_token
  as typed operator deployment inputs; B036/B037 and provider owners wire them from main.py 5373-5377/5544-5557.
  This task builds text branches and delegates installed structured branches explicitly: Anthropic B180, Azure/Cohere
  B182, Mistral B036, Watsonx B042 and Perplexity B041. Until each adapter is installed, return the framework typed
  unsupported-operation outcome rather than a fabricated prompt. Do not create remote-template acquisition or new
  config behavior before the open decision. Budget 230 selector/custom transforms, 100 adapters, 300 tests and 60
  wiring (690 total). Write the behavior rstest functions b177_prompt_template_tests_behavior in adjacent tests.rs
  files, with a named case for each behavior and failure in the DoD; corpus replay tests have separate names. Register
  helper operations prompt_factory in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py; each
  operation has its own Rust and Python adapter file and corpus seed.


  Add named helper cases bedrock_missing_local_template_raises and generic_missing_local_template_falls_back to
  prompt_factory, asserting the exception versus silent default_pt and zero outbound requests. Include both in the
  existing behavior and helper-python proof.


  Write prompt_factory_cases with the exact bedrock_missing_local_template_raises and generic_missing_local_template_falls_back
  rstest case names for these two helper files.
scope:
  paths:
  - Cargo.toml
  - deny.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/prompt-template/**
  - tools/oracle/fuzz/corpus/helper_case/**
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/{lib,error,factory}.rs
  - crates/betterlite-prompts/src/factory/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L99-L449
  why: Text templates and Jinja system-role fallback.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L614-L712
  why: DeepSeek, Claude and Granite text formats.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L3156-L3179
  why: Titan text format.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L5164-L5369
  why: Function/schema prompts, custom templates and factory selection.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/huggingface_template_handler.py#L28-L161
  why: Clock helper, localizable fetched template shapes and special-token extraction.
- url: https://docs.rs/minijinja/latest/minijinja/
  why: Existing Jinja-compatible engine rather than a new template language.
dod:
- text: Each built-in family, custom template and Jinja role fallback has a direct helper case comparing exact rendered
    text.
  proof:
  - oracle
  - helper-python
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
- text: The early Bedrock llama3/llama4 instruct branch raises ValueError No chat template found with zero network
    requests and no default_pt fallback or warning.
  proof:
  - case-bedrock-missing-local-template-raises
  - oracle
  - helper-python
- text: The final generic selector catches local template absence and returns default_pt silently, with zero network
    requests.
  proof:
  - case-generic-missing-local-template-falls-back
  - oracle
  - helper-python
checks:
  optional:
  - mutants
  commands:
  - id: prompt-template-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::b177_prompt_template_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'prompt_factory' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-bedrock-missing-local-template-raises
    why: The early Bedrock llama3/llama4 instruct branch raises ValueError No chat template found with zero network
      requests and no default_pt fallback or warning.
    run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::prompt_factory_cases::case_[0-9]+_bedrock_missing_local_template_raises$/)'
  - id: case-generic-missing-local-template-falls-back
    why: The final generic selector catches local template absence and returns default_pt silently, with zero network
      requests.
    run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::prompt_factory_cases::case_[0-9]+_generic_missing_local_template_falls_back$/)'
