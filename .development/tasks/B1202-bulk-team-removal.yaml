dod:
  - text: 'Integration cases duplicate_removed_before_transaction, email_backfill_requires_user_team,
      exact_missing_team_problem, exact_forbidden_problem, lookup_before_authorization,
      result_original_identity_and_index, missing_logger_noop and metric_exception_debug_only name the policies.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'postgres_concurrent_roster_delete checks lock-before-fresh-read and concurrent addition/removal.
      postgres_delete_rollback checks the 60-second timeout and failure after each ordered write, including
      archive-before-delete. postgres_post_commit_effects checks audit, key-cache, mapping-cache and metric
      order, vanished team, stale array-only membership, email-only roster, all team-array occurrences,
      no-key path and committed data surviving each post-commit failure.'
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bulk_team_removal::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/bulk_team_removal.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bulk-team-removal-*")"
        && grep -rlq "bulk_team_removal" tools/oracle/fuzz/corpus/helper_case/bulk-team-removal-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual bulk roster locking or transactional deletion effects fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bulk_team_removal::tests::postgres_concurrent_roster_delete$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bulk_team_removal::tests::postgres_delete_rollback$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bulk_team_removal::tests::postgres_post_commit_effects$/)'
oracle_cases:
  - tools/oracle/cases/helpers/bulk-team-removal/team-not-found.yaml
  - tools/oracle/cases/helpers/bulk-team-removal/forbidden-problem.yaml
deviations: []
out_of_scope:
  - B2363 owns bulk_user_deletion.py L137-L150, L177-L196 and L301-L310, plus MemberDeleteRequest in _types.py L4660-L4669.
  - B777 owns deleted-key archive projection; only existing stored token hashes are passed to it here.
  - 'litellm/proxy/management_helpers/bulk_user_deletion.py: B794 owns _UserBatchDeletion.deleted_key_tokens
    (L110-L111), _invitation_tx_db (L169-L170), _org_membership_tx_db (L173-L174), _error_message (L199-L206),
    _bounded (L209-L216), _caller_admin_org_ids (L368-L376), _scope_error (L379-L385), _delete_user_rows
    (L388-L419), _delete_users_tx (L422-L461), _delete_users (L464-L510), bulk_delete_users (L513-L596).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Request duplicate detection and roster identity matching use different rules; do not reuse one predicate for both.
  - The module docstring's whole-user-batch atomicity belongs to B794, while this service commits one team's removal before cache work.
budget:
  max_changed_lines: 700
  max_new_expects: 0
review_level: security
