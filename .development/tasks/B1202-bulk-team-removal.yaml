id: B1202
title: Bulk team-member removal transaction
description: >-
  Implement the service behind bulk team-member removal, retaining exact case-sensitive user/email matching
  and original result indexes. First load the team through B724; absent team raises B007 ManagementProblem
  with type urn:litellm:error:team-not-found, title Team not found, status 404 and detail Team id=<id> does
  not exist in db. Only then call B800 get_team_access().allows with TEAM_OR_ORG_ADMIN. Denial is status
  403, type urn:litellm:error:forbidden, title Forbidden and detail Call not allowed. User not proxy admin
  OR team admin OR org admin for this team. route='/management/v1/teams/<id>/members/bulk_delete'. These
  are problem details, without OpenAI error param/code; route registration and wire serialization remain
  with the management surface, not this service.

  A later request is duplicate when any earlier request has its non-null user_id or non-null user_email,
  including an empty email. Do not normalize email case. Filter duplicates before the transaction and map
  matched indexes back afterward. Own the _TeamRemoval and roster/teams-write declarations L75-L100 and
  the 60-second _BATCH_TX_TIMEOUT at L67. B2363 owns MemberIdentity, duplicate detection, matching and
  query predicates below this service and B1231's request contracts. The enclosing HTTP TeamMemberRef's
  exactly-one rule and 1..500 batch limit remain B1231's responsibility. Accept B2363's typed identities;
  callers convert their HTTP contracts without a dependency back from this service to their decoder.

  Within the 60-second transaction acquire B819 TEAM_ADVISORY_LOCK_SQL before re-reading the roster under
  B724's lock. A vanished team raises the same 404. Query requested IDs and truthy email-only requests using
  sorted IN predicates under OR. Fill a missing request email only from a matching user whose teams array
  contains this team; an explicit email is never replaced. An ID request matches its ID or an email-only
  roster entry with the same email, never a different non-null roster ID merely sharing the email. A pure
  email request matches exact email; user-row matching with an ID always uses only that ID.

  Preserve roster order while partitioning removed/kept members. Fetch removed IDs not already loaded;
  collect stale user rows that still list this team. Cleanup IDs combine removed roster IDs and stale rows,
  so stale array-only members count as matched and get keys removed. Select keys for this team and cleanup
  IDs, then snapshot B738 JWT mapping cache keys before any delete. Write the kept roster only when a roster
  member was removed; next remove every occurrence of this team from each stale user.teams array; next delete
  matching memberships even for an empty ID set; then, when keys exist, archive with B777 and changed_by=None
  inside the transaction before deleting the keys. Return the minimal team with kept roster, cleanup IDs,
  matched indexes, deleted key rows and mapping keys, constructing the team through B859's row contract.
  Do not delete user rows, invitations or organization
  memberships here. Failure at any transaction write rolls back these effects together.

  After commit, invoke B784 deleted-key audit logging only if keys existed, await B734 key-cache deletion,
  await B878 mapping eviction/broadcast, and finally emit B111 team-member metrics. Audit/cache exceptions
  propagate after commit and prevent subsequent steps; do not add compensation. A missing metrics logger
  is a no-op; metric failure debug-logs Prometheus: failed to emit team members metric: <message> and still
  returns results. Each result retains the original submitted ID/email and order, with success=true and
  error=None for a match, otherwise success=false and Duplicate member in request or User not found in team.


  Build the production bulk_team_removal module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/bulk_user_deletion.py:
  _TeamRemoval.deleted_key_tokens (L99-L100; 2 source lines), _team_not_found (L120-L128; 9 source lines),
  _team_tx_db (L153-L154; 2 source lines), _membership_tx_db (L161-L162; 2 source lines),
  _remove_members_from_team (L219-L288; 67 source lines), _emit_team_members_metric (L291-L298;
  8 source lines), bulk_remove_team_members (L313-L365; 48 source lines), _forbidden (L131-L134;
  4 source lines), _user_tx_db (L157-L158; 2 source lines), _token_tx_db (L165-L166; 2 source lines).


  Limit this B856 Management::teams operation to the two problem constructors; B2363 compares the
  matching/query helpers separately. Compare exact problem fields against the pin and seed B171's
  existing helper_case decoder. Exercise the stateful removal service natively against Postgres, including
  commit-before-cache-failure, rather than invoking it through a purportedly pure helper adapter.


  After moving 32 matching/filter lines to B2363, 146 helper lines and approximately 20 declaration lines
  remain before docstring exclusion. Allow 230 production, 360 transaction/integration tests, 45 problem
  adapters and 35 wiring, totaling 670 within 700. No setting or byte decoder is introduced by the service.


  Use betterlite-postgres-fixture as a dev-dependency, selecting POSTGRES_TEST_URL when set and testcontainers
  otherwise. postgres_concurrent_roster_delete runs conflicting bulk removals against actual writer-locked
  team rows and checks no unrelated member disappears. postgres_delete_rollback injects failure inside
  the source transaction and checks key, membership and roster state together. No skipped/in-memory replacement
  tests; unavailable selected Postgres fails. These tests fit the existing behavior-test allowance.
