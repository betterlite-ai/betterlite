id: B1202
title: Bulk team-member removal transaction
description: >-
  Implement the bulk team-member removal service used by management_v1 users with writer-locked team rosters,
  canonical user/email matching and ordered per-row errors. It is not the single-member /team/member_delete
  implementation. Return deleted key identities before cache invalidation.


  Build the production bulk_team_removal module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/bulk_user_deletion.py:
  _TeamRemoval.deleted_key_tokens (L99-L100; 2 source lines), _team_not_found (L120-L128; 9 source lines),
  _team_tx_db (L153-L154; 2 source lines), _membership_tx_db (L161-L162; 2 source lines), _same_email
  (L177-L178; 2 source lines), _addresses_member (L181-L184; 4 source lines), _with_row_email (L187-L190;
  4 source lines), _remove_members_from_team (L219-L288; 67 source lines), _emit_team_members_metric (L291-L298;
  8 source lines), _duplicate_member_indexes (L301-L310; 10 source lines), bulk_remove_team_members (L313-L365;
  48 source lines), _forbidden (L131-L134; 4 source lines), _in_filter (L137-L138; 2 source lines), _eq_filter
  (L141-L142; 2 source lines), _team_users_filter (L145-L146; 2 source lines), _any_filter (L149-L150;
  2 source lines), _user_tx_db (L157-L158; 2 source lines), _token_tx_db (L165-L166; 2 source lines),
  _addresses_user (L193-L196; 4 source lines).


  Add the bulk_team_removal operation under B856 Management::teams. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a bulk-team-removal-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 178 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  178 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 415 changed lines estimated within a 425-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Use betterlite-postgres-fixture as a dev-dependency, selecting POSTGRES_TEST_URL when set and testcontainers
  otherwise. postgres_concurrent_roster_delete runs conflicting bulk removals against actual writer-locked
  team rows and checks no unrelated member disappears. postgres_delete_rollback injects failure inside
  the source transaction and checks key, membership and roster state together. No skipped/in-memory replacement
  tests; unavailable selected Postgres fails. These tests fit the existing behavior-test allowance.
