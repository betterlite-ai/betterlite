dod:
  - text: os.environ/ references resolve from the environment with every occurrence removed.
    proof: [prefix-tests, oracle, helper-python]
  - text: Each OIDC provider reads the documented env names, sends the documented requests, caches with the documented TTLs and fails with the exact texts.
    proof: [oidc-tests, oracle, helper-python]
  - text: The manager branch honours access mode and hosted_keys, falls back to the environment on a dispatch error and turns Python True and False into booleans.
    proof: [manager-tests]
  - text: The env branch parses true and false with str_to_bool and returns None for a missing name even with a default.
    proof: [env-tests, oracle, helper-python]
  - text: get_secret_str drops booleans and get_secret_bool parses text with str_to_bool only.
    proof: [typed-tests, oracle, helper-python]
  - text: The GitHub response decoder survives valid, truncated and malformed bodies.
    proof: [decoder-corpus]
  - text: New helper corpus cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: prefix-tests
      why: os.environ/ removal is missing or strips only the prefix
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_lookup::tests::prefix_/)'
    - id: oidc-tests
      why: an OIDC provider, its cache or its error text is wrong
      run: >-
        cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail
        -E 'test(/^secret_lookup::tests::oidc_/) - test(replays_the_github_oidc_response_corpus)'
    - id: manager-tests
      why: the manager gate, hosted_keys, the env fallback or literal booleans are wrong
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_lookup::tests::manager_/)'
    - id: env-tests
      why: the env branch or the default rule is wrong
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_lookup::tests::env_/)'
    - id: typed-tests
      why: get_secret_str or get_secret_bool is wrong
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_lookup::tests::typed_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b8500)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b8500 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b8500/pyrightconfig.json
    - id: helper-case-corpus
      why: new secret-lookup helper cases are missing or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/secret_lookup-*")" &&
        grep -lE '^[[:space:]]+b8500:' tools/oracle/fuzz/corpus/helper_case/secret_lookup-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: decoder-corpus
      why: the GitHub response fuzz target or its new corpus is missing or fails
      run: >-
        test -f crates/betterlite-secret-managers/fuzz/fuzz_targets/github_oidc_response.rs &&
        grep -q 'name = "github_oidc_response"' crates/betterlite-secret-managers/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-secret-managers/fuzz/corpus/github_oidc_response)" &&
        cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(replays_the_github_oidc_response_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/secret-lookup/env-true-text.yaml
  - tools/oracle/cases/helpers/secret-lookup/env-plain-text.yaml
  - tools/oracle/cases/helpers/secret-lookup/env-missing-default.yaml
  - tools/oracle/cases/helpers/secret-lookup/os-environ-prefix.yaml
  - tools/oracle/cases/helpers/secret-lookup/oidc-circleci.yaml
  - tools/oracle/cases/helpers/secret-lookup/oidc-circleci-missing.yaml
  - tools/oracle/cases/helpers/secret-lookup/oidc-env.yaml
  - tools/oracle/cases/helpers/secret-lookup/oidc-env-missing.yaml
  - tools/oracle/cases/helpers/secret-lookup/oidc-unsupported.yaml
  - tools/oracle/cases/helpers/secret-lookup/str-drops-bool.yaml
  - tools/oracle/cases/helpers/secret-lookup/bool-from-text.yaml
  - tools/oracle/cases/helpers/secret-lookup/bool-unknown-text.yaml

deviations:
  - what: Manager text becomes a boolean only when it is exactly True or False after trimming. Text in parentheses or followed by a Python comment stays text.
    why: LiteLLM runs ast.literal_eval, which also accepts parentheses and comments; betterlite has no Python parser and keeps the two words.
  - what: An oidc/ name with no audience fails with "OIDC secret name needs a provider and an audience".
    why: LiteLLM fails with Python's tuple-unpack ValueError text, which has no Rust form.
  - what: A GitHub token body that is not a JSON object, or whose "value" is not a string, is an error.
    why: LiteLLM returns a non-string value as is or fails with AttributeError; the declared token is a string.
  - what: The manager fallback log line carries betterlite's error text and no Python traceback.
    why: Python exception reprs and tracebacks have no Rust equivalent; the message prefix is kept.

out_of_scope:
  - "_oidc_token_cache_ttl, _get_oidc_allowed_credential_dirs, _resolve_oidc_file_path and _get_oidc_http_handler; B4411 built them and this task calls them."
  - "normalize_nonempty_secret_str, secret_manager_would_be_consulted and _should_read_secret_from_secret_manager; B4410 built them."
  - "get_secret_from_manager and every manager client; B4421 and B4412 to B4420 own them."
  - "get_azure_ad_token_provider; B677 owns it, and the wiring backs AzureOidcTokens with it."
  - "Installing the manager client at startup (initialize_secret_manager in proxy_server.py) is B8590, and building the production SecretLookup with real HTTP; the wave 17 cache and secrets wiring part mounts it."

pitfalls:
  - "The default value never applies to a missing name: get_secret(\"X\", default_value=\"d\") with X unset returns None."
  - "Once a manager is configured, even a local read goes through the Python-literal rule, so \"true\" stays text while \"True\" is a bool; without a manager \"true\" is a bool."
  - "The Azure None-token error is raised inside LiteLLM's try, so its text is wrapped: \"Azure OIDC provider failed: Azure OIDC provider returned None token\"."
  - "The cache key is the full name after os.environ/ removal (\"oidc/google/<aud>\"), not the audience."
  - "Only the file provider checks the allowed credential directories; azure and env_path read any path."
  - "Never log a resolved value or an OIDC token, only names."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
