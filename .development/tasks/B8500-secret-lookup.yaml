id: B8500
title: Resolve secrets through get_secret, OIDC sources and the manager
description: >-
  Port `get_secret`, `get_secret_str`, `get_secret_bool` and `str_to_bool` from litellm/secret_managers/main.py
  (L115-L366). Dozens of provider, database and guardrail tasks resolve a setting through `get_secret_str("NAME")`,
  so this is the one place that turns a secret name into a value. Add the module `secret_lookup` to
  betterlite-secret-managers (crates/betterlite-secret-managers/src/secret_lookup.rs and secret_lookup/**). The crate
  must stay below betterlite-config, which depends on it, so it takes no config, cache or HTTP crate. Everything that
  does I/O comes in through ports.


  Types. `SecretValue` is an enum `Text(SecretString)` or `Bool(bool)`, LiteLLM's `str | bool`. `SecretLookup` has
  public fields `manager: Option<ManagerState>`, `oidc_http: Arc<dyn OidcHttp>`, `azure_tokens: Arc<dyn
  AzureOidcTokens>`, `clock: Arc<dyn OidcClock>` and `oidc_cache: OidcTokenCache`. `ManagerState` holds what B4421's
  dispatch function in `secret_read_dispatch` takes (read its merged signature: the client handle and the settings it
  wants) plus `system: Option<KeyManagementSystem>`, `access_mode: SecretAccessMode` and `hosted_keys:
  Option<Vec<String>>`. `OidcHttp` is a sync trait with `fn get(&self, request: OidcRequest) -> Result<OidcResponse,
  OidcHttpError>`, where `OidcRequest` has `url`, `query: Vec<(String, String)>`, `headers: Vec<(String, String)>` and
  `timeouts: OidcHttpTimeouts` (B4411's `OidcHttpTimeouts::DEFAULT`, 600 s read and 5 s connect), and `OidcResponse`
  has `status: u16` and `body: Vec<u8>`. `AzureOidcTokens` has `fn token(&self, scope: &str) -> Result<Option<SecretString>,
  AzureOidcError>`; the wiring backs it with B677's `get_azure_ad_token_provider`, so this crate never imports
  betterlite-azure. `OidcClock` has `now() -> Instant` and `unix_seconds() -> i64`. `OidcTokenCache` is a
  `Mutex<HashMap<String, (SecretString, Instant)>>` keyed by the secret name, read and written only by this module. Every
  method is sync, as in LiteLLM, because config and provider code call it outside async context. Callers pass the
  environment as `&BTreeMap<String, String>` on each call, the shape B4411 already takes.


  `get_secret(&self, env, secret_name, default_value: Option<SecretValue>) -> Result<Option<SecretValue>,
  SecretLookupError>`, in this order:

  1. A name that starts with "os.environ/" has every "os.environ/" removed (Python `str.replace`, not a prefix strip).

  2. A name that starts with "oidc/" is an OIDC source. Drop the first "oidc/", split once on "/" into provider and
  audience; the audience keeps every later "/" (a URL). No "/" at all is an error. The providers:
  `google` reads the cache first, then GETs http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity
  with query audience=<audience> and header Metadata-Flavor: Google. Status 200 returns the body text; its cache TTL is
  B4411's `oidc_token_cache_ttl(token, 3540, clock.unix_seconds())`, a TTL above 0 stores it, otherwise warn "Google OIDC
  token for <secret_name> is already expired or expires within 60s; not caching it" and still return it. Any other status
  fails with "Google OIDC provider failed".
  `circleci` returns CIRCLE_OIDC_TOKEN, else fails with "CIRCLE_OIDC_TOKEN not found in environment"; `circleci_v2` the
  same with CIRCLE_OIDC_TOKEN_V2.
  `github` needs ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN, else fails with
  "ACTIONS_ID_TOKEN_REQUEST_URL or ACTIONS_ID_TOKEN_REQUEST_TOKEN not found in environment". Then the cache, then a GET of
  the URL with query audience=<audience> and headers Authorization: Bearer <token> and Accept: application/json;
  api-version=2.0. Status 200 decodes the body with `decode_github_token(body: &[u8]) -> Result<Option<SecretString>,
  SecretLookupError>` (the "value" member) and caches a Some for 295 seconds; any other status fails with "Github OIDC
  provider failed".
  `azure` with AZURE_FEDERATED_TOKEN_FILE set returns the whole file content, unchanged and unchecked against any
  allowed directory. Unset, it warns "AZURE_FEDERATED_TOKEN_FILE not found in environment will use Azure AD token
  provider" and asks `azure_tokens.token(audience)`. A None token or any error fails with "Azure OIDC provider failed:
  <inner text>", logged at error level first; a None token's inner text is "Azure OIDC provider returned None token".
  `file` resolves the audience with B4411's `resolve_oidc_file_path(audience, env)` and returns the file content.
  `env` returns env[audience], else fails with "Environment variable <audience> not found". `env_path` reads the file
  named by env[audience], with the same missing text.
  Any other provider fails with "Unsupported OIDC provider". OIDC results return here and never reach the manager.

  3. When `manager` is Some and B4410's `manager_read_is_enabled` is true for it (access mode read_only or
  read_and_write): the key manager is "local", or the system's value when `system` is set; a set `hosted_keys` that does
  not contain the name turns it back to "local". Call B4421's dispatch with it. A dispatch error logs at error level
  "Defaulting to os.environ value for key=<name>. An exception occurred - <error>." and takes env[name] instead. A text
  result whose content, after dropping leading spaces and tabs and trailing whitespace, is exactly `True` or `False`
  becomes `SecretValue::Bool`; any other text stays `Text`. A None result returns None with no env fallback.

  4. Otherwise read env[name]. `str_to_bool` of it (trim, lowercase, "true" or "false", else None) gives a Bool when it is
  Some; otherwise the text is returned as is, and a missing name returns None.

  `default_value` is returned only for an error raised in steps 3 and 4 outside the dispatch call, which the code above
  never raises, so a missing name returns None even with a default. Keep the parameter so callers port 1:1. OIDC errors
  in step 2 are raised whatever the default.


  `get_secret_str` returns the text of a `Text` and None for a `Bool` or None. `get_secret_bool(.., default_value:
  Option<bool>)` returns None for None, the bool for a `Bool`, and `str_to_bool` of the text for a `Text`. Do not use
  B4410's `read_boolean_text`: it goes through `betterlite_env::flag`, which also accepts 1, yes and on, and LiteLLM's
  `str_to_bool` does not. `SecretLookupError` is a thiserror enum in this module whose Display texts are the quoted
  messages above.


  Tests in `secret_lookup::tests`, one file per group, with a recording `OidcHttp`, a fake `AzureOidcTokens`, a manual
  clock, temp files and a fake dispatch client: `prefix_` (os.environ/ removal), `oidc_` (each provider, cache hit and
  expiry, the Google not-caching warning, GitHub env check before the cache, Azure file and token paths, the file
  allowlist, unsupported and missing-audience errors), `manager_` (hosted_keys, local fallback on dispatch error, Python
  literal booleans, None without fallback, access modes), `env_` (str_to_bool, missing name with a default) and `typed_`
  (get_secret_str and get_secret_bool).

  Helper oracle cases use operation b8500 with functions `get_secret`, `get_secret_str` and `get_secret_bool`, inputs
  `secret_name`, `environment` (a map) and `default_value`, and output `value` plus `error` (the message text or null).
  The Python side patches os.environ to exactly the given map (patch.dict with clear=True), sets
  litellm.secret_manager_client to None and calls the LiteLLM function. Cases stay on the env and env-only OIDC paths
  (os.environ/, env, circleci, unsupported), since the helper has no network.

