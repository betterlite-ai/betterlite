dod:
  - text: check_server returns the not-found row, and the spec_path branch returns the table view with the probe's status, error and time.
    proof: [health-check-tests]
  - text: The probe kind rule picks reachability for per-user auth, a missing token on a token-needing auth type and per-user env var references, and a no-op session otherwise.
    proof: [health-check-tests]
  - text: Session results map to healthy, unhealthy (with the timeout text) and unknown (cancelled) as stated, and healthy remembers the instructions.
    proof: [health-check-tests]
  - text: The returned row carries the configured OAuth url or the live one, empty lists for missing access groups, allowed tools and extra headers, and teams empty.
    proof: [health-row-tests]
  - text: reachability returns the stated status and message for a bad transport, a bad url, embedded credentials, timeout, failure and success.
    proof: [health-reach-tests]
  - text: The OpenAPI probe returns the stated status and message for each error class, refuses non-http specs, and reuses a result younger than 30 seconds.
    proof: [health-openapi-tests]
  - text: run_health_checks deduplicates ids, batches by 10, keeps order, and the three list methods filter as stated.
    proof: [health-batch-tests]
  - text: The instructions cache skips on each listed precondition and the cooldown, records the attempt before the call and ignores failures.
    proof: [health-instructions-tests]
  - text: invalidate_toolset_cache removes only the stated keys, and toolset_by_name_cached caches both a toolset and the not-found sentinel.
    proof: [health-toolset-tests]

checks:
  optional: []
  commands:
    - id: health-check-tests
      why: the probe choice, the not-found row or the status mapping is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_health::tests::check_/)'
    - id: health-row-tests
      why: the returned table row fields or fallbacks are wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_health::tests::row_/)'
    - id: health-reach-tests
      why: a reachability message or status is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_health::tests::reach_/)'
    - id: health-openapi-tests
      why: an OpenAPI probe result, message or the 30 second cache is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_health::tests::openapi_/)'
    - id: health-batch-tests
      why: batching, dedupe, order or a list filter is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_health::tests::batch_/)'
    - id: health-instructions-tests
      why: the instructions prefetch skips, cooldown or storage is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_health::tests::instructions_/)'
    - id: health-toolset-tests
      why: toolset cache invalidation or the sentinel is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_health::tests::toolset_/)'

oracle_cases: []

deviations:
  - what: Probes, the allowed-server source and the toolset cache are injected traits, and the OpenAPI probe cache and instructions maps are HealthService fields.
    why: the repo wires dependencies through constructors and has no module-level state; LiteLLM uses a global manager and proxy_server imports.
  - what: asyncio.gather in batches becomes futures::future::join_all per batch of 10.
    why: same concurrency bound, no behaviour change.

out_of_scope:
  - "Registry reads and server_table: B4731. Allowed-server union and get_allowed_mcp_servers: B6591."
  - "Registry reload, add, update, remove: B6765. Config loading: B6764. Record build: B6763."
  - "OpenAPI spec loading (load_openapi_spec_async): B4683. Toolset storage (get_mcp_toolset_by_name): B4681."
  - "_create_mcp_client, _resolve_static_headers_with_env_vars and _references_per_user_env_var: no owner found, see the architect notes; this task takes them as traits."
  - "filter_server_ids_by_ip and the other methods outside the health section: their own entries."

pitfalls:
  - "A per-user auth server is never opened with a session during a health check; it only gets the reachability GET, so its best status is reachable, not healthy."
  - "The reachability GET sends no auth and does not follow redirects; a redirect response still counts as reachable."
  - "Record the instructions probe time before the call, so a failing upstream is not retried on every initialize."
  - "toolset_name keys are always evicted on any invalidation, since the name may have changed; toolset_perms keys only match when they contain the id."
  - "Error text from a failed probe must carry the error kind only for reachability (no url), but the full text for the session probe, as in Python."
  - "run_health_checks keeps duplicates out but must not reorder the ids."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
