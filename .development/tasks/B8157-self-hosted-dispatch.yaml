    why: OllamaModelInfo get_models, validate_environment and get_base_model.
dod:
  - text: Each _complete_* function resolves api base, key and headers as LiteLLM does and calls its provider config.
    proof: [self-hosted-dispatch-tests, self-hosted-dispatch-cases]
  - text: The dispatch arms reach these functions through the table, and unknown providers still fail as before.
    proof: [self-hosted-dispatch-tests, self-hosted-dispatch-cases]
  - text: Lemonade get_models and transform_response match, including the lemonade/ model prefix.
    proof: [self-hosted-dispatch-tests, self-hosted-dispatch-cases]
  - text: Ollama get_models lists the /api/tags names with the ollama/ prefix, sorted and without duplicates, sends the bearer header only with a key and falls back to the catalog list on any failure; validate_environment and get_base_model are no-ops.
    proof: [self-hosted-dispatch-tests, self-hosted-dispatch-cases]
  - text: New helper cases for these functions exist.
    proof: [self-hosted-dispatch-cases]
checks:
  optional: [mutants]
  commands:
    - id: self-hosted-dispatch-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^self_hosted_dispatch::/)'
      why: Without this provider code there are no such tests, so the check fails on the base branch.
    - id: self-hosted-dispatch-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/self-hosted-dispatch)"
      why: Without new case files the oracle proof passes with nothing compared.
