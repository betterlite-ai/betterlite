  - "main.py line numbers in this text are at the pinned commit; match by function name."
  - "Some arms also fall back on global litellm.api_base and litellm.api_key before the environment; keep that order."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
