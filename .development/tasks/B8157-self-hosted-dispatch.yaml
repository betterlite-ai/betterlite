    why: The _complete_* functions for these providers (ranges in the description).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/llms/lemonade/chat/transformation.py#L1-L255
    why: Lemonade get_models and transform_response.
