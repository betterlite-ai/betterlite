id: B977
title: Expose async Messages events and SSE from chat streams
description: >-
  Own the complete __anext__, anthropic_sse_wrapper, async_anthropic_sse_wrapper and AnthropicSSEStream methods
  at adapters/streaming_iterator.py L783-L1044,L1212-L1233. B2434 owns __next__ whole and the reusable transition
  engine; B976 owns state and B975 splitting/error helpers. Preserve async exceptions until the async SSE
  boundary, where they become one Anthropic error event. Do not copy the sync method's catch-and-stop behavior.
  B967 constructs this wrapper; there is no dependency on its later B974 caller.

  SdkHttpCall::MessagesChatStream through B2401 obtains actual B005 streaming responses and drives these methods.
  Compare ordered event/data values, raw framing artifacts, completion pull/cancel observations and terminal
  errors, with only generated UUIDs normalized. Fixtures may seed typed queued events or held state to exercise
  branches that real providers seldom produce, but still start their own mock-provider request. No helper oracle
  or B171 dependency is needed. Event encoding is not a decoder; B005 owns incoming SSE parsing/fuzzing.
  Own 212 nonblank/non-comment physical lines after the sync split. Budget 220 implementation, 150 tests,
  155 fixtures, 100 adapters and 30 wiring, 655 total; tests use api::messages_chat_stream.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/messages_chat_stream.rs
  - crates/betterlite-core/src/api/messages_chat_stream/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/messages_chat_stream.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/messages_chat_stream.py
  - tools/oracle/cases/sdk-http/messages-chat-stream/**
  - tools/oracle/fuzz/corpus/sdk_http_case/messages-chat-stream-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py#L783-L1011
  why: Whole async iterator, including delayed finish/usage flush and exception propagation distinct from __next__.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py#L1013-L1044
  why: Both SSE encoders and the async-only catch that emits a structured error event.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py#L1204-L1233
  why: The public async byte view retains wrapper metadata and closes its byte generator.
dod:
- text: >-
    async_event_lifecycle captures one POST /v1/chat/completions stream=true,stream_options.include_usage=true
    for gpt-4o-mini. Before the first body pull emit message_start with the wrapper model,msg_<UUID>,assistant,
    empty content,null stops and all four zero usage counters. Mock text A,reasoning R and named tool t with
    arguments {} each emit start/delta/stop in index order; transition-trigger payloads are not lost. A tool
    start with empty arguments is returned without waiting for a later provider chunk. Blank/choiceless metadata
    yields no block, while B976 compaction emits its three events before ordinary content.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    async_terminal_usage sends stop followed by choices=[] usage5/2 and gets one block stop then one message_delta
    with end_turn,usage5/2,context edits and summary iterations, then message_stop. After that usage delta,
    trailing provider content is dropped. Without usage, EOF flushes held content before held stop, closes an
    unclosed block first, augments zero usage without a message iteration and emits message_stop once. A typed
    held-state fixture checks repeated __anext__ never re-emits the held delta and ultimately raises StopAsyncIteration.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    sse_frame_encoding queues {type:ping} and expects UTF-8 bytes "event: ping\ndata: {\"type\": \"ping\"}\n\n".
    A dict with no type uses event: message; type=null uses event: None. JSON follows Python json.dumps escaping,
    including ASCII escapes for non-ASCII text, while its decoded values are unchanged. A non-dict byte chunk
    passes byte-for-byte. Sync SSE delegates to B2434; async SSE delegates to this task's iterator.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    async_error_event_ends_stream makes an upstream BaseLLMException(status429,message="busy") occur after A.
    Direct __anext__ propagates that exception; async SSE logs exception-level
    "Anthropic Adapter - mid-stream error, emitting Anthropic error event: <exception>" then yields exactly
    event:error with {type:error,error:{type:rate_limit_error,message:busy}}. Generic empty exception yields
    api_error and "Upstream stream ended before completion" via B975. No message_delta/message_stop is fabricated
    after error and no retry request occurs. A source "None"/null chunk takes the generic error path.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    async_byte_view_metadata creates AnthropicSSEStream with _hidden_params={}, forwards chunks/messages/model
    from its wrapper and returns the underlying SSE bytes from __anext__. aclose closes the byte generator once
    without synthesizing a terminal frame. The source method does not explicitly close the completion_stream;
    test the observable generator close separately from provider-owned transport cancellation. Concurrent views
    retain their own ids, tool names and queued events.
  proof: [behavior-tests, oracle, python-adapter]
- text: New HTTP stream cases select messages_chat_stream and preserve the upstream capture even when output fails midstream.
  proof: [new-cases, corpus, oracle, python-adapter]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: async event order, SSE literals or error termination is missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_stream::/)'
  - id: python-adapter
    why: async stream HTTP parity has no checked Python driver
    run: test -f tools/oracle/sdk_http/messages_chat_stream.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpus
    why: sdk_http cannot select the Messages stream view
    run: grep -qE '^[[:space:]]+messages_chat_stream:' tools/oracle/fuzz/corpus/sdk_http_case/messages-chat-stream-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: there are no added async stream HTTP scenarios
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/messages-chat-stream)"
oracle_cases:
- tools/oracle/cases/sdk-http/messages-chat-stream/async-event-lifecycle.yaml
- tools/oracle/cases/sdk-http/messages-chat-stream/async-terminal-usage.yaml
- tools/oracle/cases/sdk-http/messages-chat-stream/sse-frame-encoding.yaml
- tools/oracle/cases/sdk-http/messages-chat-stream/async-error-event-ends-stream.yaml
- tools/oracle/cases/sdk-http/messages-chat-stream/async-byte-view-metadata.yaml
deviations: []
out_of_scope:
- B2434 owns the complete __next__ L548-L781; B976 owns the shared state and transition helpers L310-L546,L1046-L1201.
- B975 owns L43-L293 protocols/splitter/error formatting; B966 translates chat chunks and B005 decodes provider SSE.
- B967 owns adapter factory composition and B974 the main completion call; neither is called by this lower-level stream view.
pitfalls:
- Async exceptions must reach the SSE boundary; copying the sync iterator's broad catch silently truncates client output.
- A dict without type uses the literal message event name, not an absent event line.
- The byte view starts with empty hidden params and does not itself implement provider-header forwarding.
review_level: standard
budget:
  max_changed_lines: 700
  max_new_expects: 0
