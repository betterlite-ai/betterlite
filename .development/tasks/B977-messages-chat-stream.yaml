id: B977
title: Messages chat stream
description: >-
  Drive the chat-to-Messages stream using the chunk splitter and usage/block decision service. Implement one native
  transition loop for both source sync and async facades, preserve message_start/content_block/message_delta/message_stop
  order and cancellation, and emit typed mid-stream errors.


  Implement crates/betterlite-core/src/api/messages_chat_stream.rs. Use MessagesChatStreamInput and MessagesChatStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions text_block_lifecycle, thinking_then_tool, usage_at_message_delta, midstream_error,
  empty_stream_stop, client_disconnect under api::messages_chat_stream::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesChatStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_chat_stream: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper.__next__
  (L548-L781); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper.__anext__
  (L783-L1011); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper.anthropic_sse_wrapper
  (L1013-L1027); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper.async_anthropic_sse_wrapper
  (L1029-L1044); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicSSEStream.__init__
  (L1212-L1215); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicSSEStream.chunks (L1218-L1219);
  litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicSSEStream.messages (L1222-L1223);
  litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicSSEStream.model (L1226-L1227); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  AnthropicSSEStream.__anext__ (L1229-L1230); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:
  AnthropicSSEStream.aclose (L1232-L1233). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 357 owned nonblank/non-comment/non-docstring Python lines (366 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 377 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 645 total within the 650-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B974 (Messages chat call), B975 (Messages
  stream split), B976 (Messages stream usage), B1087 (Api boundaries). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
