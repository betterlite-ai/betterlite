id: B608
title: Bedrock Converse event-to-chat mapping
description: >-
  Add ConverseStreamState and event projection for message/content block start/delta/stop, metadata usage, tool
  arguments, thinking signatures and citations. Preserve index and usage ordering; use the already bounded AWS frame
  decoder and leave transport lifecycle separate.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_handler.py:
  AWSEventStreamDecoder.__init__ L407-L418; AWSEventStreamDecoder.check_empty_tool_call_args L420-L440; AWSEventStreamDecoder.extract_reasoning_content_str
  L442-L447; AWSEventStreamDecoder.translate_thinking_blocks L449-L472; AWSEventStreamDecoder._initialize_converse_response_id
  L474-L483; AWSEventStreamDecoder._handle_converse_start_event L485-L528; AWSEventStreamDecoder._handle_converse_delta_event
  L530-L585; AWSEventStreamDecoder._handle_converse_stop_event L587-L609; AWSEventStreamDecoder.converse_chunk_parser
  L611-L688; AWSEventStreamDecoder._chunk_parser L690-L743.


  Reuse AmazonConverseConfig.thinking_tokens_from_additional_fields from B605 (litellm/llms/bedrock/chat/converse_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: message_start_id: Initialize state: content_blocks=[],tool_calls_index=None,response_id=None,current_tool_name=None,thinking_ran=false,provider_reasoning_tokens=None,json_mode
  defaultfalse. converse parser stores chatcmpl-<conversationId> only when response_idNone and top-level messageStart
  has truthy conversationId; a falsey/missing id leaves stateNone. A first non-messageStart object generates chatcmpl-<UUID>.
  Retain stored id thereafter; do not overwrite from later messageStart. Nova wrapper dispatch unwraps messageStart
  before this helper, so that path uses fallback id rather than pretending the wrapper survived. content_text_delta:
  converse_chunk_parser int-converts contentBlockIndex default0. Ordered dispatch start,delta,contentBlockIndex-stop,stopReason,usage;
  earlier key wins when several present. Delta priority text,toolUse,reasoningContent,citationsContent. Text presence
  wins even empty and does not append tool buffer. Raw citationsContent only becomes delta.provider_specific_fields,
  not normalized annotations. Unknown direct converse event yields one empty delta with no assistant role/content
  unless trace or one of start/delta/contentBlockIndex/stopReason keys present. tool_input_delta: Start always resets
  content_blocks; non-None toolUse uses B598 reverse name and stores current name, then tool index0/incremented
  per emitted start, ignoring provider index. Emit id, function name, arguments empty string. Delta appends entire
  toolUse block, emits arguments with id/nameNone and stored index or provider index fallback. It does not assemble
  a complete JSON object. Preserve malformed required-field failures and independent request state. thinking_signature:
  Thinking delta exposes raw reasoningContent, reasoning_content=text if text key exists. Thinking-block priority
  text ->{type:thinking,thinking}, signature ->{type:thinking,signature,thinking:empty}, redactedContent ->{type:redacted_thinking,data};
  unknown ->[]. If nonempty thinking blocks with no extracted text, reasoning_content=empty string. Start supports
  non-None reasoningContent after toolUse branch, storing raw fields. Any nonempty thinking-block list sets thinking_ran;
  no cumulative signature reconstruction here. content_stop_finish: Stop clears current tool name; empty-args predicate
  false when no buffered deltas or first buffered delta lacks toolUse. Otherwise concatenate toolUse.input strings;
  exactly empty emits one arguments={} chunk using stored index or provider index, while whitespace is not empty.
  Stop does not clear content_blocks, so repeated stop can repeat that empty chunk. stopReason without higher-priority
  keys maps through B206 and stores B605 additionalModelResponseFields reasoning count; finish_reason for other
  chunks is empty string. metadata_usage: usage branch uses B605 transform_usage with remembered thinking_ran and
  provider_reasoning_tokens; no reasoning-content estimate supplied. Always one choiceindex0, model=requested, stored
  responseid. Truthy trace ->top-level provider_specific_fields.trace and assistant/contentempty even for usage-only
  event; falsey trace omitted. Pure usage/metrics has role/contentNone but still one choice. ModelResponseStream
  wire defaults stayB005. invoke_chunk_provider_dispatch: Ordered base parser: outputText field ->text withoutfinish;
  else model containing ai21 ->required completions[0].data.text and finishedstop; else any contentBlockIndex/stopReason/metrics/trace
  key ->converse parser; else first present Nova wrapper in messageStart,contentBlockStart,contentBlockDelta,contentBlockStop,messageStop,metadata
  ->validate inner dict and converse parser. Else outputs ->text only for listlength1 and textnon-None, finish only
  top-level stop_reason non-None; else generation ->text; else text ->text; else finish_reason ->finished rawvalue;
  else truthy completionReason ->finished rawvalue. Unknown ->empty unfinished GChunk, index0,usageNone,tool_useNone.
  Usage alone withoutmetrics/Nova wrapper does not select converse. json_tool_stream: Only json_mode literal True
  and restored name json_tool_call suppress start tool emission/index increment; each tool input fragment becomes
  text content, without properties unwrapping/JSON validation. Stop clears current name and emits no empty-argument
  tool chunk. Non-tool start resets content buffer but does not clear current tool name, so malformed sequence retains
  the source state behavior until stop. converse_projection_error: Any exception inside converse_chunk_parser becomes
  generic Exception Received streaming error - <exception>; no source HTTP status/type/param supplied. Failures
  in the outer provider-specific dispatch before entering converse retain their own error. Native framed exception
  statuses belongB599 and are not duplicate parser cases.


  Implement crates/betterlite-bedrock/src/converse_events.rs with adjacent tests under converse_events/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_events_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): message_start_id, content_text_delta, tool_input_delta, thinking_signature, content_stop_finish, metadata_usage,
  invoke_chunk_provider_dispatch, json_tool_stream, converse_projection_error. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_events* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_events variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_events that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 291 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 290 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 715 planned, 725 maximum changed lines.
