pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_converse_events in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/converse_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_converse_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A Nova messageStart wrapper is unwrapped before response-id initialization, so its inner conversationId is not
  read by the top-level messageStart branch.
- Repeated stop events can repeat an empty-argument chunk because stop does not clear the tool buffer.
