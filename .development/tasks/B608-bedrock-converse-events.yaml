  commands:
  - id: case-message-start-id
    why: The message-start-id behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::converse_events_cases::case_[0-9]+_message_start_id$/)'
  - id: case-content-text-delta
