- tools/oracle/cases/helpers/assets/is-within-symlink-resolution.yaml
- tools/oracle/cases/helpers/assets/join-within-lexical.yaml
- tools/oracle/cases/helpers/assets/join-within-escape-detection.yaml
- tools/oracle/cases/helpers/assets/safe-filename-basename-extraction.yaml
- tools/oracle/cases/helpers/assets/safe-filename-separator-handling.yaml
- tools/oracle/cases/helpers/assets/safe-filename-empty-and-dots.yaml
- tools/oracle/cases/helpers/assets/detect-local-image-png-gif-jpeg.yaml
- tools/oracle/cases/helpers/assets/detect-local-image-webp-ico.yaml
- tools/oracle/cases/helpers/assets/detect-local-image-unsupported.yaml
- tools/oracle/cases/helpers/assets/resolve-validated-local-image-success.yaml
- tools/oracle/cases/helpers/assets/resolve-validated-local-image-missing-file.yaml
- tools/oracle/cases/helpers/assets/resolve-validated-local-image-unsupported.yaml
- tools/oracle/cases/helpers/assets/resolve-validated-local-image-read-error.yaml
deviations: []
out_of_scope:
- >-
  LOCAL_IMAGE_HEADER_BYTES is a constant imported from LiteLLM for the number of
  bytes to read; betterlite uses the same 512-byte value defined at runtime or
  compile time.
- >-
  verbose_proxy_logger is LiteLLM's module-level logger instance; betterlite accepts
  a logger injected through the function interface, following the dependency injection
  pattern, so logging behavior is testable.
pitfalls:
- 'The oracle helper for this task is pre-registered as assets in the server group. Replace the stub Op in tools/oracle/src/helpers/server/assets.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/assets.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- safe_join and is_within resolve symlinks, so a symlink inside base_dir pointing outside it will fail; join_within does not resolve and returns the link.
- Directory traversal is checked after realpath resolution; path.startswith(base) is insufficient and must include os.sep or equality check.
- GIF8a is detected by checking header[0:4] == b"GIF8" and header[5:6] == b"a" only; any other byte at offset 5:6 (including 'b') returns None.
- detect_local_image_media_type returns None for empty headers or unrecognized signatures; the caller (resolve_validated_local_image_path) interprets None as an unsupported format and logs a warning.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
