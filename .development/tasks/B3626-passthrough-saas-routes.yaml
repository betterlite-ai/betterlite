  - tools/oracle/cases/server/passthrough-saas-routes/fal-priced-forward.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/fal-unpriced-400.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/fal-requests-path-skips-price.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/fal-missing-key-401.yaml
