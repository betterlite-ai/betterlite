  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L1873-L1938
    why: assemblyai_proxy_route from both decorators (/assemblyai and /eu.assemblyai), the region lookup, the body read and the bare Authorization header.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L3397-L3526
    why: The TinyFish body-field reader, the timeout rule and tinyfish_proxy_route, with every 400, 401 and 403 detail text.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/passthrough_endpoints/tinyfish.py#L1-L55
    why: The field sets, TINYFISH_TIMEOUT_SECONDS and is_allowed_tinyfish_endpoint; B3648 owns them and this task calls them.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/assembly_passthrough_logging_handler.py#L281-L308
    why: The region and base URL functions the AssemblyAI route calls; B3647 owns them.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/fal_ai/cost_calculator.py#L166-L173
    why: fal_ai_passthrough_cost, which decides whether a Fal request is priced; B1531 owns it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_endpoint_router.py#L53-L70
