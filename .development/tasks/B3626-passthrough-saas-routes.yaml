id: B3626
title: Pass-through Fal AssemblyAI and TinyFish routes
description: >-
  Build three provider pass-through routes in crates/betterlite-server as the module passthrough_saas_routes, and register them with axum in that module. Each route checks its inputs, looks up one provider key, builds the upstream URL and hands the request to B3615's create_pass_through_route handler. The handler is called with the request, the response and the authenticated key, and its result is returned unchanged. All three routes need a valid virtual key (B052's authentication, the same as LiteLLM's user_api_key_auth dependency). Shared helpers are not built here: B3618 owns provider_target_url and request_is_streaming, B3602 owns get_credentials, B1100 owns the request body read. Names below are at most 30 characters.

  Fal route. Paths `/fal_ai/{endpoint}` with the methods GET, POST, PUT, DELETE and PATCH. Steps in order:
  1. Build the target with B3618's provider_target_url. The base is B1531's fal_ai_queue_base (env FAL_AI_QUEUE_API_BASE, default https://queue.fal.run) and the path is the endpoint.
  2. Read the key with get_credentials(custom_llm_provider "fal_ai", region None). Env fallback is FAL_AI_API_KEY. A missing key gives HTTP 401 with detail "FAL_AI_API_KEY is not set and no fal_ai pass-through deployment credentials are configured".
  3. When the endpoint text does not contain the substring `/requests/`, read the request body through B1100 (an empty map when there is none) and call B1531's fal_ai_passthrough_cost with the endpoint text and that map. The endpoint text is the model, so `fal-ai/flux/schnell` is looked up as `fal_ai/fal-ai/flux/schnell`. A None result gives HTTP 400 with detail "fal_ai/{endpoint} has no pricing entry for this request; only priced Fal requests can be submitted through /fal_ai". Paths that contain `/requests/` (status and result polling) skip this check.
  4. Call create_pass_through_route with the endpoint, the target, custom header `Authorization: Key {key}`, custom_llm_provider "fal_ai" and is_streaming_request false.

  AssemblyAI route. Paths `/assemblyai/{endpoint}` and `/eu.assemblyai/{endpoint}` with the same five methods. Steps in order:
  1. Take the region from B3647's `assembly_region_from_url` applied to the full request URL (it gives "eu" only when the URL host is exactly eu.assemblyai.com, else none) and the base URL from B3647's `assembly_base_url_from_region` (https://api.eu.assemblyai.com for "eu", else https://api.assemblyai.com).
  2. Build the target with provider_target_url.
  3. Read the key with get_credentials(custom_llm_provider "assemblyai", region). Env fallback is ASSEMBLYAI_API_KEY.
  4. For POST only, read the JSON body through B1100. If its `stream` field is true, the call is streaming. Every other method is not streaming.
  5. Call create_pass_through_route with the endpoint, the target, custom header `Authorization: {key}` (the bare key, no Bearer prefix) and the streaming flag. custom_llm_provider is not passed, so the call is typed as a generic endpoint. This route has no HTTP oracle case because the AssemblyAI hosts are fixed in B3647 and cannot point at a mock upstream. Its behavior is proven by Rust tests with a fake handler factory.

  TinyFish route. Paths `/tinyfish/{endpoint}` with the methods GET and POST only. Steps in order:
  1. Take the endpoint path as httpx does (query and fragment dropped) and add a leading `/` when missing.
  2. If B3648's is_allowed_tinyfish_endpoint says no for the method and path, answer HTTP 403 with detail "{METHOD} {path} is not an allowed TinyFish Agent passthrough endpoint. Allowed: POST /v1/automation/run, POST /v1/automation/run-async, POST /v1/automation/run-sse, GET /v1/runs/{id}, POST /v1/runs/{id}/cancel."
  3. For POST only, run `tinyfish_body_fields(content_type, bytes)` (this task's decoder, input is the request content type and the cached body bytes from B1100, not a second read of the stream). It returns the set of top-level JSON keys. It returns None, meaning HTTP 400 with detail "TinyFish requests must be a JSON object body sent with Content-Type: application/json.", when the content type is non-empty and B1100's is_json_content_type is false, when the bytes are not valid JSON, and when the JSON is not an object. An empty body gives the empty set.
  4. Still for POST, intersect the keys with B3648's TINYFISH_ENVELOPE_FIELDS (custom_body, stream, query_params). A non-empty result, sorted and joined with ", ", gives HTTP 400 with detail "Request fields [{fields}] are LiteLLM pass-through envelope controls and are not accepted on the TinyFish route. Send the native TinyFish request body; streaming is determined by the endpoint."
  5. Still for POST, intersect the keys with B3648's TINYFISH_RUN_AUTH_FIELDS (use_profile, profile_id, use_vault, credential_item_ids). When the result is non-empty, the path starts with `/v1/automation/` and the setting allow_authenticated_runs is not true, answer HTTP 403 with detail "Request fields [{fields}] run with the shared TinyFish account's saved credentials and are disabled on this proxy. Ask the proxy admin to set TINYFISH_ALLOW_AUTHENTICATED_RUNS=true to allow them." The setting comes from the new config section tinyfish_route (below).
  6. Read the key with get_credentials(custom_llm_provider "tinyfish", region None). Env fallback is TINYFISH_API_KEY. A missing key gives HTTP 401 with detail "TinyFish API key not found. Set the TINYFISH_API_KEY environment variable or add a deployment with use_in_pass_through: true."
  7. Build the target from B3648's resolve_tinyfish_api_base (env TINYFISH_AGENT_API_BASE, default https://agent.tinyfish.ai, https:// added when the scheme is missing) and provider_target_url.
  8. Pick the timeout. When general_settings.pass_through_request_timeout is set (read from B3571's config section), pass no timeout so the operator's value wins. Otherwise pass B3648's TINYFISH_TIMEOUT_SECONDS (1500.0) so a legal 1200 second run is not cut at the 600 second default.
  9. Call create_pass_through_route with the endpoint, the target, custom header `X-API-Key: {key}`, custom_llm_provider "tinyfish" and that timeout. The streaming flag is not passed, so the endpoint decides it (run-sse streams) through the logging and endpoint-type rules of B3600 and B3615.

  Config section. Add crates/betterlite-config/src/sections/tinyfish_route.rs with one setting, allow_authenticated_runs, read from the env var TINYFISH_ALLOW_AUTHENTICATED_RUNS and default false. The value is true only when the trimmed, lowercased text is exactly "true" (LiteLLM's str_to_bool); "1", "yes" and "" are false and an unset var is false. No code outside betterlite-config reads the environment.

  Fuzz. tinyfish_body_fields parses bytes from outside, so add the cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/tinyfish_body_fields.rs (register its [[bin]] in the fuzz Cargo.toml like the existing targets), seed files under crates/betterlite-server/fuzz/corpus/tinyfish_body_fields/, and the test passthrough_saas_routes::tests::replays_corpus that feeds every seed to the same function.

  Tests. Rust tests live in tests.rs under passthrough_saas_routes::tests and use fakes: a recording fake for B3602's credential lookup and a recording fake for B3615's create_pass_through_route factory, so a test sees the exact endpoint, target, custom headers, custom_llm_provider, streaming flag and timeout it was called with. Test groups are fal_route, assembly_route, tinyfish_gate, tinyfish_body, tinyfish_route and tinyfish_timeout.
