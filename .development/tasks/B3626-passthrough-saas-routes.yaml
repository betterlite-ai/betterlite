  - url: https://docs.litellm.ai/docs/pass_through/tinyfish
    why: User-facing description of the TinyFish route.
dod:
  - text: The Fal route builds the target from FAL_AI_QUEUE_API_BASE or the default, answers 401 without a key, answers 400 for an unpriced request outside `/requests/` paths, skips the price check for `/requests/` paths, and calls the factory with an Authorization header of `Key {key}`, custom_llm_provider fal_ai and no streaming.
    proof: [fal-route-tests, oracle]
  - text: The AssemblyAI route picks the base URL from the request host, reads the key for that region, treats a POST body with `stream` true as streaming and no other method as streaming, and calls the factory with a bare Authorization header and no custom_llm_provider.
    proof: [assembly-route-tests]
  - text: The TinyFish route answers 403 for a disallowed method and path, and 405 for methods other than GET and POST.
    proof: [tinyfish-gate-tests, oracle]
  - text: For POST, TinyFish answers 400 for a non-JSON content type, invalid JSON and a non-object body, and 400 naming the sorted envelope fields custom_body, stream and query_params.
    proof: [tinyfish-body-tests, oracle]
  - text: TinyFish answers 403 naming the authenticated run fields on /v1/automation/ paths unless TINYFISH_ALLOW_AUTHENTICATED_RUNS is "true", and forwards them when it is.
    proof: [tinyfish-route-tests, config-tests, oracle]
  - text: TinyFish answers 401 without a key, builds the target from TINYFISH_AGENT_API_BASE or the default, and calls the factory with `X-API-Key`, custom_llm_provider tinyfish and the timeout rule (1500 seconds unless general_settings.pass_through_request_timeout is set, then none).
    proof: [tinyfish-route-tests, tinyfish-timeout-tests, oracle]
  - text: The tinyfish_route config section loads TINYFISH_ALLOW_AUTHENTICATED_RUNS from an injected environment, true only for "true" in any case with surrounding spaces and false for anything else including unset.
    proof: [config-tests, mutants]
  - text: tinyfish_body_fields is the one decoder shared by the route, the fuzz target and the corpus replay, and the corpus has seeds added on this branch.
    proof: [body-fields-corpus]
checks:
  optional: [mutants]
  commands:
    - id: fal-route-tests
      why: the Fal route skips the key check, the price check or the Key header
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_saas_routes::tests::fal_route(::|$)/)'
    - id: assembly-route-tests
      why: the AssemblyAI route picks the wrong region, base URL, streaming flag or header
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_saas_routes::tests::assembly_route(::|$)/)'
    - id: tinyfish-gate-tests
      why: the TinyFish route forwards a disallowed endpoint or answers the wrong status for it
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_saas_routes::tests::tinyfish_gate(::|$)/)'
    - id: tinyfish-body-tests
      why: the TinyFish body check lets a bad content type, bad JSON or an envelope field through
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_saas_routes::tests::tinyfish_body(::|$)/)'
    - id: tinyfish-route-tests
      why: the TinyFish key, target, header or authenticated-field gate is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_saas_routes::tests::tinyfish_route(::|$)/)'
    - id: tinyfish-timeout-tests
      why: the TinyFish timeout ignores the operator setting or the 1500 second default
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_saas_routes::tests::tinyfish_timeout(::|$)/)'
    - id: config-tests
      why: the tinyfish_route section does not load or mis-parses the env flag
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::tinyfish_route::/)'
    - id: body-fields-corpus
      why: the decoder has no fuzz target, no new seed or a failing replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/tinyfish_body_fields)" && test -f crates/betterlite-server/fuzz/fuzz_targets/tinyfish_body_fields.rs && grep -qF "tinyfish_body_fields" crates/betterlite-server/fuzz/fuzz_targets/tinyfish_body_fields.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_saas_routes::tests::replays_corpus$/)'
