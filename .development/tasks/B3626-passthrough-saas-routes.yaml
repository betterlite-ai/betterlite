  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-list-runs-403.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-put-405.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-non-json-400.yaml
