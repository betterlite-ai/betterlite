deviations:
  - what: A POST body on the AssemblyAI route that is not valid JSON gets B1100's 400 invalid_request_error for the request body, and a JSON body that is not an object is treated as not streaming.
    why: LiteLLM calls request.json() and then .get on the result with no handler, so a bad body or a JSON list ends as FastAPI's plain 500. betterlite has one body decoder, as B3618 decided for the generic provider route. Open question in the notes.
  - what: A missing AssemblyAI key sends no Authorization header; LiteLLM sends the text `None`.
    why: The upstream answers 401 in both cases and a literal None token helps nobody. Listed so the architect can veto it.
  - what: The AssemblyAI and Fal request-body reads go through B1100's cached body, and TinyFish reads the cached bytes once.
    why: Python reads request.body() twice because Starlette caches it; betterlite must not consume the stream before the relay does.
out_of_scope:
  - "create_pass_through_route, the relay, logging and cost for these providers: B3615, B3607 and B3647 to B3649 own them; this task only builds the three route handlers and the TinyFish config flag."
  - "AssemblyAI region and base URL functions (assembly_region_from_url, assembly_base_url_from_region), transcript polling and pricing: B3647."
  - "TinyFish field sets, is_allowed_tinyfish_endpoint, resolve_tinyfish_api_base, run records, billing and polling: B3648 and B3649. This task enforces the gates; B3648 defines them."
  - "fal_ai_passthrough_cost and fal_ai_queue_base: B1531."
  - "The other routes in llm_passthrough_endpoints.py and the shared helpers (create_request_copy, relay helpers, provider_target_url): B3618, B3619, B3620 to B3629."
  - "resolve_pass_through_request_timeout and the pass_through_request_timeout setting: B3571; this task only asks whether the setting is set."
pitfalls:
  - "Fal step 3 matches the substring `/requests/` anywhere in the endpoint, not a path prefix, so `fal-ai/flux/requests/abc` also skips the price check."
  - "The Fal 401 check runs before the pricing 400 check, so a request with no key and an unpriced model gets 401."
  - "The Fal price lookup uses the whole endpoint text as the model name (`fal_ai/` plus the endpoint), and the body only matters through `resolution` and `num_images`."
  - "The AssemblyAI region comes from the host of the incoming request URL, not from the `/eu.assemblyai` path, so a call to the proxy at any other host goes to api.assemblyai.com even on that path. LiteLLM does this and so do we; see the notes."
  - "AssemblyAI sends the key as `Authorization: {key}` with no Bearer, and a missing key becomes the text `None` in LiteLLM (a listed deviation sends no header)."
  - "TinyFish checks the endpoint allow-list before it reads the body, so a disallowed GET never touches the body or the key."
  - "TinyFish envelope fields are rejected on every allowed POST path, but the authenticated-run fields are rejected only on paths that start with `/v1/automation/`; POST /v1/runs/{id}/cancel with `use_vault` passes."
  - "tinyfish_body_fields returns the empty set, not None, for an empty body, so an empty POST to /v1/automation/run is forwarded."
  - "A content type of `application/json; charset=utf-8` is JSON for B1100's is_json_content_type; a missing content type is accepted and the bytes are parsed as JSON anyway."
  - "The operator timeout check is `is not None`, so a configured value of 0 still wins over the 1500 second default."
  - "The TinyFish mock upstream in an oracle case should answer without a run_id in the body, so B3649's billing poller has nothing to poll and does not call the mock a second time."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
