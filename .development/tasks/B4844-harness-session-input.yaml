id: B4844
title: Validate harness sessions and resolve model routes and output
description: >-
  Implement SessionConfig normalization, gateway routing, capability checks and output parsing in crates/betterlite-harness. Normalize skill paths and permissions, resolve gateway versus direct model routing using litellm_proxy/ prefixes or litellm.use_litellm_proxy, validate permissions/max_turns/timeout/install parameters, check harness capabilities against config options, and parse final structured output from text.

  SessionConfig holds every per-session parameter normalized and validated: harness, sandbox, model, gateway (GatewayTarget or None), api_key, api_base, instructions, tools, skills (absolute paths with verified SKILL.md manifests), disable_tools, permissions (one of full/read-only/ask/edit), on_approval handler, output schema type, max_turns (>=1), timeout (>0), metadata, harness-specific options and install flag.

  resolve_model_route handles litellm_proxy/<group> prefixes and litellm.use_litellm_proxy to route through the gateway. With no prefix and use_litellm_proxy false, returns (model, None) for direct SDK calls. Otherwise builds GatewayTarget from explicit api_base/api_key or LITELLM_PROXY_API_BASE/LITELLM_PROXY_API_KEY environment variables. Explicit values beat environment, strings are stripped of whitespace, and trailing slashes are removed from the base URL.

  _check_basic validates permissions, max_turns>=1, timeout>0 and rejects install=True with CapabilityUnsupported. _check_options compares the supplied options against the harness config's expected type and raises OptionsMismatch if they mismatch. _check_capabilities guards permissions against the harness: permission modes, ask-mode approval support, output schema support, custom tools, skills and tool filtering. validate calls all three checks and fails the entire session before anything starts.

  build_config normalizes keyword arguments into SessionConfig: converts skill paths to absolute verified paths, resolves model routing, freezes sequences, maps permissions and applies defaults. _context_for builds SessionContext from SessionConfig with a new session UUID. parse_output finds the final JSON object in the text or structured-output JSON field, validates it against the supplied Pydantic model, and returns (parsed_model, None) on success or (None, error_message) on failure.

  Preserve skill-manifest verification (SKILL.md presence), enum-only harness selection, permission-mode whitelist, gateway string normalization (strip and rstrip(/)), interactive mode guards for permissions='ask' without on_approval handler.

