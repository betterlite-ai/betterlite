oracle_cases: []
deviations:
  - what: Gateway URL and key are required when routing through litellm_proxy/ or litellm.use_litellm_proxy=true; missing values raise ValueError instead of failing silently.
    why: Silent fallback would route through a different backend than the user requested. Explicit errors are cheaper than debugging silent divergence.
  - what: Trailing slashes are stripped from api_base; explicit gateway targets must not include the trailing slash.
    why: URL joining and consistency; LiteLLM also removes trailing slashes.
  - what: install=True is rejected immediately with CapabilityUnsupported and requires the binary on PATH in the sandbox.
    why: Runtime environment setup is outside this validation layer. Users must stage their binaries before starting.
  - what: parse_output calls last_json_object from B4831 and uses Pydantic model_validate_json; JSON decoding failures are string error messages.
    why: Pydantic validation matches LiteLLM's behavior and last_json_object is a shared helper.
out_of_scope:
  - Concrete harness configuration selection and handler instantiation. B4846 owns binding the selected harness to a handler.
  - Endpoint construction or route registration. B4841–B4843 own the endpoint server and session lifecycle.
  - Workspace changes, file diffing or snapshot functions. B4831 owns those helpers.
  - Harness-specific transformations or CLI handlers. B4834–B4836 own harness translations; B4839 owns CLI handler lifecycle.
pitfalls:
  - resolve_model_route returns (None, gateway_target) when litellm_proxy/ prefixes the model. The group is the part after the prefix (model[len(LITELLM_PROXY_PREFIX):]), not the original model name.
  - _normalize_skill and _normalize_skills are separate functions; only _normalize_skills handles sequences.
  - PERMISSION_MODES must match LiteLLM's exact set (full, read-only, ask, edit); any typo or case mismatch breaks permission validation.
  - _check_capabilities checks ask-mode without on_approval handler only if not interactive; interactive=true allows ask-mode to work through stream events.
  - parse_output returns (None, error_message) for JSON parse failures, not raising exceptions. OutputInvalid is raised by the turn engine after parse_output returns, if an error is present.
