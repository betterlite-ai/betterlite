  optional: []
  commands:
    - id: new-form-cases
      why: Existing catalog cases pass without the new page mutation and submission transcripts.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/guardrail-forms)"
