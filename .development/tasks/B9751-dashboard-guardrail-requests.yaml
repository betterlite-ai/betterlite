dod:
  - text: Real form creates, nested PATCH clears and deletion round-trip through the retained list and info response shapes.
    proof: [new-form-cases, oracle]
  - text: Team submission, search, review and header controls retain authentication, team visibility and secret masking.
    proof: [new-form-cases, oracle]
  - text: Catalog reads, direct apply, custom-code testing and inline decision questions use the exact page requests and consumed fields.
    proof: [new-form-cases, oracle]
