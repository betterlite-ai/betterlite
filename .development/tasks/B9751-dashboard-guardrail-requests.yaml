deviations: []
out_of_scope:
  - Every unchanged component, helper, test and static garden asset is retained by B9090's verified archive intake; B148 exercises the resulting browser page.
  - B3684/B3685/B3686/B3687/B6670 own all guardrail handler functions; B8667/B8668 own their mounts and the reused HTTP cases. No endpoint is registered here.
  - B8276/B8634 own Decisions, B060 model groups, B007 model listing, B813 teams and B9735 common selector cases.
  - GuardrailSettingsView only renders caller-supplied props; it has no request to implement. Its team/key callers remain B145's.
pitfalls:
  - The guardrail editor uses PATCH, while B104's registry integration uses PUT with a guardrail wrapper.
  - A failed V2 list triggers V1 even for auth failures; test the fallback in the retained browser client without changing the server's successful V2 response.
  - An approve or reject fetch has no JSON body, so adding an empty guardrail object would test a different client request.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
