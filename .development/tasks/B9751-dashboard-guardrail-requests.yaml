id: B9751
title: Exercise the retained guardrail forms and team review requests over HTTP
description: >-
  Add only missing HTTP contracts for the guardrails page retained by B9090. No React
  source, guardrail implementation or route registration is ported here. Use B9750's
  database.seed.dashboard: {} plus dashboard_governance: {} and the separate proxy databases, ordinary
  auth principals and HTTP steps/captures. Every request below uses the discovered
  auth_header_name (Authorization by default), Bearer session key and JSON content type.
  GETs and DELETEs have no body; all successful form writes are followed by the page's
  actual list/info read, not a product-repository assertion.

  Read inventory. GuardrailsPanel, GuardrailSelector and the policy picker call
  getGuardrailsList: GET /v2/guardrails/list with no query, falling back to GET
  /guardrails/list on any failed request. B3684 builds both; B8667 mounts them.
  guardrail_info GETs /guardrails/<id>/info, the alias of GET /guardrails/<id>, also B3684.
  Read guardrails[] or the unwrapped info record: guardrail_id,guardrail_name,
  litellm_params,guardrail_info,guardrail_definition_location,created_at,updated_at.
  Nested params drive mode,default_on, provider and editable fields. AddGuardrailForm,
  GuardrailProviderFields and detail GET /guardrails/ui/add_guardrail_settings and
  /guardrails/ui/provider_specific_params (B3684/B8667). They read supported_entities,
  supported_actions,supported_modes,supported_modes_by_provider,pii_entity_categories,
  decision_model_providers and content_filter_settings.prebuilt_patterns,
  pattern_categories,supported_actions,content_categories; the provider map consumes
  param,description,required,default_value,options,type,fields,dict_key_options and
  dict_value_type, including optional_params.fields.

  ContentCategoryConfiguration GET /guardrails/ui/category_yaml/<encoded-category>
  reads yaml_content and file_type. CompetitorIntentConfiguration GET
  /guardrails/ui/major_airlines reads airlines[] and displays string names.
  ContentFilterConfiguration POST /guardrails/validate_blocked_words_file sends
  {file_content:<uploaded YAML text>}, not multipart, and reads valid,message,error,errors.
  These three are B3687 handlers mounted by B8668. Reuse B8667's add-settings-body,
  provider-params-body and info-alias-found cases and B8668's category-yaml-found,
  category-json-found, major-airlines and blocked-words-valid cases below. Their planned
  no-query/body shapes already match these reads; do not copy those cases into ui/.

  Write inventory. AddGuardrailForm and CustomCodeModal POST /guardrails (B3685/B8667)
  with {guardrail:{guardrail_name,litellm_params,guardrail_info}}. Ordinary form defaults
  are mode pre_call and default_on false; custom-code mode is an array. Params include
  guardrail plus selected provider fields, optional skip_system_message_in_guardrail and
  skip_tool_message_in_guardrail, PII entity-action maps, content patterns/blocked_words/
  categories/competitor_intent_config, judge_model/criteria/overall_threshold/on_failure,
  decision_model/checks or tool-permission rules/default_action/on_disallowed_action.
  Build cases from the retained form transformations, including one combined content-filter
  payload, one decision-model payload and one tool-permission payload. Use only the actual
  built-in provider names and valid options; provider execution is tested by its own task.
  The form ignores create's response body and refreshes the list; capture guardrail_id only
  to follow the real detail route. Guardrail detail PATCH /guardrails/<id> sends changed
  top-level guardrail_name/guardrail_info and nested litellm_params, with default_on inside
  litellm_params. Clearing optional values sends null; inherit skip-message choices send
  null; clearing filter collections sends empty arrays. CustomCodeModal PATCH sends
  custom_code and only changed name/mode/default_on. B3685 owns PATCH and DELETE
  /guardrails/<id>; deletion also ignores the body and refreshes the list. The page never
  uses PUT /guardrails/<id>, which B104's live-registry case exercises instead.

  Playground POST /guardrails/apply_guardrail (B3687/B8668; server alias /apply_guardrail)
  sends {guardrail_name,text,metadata?}; null language/entities arguments are omitted from
  the body, as is input_type. Read response_text; elapsed time is measured in the browser. Test an explicit
  metadata object as well as omission. CustomCodeModal POST /guardrails/test_custom_code
  (B6670/B8668) sends custom_code,test_input, input_type request or response inferred from
  selected modes, and request_data:{model:"test-model",metadata:{}}. Read success,result
  action/reason/texts/warning/detection_info or error/error_type. Cover a valid local allow
  snippet and compilation failure, then save/read/update it through the actual form paths.
  DecisionTestSection POST /v1/decisions (B8276, mounted by B8634; alias /decisions) sends
  {model,input,questions:[{type:"predicate",name,instructions}]} and reads
  answers[].name,type,probability. Configure an OpenAI decision deployment with a deterministic
  mock reply, including a refusal. B060 GET /model_group/info supplies data[].model_group,
  providers,mode, with evaluation groups used by the decision selector. No query is sent.
  modelAvailableCall GET /models?include_model_access_groups=True reads data[].id; reuse
  B9735's exact selector case rather than adding a second one. B007 owns /models.

  TeamGuardrailsTab GET /guardrails/submissions (B3686/B8668) sends no query for All, or
  status=pending_review|active|rejected and a trimmed search; it never sends team_guardrail
  or team_id filters. Read submissions[] with guardrail_id/name,team_id,status,
  submitted_at,submitted_by_user_id/email,litellm_params and guardrail_info, and summary
  total,active,pending_review,rejected. POST /guardrails/register, also B3686/B8668, sends
  {team_id,guardrail_name,litellm_params:{...extra,guardrail:"generic_guardrail_api",mode,
  api_base},guardrail_info?}, without the create route's guardrail wrapper. It refreshes
  submissions on success. Admin approve/reject POSTs /guardrails/submissions/<encoded-id>/
  approve or /reject with no body (B3685/B8667); status and message are not read before
  refresh. Header controls PATCH /guardrails/<id> separately with litellm_params.
  forward_api_key, headers as an object, or extra_headers as an array. Prove approved and
  rejected submissions, filtered summary counts, masking, and an unrelated team's view.
  TeamDropdown uses B813 GET /v2/team/list?page=1&page_size=20, with team_alias search and
  non-admin user_id when present, reading teams[].team_id/team_alias,page,total_pages.

  At planning time no on-disk HTTP case sent any guardrail, submission, decision or
  model-group request above. B8667/B8668 plan the reused read/catalog cases but only
  database-free mutation/review errors; B8634 plans auth/invalid decision requests.
  B104's planned mutation uses PUT, not the page's PATCH. Missing success transcripts
  live only in this task's directory. Reuse a dependency case if it has materialized with
  the identical request before work starts, reporting the evidence. Assert statuses,
  content-type, complete stable responses and error type/param/code; ignore only message
  wording and individually identified generated IDs/timestamps. Add no helper or decoder.
  Allow roughly 700 case lines; B9090's retained component functions contribute no ported logic.
