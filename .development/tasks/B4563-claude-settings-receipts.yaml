    why: Ownership checks, fingerprinting with SHA256 and JSON serialization, key lookup and mutation functions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L463-L500
    why: Receipt and claim generation, including previous-value retention and endpoint capture for credentials.
