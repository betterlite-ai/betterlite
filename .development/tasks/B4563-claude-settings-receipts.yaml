id: B4563
title: Claude configuration ownership receipts and safe undo
description: >-
  Build per-field fingerprints and the configure/unconfigure transaction sequence in
  tools/management-cli/src/claude_settings/receipts.rs as a Rust submodule extending B4562's claude_settings
  module. Persist receipt records that capture what each setting held before configuration and what betterlite
  wrote, so unconfigure can restore only the values betterlite still owns. When a user edits a setting between
  configure and unconfigure, the fingerprint no longer matches and that setting is left alone. Credential slots
  record the ANTHROPIC_BASE_URL endpoint they were issued for; during unconfigure, put credentials back only
  if the restored settings still point to the same server, else withhold them in a trimmed receipt for a later
  unconfigure attempt (when the URL changes back). The transaction sequence writes a receipt file before touching
  settings, and if settings write fails after receipt lands, the file never describes settings that were not written.
  Build the OwnedValue contract (present flag and JSON value), ConfigureReceipt and related outcome types,
  and the ownership check, fingerprinting, transaction and restoration logic. Preserve the ability to detect
  when a configure succeeded despite an unconfigure failure (receipt describes a state, settings may differ),
  and distinguish retryable unconfigures from failed ones without claiming the two file renames are atomic together.

scope:
  paths:
    - tools/management-cli/src/claude_settings/receipts.rs
    - tools/management-cli/src/claude_settings/receipts/**
  lint_tables: false

