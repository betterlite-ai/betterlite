id: B4563
title: Claude configuration ownership receipts and safe undo
description: >-
  Build per-field fingerprints and the configure/unconfigure transaction sequence in
  crates/betterlite-cli/src/claude_settings/receipts.rs as a Rust submodule extending B4562's claude_settings
  module. Persist receipt records that capture what each setting held before configuration and what betterlite
  wrote, so unconfigure can restore only the values betterlite still owns. configure_claude_settings resolves
  the settings path, its receipt path and its owners through B4562's claude_settings_path, configure_state_path
  and settings_file_owners, calls B4562's refuse_while_owned before touching anything, builds the new document
  with B4562's merge_claude_settings (passing the status-line command B4562's install_statusline_script returns),
  and commits both files through B192's staged private JSON write and commit operations, called behind an
  injected trait so a test can make one commit fail without touching a real filesystem. When model is UnpinModel,
  configure first clears the model paths an earlier receipt still owns (the same fingerprint check unconfigure
  uses) before merging, so a model the user pinned by hand, which never matches the earlier receipt, is left
  alone. When a user edits a setting between configure and unconfigure, the fingerprint no longer matches and
  that setting is left alone. Credential slots record the ANTHROPIC_BASE_URL endpoint they were issued for;
  during unconfigure, put credentials back only if the restored settings still point to the same server, else
  withhold them in a trimmed receipt for a later unconfigure attempt (when the URL changes back). The transaction
  sequence commits the receipt before the settings file, and when the settings commit then fails, re-stages the
  earlier receipt (which may itself fail) rather than leaving a receipt that describes settings nobody wrote.
  Build the OwnedValue contract (present flag and JSON value), ConfigureReceipt and related outcome types, and
  the dotted-path lookup, mutation, ownership-check, fingerprinting, transaction and restoration logic receipts.rs
  owns on top of B4562's settings document. Preserve the ability to detect when a configure succeeded despite
  an unconfigure failure (receipt describes a state, settings may differ), and distinguish retryable unconfigures
  from failed ones without claiming the two file renames are atomic together.

scope:
  paths:
    - crates/betterlite-cli/src/claude_settings/receipts.rs
    - crates/betterlite-cli/src/claude_settings/receipts/**
  lint_tables: false

