    why: Receipt deserialization and preflight validation before configure/unconfigure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L520-L584
    why: Configure transaction sequence, unpinning, receipt staging, dual-write with rollback on partial failure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L586-L645
    why: Unconfigure restoration, endpoint matching, credential withholding and receipt trimming.

dod:
  - text: >-
      OwnedValue holds a present flag and a JSON value, and ConfigureReceipt holds file_existed, env_present,
      env_was_object, and the previous, written and endpoints maps keyed by dotted setting path (env.X or a bare
      top-level key); the fingerprint in written is a SHA-256 hash of the canonical, key-sorted JSON of the
      OwnedValue betterlite wrote, so the same value always hashes the same regardless of map order.
      configure_claude_settings, unconfigure_claude_settings, read_configure_receipt and preflight_claude_settings
      are the module's public functions; every other helper stays private to receipts.rs.
    proof: [configure-records-ownership]
  - text: >-
      Configure captures each path's previous value once, at the first configure, and carries it through repeats
      as long as the live value still matches that path's fingerprint; once the live value stops matching (the
      user edited it), the next configure captures the edited value as the new previous baseline. Configure also
      captures the ANTHROPIC_BASE_URL endpoint beside each credential path (env.ANTHROPIC_AUTH_TOKEN,
      env.ANTHROPIC_API_KEY, apiKeyHelper) for later endpoint matching.
    proof: [configure-records-ownership]
  - text: >-
      When model is UnpinModel, configure clears the model paths (the top-level model key and env.ANTHROPIC_MODEL)
      that an earlier receipt still owns before computing the merged document, so merge_claude_settings starts
      from the unpinned state; a model the user set directly, which does not match the earlier receipt's
      fingerprint, is left alone.
    proof: [configure-records-ownership]
  - text: >-
      Configure stages the receipt and the merged settings document before committing either, through an injected
      commit operation so a test can make one commit fail without touching the real filesystem. The receipt
      commits first; when the settings commit then fails, configure re-stages the earlier receipt (or removes the
      new one when there was none) and returns an error naming the inconsistent state if that re-stage itself fails.
    proof: [configure-records-ownership]
  - text: >-
      read_configure_receipt returns no receipt, not an error, when the state file is absent, and a distinct error
      for a present file that is unreadable or not valid receipt JSON; unconfigure_claude_settings turns a missing
      receipt into its own error naming that there is nothing to undo, while preflight_claude_settings surfaces
      read_configure_receipt's own errors before configure or unconfigure runs, with no receipt required to exist yet.
    proof: [receipt-reading-distinguishes-failures]
  - text: >-
      Unconfigure restores a path from the receipt's written set only when the live setting still matches that
      path's fingerprint; every other owned path the user edited since configure, and that is still present in
      the live settings, is reported as kept, not restored, and left exactly as the user set it.
    proof: [unconfigure-restores-fingerprint-matches]
  - text: >-
      Restoring every owned path to an empty settings document deletes the settings file only when it did not
      exist before the first configure; otherwise unconfigure writes back an empty document, or just the minimal
      env object env_was_object recorded, and the returned UnconfigureOutcome's file_removed flag matches which
      one happened.
    proof: [unconfigure-restores-fingerprint-matches]
  - text: >-
      Unconfigure withholds a credential path when the receipt's previous value for it is present and the restored
      settings now point at a different ANTHROPIC_BASE_URL than the endpoint the receipt captured for it; when both
      endpoints are absent (the default Anthropic endpoint on both sides), the credential is restored, not withheld.
      WithheldCredential records the key and a readable form of the endpoint it was withheld for, and
      UnconfigureOutcome separates restored, kept and withheld paths plus whether the file was removed.
    proof: [withheld-credentials-reported]
  - text: >-
      A withheld credential's path stays absent from the restored document and leaves a trimmed receipt behind that
      records only the withheld paths, each with the fingerprint of an absent value, so a later unconfigure sees
      the key is still absent, the endpoint is still recorded, and restores it once the live settings point at that
      endpoint again.
    proof: [withheld-credentials-reported]

checks:
  optional: []
  commands:
    - id: configure-records-ownership
      why: configure does not compute a stable fingerprint, does not carry a receipt's previous value and endpoint across repeats, does not clear an owned model pin before merging, or does not stage the receipt before settings with rollback on a failed settings commit
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::receipts::.*configure/) - test(/^claude_settings::receipts::.*unconfigure/) - test(/^claude_settings::receipts::.*read_configure_receipt/) - test(/^claude_settings::receipts::.*preflight/)'
    - id: receipt-reading-distinguishes-failures
      why: read_configure_receipt or preflight_claude_settings treat a missing, an unreadable and an invalid receipt file the same way
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::receipts::.*(preflight|read_configure_receipt)/)'
    - id: unconfigure-restores-fingerprint-matches
      why: unconfigure restores a path whose fingerprint no longer matches the live value, touches a path the user edited and kept, or mishandles the settings file left empty
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::receipts::.*restor/)'
    - id: withheld-credentials-reported
      why: unconfigure puts a credential back at the wrong endpoint, fails to report it as withheld, or does not trim the receipt so a later unconfigure can retry it
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^claude_settings::receipts::.*withh/)'

oracle_cases: []

deviations: []

out_of_scope:
  - Receipt storage/locking and concurrent access patterns. B192 handles staged-file naming and atomic commit; this
    task only reads and writes the receipt through B192's helpers.
  - CLI command parsing and user-facing error messages. B4571 wires configure and reconfigure, calling
    configure_claude_settings and preflight_claude_settings; B4572 wires unconfigure, calling
    unconfigure_claude_settings and reporting withheld credentials from its UnconfigureOutcome.
  - Model-choice type definitions and merge rules. B4562 owns StaticToken, KeepModel, UnpinModel and StartOn; this
    task imports them and uses them in the transaction sequence.
  - Credential renewal, storage and keyring integration. B4574 owns token lifecycle; this task records the endpoint
    a credential was issued for and uses it to gate restoration, but never reads or writes credentials directly.
  - Status-line command resolution. B4562's install_statusline_script resolves and quotes the command this task
    passes into merge_claude_settings; receipts.rs never builds or quotes that command itself.

pitfalls:
  - >-
      Fingerprints are deterministic: the same JSON value always produces the same hash. If a user does not change
      a setting but the internal JSON representation or sort order changes, the fingerprint still matches and betterlite
      will claim ownership. Use JSON canonical form (alphanumeric key order) consistently.
  - >-
      The receipt captures the endpoint (ANTHROPIC_BASE_URL) at configure time. A credential is restored only if the
      restored settings point to the same endpoint value. If the endpoint is absent in either, treat both as "the default
      Anthropic endpoint" and allow restoration; if one is present and one is absent, they do not match and the credential
      is withheld.
  - >-
      Previous values are captured once, at the first configure, and kept through repeats as long as the key still matches.
      If a user edits a key after configure, the repeat captures the user's value as "previous" and starts over, so
      unconfigure would restore the user's version, not the pre-configure one.
  - >-
      Withheld credentials remain in a trimmed receipt with a "not present" fingerprint. This is not an error; it means
      the key was removed from the settings but the receipt still owns the endpoint. A later unconfigure that finds the
      key absent but the endpoint restored can put the credential back.
  - >-
      Settings file may become empty during unconfigure (all keys removed or ENV object removed when it was never there).
      In that case, the file is deleted if it did not exist before configure; otherwise it is written empty or with just
      the minimal ENV object that existed before, depending on env_was_object.
  - >-
      The two file commits (receipt then settings) are not atomic. If the first succeeds and the second fails, the receipt
      on disk describes settings that were not written. Unconfigure will still see the receipt and try to restore, reading
      whatever is actually in the settings file now. The error message tells the user to remove the receipt if this happens.
  - >-
      UnpinModel clears the model paths an earlier receipt owns before merge_claude_settings runs, not after. Clearing
      after merge would erase a model the merge itself just set for a different model choice, and checking the live value
      instead of the receipt's fingerprint would also clear a model the user pinned by hand.
  - >-
      The commit step is a trait the transaction calls, not a direct file write, so a test can fail the settings commit
      after the receipt commit already succeeded without touching a real filesystem. A test double that always succeeds
      never exercises the re-stage-the-earlier-receipt path, so DoD coverage needs a double that fails on its second call.

review_level: security

