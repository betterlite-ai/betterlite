id: B1211
title: Read team callbacks and disable team logging
description: >-
  Implement GET /team/{team_id:path}/callback and POST /team/{team_id}/disable_logging. Both use B124
  get_data(team, find_unique), fail without DB with HTTPException 500 detail.error, and require B800
  TEAM_OR_ORG_ADMIN access. GET delegates a missing team to B1210 _unknown_team_error: proxy admin gets
  404 detail.error, other roles get 403 string detail. Disable returns 404 detail.error for any caller
  when the team is missing, before authorization; do not apply GET's concealment rule to it.

  Disable copies before_metadata, builds TeamCallbackMetadata from callback_settings (default {}),
  clears success_callback/failure_callback to [], writes that object back and clears logging to [].
  Preserve other metadata and other legacy callback fields. Call B2304 encrypt_callback_vars BEFORE
  JSON serialization and the B724 team update, including object_permission in the returned row. Retain
  its prefix idempotence and encryption-failure passthrough rather than writing unprocessed variables.
  A null updated row is 404. Then B801 _refresh_cached_team runs, then B1210 schedules redacted audit
  with litellm-changed-by (default None). Cache/audit failures after SQL do not roll back the update.
  Return status=success, a team-specific confirmation message and data with updated team_id and empty
  success_callbacks/failure_callbacks. GET resolves B1210 callbacks and returns status=success and data
  containing the requested team_id, success_callbacks, failure_callbacks and masked callback_vars.

  Each route's own except block rethrows HTTPException and ProxyException without the generic error log.
  Other exceptions log at error plus debug traceback, then become 500 internal_server_error, param from
  the exception or string None, code 500 (serialized string). Compare FastAPI detail bodies separately
  from ProxyException envelopes; ignore message wording only. Both carry B865's wrapper. GET path IDs
  may contain slashes; disable's single-segment ID route does not have that alias. Use the shared B057
  suffix dispatch contract only at composition, never depend on the B057 umbrella from this part.


  Build the production team_logging_controls module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_callback_endpoints.py:
  disable_team_logging (L586-L716; 93 source lines), get_team_callbacks (L725-L815; 73 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/{team_id}/disable_logging ->
  disable_team_logging; GET /team/{team_id:path}/callback -> get_team_callbacks. B001 HTTP cases compare
  the named response fields, statuses and content-type. B860 inspects encrypted rows and audit effects
  using POSTGRES_TEST_URL, otherwise testcontainers. The changed-by header changes audit identity,
  not a response header, and GET reports team settings without a key-level override.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 166 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  166 production, 245 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 476 changed lines estimated within a 500-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
