deviations: []
out_of_scope:
  - B2304 owns encrypt_callback_vars and ciphertext failure behavior; B1210 masks read and audit snapshots.
  - 'litellm/proxy/management_endpoints/team_callback_endpoints.py: B057 owns add_team_callbacks (L258-L432),
    delete_team_callback (L442-L577).'
  - 'litellm/proxy/management_endpoints/team_callback_endpoints.py: B1210 owns _callback_config_error
    (L59-L60), _validate_team_callback (L63-L66), _redact_callback_secrets (L69-L92), _mask_sensitive_callback_vars
    (L95-L118), _resolve_team_callbacks (L121-L161), _log_audit_task_exception (L164-L176), _emit_team_callback_audit_log
    (L179-L225), _callback_error (L228-L233), _unknown_team_error (L236-L249).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Clearing only callback_settings leaves metadata.logging active; disable must clear both slots before encrypting.
  - Omitting object_permission from the updated row would replace a valid cached relation with null during refresh.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
