  - text: >-
      Tests get_and_disable_no_db, get_missing_team_admin_404, get_missing_team_other_403,
      disable_missing_team_404, scoped_admin_allowed, unrelated_caller_denied, get_slash_team_id,
      list_masked_secrets, logging_shadows_legacy, disable_clears_both_slots,
      disable_preserves_other_metadata, encrypt_before_store, cipher_failure_matches_dependency,
      object_permission_retained, null_update_404, refresh_then_audit, changed_by_audit,
      postwrite_failure_keeps_row, http_error_passthrough, proxy_error_passthrough and generic_error_500
      assert row contents, returned fields and the distinct exception paths.
    proof:
