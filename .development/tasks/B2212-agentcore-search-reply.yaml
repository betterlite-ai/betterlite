pitfalls:
- 'The oracle helper for this task is pre-registered as agentcore_search_reply in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/agentcore_search_reply.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/agentcore_search_reply.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Response format is sniffed from the body, so an SSE content-type does not guarantee the SSE parser runs.
- One empty Mapping in a text result list suppresses a richer structuredContent fallback.
