id: B2212
title: AgentCore search MCP reply parsing
description: >-
  Parse buffered AgentCore Gateway MCP search replies from JSON or SSE and project their result records. This lower
  reply part owns in-band errors and data extraction; B659 owns credential-scoped request preparation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/search/transformation.py:
  _string_field L97-L101; _to_search_result L104-L111; _result_items L114-L118; _parse_result_items L121-L134; _iter_sse_events
  L137-L154; transform_search_response L360-L403; _tool_error_message L405-L409; _text_blocks L411-L417; _parse_mcp_body
  L419-L445.


  Named case contracts: mcp_json_results: Inspect raw text.lstrip prefix, ignoring content-type. Unless starts event:,data:,:,id:
  or retry:, use raw_response.json directly; invalid JSON/nondict decoded shape failures propagate, not silently
  empty. Require dict result and Sequence-not-string/bytes content; keep dict blocks type=text only. Parse each
  string text as JSON; malformed/nonstring block text silently contributes no items. A dict JSON text contributes
  its results field default(), otherwise use parsed sequence directly; retain only Mapping elements. mcp_structured_fallback:
  Flatten items from all eligible text blocks in order; any nonempty text-items tuple, even [{}], suppresses structuredContent.
  Only with no text items use result.structuredContent via same results-or-sequence projection. Do not dedupe, sort,
  truncate or synthesize usage. search_result_fields: Each item: title first nonempty string title else empty; url
  likewise; snippet first nonempty string text then snippet else empty; date first nonempty string publishedDate
  then date elseNone; last_updated=None. Whitespace-only strings count as nonempty. Other fields/types ignored.
  Return SearchResponse object=search,results list in retained order. mcp_sse_results: Split events on regex CR?
  LF followed optional spaces/tabs then CR? LF. Inside each chunk join only column-zero data: line suffixes with
  newline, applying lstrip to each suffix. Empty/malformed/nondict JSON events are silently ignored. Unlike AgentCore
  chat B655, multiline data joins here. Choose FIRST dict event containing result or error key (including None values);
  otherwise last valid event; no ID matching. Leading indentation can trigger SSE sniffing but prevents that indented
  data line from being collected. mcp_sse_no_frame: If SSE sniffing selected but no valid dict event remains, raise
  BedrockError502 message AgentCore gateway returned SSE without a JSON data frame: {first 200 raw text characters},headers
  preserved. Plain invalid JSON remains its original parse error. Unterminated final valid SSE event is accepted.
  mcp_error_precedence: A top-level error value other than None, including empty dict or False, wins over result
  and raises BedrockError with raw status when>=400 else502,headers preserved,message AgentCore gateway MCP error:
  {Python error string}. Otherwise truthy dict result.isError raises same status policy with AgentCore web search
  tool error: {detail}. No independent status rejection: a successful result can be projected at HTTP500. mcp_tool_error:
  Detail is space-join of all string text values from eligible text blocks, including empty strings; a nonempty
  tuple of empty text returns empty detail. If no strings exist, json.dumps(result) truncated to500 characters.
  No JSON parsing of these error text blocks. Preserve source failure category for malformed values rather than
  swallowing every error.


  Implement crates/betterlite-bedrock/src/agentcore_search_reply.rs with adjacent tests under agentcore_search_reply/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agentcore_search_reply_cases in betterlite-bedrock with these exact named cases (one per
  oracle file): mcp_json_results, mcp_structured_fallback, search_result_fields, mcp_sse_results, mcp_sse_no_frame,
  mcp_error_precedence, mcp_tool_error. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/agentcore_search_reply* using HelperCase: kind:
  helper and the externally tagged agentcore_search_reply variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_agentcore_search_reply that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_agentcore_search_reply consumes AgentCore JSON/text response bytes in crates/betterlite-bedrock/src/agentcore_search_reply.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/agentcore_search_reply.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/agentcore_search_reply.
  The adjacent test replays_the_agentcore_search_reply_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 121 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 265 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 645 planned, 650 maximum changed lines.
