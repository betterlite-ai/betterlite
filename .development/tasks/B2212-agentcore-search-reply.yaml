out_of_scope:
- All other functions in search/transformation.py, including credential transport/host checks, constructor, environment,
  URL, request, signing and error factory are B659. Base SearchResult/SearchResponse types belong to B091.
- 'Function ownership inventory litellm/llms/bedrock/search/transformation.py: _gateway_host_match L85-L86; _credential_safe_transport
  L92-L94; AgentCoreSearchConfig.__init__ L158-L160; AgentCoreSearchConfig.ui_friendly_name L162-L164; AgentCoreSearchConfig.validate_environment
