dod:
  - text: 'Model cases name: all_ten_row_fields, create_request_required_and_optional,
      update_request_field_presence, list_response_structure, delete_response_structure,
      metadata_json_serialization, null_vs_absent_metadata.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Access cases name: admin_unrestricted_view, non_admin_user_visibility,
      non_admin_team_visibility, non_admin_or_visibility, identity_less_no_match,
      personal_ownership_allowed, team_row_requires_admin, team_row_allows_org_admin,
      team_lookup_failure_denies, team_access_check_failure_denies, admin_scope_override,
      non_admin_scope_mismatch_403, non_admin_orphan_creation_400, admin_orphan_allowed,
      null_does_not_erase_caller_identity.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Key filter cases name: search_precedence_over_prefix_and_key,
      search_matches_key_prefix, search_matches_exact_memory_id, key_prefix_startswith,
      key_exact_match, empty_string_filter_remains, none_filter_returns_none.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Unique violation cases name: typed_p2002_code, substring_detection,
      global_key_uniqueness, create_duplicate_409, upsert_race_detection, invisible_duplicate_409,
      visible_duplicate_recheck_write_access.'
    proof: [behavior-tests, helper-python, oracle]
  - text: 'Error cases name: missing_database_500, lookup_failure_logs_and_500,
      create_failure_logs_and_500, update_failure_logs_and_500, delete_failure_logs_and_500,
      visibility_helper_suppresses_404_only, team_admin_check_logs_and_denies.'
    proof: [behavior-tests, helper-python, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Access and key-filter logic, scope resolution, unique detection and error wrapping must pass.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^memory_records::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The helper adapter must invoke pure access/filter/scope functions without database mocks.
      run: test -f tools/oracle/helpers/b4530.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: New memory_records seeds must reach the shared typed helper envelope corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/memory-records-*")" && grep -rlq memory_records tools/oracle/fuzz/corpus/helper_case/memory-records-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/memory-records/models-and-defaults.yaml
  - tools/oracle/cases/helpers/memory-records/visibility-and-ownership.yaml
  - tools/oracle/cases/helpers/memory-records/key-filtering.yaml
  - tools/oracle/cases/helpers/memory-records/scope-resolution.yaml
  - tools/oracle/cases/helpers/memory-records/unique-and-errors.yaml
deviations: []
out_of_scope:
  - 'litellm/proxy/memory/memory_endpoints.py: B133 owns all five routes (create_memory, list_memory, get_memory,
    upsert_memory, delete_memory) and the router declaration. This task owns only the helpers they call.'
  - 'litellm/proxy/memory/__init__.py: Empty package initializer; zero lines, no ownership work.'
pitfalls:
  - 'The oracle helper for this task is pre-registered as b4530 in the server group. Replace the stub Op in tools/oracle/src/helpers/server/b4530.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/b4530.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Visibility filter returns None (no restriction) for admins; non-admins get an explicit where clause.
  - _find_visible_memory_or_none catches only 404 from the scoped lookup; other exceptions propagate.
  - Upsert race requires re-read and re-check authority before update, not a blind atomic upsert.
  - Team admin checks log and return false on any error, not granting access or retrying.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
