id: B4530
title: Memory records, visibility and write authorization
description: >-
  Build betterlite-server::memory_records with typed memory row models, request decoders, and visibility/authorization helpers
  for the memory API routes. Consume betterlite-auth principals (B732), betterlite-db repositories (B726), team repositories (B724),
  team-access decisions (B800), and the admin-view predicate (B3079). Keep these helpers below the routes B133 builds and preserve
  the distinction between read and write authorization: visibility filters restrict reads while mutation checks enforce ownership.

  Row models: LiteLLM_MemoryRow carries memory_id, key, value, metadata (optional JSON), user_id/team_id (scoping), created_at,
  created_by, updated_at, updated_by. MemoryCreateRequest requires key and value, with optional metadata and overridable user_id/team_id
  (admin-only). MemoryUpdateRequest makes value and metadata both optional, captures field-presence awareness for updates, and also
  includes user_id/team_id for admin PUT-create. MemoryListResponse and MemoryDeleteResponse model the collection and delete responses.
  All JSON metadata is stored as string via json.dumps and deserialized on read; the row projection returns all ten named fields including
  nullable audit fields.

  Visibility: non-admin callers see rows where (user_id matches caller OR team_id matches caller); admins (PROXY_ADMIN and PROXY_ADMIN_VIEW_ONLY)
  see all rows. Callers matching neither user_id nor team_id see no rows. A visibility filter returns None for admins (no restriction) or a Prisma
  where clause for non-admins. The list operation preserves separate OR predicates under AND with the key filter so search cannot expand visibility.

  Ownership/mutation: PROXY_ADMIN always allowed. Personal ownership (row.user_id == caller.user_id) always allowed. Pure team rows (row.user_id is None,
  row.team_id set) require team/org-admin approval via team_access.allows() check. Anything else is 403. Team lookup/access-check failures log and deny,
  returning 403 without granting access or falling back. Team admins are roster members with role admin or organization admins for that team's organization.

  Scope resolution on creation: admin may override user_id/team_id; non-admin must match their own (or omit). Defaults match the caller's identity.
  Identity-less creation (both user_id and team_id null) is rejected for non-admins with 400; admins may create global rows. Non-null null-override attempts
  (admin passing null to clear a non-null caller identity) are not permitted—omitted fields default to caller.

  Key filter precedence: search (key prefix OR exact memory_id), then key_prefix (key prefix), then key (exact match). Empty string remains a supplied filter.
  Unique key is global, not scoped; duplicate creates return 409 regardless of visibility. Upsert races: when PUT-create gets a unique violation, reread within
  visibility, return 409 if invisible, otherwise recheck _assert_write_access and update by memory_id. Do not use blind atomic upsert; the recheck is required.
  Missing row on final PUT/DELETE returns 404.

  Unique violation detection: prefer typed error code P2002, fall back to substring matching (P2002, Unique, unique, UniqueViolation) for robustness.
  Database errors on lookup, create, update, delete log and surface as HTTP 500 with a generic detail to avoid leaking connection/table metadata.
  _find_visible_memory_or_none suppresses only 404 from scoped lookup and returns None on that case; other failures raise.

  Production code sizing: 134 lines of owned helper functions + 75 lines of supporting declarations (imports, TypedDict filters, models) = 209 counted lines.
  Preserve all function boundaries; no premature extraction. Native behavior tests exercise role-based access (personal vs team vs admin), visibility OR patterns,
  scope-default logic, unique-violation detection, and error wrapping. Helper cases are pure functions only (not routes); raw database and HTTP oracle coverage
  belong to B133's route task. Both require security review.
