id: B3775
title: Headroom retrieval plans and HiddenLayer authentication
description: >-
  Implement Headroom guardrail's agentic retrieval loop that runs after the model's initial response,
  building the plan to follow up with retrieved content when headroom_retrieve tool calls are made.
  Support Responses API, Anthropic Messages API, and OpenAI chat-style completion response formats,
  rebuilding follow-up messages that echo the retrieve tool calls and pair them with their retrieved
  content. Validate retrieved hashes against the per-call issued-hash set from compression (built by B3774)
  to prevent hash forgery: only hashes issued by this request's own compression call are honored, scoped by
  litellm_call_id. Implement _call_retrieve to fetch original content from /v1/retrieve, handling timeouts
  and 404 responses that indicate expired content.


  Build HiddenLayer guardrail authentication for both v1 (HiddenlayerGuardrail) and v2 (HiddenlayerGuardrailV2)
  endpoints. For SaaS deployments (hiddenlayer.ai hostname), acquire a JWT token via OAuth2 client credentials
  flow before the first request and refresh it when a 401 response indicates expiry. Implement is_saas to detect
  SaaS based on URL hostname, and _get_jwt to exchange credentials for tokens synchronously during init. Store the
  refresh lambda for auto-refresh during message evaluation. On-premises deployments skip JWT initialization and
  use no Authorization header.
