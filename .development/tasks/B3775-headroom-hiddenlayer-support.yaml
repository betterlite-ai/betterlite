deviations:
  - what: Hash validation is scoped to hashes issued by the current request's compression call via litellm_call_id, rejecting hashes not in that set.
    why: LiteLLM validates any hash-shaped string found in message text; betterlite prevents hash forgery by only accepting hashes this request issued via compression, per-call validated.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/headroom/headroom.py#L942-L952
  - what: JWT token refresh happens synchronously in the _call_hiddenlayer retry path; if refresh fails, the error is raised to the caller.
    why: LiteLLM acquires JWT tokens synchronously at init so no per-request flow is needed; betterlite reuses this pattern for refresh to keep the integration simple and maintain error transparency.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L254-L259
  - what: On-premises HiddenLayer deployments do not initialize or store a JWT token; the Authorization header is omitted from requests.
    why: JWT is only needed for SaaS; on-premises deployments may use API key in URL, basic auth, or other schemes. Betterlite checks the hostname to decide, following LiteLLM's pattern.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L239-L252
out_of_scope:
  - Tool-call extraction (get_tool_calls_from_response, has_headroom_retrieve_tool, _extract_headroom_tool_calls) provided by B226.
  - Compression service call and message flattening (apply_guardrail's compression path, _call_compress, _flatten_messages_for_compression) provided by B3774.
  - Protected message handling and compression failure details provided by B3774.
  - Issued-hash tracking and pruning (_issued_hashes_by_call_id, _prune_expired_hashes, ccr_hashes recording) provided by B3774.
  - Bypass header detection and background request skipping provided by B3774.
  - Initialization from guardrail registry (owned by B107).
  - ">-
    CustomGuardrail base class lifecycle (CustomGuardrail.__init__, supported_event_hooks, log_guardrail_information decorator):
    Framework base class for guardrail integration; no assigned task owner yet (B104 outline has no task file). Required for initialization and lifecycle; infrastructure dependency."
  - ">-
    HTTP client management (AsyncHTTPHandler, get_async_httpx_client): Infrastructure layer that provides pooled httpx clients with timeout handling;
    no assigned task owner yet. Injected as dependency rather than constructed here."
  - ">-
    Logging utilities (verbose_proxy_logger, add_guardrail_to_applied_guardrails_header): Logging infrastructure; no assigned task owner yet.
    Used as injected dependencies."
pitfalls:
  - ">-
    Hash validation rejects hashes not in the issued-hash set from the current request, scoped by litellm_call_id.
    A hash issued for one request will be rejected if echoed back in a different request, even if it was previously valid."
  - ">-
    Follow-up message construction differs by response format: OpenAI format uses role assistant with tool_calls,
    Anthropic uses tool_use blocks in an assistant message and tool_result blocks in a user message, Responses API uses
    function_call paired with function_call_output."
  - ">-
    JWT token refresh happens only on 401 status in _call_hiddenlayer; other status codes like 403 or 500 are not
    retried and raise immediately."
  - ">-
    SaaS detection uses hostname matching hiddenlayer.ai; custom deployments with other hostnames skip JWT
    initialization even if credentials are provided."
  - ">-
    Retrieved content is returned as a string or an error message; if the service returns non-string JSON or a
    structure with no original_content field, it is stringified without decoding."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 2
