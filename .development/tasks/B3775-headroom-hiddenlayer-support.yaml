dod:
  - text: Agentic loop runs only when the response contains headroom_retrieve tool calls extracted via get_tool_calls_from_response (from B226).
    proof: [headroom-retrieval-tests]
  - text: OpenAI-format follow-up messages echo the retrieve tool calls with role assistant, paired with tool-result messages keyed by tool_call_id.
    proof: [oracle]
  - text: Anthropic-format follow-up messages rebuild assistant message with tool_use blocks matching the retrieve calls and user message with tool_result blocks.
    proof: [oracle]
  - text: Responses API follow-up items pair each retrieve function_call with a matching function_call_output by call_id.
    proof: [oracle]
  - text: Assistant text from the response is preserved and included in follow-up messages unless empty.
    proof: [oracle]
  - text: Retrieved content is fetched by calling _call_retrieve with hash and optional query parameter from the tool call arguments.
    proof: [headroom-retrieval-tests]
  - text: Hash validation rejects hashes not in the per-call issued-hash set scoped by litellm_call_id; rejected hashes are logged with warning.
    proof: [headroom-retrieval-tests]
  - text: Timeout and connection errors in _call_retrieve log a warning and return an error message string without raising.
    proof: [oracle]
  - text: HTTP 404 responses return an error message indicating hash expiry; other status codes log a warning and return an error message.
    proof: [oracle]
  - text: Model name from the response is forwarded in the agentic loop plan when available from logging object; falls back to request model.
    proof: [oracle]
  - text: max_tokens parameter is forwarded from anthropic_messages_optional_request_params when present, falling back to kwargs.
    proof: [oracle]
  - text: Optional parameters from anthropic_messages_optional_request_params are forwarded except max_tokens, which is handled separately.
    proof: [oracle]
  - text: On-premises HiddenLayer deployments (non-SaaS hostname) skip JWT token initialization and send no Authorization header.
    proof: [oracle]
  - text: SaaS HiddenLayer deployments (hiddenlayer.ai hostname) require both api_id and api_key, raising RuntimeError if either is missing.
    proof: [hiddenlayer-auth-tests]
  - text: JWT token is acquired synchronously via OAuth2 client credentials flow during constructor using credentials from config or environment.
    proof: [hiddenlayer-auth-tests]
  - text: JWT token refresh is stored as a lambda function for later invocation when 401 response indicates token expiry.
    proof: [hiddenlayer-auth-tests]
  - text: _call_hiddenlayer catches HTTPStatusError with status 401, calls refresh_jwt_func to get a new token, and retries the request with the new token.
    proof: [oracle]
  - text: Authorization header is set to "Bearer {jwt_token}" when jwt_token is present in both v1 and v2 HiddenLayer guardrails.
    proof: [oracle]
  - text: Timeout parameter passed to constructor is used for JWT token acquisition; defaults to 30 seconds if not provided.
    proof: [hiddenlayer-auth-tests]
