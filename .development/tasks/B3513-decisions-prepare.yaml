oracle_cases: []

deviations:
  - what: drop_params is checked as `litellm.drop_params is True or normalize_drop_params(kwargs.get("drop_params")) is True` using the same normalization LiteLLM does.
    why: betterlite follows LiteLLM's parameter dropping logic exactly, allowing both module-level and per-call drop_params settings.

out_of_scope:
  - B3514 owns sending the DecisionsCall (asend and send functions, handler calls).
  - B3515 owns the public decisions and systemone endpoint entrypoints that call prepare_call.
  - Response formatting, exception mapping and response cost tracking are owned by B3514.
  - Per-provider overrides of request transformation (beyond BaseDecisionsConfig) are owned by their respective provider tasks (B3511 TypeSafe, B3512 Strands, etc.).

pitfalls:
  - safety_identifier is dropped only when the provider does not support it AND (drop_params is true OR the field is not a string). If safety_identifier is a string and drop_params is false, UnsupportedParamsError is raised.
  - canonical_model is a method on provider_config, not a standalone function; it may raise ValueError if the model is unmapped.
  - Request field validation uses pydantic TypeAdapter with deny_unknown_fields, so unknown fields on the request envelope raise ValidationError.
  - The drop_params setting is read from both litellm.drop_params (global) and kwargs.get("drop_params") (per-call); the normalize_drop_params function converts strings "true", "True", 1 to boolean.
  - api_base_env and api_key_env are tuples of environment variable names; resolve_api_base and resolve_api_key iterate through them and return the first non-empty secret, or None if none are found or provided.
  - Provider configs are looked up by provider name through ProviderConfigManager; an unmapped provider name returns None and triggers the "Unknown Decisions provider" error.

review_level: security

