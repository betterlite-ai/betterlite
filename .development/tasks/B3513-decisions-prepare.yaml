id: B3513
title: Prepare decision calls and select their providers
description: >-
  Build decision request preparation and provider selection in crates/betterlite-openai/src/decisions/call.rs, consuming B3510's record types and B3511's provider configs to construct DecisionsCall objects ready for sending.

  prepare_call takes request fields (SystemOne or OpenAI), validates and routes to the correct provider through ProviderConfigManager.get_provider_decisions_config, resolves credentials and api_base through the provider config, and constructs a DecisionsCall with the validated request, intermediate representation, transformed body, and provider-specific context. Request fields carry either SystemOne questions/state or OpenAI questions/input; prepare_call validates them through the provider-specific request adapter, rejects format mismatches (OpenAI input on a SystemOne call or vice versa), and drops safety_identifier when the provider does not support it and drop_params is true; unsupported parameters that cannot be dropped raise UnsupportedParamsError.

  ProviderConfigManager.get_provider_decisions_config returns the concrete config for each provider (Perplexity, TypeSafe, OpenRouter, Cloudflare, Strands, HostedVLLM, OpenAI, AzureAI), and supported_decisions_providers lists the provider names. Provider configs resolve api_base and api_key through environment names and defaults, validate that required credentials are present, and transform requests to provider-specific format. Model names map to canonical forms through the provider config; malformed canonical_model calls raise BadRequestError.

  DecisionsCall carries model (canonical), requested_model (original), provider name, provider config, both original and validated request formats, intermediate representation, transformed request body, resolved api_base and api_key, headers, timeout, logging object and litellm_params. The DecisionsCall is frozen and immutable after construction.

