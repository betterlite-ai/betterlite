deviations:
  - what: >-
      LLMUsage computed properties (uncached_input_tokens, non_reasoning_output_tokens)
      return None when the base token count is None, matching LiteLLM's behavior of
      avoiding zero when the metric is absent.
    why: >-
      Computed token counts are derived only when the primary metric is known; a None
      primary means the provider did not report it. zero for absent metrics would
      be semantically incorrect.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/model/payloads.py#L130-L140
  - what: >-
      GuardrailSpanData.from_logging_entry normalizes GuardrailMode enums and enum lists
      to strings rather than taking raw fields; it reads only StandardLoggingGuardrailInformation
      (provider-agnostic) keys and drops provider-specific fields.
    why: >-
      The canonical OTel payload is provider-agnostic; provider-specific shaping is
      left to the mapper layer that consumes this data structure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/model/payloads.py#L284-L324

out_of_scope:
  - LLM inference spans (LLMCallSpanData, message/choice parsing); B3844 owns full inference payloads.
  - MCP tool spans (MCPToolCallSpanData, MCPListToolsSpanData); B3844 owns those.
  - Response choice parsing and output type detection; B3844 owns those pipelines.
  - Error parsing beyond _parse_error helper; the full error shape is B3844.
  - Span emission and attribute stamping; the mapper owns those, not this task.

pitfalls:
  - max_tokens has a fallback to max_completion_tokens; always check both keys in from_model_parameters.
  - _cache_token_value returns 0 only when all input values are zero or explicit_zero is true and invalid_before_zero is false; it returns None (not 0) when all inputs are None or invalid. Test the priority logic with multiple sources.
  - sanitize_event_metadata uses case-insensitive substring matching for sensitive keys. Both "Authorization" and "authorization" should be filtered.
  - _guardrail_mode_str handles enums, lists, and raw strings; emit enum.value, not str(enum). Join lists with comma (no spaces).
  - ServerInfo.from_api_base returns None when api_base is empty, None, or has no hostname after parsing. Port is None when absent and the scheme is unknown (not http/https).
  - Guardrail start/end times are epoch seconds from the logging entry, not from post-call emission. They override the span's own timing to reflect when the guardrail actually ran.
  - ServiceSpanData.service_name comes from ServiceLoggerPayload.service enum's string value (.value), not the enum repr.
  - Metadata flattening in service_metadata is owned by B3841; this task only filters and bounds the caller-supplied event_metadata dict.
  - cost_in_spend is typed as bool|None; missing values become None, not false. Only explicit False means report-only.

budget:
  max_changed_lines: 1500
  max_new_expects: 0

review_level: standard
