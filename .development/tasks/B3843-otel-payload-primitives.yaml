dod:
  - text: >-
      LLMRequestParams parses temperature, top_p, top_k, max_tokens (with
      max_completion_tokens fallback), frequency_penalty, presence_penalty,
      stop (as tuple), and seed from model_parameters; all fields are optional and
      None when absent or invalid.
    proof: [payload-primitives-usage-tests]
  - text: >-
      LLMUsage parses input_tokens, output_tokens, total_tokens from top-level
      payload fields; cache tokens from nested usage_object (with fallback keys);
      reasoning tokens from completion_tokens_details. uncached_input_tokens
      subtracts cache_creation + cache_read from input_tokens. non_reasoning_output_tokens
      subtracts reasoning_tokens from output_tokens. All computations return None
      when the primary field is absent.
    proof: [payload-primitives-usage-tests]
  - text: >-
      LLMCost parses input_cost, output_cost, cache_read_cost, cache_creation_cost,
      tool_usage_cost, original_cost, discount_amount/percent, and margin_* fields
      from cost_breakdown; all are optional floats, None when absent.
    proof: [payload-primitives-usage-tests]
  - text: >-
      SpanError carries error_type, message, code, stack_trace, llm_provider fields,
      all optional, for any span with a failure. from_logging_entry reads from
      error_information dict and error_str fallback.
    proof: [payload-primitives-error-tests]
  - text: >-
      ServerInfo extracts address and port from api_base URLs; _from_api_base returns
      None when api_base is absent or hostname cannot be parsed. Port falls back to
      scheme defaults (443 for https, 80 for http, None otherwise). urlsplit is used
      for robustness.
    proof: [payload-primitives-server-tests]
  - text: >-
      GuardrailSpanData carries guardrail_name (required string), mode, status, masked_entity_count,
      provider, action, response_json, violation_categories (tuple), confidence/risk scores,
      duration, start/end times (epoch seconds), guardrail_id, policy_template, detection_method,
      usage_json, cost, cost_in_spend (bool|None), and error (SpanError|None). from_logging_entry
      parses StandardLoggingGuardrailInformation only; normalizes mode and enums to strings;
      marks status in _ERROR_STATUSES as errors.
    proof: [payload-primitives-guardrail-tests]
  - text: >-
      ServiceSpanData carries service_name (required, from ServiceLoggerPayload.service enum value),
      call_type, caller, error, and sanitized event_metadata (string-only). from_payload calls
      sanitize_event_metadata to filter metadata from async_service_*_hook(event_metadata=...).
      Service name is the enum's string value, not its repr.
    proof: [payload-primitives-service-tests]
  - text: >-
      ProxyRequestSpanData carries http_method (required), route (required),
      url_path (optional), status_code (optional), and identity (optional).
    proof: [payload-primitives-proxy-request-tests]
  - text: >-
      _cache_token_value merges multiple token sources; prefers the first non-None
      positive value; treats explicit 0 as valid; invalidates negative values
      before an explicit zero (invalid_before_zero flag); returns 0 only when all
      values are zero or the zero-first strategy applies; returns None on failure.
    proof: [payload-primitives-helpers-tests]
  - text: >-
      sanitize_event_metadata keeps only str/int/float primitive values; drops
      non-string keys and keys matching _DROP_METADATA_KEYS (function_*); drops
      any key containing (case-insensitive) sensitive substrings (api_key, token,
      secret, password, cookie, authorization, header, hidden_params); truncates
      values to 1024 chars; stops at 32 items. Returns empty dict on None input.
    proof: [payload-primitives-sanitize-tests]
  - text: >-
      _guardrail_mode_str normalizes GuardrailMode enums to their string values
      (not repr); joins lists/tuples with commas; handles None inputs. Emits enum.value,
      not str(enum) which would include the enum class name.
    proof: [payload-primitives-helpers-tests]
  - text: >-
      _total_masked_entities sums a {entity_type: count} dict map, returning None
      when the sum is zero or the input is not a mapping. Handles non-int values gracefully.
    proof: [payload-primitives-helpers-tests]
  - text: >-
      _dicts extracts dict items from a list (or tuple), returning an empty tuple
      when the input is not a list or contains no dicts. Preserves order.
    proof: [payload-primitives-helpers-tests]
  - text: >-
      _json_or_none serializes value with json.dumps (default=str); strings pass through;
      returns None on any exception (JSONDecodeError, circular references, custom type failures).
    proof: [payload-primitives-helpers-tests]
  - text: >-
      Every named case covers one dataclass and its from_* factory (or helper function):
      LLMRequestParams with all field combinations (absent, None, valid, invalid values);
      LLMUsage with token caching scenarios; LLMCost with sparse/complete breakdown;
      SpanError with all fields populated and absent; ServerInfo with various api_base formats;
      GuardrailSpanData with _ERROR_STATUSES detection and metadata normalization; ServiceSpanData
      with sanitized metadata; ProxyRequestSpanData; and each helper (_cache_token_value,
      sanitize_event_metadata, _json_or_none, _guardrail_mode_str, _total_masked_entities, _dicts).
    proof: [helper-case-corpus]
  - text: >-
      RequestIdentity and RequestContext are re-exported from betterlite-logging
      so existing litellm.integrations.otel.model.payloads imports keep resolving them.
    proof: [payload-primitives-reexport-tests]

checks:
  optional: []
  commands:
    - id: payload-primitives-usage-tests
      why: LLMRequestParams, LLMUsage, and LLMCost parsing must handle all token and cost fields, token merging, and computed properties correctly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::(request_params|usage|cost)::/)'
    - id: payload-primitives-error-tests
      why: SpanError must parse error information from StandardLoggingPayload with all field fallbacks.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::error::/)'
    - id: payload-primitives-server-tests
      why: ServerInfo must extract address and port from api_base URLs with scheme defaults and robustness to malformed inputs.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::server::/)'
    - id: payload-primitives-guardrail-tests
      why: GuardrailSpanData must parse StandardLoggingGuardrailInformation with enum normalization, error status detection, and metadata handling.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::guardrail::/)'
    - id: payload-primitives-service-tests
      why: ServiceSpanData must parse ServiceLoggerPayload and sanitize event_metadata correctly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::service::/)'
    - id: payload-primitives-proxy-request-tests
      why: ProxyRequestSpanData must carry http_method, route, url_path, status_code, and identity.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::proxy_request::/)'
    - id: payload-primitives-helpers-tests
      why: Helper functions (_cache_token_value, _guardrail_mode_str, _total_masked_entities, _dicts, _json_or_none, sanitize_event_metadata) must implement their exact specifications.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::helpers::/)'
    - id: payload-primitives-sanitize-tests
      why: sanitize_event_metadata must filter sensitive keys, bound counts/lengths, and preserve only primitives.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::sanitize_event_metadata::/)'
    - id: payload-primitives-reexport-tests
      why: RequestIdentity and RequestContext re-exports must resolve correctly.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::model::payloads::reexport::/)'
    - id: helper-python
      why: The independently invoked MIT helper semantics must match the production functions.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3843::/)'
    - id: helper-case-corpus
      why: Oracle helper cases and corpus must replay with the new payload primitives decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/payload-primitives tools/oracle/fuzz/corpus/helper_case/payload-primitives-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

