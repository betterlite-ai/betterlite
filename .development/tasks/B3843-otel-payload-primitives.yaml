id: B3843
title: OTel usage and service payload primitives
description: >-
  Build frozen dataclass types for LLM usage, cost, errors, and service spans.
  Implement request parameter capture (temperature, top_p, max_tokens, stop,
  seed, frequency/presence penalties) parsed from model_parameters. Implement
  LLMUsage with input/output token counts, cache and reasoning token tracking,
  and computed properties (uncached_input_tokens, non_reasoning_output_tokens).
  Implement LLMCost with per-component cost breakdown (input, output, cache,
  discount, margin) parsed from StandardLoggingPayload cost_breakdown. Implement
  SpanError with error_type, message, code, stack_trace, llm_provider. Implement
  ServerInfo parsed from api_base URLs with address/port extraction.

  Implement GuardrailSpanData for guardrail execution spans: guardrail_name,
  mode, status (categorized as _ERROR_STATUSES), masked_entity_count, provider,
  action, response_json (JSON-serialized), violation_categories, confidence/risk
  scores, duration, start/end times (epoch seconds, overriding post-call
  emission time), guardrail_id, policy_template, detection_method, usage_json,
  cost, cost_in_spend flag, and error field for blocking/failed guardrails.
  GuardrailSpanData.from_logging_entry parses from StandardLoggingGuardrailInformation
  only (provider-agnostic), normalizing enum values to strings.

  Implement ServiceSpanData for service call spans: service_name (from
  ServiceLoggerPayload.service enum), call_type, caller, error, and sanitized
  event_metadata (string-only, non-sensitive, length/count bounded). ServiceSpanData.from_payload
  calls sanitize_event_metadata to filter caller-supplied metadata from
  async_service_*_hook(event_metadata=...). Implement ProxyRequestSpanData for
  HTTP proxy request context: http_method, route, url_path, status_code, identity.

  Implement helper functions: _cache_token_value (merges multiple token sources
  with explicit-zero priority); _guardrail_mode_str (normalizes GuardrailMode
  enum to string value, joins list of modes with comma); _total_masked_entities
  (sums a {entity_type: count} map); _dicts (extracts dict items from a list as
  tuple); sanitize_event_metadata (keeps only str/int/float under non-sensitive
  keys, strips secrets/headers/cookies, bounds count to 32 and per-value length
  to 1024); _json_or_none (serializes value or returns None on failure).

  Re-export RequestIdentity and RequestContext from betterlite-logging's otel::model
  so existing model::payloads imports keep resolving them.

scope:
