id: B3465
title: RAG ingest and query HTTP routes
description: >-
  Register the four routes of LiteLLM's rag_endpoints/endpoints.py and write their two handlers, in a new
  module `api::rag_routes` of betterlite-server (crates/betterlite-server/src/api/rag_routes.rs and the folder
  beside it). The routes are POST /v1/rag/ingest and POST /rag/ingest (handler rag_ingest, endpoints.py
  L527-L760), and POST /v1/rag/query and POST /rag/query (handler rag_query, L763-L903). Every route
  authenticates through B003 like the other proxy routes. The handlers are glue: the logic lives in the tasks
  named below, and this task calls them in LiteLLM's order and keeps LiteLLM's error bodies. Read the merged
  code of each dependency first and use its real names. The names below come from the task files and may
  differ a little. If something you need is missing or private, stop and say so in the report, and do not copy
  it. B3465 is the only task that registers these four routes, so axum never sees a duplicate.

  rag_ingest, in this order. 1. Decode the request with B3462's `parse_rag_ingest_request`, which returns
  ingest_options, file_data, file_url and file_id. Its upload scan is B3452's. 2. A caller whose role is
  `internal_user_viewer` (LitellmUserRoles.INTERNAL_USER_VIEW_ONLY) and whose `ingest_options.vector_store`
  has no truthy `vector_store_id` gets HTTP 403 with detail {"error": "internal_user_viewer role can only
  ingest files to an existing vector store. Provide 'vector_store_id' in ingest_options.vector_store."}. An
  empty string counts as missing. 3. Authorize every `vector_store_id` found anywhere in the whole
  ingest_options with B3463's nested-store authorization, which returns the managed stores it resolved, keyed
  by id. 4. Run B884's `is_request_body_safe` on the request's own `vector_store` record with model "" and the
  injected general settings and router. A ValueError becomes HTTP 400 with detail {"error": <message>}. 5.
  `managed_store` is the resolved store whose id equals the record's `vector_store_id`, or none. Merge with
  B3463: the caller options B3463 keeps for that store, then B3463's managed overrides on top, and put the
  result back as `vector_store` in a copy of ingest_options. 6. B3463's provider check on the merged record. A
  returned message becomes HTTP 400 with detail {"error": <message>}. 7. Build the request data with B1103's
  `add_litellm_data_to_request` from an empty map, the request, the general settings, the key identity, the
  version and the proxy config. 8. Log at debug "RAG Ingest - options: %s, custom_llm_provider: %s" with the
  caller's options and the merged provider (default "openai"). 9. Call B3460's `aingest` with the merged
  options, file_data, file_url, file_id, the router and the request data. 10. Log at debug "RAG Ingest -
  Checking database save conditions: prisma_client=%s, response=%s, response_type=%s". When a database is
  attached and a response came back, call B3464's `RagIngestStore::save` with the response mapped to its
  `IngestedFile` (file_id, vector_store_id), the caller's ingest_options (not the merged ones), the key
  identity, the uploaded file info and `store_is_managed` = whether `managed_store` is set. B3464 swallows its
  own errors. For the file info, build B3464's `UploadedFileInfo` from file_data: filename, content_type and
  the byte length of the content, or none when there was no file_data. Otherwise log at warning "Skipping
  database save: prisma_client=%s, response=%s". 11. Return the response as JSON with status 200. A response
  whose status field is "failed" is still a normal 200 body, because B3460 does not raise for it.

  rag_ingest error handling. Any HTTPException-style error (the 400 and 403 above, and the ones B3462 and B3463
  raise) passes through unchanged. Any other error, including everything `aingest` raises after B3460 mapped
  it through B185 and B186, is logged with `verbose_proxy_logger.exception` text "RAG Ingest failed: %s" and
  returned as HTTP 500 with detail {"error": <the error's text>}. The status of the mapped provider error is
  not used here: a provider 429 behind /v1/rag/ingest reaches the client as 500.

  rag_query, in this order. 1. Read the body with B1100's `_read_request_body`. 2. Take model, messages,
  retrieval_config, rerank and stream (default false). 3. Validate in this order, each failure HTTP 400 with
  detail {"error": ...}: model falsy gives "model is required"; messages falsy gives "messages is required";
  retrieval_config falsy gives "retrieval_config is required"; retrieval_config not an object gives
  "retrieval_config must be an object"; no `vector_store_id` key gives "retrieval_config must contain
  'vector_store_id'". "Falsy" means missing, null, "", 0, false, [] or {}, so {} is "required", not "must be an
  object". 4. Call B1067's `reject_caller_embedding_selection_params` on retrieval_config with
  source "retrieval_config". 5. Authorize every nested `vector_store_id` in retrieval_config with B3463. 6.
  `managed_store` is the resolved store for `retrieval_config["vector_store_id"]`. `store_data` is B1067's
  `build_request_data_from_managed_vector_store` for it, or empty when none. Unlike the ingest merge, null
  values in store_data are kept here. `merged_retrieval_config` is retrieval_config with store_data on top, so
  the store wins on conflict. 7. Build the request data with `add_litellm_data_to_request` as in ingest. 8. Log
  at debug "RAG Query - model: %s, vector_store_id: %s, custom_llm_provider: %s". 9. Call B3461's `aquery` with
  model, messages, merged_retrieval_config, `vector_store_params` = store_data, rerank, stream, the router and
  the request data. 10. The response headers come from B004's `get_custom_headers` with the key identity and
  these values read from the response's hidden params, each defaulting to "": litellm_call_id, model_id,
  cache_key, api_base, plus response_cost (no default) and the request data. 11. Not streaming: copy those
  headers onto the response and return it as JSON. 12. Streaming: wrap the call in B004's
  `open_sse_before_first_byte` with `ttft_keepalive_interval(data, router)` as the ping interval. Inside it,
  await `aquery`, then answer with a text/event-stream body made by the shared `select_data_generator` over
  the response, with the same custom headers. The query call runs inside the wrapper, so an upstream error
  still reaches the error handler below.

  rag_query error handling. HTTPException-style errors pass through. Any other error is logged "RAG Query
  failed: %s" and returned with the status from `upstream_status_code` and detail {"error": <text>}.
  `upstream_status_code` (endpoints.py L73-L75) is owned here: it returns the error's `status_code` when the
  error type carries an integer one (B3461 and B185 give provider errors a status), else 500. No other task
  names it. Use the typed error enum's status accessor, not reflection. B3461 keeps the retrieval, rerank,
  completion and billing logic, so this task writes none of it.

  Dependencies come in through a constructor: `RagRoutes` takes the B3460 ingest service, the B3461 query
  service, the B3464 `RagIngestStore` (optional, none when no database is attached), the B003 auth layer and
  the settings B1103 needs. No module-level state. The module registers the routes from the router function
  that B1067 and the other route modules use, in the same style. Tests in `api::rag_routes::tests` use scripted
  fakes for the services and check each branch above, one named test per DoD item.

  Size. The owned LiteLLM code is about 150 nonblank, non-comment lines. Allow 330 implementation, 330 tests,
  and 20 oracle cases of about 25 lines each.

