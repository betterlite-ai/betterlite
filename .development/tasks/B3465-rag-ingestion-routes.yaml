deviations: []

out_of_scope:
  - "B3460 owns aingest and the ingest pipeline, B3461 owns aquery with retrieval, rerank, completion and billing, B3462 owns parse_rag_ingest_request and _secure_uploaded_file, B3463 owns the store-id scan, authorization, option merge and provider check, B3464 owns _build_file_metadata_entry and _save_vector_store_to_db_from_rag_ingest. This task only calls them."
  - "_as_string_keyed_mapping and _response_attr (endpoints.py L66-L70) are Python typing helpers. In Rust the fields are typed, so there is nothing to port, and the other tasks use no such helper."
  - "B7324 owns open_sse_before_first_byte, ttft_keepalive_interval and select_data_generator, B005 owns SSE framing, and get_custom_headers is not built by any task yet. This task calls them."
  - "The upload scanner EicarTestMalwareScanner is chosen by the caller of parse_rag_ingest_request; pass B3452's EICAR scanner, as the route does. B3452 owns the scanner itself."

pitfalls:
  - A provider error behind /rag/ingest becomes HTTP 500 {"detail":{"error":text}}, never the provider's own status, because the ingest handler's catch-all ignores status_code. Only /rag/query uses upstream_status_code.
  - The merged record goes to aingest, but the caller's un-merged ingest_options go to the database save and into the debug log.
  - store_is_managed is whether the authorized store matched the record's vector_store_id, not whether any store was found in the payload.
  - The view-only 403 check runs after parsing and before authorization, and looks only at ingest_options.vector_store.vector_store_id.
  - Ingest drops null values from the managed overrides, but query keeps them; copy each merge as written.
  - Falsy checks in rag_query use Python truthiness for model, messages and retrieval_config only, so retrieval_config {} reports "retrieval_config is required".
  - Error bodies are {"detail":{"error":...}} with no type, param or code, unlike chat errors.
  - The streaming branch awaits aquery inside open_sse_before_first_byte, so the 429 of a streaming query is still decided by upstream_status_code.
  - Never log the merged vector_store record at debug level; it can hold the managed store's credentials. Log the provider only, as LiteLLM's second argument does.
  - A success oracle case reaches the mock upstream through env vars (OPENAI_API_BASE, OPENAI_API_KEY) because api_base is a blocked field in the request record. If B3453 or B3461 do not read them, say so in the report instead of weakening the case.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
