dod:
  - text: >-
      ingest_aliases_and_validation: POST with a bearer key to /v1/rag/ingest and /rag/ingest with a JSON body
      that has ingest_options.vector_store but no file, file_url or file_id gets the same 400 body as LiteLLM on
      both paths. Without a bearer key both paths return B003's 401 envelope before any parsing.
    proof: [route-tests, oracle, new-cases]
  - text: >-
      ingest_rejects_before_provider: a vector_store record with api_key, a nested vector_store_id that is an
      empty string, a custom_llm_provider that is not supported, and a base_url style field that
      is_request_body_safe refuses each give HTTP 400 {"detail":{"error":...}} like LiteLLM, and the fake
      ingest service is never called.
    proof: [route-tests, oracle, new-cases]
  - text: >-
      ingest_view_only_role: a caller with role internal_user_viewer and no vector_store_id gets the 403 body
      from the description. With a vector_store_id it goes on. The ingest service is not called on the 403.
    proof: [route-tests]
  - text: >-
      ingest_managed_store_merge: when the authorized store is managed, caller keys outside the seven allowed
      options are dropped, the store's non-null settings win on conflict, and the merged record (not the
      caller's) reaches aingest, while B3464 save receives the caller's ingest_options and store_is_managed true.
    proof: [route-tests]
  - text: >-
      ingest_success_and_save: with an existing OpenAI vector_store_id and a file_id the route returns the
      200 RAGIngestResponse body like LiteLLM, and the save port is called once with the response's file_id and
      vector_store_id. With no database attached the save is skipped and the warning is logged. A response with
      status "failed" is still 200.
    proof: [route-tests, oracle, new-cases]
  - text: >-
      ingest_unexpected_error_is_500: an error from aingest of any kind, including a mapped provider error with
      status 429, is returned as 500 with detail {"error": text}.
    proof: [route-tests]
  - text: >-
      query_required_fields: missing or empty model, messages and retrieval_config, a non-object
      retrieval_config, and a retrieval_config without vector_store_id each give LiteLLM's 400 message in the
      listed order. {} counts as missing, a string as "must be an object". Both aliases behave the same.
    proof: [route-tests, oracle, new-cases]
  - text: >-
      query_embedding_selection_and_auth: embedding_model, litellm_embedding_model, litellm_embedding_config
      or litellm_credential_name inside retrieval_config is refused with B1067's 400 before any store lookup or
      upstream call. Without a bearer key the 401 envelope comes first.
    proof: [route-tests, oracle, new-cases]
  - text: >-
      query_store_merge: for a managed store the store_data keys overwrite the caller's retrieval_config keys,
      null values included, and aquery receives vector_store_params equal to store_data.
    proof: [route-tests]
  - text: >-
      query_success_headers: a non-streaming query returns the aquery response as JSON with the
      get_custom_headers values (x-litellm-call-id, x-litellm-model-id, x-litellm-response-cost and the rest B004
      builds from the response's hidden params). The oracle case compares the body, status and those headers
      with LiteLLM.
    proof: [route-tests, oracle, new-cases]
  - text: >-
      query_streaming: with stream true the route answers text/event-stream through open_sse_before_first_byte
      with the ttft keepalive interval, with the custom headers on the stream response, and an error raised by
      aquery before the first byte becomes the JSON error response of the next item.
    proof: [route-tests]
  - text: >-
      query_error_status: an aquery error that carries status 429 returns 429 {"detail":{"error":text}}, an
      error without a status returns 500, and an HTTPException-style error passes through unchanged. Compared
      with LiteLLM for an upstream 429.
    proof: [route-tests, oracle, new-cases]

checks:
  optional: []
  commands:
    - id: route-tests
      why: a handler branch, error body or call order of the RAG routes is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::rag_routes::tests::/)'
    - id: new-cases
      why: the RAG routes are not compared through real authenticated HTTP
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/rag-routes)"

