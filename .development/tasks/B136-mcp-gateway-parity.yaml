dod:
  - text: The oracle's reserved MCP fixture path correlates scripted replies with real upstream request ids while preserving ordinary mock behavior, ordered captures and bounded input handling.
    proof: [mock-tests]
  - text: Tools reach configured upstreams through the production registry and ports with the pinned naming, warm-up, authorization, credential precedence, debug headers and managed OpenAPI result/error boundaries, and the separator startup diagnostic runs once without rejecting config.
    proof: [composition-tests, case-files, oracle]
  - text: Prompt and resource round trips preserve their names, URIs, arguments, cached copies and failure shapes through HTTP, and cache disablement causes another fetch.
    proof: [case-files, oracle]
  - text: A live MCP session appears in the management report and admin termination makes its next request fail, while the SSE lifetime test drains after disconnect.
    proof: [composition-tests, case-files, oracle]
  - text: Stateful messages reach the tracing callbacks with their own transport parent and destinations, retain remote trace links only, and restore context after failure or cancellation without changing the HTTP result.
    proof: [composition-tests, case-files, oracle]
  - text: The newly added HTTP transcripts parse and replay through the existing HTTP-case decoder.
    proof: [http-corpus]
checks:
  optional: []
  commands:
    - id: mock-tests
      why: The id transformer or the real mock handoff is absent, or other mock traffic is changed.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^mock::mcp_reply::/)'
    - id: composition-tests
      why: Registry sharing, authorization-before-egress, tracing handoff or SSE shutdown is not exercised through the actual application.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::gateway_parity::/)'
    - id: case-files
      why: There are no newly added MCP integration cases or the shared OpenAPI fixture is absent.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/mcp-gateway-parity)" && test -f tools/oracle/cases/http/mcp-gateway-parity/fixtures/openapi.json
    - id: http-corpus
      why: The HTTP transcripts never reach the production case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/http_case/mcp-gateway-parity-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
