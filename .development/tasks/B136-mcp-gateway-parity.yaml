    - crates/betterlite-server/src/mcp/gateway_parity/**
    - tools/oracle/src/mock/mcp_reply.rs
    - tools/oracle/src/mock/mcp_reply/**
    - tools/oracle/cases/http/mcp-gateway-parity/**
    - tools/oracle/fuzz/corpus/http_case/mcp-gateway-parity-*
  lint_tables: false
