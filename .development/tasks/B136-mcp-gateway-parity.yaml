deviations: []
out_of_scope:
  - "No new mount: B8610 composes areas, B8626 owns REST/preview, B8728 owns MCP transports, B8701 owns toolsets, B9950 owns sessions, B8624/B8702 own OAuth, B8625 owns catalog views and B8627/B8700 own server and per-user mutations."
  - "operations.py functions remain assigned to B8195 scoping/display-name/cache invalidation (including _resolved_to_server), B8196 header/BYOK/OAuth preparation, B8197 listings and nested _fetch_and_filter_server_tools, B8198 execution/logging/local tools and B8199 gateway dispatch/prompt get/resource read/prepare_context."
  - "B8970 owns the remaining manager invocation and separator probe; B8971 owns the missing server.py trace bridge; other manager functions remain B6760-B6765, B4731, B6591-B6592, B4682 and B8460-B8465."
  - "All functions in contracts.py, capabilities.py, tool_outcome.py, result_conversion.py and exceptions.py are B8190; mcp_context.py, client_allowlist.py, elicitation_handler.py and legacy_callbacks.py are B8191; sampling_handler.py is B8192 conversion/preferences and B8193 access/budgets/completion; mcp_debug.py is B8194; cost_calculator.py is B1689; sse_transport.py is B8726; server_resolution.py is B4731; stdio_gate.py is B4716, including the warning caller used by B3211."
  - "utils.py belongs to B6594 naming/env/merge/synthetic request, B4716 validators, B4682 prefix splitting and credential-header sanitization, B4726 header lookup, and B3818 result-content traversal including _flatten_leaf_groups; its identity env values are loaded by B8620 and served by B8720."
  - "discoverable_endpoints.py belongs to B6595 DCR hydration, B7530-B7532 OAuth state/registration/token flow, B7321 root OAuth routes, B7971 browser routes and B7972 discovery metadata; all faults/** functions belong to B7970."
  - "types/mcp.py and types/mcp_server/mcp_server_manager.py contracts are B2305, B6590 and B7943. normalize_upstream_header_name is B4650/B4716 validation; same_header, has_header and without_header are the case-insensitive operations implemented by B4741 credentials; custom_credential_slot is B4683's resolved-header selection; crosses_origin and credential_redirect_hook are the implemented B4744 RedirectGuard reused by B4683. B7943 owns the Python exports."
  - "litellm/proxy/mcp_tools.py get_current_time and get_current_date: no caller at the pin; root mcp_servers.json: no reader at the pin; AGENTS.md contains contributor instructions, not runtime logic. The served litellm/proxy/mcp_registry.json is already B4720, mounted by B8625."
  - "Configured Python local tools and their HTTP cases are B8871/B124, not the unused sample functions; no enterprise-only behavior is implemented."
pitfalls:
  - A successful prefixed OpenAPI protocol call can take the local registry shortcut, so only a bare REST name with server_id proves the manager leaf is connected.
  - The request-id marker is fixture syntax only and must never escape to an upstream client or alter an unmarked response.
  - Prompt and resource caches return copies, so a second HTTP read must not accumulate another alpha- prefix.
  - The existing HTTP oracle reads a response to EOF, so a live SSE GET requires the native concurrent-client test rather than a hanging sequential transcript.
  - A protocol isError result remains an HTTP success and must not be compared as the REST endpoint's 401 challenge.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
