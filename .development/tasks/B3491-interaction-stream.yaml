dod:
  - text: AsyncInteractionStreamIterator accepts response, model, config, logging_obj, litellm_metadata and custom_llm_provider; calls response.aiter_lines() during construction.
    proof: [iterator-construction-test]
  - text: SyncInteractionsAPIStreamingIterator accepts response, model, config, logging_obj, litellm_metadata and custom_llm_provider; calls response.iter_lines() during construction.
    proof: [iterator-construction-test]
  - text: Both iterator constructors extract api_base via get_api_base from model and logging_obj.model_call_details litellm_params.
    proof: [iterator-construction-test]
  - text: Both iterator constructors extract model_id from litellm_metadata["model_info"]["id"] when metadata is present.
    proof: [iterator-construction-test]
  - text: Both iterator constructors call process_response_headers on response.headers for _hidden_params["additional_headers"].
    proof: [iterator-construction-test]
  - text: _process_chunk calls CustomStreamWrapper._strip_sse_data_from_chunk and returns None for empty/None result.
    proof: [chunk-processing-test]
  - text: _process_chunk detects DONE marker (STREAM_SSE_DONE_STRING) and sets self.finished=True.
    proof: [chunk-processing-test]
  - text: _process_chunk parses stripped chunk as JSON and returns None on decode error (logged to verbose_logger).
    proof: [chunk-processing-test]
  - text: _process_chunk passes non-None parsed dicts to transform_streaming_response and returns None for non-dict values.
    proof: [chunk-processing-test]
  - text: _process_chunk detects completion via legacy status="completed" or new event_type="interaction.completed" on transformed response.
    proof: [chunk-processing-test]
  - text: Async iteration protocol (__aiter__, __anext__) calls response.aiter_lines().__anext__() and loops until result from _process_chunk is non-None or finished=True.
    proof: [async-iteration-test]
  - text: Sync iteration protocol (__iter__, __next__) calls response.iter_lines().__next__() and loops until result from _process_chunk is non-None or finished=True.
    proof: [sync-iteration-test]
  - text: AsyncInteractionStreamIterator._handle_logging_completed_response uses asyncio.create_task to dispatch_success_handlers with prefer_async_handlers=True.
    proof: [async-iteration-test]
  - text: SyncInteractionsAPIStreamingIterator._handle_logging_completed_response uses run_async_function for async_success_handler and executor.submit for success_handler.
    proof: [sync-iteration-test]
  - text: Both iterators handle HTTPError during iteration by setting finished=True and raising the error.
    proof: [error-handling-test]
  - text: Completion event is stored and last event wins when multiple completions appear in one stream.
    proof: [multiple-completions-test]
checks:
  optional: []
  commands:
    - id: iterator-construction-test
      why: iterator constructors do not accept required parameters or do not initialize api_base/model_id/headers
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^interactions_streaming::(async_iterator|sync_iterator)_construction/)'
    - id: chunk-processing-test
      why: chunk processing fails, does not parse SSE lines or JSON, or fails to detect completion
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^interactions_streaming::chunk_processing/)'
    - id: async-iteration-test
      why: async iteration does not consume aiter_lines or dispatch success handlers correctly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^interactions_streaming::async_iteration/)'
    - id: sync-iteration-test
      why: sync iteration does not consume iter_lines or dispatch both sync and async success handlers
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^interactions_streaming::sync_iteration/)'
    - id: error-handling-test
      why: iterators do not handle HTTP errors or DONE marker correctly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^interactions_streaming::error_handling/)'
    - id: multiple-completions-test
      why: multiple completion events do not result in last event being stored
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^interactions_streaming::multiple_completions/)'
