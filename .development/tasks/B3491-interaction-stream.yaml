deviations:
  - what: "Async success dispatch uses asyncio.create_task with prefer_async_handlers=True instead of awaiting inline"
    why: "Streaming iteration does not block on completion logging; betterlite preserves the async-only fire-and-forget behavior"
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/streaming_iterator.py#L175-L183
  - what: "Sync success dispatch uses both executor.submit and run_async_function for the two handler types"
    why: "betterlite preserves the dual-path logging from LiteLLM: sync handlers on executor, async via run_async_function bridge"
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/streaming_iterator.py#L242-L256
out_of_scope:
  - "Transform stream response (B3490 owns transform_streaming_response and the event dict structure)."
  - "SSE line stripping and buffering (B005 owns CustomStreamWrapper._strip_sse_data_from_chunk and incremental network read handling)."
  - "Response header metadata processing (B206 owns process_response_headers and header extraction)."
  - "Success handler dispatch mechanics (B250 owns dispatch_success_handlers, async_success_handler, success_handler and their registration)."
  - "API base resolution for non-interaction calls (get_api_base is shared; this task uses it but a named owner elsewhere defines its contract)."
pitfalls:
  - "The completed_response is stored after every completion event, so the last event wins if multiple completion markers appear in one stream; earlier completed_response values are overwritten."
  - "Malformed JSON in an event line is logged to verbose_logger but does not raise an error; iteration continues to the next line."
  - "Empty chunks and blank SSE lines (where _strip_sse_data_from_chunk returns None) do not create events; only non-empty data: prefixes and valid JSON create entries."
  - "Both legacy status=\"completed\" and new event_type=\"interaction.completed\" signal completion; the legacy check is scheduled for removal June 8, 2026."
  - "Async handlers are dispatched as fire-and-forget tasks; the iterator does not wait for logging to finish and returns immediately once the DONE marker is read."
  - "HTTPError during iteration stops the stream and re-raises; the iterator's finished flag is set but no completion logging occurs for errors."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
