id: B3491
title: Decode native interaction streams and log terminal results
description: >-
  Build streaming iterators in crates/betterlite-core::api::interactions for both sync
  and async paths, consuming native SSE response bodies. Decode event lines into JSON,
  pass non-malformed objects through transform_streaming_response, and signal EOF on
  DONE. Store the last completion event (detected by legacy status="completed" or new
  event_type="interaction.completed") and dispatch it through success handlers on
  completion. Preserve response-header metadata extraction and the different success
  dispatch paths for each iterator.

  The constructors accept an httpx response, model name, BaseInteractionsAPIConfig,
  a logging object, and optional litellm_metadata (dict with "model_info" key) and
  custom_llm_provider (str). Extract api_base via get_api_base, model_id from metadata,
  and additional_headers via process_response_headers for the _hidden_params dict.
  Ignore malformed JSON lines and non-object parsed values. The completed_response is
  stored after every completion event, so the last event wins if multiple completion
  markers appear.

  AsyncInteractionStreamIterator implements async iteration (calls response.aiter_lines());
  SyncInteractionsAPIStreamingIterator implements sync iteration (calls response.iter_lines()).
  Both extend BaseInteractionsAPIStreamingIterator. Async dispatches success handlers via
  asyncio.create_task with prefer_async_handlers=True; sync uses run_async_function for the
  async handler and executor.submit for the sync handler.
