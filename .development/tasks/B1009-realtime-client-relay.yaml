checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_client_relay::/)
      - test(/::replays_corpus$/)'
  - id: case-client-tool-output-gate
    why: the client-tool-output-gate behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_client_relay::tests::client_tool_output_gate($|::)/)'
  - id: case-client-response-create
    why: the client-response-create behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_client_relay::tests::client_response_create($|::)/)'
  - id: case-session-update-model-pin
    why: the session-update-model-pin behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_client_relay::tests::session_update_model_pin($|::)/)'
  - id: case-deferred-audio-flush
    why: the deferred-audio-flush behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_client_relay::tests::deferred_audio_flush($|::)/)'
  - id: case-client-close
    why: the client-close behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_client_relay::tests::client_close($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/realtime_client_relay)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/realtime_client_relay.rs && grep -qF "decode_realtime_client_relay"
      crates/betterlite-core/fuzz/fuzz_targets/realtime_client_relay.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::realtime_client_relay::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/realtime_client_relay.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime_client_relay-*)"
      && grep -qE "^[[:space:]]+realtime_client_relay:" tools/oracle/fuzz/corpus/helper_case/realtime_client_relay-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-client-relay)"
