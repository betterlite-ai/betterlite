id: B1009
title: Realtime client relay and session lifetime
description: >-
  Implement _receive_client_message, the whole client_ack_messages loop, bidirectional_forward
  and _close_client at realtime_streaming.py:1309-1589 in betterlite-core::api::realtime_client_relay.
  B1007 checks typed text and tool outputs using pre_call guardrails. B2455 enables transcription
  guardrail VAD policy; B1005 remaps beta session fields only for a GA backend. Apply the provider
  normalizer's outgoing-session patch after that remap, then B1006 logs the actual rewritten message.
  B1124 buffers or drains it and B1110 performs the final transformed send. B1008 runs the other relay.

  Check function_call_output before role=user so tool output cannot bypass policy. A blocked tool
  result is replaced with a JSON-string error marker and delivered before the guardrail's other
  messages. A blocked user text instead sets the pending flag that swallows only the next truthy
  pending response.create. Do not implement the stale comment's proposed instructions rewrite.
  No guardrail policy is inferred from ordinary pre_call/post_call hooks for audio auto-response.

  B901 service realtime_client_relay compares real upstream frames and client close behavior.
  Barriers make concurrent relay completion observable without asserting a scheduler-dependent total
  order. B1004 owns JSON and close-code/reason conversion; B012 redacts close details. No new decoder.
  Source has 184 nonblank/non-comment lines; budget 185 implementation,155 tests,145 transcripts,
  105 service adapters and 30 wiring, 620 changed lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/realtime_client_relay.rs
  - crates/betterlite-core/src/api/realtime_client_relay/**
