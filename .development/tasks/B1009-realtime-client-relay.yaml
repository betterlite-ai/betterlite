references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L1309-L1589
  why: Entire client loop and lifetime coordinator, including both guardrail injection passes and join-on-cancel cleanup.
dod:
- text: >-
    client_text_and_tool_guardrails joins user input_text blocks "a" and "b" as "a b"; other content
    types are ignored. A block drops that original message and swallows the next response.create once,
    clearing the pending flag; a later response.create reaches the provider. A function_call_output with
    role=user is checked as a tool result first. String output stays a string; object output is JSON-encoded
    for checking. On block its output becomes the JSON string {"error":"Tool output blocked by content policy"}
    while item correlation fields survive. It is sent before guardrail cancellation and sets no pending
    response flag, so the next unrelated response.create is forwarded. Empty output skips checking.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    client_guardrail_vad_cannot_be_reenabled injects create_response=false into the first session.update
    while retaining silence_duration_ms=700. GA remapping nests it under audio.input.turn_detection;
    beta backends retain flat fields. Later flat or nested create_response=true is forced false, with
    other fields preserved; nonobject turn_detection is replaced by {create_response:false}. If both
    shapes are absent or null, inject a flat disable which the GA remap carries inward. Without an audio
    transcription guardrail, all supplied VAD values remain unchanged. The first injected flag is marked
    sent only when B1110 returns true; false or failed send does not mark it. A provider patch runs last.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    client_buffer_and_logging_order records rewritten GA/guardrail payloads in pre_call before buffering.
    Append frames before setup are queued. With a pending backlog, the initial session.update goes before
    buffered audio; unrelated frames join the backlog and flush only when setup is complete and no flush
    is active. All arrivals during flushing are buffered. A failed flush retains its queue for the next
    opportunity. Malformed JSON and AttributeError in the rewrite block fall through to logging/forwarding;
    TypeError instead reaches the outer error path and returns CLIENT_DISCONNECTED. Receiver exceptions
    log "Client disconnected: %s" and return None. Backend ConnectionClosed returns BACKEND_CLOSED;
    other loop exceptions log "Error in client ack messages: %s" and return CLIENT_DISCONNECTED.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_bidirectional_lifetime starts both directions and waits for first completion. A client
    disconnect returns without sending a client error/close; a client BACKEND_CLOSED result still awaits
    the backend close record. Backend completion calls _close_client. Every exit cancels and joins both
    tasks, swallowing joined task exceptions without detaching work. Native barriers cover simultaneous
    completion and cancellation; no timeout or extra success log is introduced by the coordinator.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_client_close_redaction relays1000 with no error event. Non1000 emits server_error with
    redacted BackendClose.message, then a legal B1004 client code and UTF-8-safe123-byte reason. Upstream
    code1006 becomes1011; reason="" falls back to the full close message. A secret-bearing reason is
    redacted independently in event and reason. A failed send prevents the subsequent close in this
    particular method and logs "Could not relay the upstream close to the client: %s"; failed close
    gets the same debug log. Both exceptions are swallowed. This differs from refusal helpers that
    attempt close even after a failed notice send.
  proof: [behavior-tests, oracle, service-python]
- text: New client-relay service transcripts cover both directions and the lifetime join barrier.
  proof: [service-corpus, new-cases, oracle, service-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Client policy and lifetime tests must expose bypasses, duplicate responses and unjoined relay work.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_client_relay::tests::/)'
  - id: service-python
    why: Client relay parity must use independent sockets and source execution.
    run: test -f tools/oracle/helpers/realtime_client_relay_websocket.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: service-corpus
    why: The client-relay service variant needs a newly committed parser seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle/realtime-client-relay-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: new-cases
    why: New transcripts must distinguish blocked text, sanitized tool output and relay closure.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-client-relay)"
