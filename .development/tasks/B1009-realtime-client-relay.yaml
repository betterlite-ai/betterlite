id: B1009
title: Realtime client relay
description: >-
  Implement the realtime client-message pump: authorize session updates, translate beta messages, buffer deferred
  audio and run text/tool/transcription guardrails before sending. Integrate with the backend relay through typed
  session state, enforcing source tool-response and response.create ordering.


  Reuse B1004 decode_realtime_contract for _decode_json_object call sites; calling a lower decoder does not define
  another fuzz target.


  Implement crates/betterlite-core/src/api/realtime_client_relay.rs. Use RealtimeClientRelayInput and RealtimeClientRelayResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions client_tool_output_gate, client_response_create, session_update_model_pin,
  deferred_audio_flush, client_close under api::realtime_client_relay::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  The production external-byte decoder is betterlite-core::api::realtime_client_relay::decode_realtime_client_relay(bytes:
  &[u8], limits: &ApiLimits), for json.loads input message at litellm/litellm_core_utils/realtime_streaming.py:1332.
  Place its implementation in crates/betterlite-core/src/api/realtime_client_relay.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/realtime_client_relay.rs passes arbitrary
  bounded bytes to that exact decoder; api::realtime_client_relay::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::RealtimeClientRelay in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_client_relay: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._receive_client_message
  (L1309-L1314); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming.client_ack_messages (L1316-L1563);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming.bidirectional_forward (L1565-L1576); litellm/litellm_core_utils/realtime_streaming.py:
  RealTimeStreaming._close_client (L1578-L1589). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 184 owned nonblank/non-comment/non-docstring Python lines (184 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 204 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 514 total within the 520-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1005 (Realtime beta protocol), B1006
  (Realtime session state), B1007 (Realtime guardrails), B1008 (Realtime backend relay), B1087 (Api boundaries),
  B1110 (Realtime send boundary), B1124 (Realtime setup buffering), B1004 (Realtime contracts). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
