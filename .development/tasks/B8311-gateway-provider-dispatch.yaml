id: B8311
title: OpenRouter, Vercel AI Gateway and Eden AI dispatch
description: >-
  B5830 and B6080 (OpenRouter), B5835 (Vercel AI Gateway) and B6100 and B5838 (Eden AI) build pure configs and leave their call sites to the umbrella. This task owns those call sites. Put them in the module gateway_provider_dispatch of betterlite-provider and plug each arm into the dispatch table through B2230's chat selection and B5360's media and resource selection, the same way B8157 does for the self-hosted providers. Unknown providers still fail as before.


  Settings. Add the config section gateway_provider_keys. It reads the litellm_settings globals api_key, api_base, headers and openrouter_key, and the env vars OPENROUTER_API_BASE, OPENROUTER_API_KEY, OR_API_KEY, OR_SITE_URL, OR_APP_NAME, VERCEL_AI_GATEWAY_API_BASE, VERCEL_AI_GATEWAY_API_KEY, VERCEL_OIDC_TOKEN, VERCEL_SITE_URL, VERCEL_APP_NAME, EDENAI_API_KEY and EDENAI_API_BASE. Every value defaults to None and an empty string counts as unset. The section also fills B6100's EdenAiEnv (api_key from EDENAI_API_KEY, api_base from EDENAI_API_BASE, global_api_key from the global api_key), and every Eden AI config gets that struct.


  _complete_openrouter (main.py L3444-L3518). api_base is api_base, else the global api_base, else OPENROUTER_API_BASE, else "https://openrouter.ai/api/v1". api_key is api_key, else the global api_key, else openrouter_key, else OPENROUTER_API_KEY, else OR_API_KEY. Headers start as {"HTTP-Referer": OR_SITE_URL or "https://litellm.ai", "X-Title": OR_APP_NAME or "liteLLM"}; then the request headers, else the global headers, are laid on top when they are not empty, so a caller can replace either value. Merge OpenrouterConfig.get_config() (B6080) into optional_params: for extra_body, update an existing extra_body map key by key, or set it when there is none; any other key is added only when optional_params lacks it. Call the shared HTTP completion handler with custom_llm_provider "openrouter" and no provider_config. After a successful call, log post_call with the response.


  _complete_vercel_ai_gateway (L3548-L3623). The same shape with other names: base VERCEL_AI_GATEWAY_API_BASE, default "https://ai-gateway.vercel.sh/v1"; key api_key, else the global api_key, else VERCEL_AI_GATEWAY_API_KEY (chat does not read VERCEL_OIDC_TOKEN); headers start as {"http-referer": VERCEL_SITE_URL or "https://litellm.ai", "x-title": VERCEL_APP_NAME or "liteLLM"} in lower case; the config merge uses VercelAIGatewayConfig.get_config() (B5835); custom_llm_provider is "vercel_ai_gateway".


  _complete_edenai (L3626-L3649). api_base is B6100's chat get_api_base(api_base) and api_key is its get_api_key(api_key, else the global api_key). headers are headers, else the global headers. Call the handler with custom_llm_provider "edenai" and provider_config, then log post_call with the resolved key and the response.


  Arms in the completion dispatch: edenai (L5926-L5927), openrouter (L5992-L5993) and vercel_ai_gateway (L5996-L5997).


  Embedding arms in main.py embedding(). edenai (L6597-L6611) calls the shared HTTP embedding handler with api_base, api_key and headers exactly as they came; the base and key come from the config there. openrouter (L6687-L6728) uses the same base, key and referer header rules as chat. vercel_ai_gateway (L6729-L6758) uses the chat base chain, adds VERCEL_OIDC_TOKEN as the last key fallback, and sends the request headers with no referer headers.


  Speech. The edenai arm of speech() (main.py L8319-L8333) sets api_base in litellm_params, passes voice only when it is a string, uses the selected speech config or else B5838's Eden AI speech config, and calls B1084's text to speech handler. Transcription, video and image generation for edenai, and image generation and image edit for openrouter, need no extra code in main.py: build B5838's and B5830's configs where B5360 returns their tags (B5830's get OPENROUTER_API_KEY, OPENROUTER_API_BASE and the global api_key from this section), and B1082, B998 and B999 make the calls.


  Model lists. B5835 and B6100 parse the reply of a GET to "{base}/models". This task sends it with the injected HTTP client and no Authorization header, using the chat base chain of each provider, and returns the parsed ids.


  HTTP oracle cases through the booted proxy prove the parts end to end, since this is the first place a route reaches them: POST /v1/chat/completions for openrouter (check the HTTP-Referer, X-Title and authorization headers the upstream gets), vercel_ai_gateway (lower case referer headers) and edenai models with api_base set to the mock upstream, a streaming openrouter call, and POST /v1/embeddings for openrouter, vercel_ai_gateway with only VERCEL_OIDC_TOKEN set, and edenai. Helper cases cover the key chains and the config merge, and the speech arm's argument building.
