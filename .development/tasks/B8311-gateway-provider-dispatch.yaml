dod:
  - text: The OpenRouter and Vercel AI Gateway dispatch functions resolve base, key and referer headers as LiteLLM does and merge the provider config without overwriting request values.
    proof: [gateway-dispatch-tests, oracle]
  - text: _complete_edenai uses B6100's base and key resolution, passes provider_config and logs post_call.
    proof: [gateway-dispatch-tests, oracle]
  - text: The three embedding arms and the edenai speech arm build the same arguments as LiteLLM, including the VERCEL_OIDC_TOKEN fallback.
    proof: [gateway-dispatch-tests, oracle]
  - text: The models GET for vercel_ai_gateway and edenai goes to the resolved base with no Authorization header.
    proof: [gateway-dispatch-tests]
  - text: The gateway_provider_keys section loads every listed global and env var, with None defaults.
    proof: [gateway-keys-tests]
  - text: Chat and embedding calls for these providers through the proxy return the same status, body and upstream headers as LiteLLM.
    proof: [gateway-cases, oracle]
checks:
  optional: [mutants]
  commands:
    - id: gateway-dispatch-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^gateway_provider_dispatch::/)'
      why: Without the dispatch functions there are no such tests, so the check fails on the base branch.
    - id: gateway-keys-tests
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::gateway_provider_keys::/)'
      why: Without the section its loader tests are missing.
    - id: gateway-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/gateway-providers tools/oracle/cases/helpers/gateway-provider-dispatch)"
      why: Without new case files the oracle proof passes with nothing compared.
oracle_cases:
  - tools/oracle/cases/gateway-providers/openrouter-chat-headers.yaml
  - tools/oracle/cases/gateway-providers/openrouter-stream.yaml
  - tools/oracle/cases/gateway-providers/vercel-chat-headers.yaml
  - tools/oracle/cases/gateway-providers/edenai-chat.yaml
  - tools/oracle/cases/gateway-providers/openrouter-embedding.yaml
  - tools/oracle/cases/gateway-providers/vercel-embedding-oidc.yaml
  - tools/oracle/cases/gateway-providers/edenai-embedding.yaml
  - tools/oracle/cases/helpers/gateway-provider-dispatch/openrouter-key-order.yaml
  - tools/oracle/cases/helpers/gateway-provider-dispatch/extra-body-merge.yaml
  - tools/oracle/cases/helpers/gateway-provider-dispatch/edenai-speech-args.yaml
deviations:
  - what: The post_call log after an openrouter or vercel_ai_gateway call records no api key.
    why: LiteLLM logs openai.api_key there, the OpenAI SDK's module global, which is not the resolved key and has no betterlite counterpart; nothing reaches the client.
  - what: Reply ids LiteLLM generates and token usage estimates are compared as present, not equal, in the HTTP cases.
    why: The ids are random and usage comes from each side's tokenizer.
out_of_scope:
  - "The provider configs and transforms belong to B5830, B5835, B5838, B6080 and B6100; picking a config from the provider name is B2230 and B5360."
  - "The get_llm_provider branches for these providers (get_llm_provider_logic.py) are B209 and B211."
  - "The image, transcription and speech calls are B998, B999, B1082 and B1084; their routes are not added here."
  - "Eden AI Messages (B6100's edenai_messages in betterlite-core) is not wired here, because betterlite-provider does not depend on betterlite-core."
  - "litellm/types/llms/openrouter.py only holds TypedDicts; plain Rust records replace them."
pitfalls:
  - "OpenRouter header names are HTTP-Referer and X-Title, Vercel's are http-referer and x-title; a test must check the exact case."
  - "The request headers replace the referer headers only when they are not empty; an empty map keeps the defaults."
  - "The Vercel chat key chain stops at VERCEL_AI_GATEWAY_API_KEY, while the embedding chain goes on to VERCEL_OIDC_TOKEN."
  - "The extra_body merge updates the request's extra_body in place; other config keys never overwrite a request value."
  - "The edenai embedding arm resolves nothing in main.py: it passes api_base and api_key exactly as they came."
  - "The models GET carries no Authorization header for either provider."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
