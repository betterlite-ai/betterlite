id: B036
title: xAI and Mistral operation bindings with Codestral FIM
description: >-
  Finish the xAI, Mistral and Codestral providers by installing the leaves B1400–B1413
  into B010's closed provider contract and B678's executable operation dispatcher.
  Put bindings in betterlite-provider::xai_mistral and orchestration in
  betterlite-core::xai_mistral; leaf crates receive prepared inputs, never a dependency
  on core. Supply B323's reasoning-effort selector to B1408 and B1001's prepared audio
  to B1407/B1410. Use B249 hooks and B186's existing error classification. Cover chat,
  embeddings, Responses, realtime, speech, transcription, files and native batches only
  where the selected provider has the matching leaf. Expose B1401's login service through
  the provider's auth constructor; B151 still owns the actual CLI. Bind B1402's model and
  usage helpers, B1412's completion records and B1413's execution without another parser.

  Own main.py _complete_xai, _complete_mistral, _complete_text_completion_codestral,
  the Mistral embedding arm, and the xAI arm of responses_api_bridge_check. On xAI
  failure post_call receives the original exception and supplied headers before rethrow.
  Mistral chat resolves key explicit/litellm.api_key/MISTRAL_API_KEY and base
  explicit/litellm.api_base/MISTRAL_API_BASE/https://api.mistral.ai/v1. Codestral FIM
  resolves base explicit, popped optional api_base, popped base_url, litellm.api_base,
  https://codestral.mistral.ai/v1/fim/completions in short-circuit order; unused aliases
  remain in options. Its key is explicit/litellm.api_key/CODESTRAL_API_KEY. Codestral chat
  instead uses B210's CODESTRAL_API_BASE default https://codestral.mistral.ai/v1 and
  B2230's MistralConfig selection. The real loader test xai_mistral_settings covers these
  globals/env keys, absent values and explicit overrides alongside the leaf settings.
  Non-None xAI web_search_options forces B921's Responses bridge and removes every
  responses/ occurrence from the model. Implement MistralEmbeddingConfig's empty defaults
  and encoding_format-only mapping, including an explicit null, over B006 transport.

  Also implement mistral_ocr_guardrail using B104's translation interface and metadata
  projection. Request hooks see a nonempty string document_url or image_url as text;
  ignore their replacement text. Response hooks receive only truthy page markdown and
  write returned texts back to those original indices; short results leave trailing
  pages intact and extra texts are ignored. Include truthy model, preserve request_data,
  and add litellm_metadata only when that key is absent, even if its present value is null.
  Register both ocr and aocr translations. These operations inspect references without
  fetching their content. The OCR provider transport itself stays in B092.

  Exercise existing booted routes, mounting their factories once. Chat and embeddings
  use /v1/{family}, /{family}, /engines/{model:path}/{family} and
  /openai/deployments/{model:path}/{family}, with family chat/completions or embeddings.
  FIM text uses /v1/completions, /completions, /engines/{model:path}/completions and
  /openai/deployments/{model:path}/completions. Responses uses /v1/responses, /responses,
  /openai/v1/responses; realtime uses /v1/realtime, /realtime, /openai/v1/realtime.
  Speech/transcription use /v1/audio/{speech,transcriptions} and /audio/{speech,transcriptions}.
  Files use /{provider}/v1/files, /v1/files, /files, with list/create at the root,
  retrieve/delete at /{file_id:path}, and content at /{file_id:path}/content. Batches use
  /{provider}/v1/batches, /v1/batches, /batches, with list/create at the root, retrieve
  at /{batch_id:path} and cancel at /{batch_id:path}/cancel. OCR uses /v1/ocr and /ocr.
  Use B900 multipart fixtures, B901 websocket cases and B1139 ordered HTTP scenarios;
  assert upstream URL/auth/body, response headers, status and error type/param/code,
  including unauthenticated proxy 401 and native 400/401/429. Ignore only error.message
  with the documented owned-wording reason. Check B1405's 1009 cache limit natively.

  Add pure helper mistral_ocr_translation with fixture guardrails and tagged HelperCase
  seeds; do not call proxy handlers from helper adapters. The owned source spans total
  321 nonblank/noncomment lines including declarations and export shims:
  307 in dispatch, embedding and OCR bodies, the rest initializers. Allocate 325 binding
  and translation lines, 245 behavior/config-test lines, 135 adapter and 75 wiring lines
  within 800. Provider fixtures and HTTP case data are excluded by the repository budget.
scope:
  paths:
    - crates/betterlite-provider/src/{lib,error,provider,operation,prepared,xai_mistral}.rs
    - crates/betterlite-provider/src/xai_mistral/**
    - crates/betterlite-provider/Cargo.toml
    - crates/betterlite-core/src/{lib,dispatch,operation,error,xai_mistral,mistral_ocr_guardrail}.rs
    - crates/betterlite-core/src/{xai_mistral,mistral_ocr_guardrail}/**
    - crates/betterlite-core/Cargo.toml
    - crates/betterlite-openai/src/{lib,mistral_embedding}.rs
    - crates/betterlite-config/src/{lib,settings,providers}.rs
    - crates/betterlite-config/src/providers/{mod,xai_mistral}.rs
    - crates/betterlite-config/tests/xai_mistral_settings.rs
    - Cargo.lock
    - tools/oracle/src/helpers/core_ops/mistral_ocr_translation.rs
    - tools/oracle/src/helpers/core_ops/mistral_ocr_translation/**
    - tools/oracle/helpers/mistral_ocr_translation.py
    - tools/oracle/helpers/mistral_ocr_translation/**
    - tools/oracle/cases/helpers/mistral-ocr-translation/**
    - tools/oracle/cases/providers/xai-mistral/**
    - tools/oracle/fixtures/multipart-oracle/xai-mistral*
    - tools/oracle/fuzz/corpus/helper_case/mistral_ocr_translation*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L2060-L2108
    why: xAI forwarding and its exception logging order.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L2731-L2770
    why: Mistral completion globals and environment precedence.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L3995-L4043
    why: Codestral FIM consumes optional base aliases conditionally.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L1119-L1121
    why: Public xAI search requests select Responses before chat transformation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L6972-L6985
    why: Mistral embedding dispatch delegates to OpenAI embedding execution.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L68-L111
    why: MistralEmbeddingConfig accepts only encoding_format.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/mistral/ocr/guardrail_translation/handler.py#L1-L164
    why: Reference-only input hooks and indexed output markdown replacement.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L695-L699
    why: B210's Codestral chat defaults differ from FIM.
dod:
  - text: Every supplied provider operation reaches its own adapter through the configured proxy aliases.
    proof: [xai-mistral-tests, xai-mistral-settings, oracle]
  - text: Public xAI search switches to Responses and Codestral preserves FIM base consumption order.
    proof: [xai-mistral-tests, oracle]
  - text: OCR translation preserves page positions and existing metadata while exposing reference text to hooks.
    proof: [xai-mistral-tests, mistral-ocr-python, oracle]
  - text: OCR helper seeds select the new typed operation and configuration is accepted by the real loader.
    proof: [mistral-ocr-seeds, xai-mistral-settings]
checks:
  optional: [mutants]
  commands:
    - id: xai-mistral-tests
      run: cargo nextest run --locked -p betterlite-provider -p betterlite-core -p betterlite-openai --no-tests=fail -E 'test(/^xai_mistral::/) | test(/^mistral_ocr_guardrail::/) | test(/^mistral_embedding::/)'
      why: Each binding and the two remaining transformations require executable assertions.
    - id: xai-mistral-settings
      run: cargo nextest run --locked -p betterlite-config --test xai_mistral_settings --no-tests=fail
      why: Provider defaults must survive production configuration loading rather than fixture substitution.
    - id: mistral-ocr-python
      run: test -f tools/oracle/helpers/mistral_ocr_translation.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: The guardrail fixture must invoke OCRHandler and retain its input/output distinction.
    - id: mistral-ocr-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mistral_ocr_translation*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::core_ops::mistral_ocr_translation::/)'
      why: The adapter test parses fresh seeds and asserts call.mistral_ocr_translation with a nonzero count.
oracle_cases:
  - tools/oracle/cases/providers/xai-mistral/chat-and-embedding-aliases.yaml
  - tools/oracle/cases/providers/xai-mistral/search-responses-bridge.yaml
  - tools/oracle/cases/providers/xai-mistral/codestral-chat-and-fim.yaml
  - tools/oracle/cases/providers/xai-mistral/audio-multipart-and-binary.yaml
  - tools/oracle/cases/providers/xai-mistral/native-files-lifecycle.yaml
  - tools/oracle/cases/providers/xai-mistral/batch-poll-cancel-content.yaml
  - tools/oracle/cases/providers/xai-mistral/realtime-event-repair.yaml
  - tools/oracle/cases/providers/xai-mistral/auth-and-provider-errors.yaml
  - tools/oracle/cases/providers/xai-mistral/ocr-hook-aliases.yaml
  - tools/oracle/cases/helpers/mistral-ocr-translation/reference-return-ignored.yaml
  - tools/oracle/cases/helpers/mistral-ocr-translation/sparse-pages-and-short-result.yaml
  - tools/oracle/cases/helpers/mistral-ocr-translation/present-null-metadata.yaml
deviations: []
out_of_scope:
  - B1400–B1413 own the provider files listed by their covers; this entry retains package exports, documentation-only mistral/embedding.py, empty mistral_embedding_transformation.py, OCR translation and the listed shared-file spans.
  - B500's main.py callable inventory remains authoritative for all other dispatchers; only its three named provider dispatchers, Mistral embedding arm and the xAI bridge arm move here.
  - B500 and the OpenAI leaf tasks retain every other class/function in openai/openai.py; MistralEmbeddingConfig is the sole extraction.
  - B004, B006, B202, B080, B083, B1125, B1032, B1033, B1034, B087, B1050, B1051, B1133, B086 and B092 own route factories; this task adds bindings and alias cases without registering routes.
  - B104 owns generic guardrail metadata conversion, B151 the login command and B068 final pricing integration; no managed-file hook is introduced here.
pitfalls:
  - 'The oracle helper for this task is pre-registered as mistral_ocr_translation in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/mistral_ocr_translation.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/mistral_ocr_translation.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The public xAI web_search_options path bypasses the chat leaf's warning-and-drop branch.
  - Existing litellm_metadata=null blocks OCR metadata insertion because the code tests key presence.
  - A FIM api_base override prevents later optional aliases from being popped.
budget: {max_changed_lines: 800, max_new_expects: 0}
review_level: security
