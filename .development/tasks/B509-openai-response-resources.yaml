pitfalls:
- 'The oracle helper for this task is pre-registered as openai_response_resources in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/response_resources.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_response_resources.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- GET/cancel validation happens outside their JSON exception wrapper and has no lax fallback; reusing compact response
  conversion changes failures.
- Only compact edits the URL path structurally; a shared query-aware URL join would alter the other resource helpers.
