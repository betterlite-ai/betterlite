id: B509
title: OpenAI Responses retrieve cancel delete and compact
description: >-
  Provide typed provider methods for GET/DELETE a response, list input_items, POST cancel and POST compact. Encode
  ids with B171 and preserve query parameters while appending compact. Reuse response input/reply models and transport;
  B080 owns public routes and stateful continuation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/responses/transformation.py:
  OpenAIResponsesAPIConfig.transform_delete_response_api_request L761-L777; OpenAIResponsesAPIConfig.transform_delete_response_api_response
  L779-L791; OpenAIResponsesAPIConfig.transform_get_response_api_request L796-L812; OpenAIResponsesAPIConfig.transform_get_response_api_response
  L814-L832; OpenAIResponsesAPIConfig.transform_list_input_items_request L837-L862; OpenAIResponsesAPIConfig.transform_list_input_items_response
  L864-L872; OpenAIResponsesAPIConfig.transform_cancel_response_api_request L877-L893; OpenAIResponsesAPIConfig.transform_cancel_response_api_response
  L895-L914; OpenAIResponsesAPIConfig.transform_compact_response_api_request L919-L951; OpenAIResponsesAPIConfig.transform_compact_response_api_response
  L953-L984.


  Implement crates/betterlite-openai/src/response_resources.rs with adjacent tests under response_resources/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_response_resources in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function response_resources_cases in betterlite-openai with these exact named cases (one per oracle
  file): encoded_response_id, delete_result, get_strict_response, list_default_limit_order, include_comma_query,
  cancel_response, compact_keeps_query, compact_replay_input. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_response_resources* using HelperCase:
  kind: helper and the externally tagged openai_response_resources variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_openai_response_resources that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  Outside-byte boundary: decode_response_resource consumes response resource JSON bytes in crates/betterlite-openai/src/response_resources.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_response_resources.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_response_resources.
  The adjacent test replays_the_openai_response_resources_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 190 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 499 planned, 500 maximum changed lines.
