checks:
  optional:
  - mutants
  commands:
  - id: case-encoded-response-id
    why: The encoded-response-id behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_encoded_response_id$/)'
  - id: case-delete-result
    why: The delete-result behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_delete_result$/)'
  - id: case-get-strict-response
    why: The get-strict-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_get_strict_response$/)'
  - id: case-list-default-limit-order
    why: The list-default-limit-order behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_list_default_limit_order$/)'
  - id: case-include-comma-query
    why: The include-comma-query behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_include_comma_query$/)'
  - id: case-cancel-response
    why: The cancel-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_cancel_response$/)'
  - id: case-compact-keeps-query
    why: The compact-keeps-query behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_compact_keeps_query$/)'
  - id: case-compact-replay-input
    why: The compact-replay-input behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::response_resources_cases::case_[0-9]+_compact_replay_input$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_response_resources.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_response_resources*")"
      && grep -lq 'openai_response_resources' tools/oracle/fuzz/corpus/helper_case/openai_response_resources* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_response_resources$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_response_resources)"
      && grep -q 'decode_response_resource' crates/betterlite-openai/fuzz/fuzz_targets/openai_response_resources.rs
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_response_resources_corpus$/)'
