  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/passthrough/transformation.py#L85-L131
    why: the event stream collector builds its logged response with a sync stream_chunk_builder call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/passthrough/transformation.py#L234-L305
    why: the logged reply picks the chat config from the invoke/ or converse/ model and runs its transform_response with the logging object; the collector picks its decoder from the endpoint.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/common_utils.py#L1563-L1637
    why: get_bedrock_chat_config maps the route, invoke provider and base model to a config.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L8473-L8492
    why: the provider config map sends bedrock to get_bedrock_chat_config and bedrock_mantle to BedrockMantleChatConfig.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock_mantle/passthrough/transformation.py#L53-L71
    why: Mantle logs a converse reply with the Bedrock shape and inherits the rest.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock_mantle/chat/transformation.py#L36-L40
    why: BedrockMantleChatConfig is an OpenAILikeChatConfig.
dod:
  - text: PassthroughChatConfig picks LiteLLM's Bedrock config for an invoke/ or converse/ model and Mantle chat for bedrock_mantle.
    proof: [bedrock-tests]
  - text: A Bedrock or Bedrock Mantle full reply under 400 reaches dispatch_success_handlers as Chat with the transformed ModelResponse, and the transform's post_call record lands on the call's state.
    proof: [bedrock-tests, core-tests]
  - text: A Bedrock or Mantle stream flushes one assembled ModelResponse through the port's collector.
    proof: [bedrock-tests, core-tests]
  - text: The plan and the port share one collector builder and one reply path, the raw-bytes collector has one body, and B10177's row about missing provider responses is gone.
    proof: [no-copies, openai-tests, provider-tests, deviation-rows]
checks:
  optional: [mutants]
  commands:
    - id: bedrock-tests
      why: a port picks the wrong config, loses the usage, blocks on its counter or the SDK call stops logging through it
      run: grep -rq 'fn reply_transform_logs_a_converse_reply' crates/betterlite-bedrock/src/passthrough && grep -rq 'fn sdk_call_collects_a_converse_stream' crates/betterlite-bedrock/src/passthrough && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^passthrough::/) | test(/^invoke_response::/) | test(/^qwen_deepseek::/)'
    - id: core-tests
      why: the call no longer logs the port's reply or stream, or a non-AWS stream lost its raw-bytes collector
      run: grep -q 'fn a_bedrock_stream_flushes_the_port_collector_answer' crates/betterlite-core/src/api/passthrough_call/tests/success.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::passthrough_call::/)'
    - id: openai-tests
      why: the raw-bytes collector or the logging trait changed for the other providers
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^passthrough::/) | test(/^gigachat_passthrough::/)'
    - id: provider-tests
      why: B681's dispatch no longer builds or calls the plan with the widened ports
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^bedrock_interactive_dispatch::/)'
    - id: python-session-tests
      why: the Python session's port lost its new logging methods
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^passthrough_calls::/)'
    - id: no-copies
      why: the plan and the port each build the collector, or the trait default keeps its own raw-bytes literal
      run: test "$(grep -c 'decoder_selection(' crates/betterlite-bedrock/src/passthrough.rs)" -eq 0 && test "$(grep -c 'RawBytesStreamCollector {' crates/betterlite-openai/src/passthrough/transformation.rs)" -eq 1
    - id: deviation-rows
      why: B10177 still says a Bedrock reply has no provider-built logged response
      run: test -z "$(grep -n 'no provider-built logged response' docs/deviations/B10177.yaml)"
oracle_cases: []
deviations: []
out_of_scope:
  - "Azure, Azure AI and GigaChat assembly, the bundled counter and assemble_collected: B10186."
  - "The Bedrock tags no invoke/ or converse/ model reaches (ClaudePlatform, OpenAi, RuntimeChatCompletions, InvokeAgent, AgentCore, Mantle): LiteLLM's pass-through never builds their configs either."
  - "A production AWS credential chain: B10166 passes NoCredentialChain."
pitfalls:
  - "passthrough.rs has 197 lines and B10166 adds sdk_call; the ports go in their own files and passthrough.rs only declares them."
  - "The route selector's empty catalog is safe only because the model starts with invoke/ or converse/; never call PassthroughChatConfig with a bare model."
  - "Convert serde values with serde_json::to_value and from_value, never through from_str: arbitrary_precision is on in these crates."
  - "now_or_never answers Pending as an error; no block_on, block_in_place or new runtime."
  - "Widening the reasoning bounds keeps the fuzz target (crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_invoke_response.rs L153) compiling, since Infallible implements Display."
  - "The logging state the transform borrows comes from the PassthroughLog guard logged.rs already holds; do not lock the log a second time."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
