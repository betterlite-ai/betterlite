id: B3015
title: Initialize and mutate reservation spend counters
description: >-
  Extract betterlite-auth::spend_writes for warm-counter detection, initial floors, TTL renewal, increments and invalidation through separate raw and invalidate-on-error pipelines. Implement initialization, mutation and cleanup of spend counters across Redis and in-memory layers with deferred post-call settlement.

  _ensure_spend_counter_initialized and _ensure_window_spend_counter_initialized warm counters by checking active batches and Redis first, falling back to database coalesced reads. When a counter's database has no row, _ensure_spend_counter_initialized falls back to the source cache's spend field. _is_spend_counter_cache_warm checks active batch (returning immediately), then Redis, then in-memory, returning true only when a value is found.

  _get_source_cache_base_spend retrieves the spend field from user_api_key_cache (both dict and object attribute access), returning 0.0 when all sources are absent.

  increment_spend_counter is the public entry point for budget domains outside entity scopes (e.g. shadow eval per-leg spend), sharing the same invalidation and read semantics with the entity counters.

  refresh_spend_counter_ttl extends Redis TTL and returns true on success or false on error, logging the failure as debug level so TTL failures do not break request flow. Preserve debug-level logging for both TTL refresh and invalidation Redis-delete failures, since these are defensive cleanups.

  _increment_spend_counter_cache applies an increment with Redis INCRBYFLOAT+TTL refresh, updating in-memory and recording the value; on Redis failure it invalidates the counter and propagates the error. run_spend_counter_pipeline increments a batch without calling invalidation, returning values in order; the caller chooses cleanup. increment_spend_counters_pipeline wraps the pipeline and invalidates all counters before re-raising on failure, providing two-tier choice: raw pipeline (no cleanup) for settlement, validating pipeline (invalidate-all) for admission.

  _apply_spend_counter_increments routes post-call increments to the deferred settlement path (post-call batch) when available, otherwise to increment_spend_counters_pipeline (the validating pipeline). _defer_spend_counter_increments queues increments to the post-call Redis batch with _settle_spend_counter_increment callbacks. _settle_spend_counter_increment is the settlement callback that syncs each counter's final value to in-memory on success, retries in-memory increment on batch cancellation, and invalidates the counter with a warning if the batch operation raised an exception; this warning is the only logger.warning in the pipeline path.

