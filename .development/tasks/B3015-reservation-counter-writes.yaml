    proof: [counter-init-tests]
  - text: "_ensure_window_spend_counter_initialized warms the counter by reading the coalesced window spend from the database and returns true only when window spend is available."
    proof: [window-init-tests]
  - text: "_is_spend_counter_cache_warm checks active batch (returns true/false immediately), then Redis (setting in-memory cache on success), falling back to in-memory (returning true if present, false if None), and logs debug on Redis exceptions."
    proof: [warmth-detection-tests]
  - text: "_get_source_cache_base_spend retrieves the spend value from user_api_key_cache using one or more source cache keys, handling both dict (get) and object (getattr) access patterns, returning 0.0 if all sources are None or missing."
    proof: [source-spend-tests]
  - text: "increment_spend_counter is a public entry point that calls _increment_spend_counter_cache and is consumed by shadow_eval_logger and other domains outside entity scope, sharing the same invalidation semantics."
    proof: [public-entry-tests]
  - text: "refresh_spend_counter_ttl calls Redis async_refresh_ttl and returns true on success or false on exception, logging the exception at debug level."
    proof: [ttl-refresh-tests]
  - text: "_increment_spend_counter_cache performs Redis INCRBYFLOAT with refresh_ttl=true, updates in-memory cache, records spend counter value, and invalidates the counter before raising on Redis exception; falls back to SpendCounterReseed.increment_in_memory when Redis is unavailable."
    proof: [counter-increment-tests]
  - text: "_invalidate_spend_counter forgets the counter from the active batch, deletes from in-memory cache, and attempts Redis delete with debug-level logging on exception (the invalidation failure path does not raise)."
    proof: [counter-invalidation-tests]
  - text: "_apply_spend_counter_increments routes pending increments to _defer_spend_counter_increments if a post-call batch is available; otherwise calls increment_spend_counters_pipeline and swallows RedisCircuitBreakerOpenError and Redis timeout failures."
    proof: [apply-increments-tests]
  - text: "_defer_spend_counter_increments routes pending increments to the active post-call batch, scheduling _settle_spend_counter_increment as the settlement callback for each counter, and returns true if a batch was available (indicating deferral)."
    proof: [defer-increments-tests]
  - text: "_settle_spend_counter_increment is a callback factory that syncs the counter's final value to in-memory on success, retries in-memory increment on cancellation, and invalidates the counter with a warning if the batch operation raised an exception."
    proof: [settle-callback-tests]
  - text: "increment_spend_counters_pipeline executes the raw pipeline and invalidates all pending counters before raising on exception, ensuring no reader trusts a partially applied batch."
    proof: [pipeline-invalidation-tests]
  - text: "run_spend_counter_pipeline executes each PendingSpendIncrement as an INCRBYFLOAT+EXPIRE operation in a single Redis pipeline or as individual in-memory increments when Redis is unavailable, returning the new counter values in order; on failure it propagates the exception without cleanup."
    proof: [raw-pipeline-tests]
pitfalls:
  - "Window counter initialization only succeeds if coalesced_window returns a spend value; if None is returned a warning is logged and the function returns false, leaving the counter uninitialized."
  - "Active batch checks in _is_spend_counter_cache_warm return immediately true/false without falling back to other layers if the batch has a value (None or actual); only on absence does the function proceed to Redis and in-memory checks."
  - "_increment_spend_counter_cache records spend_counter_value immediately after incrementing, using the new value returned from Redis or calculated in-memory; this recording is synchronous and must complete before the function returns."
  - "_increment_spend_counter_cache calls _invalidate_spend_counter and then re-raises on any Redis exception; the caller (admission or settlement) decides whether to use increment_spend_counters_pipeline (invalidates on error) or run_spend_counter_pipeline (no cleanup)."
  - "_invalidate_spend_counter calls forget_spend_counter (which notifies active batch) before in-memory and Redis deletes; this order ensures the batch is notified even if the in-memory or Redis delete fails."
  - "_invalidate_spend_counter logs Redis delete failure at debug level because the counter value is still authoritative (the in-memory and batch invalidation prevent reads from trusting stale data)."
  - "refresh_spend_counter_ttl failure also logs at debug level (not warning), since TTL refresh is defensive and the counter value gates admission, not the TTL."
  - "_apply_spend_counter_increments swallows RedisCircuitBreakerOpenError and is_redis_timeout_failure exceptions without re-raising, since these are transient; other exceptions propagate."
  - "_defer_spend_counter_increments checks for None batch (not empty batch) and returns false immediately if no batch is available; do not defer an empty list by default."
  - "_settle_spend_counter_increment returns a callback function, not a coroutine; this factory pattern allows each pending item to capture its own counter_key and increment value."
  - "_settle_spend_counter_increment's warning at line 3806-3808 is the only logger.warning in the pipeline path; TTL refresh (line 3727) and Redis delete (line 3761) failures both use logger.debug."
  - "run_spend_counter_pipeline records each spend_counter_value immediately after the pipeline completes, not inside the pipeline construction; these recordings happen before the tuple is returned."
out_of_scope:
  - B360 owns Redis async_get_cache, async_increment, async_refresh_ttl, async_increment_pipeline and TTL configuration.
  - B733 owns UserApiKeyCache.async_get_cache and auth cache operations.
  - B1718 owns read_batched_spend_counter, forget_spend_counter and active spend counter batch API.
  - B1736 owns SpendCounterReseed.coalesced, SpendCounterReseed.coalesced_window, SpendCounterReseed.increment_in_memory and database floor reads.
  - B2226 owns spend_counter_cache local in-memory store (set/get/delete/increment).
  - B3014 owns read paths and repair logic; this task owns only writes and initialization.
  - Counter seeding and repair during budget reads; owned by B3014.
  - Reconcile and settlement logic; owned by B3003.
