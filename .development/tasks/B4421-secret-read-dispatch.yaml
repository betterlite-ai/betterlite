oracle_cases: []
deviations:
  - what: Google KMS canonical base64 roundtrip validation rejects base64 strings that encode to a different string when re-encoded, preventing format confusion.
    why: The source validates by re-encoding and comparing against the input, ensuring canonical encoding per RFC 4648.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/secret_manager_handler.py#L71
  - what: AWS KMS plaintext is stripped of leading and trailing whitespace after UTF-8 decoding.
    why: The source calls strip() on the decoded secret, removing whitespace from both ends (Python's str.strip() method).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/secret_manager_handler.py#L154
  - what: AWS KMS returns None when encrypted_value is None (not found in environment); other errors raise.
    why: The source only checks if encrypted_value is None and raises "is None"; missing values for AWS_KMS follow that None-first check.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/secret_manager_handler.py#L140
  - what: AWS Secret Manager silently returns None when the client is not an AWSSecretsManagerV2 instance, without calling sync_read_secret.
    why: The source checks isinstance(client, AWSSecretsManagerV2) and only calls sync_read_secret within the if block; a wrong client type leaves secret as None and returns it without error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/secret_manager_handler.py#L161-L170
  - what: Custom Secret Manager raises an error if the client is not a CustomSecretManager instance, naming the actual client type.
    why: The source validates isinstance(client, CustomSecretManager) and raises ValueError with the client's type name.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/secret_manager_handler.py#L210-L221
  - what: Infisical is the default fallback when key_manager does not match any known type; it calls client.get_secret(secret_name).secret_value without checking the manager type.
    why: The source uses an else clause to implement Infisical as the default, relying on duck typing; betterlite's exact dispatch list has no default, but preserves this as the final fallback.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/secret_manager_handler.py#L226-L229
out_of_scope:
  - Azure Key Vault client initialization and creation; the caller must supply an initialized Azure client.
  - All manager client implementations (AWS, Google, Vault, CyberArk, Custom); those are owned by B4414-B4420.
  - OIDC provider acquisition and token handling; that is B4411.
  - Environment lookup for encrypted values; that uses B002's EnvironmentLookup contract.
  - Custom secret manager loader and interface validation; that is B4419.
  - Google KMS and AWS KMS client initialization; that is B4412.
pitfalls:
  - The Azure Key Vault dispatch checks both the manager enum value and the client's module.class name; only one needs to match for backward compatibility.
  - Google KMS dispatch also triggers when the client's class name is KeyManagementServiceClient, independent of the key_manager string value, mirroring the Azure duck-typing fallback.
  - Google KMS canonical base64 validation must re-encode and compare strings exactly; a different canonical encoding fails silently and breaks decryption.
  - AWS KMS encrypted values are read from environment with os::env::var, not from request body or config; missing environment variables return None or raise "is None".
  - The comment about aws_kms/ prefix filtering does not apply; all non-None environment values are treated as potentially encrypted, and the caller controls which names are passed.
  - Custom Secret Manager optional_params must be serialized from KeyManagementSettings using model_dump() for Pydantic compatibility (B4410).
  - Infisical fallback uses duck typing with get_secret(secret_name).secret_value; it is not checked by manager type and will fail at runtime if the client does not support the protocol.
  - The Google KMS resource name (litellm._google_kms_resource_name in Python) is set during KMS client initialization by B4412; the Rust dispatcher must receive this value as a field on the Google KMS client protocol, not from a module global, to comply with inject-dependencies rule.
  - The protocol method name get_secret_from_google_secret_manager is 37 characters, exceeding the 30-character limit, because it defines an interface that the Python client exposes and must be called by exact name; this is an exception to the name-length rule and must be documented.
review_level: security
