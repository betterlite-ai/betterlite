id: B4421
title: Dispatch hosted secret reads and KMS decryption
description: >-
  Implement the dispatcher for retrieving secrets from any supported manager type, with exact
  client-type fallbacks, KMS decryption, and backend-specific missing-value treatment. Define
  protocol types for Azure KeyVault client, Google KMS client, AWS KMS client, Google Secret
  Manager client, Vault/CyberArk secret readers, Custom secret manager, and Infisical clients.

  Implement _is_base64 to validate base64 strings by encoding and comparing the roundtrip.
  Implement get_secret_from_manager to route by KeyManagementSystem type and call the
  corresponding manager client's method:

  - AZURE_KEY_VAULT: call client.get_secret(secret_name).value
  - GOOGLE_KMS: read encrypted value from environment, validate canonical base64 roundtrip,
    base64-decode, call client.decrypt with ciphertext and the Google KMS resource name
    (supplied by B4412 during KMS client initialization as a module global, exposed to this
    dispatcher via a field or injection mechanism), UTF-8-decode plaintext, and return
  - AWS_KMS: read encrypted value from environment, base64-decode, call client.decrypt with
    CiphertextBlob parameter, UTF-8-decode plaintext, and strip leading and trailing whitespace
  - AWS_SECRET_MANAGER: when the client isinstance(client, AWSSecretsManagerV2), call
    client.sync_read_secret(secret_name, primary_secret_name) where primary_secret_name comes
    from settings (supplied by B4414); when the client is the wrong type, return None without error
  - GOOGLE_SECRET_MANAGER: call client.get_secret_from_google_secret_manager(secret_name)
  - HASHICORP_VAULT: call client.sync_read_secret(secret_name)
  - CYBERARK: call client.sync_read_secret(secret_name)
  - CUSTOM: verify client is CustomSecretManager, call sync_read_secret(secret_name, optional_params),
    raise error if wrong client type (B4419 supplies validation)
  - LOCAL: return os::env::var(secret_name)
  - other (default Infisical): call client.get_secret(secret_name).secret_value

  When a manager returns None or missing-value errors for AWS_SECRET_MANAGER and AWS_KMS,
  preserve that None without raising. For Google Secret Manager, Vault, CyberArk and Custom,
  raise ValueError when secret is None. For Azure and Google KMS, raise when client type is
  wrong or decrypt fails. Local and Infisical always attempt the read/property access.

  Do not add the comment's nonexistent AWS aws_kms/ prefix filter; all non-None environment
  values are treated as potentially encrypted. Azure Key Vault client creation and bootstrap
  stay outside this dispatcher; its caller must supply the Azure client. Preserve settings
  optional_params serialization for Custom (supplied by B4410).

  Manager dispatch is the single call point for both B129 get_secret and config initialization;
  all managers except LOCAL and CUSTOM require a pre-initialized client. KMS clients (Google
  and AWS) are initialized by B4412. HTTP clients and credential handling are supplied by
  previous tasks. No native bridge or multiple implementations; LiteLLM's open-source Python
  path is the behavioral oracle.

