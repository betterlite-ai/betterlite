dod:
  - text: _is_base64 validates a string by base64-decoding and re-encoding, returning true only if the roundtrip matches the original.
    proof: [base64-validation]
  - text: get_secret_from_manager dispatches on KeyManagementSystem type and calls the corresponding manager client method or environment lookup.
    proof: [secret-dispatch-tests]
  - text: Azure Key Vault dispatch calls client.get_secret(secret_name).value and returns the result or error.
    proof: [azure-dispatch]
  - text: >-
      Google KMS dispatch reads the environment variable named by secret_name, validates canonical base64 roundtrip,
      base64-decodes the value, calls client.decrypt with the ciphertext and resource name, UTF-8-decodes the plaintext,
      and returns the result.
    proof: [google-kms-dispatch]
  - text: >-
      AWS KMS dispatch reads the environment variable named by secret_name, base64-decodes the value,
      calls client.decrypt with CiphertextBlob parameter, UTF-8-decodes the plaintext, strips leading and trailing whitespace,
      and returns the result.
    proof: [aws-kms-dispatch]
  - text: >-
      AWS Secret Manager dispatch checks isinstance(client, AWSSecretsManagerV2); when true, calls
      client.sync_read_secret(secret_name, primary_secret_name) where primary_secret_name comes from settings;
      when false, returns None without error.
    proof: [aws-secrets-dispatch]
  - text: Google Secret Manager dispatch calls client.get_secret_from_google_secret_manager(secret_name) and raises ValueError when the result is None.
    proof: [google-secrets-dispatch]
  - text: Hashicorp Vault dispatch calls client.sync_read_secret(secret_name) and raises ValueError when the result is None.
    proof: [vault-dispatch]
  - text: CyberArk dispatch calls client.sync_read_secret(secret_name) and raises ValueError when the result is None.
    proof: [cyberark-dispatch]
  - text: >-
      Custom Secret Manager dispatch verifies the client is a CustomSecretManager instance, calls sync_read_secret(secret_name, optional_params),
      and raises an error with the client type name when the client type is wrong.
    proof: [custom-dispatch]
  - text: LOCAL dispatch returns the environment variable value for the secret name.
    proof: [local-dispatch]
  - text: The default (Infisical) dispatch calls client.get_secret(secret_name).secret_value and returns the result.
    proof: [infisical-dispatch]
  - text: >-
      AWS KMS and AWS Secret Manager (when the client type is wrong) return None when missing or on type mismatch;
      Google Secret Manager, Vault, CyberArk, and Custom raise ValueError when the secret is None.
    proof: [missing-value-treatment]
  - text: Protocol types are defined for Azure KeyVault client, Google KMS, AWS KMS, Google Secret Manager, Vault/CyberArk readers, Custom, and Infisical clients.
    proof: [protocol-types]
