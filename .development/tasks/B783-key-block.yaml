id: B783
title: Block keys and check key health
description: >-
  Implement POST /key/block and /key/unblock with B124 BlockKeyRequest (required key), plus
  POST /key/health for the authenticated caller's logging callbacks. Health does not test model
  authorization or provider credentials: it uses a mock completion with no provider API request.
  All three routes have B865 wrappers, but block/unblock have no local except block.

  Block/unblock first require DB, then B124 is_valid_api_key: sk- followed by one or more ASCII
  alphanumeric/underscore/hyphen characters, or exactly 64 hexadecimal characters, total length
  3..100. The docstring's minimum 20 is wrong. Hash sk- input with B2314; retain supplied hash
  case. Invalid format is 400 bad_request_error, param key, code 400. _check_key_admin_access
  immediately admits proxy admins. Other callers first load the target (HTTPException 404 if
  absent), then a truthy target.team_id via DB-only B737 lookup, then B800 TeamAccess with
  TEAM_OR_ORG_ADMIN. Personal owners and admin viewers are denied HTTPException 403; an org
  admin qualifies through the key's team organization, not a key organization field.
  Cases block_key_format_boundaries, block_hash_case_preserved, block_proxy_admin,
  block_team_admin, block_team_org_admin, block_personal_owner_denied and block_viewer_denied
  run for both mutations. Messages identify invalid format, missing key or required admin scope.

  Both routes load the target again after authorization. Missing now is ProxyException 404
  not_found_error,param key,code 404. Thus an admin's missing-key envelope differs from a
  non-admin's initial HTTPException detail.error. Cases block_missing_admin_vs_member and
  block_target_removed_between_reads compare both. Denial HTTPExceptions also retain detail.error
  without type/param/code; missing DB is an ordinary exception handled by B124's outer 500
  error {message,type=internal_server_error} without param/code. Database-unavailability mapping
  remains B731/B124. Cases block_no_database and block_permission_error_shape pin this distinction.

  If B2330 audit policy is enabled, schedule its audit BEFORE updating: fresh UUID/time,
  changed_by from the opt-in header resolver, caller.api_key, table LiteLLM_VerificationToken,
  object_id=hash, action blocked/unblocked, updated_values='{}', before_value=existing JSON.
  Update blocked=true/false with B770 with_settings_updated_at, then B734 _delete_cache_key_object,
  then return the whole repository result, even null. Cases block_audit_projection,
  block_audit_before_write, block_settings_stamp, block_null_update_result and
  block_cache_failure_after_write preserve ordering. No transaction joins these effects; a
  failed update can still have scheduled an audit, and a cache failure never undoes the row.
  Postgres failure/row tests use POSTGRES_TEST_URL else testcontainers and fail on unavailable DB.

  Health starts {key:healthy,logging_callbacks:null}. Only a truthy metadata containing logging
  triggers B2304 decrypt_callback_vars followed by test_key_logging; preserve legacy plaintext
  and decrypt-failure passthrough from that dependency, without changing stored metadata.
  Each entry requires non-null callback_name (empty string is accepted); preserve order/duplicates.
  Missing names raise before completion and become 500 internal_server_error,param string None,
  code 500 through key_health's own L7597-L7603 except block. Cases health_no_logging,
  health_encrypted_and_legacy_metadata, health_missing_callback_name and health_empty_name cover it.

  Capture root ERROR logs, prepare the request through B1137/B1103, and invoke B004/B012 mock
  completion with model openai/litellm-key-health-test, one user message saying this is a LiteLLM
  key-health test with no LLM API call, and mock_response='test response'. On preparation/completion
  exception return logging_callbacks {callbacks,status:unhealthy,details:logging-test failure};
  the route still returns 200 with key unhealthy. Otherwise wait two seconds for batched callbacks,
  remove the log capture handler, and mark unhealthy iff captured ERROR text is nonempty; success
  details instruct checking the listed destinations. Cases health_mock_request_literals,
  health_completion_failure_200, health_error_log_200, health_no_error_healthy and
  health_waits_two_seconds test the actual mock/callback pipeline and timer. The source leaks its
  capture handler on the early exception branch; the native cleanup deviation below is explicit.


  Build the production key_block module in betterlite-server; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  _check_key_admin_access (L7237-L7285; 41 source lines), block_key (L7290-L7399; 96 source lines), unblock_key
  (L7404-L7513; 96 source lines), key_health (L7523-L7603; 65 source lines), test_key_logging (L7630-L7703;
  66 source lines).


  B001 HTTP cases cover the three routes against booted proxies; do not invoke test_key_logging
  through a helper adapter that substitutes proxy_server globals. Native injected callback/timer
  failures supplement the HTTP corpus. No route calls handle_exception_on_proxy here.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 364 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  364 production, 335 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 764 changed lines estimated within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
