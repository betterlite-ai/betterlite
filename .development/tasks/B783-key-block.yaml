dod:
  - text: All named block/unblock and health cases above pass; native health_capture_cleanup and
      health_details_redacted cover the explicit deviations without changing 200 unhealthy behavior.
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
