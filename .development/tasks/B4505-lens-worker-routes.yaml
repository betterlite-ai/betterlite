deviations:
  - what: The sample route computes the start and end milliseconds from the job's integer microsecond timestamps, not from a float seconds value multiplied by 1000.
    why: LiteLLM's int(timestamp() * 1000) can land one millisecond low when the float is just under a whole millisecond. Integer arithmetic is exact, and the same choice is made for the preview window in B4503.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/endpoints.py#L400-L405
out_of_scope:
  - "B4503 owns get_lens, required, source_reader, user_scope, LensRoutesState, Clock and IdSource, and the 16 admin routes. This task only imports them."
  - "B4500 owns the records (Claim, Progress, Result, ModelRequest, ModelResult, Sample, Worker), queue_job, claim_job, current_job, replace_job, merge_finding and snapshot_finding. B4501 owns LensRepository and its SQL, B4502 the SourceReader, B4504 analyze."
  - "The cases need no database and no tracing store, so the claim loop, leases, sample freezing, result merging and every 401 for an unknown worker are covered by native tests only. The oracle worker sandbox has no Postgres for either gateway."
  - "The route-group task decides how the key auth layer treats /lens/worker paths. LiteLLM runs no key auth on them (no user_api_key_auth dependency, not in litellm_native_routes), and B742's route policy says so; B132 composes this router."
pitfalls:
  - The worker routes never call user_api_key_auth, so a worker token is not a virtual key and the master key does not open them; only the SHA-256 of the bearer token in LiteLLM_LensWorker does.
  - claim defaults protocol_version to 1, so a worker that sends no query gets 409 "Upgrade the Lens worker using the current Connect worker command" and never reaches the analysis key check.
  - claim writes the heartbeat before it looks at any lens, so a worker with nothing to claim still refreshes last_seen, and the null answer is a 200 with body null.
  - claim_candidate calls update with changed_only = true, which returns None when the transform changed nothing; that is a normal "no work", not an error.
  - A claim needs the job to differ from current_job(candidate), so a worker that already holds a running job with a live lease gets the lens back unchanged from claim_job and no second claim of the same job.
  - assigned compares lease_until against the current time with "at or before" as expired, so a lease ending exactly now is a 409.
  - progress and result use transforms that return the lens unchanged when the job is gone or moved, and required() only fails on None, so those cases answer 200 with the current lens or true, not 409.
  - heartbeat runs assigned twice (once itself, once inside progress), and that second call can turn a lease that expired between them into 409.
  - The sample route returns a stored sample without touching storage, so a worker with no tracing gets 501 only on the first call that has to build the sample.
  - The sample paging stops on the first page's selected count, not on a short page, and keeps going while next_cursor is set; do not add a page limit.
  - If another request froze the sample first, the freeze transform leaves the lens alone and the route returns that other sample, not the one this call built.
  - content checks the execution against the frozen sample before it builds the SourceReader, so a bad execution_id is 404 even when tracing is off.
  - The result route's early return needs worker_id equal to this worker and status completed or failed; a different worker, or a queued or running job, goes on to assigned and gets 409 when it does not own the job.
  - The four 422 checks of result run before any storage call, and validate_finding runs its same-check 422 before it needs storage, so a bad existing_finding_id is 422 even with tracing off, while any other finding without tracing is 501.
  - In finish, the lens-level findings come from merge_results and the job's own findings come from snapshot_finding on the original e, so the two lists can differ for the same draft (snapshot resets occurrences).
  - On a result with an error, coverage on the job stays the old coverage and last_scan_at does not move, but next_run_at still advances by interval_minutes.
  - Python's HTTPBearer rejects before the database is touched, so a request with no or a wrong scheme header never shows 503 even when the database is absent.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
