  optional: []
  commands:
    - id: credential-tests
      why: the bearer parsing, token hashing or revoked worker rule is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::credential::/)'
    - id: lease-tests
      why: the assigned lease checks are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::lease::/)'
    - id: claim-tests
      why: the claim route or claim_candidate is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::claim::/)'
    - id: progress-tests
      why: the progress or heartbeat handler is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::progress::/)'
    - id: sample-tests
      why: the sample route is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::sample::/)'
    - id: content-tests
      why: the content route is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::content::/)'
    - id: model-tests
      why: the model route is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::model::/)'
    - id: result-tests
      why: the result route is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::result::/)'
    - id: evidence-tests
      why: validate_finding is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^lens_worker_routes::evidence::/)'
