  paths:
    - crates/betterlite-server/src/lens_worker_routes.rs
    - crates/betterlite-server/src/lens_worker_routes/**
    - tools/oracle/cases/http/lens-worker-routes/**
    - tools/oracle/helpers/b4505.py
    - tools/oracle/helpers/b4505/**
    - tools/oracle/src/helpers/server/b4505.rs
    - tools/oracle/src/helpers/server/b4505/**
