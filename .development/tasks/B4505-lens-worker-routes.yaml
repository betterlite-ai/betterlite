id: B4505
title: Lens worker leases and verified results
description: >-
  Build the worker side of litellm/proxy/lens/endpoints.py: the seven routes under /lens/worker, the worker credential check and the helpers behind them.
  One module in betterlite-server, lens_worker_routes (a file plus a folder of submodules with adjacent tests.rs files), with the submodules
  credential (worker_auth), lease (assigned), claim (the claim route and claim_candidate), progress (progress and heartbeat), sample, content, model, result, merge (merge_results),
  evidence (validate_finding), router and error. The admin routes, user_scope, LensRoutesState and the Clock and IdSource ports belong to B4503.
  This task imports `crate::lens_access::lookup::get_lens`, `crate::lens_access::lookup::required`, `crate::lens_access::storage::source_reader` and `crate::lens_access::state::LensRoutesState` (B4503, all `pub(crate)` in the same crate) and registers its seven routes in one function
  `lens_worker_routes::router(state)`. The umbrella B132 composes it with B4503's router, so nothing is registered twice. No new crate dependency is needed
  (the server already has sha2, hex, base64 and chrono; B4503 added betterlite-lens and betterlite-db).

  State. `WorkerRoutesState` holds the B4503 `LensRoutesState` (`crate::lens_access::state::LensRoutesState`: repository, storage, Clock) and the value B4504 exports to run lens_inference::analyze (its ports bundled, so tests pass a fake).
  Tests use fakes for all of them, and B4501's fake Database if it exports one, else a small one in tests.rs that answers by SQL text. A missing repository is 503 "Lens needs a connected Postgres database" (B4503's lens_repository).

  Auth is not the user key layer. These routes are never behind B003/B052 key auth: they take only `Authorization: Bearer <token>`. lens_worker_routes::credential::worker_auth(state, header):
  parse the bearer header the way FastAPI's HTTPBearer does at the pinned fastapi 0.136.3 (a missing header or a scheme other than bearer is rejected before any database call;
  copy the status, detail and WWW-Authenticate header from what the oracle sees on LiteLLM, do not guess), then the repository (503 when absent), then
  repo.worker(lowercase hex SHA-256 of the token's UTF-8 bytes). None or revoked is 401 "Worker credential is invalid or revoked". Return the Worker. The token and its digest are never logged.
  Dependencies resolve before body and query decoding, so a request with a bearer header and no database is 503 even when its body or query is also bad; a request without a bearer header is the bearer error first.
  A body that is not valid JSON is the shared 422 from the server; do not add a case for the order between it and auth.

  lens_worker_routes::lease::assigned(repo, lens_id, job_id, worker) -> (Lens, Job): get_lens(lens_id, worker.scope) (404 "Lens not found" when missing or can_access false; this is the only caller that passes a non-all_teams scope),
  then current_job(lens) (B4500). 409 "This worker no longer owns the job" when there is no current job, or its id differs, or its status is not "running", or its worker_id differs, or lease_until is None or at or before the clock's now.
  An expired lease is 409 at once; nothing renews it here.

  claim: POST /lens/worker/claim with query protocol_version (integer, default 1; a non-integer is 422, decoded after auth). Steps: protocol_version other than 2 is 409 "Upgrade the Lens worker using the current Connect worker command";
  worker.analysis_key_id None is 409 "Assign an analysis key to this worker in Lens setup"; now = clock; repo.heartbeat(worker.id, now as Python isoformat text);
  then for each lens in repo.lenses() in repository order, skip it when can_access(worker.scope, lens.scope) is false, and call claim_candidate; return the first Claim. When none claims, the body is the JSON value null with status 200.
  The isoformat text is "YYYY-MM-DDTHH:MM:SS+00:00", with ".ffffff" microseconds only when they are not zero; it is stored as text in last_seen.
  claim_candidate(candidate, worker, now): job id = new uuid from IdSource; repo.update(candidate.id, transform, changed_only = true) where transform queues first with B4500 queue_job(lens, now, job id) only when lens.settings.enabled and lens.next_run_at <= now (otherwise keeps the lens),
  then applies B4500 claim_job(that, worker, now). update returning None (nothing changed, or the lens vanished) gives no claim. Otherwise take current_job of the updated lens; it is a claim only when that job has worker_id equal to this worker, status "running" and differs from current_job(candidate) (the job as it was before)
  by record equality. The Claim is { lens_id, job, findings = updated lens findings }.

  progress: POST /lens/worker/{lens_id}/{job_id}/progress with a Progress body (B4500). assigned first. now = clock. repo.update with a transform: current_job missing, or its id differs, or worker_id differs returns the lens unchanged; otherwise replace_job with the job having stage and coverage from the body and lease_until = now + 5 minutes.
  required(result); then repo.heartbeat(worker.id, now isoformat). The body is true. An unchanged transform is still a 200 true (update gives the current lens back), not 409.
  heartbeat: POST /lens/worker/{lens_id}/{job_id}/heartbeat, no body. assigned, then run progress with Progress { stage = job.stage, coverage = job.coverage } for the same ids, which runs assigned again and renews the lease. The body is true.

  sample: GET /lens/worker/{lens_id}/{job_id}/sample. assigned. A job whose sample is already set returns it with no storage call (so no 501 either). Otherwise page through the SourceReader (B4502; 501 from source_reader when no storage):
  cursor starts as "", each call is reader.sample(lens.scope, job.settings, start_ms, end_ms, cursor = cursor) with start_ms and end_ms the job's start and end in milliseconds (integer arithmetic on microseconds, see deviations). Push each page; stop when the page has no next_cursor or when the executions gathered so far reach the first page's `selected`; else continue with the page's next_cursor.
  The frozen Sample is { executions = all pages' executions in order, eligible = first page's eligible, selected = the number of gathered executions }. Freeze it with repo.update: the transform reads current_job; if it is missing, or its id differs, or its worker_id differs, it fails with 409 "Job was cancelled or reassigned" (the error leaves repo.update and is not retried);
  if that job already holds a sample the transform leaves the lens unchanged, else replace_job with the sample set. required(result), then return the sample of the job with job_id in the updated lens; None there is 409 "Could not freeze the sample".
  B4501's `update<E>` takes `impl FnMut(Lens) -> Result<Lens, E>` and returns `Result<Option<Lens>, LensUpdateError<E>>`. The freeze transform uses the error type `JobMoved` (owned here, in error.rs) and returns `Err(JobMoved)` for that 409; `LensUpdateError::Transform(JobMoved)` maps to 409 "Job was cancelled or reassigned". Every other transform in this task (claim_candidate, progress, finish) returns `Ok` and uses `std::convert::Infallible` as `E`. The heartbeat calls take `&str`: `repo.heartbeat(&worker.id, &isoformat(now))`.

  content: GET /lens/worker/{lens_id}/{job_id}/content with required query execution_id (missing is 422 after auth), cursor (default "") and offset (integer, 0 or more, default 0). assigned. selected = job.sample, or an empty Sample when none. Find the execution with that id; none is 404 "Execution is outside this job's sample".
  Only then source_reader(storage) (501) and reader.content(lens.scope, execution, cursor, offset). Return the ExecutionContent.

  model: POST /lens/worker/{lens_id}/{job_id}/model with a ModelRequest body. assigned, then B4504 lens_inference::analyze(repo, lens, job, worker, body, the incoming request). Return its ModelResult. All failures come from analyze and propagate with its status and detail.

  result: POST /lens/worker/{lens_id}/{job_id}/result with a Result body (B4500; assessments, findings, coverage, error). Steps in this order:
  1) lens = get_lens(lens_id, worker.scope). 2) If the lens has a job with job_id, status "completed" or "failed" and worker_id equal to this worker, return the lens at once (200, an upload retried after success). 3) assigned. 4) now = clock; selected = job.sample, or an empty Sample when none; allowed = the set of selected execution ids.
  5) Four checks, each 422: assessments whose execution_id values are not all distinct: "Each run must have one assessment"; an assessment execution_id outside allowed: "Assessment references a run outside this job"; check_ids = ids of job.settings.analysis_checks, and an assessment whose issue_checks plus pattern_checks are not all in check_ids: "Assessment references an unknown check";
  a finding whose check_id is not in check_ids, or whose evidence names an execution_id outside allowed: "Finding references evidence outside the job".
  6) validate_finding for each finding in order, using the lens read in step 1. 7) repo.update with the finish transform below; required(result) is the response.

  lens_worker_routes::evidence::validate_finding(lens, selected, finding, storage): previous = the lens finding whose id equals finding.existing_finding_id. When existing_finding_id is set and previous is None or its check_id differs from the draft's: 422 "Existing finding must belong to the same check".
  Then for each evidence entry in order, build source_reader(storage) (501 when no storage) and call reader.verify_evidence(lens.scope, the selected execution with evidence.execution_id, evidence); false is 422 "Evidence quote does not match stored content".

  finish transform on lens e: active = current_job(e). When active is missing, or its id differs, or its worker_id differs from this worker, return e unchanged (the response is then 200 with the current lens, not a 409). Otherwise:
  merged = merge_results(e, body, job.revision, now).findings, where job is the job read by assigned; merged_ids = their ids. The active job becomes: status "failed" if body.error is non-empty else "completed", stage "Failed" or "Complete", finished_at = now, coverage = the old coverage when body.error is set else body.coverage, error = body.error, assessments = body.assessments,
  findings = for each draft, B4500 snapshot_finding(e, draft, job.revision, now). The lens becomes: findings = merged followed by the findings of e whose id is not in merged_ids; last_scan_at = e.last_scan_at when body.error is set, else the later of (e.last_scan_at, or job.end when that is None) and job.end;
  next_run_at = now + e.settings.interval_minutes minutes.
  merge_results(lens, result, revision, now): fold over result.findings starting with the lens; for each draft take B4500 merge_finding(current, draft, revision, now) and set current.findings to that finding first, then the old findings whose id differs. The last draft ends up first.

  Route table: exactly these seven (method path): POST /lens/worker/claim, POST /lens/worker/{lens_id}/{job_id}/progress, GET /lens/worker/{lens_id}/{job_id}/sample, GET /lens/worker/{lens_id}/{job_id}/content, POST /lens/worker/{lens_id}/{job_id}/model,
  POST /lens/worker/{lens_id}/{job_id}/result, POST /lens/worker/{lens_id}/{job_id}/heartbeat. None clashes with B4503's routes (their paths have fewer segments or other literals). No /v1 or provider alias exists.

  Errors: lens_worker_routes::error owns LensWorkerError with status() and detail(), wrapping LensAccessError (B4503), the repository error, the B4502 source error and the B4504 analyze error. A repository or storage error that is not a listed detail is a 500 and is not hidden. Every error body is {"detail": "<text>"}.
