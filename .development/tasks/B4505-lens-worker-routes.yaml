    why: The router prefix, the HTTPBearer scheme and the storage dependency that the worker routes use instead of user_api_key_auth.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/endpoints.py#L82-L117
    why: get_lens (B4503 owns it), worker_auth with its SHA-256 lookup and 401 text, and assigned with the lease checks.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/endpoints.py#L349-L386
    why: Decorators and bodies of claim and progress, with the protocol and analysis key checks and the lease renewal.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/endpoints.py#L388-L453
