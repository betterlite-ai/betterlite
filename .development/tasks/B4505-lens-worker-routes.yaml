dod:
  - text: worker_auth hashes the bearer token with SHA-256, answers 401 for an unknown or revoked worker, and checks the header before the database.
    proof: [credential-tests, oracle]
  - text: assigned answers 404 for a missing lens and 409 for a missing, other, non-running, foreign or expired job.
    proof: [lease-tests]
  - text: claim answers 409 for protocol versions other than 2 and for a worker without an analysis key, heartbeats, and returns the first lens whose claim_candidate takes a new running job for this worker, else null.
    proof: [claim-tests, oracle]
  - text: claim_candidate queues a job only when the lens is enabled and due, then claims it, and gives no claim when update changed nothing or the job was already this worker's.
    proof: [claim-tests]
  - text: progress and heartbeat set stage, coverage and a five minute lease, write the worker heartbeat, and answer true even when the transform changed nothing.
    proof: [progress-tests, oracle]
  - text: sample returns a frozen sample without storage, otherwise pages by cursor until the first page's selected count is reached, freezes it once, and answers 409 when the job moved.
    proof: [sample-tests, oracle]
  - text: content answers 404 for an execution outside the frozen sample before it needs storage, then returns the reader's content.
    proof: [content-tests, oracle]
  - text: model calls analyze after assigned and returns its result or its error unchanged.
    proof: [model-tests, oracle]
  - text: result applies the idempotent early return and the four 422 checks in order, validates every finding, and finishes the job with the stated job and lens fields.
    proof: [result-tests, oracle]
  - text: validate_finding and merge_results apply the same-check 422, the evidence 422 and the newest-first merge order.
    proof: [evidence-tests, merge-tests]
  - text: The router mounts exactly the seven worker routes and no B4503 route.
    proof: [router-tests]
