dod:
  - text: >-
      `async_client_cache_key` has the `async-redis-client-` prefix and 16 hex
      characters, ignores passthrough insertion order, changes when any field changes,
      password included, and the output and any log hold no password.
    proof: [cache-key-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `RedisClientStore` opens once for concurrent callers of one key, shares the
      connection between later callers, retries after a failed open, evicts the oldest
      entry past 200, and drops an entry on `remove`.
    proof: [store-tests]
  - text: >-
      A `Standalone` family transport reuses one store entry across two transports with
      equal settings and opens two connections for settings with different passwords.
    proof: [async-client-tests]
  - text: >-
      A `Cluster` family transport holds one Cluster client per instance, two instances
      open two clients, the store stays empty, and a non-Cluster client isn't held.
    proof: [cluster-client-tests]
  - text: >-
      `mget` and `async_mget` return values in input order with Nil for a miss, on a
      plain client and across two Cluster nodes, with duplicate keys. Empty keys return
      an empty list and the fake records no command.
    proof: [mget-tests]
  - text: >-
      `LiveSyncClient` reuses its connection across calls, reopens after a dropped
      connection, and fetches a new credential on reopen. A silent server fails at the
      response timeout.
    proof: [sync-client-tests]
  - text: >-
      `cluster_node_connection` picks the first startup node and keeps auth, TLS and
      timeouts, and with no nodes returns the LiteLLM error text. `pubsub_client`
      returns a plain client as it is, and for a Cluster client shares one node client
      under `{cache_key}-pubsub`, including a `Standalone` family cache with startup
      nodes. `close_pubsub_client` removes it.
    proof: [pubsub-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `publish` returns the subscriber count. `subscribe` then `next_message` delivers
      a published message, skips the subscribe confirmation, and returns `None` when
      the wait ends. A connect that hangs ends in `Timeout`.
    proof: [subscription-tests]
  - text: >-
      `ServiceHooks` and `BreakerGate` compile as `Arc<dyn ...>` objects, and a test
      gate and a test hook can be built from them. `ServiceEvent`, `BreakerAdmission`
      and `BreakerOpen` are importable from `redis_client_reuse`, and the `BreakerOpen`
      text names the breaker.
    proof: [service-seam-tests]

checks:
  optional: []
  commands:
    - id: cache-key-tests
      why: The key's prefix, length, stability or password sensitivity is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::cache_key::/)'
    - id: store-tests
      why: Single open, retry after failure or eviction is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::store::/)'
    - id: async-client-tests
      why: RedisCache client reuse through the store is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::async_client::/)'
    - id: cluster-client-tests
      why: RedisClusterCache's per-instance client rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::cluster_client::/)'
    - id: mget-tests
      why: Order, misses, cross-slot reads or the empty-keys rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::mget::/)'
    - id: sync-client-tests
      why: Sync connection reuse, reopen or timeouts are missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::sync_client::/)'
    - id: pubsub-tests
      why: Node selection or the shared pubsub client is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::pubsub::/)'
    - id: subscription-tests
      why: Publish, subscribe or the message wait is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::subscription::/)'
    - id: service-seam-tests
      why: The shared hook and breaker traits are missing or not object safe
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_client_reuse::tests::service_seam::/)'
    - id: helper-python
      why: The strict oracle adapter fails lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4325)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4325 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4325/pyrightconfig.json
    - id: helper-case-corpus
      why: The new client reuse cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/redis_client_reuse-*")" &&
        grep -lE '^[[:space:]]+b4325:' tools/oracle/fuzz/corpus/helper_case/redis_client_reuse-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

