id: B4325
title: Reuse Redis clients and bind Cluster reads and pubsub
description: >-
  B5220 opens live connections. This task decides when to open one and when to
  reuse one, the way `RedisCache` and `RedisClusterCache` do. It adds the module
  `redis_client_reuse` to betterlite-redis. The async tasks B4326 to B4331 and
  B4144 reach Redis through its `RedisTransport`.

  Cache key. `async_client_cache_key(settings: &RedisConnectionSettings) -> String`
  returns `async-redis-client-` followed by the first 16 hex characters of a SHA-256
  over a canonical form of the settings. LiteLLM hashes sorted JSON of the kwargs.
  Build a private `#[derive(Serialize)]` struct with every field of the settings,
  password included, serialize it with `serde_json` and hash that. `passthrough` is
  already a `BTreeMap`, so key order can't change the key, and `_opaque_kwarg_key` has
  no counterpart because the settings are typed. Two settings differing in
  any field, password included, get different keys. The literal text need not equal
  LiteLLM's since it never leaves the process. B4328's `async_register_script` uses
  this same key. Add `sha2` and `hex` to `crates/betterlite-redis/Cargo.toml` from
  the workspace, and `tokio` with `sync`.

  Store. `RedisClientStore::new()` is injected, with no global. It holds a
  `std::sync::Mutex` around a `HashMap<String, Arc<tokio::sync::OnceCell<LiveAsyncClient>>>`
  and a `VecDeque<String>` of insertion order. `async fn get_or_open(&self, key: &str,
  factory: &LiveClientFactory, client: &RedisClient, pool: Option<&PoolConfig>) ->
  Result<LiveAsyncClient, ClientReuseError>` takes the cell under the lock, drops the
  lock, then calls `get_or_try_init`, so concurrent callers open one connection and
  a failed open leaves the cell empty for the next try. The cap is 200 entries, the
  size of LiteLLM's `LLMClientCache`, and the oldest entry goes first. Eviction needs
  no timer: an evicted client closes when its last clone drops.
  `fn remove(&self, key: &str)` drops an entry. LiteLLM's 600 second TTL only makes
  it rebuild a pool and a caller can't see that, so there is no clock. The event loop
  id in LiteLLM's keys has no counterpart either, because betterlite has one Tokio
  runtime.

  Transport. `RedisCacheFamily` is `Standalone` for `RedisCache` and `Cluster` for
  `RedisClusterCache`. B4330 and the rate limiter branch on this, as LiteLLM's
  `isinstance` checks do. `RedisTransport::new(settings: RedisConnectionSettings,
  family: RedisCacheFamily, factory: Arc<LiveClientFactory>, store:
  Arc<RedisClientStore>, pool: Option<PoolConfig>) -> Result<Self, ClientReuseError>`
  builds both records with `redis_client_factories::dispatch::build_client` for
  `ClientKind::Async` and `ClientKind::Sync`. The public fields `family`, `cache_key`
  and `sync_client: LiveSyncClient` are read directly, with no accessor methods.

  `async fn async_client(&self) -> Result<LiveAsyncClient, ClientReuseError>` is
  `init_async_client` and also `_async_commands`, because `LiveAsyncClient` already
  implements `AsyncRedisCommands`. For the `Standalone` family it goes through the
  store with `cache_key`. For the `Cluster` family it follows
  `RedisClusterCache.init_async_client`: it holds the client in a per-instance
  `tokio::sync::OnceCell` and never touches the store, and only a
  `LiveAsyncClient::Cluster` is held. Any other kind is opened on every call.

  Reads. `fn mget(&self, keys: &[String]) -> Result<Vec<redis::Value>,
  ClientReuseError>` and `async fn async_mget(...)` with the same arguments are the
  four `_run_redis_mget_operation` and `_async_run_redis_mget_operation` methods.
  Values come back in input order with `redis::Value::Nil` for a miss, and duplicate
  keys work. One `redis::cmd("MGET")` is enough on both families, because redis-rs
  splits a multi-slot MGET and merges it in order, sync and async alike, and that is
  what `mget_nonatomic` does. Empty `keys` return an empty list and send nothing.
  redis-rs would send a bare `MGET` and raise the server's error, while redis-py
  catches that error through `EMPTY_RESPONSE` on a plain client and sends nothing
  from `mget_nonatomic`. A caller sees an empty list in every LiteLLM case.

  Sync client. `LiveSyncClient` in `redis_client_reuse/sync_client.rs` holds an
  `Arc<LiveClientFactory>`, the sync `RedisClient` and a `std::sync::Mutex<Option<..>>`
  with a `redis::Connection` or a `redis::cluster::ClusterConnection`. `fn query<T:
  redis::FromRedisValue>(&self, command: &redis::Cmd) -> Result<T, ClientReuseError>`
  opens through `factory.blocking_endpoint` when the slot is empty, using
  `get_connection_with_timeout(connect_timeout)` and then `set_read_timeout` and
  `set_write_timeout` with `response_timeout`. An error with `is_connection_dropped()`
  clears the slot and is returned, so the next call reopens with a fresh credential.
  A connection is kept because LiteLLM's comments put re-creating a client at 3000 ms.
  This call blocks. It is for sync call sites only, and async code must not call it
  outside `spawn_blocking`.

  Pubsub. `async fn pubsub_client(&self) -> Result<LivePubSubClient,
  ClientReuseError>` is `init_pubsub_client`. The test is the client's kind, not the
  family: a `Standalone` family cache with startup nodes holds a Cluster client too.
  A client that isn't `LiveAsyncClient::Cluster` serves pubsub as it is. For a Cluster
  client, build a plain record with `cluster_node_connection` and open it through the
  store under `{cache_key}-pubsub`, so every caller shares one. This key is what
  `async fn close_pubsub_client(&self)` removes for B4326's `disconnect`.
  `fn cluster_node_connection(cluster: &ClusterClient) -> Result<ConnectionFields,
  ClientReuseError>` is `_cluster_node_pubsub_client`. It takes the first startup node
  and keeps username, password, `ssl`, `ssl_password`, timeouts, keepalive,
  `max_connections`, the credential fields and the passthrough map, minus
  `read_from_replicas`. `response_callbacks` from `_CLUSTER_ONLY_CONNECTION_KWARGS`
  has no counterpart in the record. With no nodes it returns
  `ClientReuseError::NoPubSubNode`, whose text is "cannot derive a pub/sub client:
  redis cluster has no default node and no startup nodes".

  `LivePubSubClient` in `redis_client_reuse/pubsub.rs` matches the Protocols in
  config_sync_pubsub.py. `async fn publish(&self, channel: &str, message: &str) ->
  Result<i64, ClientReuseError>` sends PUBLISH through the held client. `async fn
  subscribe(&self, channels: &[String]) -> Result<LiveSubscription, ClientReuseError>`
  calls `factory.blocking_endpoint` in an awaited `spawn_blocking`, so it gets a fresh
  credential and the current Sentinel master, then opens
  `redis::Client::get_async_pubsub` under `tokio::time::timeout(connect_timeout)`. A
  `LiveTarget::Cluster` there is `ClientReuseError::ClusterPubSub`. `async fn
  next_message(&mut self, timeout: Duration) -> Result<Option<LiveMessage>,
  ClientReuseError>` returns `None` when the wait ends with no message, and only
  published messages come back, matching `ignore_subscribe_messages=True`.
  `LiveMessage` has `channel: String` and `payload: Vec<u8>`. Dropping a
  `LiveSubscription` closes its connection, so there is no close method.

  `ClientReuseError` is a `thiserror` enum owned by this module, wrapping
  `LiveClientError` and `FactoryError` with `#[from]` and holding `NoPubSubNode`,
  `ClusterPubSub` and `Timeout`.

  Service seam. This module also declares the pieces B4326 to B4329 share, so none
  of them declares its own. `ServiceEvent` has `call_type: &'static str`, `duration:
  Duration` and `key: Option<String>`. `trait ServiceHooks: Send + Sync` is sync and
  object safe, with `fn success(&self, event: &ServiceEvent)` and `fn failure(&self,
  event: &ServiceEvent, error: &(dyn std::error::Error + Send + Sync))`.
  `BreakerAdmission` holds a private `u64` that only the gate fills. `BreakerOpen`
  is a small `thiserror` struct whose text is "Redis circuit breaker is open,
  skipping" followed by the breaker name. `trait BreakerGate: Send + Sync` is sync
  and object safe, with `fn enter(&self, name: &'static str) ->
  Result<BreakerAdmission, BreakerOpen>`, `fn exit(&self, admission:
  BreakerAdmission)`, `fn record_failure(&self, error: &(dyn std::error::Error +
  Send + Sync))` and `fn swallowed(&self, admission: &BreakerAdmission, error: &(dyn
  std::error::Error + Send + Sync))`. They stand in for `_enter_circuit_breaker`,
  `_exit_circuit_breaker`, the health-failure check and
  `_record_swallowed_redis_failure` (B393) and for `service_success_hook` and
  `service_failure_hook` (B012). B5630 implements the gate over B393 and the hooks
  over B012. `swallowed` takes the admission so the gate can count a failure per
  call, since LiteLLM's ContextVar counter has no counterpart. Each of the four sits
  in its own file under `redis_client_reuse/`, and B4326 to B4329 import them from
  `redis_client_reuse`.

  Tests reuse the fake server at `crate::redis_live_client::tests::fake_server`, and
  each group is a file under `redis_client_reuse/tests/`. The oracle helper op `b4325`
  has two functions. `cluster_pubsub_node` takes startup nodes, username, password,
  ssl and socket_timeout, and returns host, port, username, has_password, ssl and
  socket_timeout. Its Python side builds an unconnected `redis.asyncio.RedisCluster`,
  whose default node is None, and reads the kwargs of the returned client's pool. For
  the no-nodes case Python passes a stub because `RedisCluster` refuses empty nodes.
  `client_key_same` takes two settings maps and returns `{same: bool}`. Each case file
  is `kind: helper` with `call: {b4325: {function: ..., ...}}`.

