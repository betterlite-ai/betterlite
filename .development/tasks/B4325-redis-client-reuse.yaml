deviations:
  - what: >-
      The Cluster pubsub client always connects to the first startup node. After
      LiteLLM's client has initialized, it may use the node redis-py discovered as
      default.
    why: redis-rs has no default node. Redis Cluster broadcasts PUBLISH to every node, so any node works.
  - what: >-
      A `RedisCache` over a Cluster client answers a cross-slot MGET. redis-py raises
      an error there, and LiteLLM turns that into a miss.
    why: redis-rs splits MGET per slot on every Cluster connection, so failing would take extra code to lose a working read.

out_of_scope:
  - RedisCircuitBreaker and the Redis failure guards in `litellm/caching/redis_cache.py`; B393 owns them.
  - "`RedisCache.__init__`, `async_increment`, `async_get_cache`, `async_batch_get_cache`, `async_increment_pipeline`, `async_get_ttl` and `async_refresh_ttl`; B360 owns them and can build on `RedisTransport`."
  - "`_AsyncRedisCommands`, `_decoded_counts`, `_get_call_stack_info`, `check_and_fix_namespace`, `_parse_redis_major_version`, `_get_cache_logic` and `_BreakerMetrics`; B4324 owns them."
  - "`_setup_health_pings`, `_handle_async_ping_error`, `_handle_sync_ping_error`, `sync_ping`, `ping`, `delete_cache_keys`, `client_list`, `info`, `flush_cache`, `flushall`, `disconnect`, `test_connection` on both cache classes, `async_delete_cache` and `delete_cache`; B4326 owns them."
  - "`set_cache`, `async_set_cache`, `_pipeline_helper`, `async_set_cache_pipeline`, `async_set_cache_pipeline_with_ttls`, `_set_cache_sadd_helper`, `async_set_cache_sadd`, `batch_cache_write` and `flush_cache_buffer`; B4327 owns them."
  - "`increment_cache`, `increment_with_floor`, `batch_get_counts`, `async_batch_get_counts`, `async_scan_iter`, `async_register_script`, `_register_script_for_current_loop`, `_incrbyfloat_with_ttl`, `async_set_max`, `async_increment_with_floor` and `_pipeline_increment_helper`; B4328 owns them."
  - "`RedisCache.get_cache` (L1541-L1564) and `RedisCache.batch_get_cache` (L1583-L1645); B4327 takes them with the rest of the sync cache surface, on top of `sync_client` and `mget` here."
  - The list operations at L2053-L2420 of `litellm/caching/redis_cache.py`; B4329 owns them.
  - "`RedisClusterCache.redis_sync_redis_cluster_client` is set to None and never assigned; no caller at the pin."
  - "`LLMClientCache` itself in `litellm/caching/llm_caching_handler.py`; this entry doesn't cover that file and only copies its cap."

pitfalls:
  - >-
    The test for pubsub is the client's kind and the test for `init_async_client` is
    the family. A `RedisCache` with startup nodes is the case where they differ, so
    don't merge the two into one check.
  - >-
    Never hold the store's mutex across `.await`. Take the `Arc` to the cell, drop the
    guard, then await `get_or_try_init`.
  - A key that leaves out the password would hand one tenant's connection to another. Include every field and never log the serialized form.
  - >-
    `RedisScalar` and `AsyncRedisCommands` don't include MGET, so go through
    `LiveAsyncClient::query` and don't add methods to the trait, since
    `cache_primitives` belongs to B4324.
  - The rule against one-line functions applies here, so use public fields rather than getters.
  - "`LiveSyncClient::query` holds a `std::sync::Mutex` during network I/O. This is fine only because it never runs on an async thread."

review_level: security

