  why: The public async methods.
dod:
- text: "`MCPClient` keeps LiteLLM's constructor and method signatures, and refuses the callback and auth-object arguments by name."
  proof: [mcp-py-signature]
- text: "`list_tools`, `call_tool`, `list_prompts`, `get_prompt`, `list_resources`, `list_resource_templates` and `read_resource` give the same `model_dump(by_alias=True, exclude_none=True)` as LiteLLM against one server."
  proof: [mcp-py-methods]
- text: "`raise_on_error`, an error result, a 401 and a protocol error behave as in LiteLLM, and an unknown native error type raises `UnknownNativeError`."
  proof: [mcp-py-errors]
- text: "`run_with_session` gives an `MCPSession`, closes it after a result, an exception and a cancellation, and `load_mcp_tools` and `call_openai_tool` give LiteLLM's tools and result through it."
  proof: [mcp-py-session]
- text: The four transform functions, `_normalize_mcp_input_schema` and the tool-call argument parsing give LiteLLM's output for the same input.
  proof: [mcp-py-transforms]
- text: A session that is not an `MCPSession` is refused by name.
  proof: [mcp-py-session]
- text: The package passes ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: mcp-py-signature
    why: A caller's keyword is refused, or an unsupported callback is dropped silently.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_mcp_client.py -k signature
  - id: mcp-py-methods
    why: A method result differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_mcp_client.py -k methods
  - id: mcp-py-errors
    why: A failing server raises a different error than LiteLLM, or none.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_mcp_client.py -k errors
  - id: mcp-py-session
    why: A session stays open after the operation, or a foreign session is accepted.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_mcp_tools.py -k session
  - id: mcp-py-transforms
    why: A tool schema reaches the model in the wrong shape.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_mcp_tools.py -k transform
  - id: python-lint
    why: The public layer is where an untyped dict would creep back in.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`load_mcp_tools`, `call_openai_tool`, `call_mcp_tool` and `list_tools_with_pagination` accept only an `MCPSession` from `MCPClient.run_with_session`, and refuse an `mcp.ClientSession` with `UnsupportedMcpArgument`."
  why: The wheel has no `mcp` package, and the pagination and the call run in Rust.
- what: "`sampling_callback`, `elicitation_callback`, `logging_callback`, `aws_auth`, `resolved_auth` and `host_progress_callback` raise `UnsupportedMcpArgument`."
  why: Rust cannot call back into Python in the middle of a session, and an `httpx2.Auth` object cannot drive the Rust transport. AWS signing is picked by `auth_type` "aws_sigv4".
- what: "`MCPSigV4Auth` and the `_MCPHTTPClient` and `_MCPResponseStream` helpers (client.py L200-L375) are not exposed."
  why: They exist to feed `httpx2` and are replaced by B4742 and B4743 in Rust.
- what: Result objects are `ResponseObject` classes, not pydantic models.
  why: The wheel depends only on python-dotenv.
out_of_scope:
- The native bridge, its error type and `tests/mcp_server.py` are B8080.
- 'The package `__init__.py` files, with `__all__ = ["call_openai_tool", "load_mcp_tools"]`, are B168.'
- '`to_basic_auth`, `strip_auth_scheme`, `to_basic_credentials`, `_strip_header_whitespace`, `_first_non_cancelled_cause`, `as_mcp_read_timeout`, `_run_bounded_cleanup`, `_create_transport_context`, `_get_safe_stdio_env`, `_initialize_session`, `_execute_session_operation`, `_create_httpx_client_factory`, `_get_auth_headers`, `_header_slot`, `_list_optional_pages` and `prepare_request_auth` run in Rust (B4741 to B4746) and have no Python face.'
- '`error_text_result` lives in the proxy file result_conversion.py. Only its 5-line body is rebuilt inside `error_tool_result` here.'
pitfalls:
- '`MCPClient.timeout` is `timeout if timeout is not None else MCP_CLIENT_TIMEOUT`, so the default comes from `LITELLM_MCP_CLIENT_TIMEOUT` (60.0) read when the object is built, not a hard-coded value.'
- '`list_tools` returns an empty list on error unless `raise_on_error=True`, and `call_tool` returns an `is_error` result the same way, so a test must call both ways.'
- '`close` order matters: `run_with_session` awaits `aclose()` in a `finally`, and a cancellation raised there must still propagate after the close.'
- '`model_dump` without `by_alias` gives snake_case, so a comparison against LiteLLM passes `by_alias=True` on both sides.'
- A `Tool.input_schema` that is not an object schema is normalized in Rust only, so Python must not repair it first.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
