id: B8082
title: Python MCPClient, tool helpers and MCP result objects
description: >-
  A LiteLLM user writes `from litellm.experimental_mcp_client.client import MCPClient` and `from litellm.experimental_mcp_client
  import load_mcp_tools, call_openai_tool`. This task builds those names in the betterlite wheel over B8080's native bridge. It
  is a thin layer: Python collects arguments into JSON, calls `NativeMcpClient`, and builds result objects from the JSON that
  comes back. Read B158's task file for the pattern (JSON in, JSON out, a table of native error types, explicit exports).


  Files, all under `crates/betterlite-python/python/betterlite/experimental_mcp_client/`, each under the 300-line limit.
  `types.py` has the result classes built on B5657's `ResponseObject`: `Tool`, `CallToolResult`,
  `CallToolRequestParams` (`name`, `arguments`), `TextContent` and the other content blocks, `ListToolsResult`, `Prompt`,
  `GetPromptRequestParams`, `GetPromptResult`, `Resource`, `ResourceTemplate` and `ReadResourceResult`. Their attributes are
  the MCP SDK's snake_case names (`input_schema`, `is_error`, `structured_content`, `next_cursor`), and `model_dump(by_alias=True)`
  gives the wire names (`inputSchema`, `isError`, `structuredContent`, `nextCursor`) with `exclude_none=True`. They are built
  from the camelCase JSON that B8080 returns. `errors.py` has `McpError(code, message, data)` and
  `UnsupportedMcpArgument(name)`, and one explicit `dict` from the `type` in `NativeMcpError` JSON to `McpError`, `TimeoutError`,
  `RuntimeError`, `ValueError` and `asyncio.CancelledError`. Each is raised `from` the native error, and a `type` missing from
  the table raises `UnknownNativeError` with the payload, never a generic error.
  `MCPTransport`, `MCPAuth` and `MCPStdioConfig` are not defined in this task: B7943 owns litellm/types/mcp.py as `betterlite.types.mcp`, so `types.py` and `client.py` import them from there and keep no copy. B7943 has to merge before this task starts.


  `client.py` has `MCPClient` with LiteLLM's constructor (L386-L428): same names, order and defaults. It builds the settings JSON
  for `NativeMcpClient`. `sampling_callback`, `elicitation_callback`, `logging_callback`, `aws_auth` and `resolved_auth` raise
  `UnsupportedMcpArgument` with the name when not None, and so does `host_progress_callback` in `call_tool`. `ssl_verify` is a
  bool or a path string; any other value raises `UnsupportedMcpArgument`. `protocol_version` is checked against "auto" and the
  legacy versions with a plain `ValueError` listing them. `list_tools`, `call_tool`, `list_prompts`, `get_prompt`,
  `list_resources`, `list_resource_templates`, `read_resource` and `discovery_auth_fingerprint` are coroutines with LiteLLM's
  names, keyword-only markers and defaults (L817-L1225), each calling the matching native method. `error_tool_result(exc)` is a
  static method that builds the `CallToolResult` with `is_error` true and one `TextContent` holding `f"{type(exc).__name__}: {exc}"` (proxy/_experimental/mcp_server/result_conversion.py L60-L64), matching what
  B4745 returns. `update_auth_value` forwards to the native client and keeps `_mcp_auth_value` readable as LiteLLM does.
  `run_with_session(operation, *, quiet_on_error=False)` opens `NativeMcpClient.open_session()`, wraps it in `MCPSession`, awaits
  `operation(session)` and always awaits `aclose()`. A cancellation of the caller still closes the session before it
  propagates. `MCPSession` is the object a user's operation receives. It has `list_tools(params=None)`, `call_tool(name, arguments)`
  and `initialize` is not exposed because the session is initialized already.


  `tools.py` has `transform_mcp_tool_to_openai_tool`, `transform_mcp_tool_to_openai_responses_api_tool`,
  `transform_mcp_tool_to_anthropic_tool` and `_normalize_mcp_input_schema` over the native pure functions,
  `list_tools_with_pagination(session, listing_deadline=None)`, `load_mcp_tools(session, format="mcp")`, `call_mcp_tool`,
  `_get_function_arguments`, `transform_openai_tool_call_request_to_mcp_tool_call_request` and `call_openai_tool`
  (litellm/experimental_mcp_client/tools.py L27-L236). The `session` argument must be an `MCPSession`. Any other object (for
  example an `mcp.ClientSession`) raises `UnsupportedMcpArgument("session")`, because the pagination and the call run in Rust.
  `_get_function_arguments` keeps LiteLLM's rule: a JSON string parses, bad JSON gives `{}`, and a non-dict gives `{}`.


  This task creates the package `__init__.py` as an empty file and B168 fills it in, so tests here import the submodules.
  Tests call `litellm` and `betterlite` with the same arguments against `tests/mcp_server.py` (B8080) and compare results with
  `model_dump(by_alias=True, exclude_none=True)`. LiteLLM's side uses the `mcp` and `httpx2` packages that the oracle project
  already locks through `litellm[proxy]`.
