    why: Audited remainder; both X42 methods and its module instance have no caller at the pin.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/test_prompts/test_hello_world_prompt.prompt#L1-L11
    why: Unreferenced example retained in coverage, with no runtime reader to implement.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/init_prompts.py#L10-L28
    why: B8293's startup behavior now proved through the shared registry and inference.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6390-L6398
