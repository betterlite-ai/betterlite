dod:
  - text: The live callback factory and ordered callbacks feed one PromptHookDispatch per logging call, with shared registry access released before remote awaits and no state leakage between calls.
    proof: [runtime-tests, wiring-regressions, new-http-cases, oracle]
  - text: Config, repository and generic prompts reach chat and Responses through production pre-call and SDK ports; prompt-model groups use router prompt dispatch and retain the direct/routed distinction.
    proof: [runtime-tests, wiring-regressions, new-http-cases, oracle]
  - text: Configured registry identity, environment, version, ignore flags and message order match LiteLLM, and CRUD changes become visible to later inference without a second registry or mount.
    proof: [runtime-tests, new-http-cases, oracle]
  - text: The global_prompt_directory key is loaded with its None default and normal environment resolution, and the configured factory renders a real local prompt lazily.
    proof: [section-tests, directory-wiring, new-http-cases, oracle]
  - text: Config corpus inputs run through the production loader, while malformed section values name the setting and do not leak input data.
    proof: [section-tests, config-corpus]
  - text: Auth, aliases, stream cleanup and preview/converter isolation survive the composition without route registration changes.
    proof: [wiring-regressions, new-http-cases, oracle]
checks:
  optional: [mutants]
  commands:
    - id: runtime-tests
      why: production dispatch lacks the real factory, registry, ordered callbacks or per-call logging state
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::prompt_runtime::/)'
    - id: section-tests
      why: global_prompt_directory is unknown, has the wrong default or loses normal environment resolution
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::prompt_runtime::/) - test(replay_prompt_runtime_corpus)'
    - id: directory-wiring
      why: parsing the setting alone would pass while the factory ignores it
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::prompt_runtime::.*directory_reaches_factory$/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::prompt_runtime::.*loads_global_prompt_directory$/)'
    - id: wiring-regressions
      why: a constructor or route change bypasses existing hook, provider or stream behavior
      run: test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-server/src/app/inference/prompt_runtime.rs crates/betterlite-server/src/app/inference/prompt_runtime)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::callbacks::catalog::prompt_factory::/) | test(/^state::callback_loggers::prompts::/) | test(/^proxy_logging::/) | test(/^app::inference::router_completion::/) | test(/^routes::chat::/) | test(/^routes::responses::/) | test(/^api::responses_routes::/) | test(/^routes::prompt_tools::/) | test(/^app::admin::prompts::/)'
    - id: config-corpus
      why: a new corpus is absent or the real configuration decoder fails its replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/prompt_runtime)" && test -f crates/betterlite-config/fuzz/fuzz_targets/prompt_runtime.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::prompt_runtime::.*replay_prompt_runtime_corpus$/)'
    - id: new-http-cases
      why: the parts would still have only pure-function or isolated-route coverage
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/prompts/runtime)"
