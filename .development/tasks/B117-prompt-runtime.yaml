deviations: []
out_of_scope:
  - "X42PromptManagement.get_chat_completion_prompt, its integration_name property and x42_prompt_management in proxy/custom_prompt_management.py L10-L45: no caller at the pin; dynamic user Python classes remain B165, not a new built-in X42 backend."
  - "proxy/test_prompts/test_hello_world_prompt.prompt: example with no reader at the pin; no copied fixture or executable behavior."
  - "proxy/prompts/__init__.py is empty; init_prompts.py init_prompts L10-L28 and the prompts config section: B8293; startup call and shared registry construction: B8613 and B8610."
  - "Endpoint row contracts/helpers: B4059; list_prompts, get_prompt_versions, _get_prompt_template and get_prompt_info: B4061; create_prompt, update_prompt, delete_prompt, _reload_prompt_in_registry and patch_prompt: B4062; test_prompt and convert_prompt_file_to_json: B9010."
  - "Registry selection/accessors: B4059; initialize_prompt, supported initializers, key/cache mutation and deletion: B4060; database polling and stale removal: B8384; read/write mounts and their standalone HTTP cases: B8672."
  - "Template parsing, schema, rendering, fetching and compilation algorithms: B4051-B4058. Backend initialization stays in those parts; directory wiring here calls the existing constructor."
  - "Prompt hook gate/selection/logging/cache-breakpoint methods: B8560; _process_prompt_template: B8393; Router._is_prompt_management_model and _prompt_management_factory: B8466; RouterCompletion assembly and general router ports: B8630."
  - "SDK completion preparation and Responses hook algorithms: B5655, B931 and B932; route pre-call algorithms and existing aliases: B8803 and B8804 with their route owners. No enterprise prompt service is implemented."
pitfalls:
  - "The shared.prompts registry is live state, so a cloned registry at constructor time hides POST, PATCH and the database poll from inference."
  - "PromptLoggerFactory::configured preserves callback order and cached manager identity; rebuilding managers per request changes both selection and fetch caching."
  - "The proxy removes prompt_id only after resolving its registry entry; suppressing every later SDK hook would break configured callback-only prompts."
  - "Router._prompt_management_factory calls the synchronous logging hook even from async acompletion, so substituting its async sibling changes backend forwarding."
  - "global_prompt_directory belongs under litellm_settings and has no environment-variable default; a current-directory fallback would make an unset callback unexpectedly read files."
  - "B8672, B8613 and B9010 already register or initialize the prompt surfaces; this final task only connects their existing state and consumers."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
