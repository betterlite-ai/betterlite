deviations:
  - what: Row validation uses serde JSON decoding instead of Pydantic TypeAdapter.model_validate_python; behavior is equivalent.
    why: Rust uses serde instead of Pydantic; result validation is type-safe and occurs at the same boundary as LiteLLM's validation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/repository.py#L20
  - what: WriterDatabase holds a WriterSession reference instead of PrismaWrapper; WriterSession is the betterlite equivalent providing raw query/execute.
    why: B714 provides WriterSession as the native interface for writer-pinned queries; PrismaWrapper is LiteLLM's ORM layer which betterlite replaces.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/repository.py#L168-L176
  - what: Monetary amounts in Worker records use rust_decimal::Decimal instead of Python float.
    why: Budgets and costs must remain precise across persistence and calculations; Decimal avoids float accumulation errors.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/models.py#L45
out_of_scope:
  - B4500 owns Lens, Job and Worker record types and their validation; this task uses them for jsonb row construction.
  - B4502 owns source storage integration; this task owns only Lens/Job/Worker persistence.
  - B4503/B4504/B4505 own HTTP routes that call these repository methods; they do not modify the repository interface.
  - B709 owns the schema migrations and table definitions for LiteLLM_Lens, LiteLLM_LensRun and LiteLLM_LensWorker.
  - B714 owns WriterSession and writer-pinning semantics; this task uses it as an injected dependency.
pitfalls:
  - "The oracle helper for this task is pre-registered as b4501 in the db group. Replace the stub Op in tools/oracle/src/helpers/db/b4501.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/b4501.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task's to edit."
  - "When update() is called with a lens_id that does not exist, _try_update returns (True, None) immediately without executing the CTE; this is a normal outcome, not an error."
  - "Optimistic-update attempts default to 8 and must retry the entire fetch-transform-CTE sequence, not just the CTE. Exhaustion returns None, not an error."
  - "The CTE succeeds only when the version matches the one fetched at the start of the attempt. A concurrent update increments the version, causing the next attempt to re-fetch a stale lens and retry the transform."
  - "Archived jobs are inserted into LiteLLM_LensRun with ON CONFLICT (id) DO NOTHING, so re-running the same mutation in recovery does not duplicate archived rows."
  - "changed_only=True means: if transform(previous) == previous, return (True, None). If false, still update but return (True, None). changed_only=False means: always return the old value if unchanged, or the new value if changed."
  - "Worker revocation checks COALESCE((data->>'revoked')::boolean, false)=false, so missing revoked field or revoked=false both allow the update; only explicit revoked=true blocks it."
  - "Job history combines LiteLLM_LensRun.data and Lens.jobs array elements, so jobs() returns both archived and active jobs in one sorted stream, limited to 50 total with offset support for pagination."
  - "Result count validation in _try_update checks rows[0].data == 1, where the CTE returns to_jsonb(count(*)) from the updated table; if version mismatch caused zero updates, count is 0 and the attempt fails."
  - "Row validation occurs in every query/execute call; a decoding error on a stored record indicates database corruption, not a transient failure."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
