    - crates/betterlite-db/src/lens_repository.rs
    - crates/betterlite-db/src/lens_repository/**
    - tools/oracle/cases/helpers/lens-repository/**
    - tools/oracle/helpers/b4501.py
    - tools/oracle/helpers/b4501/**
    - tools/oracle/src/helpers/db/b4501.rs
    - tools/oracle/src/helpers/db/b4501/**
