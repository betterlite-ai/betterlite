id: B4501
title: Persist Lens jobs and worker credentials
description: >-
  Build crates/betterlite-db module lens_repository with writer-pinned Lens
  repositories over the existing Postgres schema, preserving eight optimistic-update
  attempts with version-based concurrency control and a CTE that archives displaced
  jobs only after a successful version check. Implement typed row adapters for all
  Lens, Job and Worker decoding from jsonb columns, and repository methods for querying
  and mutating records with respect to versioning. Preserve 50-job history pages in
  the jobs query (combined from both LiteLLM_LensRun and LiteLLM_Lens.jobs array),
  changed_only behavior where update returns None when no mutation occurs, revocation-aware
  billing-key updates that skip revoked workers, and distinct worker heartbeat writes
  that update last_seen atomically. The Database protocol abstracts raw query/execute
  against the writer session; WriterDatabase wraps the PrismaWrapper writer with
  typed result validation. Direct dependencies: B4500 for Lens, Job and Worker record
  encoding/decoding; B714 for WriterSession raw query/execute interface replacing
  LiteLLM's writer_wrapper; B709 for schema definitions of LiteLLM_Lens, LiteLLM_LensRun
  and LiteLLM_LensWorker tables. Use Decimal for monetary amounts in Worker records
  consistently with B4500.
