  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/repository.py#L11-L13
    why: Database protocol definition with query_raw and execute_raw methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/repository.py#L57-L88
    why: Optimistic-update CTE with version check, archival of displaced jobs and returned count validation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/repository.py#L90-L102
    why: 50-job history pages combining LiteLLM_LensRun and LiteLLM_Lens.jobs array with ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/repository.py#L142-L152
    why: Revocation-aware billing-key update that skips revoked workers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/repository.py#L160-L165
    why: Worker heartbeat update with last_seen timestamp.
dod:
  - text: Database protocol defines query_raw and execute_raw methods, and WriterDatabase implements the protocol with type validation on results.
    proof: [database-protocol-tests]
  - text: LensRepository constructs with a Database implementation and stores it as a Final/immutable field.
    proof: [repository-construction-tests]
  - text: lenses() returns all Lens records from LiteLLM_Lens ordered by id, and get(lens_id) returns a single Lens or None.
    proof: [lens-query-tests]
  - text: create(lens) inserts a new Lens with version 0 into LiteLLM_Lens and returns the unchanged lens.
    proof: [lens-create-tests]
  - text: update(lens_id, transform, attempts=8, changed_only=False) performs up to eight optimistic-update attempts, calling _try_update each time.
    proof: [optimistic-update-tests]
  - text: "_try_update fetches the current lens, applies the transform, checks version equality with a CTE, archives displaced jobs only on successful update, and returns (completed, updated) tuple where completed indicates success."
    proof: [version-race-tests]
  - text: "update(lens_id, ...) returns None immediately without attempting the CTE when the lens_id does not exist in the database."
    proof: [update-lens-missing-tests]
  - text: "The update CTE (WITH previous, updated, archived) succeeds only when version matches; it archives jobs from previous that don't exist in the new jobs list to LiteLLM_LensRun with ON CONFLICT DO NOTHING."
    proof: [archive-displaced-jobs-tests]
  - text: "changed_only=True returns (True, None) when transform produces unchanged lens; changed_only=False returns (True, previous) when unchanged."
    proof: [changed-only-tests]
  - text: jobs(lens_id, offset=0) returns up to 50 Job records from both LiteLLM_LensRun and Lens.jobs array, combined and ordered by created_at DESC then id DESC.
    proof: [history-pages-tests]
  - text: job(lens_id, job_id) returns a single Job from either LiteLLM_LensRun or Lens.jobs array, or None if not found.
    proof: [single-job-query-tests]
  - text: workers() returns all Worker records from LiteLLM_LensWorker, and worker(token_hash) returns a single Worker by token_hash or None.
    proof: [worker-query-tests]
  - text: "save_worker(worker, token_hash=None) inserts a new worker with token_hash if provided, or updates an existing worker by id; both operations persist the Worker jsonb in LiteLLM_LensWorker.data."
    proof: [worker-save-tests]
  - text: "set_worker_billing(worker_id, key_id) updates analysis_key_id atomically for workers where revoked=false, returning the updated Worker or None if worker is revoked or missing."
    proof: [revocation-aware-update-tests]
  - text: revoke_worker(worker_id) sets the revoked flag to true in the worker's data jsonb.
    proof: [worker-revocation-tests]
  - text: heartbeat(worker_id, now) updates the last_seen timestamp in the worker's data jsonb.
    proof: [worker-heartbeat-tests]
checks:
  optional: []
  commands:
    - id: database-protocol-tests
      why: Database protocol or WriterDatabase wrapper is missing or does not validate result types.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::database::/)'
    - id: repository-construction-tests
      why: LensRepository construction or initialization is missing or incorrect.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::construction::/)'
    - id: lens-query-tests
      why: Lens query methods (lenses, get) do not return all or single records correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::lens_queries::/)'
    - id: lens-create-tests
      why: Lens creation does not insert records or version 0 correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::lens_create::/)'
    - id: optimistic-update-tests
      why: Optimistic-update retry loop does not perform eight attempts or fails on exhaustion.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::optimistic_update::/)'
    - id: version-race-tests
      why: Version-based concurrency control or CTE validation does not detect conflicts.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::version_race::/)'
    - id: update-lens-missing-tests
      why: update() does not return None immediately when the lens_id does not exist, or attempts the CTE unnecessarily.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::update_lens_missing::/)'
    - id: archive-displaced-jobs-tests
      why: Displaced job archival to LiteLLM_LensRun does not preserve removed jobs or conflict handling.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::archive_displaced_jobs::/)'
    - id: changed-only-tests
      why: "changed_only parameter does not return None or previous correctly when lens is unchanged."
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::changed_only::/)'
    - id: history-pages-tests
      why: Job history query does not return 50 records, combine both tables, or order correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::history_pages::/)'
    - id: single-job-query-tests
      why: Single job query does not return from both tables or returns duplicates.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::single_job::/)'
    - id: worker-query-tests
      why: Worker query methods (workers, worker) do not return all or single records.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::worker_queries::/)'
    - id: worker-save-tests
      why: Worker save does not insert with token_hash or update by id correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::worker_save::/)'
    - id: revocation-aware-update-tests
      why: Billing-key update does not skip revoked workers or return None for revoked records.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::revocation_aware::/)'
    - id: worker-revocation-tests
      why: Worker revocation does not set the revoked flag atomically.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::worker_revocation::/)'
    - id: worker-heartbeat-tests
      why: Worker heartbeat update does not set last_seen timestamp correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^lens_repository::worker_heartbeat::/)'
