id: B9752
title: Compare policy editing, attachment and pipeline page requests with the proxy
description: >-
  Supply HTTP transcripts for the retained policies page, not another policy engine or UI.
  B9090 takes in every component and hook; this task sends their networking.tsx requests to
  both booted gateways. Use B9750's governance fixture with dashboard: {}, two teams and
  finops.key_metadata aliases from B9260, an admin
  session and a non-admin session. Configure a local litellm_content_filter guardrail and a
  parent policy through the owners' existing configuration. Keep the real policy registries,
  database writes and cache refresh behavior. Never call a Python handler as an oracle helper.

  Lists and editing. GET /policies/list and GET /policies/attachments/list have no query or
  body. Their envelopes are policies[] and attachments[]. PolicyTable, policy_info and the
  version picker consume policy_id,policy_name,inherit,description,guardrails_add,
  guardrails_remove,condition,pipeline,version_number,version_status,parent_version_id,
  created_at,updated_at,created_by,updated_by and definition_location. GET /policies/
  <id> returns the policy itself; GET /policies/<id>/resolved-guardrails returns
  resolved_guardrails[]. B3248 owns these handlers and B8669 mounts them. POST /policies
  sends policy_name, nonempty description/inherit when supplied, guardrails_add and
  guardrails_remove arrays, and condition:{model:<selection>} only when selected.
  PUT /policies/<id> sends the same form shape. DELETE /policies/<id> has no body.
  Writes are followed by the actual list/detail requests; do not assert a repository directly.

  Versions. B3244 owns GET and POST /policies/name/<encoded-name>/versions and PUT
  /policies/<id>/status, also mounted by B8669. The page's create-version POST body is {},
  not source_policy_id. GET reads versions[] with the Policy fields above. Status bodies are
  {version_status:"published"} then {version_status:"production"}; mutations return the
  selected Policy. The pinned initial create defaults to production and PUT only edits a
  draft. Exercise the resulting 400 when directly editing the initial version, create a draft,
  edit it, publish and promote, then check list/detail/versions and the previous production
  status. Keep the original write order; neither the page nor the proxy promises a transaction.

  Attachments. POST /policies/attachments sends one body per selected policy, never a bulk
  array. buildAttachmentData emits policy_name, scope:"*" for global or nonempty teams,
  keys,models,tags arrays for specific scope, priority only when numeric (including zero),
  and default only when true. The teams and keys arrays contain aliases, not IDs/hashes.
  Read attachment_id,policy_name,scope,teams,keys,models,tags,priority,default,
  definition_location and creation/update fields in the list. DELETE
  /policies/attachments/<id> has no body and refreshes the list. B3248/B8669 own both.
  The form previews the first selected policy by POST /policies/attachments/estimate-impact
  with that same generated body. ImpactPopover instead sends only policy_name,scope,teams,
  keys,models,tags from the persisted row, including its null/empty fields; it omits priority
  and default. B3249 owns impact and B8790 mounts it. Both views read affected_keys_count,
  affected_teams_count,sample_keys[],sample_teams[]; -1 is the global-scope sentinel.

  PolicyTestPanel POST /policies/resolve sends only nonempty team_alias,key_alias,model,tags
  selections. No force_sync query is sent. Read effective_guardrails[] and matched_policies[]
  policy_name,matched_via,guardrails_added. B3250 owns resolution; B9321 mounts it using
  B9320's shared runtime. Use a config-backed match
  as well as post-write resolution, without adding force_sync to hide a cache bug. Avoid
  nondeterministic set order by using one effective guardrail in each compared context.

  Selectors send GET /team/list without a query from AddAttachmentForm and with user_id
  from PolicyTestPanel, including when that caller is admin (B813). Read team_id/team_alias
  from the array. Both use B782 GET /key/list?page=1&size=100&return_full_object=true&
  include_team_keys=true&include_created_by_keys=true&substring_matching=true with no sort,
  expand or status query, reading keys[].key_alias. Compare role-scoped populated responses,
  not just empty options. GET /models?include_model_access_groups=True reads data[].id
  (B007), and GET /v2/guardrails/list with /guardrails/list fallback reads guardrails[]
  name/params (B3684/B8667). Reuse B9735's exact model and guardrail selector cases.

  PipelineFlowBuilder saves POST /policies or PUT /policies/<id> with policy_name,
  description when nonempty, guardrails_add equal to the steps' guardrail names,
  guardrails_remove:[], and pipeline:{mode,steps}. mode is pre_call or post_call; each step
  has guardrail,on_fail,on_pass and optional on_error,pass_data,modify_response_message.
  Quick testing and the compliance dialog POST /policies/test-pipeline with that pipeline and
  test_messages:[{role:"user",content:<prompt>}]. Compliance runs the same request once per
  selected local compliance prompt, not /utils/test_policies_and_guardrails. B3247 owns the
  handler; B8790 mounts it. Read terminal_action,modified_data,error_message,
  modify_response_message and step_results[].guardrail_name,outcome,action_taken,
  modified_data,error_detail,duration_seconds. Test passing and blocked content with actual
  built-in guards, a response modification and a two-step chain; do not mock handler results.

  No on-disk HTTP case currently sends these policy routes. B8669's planned cases cover
  empty/config reads and database-free mutation failures, not successful versioned writes;
  B3250 covers resolve without a database and invalid/auth requests; B8790's pipeline cases
  use unknown guards and its impact cases lack a database. B9730's key selector uses size=50,
  sort and expand, so it cannot cover this size=100 request. Add only the missing transcripts
  listed below, about 650 case lines. Compare complete stable HTTP responses, content type
  and error type/param/code. Capture generated IDs per gateway and normalize only those
  values, timestamps and measured durations, never whole policy/pipeline objects. All auth
  uses discovery's auth_header_name, Authorization by default, with Bearer session keys.
scope:
