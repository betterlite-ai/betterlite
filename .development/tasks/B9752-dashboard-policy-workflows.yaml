  - tools/oracle/cases/ui/policy-workflows/draft-edit-publish-promote.yaml
  - tools/oracle/cases/ui/policy-workflows/production-edit-error-and-delete.yaml
  - tools/oracle/cases/ui/policy-workflows/scoped-attachments-and-form-impact.yaml
  - tools/oracle/cases/ui/policy-workflows/global-default-and-row-impact.yaml
  - tools/oracle/cases/ui/policy-workflows/resolve-without-force-sync.yaml
  - tools/oracle/cases/ui/policy-workflows/team-and-key-alias-selectors.yaml
  - tools/oracle/cases/ui/policy-workflows/save-and-test-pipeline.yaml
  - tools/oracle/cases/ui/policy-workflows/compliance-prompts-and-modified-response.yaml
