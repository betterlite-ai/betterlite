  - tools/oracle/cases/ui/management-selectors/guardrail-v2-and-v1.yaml
deviations: []
out_of_scope:
  - B9090 retains all UI component, hook, test and compliance-data functions in the covered files; no TypeScript source is translated here.
  - B3248 owns policy CRUD and attachment handlers; B3244 owns versions; B8669 mounts both. B3247/B3249/B3250 own the other routes, with B8790 and B9321 composing them.
  - B9753 owns template catalog, suggestion, enrichment and preview contracts called by index.tsx; B148 supplies browser execution.
  - B813 owns team selectors, B782 key selectors and B9735 the reused model and guardrail selector cases.
pitfalls:
  - The New Version control sends {}, while a source_policy_id body would bypass the page's production-version selection path.
  - ImpactPopover omits priority and default; forwarding its entire attachment object tests a request the pinned page never sends.
  - A model condition is under condition.model, while an attachment model scope is a models array.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
