  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_endpoints.py#L74-L320
    why: List/create and B3244's version routes from their decorators.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_endpoints.py#L383-L648
    why: B3248 CRUD/resolved guardrails and B3247 pipeline testing.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_endpoints.py#L656-L889
    why: Attachment listing, creation and deletion, owned by B3248.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_resolve_endpoints.py#L215-L315
    why: B3250 resolution, with force_sync default false as sent by the page.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_resolve_endpoints.py#L323-L425
    why: B3249 impact route and its consumed count/sample response.
dod:
  - text: Policy create, draft edits, publication, promotion and deletion preserve the actual form bodies and response records over HTTP.
    proof: [policy-transcripts, oracle]
  - text: Alias-scoped and global attachments, both preview shapes and no-force-sync resolution work with populated real databases.
    proof: [policy-transcripts, oracle]
  - text: Page-sized selectors and both pipeline test callers exercise authorized proxy routes with real guardrail execution.
    proof: [policy-transcripts, oracle]
checks:
  optional: []
  commands:
    - id: policy-transcripts
      why: The dependency's empty/error cases would pass without any policy-page success workflow.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/policy-workflows)"
