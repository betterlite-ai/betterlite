  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/policies/_components/build_attachment_data.ts#L1-L31
    why: Alias scopes, numeric priority and true-only default serialization.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/policies/_components/add_attachment_form.tsx#L135-L233
