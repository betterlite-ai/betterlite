id: B7946
title: Python types for proxy management endpoints common_daily_activity to model_management (types/proxy/management_endpoints)
description: >-
  This task ports seven files from `litellm/types/proxy/management_endpoints/` into `crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/`:
  `common_daily_activity`, `config_overrides`, `customer_endpoints`, `internal_user_endpoints`, `key_management_endpoints`,
  `management_v1` and `model_management_endpoints`. It is Python only.


  `common_daily_activity.py` has the `GroupByDimension` string Enum and the spend and breakdown metric models. `internal_user_endpoints.py`
  and `key_management_endpoints.py` have `Where` TypedDicts (`InsensitiveContains`, `UserSearchWhere`, `KeyTokenWhere`,
  `KeySearchWhere`) and the bulk update models. `management_v1.py` has `ResourceResponse(BaseModel, Generic[TOut])`, a generic pydantic
  model; the port needs a generic `ResponseObject` subclass. `CustomerResponse` extends `LiteLLM_EndUserTable` and `ModelGroupInfoProxy`
  extends `ModelGroupInfo`; neither base has a Python owner, so give the port the fields of LiteLLM's base as plain fields.
scope:
  paths:
  - crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/common_daily_activity.py
  - crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/config_overrides.py
  - crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/customer_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/internal_user_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/key_management_endpoints.py
  - crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/management_v1.py
  - crates/betterlite-python/python/betterlite/types/proxy/management_endpoints/model_management_endpoints.py
  - crates/betterlite-python/tests/test_types_proxy_mgmt_endpoints_a.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/management_endpoints/common_daily_activity.py#L1-L157
  why: Spend metrics and breakdown models.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/management_endpoints/management_v1.py#L1-L51
  why: The generic ResourceResponse.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/management_endpoints/key_management_endpoints.py#L1-L104
  why: Bulk key update models.
out_of_scope:
- >-
  Team, SCIM and SSO types are in B7947.
pitfalls:
- >-
  `LiteLLM_EndUserTable` and `ModelGroupInfo` come from `proxy/_types.py` and `types/router.py`. Neither has a Python mirror owner. Put the base fields on the port class and name the gap in the notes.
dod:
- text: Every name in the covered LiteLLM files exists with the same keys, required keys, Literal values, Enum members and field defaults.
  proof: [names]
- text: Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: names
    why: A name, key or value differs from LiteLLM.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_proxy_mgmt_endpoints_a.py -k names
  - id: python-lint
    why: Strict typing has to hold for every ported module.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Names imported from the openai, httpx or pydantic packages are replaced by local equivalents or left out.
  why: The wheel depends only on python-dotenv.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
