id: B2332
title: MCP stored-secret rotation primitives
description: >-
  Lower the MCP storage helpers called by master rotation below B139, whose management umbrella
  depends on keys. Own db.py _is_global_env_var_scope L182-L185, _reencrypt_global_env_var_values
  L272-L317, encrypt_credentials L426-L471, _credentials_blob_to_mutable_dict L474-L476,
  _mcp_server_table_actions L479-L483, _oauth_client_table_actions L502-L508,
  _db_find_mcp_server_rows L625-L629, _user_credential_actions L652-L658,
  _MCPUserEnvVarsRepository/_user_env_var_actions L661-L668, _db_find_user_credential_rows L679-L683,
  _db_find_user_env_var_rows L702-L706, decrypt_credentials L709-L731,
  _reencrypt_mcp_credentials_blob L1308-L1323, rotate_mcp_server_credentials_master_key L1326-L1378,
  _decode_user_credential L1381-L1399, rotate_mcp_user_credentials_master_key L1442-L1479 and
  rotate_mcp_user_env_vars_master_key L1482-L1523. Flatten trivial repository accessors into B726
  and B714 native table calls rather than introducing one-line Rust wrappers.

  Credential encryption mutates the seven non-null fields auth_value,client_id,client_secret,
  client_private_key,aws_access_key_id,aws_secret_access_key,aws_session_token through B2303.
  Region/service and all other fields remain untouched. Decryption visits the same fields only
  when strings, with exception_type=debug and return_original_value=true. A falsey credentials
  blob returns null/no update; otherwise parse JSON or clone a mapping, decrypt then encrypt with
  the new key, and safe-dump. Invalid JSON propagates. Cases credential_field_matrix,
  credential_decrypt_passthrough, credential_empty_blob and credential_invalid_blob pin this.

  Global environment rotation accepts a JSON string or iterable of entries. Falsey values,
  invalid JSON/TypeError or an empty decoded value return null silently. Copy entries; scope user
  (enum or literal) is skipped, all other/missing scopes are global. Skip falsey value, decrypt
  with key mcp_global_env_var, debug and return_original_value=false. Null decrypt warns with the
  variable name and preserves its ciphertext. Encrypt successful values under the new key; return
  the rebuilt list only if any rotated, retaining corrupt and user entries alongside successes.
  Cases env_invalid_json_no_warning, env_scope_and_falsey_values, env_corrupt_preserved_warning,
  env_no_success_no_write and env_mixed_results verify every drop/retention path.

  Server rotation loads all rows, prepares credentials and global env_vars, then independently
  decode_secret_map/encrypt_secret_map for static_headers and env. A SecretMapDecodeError warns
  for that field/server and continues; other errors escape. With no prepared fields skip the
  row; otherwise add updated_by=touched_by and update by server_id. After all servers, load OAuth
  client rows and rotate nonempty credentials one at a time by server_id, without updated_by.
  Log separate updated counts. Cases server_secret_map_warning, server_empty_skip,
  server_updated_by, server_before_oauth_clients and server_midstream_failure prove sequential
  partial writes and that an early server error prevents the later OAuth-client stage.

  User credentials first decrypt credential_b64 with key mcp_user_credential/debug/no original
  fallback. If null, try legacy URL-safe base64 followed by UTF-8; the source's base64 permissiveness
  is preserved by the maintained decoder selected in B2303. Decode/Unicode/value/type errors
  return null. Empty decoded plaintext is a valid success. Undecodable rows warn with user/server
  IDs and increment skipped; successful rows encrypt and update credential_b64 using composite
  user_id_server_id. Cases user_legacy_base64, user_empty_plaintext, user_corrupt_skip,
  user_decode_error_classes and user_composite_update preserve behavior; no OAuth payload parsing occurs.

  User environment rows decrypt values_b64 with key mcp_user_env_vars/debug/no original fallback,
  with NO legacy-base64 path. Null results warn/skip; successes encrypt and update values_b64
  by the same composite ID. Both loops log rotated/skipped counts only after completion; encryption
  or update errors propagate and leave previous writes intact. Cases user_env_no_base64_fallback,
  user_env_empty_success, user_rotation_counts and user_rotation_partial_failure cover these cases.
  The user-env repository table literal is litellm_mcpuserenvvars; reads have optional where=None.

  Test real encrypted rows and failures with POSTGRES_TEST_URL or testcontainers, never skip.
  Helpers are callable with injected repositories and codecs; the oracle invokes the pinned
  functions, not a route. Native decode_mcp_rotation_blob uses bounded B003 JSON/base64 decoding;
  add mcp_rotation_blob fuzz/corpus replay for malformed JSON, legacy base64, UTF-8 and secret-map
  inputs. B2303 owns encryption formats and key precedence; B2305 owns typed MCP credentials.
  Secrets appear only in encrypted row assertions and test-safe oracle vectors, not runtime logs.

  Sizing: approximately 275 nonblank, noncomment source logic/declarations excluding docstrings;
  allow 290 production, 300 tests, 65 helper adapters, 55 fuzz and 40 wiring, 750 within 800.
scope:
  paths:
    - crates/betterlite-server/src/mcp_rotation.rs
    - crates/betterlite-server/src/mcp_rotation/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/mcp_rotation_blob.rs
    - crates/betterlite-server/fuzz/corpus/mcp_rotation_blob/**
    - tools/oracle/src/helpers/mcp_rotation.rs
    - tools/oracle/helpers/mcp_rotation.py
    - tools/oracle/src/helpers/management/keys.rs
    - tools/oracle/helpers/management/keys.py
    - tools/oracle/cases/helpers/mcp-rotation/**
    - tools/oracle/fuzz/corpus/helper_case/mcp-rotation-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L182-L317
    why: Own scope predicate and re-encryption at L272-L317; intervening normal env read/write helpers remain B139.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L426-L731
    why: Own the exact credential and repository adapter ranges listed in the description, not intervening management helpers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1308-L1523
    why: Own the three rotation loops, credential blob conversion and user credential decoding; OAuth payload helpers remain B139.
dod:
  - text: All named field, warning, decode and ordered-write cases match pinned helpers.
    proof: [behavior-tests, oracle, helper-python]
  - text: Actual encrypted Postgres rows retain source partial-write and skip behavior.
    proof: [postgres-tests]
  - text: Both bounded byte decoding and typed helper seeds replay their new corpora.
    proof: [parser-corpus, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: A rotation branch or warning case is missing.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp_rotation::tests::/) - test(/replays_the_/)'
    - id: postgres-tests
      why: Corrupt ciphertext preservation and partial writes are unverified against Postgres.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/mcp_rotation::tests::postgres_rows_and_failures$/)'
    - id: parser-corpus
      why: The stored-blob fuzz target or replay is missing.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/mcp_rotation_blob.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_mcp_rotation_blob_corpus)'
    - id: helper-python
      why: The real pinned helper adapter fails strict validation.
      run: test -f tools/oracle/helpers/mcp_rotation.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No newly added MCP rotation seed replays.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-rotation-*')" && grep -rlq mcp_rotation tools/oracle/fuzz/corpus/helper_case/mcp-rotation-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/mcp-rotation/credential-fields-and-corruption.yaml
  - tools/oracle/cases/helpers/mcp-rotation/global-env-scope-and-skips.yaml
  - tools/oracle/cases/helpers/mcp-rotation/server-and-oauth-write-order.yaml
  - tools/oracle/cases/helpers/mcp-rotation/user-base64-and-env-ciphertext.yaml
  - tools/oracle/cases/helpers/mcp-rotation/partial-failure-counts.yaml
deviations: []
out_of_scope:
  - B139 retains all other db.py functions, including OAuth parsing/refresh and normal server/user
    credential management; its encryption/decoder calls reuse the lowered helpers here.
  - B714/B726 own typed repository operations, B2303 owns secret maps and value codecs,
    B2305 owns stored MCP types, and B003 owns safe JSON serialization. No enterprise hook is added.
pitfalls:
  - MCP user credentials permit legacy base64, but MCP user environment values do not.
  - An unreadable global variable stays in a partially rotated list instead of disappearing from the row.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
