  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/worker.py#L138-L150
    why: main, the two environment variables, the 180 second timeout and the 10 second pause.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/deploy/lens/Dockerfile#L1-L6
    why: The Python image being replaced; user 65532 and the single command.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/deploy/lens/compose.yaml#L1-L12
    why: The Compose service with the two required variables and the hardening options.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/deploy/lens/compose.build.yaml#L1-L6
    why: The local build override.
dod:
  - text: failure_message returns the exact text for each error kind, the right action word per path suffix and the right guidance per status, with the generic guidance for an unlisted status.
    proof: [failure-tests]
  - text: model_request retries Timeout, Transport and the statuses 429, 502, 503, 504 with 1 s then 2 s pauses, makes at most three calls, and returns any other error at once.
    proof: [retry-tests]
  - text: run_once returns false when no job is claimed, posts the analysis result on success, and posts an error result with default coverage and the mapped message on failure, accepting a 409 answer and returning any other failed status.
    proof: [run-tests]
  - text: The heartbeat is sent every 30 seconds while the job runs, stops silently after the first failed heartbeat, and is stopped when run_once returns.
    proof: [run-tests]
  - text: The HTTP adapter sends the bearer header, the protocol_version query, the content query and each body to the documented paths, and maps timeout, connect, status and bad-body failures to the right WorkerError.
    proof: [http-tests]
  - text: The program refuses to start without LITELLM_URL or LENS_WORKER_TOKEN and never prints the token.
    proof: [settings-tests]
  - text: The four image files exist with the contents described, and the Compose files keep the required variables and hardening options.
    proof: [files-check]
checks:
  optional: []
  commands:
    - id: failure-tests
      why: the failure messages are missing or differ
      run: cargo nextest run --locked -p betterlite-lens-worker --no-tests=fail -E 'test(/^failure::/)'
    - id: retry-tests
      why: the model retry rule is missing
      run: cargo nextest run --locked -p betterlite-lens-worker --no-tests=fail -E 'test(/^worker::retry::/)'
    - id: run-tests
      why: run_once, its failure post or the heartbeat is missing
      run: cargo nextest run --locked -p betterlite-lens-worker --no-tests=fail -E 'test(/^worker::run::/)'
    - id: http-tests
      why: the HTTP adapter is missing or uses a wrong path
      run: cargo nextest run --locked -p betterlite-lens-worker --no-tests=fail -E 'test(/^http_api::/)'
    - id: settings-tests
      why: the environment settings are missing
      run: cargo nextest run --locked -p betterlite-lens-worker --no-tests=fail -E 'test(/^settings::/)'
    - id: files-check
      why: an image file is missing or lost a required line
      run: >-
        bash -n packaging/lens/tests/files.sh &&
        bash packaging/lens/tests/files.sh
oracle_cases: []
deviations:
  - what: The image builds a Rust binary on the Wolfi base and has no Python, httpx or pydantic layer.
    why: The worker is part of the Rust workspace.
  - what: compose.yaml has no default image digest; LENS_WORKER_IMAGE is required.
    why: LiteLLM's default points at its own published image, and betterlite has no published worker image yet.
  - what: The check for the image files is a text check (packaging/lens/tests/files.sh), not a docker build.
    why: The gate sandbox cannot reach the Docker socket.
out_of_scope:
  - "The server side of the /lens/worker routes: B4505."
  - "The analysis code itself (analyze_sample, the coordinator, the trace store): B4500, B4506, B4509."
  - "deploy/lens/README.md, the feature guide: the wave 17 Lens wiring part."
  - "Publishing the image to a registry: the release workflow."
pitfalls:
  - The worker needs two different failure texts for one HTTP error depending on the path, so keep the path in Status and test with `/lens/worker/l1/j1/model` and `/lens/worker/l1/j1/sample`.
  - 'Do not log the error text of a WorkerError: HTTP client errors can carry the full URL. Log the variant name only.'
  - The 10 second pause comes after every pass, a job included. Do not skip it after a job to claim the next one faster.
  - The failure post uses the SAME result path as the success post, and the proxy answers 409 when the run was cancelled or taken by another worker. That is not an error.
  - 'The heartbeat must not keep the process alive or outlive the job: abort it in every exit path, including a failed sample fetch.'
  - Mark the Authorization header value sensitive on every request so a debug print of a request cannot show the token.
  - 'Keep each file under the line limit: split the tests into worker/retry_tests.rs and worker/run_tests.rs if needed.'
review_level: security
budget:
  max_changed_lines: 1700
  max_new_expects: 0
