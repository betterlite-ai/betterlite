dod:
  - text: 'Batch tests and helper rows: absent_db_empty, empty_batch_no_io, ordered_duplicate_probes,
      cache_hits_survive_failed_fetch, cache_read_error_propagates, one_query_for_misses,
      requested_names_and_budget_include, fetched_row_wins, missing_rows_omitted,
      query_failure_debug_drop, decode_failure_debug_drop, cache_failure_keeps_prior_writes,
      management_ttl_used, null_spend_zero, absent_budget_none and zero_budget_retained.'
    proof:
      - behavior-tests
  - text: 'Registry cases: tag_registry_take_5001, group_registry_take_5001,
      distinct_registry_keys_locks, known_registry_filters_tags, empty_registry_skips_query,
      unavailable_registry_fetches_all, overflow_fetches_all, registry_error_propagates and
      group_fetch_does_not_load_registry. All are named helper cases; postgres_batch_relations
      verifies the native repository queries against real tables.'
    proof: [behavior-tests, helper-python, oracle]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server --no-tests=fail -E 'test(/^(auth::)?auth_tag_budgets::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_tag_budgets.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-tag-budgets-*")"
        && grep -rlq "auth_tag_budgets" tools/oracle/fuzz/corpus/helper_case/auth-tag-budgets-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_tag_budgets::tests::/)
        - test(/replays_the_/)'
