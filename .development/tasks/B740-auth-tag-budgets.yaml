id: B740
title: Tag and model access-group budget lookups
description: >-
  Implement batched tag and model-access-group budget reads. Both return an empty map without cache
  or SQL work when the DB is absent or the input sequence is empty. Probe every supplied name in
  order through B733, including duplicates; pass only cache misses to one find_many query. Retain
  cached hits on a failed fetch, omit unresolved names and let fetched rows overwrite same-name
  cache hits in the final map. Cache-read failures propagate; query, row-conversion and cache-write
  failures within either fetch log DEBUG and return no fetched rows. Earlier cache writes remain
  when a later write fails. These are deliberately fail-open budget reads, with no row mutation.

  Use B726 TagRepository and ModelAccessGroupBudgetRepository via B2315's unwrapped table adapters.
  Query tag_name.in or access_group_name.in, include litellm_budget_table, preserve database result
  order in cache writes and use B733 get_management_object_ttl. Group projection returns spend or
  zero and max_budget=None for a missing budget relation; a present zero maximum remains zero.

  Tag misses first call _load_tag_registry, which reads at most TAG_REGISTRY_MAX_SIZE+1=5001 rows
  and passes names, B733's tag registry cache key/overflow sentinel and its own load lock to B1218
  _load_bounded_registry. The group registry analog uses MODEL_ACCESS_GROUP_REGISTRY_MAX_SIZE=5000
  and a separate lock/sentinel. A known empty registry skips all tag SQL; None means unavailable or
  overflow and fetches every requested miss. Registry failures are outside the fetch try block.
  Group-budget fetches never call the group registry because their caller has already intersected
  matched_model_access_groups. Test both loader functions directly; B1218 owns overflow warnings,
  negative-cache TTL and locking implementation. These limits are constants, not config keys.

  Postgres tests selected by POSTGRES_TEST_URL, or testcontainers, assert exact relation projection,
  one batched row query and no INSERT/UPDATE. The helper operation records all cache/query effects;
  auth HTTP cases only verify these lookups' fail-open result through existing budget admission.


  Build the production auth_tag_budgets module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _load_tag_registry (L2086-L2105; 18 source lines), _load_model_access_group_registry (L2108-L2127; 18
  source lines), _fetch_uncached_model_access_group_budgets (L2130-L2163; 32 source lines), _model_access_group_budget
  (L2166-L2172; 7 source lines), get_model_access_group_budgets_batch (L2176-L2204; 27 source lines),
  _fetch_uncached_tags (L2207-L2243; 35 source lines), get_tag_objects_batch (L2247-L2287; 37 source lines).


  Pass projected spend/max values through unchanged; this lookup does no threshold arithmetic.


  Add the auth_tag_budgets operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-tag-budgets-*
  seed to B171 helper_case, which already owns this decoder.


  Register the batch-read service in B732. Through POST /v1/chat/completions, assert a failed fetch
  keeps cached budgets enforceable while unresolved names remain omitted; budget errors use B757.


  Row conversion and registry overflow are tested independently from request parsing, which this
  module does not perform. Use distinct tag and access-group names to expose accidental shared locks.


  Sizing: 174 nonblank, noncomment pinned source lines; allow 175 production, 250 tests, 80 adapters
  and 60 wiring lines, 565 within 625. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_tag_budgets::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
