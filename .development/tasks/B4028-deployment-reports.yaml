dod:
  - text: Metrics are incremented per deployment on each request via async_update_daily_reports, which handles both failed request count and latency per output token.
    proof: [deployment-metrics-tests]
  - text: send_daily_reports fetches all deployment metrics from cache in one batch call and formats a message listing the top five deployments by failed requests and top five by latency.
    proof: [daily-report-tests]
  - text: The formatted message includes deployment names, metric values, and API bases, with separate sections for failed requests and latency metrics.
    proof: [daily-report-tests]
  - text: Cache metrics are reset to zero after sending the report.
    proof: [daily-report-tests]
  - text: The scheduler stamps a report window on first run and checks interval timing on subsequent runs, acquiring a pod-level lock before sending.
    proof: [deployment-metrics-tests]
  - text: The polling interval is jittered ±3 seconds around alerting_args.report_check_interval to prevent collision across instances.
    proof: [deployment-metrics-tests]
  - text: Successful request logging invokes async_update_daily_reports with latency per output token computed from completion_tokens when available.
    proof: [deployment-metrics-tests]
  - text: Pod lock acquire uses the same SLACK_DAILY_REPORT_LOCK_ID and TTL as the report frequency, with reentrant=false.
    proof: [deployment-metrics-tests]
checks:
  optional: [mutants]
  commands:
    - id: deployment-metrics-tests
      why: deployment metrics update and top-five selection behavior does not match LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^deployment_metrics::/) or test(/^daily_report_scheduler::/) or test(/^deployment_success_logging::/)'
    - id: daily-report-tests
      why: daily report formatting and cache reset behavior does not match LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_report::/)'
oracle_cases: []
deviations:
  - what: Metric timestamps use an injected clock provider instead of litellm.utils.get_utc_datetime.
    why: Dependency injection allows testing and avoids module-level global state.
out_of_scope:
  - Cache async_batch_get_cache operation (B4294 owns that).
  - Cache async_increment_cache and async_set_cache_pipeline operations (B4293 owns those).
  - The get_api_base formatting utility (B004 owns that).
  - Pod-lock implementation (B1690 owns that).
  - The Router interface (B844/B845 own the model/deployment lookups).
  - The send_alert entry point (B4024 owns that).
pitfalls:
  - "Cache keys match SlackAlertingCacheKeys enum: `{deployment_id}:failed_requests_daily_metrics` and `{deployment_id}:latency_daily_metrics`, not the `daily_metrics:` infix format."
  - Top-five filtering must preserve order after sorting and filter out zero/None values; an off-by-one error will include the sixth item or drop the fifth.
  - The first-timestamp initialization happens only when report_sent is None; after that, the same cache key is updated at every interval check.
  - The jittered interval uses a random integer ±3 around report_check_interval; floating-point jitter or a different range will miss the source behavior.
  - Latency per output token is computed only when completion_tokens is present and positive; otherwise total elapsed time in seconds is used.
  - Cache reset values must be set to zero (not deleted or None) to preserve the next interval's all-zero check.
  - A missing or non-dict deployment when looking up a top-5 failed-request key causes send_daily_reports to return False immediately, aborting the whole send and skipping the cache reset at the async_set_cache_pipeline call, whereas the same condition in the slowest-deployments loop just degrades to an empty deployment name and continues, silently retaining that stale metric forever.
