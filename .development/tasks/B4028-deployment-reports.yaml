id: B4028
title: Daily deployment metrics and report scheduling
description: >-
  Build accumulated failure and latency metrics per deployment, format top-five reports and schedule daily sending with pod-lock coordination.
  Metrics track failed request count and latency per output token by deployment ID, stored in cache with keys like `{deployment_id}:failed_requests_daily_metrics` and `{deployment_id}:latency_daily_metrics` (from SlackAlertingCacheKeys enum).
  `async_update_daily_reports` increments these counters on each request success or failure; `send_daily_reports` reads the full metric set, identifies the top five deployments by each metric, formats a Slack message with deployment names and API bases, resets all metrics to zero, and sends the alert.
  The daily scheduler polls every `alerting_args.report_check_interval` seconds (default 300 with jitter ±3), stamps the report window timestamp on first run, and on subsequent runs acquires a pod-level lock before sending to prevent duplicate reports across instances.
  Use an injected clock instead of `get_utc_datetime` for success event timestamps, and preserve the source's first-timestamp initialization and jittered polling behavior.
