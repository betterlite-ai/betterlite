id: B1076
title: Attached-file list, retrieve and content routes
description: >-
  Register GET /v1/vector_stores/{vector_store_id}/files and /vector_stores/{vector_store_id}/files,
  GET both prefixes with /{file_id}, and GET both prefixes with /{file_id}/content in
  server::api::vector_file_routes. Own the three complete handlers at endpoints.py:562-872 and the two
  complete download-header helpers at upload_security.py:278-289, which previously had no concrete task.
  Use B003 auth, B1061 store access, B1075 resolution, B004 processing with model=null and route types
  avector_store_file_list/retrieve/content, then B1072/B1073 SDK methods. Pass common processor settings
  unchanged; no new setting or body decoder is added. All comparisons enter actual booted proxy HTTP.

  Access the original store id before managed file resolution; overlay the returned managed store with
  should_lookup_registry=false, then resolve provider and index permission. List alone copies every query
  field and calls model-hint fallback; retrieve/content start with path ids and ignore unrelated query/body.
  Content adds safe attachment headers after processing and id restoration. The routes and two header helpers own 288 physical
  nonblank/non-comment lines allow 230 implementation, 190 route tests, 175 HTTP fixtures and 45 wiring,
  640 total. Header sanitization transforms an existing string and requires no byte-parser fuzz target.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/vector_file_routes.rs
  - crates/betterlite-server/src/api/vector_file_routes/**
  - tools/oracle/cases/api/vector-file-routes/**
  - tools/oracle/helpers/b1076.py
  - tools/oracle/helpers/b1076/**
  - tools/oracle/src/helpers/server/b1076.rs
  - tools/oracle/src/helpers/server/b1076/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_files_endpoints/endpoints.py#L562-L872
  why: All six GET registrations expose list query forwarding, path-id authorization and restored content response ids.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/upload_security.py#L278-L289
  why: Download headers strip quotes, backslashes and CR/LF and supply the literal fallback filename download.
dod:
- text: >-
    file_list_query_and_routing uses both list aliases with ?vector_store_id=wrong&after=&before=file_z&limit=7&order=asc&filter=completed.
    Path vs_a wins the query id; after="",before=file_z,limit="7",order=asc,filter=completed enter the SDK
    unchanged as strings. No query gives no pagination defaults in this handler. Repeated limit keeps the
    final value; limit=bad is forwarded, not FastAPI 422. Model query wins x-litellm-model and B1075 selects
    authorized credentials; query api_key="" bypasses that fallback. Mock 200 list data and pagination return
    unchanged. Registry overlay may replace query fields after the path id was restored.
  proof: [route-tests, oracle, new-cases]
- text: >-
    retrieve_and_content_restore_managed_id calls both read aliases with a legacy/unified id resolving
    to file_a; provider gets file_a and response id/file_id becomes the original managed id through B1075.
    Store access occurs before file validation; file routing precedes store registry overlay. Each helper
    sees the original path store id for permission checks, with no second registry fetch. Raw file_a stays
    unchanged. GET body {file_id:wrong} and unrelated query fields cannot override ids. Mock retrieve returns
    200 {id:file_a,object:vector_store.file,vector_store_id:vs_a}; content returns 200 {data:[{type:text,text:hello}]}.
  proof: [route-tests, oracle]
- text: >-
    content_attachment_headers verifies only content replies add Content-Disposition='attachment; filename="file_a"'
    and X-Content-Type-Options=nosniff using the original file id, not the decoded provider id. Native header
    tests send filename containing double quote,backslash,CR,LF and surrounding whitespace; those four characters
    are removed then trimmed. Empty/only-removed input becomes attachment; filename="download". Ordinary
    internal spaces survive. application/json and B004's x-litellm-* headers remain present; content is JSON,
    not a raw byte download. List/retrieve have no attachment header.
  proof: [route-tests, oracle]
- text: >-
    file_read_auth_and_permission_errors tests all six paths: missing/invalid bearer yields 401,
    authentication_error,param=null,code="401" and no provider request. Denied store or allowed-index policy
    fails with B1061's original 403 detail before B004. Invalid provider enum skips index checks but is not
    turned into a validated provider; B1075 leaves the data field as supplied. Provider 404 after processing
    maps to 404,not_found_error,param=null,code="404"; retryable 429 maps to rate_limit_error,code="429",
    Retry-After preserved. Compare every header and status through the proxy.
  proof: [route-tests, oracle]
- text: >-
    attached_read_managed_requirement sets require_managed_files=true. Retrieve/content raw id gives 400
    detail="Raw provider file ids cannot be used when require_managed_files is enabled in litellm_settings. Use the LiteLLM managed file id returned when the file was created."
    and a unified id without the enterprise ownership hook gives 500 detail="Managed resource ownership validation is unavailable.".
    List has no file-id validation and still reaches the SDK. Default false retains MIT decoding behavior.
    These preprocessor detail responses contain no error type/param/code and do not contact the provider.
  proof: [route-tests, oracle]
checks:
  optional: []
  commands:
  - id: route-tests
    why: an attached-file read path bypasses permissions or changes query/header behavior
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_file_routes::tests::/) - test(/::replays_corpus$/)'
  - id: new-cases
    why: no new HTTP scenarios cover attached-file reads and aliases
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/vector-file-routes)"
oracle_cases:
- tools/oracle/cases/api/vector-file-routes/file-list-query-and-routing.yaml
- tools/oracle/cases/api/vector-file-routes/retrieve-and-content-restore-managed-id.yaml
- tools/oracle/cases/api/vector-file-routes/content-attachment-headers.yaml
- tools/oracle/cases/api/vector-file-routes/file-read-auth-and-permission-errors.yaml
- tools/oracle/cases/api/vector-file-routes/attached-read-managed-requirement.yaml
deviations:
- what: Until Max decides managed files/batches, raw ids remain usable by default; enabling require_managed_files produces the MIT 400/500 errors specified above.
  why: The enterprise ownership hook is absent and is not recreated by this route task.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_files_endpoints/endpoints.py#L710-L718
out_of_scope:
- B1075 owns all seven resolution helpers; B1081 owns create/update/delete handlers in endpoints.py.
- B097 retains upload_security.py types, scanner classes and _starts_with_any,_is_archive,_is_utf8_text,_is_executable_binary,_looks_like_shebang,inspect_content,generate_safe_filename,_reject_disallowed,_scan_rejection,validate_upload; only its two download-header functions move here.
- B1021 owns managed-id flag loading behind B1075 and B004 owns processor/error/header policy.
pitfalls:
- List imports arbitrary query strings before credential fallback, including an empty api_key.
- Content names its attachment after the original managed id and does not rewrite content.data recursively.
- Store access errors happen before the processor try and keep detail envelopes.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
