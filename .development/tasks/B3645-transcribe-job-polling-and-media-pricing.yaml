dod:
  - text: aws_error_type returns the part of `__type` after the last `#`, the whole text when there is no `#`, and None for a body that is not a JSON object or has no string `__type`.
    proof: [error-type-tests, helper-oracle, helper-python]
  - text: A poll step returns a job only when its status is exactly COMPLETED or FAILED, and treats RUNNING, QUEUED, a missing status and an empty response as not finished.
    proof: [poll-status-tests]
  - text: A lookup rejected with BadRequestException or NotFoundException gives Missing and stops polling, while other AWS error types, a rejection with no type, unavailable and invalid-response errors are retried on the next tick.
    proof: [missing-job-tests]
  - text: await_transcription_job stops after max_attempts (default 720), sleeps 10 seconds after every unfinished attempt including the last, returns None when nothing finished, and returns at once on a finished or missing job without sleeping.
    proof: [await-tests]
  - text: measure_media_seconds tries at most 3 times, sleeps 10 seconds between tries only, retries only on a probe error, and returns an Ok(None) from the probe at once without a retry.
    proof: [measure-tests]
  - text: price_transcription_job charges the max for a job that never finished, zero for a FAILED job, the started job's media when the job is Missing, the max when media or creation time is missing or the length is unmeasurable, and the rounded-up seconds times the rate otherwise.
    proof: [price-tests]
  - text: s3_media_url builds the virtual-host URL for a dotless bucket, the path-style URL for a dotted bucket, percent-encodes the key like Python's quote, passes through only https URLs on the partition's own dns suffix, and returns None for anything else.
    proof: [media-url-tests, helper-oracle, helper-python]
  - text: A URI that does not parse as a URL is an error from s3_media_url, not None.
    proof: [media-url-tests]
  - text: media_predates_job is true only when Last-Modified is no later than the job creation time plus one second, and false for a missing or unparsable header.
    proof: [last-modified-tests, helper-oracle, helper-python]
  - text: The size cap stops a download whose content-length is above 2 GiB or whose streamed bytes pass it, treats a missing content-length as 0, and reports a non-integer content-length as an error.
    proof: [size-limit-tests]
  - text: media_duration_seconds returns the exact length of WAV, FLAC, Ogg Vorbis and MP3 files by sniffing the bytes, and None with no panic for truncated, unknown or zero-rate input.
    proof: [media-duration-tests]
  - text: The fuzz target and its seed corpus (a valid and a truncated file per format) exist and every corpus file replays without a panic.
    proof: [decoder-corpus]
  - text: JobLookupError has a Rejected variant carrying the status and the AWS error type, and B3644's ownership checks still answer 404 for it.
    proof: [lookup-error-tests]
  - text: The real job lookup sends the signed POST with the exact URL, Content-Type and X-Amz-Target and body, and maps a non-2xx answer to Rejected with the error type, a malformed 2xx body to InvalidResponse, and a transport failure to Unavailable.
    proof: [live-lookup-tests]
  - text: The S3 media probe errors on a non-2xx answer, gives Ok(None) for a rewritten or oversized object or an unusable URL, measures a decodable object, and holds a download slot while it reads.
    proof: [live-probe-tests]
  - text: price_transcription_job_live returns the max cost when pricing fails and only reports an error when the max cost itself overflows.
    proof: [live-fail-closed-tests]
  - text: MAX_MEDIA_DURATION_SECONDS in policy/cost.rs is 28800 (LiteLLM constants.py L1653, TRANSCRIBE_MAX_MEDIA_DURATION_SECONDS), so transcribe_max_job_cost is 28800 seconds at the given rate. The existing policy test that expects 7.2 for a 0.002 rate expects 57.6, and a new test max_job_cost_is_eight_hours covers the cap.
    proof: [max-job-cost-tests]
  - text: The new decoder crates pass the dependency policy.
    proof: [dependency-policy]
  - text: Helper oracle cases for aws_error_type, s3_media_url and media_predates_job agree with LiteLLM.
    proof: [helper-oracle, helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: error-type-tests
      why: the AWS error type is not read from the "__type" member, or a bad body does not give None
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^polling::tests::error_type_/)'
    - id: poll-status-tests
      why: a poll step accepts a status other than COMPLETED or FAILED, or rejects one of them
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^polling::tests::poll_status_/)'
    - id: missing-job-tests
      why: a deleted job is not told apart from a failed poll, or the wrong error types end polling
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^polling::tests::missing_job_/)'
    - id: await-tests
      why: the attempt limit, the 10 second sleep after each unfinished attempt or the early return is wrong
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^polling::tests::await_/)'
    - id: measure-tests
      why: media measurement retries the wrong cases, sleeps after the last try, or retries an unmeasurable result
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^media_pricing::tests::measure_/)'
    - id: price-tests
      why: a pricing outcome (never finished, FAILED, Missing, no media, unmeasurable, measured) charges the wrong amount
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^media_pricing::tests::price_/)'
    - id: media-url-tests
      why: the S3 media URL form, key encoding, https host rule or bad-URL error is wrong
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^media_source::tests::media_url_/)'
    - id: last-modified-tests
      why: the rewrite check accepts a newer object or reads the header wrongly
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^media_source::tests::last_modified_/)'
    - id: size-limit-tests
      why: the 2 GiB cap, the missing content-length case or the non-integer content-length error is wrong
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^media_source::tests::size_limit_/)'
    - id: media-duration-tests
      why: a media format is measured wrongly, or bad input panics or gives a value
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^media_source::tests::media_duration_/) - test(replays_the_media_duration_corpus)'
    - id: decoder-corpus
      why: the media duration fuzz target or its replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-transcribe/fuzz/fuzz_targets/media_duration.rs &&
        grep -q 'name = "media_duration"' crates/betterlite-transcribe/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-transcribe/fuzz/corpus/media_duration)" &&
        cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(replays_the_media_duration_corpus)'
    - id: lookup-error-tests
      why: the Rejected variant is missing, or B3644's ownership checks changed behavior
      run: >-
        cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^records::tests::rejected_lookup_/)' &&
        cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^policy::tests::/)'
    - id: live-lookup-tests
      why: the signed GetTranscriptionJob request or its error mapping is wrong
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^live::tests::lookup_/)'
    - id: live-probe-tests
      why: the S3 media probe fetches, checks or measures the object wrongly
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^live::tests::probe_/)'
    - id: live-fail-closed-tests
      why: a pricing failure is charged as free or reported instead of charged the max
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^live::tests::fail_closed_/)'
    - id: max-job-cost-tests
      why: the longest-media charge still uses 3600 seconds instead of LiteLLM's 28800
      run: cargo nextest run --locked -p betterlite-transcribe --no-tests=fail -E 'test(/^policy::tests::(max_job_cost_|rounds_seconds_for_transcription_job_cost)/)'
    - id: dependency-policy
      why: a decoder crate is missing, has a license deny.toml refuses, or adds a duplicate crate version
      run: grep -q '^hound' crates/betterlite-transcribe/Cargo.toml && cargo deny --locked check
    - id: helper-oracle
      why: the helper cases for the pure functions are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/transcribe-media)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/transcribe-media
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3645)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3645 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3645/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added transcribe media cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/transcribe_media-*")" &&
        grep -lE '^[[:space:]]+b3645:' tools/oracle/fuzz/corpus/helper_case/transcribe_media-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

