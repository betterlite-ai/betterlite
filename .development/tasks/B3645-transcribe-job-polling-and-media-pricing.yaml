deviations:
  - what: Media length is read from the file headers (WAV, FLAC) or the last Ogg page and MP3 frames, with Rust crates, instead of libsndfile. Ogg Opus files (libsndfile 1.2 reads them) give None and are charged the maximum.
    why: libsndfile has no maintained pure-Rust equivalent that passes deny.toml (symphonia is MPL-2.0), and the four crates cover the formats B3644 admits; an Opus file is billed high rather than free.
  - what: The longest-media charge uses B3644's transcribe_max_job_cost, and the media length is exact Decimal arithmetic (frames over sample rate, rounded up) instead of a float.
    why: Money is Decimal in betterlite, and an exact quotient never rounds a whole number of seconds up by float error.
  - what: The Last-Modified header is parsed with chrono's RFC 2822 parser, so a "-0000" zone is read as UTC.
    why: Python's parsedate_to_datetime returns a naive datetime there and `.timestamp()` then uses the machine's local zone, so the result depends on where the proxy runs.
  - what: The GetTranscriptionJob body is serialized compactly and the media download has a total deadline of two hours (connect 5 s, read 600 s as in LiteLLM).
    why: docs/compatibility.md leaves json.dumps spacing open, and B173's client requires a total deadline where httpx has none.

out_of_scope:
  - "TranscribePassthroughLoggingHandler (L579-L733 of the handler file): is_priced_job_start, schedule_priced_job_logging, the _price_then_log task, transcribe_passthrough_handler, the pricing task set and the download semaphore belong to B3646. It calls price_transcription_job_live from this task."
  - "JobPricer and PassThroughLogDispatch (L105, L124-L135) are B3646's injection points; this task only exposes price_transcription_job_live with the same inputs."
  - "Everything in L1-L351 (operation list, cost lookup, eligibility, admin gate, bucket policy, owner tag, job access check, transcription_job_cost, transcribe_max_job_cost, started_transcription_job and the record types) is B3644's and is called, not changed. The one exception is the added JobLookupError::Rejected variant."
  - "The Transcribe route in llm_passthrough_endpoints.py (L1636 on) and the success_handler.py wiring (B3606 dispatch, B3607 completion) call transcribe_job_lookup and the handler later; no HTTP oracle case belongs here because no route reaches this code yet."
  - "AWS credential discovery (B594) and SigV4 signing (B595) are used through their public items and not rebuilt."
pitfalls:
  - "await_transcription_job sleeps 10.0 seconds even after the last unfinished attempt, so a job that never finishes costs 720 sleeps; do not skip the final sleep."
  - "A poll that throws any error other than a BadRequestException or NotFoundException answer is retried, but a rejection with no parsable `__type` is also retried, never treated as Missing."
  - "measure_media_seconds retries only when the probe raises; a probe that returns None (rewritten object, over the size cap, https URL on a foreign host, undecodable file) is final and is charged the maximum without a second fetch."
  - "A Missing job is priced from the StartTranscriptionJob response's media and creation time, but a COMPLETED job is priced from the polled record even if that record has no media, and that gives the maximum."
  - "A FAILED job costs zero, and a job that never reaches COMPLETED or FAILED within the polling window costs the maximum."
  - "s3_media_url treats a dot anywhere in the bucket as path style, and an https URL is accepted only when its host ends with `.{dns_suffix}` for the job's region, so the signature never reaches a foreign host; the dns suffix differs outside the standard partition (China regions use amazonaws.com.cn)."
  - "An unparsable content-length header is an error that gets retried three times, but a missing one counts as 0; the cap compares with `>`, so exactly 2 GiB is allowed."
  - "The Last-Modified check runs on the response headers before the body is read, so a rewritten object is never downloaded."
  - "The temp file for the media has no extension, so the decoder must identify the container from its first bytes."
  - "The download slot (a semaphore of one in LiteLLM) is held across the download and the length read, so two pricing tasks never fetch media at once."
  - "price_transcription_job_live catches everything and returns the max cost; the only error it may return is the overflow of that max calculation."
