id: B3645
title: Transcribe job polling and media pricing
description: >-
  Price a started Amazon Transcribe job. Transcribe reports no duration, so betterlite polls GetTranscriptionJob until the job is COMPLETED
  or FAILED, then reads the length of the media file the job was started with and charges the rounded-up seconds at the cost rate. If
  anything stops the length from being read, the job is charged as the longest media AWS accepts. This task builds that pipeline in
  betterlite-transcribe, below B3646. B3646 schedules it after a StartTranscriptionJob response and logs the spend. It reuses B3644's
  records and cost functions: `TranscriptionJobRecord`, `TranscriptionJobResponse`, `StartedJob`, the `JobLookup` trait,
  `transcription_job_cost(audio_seconds: Decimal, cost_per_second: Decimal)` and `transcribe_max_job_cost(cost_per_second)`. Money is
  `rust_decimal::Decimal`, never f64. Read those files in crates/betterlite-transcribe/src before writing code.

  Build four new modules and one small change to records.rs. The skeleton creates the module stubs and the `pub mod` lines in lib.rs.

  Module `polling`. `aws_error_type(body: &[u8]) -> Option<String>` parses the body as a JSON object and returns the `__type` member
  after its last `#` (`com.amazon.coral.service#NotFoundException` gives `NotFoundException`; no `#` gives the whole text). A body that is not
  JSON, not an object, or has no string `__type` gives None. `enum PollOutcome { Finished(TranscriptionJobRecord), Missing }` stands for
  LiteLLM's record-or-MissingJob. `trait PollSleeper` has one async method `sleep(&self, seconds: f64)`; production uses tokio's timer, tests
  record the calls. One private poll step calls `JobLookup::get_transcription_job` and returns Some only when the job exists and its
  `transcription_job_status` is exactly "COMPLETED" or "FAILED". A lookup answered with `JobLookupError::Rejected` whose `aws_error_type`
  is "BadRequestException" or "NotFoundException" means Transcribe no longer knows the job, so the step returns `PollOutcome::Missing` (log a
  warning). Every other failure (other AWS error types, a rejection with no type, `Unavailable`, `InvalidResponse`, a job still running or
  missing from the response) logs a warning and counts as "not finished yet". `await_transcription_job(job_name, lookup, sleeper,
  max_attempts) -> Option<PollOutcome>` runs the step up to `max_attempts` times (default 720, LiteLLM's
  TRANSCRIBE_JOB_MAX_POLLING_ATTEMPTS) and sleeps 10.0 seconds (TRANSCRIBE_JOB_POLLING_INTERVAL_SECONDS) after every step that did not
  finish, the last one included, so a job that never finishes sleeps 720 times before it returns None. Keep these constants in one file
  as `pub const`.

  Module `records.rs` change. `JobLookupError` (B3644) has no way to carry an AWS error type. Add one variant `Rejected { status: u16,
  aws_error_type: Option<String> }` for a non-2xx answer from Transcribe. B3644's ownership check treats every lookup error as "job not found"
  (404), so confirm in policy/ownership.rs that a `Rejected` error takes the same path as `Unavailable`; change nothing there.

  Module `media_source`. Pure helpers over the media bytes and URI.
  `s3_media_url(media_uri, aws_region_name) -> Result<Option<String>, MediaSourceError>`: for an `s3://bucket/key` URI, split bucket and key
  at the first "/"; a bucket containing "." gives the path-style `https://s3.{region}.{dns_suffix}/{bucket}/{key}`, any other bucket gives
  `https://{bucket}.s3.{region}.{dns_suffix}/{key}`; the key is percent-encoded like Python's `urllib.parse.quote` (letters, digits and
  `_ . - ~ /` stay, everything else becomes %XX of its UTF-8 bytes). The dns suffix comes from betterlite-context's `get_aws_partition(region).dns_suffix`
  (B198). Any other URI is returned unchanged only when it parses as a URL with scheme https and a host ending in `.{dns_suffix}`, otherwise
  Ok(None). A string that does not parse as a URL is an `Err`, because LiteLLM's `httpx.URL()` raises there and the caller retries it.
  `media_predates_job(headers, job_created_at: f64) -> bool` reads the `last-modified` header (case-insensitive name), parses it as an RFC 2822
  date (chrono's `parse_from_rfc2822` is enough), and is true when that timestamp in whole seconds is `<= job_created_at + 1.0`
  (TRANSCRIBE_MEDIA_LAST_MODIFIED_TOLERANCE_SECONDS). A missing or unparsable header is false.
  `MediaSizeGuard` (or two plain functions) enforces `TRANSCRIBE_MAX_MEDIA_BYTES` = 2 * 1024^3: a `content-length` header above the cap stops the
  download, a missing header counts as 0, a header that is not an integer is an `Err`, and the running byte count of the streamed chunks above
  the cap stops it too. Both stops are reported as "too large", not as an error.
  `media_duration_seconds(media: impl Read + Seek) -> Option<Decimal>` is the decoder for untrusted bytes. LiteLLM opens the downloaded file
  with soundfile (libsndfile) and returns frames divided by sample rate, or None with a warning when it cannot decode the file. Sniff the
  container from the first bytes, never from a file name (the temp file has none). Use maintained, deny.toml-clean crates that read headers
  rather than decode audio: `hound` for WAV (`WavReader::duration()` and `spec().sample_rate`), `claxon` for FLAC (STREAMINFO `samples`; it
  may be absent and then gives None; plus `sample_rate`), `ogg` plus `lewton` for Ogg Vorbis (sample rate from the identification header, frames
  from the last page's granule position), and `mp3-duration` for MP3. The seconds are `Decimal::from(frames) / Decimal::from(sample_rate)`
  so a whole number of seconds stays exact; a zero sample rate gives None. Do not use symphonia: its MPL-2.0 license is not in deny.toml.
  Every failure path returns None and logs one warning, and the decoder must not panic or allocate from a size the header claims. Only the
  four formats in TRANSCRIBE_MEASURABLE_MEDIA_FORMATS (flac, mp3, ogg, wav) are expected; B3644 already refuses other formats at admission.
  Add a cargo-fuzz target `media_duration` in crates/betterlite-transcribe/fuzz that feeds arbitrary bytes to `media_duration_seconds`, with a
  seed corpus of a valid and a truncated file per format, and a test `replays_the_media_duration_corpus` that runs every corpus file.

  Module `media_pricing`. `trait MediaDurationProbe` has one async method `media_seconds(&self, media_uri: &str, job_created_at: f64) ->
  Result<Option<Decimal>, ProbeError>`. `measure_media_seconds(media_uri, job_created_at, probe, sleeper, attempts)` (default attempts 3,
  TRANSCRIBE_MEDIA_FETCH_ATTEMPTS) calls the probe; `Ok(x)` returns x at once, even when x is None (None means "unmeasurable", not "retry");
  an `Err` logs a warning, sleeps 10.0 seconds only when attempts remain, and tries again; after the last attempt it returns None.
  `price_transcription_job(job_name, cost_per_second, lookup, probe, sleeper, max_attempts, started_job) -> Result<Decimal, PricingError>`
  is the pipeline: poll with `await_transcription_job`; if that gives None (never finished), charge `transcribe_max_job_cost`; if the poll
  found the job FAILED, charge zero; otherwise take the job to measure: the polled record when `Finished`, and the `started_job` from
  the StartTranscriptionJob response when `Missing`. A job with no `media.media_file_uri`, or no `creation_time`, or no job at all, is
  charged the max. Otherwise measure; None gives the max, a value gives `transcription_job_cost(seconds, cost_per_second)`. `PricingError`
  wraps `TranscribeCostError` and has no other cases. Do not add a retry or catch-all around the lookup or probe: their errors are already
  turned into "not finished" and `Err` above.

  Module `live`. The real adapters, built from the injected pieces and tested with fakes. `TranscribeJobLookup::new(region, signer, http)`
  implements `JobLookup`. It POSTs `{"TranscriptionJobName": name}` to `https://transcribe.{region}.{dns_suffix}/` with headers
  `Content-Type: application/x-amz-json-1.1` and `X-Amz-Target: Transcribe.GetTranscriptionJob`, signed with SigV4 for service "transcribe" in
  that region, through B595's `AwsSignedRequest` and B594's `AwsCredentialResolver` (resolve credentials for the region only, the same call
  `BaseAWSLLM().get_credentials(aws_region_name=...)` makes) and B173's pooled client. Read the merged public items of bedrock's credentials.rs
  and signing.rs and call them; do not copy their logic. A non-2xx answer becomes `JobLookupError::Rejected { status, aws_error_type }` with
  the type from `aws_error_type` on the body; a 2xx body that is not a `TranscriptionJobResponse` becomes `InvalidResponse`; a transport failure
  becomes `Unavailable`. `S3MediaProbe::new(region, signer, http, download_slots: Arc<tokio::sync::Semaphore>)` implements `MediaDurationProbe`:
  build the URL with `s3_media_url` (None gives `Ok(None)`), sign a GET for service "s3" with the region's credentials, take one permit from
  `download_slots`, stream the response into a temp file, and call `error_for_status`-style handling so any non-2xx is an `Err`. Before reading the
  body check `media_predates_job` on the response headers; false logs a warning and gives `Ok(None)`. Then apply the size cap while streaming
  (over the cap logs a warning and gives `Ok(None)`), then run `media_duration_seconds` on the file inside `tokio::task::spawn_blocking`. Release
  the permit after the file is measured. `price_transcription_job_live(job_name, region, cost_per_second, started_job, download_slots,
  deps) -> Result<Decimal, PricingError>` builds both adapters and calls `price_transcription_job` with the default attempts; if that returns
  `Err`, it logs an error and returns `transcribe_max_job_cost` (the job is charged high rather than free), and only a failure of that
  max-cost calculation is returned. B3646 owns the permit count (TRANSCRIBE_MEDIA_DOWNLOAD_CONCURRENCY, 1) and passes the semaphore in.
  The HTTP calls use B173's client with connect timeout 5 s and read timeout 600 s (LiteLLM's pooled client defaults).

  The new modules have no HTTP route of their own, so the oracle cases are helper cases for the pure functions `s3_media_url`,
  `media_predates_job` and `aws_error_type`; the Transcribe route and B3646's handler call this code later. Native tests cover the rest.
  Test module names are `polling::tests`, `media_source::tests`, `media_pricing::tests` and `live::tests`; test function names start with the
  prefixes in the checks. Fakes for `JobLookup`, `PollSleeper`, `MediaDurationProbe` and the HTTP layer live in each module's tests.rs.

