  why: Part, content, schema, tool and generation config types.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/vertex_ai.py#L366-L713
  why: Response, tuning, embedding and batch shapes.
