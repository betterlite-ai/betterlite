dod:
- text: Every name exists with the same keys, required keys, Literal values and Enum members as LiteLLM.
  proof: [names]
- text: '`VertexAccessTokenResolver` accepts a callable with the same parameters, and `VertexGemmaContainerError` carries the same message and attributes.'
  proof: [protocol]
- text: Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: names
    why: A part, config or response key is missing.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_vertex_ai.py -k names
  - id: protocol
    why: The token resolver or the error class differs.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_vertex_ai.py -k protocol
  - id: python-lint
    why: Strict typing has to hold for every ported module.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations: []
out_of_scope:
- >-
  Gemini Live, image generation and files shapes live in llms/gemini.py and belong to B7927.
pitfalls:
- >-
  `PartType` and `HttpxPartType` look alike but have different keys (the Httpx one holds function call, executable code, code
  execution result and server side tool shapes); a test builds one of each.
- >-
  `FunctionResponse.parts` is typed with `FunctionResponsePartType` (L44); a fix that reuses `PartType` there changes the keys a caller may send.
- >-
  `TaskTypeEnum` (L575) is an Enum used in the embedding request body; compare its members and values.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
