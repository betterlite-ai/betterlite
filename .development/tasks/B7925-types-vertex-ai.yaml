id: B7925
title: Python types for Vertex AI and Gemini request, response, tuning, embedding and batch shapes (types/llms/vertex_ai)
description: >-
  Users read and write Vertex dicts such as `GenerationConfig`, `Tools`, `UsageMetadata` and `GenerateContentResponseBody`
  through `litellm.types.llms.vertex_ai`. This task ports that whole file (787 lines) and `vertex_ai_gemma.py` into the package
  `crates/betterlite-python/python/betterlite/types/llms/vertex_ai/` and the module `crates/betterlite-python/python/betterlite/types/llms/vertex_ai_gemma.py`. It is Python only.


  Contents in order: the part types (`FunctionResponse`, `FunctionCall`, `BlobType`, `PartType`, and the Httpx twins
  `HttpxPartType`, `HttpxContentType`), `ContentType`, `Schema`, `FunctionDeclaration`, `Retrieval`, the generation and thinking
  configs (`GenerationConfig`, `GeminiThinkingConfig`, `GeminiImageConfig`, `SpeechConfig`), `VertexToolName`, `Tools`, `ToolConfig`,
  cached content shapes (`TTL`, `CachedContent`, `CachedContentRequestBody`), `UsageMetadata`, citation, grounding, logprobs and
  URL metadata TypedDicts, `Candidates`, `GenerateContentResponseBody`, fine-tune job shapes, multimodal embedding
  (`Instance`, `VertexMultimodalEmbeddingRequest`, `MultimodalPredictions`), `TaskTypeEnum`, text and batch embedding bodies,
  the GCS batch prediction shapes (`GcsSource` to `VertexBatchPredictionResponse`), the video generation shapes
  (`VertexVideoImage` to `VertexVideoGenerationResponse`), `VertexAccessTokenResolver` (a callable Protocol with `__call__`,
  L763) and `VertexPartnerProvider` (L774). `GeminiEmbeddingInput` (L14) is `EmbeddingInput | list[list[str]]` and comes from B7920's
  `EmbeddingInput`. `VertexGemmaContainerError` is a small exception class.


  The Protocol keeps its signature exactly, since a user passes a callable matching it. Several short names between
  classes (L169-L187, L209-L213, L428, L649-L694, L781) are aliases or Literals; keep each.
scope:
