id: B858
title: Typed managed-resource and analytics rows
description: >-
  Add the six owned files' managed-resource, MCP, skill, autorouter-session, spend/error-log and tag
  records with their actual Pydantic field/default distinctions. These are row decoders, not route
  implementations. B1015, B1035 and B1138 supply embedded file, batch and Responses objects; B014
  supplies the fine-tuning object. Do not create a second version of their wire schemas.

  ManagedFile requires unified_file_id, model_mappings and flat_model_file_ids; file_object, created_by,
  team_id, updated_by, storage_backend and storage_url default None. ManagedObject requires
  unified_object_id, model_object_id, file_purpose and file_object; purpose accepts batch, fine-tune,
  response or container, while file_object retains the batch/fine-tuning/Responses union. created_by,
  team_id and org_id default None. Singular ManagedVectorStore requires unified_resource_id,
  model_mappings and flat_model_resource_ids; resource_object and the same actor/team/storage fields
  default None. Plural ManagedVectorStores instead requires vector_store_id and custom_llm_provider,
  defaults is_config=false, and defaults vector_store_name, vector_store_description,
  vector_store_metadata, created_at, updated_at, litellm_credential_name, litellm_params, team_id and
  user_id to None. Retain both distinct table shapes. URL fields are stored strings and never downloaded.

  MCPEnvVar requires name, defaults value="", scope=global and description=None, and accepts only
  global/user scope. MCPServer requires server_id and transport. B2305 supplies transport/auth types,
  credentials, MCPInfo and parse_pinned_tools; call it from decode_stored_pinned_tools. Defaults are
  false for is_config, allow_all_keys, delegate_auth_to_upstream, oauth_passthrough,
  per_server_oauth_discovery and is_byok; available_on_public_internet defaults true. teams,
  mcp_access_groups, allowed_tools, extra_headers, args and byok_description each get an independent
  empty list; env gets an empty map. status defaults unknown and accepts healthy, reachable, unhealthy,
  unknown or null. approval_status defaults active but accepts any string or null: its descriptive
  list is not a validation enum.

  The remaining MCP fields default None: server_name, alias, description, url, spec_path, auth_type,
  credentials, instructions, created_at, created_by, updated_at, updated_by, tool_name_to_display_name,
  tool_name_to_description, pinned_tools, mcp_info, static_headers, env_vars, last_health_check,
  health_check_error, command, issuer, authorization_url, token_url, registration_url, oauth2_flow,
  token_exchange_endpoint, audience, subject_token_type, token_exchange_profile, dcr_bridge,
  byok_api_key_help_url, has_user_credential, connected_app_reachable, source_url, timeout,
  max_concurrent_requests, submitted_by, submitted_at, reviewed_at and review_notes. oauth2_flow accepts
  client_credentials or authorization_code when set. Do not fill subject_token_type's egress default
  here. static_headers and env call B2303.decode_secret_map, passing the real field name; explicit
  null env becomes {}, while null static_headers remains None. Plaintext maps, JSON maps, quoted/raw
  encrypted maps and wrong-key/malformed maps exercise that real decoder and its redacted error.

  Skills requires skill_id. source defaults custom; display_title, description, instructions,
  latest_version, file_content, file_name, file_type, metadata, created_at, created_by, updated_at and
  updated_by default None. Preserve binary file_content. AutoRouterSession requires api_key, session_id,
  router_name, router_type, first_turn_at, last_turn_at, last_model, turns, spend, saved_spend,
  classifier_cost, tier_turns and baseline_models. Defaults are savings_estimated_turns=0,
  savings_estimated_actual_spend=0.0, savings_estimated_saved_spend=0.0 and an independent empty
  savings_estimated_baseline_models map. baseline_model returns None for no baselines or for multiple
  baselines when savings_estimated_turns < turns; otherwise choose max(count, model_name), so ties
  select the lexicographically greatest name. A single baseline survives excluded turns.

  SpendLogs requires request_id, api_key, call_type and the nullable-but-required startTime, endTime,
  messages and response fields. model, api_base and user default ""; spend defaults 0.0; total_tokens,
  prompt_tokens and completion_tokens default 0; metadata defaults {}; cache_hit defaults string
  "False". cache_key, request_tags, requester_ip_address, created_at and updated_at default None.
  Supplied metadata/request_tags use Pydantic Json decoding, unlike the unvalidated default metadata
  object. Preserve messages/response as string, list, object or null and time fields as string,
  datetime or null. ErrorLogs requires nullable startTime/endTime; api_base, model_group,
  litellm_model_name, model_id, exception_type, status_code and exception_string default "", and
  request_kwargs defaults {}. Its request_id default is one UUID evaluated at Python module import,
  reused for omitted IDs on subsequent instances; inject one startup default into the native decoder
  instead of generating a new UUID per row. Explicit null is distinct from omission.

  TagTable requires tag_name, defaults models=[], spend=0.0 and description, model_info, budget_id,
  litellm_budget_table, created_at, created_by and updated_at to None. Its before-validator normalizes
  missing OR null models/spend to []/0.0; it does not modify model_info despite its name set_model_info.
  Reuse B2310's nested BudgetTable. Every default above is a named rstest row in the corresponding
  default matrix, with missing required fields and explicit-null acceptance/rejection checked separately.


  The byte boundary is decode_managed_resource_rows(&[u8]) for stored JSON/string columns read from Postgres
  and Redis; its fuzz target calls this production decoder. Count field declarations as well as validators
  when implementing the complete row contracts.


  Build the production managed_resource_rows module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/models/autorouter_session.py:
  row_contracts (L1-L45; 38 source lines). litellm/models/managed_files.py: row_contracts (L1-L64; 52
  source lines). litellm/models/mcp_server.py: row_contracts (L1-L135; 112 source lines). litellm/models/skills.py:
  row_contracts (L1-L30; 24 source lines). litellm/models/spend_logs.py: row_contracts (L1-L51; 43 source
  lines). litellm/models/tag.py: row_contracts (L1-L35; 28 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the managed_resource_rows operation under B856 Management::database. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a managed-resource-rows-* seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows hydrates independently seeded
  rows and compares column/default/null/binary facts. This task performs no writes requiring rollback
  cases; repositories own mutation failures. Use a unique schema per test and clean it on every exit.


  This task owns the outside-byte boundary managed_resource_rows::decode_managed_resource_rows(&[u8])
  -> Result<TypedValue,DecodeError> for stored managed-resource JSON columns. Production calls this decoder
  before its typed policy functions; the cargo-fuzz target managed_resource_rows calls that same function.
  Seed valid, truncated, malformed, duplicate-field and limit-boundary inputs and add managed_resource_rows::tests::replays_the_managed_resource_rows_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B2307 owns crates/betterlite-db/fuzz; depend on it and register this decoder target without
  recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 297 nonblank, noncomment pinned source lines including declarations; allow 297 production,
  310 behavior/Postgres tests, 65 helper adapters, 30 wiring and 45 decoder/fuzz lines, 747 total
  within an 800-line gate. MCP dependency validators are split into B2305. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: managed_row_input_limits.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
scope:
  paths:
    - crates/betterlite-db/src/managed_resource_rows.rs
    - crates/betterlite-db/src/managed_resource_rows/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/src/managed_resource_rows/fixtures/**
    - tools/oracle/src/helpers/db/managed_resource_rows.rs
    - tools/oracle/src/helpers/db/managed_resource_rows/**
    - tools/oracle/helpers/managed_resource_rows.py
    - tools/oracle/helpers/managed_resource_rows/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/managed-resource-rows/**
    - tools/oracle/fuzz/corpus/helper_case/managed-resource-rows-*
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/managed_resource_rows.rs
    - crates/betterlite-db/fuzz/corpus/managed_resource_rows/**
  lint_tables: false
