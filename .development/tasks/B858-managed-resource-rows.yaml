dod:
  - text: 'Default/required/null matrices are managed_file_fields, managed_object_fields,
      singular_vector_store_fields, plural_vector_store_fields, mcp_env_var_fields,
      mcp_server_fields, skill_fields, autorouter_fields, spend_log_fields, error_log_fields and tag_fields;
      each case is named for the field. Additional cases cover managed_purpose_literals,
      embedded_object_union, independent_collection_defaults, status_enum_and_null,
      approval_status_free_string, oauth_flow_literals, mcp_pinned_tools, mcp_secret_map,
      null_env_vs_headers, bad_secret_map_redacted and binary_skill_content.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: 'postgres_pinned_rows verifies each row family against independent Postgres fixtures;
      autorouter_baseline_model covers empty, single, excluded_turns_multiple, all_estimated_multiple
      and lexical_tie; spend_json_default_vs_supplied, required_nullable_fields,
      shared_error_request_id_default, explicit_error_request_id and tag_null_normalization cover
      observable validator behavior.'
    proof:
      - postgres-tests
  - text: The production decode_managed_resource_rows decoder is used by the service and its fuzz target
      and rejects malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: managed_row_input_limits proves byte/depth failures without leaking decrypted MCP credentials.
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^managed_resource_rows::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/managed_resource_rows.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/managed-resource-rows-*")"
        && grep -rlq "managed_resource_rows" tools/oracle/fuzz/corpus/helper_case/managed-resource-rows-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/managed_resource_rows::tests::postgres_pinned_rows$/)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/managed_resource_rows.rs && grep -q "managed_resource_rows"
        crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-db/fuzz/corpus/managed_resource_rows)" && cargo nextest run --locked -p betterlite-db
        --no-tests=fail -E 'test(replays_the_managed_resource_rows_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/managed-resource-rows/mcp-pinned-tools.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/mcp-secret-map.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/managed-file-content.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/autorouter-baseline-model.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/spend-decimal.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/tag-model-info.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/field-default-and-null-matrices.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/mcp-status-and-env-defaults.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/spend-json-required-fields.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/error-request-id-default.yaml
  - tools/oracle/cases/helpers/managed-resource-rows/managed-object-union.yaml
deviations:
  - what: New otherwise unbounded byte decoders reject over 1048576 bytes or JSON depth 64, respecting
      smaller inherited limits.
    why: Bound the specific outside-byte decoder named in this task; typed helpers inherit no artificial
      parser behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/autorouter_session.py#L1-L45
out_of_scope:
  - B2303 owns secret-map encryption/decoding and key settings; B2305 owns pinned tools and MCP primitive types.
  - B087 and its parts own managed-file HTTP behavior and the unresolved native managed-hook decision;
    row support here neither installs the enterprise-only hook nor changes a missing-hook response.
  - B136 owns MCP execution and discovery; URL and credential fields here are data, never network requests.
pitfalls:
  - 'The oracle helper for this task is pre-registered as managed_resource_rows in the db group. Replace the stub Op in tools/oracle/src/helpers/db/managed_resource_rows.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/managed_resource_rows.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - ErrorLogs evaluates its omitted request_id once at import, not once per object.
  - Null env becomes an empty map while null static_headers remains absent.
  - The two ManagedVectorStore table names identify different schemas, not aliases.
  - TagTable.set_model_info normalizes models and spend but leaves model_info alone.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
