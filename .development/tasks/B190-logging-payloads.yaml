id: B190
title: Typed request logging payloads
description: >-
  Add typed logging events and payload assembly under betterlite-logging/payload, using B188 privacy snapshots and
  B011 error metadata. Cover call identity, model/deployment, request/response timing, usage, served/requested service
  tier, errors and standard model-parameter projection; preserve Decimal for optional cost/rate fields but do not
  fabricate spend data before B068-B069. Implement classifier audit snapshots and served-output text overlays, aggregating
  streams incrementally with bounded text/tool buffers instead of retaining every chunk. Add helper logging_payload
  cases that call the pinned payload helpers with synthetic logging objects and injected timestamps, and compare
  the supported fields without broadly ignoring metadata. Fields owned by unimplemented auth/spend/guardrail systems
  remain explicitly absent and get typed extension slots, not invented zeros. Budget 350 payload/aggregation lines,
  80 adapters and 300 tests. Seed B171's shared helper_case corpus with every added operation and replay it through
  the common typed parser.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/lib.rs
  - crates/betterlite-logging/src/error.rs
  - crates/betterlite-logging/src/payload.rs
  - crates/betterlite-logging/src/payload/**
  - crates/betterlite-logging/src/stream.rs
  - crates/betterlite-logging/src/stream/**
  - crates/betterlite-logging/src/classifier.rs
  - crates/betterlite-logging/src/classifier/**
  - crates/betterlite-openai/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/logging-payload/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L5640-L5770
  why: Standard payload setup and identifiers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L6347-L6779
  why: Status, errors, response metadata and standard event construction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/logging_utils.py#L53-L167
  why: Bounded base64 truncation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/logging_utils.py#L230-L319
  why: Stream reconstruction and timing.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/classifier_logging.py#L16-L67
  why: Classifier audit fields.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/served_output_texts.py#L95-L171
  why: Capture the text actually served to the client.
dod:
- text: Listed success/failure/stream/classifier payload cases match the pinned helper for supported fields and
    preserve absence explicitly.
  proof:
  - oracle
- text: A stream with many chunks uses bounded aggregation, preserves usage once and cannot emit a success event
    after an error or cancellation.
  proof:
  - logging-payload-tests
- text: Per-callback payloads are isolated and prompt/base64/secrets obey the selected privacy policy.
  proof:
  - logging-payload-tests
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: logging-payload-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/logging_payload/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/logging-payload/chat-success.yaml
- tools/oracle/cases/helpers/logging-payload/provider-failure.yaml
- tools/oracle/cases/helpers/logging-payload/stream-tools-usage.yaml
- tools/oracle/cases/helpers/logging-payload/served-text-overlay.yaml
- tools/oracle/cases/helpers/logging-payload/sparse-choices.yaml
- tools/oracle/cases/helpers/logging-payload/service-tier.yaml
- tools/oracle/cases/helpers/logging-payload/classifier-audit.yaml
- tools/oracle/cases/helpers/logging-payload/private-classifier.yaml
- tools/oracle/cases/helpers/logging-payload/base64-truncation.yaml
deviations: []
out_of_scope:
- Cost calculation and spend rows are B068-B069; their optional typed payload fields are not populated here.
- Exporter-specific schema and Python callback invocation remain in later tasks.
pitfalls:
- Logged output must reflect post-processing that changed the served response, not the raw provider text.
- A sparse choice index must not allocate an unbounded vector.
- Do not create a permissive catch-all JSON logging record to avoid typing the standard payload.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
