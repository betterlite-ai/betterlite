id: B190
title: Typed request logging payloads
description: >-
  Complete get_standard_logging_object_payload/emit_standard_logging_payload (litellm_logging.py 6485-6779) over
  B254 typed fields, B253 metadata and B252 stream aggregation. Compose the Logging lifecycle supplied by B247 state,
  B248 dynamic callbacks, B249 pre/post dispatch, B250 success and B251 failure; B012 wires them into server routes.
  Implement redact_messages.py redacted_standard_logging_payload/_redact_standard_logging_object (175-210) after
  assembling independent per-callback snapshots. Preserve Decimal seconds/numbers for startTime/endTime/completionStartTime/response_time,
  optional cost fields, service tier from B212 and absent unimplemented auth/spend fields. Classifier audit belongs
  to B021. Budget 280 final assembly/privacy, 110 adapters, 300 tests and 60 wiring (750 total). Write the behavior
  rstest functions logging_payloads_logging_payload_tests_behavior in adjacent tests.rs files, with a named case for each behavior
  and failure in the DoD; corpus replay tests have separate names. The helper operation logging_payload is already registered; each operation has its own Rust and Python
  adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/payload.rs
  - crates/betterlite-logging/src/payload/**
  - crates/betterlite-openai/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/logging/payload.rs
  - tools/oracle/src/helpers/logging/payload/**
  - tools/oracle/helpers/logging_payload.py
  - tools/oracle/helpers/logging_payload/**
  - tools/oracle/cases/helpers/logging-payload/**
  - "tools/oracle/fuzz/corpus/helper_case/logging_payload-*"
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L5640-L5770
  why: Standard payload setup and identifiers.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L6347-L6779
  why: Status, errors, response metadata and standard event construction.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/logging_utils.py#L53-L167
  why: Bounded base64 truncation.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/logging_utils.py#L230-L319
  why: Stream reconstruction and timing.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/served_output_texts.py#L95-L171
  why: Capture the text actually served to the client.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/redact_messages.py#L175-L210
  why: Standard logging payload privacy moved here from B188.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L3570-L3615
  why: All payload fields, including Decimal-backed timestamps.
dod:
- text: >-
    Success/failure payloads, typed timestamps and per-callback standard-payload redaction match the pinned helpers
    with explicit absence.
  proof:
  - oracle
  - helper-python
- text: >-
    Composed lifecycle emits one terminal payload and no success after failure/cancellation; stream mechanics are
    supplied by B252.
  proof:
  - logging-payload-tests
- text: Per-callback payloads are isolated and prompt/base64/secrets obey the selected privacy policy.
  proof:
  - logging-payload-tests
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: logging-payload-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::logging_payloads_logging_payload_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/logging_payload-*")" &&
      grep -lq 'logging_payload' tools/oracle/fuzz/corpus/helper_case/logging_payload-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/logging-payload/chat-success.yaml
- tools/oracle/cases/helpers/logging-payload/provider-failure.yaml
- tools/oracle/cases/helpers/logging-payload/service-tier.yaml
- tools/oracle/cases/helpers/logging-payload/standard-payload-redaction.yaml
- tools/oracle/cases/helpers/logging-payload/decimal-times.yaml
- tools/oracle/cases/helpers/logging-payload/lifecycle-payload.yaml
deviations: []
out_of_scope:
- Cost calculation and spend rows are B068-B069; their optional typed payload fields are not populated here.
- Exporter-specific schema and Python callback invocation remain in later tasks.
- >-
  Logging class ownership: state/eligibility B247, dynamic callback selection B248, pre/post dispatch B249, success
  B250, failure B251, stream aggregation B252; payload setup B253/B254.
- >-
  ClassifierAudit helpers and _autorouter_savings_for_payload are B021; deployment pricing and cost helpers B068/B069;
  callback setup/get_custom_logger_compatible_class B189 plus exporter branches B110-B118; prompt-management B117,
  MCP B140, other endpoint conversions B080-B099.
- >-
  Complete remaining litellm_logging ownership: _get_cached_prometheus_logger is B111; pricing helpers 417-533,
  get_deployment_model_for_cost and 5555-5596 are B068; mask_api_base_credentials is B187; initialize_standard_built_in_tools_params
  is B024; _get_masked_values is B188; set_callbacks and _get_custom_logger_settings_from_proxy_server are B189;
  logger construction/exporter gating 4502-5537 and modify_integration are B110-B118. Python extension class loading
  belongs to B164-B165.
- >-
  Logging._build_standard_logging_payload is the thin call into this task; access-group extraction 5604-5637 is
  B052 auth metadata, _autorouter_savings_for_payload is B021, and _get_traceback_str_for_error is B251. create_dummy_standard_logging_payload
  is a Python test/SDK convenience owned by B164, not production event synthesis. Every StandardLoggingPayloadSetup
  method is B253/B254 except get_model_cost_information (B068) and _generate_cold_storage_object_key (B115).
pitfalls:
- 'Name every corpus seed tools/oracle/fuzz/corpus/helper_case/logging_payload-<case>.yaml. The rest of that folder belongs to other tasks.'
- 'The oracle helper for this task is pre-registered as logging_payload in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/payload.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/logging_payload.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Logged output must reflect post-processing that changed the served response, not the raw provider text.
- A sparse choice index must not allocate an unbounded vector.
- Do not create a permissive catch-all JSON logging record to avoid typing the standard payload.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
