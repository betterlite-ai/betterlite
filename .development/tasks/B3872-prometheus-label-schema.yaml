id: B3872
title: Prometheus budget label catalog and schema selection
description: >-
  Complete the budget, limit, cache, batch and MCP label schemas and resolve caller identity and opt-in labels.
  Implement three validation functions: get_caller_identity_mode returns the configured mode (api_key_alias, user_email, or both, defaulting to api_key_alias); validate_caller_identity rejects configs where user_email mode conflicts with metrics requesting api_key_alias; resolve_caller_identity_labels returns a fresh label list with the configured mode applied (replacing api_key_alias with user_email or inserting both).
  Add PrometheusMetricLabels attributes for team, org, user and customer budgets; key, team and org rate limits; cache hits/misses and provider cache metrics; managed batch operations; and MCP tool calls.
  Implement get_labels(metric_name) to build schema projection: default labels with caller identity resolved, plus custom_prometheus_metadata_labels and custom_prometheus_tags (both sanitized), plus conditional toggles for stream label (prometheus_emit_stream_label), rate-limit labels (prometheus_emit_rate_limit_labels), input-length label (prometheus_emit_input_sequence_length_label), org labels (injected based on _org_label_metrics), and user-budget email/alias (prometheus_user_budget_label_include_email_alias).
  A logger snapshots the resulting schema for its lifetime; model-specific litellm_params key-limit declarations stay effective where the config loader builds them.
scope:
  paths:
    - crates/betterlite-logging/src/prometheus_label_schema.rs
    - crates/betterlite-logging/src/prometheus_label_schema/tests.rs
    - crates/betterlite-logging/src/prometheus_label_schema/tests/**
