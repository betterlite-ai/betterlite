id: B1011
title: Realtime SDK connection dispatch
description: >-
  Own the entire decorated _arealtime function, including its nested refresh callback, plus
  _build_litellm_metadata,vertex_access_token_resolver and _resolve_vertex_access_token_bounded
  in betterlite-core::api::realtime_connect. B1127 owns health probes, not half of this connector.
  B174 resolves identity, B176 projects litellm params, and B157 selects realtime config. Generic
  configs use B2457. Direct branches call B545 Azure, B528 OpenAI, B666 Bedrock and B1405 xAI;
  Vertex uses B1303 tokens, B1365 config selection and B2457. Gemini/Meta configs stay with
  B1378/B1382 and B039. Preserve each branch's exact credential/header arguments.

  All optional named arguments default None. headers=None becomes {}; extra_headers overlays it
  when not None, mutating the caller header map in the source. Resolve model using named api_base/key.
  Copy query_params when supplied and replace its model only if that key exists; no implicit model
  is inserted for intent=transcription. Logging receives normalized model,user,optional_params={},
  B176 params plus arealtime=true. Metadata starts with a copy of litellm_metadata and overrides its
  guardrails only from truthy metadata.guardrails or kwargs.guardrails; it is internal, not a URL field.

  B002 loads global api_base,api_key,openai_key,xai_key,vertex_project,vertex_location (None), and unset
  AZURE_API_BASE,AZURE_API_KEY,OPENAI_API_KEY,XAI_API_BASE,XAI_API_KEY,LITELLM_AZURE_REALTIME_PROTOCOL,
  VERTEXAI_CREDENTIALS,VERTEXAI_PROJECT,VERTEXAI_LOCATION. REALTIME_CREDENTIAL_RESOLUTION_TIMEOUT_SECONDS
  defaults20.0 and uses float parsing. loads_realtime_connection_settings tests every setting through
  the real loader, with new YAML seeds. B529 owns Azure AD resolution and B1402 xAI key selection.

  Use B901 service realtime_connect for actual provider handshakes/frames; finite token resolvers and
  virtual time exercise timeout and refresh without live Google credentials. Existing decoders suffice.
  Source count 256 nonblank/non-comment lines; budget 225 dispatch,160 tests,140 transcripts,90 adapters,
  85 config tests/seeds and 35 wiring =735 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/realtime_connect.rs
  - crates/betterlite-core/src/api/realtime_connect/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/**
  - crates/betterlite-config/src/api/realtime_connect.rs
  - crates/betterlite-config/src/api/realtime_connect/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/realtime-connect-*
  - tools/oracle/src/websocket_driver.rs
  - tools/oracle/src/websocket_driver/realtime_connect.rs
  - tools/oracle/src/helpers/core_ops/realtime_connect_websocket.rs
  - tools/oracle/src/helpers/core_ops/realtime_connect_websocket/**
  - tools/oracle/helpers/realtime_connect_websocket.py
  - tools/oracle/helpers/realtime_connect_websocket/**
  - tools/oracle/cases/websocket/realtime-connect/**
  - tools/oracle/fuzz/corpus/websocket_oracle/realtime-connect-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/realtime_api/main.py#L78-L84
  why: Guardrail metadata precedence and omission rules used by this connector only.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/realtime_api/main.py#L313-L587
  why: Whole token helpers and _arealtime dispatch with every provider branch and nested refresh closure.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L338-L342
  why: OAuth resolution timeout defaults20.0 seconds independently of the WebSocket frame limit.
dod:
- text: >-
    realtime_generic_dispatch resolves model alias to provider-model, overlays headers {x:old} with
    extra_headers {x:new,y:test}, and sends original named api_base/key to B2457, not dynamic resolver
    replacements. A supplied query model becomes provider-model; {intent:transcription} remains model-free.
    Caller query input is not mutated. Generic config selection precedes direct branches. Known Gemini/Meta
    configs open one mock backend. Metadata.guardrails=[first] beats kwargs.guardrails=[second] and copied
    litellm_metadata.guardrails=[third]; when both overrides are empty the copied third list survives.
    No guardrails metadata is added to the provider URL. Unsupported normalized model=m raises
    ValueError("Unsupported model: m") with no connection.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_openai_and_azure_credentials tests Azure and azure_ai bases dynamic > generic api_base > global
    api_base > AZURE_API_BASE; keys dynamic > global api_key > global openai_key > AZURE_API_KEY. OpenAI
    uses the same base chain ending https://api.openai.com/ and key chain ending OPENAI_API_KEY. All globals
    default None. Azure version uses named api_version > generic version > "2024-10-01-preview"; protocol
    uses kwargs.realtime_protocol > generic realtime_protocol > LITELLM_AZURE_REALTIME_PROTOCOL, then B545
    client negotiation. A truthy key suppresses AD lookup; otherwise B529 receives named azure_ad_token and
    kwargs. Both branches pass client=None and omit merged headers, retaining timeout,query,principal and
    internal metadata. Compare one handshake with selected auth and exact query, including no-model transcription.
  proof: [behavior-tests, config-tests, oracle, service-python]
- text: >-
    realtime_bedrock_and_xai_arguments passes every Bedrock AWS option unchanged or None: aws_region_name,
    aws_access_key_id,aws_secret_access_key,aws_session_token,aws_role_name,aws_session_name,aws_profile_name,
    aws_web_identity_token,aws_sts_endpoint,aws_bedrock_runtime_endpoint,aws_external_id,aws_session_tags.
    Bedrock base/key use dynamic > named; no generic/global fallback is added and no query,headers,principal
    or litellm_metadata is forwarded by this branch. xAI base is dynamic > generic > XAI_API_BASE >
    https://api.x.ai/v1, ignoring global api_base; key is dynamic > xai_key > api_key > XAI_API_KEY with
    legacy_generic_before_env=true. xAI also passes client=None and omits merged headers. Use real mock
    connections for successful branches and native call-argument assertions for all omitted fields.
  proof: [behavior-tests, config-tests, oracle, service-python]
- text: >-
    realtime_vertex_credentials_and_refresh chooses credentials vertex_credentials > vertex_ai_credentials
    > VERTEXAI_CREDENTIALS; project vertex_project > vertex_ai_project > global vertex_project > VERTEXAI_PROJECT;
    location follows the analogous location chain. Empty values fall through. Token resolution calls B1303
    with provider=vertex_ai and configured20.0-second default. A timed-out resolver raises "Vertex AI realtime:
    timed out fetching Google OAuth access token after 20.0s; check network egress from the proxy to the OAuth
    token endpoint (oauth2.googleapis.com)" and opens no backend. Override0 expires immediately; another
    resolver exception propagates unchanged. Refresh uses the resolved project from the first call and
    returns only the new token. B1365 receives model,token,refresh callback,project,location. Generic transport
    gets base dynamic > generic,api_key=None,original client/timeout,merged headers,query,principal and metadata.
  proof: [behavior-tests, config-tests, oracle, service-python]
- text: New loader tests, config seeds and WebSocket transcripts exercise complete connection branches.
  proof: [config-tests, config-corpus, service-corpus, new-cases, oracle, service-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Connection dispatch moves credentials and must verify each branch's omissions as well as values.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_connect::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: Every realtime credential/protocol/timeout setting needs a supported loader path.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_connect::tests::loads_realtime_connection_settings($|::)/)'
  - id: config-corpus
    why: New realtime connection settings must replay through B002's YAML decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/realtime-connect-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: service-python
    why: The SDK connector must establish real mock WebSocket connections, not return helper plans.
    run: test -f tools/oracle/helpers/realtime_connect_websocket.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: service-corpus
    why: Connector service arguments need newly added bounded transcript seeds.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle/realtime-connect-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: new-cases
    why: Provider dispatch must add independent handshake/result observations.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-connect)"
oracle_cases:
- tools/oracle/cases/websocket/realtime-connect/realtime-generic-dispatch.yaml
- tools/oracle/cases/websocket/realtime-connect/realtime-openai-and-azure-credentials.yaml
- tools/oracle/cases/websocket/realtime-connect/realtime-bedrock-and-xai-arguments.yaml
- tools/oracle/cases/websocket/realtime-connect/realtime-vertex-credentials-and-refresh.yaml
deviations: []
out_of_scope:
- B1010 owns HTTP config resolution and the three HTTP SDK calls plus _with_resolved_session_model; B1127 owns stored credential merge and all health probe helpers in realtime_api/main.py.
- B528/B545/B666/B036 own direct provider transports, B1303 credential refresh, B1365 Vertex config, B1378/B1382 Gemini config and B039 Meta config. B2457 owns generic WebSocket execution.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_connect_websocket in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/realtime_connect_websocket.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_connect_websocket.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Generic configs receive original api_base/key, while later provider branches often use dynamic resolved values.
- Azure and OpenAI direct connectors discard the merged headers and force client=None.
- A transcription-only URL intentionally has no model key; normalizing the route model must not insert one.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
