deviations:
- what: When REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES is unset, betterlite caps an event at ApiLimits.max_event_bytes=1048576
    and closes an oversized WebSocket message with code 1009; LiteLLM defaults to no frame cap.
  why: Bounded external frames are required by repository rules.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L338-L339
