checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_connect::/)
      - test(/::replays_corpus$/)'
  - id: case-realtime-connect-model
    why: the realtime-connect-model behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::realtime_connect_model($|::)/)'
  - id: case-bounded-vertex-token
    why: the bounded-vertex-token behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::bounded_vertex_token($|::)/)'
  - id: case-health-beta-header
    why: the health-beta-header behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::health_beta_header($|::)/)'
  - id: case-health-transcription-intent
    why: the health-transcription-intent behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::health_transcription_intent($|::)/)'
  - id: case-connect
    why: the connect behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::connect($|::)/)'
  - id: case-model-normalization
    why: the model-normalization behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::model_normalization($|::)/)'
  - id: case-upstream-refusal
    why: the upstream-refusal behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::upstream_refusal($|::)/)'
  - id: deviation-tests
    why: the documented compatibility difference lacks a native assertion
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_connect::tests::compatibility_deviations($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_connect::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/realtime-connect-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: service-python
    why: the native WebSocket service adapter is absent or fails strict Python checks
    run: test -f tools/oracle/helpers/realtime_connect.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-connect)"
