id: B1011
title: Realtime connect
description: >-
  Connect realtime WebSockets using provider-specific B010 endpoint/config preparation and bounded credential acquisition.
  Implement the health probe with source GA/beta/transcription selection and B009 TLS policy, then execute the client/backend
  relay with immutable authorized model.


  B1127 supplies the provider connection plan. Add B901 transcripts for connect, model normalization and upstream
  refusal; drop the artificial connect-timeout case because the OpenAI handler ignores timeout. Health checks use
  configured transports and B1001 health audio.


  B901 transcripts use the service driver realtime_probe with typed arguments and scripted client frames. Python
  calls realtime_api.main._realtime_health_check and the B1127 connection service directly with injected transport/clock/logging
  interfaces; Rust calls this production service. No FastAPI route/global proxy state is recreated. Route authentication
  and alias parity are exclusively B941/B1125 gateway-driver transcripts.


  Implement crates/betterlite-core/src/api/realtime_connect.rs. Use RealtimeConnectInput and RealtimeConnectResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions realtime_connect_model, bounded_vertex_token, health_beta_header, health_transcription_intent,
  connect, model_normalization, upstream_refusal under api::realtime_connect::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES
  defaults to unset is None in LiteLLM; configured integer otherwise; env.LITELLM_AZURE_REALTIME_PROTOCOL defaults
  to unset (None); env.REALTIME_CREDENTIAL_RESOLUTION_TIMEOUT_SECONDS defaults to '20.0'. No environment reads occur
  outside betterlite-config. Test api::realtime_connect::tests::loads_settings uses the production Config loader
  and an injected environment map, with a named rstest case for every key above, explicit override, unset/default
  and invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key report;
  a grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder rather
  than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Use B901 kind: websocket transcripts with the typed realtime_probe service driver, comparing upstream handshake
  status, negotiated subprotocol, per-direction frame ordering and close code/reason. Route gateway cases also compare
  pre-accept HTTP status. No helper calls a WebSocket route function.


  Callable ownership: litellm/realtime_api/main.py: _is_transcription_only_realtime_model (L590-L597); litellm/realtime_api/main.py:
  _azure_realtime_health_protocol (L603-L613); litellm/realtime_api/main.py: _realtime_health_check_auth_headers
  (L616-L628); litellm/realtime_api/main.py: _realtime_health_check (L631-L742). Abstract/protocol declarations
  map to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 126 owned nonblank/non-comment/non-docstring Python lines (142 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 146 implementation,
  82 behavior tests, 84 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 39 config tests/seeds and
  30 wiring; 471 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B171 (Direct helper oracle and URL path encoding),
  B1009 (Realtime client relay), B1087 (Api boundaries), B1127 (Realtime connection preparation), B901 (Websocket
  oracle), B1001 (Audio file input), B528 (OpenAI realtime connection and session requests), B1010 (Realtime http
  calls), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
