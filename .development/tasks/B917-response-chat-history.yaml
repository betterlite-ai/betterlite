id: B917
title: Response chat history
description: >-
  Implement chat-to-Responses conversation conversion and reasoning replay, retaining provider metadata and upstream
  response IDs. Convert raw provider-shaped response items only through explicit typed variants; map incomplete
  reasons and file parts without fetching URLs.


  Implement crates/betterlite-core/src/api/response_chat_history.rs. Use ResponseChatHistoryInput and ResponseChatHistoryResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions chat_system_to_instructions, assistant_reasoning_replay, tool_call_output_history,
  raw_output_item, input_file_value under api::response_chat_history::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponseChatHistory in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_chat_history: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/completion_extras/litellm_responses_transformation/transformation.py: _provider_metadata
  (L81-L88); litellm/completion_extras/litellm_responses_transformation/transformation.py: _upstream_response_id
  (L91-L94); litellm/completion_extras/litellm_responses_transformation/transformation.py: _get_reasoning_items
  (L109-L116); litellm/completion_extras/litellm_responses_transformation/transformation.py: _reasoning_input_items
  (L119-L132); litellm/completion_extras/litellm_responses_transformation/transformation.py: _build_reasoning_item
  (L135-L160); litellm/completion_extras/litellm_responses_transformation/transformation.py: _reasoning_item_from_output_item
  (L163-L178); litellm/completion_extras/litellm_responses_transformation/transformation.py: _reasoning_items_from_output_items
  (L181-L186); litellm/completion_extras/litellm_responses_transformation/transformation.py: _as_chat_reasoning_items
  (L189-L194); litellm/completion_extras/litellm_responses_transformation/transformation.py: _map_incomplete_reason_to_finish_reason
  (L200-L203); litellm/completion_extras/litellm_responses_transformation/transformation.py: _incomplete_reason_from_response_payload
  (L216-L223); litellm/completion_extras/litellm_responses_transformation/transformation.py: tool_call_dict_from_output_item
  (L230-L262); litellm/completion_extras/litellm_responses_transformation/transformation.py: _reasoning_item_to_response_input
  (L271-L283); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler.__init__
  (L291-L292); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._handle_raw_dict_response_item
  (L315-L358); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler.convert_chat_completion_messages_to_responses_api
  (L360-L487). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 279 owned nonblank/non-comment/non-docstring Python lines (305 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 299 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 549 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B171 (Direct helper oracle and URL path
  encoding), B902 (Responses shapes), B1087 (Api boundaries), B1136 (Responses chat content projection), B903 (Response
  id codecs), B912 (Responses tool results). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
