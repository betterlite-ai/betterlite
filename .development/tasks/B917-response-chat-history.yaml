id: B917
title: Convert chat history and preserve Responses reasoning identity
description: >-
  Implement api::response_chat_history for conversation conversion and the shared reasoning,
  metadata, response-ID and tool-call helpers. B1136 converts content; B220 replays thinking
  blocks; B903 unwraps response IDs and B912 resolves call IDs. Keep these helpers below the
  request/result/stream callers in the dependency graph. Move the complete raw-output
  callback L315-L358 to B919, which alone calls it. __init__ has no state to reproduce.

  Provide a B171 response_chat_history operation selecting typed history, reasoning-item,
  metadata or tool-output projections. Missing reasoning IDs use an opaque rs_ identifier;
  compare its prefix and reuse within a conversion, not Python's process address.
  There is no JSON parsing or provider I/O here. The owned ranges contain 277 nonblank/
  non-comment lines; budget 265 implementation, 165 tests, 110 cases, 90 adapters and
  25 wiring lines, totaling 655.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/response_chat_history.rs
  - crates/betterlite-core/src/api/response_chat_history/**
  - tools/oracle/src/helpers/core_ops/response_chat_history.rs
  - tools/oracle/src/helpers/core_ops/response_chat_history/**
  - tools/oracle/helpers/response_chat_history.py
  - tools/oracle/helpers/response_chat_history/**
  - tools/oracle/fuzz/corpus/helper_case/response_chat_history-*
  - tools/oracle/cases/helpers/response-chat-history/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L76-L205
  why: Shared metadata exclusion sets, upstream IDs and reasoning record/default construction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L214-L264
  why: Incomplete-reason extraction and custom/function call conversion retain distinct payload fields.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L269-L293
  why: Stored reasoning needs summary and preserves only truthy encrypted_content; construction has no state.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L360-L487
  why: One complete history conversion owns leading systems, assistant calls and correlated tool output ordering.
dod:
- text: >-
    leading_system_instructions converts system a,system b,user c to instructions="a b"
    and one user input message c. A later system d remains a system message; nonstring
    leading system content also remains an input message. Empty system text follows
    truthiness when joining, so ["","b"] gives "b". System-only conversion returns
    input=[] and instructions; B918 alone turns it back into a system input item.
  proof: [history-tests, oracle, history-adapter]
- text: >-
    assistant_call_history emits stored reasoning, then a truthy assistant content message,
    then calls in order. Function calls copy id to call_id and only present name/arguments;
    custom calls use name/input default "". A truthy function wins over custom. An assistant
    call {id:c} with neither supported payload raises ValueError
    "tool call not supported: {'id': 'c'}". Assistant content=null with no calls can still
    emit reasoning; non-assistant null content emits nothing. Empty assistant text without
    calls produces an empty output_text message, but with calls produces no text message.
  proof: [history-tests, oracle, history-adapter]
- text: >-
    correlated_tool_output collects custom call IDs from all assistant messages before
    conversion. Tool text=ok becomes function_call_output.output=[{type:input_text,text:ok}],
    but a matching custom call produces custom_tool_call_output.output="ok". Null gives [],
    multimodal lists use B1136 with role=user, and number 7 becomes input_text text="7".
    Missing tool_call_id stays null; a custom dict paired with a truthy function is not
    counted as custom. Tool results can precede their definition and still be classified.
  proof: [history-tests, oracle, history-adapter]
- text: >-
    reasoning_history gives nonempty reasoning_items precedence over thinking_blocks.
    Stored {id:rs_a,summary:null,encrypted_content:""} becomes
    {type:reasoning,id:rs_a,summary:[]} with no encrypted_content; missing/falsy id gets rs_.
    With no stored items, B220 converts thinking text=x to a summary_text x item without id
    and preserves a litellm_encrypted_reasoning:cipher signature as encrypted_content=cipher.
    Building output reasoning from dict or typed item fills missing summary block type with
    summary_text and text with ""; missing dict id becomes "", encrypted_content stays null.
    Non-reasoning items are ignored and an empty reasoning list projects to null.
  proof: [history-tests, oracle, history-adapter]
- text: >-
    output_tool_fields maps function arguments or custom input into function.arguments,
    defaulting falsy payloads to ""; default names are "" for function and custom_tool
    for custom. Preserve the supplied index=3 and B912 call-ID choice. Nonempty dict or
    attribute-backed provider_specific_fields appears both on the tool and function;
    empty/unsupported metadata is absent. The output type is always function.
  proof: [history-tests, oracle, history-adapter]
- text: >-
    shared_output_metadata removes null values, every B004 ModelResponse field plus usage,
    and every Responses-only field from B1138/OpenAI Response minus ChatCompletion fields.
    For {id:bad,output:[],instructions:x,vendor:7,empty:null}, retain only vendor=7.
    Null upstream ID stays null; encoded resp_a unwraps to resp_a. Incomplete details must
    be mappings with string reason; content_filter maps to content_filter, while null,
    max_output_tokens and unknown map to length. Nonstring reason becomes null.
  proof: [history-tests, oracle, history-adapter]
checks:
  optional: []
  commands:
  - id: history-tests
    why: history ordering or shared reasoning and metadata rules are missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_history::/)'
  - id: history-adapter
    why: chat history has no independently executed helper comparison
    run: test -f tools/oracle/helpers/response_chat_history.py && grep -qE '^[[:space:]]+response_chat_history:' tools/oracle/fuzz/corpus/helper_case/response_chat_history-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
