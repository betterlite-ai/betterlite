- tools/oracle/cases/helpers/response-chat-history/leading-system-instructions.yaml
- tools/oracle/cases/helpers/response-chat-history/assistant-call-history.yaml
- tools/oracle/cases/helpers/response-chat-history/correlated-tool-output.yaml
- tools/oracle/cases/helpers/response-chat-history/reasoning-history.yaml
- tools/oracle/cases/helpers/response-chat-history/output-tool-fields.yaml
- tools/oracle/cases/helpers/response-chat-history/shared-output-metadata.yaml
deviations: []
out_of_scope:
- B1136 owns file/content/choice/annotation helpers; B918 request mapping; B919 raw-output callbacks and final response assembly; B920 stream iterator construction and conversion; B2412 raw SSE recovery.
- _map_responses_status_to_finish_reason has no caller at the pin; do not add a parallel status implementation.
- B220 owns the thinking-block grouping and encrypted-signature protocol in common_utils.py.
pitfalls:
- 'The oracle helper for this task is pre-registered as response_chat_history in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/response_chat_history.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/response_chat_history.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Custom call IDs are collected across the entire history, so results do not require a preceding definition here.
- Only consecutive leading string system messages become instructions; later system messages stay in input.
- An empty function payload is falsy and may select the custom branch instead.
review_level: standard
budget:
  max_changed_lines: 655
  max_new_expects: 1
