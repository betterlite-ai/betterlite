id: B1122
title: Audio transcription provider contract
description: >-
  Define AudioTranscriptionRequestData and BaseAudioTranscriptionConfig's callable contract in
  betterlite-provider::api::transcription_contract with leaf request records in betterlite-openai. The request
  carries data as an object or bytes, files=None and content_type=None. Abstract request/support-list methods
  are required provider dispatch methods; the two capability properties default false. URL resolution returns
  api_base or "". Preserve get_provider_specific_params filtering exactly: ignore null, model,
  OPENAI_TRANSCRIPTION_PARAMS and names returned by get_supported_openai_params(model), retaining false/zero/
  empty-string values. Its openai_params argument is not consulted.

  Own the complete base class and dataclass, except generic chat transform_request/transform_response which
  have no transcription caller at the pin and remain unsupported interface members under B010. Use B171's
  transcription_contract helper with a finite supported-name list, no provider I/O and no new byte decoder.
  The source has 110 nonblank/non-comment lines including signatures/docstrings; allocate 110 interfaces/defaults,
  105 tests, 75 cases, 85 adapters and 25 wiring, total 400. Inherited chat-base methods and errors stay B2202's.
scope:
  paths:
  - crates/betterlite-provider/src/api.rs
  - crates/betterlite-provider/src/api/**
  - crates/betterlite-provider/src/api/transcription_contract.rs
  - crates/betterlite-provider/src/api/transcription_contract/**
  - crates/betterlite-provider/src/operation.rs
  - crates/betterlite-provider/src/operation/**
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/**
  - crates/betterlite-openai/src/api/transcription_contract.rs
  - crates/betterlite-openai/src/api/transcription_contract/**
  - tools/oracle/src/helpers/provider/transcription_contract.rs
  - tools/oracle/src/helpers/provider/transcription_contract/**
  - tools/oracle/helpers/transcription_contract.py
  - tools/oracle/helpers/transcription_contract/**
  - tools/oracle/cases/helpers/transcription-contract/**
  - tools/oracle/fuzz/corpus/helper_case/transcription_contract-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/audio_transcription/transformation.py#L23-L99
  why: Own request fields, capability defaults, URL fallback and audio-specific transformation interfaces.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/audio_transcription/transformation.py#L131-L190
  why: Own provider-specific option extraction and the exact two reserved names.
dod:
- text: >-
    transcription_contract_defaults creates request data={} and data=bytes abc: each preserves its data kind,
    files=None,content_type=None. Explicit files={} and content_type="audio/wav" remain explicit. A base config
    reports has_native_transcription_endpoint=false,supports_subtitle_synthesis=false. Independent overrides
    can turn either true without changing the other. URL inputs None,"",https://mock/transcribe produce
    "","",https://mock/transcribe. A missing required provider request transform is a typed unsupported
    operation, with the source NotImplementedError diagnostic "AudioTranscriptionConfig needs a request
    transformation for audio transcription models"; response default says "AudioTranscriptionConfig does not
    need a response transformation for audio transcription models".
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    transcription_provider_parameters uses supported=[language,response_format],optional={model:m,
    OPENAI_TRANSCRIPTION_PARAMS:internal,language:en,response_format:json,diarize:false,count:0,label:"",unset:null,
    extra:yes},openai_params=[extra]. The result is {diarize:false,count:0,label:"",extra:yes}. Adding extra to
    the config's supported list removes it; changing only the unused openai_params argument does not. Reserved
    names are case-sensitive, so Model is retained. Input options are not mutated.
  proof: [behavior-tests, oracle, helper-python]
- text: The transcription_contract helper tag and new fixtures exercise the base defaults through independent implementations.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Capability defaults and option filtering affect provider transport selection and query fields.
    run: cargo nextest run --locked -p betterlite-provider -p betterlite-openai --no-tests=fail -E 'test(/^api::transcription_contract::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: Contract fixtures must call the pinned base methods through a typed adapter.
    run: test -f tools/oracle/helpers/transcription_contract.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: The helper enum must accept transcription_contract with both object and byte data.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/transcription_contract-*)" && grep -qE '^[[:space:]]+transcription_contract:' tools/oracle/fuzz/corpus/helper_case/transcription_contract-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Capability and reserved-option fixtures must be added for this contract.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/transcription-contract)"
oracle_cases:
- tools/oracle/cases/helpers/transcription-contract/transcription-contract-defaults.yaml
- tools/oracle/cases/helpers/transcription-contract/transcription-provider-parameters.yaml
deviations: []
out_of_scope:
- BaseAudioTranscriptionConfig.transform_request and transform_response are generic chat hooks with no transcription caller at the pin; B010's unsupported-operation contract covers them without transcription cases.
- B2202 owns inherited BaseConfig behavior. B1082 selects the SDK provider, B083 the public transcription route, and provider tasks own audio request/response transforms.
pitfalls:
- 'The oracle helper for this task is pre-registered as transcription_contract in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/transcription_contract.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/transcription_contract.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The openai_params argument looks like a filter but is never read; supported names come from the config method.
- False, zero and empty strings are forwarded as provider-specific parameters; only None is excluded by value.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
