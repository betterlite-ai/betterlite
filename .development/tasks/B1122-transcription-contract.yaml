id: B1122
title: Transcription provider contract
description: >-
  Define base transcription capabilities, provider-specific parameter exclusion and subtitle support. transcription()
  queries has_native_transcription_endpoint before selecting execution.


  Implement crates/betterlite-core/src/api/transcription_contract.rs, crates/betterlite-provider/src/api/transcription_contract.rs.
  Use TranscriptionContractInput and TranscriptionContractResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions transcription_native_capa_32b6, subtitle_synthesis_capability under
  api::transcription_contract::tests. Each named function drives production code and asserts its case result; use
  named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::TranscriptionContract in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {transcription_contract: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.get_supported_openai_params
  (L41-L42); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.supports_subtitle_synthesis
  (L45-L52); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.has_native_transcription_endpoint
  (L55-L61); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.get_complete_url
  (L63-L79); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.transform_audio_transcription_request
  (L82-L91); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.transform_audio_transcription_response
  (L93-L99); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.transform_request
  (L101-L111); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.transform_response
  (L113-L129); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig.get_provider_specific_params
  (L131-L159); litellm/llms/base_llm/audio_transcription/transformation.py: BaseAudioTranscriptionConfig._should_exclude_param
  (L161-L190). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 118 owned nonblank/non-comment/non-docstring Python lines (154 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 138 implementation,
  52 behavior tests, 24 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 342 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B1087 (Api boundaries). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
