checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::transcription_contract::/)
      - test(/::replays_corpus$/)'
  - id: case-transcription-native-capability
    why: the transcription-native-capability behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::transcription_contract::tests::transcription_native_capa_32b6($|::)/)'
  - id: case-subtitle-synthesis-capability
    why: the subtitle-synthesis-capability behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::transcription_contract::tests::subtitle_synthesis_capability($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/transcription_contract.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/transcription_contract-*)"
      && grep -qE "^[[:space:]]+transcription_contract:" tools/oracle/fuzz/corpus/helper_case/transcription_contract-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/transcription-contract)"
oracle_cases:
- tools/oracle/cases/helpers/transcription-contract/transcription-native-capability.yaml
- tools/oracle/cases/helpers/transcription-contract/subtitle-synthesis-capability.yaml
