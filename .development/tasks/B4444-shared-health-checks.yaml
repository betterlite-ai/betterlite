deviations:
  - what: "Concurrency default for perform_health_check when None or non-positive is unbounded (matching B4443 LiteLLM behavior), not a constructor-specified cap."
    why: "The outline question 5 flags this as a decision point; betterlite defaults to unbounded like LiteLLM's asyncio.gather."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_check.py#L539-L576
  - what: "Release is a separate read-then-delete operation, not atomic; if the owner changes between read and delete, the lock stays (no race condition causes incorrect release)."
    why: "LiteLLM implements it this way; atomic compare-delete is not used."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_check_utils/shared_health_check_manager.py#L98-L103

out_of_scope:
  - "Redis cache methods async_set_cache, async_get_cache, async_delete_cache; their implementation is unresolved (question 3)."
  - "Proxy server globals use_shared_health_check and redis_usage_cache registration; their initialization is outside this task."
  - "Model-specific lock/cache key variants (get_model_health_check_lock_key, get_model_health_check_cache_key) have no callers at the pin and are not implemented."
  - "is_health_check_in_progress method (lines 322-338) has no caller at the pin outside its unit test."

pitfalls:
  - "pod_id must be constructed with wall-clock milliseconds at init time, not elapsed-time or counter-based IDs; two pods starting in the same second must have different IDs."
  - "Lock acquisition uses SET NX, not SET with EX only; if a pod crashes, the lock expires by TTL (best-effort coordination, not true mutex)."
  - "Cache expiration is strict age > TTL; at exactly age == TTL it is not yet expired (common off-by-one in time comparisons)."
  - "Release must be a read-then-delete, not SET with NX or an atomic compare-delete; if ownership changed between read and delete, keep the new lock (do not delete)."
  - "Polling loop polls every five seconds; exact timing matters for test predictability (use mocked clocks)."
  - "When no Redis is configured, skip the polling loop entirely and execute locally at once; do not sleep and then check anyway."
  - "Exception maps are excluded from cached dicts but remain in in-process returns to callers; the cached result tuple has no exception_status integer field."
  - "Cached results are decoded from either a JSON string or an already-parsed dict; both forms are valid cache representations."

