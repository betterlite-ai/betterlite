dod:
  - text: SharedHealthCheckManager accepts redis_cache (optional), health_check_ttl (default 300 seconds from environment variable DEFAULT_SHARED_HEALTH_CHECK_TTL), and lock_ttl (default 60 seconds from environment variable DEFAULT_SHARED_HEALTH_CHECK_LOCK_TTL).
    proof: [manager-init-tests]
  - text: pod_id is constructed as pod_<milliseconds> where milliseconds is wall-clock time in milliseconds at initialization.
    proof: [pod-id-tests]
  - text: Static key builders return "health_check_lock" and "health_check_results" as Redis keys.
    proof: [key-builder-tests]
  - text: acquire_health_check_lock uses Redis SET NX with TTL, returning true if acquired, false if the lock existed or Redis is None; logs acquisition and failure at info and debug levels.
    proof: [lock-acquire-tests]
  - text: release_health_check_lock reads the current lock owner, deletes only if it matches pod_id, and logs on error; returns without error if redis_cache is None.
    proof: [lock-release-tests]
  - text: get_cached_health_check_results decodes JSON strings or dicts, checks current_time - cache_timestamp > health_check_ttl strictly, and returns None for expired or missing cache.
    proof: [cache-get-tests]
  - text: cache_health_check_results stores healthy_endpoints, unhealthy_endpoints, counts, timestamp, and checked_by via safe_dumps JSON with configured health_check_ttl.
    proof: [cache-set-tests]
  - text: perform_shared_health_check checks cache first, tries lock acquire, runs B4443 perform_health_check if lock acquired, caches result, and releases lock in a finally block.
    proof: [orchestration-tests]
  - text: When lock is not acquired and Redis is configured, polls every five seconds for cached results up to lock_ttl seconds total, stopping early if lock disappears, then falls back to local execution.
    proof: [polling-tests]
  - text: When no Redis is configured, locks always fail and execution proceeds directly to local perform_health_check without polling.
    proof: [no-redis-tests]
  - text: get_health_check_status returns a dict with pod_id, redis_available, lock_ttl, cache_ttl, lock_owner (if any), lock_in_progress bool, cache_available bool, and cache_age_seconds (if cached).
    proof: [status-tests]
  - text: "GET /health/shared-status is registered with B052's user_api_key_auth dependency, responds with shared_health_check_enabled flag, and returns early if disabled without consulting Redis."
    proof: [endpoint-auth-tests]
  - text: Redis errors during lock/cache operations are caught and logged without raising; cache miss and local fallback preserve the source's behavior.
    proof: [error-handling-tests]
  - text: Cached results do not include the per-model exception map tracked in-process; exception_status is omitted from cached dicts.
    proof: [cache-exception-tests]

checks:
  optional: []
  commands:
    - id: manager-init-tests
      why: Manager initialization with defaults and TTL parameters must be correct
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::manager_init(::|$)/)'
    - id: pod-id-tests
      why: pod_id must use wall-clock milliseconds format
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::pod_id(::|$)/)'
    - id: key-builder-tests
      why: Static key builders must return correct constants
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::key_builders(::|$)/)'
    - id: lock-acquire-tests
      why: Lock acquisition via SET NX must work correctly with ownership tracking
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::lock_acquire(::|$)/)'
    - id: lock-release-tests
      why: Lock release must verify ownership before deletion
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::lock_release(::|$)/)'
    - id: cache-get-tests
      why: Cache retrieval must decode JSON and check strict age > TTL expiration
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::cache_get(::|$)/)'
    - id: cache-set-tests
      why: Cache storage must serialize with timestamp and checked_by fields
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::cache_set(::|$)/)'
    - id: orchestration-tests
      why: perform_shared_health_check must execute lock/cache/execute sequence correctly
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::orchestration(::|$)/)'
    - id: polling-tests
      why: Polling behavior when lock not acquired must respect five-second intervals and lock_ttl limit
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::polling(::|$)/)'
    - id: no-redis-tests
      why: Behavior without Redis must skip polling and execute locally
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::no_redis(::|$)/)'
    - id: status-tests
      why: Status dict must include all required fields with correct values
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::status(::|$)/)'
    - id: endpoint-auth-tests
      why: GET /health/shared-status must require authentication and check enabled flag
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::endpoint_auth(::|$)/)'
    - id: error-handling-tests
      why: Redis errors must be caught and logged without propagating
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::error_handling(::|$)/)'
    - id: cache-exception-tests
      why: Cached results must exclude in-process exception map
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_shared::cache_exceptions(::|$)/)'

