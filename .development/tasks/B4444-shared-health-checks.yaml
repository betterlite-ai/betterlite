id: B4444
title: Coordinate shared health checks and report Redis status
description: >-
  Build shared health coordination in betterlite-server that prevents duplicate health check execution across multiple pods using Redis. When a lock is acquired, this pod runs the full health check and caches results; when the lock is not acquired, other pods poll for cached results up to the lock TTL before falling back to local execution.

  Implement a SharedHealthCheckManager in a new module that:
  - Accepts a RedisCache, health check TTL (default 300 seconds from environment variable DEFAULT_SHARED_HEALTH_CHECK_TTL), and lock TTL (default 60 seconds from environment variable DEFAULT_SHARED_HEALTH_CHECK_LOCK_TTL).
  - Constructs a wall-clock pod_id as pod_<milliseconds> at initialization.
  - Exposes static key builders for lock and cache keys ("health_check_lock" and "health_check_results").
  - Uses Redis SET NX (set-not-exists) to acquire a lock, storing the pod_id with TTL for ownership tracking.
  - Releases the lock by first reading it to verify ownership, then deleting; this is a separate read-then-delete, not an atomic compare-delete.
  - Caches health check results as JSON (via B192's private_json wrapper) with a timestamp; cached results lose the per-model exception map that in-process callers track separately.
  - Decodes cached results from either a JSON string or a dict, checking strict age > TTL expiration.
  - Runs perform_shared_health_check, which orchestrates: (1) check for recent cache, (2) try to acquire lock, (3) if acquired, run full check via B4443 and cache it, (4) if not acquired and Redis is configured, poll every five seconds for up to lock_ttl seconds with early exit if lock disappears, (5) fall back to local execution if no cache found or polling times out.
  - When no Redis is configured, skip polling and execute locally at once.
  - Never spawn detached tasks; polls and waits must be owned by the caller or tracked in the server shutdown manager.
  - get_health_check_status returns a dict with pod_id, redis_available, lock/cache TTLs, current lock owner (if any), lock in-progress flag, cache availability, cache age in seconds and last-checked-by pod_id.

  Register GET /health/shared-status, authenticated via B052's user_api_key_auth, which checks a proxy_server flag (e.g., use_shared_health_check) and returns early if shared checks are disabled. If Redis is not configured, report redis_available: false. On error, return HTTP 500 with a descriptive error dict.

