id: B3463
title: Authorize nested RAG stores and project managed settings
description: >-
  Build depth-bounded recursive store-ID discovery, sorted authorization,
  and managed-store option projection for RAG ingestion and query requests.
  Discover all vector_store_id values in nested request payloads up to a
  recursion depth limit, authorize each discovered ID against user permissions,
  and compose caller-allowed options with managed store overrides in a
  consistent order.

  Recursive discovery with stack-based depth tracking: scan payloads for
  vector_store_id keys at any nesting level, rejecting invalid IDs (non-string
  or empty) with a 400 error and stopping traversal on depth overflow.
  The special case: when a list is encountered at over-depth, return it
  flat (do not recurse into list items) but check if any item is a dict or
  list and raise depth-exceeded error if so. Invalid vector_store_id values
  raise HTTPException with error detail naming the constraint violation.

  Authorization: each discovered ID is passed to assert_user_can_access_vector_store_id
  from B1061, which returns a LiteLLM_ManagedVectorStore or None. The result is
  a mapping from vector_store_id (sorted by key) to the resolved managed store.
  Only authorized IDs appear in the returned mapping.

  Caller option allowlisting: _MANAGED_STORE_CALLER_OPTIONS frozenset contains
  seven keys (vector_store_id, data_source_id, wait_for_ingestion,
  ingestion_timeout, custom_metadata, file_description,
  max_embedding_requests_per_min) that callers may set when a managed store is
  resolved. When a managed store exists, only these keys from the caller request
  are preserved; all other provider-specific keys are removed. When no managed
  store resolves, the full caller-supplied config is kept.

  Managed store overrides: call build_request_data_from_managed_vector_store
  from B1067 to extract server-configured settings for a resolved managed store.
  These settings (custom_llm_provider, aws_region_name, embedding_model, etc.)
  take precedence over caller-supplied values by merging last (overwriting
  any conflicting caller keys).

  Provider validation: _ingest_provider_error validates the custom_llm_provider
  in the merged config by calling get_ingestion_class, returning None if valid
  or an error message string if unsupported. This check is deferred to the route
  and does not block discovery or authorization.

  All functions are request-parsing helpers that transform payloads and
  authorized stores into merged options for the ingestion/query pipeline.
  No provider constructor is called. Return types use MappingProxyType for
  immutability where appropriate.

