deviations:
  - what: Caller request URL and file_id inputs bypass store authorization in
      the route layer. The RAG ingest and query request handlers (owned by B3465
      and B097) check only the ingest_options and retrieval_config payloads
      respectively; file_url and file_id fields do not participate in nested
      store discovery, delegated to the route handlers rather than this helper.
    why: Authorization applies only to managed store configuration, not to
      external URLs or existing file identifiers that may reference unmanaged
      sources.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/rag_endpoints/endpoints.py#L604-L607

out_of_scope:
  - The route handlers (rag_ingest, rag_query) that call these helpers; B3465
    and B097 own those functions.
  - The database lookup and schema for managed vector stores; B1061 owns the
    authorization check and B1067 owns the config extraction.
  - Provider-specific validation beyond get_ingestion_class; individual
    provider tasks own their configuration validation.
  - The LiteLLM_ManagedVectorStore data type definition; this lives in a
    dependency, not in this task.

pitfalls:
  - "Register helper operation `store_authorization` in the `store_authorization` group before this task runs by adding it to tools/oracle/src/helpers/mod.rs GROUPS and tools/oracle/helpers/b3463.py OPERATIONS."
  - "The over-depth list case is subtle: when a list is encountered at over-depth,
    the code does not recurse into the list items, but it checks whether any item
    is a dict or list and raises depth-exceeded if so. This is a flat-list return
    with a conditional error, not a simple pass-through."
  - "_MANAGED_STORE_CALLER_OPTIONS is a frozenset; iterating it when filtering
    caller options is order-independent, but sorted() on the returned vector_store_ids
    ensures consistent behavior in _authorize_nested_vector_store_ids."
  - "MappingProxyType is returned for immutability; callers see read-only mappings
    and cannot modify the returned store authorization or options dictionaries."
  - "Provider validation defers to get_ingestion_class, which raises ValueError
    when the provider is unknown; _ingest_provider_error catches this and returns
    a string error message for the route to handle."
  - "When assert_user_can_access_vector_store_id returns None (unauthorized),
    the dict comprehension's is not None guard filters that ID out entirely;
    unauthorized IDs never appear in the returned mapping."

review_level: security
