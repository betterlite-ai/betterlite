id: B3269
title: Reattach policy pipelines on background response retrieval
description: >-
  Reconstruct policy context from an encoded response's deployment and attach
  missing post-call pipelines and provenance metadata. When a background response
  is retrieved (e.g. from storage), the policy engine must run post-call pipelines
  that would have executed during the original request. This task extracts the model
  group from the response's deployment, checks whether policies apply, and reattaches
  pipelines with their provenance; it preserves ungoverned-retrieval warnings when
  submission context cannot be fully reproduced.

  Define PolicyPipelines as a type alias for a tuple of (policy_name, GuardrailPipeline)
  pairs, with a TypeAdapter for validation. UngovernedRetrieval is a dataclass with a
  reason field (enum: "no router", "response id names no deployment", "deployment no
  longer in the router") explaining why post-call pipelines cannot be attached.

  _model_group_for_response_id extracts the model_id from the response_id using
  B903's ResponsesAPIRequestUtils.get_model_id_from_response_id, looks up the
  deployment in the router via B844's Router.get_deployment, and returns either
  the deployment's model_name or an UngovernedRetrieval. If the model_group name
  is a wildcard deployment (contains "*"), or if it has aliases in the router's
  model_group_alias map, log a warning via verbose_proxy_logger because a policy
  attached to the model name at submission time may not run on retrieval.
  _submit_model_hidden_by checks whether a model group name matches a wildcard
  pattern or is the target of one or more model_group_alias entries, returning
  a warning string or None.

  _retrieval_context builds a PolicyMatchContext from the request metadata and
  model group. Extract team_alias and key_alias from UserAPIKeyAuth (or None if
  not a string), get the model from the model group name, and get tags via
  B1102's get_tags_from_request_body on the request data (or None if empty).
  _post_call_pipelines_for_context gets attached policies via B3241's
  get_attachment_registry().get_attached_policies_with_reasons with policy_applies
  predicate, then filters to policies whose conditions apply via
  PolicyMatcher.get_policies_with_matching_conditions. Extract post-call pipelines
  only (mode == "post_call") via PolicyResolver.resolve_pipelines_for_context.
  Return a tuple of (policy_name, pipeline) pairs and a mapping of policy_name
  to matched_via reasons.

  attach_post_call_pipelines_to_retrieval is the main entry point. If the policy
  registry is uninitialized, return early. Get the model group; if ungoverned,
  log a warning and return. Build the retrieval context and get post-call pipelines.
  Via B206's get_or_create_metadata_bucket, get the metadata dict. Decode any
  already-attached pipelines from the bucket's "_guardrail_pipelines" key using
  _POLICY_PIPELINES_ADAPTER.validate_python. Compute the set of policy_names
  already attached. Filter new pipelines to those not already attached; if none
  are new, return. Merge already-attached and new pipelines in the bucket. Update
  "_pipeline_managed_guardrails" to the frozenset of all guardrail names across
  all pipelines. For each new policy, call add_policy_to_applied_policies_header
  and add_guardrail_to_applied_guardrails_header for each step. Call
  add_policy_sources_to_metadata with the matched_via reasons for new policies.
  Log a debug message listing the attached pipelines and model group.

  Preserve ungoverned-retrieval warnings and alias/wildcard warnings when the
  original submission-name matching is not fully reproducible. Preserve the
  distinction between pre-call and post-call pipelines, attaching only post-call.
  Preserve the already-attached pipeline deduplication: a policy whose pipelines
  are already in the bucket is not re-attached.

  Build in betterlite-policy/src/response_retrieval.rs. Depend on B3240 for
  PolicyMatchContext and GuardrailPipeline, B3241 for registry/matcher/resolver,
  and B189 for the three metadata header functions (add_policy_to_applied_policies_header,
  add_guardrail_to_applied_guardrails_header, add_policy_sources_to_metadata).
  Every observable behavior (model_group lookup, alias detection, context reconstruction,
  pipeline filtering, deduplication, header updates) is tested. The main entry-point
  function and its helpers are oracle cases preserving exact warning conditions and
  attachment order.
scope:
  paths:
    - crates/betterlite-policy/src/response_retrieval.rs
    - crates/betterlite-policy/src/response_retrieval/**
    - crates/betterlite-policy/Cargo.toml
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/policy-response-retrieval/**
    - tools/oracle/fuzz/corpus/helper_case/policy-response-retrieval-*
