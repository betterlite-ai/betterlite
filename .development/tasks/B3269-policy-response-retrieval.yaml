dod:
  - text: Model group lookup via response_id succeeds when router and deployment exist, returns UngovernedRetrieval for no-router, non-decodable-response-id, or missing-deployment reasons.
    proof: [behavior-tests]
  - text: Uninitialized policy registry early-return prevents post-call pipeline attachment without errors.
    proof: [behavior-tests]
  - text: Wildcard deployment and model_group_alias matching log warnings about submission-name hiding.
    proof: [behavior-tests]
  - text: Retrieval context is built from UserAPIKeyAuth aliases, model group, and request tags.
    proof: [behavior-tests]
  - text: Post-call pipelines are filtered from all matching pipelines, deduplicating against already-attached policies.
    proof: [behavior-tests]
  - text: Metadata bucket is updated with merged pipelines, pipeline-managed guardrails, and policy sources.
    proof: [behavior-tests]
  - text: The independent helper operation b3269 matches the production implementation in every case.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Response retrieval missing functions or incorrect model lookup, deduplication, or context building.
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^response_retrieval::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Helper adapter missing or Python checks fail.
      run: test -f tools/oracle/helpers/b3269.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No seed corpus or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/policy-response-retrieval-*")" && grep -rlq "\"b3269\"" tools/oracle/fuzz/corpus/helper_case/policy-response-retrieval-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/policy-response-retrieval/model-group-lookup.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/deployment-not-found.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/ungoverned-no-router.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/ungoverned-response-id-not-decodable.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/registry-not-initialized.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/wildcard-warning.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/alias-warning.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/context-building.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/pipeline-filtering.yaml
  - tools/oracle/cases/helpers/policy-response-retrieval/deduplication.yaml
deviations: []
out_of_scope:
  - "B3240 owns policy values (Policy, PolicyAttachment, PolicyScope, PolicyGuardrails, PolicyCondition) and GuardrailPipeline; this task reuses them."
  - "B3241 owns policy registry, attachment registry, matching and resolution; this task calls get_policy_registry, is_initialized, policy_applies, get_policies_with_matching_conditions, get_attached_policies_with_reasons, and resolve_pipelines_for_context."
  - "B903 owns ResponsesAPIRequestUtils.get_model_id_from_response_id in betterlite-responses; this task calls it to decode response IDs."
  - "B844 owns Router.get_deployment and model_group_alias in betterlite-router; this task calls get_deployment and accesses model_group_alias."
  - "B302 owns resolve_model_group_alias in betterlite-router; this task calls it to detect alias targets."
  - "B1102 owns get_tags_from_request_body in betterlite-http; this task calls it for retrieval context tags."
  - "B206 owns get_or_create_metadata_bucket in betterlite-models; this task calls it to access metadata for header updates."
  - "B732 owns AuthContext in betterlite-auth; this task reuses team_alias and key_alias in retrieval context."
  - "B189 owns callback registration, discovery in litellm.callbacks, add_guardrail_to_applied_guardrails_header, add_policy_to_applied_policies_header, and add_policy_sources_to_metadata functions in callback_utils.py; this task calls all three metadata header functions."
pitfalls:
  - Wildcard deployments ("model*") are detected by string containment of "*", not regex matching. Preserve this literal check.
  - model_group_alias is a mapping from alias names to model groups, not the reverse. Multiple aliases can target the same model group; the warning lists all of them.
  - PolicyPipelines adapter must accept serialized tuples of tuples, not a list of objects. Pydantic validation-python accepts the right shape.
  - Ungoverned retrievals do not prevent metadata updates for other reasons; only post-call pipelines are skipped. Early return preserves this.
  - The metadata bucket "_guardrail_pipelines" and "_pipeline_managed_guardrails" keys must match the spelling that upstream code expects.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
