id: B4295
title: Queue request-scoped cache writes and increments
description: >-
  Implement immediate memory effects with deferred Redis SET/DEL/increment completion and the direct-path fallback when no batch is active.
  Queued writes execute immediately in the in-memory tier and schedule their Redis operations on the active request batch; when no batch is open, they run directly against Redis.
  `async_set_cache_pre_call` and `async_delete_cache_pre_call` write memory and return the deferred batch result, or None for fallback.
  `increment_cache_post_call` schedules a single increment operation on the post-call batch with failure logging; `pipeline_increment_post_call` schedules a pipeline of increments, each with its failure logged through `on_settled`.
  Keep callback failures observable: `log_deferred_increment_failure` observes when the Redis increment settles. Both `async_increment_cache_pipeline` and `async_set_cache_pipeline` swallow Redis failures after memory is updated and log them; only `async_set_cache_sadd` propagates Redis errors.
scope:
