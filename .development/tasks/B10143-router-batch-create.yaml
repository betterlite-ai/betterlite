dod:
  - text: "`acreate_batch` sets `model`, runs update-before-fallbacks with `litellm_metadata` and the fallback executor with the create attempt, and returns its answer."
    proof: [create-calls]
  - text: The attempt picks one deployment with `files-api-fake-text` and the `specific_deployment` taken out, updates the request under `_acreate_batch`, holds the slot, and calls the executor with data, provider, caching, client and the request in that order.
    proof: [create-calls]
  - text: The deployment's own `custom_llm_provider` wins over the looked-up one, and the lookup runs even when the deployment names its provider.
    proof: [create-calls]
  - text: "`total_calls` and `success_calls` count by the deployment's model and `fail_calls` by the group name; an error comes back unchanged and carries the retry skip id only when the request has a `model_info.id`."
    proof: [create-failures]
  - text: "`batch_create` builds the object from the server's router parts and reaches a recording executor through a real router."
    proof: [create-assembly]
checks:
  optional: []
  commands:
    - id: create-calls
      why: the metadata key, the fake message, the argument order, the slot or the provider choice differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_create::/) - test(/failure/)'
    - id: create-failures
      why: a counter uses the wrong key, the retry skip id is missing or invented, or the error is wrapped
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_batch_create::.*failure/)'
    - id: create-assembly
      why: batch_create cannot be built from the server's parts or does not reach the executor through the router
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::router_calls::batch_create::/)'
oracle_cases: []
deviations:
  - what: The provider create runs in the GenericCallExecutor handed to the constructor instead of LiteLLM's module function `litellm.acreate_batch`.
    why: Rust keeps no module-level function to look up; the batch route and the Python crate each pass their own provider create.
out_of_scope:
  - "acancel_batch, acreate_file, avector_store_create, alist_batches and RouterBatchCalls, which forwards acreate_batch to this object: B8353. aretrieve_batch: B10142."
  - "create_batch in litellm/proxy/batches_endpoints/endpoints.py and the acreate_batch executor over B1036's provider create: B1050. _create_provider_batch_for_managed_file, which also calls Router.acreate_batch with disable_fallbacks true: B1112."
  - "Selection is B016's, the request update, client and slot B303's, update-before-fallbacks and the fallback executor B310's and the retry stamps B017's, all reached through B6020's ports; the server adapters behind them are B8630's."
  - "send_llm_exception_alert runs in a background task on failure and stops at once when the router has no slack_alerting_logger; router_settings.alerting_config is refused at config load, so the call is left out."
pitfalls:
  - "The selection's fake message is `files-api-fake-text`, the files text; `batch-api-fake-text` belongs to the cancel attempt."
  - "The request is spread after `custom_llm_provider`, `caching` and `client`, so a request value for any of them wins over the router's, unlike retrieval, which removes the request's provider first."
  - "`total_calls` and `success_calls` use the deployment's litellm model as key, while `fail_calls` uses the group name the caller asked for."
  - "get_llm_provider runs even when the deployment sets custom_llm_provider, so a lookup error fails the attempt after `total_calls` has counted it."
  - "The retry skip stamp reads `model_info` from the request after the update, so a selection failure carries no skip id."
  - "After the update the request holds the deployment's api_key, so do not log the request map; LiteLLM's debug and exception lines that print kwargs are left out."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
