  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L3909-L3914
    why: _stamp_retry_skip_deployment_id reads model_info.id from the request after the update.
