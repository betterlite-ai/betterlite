deviations: []
out_of_scope:
  - "The only functions in endpoints.py, search and list_search_tools, and their route registration are B8275. B8634 supplies their state and mount; B8610 owns the root aggregator. B3275/B8673 own all seven management routes. B8626/B8701/B8728 mount MCP, not Search."
  - "search/__init__.py defines no functions: B7887 exports search, asearch and search_provider_cost_per_query over B3272/B3274. B161 is the Python surface umbrella. No export is reimplemented here."
  - "B3270 implements BaseSearchConfig, SearchResult, SearchResponse and server credential trust; B3272 implements _build_search_optional_params, search and asearch. B3276 implements BaseLLMHTTPHandler.search/async_search. All other llm_http_handler.py methods retain the API owners listed by B3276."
  - "All SearchAPIRouter functions are B3273; retry/fallback traversal is B310/B017. B8354 owns the call-type table and B8631 its production branch adapters. Router construction and the shared SearchToolList attachment are B8611/B8613, with exact task corrections in the planner report."
  - "B3271 owns every live SearchToolRegistry operation; get_search_tool_by_name_from_db has no caller at the pin. B3275 owns its management helpers and models. B8384 owns parse_search_tools, load/merge/reload; B8372 schedules reloads and B8380 supplies supported_db_objects."
  - "B749 owns the search grant functions in auth_checks.py and B737 the team lookup; B3684 supplies masking. Fixtures exercise these implementations rather than implementing access checks."
  - "B1552/B1553/B1554/B1555 implement APISerpent, Brave, DataForSEO and DuckDuckGo. B5834 implements Perplexity; B8020 through B8025 implement Exa, Serper, Tavily, You.com, fastCRW, Firecrawl, Linkup, SearXNG, Google PSE, SearchAPI, Nimble and Parallel AI. B048 implements TinyFish and the native registry; B5360 owns get_provider_search_config's selector tags. Every provider function stays with its existing owner."
  - "B048 explicitly leaves agentcore and bing_grounding without executable SearchProvider adapters; B659/B2212/B546 own their leaf logic. Closing that existing registry deviation needs the separate architect decision recorded in notes, not a second registry or a false parity claim."
  - "B3274 owns search pricing and Parallel AI usage pricing, with spend/logging integration owned by the cost and spend tasks. The B1349 and B032 mentions of B091 as Vertex passthrough consumer are stale; B3639 and B3642 own those consumers."
  - "The architect declares search_tools in the fixture crate, adds optional FixtureSeed.search_tools with default None, calls its seeder after seed_keys, wraps SearchSeedError in FixtureError and updates existing struct literals. The architect declares search_http in the oracle crate and registers search_case in its fuzz manifest. None of these shared files is worker scope."
pitfalls:
  - "An installed router with model_list=[] still owns search_tools; using an empty deployment list as the no-router test makes every config-only named search fail."
  - "A search_tool_name in the URL replaces the body name before authorization, whereas the provider key and base always come from the chosen tool."
  - "SearchToolRegistry stores unique names in Postgres; multiple same-name candidates are a config/router feature and cannot be seeded as duplicate database rows."
  - "GET providers send their transformed parameters in the URL with no body; a successful fixture that never checks the captured query cannot prove their transport works."
  - "Google PSE's environment validation needs GOOGLE_PSE_ENGINE_ID even when optional_params contains a search_engine_id."
  - "TinyFish retains _caller_max_results on its config object, so successive searches must receive freshly constructed configs."
  - "The mutation response can expose a synthetic provider key while list/get mask it; applying one blanket secret assertion to every management response would reject LiteLLM's contract."
  - "search_tools excluded from supported_db_objects stops router refresh, not the database write or management list read."
  - "Connection testing wraps an upstream AuthenticationError in a 200 result with error_type; /search returns the normal error envelope for the same provider failure."
  - "The optional search fixture must not add tables or grants to an unrelated case when its seed is absent."
review_level: security
