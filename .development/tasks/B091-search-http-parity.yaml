dod:
  - text: Search fixtures reproduce the pinned schema and grants, reject missing fixture principals and seed independently without altering ordinary database cases.
    proof: [fixture-tests, fixture-regression]
  - text: The production HTTP case decoder reads every seed variant, rejects unknown ones and replays its new fuzz corpus.
    proof: [case-tests, search-corpus]
  - text: All 18 registered web providers produce successful nonempty results through real HTTP execution, retaining their native URLs, methods, auth placement, option mapping and response extras.
    proof: [provider-cases, provider-http-tests, oracle]
  - text: A config-only router serves all search aliases, top-level tools take precedence, caller credentials cannot replace tool credentials, options merge correctly and one configured retry sends exactly two calls.
    proof: [routing-cases, provider-http-tests, oracle]
  - text: GET and POST status failures, a malformed provider response, server-key destination refusal and connection testing retain their distinct public error contracts.
    proof: [error-cases, oracle]
  - text: Config/database precedence, masking, list order, key/team grants and unfiltered inference discovery are observable through the booted proxy.
    proof: [database-cases, catalog-http-tests, oracle]
  - text: Create, update and delete affect the very next search through one shared list, restore config fallback after deletion and honor supported_db_objects without rolling back committed writes.
    proof: [database-cases, lifecycle-http-tests, oracle]
checks:
  optional: []
  commands:
    - id: fixture-tests
      why: The search schema, JSON representation, principal linkage or database isolation is wrong or absent.
      run: cargo nextest run --locked -p betterlite-postgres-fixture --no-tests=fail -E 'test(/::search_seed_contract($|::)/) | test(/::search_seed_isolation($|::)/)'
    - id: fixture-regression
      why: The optional seed attachment must leave existing database setup working.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/postgres-fixture/src/search_tools.rs tools/postgres-fixture/src/search_tools)" &&
        cargo nextest run --locked -p betterlite-postgres-fixture --no-tests=fail -E 'test(/^tests::/)' &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^http::postgres::tests::/)'
    - id: case-tests
      why: New seed tags do not reach the actual HTTP decoder or invalid fixture input reaches provisioning.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::search_case_decode($|::)/)'
    - id: search-corpus
      why: The changed case input has no fuzz target, new seeds or production-decoder replay.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/search_case)" &&
        test -f tools/oracle/fuzz/fuzz_targets/search_case.rs &&
        grep -rlq 'search_tools:' tools/oracle/fuzz/corpus/search_case &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_search_case_corpus)'
    - id: provider-http-tests
      why: Equal errors or empty replies cannot stand in for successful provider dispatch and named-tool routing.
      run: cargo build --locked -p betterlite && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::search_provider_http($|::)/)'
    - id: catalog-http-tests
      why: A broken database seed, startup list or grants lookup can make both proxies fail identically.
      run: cargo build --locked -p betterlite && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::search_catalog_http($|::)/)'
    - id: lifecycle-http-tests
      why: A committed management write must change subsequent real searches unless the reload is disabled.
      run: cargo build --locked -p betterlite && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::search_lifecycle_http($|::)/)'
    - id: provider-cases
      why: The provider helper tests need new HTTP fixtures through the mounted routes.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/search-parity/providers)"
    - id: routing-cases
      why: No existing mount case proves populated search execution, credential precedence or retries.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/search-parity/routing)"
    - id: error-cases
      why: Transport and connection-route failures need HTTP envelopes rather than helper exception comparisons.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/search-parity/errors)"
    - id: database-cases
      why: The management mount's no-database cases do not exercise real registry writes or grants.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/search-parity/database)"
