id: B091
title: Search provider execution and live tool management over HTTP
description: >-
  Finish the Search API with the booted-proxy comparisons its parts could not run.
  B8275 implements both functions in search_endpoints/endpoints.py, B8634 mounts
  their six paths, and B8673 mounts B3275's management routes. B3272 and B3276 own
  execution; B3273 owns selection and fallbacks. None needs another implementation
  here. Add deterministic Postgres fixtures and HTTP cases that exercise those real
  components together. B048 explicitly hands its provider HTTP cases here. The
  package search/__init__.py only re-exports search, asearch and
  search_provider_cost_per_query; B7887 already owns the Python exports. There are
  zero unimplemented LiteLLM functions in B091's two covered files, so this task
  owns integration evidence and test infrastructure, not their production logic.

  Use B5076's independent database pair and the existing HTTP request/steps case
  format. Run the built betterlite binary against pinned LiteLLM, without
  --self-check as parity proof. Register no route and do not call FastAPI handlers
  through helpers. The architect supplies the fixture attachment and startup
  corrections listed in out_of_scope before dispatch. All provider addresses are
  configured mock addresses using {{upstream}}; no real provider or cloud credential
  is needed. Set general_settings.master_key to a fixed test key, disable background
  health checks and use router_settings.num_retries=0 except in the retry case.
  Give separate fixture groups distinct config text so different seeds never share
  one booted database. Compare response status, full JSON, content-type, stable
  x-litellm-* headers and upstream method, path, body and selected headers. The
  harness's credential fingerprints must distinguish different synthetic keys.
  Ignore only generated ids, write timestamps and timings at their exact pointers,
  and /error/message for betterlite's own error prose. A detail-string error or
  test_connection error message may ignore that string with the same explanation,
  while retaining its envelope, status and error_type. Never ignore an entire
  result, tool list, provider request or error object.

  Fixtures. Add tools/postgres-fixture/src/search_tools.rs and its directory, with
  SearchSeed, a closed serde snake_case enum with empty, catalog and grants variants,
  and seed(&Client, &SearchSeed) returning this module's SearchSeedError with the
  database source preserved. No free-form SQL, credentials or URLs come from the
  enum. The optional database.seed.search_tools field defaults to None, which adds
  nothing. empty installs the pinned search table with no rows. catalog adds two
  fixed-id tools, shared and db-only, with distinct fixed UTC created_at timestamps;
  db-only is newer. Both use tinyfish, a synthetic api_key and no api_base, so
  TINYFISH_API_BASE={{upstream}} supplies the destination without interpolating a
  database row. Keep litellm_params/search_tool_info in the same JSON representation
  Prisma's Json fields and B3271 consume, and verify readback through the real
  registry in catalog HTTP tests rather than storing a JSON string inside JSON. Use the
  unique search_tool_name constraint, not an invented duplicate-name dataset.
  Store DDL and fixed rows under tools/postgres-fixture/fixtures/search-tools/.

  grants extends catalog with LiteLLM_ObjectPermissionTable rows and updates the
  existing fixture keys/teams by their stable ids and hashed tokens. Cases seed
  internal-user principals for sk-search-key-denied (key permits only config-only),
  sk-search-team-denied (key unrestricted, team permits only config-only),
  sk-search-allowed (key and team permit shared) and sk-search-unrestricted (empty
  lists). Add a proxy_admin_viewer principal for the management list comparison.
  Supply their users, teams and keys through the existing seed fields; the extension
  fails on a missing referenced fixture principal instead of updating zero rows.
  The DDL adds the pinned object_permission_id relation columns when the baseline
  lacks them, without changing the shared baseline.sql. Reuse B5076's connection,
  provisioning deadline and cleanup; this is private fixture data, not a migration.

  Add tools/oracle/src/search_http.rs and its directory for test support. Tests
  named search_seed_contract and search_seed_isolation in the fixture module verify
  all three datasets, unique names, chronological order, JSON readback, hashed key
  linkage and isolation of the two databases. search_case_decode tests the real
  case::decode_case(path, bytes) with each new seed tag and unknown tags. A new
  search_case cargo-fuzz target calls that same decoder on bounded arbitrary YAML
  bytes, and replays_the_search_case_corpus replays its committed inputs. The
  architect registers this target in the existing fuzz manifest. No second YAML
  decoder or new crate is needed. Tests named search_provider_http, search_catalog_http
  and search_lifecycle_http call the real runner with self_check=false and inspect
  both captures: intended successes must be 200 with the expected nonempty results,
  lists or mutation effects, not two equal failures. Reuse the existing bounded
  mock, steps and capture substitution rather than starting another fixture server.

  Provider cases. Give each of B048's 18 provider names a configured search tool
  with an explicit synthetic key and mock api_base (omit the key for duckduckgo).
  Use one successful result carrying a distinctive title and URL in each native
  response. apiserpent uses deep=true and max_results=2 to prove the deep minimum
  num=10 and GET /api/search, with results.organic. brave uses GET with
  X-Subscription-Token, result_filter=web,news and dated web/news results.
  dataforseo uses api_key=fixture:password, a POST task array and two query strings;
  only the first query and the first task/result's organic item survive, with Basic
  auth and location_code=2250 when country is absent. duckduckgo sends a keyless GET
  with format=json and _max_results, then projects an abstract and a nested topic.
  exa_ai sends x-api-key, numResults, includeDomains and default contents.text=true;
  serper sends X-API-KEY with q, num and lowercase gl. tavily joins a query list and
  maps domains to include_domains, country to lowercase and content to snippet.
  you_com uses /v1/search with X-API-Key and Accept-Encoding=identity, concatenating
  web then news and selecting the first snippet. fastcrw supplies default
  scrapeOptions and prefers markdown to description. firecrawl uses the v2-style
  data.web/data.news response and preserves the news date. linkup proves default
  depth=standard and outputType=searchResults with text and image results.
  searxng sends GET /search, format=json and country=JP as language=ja, with no
  outbound max_results. google_pse sets GOOGLE_PSE_ENGINE_ID=fixture-engine (unset
  by default), sends the synthetic key and cx in the GET query, caps num at 10 and
  uses the first domain. searchapi sends engine=google and api_key in its GET query,
  lowercases gl and projects organic_results. nimble retains X-Client-Source=litellm,
  splits included/excluded domains and returns additional_data intact. parallel_ai
  uses /v1/search, x-api-key, default mode=basic, list search_queries and explicit
  advanced_settings precedence; return excerpts, search_id, session_id,
  parallel_usage and warnings. perplexity preserves a list query and all four
  explicit unified options, and does not synthesize max_results or
  max_tokens_per_page when absent. tinyfish sends GET with X-API-Key and Accept,
  country as location and a domain rewrite; two consecutive requests with limits
  one and two must not share the per-call result cap, and response extras survive.
  Reuse the leaf tasks' declared input types; Python truthiness and JSON formatting
  are not additional compatibility cases. Provider algorithms remain with those
  tasks. B048's explicit agentcore/bing_grounding registry limitation is an
  architect follow-up, not silently converted into successful provider cases here.

  Routing cases. config-only-aliases has no database and no chat deployments,
  yet its configured search tool must run on POST /v1/search/{search_tool_name},
  /search/{search_tool_name}, /v1/search and /search. The last two pass the tool
  name in the body; the path variants also send a conflicting body name to prove
  the path wins. Exercise GET /v1/search/tools and /search/tools on that same
  installed router. config-precedence sets top-level search_tools and a different
  general_settings.search_tools list; only the top-level tools appear. A second
  config uses only general_settings.search_tools and resolves an os.environ/ key
  from the injected environment. Both default to no tools when absent, as B8384
  specifies; this task introduces no config defaults or config section.
  credentials sends caller api_key, api_base and search_provider that conflict with
  the configured tool and compares the selected tool's credential fingerprint and
  destination. Use two paths on the same mock server to expose a wrong base.
  params has tool max_results=5 and request max_results=2 plus a provider-specific
  option; the request wins, null extras are omitted and internal LiteLLM fields
  are not accidentally forwarded. retry configures one matching tool and one
  allowed retry, returning a 503 then a successful response; assert exactly two
  upstream requests, so random selection cannot make the fixture flaky. Keep
  B8634's existing unknown-tool and missing-auth cases in their owner's folder.

  Transport errors run both a GET provider (brave) and a POST provider
  (perplexity) against 401, 429 with Retry-After and 503 answers, with retries off.
  Preserve the public error status, type, param and code and the stable projected
  headers, including absence where the proxy drops a provider header. A syntactically
  valid 200 response that lacks Nimble's required results proves response validation
  runs after transport; record the pinned handled error without inventing a
  provider 500. Connection tests use POST /search_tools/test_connection with
  perplexity, an operator-configured mock base, query=test, max_results=1 and the
  route's timeout=10; ignore caller extras such as a supplied query/max_results.
  Compare both success/results_count and an upstream 401 producing HTTP 200 with
  status=error and error_type=AuthenticationError. A named tool with no explicit
  key, PERPLEXITYAI_API_KEY set and PERPLEXITY_API_BASE pointing to a different
  configured host must refuse to send that key, with zero provider requests. The
  normal search timeout remains REQUEST_TIMEOUT, default 6000 seconds; this task
  changes no deadlines and never waits for that default in a test.

  Database cases. catalog-merge uses config-only and a config shared tool whose
  description/key differ from the database shared row. GET /search_tools/list
  returns config-only first with null id/timestamps and is_from_config=true,
  then db-only and shared in descending creation order, with masked params.
  GET /search_tools/{search_tool_id} is masked and is_from_config=false; search
  call/list aliases see the same database override, not a separate registry.
  grants compares key denial, team denial and permitted calls to shared: the
  denials are 403, type=key_model_access_denied, param=search_tool_name and
  code="403", with no upstream request. Empty allowlists are unrestricted. The
  internal user's /search_tools/list is filtered by both grants, whereas
  /v1/search/tools remains an authenticated unfiltered name/provider list. An
  admin viewer sees the full management list; do not add a permission policy here.

  lifecycle begins with empty and a fallback config tool. POST /search_tools
  creates a same-name database override; capture the generated search_tool_id
  separately for each gateway and use it in later paths. The create response is
  unmasked. A subsequent named search uses the new key; PUT
  /search_tools/{search_tool_id} changes the key and description, preserves the
  creation time and refreshes the next search. DELETE restores the config tool;
  another search uses its key and GET/PUT/DELETE of the deleted id each returns
  the handled 404 detail. The only management paths additionally exercised here
  are GET /search_tools/list and POST /search_tools/test_connection; their seven-path
  registration, /search_tools/ui/available_providers, no-database and invalid-body
  cases remain with B3275/B8673. supported-db-objects excludes search_tools using
  B8380's general_settings.supported_db_objects: a successful write still appears
  in management reads but leaves the existing config router list and subsequent
  search unchanged. Preserve commit-then-refresh order; no encompassing transaction.

  The fixture and capture support should need about 500 implementation/fuzz lines
  plus adjacent tests and compact case files. Those files add no new LiteLLM
  algorithm and fit one task; do not expand scope to repair a predecessor's
  handler, provider registry, router constructor or mount.
scope:
  paths:
    - tools/postgres-fixture/src/search_tools.rs
    - tools/postgres-fixture/src/search_tools/**
    - tools/postgres-fixture/fixtures/search-tools/**
    - tools/oracle/src/search_http.rs
    - tools/oracle/src/search_http/**
    - tools/oracle/cases/search-parity/**
    - tools/oracle/fuzz/fuzz_targets/search_case.rs
    - tools/oracle/fuzz/corpus/search_case/**
  lint_tables: false
