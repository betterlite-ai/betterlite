oracle_cases: []

deviations:
  - what: "_http_request returns None but send_request reads res.status_code without a null check, which would raise AttributeError in production. This is live LiteLLM code that relies on an undocumented precondition. betterlite must choose: fix the precondition silently (send_request always receives a response), document the bug as a known difference, or port the code as-is and let callers fail."
    why: The source has a latent defect that surfaces only if _http_request returns None for a non-POST method or if an internal exception bypasses the POST path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/deepeval/api.py#L81-L98

out_of_scope:
  - DEEPEVAL_BASE_URL at api.py:10 has no caller at the pin.
  - DEEPEVAL_BASE_URL_EU at api.py:11 has no caller at the pin.
  - API_BASE_URL_EU at api.py:13 has no caller at the pin.
  - retryable_exceptions at api.py:14 has no caller at the pin.
  - log_retry_error function at api.py:23-29 has no callers at the pinned commit.
  - Unused HttpMethods enum variants (GET, DELETE, PUT) are declarations only.
  - Unused Endpoints enum variants (DATASET_ENDPOINT, TEST_RUN_ENDPOINT, EVENT_ENDPOINT, FEEDBACK_ENDPOINT, PROMPT_ENDPOINT, RECOMMEND_ENDPOINT, EVALUATE_ENDPOINT, GUARD_ENDPOINT, GUARDRAILS_ENDPOINT, BASELINE_ATTACKS_ENDPOINT) are declarations only.

pitfalls:
  - LITELM_ENVIRONMENT is misspelled (missing an L); it should be read and validated exactly as spelled.
  - _http_request does not return a response object on POST success, only raises on error; send_request must access res.status_code on a None return, which is a latent bug in the source.
  - to_zod_compatible_iso must replace "+00:00" with "Z" to match DeepEval's expected format.
  - _create_base_api_span falls back to uuid4() for both id and trace_id when standard_logging_object lacks them.
  - Error span output uses error_string from standard_logging_object, not exception type or message; error_string may be an empty string.
  - _prepare_trace_api uses Pydantic by_alias=True and exclude_none=True serialization; field aliases map snake_case to camelCase (traceUuid, startTime, etc.).

