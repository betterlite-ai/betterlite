id: B3972
title: DeepEval trace records and Confident API delivery
description: >-
  Build DeepEval's span/trace payloads and synchronous/asynchronous delivery
  to the Confident API. DeepEvalLogger wraps each success or failure callback
  as a single-span trace with LLM span type, extracting usage, output and
  error strings from the standard_logging_object. The Api class sends POST
  requests to /v1/tracing with UTC millisecond timestamps.

  Preserve the misspelled LITELM_ENVIRONMENT setting (not LITELLM_ENVIRONMENT)
  with validation against {production, development, staging}. In success cases,
  extract output from choices[0].message.content (falling back to NO_OUTPUT).
  In failure cases, extract error_string from standard_logging_object. Sync
  send_request returns None from _http_request and raises on non-200 status;
  async a_send_request does not re-check status before returning.

  Environment defaults to development. API base is https://api.confident-ai.com.
  UTC timestamps use ISO 8601 millisecond precision with Z suffix via
  to_zod_compatible_iso. Trace UUID falls back to uuid.uuid4() when not
  present in standard_logging_object. The base API span name is
  litellm_success_callback or litellm_failure_callback.

