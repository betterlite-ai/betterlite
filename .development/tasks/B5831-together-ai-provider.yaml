deviations:
  - what: The fallback rerank id, the global drop_params flag, the catalog answers and the env tier limits arrive as arguments, not process globals.
    why: Provider modules take clocks, ids and settings from the caller, so tests need no process state.
out_of_scope:
  - B668 and B503 own the OpenAI chat base the Together config extends, including map_openai_params, the base supported list and the base message transform.
  - B2221 owns supports_function_calling, supports_response_schema and supports_reasoning, and B323 owns declared_reasoning_efforts_for_model. This task takes their answers through a trait and never calls them.
  - B2237 owns OpenAITextCompletionConfig, the shared prompt projection and the token-list check, and B2238 its transport. Selecting TogetherAITextCompletionConfig for the TOGETHER_AI provider (utils.py L9281-L9292) is B2237.
  - B1079 owns the rerank entry point, the Together key order (TOGETHERAI_API_KEY and the globals), the https://api.together.ai/v1 base default and the "TogetherAI API key is required" error. B2454 owns the HTTP send.
  - B1686 owns the cost dispatch condition (cost_calculator.py L1777-L1780) and the pricing that runs on the category name this task returns.
  - completion/handler.py is a docstring and chat/__init__.py, embed.py hold only the TogetherAIConfig alias of TogetherAIChatConfig, so there is no logic to build. Together embeddings run through the OpenAI embeddings path (main.py L6502-L6508), owned by B024.
  - Together credentials (TOGETHER_AI_API_KEY, TOGETHER_AI_TOKEN, TOGETHERAI_API_KEY, TOGETHER_AI_API_BASE) are resolved in get_llm_provider_logic.py, owned by B174.
  - _complete_together_ai in main.py belongs to B8310, which wires dispatch and adds the HTTP cases; the ProviderConfigManager entry for TogetherAIChatConfig is B2230's selection. This task touches neither dispatch file.
pitfalls:
  - The unsupported-params error for a false verdict has status 500, not 400, and lists only the tool params that were actually passed, joined with ", ".
  - A missing catalog entry (verdict None) never fails; it logs a warning and sends the params on, so only an entry that says false can drop or reject.
  - The check function failing is not the same as it returning false; a failure is logged at debug and the registry flag is still consulted.
  - map_openai_params reads reasoning_effort from the base result, and the base only keeps it when the overridden supported list contains it, so a non-reasoning model never reaches the payload step.
  - The payload is applied with setdefault, so a reasoning key the caller already set survives; reasoning_effort itself is removed first, so a "default" effort leaves neither key behind.
  - 'effort "none" on a gpt-oss model becomes "low", but on every other model it becomes reasoning with enabled false and never reaches the declared-effort check.'
  - DeepSeek-V4-Pro sends the effort unchanged when the catalog declares it; the High and Max table only applies when the declaration lacks it.
  - The assistant field strip keeps reasoning_content on purpose; stripping it would break preserved thinking.
  - Both meta.billed_units and meta.tokens get the whole usage object, so an extra key like prompt_tokens shows up in both.
  - A rerank result with a falsy document object (empty map) has no document key at all, not an empty one.
  - The max_chunks_per_doc refusal happens after the body build and before the async branch, so it also fails async calls.
  - '\d+b matches the first digits directly followed by b, so llama-3-70b-chat is 70 billion, and a name like mixtral-8x7b is 7, not 56.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
