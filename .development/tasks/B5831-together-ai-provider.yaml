dod:
  - text: Assistant messages lose only thinking_blocks and provider_specific_fields, and reasoning_effort is advertised only for Together reasoning models.
    proof: [together-chat-tests, oracle]
  - text: Tool params and response_format follow the verdict rules for true, unknown and false with and without drop_params, with the exact status 500 error.
    proof: [together-chat-tests, oracle]
  - text: Reasoning effort is rewritten per model family, with setdefault so a caller-set key wins.
    proof: [together-chat-tests, oracle]
  - text: The text completion prompt accepts one string and rejects token arrays and multiple prompts with the pinned messages.
    proof: [together-completion-tests, oracle]
  - text: The rerank request body, URL and headers match the handler, and max_chunks_per_doc is refused after the body is built.
    proof: [together-rerank-tests, oracle]
  - text: The rerank reply copies usage into both meta blocks, validates results and keeps a document only when it is truthy.
    proof: [together-rerank-tests, oracle]
  - text: Model names map to the billions and millions price categories at each boundary, and a model with a registry price is left alone.
    proof: [together-cost-tests, oracle]
  - text: The new oracle cases exist and call this task's helper.
    proof: [together-cases]
checks:
  optional: [mutants]
  commands:
    - id: together-chat-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^together_ai_chat::/)'
      why: A plain OpenAI chat passthrough keeps assistant internal fields, never drops tools by verdict and never rewrites reasoning_effort.
    - id: together-completion-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^together_ai_completion::/)'
      why: The OpenAI text completion base accepts token arrays and prompt lists that Together refuses.
    - id: together-rerank-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^together_ai_rerank::/)'
      why: The generic rerank path neither copies usage into both meta blocks nor refuses max_chunks_per_doc.
    - id: together-cost-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^together_ai_cost::/)'
      why: Without these helpers a Together model with no catalog price has no size category to price by.
    - id: together-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/together-ai)" && /usr/bin/grep -rlE '^  b5831:' tools/oracle/cases/helpers/together-ai
      why: Without cases that call the b5831 helper nothing compares these transforms with LiteLLM.
