id: B5831
title: Together AI chat options, text completion, rerank and size-tier pricing names
description: >-
  Build four pure modules in betterlite-openai: together_ai_chat, together_ai_completion, together_ai_rerank and
  together_ai_cost. They cover litellm/llms/together_ai/** (chat/transformation.py, completion/transformation.py,
  rerank/transformation.py, rerank/handler.py, cost_calculator.py). Nothing here does HTTP, reads an env var, reads the
  process clock or looks the model catalog up. The caller passes keys, bases and every catalog answer in. B8310 wires the
  modules into dispatch and adds the HTTP cases.

  together_ai_chat. TogetherAIChatConfig extends the OpenAI chat base, so B668 (option policy, map_openai_params) and
  B503 (message transform) do the rest. This task adds four overrides. (1) Message transform: before B503's message
  transform runs, every assistant message loses the keys thinking_blocks and provider_specific_fields (and only those;
  reasoning_content stays, Together reads it back). Other roles and messages without those keys are returned as they are.
  (2) Supported options: the B668 list for the model, plus reasoning_effort appended last when the model supports Together
  reasoning. That is true when the model is in ADJUSTABLE_EFFORT_REASONING_MODELS {openai/gpt-oss-120b, openai/gpt-oss-20b},
  or in HYBRID_REASONING_MODELS {MiniMaxAI/MiniMax-M3, Qwen/Qwen3.5-9B, Qwen/Qwen3.6-Plus, deepseek-ai/DeepSeek-V4-Pro,
  moonshotai/Kimi-K3, nvidia/nemotron-3-ultra-550b-a55b, zai-org/GLM-5.2}, or starts with deepseek-ai/DeepSeek-V4-Pro,
  or the caller's capability answer for supports_reasoning(model, together_ai) is true. (3) Option mapping: run B668's
  map_openai_params first (it asks the overridden supported list), then three steps on its result, in this order.
  Tool params: of tools, tool_choice, function_call (in that order) take those present. If none are present nothing
  happens. Ask the function-calling verdict (below). True keeps them. Unknown (None) logs a warning and keeps them. False
  with drop_params (the argument or the global litellm.drop_params) logs a warning and removes them. False without it
  fails with UnsupportedParamsError, status 500, message "together_ai does not support parameters: tools, tool_choice, for
  model=<model>. To drop it from the call, set `litellm.drop_params = True`." (the names joined with ", ", only the
  present ones). response_format: absent does nothing. The structured-output verdict works the same way (True keeps, None
  warns and keeps, False drops with a warning or fails with the same error shape naming response_format). Reasoning
  effort: if reasoning_effort is present and a string, remove it and add the keys of the payload below with
  setdefault, so a key the caller already set (for example reasoning) wins. A non-string value is left untouched.
  (4) The verdict. For a flag (supports_function_calling or supports_response_schema) the caller answers through a small
  trait: check(flag, model) -> Result<bool, LookupFailed> and registry_flag(flag, model) -> Option<bool>, the second
  being the value stored on the catalog entry under key "together_ai/<model>" (only a stored false matters). The verdict
  is True when check returns true. A failed check is logged at debug ("Error checking together_ai <flag> for <model>:
  <error>") and falls through. Otherwise it is False when registry_flag is exactly false, else None. Do not call the
  catalog or B2221 from inside this module; B2221 supplies the trait's answers.

  Reasoning payload for a string effort: "default" gives nothing. A model in ADJUSTABLE_EFFORT_REASONING_MODELS gives
  {reasoning_effort: X} where X is "low" for "none" (log at debug that none maps to low) and otherwise
  EFFORT_TRANSLATION {minimal: low, xhigh: high, max: high} applied, unknown values kept. Any other model with effort
  "none" gives {reasoning: {enabled: false}}. Else if the effort is in the model's declared efforts (the trait's
  declared_reasoning_efforts(model, together_ai), None counts as empty) it gives {reasoning_effort: effort} unchanged.
  Else a model starting with deepseek-ai/DeepSeek-V4-Pro gives {reasoning_effort: HIGH_MAX_EFFORT_TRANSLATION {minimal:
  high, low: high, medium: high, xhigh: max} applied, others kept}. Else {reasoning_effort: EFFORT_TRANSLATION applied}.
  B323 owns the declared-efforts function; this module only takes its answer through the trait.

  together_ai_completion. TogetherAITextCompletionConfig extends B2237's text completion config. Its prompt projection
  calls B2237's shared prompt projection and then: a list that is all integers or all lists of integers (B2237's token
  check) fails with the error "TogetherAI does not support integers as input"; a list of exactly one string becomes that
  string; any other list (including the empty list) fails with "TogetherAI does not support multiple prompts."; a plain
  string is kept. Both failures are ValueError in LiteLLM; return a typed error that the caller maps the same way B2237
  maps its own. transform_text_completion_request returns {model, prompt, then optional_params overlaid}, so an
  optional_params key named model or prompt replaces the value. Headers are ignored.

  together_ai_rerank. Pure replacement for TogetherAIRerank.rerank and TogetherAIRerankConfig. request(model, query,
  documents, top_n, rank_fields, return_documents, max_chunks_per_doc, api_key, api_base) first builds the body with
  keys in the order model, query, top_n, documents, rank_fields, return_documents and drops every None
  (return_documents defaults to true when the caller supplies none). Then, when max_chunks_per_doc is not None, it fails
  with "TogetherAI does not support max_chunks_per_doc" (the check comes after the body build, before anything is sent).
  It returns the URL api_base with every trailing "/" removed plus "/rerank", and the headers accept: application/json,
  content-type: application/json, authorization: Bearer <api_key> (names lowercase). The caller already resolved key and
  base (B1079 owns the key order and the https://api.together.ai/v1 default) and sends the request. decode_response(status,
  text) fails with the raw response text as the message when the status is not 200 (LiteLLM raises a bare Exception, so
  no status class; keep that). On 200 the caller hands over the parsed JSON object and the transform returns the reply: id
  is the response id when truthy, else an injected UUID string; meta.billed_units and meta.tokens are each a full copy
  of the response usage object (every key, not only the known ones; an absent usage is an empty object); results missing
  entirely fails with "No results found in the response=<response>"; a result without index or relevance_score fails with
  "Missing required fields in the result=<result>"; index becomes an integer and relevance_score a float; a truthy document
  object becomes {text: its text as a string, "" when absent} and a falsy one is left out of that result.

  together_ai_cost. Name-only helpers the cost dispatch (B1686) calls before it prices; they return a model name, not
  a cost. model_has_registry_pricing(model, cost_map) strips one leading "together_ai/" and is true when the cost map entry
  "together_ai/<stripped>" is a map that has the key input_cost_per_token. Take the cost map through a one-method trait
  the caller implements (is the entry a map holding this key); do not read the catalog here. pricing_category(model,
  call_type, tiers) lowercases the name. For call_type embedding or aembedding it takes the first match of \d+m in the
  lowercased name as millions; at most tiers.embedding_150_m gives together-ai-embedding-up-to-150m, at most
  tiers.embedding_350_m gives together-ai-embedding-151m-to-350m, and anything above or no match gives the lowercased name.
  For any other call type it takes the first match of \d+b as billions; at most 4 gives together-ai-up-to-4b, at most 8
  gives together-ai-4.1b-8b, at most 21 gives together-ai-8.1b-21b, at most 41 gives together-ai-21.1b-41b, at most 80
  gives together-ai-41.1b-80b, at most 110 gives together-ai-81.1b-110b, and above 110 or no match gives the lowercased
  name. TogetherPricingTiers holds the limits the caller reads from env: TOGETHER_AI_4_B (4), TOGETHER_AI_8_B (8),
  TOGETHER_AI_21_B (21), TOGETHER_AI_41_B (41), TOGETHER_AI_80_B (80), TOGETHER_AI_110_B (110),
  TOGETHER_AI_EMBEDDING_150_M (150), TOGETHER_AI_EMBEDDING_350_M (350). Tiers are plain integer fields with these
  defaults; the env read is the caller's. The cost dispatch calls these only when the model contains "togethercomputer"
  or "together_ai", or the provider is together_ai, and model_has_registry_pricing is false; that condition is B1686's.

  The five LiteLLM files hold about 330 nonblank, non-comment lines. Tests are rstest rows named after the behavior. The
  oracle helper b5831 replays the pinned TogetherAIChatConfig methods, TogetherAITextCompletionConfig, the rerank
  transform and the cost helpers; it may accept a model_cost map that it installs for the call, so registry-flag and
  declared-effort cases (which no live catalog row covers) can be written.
