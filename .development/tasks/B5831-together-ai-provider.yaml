  - tools/oracle/cases/helpers/together-ai/strip-assistant-internal-fields.yaml
  - tools/oracle/cases/helpers/together-ai/supported-params-reasoning-models.yaml
  - tools/oracle/cases/helpers/together-ai/tools-verdict-true-unknown.yaml
  - tools/oracle/cases/helpers/together-ai/tools-registry-false-drop.yaml
  - tools/oracle/cases/helpers/together-ai/tools-registry-false-error.yaml
  - tools/oracle/cases/helpers/together-ai/response-format-verdicts.yaml
  - tools/oracle/cases/helpers/together-ai/reasoning-adjustable-models.yaml
  - tools/oracle/cases/helpers/together-ai/reasoning-none-and-declared.yaml
  - tools/oracle/cases/helpers/together-ai/reasoning-deepseek-v4-pro.yaml
  - tools/oracle/cases/helpers/together-ai/reasoning-caller-key-wins.yaml
  - tools/oracle/cases/helpers/together-ai/completion-prompt-rules.yaml
  - tools/oracle/cases/helpers/together-ai/completion-request-overlay.yaml
