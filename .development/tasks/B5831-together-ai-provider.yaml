    - crates/betterlite-openai/src/together_ai_chat.rs
    - crates/betterlite-openai/src/together_ai_chat/**
    - crates/betterlite-openai/src/together_ai_completion.rs
    - crates/betterlite-openai/src/together_ai_completion/**
    - crates/betterlite-openai/src/together_ai_rerank.rs
    - crates/betterlite-openai/src/together_ai_rerank/**
    - crates/betterlite-openai/src/together_ai_cost.rs
    - crates/betterlite-openai/src/together_ai_cost/**
    - tools/oracle/cases/helpers/together-ai/**
    - tools/oracle/helpers/b5831.py
    - tools/oracle/helpers/b5831/**
    - tools/oracle/src/helpers/openai/b5831.rs
    - tools/oracle/src/helpers/openai/b5831/**
  lint_tables: false
