  - tools/oracle/cases/guardrails/admin-reads/list-v2-no-database.yaml
  - tools/oracle/cases/guardrails/admin-reads/info-config-found.yaml
  - tools/oracle/cases/guardrails/admin-reads/info-alias-found.yaml
  - tools/oracle/cases/guardrails/admin-reads/info-not-found.yaml
  - tools/oracle/cases/guardrails/admin-reads/add-settings-body.yaml
  - tools/oracle/cases/guardrails/admin-reads/provider-params-body.yaml
  - tools/oracle/cases/guardrails/admin-reads/auth-required.yaml
  - tools/oracle/cases/guardrails/admin-mutations/create-no-key.yaml
