id: B801
title: Team metadata validation and shared row access
description: >-
  Build the team_fields module's shared row/cache helpers and metadata validation. B1231 already owns
  TeamPatch, member/budget requests, TeamMetadataFieldSchema and TeamEditAccess variants; consume them
  without duplicating their identifier/duration validators. Own TeamMetadataRequester (nullable user_id,
  user_email, user_role), TeamMetadataValidationPayload (required create/update operation, metadata and
  requester; existing_metadata/team_id/team_alias=None) and TeamMetadataValidationResult (required
  valid, error_message=None). Registries start with no validator and empty schema, support replacement
  and clearing, and are injected state rather than globals. Their getters return the current values.

  general_settings.custom_team_metadata_validate defaults None; B165 loads a configured async Python
  callable through get_instance_fn and installs it during startup. A missing callable/bridge is a
  startup error, never successful validation. general_settings.team_metadata_schema defaults None:
  parse None as (), otherwise validate B1231's fields, preserving order, and reject duplicate keys
  with sorted unique key names in team_metadata_schema contains duplicate keys. Malformed schemas
  fail config loading. This schema describes metadata for clients; it is not itself an automatic
  validation of every team's metadata value.

  With no registered validator, return before reading settings or constructing a payload. Otherwise
  only dict metadata survives (other mappings become {}), only dict existing_metadata survives
  (other mappings become None), and requester carries the caller role's string value or None.
  Accept async functions and async __call__ objects; a synchronous callable is HTTP 500 with
  custom_team_metadata_validate must be an async function, outside the guarded invocation.
  Await and validate the result inside the timeout: timeout, raised exceptions and malformed result
  all become HTTP 503 with the configured unavailable message, without leaking callback exceptions.
  valid=false is HTTP 400 with a truthy callback error_message or Team metadata failed validation.
  valid=true ignores error_message. These HTTPException details are {error: message}; caller routes
  retain their own error conversion. The sole premium_user gate is omitted as the deviation below.

  general_settings.team_metadata_validation_timeout defaults to 5 seconds. A positive integer or
  float is accepted, except bool; None, zero, negative, strings and NaN use 5. Positive infinity
  means no finite deadline in the source; represent it without a floating money type. The unavailable
  message defaults to Team metadata validation is currently unavailable, so the team was not saved.
  Contact your proxy admin. A nonblank string overrides it without stripping surrounding spaces;
  empty/whitespace-only/non-string values use the default. These are real fallbacks, not int() reads.

  Native row contracts replace the owned Python Protocol/cast wrappers; _as_object/_as_list preserve
  values and row order. Accessors select B722 tokens, B723 user/organization/membership, B724 teams,
  B725 models/budgets and B726 team-membership/deleted-team/access-group tables, using the caller's
  transaction for _team_tx_db. _sanitize_for_log tries str then repr and removes ALL CR/LF characters.
  _refresh_cached_team validates the returned row as B859 LiteLLM_TeamTableCachedObj and calls
  B734._cache_team_object with its actual team_id; conversion/cache failures propagate. _general_settings
  validates a string-keyed map; it does not silently turn malformed settings into {}. _caller_edit_access
  yields unrestricted for proxy/org admin, none for no role, and for team admin consumes B1200's
  supported editable-fields policy: empty becomes disabled, otherwise return sorted editable_fields.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/team_metadata_validation.py:
  TeamMetadataValidator.__call__ (L57-L57; 1 source lines), TeamMetadataValidatorRegistry.__init__ (L61-L62;
  2 source lines), TeamMetadataValidatorRegistry.set (L64-L65; 2 source lines), TeamMetadataValidatorRegistry.get
  (L67-L68; 2 source lines), parse_team_metadata_schema (L78-L87; 10 source lines), TeamMetadataSchemaRegistry.__init__
  (L91-L92; 2 source lines), TeamMetadataSchemaRegistry.set (L94-L95; 2 source lines), TeamMetadataSchemaRegistry.get
  (L97-L98; 2 source lines), run_team_metadata_validation (L104-L139; 34 source lines), _read_timeout_seconds
  (L142-L146; 5 source lines), _read_unavailable_message (L149-L153; 5 source lines), validate_team_metadata_if_configured
  (L156-L189; 32 source lines). litellm/proxy/management_endpoints/team_endpoints.py: _as_object (L238-L239;
  2 source lines), _as_list (L242-L245; 4 source lines), _UserIdRow.user_id (L250-L250; 1 source lines),
  _user_id_rows_db (L253-L254; 2 source lines), _ModelDumpRow.model_dump (L258-L258; 1 source lines),
  _TeamIdRow.team_id (L263-L263; 1 source lines), _ObjectPermissionRow.object_permission_id (L271-L271;
  1 source lines), _TeamAliasBudgetRow.team_alias (L276-L276; 1 source lines), _TeamAliasBudgetRow.budget_duration
  (L279-L279; 1 source lines), _AuditableTeamRow.json (L287-L287; 1 source lines), _RawTeamRow.members_with_roles
  (L292-L294; 3 source lines), _RawTeamRow.organization_id (L297-L297; 1 source lines), _RawTeamRow.max_budget
  (L300-L300; 1 source lines), _RawTeamRow.soft_budget (L303-L303; 1 source lines), _RawTeamRow.model_id
  (L306-L306; 1 source lines), _raw_team_db (L309-L312; 4 source lines), _BudgetIdRow.budget_id (L317-L317;
  1 source lines), _BudgetWriteCall.__call__ (L321-L321; 1 source lines), _as_budget_write (L324-L325;
  2 source lines), _TeamCreateTx.litellm_teamtable (L362-L362; 1 source lines), _MemberDeleteTx.litellm_usertable
  (L374-L374; 1 source lines), _MemberDeleteTx.litellm_verificationtoken (L377-L377; 1 source lines),
  _TeamDeleteTx.execute_raw (L381-L381; 1 source lines), _TeamDeleteTx.litellm_teamtable (L384-L384; 1
  source lines), _TeamDeleteTx.litellm_teammembership (L387-L387; 1 source lines), _team_db (L397-L398;
  2 source lines), _team_tx_db (L401-L404; 4 source lines), _team_membership_db (L407-L408; 2 source lines),
  _user_db (L411-L412; 2 source lines), _model_db (L415-L416; 2 source lines), _org_db (L419-L420; 2 source
  lines), _org_membership_db (L423-L426; 4 source lines), _budget_db (L429-L430; 2 source lines), _deleted_team_db
  (L433-L434; 2 source lines), _access_group_db (L437-L438; 2 source lines), _tokens_db (L441-L442; 2
  source lines), _sanitize_for_log (L445-L451; 7 source lines), _refresh_cached_team (L454-L478; 23 source
  lines), _general_settings (L484-L487; 3 source lines), _caller_edit_access (L490-L505; 16 source lines).


  Load these four general_settings keys through B002; B1200 remains the config owner of editable fields.


  B856 Management::teams dispatches team_fields to the production validators and the original Python
  helpers. Seed B171's helper_case with timeout, message and schema projections; do not make its adapter
  call the cache-refresh accessor or later team routes.


  Config tests metadata_settings_loaded, timeout_positive, timeout_wrong_type, timeout_nonpositive,
  timeout_nonfinite, unavailable_message_spaces, unavailable_message_default, schema_missing,
  schema_invalid, schema_duplicates and callable_resolution exercise the production loader and its
  consumed values. Existing config_yaml parsing owns outside bytes; these functions transform typed values.


  Sizing: 210 nonblank, noncomment owned function lines, plus metadata record declarations; allow
  240 production, 300 behavior/config tests, 90 helper adapters and 80 configuration/wiring lines,
  710 within a 750-line gate.


  Native-only deviation test in this production module: metadata_without_license.
  Prove metadata validation can run without premium_user while retaining required/type/allowed-value
  errors; the license-bypass result is intentionally absent from MIT equality cases.
