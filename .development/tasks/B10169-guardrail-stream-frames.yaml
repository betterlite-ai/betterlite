out_of_scope:
  - "HTTP evidence: B8993 runs the Anthropic and Responses stream cases and B8992 the Google and A2A ones. No route reaches the stream hook before B8632, and B3676's helper cases already compare the Bytes rewrite itself with LiteLLM (tools/oracle/cases/helpers/anthropic-guardrail-streaming)."
  - "The bridge between the generator's stream_chunks::StreamItem and this item type: B8632. The wrapper chain and the pipeline gate over StreamItem: B6370. ExecuteSteps over StreamItem: B3247."
  - "SSE parsing: iter_sse_events and B3676's rewrite are unchanged and keep the anthropic_sse_events fuzz target; this task adds no decoder of outside bytes."
  - "Core's StreamTranslation (streaming_rewrite/traits.rs L99-126) and the guardrails crate's BaseTranslation port the same LiteLLM class twice; both only change their item type here."
  - "Other copies of Python's errors=\"replace\" decoder outside these modules, such as betterlite-vertex google_genai_guardrail/sse.rs L6, betterlite-guardrails headroom/text.rs L1 and betterlite-core api/assistant_records/error.rs L263, stay."
  - "B6164's chunk helpers (unified_dispatch/stream_items.rs, transform_chunk.rs) keep reading GuardrailValue; the loop hands them the value inside a Json item."
pitfalls:
  - "A Json(Text) item is a str frame: the Anthropic adapter and its end check must both leave it out, and only Bytes carries a raw frame there."
  - "Error items must be Bytes, because the generator reads a str item that starts with \"data: \" as an error message and ends the stream (proxy_server.py L10014-L10018)."
  - "write_chunks must leave an Other slot as it was; writing an empty object over it drops a str frame from the stream."
  - "A Bytes slot in a Responses stream stays in the event list as Null; dropping it shifts every rewrite after it by one position."
  - "release_original_chunks restores a clone taken before the translation ran, so the clone must hold the Bytes items too."
  - "Only guardrail_message_scope.rs changes for the move; the 46 files that import guardrail_message_scope::StreamItem keep their imports."
  - "decode_replacing_invalid keeps one U+FFFD per invalid sequence, and clippy.toml bans String::from_utf8_lossy."
  - "In the incremental loop a Bytes item must never become last_chunk or a round's reference, since build_transform_chunk copies the reference chunk's fields."
  - "B8665 also edits unified_guardrail/translation.rs to add an OCR arm, so keep the stream methods in the forward_fallible! and each_variant! forwarding and change only their types."
