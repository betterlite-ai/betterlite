dod:
  - text: A raw Anthropic frame is scanned and rewritten in place as Bytes, a str frame is left alone, and the stream end check reads items through the same conversion.
    proof: [adapter-frame-tests, stream-end-frame-tests, one-item-type]
  - text: The Chat and Anthropic error items are Bytes frames, a Bytes first item infers no call type, a2a_request_id skips Bytes, and the emit path returns the translation's items unchanged.
    proof: [adapter-frame-tests, dispatch-raw-tests]
  - text: The B6260 hook carries Bytes items in place through pass-through, scanning, blocks and HTTP errors, and its original_response holds the decoded text; the incremental loop never sends a Bytes item.
    proof: [hook-frame-tests, incremental-bytes-tests, item-value-tests]
  - text: The core rewrite step hands Bytes items to the translation in place and restores them after an undeliverable rewrite.
    proof: [core-bytes-tests]
  - text: A2A skips Bytes items and keeps them, and Google scans a Bytes frame as text decoded with replacement.
    proof: [a2a-bytes-tests, google-bytes-tests]
  - text: StreamItem is defined once, in betterlite-core, no stream list of GuardrailValue is left in the contract, the step, the emit and registry functions, the adapters or the loops, and the server's two decoder copies are gone.
    proof: [one-item-type, old-shapes-gone]
  - text: The owners' tests and the b3246, b3679 and b6163 helper cases still pass.
    proof: [translation-contract-tests, scope-tests, dispatch-tests, unified-chat-tests, stream-loop-tests, adapter-tests, core-bytes-tests, streaming-oracle, dispatch-oracle, a2a-oracle]
checks:
  optional: [mutants]
  commands:
    - id: core-bytes-tests
      why: the rewrite step drops, moves or changes a Bytes item, or a B3246 rewrite test broke
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::streaming_rewrite::tests::bytes_/)' && cargo nextest run --locked -p betterlite-core -p betterlite-server --no-tests=fail -E 'test(streaming_rewrite)'
    - id: item-value-tests
      why: a Bytes frame is not decoded with one U+FFFD per invalid sequence, or a Json item does not come back as it was
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_message_scope::stream_chunk_events::tests::item_value_/)'
    - id: dispatch-raw-tests
      why: a Bytes item infers a call type, gives an A2A id, or the emit path rewrites the translation's error items
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^unified_dispatch::tests::raw_/)'
    - id: adapter-frame-tests
      why: an Anthropic Bytes frame is not scanned or not rewritten in place, a str frame is scanned, an error item is not Bytes, or a Responses Bytes slot moves
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_chat::.*::tests::stream_raw_frame_/)'
    - id: a2a-bytes-tests
      why: the A2A stream reads or drops a Bytes item
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::a2a_translation::stream::tests::bytes_/)'
    - id: google-bytes-tests
      why: the Google stream scan misses a Bytes frame or decodes it differently from errors="replace"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::other_adapters::google_genai::tests::google_genai_stream_bytes_/)'
    - id: hook-frame-tests
      why: the stream hook drops, moves or skips a Bytes item, or its block or error output loses the raw frames
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::tests::frames_/)'
    - id: stream-end-frame-tests
      why: the Anthropic end check reads a str frame or misses a Bytes one
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream_hook::stream_end::tests::frame_/)'
    - id: incremental-bytes-tests
      why: the incremental loop sends a Bytes item or drops it from responses_so_far
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_stream::run::tests::bytes_/)'
    - id: one-item-type
      why: StreamItem is still defined in betterlite-guardrails, a second item type or conversion exists, or a decoder copy is left
      run: >-
        grep -q 'pub enum StreamItem' crates/betterlite-core/src/guardrails/streaming_rewrite/shapes.rs &&
        grep -q 'pub use betterlite_core::guardrails::streaming_rewrite::shapes::StreamItem' crates/betterlite-guardrails/src/guardrail_message_scope.rs &&
        test -z "$(grep -n 'enum StreamItem' crates/betterlite-guardrails/src/guardrail_message_scope.rs)" &&
        grep -q 'pub fn stream_item_value' crates/betterlite-guardrails/src/guardrail_message_scope/stream_chunk_events.rs &&
        grep -q 'pub fn decode_replacing_invalid' crates/betterlite-guardrails/src/guardrail_message_scope/stream_chunk_events.rs &&
        grep -q 'pub fn stream_item_chunk' crates/betterlite-server/src/guardrails/anthropic_translation/sse_events.rs &&
        test -z "$(grep -nE 'fn (utf8_replacing_invalid|decoded_text|to_chunks|anthropic_chunk|frames_into_items)[(]' crates/betterlite-server/src/guardrails/anthropic_translation/sse_events.rs crates/betterlite-server/src/guardrails/anthropic_translation/process_stream/unended.rs crates/betterlite-server/src/guardrails/unified_chat.rs crates/betterlite-server/src/guardrails/unified_chat/anthropic.rs crates/betterlite-server/src/guardrails/unified_stream_hook/stream_end.rs)"
    - id: old-shapes-gone
      why: a stream list, a stream output or a first item is still a GuardrailValue in the contract, the step, emit, registry, an adapter or a loop
      run: >-
        test -z "$(grep -nE '\[GuardrailValue\]|Option<Vec<GuardrailValue>>|Item[(]GuardrailValue[)]|Item = Result<GuardrailValue|(responses_so_far|responses_yielded|withheld_items|pending_items|streaming_chunks|originals|assembled): (&[^ ]* )?(mut )?Vec<GuardrailValue>|first_item: Option<&GuardrailValue>|of_stream_item[(]item: &GuardrailValue'
        crates/betterlite-guardrails/src/guardrail_translation.rs
        crates/betterlite-guardrails/src/unified_dispatch/emit.rs
        crates/betterlite-guardrails/src/unified_dispatch/registry.rs
        crates/betterlite-core/src/guardrails/streaming_rewrite/step.rs
        crates/betterlite-core/src/guardrails/streaming_rewrite/traits.rs
        crates/betterlite-server/src/guardrails/unified_chat.rs
        crates/betterlite-server/src/guardrails/unified_chat/anthropic.rs
        crates/betterlite-server/src/guardrails/unified_chat/chat.rs
        crates/betterlite-server/src/guardrails/unified_chat/chat/support.rs
        crates/betterlite-server/src/guardrails/unified_chat/responses.rs
        crates/betterlite-server/src/guardrails/a2a_translation/stream.rs
        crates/betterlite-server/src/guardrails/a2a_translation/adapter.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/translation.rs
        crates/betterlite-server/src/guardrails/unified_guardrail/other_adapters/google_genai.rs
        crates/betterlite-server/src/guardrails/unified_stream.rs
        crates/betterlite-server/src/guardrails/unified_stream/run.rs
        crates/betterlite-server/src/guardrails/unified_stream/round.rs
        crates/betterlite-server/src/guardrails/unified_stream/inspect.rs
        crates/betterlite-server/src/guardrails/unified_stream_hook/run.rs
        crates/betterlite-server/src/guardrails/unified_stream_hook/block_only.rs
        crates/betterlite-server/src/guardrails/unified_stream_hook/stream_end.rs)"
    - id: translation-contract-tests
      why: the changed BaseTranslation defaults or the pass-through dispatch broke a B3661 contract test
