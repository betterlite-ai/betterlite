id: B10169
title: Stream guardrails keep raw frames
description: >-
  Stream guardrails cannot see raw frames. Every stream list that B3661's BaseTranslation, B3246's rewrite step, B3679's emit and registry functions and the B6260 and B6164 loops pass around is a list of GuardrailValue (crates/betterlite-config/src/sections/guardrail_identity/item.rs L8-17), and GuardrailValue has no bytes variant and no way to tell a bytes frame from a str frame. LiteLLM's stream guardrails get three kinds of item: a parsed object, a str and raw bytes. The /v1/messages stream yields bytes (AnthropicMessagesStreamingResponse.__anext__, streaming_iterator.py L375), Google's streamGenerateContent yields raw SSE, and the Chat and Anthropic handlers return their in-stream error frames as bytes. The Anthropic handler scans and rewrites dicts and bytes and leaves a str alone (handler.py L478-L494 and L1529-L1537), and the proxy generator passes bytes through but reads a str that starts with "data: " as an error message and stops (proxy_server.py L9955-L9986). On main a raw Anthropic frame is never scanned: the adapter's to_chunks (crates/betterlite-server/src/guardrails/unified_chat/anthropic.rs L187-199) turns every item that is not an object into SseChunk::Other, while the end check's anthropic_chunk (unified_stream_hook/stream_end.rs L51-69) turns a Text item into SseChunk::Bytes, so the scan and the end check disagree. frames_into_items (unified_chat.rs L116-123) makes the Chat and Anthropic error frames GuardrailValue::Text, a str item the generator would take for an error message.


  The lossless item exists already. B3663's `StreamItem { Json(GuardrailValue), Bytes(Vec<u8>) }` (crates/betterlite-guardrails/src/guardrail_message_scope.rs L16-20) holds a str frame as Json(Text) and a bytes frame as Bytes, and the raw-stream readers in anthropic_sse and stream_chunk_events already take it. B3246's step lives in betterlite-core and cannot import betterlite-guardrails, so the enum moves once, unchanged, into crates/betterlite-core/src/guardrails/streaming_rewrite/shapes.rs beside RequestData. guardrail_message_scope.rs replaces its definition with `pub use betterlite_core::guardrails::streaming_rewrite::shapes::StreamItem;`, so its 46 importers keep their path. No second item type is added.


  Signatures. Every stream list below becomes StreamItem, and nothing else in these functions changes. B3661 (guardrail_translation.rs L84-115): `process_streaming_response(&mut Vec<StreamItem>, ..)`, `get_streaming_scan_key(&[StreamItem])`, `build_block_sse_chunks(.., Option<&[StreamItem]>)` and `build_stream_error_items(..) -> Option<Vec<StreamItem>>`, forwarded by UnifiedTranslation's forward_fallible! and each_variant! arms (unified_guardrail/translation.rs L154-181). B3246 (streaming_rewrite/step.rs L11-37, traits.rs L118-125): `StreamingStep.streaming_chunks`, `release_original_chunks` and `StreamTranslation::process_streaming_response`. B3679 (unified_dispatch/emit.rs L33-189, registry.rs L34-97): `a2a_request_id`, `handle_streaming_block`, both lists in `StreamErrorEmission`, the items `emit_streaming_http_error` returns, `ResponseKind::of_stream_item` and the first_item of `resolve_endpoint_translation`. A Bytes item gives ResponseKind::Other, since _infer_call_type returns None for bytes (cost_calculator.py L1094-L1118). a2a_request_id skips it, since _get_a2a_request_id reads dicts and str only (unified_guardrail.py L123-L139), and the A2A error chunk is a Json object. B6260 and B6164: the source item of `run_streaming_iterator_hook` and of the incremental loop, `StreamOutput::Item(StreamItem)` (unified_stream.rs L14-19; BlockChunks stays), `StreamBuffers`, the Window lists in unified_stream_hook/block_only.rs L33-42, the lists in unified_stream/run.rs, round.rs and inspect.rs, and `StreamEndCheck::streaming_has_ended(&[StreamItem])`.


  Adapters. Anthropic: one conversion, `pub fn stream_item_chunk(item: &StreamItem) -> Result<SseChunk, serde_json::Error>` in crates/betterlite-server/src/guardrails/anthropic_translation/sse_events.rs, maps Json(Object) to Event, Bytes to Bytes and any other item to Other. The adapter and stream_end.rs both call it, and to_chunks and anthropic_chunk go. The adapter's write_chunks writes an Event back as Json(Object) and a Bytes chunk back as Bytes and leaves the Other slots alone; B3676's rewrite already edits Bytes chunks in place. Error items: frames_into_items goes, and the Chat and Anthropic adapters return their frames as StreamItem::Bytes, as LiteLLM does (anthropic_sse.py L135-L145, the OpenAI chat handler.py L720-L731). Chat: object_chunks and write_object_chunks (unified_chat/chat/support.rs L47-71) read and write the Json(Object) slots only, and get_streaming_scan_key hands its items on without the wrap at chat.rs L154-163. Responses (unified_chat/responses.rs): a Bytes slot goes into the event list as JsonValue::Null so positions stay aligned, and write_events writes back only the Json slots. A2A (a2a_translation/stream.rs): parse_streaming_responses reads Json(Object) and Json(Text) and skips Bytes, and a rewritten line stays Json(Text), as LiteLLM's handler does (a2a handler.py L312-L345). Google (unified_guardrail/other_adapters/google_genai.rs L125-136): every item goes through stream_item_value before `converted`, so a Bytes frame reaches accumulated_stream_text as text, as LiteLLM's _chunk_sse_text decodes bytes with errors="replace" (gemini handler.py L130-L148).


  Stream items as values. `pub fn stream_item_value(item: &StreamItem) -> GuardrailValue` goes in crates/betterlite-guardrails/src/guardrail_message_scope/stream_chunk_events.rs. A Json item gives its value, and a Bytes frame gives Text decoded by the module's decode_replacing_invalid, made pub here. It builds every GuardrailValue the loops make from stream items: original_response in block_only.rs L228, round.rs L157 and inspect.rs L33, the A2A responses_so_far context in a2a_translation/stream.rs L106-115, and the Google frames. LiteLLM keeps the raw bytes in original_response, and its blocked-usage reader decodes bytes and str the same way (base_llm/guardrail_translation/utils.py L13-L67), so decoded text reads the same. The server's two copies of that decoder, B3673's utf8_replacing_invalid (sse_events.rs L36-46) and B3676's decoded_text (anthropic_translation/process_stream/unended.rs L17-27), go, and their callers call decode_replacing_invalid.


  Incremental loop. B6164's loop runs only for the chat route, where no bytes item arrives. A Bytes item there joins responses_so_far and nothing else: it is never sent, never last_chunk and never a round's reference chunk. Json items keep today's path, and the chunk helpers keep reading the GuardrailValue inside. responses_yielded holds the sent items as StreamItem::Json so it can go to handle_streaming_block and StreamErrorEmission unchanged.


  Oracle helpers and old tests. The Rust sides of b3246 (tools/oracle/src/helpers/core_ops/b3246.rs and b3246/fakes.rs), b6163 (tools/oracle/src/helpers/server/b6163.rs) and b3679 (tools/oracle/src/helpers/guardrails/b3679/a2a.rs, emit.rs and resolution.rs) wrap their case items in StreamItem::Json and map results back with stream_item_value. Their cases, corpus and Python sides stay as they are and must still agree with LiteLLM. Existing tests that build GuardrailValue stream lists switch to StreamItem::Json the same way and keep their assertions.


  New tests. In crates/betterlite-core/src/guardrails/streaming_rewrite/tests.rs: bytes_item_reaches_the_translation_in_place, and bytes_item_survives_a_discarded_rewrite (an undeliverable rewrite restores the original list, Bytes item included). In stream_chunk_events/tests.rs: item_value_decodes_bytes_with_replacement (b"a\xffb" gives "a\u{FFFD}b") and item_value_returns_json_unchanged. In unified_dispatch/tests.rs: raw_bytes_first_item_infers_no_call_type, raw_a2a_request_id_skips_bytes (a Bytes frame holding {"id": "x"} before a Json object with id "y" gives "y") and raw_http_error_keeps_translation_bytes. In the anthropic, chat and responses tests of unified_chat, tests named stream_raw_frame_*: a Bytes text_delta frame is scanned; an ended-stream rewrite with deliver_ended_stream_rewrites lands in the same item, still Bytes; a Json(Text) item holding the same frame is neither scanned nor changed; the Chat and Anthropic error items are Bytes frames; a Bytes slot in a Responses stream comes back unchanged and the events around it are still rewritten. In a2a_translation/stream/tests.rs: bytes_items_are_skipped_and_kept. In other_adapters/google_genai/tests.rs: google_genai_stream_bytes_frames_are_scanned, with one invalid byte that reaches the guardrail as U+FFFD. In unified_stream_hook/tests.rs, tests named frames_*: Bytes and Json items pass through in order when no translation resolves; on the /v1/messages route a Bytes text frame reaches the guardrail; a block after a Bytes prefix ends with the translation's BlockChunks, and the original_response it gets holds each frame as decoded Text; an HTTP error after the first sent item ends with the Anthropic error frame as Item(StreamItem::Bytes). In unified_stream_hook/stream_end/tests.rs: frame_bytes_end_the_anthropic_stream and frame_text_does_not_end_the_anthropic_stream, since _check_streaming_has_ended reads bytes and dicts only (handler.py L1670-L1700). In unified_stream/run/tests.rs: bytes_item_is_never_sent.


  Downstream. B3247's ExecuteSteps.streaming_chunks, B6370's wrapper items and buffered list, and B8632's generator bridge take StreamItem from this task; their task files say so.
