id: B3102
title: Persist gateway request counts and expose deployment activity
description: >-
  Build the gateway request tracking system for deployment-wide analytics. This covers
  the accumulator that records request counts at the ASGI edge, database persistence
  with upsert logic, Redis-backed buffering for distributed deployments, and the HTTP
  endpoint that exposes activity by date and route.

  Define GatewayRequestKey (date, category, route) and GatewayRequestCounts (successful_requests,
  failed_requests) with a plus() method to fold counts. Create GatewayRequestSnapshot
  as a mapping of keys to counts, and response types GatewayRequestDailyEntry,
  GatewayRequestBreakdownEntry and GatewayRequestActivityResponse that mirror LiteLLM's
  wire format exactly.

  Implement GatewayRequestAccumulator to track in-memory counts from the request-metrics
  middleware: record() accepts a category, route and status code; drain() returns the
  snapshot and resets; restore() merges un-committed counts back on flush failure. The
  fold_counts() function sums counts key-wise, staying bounded by (date x category x route).

  Build build_gateway_requests_upsert() that generates a single INSERT ... ON CONFLICT DO UPDATE
  statement; rows are ordered by conflict key so concurrent writers lock in the same order
  and never deadlock. commit_gateway_requests_to_db() executes it.

  The GatewayRequestRedisBuffer distributes counts through Redis for multi-pod deployments.
  push() sends a worker's snapshot as JSON rows to a Redis list; pop() dequeues and folds
  them; commit_if_leader() acquires the job lock, pops, and writes if holding the lease.
  Failures re-queue to Redis; if re-queue fails, rows go back to the caller's accumulator.
  This mirrors the spend queue's at-least-once semantics: a dropped flush acknowledgement
  will recount, but availability wins over dedup.

  Implement flush_gateway_requests() as the scheduler entrypoint that drains the accumulator,
  pushes to Redis if buffering is on, and handles failures by restoring the snapshot. On
  shutdown (when redis_buffer is None) a departing worker writes its own counts directly.

  Expose GET /gateway/daily/activity as an admin-only endpoint (PROXY_ADMIN or
  PROXY_ADMIN_VIEW_ONLY roles required). Accept optional start_date and end_date query
  parameters in YYYY-MM-DD format; default to a 30-day lookback. Aggregate the
  LiteLLM_DailyGatewayRequests table by (date, category, route), fold into daily and
  route breakdowns, and return the activity response. Non-admin callers get HTTP 403.
