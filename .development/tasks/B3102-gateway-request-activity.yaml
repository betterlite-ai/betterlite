dod:
  - text: GatewayRequestKey is a hashable, comparable type with date, category and route fields (all strings).
    proof: [types-compile]
  - text: GatewayRequestCounts has successful_requests and failed_requests integer fields (both default to 0) and a plus() method that increments one field based on a success boolean.
    proof: [types-compile, counts-tests]
  - text: GatewayRequestBreakdownEntry has category, route, successful_requests (default 0) and failed_requests (default 0) fields matching LiteLLM's Pydantic model.
    proof: [types-compile, types-tests]
  - text: GatewayRequestDailyEntry has date, successful_requests (default 0) and failed_requests (default 0) fields and serializes to the wire format exactly.
    proof: [types-compile, types-tests]
  - text: GatewayRequestActivityResponse has total_successful_requests (0), total_failed_requests (0), by_date (empty tuple) and by_route (empty tuple) fields with correct Pydantic defaults.
    proof: [types-compile, types-tests]
  - text: GatewayRequestAccumulator.record() updates the in-memory counts for a (date, category, route) key, incrementing successful or failed based on status code 200-299.
    proof: [accumulator-tests]
  - text: GatewayRequestAccumulator.drain() returns the snapshot and resets the internal map to empty.
    proof: [accumulator-tests]
  - text: GatewayRequestAccumulator.restore() merges a snapshot's counts back into the map using fold_counts, with keys collapsing on collision.
    proof: [accumulator-tests]
  - text: fold_counts sums GatewayRequestCounts key-wise and returns a snapshot with entries bounded by the count of unique keys.
    proof: [fold-tests]
  - text: build_gateway_requests_upsert generates SQL with rows ordered by (date, category, route) to prevent deadlock, with numbered placeholders and correct type casts (::text, ::bigint).
    proof: [upsert-tests]
  - text: commit_gateway_requests_to_db executes the upsert and logs the number of rows committed.
    proof: [db-tests]
  - text: GatewayRequestRedisBuffer.push() serializes the snapshot to JSON rows and appends to the Redis buffer key; returns early if snapshot is empty.
    proof: [redis-tests]
  - text: GatewayRequestRedisBuffer.pop() dequeues entries from Redis in batches, deserializes JSON rows and folds them into one snapshot.
    proof: [redis-tests]
  - text: GatewayRequestRedisBuffer.commit_if_leader() acquires the job lock, pops buffered rows, commits them, and returns empty on success or un-committed rows on failure or lock loss.
    proof: [redis-tests]
  - text: GatewayRequestRedisBuffer handles push failure by re-queueing; handles re-queue failure by returning rows to the caller.
    proof: [redis-tests]
  - text: flush_gateway_requests drains the accumulator, pushes (or commits directly if no buffer), restores on exception, and never raises.
    proof: [flush-tests]
  - text: GET /gateway/daily/activity requires PROXY_ADMIN or PROXY_ADMIN_VIEW_ONLY role; non-admin returns 403 Forbidden.
    proof: [endpoint-auth]
  - text: GET /gateway/daily/activity defaults to 30 days of lookback from today; accepts optional start_date and end_date query params (YYYY-MM-DD format).
    proof: [endpoint-date-range]
  - text: GET /gateway/daily/activity aggregates by (date, category, route) from LiteLLM_DailyGatewayRequests, folds by date and route, and returns the activity response.
    proof: [endpoint-aggregation]
checks:
  optional: []
  commands:
    - id: types-compile
      why: Type definitions do not compile or have incorrect fields.
      run: cargo build --locked -p betterlite-db
    - id: types-tests
      why: Type fields, defaults or serialization do not match LiteLLM's wire format.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^gateway_requests::/)'
    - id: counts-tests
      why: GatewayRequestCounts.plus() does not correctly increment based on success status.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^gateway_request_counts::/)'
    - id: accumulator-tests
      why: GatewayRequestAccumulator record, drain or restore methods do not work correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^gateway_request_accumulator::/)'
    - id: fold-tests
      why: fold_counts does not correctly sum counts key-wise.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^fold_gateway_counts::/)'
    - id: upsert-tests
      why: build_gateway_requests_upsert generates incorrect SQL, wrong row order, or bad placeholders.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^gateway_requests_upsert::/)'
    - id: db-tests
      why: commit_gateway_requests_to_db does not execute the upsert or fails on empty snapshot.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^commit_gateway_requests::/)'
    - id: redis-tests
      why: GatewayRequestRedisBuffer push, pop, or commit_if_leader do not work or handle failures correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^gateway_request_redis::/)'
    - id: flush-tests
      why: flush_gateway_requests does not drain, restore on failure, or handle None buffer correctly.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^flush_gateway_requests::/)'
    - id: endpoint-auth
      why: GET /gateway/daily/activity does not enforce admin roles or returns wrong status code.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^management::gateway_request_activity::.*auth/)'
    - id: endpoint-date-range
      why: GET /gateway/daily/activity does not default to 30 days or does not parse date params.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^management::gateway_request_activity::.*date/)'
    - id: endpoint-aggregation
      why: GET /gateway/daily/activity does not aggregate by date and route or returns wrong format.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^management::gateway_request_activity::.*aggreg/)'
