deviations:
  - what: >-
      GatewayRequestSnapshot is a type alias for a trait object (Mapping or HashMap)
      that acts like a mapping but is not the exact type from Python.
    why: >-
      Rust does not have Python's duck typing; the snapshot uses a concrete HashMap or
      BTreeMap and implements the same interface.
  - what: >-
      At-least-once semantics mean a dropped flush acknowledgement will recount rows
      that are already persisted, causing a small overcount on rare connection failures.
    why: >-
      This mirrors LiteLLM's deliberate trade-off: availability matters more than dedup
      for a traffic metric, and the count is a gauge not a billing record.
out_of_scope:
  - Billing logic or spend tracking; gateway request counts are independent metrics for deployment activity only.
  - BillableCategory enum and the BillableRequestMetricsMiddleware that records status codes and routes; owned by B3889 (gateway_request_metrics middleware).
  - The LiteLLM_DailyGatewayRequests database schema; pre-existing from LiteLLM and handled by schema/migration tasks.
  - PodLockManager.acquire_lock and lease semantics; owned by B1690 (pod lock manager in queues).
  - RedisCache initialization and async_rpush/async_lpop transport; owned by B4329 (redis list operations).
  - Request routing, path classification beyond what the middleware provides; this task uses routes and categories as inputs from the caller.
  - Admin UI or web dashboard to visualize gateway activity; the endpoint returns JSON for programmatic consumption.
pitfalls:
  - 'UTC date formatting must match exactly: "%Y-%m-%d" (two-digit month and day, four-digit year). A date like "2026-9-24" will not match database rows stored as "2026-09-24".'
  - 'Status code success range is [200, 300) inclusive. Redirect codes 3xx and client error 4xx are both failures. Status 304 NOT_MODIFIED is a failure, not a success.'
  - 'GatewayRequestKey must be hashable and comparable for use in a HashMap or BTreeMap; it must derive Hash, Eq and Ord or manually implement them.'
  - 'The upsert SQL uses conflict key ("date", "category", "route") in the same order everywhere: row sort order, conflict clause, and group-by logic. A mismatch leaves gaps or causes deadlock.'
  - 'Concurrent writers lock rows in the same order: sorted by (date, category, route). If writers skip this order, N concurrent flushes can deadlock on a full table.'
  - 'On Redis re-queue failure, rows are returned to the accumulator, not dropped. The caller restores them on the next flush, so no counts vanish but availability wins.'
  - 'flush_gateway_requests never raises; all exceptions are caught, logged and restored. A log message is the only signal that persistence failed; the response path is not blocked.'
  - 'GatewayRequestRedisBuffer acquires a lease that is never released, just renewed on every flush. This is a lock with a TTL that lapses if the holder crashes, releasing it to the next pod.'
  - 'The endpoint date range defaults are inclusive: a 30-day lookback from today includes today. start_date and end_date are inclusive on both ends of the WHERE clause.'
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: standard
