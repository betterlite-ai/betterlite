id: B9762
title: Verify MCP tool testing, policy editing and network settings requests
description: >-
  Add HTTP cases for the MCP tool drawer, connection test, ToolDetail and network/rules
  settings. The budget is about 650 lines of transcripts; no backend handler or dashboard
  function changes ownership. B136 supplies the real MCP mock protocol fixture, including
  initialize/notifications and dynamic JSON-RPC ids under /__mcp_fixture/. Use its
  $mcp_request_id response marker instead of assuming the SDK's next integer id.

  Tool request audit. GET /mcp-rest/tools/list?server_id=<id> reads tools[].name,description,
  inputSchema,annotations and error/status data. The edit form adds
  include_disabled_tools=true; forwarded provider headers may accompany either request.
  The ordinary selector request already belongs to B9735's mcp-toolsets-and-tools case.
  B4727 builds this endpoint. POST /mcp-rest/tools/call sends
  {server_id,name,arguments,litellm_metadata?:{guardrails:[...]}} and reads
  content,structuredContent,isError. B4728 owns execution. POST /mcp-rest/test/tools/list
  sends the unsaved NewMCPServerRequest and reads tools,error,message,status; B4729 owns
  preview. All three are mounted by B8626, with no /v1 aliases. useTestMCPConnection sends
  x-litellm-api-key containing the raw gateway key when Authorization carries the upstream
  OAuth bearer; with a custom dashboard header it also puts Bearer gateway-key there.
  The normal no-upstream-token path uses the configured gateway auth header. Capture actual
  upstream headers and ensure the provider token is not mistaken for the gateway credential.
  Prove a saved server's disabled tool is available to editing, a successful unsaved preview,
  a populated tool result and a provider denial/WWW-Authenticate challenge. Use B9760's
  same create payload shape for setup, not an in-process server registry mutation.

  ToolDetail audit. GET /v1/tool/policy/options reads input_policies and output_policies
  entries' value,label,description. GET /v1/tool/{encoded_name}/detail reads tool and
  overrides[], including override_id,team_id,key_hash,key_alias,input_policy,output_policy
  and display/usage fields. GET /v1/tool/{encoded_name}/logs sends page=1,page_size=50,
  start_date and end_date formatted YYYY-MM-DD HH:mm:ss for its 90-day range; read
  logs[].id,timestamp,model,spend,total_tokens,input_snippet,total,page,page_size.
  B1607 owns these report routes. POST /v1/tool/policy sends {tool_name,input_policy?,
  output_policy?,team_id?|key_hash?,key_alias?}; global changes are partial, and empty
  optional identifiers are omitted. DELETE /v1/tool/{encoded_name}/overrides sends
  team_id or key_hash in the query and no body; read deleted,tool_name. B062 owns both
  writes. Exercise global policy, team and key overrides independently, reload detail,
  delete each override and confirm another caller cannot mutate it. No /v1/tool/list or
  /v1/tool/spend is called by ToolDetail, despite neighboring networking helpers.

  Its key picker GET /key/list sends page=1,size=100,return_full_object=true,
  include_team_keys=true,include_created_by_keys=true,substring_matching=true; read
  keys[] token/api_key/key_hash,key_alias. B782 builds that route. B9730's key-table case
  uses size=50, so add this size=100 request. Its TeamDropdown GET /v2/team/list sends
  page=1,page_size=20 (team_dropdown.tsx defaults to 20 and ToolDetail passes no override), optional team_alias and user_id for a nonadmin; read teams[] and
  pagination totals (B813), already included in B9731's legacy-and-all-page-selectors
  plan through useInfiniteTeams. Share only the new key-picker case with B9763. Guardrail
  selection uses GET /v2/guardrails/list with GET /guardrails/list fallback (B3684/B8667),
  consuming guardrails[].guardrail_name and info; reuse B9735's existing planned case.

  Settings audit. GET /v1/mcp/network/client-ip reads ip (B4720/B8625). GET
  /config/list?config_type=general_settings reads field_name/field_value entries for
  mcp_internal_ip_ranges, mcp_allowed_clients, mcp_client_id_header and mcp_required_fields.
  MCPNetworkSettings POST /config/field/update sends {field_name,field_value,
  config_type:general_settings}; POST /config/field/delete sends {field_name,
  config_type:general_settings}. MCPSubmissionsTab uses the update request for
  mcp_required_fields with its selected field-name array. B8595 implements these config
  routes, B8675 mounts them. The HTTP list is a bare array; networking adds its local
  data wrapper. Set general_settings.store_model_in_db=true for persisted settings and
  leave the edited keys out of boot config so config ownership does not reject the writes.
  Preserve array values, allowed-client {alias,value} records and a header-name string,
  then delete and reread rather than inventing new defaults.

  There is no on-disk HTTP coverage for these exact requests. B8626's no-server/auth
  failures and B1607/B062's planned route cases do not supply the page's live MCP call,
  date query, picker size or settings roundtrip. Use B860 database isolation, actual
  management writes and the dependency-owned logging/runtime for populated usage; never
  call handlers or insert arbitrary SQL rows from a helper. Compare error status/type/
  param/code and content-type as well as the fields the drawer consumes; normalize only
  per-process identifiers and measured times. New decoder/fuzz targets are unnecessary.
