  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L6619-L6664
    why: Unsaved connection preview separates upstream and gateway credentials.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L7491-L7680
    why: Exact ToolDetail policy, detail, log and override methods and projections.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/rest_endpoints.py#L935-L1366
    why: Decorated list and call routes already owned by B4727 and B4728.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/rest_endpoints.py#L1719-L1776
    why: Preview is B4729's route, not a client-side-only probe.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/tool_management_endpoints.py#L161-L174
    why: Policy option metadata endpoint.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/tool_management_endpoints.py#L314-L491
    why: Detail and usage-log decorators with page/date filtering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/tool_management_endpoints.py#L585-L759
    why: Existing policy update and override deletion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L18258-L18370
    why: B8595's field update handler and config-owned-write guard.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L18728-L18990
    why: General-settings list and field deletion return the actual values consumed by MCP settings.
dod:
  - text: Connection preview, editable tool listing and execution succeed with separate gateway/provider credentials and the exact optional metadata.
    proof: [tool-page-cases, oracle]
  - text: Tool detail, date-filtered logs, policy overrides, size-100 keys and size-20 teams retain the page's methods, queries and response projections.
    proof: [tool-page-cases, oracle]
  - text: MCP IP/rules settings can be read, updated and cleared through the same admin requests used by the forms.
    proof: [tool-page-cases, oracle]
checks:
  optional: []
  commands:
    - id: tool-page-cases
      why: No existing transcript sends the tool drawer's headers, query values and settings bodies together.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/mcp-tools)"
oracle_cases:
  - tools/oracle/cases/ui/mcp-tools/edit-disabled-and-preview.yaml
  - tools/oracle/cases/ui/mcp-tools/call-with-provider-auth-and-guardrails.yaml
  - tools/oracle/cases/ui/mcp-tools/detail-log-dates-and-overrides.yaml
  - tools/oracle/cases/ui/mcp-tools/key-picker-size-100.yaml
  - tools/oracle/cases/ui/teams/legacy-and-all-page-selectors.yaml
  - tools/oracle/cases/ui/mcp-tools/network-and-submission-settings.yaml
  - tools/oracle/cases/ui/management-selectors/mcp-toolsets-and-tools.yaml
  - tools/oracle/cases/ui/management-selectors/guardrail-v2-and-v1.yaml
deviations: []
out_of_scope:
  - Every tool decoder, executor and policy/report function stays with B4727/B4728/B4729/B062/B1607; B136 owns the MCP protocol fixture.
  - B9090 retains ToolDetail, its tests, MCP tool components, useTestMCPConnection and all settings components; B9761 tests their credential-management endpoints.
  - B8595/B8675 own config persistence and B782/B813 the shared picker APIs; route fixes discovered by cases must be returned to those owners.
pitfalls:
  - Tool names must be encoded as one path segment before adding /detail, /logs or /overrides.
  - The log query uses a space-separated date-time string, not the ISO string convenient to a Rust test.
  - A successful empty tools array cannot prove that include_disabled_tools reached the backend.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
