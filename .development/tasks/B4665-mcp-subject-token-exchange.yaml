deviations:
  - what: >-
      betterlite returns Result[OAuthToken, CredError] instead of raising SubjectTokenRejected or TokenExchangeClientError;
      errors surface as values the caller must handle, not exceptions that can slip past the type checker.
    why: Rust Result types enforce error handling at compile time; every failure path is visible and must be handled.

out_of_scope:
  - Distributed (cross-replica) single-flight coordination. InProcessRefreshCoordinator is per-instance; a later hardening adds Redis-backed coordination.
  - Reactive 401 refresh (invalidating the token after an upstream 401). The resolver layer handles that with the invalidate method.
  - Per-user token refresh (refresh_token grant). Token refresh is owned by the per-user store layers (B4656, B4660).
  - Configuration parsing and validation. TokenExchangeConfig is validated at config load time (B4650, B4651 areas).
  - HTTP client construction. The httpx client is obtained from the gateway's shared client builder (betterlite-http dependency).
  - The resolver arm itself and dispatcher rules. Calling the exchange happens in a later credential resolver task.

pitfalls:
  - >-
    The cache key includes the entire TokenExchangeConfig hashed (endpoint, audience, scope, auth_method, subject_token_type,
    client_secret). A single-character config rotation forces a fresh exchange even within TTL. Hash everything, not just the
    subject_token.
  - >-
    expires_in can be a JSON int, float, or numeric string; _parse_expires_in handles all three. A string like "120.0" must
    parse to 120 seconds, not fail silently and use default_ttl.
  - >-
    token_type case-insensitivity (Bearer / bearer / BEARER all pass) is required by RFC 6750; non-Bearer types fail closed,
    not forwarded as Bearer.
  - >-
    issued_token_type URNs for non-access tokens (refresh_token, id_token, saml1, saml2) must be rejected even if token_type
    claims Bearer, since a malformed STS could mint a refresh token but label it Bearer.
  - >-
    The SubjectTokenRejected exception carries the claims blob from the IdP response; thread it through to the
    CredError::Unauthorized variant so the edge builds the 401 challenge body.
  - >-
    Gateway-fault RFC 6749 codes (invalid_client, unauthorized_client, unsupported_grant_type, invalid_target, invalid_scope)
    map to TokenExchangeClientError, not SubjectTokenRejected; the edge returns 500, not 401.
  - >-
    Entra OBO requires at least one scope (e.g. api://app-id/.default); the exchanger fails closed with misconfigured before
    hitting the IdP if scope is empty.
  - >-
    The distributed coordinator (a later hardening) provides run(key, refresh, reread) where reread re-checks the cache after
    refresh; a re-entrant refresh must not loop back into the IdP.
  - >-
    Concurrent TTL expiries: if TTL elapses while a slow IdP call is in flight, the cache miss on re-read populates the cache
    with the fresh result; no stale bearer is ever served.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 2
