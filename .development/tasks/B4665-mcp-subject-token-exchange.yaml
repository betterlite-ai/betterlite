dod:
  - text: >-
      OboTokenExchanger exchanges a caller token via RFC 8693 or Entra OBO, returning Ok(OAuthToken) with access_token
      and optional expires_at, or Error(CredError); errors are mapped via exception types, not raised.
    proof: [token-exchange-tests, helper-python, helper-case-corpus]
  - text: >-
      The exchange form is built per profile: RFC 8693 includes subject_token, subject_token_type, and audience (if set);
      Entra OBO includes assertion, scope, and requested_token_use=on_behalf_of, dropping audience and subject_token_type.
    proof: [token-exchange-tests]
  - text: >-
      Tokens are cached per (subject_token, tenant_id, profile, endpoint, audience, scope, client_id, secret, auth_method,
      subject_token_type), all hashed; a rotated caller token re-exchanges; a rotated config re-exchanges before TTL.
    proof: [token-exchange-tests]
  - text: >-
      Single-flight per cache_key: concurrent callers with the same token and config collapse to one IdP exchange; the
      coordinator's reread ensures a re-entrant refresh re-checks the cache instead of looping into the IdP again.
    proof: [token-exchange-tests]
  - text: >-
      Token parsing validates access_token (required), token_type (must be Bearer or absent), and issued_token_type
      (must not be refresh, id, or saml); missing or non-Bearer token_type is refused; unknown issued_token_type is accepted.
    proof: [token-exchange-tests]
  - text: >-
      TTL is calculated as max(expiry - now - buffer, min_ttl), floored to min_ttl; a token with no expires_in uses default_ttl;
      a short-lived token (remaining lifetime below buffer) is not cached past its actual expiry.
    proof: [token-exchange-tests]
  - text: >-
      HTTP 4xx with a gateway-fault RFC 6749 code (invalid_client, unauthorized_client, unsupported_grant_type, invalid_target,
      invalid_scope) maps to TokenExchangeClientError and surfaces as misconfigured (500).
    proof: [token-exchange-tests, helper-python, helper-case-corpus]
  - text: >-
      HTTP 4xx with a subject-fault code or unrecognized error maps to SubjectTokenRejected and surfaces as unauthorized (401);
      Entra Conditional Access claims in the body are threaded through to the 401 challenge.
    proof: [token-exchange-tests, helper-python, helper-case-corpus]
  - text: >-
      HTTP 5xx, timeout, network error, or JSON parse error map to None in _post_exchange_endpoint and surface as
      upstream_unavailable (503).
    proof: [token-exchange-tests]
  - text: >-
      Missing endpoint, incomplete client credentials (no client_id or no client_secret), or Entra OBO without scope fail
      closed with precondition_required or misconfigured, without hitting the IdP.
    proof: [token-exchange-tests]
  - text: >-
      invalidate(subject_token, server, config, tenant_id) drops the cached token for that key, forcing a fresh exchange
      on the next call; it targets only the matching tenant.
    proof: [token-exchange-tests]
  - text: >-
      build_token_exchanger returns an OboTokenExchanger with an InMemoryTokenCacheBackend sized to MCP_TOKEN_EXCHANGE_CACHE_MAX_SIZE;
      each build creates a new instance with its own cache, so egresses never share cached tokens.
    proof: [token-exchange-tests]

checks:
  optional: [mutants]
  commands:
    - id: token-exchange-tests
      why: token exchanger tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::(token_exchanger|token_exchange_provider)::/) - test(/replays_corpus$/)'
    - id: helper-python
      why: The oracle helper adapter is missing or Python type checking fails.
      run: test -f tools/oracle/helpers/b4665.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/token_exchange-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

