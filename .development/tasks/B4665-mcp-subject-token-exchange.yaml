id: B4665
title: MCP RFC 8693 and Entra on-behalf-of grants
description: >-
  Build the pure token exchange engine and its composition root in crates/betterlite-server::mcp::outbound_credentials.
  OboTokenExchanger swaps a caller's inbound token for an upstream-bound one via RFC 8693 token-exchange or Entra
  On-Behalf-Of (OBO, RFC 7523 jwt-bearer) grants, caching the result per (subject_token, tenant, config, server) and
  single-flighting concurrent exchanges so repeated caller tokens skip the IdP round-trip and concurrent calls collapse
  to one exchange.

  The two profiles differ only in the request form: RFC 8693 carries audience and subject_token_type as separate fields,
  while Entra OBO uses jwt-bearer and carries the target resource in scope (e.g. api://app-id/.default).

  OboTokenExchanger::exchange takes the caller's subject_token (an inbound bearer or JWT) and the server's
  TokenExchangeConfig, POSTs the selected grant to the token endpoint with client authentication (client_secret_basic
  or client_secret_post), and returns the upstream access_token as a typed OAuthToken (with optional expires_at and
  refresh_token for later grants), or a typed CredError. HTTP failures (5xx / timeout / network) map to
  upstream_unavailable (503). IdP 4xx client errors (invalid_client / invalid_target, gateway-fault codes) map to
  misconfigured (500). IdP 4xx subject errors (invalid_grant / invalid_request) and step-up challenges (Entra
  Conditional Access claims) map to unauthorized (401). Token parsing failures (missing access_token, non-Bearer
  token_type, non-access issued_token_type) map to upstream_unavailable.

  The exchange is cached per _cache_key, which binds the entry to subject_token, tenant_id, profile, endpoint,
  audience, scope, client_id, client_secret, auth_method, and subject_token_type (everything is hashed).
  A rotated caller token hashes to a new key and re-exchanges. Cached tokens use TTL (default 3600s): a token
  with expires_in is cached until its expiry minus a skew buffer (default 60s), floored at min_ttl (default 10s).
  A token with no declared expiry uses the default TTL. The cache is in-process and shared per egress instance, so
  the same server and caller token never exchange twice until TTL.

  Single-flight per cache_key ensures concurrent callers with the same subject_token, tenant, config, and server
  collapse into one IdP call. The RefreshCoordinator injected at runtime coordinates the refresh and reread callbacks;
  during the exchange, a re-entrant refresh on the same key re-checks the cache instead of re-entering the IdP.

  build_token_exchanger is the composition root: it builds OboTokenExchanger with the real httpx POST edge,
  an InMemoryTokenCacheBackend sized to MCP_TOKEN_EXCHANGE_CACHE_MAX_SIZE, and TTL constants from config.
  Each call to build_token_exchanger creates a new instance with its own cache, so one egress never serves another's
  tokens.

  _post_exchange_endpoint is the HTTP edge: it POSTs to the IdP, passes the form body and client-auth headers
  (built by build_token_endpoint_client_auth from B4650), and maps failures:
  - raise_for_status() raising an HTTPStatusError with a 4xx: parse the RFC 6749 error code and claims blob from
    the JSON body; if the code is in the gateway-fault set (invalid_client, unauthorized_client, unsupported_grant_type,
    invalid_target, invalid_scope), raise TokenExchangeClientError. Otherwise raise SubjectTokenRejected with claims.
  - 5xx / timeout / network / JSON parse / malformed body: return None (the exchanger maps it to upstream_unavailable).
  - Non-object JSON body: return None (the exchanger maps it to upstream_unavailable).
  - Success: return the parsed JSON body dict.
  The error_description field is never read (it can leak IdP internals).

  Entra Conditional Access (a step-up challenge in the claims field) threads through SubjectTokenRejected so the edge
  can build a 401 with the claims blob; the caller uses it to satisfy the step-up and retry.

