pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_aws_endpoints in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/aws_endpoints.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_aws_endpoints.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- LLM region lookup gives AWS_REGION_NAME priority, while the non-LLM branch lets AWS_REGION overwrite it.
- An explicit model_id blocks ARN-region fallback to model even when that override is not an ARN.
