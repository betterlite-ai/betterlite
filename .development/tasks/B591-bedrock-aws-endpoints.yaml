id: B591
title: Bedrock model identifiers regions and endpoints
description: >-
  Add BedrockModelId and AwsEndpoint selection, including ARNs, cross-region identifiers, URL path encoding, embedding
  provider names, model specs and partition DNS. Resolve AWS_REGION_NAME, AWS_REGION, AWS_DEFAULT_REGION, AWS_BEDROCK_RUNTIME_ENDPOINT
  and configured profile region in config. Keep LLM fallback us-west-2 and the distinct non-LLM precedence; STS
  endpoint-region precedence is independent. api_base and runtime overrides are operator destinations. Put the pure
  Bedrock model-id/prefix/ARN/throughput normalization and region-list helpers in betterlite-context/src/bedrock_model.rs,
  so Anthropic capability lookup can reuse them without a dependency on the Bedrock provider crate. Supply the known-region
  list as immutable context data; Bedrock endpoint/auth execution stays in betterlite-bedrock. The class accessors
  become aliases to these context helpers.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/base_aws_llm.py:
  BaseAWSLLM._get_aws_region_from_model_arn L538-L560; BaseAWSLLM._get_provider_from_model_path L563-L580; BaseAWSLLM.get_bedrock_invoke_provider
  L583-L616; BaseAWSLLM.get_bedrock_model_id L619-L667; BaseAWSLLM._get_model_id_from_model_with_spec L670-L678;
  BaseAWSLLM.encode_model_id L681-L689; BaseAWSLLM.get_bedrock_embedding_provider L692-L730; BaseAWSLLM._get_aws_region_name
  L732-L790; BaseAWSLLM._validate_aws_region_name L793-L804; BaseAWSLLM._parse_sts_region_from_endpoint L807-L815;
  BaseAWSLLM._resolve_sts_region L818-L828; BaseAWSLLM._build_sts_client_kwargs L830-L843; BaseAWSLLM.get_aws_region_name_for_non_llm_api_calls
  L845-L872; BaseAWSLLM.get_runtime_endpoint L1471-L1499; BaseAWSLLM._select_default_endpoint_url L1501-L1517. litellm/llms/bedrock/common_utils.py:
  .


  Named case contracts: non_llm_region_precedence: Explicit aws_region_name non-None validates. Else begin us-west-2;
  AWS_REGION_NAME non-None string overrides, then AWS_REGION non-None string overrides it, including empty -> validation
  failure. No SDK session or AWS_DEFAULT_REGION lookup in this branch. provider_selection_order: Invoke strips one
  leading invoke/, gives case-insensitive nova substring priority, then checks first dot component, then first slash
  component, then ordered substring matches cohere,anthropic,mistral,amazon,meta,llama,ai21,nova,deepseek_r1,qwen3,qwen2,twelvelabs,openai,stability,moonshot;
  unmatched returns None. Embedding also prioritizes nova, then second dot component before first, then ordered
  cohere,amazon,twelvelabs,nova substring fallback. Preserve case sensitivity outside the nova shortcut. model_id_encoding_and_mutation:
  Pop model_id from optional_params; non-None override is quoted with safe="" and returned, including empty string.
  Otherwise strip B2203 routing prefixes, percent-encode ARN beginning arn: and return before other rewrites. For
  non-ARN remove first invoke/ occurrence anywhere; selected providers llama,deepseek_r1,openai,qwen2,qwen3,stability,moonshot
  remove every occurrence of their spec prefix. Only when no earlier provider branch matched, remove every nova-2/
  or otherwise nova/ occurrence, then quote through the spec helper. Already percent-encoded overrides encode percent
  again; do not decode before quoting. llm_region_precedence: Explicit aws_region_name non-None validates even empty.
  Otherwise non-None model_id argument is the only ARN candidate (invalid override blocks model ARN fallback); valid
  ARN supplies region. Then AWS_REGION_NAME non-None string, AWS_REGION non-None string, SDK Session.region_name
  truthy, finally us-west-2. SDK exceptions also use us-west-2. ARN region requires B198 ARN detector plus colon
  component3 matching lowercase [a-z0-9-]+; malformed/missing returns None. Final region always passes B198 validation.
  sts_region_and_kwargs: STS endpoint hostname regex (?:^|\.)sts(?:-fips)?\.([a-z0-9-]+)\.(?:amazonaws\.com(?:\.cn)?|vpce\.amazonaws\.com)
  supplies signing region, including vpce and fips forms; source has no end anchor, so preserve matching hostname
  suffixes. Region fallback is truthy AWS_REGION, AWS_DEFAULT_REGION, then configured region. STS kwargs always
  include verify from B590, endpoint_url iff notNone including empty, region_name iff notNone including empty. runtime_endpoint_precedence:
  Choose api_base when notNone including empty, else aws_bedrock_runtime_endpoint non-None string including empty,
  else truthy resolved AWS_BEDROCK_RUNTIME_ENDPOINT string, else https://<service>.<region>.<B198 partition DNS
  suffix>. service=bedrock-runtime by default/unknown endpoint_type, bedrock-agent-runtime for agent, bedrock-agentcore
  for agentcore. Return aws_bedrock_runtime_endpoint when it is a string other than None, else a truthy string from
  AWS_BEDROCK_RUNTIME_ENDPOINT, else endpoint_url as proxy_endpoint_url. This may differ from an explicit api_base,
  but it never defaults to None. Partition DNS must handle aws-cn/us-gov.


  B2203 owns all pure model/region catalog normalization and is a direct prerequisite. B198 owns ARN detection,
  region validation and partition DNS; B590 owns TLS access. Resolve AWS_REGION_NAME,AWS_REGION,AWS_DEFAULT_REGION,AWS_BEDROCK_RUNTIME_ENDPOINT
  through this task’s real config loader; no live boto3 network discovery is needed for local Session.region_name
  fixtures.


  BedrockModelInfo.get_base_model belong to B2203; delegate those calls directly and retain only the remaining owned
  bodies.


  Implement crates/betterlite-bedrock/src/aws_endpoints.rs with adjacent tests under aws_endpoints/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function aws_endpoints_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  model_arn_region, explicit_region_precedence, environment_profile_fallback, non_llm_region_precedence, invalid_region,
  arn_model_path_encoding, inference_profile_model_id, china_partition, runtime_agent_agentcore_endpoints, sts_region_from_endpoint,
  provider_selection_order, model_id_encoding_and_mutation, llm_region_precedence, sts_region_and_kwargs, runtime_endpoint_precedence.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_aws_endpoints* using HelperCase: kind:
  helper and the externally tagged bedrock_aws_endpoints variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_aws_endpoints that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/aws_endpoints.rs
  and its loader wiring: AWS_REGION_NAME, AWS_REGION, AWS_DEFAULT_REGION, AWS_BEDROCK_RUNTIME_ENDPOINT. Module-level
  settings enter litellm_settings; deployment settings enter litellm_params; environment lookup is injected. Keep
  the defaults and precedence specified above and in the linked branches; existing key owners remain unchanged.
  Write config rstest bedrock_aws_endpoints_config_cases with named cases loads_aws_region_name, loads_aws_region,
  loads_aws_default_region, loads_aws_bedrock_runtime_endpoint, plus rejects_unrelated_key. Each loads case calls
  the real config loader with that key and asserts the resolved value, default, precedence and secret redaction
  where applicable. Seed B002 config_yaml with new bedrock_aws_endpoints* files for every key; reuse its parser/fuzz
  target.


  Budget from 297 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 260 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 60 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 705 planned, 725 maximum changed lines.
