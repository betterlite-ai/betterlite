  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_aws_endpoints_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/bedrock_aws_endpoints*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: case-provider-selection-order
    why: Invoke strips one leading invoke/, gives case-insensitive nova substring priority, then checks first dot
      component, then first slash component, then ordered substring matches cohere,anthropic,mistral,amazon,meta,llama,ai21,nova,deepseek_r1,qwen3,qwen2,twelvelabs,openai,stability,moonshot;
      unmatched returns None. Embedding also prioritizes nova, then second dot component before first, then ordered
      cohere,amazon,twelvelabs,nova substring fallback. Preserve case sensitivity outside the nova shortcut.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_endpoints_cases::case_[0-9]+_provider_selection_order$/)'
  - id: case-model-id-encoding-and-mutation
    why: 'Pop model_id from optional_params; non-None override is quoted with safe="" and returned, including empty
      string. Otherwise strip B2203 routing prefixes, percent-encode ARN beginning arn: and return before other
      rewrites. For non-ARN remove first invoke/ occurrence anywhere; selected providers llama,deepseek_r1,openai,qwen2,qwen3,stability,moonshot
      remove every occurrence of their spec prefix. Only when no earlier provider branch matched, remove every nova-2/
      or otherwise nova/ occurrence, then quote through the spec helper. Already percent-encoded overrides encode
      percent again; do not decode before quoting.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_endpoints_cases::case_[0-9]+_model_id_encoding_and_mutation$/)'
  - id: case-llm-region-precedence
    why: Explicit aws_region_name non-None validates even empty. Otherwise non-None model_id argument is the only
      ARN candidate (invalid override blocks model ARN fallback); valid ARN supplies region. Then AWS_REGION_NAME
      non-None string, AWS_REGION non-None string, SDK Session.region_name truthy, finally us-west-2. SDK exceptions
      also use us-west-2. ARN region requires B198 ARN detector plus colon component3 matching lowercase [a-z0-9-]+;
      malformed/missing returns None. Final region always passes B198 validation.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_endpoints_cases::case_[0-9]+_llm_region_precedence$/)'
  - id: case-sts-region-and-kwargs
    why: STS endpoint hostname regex (?:^|\.)sts(?:-fips)?\.([a-z0-9-]+)\.(?:amazonaws\.com(?:\.cn)?|vpce\.amazonaws\.com)
      supplies signing region, including vpce and fips forms; source has no end anchor, so preserve matching hostname
      suffixes. Region fallback is truthy AWS_REGION, AWS_DEFAULT_REGION, then configured region. STS kwargs always
      include verify from B590, endpoint_url iff notNone including empty, region_name iff notNone including empty.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_endpoints_cases::case_[0-9]+_sts_region_and_kwargs$/)'
  - id: case-runtime-endpoint-precedence
    why: Choose api_base when notNone including empty, else aws_bedrock_runtime_endpoint non-None string including
      empty, else truthy resolved AWS_BEDROCK_RUNTIME_ENDPOINT string, else https://<service>.<region>.<B198 partition
      DNS suffix>. service=bedrock-runtime by default/unknown endpoint_type, bedrock-agent-runtime for agent, bedrock-agentcore
      for agentcore. Return aws_bedrock_runtime_endpoint when it is a string other than None, else a truthy string
      from AWS_BEDROCK_RUNTIME_ENDPOINT, else endpoint_url as proxy_endpoint_url. This may differ from an explicit
      api_base, but it never defaults to None. Partition DNS must handle aws-cn/us-gov.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_endpoints_cases::case_[0-9]+_runtime_endpoint_precedence$/)'
