id: B3044
title: Resolve billable and recovered token usage
description: >-
  Build betterlite-rate-limit::usage_resolution to extract billable token counts
  from completion responses and partial-stream recovery data. Extract combined,
  input-only and output-only counts across typed Usage records, response-API
  Responses usage objects, dictionaries, rerank metadata and recovered aggregates.
  Apply the configured token_rate_limit_type (output/input/total) with a default/fallback
  of total when the type is missing or invalid. Subtract cache-read tokens from input
  and total billable counts only, since providers like AWS Bedrock don't bill cached
  tokens; preserve the full cached token count in downstream cost/logging contexts.

  Expose get_rate_limit_type (reading general_settings.token_rate_limit_type with
  default total), _response_usage (extract from response objects as typed or dict),
  _get_total_tokens_from_usage (apply rate-limit-type filter), _aggregate_only_total_tokens
  (total when no input/output split is available), _resolve_rerank_token_usage (parse
  rerank metadata fields), _resolve_io_token_reconcile_usage (separate billable input
  from output for project I/O quotas, excluding cached tokens), and _recovered_partial_usage_tokens
  (extract counts from recovered stream usage for failure accounting).

