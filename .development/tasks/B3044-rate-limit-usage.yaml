    why: _get_total_tokens_from_usage applies rate-limit-type filter and cache-token exclusion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4535-L4545
    why: get_rate_limit_type reads general_settings with total default/fallback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4564-L4638
    why: _resolve_rerank_token_usage and _resolve_io_token_reconcile_usage split by provider shape.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4269-L4313
    why: _aggregate_only_total_tokens return 0 when split counts exist.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4288-L4313
    why: _response_usage extracts usage from response objects or passes dicts through.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L5094-L5103
    why: _recovered_partial_usage_tokens calls reconcile_usage and applies rate-limit-type.
dod:
  - text: get_rate_limit_type returns the configured token_rate_limit_type from general_settings, defaulting to "total" when absent or invalid.
    proof: [rate-limit-type-default]
  - text: _get_total_tokens_from_usage applies the rate-limit-type filter (output/input/total) and excludes cached tokens for input/total types.
    proof: [usage-filtering-behaviors, usage-filtering-boundaries]
  - text: _response_usage extracts Usage, ResponseAPIUsage or Mapping from response objects; passes dict objects through unchanged.
    proof: [usage-filtering-behaviors]
  - text: _aggregate_only_total_tokens returns 0 when any input/output split counts exist, else returns the total.
    proof: [usage-filtering-behaviors]
  - text: _resolve_rerank_token_usage reads rerank response metadata, extracting tokens.input_tokens and tokens.output_tokens or billed_units.total_tokens when present.
    proof: [rerank-usage-behaviors]
  - text: _resolve_io_token_reconcile_usage returns (input - cached_tokens, output, true) for typed Usage/ResponseAPIUsage and dict objects, preserving full cached count elsewhere.
    proof: [io-reconcile-behaviors, io-reconcile-boundaries]
  - text: _recovered_partial_usage_tokens extracts usage counts from combined_usage_object, returning (total by rate-limit-type, input - cached, output).
    proof: [recovered-usage-behaviors]
  - text: Cached token subtraction handles None, missing fields, and non-dict prompt_tokens_details gracefully.
    proof: [usage-filtering-boundaries]
  - text: Every oracle case exercises the full usage extraction and reconciliation chain with exact token count assertions.
    proof: [usage-oracle]
pitfalls:
  - "token_rate_limit_type is read from general_settings.get() with a string literal default; invalid values (not output/input/total) return the default 'total', not an error."
  - "cached_tokens extraction checks hasattr and getattr safely; a Usage with None prompt_tokens_details must not crash when reading cached_tokens."
  - "_aggregate_only_total_tokens returns 0 immediately if ANY of (prompt_tokens, completion_tokens, input_tokens, output_tokens) are non-zero; a total > 0 paired with any nonzero split count disqualifies the aggregate."
  - "_response_usage passes through dict objects unchanged even if they don't contain usage keys; reconciliation handles missing fields by treating them as 0."
  - "RerankResponse may have no meta field, no tokens field in meta, or no billed_units; _resolve_rerank_token_usage returns None only when all paths are absent."
  - "cached_tokens can come from prompt_tokens_details.cached_tokens OR cache_read_input_tokens field in dict; both must be checked."
  - "prompt_details in dict usage may be a non-dict value; isinstance checks protect against AttributeError when fields are missing or wrong type."
  - "ResponseAPIUsage uses input_tokens/output_tokens names, not prompt_tokens/completion_tokens; the code must check both field names depending on usage object type."
out_of_scope:
  - B002 owns the config loading of general_settings.token_rate_limit_type field; B3044 adds that field support to betterlite-config as needed.
  - B184 owns the native RateLimitError record that gets token usage stored on it.
  - Usage record types (Usage, ResponseAPIUsage, RerankResponse) are imported typed views; this task reads them as-is.
  - Downstream reconciliation operations (reserve/increment/refund) that consume these counts are owned by B3034/B3037/B3045.
deviations:
  - what: "cache-read tokens are excluded from input and total billable counts for rate limiting, but preserved in their original count values for cost/logging calculations elsewhere."
    why: "Providers like AWS Bedrock don't bill cached tokens toward TPM but do report them in usage. Betterlite matches provider behavior by subtracting only from rate-limit windows."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L4226-L4243"
