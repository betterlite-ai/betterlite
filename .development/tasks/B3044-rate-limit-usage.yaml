      why: get_rate_limit_type missing, fails to return default "total", or does not read general_settings
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/::rate_limit_type_behaviors(::|$)/)'
    - id: usage-filtering-behaviors
      why: task-specific behavior tests for usage extraction are missing, skipped or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/::usage_filtering_behaviors(::|$)/)
        - test(/replays_the_.*_corpus/)'
    - id: usage-filtering-boundaries
      why: task-specific boundary/error tests for usage extraction are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/::usage_filtering_boundaries(::|$)/)'
    - id: rerank-usage-behaviors
      why: rerank metadata extraction is missing, unchanged or fails
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/::rerank_usage_behaviors(::|$)/)'
    - id: io-reconcile-behaviors
      why: I/O token reconciliation behavior tests are missing, skipped or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/::io_reconcile_behaviors(::|$)/)
        - test(/replays_the_.*_corpus/)'
    - id: io-reconcile-boundaries
      why: I/O reconciliation error/edge-case tests are missing or fail
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/::io_reconcile_boundaries(::|$)/)'
    - id: recovered-usage-behaviors
      why: recovered partial usage extraction is missing or fails
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/::recovered_usage_behaviors(::|$)/)'
    - id: usage-oracle
      why: oracle cases or the full usage extraction chain are missing or fail
      run: test -d tools/oracle/cases/rate_limit/usage-resolution && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- tools/oracle/cases/rate_limit/usage-resolution)" && cargo run --locked -p betterlite-oracle
        -- --self-check tools/oracle/cases/rate_limit/usage-resolution
    - id: config-token-rate-limit-type
      why: general_settings.token_rate_limit_type not loaded by config or test missing
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(loads_token_rate_limit_type_from_general_settings)'
