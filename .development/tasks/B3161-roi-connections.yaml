deviations:
  - what: _gateway_http_client caches the transport for the FastAPI app instance via functools.lru_cache; Rust uses a static OnceCell with the Axum Router reference to achieve the same effect.
    why: Rust does not have Python's function-level decorator caching and must use a static initializer to avoid recreating the transport on every client call.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/roi_calculator_endpoints.py#L268-L270
out_of_scope:
  - "Implementation of the /v1/models route; B3161 calls it as an authenticated endpoint. The missing dependency on the concrete route owner is an architect decision per the outline."
  - Scheduling or persistence of gateway calls beyond the two routes owned here.
  - Retry logic on gateway failures; both routes fail on the first error.
  - Custom prompt management or completion logging; the completion_caller is a pure adapter.
  - Spend aggregation logic; _spend_reader is a pure closure over the B3155 read_spend function.
pitfalls:
  - The _gateway_transport function must cache the transport to avoid recreating httpx.ASGITransport on every gateway call, since each transport holds a reference to the app.
  - The estimator key validation in _test_estimator_access must check the response.data array and raise 409 if the selected model_name is not found, not just validate the response structure.
  - POST /v1/chat/completions requests must exclude None fields (use exclude_none=True in model_dump_json) to match LiteLLM's behavior on optional completion parameters.
  - SourceError from GitHub (failed API requests, rate limits, server errors) must map to 502 (bad gateway), not 500, because it represents an external service failure.
  - HTTPError or ValidationError during _test_estimator_access (missing model, bad token, gateway offline, response validation) must map to 409 Conflict, not 502, because it is a configuration/credential problem for the operator to fix.
  - GET /roi-calculator/repositories requires read-admin; POST /roi-calculator/connections/test requires write-admin. Never authenticate inline.
  - The completion_caller closure captures settings; it must use settings.estimator_model exactly as provided when constructing ROICompletionRequest, without reformatting the model name.
review_level: security
