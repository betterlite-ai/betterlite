dod:
  - text: get_github_transport returns None when called without transport injection.
    proof: [repositories-read-admin]
  - text: _gateway_key returns estimator_key when set, falls back to master_key, and raises 409 when both are absent.
    proof: [connections-unit]
  - text: _gateway_http_client creates client with 180-second timeout, ASGI transport and follow_redirects=false.
    proof: [connections-unit]
  - text: _completion_caller posts to /v1/chat/completions with Bearer token, excludes None fields and validates JSON response.
    proof: [connections-unit]
  - text: _test_estimator_access calls /v1/models, validates the model exists in response.data and raises 409 on HTTPError or ValidationError.
    proof: [connections-estimator-409]
  - text: _spend_reader closure calls read_spend through spend_prisma_client and returns tuple of ROISpendRecord.
    proof: [connections-unit]
  - text: GET /roi-calculator/repositories calls GitHub.repositories, paginates results and returns ROIRepositoriesResponse with pagination (page, has_more).
    proof: [repositories-query]
  - text: GET /roi-calculator/repositories with query parameter filters repositories and handles SourceError as 502.
    proof: [repositories-source-error-502]
  - text: POST /roi-calculator/connections/test calls _test_estimator_access and GitHub.test_repositories, returns ROISettingsResponse on success.
    proof: [connections-success]
  - text: GET /roi-calculator/repositories requires read-admin via dependency injection; POST /roi-calculator/connections/test requires write-admin.
    proof: [repositories-read-admin, connections-write-admin]
  - text: GET /roi-calculator/repositories with invalid credentials returns 403 Forbidden.
    proof: [repositories-403]
  - text: GET /roi-calculator/repositories on SourceError from GitHub returns 502 Bad Gateway with error detail.
    proof: [repositories-source-error-502]
  - text: POST /roi-calculator/connections/test with invalid estimator key or missing model raises 409 Conflict ("estimator key cannot access the selected model" or "could not connect to the gateway").
    proof: [connections-estimator-409]
  - text: POST /roi-calculator/connections/test with SourceError from GitHub.test_repositories returns 502 Bad Gateway.
    proof: [connections-github-502]
