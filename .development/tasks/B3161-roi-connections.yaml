id: B3161
title: Connect ROI GitHub discovery and gateway estimation
description: >-
  Build GitHub repository discovery, connection testing and the gateway completion/spend callback adapters in crates/betterlite-server::roi_connections.
  Implement get_github_transport as an optional injection hook for test/mock HTTP transport override (production returns None), _gateway_key to select the estimator key or fallback to master_key, _gateway_http_client to create an AsyncHTTPHandler with cached transport and 180-second timeout, and _gateway_transport as an lru_cache-wrapped httpx.ASGITransport factory.
  Implement _completion_caller to return a CompletionCaller async closure that calls POST /v1/chat/completions on the gateway via AsyncHTTPHandler with Bearer token auth and handles the response.
  Implement _test_estimator_access to verify the estimator key can call GET /v1/models and the selected model exists in the response.
  Implement _spend_reader to return a SpendReader async closure that calls read_spend from B3155.
  Add HTTP routes: GET /roi-calculator/repositories (requires read-admin) with query and page Query parameters to list repositories from GitHub via get_github_transport injection, and POST /roi-calculator/connections/test (requires write-admin) to validate both estimator and GitHub connectivity.
  Map SourceError from GitHub to HTTP 502, and HTTPError or ValidationError during estimator-key access to 409. Missing credentials raise 409 Conflict.
