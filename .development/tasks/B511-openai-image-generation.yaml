id: B511
title: OpenAI image generation variants
description: >-
  Add typed ImageGenerationRequest/Reply and one transport path for DALL-E 2, DALL-E 3 and GPT image configuration,
  including optional created/usage/provider fields. Choose a model config explicitly and retain each model family
  parameter list. Shared synchronous SDK facade semantics use this same async implementation; public image endpoints
  belong to B082.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/image_generation/__init__.py:
  get_openai_image_generation_config L22-L28. litellm/llms/openai/image_generation/dall_e_2_transformation.py: DallE2ImageGenerationConfig.get_supported_openai_params
  L23-L24; DallE2ImageGenerationConfig.map_openai_params L26-L45; DallE2ImageGenerationConfig.transform_image_generation_response
  L47-L81. litellm/llms/openai/image_generation/dall_e_3_transformation.py: DallE3ImageGenerationConfig.get_supported_openai_params
  L23-L24; DallE3ImageGenerationConfig.map_openai_params L26-L45; DallE3ImageGenerationConfig.transform_image_generation_response
  L47-L81. litellm/llms/openai/image_generation/gpt_transformation.py: GPTImageGenerationConfig.get_supported_openai_params
  L23-L33; GPTImageGenerationConfig.map_openai_params L35-L54; GPTImageGenerationConfig.transform_image_generation_response
  L56-L97. litellm/llms/openai/openai.py: OpenAIChatCompletion.aimage_generation L1392-L1454; OpenAIChatCompletion.image_generation
  L1456-L1554.


  Named case contracts: dalle2_parameters: Empty model or prefix dall-e-2 selects DALL-E 2; allow n,response_format,quality,size,user,
  and set reply size=1024x1024,quality=standard,output_format=png only when those options are absent. dalle3_quality_style:
  Prefix dall-e-3 selects DALL-E 3; allow n,response_format,quality,size,user,style and use absent reply option
  defaults 1024x1024,hd,png. gpt_image_usage: Every other model selects GPT config; allow background,moderation,n,output_compression,output_format,quality,size,user.
  Preserve truthy provider reply size/quality/output_format, otherwise use integer width x height before size=1024x1024,
  quality=high and output_format=png. image_status_error: Sync keeps OpenAIError and wraps other errors as OpenAIError
  with status_code or 500 and diagnostic; async logs and rethrows the original exception. unsupported_image_param:
  For each image family keep an already-present optional_params key even when unsupported, copy a supported missing
  key, and otherwise drop only when drop_params is true or raise ValueError naming the parameter/model/supported
  list. image_request_overlay: Build model/prompt with optional_params overlay, pop max_retries default 2, and reject
  noninteger values as OpenAIError 422 before sync/async dispatch; a nonempty headers argument overrides extra_headers.
  image_raw_response_headers: Both paths call images.with_raw_response.generate with timeout, project response_type=image_generation
  through B004, and store provider headers through B206.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-openai/src/image_generation.rs with adjacent tests under image_generation/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_generation_cases in betterlite-openai with these exact named cases (one per oracle
  file): dalle2_parameters, dalle3_quality_style, gpt_image_usage, b64_json_and_url, missing_created, image_status_error,
  unsupported_image_param, image_request_overlay, image_raw_response_headers. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_image_generation* using HelperCase: kind:
  helper and the externally tagged openai_image_generation variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_image_generation that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_image_reply consumes image-generation JSON response bytes in crates/betterlite-openai/src/image_generation.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_image_generation.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_image_generation.
  The adjacent test replays_the_openai_image_generation_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 324 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 350 production lines, 180 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 720 planned, 725 maximum changed lines.
