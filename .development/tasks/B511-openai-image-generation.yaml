checks:
  optional:
  - mutants
  commands:
  - id: case-dalle2-parameters
    why: Empty model or prefix dall-e-2 selects DALL-E 2; allow n,response_format,quality,size,user, and set reply
      size=1024x1024,quality=standard,output_format=png only when those options are absent.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_dalle2_parameters$/)'
  - id: case-dalle3-quality-style
    why: Prefix dall-e-3 selects DALL-E 3; allow n,response_format,quality,size,user,style and use absent reply
      option defaults 1024x1024,hd,png.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_dalle3_quality_style$/)'
  - id: case-gpt-image-usage
    why: Every other model selects GPT config; allow background,moderation,n,output_compression,output_format,quality,size,user.
      Preserve truthy provider reply size/quality/output_format, otherwise use integer width x height before size=1024x1024,
      quality=high and output_format=png.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_gpt_image_usage$/)'
  - id: case-b64-json-and-url
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-generation/b64-json-and-url.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_b64_json_and_url$/)'
  - id: case-missing-created
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-generation/missing-created.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_missing_created$/)'
  - id: case-image-status-error
    why: Sync keeps OpenAIError and wraps other errors as OpenAIError with status_code or 500 and diagnostic; async
      logs and rethrows the original exception.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_image_status_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_image_generation.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_image_generation*")"
      && grep -lq 'openai_image_generation' tools/oracle/fuzz/corpus/helper_case/openai_image_generation* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_image_generation$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_image_generation)"
      && grep -q 'decode_image_reply' crates/betterlite-openai/fuzz/fuzz_targets/openai_image_generation.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_image_generation_corpus$/)'
  - id: case-unsupported-image-param
    why: For each image family keep an already-present optional_params key even when unsupported, copy a supported
      missing key, and otherwise drop only when drop_params is true or raise ValueError naming the parameter/model/supported
      list.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_unsupported_image_param$/)'
  - id: case-image-request-overlay
    why: Build model/prompt with optional_params overlay, pop max_retries default 2, and reject noninteger values
      as OpenAIError 422 before sync/async dispatch; a nonempty headers argument overrides extra_headers.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_image_request_overlay$/)'
  - id: case-image-raw-response-headers
    why: Both paths call images.with_raw_response.generate with timeout, project response_type=image_generation
      through B004, and store provider headers through B206.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_image_raw_response_headers$/)'
