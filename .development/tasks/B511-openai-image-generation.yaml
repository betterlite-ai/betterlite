pitfalls:
- 'The oracle helper for this task is pre-registered as openai_image_generation in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/image_generation.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_image_generation.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- DALL-E reply annotations use dict.get defaults and can become explicit None, while GPT uses truthiness to retain
  provider-supplied values.
- The family selector is case-sensitive and treats every unknown non-DALL-E name as GPT image.
- An unsupported option already in optional_params bypasses validation; tests must distinguish the two input maps.
