id: B580
title: Anthropic response envelope conversion
description: >-
  Add AnthropicReply parsing and final ChatResponse assembly, preserving the caller-initialized response id and
  provider model, finish reason, normalized usage, response headers and reverse tool names. Reuse content and usage
  projections; errors retain source status, headers, error payload projection and message details named below.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig.transform_parsed_response L2584-L2688; AnthropicConfig.get_prefix_prompt L2690-L2707; AnthropicConfig.transform_response
  L2709-L2759; AnthropicConfig.get_error_class L2787-L2792.


  Named case contracts: message_envelope: Use B578 content and B579 usage; replace choices[0].message/finish_reason,
  set created to injected integer current time and model to required response.model. This method does not copy upstream
  id; retain initialized model_response.id. New hidden params contain only B570 additional_headers and provider_specific_fields,
  overwriting the prior map; the temporary original_response assignment is lost in this overwrite. finish_reasons:
  Map required stop_reason through B206 including end_turn/stop_sequence->stop,max_tokens->length,tool_use->tool_calls,refusal->content_filter
  and its unknown-reason warning/fallback. Missing required content/model/usage/stop_reason or missing choices[0]
  retains source structural failure, not a fabricated AnthropicError. reverse_tool_name: Read litellm_params._anthropic_tool_name_map
  only when both maps are dicts; apply only matching string function.name on extracted tool dicts before building
  provider fields and JSON-mode selection. Nonmatching names and other function fields unchanged; no cross-request
  map lookup. json_mode_message: Mixed JSON tool extra text appends to normal/prefix text with no delimiter; empty
  merged text becomes None. Pure internal JSON-tool message replaces the constructed message, losing its attached
  thinking/provider fields on that message, mutates completion_response.stop_reason=stop and yields stop; hidden
  provider_specific_fields still retained. prefix_prompt: Only last message role=assistant, truthy prefix and string
  content supplies prefix, including empty string. Prepend when prefix not None, output does not already start with
  it, and global litellm.disable_add_prefix_to_prompt is false (defaultfalse). Earlier messages/list content ignored;
  existing prefix never duplicated. malformed_response_json: Any exception from raw_response.json raises AnthropicError
  with original status (even200), raw headers and Unable to get json response - <error>, Original Response: <text>.
  Logging B190 post_call occurs first with request/messages/raw reply. upstream_anthropic_error: Any error key in
  parsed body including None/empty raises AnthropicError with str(error), raw status even200 and headers; B570 additional-header
  preparation precedes this check. get_error_class returns AnthropicError with supplied message/status/headers without
  reclassification.


  Load disable_add_prefix_to_prompt through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest anthropic_reply_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-anthropic/src/response.rs with adjacent tests under response/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function response_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  message_envelope, finish_reasons, reverse_tool_name, json_mode_message, prefix_prompt, malformed_response_json,
  upstream_anthropic_error. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_response* using HelperCase: kind: helper
  and the externally tagged anthropic_response variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_anthropic_response that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_anthropic_reply consumes Messages response JSON bytes in crates/betterlite-anthropic/src/response.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_response.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_response.
  The adjacent test replays_the_anthropic_response_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 154 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 205 production lines, 225 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 25 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 640 planned, 650 maximum changed lines.
