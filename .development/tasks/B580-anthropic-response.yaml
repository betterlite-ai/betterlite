    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::response_cases::case_[0-9]+_reverse_tool_name$/)'
  - id: case-json-mode-message
    why: Mixed JSON tool extra text appends to normal/prefix text with no delimiter; empty merged text becomes None.
      Pure internal JSON-tool message replaces the constructed message, losing its attached thinking/provider fields
      on that message, mutates completion_response.stop_reason=stop and yields stop; hidden provider_specific_fields
      still retained.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::response_cases::case_[0-9]+_json_mode_message$/)'
  - id: case-prefix-prompt
    why: Only last message role=assistant, truthy prefix and string content supplies prefix, including empty string.
      Prepend when prefix not None, output does not already start with it, and global litellm.disable_add_prefix_to_prompt
      is false (defaultfalse). Earlier messages/list content ignored; existing prefix never duplicated.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::response_cases::case_[0-9]+_prefix_prompt$/)'
  - id: case-malformed-response-json
    why: 'Any exception from raw_response.json raises AnthropicError with original status (even200), raw headers
      and Unable to get json response - <error>, Original Response: <text>. Logging B190 post_call occurs first
      with request/messages/raw reply.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::response_cases::case_[0-9]+_malformed_response_json$/)'
  - id: case-upstream-anthropic-error
    why: Any error key in parsed body including None/empty raises AnthropicError with str(error), raw status even200
      and headers; B570 additional-header preparation precedes this check. get_error_class returns AnthropicError
      with supplied message/status/headers without reclassification.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::response_cases::case_[0-9]+_upstream_anthropic_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_response.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_response*")"
      && grep -lq 'anthropic_response' tools/oracle/fuzz/corpus/helper_case/anthropic_response* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_response$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-anthropic/fuzz/corpus/anthropic_response)"
      && grep -q 'decode_anthropic_reply' crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_response.rs &&
      cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::replays_the_anthropic_response_corpus$/)'
  - id: config-disable-add-prefix-to-prompt
    why: disable_add_prefix_to_prompt lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::anthropic_reply_config_cases::case_[0-9]+_loads_disable_add_prefix_to_prompt$/)'
