pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_response in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/response.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_response.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The final hidden-params replacement discards original_response and previous hidden metadata.
- Provider id is never copied in this transform, and a pure JSON-tool message replaces the richer constructed message.
