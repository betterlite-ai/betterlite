    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::response_cases::case_[0-9]+_message_envelope$/)'
  - id: case-finish-reasons
    why: Map required stop_reason through B206 including end_turn/stop_sequence->stop,max_tokens->length,tool_use->tool_calls,refusal->content_filter
      and its unknown-reason warning/fallback. Missing required content/model/usage/stop_reason or missing choices[0]
      retains source structural failure, not a fabricated AnthropicError.
