  - mutants
  commands:
  - id: case-message-envelope
    why: The message-envelope behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::response_cases::case_[0-9]+_message_envelope$/)'
  - id: case-finish-reasons
    why: The finish-reasons behavior is missing or differs from its pinned fixture.
