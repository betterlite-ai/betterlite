dod:
  - text: Perplexity citations and NVIDIA token-limit mapping survive the booted chat path, including a provider 429.
    proof: [chat-cases, oracle]
  - text: Perplexity signed embeddings and NVIDIA and Together shared-client embedding requests have differential HTTP coverage.
    proof: [embedding-cases, oracle]
  - text: Together and Fireworks select text completion while all three rerank providers use their own request and response transformations.
    proof: [completion-rerank-cases, oracle]
  - text: Groq audio upload reaches transcription, srt is rejected before transport, and unauthenticated requests send nothing upstream.
    proof: [audio-cases, oracle]
checks:
  optional: []
  commands:
    - id: chat-cases
      why: The missing hosted chat HTTP fixtures must be new and both present.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/hosted-platform-remainder)" && test -f tools/oracle/cases/http/hosted-platform-remainder/perplexity-chat-citations.yaml && test -f tools/oracle/cases/http/hosted-platform-remainder/nvidia-chat-token-limit.yaml
    - id: embedding-cases
      why: Neither the signed embedding response nor the provider extra-body path may be omitted.
      run: test -f tools/oracle/cases/http/hosted-platform-remainder/perplexity-embedding-int8.yaml && test -f tools/oracle/cases/http/hosted-platform-remainder/nvidia-embedding-options.yaml
    - id: completion-rerank-cases
      why: Each previously helper-only completion and ranking family needs its own live-route case.
      run: test -f tools/oracle/cases/http/hosted-platform-remainder/together-completion.yaml && test -f tools/oracle/cases/http/hosted-platform-remainder/fireworks-completion.yaml && test -f tools/oracle/cases/http/hosted-platform-remainder/together-rerank.yaml && test -f tools/oracle/cases/http/hosted-platform-remainder/fireworks-rerank.yaml && test -f tools/oracle/cases/http/hosted-platform-remainder/nvidia-rerank.yaml
    - id: audio-cases
      why: The Groq multipart and pre-transport rejection regression is absent on the base branch.
      run: test -f tools/oracle/cases/http/hosted-platform-remainder/groq-transcription.yaml
oracle_cases:
  - tools/oracle/cases/http/hosted-platform-remainder/perplexity-chat-citations.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/nvidia-chat-token-limit.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/perplexity-embedding-int8.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/nvidia-embedding-options.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/together-completion.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/fireworks-completion.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/together-rerank.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/fireworks-rerank.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/nvidia-rerank.yaml
  - tools/oracle/cases/http/hosted-platform-remainder/groq-transcription.yaml
deviations: []
out_of_scope:
  - All functions in the referenced provider files remain B5831, B5832, B5833, B5834, B5837, B6070 and B6120 implementations; this task adds their HTTP proofs only.
  - B8310 owns _complete_fireworks_ai, _complete_together_ai, _complete_groq, _complete_cloudflare and the Fireworks and Perplexity embedding arms; B044 owns the shared NVIDIA and Together embedding arm, and B024 the OpenAI-compatible chat arm.
  - B1079 owns rerank credential and base selection, B2454 its shared HTTP transport, B2238 text completion transport and B2453 native transcription transport.
  - B014, B006, B202, B083 and B085 retain the handlers; B8636 installs the router-backed rerank port, and B8610 owns the application composition root.
  - Provider billing formulas, model catalogs, helper cases, native unit tests and NVIDIA passthrough HTTP cases stay with their existing owners; B8606 already proves the NVIDIA passthrough mount.
pitfalls:
  - Perplexity's embedding URL appends /v1/embeddings without trimming, so a mock base already ending in /v1 tests a different URL.
  - A NVIDIA retrieval model uses llama-3_2 in its URL but llama-3.2 in its body; normalizing both hides a real dispatch regression.
  - Groq srt is a handled UnsupportedParamsError with status 400, not a malformed-upload test.
  - Fireworks rerank accepts a nonempty data array, whereas Together expects results; sharing one generic mock body can bypass the transform being proved.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
