id: B9210
title: Prove hosted platform transforms through inference HTTP routes
description: >-
  B8310 supplies the hosted-platform dispatch and proves Fireworks, Together, Groq and
  Cloudflare chat plus Fireworks embeddings. Its case list omits Perplexity and NVIDIA
  chat, their embeddings, text completion, rerank and Groq transcription. Add the missing
  HTTP oracle fixtures under tools/oracle/cases/http/hosted-platform-remainder. This is
  fixture work over the booted gateway, with no provider implementation, helper adapter,
  new parser or route registration. The Python functions below remain their parts' code;
  this task owns zero additional LiteLLM implementation lines. Allow about 750 fixture
  lines plus a small audio fixture, using compact deterministic mock records.

  Every case configures general_settings.master_key, one or more model_list deployments
  with litellm_params.model, api_key and api_base pointing to the harness mock, and
  router_settings.num_retries: 0. Keys are fixed dummy strings. Nothing may contact a
  provider's public default base. Use the ordinary HTTP case schema, including steps for
  related calls, and B2400's existing body_kind: multipart for audio. Do not add kind:
  helper to these files. Compare captured upstream paths, parsed bodies and authorization
  and content-type headers, plus client status, JSON and content-type. Stable error type,
  param and code remain compared; ignore only /error/message for betterlite's own wording.
  Supply fixed upstream ids, timestamps and usage so these do not need broad ignores.

  perplexity-chat-citations uses perplexity/sonar. The mock returns content with a Unicode
  prefix and two occurrences of [1], citations, a matching search_results title and
  usage.num_search_queries. The public response must retain both annotations, character
  offsets, citation tokens and web_search_requests. nvidia-chat-token-limit uses
  nvidia_nim/nvidia/nemotron-4-340b-instruct with max_completion_tokens and proves the
  upstream receives max_tokens instead. Include an upstream 429 step with retries disabled
  so the provider-specific error reaches the HTTP envelope.

  perplexity-embedding-int8 uses perplexity/pplx-embed-v1-0.6b, an explicit base without
  /v1, encoding_format float and a mock base64 embedding containing bytes 0, 127 and 129;
  the response vector is [0, 1, -1], with total_tokens populated. nvidia-embedding-options
  uses nvidia_nim/nvidia/nv-embedqa-e5-v5 with input_type query and truncate END, proving
  extra_body is flattened by the shared OpenAI embedding call. Together embeddings use
  that same branch: include together_ai/BAAI/bge-base-en-v1.5 as another step in this case.

  together-completion uses together_ai/meta-llama/Meta-Llama-3.1-8B and a one-string prompt
  list; capture a scalar upstream prompt and a text_completion response. fireworks-completion
  uses fireworks_ai/accounts/fireworks/models/llama-v3p1-8b-instruct with a scalar prompt
  and guided_json in extra_body, proving text-completion selection and the translated
  response_format. Do not route either case through a fake chat response or a helper.

  The three rerank cases use query and two string documents. together-rerank uses
  together_ai/Salesforce/Llama-Rank-V1 and verifies the /rerank suffix and usage copied
  into both metadata records. fireworks-rerank uses fireworks_ai/qwen3-reranker-8b,
  capturing model fireworks/qwen3-reranker-8b and the /inference/v1/rerank suffix, and
  converts a nonempty data array with document strings. nvidia-rerank uses
  nvidia_nim/nvidia/llama-3_2-nv-rerankqa-1b-v2, top_n: 1 and truncate END; capture
  /v1/retrieval/nvidia/llama-3_2-nv-rerankqa-1b-v2/reranking, a body model with 3.2,
  passages and top_k, and convert rankings[].logit with original document text. Supply
  positive total_tokens so fallback billing counts do not obscure the routing proof.

  groq-transcription uses groq/whisper-large-v3 and a small committed WAV fixture with
  language en and response_format verbose_json. Follow success with response_format srt
  under drop_params false: LiteLLM rejects it with status 400 before an upstream request.
  A final request with no proxy Authorization must stop at auth and send nothing upstream.
  Reuse existing fixture support; no decoder is introduced here.

  Routes already exist in their owners. Chat has POST /v1/chat/completions,
  /chat/completions, /engines/{model:path}/chat/completions and
  /openai/deployments/{model:path}/chat/completions. Completion and embeddings have the
  same four prefix forms with /completions and /embeddings. Rerank has POST /v2/rerank,
  /v1/rerank and /rerank; transcription has POST /v1/audio/transcriptions and
  /audio/transcriptions. Distribute these aliases across the listed cases and use steps
  where needed to exercise each alias once; the path model is the configured deployment
  alias. No /openai/v1 alias or provider-prefixed inference route is invented.
scope:
  paths:
    - tools/oracle/cases/http/hosted-platform-remainder/**
    - tools/oracle/fixtures/multipart-oracle/hosted-platform-remainder/**
  lint_tables: false
