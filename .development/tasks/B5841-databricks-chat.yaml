    why: Bare assistant check, empty content cleanup and the parallel tool call split.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/databricks/chat/transformation.py#L160-L282
    why: Config, required params, validate_environment, the gateway URL rule, supported params and the thinking param test.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/databricks/chat/transformation.py#L284-L428
    why: Tool conversion, response_format and reasoning_effort mapping, and the fake stream rule.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/databricks/chat/transformation.py#L430-L500
    why: Message transform order and cache_control move.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/databricks/chat/transformation.py#L502-L703
    why: Content, reasoning and citation extraction, choice transform and transform_response.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/databricks/chat/transformation.py#L706-L806
    why: Stream iterator and chunk_parser.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/convert_dict_to_response.py#L374-L416
    why: _handle_invalid_parallel_tool_calls, which has no other owner.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/convert_dict_to_response.py#L533-L542
    why: _should_convert_tool_call_to_json_mode, which has no other owner.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai_like/chat/transformation.py#L154-L168
    why: The parent map_openai_params that swaps max_completion_tokens for max_tokens.
dod:
  - text: get_complete_url, validate_environment and the supported params match LiteLLM, including the two-dot gateway test and the user agent pop order.
    proof: [request-tests, helper-python, oracle]
  - text: map_openai_params matches LiteLLM for claude and non-claude models across tools, response_format, reasoning_effort, thinking and max_completion_tokens.
    proof: [request-tests, helper-python, oracle]
  - text: transform_messages matches LiteLLM, including the parallel tool call split, empty content cleanup and the claude-only skips.
    proof: [message-tests, helper-python, oracle]
  - text: Response and choice transforms match LiteLLM for JSON mode, parallel tool call repair, reasoning blocks, citations and the parse error text.
    proof: [response-tests, reply-corpus, helper-python, oracle]
  - text: The stream chunk parser matches LiteLLM for JSON mode tool calls, the "{}" arguments rule, citations, service_tier and the KeyError message.
    proof: [stream-tests, reply-corpus, helper-python, oracle]
  - text: New helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: request-tests
      why: the URL, headers, supported params or map_openai_params tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^databricks_chat::request::/)'
    - id: message-tests
      why: the message transform or tool call split tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^databricks_chat::messages::/)'
    - id: response-tests
      why: the response or choice transform tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^databricks_chat::response::/) - test(replays_the_databricks_chat_reply_corpus)'
    - id: stream-tests
      why: the stream chunk parser tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^databricks_chat::stream::/)'
    - id: reply-corpus
      why: the chat reply fuzz target or its fresh replay corpus is missing
      run: >-
        test -f crates/betterlite-provider/fuzz/fuzz_targets/databricks_chat_reply.rs &&
        grep -q 'name = "databricks_chat_reply"' crates/betterlite-provider/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/databricks_chat_reply)" &&
        cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_databricks_chat_reply_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5841)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5841 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5841/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added Databricks chat helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/databricks_chat-*")" &&
        grep -lE '^[[:space:]]+b5841:' tools/oracle/fuzz/corpus/helper_case/databricks_chat-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/databricks-chat/url-and-headers.yaml
  - tools/oracle/cases/helpers/databricks-chat/map-params-claude.yaml
  - tools/oracle/cases/helpers/databricks-chat/map-params-other-models.yaml
  - tools/oracle/cases/helpers/databricks-chat/messages-and-tool-split.yaml
  - tools/oracle/cases/helpers/databricks-chat/response-json-mode-and-parallel-calls.yaml
  - tools/oracle/cases/helpers/databricks-chat/response-reasoning-and-citations.yaml
  - tools/oracle/cases/helpers/databricks-chat/stream-chunks.yaml
deviations:
  - what: A tool message without tool_call_id next to a multi-call assistant message leaves the whole group untouched.
    why: LiteLLM raises a raw KeyError on that history inside _split_parallel_tool_calls, which the proxy turns into a generic 500. Malformed history is better sent on unchanged.
  - what: _handle_invalid_parallel_tool_calls and _should_convert_tool_call_to_json_mode are built privately in databricks_chat.
    why: No backlog entry owns convert_dict_to_response.py, and Databricks is the only caller in this folder. They keep LiteLLM's exact behavior.
out_of_scope:
  - B5980 owns databricks_auth (get_api_base, databricks_validate_environment, redaction), embeddings, Responses and pricing.
  - B1427 already built databricks/streaming_utils.py. Chat does not use the legacy OpenAI-like iterator.
  - B1428 owns the OpenAI-like chat execution and the fake-stream handling that reads should_fake_stream. B2214 owns BaseModelResponseIterator.
  - B8330 owns the call to this module (the _complete_databricks route, the HTTP handler, DATABRICKS_* environment reads), provider registration in dispatch and the HTTP oracle cases.
  - The Anthropic helpers named above stay with B575, B574, B569 and B2221. Only their calls are made here.
pitfalls:
  - The claude test is a case-sensitive substring on the model name, while _uses_anthropic_thinking_param lowercases and swaps "." for "-" first. "Claude-3" is not claude in one and is in the other.
  - The AI gateway test counts dots in the model after removing "databricks/", so "databricks-meta-llama-3.1" has one dot and stays off, and a name like "a.b.c" turns it on.
  - The base is trimmed of trailing slashes only when the gateway is on. A plain base keeps its slash and gets "//chat/completions".
  - should_fake_stream is true for any non-None response_format, claude or not, even though only claude models build the json tool.
  - response_format is popped from optional_params in all cases, so a non-claude model silently loses it.
  - A tool-call arguments value of exactly "{}" becomes "" in the stream only when json_mode is off. In json mode the conversion path handles it.
  - The json-mode stream state is the last function name seen, so a chunk with arguments but no name relies on the earlier chunk.
  - service_tier is skipped when it is "" or not a string, not only when it is missing.
  - The split keeps original assistant fields on the first expanded message only. Later ones carry just role and tool_calls.
  - max_completion_tokens always wins over a max_tokens in the same call. Its value is written to max_tokens and the old key is removed.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
