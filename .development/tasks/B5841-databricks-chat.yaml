id: B5841
title: Databricks chat completions request, response and stream transforms
description: >-
  Build the Databricks chat transforms in betterlite-provider as one module, databricks_chat
  (litellm/llms/databricks/chat/transformation.py), with pure functions and no network call. The module needs
  betterlite-provider to depend on betterlite-anthropic for the Claude tool and thinking mapping (betterlite-anthropic
  depends on betterlite-openai, not on provider, so this forms no cycle). Credentials and the base URL are plain
  arguments. Auth, embeddings, Responses and pricing are B5980 and chat calls its databricks_auth module.

  Request URL and headers. get_complete_url(api_base, model, ...) sets use_ai_gateway when the model, after removing a
  leading "databricks/", contains two or more "." characters. It takes the base through get_api_base (B5980) with that
  flag, trims trailing slashes only when the gateway is on, and appends "/chat/completions". validate_environment pops
  user_agent from optional_params; when that value is empty or absent it pops databricks_user_agent (the Python "or"
  short-circuits, so a non-empty user_agent leaves databricks_user_agent in place), then the user_agent in
  litellm_params, then the env override. It calls databricks_validate_environment with chat_completions and
  custom_endpoint false (the URL it returns is discarded) and sets Content-Type to application/json.

  Supported params: stream, stop, temperature, top_p, max_tokens, max_completion_tokens, n, response_format, tools,
  tool_choice, reasoning_effort, thinking. get_required_params and get_config follow L194-L209 and L160-L192.

  map_openai_params(non_default_params, optional_params, model, drop_params). Step 1: compute is_thinking_enabled
  (B2202) on the incoming params. Step 2: run the OpenAI-like parent mapping, which is the OpenAI base policy (B668)
  followed by swapping max_completion_tokens for max_tokens (B1425). Step 3: for a model whose name contains "claude"
  (case-sensitive), run translate_legacy_thinking_for_adaptive_model (B569) with provider databricks. Step 4: map tools
  through _map_openai_to_dbrx_tool: a non-claude model passes the tools through; a claude model maps them with the
  Anthropic _map_tools (B575) and converts each result back with convert_anthropic_tool_to_databricks_tool (L284-L302).
  Step 5: response_format on a claude model builds a json tool with map_response_format_to_anthropic_tool (B574),
  merges it into optional_params tools (_add_tools_to_optional_params, B2202), sets json_mode true and, when thinking is
  off, tool_choice to the function json_tool_call (the name RESPONSE_FORMAT_TOOL_NAME). response_format is popped from
  optional_params in every case. Step 6: reasoning_effort on a model where _uses_anthropic_thinking_param is true
  (lowercase the model, replace "." with "-"; true when it contains "claude" or supports_anthropic_thinking_payload,
  B2221, says so) goes through _map_reasoning_effort (B569): a result sets thinking; None pops thinking and
  output_config. For an adaptive model it also sets output_config.effort from REASONING_EFFORT_TO_OUTPUT_CONFIG_EFFORT
  or raises through _raise_invalid_reasoning_effort. reasoning_effort is popped. Step 7: finish with
  update_optional_params_with_thinking_tokens (B2202). should_fake_stream returns true whenever response_format is not
  None, on any model.

  Messages. transform_messages(messages, model) dumps every message without None fields, strips name from every role
  except user (B218), strips LiteLLM internal fields (B219), moves a message-level cache_control into a text content
  block when the content is a string (L477-L500), runs _sanitize_empty_content (L71-L96), drops assistant messages that
  have no content, tool_calls or function_call, and for a model without "claude" in its name runs
  merge_consecutive_system_messages (B179) and then _split_parallel_tool_calls (L99-L148). It ends by calling the OpenAI
  base _transform_messages (B668). _split_parallel_tool_calls looks at an assistant message with two or more
  tool_calls and the run of tool messages right after it. When the tool message count equals the call count and the
  tool_call_id set equals the call id set, it emits one assistant message per call, each followed by its tool message;
  the first keeps the original assistant fields, later ones are exactly {role: assistant, tool_calls: [call]}. Any other
  shape is left untouched.

  Response. transform_response parses the body into a Databricks response type. A parse failure becomes
  DatabricksError with the response status, the response headers and the message "Unable to get json response - {error},
  Original Response: {text}". The model name becomes "{custom_llm_provider or "databricks"}/{response model or ""}",
  and id, created and usage come from the body. The request data is logged through redact_sensitive_data (B5980) with
  api_key set to "[REDACTED]". Each choice goes through _transform_dbrx_choices (L580-L641): first
  _handle_invalid_parallel_tool_calls replaces a "multi_tool_use.parallel" call by its inner tool calls with ids
  "{id}_{index}" and returns the originals when the arguments are not valid JSON; then, when json_mode is on and the
  message has exactly one tool call named json_tool_call, the arguments string becomes the content, tool_calls is
  empty and finish_reason is "stop" (_should_convert_tool_call_to_json_mode, L533-L542 of convert_dict_to_response.py).
  Otherwise the content is split with extract_content_str (L502-L518) and extract_reasoning_content (L520-L551): items
  of type "reasoning" with summary[].text become thinking_blocks (signature defaults to ""), text items form the
  content, and extract_citations (L566-L578) puts citations in provider_specific_fields.citations.
  resolve_reasoning_and_content (L557-L564) falls back to _extract_reasoning_content (B220) when the blocks give none.

  Stream. get_model_response_iterator builds DatabricksChatResponseIterator with the sync flag and json_mode.
  chunk_parser(chunk) (L706-L806) works as follows. With json_mode on and a tool_calls delta, it remembers the last
  function name seen; when that name is json_tool_call it converts through _convert_tool_response_to_message (B2214),
  puts the arguments in delta.content (an empty "{}" becomes "") and sets tool_calls to None. Without json_mode, a
  tool-call arguments value of exactly "{}" becomes "". A list content yields the text, reasoning_content from the
  blocks (or the top-level field) and thinking_blocks; the first citation goes to delta.provider_specific_fields.citation.
  service_tier is copied only when it is a non-empty string. A missing key becomes DatabricksError 400 with
  "KeyError: {error}, Got unexpected response from Databricks: {chunk}". The base iterator and line splitting are B2214
  and B1427 and are not rebuilt.

  The response body and stream chunk come from the network, so add a cargo-fuzz target named databricks_chat_reply in
  crates/betterlite-provider/fuzz that feeds arbitrary bytes to the response decoder and the chunk parser, plus a check
  that replays its corpus.

  Sizing: about 500 logic lines in chat/transformation.py plus about 60 for the two convert_dict_to_response.py helpers
  built here. Plan 560 transform lines, 450 tests, 130 for the fuzz target and exports and 200 for helper adapters.
scope:
  paths:
    - crates/betterlite-provider/src/databricks_chat.rs
    - crates/betterlite-provider/src/databricks_chat/**
    - crates/betterlite-provider/Cargo.toml
    - crates/betterlite-provider/fuzz/Cargo.toml
    - crates/betterlite-provider/fuzz/fuzz_targets/databricks_chat_reply.rs
    - crates/betterlite-provider/fuzz/corpus/databricks_chat_reply/**
    - tools/oracle/cases/helpers/databricks-chat/**
    - "tools/oracle/fuzz/corpus/helper_case/databricks_chat-*"
    - tools/oracle/helpers/b5841.py
    - tools/oracle/helpers/b5841/**
    - tools/oracle/src/helpers/provider/b5841.rs
    - tools/oracle/src/helpers/provider/b5841/**
  lint_tables: false
references:
