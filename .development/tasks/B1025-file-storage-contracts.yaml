id: B1025
title: Database file storage and batch body bridge
description: >-
  Define BaseFileStorageBackend's native upload/download/delete contract and implement
  LiteLLMDbStorageBackend through B726's ManagedFileContentRepository. Put these operations and
  batch_records.py's complete Responses-to-chat adapter in betterlite-core::api::file_storage_contracts.
  The contract defaults path_prefix=null, file_naming_strategy=uuid and delete to a no-op. Database
  upload stores only file_content and returns litellm_db:// plus the row id; filename, MIME, naming
  strategy and prefix are deliberately unused. Database delete is B726's idempotent row deletion.

  Move the complete get_storage_backend factory to B1027, above both concrete backends. Keeping it
  here would call B1026, which depends on this storage contract. No dependency may point back from
  a backend to its factory. This task owns no storage_backend_factory.py function after that move.

  responses_batch_body_to_chat_body selects only keys in ResponsesAPIOptionalRequestParams, obtains
  input separately, passes metadata separately and delegates the complete transform to B908. It
  does not validate required nested TypedDict fields, forward arbitrary keys or call a provider.
  B908 remains responsible for input/tool conversion; do not duplicate B909's implementation.

  Native tests under api::file_storage_contracts::tests exercise a deterministic repository port.
  B171 file_storage_contracts cases cover only pure URI conversion and batch body transforms.
  These typed operations add no parser. The owned spans contain 114 nonblank, non-comment physical
  lines; budget 115 implementation, 110 tests, 75 fixtures, 75 adapters and 25 wiring lines, 400 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_storage_contracts.rs
  - crates/betterlite-core/src/api/file_storage_contracts/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/file_storage_contracts.rs
  - tools/oracle/src/helpers/core_ops/file_storage_contracts/**
  - tools/oracle/helpers/file_storage_contracts.py
  - tools/oracle/helpers/file_storage_contracts/**
  - tools/oracle/fuzz/corpus/helper_case/file_storage_contracts-*
  - tools/oracle/cases/helpers/file-storage-contracts/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/files/storage_backend.py#L11-L74
  why: Owns the abstract byte storage contract, uuid naming default and optional no-op delete.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/files/litellm_db_storage_backend.py#L9-L40
  why: Owns litellm_db URI validation and the repository-backed upload/download/delete methods.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/files/batch_records.py#L9-L54
  why: Owns the cached request-key set, frozen projection and missing-input check before B908's bridge.
dod:
- text: >-
    database_bytes_lifecycle uploads b"\x00\xff" with filename=a, prefix=p and strategy=timestamp.
    Repository store receives only those two bytes; row id=r yields litellm_db://r. Download returns
    the exact bytes, including an empty stored value, while absent content raises ValueError "No
    stored file content for litellm_db://r". Delete calls the row-id repository operation once and
    repeated deletion succeeds. Repository failures propagate without a rollback invented here.
  proof: [behavior-tests]
- text: >-
    storage_uri_validation maps litellm_db://r to r and litellm_db:// to ""; it does not percent-decode
    litellm_db://a%2Fb. https://example.invalid/r and LITELLM_DB://r raise ValueError "Not a
    litellm_db storage url: <input>". These pure failures have no HTTP status/type/param/code.
    default_delete_noop proves a backend without a delete override performs no I/O and succeeds.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    responses_batch_projection sends model=m,input=hello,instructions=system,max_output_tokens=7,
    temperature=0.2,metadata={tag:a},stream=true and unknown=drop with custom_llm_provider=openai.
    The bridge produces model=m,messages=[{role:system,content:system},{role:user,content:hello}],
    max_tokens=7,temperature=0.2,metadata={tag:a},custom_llm_provider=openai; stream and unknown
    do not appear because this adapter never supplies the bridge's stream argument. Tool records
    lacking strict and image parts lacking detail are forwarded to the bridge without validation.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    responses_batch_missing_input supplies missing or null input with model=m and gets ValueError
    "Batch record for /v1/responses is missing required `input` field: model=m"; absent model prints
    an empty suffix. Empty string input is accepted. Non-string model becomes "" on the transform
    path, while metadata is passed even though it is separate from the filtered optional keys.
    The source mapping is not mutated and repeated calls use the same key vocabulary.
  proof: [behavior-tests, oracle, helper-python]
- text: Pure storage/bridge fixtures and the helper tag are independently executable.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: database byte preservation or batch bridge input filtering is untested
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_contracts::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: storage URI and bridge adapter is absent or invalid
    run: test -f tools/oracle/helpers/file_storage_contracts.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the storage contract helper tag has no new seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_storage_contracts-*)" && grep -qE '^[[:space:]]+file_storage_contracts:' tools/oracle/fuzz/corpus/helper_case/file_storage_contracts-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no storage URI or batch bridge cases were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-storage-contracts)"
oracle_cases:
- tools/oracle/cases/helpers/file-storage-contracts/storage-uri-validation.yaml
- tools/oracle/cases/helpers/file-storage-contracts/responses-batch-projection.yaml
- tools/oracle/cases/helpers/file-storage-contracts/responses-batch-missing-input.yaml
deviations: []
out_of_scope:
- B1027 owns get_storage_backend in storage_backend_factory.py, and B1026 owns every Azure backend method.
- B726 owns ManagedFileContentRepository and the Prisma schema; B908 owns Responses-to-chat field transformation.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_storage_contracts in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_storage_contracts.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_storage_contracts.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- litellm_db:// with an empty row id passes prefix validation; the repository determines whether content exists.
- A stored empty byte array is a successful download, distinct from a missing row.
- stream in a Responses batch body is filtered into options but never passed as the bridge's explicit stream argument.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
