checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_contracts::/)
      - test(/::replays_corpus$/)'
  - id: case-db-storage-upload-download
    why: the db-storage-upload-download behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_contracts::tests::db_storage_upload_download($|::)/)'
  - id: case-db-storage-delete
    why: the db-storage-delete behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_contracts::tests::db_storage_delete($|::)/)'
  - id: case-unknown-storage-backend
    why: the unknown-storage-backend behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_contracts::tests::unknown_storage_backend($|::)/)'
  - id: case-responses-batch-body-projection
    why: the responses-batch-body-projection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_storage_contracts::tests::responses_batch_body_proj_d06d($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_storage_contracts.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_storage_contracts-*)"
      && grep -qE "^[[:space:]]+file_storage_contracts:" tools/oracle/fuzz/corpus/helper_case/file_storage_contracts-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-storage-contracts)"
