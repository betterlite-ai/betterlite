id: B1025
title: File storage contracts
description: >-
  Define the closed managed-file storage backend enum and implement pinned database-backed upload/download/delete
  using B051. Expose typed storage references that cannot be confused with arbitrary URLs, and adapt Responses batch
  bodies using the existing Responses-to-chat converters.


  Implement crates/betterlite-core/src/api/file_storage_contracts.rs. Use FileStorageContractsInput and FileStorageContractsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions db_storage_upload_download, db_storage_delete, unknown_storage_backend,
  responses_batch_body_proj_d06d under api::file_storage_contracts::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileStorageContracts in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_storage_contracts: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/files/storage_backend.py: BaseFileStorageBackend.upload_file (L20-L43);
  litellm/llms/base_llm/files/storage_backend.py: BaseFileStorageBackend.download_file (L46-L58); litellm/llms/base_llm/files/storage_backend.py:
  BaseFileStorageBackend.delete_file (L60-L72); litellm/llms/base_llm/files/storage_backend_factory.py: get_storage_backend
  (L21-L51); litellm/llms/base_llm/files/litellm_db_storage_backend.py: storage_url_to_row_id (L13-L16); litellm/llms/base_llm/files/litellm_db_storage_backend.py:
  LiteLLMDbStorageBackend.__init__ (L20-L21); litellm/llms/base_llm/files/litellm_db_storage_backend.py: LiteLLMDbStorageBackend.upload_file
  (L23-L31); litellm/llms/base_llm/files/litellm_db_storage_backend.py: LiteLLMDbStorageBackend.download_file (L33-L37);
  litellm/llms/base_llm/files/litellm_db_storage_backend.py: LiteLLMDbStorageBackend.delete_file (L39-L40); litellm/llms/base_llm/files/batch_records.py:
  _frozen_mapping (L9-L10); litellm/llms/base_llm/files/batch_records.py: _responses_request_keys (L14-L15); litellm/llms/base_llm/files/batch_records.py:
  responses_batch_body_to_chat_body (L18-L54). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 99 owned nonblank/non-comment/non-docstring Python lines (169 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 119 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 351 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B908 (Responses chat options), B909
  (Responses input messages), B1087 (Api boundaries), B726 (Managed resources and transaction repositories), B858
  (Typed managed-resource and analytics rows). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
