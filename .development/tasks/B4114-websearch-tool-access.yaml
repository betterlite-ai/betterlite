dod:
  - text: >-
      select_from_list returns the entry whose search_tool_name equals the configured name, falls back to the first entry when the name is unset or unmatched, and returns None for an empty list; select_from_router returns None when the router or list is absent.
    proof: [search-tool-access-tests, oracle]
  - text: >-
      selected_search_tool_name returns None for a missing tool, a missing name or an empty name, and the name otherwise.
    proof: [search-tool-access-tests]
  - text: >-
      caller_from_kwargs finds user_api_key_auth in kwargs.metadata, then kwargs.litellm_metadata, then litellm_params.metadata, then litellm_params.litellm_metadata, skips blocks where it is null, and returns None for empty kwargs.
    proof: [search-tool-access-tests, oracle]
  - text: >-
      parent_correlation takes the first non-empty string for session_id, trace_id and parent_request_id in the documented scope-then-metadata order, reads parent_request_id only from litellm_call_id, ignores non-string values, and returns all None for empty kwargs even when a caller is given.
    proof: [search-tool-access-tests, oracle]
  - text: >-
      The parent span comes from the first metadata block with a non-null litellm_parent_otel_span, then from the caller, else None; as_search_metadata and as_search_kwargs list only set values in the documented order.
    proof: [search-tool-access-tests, oracle]
  - text: >-
      authorize skips when the tool name is empty or no caller is found, runs check_key before load_team and check_team, skips the team steps when team_id is empty or absent, and returns the first port error without calling later steps.
    proof: [search-tool-access-tests]
  - text: >-
      build_search_request_metadata merges sanitized key metadata, correlation entries, model_group, user_api_key and user_api_key_auth in that order, with later keys overriding earlier ones.
    proof: [search-tool-access-tests]
