deviations:
  - what: The search tool list, hook kwargs and caller are typed records (SearchToolConfig, SearchHookKwargs, SearchCaller) instead of loose dicts and a Python key object, and a router without a search_tools list is an absent Option.
    why: Rust has no attribute probing or duck typing; the declared shapes are the ones LiteLLM's own TypedDict views use. A kwargs value of a different type than declared is out of scope per docs/compatibility.md.
  - what: The parent OpenTelemetry span is an opaque ParentOtelSpan handle that the tracing crate converts at wiring time.
    why: The Python span is an arbitrary object that this module only passes along.
  - what: Authorization and spend metadata reach B749, B737 and B1106 through two ports (SearchToolGrants, SearchMetadataSource) wired by the server.
    why: betterlite-auth and betterlite-core sit above this crate's allowed dependencies, so a direct call would risk a cycle. Behavior and call order are the same as LiteLLM's.
out_of_scope:
  - "_execute_search, the litellm.asearch call and the Perplexity fallback (B4115 owns them and calls this module)."
  - "can_key_call_search_tool, can_team_call_search_tool and the ProxyException they raise (B749); get_team_object (B737); get_logged_api_key and get_sanitized_user_information_from_key (B1106)."
  - "The logger constructor, from_config_yaml and where search_tool_name comes from (B4116)."
  - "Writing the server wiring that implements SearchToolGrants and SearchMetadataSource; B8634 writes it (KeySearchGrants and KeySearchMetadata)."
pitfalls:
  - A configured search_tool_name that matches nothing is not an error. The selection logs a debug line and returns the first tool, the same as when no name is set.
  - parent_correlation returns all None for empty kwargs without reading the caller, so the caller's parent_otel_span is not used in that case.
  - parent_request_id reads only litellm_call_id from the scopes; there is no metadata key for it.
  - Session and trace ids come from both scopes' litellm_session_id and litellm_trace_id before any metadata block's session_id and trace_id, and empty or non-string values are skipped, not taken.
  - The metadata blocks are searched as metadata then litellm_metadata, first in kwargs and then in litellm_params. litellm_params only counts when it is a map.
  - The caller lookup skips a block whose user_api_key_auth is null and keeps looking in the next block.
  - authorize loads the team only when team_id is a non-empty string, and check_key runs even when there is no team.
  - In the merged metadata, model_group, user_api_key and user_api_key_auth come last and win over same-named keys from the sanitized key metadata or the correlation.
review_level: security
