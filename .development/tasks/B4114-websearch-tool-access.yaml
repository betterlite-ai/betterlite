id: B4114
title: Search tool selection authorization and parent attribution
description: >-
  Build the part of the web search interception handler that picks the search tool for an intercepted search, checks that the caller may use it, and ties the search to the request that caused it.
  Put it in crates/betterlite-websearch/src/search_tool_access.rs (with submodules under search_tool_access/ and adjacent tests). B4115 calls it from its search execution; nothing here runs a search.

  Why it exists: when a model asks for a web search, the gateway runs the search itself. LiteLLM then has to (1) choose one of the router's configured search tools, (2) refuse the search if the key or team behind the request is not allowed that tool, and (3) log the search under the same key, team, session and trace as the original request so its cost lands on the right owner.

  Build these pieces, all plain Rust types and functions with no Python-style maps in the public API.

  Tool selection. `SearchToolConfig { search_tool_name: Option<String>, search_provider: Option<String>, litellm_params: the remaining params as a serde_json::Map }` mirrors one entry of the router's search_tools list. `SearchToolSelector::new(search_tool_name: Option<String>)` holds the logger's configured name (B4116 owns where it comes from). `select_from_router(Option<&[SearchToolConfig]>)` returns None when the router or its list is absent or empty. Otherwise `select_from_list` returns the first entry whose `search_tool_name` equals the configured name. If a name is configured but nothing matches, or no name is configured, it returns the first entry. It writes the same tracing debug lines as LiteLLM (found, not found and falling back, using first available), and the source label is "router". `selected_search_tool_name(Option<&SearchToolConfig>)` returns the name only when it is a non-empty string.

  Caller lookup. The hook kwargs reach the handler as a loose dict. Model them as `SearchHookKwargs` with typed optional fields: `metadata`, `litellm_metadata`, `litellm_params` (itself holding `metadata` and `litellm_metadata`), `litellm_session_id`, `litellm_trace_id`, `litellm_call_id`. Each metadata block is `HookMetadata` with optional `user_api_key_auth: SearchCaller`, `session_id`, `trace_id` and `litellm_parent_otel_span`. `SearchCaller { team_id: Option<String>, parent_otel_span: Option<ParentOtelSpan> }` is the slice of the authenticated key object this module reads; `ParentOtelSpan` is an opaque newtype the tracing crate's span handle converts into at wiring time. `caller_from_kwargs(Option<&SearchHookKwargs>)` looks for a non-null `user_api_key_auth` in this order: kwargs.metadata, kwargs.litellm_metadata, then (only when litellm_params is present) litellm_params.metadata, litellm_params.litellm_metadata. Empty or absent kwargs give None.

  Parent correlation. `ParentRequestCorrelation { session_id, trace_id, parent_request_id, parent_otel_span }`, all optional. `parent_correlation(kwargs, caller)` returns all None when kwargs is empty or absent, and does not look at the caller in that case. Otherwise the scopes are kwargs, then litellm_params when present. session_id is the first non-empty string among the scopes' `litellm_session_id`, then every metadata block's `session_id`; trace_id works the same with `litellm_trace_id` and `trace_id`; parent_request_id reads only the scopes' `litellm_call_id`. The metadata blocks are visited as kwargs.metadata, kwargs.litellm_metadata, litellm_params.metadata, litellm_params.litellm_metadata. The span is the first metadata block that has a non-null `litellm_parent_otel_span`, else the caller's own parent_otel_span, else None. `as_search_metadata()` returns an ordered list of the non-None entries in the order session_id, trace_id, parent_request_id, litellm_parent_otel_span. `as_search_kwargs()` returns only `litellm_session_id` and `litellm_trace_id`, when set.

  Authorization. `SearchToolAuthorizer<G>` takes the grants port through its constructor. The port is a trait `SearchToolGrants` owned here, with an associated `Team` type and an associated `Error`: `check_key(name, &SearchCaller)`, `load_team(team_id, parent_otel_span)` returning `Team`, and `check_team(name, &Team)`. The server wires it to B749's can_key_call_search_tool and can_team_call_search_tool and to B737's get_team_object; this crate does not depend on betterlite-auth or betterlite-core, so those crates stay free of a cycle. `authorize(search_tool, kwargs)` does nothing when the tool has no non-empty name or when no caller is found. Otherwise it runs check_key, then, only if the caller's team_id is a non-empty string, load_team and check_team, in that order. The first error stops the sequence and is returned unchanged inside `SearchToolAccessError::Grants(E)`.

  Spend metadata. `SearchMetadataSource` is a second port with `sanitized_key_metadata(&SearchCaller)` and `logged_api_key(&SearchCaller)`; the server wires it to B1106's get_sanitized_user_information_from_key and get_logged_api_key. `build_search_request_metadata(caller, search_tool_name, correlation)` returns `SearchRequestMetadata`, an ordered map that starts with the sanitized key metadata, then the correlation entries, then `model_group` (the tool name, may be null), `user_api_key` (the logged key) and `user_api_key_auth` (the caller). A later key overrides an earlier one with the same name, as in the dict merge.

  Tests: adjacent tests.rs with modules tool_selection, caller_lookup, parent_correlation, tool_authorization and search_metadata under search_tool_access::. Authorization and metadata tests use recording fakes for the two ports and assert the call order.
  Write the helper oracle cases named below for the pure parts (selection, caller lookup, correlation).
