pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_s3_signing in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_s3_signing.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_s3_signing.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Upload destination selection reads litellm_params directly, while download authorization requires a trusted snapshot.
- The standard-AWS URL regex captures query and fragment text as part of the key, while custom-endpoint fallback
  does not.
