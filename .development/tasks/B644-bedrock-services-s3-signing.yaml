id: B644
title: Bedrock S3 signed requests and object upload
description: >-
  Implement native Bedrock S3 upload naming, destination selection, request signing and file metadata. Preserve
  the source distinction between upload destination selection from litellm_params and download authorization through
  trusted snapshots. Reuse shared cloud naming and AWS credential/signing primitives; B595 now owns generic batch-service
  signing, B649 owns batch job names, and B650 owns the common batch error wrapper.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/files/transformation.py:
  _uploaded_object_size L375-L384; BedrockFilesConfig.__init__ L392-L394; BedrockFilesConfig.custom_llm_provider
  L397-L398; BedrockFilesConfig.file_upload_http_method L401-L405; BedrockFilesConfig.validate_environment L407-L423;
  BedrockFilesConfig._get_content_from_openai_file L425-L460; BedrockFilesConfig._get_s3_object_name_from_batch_jsonl
  L462-L478; BedrockFilesConfig.get_object_name L480-L504; BedrockFilesConfig.get_complete_file_url L506-L547; BedrockFilesConfig.get_supported_openai_params
  L549-L550; BedrockFilesConfig.map_openai_params L552-L559; BedrockFilesConfig._sign_s3_request L1110-L1181; BedrockFilesConfig._convert_https_url_to_s3_uri
  L1183-L1235; BedrockFilesConfig.transform_create_file_response L1237-L1263; BedrockFilesConfig.get_error_class
  L1265-L1266.


  Named case contracts: managed_upload_object_name: get_object_name requires extracted content not None or ValueError
  file content is required. For purpose exactly batch, _get_content_from_openai_file uses tuple element1 when supplied,
  retains strings, strictly UTF-8-decodes bytes, and delegates SDK PathLike/current-position file reads to B159.
  Unsupported values fall back to an empty byte string and hence empty text; short tuples retain their index error.
  Parse every nonblank splitlines line with decode_upload_record before choosing the first record; malformed later
  lines still fail. For a nonempty batch, read first.body default {} and model default empty string, remove one
  bedrock/ prefix, replace colon with hyphen, sanitize via B2208 with fallback model, then emit litellm-bedrock-files-{safe_model}-{hyphenated_uuid4}.jsonl.
  For empty/whitespace batch or another purpose, B2208 emits litellm-bedrock-files/{uuid4_hex}-{sanitized_filename},
  with fallback filename file. s3_virtual_and_path_style: Convert upload URLs using case-sensitive re.match patterns
  https://s3\.([^.]+)\.amazonaws\.com/([^/]+)/(.+) and https://([^.]+)\.s3\.([^.]+)\.amazonaws\.com/(.+), in that
  order. On a match percent-decode the captured key once, including query/fragment text captured by .+. Otherwise
  parse URL and split its path after removing all leading slashes at the first slash; require two parts or ValueError
  Unable to parse S3 URL: {url}, without enforcing HTTPS/S3 host or a nonempty key. This fallback excludes parsed
  query/fragment and accepts custom endpoints and China path-style hosts. Dotted virtual-host bucket names do not
  match the second regex. Return s3://{bucket}/{decoded_key} and the final slash component as filename, including
  an empty filename for a trailing slash. s3_signature_service: _sign_s3_request resolves B591 region with model
  empty string and obtains B594 resolve_s3_credentials, including the shared B590 s3_access_key_id/s3_secret_access_key
  pair. Compute lowercase SHA256 hex of exact content UTF-8. Prepare PUT through the source requests preparation
  semantics with Content-Type=application/json,x-amz-content-sha256={hash},Content-Language=en,Cache-Control=private,
  immutable, max-age=31536000, s-maxage=0. B591 get_aws_region_name_for_non_llm_api_calls chooses the signing region;
  S3SigV4Auth signs service s3. Return the AWS request headers and body, decoding bytes as UTF-8, using original
  content only if body is None. Preserve prepared Content-Length and signed bytes for non-ASCII content; do not
  sign a reserialized JSONL document. Missing Python boto3 remains the SDK ImportError Missing boto3 to call bedrock.
  Run 'pip install boto3'.; Rust uses its compiled signing library. kms_encryption_header: A truthy s3_encryption_key_id
  adds exact x-amz-server-side-encryption=aws:kms and x-amz-server-side-encryption-aws-kms-key-id={key} before signing.
  Empty/None omits both. This PUT signer does not add x-amz-expected-bucket-owner; owner headers are applied only
  by the later request paths that actually set them. Reuse B643 KMS/owner resolution without inventing another precedence
  rule. upload_content_size: _uploaded_object_size prefers litellm_params._s3_upload_content_length whenever it
  is a Python int, including bool and negative integers. Otherwise use response Content-Length default string0,
  convert to integer only when isdigit() is true, else0; preserve conversion errors for digit-like strings Python
  int cannot parse. The source response does not normally report uploaded bytes, so B646 must record actual UTF-8
  byte count before this helper. Assert non-ASCII payload length and the fallback separately. create_file_object:
  transform_create_file_response reads truthy litellm_params.upload_url and converts it to S3 id/filename; a missing/falsey
  URL produces empty strings. Construct purpose=batch regardless of original purpose, status=uploaded,object=file,created_at=int(injected
  time.time()), and bytes from _uploaded_object_size. It does not inspect response JSON or enforce HTTP success
  itself. get_error_class delegates B682 preserving status,message,headers. upload_destination: Merge request parameters
  through B596. Upload bucket uses truthy litellm_params.s3_bucket_name then os.getenv AWS_S3_BUCKET_NAME; it does
  not call the trusted-snapshot download helper. Missing bucket raises ValueError S3 bucket_name is required. Set
  's3_bucket_name' in litellm_params or AWS_S3_BUCKET_NAME env var. B2208 splits configured bucket/prefix. Choose
  truthy litellm_params.s3_region_name, then optional_params.s3_region_name, then B591 _get_aws_region_name(merged_params,model).
  Require data.file not None before data.purpose not None, with ValueError file is required or purpose is required;
  empty values are not rejected here. B235 extract_file_data feeds object naming, optional configured prefix is
  prepended, and B2208 encodes the S3 key. Choose truthy merged s3_endpoint_url or https://s3.{region}.{B198 get_aws_dns_suffix(region)},
  strip trailing slashes and append /{bucket}/{encoded_key}. Preserve partition suffixes and source failure order.
  file_config_contract: Constructor creates a zero-state BedrockJsonlFilesTransformation handle and calls B590 BaseAWSLLM.__init__;
  record transformations remain B647/B648. custom_llm_provider is BEDROCK, file_upload_http_method is PUT, supported
  OpenAI params are [], and map_openai_params returns its optional record unchanged. validate_environment copies
  input headers, pops _s3_signed_request_headers from litellm_params, and overlays it only when a Mapping, with
  signed values winning; even a nonmapping value is consumed. This hook performs no fresh credential resolution.


  Load s3_region_name, s3_endpoint_url through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest bedrock_s3_signing_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  s3_region_name and s3_endpoint_url default None and have no additional S3-specific environment-variable fallback
  in these functions. Reuse B643 bucket/KMS loader cases, B590 static S3 credential loader cases and B591 AWS region
  settings. Upload bytes are supplied uploads or explicitly opened SDK files from B159; a request string is content,
  never a filename or URL to fetch.


  Implement crates/betterlite-bedrock/src/s3_signing.rs with adjacent tests under s3_signing/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function s3_signing_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  managed_upload_object_name, s3_virtual_and_path_style, s3_signature_service, kms_encryption_header, upload_content_size,
  create_file_object, upload_destination, file_config_contract. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_signing* using HelperCase:
  kind: helper and the externally tagged bedrock_services_s3_signing variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_s3_signing that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Outside-byte boundary: decode_upload_record consumes uploaded JSONL record bytes used for file metadata in crates/betterlite-bedrock/src/s3_signing.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_s3_signing.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_s3_signing.
  The adjacent test replays_the_bedrock_services_s3_signing_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_s3_signing_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_services_s3_signing_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 257 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 275 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 40 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 780 planned, 800 maximum changed lines.
