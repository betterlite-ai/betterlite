    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_signing*")"
      && grep -lq 'bedrock_services_s3_signing' tools/oracle/fuzz/corpus/helper_case/bedrock_services_s3_signing*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_s3_signing$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_s3_signing)"
      && grep -q 'decode_upload_record' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_s3_signing.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_s3_signing_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_s3_signing_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::bedrock_services_s3_signing_secret_safe_failure$/)'
  - id: case-upload-destination
    why: Merge request parameters through B596. Upload bucket uses truthy litellm_params.s3_bucket_name then os.getenv
      AWS_S3_BUCKET_NAME; it does not call the trusted-snapshot download helper. Missing bucket raises ValueError
      S3 bucket_name is required. Set 's3_bucket_name' in litellm_params or AWS_S3_BUCKET_NAME env var. B2208 splits
      configured bucket/prefix. Choose truthy litellm_params.s3_region_name, then optional_params.s3_region_name,
      then B591 _get_aws_region_name(merged_params,model). Require data.file not None before data.purpose not None,
      with ValueError file is required or purpose is required; empty values are not rejected here. B235 extract_file_data
      feeds object naming, optional configured prefix is prepended, and B2208 encodes the S3 key. Choose truthy
      merged s3_endpoint_url or https://s3.{region}.{B198 get_aws_dns_suffix(region)}, strip trailing slashes and
      append /{bucket}/{encoded_key}. Preserve partition suffixes and source failure order.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_signing_cases::case_[0-9]+_upload_destination$/)'
  - id: case-file-config-contract
    why: Constructor creates a zero-state BedrockJsonlFilesTransformation handle and calls B590 BaseAWSLLM.__init__;
      record transformations remain B647/B648. custom_llm_provider is BEDROCK, file_upload_http_method is PUT, supported
      OpenAI params are [], and map_openai_params returns its optional record unchanged. validate_environment copies
      input headers, pops _s3_signed_request_headers from litellm_params, and overlays it only when a Mapping, with
      signed values winning; even a nonmapping value is consumed. This hook performs no fresh credential resolution.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::s3_signing_cases::case_[0-9]+_file_config_contract$/)'
  - id: config-s3-region-name
    why: s3_region_name lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_s3_signing_config_cases::case_[0-9]+_loads_s3_region_name$/)'
  - id: config-s3-endpoint-url
    why: s3_endpoint_url lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_s3_signing_config_cases::case_[0-9]+_loads_s3_endpoint_url$/)'
