  - crates/betterlite-config/src/types.rs
  - crates/betterlite-config/src/providers.rs
  - crates/betterlite-config/src/providers/bedrock.rs
  - crates/betterlite-config/src/providers/bedrock/bedrock_s3_signing.rs
