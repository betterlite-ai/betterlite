dod:
- text: >-
    Registration order, effective deduplication, removal, phase selection and integration with B246 config validators
    match the listed helper cases.
  proof:
  - oracle
  - helper-python
- text: >-
    Identical callbacks return Ok(AlreadyRegistered); overflow at configured per-list capacity warns and skips,
    while unknown/uninstalled names fail startup.
  proof:
  - callback-registry-tests
- text: >-
    The extended YAML loader replays new callback-list and capacity-setting seeds; standalone callback-config parsing
    is proven by B246.
  proof:
  - config-yaml-corpus
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: callback-registry-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-logging -p betterlite-config --no-tests=fail -E 'test(/::callback_registry_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'callbacks' crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq 'success_callback'
      crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq 'failure_callback' crates/betterlite-config/fuzz/corpus/config_yaml
      && grep -rlq 'callback_settings' crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/callback_registry-*")" &&
      grep -lq 'callback_registry' tools/oracle/fuzz/corpus/helper_case/callback_registry-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
