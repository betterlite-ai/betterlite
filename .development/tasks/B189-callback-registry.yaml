- tools/oracle/cases/helpers/callback-registry/capacity-boundary.yaml
deviations: []
out_of_scope:
- B2304 owns callback_utils.py L710-L793 and its credential-selection constants L40-L53; registration
  composes that completed service instead of owning the stored callback encryption algorithms.
- Real exporters arrive in M5; Python callable discovery and CustomLogger instances arrive in B164-B165.
- Team/key callback persistence and authorization are M4.
- >-
  All standalone callback_config_validation functions are B246; exporter initialization branches are B110-B118;
  Python callable import/CustomLogger execution is B164-B165.
pitfalls:
- 'Name every corpus seed tools/oracle/fuzz/corpus/helper_case/callback_registry-<case>.yaml. The rest of that folder belongs to other tasks.'
- 'The oracle helper for this task is pre-registered as callback_registry in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/callback_registry.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/callback_registry.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Known callback metadata must not make an unavailable exporter silently accepted.
- Treat two aliases for the same credential family as one security boundary.
- Runtime-only Python callables are not a reason to replace the closed native callback enum with Box<dyn Trait>.
- The class MAX_CALLBACKS=30 is unused; constants.MAX_CALLBACKS reads LITELLM_MAX_CALLBACKS with default 100.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
