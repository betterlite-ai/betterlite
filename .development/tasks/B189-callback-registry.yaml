id: B189
title: Callback registry and configuration validation
description: >-
  Add a bounded callback registry and typed registration/config-validation layer in betterlite-logging. Represent
  compiled callback implementations as an exhaustive enum, initially an injected tracing sink and a real bounded
  in-memory channel sink; registration tracks callback identity and subscribed input/success/failure/stream/service
  phases. Parse LiteLLM callback-list/config shapes but enable only actually installed adapters, keeping unknown
  or unavailable names a B002 startup error; do not invent a public callback name for test sinks. Identical registration
  returns Ok(AlreadyRegistered), keeps the first and logs; capacity overflow warns and skips with a typed SkippedCapacity
  outcome. Use B246 validators for credential families and integration options. Read the pinned registry/config
  metadata as fixtures rather than dynamically importing providers. Compare effective registration/removal/phase
  selection and standalone validators through helper cases using synthetic Python CustomLogger objects.  Seed B171's
  shared helper_case corpus with every added operation and replay it through the common typed parser. Resolve litellm_settings.callbacks,
  success_callback, failure_callback, top-level callback_settings and LITELLM_MAX_CALLBACKS (100 per list) through
  config. The class attribute MAX_CALLBACKS=30 is dead; use the imported constant. Budget 270 registry, 90 config,
  140 synthetic Python CustomLogger/Rust adapters and 280 tests (780 total). Write the behavior rstest functions
  callback_registry_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure
  in the DoD; corpus replay tests have separate names. The helper operation callback_registry is already registered; each operation has its own Rust and Python adapter file and corpus seed.
