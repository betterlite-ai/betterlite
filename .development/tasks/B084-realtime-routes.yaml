checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_routes::/)
      - test(/::replays_corpus$/)'
  - id: case-webrtc-sdp-route
    why: the webrtc-sdp-route behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::realtime_routes::tests::webrtc_sdp_route($|::)/)'
  - id: case-invalid-ephemeral-token-401
    why: the invalid-ephemeral-token-401 behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::realtime_routes::tests::invalid_ephemeral_token_401($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::realtime_routes::tests::route_aliases($|::)/)'
  - id: case-unauthenticated-route-contract
    why: the unauthenticated-route-contract behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::realtime_routes::tests::unauthenticated_route_contract($|::)/)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/realtime-routes)"
