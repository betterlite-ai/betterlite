id: B084
title: Realtime WebRTC SDP routes
description: >-
  Register POST /v1/realtime/calls,/realtime/calls,/openai/v1/realtime/calls once in
  betterlite-server::api::realtime_routes. Own the entire proxy_realtime_calls handler, starting
  at its first decorator at362 and ending518. B1125 owns WebSockets; B1126 owns secret/session
  creation. This handler deliberately has no standard user_api_key_auth dependency: its Bearer
  token is an encrypted upstream ephemeral key. B061 decrypts using key=realtime_calls_auth,
  B1012 decodes routing metadata and B732 supplies the minimal principal record.

  Authorization must start with exact "Bearer "; strip the remaining token. Read the bounded raw
  body before checking token expiry. A versioned token supplies model/user/team/session_type; a
  legacy decrypted string is itself the provider key and routes via query model or the default
  gpt-4o-realtime-preview. Build a transcription session with nested audio.input.transcription.model,
  otherwise a realtime session with top-level model. B1103 enriches data, B124's injected ProxyLogging
  hook service runs pre_call_hook(call_type=arealtime_calls), B014 routes and B1010 executes HTTP.
  No second model authorization or ordinary proxy-key lookup is added here.

  B1087 bounds the body; B2456's existing SDP decoder handles its UTF-8 conversion later. Register no
  new parser. Use booted-proxy B001 HTTP cases with B1139/B856 fixtures and B061-generated test tokens.
  Each proxy mints/decrypts its own tokens using a fixed test salt; compare decoded fields or subsequent
  captured provider credentials, never randomized ciphertext strings. Native clock tests cover exact
  expiry equality. Own 138 nonblank/non-comment lines; budget 155 handler,145 tests,150 HTTP fixtures,
  30 wiring =480 lines.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/realtime_routes.rs
  - crates/betterlite-server/src/api/realtime_routes/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - tools/oracle/cases/api/realtime-routes/**
  - tools/oracle/fixtures/realtime-routes/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/realtime_endpoints/endpoints.py#L362-L518
  why: All three unauthenticated-by-proxy-key decorators and the whole encrypted-token/SDP handler.
dod:
- text: >-
    webrtc_sdp_aliases sends valid encrypted ep-test tokens and raw "v=0\r\n" separately to all three
    paths. Each makes one provider POST with Authorization=Bearer ep-test and multipart SDP/session fields,
    then returns mock201 body="answer",Content-Type=application/sdp. A provider Content-Type=text/plain
    is preserved with normal response charset handling. Missing upstream Content-Type falls back to
    application/sdp. Other upstream headers, including Location and x-provider-test, are not copied by
    this handler. No normal proxy API key is required, and supplying a master key as the ephemeral token
    does not authenticate it. Incoming body media type does not change the raw bytes passed as SDP.
  proof: [behavior-tests, oracle]
- text: >-
    webrtc_authorization_failures checks absent Authorization,Basic x,lowercase bearer x ->401 with exact
    JSON {error:"Missing or invalid Authorization header"}; undecryptable or empty Bearer value ->401
    {error:"Invalid or expired token"}; valid payload expiry in the past ->401 {error:"Token has expired"}.
    These bodies have a string error, no type,param,code and application/json. All make zero provider calls
    and bypass the failure hook. At now==expires_at accept; only now>expires_at rejects. String expiry
    is unchecked; bool true behaves as integer1 and is expired at an ordinary current clock.
  proof: [behavior-tests, oracle]
- text: >-
    webrtc_token_routing uses payload model_id=allowed with ?model=other and expects allowed. Empty model_id
    falls through nonempty query then gpt-4o-realtime-preview. Structured user/team IDs become minimal
    principal values, empty values become None. Session type=transcription builds only type plus nested
    audio.input.transcription.model; unknown type becomes realtime with top-level model. Legacy ep-test
    uses query model, defaults only when the query key is absent and preserves an explicit empty model.
    Malformed/version-mismatched decrypted JSON is a legacy raw key, not a local rejection. Neither ordinary
    key ownership nor fresh model grants are checked; possession of the valid encrypted token is sufficient.
  proof: [behavior-tests, oracle]
- text: >-
    webrtc_dispatch_errors verifies enrich,pre_call_hook(arealtime_calls),route_request(arealtime_calls),
    provider execution in order. A hook HTTPException403 with detail=denied maps to403/permission_error/
    param=null/code="403"; its message follows message-or-str(exception), not detail-only extraction.
    Generic failure without status gives500/internal_server_error/null/"500". Explicit type=provider_error,
    param=session,status429 survives with code="429"; type/param="None" normalize through B003. Failures
    within the try call post_call_failure_hook once with current data. Decrypt/body/minimal-principal failures
    before that try do not. A mock non-success raw HTTP response that the SDK returns keeps status/body/media
    type; an SDK-raised HTTP error instead uses the mapped envelope. No success hook runs here.
  proof: [behavior-tests, oracle]
- text: >-
    webrtc_bounded_body has a native cap+1 test for413/invalid_request_error/param=body/code=request_too_large,
    zero provider requests and no token-expiry bypass. Ordinary bodies are exercised in newly added HTTP cases.
  proof: [behavior-tests, new-cases, oracle]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Token possession, expiry order and raw HTTP response handling must be exercised at the real route.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::realtime_routes::tests::/)'
  - id: new-cases
    why: Each WebRTC calls alias and token mode needs a newly added booted-proxy fixture.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/realtime-routes)"
oracle_cases:
- tools/oracle/cases/api/realtime-routes/webrtc-sdp-aliases.yaml
- tools/oracle/cases/api/realtime-routes/webrtc-authorization-failures.yaml
- tools/oracle/cases/api/realtime-routes/webrtc-token-routing.yaml
- tools/oracle/cases/api/realtime-routes/webrtc-dispatch-errors.yaml
deviations:
- what: SDP request bodies over 16777216 bytes return 413 invalid_request_error with param=body and code=request_too_large before provider I/O.
  why: Retain B1087's bounded-body policy instead of the source's unbounded request.body read.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/realtime_endpoints/endpoints.py#L410-L410
out_of_scope:
- B1012 owns all payload/session helpers at43-213; B1126 owns client_secrets216-359 and transcription_sessions521-658. B1125 owns the three WebSocket paths in proxy_server.py.
- B061 owns encryption/decryption; B124 owns ProxyLogging hooks supplied as an injected service; B1010/B2456 own HTTP provider execution. This task composes no other route factories.
pitfalls:
- These401 responses are explicit JSONResponse-style string errors, not ProxyException envelopes.
- An empty legacy model query is preserved, while an empty versioned model_id falls through truthy defaults.
- The SDP body is read before expiry validation, and only integer expiry values are checked.
review_level: security
budget:
  max_changed_lines: 500
  max_new_expects: 0
