id: B084
title: Realtime routes
description: >-
  Compose the separately owned realtime client-secret/session and WebSocket route factories once; register only
  the three /realtime/calls HTTP aliases here. Calls decrypts its Bearer ephemeral token without virtual-key authentication
  and does not compare a token team to a caller team.


  Compose B1125 WebSocket and B1126 secret/session routes without registering them twice. Own /realtime/calls aliases
  only: Bearer is the encrypted ephemeral token, not virtual-key auth. Decode failures are HTTP 401 with {error:
  <string>}. The token team is never compared at this pin; do not add a cross-team denial.


  Implement crates/betterlite-server/src/api/realtime_routes.rs, crates/betterlite-core/src/api/realtime_routes.rs.
  Use RealtimeRoutesInput and RealtimeRoutesResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/realtime/calls; POST /realtime/calls; POST /openai/v1/realtime/calls.
  Each alias is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts
  its child factories without re-registering their methods/paths.


  Route input projections: request.headers.Authorization (absent None); request.query_params.model (absent _DEFAULT_REALTIME_MODEL);
  request.query_params.model (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:507 type=openai_error_type(e, error_status_code(e, 500)), param=openai_error_param(e),
  code=error_status_code(e, 500); endpoints.py:501 type=openai_error_type(e, error_status_code(e, http_status.HTTP_400_BAD_REQUEST)),
  param=openai_error_param(e), code=error_status_code(e, http_status.HTTP_400_BAD_REQUEST). Compare the actual source
  status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions webrtc_sdp_route, invalid_ephemeral_token_401, route_aliases, unauthenticated_route_contract
  under api::realtime_routes::tests. Each named function drives production code and asserts its case result; use
  named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/realtime_endpoints/endpoints.py: proxy_realtime_calls (L374-L518). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 153 owned nonblank/non-comment/non-docstring Python lines (153 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 173 implementation,
  64 behavior tests, 48 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 323 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B171 (Direct helper oracle and
  URL path encoding), B901 (Websocket oracle), B1010 (Realtime http calls), B1011 (Realtime connect), B1012 (Realtime
  ephemeral ids), B1087 (Api boundaries), B1125 (Realtime WebSocket route), B1126 (Realtime client secrets and transcription
  sessions), B1103 (Authenticated request preparation), B732 (Typed authentication principals and grant resolution),
  B855 (Authenticated request admission and budget handoff), B756 (Authentication header selection and mode dispatch),
  B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces and Postgres test fixture). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
