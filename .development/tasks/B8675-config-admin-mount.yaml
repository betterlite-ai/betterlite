deviations: []
out_of_scope:
  - "The handlers, their state types and the redaction helpers: B8594, B8595, B8596, B8389 and B8230."
  - "The DeploymentSync behind add_deployment and its hand-over: B8381 and B8613."
  - "Building B4785's route state with the ProxyUrls value: the agents mount part."
pitfalls:
  - The plugin registry, the general settings store and the proxy config state must be the Arcs in Shared; a second PluginRegistry would leave /api/plugins blind to plugins saved through /config/field/update.
  - GET /config/yaml declares a ConfigYAML body parameter, so LiteLLM answers a GET without a body differently from one with {}; keep both cases.
  - An empty PROXY_BASE_URL is Some(""), and LiteLLM then hands out an empty base URL instead of the request one.
  - The plugin proxy route takes GET, POST, PUT, DELETE, PATCH, OPTIONS and HEAD; merging it twice or under a second path panics at boot.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
