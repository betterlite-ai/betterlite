id: B3782
title: Noma v2 unified scanning
description: >-
  Implement Noma v2 unified guardrail scanning that sends typed requests to the Noma `/litellm/guardrail` endpoint
  and applies returned actions (allow, block, intervene) to request and response content. Preserve the SaaS-host-only
  API-key requirement where noma.security hostname forces an API key, fallback from per-request application_id to
  configured application_id to user_api_key_alias for Noma dashboard traceability, and monitor_mode that returns
  allow-all decisions without consulting the API. Handle invalid-action errors gracefully by treating non-BLOCKED
  responses as allow in monitor mode and raising in strict mode. Serialize payload content with safe_dumps fallback
  on Pydantic model serialization failure, and always sanitize the payload to exclude duplicate fields (messages, input)
  and logging noise that the endpoint doesn't process. Support scanning across request hook (pre_call), response hook
  (post_call), and MCP call hooks (pre_mcp_call, during_mcp_call). Read configuration from environment (NOMA_API_KEY,
  NOMA_API_BASE defaulting to https://api.noma.security/, NOMA_APPLICATION_ID, NOMA_GATEWAY_NAME, NOMA_MONITOR_MODE
  default "false", NOMA_BLOCK_FAILURES default "true") with constructor parameters overriding environment values.
  Register the guardrail with betterlite's callback system so it observes every request with metadata about the scan
  (provider, status, request_id, user, spend tracking) and logs response verdicts even when monitor_mode suppresses blocking.
scope:
  paths:
    - crates/betterlite-guardrails/src/noma_v2.rs
    - crates/betterlite-guardrails/src/noma_v2
    - crates/betterlite-guardrails/src/noma_v2/tests.rs
    - crates/betterlite-guardrails/src/noma_v2/tests/**
  lint_tables: false
