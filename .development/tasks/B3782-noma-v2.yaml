    why: NomaV2GuardrailConfigModel with fields api_key, api_base, application_id, gateway_name, monitor_mode, block_failures, and ui_friendly_name.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma.py#L55-L72
