    why: The complete NomaV2Guardrail class and its __init__, config methods, payload building, serialization, HTTP calls, action application and apply_guardrail orchestration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/__init__.py#L38-L55
