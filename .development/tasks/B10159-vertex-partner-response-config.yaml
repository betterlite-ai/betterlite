    why: The one caller, B3642's rawPredict branch, and the dummy message, empty params and empty api key it passes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_partner_models/main.py#L215-L232
    why: B032's OpenAI-like branch, whose response step is the Llama3 transform for the models _get_vertex_ai_config gives the Llama3 config.
dod:
  - text: partner_response_config gives the Claude config for anthropic, the AI21 config for ai21 and the Llama3 config for openapi and mistralai, as LiteLLM's selector does.
    proof: [select-tests, oracle, helper-python]
  - text: transform_response runs the selected leaf. The Claude arm names the requested model, the Ai21 arm keeps the reply's id and model, and the Llama arm fills id "", created 0, the requested model and zero usage when the reply lacks them.
    proof: [transform-tests, oracle, helper-python]
  - text: A Llama reply body that is not JSON fails as VertexAiError with the reply's status and headers.
    proof: [transform-tests, oracle]
checks:
  optional: []
  commands:
    - id: select-tests
      why: a publisher picks the wrong config, or the selector has no tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^partner_response_config::tests::select_/)'
    - id: transform-tests
      why: an arm calls the wrong leaf, drops LiteLLM's defaults or zero usage, maps the JSON failure to the wrong error, or has no tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^partner_response_config::tests::transform_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10159)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b10159 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b10159/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/helpers/vertex-partner-response-config/anthropic.yaml
  - tools/oracle/cases/helpers/vertex-partner-response-config/ai21.yaml
  - tools/oracle/cases/helpers/vertex-partner-response-config/openapi.yaml
  - tools/oracle/cases/helpers/vertex-partner-response-config/mistralai.yaml
  - tools/oracle/cases/helpers/vertex-partner-response-config/llama-missing-fields.yaml
  - tools/oracle/cases/helpers/vertex-partner-response-config/llama-not-json.yaml
deviations: []
out_of_scope:
  - "The ValueError branch of get_vertex_ai_partner_model_config (`Unsupported model: {model}`) has no way in at the pin: its one caller passes _get_vertex_publisher_or_api_spec_from_url's answer, always one of the four publishers B3638 types as VertexPublisher. Its case goes with it."
  - "The rawPredict branch that calls the selector, its JSON pre-parse and the payload factory call: B3642."
  - "Partner completion dispatch, Gemma, Model Garden, count_tokens and the operation bindings: B032, which calls llama3_transform_response as the response step of its OpenAI-like partners."
  - "The leaf transforms: B1333 (Claude), B504 (OpenAIGPTConfig.transform_response and transform_choices), B1425 (the compatible reply decoder), B1335 (decode_reply, the partner parameter policies and the Llama stream repair). This task calls them, adds no byte decoder and so has no fuzz target."
pitfalls:
  - "mistralai and openapi both pick the Llama3 config, so nothing here selects B1335's Mistral or GPT-OSS classes."
  - "The Claude arm always overwrites the response model with the model it was given; the Llama arm keeps the reply's own model and falls back to the given one only when the reply has none."
  - "The Llama arm replaces the starting id with \"\" when the reply has no id, while the Ai21 arm keeps the starting chatcmpl id when the reply's id is missing, null or empty."
  - "Llama's Usage(**reply.get(\"usage\", {})) reports zero counts for a reply without usage, but decode_reply leaves usage as None, so the arm has to fill it."
  - "A non-JSON body raises VertexAIError in the Llama arm but OpenAIError in the Ai21 arm, though both come from the same B504 parse step."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
