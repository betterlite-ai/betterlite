  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/chat/gpt_transformation.py#L661-L708
    why: The Ai21 arm, OpenAIGPTConfig.transform_response, which B504 ports.
