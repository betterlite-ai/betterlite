id: B10159
title: Vertex partner response-config selector and reply transforms
description: >-
  LiteLLM's `get_vertex_ai_partner_model_config` (vertex_ai_partner_models/__init__.py L4-L19) picks the partner config whose `transform_response` turns a Vertex partner reply into a chat response. Its one caller at the pin is the rawPredict branch of the Vertex pass-through logging handler, which B3642 builds. B032 used to own the selector for that caller alone, so B3642 waited on all of B032's partner dispatch. The selector and the reply transforms it hands out are this task now. B032 needs one of them too: `VertexAILlama3Config.transform_response` is the response step of its OpenAI-like completion path (llama, deepseek, qwen and the other models the Llama3 config serves), so that arm is a public function here and B032 calls it instead of composing its own.


  Layout. The code goes in betterlite-vertex, module `partner_response_config` (crates/betterlite-vertex/src/partner_response_config.rs and its folder, tests in partner_response_config/tests.rs). The file is an empty stub that lib.rs already declares; leave lib.rs alone. It sits beside B1333's vertex_claude_chat and B1335's partner_openai and below betterlite-provider and betterlite-server, which both depend on betterlite-vertex. It needs no new dependency: betterlite-anthropic, betterlite-openai, betterlite-logging and betterlite-models are already in the crate's Cargo.toml. The module keeps no state and reads no config.


  Selector. `pub enum PartnerResponseConfig { Claude, Ai21(Ai21Config), Llama3(Llama3Config) }`, holding B1335's `partner_openai::ai21::Ai21Config` and `partner_openai::llama::Llama3Config` at their default settings, since LiteLLM builds both with no arguments. `pub fn partner_response_config(publisher: VertexPublisher) -> PartnerResponseConfig` takes B3638's `vertex_relay_metadata::types::VertexPublisher`. Anthropic gives Claude, Ai21 gives Ai21, and OpenApi and MistralAi both give Llama3. VertexPublisher is closed and every variant has a config, so the selector has no error and takes no model; in LiteLLM the model only feeds the text of the unknown-publisher error (see out_of_scope).


  Reply transforms. `PartnerResponseConfig::transform_response(&self, call: PartnerResponseCall<'_, Counter>) -> Result<Json, PartnerResponseError<Counter::Failure>>`, where Counter is betterlite-anthropic's `usage::ReasoningTokenCounter` and Json is `betterlite_models::decisions::Json`. PartnerResponseCall carries what LiteLLM's transform_response takes: the model, the raw reply (status, `http::HeaderMap`, body bytes), the id of the empty ModelResponse the caller starts from, messages, request_data, optional_params, litellm_params, json_mode, the clock value and the uuid source, the `LoggingState` and `PrePostEnv` the post_call log writes through, and the counter. The answer is the chat response in the shape LiteLLM's ModelResponse dumps to; B3642 stores it as `PassThroughResponse::ModelResponse` and reads its id, model and usage. Each arm calls code that is already on main and copies none of it.


  1. Claude runs B1333's `vertex_claude_chat::response::transform_response` on a fresh `ResponseEnvelope` with the given id. That runs the Anthropic parent transform and then names the requested model. Serialize the envelope to Json.

  2. Ai21: VertexAIAi21Config inherits `OpenAIGPTConfig.transform_response`, which is B504's `betterlite_openai::chat_choices::reply::transform_response`. Its projection is convert_to_model_response_object, which on main is B1425's `betterlite_openai::compatible_wire::decode_compatible_chat_reply`; crates/betterlite-azure/src/chat_call/response.rs shows that pairing.

  3. Llama3 is `pub fn llama3_transform_response`, the same call without the counter, porting `VertexAILlama3Config.transform_response` (llama3/transformation.py L109-L151). It runs B504's transform_response for the post_call log and the JSON parse, with a projection that hands the parsed object to B1335's `partner_openai::llama::reply::decode_reply` (id defaults to "", created to 0, model to the requested one, choices through B504's transform_choices) and then sets usage as LiteLLM's `Usage(**reply.get("usage", {}))` does, so a reply without usage reports zero counts. Use betterlite-openai's `chat::response::ChatUsage` for that record. A body that is not JSON fails as LiteLLM's VertexAIError, not OpenAIError: map B504's Json error into `model_policy::error::VertexAiError` with the reply's status, message and headers.


  `PartnerResponseError` is this module's thiserror enum: one variant per leaf error, with `#[from]` where the source is a single type, plus one for a failed Json conversion. Every variant keeps the leaf's status code.


  Tests live in partner_response_config/tests.rs. Names start with `select_` for the selector and `transform_` for the arms. They cover each publisher's config; the Claude arm naming the requested model whatever the body says; the Ai21 arm keeping the reply's own id and model, and the starting id when the reply's id is missing, null or empty; the Llama arm filling id "", created 0, the requested model and zero usage when the reply lacks them; and a Llama body that is not JSON coming back as VertexAiError with the reply's status. A recording log sink, a fixed clock and a fixed uuid source stand in; nothing touches the network.


  The helper operation b10159 compares the same calls with LiteLLM. Python calls `get_vertex_ai_partner_model_config(model, publisher)` and then the returned config's `transform_response` with a fake logging object and `ModelResponse(id=...)`, the way tools/oracle/helpers/vertex_claude_chat.py calls the Claude transform. The Rust side maps the publisher string to VertexPublisher and calls partner_response_config and transform_response. Both project the config class name (VertexAIAnthropicConfig, VertexAIAi21Config or VertexAILlama3Config) and the response's id, model, choices and usage; the Llama cases add created, since only that arm never reads the clock. A failure projects its status code.
