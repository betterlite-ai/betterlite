dod:
- text: >-
    Non-default filtering, drop decisions, `filter_out_litellm_params` and the pre-process rules for `aws_`,
    `hf_model_name` and `vertex_` keys match LiteLLM on fixture params.
  proof: [param-filters, oracle, helper-python]
- text: >-
    The function calling fallback gives the ollama result, the prompt result or the UnsupportedParamsError with status
    500 and LiteLLM's message.
  proof: [function-fallback, oracle, helper-python]
- text: >-
    `extra_body` gets unknown params for the listed providers only, routing keys are gone and B176's safety check runs
    on the result.
  proof: [extra-body, oracle, helper-python]
- text: >-
    `get_optional_params_transcription` and `get_optional_params_image_gen` match LiteLLM on every branch, including
    the Vertex aspect ratio map.
  proof: [media-params, oracle, helper-python]
- text: Reasoning summary aliases are read and stripped as LiteLLM does, and sensitive keys are removed from a dict.
  proof: [aliases-and-sensitive-keys, oracle, helper-python]
- text: New helper corpus seeds call `b5362` and replay through the shared parser.
  proof: [helper-case-corpus]
checks:
  optional:
  - mutants
  commands:
  - id: param-filters
    why: A filter keeps or drops the wrong key.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^non_default_params::.*filter/)'
  - id: function-fallback
    why: A fallback path is absent or the error differs.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^non_default_params::.*function_fallback/)'
  - id: extra-body
    why: extra_body handling leaks routing keys or runs for the wrong provider.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^non_default_params::.*extra_body/)'
  - id: media-params
    why: A media branch is wrong.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^media_optional_params::/)'
  - id: aliases-and-sensitive-keys
    why: Alias handling or key removal differs from the source.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^non_default_params::.*(alias|sensitive)/)'
  - id: helper-python
    why: The Python side of b5362 is missing or fails its linters.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5362)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers/b5362 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5362/pyrightconfig.json
  - id: helper-case-corpus
    why: The corpus has no new b5362 seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/non_default_params-*")"
      && grep -lE '^[[:space:]]+b5362:' tools/oracle/fuzz/corpus/helper_case/non_default_params-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/non-default-params/filters.yaml
- tools/oracle/cases/helpers/non-default-params/pre-process.yaml
- tools/oracle/cases/helpers/non-default-params/function-fallback.yaml
- tools/oracle/cases/helpers/non-default-params/extra-body.yaml
- tools/oracle/cases/helpers/non-default-params/transcription.yaml
- tools/oracle/cases/helpers/non-default-params/image-generation.yaml
- tools/oracle/cases/helpers/non-default-params/reasoning-aliases.yaml
deviations:
- what: Provider mapping goes through the `OptionalParamsMapper` trait where LiteLLM calls a config object.
  why: Provider crates depend on betterlite-context, so this crate can't name their types.
out_of_scope:
- Embedding params are B5363, including the provider branches of `get_optional_params_embeddings`.
- >-
  `_remove_json_schema_refs` L4148-L4178 belongs to B1408 and the chat `get_optional_params` L4434-L5043 to B175.
  The B157 task file lists the owner of every other function there.
- Each provider's own mapping stays with that provider's task.
pitfalls:
- >-
  `pre_process_non_default_params` tests `isinstance(non_default_params, list)` in its tools branch, but the value is a
  dict, so the additionalProperties cleanup never runs at the pin. Don't run it either. The oracle case proves the
  schema comes out untouched.
- Don't treat a value of `None` as unset everywhere. Each filter compares with its own defaults, so read the default table it uses.
- >-
  The guard in `pre_process_optional_params` starts with `custom_llm_provider == "ollama" and ...` and its operator
  order matters. Copy the condition as it is.
- The test names must carry the words the checks filter on, such as `function_fallback` or `extra_body`.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
