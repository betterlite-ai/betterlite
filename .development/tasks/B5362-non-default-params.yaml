id: B5362
title: Non-default parameter handling with transcription and image optional params
description: >-
  Before a call goes to a provider, LiteLLM works out which parameters the user really set, drops or rejects the ones the
  provider can't take, and asks the provider config to map the rest. Build that shared stage in betterlite-context:
  module `non_default_params` for the general helpers and `media_optional_params` for the transcription and image
  generation entry points.


  Parameters stay in `serde_json::Map<String, serde_json::Value>` because user kwargs are open. Everything else has
  named fields. Provider work goes through a trait in `non_default_params`, `OptionalParamsMapper`, with one method for
  the supported names and one for the mapping, since provider crates sit above this one. B5360's tags tell the caller
  which mapper to pass, and the caller also passes the supported list where LiteLLM calls `get_supported_openai_params`.


  `non_default_params` covers: `_should_drop_param`, `_get_non_default_params`, `_bedrock_route_for_request`,
  `_remove_additional_properties` (removes the key only when its value is false), `_remove_strict_from_schema`,
  `_remove_unsupported_params` (no supported list gives an empty map), `filter_out_litellm_params`,
  `_provider_supports_vertex_params`, `PreProcessNonDefaultParams.base_pre_process_non_default_params` and its embedding
  twin, `pre_process_non_default_params`, `remove_sensitive_keys_from_dict`, `pre_process_optional_params`,
  `add_provider_specific_params_to_optional_params`, `_apply_openai_param_overrides`, `provider_rejectable_params`,
  `get_non_default_params`, `get_standard_openai_params`, `get_non_default_completion_params`,
  `peek_reasoning_summary_aliases`, `strip_reasoning_summary_aliases_from_optional_params` and
  `get_non_default_transcription_params`.


  The rules that matter most: `aws_bedrock_project_id` is skipped; other `aws_` keys are dropped unless the provider is
  bedrock or starts with sagemaker; `hf_model_name` is dropped unless sagemaker; `vertex_` keys are dropped unless the
  provider supports them. `remove_sensitive_keys_from_dict` drops keys containing "key", "secret", "access" or
  "credential". `pre_process_optional_params` handles the function calling fallback: ollama sets format to json and
  records `functions_unsupported_model`, `add_function_to_prompt` moves the functions into the prompt, and any other
  provider raises UnsupportedParamsError with status 500 and "Function calling is not supported by {provider}.".
  `add_provider_specific_params_to_optional_params` puts unknown params into `extra_body` for openai, azure,
  text-completion-openai and the OpenAI-compatible providers, removes `EXTRA_BODY_ROUTING_KEYS` and runs B176's
  `_ensure_extra_body_is_safe`. `provider_rejectable_params` is the non-default set minus `PROVIDER_UNVALIDATED_PARAMS`
  (user, stream_options, stream, max_retries).


  `media_optional_params` covers `get_optional_params_transcription` (L3510-L3597: the openai and azure branch, the groq
  branch, the provider config path) and `get_optional_params_image_gen` (L3617-L3744: the provider config map, bedrock,
  vertex_ai `n` and `size` through `_map_openai_size_to_vertex_ai_aspect_ratio`).


  The oracle operation is `b5362`. Its Python adapter calls the `litellm.utils` function with fixture inputs. Where a
  provider config is needed it passes a small fixture class, and the Rust side uses a test mapper with the same answers.
scope:
  paths:
  - crates/betterlite-context/Cargo.toml
  - crates/betterlite-context/src/non_default_params.rs
  - crates/betterlite-context/src/non_default_params/**
  - crates/betterlite-context/src/media_optional_params.rs
  - crates/betterlite-context/src/media_optional_params/**
  - tools/oracle/cases/helpers/non-default-params/**
  - "tools/oracle/fuzz/corpus/helper_case/non_default_params-*"
  - tools/oracle/helpers/b5362.py
  - tools/oracle/helpers/b5362/**
  - tools/oracle/src/helpers/context/b5362.rs
  - tools/oracle/src/helpers/context/b5362/**
  lint_tables: false
