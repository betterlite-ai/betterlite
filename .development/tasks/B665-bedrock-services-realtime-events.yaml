  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/realtime_events.rs
  - crates/betterlite-bedrock/src/realtime_events/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/services_realtime_events.rs
  - tools/oracle/src/helpers/bedrock/services_realtime_events/**
  - tools/oracle/helpers/bedrock_services_realtime_events.py
  - tools/oracle/helpers/bedrock_services_realtime_events/**
