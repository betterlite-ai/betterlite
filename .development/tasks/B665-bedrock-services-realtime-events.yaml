  commands:
  - id: case-native-event-dispatch
    why: The native-event-dispatch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_events_cases::case_[0-9]+_native_event_dispatch$/)'
  - id: case-session-update-first
    why: The session-update-first behavior is missing or differs from its pinned fixture.
