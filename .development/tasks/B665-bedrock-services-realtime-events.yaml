id: B665
title: Bedrock realtime native event dispatch
description: >-
  Compose a closed native realtime event decoder/dispatcher and client session.update preface handling. Preserve
  unknown event behavior, provider exceptions and content-free event logging. Python SDK packaging/version diagnostics
  remain B159; native transport exposes its actual errors without manufacturing missing-Python-package failures.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/transformation.py:
  BedrockRealtimeConfig.transform_realtime_response L1275-L1415. litellm/llms/bedrock/realtime/handler.py: _as_bedrock_error
  L63-L67; _json_dict L70-L71; _json_str L74-L75; _should_log_event L78-L86; RealtimeClientWebSocket.receive_text
  L94-L94; RealtimeClientWebSocket.send_text L96-L96; RealtimeClientWebSocket.close L98-L98; BedrockInputStream.send
  L102-L102; BedrockInputStream.close L104-L104; BedrockPayloadPart.bytes_ L109-L109; BedrockOutputChunk.value L114-L114;
  BedrockOutputStream.receive L118-L118; BedrockBidirectionalStream.input_stream L123-L123; BedrockBidirectionalStream.await_output
  L125-L125; ClosableBedrockRuntimeClient.close L130-L130; _close_bedrock_client L152-L157; _client_messages L167-L175;
  _pending_session_update L178-L190; _raise_provider_failure L193-L198; _parse_client_message L201-L205; _ack_session_update
  L208-L232; BedrockRealtime.__init__ L238-L240.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  Named case contracts: native_event_dispatch: decode_realtime_native_event parses JSON string/bytes. Syntax error
  warns Invalid JSON message: {preview} and returns empty response with ALL passed state fields unchanged; invalid
  UTF-8 bytes may raise outside JSONDecodeError. Valid nondict JSON/wrong event shapes keep source errors. Event
  branch priority is sessionStart,contentStart,textOutput,audioOutput,user contentEnd,assistant contentEnd,userSpeechStart/End,usageEvent,toolUse,promptEnd/completionEnd.
  Multiple keys select only first branch. session_update_first: _client_messages yields initial_message whenever
  notNone,includingempty,then receive_text loop; any receive Exception debugs Client to Bedrock forwarding ended:
  {error} with traceback and terminates iterator. _parse_client_message validates JSON via TypeAdapter JsonValue
  and returns dict else immutableempty mapping; malformed/nonobject returns{},notexception. _json_dict accepts dictelse{},_json_str
  acceptsstringincludingemptyelseNone. pending_session_update: Scope keys exactly litellm.bedrock_realtime.pending_session_update,litellm.bedrock_realtime.session_committed,litellm.bedrock_realtime.committed_failure.
  Only committed isTrue identity triggers B682 status400 message Bedrock realtime session already committed to a
  provider stream; it cannot be replayed plus . The committed stream failed with: {stored failure} when truthy.
  Otherwise return pending only ifstring,includingempty. Integer1 is notTrue identity. provider_failure_event: Map
  by exact exception class name: AccessDeniedException403,ConflictException400,InternalServerException500,ModelErrorException424,ModelNotReadyException429,ModelStreamErrorException424,ModelTimeoutException408,ResourceNotFoundException404,ServiceQuotaExceededException400,ServiceUnavailableException503,ThrottlingException429,ValidationException400.
  B682 message {ClassName}: {error}; unknown exception unchanged. _raise_provider_failure logs Bedrock Realtime:
  provider stream failed: {B187 redacted error}; if committed isTrue save same redactedstring to failurekey,then
  raise mappederror with cause. native_session_and_state: sessionStart sets session_configuration_request to JSON
  {configured:true}, emitsnothing. Return response plus current_output_item_id,current_response_id,current_delta_chunks,current_conversation_id,current_item_chunks,current_delta_type,session_configuration_request
  on every successful dispatch; current_item_chunks always preserved. Unknown event keys/missing event silentlyemitnothing
  and preserve state, no warning. native_user_transcript_dispatch: While _user_transcript_active, textOutput.content
  defaultempty routes B663 user transcription; otherwise assistant text. A contentEnd while active clears active/generation-stage,
  then completes buffered transcript, and does not process END_TURN as assistantcompletion. Audio alwaysroutesB663
  regardless of transcriptflag. UserSpeechStart wins if both speech keys present. native_completion_dispatch: Assistant
  contentEnd first calls B664 block completion,then validates BedrockContentEnd and only exact stopReason END_TURN
  emits response.done/resets ids viaB664. Other/missing reasons retainresponse. usageEvent validates B661 typed
  cumulative usage records then stores viaB663,emitsnothing. toolUse delegatesB664 and debugs toolname/id without
  additionalstate. promptEnd/completionEnd delegatesB664, resets returned ids/type but preservesconversation/delta
  accumulator as source. ack_session_update_order: Await bedrock_stream.await_output BEFORE changing scope; on success
  pop pending and set committedTrue. Without logging return True without client ack. With logging validate session.modalities
  as list[str]|None,then B661 session_updated_event andsendJSON. Validation failure occurs after committed flag
  and outside sendcatch. Send Exception logs forwarding-ended and returns False withoutundoingcommit; successTrue.
  event_logging_selection: Use global logged_real_time_event_types whennotNone,otherwise DefaultLoggedRealTimeEventTypes
  fromB1006; exact * logsall. Otherwise source membership applies to event.type includingNone; empty list logsnone.
  Reuse B1006 real loader/default cases, no second setting owner. _close_bedrock_client ignores nonclosableobjects;
  closable asyncclose exceptions silentlysuppressed, successdebug Bedrock Realtime: closed SDK client.


  The same production parser module also exposes decode_realtime_client_preface for _parse_client_message; extend
  the existing fuzz target to call both decoder entry points on every seed, including nonobjects, invalidUTF8 and
  malformedsession.modalities. Protocol declarations map to native traits, not separately executable methods. Use
  B590 BaseAWS constructor and B187 redaction helpers directly.


  Implement crates/betterlite-bedrock/src/realtime_events.rs with adjacent tests under realtime_events/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_events_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): native_event_dispatch, session_update_first, pending_session_update, provider_failure_event, native_session_and_state,
  native_user_transcript_dispatch, native_completion_dispatch, ack_session_update_order, event_logging_selection.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_events* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_events variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_events that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  Outside-byte boundary: decode_realtime_native_event consumes Bedrock realtime provider event JSON bytes in crates/betterlite-bedrock/src/realtime_events.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_realtime_events.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_realtime_events.
  The adjacent test replays_the_bedrock_services_realtime_events_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 217 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 310 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 795 planned, 800 maximum changed lines.
