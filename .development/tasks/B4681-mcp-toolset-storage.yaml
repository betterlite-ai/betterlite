checks:
  optional: []
  commands:
    - id: toolset-types
      why: MCPToolsetTool or MCPToolset types are missing or incomplete.
      run: grep -qE 'struct MCPToolsetTool|pub struct MCPToolsetTool' crates/betterlite-config/src/sections/mcp_toolset_storage.rs && grep -qE 'server_id|tool_name' crates/betterlite-config/src/sections/mcp_toolset_storage.rs && grep -qE 'struct MCPToolset|pub struct MCPToolset' crates/betterlite-config/src/sections/mcp_toolset_storage.rs && grep -qE 'toolset_id|toolset_name|tools' crates/betterlite-config/src/sections/mcp_toolset_storage.rs
    - id: toolset-tests
      why: Toolset tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::/) - test(/replays_the_/)'
    - id: create-mcp-toolset
      why: create_mcp_toolset does not generate UUID, serialize tools, set audit fields, or return MCPToolset.
      run: grep -qE 'fn create_mcp_toolset|async fn create_mcp_toolset' crates/betterlite-config/src/sections/mcp_toolset_storage.rs && grep -qE 'uuid|Uuid' crates/betterlite-config/src/sections/mcp_toolset_storage.rs && grep -qE 'to_json|to_string|serialize' crates/betterlite-config/src/sections/mcp_toolset_storage.rs
    - id: list-filter
      why: list_mcp_toolsets does not filter by toolset_ids list.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::.*list.*filter/)'
    - id: list-error
      why: list_mcp_toolsets does not warn and return empty on error when use_writer is false.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::.*list.*error/)'
    - id: list-error-writer
      why: list_mcp_toolsets does not propagate errors when use_writer is true.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::.*list.*writer/)'
    - id: update-partial
      why: update_mcp_toolset does not apply partial updates with exclude_unset.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::.*update.*partial/)'
    - id: update-null
      why: update_mcp_toolset does not treat null as no-op for toolset_name and tools.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::.*update.*null/)'
    - id: update-not-found
      why: update_mcp_toolset does not handle not found or return None.
      run: grep -qE 'RecordNotFoundError|not.*found|None' crates/betterlite-config/src/sections/mcp_toolset_storage.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::.*not_found/)'
    - id: toolset-json
      why: Tools JSON serialization/deserialization is missing.
      run: grep -qE 'json|serde_json|parse' crates/betterlite-config/src/sections/mcp_toolset_storage.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_toolset_storage::tests::.*json/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4681.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/mcp-toolset-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

