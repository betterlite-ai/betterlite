    proof: [toolset-tests, list-filter, list-error]
  - text: list_mcp_toolsets with use_writer=true propagates any database error without catching or returning empty list.
    proof: [toolset-tests, list-error-writer]
  - text: get_mcp_toolset_by_name queries by toolset_name and returns MCPToolset or None.
