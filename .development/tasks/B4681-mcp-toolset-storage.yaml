  - text: update_mcp_toolset applies a partial update, excluding unset fields, treating null as no-op for toolset_name and tools, serializing tools to JSON, setting updated_by, returning MCPToolset on success or None on not found.
    proof: [toolset-tests, update-partial, update-null, update-not-found]
  - text: delete_mcp_toolset removes the toolset and returns the deleted MCPToolset, or None if not found.
