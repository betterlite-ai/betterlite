id: B4681
title: MCP toolset records and persistence
description: >-
  Build the MCP toolset persistence layer in betterlite-config::mcp::toolset with
  typed toolset records and CRUD operations against the database. Implement types
  for MCPToolset, MCPToolsetTool, and request models for creation and updates.
  Store tools as a JSON array in the database and deserialize to typed records on
  read.

  MCPToolsetTool is a record with server_id and tool_name, both strings.
  MCPToolset is a record with toolset_id, toolset_name, optional description,
  tools list (default empty), created_at, created_by, updated_at, and updated_by.
  The toolset_id is a string (UUID), toolset_name is required, all other fields
  are optional with None defaults.

  NewMCPToolsetRequest has toolset_name (required string), description (optional),
  and tools (optional list, default empty). UpdateMCPToolsetRequest has toolset_id
  (required), toolset_name (optional), description (optional), and tools (optional).

  create_mcp_toolset(prisma_client, data, touched_by) generates a UUID for
  toolset_id, serializes tools to JSON, sets created_by and updated_by to touched_by,
  stores the row, and returns the deserialized MCPToolset.

  get_mcp_toolset(prisma_client, toolset_id) returns MCPToolset or None on not found.

  list_mcp_toolsets(prisma_client, toolset_ids=None, use_writer=False) accepts an
  optional list of toolset_ids to filter (IN query); None means return all toolsets.
  When use_writer is true, raise any database error. When use_writer is false, catch
  exceptions, warn, and return empty list.

  get_mcp_toolset_by_name(prisma_client, toolset_name) queries by toolset_name and
  returns MCPToolset or None on not found.

  update_mcp_toolset(prisma_client, data, touched_by) takes an UpdateMCPToolsetRequest
  with a toolset_id. Apply a partial update: exclude toolset_id from the update,
  skip any field that is absent (not set) in the request, and treat null as a no-op
  for toolset_name and tools (never clear these required fields via null). Explicitly
  emptying the tool list is an explicit [] in the request, which cannot be mistaken
  for unset. Serialize tools to JSON if present. Set updated_by to touched_by. Return
  MCPToolset on success or None if not found (catch RecordNotFoundError).

  delete_mcp_toolset(prisma_client, toolset_id) removes the toolset and returns the
  deleted MCPToolset, or None if not found.

  The task owns the prisma table adapter and the helper functions to construct it and
  deserialize rows. Use the MCPToolsetRepository from B726 to access the toolset table.

