deviations:
  - what: Tools are stored as a JSON string in the database and deserialized to a typed
      list of MCPToolsetTool on read. The row data type allows tools to be either a JSON
      string (from database) or a pre-deserialized list.
    why: Rust does not allow dynamic fields. The database layer serializes the tools
      array to JSON when storing and parses it back when retrieving. This matches LiteLLM's
      behavior of storing tools in a JSON column.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L35-L43
  - what: Partial updates exclude the toolset_id field entirely from the update payload,
      and null values for toolset_name and tools are treated as no-op (not updated).
    why: A partial update should only touch fields the caller explicitly set. Excluding
      unset fields prevents overwriting with defaults. For required fields like toolset_name
      and tools, null means do not change, which matches LiteLLM's semantic of exclude_unset.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L143-L150
  - what: list_mcp_toolsets with use_writer=false returns an empty list on any database
      error after logging a warning. With use_writer=true, all errors are raised.
    why: This matches LiteLLM's behavior of graceful degradation when reading from a
      replica database. If the replica is unavailable, the system continues with an empty
      result rather than failing. When use_writer=true (accessing the primary), errors
      are fatal.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L113-L121

out_of_scope:
  - MCP toolset manager or startup wiring; that comes in B138.
  - HTTP routes or endpoints for toolset operations; those come in a later management task.
  - Searching or filtering toolsets by properties beyond name or ID.
  - Audit log records beyond created_by/updated_by timestamps.

pitfalls:
  - >-
    tools is stored as a JSON string in the database. The row model must accept both
    string and deserialized list types for the tools field, and _toolset_from_row must
    handle parsing a JSON string back to a list of MCPToolsetTool records.
  - >-
    UpdateMCPToolsetRequest has tools as Option. When tools is None (not set), skip
    the update. When tools is Some([]), serialize an empty list to JSON. These are
    distinct: None means do not change, Some([]) means empty the list.
  - >-
    RecordNotFoundError is a prisma error, not a Result error. Catch it specifically
    when calling update and delete, and return None on that error type.
  - >-
    created_by and updated_by are set by this task, not passed in the request. Use the
    touched_by parameter for both fields on create and update.
  - >-
    UUID generation must use uuid.Uuid.new_v4() or equivalent and serialize to string
    for storage. The toolset_id field is a string, not a UUID type.

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
