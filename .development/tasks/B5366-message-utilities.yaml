dod:
- text: Thought signatures are removed from tool call ids and tool message ids exactly where LiteLLM removes them.
  proof: [thought-signatures, oracle, helper-python]
- text: >-
    `trim_messages` gives LiteLLM's output for system merging, a tool tail, a message shortened to fit, an under-limit
    input and `return_response_tokens`.
  proof: [trim-messages, oracle, helper-python]
- text: >-
    The validators accept what LiteLLM accepts, fix what it fixes and raise the same error type and message for a bad user
    message and a bad tool choice.
  proof: [validators, oracle, helper-python]
- text: '`stop` is truncated to 4 unless `disable_stop_sequence_limit` is set.'
  proof: [validators, oracle, helper-python]
- text: The three prompt cache checks match LiteLLM, and a token counter error gives false.
  proof: [prompt-cache-checks, oracle, helper-python]
- text: >-
    The three stream types yield the same chunks as LiteLLM in sync and async form, and end with the same stop behavior.
  proof: [response-streams, oracle, helper-python]
- text: >-
    `register_prompt_template` stores under the same names, and `should_run_mock_completion` and `get_empty_usage` give
    LiteLLM's answers.
  proof: [small-helpers, oracle, helper-python]
- text: New helper corpus seeds call `b5366` and replay through the shared parser.
  proof: [helper-case-corpus]
checks:
  optional: []
  commands:
  - id: thought-signatures
    why: A signature stays on an id or a clean id changes.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^message_utilities::.*thought_signature/)'
  - id: trim-messages
    why: Trimming keeps or drops the wrong messages.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^message_utilities::.*trim/)'
  - id: validators
    why: A validator accepts bad input or the error text differs.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^message_utilities::.*validat/)'
  - id: prompt-cache-checks
    why: The cache threshold order or the error result differs.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^message_utilities::.*prompt_cache/)'
  - id: response-streams
    why: A wrapper drops a chunk or never ends.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^message_utilities::.*stream/)'
  - id: small-helpers
    why: One of the small helpers is absent or wrong.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^message_utilities::.*(prompt_template|mock_completion|empty_usage|first_chars)/)'
  - id: helper-python
    why: Oracle cases need a clean b5366 adapter to call.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5366)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers/b5366 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5366/pyrightconfig.json
  - id: helper-case-corpus
    why: At least one new seed must exercise b5366.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/message_utilities-*")"
      && grep -lE '^[[:space:]]+b5366:' tools/oracle/fuzz/corpus/helper_case/message_utilities-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
