- tools/oracle/cases/helpers/message-utilities/prompt-template.yaml
deviations:
- what: '`get_first_chars_messages` returns the first 100 characters of the JSON text, where LiteLLM uses Python `str()` on the list.'
  why: The text only goes into an error message, and a Python repr printer in Rust would add code for no use.
out_of_scope:
- >-
  `_count_characters` L5383-L5386 and `get_response_string` L5389-L5432 belong to B1688, and the mock streams
  L7403-L7473 to B255. Retry helpers next to them are B5364.
- >-
  `CustomModelResponseIterator` L8051-L8052 and `json_schema_type` L6504-L6527 are not built: no caller at the pin.
  `jsonify_tools` L10392-L10406 only converts pydantic objects, and messages reach Rust as JSON already.
- >-
  `get_utc_datetime` L5435-L5436 is one line over the clock, so callers use the clock they already hold. Other functions
  in litellm/utils.py are listed with their owners in the B157 task file.
pitfalls:
- >-
  `trim_messages` compares with `<`, not `<=`, and a catch-all on the error path returns the input. A token error must
  not reach the caller.
- >-
  `validate_chat_completion_tool_choice` collapses auto, none and required only without a function key. A dict with the
  key stays a dict.
- '`should_run_mock_completion` uses Python truthiness: 0, false, an empty string and an empty list count as absent.'
- A provider prefix check in `is_prompt_caching_valid_prompt` is a `startswith` on the model, so a model that only contains the provider name still gets the prefix.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
