id: B5366
title: Message trimming, validators, cache checks and fake stream iterators
description: >-
  This task builds the helpers in litellm/utils.py that look at raw request messages or wrap a finished response.
  Everything goes in betterlite-core under `message_utilities`, with one submodule per group. These functions see messages
  before any typed parse, and some exist to reject bad shapes, so messages are `serde_json::Value`.


  Thought signatures (L731-L823): `_is_gemini_model`, `_remove_thought_signature_from_id`,
  `_process_assistant_message_tool_calls`, `_process_tool_message_id` and `_remove_thought_signatures_from_messages`.
  Gemini returns tool call ids with a signature attached; these strip it when the same messages go to a non-Gemini target.


  Trimming (L7494-L7718): `process_system_message`, `process_messages`, `attempt_message_addition`, `can_add_message`,
  `get_token_count`, `shorten_message_to_fit_limit` and `trim_messages`. Token counts come from B196 and model limits
  from B2218. `trim_messages` takes `trim_ratio`, keeps the tool tail, joins system messages with a newline, returns early
  when `current_tokens < max_tokens`, returns the original messages on any internal error and honors
  `return_response_tokens`.


  Validators (L8228-L8415): `convert_to_dict`, `convert_list_message_to_dict`, `validate_and_fix_openai_messages`,
  `validate_and_fix_openai_tools`, `validate_and_fix_thinking_param`, `cleanup_none_field_in_message`,
  `validate_chat_completion_user_messages` (checks content against `ValidUserMessageContentTypes`, messages
  "Invalid message at index" and "Invalid user message at index"), `validate_chat_completion_tool_choice` (`None` and strings pass, a
  dict of type auto, none or required with no function key collapses to that string, a dict missing `type` or `function`
  raises BadRequestError, and any other type raises it with LiteLLM's second text)
  and `validate_openai_optional_params` (truncates `stop` to 4 unless `disable_stop_sequence_limit` is set). Errors are the
  B011 types.


  Prompt cache checks: `is_cached_message` (L8055-L8101), `get_prompt_cache_min_tokens` (L10108-L10129: an override passed as an
  argument, then the model info's `prompt_cache_min_tokens`, then the default, and it never fails) and `is_prompt_caching_valid_prompt` (L10132-L10165: no messages and
  no tools gives false, the provider is prefixed when the model doesn't start with it, the token counter runs with
  `use_default_image_token_count=True`, a passed `min_token_count` beats the lookup, and any error gives false).


  Streams over a finished response: `TextCompletionStreamWrapper` (L7326-L7400) turns chat chunks into text completion
  chunks, `ModelResponseIterator` (L7987-L8014) yields one finished response once, and `ModelResponseListIterator`
  (L8018-L8047) yields a list of them. Each is a plain `Iterator`, and the async form uses `futures::Stream`.


  Small pieces: `register_prompt_template` (L7258-L7322) stores a template under the full name and, when B174 resolves
  one, the bare model. A tokenizer config goes in the known tokenizer map, and anything else goes in the custom prompt
  map. Both maps sit in a `PromptTemplateRegistry` the caller owns. `get_first_chars_messages` (L5374-L5380),
  `get_empty_usage` (L10409-L10414) and `should_run_mock_completion` (L10417-L10424, Python truthiness over three values).


  The oracle operation is `b5366`. Its Python adapter calls the `litellm.utils` function on fixture messages. A stream
  case reports the list of chunks after running the iterator to the end.
scope:
