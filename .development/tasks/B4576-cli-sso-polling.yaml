id: B4576
title: CLI SSO polling and team selection
description: >-
  Add crates/betterlite-cli/src/sso_polling.rs with polling orchestration and team selection for betterlite-management-cli.
  Build the polling SSO session that awaits ready status with exponential backoff and team-selection interfaces.
  Implement _PollRequest TypedDict with url, headers, timeouts and status callbacks; CliAuthData to carry polling response shapes
  (status, key, user_id, teams, team_details, requires_team_selection, team_id); and Outcome enum (PollingStartError, PollingTimeout,
  PollingPermanentError, PollingData) to distinguish error sources. Preserve permanent-4xx rejection except 429,
  periodic retry messages at configurable intervals, the poll-secret header in every request, and the different skip semantics
  of generic team selection versus login's first-team fallback. Implement get_key_input for cross-platform raw terminal input
  (arrow keys, enter, escape, 'q' on Windows and Unix). Implement display_team_selection to render teams with highlight
  using ANSI or equivalent safe formatting, and prompt_team_selection to navigate with arrows in tty mode or fallback to numeric prompt.
  Implement _poll_for_ready_data to poll a URL until status becomes ready, logging periodic retry messages based on status
  (pending: pending_message, other: other_status_message, http error: _polling_error_message), returning CliAuthData when
  status==ready or None on timeout. Implement _response_error_detail to extract error detail field from response JSON,
  returning the detail string when present and valid, else None. Implement _is_permanent_polling_error(status) to return
  true for 4xx except 429 (rate limit is retryable). Implement _normalize_teams to convert from LiteLLM's teams (list of ids or
  team_details with team_id/id fields) to list of CliTeam records. Implement _start_cli_sso_flow(base_url) to POST to /sso/cli/start,
  validate CliSsoStartData fields, return CliSsoStartData or PollingStartError. Implement _get_cli_sso_poll_headers(poll_secret)
  to return header dict with x-litellm-cli-poll-secret. Implement _poll_for_authentication(base_url, key_id, poll_secret) to poll
  and check requires_team_selection, calling _handle_poll_team_selection if needed, returning CliAuthResult. Implement
  _handle_poll_team_selection to let user select team via _prompt_team_selection, re-poll with team_id query param, return jwt or None.
  Implement _prompt_team_selection to display teams and prompt for numeric selection (1-indexed) or 'skip' to use first team, returning team_id string or None.
