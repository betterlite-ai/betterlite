out_of_scope:
  - TypedDict definitions (CliTeam, CliPollData, CliSsoStartData, CliAuthResult, _TeamMapping); defined and imported from B4574.
  - HTTP client implementation; Http trait and requests client are injected for testability.
  - Browser opening and login orchestration; owned by B4574 (run_pkce_login).
  - Login dispatch and command registration; owned by B4585.
  - Terminal output formatting libraries; use injected stdout/stderr writer or standard library equivalents.
  - Storage and token persistence; owned by B4574 and B4575.
  - display_teams_table in auth.py:277-312; no caller at the pin. The live implementation is in teams.py:37.
pitfalls:
  - >-
    get_key_input must be cross-platform: Windows uses msvcrt.getch() with escape sequence detection for arrow keys; Unix uses
    termios raw mode to read single chars and detects ANSI escape sequences.
  - >-
    display_team_selection must use ANSI codes or safe equivalent that works in most terminals; Bold and colors should
    degrade gracefully.
  - >-
    prompt_team_selection checks sys.stdin.isatty() (or Rust equivalent) to decide between interactive and fallback mode; a non-tty
    pipes input and must not block on raw input.
  - >-
    Periodic logging uses modulo logic: if (attempt % interval == 0) then log, so the first log fires at attempt=0, and every interval-th attempt after.
  - >-
    _is_permanent_polling_error must return false for status 429 (rate limit is retryable); all other 4xx errors are permanent and
    stop polling.
  - >-
    _normalize_teams handles two input shapes: list of dicts with (team_id or id) and team_alias keys, or simple list of strings (team ids).
  - >-
    _start_cli_sso_flow validates that response.json() parses and has all three required string fields (login_id, poll_secret, user_code)
    non-empty.
  - >-
    Re-polling with team_id query parameter appends ?team_id=<id> to the poll URL, preserving headers and other parameters.
  - >-
    Team selection fallback uses 'skip' (not 'none' or 's') to select first team, and first team is teams[0], not a fallback default.
review_level: security
