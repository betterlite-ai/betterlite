dod:
  - text: get_key_input returns Option<&str> one of "up", "down", "enter", "escape", "quit" on Unix termios raw read or Windows msvcrt getch.
    proof: [raw-input]
  - text: display_team_selection renders teams with team_alias (or "N/A" fallback), budget as "$X" or "Unlimited", and highlights current selection.
    proof: [display-teams]
  - text: prompt_team_selection checks stdin.isatty(), renders display loop with get_key_input navigation, returns selected team on enter or None on escape/quit.
    proof: [interactive-selection]
  - text: prompt_team_selection_fallback prompts "Select a team by entering the index number (or 'skip' to continue without a team)", parses 1-indexed input, returns team or None on skip.
    proof: [fallback-selection]
  - text: _response_error_detail extracts string from JSON response["detail"] field when present and valid, else returns None.
    proof: [error-extraction]
  - text: _is_permanent_polling_error returns true for status 400-499 except 429, false for 429 and other statuses.
    proof: [permanent-error-check]
  - text: _poll_for_ready_data polls URL every poll_interval seconds, logs pending_message when attempt % pending_log_every == 0 and status==pending, similar for other_status_message and other statuses.
    proof: [polling-loop]
  - text: _poll_for_ready_data returns CliAuthData when status=="ready" and response.json() parses, None when timeout expires or _is_permanent_polling_error, logs _polling_error_message for transient http errors.
    proof: [polling-result]
  - text: _normalize_teams handles list of team objects with (team_id or id) and team_alias fields, or simple list of team_id strings, returns list of CliTeam.
    proof: [team-normalization]
  - text: _start_cli_sso_flow POSTs to base_url/sso/cli/start, validates response has login_id, poll_secret, user_code as non-empty strings, returns CliSsoStartData or PollingStartError.
    proof: [sso-start]
  - text: >-
      _get_cli_sso_poll_headers(poll_secret) returns dict with "x-litellm-cli-poll-secret" header mapped to poll_secret value.
    proof: [poll-headers]
  - text: _poll_for_authentication polls /sso/cli/poll/{key_id} with poll headers, when requires_team_selection is true, calls _handle_poll_team_selection, returns CliAuthResult with api_key/user_id/teams/team_id.
    proof: [auth-polling]
  - text: _handle_poll_team_selection calls _prompt_team_selection to get team_id, re-polls with ?team_id=<id>, returns jwt from re-poll data["key"] or None.
    proof: [team-selection-polling]
  - text: _prompt_team_selection displays teams table, prompts numeric 1-indexed selection or 'skip' to use first team, returns team_id string.
    proof: [team-prompt]
