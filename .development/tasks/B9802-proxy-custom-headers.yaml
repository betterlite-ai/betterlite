- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/savings.py#L492-L503
  why: classifier_cost_from_decision; numeric_savings already ports it.
dod:
- text: custom_headers gives the same header map as LiteLLM's get_custom_headers for the call id, deployment, cost, breakdown, key, timing, extra and excluded values.
  proof: [custom-headers-tests, oracle, helper-python]
- text: >-
    The cost breakdown is absent without a logging view, zero for a non-inference call priced at zero, and read with the uncached input cost otherwise,
    and the key spend adds only a positive response cost.
  proof: [custom-headers-tests]
- text: The remaining-limit headers use the h11-safe group name, and the guardrail headers from logging_caching_headers are added when the request data is not empty.
  proof: [custom-headers-tests]
- text: LITELLM_DETAILED_TIMING turns the four timing headers on only for the value true in any case.
  proof: [config-tests, custom-headers-tests]
checks:
  optional: [mutants]
  commands:
  - id: custom-headers-tests
    why: a header is missing, misnamed, wrongly formatted, or not excluded or replaced the way LiteLLM does
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^custom_headers::/)'
  - id: config-tests
    why: LITELLM_DETAILED_TIMING does not load with LiteLLM's lowercase check and default
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::detailed_timing::/)'
  - id: helper-python
    why: the header builder has no pinned LiteLLM comparison through the b9802 helper
    run: grep -qE '^[[:space:]]+b9802:' tools/oracle/fuzz/corpus/helper_case/b9802-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/custom-headers/deployment-and-key.yaml
- tools/oracle/cases/helpers/custom-headers/cost-breakdown.yaml
- tools/oracle/cases/helpers/custom-headers/remaining-limits.yaml
deviations:
- what: A header whose name or value cannot be sent (a control character in an extra header, say) is left out with a warning, where LiteLLM keeps it in the map and the server fails when it writes the response.
  why: axum's HeaderMap cannot hold such a header, and dropping one header keeps the response that LiteLLM loses.
out_of_scope:
- "build_litellm_proxy_success_headers_from_llm_response (L1857-L1911) and _merge_passthrough_streaming_headers (L1698-L1725): the pass-through routes, B8694 and B8693."
- "get_logging_caching_headers and _serialize_scan_metadata_header: B8994, called here."
- "Which values each route passes (response cost, hidden params, version, model region): the route tasks; B081 for /v1/messages. post_call_response_headers_hook: B8399."
- "The chat route's own header list in routes/chat/headers.rs stays as it is; moving chat onto this builder is not part of this task."
pitfalls:
- 'Values are excluded before str(), so a key limit of None ("None") goes, but a response cost of 0 stays as "0" and False stays as "False".'
- 'The cost breakdown header names drop "_cost" and "total": margin_total_amount is x-litellm-response-cost-margin-amount and input_cost is x-litellm-response-cost-input.'
- 'x-litellm-fastest_response_batch_completion keeps its underscores.'
- 'The remaining-limit lookup keys keep the raw model group ("litellm-key-remaining-requests-a/b") while the header names use the replaced one.'
- 'The zero breakdown leaves cache-read, cache-creation and reasoning absent.'
- 'LITELLM_DETAILED_TIMING compares the lowercased value with "true", so "1" and "yes" leave it off.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
