dod:
  - text: A logger that does not override the new trait methods reads no call details and gets async_log_success_event exactly as before.
    proof: [logging-seam-tests]
  - text: A logger that reads call details gets one shared SuccessCall with the call details, the response (the assembled one for a stream) and the request-level redaction decision, and a stream chunk still goes to async_log_stream_event.
    proof: [logging-seam-tests]
  - text: An internal sub-call, a redacted request, a request with no identity or no id, and an unknown call type are skipped before any job read.
    proof: [gate-tests, hook-oracle]
  - text: A wire-params surface whose request a mutating guardrail changed is replayed from a matching snapshot and skipped without one; the chat surface ignores the snapshot.
    proof: [gate-tests, hook-oracle]
  - text: Key, team and user targets each match their jobs, and expiry, the turn valve with this pod's starts, the spend valve, direction and scope exclude a job without a funnel event.
    proof: [sampling-tests, hook-oracle]
  - text: A job that loses the sampling roll records not_sampled, and an unjudgeable sample records unjudgeable once for each eligible job.
    proof: [sampling-tests, control-tests, hook-oracle]
  - text: A refill of the jobs cache clears the per-job starts.
    proof: [sampling-tests]
  - text: At 16 pipelines in flight a job records shed and its starts stay; otherwise its starts grow by its arm count and one pipeline is spawned with the control values and the request metadata.
    proof: [scheduling-tests, control-tests, hook-oracle]
  - text: The in-flight slot is released when a pipeline ends, also when it panics.
    proof: [scheduling-tests]
  - text: The hook returns Ok on every path, including a failure inside it.
    proof: [gate-tests]
  - text: The oracle cases agree with pinned LiteLLM and the Python adapter passes lint and type checks.
    proof: [hook-oracle, helper-python]
checks:
  optional: [mutants]
  commands:
    - id: logging-seam-tests
      why: the SuccessCall seam tests are missing or fail, or the existing success and logger tests break
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::success_call_/)' && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^logging_success::/) | test(/^callback_logger::/)'
    - id: gate-tests
      why: the hook's early gates or the snapshot choice are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_eval_logger::tests::gates::/)'
    - id: sampling-tests
      why: target matching, the job valves, the not_sampled count or the starts reset are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_eval_logger::tests::sampling::/)'
    - id: scheduling-tests
      why: the in-flight cap, the starts accounting or the slot release are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_eval_logger::tests::scheduling::/)'
    - id: control-tests
      why: the unjudgeable count or the control values handed to the pipeline are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^shadow_eval_logger::tests::control::/)'
    - id: helper-python
      why: the Python adapter for the hook is missing or fails ruff or basedpyright
      run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b118.py tools/oracle/helpers/b118)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b118.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: hook-oracle
      why: the hook's skips, funnel events or scheduled pipelines differ from pinned LiteLLM
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/shadow-eval-hook)" && cargo build --locked -p betterlite-oracle && target/debug/betterlite-oracle tools/oracle/cases/helpers/shadow-eval-hook
