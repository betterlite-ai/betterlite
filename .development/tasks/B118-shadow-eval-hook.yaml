deviations:
  - what: Shadow pipelines run on a TaskTracker the server drains at shutdown, so shutdown waits for at most 16 in-flight shadow evaluations; LiteLLM's asyncio tasks are dropped when its event loop closes.
    why: rules.yaml async-hygiene forbids detached tasks; a drained pipeline also writes its attempt row instead of losing a shadow call that already billed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/shadow_eval_logger.py#L1019-L1033
out_of_scope:
  - "Response text, call costs, failure text, routing decision readers and the result records (shadow_eval_logger.py L171-L277, L491-L531, L671-L689, L704-L731): B4081."
  - "Request normalization, surface ops, the guardrail snapshot and judgeable_sample (L72-L168, L280-L450): B4082."
  - "sample_hits, the spend counter helpers, direction_admits, ActiveShadowEvalJob, canonical_group, scope_admits, as_active_job, the jobs cache and `_active_jobs`, `_record_attempt` and the default prisma provider (L55, L483-L488, L581-L620, L692-L701, L734-L816, L851-L903, L1218-L1264, L1374-L1382), and the pod-local funnel counters: B4083."
  - "The judge prompt and budgets, PairwiseVerdict, `_unmask_preference`, the tool text, `_forwarded_team_id`, `_call_router_shadow` and `_call_judge` (L60-L70, L452-L480, L534-L578, L663-L668, L1266-L1371): B4084."
  - "`_key_or_team_is_over_budget`, `_run_shadow_eval` and `_run_shadow_arm` (L623-L660, L1042-L1216): B4085."
  - "litellm/integrations/litellm_agent/litellm_agent_model_resolver.py: B8253. Its `__init__.py` only re-exports the resolver, and B8253's betterlite-prompts module is that export. The litellm_agent arms of the logger catalog (litellm_logging.py L4582-L4589 and L5371-L5374) are B8655 and B8742."
  - "Registering ShadowEvalLogger at startup when a database exists (proxy_server.py L2751-L2759): B069."
  - "Capturing the snapshot after the guardrails ran (litellm_pre_call_utils.py L1970-L1990): B1105. Flushing the funnel counters in the spend update job (proxy/utils.py L7506-L7529, L7577-L7702): B1744."
  - "The shadow eval management routes (auto_router_endpoints.py): B356 and its sibling route tasks."
pitfalls:
  - "The `internal_call_origin` check reads the request metadata under litellm_params, not the payload; the shadow and judge calls keep the caller's key hash (B4084 forwards identity), so without this check each shadow call would sample itself."
  - "Targets come from the payload's metadata, but direction, tier, classifier cost, the guardrail check and parent_metadata come from the request metadata; mixing the two picks the wrong routing_decision."
  - "A JWT request has no user_api_key_hash but still matches a team or user job; an empty string is not a target."
  - "Out-of-direction and out-of-scope requests are not counted at all; only a job that passed every valve and lost the roll records not_sampled, so the funnel stays a share of the traffic the job admits."
  - "The turn valve compares attempts plus this pod's starts with max_turns, and one start adds the job's arm count: a three-router job uses three turns per sample."
  - "A shed job does not add to its starts, and the cap is checked per job, so one request can start one job and shed the next."
  - "The snapshot only matters for anthropic_messages, responses and aresponses with a mutating guardrail; post_guardrail_kwargs giving None ends the hook before the job read, with no funnel event."
  - "An unknown call type, such as embedding, returns before the jobs are read, so the hook costs no database read for traffic it can never compare."
  - "real_cache_hit is true only for cache_hit Some(true); None and Some(false) are both false."
  - "parent_metadata is the full request metadata, user_api_key_auth included: B4085's budget gate reads it, and B4084 forwards the caller identity from it so shadow and judge spend bills to the sampled key (B356's attribution note)."
  - "The callback name has no `_PROXY_`, so a no-log request is never shadowed; renaming it to look internal would replay requests the caller asked not to log."
  - "Hold the admission mutex only for the check and the increments, never across the job read or the spawn's await."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
