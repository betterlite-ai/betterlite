id: B118
title: Shadow eval success hook and the call details it reads
description: >-
  LiteLLM's ShadowEvalLogger is a success logger. After a real request succeeds it decides whether that request is a
  sample for an active shadow evaluation job, and if so it starts one detached pipeline that replays the conversation
  through the job's other arms and has a judge compare the answers. Its parts are planned: B4081 reads response text
  and costs, B4082 turns the logged call into a chat request and checks the guardrail snapshot, B4083 loads the jobs and
  counts the funnel, B4084 makes the shadow and judge calls, and B4085 runs one sampled request through every arm. No
  part builds the logger itself: its constructor, `_sampled_jobs`, `async_log_success_event` and the slot release
  (shadow_eval_logger.py L819-L849 and L905-L1038). This task builds them in betterlite-server as the module
  `shadow_eval_logger`, and adds the small seam in betterlite-logging that gives the logger the call details it reads.
  B069 registers the logger at startup next to the spend logger (proxy_server.py L2751-L2759); this task does not.


  The seam. LiteLLM hands this logger `kwargs=model_call_details`, the response object and the guardrail snapshot
  (litellm_logging.py L3477-L3501). betterlite's LoggerEvent (B8740) carries the standard logging payload and the
  snapshot but no call details, and the hook needs them: the request metadata under litellm_params, `messages`,
  `model`, `system`, `instructions` and `litellm_params.proxy_server_request.body`. Do not add a field to LoggerEvent,
  since ten struct literals on main and every open logger branch build it. Instead, in
  crates/betterlite-logging/src/callback_logger/event.rs add `pub struct SuccessCall { pub call_details:
  IndexMap<String, Json>, pub response: Json, pub message_logging_redacted: bool }` (Json is betterlite_models'
  decisions::Json, as in event.rs). In the CallbackLogger trait (callback_logger.rs) add two methods with default
  bodies, so every existing logger keeps compiling:`fn reads_call_details(&self) ->
  bool` returning false, and `async fn async_log_success_call(&self, event: Arc<LoggerEvent>, call: Arc<SuccessCall>)
  -> Result<(), LoggerError>` whose default calls `self.async_log_success_event(event)`. Change nothing else in those
  two files. In logging_success, the async loop (run_async_callbacks in handler.rs and deliver_async in delivery.rs)
  keeps its current order and filters. For a logger whose reads_call_details is true and an event that is not a
  stream chunk (`plan.stream_event` false), it calls async_log_success_call instead of async_log_success_event. Build
  the SuccessCall at most once per delivery, only when such a logger is in the list, and share it as one Arc:
  call_details is a copy of `state.model_call_details` at that point, response is the assembled stream response stored
  under `async_complete_streaming_response` for a stream and `plan.prepared.result.response()` otherwise, and
  message_logging_redacted is `should_redact_message_logging(state, handler.privacy)` from request_redaction.rs (the
  request-level decision only, not the opted-out flag that redacts the shared payload). A stream chunk still goes to
  async_log_stream_event. The sync loop is unchanged, since LiteLLM's ShadowEvalLogger has no sync events.


  The logger. `ShadowEvalLogger` implements CallbackLogger with callback_name "ShadowEvalLogger", reads_call_details
  true, and async_log_success_call; every other method keeps its default. The name must not contain `_PROXY_`, so a
  request with `no-log` set never reaches it (should_run_callback, litellm_logging.py L2281-L2303). `new` takes, through
  one constructor and nothing global: B4083's job loader behind an `ActiveJobSource` trait, B4083's funnel recorder
  behind a `FunnelRecorder` trait, B4084's `ShadowRouterProvider` (the router, read at call time, may be None), a
  `ShadowEvaluation` trait whose production impl calls B4085's pipeline entry (its port of `_run_shadow_eval`) with the
  values below, a `SamplingClock` trait with `fn now(&self) -> DateTime<Utc>`, and the server's `TaskTracker`
  (tokio-util, already a dependency of betterlite-server) that each pipeline is spawned on. The admission state is one
  `std::sync::Mutex` holding the in-flight count and the per-job starts map, locked briefly and never across an await.
  `MAX_CONCURRENT_SHADOW_TASKS` is 16 (L57-L59).


  async_log_success_call(event, call) does this, in order, and returns Ok(()) on every path:

  1. request_metadata is B206's get_litellm_metadata_from_kwargs over call.call_details (litellm_metadata, else
  metadata, under litellm_params), or an empty map. When it holds a truthy `internal_call_origin`, return: the call is
  one of the gateway's own sub-calls (a shadow or judge call, a classifier). When call.message_logging_redacted is
  true, return.

  2. The targets are, in this order, ("key", user_api_key_hash), ("team", user_api_key_team_id) and ("user",
  user_api_key_user_id) from the payload's metadata (event.payload.metadata), each kept only when its value is a
  non-empty string. No targets, return. The request id is event.payload.id; empty, return.

  3. ops is B4082's surface_ops(event.payload.call_type); None, return. When ops has wire_params and B4082's
  request_mutating_guardrail_ran(request_metadata) is true, the sample kwargs are B4082's post_guardrail_kwargs(call
  details, request_metadata, surface, event.guardrail_snapshot), and None means return; otherwise they are the call
  details as they are. B4082 takes serde_json maps, so convert the call details once with serde_json::to_value.

  4. Read the active jobs from the job source. When the source reports that this read refilled the cache, clear the
  per-job starts first (LiteLLM resets `_job_starts` on every fill, L899). The candidates are the jobs of each target
  in target order. The model group is B4083's canonical_group(router, event.payload.model_group or "").

  5. Sampled jobs (L907-L936). Skip a job, with no funnel event, when now >= ends_at, when attempts plus this pod's
  starts for the job >= max_turns, when max_budget is set and spend >= max_budget, when B4083's direction_admits is
  false or when B4083's scope_admits is false. When B4083's sample_hits(request id, job id, shadow_percentage) is
  false, record `not_sampled` for the job and skip it. The rest are eligible, in order. None eligible, return.

  6. sample is B4082's judgeable_sample(ops, sample kwargs, payload.model_parameters, call.response). None means
  record `unjudgeable` once for each eligible job and return.

  7. The control values, read once: control_tier and real_classifier_cost from B4081's routed_tier and
  decision_classifier_cost over request_metadata, real_cost from payload.response_cost, real_cache_hit true only when
  payload.cache_hit is Some(true), real_model is payload.model.

  8. For each eligible job in order: when 16 pipelines are in flight, record `shed` and go on to the next job.
  Otherwise add the job's arm count (arm_router_names length, not 1) to its starts, add one to the in-flight count and
  spawn the pipeline on the tracker with the job, request id, messages, real_text, real_model, real_cost,
  real_classifier_cost, real_cache_hit, control_tier, shadow_params and a copy of request_metadata as parent_metadata.
  The in-flight count goes down when that pipeline ends for any reason, panic included: hold a guard in the spawned
  future whose Drop releases the slot (L1037-L1038).

  Anything that fails inside the hook is logged at debug level as "shadow_eval: failed to schedule task: {error}"
  and the hook still returns Ok(()), as LiteLLM's blanket except does (L1034-L1035); an Err would count a callback
  failure against a successful request.


  Tests. Behavior tests live in crates/betterlite-server/src/shadow_eval_logger/tests/ with rstest cases in four
  modules: gates (steps 1 to 3), sampling (steps 4 and 5), scheduling (step 8 and the slot release, with a pipeline
  fake that signals over a bounded channel) and control (steps 6 and 7). The seam tests are in
  crates/betterlite-logging/src/logging_success/tests/delivery.rs, with names that start with `success_call_`:
  success_call_carries_call_details_and_response, success_call_carries_the_assembled_stream_response,
  success_call_skipped_for_a_stream_chunk, success_call_reports_request_redaction and
  success_call_only_for_loggers_that_read_it; and in callback_logger/tests.rs
  success_call_default_runs_the_success_event and success_call_reads_no_details_by_default.


  Oracle. The helper operation of this task runs one success event through the hook with every dependency scripted
  and reports what the hook did. Its input: call_details (the kwargs without the payload), payload (id, call_type,
  model, model_group, response_cost, cache_hit, model_parameters and metadata with the three identity keys), response
  (a chat or Responses API response object), message_logging_redacted, snapshot (null, or a body and the metadata to
  capture it under), jobs (each with target_type and target_id plus ActiveShadowEvalJob's fields), model_group_alias
  (null for no router), in_flight and job_starts. Its output: the funnel events as (job id, stage) in order, the
  scheduled pipelines with every value step 8 passes, and job_starts afterwards. Use ends_at in 2000 or 2999 so the
  real clock never matters. The Python adapter builds ShadowEvalLogger with prisma_provider returning None, an
  InMemoryCache already holding the job mapping under "shadow_eval:active_jobs" (built with
  ActiveShadowEvalJob.model_validate), a funnel_recorder that appends to a list and router_provider returning None or a
  litellm Router with an empty model_list and the case's model_group_alias. It replaces `_run_shadow_eval` on the
  instance with a coroutine that records its arguments, sets `_inflight_shadow_tasks` and `_job_starts`, sets
  litellm.turn_off_message_logging from message_logging_redacted (and restores it), captures the snapshot with
  GuardrailRequestSnapshot.capture, puts the payload under standard_logging_object, awaits async_log_success_event and
  then the tasks it created. The Rust adapter builds the Rust logger with in-memory fakes for the same five
  dependencies and captures the snapshot with B4082's capture. Snapshot fingerprints differ in text between the two
  (B4082's deviation), so no output carries one.
