id: B3187
title: Provider form catalog from OpenAI Like through Predibase
description: >-
  Create the ordered fragment of the public provider form catalog in betterlite-server, covering the twelve provider definitions from OPENAI_LIKE through PREDIBASE.
  This fragment holds credential field metadata, display names, and model placeholders for each provider, consumed by B3190's get_provider_fields function as part of its assembled catalog.
  Preserve every credential field name, label, placeholder, tooltip, required flag, field_type and options value exactly as LiteLLM defines them at the pinned commit, including Oracle Cloud Infrastructure's PEM textarea for the private key.
  Store this fragment in its own asset path crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json so parallel workers do not rewrite a shared file; B3190 later assembles all fragments in the source order.
scope:
  paths:
    - crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/provider_create_fields.json#L2530-L2885
    why: The complete provider record definitions for OPENAI_LIKE, OpenAI_Text, OpenAI_Compatible, OpenAI_Text_Compatible, Openrouter, Nadir, Oracle, OVHCLOUD, Perplexity, PETALS, PG_VECTOR and PREDIBASE with their credential fields and default model placeholders.
dod:
  - text: The twelve provider records (OPENAI_LIKE through PREDIBASE) are preserved byte-for-byte from the LiteLLM source at the pinned commit.
    proof: [provider-records-preserved]
  - text: Sample credential fields match LiteLLM's exact field_type, label, and required values. OPENAI_LIKE has optional api_base and api_key; Oracle has six fields, all required, one of them the PEM textarea; PETALS and PG_VECTOR have optional api_key fields.
    proof: [credential-field-values]
  - text: Oracle's PEM private-key textarea field is preserved with its full placeholder text including the BEGIN/END markers and newline escaping.
    proof: [oracle-pem-field-intact]
  - text: Multiple OpenAI-compatible entries preserve their distinct provider display names and underlying litellm_provider identifiers.
    proof: [openai-variants-distinct]
  - text: The JSON file is a JSON array of twelve provider records in the expected order.
    proof: [provider-json-parses]
checks:
  optional: []
  commands:
    - id: provider-records-preserved
      why: the provider records differ from LiteLLM or a record is missing
      run: >-
        jq -e '[.[].provider] == ["OPENAI_LIKE", "OpenAI_Text", "OpenAI_Compatible", "OpenAI_Text_Compatible", "Openrouter", "Nadir", "Oracle", "OVHCLOUD", "Perplexity", "PETALS", "PG_VECTOR", "PREDIBASE"]'
        crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json
    - id: credential-field-values
      why: a credential field label, type or required flag does not match LiteLLM
      run: |
        jq -e '.[] | select(.provider == "OPENAI_LIKE") | .credential_fields[] | select(.key == "api_key") | .field_type == "password" and .required == false' crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json &&
        jq -e '.[] | select(.provider == "PETALS") | .credential_fields[] | select(.key == "api_key") | .required == false' crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json &&
        jq -e '.[] | select(.provider == "PG_VECTOR") | .credential_fields[] | select(.key == "api_key") | .required == false' crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json
    - id: oracle-pem-field-intact
      why: Oracle PEM key field is missing or modified
      run: |
        jq -e '.[] | select(.provider == "Oracle") | .credential_fields[] | select(.key == "oci_key") | .field_type == "textarea" and .label == "OCI Private Key (PEM)" and (.placeholder | contains("BEGIN RSA PRIVATE KEY"))' crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json > /dev/null
    - id: openai-variants-distinct
      why: OpenAI-compatible variants are collapsed or missing their distinct display names
      run: |
        jq -e '.[0].provider == "OPENAI_LIKE" and .[1].provider == "OpenAI_Text" and .[2].provider == "OpenAI_Compatible" and .[3].provider == "OpenAI_Text_Compatible"' crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json > /dev/null
    - id: provider-json-parses
      why: the JSON file does not parse or does not yield twelve records
      run: jq -e 'type == "array" and length == 12' crates/betterlite-server/assets/provider_create_fields_openai_like_predibase.json
oracle_cases: []
deviations: []
out_of_scope:
  - Consuming or assembling this fragment into a larger catalog. B3190 loads all fragments in source order.
  - Network behavior or credential validation. This task only preserves the form metadata.
  - Provider resolution or model execution. The task provides data only.
  - Provider records after PREDIBASE are owned by B3188 (PRISM through TOPAZ) and B3189 (Triton through WATSONX), with the final four (WATSONX_TEXT, xAI, XINFERENCE, CURSOR) and outer array delimiters owned by B3190.
pitfalls:
  - "The JSON file must be a plain array, not an object with a key. B3190's loader expects JSON.load(file) to yield a list directly."
  - "Every null value in options, placeholder or tooltip must be preserved exactly; missing the null and writing an empty string changes the wire format."
  - "The OpenAI_Text and OpenAI_Text_Compatible providers both map to the litellm_provider \"text-completion-openai\"; preserve both entries in order rather than merging them by provider identifier."
  - "The Oracle provider has a required PEM textarea field that spans multiple lines in its placeholder. Preserve the newlines and escaped characters exactly as written in the source."
  - "The Openrouter and Nadir providers have required api_key fields; Perplexity also has required api_key. PETALS and PG_VECTOR have optional (required: false) api_key fields, not required."
  - "Multiple providers (Nadir, Perplexity, PETALS, PG_VECTOR) have null placeholders and tooltips. Keep them as null, not as empty strings."
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
