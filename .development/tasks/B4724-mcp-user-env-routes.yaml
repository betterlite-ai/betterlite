id: B4724
title: MCP per-user environment status and mutation routes
description: >-
  Build the four per-user environment variable routes of the MCP management router in
  betterlite-server::mcp_user_env_routes, the status builder they share and the three wire types.
  All four sit under the router prefix /v1/mcp (LiteLLM mounts this router with that prefix only, so there is no /mcp/... or /openai/v1/... alias) and every one needs a valid key.
  Errors are FastAPI HTTPException values whose detail is an object, so the body is {"detail": {"error": "..."}} and not the OpenAI error shape.
  Every handler runs inside B865's management_endpoint_wrapper and unhandled errors pass through it unchanged.

  Wire types, JSON objects with these exact field names. MCPUserEnvVarsRequest has values, a map of string to string (required; a non-string value is a 422 from request validation).
  MCPUserEnvVarSpec has name, description (nullable, default null) and is_set (default false).
  MCPUserEnvVarsStatus has server_id, server_name (nullable), alias (nullable), required (list of MCPUserEnvVarSpec, default empty), missing_count (default 0) and setup_url (nullable).
  A response never carries a stored value: it reports only is_set.

  Status builder `compute_user_env_status(server, stored_values) -> MCPUserEnvVarsStatus` (LiteLLM `_compute_user_env_var_status`). Inputs are the authorized server table (B858's LiteLLM_MCPServerTable) and the user's stored map (B4714's UserEnvVars; compare only whether a value is non-empty).
  1. Call B6594's parse_admin_env_vars on the server's env_vars rows, converted with serde_json::to_value, to get the global values and the user specs. Then drop every global whose value is empty. An empty global is not a usable fallback, so it must not cover a user variable.
  2. referenced = B6594's collect_env_var_references over the values of the server's static_headers (a missing map is empty; LiteLLM also accepts a JSON string there, but the record types it as a map, so that form is not built).
  3. blocking = names that are in referenced, are a user spec name, and are not a key of the remaining globals.
  4. Walk user_specs in order. Skip a spec whose name is not in blocking. For the others, is_set = the stored value for that name is present and non-empty; when not set, add one to missing_count. Push MCPUserEnvVarSpec { name, description, is_set }.
  5. Answer server_id, server_name, alias, required, missing_count, and setup_url = B6594's build_env_var_setup_url(proxy_base_url, server_id) when required is non-empty, else null. proxy_base_url is a constructor field of the route state, filled by B8700 from PROXY_BASE_URL.
  A user variable that no static header references is never listed, even though the admin declared it.

  Routes, in the order LiteLLM declares them. Take the database handle, the stores and the caches as fields of the route state, never from globals.
  1. GET /v1/mcp/server/{server_id}/user-env-vars answers the caller's status.
  Order of checks: database present, caller has a user id, server authorized, read.
  No database gives 500 with detail.error "Database not connected. Connect a database to your proxy" (B4711's get_prisma_client_or_throw).
  An empty or missing user_id on the key gives 400 "User ID not found in token".
  The server comes from B4717's authorize_mcp_server (LiteLLM authorize_and_fetch_mcp_server) (admin: any server, 404 "MCP Server {server_id} not found" for unknown; non-admin: 403 outside the allowed set, never 404, with the message B4717 owns).
  Then B4714's get_user_env_vars(user_id, server_id) and compute_user_env_status.
  2. POST /v1/mcp/server/{server_id}/user-env-vars stores values. Same first three checks as route 1, same order.
  allowed_names = the names of the server's user specs (parse_admin_env_vars, all of them, referenced or not).
  updates = the entries of values whose name is in allowed_names and whose value is not the empty string. A name outside allowed_names is dropped without an error, and an empty value keeps the stored one.
  Call B4714's merge_user_env_vars(user_id, server_id, updates, allowed_names), then drop the gateway cache entry for (user_id, server_id) through the UserEnvVarsCache port below, and answer compute_user_env_status with the merged map. Because merge prunes stored names outside allowed_names, a retired variable disappears on the next POST, even one with an empty body values.
  3. DELETE /v1/mcp/server/{server_id}/user-env-vars clears the caller's values. Same first three checks.
  Call B4714's delete_user_env_vars, then the same cache drop, and answer compute_user_env_status with an empty map, so every blocking variable reports is_set false and missing_count equals the number listed. A missing row is not an error.
  4. GET /v1/mcp/user-env-vars/status lists the caller's status across the servers they can use.
  Database check first (500 as above), then an empty user id answers [] (200, not 400; this route differs from the other three).
  accessible = B4717's resolve_accessible_servers for the caller (LiteLLM resolve_accessible_mcp_servers; credential-free list of server table rows, deduplicated by server_id). An empty list answers [].
  Otherwise one B4714 get_user_env_vars_bulk(user_id, ids) call for all ids, and a status per server (missing entry means an empty map). Keep only statuses whose required list is non-empty, in the order of accessible.

  Cache port. LiteLLM drops the entry with the manager's invalidate_user_env_vars_cache(user_id, server_id) after a POST and after a DELETE (not after a failed write: an error from merge or delete leaves the cache alone). Declare a trait `UserEnvVarsCache` in this module with `fn invalidate(&self, user_id: &str, server_id: &str)`, hold it as a `Arc<dyn UserEnvVarsCache>` field of the state, and use an in-memory fake that records calls in the tests. The cache itself (60 second TTL, 4096 entries, written by the gateway read path) is not built here; see notes.

  Routes 1 to 3 do not read the server's env_vars from a stale copy: they use the table that authorize_mcp_server returns for this request.
  Native tests use fakes for the store, the authorizer and the cache, with a recorded event list. Do not need a live Postgres.

