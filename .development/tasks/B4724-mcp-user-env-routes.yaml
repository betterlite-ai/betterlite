  optional: []
  commands:
    - id: status-tests
      why: the status builder is missing or its blocking, empty-global or setup_url rules are untested
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp_user_env_routes::status::/)'
    - id: route-tests
      why: the route module's tests are missing or fail, so a check order, an error text, a cache drop or a response shape is untested
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp_user_env_routes::/) - test(/^mcp_user_env_routes::status::/)'

