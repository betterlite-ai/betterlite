dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports; B8700 mounts the routes and proves the items below over HTTP with the cases that moved there.
    proof: [route-tests]
  - text: >-
      compute_user_env_status lists only user variables that a static header references and no non-empty global covers,
      reports is_set from a non-empty stored value, counts the unset ones in missing_count, and sets setup_url only when the list is non-empty.
    proof: [status-tests]
  - text: >-
      An empty-valued global does not cover a user variable, and a non-empty global does.
    proof: [status-tests]
  - text: >-
      Route 1 answers the caller's status with the checks in order (no database 500, empty user id 400, authorization 404 or 403) and reads only the caller's row.
    proof: [route-tests]
  - text: >-
      Route 2 keeps only declared names with non-empty values, merges them over the stored values, drops the cache entry after the write and answers the merged status.
      A name the server does not declare is never stored, and an empty value keeps the stored one.
    proof: [route-tests]
  - text: >-
      Route 3 deletes the caller's row, drops the cache entry, answers every blocking variable as unset, and treats a missing row as success.
    proof: [route-tests]
  - text: >-
      Route 4 answers [] for a caller without a user id or without accessible servers, uses one bulk read, and lists only servers with at least one required variable.
    proof: [route-tests]
  - text: >-
      No response body and no log line contains a stored value, and the cache is left alone when the store call fails.
    proof: [route-tests, status-tests]
  - text: >-
      The four routes are registered under /v1/mcp with the methods and paths in the description, and the three wire types serialize with LiteLLM's field names and defaults.
    proof: [route-tests]

