out_of_scope:
  - "get_prisma_client_or_throw: owned by B4711. get_user_env_vars, get_user_env_vars_bulk, merge_user_env_vars, delete_user_env_vars and UserEnvVars: owned by B4714."
  - "_authorize_and_fetch_mcp_server and _resolve_accessible_mcp_servers: owned by B4717 as authorize_mcp_server and resolve_accessible_servers. _user_has_admin_view (user_api_key_has_admin_view): owned by B2314."
  - "parse_admin_env_vars, collect_env_var_references and build_env_var_setup_url: owned by B6594. LiteLLM_MCPServerTable and MCPEnvVar: owned by B858."
  - "management_endpoint_wrapper: owned by B865."
  - "The gateway's per-user env var cache (_user_env_vars_cache, _write_user_env_vars_cache and its read in the tool-call path) and the body of invalidate_user_env_vars_cache: no task owns them at this commit; this task owns only the UserEnvVarsCache port that calls it."
  - "The other routes in mcp_management_endpoints.py: B4719 to B4723, B4725 to B4729 and the temporary OAuth session routes own them."

pitfalls:
  - Route 4 answers [] with status 200 for a key without a user id, while routes 1 to 3 answer 400 "User ID not found in token"; do not unify them.
  - Routes 1 to 3 check the database before the user id, and the user id before the server, so a missing database wins over a missing user id, and a missing user id wins over an unknown server.
  - The status lists a user variable only when a static_headers value references it as ${NAME} and no non-empty global of the same name exists; an unreferenced declared variable is silently absent, and so is its stored value in is_set.
  - An empty-string global (value "") is filtered out before the blocking test, so it does not satisfy a reference; B6594's parse_admin_env_vars returns "" for a null or missing global value.
  - POST drops an undeclared name and an empty-string value without any error, and merge_user_env_vars still removes previously stored names that are no longer declared, so a POST with values {} can shrink the stored set.
  - DELETE answers the status computed with an empty stored map, not a re-read, so is_set is false for all of them even if another worker still has a cached value.
  - The cache drop comes after the write, and a write error must leave the cache entry in place and the error unchanged through the wrapper.
  - A non-admin missing from the allowed set gets 403 on routes 1 to 3, never 404, so server ids cannot be enumerated; only an admin gets 404 for an unknown id.
  - The values in the request body are secrets. Do not log the body, do not derive Debug on the request type with the map visible, and keep stored values out of every error text.
  - The 422 for a non-string value in values comes from request validation in FastAPI's own shape (a list under "detail"), not from the handler.

