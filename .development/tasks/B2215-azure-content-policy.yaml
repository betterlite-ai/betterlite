out_of_scope:
- Exception classes are B184; generic Azure classifier call sites in exception_mapping_utils.py are B237. Stream
  send/wrapper behavior is B685. This module parses no bytes, assigns no routes and does not inspect choices/finish_reason.
pitfalls:
- An empty nested error object wins over a populated outer body.
- Only truthiness controls inner-error selection; the extracted value is not validated as a dictionary.
