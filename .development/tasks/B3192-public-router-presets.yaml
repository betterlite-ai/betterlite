id: B3192
title: Public router presets and scorer defaults
description: >-
  Build GET `/public/autorouter_presets`, `/public/complexity_router/scorer_defaults` and `/public/complexity_router/fuse_presets`
  in `betterlite-server::public_endpoints::router_presets`.

  The scorer_defaults endpoint returns the three baseline collections the complexity router ships with: `DEFAULT_DIMENSION_WEIGHTS`,
  `DEFAULT_TIER_BOUNDARIES` and `DEFAULT_TOKEN_THRESHOLDS` from B328.
  The fuse_presets endpoint calls B353's `get_fuse_presets` and returns its catalog.
  The autorouter_presets endpoint fetches from `litellm_settings.autorouter_presets_url` (env override `LITELLM_AUTOROUTER_PRESETS_URL`,
  default `https://raw.githubusercontent.com/BerriAI/litellm/main/litellm/proxy/public_endpoints/autorouter_presets.json`)
  with a five-second timeout using B173's pooled client, caching the result once per process, and falling back to the bundled catalog
  on any failure with a warning logged. Local-only mode activates only for case-insensitive `LITELLM_LOCAL_AUTOROUTER_PRESETS=true`;
  empty remote maps count as a failure, while bundled-map decode errors propagate.

  Add a betterlite-config section (crates/betterlite-config/src/sections/public_router_presets.rs) to load
  litellm_settings.autorouter_presets_url with LITELLM_AUTOROUTER_PRESETS_URL env override and LITELLM_LOCAL_AUTOROUTER_PRESETS
  for local-only mode. The config loader resolves both env vars so router_presets.rs only reads the resolved values through its constructor.

  The AutoRouterPresetTiers record enforces exactly the four built-in tiers `SIMPLE`, `MEDIUM`, `COMPLEX` and `REASONING` with strict validation
  (`extra="forbid"`), since a tier name the dashboard cannot apply would grey out or crash the preset picker. The AutoRouterPresetConfig
  allows forward-compatible extra fields elsewhere (`extra="allow"`). Preserve the five complete preset records in the bundled JSON as data;
  their model names do not create provider execution dependencies.
scope:
  paths:
    - crates/betterlite-server/src/public_endpoints/router_presets.rs
    - crates/betterlite-server/src/public_endpoints/router_presets/**
    - tools/oracle/cases/public/autorouter-presets.yaml
    - tools/oracle/cases/public/scorer-defaults.yaml
    - tools/oracle/cases/public/fuse-presets.yaml
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/autorouter_presets.rs
    - crates/betterlite-server/fuzz/corpus/autorouter_presets/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/public-router-presets-*
    - crates/betterlite-config/src/sections/public_router_presets.rs
    - crates/betterlite-config/src/sections/public_router_presets/**
    - tools/oracle/helpers/b3192.py
    - tools/oracle/helpers/b3192/**
    - tools/oracle/src/helpers/server/b3192.rs
    - tools/oracle/src/helpers/server/b3192/**
  lint_tables: false
