oracle_cases: []
deviations:
  - what: The handler and endpoint starter are passed to the session constructor, and the harness registry is a set of match functions, not a lookup that returns a config object.
    why: Config and handler traits have associated types, and the Deep Agents handler lives in a crate that depends on this one. The behavior a user sees is the same.
  - what: Asking for a harness with no registered config or handler (L14-L16, L31) cannot happen.
    why: Harness is a closed enum, so every member is registered.
  - what: Using a closed or detached session fails with betterlite's SessionClosed message, not "session is closed".
    why: The error enum already exists on main from B4830 with its own text.
  - what: There is no `__await__`, `__aenter__` or `__aexit__`; callers call start and close.
    why: Rust has no async context manager. B4848 wraps the calls where the public entry points need them.
out_of_scope:
  - "SessionConfig, build_config, validate, context_for, parse_output and resolve_model_route (runtime.py L72-L255) belong to B4844 and are called here."
  - "TurnControl, pump_events, call_approval_handler, _Turn, _End and `turn_events` (L259-L541, L732-L741) belong to B4847, which depends on this task and uses ensure_ready, begin_turn, end_turn and record."
  - "AsyncEventStream, _one_shot, astream, arun, _collect, aagent_session, arun_agent, astream_agent, _coerce_state, aagent_resume, agent_capabilities and aagent (L544-L582, L743-L748, L779-L1028) belong to B4848. agent_capabilities is one call to this task's harness_capabilities."
  - "ModelEndpoint itself and its accounting are B4841 and its server is B4843; this task only starts and stops them."
  - "The CLI handler (B4839) and the Deep Agents handler (B4840) are built already or by those tasks; the session takes whichever handler it is given."
  - "ProviderConfigManager methods other than get_provider_harness_config in litellm/utils.py belong to B2202 and its siblings; the harness one is the registry here."
pitfalls:
  - launch calls handler.resume only when native_id is set and (resume_from is set or restart_needed is true); a fresh first start with no resume_from must not call it even if the handler already has an id.
  - start closes the endpoint when launch fails but never marks the session closed, so the same session can call start again.
  - interrupt takes the handler's native id with `handler.native_session_id() or self._native_id`, so a handler that returns None keeps the saved id.
  - ensure_ready clears restart_needed after the relaunch, not before; clearing it first would lose the resume after a failed relaunch.
  - aclose sets closed before it stops anything, so a second call during a slow stop returns at once; both stop failures are logged and swallowed.
  - state() asks the handler for the native id only while started and not closed, because a closed session has stopped its handler and the saved id is the truth.
  - The endpoint is built only when `uses_model_endpoint` is true; the Deep Agents config sets it false, and its usage then comes from `ctx.outcome`.
  - Summing token counts must use checked_add; B4830's Usage::total_tokens shows the overflow error to reuse.
  - "SessionContext.endpoint must be None before start and after close, because the handlers treat None as no model endpoint and return their missing-endpoint error."
  - "TurnPermit clears busy in Drop, so end_turn is only a normal-path drop; never store busy as a plain bool, because the permit needs its own Arc clone."
review_level: standard
budget:
