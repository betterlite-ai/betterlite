dod:
  - text: Constructing a session validates, rejects resume on a harness without the resume capability, builds the context with a fresh session id and runs validate_environment, all before any handler or endpoint call.
    proof: [lifecycle-tests]
  - text: start opens the endpoint only for a harness that uses one, runs handler.start, and calls handler.resume only when a native id exists and the session was built with resume_from or restarted after an interrupt.
    proof: [lifecycle-tests]
  - text: A failed start closes the endpoint, returns the handler's error and leaves the session unstarted; start on a closed session fails with SessionClosed and start on a started session does nothing.
    proof: [lifecycle-tests]
  - text: interrupt keeps the handler's native id, tolerates a failing handler.stop and makes the next ensure_ready relaunch the handler with resume; a failed relaunch keeps restart_needed set.
    proof: [interrupt-tests]
  - text: close stops the handler only when started, stops the endpoint, survives failures of both, and is safe to call twice.
    proof: [interrupt-tests]
  - text: state, detach and stop return the harness, workdir, model, STATE_VERSION and the live native id while running, or the saved id once closed.
    proof: [state-tests]
  - text: usage_counters reads the endpoint when one is held and the context outcome otherwise; record, cost and usage add up the recorded results and report TokenOverflow on overflow.
    proof: [state-tests]
  - text: history fails without the capability and otherwise readies the session and returns the handler's history; begin_turn fails with TurnRunning while a turn is marked running. A permit dropped without end_turn leaves the session not busy.
    proof: [state-tests]
  - text: The registry gives the right capabilities, endpoint use and handler kind for each of the four harnesses, and validates through the matching config.
    proof: [registry-tests]
  - text: The production endpoint starter serves on loopback, reports zero usage at first and refuses connections after stop.
    proof: [endpoint-tests]
  - text: After start, ctx.endpoint holds the running endpoint's url, port, token and model for a harness that uses one and stays None otherwise, and close clears it.
    proof: [endpoint-tests]
