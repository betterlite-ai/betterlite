id: B870
title: Resolve keys to principals through injected stores
description: >-
  Implement IdentityStore in betterlite-auth::identity_store over B732 principals and B2314 resolved
  keys. Own its constructor, resolve, key_from_principal, _resolve_key and _principal_from_key.
  Constructor defaults parent_otel_span/proxy_logging_obj to None and check_cache_only to false;
  resolve defaults auth_method to API_KEY and network to None. These are arguments, not settings.
  The store receives an already hashed token and must not hash it again or consult a key repository
  independently of the injected reader.

  _resolve_key first rejects an absent database, EVEN with a warm key cache or check_cache_only=true,
  with B732 NoDatabaseConnectionError and the virtual-keys help URL. Otherwise read the exact supplied
  hash through B733 cache with UserAPIKeyAuth model_type. A nonnull hit returns B733's shallow cache
  copy without revalidation, clearing exactly budget_reservation, budget_throttle_pct, parent_otel_span
  and request_route. Do not mutate the cached object, refetch permissions, refresh its timestamp or
  write it back on a hit. Cache errors propagate. On a miss, check_cache_only raises KeyNotInCacheError
  before any DB reader call. Otherwise fetch with the hash, DB, span and logging sink; the reader
  owns reconnect/retry. A null result raises KeyNotFoundError. A row is dumped with exclude_none=true
  and constructed through B2314 UserAPIKeyAuth before any permission or cache write.

  Only a truthy object_permission_id together with a falsey object_permission triggers a permission
  read using the same DB/cache/span/logging arguments. A null result stays null. Any ordinary loader
  exception is swallowed after DEBUG "Failed to load object_permission for key with object_permission_id=%s: %s";
  it does not reject authentication. Existing permission data skips that call. Then always await the
  cache-writer port with the original hash and the mutable key; it preserves B734's timestamp update,
  cache-copy cleanup and write policy. Writer errors propagate after the permission read. There are
  no database writes here, and no transaction around these effects.

  Use KeyReader::fetch_with_reconnect and PermissionReader::load interfaces with the full
  arguments above, plus KeyWriter::cache_key taking a mutable resolved key and logging sink. B738,
  B735 and B734 respectively provide their existing source-equivalent services as direct dependencies.
  No reverse edge is needed for those owners; do not replace them with simpler get/put
  stubs that lose reconnect, timestamp, TTL or cache-side behavior. B733 owns direct cache reads and
  copy_for_cache and is a direct dependency. An absent required implementation is a named startup
  error; configured DB absence remains the separate runtime error. Port contract tests record every
  argument, effect order and error. Actual integration uses production implementations when installed.

  resolve projects the loaded key with subject_fallback=key.token and CredentialRef(token_id=key.token),
  never the requested hash when those differ. _principal_from_key requires auth_method and defaults
  issuer/subject_fallback/credential_ref/network to None and scopes to an empty sequence. A nonnull
  team_id, including '', creates one TeamIdentity with team_alias; team_member.role goes through
  B732 team_role (only exact 'admin' is admin), and absent member means member. Nonnull org_id,
  user_id, project_id and end_user_id independently create identities using organization_alias,
  user_email and project_alias where applicable. Empty IDs still create those records.

  principal_type is HUMAN only for a TRUTHY user_id, otherwise SERVICE_ACCOUNT, even if an empty-ID
  user record was constructed. subject is the first truthy user_id, key_alias, subject_fallback,
  then ''. Map only B732's recognized legacy roles to a one-element roles list; unmapped roles
  produce []. Copy scopes preserving order/duplicates, preserve issuer/auth_method, and use a fresh
  default CredentialRef/NetworkContext when omitted. Carry the exact resolved key as source_key;
  B732 excludes it from serialization. key_from_principal returns that carrier unchanged or raises
  PrincipalMissingSourceKeyError, not a token lookup or an HTTP error invented by this method.

  Through B757, missing keys retain status 401, type token_not_found_in_db, param key, string code
  '401', and create-key guidance. Missing DB and cache-only miss become 401 auth_error, param 'None',
  code '401'; source messages distinguish "No DB Connected. See - https://docs.litellm.ai/docs/proxy/virtual_keys"
  and "Key doesn't exist in cache + check_cache_only=True. key={hash}." Missing source key says
  "Principal carries no source key; it was not produced by IdentityStore.resolve" but is an internal
  carrier failure, not a route-generated case. Preserve B732/B757's diagnostic redaction policy.

  Only projection and carrier extraction are pure oracle operations under B856 Management::auth.
  Python invokes the actual static methods; stateful lookup/reconnect/cache tests are native tests.
  Wire the stage through B732 into an existing protected /v1/chat/completions route and compare the
  real MIT HTTP envelope for missing-key and no-DB fixtures, plus a valid-key request reaching the
  mock provider. Do not add a test-only endpoint or a nonexistent unauthorized-caller rule. B860
  tests use POSTGRES_TEST_URL when set and testcontainers otherwise; a bad configured URL fails.
  Native stage_is_registered, required_ports_missing and failure_stops_downstream exercise the real
  server constructor. cache_copy_isolation, no_db_before_cache, cache_only_miss, reader_arguments,
  row_validation_before_permissions, permission_failure_debug_then_cache, permission_skip_and_none,
  writer_mutation_visible and writer_failure_propagates cover the ordered effects.

  store.py contains 147 nonblank noncomment lines including imports and excluding docstrings.
  Reserve 155 production, 265 focused tests, 75 pure adapters and 85 server wiring lines, 580 within
  600. This consumes typed records and the existing HelperCase decoder, so adds no byte parser.
