    why: B757 retains ProxyException codes and maps ordinary resolver failures to auth_error.
dod:
  - text: Named ordered-effect tests distinguish DB absence, cache hit/miss/error, cache-only mode, invalid row, optional permission failure and writer failure without silent success stubs.
    proof: [behavior-tests]
  - text: Projection cases cover all identity fields, empty IDs, role maps, subject precedence, default context, ordered scopes and exact carrier recovery.
    proof: [behavior-tests, helper-python, oracle, helper-case-corpus]
  - text: Registered production stages pass a real valid request and return source-compatible missing-key/no-DB errors while stopping downstream calls on failure.
    proof: [stage-wiring-tests, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: IdentityStore ordering or principal projection lacks executable assertions.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^identity_store::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Pure projection adapter is absent or fails strict checking.
      run: test -f tools/oracle/helpers/identity_store.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: New projection operation is absent from decoder seeds.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/identity-store-*")" && grep -rlq "identity_store" tools/oracle/fuzz/corpus/helper_case/identity-store-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: Actual server construction omits a required store port or fails to stop after rejection.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::identity_store::tests::/) - test(/replays_the_/)'
oracle_cases:
  - tools/oracle/cases/helpers/identity-store/all-identity-fields.yaml
  - tools/oracle/cases/helpers/identity-store/empty-user-id-service-account-with-user.yaml
  - tools/oracle/cases/helpers/identity-store/subject-precedence.yaml
  - tools/oracle/cases/helpers/identity-store/team-member-role-defaults.yaml
  - tools/oracle/cases/helpers/identity-store/mapped-and-unmapped-roles.yaml
  - tools/oracle/cases/helpers/identity-store/default-context-and-ordered-scopes.yaml
  - tools/oracle/cases/helpers/identity-store/source-key-roundtrip.yaml
  - tools/oracle/cases/helpers/identity-store/missing-source-key.yaml
  - tools/oracle/cases/auth/identity-store/valid-key-reaches-provider.yaml
  - tools/oracle/cases/auth/identity-store/missing-key-token-not-found.yaml
  - tools/oracle/cases/auth/identity-store/no-database-auth-error.yaml
deviations: []
out_of_scope:
  - B732 owns the Principal/identity/role/error records and B2314 owns UserAPIKeyAuth validation; this store only projects them.
  - B733 owns cache reads and copy_for_cache. Direct dependencies B734, B735 and B738 implement the writer, permission loader and reconnecting reader respectively; this task composes their production services.
  - B757 owns HTTP auth-error translation, failure hooks and DB-outage recovery. This task does not add its own recovery policy.
pitfalls:
  - An object-permission lookup exception is logged at DEBUG and ignored; describing the whole resolver as fail-closed changes this branch.
  - The database-presence check precedes even a cache hit, so cached credentials do not make a database-free store valid.
  - Empty user_id creates a UserIdentity but selects service_account as the principal type.
budget:
  max_changed_lines: 600
  max_new_expects: 0
review_level: security
