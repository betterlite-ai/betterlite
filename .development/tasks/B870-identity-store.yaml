id: B870
title: Resolve keys to principals through injected stores
description: >-
  Implement IdentityStore key cache lookup, typed DB refetch with one reconnect retry, object_permission
  load and principal projection. Inject KeyCache::get(KeyHash)->Result<Option<KeyRow>,CacheError>, KeyReader::get(KeyHash)->Result<Option<KeyRow>,DbError>
  and PermissionReader::get(PermissionId)->Result<Option<ObjectPermission>,DbError>. B733/B738 and B715
  supply implementations later; this leaf defines required ports and tests fail-closed behavior. KeyNotFoundError
  is 401 auth_error param key code token_not_found_in_db; a missing source key is distinct.


  Injected port instead of a reverse dependency on B734: KeyCache::put(KeyHash,KeyRow)->Result<(),CacheError>;
  B734 installs cache mutation. A configured but unregistered implementation is a named startup error,
  never a success stub.


  Injected port instead of a reverse dependency on B738: KeyReader::get(KeyHash)->Result<Option<KeyRow>,DbError>
  and PermissionReader::get(PermissionId)->Result<Option<ObjectPermission>,DbError>; B738 supplies key
  refetch and B735 supplies permission reads. A configured but unregistered implementation is a named
  startup error, never a success stub.


  Injected port instead of a reverse dependency on B735: PermissionReader::get(PermissionId)->Result<Option<ObjectPermission>,DbError>;
  B735 implements row loading. A configured but unregistered implementation is a named startup error,
  never a success stub.


  Build the production identity_store module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/resolvers/store.py:
  IdentityStore.__init__ (L59-L72; 14 source lines), IdentityStore.resolve (L74-L88; 15 source lines),
  IdentityStore.key_from_principal (L91-L100; 9 source lines), IdentityStore._resolve_key (L102-L146;
  39 source lines), IdentityStore._principal_from_key (L149-L191; 42 source lines).


  Add the identity_store operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a identity-store-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 119 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  119 production, 148 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 397 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::identity_store::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
