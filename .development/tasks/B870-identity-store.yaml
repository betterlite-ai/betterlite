    why: Own IdentityStore.key_from_principal; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/resolvers/store.py#L102-L146
    why: Own IdentityStore._resolve_key; preserve caller-visible values and failure ordering.
