  - tools/oracle/cases/auth/identity-store/refetch-reconnect.yaml
  - tools/oracle/cases/auth/identity-store/permission-load.yaml
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Inject KeyCache::get(KeyHash)->Result<Option<KeyRow>,CacheError>, KeyReader::get(KeyHash)->Result<Option<KeyRow>,DbError>
    and PermissionReader::get(PermissionId)->Result<Option<ObjectPermission>,DbError>.
budget:
