id: B1026
title: Azure file storage backend
description: >-
  Implement azure_blob_storage_backend.py completely in betterlite-core::api::file_azure_storage.
  Consume B1025's storage contract, B2460 safe_filename, B171 segment quoting and B115's Azure
  storage authentication/client/create/flush primitives through injected ports. B129 secret-manager
  integration is not the owner of AzureBlobStorageLogger and is not called here. All outbound I/O
  uses B173. periodic_flush and success/failure logging overrides do nothing, and inherited delete
  remains a successful no-op. No logger queue or paid-tier check is activated for file storage.

  B115/B002 resolve AZURE_STORAGE_ACCOUNT_NAME and AZURE_STORAGE_FILE_SYSTEM (required nonempty),
  AZURE_STORAGE_ACCOUNT_KEY, AZURE_STORAGE_TENANT_ID, AZURE_STORAGE_CLIENT_ID,
  AZURE_STORAGE_CLIENT_SECRET, and AZURE_STORAGE_ENDPOINT_SUFFIX (unset/empty => core.windows.net).
  The account key wins when truthy; otherwise use B115 token management. Endpoints are configured
  https://<account>.dfs.<suffix> and https://<account>.blob.<suffix>. Pass clock and UUID source in.

  SDK operations reach Azure HTTP: add B2401 SdkHttpCall::FileAzureStorage, Rust/Python dispatch
  adapters and captures for both account-key SDK and Azure-AD REST operations. Bind their configured
  endpoints to the harness mock, leaving operation transforms active. Only pure naming has a B171
  file_azure_storage helper. Native tests and loader tests use api::file_azure_storage::tests.
  The owned source span contains 203 nonblank, non-comment lines. Budget 200 backend, 150 tests,
  130 HTTP/helper cases, 120 adapters, 50 config tests and 30 wiring lines: 680 total.
