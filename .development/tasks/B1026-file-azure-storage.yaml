references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/files/azure_blob_storage_backend.py#L22-L311
  why: Owns basename/extension/naming helpers and all backend methods, with account-key versus token upload/download branches.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/azure_storage/azure_storage.py#L59-L116
  why: B115 owns credential initialization and configured DFS/blob origins; the file subclass reuses them.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1544-L1545
  why: REST x-ms-version is 2019-07-07 and the default endpoint suffix is core.windows.net.
dod:
- text: >-
    azure_filename_strategies supplies dir/a b.TXT: original_filename gives a%20b.TXT, timestamp
    at 1.234 seconds gives 1234.TXT, and fixed UUID 00000000-0000-0000-0000-000000000001 gives
    that UUID plus .TXT. Unknown strategy also uses UUID. Invalid basename "", .. or a NUL falls
    back to file, with no extension. .env has none, a.tar.gz uses gz, and path traversal before the
    final component cannot become an extension. UTF-8 original basenames are percent-quoted.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    account_key_upload sends three bytes abc, prefix=/p/ and original_filename=a.txt. Against a
    missing filesystem and directory, captures show existence checks, create filesystem, create
    directory p, create file, append offset=0/length=3, then flush position=3/offset=0. Existing
    filesystem/directory skips their creation; root files skip directory calls. Return is the
    configured blob origin /<filesystem>/p/a.txt, not DFS. content_type=text/plain is ignored here.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    token_upload_sequence with no account key sends create PUT ?resource=file, PATCH
    ?action=append&position=0 with exact binary bytes and content-type=application/octet-stream,
    then B115's flush request at the final byte length. Append carries x-ms-version=2019-07-07 and
    Authorization=Bearer <resolved-token>. A slash-only truthy prefix produces /<filename> after
    stripping, unlike an absent prefix. Failed append propagates its 403/429/500 HTTP error and
    prevents flush; no compensating delete is issued. Errors are logged and rethrown.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    azure_download_addressing supplies https://foreign.blob.example/other/p/a.txt?sig=ignored and
    expects a request for p/a.txt on the configured account/filesystem, with the query discarded.
    A host without .blob. raises ValueError "Invalid Azure Blob Storage URL: <input>"; a URL
    containing only /container raises "Invalid Azure Blob Storage URL format: <input>" before
    HTTP. Account-key mode checks filesystem existence and a missing one raises "Filesystem fs
    does not exist"; token mode GETs the configured blob URL with the same version/Bearer headers.
    Successful downloads return exact binary bytes and non-2xx responses propagate.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    loads_settings uses the real environment loader for each listed AZURE_STORAGE_* variable,
    checks core.windows.net and explicit core.usgovcloudapi.net, and verifies missing account and
    filesystem errors name the exact missing variable. Account-key precedence and empty-key token
    fallback are observed in the request captures. logger_overrides_do_nothing proves no periodic,
    success, failure or delete callback emits storage requests or queues a log record.
  proof: [config-tests, behavior-tests, oracle, python-adapters]
- text: Both naming and HTTP operation tags have added cases and parse through their existing decoders.
  proof: [case-seeds, new-cases, oracle, python-adapters]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Azure operations or naming have no tested implementation
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::file_azure_storage::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: Azure storage environment settings are not exercised by Config
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::file_azure_storage::tests::loads_settings($|::)/)'
  - id: python-adapters
    why: either the naming helper or Azure HTTP adapter is missing or invalid
    run: test -f tools/oracle/helpers/file_azure_storage.py && test -f tools/oracle/sdk_http/file_azure_storage.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: case-seeds
    why: Azure helper or SDK operation tag lacks an added parser seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_azure_storage-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/file-azure-storage-*)" && grep -qE '^[[:space:]]+file_azure_storage:' tools/oracle/fuzz/corpus/helper_case/file_azure_storage-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)' && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: the backend has no new outbound HTTP comparisons
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/file-azure-storage)"
oracle_cases:
- tools/oracle/cases/helpers/file-azure-storage/azure-filename-strategies.yaml
- tools/oracle/cases/sdk-http/file-azure-storage/account-key-upload.yaml
- tools/oracle/cases/sdk-http/file-azure-storage/token-upload-sequence.yaml
- tools/oracle/cases/sdk-http/file-azure-storage/azure-download-addressing.yaml
deviations: []
out_of_scope:
- B115 owns inherited get_service_client, set_valid_azure_ad_token, _create_file, _flush_data and Azure environment/token lifetime rules; use those ports directly.
- B1025 owns the storage trait/default delete; B1027 selects the backend and builds the public file object.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_azure_storage in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_azure_storage.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_azure_storage.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The supplied download URL contributes only a path after its first segment; neither its host nor its container chooses the outbound destination.
- The content_type argument never sets Azure upload metadata in this backend; append is always application/octet-stream.
- Unknown naming strategies use uuid silently, and invalid filenames become file instead of aborting storage.
review_level: security
budget:
  max_changed_lines: 680
  max_new_expects: 0
