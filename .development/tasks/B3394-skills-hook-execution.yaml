    why: LITELLM_SKILL_ID_PREFIX, DEFAULT_MAX_ITERATIONS and DEFAULT_SANDBOX_TIMEOUT constants.
dod:
  - text: __init__ stores max_iterations and sandbox_timeout from kwargs, defaulting to 10 and 120 seconds.
    proof: [hook-init]
  - text: _extract_tool_calls extracts tool_uses from both Anthropic dict content blocks (isinstance check,
      dict.get) and object content blocks (getattr with type comparison and field access).
    proof: [tool-call-extraction-anthropic]
  - text: _extract_tool_calls extracts tool_calls from OpenAI format (choices[0].message.tool_calls)
      and parses tool_call.function.arguments via json.loads, allowing malformed JSON to propagate
      as parse error.
    proof: [tool-call-extraction-openai, json-parsing]
  - text: _extract_tool_calls prefers Anthropic content path; OpenAI path runs only if no Anthropic
      tool_uses are found.
    proof: [tool-call-extraction-preference]
  - text: _execute_code calls executor.execute with code and skill_files, collects generated files
      with size from base64-decoded bytes, appends error text, catches exceptions into result string.
    proof: [code-execution]
  - text: _execute_skill_tool selects the first Python module with builder/creator/generator in its
      path, otherwise the first non-__init__.py module, generates import and class discovery code,
      calls _execute_code.
    proof: [skill-tool-execution]
  - text: _execute_skill_tool uses fallback code that prints "No executable skill module found" when
      no Python modules are found.
    proof: [skill-tool-fallback]
  - text: _attach_files_to_response returns response unchanged when generated_files is empty.
    proof: [file-attachment]
  - text: _attach_files_to_response sets response["_litellm_generated_files"] for dict responses.
    proof: [file-attachment]
  - text: _attach_files_to_response sets response._litellm_generated_files for object responses and
      silently swallows AttributeError without logging.
    proof: [file-attachment]
  - text: _attach_files_to_response writes model_extra["_litellm_generated_files"] when response.model_extra
      is present.
    proof: [file-attachment]
  - text: Every mutant in the hook module is caught by a test.
    proof: [mutants]
