id: B3394
title: Skill hook settings and execution result handling
description: >-
  Build the hook state and reusable execution/result helpers in betterlite-core::api::skills, with injected prompt and sandbox services.

  Implement SkillsInjectionHook methods for tool-call extraction, code execution, and file attachment.
  The __init__ method reads DEFAULT_MAX_ITERATIONS (10) and DEFAULT_SANDBOX_TIMEOUT (120) seconds from constructor kwargs with those defaults, storing them as fields.

  _extract_tool_calls handles both Anthropic and OpenAI formats. For Anthropic: scan response.content
  or response.get("content") for tool_use blocks, extracting from both dict blocks (isinstance check,
  dict.get) and object/attribute blocks (getattr with type comparison and field access). For OpenAI:
  scan response.choices[0].message.tool_calls, parse tool_call.function.arguments via json.loads
  (malformed JSON propagates as parse error, never caught). Anthropic path is preferred; OpenAI runs
  only if Anthropic found no tool_uses.

  _execute_code calls the injected SkillsSandboxExecutor with code and skill_files, then builds a
  result string from output, error and files. Collect generated files with name, mime_type,
  content_base64 and size (bytes of base64-decoded content). Append file sizes computed from decoded
  bytes; catch all exceptions into result text without re-raising.

  _execute_skill_tool generates code to execute a skill by scanning Python modules: prefer the first
  with builder/creator/generator in its path, otherwise the first non-__init__.py module. When no
  modules are found, use fallback code that prints the literal "No executable skill module found".
  Ignore tool name and input; the code template imports the selected module and searches its classes
  for .create/.build/.generate methods. Call _execute_code to run the generated code and return its result.

  _attach_files_to_response returns response unchanged if generated_files is empty. For dict responses,
  set response["_litellm_generated_files"]. For object responses, attempt to set response._litellm_generated_files
  and silently swallow AttributeError without logging. If response.model_extra exists, also set
  model_extra["_litellm_generated_files"].

  Preserve the exact module selection logic, JSON parsing behavior for OpenAI format, file-size
  calculation from bytes, exception handling that does not re-raise, and the fallback literal code.
scope:
  paths:
    - crates/betterlite-core/src/api/skills.rs
    - crates/betterlite-core/src/api/skills/**
  lint_tables: false
