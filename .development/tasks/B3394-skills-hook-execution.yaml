oracle_cases: []
deviations:
  - what: Tool call extraction from OpenAI arguments uses json.loads without catching
      parse errors, allowing malformed JSON to propagate to the caller.
    why: Caller visibility of parse errors is important for correct behavior;
      downstream handlers decide whether to fail the request or continue with
      partial data. LiteLLM does the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/litellm_skills/main.py#L480
  - what: Skill module selection fallback code is a literal Python string that
      prints "No executable skill module found" rather than being a configurable
      message.
    why: This preserves the exact LiteLLM behavior and output for debugging and
      testing; the fallback is not expected to be common in production.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/litellm_skills/main.py#L707-L711
  - what: File attachment to object responses silently ignores AttributeError
      when setting the _litellm_generated_files attribute without logging or
      error reporting.
    why: Some response objects may not allow attribute assignment; continuing
      silently preserves the response shape. LiteLLM does the same without logging.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/litellm_skills/main.py#L901-L904
  - what: File attachment writes model_extra["_litellm_generated_files"] after
      setting the attribute, creating two possible write locations for the same
      data on object responses with model_extra present.
    why: This mirrors LiteLLM's serialization strategy, ensuring both attribute
      and model_extra paths are available for downstream serializers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/litellm_skills/main.py#L906-L910
out_of_scope:
  - "SkillPromptInjectionHandler construction and prompt extraction/injection: owned elsewhere."
  - "SkillsSandboxExecutor.execute call and sandbox runtime setup: owned elsewhere."
  - "The HTTP response loop in async_post_call_success_deployment_hook: owned by B3395."
  - "The pre-call hook async_pre_call_hook: owned by B095."
pitfalls:
  - Tool call extraction from Anthropic content blocks must handle both dict blocks
    (isinstance check, dict.get access) and object blocks (getattr with type name
    comparison and field access). Extracting only the dict path misses object
    responses from typed SDKs.
  - OpenAI tool argument JSON errors must propagate, not be caught and converted
    to error strings or empty dicts. Silencing them breaks downstream error
    handling that depends on seeing the parse failure.
  - Skill module selection looks for builder/creator/generator in the module name
    (case-insensitive string contains check). A module without these keywords gets
    passed over even if it is executable. The first non-__init__.py module is the
    fallback, not a preferred match.
  - When no skill modules are found at all, the fallback code must use the exact
    literal string "No executable skill module found" in a print statement. Code
    that generates a different message or uses logging instead will diverge from
    LiteLLM behavior.
  - File attachment to object responses catches AttributeError without logging,
    continuing silently. Code that logs the error or raises it will diverge from
    LiteLLM behavior.
  - File attachment checks response.model_extra existence before writing to it.
    Creating model_extra if it does not exist (e.g., setting response.model_extra = {})
    may trigger different serialization or validation downstream.
  - Base64-decoded file content size is the byte length of the decoded bytes,
    not the base64 string length.
review_level: standard
