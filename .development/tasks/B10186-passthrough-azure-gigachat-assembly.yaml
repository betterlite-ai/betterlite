  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/passthrough/transformation.py#L102-L131
    why: the collector protocol and the raw-bytes collector are sync, so B3572's contract matches.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/passthrough/transformation.py#L176-L231
    why: Azure's chat reply goes through OpenAIGPTConfig.transform_response and its chat stream through the OpenAI pass-through builder with the relayed messages.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/passthrough/transformation.py#L134-L195
    why: GigaChat translates each chunk and runs stream_chunk_builder over them without awaiting.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/openai_passthrough_logging_handler.py#L552-L613
    why: the OpenAI pass-through stream builder Azure reuses.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L658-L676
    why: LiteLLM's token_counter picks the encoding from the model name.
dod:
  - text: The bundled counter, the silent builder ports and one one-poll assemble_collected live in betterlite-streaming, and Gemini, Cohere, GigaChat and Bedrock's later assembler share them.
    proof: [streaming-tests, server-tests, no-copies]
  - text: A GigaChat stream logs the assembled chat response, and an Azure or Azure AI chat stream or full chat reply logs a ModelResponse.
    proof: [openai-tests, core-tests, azure-tests, foundry-tests]
  - text: The tokenizer's message walk counts in one poll over a sync engine and still counts the same through the async Texter.
    proof: [tokenizer-tests, core-tests]
  - text: B10177's row no longer names Azure, Azure AI or GigaChat, and docs/deviations/B10186.yaml has this task's rows.
    proof: [deviation-rows]
  - text: No call parses the vocabulary. The counter comes in with the AWS port in PassthroughPorts, built once by each caller, and the Vertex collector takes it as an argument.
    proof: [built-once, core-tests, python-tests]
checks:
  optional: [mutants]
  commands:
    - id: streaming-tests
      why: the moved counter or assemble_collected builds a different response or blocks
      run: grep -q 'fn assemble_collected_builds_a_chat_response_in_one_poll' crates/betterlite-streaming/src/collected_assembly/tests.rs && cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/^collected_assembly::/) | test(/^streamed_response_assembly::/)'
    - id: tokenizer-tests
      why: the message walk counts differently after it takes a text counter trait
      run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/^count::/)'
    - id: openai-tests
      why: GigaChat's stream answer is lost or assembled wrong
      run: grep -q 'fn collected_chunks_assemble_into_a_chat_response' crates/betterlite-openai/src/gigachat_passthrough/tests.rs && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^gigachat_passthrough::/)'
    - id: azure-tests
      why: the chat reply projection decodes wrong or answers a body that is not a chat completion
      run: grep -rq 'fn chat_reply_projection_decodes_a_chat_completion' crates/betterlite-azure/src/passthrough && cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/^passthrough::/)'
    - id: foundry-tests
      why: the Foundry plan lost its Azure ports or its other answers changed
      run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/^passthrough::/) - test(/replays_the_/)'
    - id: core-tests
      why: the relayed counter, the Azure stream assembly or the call's success log broke
      run: grep -q 'fn collected_chat_assembly_counts_prompt_tokens_from_the_messages' crates/betterlite-core/src/openai_streaming_assembly/tests/collected.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^openai_streaming_assembly::/) | test(/^api::passthrough_call::/)'
    - id: server-tests
      why: Gemini, Vertex, Cohere, Anthropic or OpenAI pass-through logging changed with the moved types
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::/)'
    - id: no-copies
      why: a block_on or a second copy of the silent ports or the counter is still in the server
      run: test -z "$(grep -rn 'fn block_on\|struct NoCosts\|struct SilentLogger\|struct SilentConsole\|struct CollectedCounter' crates/betterlite-server/src/pass_through_logging/gemini_passthrough_logging crates/betterlite-server/src/pass_through_logging/cohere_passthrough_logging)"
    - id: built-once
      why: a call or a collector still parses the bundled vocabulary itself
      run: test -z "$(grep -n 'CollectedCounter::bundled' crates/betterlite-core/src/api/passthrough_call/logged.rs crates/betterlite-openai/src/gigachat_passthrough.rs crates/betterlite-server/src/pass_through_logging/vertex_stream_collection.rs)"
    - id: python-tests
      why: the Python session lost its ports or calls the pass-through route with the old port argument
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^passthrough_calls::/)'
    - id: deviation-rows
      why: this task's deviations are missing, or B10177's row still names the ports this task builds
      run: test -s docs/deviations/B10186.yaml && test -z "$(grep -n 'GigaChat streams have no provider-built' docs/deviations/B10177.yaml)"
oracle_cases: []
deviations:
  - what: >-
      Token estimates for an Azure, Azure AI or GigaChat pass-through stream without a usage chunk use cl100k_base for every model. LiteLLM's token_counter picks the model's encoding, o200k_base for gpt-4o and later.
    why: >-
      The bundled counter holds one engine, the one the server's Gemini and Cohere pass-through logging already use, and a stream with usage reports its own counts.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L658-L676
  - what: >-
      An Azure pass-through chat reply is logged without a second post_call record of the raw reply text.
    why: >-
      Azure's ChatReplyProjection port gets the reply and the request but no logging state, and the call already logged the raw reply when it relayed it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/passthrough/transformation.py#L176-L207
out_of_scope:
  - "Bedrock and Bedrock Mantle: B10184 builds their ports over assemble_collected."
  - "Per-model encodings for the bundled counter (deviation above)."
pitfalls:
  - "GigachatPassthroughConfig derives Debug (gigachat_passthrough.rs L58); derive Debug on the moved CollectedCounter too, since Engine is Debug (crates/betterlite-tokenizer/src/engine.rs L14)."
  - "Convert serde values with serde_json::to_value and from_value, never through from_str: arbitrary_precision is on in these crates."
  - "assemble_collected never blocks: now_or_never answers Pending as an error, and no block_in_place or new runtime takes its place."
  - "betterlite-streaming cannot depend on betterlite-anthropic (anthropic depends on streaming), so the ReasoningTokenCounter impl lives in betterlite-anthropic."
  - "core's openai_streaming_assembly.rs has 270 lines; the Azure assembly and the counter impl go in collected.rs."
  - "Keep Gemini's model fix-ups (assembly.rs L163-L170, L185-L190) in Gemini; only the Request, the hooks and the poll move."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
