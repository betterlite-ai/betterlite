id: B3935
title: Datadog LLM Observability messages and tool records
description: >-
  Build the LLM Observability typed records and OpenAI/Anthropic message, tool-call, result-linking and tool-definition projection.
  Parse tool arguments up to 256 Ki characters; preserve raw non-object arguments as strings.
  Retain the response-string Python-literal-then-JSON behavior with a bounded decoder and its own fuzz corpus.

  Implement `_to_dd_message`, `_to_dd_messages`, `_to_dd_tool_calls`, `_to_dd_tool_results`, `_to_dd_tool_definitions`, `_mapping_field`, `_text_field`, `_content_blocks` and `_safe_identifier` helper functions that transform standard logging payload messages into Datadog's LLM Obs schema.

  The input decoder (safe_json_loads with size-bound parsing) is built here, not in metadata or delivery tasks, with fuzz corpus and replay test.
  Type records for messages, tool calls, tool results, tool definitions, spans, intake envelopes and metrics are built from the pinned Datadog API schema.

  Message role normalization drops unrecognized roles when redaction is on; tool arguments stay raw strings when they exceed 256 Ki or do not parse to objects.
  The response-message extraction handles both string literals and JSON fallback, since LiteLLM captures ast.literal_eval first, then json.loads.
