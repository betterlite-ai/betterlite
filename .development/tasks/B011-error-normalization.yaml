id: B011
title: Normalized errors and call-id integration
description: >-
  Complete the error layer with normalized logging codes and optional call-id attachment. Add pure normalization
  over B184's typed error facts using the pinned precedence, then integrate the server envelope with general_settings.include_call_id_in_error_body.
  The call id comes from trusted request context and must agree with the response header; it is never accepted from
  an arbitrary error body. Reuse B185 mapping and B187 redaction, keep normalized_error as logging metadata rather
  than adding a new client field, and preserve existing betterlite-owned messages. Add error_normalization and error_call_id
  helper cases plus real HTTP cases for the call-id setting, including provider headers forwarded as llm_provider-<name>
  plus the bare OpenAI rate-limit set, filtered by UNSAFE_PROXY_RESPONSE_HEADERS. Extend the config corpus for the
  new setting.  Seed B171's shared helper_case corpus with every added operation and replay it through the common
  typed parser. Echo a client-supplied x-litellm-call-id exactly into the error-body setting and response header;
  only generated IDs use presence comparison. Reuse B184 cookie/CORS security exclusions while keeping remaining
  provider and rate-limit headers. Write the behavior rstest functions error_normalization_tests_behavior in
  adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. The helper operations error_normalization, error_call_id are already registered; each operation has its own Rust and Python adapter file and corpus seed.
  Budget 250 normalization/integration, 100 adapters, 300 tests and 70 wiring (720 total).
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-error/Cargo.toml
  - crates/betterlite-error/src/normalize.rs
  - crates/betterlite-error/src/normalize/**
  - crates/betterlite-error/src/envelope.rs
  - crates/betterlite-error/src/envelope/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/error/normalization.rs
  - tools/oracle/src/helpers/error/normalization/**
  - tools/oracle/helpers/error_normalization.py
  - tools/oracle/helpers/error_normalization/**
  - tools/oracle/src/helpers/error/call_id.rs
  - tools/oracle/src/helpers/error/call_id/**
  - tools/oracle/helpers/error_call_id.py
  - tools/oracle/helpers/error_call_id/**
  - tools/oracle/cases/helpers/error-normalization/**
  - tools/oracle/cases/errors/**
  - "tools/oracle/fuzz/corpus/helper_case/error_normalization-*"
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/error_normalization.py#L32-L205
  why: Stable codes and exact precedence across proxy type, messages, classes and status.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/error_body_call_id.py#L6-L20
  why: Opt-in call id field placement.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L442-L531
  why: Explicit error headers versus raw vendor response headers.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L273-L276
  why: Preserve the client call ID.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L3625-L3700
  why: Provider-header projection and unsafe filtering.
dod:
- text: >-
    Every normalization precedence branch matches direct helper cases, including absent exceptions and budget versus
    vendor rate limits.
  proof:
  - oracle
  - helper-python
- text: >-
    Call-id opt-in/opt-out and error header behavior match HTTP cases; the enabled body id equals the actual response-header
    id.
  proof:
  - oracle
  - error-normalization-tests
  - helper-python
- text: No raw provider body, credential or private infrastructure detail reaches errors or diagnostic formatting.
  proof:
  - error-normalization-tests
- text: The config corpus replays the added call-id setting.
  proof:
  - config-yaml-corpus
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: error-normalization-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-error -p betterlite-server --no-tests=fail -E 'test(/::error_normalization_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'include_call_id_in_error_body' crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/error_normalization-*")" &&
      grep -lq 'error_normalization' tools/oracle/fuzz/corpus/helper_case/error_normalization-* && grep -lq 'error_call_id' tools/oracle/fuzz/corpus/helper_case/error_normalization-*
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/error-normalization/proxy-type-first.yaml
- tools/oracle/cases/helpers/error-normalization/message-before-class.yaml
- tools/oracle/cases/helpers/error-normalization/budget-rate-limit.yaml
- tools/oracle/cases/helpers/error-normalization/class-before-router-wrapper.yaml
- tools/oracle/cases/helpers/error-normalization/status-fallback.yaml
- tools/oracle/cases/helpers/error-normalization/unclassified.yaml
- tools/oracle/cases/helpers/error-normalization/no-exception.yaml
- tools/oracle/cases/errors/call-id-enabled.yaml
- tools/oracle/cases/errors/call-id-disabled.yaml
- tools/oracle/cases/errors/safe-retry-headers.yaml
- tools/oracle/cases/errors/client-call-id.yaml
deviations: []
out_of_scope:
- The normalized logging code is not a replacement for the LiteLLM-compatible HTTP error type/code.
- Budget, rate-limit and auth enforcement remain in their own tasks.
pitfalls:
- 'Name every corpus seed tools/oracle/fuzz/corpus/helper_case/error_normalization-<case>.yaml. The rest of that folder belongs to other tasks.'
- 'The oracle helper for this task is pre-registered as error_normalization and error_call_id in the error group. Replace the stub Op in tools/oracle/src/helpers/error/normalization.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/error_normalization.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Compare a random call id for presence in the oracle and assert header/body equality inside the real-server test.
- >-
  The call id belongs beside the error's fields at the helper-defined location, not an invented top-level envelope
  field.
- A 429 message mentioning a budget can normalize differently from a generic 429.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
