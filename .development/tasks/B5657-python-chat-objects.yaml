dod:
- text: A response object answers attribute access, item access, `get`, `in`, `dict` and `json` as LiteLLM's does, and keeps extra provider fields.
  proof: [object-access]
- text: "`model_dump` gives LiteLLM's output, with `exclude_unset` on by default for responses."
  proof: [object-dump]
- text: Tool call classes and helpers give LiteLLM's ids, types, argument text and custom tool handling.
  proof: [tool-calls]
- text: Message and Delta fill, map and delete the same fields as LiteLLM.
  proof: [message-delta]
- text: Choices and StreamingChoices store the native finish reason and defaults as LiteLLM does, and unknown reasons map with the warning.
  proof: [choices]
- text: Usage fills token details and the cache fields as LiteLLM does.
  proof: [usage]
- text: ModelResponse and ModelResponseStream force their object name, default their choices and carry hidden params and headers.
  proof: [model-response]
- text: "`betterlite.types.completion` exposes the same TypedDict keys as LiteLLM."
  proof: [completion-types]
- text: "`RootModel`, generic subclasses, required fields, validators, `Base64Str` and `AwareDatetime` behave as described, so the B167 parts can use them."
  proof: [base-features]
- text: The chat classes pass ruff and strict basedpyright with no Any.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: object-access
    why: A caller's `response["usage"]` stops working.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k access
  - id: object-dump
    why: Serialized output gains or loses fields.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k dump
  - id: tool-calls
    why: Tool arguments reach the caller in the wrong form.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k tool_call
  - id: message-delta
    why: A None field shows up that LiteLLM deletes.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k "message or delta"
  - id: choices
    why: The finish reason differs.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k choices
  - id: usage
    why: Token details differ, and cost reads them.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k usage
  - id: model-response
    why: The top-level response differs.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k model_response
  - id: completion-types
    why: A typed caller's import fails.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k typed_dict
  - id: base-features
    why: A B167 part needs a base feature that is missing or wrong.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py -k base_
  - id: python-lint
    why: A loose type in the base class spreads to every response.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Response classes are plain Python classes, so `isinstance(x, pydantic.BaseModel)`, `model_validate`, `model_json_schema` and `model_fields` are not there.
  why: The wheel depends only on python-dotenv, and pydantic would be a heavy runtime dependency for field holders. Attribute, item and dump access stay the same.
out_of_scope:
- Embedding, text, image, transcription and the smaller classes in types/utils.py are B5658.
- All other classes in litellm/types/** are B167.
- '`_CompletionDispatchContext` at types/completion.py L207 is B198.'
- The pricing helpers in types/utils.py are B5650, and `is_litellm_owned_kwarg` is B2228.
pitfalls:
- '`Delta` keeps `content`, `role`, `function_call`, `tool_calls` and `audio` as attributes even when None, while `Message` deletes several, so the two need separate lists.'
- '`Choices` stores `native_finish_reason` only when the mapped value differs from the input.'
- '`Usage` writes private `_cache_creation_input_tokens` and `_cache_read_input_tokens`, and `model_dump` leaves them out.'
- '`ModelResponse.__init__` sets `object` to `chat.completion` whatever the caller passed.'
- Tool call dicts in `Delta` share one counter for the missing index, so a dict with its own index keeps it and doesn't move the counter.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
