id: B5657
title: Python response objects for chat
description: >-
  A caller of `betterlite.completion` reads `response.choices[0].message.content`, `response["usage"]` and
  `response.model_dump()`, and passes the object around as LiteLLM's. Build those chat classes in Python, in the betterlite
  wheel, under the same module path as LiteLLM: `betterlite.types.utils`.


  The wheel has no pydantic dependency, so these classes do not use pydantic. `ResponseObject` is one small base with typed
  plain attributes. It gives attribute and item access, `get`, `__contains__`, `model_dump`, `dict`, `json`,
  `model_dump_json` and `__eq__`, and it keeps extra fields a provider sends as attributes, the way `extra="allow"` does.
  Values are typed with a recursive `JsonValue` alias, since Any is banned. Deleting a missing attribute does nothing, as in
  `SafeAttributeModel.__delattr__` (types/utils.py L131-L146). `model_dump` on a response defaults to `exclude_unset=True`
  unless the caller passes `exclude_unset` or `exclude_none` (L2096-L2100), so the base records which fields were set.

  The typed parts of B167 (B7920 to B7954) build their pydantic models on this base, so it also carries what those models use.
  B7941 needs `RootModel`, B7932 and B7946 need `Generic` models, B7921 needs validators, and B7941 needs `Base64Str` and
  `AwareDatetime`. Add: `RootModel[T]`, a subclass that wraps one value in `root`, takes it positionally and dumps to the bare
  value. `ResponseObject` subclasses may also list `Generic[T]` and `ABC` as bases, and `Box[int]` keeps all base behavior. A
  field with an annotation and no default is required, and a missing one raises `ValidationError`, a `ValueError` subclass
  that names the fields. `field_validator(*names, mode)` and `model_validator(mode)` decorators run in `__init__`, and a
  `ValueError` from one becomes a `ValidationError`. `Base64Str` is a `str` that decodes base64 input and dumps back to base64.
  `AwareDatetime` accepts a `datetime` or an ISO string and raises `ValidationError` for a value with no timezone.


  Port the `__init__` logic of each class line by line, because the rules live there. `Function` (L1183) turns dict arguments
  into JSON text and falls back to `parameters`, then "". `ChatCompletionMessageToolCall` (L1288) defaults `id` to a uuid4
  and `type` to `function`. `Message` (L1390) defaults `role` to `assistant`, turns empty `tool_calls` to None, and deletes
  `audio`, `images`, `annotations`, `reasoning_content`, `thinking_blocks` and `reasoning_items` when they are None. `Delta`
  (L1507) maps `reasoning` to `reasoning_content` and gives tool call dicts an index only when they have none. `Choices`
  (L1644) turns a None `finish_reason` to `stop`, stores a changed value as `native_finish_reason` in
  `provider_specific_fields`, and deletes `logprobs` and `provider_specific_fields` when None. `StreamingChoices` (L2006) pops
  `message` and makes a falsy finish reason None. `Usage` (L1857) fills the token detail wrappers and works out
  `text_tokens` as `max(0, completion - reasoning - image - audio)`. It sets `cached_tokens` from `prompt_cache_hit_tokens`
  or `cache_read_input_tokens`, and `cache_write_tokens` from `cache_creation_input_tokens`.


  `ModelResponse` (L2181) forces `object` to `chat.completion`, gives `[Choices()]` for non-list choices and sets `usage` only
  when it isn't None. `ModelResponseStream` (L2103) forces `chat.completion.chunk`, gives `[StreamingChoices()]` and always
  sets `provider_specific_fields`. `ModelResponseBase` carries `_hidden_params` and `_response_headers` with
  `set_provider_response_headers`.


  The rest of the list: `TopLogprob`, `ChatCompletionTokenLogprob`, `ChoiceLogprobs`, `FunctionCall`,
  `ChatCompletionDeltaToolCall`, `_CustomToolCallAccess` with the custom tool classes (L1251-L1281),
  `is_custom_tool_call_dict`, `chat_completion_tool_call_from_dict`, `ChatCompletionAudioResponse`,
  `add_provider_specific_fields`, `text_tokens_without_nested_reasoning`, `CompletionTokensDetailsWrapper`,
  `CacheCreationTokenDetails`, `PromptTokensDetailsWrapper`, `ServerToolUse`, `StreamingChatCompletionChunk` and
  `_generate_id`. `map_finish_reason` gets its Python port here, with the same table as litellm_core_utils/core_helpers.py
  and the same "Unmapped finish_reason '%s', defaulting to 'stop'" warning. `betterlite.types.completion` holds the TypedDicts
  from types/completion.py L19-L138 and `CompletionRequest` (L175).


  Files under `python/betterlite/types/utils/` stay under the 300-line limit, and `__init__.py` there re-exports the names
  with an explicit `__all__`. The tests build the same object from `litellm.types.utils` and `betterlite.types.utils` with
  the same arguments and compare `model_dump()`. Tests for the base features are named `base_root_model_dump`, `base_generic_subclass`, `base_required_field_missing`,
  `base_field_validator_runs`, `base_model_validator_error`, `base_base64str_roundtrip` and `base_aware_datetime_rejects_naive`.
