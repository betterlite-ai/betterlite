id: B8332
title: Hugging Face, Replicate and Predibase dispatch in main.py
description: >-
  The wiring part for the three model hub providers of B042. The provider modules are planned elsewhere: B5990 (Hugging Face chat and the provider mapping), B5991 (Hugging Face embedding), B5848 (Hugging Face rerank), B5847 (Replicate predictions and polling) and B5846 (Predibase). Each of them reads no environment, makes no HTTP call of its own, or takes a trait the caller backs, and each left the main.py side to the umbrella. This task builds that side in the module model_hub_dispatch of betterlite-provider: the dispatch functions and their arms through B2230's selection (as B050 and B8157 do), the credential chains, the trait implementations on B173's pooled client, the Hugging Face embedding request, and the HTTP oracle cases. Add betterlite-tokenizer to betterlite-provider's dependencies if it is missing; it does not depend on betterlite-provider.


  _complete_huggingface (main.py L3181-L3221, arm L5979-L5980). The key is the context value, else litellm.huggingface_key, else HF_TOKEN, else HUGGINGFACE_API_KEY, else litellm.api_key; headers is the context value, else the global headers. Call the shared HTTP completion handler with the context provider and base. Back B5990's HubGet with a GET on the pooled client that returns status, headers and body, and pass HUGGINGFACE_API_KEY alone as its Hub token. Embedding arm (L6759-L6774): the key is the context value, else litellm.huggingface_key, else HUGGINGFACE_API_KEY, else litellm.api_key, with no HF_TOKEN step. Build the request with B5991's prepare, passing an HuggingfaceEnv whose HF_API_BASE and HUGGINGFACE_API_BASE fields are set whenever the variable exists, even empty, because handler.py tests membership in os.environ. Back B5991's PipelineTagSource with GET https://huggingface.co/api/models/{model} (no auth header, no status check, pipeline_tag from the JSON) and its OrdinaryEncoder with B195's cl100k_base. Then send the body as LiteLLM's embedding() and aembedding() do (embedding/handler.py L231-L392): log pre_call with the input, the key and {complete_input_dict, headers, api_base}, POST the JSON text on the dispatch client or the pooled client, log post_call with the input, the key, {complete_input_dict} and the reply, decode the reply as JSON, fail with HuggingfaceError 500 and the error value when the object has an error key, and otherwise hand it to B5991's process_embedding_response. There is no status check, so a 4xx JSON body without error is processed like a 200. Rerank: take the Hugging Face branch of the rerank config selection (utils.py L8880-L8881) and give B5848's config the key from api_key, litellm.huggingface_key, HUGGINGFACE_API_KEY and the base from api_base, litellm.api_base, HF_API_BASE, HUGGINGFACE_API_BASE (rerank/transformation.py L262-L282), plus B196's text counter for its TextTokenCounter.


  _complete_replicate (L2773-L2824, arm L5960-L5962: the model contains "replicate", or the provider is replicate, or the model is a catalog model whose litellm_provider is replicate). The key is the context value, else litellm.replicate_key, else litellm.api_key, else REPLICATE_API_KEY, else REPLICATE_API_TOKEN. The base is the context value, else litellm.api_base, else REPLICATE_API_BASE, else "https://api.replicate.com/v1". custom_prompt_dict is the context table, else the global one. Build B5847's ReplicatePolling with from_env_values over DEFAULT_REPLICATE_POLLING_RETRIES (5), DEFAULT_REPLICATE_POLLING_DELAY_SECONDS (1), REPLICATE_POLLING_DELAY_SECONDS (0.5) and REPLICATE_MODEL_NAME_WITH_ID_LENGTH (64), give it the pooled transport and a sleeper over tokio::time::sleep, and choose OutputPolicy Lenient when acompletion is true and Strict otherwise. When optional_params stream is exactly true, log post_call with the messages, the resolved key and the returned stream as original_response.


  _complete_predibase (L3936-L3992, arm L6007-L6008). tenant_id is popped tenant_id, else popped predibase_tenant_id, else litellm.predibase_tenant_id, else PREDIBASE_TENANT_ID; with none, fail with ValueError text "Missing Predibase Tenant ID - Required for making the request. Set dynamically (e.g. `completion(..tenant_id=<MY-ID>)`) or in env - `PREDIBASE_TENANT_ID`." The base is the context value, else popped api_base, else popped base_url, else litellm.api_base, else PREDIBASE_API_BASE. The key is the context value, else litellm.api_key, else litellm.predibase_key, else PREDIBASE_API_KEY. Pass B2202's DEFAULT_MAX_TOKENS value (default 4096) and B196's counter as B5846's TokenCounter, then return its result for both the stream and non-stream paths.


  Config. Add the section model_hub_credentials with litellm_settings.huggingface_key, replicate_key, predibase_key and predibase_tenant_id, all default None. Environment values are read when the call runs, through betterlite-env; an empty value is unset except for the two embedding base variables above. The four Replicate polling variables are read once at startup, as LiteLLM reads them at import.


  Plan about 400 lines of module code, 260 of tests and 60 for the section and the cases. Where the source and this text differ, the source at the pinned commit wins.
