dod:
  - text: _complete_huggingface, _complete_replicate and _complete_predibase resolve key, base, headers and tenant id in LiteLLM's order and call their modules.
    proof: [model-hub-dispatch-tests, oracle]
  - text: The Hugging Face embedding arm sends the same URL, headers and body, logs pre_call and post_call, and fails on an error key as LiteLLM does.
    proof: [model-hub-dispatch-tests, oracle]
  - text: The Hugging Face rerank selection gets its key and base from LiteLLM's chain.
    proof: [model-hub-dispatch-tests, oracle]
  - text: Replicate picks the output policy by path and logs post_call for a stream; Predibase fails with the tenant id text when none is set.
    proof: [model-hub-dispatch-tests, oracle]
  - text: The arms reach these functions through the dispatch table, and an unknown provider still fails as before.
    proof: [model-hub-dispatch-tests]
  - text: The four litellm_settings keys load into the model_hub_credentials section.
    proof: [model-hub-config-tests]
  - text: New HTTP cases for these providers exist.
    proof: [model-hub-cases, oracle]
checks:
  optional: []
  commands:
    - id: model-hub-dispatch-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^model_hub_dispatch::/)'
      why: No model_hub_dispatch test exists on the base branch.
    - id: model-hub-config-tests
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::model_hub_credentials::/)'
      why: The section is only a stub before this task.
    - id: model-hub-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/model-hub)"
      why: Without added case files the oracle proof has nothing of this task to compare.
