deviations:
  - what: Reply ids LiteLLM generates and token usage it estimates are compared as present, not equal.
    why: The ids are random and usage depends on each side's tokenizer.
out_of_scope:
  - "B5990, B5991, B5848, B5847 and B5846 own the provider transforms; only calls to them and the traits they take are here."
  - "B5653 reads the Replicate and Predibase stream chunks and B5654 drives the stream; this task returns what the modules return."
  - "B2454 runs the rerank HTTP call and B1079 the rerank dispatch around it; this task only hands them the Hugging Face config."
  - "The huggingface branch of text_completion (main.py L7574-L7600) belongs to the text completion owner, not to this task."
  - "Databricks, Snowflake and OCI are B8330; SAP, watsonx and SageMaker are B8331."
pitfalls:
  - "The chat key chain has HF_TOKEN between litellm.huggingface_key and HUGGINGFACE_API_KEY, while the embedding and rerank chains skip HF_TOKEN."
  - "The Predibase pops sit inside an or chain, so once tenant_id is found predibase_tenant_id stays in optional_params, and a context base leaves api_base and base_url there too."
  - "Replicate puts litellm.api_key before both REPLICATE_* variables, and Predibase puts it before litellm.predibase_key."
  - "The replicate arm matches any model name that contains replicate, but only after every arm before L5960 has had its turn."
  - "Hugging Face cases set api_base to the mock and pass input_type feature-extraction for embeddings, so no request leaves for huggingface.co."
  - "Replicate create plus poll cannot be an HTTP case. The mock answers the case field upstream in arrival order, but it listens on a random port and only case env values get its address through {{upstream}}; reply bodies are sent as written. LiteLLM polls the urls.get address from the create reply, so the poll cannot reach the mock. Test create, the processing retries, the poll delay and the failed status with a recording transport in the model_hub_dispatch tests. The one Replicate HTTP case, replicate-no-poll-url.yaml, answers create with a body that has no urls.get and compares LiteLLM's 400 error that starts with LiteLLM Error - prediction url is None."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
