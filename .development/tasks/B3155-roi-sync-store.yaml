id: B3155
title: ROI spend queries and database sync leases
description: >-
  Build ROI SQL operations in betterlite-db and the typed spend-reader adapter in betterlite-server.
  Add sync_store.rs to manage distributed leases: 60-second write-side lock/heartbeat/release with owner
  checks, atomic report publication, obsolete cached-pull cleanup via SQL, expired-worker detection and
  cancellation. Preserve the exact column names and Prisma operations that betterlite-db::postgres_store
  will build on. Add spend.rs to query daily spend per user per date, aggregate cost and request counts,
  and fall back to user_id when user_email is absent. Expose a typed SpendReader that other tasks inject.
  The spend function defines database table and aggregate contracts that B700 implements; use find_many_in
  to batch user lookups in one query. The sync store uses query_raw and execute_raw for the lease logic
  and report publication inside a single transaction; cancellation and report deletion are separate calls.
  Preserve the daily-spend sort order (ascending date), the email fallback precedence (email > user_id),
  the 60-second lease and heartbeat window, the owner constraint on finish, the cancel-flag check on
  heartbeat, the separate cancel/clear_report methods, and the read-before-update pattern that checks
  both lease expiry and running status. Every default, literal, env var, config key, error status, type,
  message, param and code that a user or other task can observe gets a named case. Define no new spend
  or lease error enum; only return what the database returns or adapt contracts. Owner is always required
  on finish; the cancel-flag check is skipped only when report is null (the cache-cleanup path).
scope:
  paths:
    - crates/betterlite-db/src/sync_store.rs
    - crates/betterlite-db/src/spend.rs
    - crates/betterlite-server/src/roi_spend.rs
  lint_tables: false
