id: B2457
title: Generic realtime backend connection
description: >-
  Own _open_realtime_backend_ws and async_realtime in llm_http_handler.py:6128-6295, plus their
  _RealtimeClientWebSocket,_WebsocketsExceptions,_WebsocketsModule protocols, in
  betterlite-core::api::realtime_backend_transport. B1004 provides config/error contracts, B173 shared
  TLS configuration, B1006 session state, B2455 setup guardrail policy and B1009 bidirectional relay.
  Get URL then validated headers before entering the connection try block. Ask provider_config.open_backend
  first; a non-None provider backend bypasses the WebSocket dialer. Otherwise dial with open_timeout=8.0,
  max_attempts=3 and no extra backoff. Retry timeout,OSError,WebSocketException; never retry either
  InvalidStatus or older InvalidStatusCode handshake rejections. Raise the last failed attempt.

  B002 loads REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES as the shared integer cap. Preserve the existing
  B528/B545 native default 16777216 and 1009 overflow deviation; the pin's unset value is None/unlimited.
  Explicit0/-1 admit no nonempty frame, numeric overrides work and malformed text is a startup error.
  loads_realtime_backend_settings exercises the real loader with new config_yaml seeds. SSL settings
  themselves belong to B173. For wss with SSL_VERIFY=false construct a TLS client context with hostname
  checking off and CERT_NONE; do not disable the TLS protocol. The generic source does not strip a
  non-None SSL argument for ws URLs, so its argument rejection is part of the connection error case.

  query_params is used only to force the authorized model for intent=transcription; it is not appended
  to the config URL. client and timeout arguments are accepted but unused by this generic connection.
  Add B901 service realtime_backend_transport with actual upstream handshake/frame capture and native
  injected dialer barriers for hung/retry/failure cases. Use B1004's frame decoder. Source methods have
  142 nonblank/non-comment lines plus 18 protocol lines; budget 155 implementation,145 tests,110 transcripts,
  90 adapters,65 config tests/seeds and 35 wiring =600 lines.
