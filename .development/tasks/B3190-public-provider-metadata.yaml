dod:
  - text: GET /public/providers returns a sorted array of string provider names from LlmProviders enum metadata.
    proof: [behavior-tests, provider-metadata-oracle]
  - text: GET /public/providers/fields returns the assembled ProviderCreateInfo array in source order with all B3180–B3189 fragments, ending with WATSONX_TEXT, xAI, XINFERENCE, CURSOR.
    proof: [behavior-tests, provider-metadata-oracle]
  - text: GET /public/endpoints returns SupportedEndpointsResponse with endpoints in insertion order (union across all providers), each with key, label, endpoint path and providers array.
    proof: [behavior-tests, provider-metadata-oracle]
  - text: _clean_display_name removes trailing " (`provider_slug`) " suffix from display names using the _SLUG_SUFFIX_RE regex pattern.
    proof: [behavior-tests]
  - text: _build_endpoints transforms raw provider_endpoints_support_backup.json to collect endpoint keys in insertion order, deriving labels and paths from _ENDPOINT_METADATA or auto-generating from the key.
    proof: [behavior-tests]
  - text: _load_endpoints validates the raw JSON file with TypeAdapter and calls _build_endpoints to transform to response shape.
    proof: [behavior-tests]
  - text: get_supported_endpoints caches the result in-process for the server lifetime; a subsequent call returns the same cached object.
    proof: [behavior-tests]
  - text: get_provider_fields reads and validates provider_create_fields.json from disk on every call, returning the full ProviderCreateInfo array.
    proof: [behavior-tests]
  - text: ProviderCreateInfo and ProviderCredentialField records match LiteLLM's shape with required and optional fields, field_type enum and defaults.
    proof: [behavior-tests]
  - text: SupportedEndpoint records include providers array with slug and cleaned display_name for each provider supporting that endpoint.
    proof: [behavior-tests]
  - text: Unknown endpoints (not in _ENDPOINT_METADATA) auto-generate labels by replacing underscores with spaces and title-casing, and paths by replacing underscores with slashes and prefixing with /.
    proof: [behavior-tests]
  - text: A raw catalog read function exposes the validated provider_create_fields array for B3191 without caching or HTTP round-trip.
    proof: [provider-metadata-oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Provider iteration, endpoint discovery, name cleaning, metadata derivation and caching must preserve LiteLLM behavior exactly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^public_endpoints::providers::/)'
    - id: provider-metadata-oracle
      why: Every provider name, credential field, endpoint and display transformation must match LiteLLM on the same requests.
      run: test -f tools/oracle/helpers/b3190.py && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::server::b3190::/)'
