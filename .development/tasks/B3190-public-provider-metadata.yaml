id: B3190
title: Public provider forms and endpoint support metadata
description: >-
  Build betterlite-server::public_endpoints::providers for GET `/public/providers`,
  `/public/providers/fields` and `/public/endpoints`, exposing provider forms and
  endpoint discovery. The `/public/providers` endpoint returns a sorted list of all
  provider names from the LlmProviders enum. The `/public/providers/fields` endpoint
  returns the assembled provider catalog with credential field specifications, sourced
  from a bundled JSON file assembled from B3180–B3189 fragments in source order.
  The `/public/endpoints` endpoint returns the full endpoint support metadata:
  endpoint keys with human-readable labels, canonical paths, and which providers
  support each endpoint.

  Implement _clean_display_name to strip display-name suffixes like "(provider_slug)"
  from provider names. Build _build_endpoints to transform the raw provider_endpoints_support_backup.json
  into response records with endpoint keys in insertion order, deriving labels and paths
  from the _ENDPOINT_METADATA table for known endpoints or auto-generating from the key.
  Preserve provider names as they appear in the source, including duplicates. Load
  the endpoints file once and cache the result for the server's lifetime; endpoint
  support does not change during execution.

  The provider_create_fields.json file contains records assembled from B3180–B3189,
  with B3190 providing the outer array delimiters and the final four provider
  definitions (WATSONX_TEXT, xAI, XINFERENCE, CURSOR). Expose a raw catalog read
  function for B3191 to inherit provider credential fields without making a local
  HTTP request to the handler; use bounded decoding for the catalog file. Register
  the three GET handlers through B003. Preserve every LiteLLM behavior: enum-based
  sorted provider iteration, endpoint discovery insertion order, display-name suffix
  cleanup, unknown endpoint label/path derivation, and process-lifetime caching
  for endpoint support only.
scope:
  paths:
    - crates/betterlite-server/src/public_endpoints.rs
    - crates/betterlite-server/src/public_endpoints/**
    - crates/betterlite-server/src/public_endpoints/providers.rs
    - crates/betterlite-server/src/public_endpoints/providers/**
    - crates/betterlite-server/data/**
    - tools/oracle/cases/helpers/public-endpoints/**
