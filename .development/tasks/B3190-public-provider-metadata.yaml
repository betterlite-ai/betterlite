  - tools/oracle/cases/public-endpoints/providers-list.yaml
  - tools/oracle/cases/public-endpoints/providers-fields-assembled.yaml
  - tools/oracle/cases/public-endpoints/endpoints-discovery.yaml
  - tools/oracle/cases/helpers/public-endpoints/clean-display-name.yaml
  - tools/oracle/cases/helpers/public-endpoints/unknown-endpoint-label-path.yaml
  - tools/oracle/cases/helpers/public-endpoints/endpoint-insertion-order.yaml
  - tools/oracle/cases/helpers/public-endpoints/fragment-source-order.yaml
  - tools/oracle/cases/helpers/public-endpoints/cache-reuse.yaml
deviations:
  - what: Provider catalog is loaded from a bundled file path constructed relative to the module, not through importlib.resources.files.
    why: Rust crates include data files in the build output directory; runtime path resolution matches the runtime layout.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_endpoints.py#L409-L414
out_of_scope:
  - "Integration with routing, retries, fallbacks, provider execution or logging: these tasks call this task but are not called by it."
  - "B3180–B3189 provider catalog fragments and their parsing: each part owns its data and B3190 assembles the array in source order."
  - "B209's LlmProviders enum and its generation: this task uses the enum's value set and iteration order at the types boundary."
  - "B003 Axum router setup and error response translation: this task hands off HTTPException translation to the existing server integration."
  - "B001 HTTP oracle comparison and request/response capture: the oracle runner handles LiteLLM bridge and case execution."
pitfalls:
  - 'The oracle helper for this task is pre-registered as b3190 in the server group. Replace the stub Op in tools/oracle/src/helpers/server/b3190.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/b3190.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - "The _ENDPOINT_METADATA table keys must be matched exactly; an unknown endpoint key falls back to auto-generated label and path, not a missing entry."
  - "_clean_display_name uses a regex substitution with trailing spaces and a strip; the result is empty string if the input is only the suffix."
  - "Endpoint keys are collected in insertion order across the entire provider set; the order depends on which provider's data appears first for each endpoint, not alphabetical or any other sort."
  - "The display_name field in provider support data is cleaned for each endpoint independently; the same provider name may appear with or without a suffix in different endpoints if the source data contains both."
  - "_load_endpoints opens and reads files relative to the module's runtime location; the path construction must match the actual package layout."
  - "Provider credential fields are sourced from the JSON catalog without modification; every field present in the JSON data survives in the response, including defaults and field_type enums."
  - "The cached_endpoints global is initialized once and never invalidated; a server restart is required to pick up a new endpoints file."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
