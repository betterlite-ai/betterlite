id: B555
title: Foundry Flux and MAI image edits
description: >-
  Add Foundry edit model selection and typed JSON-versus-multipart bodies. Reuse upload descriptors, bounded base64
  and image reply records; preserve Flux2 image field numbering and MAI input/output usage projection. Only supplied
  bytes or operator-resolved local file handles may become inline media. Resolve api_version before the explicit
  SDK-equivalent version field then AZURE_AI_API_VERSION; absence is an error for the generic Flux edit path, with
  no invented default.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/image_edit/__init__.py:
  get_azure_ai_image_edit_config L22-L42. litellm/llms/azure_ai/image_edit/transformation.py: AzureFoundryFluxImageEditConfig.validate_environment
  L26-L45; AzureFoundryFluxImageEditConfig.get_complete_url L47-L97. litellm/llms/azure_ai/image_edit/flux2_transformation.py:
  AzureFoundryFlux2ImageEditConfig.get_supported_openai_params L33-L34; AzureFoundryFlux2ImageEditConfig.map_openai_params
  L36-L53; AzureFoundryFlux2ImageEditConfig.use_multipart_form_data L55-L57; AzureFoundryFlux2ImageEditConfig.validate_environment
  L59-L80; AzureFoundryFlux2ImageEditConfig.transform_image_edit_request L82-L122; AzureFoundryFlux2ImageEditConfig._convert_image_to_base64
  L124-L136; AzureFoundryFlux2ImageEditConfig.get_complete_url L138-L167. litellm/llms/azure_ai/image_edit/mai_transformation.py:
  AzureFoundryMAIImageEditConfig.get_supported_openai_params L28-L29; AzureFoundryMAIImageEditConfig.validate_environment
  L31-L46; AzureFoundryMAIImageEditConfig.get_complete_url L48-L66; AzureFoundryMAIImageEditConfig.transform_image_edit_request
  L68-L98; AzureFoundryMAIImageEditConfig.transform_image_edit_response L100-L125.


  Flux1 requires an API version and errors when absent. Flux2 defaults missing version to preview after explicit/global/environment
  lookup; MAI defaults to preview but does not consult litellm.api_version. Image inputs are supplied bytes or file
  objects; these paths never fetch URLs.


  Reuse OpenAIError.__init__ from B668 (litellm/llms/openai/common_utils.py); its implementation remains with that
  prerequisite.


  Reuse AzureFoundryModelInfo.get_api_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AzureFoundryModelInfo.get_api_key from B549 (litellm/llms/azure_ai/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse get_azure_ai_auth_headers from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse AzureFoundryFluxImageGenerationConfig.get_flux2_image_generation_url from B553 (litellm/llms/azure_ai/image_generation/flux_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AzureFoundryFluxImageGenerationConfig.is_flux2_model from B553 (litellm/llms/azure_ai/image_generation/flux_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AzureFoundryMAIImageGenerationConfig.get_mai_image_edit_url from B554 (litellm/llms/azure_ai/image_generation/mai_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AzureFoundryMAIImageGenerationConfig.is_mai_model from B554 (litellm/llms/azure_ai/image_generation/mai_transformation.py);
  its implementation remains with that prerequisite.


  Reuse AzureFoundryMAIImageGenerationConfig.normalize_mai_image_usage from B554 (litellm/llms/azure_ai/image_generation/mai_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: flux_json_images: Flux2 filters None options then delegates B553 mapping. Require non-None
  prompt/image with FLUX 2 image edit requires a prompt./an image.; only Python list expands into multiple images,
  empty list raises requires at least one image. Cap10 for model containing flex case-insensitively, otherwise8;
  excess raises <model> supports at most <cap> reference images. Emit input_image,input_image_2,... and overlay
  optional params last over prompt/model/image fields, returning no multipart files. flux_inline_base64: Base64-encode
  bytes; BufferedReader reads from its current position then seeks to0, while other read-capable objects are read
  without rewind. Other inputs, including URL strings, raise ValueError Unsupported image type: <type>; no fetching
  or URL interpretation occurs. mai_edit_prompt_images: MAI advertises prompt,image,model,n. Options overlay model,
  non-None positional prompt then overrides options; remove image/mask from form data. Add only the first non-None
  supplied list image under field image via B512, ignoring remaining entries and all masks; missing image/prompt
  is not rejected here. mai_edit_usage: Normalize present usage through B554, log empty input/key/request and B004-project
  into a new ImageResponse. JSON failure becomes B668 OpenAIError with raw text/status; do not synthesize response.size
  as generation does. image_edit_api_version: Flux1 version is params.api_version or litellm.api_version or AZURE_AI_API_VERSION;
  missing None raises the Azure API version is required diagnostic. B668 appends /images/edits if base already contains
  /openai/deployments/, otherwise deployment/model/images/edits; replace all existing query with only api-version.
  Missing base in every variant raises Azure AI API base is required. Set AZURE_AI_API_BASE environment variable
  or pass api_base parameter. image_edit_model_selection: Check B554 MAI first, B553 Flux2 next, then lower/hyphen/underscore-normalized
  empty or flux chooses Flux1. Other models raise ValueError Model <model> is not supported for Azure AI image editing.
  foundry_edit_auth: All variants resolve B549 base/key. Flux1/Flux2 keys use Api-Key, MAI uses api-key; absent
  key delegates Entra auth. Flux2 additionally overwrites Content-Type=application/json and uses JSON, while Flux1/MAI
  preserve multipart transport headers.


  Write standalone Rust test foundry_image_edit_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test foundry_image_edit_secret_safe_failure in betterlite-foundry: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-foundry/src/image_edits.rs with adjacent tests under image_edits/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation foundry_image_edits in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_edits_cases in betterlite-foundry with these exact named cases (one per oracle file):
  flux_json_images, flux_inline_base64, mai_edit_prompt_images, mai_edit_usage, image_edit_api_version, image_edit_model_selection,
  flux1_missing_version, flux2_preview_default, mai_preview_ignores_global, foundry_edit_auth. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_image_edits* using HelperCase: kind:
  helper and the externally tagged foundry_image_edits variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_image_edits that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_mai_edit_reply consumes MAI edit JSON response bytes in crates/betterlite-foundry/src/image_edits.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_image_edits.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_image_edits.
  The adjacent test replays_the_foundry_image_edits_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/foundry/image_edits.rs
  and its loader wiring: AZURE_AI_API_VERSION. Module-level settings enter litellm_settings; deployment settings
  enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above and in
  the linked branches; existing key owners remain unchanged. Write config rstest foundry_image_edits_config_cases
  with named cases loads_azure_ai_api_version, plus rejects_unrelated_key. Each loads case calls the real config
  loader with that key and asserts the resolved value, default, precedence and secret redaction where applicable.
  Seed B002 config_yaml with new foundry_image_edits* files for every key; reuse its parser/fuzz target.


  Budget from 279 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 285 production lines, 245 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 40 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 710 planned, 725 maximum changed lines.
