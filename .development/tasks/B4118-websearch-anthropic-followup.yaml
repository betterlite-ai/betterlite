dod:
  - text: >-
      resolve_max_tokens returns optional_params max_tokens, else kwargs max_tokens, else 1024,
      and returns ceil(budget_tokens) + 1024 when thinking.budget_tokens is a finite number above 0
      and max_tokens is not above it.
    proof: [max-tokens-tests, oracle]
  - text: >-
      prepare_followup_kwargs drops every "_websearch_interception*" key and "litellm_logging_obj"
      and keeps all other keys, including other "_..._interception" prefixes.
    proof: [followup-kwargs-tests, oracle]
  - text: >-
      build_anthropic_request_patch searches every tool call at the same time in call order, turns
      errors into outcomes, builds the assistant and user messages with thinking blocks first, appends
      them to a copy of messages, removes max_tokens from the patch optional_params, and takes the model from
      agentic_loop_params when a logging object has one.
    proof: [request-patch-tests, oracle]
  - text: >-
      A tool call without a query uses "No search query provided" and does not call the search runner.
    proof: [request-patch-tests, oracle]
  - text: >-
      The Anthropic plan carries metadata tool_type "websearch" and response_format "anthropic", adds
      "websearch_native_blocks" only when the native flag is truthy, and terminates with stop_reason
      "web_search_failed" only when the native flag is truthy and every outcome failed.
    proof: [anthropic-plan-tests, oracle]
  - text: >-
      The dispatcher sends "chat_completions" and "responses" to B4119's builders and every other
      surface value, or none, to the Anthropic path.
    proof: [plan-dispatch-tests]
  - text: >-
      Each oracle case calls the production operation and compares the whole patch or plan; only
      error message wording may be ignored.
    proof: [oracle]

checks:
  optional: []
  commands:
    - id: max-tokens-tests
      why: the max_tokens rule is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^anthropic_followup::(.*::)?resolve_max_tokens/)'
    - id: followup-kwargs-tests
      why: the follow-up kwargs filter is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^anthropic_followup::(.*::)?followup_kwargs/)'
    - id: request-patch-tests
      why: the request patch builder is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^anthropic_followup::(.*::)?request_patch/)'
    - id: anthropic-plan-tests
      why: the Anthropic plan, its metadata or its termination rule is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^anthropic_followup::(.*::)?anthropic_plan/)'
    - id: plan-dispatch-tests
      why: the surface dispatch is missing, wrong or untested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/^anthropic_followup::(.*::)?plan_dispatch/)'

