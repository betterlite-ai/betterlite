deviations: []

out_of_scope:
  - async_run_agentic_loop and _execute_agentic_loop, no caller at the pin (see the description). Their cases go too.
  - async_run_chat_completion_agentic_loop and _execute_chat_completion_agentic_loop, chat plan and request patch, Responses plan and request patch, _normalize_responses_input and _extract_search_text (B4119).
  - async_post_agentic_loop_response_hook, _build_native_result_blocks, _tool_call_query, _native_result_pair and _inject_native_blocks (B4113).
  - _execute_search, _short_circuit_search_outcome, _rich_search_input, _provider_supports_rich_search and _create_empty_search_result (B4115).
  - Search tool selection, authorization and parent request correlation (B4114).
  - Gates for the three surfaces (B4117) and tool rewriting, config and initialization (B4116).
  - The follow-up provider call, loop depth and fingerprint safety, kwargs collision filtering and fake stream wrapping (B2415 and its dependencies).

pitfalls:
  - prepare_followup_kwargs removes only the "_websearch_interception" prefix and "litellm_logging_obj"; keys like "_compression_interception_*" must survive this step because the core executor filters them later.
  - The patch optional_params drops only "max_tokens"; "thinking", "temperature" and "stream" pass through untouched.
  - A search that raises must not cancel its siblings, and the outcome order must equal the tool call order, because B4113's native pairing zips tool calls with outcomes by position.
  - Without the native flag a failed search is plain text starting with Search failed, then the message, in the user message and the loop still runs; termination needs the native flag and no success at all.
  - With zero outcomes the "every search failed" test is false, so the loop runs; do not use a plain all() that is true on an empty list.
  - The native flag key is "_websearch_interception_emit_native_blocks" and the metadata key is "websearch_native_blocks"; the key is absent from metadata when the flag is falsy.
  - The model comes from logging model_call_details["agentic_loop_params"]["model"] only when a logging object was passed; the name there is the original one without a provider prefix.
  - budget_tokens is compared as a number and rounded up before adding 1024, so 1500.5 gives 2525, not 2524.5.

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
