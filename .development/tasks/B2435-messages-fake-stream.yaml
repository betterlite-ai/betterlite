  commands:
  - id: behavior-tests
    why: The native fake-stream module lacks coverage outside its corpus replay.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_fake_stream::/) - test(/::replays_corpus$/)'
  - id: case-message-lifecycle
    why: The complete ordered start/block/delta/stop lifecycle is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_fake_stream::tests::message_lifecycle($|::)/)'
  - id: case-usage-projection
    why: Missing, empty, extra and explicit-null usage projections are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_fake_stream::tests::usage_projection($|::)/)'
  - id: case-content-block-variants
    why: Text, thinking, redacted-thinking and tool-use branch outputs are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_fake_stream::tests::content_block_variants($|::)/)'
  - id: case-passthrough-and-invalid
    why: Unknown-block passthrough, null content errors and JSON escaping are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_fake_stream::tests::passthrough_and_invalid_content($|::)/)'
  - id: case-shared-cursor
    why: Shared sync/async cursor advancement and exhaustion are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_fake_stream::tests::shared_cursor($|::)/)'
  - id: helper-python
    why: The pinned fake-stream adapter is not checked by the locked Python tooling.
    run: test -f tools/oracle/helpers/messages_fake_stream.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
