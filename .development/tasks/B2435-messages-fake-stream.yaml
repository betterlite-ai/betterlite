out_of_scope:
- B958 owns Anthropic Messages response and usage record definitions; this task consumes their already decoded map shape and does not reimplement record validation.
- B1087 owns accepted-response size limits and boundary decoding; this file receives a completed response and performs no read, allocation guard or limit check.
- B978 owns response_as_sse_events and raw Messages event classification; B979 owns live upstream relaying, cancellation, queueing and billing. The fake iterator has no HTTP client or provider call.
- B981, B982, B987 and B988 own the agentic, native-handler, advisor and MCP callers that choose when to wrap a response; this task owns only the imported fake iterator class.
pitfalls:
- A truthy usage map with input_tokens=null yields message_start input_tokens=null but omits delta input_tokens, while output_tokens=null remains in message_delta; normalizing all null counters to zero changes two separate get()/is-not-None paths.
- redacted_thinking data=cipher is intentionally absent from the start payload, whereas B978's newer renderer retains redacted data; copying that renderer leaks a field LiteLLM drops here.
- tool_use input=null is serialized as the string partial_json="null", while an absent input is partial_json="{}"; both still emit an input_json_delta after input={}.
- A block with type=future or no type is passed through unchanged and receives only start/stop; treating unknown blocks as text adds an unintended text_delta.
- current_index is one mutable cursor shared by __next__ and __anext__; alternating them consumes frames once, and changing response after construction cannot affect the byte list.
review_level: standard
budget:
  max_changed_lines: 580
  max_new_expects: 0
