id: B1317
title: Gemini cache prefixes, TTL and system instructions
description: >-
  Add cache_prefix and system_instruction to betterlite-vertex. Port all six context-caching
  transformation functions and the two system-message helpers at the end of Gemini transformation.py.
  Select only the first continuous run of cache-marked messages, retain the rest in original order,
  and refuse cache eligibility when its last non-system role is assistant/tool/function. A run
  containing only system messages is eligible. Recognize message-level ephemeral cache_control
  or ephemeral text parts, observing litellm_settings.disable_anthropic_gemini_context_caching_transform
  (false by default). TTL search precedes system extraction and uses the first valid ephemeral
  content-part ttl; message-level ttl alone is not read. parse_cache_ttl accepts bytes for the
  pinned decimal-number plus s/m/h grammar, rounds seconds to nine places and rejects nonpositive
  values or expiry after 9999-12-31T23:59:59Z using an injected clock and checked decimal arithmetic.
  Supported system messages become ordered system_instruction parts; a system-only request gains
  user content '.', while unsupported system messages stay in history. Construct cached request
  model as models/{model} on Studio or the full projects/locations/publishers/google path on Vertex.
  Preserve displayName and optional ttl, and delegate content conversion to B1312.
  Oracle gemini_cache_prefix compares disjoint_markers, terminal_roles, ttl_first_valid,
  ttl_fraction_and_horizon, system_only_period and provider_model_path. Add config-loader tests
  cache_prefix_settings::loads_disable_transform and a TTL fuzz target/replay. Use a separate
  helper seed to verify the new call tag. Source transformation.py has 147 nonblank noncomment
  lines; system helpers add 44. With the marker projection, plan 240 production, 170 tests,
  100 adapters and 140 config/fuzz/wiring lines within 725.
scope:
