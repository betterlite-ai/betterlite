    - crates/betterlite-vertex/fuzz/fuzz_targets/cache_ttl.rs
    - crates/betterlite-vertex/fuzz/corpus/cache_ttl/**
    - crates/betterlite-config/src/loader.rs
    - crates/betterlite-config/src/raw.rs
    - crates/betterlite-config/tests/**
    - crates/betterlite-config/src/resolve.rs
    - crates/betterlite-config/src/types.rs
    - crates/betterlite-config/src/providers/vertex.rs
    - crates/betterlite-config/src/providers/vertex/cache.rs
    - crates/betterlite-config/src/providers/vertex/cache/**
    - tools/oracle/src/helpers/vertex/gemini_cache_prefix.rs
    - tools/oracle/src/helpers/vertex/gemini_cache_prefix/**
    - tools/oracle/helpers/gemini_cache_prefix.py
    - tools/oracle/helpers/gemini_cache_prefix/**
    - tools/oracle/cases/helpers/gemini-cache-prefix/**
    - tools/oracle/fuzz/corpus/helper_case/gemini_cache_prefix*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/context_caching/transformation.py#L24-L202
    why: Entire prefix/TTL/terminal-turn/cache-body implementation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/transformation.py#L1399-L1451
    why: Extract these low-level system helpers here so cache creation does not depend on request orchestration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L8055-L8101
    why: Cache-marker predicate consumed by the prefix transformation.
dod:
  - text: Prefix selection, terminal-turn policy, TTL normalization and system extraction match the source.
    proof: [prefix-tests, oracle, prefix-python]
  - text: The global cache-transform switch is loaded and suppresses otherwise marked messages.
    proof: [prefix-config]
  - text: TTL parsing and helper operation decoding replay new committed inputs.
    proof: [prefix-corpora]
checks:
  optional: [mutants]
  commands:
    - id: prefix-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^cache_prefix::/) - test(replays_the_cache_ttl_corpus)' && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^system_instruction::/)'
      why: Prefix and system helpers require separate behavior suites.
    - id: prefix-config
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/cache_prefix_settings::/)'
      why: Disabling context transformation must work from config rather than a test-only flag.
    - id: prefix-python
      run: test -f tools/oracle/helpers/gemini_cache_prefix.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Python prefix fixtures must control the clock and retain source message order.
    - id: prefix-corpora
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-vertex/fuzz/corpus/cache_ttl)" && test -f crates/betterlite-vertex/fuzz/fuzz_targets/cache_ttl.rs && cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(replays_the_cache_ttl_corpus)' && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/gemini_cache_prefix*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::vertex::gemini_cache_prefix::/)'
      why: Both the TTL decoder and cache-prefix helper must consume new corpus files.
oracle_cases:
  - tools/oracle/cases/helpers/gemini-cache-prefix/disjoint-markers.yaml
  - tools/oracle/cases/helpers/gemini-cache-prefix/terminal-roles.yaml
  - tools/oracle/cases/helpers/gemini-cache-prefix/ttl-first-valid.yaml
  - tools/oracle/cases/helpers/gemini-cache-prefix/ttl-fraction-and-horizon.yaml
  - tools/oracle/cases/helpers/gemini-cache-prefix/system-only-period.yaml
  - tools/oracle/cases/helpers/gemini-cache-prefix/provider-model-path.yaml
deviations: []
out_of_scope:
  - Cache list IO is B1318 and automatic creation B1324; this part does not register cachedContents routes.
  - Gemini transformation.py media routines are B1311, history traversal B1312, and the remaining body/async/sync wrappers B1321.
pitfalls:
  - 'The oracle helper for this task is pre-registered as gemini_cache_prefix in the vertex group. Replace the stub Op in tools/oracle/src/helpers/vertex/gemini_cache_prefix.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/gemini_cache_prefix.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A second separated marked run stays in the uncached messages rather than being combined with the first.
  - System extraction must happen after TTL lookup or a system-block TTL disappears.
  - A terminal tool response is rejected for caching even though conversation conversion emits it with role user.
budget: {max_changed_lines: 725, max_new_expects: 0}
review_level: standard
