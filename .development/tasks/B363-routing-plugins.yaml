id: B363
title: Routing and classifier plugin bridge
description: Implement typed routing-context input/output and wire the ordered router-level and complexity-tier
  plugin hooks plus classifier_type custom through B165's embedded Python adapter. Keep native strategy
  dispatch an enum and Python execution at the existing authorized extension boundary. Reuse B330's structured-message
  normalization, B331's classifier failure result and bounded deadlines. Treat router_plugins.json as
  informational pinned metadata, never an installation manifest or permission to fetch code. The architect
  must add B165's exact bridge paths to scope if they live outside these crates before dispatch. Use the
  existing Rust crate boundaries from B004 and B008; integrate through the server when the provider dispatcher
  or callbacks live in another core crate. This task's source slices are the linked ranges, not a port
  of their Python classes. Add the listed oracle cases and the matching adapters to B301's component runner
  where state is not observable over HTTP; adapters call production logic and never reproduce it. Use
  deterministic candidate sets or supplied random samples for comparisons, and separate seeded distribution
  tests for random choices. Extend the existing config_yaml fuzz target and committed corpus for every
  newly accepted config form; unsupported keys still fail by full path. Add a cargo-fuzz target plugin_json
  under crates/betterlite-router/fuzz and a normal replays_the_plugin_json_corpus test using
  the production parser. Keep the implementation, adapters and tests within 800 changed lines; fixtures
  and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/routing-plugins/**
  - tools/oracle/src/router_probes/routing_plugins/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/routing_plugins.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/router_plugins.json#L1-L28
  why: Informational plugin catalog, not automatic dependency installation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L1164-L1209
  why: Routing context and two distinct plugin contracts.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L13578-L13642
  why: Ordered router plugin signals and candidate filtering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2300-L2362
  why: Custom classifier timeout, decline and tier validation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L2882-L2931
  why: Tier plugin filtering and empty-candidate errors.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the routing_plugins prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(routing_plugins)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/plugin_json.rs && test -n "$(ls -A
      crates/betterlite-router/fuzz/corpus/plugin_json)" && cargo nextest run --locked -p betterlite-router
      --no-tests=fail -E 'test(replays_the_plugin_json_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/routing-plugins/plugin-order-and-signals.yaml
- tools/oracle/cases/routing/routing-plugins/router-plugin-empty-denies.yaml
- tools/oracle/cases/routing/routing-plugins/tier-plugin-empty-denies-default.yaml
- tools/oracle/cases/routing/routing-plugins/raw-and-structured-messages.yaml
- tools/oracle/cases/routing/routing-plugins/classifier-tier-label.yaml
- tools/oracle/cases/routing/routing-plugins/classifier-candidate-mutation-no-effect.yaml
- tools/oracle/cases/routing/routing-plugins/classifier-decline-fallback.yaml
- tools/oracle/cases/routing/routing-plugins/classifier-timeout-fallback.yaml
- tools/oracle/cases/routing/routing-plugins/unknown-or-empty-tier-fallback.yaml
- tools/oracle/cases/routing/routing-plugins/plugin-cancellation-releases-context.yaml
- tools/oracle/cases/routing/routing-plugins/restricted-member-config-rejected.yaml
deviations: []
out_of_scope:
- Embedding Python itself, loading operator-configured hooks and Python package management, owned by B165.
- Installing the language-detector example from the catalog.
pitfalls:
- A routing plugin's empty candidate list is a policy result and may not trigger an unrestricted default.
- A classifier plugin's candidate list is informational and cannot change the selected tier pool.
- Neither the catalog URL nor a request body authorizes fetching or importing an arbitrary plugin.
- Validate Python replies at the Rust boundary and keep secrets and raw prompts out of errors.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
