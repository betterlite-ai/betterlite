id: B1010
title: Realtime http calls
description: >-
  Implement provider-facing create_client_secret, transcription_session and SDP realtime_calls operations using
  B010 transforms and configured credentials. Preserve stored-credential precedence and internal guardrail metadata
  separation; treat SDP as bounded opaque bytes and binary content types through B900.


  Implement crates/betterlite-core/src/api/realtime_http_calls.rs. Use RealtimeHttpCallsInput and RealtimeHttpCallsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions client_secret_provider_request, transcription_session_model, sdp_answer,
  stored_credential_precedence, provider_http_error under api::realtime_http_calls::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.api_base
  defaults to None; litellm_settings.api_key defaults to None; litellm_settings.openai_key defaults to None; env.OPENAI_API_KEY
  defaults to unset (None); env.REQUEST_TIMEOUT defaults to 6000 seconds. No environment reads occur outside betterlite-config.
  Test api::realtime_http_calls::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::RealtimeHttpCalls in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_http_calls: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/realtime_api/main.py: _model_params_with_stored_credentials (L62-L69); litellm/realtime_api/main.py:
  _with_resolved_session_model (L72-L75); litellm/realtime_api/main.py: _build_litellm_metadata (L78-L84); litellm/realtime_api/main.py:
  _get_realtime_http_provider_config (L87-L124); litellm/realtime_api/main.py: acreate_realtime_client_secret (L128-L185);
  litellm/realtime_api/main.py: acreate_realtime_transcription_session (L189-L257); litellm/realtime_api/main.py:
  arealtime_calls (L261-L310). Abstract/protocol declarations map to native types and synchronous/async wrappers
  share one implementation; a partial function span is the explicit preparation/transition stage described above,
  with typed values passed to the following stage.


  Sizing: 208 owned nonblank/non-comment/non-docstring Python lines (223 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 228 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 45 config tests/seeds and
  30 wiring; 523 total within the 530-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B061 (Stored credentials
  and their encryption), B171 (Direct helper oracle and URL path encoding), B1004 (Realtime contracts), B1087 (Api
  boundaries), B528 (OpenAI realtime connection and session requests), B002 (Load LiteLLM config.yaml into typed
  config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.
