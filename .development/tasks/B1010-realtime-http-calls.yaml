id: B1010
title: Realtime HTTP SDK calls
description: >-
  Implement _with_resolved_session_model,_get_realtime_http_provider_config and the three complete
  decorated SDK methods acreate_realtime_client_secret,acreate_realtime_transcription_session,
  arealtime_calls in betterlite-core::api::realtime_http_calls. B174 resolves model/key/base;
  B157 selects HTTP config, B528/B545 own OpenAI/Azure config methods and B2456 performs HTTP.
  This task no longer owns _model_params_with_stored_credentials (B1127) or _build_litellm_metadata
  (B1011), neither of which these SDK methods call. B1004 supplies typed request records.

  With a known provider, call get_provider_realtime_http_config(model="",provider=enum); unknown names
  skip that selector. Raw key/base choose dynamic > GenericLiteLLMParams. With a config, delegate its
  get_api_base/get_api_key. Without one, base is raw > litellm.api_base > https://api.openai.com and key
  raw > litellm.api_key > litellm.openai_key > OPENAI_API_KEY > "". Trim trailing base slashes.
  These are HTTP fallbacks, not the different WebSocket branch rules. custom_llm_provider in kwargs
  is not supplied to get_llm_provider by these methods.

  B002 loads litellm_settings.api_base,api_key,openai_key and OPENAI_API_KEY, all None/unset by default.
  Reuse B198 REQUEST_TIMEOUT=6000 seconds; timeout=None or 0 selects that value. Named
  loads_realtime_http_settings tests invoke the real loader for defaults, overrides and invalid types,
  with new config_yaml seeds. B2456 owns SDP UTF-8 parsing and B1004 record decoding. Register
  sdk_http.realtime_http_calls through B2401 and compare each operation's real provider request and raw
  response. Own 208 nonblank/non-comment lines; budget 165 orchestration,140 tests,120 fixtures,
  90 adapters,65 config tests/seeds and 30 wiring =610 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/realtime_http_calls.rs
  - crates/betterlite-core/src/api/realtime_http_calls/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/**
  - crates/betterlite-config/src/api/realtime_http_calls.rs
  - crates/betterlite-config/src/api/realtime_http_calls/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/realtime-http-calls-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/realtime_http_calls.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/realtime_http_calls.py
  - tools/oracle/cases/sdk-http/realtime-http-calls/**
  - tools/oracle/fuzz/corpus/sdk_http_case/realtime-http-calls-*
  - tools/oracle/helpers/b1010.py
  - tools/oracle/helpers/b1010/**
  - tools/oracle/src/helpers/core_ops/b1010.rs
  - tools/oracle/src/helpers/core_ops/b1010/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/realtime_api/main.py#L72-L75
  why: Normalize a session model only when its top-level key already exists.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/realtime_api/main.py#L87-L310
  why: Complete HTTP config resolver and all three SDK operations with their decorators and timeout/default logic.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L574-L577
  why: REQUEST_TIMEOUT is an environment float with6000-second default, not an SDK timeout of600.
dod:
- text: >-
    realtime_http_credentials exercises each first-nonempty position in the raw/global/OpenAI/environment
    chains above and all empty/unset. Config methods receive raw resolved values and their returned base/key
    are used, with trailing slashes removed. Unknown or known-no-config provider uses the fallback URL/key.
    Requests capture the selected auth and make one POST; no credential value appears in logs. Explicit
    custom_llm_provider kwargs cannot override the resolver's model-based provider in these methods.
  proof: [behavior-tests, config-tests, oracle, sdk-python]
- text: >-
    realtime_client_secret_sdk defaults model to gpt-4o-realtime-preview, preferring session.model over root
    model. Empty session/expires_after dictionaries become None and are omitted. An expiry {seconds:60}
    sends {anchor:created_at,seconds:60}; null fields are excluded. Root model is a routing hint and never
    sent; a supplied session.model is replaced by the normalized provider model. A session without model
    does not gain one at this layer. Unknown session fields survive. Logger optional_params retains original
    expires_after/session, while litellm_params contains resolved api_base. Extra headers/client/api_version
    reach B2456. Mock200 JSON remains an unencrypted raw HTTP response.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    realtime_transcription_session_sdk defaults to gpt-realtime-whisper, choosing explicit model before
    transcription_session.input_audio_transcription.model. With model=allowed and nested model=forbidden,
    send nested normalized allowed, retaining language=en and extra fields. Missing nested transcription
    is not created. A transcription_session containing a root model collides with the explicit model
    constructor argument and fails before HTTP. All root model hints are excluded from the outgoing body;
    logger optional_params contains the original transcription_session and resolved api_base separately.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    realtime_calls_sdk defaults model to gpt-4o-realtime-preview and passes the caller's ephemeral key unchanged
    even when a long-lived provider key was resolved. An existing session.model (including None) is rewritten
    to normalized model; an absent key stays absent here before B2456 supplies its defaults. Session.type=
    transcription and nested model remain otherwise unchanged. Capture SDP multipart and raw SDP response.
    Logger options are {realtime_calls:true,session:<normalized-or-None>}. timeout=0/None uses REQUEST_TIMEOUT,
    explicit2.5 remains2.5. Provider429 retains SDK exception fields through the decorator; there is no route
    ProxyException code coercion. Validation failures make zero requests.
  proof: [behavior-tests, oracle, sdk-python]
- text: Loader, SDK parser and provider exchange cases are newly added for all three entry points.
  proof: [config-tests, config-corpus, sdk-corpus, new-cases, oracle, sdk-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Routing hints and nested models must become the exact HTTP arguments without duplicating transport logic.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_http_calls::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: The HTTP credential fallback and REQUEST_TIMEOUT must use loaded settings.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_http_calls::tests::loads_realtime_http_settings($|::)/)'
  - id: config-corpus
    why: New realtime HTTP settings seeds must reach the existing YAML decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/realtime-http-calls-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: sdk-python
    why: Provider-facing SDK calls must run through B2401 instead of helper adapters.
    run: test -f tools/oracle/sdk_http/realtime_http_calls.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: The realtime_http_calls tag needs an added SDK decoder seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/realtime-http-calls-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: Each SDK endpoint needs fresh request/result captures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/realtime-http-calls)"
oracle_cases:
- tools/oracle/cases/sdk-http/realtime-http-calls/realtime-http-credentials.yaml
- tools/oracle/cases/sdk-http/realtime-http-calls/realtime-client-secret-sdk.yaml
- tools/oracle/cases/sdk-http/realtime-http-calls/realtime-transcription-session-sdk.yaml
- tools/oracle/cases/sdk-http/realtime-http-calls/realtime-calls-sdk.yaml
deviations: []
out_of_scope:
- In realtime_api/main.py B1127 owns stored-credential merging and health probes; B1011 owns metadata merging, token resolution and the whole _arealtime connector.
- B2456 owns actual HTTP execution, B528/B545 provider HTTP configs, B174 identity and B157 factory selection. Route token encryption is B084/B1126 using B061.
pitfalls:
- The three SDK methods do not call _model_params_with_stored_credentials; adding that merge here would change credential precedence.
- Empty session/expires_after dictionaries are treated as absent before Pydantic defaults are constructed.
- timeout=0 falls back to REQUEST_TIMEOUT because the source uses a truthiness test.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
