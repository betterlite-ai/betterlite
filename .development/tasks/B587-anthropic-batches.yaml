checks:
  optional:
  - mutants
  commands:
  - id: case-batch-create-requests
    why: The batch-create-requests behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_create_requests$/)'
  - id: case-batch-status-counts
    why: The batch-status-counts behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_status_counts$/)'
  - id: case-batch-ended-output-file-id
    why: The batch-ended-output-file-id behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_ended_output_file_id$/)'
  - id: case-batch-error-counts
    why: The batch-error-counts behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_error_counts$/)'
  - id: case-batch-retrieve
    why: The batch-retrieve behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_retrieve$/)'
  - id: case-batch-result-response
    why: The batch-result-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_result_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_batches.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_batches*")"
      && grep -lq 'anthropic_batches' tools/oracle/fuzz/corpus/helper_case/anthropic_batches* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_batches$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-anthropic/fuzz/corpus/anthropic_batches)"
      && grep -q 'decode_anthropic_batch_result' crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_batches.rs
      && cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::replays_the_anthropic_batches_corpus$/)'
