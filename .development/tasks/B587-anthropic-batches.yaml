id: B587
title: Anthropic batch retrieval and result projection
description: >-
  Implement native Anthropic batch retrieval/status and result-row projection onto OpenAI records. Creation is not
  implemented at the pin; retain its NotImplementedError instead of inventing a request mapping. B086 owns proxy
  persistence and scheduling; provider code only executes configured API paths.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/batches/transformation.py:
  AnthropicBatchesConfig.__init__ L49-L54; AnthropicBatchesConfig.custom_llm_provider L57-L59; AnthropicBatchesConfig.validate_environment
  L61-L89; AnthropicBatchesConfig.get_complete_batch_url L91-L104; AnthropicBatchesConfig.transform_create_batch_request
  L106-L118; AnthropicBatchesConfig.transform_create_batch_response L120-L132; AnthropicBatchesConfig.get_retrieve_batch_url
  L134-L155; AnthropicBatchesConfig.transform_retrieve_batch_request L157-L170; AnthropicBatchesConfig.transform_retrieve_batch_response
  L172-L268; AnthropicBatchesConfig.get_error_class L270-L280; AnthropicBatchesConfig.transform_response L282-L331.
  litellm/llms/anthropic/batches/handler.py: AnthropicBatchesHandler.__init__ L33-L35; AnthropicBatchesHandler.aretrieve_batch
  L37-L122; AnthropicBatchesHandler.retrieve_batch L124-L168.


  BaseTokenUsageProcessor normalization belongs to B068 and is an injected usage projection for batch result rows.


  Named case contracts: batch_create_requests: Both transform_create_batch_request and transform_create_batch_response
  raise NotImplementedError Batch creation not yet implemented for Anthropic. Create URL helper resolves B567 base
  and appends /v1/messages/batches unless exact suffix already present; trailing slash on an already suffixed URL
  causes duplicate route append after rstrip. batch_status_counts: id defaultempty, processing_status defaultin_progress;
  in_progress->in_progress,canceling->cancelling,ended->completed, unknown->in_progress. Counts total=sum processing,succeeded,errored,canceled,expired
  default0; completed=succeeded,failed=errored only; canceled/expired are included in total but not failed. batch_ended_output_file_id:
  For every status output_file_id=batch id, object=batch,endpoint=/v1/messages,input_file_id literal string None,completion_window=24h,errors/error_file_id/finalizing_at/failed_at=None,metadata={}.
  No custom_id or results_url metadata is copied. batch_error_counts: Malformed response JSON becomes ValueError
  Failed to parse Anthropic batch response: <error>; parsed structural/count errors propagate. get_error_class converts
  dict to httpx.Headers, retains Headers, usesNone for other header types and preserves B567 status/message. batch_retrieve:
  Truthy explicit base/key else B567 resolutions; missing key raises ValueError Missing Anthropic API Key even if
  AUTH_TOKEN exists (validator alone supports that token). GET encoded batch_id under base.rstrip+/v1/messages/batches/
  with B173 anthropic client; timeout/max_retries arguments unused; raise_for_status before response mapping. Truthy
  _is_async returns coroutine; sync facade awaits same flow. Request transform returns {}. batch_result_response:
  Strip/split raw text on newline, ignore blank lines and JSONDecodeError rows only. Require result.message, project
  each through B580 on same mutable response (last valid row determines content/model), append truthy usage and
  combine via B068. Missing result/message or projection errors abort, no error-row skipping. Input custom_id is
  ignored; final response usage is aggregate even when no valid rows. batch_timestamps: Parse truthy ISO timestamps
  after replace Z with +00:00, int truncate seconds; any exception ->None, naive values follow fixture timezone.
  created_at falsey/epoch0 falls back injected now, but in_progress_at preserves parsed0 for raw in_progress status.
  completed_at onlyraw ended; cancelling_at onlyraw canceling; cancelled_at onlyraw canceling plus truthy ended_at;
  expired_at is truthy archived_at independent of status. batch_auth_headers: Validator fills api_base from dict
  params only if argumentNone, resolves B567 auth with defaultcustom-bearer false, and errors with Missing Anthropic
  API Key - A call is being made to anthropic but no key is set either in the environment variables or via params
  when noauth. Overwrite accept/content-type application/json,anthropic-version2023-06-01 and auth; add exact anthropic-beta=message-batches-2024-09-24
  onlywhen absent, preserving empty caller beta.


  When logging is absent create B190 context model=anthropic/unknown,messages=[],stream=false,call_type=batch_retrieve,start_time=None,litellm_call_id=batch_retrieve_<id>,function_id=batch_retrieve.
  No managed-files enterprise hook is provided; native batch retrieval and result access remain available, while
  creation retains the explicit source NotImplementedError.


  Write standalone Rust test batches_credential_identity_isolation in betterlite-anthropic: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test batches_secret_safe_failure in betterlite-anthropic: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B247. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-anthropic/src/batches.rs with adjacent tests under batches/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation anthropic_batches in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batches_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  batch_create_requests, batch_status_counts, batch_ended_output_file_id, batch_error_counts, batch_retrieve, batch_result_response,
  batch_timestamps, batch_auth_headers. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_batches* using HelperCase: kind: helper
  and the externally tagged anthropic_batches variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_batches that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_anthropic_batch_result consumes batch lifecycle JSON and result JSONL bytes tagged
  by operation in crates/betterlite-anthropic/src/batches.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_batches.rs calling that exact production function, with
  new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_batches.
  The adjacent test replays_the_anthropic_batches_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 358 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 340 production lines, 245 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 780 planned, 800 maximum changed lines.
