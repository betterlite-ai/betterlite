id: B587
title: Anthropic batch creation and result status
description: >-
  Add native Anthropic batch lifecycle request/reply mapping onto OpenAI batch records. Preserve custom_id, request
  parameters, processing_status/counts, synthetic output_file_id and result URL metadata. B086 owns proxy persistence
  and scheduling; provider code only executes configured API paths.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/batches/transformation.py:
  AnthropicBatchesConfig.__init__ L49-L54; AnthropicBatchesConfig.custom_llm_provider L57-L59; AnthropicBatchesConfig.validate_environment
  L61-L89; AnthropicBatchesConfig.get_complete_batch_url L91-L104; AnthropicBatchesConfig.transform_create_batch_request
  L106-L118; AnthropicBatchesConfig.transform_create_batch_response L120-L132; AnthropicBatchesConfig.get_retrieve_batch_url
  L134-L155; AnthropicBatchesConfig.transform_retrieve_batch_request L157-L170; AnthropicBatchesConfig.transform_retrieve_batch_response
  L172-L268; AnthropicBatchesConfig.get_error_class L270-L280; AnthropicBatchesConfig.transform_response L282-L331.
  litellm/llms/anthropic/batches/handler.py: AnthropicBatchesHandler.__init__ L33-L35; AnthropicBatchesHandler.aretrieve_batch
  L37-L122; AnthropicBatchesHandler.retrieve_batch L124-L168.


  BaseTokenUsageProcessor normalization belongs to B068 and is an injected usage projection for batch result rows.


  Implement crates/betterlite-anthropic/src/batches.rs with adjacent tests under batches/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation anthropic_batches in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batches_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  batch_create_requests, batch_status_counts, batch_ended_output_file_id, batch_error_counts, batch_retrieve, batch_result_response.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_batches* using HelperCase: kind: helper
  and the externally tagged anthropic_batches variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_batches that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_anthropic_batch_result consumes batch lifecycle JSON and result JSONL bytes tagged
  by operation in crates/betterlite-anthropic/src/batches.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_batches.rs calling that exact production function, with
  new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_batches.
  The adjacent test replays_the_anthropic_batches_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 358 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 375 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 633 planned, 650 maximum changed lines.
scope:
  paths:
  - crates/betterlite-anthropic/Cargo.toml
  - crates/betterlite-anthropic/src/lib.rs
  - crates/betterlite-anthropic/src/error.rs
  - crates/betterlite-anthropic/src/batches.rs
  - crates/betterlite-anthropic/src/batches/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/anthropic_batches.rs
  - tools/oracle/src/helpers/anthropic_batches/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/anthropic_batches.py
  - tools/oracle/cases/helpers/providers/anthropic-batches/**
  - tools/oracle/fuzz/corpus/helper_case/anthropic_batches*
  - crates/betterlite-anthropic/fuzz/Cargo.toml
  - crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_batches.rs
  - crates/betterlite-anthropic/fuzz/corpus/anthropic_batches/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/batches/transformation.py#L49-L331
  why: >-
    Own AnthropicBatchesConfig.__init__, AnthropicBatchesConfig.custom_llm_provider, AnthropicBatchesConfig.validate_environment,
    AnthropicBatchesConfig.get_complete_batch_url, AnthropicBatchesConfig.transform_create_batch_request, AnthropicBatchesConfig.transform_create_batch_response,
    AnthropicBatchesConfig.get_retrieve_batch_url, AnthropicBatchesConfig.transform_retrieve_batch_request, AnthropicBatchesConfig.transform_retrieve_batch_response,
    AnthropicBatchesConfig.get_error_class, AnthropicBatchesConfig.transform_response. Other functions in this file
    remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/batches/handler.py#L33-L168
  why: >-
    Own AnthropicBatchesHandler.__init__, AnthropicBatchesHandler.aretrieve_batch, AnthropicBatchesHandler.retrieve_batch.
    Other functions in this file remain with the owners listed below.
dod:
- text: 'batch create requests: the production result, omission or failure matches tools/oracle/cases/helpers/providers/anthropic-batches/batch-create-requests.yaml.'
  proof:
  - case-batch-create-requests
  - oracle
  - helper-python
- text: 'batch status counts: the production result, omission or failure matches tools/oracle/cases/helpers/providers/anthropic-batches/batch-status-counts.yaml.'
  proof:
  - case-batch-status-counts
  - oracle
  - helper-python
- text: >-
    batch ended output file id: the production result, omission or failure matches tools/oracle/cases/helpers/providers/anthropic-batches/batch-ended-output-file-id.yaml.
  proof:
