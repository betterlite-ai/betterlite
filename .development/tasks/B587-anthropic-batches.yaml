out_of_scope:
- B027 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_batches in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/batches.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_batches.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The async retrieve wrapper requires an API key before its auth-token-capable validator can run.
- output_file_id is set for every status, and result-row conversion keeps the last projected message while summing
  usage.
