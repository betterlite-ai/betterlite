id: B6560
title: Guardrail form field projection and core provider forms
description: >-
  Build the part of GET /guardrails/ui/provider_specific_params that turns a provider's settings model into the form field dictionary the dashboard draws. LiteLLM does it by reflecting over Pydantic classes. Rust has no such reflection, so a model's fields are written down once as data, and one projection function turns that data into the same JSON LiteLLM sends. Everything goes in crates/betterlite-server/src/guardrails/provider_forms.rs and provider_forms/. B6561 and B6562 add the tables for the other providers and B3684 serves the route.

  Types, in `spec.rs`. `FormModel { ui_friendly_name: Option<&'static str>, fields: Vec<FormField> }`. `FormField { name: &'static str, description: Option<&'static str>, required: bool, shape: FormShape, default: Option<serde_json::Value>, extra: FormExtra }`. `FormShape` is the declared Python type after Optional is removed: `Text`, `Number` (int and float), `Boolean`, `Mapping { keys: Vec<Value>, value: Box<FormShape> }` (`keys` is the Literal values of the key type, empty when the key type is not a Literal), `List { options: Vec<Value> }` (the Literal values of the element type, empty otherwise), `Choice(Vec<Value>)` (a Literal), `Nested(Box<FormModel>)`, `RawObject`, `RawList` and `Other` (any type LiteLLM does not know, which becomes text). `FormExtra` holds what LiteLLM reads from `json_schema_extra`: `ui_type: Option<String>`, `type_override: Option<String>`, `options: Option<Vec<Value>>`, `min`, `max`, `step` and `default_value`, each optional. A field whose annotation is a TypeVar that was never filled in is simply left out of the table.

  Projection, in `project.rs`: `project_model(model: &FormModel, max_depth: usize) -> Result<serde_json::Map<String, Value>, FormError>`, with `FormError` a thiserror enum in `error.rs`. It follows `_extract_fields_recursive`, `_build_field_dict` and the helpers around them (L1621-L1907). Per field: `description` is the declared description or the field name. A `Nested` field becomes `{description, required, type: "nested", fields: <recursive>}`. Any other field becomes `{description, required, type}` where type comes from the shape: Text "string", Number "number", Boolean "boolean", Mapping "dict", List "array", Choice "select", RawObject "object", RawList "array", Other "string". Then in this order: `ui_type` replaces the type, else `type_override` does; a "dict" gets `dict_key_options` when keys are not empty and always `dict_value_type` (the value shape's type string, "string" when the value shape is Other); an "array" with options gets `options` and the type "multiselect"; `extra.options` wins over those, else a "select" gets the Choice values as `options`; `default_value` is the default when it is present and not null; then `min`, `max`, `step` and `default_value` from `extra` overwrite when set. The recursion depth limit is the `max_depth` argument (B3684 passes the value of the env var `DEFAULT_MAX_RECURSE_DEPTH`, default 100): a model nested deeper gives `FormError::TooDeep { limit }`, which B3684 turns into HTTP 400 with "Max depth of {limit} exceeded while processing model fields. Please check the model structure for excessive nesting.".

  Tables, in `core_tables.rs`: `pub fn core_tables() -> Vec<(&'static str, FormModel)>` returning the registry key and the model for the providers the route names itself: `bedrock` (BedrockGuardrailConfigModel fields, then BedrockGuardrailStreamingParams fields merged into the same map, later key wins), `presidio` (PresidioPresidioConfigModelUserInterface), `lakera_v2` (LakeraV2GuardrailConfigModel), `tool_permission` (ToolPermissionGuardrailConfigModel, with `ui_friendly_name` added as a plain string entry) and `hide-secrets` (the wire value of SupportedGuardrailIntegrations.HIDE_SECRETS, HideSecretsGuardrailConfigModel, also with `ui_friendly_name`). The Bedrock `checks` field is nested (BedrockChecksConfigModel); write that model out too. Read each class for its exact descriptions, defaults and Literal values. The two `ui_friendly_name` entries sit beside the fields, so `project_model` output for these models is merged with `{"ui_friendly_name": "<name>"}` by a `with_friendly_name` function in `project.rs`; the same function is used by B6561, B6562 and B3684 for every model that has a name.

  Oracle: the helper operation for this task takes `model`. Names of real models (`bedrock`, `presidio`, `lakera_v2`, `tool_permission`, `hide-secrets`) make the Python side call `_get_fields_from_model` on the real classes (merge and friendly name as the route does); Rust projects its table. The Python adapter also defines fixed synthetic Pydantic classes the real models do not cover, and the Rust adapter builds the same specs by hand: `synthetic_literal_list` (List[Literal], Dict[Literal, float], Literal, ui_type, min/max/step, options override), `synthetic_nested` and `synthetic_generic` (unfilled and BaseModel-filled `optional_params`). Both sides answer the JSON map.
