dod:
  - text: A field's type string, `options`, `dict_key_options`, `dict_value_type`, multiselect upgrade, `ui_type` and `type_override` replacement, `min`, `max`, `step` and `default_value` come out exactly as LiteLLM's _build_field_dict gives them, and a field with no description uses its name.
    proof: [form-projection-tests, oracle, helper-python]
  - text: A nested model becomes a field of type `nested` with a `fields` map, and a model nested deeper than max_depth returns FormError::TooDeep with the limit.
    proof: [form-projection-tests]
  - text: The bedrock, presidio, lakera_v2, tool_permission and hide-secrets tables project to the same JSON as LiteLLM's classes, with `ui_friendly_name` on the last two and the two Bedrock models merged.
    proof: [form-core-tables-tests, oracle, helper-python]
  - text: The synthetic models project the same on both sides, including the skipped and the BaseModel-filled `optional_params`.
    proof: [oracle, helper-python]
  - text: The new helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: form-projection-tests
      why: the projection rules, the depth limit or the friendly-name merge are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::provider_forms::tests::projection_/)'
    - id: form-core-tables-tests
      why: a core table is missing or differs from the expected JSON
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::provider_forms::tests::core_table_/)'
    - id: helper-python
      why: the oracle adapter is missing or fails strict lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b6560)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no new helper case was added or the shared parser fails on one
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/guardrail-form-fields-*)" &&
        grep -lE '^[[:space:]]+b6560:' tools/oracle/fuzz/corpus/helper_case/guardrail-form-fields-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/guardrail-form-fields/core-bedrock.yaml
  - tools/oracle/cases/helpers/guardrail-form-fields/core-presidio.yaml
  - tools/oracle/cases/helpers/guardrail-form-fields/core-lakera-v2.yaml
  - tools/oracle/cases/helpers/guardrail-form-fields/core-tool-permission.yaml
  - tools/oracle/cases/helpers/guardrail-form-fields/core-hide-secrets.yaml
  - tools/oracle/cases/helpers/guardrail-form-fields/synthetic-literal-list.yaml
  - tools/oracle/cases/helpers/guardrail-form-fields/synthetic-nested.yaml
  - tools/oracle/cases/helpers/guardrail-form-fields/synthetic-generic.yaml
deviations:
  - what: Provider settings are written as data tables and no longer read off the classes.
    why: Rust has no annotation reflection. Each table is checked against LiteLLM's real class by an oracle case, so a drift shows up as a failing case.
  - what: A model nested deeper than the limit returns an error value and B3684 maps it to 400, where LiteLLM raises HTTPException inside the helper.
    why: A pure function should not know HTTP. The status and text the client sees are the same.
out_of_scope:
  - "The route /guardrails/ui/provider_specific_params and the registry loop that adds every other provider: B3684 serves it, B6561 and B6562 hold the tables."
  - "The settings structs the guardrails read at run time (BedrockGuardrailConfigModel and the rest as request-time config): B3660, B3661, B3662 and the provider tasks own them. The tables here only describe form fields."
  - "Fields of PresidioConfigModel beyond the UI class: the route uses only PresidioPresidioConfigModelUserInterface."
pitfalls:
  - "`optional_params` is skipped when its annotation is a TypeVar that was never filled in (GuardrailConfigModel without a type argument), but a model declared as GuardrailConfigModel[BaseModel] gets the field as a plain string field, because BaseModel itself is not treated as a nested model."
  - "The type check for Literal compares the origin's `__name__` to 'Literal'; do not assume it gives 'select'. Run the synthetic Literal case against the real adapter and copy what comes out."
  - "`default_value` is left out when the default is null, so a field with `default=None` has no such key, while `default=False` keeps `default_value: false`."
  - "A Dict whose key type is a union of an Enum and str has no Literal values, so `dict_key_options` is missing and only `dict_value_type` is present."
  - "`options` from `json_schema_extra` beat both the multiselect options and the Literal options, and `ui_type: multiselect` is a plain type override, not a list upgrade."
  - "`ui_friendly_name` is a sibling of the field entries in the map, a plain string, so a field called `ui_friendly_name` would be overwritten."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
