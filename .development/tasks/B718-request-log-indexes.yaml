id: B718
title: Partition-safe request log indexes
description: >-
  Implement RequestLogIndexes and replica identity updates on configured tables using parameterized pg_catalog
  reads and safely quoted known identifiers. Preserve bounded locks, adoption of equivalent indexes, invalid
  leaf repair, parent attachment and duplicate-index diagnostics; build concurrently where upstream requires
  it. Bounded background work is owned by the server and a migration-job invocation waits for completion.


  Build the production request_log_indexes module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm-proxy-extras/litellm_proxy_extras/request_log_indexes.py:
  RequestLogIndex.columns (L38-L39; 2 source lines), RequestLogIndex.partition_index_name (L41-L50; 10
  source lines), filter_request_log_index_diff (L125-L131; 7 source lines), _creates_one_of (L134-L136;
  3 source lines), _without_comments (L139-L140; 2 source lines), _connect (L143-L146; 3 source lines),
  ensure_request_log_indexes (L149-L173; 24 source lines), _under_migration_lock (L176-L183; 8 source
  lines), _with_bounded_lock (L186-L209; 23 source lines), _ensure_index (L212-L222; 10 source lines),
  _regclass_name (L225-L228; 3 source lines), _create_index_statement (L231-L234; 4 source lines), _index_state
  (L237-L241; 4 source lines), _equivalent_indexes (L244-L261; 17 source lines), _adopt_equivalent_index
  (L264-L287; 23 source lines), _report_second_copies (L290-L311; 21 source lines), _children_without_the_index
  (L314-L325; 11 source lines), _build_leaf_index (L328-L372; 43 source lines), build_index_on_partitioned_table
  (L375-L415; 40 source lines), _create_parent_index (L418-L433; 15 source lines), _attach_child_index
  (L436-L463; 25 source lines). litellm-proxy-extras/litellm_proxy_extras/replica_identity.py: apply_replica_identity_full
  (L49-L104; 53 source lines).


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 351 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  351 production, 154 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 535 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
