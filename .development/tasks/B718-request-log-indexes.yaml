      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^request_log_indexes::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/request_log_indexes::tests::postgres_pinned_rows$/)'
