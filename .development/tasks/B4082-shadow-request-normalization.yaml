  - tools/oracle/cases/helpers/shadow-requests/snapshot-replaces-request-body.yaml

deviations:
  - what: The fingerprint is the SHA-256 of serde_json's compact sorted-key text, so its hex value differs from LiteLLM's (json.dumps with spaces after separators, default=str).
    why: The fingerprint is only compared inside one process and never stored or shown, and docs/compatibility.md leaves json.dumps formatting out; the oracle cases compare whether two fingerprints are equal, not their text.
  - what: Request shapes are checked as serde_json values, so a request that is not an object, or a messages value that is not an array of objects, is a rejected shape (sample skipped) before any translation.
    why: Python's lenient Mapping and tuple adapters accept more container types; JSON input only has objects and arrays, and a rejected shape is skipped in both.
  - what: LiteLLM's blanket `except Exception` around request normalization becomes the typed ShadowRequestError, and any such error gives None with a debug log.
    why: Same skip behavior without catching panics; the cause stays visible in the log line.

out_of_scope:
  - "ShadowEvalLogger.async_log_success_event, which calls surface_ops, picks post_guardrail_kwargs for wire_params surfaces and calls judgeable_sample, has no owner yet; see the notes in the planner report."
  - "The final-text readers (_chat_final_text, _responses_final_text), routing decision readers and result records: B4081."
  - "Active jobs, _sampled_jobs, _direction_admits, _scope_admits, _sample_hits and the jobs cache: B4083."
  - "Shadow call and blind judge execution (_call_router_shadow, _call_judge, the judge prompt and PairwiseVerdict): B4084."
  - "Budget gates and the per-arm pipeline (_run_shadow_eval, _run_shadow_arm): B4085."
  - "Storing the snapshot on the logging object and calling GuardrailRequestSnapshot.capture after the guardrails ran (litellm_pre_call_utils.py L1960-L1990, litellm_logging.py L723 and L3478-L3500): the proxy pre-call and logging tasks that own those files."
  - "translate_anthropic_to_openai (B967), translatable_anthropic_params (B1117), transform_responses_api_request_to_chat_completion_request (B908), independent_snapshot (B2204) and is_web_search_tool_responses (B4111): used here, not rebuilt."

pitfalls:
  - 'A guardrail entry with no `guardrail_mode` is request-mutating (the mode list becomes `[None]`), so the sample fails closed and needs a matching snapshot; only an empty `guardrail_mode` array is non-mutating.'
  - '`logging_only` is non-mutating for request_mutating_guardrail_ran but not for the fingerprint, so adding a logging_only entry changes the fingerprint and invalidates the snapshot.'
  - 'The Anthropic row ignores `model_parameters` on purpose, and `system` falls back from kwargs to the wire body with an `or`, so an empty string in kwargs falls through to the wire body value.'
  - 'For Responses, `kwargs["messages"]` is the raw `input` (a string, chat-shaped dicts or item dicts), not a chat conversation, and `previous_response_id` and other surface-only keys must still not reach the shadow call.'
  - 'post_guardrail_kwargs overwrites `system` and `instructions` with null when the snapshot body lacks them, so a wire-body system prompt from before the guardrail cannot leak back in.'
  - 'The hosted web search check skips tools with `type: "function"` first, so the standard `litellm_web_search` function tool is replayable even though is_web_search_tool_responses matches it.'
  - 'Empty `{}` and "" param values are forwarded; only null and an empty array are dropped, and `web_search_options: {}` already counts as hosted search.'

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
