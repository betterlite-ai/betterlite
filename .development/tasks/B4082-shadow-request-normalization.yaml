dod:
  - text: >-
      surface_ops returns a row for exactly completion, acompletion, anthropic_messages, aresponses and
      responses, with wire_params false only for the two chat names, and None for any other call type,
      including an empty string and "embedding".
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      The chat row keeps model_parameters and sets messages to the object elements of kwargs.messages;
      a missing messages value, a string and an array of strings all give an empty messages list.
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      The Anthropic row takes system from kwargs.system before the wire body system, copies only the
      allowed wire body keys, ignores model_parameters, and returns the translated chat request (system
      prompt becomes the first system message); a kwargs.messages that is not an array of objects is a
      rejected shape.
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      The Responses row builds the chat request from kwargs.messages as the raw input plus the wire body
      keys of the optional Responses params, with instructions taken from kwargs before the wire body
      and mapped to a system message, and max_output_tokens mapped to max_tokens; keys outside the
      Responses param list (for example a made-up key) never reach the request.
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      request_has_hosted_web_search is true for a non-null web_search_options (including {}) and for a
      tool of type web_search or web_search_preview, and false for a function tool named litellm_web_search,
      for tools that is not an array, and for web_search_options null.
    proof: [web-search-gate-tests, shadow-requests-oracle]
  - text: >-
      request_mutating_guardrail_ran is false for no entries, for entries whose modes are all in the
      non-mutating set (modes given as one string or an array), and true for pre_call, for an unknown
      mode, for an entry without guardrail_mode, and for a non-string mode; non-object entries are
      skipped.
    proof: [guardrail-tests, shadow-requests-oracle]
  - text: >-
      request_guardrail_fingerprint is equal for two metadata values whose relevant entries match
      regardless of object key order, differs when a relevant entry changes, ignores a post_call-only
      entry, but changes when a logging_only entry is added, and is 64 lowercase hex characters.
    proof: [guardrail-tests, shadow-requests-oracle]
  - text: >-
      GuardrailRequestSnapshot::capture returns None when no mutating guardrail ran and Some otherwise;
      the stored body is an independent copy, so changing the original body afterward does not change
      the snapshot, and the body's litellm_parent_otel_span placeholder rules follow B2204.
    proof: [guardrail-tests, shadow-requests-oracle]
  - text: >-
      post_guardrail_kwargs returns None for a missing snapshot and for a snapshot whose fingerprint
      differs from the current metadata, and otherwise returns kwargs with messages from input
      (Responses) or messages (others), system, instructions and proxy_server_request.body taken from
      the snapshot, keeping every other kwargs key.
    proof: [guardrail-tests, shadow-requests-oracle]
  - text: >-
      judgeable_sample returns None for hosted web search in the wire body or in the translated request,
      for an empty conversation, for empty real text and for a chat_request error, and otherwise returns
      the messages, the forwardable params (model, messages, stream, stream_options and metadata dropped;
      null and [] dropped; {} and "" kept) and the real text.
    proof: [sample-tests, shadow-requests-oracle]
  - text: The oracle cases run the same inputs through LiteLLM and betterlite and agree.
    proof: [shadow-requests-oracle, helper-python]

checks:
  optional: [mutants]
  commands:
    - id: surface-tests
      why: the surface table or the per-surface request building tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::surfaces::/)'
    - id: web-search-gate-tests
      why: the hosted web search gate tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::web_search::/)'
    - id: guardrail-tests
      why: the guardrail mode, fingerprint, snapshot or post-guardrail kwargs tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::guardrails::/)'
    - id: sample-tests
      why: the judgeable sample tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::sample::/)'
    - id: helper-python
      why: the pinned Python adapter for the shadow request helper is absent or fails lint and type checks
      run: test -f tools/oracle/helpers/b4082.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4082.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: shadow-requests-oracle
      why: shadow request normalization or snapshot checks differ from pinned LiteLLM
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/shadow-requests)" && cargo build --locked -p betterlite-oracle && target/debug/betterlite-oracle tools/oracle/cases/helpers/shadow-requests

