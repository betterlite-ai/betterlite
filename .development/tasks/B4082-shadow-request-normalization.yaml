dod:
  - text: >-
      surface_ops returns a row for exactly completion, acompletion, anthropic_messages, aresponses and
      responses, with wire_params false only for the two chat names, and None for any other call type,
      including an empty string and "embedding".
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      The chat row keeps model_parameters and sets messages to the object elements of kwargs.messages;
      a missing messages value, a string and an array of strings all give an empty messages list.
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      The Anthropic row takes system from kwargs.system before the wire body system, copies only the
      allowed wire body keys, ignores model_parameters, and returns the translated chat request (system
      prompt becomes the first system message); a kwargs.messages that is not an array of objects is a
      rejected shape.
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      The Responses row builds the chat request from kwargs.messages as the raw input plus the wire body
      keys of the optional Responses params, with instructions taken from kwargs before the wire body
      and mapped to a system message, and max_output_tokens mapped to max_tokens; keys outside the
      Responses param list (for example a made-up key) never reach the request.
    proof: [surface-tests, shadow-requests-oracle]
  - text: >-
      request_has_hosted_web_search is true for a non-null web_search_options (including {}) and for a
      tool of type web_search or web_search_preview, and false for a function tool named litellm_web_search,
      for tools that is not an array, and for web_search_options null.
    proof: [web-search-gate-tests, shadow-requests-oracle]
  - text: >-
      post_guardrail_kwargs returns None for a missing snapshot and for a snapshot whose fingerprint
      differs from the current metadata, and otherwise returns kwargs with messages from input
      (Responses) or messages (others), system, instructions and proxy_server_request.body taken from
      the snapshot, keeping every other kwargs key.
    proof: [guardrail-tests, shadow-requests-oracle]
  - text: >-
      judgeable_sample returns None for hosted web search in the wire body or in the translated request,
      for an empty conversation, for empty real text and for a chat_request error, and otherwise returns
      the messages, the forwardable params (model, messages, stream, stream_options and metadata dropped;
      null and [] dropped; {} and "" kept) and the real text.
    proof: [sample-tests, shadow-requests-oracle]
  - text: The oracle cases run the same inputs through LiteLLM and betterlite and agree.
    proof: [shadow-requests-oracle, helper-python]

checks:
  optional: [mutants]
  commands:
    - id: surface-tests
      why: the surface table or the per-surface request building tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::surfaces::/)'
    - id: web-search-gate-tests
      why: the hosted web search gate tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::web_search::/)'
    - id: guardrail-tests
      why: the post-guardrail kwargs tests are missing or a stale snapshot is used or the rebuilt kwargs differ
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::guardrails::/)'
    - id: sample-tests
      why: the judgeable sample tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^shadow_requests::sample::/)'
    - id: helper-python
      why: the pinned Python adapter for the shadow request helper is absent or fails lint and type checks
      run: test -f tools/oracle/helpers/b4082.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4082.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: shadow-requests-oracle
      why: shadow request normalization or snapshot checks differ from pinned LiteLLM
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/shadow-requests)" && cargo build --locked -p betterlite-oracle && target/debug/betterlite-oracle tools/oracle/cases/helpers/shadow-requests

oracle_cases:
  - tools/oracle/cases/helpers/shadow-requests/chat-messages-filtered.yaml
  - tools/oracle/cases/helpers/shadow-requests/chat-params-forwarded.yaml
  - tools/oracle/cases/helpers/shadow-requests/anthropic-system-from-wire-body.yaml
  - tools/oracle/cases/helpers/shadow-requests/anthropic-system-from-kwargs.yaml
  - tools/oracle/cases/helpers/shadow-requests/responses-input-and-instructions.yaml
  - tools/oracle/cases/helpers/shadow-requests/responses-max-output-tokens.yaml
  - tools/oracle/cases/helpers/shadow-requests/unknown-call-type.yaml
  - tools/oracle/cases/helpers/shadow-requests/hosted-web-search-skipped.yaml
  - tools/oracle/cases/helpers/shadow-requests/function-web-search-tool-sampled.yaml
  - tools/oracle/cases/helpers/shadow-requests/empty-reply-skipped.yaml
  - tools/oracle/cases/helpers/shadow-requests/snapshot-stale-fingerprint.yaml
  - tools/oracle/cases/helpers/shadow-requests/snapshot-replaces-request-body.yaml

deviations:
  - what: Request shapes are checked as serde_json values, so a request that is not an object, or a messages value that is not an array of objects, is a rejected shape (sample skipped) before any translation.
    why: Python's lenient Mapping and tuple adapters accept more container types; JSON input only has objects and arrays, and a rejected shape is skipped in both.
  - what: LiteLLM's blanket `except Exception` around request normalization becomes the typed ShadowRequestError, and any such error gives None with a debug log.
    why: Same skip behavior without catching panics; the cause stays visible in the log line.

out_of_scope:
  - "ShadowEvalLogger.async_log_success_event, which calls surface_ops, picks post_guardrail_kwargs for wire_params surfaces and calls judgeable_sample: B118. _sampled_jobs: B118."
  - "The final-text readers (_chat_final_text, _responses_final_text), routing decision readers and result records: B4081."
  - "Active jobs, _direction_admits, _scope_admits, _sample_hits and the jobs cache: B4083."
  - "Shadow call and blind judge execution (_call_router_shadow, _call_judge, the judge prompt and PairwiseVerdict): B4084."
  - "Budget gates and the per-arm pipeline (_run_shadow_eval, _run_shadow_arm): B4085."
  - "_NON_MUTATING_GUARDRAIL_MODES, _guardrail_is_non_mutating, _request_mutating_guardrail_ran, request_guardrail_fingerprint and GuardrailRequestSnapshot.capture (L305-L362): B9999. post_guardrail_kwargs calls its fingerprint."
  - "Calling GuardrailRequestSnapshot.capture after the guardrails ran and storing the result on the logging object, cleared first (litellm_pre_call_utils.py L1970-L1990): B1105, which also adds that snapshot field to LoggingState (litellm_logging.py L723). Passing the stored snapshot to the shadow logger (litellm_logging.py L3478-L3500) is B250's SuccessRequest.guardrail_snapshot, filled by B069 for proxied calls."
  - "translate_anthropic_to_openai (B967), translatable_anthropic_params (B1117), transform_responses_api_request_to_chat_completion_request (B908) and is_web_search_tool_responses (B4111): used here, not rebuilt."

pitfalls:
  - 'The Anthropic row ignores `model_parameters` on purpose, and `system` falls back from kwargs to the wire body with an `or`, so an empty string in kwargs falls through to the wire body value.'
  - 'For Responses, `kwargs["messages"]` is the raw `input` (a string, chat-shaped dicts or item dicts), not a chat conversation, and `previous_response_id` and other surface-only keys must still not reach the shadow call.'
  - 'post_guardrail_kwargs overwrites `system` and `instructions` with null when the snapshot body lacks them, so a wire-body system prompt from before the guardrail cannot leak back in.'
  - 'The hosted web search check skips tools with `type: "function"` first, so the standard `litellm_web_search` function tool is replayable even though is_web_search_tool_responses matches it.'
  - 'Empty `{}` and "" param values are forwarded; only null and an empty array are dropped, and `web_search_options: {}` already counts as hosted search.'

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
