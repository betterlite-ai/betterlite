id: B4082
title: Normalize shadow requests and verify guardrail snapshots
description: >-
  Build `betterlite-core::shadow_requests`, the part of the shadow eval logger that turns one logged
  request into the chat-shaped conversation a shadow arm replays, and that decides whether a request
  that a guardrail rewrote may be replayed at all. It has four parts. It adds no config key and no
  environment variable. Add `betterlite-context` and `betterlite-websearch` as normal dependencies of
  betterlite-core (core only has context as a dev-dependency today, and neither crate depends on core,
  so there is no cycle).

  Part 1, the surface table. `SurfaceOps` has three fields: a `chat_request` function, a `final_text`
  function and a `wire_params` bool. `surface_ops(call_type: &str) -> Option<&'static SurfaceOps>`
  is the sampling allowlist and returns None for anything but these five call types: "completion" and
  "acompletion" (chat), "anthropic_messages" (Anthropic Messages) and "aresponses" and "responses"
  (Responses API). An unknown call type means "do not sample". The chat row uses B4081's chat text
  reader and has `wire_params` false. The Anthropic row uses the chat text reader and has `wire_params`
  true. The Responses row uses B4081's Responses text reader and has `wire_params` true. Keep the
  Responses row distinguishable from the Anthropic row (a `Surface` enum on the struct), because the
  snapshot code in part 3 reads `input` for one and `messages` for the other.

  The inputs are plain JSON objects (`serde_json::Map<String, Value>`): `kwargs` (the logger's call
  details), `model_parameters` (the logged generation params) and the response value. Each
  `chat_request` function returns a chat request object or an error. The chat row returns
  `model_parameters` plus a `messages` key, where `messages` is `kwargs["messages"]` filtered down to
  its object elements (a missing or non-array value gives an empty list). The
  `proxy_wire_body(kwargs)` helper is `kwargs.litellm_params.proxy_server_request.body` when each step is
  an object, otherwise an empty object. The Anthropic row builds a request from the wire body keys that
  are in (B1117's `translatable_anthropic_params`, which is messages, metadata, system, tool_choice,
  tools, thinking, output_format, output_config, stop_sequences, plus max_tokens, temperature, top_p,
  top_k and reasoning_effort) minus messages and system. Then it sets `model` to the string of
  `kwargs.model` ("" when absent or falsy), `messages` to `kwargs.messages` checked as an array of objects
  (null or missing counts as an empty array, anything else that is not an array of objects is an error),
  and `system` to `kwargs.system` or else the wire body `system` when that is not null. It then calls
  B967's `translate_anthropic_to_openai` and uses only the request half of the result. The Responses row
  reads `instructions` the same way (`kwargs.instructions` or else the wire body's, when not null), builds a
  Responses request from the wire body keys that are in the field list of `ResponsesAPIOptionalRequestParams`
  (see the references: include, instructions, max_output_tokens, metadata, parallel_tool_calls,
  previous_response_id, reasoning, store, background, stream, temperature, text, tool_choice, tools, top_p,
  truncation, user, service_tier, safety_identifier, prompt, max_tool_calls, prompt_cache_key,
  prompt_cache_retention, prompt_cache_options, stream_options, top_logprobs, partial_images,
  context_management) with `instructions` set on top, and calls B908's
  `transform_responses_api_request_to_chat_completion_request` with model = `kwargs.model` as a string,
  input = `kwargs.messages` (LiteLLM stores the raw Responses `input` there), no provider and no stream
  override. The result must be an object. Neither surface reads the logged `model_parameters`, because the
  logged optional params switch dialect per provider path.

  Part 2, the hosted web search gate. `request_has_hosted_web_search(request)` is true when
  `web_search_options` is present and not null (an empty object counts), or when `tools` is an array that
  holds an object tool whose `type` is not "function" and for which B4111's `is_web_search_tool_responses`
  is true. A tool with `type: "function"` is never hosted search, even the `litellm_web_search` function
  tool. A `tools` value that is not an array gives false.

  Part 3, the guardrail snapshot. A guardrail entry is the object under
  `metadata.standard_logging_guardrail_information` (an array; a non-array gives no entries and
  non-object entries are skipped). The entry's `guardrail_mode` is one string or an array of strings.
  `guardrail_is_non_mutating(entry, allowed_modes)` is true when every mode is a string in the allowed
  set; a missing, null or non-string mode makes it false, and an empty array makes it true. The shared
  non-mutating set is during_call, post_call, logging_only, during_mcp_call, post_mcp_call and
  realtime_input_transcription. `request_mutating_guardrail_ran(metadata)` is true when any entry is not
  non-mutating under that set, so unknown modes such as pre_call and pre_mcp_call, and a missing mode,
  count as mutating. `request_guardrail_fingerprint(metadata)` keeps the entries that are not
  non-mutating under the set without logging_only (so a logging_only entry still counts here), serializes
  that list as JSON with sorted object keys and returns the SHA-256 hex digest, or None when it cannot
  serialize. Use the sha2 and serde_json already in the workspace; sort keys by serializing through a
  sorted map. Values with no JSON form do not exist in a `serde_json::Value`, so the None branch is kept
  only for a serialization error from serde_json.

  `GuardrailRequestSnapshot` is an immutable struct with `body` and `fingerprint`.
  `GuardrailRequestSnapshot::capture(body, metadata) -> Option<Self>` returns None when no
  request-mutating guardrail ran or the fingerprint is None. Otherwise it stores a copy of the body made
  with B2204's `independent_snapshot`, so later changes to the request never reach the snapshot.
  `post_guardrail_kwargs(kwargs, request_metadata, surface, snapshot) -> Option<Map>` returns None when
  the snapshot is missing or its fingerprint differs from the fingerprint of the current metadata (the
  guardrail history changed after capture, so the snapshot is stale). Otherwise it returns a copy of
  `kwargs` with `messages` set to the snapshot body's `input` for the Responses surface and `messages`
  for the others, `system` and `instructions` set from the body (null when the body lacks them), and
  `litellm_params.proxy_server_request.body` replaced by the snapshot body (other `litellm_params` and
  `proxy_server_request` keys stay).

  Part 4, the judgeable sample. `judgeable_sample(surface, kwargs, model_parameters, response)` returns
  Some((messages, params, real_text)) or None. In order: return None when hosted web search is present in
  the wire body (for `wire_params` surfaces) or in `model_parameters` (for the chat surface); run the
  surface's `chat_request`; return None when it errors or when the resulting request has hosted web
  search; take its `messages` as an array whose items are objects (items that are typed objects are
  dumped without null fields first; a non-array or any non-object item is an error, which also gives
  None, and a failure is logged at debug level only); compute `real_text` with the surface's final text
  function; return None when `messages` is empty or `real_text` is empty. `params` is every key of the
  request except model, messages, stream, stream_options and metadata, dropping values that are null or
  an empty array (an empty object or empty string stays). A rejected shape is skipped, never an error to
  the caller.

  The hook that calls these functions (`async_log_success_event`) and the place that stores the snapshot
  on the logging object are not part of this task; see out_of_scope. Public items need real types and a
  `ShadowRequestError` enum for the failures above; no `unwrap`, no `expect`.

