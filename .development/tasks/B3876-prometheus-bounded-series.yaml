id: B3876
title: Prometheus bounded series and counter emission
description: >-
  Build the series tracker with per-metric TTL and cardinality limiting that stores
  labelsets in LRU order, evicting only after recording the sample. Implement counter
  emission that calls the tracker after incrementing, and end-user metric cardinality
  capping that reads config keys and decides whether to track. Preserve failed-removal
  behavior, strict TTL expiry, nonpositive max_series meaning unlimited, and lazy
  cleanup only when TTL is enabled and the cleanup interval expires.

  The BoundedPrometheusSeriesTracker class stores series in OrderedDict keyed by
  label tuples, tracking the last-seen monotonic time. The track_series() method
  records the sample, expires TTL-stale series by calling metric.remove(), and evicts
  the oldest series when cardinality exceeds max_series, stopping silently if removal
  fails. The remove_series() method accepts a single labelset and returns true when
  the child is gone (removed or already absent). The _remove_metric_child static
  method calls metric.remove() and returns true on success or KeyError, and false
  on unexpected AttributeError/ValueError so the tracker retries later. An RLock
  guards all mutations.

  The _inc_labeled_counter method in PrometheusLogger calls prometheus_label_factory
  to build labels, increments the counter with those labels, and then calls
  _track_end_user_metric_series(). The _track_end_user_metric_series() method checks
  for the end_user label and a non-None end_user value, reads three config keys
  (prometheus_end_user_metrics_max_series_per_metric, prometheus_end_user_metrics_ttl_seconds,
  prometheus_end_user_metrics_cleanup_interval_seconds) with defaults 10000, 3600 and 60
  respectively, and delegates to tracker.track_series() only when at least one limit is
  configured.

