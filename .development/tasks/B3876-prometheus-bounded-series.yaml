dod:
  - text: BoundedPrometheusSeriesTracker stores series in OrderedDict keyed by label tuples, tracking monotonic timestamps, with an RLock protecting mutations.
    proof: [bounded-series-tracker-tests]
  - text: track_series records the current sample in its child before evicting stale or excess series, and returns early if no limits are configured.
    proof: [bounded-series-tracker-tests]
  - text: TTL cleanup runs only when the cleanup_interval has expired or cleanup_interval <= 0, and only when ttl_seconds is not None.
    proof: [bounded-series-tracker-tests]
  - text: Series older than ttl_seconds are identified by their last-seen monotonic time and removed in one pass.
    proof: [bounded-series-tracker-tests]
  - text: Cardinality eviction removes the oldest series (first in OrderedDict) when len(series) > max_series, and stops silently if removal fails.
    proof: [bounded-series-tracker-tests]
  - text: remove_series() calls _remove_metric_child and returns true when the child is gone (removed or already absent), false when removal raised an error.
    proof: [bounded-series-tracker-tests]
  - text: _remove_metric_child catches KeyError and returns true, catches AttributeError and ValueError and returns false, propagates other exceptions.
    proof: [bounded-series-tracker-tests]
  - text: Nonpositive max_series is treated as unlimited, so max_series <= 0 does not evict any series.
    proof: [bounded-series-tracker-tests]
  - text: _inc_labeled_counter builds labels with prometheus_label_factory, increments the counter, and calls _track_end_user_metric_series afterwards.
    proof: [counter-emission-tests]
  - text: _track_end_user_metric_series checks for end_user in the metric's label list and a non-None end_user value, then reads config keys and calls tracker.track_series.
    proof: [counter-emission-tests]
  - text: _track_end_user_metric_series returns early if end_user is None, the metric does not include the end_user label, or all three config limits are None.
    proof: [counter-emission-tests]
  - text: The three config keys default to 10000, 3600, and 60 seconds respectively, and all defaults are honored when keys are absent.
    proof: [config-defaults-tests]

