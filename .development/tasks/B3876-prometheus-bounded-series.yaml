deviations:
  - what: >-
      When metric.remove() raises an exception other than KeyError, the series is not
      removed from the tracker's state, and the next eviction attempt retries it.
      This preserves the prometheus-client behavior.
    why: >-
      Failed removals must not silently drop tracking state, since the series likely
      still exists and will accumulate stale data until the next cleanup opportunity.
  - what: >-
      Cleanup interval of 0 or negative is treated as "always run", triggering a cleanup
      check on every track_series call.
    why: >-
      The source treats nonpositive cleanup_interval as "no interval"; betterlite
      inverts this to mean "check every time", matching the intent.

out_of_scope:
  - Prometheus client library integration; this task only calls the remove() protocol method.
  - Dispatcher callbacks that call _track_end_user_metric_series; B111 provides those.
  - Configuration validation beyond checking that the keys exist in the config section.
  - Config loading and parsing; B002 supplies the loader framework for this section.

pitfalls:
  - The sample is recorded in prometheus-client's internal child map before track_series
    is called. If the child is evicted before the next scrape, accumulated deltas since
    the last scrape are lost. This is inherent to any cardinality cap and is not a bug.
  - _remove_metric_child is a static method because it is called from both track_series
    (during eviction) and remove_series (direct removal). Keep the shared signature.
  - RLock is reentrant so _remove_metric_series can call _remove_metric_child within
    the lock without deadlock. Do not switch to a non-reentrant lock.
  - OrderedDict.move_to_end() is used to update the timestamp but also move the key to
    the end, making the first iteration cheap and deterministic for FIFO eviction.
  - time.monotonic() returns seconds as a float. The comparison `now - last_seen > ttl_seconds`
    preserves fractional-second precision. Do not convert to integers.

