id: B9951
title: Wheel response objects on pydantic BaseModel
description: >-
  The response classes in `crates/betterlite-python/python/betterlite/types/utils/` (B5657 and B5658) run on a hand-made
  field holder. `values.py` checks values against annotations with `get_origin`, `get_args` and eight casts, and `base.py`
  gives `ResponseObject` pydantic's surface by hand, with `RootModel`, validators, `Base64Str` and `AwareDatetime` rebuilt
  next to it. The reason was a planning note that pydantic is too heavy for the wheel. Max decided on 2026-11-13 that the
  wheel depends on pydantic and that these classes are pydantic models, as LiteLLM's are. Rebuild them on
  `pydantic.BaseModel`.


  Add `pydantic==2.14.1` to the dependencies in `crates/betterlite-python/pyproject.toml`. That is the version
  tools/oracle/litellm/uv.lock pins, so the test environment, which installs the wheel next to LiteLLM, keeps one pydantic.


  `ResponseObject` becomes a `BaseModel` with `extra="allow"`, so a provider's extra fields stay attributes and reach
  `model_dump`, as on LiteLLM's `OpenAIObject`. Give it the item access, `get`, `__contains__`, `json` and `dict` that
  LiteLLM's classes define, and `SafeAttributeModel.__delattr__` (types/utils.py L126-L146), where deleting a missing
  attribute does nothing. Each class keeps its fields, defaults and the `__init__` logic B5657 and B5658 ported, now
  written the way LiteLLM writes it: build the parameters, call `super().__init__(**params)`, then set private attributes
  and delete the fields LiteLLM deletes. Hidden params, response headers and `_response_ms` become `PrivateAttr`s. Response
  classes still default `model_dump` to `exclude_unset=True` (L2096-L2100).


  Delete `values.py`. `betterlite.types.utils` keeps exporting `JsonValue`, `ValidationError`, `field_validator`,
  `model_validator`, `RootModel`, `Base64Str` and `AwareDatetime`, now pydantic's own, because B7920 to B7954 and other
  open tasks import them from there. `StoredValue` and `ModelObject` go; a field gets the type LiteLLM gives it, or
  `JsonValue` where LiteLLM's type is `Any` or an openai class the wheel doesn't have.


  Read every entry in docs/deviations/B5657.yaml and docs/deviations/B5658.yaml. Delete each one the pydantic base makes
  untrue (no BaseModel, no `model_validate`, `model_fields` or `model_json_schema`, the partial value check, the error
  wording, the flat include and exclude selectors) and keep the rest. The kept fixes of LiteLLM bugs, such as
  `ModelResponse` keeping the hidden params it was built with, stay fixed. List a new difference in
  docs/deviations/B9951.yaml.


  Take every `crates/betterlite-python/` path off the `ignores` lists of
  .ast-grep/python/rules/no-match-wildcard.yml and .ast-grep/python/rules/no-own-json-alias.yml, and fix what the two rules
  then find: the bare-name catch-alls in the class modules and the test files, and the `Json` alias in
  tests/test_package.py.


  The existing tests compare each class with LiteLLM's through `model_dump()` and keep passing. A test that pinned a
  deviation this task deletes now checks LiteLLM's behavior instead. Add tests named `pydantic_isinstance`,
  `pydantic_model_validate`, `pydantic_model_fields` and `pydantic_json_schema`: a `ModelResponse`, a `Message` and an
  `EmbeddingResponse` are `pydantic.BaseModel` instances, `model_validate` of a dump gives an equal object, `model_fields`
  holds the same names as on LiteLLM's class, and `model_json_schema()` returns a schema whose properties are those names.
