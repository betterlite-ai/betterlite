dod:
- text: The wheel depends on pydantic 2.14.1, and values.py is gone.
  proof: [dependency]
- text: The chat classes give the same attribute and item access, dumps, tool calls, choices and usage as LiteLLM.
  proof: [chat-objects]
- text: The embedding, text, image, transcription and smaller classes give the same values as LiteLLM.
  proof: [other-objects]
- text: The package imports and its version, cost map and model helpers still work.
  proof: [package]
- text: Response objects are pydantic models with LiteLLM's `model_validate`, `model_fields` and `model_json_schema`.
  proof: [pydantic-models]
- text: No wheel file is on either ast-grep ignore list, and the wheel's types package has no cast, type ignore or pyright ignore.
  proof: [ignore-lists, no-suppressions, hooks]
- text: The wheel passes ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: dependency
    why: The wheel still carries its own validator or pins another pydantic than the test environment.
    run: test ! -e crates/betterlite-python/python/betterlite/types/utils/values.py && grep -q -F '"pydantic==2.14.1"' crates/betterlite-python/pyproject.toml
  - id: chat-objects
    why: A chat response differs from LiteLLM's after the move.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py
  - id: other-objects
    why: An embedding, text, image, transcription or small response differs from LiteLLM's after the move.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_other_response_objects.py
  - id: package
    why: The package no longer imports or its module helpers broke.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_package.py
  - id: pydantic-models
    why: A caller's isinstance check, model_validate or schema call fails on betterlite's objects.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_chat_response_objects.py crates/betterlite-python/tests/test_other_response_objects.py -k pydantic_
  - id: ignore-lists
    why: A wheel file still skips the catch-all or alias rule.
    run: '! grep -q -F crates/betterlite-python/ .ast-grep/python/rules/no-match-wildcard.yml .ast-grep/python/rules/no-own-json-alias.yml'
  - id: no-suppressions
    why: The types package still works around its own types with casts or ignores.
    run: '! grep -r -n -E "(^|[^[:alnum:]_])cast\(|#[[:space:]]*(type:[[:space:]]*ignore|pyright:[[:space:]]*ignore)" crates/betterlite-python/python/betterlite/types'
  - id: python-lint
    why: A loose type in the base spreads to every response.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations: []
out_of_scope:
- The Responses API types are B7840, and the typed parts of litellm/types/** are B7920 to B7954; they wait for this task and build on its base.
- The Rust side of the wheel in crates/betterlite-python/src does not change.
- The other open Python tasks that say the wheel has no pydantic get their text fixed by the architect, not here.
pitfalls:
- A pydantic model rejects a plain attribute set before `super().__init__()`. LiteLLM builds a params dict, calls `super().__init__(**params)` and sets private attributes after it; follow that order.
- mypy reads pydantic models through pydantic's plugin with `init_typed` and `init_forbid_extra` (tools/oracle/litellm/mypy.toml). A class with LiteLLM's custom `__init__` keeps that signature, so type its parameters instead of taking untyped keyword arguments.
- 'pydantic stores extra fields in `__pydantic_extra__`, and `model_fields_set` decides what `exclude_unset` keeps. A field LiteLLM deletes when None (`Message.audio`, `Choices.logprobs`) has to leave both, as `delattr` on a LiteLLM object does.'
- The wheel's pin must equal uv.lock's pydantic. A different pin makes uv install a second pydantic in the `--with` layer, and the LiteLLM objects the tests compare with then come from another version.
review_level: standard
budget:
  max_changed_lines: 3000
  max_new_expects: 0
