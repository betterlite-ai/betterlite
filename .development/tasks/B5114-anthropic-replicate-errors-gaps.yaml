id: B5114
title: Pin the Anthropic and Replicate status pairs and predicate order
description: >-
  B238 built the Anthropic and Replicate error classifiers in
  crates/betterlite-error/src/anthropic_replicate_errors/anthropic.rs and replicate.rs. An Opus review
  after merge found five places where the classifier matches LiteLLM today but no test or oracle case
  fails once it stops matching. The code stays as it is. This task adds rstest rows in the two
  existing tests.rs files and helper oracle cases in tools/oracle/cases/helpers/anthropic-replicate-errors/,
  called through the existing anthropic_replicate_errors helper operation, so each behavior has a test
  that breaks when the behavior does.


  Gap one. LiteLLM's _map_anthropic_exception raises BadRequestError for status_code 400 or 413 once
  no text predicate matched, and passes no response, so the status is 400
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L586-L591).
  classify_by_status in anthropic.rs has the `400 | 413` arm. But the status_413 row in
  anthropic/tests.rs and the branch-586.yaml case both send 413, so neither fails when 400 leaves the
  arm, and a plain Anthropic 400 would then map to no class at all. Both stay as they are and pin the
  413 half. A new status_400 row ("generic failure", Some(400), Some("bad_request"), Some(400)) in
  anthropic_replicate_errors_behavior_tests_behavior and a new anthropic-status-400.yaml case pin the
  400 half.


  Gap two. The same status chain raises InternalServerError for 500 or 529
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L610-L616).
  The status_529 row and branch-610.yaml send only 529, so dropping 500 from the `500 | 529` arm stays
  green while an Anthropic 500 would map to no class instead of internal_server with status 500. They
  stay as the 529 half. A new status_500 row ("generic failure", Some(500), Some("internal_server"),
  Some(500)) and a new anthropic-status-500.yaml case pin the 500 half.


  Gap three. _map_replicate_exception raises BadRequestError for status_code 400 or 413 and passes the
  response
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L686-L692).
  The status_413 row in replicate/tests.rs and branch-686.yaml send only 413, so dropping 400 from the
  `400 | 413` arm in replicate.rs stays green while a Replicate 400 would fall through to the APIError
  at the end with status 500. They stay as the 413 half. A new status_400 row ("generic failure",
  "APIError", Some(400), "bad_request", Some(400)) in that file's
  anthropic_replicate_errors_behavior_tests_behavior and a new replicate-status-400.yaml case pin the
  400 half.


  Gap four. LiteLLM checks the Anthropic error text in a fixed order and raises on the first match:
  the context window texts ("prompt is too long", "prompt: length" or the context window checker),
  then "overloaded_error" or "Overloaded", then "Invalid API Key", then "content filtering policy",
  then "Client error '400 Bad Request'"
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L537-L570).
  Every text row and case on main (branch-537 to branch-565) sends one predicate's text alone, and
  text_predicate_wins_over_a_competing_status_code and competing-message-status.yaml only set a text
  against a status. So any reorder of classify_by_predicate in anthropic.rs stays green, and a real
  "prompt is too long ... Overloaded" error would then answer internal_server 500 instead of
  context_window_exceeded 400, and the router's context window fallbacks would stop firing. A new
  rstest function earlier_text_predicate_wins in anthropic/tests.rs sends a text that matches two
  neighboring predicates, with status_code None, and asserts the family of the earlier one. It has four
  rows: prompt_too_long_before_overloaded ("prompt is too long: 205000 tokens > 200000 maximum;
  Overloaded", context_window_exceeded), overloaded_before_invalid_api_key ("Overloaded: Invalid API
  Key provided", internal_server), invalid_api_key_before_content_filtering ("Invalid API Key
  provided; blocked by the content filtering policy", authentication) and
  content_filtering_before_client_error_400 ("blocked by the content filtering policy: Client error
  '400 Bad Request'", content_policy_violation). The review asked for three of these pairs. The
  overloaded and Invalid API Key pair is added because with three pairs, swapping those two checks
  still stays green; four neighboring pairs pin the whole order of five. Each row gets a case of the
  same name in the case folder, prefixed anthropic-.


  Gap five. LiteLLM checks the Replicate predicates in this order and raises on the first match:
  "Incorrect authentication token", then "input is too long", then exception_type == "ModelError",
  then "Request was throttled"
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L650-L677).
  branch-650 to branch-671 each send one predicate alone, and the Replicate
  text_predicate_wins_over_a_competing_status_code only sets the throttled text against status 401. So
  any reorder of classify_by_predicate in replicate.rs stays green. A ModelError whose text says "input
  is too long" would then answer bad_request instead of context_window_exceeded, and a ModelError
  saying "Request was throttled" would answer rate_limit 429 instead of bad_request 400. A new rstest
  function earlier_predicate_wins in replicate/tests.rs sends status_code None and asserts the earlier
  family, with three rows: auth_token_before_input_too_long ("Incorrect authentication token; input is
  too long", "APIError", authentication), input_too_long_before_model_error ("input is too long for
  this model", "ModelError", context_window_exceeded) and model_error_before_throttled ("Request was
  throttled by replicate", "ModelError", bad_request). Each row gets a case of the same name, prefixed
  replicate-.


  The new rows pass against today's anthropic.rs and replicate.rs, since that code already matches
  LiteLLM. Each check below fails on today's main because its rows don't exist yet, and the oracle
  check fails because its case files don't. Before keeping a row, prove it can fail: change
  anthropic.rs or replicate.rs locally (drop the 400 or 500 alternative, or swap the two checks the row
  sets against each other), watch the row fail for that reason, then restore the file with git
  checkout. Neither source file is part of the commit.
