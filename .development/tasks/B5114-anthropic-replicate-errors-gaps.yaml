  - crates/betterlite-error/src/anthropic_replicate_errors/anthropic/tests.rs
  - crates/betterlite-error/src/anthropic_replicate_errors/replicate/tests.rs
  - tools/oracle/cases/helpers/anthropic-replicate-errors/anthropic-status-400.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/anthropic-status-500.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/replicate-status-400.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/anthropic-prompt-too-long-before-overloaded.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/anthropic-overloaded-before-invalid-api-key.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/anthropic-invalid-api-key-before-content-filtering.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/anthropic-content-filtering-before-client-error-400.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/replicate-auth-token-before-input-too-long.yaml
  - tools/oracle/cases/helpers/anthropic-replicate-errors/replicate-input-too-long-before-model-error.yaml
