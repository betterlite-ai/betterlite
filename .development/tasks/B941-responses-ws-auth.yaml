id: B941
title: Responses ws auth
description: >-
  Implement the Responses WebSocket gateway in
  crates/betterlite-server/src/api/responses_ws_auth.rs, its typed records in
  crates/betterlite-core/src/api/responses_ws_auth.rs, and the matching config
  loader and oracle fixtures. Register the handler exactly once at WEBSOCKET
  /v1/responses and WEBSOCKET /responses; there is no /openai/v1/responses
  decorator at the LiteLLM pin. Authorization: Bearer sk-fixed, with the
  fixed test credential accepted by B756, completes a WebSocket handshake with
  HTTP status 101. The dependency-owned no-credential
  input produces pre-accept HTTP 403 detail="No API key provided" and close
  code 1008; Authorization: Basic wrong-format produces pre-accept HTTP 403
  detail="Invalid Authorization header format" and close code 1008. Those
  dependency responses have no WebSocket JSON type, param, or code. Exercise
  them through the booted gateway; do not copy B756's Authorization, api-key,
  or openai-insecure-api-key.<token> extraction.

  After the handshake, wait at most 30 seconds for one text frame. A timeout
  sends no frame and closes with 1008 reason="Timed out waiting for first
  message". A WebSocketDisconnect returns without sending a frame or a
  second close. Any other receive exception logs exactly "Responses WebSocket
  error reading first message" and closes 1011 reason="Internal server error"
  without sending a frame. Decode the received text at the owned decoder
  boundary. For input
  text {, send exactly one JSON text frame with outer type="error", nested
  error.type="invalid_request_error" and nested error.message="First message
  is not valid JSON.", then close 1008 reason="Invalid JSON in first message".
  For input 1, input [], or input {"type":"response.done"}, send the same
  outer and nested type values with message="First message must be a
  response.create JSON object.", then close 1008 reason="Invalid first
  message".

  The endpoint's query parameter is model, its default is None, and its API
  description is "The model to use for the responses WebSocket session."
  Resolve a
  non-empty ?model=gpt-4o before the frame; with ?model= and frame
  {"type":"response.create","model":"frame-model"}, resolve frame-model.
  With no non-empty query value, a truthy nested response.model wins over a
  truthy top-level model: the frame
  {"type":"response.create","model":"top","response":{"model":"nested"}}
  resolves nested, while a nested model of null or "" falls back to top. A non-object response value such as
  response=1 or response=[] is ignored and the top-level model is used; a non-object first event has no model.
  {"type":"response.create","model":"gpt-4o"} resolves gpt-4o and the
  complete original frame text, including whitespace and extra fields, is
  retained for the Responses request. If neither query nor frame supplies a
  truthy model, send outer type="error", nested type="invalid_request_error"
  and exact message="No model provided. Supply ?model=<model> in the URL or
  include 'model' in the first response.create event.", then close 1008
  reason="No model provided". Query model skips only the first-frame model
  access check; it does not skip JSON or response.create validation.

  The routing-hint record has input default None, previous_response_id default
  None, recursive response default None, and ConfigDict extra="ignore" and
  frozen=true. From a valid frame, retain only input and
  previous_response_id. For top-level input="top", previous_response_id=
  "resp_top" and nested response input="nested", previous_response_id=
  "resp_nested", pass nested and resp_nested. A nested null or absent field
  falls back to its top-level value; absent or null values are omitted from
  the route data. Ignore an extra key named extra="discard-me". If
  model_validate_json rejects the routing record, for example input=7 or
  previous_response_id=9, pass no hints and do not emit a second error frame
  after response.create validation.

  First-frame model access runs only if query model is absent, master_key is
  present (for example master_key="sk-master"), or one of general_settings.enable_jwt_auth,
  general_settings.enable_oauth2_auth, and
  general_settings.enable_oauth2_proxy_auth is true. All three mode keys
  default false. When user_custom_auth is present,
  general_settings.custom_auth_run_common_checks defaults false and skips
  this access check; true runs it. Cases cover absent master_key plus all
  flags false (skip), master_key="sk-master" alone (run), each mode flag true
  (run), custom auth plus custom_auth_run_common_checks=false (skip), and
  custom auth plus custom_auth_run_common_checks=true (run). The helper uses
  route=request.scope["path"] when non-empty and route="/v1/responses" when
  the scope path is absent or empty. This task reads no environment
  variable; B002 supplies typed settings. An exception from the access or
  common-check call sends one frame with outer type="error", nested
  error.type="invalid_request_error" and error.message=str(exception), with
  no status, param, or code field, then closes 1008
  reason="Pre-call error". If send_text itself raises, still close with that
  code and reason. The pre-call log message is "Responses WebSocket pre-call
  error".

  Before common processing, construct the synthetic Request with scope type
  "http", method "POST", path "/v1/responses", the WebSocket scope headers,
  and request._url equal to websocket.url. Its body is the UTF-8 JSON bytes
  produced from {"model": "gpt-4o"}, including the json.dumps space after the
  colon. Call common_processing_pre_call_logic before route_request, pass
  route_type="_aresponses_websocket", resolved model, original first_message,
  user_api_key_dict and only non-null routing hints. The route data starts with
  model, websocket and first_message, then includes user_api_key_dict and the
  two hint keys. Provider execution remains with B943/B945 through the mock
  provider.

  For a raised exception, _responses_ws_failure_frame reads status_code only
  when it is an integer other than bool: status_code=429 serializes status
  429 and nested type="rate_limit_exceeded"; status_code=400 and 499
  serialize nested type="invalid_request_error"; status_code=422 also maps to
  nested type="invalid_request_error", including the default
  BudgetExceededError value litellm.budget_exceeded_status_code=422;
  status_code=500, 503, a missing attribute, status_code="429", and
  status_code=True serialize status 500 and nested type="server_error". Other
  valid integer statuses such as 300 and 600 retain status 300 or 600 and use
  nested type="server_error". Every case has outer type="error",
  nested message=str(exception), and no param or code field are present. The
  failure text is sent before the failure hook, then the socket closes with
  1011 reason="Internal server error". The raised-route log message is
  "Responses WebSocket error". If route_request returns an Exception
  value instead of raising it, run the failure hook and return with no failure
  frame and no close: this is the warn-and-drop path. The owned endpoints.py
  range performs no database write; database/cache work in auth, common
  processing, hooks, and providers belongs to the owners listed below.

  Use typed constructors with injected clock, repositories, transports,
  logger/failure-hook seam and settings. Reuse B1087 ApiLimits and B002's YAML
  decoder. The production byte entry point is
  betterlite-server::api::responses_ws_auth::decode_responses_ws_auth(bytes:
  &[u8], limits: &ApiLimits); invoke it at the first-frame boundary and from a
  cargo-fuzz target with replay seeds. It must enforce
  ApiLimits.max_json_bytes before JSON allocation; that bounded-input behavior
  is the deliberate deviation below.

  Add adjacent tests.rs functions model_in_first_frame,
  nested_model_precedence, missing_model_close, malformed_first_frame,
  wrong_first_frame_type, query_model_skips_first_auth, first_frame_timeout,
  first_receive_disconnect, first_receive_internal_error,
  route_hints_retained, model_access_gates, precall_error_frame,
  subprotocol_selection, synthetic_request_order, failure_frame_statuses,
  returned_failure_drop, route_aliases, auth_missing, auth_invalid and
  loads_settings under api::responses_ws_auth::tests, plus replays_corpus.
  Assert exact frame JSON fields, absent fields, status and close codes,
  close reasons, handshake status, selected protocol, hook order, synthetic
  request fields, route_type and provider request. B901 gateway transcripts
  must exercise both route aliases and the mock provider; compare handshake
  status, protocol, direction/order, text, and close code/reason. Do not call
  a WebSocket route from a helper oracle.

  The whole owned callables are _read_ws_model_from_first_frame
  (endpoints.py:1316-1384), _extract_model_from_first_ws_event
  (1387-1396), _ResponseCreateRoutingHints (1399-1405),
  _routing_hints_from_first_ws_frame (1407-1419),
  _responses_ws_failure_frame (1422-1428),
  _enforce_responses_ws_first_frame_model_auth (1431-1471), and
  responses_websocket_endpoint (1474-1620). The owned slice is 252 nonblank,
  non-comment, non-docstring Python lines; budget 760 changed lines.
