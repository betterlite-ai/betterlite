- 'litellm/proxy/auth/user_api_key_auth.py: B756 owns user_api_key_auth_websocket L644-L707, including Authorization, api-key and openai-insecure-api-key.<token> extraction and pre-accept 403/1008; B732 and B748 own identity, key and model-grant resolution reached by the first-frame access check.'
- 'litellm/proxy/auth/user_api_key_auth.py: B754 owns _run_centralized_common_checks called after _enforce_key_and_fallback_model_access; B941 owns only the gate conditions and its pre-call error frame.'
- 'litellm/proxy/common_request_processing.py: B014 owns ProxyBaseLLMRequestProcessing and common_processing_pre_call_logic; B941 records its call-before-route ordering and route_type without reimplementing admission, guardrails, rate limits, or budgets.'
- 'litellm/proxy/route_llm_request.py: B014 owns route_request dispatch; B943 owns native Responses WebSocket execution and B945 owns managed turn execution. B941 supplies routed_data and handles only the surrounding failure control flow.'
- 'litellm/proxy/utils.py: B124 owns ProxyLogging.post_call_failure_hook L3197-L3314 and B012 owns logger/event integration; B941 records hook order without implementing callback, persistence, or redaction.'
- 'Database/cache reads or writes reached through auth, common processing, failure hooks, and provider execution belong to B732, B748, B754, B124, B856, B943, and B945. The owned endpoints.py slice performs no database write.'
- 'Provider and Python package/event-loop facades belong to B943, B945, and B158-B161; this task forwards the prepared operation and does not create a helper oracle for a provider call.'
- 'litellm/proxy/proxy_server.py: B003 owns application startup and the single app.include_router(response_router) registration at L19949-L19952; B941 supplies one Rust route factory and must not duplicate that mount.'
pitfalls:
- 'The endpoint accepts before reading the first frame, so malformed JSON/model errors are post-accept text plus close 1008; only dependency admission failures are pre-accept HTTP 403.'
- 'Every endpoint-created synthetic Request has scope path /v1/responses, including a connection made to /responses; passing the alias path into the access policy changes LiteLLM behavior.'
- 'The handler echoes the first non-empty comma-separated Sec-WebSocket-Protocol token verbatim; a browser credential token beginning openai-insecure-api-key. can therefore become the negotiated subprotocol unless the dependency-owned header path is isolated.'
- 'The model gate tests if the query string is truthy, but the frame extractor tests nested and top-level model values for truthiness; ?model= and nested model="" both fall through rather than resolving an empty model.'
- 'Routing-hint validation is a second Pydantic parse after response.create validation: input=7 or previous_response_id=9 returns EMPTY_MAPPING silently, so adding a second client error would diverge from the route.'
- 'status_code=True must not be accepted as integer 1: the explicit bool exclusion sends status 500/server_error, just like missing, string, or non-integer status.'
- 'A returned Exception is not the raised-exception path: it triggers post_call_failure_hook and then returns with neither _responses_ws_failure_frame output nor a close; the raised path sends, hooks, and closes 1011 in that order.'
- 'json.dumps({"model": resolved_model}).encode() retains its default separator, so the synthetic body for gpt-4o is bytes for {"model": "gpt-4o"}, not the compact spelling {"model":"gpt-4o"}.'
