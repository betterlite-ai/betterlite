id: B941
title: Responses ws auth
description: >-
  Install the two Responses WebSocket routes with the pinned query-model and first-frame auth behavior. Hand off
  the authenticated session to the native or managed WebSocket service.


  Paths are WebSocket /v1/responses and /responses. ?model= supplies the query model and skips the first-frame model-auth
  branch; otherwise read the first response.create frame with a 30-second timeout (close 1008). Echo the first requested
  Sec-WebSocket-Protocol. Invalid JSON/non-response.create sends invalid_request_error and closes 1008; receive/internal
  errors close 1011. First-frame auth is skipped without master key and without enable_jwt_auth/enable_oauth2_auth/enable_oauth2_proxy_auth,
  or for custom auth when custom_auth_run_common_checks=false. Upstream failure frame types are rate_limit_exceeded
  for 429, invalid_request_error for other 4xx and server_error otherwise.


  Implement crates/betterlite-server/src/api/responses_ws_auth.rs, crates/betterlite-core/src/api/responses_ws_auth.rs.
  Use ResponsesWsAuthInput and ResponsesWsAuthResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: WEBSOCKET /v1/responses; WEBSOCKET /responses. Each alias is exercised
  through the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without
  re-registering their methods/paths.


  Extraction uses the typed path/query/body records named by the owned handler signatures.


  Write adjacent tests.rs behavior functions model_in_first_frame, missing_model_close, unauthorized_first_frame,
  route_hints_retained, malformed_first_frame, query_model_skips_first_auth, first_frame_timeout, first_frame_wrong_type,
  upstream_failure_frame, first_subprotocol_echo, route_aliases, auth_missing, auth_invalid under api::responses_ws_auth::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): general_settings.custom_auth_run_common_checks
  defaults to False; general_settings.enable_jwt_auth defaults to False; general_settings.enable_oauth2_auth defaults
  to False; general_settings.enable_oauth2_proxy_auth defaults to False. No environment reads occur outside betterlite-config.
  Test api::responses_ws_auth::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  The production external-byte decoder is betterlite-server::api::responses_ws_auth::decode_responses_ws_auth(bytes:
  &[u8], limits: &ApiLimits), for json.loads input first_message at litellm/proxy/response_api_endpoints/endpoints.py:1337;
  _ResponseCreateRoutingHints.model_validate_json input first_message at litellm/proxy/response_api_endpoints/endpoints.py:1409.
  Place its implementation in crates/betterlite-server/src/api/responses_ws_auth.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/responses_ws_auth.rs passes arbitrary
  bounded bytes to that exact decoder; api::responses_ws_auth::tests::replays_corpus replays newly committed seeds
  through the same function. Transform-only helpers reuse the already decoded records.


  Use B901 kind: websocket transcripts with the default gateway driver against both booted proxies, comparing upstream
  handshake status, negotiated subprotocol, per-direction frame ordering and close code/reason. Route gateway cases
  also compare pre-accept HTTP status. No helper calls a WebSocket route function.


  Callable ownership: litellm/proxy/response_api_endpoints/endpoints.py: _read_ws_model_from_first_frame (L1316-L1384);
  litellm/proxy/response_api_endpoints/endpoints.py: _extract_model_from_first_ws_event (L1387-L1396); litellm/proxy/response_api_endpoints/endpoints.py:
  _routing_hints_from_first_ws_frame (L1407-L1419); litellm/proxy/response_api_endpoints/endpoints.py: _responses_ws_failure_frame
  (L1422-L1428); litellm/proxy/response_api_endpoints/endpoints.py: _enforce_responses_ws_first_frame_model_auth
  (L1431-L1471); litellm/proxy/response_api_endpoints/endpoints.py: responses_websocket_endpoint (L1476-L1620).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 252 owned nonblank/non-comment/non-docstring Python lines (268 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 272 implementation,
  118 behavior tests, 156 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 42 config tests/seeds
  and 38 wiring; 686 total within the 690-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B171 (Direct helper oracle and
  URL path encoding), B901 (Websocket oracle), B943 (Responses ws native), B945 (Responses ws managed), B1087 (Api
  boundaries), B754 (Shared authenticated request policy ordering), B748 (Combine key, team, user and organization
  model grants), B756 (Authentication header selection and mode dispatch), B732 (Typed authentication principals
  and grant resolution), B855 (Authenticated request admission and budget handoff), B1139 (Stateful HTTP oracle
  scenarios), B856 (Management oracle namespaces and Postgres test fixture), B002 (Load LiteLLM config.yaml into
  typed config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids
  retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
