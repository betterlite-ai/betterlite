deviations:
- what: A first frame larger than ApiLimits.max_json_bytes is rejected by betterlite's bounded decoder with the shared request-too-large error before JSON parsing, instead of allowing Python json.loads to allocate for the whole text.
  why: The bounded-inputs rule requires a finite WebSocket JSON allocation; the owned LiteLLM code has no byte cap.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L1336-L1337
