  why: The first receive timeout, disconnect/exception exits, JSON error frames, model query precedence, and exact close reasons are implemented together here.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L1387-L1419
  why: These lines define nested-versus-flat model selection, the three routing-hint fields, ignored extras, null fallback, and empty-hint validation failure.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L1422-L1428
