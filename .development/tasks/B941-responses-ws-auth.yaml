dod:
- text: >-
    model_in_first_frame sends text {"type":"response.create","model":"gpt-4o","extra":"keep"} to both
    /v1/responses and /responses; each handshake is 101, the resolved model is gpt-4o, and the exact original text
    including the extra field reaches the mock Responses service.
  proof: [case-model-in-first-frame, oracle]
- text: >-
    nested_model_precedence sends top="top" with response.model="nested", then response.model=null and response.model=""
    with top="top"; nested resolves first, and both falsey nested values resolve top. response=1 and response=[] also
    fall back to top, while a scalar first event has no model. A frame with no model and no query emits nested
    error.type="invalid_request_error", exact message="No model provided. Supply ?model=<model> in the URL or include
    'model' in the first response.create event.", and closes 1008 reason="No model provided".
  proof: [case-nested-model-precedence, case-missing-model-close, oracle]
- text: >-
    malformed_first_frame sends text { and receives one frame with outer type="error", nested type="invalid_request_error"
    and message="First message is not valid JSON.", followed by close 1008 reason="Invalid JSON in first message";
    wrong_first_frame_type repeats the type fields for inputs 1, [] and {"type":"response.done"}, with message="First
    message must be a response.create JSON object." and reason="Invalid first message".
  proof: [case-malformed-first-frame, case-wrong-first-frame-type, oracle]
- text: >-
    query_model_skips_first_auth sends ?model=gpt-4o with {"type":"response.create"}; it validates the frame, resolves
    gpt-4o, and still retains the original text. Sending ?model= with frame model="frame-model" resolves frame-model,
    while omitting the query invokes the first-frame model access gate before common processing.
  proof: [case-query-model-skips-first-auth, case-model-access-gates, oracle]
- text: >-
    receive_failures covers the 30-second wait: timeout has no text frame and close 1008 reason="Timed out waiting for
    first message", disconnect has no second close, and an injected receive exception has no frame and close 1011
    reason="Internal server error".
  proof: [case-first-frame-timeout, case-first-receive-errors, oracle]
- text: >-
    route_hints_retained forwards nested input="nested" and previous_response_id="resp_nested" over top-level
    input="top" and previous_response_id="resp_top", drops extra="discard-me" and null hints, falls back when nested
    fields are absent or null, and passes no hints when input=7 or previous_response_id=9 makes routing validation fail;
    response.create validation still emits only its own frame. A truthy numeric
    model=1 is retained as the extractor result rather than treated as absent.
  proof: [case-route-hints-retained, oracle]
- text: >-
    model_access_gates proves absent master_key plus enable_jwt_auth=false, enable_oauth2_auth=false,
    enable_oauth2_proxy_auth=false skips access; master_key="sk-master" alone and each flag true run it; custom auth with
    custom_auth_run_common_checks=false skips and true runs. An access exception emits only outer type="error", nested
    type="invalid_request_error" and str(exception), with no status/param/code, then closes 1008 reason="Pre-call error".
  proof: [case-model-access-gates, case-precall-error-frame, config-tests, oracle]
- text: >-
    subprotocol_selection sends Sec-WebSocket-Protocol=" beta , responses.v1 " and negotiates "beta", while absent,
    ", ," and whitespace-only values negotiate no protocol; a first non-empty openai-insecure-api-key.fixed-key token
    is selected verbatim when B756 uses that dependency path.
  proof: [case-subprotocol-selection, oracle]
- text: >-
    synthetic_request_order records a /responses connection whose pre-call Request still has type="http", method="POST",
    path="/v1/responses", original WebSocket headers and URL, body bytes for {"model": "gpt-4o"}, route_type
    "_aresponses_websocket", common processing before route_request, and only non-null input/previous_response_id hints.
  proof: [case-synthetic-request-order, oracle]
- text: >-
    failure_frame_statuses injects status_code=429, 400, 422, 499, 500, 503, 300, 600, missing, "429" and True
    with message="upstream failed". It expects 429/rate_limit_exceeded, 400/invalid_request_error,
    422/invalid_request_error, 499/invalid_request_error, 500/server_error, 503/server_error, 300/server_error and
    600/server_error; missing, "429" and True become 500/server_error. Every frame has outer type="error", nested
    message="upstream failed", no param/code, then the hook runs and close 1011 reason="Internal server error" follows.
  proof: [case-failure-frame-statuses, oracle]
- text: >-
    returned_failure_drop makes route_request yield an Exception with message="returned failure"; the failure hook runs,
    but the gateway sends no failure frame and no close. The raised-exception fixture separately verifies send-frame, hook,
    and close order.
  proof: [case-returned-failure-drop, case-failure-frame-statuses, oracle]
- text: >-
    route_aliases and auth_missing/auth_invalid exercise /v1/responses and /responses with Authorization: Bearer sk-fixed,
    plus absent credentials and Authorization: Basic wrong-format. Valid handshakes are HTTP 101; the two dependency-owned
    refusals are pre-accept HTTP 403 details "No API key provided" and "Invalid Authorization header format", close 1008,
    and no WebSocket error JSON object.
  proof: [case-auth, oracle]
- text: >-
    loads_settings loads enable_jwt_auth, enable_oauth2_auth, enable_oauth2_proxy_auth and custom_auth_run_common_checks
    from general_settings; each absent key is false, each explicit true is true, and the loader performs no environment
    lookup. A YAML seed containing these exact keys reaches the production decoder.
  proof: [config-tests, config-corpus]
- text: >-
    The shared decoder enforces ApiLimits.max_json_bytes before JSON parsing, fuzz/replay covers malformed and oversized
    bytes without a panic, and each listed WebSocket oracle fixture is newly added and compares independent pinned and
    betterlite gateway transcripts.
  proof: [parser-corpus, new-oracle-cases, oracle]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: The named server, core, and config behavior tests are absent or a non-replay contract fails.
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::responses_ws_auth::/) - test(/::replays_corpus$/)'
  - id: case-model-in-first-frame
    why: A flat frame, either route alias, original text, or resolved gpt-4o is not preserved.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::model_in_first_frame($|::)/)'
  - id: case-nested-model-precedence
    why: Nested truthy selection or null/empty fallback is missing.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::nested_model_precedence($|::)/)'
  - id: case-missing-model-close
    why: The no-model message or 1008 reason differs from the pinned literal.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::missing_model_close($|::)/)'
  - id: case-malformed-first-frame
    why: The invalid-JSON frame fields or close reason are absent or altered.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::malformed_first_frame($|::)/)'
  - id: case-wrong-first-frame-type
    why: Scalar, array, and wrong-event input do not share the exact response.create diagnostic.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::wrong_first_frame_type($|::)/)'
  - id: case-query-model-skips-first-auth
    why: Query model precedence or the distinction between frame validation and model access is absent.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::query_model_skips_first_auth($|::)/)'
  - id: case-first-frame-timeout
    why: The 30-second timeout or exact 1008 close is missing.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::first_frame_timeout($|::)/)'
  - id: case-first-receive-errors
    why: Disconnect or receive-exception behavior sends an unexpected frame or close.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::first_receive_(disconnect|internal_error)($|::)/)'
  - id: case-route-hints-retained
    why: Nested hint precedence, null omission, extra filtering, or validation-failure suppression is wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::route_hints_retained($|::)/)'
  - id: case-model-access-gates
    why: One of the five master-key/mode/custom-auth gate combinations or its default is missing.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::model_access_gates($|::)/)'
  - id: case-precall-error-frame
    why: Pre-call exception fields, send-failure close, or 1008 Pre-call error is not enforced.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::precall_error_frame($|::)/)'
  - id: case-subprotocol-selection
    why: Comma splitting, trimming, first-token choice, or blank-header behavior differs.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::subprotocol_selection($|::)/)'
  - id: case-synthetic-request-order
    why: The synthetic path/body/headers, route_type, hint merge, or pre-call order is wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::synthetic_request_order($|::)/)'
  - id: case-failure-frame-statuses
    why: Status buckets, bool exclusion, absent fields, hook order, or 1011 close is wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_ws_auth::tests::failure_frame_statuses($|::)/)'
  - id: case-returned-failure-drop
    why: A returned Exception incorrectly emits a frame or close, or skips the failure hook.
