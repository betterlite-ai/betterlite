pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_credentials in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/credentials.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_credentials.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Generated session names must be chosen after a cache miss; generating them before the key defeats credential reuse.
- Non-IRSA expiry is fractional, while IRSA extraction truncates towardzero; do not merge these two TTL branches.
