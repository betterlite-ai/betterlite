id: B594
title: AWS credential resolver composition
description: >-
  Compose AwsCredentialResolver with source precedence and process-shared cache keyed by resolved identity. Include
  S3-only static credentials as an explicit separate identity and require a complete pair. All config/env reads
  have already occurred in AwsSettings; resolutions from concurrent deployments cannot reuse one another credentials
  or session policies.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/base_aws_llm.py:
  BaseAWSLLM.get_credentials L346-L510; BaseAWSLLM.resolve_credentials L512-L525; BaseAWSLLM.resolve_s3_credentials
  L527-L536; BaseAWSLLM._resolve_role_credentials L1216-L1255; BaseAWSLLM._auth_with_aws_role L1258-L1390.


  Reuse s3_static_key_pair from B590 (litellm/llms/bedrock/common_utils.py); its implementation remains with that
  prerequisite.


  Named case contracts: web_identity_before_role: Use B590 non-None predicate: token+role+session selects cached
  B593 web identity; otherwise role non-None selects cached role resolver. Empty strings still count; missing session
  name can shift web identity to role. All resolved fields, canonical tags and ssl_verify are in the cache key even
  if a branch ignores them. role_before_profile: A role wins over profile/static credentials. Cache hit skips both
  GetCallerIdentity and AssumeRole. B592 says already-role -> B590 ambient credentials/TTL; otherwise generate falsey
  session name as litellm-session-<integer current epoch seconds> inside fetcher, keeping the cache key stable.
  Explicit nonempty session name retained. profile_before_static: Profile wins over session-token and static branches
  and bypasses shared cache. Complete non-None access/secret/session triple also bypasses cache; complete non-None
  access/secret/region static branch is cached. Incomplete static inputs fall through to cached ambient source,
  preserving B590 SDK behavior. s3_static_pair_isolated: Both s3_access_key_id and s3_secret_access_key must be
  nonempty strings; then construct credentials from that pair only without AWS session token, role, profile or cache
  lookup. Otherwise validate AwsAuthParams from request mapping and resolve normal AWS fields+region. resolve_credentials
  canonicalizes session tags and passes every AwsAuthParams field through, but no custom ssl_verify parameter exists
  on that wrapper. fixed_env_fallback_only: For each None parameter use its matching fixed env key: aws_access_key_id/AWS_ACCESS_KEY_ID,secret/AWS_SECRET_ACCESS_KEY,session_token/AWS_SESSION_TOKEN,region_name/AWS_REGION_NAME,session_name/AWS_SESSION_NAME,profile_name/AWS_PROFILE_NAME,role_name/AWS_ROLE_NAME,web_identity_token/AWS_WEB_IDENTITY_TOKEN,sts_endpoint/AWS_STS_ENDPOINT,external_id/AWS_EXTERNAL_ID.
  Explicit empty values win; do not expand request-supplied os.environ/VAR or bare variable names. Config references
  were expanded by B002/B682. No env source for aws_session_tags; B590 canonicalizes tags before selecting any flow.
  irsa_branch_and_failure: IRSA requires truthy AWS_WEB_IDENTITY_TOKEN_FILE and AWS_ROLE_ARN plus both explicit
  access/secret being None; even one explicit empty key skips it. Full role ARN inequality selects B593 cross-account
  helper, equality selects same-account helper. Return B592 integer TTL. On any failure rethrow; when error text
  contains both AccessDenied and is not authorized to perform: sts:AssumeRole, log Access denied when trying to
  assume role <role>. Please ensure the trust policy of <role> allows the current role to assume it. Current identity:
  check logs with verbose mode. Never fall through to non-IRSA credentials. non_irsa_assume_role: Use B591 STS kwargs.
  If both explicit keys None, default client; otherwise forward access,secret,session token including None/empty
  members. Call B590 assume_role_params with canonical tags and ExternalId iff non-None. Project Credentials and
  use fractional (Expiration-now in same timezone).total_seconds()-60 without int/clamp; include negative/fractional
  cases. access_denied_same_identity_fallback: Only exception text containing AccessDenied triggers a new B592 identity
  check. Same role -> warn AssumeRole failed for <role> (<error>). Caller is already running as this role; falling
  back to ambient credentials. and use B590 ambient. Different role -> log AssumeRole AccessDenied for <role> and
  caller is NOT the same role. Re-raising. Error: <error>, then rethrow. Other errors rethrow without identity check;
  no permission escalation fallback.


  Implement crates/betterlite-bedrock/src/credentials.rs with adjacent tests under credentials/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_credentials in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function credentials_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  web_identity_before_role, role_before_profile, profile_before_static, s3_static_pair_isolated, credentials_cache_key_isolation,
  fixed_env_fallback_only, irsa_branch_and_failure, non_irsa_assume_role, access_denied_same_identity_fallback.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_credentials* using HelperCase: kind:
  helper and the externally tagged bedrock_credentials variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_credentials that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_credentials_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_credentials_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 311 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 295 production lines, 300 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 745 planned, 750 maximum changed lines.
