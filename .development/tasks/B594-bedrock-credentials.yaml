  commands:
  - id: case-web-identity-before-role
    why: The web-identity-before-role behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::credentials_cases::case_[0-9]+_web_identity_before_role$/)'
  - id: case-role-before-profile
