deviations: []
out_of_scope:
  - "The handlers: B8597, B8586, B8272, B8386, B3190 and B379. PeriodicReloads: B8385. The catalog itself: B8381."
  - "B3191's agent_fields_routes: the agents area."
  - "Handing DeploymentSync and PeriodicReloads to Shared: the foundation parts."
pitfalls:
  - Merging providers_routes in mount puts the /public paths behind the key check, and LiteLLM answers them without one.
  - GET /adaptive_router/state reads the RouterHandle per request; capturing the router at mount time would answer 404 forever when the database sync installs the router later.
  - The reload status routes must read the same PeriodicReloads the timer checks write, or they report a pod that never reloaded.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
