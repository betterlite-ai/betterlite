id: B3877
title: Prometheus usage and spend counters
description: >-
  Add the success-path counter emitters of PrometheusLogger to betterlite-logging as the module `prometheus_usage`
  (crates/betterlite-logging/src/prometheus_usage.rs). Each emitter takes the request's `StandardLoggingPayload` (B254),
  the request's `UserAPIKeyLabelValues` (B3870) and its `PrometheusLabelFactoryContext` (B3873), and increments counters
  through B3876's `inc_labeled_counter`, which builds the labels, increments and runs the end-user series cap.
  Metric names are exactly LiteLLM's; every counter below is registered by B3875 and its label list comes from
  `get_labels_for_metric` (B3874). The module has one error enum, `PrometheusUsageError`, that wraps the error of the
  counter interface; nothing else in it can fail.

  Build these functions, in this call order inside each group.
  `increment_top_level_request_and_spend_metrics`: `litellm_requests_metric` by 1, then `litellm_spend_metric` by `response_cost`.
  `increment_zero_cost_requests_metric(zero_cost_diagnostic: Option<..>)`: do nothing when the diagnostic is absent. Otherwise
  take the label list of `litellm_zero_cost_requests_total`, build the labels with the label factory, add a `reason` label
  (the constant `ZERO_COST_REASON_LABEL` from B3870) holding `diagnostic.reason` only when `reason` is in that label list, and
  increment the counter by 1 directly on the collector. It does not go through `inc_labeled_counter`, so it never runs the
  end-user series cap.
  `increment_token_metrics`: `litellm_total_tokens_metric` (collector `litellm_tokens_metric`) by `total_tokens`,
  `litellm_input_tokens_metric` by `prompt_tokens`, `litellm_output_tokens_metric` by `completion_tokens`, then
  `increment_token_detail_metrics`. These three always increment, even by 0.
  `increment_token_detail_metrics`: read `metadata.usage_object`; return when it is absent or not a JSON object. Read
  `prompt_tokens_details` and `completion_tokens_details` (absent or null means an empty object). The five sparse counters, in
  this order, are `litellm_input_cached_tokens_metric` (`prompt_tokens_details.cached_tokens`),
  `litellm_input_cache_creation_tokens_metric` (the result of `resolve_cache_write_tokens`),
  `litellm_input_audio_tokens_metric` (`prompt_tokens_details.audio_tokens`), `litellm_output_reasoning_tokens_metric`
  (`completion_tokens_details.reasoning_tokens`) and `litellm_output_audio_tokens_metric`
  (`completion_tokens_details.audio_tokens`). A details value that is not an object yields no value for its counters.
  `increment_media_generation_metrics`: same `usage_object` guard, then the sparse counters `litellm_video_duration_seconds_metric`
  (`usage_object.duration_seconds`) and `litellm_images_generated_metric` (`usage_object.output_image_count`).
  `inc_sparse_usage_counters`: for each (counter, metric name, value) entry, increment by the value only when it is a JSON
  number (integer or float, never a boolean or string) and greater than 0. Everything else is skipped silently.
  `increment_cache_metrics`: when `cache_hit` is absent do nothing for the LiteLLM cache. When it is true, increment
  `litellm_cache_hits_metric` by 1, then `litellm_cached_tokens_metric` by `total_tokens` only when `total_tokens` is above 0
  (a missing `total_tokens` counts as 0). When it is false, increment `litellm_cache_misses_metric` by 1. Independently of
  `cache_hit`, when `metadata.usage_object` is an object, call `resolve_provider_cache_tokens` and increment
  `litellm_provider_cache_read_input_tokens_metric` and `litellm_provider_cache_creation_input_tokens_metric` by the returned
  read and creation counts, each only when above 0, read first.
  `resolve_provider_cache_tokens(usage_object) -> (i64, i64)`: read is `cache_read_input_tokens` when it is an integer, else 0;
  creation is `cache_creation_input_tokens` when it is an integer, else 0. When the read field is absent or null (a present
  value of the wrong type does not count as absent) and `prompt_tokens_details` is an object whose `cached_tokens` is an
  integer, read becomes that value. When the creation field is absent or null and `resolve_cache_write_tokens` returns a
  value, creation becomes that value.
  `resolve_cache_write_tokens(prompt_details) -> Option<i64>`: `None` unless `prompt_details` is an object; otherwise the
  first of `cache_write_tokens`, `cache_creation_tokens` (in that order) whose value is an integer.
  `increment_mcp_tool_call_metrics(response_cost)`: return unless `metadata.mcp_tool_call_metadata` is an object. Build a new
  `UserAPIKeyLabelValues` holding `mcp_tool_name` (the object's `name`), `mcp_server_name` (its `mcp_server_name`) and the
  request's `hashed_api_key`, `api_key_alias`, `team`, `team_alias`, `user` and `end_user`, and nothing else. Make a fresh
  label context from it. Increment `litellm_mcp_tool_calls_total` by 1 and, only when `response_cost` is above 0,
  `litellm_mcp_tool_call_spend_metric` by `response_cost`. Both go through `inc_labeled_counter`.
  `set_spend_capture_rate(api_provider, capture_rate: Option<..>)`: build labels with the label factory from the label list of
  `litellm_spend_capture_rate` and a `UserAPIKeyLabelValues` holding only `api_provider`. Set the gauge `litellm_spend_capture_rate`
  to the rate, or to NaN when the rate is `None`. When the label mapping is empty, set the unlabeled gauge directly.

  Tests live under `prometheus_usage::tests` in the module's tests.rs, one function family per group with these prefixes:
  `request_spend_`, `zero_cost_`, `token_`, `token_detail_`, `media_`, `cache_`, `provider_cache_`, `mcp_`, `capture_rate_`.
  Use a recording fake of the counter interface, so a test checks metric name, amount and call order.

  Oracle helper cases (pure input, no route reaches this code yet) call the helper operation `b3877`. Its Python adapter patches
  `PrometheusLogger._inc_labeled_counter` with a recorder, calls the real unbound LiteLLM methods on a bare stand-in object, and
  returns the recorded (metric name, amount) list; for the two resolvers it calls the real static methods. The umbrella B111
  adds the HTTP scrape cases.

