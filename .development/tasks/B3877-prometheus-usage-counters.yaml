dod:
  - text: Every successful request increments `litellm_requests_metric` by 1 and `litellm_spend_metric` by the response cost, in that order, through `inc_labeled_counter`.
    proof: [request-spend-tests, oracle, helper-python]
  - text: A zero-cost diagnostic increments `litellm_zero_cost_requests_total` once with a `reason` label only when the metric's label list contains `reason`, and an absent diagnostic increments nothing.
    proof: [request-spend-tests]
  - text: The zero-cost counter increments directly and never reaches the end-user series cap.
    proof: [request-spend-tests]
  - text: Total, input and output token counters always increment, by `total_tokens`, `prompt_tokens` and `completion_tokens`, including by 0.
    proof: [token-tests, oracle, helper-python]
  - text: The five token-detail counters increment in the stated order only for positive numeric values, skip booleans and strings, and are skipped entirely when `usage_object` is absent or not an object.
    proof: [token-tests, oracle, helper-python]
  - text: Video seconds and generated images increment only for positive numeric `duration_seconds` and `output_image_count`.
    proof: [media-mcp-tests, oracle, helper-python]
  - text: A true `cache_hit` increments hits and, when `total_tokens` is above 0, cached tokens; a false `cache_hit` increments misses; an absent `cache_hit` increments neither.
    proof: [cache-tests, oracle, helper-python]
  - text: Provider cache read and creation counters increment independently of `cache_hit`, only for counts above 0, using the explicit fields first and `prompt_tokens_details` only when the explicit field is absent or null.
    proof: [cache-tests, oracle, helper-python]
  - text: "`resolve_cache_write_tokens` returns the first integer of `cache_write_tokens` then `cache_creation_tokens`, and `None` for a non-object or when neither is an integer."
    proof: [cache-tests, oracle, helper-python]
  - text: MCP tool calls increment `litellm_mcp_tool_calls_total` with only the reduced label values, and `litellm_mcp_tool_call_spend_metric` only when the cost is above 0; a missing or non-object `mcp_tool_call_metadata` increments nothing.
    proof: [media-mcp-tests]
  - text: "`set_spend_capture_rate` sets the labelled gauge to the rate, to NaN for `None`, and sets the unlabeled gauge when the label mapping is empty."
    proof: [capture-rate-tests]
  - text: A counter error (negative amount) propagates as `PrometheusUsageError` and stops the remaining increments in that function.
    proof: [request-spend-tests]

checks:
  optional: []
  commands:
    - id: request-spend-tests
      why: request, spend or zero-cost counter behavior is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_usage::tests::(request_spend_|zero_cost_)/)'
    - id: token-tests
      why: token or token-detail counter behavior is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_usage::tests::(token_|token_detail_)/)'
    - id: cache-tests
      why: cache hit, miss or provider cache counter behavior is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_usage::tests::(cache_|provider_cache_)/)'
    - id: media-mcp-tests
      why: media or MCP counter behavior is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_usage::tests::(media_|mcp_)/)'
    - id: capture-rate-tests
      why: the spend capture rate gauge behavior is missing
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_usage::tests::capture_rate_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3877)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3877 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3877/pyrightconfig.json

oracle_cases:
  - tools/oracle/cases/helpers/prometheus-usage/request-and-spend.yaml
  - tools/oracle/cases/helpers/prometheus-usage/token-counters.yaml
  - tools/oracle/cases/helpers/prometheus-usage/token-details-sparse.yaml
  - tools/oracle/cases/helpers/prometheus-usage/media-counters.yaml
  - tools/oracle/cases/helpers/prometheus-usage/cache-hit-miss.yaml
  - tools/oracle/cases/helpers/prometheus-usage/provider-cache-tokens.yaml
  - tools/oracle/cases/helpers/prometheus-usage/cache-write-tokens.yaml

deviations:
  - what: A boolean `cache_read_input_tokens` or `cache_creation_input_tokens` is treated as a wrong type and gives 0, not 1 or 0 as the integer it is in Python.
    why: docs/compatibility.md follows the declared type (integer), not Python's bool-is-int subclassing.
  - what: A negative amount makes the increment return `PrometheusUsageError` instead of raising ValueError from prometheus_client.
    why: Same outcome in a typed form. The error stops the rest of that function, as the exception does in LiteLLM.

out_of_scope:
  - "async_log_success_event orchestration, the invalid-key skip and the construction of `UserAPIKeyLabelValues` from the payload: no backlog entry names them yet, the architect assigns them (see notes). This task takes the label values and context as inputs."
  - "The `litellm_proxy_total_requests_metric` increment at the end of the success hook: one call to B3876's `inc_labeled_counter` made by the orchestrator."
  - "Latency, token-per-second and guardrail observations, `_get_input_sequence_length`: B3878."
  - "Remaining rate-limit and deployment TPM/RPM gauges, `_set_virtual_key_rate_limit_metrics`: B3879. Deployment success and failure outcomes: B3881."
  - "Remaining budget gauges and `_increment_remaining_budget_metrics`: B3882 owns the projection, B3883 the request lookups."
  - "`inc_labeled_counter`, `_track_end_user_metric_series` and the series tracker: B3876. Label projection and the label factory: B3873. Collector factories and `get_labels_for_metric`: B3874. Collector creation and registration of every metric here: B3875."
  - "The scheduled job that calls `set_spend_capture_rate` (proxy_server.py 11162-11230) and its alert: no owner in the Prometheus entries; only the gauge setter is built here."
  - "Metric label catalog entries for these metrics: B3871 and B3872."

pitfalls:
  - "The token-detail and media helpers read `metadata.usage_object`, a plain JSON object, and not the typed usage record; a field of the wrong JSON type means no value, never an error."
  - "`litellm_total_tokens_metric` is the metric name used for label lookup, but the collector is the one called `litellm_tokens_metric`; the series name on the scrape page is the collector's, so keep the pair as LiteLLM has it."
  - "`litellm_zero_cost_requests_total` bypasses `_inc_labeled_counter` and calls `.labels(**labels).inc()` itself, so the end-user cap does not apply to it."
  - "The sparse counters accept floats because `duration_seconds` is fractional; do not truncate to an integer."
  - "Cache hits and the provider prompt-cache counters are independent; a request with `cache_hit` absent still increments the provider counters."
  - "Provider cache fallback applies only when the explicit field is absent or null; an explicit 0 stays 0 and does not fall back to `prompt_tokens_details`."
  - "The MCP counters take only eight label values and a fresh label context; copying the whole request label values would add model and tag labels LiteLLM does not emit for them."
  - "The MCP spend counter uses the raw `response_cost` and checks `> 0`; the request spend counter has no such check and increments by 0."
  - "`set_spend_capture_rate(None)` must set NaN, not 0 and not remove the series."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
