id: B6021
title: Router generic calls and anthropic_messages
description: >-
  Build the Rust side of `Router.aanthropic_messages` and the generic call path it runs on. LiteLLM sends every non-chat call type (messages, realtime, fine tuning, files, video and more) through `_ageneric_api_call_with_fallbacks`, so this task builds that one engine and plugs `anthropic_messages` into it. Other call types plug in later through the same trait, with no change here.


  The code is the new module `crates/betterlite-sdk/src/router_generic.rs` and its folder. It uses the `RouterCompletionParts` services from B6020 (catalog, selection, retries, fallbacks, slots, counters, compaction) and does not read the chat request types. betterlite-sdk may not depend on betterlite-router or betterlite-server (deny.toml), so use B6020's ports for those services and public items of betterlite-core. B312's anthropic messages attempt and entry, B398's fallback controls and B401's endpoint step are ports too: small traits this module defines with only the calls it makes. B8631 implements them in betterlite-server.


  `GenericCallExecutor` is a trait with one async method that takes a `GenericRequest` (the call type name and a `serde_json::Map` of arguments, with `model` set to the deployment's model) and returns a `GenericOutcome`: a finished JSON body, a byte stream, or `Http { status, headers, body }` with the body as full bytes or a byte stream (B8691's passthrough executor returns it). `RouterGeneric` holds the executors in a `Vec` of (call type name, executor) built by its constructor, so there is no registry and no discovery. This task registers one executor, `anthropic_messages`, that calls B982's `anthropic_messages_handler`. A call type with no executor answers `GenericError::UnknownCallType` with the name.


  `generic_call_with_fallbacks` is `_ageneric_api_call_with_fallbacks` (L5272-L5303). It sets `model`, puts the executor under `original_generic_function`, and puts the attempt under `original_function`: the plain attempt below, or B312's anthropic messages attempt when the caller asked for stream fallback (`attempt_function`). With an attempt function it also stores `per_request_fallback_controls` (B398) under the mid-stream controls key, so every hop sees them. It then calls B310's update-before-fallbacks step with the metadata key `litellm_metadata`, and runs B017/B310's fallback-with-retries executor. On error it returns the error unchanged.


  `dispatch_generic_call_type` is `_dispatch_generic_call_type` (L5780-L5797). The call type `anthropic_messages` goes to B312's `_aanthropic_messages_with_streaming_fallbacks` entry with the executor. Every other call type goes to `generic_call_with_fallbacks` with no attempt function. `anthropic_messages` and `aanthropic_messages` are the same async function: LiteLLM's `factory_function` builds both from `call_type="anthropic_messages"` (L1912-L1914, L6835-L7009), and neither has a blocking form. Expose one method, `anthropic_messages`, and let the Python layer give it both names.


  `generic_attempt` is `_ageneric_api_call_with_fallbacks_helper` (L5334-L5414). Take `passthrough_on_no_deployment` out of the request (default false). Select a deployment with B016, passing `messages` and `input` from the request (either may be absent) and `specific_deployment` taken out. If selection fails and the flag is set, call the executor once with the request unchanged and return its answer. Otherwise return the selection error. Update the request with the deployment (B303), naming the function `_ageneric_api_call_with_fallbacks`. Copy the deployment's params as `data`, read `data["model"]` as the model name, and add one to `total_calls`. Rewrite a passthrough `endpoint` for the chosen model with B401's endpoint step. Get the provider with B014's `provider_for_generic_call(data)`. Build the call arguments in this order: `data`, `caching` set to `cache_responses`, the request, `model` set to the model name, then the `session` map from `with_router_resolved_session_model`. Set `custom_llm_provider` only when the provider is not none. Run B336's compaction with the surface that `surface_for_call` gives for the executor's name, hold the deployment slot (B303), and call the executor. Then B016's refusal check: if it says the Anthropic response was refused, raise `safeguard_refusal_error` for the model and the response's `stop_details`. Add one to `success_calls` for the model name. On any error add one to `fail_calls` for the group name `model`, stamp the failed deployment id (B017) when a deployment was picked, and return the error unchanged.


  `with_router_resolved_session_model` is `_with_router_resolved_session_model` (L504-L517). Given the request's `session` value and the model name, return a one-key map with `session` set to the session map plus `model` set to the model name, but only when `session` is a JSON object that has a `model` key. Return an empty map for any other value (missing, not an object, an object without `model`). It never fails.


  `generic_call_blocking` is `_generic_api_call_with_fallbacks` (L5799-L5861) for the call types that have no async form. It is the blocking twin with a single pass: update-before-fallbacks with the metadata key that `_get_router_metadata_variable_name` (router_utils/batch_utils.py L153) gives for `generic_api_call`, blocking selection, update with the deployment (function name `generic_api_call`), counter, `endpoint` rewritten with a plain text replace of the group name by the model name, `model` set to the model name, the blocking pre-call checks, and the call with `data`, `custom_llm_provider`, `caching` and the request in that order. It has no retries and no compaction. Counters follow the async rules, with `fail_calls` keyed by the group name.


  `FallbackAwareAnthropicMessagesStream` data (L622-L659) is a Rust struct `MessagesStream` that holds the byte stream, the hidden params copied from the source (empty when none), the flag `fallback_headers_adopted` (false at the start), and read-only `has_buffered_provider_output` (true only when the source reports true), `chunks`, `messages` and `model` read from the source, none when absent. B312 owns `adopt_fallback_source`, the iteration and the header merge, so this task only builds the struct and its readers.


  Tests are in `router_generic/tests.rs` with name prefixes `generic_`, `dispatch_`, `session_`, `blocking_` and `messages_stream_`. Use fake services, so no network is used.
