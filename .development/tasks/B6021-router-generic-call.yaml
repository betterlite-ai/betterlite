dod:
  - text: "`dispatch_generic_call_type` sends `anthropic_messages` to B312's entry and every other known call type to the plain generic call, and an unknown name gives `UnknownCallType`."
    proof: [dispatch-types]
  - text: "`generic_call_with_fallbacks` sets the model, both function keys and the mid-stream controls only when an attempt function is given, and uses the `litellm_metadata` key."
    proof: [generic-fallbacks]
  - text: "`generic_attempt` builds the call arguments in LiteLLM's order and sets the provider only when it is not none."
    proof: [generic-attempt]
  - text: "`GenericOutcome` has an `Http { status, headers, body }` variant whose body is full bytes or a byte stream, and an executor's Http outcome comes back from `generic_attempt` unchanged."
    proof: [generic-attempt]
  - text: "With `passthrough_on_no_deployment` set, a failed selection calls the executor with the request as it came, and without it the selection error is returned."
    proof: [generic-passthrough]
  - text: "An Anthropic refusal raises the safeguard refusal error, and counters and failure stamps follow the success and error paths."
    proof: [generic-refusal]
  - text: "`with_router_resolved_session_model` rewrites only an object `session` with a `model` key."
    proof: [session-model]
  - text: "`generic_call_blocking` follows the single-pass order with the plain text endpoint replace and no retries."
    proof: [generic-blocking]
  - text: "`MessagesStream` copies hidden params, starts with `fallback_headers_adopted` false and reads the four source fields."
    proof: [messages-stream]
checks:
  optional: []
  commands:
  - id: dispatch-types
    why: A call type goes to the wrong path or an unknown one passes silently.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::dispatch_/)'
  - id: generic-fallbacks
    why: The attempt controls leak into plain calls or the metadata key is wrong.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::generic_fallbacks_/)'
  - id: generic-attempt
    why: The argument order lets the request override the model name.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::generic_attempt_/)'
  - id: generic-passthrough
    why: A missing deployment fails a passthrough call that should go through.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::generic_passthrough_/)'
  - id: generic-refusal
    why: A refused answer is returned as a success or a counter is skipped.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::generic_refusal_/)'
  - id: session-model
    why: A session that is not an object breaks the call or keeps the group name.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::session_/)'
  - id: generic-blocking
    why: The blocking path adds retries or compaction.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::blocking_/)'
  - id: messages-stream
    why: The stream wrapper loses hidden params or reports buffered output wrongly.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_generic::tests::messages_stream_/)'
oracle_cases: []
deviations:
  - what: Call types are plugged in as executors held in a list given to the constructor, and no `factory_function` table of 130 names is built here.
    why: Each call type belongs to its own family task, and a shared table would be edited by many tasks at once.
  - what: "`anthropic_messages` and `aanthropic_messages` are one method."
    why: LiteLLM builds both from the same async wrapper, so they behave alike.
out_of_scope:
  - "B312 owns the messages stream fallback loop, `_aanthropic_messages_with_streaming_fallbacks`, the attempt function and the stream class methods; B311 owns the chat stream twin."
  - "B016 owns the refusal check and selection, B017 the attempt loop and stamps, B310 the fallback executor, B303 the slot and request update, B336 compaction and B401 the passthrough endpoint rewrite."
  - "B014 owns `provider_for_generic_call`, and B398 owns `per_request_fallback_controls`."
  - "B982 owns the native Messages handler this task calls."
  - "The other branches of `factory_function` (assistants, moderation, search, responses, realtime, vector stores, containers, interactions, agents) stay with B162's last part, and each plugs a `GenericCallExecutor` into `RouterGeneric`."
  - "B6020 owns the chat completion calls, B6022 the Python bridge and B5078 the Python methods."
pitfalls:
  - "`passthrough_on_no_deployment` is removed from the request before selection, so it never reaches a provider."
  - "`model` is set again after the request is merged, so a request that carries its own `model` cannot override the deployment's."
  - "`custom_llm_provider` is left out of the arguments when the provider is none, and not sent as null."
  - "`fail_calls` is keyed by the group name in the generic paths, but `success_calls` and `total_calls` by the deployment's model name."
  - "The refusal check runs after the call but before `success_calls` is incremented."
  - "The blocking generic call replaces the group name inside `endpoint` with a plain text replace, while the async path uses B401's segment-aware rewrite."
  - "The messages stream reads `has_buffered_provider_output` as true only for an exact true, so a truthy non-boolean means false."
  - "There is no exception alert sink: `router_settings.alerting_config` is refused at config load with an error naming the key, so LiteLLM's `send_llm_exception_alert` call point is left out."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
