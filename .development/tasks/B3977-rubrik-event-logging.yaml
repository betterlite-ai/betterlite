id: B3977
title: Rubrik sampled logs and unsampled block records
description: >-
  Build sampled terminal log events and unsampled moderation-block records
  with shared correlation IDs. Rubrik distinguishes two logging paths:
  sampled success/failure events that respect the configured sampling rate,
  and unsampled block records that bypass sampling to ensure every policy
  violation is logged.

  Implement sampled logging. _prepare_log_payload samples based on
  sampling_rate (default 1.0 / never drop), then deep-copies the
  standard_logging_object from kwargs, applies correlation ID by overwriting
  the response id with litellm_call_id, and prepends the system prompt from
  call_details if present. _enqueue_log_event calls _prepare_log_payload,
  returns early if sampling drops it, then appends and maybe flushes the
  queue. async_log_success_event checks the _rubrik_blocked flag in kwargs
  and skips logging if the request was moderation-blocked. async_log_failure_event
  logs standard LLM failures (non-block exceptions) identically to the success
  path.

  Implement unsampled block logging. async_post_call_failure_hook receives
  ModifyResponseException from the guardrail, guards by guardrail_name to
  avoid double-handling when multiple instances are registered, pops the
  stashed _rubrik_logging_obj from request_data, then calls
  _build_and_enqueue_block_event. _build_and_enqueue_block_event extracts
  call_details from logging_obj, builds the block failure payload (catching
  only AttributeError, ImportError, KeyError, TypeError), then appends
  without dropping (blocks are never sampled). _prepare_block_failure_payload
  checks call_details["standard_logging_object"]: if present, deep-copy it
  to _copy_block_payload_base; if absent (prompt block or timing race),
  use _build_fallback_payload. Overwrite the response field with
  "ModifyResponseException: <message>", apply correlation ID, and prepend
  system prompt. _build_fallback_payload reads model/optional_params/messages
  from call_details, model_group and model from the same model field, sets
  model_id to empty string, converts start_time datetime to Unix float,
  uses that float for all time fields, builds metadata via _caller_metadata,
  sets status to "failure". _caller_metadata defers the import of
  LiteLLMProxyRequestSetup and calls get_sanitized_user_information_from_key.
  _copy_block_payload_base is a static wrapper around safe_deep_copy for
  the copied base payload.

  Preserve the stashed-context guardrail-name check so multiple Rubrik
  instances do not race on the pop. Keep _rubrik_blocked set until request
  state dies, preventing delayed success callbacks from logging blocked
  content -- never pop it in _build_and_enqueue_block_event even though the
  success handler is deferred.

