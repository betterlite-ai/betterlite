oracle_cases: []

deviations:
  - what: _caller_metadata defers import of LiteLLMProxyRequestSetup from litellm.proxy.litellm_pre_call_utils and requires the caller identity mapping contract.
    why: The import is deferred to avoid pulling proxy-only dependencies into the SDK-side rubrik.py module during guardrail discovery.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L1014-L1016

out_of_scope:
  - Deferred success callback execution and task scheduling (_defer_async_logging in litellm.Logging).
  - CustomGuardrail.__init__ contract (assigned to unplanned B104).
  - ModifyResponseException type definition and exception handling (handled by B184).

pitfalls:
  - _rubrik_blocked is never popped in _build_and_enqueue_block_event, even though the success handler is deferred; the flag dies with model_call_details when the request completes.
  - async_post_call_failure_hook must guard by original_exception.guardrail_name to avoid double-handling when multiple Rubrik instances are registered and only one raised the block.
  - _prepare_block_failure_payload must catch only specific exception types (AttributeError, ImportError, KeyError, TypeError) to avoid masking unexpected errors.
  - _build_fallback_payload converts datetime to Unix float using timestamp() method because httpx json= uses stdlib json.dumps with no custom encoder.
  - Sampled logging returns None early when sampling_rate drops the event; _enqueue_log_event must return early without appending.
  - The fallback path is used when standard_logging_object is absent (prompt blocks or race conditions), never copied from elsewhere.

