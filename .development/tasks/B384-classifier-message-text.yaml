id: B384
title: Classifier message and reminder extraction
description: 'Implement ClassifierText over B010 typed messages: bounded human asks, reminder-block stripping,
  encrypted task handling, newest-turn recognition and trusted system-scope plan markers. Return provenance-tagged
  extracted text without mutating the provider payload. No classifier transport or session state is added.
  Configuration boundary keys introduced or consumed here: reminder_markers. Pinned declaration defaults:
  reminder_markers=None. Resolve env values once in betterlite-config, never in router code. Implement
  the owned native service in crates/betterlite-router/src/classifier_message_text.rs. Add ProbeOperation::ClassifierMessageText
  in tools/oracle/src/router_probes/mod.rs and the corresponding B384 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/complexity_router/complexity_router.py:
  _message_text (L487-L498), _reminder_block_spans (L501-L515), _strip_reminder_blocks (L518-L544), _inline_image_part
  (L547-L561), _human_text (L564-L573), _encrypted_classifier_task (L576-L609), _iter_human_asks_newest_first
  (L612-L621), _conversation_is_continuing (L624-L655), _newest_turn_ask (L658-L671), _extract_current_ask_and_system_prompt
  (L674-L693), _last_human_ask_index (L696-L714), _is_reminder_only_turn (L717-L726), _newest_turn_is_human_ask
  (L729-L755), _iter_system_scope_texts (L758-L780), _matched_plan_mode_sentinel (L783-L851), ComplexityRouter._resolve_messages
  (L4068-L4083), ComplexityRouter._extract_user_message_and_system_prompt (L4086-L4095), ComplexityRouter._reminder_markers_for_request
  (L4097-L4107). Implement these behaviors through the typed Rust services above; synchronous facades
  and structural accessors reuse the same primitive instead of separate ports.'
