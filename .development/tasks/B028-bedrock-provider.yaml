  - crates/betterlite-provider/src/operation.rs
  - crates/betterlite-provider/src/prepared.rs
  - crates/betterlite-core/src/dispatch.rs
  - crates/betterlite-core/src/operation.rs
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-bedrock/fixtures/whitelisted_bedrock_models.txt
  - deny.toml
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/provider/bedrock_provider.rs
  - tools/oracle/src/helpers/provider/bedrock_provider/**
  - tools/oracle/helpers/bedrock_provider.py
  - tools/oracle/helpers/bedrock_provider/**
