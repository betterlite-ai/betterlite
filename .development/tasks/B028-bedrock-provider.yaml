id: B028
title: Bedrock chat and Messages provider composition
description: >-
  Compose Bedrock chat, Mantle and direct Nova operations using the shared B678 dispatcher contract. Own the main.py
  Bedrock/Mantle/Nova dispatch branches and the config tag selector. get_bedrock_route defaults to invoke and get_bedrock_chat_config
  falls back to AmazonInvokeConfig for unknown models. B680 installs InvokeAgent/AgentCore and Claude Platform leaves;
  no interim uninstalled-agent error is introduced.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/main.py: _complete_bedrock_mantle
  L2173-L2216; _complete_amazon_nova L3145-L3178; _complete_bedrock L4178-L4304.


  The claude_platform branches select B656 for native chat/Messages; InvokeAgent belongs to B652 and AgentCore request
  selection to B653. whitelisted_bedrock_models.txt is test-only data read by test_get_model_info.py and test_utils.py,
  not production configuration.


  Reuse BaseAWSLLM.get_bedrock_invoke_provider from B591 (litellm/llms/bedrock/base_aws_llm.py); its implementation
  remains with that prerequisite.


  Reuse AmazonInvokeAgentConfig.__init__ from B652 (litellm/llms/bedrock/chat/invoke_agent/transformation.py); its
  implementation remains with that prerequisite.


  Reuse AmazonAgentCoreConfig.__init__ from B653 (litellm/llms/bedrock/chat/agentcore/transformation.py); its implementation
  remains with that prerequisite.


  Provider composition changes existing chat dispatch, not route registration: add the HTTP dispatch case through
  the booted proxy for POST /v1/chat/completions and /chat/completions with the source provider prefix. Assert upstream
  request, auth, response status, error type/param/code and response headers. Keep the existing router as the sole
  route owner; pure helper cases exercise the other typed provider operations without calling FastAPI globals.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Named case contracts: converse_route_dispatch: Parse non-None additional_drop_params with the existing typed adapter,
  then select route from model, request_params and that value through B598. Converse strips the B2203 route prefix
  and calls B610 with caller-or-global custom_prompt_dict, supplied extra_headers, client, base and key; it does
  not discard merged headers. invoke_route_dispatch: Other routes use B010 HTTP completion with provider bedrock
  and the original model. Converse_like removes every occurrence of converse_like/ using string replace and calls
  HTTP composition with provider bedrock. Neither branch passes shared_session or ctx.provider_config; preserve
  the actual omissions. runtime_chat_route: The runtime OpenAI/chat-completions families selected by the config
  selector invoke installed B619/B620 through HTTP composition; preserve their distinct transformed bodies and stream
  conversion rather than routing them through Converse. native_messages_route: Native Messages config precedence
  is explicit claude_platform -> B656, explicit converse -> None (chat bridge), explicit mantle -> B625, then case-sensitive
  claude anywhere -> B622, otherwise None. It does not treat uppercase Claude as this final match. mantle_provider_route:
  The separate bedrock_mantle main branch chooses base explicit/global/BEDROCK_MANTLE_API_BASE and key explicit/global/BEDROCK_MANTLE_API_KEY,
  headers supplied-truthy/global, then merges B625 config defaults only for absent optional keys. Call B010 with
  original provider, stream/shared_session and B196 encoding, without injecting extra_headers. nova_provider_route:
  The separate amazon_nova main branch chooses key explicit, litellm.amazon_nova_api_key, AMAZON_NOVA_API_KEY, then
  litellm.api_key; base explicit, global, AMAZON_NOVA_API_BASE, https://api.nova.amazon.com/v1. Call the OpenAI-like
  B038 handler with ctx.custom_prompt_dict and original optional map; no owned headers/client/acompletion argument
  is added. installed_agent_operation: Config tags agent and agentcore select B652 and B653; claude_platform resolves
  its config before stripping its model route via B598 and passes that config explicitly to HTTP completion, including
  shared_session. Do not introduce an interim unsupported-agent error. unknown_model_invoke_fallback: Unknown invoke-provider
  families select AmazonInvokeConfig and keep the invoke fallback; do not reject because a model is absent from
  whitelisted_bedrock_models.txt, which has only test callers. chat_config_selector: Compute route B598, invoke-provider
  B591 and base B2203 before selection. Routes claude_platform, converse/converse_like, openai, chat_completions,
  agent, agentcore, mantle select B656/B599/B619/B620/B652/B653/B625 respectively. Otherwise amazon -> Titan B614;
  anthropic -> legacy B615 only for B615 legacy-name list, else Claude B615; meta/llama -> B613; ai21/cohere/mistral
  -> B617; moonshot/deepseek_r1 -> B616; nova -> B614; qwen3/qwen2 -> B618; twelvelabs -> B617; everything else
  -> B611 AmazonInvokeConfig. legacy_boto_credentials: When optional aws_bedrock_client is present, warn exactly:
  'aws_bedrock_client' is a deprecated param. Please move to another auth method - https://docs.litellm.ai/docs/providers/bedrock#boto3---authentication.
  Pop the client before extracting frozen credentials. Truthy access_key/secret_key/token overwrite aws_access_key_id/aws_secret_access_key/aws_session_token;
  falsey values leave prior entries. Fill aws_region_name from client.meta only when absent or None, retaining empty
  strings. Native SDK clients enter through B159 credential snapshots, never a gateway subprocess.


  Write standalone Rust test bedrock_provider_credential_identity_isolation in betterlite-provider: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test bedrock_provider_secret_safe_failure in betterlite-provider: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  B2231 now owns both Bedrock config selectors and the legacy model list. This umbrella consumes their tags and
  constructs the already installed concrete adapters; keep the named selector composition cases here as end-to-end
  parity cases.


  ProviderConfigManager.get_provider_chat_config selection is B2230. Consume its closed tag and call the selected
  existing provider constructor at this composition boundary; do not call B157.


  Implement crates/betterlite-provider/src/bedrock_dispatch.rs with adjacent tests under bedrock_dispatch/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; leaf
  crates remain below this dispatcher and never import it. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_dispatch_cases in betterlite-provider with these exact named cases (one per oracle
  file): converse_route_dispatch, invoke_route_dispatch, runtime_chat_route, native_messages_route, mantle_provider_route,
  nova_provider_route, installed_agent_operation, unknown_model_invoke_fallback, bedrock_provider_dispatch_http,
  chat_config_selector, legacy_boto_credentials. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and
  captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_provider* using HelperCase: kind: helper
  and the externally tagged bedrock_provider variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_provider that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone bedrock_provider_unsupported_operation in betterlite-provider for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 197 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 285 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 660 planned, 675 maximum changed lines.
