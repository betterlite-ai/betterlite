id: B2222
title: Fireworks catalog metadata primitives
description: >-
  Lower Fireworks resource-name and capability lookup below shared metadata queries and the Fireworks provider.
  Preserve the raw catalog semantics; this task performs no provider request or parameter mapping.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/fireworks_ai/common_utils.py:
  resolve_fireworks_resource_name L66-L74. litellm/llms/fireworks_ai/chat/transformation.py: _get_fireworks_index
  L534-L555; _matches_on_hyphen_boundary L557-L569; _short_model_name L571-L576; _firerouter_family_cost_keys L578-L583;
  _get_model_cost_capability_exact L585-L597; _get_model_cost_capability L599-L620; get_model_cost_key L622-L623;
  get_provider_info L625-L651.


  Named case contracts: resource_names: Remove one fireworks_ai/ prefix. Preserve accounts/... names, FW- names
  and any name containing #. Prefix routers/... or models/... with accounts/fireworks/. A -fast suffix, exact firerouter/auto/auto-instant,
  or firerouter/ prefix maps under accounts/fireworks/routers/; all others map under accounts/fireworks/models/.
  Cost keys prepend fireworks_ai/ to that resolved name. exact_capability: Short names remove fireworks_ai/ then
  accounts/fireworks/models/. Try original model, fireworks_ai/short, fireworks_ai/accounts/fireworks/models/short,
  then fireworks_ai/accounts/fireworks/routers/firerouter only when the resolved resource starts accounts/fireworks/routers/firerouter/.
  Return the first non-None capability even when it is not a bool; malformed non-None entries propagate errors.
  indexed_fuzzy_capability: Build an index only for fireworks_ai/ catalog keys with dict entries and nonempty short
  keys, stripping accounts/fireworks/models/. Cache by catalog identity and B2217 mutation generation, not length.
  When no exact capability exists, allow equal names or matches at hyphen word boundaries, choose the longest key;
  equal-length ties retain insertion order. Missing capability None is skipped; False and non-bool values survive.
  provider_defaults: Return supports_function_calling=True and supports_prompt_caching=True by default. A non-None
  function-calling value overrides even with False. Include supports_reasoning only when truthy; include supports_vision
  and supports_pdf_input when non-None, preserving False. No other flags or metadata are inferred.


  Implement crates/betterlite-models/src/fireworks_catalog_metadata.rs with adjacent tests under fireworks_catalog_metadata/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function fireworks_catalog_metadata_cases in betterlite-models with these exact named cases (one
  per oracle file): resource_names, exact_capability, indexed_fuzzy_capability, provider_defaults. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/fireworks_catalog_metadata* using HelperCase:
  kind: helper and the externally tagged fireworks_catalog_metadata variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_fireworks_catalog_metadata that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 102 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 225 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 555 planned, 575 maximum changed lines.
