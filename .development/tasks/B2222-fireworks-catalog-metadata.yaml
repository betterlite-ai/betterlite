    fireworks_ai/short, fireworks_ai/accounts/fireworks/models/short, then fireworks_ai/accounts/fireworks/routers/firerouter
    only when the resolved resource starts accounts/fireworks/routers/firerouter/. Return the first non-None capability
    even when it is not a bool; malformed non-None entries propagate errors.'
