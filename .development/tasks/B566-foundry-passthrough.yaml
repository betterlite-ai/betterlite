  why: The native OCR logging entry point; bridge is excluded from the adapter.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/core/src/ocr/provider_config.rs#L162-L189
  why: Native OCR route recognition and normalized response projection.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/passthrough/transformation.py#L40-L207
  why: Own api_version_from, foundry_root, is_repeated_native_prefix, without_repeated_native_prefix, relay_query_params,
    AzureAIPassthroughConfig.__init__, AzureAIPassthroughConfig.is_streaming_request, AzureAIPassthroughConfig.get_complete_url,
    AzureAIPassthroughConfig.validate_environment, AzureAIPassthroughConfig.logging_non_streaming_response, AzureAIPassthroughConfig.logged_ocr_response,
    AzureAIPassthroughConfig.handle_logging_collected_chunks. Other functions in this file remain with the owners
    listed below.
