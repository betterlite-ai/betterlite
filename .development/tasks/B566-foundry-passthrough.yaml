deviations: []
out_of_scope:
- B026 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- >-
  litellm-rust/crates/core/src/ocr/provider_config.rs: resolve_provider_config and OCR response bodies belong to
  B092; this task recognizes the logged_ocr_response seam and invokes an injected OCR projector from that owner.
pitfalls:
- LITELLM_RUST=false does not bypass get_native_bridge for OCR logging, so the oracle must capture that seam explicitly.
budget:
  max_changed_lines: 450
  max_new_expects: 0
review_level: standard
