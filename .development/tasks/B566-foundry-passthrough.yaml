- text: 'foundry root path: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-passthrough/foundry-root-path.yaml.'
  proof:
  - case-foundry-root-path
  - oracle
  - helper-python
- text: 'repeated native prefix: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-passthrough/repeated-native-prefix.yaml.'
  proof:
  - case-repeated-native-prefix
  - oracle
  - helper-python
- text: >-
    query api version precedence: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-passthrough/query-api-version-precedence.yaml.
  proof:
  - case-query-api-version-precedence
  - oracle
  - helper-python
- text: 'ocr usage log: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-passthrough/ocr-usage-log.yaml.'
