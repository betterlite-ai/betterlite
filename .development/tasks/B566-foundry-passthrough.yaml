  - oracle
  - helper-python
- text: 'auth selection: the production result, omission or failure matches tools/oracle/cases/helpers/providers/foundry-passthrough/auth-selection.yaml.'
  proof:
  - case-auth-selection
  - oracle
  - helper-python
- text: New foundry_passthrough seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_logged_ocr_reply has newly committed malformed and boundary inputs replayed through production parsing.
  proof:
