checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-root-path
    why: The foundry-root-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_foundry_root_path$/)'
  - id: case-repeated-native-prefix
    why: The repeated-native-prefix behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_repeated_native_prefix$/)'
  - id: case-query-api-version-precedence
    why: The query-api-version-precedence behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_query_api_version_precedence$/)'
  - id: case-ocr-usage-log
    why: The ocr-usage-log behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_ocr_usage_log$/)'
  - id: case-stream-collected-log
    why: The stream-collected-log behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_stream_collected_log$/)'
  - id: case-auth-selection
    why: The auth-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_auth_selection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_passthrough.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_passthrough*")"
      && grep -lq 'foundry_passthrough' tools/oracle/fuzz/corpus/helper_case/foundry_passthrough* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_passthrough$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_passthrough)"
      && grep -q 'decode_logged_ocr_reply' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_passthrough.rs &&
      cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_passthrough_corpus$/)'
