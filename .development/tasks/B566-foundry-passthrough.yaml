id: B566
title: Foundry passthrough URLs and response projections
description: >-
  Add FoundryPassthroughPlan with route-prefix deduplication, query relaying and typed OCR/nonstream/stream logging
  projection. B101/B103 own routing and forwarding, and B092 owns the public OCR response API. Keep endpoint selection
  operator-derived.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/passthrough/transformation.py:
  api_version_from L40-L44; foundry_root L47-L51; is_repeated_native_prefix L54-L55; without_repeated_native_prefix
  L58-L72; relay_query_params L75-L85; AzureAIPassthroughConfig.__init__ L95-L97; AzureAIPassthroughConfig.is_streaming_request
  L99-L100; AzureAIPassthroughConfig.get_complete_url L102-L120; AzureAIPassthroughConfig.validate_environment L122-L137;
  AzureAIPassthroughConfig.logging_non_streaming_response L139-L166; AzureAIPassthroughConfig.logged_ocr_response
  L168-L189; AzureAIPassthroughConfig.handle_logging_collected_chunks L191-L207.


  Reuse B101 RelayShape, strip_leading_model_segment, model_group_from, format_url, logged_relay_shape and relayed_body.
  logged_ocr_response calls the native binding even when LITELLM_RUST=false: Python helper oracle cases capture
  its arguments with a stub; Rust behavior tests verify the OCR projection from the MIT native source without importing
  the bridge.


  Reuse api_key_header_for_base from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse get_azure_ai_auth_headers from B549 (litellm/llms/azure_ai/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: foundry_root_path: Parse the base, remove empty path segments, truncate at first exact case-sensitive
  models segment, remove query, retain fragment and strip trailing slash from final URL. No models segment preserves
  all path segments. repeated_native_prefix: Strip B101 model/model-group prefix first. Compare root suffix/native
  prefix case-insensitively, longest overlap first; remove overlap only when it covers the entire native endpoint
  or the endpoint starts openai. Partial overlap for non-openai endpoints remains; preserve kept root segment casing.
  query_api_version_precedence: An incoming mapping containing api-version wins even if its value is None/empty.
  Else truthy deployment api_version wins over the base query value. Invalid typed deployment version returns None;
  missing effective version preserves the original query mapping; otherwise merge api-version without copying other
  base query keys. ocr_usage_log: Nonstream logging first tries B548 chat/Responses projection, then OCR, then Foundry
  relay shapes, finally StandardPassThroughResponseObject from B101 relayed_body. OCR runs only for 200 and an available
  injected/native binding; pass model, prefix-stripped endpoint and raw content. None stays None; ValueError/RuntimeError
  (including model-validation errors) warn azure_ai passthrough: OCR body from <url> is not costable: <error> and
  fall through. Successful OCR sets call_type=aocr. stream_collected_log: Collected chunks delegate B548 unchanged;
  no Foundry-specific stream aggregation. Assert B101 relay shape selection and generic body fallback independently
  of OCR availability. auth_selection: Get base through B549; missing base raises ValueError: Azure AI api base
  not found: set `api_base` on the deployment or AZURE_AI_API_BASE. B549 auth overwrites matching caller headers,
  selecting api-key header by base. Streaming detection is truthiness of request_data.stream for every endpoint.
  foundry_relay_shape_literals: After Azure and OCR projections miss, /rerank maps to arerank plus RerankResponse;
  /providers/blackforestlabs/v1/flux-2-pro maps to aimage_generation plus ImageResponse. B101 owns the shape matching
  and validation, with no extra Foundry endpoints.


  Write standalone Rust test passthrough_credential_identity_isolation in betterlite-foundry: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test passthrough_secret_safe_failure in betterlite-foundry: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-foundry/src/passthrough.rs with adjacent tests under passthrough/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function passthrough_cases in betterlite-foundry with these exact named cases (one per oracle file):
  foundry_root_path, repeated_native_prefix, query_api_version_precedence, ocr_usage_log, stream_collected_log,
  auth_selection, foundry_relay_shape_literals. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_passthrough* using HelperCase: kind:
  helper and the externally tagged foundry_passthrough variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_passthrough that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_logged_ocr_reply consumes OCR passthrough response bytes for the selected OCR projector
  in crates/betterlite-foundry/src/passthrough.rs (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_passthrough.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_passthrough.
  The adjacent test replays_the_foundry_passthrough_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 142 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 205 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 555 planned, 575 maximum changed lines.
