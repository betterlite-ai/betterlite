out_of_scope:
- B026 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- 'litellm-rust/crates/core/src/ocr/provider_config.rs: resolve_provider_config and OCR response bodies belong to
  B092; this task recognizes the logged_ocr_response seam and invokes an injected OCR projector from that owner.'
pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_passthrough in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/passthrough.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_passthrough.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Only the exact models path segment truncates the Foundry root; Models is retained.
- Partial path overlap is removed only for an openai-prefixed native endpoint.
