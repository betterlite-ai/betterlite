  paths:
  - crates/betterlite-foundry/Cargo.toml
  - crates/betterlite-foundry/src/lib.rs
  - crates/betterlite-foundry/src/error.rs
  - crates/betterlite-foundry/src/passthrough.rs
  - crates/betterlite-foundry/src/passthrough/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/foundry/passthrough.rs
  - tools/oracle/src/helpers/foundry/passthrough/**
  - tools/oracle/helpers/foundry_passthrough.py
  - tools/oracle/helpers/foundry_passthrough/**
  - tools/oracle/cases/helpers/providers/foundry-passthrough/**
  - tools/oracle/fuzz/corpus/helper_case/foundry_passthrough*
  - crates/betterlite-foundry/fuzz/Cargo.toml
  - crates/betterlite-foundry/fuzz/fuzz_targets/foundry_passthrough.rs
  - crates/betterlite-foundry/fuzz/corpus/foundry_passthrough/**
  lint_tables: false
