checks:
  optional:
  - mutants
  commands:
  - id: case-foundry-root-path
    why: Parse the base, remove empty path segments, truncate at first exact case-sensitive models segment, remove
      query, retain fragment and strip trailing slash from final URL. No models segment preserves all path segments.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_foundry_root_path$/)'
  - id: case-repeated-native-prefix
    why: Strip B101 model/model-group prefix first. Compare root suffix/native prefix case-insensitively, longest
      overlap first; remove overlap only when it covers the entire native endpoint or the endpoint starts openai.
      Partial overlap for non-openai endpoints remains; preserve kept root segment casing.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_repeated_native_prefix$/)'
  - id: case-query-api-version-precedence
    why: An incoming mapping containing api-version wins even if its value is None/empty. Else truthy deployment
      api_version wins over the base query value. Invalid typed deployment version returns None; missing effective
      version preserves the original query mapping; otherwise merge api-version without copying other base query
      keys.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_query_api_version_precedence$/)'
  - id: case-ocr-usage-log
    why: 'Nonstream logging first tries B548 chat/Responses projection, then OCR, then Foundry relay shapes, finally
      StandardPassThroughResponseObject from B101 relayed_body. OCR runs only for 200 and an available injected/native
      binding; pass model, prefix-stripped endpoint and raw content. None stays None; ValueError/RuntimeError (including
      model-validation errors) warn azure_ai passthrough: OCR body from <url> is not costable: <error> and fall
      through. Successful OCR sets call_type=aocr.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_ocr_usage_log$/)'
  - id: case-stream-collected-log
    why: Collected chunks delegate B548 unchanged; no Foundry-specific stream aggregation. Assert B101 relay shape
      selection and generic body fallback independently of OCR availability.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_stream_collected_log$/)'
  - id: case-auth-selection
    why: 'Get base through B549; missing base raises ValueError: Azure AI api base not found: set `api_base` on
      the deployment or AZURE_AI_API_BASE. B549 auth overwrites matching caller headers, selecting api-key header
      by base. Streaming detection is truthiness of request_data.stream for every endpoint.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_auth_selection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_passthrough.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_passthrough*")"
      && grep -lq 'foundry_passthrough' tools/oracle/fuzz/corpus/helper_case/foundry_passthrough* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_passthrough$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_passthrough)"
      && grep -q 'decode_logged_ocr_reply' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_passthrough.rs &&
      cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_passthrough_corpus$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_secret_safe_failure$/)'
  - id: case-foundry-relay-shape-literals
    why: After Azure and OCR projections miss, /rerank maps to arerank plus RerankResponse; /providers/blackforestlabs/v1/flux-2-pro
      maps to aimage_generation plus ImageResponse. B101 owns the shape matching and validation, with no extra Foundry
      endpoints.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_foundry_relay_shape_literals$/)'
