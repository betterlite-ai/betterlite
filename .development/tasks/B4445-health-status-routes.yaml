dod:
  - text: convert_health_check returns the 12 keys in order, without updated_at, and prints checked_at and created_at in Python isoformat with +00:00 and a six-digit fraction only when it is not zero.
    proof: [convert-tests, oracle, helper-python]
  - text: A missing model_id returns the model argument; a model_id with no router, an erroring lookup or no deployment is a 404 with the exact message; a found deployment returns its model_name.
    proof: [target-tests, oracle, helper-python]
  - text: A missing store is HTTP 500 with "Database not initialized" on both history and latest.
    proof: [check-tests, oracle]
  - text: perform_health_check_and_save names the saved model by cli_model first, saves only with a store and a name, hands the save to the tracker, and returns the lists and their lengths.
    proof: [save-tests]
  - text: GET /health answers 500 "Model list not initialized" with no deployment list and no CLI model, and probes the CLI model when one is set.
    proof: [health-tests]
  - text: A caller who is not allowed gets 403 with the exact message for a targeted model or model_id, and a restricted caller sees only permitted deployments.
    proof: [health-tests]
  - text: With background checks on, the cache is filtered by the allowed or targeted ids, the missing-id warning field appears when no kept deployment has an id, and an unrestricted untargeted caller gets the cache as it is.
    proof: [health-tests]
  - text: A model-specific request with zero healthy endpoints answers 503 with the same body, and a non-admin gets the notice header and the stripped body.
    proof: [health-tests, oracle]
  - text: History returns the page object with the converted rows, honours the limit and offset ranges with 422 outside them, and a store call error is a 500 with the exact detail.
    proof: [history-tests, oracle]
  - text: Latest returns the object keyed by model_id or model_name with the total.
    proof: [latest-tests]
  - text: HTTP corpus cases replay through the shared HTTP-case parser.
    proof: [http-case-corpus]
  - text: Helper corpus cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: convert-tests
      why: the row-to-object conversion or the isoformat text is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_status_routes::tests::convert_/)'
    - id: target-tests
      why: the model_id lookup or one of its 404 cases is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_status_routes::tests::target_/)'
    - id: check-tests
      why: the missing-store error is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_status_routes::tests::check_/)'
    - id: save-tests
      why: the perform-and-save helper or its tracker hand-off is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_status_routes::tests::save_/)'
    - id: health-tests
      why: a step of GET /health is missing or out of order
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_status_routes::tests::health_/)'
    - id: history-tests
      why: GET /health/history is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_status_routes::tests::history_/)'
    - id: latest-tests
      why: GET /health/latest is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_status_routes::tests::latest_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4445)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4445 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4445/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added status-route helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/health_status_routes-*")" &&
        grep -lE '^[[:space:]]+b4445:' tools/oracle/fuzz/corpus/helper_case/health_status_routes-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: http-case-corpus
      why: the HTTP-case decoder does not replay the new health-status requests
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/http_case/health-status-*")" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'

oracle_cases:
  - tools/oracle/cases/health/status/history-no-database.yaml
  - tools/oracle/cases/health/status/latest-no-database.yaml
  - tools/oracle/cases/health/status/history-limit-zero-422.yaml
  - tools/oracle/cases/health/status/health-unknown-model-id-404.yaml
  - tools/oracle/cases/helpers/health-status-routes/convert-row.yaml
  - tools/oracle/cases/helpers/health-status-routes/resolve-target.yaml

deviations:
  - what: The database write after a live /health probe is handed to a tracker the server owns and drains at shutdown, not a detached task.
    why: Repository rules forbid detached tasks. The response still does not wait for the write, as in LiteLLM.
  - what: The background result cache arrives through the `HealthResultsSource` trait, not a module global.
    why: Dependencies come in through constructors; the filtering and responses are the same.
  - what: Error bodies reuse the proxy's existing HTTPException rendering.
    why: LiteLLM relies on FastAPI's default; the status and detail text match.

out_of_scope:
  - "The table store, aggregation, the persist decision and _save_health_check_to_db: B7640."
  - "is_proxy_admin, strip_admin_only_fields, health_accessible_model_names, caller_may_probe_deployment, resolve_targeted_model_ids and filter_health_check_results_by_model_ids: B4446. POST /health/test_connection: B4446."
  - "perform_health_check, the cycle and the strategy router verdict: B4443. Display field sets, targeting and health_check_filter_kwargs_from_general_settings: B4441."
  - "GET /health/shared-status: B4444. /health/services and /test: B4447. Readiness, liveliness, drain, license and callbacks routes: B4448."
  - "The code that fills the background result cache and runs the cycle on a timer: B4443 and the proxy_server owner (B124)."

pitfalls:
  - "model_id beats model: an unknown id is a 404 even when `model` names a real group, and the 404 comes before the access checks."
  - "The 503 rule looks at `healthy_count` in the result, and a result without that key counts as 0. The body stays the same."
  - "`restrict` is true for every non-admin and also for an admin whose allowed_models is not None; the 403 message uses model_id when it is set, else model."
  - "An admin who targets a model with background checks on still gets the cache filtered by targeted_ids; with no target the cache goes out untouched."
  - "The `warnings` field is added to the filtered copy only when targeted_ids is None, the kept list is non-empty and no kept deployment has a model_info.id."
  - "The deployment list is deep-copied before filtering, because the probe adds per-call fields to its entries."
  - "/health/latest keys by model_id or model_name, so two rows with an empty model_id and the same name collapse to one entry."
  - "The save after a live probe runs only with a store and a non-None model name; a probe of all models (no target, no cli model) writes nothing."
  - "history catches a store error as HTTP 500, but the missing-store 500 is raised before that catch so its detail has no 'Failed to retrieve' prefix."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
