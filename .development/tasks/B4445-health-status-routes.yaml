id: B4445
title: Health, history and latest health routes
description: >-
  Build the three routes that report model health, in a new betterlite-server module `health_status_routes`, plus the helpers
  they use. The table store and the persistence functions come from B7640 and the access helpers from B4446. Nothing in
  this task decides whether a result gets written to history: that is B7640.

  Mounting. One function `health_status_routes(state) -> Router` registers GET /health, GET /health/history and GET /health/latest
  and the umbrella B130 mounts it once. All three sit behind B052's `user_api_key_auth`, so a missing or wrong key is that
  pipeline's answer and this module never sees it. The state is built with constructor injection and holds what LiteLLM reads
  from proxy_server globals: the deployment list (`llm_model_list`, None until a router exists), the router (B844), `user_model`
  (the CLI model), `health_check_details` (bool), `health_check_concurrency` (Option<usize>), `use_background_health_checks`
  (bool), the general_settings health filter (B4441's `health_check_filter_kwargs_from_general_settings` result), a
  `HealthResultsSource` trait with `snapshot() -> HealthCheckResults` that returns the cache the background loop fills, an
  optional B7640 `HealthCheckRows`, a clock, and a tokio `TaskTracker` the server owns. Read crates/betterlite-server/src/health_cycle.rs
  (B4443) for `perform_health_check` and its result and take them as they are; define no second cycle seam.
  `HealthResultsSource` is this task's only new trait: nothing else plans to hand the background cache to a route (see notes).

  Helpers, all in this module.
  `check_prisma_client(rows) -> Result<&HealthCheckRows, HealthRouteError>` is `_check_prisma_client`: no store gives HTTP 500
  with detail `{"error": "Database not initialized"}`.
  `convert_health_check(row) -> serde_json::Value` is `_convert_health_check_to_dict`: an object with exactly these keys in this
  order: health_check_id, model_name, model_id, status, healthy_count, unhealthy_count, error_message, response_time_ms, details,
  checked_by, checked_at, created_at. There is no updated_at. checked_at and created_at are Python `datetime.isoformat()` text for a
  UTC value: `YYYY-MM-DDTHH:MM:SS` plus `.ffffff` (six digits) only when the microseconds are not zero, then `+00:00`. Stored values
  have millisecond precision, so a value with 123 ms prints `.123000`.
  `resolve_target_model_name(model, model_id, router) -> Result<Option<String>, HealthRouteError>` is
  `_health_endpoint_resolve_target_model_name`. An empty or missing model_id returns `model` unchanged. With a model_id and no
  router, or when the router's get_deployment (B844) errors (log "Error getting deployment for model_id {id}: {err}" at error
  level first) or returns None, the answer is HTTP 404 with detail `{"error": "Model with ID {model_id} not found"}`. Otherwise
  it returns the deployment's model_name. model_id wins over model, so an unknown id is a 404 even beside a known name.
  `perform_health_check_and_save(...)` is `_perform_health_check_and_save`. It runs B4443's `perform_health_check` with the model
  list, cli_model, target model, details flag, max_concurrency, model_id and the extra arguments (router and team_id on the
  router path, the settings filter on both). After it returns, and only when a store exists and `cli_model` or `target_model` is
  not None (the name is cli_model when set, else target_model), it hands B7640's `save_single` to the TaskTracker so the response
  does not wait for the write. It returns `{"healthy_endpoints", "unhealthy_endpoints", "healthy_count", "unhealthy_count"}`
  with the two counts being the list lengths.

  GET /health, query `model` and `model_id` (both optional strings). Steps in order: take the settings filter, note the start time,
  resolve the target name, then `is_admin = is_proxy_admin(caller)` (B4446) and `model_specific_request = bool(model or model_id)`.
  Post-processing of any result: if model_specific_request and `result.healthy_count` is missing or 0, the response status becomes
  503 (the body is unchanged). An admin gets the result as it is. Anyone else gets the header `Litellm-Health-Field-Notice` with
  the value "{fields} are admin-only on this endpoint", where fields are B4441's ADMIN_ONLY_HEALTH_DISPLAY_PARAMS joined with ", "
  in that set's order, and the result goes through B4446's `strip_admin_only_fields`.
  Then: (1) when the deployment list is None: if `user_model` is set, run `perform_health_check_and_save` with an empty model list,
  target None, cli_model = user_model and model_id None, and post-process it; otherwise HTTP 500 detail `{"error": "Model list not
  initialized"}`. (2) Otherwise compute `allowed_models = health_accessible_model_names(caller, router)` and
  `restrict = not is_admin or allowed_models is not None` (B4446). Deep-copy the deployment list and, when `restrict`, keep only
  those that B4446's `caller_may_probe_deployment` accepts. Compute `targeted_ids = resolve_targeted_model_ids(list, model,
  model_id, caller.team_id)`. When `restrict` and targeted_ids is Some and empty, HTTP 403 with detail `{"error": "key not allowed
  to health-check model_id {model_id}"}` if model_id is set, else `{"error": "key not allowed to health-check model {model}"}`.
  (3) With `use_background_health_checks`: if `restrict`, build `allowed_model_ids` from the kept deployments' model_info.id (ids
  that are non-empty only), use targeted_ids when Some else that set, and filter the cache snapshot with B4446's
  `filter_health_check_results_by_model_ids`. If targeted_ids is None, the kept list is non-empty and allowed_model_ids is empty,
  log a warning "health_endpoint: scoped key {user_id} has accessible models {models} but none of the matching deployments carry a
  model_info.id; background health-check cache will return an empty result." and add `"warnings": ["Some accessible deployments are
  missing model_info.id and were excluded from this response. Ask a proxy admin to populate model_info.id for these models."]` to the
  filtered result. Post-process and return. If not `restrict` and targeted_ids is Some, return the post-processed snapshot filtered
  by targeted_ids. If neither, return the post-processed snapshot as it is. (4) Without background checks: run
  `perform_health_check_and_save` with the kept list, target_model, no cli_model, model_id, the router, the caller's team_id and
  user_id, then post-process. Any error in the whole handler is logged at error level "litellm.proxy.proxy_server.py::health_endpoint():
  Exception occured - {err}" (keep the typo) and re-raised unchanged, so an HTTP error keeps its own status.

  GET /health/history, query `model` (optional), `status_filter` (optional), `limit` (default 100, 1 to 1000), `offset` (default 0,
  0 or more). A value outside the range is the proxy's usual 422 request-validation answer. Call `check_prisma_client`, then B7640's
  `history`, and answer `{"health_checks": [convert_health_check(row)...], "total_records": n, "limit": limit, "offset": offset}`
  with n the number of rows returned. `history` never errors (it returns an empty list), so a failed read is an empty page.
  An error from the store call itself is caught: log "Error getting health check history: {err}" and answer HTTP 500 with detail
  `{"error": "Failed to retrieve health check history: {err}"}`. The missing-store 500 is raised before this catch.

  GET /health/latest: `check_prisma_client`, then B7640's `fetch_latest`, and answer `{"latest_health_checks": {key: convert_health_check(row)},
  "total_models": n}` where key is model_id when non-empty, else model_name. A later row with the same key replaces the earlier one
  in the object but keeps the earlier position. n is the object's size.

  Error bodies. LiteLLM raises FastAPI HTTPException, which the proxy renders as `{"detail": <detail>}` with that status. Use
  the error type the proxy already has for that shape (B882 or B746; read crates/betterlite-server/src/ for it) and add no second one.

  Tests live in `health_status_routes::tests` with these prefixes: `convert_` (key order, isoformat forms), `target_` (the model
  and id rules), `check_` (the two results of check_prisma_client and the 500 shape), `save_` (perform_health_check_and_save: the
  name choice, the tracker hand-off, the returned counts), `health_` (each numbered step of GET /health with a fake cycle and a fake
  results source), `history_` and `latest_`. The oracle helper cases drive Python's `_convert_health_check_to_dict` and
  `_health_endpoint_resolve_target_model_name` with stub objects. HTTP oracle cases run the booted proxy without a database.

