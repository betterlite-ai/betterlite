id: B806
title: Team update validation and ordered persistence
description: >-
  Implement only POST /team/update; B1205 registers PATCH /team/{team_id} and calls the executor
  contract implemented here. Require DB (500 db_not_connected_error), team_id (400 No team id passed
  in), then nonnegative finite max_budget/team_member_budget/soft_budget (400 naming the field).
  B861 validates both durations and model budgets. Read the existing team: missing is 404 for proxy
  admins but 403 for everyone else, preventing ID probing. B800 strongest_role supplies access;
  no role is 403, and team admins must use B1200's filtered request, not the original resent fields.
  B2301 validates router weights; B745 enforces admin-only output estimates and batch token limits;
  B861 checks passthrough and disable_global_guardrails grants against stored metadata.

  A nonnull new soft_budget must be below requested nonnull max_budget or the stored cap; a nonnull
  new max_budget must exceed requested nonnull soft_budget or stored numeric soft_budget. Each is
  400 with its respective strictly lower/greater diagnostic. Explicit null still falls back to the
  stored counterpart for validation. For a nonempty destination organization different from current,
  non-proxy-admins require a live destination org_admin membership (403 otherwise). Then B805 validates
  models/limits/membership and may write organization memberships. Empty organization_id is rewritten
  to None; the subsequent B879 org lookup still falls back to the OLD organization for B1204 limits.
  B803 applies a max-budget guard for no organization or team-admin access, and always checks model
  ceiling authority. Preserve these differences when unsetting the organization.

  Serialize only supplied fields; model_max_budget=null becomes {}. Strip the server-owned
  team_member_budget_id from submitted metadata. Only an explicitly present metadata field invokes
  B801 validation, with existing metadata stripped of that server key and alias chosen from request
  when nonnull, otherwise stored alias. B1205 computes budget reset fields: omitted duration preserves,
  null clears, nonnull recomputes; nonempty budget_limits initializes each reset_at. If member fields
  or metadata-backed fields are written without metadata, deep-copy existing metadata. A submitted
  dict restores the stored server-owned budget ID after callback validation; metadata=null does not.

  For any supplied member budget/rate/duration fields, choose B802 upsert when at least one value is
  nonnull, otherwise clear. Upsert precedes membership backfill and B805 cache eviction when a truthy
  budget ID and nonempty roster exist. No member fields means only removing those input-only keys.
  Next, a nonnull object_permission calls B818's all-proxy MCP guard and B1205's object-permission
  write. B861 moves metadata-backed fields, then B2304.encrypt_callback_vars transforms every nonnull
  metadata object BEFORE persistence. Test logging/callback_settings credentials with the real codec,
  already-prefixed values and the source helper's encryption-error plaintext fallback; do not silently
  replace it with mandatory encryption. Secret-manager settings are not callback_vars and are left
  as the helper specifies. Returned rows and audit patches retain the source stored representation.

  If model_aliases was supplied, remove it and call B805's model-table upsert, keeping a returned
  nonnull model_id. JSON-serialize nonnull router_settings, then B124.jsonify_team_object serializes
  database JSON fields. B803 writes the team, using its conditional budget update when required.
  A None row or None team_id becomes 400 Team doesn't exist. On success, log the team ID, call
  B819.sync_team_access_group_membership, refresh the cached team through B801, then, when B065's
  audit policy is enabled, schedule B805's audit with litellm-changed-by. Return {team_id, data: row}.
  The route has NO transaction encompassing these writes; org/member budgets, permissions and aliases
  can remain after a failed final team write. Group sync is AFTER the team write and BEFORE cache
  refresh, unlike B804's create transaction. A sync failure leaves the stored update in place.

  Its own except delegates to B124.handle_exception_on_proxy: HTTPException keeps status but becomes
  internal_server_error with openai_error_param; ProxyException keeps its type/status/param/code;
  other failures use status_code or 500 and internal_server_error. Compare these fields and content-type
  through the booted proxy, ignoring only /error/message wording. There is no local premium_user branch;
  no-license differences are owned by B861/B801. B1200 owns team_admin_editable_team_fields and B065
  owns litellm.store_audit_logs/LITELLM_STORE_AUDIT_LOGS; do not add duplicate config readers here.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  update_team (L2109-L2565; 398 source lines).


  Route cases name the concrete errors and write boundaries below. Do not register PATCH again or
  compare this handler through the helper oracle; B1205 uses the shared executor to return its own shape.


  Inspect callback ciphertext and earlier member/alias writes in B860 Postgres fixtures configured by
  POSTGRES_TEST_URL, falling back to testcontainers only when absent and failing on setup errors.


  Sizing: 398 nonblank, noncomment lines include the long route documentation; reuse all named
  dependencies within 330 production, 395 behavior/Postgres tests and 65 wiring lines, 790 within 800.




  Register team_update using B052 auth and B865's management completion effects at the existing decorator.
