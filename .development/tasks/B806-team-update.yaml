      object_permission_null_skip, callback_ciphertext_stored, callback_cipher_failure_fallback,
      callback_ciphertext_unchanged, aliases_before_team_write, router_json_storage,
      missing_written_row_400, sync_before_cache_refresh, audit_after_refresh,
      response_nested_row, http_exception_mapping, proxy_exception_mapping and unknown_failure_500.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_update::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_update::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_update::tests::postgres_failure_effects$/)'
