id: B4261
title: Cached semantic text ranking
description: >-
  Add betterlite-semantic, a utility crate for embedding-similarity ranking over short texts with vector caching.
  The SemanticTextIndex holds at most max_entries vectors across all embedding models combined (default 5000),
  evicting the least recently searched texts first when the combined total exceeds the limit.
  Cache keys are (embedding_model, text) pairs, so different models keep separate vectors for the same text.
  It takes an Embedder, an async callable that converts a sequence of texts to a sequence of vectors (tuples of floats).
  The public method scores(query, texts, embed, embedding_model) returns cosine similarity scores for the query against each text in order.
  On the first search for a text, both are embedded. On subsequent searches with the same model, only the query is embedded and cached texts are reused.
  If newly embedded and cached vectors have different dimensions (detected by the embedder changing its output dimension), the index retries with only the unique texts.
  Embeddings that raise HTTP exceptions propagate immediately. Other errors (OpenAI SDK errors, budget exceeded, mismatched counts) return an EmbeddingFailed result with a reason.
  Empty input returns an empty scores tuple. Duplicate texts in the input are embedded once and their scores reused.
  Zero norms (all-zero vectors) produce 0.0 similarity, handled by returning 0.0 when the denominator is zero.
  Vectors are MappingProxyType (immutable) and the cache never exposes mutable state to callers.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-semantic/**
    - tools/oracle/**
  lint_tables: false
