deviations:
  - what: Client selection rebuilds the PointFiveUploadClient for every flush, not reusing a connection pool.
    why: LiteLLM stores the client once per PointFiveLogger instance; betterlite rebuilds on every send_batch to pick up changes from the proxy UI without restarting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/pointfive/logger.py#L119-L123
  - what: Periodic flush always pings an empty queue instead of skipping the flush entirely.
    why: LiteLLM's parent CustomBatchLogger skips empty queues; betterlite sends a liveness ping to PointFive immediately to confirm setup without requiring an event.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/pointfive/logger.py#L153-L164
  - what: Batch flush fails only on retryable errors; non-retryable failures log and drop without propagating.
    why: LiteLLM propagates any failure; betterlite distinguishes retryable (429,5xx) from non-retryable (4xx other than 429) to avoid deadlock.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/pointfive/logger.py#L279-L302

out_of_scope:
  - "CustomBatchLogger base class, __init__, periodic_flush and flush_queue are inherited from B256; this task overrides periodic_flush and calls super().flush_queue() and super().periodic_flush()."
  - "Redaction predicates: B189 owns redact_standard_logging_payload_from_model_call_details; B188 owns should_redact_message_logging; B190 owns redacted_standard_logging_payload structure."
  - "HTTP client pooling and get_async_httpx_client (B173)."
  - "PointFiveUploadClient construction, ping, upload and PointFiveUploadError exception (B3073)."
  - "Serialization and encoding: chunk_lines, serialize_records, encode_lines (B3073)."
  - "IntegrationHealthCheckStatus type and callback/health check registration contracts (B189)."
  - "PointFiveInitParams, PointFiveUploadTarget, PointFiveUploadFailure types (B3073)."
  - "get_secret_str secret resolution function (B129)."
  - "Configuration storage and retrieval (B3075 owns finops config persistence)."
  - "Callback registry and dispatcher (B189 owns callback registration and routing)."
  - "Server startup registration and lifecycle (owned by server initialization layer)."

pitfalls:
  - The periodic flush task must be restarted if its event loop has closed; check task.done() and task.get_loop().is_closed() before deciding it is alive.
  - _start_batch_flush_task must check if the running task is still alive before creating a duplicate; skip if one is already running and not yet done.
  - _drop_overflow must never trim the queue while _flushing is true, since the flush holds a snapshot; the next event after flush finishes will trim any overflow that arrived during the upload.
  - skip_if_flushing must return early from flush_queue if already flushing and the flag is set; otherwise every threshold-crossing event during an upload would start its own flush, turning one burst into a stream of small batches.
  - An empty queue calls _ping and returns without raising; ping failures must not fail the flush itself, only log a warning.
  - Redaction in _record_for applies both the callback-local turn_off_message_logging and the framework's should_redact_message_logging check; both may be true independently.
  - The preserve-events-during-flush flag allows new events to arrive while a flush is running; they are captured by the next flush, not dropped.
  - The given_upload_client field allows injection; when None, always reconstruct via _upload_client_for on each access.
  - PointFiveUploadError is raised only on retryable failures; non-retryable failures log and drop the chunk instead.

