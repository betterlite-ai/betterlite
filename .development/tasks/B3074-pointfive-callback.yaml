id: B3074
title: Buffer and redact PointFive callback events
description: >-
  Build PointFive's callback logger in `betterlite-logging::finops::pointfive`.
  Implement per-event buffering with periodic flush, immediate idle ping on first
  startup, background batch flush when threshold is reached, redaction on both
  success and failure callbacks, queue overflow removal with warning, and removal
  of already-shipped chunks before raising retryable errors.

  Inherit from CustomBatchLogger (B256) and implement async callback hooks for
  success and failure events. Resolve API key and URL from litellm.pointfive_params
  (with Mapping fallback), then POINTFIVE_API_KEY/POINTFIVE_API_URL environment,
  then DEFAULT_API_URL constant, using B129's get_secret_str for secret resolution.
  Apply redaction via B189's redact_standard_logging_payload_from_model_call_details,
  B188's should_redact_message_logging check, and B190's redacted_standard_logging_payload
  structure. Upload via B3073's PointFiveUploadClient and PointFiveUploadError, serialize
  with B3073's chunk_lines/serialize_records/encode_lines, and send health checks through
  IntegrationHealthCheckStatus. Configuration: PointFiveInitParams with batch_size (default 10),
  flush_interval (default 300), max_batch_bytes (default 5000), turn_off_message_logging (default false)
  and max_upload_retries (inherited from B3073).

scope:
  paths:
    - crates/betterlite-logging/src/finops/pointfive.rs
    - crates/betterlite-logging/src/finops/pointfive/**
  lint_tables: false

