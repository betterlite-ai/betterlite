dod:
  - text: PointFiveLogger inherits from CustomBatchLogger and preserves constructor parameter start_periodic_flush flag.
    proof: [pointfive-logger-init]
  - text: API key is resolved from params.api_key, then POINTFIVE_API_KEY, then raises ValueError if neither is set.
    proof: [pointfive-logger-auth]
  - text: API URL is resolved from params.api_url, then POINTFIVE_API_URL, then DEFAULT_API_URL.
    proof: [pointfive-logger-auth]
  - text: The upload_client property reconstructs PointFiveUploadClient from current params on each access, so UI edits apply without restart.
    proof: [pointfive-logger-lazy]
  - text: periodic_flush sends an empty ping on first call, then continues with parent's interval loop.
    proof: [pointfive-logger-ping]
  - text: async_log_success_event and async_log_failure_event both queue the event via _enqueue, applying redaction.
    proof: [pointfive-logger-enqueue]
  - text: _record_for applies redact_standard_logging_payload_from_model_call_details, then checks should_redact_message_logging and applies redacted_standard_logging_payload.
    proof: [pointfive-logger-redaction]
  - text: _enqueue restarts the periodic flush task if it has died, appends the record, drops overflow, and triggers batch flush if batch_size is reached.
    proof: [pointfive-logger-lifecycle]
  - text: _drop_overflow holds the queue to max_queue_size by dropping oldest records only when not already flushing, with warning log.
    proof: [pointfive-logger-overflow]
  - text: _start_batch_flush_task spawns flush_queue(skip_if_flushing=true) as a background task, or skips if one is already running.
    proof: [pointfive-logger-batch]
  - text: flush_queue pings the server when the queue is empty, otherwise flushes with skip_if_flushing honored.
    proof: [pointfive-logger-flush]
  - text: async_send_batch chunks the pending queue, encodes and uploads each chunk, removes shipped chunks on success, and raises PointFiveUploadError on retryable failure while keeping the failed chunk queued.
    proof: [pointfive-logger-send]
  - text: A non-retryable upload failure logs the error and drops the chunk without raising.
    proof: [pointfive-logger-send]
  - text: async_health_check returns unhealthy with ValueError message if API key is missing, or calls upload_client.ping and reports its result.
    proof: [pointfive-logger-health]

