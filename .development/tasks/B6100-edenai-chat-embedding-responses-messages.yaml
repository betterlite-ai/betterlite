  - url: https://www.edenai.co/docs/v3/llms/embeddings
    why: Embedding endpoint and the top-level cost field.
  - url: https://www.edenai.co/docs/v3/llms/responses
    why: Responses endpoint and usage.cost.
  - url: https://www.edenai.co/docs/api-reference/anthropic-messages/create-anthropic-message
