    - crates/betterlite-openai/src/edenai_common.rs
    - crates/betterlite-openai/src/edenai_common/**
    - crates/betterlite-openai/src/edenai_chat.rs
    - crates/betterlite-openai/src/edenai_chat/**
    - crates/betterlite-openai/src/edenai_embedding.rs
    - crates/betterlite-openai/src/edenai_embedding/**
    - crates/betterlite-openai/src/edenai_responses.rs
    - crates/betterlite-openai/src/edenai_responses/**
    - crates/betterlite-core/src/edenai_messages.rs
    - crates/betterlite-core/src/edenai_messages/**
    - crates/betterlite-openai/fuzz/Cargo.toml
    - crates/betterlite-openai/fuzz/fuzz_targets/edenai_cost_reply.rs
