dod:
  - text: The cost is read from a JSON object, raw bytes or a header map, and anything unreadable gives no cost.
    proof: [edenai-common-tests, edenai-cost-corpus, helper-python, helper-case-corpus]
  - text: Key and base resolution, the missing-key error, the Authorization and Content-Type headers and the endpoint URL match LiteLLM.
    proof: [edenai-common-tests, helper-python, helper-case-corpus]
  - text: Chat adds reasoning_effort by capability, forces include_usage on streams, lifts the cost into hidden params and usage, and lists models with the edenai/ prefix.
    proof: [edenai-chat-tests, helper-python, helper-case-corpus]
  - text: Embedding params, URL, request body order and cost lift match LiteLLM.
    proof: [edenai-embedding-tests, helper-python, helper-case-corpus]
  - text: Responses auth, URL, cost lift, no fake stream and no websocket match LiteLLM.
    proof: [edenai-responses-tests, helper-python, helper-case-corpus]
  - text: Messages checks the key before the policy, builds the /v3/v1/messages URL and records the reply cost in the call log.
    proof: [edenai-messages-tests, helper-python, helper-case-corpus]
  - text: The new helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: edenai-common-tests
      why: The shared Eden helpers or the cost reader are missing or fail
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_common::/) - test(replays_the_edenai_cost_reply_corpus)'
    - id: edenai-chat-tests
      why: The chat differences from the OpenAI config are missing or fail
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_chat::/)'
    - id: edenai-embedding-tests
      why: The embedding transform is missing or fails
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_embedding::/)'
    - id: edenai-responses-tests
      why: The Responses overrides are missing or fail
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^edenai_responses::/)'
    - id: edenai-messages-tests
      why: The Messages key check, URL or cost record is missing or fails
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^edenai_messages::/)'
    - id: edenai-cost-corpus
      why: The cost and model catalog fuzz target or its fresh replay corpus is missing
      run: >-
        test -f crates/betterlite-openai/fuzz/fuzz_targets/edenai_cost_reply.rs &&
        grep -q 'name = "edenai_cost_reply"' crates/betterlite-openai/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/edenai_cost_reply)" &&
        cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_edenai_cost_reply_corpus)'
    - id: helper-python
      why: The strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b6100.py)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Newly added Eden AI helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/edenai_wire-*")" &&
        grep -lE '^[[:space:]]+b6100:' tools/oracle/fuzz/corpus/helper_case/edenai_wire-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/edenai-wire/reported-cost-shapes.yaml
  - tools/oracle/cases/helpers/edenai-wire/key-and-base-resolution.yaml
  - tools/oracle/cases/helpers/edenai-wire/missing-key-error.yaml
  - tools/oracle/cases/helpers/edenai-wire/chat-supported-params-and-stream-options.yaml
  - tools/oracle/cases/helpers/edenai-wire/chat-cost-lift-and-chunk-usage.yaml
  - tools/oracle/cases/helpers/edenai-wire/model-catalog.yaml
  - tools/oracle/cases/helpers/edenai-wire/embedding-request-and-url.yaml
  - tools/oracle/cases/helpers/edenai-wire/responses-url-and-flags.yaml
  - tools/oracle/cases/helpers/edenai-wire/messages-key-url-and-cost.yaml
deviations:
  - what: A /models body that does not match {"data":[{"id":..}]} gives EdenAiError with status 500 and a message that names the missing field.
    why: LiteLLM lets a pydantic ValidationError escape from model_validate, which the proxy reports as a generic 500. A typed error keeps the status and names the field.
  - what: A non-mapping stream_options on a stream request is a 400 error that names the field.
    why: LiteLLM lets a pydantic ValidationError escape from the TypeAdapter, so the client sees an unhandled 500 and not a clear message.
out_of_scope:
  - B5838 owns audio_transcription, videos, text_to_speech and image_generation, and uses edenai_common from here.
  - B8311 owns _complete_edenai and the embedding branch in litellm/main.py (key order api_key, litellm.api_key, EDENAI_API_KEY), reading EDENAI_API_KEY and EDENAI_API_BASE into EdenAiEnv, sending the /models GET, building the configs in dispatch and the HTTP oracle cases through the booted proxy. The ProviderConfigManager branches in litellm/utils.py are B2230 and B5360, and the get_llm_provider_logic branches are B209 and B211.
  - B2230 owns choosing EdenAIChatConfig for provider edenai.
  - B668, B503 and B504 own the OpenAI chat parent methods, B006 and B004 the embedding contract and response builder, B506 to B508 the Responses parent methods, and B1426 the JSON Messages policy.
  - B8580 binds edenai_messages into the Messages config selection and owns its booted HTTP cases; this task adds no route.
  - B1717 owns set_response_cost_in_hidden_params and the cost recorder that reads the call log.
  - The pre_call and post_call logging calls inside the Python embedding transform belong to the caller (B249 hooks), which logs the parsed body before this transform runs.
  - Usage cost on a streamed Responses event comes from the shared usage-cost lift, not from edenai_responses.
pitfalls:
  - The embedding body puts the optional params after model and input, so an optional param named model or input replaces them.
  - Responses passes the resolved Eden base into the OpenAI URL builder, so OPENAI_BASE_URL, OPENAI_API_BASE and litellm.api_base never apply to Eden.
  - The Responses headers step uses only the key in litellm_params, then litellm.api_key, then EDENAI_API_KEY, and adds no Content-Type.
  - The chat get_models request has no Authorization header at all, and a failed status is EdenAiError while a bad body is not.
  - The cost reader accepts the header name x-edenai-cost inside a JSON body and the plain key cost inside a header map, because both aliases are tried on every input.
  - The chat chunk parser sets the cost on usage only when the parsed chunk has a usage, so a cost on a chunk with no usage is dropped silently.
  - Messages calls require_api_key before the policy resolves its own key, so the explicit key, then litellm.api_key and then EDENAI_API_KEY decide the key and a missing one never reaches the policy.
  - Messages writes the cost to the call log's response_cost, not to hidden params like the other three families.
  - Streams only get include_usage when the request stream flag is true, and the existing stream_options keys survive.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
