id: B6100
title: Eden AI credentials, chat, embeddings, Responses and Messages
description: >-
  Build the first half of the Eden AI provider (litellm/llms/edenai): the shared helpers in common_utils.py and the four
  text endpoint families, chat, embedding, responses and messages. Audio, video, speech and image are B5838. Eden AI is an
  OpenAI-shaped gateway at https://api.edenai.run/v3. Every config here calls the matching OpenAI config and then lifts
  the real per-request cost Eden puts in the answer. All of it is pure transforms: nothing here sends a request, reads the
  environment or registers a route. B8311 wires the configs into dispatch.

  Modules. In betterlite-openai: edenai_common, edenai_chat, edenai_embedding, edenai_responses (each a file plus a folder
  with tests.rs). In betterlite-core: edenai_messages, because the Messages policy it composes (B1426) lives in
  betterlite-core and a provider leaf must not import core. Credentials and settings are plain arguments. Define
  EdenAiEnv, a struct the caller fills, with api_key (EDENAI_API_KEY), api_base (EDENAI_API_BASE) and global_api_key
  (litellm.api_key). Do not add a config section.

  edenai_common (common_utils.py). Constants EDENAI_API_BASE "https://api.edenai.run/v3" and EDENAI_COST_HEADER
  "x-edenai-cost". EdenAiError carries message, status_code and headers (the type behind EdenAIException, built on B2202's
  BaseLLMException projection). resolve_api_base(api_base, env) is the explicit base, then env.api_base, then the default.
  resolve_api_key(api_key, env) is the explicit key, then env.api_key. require_api_key(api_key, model, env) resolves the
  explicit key, then env.global_api_key, then env.api_key, and when nothing is found returns B184's AuthenticationError
  (status 401, provider edenai, the given model) with the message "Missing Eden AI API key: set EDENAI_API_KEY or pass
  api_key". authorized_headers(headers, api_key, model, env) returns the headers plus Authorization "Bearer <key>" taken
  from require_api_key, replacing a caller Authorization. json_headers does the same and also sets Content-Type
  "application/json", replacing a caller value. endpoint_url(api_base, path, env) is the resolved base with trailing
  slashes removed, then "/" and the path. pick(params, keys) keeps only the listed keys, in the order of params, and is used
  by B5838 as well. reported_cost reads the key "cost" from a JSON object, or the header "x-edenai-cost" from a header map.
  Give it three entry points: from a JSON value, from raw body bytes and from headers. An invalid value, a non-object body or
  undecodable bytes give None, never an error. Its Python is a pydantic model with AliasChoices("cost", "x-edenai-cost")
  and a lax float, so the oracle cases decide what counts as a number (integer, numeric string, bool, null) and which alias
  wins when both are present. Use the numeric type B1717's cost argument takes. The decoders are reported_cost_from_bytes
  (any bytes from the provider) and parse_model_catalog (the /models body), both fuzzed.

  edenai_chat (chat/transformation.py). Delegate to B668/B503/B504 and add only these differences. Supported params are the
  parent list plus reasoning_effort when B2221's supports_reasoning is true for the model under provider edenai.
  get_api_key(api_key) is resolve_api_key and get_api_base(api_base) is resolve_api_base. transform_request calls the parent
  and, only when the request has a truthy stream, replaces stream_options with the existing options (a null or absent value
  counts as empty) plus include_usage true; a non-mapping stream_options is a typed error naming the field. transform_response
  calls the parent and then records the cost found in the raw body bytes into the response hidden params through B1717's
  set_response_cost_in_hidden_params. The streaming chunk parser runs B504's parser, reads the cost from the chunk, and when
  both a cost and a parsed usage exist sets usage.cost; otherwise it changes nothing. get_error_class returns EdenAiError.
  get_models builds the URL "<resolved base>/models" and parses the reply: a non-success status is EdenAiError with that
  status, the body text and headers; a success body is {"data":[{"id":..}]} and the result is "edenai/<id>" per entry, in
  order. The GET sends no Authorization header. The caller sends it, as with B5991's injected lookup.

  edenai_embedding (embedding/transformation.py), over B006. Supported params are exactly dimensions, encoding_format and
  user. map_openai_params returns optional_params overlaid with only those keys from non_default_params. Headers are
  json_headers. The URL is endpoint_url(api_base, "embeddings"). The request body is model, input, then every optional
  param, so an optional param named model or input overwrites them. The response is built from the JSON body as an embedding
  response through B004's convert_to_model_response_object, then the cost from the same body is stored in hidden params.
  get_error_class returns EdenAiError.

  edenai_responses (responses/transformation.py), over B506/B507/B508. Provider tag edenai. Headers: authorized_headers with
  the key from litellm_params only (never a Content-Type). The URL is B508's get_complete_url called with the already
  resolved Eden base, so the OpenAI base env vars and litellm.api_base are never read, and the result is the base without
  trailing slashes plus "/responses". The reply is B508's reply with usage.cost stored in hidden params when present.
  should_fake_stream is false for every model and supports_native_websocket is false. get_error_class returns EdenAiError.
  The cost on streamed events is lifted by the shared usage-cost code, not here.

  edenai_messages (messages/transformation.py), in betterlite-core over B1426's JSON Messages policy. Build the Eden
  descriptor in code with B1424's descriptor type: slug edenai, base_url EDENAI_API_BASE, api_key_env EDENAI_API_KEY,
  api_base_env EDENAI_API_BASE, base class openai_gpt, no constraints. Environment validation first runs require_api_key
  and then B1426's validation with that key, so a missing key is AuthenticationError and never reaches the policy. The URL is
  B1426's, which gives https://api.edenai.run/v3/v1/messages by default. The reply is B1426's native reply, after which a
  cost read from the reply object is written to the call log's response_cost (B247's mutable call log, the field spend
  logging reads), and a reply without a cost leaves it alone. Eden sends no cost in Messages streams, so streams use the
  price map and need no code. get_error_class returns EdenAiError.

  Helper b6100 calls these functions with typed inputs (no network, no environment) and compares the pinned LiteLLM
  classes. Source size is 388 nonblank, noncomment lines. Plan about 420 production lines, 320 test lines, 200 adapter lines
  and 60 fuzz and wiring lines.
