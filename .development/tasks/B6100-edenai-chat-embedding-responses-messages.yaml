    - tools/oracle/src/helpers/openai/b6100/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/common_utils.py#L18-L80
    why: Constants, the exception, key and base resolution, the missing-key error, cost extraction and the shared header and URL helpers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/chat/transformation.py#L31-L87
    why: Stream options with include_usage, the chunk parser that sets usage.cost, reasoning_effort support and the static key and base getters.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/chat/transformation.py#L89-L144
    why: Response cost lift, error class, iterator factory and the unauthenticated /models fetch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/embedding/transformation.py#L24-L97
    why: Supported params, the request body and the cost lift on the embedding reply.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/responses/transformation.py#L29-L80
    why: Responses auth, the resolved base passed to the OpenAI URL builder, usage.cost lift and the two false flags.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L604-L623
    why: The URL builder Eden's base goes through, to see which fallbacks the resolved base skips.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/edenai/messages/transformation.py#L27-L79
    why: The descriptor, key check before the policy, and the cost written to the call log.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai_like/messages/transformation.py#L113-L176
