pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_feature_flags in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/feature_flags.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_feature_flags.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The PDF flag fires for any typed non-text content, including tool blocks.
- Top-level eager_input_streaming=false overrides nested true, and detection short-circuits before later invalid
  tools.
