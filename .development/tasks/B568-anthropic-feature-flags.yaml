id: B568
title: Anthropic content feature and beta detection
description: >-
  Add AnthropicFeatures and beta selection over typed message/tool content. Preserve native compaction, cache controls,
  OAuth caller attribution, Claude Code one-shot billing metadata, eager-input-streaming validation, files/PDFs,
  tool search, examples, computer tools, code execution and skills detection. Billing text is parsed as data and
  never trusted as authentication. Content-block declarations reuse B180 rather than new duplicate models.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  requires_native_compaction_beta L88-L106; supports_anthropic_cache_control L109-L121; is_claude_code_user_agent
  L124-L127; _validated_claude_code_mapping L130-L134; _validated_claude_code_list L137-L141; _claude_code_billing_fields
  L144-L160; _claude_code_billing_texts L163-L178; _is_claude_code_subagent_billing_system L181-L193; is_claude_code_one_shot_subagent_request
  L196-L210; eager_input_streaming_flag L297-L306; AnthropicModelInfo.is_cache_control_set L320-L335; AnthropicModelInfo.is_file_id_used
  L337-L342; AnthropicModelInfo.is_thinking_display_updates_used L344-L347; AnthropicModelInfo.is_mid_conversation_tool_change_used
  L349-L359; AnthropicModelInfo.is_mid_conversation_output_config_used L361-L365; AnthropicModelInfo.is_mcp_server_used
  L367-L372; AnthropicModelInfo.is_computer_tool_used L374-L381; AnthropicModelInfo.is_web_search_tool_used L383-L390;
  AnthropicModelInfo.is_pdf_used L392-L402; AnthropicModelInfo.is_tool_search_used L404-L418; AnthropicModelInfo.is_programmatic_tool_calling_used
  L420-L444; AnthropicModelInfo.is_input_examples_used L446-L472; AnthropicModelInfo.is_eager_input_streaming_used
  L474-L475; AnthropicModelInfo.is_code_execution_tool_used L831-L844; AnthropicModelInfo.is_container_with_skills_used
  L846-L860; AnthropicModelInfo._get_user_anthropic_beta_headers L862-L865; AnthropicModelInfo.get_computer_tool_beta_header
  L867-L884; AnthropicModelInfo.get_anthropic_beta_list L886-L940. litellm/types/llms/anthropic_tool_search.py:
  get_tool_search_beta_header L32-L36. litellm/integrations/websearch_interception/tools.py: is_anthropic_native_web_search_tool
  L207-L225.


  Named case contracts: one_shot_subagent_billing: Require case-sensitive claude-cli/ or claude-code/ user-agent
  prefix, exactly one dict-like user message, falsey tools, and a billing-only system. String system is one text;
  list system accepts only dict text blocks with string text, ignores whitespace-only texts, requires at least one
  meaningful text and exactly one cc_is_subagent=true across all parsed fields. malformed_billing_text: Trim outer
  whitespace; require x-anthropic-billing-header: prefix and reject embedded CR/LF. Split nonempty semicolon fields,
  each must contain = with nonempty trimmed key/value; split only at first =. Other fields allowed; duplicate cc_is_subagent,
  false/True values, missing billing text, nontext blocks and malformed mappings fail. native_compaction_signature:
  Only provider exactly anthropic: compaction option is non-None (including false/empty) or a mapping content block
  in list/tuple content has type=compaction with nonempty string signature. Other providers, missing/empty/nonstring
  signature fail. cache_control_support: Provider is explicit non-None or B174 resolver; resolver exceptions return
  false. Require provider anthropic/bedrock/vertex_ai/azure_ai, case-insensitive claude in model, and B174 supports_prompt_caching.
  Cache-control presence detector treats message-level non-None as true but list content dict key presence as true
  even when value=None. file_and_pdf_flags: File-id detection delegates B234 and is true iff any ids. PDF detector
  is intentionally broad: any dict list-content item with a type key unequal text counts, including image/tool/None
  types; missing type does not count. tool_search_and_examples: Only exact tool_search_tool_regex_20251119 or tool_search_tool_bm25_20251119
  types count. Programmatic calling needs a nonempty list allowed_callers containing code_execution_20250825 at
  top level or dict function; examples need nonempty list input_examples at either level. Similar strings/empty/nonlists
  fail. eager_input_boolean: Validate top-level and optional function eager_input_streaming as strict bool-or-None,
  ignoring unknown fields. Top-level non-None including false wins over nested; malformed Mapping raises UnsupportedParamsError
  eager_input_streaming must be a boolean; malformed nonmapping returns None. any detection short-circuits at first
  true, so later malformed entries are not evaluated. computer_tool_beta: First type beginning computer_ wins; computer_20250124
  -> computer-use-2025-01-24, computer_20241022 and unknown -> computer-use-2024-10-22. Web search recognizes a
  type starting web_search, not only a single exact version. skills_code_execution_beta: Code execution is exactly
  code_execution_20250825; skills need a truthy dict container with nonempty list skills. User beta parsing returns
  None for None, else raw comma split preserving spaces/empty entries. Tool-search beta is tool-search-tool-2025-10-19
  for vertex_ai,vertex_ai_beta,bedrock; advanced-tool-use-2025-11-20 for anthropic,azure,azure_ai and unknown providers.
  conversation_feature_flags: Thinking display needs a dict with type enabled/adaptive and display updates. Mid-conversation
  tool changes require role=system plus B221 parts containing tool_addition/tool_removal whose nested tool.type=tool_reference.
  Any message output_config key counts even None; MCP servers use truthiness. common_beta_set: Use B688 effort detection
  then union effort-2025-11-24, selected computer beta, files-api-2025-04-14 plus code-execution-2025-05-22 for
  file ids, mcp-client-2025-04-04, mid-conversation-output-config-2026-07-01, thinking-display-updates-2026-08-18
  and mid-conversation-tool-changes-2026-07-01 for corresponding flags. prompt_caching_set has no beta effect. Compare
  sets, since list(set(...)) has no stable order. native_web_search_type: is_anthropic_native_web_search_tool returns
  true only for a string type beginning with web_search_. Missing/None/nonstring type returns false; names are ignored.
  Bare web_search,WebSearch,litellm_web_search and OpenAI function records do not match; an otherwise unknown web_search_
  suffix does.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-anthropic/src/feature_flags.rs with adjacent tests under feature_flags/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function feature_flags_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): one_shot_subagent_billing, malformed_billing_text, native_compaction_signature, cache_control_support,
  file_and_pdf_flags, tool_search_and_examples, eager_input_boolean, computer_tool_beta, skills_code_execution_beta,
  conversation_feature_flags, common_beta_set, native_web_search_type. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_feature_flags* using HelperCase: kind:
  helper and the externally tagged anthropic_feature_flags variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_feature_flags that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 352 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 358 production lines, 292 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 800 planned, 800 maximum changed lines.
scope:
  paths:
  - crates/betterlite-anthropic/Cargo.toml
  - crates/betterlite-anthropic/src/feature_flags.rs
  - crates/betterlite-anthropic/src/feature_flags/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/anthropic/feature_flags.rs
  - tools/oracle/src/helpers/anthropic/feature_flags/**
  - tools/oracle/helpers/anthropic_feature_flags.py
  - tools/oracle/helpers/anthropic_feature_flags/**
  - tools/oracle/cases/helpers/providers/anthropic-feature-flags/**
  - tools/oracle/fuzz/corpus/helper_case/anthropic_feature_flags*
  lint_tables: false
