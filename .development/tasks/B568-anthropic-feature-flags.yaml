id: B568
title: Anthropic content feature and beta detection
description: >-
  Add AnthropicFeatures and beta selection over typed message/tool content. Preserve native compaction, cache controls,
  OAuth caller attribution, Claude Code one-shot billing metadata, eager-input-streaming validation, files/PDFs,
  tool search, examples, computer tools, code execution and skills detection. Billing text is parsed as data and
  never trusted as authentication. Content-block declarations reuse B180 rather than new duplicate models.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/common_utils.py:
  requires_native_compaction_beta L88-L106; supports_anthropic_cache_control L109-L121; is_claude_code_user_agent
  L124-L127; _validated_claude_code_mapping L130-L134; _validated_claude_code_list L137-L141; _claude_code_billing_fields
  L144-L160; _claude_code_billing_texts L163-L178; _is_claude_code_subagent_billing_system L181-L193; is_claude_code_one_shot_subagent_request
  L196-L210; eager_input_streaming_flag L297-L306; AnthropicModelInfo.is_cache_control_set L320-L335; AnthropicModelInfo.is_file_id_used
  L337-L342; AnthropicModelInfo.is_thinking_display_updates_used L344-L347; AnthropicModelInfo.is_mid_conversation_tool_change_used
  L349-L359; AnthropicModelInfo.is_mid_conversation_output_config_used L361-L365; AnthropicModelInfo.is_mcp_server_used
  L367-L372; AnthropicModelInfo.is_computer_tool_used L374-L381; AnthropicModelInfo.is_web_search_tool_used L383-L390;
  AnthropicModelInfo.is_pdf_used L392-L402; AnthropicModelInfo.is_tool_search_used L404-L418; AnthropicModelInfo.is_programmatic_tool_calling_used
  L420-L444; AnthropicModelInfo.is_input_examples_used L446-L472; AnthropicModelInfo.is_eager_input_streaming_used
  L474-L475; AnthropicModelInfo.is_code_execution_tool_used L831-L844; AnthropicModelInfo.is_container_with_skills_used
  L846-L860; AnthropicModelInfo._get_user_anthropic_beta_headers L862-L865; AnthropicModelInfo.get_computer_tool_beta_header
  L867-L884; AnthropicModelInfo.get_anthropic_beta_list L886-L940. litellm/types/llms/anthropic_tool_search.py:
  get_tool_search_beta_header L32-L36.


  Implement crates/betterlite-anthropic/src/feature_flags.rs with adjacent tests under feature_flags/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_feature_flags in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function feature_flags_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): one_shot_subagent_billing, malformed_billing_text, native_compaction_signature, cache_control_support,
  file_and_pdf_flags, tool_search_and_examples, eager_input_boolean, computer_tool_beta, skills_code_execution_beta.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_feature_flags* using HelperCase: kind:
  helper and the externally tagged anthropic_feature_flags variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_feature_flags that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 335 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 350 production lines, 126 behavior/config-test lines,
  91 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 592 planned, 600 maximum changed lines.
