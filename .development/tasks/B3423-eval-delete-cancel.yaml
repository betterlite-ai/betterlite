id: B3423
title: Eval deletion and cancellation operations
description: >-
  Build eval deletion and cancellation orchestration in `betterlite-core::api::eval_lifecycle`. Implement `delete_eval`, `adelete_eval`, `cancel_eval`, and `acancel_eval` with native sync/async semantics, preserving distinct response types and the empty cancellation request body.

  In `delete_eval`: accept `eval_id` (required), `extra_headers`, `extra_query` (accepted but not forwarded), `timeout`, and `custom_llm_provider`. Select provider as in B3421: `custom_llm_provider` becomes `"openai"` if `None`. Validate environment, transform the request, call the logging updater with `eval_id` as an optional param, dispatch to the transport handler with resolved timeout, and return `DeleteEvalResponse` contract validated through B3420's model.

  In `cancel_eval`: accept `eval_id` (required), `extra_headers`, `extra_query` (accepted but not forwarded), `timeout`, and `custom_llm_provider`. Build the request as in delete, obtaining `request_body` from the transform but passing no body argument to the handler (the transport preserves the empty request body). Log with `eval_id`, dispatch with resolved timeout, and return `CancelEvalResponse` contract validated through B3420's model.

  Async wrappers `adelete_eval` and `acancel_eval` run their sync counterparts in a thread pool via `loop.run_in_executor`, copy context with `contextvars.copy_context`, and await the result. If the result is a coroutine, await it; otherwise return it. Both async and sync versions share module-level `DEFAULT_OPENAI_API_BASE` and `BaseLLMHTTPHandler()` from B3421's scope.

  Unsupported providers are rejected with `ValueError`. Exception mapping uses `litellm.exception_type` dispatch: OpenAI errors through B185, other or unmapped errors through B186. Store `local_vars = locals()` before the try block.
