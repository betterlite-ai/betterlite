deviations:
  - what: "Async wrappers call sync counterparts via thread pool and contextvars copy, matching the @client decorator in LiteLLM."
    why: "The pattern (sync function, async wrapper running it in executor with context) is preserved; logging and context types come from betterlite's observability layer."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L785-789
  - what: "cancel_eval obtains request_body from the transform but does not pass it to the handler, preserving the empty request body that the transport expects."
    why: "This boundary preservation is intentional and security-sensitive: the handler must receive no body argument so the transport can send an empty body, matching the pinned behavior exactly."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L1041-1066
out_of_scope:
  - ProviderConfigManager.get_provider_evals_api_config owned by B024.
  - HTTP handler implementation and transport dispatch (owned by the handler/transport owner identified by B096's external-calls table).
  - Request/response transformation for OpenAI (owned by B523).
  - Logging infrastructure and observability (B247).
  - Exception type mapping from provider errors to OpenAI vs. other/fallback (B185, B186).
  - Async runtime, context variables and request tracing beyond what local operations require.
  - Client-wrapper decorator or its side effects on operation selection (betterlite's routing replaces this).
pitfalls:
  - "extra_query is a parameter name but the code path does not use it; accepting it preserves the API surface but forwarding it would be incorrect per the LiteLLM behavior. This is intentional; do not add query param forwarding."
  - "cancel_eval calls transform_cancel_eval_request which returns a tuple with request_body, but the handler is called without passing the body. This boundary is load-bearing: the transport must preserve the empty request body. Do not 'fix' it to pass the body to the handler."
  - "Async wrappers must handle both direct returns and coroutines; contextvars.copy_context and loop.run_in_executor preserve request context across the thread boundary."
  - "In delete_eval and cancel_eval, store local_vars = locals() before the try block so that all function parameters (eval_id, extra_headers, extra_query, timeout, custom_llm_provider) and their defaults are captured for error reporting."
  - "Both functions reuse module-level DEFAULT_OPENAI_API_BASE and BaseLLMHTTPHandler() from B3421's scope."
  - "ProviderConfigManager returns None for unsupported providers; do not silently fall back to openai on None, raise ValueError with the provider name."
  - "Timeout resolution uses: supplied timeout if not None, otherwise request_timeout constant. On None inputs, this becomes the module default, not a per-request timeout."
