id: B202
title: OpenAI text completions
description: >-
  Add typed non-streaming OpenAI text completions to betterlite-openai and expose the four completion route aliases
  through the existing server auth/provider framework. Use the text-completion-openai identity where LiteLLM selects
  it and pass configured credentials/base/deadline through the existing HTTP layer. Model string, string-list, token-list
  and token-list-list prompts, choice text, usage, finish reasons and logprobs without converting them to chat responses
  on the public completion endpoint. Add supported completion parameters with exact numeric JSON serialization,
  keeping trusted controls out of the upstream body. Reuse B011 errors and add request/response parser fuzz targets,
  seeded from the HTTP oracle cases. Streaming and chat-to-text bridging are B203; a requested stream must remain
  an explicit unsupported result until that task lands.  Follow main.py 7623-7692 prompt-shape dispatch: an empty
  list or mixed unmapped shape raises Unmapped prompt format; a non-chat OpenAI model switches to text-completion-openai
  using B193 open_ai_chat_completion_models. Empty string remains distinct from empty list. Add the TextCompletion
  variants to B014 exhaustive request/result dispatch; B203 later supplies both bridge directions. B202 also supplies
  text-completion privacy projection over its new response types. Write the behavior rstest functions b202_text_completion_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. Budget 280 text types/dispatch, 270 tests, 110 fuzz/replay and 90 endpoint wiring (750 total).
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-openai/**
  - crates/betterlite-provider/**
  - crates/betterlite-server/**
  - tools/oracle/cases/completions/**
  - crates/betterlite-core/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12099-L12175
  why: Completion aliases and common request routing.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/completion/utils.py#L13-L45
  why: Token prompts and message-to-prompt conversion.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/completion/transformation.py#L15-L158
  why: Completion parameter mapping and separate chat conversion.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/completion/handler.py#L19-L214
  why: Text endpoint requests, control exclusion and response handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7623-L7692
  why: Prompt-shape validation and OpenAI chat-catalog endpoint switch.
dod:
- text: >-
    All prompt variants, route aliases, parameters, response choices and provider errors match the listed HTTP cases
    on both sides.
  proof:
  - oracle
- text: >-
    Auth, configured destination/deadline and existing error/header policy are reused; controls cannot leak upstream.
  proof:
  - text-completion-tests
- text: Request and response parsers replay new prompt-shape corpus seeds without panic or oversized allocation.
  proof:
  - text-request-corpus
  - text-response-corpus
checks:
  optional:
  - mutants
  commands:
  - id: text-completion-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-openai -p betterlite-server --no-tests=fail -E 'test(/::b202_text_completion_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: text-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/text_request)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/text_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/text_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_text_request_corpus)'
  - id: text-response-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/text_response)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/text_response.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/text_response)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_text_response_corpus)'
oracle_cases:
- tools/oracle/cases/completions/string-prompt.yaml
- tools/oracle/cases/completions/strings-prompt.yaml
- tools/oracle/cases/completions/tokens-prompt.yaml
- tools/oracle/cases/completions/token-lists-prompt.yaml
- tools/oracle/cases/completions/empty-prompt.yaml
- tools/oracle/cases/completions/invalid-mixed-prompt.yaml
- tools/oracle/cases/completions/parameters-logprobs.yaml
- tools/oracle/cases/completions/unversioned-path.yaml
- tools/oracle/cases/completions/engines-path.yaml
- tools/oracle/cases/completions/deployments-path.yaml
- tools/oracle/cases/completions/upstream-400.yaml
- tools/oracle/cases/completions/upstream-429.yaml
- tools/oracle/cases/completions/empty-list-rejected.yaml
- tools/oracle/cases/completions/chat-catalog-selection.yaml
deviations: []
out_of_scope:
- Streaming and completion/chat bridge are B203; moderation is B015.
- OpenAI SDK implicit retries are not copied; retries arrive with B017.
- >-
  openai/completion/guardrail_translation/handler.py is B104; B004 openai/chat/guardrail_translation is likewise
  B104, despite the historical broad covers globs (architect handoff).
pitfalls:
- Token IDs must remain numbers in their original nested shape, not strings or decoded chat content.
- The public completion endpoint returns text choices, not chat message choices.
- Control max_retries must never appear as a provider body parameter.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
