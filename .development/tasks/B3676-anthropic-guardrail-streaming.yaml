id: B3676
title: Anthropic guardrail streaming and ended-stream rewrites
description: >-
  Build the Anthropic Messages guardrail scan of a response that is still streaming (or fully buffered), and the code that writes a guardrail's rewrite back into the buffered SSE chunks. Everything is a plain function in crates/betterlite-server/src/guardrails/anthropic_translation/, generic over `G: GuardrailContract` (B5471's `guardrail_base`; `apply_guardrail` returns `impl Future`, so no trait object). Request bodies are `BTreeMap<String, GuardrailValue>` (B3660's type, from `betterlite_config::sections::guardrail_identity::item`). `GuardrailApiInputs`, `GuardrailInputType`, `GuardrailLogTarget` and `GuardrailFailure` are B5471's. Raw JSON from the wire is untyped, so `serde_json::Value` is allowed at these boundaries only, one `#[expect]` per module with its reason. Other tasks own what this one calls, so read their modules for exact signatures and do not copy them. B3673: `SseChunk` (`Bytes`, `Event`, `Other`), `iter_sse_events`, `streaming_has_ended` and `streaming_string_so_far`. B3670: `ToolCallShape` and `tool_call_shapes`. B3631: the Rust `_build_complete_streaming_response` and `_build_usage_only_response_from_chunks`. B3246 (betterlite-core, `guardrails/streaming_rewrite.rs`): `UndeliverableStreamRewrite { guardrail_name, reason }`. B3661: `transform_user_api_key_dict_to_metadata`.

  Module `stream_rewrite` (stream_rewrite.rs) is the in-place writer. `SseFieldRewrite { section: &'static str, field: &'static str, value: String }` is LiteLLM's `_SSEFieldRewrite`: set `event[section][field]` to `value`. LiteLLM passes a closure; the project forbids closures, so the rewriters are one enum, `EventRewriter`, with a method `rewrite(&mut self, event: &Map<String, Value>) -> Option<SseFieldRewrite>`. Variant `TextDelta { replacements }` handles the text rewrite: for an event that is a text delta (`type` "content_block_delta" and `delta.type` "text_delta") the first call returns `SseFieldRewrite { "delta", "text", rewritten_text }` and every later call returns the empty string, so the full text sits in the first delta and the rest are blanked. Variant `ToolUse { rewrites_by_block: BTreeMap<i64, ToolCallShape>, arguments_sent: BTreeSet<i64> }` handles tool calls: for an event whose integer `index` is a key of `rewrites_by_block`, a `content_block_start` returns `("content_block", "name", name)` when the rewritten name is Some (else None), and a `content_block_delta` whose `delta.type` is "input_json_delta" returns `("delta", "partial_json", ...)` where the first delta of that index gets the full rewritten arguments and every later one gets the empty string. Any other event returns None.

  `rewritten_event(event, rewriter) -> Option<Map<String, Value>>` returns the event with `event[section]` replaced by a copy that has `field` set, but only when the rewriter returned a rewrite and `event[section]` is an object; otherwise None, which means unchanged. `rewrite_sse_line(line: &str, rewriter) -> String` leaves a line that does not start with `data:` (no trimming first) as it is, leaves a line whose payload is not valid JSON or not a JSON object as it is, and for a rewritten event returns `"data: "` plus the event serialized the way Python's `json.dumps` default does: `, ` and `: ` separators and `ensure_ascii` (every non-ASCII char as `\uXXXX`, surrogate pairs above U+FFFF). Write that serializer once here with serde_json's `Formatter` trait and a small formatter struct, since serde_json's own output is compact and keeps non-ASCII. `rewrite_sse_events(bytes: &[u8], rewriter) -> Vec<u8>` returns the input unchanged when it is not valid UTF-8, otherwise splits on "\n\n", each block on "\n", maps every line through `rewrite_sse_line` and joins back with the same separators, so the framing is byte for byte. This is the decoder of upstream bytes, so it gets the cargo-fuzz target (see checks).

  `rewrite_ended_stream_events(responses_so_far: &mut [SseChunk], rewriter)` rewrites every chunk in place: an `Event` becomes the rewritten event when there is one, a `Bytes` chunk goes through `rewrite_sse_events`, `Other` stays. Chunks are visited in order, and inside a bytes chunk blocks and lines in order, because the rewriter counts which text delta or tool_use block it is on.

  `write_ended_stream_text_rewrite(responses_so_far: &mut [SseChunk], rewritten_text: &str, guardrail_name: &str) -> Result<(), UndeliverableStreamRewrite>` first checks that some event from `iter_sse_events` over all chunks is a text delta. When none is, it returns the B3246 error with the reason "the buffered stream carries no text_delta event to land the text rewrite on". Otherwise it runs `rewrite_ended_stream_events` with `EventRewriter::TextDelta`.

  `write_ended_stream_tool_call_rewrites(responses_so_far, pre: &[ToolCallShape], post: &[ToolCallShape], guardrail_name) -> Result<(), UndeliverableStreamRewrite>` returns Ok at once when `post == pre`. Otherwise it collects, from `iter_sse_events` over all chunks, the integer `index` of every `content_block_start` event whose `content_block.type` is "tool_use", in stream order. When their count differs from `post.len()` it returns the B3246 error with the reason "the guardrail returned {post.len()} tool calls for a stream that carried {count} tool_use blocks". Otherwise the nth block index is paired with the nth pre and post shape, only pairs where post differs from pre go into `rewrites_by_block`, and `rewrite_ended_stream_events` runs with `EventRewriter::ToolUse`.

  Module `usage_response` (usage_response.rs) has `build_streaming_usage_response(responses_so_far: &[SseChunk], request_data: Option<&BTreeMap<String, GuardrailValue>>) -> Option<GuardrailValue>`. It keeps only the `Bytes` chunks (LiteLLM keeps str and bytes; B3673's `SseChunk` has no str variant), returns None when there are none, and otherwise calls B3631's usage-only builder with those chunks and `model` set to `request_data.model` when that is a string, else the empty string. A builder error or a None result gives None. The ModelResponse becomes a `GuardrailValue` with `serde_json::to_value` and `from_value`, never through bytes (the workspace turns on `arbitrary_precision`, and `from_slice` into the untagged `GuardrailValue` turns a float into a one-key object).

  Module `process_stream` (process_stream.rs) has `process_output_streaming_response(responses_so_far: &mut Vec<SseChunk>, guardrail: &G, logging_obj: Option<&mut GuardrailLogTarget>, user_api_key_dict: Option<&BTreeMap<String, GuardrailValue>>, request_data: Option<&mut BTreeMap<String, GuardrailValue>>, deliver_ended_stream_rewrites: bool) -> Result<(), ProcessStreamError>`. LiteLLM's `stream_transform_sink` argument is never read by this handler, so it is left out. The guardrail name used below is B5471's `guardrail_name` of the guardrail, or "unknown" when it has none. A private `prepare_request_data(request_data, value, user_api_key_dict, key)` starts from an empty map when `request_data` is None, inserts `value` under `key` only when the key is missing (an existing value stays, even null), and when `litellm_metadata` is missing inserts B3661's `transform_user_api_key_dict_to_metadata(user_api_key_dict)` as an object under `litellm_metadata`, only when the result is not empty. It is not B5820's `add_response_context`, because that one hard-codes the key `response` and this task also needs the key `responses`.

  Ended stream, when B3673's `streaming_has_ended(responses_so_far)` is true. Assemble the response with B3631's `_build_complete_streaming_response` over the chunks (model empty). When it returns None, or a response with no `choices`, log at debug "Skipping output guardrail - model response has no choices", make no guardrail call, and return Ok. Otherwise take `choices[0].message`: `content` (a string or null) and `tool_calls` (a list or null). Take `pre_guardrail_tool_calls = tool_call_shapes(tool_calls)` before the call, because a guardrail may edit the calls it was handed. Inputs are `GuardrailApiInputs` with `texts: [content]` only when `content` is a non-empty string and `tool_calls` only when the list is non-empty. No `model` and no `images`. Prepare the request data with the response as `GuardrailValue` under key `response`, then call `guardrail.apply_guardrail(inputs, request_data, GuardrailInputType::Response, logging_obj)`. A `GuardrailFailure::ModifyResponse` whose `original_response` is None gets the assembled response as `original_response` before it is returned (LiteLLM's fallback to the usage-only response can never run here because the assembled response exists). Every other failure is returned as it is. On success, when `deliver_ended_stream_rewrites` is true: the text rewrite runs only when the original `content` was a non-empty string, the returned `texts` is non-empty and its first entry differs from `content`; it calls `write_ended_stream_text_rewrite` with that first entry. Then, whatever the text did, `write_ended_stream_tool_call_rewrites` runs with `pre` and `post`, where `post` is `tool_call_shapes(returned tool_calls)` when the guardrail returned a list with exactly `pre.len()` entries, else `tool_call_shapes` of the original calls (so no rewrite). When `deliver_ended_stream_rewrites` is false nothing is written, and the chunks go on unchanged. The function returns Ok and the caller keeps the same `responses_so_far`.

  Not-yet-ended stream. The text is B3673's `streaming_string_so_far(responses_so_far)`. Prepare the request data with the chunks list as a `GuardrailValue` array under key `responses` (an `Event` as its object, `Bytes` as a string decoded with replacement characters, `Other` as null). Call the guardrail with `texts: [string_so_far]`, which is sent even when the string is empty, and `GuardrailInputType::Response`. A `ModifyResponse` with no `original_response` gets `build_streaming_usage_response(responses_so_far, request_data)`. When `deliver_ended_stream_rewrites` is true and the returned `texts` is non-empty and not equal to `[string_so_far]`, call `write_ended_stream_text_rewrite` with the first returned text. A returned list with several texts uses only the first.

  `ProcessStreamError` is this module's thiserror enum: `Guardrail(GuardrailFailure)` (boxed if `clippy::result_large_err` fires), `Undeliverable(UndeliverableStreamRewrite)` with `#[source]`, and a variant for the `to_value` and `from_value` conversions. The caller (the policy pipeline) catches `Undeliverable` and releases the original chunks, which is not this task's code.

  Tests live in the `tests.rs` of each module with these name prefixes: `text_rewrite_*`, `tool_rewrite_*`, `bytes_rewrite_*` and `json_dumps_*` in stream_rewrite; `usage_response_*` in usage_response; `ended_*` and `unended_*` in process_stream. process_stream tests use a fake guardrail defined in its tests.rs that records the `GuardrailApiInputs`, the input type and a copy of the request data, and returns a scripted result. Helper oracle cases (pure functions only) go in tools/oracle/cases/helpers/anthropic-guardrail-streaming/ with `call: b3676: {function: ...}`. A chunk in a case is `{bytes: "<utf-8 text>"}` or `{event: {...}}`. process_output_streaming_response needs a live guardrail and is not reachable from a route yet, so its HTTP cases come from the dispatcher task B3680.
