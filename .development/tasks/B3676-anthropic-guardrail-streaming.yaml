dod:
  - text: >-
      The text rewrite puts the full rewritten text in the first text_delta and blanks every later one, in both dict chunks and SSE bytes, leaves all other events and the framing byte for byte, and returns the undeliverable error when the buffer has no text_delta.
    proof: [stream-rewrite-tests, oracle]
  - text: >-
      The tool call rewrite lands the nth rewritten call on the nth tool_use block (new name in content_block_start, full arguments in the first input_json_delta, later ones blanked), skips unchanged calls, does nothing when the shapes are equal, and returns the undeliverable error when the block count differs from the returned count.
    proof: [stream-rewrite-tests, oracle]
  - text: >-
      A rewritten SSE data line is written as `data: ` plus json.dumps output (`, ` and `: ` separators, non-ASCII escaped as \uXXXX), a line that is not rewritten is kept exactly, and invalid UTF-8 bytes are returned unchanged.
    proof: [stream-rewrite-tests, oracle, stream-rewrite-corpus-replay]
  - text: >-
      build_streaming_usage_response returns None without bytes chunks or when the builder fails, and otherwise the usage-only response built with the request's model text.
    proof: [usage-response-tests, oracle]
  - text: >-
      On an ended stream the guardrail gets the assembled response's content and tool calls (texts and tool_calls only when non-empty), a ModifyResponse failure without original_response carries the assembled response, and no call is made when the assembled response has no choices.
    proof: [process-stream-ended-tests]
  - text: >-
      With deliver_ended_stream_rewrites on, an ended stream gets the text rewrite only when the content was non-empty and the first returned text differs, and always gets the tool call rewrite check, where a returned list of a different length is ignored; with it off nothing is written.
    proof: [process-stream-ended-tests]
  - text: >-
      On a stream that has not ended the guardrail gets the single text from streaming_string_so_far even when it is empty, the request data holds the chunks under `responses`, a ModifyResponse failure without original_response carries the usage-only response, and a changed returned text is written with the text rewrite.
    proof: [process-stream-unended-tests]
checks:
  optional: []
  commands:
    - id: stream-rewrite-tests
      why: the ended-stream text and tool call rewrite tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::anthropic_translation::stream_rewrite::tests::/) - test(replays_the_anthropic_stream_rewrite_corpus)'
    - id: usage-response-tests
      why: the streaming usage response tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::anthropic_translation::usage_response::tests::/)'
    - id: process-stream-ended-tests
      why: the ended-stream guardrail call and rewrite tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::anthropic_translation::process_stream::tests::ended_/)'
    - id: process-stream-unended-tests
      why: the not-yet-ended stream guardrail call tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::anthropic_translation::process_stream::tests::unended_/)'
    - id: stream-rewrite-corpus-replay
      why: the corpus files for the SSE rewriter were not added or are not replayed
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/anthropic_stream_rewrite)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_anthropic_stream_rewrite_corpus)'
    - id: helper-cases-added
      why: the helper cases for this task were not added on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/anthropic-guardrail-streaming)"
