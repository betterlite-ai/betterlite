deviations:
  - what: The rewriters are the enum EventRewriter, not closures.
    why: The project forbids closures and nested functions; behavior is the same.
  - what: process_output_streaming_response has no stream_transform_sink argument.
    why: This handler never reads it, and its only caller in the Anthropic path does not pass one.
  - what: A stream chunk is B3673's SseChunk (bytes, parsed event, other). A Python str chunk is not read, and build_streaming_usage_response keeps only bytes chunks.
    why: SseChunk is the one Anthropic stream item type; LiteLLM's other readers also ignore str items.
  - what: The undeliverable rewrite is returned as `ProcessStreamError::Undeliverable` instead of raised.
    why: Rust has no exceptions; the policy pipeline matches on it and releases the original chunks.
out_of_scope:
  - "B3673 owns get_streaming_scan_key, _streamed_tool_use_fingerprints, get_streaming_string_so_far, _extract_text_from_sse, _check_streaming_has_ended, build_block_sse_chunks, build_stream_error_items, the block continuation helpers, _content_block_state, _parse_sse_data_line and _iter_sse_events. This task calls its readers."
  - "B3675 owns the Anthropic input and completed-output scans, _prepare_request_data's use on the non-streaming path, _get_response_content, _extract_from_content_blocks, _output_block_fields, _build_guardrail_inputs and the post_call_hook_response. B3674 owns _translate_to_openai and the request write-back."
  - "B3670 owns ToolCallShape and _tool_call_shapes. B5820 owns add_response_context, which this task does not call because it fixes the key `response`."
  - "B3631 owns _build_complete_streaming_response and _build_usage_only_response_from_chunks. B3246 owns UndeliverableStreamRewrite and the pipeline code that catches it."
  - "HTTP oracle cases through the booted proxy belong to B3680, which wires the dispatcher to the routes."
  - "The Anthropic typing helpers _as_str_mapping, _content_block_at, _ModelDumpBlock, _TextAttrBlock, _WritableMessage and _as_writable only narrow Python types and have no Rust counterpart. _AnthropicSSEDelta and _AnthropicSSEEvent are read through serde_json maps."
pitfalls:
  - "The text rewrite is judged by `iter_sse_events`, which trims each line, but the writer only touches lines that start with `data:` untrimmed, so an indented data line counts as a text_delta and is never rewritten. Keep both rules as they are."
  - "A line is rewritten as `data: ` plus json.dumps, so a rewritten line loses a trailing `\\r` and its original spacing, and non-ASCII text becomes \\uXXXX. Only an event the rewriter actually changed is re-encoded; a line with no rewrite stays byte for byte."
  - "The tool call check compares whole shapes and returns before looking at blocks when `post == pre`, so a count mismatch is silent if nothing changed. It also pairs the nth tool_use block with the nth returned call by position, not by id."
  - "A rewritten tool name that is None leaves `content_block_start` alone but the arguments in `input_json_delta` are still replaced, so the name stays and the arguments change."
  - "The tool call rewrite runs on every ended stream when delivery is on, even when the text rewrite did not, but the text rewrite also needs a non-empty original `content`; a tool-only stream never gets a text rewrite."
  - "`pre_guardrail_tool_calls` must be taken before the guardrail call, since a guardrail can edit the calls it received in place."
  - "The ended path sends `texts` only when `content` is a non-empty string, but the not-yet-ended path always sends `[string_so_far]`, even an empty string."
  - "The not-yet-ended path compares `tuple(returned texts) != (string_so_far,)`, so a reply with two texts always counts as a change, and only the first is written."
  - "Both paths set `original_response` only when the failure has none; a guardrail that already filled it keeps its value."
  - "`responses_so_far` is stored under `responses` on the not-yet-ended path but the assembled response under `response` on the ended path, and an existing key is never overwritten, even with null."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 3
