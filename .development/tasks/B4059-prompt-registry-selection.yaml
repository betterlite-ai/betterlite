id: B4059
title: Prompt registry selection and database row conversion
description: >-
  Build the in-memory prompt registry with environment-aware selection, version helpers,
  and database-row projection. Implement helper functions: get_base_prompt_id (strips .v or _v suffix),
  get_version_number (extracts version or defaults to 1), prompt_environment_or_default (defaults to
  "development"), registry_key_for_prompt (combines prompt_id and environment), parse_prompt_version
  (validates object as optional int), _spec_version (returns explicit version or extracted), and
  _default_serve_environment (picks production > staging > development > alphabetically first).

  Add InMemoryPromptRegistry with IN_MEMORY_PROMPTS map (registry_key -> PromptSpec) and
  prompt_id_to_custom_prompt map (registry_key -> PromptManagementClient). Implement
  resolve_prompt_spec (by base id, optional version, optional environment, with default environment
  handling and max-version selection), get_prompt_callback_for_prompt (lookup by registry key),
  and has_config_prompt (check for config-type prompt under base id).

  Add database row types: _PromptRow protocol with properties (id, prompt_id, version, environment,
  created_by, created_at, updated_at, litellm_params as str or map, prompt_info as str/map/null)
  and model_dump method; _PromptRowData record (prompt_id, version defaulting to 1, environment
  defaulting to "development", created_by, litellm_params, prompt_info, created_at/updated_at);
  _PromptTableActions protocol (find_many with where/order/take/distinct, create, update, delete_many);
  _prompt_table helper (returns PromptRepository table).

  Add endpoint request/response helpers: get_latest_prompt_versions (filters to max version per
  (base_id, environment) tuple), get_next_version_for_prompt (reads db for base_id+environment,
  returns max+1 or 1), create_versioned_prompt_spec (converts db row to PromptSpec with versioned
  prompt_id like "chat.v2", deserializes litellm_params/prompt_info JSON strings, defaults
  prompt_info.prompt_type to "db"), Prompt record (prompt_id, litellm_params, prompt_info),
  AMBIGUOUS_PROMPT_DATA_ERROR constant (error message when litellm_params.prompt_id combined with
  keyed prompt_data), is_ambiguous_keyed_prompt_data (check litellm_params.prompt_id presence and
  prompt_data dict keys for "content" presence), and PatchPromptRequest record (litellm_params
  and prompt_info both optional).

  Preserve: environment serving precedence (production, staging, development, then alphabetical),
  latest explicit version inside chosen environment, base-ID stripping for both .v and _v without
  validating suffix, get_next_version_for_prompt read-then-increment pattern without transaction,
  default environment to "development", default prompt_info.prompt_type to "db" when not supplied.
