    why: Helper functions for version/environment selection (get_base_prompt_id through _default_serve_environment).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_registry.py#L171-L183
    why: InMemoryPromptRegistry.__init__ with two dict fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_registry.py#L267-L308
    why: resolve_prompt_spec, get_prompt_callback_for_prompt, has_config_prompt methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L1-L217
    why: Endpoint contracts, row protocols, helper functions and request records.
dod:
  - text: Helper functions parse version numbers, handle defaults, and select environments in the correct order (production > staging > development > alphabetical).
    proof: [registry-helpers-tests]
  - text: get_base_prompt_id strips both .v and _v suffixes without validating what follows.
    proof: [registry-helpers-tests]
  - text: get_version_number extracts and validates version from .v or _v suffix, defaulting to 1 on absence or parse failure.
    proof: [registry-helpers-tests]
  - text: parse_prompt_version rejects bool, accepts int/digit-string as int, returns None otherwise.
    proof: [registry-helpers-tests]
  - text: InMemoryPromptRegistry stores two maps keyed by registry_key_for_prompt result.
    proof: [registry-tests]
  - text: resolve_prompt_spec selects environment by precedence or explicit choice, finds max version in that environment, and returns None when no match exists.
    proof: [registry-tests]
  - text: get_latest_prompt_versions filters to one per (base_id, environment) keeping the highest version number.
    proof: [endpoint-tests]
  - text: get_next_version_for_prompt queries database, returns max+1 or 1 on empty result, without transaction isolation.
    proof: [endpoint-tests]
  - text: create_versioned_prompt_spec converts db row to PromptSpec with versioned_prompt_id (base_id.v{version}), deserializes JSON fields, and injects prompt_type="db" when missing.
    proof: [endpoint-tests]
  - text: is_ambiguous_keyed_prompt_data returns true only when litellm_params.prompt_id is present and prompt_data dict lacks "content" key.
    proof: [endpoint-tests]
  - text: PatchPromptRequest and Prompt records deserialize from JSON with optional fields matching the outline.
    proof: [endpoint-tests]
