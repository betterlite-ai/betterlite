      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^prompt_endpoint_contracts::/)'
oracle_cases: []
deviations:
  - what: InMemoryPromptRegistry is an in-memory lookup only. Prompt persistence, initialization from database, and callback registration are outside this task's scope.
    why: Those behaviors belong to B4060 (registry mutation) and the startup flow; this task builds the selection and conversion layer only.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_registry.py#L185-L265
out_of_scope:
  - Registry initialization and population from database; B4060 builds initialize_prompt and sync_prompt_from_db.
  - Callback building and registration; B4060 builds _build_prompt_callback and integrates with logging registry.
  - Prompt endpoints (routes) and their HTTP handling; B4061/B4062 register the actual routes.
  - Custom prompt management dispatch; B4058 owns get_chat_completion_prompt orchestration.
  - litellm/proxy/prompts/prompt_registry.py:99-169 (get_prompt_initializer_from_integrations and prompt_initializer_registry assignment); owned by B4060.
  - "litellm/proxy/prompts/prompt_registry.py:310-335 (remove_prompt and delete_prompts_by_base_id methods); owned by B4060 for registry mutation."
  - The listing and caching helpers in LiteLLM that have no runtime caller at the pinned commit.
pitfalls:
  - Base-ID stripping must handle both .v1 and _v1 syntax; a prompt_id like "prefix.v1" and "prefix_v2" both become "prefix".
  - _default_serve_environment() checks for exact string matches against PROMPT_ENVIRONMENT_SERVE_PRECEDENCE tuple; adding new environments requires updating that constant.
  - Environment defaults to "development" everywhere a prompt lacks one; this is a string literal, not a None sentinel.
  - parse_prompt_version accepts string "123" but rejects string "abc", returning None only for non-numeric strings and booleans.
  - create_versioned_prompt_spec must deserialize JSON strings for litellm_params and prompt_info but accept maps directly; use serde_json::from_str for strings only.
  - registry_key_for_prompt combines prompt_id with environment; two versions of the same prompt in different environments have different registry keys.
  - get_next_version_for_prompt reads the database directly without holding a transaction lock; concurrent calls may return the same next version.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
