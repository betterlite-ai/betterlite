id: B8740
title: CallbackLogger trait, logger event and logger sink
description: >-
  betterlite has loggers for many LiteLLM callbacks, but nothing hands them a finished call. In LiteLLM every logger
  subclasses CustomLogger (litellm/integrations/custom_logger.py), and the success and failure handlers call its event
  methods on each registered logger. This task adds the Rust side of that contract: one trait every logger implements,
  the event it receives, a registry sink that holds a logger, and the port that turns a callback name into a logger.
  Later parts deliver events through it (B250, B251), resolve names into it (B8741, B8742) and implement it (each
  logger task).


  Code goes in crates/betterlite-logging/src/callback_logger.rs and callback_logger/ (event.rs, resolver.rs,
  error.rs, tests.rs). The skeleton declares `pub mod callback_logger;` in lib.rs. You also change two files of the
  merged callback registry: registry/sink.rs and registry.rs.


  The trait. `pub trait CallbackLogger: Send + Sync`, written with `#[async_trait]` (async-trait is already a
  dependency of the crate). `fn callback_name(&self) -> &str` is required: the configured name, used in warnings and
  in Debug output. Every other method has a default body, because CustomLogger's own methods do nothing (L141-L193)
  and most loggers override only one or two. `fn turn_off_message_logging(&self) -> bool` and
  `fn redacts_messages_itself(&self) -> bool` both default to false; they are the two values LiteLLM reads from a
  logger before it redacts the payload for it (L87-L100, L894-L895). The sync events are `fn log_success_event`,
  `fn log_failure_event` and `fn log_stream_event`, each `(&self, event: &LoggerEvent) -> Result<(), LoggerError>`.
  The async events are `async fn async_log_success_event`, `async_log_failure_event` and `async_log_stream_event`,
  each `(&self, event: Arc<LoggerEvent>) -> Result<(), LoggerError>`, so a logger can move the event into a queue
  without a copy. The defaults return Ok(()).


  event.rs. `pub struct LoggerEvent { pub payload: Arc<StandardLoggingPayload>, pub dynamic_params:
  Arc<StandardCallbackDynamicParams>, pub stream: bool }`. Both types are B254's (crates/betterlite-logging/src/fields.rs).
  LiteLLM passes kwargs, response_obj, start_time and end_time, but every value a betterlite logger reads is a field
  of the standard logging payload (times, call type, response, error information, metadata) or of the dynamic
  params (per request credentials). No raw kwargs map exists in betterlite.


  error.rs. `LoggerError` is a thiserror enum with one variant, `Delivery { callback: String, message: String }`,
  shown as "callback {callback} failed: {message}". A logger maps its own error into it.


  resolver.rs. `pub trait LoggerResolver: Send + Sync` with `fn resolve(&self, name: &str, params: &BTreeMap<String,
  String>) -> Result<Option<Arc<dyn CallbackLogger>>, RegistryError>`. params are the trusted callback variables of the
  request (empty at startup). Err means the name is unknown or its logger is not built in betterlite. Ok(None) means
  LiteLLM's builder gave None for it (an arm that falls through or an init error it logs and skips, L5181-L5188).
  B8741's catalog and B8742's server slot implement it.


  Registry. In registry/sink.rs add `CallbackSink::Logger(Arc<dyn CallbackLogger>)`. The enum derives Debug today and
  a trait object has no Debug, so write Debug by hand: the Logger variant prints its callback_name. `deliver` keeps its
  behavior for Tracing and Channel and returns Ok(()) for a Logger sink without calling it: a phase event carries no
  call, and loggers get their events from the dispatch in B250 and B251. In registry.rs add
  `pub fn loggers(&self, phase: CallbackPhase) -> Vec<Arc<dyn CallbackLogger>>`: the Logger sinks of the entries whose
  phases contain the phase, in registration order, skipping Tracing and Channel sinks. This is the list B250 walks for
  Success and Stream and B251 walks for Failure.


  Tests in callback_logger/tests.rs use small fake loggers that record calls: a logger that overrides only
  async_log_success_event gets that call and the other five methods return Ok without effect; LoggerError shows the
  callback name; `CallbackRegistry::loggers` lists a logger registered in the callbacks list for Success, Failure and
  Stream, a logger registered only in the failure list for Failure alone, keeps registration order and skips Tracing
  and Channel sinks; `deliver` on a Logger sink returns Ok and does not call the logger; Debug of a Logger sink shows
  its name.
scope:
