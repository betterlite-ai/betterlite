dod:
  - text: CallbackLogger has a required callback_name, two message flags defaulting to false, and six event methods whose defaults do nothing and return Ok.
    proof: [logger-tests]
  - text: LoggerEvent carries B254's payload and dynamic params, and LoggerError names the callback that failed.
    proof: [logger-tests]
  - text: CallbackSink has a Logger variant with a hand written Debug, deliver ignores it, and CallbackRegistry::loggers lists loggers by phase in registration order.
    proof: [logger-tests]
