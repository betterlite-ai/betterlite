out_of_scope:
  - "Proxy hooks of CustomLogger (async_pre_call_hook, async_post_call_success_hook, async_post_call_failure_hook, async_moderation_hook, the streaming hooks, async_post_call_response_headers_hook, async_filter_listed_models, async_post_mcp_tool_call_hook, logging_hook and async_logging_hook): B8390's ProxyCallback, dispatched by B8393, B8394 and B8395."
  - "log_pre_api_call, async_log_pre_api_call and log_post_api_call: B249 dispatches them; only the OTel V2 and New Relic loggers override them."
  - "async_log_audit_log_event: B065. The router events (log_success_fallback_event, log_failure_fallback_event, log_model_group_rate_limit_error, deployment hooks, pre_call_check): the router tasks. get_chat_completion_prompt: B4058's PromptManagementBackend."
  - "Payload truncation, redaction, base64 stripping and handle_callback_failure: B3931. Calling the events: B250 and B251. Resolving names: B8741 and B8742."
pitfalls:
  - CallbackSink derives Clone today, and Arc<dyn CallbackLogger> clones fine, but Debug must be written by hand or the derive fails to compile.
  - loggers() reads each entry's phases, not its lists, so a logger in the callbacks list also answers for Stream, as LiteLLM's function_setup copies callbacks into every event list.
  - The async event takes Arc<LoggerEvent>, not a reference, because async_trait boxes the future and a borrowed event would tie the queue to the caller's stack.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
