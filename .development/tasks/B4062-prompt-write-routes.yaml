id: B4062
title: Prompt creation and version mutation routes
description: >-
  Register POST /prompts, PUT /prompts/{prompt_id}, PATCH /prompts/{prompt_id} and DELETE /prompts/{prompt_id}
  to create, mutate and delete prompts. POST creates a new prompt in the specified or default environment with the next available version number.
  PUT strips the version suffix from the prompt_id and creates a new version in the specified or default environment, rejecting existing prompts
  with prompt_type="config". PATCH merges supplied litellm_params and prompt_info with the latest row in the target environment (defaulting to development),
  updating by primary key to target exactly one row, and rejects config prompts. DELETE removes all database rows for the base_prompt_id
  (optionally scoped to an environment) before calling delete_prompts_by_base_id on the registry; resolve_prompt_spec must succeed before deletion.
  Keep failed registry initialization after a successful database write visible, preserving observable failure semantics rather than rolling back.
  All writes require proxy admin role; a missing database is 500; ambiguous prompt data (field names containing literal ": ") is 400;
  config prompts cannot be updated or deleted. Preserve the write order: create_versioned_prompt_spec, initialize_prompt (or reload_prompt for PATCH),
  then delete after registry sync for DELETE.
scope:
  paths:
    - crates/betterlite-server/src/routes/prompts/write.rs
    - crates/betterlite-server/src/routes/prompts/write/tests.rs
    - tools/oracle/cases/prompts/write/**
    - tools/oracle/helpers/b4062.py
    - tools/oracle/helpers/b4062/**
    - tools/oracle/src/helpers/server/b4062.rs
    - tools/oracle/src/helpers/server/b4062/**
    - crates/betterlite-server/src/routes/prompts/write/tests/**
  lint_tables: false
