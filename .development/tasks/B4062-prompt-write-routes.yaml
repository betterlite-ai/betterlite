pitfalls:
  - "POST and PUT both allocate next version but only PUT strips the version suffix from the incoming prompt_id; POST accepts it without stripping."
  - "PATCH defaults environment to development via prompt_environment_or_default, but PUT uses the request's environment or defaults the same way; the same function should be used."
  - "DELETE checks resolve_prompt_spec (which requires the prompt to exist) before removing rows; database rows are deleted before calling delete_prompts_by_base_id, preserving observable order."
  - "Failed registry initialization (initialize_prompt, reload_prompt returning None) is a 500 after a successful database write, not rolled back; the database state is observable even when registry sync fails."
  - "Config prompts (where has_config_prompt returns true) are protected from all three mutations (update, patch, delete), returning 400 instead of proceeding."
  - "Ambiguous prompt data is checked against litellm_params when is_ambiguous_keyed_prompt_data(request.litellm_params) is true, not on prompt_info; the check prevents field names containing `: ` (literal colon-space)."
  - "PATCH merges supplied litellm_params and prompt_info with the latest row; both are Optional in the request, and None means keep the current value."
  - "Environment is optional in DELETE (query parameter) and defaults to None (meaning all environments); when supplied, only rows matching that environment are deleted."
