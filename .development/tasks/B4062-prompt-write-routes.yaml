    why: "update_prompt route, PUT /prompts/{prompt_id} decorator, base-ID stripping, existing-prompt check, config-prompt protection, new-version creation"
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L806-L876
    why: "delete_prompt route, DELETE /prompts/{prompt_id} decorator, environment-scoped deletion, registry removal after database delete, 404 check via resolve_prompt_spec"
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L879-L883
    why: "_reload_prompt_in_registry helper for PATCH route's registry sync after in-place update"
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L886-L1007
    why: "patch_prompt route, PATCH /prompts/{prompt_id} decorator, environment defaulting, composite-key query with version suffix handling, in-place row update, config-prompt protection"
dod:
  - text: "POST /prompts returns 403 if user is not proxy admin, 500 if database is missing, 400 if prompt data contains field names with literal `: `."
    proof: [create-permission-checks, create-db-missing, create-ambiguous-data]
  - text: "POST /prompts allocates the next version number in the specified or default environment, creates a database row, initializes the prompt in the registry, and returns the initialized spec."
    proof: [create-version-allocation, create-db-write, create-registry-init]
  - text: "PUT /prompts/{prompt_id} returns 403 if user is not proxy admin, 500 if database is missing, 404 if no version of the prompt exists, 400 if prompt_type=config or data is ambiguous."
    proof: [update-permission-checks, update-db-missing, update-not-found, update-config-protection, update-ambiguous-data]
  - text: "PUT /prompts/{prompt_id} strips .v and _v version suffixes from the prompt_id, allocates the next version in the specified or default environment, creates a new database row, initializes it in the registry, and returns the spec."
    proof: [update-base-id-stripping, update-version-allocation, update-db-write, update-registry-init]
  - text: "PATCH /prompts/{prompt_id} returns 403 if user is not proxy admin, 500 if database is missing, 404 if the target row does not exist, 400 if prompt_type=config or data is ambiguous."
    proof: [patch-permission-checks, patch-db-missing, patch-not-found, patch-config-protection, patch-ambiguous-data]
  - text: "PATCH /prompts/{prompt_id} defaults environment to development, resolves version suffix from prompt_id if present, queries by prompt_id+environment+(optional version), updates only the matched row, and reloads it in the registry."
    proof: [patch-environment-default, patch-version-suffix-resolution, patch-composite-key-query, patch-single-row-update, patch-registry-reload]
  - text: "DELETE /prompts/{prompt_id} returns 403 if user is not proxy admin, 500 if database is missing, 404 if resolve_prompt_spec returns None, 400 if prompt_type=config."
    proof: [delete-permission-checks, delete-db-missing, delete-not-found, delete-config-protection]
  - text: "DELETE /prompts/{prompt_id} removes all database rows for base_prompt_id (optionally scoped by environment), then calls delete_prompts_by_base_id on the registry, and returns a success message."
    proof: [delete-db-remove, delete-registry-remove, delete-success-message]
  - text: "Every route verifies through the booted proxy, including status/code/type on error and 500 for failed registry initialization after successful database write, with no helper adapter invoking these handlers."
    proof: [oracle-cases-prompts-write]
checks:
