deviations:
  - what: "Failed registry initialization (initialize_prompt or reload_prompt returning None) after a successful database write is reported as 500 without rolling back the database transaction."
    why: "LiteLLM keeps the database write even when registry initialization fails; betterlite preserves this behavior to surface the failure rather than hiding it with rollback semantics."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L677-L682
out_of_scope:
  - "The authentication mechanism (user_api_key_auth, user_api_key_has_admin_view, LitellmUserRoles.PROXY_ADMIN) is owned by B052/B124 and called via dependency injection."
  - "The database table operations (create, update, delete_many, find_many) and PromptRepository are provided by B726's auxiliary_repository."
  - "The prompt specification, request/response types and ambiguous data checking are owned by B4050 and B4059."
  - "Registry state and version/environment helpers (get_base_prompt_id, get_version_number, prompt_environment_or_default, get_next_version_for_prompt, create_versioned_prompt_spec, resolve_prompt_spec, has_config_prompt, initialize_prompt, reload_prompt, delete_prompts_by_base_id) are owned by B4059 and B4060."
  - "The IN_MEMORY_PROMPT_REGISTRY instance and initialization are owned by B4060."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
