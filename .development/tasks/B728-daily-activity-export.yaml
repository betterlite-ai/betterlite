  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/daily_activity_sql.py#L512-L526
    why: Own _export_cursor_clause; preserve caller-visible values and failure ordering.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: search_escaped_pattern,
      cursor_next_page, same_timestamp_tie, bounded_limit, cache_leakage, model_top_keys.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^daily_activity_export::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/daily_activity_export.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/daily-activity-export-*")"
        && grep -rlq "daily_activity_export" tools/oracle/fuzz/corpus/helper_case/daily-activity-export-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/daily-activity-export/search-escaped-pattern.yaml
  - tools/oracle/cases/helpers/daily-activity-export/cursor-next-page.yaml
  - tools/oracle/cases/helpers/daily-activity-export/same-timestamp-tie.yaml
  - tools/oracle/cases/helpers/daily-activity-export/bounded-limit.yaml
  - tools/oracle/cases/helpers/daily-activity-export/cache-leakage.yaml
  - tools/oracle/cases/helpers/daily-activity-export/model-top-keys.yaml
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - 'litellm/repositories/daily_activity_sql.py: B727 owns adjust_dates_for_timezone (L43-L56), build_where_clause
    (L59-L106), _ptu_flat_cost_select (L109-L112), _rollup_metric_select (L115-L132), _validate_api_key_limit
    (L135-L137), _top_api_keys_sql (L140-L148), build_aggregated_sql (L151-L216), build_entity_rollup_sql
    (L219-L261), _key_spend_select (L264-L274), build_key_page_sql (L277-L301).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Caller filter values must remain bind parameters even when the query contains dynamic grouping or
    cursor predicates.
budget:
  max_changed_lines: 475
  max_new_expects: 0
review_level: security
