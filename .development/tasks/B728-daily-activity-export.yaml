id: B728
title: Daily spend search and export queries
description: >-
  Implement typed key search, top model keys, cache leakage and cursor export query builders with stable
  grouping/order and bounded limits. Preserve cursor tuple comparison and timezone behavior; export rows
  remain scoped to the authorized entity set supplied by the endpoint.


  This task returns SQL plans over typed filters and executes no query. Helper cases call the pinned SQL
  builder only; real Postgres execution belongs to B729. There is no outside-byte decoder or task fuzz
  target here.


  Build the production daily_activity_export module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/daily_activity_sql.py:
  _bounded_limit (L304-L306; 3 source lines), build_key_search_sql (L309-L341; 33 source lines), build_model_top_keys_sql
  (L344-L363; 20 source lines), build_cache_leakage_keys_sql (L366-L380; 15 source lines), build_export_sql
  (L383-L454; 72 source lines), _export_grouping (L457-L509; 53 source lines), _export_cursor_clause (L512-L526;
  15 source lines).


  Add the daily_activity_export operation under B856 Management::database. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a daily-activity-export-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 211 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  211 production, 148 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 454 changed lines estimated within a 475-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
  paths:
    - crates/betterlite-db/src/daily_activity_export.rs
    - crates/betterlite-db/src/daily_activity_export/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/src/daily_activity_export/fixtures/**
    - tools/oracle/src/helpers/daily_activity_export.rs
    - tools/oracle/src/helpers/daily_activity_export/**
    - tools/oracle/helpers/daily_activity_export.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/database.rs
    - tools/oracle/helpers/management/database.py
    - tools/oracle/cases/helpers/daily-activity-export/**
    - tools/oracle/fuzz/corpus/helper_case/daily-activity-export-*
  lint_tables: false
references:
