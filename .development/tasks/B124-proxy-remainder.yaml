id: B124
title: Serve the mounted route directory and verify the remaining proxy integrations
description: >-
  Finish the remainder of the proxy-server umbrella. The existing parts already own
  request preparation, shared types, lifecycle, config endpoints, hooks and their area
  mounts. The missing route is GET /routes, with no /v1 alias. B4262 built its projections
  but explicitly left this caller unassigned. B8870, B8871 and B8872 now provide the
  remaining tenant-destination, Python MCP-tool and audit-callback startup adapters;
  this task adds their booted HTTP comparisons as well as the route directory. B8873
  supplies the early secret-manager bootstrap wrongly assigned to a KMS implementation.

  Build betterlite-server::app::edge::route_directory with RouteCatalog, RouteDirectory and its
  error type. RouteCatalog holds ordered B4262 route descriptors supplied by the actual
  server registration sites; RouteDirectory reads a snapshot for each request. For an
  entry with an endpoint, call get_app_routes. Only otherwise, for an entry with an app
  and a mount path, call get_routes_for_mounted_app. Flatten those results once, preserve
  their order and null fields, and return 200 application/json with {"routes": records}.
  A regular entry must not also traverse its app. Keep B4262's one-level mount expansion,
  absent-method fallback and mounted_app marker; do not recursively walk nested apps,
  deduplicate entries, add implicit HEAD methods or fabricate Rust symbol names as
  endpoint names. Registration descriptors carry the pinned Python handler names.

  Axum exposes no route-tree introspection. The architect must add one shared registration
  catalog alongside the existing mounts and feed this module; its inventory and module
  declarations are shared-list work outside this task's scope. Populate that catalog from
  the routes actually mounted, with the same enablement decisions and parameter paths,
  including /routes itself, docs URLs and MCP sub-app descriptors. Do not derive it from
  B868's permission tables or B8681's eleven-path OpenAPI subset. The catalog may replace
  a registration snapshot when its owning mount changes; a request clones the snapshot
  and releases its lock before projection. Tests must use the booted registration path,
  not a second hand-maintained list that merely agrees with the expected fixture.

  Export a router constructor for this one route, without a fallback. The architect
  merges it once through app::edge::mount inside the existing auth layers. Although
  LiteLLM marks /routes public, its Depends(user_api_key_auth) still runs pre-auth checks
  and custom auth before the built-in public-route shortcut. Thus ordinary built-in
  auth accepts a missing or invalid bearer with a master key configured, while a custom
  auth rejection still stops the handler. Do not move it to mount_public and bypass that
  dependency. No other route is registered by this task.

  Native app::edge::route_directory::tests::projection cases cover endpoint_before_mount,
  one_level_mounted_app, null_fields_retained, no_endpoint_or_app_skipped and
  duplicate_descriptors_keep_order. Boot cases exercise the real application constructor:
  directory_includes_itself, aliases_are_distinct, custom_auth_still_runs,
  docs_enablement_matches_catalog, mcp_mount_has_mounted_app and snapshot_replacement.
  The shared catalog wiring is a prerequisite, not an empty successful fallback.

  HTTP cases under tools/oracle/cases/http/proxy-remainder/ use the real binary and MIT
  LiteLLM. routes-no-key and routes-invalid-key send GET /routes with a master key
  configured and no database; both answer 200. routes-docs-disabled sets NO_OPENAPI=true
  and still answers 200. Compare content-type and the top-level object, ignoring only
  /body/routes with the explicit inventory deviation below; the native boot tests prove
  the complete catalog rather than accepting an empty list. Existing B8681 cases remain
  the proof of docs status/URL behavior.

  local-tool-call and local-tool-failure exercise B8871 through B8626's existing POST
  /mcp-rest/tools/call. Configure mcp_tools with name serialize, a description, handler
  json.dumps and an object input_schema. Configure an allowed HTTP MCP server toolsrv
  against the mock provider; its initialize and tools/list replies advertise serialize.
  Send server_id toolsrv, name serialize and arguments {"obj": {"answer": 42}} with
  the master key. The first case returns 200 with the JSON string as text content;
  the second supplies an unsupported keyword to reach the Python exception and returns
  the existing 200 error-tool result with isError true. Assert no upstream tools/call
  is sent: the authorized server selects the local handler. local-tool-no-key uses the
  same config without a key and compares the 401 auth error's type, param and code.
  local-tool-orphan uses B8728's existing POST /mcp/ tools/call, no server and the same
  configured tool; compare the 200 MCP result with isError true and the source's
  server-unavailable text, not a successful invocation. The operation's internal 503
  is converted by _execute_handle_call_tool. Do not remove that authorization check to
  make a configured local tool callable without a server.

  tenant-telemetry-disabled and tenant-telemetry-incomplete use /v1/chat/completions,
  a mock OpenAI deployment and B860's separate equivalent Postgres fixtures with a
  virtual key carrying logging metadata. The first has LITELLM_OTEL_V2=false; the second
  enables it and gives langfuse_otel only langfuse_public_key, without its required
  secret. Both still return the same 200 completion and provider request. Set
  allow_dynamic_callback_disabling=false in the parity cases; B8870's native tests
  prove the intentional no-license behavior and actual tenant span destinations.
  These HTTP cases prove that real auth reaches the adapter without turning telemetry
  into an auth failure. Native lifespan::proxy_remainder::tests integration tests assert that
  the production B855 slot contains B8870, using its recording fan-out so omission of
  the adapter fails even when the completion itself would succeed.

  audit-disabled-dotted-config sets store_audit_logs=false and audit_log_callbacks to
  [logging.Logger], then requests /v1/chat/completions. It must boot and return the
  ordinary 200 completion: audit list imports accept a class and dispatch ignores it,
  unlike callbacks-list validation. B8872 owns the native warning and cache-reset tests.
  Integration tests in crates/betterlite/src/lifespan/proxy_remainder.rs and its tests/
  call B8613's real config boot path and assert the same shared audit service was updated.
  They also assert B8614 uses B8871's loader and that two area mounts do not load the
  configured tools twice. A manager_bootstraps_before_reference_resolution case drives
  B8873 through startup with a manager-only credential; B129 owns its HTTP comparisons.
  Keep these tests in the binary crate, which can use both its
  boot services and the server library without a reverse server-to-binary dependency.
  No helper adapter may replace any of
  these startup or HTTP observations. No new byte decoder is needed: B4262 consumes
  descriptors and the HTTP/config decoders are already owned. The remaining Python
  behavior is the 16 executable lines of get_routes plus these composition seams;
  allow roughly 180 implementation lines, 300 native tests and 250 HTTP fixture lines.
scope:
  paths:
    - crates/betterlite-server/src/app/edge/route_directory.rs
    - crates/betterlite-server/src/app/edge/route_directory/**
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite/src/lifespan/proxy_remainder.rs
    - crates/betterlite/src/lifespan/proxy_remainder/**
    - crates/betterlite/Cargo.toml
    - tools/oracle/cases/http/proxy-remainder/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L19900-L19921
    why: Complete owned route including its auth dependency and endpoint-first enumeration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/get_routes.py#L14-L90
    why: B4262's existing descriptor projection and one-level mounted-app semantics.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1547-L1599
    why: Custom auth precedes the built-in public-route shortcut.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L823-L844
    why: /routes is in the built-in public set despite its dependency.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/rest_endpoints.py#L1159-L1366
    why: Existing REST surface for the configured local-handler HTTP comparisons.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/operations.py#L1935-L2109
    why: Authoritative REST server selection and the local-tool authorization gate before handler invocation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/operations.py#L2611-L2646
    why: Local handler exceptions become error-tool results.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/operations.py#L2851-L2856
    why: The MCP operation renders the orphan-tool HTTPException inside its result.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L3395-L3429
    why: HTTP coverage for the concrete destination adapter installed into auth.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6518-L6547
    why: Boot integration for the audit callback branch now owned by B8872.
dod:
  - text: GET /routes projects the actual registered descriptors with endpoint precedence, preserved nulls and B4262's mounted-app rules.
    proof: [projection-tests, boot-tests]
  - text: The single route registration preserves built-in public access and custom auth, and the installed docs/MCP routes appear only when actually mounted.
    proof: [boot-tests, oracle, http-cases]
  - text: Production startup installs B8870, B8871 and B8872 into the same services used by requests, and invokes B8873 before credential resolution without duplicating tool or audit registration.
    proof: [integration-tests, oracle, http-cases]
  - text: Configured local tools retain server authorization and distinguish handler failures from auth failures through the existing MCP HTTP surfaces.
    proof: [integration-tests, oracle, http-cases]
checks:
  optional: []
  commands:
    - id: projection-tests
      why: Route enumeration ignores endpoint precedence, drops nulls or expands mounts incorrectly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::edge::route_directory::tests::projection::/)'
    - id: boot-tests
      why: The route or its actual registration catalog is absent, bypasses custom auth or lists disabled mounts.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::edge::route_directory::tests::boot::/)'
    - id: integration-tests
      why: A production startup slot still uses a stub, a different service or a second tool load.
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^lifespan::proxy_remainder::tests::/)'
    - id: http-cases
      why: The remainder has no newly added HTTP fixtures to exercise its reachable behavior.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/proxy-remainder)"
oracle_cases:
  - tools/oracle/cases/http/proxy-remainder/routes-no-key.yaml
  - tools/oracle/cases/http/proxy-remainder/routes-invalid-key.yaml
  - tools/oracle/cases/http/proxy-remainder/routes-docs-disabled.yaml
  - tools/oracle/cases/http/proxy-remainder/local-tool-call.yaml
  - tools/oracle/cases/http/proxy-remainder/local-tool-failure.yaml
  - tools/oracle/cases/http/proxy-remainder/local-tool-no-key.yaml
  - tools/oracle/cases/http/proxy-remainder/local-tool-orphan.yaml
  - tools/oracle/cases/http/proxy-remainder/tenant-telemetry-disabled.yaml
  - tools/oracle/cases/http/proxy-remainder/tenant-telemetry-incomplete.yaml
  - tools/oracle/cases/http/proxy-remainder/audit-disabled-dotted-config.yaml
deviations:
  - what: GET /routes returns 200 with every actually mounted native route in native registration order; its routes array is not the full FastAPI inventory or FastAPI registration order.
    why: The proxy has its own router and currently installed features. Advertising unmounted Python routes would be false; the shared registration catalog must enumerate native mounts instead. Native boot tests verify the complete array, while HTTP parity compares status, content type and the envelope.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L19907-L19921
out_of_scope:
