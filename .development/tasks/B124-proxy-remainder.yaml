  - "Non-runtime exclusive paths: proxy/.gitignore, proxy/README.md and proxy/__init__.py contain no callable logic to port. proxy/post_call_rules.py::post_response_rule and proxy/_experimental/post_call_rules.py::my_custom_rule have no caller at the pin. proxy/lambda.py only exports Mangum(app, lifespan=on); no caller or deployment reference to that module exists at the pin, so no Lambda adapter is built."
  - "proxy/hooks/__init__.py::get_proxy_hook, PROXY_HOOKS and LEGACY_MULTI_INSTANCE_RATE_LIMITING belong to B8399, whose description already builds them; the architect must add this path to B8399 covers. The litellm_enterprise extension has no open-source implementation."
