pitfalls:
  - Public-table membership does not eliminate the get_routes auth dependency; a custom auth hook runs before the public shortcut.
  - An endpoint-bearing route wins over a mounted-app attribute, so expanding both duplicates its records.
  - Permission tables and the OpenAPI subset contain paths that are not an inventory of installed routers.
  - A registered local MCP tool without an authorized server is refused at the pin; do not add a direct registry bypass to the HTTP fixture.
  - The HTTP oracle cannot prove tenant exporter selection from an unchanged completion alone, so the installed-port and recording-fan-out tests are required too.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
