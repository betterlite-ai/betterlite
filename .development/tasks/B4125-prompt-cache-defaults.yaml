id: B4125
title: Seed default prompt caching and attribute injected marks
description: >-
  Build default-point selection, router cache-affinity projection and request-level cache injection in
  the prompt-policy layer. When `litellm.enable_anthropic_prompt_caching` is on or a request carries
  the per-request `enable_prompt_caching` flag, and the model is Claude with explicit cache control,
  synthesize two breakpoints: one for the system message and one for the trailing user message. Suppress
  defaults when the client already carries cache_control marks, when the request is a Claude Code one-shot
  subagent call, or when the model lacks cache support. Configured injection points always win: when
  present, apply them even over client marks (bounded by the provider's four-block cap), and never apply
  defaults. Seed defaults into the cache_control_injection_points parameter for /chat/completions so the
  prompt-management gate and placement service see them. For /v1/messages requests, apply them directly
  and record a deployment attribution mark only for newly added breakpoints, so spend tracking credits
  the request to the deployment it was sent to, not the one that might have failed and been retried.
  Attribution never overwrites an every-deployment mark that a pre-deployment injection already placed.

  `litellm.anthropic_prompt_caching_ttl` defaults to None (unset), accepting only "5m" or "1h" when
  explicitly set via the `LITELLM_ANTHROPIC_PROMPT_CACHING_TTL` environment variable. When unset,
  the ephemeral cache block has no ttl field, which the Anthropic API interprets as a 5-minute cache.
  `litellm.model_alias_map` is consulted for /chat/completions default selection; /v1/messages
  defaults ignore the map since they apply after alias resolution.
scope:
  paths:
    - crates/betterlite-prompts/src/cache_defaults.rs
    - crates/betterlite-prompts/src/cache_defaults/**
    - tools/oracle/cases/cache/**
    - tools/oracle/helpers/b4125.py
    - tools/oracle/helpers/b4125/**
    - tools/oracle/src/helpers/prompts/b4125.rs
    - tools/oracle/src/helpers/prompts/b4125/**
  lint_tables: false
