id: B004
title: OpenAI chat completions without streaming
description: >-
  Serve POST /chat/completions, /v1/chat/completions, /engines/{model}/chat/completions and /openai/deployments/{model}/chat/completions for deployments whose model starts with openai/.
  Add crates/betterlite-http, the one place that builds outbound HTTP clients (rustls, timeouts, connection pooling), and crates/betterlite-openai, the typed OpenAI chat wire models plus the provider that calls them.
  The request and response are typed models. Untyped JSON is allowed only in a passthrough field that carries parameters betterlite does not model, and only where LiteLLM forwards them too.
  The model name in the request picks the deployments with that model_name. When there are several, pick one uniformly at random through a random source passed in through the constructor; weighted choice comes in B008.
  api_key comes from litellm_params, and when it is absent from OPENAI_API_KEY through the config crate's environment lookup. api_base defaults to https://api.openai.com/v1. A deployment's timeout (or litellm_settings.request_timeout, default 6000 seconds) bounds the whole upstream call, and an expired timeout answers 408 like LiteLLM.
  Send the x-litellm-* response headers LiteLLM sends on these responses (call id, model id, model group, model api base and every other one the oracle shows), so clients that read them keep working. The cost and key-limit headers wait for spend tracking and virtual keys.
  Provider errors map to the same status, type and code LiteLLM returns. What betterlite sends upstream and what it returns to the client must match LiteLLM on every case listed below; write those cases under tools/oracle/cases/chat/.
scope:
  paths:
    - Cargo.toml
    - deny.toml
    - crates/betterlite/**
    - crates/betterlite-server/**
    - crates/betterlite-http/**
    - crates/betterlite-openai/**
    - tools/oracle/cases/chat/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L11931-L11960
    why: The four chat routes and the handler they share.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L645
    why: How LiteLLM calls OpenAI for a chat completion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/chat/gpt_transformation.py
    why: Which parameters LiteLLM maps, drops or passes through for OpenAI.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L132-L385
    why: The exception classes and status codes behind each provider error, including 408 for a timeout.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L568-L576
    why: The 6000 second default request timeout.
  - url: https://platform.openai.com/docs/api-reference/chat/create
    why: The chat request and response fields the typed models cover.
dod:
  - text: Every listed chat case matches LiteLLM on the client response and on the request sent upstream.
    proof: [oracle]
  - text: Every x-litellm-* header LiteLLM sends on the listed cases is present, with the same value unless the case lists it in headers_present.
    proof: [oracle]
  - text: The four chat routes serve the same handler.
    proof: [oracle]
  - text: With several deployments under one model_name, every deployment gets picked, and a seeded random source gives a fixed sequence.
    proof: [openai-tests]
  - text: A provider slower than the deployment timeout gets a 408 with LiteLLM's error shape.
    proof: [openai-tests]
  - text: Outbound clients are built only in betterlite-http.
    proof: [clippy, layering]
  - text: Every mutant in the request mapping and error mapping is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: openai-tests
      why: the provider or server tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-openai -p betterlite-http -p betterlite-server --no-tests=fail
    - id: layering
      why: deny.toml does not keep reqwest behind betterlite-http
      run: grep -qE 'crate = "reqwest", wrappers = \[[^]]*"betterlite-http"' deny.toml
oracle_cases:
  - tools/oracle/cases/chat/openai-basic.yaml
  - tools/oracle/cases/chat/openai-tools.yaml
  - tools/oracle/cases/chat/openai-json-mode.yaml
  - tools/oracle/cases/chat/openai-extra-param.yaml
  - tools/oracle/cases/chat/openai-env-api-key.yaml
  - tools/oracle/cases/chat/engines-path.yaml
  - tools/oracle/cases/chat/deployments-path.yaml
  - tools/oracle/cases/chat/unknown-model.yaml
  - tools/oracle/cases/chat/upstream-400.yaml
  - tools/oracle/cases/chat/upstream-401.yaml
  - tools/oracle/cases/chat/upstream-429.yaml
  - tools/oracle/cases/chat/upstream-500.yaml
deviations:
  - what: betterlite does not send the x-stainless-* headers or the OpenAI SDK user-agent upstream.
    why: Those headers describe LiteLLM's Python client, not the user's request.
    link: https://github.com/openai/openai-python
out_of_scope:
  - Streaming (B005), retries (B017), fallbacks and cooldowns (B018).
  - Weighted deployment choice (B008).
  - The x-litellm-response-cost and x-litellm-key-* headers, cost tracking and spend logs; they need spend tracking (B069) and virtual keys (B052).
  - Providers other than openai/.
pitfalls:
  - Never seed the random source from a global. Tests pass a seeded one and the binary passes one seeded from the OS.
  - LiteLLM may add fields to the response that OpenAI did not send. Follow the oracle, and when a field is random per request, ignore its pointer in the case with a why.
  - The oracle under tools/ depends on reqwest directly, so the deny.toml entry is { crate = "reqwest", wrappers = ["betterlite-http", "betterlite-oracle"] }.
budget:
  max_changed_lines: 800
  max_new_expects: 2
