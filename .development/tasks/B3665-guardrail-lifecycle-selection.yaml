dod:
  - text: event_hook_is_event_type gives true with no hook, compares a single hook, looks through a list, looks through every tag value and `default` of a `Tagged` hook in both their forms, and gives false when none holds the event.
    proof: [event-hook-tests, oracle]
  - text: A root `guardrails` key decides alone even when empty, the first metadata object holding the key decides next with `metadata` ahead of `litellm_metadata`, an object without the key or a non-object hides nothing, and null reads as an empty list.
    proof: [requested-tests, oracle]
  - text: A `guardrails` value that is neither a list nor null gives `RequestedNotList` at the root and in both metadata objects.
    proof: [requested-tests]
  - text: A guardrail counts as requested through a text entry equal to its name or an object entry with its name as a key, other entries never match, and a guardrail with no name is never requested.
    proof: [requested-tests, oracle]
  - text: Admin metadata takes the last non-empty `user_api_key_team_metadata` and `user_api_key_metadata` from `metadata` then `litellm_metadata`, skips a non-object metadata value, and lays key values over team values key by key.
    proof: [admin-tests, oracle]
  - text: Only a boolean true `disable_global_guardrails` in admin metadata disables global guardrails, and a non-list `opted_out_global_guardrails` reads as empty.
    proof: [admin-tests]
  - text: Neither opt-out counts at the root of `data`, directly in `metadata`, or under the singular name `disable_global_guardrail`.
    proof: [admin-tests, oracle]
  - text: A `default_on` guardrail gives false when opted out, false when disabled, false when the hook doesn't match and true when it matches, whatever the requested list holds.
    proof: [gate-tests, oracle]
  - text: A guardrail that isn't `default_on` and has an `event_hook` gives false when it isn't requested, unless `event_type` is `logging_only`, and gives false for a hook that doesn't match even when requested.
    proof: [gate-tests, oracle]
  - text: A guardrail with no `event_hook` and no `default_on` gives true for any event without being requested, and opt-outs never stop a guardrail that isn't `default_on`.
    proof: [gate-tests, oracle]
  - text: A name in `suppressed` gives false ahead of every other step, for a `default_on` guardrail and a requested one, a guardrail with no name is never suppressed, and names placed in `data` suppress nothing.
    proof: [suppressed-tests, oracle]
  - text: A matching `Tagged` hook gives `TagMode` for a `default_on` guardrail and for a requested one, a `Tagged` hook that doesn't match gives false, and an opt-out or a missing request gives false before the error can happen.
    proof: [tag-tests, oracle]
  - text: dynamic_request_body_params returns the `extra_body` of the first object entry naming the guardrail, skips text entries, and gives an empty map with no such entry, no name, a null entry value, or a missing or null `extra_body`.
    proof: [dynamic-tests, oracle]
  - text: An entry value or an `extra_body` that is neither an object nor null gives `DynamicParamsNotObject`.
    proof: [dynamic-tests]
  - text: Converting the error to `GuardrailFailure` gives `Http` with status 500 for `TagMode` and status 400 for the other two variants.
    proof: [failure-tests]
  - text: The helper cases for this task were added on this branch.
    proof: [helper-cases-added]
checks:
  optional: [mutants]
  commands:
    - id: event-hook-tests
      why: a hook form is compared wrongly or a Mode value is missed
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::event_hook_/)'
    - id: requested-tests
      why: the lookup order of requested guardrails or an entry match is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::requested_/)'
    - id: admin-tests
      why: admin metadata merges in the wrong order or a caller-sent value counts as an opt-out
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::admin_/)'
    - id: gate-tests
      why: the steps of should_run_guardrail run in the wrong order or a branch gives the wrong answer
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::gate_/)'
    - id: suppressed-tests
      why: suppression comes too late or data can suppress a guardrail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::suppressed_/)'
    - id: tag-tests
      why: a tag-based hook runs, is skipped silently, or fails before the opt-outs
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::tag_/)'
    - id: dynamic-tests
      why: the wrong entry's extra_body is returned or a bad value goes unnoticed
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::dynamic_/)'
    - id: failure-tests
      why: a selection error reaches the hook with the wrong status
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_selection::tests::failure_/)'
    - id: helper-cases-added
      why: the helper cases for this task were not added on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/guardrail-selection)"
