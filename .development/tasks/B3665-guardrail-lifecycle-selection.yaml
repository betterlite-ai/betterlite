id: B3665
title: Guardrail lifecycle selection and trusted opt-outs
description: >-
  Add the module `guardrail_selection` to betterlite-guardrails. Before any guardrail hook runs, LiteLLM asks `CustomGuardrail.should_run_guardrail` whether this guardrail applies to this request at this hook. This task builds that gate, the reads of request data behind it, and the read of a request's per-guardrail `extra_body`. Request data is `BTreeMap<String, GuardrailValue>`, called `data` below. The gate runs no hook and records nothing: B124 owns the dispatch and asks the gate first.


  Files. `guardrail_selection.rs` declares the submodules and re-exports `GuardrailSelectionError`. `guardrail_selection/error.rs` holds that enum. `guardrail_selection/metadata.rs` holds the free functions that read `data`, all `pub(super)`. `guardrail_selection/gate.rs` holds an `impl GuardrailBase` block, so the provider tasks in this crate call `base.should_run_guardrail(...)`. `GuardrailBase` and `GuardrailFailure` come from `guardrail_base` (B5471), `GuardrailValue` from `sections::guardrail_identity` (B3660), and `LitellmParamsMode`, `Mode`, `ModeTarget` and `GuardrailEventHooks` from `sections::guardrail_params` (B3662). The guardrail's own values are `self.settings.guardrail_name`, `self.settings.event_hook` and `self.settings.default_on`.


  Admin metadata, in `metadata.rs`. `admin_metadata(data) -> BTreeMap<&str, &GuardrailValue>` is `_get_admin_metadata`. Walk `metadata`, then `litellm_metadata`, and skip one that isn't an object. In each, a non-empty object under `user_api_key_team_metadata` becomes the team map and a non-empty object under `user_api_key_metadata` becomes the key map, replacing what an earlier pass found. Then start from the team map and lay the key map over it, key by key. `global_guardrails_disabled(data) -> bool` is true only when the merged `disable_global_guardrails` is the boolean true. `opted_out_global_guardrails(data) -> Vec<&str>` returns the text entries of the merged `opted_out_global_guardrails` when that value is a list, and an empty list otherwise. The proxy writes these two metadata objects after stripping what the caller sent (B1137), so this is the trusted source for both opt-outs, and nothing else in `data` may feed them.


  Requested guardrails, in `metadata.rs`. `requested_guardrails(data) -> Result<&[GuardrailValue], GuardrailSelectionError>` is `get_guardrail_from_metadata`. A root key `guardrails` decides alone. Without one, the first of `metadata` and `litellm_metadata` that is an object holding the key `guardrails` decides. With no key anywhere the list is empty. The value that decides must be a list. Null reads as an empty list, and any other value is `GuardrailSelectionError::RequestedNotList`, since docs/compatibility.md rejects a value the declared type can't hold.


  The gate, in `gate.rs`. `should_run_guardrail(&self, data, event_type: GuardrailEventHooks, suppressed: &BTreeSet<String>) -> Result<bool, GuardrailSelectionError>` takes these steps in this order, and the first step that answers ends the call. A guardrail whose name is in `suppressed` gives false. For a `default_on` guardrail, a name in the opted-out list gives false, then a true `global_guardrails_disabled` gives false, then the hook decides: no match gives false, a match on a `Tagged` hook gives `TagMode`, and any other match gives true. A guardrail that isn't `default_on` goes on. When its `event_hook` is set, it isn't in the requested list and `event_type` isn't `logging_only`, the answer is false. After that, no hook match gives false, a `Tagged` hook gives `TagMode`, and everything else gives true. Call `requested_guardrails` only in the step that uses it.


  `suppressed` holds the names an auto router's compression policy turned off for this one request. LiteLLM keeps them in a ContextVar set by `arm_pre_call`. betterlite has no ambient per-request state, and B3546 depends on this task, so the caller reads them from B3546's `suppressed_guardrails` and passes them in. A caller with no auto router passes an empty set. A guardrail with no name is never suppressed.


  `event_hook_is_event_type(&self, event_type: GuardrailEventHooks) -> bool` is public, because provider tasks call it too. No hook gives true. `One` compares the text, `Many` looks through the list, and `Tagged` looks through every value of `tags` and then `default`, each `ModeTarget` in either form. B3662 gives `GuardrailEventHooks` only its serde names, so add a private `hook_text(event_type: GuardrailEventHooks) -> &'static str` in `gate.rs` with one arm per hook and no wildcard. `is_requested_guardrail(&self, requested: &[GuardrailValue]) -> bool` is `_guardrail_is_in_requested_guardrails`: a `Text` entry equal to the name or an `Object` entry with the name as a key counts, and any other entry is skipped.


  `dynamic_request_body_params(&self, data) -> Result<BTreeMap<String, GuardrailValue>, GuardrailSelectionError>` is `get_guardrail_dynamic_request_body_params`, called by Noma, GraySwan, Presidio, Bedrock and the other providers that forward caller options. Walk the requested list. The first `Object` entry with the guardrail's name as a key decides, and its value's `extra_body` is the answer. A guardrail with no name, no such entry, a null entry value, a missing `extra_body` or a null one gives an empty map. An entry value or an `extra_body` that is neither an object nor null is `DynamicParamsNotObject`. There is no premium check, see deviations, so `_validate_premium_user` isn't built.


  `GuardrailSelectionError` has three variants: `TagMode { guardrail_name: Option<String> }`, `RequestedNotList` and `DynamicParamsNotObject { guardrail_name: String }`, with messages in betterlite's own words. `TagMode` is what open-source LiteLLM does for a tag-based hook: the tag logic lives in the enterprise package, so the import fails and the request ends in HTTP 500. betterlite doesn't build that logic. `impl From<GuardrailSelectionError> for GuardrailFailure` lets a hook use `?`: `TagMode` becomes `GuardrailFailure::Http` with status 500, the other two with status 400, and `detail` is the error's Display text.


  Tests live in `guardrail_selection/tests.rs`. Test names start with `event_hook_`, `requested_`, `admin_`, `gate_`, `suppressed_`, `tag_`, `dynamic_` or `failure_`, because the checks filter on those prefixes.


  Each oracle case calls one function through the task's helper operation. A case gives `function` (`should_run_guardrail`, `event_hook_is_event_type` or `dynamic_request_body_params`), `guardrail_name`, `event_hook` (absent, text, a list, or an object with `tags` and `default`), `default_on` and `data`. The first two functions also get `event_type`, and the gate gets `suppressed` as a list. Both sides answer `{result: <value>}`, and a `TagMode` error answers `{result: rejected}`. The Python side builds `CustomGuardrail(guardrail_name=..., event_hook=..., default_on=...)` with `Mode(**value)` for an object hook and `GuardrailEventHooks(value)` for `event_type`, and it calls `should_run_guardrail`, `_event_hook_is_event_type` or `get_guardrail_dynamic_request_body_params`. It sets `_suppressed_compression_guardrails` from `litellm.proxy.guardrails.auto_router_compression` to `frozenset(suppressed)` and resets it after the call, catches `ImportError` for the rejected answer, and sets `premium_user` to true on `litellm.proxy.proxy_server` before the dynamic call.
