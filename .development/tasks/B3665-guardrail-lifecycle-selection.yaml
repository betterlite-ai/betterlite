deviations:
  - what: A request's per-guardrail `extra_body` always reaches the guardrail. LiteLLM without a license logs a warning and returns an empty map.
    why: betterlite has no paid tier and every feature is on, so `premium_user` is true here and the check is left out.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_guardrail.py#L1156-L1207
out_of_scope:
  - Hook dispatch. B124 owns ProxyLogging in litellm/proxy/utils.py, with _execute_guardrail_hook, _process_guardrail_callback, pre_call_hook and during_call_hook. It maps pre_call and during_call to their MCP events, asks this gate, and calls GuardrailInvocation begin and finish from B3664 around each hook.
  - In custom_guardrail.py, B5471 owns the class and its constructor, is_guardrail_intervention, _strict_guardrail_modes_enabled, get_session_id_from_request_data, render_violation_message, raise_passthrough_exception, inject_advisory_message, get_config_model, get_supported_event_hooks, _validate_event_hook, uses_apply_guardrail_interface, supports_scan_only_tool_results, structured_messages_cover_full_request, apply_guardrail, mask_content_in_string and update_in_memory_litellm_params, and it records the sensitive data functions with no caller at the pin.
  - In custom_guardrail.py, B3664 owns add_standard_logging_guardrail_information_to_request_data, _process_response, _summarize_guardrail_response, _process_error, _inputs_were_modified, get_guardrails_messages_for_call_type, _append_slg_to_litellm_params, _sync_guardrail_info_to_logging_obj, _original_inputs_for and log_guardrail_information.
  - In custom_guardrail.py, B3666 owns the scan cache, the pre-call markers, _deployment_hook_target, the deployment and logging hooks, _is_valid_response_type, _user_api_key_auth_from_request and _unified_hook_fields.
  - B5470 owns every function of litellm/proxy/guardrails/_content_utils.py. The gate reads no message content.
  - B3546 owns litellm/proxy/guardrails/auto_router_compression.py, with suppressed_compression_guardrails and arm_pre_call, and B3683 owns its startup policy. This module only takes the names as an argument.
  - B1137 strips caller-sent user_api_key_* keys and control fields from both metadata objects and writes the admin metadata. This module reads the result and strips nothing.
  - The should_run_guardrail overrides in panw_prisma_airs, grayswan, llm_as_a_judge and cisco_ai_defense_mcp stay with those provider tasks, B3772 for GraySwan.
  - EnterpriseCustomGuardrailHelper._should_run_if_mode_by_tag is in the enterprise package and is not built.
pitfalls:
  - The gate compares the exact event it gets, so don't turn `pre_call` into `pre_mcp_call` here, because the caller already did.
  - Read `self.settings.event_hook` and never `self.mode`, because a config update through B5471's `update_params` writes `mode` and leaves `event_hook` as the constructor set it.
  - A guardrail with no `event_hook` that isn't `default_on` runs on every event without being requested, so a missing hook means all hooks and not none.
  - "`logging_only` skips only the requested check, so a guardrail with `event_hook: pre_call` still gives false for it through the hook match."
  - "`default_on` guardrails never look at the requested list, so `guardrails: []` can't stop one."
  - Opt-outs apply only to `default_on` guardrails, so a requested guardrail named in `opted_out_global_guardrails` still runs.
  - A key's `disable_global_guardrails` false beats a team's true, and a key's `opted_out_global_guardrails` list replaces the team's list and doesn't add to it, because the merge works key by key.
  - A non-empty `user_api_key_metadata` in `litellm_metadata` replaces the whole object found in `metadata`, and an empty one leaves that object in place.
  - LiteLLM tests `is True`, so the text `true` or the number 1 in `disable_global_guardrails` disables nothing, and only the plural key is read, so a value under the singular `disable_global_guardrail` changes nothing.
  - A root `guardrails` key holding an empty list hides `metadata.guardrails`, and `metadata` holding `guardrails` hides `litellm_metadata.guardrails` even when empty or null, but a `metadata` object without the key hides nothing.
  - Suppression must stay ahead of the opt-outs and must come only from the argument, because metadata reaches spend logs the caller can read, and a caller who replays a list there could turn off any guardrail.
  - A `Tagged` hook that matches must return the error and never false, or a guardrail the admin configured stops running with nothing to show for it.
  - In `dynamic_request_body_params`, a text entry `pii` followed by an object entry named `pii` returns that object's `extra_body`, because a text entry is skipped and is not a match, and only the first object naming the guardrail counts.
  - The names `get_opted_out_global_guardrails_from_metadata` and `get_guardrail_dynamic_request_body_params` are over the 30-character limit, so use the names in the description.
  - Pass `GuardrailEventHooks` by value only if B3662's enum derives Copy, and by reference if it doesn't.
  - "`ibm_hooks/config.rs` has its own local `should_run_guardrail`, so leave it alone."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
