id: B2233
title: Stream tool fragment assembly
description: >-
  Implement shared typed chunk assembly in betterlite-streaming, below provider and SSE execution. Parsed chunk
  DTOs come from B004; this task does not create another SSE/JSON parser. Use bounded outputs and injected clock/counters
  where the source reads them.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/litellm_core_utils/streaming_chunk_builder_utils.py:
  ChunkProcessor._iter_tool_call_fragments L443-L474; _join_fragments_by_key_and_field L476-L488; get_combined_tool_content
  L490-L640; get_combined_function_call_content L642-L665.


  Named case contracts: tool_indices_and_fragments: Process every choice and tool in chunk order, key by (choice
  index default0, tool index default0), skip falsey tools and those with neither non-None function nor custom payload.
  Concatenate truthy argument/custom-input fragments in original order per key, emit tools in sorted key order,
  preserve interleaved choices with the same tool index separately. tool_metadata_last_truthy: Last truthy id/type/function
  name/custom name wins. Prefer truthy tool provider_specific_fields over function-level fields; merge dicts shallowly
  last-wins across chunks. Falsey or non-dict values do not clear earlier fields. Exercise both source dict and
  SDK-object forms. custom_precedence_and_incomplete: Emit only entries with truthy id and name. A custom name takes
  priority over function name, uses concatenated custom input default empty and drops provider fields/type. Function
  arguments empty becomes literal {}, type defaults function, provider fields appear on the tool only when nonempty.
  Incomplete tools disappear. legacy_function_join: Legacy function_call name is taken from the first chunk first
  choice function object. Concatenate argument strings from all truthy function calls in every choice, including
  differing names; no JSON parse or {} default. Missing first function, empty input or invalid argument type retains
  the source failure category.


  Implement crates/betterlite-streaming/src/stream_tool_assembly.rs with adjacent tests under stream_tool_assembly/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_tool_assembly_cases in betterlite-streaming with these exact named cases (one per
  oracle file): tool_indices_and_fragments, tool_metadata_last_truthy, custom_precedence_and_incomplete, legacy_function_join.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/stream_tool_assembly* using HelperCase: kind:
  helper and the externally tagged stream_tool_assembly variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_stream_tool_assembly that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 182 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 250 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 620 planned, 625 maximum changed lines.
