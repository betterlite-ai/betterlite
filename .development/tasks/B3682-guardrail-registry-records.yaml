dod:
  - text: stable_guardrail_id returns the v5 UUID of the name in LiteLLM's namespace, then the `name:1`, `name:2` ids while the earlier ones are taken, and matches LiteLLM on every oracle case.
    proof: [stable-id-tests, oracle]
  - text: GuardrailFactories builds callbacks for the seven wire names (the seventh is `tool_policy`, built with the two ports the caller passes to GuardrailFactories::new) with the supported event hooks of each kind, gives up to three Presidio callbacks in order, always fails hide-secrets, and rejects any other name with "Unsupported guardrail".
    proof: [build-tests]
  - text: configure_scoping copies the three scoping values, rejects scan_only_tool_results for a Bedrock callback in latest-role mode and together with a skip-tool value, and overwrites run_in_parallel and scan_raw_request only when set.
    proof: [scoping-tests]
  - text: Rows map to guardrails and back with the params as JSON text, accept an object as well as a text value, carry team_id from the row into the guardrail, and never put a parameter value in an error.
    proof: [rows-tests]
  - text: GuardrailRegistry creates, updates, deletes and reads rows through the GuardrailRows trait with LiteLLM's messages, returns only active rows newest first, and turns a missing row on update into the not found failure.
    proof: [registry-tests]
  - text: GuardrailCallback::is_compression is true for a callback whose spec is Compression and false for the five built specs.
    proof: [build-tests]
  - text: compression_kind is Some for headroom, compresr and typesafe and None for any other name, and initialize_guardrail marks the callbacks of a compression provider with the Compression spec.
    proof: [build-tests, handler-init-tests]
  - text: initialize_guardrail replaces os.environ/ values, keeps an already held id untouched and records source and callbacks, with the first callback as primary.
    proof: [handler-init-tests]
  - text: update, reinitialize and delete keep callbacks and sources in step, restore the previous guardrail when the new one fails to start, and the config-only readers hide db entries.
    proof: [handler-update-tests]
  - text: params_changed is true for a new guardrail, a new name or any differing params key, and false for equal params.
    proof: [changed-tests]
  - text: PostgresGuardrailRows compiles against B726's guardrails binding and the crate builds with the new dependencies.
    proof: [crate-build]

checks:
  optional: [mutants]
  commands:
    - id: stable-id-tests
      why: the stable id seeds, namespace or text form are wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::stable_id_/)'
    - id: build-tests
      why: a guardrail kind builds with the wrong callbacks, supported hooks or error
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::build_/)'
    - id: scoping-tests
      why: the scan-only rules or the two overrides differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::scoping_/)'
    - id: rows-tests
      why: the row mapping loses a field or accepts only one JSON shape
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::rows_/)'
    - id: registry-tests
      why: a DB operation of GuardrailRegistry differs from LiteLLM in result or message
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::registry_/)'
    - id: handler-init-tests
      why: initialize_guardrail does not keep the held id, the env values or the callback order
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::handler_init_/)'
    - id: handler-update-tests
      why: update, reinitialize, delete or the readers leave callbacks or sources out of step
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::handler_update_/)'
    - id: changed-tests
      why: the params comparison reports a change that is not one, or misses one
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_registry::tests::changed_/)'
    - id: crate-build
      why: the Postgres rows adapter does not compile against B726's binding
      run: cargo check --locked -p betterlite-guardrails --all-targets && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-guardrails/src/guardrail_registry)"

deviations:
  - what: Live callbacks are held by InMemoryGuardrailHandler and read through its methods. LiteLLM adds each one to `litellm.logging_callback_manager`, and `delete_in_memory_guardrail` removes it from every callback list.
    why: Rust has no global callback list, and B189's registry is a closed enum of logging sinks. The hook dispatcher (B124) asks the handler. Removing a guardrail drops its callbacks with it, so none is left behind.
  - what: A guardrail type with a dot in its name (a custom guardrail class loaded with `get_instance_fn` from a Python file or module) gives the error "Unsupported guardrail" with the type name.
    why: Rust cannot import a Python class. Custom guardrails run as custom code guardrails (B3801 and its siblings), which are separate types.
  - what: >-
      `_normalize_litellm_params_for_comparison` does not fall back to the raw dict when LitellmParams validation fails.
    why: Params are already typed when they reach the handler, so the invalid case cannot happen here.
  - what: Only the seven builtin kinds are in GuardrailFactories. `grayswan` and `llm_as_a_judge`, which LiteLLM registers in the same dict, return Unsupported here; B8521 adds them with every other guardrail_hooks folder through GuardrailFactories::with_hooks.
    why: Neither has an argument-struct builder in B3681, and their class constructors belong to B3772 and B3809. Third-party guardrails found by `get_guardrail_initializer_from_hooks` are registered the same way, by an explicit list.
  - what: Environment references in api_key and api_base read only environment variables, not secret managers.
    why: The function get_secret lives in the secret manager tasks (B8500). The config path already resolves references through B3662, so this covers guardrails created through the routes.

out_of_scope:
  - "reconcile_db_guardrails, sync_guardrail_from_db, GUARDRAIL_RECONCILE_LOCK, the module-level IN_MEMORY_GUARDRAIL_HANDLER and GUARDRAIL_REGISTRY instances: B3683."
  - "Hook code of the Bedrock, Lakera, Presidio and tool permission classes (what each callback does on a request): their own tasks, which match on CallbackSpec."
  - "Starting guardrails from the config file and the startup log lines: B3683 (init_guardrails.py)."
  - "The routes that call the registry and handler: B3684 to B3687."
  - "get_guardrail_class_from_hooks and get_guardrail_initializer_from_hooks (directory scans at import time): replaced by the explicit list in GuardrailFactories."
  - "initialize_custom_guardrail: no Python class loading, see the deviations."
  - "The `litellm_guardrailstable` schema and the config-sync publication: B703 and B4144."

pitfalls:
  - "`add_guardrail_to_db` and `update_guardrail_in_db` store `litellm_params` and `guardrail_info` as JSON text (`safe_dumps`) in a Json column, so the stored value is a string holding JSON, not an object."
  - "`get_all_guardrails_from_db` returns only `status = 'active'` rows, so `pending_review` and `rejected` guardrails never reach the handler; the by-id and by-name reads have no status filter."
  - "`initialize_guardrail` returns early for a held id without building anything, but it still rewrites `_sources`, so a config reload can correct the source of a db entry."
  - "A missing variable behind `os.environ/` makes api_key the text \"None\", since LiteLLM wraps `get_secret` in `str()`. The guardrail starts and then fails at its first provider call."
  - "The `guardrail_id` of a config guardrail is a v5 UUID of its name, so the same name keeps its id across restarts, and a second guardrail with the same name gets the `name:1` seed."
  - "`reinitialize_guardrail` deletes the old callbacks before it builds the new ones, so the restore on failure builds the previous guardrail again and does not reuse the old objects."
  - "The Presidio restore callback is a sibling, not the primary, so `get_initialized_guardrail_callback` finds all three by name but `guardrail_id_to_custom_guardrail` holds only the input scan."
  - "`run_in_parallel` and `scan_raw_request` must not be copied when the params leave them out: a constructor default of true would be turned to false."
  - "The `hide-secrets` wire name has a hyphen, while `tool_permission` and `lakera_v2` use underscores."
  - "`update_in_memory_guardrail` with unchanged params keeps the old callbacks, so a change to a field outside litellm_params (such as guardrail_info) never rebuilds them."

