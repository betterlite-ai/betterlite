id: B041
title: Complete aggregator media HTTP coverage and run the family regression
description: >-
  Finish the aggregator umbrella with the missing public media proofs. All seven
  aggregator _complete_* functions and their embedding/speech branches already belong
  to B8310 and B8311; their tests cover chat and embeddings. B5830's OpenRouter image
  configs have only helper cases. Add HTTP fixtures under tools/oracle/cases/http/aggregator-media
  and run the new hosted-platform suite from B9210 as this umbrella's closing regression. The
  Eden AI arms (B5838 adds them to B8311's dispatch), the video routes (B3343, B3344) and
  B9211's structured-endpoint suite are later work, so those tasks add the Eden AI media and
  video cases and run that suite; this task covers OpenRouter.
  No product code, provider constructor, route or parser is introduced. The implementation
  remainder is zero LiteLLM lines; the work is approximately 700 media fixture lines and
  small binary assets. B9210 splits the larger HTTP matrix into a bounded task, and its
  cases are direct inputs of this task's family-regression check.

  Use the booted proxy, the existing HTTP case/steps schema and the harness mock provider.
  Set general_settings.master_key and router_settings.num_retries: 0. Deployment entries
  under model_list supply litellm_params.model, api_key and api_base, with fixed dummy
  credentials and bases inside the mock.
  OpenRouter fixtures use a base ending /api/v1. OpenRouter image generation otherwise calls
  https://openrouter.ai/api/v1/chat/completions; that public default may not be contacted.
  The existing config section resolves OPENROUTER_API_KEY. No new
  setting or alternative key policy belongs in this task.

  openrouter-generation uses openrouter/google/gemini-2.5-flash-image with size 1792x1024
  and quality high. The captured request goes to /api/v1/chat/completions with one user
  text message and image_config {aspect_ratio: '16:9', image_size: '4K'}, without modalities.
  Return two images in choices[].message.images, one data URL and one ordinary URL, plus
  explicit usage with prompt_tokens, completion_tokens_details.image_tokens, total_tokens
  and numeric cost. Compare the ImageResponse data, input/output usage and stable cost
  headers the image route exposes. openrouter-edit uploads a tiny PNG through the existing
  multipart fixture mechanism with prompt, model, size and quality fields. Capture the
  JSON chat request: image_url data first, text second, modalities [image, text], no
  multipart provider body. Its reply includes prompt_tokens_details.image_tokens, proving
  input text tokens are prompt minus image tokens rather than generation's all-text count.

  media-auth-errors configures these same deployments and sends valid image requests
  without proxy Authorization, then a configured upstream 401 on an authenticated OpenRouter
  image call. Compare HTTP status and the complete error envelope
  except /error/message, whose wording is betterlite's. Missing proxy auth must consume
  no mock answer. The non-error cases compare client content-type, upstream authorization
  and content-type, paths and bodies. Keep image data, usage and cost fields compared;
  only individually identified generated ids/timestamps may be ignored. Mock responses
  should supply fixed values wherever the provider controls them.

  Paths and aliases, already registered by B082 and B083: POST
  /v1/images/generations, /images/generations and
  /openai/deployments/{model:path}/images/generations; POST /v1/images/edits, /images/edits
  and /openai/deployments/{model:path}/images/edits. Cover each alias once with
  steps distributed across the relevant case. There are no /openai/v1 or provider-prefix
  aliases for these handlers. B8610's area aggregation, B8634's search/decisions mount,
  B8606's NVIDIA/OpenRouter passthrough mount and B8580's Eden Messages binding remain
  their owners' work. In particular, this task never merges any router again.
scope:
  paths:
    - tools/oracle/cases/http/aggregator-media/**
    - tools/oracle/fixtures/multipart-oracle/aggregator-media/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openrouter.py#L1-L7
    why: The whole residual type file has no executable functions; B7929 owns its Python TypedDict surface.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/transformation.py#L68-L409
    why: B5830's image-generation projection and usage are the observable media assertions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_edit/transformation.py#L83-L368
    why: B5830's multipart-to-JSON edit composition and input-image usage split.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/image_endpoints/endpoints.py#L67-L224
    why: Existing generation decorators, dispatch and response headers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/image_endpoints/endpoints.py#L226-L277
    why: Existing edit decorators and multipart entry.
dod:
  - text: OpenRouter generation and editing reach its chat endpoint through every image alias, preserving their different request modalities and image usage.
    proof: [image-cases, oracle]
  - text: Auth rejection happens before media transport and an upstream authentication failure keeps LiteLLM's status, type, param and code.
    proof: [auth-case, oracle]
  - text: The hosted-platform fixtures supplied by B9210 pass against the same built gateway as the final media suite.
    proof: [family-regression, oracle]
checks:
  optional: []
  commands:
    - id: image-cases
      why: Both OpenRouter image projections require newly added HTTP cases.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/aggregator-media)" && test -f tools/oracle/cases/http/aggregator-media/openrouter-generation.yaml && test -f tools/oracle/cases/http/aggregator-media/openrouter-edit.yaml
    - id: auth-case
      why: The media boundary needs a real auth rejection with no captured upstream request.
      run: test -f tools/oracle/cases/http/aggregator-media/media-auth-errors.yaml
    - id: family-regression
      why: The final umbrella directly consumes B9210's suite and fails on the base before its own media fixtures exist.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/http/aggregator-media)" && cargo run --locked -p betterlite-oracle -- tools/oracle/cases/http/hosted-platform-remainder
oracle_cases:
  - tools/oracle/cases/http/aggregator-media/openrouter-generation.yaml
  - tools/oracle/cases/http/aggregator-media/openrouter-edit.yaml
  - tools/oracle/cases/http/aggregator-media/media-auth-errors.yaml
deviations: []
out_of_scope:
  - All functions in the OpenRouter image files remain B5830's, all Eden media functions remain B5838's and every Eden common helper remains B6100's; these references specify HTTP observations only.
  - OpenRouterErrorMessage in types/llms/openrouter.py has no runtime function; B7929 preserves the Python type, while B6080 represents the native streaming error fields.
  - The only existing task mention of B041 is B1672's resolved B041 -> B024 -> B068 cycle; _as_rate and with_default_cache_read_rate remain B1672's, with no handoff here.
  - In main.py, _complete_fireworks_ai, _complete_together_ai, _complete_groq, _complete_cloudflare and their selected embedding branches belong to B8310; _complete_openrouter, _complete_vercel_ai_gateway, _complete_edenai and their embedding/speech branches belong to B8311.
  - The remaining main.py provider functions stay with their existing owners, grouped by _complete_ suffix below; no provider dispatch function is built by this fixture task.
  - B024 owns text_completion_openai and custom_openai; B025 azure and azure_text; B026 azure_ai; B027 anthropic and anthropic_text; B028 bedrock, bedrock_mantle and amazon_nova; B031 vertex_ai and vertex_ai_beta; B036 xai, mistral and text_completion_codestral; B037 cohere_chat.
  - B038 owns deepseek, heroku, cometapi, compactifai, datarobot, text_completion_inception, gradient_ai, gdc and bytez; B039 owns maritalk, nadir and ovhcloud; B049 ragflow; B046 fal_ai; B050 a2a, langgraph and langflow.
  - B8157 owns hosted_vllm, oobabooga, vllm, ollama, ollama_chat, triton, petals and lemonade; B8312 minimax, gigachat and nlp_cloud; B8330 oci, databricks and snowflake; B8331 sap, sagemaker_chat, sagemaker, watsonx and watsonx_text; B8332 replicate, huggingface and predibase; B044 aiohttp_openai, custom, custom_providers and _custom_api_first_output.
  - B5650 owns _resolve_control_options, _is_claude_tool_target, _without_anthropic_only_tool_keys, _drop_anthropic_only_tool_keys, _ProxyAuthHeadersProvider.get_auth_headers, _proxy_auth_headers, _build_custom_pricing_entry, _get_router_deployment_id and _register_custom_pricing_for_request; B198 owns _provider_config_items, _locals_snapshot, _dispatch_metadata and the _dispatch_client_http, _dispatch_client_azure and _dispatch_client_openai accessors.
  - B158 owns the LiteLLM, Chat, Completions and AsyncCompletions constructors/create methods, config_completion and __getattr__; B5655 and B5656 own completion/acompletion preparation and execution, cached response projection, _resolve_dispatched_chat_response, _async_streaming and acount_tokens; B5659 exposes the native Python completion calls.
  - B255 owns mock_completion, _handle_mock_potential_exceptions, both _handle_mock_timeout variants, both _sleep_for_timeout variants, admission_input_tokens and admitted_prompt_token_counter; B500 owns _is_openai_backed_api_base and _resolve_openai_api_base; B5651 owns responses_api_bridge_check; B5656 owns completion_with_retries and acompletion_with_retries, while B7841 owns responses_with_retries and aresponses_with_retries.
  - B6041 and B159 own aembedding and embedding wrappers around the provider arms; B6042 owns atext_completion, text_completion, _resolve_dispatched_text_completion_response and _resolve_pending_chat_response; B158 and B159 retain aadapter_completion, aadapter_generate_content and adapter_completion; B015 owns moderation/amoderation; B1082, B1083 and B1084 own transcription/atranscription and speech/aspeech around the provider branches, with B6045's Python exposure.
  - B4449 owns ahealth_check; B2239 print_verbose; B195 _load_default_encoding; B196 _load_module_encoding and _get_encoding; B2227 owns stream_chunk_builder_text_completion, _reported_cost_is_priced_by_calculator, _stream_builder_response_cost, _joined_streamed_citations, _stream_builder_model_map_cost, _set_stream_builder_response_cost, _stamp_streaming_usage_cost, _stream_choice_delta, _delta_carries_more_than_text, _simple_text_part and stream_chunk_builder.
  - HTTP mounts are B082, B083, B3343 and B3344 through B1100 and B8610; B8626, B8701 and B8728 concern MCP only. B9210 and B9211 own the other new HTTP fixtures, not production code.
pitfalls:
  - OpenRouter generation omits modalities while edit adds [image, text], although both post to chat/completions.
  - A successful helper invocation is not evidence that an image or audio route selected these configs; every new fixture must boot the proxy.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
