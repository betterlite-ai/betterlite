id: B041
title: Complete aggregator media HTTP coverage and run the family regression
description: >-
  Finish the aggregator umbrella with the missing public media proofs. All seven
  aggregator _complete_* functions and their embedding/speech branches already belong
  to B8310 and B8311; their tests cover chat and embeddings. B5830's OpenRouter image
  configs and B5838's Eden AI media configs have only helper cases. Add HTTP fixtures
  under tools/oracle/cases/http/aggregator-media and run the new hosted-platform and
  structured-endpoint suites from B9210 and B9211 as this umbrella's closing regression.
  No product code, provider constructor, route or parser is introduced. The implementation
  remainder is zero LiteLLM lines; the work is approximately 700 media fixture lines and
  small binary assets. The two sibling entries split the larger HTTP matrix into bounded
  tasks, and their cases are direct inputs of this task's family-regression check.

  Use the booted proxy, the existing HTTP case/steps schema and the harness mock provider.
  Set general_settings.master_key and router_settings.num_retries: 0. Deployment entries
  under model_list supply litellm_params.model, api_key and api_base, with fixed dummy
  credentials and bases inside the mock. Eden AI fixtures exercise its /v3 base prefix;
  OpenRouter fixtures use a base ending /api/v1. EDENAI_API_BASE otherwise defaults to
  https://api.edenai.run/v3, and OpenRouter image generation otherwise calls
  https://openrouter.ai/api/v1/chat/completions; neither public default may be contacted.
  The existing config sections resolve EDENAI_API_KEY and OPENROUTER_API_KEY. No new
  setting or alternative key policy belongs in this task.

  openrouter-generation uses openrouter/google/gemini-2.5-flash-image with size 1792x1024
  and quality high. The captured request goes to /api/v1/chat/completions with one user
  text message and image_config {aspect_ratio: '16:9', image_size: '4K'}, without modalities.
  Return two images in choices[].message.images, one data URL and one ordinary URL, plus
  explicit usage with prompt_tokens, completion_tokens_details.image_tokens, total_tokens
  and numeric cost. Compare the ImageResponse data, input/output usage and stable cost
  headers the image route exposes. openrouter-edit uploads a tiny PNG through the existing
  multipart fixture mechanism with prompt, model, size and quality fields. Capture the
  JSON chat request: image_url data first, text second, modalities [image, text], no
  multipart provider body. Its reply includes prompt_tokens_details.image_tokens, proving
  input text tokens are prompt minus image tokens rather than generation's all-text count.

  edenai-image uses edenai/openai/gpt-image-1-mini with n, size and output_format, expecting
  /v3/images/generations and seller model openai/gpt-image-1-mini. Return deterministic
  image data, usage and top-level cost. edenai-transcription uses edenai/openai/whisper-1
  with a WAV upload, language en and response_format json, then a text-format step. Verify
  /v3/audio/transcriptions receives a file and flat form fields, and preserve the returned
  transcription text and JSON usage. The JSON reply's top-level cost is not a replacement
  for its transcription text. edenai-speech uses edenai/openai/tts-1, input, voice alloy,
  response_format mp3 and speed. Capture the JSON body at /v3/audio/speech and return a
  small deterministic byte fixture with x-edenai-cost. Use a UTF-8-safe mock byte sequence
  for this transport proof because the current oracle renders audio/mpeg as text; compare
  every byte and content-type instead of ignoring the audio body. This is a mock transport
  response, not an audio codec test.

  edenai-video follows create, status, list and content through the existing video routes.
  Configure edenai/pruna/p-video, EDENAI_API_KEY with the dummy provider key and
  EDENAI_API_BASE at the same mock /v3 base so list's direct-provider path has credentials
  and cannot escape to the public default. Create with prompt and a
  mapping input_reference accepted by the JSON route, keeping that map in the provider
  JSON rather than converting it into a file. Return fixed video metadata and top-level
  cost; capture the returned id separately on each side for the status/content requests
  using the existing steps capture syntax. Check usage.provider_reported_cost_usd after
  create and status. Supply the existing custom_llm_provider header/query hint for list
  and retain its query_params nesting. Follow successful content with mock 404 replies
  for status, list and content: Eden's raise_for_status must prevent error bytes from
  becoming a successful video response. Use the existing byte fixture format with a
  deterministic UTF-8-safe payload; no codec or new binary comparator is needed.

  media-auth-errors configures these same deployments and sends valid image, audio and
  video requests without proxy Authorization, then a configured upstream 401 on an
  authenticated Eden image call. Compare HTTP status and the complete error envelope
  except /error/message, whose wording is betterlite's. Missing proxy auth must consume
  no mock answer. The non-error cases compare client content-type, upstream authorization
  and content-type, paths and bodies. Keep image data, usage and cost fields compared;
  only individually identified generated ids/timestamps may be ignored. Mock responses
  should supply fixed values wherever the provider controls them.

  Paths and aliases, already registered by B082, B083, B3343 and B3344: POST
  /v1/images/generations, /images/generations and
  /openai/deployments/{model:path}/images/generations; POST /v1/images/edits, /images/edits
  and /openai/deployments/{model:path}/images/edits; POST /v1/audio/transcriptions and
  /audio/transcriptions; POST /v1/audio/speech and /audio/speech; POST and GET /v1/videos
  and /videos; GET /v1/videos/{video_id} and /videos/{video_id}; GET
  /v1/videos/{video_id}/content and /videos/{video_id}/content. Cover each alias once with
  steps distributed across the relevant case. There are no /openai/v1 or provider-prefix
  aliases for these handlers. B8610's area aggregation, B8634's search/decisions mount,
  B8606's NVIDIA/OpenRouter passthrough mount and B8580's Eden Messages binding remain
  their owners' work. In particular, this task never merges any router again.
scope:
  paths:
    - tools/oracle/cases/http/aggregator-media/**
    - tools/oracle/fixtures/multipart-oracle/aggregator-media/**
  lint_tables: false
references:
