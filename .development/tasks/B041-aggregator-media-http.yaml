    why: B8311's existing Eden speech dispatch is exercised, not reimplemented.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openrouter.py#L1-L7
    why: The whole residual type file has no executable functions; B7929 owns its Python TypedDict surface.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/transformation.py#L68-L409
    why: B5830's image-generation projection and usage are the observable media assertions.
