id: B543
title: Azure assistants threads and runs
description: >-
  Implement Azure thread run/poll and run-stream operations using B521 wire/state records and B686 client preparation.
  Preserve additional_instructions, tools and errors; B686 owns assistant definitions, B687 threads, and B697 message/attachment
  policy.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/assistants.py:
  AzureAssistantsAPI.arun_thread L663-L703; AzureAssistantsAPI.async_run_thread_stream L705-L730; AzureAssistantsAPI.run_thread_stream
  L732-L757; AzureAssistantsAPI.run_thread L762-L781; AzureAssistantsAPI.run_thread L784-L803; AzureAssistantsAPI.run_thread
  L807-L905.


  Named case contracts: run_dispatch: Only arun_thread=True selects async and only stream=True selects streaming;
  other truthy values do not. B686 receives api_key/base/version/token/timeout/retries/client/litellm_params in
  each construction path. instructions_tools_overrides: Forward thread_id,assistant_id,additional_instructions,instructions,metadata,model,tools
  including None to create_and_poll or stream. stream itself is not sent to polling; preserve failed/requires_action/completed
  results and SDK errors unchanged, with no extra whole-run deadline. stream_event_handler: Sync/async stream helpers
  return the SDK manager directly, include event_handler only when not None and do not consume it; litellm_params
  is accepted by these helpers but unused after client construction. assistants_beta_default: SDK beta.threads.runs
  requests carry OpenAI-Beta: assistants=v2, using the same case contract as B521 and other Assistants siblings.


  Implement crates/betterlite-azure/src/assistants.rs with adjacent tests under assistants/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function assistants_cases in betterlite-azure with these exact named cases (one per oracle file):
  run_poll, run_stream, run_instructions_tools, run_failure, run_dispatch, instructions_tools_overrides, stream_event_handler,
  assistants_beta_default. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_assistants* using HelperCase: kind: helper
  and the externally tagged azure_assistants variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_assistants that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 227 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 170 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 535 planned, 550 maximum changed lines.
