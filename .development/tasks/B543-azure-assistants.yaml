pitfalls:
- 'The oracle helper for this task is pre-registered as azure_assistants in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/assistants.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_assistants.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The method named async_run_thread_stream is synchronous and returns a manager; awaiting it would change the client
  interface.
- Passing event_handler=None explicitly differs from omitting it at the SDK seam.
