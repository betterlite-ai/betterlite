id: B9997
title: MCP registry for Shared, its config and database loading and the startup wiring
description: >-
  LiteLLM keeps its MCP state in module globals (global_mcp_server_manager, global_mcp_tool_registry), fills them from
  config.yaml in _init_non_llm_configs (L7046) before the server starts, and reloads the servers from the database
  after each model reconcile and on a timer. B8614 ran the pass-through and agent part of that boot without MCP: its
  BootRegistries answers the mcp_tools and mcp_servers keys with an error that stops startup, B8384's two MCP database
  entry points return without loading, and neither B8613 nor B8610 makes or holds an MCP registry. This task builds the
  one MCP registry bundle the server holds, fills it from config and the database the way LiteLLM does, hands the same
  value to Shared, and replaces each of those stubs.


  Server side, module `server_registries::mcp`: crates/betterlite-server/src/server_registries/mcp.rs and
  server_registries/mcp/. Add `pub mod mcp;` to server_registries.rs, which B8614 wrote. Error enum McpRegistryError in
  mcp/error.rs, constructors `pub` because the binary calls them.

  `McpRegistry` holds `servers: SharedRegistry` (B4731's alias, an Arc of a tokio RwLock of ServerRegistry, created
  empty here), `mutator: Arc<RegistryMutator>` (B6765), `tools: Arc<ToolRegistry>` (B4680), `oauth_metadata:
  OAuthMetadataCache` (B6595's one cache, cheap to clone; B8620 and B8624 read it from here) and `instructions:
  Arc<InstructionsCacheCell>`. `McpRegistry::new(config: &Config, db: Option<Arc<PostgresStore>>, http: ProxiedClient)`
  builds RegistryMutator over that same SharedRegistry with B6763's ServerBuilder, B6762's DiscoverySlots and these
  constructor ports, each a small type in mcp/ports.rs (read every trait in its merged module):
  `DbServerRows` implements B6765's ServerRows with B4711's MCPServerRepository find_active (no rows without a database).
  `DiscoveryInvalidator` implements B6765's CacheInvalidator: invalidate_server(server_id) drops that server from the
  prompt, resource and template discovery caches DiscoverySlots holds and from the OAuthMetadataCache.
  `HttpMetadataFetcher` implements B6761's MetadataFetcher: get_json(url, headers) is a GET over the ProxiedClient that
  returns the status, headers and body bytes as a FetchedDocument, or a FetchError for a transport failure.
  `CipherDecryptor` implements B6763's Decryptor over B1600's stored cipher with the key the config resolves (the
  master key or LITELLM_SALT_KEY, as B1600 reads it), returning the value unchanged when it does not decrypt.
  `RegistrySettings` (B4731) is filled from the loaded config: public_mcp_servers, public_hub_strict and
  internal_ip_ranges from the keys B4731 names. `ToolRegistrySink` implements B6764's OpenApiToolSink over the
  ToolRegistry, writing the base and the prefixed name into the tool name mapping as B6764 says.
  `InstructionsCacheCell` implements B6764's InstructionsCache with a `OnceLock<Arc<dyn InstructionsCache>>`: clear()
  forwards to the value once it is set and does nothing before, since no instructions are cached until B6592's
  HealthService exists; B8620 builds that HealthService and calls `set` once. Every reader uses this one McpRegistry;
  nobody builds a second.


  Config boot, in B8614's crates/betterlite/src/boot_registries.rs. BootRegistries gains `mcp: Arc<McpRegistry>` and
  `python_hooks: Arc<PythonHooks>` (B165's one service for the process: B8375 builds it, LifespanInputs brings it), and
  BootRegistries::new takes both as its last arguments. The two stub methods become real, as LiteLLM's
  _init_non_llm_configs does (L7050-L7057 and L7068-L7078): `mcp_tools` awaits B8871's load_configured_tools with the
  mcp_tools list, the config file path and the PythonHooks BootRegistries holds, so a handler string imports through
  B165 instead of failing as unsupported. Entries register in order into the McpRegistry's ToolRegistry, and a later
  import failure leaves the earlier entries registered. `mcp_servers` loads the mcp_servers mapping with
  litellm_settings.mcp_aliases into the SharedRegistry through B6764's config loader. Each loader's error maps into
  B8590's `ConfigBootError::Step` with step "mcp_tools" or "mcp_servers" and the loader's error as source. Delete
  B8614's `boot_unbuilt_mcp_tools` and `boot_unbuilt_mcp_servers` tests. When B9998 already replaced the
  vector_store_registry stub, delete the NotBuilt variant too (and BootRegistryError with it when no variant is left);
  otherwise it stays for that key. In docs/deviations/B8614.yaml drop mcp_tools and mcp_servers from the not-built
  row, and the row itself once no key is left.


  Database loading, in B8384's crates/betterlite/src/db_object_sync.rs. DbObjectSync gains the same Arc<McpRegistry>.
  `init_mcp_servers(db)` ports _init_mcp_servers_in_db (L8915-L8951): with a database, B4662's two backfills in order
  (null oauth2 flows, then discovery stamped issuers), each with its own logged error,
  "litellm.proxy.proxy_server.py::ProxyConfig:_init_mcp_servers_in_db backfill - {error}" and
  "litellm.proxy.proxy_server.py::ProxyConfig:_init_mcp_servers_in_db issuer stamp backfill - {error}", then the
  mutator's reload_servers_from_database (B6765) with its error logged as
  "litellm.proxy.proxy_server.py::ProxyConfig:_init_mcp_servers_in_db - {error}".
  sync_non_llm_objects runs it at the mcp position, after vector_store_indexes and before agents, when B8380's
  should_load_db_object allows mcp. B8384's `init_mcp_servers_from_db` and `reload_mcp_servers_from_db` keep their
  names and signatures, since B8372's jobs call both; replace their stub bodies: init_mcp_servers_from_db gates on mcp
  and calls init_mcp_servers, and reload_mcp_servers_from_db gates on mcp and runs only the reload, no backfills
  (L8957-L8980), logging "litellm.proxy.proxy_server.py::ProxyConfig:reload_mcp_servers_from_db - {error}". Delete
  B8384's `unbuilt_mcp_` tests and its MCP stub row in docs/deviations/B8384.yaml.


  Startup, in B8613's crates/betterlite/src/lifespan.rs and lifespan/. At the registries step, make one
  `McpRegistry::new(&config, db, http)` next to the AgentRegistry and before load_non_llm_configs, and hand clones of
  that Arc to BootRegistries (with a clone of the LifespanInputs python_hooks Arc), to the one DbObjectSync the lifespan
  builds (read B8374's and B8613's merged code for where), and to Started as `mcp_registry: Arc<McpRegistry>`. In
  betterlite-server, B8610's StartupOutputs (server/inputs.rs) gains `mcp_registry`, run_proxy copies it from Started,
  and Shared (state/shared.rs) gains `mcp_registry: Arc<McpRegistry>`, set from it in application(). Add the field to
  every Shared and StartupOutputs literal the tests in scope build. B8620, B077 and the MCP mounts read
  `shared.mcp_registry`.


  Tests. server_registries::mcp tests (names start with `mcp_`) assert the mutator and the readers see the same
  SharedRegistry, DbServerRows reads nothing without a database, the invalidator drops one server from every cache,
  the fetcher returns a non-2xx document as a document, CipherDecryptor leaves plain text alone, and the cell forwards
  clear only after set. boot_registries tests (in B8614's boot_registries/tests.rs, names start with `mcp_`) load a config with one mcp_tools entry whose
  handler is a temporary module next to the config file (imported through a PythonHooks built for that file) and two
  mcp_servers with an alias, assert each lands in the McpRegistry, and that a bad entry returns its loader's error as
  the step of its key. db_object_sync tests (names start with `mcp_db_`) use recording fakes for the backfills and the
  server rows: init runs both backfills then the reload, a failing backfill is logged and the reload still runs, the
  periodic reload runs no backfill, and both entry points do nothing when the mcp gate is closed. A shared test
  (`shared_mcp_registry`) asserts Shared.mcp_registry is Arc::ptr_eq with the StartupOutputs value, and a lifespan test
  (`handoff_mcp_registry`) asserts BootRegistries, DbObjectSync and Started hold the same McpRegistry. Counts: about
  70 non-blank LiteLLM lines (the two config blocks and the three database loaders); the ports are betterlite glue.
  No oracle case: B8620's MCP area parts mount the routes that read this registry, and B124's local-tool cases boot a
  config with mcp_tools and mcp_servers through it.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/server_registries/mcp.rs
    - crates/betterlite-server/src/server_registries/mcp/**
    - crates/betterlite-server/src/state/shared.rs
    - crates/betterlite-server/src/state/shared/**
    - crates/betterlite-server/src/server.rs
    - crates/betterlite-server/src/server/inputs.rs
    - crates/betterlite-server/src/server/inputs/**
    - crates/betterlite-server/src/server/tests.rs
    - crates/betterlite-server/src/routes/tests.rs
    - crates/betterlite-server/src/cost_service/tests.rs
    - crates/betterlite/Cargo.toml
    - crates/betterlite/src/boot_registries.rs
    - crates/betterlite/src/boot_registries/**
    - crates/betterlite/src/db_object_sync.rs
    - crates/betterlite/src/db_object_sync/**
    - crates/betterlite/src/lifespan.rs
    - crates/betterlite/src/lifespan/**
    - docs/deviations/B8614.yaml
    - docs/deviations/B8384.yaml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7046-L7078
    why: _init_non_llm_configs, the mcp_tools and mcp_servers blocks this task loads (with mcp_aliases from litellm_settings).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L8243-L8262
    why: The mcp position in _init_non_llm_objects_in_db, after the vector store kinds and behind the mcp gate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L8915-L8980
    why: _init_mcp_servers_in_db with its two backfills, init_mcp_servers_from_db, and the reload-only reload_mcp_servers_from_db.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2584-L2661
    why: The module globals the registry replaces; it is one value per process.
dod:
  - text: McpRegistry builds one SharedRegistry shared by the RegistryMutator and its readers, with DbServerRows, DiscoveryInvalidator, HttpMetadataFetcher, CipherDecryptor, RegistrySettings from config, ToolRegistrySink and InstructionsCacheCell, and exposes the one OAuthMetadataCache.
    proof: [mcp-registry-tests]
  - text: BootRegistries loads mcp_tools through B8871 with the one PythonHooks and mcp_servers with aliases into the McpRegistry, returns each loader's error, and B8614's two stub tests are gone.
    proof: [mcp-boot-tests]
  - text: The database loaders run the backfills and then the reload at startup and on each sync, the reload alone on the periodic job, honour the mcp gate and log each failure, and B8384's MCP stub tests are gone.
    proof: [mcp-db-tests]
  - text: Startup makes one McpRegistry and the same Arc reaches BootRegistries, DbObjectSync, Started and shared.mcp_registry.
    proof: [wiring-tests]
  - text: The existing boot, sync, lifespan, Shared and server tests still pass with the new fields.
    proof: [regressions]
checks:
  optional: []
  commands:
    - id: mcp-registry-tests
      why: the mutator and the readers hold different registries, a constructor port answers wrongly, or the database rows are read without a database
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server_registries::mcp::/)'
    - id: mcp-boot-tests
      why: a configured mcp_tools or mcp_servers key still hits the stub, loads into a copy, or swallows its loader's error
      run: test -z "$(grep -rl boot_unbuilt_mcp_ crates/betterlite/src/boot_registries.rs crates/betterlite/src/boot_registries)" && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::tests::mcp_/)'
    - id: mcp-db-tests
      why: the database MCP loaders are still stubs, run the backfills on the periodic reload, ignore the gate or stop on a failed backfill
      run: test -z "$(grep -rl unbuilt_mcp_ crates/betterlite/src/db_object_sync.rs crates/betterlite/src/db_object_sync)" && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^db_object_sync::.*::mcp_db_/)'
    - id: wiring-tests
      why: startup builds a second McpRegistry or Shared holds a different one than config boot and the database loaders fill
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^state::shared::tests::shared_mcp_registry/)' && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^lifespan::.*::handoff_mcp_registry/)'
    - id: regressions
      why: the new BootRegistries, DbObjectSync, Started, StartupOutputs or Shared field broke an existing boot, sync, lifespan, Shared, server or route test
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::tests::mcp_/)' && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^boot_registries::/) | test(/^db_object_sync::/) | test(/^lifespan::/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server_registries::/) | test(/^state::shared::/) | test(/^server::/) | test(/^routes::tests::/) | test(/^cost_service::/)'
oracle_cases: []
deviations:
  - what: The MCP database loaders do not check is_mcp_available.
    why: MCP is compiled in, as B6594 decided, so the gate is always open.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L8915-L8920
out_of_scope:
  - "The vector store registries, their config and database loading and the vector_stores Shared field: B9998."
  - "The registries and loaders themselves: B4680, B4731, B6762 to B6765 and B8871. The two backfills: B4662. The PythonHooks service: B165, built by B8375."
  - "Scheduling init_mcp_servers_from_db and the periodic reload: B8372. The MCP area state and the HealthService that sets the instructions cell: B8620."
pitfalls:
  - SharedRegistry is an Arc the caller builds; building it twice (once for the mutator, once for the readers) leaves the reload writing a registry no request reads.
  - The periodic reload_mcp_servers_from_db must not run the backfills, since the oauth2_flow backfill is a write path LiteLLM runs once at startup.
  - B8372 already calls init_mcp_servers_from_db and reload_mcp_servers_from_db by name, so change their bodies, never their names or signatures.
  - Leaving a boot_unbuilt_mcp_ or unbuilt_mcp_ test behind keeps asserting the stub error this task removes.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
