id: B950
title: Responses mcp execute
description: >-
  Execute extracted MCP function/custom calls through B136 and B137 using typed parsed arguments and normalized
  tool results. Preserve source authorization and failure logging for every call; do not treat a model-emitted tool
  name as permission to access another server.


  Implement crates/betterlite-core/src/api/responses_mcp_execute.rs. Use ResponsesMcpExecuteInput and ResponsesMcpExecuteResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions function_call_execution, malformed_arguments, denied_tool_call, tool_result_error,
  structured_tool_content under api::responses_mcp_execute::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.MAXIMUM_TRACEBACK_LINES_TO_LOG
  defaults to 100. No environment reads occur outside betterlite-config. Test api::responses_mcp_execute::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::responses_mcp_execute::decode_responses_mcp_execute(bytes:
  &[u8], limits: &ApiLimits), for json.loads input tool_arguments at litellm/responses/mcp/litellm_proxy_mcp_handler.py:644.
  Place its implementation in crates/betterlite-core/src/api/responses_mcp_execute.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/responses_mcp_execute.rs passes arbitrary
  bounded bytes to that exact decoder; api::responses_mcp_execute::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesMcpExecute in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_mcp_execute: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._should_auto_execute_tools
  (L540-L563); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._extract_tool_calls_from_response
  (L566-L577); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._extract_tool_calls_from_chat_response
  (L580-L601); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._extract_tool_call_details
  (L604-L635); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._parse_tool_arguments
  (L638-L648); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._parse_mcp_result (L651-L684);
  litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._execute_tool_calls (L687-L972);
  litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._log_mcp_tool_failure (L1121-L1143).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 388 owned nonblank/non-comment/non-docstring Python lines (405 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 408 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 30 wiring; 751 total within the 760-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B136 (MCP gateway server, transports and server registry), B137 (MCP auth, OAuth flows,
  BYOK and outbound credentials), B171 (Direct helper oracle and URL path encoding), B949 (Responses mcp discovery),
  B1087 (Api boundaries), B732 (Typed authentication principals and grant resolution), B1106 (Principal metadata
  and tags), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
