id: B3188
title: Provider form catalog from Prism through Topaz
description: >-
  Create the ordered catalog fragment for the public provider form endpoint, covering fifteen provider definitions from PRISM through TOPAZ.
  This fragment holds credential field metadata, display names, and model placeholders for each provider, consumed by B3190's get_provider_fields function as part of its assembled catalog.
  Preserve every credential field name, label, placeholder, tooltip, required flag, field_type and options value exactly as LiteLLM defines them at the pinned commit, including SAP's service-key textarea field, Snowflake's full endpoint URL requirement, and SCX.ai's API base placeholder.
  Store this fragment in its own asset path crates/betterlite-server/assets/provider_create_fields_prism_topaz.json so parallel workers do not rewrite a shared file; B3190 later assembles all fragments in source order.
scope:
  paths:
    - crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/provider_create_fields.json#L2886-L3265
    why: The complete provider record definitions for PRISM, RECRAFT, REPLICATE, RUNWAYML, SAGEMAKER, Sail, Sambanova, SAP, SCX_AI, Snowflake, Soniox, StrandsDecider, TEXT_COMPLETION_CODESTRAL, TogetherAI and TOPAZ with their credential fields and model placeholders.
dod:
  - text: The fifteen provider records (PRISM through TOPAZ) are preserved byte-for-byte from the LiteLLM source at the pinned commit.
    proof: [provider-records-preserved]
  - text: PRISM has litellm_provider "prism", provider_display_name "Prism", default_model_placeholder "prism/deepseek-v4.1-flash", api_base optional, and api_key required password.
    proof: [provider-records-preserved, prism-field-values]
  - text: RECRAFT has litellm_provider "recraft", provider_display_name "Recraft", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, recraft-field-values]
  - text: REPLICATE has litellm_provider "replicate", provider_display_name "Replicate", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, replicate-field-values]
  - text: RUNWAYML has litellm_provider "runwayml", provider_display_name "Runwayml", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, runwayml-field-values]
  - text: SAGEMAKER has litellm_provider "sagemaker", provider_display_name "Sagemaker", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, sagemaker-field-values]
  - text: Sambanova has litellm_provider "sambanova", provider_display_name "Sambanova", default_model_placeholder "gpt-3.5-turbo", and a single required api_key field.
    proof: [provider-records-preserved, sambanova-field-values]
  - text: SAP has litellm_provider "sap", provider_display_name "SAP Generative AI Hub", default_model_placeholder "sap/gpt-4", and api_key textarea field required.
    proof: [provider-records-preserved, sap-textarea-field, sap-provider-metadata]
  - text: SCX.ai has litellm_provider "scx-ai", provider_display_name "SCX.ai", default_model_placeholder "scx-ai/GLM-5.2", api_base optional, and api_key required password.
    proof: [provider-records-preserved, scxai-placeholders, scxai-provider-metadata]
  - text: Snowflake has litellm_provider "snowflake", provider_display_name "Snowflake", default_model_placeholder "snowflake/mistral-7b", and both api_key and api_base required.
    proof: [provider-records-preserved, snowflake-full-endpoint, snowflake-api-key-label, snowflake-provider-metadata]
  - text: Soniox has litellm_provider "soniox", provider_display_name "Soniox", default_model_placeholder "soniox/stt-async-v5", and api_key required password.
    proof: [provider-records-preserved, soniox-api-support-tooltip, soniox-provider-metadata]
  - text: StrandsDecider has litellm_provider "strands_decider", provider_display_name "Strands Decider", default_model_placeholder "strands_decider/strands-decider-2B-hobson-v19", api_base required, and api_key optional.
    proof: [provider-records-preserved, strands-required-base, strands-provider-metadata]
  - text: TEXT_COMPLETION_CODESTRAL has litellm_provider "text-completion-codestral", provider_display_name "Text-Completion-Codestral", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, codestral-field-values]
  - text: TogetherAI has litellm_provider "together_ai", provider_display_name "TogetherAI", default_model_placeholder "gpt-3.5-turbo", and a single required api_key field.
    proof: [provider-records-preserved, togetherai-single-field, togetherai-provider-metadata]
  - text: TOPAZ has litellm_provider "topaz", provider_display_name "Topaz", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, topaz-field-values]
  - text: Sail has litellm_provider "sail", provider_display_name "Sail", default_model_placeholder "sail/openai/gpt-oss-120b", api_key required with label "Sail API Key", and api_base optional.
    proof: [provider-records-preserved, sail-key-label, sail-provider-metadata]
  - text: The JSON file is a JSON array of fifteen provider records in the expected order.
    proof: [provider-json-parses]
checks:
  optional: []
  commands:
    - id: provider-records-preserved
      why: the provider records differ from LiteLLM or a record is missing
      run: >-
        jq -e '[.[].provider] == ["PRISM", "RECRAFT", "REPLICATE", "RUNWAYML", "SAGEMAKER", "Sail", "Sambanova", "SAP", "SCX_AI", "Snowflake", "Soniox", "StrandsDecider", "TEXT_COMPLETION_CODESTRAL", "TogetherAI", "TOPAZ"]'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: sap-textarea-field
      why: SAP's api_key field is not a textarea or missing the correct label and tooltip
      run: >-
        jq -e '.[] | select(.provider == "SAP") | .credential_fields[] | select(.key == "api_key") | .field_type == "textarea" and .label == "SAP AI Core Service Key (JSON)" and (.tooltip | contains("JSON"))'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: snowflake-full-endpoint
      why: Snowflake's api_base field is not required or does not have the full endpoint URL placeholder and tooltip
      run: >-
        jq -e '.[] | select(.provider == "Snowflake") | .credential_fields[] | select(.key == "api_base") | .required == true and (.placeholder | contains("inference:complete")) and (.tooltip | ascii_downcase | contains("full endpoint"))'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: snowflake-api-key-label
      why: Snowflake's api_key field does not have the correct label or is not required
      run: >-
        jq -e '.[] | select(.provider == "Snowflake") | .credential_fields[] | select(.key == "api_key") | .required == true and .label == "Snowflake API Key / JWT Key for Authentication"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: scxai-placeholders
      why: SCX.ai api_base placeholder or model placeholder does not match
      run: >-
        jq -e '.[] | select(.provider == "SCX_AI") | .default_model_placeholder == "scx-ai/GLM-5.2" and (.credential_fields[] | select(.key == "api_base") | .placeholder == "https://api.scx.ai/v1")'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: strands-required-base
      why: StrandsDecider api_base is not required or missing localhost placeholder and tooltip
      run: >-
        jq -e '.[] | select(.provider == "StrandsDecider") | .credential_fields[] | select(.key == "api_base") | .required == true and .placeholder == "http://localhost:8000" and (.tooltip | ascii_downcase | contains("self-hosted"))'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: sail-key-label
      why: Sail api_key field does not have the "Sail API Key" label or is not required
      run: >-
        jq -e '.[] | select(.provider == "Sail") | .credential_fields[] | select(.key == "api_key") | .label == "Sail API Key" and .required == true'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: soniox-api-support-tooltip
      why: Soniox api_key tooltip does not document async Speech-to-Text REST API limitations
      run: >-
        jq -e '.[] | select(.provider == "Soniox") | .credential_fields[] | select(.key == "api_key") | .tooltip | contains("async Speech-to-Text") and contains("REST API")'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: togetherai-single-field
      why: TogetherAI does not have exactly one credential field (api_key)
      run: >-
        jq -e '.[] | select(.provider == "TogetherAI") | .credential_fields | length == 1 and .[0].key == "api_key" and .[0].required == true'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: prism-field-values
      why: "PRISM fields or metadata do not match LiteLLM: api_base optional, api_key required,\
        \ default_model_placeholder missing prism/deepseek-v4.1-flash, litellm_provider not prism, or provider_display_name not Prism"
      run: >-
        jq -e '.[] | select(.provider == "PRISM") | .litellm_provider == "prism" and .provider_display_name == "Prism" and .default_model_placeholder == "prism/deepseek-v4.1-flash" and any(.credential_fields[]; .key == "api_base" and .required == false) and any(.credential_fields[]; .key == "api_key" and .required == true)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: recraft-field-values
      why: RECRAFT does not have both api_base and api_key optional with default_model_placeholder gpt-3.5-turbo, litellm_provider not recraft, or provider_display_name not Recraft
      run: >-
        jq -e '.[] | select(.provider == "RECRAFT") | .litellm_provider == "recraft" and .provider_display_name == "Recraft" and .default_model_placeholder == "gpt-3.5-turbo" and any(.credential_fields[]; .key == "api_base" and .required == false) and any(.credential_fields[]; .key == "api_key" and .required == false)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: replicate-field-values
      why: REPLICATE does not have both api_base and api_key optional with default_model_placeholder gpt-3.5-turbo, litellm_provider not replicate, or provider_display_name not Replicate
      run: >-
        jq -e '.[] | select(.provider == "REPLICATE") | .litellm_provider == "replicate" and .provider_display_name == "Replicate" and .default_model_placeholder == "gpt-3.5-turbo" and any(.credential_fields[]; .key == "api_base" and .required == false) and any(.credential_fields[]; .key == "api_key" and .required == false)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: runwayml-field-values
      why: RUNWAYML does not have both api_base and api_key optional with default_model_placeholder gpt-3.5-turbo, litellm_provider not runwayml, or provider_display_name not Runwayml
      run: >-
        jq -e '.[] | select(.provider == "RUNWAYML") | .litellm_provider == "runwayml" and .provider_display_name == "Runwayml" and .default_model_placeholder == "gpt-3.5-turbo" and any(.credential_fields[]; .key == "api_base" and .required == false) and any(.credential_fields[]; .key == "api_key" and .required == false)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: sagemaker-field-values
      why: SAGEMAKER does not have both api_base and api_key optional with default_model_placeholder gpt-3.5-turbo, litellm_provider not sagemaker, or provider_display_name not Sagemaker
      run: >-
        jq -e '.[] | select(.provider == "SAGEMAKER") | .litellm_provider == "sagemaker" and .provider_display_name == "Sagemaker" and .default_model_placeholder == "gpt-3.5-turbo" and any(.credential_fields[]; .key == "api_base" and .required == false) and any(.credential_fields[]; .key == "api_key" and .required == false)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: sambanova-field-values
      why: Sambanova does not have a single required api_key field or default_model_placeholder gpt-3.5-turbo, litellm_provider not sambanova, or provider_display_name not Sambanova
      run: >-
        jq -e '.[] | select(.provider == "Sambanova") | .litellm_provider == "sambanova" and .provider_display_name == "Sambanova" and .default_model_placeholder == "gpt-3.5-turbo" and (.credential_fields | length == 1 and .[0].key == "api_key" and .[0].required == true)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: sap-provider-metadata
      why: SAP metadata fields (litellm_provider, provider_display_name, default_model_placeholder) do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "SAP") | .litellm_provider == "sap" and .provider_display_name == "SAP Generative AI Hub" and .default_model_placeholder == "sap/gpt-4"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: scxai-provider-metadata
      why: SCX.ai metadata fields (litellm_provider, provider_display_name) do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "SCX_AI") | .litellm_provider == "scx-ai" and .provider_display_name == "SCX.ai"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: snowflake-provider-metadata
      why: Snowflake metadata fields (litellm_provider, provider_display_name, default_model_placeholder) do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "Snowflake") | .litellm_provider == "snowflake" and .provider_display_name == "Snowflake" and .default_model_placeholder == "snowflake/mistral-7b"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: soniox-provider-metadata
      why: Soniox metadata fields (litellm_provider, provider_display_name, default_model_placeholder) do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "Soniox") | .litellm_provider == "soniox" and .provider_display_name == "Soniox" and .default_model_placeholder == "soniox/stt-async-v5"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: strands-provider-metadata
      why: StrandsDecider metadata fields (litellm_provider, provider_display_name, default_model_placeholder) do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "StrandsDecider") | .litellm_provider == "strands_decider" and .provider_display_name == "Strands Decider" and .default_model_placeholder == "strands_decider/strands-decider-2B-hobson-v19"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: codestral-field-values
      why: TEXT_COMPLETION_CODESTRAL does not have both api_base and api_key optional with default_model_placeholder gpt-3.5-turbo, litellm_provider not text-completion-codestral, or provider_display_name not Text-Completion-Codestral
      run: >-
        jq -e '.[] | select(.provider == "TEXT_COMPLETION_CODESTRAL") | .litellm_provider == "text-completion-codestral" and .provider_display_name == "Text-Completion-Codestral" and .default_model_placeholder == "gpt-3.5-turbo" and any(.credential_fields[]; .key == "api_base" and .required == false) and any(.credential_fields[]; .key == "api_key" and .required == false)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: togetherai-provider-metadata
      why: TogetherAI metadata fields (litellm_provider, provider_display_name) do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "TogetherAI") | .litellm_provider == "together_ai" and .provider_display_name == "TogetherAI"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: topaz-field-values
      why: TOPAZ does not have both api_base and api_key optional with default_model_placeholder gpt-3.5-turbo, litellm_provider not topaz, or provider_display_name not Topaz
      run: >-
        jq -e '.[] | select(.provider == "TOPAZ") | .litellm_provider == "topaz" and .provider_display_name == "Topaz" and .default_model_placeholder == "gpt-3.5-turbo" and any(.credential_fields[]; .key == "api_base" and .required == false) and any(.credential_fields[]; .key == "api_key" and .required == false)'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: sail-provider-metadata
      why: Sail metadata fields (litellm_provider, provider_display_name, default_model_placeholder) do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "Sail") | .litellm_provider == "sail" and .provider_display_name == "Sail" and .default_model_placeholder == "sail/openai/gpt-oss-120b"'
        crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
    - id: provider-json-parses
      why: the JSON file does not parse or does not yield fifteen records
      run: jq -e 'type == "array" and length == 15' crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
oracle_cases: []
deviations: []
out_of_scope:
  - Consuming or assembling this fragment into a larger catalog. B3190 loads all fragments in source order.
  - Network behavior or credential validation. This task only preserves the form metadata.
  - Provider resolution or model execution. The task provides data only.
pitfalls:
  - The JSON file must be a plain array, not an object with a key. B3190's loader expects JSON.load(file) to yield a list directly.
  - Every null value in options, placeholder or tooltip must be preserved exactly; missing the null and writing an empty string changes the wire format.
  - PRISM's default_model_placeholder is prism/deepseek-v4.1-flash, not gpt-3.5-turbo; api_key is required and api_base is optional.
  - "RECRAFT, REPLICATE, RUNWAYML, SAGEMAKER, TEXT_COMPLETION_CODESTRAL, TOPAZ: both api_base\
    \ and api_key optional, default_model_placeholder is generic gpt-3.5-turbo."
  - Sambanova has a single required api_key field with no api_base; default_model_placeholder is gpt-3.5-turbo.
  - Sail's api_key field comes before api_base; label is \"Sail API Key\"; default_model_placeholder is sail/openai/gpt-oss-120b.
  - SAP's api_key field is a textarea (not password); litellm_provider is sap; provider_display_name is \"SAP Generative AI Hub\".
  - "SCX.ai's api_base placeholder is https://api.scx.ai/v1; litellm_provider is\
    \ scx-ai (with hyphen)."
  - Snowflake requires both api_key and api_base (full endpoint with /api/v2/cortex/inference:complete path); default_model_placeholder is snowflake/mistral-7b.
  - Snowflake's api_key label includes \"/ JWT Key\" to document dual authentication modes.
  - StrandsDecider's api_base is required with localhost placeholder; litellm_provider is strands_decider (with underscore).
  - Soniox's api_key tooltip must preserve exact reference to async Speech-to-Text REST API; default_model_placeholder is soniox/stt-async-v5.
  - TogetherAI has single required api_key field; litellm_provider is together_ai (with underscore).
review_level: standard
budget:
  max_changed_lines: 650
  max_new_expects: 0
