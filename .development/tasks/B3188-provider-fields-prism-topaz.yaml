oracle_cases: []
deviations: []
out_of_scope:
  - Consuming or assembling this fragment into a larger catalog. B3190 loads all fragments in source order.
  - Network behavior or credential validation. This task only preserves the form metadata.
  - Provider resolution or model execution. The task provides data only.
pitfalls:
  - The JSON file must be a plain array, not an object with a key. B3190's loader expects JSON.load(file) to yield a list directly.
  - Every null value in options, placeholder or tooltip must be preserved exactly; missing the null and writing an empty string changes the wire format.
  - PRISM's default_model_placeholder is prism/deepseek-v4.1-flash, not gpt-3.5-turbo; api_key is required and api_base is optional.
  - "RECRAFT, REPLICATE, RUNWAYML, SAGEMAKER, TEXT_COMPLETION_CODESTRAL, TOPAZ: both api_base\
    \ and api_key optional, default_model_placeholder is generic gpt-3.5-turbo."
  - Sambanova has a single required api_key field with no api_base; default_model_placeholder is gpt-3.5-turbo.
  - Sail's api_key field comes before api_base; label is \"Sail API Key\"; default_model_placeholder is sail/openai/gpt-oss-120b.
  - SAP's api_key field is a textarea (not password); litellm_provider is sap; provider_display_name is \"SAP Generative AI Hub\".
  - "SCX.ai's api_base placeholder is https://api.scx.ai/v1; litellm_provider is\
    \ scx-ai (with hyphen)."
  - Snowflake requires both api_key and api_base (full endpoint with /api/v2/cortex/inference:complete path); default_model_placeholder is snowflake/mistral-7b.
  - Snowflake's api_key label includes \"/ JWT Key\" to document dual authentication modes.
  - StrandsDecider's api_base is required with localhost placeholder; litellm_provider is strands_decider (with underscore).
  - Soniox's api_key tooltip must preserve exact reference to async Speech-to-Text REST API; default_model_placeholder is soniox/stt-async-v5.
  - TogetherAI has single required api_key field; litellm_provider is together_ai (with underscore).
