id: B3188
title: Provider form catalog from Prism through Topaz
description: >-
  Create the ordered catalog fragment for the public provider form endpoint, covering fifteen provider definitions from PRISM through TOPAZ.
  This fragment holds credential field metadata, display names, and model placeholders for each provider, consumed by B3190's get_provider_fields function as part of its assembled catalog.
  Preserve every credential field name, label, placeholder, tooltip, required flag, field_type and options value exactly as LiteLLM defines them at the pinned commit, including SAP's service-key textarea field, Snowflake's full endpoint URL requirement, and SCX.ai's API base placeholder.
  Store this fragment in its own asset path crates/betterlite-server/assets/provider_create_fields_prism_topaz.json so parallel workers do not rewrite a shared file; B3190 later assembles all fragments in source order.
scope:
  paths:
    - crates/betterlite-server/assets/provider_create_fields_prism_topaz.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/provider_create_fields.json#L2886-L3265
    why: The complete provider record definitions for PRISM, RECRAFT, REPLICATE, RUNWAYML, SAGEMAKER, Sail, Sambanova, SAP, SCX_AI, Snowflake, Soniox, StrandsDecider, TEXT_COMPLETION_CODESTRAL, TogetherAI and TOPAZ with their credential fields and model placeholders.
dod:
  - text: The fifteen provider records (PRISM through TOPAZ) are preserved byte-for-byte from the LiteLLM source at the pinned commit.
    proof: [provider-records-preserved]
  - text: PRISM has litellm_provider "prism", provider_display_name "Prism", default_model_placeholder "prism/deepseek-v4.1-flash", api_base optional, and api_key required password.
    proof: [provider-records-preserved, prism-field-values]
  - text: RECRAFT has litellm_provider "recraft", provider_display_name "Recraft", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, recraft-field-values]
  - text: REPLICATE has litellm_provider "replicate", provider_display_name "Replicate", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, replicate-field-values]
  - text: RUNWAYML has litellm_provider "runwayml", provider_display_name "Runwayml", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, runwayml-field-values]
  - text: SAGEMAKER has litellm_provider "sagemaker", provider_display_name "Sagemaker", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, sagemaker-field-values]
  - text: Sambanova has litellm_provider "sambanova", provider_display_name "Sambanova", default_model_placeholder "gpt-3.5-turbo", and a single required api_key field.
    proof: [provider-records-preserved, sambanova-field-values]
  - text: SAP has litellm_provider "sap", provider_display_name "SAP Generative AI Hub", default_model_placeholder "sap/gpt-4", and api_key textarea field required.
    proof: [provider-records-preserved, sap-textarea-field, sap-provider-metadata]
  - text: SCX.ai has litellm_provider "scx-ai", provider_display_name "SCX.ai", default_model_placeholder "scx-ai/GLM-5.2", api_base optional, and api_key required password.
    proof: [provider-records-preserved, scxai-placeholders, scxai-provider-metadata]
  - text: Snowflake has litellm_provider "snowflake", provider_display_name "Snowflake", default_model_placeholder "snowflake/mistral-7b", and both api_key and api_base required.
    proof: [provider-records-preserved, snowflake-full-endpoint, snowflake-api-key-label, snowflake-provider-metadata]
  - text: Soniox has litellm_provider "soniox", provider_display_name "Soniox", default_model_placeholder "soniox/stt-async-v5", and api_key required password.
    proof: [provider-records-preserved, soniox-api-support-tooltip, soniox-provider-metadata]
  - text: StrandsDecider has litellm_provider "strands_decider", provider_display_name "Strands Decider", default_model_placeholder "strands_decider/strands-decider-2B-hobson-v19", api_base required, and api_key optional.
    proof: [provider-records-preserved, strands-required-base, strands-provider-metadata]
  - text: TEXT_COMPLETION_CODESTRAL has litellm_provider "text-completion-codestral", provider_display_name "Text-Completion-Codestral", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, codestral-field-values]
  - text: TogetherAI has litellm_provider "together_ai", provider_display_name "TogetherAI", default_model_placeholder "gpt-3.5-turbo", and a single required api_key field.
    proof: [provider-records-preserved, togetherai-single-field, togetherai-provider-metadata]
  - text: TOPAZ has litellm_provider "topaz", provider_display_name "Topaz", default_model_placeholder "gpt-3.5-turbo", and both api_base and api_key optional.
    proof: [provider-records-preserved, topaz-field-values]
  - text: Sail has litellm_provider "sail", provider_display_name "Sail", default_model_placeholder "sail/openai/gpt-oss-120b", api_key required with label "Sail API Key", and api_base optional.
    proof: [provider-records-preserved, sail-key-label, sail-provider-metadata]
  - text: The JSON file parses correctly with serde_json and yields fifteen provider records in the expected order.
    proof: [provider-json-parses]
checks:
  optional: []
  commands:
    - id: provider-records-preserved
      why: the provider records differ from LiteLLM or a record is missing
      run: |
        cat > /tmp/check_providers.py << 'CHECKER'
        import json
        with open('crates/betterlite-server/assets/provider_create_fields_prism_topaz.json') as f:
            data = json.load(f)
        expected = ['PRISM', 'RECRAFT', 'REPLICATE', 'RUNWAYML', 'SAGEMAKER', 'Sail', 'Sambanova', 'SAP', 'SCX_AI', 'Snowflake', 'Soniox', 'StrandsDecider', 'TEXT_COMPLETION_CODESTRAL', 'TogetherAI', 'TOPAZ']
        actual = [p.get('provider') for p in data]
        if actual != expected:
            print(f"Provider mismatch: expected {expected}, got {actual}")
            exit(1)
        if len(data) != 15:
            print(f"Expected 15 providers, got {len(data)}")
            exit(1)
        CHECKER
        uv run --with pyyaml python /tmp/check_providers.py
    - id: sap-textarea-field
      why: SAP's api_key field is not a textarea or missing the correct label and tooltip
      run: |
        cat > /tmp/check_sap.py << 'CHECKER'
        import json
        with open('crates/betterlite-server/assets/provider_create_fields_prism_topaz.json') as f:
            data = json.load(f)
        sap = next(p for p in data if p['provider'] == 'SAP')
        api_key_field = next((f for f in sap['credential_fields'] if f['key'] == 'api_key'), None)
        if not api_key_field or api_key_field.get('field_type') != 'textarea':
            print(f"SAP api_key field_type should be textarea, got {api_key_field.get('field_type') if api_key_field else 'not found'}")
            exit(1)
        if api_key_field.get('label') != 'SAP AI Core Service Key (JSON)':
            print(f"SAP api_key label mismatch: {api_key_field.get('label')}")
            exit(1)
        if 'JSON' not in (api_key_field.get('tooltip') or ''):
            print(f"SAP api_key tooltip missing JSON reference")
            exit(1)
        CHECKER
        uv run --with pyyaml python /tmp/check_sap.py
    - id: snowflake-full-endpoint
      why: Snowflake's api_base field is not required or does not have the full endpoint URL placeholder and tooltip
      run: |
        cat > /tmp/check_snowflake.py << 'CHECKER'
