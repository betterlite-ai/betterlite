        with open('crates/betterlite-server/assets/provider_create_fields_prism_topaz.json') as f:
            data = json.load(f)
        snowflake = next(p for p in data if p['provider'] == 'Snowflake')
        api_base_field = next((f for f in snowflake['credential_fields'] if f['key'] == 'api_base'), None)
        if not api_base_field or not api_base_field.get('required'):
            print(f"Snowflake api_base should be required")
            exit(1)
        if 'inference:complete' not in (api_base_field.get('placeholder') or ''):
            print(f"Snowflake api_base placeholder missing inference:complete")
            exit(1)
        if 'full endpoint' not in (api_base_field.get('tooltip') or '').lower():
            print(f"Snowflake api_base tooltip missing 'full endpoint' reference")
            exit(1)
        CHECKER
        uv run --with pyyaml python /tmp/check_snowflake.py
