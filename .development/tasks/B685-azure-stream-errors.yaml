pitfalls:
- 'The oracle helper for this task is pre-registered as azure_stream_errors in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/stream_errors.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_stream_errors.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The sync branch performs an OIDC exchange in a client-parameter map that it later does not use.
- Async keeps raw response headers where sync calls process_azure_headers.
