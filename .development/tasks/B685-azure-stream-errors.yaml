dod:
- text: 'stream request: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-stream-errors/stream-request.yaml.'
  proof:
  - case-stream-request
  - oracle
  - helper-python
- text: 'stream options: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-stream-errors/stream-options.yaml.'
  proof:
  - case-stream-options
  - oracle
  - helper-python
- text: 'content filter prompt: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-stream-errors/content-filter-prompt.yaml.'
  proof:
  - case-content-filter-prompt
  - oracle
  - helper-python
- text: >-
    content filter completion: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-stream-errors/content-filter-completion.yaml.
  proof:
  - case-content-filter-completion
  - oracle
  - helper-python
- text: 'stream http failure: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-stream-errors/stream-http-failure.yaml.'
  proof:
  - case-stream-http-failure
  - oracle
  - helper-python
- text: New azure_stream_errors seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_content_filter_error has newly committed malformed and boundary inputs replayed through production
    parsing.
  proof:
  - parser-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-stream-request
    why: The stream-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_request$/)'
  - id: case-stream-options
    why: The stream-options behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_options$/)'
  - id: case-content-filter-prompt
    why: The content-filter-prompt behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_content_filter_prompt$/)'
  - id: case-content-filter-completion
    why: The content-filter-completion behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_content_filter_completion$/)'
  - id: case-stream-http-failure
    why: The stream-http-failure behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_http_failure$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_stream_errors.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_stream_errors*")"
      && grep -lq 'azure_stream_errors' tools/oracle/fuzz/corpus/helper_case/azure_stream_errors* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_stream_errors$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_stream_errors)"
      && grep -q 'decode_content_filter_error' crates/betterlite-azure/fuzz/fuzz_targets/azure_stream_errors.rs
      && cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_stream_errors_corpus$/)'
