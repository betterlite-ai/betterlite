id: B685
title: Azure chat streaming adapters
description: >-
  Port Azure sync/async streaming through a shared native transport while preserving their observable preparation,
  header and error differences. B2215 owns structured content-policy extraction; this task does not classify finish_reason
  or choices. B533 calls this path after the same Azure request preparation; reuse OpenAI SSE decoding and response
  wire records.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.streaming
  L500-L575; AzureChatCompletion.async_streaming L577-L652.


  The shared raw-send wrappers make_sync_azure_openai_chat_completion_request L140-L162 and make_azure_openai_chat_completion_request
  L164-L194 in azure.py belong to B505, not B533. Reuse B529 process_azure_headers and B530 get_azure_ad_token_from_oidc
  directly.


  Named case contracts: stream_request: Obtain client from B531 get_azure_openai_client with api_version,api_base,api_key,model,provided
  client,_is_async and litellm_params; call B505 raw-send with the supplied timeout and unchanged data. This function
  does not force data.stream=True. Sync requires AzureOpenAI/OpenAI; async requires AsyncAzureOpenAI/AsyncOpenAI.
  Native typed handles and Python bridge B159 preserve these facade errors. stream_options: Return B005 CustomStreamWrapper
  immediately with model, provider azure, logging_obj and data.get(stream_options,None), retaining explicit None/{};
  do not hide opening failures in a lazy async generator. Store raw response headers in logging_obj.model_call_details.response_headers.
  stream_http_failure: Sync has no catch: opening/send errors propagate. Async wraps every exception as B673 AzureOpenAIError
  using status_code attribute default500, message attribute or str only when absent, body attribute defaultNone,
  and headers attribute; only headers is None plus truthy response falls back to response.headers. Explicit empty
  headers suppress fallback; explicit None message/status attributes are not defaulted. stream_header_difference:
  Sync passes B529 process_azure_headers output to the wrapper; async passes raw headers. Keep fixture rows for
  each facade and header absence/case variants; do not normalize both paths into the sync behavior. sync_unused_preparation:
  Sync first assembles client params with api_version,azure_endpoint,azure_deployment,litellm.client_session,max_retries,timeout
  and calls B2200 select_azure_base_url_or_endpoint. Credential choice uses api_key is-not-None, then azure_ad_token
  is-not-None (oidc/ invokes B530), then azure_ad_token_provider. This locally assembled map is NOT passed to get_azure_openai_client,
  but the OIDC side effect/failure still occurs. dynamic_params is unused. stream_logging: B249 pre_call receives
  data.messages, selected client.api_key and additional headers api_key/azure_ad_token plus api_base,acompletion=True,complete_input_dict=data;
  sync logs any OIDC-replaced token. Keep structured credential redaction through B187. No post_call is added here.
  stream_wrong_client: Sync wrong class raises AzureOpenAIError500 azure_client is not an instance of AzureOpenAI
  or OpenAI before pre_call. Async wrong class raises ValueError Azure client is not an instance of AsyncAzureOpenAI
  or AsyncOpenAI inside the catch, becoming AzureOpenAIError500 with that message.


  Write standalone Rust test azure_chat_streams_credential_identity_isolation in betterlite-azure: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test azure_chat_streams_secret_safe_failure in betterlite-azure: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-azure/src/azure_stream_errors.rs with adjacent tests under azure_stream_errors/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_stream_errors_cases in betterlite-azure with these exact named cases (one per oracle
  file): stream_request, stream_options, stream_http_failure, stream_header_difference, sync_unused_preparation,
  stream_logging, stream_wrong_client. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_stream_errors* using HelperCase: kind:
  helper and the externally tagged azure_stream_errors variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_stream_errors that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_content_filter_error consumes Azure content-filter error body bytes in crates/betterlite-azure/src/azure_stream_errors.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_stream_errors.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_stream_errors.
  The adjacent test replays_the_azure_stream_errors_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 144 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 185 production lines, 250 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 590 planned, 600 maximum changed lines.
