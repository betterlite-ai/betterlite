    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_header_difference$/)'
  - id: case-sync-unused-preparation
    why: Sync first assembles client params with api_version,azure_endpoint,azure_deployment,litellm.client_session,max_retries,timeout
      and calls B2200 select_azure_base_url_or_endpoint. Credential choice uses api_key is-not-None, then azure_ad_token
      is-not-None (oidc/ invokes B530), then azure_ad_token_provider. This locally assembled map is NOT passed to
      get_azure_openai_client, but the OIDC side effect/failure still occurs. dynamic_params is unused.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_sync_unused_preparation$/)'
  - id: case-stream-logging
    why: B249 pre_call receives data.messages, selected client.api_key and additional headers api_key/azure_ad_token
      plus api_base,acompletion=True,complete_input_dict=data; sync logs any OIDC-replaced token. Keep structured
      credential redaction through B187. No post_call is added here.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_logging$/)'
  - id: case-stream-wrong-client
    why: Sync wrong class raises AzureOpenAIError500 azure_client is not an instance of AzureOpenAI or OpenAI before
      pre_call. Async wrong class raises ValueError Azure client is not an instance of AsyncAzureOpenAI or AsyncOpenAI
      inside the catch, becoming AzureOpenAIError500 with that message.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_wrong_client$/)'
