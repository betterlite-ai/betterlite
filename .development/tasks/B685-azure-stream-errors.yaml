checks:
  optional:
  - mutants
  commands:
  - id: case-stream-request
    why: Obtain client from B531 get_azure_openai_client with api_version,api_base,api_key,model,provided client,_is_async
      and litellm_params; call B505 raw-send with the supplied timeout and unchanged data. This function does not
      force data.stream=True. Sync requires AzureOpenAI/OpenAI; async requires AsyncAzureOpenAI/AsyncOpenAI. Native
      typed handles and Python bridge B159 preserve these facade errors.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_request$/)'
  - id: case-stream-options
    why: Return B005 CustomStreamWrapper immediately with model, provider azure, logging_obj and data.get(stream_options,None),
      retaining explicit None/{}; do not hide opening failures in a lazy async generator. Store raw response headers
      in logging_obj.model_call_details.response_headers.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_options$/)'
  - id: case-stream-http-failure
    why: 'Sync has no catch: opening/send errors propagate. Async wraps every exception as B673 AzureOpenAIError
      using status_code attribute default500, message attribute or str only when absent, body attribute defaultNone,
      and headers attribute; only headers is None plus truthy response falls back to response.headers. Explicit
      empty headers suppress fallback; explicit None message/status attributes are not defaulted.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_stream_errors_cases::case_[0-9]+_stream_http_failure$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_stream_errors.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_stream_errors*")"
      && grep -lq 'azure_stream_errors' tools/oracle/fuzz/corpus/helper_case/azure_stream_errors* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_stream_errors$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_stream_errors)"
      && grep -q 'decode_content_filter_error' crates/betterlite-azure/fuzz/fuzz_targets/azure_stream_errors.rs
      && cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_stream_errors_corpus$/)'
  - id: case-stream-header-difference
    why: Sync passes B529 process_azure_headers output to the wrapper; async passes raw headers. Keep fixture rows
