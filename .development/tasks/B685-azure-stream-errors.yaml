  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - crates/betterlite-azure/src/azure_stream_errors.rs
  - crates/betterlite-azure/src/azure_stream_errors/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_stream_errors.rs
  - tools/oracle/src/helpers/azure_stream_errors/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_stream_errors.py
  - tools/oracle/cases/helpers/providers/azure-stream-errors/**
  - tools/oracle/fuzz/corpus/helper_case/azure_stream_errors*
  - crates/betterlite-azure/fuzz/Cargo.toml
  - crates/betterlite-azure/fuzz/fuzz_targets/azure_stream_errors.rs
  - crates/betterlite-azure/fuzz/corpus/azure_stream_errors/**
