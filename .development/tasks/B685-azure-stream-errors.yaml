id: B685
title: Azure chat streams and content-filter errors
description: >-
  Port Azure sync/async streaming as one owned async stream path and extract structured content-filter failures.
  B533 calls this path after the same Azure request preparation; reuse OpenAI SSE decoding and response wire records.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.streaming
  L500-L575; AzureChatCompletion.async_streaming L577-L652. litellm/llms/azure/exception_mapping.py: AzureOpenAIExceptionMapping.create_content_policy_violation_error
  L12-L52; AzureOpenAIExceptionMapping._extract_azure_error L55-L83.


  Implement crates/betterlite-azure/src/azure_stream_errors.rs with adjacent tests under azure_stream_errors/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_stream_errors in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_stream_errors_cases in betterlite-azure with these exact named cases (one per oracle
  file): stream_request, stream_options, content_filter_prompt, content_filter_completion, stream_http_failure.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_stream_errors* using HelperCase: kind:
  helper and the externally tagged azure_stream_errors variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_stream_errors that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_content_filter_error consumes Azure content-filter error body bytes in crates/betterlite-azure/src/azure_stream_errors.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_stream_errors.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_stream_errors.
  The adjacent test replays_the_azure_stream_errors_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 200 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 485 planned, 500 maximum changed lines.
