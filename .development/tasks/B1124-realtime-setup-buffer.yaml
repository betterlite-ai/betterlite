references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L202-L214
  why: Per-connection queue caps and the four audio event names that trigger buffering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L549-L653
  why: Complete deferred predicate, clear compaction, byte accounting, enqueue and failure-preserving flush.
dod:
- text: >-
    deferred_audio_buffer_predicate tests append,commit,clear,end before setup ->true, nonaudio and
    invalid JSON ->false; after setup ->false unless flushing=true. No config or an immediate-setup
    config always returns false. A JSON nonobject can fail at .get as in the source; the caller decides
    its error path. No frames reach the provider until flush is explicitly triggered by the backend relay.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    deferred_audio_clear_order feeds appendA,appendB,clear,appendC,commit,appendD,clear,end. Flush sends
    appendC,commit,end in order. An unrelated or malformed JSON frame flushes the pending append group
    into retained output before itself; a later clear cannot remove that group. Repeated clear sends
    nothing. UTF-8 byte totals are recomputed after compaction, so é counts two bytes, not one character.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    deferred_audio_queue_caps accepts the 200th message and rejects the201st; accepts total10485760 bytes
    and rejects a frame that exceeds it by one. Expect warning "Pre-setup buffer full (%d messages / %d
    bytes); dropping frame" with current queue counts and no disconnect/error event. A clear at capacity
    removes uncommitted appends and permits new appends. Native capacity tests use exact counters and
    service cases use many bounded frames, never an oversized oracle frame.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    deferred_audio_flush_retry sends A successfully, fails B, and receives new D behind a barrier while
    flushing [A,B,C]. Return false, retain [B,C,D] and its exact byte sum, emit debug "Failed to flush
    buffered client message after setup: %s (%d buffered message(s) retained)" with retained-batch count 2.
    Retry sends B,C,D once each; A is never resent. A dropped transform consumes its frame and success
    returns true; empty flush returns true and zero bytes. Reentrant additions are not cleared at the
    end of the previous batch, and byte accounting remains correct after failure.
  proof: [behavior-tests, oracle, service-python]
- text: Buffered send behavior is compared over fresh service transcripts and parser seeds.
  proof: [service-corpus, new-cases, oracle, service-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Clear, capacity and partial-flush failures determine which audio reaches the backend.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_setup_buffer::tests::/)'
  - id: service-python
    why: Flush comparisons must observe real backend sends from the source buffer methods.
    run: test -f tools/oracle/helpers/realtime_setup_buffer_websocket.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: service-corpus
    why: A new setup-buffer service transcript must pass the bounded WebSocket case decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle/realtime-setup-buffer-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: new-cases
    why: Buffer tests need new upstream observations for clear and retry sequences.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-setup-buffer)"
