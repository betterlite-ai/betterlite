id: B1124
title: Realtime setup buffering
description: >-
  Own all six buffering methods at realtime_streaming.py:549-653 and the message/byte/audio-event
  constants at 202-214 in betterlite-core::api::realtime_setup_buffer. B1006 owns state, B1004
  decoding and B1110 sends. A provider defers setup precisely when its requires_session_configuration
  returns false; no provider means no deferred buffering. Buffer append,commit,clear,end audio events
  before setup or during a flush. Once setup is complete and no flush is active, the predicate is false.

  Hold at most 200 ordinary queued messages and 10485760 UTF-8 bytes. Exactly the byte cap is accepted;
  the next frame is warning-dropped. clear is processed before capacity checks, collapses pending appends
  and is never retained itself. commit/end protect earlier appends from a later clear. Flush removes its
  current batch before sending, so frames received during await stay in a new queue. On failure prepend
  the failed frame and remaining batch to that new queue and recompute bytes; do not replay already sent
  frames or silently lose new arrivals. A provider transform returning false still consumes that frame.

  Use B901 realtime_setup_buffer service transcripts for flush I/O, with barriers for arrivals during
  send. Keep pure-collapse assertions as native table tests instead of adding an unused B171 dependency.
  The byte parser is B1004's shared decoder. Count 94 function lines plus 11 constant lines; budget
  105 implementation,145 tests,105 transcripts,85 adapters and 30 wiring, 470 changed lines.
