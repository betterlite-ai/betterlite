dod:
  - text: A 200 response with a "name" on any route builds the JOB_STATE_PENDING record with cost 0.0, the unified object id and the call log updates, and the batch id is the last component of "name".
    proof: [batch-tests, batch-oracle]
  - text: The unified object id is URL-safe base64 without padding of the template filled with the router id first and the batch id second, built by B3633's shared function with no template copy in this module.
    proof: [batch-tests, batch-oracle, template-single-owner]
  - text: A non-200 status or a JSON body without "name" gives the failed record "vertex_ai_batch" with the status text, and a body that does not parse, a non-string model or a transform error gives the error record; neither touches the call log.
    proof: [batch-tests, batch-oracle]
  - text: The managed object is registered on every route, with persist_attribution and create_if_missing true only on the collection route, the registrant defaults, B3630's tags and the done-callback log; a missing registry or runtime only logs.
    proof: [batch-tests]
  - text: get_actual_model_id_from_router and extract_model_name_from_vertex_path return the first router id or the extracted name with the matching log line, and the path rules hold for publishers and projects paths.
    proof: [batch-tests, batch-oracle]
  - text: The helper adapter's Python passes the strict lint and type check.
    proof: [helper-python]
checks:
  optional: []
  commands:
    - id: batch-tests
      why: the batch handler, the registration, the router lookup or the model path rule are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::vertex_batch_logging::tests::batch_/)'
    - id: template-single-owner
      why: this module keeps its own copy of the unified id template instead of calling B3633's function
      run: >-
        test -f crates/betterlite-server/src/pass_through_logging/vertex_batch_logging.rs &&
        ! grep -rF 'llm_batch_id' crates/betterlite-server/src/pass_through_logging/vertex_batch_logging.rs crates/betterlite-server/src/pass_through_logging/vertex_batch_logging
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3641)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3641 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3641/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/vertex_batch_logging-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: batch-oracle
      why: newly added helper cases are absent, do not use the b3641 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/vertex-batch-logging)" &&
        grep -rlE '^[[:space:]]+b3641:' tools/oracle/cases/helpers/vertex-batch-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/vertex-batch-logging
oracle_cases:
  - tools/oracle/cases/helpers/vertex-batch-logging/create-collection-route-pending.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-id-scoped-route-pending.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-publisher-model-path.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-project-model-path.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-no-model-key-unknown.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-empty-name-empty-batch-id.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-non-200-failed.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-200-without-name-failed.yaml
  - tools/oracle/cases/helpers/vertex-batch-logging/create-invalid-json-error-record.yaml
deviations:
  - what: The managed-object write goes through an injected ManagedBatchRegistry that is None in every betterlite deployment for now, so a Vertex batch call logs the "Managed files hook not available" warning and registers nothing.
    why: LiteLLM's managed_files hook lives in the enterprise package, so open-source LiteLLM does the same; the trait keeps the registration code and its tests ready for a later MIT store.
  - what: The text after "Error in batch_prediction_jobs_handler:" and in the failed record's content and error field is the Rust error text (a serde_json or B1371 transform error), not Python's exception text.
    why: Exception strings are runtime wording (docs/compatibility.md); the record shape and the failed state are the same.
  - what: A task panic or a missing Tokio runtime is reported through the same error log lines as a Python exception or a missing event loop.
    why: Rust has no asyncio task, and the join result carries the same facts.
  - what: A "model" field that is not a string, or a JSON body that is an array or a scalar, goes to the failed record without a Python TypeError or AttributeError.
    why: What Python's duck typing does beyond the declared types is not part of the contract; the declared response is an object with string fields.
out_of_scope:
  - "vertex_passthrough_handler and the choice of branch by route: B3642 owns it. It calls batch_prediction_jobs_handler from here when url_route contains batchPredictionJobs, and sets vertex_location on the logging object before."
  - "success_handler's TRACKED_VERTEX_RESOURCE_ROUTES = (batchPredictionJobs,): the pass-through success path task owns it."
  - "optional_str, is_collection_route, request_tags_from_metadata and log_batch_registration_result: B3630 owns them in batch_attribution; this task only calls them."
  - "The unified id template, the three traits and BatchRegistration: B3633 owns them. VertexAIBatchTransformation and the batch job types: B1371. The batch record type: B587. Router.get_model_ids: B844. The per-call log and the uuid helper: B247 and B198."
  - "The managed_files hook and its store_unified_object_id implementation: enterprise only, not built."
  - "extract_model_from_url, the provider helpers and the other handler functions in vertex_passthrough_logging_handler.py: B3638, B3639, B3640 and B3642 own them."
pitfalls:
  - "The success test is status 200 and the key \"name\" in the parsed body, and the body is parsed before the status is looked at, so a 500 with a non-JSON body gives the error record (\"Error creating batch prediction job\"), not the \"creation failed. Status: 500\" record."
  - "The Vertex handler stores the managed object on every batchPredictionJobs route, a GET poll included; only is_collection_route decides persist_attribution and create_if_missing, so a poll must not create a row."
  - "The route suffix is \"batchPredictionJobs\" with no leading slash, and is_collection_route cuts at the first \"?\" and strips trailing slashes before the suffix test."
  - "model_name comes from the response body's \"model\" (a publisher or project model path), not from the request body, and the router lookup uses the path cut by extract_model_name_from_vertex_path."
  - "The unified id string puts the model id first and the batch id second, and the base64 is urlsafe with the trailing \"=\" removed; there is no \"vertex_ai/\" prefix on the id, unlike the Anthropic \"anthropic/\" rule."
  - "The state words are \"JOB_STATE_PENDING\" and \"JOB_STATE_FAILED\" and the object is \"batch_prediction_job\", not B3633's \"in_progress\", \"failed\" and \"batch\"."
  - "The call log is written only on the success branch (model, \"model\" entry, \"response_cost\", \"batch_id\"), and unlike the other Vertex handlers no custom_llm_provider is set."
  - "The registry write happens before the response record is built, so a failure there is logged and the record still says JOB_STATE_PENDING."
  - "The failed and error kwargs have no batch_id and no unified_object_id, so the Rust kwargs type keeps both optional."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
