id: B3641
title: Vertex passthrough batch logging
description: >-
  Build the logging step for a batch prediction job that a client creates or reads through the Vertex pass-through route (a URL route that contains "batchPredictionJobs"). It prices nothing. It turns the relayed response into a logging record with cost 0.0 and state "JOB_STATE_PENDING", and it hands the batch to a registry so a later poll can attribute the batch cost to the creating key and tags.
  The code lives in betterlite-server under src/pass_through_logging, in one module, vertex_batch_logging, next to B3639's vertex_predict_logging and B3640's gemini_passthrough_logging. The skeleton declares it. betterlite-vertex is a leaf that never imports core, provider or logging, so this glue stays in betterlite-server. Nothing here holds module-level state: the three collaborators come in through the constructor.


  What it is in LiteLLM. VertexPassthroughLoggingHandler.batch_prediction_jobs_handler, _store_batch_managed_object, get_actual_model_id_from_router and extract_model_name_from_vertex_path. B3642 owns the dispatch (`"batchPredictionJobs" in url_route`, tested after the predict, search and other branches) and calls the handler below.


  Public surface. B3642 calls it, so names and signatures are fixed. The path is betterlite_server::pass_through_logging::vertex_batch_logging.
  `pub struct VertexBatchLogging` with `VertexBatchLogging::new(router: Option<Arc<dyn RouterModelIds>>, registry: Option<Arc<dyn ManagedBatchRegistry>>, ids: Arc<dyn ResponseIds>) -> VertexBatchLogging`. The three traits and BatchRegistration, BatchRegistrant and BatchObject are B3633's (anthropic_batch) and B587's; import them, do not redefine them. RouterModelIds::model_ids is B844's get_model_ids with exclude_team_models false. ResponseIds::new_response_id gives uuid4 text.
  `pub fn batch_prediction_jobs_handler(&self, input: VertexBatchInput<'_>, call_log: &mut CallLog) -> VertexBatchLogged`. It never returns an error: every failure becomes a "JOB_STATE_FAILED" record, as in LiteLLM. CallLog is B247's per-call log, the same type B3633 takes.
  `pub fn store_batch_managed_object(&self, unified_object_id: &str, batch_object: BatchObject, model_object_id: &str, request_metadata: &serde_json::Map<String, serde_json::Value>, is_batch_create: bool)`. It returns nothing and never fails.
  `pub fn get_actual_model_id_from_router(&self, model_name: &str) -> String`.
  `pub fn extract_model_name_from_vertex_path(vertex_model_path: &str) -> String`, a free function.
  Types in vertex_batch_logging: VertexBatchInput { status_code: u16, body: &[u8], url_route: &str, start_time: DateTime<Utc>, request_metadata: &serde_json::Map<String, serde_json::Value> }, where request_metadata is kwargs["litellm_params"]["metadata"] with a missing or null litellm_params or metadata counted as empty. VertexBatchLogged { result: VertexBatchResponse, kwargs: VertexBatchKwargs }. VertexBatchResponse { id, model, object, created, choices: [one choice with finish_reason "stop", index 0 and a message holding role "assistant", content, tool_calls null, function_call null and provider_specific_fields] }. VertexBatchKwargs { response_cost: f64, model: String, batch_id: Option<String>, unified_object_id: Option<String>, batch_job_state: VertexBatchState, plus the request metadata passed through }. VertexBatchState is an enum serialized as "JOB_STATE_PENDING" and "JOB_STATE_FAILED". The module's error enum is VertexBatchError, in its own files.


  batch_prediction_jobs_handler, in LiteLLM's order.
  1. Parse the body as JSON first, whatever the status. A body that does not parse is a typed error that goes to step 7 with its text.
  2. Success needs status_code == 200 and a JSON object body that has the key "name" (any value, an empty string too). Any other status, or a parsed body that is not an object with "name", goes to step 6.
  3. Call B1371's transform from a Vertex batch job response to the OpenAI batch record (transform_vertex_ai_batch_response_to_openai_batch_response) on the body. Unlike the Anthropic task, the status the transform gives is stored as is; nothing is set to "validating". batch_id is the last "/" component of "name" (B1371's _get_batch_id rule: the empty string when "name" is empty). A transform error goes to step 7. model_name is the body's "model" when it is a string and "unknown" when the key is missing. A "model" that is not a string goes to step 7.
  4. actual_model_id = get_actual_model_id_from_router(model_name). unified_id_string is the template with actual_model_id first and batch_id second, built by B3633's shared function (see Shared id template). unified_object_id is URL-safe base64 of that string with the "=" padding removed.
  5. is_batch_create = is_collection_route(url_route, "batchPredictionJobs") (B3630; the suffix has no leading slash). Call store_batch_managed_object on every route, with is_batch_create. Then build the record: a fresh id from ResponseIds, model = model_name, object "batch_prediction_job", created = start_time as whole seconds. The single choice has content "Batch prediction job {batch_id} created and is pending. Status will be updated when the batch completes." and provider_specific_fields { batch_job_id, batch_job_state: "JOB_STATE_PENDING", unified_object_id }. kwargs get response_cost 0.0, model, batch_id, unified_object_id and batch_job_state "JOB_STATE_PENDING". The call log gets model = model_name (both the field and the "model" entry), "response_cost" = 0.0 and "batch_id" = batch_id. custom_llm_provider is not set here.
  6. Not a success: model "vertex_ai_batch", object "batch_prediction_job", created from start_time, a fresh id, content "Batch prediction job creation failed. Status: {status_code}", provider_specific_fields { batch_job_state: "JOB_STATE_FAILED", status_code }. kwargs get response_cost 0.0, model "vertex_ai_batch" and batch_job_state "JOB_STATE_FAILED" (no batch_id, no unified_object_id). The call log is not touched.
  7. Any error in steps 1 to 5: log at error level "Error in batch_prediction_jobs_handler: {error}" and return the step 6 shape with content "Error creating batch prediction job: {error}", provider_specific_fields { batch_job_state: "JOB_STATE_FAILED", error }, model "vertex_ai_batch". Effects already written stay (the call log is untouched before step 5 ends, and the registry write of step 5 stays).


  store_batch_managed_object. The whole body is wrapped: any error logs at error level "Error storing batch managed object: {error}" and returns. With no registry, log at warn level "Managed files hook not available, cannot store batch object for cost tracking" and return. Otherwise build the registrant from request_metadata exactly as B3633 does (user_id = "user_api_key_user_id" with default "default-user" when the key is absent, api_key = optional_str("user_api_key"), team_id = "user_api_key_team_id", role "customer", spend 0.0, empty models, metadata, permissions, model_max_budget and model_spend, every other field none). request_tags = request_tags_from_metadata(request_metadata) (B3630). The registration carries file_purpose "batch", persist_attribution = is_batch_create and create_if_missing = is_batch_create: a poll refreshes status and the output file but never creates the row or writes the attribution, so only a create does. Spawn the registry future with tokio::spawn and attach the completion with log_batch_registration_result(finished, "Vertex AI", unified_object_id, model_object_id, is_batch_create) (B3630). When Handle::try_current() fails, treat that as the wrapped error above, as Python's create_task raises with no running loop.


  OSS and the managed_files hook. At the pin the hook that implements store_unified_object_id exists only in LiteLLM's enterprise package. The proxy registers hooks from PROXY_HOOKS, which lists nine open-source hooks and no managed_files, and merges ENTERPRISE_PROXY_HOOKS only when `enterprise.enterprise_hooks` imports (hooks/__init__.py L18-L31 and L50-L58). get_proxy_hook on the logging object is a plain dict lookup that returns none (utils.py L1373-L1377). So in a plain deployment the registry is None and this step only logs the warning above and registers nothing. This task keeps the step, builds the real registration with a fake registry in tests, and wires no real registry. The `hasattr(..., "store_unified_object_id")` half of LiteLLM's test is the trait: a registry always has the method.


  get_actual_model_id_from_router. First extracted = extract_model_name_from_vertex_path(model_name). With no router, log at warn level "Router not available, using constructed model name: {extracted}" and return extracted. Otherwise ask model_ids(extracted): when the list has an item, log at info "Found model ID in router: {id}" and return the first; when empty, log at warn "Model not found in router, using constructed name: {extracted}" and return extracted. These texts differ from B3633's, so do not share them.


  extract_model_name_from_vertex_path. When the path contains "models/" and also contains "publishers/" or "projects/", return the part after the last "models/". Otherwise return the path unchanged. "publishers/google/models/gemini-2.5-flash" gives "gemini-2.5-flash"; "projects/P/locations/L/models/123" gives "123"; "gemini-2.5-flash" and "models/x" stay as they are.


  Shared id template. B3633 owns the unified id: LiteLLM's SpecialEnums.LITELLM_MANAGED_BATCH_COMPLETE_STR, "litellm_proxy;model_id:{};llm_batch_id:{}" (types/utils.py L4417). B3633 makes it a `pub fn` in anthropic_batch that takes the model id and the batch id and returns the unified object id (the template filled, URL-safe base64, no padding), and B3641 calls that function. This task holds no copy of the template and adds no second one. B3641 depends on B3633 for the function, the three traits and BatchRegistration.


  Tests: module tests under pass_through_logging::vertex_batch_logging::tests, each name starting with batch_. A fake router, a fake registry that records the BatchRegistration (and one that fails), a fixed ResponseIds and the real B3630 and B1371 functions run. The router-found path and the spawned registry write are Rust tests only, because the oracle has no router and no managed-files hook.
  No route reaches this code until B3642 wires the dispatcher, so the oracle cases are helper cases: the Python adapter calls the pinned VertexPassthroughLoggingHandler.batch_prediction_jobs_handler with an httpx.Response, a stub logging object (llm_router is None there, so the "constructed model name" path runs) and a collection or id-scoped route, and replaces the random result id before comparing. B3642 and the Vertex route tasks add the HTTP cases.
