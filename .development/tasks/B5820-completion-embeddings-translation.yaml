dod:
  - text: A text completion `prompt` that is text reaches the guardrail as one text, with `model` set only when the body's model is a non-empty text, and the first returned text replaces the prompt. An empty reply keeps the prompt.
    proof: [completion-input-tests]
  - text: An array `prompt` sends only its text elements, writes returned texts back to the same positions, leaves non-text elements in place, makes no call when it has no text element, and handles a reply shorter or longer than the request without an error.
    proof: [completion-input-tests]
  - text: A missing or null `prompt` makes no guardrail call and leaves the body alone, and a `prompt` that is a number or an object also makes no call and leaves the body alone.
    proof: [completion-input-tests]
  - text: Completion output sends every text-valued `choices[].text` with input type `Response`, rewrites those choices by position, and leaves a choice with a null or missing `text` untouched. A response with no choices, or choices without text, makes no call and leaves the request data without a `response` key.
    proof: [completion-output-tests]
  - text: Completion output adds `response` and a non-empty `litellm_metadata` to the request data before the call, builds a fresh map when none was given, and does not replace an existing `response` or an existing `litellm_metadata` key.
    proof: [completion-output-tests, response-context-tests]
  - text: Output inputs carry `model` from the response only when it is a non-empty text.
    proof: [completion-output-tests]
  - text: The user metadata keys get the `user_api_key_` prefix, keys that already have it are kept, null values and keys starting with an underscore are dropped, and an empty result adds no `litellm_metadata`.
    proof: [response-context-tests]
  - text: A guardrail failure from any handler is returned as the module's error with the failure intact and the body is not rewritten.
    proof: [completion-input-tests, completion-output-tests, embeddings-input-tests]
  - text: A text embeddings `input` and an array of text both go to the guardrail, and a non-empty reply replaces the input, a text for the text form and the whole returned array for the array form, even when its length differs. An absent or empty reply keeps the input.
    proof: [embeddings-input-tests]
  - text: Embeddings input that is an empty array, an array of numbers, an array of number arrays, or an array whose first element is neither text nor number nor array makes no guardrail call and leaves the body unchanged. A missing, null or other-typed input does the same.
    proof: [embeddings-input-tests]
  - text: An embeddings array that starts with text and has a later element that is not text returns the module's error without a guardrail call.
    proof: [embeddings-input-tests]
  - text: Embeddings output processing changes nothing and needs no guardrail.
    proof: [embeddings-output-tests]
checks:
  optional: []
  commands:
    - id: completion-input-tests
      why: the completion request handler tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::completion_translation::tests::input_/)'
    - id: completion-output-tests
      why: the completion response handler tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::completion_translation::tests::output_/)'
    - id: response-context-tests
      why: the shared response request-data preparation tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::response_context::tests::/)'
    - id: embeddings-input-tests
      why: the embeddings request handler tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::embeddings_translation::tests::input_/)'
    - id: embeddings-output-tests
      why: the embeddings response no-op test is missing or fails
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::embeddings_translation::tests::output_/)'
oracle_cases: []
deviations:
  - what: An embeddings `input` array that starts with text but has a later element that is not text is rejected with `EmbeddingsTranslationError` before any guardrail call. The route maps it to a 400.
    why: LiteLLM passes the mixed list to the guardrail as `texts`. `GuardrailApiInputs.texts` is a `Vec<String>`, and skipping the scan would let an unscanned input through, so betterlite refuses the request. The declared type `str | int | list[int]` list is meant to hold one kind.
  - what: The `response` value placed in the request data is a copy of the response taken before the rewrite. LiteLLM stores the live object, so a guardrail that reads `request_data["response"]` after the rewrite sees the new text there.
    why: Rust cannot hold a shared reference into the response while the handler writes to it, and the guardrail only reads the response during its own call.
out_of_scope:
  - "B3661 owns BaseTranslation, transform_user_api_key_dict_to_metadata and merge_user_api_key_metadata_into_request. This task calls the first and does not touch the others."
  - "B5471 owns GenericGuardrailAPIInputs as GuardrailApiInputs, GuardrailContract, GuardrailFailure and GuardrailLogTarget. This task only builds and reads them."
  - "The guardrail_translation_mappings tables in the six __init__.py files (call type to handler class) belong to the dispatcher, B3679 and B3680. The dispatcher also registers the functions here by call type: text_completion, atext_completion, embedding and aembedding."
  - "B3677 owns the image generation, speech, transcription and video handlers and uses response_context from this task."
  - "B3668 owns the chat handler and B3671 to B3676 own the Responses and Anthropic handlers. They keep their own copies of the output request-data lines."
  - "Turning a GuardrailFailure into an HTTP error body, and the proxy route that calls these handlers, belong to the dispatcher and route tasks."
pitfalls:
  - "`model` is added to the inputs only when it is a non-empty text (LiteLLM tests truthiness), so a body with `\"model\": \"\"` sends inputs without a model."
  - An array `prompt` pairs returned texts with positions by index and stops at the shorter list, so a guardrail that returns fewer texts leaves the later prompts as they were, with no error.
  - "A text prompt takes `texts[0]` only when the returned list is non-empty. An empty list keeps the original prompt, but a list holding one empty text sets the prompt to an empty string."
  - A `prompt` array of token ids (numbers or arrays of numbers) has no text element, so it is never scanned and never rewritten, and that is not a warning.
  - "The embeddings array form replaces `input` with the whole returned list, so a guardrail that adds or drops texts changes how many vectors the provider returns."
  - "The embeddings forms keep the input when the reply has no `texts` key, a null `texts` or an empty list, all three the same."
  - "An array `input` is classified by its first element alone: a leading number or array skips the whole input even if later elements are text. The later-element rejection above applies only to an array that starts with text."
  - "The `response` key and `litellm_metadata` are tested with key presence. A request body whose `litellm_metadata` is null keeps the null and gets no user metadata."
  - "Output processing builds the request data only after it finds at least one text, so a response with no text leaves `request_data` untouched and unadded."
  - The warn lines for an unexpected `prompt` or `input` type are LiteLLM's only signal for a bad type. They must stay warn level, since the other endpoints in B3677 log the same case at debug.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
