id: B5820
title: Text completion and embeddings guardrail translation
description: >-
  Build the handlers that apply a guardrail to a text completion request and response and to an embeddings request.
  Each handler turns the text in the request body into the `texts` of a `GuardrailApiInputs`, calls the guardrail once, and writes the returned texts back into the body.
  The modules sit in crates/betterlite-server/src/guardrails/ and are plain async functions, not trait impls. The dispatcher (B3679, B3680) picks the function by call type, so nothing here knows about call types or routes.
  Request bodies are `BTreeMap<String, GuardrailValue>` and responses are `GuardrailValue`, both from `betterlite_config::sections::guardrail_identity::item`.
  `GuardrailApiInputs` (LiteLLM's `GenericGuardrailAPIInputs`), `GuardrailContract`, `GuardrailFailure` and `GuardrailLogTarget` come from B5471's `guardrail_base`. The guardrail is a generic `G: GuardrailContract`, because the trait's `apply_guardrail` returns `impl Future` and cannot be a trait object.
  `input_type` is `GuardrailInputType::Request` for input and `GuardrailInputType::Response` for output.

  Module `completion_translation` has `process_input_messages(data: &mut BTreeMap<String, GuardrailValue>, guardrail: &G, logging_obj: Option<&mut GuardrailLogTarget>) -> Result<(), CompletionTranslationError>`, LiteLLM's `OpenAITextCompletionHandler.process_input_messages`.
  A missing or null `prompt` logs at debug and returns. A text `prompt` calls the guardrail once with `texts: [prompt]` and sets `model` in the inputs only when `data["model"]` is a non-empty text. The call passes `data` itself as `request_data`. The returned `texts[0]` replaces `data["prompt"]`; an absent or empty returned list leaves the prompt as it was. An array `prompt` collects the elements that are text, keeping their positions, and skips every other element (token ids, nested id arrays). No text elements means no guardrail call. Otherwise it makes one call with the collected texts and writes returned text number `i` back to the position of collected text `i` for every `i` below the returned length, so a shorter reply rewrites only the first positions and a longer reply drops its extra texts. Any other `prompt` type logs at warn level with the type name and returns.
  Keep every debug line LiteLLM logs, for example `OpenAI Text Completion: Applied guardrail to string prompt. Original length: {}, New length: {}`, lengths counted in characters.

  `completion_translation::process_output_response(response: &mut GuardrailValue, guardrail: &G, logging_obj: Option<&mut GuardrailLogTarget>, user_api_key_dict: Option<&BTreeMap<String, GuardrailValue>>, request_data: Option<&mut BTreeMap<String, GuardrailValue>>) -> Result<(), CompletionTranslationError>` is `process_output_response`.
  An absent, null or empty `choices` array logs at debug and returns. It collects `choices[i].text` for every choice whose `text` is text, keeping the choice index. No collected text means no call, and `request_data` is left alone. Otherwise it prepares the request data (see `response_context`), builds inputs with `texts` and `model` set from `response["model"]` when that is a non-empty text, calls the guardrail with `Response`, and writes returned text `i` into the `text` of the `i`-th collected choice for every `i` below the returned length. The response is changed in place.

  Module `response_context` has `add_response_context(request_data: &mut BTreeMap<String, GuardrailValue>, response: &GuardrailValue, user_api_key_dict: Option<&BTreeMap<String, GuardrailValue>>)`. LiteLLM repeats these lines in each output handler, so this one function serves them all, including B3677's transcription handler. It inserts `response` under the key `response` when the key is missing (an existing value stays, even null). Then, when the key `litellm_metadata` is missing, it computes the user metadata with B3661's `transform_user_api_key_dict_to_metadata` and inserts it as an object under `litellm_metadata` only when the result is not empty. An output handler that gets `request_data: None` starts from an empty map, calls this function on it, and passes that map to the guardrail. The key is looked at, not its value, so `"litellm_metadata": null` blocks the insert. Read B3661's function in crates/betterlite-guardrails/src/guardrail_translation.rs for its exact signature and adapt the call.

  Module `embeddings_translation` has `process_input_messages(data, guardrail, logging_obj) -> Result<(), EmbeddingsTranslationError>` with the same arguments as the completion one. A missing or null `input` logs at debug and returns. A text `input` calls the guardrail with `texts: [input]` and `model` when `data["model"]` is a non-empty text, and when the returned `texts` is present and not empty, sets `data["input"]` to `texts[0]`. An array `input` is handled like this, in order. An empty array returns. If the first element is a number or an array (token ids, one list per input), log at debug `OpenAI Embeddings: Input is token IDs, skipping guardrail processing` and return without a call. If the first element is not text, log a warning with `Unexpected input list item type` and return. Otherwise send the whole array as `texts`, call the guardrail, and when the returned `texts` is present and not empty, replace `data["input"]` with the returned array whole. Its length may differ from the input's length, and nothing is paired by position. Any other `input` type logs at warn level and returns.
  `process_output_response(response: &GuardrailValue) -> ()` logs the debug line `OpenAI Embeddings: Output response processing skipped - embeddings contain vectors, not text` and changes nothing. It exists so the dispatcher can call every endpoint the same way, and it takes no guardrail.

  Each of the two handler modules owns its error enum (`CompletionTranslationError`, `EmbeddingsTranslationError`) with one variant holding the `GuardrailFailure` the guardrail returned, and a second variant on the embeddings enum for an array whose first element is text but a later element is not (see deviations). Box the failure if `clippy::result_large_err` fires. No handler catches, logs or rewrites a guardrail failure. It goes straight to the caller, because LiteLLM lets the exception pass.

  Tests use a small fake guardrail defined in each module's tests, a struct that records the `GuardrailApiInputs`, `input_type` and a copy of the request data it was called with and returns a scripted `texts` list. They live in `<module>::tests` with the name prefixes the checks use. The handlers are not reachable from a route yet, so HTTP cases come with the dispatcher umbrella (B3680) and there are no oracle cases here.
