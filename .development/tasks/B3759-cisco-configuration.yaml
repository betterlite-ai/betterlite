id: B3759
title: Cisco configuration normalization and records
description: >-
  Build Cisco's shared scan/verdict records, mode inference, configuration normalization,
  chat payload metadata and supported-hook metadata. Invalid choices warn and use their
  pinned defaults, while timeout values clamp to 1–60 seconds.

  Cisco AI Defense runs two distinct inspection surfaces (chat and MCP), each scanning
  specific traffic types. Each guardrail instance targets one surface via the
  ``inspection_type`` dropdown. This task owns configuration helpers that normalize
  user-supplied settings against Cisco's API expectations: resolving invalid inspection
  types and actions with warnings and defaults, coercing timeout values to valid bounds,
  and mapping event-hook configurations to infer which inspection surface a user intends.

  Build the ``_ScanContext`` record (surface and direction), the ``_CiscoVerdict`` record
  (Cisco's complete response including is_safe, classifications, severity, rules,
  explanation, event_id, action and any sanitized rewrites), and shared helpers that
  normalize rules (accepting string, dict or Pydantic model inputs), build chat inspection
  payloads (messages + metadata + config), and provide the typed configuration model
  accessor and supported event hooks list. The configuration model is owned by the
  base guardrail framework (F); this task only returns its type via ``get_config_model``.

  Direct prerequisite B3758: ``get_config_model`` selects ``CiscoAIDefenseGuardrailConfigModel``.
  The shared record definitions do not construct a live guardrail and do not call
  B3762's constructor.

