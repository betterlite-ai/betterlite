dod:
  - text: _ScanContext (surface, direction) and _CiscoVerdict (is_safe, classifications, severity, rules, explanation, event_id, action, sanitized_text, sanitized_messages, sanitized_mcp_arguments) records are defined and immutable.
    proof: [cisco-config-tests]
  - text: _resolve_choice normalizes invalid config choices (inspection_type, on_flagged_action, fallback_on_error) against allowed values, logs a warning, and returns the pinned default when the value is invalid or missing.
    proof: [cisco-config-tests]
  - text: _coerce_timeout accepts string and float inputs, clamps to 1–60 seconds, and returns None (so the caller uses DEFAULT_TIMEOUT_SECONDS) on invalid input or missing env var.
    proof: [cisco-config-tests]
  - text: _is_mcp_call_type identifies call_type values that LiteLLM routes to MCP inspection hooks (mcp_call, call_mcp_tool).
    proof: [cisco-config-tests]
  - text: _surface_matches returns true when (inspection_type == mcp and is_mcp_traffic) or (inspection_type == chat and not is_mcp_traffic).
    proof: [cisco-config-tests]
  - text: _normalize_event_hooks coerces event_hook argument (str, enum, or list thereof) to a set of hook names, extracting the .value attribute from enums and discarding None/unparseable entries.
    proof: [cisco-config-tests]
  - text: _infer_inspection_from_mode auto-flips inspection_type from chat to mcp when event_hook is exclusively MCP (pre_mcp_call, during_mcp_call), from mcp to chat when exclusively chat (pre_call, during_call, post_call), and preserves current when mixed.
    proof: [cisco-config-tests]
  - text: _warn_if_mode_surface_mismatch logs a warning only when event_hook mixes both surfaces (at least one MCP hook and at least one chat hook), naming the unused hooks for the configured inspection_type.
    proof: [cisco-config-tests]
  - text: _build_chat_payload assembles {messages, metadata, config} where metadata is from _build_metadata and config from _build_config, ready for the Cisco chat inspection endpoint.
    proof: [cisco-config-tests]
  - text: >-
      _build_metadata extracts user (from request_data or user_api_key_dict),
      litellm_call_id→client_transaction_id, and whitelisted metadata keys
      (src_app, dst_app, src_ip, dst_ip, dst_host, sni, user_agent), each
      returned only if present.
    proof: [cisco-config-tests]
  - text: >-
      _build_config constructs {enabled_rules, integration_profile_id,
      integration_profile_version, integration_tenant_id, integration_type},
      each included only if set (None-valued keys are omitted).
    proof: [cisco-config-tests]
  - text: >-
      _normalize_rule accepts string (wrapped as {rule_name: ...}), dict with
      rule_name/entity_types/rule_id/classification, or Pydantic model (dumped
      and re-entered dict branch), raising ValueError on malformed input.
    proof: [cisco-config-tests]
  - text: get_config_model returns the CiscoAIDefenseGuardrailConfigModel type (not an instance), imported locally to avoid circular dependencies.
    proof: [cisco-config-tests]
  - text: get_supported_event_hooks returns a list of six GuardrailEventHooks values (pre_call, during_call, post_call, logging_only, pre_mcp_call, during_mcp_call).
    proof: [cisco-config-tests]

