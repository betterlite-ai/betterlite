oracle_cases: []

deviations:
  - what: Timeout values are clamped to 1–60 seconds; LiteLLM does the same.
    why: Enforce safe defaults; values below 1s are too tight for network calls, values above 60s risk hung requests.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L268-L283
  - what: Invalid config choices (inspection_type, on_flagged_action, fallback_on_error) fall back to pinned defaults with a log warning; LiteLLM does the same.
    why: Silent fallback masks typos and misconfigurations; a warning makes them visible at startup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L246-L266

out_of_scope:
  - Cisco inspection API calls and response parsing (_post_inspection, _finalize_inspection); those belong to B3760.
  - Redaction application (_apply_redaction, message/response rewriting); those belong to B3757 and B3760.
  - Logging and decision metadata attachment (_log_decision, _stash_verdict_on_request); those belong to B3760.
  - HTTP headers and transport setup (_build_headers, async_handler); those belong to shared transport (H).
  - The actual guardrail constructor (__init__) which orchestrates these helpers; that belongs to B3762.
  - MCP-specific payload building and message extraction; those belong to B3761 and B3756.
  - Block payload building (_build_block_payload); that belongs to B3760.
  - Chat inspection method (_inspect_chat); that belongs to B3762.
  - Request/response redaction; that belongs to B3757.

pitfalls:
  - _normalize_event_hooks extracts the .value attribute from enum objects; enums may not inherit str so a direct isinstance check on the original enum object fails and produces None.
  - _infer_inspection_from_mode must not flip inspection_type when event_hook mixes both surfaces; let the user keep control via their explicit setting and warn them instead (B3759 owns the warning logic).
  - Metadata keys from request_data are optional; build the metadata dict only with keys that are actually present so logs stay compact.
  - _resolve_choice reads from os.environ; it is not disallowed in this module since config loading is a system boundary, but add the expect attribute to avoid clippy warnings.
  - _normalize_rule accepts Pydantic models; call model_dump(exclude_none=True) first and fall back to model_dump() if the exclude_none kwarg is not supported by older model versions.

