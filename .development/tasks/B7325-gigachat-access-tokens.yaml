id: B7325
title: GigaChat access tokens
description: >-
  Build GigaChat's OAuth access token source in crates/betterlite-http as the module gigachat_tokens. It replaces get_access_token and get_access_token_async from litellm/llms/gigachat/authenticator.py (they share one body, so betterlite has one async method) together with the token cache and the reply parser. Every GigaChat call that needs a bearer token (the pass-through route in B3627, and later the chat, embedding and file calls) goes through it. The module name and every type name below stay at 30 characters or fewer.

  Public items, each in its own file under crates/betterlite-http/src/gigachat_tokens/ and re-exported from gigachat_tokens.rs:
  1. `GigachatTokenRequest { access_token: Option<SecretString>, credentials: Option<SecretString>, scope: Option<String>, auth_url: Option<String> }`. It is the typed form of get_access_token's arguments: `access_token`, `scope` and `auth_url` stand for the `gigachat_access_token`, `gigachat_scope` and `gigachat_auth_url` keys of litellm_params, and `credentials` is the credentials argument. A caller with nothing to override sets all four to None.
  2. The trait `GigachatTokens`, declared with `#[async_trait]`, with one method `async fn access_token(&self, request: &GigachatTokenRequest) -> Result<SecretString, GigachatAuthError>`. B3627 imports this trait and calls it with all four fields None, and its tests use a fake.
  3. `GigachatAuthError`, one thiserror enum in gigachat_tokens/error.rs with the variants `MissingCredentials` (status 401), `Rejected { status: StatusCode, body: String }` (the OAuth server answered a non-2xx status, kept as is), `Transport { source: reqwest::Error }` (status 500, the request failed before a status arrived or timed out) and `InvalidReply` (status 500, the 2xx reply was unusable). `pub fn status_code(&self) -> StatusCode` returns the status shown. Display texts are betterlite's own and never contain a token or the credentials.
  4. `GigachatRuntime`, a trait with `fn now_millis(&self) -> i64` (wall clock, milliseconds since the Unix epoch) and `fn request_uid(&self) -> Uuid`. The production implementation is `SystemRuntime` in the same file (SystemTime for the clock, Uuid::new_v4 for the id, converted without `as`). Tests use a scripted one.
  5. `GigachatAuthenticator<R: GigachatRuntime>`, built with `new(settings, client, runtime)` where settings is `config.sections.gigachat_auth` (below), client is a `reqwest::Client` the caller built (the module never builds one and reads no environment) and runtime is the runtime above. It implements `GigachatTokens`.

  Order of `access_token`, copied from LiteLLM:
  1. Take `request.access_token` when it is non-empty, else `settings.access_token` (env GIGACHAT_ACCESS_TOKEN). When either is set, return it at once with no network call and no cache use.
  2. Take `request.credentials` when non-empty, else `settings.credentials`. With neither, return `MissingCredentials`.
  3. scope is `request.scope`, else `settings.scope`. auth_url is `request.auth_url`, else `settings.auth_url`. Empty strings count as unset everywhere.
  4. Cache key is `gigachat_token:` followed by the first 16 characters (chars, not bytes) of the credentials. A cache entry holds the token and the expires_at value (milliseconds). It is a hit only when `now_millis < expires_at - 60000`. On a hit log debug "Using cached GigaChat access token" and return the token.
  5. On a miss POST the form `scope=<scope>` to auth_url with headers `Authorization: Basic <credentials>`, `RqUID: <request_uid>` and `Content-Type: application/x-www-form-urlencoded`, with a 30 second timeout. Log debug "Requesting GigaChat access token from <auth_url>" first. A 2xx reply is parsed as below. Any other status, including 3xx, is `Rejected` with the status and the reply text (at most 1024 bytes). A failure with no status (connect, TLS, timeout) is `Transport`.
  6. After a successful parse, when expires_at is non-zero compute `ttl = max(0, (expires_at - 60000 - now_millis) / 1000)` seconds using a fresh `now_millis`. Store the entry only when ttl is above 0. Log debug "GigaChat access token obtained successfully" when the parse succeeds. Return the token.

  Reply parser, `decode_token_reply(bytes: &[u8]) -> Result<TokenReply, GigachatAuthError>` in gigachat_tokens/reply.rs (the decoder the fuzz target drives; input is the raw OAuth reply body, read up to 64 KiB, a longer reply is `InvalidReply`). The body must be a JSON object. The token is `tok` when it is a non-empty string, else `access_token` when it is a non-empty string; with neither it is `InvalidReply`. expires_at is `exp` when truthy, else `expires_at`. A truthy value is a non-zero integer or a non-empty string. A string is trimmed and parsed as a decimal i64. `TokenReply` holds the token as SecretString and `expires_at: Option<i64>` (None when both keys are absent, null, 0 or an empty string). A float, a bool, a list, an object or an unparsable string in an exp key is `InvalidReply`.

  Token cache in gigachat_tokens/cache.rs: a bounded map behind a tokio Mutex that is never held across an await (lock, look up, unlock, fetch, lock, insert). It copies LiteLLM's InMemoryCache as used here: at most 200 entries. An insert first drops expired entries, then, while the map has 200 or more entries, drops the one that expires first. Inserting a key that already exists and has not expired replaces the stored token but keeps the old expiry time. Concurrent callers on a miss each fetch their own token; there is no single-flight.

  Config section: crates/betterlite-config/src/sections/gigachat_auth.rs, environment only, modelled on sections/chatgpt_headers.rs (a Raw struct with a skipped marker field, a Settings type, a Section impl whose convert reads the EnvironmentLookup). Settings: `access_token: Option<SecretString>` from GIGACHAT_ACCESS_TOKEN, `credentials: Option<SecretString>` from GIGACHAT_CREDENTIALS and, when that is unset or empty, GIGACHAT_API_KEY, `auth_url: String` from GIGACHAT_AUTH_URL defaulting to https://ngw.devices.sberbank.ru:9443/api/v2/oauth, `scope: String` from GIGACHAT_SCOPE defaulting to GIGACHAT_API_PERS. An empty value counts as unset. The section is a stub the skeleton creates; this task fills it.

  Tests. Rust tests live in gigachat_tokens/tests.rs under the groups source_order, oauth_request, token_cache and reply_decoding, plus `replays_token_reply` for the fuzz corpus. The oauth_request and token_cache groups run against a local tokio TcpListener that answers canned HTTP/1.1 replies and records the request (method, headers, body); the client is built with redirects turned off. A `Basic` header value or token never appears in any Debug or Display output; one test checks that.
