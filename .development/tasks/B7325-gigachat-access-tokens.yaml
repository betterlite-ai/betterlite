    why: get_access_token, the lookup order, cache key and ttl; the async twin at L113-L152 is the same body.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/authenticator.py#L155-L229
    why: The sync and async OAuth requests, with the headers, the 30 second timeout and the two error mappings.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gigachat/authenticator.py#L232-L253
