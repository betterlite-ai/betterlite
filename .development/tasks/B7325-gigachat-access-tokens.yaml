dod:
  - text: A token from the request or from GIGACHAT_ACCESS_TOKEN is returned with no network call, the request value first, and a missing token and missing credentials give MissingCredentials with status 401.
    proof: [source-order-tests, oracle]
  - text: The OAuth call posts scope as a form to the auth URL with Basic credentials, an RqUID header and a 30 second timeout, picks scope and auth URL from the request before the settings, and maps a non-2xx status to Rejected with that status and a connection failure to Transport.
    proof: [oauth-request-tests]
  - text: The token cache is keyed on the first 16 credential characters, serves a token until 60 seconds before its expiry, stores nothing when the remaining ttl is 0 or the expiry is missing, holds at most 200 entries and keeps the old expiry when a live key is replaced.
    proof: [token-cache-tests]
  - text: The reply parser takes tok/exp before access_token/expires_at, skips empty values, reads a numeric string expiry, and rejects a missing token, a non-object body, an unparsable expiry and an oversized body as InvalidReply.
    proof: [reply-decoding-tests, oracle]
  - text: The gigachat_auth section loads the four environment variables, falls back from GIGACHAT_CREDENTIALS to GIGACHAT_API_KEY, applies both defaults for unset or empty values and does not print the secrets.
    proof: [auth-config-tests, mutants]
  - text: Corrupt OAuth reply bytes stay bounded and the added fuzz corpus is replayed in ordinary tests.
    proof: [token-reply-corpus]
checks:
  optional: [mutants]
  commands:
    - id: source-order-tests
      why: the token source skips the override order, calls the network when a token is given, or returns the wrong error for missing credentials
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^gigachat_tokens::tests::source_order(::|$)/)'
    - id: oauth-request-tests
      why: the OAuth request has the wrong headers, form, timeout or error mapping
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^gigachat_tokens::tests::oauth_request(::|$)/)'
    - id: token-cache-tests
      why: the cache key, the 60 second buffer, the ttl rule, the 200 entry bound or the kept expiry is wrong
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^gigachat_tokens::tests::token_cache(::|$)/)'
    - id: reply-decoding-tests
      why: the reply parser reads the wrong key pair, accepts a bad expiry or takes an oversized body
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^gigachat_tokens::tests::reply_decoding(::|$)/)'
    - id: auth-config-tests
      why: the gigachat_auth section does not load the variables, the fallback or the defaults
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::gigachat_auth::/)'
    - id: token-reply-corpus
      why: the token reply decoder has no fuzz target or its seeds are not replayed
      run: test -f crates/betterlite-http/fuzz/fuzz_targets/gigachat_token_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-http/fuzz/corpus/gigachat_token_reply)" && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(replays_token_reply)'
