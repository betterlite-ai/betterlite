    why: evict_cache and set_cache, the eviction order and the kept expiry on an unexpired key.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L3867-L3891
