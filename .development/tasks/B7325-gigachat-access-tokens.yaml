deviations:
  - what: GIGACHAT_ACCESS_TOKEN, GIGACHAT_CREDENTIALS, GIGACHAT_API_KEY, GIGACHAT_AUTH_URL and GIGACHAT_SCOPE are read from the environment only.
    why: LiteLLM's get_secret_str also asks the configured secret manager. Secret manager lookups belong to the secret-managers crate; open question in the notes.
  - what: A 2xx reply that is not a JSON object, has a float or non-numeric expiry, or is larger than 64 KiB gives GigachatAuthError::InvalidReply (status 500); the message does not echo the reply.
    why: LiteLLM lets JSONDecodeError, AttributeError or ValueError escape from the parser, which the proxy answers as a plain 500. The status is the same and the message is betterlite's own.
  - what: The Rejected error keeps at most 1024 bytes of the OAuth server's reply text.
    why: LiteLLM puts the whole text in the message; betterlite bounds it.
  - what: The task does not turn certificate checks off. LiteLLM's OAuth client uses ssl_verify=False, and here the caller passes the reqwest::Client, so the TLS policy is its choice.
    why: Turning verification off belongs to the shared TLS policy (B173), not to a provider module. Open question in the notes.
  - what: The token comes back as a SecretString and is never logged.
    why: rules.yaml secrets-stay-secret; LiteLLM returns a plain str.
out_of_scope:
  - "GigaChatPassthroughConfig, GigaChatConfig, the embedding transformation and file_handler.py call get_access_token: the rest of B043's gigachat parts own them and call GigachatTokens. file_handler.py's two call sites (L125 and L191) use the sync and async forms, which are one method here."
  - "GIGACHAT_BASE_URL and get_api_base in gigachat/utils.py: B3627 owns the pass-through gigachat_route.api_base setting, and the chat part owns get_api_base."
  - "Building the reqwest::Client (pooling, redirects off, TLS policy) and the production wiring of GigachatAuthenticator into the server: B173 and the architect's skeleton."
  - "The proxy route that calls the trait: B3627 imports GigachatTokens from this module and declares no token type of its own."
pitfalls:
  - "`gigachat_access_token` in litellm_params and GIGACHAT_ACCESS_TOKEN switch OAuth off, so the credentials, the cache and the network are all skipped, and an empty string counts as unset."
  - "The cache key uses only the first 16 characters of the credentials, so two credential strings that share a 16 character start share one cached token, and a different scope or auth_url under the same credentials returns the first token."
  - "The cache hit test is `now < expires_at - 60000` in milliseconds, while the stored ttl is in seconds; mixing the units caches a token for 1000 times too long or too short."
  - "A reply whose exp is 0, \"\" or null is not cached but the token is still returned; a reply with no exp at all behaves the same."
  - "`exp` wins over `expires_at` only when it is truthy, so `exp: 0` with a real `expires_at` uses `expires_at`."
  - "A string expiry such as \"1735689600000\" is parsed as an integer, so a quoted number is valid and a quoted float is not."
  - "reqwest follows redirects by default and httpx does not, so a 302 from the OAuth server must reach the code as Rejected(302); the tests build the client with redirects off."
  - "The Basic header carries the credentials exactly as given, already base64 in the `client_id:secret` form; never re-encode them."
  - "The RqUID value is a fresh UUID for every OAuth request, taken through GigachatRuntime so tests can fix it."
  - "Replacing a live cache key keeps the first expiry time, so a second concurrent fetch can leave a newer token under an earlier expiry; the stored expires_at still decides a hit."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
