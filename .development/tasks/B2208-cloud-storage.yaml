id: B2208
oracle_cases:
- tools/oracle/cases/helpers/providers/cloud-storage/cloud-uri-detection.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/object-component-sanitization.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/object-path-sanitization.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/configured-bucket-split.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/object-path-validation.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/cloud-object-encoding.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/legacy-trusted-policy.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/managed-id-authorization.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/legacy-prefix-boundary.yaml
- tools/oracle/cases/helpers/providers/cloud-storage/encoded-traversal-order.yaml
out_of_scope:
- Provider-specific unified file-ID decoding and trusted S3 bucket selection are B643; S3 signing, upload/list/download
  are B644-B646.
- Enterprise-managed unified file ownership and endpoint rejection are B087/API-family parts. This helper does not
  register a hook or perform storage IO.
- B115 retains storage logging integration behavior and calls these shared naming helpers; it no longer owns this
  helper file.
pitfalls:
- Authorization percent-decodes once, while filename sanitization never percent-decodes.
- The source object-path validator accepts a trailing slash and literal backslash, so generic filesystem canonicalization
  changes its behavior.
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/cloud_storage_security.py#L11-L167
  why: All shared cloud-storage naming, trusted legacy policy and authorization helpers.
