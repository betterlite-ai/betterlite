budget:
  max_changed_lines: 725
  max_new_expects: 0
checks:
  commands:
  - id: helper-python
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/cloud_storage.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
    why: The operation adapter is absent, unchanged or fails strict Python checks.
  - id: helper-case-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/cloud_storage*")"
      && grep -lq 'cloud_storage' tools/oracle/fuzz/corpus/helper_case/cloud_storage* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_cloud_storage$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
  - id: case-cloud-uri-detection
    why: is_managed_cloud_storage_uri returns True only for a string starting exact s3:// or gs://, including a
      bare scheme; it does no bucket/key validation and rejects uppercase schemes. This identifies internal provider
      artifacts for the proxy owner check; it does not establish ownership.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_cloud_uri_detection$/)'
  - id: case-object-component-sanitization
    why: For a nonstring return fallback (default file) unchanged. Replace backslashes with slashes, take POSIX
      basename, trim surrounding whitespace, and return fallback for empty, dot or dot-dot. Replace each codepoint
      below32 or equal127 with underscore, then each run outside ASCII A-Z,a-z,0-9,dot,underscore,hyphen with one
      underscore. Strip leading/trailing dots and underscores; if empty use fallback, otherwise truncate to 255
      characters. Do not sanitize or truncate fallback, normalize Unicode, or percent-decode filenames.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_object_component_sanitization$/)'
  - id: case-object-path-sanitization
    why: For nonstrings return fallback (default file). Replace backslashes with slashes, split on slash, sanitize
      every segment with empty fallback, discard empty results and join with slash; if none survive use fallback.
      Dot/traversal segments are removed by sanitization, whereas authorization rejects them. build_managed_cloud_object_name
      uses the component sanitizer with fallback_filename default file and emits prefix plus UUID4 lowercase hex
      plus hyphen plus safe filename; preserve prefix verbatim and inject UUID for the oracle.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_object_path_sanitization$/)'
  - id: case-configured-bucket-split
    why: 'Require a string with nonempty stripped form or ValueError Cloud storage bucket name is required. Trim
      it; reject any ://, ? or # with Cloud storage bucket name must not include a URI scheme or query; reject control
      characters with Cloud storage bucket name contains control characters. Split first slash into bucket and prefix,
      reject an empty bucket with the required message and any backslash in bucket with Cloud storage bucket name
      contains an invalid separator. Strip prefix outer slashes, validate it only when nonempty, and return bucket,prefix.
      Do not invent DNS/bucket-name or @/colon validation.'
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_configured_bucket_split$/)'
  - id: case-object-path-validation
    why: 'Validate object strings in this order: empty -> Cloud storage object name is required; leading slash ->
      Cloud storage object name must be relative; codepoint below32 or equal127 -> Cloud storage object name contains
      control characters; any slash-delimited dot/dot-dot segment or empty segment before the last -> Cloud storage
      object name contains an invalid path segment. A trailing slash, literal backslash, ?, # or still-percent-encoded
      component is accepted by this function.'
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_object_path_validation$/)'
  - id: case-cloud-object-encoding
    why: encode_gcs_object_name_for_url percent-decodes once then quotes with safe empty; encode_s3_object_key_for_url
      does the same with slash safe. Retain URI unreserved characters and Python unquote UTF-8 replacement behavior;
      double-encoded percent signs are not recursively decoded. Thus the GCS path encodes slashes while S3 preserves
      them.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_cloud_object_encoding$/)'
  - id: case-legacy-trusted-policy
    why: should_allow_legacy_cloud_file_ids reads only a MappingProxyType snapshot under _litellm_internal_model_credentials
      when outer params is a Mapping. Missing/untrusted snapshots and missing values yield False. A bool returns
      itself; a string is stripped/lowercased and true only for 1,true,yes,on; numbers including integer1 and every
      other value are False. Request JSON cannot manufacture the trusted snapshot and a top-level allow_legacy_cloud_file_ids
      value is ignored.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_legacy_trusted_policy$/)'
  - id: case-managed-id-authorization
    why: validate_managed_cloud_file_id percent-decodes file_id once. Require startswith the supplied scheme or
      ValueError file_id must be a {scheme} URI; require a slash in the remaining path or file_id must include a
      cloud storage object name. Split first slash, resolve configured bucket/prefix, and require exact bucket equality
      or file_id bucket does not match the configured storage bucket. Validate the object path next. Prefix each
      allowed object prefix with configured prefix plus slash when configured; any literal startswith match succeeds.
      Constants are VERTEX_AI_MANAGED_GCS_PREFIX=litellm-vertex-files/, and Bedrock ordered prefixes litellm-bedrock-files-,litellm-bedrock-files/,litellm-batch-outputs/.
      Preserve all these literals.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_managed_id_authorization$/)'
  - id: case-legacy-prefix-boundary
    why: If managed-prefix matching fails and allow_legacy_cloud_file_ids is truthy, accept the validated object
      when no configured prefix exists; otherwise require configured_prefix plus slash as a boundary or ValueError
      file_id object does not match the configured storage prefix. Without legacy opt-in raise file_id must reference
      a LiteLLM-managed storage object. Legacy mode never bypasses bucket, scheme or relative-path validation. An
      empty allowed-prefix sequence can succeed only through legacy behavior.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_legacy_prefix_boundary$/)'
  - id: case-encoded-traversal-order
    why: 'Decode only once before scheme/bucket/path checks: encoded slashes, dot segments and control characters
      are checked after that decoding, while %252e remains literal %2e and is not treated as dot. Errors from configured
      bucket validation precede object validation after URI splitting. Preserve source error order and no additional
      URL authority/query stripping.'
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_cases::case_[0-9]+_encoded_traversal_order$/)'
  - id: config-allow-legacy-cloud-file-ids
    why: allow_legacy_cloud_file_ids lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::cloud_storage_config_cases::case_[0-9]+_loads_allow_legacy_cloud_file_ids$/)'
  - id: parser-corpus
    why: Outside bytes lack replay through the actual decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-context/fuzz/corpus/cloud_object_path)"
      && grep -q 'decode_cloud_object_reference' crates/betterlite-context/fuzz/fuzz_targets/cloud_object_path.rs
      && cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::replays_the_cloud_object_path_corpus$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::cloud_storage_secret_safe_failure$/)'
  optional:
  - mutants
description: >-
  Implement the shared cloud-object naming and authorization helpers below S3/GCS providers and storage loggers.
  These helpers authorize provider-native object paths; they do not install the enterprise managed-files hook or
  fetch any object. Preserve the pinned string algorithms rather than applying an unrelated URL normalizer.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/litellm_core_utils/cloud_storage_security.py:
  constants L11-L21; is_managed_cloud_storage_uri L23-L31; sanitize_cloud_object_component L37-L50; sanitize_cloud_object_path
  L53-L65; build_managed_cloud_object_name L68-L70; _validate_cloud_object_path L73-L84; split_configured_cloud_bucket_name
  L87-L107; encode_gcs_object_name_for_url L110-L111; encode_s3_object_key_for_url L114-L115; should_allow_legacy_cloud_file_ids
  L118-L131; validate_managed_cloud_file_id L134-L167.


