  Load allow_legacy_cloud_file_ids through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest cloud_storage_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  allow_legacy_cloud_file_ids defaults False in trusted deployment settings; the loader preserves bool/string input
  for the source policy above, and B1021 snapshots it into the immutable deployment credential settings. Request
  values never acquire that trust. Add actual B002 loader cases for missing, bool, accepted/rejected strings and
  integer input; there is no environment variable for this flag.


  Outside-byte boundary: decode_cloud_object_reference consumes untrusted cloud-object URI text for the shared one-pass
  percent decoding and bucket/path authorization; dispatch the GCS/S3 encoder variants through the same production
  string routines in crates/betterlite-context/src/cloud_storage.rs or its scoped child module. Use that production
  decoder from the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-context/fuzz/fuzz_targets/cloud_object_path.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_cloud_object_path_corpus
  that checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Write standalone Rust test cloud_storage_credential_identity_isolation in betterlite-context: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test cloud_storage_secret_safe_failure in betterlite-context: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-context/src/cloud_storage.rs with adjacent tests under cloud_storage/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation cloud_storage in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function cloud_storage_cases in betterlite-context with these exact named cases (one per oracle file):
  cloud_uri_detection, object_component_sanitization, object_path_sanitization, configured_bucket_split, object_path_validation,
  cloud_object_encoding, legacy_trusted_policy, managed_id_authorization, legacy_prefix_boundary, encoded_traversal_order.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/cloud_storage* using HelperCase: kind: helper
  and the externally tagged cloud_storage variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_cloud_storage that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 118 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 180 production lines, 280 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 50 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 710 planned, 725 maximum changed lines.
