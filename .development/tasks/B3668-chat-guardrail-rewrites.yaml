id: B3668
title: Chat guardrail request and completed-response rewrites
description: >-
  Apply guardrails to scoped chat requests and completed responses, rewriting
  text and tool calls in original messages and response choices. Rebuild ended
  streams separately for each choice, refusing tool rewrites that cannot be
  faithfully delivered rather than silently emitting stale tool arguments.

  Implement message rewriting handlers: apply guardrail text responses and
  tool calls back to request messages by (msg_idx, content_idx) mapping,
  handling both string and list content. Apply guardrails to completed
  ModelResponse objects: extract text, images, and tool calls per choice,
  apply guardrail responses by choice index, and update message content
  in place.

  Support ended-stream reconstruction: gather all text from completed-stream
  responses grouped by choice, build standalone choice contents lists,
  detect undeliverable tool call rewrites and rebuild the full stream per
  choice as a sequence of delta chunks using stream_chunk_builder. Preserve
  stream order and choice indices while reconstructing response chunks.

scope:
  paths:
    - crates/betterlite-server/src/guardrails/chat_guardrail_translation/rewrites.rs
    - crates/betterlite-server/src/guardrails/chat_guardrail_translation/rewrites/**
  lint_tables: false

