    why: get_structured_messages and process_input_messages request processing with text and tool-call extraction and rewriting.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/chat/guardrail_translation/handler.py#L383-L488
