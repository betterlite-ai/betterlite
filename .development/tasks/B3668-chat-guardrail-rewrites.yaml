  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/chat/guardrail_translation/handler.py#L642-L713
    why: _process_ended_stream and _rebuild_ended_stream_per_choice for buffered response reconstruction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/chat/guardrail_translation/handler.py#L1087-L1197
    why: _string_choice_contents, _write_ended_stream_text_rewrites, _function_tool_call_shapes, _function_tool_call_fragments, _write_ended_stream_tool_call_rewrites for ended-stream text and tool call rewriting.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/chat/guardrail_translation/handler.py#L1199-L1279
    why: _apply_guardrail_responses_to_output_streaming for streaming response rewriting with choice-based handling.

dod:
  - text: >-
      process_input_messages extracts text content (string or list of text/image blocks),
      images, and tool-call function parameters from request messages, returning task index
      mappings for guardrail application. Calls guardrail.apply_guardrail with structured
      messages and tools when present.
    proof: [input-process-cases]
  - text: >-
      _apply_guardrail_responses_to_input_texts applies guarded text responses back to
      messages by (msg_idx, content_idx) mapping, handling both string content and
      list content items with proper index access.
    proof: [input-text-rewrite-cases]
  - text: >-
      _apply_guardrail_responses_to_input_tool_calls applies guardrailed tool_calls back
      to input messages by (msg_idx, tool_call_idx) mapping, replacing tool calls in place.
    proof: [input-tool-rewrite-cases]
  - text: >-
      process_output_response extracts text, images, and tool calls from completed response
      choices, applies guardrail to all extracted content, and rewrites response choices
      in place by choice index.
    proof: [output-process-cases]
  - text: >-
      _apply_guardrail_responses_to_output_texts applies text responses back to
      response.choices[choice_idx].message.content by (choice_idx, content_idx) mapping,
      handling string and list content types.
    proof: [output-text-rewrite-cases]
  - text: >-
      _apply_guardrail_responses_to_output_tool_calls updates response.choices[choice_idx].message.tool_calls
      with guardrailed function.arguments and function.name.
    proof: [output-tool-rewrite-cases]
  - text: >-
      _process_ended_stream gathers all text per choice from responses_so_far, detects
      undeliverable tool rewrites, and calls _rebuild_ended_stream_per_choice for each
      choice index present in the stream.
    proof: [ended-stream-gather-cases]
  - text: >-
      _rebuild_ended_stream_per_choice builds a sequence of ModelResponseStream chunks
      for a single choice_idx using stream_chunk_builder, applying text and tool rewrites
      from guardrailed outputs, preserving stream order and excluding undeliverable rewrites.
    proof: [ended-stream-rebuild-cases]
  - text: >-
      _string_choice_contents returns a list of (choice_idx, content) tuples where content
      is accumulated text per choice from responses_so_far, keyed by choice.index or 0.
    proof: [string-choice-cases]
  - text: >-
      _write_ended_stream_text_rewrites applies text rewrites to choice contents and
      uses stream_chunk_builder to emit text deltas per choice, blanking subsequent
      deltas after the first rewrite per choice.
    proof: [text-rewrite-stream-cases]
  - text: >-
      _function_tool_call_shapes returns a dict mapping choice_idx to a list of
      (tool_call_idx, function_name, arguments_len) tuples from responses_so_far per choice.
    proof: [tool-shapes-cases]
  - text: >-
      _function_tool_call_fragments returns undeliverable tool call rewrite reasons when
      guardrailed tool-call count, order or function names differ from the streamed shapes,
      or when argument lengths cannot be faithfully reconstructed across delta chunks.
    proof: [tool-fragments-cases]
  - text: >-
      _write_ended_stream_tool_call_rewrites applies guardrailed tool calls to stream
      events using stream_chunk_builder, skipping undeliverable rewrites with
      UndeliverableStreamRewrite reasons recorded.
    proof: [tool-rewrite-stream-cases]

