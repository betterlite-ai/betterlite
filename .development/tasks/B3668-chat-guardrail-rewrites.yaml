pitfalls:
  - >-
    process_input_messages requires pre-allocated lists for texts, images, and tool_calls
    that are mutated in place during extraction; callers must pass empty lists every call.
  - >-
    text_task_mappings appends (msg_idx, content_idx_or_none) where content_idx_or_none
    is None for string content and int for list[content_item] index; the None value is
    distinct from 0 and must be checked explicitly.
  - >-
    tool_call_task_mappings appends (msg_idx, tool_call_idx) with no optional element;
    all indices are int and correspond to pre-extraction list positions.
  - >-
    process_output_response filters content by choice index; choice.index may be None,
    which should default to 0 for indexing purposes.
  - >-
    _apply_guardrail_responses_to_output_texts may receive a guardrailed_texts list
    that is shorter or longer than text_task_mappings if the guardrail returns fewer
    or more texts than extracted; mismatch means the rewrite is unappliable.
  - >-
    _apply_guardrail_responses_to_output_tool_calls must verify that guardrailed tool
    calls match the number and order of extracted tool_calls; mismatches are silent
    no-ops and the original tool calls remain in the response.
  - >-
    _process_ended_stream operates on a completed stream where finish_reason is set;
    it gathers text per choice and detects tool rewrites that cannot be faithfully
    reconstructed across delta chunks.
  - >-
    _rebuild_ended_stream_per_choice uses stream_chunk_builder which maintains sequence
    state per choice; multiple choices must call it separately, not in parallel.
  - >-
    _string_choice_contents accumulates text from responses_so_far; if choice.index
    is None or missing, default to index 0 for accumulation.
  - >-
    _function_tool_call_shapes must match the streamed tool-call structure before
    determining deliverability; tool_call_idx, function.name and argument lengths
    must all match the pre-rewrite shape for a rewrite to be deliverable.
  - >-
    _write_ended_stream_text_rewrites applies text rewrites using stream_chunk_builder;
    the builder handles delta sequencing, but the rewrite must be applied to the choice's
    first text-carrying chunk and blanked in subsequent chunks.
  - >-
    Undeliverable tool-call rewrites are not silently dropped; UndeliverableStreamRewrite
    reasons must be recorded and returned alongside the rebuilt stream for logging.

