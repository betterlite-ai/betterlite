dod:
- text: >-
    No test in these crates frees a port it then expects to be refused, no local helper produces a bare dead
    address any more, and the four saturated-listener copies use FullListener.
  proof: [no-dropped-port, no-saturated-copies]
- text: The tests in every changed test module pass.
  proof: [lower-tests]
