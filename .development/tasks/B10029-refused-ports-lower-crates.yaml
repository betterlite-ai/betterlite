    run: '! git grep -h -B5 -E "drop\((listener|socket)\);" -- crates/betterlite-anthropic crates/betterlite-cache crates/betterlite-core crates/betterlite-db crates/betterlite-guardrails crates/betterlite-http crates/betterlite-logging crates/betterlite-openai crates/betterlite-prompts crates/betterlite-redis crates/betterlite-vertex | grep -F local_addr'
  - id: no-saturated-copies
    why: A test still builds its own saturated listener instead of FullListener.
    run: '! git grep -n -F ".listen(1)" -- crates/betterlite-anthropic crates/betterlite-cache crates/betterlite-core crates/betterlite-db crates/betterlite-guardrails crates/betterlite-http crates/betterlite-logging crates/betterlite-openai crates/betterlite-prompts crates/betterlite-redis crates/betterlite-vertex'
oracle_cases: []
deviations: []
out_of_scope:
- betterlite-server, betterlite-cli, betterlite and the oracle helpers; B10030 moves those.
- The code under test. Only how the tests get a refused or a hanging address changes.
- crates/betterlite-guardrails/src/cato/tests/cato_lifecycle/websocket.rs drops its listener after the one accept it needs; that is not this pattern.
pitfalls:
- '`let _ = RefusedPort::bind()` drops the guard on the same line. Bind it to a name that lives until the request has failed, for example `let refused = RefusedPort::bind().unwrap();`.'
- A helper that returned a bare address or URL has to hand the guard to its caller too, or the caller binds the guard and passes the address in. A returned SocketAddr or String alone is the old bug.
- If a site in scope drops a listener for another reason (it stops a server the test already used), it is not this pattern. Leave it, say so in the report, and the no-dropped-port check then needs the architect.
- A test that needs a hanging connect takes FullListener, one that needs a refused connect takes RefusedPort. Keep each test's meaning.
review_level: standard
budget:
  max_changed_lines: 250
  max_new_expects: 0
