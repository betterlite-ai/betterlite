id: B10029
title: Lower crates hold the ports they expect to be refused
description: >-
  Move the lower crates' tests onto the port guards from B10028. Tests in 41 files of anthropic, cache, core, db,
  guardrails, http, logging, openai, prompts and redis get a "dead" address by binding 127.0.0.1:0, reading the
  port and dropping the listener, then expect a connection to it to fail. Once dropped, the port is free, and any
  test that binds port 0 at the same moment, in the same process or another nextest process, can get it. The
  request then reaches that test's server: the first test sees an answer where it wanted a refused connection, and
  the other test loses the reply it queued. That is how fetches_userinfo_with_the_issued_bearer_token went red in
  https://github.com/betterlite-ai/betterlite/actions/runs/44835631936 (B10028 has the details), and every one of
  these sites can do the same to an unrelated test.


  Each site holds a betterlite_test_ports::RefusedPort for as long as the request may go out and uses its
  address. Most files wrap the pattern in a local helper (closed_port, dead_address, closed_base, closed_address,
  closed_endpoint, dead_url, dead_base, refused_base, unreachable_base, unused_base_url, unreachable_cache,
  offline_armor and others). A helper that only produced the dead address goes, and its callers hold the guard. A
  helper that also builds something (a config, a client, a guardrail) keeps that job and takes or returns the
  guard with it. The four copies of a saturated listener (crates/betterlite-core/src/api/container_file_endpoints/tests/support.rs,
  crates/betterlite-guardrails/src/openai_moderation/tests.rs, crates/betterlite-http/src/proxy/tests.rs,
  crates/betterlite-vertex/src/gemma_call/tests/status.rs) use betterlite_test_ports::FullListener. Each changed
  crate lists betterlite-test-ports under [dev-dependencies].
