    why: A test in a changed module broke.
    run: cargo nextest run --locked -p betterlite-anthropic -p betterlite-cache -p betterlite-core -p betterlite-db -p betterlite-guardrails -p betterlite-http -p betterlite-logging -p betterlite-openai -p betterlite-prompts -p betterlite-redis -p betterlite-vertex --no-tests=fail -E 'test(/^(akto::tests::transport|alice::tests|anthropic_http_stream::tests::ownership|api::container_file_endpoints::tests|api::eval_http::tests|api::interactions::lifecycle::tests::delete_calls|arize::phoenix::client::tests|cato::tests::actions|cisco_inspection::chat::tests|cisco_inspection::mcp::tests|cisco_inspection::transport::tests|codestral_call::tests::transport|compatible_embedding::tests|configuration::tests|copilot::device_auth::transport::tests|crowdstrike_aidr::tests|database_faults::native::tests|deepkeep::tests|gemma_call::tests::status|gigachat_tokens::tests::oauth_request|grayswan::grayswan_monitoring::tests::transport|grayswan::tests|health_probe::tests|interactions::agents_create_read::tests|interactions::agents_delete_versions::tests|interactions::create::tests|interactions::get::tests|interactions::lifecycle::tests|javelin::tests|media_fetch::tests|model_armor::hooks::tests|noma_v2::tests|openai_moderation::tests|panw_prisma_airs::tests::prisma_scan_error_classification|passthrough_stream::async_passthrough_request::tests|presidio_response::tests::presidio_response_post_call|proxy::tests|qohash::tests|redis_cache_admin::tests|redis_live_client::tests|repello_lifecycle::tests|singulr::tests|straiker::delivery::payload_delivery::tests|third_party_hooks_a::tests::akto_tests|zerobus::client::tests::zerobus)::/)'
  - id: no-dropped-port
