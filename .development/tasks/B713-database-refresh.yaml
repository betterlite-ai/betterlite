id: B713
title: Drain and replace native Postgres pool generations
description: >-
  Build betterlite-db::database_refresh with native PoolGeneration ownership, operation/transaction
  guards and serialized replacement. Reproduce the two different Prisma replacement paths: fault
  recovery stops the old generation before connecting its replacement, while token refresh connects
  a candidate before publishing it and drains the old generation afterward. Do not describe both as
  atomic or promise the old writer remains usable after failed fault recovery. Reuse B700 sessions
  and B712's auth descriptor; B854 supplies refresh behavior through an injected lower-layer port,
  never a reverse dependency from this pool service to B854.

  Constructor defaults are iam_token_db_auth=false, token_auth=None, db_url_env_var='DATABASE_URL',
  iam_endpoint=None, recreate_uses_datasource=false and log_prefix=''. An explicit strategy wins over
  the legacy boolean; true legacy IAM selects RDS. token_label falls back to 'database token' when
  disabled, and iam_token_db_auth reports any active strategy, including Azure. A nonempty prefix
  adds exactly one trailing space to log lines. Start generation at 0, no refresh task, no last-refresh
  time, no replacement callback and no retirement tasks. Native endpoints are typed snapshots rather
  than mutable process env, but preserve writer/reader selection supplied by the caller.

  Drain tracking begins empty and drained. Every query increments before dispatch and decrements in
  a finally-equivalent guard on success, error or cancellation. Starting a transaction holds one
  operation until its terminal commit/rollback; failed or cancelled begin releases it immediately.
  Queries within a transaction count separately. Commit and rollback add their own operation guard
  and release both it and the tracked transaction even when the database operation errors or is
  cancelled. Finishing an unknown transaction is a no-op and must not underflow. Re-instrumenting an
  already tracked client reuses the tracker; an unconnected/absent engine yields no tracker until
  connect succeeds. Connecting forwards an explicitly supplied timeout, omits None, and installs the
  tracker only after success.

  Expose a replacement lock shared by recovery and refresh. Recovery checks expected_generation only
  after acquiring it; a mismatch logs an info message naming current/expected generations and returns
  false without closing, connecting or invoking the callback. A matching or absent expectation closes
  the old generation immediately, constructs and publishes the replacement handle, then connects it.
  Only successful connection/instrumentation increments generation and calls the replacement callback.
  Connection failure leaves the new disconnected handle selected with the old generation number;
  there is no restoration of the stopped old pool. Return true after successful replacement. Native
  reader construction explicitly uses the passed URL; writer construction consumes the caller's
  resolved current writer URL, matching the source's env-vs-datasource distinction without global writes.
  Optional transport overrides are forwarded only when present.

  Token refresh, already holding the same lock, instead constructs a private candidate and connects
  it while the old pool stays active. Candidate failure or cancellation schedules candidate cleanup,
  propagates the failure and leaves the old handle/tracker/generation unchanged. On success install
  candidate tracker, publish handle, increment generation, invoke the callback, then schedule old-pool
  retirement. Callback invocation is synchronous even though the source comment says 'scheduled';
  the callback itself schedules its watcher. A callback error therefore occurs after publication and
  generation increment, before retirement scheduling, and must not be represented as a rolled-back
  swap. B854 owns restoring its credential snapshot when its enclosing refresh operation fails.

  Retire an old generation as soon as its tracker drains, or immediately when no tracker exists.
  ENGINE_RETIREMENT_DRAIN_TIMEOUT_SECONDS is 90. At the deadline warn that the replaced generation
  did not drain within 90s and is being closed with work still in flight, then close only that old
  generation. New work and its transactions must remain usable. Source PID<=0 schedules nothing;
  the native equivalent is an absent retired handle. Track retirement tasks until their completion
  callback removes them, and have the owner drain/cancel them during shutdown. The no-PID adaptation
  is recorded below, not a fake Prisma engine or OS process watcher.

  wait_for_planned_engine_replacement returns immediately when its timeout is <=0 or the lock is
  currently free. Otherwise it waits only for the lock to settle and silently returns on timeout;
  it does not assert success. Callers compare generation afterward. Cancelling that waiter does not
  cancel a replacement owned by another task. A failed replacement cannot increment the counter merely
  to silence the health watchdog.

  Preserve __getattr__'s caller-visible expired-token behavior through the injected refresh-trigger
  port: resolve the current operation handle first; absent attributes fail before refresh checks.
  With token auth disabled or a fresh token return it unchanged. With an expired token in an async
  request, warn that proactive refresh may have failed, schedule the locked refresh and return the
  stale handle immediately; the current request can fail and upper retry policy decides what follows.
  Do not await a refresh in this path or automatically retry its SQL. The sync compatibility caller
  warns, mints through the injected port, recreates, re-fetches the operation and logs completion;
  a falsey minted URL raises 'Failed to get {token_label}', and mint/recreate failures propagate.
  Token-enabled construction requires the port; it cannot install a success stub. Expose the sync
  operation to its SDK caller without blocking a Tokio runtime thread.

  Use B860 with POSTGRES_TEST_URL, otherwise testcontainers, for real concurrent queries and transactions.
  Distinguish a deliberately failed candidate connection from a stopped old generation, and assert
  which committed rows remain visible after each failure. Use an injected clock for the 90s deadline
  and barriers around connect/publish/callback to prove races. No helper oracle can model these pool
  lifecycle effects; tests run the actual native pools and use the pinned ordering as their contract.
  This task consumes parsed endpoints and has no additional config or byte decoder.

  The owned Python protocols, tracking, wrapper state, replacement and access paths total 327
  nonblank noncomment lines including docstrings. Allow 300 native tracking/replacement code,
  380 concurrency/Postgres tests and 45 wiring lines, 725 within 800. Separate tracking, replacement
  and access-trigger modules to stay below 300 lines per Rust file.
scope:
  paths:
    - crates/betterlite-db/src/database_refresh.rs
    - crates/betterlite-db/src/database_refresh/**
    - crates/betterlite-db/Cargo.toml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/prisma_client.py#L43-L139
    why: Drain accounting and finally blocks for query/begin/commit/rollback, including cancellation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/prisma_client.py#L167-L260
    why: Drain deadline, constructor defaults, token descriptor and tracker reuse.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/prisma_client.py#L282-L313
    why: Retirement warning/deadline, task cleanup and post-connect instrumentation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/prisma_client.py#L478-L644
    why: Distinct stop-first and connect-first replacement orders, generation guard and synchronous callback call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/prisma_client.py#L808-L871
    why: Async stale-handle return and separate synchronous expired-token fallback.
dod:
  - text: 'Tracking tests prove constructor_defaults, explicit_strategy_over_legacy_flag,
      azure_counts_as_token_auth, log_prefix_spacing, query_guard_on_error_and_cancel,
      transaction_pins_idle_generation, begin_failure_releases_guard,
      commit_failure_releases_transaction, rollback_cancel_releases_transaction,
      unknown_transaction_no_underflow, tracker_reused and connect_timeout_forwarding.'
    proof: [behavior-tests]
  - text: 'Replacement tests prove stale_generation_no_effects, competing_recoveries_coalesce,
      postgres_recovery_stops_old_before_connect, recovery_failure_keeps_counter,
      postgres_refresh_candidate_failure_preserves_old, refresh_cancel_cleans_candidate,
      refresh_publish_then_callback_then_retire, callback_error_after_publication,
      writer_snapshot_vs_explicit_reader_url, retirement_waits_for_transaction,
      retirement_timeout_warns_and_closes_old_only, missing_tracker_retires_immediately,
      completed_retirement_removed and shutdown_releases_retirements.'
    proof: [behavior-tests, postgres-tests]
  - text: 'Coordination/access tests prove wait_without_lock_returns, nonpositive_wait_returns,
      wait_timeout_is_not_success, failed_replace_has_no_generation_change,
      waiter_cancel_does_not_cancel_replace, missing_attribute_before_refresh,
      async_expired_access_schedules_and_returns_stale, fresh_access_no_refresh,
      sync_expired_access_refetches_after_recovery, sync_falsey_mint_exact_error,
      refresh_port_required and native_generation_logs_without_process_ids.'
    proof: [behavior-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Drain guards, race ordering and failure states must pass independently of connection smoke tests.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_refresh::tests::/)'
    - id: postgres-tests
      why: Failed recovery and failed token rotation intentionally leave different live database states.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_refresh::tests::postgres_recovery_stops_old_before_connect$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/database_refresh::tests::postgres_refresh_candidate_failure_preserves_old$/)'
oracle_cases: []
deviations:
  - what: Replaced database connections are identified by native pool generation in diagnostics; no
      prisma-query-engine PID, signal escalation, orphan reaper or expected-process-death set exists.
    why: SQLx has no subprocess. Preserve stop-first recovery, connect-first rotation and the 90-second
      old-work drain deadline through owned native tasks and connections.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/prisma_client.py#L262-L347
out_of_scope:
  - B854 owns _extract_token_from_db_url, _parse_token_expiration, _calculate_seconds_until_refresh,
    is_token_expired, get_rds_iam_token, _endpoint_from_env, start_token_refresh_task,
    stop_token_refresh_task, _token_refresh_loop, _safe_refresh_token and _token_refresh_not_needed.
    Their implementations are injected into this lower layer, not called through a dependency on B854.
  - B051 owns PrismaManager setup/replica-identity/partition checks and index-build entry points,
    plus should_update_prisma_schema. PrismaManager._get_prisma_dir is excluded by native migration setup.
  - _PrismaProcess, _get_engine_pid, _kill_engine_process and the process members of _PrismaEngine,
    _PrismaClient and _TrackedPrismaEngine are replaced by the native-generation deviation.
  - query_engine_reaper.py set_child_subreaper, _read_comm_and_ppid, list_orphaned_engine_pids,
    _try_reap, _send_signal, _await_reaped, terminate_and_reap, terminate_and_reap_all,
    reap_orphaned_engines, _reaper_loop and start_query_engine_reaper have no native process to supervise.
  - B124 owns proxy/utils.py's PrismaClient reconnect/watchdog and _handle_writer_engine_replaced
    callback; B715 owns bounded lookup orchestration and B714 reader routing. Their services consume
    this replacement port; the generation tracker does not import its callers.
pitfalls:
  - A failed ordinary recovery has already stopped the old client; only the token-refresh candidate path retains it.
  - commit_transaction releases its tracked transaction in finally even when COMMIT fails.
  - Returning from wait_for_planned_engine_replacement is not evidence that generation changed.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
