id: B713
title: Drain and replace native Postgres pool generations
description: >-
  Implement PoolGeneration, transaction tracking, compare-and-swap replacement and bounded drain on native
  SQLx pools. Replace Prisma engine/process inspection and orphan reaping with owned connection tasks;
  preserve the 90-second drain deadline and current/previous generation invariants. This service never
  mints tokens; DatabaseRefreshLoop supplies new credentials.


  Injected port instead of a reverse dependency on B854: CredentialRefresh::before_checkout(PoolGeneration)->Result<(),DbError>;
  B854 installs refresh without making the pool depend on its lifecycle owner. A configured but unregistered
  implementation is a named startup error, never a success stub.


  Build the production database_refresh module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/prisma_client.py:
  _PrismaEngine.process (L48-L48; 1 source lines), _PrismaEngine.query (L50-L50; 1 source lines), _PrismaEngine.start_transaction
  (L52-L52; 1 source lines), _PrismaEngine.commit_transaction (L54-L54; 1 source lines), _PrismaEngine.rollback_transaction
  (L56-L56; 1 source lines), _PrismaClient._engine (L63-L63; 1 source lines), _PrismaDrainTracker.__init__
  (L67-L71; 5 source lines), _PrismaDrainTracker.begin_operation (L73-L76; 4 source lines), _PrismaDrainTracker.end_operation
  (L78-L81; 4 source lines), _PrismaDrainTracker.transaction_started (L83-L84; 2 source lines), _PrismaDrainTracker.transaction_finished
  (L86-L90; 5 source lines), _PrismaDrainTracker.wait_until_drained (L92-L93; 2 source lines), _TrackedPrismaEngine.__init__
  (L97-L99; 3 source lines), _TrackedPrismaEngine.process (L102-L103; 2 source lines), _TrackedPrismaEngine.__getattr__
  (L105-L106; 2 source lines), _TrackedPrismaEngine.query (L108-L113; 6 source lines), _TrackedPrismaEngine.start_transaction
  (L115-L123; 9 source lines), _TrackedPrismaEngine.commit_transaction (L125-L131; 7 source lines), _TrackedPrismaEngine.rollback_transaction
  (L133-L139; 7 source lines), PrismaWrapper.__init__ (L169-L220; 25 source lines), PrismaWrapper.token_auth
  (L223-L225; 3 source lines), PrismaWrapper.token_label (L228-L230; 3 source lines), PrismaWrapper.iam_token_db_auth
  (L233-L239; 6 source lines), PrismaWrapper._read_engine (L242-L243; 2 source lines), PrismaWrapper._write_engine
  (L246-L247; 2 source lines), PrismaWrapper._instrument_prisma_client (L249-L260; 11 source lines), PrismaWrapper._retire_engine_when_drained
  (L282-L296; 15 source lines), PrismaWrapper._schedule_engine_retirement (L298-L303; 6 source lines),
  PrismaWrapper._retirement_finished (L305-L306; 2 source lines), PrismaWrapper.connect (L308-L313; 6
  source lines), PrismaWrapper.engine_generation (L479-L487; 8 source lines), PrismaWrapper._reconnection_settled
  (L489-L491; 3 source lines), PrismaWrapper.wait_for_planned_engine_replacement (L493-L508; 15 source
  lines), PrismaWrapper.recreate_prisma_client (L510-L546; 33 source lines), PrismaWrapper._recreate_prisma_client_locked
  (L548-L605; 39 source lines), PrismaWrapper._replace_prisma_client_for_token_refresh_locked (L607-L644;
  32 source lines), PrismaWrapper.__getattr__ (L808-L871; 52 source lines).


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 327 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  327 production, 151 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 508 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
