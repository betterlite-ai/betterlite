deviations:
  - what: "_premium_user_check is omitted and not called in async_log_success_event or async_log_failure_event."
    why: "Project policy removes paid-tier restrictions; all features are on."

out_of_scope:
  - "Any generic Azure credential provider or token cache beyond the two-part chain (service principal or identity) built directly here; those are provided by B673 and B677."
  - "Account-key SDK client pooling beyond the TTL lifecycle; the SDK manages connection pool internals."
  - "Monitoring or observability beyond verbose_logger calls and exception logging."
  - "_premium_user_check calls, stored-secret key derivation or enterprise feature gates."

pitfalls:
  - "AZURE_STORAGE_TENANT_ID, AZURE_STORAGE_CLIENT_ID and AZURE_STORAGE_CLIENT_SECRET are only required when AZURE_STORAGE_ACCOUNT_KEY is absent; present all three together or none to avoid a partially-configured state."
  - "Token expiry check uses a 5-minute margin (datetime.now() + timedelta(minutes=5) >= token_expiry); exactly matching the expiry time without margin will miss refreshes."
  - "The token path appends a newline to payloads (safe_dumps(payload) + '\\n'); the account-key path does not. These produce different files in cold storage."
  - "Dated directories (YYYY-MM-DD) are created on demand for account-key uploads; they persist across flushes and are never removed."
  - "The HTTP create operation uses ?resource=file parameter; the append and flush use ?action=append and ?action=flush respectively. Parameter order or missing parameters cause 400/403 errors."
  - "Cached clients expire after DEFAULT_TTL_FOR_HTTPX_CLIENTS (check constants); close and recreate them after expiry to avoid stale connections. The clock argument allows test injection."
  - "adls_safe_file_name returns IDs unchanged unless they are base64-like (start with 'resp_') or have problematic path segments (.., ., empty). Always adds .json extension."
  - "set_valid_azure_ad_token calls the credential-chain provider in a worker thread; that operation is blocking and may hit IMDS or run CLI subprocesses."
  - "When a per-event upload fails in async_send_batch's loop, the exception breaks the loop immediately; remaining payloads in the queue are not attempted in that flush cycle and only retry in the next cycle via CustomBatchLogger's queue preservation, not guaranteed delivery."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
