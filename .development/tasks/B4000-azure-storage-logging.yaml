id: B4000
title: Upload Azure Data Lake logs with account keys or Entra tokens
description: >-
  Implement Azure Blob Storage logging with dual authentication paths: account-key SDK uploads
  and Entra-token-based HTTP REST uploads. Build the logger on CustomBatchLogger, handling
  credential initialization, file lifecycle (create/append/flush), token refresh and client
  lifecycle management.

  Read AZURE_STORAGE_ACCOUNT_NAME, AZURE_STORAGE_FILE_SYSTEM (both required), AZURE_STORAGE_TENANT_ID,
  AZURE_STORAGE_CLIENT_ID, AZURE_STORAGE_CLIENT_SECRET, AZURE_STORAGE_ACCOUNT_KEY (optional) and
  AZURE_STORAGE_ENDPOINT_SUFFIX (default: core.windows.net) from B002. Use B256 for batch constructor
  and periodic-flush wiring; B173 for async HTTP PUT/PATCH; B192 for safe_dumps; B673 for
  Entra-token retrieval; B677 for the credential-chain provider. Logs inherit from CustomBatchLogger
  and queue StandardLoggingPayload.

  Two authentication paths run independently: when AZURE_STORAGE_ACCOUNT_KEY is set, use the Azure SDK
  DataLakeServiceClient to upload with dated-directory paths and no trailing newline; otherwise, use
  Entra tokens through HTTP REST to upload to a root directory with newline-terminated payloads.
  The token path caches the credential-chain token provider, checks expiry with a 5-minute margin,
  and refreshes by calling the provider in a worker thread. The account-key path creates clients on
  demand, caches them with a TTL matching the HTTP client TTL, closes expired clients and recreates
  them when needed.

  On success (async_log_success_event), queue the standard_logging_object. On failure
  (async_log_failure_event), also queue it; no other behavioral difference. File names use adls_safe_file_name
  (translate "/" to "_", drop base64 padding, reject ".." and empty path segments). Create operation
  uses x-ms-version header and Content-Length 0; append uses PATCH with action=append and position 0,
  data as UTF-8 JSON; flush uses PATCH with action=flush and position set to the byte count. Preserve
  the 3-step upload ordering and distinct bodies per path; omit _premium_user_check as per project policy.

