dod:
  - text: "AzureBlobStorageLogger initializes with environment variable validation, credential provider setup, batch state and periodic-flush wiring from B256."
    proof: [azure-init-test, azure-init-oracle]

  - text: "AZURE_STORAGE_ACCOUNT_NAME and AZURE_STORAGE_FILE_SYSTEM are required; missing either raises ValueError. Other env vars read with None defaults except AZURE_STORAGE_ENDPOINT_SUFFIX (default core.windows.net)."
    proof: [azure-env-test, azure-env-oracle]

  - text: "adls_safe_file_name sanitizes payload IDs by translating / to _, dropping base64 padding (=), and rejecting path segments that are '', '.', or '..'."
    proof: [azure-filename-test, azure-filename-oracle]

  - text: "Entra-token path sets token via set_valid_azure_ad_token, which caches the credential-chain provider, calls it in a worker thread, and refreshes 5 minutes before expiry."
    proof: [azure-token-refresh-test, azure-token-refresh-oracle]

  - text: "Account-key path uses DataLakeServiceClient, creates dated directories (YYYY-MM-DD), creates files, appends content, and flushes. Clients are cached with TTL and closed/recreated when expired."
    proof: [azure-account-key-test, azure-account-key-oracle]

  - text: "HTTP create operation uses x-ms-version header, Content-Length 0, and ?resource=file parameter. Append uses PATCH with action=append, position=0, and UTF-8 JSON body. Flush uses PATCH with action=flush and position set to byte count."
    proof: [azure-http-ops-test, azure-http-ops-oracle]

  - text: "async_log_success_event and async_log_failure_event both queue standard_logging_object without other behavioral difference. _premium_user_check is omitted as per project policy."
    proof: [azure-logging-test, azure-logging-oracle]

  - text: "async_send_batch iterates the log queue and calls async_upload_payload_to_azure_blob_storage per event. Queue is cleared after batch completion."
    proof: [azure-batch-test, azure-batch-oracle]

  - text: "When async_upload_payload_to_azure_blob_storage raises an exception during iteration in async_send_batch, the loop stops immediately and remaining queued payloads are not processed in that flush cycle. CustomBatchLogger's queue preservation allows retry in the next flush cycle."
    proof: [azure-batch-early-exit-test, azure-batch-early-exit-oracle]

