id: B063
title: Assemble OAuth, CLI and SAML login services
description: >-
  Assemble the completed SSO routers in betterlite-server::sso and expose them from the real
  proxy application. Supply one request-scoped view of current B002 settings, overlaid with
  B1646's RuntimeEnvironment snapshot for native SSO environment lookups, plus the existing
  DB, cache and outbound services; a management settings refresh must be visible to the next
  login without mixing two configurations inside one exchange. Keep each login's bearer
  material in its own provider instance and keep the CLI, PKCE and SAML cache namespaces
  separate. Compose the route owners rather than registering their paths again: B1628 owns
  GET /sso/key/generate; B1615 GET /sso/callback; B1613 POST /sso/cli/start and
  POST /sso/cli/complete/{login_id}; B1614 GET /sso/cli/poll/{key_id}; B1625 GET
  /sso/saml/login and /sso/saml/metadata; B1626 POST /sso/saml/callback; B1627 GET
  /sso/get/ui_settings, /sso/readiness, /sso/debug/login and /sso/debug/callback.
  Preserve authenticated versus public routing from those owners; no additional aliases are
  present at the pin. B1608's identity types cross service boundaries without reserializing
  secret-bearing values. Constructor wiring must support the open-source custom post-SSO
  callable through B165 while leaving the enterprise custom-UI handler unavailable.
  The old _raise_if_sso_exceeds_free_user_limit is deliberately absent under the no-paid-tier
  decision. The three custom-SSO example functions listed below have no reachable caller at
  the pin and add no product handlers. Test router composition, isolation of simultaneous
  provider logins, config refresh between logins, and a CLI flow followed by a browser login
  using B1630/B1631's real-proxy fixtures. loads_sso_service_snapshot verifies loaded provider
  settings reach the assembled graph; add its config_yaml seed without inventing new keys.
  Test a published SSO runtime overlay between requests and pin each in-flight exchange to
  the snapshot it began with; custom Python os.environ access retains B1646's stated limitation.
  This final part owns module/router composition and the omitted 19-line cap helper; all
  executable source functions are assigned below. Budget 180 composition/context, 220
  integration tests and 80 config/exports lines within 550; no new outside-byte parser is needed.
scope:
  paths:
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/src/sso.rs
    - crates/betterlite-server/src/sso/**
    - crates/betterlite-config/src/sso.rs
    - crates/betterlite-config/src/sso/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/sso-services-*
    - tools/oracle/cases/sso/services/**
    - tools/oracle/helpers/b063.py
    - tools/oracle/helpers/b063/**
    - tools/oracle/src/helpers/server/b063.rs
    - tools/oracle/src/helpers/server/b063/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/ui_sso.py#L977-L1127
    why: Original entrypoint composition and the removed five-user gate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/ui_sso.py#L2020-L2221
    why: OAuth versus SAML callback service boundaries and public routes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/custom_sso.py#L23-L46
    why: Unreferenced example callable, distinct from invoking operator-configured custom SSO.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/custom_hooks/custom_ui_sso_hook.py#L11-L38
    why: Example custom-UI handler whose invocation requires the excluded enterprise dispatcher.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_sso_handler.py#L9-L43
    why: Header-based custom-UI implementation with no reachable open-source caller.
dod:
  - text: All twelve SSO routes are composed exactly once with their intended public/authenticated boundaries.
    proof: [sso-composition-tests, oracle]
  - text: Provider credentials and cache namespaces stay isolated, and newly loaded settings apply on the next login.
    proof: [sso-composition-tests, sso-snapshot-config]
  - text: No free-user query or enterprise-only custom-UI execution enters the assembled service graph.
    proof: [sso-composition-tests, sso-snapshot-corpus]
checks:
  optional: [mutants]
  commands:
    - id: sso-composition-tests
      why: SSO composition duplicates a route, omits a service or shares login state incorrectly.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^sso::/)'
    - id: sso-snapshot-config
      why: The actual config loader's SSO snapshot does not reach the assembled services.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sso::tests::loads_sso_service_snapshot/)'
    - id: sso-snapshot-corpus
      why: The composed provider configuration has no newly added loader replay example.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/sso-services-*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/sso/services/route-auth-boundaries.yaml
  - tools/oracle/cases/sso/services/cli-then-browser-login.yaml
  - tools/oracle/cases/sso/services/provider-precedence-with-saml-configured.yaml
  - tools/oracle/cases/sso/services/password-fallback-keeps-return-target.yaml
deviations:
  - what: SSO composition never queries billable-user count to decide whether login is permitted.
    why: _raise_if_sso_exceeds_free_user_limit enforces a paid-tier ceiling that the README explicitly removes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/ui_sso.py#L977-L995
