pitfalls:
  - The log text mentioning /google-login/key/generate does not declare an alias; only /sso/key/generate is registered.
  - A user settings refresh must not mutate the OAuth client handling an already-started exchange.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
