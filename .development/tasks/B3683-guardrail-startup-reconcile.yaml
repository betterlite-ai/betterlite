dod:
  - text: reconcile_db_guardrails removes the held guardrails whose source is db and whose id is not in the given set, returns their ids, and never touches a config guardrail.
    proof: [reconcile-tests]
  - text: sync_guardrail_from_db returns None without an id, re-initializes on changed params, and for unchanged params keeps the callbacks and sets the source to db.
    proof: [sync-tests]
  - text: GuardrailRuntime holds the handler, the registry and the reconcile mutex, and sync_locked takes the mutex before the write lock.
    proof: [runtime-tests]
  - text: start_from_config starts the config guardrails in file order, logs and skips a rejected entry and a ValueError-class start failure, and stops startup on any other error.
    proof: [from-config-tests]
  - text: router_guardrail_list gives one entry per guardrail with name, id, guardrail, mode, api_key and api_base as held.
    proof: [router-list-tests]
  - text: poll_database syncs each active row, skips a bad row, reconciles the stale db entries, and leaves memory alone when the database read fails.
    proof: [poll-tests]
  - text: The legacy_guardrails section loads litellm_settings.guardrails with LiteLLM's defaults, keeps the last item per name in by_name, and rejects an unknown spec key.
    proof: [legacy-config-tests]
  - text: plan_legacy_callbacks and start_legacy_guardrails match LiteLLM on every oracle case and call the starter only when a callback is to start.
    proof: [legacy-plan-tests, oracle]
  - text: RegistryStarter implements LegacyCallbackStarter on B189's CallbackRegistry, so is_started sees a registered callback and start maps a RegistryError to StartupError::Legacy (test `guardrail_startup::tests::legacy_starter_registers_callbacks`).
    proof: [legacy-plan-tests]
  - text: The crate builds with the new tokio feature and the new section is wired into the config crate.
    proof: [crate-build]

checks:
  optional: [mutants]
  commands:
    - id: reconcile-tests
      why: reconcile removes a config entry, keeps a stale db entry or returns the wrong ids
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_startup::tests::reconcile_/)'
    - id: sync-tests
      why: sync rebuilds unchanged guardrails, skips changed ones or leaves the source as config
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_startup::tests::sync_/)'
    - id: runtime-tests
      why: sync_locked does not serialise with the poll or takes the locks in the wrong order
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_startup::tests::runtime_/)'
    - id: from-config-tests
      why: startup keeps a bad entry, aborts on a skippable one or hides the skip log
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_startup::tests::from_config_/)'
    - id: router-list-tests
      why: the router list loses a guardrail or a copied param
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_startup::tests::router_list_/)'
    - id: poll-tests
      why: a bad row stops the poll, or a failed read purges memory
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_startup::tests::poll_/)'
    - id: legacy-config-tests
      why: the legacy section misses a default, a key or the last-wins map
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::legacy_guardrails::/)'
    - id: legacy-plan-tests
      why: the legacy plan differs from LiteLLM in callbacks, args or the presidio rewrite
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_startup::tests::legacy_/)'
    - id: crate-build
      why: the new section or the tokio feature does not build
      run: cargo check --locked -p betterlite-guardrails -p betterlite-config --all-targets && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-guardrails/src/guardrail_startup crates/betterlite-config/src/sections/legacy_guardrails)"

deviations:
  - what: >-
      `IN_MEMORY_GUARDRAIL_HANDLER`, the registry instance and `GUARDRAIL_RECONCILE_LOCK` are fields of one `GuardrailRuntime` built at startup and shared by `Arc`, and the handler sits behind a `tokio::sync::RwLock`.
    why: Module-level state is forbidden in this codebase. LiteLLM readers take no lock, but Rust cannot share a mutable handler without one.
  - what: >-
      `init_guardrails_v2` returns the router guardrail list and the caller assigns it to the router. The entries have no `callback` field.
    why: A callback object is built by the guardrails crate, so the entry holds only the id and the router asks the runtime for the callback.
  - what: >-
      The default_on callbacks of the legacy path are passed on in the order of first appearance. LiteLLM passes `list(set)`, whose order changes between runs.
    why: A fixed order is the only stable choice, and no behavior depends on the set order.
  - what: >-
      The legacy path hands the callbacks to a `LegacyCallbackStarter` trait, and `starter.rs` implements it on B189's `CallbackRegistry`. Only the registration of named callbacks is ported.
    why: LiteLLM's `initialize_callbacks_on_proxy` (callback_utils.py) is not ported by B189 (merged), and the legacy default_on guardrails need only registration by name, so `starter.rs` does that on B189's registry.
  - what: >-
      A legacy spec with an unknown key fails the config load with a betterlite-config error, not a Python `TypeError` traceback at startup.
    why: The effect is the same (the proxy does not start) and the config crate reports load errors with the path.

out_of_scope:
  - "auto_router_compression.py in full (`suppressed_compression_guardrails`, `model_hop_compression_armed`, `AutoRouterCompressionPolicy`, `policy_from_litellm_params`, `policy_for_model`, `is_compression_guardrail`, `arm_pre_call`, `messages_for_routing` and the two context variables): B3546 owns it and its covers include the file. B3546 depends on this task for the runtime and the read-through lookup."
  - "registry_read_through.py (`_resync_guardrails`, `get_initialized_guardrail_with_read_through`): B8231. The call sites in proxy_server.py: B8384. They call `sync_locked` and `poll_database`."
  - "The routes that call `sync_guardrail_from_db` without the lock (guardrail_endpoints.py): B3684 to B3687. They take the handler write lock and call the method directly."
  - "initialize_callbacks_on_proxy in callback_utils.py beyond registration by name (the named enterprise and integration branches, custom imports, the prometheus mount): no task owns it. B189 owns the registry that `starter.rs` calls."
  - "reinitialize_guardrail, `_has_guardrail_params_changed`, `initialize_guardrail`, `delete_in_memory_guardrail` and the registry class: B3682."
  - "The legacy readers of `guardrail_name_config_map` (guardrail_helpers.py, lakera_ai.py): B3663 and B888 for the helpers, the Lakera task for lakera_ai.py. They read `config.sections.legacy_guardrails.by_name`."
  - "Router.guardrail_list and Router.get_available_guardrail: no task text owns them yet, see router_list.rs above (B162 holds Router.__init__ but has no task file)."

pitfalls:
  - "`reconcile_db_guardrails` only drops `db` entries, so a guardrail from the config file stays when the database has no row for it."
  - "`sync_guardrail_from_db` with unchanged params does not rebuild anything, but it sets the source to `db`, so a config guardrail whose id matches a DB row turns into a `db` guardrail and the next reconcile can remove it."
  - "`init_guardrails_v2` catches only `ValueError` and `TypeError`. The `hide-secrets` error is a plain `Exception`, so a config with that guardrail stops the proxy while a bad `mode` only skips the entry."
  - "The poll skips reconcile when the database read fails. Running it with an empty id set would delete every db guardrail from memory."
  - "In the legacy loop the presidio `logging_only` rewrite sits outside the `callback not in litellm.callbacks` test, so it also applies when presidio is already started."
  - "`callback_specific_params.update(...)` runs for every legacy item, default_on or not, and replaces whole top-level keys. Two items with args for the same callback keep only the later args."
  - "Two legacy items with one name both stay in `all_guardrails` and both feed the default_on callbacks. Only the name map keeps just the later one."
  - "`initialize_callbacks_on_proxy` is not called when no callback is to start, so `callback_args` is unused then."
  - "The router list copies `api_key` and `api_base` after the `os.environ/` replacement, so it holds the secret itself. `RouterGuardrail` must keep `api_key` as `SecretString` so Debug never prints it."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
