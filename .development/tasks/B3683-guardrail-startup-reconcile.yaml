id: B3683
title: Guardrail startup, database reconciliation and legacy guardrail config
description: >-
  Build what starts guardrails and keeps them in step with the database. It covers the reconciliation pair of litellm/proxy/guardrails/guardrail_registry.py (`reconcile_db_guardrails`, `sync_guardrail_from_db`), its two module-level objects (`IN_MEMORY_GUARDRAIL_HANDLER` and `GUARDRAIL_RECONCILE_LOCK`) and all of litellm/proxy/guardrails/init_guardrails.py. The auto router compression file (auto_router_compression.py) is not built here, see out_of_scope.

  Module-level state is forbidden, so the two objects become one value built at startup and passed to whoever needs it: `GuardrailRuntime<R: GuardrailRows>`. Types from B3682 (crates/betterlite-guardrails/src/guardrail_registry/) are used by name: `InMemoryGuardrailHandler`, `GuardrailRegistry`, `GuardrailRows`, `GuardrailCallback`, `GuardrailFactories`, `RegistryError`, `params_changed`. `Guardrail`, `GuardrailDefinitionLocation` (`db`, `config`) and the config `Settings` with `guardrails: Vec<Guardrail>` and `rejected: Vec<RejectedGuardrail>` are B3662's (betterlite-config, sections::guardrail_params). `GuardrailItem`, `GuardrailValue`, `CallbackArgs` and `default_enabled_roles` are B3660's (sections::guardrail_identity::item). Read those files for exact field names, and read B3682's error.rs for the `RegistryError` variants before you write code. Everything goes in crates/betterlite-guardrails/src/guardrail_startup.rs and guardrail_startup/, except the config section named below. Add the `sync` feature to the crate's `tokio` line (and `macros`, `rt` as dev features if tests.rs needs them).

  Files under guardrail_startup/, each below 300 lines: `error.rs`, `reconcile.rs`, `runtime.rs`, `from_config.rs`, `router_list.rs`, `poll.rs`, `legacy.rs`, `starter.rs`, `tests.rs`.

  `error.rs` holds `StartupError`, a thiserror enum: `Guardrail { guardrail_name: String, source: RegistryError }` (startup stops), `Legacy { message: String }` and `Database { source: RegistryError }`. No variant holds a parameter value, since the params carry keys.

  `reconcile.rs` adds two methods to `InMemoryGuardrailHandler` in an `impl` block of this module, using only its public methods. `reconcile_db_guardrails(&mut self, db_guardrail_ids: &BTreeSet<String>) -> Vec<String>`: collect the ids of the held guardrails whose `get_source` is `db` and that are not in the set, log each at info ("Reconcile: removing stale DB-backed guardrail '{id}' from memory (deleted in DB by another pod)"), call `delete_in_memory_guardrail` for each and return the ids in the order found. A `config` guardrail is never touched, even when its id is missing from the set. `sync_guardrail_from_db(&mut self, guardrail: Guardrail) -> Result<Option<Guardrail>, RegistryError>`: no `guardrail_id` logs the error "Cannot sync guardrail without guardrail_id" and returns `Ok(None)`. When `params_changed(self.get_guardrail_by_id(id), &guardrail)` is true, log at info "Guardrail '{name}' (ID: {id}) params changed, re-initializing..." and return `reinitialize_guardrail(guardrail, GuardrailDefinitionLocation::Db)`. Otherwise call `initialize_guardrail(guardrail, Db)`: the id is already held, so it builds nothing, rewrites the source to `db` and returns the held guardrail. That is exactly LiteLLM's "make sure the source marker reflects db" branch (a config entry whose id later collided with a DB row becomes `db`).

  `runtime.rs` holds `GuardrailRuntime<R: GuardrailRows>` with `new(handler: InMemoryGuardrailHandler, registry: GuardrailRegistry<R>)`, `handler(&self) -> &tokio::sync::RwLock<InMemoryGuardrailHandler>` and `registry(&self) -> &GuardrailRegistry<R>`. It also holds a private `tokio::sync::Mutex<()>`, LiteLLM's `GUARDRAIL_RECONCILE_LOCK`. The caller builds the handler with B3682's `InMemoryGuardrailHandler::new(factories, env, strict_modes, global_skip_tool_message)` once at startup and shares the runtime behind an `Arc`. Request code reads callbacks through `handler().read()`. LiteLLM readers take no lock, but Rust needs the RwLock for memory safety. The reconcile mutex only serialises writers of the poll and read-through paths, as in LiteLLM. `sync_locked(&self, guardrail: Guardrail) -> Result<Option<Guardrail>, RegistryError>` takes the mutex, then the handler write lock, and calls `sync_guardrail_from_db`. It is the body LiteLLM's `_resync_guardrails` (registry_read_through.py, owned by B124) runs after it has found the active row. Always take the mutex first and the write lock second, and never hold the write lock across an await on the database.

  `from_config.rs` holds `GuardrailRuntime::start_from_config(&self, settings: &guardrail_params::Settings) -> Result<Vec<RouterGuardrail>, StartupError>`, LiteLLM's `init_guardrails_v2`. First, each `settings.rejected` entry is logged at error as "Skipping guardrail '{guardrail_name}': invalid configuration, proxy is starting WITHOUT this guardrail: {reason}" (B3662 collects them while loading the file and leaves the log to this task). Then, for each guardrail in file order, take the write lock and call `initialize_guardrail(guardrail, Config)`. LiteLLM catches only `ValueError` and `TypeError` here, so the same split applies. These `RegistryError` variants are the ValueError ones: `Unsupported`, `MissingGuardrailType`, `ScanOnlyUnsupported`, `ScanOnlyWithSkipTool`, `Base` and `InitFailed`. They get the same error log line as above with the error text, and the loop continues. Any other variant (the `hide-secrets` missing enterprise package error is a plain `Exception` in LiteLLM) stops startup with `StartupError::Guardrail`. Collect the guardrails that came back, then return `router_guardrail_list` of them (see router_list.rs). LiteLLM only calls `init_guardrails_v2` when the config has a non-empty `guardrails` list and passes the router in. Here the caller (the startup code of B124) skips the call when the list is empty and hands the returned list to the router.

  `router_list.rs` holds `RouterGuardrail { guardrail_name: String, id: Option<String>, guardrail: String, mode: LitellmParamsMode, api_key: Option<SecretString>, api_base: Option<String> }` and `router_guardrail_list(guardrails: &[Guardrail]) -> Vec<RouterGuardrail>`, LiteLLM's `_populate_router_guardrail_list` minus the router assignment. One entry per guardrail in order, `guardrail_name` empty when the guardrail has none, and the four params copied from the guardrail as it is held (so an `os.environ/` api_key is already replaced). LiteLLM also stores the callback in the entry. The router side asks `GuardrailRuntime::handler()` by `id` instead, so it needs only this plain type and never the callback. No task text owns `Router.guardrail_list` or `get_available_guardrail` yet: B016 and B302 name neither, B086 only lists `get_available_guardrail` in a coverage line, and `Router.__init__` belongs to B162, and B162 has no task file. The router receives the list as a plain `Vec<RouterGuardrail>` from the startup code of B124. betterlite-guardrails does not depend on betterlite-router (checked in both Cargo.toml files), and betterlite-router has no internal dependencies at all, so the router crate never imports `RouterGuardrail`: betterlite-server imports it from here and the wave 17 guardrails wiring part hands the list to the router. Keep both true. The function logs at debug "Populated router guardrail_list with {n} guardrails".

  `poll.rs` holds `GuardrailRuntime::poll_database(&self)`, the body of `ProxyConfig._init_guardrails_in_db` in proxy_server.py (owned by B8384, which calls it every poll tick and once at startup). Under the reconcile mutex: read `registry().get_all_guardrails_from_db()`. If that fails, log the error and return, touching nothing, because a failed read must not purge memory. Otherwise, for each row, remember its id and call `sync_guardrail_from_db` under the write lock. A row that fails is logged at error as "skipping guardrail '{name}' (ID: {id}): {error}" and the loop continues. After the loop call `reconcile_db_guardrails` with the collected ids, under the write lock.

  `legacy.rs` holds the old `litellm_settings.guardrails` path, LiteLLM's `initialize_guardrails`. The config part is a new section `crates/betterlite-config/src/sections/legacy_guardrails.rs` and `legacy_guardrails/` (`Raw`, `Settings`, `impl Section for Raw`, `tests.rs`). It reads `litellm_settings.guardrails`, a list of maps from guardrail name to a spec: `callbacks` (required list of text), `default_on` (false by default), `logging_only` (null by default), `enabled_roles` (the three default roles when the key is absent, null when it is null, via B3660's `default_enabled_roles`) and `callback_args` (empty by default). A spec with any other key, or with its own `guardrail_name` key, fails the load, as LiteLLM's `GuardrailItem(**v, guardrail_name=k)` raises `TypeError` and the proxy does not start. Use `#[serde(deny_unknown_fields)]` on the spec. `Settings` has `items: Vec<GuardrailItem>` in file order (LiteLLM's `all_guardrails`) and `by_name: BTreeMap<String, GuardrailItem>` where a later item with the same name replaces the earlier one (LiteLLM's `litellm.guardrail_name_config_map`). Other crates read that map as `config.sections.legacy_guardrails.by_name`. A section for `litellm_settings.guardrails` is new, so config loading must no longer report it as `ConfigError::Unsupported`.

  In legacy.rs, `LegacyCallbackStarter` is a trait with `is_started(&self, callback: &str) -> bool` (LiteLLM's `callback in litellm.callbacks`) and `start(&mut self, callbacks: &[String], callback_args: &CallbackArgs) -> Result<(), StartupError>` (LiteLLM's `initialize_callbacks_on_proxy`, implemented in this task by `starter.rs`). `LegacyPlan { callbacks: Vec<String>, callback_args: CallbackArgs }` and `plan_legacy_callbacks(items: &[GuardrailItem], started: &dyn LegacyCallbackStarter) -> LegacyPlan` follow the loop in LiteLLM. Go through the items in order. For each, replace the top-level keys of `callback_args` with the item's `callback_args` (a shallow update, not a deep merge). If `default_on` is true, then for each callback: add it to `callbacks` when it is not started and not already listed, and, if `logging_only` is `Some(true)` and the callback is `presidio`, set `callback_args["presidio"]` to `{"logging_only": true}`, replacing whatever the user gave for presidio. The `presidio` rewrite runs even when presidio is already started. `start_legacy_guardrails(settings: &legacy_guardrails::Settings, starter: &mut dyn LegacyCallbackStarter) -> Result<(), StartupError>` builds the plan and calls `starter.start` only when `callbacks` is not empty. A failure is logged at error as "error initializing guardrails {error}" and returned as `StartupError::Legacy`. LiteLLM logs and re-raises, so the proxy stops.

  `starter.rs` holds `RegistryStarter<'a> { registry: &'a mut CallbackRegistry, flags: FeatureFlags }`, the only implementer of `LegacyCallbackStarter`. B189 is merged and does not port `initialize_callbacks_on_proxy`, so this task ports only the part the legacy default_on guardrails need, on top of B189's registry (`betterlite_logging::registry::CallbackRegistry`). `is_started` is true when `registry.list_identities(CallbackList::Callbacks)` holds an identity whose `class_name` equals the name (LiteLLM's `callback in litellm.callbacks`). `start` calls `CallbackRegistry::register_configured(name, &CallbackVars::new(), CallbackList::Callbacks, flags)` for each name in order (LiteLLM's `litellm.callbacks.extend(imported_list)`) and maps a `RegistryError` to `StartupError::Legacy` with its text. `Registration::AlreadyRegistered` and `SkippedCapacity` are not errors. The registry takes no per-callback args, so `callback_args` is not forwarded here and stays in the plan for the guardrail callbacks. Not ported: the named branches for compression_interception, websearch_interception, code_interpreter_interception, the enterprise hooks and custom `get_instance_fn` imports, the `prometheus` mount and the non-list `value` branch. Until B189's catalog installs an adapter for a name, `register_configured` returns `UnavailableAdapter` and startup stops, the way LiteLLM stops on a callback that fails to load. Add `betterlite-logging = { path = "../betterlite-logging" }` to this crate's Cargo.toml (betterlite-logging does not depend on betterlite-guardrails).

  Oracle: the helper operation for this task takes `function` (only `legacy_plan`), `guardrails` (the list as written in the config) and `started` (callback names already in `litellm.callbacks`). The Python side clears `init_guardrails.all_guardrails` and `litellm.guardrail_name_config_map`, sets `litellm.callbacks` to `started`, replaces `init_guardrails.initialize_callbacks_on_proxy` with a recorder and calls `initialize_guardrails(guardrails, premium_user=True, config_file_path="", litellm_settings={})`. Both sides answer `{"callbacks": [...], "callback_args": {...} or null, "by_name": {name: {"callbacks": [...], "default_on": bool, "logging_only": bool or null, "enabled_roles": [...] or null, "callback_args": {...}}}}`. `callbacks` is sorted, because LiteLLM builds it from a set, and `callback_args` is null when the recorder was never called. The Rust side parses the list with the section's own decoder and calls `plan_legacy_callbacks`. Cases: one default_on guardrail with callback args; a guardrail that is not default_on (its args are still collected, no callback starts); a callback that is already started; `logging_only` true with `presidio` and user args for presidio; two guardrails with the same name (the map keeps the second, both feed the plan); a spec without `enabled_roles`.

