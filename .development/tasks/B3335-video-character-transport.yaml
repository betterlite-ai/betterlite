oracle_cases: []
deviations:
  - what: Character creation forwards timeout to the HTTP POST call, while character lookup omits per-send timeout from GET despite both public functions accepting a timeout parameter.
    why: This mirrors LiteLLM's asymmetric timeout handling in the transport layer; the timeouts are set by the calling function, but only creation's HTTP call receives the timeout value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L7810
out_of_scope:
  - Character call orchestration and mocking (owned by B3341).
  - Provider-specific character request/response transformations (owned by B525 for OpenAI and B526 for OpenAI edits, B1362 for Vertex, B1364 for Gemini; others for their respective providers).
  - HTTP client lifecycle and pool policy (owned by B173).
  - Error conversion from HTTP responses (owned by B2402).
  - Pre-call logging beyond the call to logging_obj.pre_call (owned by B249).
  - Character ID encoding and decoding for proxy routing (owned by B672).
pitfalls:
  - Character creation uses multipart form data (files parameter in httpx.post) while lookup uses query parameters. Ensure file handling is correct for creation and params handling for lookup.
  - Character lookup omits timeout from the HTTP GET call (no timeout parameter passed to sync_httpx_client.get or async_httpx_client.get), even though the public function accepts timeout; do not add it.
  - Character creation forwards timeout to the POST call; preserve this distinction from lookup.
  - Both sync handlers must check _is_async flag and return the result of calling their async counterpart when True.
  - Client type checking must distinguish HTTPHandler from AsyncHTTPHandler using isinstance, not None checks, since both are Optional and fallback clients differ by type.
  - Both handlers call logging_obj.pre_call with input=character_id (for lookup) or input=name (for creation), additional_args with api_base and headers.
  - transform_video_create_character_request returns a tuple (url, files_list); transform_video_get_character_request returns a tuple (url, params).
  - Response conversion happens after raise_for_status() in both sync and async variants.
review_level: standard
