id: B3335
title: Video character transport
description: >-
  Implement character creation and retrieval handlers in betterlite-core for multipart character creation and character lookup.
  Both operations support sync and async variants through a dispatcher pattern that returns a coroutine when _is_async=True.
  Character creation submits multipart form data with name and video file, forwards the timeout parameter to the HTTP POST call,
  and invokes the response transform after status checking. Character lookup retrieves a character by ID via GET, omits the per-send
  timeout from the HTTP call despite the public function accepting one, and invokes the response transform after status checking.
  Client selection uses _get_httpx_client for sync (with ssl_verify from litellm_params) and get_async_httpx_client for async,
  falling back to provided clients when given. Both handlers validate the environment, retrieve the API base URL, invoke pre_call logging,
  and use _handle_error for exception handling.
