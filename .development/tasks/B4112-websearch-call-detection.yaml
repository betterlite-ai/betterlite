id: B4112
title: Detect intercepted search calls in three response formats
description: >-
  Build crates/betterlite-websearch/src/call_transformation.rs and its tests to detect
  WebSearch tool calls intercepted in three response formats: Anthropic (tool_use blocks
  in content), OpenAI Chat Completions (tool_calls nested in message), and Responses API
  (function_call items in output). Transform model responses to extract search queries,
  and transform search results back into the wire format each API expects.

  The core interface is WebSearchTransformation with two entry points:
  - `transform_request(response, stream, format)` takes a model response and returns
    `(has_websearch, tool_calls)` where tool_calls is a list of dicts with id, name,
    input/arguments and (for OpenAI) the nested function dict.
  - `transform_response(tool_calls, search_results, format)` takes the search results
    and returns `(assistant_message, user_or_tool_messages)` shaped for each format.

  For Anthropic format: detect tool_use blocks where name matches litellm_web_search or
  web_search, extract id and input dict. Transform back builds an assistant message with
  tool_use blocks and a user message with tool_result blocks, each result's tool_use_id
  matching a call's id. Preserve thinking blocks (prepend them to assistant_content before
  tool_use blocks when present).

  For OpenAI format: detect function-type tool_calls in message.tool_calls where
  function.name matches litellm_web_search or web_search; handle both dict and object
  responses. Arguments may be a JSON string or dict; normalize to dict. Transform back
  builds an assistant message with tool_calls and separate tool role messages, each
  tool message's tool_call_id matching a call's id. Convert function arguments to JSON
  string for the wire.

  For Responses API format: detect function_call items in output where type matches
  function_call and name matches litellm_web_search; handle both dict and object items.
  Arguments may be a JSON string or dict; normalize to dict. Do not detect native
  Anthropic types (web_search_20250305, web_search_preview_*) here — that belongs to
  is_web_search_tool_responses in B4111. Transform back is not used by Responses API
  since it sends tool results via a separate payload shape.

  Streaming requests are pre-converted to non-streaming by async_log_pre_api_call before
  transform_request sees them, so a stream flag of true here is unexpected (warn and
  return false, []).

  Helper functions build Anthropic native web_search_tool_result blocks, error blocks,
  and handle outcome matches (SearchSucceeded, SearchFailed). search_error_code maps
  exceptions to error codes. build_web_search_tool_result_block takes a tool_use_id and
  optional SearchResponse, returns a typed block with url, title, page_age, encrypted_content
  empty, and snippet from each result. Emit these blocks only when sending a native
  response format response (not for Chat Completions or Responses API).

  Search outcome helpers convert exceptions to SearchFailed blocks with error codes
  (RateLimitError → too_many_requests, BadRequestError → invalid_tool_input, others →
  unavailable). format_search_response converts a SearchResponse to text for tool_result
  content, formatting as "Title: ...\nURL: ...\nSnippet: ..." per result.

  Write oracle cases under tools/oracle/cases/chat/ for each format and common scenarios:
  - Anthropic tool_use detection and response transform
  - OpenAI tool_calls detection and response transform
  - Responses API function_call detection (transform back is not needed)
  - Streaming pre-converted to non-streaming
  - Multiple search calls in one response
  - Invalid or missing arguments
  - Responses without WebSearch calls (detect returns false)

  Create test cases for all three formats with the core detection and transformation
  logic verified against LiteLLM's behavior.

