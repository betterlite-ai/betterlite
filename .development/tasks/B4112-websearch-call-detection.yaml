deviations:
  - what: >-
      betterlite returns (has_websearch: bool, tool_calls: Vec<...>) from transform_request,
      while LiteLLM returns a tuple of (bool, list[dict]). The values are semantically identical;
      the type is idiomatic to Rust.
    why: Rust requires explicit return types; Python uses implicit tuples.
  - what: >-
      Thinking blocks in Anthropic responses are preserved as a list prepended to assistant_content
      before tool_use blocks, matching LiteLLM's order when extended thinking is enabled.
    why: The Anthropic API requires thinking blocks to come first.
  - what: >-
      When format_search_response encounters a SearchResponse without results, it returns
      the result object as a string, matching LiteLLM's fallback behavior.
    why: Graceful handling of partial or missing structured data.

out_of_scope:
  - 'litellm/integrations/websearch_interception/transformation.py: B4113 owns search_outcome (L506-518)
    and search_outcome_text (L520-528).'
  - SearchResponse contract and search execution logic.
  - Native Anthropic web_search_* type detection (owned by B4111).
  - Actual search execution via litellm.asearch.
  - Integration with agentic loop callbacks and async logging.
  - Passthrough of WebSearch calls that don't match interception patterns.

pitfalls:
  - Streaming requests are pre-converted to non-streaming before this code runs. A stream=true
    flag is a guard to protect against future API changes; log a warning and return false.
  - Arguments in OpenAI responses may be a JSON string or already a dict; always normalize to dict
    for internal use and back to JSON string for the wire.
  - The Responses API does not receive a transform_response call; its payload shape is handled elsewhere.
  - Thinking blocks (type "thinking" or "redacted_thinking") must be prepended to the assistant
    message's content list before tool_use blocks when present, required by the Anthropic API.
  - build_web_search_tool_result_block takes an optional SearchResponse; emit an empty items list
    (valid block with no results) when None, signaling "search ran, no results" not "search did not run".
  - encrypted_content is always empty in result blocks; snippet carries the text. This is a deviation
    from the Anthropic spec that requires encrypted_content but does not leak it, so betterlite carries
    snippet as plaintext for the agentic loop's follow-up use.

review_level: standard
budget:
