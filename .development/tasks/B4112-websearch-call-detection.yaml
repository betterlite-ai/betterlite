dod:
  - text: >-
      Every Anthropic format case (tool_use detection, response transform, thinking blocks)
      matches LiteLLM. Detection finds id, name, and input dict; transform builds assistant
      with tool_use blocks and user message with tool_result blocks.
    proof: [websearch-anthropic-oracle, websearch-tests]
  - text: >-
      Every OpenAI Chat Completions case (tool_calls detection, response transform,
      multi-call, invalid arguments) matches LiteLLM. Detection finds id, nested function.name
      and arguments (JSON string or dict); transform builds assistant with tool_calls and
      separate tool messages.
    proof: [websearch-openai-oracle, websearch-tests]
  - text: >-
      Every Responses API case (function_call detection, multi-call, no native type matching)
      matches LiteLLM. Detection finds id, type, name and arguments.
    proof: [websearch-responses-oracle, websearch-tests]
  - text: >-
      Responses without WebSearch calls are detected as false on all three formats.
      Detection returns (false, []) for non-streaming responses without the tool.
    proof: [websearch-no-tool-oracle, websearch-tests]
  - text: >-
      Streaming responses log a warning and return (false, []) without processing.
    proof: [websearch-tests]
  - text: >-
      Helper functions build Anthropic web_search_tool_result blocks with url, title,
      page_age and snippet per result, encrypted_content empty. Error blocks carry error_code
      and web_search_tool_result_error type.
    proof: [websearch-result-blocks, websearch-tests]
  - text: >-
      search_error_code maps RateLimitError to too_many_requests, BadRequestError to
      invalid_tool_input, others to unavailable.
    proof: [websearch-error-codes, websearch-tests]
  - text: >-
      format_search_response converts SearchResponse results to text with
      "Title: ...\nURL: ...\nSnippet: ..." format per result.
    proof: [websearch-format-response, websearch-tests]

checks:
  optional: []
  commands:
    - id: websearch-tests
      why: detection, transform or helper tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/call_transformation/)'
    - id: websearch-anthropic-oracle
      why: Anthropic format cases fail against LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/chat)" &&
        cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/chat/websearch-anthropic-*.yaml
    - id: websearch-openai-oracle
      why: OpenAI format cases fail against LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/chat)" &&
        cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/chat/websearch-openai-*.yaml
    - id: websearch-responses-oracle
      why: Responses API format cases fail against LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/chat)" &&
        cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/chat/websearch-responses-*.yaml
    - id: websearch-no-tool-oracle
      why: non-WebSearch response cases fail against LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/chat)" &&
        cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/chat/websearch-no-tool-*.yaml
    - id: websearch-result-blocks
      why: web_search_tool_result block builders do not exist or fail tests
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/result_block/)'
    - id: websearch-error-codes
