dod:
  - text: Detection request to /guardrails/policy/detect includes Content-Type, apikey header, and optional x-enkrypt-policy.
    proof: [oracle]
  - text: Response parsing correctly identifies toxicity (non-empty list), policy_violation/pii/keyword/bias (value=1), and extracts details for each attack type.
    proof: [oracle]
  - text: Status determination returns "success" when no attacks detected, "guardrail_intervened" when attacks found, "guardrail_failed_to_respond" on exception or malformed response.
    proof: [enkryptai-tests]
  - text: Error message formatting includes policy/explanation for policy violations, pii dict for PII, toxicity scores >0.5 for toxicity, detected_keywords for keyword_detected, bias_detected for bias.
    proof: [enkryptai-tests]
  - text: Unified text-batch evaluation calls the detection API once per text in inputs.texts and raises error if any text has attacks detected.
    proof: [oracle]
  - text: Standard logging guardrail information is recorded on both success and HTTP failure paths with guardrail_provider, response JSON, status and timestamps.
    proof: [enkryptai-tests]
  - text: Configuration loads api_key (required, ENKRYPTAI_API_KEY env), api_base (optional, default https://api.enkryptai.com, ENKRYPTAI_API_BASE env), policy_name (optional).
    proof: [enkryptai-tests, config-load]
checks:
  optional: []
  commands:
    - id: enkryptai-tests
      why: the enkryptai guardrail tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails -p betterlite-server --no-tests=fail -E 'test(/enkryptai_guardrail/)'
    - id: config-load
      why: the EnkryptAI configuration does not load from files or environment
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/enkryptai.*config/)'
