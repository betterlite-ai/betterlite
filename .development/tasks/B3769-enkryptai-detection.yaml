id: B3769
title: EnkryptAI detection and unified evaluation
description: >-
  Implement EnkryptAI guardrail's detection request to /guardrails/policy/detect, structured response
  parsing for summary (toxicity, policy violations, PII, keyword detection, bias, injections, jailbreak)
  and details, status determination, and formatted error messages from detected attacks. Build the unified
  text-batch evaluation for apply_guardrail, handling multiple texts in a single request loop.


  Configuration carries api_key (required, reads ENKRYPTAI_API_KEY), api_base (optional, default
  https://api.enkryptai.com, reads ENKRYPTAI_API_BASE), policy_name (optional, sent via x-enkrypt-policy
  header if set). Additional fields in the config model (deployment_name, detectors, block_on_violation)
  are present but not used to modify the outgoing detection call at this pin; B107 owns any wiring of
  those toggles to the detection behavior. HTTP headers include Content-Type (application/json), apikey
  (the API key value, not Bearer), and x-enkrypt-policy (if policy_name is set).


  Response parsing extracts the summary dict with keys like toxicity (empty list or list of types),
  policy_violation/pii/keyword_detected/bias/prompt_injection/jailbreak (0 or 1), and the details dict
  grouping per-attack-type metadata. Toxicity is detected when the list is non-empty; others when the
  integer is 1. Status determination returns "success" (no attacks detected), "guardrail_intervened"
  (attacks found), or "guardrail_failed_to_respond" (exception or malformed response). Error messages
  format detected attacks with their details: policy violations include policy and explanation, PII
  includes the pii dict, toxicity includes toxicity scores above 0.5, keywords and bias include their
  fields as found, and unknown attacks use their full details dict.


  On both success and HTTP failure paths, _call_enkryptai_guardrails writes standard logging guardrail
  information to request_data via add_standard_logging_guardrail_information_to_request_data (from B3664)
  with the guardrail_provider, raw response/error JSON, guardrail_status (mapped via _determine_guardrail_status
  on success; literal "guardrail_failed_to_respond" on HTTP failure), and timestamps with duration.
