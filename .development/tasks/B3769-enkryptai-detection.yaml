    why: The complete EnkryptAIGuardrails class with __init__, _call_enkryptai_guardrails, _process_enkryptai_guardrails_response, _determine_guardrail_status, _create_error_message, apply_guardrail, get_config_model and get_supported_event_hooks.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/enkryptai.py
    why: The EnkryptAIGuardrailConfigModel and all response/detail TypedDicts for parsing the API response.
