deviations:
  - what: EnkryptAI error messages use betterlite's own wording when attacks are detected, not LiteLLM's exact ValueError text.
    why: Error messages are betterlite's own per rule errors-match-litellm, and ValueError exceptions are resurfaced with custom formatting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L232-L268
out_of_scope:
  - Lifecycle hook entry points (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook, async_post_call_streaming_iterator_hook wrapper logic);
    B107 orchestrates when EnkryptAI guardrails are invoked.
  - The threshold-based decision whether to run EnkryptAI on a particular request; B219 and other tasks handle that.
  - Whether to actually block when block_on_violation is set or when detectors dict enables/disables specific checks; those toggles remain unobserved at this pin.
  - The deployment_name field and X-Enkrypt-Deployment header wiring; declared but not used in the detection call at the pinned code.
  - Other guardrail providers (Cisco, AIM, etc.); each gets its own task.
pitfalls:
  - The summary key toxicity is a list, not an integer; detect it by checking list length > 0, not value == 1.
  - The policy_name/x-enkrypt-policy header is optional and must only be sent when policy_name is set; do not send empty string.
  - Error message formatting for toxicity must only include scores > 0.5, not all scores returned by the API.
  - Configuration api_base must be preserved as-is; do not strip protocols or convert http:// to https://.
  - ENKRYPTAI_API_KEY must never be logged or shown in Debug output; mark the field as SecretString and use it only in the apikey header.
  - Multiple texts in apply_guardrail must each call the detection API independently, not batched into a single payload.
  - Malformed or non-dict responses must return "guardrail_failed_to_respond", not raise an exception.
review_level: security
budget:
  max_changed_lines: 700
  max_new_expects: 1
