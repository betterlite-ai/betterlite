deviations:
  - what: The response-body JSON decoder in _check_bedrock_response_for_exception uses Rust's serde_json parser, which may behave differently on invalid UTF-8 sequences or deeply nested structures than Python's json module.
    why: Rust's standard library has different error handling semantics; the fallback to false on any decode error preserves the source's safe behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2100-L2118
out_of_scope:
  - CustomGuardrail base class and add_standard_logging_guardrail_information_to_request_data method in litellm/integrations/custom_guardrail.py, owned by B164.
  - Recursive redaction via redact_nested_match_and_regex_keys in litellm/litellm_core_utils/core_helpers.py, owned by B104; the calling site _redact_assessment_match_fields requires this function.
  - ModifyResponseException construction in litellm/integrations, owned by B104; the calling site _get_http_exception_for_blocked_guardrail requires this wire type.
  - The ApplyGuardrail and InvokeGuardrailChecks request/response records are B3720's responsibility.
  - Chunking, splitting and content merging are B3720's responsibility.
  - Message selection and masking are B3721's responsibility.
  - Transport, signing and error parsing are B3723's responsibility.
pitfalls:
  - The response-body JSON fallback must try json() first, then content with UTF-8 decode, then text with UTF-8 decode, and return false on any exception rather than panicking.
  - "Bedrock can return explicit JSON null in assessments fields; use `.get(key) or []` not `.get(key, [])` to distinguish null from missing."
  - "The output text may contain multiple entries; loop through outputs and concatenate all text fields, not just the first."
  - Violation category names must skip entries that only carry a match field (bare customWords without a name, unnamed regexes), preserving only labeled categories.
  - "The __type field may contain the word Exception but not at the top level; look for it only inside Output.__type."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
