id: B3722
title: Bedrock guardrail decisions and usage tracing
description: >-
  Build guardrail-block classification that distinguishes BLOCKED from ANONYMIZED
  actions, sanitized assessment details for HTTP error responses, and one
  logical-call telemetry record that accumulates usage across chunked content
  and preserves cost via B1667's pricing functions. When the Bedrock response
  carries an AWS exception marker inside Output.__type at HTTP 200, treat that
  as a technical failure, not a policy intervention. When disable_exception_on_block
  is true, return a ModifyResponseException with the guardrail's suggested
  replacement output text; otherwise return HTTPException with a 400 status,
  the guardrail identifier, version, and sanitized blocked assessments.

  Implement _redact_assessment_match_fields to redact match/regex fields from
  assessment lists before returning them to clients, preserving policy labels
  and metadata. Implement _should_raise_guardrail_blocked_exception to walk all
  assessment policies and return true only when any BLOCKED action is found;
  ANONYMIZED and NONE actions do not raise an exception. Implement
  _extract_blocked_assessments to emit a flat list of {policy, matches} dicts
  from the response's assessment tree, selecting only BLOCKED entries and
  retaining category, type, action, name, match and score fields where present.

  Implement _extract_violation_category_names to collect only non-sensitive policy
  labels (topic name, content-filter type, PII entity type, named-regex name) for
  telemetry attributes, never raw match content. Implement _check_bedrock_response_for_exception
  to detect the AWS exception marker by trying response.json(), then content/text
  fallbacks with UTF-8 decode and JSON parse, returning false on any decode error.
  Implement _get_bedrock_guardrail_response_status to map HTTP 200 with exception
  to "guardrail_failed_to_respond", HTTP 200 with BLOCKED action to
  "guardrail_intervened", HTTP 200 with no intervention to "success", and all
  other status codes to "guardrail_failed_to_respond".

  Implement _build_tracing_detail to emit violation_categories, guardrail_action,
  guardrail_usage, guardrail_cost and guardrail_cost_by_unit fields by calling
  _extract_violation_category_names and _usage_tracing_detail, skipping empty maps.
  Implement _usage_tracing_detail to call bedrock_guardrail_cost_by_unit with
  usage units and region, returning guardrail_cost_by_unit, guardrail_usage and
  guardrail_cost from B1667's guardrail_cost_total. Implement the three logging
  functions to add tracing details to request_data and call the unresolved
  CustomGuardrail.add_standard_logging_guardrail_information_to_request_data with
  status, duration and end time. _log_apply_guardrail_attempt sums completed_chunk_usages
  before the block into one consolidated cost record. _log_apply_guardrail_success
  preserves the merged response's embedded exception marker when deciding status.
  _log_apply_guardrail_failure sums any billed usages and wraps the error detail
  in an error key.

  Implement _get_http_exception_for_blocked_guardrail to extract output text from
  the response's outputs array, returning ModifyResponseException when
  disable_exception_on_block is true or HTTPException with 400 status, "Violated guardrail policy"
  error, guardrail_response with the output text, and redacted assessments from
  _extract_blocked_assessments when present. The error-body JSON fallback inside
  _check_bedrock_response_for_exception is a real decoder to fuzz, so it lives
  here as-is, attempting to parse content/text with UTF-8 and JSON without
  intermediate buffering.
