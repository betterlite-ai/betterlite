  commands:
    - id: bedrock-decision-behaviors
      why: Bedrock decision classification, status mapping or logging tests are missing, skipped or fail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/::bedrock_decision_behaviors(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: bedrock-decision-boundaries
      why: Response parsing, exception detection or error-handling boundary tests are missing or fail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/::bedrock_decision_boundaries(::|$)/) - test(/replays_the_.*_corpus/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b3722.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: bedrock-decisions-fuzz-corpus
      why: The bedrock_decisions helper fuzz target or its corpus is missing, or replaying the corpus fails
      run: grep -rlq 'bedrock_decisions:' tools/oracle/fuzz/corpus/helper_case/bedrock-decisions-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: bedrock-decisions-oracle
      why: Oracle cases exercising decision classification, status mapping and exception construction are missing or fail
      run: test -d tools/oracle/cases/helpers/bedrock-decisions && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/bedrock-decisions)" && cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/bedrock-decisions
