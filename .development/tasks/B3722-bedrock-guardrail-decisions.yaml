dod:
  - text: "_should_raise_guardrail_blocked_exception returns true only when action is GUARDRAIL_INTERVENED and at least one BLOCKED action is found in assessments; ANONYMIZED and NONE actions return false."
    proof: [bedrock-decision-behaviors, bedrock-decisions-oracle]
  - text: "_extract_blocked_assessments walks all policy types and emits BLOCKED entries with policy, category, type, action and optional match/name/score fields, preserving customWords and managedWordLists structure."
    proof: [bedrock-decision-behaviors, bedrock-decisions-oracle]
  - text: "_extract_violation_category_names collects non-sensitive labels only (name/type), never raw match content, skipping entries without names."
    proof: [bedrock-decision-behaviors, bedrock-decisions-oracle]
  - text: "_check_bedrock_response_for_exception detects AWS exception markers in Output.__type by trying json(), content/text fallbacks and UTF-8 decode, returning false on any parse error."
    proof: [bedrock-decision-boundaries, bedrock-decisions-fuzz-corpus]
  - text: "_get_bedrock_guardrail_response_status maps 200 with exception to failed, 200 with BLOCKED to intervened, 200 with no intervention to success, and non-200 to failed."
    proof: [bedrock-decision-behaviors, bedrock-decisions-oracle]
  - text: "_build_tracing_detail and _usage_tracing_detail emit violation_categories, guardrail_action, guardrail_usage, guardrail_cost and guardrail_cost_by_unit, skipping empty maps."
    proof: [bedrock-decision-behaviors, bedrock-decisions-oracle]
  - text: "_log_apply_guardrail_attempt sums completed_chunk_usages with the blocking call, _success preserves merged-response exception markers, and _failure wraps error in error key."
    proof: [bedrock-decision-behaviors, bedrock-decisions-oracle]
  - text: "_get_http_exception_for_blocked_guardrail returns ModifyResponseException when disable_exception_on_block is true, else HTTPException with 400, redacted assessments, and output text."
    proof: [bedrock-decision-behaviors, bedrock-decisions-oracle]
  - text: "The response-body JSON decoder handles content, text and json() fallbacks without intermediate buffering and never panics on decode errors."
    proof: [bedrock-decision-boundaries, bedrock-decisions-fuzz-corpus, helper-python]
