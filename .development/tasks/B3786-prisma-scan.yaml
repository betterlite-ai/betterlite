id: B3786
title: Prisma AIRS scan transport and verdicts
description: >-
  Build Palo Alto Networks Prisma AIRS synchronous scanning, tool-call scans and metadata/error projection.
  The task covers the core API transport layer, error handling with permanent/transient failure distinction,
  and tool-call scanning with name/arguments separation for non-MCP tool formats.

  Core transport methods:
  - `_call_panw_api`: HTTP POST to the AIRS v1/scan/sync/request endpoint with payload construction,
    profile handling, redirects disabled, and error classification into permanent (401, 403, 4xx except 429, profile errors) and transient (429, 5xx, network/timeout) categories. Fail-open returns
    `{"action": "block", "_is_transient": true}` for transient errors unless an explicit permanent error
    override is set; permanent errors and missing-call-id return `_always_block: true`.
    MCP tool_events are allowed without a call_id; all other paths remain fail-closed.
  - `_get_mcp_server_name`: Resolve MCP server display name from request_data fields or the MCP registry,
    returning "unknown" on any lookup failure without raising exceptions.
  - `_get_masked_text`: Extract either prompt_masked_data or response_masked_data (keyed by is_response)
    from the scan result, returning None if absent or not a dict.

  Error handling and metadata methods:
  - `_build_error_detail`: Construct LiteLLM-compatible error response with action type (Prompt/Response),
    category, code suffix (_blocked or _response_blocked), rendered violation message and scan fields.
    Omit response_masked_data from client-visible details; prompt_masked_data is retained per LIT-5638.
  - `_record_scan_id`: Add the scan_id to request metadata headers for audit/observability via
    add_guardrail_scan_id, at the pre_call or post_call stage as specified.
  - `_handle_api_error_with_logging`: Distinguish _always_block (config_error, permanent client/request errors)
    from _is_transient (rate-limit, server errors, network failures). Log standard guardrail information and
    raise HTTPException(500) for permanent errors; for transient errors with fallback_on_error='allow',
    log a warning, add the guardrail to applied-guardrails header and return (allow unscanned).
    Otherwise raise guardrail_scan_error. Keep the source's distinction between config errors and scan failures.
  - `_prepare_metadata_from_request`: Extract app_name (user-provided, prefixed with LiteLLM-),
    profile_name, profile_id, user_ip (from user_metadata or requester_metadata.user_ip), app_user,
    user and model from request_data, building a metadata dict for _call_panw_api.
    litellm_trace_id is pulled from data.litellm_trace_id, user_metadata.litellm_trace_id,
    user_metadata.trace_id or requester_metadata.litellm_trace_id in priority order (the proxy's x-litellm-trace-id
    header arrives as trace_id, not litellm_trace_id).

  Tool-call scanning:
  - `_scan_tool_calls_for_guardrail`: Iterate tool_calls, extracting name and arguments via B3787's
    _get_tool_call_function, scanning the newline-separated name+args string via _call_panw_api.
    On permanent/transient error, call _handle_api_error_with_logging.
    On block, raise HTTPException(400); on allow, apply masked arguments if present and
    mask_request/response_content allows it. Tool names and arguments are plain text (AIRS tool_event
    schema only accepts ecosystem: mcp), so scanning does not require the tool-event structure
    and name-only calls without arguments are still scanned for policy firing.

