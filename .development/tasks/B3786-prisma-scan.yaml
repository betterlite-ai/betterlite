deviations:
  - what: "Permanent errors with allow fallback (transient + fallback_on_error='allow') log a warning but allow the request through without scanning. Only transient errors respect the fallback setting; permanent config/request errors always block."
    why: "LiteLLM distinguishes configuration errors (permanent, fail-closed) from API unavailability (transient, fallback to allow if configured). Missing call_id outside MCP tool_events is permanent."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/panw_prisma_airs/panw_prisma_airs.py#L797-L838
  - what: "response_masked_data is omitted from the client-visible error detail; prompt_masked_data is included. This prevents the caller from recovering the masked response content when the policy declines to deliver it."
    why: "The model's generation (response_masked_data) is the operator's policy boundary; returning it defeats the blocking intent. The caller's input (prompt_masked_data) is diagnostically valuable per LIT-5638."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/panw_prisma_airs/panw_prisma_airs.py#L155-L161

out_of_scope:
  - "Content extraction from messages and responses (belongs to B3787 _extract_text_from_messages, _extract_text_from_content_list, _extract_response_text, _extract_text_from_sse_bytes, _extract_text_from_streaming_events)"
  - "Content masking and MCP masking helpers (belongs to B3787 _mask_content_list, _apply_mcp_masking, _apply_masking_to_messages, _apply_masking_to_response)"
  - "Tool call helper functions (belongs to B3787 _get_tool_call_function, _set_tool_call_arguments, _masked_tool_call_arguments)"
  - "Message selection for unified scanning (belongs to B3789 _message_texts, _get_latest_user_text_indices, _reasoning_item_text_indices, _text_source_message_indices)"
  - "Hook lifecycle and orchestration (belongs to B3788 async_pre_call_hook, async_post_call_success_hook, async_post_call_streaming_iterator_hook)"
  - "MCP server lookup and observation headers (U1/U3/U4, unresolved)"

pitfalls:
  - "HTTP status 400 from PANW API is permanent and blocks (fail-closed) for content/tool_event validation errors; wrap detailed diagnostics including tool_event.metadata and input length. 401/403/profile errors also block despite being potentially transient in deployments — keep the fail-closed semantics."
  - "follow_redirects=False must be passed through to httpx to prevent redirect attacks; the B173 AsyncHTTPHandler wrapper may not expose it directly, requiring fallback to async_client.client.post."
  - "Masking precedence: allow+masked_args applies masks regardless of mask_*_content flags, since allowed content is transformed on policy instructions. Block respects mask_*_content; if both are false, raise the block exception."
  - "Tool name and arguments are scanned as plain text separated by newline (name\nargs), not as AIRS tool_event schema, because OpenAI tool calls are not the MCP format ecosystem=mcp requires. A call with no arguments is still scanned so tool-name policies fire."
  - "trace_id priority order: data.litellm_trace_id > user_metadata.litellm_trace_id > user_metadata.trace_id (from x-litellm-trace-id header) > requester_metadata.litellm_trace_id. The proxy stores header values as trace_id, not litellm_trace_id."
  - "app_name from metadata is prefixed with 'LiteLLM-' per-request, but the handler's app_name is already prefixed if user-supplied; do not double-prefix in _call_panw_api."
  - "Calls B173's get_async_httpx_client(llm_provider=httpxSpecialProvider.GuardrailCallback) and accesses async_client.client for direct httpx.AsyncClient control."

review_level: standard

budget:
