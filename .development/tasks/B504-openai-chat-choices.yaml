pitfalls:
- 'The oracle helper for this task is pre-registered as openai_chat_choices in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/chat_choices.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_chat_choices.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- _transform_choices is live through the Vertex Llama3 subclass even though this class transform_response calls
  convert_to_model_response_object instead.
- The final finish-reason assignment overwrites the earlier JSON-mode stop, so test the final value rather than
  the intermediate local.
- get_complete_url does substring detection and literal concatenation, not URL query-aware joining.
