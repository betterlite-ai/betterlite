  why: >-
    Own OpenAIGPTConfig._passed_in_tools, OpenAIGPTConfig._check_and_fix_if_content_is_tool_call, OpenAIGPTConfig._get_finish_reason,
    OpenAIGPTConfig._transform_choices, OpenAIGPTConfig.transform_response, OpenAIGPTConfig.get_error_class, OpenAIGPTConfig.get_complete_url,
    OpenAIGPTConfig.validate_environment, OpenAIGPTConfig.get_models, OpenAIGPTConfig.get_api_key, OpenAIGPTConfig.get_api_base,
    OpenAIGPTConfig.get_base_model, OpenAIGPTConfig.get_token_counter, OpenAIGPTConfig.get_model_response_iterator,
    OpenAIChatCompletionStreamingHandler._map_reasoning_to_reasoning_content, OpenAIChatCompletionStreamingHandler._extract_error_from_chunk,
    OpenAIChatCompletionStreamingHandler.chunk_parser. Other functions in this file remain with the owners listed
    below.
