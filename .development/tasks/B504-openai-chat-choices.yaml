checks:
  optional:
  - mutants
  commands:
  - id: case-tool-call-json-content
    why: The tool-call-json-content behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_tool_call_json_content$/)'
  - id: case-tool-calls-finish-reason
    why: The tool-calls-finish-reason behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_tool_calls_finish_reason$/)'
  - id: case-empty-choice
    why: The empty-choice behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_empty_choice$/)'
  - id: case-reasoning-content-delta
    why: The reasoning-content-delta behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_reasoning_content_delta$/)'
  - id: case-embedded-stream-error
    why: The embedded-stream-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_embedded_stream_error$/)'
  - id: case-response-headers
    why: The response-headers behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_response_headers$/)'
  - id: case-model-list
    why: The model-list behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_model_list$/)'
  - id: case-query-url-join
    why: The query-url-join behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::chat_choices_cases::case_[0-9]+_query_url_join$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_chat_choices.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_chat_choices*")"
      && grep -lq 'openai_chat_choices' tools/oracle/fuzz/corpus/helper_case/openai_chat_choices* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_chat_choices$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_chat_choices)"
      && grep -q 'decode_chat_choices' crates/betterlite-openai/fuzz/fuzz_targets/openai_chat_choices.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_chat_choices_corpus$/)'
