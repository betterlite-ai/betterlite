id: B504
title: OpenAI response choices and stream normalization
description: >-
  Normalize OpenAI choices, reasoning deltas, finish reasons and error-bearing chunks over the existing ChatResponse
  and SSE framing. Fetch get_models through the B173 HTTP client and map data ids as pinned; get_token_counter returns
  the B510 native OpenAI counter, not a local-tokenizer substitute. Reuse B500 endpoint/auth projection and B668
  base options.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/chat/gpt_transformation.py:
  OpenAIGPTConfig._passed_in_tools L550-L551; OpenAIGPTConfig._check_and_fix_if_content_is_tool_call L553-L580;
  OpenAIGPTConfig._get_finish_reason L582-L586; OpenAIGPTConfig._transform_choices L588-L659; OpenAIGPTConfig.transform_response
  L661-L708; OpenAIGPTConfig.get_error_class L710-L715; OpenAIGPTConfig.get_complete_url L717-L743; OpenAIGPTConfig.validate_environment
  L745-L762; OpenAIGPTConfig.get_models L764-L789; OpenAIGPTConfig.get_api_key L792-L793; OpenAIGPTConfig.get_api_base
  L796-L803; OpenAIGPTConfig.get_base_model L806-L807; OpenAIGPTConfig.get_token_counter L809-L814; OpenAIGPTConfig.get_model_response_iterator
  L816-L826; OpenAIChatCompletionStreamingHandler._map_reasoning_to_reasoning_content L838-L855; OpenAIChatCompletionStreamingHandler._extract_error_from_chunk
  L858-L870; OpenAIChatCompletionStreamingHandler.chunk_parser L872-L898.


  Named case contracts: tool_call_json_content: Only when tools is not None, content parses to a dictionary with
  type=function and a declared tool name, convert it to one tool call and clear content; malformed JSON or an unknown
  name remains text. Existing tool_calls, even an empty list, take precedence over content parsing. tool_calls_finish_reason:
  Repair native parallel tool calls through B004, convert selected JSON-mode arguments to message content, then
  finish with map_finish_reason over the original received finish reason unless message.tool_calls is non-None;
  the intermediate stop assignment is overwritten. reasoning_content_delta: Move delta.reasoning to delta.reasoning_content,
  overwriting an existing reasoning_content value; absent delta/choices remains empty. embedded_stream_error: A
  truthy nondictionary error becomes OpenAIError 500; dictionary integer code in [400,600) is its status, otherwise
  500. Use string message or JSON serialization of the error, and ignore false error values. response_headers: Malformed
  reply JSON raises B668 OpenAIError with the response status/headers; parsed responses delegate to B004 with hidden_params.headers
  and _response_headers preserving raw headers. model_list: Strip api_base to scheme/host/port and GET /v1/models
  with Authorization Bearer {key}; None base defaults https://api.openai.com, None key falls back only to OPENAI_API_KEY.
  Return each data.id in order; non-200 raises generic Exception with the failed-models diagnostic. query_url_join:
  get_complete_url defaults a None base to https://api.openai.com, trims trailing slashes, returns any base already
  containing chat/completions unchanged and otherwise appends /chat/completions literally, even after a query string.
  stream_envelope_fields: Force object=chat.completion.chunk, carry id/created/model, default choices=[], add usage
  only when non-None and service_tier only for a nonempty string. chat_auth_content_type: An api_key other than
  None overwrites Authorization with Bearer {key}; preserve caller content-type or Content-Type, otherwise add Content-Type:
  application/json; a None key leaves caller authorization untouched. model_list_decode_failure: Invalid JSON or
  missing data/id propagates the source parsing/key failure; do not silently return an empty model list. credential_accessor_defaults:
  get_api_key uses explicit key, litellm.api_key, litellm.openai_key, OPENAI_API_KEY; get_api_base uses explicit
  base, litellm.api_base, OPENAI_BASE_URL, OPENAI_API_BASE, https://api.openai.com/v1; get_base_model is identity
  and get_token_counter selects B510 OpenAITokenCounter.


  Write standalone Rust test openai_chat_choices_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_chat_choices_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B220. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-openai/src/chat_choices.rs with adjacent tests under chat_choices/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_choices_cases in betterlite-openai with these exact named cases (one per oracle file):
  tool_call_json_content, tool_calls_finish_reason, empty_choice, reasoning_content_delta, embedded_stream_error,
  response_headers, model_list, query_url_join, stream_envelope_fields, chat_auth_content_type, model_list_decode_failure,
  credential_accessor_defaults. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_chat_choices* using HelperCase: kind:
  helper and the externally tagged openai_chat_choices variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_chat_choices that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_chat_choices consumes OpenAI reply bytes and JSON-valued message content in crates/betterlite-openai/src/chat_choices.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_chat_choices.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_chat_choices.
  The adjacent test replays_the_openai_chat_choices_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 279 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 305 production lines, 225 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 735 planned, 750 maximum changed lines.
