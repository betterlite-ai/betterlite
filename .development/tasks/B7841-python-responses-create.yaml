  - crates/betterlite-python/src/responses.rs
  - crates/betterlite-python/src/responses/**
  - crates/betterlite-python/python/betterlite/_native_responses.pyi
  - crates/betterlite-python/python/betterlite/_responses/**
  - crates/betterlite-python/python/betterlite/responses/**
  - crates/betterlite-python/tests/responses_server.py
  - crates/betterlite-python/tests/test_responses_create.py
  - crates/betterlite-python/tests/test_responses_stream.py
  - crates/betterlite-python/tests/test_responses_retries.py
  lint_tables: false
