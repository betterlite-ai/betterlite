id: B7841
title: Python responses, aresponses, the streaming iterator and the retry wrappers
description: >-
  Add `betterlite.responses(...)` and `betterlite.aresponses(...)` so they work where LiteLLM's do, with the native side that
  runs them. Python collects arguments and builds a `ResponsesAPIResponse` (B7840) or a stream from the JSON that comes back.
  The create state machine, prompt management, the chat bridge, MCP and file-search interception live in Rust, in B1078 (the
  whole sync `responses` function), B932 (`aresponses`) and B955 (`aresponses_api_with_mcp` and the interception port). This
  task wires them to Python and adds nothing of their logic.


  Native side, the family `responses`, in `crates/betterlite-python`. It follows B5659's shape: `src/responses.rs` has
  `pub(crate) fn register(module: &Bound<'_, PyModule>) -> PyResult<()>` that adds the class `NativeResponsesSession`, the class
  `NativeResponsesStream` and the exception `NativeResponsesError` (made with `pyo3::create_exception!`). The architect writes
  the `mod responses;` and `responses::register(module)?;` lines in `src/lib.rs` and the import line in the `.pyi` package, so
  never edit `lib.rs`. The session is built from a JSON settings text. Its methods `responses(payload_text, blobs)`,
  `aresponses(payload_text, blobs)` and `aresponses_api_with_mcp(payload_text, blobs)` take the payload B6040's
  `to_call_payload` produces. The blocking one runs on the tokio runtime inside `py.detach`, and the others return awaitables
  through `future_into_py`. Each method returns a tuple `(kind, value)`: kind "response" with the response as JSON text, or
  kind "stream" with a `NativeResponsesStream`. The stream has `next_chunk()`, `anext_chunk()`, `close()` and `aclose()`, and a
  chunk is one event as JSON text, or None at the end. The error JSON keys are the ones B5659 lists. Build the interception
  port that B1078 defines from B955's dispatchers, the way B080 does, and read B1078's `responses_create` and B932's
  `aresponses` for the exact entry names. Conversions sit in `src/responses/convert.rs` and need no interpreter, with tests
  that start with `request_` and `error_`.


  Python side, the package `python/betterlite/_responses/` with files under 300 lines and an explicit `__all__`:
  `responses`, `aresponses`, `aresponses_api_with_mcp`, `responses_with_retries`, `aresponses_with_retries`,
  `mock_responses_api_response` (re-exported from B7840) and `BaseResponsesAPIStreamingIterator`. The architect writes one star
  line in `python/betterlite/__init__.py`. Never edit that file. The package `python/betterlite/responses/` has `main.py`
  that re-exports the same names, as litellm/responses/main.py does for `from litellm.responses.main import responses`. Use
  `to_call_payload`, `call_native`, `acall_native`, `read_settings` and `proxy_headers` from B6040's `_endpoints` package and do
  not write a second copy.


  `responses` and `aresponses` keep the parameter names, order and defaults of litellm/responses/main.py L1128-L1163 and
  L576-L612 (`input`, `model`, then `include` to `safety_identifier`, the three `extra_*` arguments, `timeout`,
  `allowed_openai_params`, `custom_llm_provider`, `**kwargs`). A test compares `inspect.signature`. `aresponses` is a coroutine
  function that reads nothing before the call. `responses(..., aresponses=True)` returns a coroutine, since the source pops
  `aresponses` and tests it with `is True` (L1171). Three more flags come out of `kwargs` the same way and go to Rust in a
  `trusted` object of the payload and never in the public parameters: `_skip_mcp_handler` (plain truthiness),
  `_require_encrypted_task_support` (`is True`) and `use_chat_completions_api` (the source's `_pop_use_chat_completions_api_kw`,
  L894-L900, reads it as `is True`). A `text_format` that is a class goes through B7840's `type_to_response_format_param`
  first and is sent as the dict, because B905 converts the dict form (litellm/responses/utils.py L1050-L1067). A `litellm_logging_obj`
  in `kwargs` is dropped and does not fail. `client` and `shared_session` raise B158's `UnsupportedCallArgument`, through
  `to_call_payload`. `read_settings` supplies `api_key`, `api_base`, `openai_key`, `drop_params` and `modify_params`, read at
  call time.


  A "stream" result becomes a `BaseResponsesAPIStreamingIterator`. It has `__iter__`, `__next__`, `__aiter__`, `__anext__`,
  `close` and `aclose`, builds each event as a B5657 `ResponseObject` from the chunk JSON, and ends with `StopIteration` or
  `StopAsyncIteration`. A "response" result becomes `ResponsesAPIResponse` and sets `_hidden_params["custom_llm_provider"]`
  from the JSON the way L1442-L1449 does. `aresponses_api_with_mcp` (L157-L186) keeps its signature, which has no
  `text_format` and no `allowed_openai_params`, and calls the native method of that name.


  `responses_with_retries` and `aresponses_with_retries` (litellm/main.py L6139-L6192) are plain loops, since
  `original_function` is a Python callable. `num_retries` pops with default 3, then `max_retries` and `num_retries` are set to
  0 in kwargs. `retry_strategy` pops with default `constant_retry`, and `original_function` pops with default `responses`
  (`aresponses` for the async one, awaited). Under `exponential_backoff_retry` the wait after attempt n is `min(2**(n-1), 10)`
  seconds, and otherwise there is no wait. The loop makes at least one call, even for `num_retries` 0, and raises the last
  error unchanged.


  `tests/responses_server.py` is a local `http.server` with a thread. It answers POST `/v1/responses` with fixed JSON, or with
  server-sent events (`response.created`, `response.output_text.delta`, `response.completed`) when the body has `"stream":
  true`. It also answers the lifecycle routes B7842 tests: GET and DELETE `/v1/responses/{id}`, POST
  `/v1/responses/{id}/cancel`, POST `/v1/responses/compact`, GET `/v1/responses/{id}/input_items`. It records each request, counts calls per path, and
  gives a 401 body in the OpenAI error shape when the bearer key is "bad-key". Tests call `litellm` and `betterlite` with the
  same arguments against it and compare `model_dump()` of the results.
scope:
