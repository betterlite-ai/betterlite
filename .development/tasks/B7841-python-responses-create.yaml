dod:
- text: "`responses` and `aresponses` keep LiteLLM's signatures."
  proof: [responses-signature]
- text: A plain call and a call with many optional arguments reach the local server and give the same `model_dump()` as LiteLLM.
  proof: [responses-call]
- text: "`aresponses` runs on the event loop without blocking it, and `responses(aresponses=True)` returns a coroutine."
  proof: [responses-async]
- text: "A pydantic class in `text_format`, an `httpx.Timeout`, and the three trusted flags are sent as LiteLLM sends them, and `client` is refused."
  proof: [responses-values]
- text: A stream gives the same events as LiteLLM on both iteration paths, ends cleanly and closes.
  proof: [responses-stream]
- text: A provider 401 raises the authentication class with the native error as cause.
  proof: [responses-error]
- text: "`aresponses_api_with_mcp` without MCP tools returns what `aresponses` returns."
  proof: [responses-mcp]
- text: Both retry wrappers make the same number of calls and raise the same last error as LiteLLM.
  proof: [responses-retries]
- text: The native register function adds the session, the stream and the error class, and conversion has tests without an interpreter.
  proof: [responses-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: responses-signature
    why: A renamed or reordered parameter breaks callers who pass arguments by position.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_create.py -k signature
  - id: responses-call
    why: The wiring stops at the Python layer and never reaches the provider.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_create.py -k "plain or optional"
  - id: responses-async
    why: An async call blocks the loop or a sync flag returns the wrong type.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_create.py -k "async or coroutine"
  - id: responses-values
    why: A Python object fails in JSON, or a client is dropped silently and skips a caller's proxy.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_create.py -k "text_format or timeout or trusted or client"
  - id: responses-stream
    why: Iteration differs from LiteLLM or never ends.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_stream.py
  - id: responses-error
    why: A provider error shows up as a generic exception.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_create.py -k error
  - id: responses-mcp
    why: The MCP entry point is missing or breaks a plain call.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_create.py -k mcp
  - id: responses-retries
    why: Retries run too often or change the error.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_responses_retries.py
  - id: responses-native
    why: The native conversion drops a field of the request or the error.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^responses::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Untyped dicts and ignores creep in at the native boundary.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`client` and `shared_session` raise `UnsupportedCallArgument`."
  why: A Python HTTP client can't drive the Rust call, and ignoring it could send a request past a caller's proxy or custom TLS.
- what: A stream is one `BaseResponsesAPIStreamingIterator` for both paths, and its events are `ResponseObject` values, not the per-event pydantic classes.
  why: The wheel has no pydantic, and the event classes belong to B167. The dumped dict of each event is the same.
- what: The retry wrappers run without tenacity, so "tenacity import failed please run `pip install tenacity`" never appears.
  why: A plain loop needs no optional package.
- what: "`litellm.responses.dispatch` and its rust_bridge selector do not exist."
  why: Every call already goes through the native session.
out_of_scope:
- The create state machine, prompt management, the chat bridge, MCP and file-search dispatch run in Rust (B1078, B932, B955, B931), and so do the private helpers in litellm/responses/main.py around them.
- "`_aresponses_websocket` (L2343-L2445) and the websocket helpers L2287-L2340 serve the proxy only. No Python user code calls them at the pin, and B943 owns the relay."
- The retrieve, delete, cancel, compact and input-items functions are B7842.
- The mock response and the result classes are B7840.
- The error table and `UnsupportedCallArgument` are B158, and the payload, runner and settings helpers are B6040.
pitfalls:
- 'The `responses` attribute of `betterlite` is the function, and the `betterlite.responses` package must still import, so `main.py` is reached by `import betterlite.responses.main` and the star line must come last.'
- '`aresponses=True` in kwargs must be popped before the payload is built, or it reaches Rust as a request field.'
- 'For `_require_encrypted_task_support` and `use_chat_completions_api` only the exact value True counts, but `_skip_mcp_handler` counts by truthiness.'
- '`reasoning_effort` is not a named parameter. It arrives in `**kwargs` and Rust maps it (B1078), so Python must not turn it into `reasoning`.'
- 'The async retry wrapper defaults `original_function` to `aresponses` and awaits it, and the sync one calls `responses` and may get a coroutine back when `aresponses=True`, which the loop returns as it is.'
- 'A stream must be closed once: `close` after the end of the stream does nothing and does not raise.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
