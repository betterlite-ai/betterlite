id: B1033
title: File content HTTP route and stream pump
description: >-
  Own get_file_content whole, with GET /{provider}/v1/files/{file_id:path}/content,
  /v1/files/{file_id:path}/content and /files/{file_id:path}/content. Also own the complete
  FileContentStreamingHandler.get_streaming_file_content_response and stream_file_content_with_logging
  moved from B1080. Implement route/pump in betterlite-server::api::file_content_route and
  lifecycle policy in betterlite-core::api::file_content_route. B1080 stays below B1030 and supplies
  the pure credential/stream predicate; this route calls B1030 to open content.

  B1021 checks managed-ID requirements before common pre-call processing; B1019 recognizes legacy
  ids; B1020 authorizes model routing; B2208 classifies raw storage URIs. With no enterprise hook,
  unified ids fail before database/storage access. Remove the previous dependencies on managed
  repositories/backends; there is no reachable storage download branch here in the MIT proxy.
  Provider hints use path, custom-llm-provider header, custom_llm_provider query/body, then openai.

  Provider alone selects streaming, not a stream query parameter. Buffered replies return a new
  Response with upstream status/headers, losing the custom headers written on fastapi_response.
  Streaming replies default to 200 and merge provider headers then B004 custom headers, with
  application/octet-stream only as the fallback media type. Preserve this observable difference.
  Add HTTP oracle scenarios through B900/B1139 with master key sk-test and ordinary seeded keys;
  no helper imports a FastAPI function. Tests use api::file_content_route::tests in both crates.
  The 337 nonblank/non-comment lines including the two moved methods need 285 implementation,
  185 tests, 220 cases and 40 wiring lines, 730 total. Existing body/ID/transport decoders are reused.
