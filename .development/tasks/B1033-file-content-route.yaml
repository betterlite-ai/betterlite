deviations:
- what: Legacy managed file content returns 500 internal_server_error/code="500" without fetching stored content; require_managed_files changes the message to ownership validation unavailable.
  why: Retain the MIT absent-hook behavior until Max decides managed files and batches; no enterprise implementation or license check is introduced.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L1004-L1013
out_of_scope:
- B1031 owns upload helpers, B1032 create_file, B1034 get_file/list_files/_as_file_list_page, B087 delete_file. B1080 owns the remaining streaming handler methods and SDK stream wrapper.
- The managed-hook continuation L1014-L1091 has no reachable MIT caller. Its router/type errors, repository lookup, Storage backend error 400 and enterprise downloads are excluded together; do not fake a hook to exercise them.
- B003 owns error normalization, B004 common pre-call/custom headers, B124 proxy hooks/status, B1021 requirement errors, B1030 SDK content and B2208 cloud URI classification.
pitfalls:
- Buffered content discards custom headers because it returns a new Response; streaming merges them into its actual response.
- Content checks unified ids before model routing, unlike retrieve/delete routes.
- A proxy admin can delete a raw cloud id but cannot use this route to download it.
review_level: security
budget:
  max_changed_lines: 730
  max_new_expects: 0
