references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/files_endpoints.py#L928-L1233
  why: All content aliases, early managed/cloud checks, routing and distinct buffered response handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py#L70-L146
  why: Whole SDK-opening response constructor and proxy stream pump now owned above the SDK dependency.
dod:
- text: >-
    content_route_aliases GETs /files/f/content, /v1/files/f/content and /openai/v1/files/f/content
    with valid auth. Each makes exactly one upstream request and returns b"\x00abc\xff" unchanged.
    A slash-bearing id remains one catch-all id and uses the provider's encoder. Missing and invalid
    auth with master key configured give 401,auth_error,param="None",code="401", zero pre-call/provider
    effects; compare B756's messages. Mount the content routes ahead of generic file-id paths once.
  proof: [route-tests, oracle, new-cases]
- text: >-
    content_provider_and_model_selection proves path>header>query>body>openai, empty hints falling
    through. B004 common pre-call route_type=afile_content runs before provider accessors. An encoded
    model m overrides conflicting provider hints, authorizes m through B1020, decodes file id and
    carries internal credentials. Stream projection removes model from the copied payload to avoid
    re-resolution; buffered projection retains it. Unrouted requests use team-provider credentials.
    GET ?stream=false still streams OpenAI; ?stream=true still buffers Azure. Query/body extras
    are accepted only through the existing common-processing contract, not a second route parser.
  proof: [route-tests, oracle, new-cases]
- text: >-
    managed_content_failures sends a legacy unified id with require_managed_files=false and gets
    500/internal_server_error/null/"500",message="Managed files hook not found" before any DB read.
    With require_managed_files=true, the same id fails earlier with "Managed resource ownership
    validation is unavailable." at 500; raw f fails 400/invalid_request_error/null/"400" with B1021's
    exact required-managed-file message. A raw s3://bucket/key or gs://bucket/key at the normal setting
    fails 400/invalid_request_error/null/"400",message="Raw cloud storage file ids cannot be retrieved
    directly. Use the LiteLLM managed file id returned when the file was created." even for proxy_admin.
    Require-managed failure precedes raw-cloud checking; no fetch occurs in any rejection.
  proof: [route-tests, oracle, new-cases]
- text: >-
    buffered_content_response uses Azure mock status=206,content-type=text/plain,x-origin=upstream
    and content=b"part". Client gets exactly 206 and those upstream fields/bytes; generated
    x-litellm-version/model-id/cache-key/model-api-base are absent unless the upstream itself sent them.
    Success status is enqueued with call id default "" before validating response.response; a native
    missing response object yields 500/internal_server_error/null/"500",message="Invalid response -
    response.response is None - got <response>" after that enqueue. No post-call success hook runs here.
  proof: [route-tests, oracle, new-cases]
- text: >-
    streaming_content_response uses OpenAI mock chunks [ab,cd], provider content-type=text/plain,
    x-litellm-version=upstream and content-disposition=attachment. Client receives bytes incrementally,
    status=200, content-type=text/plain and disposition unchanged; custom version overrides upstream.
    Absent content-type defaults application/octet-stream. B004 supplies x-litellm-model-id/cache-key/
    model-api-base from hidden values or "", version and allowed_model_region. Stream constructor
    calls SDK with provider,file_id,stream=true then data, so native injected data overrides duplicate
    keys exactly as Python's merge does. Do not drop arbitrary upstream headers in this task.
  proof: [route-tests, oracle, new-cases]
- text: >-
    content_stream_completion updates request status to success only after iterator EOF, with
    litellm_call_id="" when absent; exceptions trigger post_call_failure_hook with original data,
    then propagate, and finally await aclose if present. Cancellation closes without inventing a
    success or failure callback. After response headers are committed a broken stream terminates;
    it cannot be replaced by a JSON error envelope. No buffered-route status enqueue follows the
    streaming early return. SDK logging remains B1080's separate callback lifecycle.
  proof: [route-tests, oracle, new-cases]
- text: >-
    content_open_failures makes upstream 429 carry type=rate_limit_error,param=file_id,message=slow:
    client 429/rate_limit_error/file_id/"429",message=slow, after the failure hook. HTTPException400
    maps to invalid_request_error; 403 to permission_error; a missing status defaults 500 and
    internal_server_error. Param absent or literal "None" becomes null. Log EXCEPTION
    "litellm.proxy.proxy_server.retrieve_file_content(): Exception occured - <error>" then DEBUG
    traceback. Streaming selection logs DEBUG with provider, original_file_id, resolved file_id and
    model_used; buffered model routing logs "Retrieved file content using model: m" plus the id mapping.
  proof: [route-tests, oracle, new-cases]
checks:
  optional: []
  commands:
  - id: route-tests
    why: content aliases, lifecycle or final byte/header behavior is missing
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::file_content_route::tests::/) - test(/replays_/)'
  - id: new-cases
    why: content behavior has no new booted-proxy scenarios
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/file-content-route)"
