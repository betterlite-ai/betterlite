  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/api/file_content_route.rs
  - crates/betterlite-server/src/api/file_content_route/**
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_content_route.rs
  - crates/betterlite-core/src/api/file_content_route/**
  - tools/oracle/cases/api/file-content-route/**
