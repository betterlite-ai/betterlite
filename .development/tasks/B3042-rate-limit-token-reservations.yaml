deviations:
- what: _refund_reserved_tokens receives reservation_windows as a frozenset of tuples (key, value, backend_type);
    when empty, it uses TPM refund logic, when non-empty it uses project refund logic. This matches LiteLLM's
    conditional dispatch based on the presence of reservation window tracking.
  why: Project I/O tokens are tracked per-window (distinct ITPM/OTPM windows), requiring different refund paths;
    simple TPM uses only TTL preservation without window identity.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L2594-L2617
- what: reserve_io_tokens returns (response, itpm_reserved, estimated_output_tokens) when both ITPM and OTPM
    succeed—the third element is the estimate, not the actual amount reserved. This matches LiteLLM's pattern
    where only the caller can track actual reconciliation amounts per request.
  why: The caller (B3043) stashes these amounts for post-call reconciliation; OTPM is always the estimate
    unless a refund path is triggered, so returning the estimate avoids double-tracking.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L2684-L2699
- what: enforce_project_io_token_quota_for_frame charges the full estimate immediately with no per-frame
    reconciliation on completion. Like the batch rate limiter, estimates are non-refundable.
  why: WebSocket connections may send many response.create frames; the connection-level pre-call hook
    only runs once, so per-frame admission must reserve without later adjustment. Estimates are the only
    available signal at frame time.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L2704-L2720

out_of_scope:
- Descriptor construction (model, team, project, tag, agent descriptors, identity resolution) is owned by
  B3038/B3039/B3040; add_project_io_token_rate_limit_descriptors_from_metadata is B3038.
- Atomic check and increment behavior is owned by B3034; atomic_check_and_increment_by_n is delegated there.
- Token delta operations and TTL preservation are owned by B3037; async_increment_tokens_with_ttl_preservation,
  async_increment_reservation_aware_tokens, _build_reservation_aware_tpm_ops, _build_project_reservation_ops
  are all B3037.
- Error projection and provider attribution belong to B3030; _handle_rate_limit_error is delegated there.
- Cache and Redis script registration await concrete owners (external dependency question 1).
- Per-request state stash management is B3031; claim_request_stash_for_data and get_request_stash_for_call
  are delegated there.

pitfalls:
- reserve_io_tokens returns the estimated_output_tokens amount for OTPM, not the actual reserved amount,
  matching LiteLLM's pattern. The caller must stash this for later reconciliation; do not invent an
  actual-reserved tracking path here.
- _refund_reserved_tokens must check reservation_windows.empty() or equivalent; only when truly empty
  should it use the TPM path (no window guards). When windows exist (ITPM or OTPM specific), use the
  project path (window-aware refund).
- ITPM/OTPM descriptors are distinguished by key string matching PROJECT_ITPM_DESCRIPTOR_KEY and
  PROJECT_OTPM_DESCRIPTOR_KEY constants defined in B3031; do not hardcode the strings.
- enforce_project_io_token_quota_for_frame only processes if descriptors list is non-empty after calling
  the descriptor builder. Empty descriptors should return early without calling reserve_io_tokens.
- The parent_otel_span field comes from user_api_key_dict.parent_otel_span; do not attempt to construct
  or pass None unless explicitly absent.

