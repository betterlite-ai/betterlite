id: B3042
title: Reserve combined and project input-output token quotas
description: >-
  Implement the three token-reservation functions for combining TPM (total tokens per minute)
  and project-scoped ITPM/OTPM (input/output tokens per minute) quotas. Build reserve_tpm_tokens
  to allocate tokens against all TPM-bearing descriptors in a single atomic operation before the
  upstream call; _refund_reserved_tokens to decrement token counters when a later descriptor
  in the same request fails (e.g., ITPM succeeds but OTPM is over limit); reserve_io_tokens
  to separately reserve input and output tokens with the same rollback semantics; and
  enforce_project_io_token_quota_for_frame to charge per-WebSocket-frame quota for Responses
  API calls where connection-level admission only runs once.

  Port from litellm/proxy/hooks/parallel_request_limiter_v3.py (lines 2536–2739) with no
  per-frame reconciliation—like the batch rate limiter, frame admission charges the estimate
  immediately. Preserve exact-once refund semantics: after ITPM succeeds, if OTPM rejects,
  the ITPM reservation is rolled back; after TPM succeeds, ITPM/OTPM refunds roll back
  only the amount actually reserved, not guessed amounts.

  Direct dependencies: B732 supplies UserAPIKeyAuth caller auth for WebSocket frame calls; B3030
  supplies _handle_rate_limit_error error projection; B3031 supplies RateLimitDescriptor,
  RateLimitResponse, PROJECT_ITPM_DESCRIPTOR_KEY, PROJECT_OTPM_DESCRIPTOR_KEY and
  ReservationWindowIdentity type definitions; B3034 supplies atomic_check_and_increment_by_n;
  B3037 supplies _build_reservation_aware_tpm_ops, _build_project_reservation_ops,
  async_increment_tokens_with_ttl_preservation, async_increment_reservation_aware_tokens;
  B3038 supplies add_project_io_token_rate_limit_descriptors_from_metadata.

  Build tests with named rstest cases for each literal input/outcome: TPM filtering and
  filtering of project-scoped descriptors, ITPM reservation and OTPM rollback behavior,
  ITPM refund paths with and without reservation windows, and WebSocket frame admission
  with missing descriptors/auth.

  Budget 120 Rust impl/tests, 80 route/integration (200 total), 1500 max_changed_lines.

