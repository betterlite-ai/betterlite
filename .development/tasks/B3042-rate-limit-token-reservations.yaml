dod:
- text: reserve_tpm_tokens filters descriptors to exclude PROJECT_ITPM_DESCRIPTOR_KEY and
    PROJECT_OTPM_DESCRIPTOR_KEY, and to include only descriptors with non-null tokens_per_unit.
  proof:
  - tpm-filtering-tests
  - oracle
- text: reserve_tpm_tokens builds one token increment per TPM descriptor with the estimated_tokens
    amount.
  proof:
  - tpm-filtering-tests
- text: reserve_tpm_tokens returns RateLimitResponse with overall_code="OK" and empty statuses
    when no TPM descriptors remain after filtering.
  proof:
  - tpm-filtering-tests
  - oracle
- text: reserve_tpm_tokens delegates to atomic_check_and_increment_by_n and returns its response
    directly.
  proof:
  - tpm-filtering-tests
  - oracle
- text: _refund_reserved_tokens returns early without action when amount <= 0 or scopes is empty.
  proof:
  - refund-early-exit-tests
  - oracle
- text: _refund_reserved_tokens with empty reservation_windows builds _build_reservation_aware_tpm_ops
    with reserved_tokens=amount and calls async_increment_tokens_with_ttl_preservation.
  proof:
  - refund-tpm-ops-tests
  - oracle
- text: _refund_reserved_tokens with non-empty reservation_windows builds _build_project_reservation_ops
    with reserved_tokens=amount and calls async_increment_reservation_aware_tokens.
  proof:
  - refund-project-ops-tests
  - oracle
- text: reserve_io_tokens filters descriptors to separate ITPM (PROJECT_ITPM_DESCRIPTOR_KEY) and
    OTPM (PROJECT_OTPM_DESCRIPTOR_KEY) descriptors.
  proof:
  - io-filtering-tests
  - oracle
- text: reserve_io_tokens returns RateLimitResponse with overall_code="OK", empty statuses and
    empty reservation_windows, plus (0, 0) reserved amounts when no ITPM or OTPM descriptors exist.
  proof:
  - io-filtering-tests
  - oracle
- text: reserve_io_tokens reserves ITPM descriptors with estimated_input_tokens and returns
    immediately with (itpm_response, 0, 0) if ITPM is OVER_LIMIT.
