  proof:
  - otpm-rollback-tests
  - oracle
- text: reserve_io_tokens merges ITPM and OTPM statuses into a combined response when both succeed.
  proof:
  - both-succeeded-tests
  - oracle
- text: reserve_io_tokens combines ITPM and OTPM reservation_windows with union (|) operator.
  proof:
  - both-succeeded-tests
  - oracle
- text: reserve_io_tokens returns (response, itpm_reserved, estimated_output_tokens) when OTPM
