  - itpm-reserved-amount-tests
  - oracle
- text: reserve_io_tokens when OTPM descriptors exist reserves with estimated_output_tokens and
    returns (otpm_response, 0, 0) if OTPM is OVER_LIMIT.
  proof:
  - otpm-over-limit-tests
  - oracle
- text: reserve_io_tokens when OTPM is OVER_LIMIT and itpm_reserved > 0 calls _refund_reserved_tokens
