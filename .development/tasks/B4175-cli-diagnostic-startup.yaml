dod:
  - text: show_banner writes a newline, the six-line banner, a newline and a final newline, with LITELLM_BANNER equal to banner.py's text.
    proof: [startup-tests, oracle, helper-python]
  - text: version_command writes the Current Version line from the version string it is given, with click.echo's surrounding newlines.
    proof: [startup-tests]
  - text: health_command requests http://{host}:{port}/health with no Authorization header, a 5 second timeout and no redirect following, and prints the JSON body with 4-space indentation whatever the status; a non-JSON body is a typed error.
    proof: [startup-tests, oracle, helper-python]
  - text: config_validation_command refuses a missing config path with the --validate_config message, prints "config OK (n models)" for a loadable file and the "config validation failed" line plus a typed error for a bad one.
    proof: [startup-tests, oracle, helper-python]
  - text: test_command prints the Making a test ChatCompletions line with gpt-3.5-turbo as the default model and then fails with InvalidTestValue.
    proof: [startup-tests, oracle, helper-python]
  - text: needs_ollama is true only for a model containing "ollama" with no api_base, and ollama_serve spawns `ollama serve` silently and turns a spawn error into the warning text without failing.
    proof: [startup-tests, oracle, helper-python]
  - text: classify_positional maps xai-oauth login to its command, no arguments to None and anything else to the Unknown command error with the joined arguments; xai_login_lines omits the expiry line when there is none.
    proof: [startup-tests, oracle, helper-python]
  - text: decode_headers returns None for an empty string, the last duplicate for a repeated key, and a typed error for invalid JSON, a non-object, a non-string value or input over 65536 bytes.
    proof: [startup-tests, startup-corpus]
  - text: choose_port changes only port 4000 and only when the probe says it is in use, drawing from 1024 to 49152 inclusive; LocalPortProber tries IPv4 only; check_metrics_port rejects equal ports.
    proof: [startup-tests, oracle, helper-python]
  - text: plan_verbose_levels follows LiteLLM's order for debug, detailed_debug, LITELLM_LOG and the file-path and bad-JSON cases, and never sets the package level from LITELLM_LOG.
    proof: [startup-tests, oracle, helper-python]
  - text: The startup_input_json fuzz target exists and its seed corpus replays through both decoders without a panic.
    proof: [startup-corpus]
checks:
  optional: [mutants]
  commands:
    - id: startup-tests
      why: A banner, diagnostic command, startup input or verbose-level behavior is missing or differs from LiteLLM
      run: >-
        cargo nextest run --locked -p betterlite --no-tests=fail
        -E 'test(/^(banner|diagnostic_commands|startup_input|verbose_levels)::/) - test(replays_startup_input_json_corpus)'
    - id: startup-corpus
      why: The decoder fuzz target, its new seed corpus or the replay test is missing
      run: >-
        test -f crates/betterlite/fuzz/fuzz_targets/startup_input_json.rs &&
        grep -q 'name = "startup_input_json"' crates/betterlite/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite/fuzz/corpus/startup_input_json)" &&
        cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(replays_startup_input_json_corpus)'
    - id: helper-python
      why: The strict oracle adapter for the startup diagnostics fails lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4175)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4175 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4175/pyrightconfig.json
