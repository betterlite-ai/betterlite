id: B4175
title: CLI diagnostic commands and startup input helpers
description: >-
  The skeleton already declares this task's fuzz [[bin]] with an empty target file; fill that target and add the crate dependency it needs, without a second [[bin]] entry.


  Build the small commands and the input helpers that LiteLLM's `litellm` entry point (proxy_cli.py run_server) runs before it
  starts a server, as plain library code in the crates/betterlite crate. Four new modules, each declared in lib.rs by the
  skeleton: banner, diagnostic_commands, startup_input and verbose_levels. Nothing here parses argv or starts a server. The
  task B8375 owns the clap root and calls these functions in run_server's order. Every side effect goes through a
  parameter (a writer, a trait object, a plain value), so tests run without a network, a child process or an environment.

  banner.rs: `pub const LITELLM_BANNER: &str` holds the six-line block-letter banner from banner.py exactly, with the box
  characters written as \u{...} escapes the way welcome.rs does. `pub fn show_banner(writer: &mut dyn Write) -> Result<(), BannerError>`
  writes "\n", the banner, "\n" and one more "\n" (click.echo adds the last newline). The Python `except ImportError` branch
  (click missing) is not built. This is a different banner from welcome.rs, so leave welcome.rs alone.

  diagnostic_commands.rs holds the three early-exit commands. Each returns a typed result and writes through a `&mut dyn Write`.
  1. `version_command(package_version: &str, writer)` writes "\nLiteLLM: Current Version = {package_version}\n" and then a newline
  (click.echo). The caller passes the version string; the function never reads Cargo metadata itself.
  2. `health_command(host: &str, port: u16, transport: &dyn HealthTransport, writer)` writes "\nLiteLLM: Health Testing models in config\n"
  (print adds the newline), calls `transport.get("http://{host}:{port}/health")` and writes the response body re-serialized as
  JSON with 4-space indentation. The URL uses host verbatim, so the default 0.0.0.0 stays 0.0.0.0. It sends no Authorization
  header, so a proxy with a master key answers with its 401 body and that body is printed the same way; the HTTP status is
  never checked. A body that is not JSON is `DiagnosticError::NotJson`. `HealthTransport` is a one-method trait
  (`fn get(&self, url: &str) -> Result<String, TransportError>`); the real implementation `ReqwestHealth` uses reqwest's
  blocking client (reqwest 0.13.5 with the blocking and rustls features, the same line betterlite-http uses) with a 5 second
  timeout and `redirect::Policy::none()`, which are httpx's defaults (5 s timeout, no redirects). Add the dependency to
  crates/betterlite/Cargo.toml and check `cargo deny --locked check`. Test the real transport against a std `TcpListener` serving
  one canned HTTP response, not a mock of the trait.
  3. `config_validation_command(config: Option<&Path>, loader, writer, err_writer)`: no config path is
  `DiagnosticError::ConfigRequired`, whose message is exactly "--validate_config requires --config <path>" and which the
  umbrella maps to exit code 2 (click.UsageError). Otherwise load the file the way main.rs's load_config does (betterlite-config
  `load_file` with a `ConfigLoader`). A load error writes "LiteLLM: config validation failed: {error}" to the error writer and
  returns `DiagnosticError::ConfigInvalid` (exit code 1). Success writes "LiteLLM: config OK ({n} models)\n" where n is
  `config.model_list.len()`. Do not log through tracing here.
  `test_command(host, port, model: Option<&str>, writer)`: LiteLLM's `--test` is declared `flag_value=True`, so its value is
  always the boolean True and `_run_test_chat_completion` raises ValueError("Invalid test value") right after printing
  "\nLiteLLM: Making a test ChatCompletions request to your proxy. Model={model or gpt-3.5-turbo}\n". Do the same: write that line
  (an absent or empty model becomes gpt-3.5-turbo) and return `DiagnosticError::InvalidTestValue`, exit code 1. Do not build the
  three OpenAI requests behind the raise, because nothing at the pin can reach them (see out_of_scope).
  `ollama_serve(launcher: &dyn ProcessLauncher, writer)` and `needs_ollama(model: Option<&str>, api_base: Option<&str>) -> bool`:
  true when the model is present, contains the substring "ollama" and api_base is absent. `ProcessLauncher` has one method,
  `fn spawn_silent(&self, program: &str, args: &[&str]) -> Result<(), io::Error>`, and the real implementation starts the
  process with stdin, stdout and stderr null and does not wait. `ollama_serve` calls `spawn_silent("ollama", &["serve"])`; on an
  error it writes LiteLLM's warning and returns Ok. The warning text is the f-string at proxy_cli.py L640-L645 with the
  exception text replaced by the io error text: a newline, 16 spaces, "LiteLLM Warning: proxy started with `ollama` model", a
  newline, "`ollama serve` failed with Exception{error}. ", a newline, "Ensure you run `ollama serve`", a newline and 12 spaces.
  A running ollama is not checked first.

  startup_input.rs holds the input helpers from run_server's body. Its error enum is `StartupInputError`.
  - `classify_positional(args: &[String]) -> Result<PositionalCommand, StartupInputError>`. No arguments is `PositionalCommand::None`.
  Exactly `["xai-oauth", "login"]` is `PositionalCommand::XaiOauthLogin`. Anything else is `StartupInputError::UnknownCommand`
  whose message is "Unknown command: {args joined by one space}" and which the umbrella maps to exit code 2.
  `xai_login_lines(auth_file: &Path, expires_at: Option<i64>) -> Vec<String>` returns "xAI OAuth login successful. Credentials
  saved to {auth_file}." and, when expires_at is present, "Access token expires at {expires_at}." The login itself is B1401's
  service and is not called here.
  - `decode_headers(raw: &str) -> Result<Option<BTreeMap<String, String>>, StartupInputError>` for the `--headers` flag. An
  empty string is Ok(None) (LiteLLM skips json.loads on a falsy value). Otherwise the text must be a JSON object whose values are
  all strings, with the last duplicate key winning. Input longer than 65536 bytes, invalid JSON, a non-object, or a non-string
  value is `StartupInputError::Headers` naming the problem. The raw text is untrusted, so it is parsed once with
  serde_json into the typed map and never echoed back into an error message.
  - `choose_port(port: u16, prober: &dyn PortProber, rng: &mut impl Rng) -> u16`: when port is exactly 4000 and
  `prober.in_use(4000)` is true, return `rng.random_range(1024..=49152)` (both bounds inclusive, like random.randint), else
  return port unchanged. The new port is not probed again. The real `LocalPortProber` opens a TCP connection to 127.0.0.1:port
  and answers true when it connects. LiteLLM's connect_ex(("localhost", port)) on an AF_INET socket only tries IPv4, so do not
  try ::1. A refused or timed-out connect answers false.
  - `check_metrics_port(metrics: Option<u16>, port: u16) -> Result<(), StartupInputError>`: equal values give
  `StartupInputError::MetricsPortClash` with the message "--prometheus_metrics_port must differ from --port" (exit code 2). It
  runs after choose_port, so the comparison uses the possibly randomized port.
  - `decode_worker_config(raw: &str) -> Result<WorkerDebugFlags, StartupInputError>` reads the two keys `debug` and
  `detailed_debug` from the JSON object LiteLLM's save_worker_config stores in WORKER_CONFIG, each `Option<bool>`, and ignores
  every other key. Limit 65536 bytes. Invalid JSON, a non-object, or a non-boolean value for those two keys is an error.

  verbose_levels.rs ports `init_verbose_loggers` from debug_utils.py as a pure plan. `pub enum LogLevel { Info, Debug }`,
  `pub struct LevelPlan { package: Option<LogLevel>, router: Option<LogLevel>, proxy: Option<LogLevel> }` (None means leave the
  logger alone) and `pub fn plan_verbose_levels(worker_config: Option<&str>, worker_config_is_file: bool, litellm_log: &str,
  warn: &mut dyn FnMut(&str)) -> LevelPlan`. The caller (B8375, with B012's logging setup) applies the plan to the three
  tracing targets; this task does not touch tracing or any global state. Rules, in LiteLLM's order: an absent WORKER_CONFIG, or
  one that names an existing file (`worker_config_is_file`), gives the empty plan. Otherwise decode it with
  decode_worker_config. A decode error calls warn once with "Failed to init verbose loggers: {error}" and returns the plan built
  so far, which is empty. Then: debug == Some(true) sets all three to Info; after that, detailed_debug == Some(true) sets all three
  to Debug (it overrides the Info); otherwise, only when both flags are exactly Some(false), look at `litellm_log` (the LITELLM_LOG
  value, "" when unset): "INFO" in any letter case sets router and proxy to Info, "DEBUG" sets router and proxy to Debug, and
  the package logger stays None in both cases. A flag that is absent counts as neither true nor false, so debug absent with
  detailed_debug false never reads LITELLM_LOG.

  Error enums: BannerError (io), DiagnosticError, StartupInputError, each with thiserror and no unwrap, expect or panic. LiteLLM
  tracebacks are not reproduced. The module that can fail owns its enum in its own files.

  Add a cargo-fuzz target `startup_input_json` in crates/betterlite/fuzz that feeds the same bytes to decode_headers and
  decode_worker_config, plus a seed corpus (valid object, empty object, non-object, duplicate keys, non-string value, deeply
  nested array, invalid UTF-8) and a test `replays_startup_input_json_corpus` in startup_input's tests that runs every corpus
  file through both decoders without a panic.

  Oracle cases are all helper cases with one helper operation b4175 that has an `operation:` field; the skeleton creates the
  helper, and the worker writes the case files under tools/oracle/cases/helpers/startup-diagnostics/. The Python side drives
  LiteLLM with click's CliRunner on run_server or with direct calls and patches the outside world (httpx.get, subprocess.Popen,
  ProxyInitializationHelpers._is_port_in_use, random.randint). Cases: banner-text compares show_banner's stdout; health-prints-indented-json
  patches httpx.get to return {"healthy_endpoints": [], "unhealthy_count": 0} and compares the stdout of _run_health_check;
  test-flag-invalid-value runs run_server(["--test"]) and compares the stdout line and the ValueError message; validate-config-needs-path
  runs ["--validate_config"] and compares exit code 2 and the usage message; unknown-command runs ["foo", "bar"] and compares exit
  code 2 and "Unknown command: foo bar"; ollama-model-starts-serve calls the ollama check with model "ollama/llama3" and no api_base and
  records the Popen argv; ollama-with-api-base-skips does the same with api_base set and records no call;
  port-4000-in-use-randomized patches the probe to true and randint to return 31000 and records the randint bounds and the chosen
  port; port-other-kept uses port 8080 with the probe true and records that nothing is drawn; verbose-debug-then-detailed sets
  WORKER_CONFIG to {"debug": true, "detailed_debug": true} and records the three logger levels; verbose-log-env-only-when-both-false sets
  {"debug": false, "detailed_debug": false} with LITELLM_LOG=debug and records the levels. Compare the observable values, not
  the adapter's internals.
