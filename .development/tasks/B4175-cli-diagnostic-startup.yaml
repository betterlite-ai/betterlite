deviations:
  - what: "`--test` stays the always-failing command it is at the pin, and the three OpenAI requests behind the raise are not built."
    why: The option is declared flag_value=True, so the string branch that makes the requests cannot be reached. This is an open question for the architect; the notes record it.
  - what: The health command's JSON parse error, the config validation error text and the ollama spawn error text come from Rust (serde_json, the config loader, io::Error), not from Python exceptions.
    why: >-
      The wording of Python exceptions is not part of the contract. The fixed prefixes, "LiteLLM: config validation failed" and "Exception", stay as LiteLLM prints them.
  - what: "`--headers` accepts only a JSON object of string values, up to 65536 bytes."
    why: LiteLLM passes any JSON value on to its worker config; headers are string pairs by their purpose and the bounded-inputs rule caps untrusted text.
  - what: The WORKER_CONFIG decoder accepts only boolean values for debug and detailed_debug, and logs the failure and changes nothing for anything else.
    why: LiteLLM compares with `is True`, so other values do nothing there; a value of the wrong type is rejected where it enters (docs/compatibility.md).
out_of_scope:
  - "_run_test_chat_completion lines after the raise (the ChatCompletions, streaming and completions requests, L251-L280): no caller at the pin can reach them because test is never a string."
  - "_get_default_unvicorn_init_args, _apply_uvicorn_max_requests_jitter, _get_reload_options, _patch_statreload_extra_paths, _configure_dev_reload, _get_loop_type: B4176 owns them."
  - "_init_hypercorn_server, _init_granian_server, _run_gunicorn_server, _prometheus_callback_configured, _maybe_setup_prometheus_multiproc_dir: B4177 owns them."
  - "The database URL, token auth, KMS decrypt, migration and pgbouncer blocks of run_server, and the module-level DB helper functions: B710, B717, B051 and their siblings own them."
  - "The click option declarations and the run_server call order: the task B8375 owns the clap root and calls the functions from this task in run_server's order."
  - "save_worker_config: B8375 writes WORKER_CONFIG and B8374 reads it; this task only decodes what it stores."
  - "configure_gc_thresholds, the memory and task routes, /debug/report and /otel-spans in debug_utils.py: B4173, B4174 and B4171 own them."
  - "run_setup_wizard: B8542 builds it and B8375 calls it behind --setup."
  - "generate_feedback_box and the other callers of show_banner (proxy_server.py, the lite CLI shell, the cli_sso_success page): their own tasks call banner::LITELLM_BANNER or show_banner."
  - "_drop_script_dir_from_sys_path, load_dotenv with LITELLM_MODE, sys.path edits and litellm.json_logs: Python import machinery with no native equivalent."
pitfalls:
  - The health command sends no key, so a proxy with a master_key answers 401 with a JSON error body and LiteLLM still prints that body as if it were a health report; do not add an Authorization header or a status check.
  - httpx.get follows no redirects and times out after 5 seconds, but reqwest follows 10 redirects and has no timeout, so both must be set explicitly.
  - reqwest::blocking panics when it is called inside a tokio runtime, so the real transport is only used from the synchronous CLI path; the tests call it from plain test functions that start no runtime.
  - The port fallback applies only to the default 4000, and `random.randint(1024, 49152)` includes both ends, so use `random_range(1024..=49152)`.
  - The fallback port is never probed, and the metrics-port clash check runs afterwards against the new value.
  - connect_ex on a socket.AF_INET socket resolves localhost to IPv4 only, so a listener bound to ::1 alone does not count as in use.
  - needs_ollama is a substring test on the whole model string, so "azure/my-ollama-proxy" matches too, and an explicit api_base of any value, even empty, turns it off.
  - init_verbose_loggers reads LITELLM_LOG only when debug and detailed_debug are both exactly false; debug false with detailed_debug absent never reads it, and an explicit detailed_debug true replaces the Info levels debug set a step earlier.
  - LITELLM_LOG INFO or DEBUG leaves the package logger alone and changes only the router and proxy loggers, while the debug flags change all three.
  - An xai-oauth login with any other second word (or a third word) is the Unknown command error, not a partial match.
  - Keep each module name, type and function name at 30 characters or fewer; an ast-grep rule rejects longer ones.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
