id: B1387
title: Stream Agent Engine chunks through the existing chat iterator
description: >-
  Port the 107 nonblank noncomment lines of get_streaming_response and the two custom
  wrappers at transformation.py L346-L478, together with sse_iterator.py's 72 lines.
  Put typed chunk projection in betterlite-vertex/vertex_agent_stream and the B010 wrapper
  binding in betterlite-provider/adapters/vertex_agent_stream; the leaf does not import
  the provider crate. Use B010's existing line/SSE parser and stream-result contract.
  For each parsed chunk choose the first dictionary part containing text, preserving a
  missing text as None and an empty string as empty. Emit role assistant only for truthy
  text. STOP becomes stop; other truthy finish_reason strings are lowercased. A truthy
  usage_metadata produces prompt/completion/total counts with individual defaults 0;
  missing or empty metadata leaves usage absent. Streaming deliberately does not use
  buffered state_delta fallback or gpt-3.5-turbo counting. Honor generic iterator [DONE]
  and ignored malformed-line behavior without treating snapshots as deltas to subtract.
  Both wrapper variants choose a suitable configured pooled client, POST JSON-serialized
  request data with stream enabled and require status 200. On failure, read the body and
  raise B1386 VertexAgentEngineError; on success wrap the iterator with model/provider
  identity and issue the source's first stream response received post-call event. Retain
  ownership of the HTTP response so downstream cancellation closes it exactly once.
  Helper vertex_agent_chunk cases first_dictionary_text, empty_text_role, lowercase_finish,
  partial_usage and ignored_state_delta call only chunk_parser. Native tests in the leaf
  assert chunk mapping; provider adapter tests sync_async_selection, non_200_body,
  first_response_log, generic_done_marker and cancelled_stream_close verify composition.
  B031 supplies booted chat-stream oracle coverage. Allocate 220 mapping/binding, 180
  lifecycle tests and 100 oracle/helper-seed lines within 550; no new byte decoder is added.
scope:
  paths:
    - crates/betterlite-vertex/src/{lib,vertex_agent_stream}.rs
    - crates/betterlite-vertex/src/vertex_agent_stream.rs
    - crates/betterlite-vertex/src/vertex_agent_stream/**
    - crates/betterlite-provider/src/adapters.rs
    - crates/betterlite-provider/src/adapters/{mod,vertex_agent_stream}.rs
    - crates/betterlite-provider/src/adapters/vertex_agent_stream.rs
    - crates/betterlite-provider/src/adapters/vertex_agent_stream/**
    - tools/oracle/src/helpers/provider/vertex_agent_chunk.rs
    - tools/oracle/src/helpers/provider/vertex_agent_chunk/**
    - tools/oracle/helpers/vertex_agent_chunk.py
    - tools/oracle/helpers/vertex_agent_chunk/**
    - tools/oracle/cases/helpers/vertex-agent-chunk/**
    - tools/oracle/fuzz/corpus/helper_case/vertex_agent_chunk*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/agent_engine/transformation.py#L346-L478
    why: Custom stream execution and first-response logging order.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/agent_engine/sse_iterator.py#L1-L88
    why: First text-part projection, finish normalization and provider usage fields.
dod:
  - text: Agent chunks retain source text, finish and usage semantics independently of buffered response behavior.
    proof: [agent-chunk-tests, agent-chunk-python, oracle]
  - text: Both custom wrappers retain status handling, stream logging and cancellation ownership.
    proof: [agent-stream-binding]
  - text: Newly added helper seeds reach the registered parsed-chunk operation.
    proof: [agent-chunk-seeds]
checks:
  optional: []
  commands:
    - id: agent-chunk-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^vertex_agent_stream::/)'
      why: Chunk tests independently assert empty-role, partial-usage and finish behavior.
    - id: agent-stream-binding
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^adapters::vertex_agent_stream::/)'
      why: Adapter fixtures exercise actual stream ownership and the B010 iterator contract.
    - id: agent-chunk-python
      run: test -f tools/oracle/helpers/vertex_agent_chunk.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Source chunk_parser operates on fixture dictionaries without network IO.
    - id: agent-chunk-seeds
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/vertex_agent_chunk*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::provider::vertex_agent_chunk::/)'
      why: The shared parser must recognize call.vertex_agent_chunk on every added seed.
oracle_cases:
  - tools/oracle/cases/helpers/vertex-agent-chunk/first-dictionary-text.yaml
  - tools/oracle/cases/helpers/vertex-agent-chunk/empty-text-role.yaml
  - tools/oracle/cases/helpers/vertex-agent-chunk/lowercase-finish.yaml
  - tools/oracle/cases/helpers/vertex-agent-chunk/partial-usage.yaml
  - tools/oracle/cases/helpers/vertex-agent-chunk/ignored-state-delta.yaml
deviations: []
out_of_scope:
  - Agent Engine URL/auth/request and buffered-answer methods remain B1386; B031 selects this adapter for chat completion.
  - B010 retains the generic BaseModelResponseIterator decoder, while B005 owns the external chat SSE envelope.
pitfalls:
  - 'The oracle helper for this task is pre-registered as vertex_agent_chunk in the provider group. Replace the stub Op in tools/oracle/src/helpers/provider/vertex_agent_chunk.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vertex_agent_chunk.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Streaming state_delta text is ignored even though buffered Agent Engine responses can use it.
  - Each chunk's first text value is forwarded directly without snapshot differencing.
  - An empty usage_metadata object is absent usage rather than an explicit zero usage block.
budget: {max_changed_lines: 550, max_new_expects: 1}
review_level: standard
