id: B918
title: Response chat request
description: >-
  Build Responses requests from chat options and content with explicit nested text merging, sanitized litellm_params,
  tool conversion, reasoning effort, web search and response_format. Consume response-chat-history and B175 parameter
  outputs; preserve passthrough only in the named bounded provider field.


  Implement crates/betterlite-core/src/api/response_chat_request.rs. Use ResponseChatRequestInput and ResponseChatRequestResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions mixed_text_image_content, reasoning_effort_text_merge, web_search_tool,
  extra_body_overrides, json_schema_text_format under api::response_chat_request::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.reasoning_auto_summary
  defaults to False; env.LITELLM_REASONING_AUTO_SUMMARY defaults to 'false'. No environment reads occur outside
  betterlite-config. Test api::response_chat_request::tests::loads_settings uses the production Config loader and
  an injected environment map, with a named rstest case for every key above, explicit override, unset/default and
  invalid-value/fallback behavior. Keys must be accepted, applied and absent from the unsupported-key report; a
  grep is not proof of support. Add new config_yaml seeds for these keys and replay B002's existing decoder rather
  than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponseChatRequest in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_chat_request: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._map_optional_params_to_responses_api_request
  (L489-L526); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._merge_text
  (L529-L539); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._build_sanitized_litellm_params
  (L541-L558); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._merge_responses_api_request_into_request_data
  (L560-L579); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler.transform_request
  (L581-L659); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._convert_tools_to_responses_format
  (L1117-L1149); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._extract_extra_body_params
  (L1151-L1178); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._map_reasoning_effort
  (L1180-L1197); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._add_web_search_tool
  (L1199-L1225); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler.transform_response_format_to_text_format
  (L1227-L1228); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._transform_response_format_to_text_format
  (L1230-L1275). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 230 owned nonblank/non-comment/non-docstring Python lines (266 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 250 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 536 total within the 540-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B175 (Provider parameter capabilities
  and mapping), B183 (Bounded inline media conversion), B917 (Response chat history), B1087 (Api boundaries), B1136
  (Responses chat content projection), B905 (Responses parameters), B002 (Load LiteLLM config.yaml into typed config).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
