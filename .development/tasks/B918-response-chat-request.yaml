id: B918
title: Assemble Responses requests from chat options
description: >-
  Implement api::response_chat_request with the full request builder and its option,
  metadata, tool, extra_body, reasoning, web-search and response-format methods. B917
  supplies history, B1136 tool choices, B216 custom-tool format conversion, B905 normalized
  stream options and B1138 the optional-field set. B247 supplies logging state whose
  call_type changes to responses before dispatch; debug diagnostics use B012's sink.
  No provider request occurs here.

  Load litellm_settings.reasoning_auto_summary through B002 with default false and
  LITELLM_REASONING_AUTO_SUMMARY with default "false". Effective auto-summary is the
  boolean flag OR an environment string equal to "true" after lowercasing, without trimming.
  Test the real config loader and add seeds to its existing corpus. B171's response_chat_request
  operation compares output records, input mutations and logging effects with the pinned builder.
  Owned functions contain 266 nonblank/non-comment lines, plus the setting declaration. Reserve 280 implementation,
  180 tests, 110 cases, 80 adapters, 55 settings/seeds and 25 wiring lines: 730 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/response_chat_request.rs
  - crates/betterlite-core/src/api/response_chat_request/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/**
  - crates/betterlite-config/src/api/response_chat_request.rs
  - crates/betterlite-config/src/api/response_chat_request/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/response-chat-request-*
  - tools/oracle/src/helpers/core_ops/response_chat_request.rs
  - tools/oracle/src/helpers/core_ops/response_chat_request/**
  - tools/oracle/helpers/response_chat_request.py
  - tools/oracle/helpers/response_chat_request/**
  - tools/oracle/fuzz/corpus/helper_case/response_chat_request-*
  - tools/oracle/cases/helpers/response-chat-request/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L489-L659
  why: Complete request mapping, text merge, metadata sanitization and system-only fallback, without split signatures.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L1117-L1275
  why: Tools, destructive extra_body extraction, reasoning summary flag, web search and JSON schema defaults.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L374-L374
  why: The public reasoning_auto_summary flag starts false.
dod:
- text: >-
    request_option_precedence maps max_tokens=4 then max_completion_tokens=7 to
    max_output_tokens=7; reverse insertion order gives 4. Null values are skipped.
    Every B1138 optional key is forwarded unchanged unless specially mapped: include,
    instructions,max_output_tokens,metadata,parallel_tool_calls,previous_response_id,reasoning,
    store,background,stream,temperature,text,tool_choice,tools,top_p,truncation,user,service_tier,
    safety_identifier,prompt,max_tool_calls,prompt_cache_key,prompt_cache_retention,
    prompt_cache_options,stream_options,top_logprobs,partial_images,context_management.
    Unknown keys disappear. stream_options={include_usage:true,include_obfuscation:false}
    becomes {include_obfuscation:false} via B905, not a chat stream-options object.
  proof: [request-tests, oracle, request-adapter]
- text: >-
    text_format_merge combines verbosity=low with json_schema(name absent,schema absent,
    strict absent) into text={verbosity:low,format:{type:json_schema,name:response_schema,
    schema:{},strict:false}}, in either order. json_object and text become format with
    just that type. Falsy/non-dict/unknown response_format yields no new format. Explicit
    null schema/name/strict is preserved. Existing text fields survive a merge; later
    direct text replaces earlier text. A user string of 65 characters is truncated to
    its first 64 Unicode characters; 64 characters and nonstrings pass unchanged.
  proof: [request-tests, oracle, request-adapter]
- text: >-
    extra_body_and_metadata takes extra_body.reasoning_effort over a top-level value,
    removes extra_body from optional_params and promotes all recognized Responses keys.
    Unsupported extra_body.vendor is dropped from the returned options, despite the
    source docstring promising retention. Sanitization removes every Responses optional
    key from litellm_params, merges metadata then litellm_metadata with the latter winning,
    and omits an empty merged map. Non-dict metadata is ignored; other SDK params survive.
  proof: [request-tests, oracle, request-adapter]
- text: >-
    system_only_and_stream sends [system:"rules"] as one system input_text message
    and no instructions; an empty system string likewise becomes empty input_text.
    With a user message, leading instructions="rules" wins over optional instructions="other".
    optional stream=false plus litellm_params.stream=true still yields stream=true.
    Missing stream defaults false and is omitted unless explicitly mapped. Preserve model,
    client including null and the logging object; nonempty headers become extra_headers,
    empty headers do not overwrite a surviving SDK extra_headers value. Set call_type=responses.
    previous_response_id=resp_a is forwarded and logs
    "Chat provider: Warning ignoring previous response ID: %s"; no session read occurs.
    Pin "Chat provider: Stream parameter: %s" and
    "Chat provider: Final request model=%s, input_items=%s" to the actual values.
  proof: [request-tests, oracle, request-adapter]
- text: >-
    tool_and_search_mapping flattens nested function f into type=function,name=f with
    parameters,strict,description null when absent. Custom names default "", description
    is copied when nonnull and dict format uses B216; already flat/unknown tools pass through.
    web_search_options={} appends {type:web_search}; a dict type=vendor overwrites that type,
    existing tools remain and repeated calls append duplicates. Null options are skipped
    by the mapper; a non-dict nonnull value still adds the bare web_search tool.
  proof: [request-tests, oracle, request-adapter]
- text: >-
    reasoning_summary_policy leaves dict reasoning_effort={effort:low,summary:brief}
    unchanged even when auto-summary is enabled. Scalar low becomes {effort:low} by default
    and {effort:low,summary:detailed} when enabled. loads_reasoning_summary_settings tests
    unset/false, flag=true, env=TRUE, env=" true ", env=1 and env=garbage: only flag=true
    or env=TRUE enables it. Explicit flag=false does not suppress env=true. Invalid YAML
    boolean is a B002 validation error and the recognized keys are absent from unsupported reporting.
  proof: [request-tests, request-settings, request-config-corpus, oracle, request-adapter]
checks:
  optional: [mutants]
  commands:
  - id: request-tests
    why: request merge precedence, side effects or tool mapping differs
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_request::/)'
  - id: request-settings
    why: reasoning settings are declared without loading or application
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::response_chat_request::tests::loads_reasoning_summary_settings($|::)/)'
  - id: request-config-corpus
    why: the existing configuration parser has no auto-summary inputs
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/response-chat-request-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: request-adapter
    why: the real request builder and mutation effects are not compared
    run: test -f tools/oracle/helpers/response_chat_request.py && grep -qE '^[[:space:]]+response_chat_request:' tools/oracle/fuzz/corpus/helper_case/response_chat_request-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/response-chat-request/request-option-precedence.yaml
- tools/oracle/cases/helpers/response-chat-request/text-format-merge.yaml
- tools/oracle/cases/helpers/response-chat-request/extra-body-and-metadata.yaml
- tools/oracle/cases/helpers/response-chat-request/system-only-and-stream.yaml
- tools/oracle/cases/helpers/response-chat-request/tool-and-search-mapping.yaml
- tools/oracle/cases/helpers/response-chat-request/reasoning-summary-policy.yaml
deviations: []
out_of_scope:
- B917 owns history/shared reasoning; B1136 content/choices/annotations; B919 response assembly; B920 iterator construction and streaming; B2412 SSE recovery; the status helper at L1313-L1325 has no caller at the pin.
- B216 owns custom-tool grammar normalization and B921 executes the request over HTTP.
pitfalls:
- 'The oracle helper for this task is pre-registered as response_chat_request in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/response_chat_request.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/response_chat_request.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The source mutates extra_body and discards its unsupported leftovers; its docstring is inaccurate.
- reasoning_auto_summary and its environment flag are ORed, so an explicit false cannot override true in the environment.
- The previous-response warning says the ID is ignored but it remains in the request.
review_level: standard
budget:
  max_changed_lines: 730
  max_new_expects: 1
