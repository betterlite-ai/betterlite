id: B6044
title: Python rerank and arerank
description: >-
  Add `betterlite.rerank(...)` and `betterlite.arerank(...)` so they work where LiteLLM's do (rerank_api/main.py L30-L250).
  Python collects arguments, calls a native session through B6040's path, and builds a `RerankResponse` (B6040) from the JSON.


  Native side, `src/rerank.rs` with `pub(crate) fn register(module: &Bound<'_, PyModule>) -> PyResult<()>`. It adds
  `NativeRerankSession` and `NativeRerankError`. The architect writes the `mod` line, the call line and the `.pyi` import. Do
  not edit `lib.rs`. Methods `rerank` and `arerank` take `(payload_text, blobs)` and return JSON text. Sync uses `block_on`
  inside `py.detach`, async uses `future_into_py`. Conversion code is in `src/rerank/convert.rs`, tests start with `request_`
  and `error_`. It calls the SDK rerank entry.


  Python side, the package `python/betterlite/_rerank/` with an explicit `__all__` (`rerank`, `arerank`), one star line by the
  architect, and `main.py` re-exports. `rerank(model, query, documents, custom_llm_provider=None, top_n=None, rank_fields=None,
  return_documents=True, max_chunks_per_doc=None, max_tokens_per_doc=None, **kwargs)` keeps LiteLLM's names and defaults (a
  test compares `inspect.signature`). `documents` is a list of strings or of dicts and goes to Rust unchanged. `arerank` reads
  the model from `args[0]` or `kwargs["model"]` first, and `rerank(..., _is_async=True)` returns a coroutine. Provider
  specific extras in `kwargs` (for example `truncate` for HostedVLLM, built from `HostedVLLMRerankTruncationParams`) pass
  through. The result is `RerankResponse` with `id`, `results` (`index`, `relevance_score`, optional `document`), and `meta`
  (`api_version`, `billed_units`, `tokens`), plus `_hidden_params` that hold the cost and provider. If a result has no
  `document` and `return_documents` is true, LiteLLM leaves it out, and so does this task.
scope:
  paths:
  - crates/betterlite-python/src/rerank.rs
  - crates/betterlite-python/src/rerank/**
  - crates/betterlite-python/python/betterlite/_native_rerank.pyi
  - crates/betterlite-python/python/betterlite/_rerank/**
  - crates/betterlite-python/python/betterlite/main.py
  - crates/betterlite-python/tests/test_rerank.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rerank_api/main.py#L30-L250
  why: arerank, rerank and the option handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/rerank.py#L1-L95
  why: The response shape that the JSON turns into.
dod:
- text: "`rerank` and `arerank` keep LiteLLM's signatures."
  proof: [rerank-signature]
- text: A call returns a RerankResponse with results, meta and hidden params, sync and async.
  proof: [rerank-call]
- text: String and dict documents, `top_n`, `return_documents` and `rank_fields` reach the server as given.
  proof: [rerank-request]
- text: A provider error raises the matching class.
  proof: [rerank-error]
- text: The native register function adds the session and error class, and conversion has tests without an interpreter.
  proof: [rerank-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: rerank-signature
    why: A changed default breaks callers.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_rerank.py -k signature
  - id: rerank-call
    why: The response loses meta or results order.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_rerank.py -k call
  - id: rerank-request
    why: A dict document is turned into a string.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_rerank.py -k request
  - id: rerank-error
    why: A provider error shows up as a generic exception.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_rerank.py -k error
  - id: rerank-native
    why: The native conversion loses a request field or an error field.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^rerank::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Untyped dicts creep in at the native boundary.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations: []
out_of_scope:
- The `RerankResponse` type and the shared helpers are B6040.
- Provider rerank request code is in the provider tasks and the SDK rerank entry.
pitfalls:
- Keep the order of `results` as the provider gave it. Do not sort by index.
- '`top_n=0` is a value, so test `is None`, not truth.'
review_level: standard
budget:
  max_changed_lines: 900
  max_new_expects: 0
