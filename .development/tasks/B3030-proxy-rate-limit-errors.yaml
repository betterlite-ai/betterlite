dod:
- text: map_v3_rate_limit_type returns RateLimitType::TOKENS for "tokens", RateLimitType::CONCURRENT_REQUESTS
    for "max_parallel_requests", RateLimitType::REQUESTS for "requests", and None for any unrecognized value
    (empty string, null, misspelled variants).
  proof:
  - provider-attribution-tests
  - helper-python
- text: _coerce_message returns empty string for None input, pass-through for string detail, extracts nested
    error.message or message.message from dict detail, JSON-encodes other dict payloads, and converts non-string
    non-dict objects to str without raising.
  proof:
  - provider-attribution-tests
- text: resolve_llm_provider_for_rate_limit with falsy input model ("", None) immediately returns ("", "litellm_proxy")
    before attempting any provider lookup.
  proof:
  - provider-attribution-tests
  - oracle
  - helper-python
- text: resolve_llm_provider_for_rate_limit with non-empty model tries litellm.get_llm_provider first; on success
    returns (resolved_model or input_model, custom_llm_provider or "litellm_proxy"); on failure or None result,
    scans router model_list for matching model_name entry, extracts litellm_params.model underlying value, calls
    get_llm_provider on underlying model, and returns underlying provider if found; if both lookups fail returns
    (original_non_empty_model, "litellm_proxy") with model preserved.
  proof:
  - provider-attribution-tests
  - helper-python
- text: convert_priority_to_percent accepts float/int directly as percent (0.9 → 0.9), accepts dict with type:percent
    and returns value as float, accepts dict with type:rpm and divides value by model_info.rpm (or returns value
    if model_info absent/zero), accepts dict with type:tpm and divides value by model_info.tpm (or returns value
    if absent/zero), and returns float(value) for unrecognized dict type.
  proof:
  - provider-attribution-tests
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: provider-attribution-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-error -p betterlite-rate-limit --no-tests=fail -E 'test(/::provider_attribution_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'provider_attribution' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
