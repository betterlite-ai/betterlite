deviations: []
out_of_scope:
- Rate-limit descriptor construction, window size configuration and counter evaluation are B3031/B3032/B3033;
  router model_list initialization and get_llm_provider execution belong to existing providers (B174).
- RateLimitDescriptor and RateLimitResponse typed records are B3031; integration into async_pre_call_hook
  is B072.
- Prometheus metric label mapping is handled at the error emission point; this task supplies the interface
  values only.
pitfalls:
- 'The oracle helper for this task is pre-registered as b3030 in the oracle group. Replace
  the stub Op in tools/oracle/src/helpers/oracle/b3030.rs with an impl Helper whose Input
  is the typed input, and write run in tools/oracle/helpers/b3030.py. The registry files (helpers/mod.rs,
  the group files, dispatch.py) are not this task''s to edit.'
- resolve_llm_provider_for_rate_limit does not raise exceptions from get_llm_provider or alias scanning; callers
  always get a valid tuple.
- The router model_list is a live reference injected at construction time; it may be empty, absent or not yet
  initialized if get_llm_provider fails before alias fallback runs.
- RateLimitType::CONCURRENT_REQUESTS is the public user-facing name for the v3 limiter's internal "max_parallel_requests"
  string; do not expose the internal string name outside this boundary.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
