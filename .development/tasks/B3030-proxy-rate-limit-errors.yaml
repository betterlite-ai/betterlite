id: B3030
title: Proxy rate-limit errors and provider attribution
description: >-
  Build the shared proxy 429 error classification in betterlite-error with detail/header preservation,
  and implement provider attribution fallback through model resolution and router alias scanning.
  Port the v3 descriptor-to-error projection from litellm/proxy/hooks/parallel_request_limiter_v3.py
  (lines 3488–3537) into betterlite-error and betterlite-rate-limit, preserving retry-after,
  rate_limit_type header, reset_at timestamp formatting, RateLimitErrorCategory assignment and
  historical HTTPException Prometheus label.

  Direct dependencies: B184 provides the base RateLimitError type and HTTP envelope shared across
  provider transports; B174 supplies get_llm_provider resolution; B3031 supplies _get_current_time
  for reset timestamp generation and RateLimitDescriptor/RateLimitResponse typed records for
  _handle_rate_limit_error integration.

  Owned functions map the v3 limiter's internal rate_limit_type strings ("tokens", "requests",
  "max_parallel_requests") onto the public RateLimitType enum, coerce exception detail objects
  to safe strings (extracting nested message fields, JSON-encoding if needed), and build provider
  attribution through two-phase resolution: direct get_llm_provider call, then router alias
  fallback scanning model_list in source order. Defensive fallback returns empty model and
  "litellm_proxy" provider when model is falsy or both lookups fail, never raising secondary
  exceptions from the rate-limit raise path. Implementation stores window_size for reset
  calculation and does not bind to descriptor/counter decision logic (owned by B3031 and later).

  Build tests with named rstest cases for each literal input/outcome: provider string mapping
  with unrecognized values, detail coercion with nested message extraction and JSON fallback,
  and provider resolution with three distinct cases: falsy model input, successful direct
  resolution, and both-lookups-fail fallback.

  Budget 130 Rust impl/tests, 50 route/integration (180 total), 1500 max_changed_lines.
