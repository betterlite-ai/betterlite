id: B831
title: Customer update and deletion routes
description: >-
  Build customer_update in betterlite-server for POST /customer/update, /end_user/update,
  /customer/delete and /end_user/delete; hide the end_user aliases from OpenAPI. Own update_end_user
  L580-L756 and delete_end_user L759-L834 of customer_endpoints.py. Reuse B830's typed table,
  customer response, permission-update and cache helpers, B725 BudgetRepository, B726 EndUserRepository,
  B720 customer rows, B2310 budget rows, B732 principals, B052 authentication and B124 request
  contracts/handle_exception_on_proxy.
  The routes do not use a management wrapper or a new parser. B830's cache helper already includes
  B734 broadcast; do not call it twice.

  UpdateCustomerRequest requires user_id; alias, max_budget, budget_id, allowed_model_region,
  default_model and object_permission default to None, blocked defaults false. Serialize the model
  to a typed record (the source's json() returns a dict, not JSON bytes). Keep non-null fields except
  [], {} and numeric zero, but retain an explicitly supplied boolean, including blocked=false.
  Empty strings survive. Preserve the shared request decoder's extra-field behavior; do not add
  fields from NewCustomerRequest. Missing DB raises "Not connected to DB!". Read the customer with
  its budget; an absent customer raises ProxyException 404 type not_found param user_id.

  Partition retained fields: budget_id is a customer link, fields in LiteLLM_BudgetTable go to the
  budget update, remaining LiteLLM_EndUserTable fields go to the customer. Run B830's permission
  helper first, with the existing permission id. object_permission=null or omission cannot clear
  the link; an object is serialized with its model defaults before B816 merges it, so {} is not
  equivalent to the literal empty-map filter. Test empty object, empty grant lists, new permission
  and merge with existing permissions against the source response.

  If budget fields remain and no related budget exists, create one with created_by/updated_by equal
  to caller user_id or "default_user_id", include end_users, and replace the outgoing budget_id with
  the new id. Otherwise update the current budget, without adding updated_by or validation/reset
  logic from /budget/update. Thus max_budget=0 is ignored, negative values survive, and supplied
  budget_id plus max_budget can update the old budget before relinking the customer to another one.
  There is no transaction across permissions, budget and customer. Before the final write warn and
  remove any residual object_permission. Require nonempty user_id, perform customer update including
  budget and permission relations, fail if no row is returned, evict end_user_id:<id> plus
  end_user_restricted_registry, then use B830's CustomerResponse projection.

  Delete checks DB, then requires a nonempty user_ids list. Query all referenced rows before writing;
  if any id is missing, return 404 not_found param user_ids and delete nothing. Duplicates are kept in
  the original input/message/cache-key list but delete_many counts unique rows. After deletion, evict
  every requested customer key plus the registry, and return deleted_customers with message
  "Successfully deleted customers with ids: " followed by the source list representation. Do not
  delete orphan budgets or permission rows. An empty list takes ValueError (500), not a 400 target
  error. Keep the delete despite a later eviction failure.

  Both routes log their own failures (exception for update, error for delete) then call
  handle_exception_on_proxy: ProxyException keeps 404/not_found and its param; HTTPException keeps
  status but maps to internal_server_error; other exceptions, including no DB, empty ids and
  missing update result, become 500 internal_server_error with openai_error_param's null result.
  Compare error code as serialized, response fields and content-type through HTTP; only message
  wording may be ignored. Permission denial belongs to B052's route policy, not invented handler checks.

  Use B860's Postgres fixture with POSTGRES_TEST_URL or testcontainers and fail if it cannot start.
  postgres_patch_rows covers presence filtering, explicit false, negative/zero budgets, relinking,
  actor fallback and retained permission/budget rows on deletion. postgres_patch_failures injects
  failures after the permission upsert, budget write, customer update and deletion; assert exact
  prior writes and eviction timing. Named native tests missing_update_result and residual_grant_warn
  cover collaborator failures; the remaining branches are named HTTP cases. No settings are read.

  These two functions have 117 nonblank noncomment lines excluding docstrings. Estimate 160 production,
  300 tests and 65 wiring lines, 525 within 575, reusing all B830 response and helper code.
scope:
  paths:
    - crates/betterlite-server/src/customer_update.rs
    - crates/betterlite-server/src/customer_update/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/customer-update/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/customer_endpoints.py#L580-L756
    why: Own update aliases, value filter, ordered writes and error mapping.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/customer_endpoints.py#L759-L834
    why: Own deletion aliases, existence precheck and post-delete eviction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2118-L2141
    why: B124 request defaults and supported patch fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/base.py#L7-L26
    why: json() produces a dict and fields_set() distinguishes explicit false from omission.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8205-L8242
    why: Both route except blocks actually delegate to this mapper.
dod:
  - text: Every named HTTP case drives the real update/delete aliases with source patch and error semantics.
    proof: [oracle, behavior-tests]
  - text: postgres_patch_rows and postgres_patch_failures verify permission/budget/customer ordering and deletion retention.
    proof: [postgres-tests]
  - text: missing_update_result and residual_grant_warn exercise the final-row failure and warning/removal path.
    proof: [behavior-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Require customer patch behavior, not merely a route registration.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^customer_update::tests::/) - test(/replays_the_/)'
    - id: postgres-tests
      why: Verify persisted rows and effects when a later operation fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^customer_update::tests::postgres_patch_rows$/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^customer_update::tests::postgres_patch_failures$/)'
