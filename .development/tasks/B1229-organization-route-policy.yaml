    why: Own organization_role_based_access_check; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks_organization.py#L110-L133
    why: Own get_user_organization_info; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks_organization.py#L136-L173
    why: Own _user_is_org_admin; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks_organization.py#L183-L216
    why: Own add_team_org_context_to_request_body; preserve caller-visible values and failure ordering.
