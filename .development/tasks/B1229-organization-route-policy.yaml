id: B1229
title: Organization route role and request context policy
description: >-
  Implement the pure organization role policy and injected team-context enrichment. Missing user_object
  skips role checks. /organization/new requires user_role=proxy_admin; reject other roles with
  ProxyException 401/auth_error, param user_role, message Only proxy admins can create new organizations
  followed by the caller role. Proxy admins then bypass all remaining checks. For B867 org_admin_only_routes
  (/organization/info, /organization/delete, /organization/member_add, /organization/member_update and
  /organization/member_delete), distinguish memberships=None, absent/null organization_id, no role for the
  selected organization, and a role other than org_admin. Each is 401/auth_error; the first three use param
  organization_id, the last user_role. Preserve the corresponding not-a-member/contact-admin, pass-an-ID,
  no-role-in-selected-organization and required-role messages. An empty membership list reaches the
  missing-ID or no-role branch, unlike None. Other routes are untouched except /team/new.


  /team/new applies its organization constraint whenever memberships is nonempty, even for just one
  membership. Require organization_id or return 401/auth_error, param organization_id, with the source
  message saying multiple organizations and listing IDs. Require org_admin for that ID or return
  401/auth_error, param user_role. Empty/None memberships skip this restriction. No team lookup or DB
  write occurs in role checks. get_user_organization_info skips null IDs, retains duplicate IDs in order
  and lets the last membership overwrite the role map. _user_is_org_admin returns false without a user,
  memberships or candidates; collect a non-null organization_id and append organizations only when it is
  a list, then require admin membership for ALL candidates. It has no proxy-admin shortcut; duplicate
  candidates are harmless, and a singular unauthorized ID is not hidden by an authorized list.


  Context enrichment keeps the input object when organization_id is truthy, not merely present. For
  /team/update read body.team_id; otherwise use the final route path segment only when the supplied route
  template is exactly /team/{team_id}. This avoids lookups for sibling /team/<verb> routes. Nonstring or
  empty team IDs skip lookup. Await the supplied fetch_team_org_id once; falsey results keep the same body,
  truthy results produce a shallow copy replacing organization_id. Explicit null/empty IDs can thus be
  filled from the team. Preserve other fields and let lookup exceptions propagate; never mutate input.


  Build the production organization_route_policy module in betterlite-auth; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks_organization.py:
  organization_role_based_access_check (L13-L107; 80 source lines), get_user_organization_info (L110-L133;
  20 source lines), _user_is_org_admin (L136-L173; 29 source lines), add_team_org_context_to_request_body
  (L183-L216; 31 source lines).


  Compare the pure membership projections, role checks and all-requested-organizations predicate under
  B856 Management::auth, seeding B171 helper_case. Native tests cover asynchronous context lookup and
  booted HTTP cases cover integration through B757's auth error conversion, which preserves these
  ProxyException fields. This module takes typed membership rows and does not fetch them itself.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 160 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  160 production, 260 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 550 changed lines estimated within a 575-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::organization_route_policy::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
