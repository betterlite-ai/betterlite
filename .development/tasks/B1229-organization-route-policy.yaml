  - tools/oracle/cases/helpers/organization-route-policy/caller-org-context-retained.yaml
  - tools/oracle/cases/helpers/organization-route-policy/cross-org-denied.yaml
  - tools/oracle/cases/auth/organization-route-policy/org-admin-team-scope.yaml
  - tools/oracle/cases/auth/organization-route-policy/caller-org-context-retained.yaml
  - tools/oracle/cases/auth/organization-route-policy/cross-org-denied.yaml
deviations: []
