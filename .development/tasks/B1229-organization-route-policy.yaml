id: B1229
title: Organization route role and request context policy
description: >-
  Implement organization_role_based_access_check, user organization membership reads, caller organization-admin
  detection and request team/org context. Preserve a caller-supplied organization_id and the source organizations
  membership test. Return the pinned public failures without changing route normalization or imposing
  a rewritten organization policy.


  Build the production organization_route_policy module in betterlite-auth; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks_organization.py:
  organization_role_based_access_check (L13-L107; 80 source lines), get_user_organization_info (L110-L133;
  20 source lines), _user_is_org_admin (L136-L173; 29 source lines), add_team_org_context_to_request_body
  (L183-L216; 31 source lines).


  Add the organization_route_policy operation under B856 Management::auth. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a organization-route-policy-* seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 160 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  160 production, 139 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 429 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::organization_route_policy::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
scope:
  paths:
    - crates/betterlite-auth/src/organization_route_policy.rs
    - crates/betterlite-auth/src/organization_route_policy/**
    - crates/betterlite-auth/src/lib.rs
    - crates/betterlite-auth/Cargo.toml
    - tools/oracle/src/helpers/organization_route_policy.rs
    - tools/oracle/src/helpers/organization_route_policy/**
    - tools/oracle/helpers/organization_route_policy.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/auth.rs
    - tools/oracle/helpers/management/auth.py
    - tools/oracle/cases/helpers/organization-route-policy/**
    - tools/oracle/fuzz/corpus/helper_case/organization-route-policy-*
    - crates/betterlite-server/src/auth.rs
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/app.rs
    - tools/oracle/cases/auth/organization-route-policy/**
    - crates/betterlite-server/src/auth/organization_route_policy.rs
    - crates/betterlite-server/src/auth/organization_route_policy/**
  lint_tables: false
