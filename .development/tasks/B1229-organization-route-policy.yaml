    why: Auth exceptions become public HTTP type, param and code.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: org_admin_team_scope,
      caller_org_context_retained, cross_org_denied.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^organization_route_policy::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/organization_route_policy.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/organization-route-policy-*")"
        && grep -rlq "organization_route_policy" tools/oracle/fuzz/corpus/helper_case/organization-route-policy-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::organization_route_policy::tests::/)
        - test(/replays_the_/)'
oracle_cases:
