out_of_scope:
  - B867 owns the org-admin route allowlist; B757 owns public auth exception handling. Callers supply the team-org lookup.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as organization_route_policy in the server group. Replace the stub Op in tools/oracle/src/helpers/server/organization_route_policy.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/organization_route_policy.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The /team/new error mentions multiple organizations although one membership is enough to require organization_id.
  - An explicit null or empty organization_id does not suppress team-derived enrichment.
  - _user_is_org_admin requires every candidate organization and does not special-case proxy admins.
