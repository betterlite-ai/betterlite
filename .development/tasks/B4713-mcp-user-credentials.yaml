id: B4713
title: MCP per-user credential persistence and expiry
description: >-
  Build BYOK and OAuth2 credential storage, legacy decoding, expiry classification
  and secret-free credential summaries in betterlite-db. Per-user credentials are
  stored in LiteLLM_MCPUserCredentials, encrypted with the global salt key, with
  both BYOK API keys and OAuth2 tokens sharing the same column and distinguished
  by JSON structure.

  Credential storage: store_user_credential encrypts and persists a BYOK API key.
  store_user_oauth_credential JSON-encodes an OAuth2 payload with access_token,
  optional refresh_token, expires_in (converted to expires_at ISO string), optional
  scopes, and optional identity_binding_proof (the proof object from identity-binding
  validation, stored as a JSON field included only when present). The function accepts
  a skip_byok_guard flag to allow callers to skip the read-before-write check during
  refresh. The guard itself refuses to overwrite a readable BYOK row with an OAuth token,
  but allows replacement when the row is undecryptable (written under an old
  LITELLM_SALT_KEY) or when it decodes to something unparseable (no live secret to preserve).

  Credential retrieval: get_user_credential decrypts a BYOK value (or None if
  unreadable). get_user_oauth_credential decrypts, parses and returns an OAuth
  payload (or None if absent, unreadable or not OAuth2), with a warning logged
  when decryption fails.

  Credential deletion: delete_user_credential removes the row by user_id/server_id
  composite key. OAuth token revocation uses this same delete path; BYOK rows are
  not affected.

  Expiry classification: is_oauth_credential_expired checks the expires_at field
  (ISO string, treated as UTC if unaware) and optionally applies a buffer_seconds
  grace period. Absent or unparseable expires_at is treated as non-expired.
  oauth_grant_state returns one of "valid" (token exists and not expired),
  "refreshable" (expired but has refresh_token), or "absent" (no access_token or
  no state at all), using MCP_PER_USER_TOKEN_EXPIRY_BUFFER_SECONDS as the buffer.

  Legacy decoding: _decode_user_credential tries B1600's decrypt_value_helper
  first with exception_type="debug" and return_original_value=False. If that
  returns None, it falls back to plain urlsafe_b64decode (for rows written by
  older code before encryption was added). Returns None if both paths fail
  (binascii.Error, UnicodeDecodeError, ValueError, TypeError). _warn_undecryptable_credential
  logs that the user must re-authorize.

  Credential parsing: _parse_oauth_payload checks if a decoded string parses as
  JSON with "type": "oauth2", else returns None (so BYOK credentials, which are
  plain strings, return None). _decode_oauth_payload is the composed helper.

  Credential summaries: _server_user_credential_item builds a
  MCPServerUserCredentialListItem from a row without the secret: BYOK rows include
  only user_id, credential_type="byok" and updated_at; OAuth rows add
  credential_type="oauth2", expires_at, connected_at from the payload.
  list_server_user_credentials returns all credentials for a server (admin visibility,
  secret-free). list_user_oauth_credentials returns all OAuth credentials for a user,
  tagged with server_id, and logs a warning for each row that fails to decrypt.

  Keep readable BYOK values protected from OAuth overwrite while allowing replacement
  of undecryptable or empty old values. Preserve BYOK rows when OAuth tokens are
  revoked.

