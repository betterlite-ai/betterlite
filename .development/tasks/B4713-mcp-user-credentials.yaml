deviations:
  - what: The Rust type for secret-free credential items is McpUserCredentialListItem (25 characters)
      rather than the LiteLLM class name MCPServerUserCredentialListItem (31 characters).
    why: Rust identifier length is capped at 30 characters per repository rules. The shorter
      name preserves the semantic meaning while fitting the constraint.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1686-L1702
  - what: identity_binding_proof is stored as an optional JSON field in OAuthCredentialPayload
      and is only included in the serialized payload when present (non-None).
    why: LiteLLM includes this field conditionally using the dict spread operator (line 1601).
      This task owns the payload contract and ensures the field is properly handled during
      serialization and retrieval.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1597-L1608
  - what: _decode_user_credential uses exception_type="debug" for decrypt_value_helper and return_original_value=False.
    why: LiteLLM logs at debug level for user credential decryption failures to avoid alarming operators for rows written under old keys; return_original_value=False ensures we fail cleanly rather than returning ciphertext.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1389-L1394
  - what: Undecryptable credentials (decrypted=None from decrypt_value_helper) are replaced by store_user_oauth_credential with a warning log.
    why: LiteLLM logs a warning when replacing undecryptable BYOK with OAuth (lines 1628-1634); we match this to allow recovery when a user re-authorizes under a new key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1628-L1634
  - what: Absent or unparseable expires_at in is_oauth_credential_expired is treated as non-expired (returns False).
    why: LiteLLM's behavior (lines 1650-1651) is to assume a token without expiry is valid, allowing fallback to implicit provider defaults when the field is absent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1649-L1658
  - what: oauth_grant_state uses MCP_PER_USER_TOKEN_EXPIRY_BUFFER_SECONDS (a constant from LiteLLM) for the default buffer.
    why: LiteLLM applies this buffer (line 1665) to decide whether to proactively refresh; betterlite preserves this threshold.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L1661-L1667

out_of_scope:
  - _db_find_user_credential_row, _db_upsert_user_credential_row, _user_credential_actions (owned by B4711 table access).
  - encrypt_value_helper and decrypt_value_helper (owned by B1600).
  - MCPCredentials type and credential class hierarchy (owned by Q1, _types.py).
  - manager invalidate_user_oauth_token_cache callback (owned by Q2, service layer).
  - MCP_PER_USER_TOKEN_EXPIRY_BUFFER_SECONDS constant (already present in litellm.constants).

pitfalls:
  - _decode_user_credential must try decrypt_value_helper with return_original_value=False, else ciphertext
    returns from an old salt key and spreads to the caller. The base64 fallback means old rows that were written
    plaintext (before encryption was added) still work.
  - store_user_oauth_credential's BYOK guard only protects rows that decode successfully. If a row is
    undecryptable, the guard allows overwriting it; this is intentional, as the user has no live secret
    to preserve and re-authorization is their only path forward.
  - oauth_grant_state applies the buffer to the expiry check only when deciding if a token is valid;
    a caller that wants an absolute remaining time must subtract buffer_seconds themselves.
  - list_user_oauth_credentials logs a warning for each row that fails to decrypt and continues, not failing.
    This matches LiteLLM's behavior to avoid breaking listing when a single row becomes unreadable.
  - The expires_at field is an ISO string stored in the OAuth payload, not a separate timestamp column.
    Parsing must handle both aware and naive datetimes, defaulting to UTC.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
