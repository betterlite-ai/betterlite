dod:
  - text: >-
      _decode_user_credential tries decrypt_value_helper with key "mcp_user_credential",
      exception_type="debug", return_original_value=False, then urlsafe_b64decode,
      returning None on any decode failure.
    proof: [credential-tests]
  - text: >-
      _warn_undecryptable_credential logs that the credential could not be decrypted
      (likely written under a previous LITELLM_SALT_KEY) and the user must re-authorize.
    proof: [credential-tests]
  - text: >-
      _parse_oauth_payload returns the payload dict if decoded holds a JSON object
      with "type": "oauth2", else None.
    proof: [credential-tests]
  - text: >-
      _decode_oauth_payload composes _decode_user_credential and _parse_oauth_payload.
    proof: [credential-tests]
  - text: >-
      store_user_credential encrypts the credential with encrypt_value_helper and
      upserts it using the composite key.
    proof: [credential-tests]
  - text: >-
      get_user_credential decrypts and returns the stored credential, or None if absent.
    proof: [credential-tests]
  - text: >-
      delete_user_credential removes the row by user_id/server_id composite key.
    proof: [credential-tests]
  - text: >-
      store_user_oauth_credential builds OAuthCredentialPayload with type="oauth2",
      access_token, connected_at (current UTC ISO), and optional refresh_token, expires_at
      (calculated from expires_in), scopes, and identity_binding_proof (included as JSON
      field only when the parameter is present and non-None).
    proof: [credential-tests, identity-binding-proof]
  - text: >-
      store_user_oauth_credential with skip_byok_guard=false reads the existing row,
      decodes it, and refuses to overwrite if it is readable BYOK (decoded but not OAuth2).
      It allows replacement if the row is absent, undecryptable or decodes to something
      unparseable.
    proof: [credential-tests, byok-guard]
  - text: >-
      is_oauth_credential_expired parses expires_at as ISO string (assuming UTC if unaware),
      applies buffer_seconds, and returns false for absent or unparseable expires_at.
    proof: [credential-tests, expiry-buffer, expiry-absent]
  - text: >-
      oauth_grant_state returns "valid" if access_token exists and not expired
      (using MCP_PER_USER_TOKEN_EXPIRY_BUFFER_SECONDS buffer), "refreshable" if
      expired with refresh_token, "absent" otherwise.
    proof: [credential-tests, grant-valid, grant-refreshable, grant-absent]
  - text: >-
      get_user_oauth_credential decrypts, parses and returns the OAuth payload,
      logging a warning and returning None if decryption fails.
    proof: [credential-tests]
  - text: >-
      _server_user_credential_item builds McpUserCredentialListItem with user_id,
      credential_type ("byok" or "oauth2"), and type-specific fields (expires_at,
      connected_at for OAuth2; updated_at for both).
    proof: [credential-tests, list-item-type]
  - text: >-
      list_server_user_credentials queries all credentials for a server and returns
      secret-free summaries.
    proof: [credential-tests]
  - text: >-
      list_user_oauth_credentials returns all OAuth credentials for a user, tagged
      with server_id, logging a warning for each row that fails to decrypt.
    proof: [credential-tests]
  - text: >-
      OAuthCredentialPayload TypedDict with required access_token field and optional
      refresh_token, expires_at, connected_at, scopes, identity_binding_proof, type,
      and server_id fields.
    proof: [credential-tests, oauth-types]
  - text: >-
      OAuthGrantState Literal type with "valid", "refreshable", and "absent" variants.
    proof: [credential-tests, oauth-types]
  - text: >-
      Every default, env var, config key, error, and warn-and-drop path a user
      can observe is in a named case with literal input and outcome.
    proof: [credential-tests]
  - text: New oracle helper operation for MCP user credentials integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]
  - text: Every mutant in the credential functions is caught by a test.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: credential-tests
      why: >-
        Credential storage, retrieval, deletion, OAuth guarding, expiry checks
        or legacy decoding is missing or fails on edge cases.
      run: >-
        cargo nextest run --locked -p betterlite-db --no-tests=fail
        -E 'test(/^mcp_user_credentials::/) - test(/replays_the_/)'
    - id: identity-binding-proof
      why: >-
        store_user_oauth_credential does not handle the identity_binding_proof
        parameter or does not include it in the payload.
      run: >-
        grep -qE 'identity_binding_proof' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*identity.*proof/)'
    - id: list-item-type
      why: >-
        McpUserCredentialListItem type is missing or does not include required fields.
      run: >-
        grep -qE 'struct McpUserCredentialListItem|McpUserCredentialListItem' crates/betterlite-db/src/mcp/user_credentials.rs &&
        grep -qE 'user_id|credential_type' crates/betterlite-db/src/mcp/user_credentials.rs
    - id: oauth-types
      why: >-
        OAuthCredentialPayload or OAuthGrantState type definitions are missing.
      run: >-
        grep -qE 'OAuthCredentialPayload|OAuthGrantState' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*type/)'
    - id: helper-python
      why: >-
        The referenced helper adapter is missing or strict Python checking fails.
      run: >-
        test -f tools/oracle/helpers/b4713.py &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: >-
        The new typed operation has no seed or HelperCase decoder fails replay.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/mcp-user-credentials-*)" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: byok-guard
      why: >-
        BYOK guard logic does not preserve readable BYOK rows or allow
        replacement of undecryptable/empty rows.
      run: >-
        grep -qE 'fn store_user_oauth_credential' crates/betterlite-db/src/mcp/user_credentials.rs &&
        grep -qE 'skip_byok_guard|readable.*BYOK' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*byok.*guard/)'
    - id: expiry-buffer
      why: >-
        is_oauth_credential_expired does not apply buffer_seconds when comparing to now.
      run: >-
        grep -qE 'fn is_oauth_credential_expired' crates/betterlite-db/src/mcp/user_credentials.rs &&
        grep -qE 'buffer_seconds|+ timedelta' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*expiry.*buffer/)'
    - id: expiry-absent
      why: >-
        is_oauth_credential_expired does not treat absent expires_at as non-expired.
      run: >-
        grep -qE 'fn is_oauth_credential_expired' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*expiry.*absent/)'
    - id: grant-valid
      why: >-
        oauth_grant_state does not return "valid" for non-expired tokens.
      run: >-
        grep -qE 'fn oauth_grant_state' crates/betterlite-db/src/mcp/user_credentials.rs &&
        grep -qE '"valid"|OAuthGrantState::Valid' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*grant.*valid/)'
    - id: grant-refreshable
      why: >-
        oauth_grant_state does not return "refreshable" for expired tokens with refresh_token.
      run: >-
        grep -qE 'fn oauth_grant_state' crates/betterlite-db/src/mcp/user_credentials.rs &&
        grep -qE '"refreshable"|OAuthGrantState::Refreshable' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*grant.*refreshable/)'
    - id: grant-absent
      why: >-
        oauth_grant_state does not return "absent" for missing access_token.
      run: >-
        grep -qE 'fn oauth_grant_state' crates/betterlite-db/src/mcp/user_credentials.rs &&
        grep -qE '"absent"|OAuthGrantState::Absent' crates/betterlite-db/src/mcp/user_credentials.rs &&
        cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^mcp_user_credentials::tests::.*grant.*absent/)'

