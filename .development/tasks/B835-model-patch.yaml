pitfalls:
  - A team-internal rewritten model_name does not satisfy the route's three-part global rename condition.
  - The audit event is enqueued before degraded-serving rejection, but after clear_cache completes.
  - HTTPException bypasses this route's 500 wrapper and must retain the outer server's own envelope.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
