id: B835
title: Patch stored models and report serving reload results
description: >-
  Register PATCH /model/{model_id}/update through B052 authentication and implement patch_model.
  B836 owns both update_db_model and _update_team_model_in_db, so this handler calls the completed
  merge/assignment service without an upward dependency. Separate /model/block and /model/unblock
  belong to B1214. This route can still patch blocked, subject to its own admin-only check.

  Read the resolved general_settings.store_model_in_db flag, default false; null YAML becomes false.
  B124's startup resolution enables it through STORE_MODEL_IN_DB or an existing true YAML value
  (env false cannot turn YAML true off). When still not true, a DB general_settings record can enable
  it with true or case-insensitive string "true"; read failures are debug-logged and ignored. B124
  owns that bootstrap and reload logic, B002 owns the typed loader. This task proves the resolved flag
  is actually used: disabled yields 400 validation_error, param null, message "Model updates only
  supported for DB-stored models". Test absent/null/false/true YAML and env enablement/false precedence,
  plus DB enablement and failed DB lookup through the production configuration path.

  Missing prisma_client raises HTTPException 500 with CommonProxyErrors.db_not_connected_error in
  detail.error, explaining that DATABASE_URL must be a PostgreSQL connection string. Fetch the stored
  deployment through B1213.get_db_model. A missing row that B302 finds in configured router entries
  gives 400 validation_error, param null, "Cannot edit config-based model. Store model in DB via
  /model/new first." Otherwise missing before or after the write gives 404 not_found_error, param null,
  "Model <id> not found on proxy." These are distinct branches with distinct cases.

  B832.can_user_make_model_call authorizes member_operation=update against the existing deployment and
  incoming patch. B1213 computes the member auto-router marker. For a MemberAutoRouterWrite, when a
  marker exists, discard incoming model_name and build marker model_info from the existing ID; other
  authorized writes retain their patch information. A non-null blocked, including false, from any
  non-PROXY_ADMIN caller gives 403 auth_error, param blocked, "Only proxy admins can change a model's
  blocked flag." Next enforce credential attachment with null_detaches=true, validate the selected
  credential name, enforce AWS session-tag privileges and reject strategy-router write violations,
  in that order. B832 and B1213 own each policy; test that refusal happens before any model row write.

  Compute the effective complexity params and give B836 a write_row closure. It records the model_name
  it will store, sets updated_by to caller user_id or proxy admin name, sets updated_at from the UTC
  clock, and updates by model_id inside B834._auto_router_capability_slot with the effective params
  and member-write authorization. B836 handles encryption and writes before team grants; this task
  must preserve its partial effects. Only when stored_model_name is non-null, equals the original
  requested name and differs from the old name, call B820.sync_access_groups_for_renamed_model, then
  B837.sync_model_allowlists_for_renamed_model. A team-internal rewritten name or no-op rename must not
  run that pair. Neither synchronization is part of the completed model transaction.

  After rename effects, take B841.live_model_ids_snapshot and await clear_cache. Enqueue
  B065.create_object_audit_log with action=updated, table=LiteLLM_ProxyModelTable, object_id=model_id,
  before/after model_dump_json(exclude_none=True), caller user_id as litellm_changed_by and
  LITELLM_PROXY_ADMIN_NAME="default_user_id" as fallback. This route reads no changed-by request header.
  Use tracked asynchronous delivery; B065 owns enablement, its premium guard and durable writes.
  MIT fixtures observe no durable audit row without that guard, while native integration checks the
  B065 deviation. Then pass BOTH still_desired and live_after from the reload result to
  B841.raise_if_reload_degraded_serving with action=update. Its 500 internal_server_error, param null,
  explains that the update was saved but the affected/collateral models are not served on this pod;
  the database row and already-enqueued event remain. A clear_cache exception occurs before audit
  enqueueing. Return the updated row only after this check succeeds.


  Build the production model_patch module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  patch_model including its write_row closure (L1093-L1320; 194 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  The route's own except block logs the exception, passes HTTPException and ProxyException through
  unchanged, and wraps anything else as 500 internal_server_error, param null, "Error updating model:
  <error>". It never calls handle_exception_on_proxy. B001 HttpCase compares the exact public envelope
  from the booted proxy for each branch, including the HTTPException path's outer B003 handler, code,
  type, param, status and content-type. Keep request/schema errors with B003/B1213's decoder.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 194 nonblank, noncomment pinned source lines; allow 220 production, 300 behavior/Postgres
  tests, 65 route/wiring and 65 config tests, 650 changed lines within a 700-line gate. No helper
  adapter or new byte decoder is needed. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
