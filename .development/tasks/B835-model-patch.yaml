dod:
  - text: 'patch_preflight covers no_database, storage_disabled, config_only_model, unknown_model,
      missing_after_write, unauthorized_patch, member_marker_restricts_fields, blocked_false_admin_only,
      credential_null_detaches, unknown_credential, aws_session_tag_denied, strategy_router_denied,
      http_exception_unchanged, proxy_exception_unchanged and unexpected_error_500.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: 'postgres_pinned_rows covers patch_preserves_secret, clear_credential, actor_and_updated_at,
      capability_slot_arguments, rename_sync_in_order, no_op_rename_skips_sync,
      rewritten_team_name_skips_sync and audit_event_fields. postgres_failure_effects covers
      preflight_no_write, grant_failure_keeps_row, rename_sync_failure_keeps_row,
      clear_cache_failure_before_audit, degraded_reload_after_audit and collateral_serving_loss.'
    proof:
      - postgres-tests
  - text: 'Production loader tests storage_default_and_null, storage_env_enables,
      storage_env_false_preserves_yaml and storage_db_enable_or_debug_failure prove the route receives
      the resolved flag; all use the existing loader and B124 bootstrap, not a duplicate parser.'
    proof: [config-tests, config-corpus, behavior-tests]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_patch::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/model_patch::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/model_patch::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: A resolved storage flag does not reach the PATCH policy.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::model_patch::tests::/)'
    - id: config-corpus
      why: The new model storage config seed is absent or the production parser fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/model-patch-*')" && grep -rlq store_model_in_db crates/betterlite-config/fuzz/corpus/config_yaml/model-patch-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
