deviations:
- what: The retry_after byte parser rejects inputs over 8192 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/get_retry_from_policy.py#L19-L70
out_of_scope:
- Provider calls and stream retries.
pitfalls:
- A per-model retry policy replaces the global policy rather than merging unset fields.
- Retry count excludes the initial attempt.
- Do not let a policy override a request's explicit num_retries zero.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
