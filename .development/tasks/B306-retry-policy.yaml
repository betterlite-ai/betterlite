id: B306
title: Retry policy selection and backoff decisions
description: 'Implement a pure typed retry decision module over B011 errors, model-group policy, request
  overrides and candidate availability. Include retry-after parsing and bounded backoff with an injected
  random source and clock. Reuse a maintained backoff/date parser where it preserves the oracle''s decisions;
  do not put an async retry loop in this part. Add a parser corpus for Retry-After input and config corpus
  seeds for each named exception policy. Configuration boundary keys introduced or consumed here: retry_policy,
  model_group_retry_policy, num_retries, retry_after, INITIAL_RETRY_DELAY, MAX_RETRY_DELAY, JITTER. Pinned
  declaration defaults: retry_policy=None; model_group_retry_policy=None; num_retries=0; retry_after=0.
  Resolve env values once in betterlite-config, never in router code. Policy fields are BadRequestErrorRetries,
  AuthenticationErrorRetries, TimeoutErrorRetries, RateLimitErrorRetries, ContentPolicyViolationErrorRetries,
  InternalServerErrorRetries, ServiceUnavailableErrorRetries, NotFoundErrorRetries and DefaultRetries,
  each absent by default. INITIAL_RETRY_DELAY=0.5, MAX_RETRY_DELAY=8.0 and JITTER=0.75 are environment
  defaults; retry_after defaults to 0. Implement the owned native service in crates/betterlite-router/src/retry_policy.rs.
  Add ProbeOperation::RetryPolicy in tools/oracle/src/router_probes/mod.rs and the corresponding B306 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_utils/get_retry_from_policy.py: _retries_for_a_404_answer
  (L32-L34), _resolve_policy (L37-L49), get_num_retries_from_retry_policy (L52-L66), reset_retry_policy
  (L69-L70). Implement these behaviors through the typed Rust services above; synchronous facades and
  structural accessors reuse the same primitive instead of separate ports. Bound the retry_after outside-byte
  parser to 8192 bytes before decoding; on excess use its typed invalid-input outcome (classifier/observation
  consumers keep their pinned warning/fallback path).'
