id: B3459
title: S3 Vectors RAG embedding and storage workflow
description: >-
  Build the workflow half of LiteLLM's S3VectorsRAGIngestion in a new module `s3_vectors_workflow` of the betterlite-rag crate. B3458 (module `s3_vectors_ingestion`)
  already owns the signed calls GetVectorBucket/CreateVectorBucket, GetIndex/CreateIndex and PutVectors, and the two config helpers `s3_vectors_ingest_target` and
  `s3_vectors_ingest_embedding_options`. This task owns the settings, the dimension probe, the lazy initialization, `embed` and `store`. Import B3458's items and never copy them.
  `query_vector_store` has no caller at the pin and is not built.

  Signing. Never write SigV4 code. Every S3 Vectors request is signed by B3456's `BedrockRagClients::signed_request_with(service, signing_region, method, url, headers, body)` with
  service "s3vectors" (B3456 holds the credential resolution for the ten aws_* keys and the injected `AwsRagTransport`). B3458's four calls are the only place that sends a request.
  This task builds the `BedrockRagClients` value from the S3 Vectors settings (the ten credential keys and the region) and passes it to B3458's calls. Read the exact constructors and
  method names in crates/betterlite-rag/src/bedrock_ingestion and crates/betterlite-rag/src/s3_vectors_ingestion before writing; if B3456's constructor only takes its own Bedrock
  settings record, fill that record with the ten keys and the region and leave its Bedrock fields at their defaults. Put the three calls this task makes behind a small trait
  `S3VectorsApi` (ensure_bucket, ensure_index, put_vectors) declared in this task's `workflow` module, implement it once for B3458's client type, and test the flow against a
  recording fake of the trait.

  Module `settings`. `S3VectorsSettings` is built from the S3 Vectors vector store record that B3450 and B5134 define in betterlite-config (read crates/betterlite-config/src/rag/document.rs;
  do not edit it, and report a missing key as a blocker) and the optional embedding options of the ingest request (`model`). Fields and defaults, as in `__init__` (L88-L121):
  (1) `vector_bucket_name` and `index_name: Option<String>` from B3458's `s3_vectors_ingest_target`; its ValueError text is "vector_store_id must be in format 'bucket_name:index_name' for S3 Vectors,
  or vector_bucket_name must be provided in litellm_params" and it surfaces as this module's `SettingsError::Target`. (2) `embedding_model: Option<String>` from `s3_vectors_ingest_embedding_options`,
  which replaces the request's embedding options when the store config holds litellm_embedding_model or embedding_model. (3) `distance_metric`, default env S3_VECTORS_DEFAULT_DISTANCE_METRIC, else "cosine".
  (4) `non_filterable_metadata_keys`, default ["source_text"]. (5) `dimension: Option<i64>`, set only when the key `dimension` is present (L158-L167); absent means "detect later". The default for a failed
  or skipped probe is env S3_VECTORS_DEFAULT_DIMENSION, else 1024; read both env vars through B198's env helpers and the real config loader, never std::env directly in the module.
  (6) `aws_region_name`: the explicit value only when non-empty, passed to B591's non-LLM region function (explicit, then AWS_REGION_NAME, AWS_REGION, us-west-2, validated).
  (7) the ten credential keys, held as secrecy values where secret. (8) `ssl_verify` (a bool or a CA bundle path) is parsed and kept; see deviations. The record is validated once at construction,
  so a bad value is a typed `SettingsError`, never a panic.

  Module `dimension`. `detect_dimension(embedder, embedding_model)` (L123-L156). With no embedding model (the options are absent or hold no `model`) it returns the default dimension and sends nothing.
  Otherwise it calls the injected `RagEmbedder` with the model and the one-element input ["test"] and returns the length of the first vector. An empty answer returns the default. Any `EmbedError` is logged
  at warning level ("Could not auto-detect dimension from embedding model: {error}. Using default dimension of {default}.") and returns the default; this is the only place a failure is swallowed.
  `RagEmbedder` is a trait declared here: `embed(model: &str, input: Vec<String>) -> Result<Vec<Vec<f64>>, EmbedError>`. Python calls router.aembedding when a router exists and litellm.aembedding
  otherwise; the caller (B3460) picks and wires one implementation, so this crate never imports the router or betterlite-core except in the trait impl below.

  Module `workflow`. `S3VectorsWorkflow` holds the settings, the `S3VectorsApi`, the `RagEmbedder`, a `unique_id: String` (8 lowercase hex characters from the caller; Python takes uuid4().hex[:8])
  and the `initialized` flag. `ensure_config_initialized` (L169-L189): return at once when initialized; if dimension is unset, set it from `detect_dimension`; call ensure_bucket; if index_name is unset,
  set it to "litellm-index-{unique_id}"; call ensure_index with bucket, index, dimension, distance metric and non-filterable keys; set the flag last. The dimension and index name stay set after a failure,
  so a retry reuses them and runs the probe only once; only the flag is withheld.
  `embed(chunks)` (L399-L428): empty chunks return `None`. With no embedding model it logs the warning "No embedding config provided, using default text-embedding-3-small" and stores that model in the settings.
  It then calls the embedder once with all chunks and returns the vectors in order. An embedder error propagates as `WorkflowError::Embed`.
  `store(file_content, filename, content_type, chunks, embeddings, existing_file_id)` (L430-L493): file_content, content_type and existing_file_id are ignored. Call `ensure_config_initialized` first.
  Then if embeddings are absent or empty, or chunks are empty, log the message at error level and return `WorkflowError::NoContent` carrying exactly the text in LiteLLM (L452-L460). Otherwise build one entry per
  pair of (chunk, embedding), stopping at the shorter list (Python zip): key "{filename}_{i}" when filename is non-empty, else "chunk_{i}"; data {"float32": vector}; metadata {"source_text": chunk,
  "chunk_index": "{i}"} plus "filename" when filename is non-empty. Call put_vectors once with all entries and return ("{bucket}:{index}", filename). Entries are typed structs with the AWS field names.

  Module `ingest`. Implements the ingestion trait that B3451 declares in betterlite-core `rag::ingestion` for `S3VectorsWorkflow`, forwarding `embed` and `store`. Read the exact trait and method names in
  crates/betterlite-core/src/rag/ingestion.rs first. Add the betterlite-core path dependency to crates/betterlite-rag/Cargo.toml only for this module (B3457 does the same for its impl); settings, dimension and workflow
  stay free of betterlite-core. Each module that can fail owns its error enum (`SettingsError`, `WorkflowError`, `EmbedError`) and none carries a credential.

