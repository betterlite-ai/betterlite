dod:
  - text: Settings take bucket and index from B3458's target helper, the embedding model from its options helper, and apply the defaults for distance metric, non-filterable keys, region and credential keys; dimension stays unset unless the key is present.
    proof: [settings-tests, oracle]
  - text: A bad target or a bad typed value is a typed SettingsError, and no error value carries a credential.
    proof: [settings-tests]
  - text: detect_dimension sends nothing without an embedding model, probes with the single input "test", returns the first vector length, and returns the default dimension on an empty answer or any embedder error.
    proof: [dimension-tests, oracle]
  - text: ensure_config_initialized probes only when dimension is unset, creates the bucket, generates "litellm-index-{unique_id}" when no index is set, creates the index with the resolved values and sets the flag last; a failure keeps dimension and index name and leaves the flag unset.
    proof: [flow-tests, oracle]
  - text: embed returns None for no chunks, falls back to text-embedding-3-small when no model is set, and returns the vectors in order.
    proof: [embed-tests, oracle]
  - text: store initializes first, rejects missing or empty embeddings or chunks with the exact NoContent text, builds keys and metadata with and without a filename, truncates to the shorter list, sends one put_vectors and returns "{bucket}:{index}" with the filename.
    proof: [store-tests, oracle]
  - text: The ingestion trait impl from B3451 forwards embed and store, and S3 Vectors requests are signed only through B3456's signed_request_with with service "s3vectors".
    proof: [store-tests, signing-check]
  - text: The helper adapter passes strict lint and type checks.
    proof: [helper-python]

checks:
  optional: []
  commands:
    - id: settings-tests
      why: settings parsing, defaults or typed errors are missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_workflow::(.*::)?tests::settings_/)'
    - id: dimension-tests
      why: the dimension probe or its fallback is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_workflow::(.*::)?tests::dimension_/)'
    - id: flow-tests
      why: the lazy initialization flow or its retry rule is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_workflow::(.*::)?tests::flow_/)'
    - id: embed-tests
      why: embed, its default model or its empty-input result is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_workflow::(.*::)?tests::embed_/)'
    - id: store-tests
      why: store, its entries, its error text or the trait impl is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_workflow::(.*::)?tests::store_/)'
    - id: signing-check
      why: the workflow does not sign through B3456's signed_request_with for s3vectors
      run: grep -rq 'signed_request_with' crates/betterlite-rag/src/s3_vectors_workflow crates/betterlite-rag/src/s3_vectors_ingestion.rs
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3459)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3459 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3459/pyrightconfig.json

