deviations:
  - what: Signing and sending go through B3456's signed_request_with and the injected AwsRagTransport, not LiteLLM's requests plus botocore SigV4Auth and its pooled httpx client.
    why: One signing path for every AWS call, and the rules forbid hand-rolled SigV4. Oracle cases compare the operation order and AWS-named parameters from a recording fake on the Python side.
  - what: The per-store ssl_verify value is parsed and kept but does not change TLS checks. The deployment's pooled client decides them.
    why: B173's client is shared and built once, so a request cannot lower or replace its trust store. Open question in notes.
  - what: The embedding call is made through an injected RagEmbedder trait instead of choosing between router.aembedding and litellm.aembedding here.
    why: This crate cannot import the router; B3460 supplies one implementation that does the same choice.
  - what: A non-integer dimension, or a distance metric that is not text, is a typed SettingsError at construction.
    why: Python would fail later with TypeError or send the value on to AWS; the declared types make it an input error.

out_of_scope:
  - "_sign_and_execute_request, _ensure_vector_bucket_exists, _ensure_vector_index_exists and _put_vectors: B3458 owns them; this task calls them through S3VectorsApi."
  - "s3_vectors_ingest_target, split_s3_vectors_store_id and s3_vectors_ingest_embedding_options: B3458 owns them (B5134 says so too); this task calls them."
  - "query_vector_store, S3VectorsQueryMatch and S3VectorsQueryResponse: no caller at the pin."
  - "BaseRAGIngestion state, credential overlay, upload, OCR and chunking: B3451 owns them."
  - "Credential resolution, signing, region validation and partition lookup: B594, B595, B591 and B198 own them."
  - "Choosing the router or global embedding client, the pooled HTTP transport and the ingestion registry: B3460 and B3457 own the wiring."

pitfalls:
  - The empty-content check in store runs after ensure_config_initialized, so a call with no chunks still creates the bucket and index first.
  - dimension is set only when the key is present; a present value is never probed, and the probe runs at most once per workflow because the result is stored.
  - A failed ensure_index keeps the generated index name, so the retry creates the same name instead of a second "litellm-index-" index.
  - A filename of "" is falsy in Python, so the keys are "chunk_{i}" and the metadata has no filename; the returned filename is still the empty string.
  - chunk_index in the metadata is a string ("0"), because S3 Vectors metadata values here are strings.
  - The probe fallback also covers a successful answer with no data; only an error or an empty list returns the default, never a panic on indexing.
  - embed stores the fallback model in the settings, so the second embed call and a later probe see the same model.
  - The returned vector store id is "{bucket}:{index}" with a colon, which is the format B3458's target helper splits again.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
