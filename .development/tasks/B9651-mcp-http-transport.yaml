dod:
  - text: McpClient carries shareable credentials and HttpClientConfig hands the resolved credential, else the AWS signer, to the transport.
    proof: [transport-tests, client-fixture-tests]
  - text: Each send merges headers with the request winning, applies the credential to the exact request (SigV4 over the body), then the redirect guard, and never follows a redirect.
    proof: [transport-tests]
  - text: Every response with status 400 or higher goes through the capture port once, its body becomes the retained prefix, and the status error keeps the headers and the capture record.
    proof: [transport-tests, client-fixture-tests]
  - text: TLS verification, the CA file and the timeouts follow HttpClientConfig.
    proof: [transport-tests]
checks:
  optional: [mutants]
  commands:
    - id: transport-tests
      why: Headers, credentials, the guard, capture or TLS differ from the factory's client.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client::http_transport::/)'
    - id: client-fixture-tests
      why: The changed response head, credential fields or status_error broke the cleanup, session, tool or resource code built on them.
      run: cargo nextest run --locked -p betterlite-mcp -p betterlite-core --no-tests=fail -E 'test(/^client::(cleanup|sessions|tools)::/) | test(/^credentials_tests::/) | test(/^api::mcp_client_resources::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "Following redirects, SSE parsing and the MCP protocol: B9652 and B9653."
  - "capture_upstream_error_response and the previews: B8194 (done). Wiring it into this port: B9654."
  - "RedirectGuard and HttpClientConfig's other fields: B4744 (done). McpHttpClient's cleanup bookkeeping: B4743 (done)."
  - "Choosing the credential for a server (resolve_v2_auth, the legacy auth source order) and building McpSigV4Auth from a record: B8461. ResolvedAuth implementations: B4667."
  - "HTTP cases through the booted proxy: no route reaches an upstream through this transport until B9654 and the MCP mounts land; B140 adds them."
pitfalls:
  - "Apply the credential before the guard: httpx runs the auth flow first and the request hooks on the request it yields, so a credential the auth writes into a moved slot is still dropped across origins."
  - "SigV4 signs the final header set and the exact body bytes, so nothing may add or change a header after auth_flow except the guard's removal; a later change breaks the signature."
  - "Capture runs only for status 400 and up (httpx's is_error); a 3xx with a body is not captured even though it is not a success."
  - "B4743's fetch reads a non-streamed body inside send and closes the body of a refused POST; the capture must happen inside the transport's send so its retained bytes are what that read sees."
  - "McpSigV4Auth fetches credentials through its cache on every call; never sign once at build time, since temporary STS credentials expire."
  - "ProxiedClient::outbound_with_tls already sets Policy::none for redirects and disables reqwest's environment proxy; do not build a bare reqwest::Client, or HTTP_PROXY from the environment would apply."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
