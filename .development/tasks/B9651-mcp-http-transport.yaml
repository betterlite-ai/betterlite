id: B9651
title: MCP HTTP transport with credentials, redirect guard and error capture port
description: >-
  betterlite has the MCP client's session lifecycle (B4744) and its cleanup-aware HTTP client (B4743), but nothing sends a real HTTP request: B4743's McpHttpClient is generic over a `Transport` trait that only test fakes implement, and B4744's McpRuntime has a stdio implementation and no HTTP one. LiteLLM builds that client in MCPClient._create_httpx_client_factory (client.py L775-L815): an httpx2.AsyncClient with LiteLLM's TLS settings, the resolved credential or the AWS SigV4 signer as its auth, follow_redirects true, a request hook that drops a moved credential header when a request leaves the configured origin (credential_redirect_hook, types/mcp.py L364-L380) and a response hook that captures the start of every error body for diagnostics (capture_upstream_error_response, mcp_debug.py L579-L598). B4744 turned the configuration half into HttpClientConfig and RedirectGuard. This task builds the half that sends: one HTTP exchange per call, with the credential, the guard and the capture applied. Redirect following stays with the session transports (B9652), because the MCP SDK sends every request with follow_redirects=False and follows only same-origin redirects itself.


  Code goes in crates/betterlite-mcp/src/client/http_transport.rs and crates/betterlite-mcp/src/client/http_transport/ (request.rs, send.rs, capture.rs, error.rs, tests.rs); the skeleton declares `pub mod http_transport;` in client.rs. Add betterlite-http to crates/betterlite-mcp/Cargo.toml for ProxiedClient and McpSigV4Auth.


  Credentials reach the client. Today HttpClientConfig.auth is only an AuthSource flag and McpClient keeps `resolved_auth` and `aws_auth` as `Option<Box<dyn ResolvedAuth>>`, so no transport can apply them, and SigV4 needs the request body, which ResolvedAuth::authenticate never sees. Change McpClient.resolved_auth to `Option<Arc<dyn ResolvedAuth>>` and McpClient.aws_auth to `Option<Arc<McpSigV4Auth>>` (B4742's signer in betterlite-http, the type B8461 builds for aws_sigv4 servers). Add `pub credential: Option<RequestCredential>` to HttpClientConfig with `pub enum RequestCredential { Resolved(Arc<dyn ResolvedAuth>), AwsSigV4(Arc<McpSigV4Auth>) }`, filled by SessionClient::create_http_client_config: the resolved credential when there is one, else the AWS signer, the factory's fallback at L800-L801. HttpClientConfig's PartialEq compares the credential by Arc::ptr_eq and its Debug prints only which kind is set. Keep AuthSource as it is; B4744's tests read it.


  Responses carry their head. B4743's `HttpResponse { status, body }` gains `headers: http::HeaderMap`, and `Transport::status_error` takes the response head (status, headers and the capture record below) instead of the bare status, so the error for a refused POST keeps WWW-Authenticate for B8460's upstream_auth_failure and the capture for B8194's describe_upstream_http_failure. Update every constructor in B4743's and B4744's code and fixtures; behavior there does not change.


  request.rs. `McpHttpRequest { method: http::Method, url: url::Url, headers: http::HeaderMap, body: bytes::Bytes, read_timeout: Option<Duration> }` is the Transport::Request. read_timeout overrides the client timeout for reading only, which the legacy SSE GET needs (B9652).


  send.rs. `McpHttpTransport` implements B4743's Transport. `McpHttpTransport::new(config: &HttpClientConfig, base: &HttpBase, capture: Arc<dyn ErrorCapture>)` with `HttpBase { proxy: Arc<ProxyPolicy>, tls: TlsPolicy }`, the gateway's proxy policy and resolved TLS policy, passed in by whoever builds the runtime. It builds one ProxiedClient with `ProxiedClient::outbound_with_tls` from a copy of base.tls whose verification follows config.tls (Enabled keeps verification on, Disabled turns it off, CaFile verifies against that file), so the client never follows redirects itself. One send: start from config.headers, let the request's own headers win per name, apply the credential (Resolved: ResolvedAuth::authenticate on method, url and headers; AwsSigV4: McpSigV4Auth::auth_flow on the full request with its body, every time, never cached), then run config.redirect_guard's apply against the request URL, then send with config.timeout for connect, write and pool and the read timeout (the request's, else config.timeout). A response with status 400 or higher goes through the capture port before send returns; any other response comes back untouched with its body unread when stream is true. A 401 answer on a Resolved credential gets one more try, as LiteLLM's ClientCredentialsBearerAuth does inside httpx's auth flow: await `ResolvedAuth::after_unauthorized(&self) -> Pin<Box<dyn Future<Output = bool> + Send + '_>>`, a new trait method in credentials.rs whose default resolves to false; on true apply authenticate again and send the same request once more, and that second answer stands whatever it is. Both answers go through the capture port, since LiteLLM's capture is an httpx response hook. A SigV4 credential never retries. B4667 implements after_unauthorized for client_credentials.


  capture.rs. The capture is a port because its implementation is B8194's capture_error_response in betterlite-server, and betterlite-mcp cannot depend on betterlite-server. `pub trait ErrorCapture: Send + Sync` with one method that receives the exchange (method, URL, the request headers as sent, the request body, the status and response headers) and the body as a bounded stream of chunks, and returns `CapturedBody { retained: Vec<u8>, preview: String }`. The transport replaces the response body with `retained` (LiteLLM sets response._content to the prefix so an auth flow can still read a 401 body) and keeps the exchange and preview as the response's capture record. B9654 implements the port in betterlite-server; tests here use a recording fake.


  error.rs. `McpHttpError` is this module's error enum: a send failure keeping reqwest's timeout and connect distinctions, a credential failure (ResolvedAuth's CredentialError or McpSigV4Error), a TLS or client build failure, a body read failure, and the status error built from a response head. Its Display never prints a header value or a body.


  Tests in client::http_transport::tests run against a local axum server: config headers merged with request headers winning; a resolved credential applied; SigV4 signing covering the body (the x-amz-content-sha256 header equals the body's SHA-256 and Authorization starts with AWS4-HMAC-SHA256); the guard dropping a moved slot on a request to another origin and keeping it on the configured origin and on its http to https upgrade; a 307 returned unfollowed with its Location header; capture called exactly once for a 500 and a 401 and never for a 200 or a 302, with the retained prefix as the body afterwards; a 401 sent once more when after_unauthorized gives true (the second 401 returned as is) and returned at once when it gives false; status_error keeping WWW-Authenticate; a read timeout on paused time; TLS Disabled and CaFile building a client.
