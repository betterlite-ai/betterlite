  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L461-L495
    why: SSE gets the factory and a timeout, streamable HTTP gets one prebuilt client with Timeout(self.timeout); both use this transport.
  - url: https://pypi.org/project/mcp/2.3.0/
