id: B3757
title: Cisco request and response redaction
description: >-
  Apply Cisco's sanitized content to request and response surfaces through
  dedicated redaction functions that rewrite in place. _apply_redaction dispatches
  to input/output redactors based on surface and direction; _redact_mcp_input
  rewrites tool arguments in all proxy-accessible locations; _redact_chat_input
  handles both messages and Responses API input fields with tool-argument clearing
  and instructions rewriting; _redact_chat_output targets ModelResponse,
  TextCompletionResponse and Responses API shapes with reasoning-field removal.
  Each redaction preserves the incomplete-rewrite return value so the verdict engine
  can fall back to block/monitor policy when no suitable surface exists. Tool arguments
  are cleared by setting arguments to "{}" as JSON; reasoning fields (reasoning_content,
  thinking_blocks, reasoning_items) are deleted where possible or set to None on
  immutable shapes. Instructions field extraction respects role priorities (system/developer
  over user content) and falls back to sanitized_text when messages are unavailable.
  Responses API input rewriting delegates to cisco_conversation.rs public functions
  for message-to-input conversion and flat-list text-part detection.
scope:
  paths:
  - crates/betterlite-guardrails/Cargo.toml
  - crates/betterlite-guardrails/src/cisco_redaction.rs
  - tools/oracle/cases/helpers/cisco-redaction/**
  - tools/oracle/helpers/b3757.py
  - tools/oracle/helpers/b3757/**
  - tools/oracle/src/helpers/guardrails/b3757.rs
  - tools/oracle/src/helpers/guardrails/b3757/**
  - crates/betterlite-guardrails/src/cisco_redaction/**
