- tools/oracle/cases/helpers/cisco-redaction/apply-redaction-mcp-input.yaml
- tools/oracle/cases/helpers/cisco-redaction/apply-redaction-chat-input.yaml
- tools/oracle/cases/helpers/cisco-redaction/apply-redaction-chat-output-model-response.yaml
- tools/oracle/cases/helpers/cisco-redaction/apply-redaction-chat-output-text-completion.yaml
