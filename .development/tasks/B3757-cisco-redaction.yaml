deviations: []
out_of_scope:
- B3756 owns _extract_tool_definition_text, _normalize_message_content, _extract_message_tool_argument_parts, _sanitized_messages_to_responses_input, _rewrite_responses_input_text and _extract_message_reasoning_parts; this task calls them as public exports from cisco_conversation.rs.
- _non_instruction_messages filters messages to exclude instruction roles; it is a small helper within this task's redaction flow.
- B3761 owns _set_mcp_tool_response_text which applies redacted text to MCP responses.
- Verdict construction and incomplete-rewrite dispatch (B3760 calls _apply_redaction to enforce verdicts).
pitfalls:
- _apply_redaction returns false when no suitable surface exists to apply redaction, allowing the verdict engine to fall back to block/monitor policy without rewriting.
- Tool arguments are cleared by setting the arguments field to the string "{}", not to an empty dict, preserving the wire format.
- Reasoning fields (reasoning_content, thinking_blocks, reasoning_items) may not be deletable on immutable response shapes; catch exceptions and fall back to setattr(..., None).
- _redact_chat_input strips the last message when it is a synthetic tool-definition message appended during inspection.
- Instructions field rewriting checks for system/developer roles first (with _is_instruction_role) and only falls back to sanitized_text when instructions are present but no instruction role found in messages.
- _clear_chat_input_tool_arguments uses extract_message_tool_argument_parts to detect tool calls; only messages with tool_calls/function_call fields get cleared.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
