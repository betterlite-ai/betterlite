dod:
- text: >-
    apply_redaction_mcp_input rewrites request_data.mcp_arguments, request_data.arguments,
    and params.arguments with sanitized_mcp_arguments when present, or locates the single
    string argument field and rewrites it with sanitized_text. Returns true on rewrite,
    false when no argument field matched.
  proof: [helpers-rust, helper-python, redaction-oracle]
- text: >-
    apply_redaction_chat_input_with_messages strips the tool-definition synthetic message
    (last item appended during inspection) when sanitized_messages present, rewrites request_data.messages
    or converts to Responses API input field via sanitized_messages_to_responses_input, and falls back
    to clearing tool arguments when sanitized_text is the only available rewrite. Returns true on any
    rewrite, false when no suitable surface exists.
  proof: [helpers-rust, helper-python, redaction-oracle]
- text: >-
    apply_redaction_chat_output_model_response pulls choices[].message and rewrites content via
    sanitized text or message list (consuming one message per choice), then clears tool-call arguments.
    Returns true on any rewrite, false when response is null or choices is not a list.
  proof: [helpers-rust, helper-python, redaction-oracle]
- text: >-
    apply_redaction_chat_output_text_completion rewrites choices[].text with sanitized_text or
    extracts text from the first message in sanitized_messages if available. Returns false when
    response is null, choices is not a list, or no replacement text found.
  proof: [helpers-rust, helper-python, redaction-oracle]
- text: >-
    apply_redaction_responses_api_output walks output items, rewrites content-part lists where
    type is in {text, input_text, output_text, summary_text, reasoning_text} with sanitized_text
    (or joined message content), and sets arguments field to "{}". Returns false when response is null,
    output is not a list, or no replacement text found.
  proof: [helpers-rust, helper-python, redaction-oracle]
- text: >-
    apply_redaction_mcp_output delegates to B3761's set_mcp_tool_response_text when sanitized_text
    is present. Returns false when response is null or no sanitized_text available.
  proof: [helpers-rust, helper-python, redaction-oracle]
- text: >-
    extract_masked_entity_count_rules sums entity_type counts from a rules array,
    returning a map of string counts or None if no rules or empty.
  proof: [helpers-rust, helper-python, redaction-oracle]
checks:
  optional: []
  commands:
  - id: helpers-rust
    why: Rust redaction and response-rewrite helpers are missing or do not match LiteLLM behavior
    run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^cisco_redaction::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: Python oracle helpers lack implementations or fail on LiteLLM comparison
    run: test -f tools/oracle/helpers/b3757.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: redaction-oracle
    why: Oracle cases for redaction behavior are missing or fail against LiteLLM
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/cisco-redaction)" && cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/cisco-redaction/
