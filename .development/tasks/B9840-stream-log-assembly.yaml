id: B9840
title: Convert and assemble success results for logging
description: >-
  LiteLLM's success handlers turn the last result of a stream into one complete response before cost and the standard
  payload see it, in Logging._get_assembled_streaming_response (litellm_logging.py L4108-L4144), called from
  _success_handler_body (L2799-L2805) and _async_success_handler_body (L3311-L3319). B250's success handler asks a
  StreamAssembler for that response (the trait in crates/betterlite-logging/src/logging_success/ports.rs), and every
  place that builds a success handler needs one production value of it. B252 builds ChatStreamAssembler for the chat
  branch (L4116-L4119). This task builds the two other branches and LoggedStreamAssembler, the one StreamAssembler that
  covers every shape the function handles. Before any of that, LiteLLM's _success_handler_helper_fn converts the result
  of an Anthropic /v1/messages, Google GenAI generateContent or A2A send_message call into the response logging reads
  (L2519-L2527), and B250's prepare.rs has no such step. Part 4 adds it to the same port and builds the conversions.


  Code goes in betterlite-core, module `stream_log_assembly` (crates/betterlite-core/src/stream_log_assembly.rs and its
  folder). It sits in core and not in betterlite-logging because the Responses branch calls B906's usage transform and
  B1717's hidden-params cost helper, and the conversions call B580's Anthropic response transform (betterlite-anthropic),
  B919's Responses-to-chat transform (betterlite-core) and B1326's Gemini response transform (betterlite-vertex), and
  core already depends on betterlite-logging. The architect's skeleton creates the empty file and declares it in lib.rs,
  so leave lib.rs alone. Add betterlite-interactions to betterlite-core's dependencies unless B3491 already did, and
  betterlite-vertex (it depends on no betterlite crate above it, so the edge makes no cycle).


  1. Responses terminal events (L4120-L4140). The Responses stream iterator (B926) hands its terminal event to the
  success handlers as the result: an object whose type is "response.completed", "response.incomplete" or
  "response.failed" and whose `response` is the full Responses object (types/llms/openai.py L1596-L1612).
  `assemble_responses_event(event: &Map<String, Value>) -> Option<Value>` returns that `response` object, never the
  event. When the response's usage is an object (LiteLLM's isinstance check on ResponseAPIUsage, the only type the field
  declares), first record the provider cost with B1717's set_response_cost_in_hidden_params (betterlite-core helpers;
  read its merged signature): when the usage's cost is not null, `llm_provider-x-litellm-response-cost` is merged over
  the response's `_hidden_params.additional_headers` (core_helpers.py L754-L772). The cost is read the way B1138's
  ResponseAPIUsage reads it: a number, or the total_cost of an object (the parse_cost validator, L1360-L1365). Then
  replace usage with the chat usage B906 builds, as a JSON object: `normalize_and_project(UsageInput::Mapping(usage))`
  in api::responses_usage. A null or absent usage leaves the response as it came, with no cost header. If B906 refuses
  the usage, log a warning with its error and return the response with its usage unchanged; input of the declared type
  never takes that path.


  2. Interaction chunks (L4141-L4142, L4146-L4171). The interaction stream iterator (B3491) hands its terminal chunk to
  the success handlers (interactions/streaming_iterator.py L96-L105), and LiteLLM turns it into a full interaction
  response so cost and spend see the same shape as a non-streamed create. Use B3481's types from
  betterlite-interactions::types for the streaming chunk (InteractionsAPIStreamingResponse) and the response
  (InteractionsAPIResponse); do not define them again. `assemble_completed_interaction(chunk: &<B3481's streaming
  chunk>) -> Option<<B3481's response>>` ports _assemble_completed_interaction_response. When event_type is
  "interaction.completed" and the chunk's interaction object is present, the response is that object read as a
  response. Otherwise, when the chunk's status is "completed", the response is the chunk itself without its event_type,
  delta, index, step, interaction_id and interaction fields. Every other chunk gives None. Both responses keep unknown
  keys (LiteLLM's models allow extra fields), and object is "interaction" when the source has none.


  3. The composed assembler. `pub struct LoggedStreamAssembler { pub chat: ChatStreamAssembler }`, holding B252's unit
  struct and built as that struct literal (no constructor, since one that only builds the struct breaks
  no-one-line-functions), implements StreamAssembler. assemble(state, result, mode) returns None unless
  state.stream is Some(true) (LiteLLM's `self.stream is not True`). A SuccessResult::Other object whose type is one of
  the three Responses terminal types and whose `response` is an object goes to part 1. Otherwise, when state.call_type
  is create_interaction, acreate_interaction, create or acreate (the call types B3496's is_billable_interaction accepts)
  and the result's JSON reads as B3481's streaming chunk, part 2 answers, with the response as JSON or None when it gives
  None; such a result never falls through to the chat branch. The call type gate stands in for LiteLLM's isinstance
  check, since every JSON object reads as a chunk whose fields are all optional. Every other result goes to
  ChatStreamAssembler unchanged, so a Chat result or a text completion still comes back as is and anything else gives
  None. The mode does not change any branch, and the type keeps no state, so one value serves sync and async handlers.
  This task builds the type and its tests and edits no server file: B8610 builds one value and
  hands that Arc to every production success handler.


  4. Logged-result conversion (L2519-L2527 and L4177-L4343). The port: give StreamAssembler in ports.rs a provided
  method `logged_result(&self, state: &mut LoggingState, result: SuccessResult) -> Result<SuccessResult, SuccessError>`
  whose default returns Ok(result), so B252's ChatStreamAssembler and the test doubles that implement the trait on main
  keep compiling, and override it in LoggedStreamAssembler. The conversion rides on this port because the composition
  root already hands one value of it to every success handler; a new SuccessHandler field would have to be filled at
  every place that builds one. Add `LoggedResult(String)` to SuccessError in types.rs for a conversion that fails. In
  prepare.rs, call it after the completion start time and the log_event_type, end_time and cache_hit markers and before
  the standard payload, and use the converted result for the payload, for Prepared.result and so for the assembler and
  the callbacks. When it fails, log a warning `[Non-Blocking] LiteLLM.Success_Call Error: {error}` and run no callback
  for the call, since LiteLLM raises out of the handler there (L2576-L2577): prepare returns Option<Prepared> and begin
  in handler.rs returns None for None. The raw upstream response LiteLLM keeps in model_call_details["httpx_response"]
  becomes a typed field, `pub httpx_response: Option<UpstreamResponse>` (betterlite_http::proxy::UpstreamResponse,
  with status, headers and body bytes) on LoggingState. B3488 adds it, None in LoggingState::new, and sets it for GenAI
  generate_content; read it, don't add it. It stays out of
  model_call_details so no payload or callback sees it. B976 adds `streamed_anthropic_message_id: Option<String>` next to
  it; read that field, don't add it.


  LoggedStreamAssembler::logged_result matches state.call_type exactly. On "anthropic_messages"
  (_anthropic_messages_logged_response and _handle_anthropic_messages_response_logging, L4177-L4252): a
  SuccessResult::Chat comes back as is. A Responses terminal event (the three types of part 1) is replaced by its
  `response`, and an object whose `object` is "response" is translated (_translate_responses_api_response_to_model_response,
  L4254-L4298): the served id is B254's provider_response_id (betterlite-logging fields::response) of the response; call
  B919's transform_response in api::response_chat_result with model state.model, a chat response whose id is the served
  id, and empty request data, messages, optional params and litellm params; then set the id to the served id when there
  is one. When B919 returns an error, log it at debug and build a chat response with the served id and model
  state.model, whose usage, when the response's usage is an object that is_response_api_usage (api::responses_usage)
  accepts, is normalize_and_project of it. Any other result goes through B580's Anthropic response module, with the
  model response id set to provider_response_id of the result: when state.httpx_response is Some, its transform_response
  over that response (model state.model, no messages, state.optional_params, empty litellm params, json_mode false);
  when the result is null, a warning "LiteLLM: the anthropic_messages stream assembled no response, logging an empty
  one" and a default chat response with model state.model; otherwise its transform_parsed_response of the result with
  status 200 and no headers, json_mode None and speed from optional_params "speed". A B580 error fails the conversion.
  Last, whichever branch ran, a Some state.streamed_anthropic_message_id replaces the id. The answer is a
  SuccessResult::Chat. On "generate_content" and "agenerate_content" (L4300-L4320): a None state.httpx_response fails
  with "Google GenAI Generate Content: httpx_response is None", a body that is not JSON fails, and otherwise B1326's
  _transform_google_generate_content_to_openai_model_response (betterlite-vertex gemini_response) builds the chat
  response from the body with model state.model, ignoring the result; the answer is a Chat. On "asend_message" and
  "send_message" (_handle_a2a_response_logging, L4322-L4343): when model_call_details has a "usage" that is not null,
  the result object gets "usage" set to it and keeps its `_hidden_params`; otherwise it comes back as is. Every other
  call type comes back as is. A chat response becomes JSON with its hidden params under `_hidden_params`, the shape the
  handler's Chat results already carry. Read the merged signatures of B580, B919 and B1326 before writing the calls.


  Tests live in stream_log_assembly's tests.rs: `responses_*` for part 1 (each event type, cost as a number, as an
  object with total_cost and null, usage null and absent), `interaction_*` for part 2 (completed event with and without
  an interaction object, legacy status completed, in_progress and requires_action), `stream_gate_*` for a call with
  stream None or Some(false) on each shape, `delegates_*` for what reaches ChatStreamAssembler through the composed
  type: a streamed Chat result comes back as is, and a plain object on a chat call type gives None, and `logged_*` for
  part 4: each anthropic_messages branch (Chat, streamed id over Chat and over a dict, terminal event, bare Responses
  object, B919 error with and without usage, httpx response, null, dict), aanthropic_messages left as is, both GenAI call
  types with a body, a missing response and a body that is not JSON, both A2A call types with usage, null usage and no
  usage, and a chat call type left as is. In betterlite-logging's logging_success tests, add `logged_result_*` tests
  with a test double that overrides logged_result: its converted result is what the payload builder, the assembler and
  the callbacks get, an error runs no callback and stores no payload, and the default leaves the result unchanged.


  Oracle helper. The skeleton registers this task's helper operation b9840 in the core_ops group and adds its Rust and
  Python files to the scope. Its input is `step` ("assemble" or "logged_result"), `stream` (bool or null),
  `call_type`, `result` (a JSON value), `result_kind` ("chat" or "other", default "other"), `optional_params` (object,
  default {}), `httpx_response` (null, or status_code, headers and body as text), `streamed_anthropic_message_id`
  (string or null) and `call_details_usage` (object or null). For assemble, its output is null when nothing is
  assembled, otherwise `{response, hidden_params}`: response is the assembled object without `_hidden_params`, and
  hidden_params is the response's hidden params ({} when it has none). For logged_result, its output is `{response,
  hidden_params}` of the converted result, or `{failed: true}` when the conversion fails. The Rust adapter builds a
  B247 LoggingState from a LoggingInit with model oracle-model, the stream and the call type, sets optional_params,
  httpx_response, streamed_anthropic_message_id and model_call_details "usage" from the input, and calls
  `LoggedStreamAssembler { chat: ChatStreamAssembler }` with assemble (SuccessMode::Async) or logged_result, handing the
  result over as SuccessResult::Chat for result_kind chat and SuccessResult::Other otherwise. The Python adapter builds
  Logging(model="oracle-model", messages=[], stream=stream, call_type=call_type, start_time=now,
  litellm_call_id="oracle", function_id="oracle") and sets optional_params, model_call_details["httpx_response"] (an
  httpx.Response), record_streamed_anthropic_message_id and model_call_details["usage"] from the input. It turns the
  result into ModelResponse for result_kind chat, into ResponseCompletedEvent, ResponseIncompleteEvent or
  ResponseFailedEvent by its type, into ResponsesAPIResponse when its object is "response", into
  InteractionsAPIStreamingResponse when the call type is an interactions one, into LiteLLMSendMessageResponse when it is
  asend_message or send_message, and leaves any other value as it is. For assemble it calls
  _get_assembled_streaming_response(result, now, now, True, []); for logged_result it calls
  _success_handler_helper_fn(result=result, start_time=now, end_time=now, standard_logging_object=<a minimal payload>),
  so no payload is built, and returns `{failed: true}` when that raises. It returns None or model_dump(mode="json") of
  the result with its _hidden_params. An interaction response is dumped with every declared field, nulls included, and
  its unknown keys, so the Rust side serializes B3481's response type the same way. A converted chat response's
  `created` is the clock and its id is generated when no id was served, so those cases ignore /response/created, and
  /response/id where no id is served, each with that reason.


  Size: about 165 LiteLLM lines (45 for assembly, 120 for the conversions and their dispatch). Plan 60 lines for part 1,
  50 for part 2, 40 for the composed assembler, 170 for part 4 with 35 in betterlite-logging, 270 of Rust and Python
  adapter, and the tests and cases on top.
