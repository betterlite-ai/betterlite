deviations: []
out_of_scope:
  - "The stream gate and chat branch of _get_assembled_streaming_response (L4116-L4119) are B252's ChatStreamAssembler, which this type calls; the success handlers that call the port are B250's."
  - "Building the one production value and handing it to the server's success handlers (the chat and embeddings logging B012 wires, B8931's pass-through runtime, the cache-hit handler B4301 built) belongs to B8610, not to this task. Until it is swapped in, B012's server logging runs on B252's ChatStreamAssembler."
  - "Anthropic /v1/messages has no assembly branch: its stream hands the success handlers an assembled ModelResponse, which part 4 converts and the chat branch returns."
  - "record_streamed_anthropic_message_id (L4174-L4175) and the streamed_anthropic_message_id field are B976's, written when its stream wrapper starts; the Responses bridge stream that also records the id (responses_adapters/streaming_iterator.py L127) belongs to that file's owner."
  - "Storing the upstream response in LoggingState.httpx_response is the job of the calls that receive it, as LiteLLM's native /v1/messages call (llm_http_handler.py L2276) and GenAI transform (google_genai/transformation.py L389) do; B3488 adds the field and sets it for GenAI, and this task reads it. Nothing sets it for the native /v1/messages call yet, so that call logs from the served body without the upstream llm_provider-* headers."
  - "The A2A usage in model_call_details is written by betterlite-a2a's logging context; this task only copies it onto the result."
  - "The Responses stream iterator that hands over the terminal event is B926's, the interaction stream iterator B3491's, the usage transform B906's, the hidden-params cost helper B1717's and the interaction billing branch (L2604-L2701) B3481's and B3496's."
  - "The remaining functions in litellm_logging.py belong to B190 and its named sibling parts (B247 to B254) and the owners their out_of_scope lists name."
pitfalls:
  - "The Responses branch returns the event's `response`, not the event; logging the event object would give cost and the standard payload a shape with no usage at the top."
  - "response.incomplete and response.failed take the same branch as response.completed, cost header included."
  - "The cost header goes into `_hidden_params.additional_headers` under llm_provider-x-litellm-response-cost and keeps the headers already there; a null cost writes nothing, and an object cost uses its total_cost."
  - "The status branch drops exactly event_type, delta, index, step, interaction_id and interaction; id, object, model, agent, status, created, updated, outputs, steps, usage and any unknown key stay in the response."
  - "An interaction.completed event with interaction null is not the end: it falls through to the status test, so it assembles only when its own status is completed."
  - "interaction.requires_action and in_progress chunks assemble to None; requires_action billing happens on the non-streamed path in B3496, not here."
  - "Every JSON object reads as B3481's chunk type, since all its fields are optional; without the call type gate a Responses or chat stream result would be taken for an interaction."
  - "stream must be exactly Some(true): a call with stream None or false assembles nothing for any shape, the way LiteLLM tests `self.stream is not True`."
  - "Only call type anthropic_messages is converted; aanthropic_messages, which the cache treats as a Messages call too, logs its result as it came."
  - "The Anthropic transform keeps the id it is handed, so the logged id is the served result's id even on the httpx branch, never the id inside the stored upstream body."
  - "The streamed message id replaces the id after every anthropic_messages branch, the untouched Chat result included."
  - "The GenAI conversion reads the stored upstream body and ignores the result, so a call that stored no upstream response logs nothing at all."
  - "The Responses fallback model is state.model, not the response's model, and it keeps the served resp_ id as the chat id."
  - "logged_result runs on every call, streamed or not; only assemble looks at the stream flag."
