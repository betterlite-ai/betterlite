dod:
  - text: A streamed response.completed, response.incomplete or response.failed result assembles to its response, with usage in chat form and the provider cost in the hidden response-cost header, and a response without usage comes back unchanged.
    proof: [responses-tests, helper-cases, helper-python, oracle]
  - text: assemble_completed_interaction returns the interaction object of an interaction.completed event, the trimmed chunk for a status completed chunk, and None for every other chunk, keeping unknown keys and the object default.
    proof: [interaction-tests, helper-cases, helper-python, oracle]
  - text: LoggedStreamAssembler gives None on a call that is not streamed, answers an interaction call type's chunk itself even when it gives None, and hands every other result to ChatStreamAssembler unchanged.
    proof: [composition-tests]
  - text: On an anthropic_messages call, a chat response comes back as is, a Responses result is translated with the served id or falls back to a usage-only response, any other result goes through the Anthropic response transform (from the stored upstream response when there is one), a null result logs an empty response, and a streamed message id replaces the id; aanthropic_messages is left as is.
    proof: [logged-result-tests, helper-cases, helper-python, oracle]
  - text: On a GenAI generate_content or agenerate_content call the logged response is built from the stored upstream body and the conversion fails without one, and an A2A send_message result gets the call's usage.
    proof: [logged-result-tests, helper-cases, helper-python, oracle]
  - text: The success handler converts the result before it builds the payload or asks for an assembled stream, runs no callback when the conversion fails, and its existing tests and the handlers built on it still pass.
    proof: [success-handler-tests]
checks:
  optional:
    - mutants
  commands:
    - id: responses-tests
      why: the Responses branch returns the event, drops the cost header, converts a missing usage or misreads an object cost
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^stream_log_assembly::.*responses_/)'
    - id: interaction-tests
      why: the completed-event, legacy-status or None cases of the interaction assembly are missing or wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^stream_log_assembly::.*interaction_/)'
    - id: composition-tests
      why: the stream gate, the interaction call type gate or the hand-off to the chat assembler is missing or wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^stream_log_assembly::.*(stream_gate_|delegates_)/)'
    - id: logged-result-tests
      why: a call-type conversion, its fallback, the streamed id or a failure case is missing or wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^stream_log_assembly::.*logged_/)'
    - id: success-handler-tests
      why: the handler skips the conversion, builds the payload from the unconverted result, still runs callbacks after a failure, or the port change broke the handlers built on it
      run: >-
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^logging_success::.*logged_result_/)' &&
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^logging_success::/) | test(/^passthrough_logging_state::/) | test(/^passthrough_stream_logging::/) | test(/^logging_state::/)' &&
        cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^caching::hit_callbacks::/)'
    - id: helper-cases
      why: the assembler has no helper case on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/stream-log-assembly)"
    - id: helper-python
      why: the Python adapter fails the strict checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
