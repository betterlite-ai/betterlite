id: B502
title: OpenAI reasoning and audio model parameters
description: >-
  Add typed ReasoningPolicy selection to the existing chat mapper, including catalog-declared defaults and the older-catalog
  fallback. Reuse existing exact decimals, role transforms and drop reporting. This module owns model capability
  selection and parameter mapping only; existing request serialization invokes it. No tokenizer or template acquisition
  is introduced.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/chat/gpt_5_transformation.py:
  _catalogue_declares_default_effort L18-L31; _normalize_reasoning_effort_for_chat_completion L34-L48; _get_effort_level
  L51-L64; OpenAIGPT5Config.is_model_gpt_5_search_model L90-L99; OpenAIGPT5Config.is_model_gpt_5_2_model L107-L110;
  OpenAIGPT5Config._gpt_series_version L119-L123; OpenAIGPT5Config.is_model_gpt_5_4_plus_model L126-L129; OpenAIGPT5Config.is_model_gpt_5_6_plus_model
  L132-L134; OpenAIGPT5Config.is_model_gpt_6_plus_model L137-L139; OpenAIGPT5Config._model_map_lookup_name L142-L150;
  OpenAIGPT5Config._supports_reasoning_effort_level L153-L164; OpenAIGPT5Config.effort_resolves_to_none L167-L193;
  OpenAIGPT5Config._is_reasoning_effort_level_explicitly_disabled L196-L210; OpenAIGPT5Config.get_supported_openai_params
  L212-L253; OpenAIGPT5Config.map_openai_params L255-L367. litellm/llms/openai/chat/o_series_transformation.py:
  OpenAIOSeriesConfig.get_config L37-L38; OpenAIOSeriesConfig.translate_developer_role_to_system_role L40-L44; OpenAIOSeriesConfig.get_supported_openai_params
  L46-L89; OpenAIOSeriesConfig.map_openai_params L91-L115; OpenAIOSeriesConfig._transform_messages L127-L129; OpenAIOSeriesConfig._transform_messages
  L132-L137; OpenAIOSeriesConfig._transform_messages L139-L156. litellm/llms/openai/chat/gpt_audio_transformation.py:
  OpenAIGPTAudioConfig.get_config L20-L21; OpenAIGPTAudioConfig.get_supported_openai_params L23-L31; OpenAIGPTAudioConfig._map_openai_params
  L38-L50.


  Named case contracts: gpt5_search_allowlist: Names containing both gpt-5 and search allow only max_tokens, max_completion_tokens,
  stream, stream_options, web_search_options, service_tier, safety_identifier, response_format, user, store, verbosity,
  max_retries and extra_headers; map max_tokens to max_completion_tokens before filtering. dict_effort_normalization:
  Prefer truthy non_default_params.reasoning_effort over optional_params; string or dictionary effort sets guards,
  dictionaries normalize both maps when effort is not None, and absent/other values resolve None. xhigh_opt_in:
  xhigh requires explicit supports_xhigh_reasoning_effort; otherwise raise UnsupportedParamsError 400 or remove
  reasoning_effort from both maps when litellm.drop_params or drop_params is true. low_minimal_opt_out: low/minimal
  pass unknown capability values and reject only explicit supports_low_reasoning_effort=false or supports_minimal_reasoning_effort=false,
  with the same 400/drop-both-maps branches. catalog_before_default_key: Explicit effort wins; otherwise default_reasoning_effort=none
  permits sampling, another declared value forbids it. Fall back to supports_none_reasoning_effort only when no
  dictionary entry anywhere in model_cost declares default_reasoning_effort. temperature_while_thinking: Pop temperature
  from the input map; None is omitted, 1 is always retained, other values require supports_none plus effective/default
  effort none, otherwise drop or UnsupportedParamsError 400 naming temperature and active reasoning. sampling_with_none:
  For models supporting none, non-default logprobs/top_logprobs/top_p require effort resolving to none; otherwise
  remove all three from non_default_params under drop_params or raise UnsupportedParamsError 400. Existing optional_params
  values are not popped by this branch. o1_developer_roles: Keep developer roles unchanged; unsupported system messages
  become role user with content only before B503 common message transformation, for both sync and async paths. audio_token_parameter:
  Audio extends B668 supported params with audio and otherwise delegates mapping unchanged; it does not independently
  rename token parameters. gpt5_regular_allowlist: Start from B668 GPT params, add reasoning_effort and verbosity,
  drop tool_choice when unsupported and always omit presence_penalty, frequency_penalty, stop, logit_bias, modalities,
  prediction, audio and web_search_options; omit logprobs, top_p and top_logprobs without supports_none_reasoning_effort.
  version_boundaries: Parse the last slash component with ^gpt-(digits)(optional .digits) followed by . or - or
  end, default minor 0, and compare >=5.4, >=5.6 and >=6.0; is_model_gpt_5_2_model separately accepts prefixes gpt-5.2
  or gpt-5.4 only. o_series_capability_fallback: B174 provider-resolution failure logs a debug fallback to openai;
  capability checks gate tools/tool_choice/function_call/functions, parallel_tool_calls and response_format. O-series
  always omits logprobs, top_p, presence_penalty, frequency_penalty and top_logprobs. o_series_temperature_limit:
  Map max_tokens to max_completion_tokens; temperature None is omitted, 1 retained, otherwise strict boolean litellm.drop_params/drop_params
  true drops it or raises UnsupportedParamsError 400.


  Consume the B175/B206 injected drop_params policy (default false) and B174 provider resolver; place the callback
  records below betterlite-provider so the leaf has no reverse crate import. Common message normalization is B503;
  catalog capability lookup remains the existing catalog owner, with one shared implementation.


  Shared supports/declared capability functions are B2221; raw Anthropic catalog flags are B2216 where the owned
  code calls those functions. These are lower prerequisites, not B157 SDK calls.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-openai/src/reasoning_models.rs with adjacent tests under reasoning_models/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function reasoning_models_cases in betterlite-openai with these exact named cases (one per oracle
  file): gpt5_search_allowlist, gpt5_chat_exclusion, gpt6_family_selection, dict_effort_normalization, xhigh_opt_in,
  low_minimal_opt_out, catalog_before_default_key, temperature_while_thinking, sampling_with_none, o1_developer_roles,
  audio_token_parameter, gpt5_regular_allowlist, version_boundaries, o_series_capability_fallback, o_series_temperature_limit.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_reasoning_models* using HelperCase: kind:
  helper and the externally tagged openai_reasoning_models variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_reasoning_models that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 361 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 365 production lines, 240 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
