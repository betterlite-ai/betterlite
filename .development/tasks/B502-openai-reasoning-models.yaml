  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/lib.rs
  - crates/betterlite-openai/src/error.rs
  - crates/betterlite-openai/src/reasoning_models.rs
  - crates/betterlite-openai/src/reasoning_models/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/openai/reasoning_models.rs
  - tools/oracle/src/helpers/openai/reasoning_models/**
  - tools/oracle/helpers/openai_reasoning_models.py
  - tools/oracle/helpers/openai_reasoning_models/**
  - tools/oracle/cases/helpers/providers/openai-reasoning-models/**
  - tools/oracle/fuzz/corpus/helper_case/openai_reasoning_models*
  lint_tables: false
