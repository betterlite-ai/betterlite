id: B502
title: OpenAI reasoning and audio model parameters
description: >-
  Add typed ReasoningPolicy selection to the existing chat mapper, including catalog-declared defaults and the older-catalog
  fallback. Reuse existing exact decimals, role transforms and drop reporting. This module owns model capability
  selection and parameter mapping only; existing request serialization invokes it. No tokenizer or template acquisition
  is introduced.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/chat/gpt_5_transformation.py:
  _catalogue_declares_default_effort L18-L31; _normalize_reasoning_effort_for_chat_completion L34-L48; _get_effort_level
  L51-L64; is_gpt_reasoning_series_name L70-L72; OpenAIGPT5Config.is_model_gpt_5_model L86-L87; OpenAIGPT5Config.is_model_gpt_5_search_model
  L90-L99; OpenAIGPT5Config.is_model_gpt_5_2_model L107-L110; OpenAIGPT5Config._gpt_series_version L119-L123; OpenAIGPT5Config.is_model_gpt_5_4_plus_model
  L126-L129; OpenAIGPT5Config.is_model_gpt_5_6_plus_model L132-L134; OpenAIGPT5Config.is_model_gpt_6_plus_model
  L137-L139; OpenAIGPT5Config._model_map_lookup_name L142-L150; OpenAIGPT5Config._supports_reasoning_effort_level
  L153-L164; OpenAIGPT5Config.effort_resolves_to_none L167-L193; OpenAIGPT5Config._is_reasoning_effort_level_explicitly_disabled
  L196-L210; OpenAIGPT5Config.get_supported_openai_params L212-L253; OpenAIGPT5Config.map_openai_params L255-L367.
  litellm/llms/openai/chat/o_series_transformation.py: OpenAIOSeriesConfig.get_config L37-L38; OpenAIOSeriesConfig.translate_developer_role_to_system_role
  L40-L44; OpenAIOSeriesConfig.get_supported_openai_params L46-L89; OpenAIOSeriesConfig.map_openai_params L91-L115;
  OpenAIOSeriesConfig.is_model_o_series_model L117-L124; OpenAIOSeriesConfig._transform_messages L127-L129; OpenAIOSeriesConfig._transform_messages
  L132-L137; OpenAIOSeriesConfig._transform_messages L139-L156. litellm/llms/openai/chat/gpt_audio_transformation.py:
  OpenAIGPTAudioConfig.get_config L20-L21; OpenAIGPTAudioConfig.get_supported_openai_params L23-L31; OpenAIGPTAudioConfig.is_model_gpt_audio_model
  L33-L36; OpenAIGPTAudioConfig._map_openai_params L38-L50.


  Implement crates/betterlite-openai/src/reasoning_models.rs with adjacent tests under reasoning_models/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_reasoning_models in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function reasoning_models_cases in betterlite-openai with these exact named cases (one per oracle
  file): gpt5_search_allowlist, gpt5_chat_exclusion, gpt6_family_selection, dict_effort_normalization, xhigh_opt_in,
  low_minimal_opt_out, catalog_before_default_key, temperature_while_thinking, sampling_with_none, o1_developer_roles,
  audio_token_parameter. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_reasoning_models* using HelperCase: kind:
  helper and the externally tagged openai_reasoning_models variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_reasoning_models that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 378 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 395 production lines, 144 behavior/config-test lines,
  99 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 663 planned, 675 maximum changed lines.
