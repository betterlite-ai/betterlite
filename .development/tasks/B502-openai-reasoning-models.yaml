    why: Names containing both gpt-5 and search allow only max_tokens, max_completion_tokens, stream, stream_options,
      web_search_options, service_tier, safety_identifier, response_format, user, store, verbosity, max_retries
      and extra_headers; map max_tokens to max_completion_tokens before filtering.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::reasoning_models_cases::case_[0-9]+_gpt5_search_allowlist$/)'
  - id: case-gpt5-chat-exclusion
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-reasoning-models/gpt5-chat-exclusion.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::reasoning_models_cases::case_[0-9]+_gpt5_chat_exclusion$/)'
