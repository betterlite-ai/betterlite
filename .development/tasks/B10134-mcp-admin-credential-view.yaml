id: B10134
title: MCP admin credential view
description: >-
  Every MCP management route that answers with a stored server row first passes it through LiteLLM's _redact_mcp_credentials: a copy of the LiteLLM_MCPServerTable row whose credentials keep only the non-secret admin config the edit form shows, and whose mcp_info carries two publicity flags. B4721's create and update routes answer with exactly that row, and B4717's sanitizers, B4718, B4720 and B4722 start from it. It used to sit in B4717 with the sanitizers and the access checks, so B4721 waited for all of them. This task builds only the projection. Code goes in betterlite-server, module mcp::admin_credential_view (crates/betterlite-server/src/mcp/admin_credential_view.rs), with its tests in admin_credential_view/tests.rs. The file is an empty stub that mcp.rs already declares.


  Types come from done tasks: McpServerTable (LiteLLM_MCPServerTable) from B858 in betterlite_db::managed_resource_rows::mcp, MCPCredentials and MCPInfo from B2305 in betterlite_db::mcp_stored_contracts, ServerRegistry from B10020 in betterlite_mcp::registry::servers, and the PublicServers trait with is_server_public from B10079 in betterlite_mcp::registry::public_servers. Build these three public items and nothing else.

  1. `MCP_ADMIN_CONFIG_CREDENTIAL_KEYS: [&str; 2] = ["upstream_resource", "upstream_token_header"]`, LiteLLM's constant from litellm/types/mcp.py. B4717's _has_non_admin_config_credentials reads the same list, so it is declared once, here.

  2. `redact_mcp_credentials(server: &McpServerTable, registry: &ServerRegistry, public_ids: &[String]) -> Result<McpServerTable, CredentialViewError>` is _redact_mcp_credentials. Clone the row and change two fields; every other field stays as stored.

  a. credentials becomes the stored value's admin config (_preserved_admin_config_credentials). Build a new MCPCredentials where upstream_resource and upstream_token_header are kept only when the stored value is a non-empty string (Some(Some(text)) with text not empty), scopes is kept only when it is a non-empty list whose every entry is a non-empty string, and every other field is None so serde leaves it out. MCPCredentials has no Default, so write the struct literal with every field. When none of the three survives, or the row has no credentials, the result is None. The secret fields (auth_value, client_secret, the AWS keys, client_private_key and the rest) never survive, whatever they hold.

  b. mcp_info becomes the stored map (an empty map when it is None) with is_public set to registry.is_server_public(server_id, Some(public_ids)) and is_public_explicit set to is_public and public_ids containing server_id, both JSON booleans that replace stored keys of the same names. The result is always Some, even for a row stored without mcp_info. MCPInfo is a newtype over a private map with only TryFrom<BTreeMap<String, JsonValue>> and serde, so take the map through its serde form and rebuild it with MCPInfo::try_from, as crates/betterlite-server/src/public_endpoints/resource_hubs/mcp_hub.rs does with stored metadata.

  public_ids is the live litellm_settings.public_mcp_servers list, an empty slice when it is unset. LiteLLM reads that one global for both flags, so both come from this one slice. B10020's RegistrySettings is pub(crate) in betterlite-mcp, so callers pass the list in; B4721 reads it through its PublicServerSetting port.

  3. CredentialViewError, this module's thiserror enum, has one variant per failure of that round trip: serde_json::Error and B2305's PinnedError, each kept as its #[source]. Neither happens for a row the decoder accepted, and callers answer either as a 500.

  A list is a plain map over redact_mcp_credentials; that wrapper (_redact_mcp_credentials_list) stays with B4717 next to the sanitizers.


  Oracle. Helper operation b10134 takes one call: server (a LiteLLM_MCPServerTable object), config_servers and db_servers (ordered lists of MCPServer records, as b10079's cases send them), public_mcp_servers (a list or null) and public_hub_strict. It answers an object with only the credentials and mcp_info of the redacted row, since the rest is a copy. The Python side imports _redact_mcp_credentials from litellm.proxy.management_endpoints.mcp_management_endpoints, builds the manager the way tools/oracle/helpers/b10079.py does, puts it in that module's global_mcp_server_manager, sets litellm.public_mcp_servers and litellm.public_mcp_hub_strict_whitelist, and restores all three after the call. The Rust side deserializes the row into McpServerTable, builds the ServerRegistry with RegistrySettings from the same values, and passes public_mcp_servers (empty for null) as public_ids. Add helper_case corpus seeds named mcp-admin-credential-view-*.


  Tests in admin_credential_view::tests use synthetic rows (server ids like test-srv-1, values like test-secret). Names starting with credentials_ cover 2a: secrets dropped and the three admin keys kept, an empty upstream value dropped, scopes with one empty entry dropped, an empty scopes list dropped, only secrets giving None, no credentials giving None, and a check that the serialized result holds no key outside MCP_ADMIN_CONFIG_CREDENTIAL_KEYS and scopes. Names starting with public_ cover 2b: a listed server with the strict default (both flags true), an unlisted public-internet server with strict off (is_public true, is_public_explicit false), a listed id the registry does not hold (both false), a row without mcp_info, stored mcp_info keys kept, and stored is_public values overwritten.

scope:
  paths:
    - crates/betterlite-server/src/mcp/admin_credential_view.rs
    - crates/betterlite-server/src/mcp/admin_credential_view/**
    - tools/oracle/cases/helpers/mcp-admin-credential-view/**
    - "tools/oracle/fuzz/corpus/helper_case/mcp-admin-credential-view-*"
    - tools/oracle/helpers/b10134.py
    - tools/oracle/helpers/b10134/**
    - tools/oracle/src/helpers/server/b10134.rs
    - tools/oracle/src/helpers/server/b10134/**
  lint_tables: false

references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L639-L662
    why: Owned. _redact_mcp_credentials, the deep copy, the credentials swap and the is_public and is_public_explicit decoration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L664-L702
    why: Owned. _preserved_admin_config_credentials, the non-empty string and scopes rules and the None result.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp.py#L383-L385
    why: Owned. MCP_ADMIN_CONFIG_CREDENTIAL_KEYS, the two admin config keys.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L6954-L6960
    why: is_mcp_server_public, built by B10079 as is_server_public; the projection calls it with the passed list.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L1802-L1898
    why: Call site in B4721. The create route answers with the redacted row.

dod:
  - text: redact_mcp_credentials keeps upstream_resource and upstream_token_header only as non-empty strings and scopes only as a non-empty list of non-empty strings, drops every secret field, and gives None credentials when nothing survives or nothing was stored.
    proof: [credentials-tests, oracle, helper-python]
  - text: The serialized credentials of a redacted row hold no key outside MCP_ADMIN_CONFIG_CREDENTIAL_KEYS and scopes, and every other row field is unchanged.
    proof: [credentials-tests]
  - text: mcp_info always comes back with is_public from is_server_public over the passed list and is_public_explicit true only when that list holds the id, keeping the stored keys and overwriting stored flags of the same names.
    proof: [public-tests, oracle, helper-python]
  - text: New mcp-admin-credential-view seeds for b10134 replay through the shared helper case parser.
    proof: [helper-case-corpus]

checks:
  optional: []
  commands:
    - id: credentials-tests
      why: The admin config projection keeps a secret, drops an admin key or scope it should keep, or changes another row field.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::admin_credential_view::tests::credentials_/)'
    - id: public-tests
      why: The is_public or is_public_explicit flag is missing, reads another list or drops stored mcp_info keys.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::admin_credential_view::tests::public_/)'
    - id: helper-python
      why: The b10134 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10134.py tools/oracle/helpers/b10134)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10134 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/mcp-admin-credential-view-*")" &&
        grep -lE 'b10134"?:' tools/oracle/fuzz/corpus/helper_case/mcp-admin-credential-view-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-server --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/mcp-admin-credential-view/secrets-dropped-admin-config-kept.yaml
  - tools/oracle/cases/helpers/mcp-admin-credential-view/only-secrets-gives-null.yaml
  - tools/oracle/cases/helpers/mcp-admin-credential-view/empty-values-dropped.yaml
  - tools/oracle/cases/helpers/mcp-admin-credential-view/no-credentials-no-mcp-info.yaml
  - tools/oracle/cases/helpers/mcp-admin-credential-view/listed-server-explicit.yaml
  - tools/oracle/cases/helpers/mcp-admin-credential-view/legacy-public-internet.yaml
  - tools/oracle/cases/helpers/mcp-admin-credential-view/listed-id-not-registered.yaml

deviations: []

out_of_scope:
  - "_redact_mcp_credentials_list, _user_is_full_admin, _resolve_credential_target_user_id, the four sanitize functions, _INHERITED_CREDENTIAL_FIELDS, _has_non_admin_config_credentials and _inherit_credentials_from_existing_server: B4717, which calls this module."
  - "_is_restricted_virtual_key_request, _get_user_mcp_management_mode, _resolve_accessible_mcp_servers and _authorize_and_fetch_mcp_server: B10135."
  - "is_mcp_server_public (is_server_public): B10079. LiteLLM_MCPServerTable: B858. MCPCredentials and MCPInfo: B2305. Parsing a credentials column stored as JSON text: the row decoders of B4711 and B4712, before the row reaches this module."
  - "The other functions and routes of mcp_management_endpoints.py: B4711, B4716, B4718 to B4725, B4729 and B4231, as B139 lists them."

pitfalls:
  - "is_public_explicit is is_public and the id is listed, so a listed id the registry does not hold reports both flags false, not is_public_explicit true."
  - "With public_mcp_hub_strict_whitelist off, an unlisted server with available_on_public_internet true is public but not explicit; reading explicit from is_public alone gets this case wrong."
  - "One empty string among the scopes drops the whole scopes list, not just that entry, and an empty list is dropped too."
  - "MCPCredentials fields are Option<Option<T>>: an outer None is left out of the JSON while Some(None) prints null, so a dropped field must be the outer None or the response grows null keys LiteLLM never sends."
  - "LiteLLM's string branch (a credentials value stored as JSON text) does not exist here because McpServerTable already holds parsed MCPCredentials; do not add a second parser."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
