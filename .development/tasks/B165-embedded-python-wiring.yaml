dod:
- text: A hook named by a dotted path next to config.yaml loads, runs sync and async, and a proxy with no hook never starts the interpreter.
  proof: [hooks-tests]
- text: Each of the callbacks, success_callback, failure_callback and audit_log_callbacks lists leaves dotless names alone and loads dotted ones.
  proof: [callback-tests]
- text: A callbacks entry that resolves to a class or to a non-callable fails with the source's two messages, and the other three lists do not check.
  proof: [callback-tests]
- text: post_call_rules, custom_provider_map handlers and custom_validate load as the source does, and custom_validate refuses a function not annotated Literal[True].
  proof: [hooks-tests]
- text: A remote module is fetched through B4143's download and failures read as in B8042.
  proof: [fetcher-tests]
- text: A hook that passes its deadline gives a timeout error and shutdown reports jobs still running.
  proof: [hooks-tests]
- text: CustomRoutingStrategyBase has LiteLLM's two methods with the same signatures.
  proof: [routing-base]
- text: Python files pass ruff and basedpyright in strict mode.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: hooks-tests
    why: Lazy start, slot loading, deadline or shutdown tests are missing.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^python_hooks::(load|slots|deadline|shutdown)::/)'
  - id: callback-tests
    why: Callback list handling or the two error texts are missing.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^python_hooks::callbacks::/)'
  - id: fetcher-tests
    why: The bucket fetcher tests are missing.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^python_hooks::bucket_fetcher::/)'
  - id: routing-base
    why: The routing base class differs from LiteLLM's.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_custom_routing.py
  - id: python-lint
    why: Strict typing has to hold for the new Python files.
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: The interpreter starts on the first Python hook and not at proxy start.
  why: Most deployments use no Python hook, and an interpreter costs memory and start time.
- what: A hook call that takes longer than 30 seconds gives a timeout error to the caller.
  why: LiteLLM sets no deadline on these hooks. B054 needs a bound, and the pool reports jobs it could not stop.
- what: The proxy cannot import `litellm`. User modules import `betterlite` instead.
  why: The module is named betterlite so that LiteLLM's name stays out of what betterlite ships (README, 2026-10-24).
out_of_scope:
- Which hook runs when, and what its result means, belongs to the task that owns the key (B054, B1220, B1224, B1624, B363, B189, B065, B044, B1506, B1546, B1547, B1553). No route reaches this service until they wire it, so their tasks add the HTTP oracle cases.
- The custom_code guardrail (litellm/proxy/guardrails/guardrail_hooks/custom_code/**) is B3801 to B3803. The example modules custom_auth_auto.py and custom_validate.py are B054's, custom_sso.py and custom_hooks/** are B063's, and custom_prompt_management.py is B117's. None of them has a caller at the pin besides the example config.
- types_utils/** is B8042. litellm/proxy/types_utils/README.md is empty.
- Python package installation and the wheel are B5369 and B170.
pitfalls:
- 'The source loads post_call_rules as `[get_instance_fn(value)]`, so a list in YAML would fail at the pin. Do not accept a list.'
- 'Only `callbacks` runs the class check. `success_callback`, `failure_callback` and `audit_log_callbacks` take whatever the dotted path gives, and a class there is silently skipped at call time. Keep that split.'
- 'A callback entry without a dot (`langfuse`, `prometheus`) is not Python. Never hand it to the loader.'
- 'The deadline argument of the pool bounds the wait, not the Python thread. Report abandoned jobs in `shutdown`.'
- 'Do not log hook arguments or results. They carry API keys and prompts.'
- 'Starting the interpreter is not free of races: two first loads at once must start it once. Guard with `tokio::sync::OnceCell`.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
