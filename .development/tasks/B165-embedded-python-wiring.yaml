id: B165
title: Embedded Python in the proxy, config-named hooks and the custom routing base class
description: >-
  This is the last part of B165. B8040 to B8043 built the embedded interpreter crate `betterlite-pyhost` (host, pool, JSON
  crossing, callable handles, `InstanceLoader`, hook objects, optional libraries). This task connects it to the proxy: one
  service in `crates/betterlite-server` that every task with a Python hook uses, and the small Python base class that users
  subclass for routing. It owns the LiteLLM call-site behavior listed below, and no config section.


  `crates/betterlite-server/src/python_hooks.rs` and its folder. `PythonHooks::new(config_file_path: Option<PathBuf>)`
  builds the service and does not start Python. The first `load_*` call starts the interpreter through
  `PythonHost::start` with `module_dirs` set to the folder of `config_file_path` (none when the path is None), so a proxy
  with no Python hook never pays for an interpreter. `PythonHooks::shutdown()` calls the pool's shutdown, and the server's
  stop path calls it. `HookSlot` names where a value came from, for logs and errors: `CustomAuth`, `CustomKeyGenerate`,
  `CustomKeyUpdate`, `CustomKeyPolicy`, `CustomTeamMetadataValidate`, `CustomSso`, `CustomUiSsoSignInHandler`,
  `PostCallRules`, `CustomValidate`, `PassThroughAdapter`, `McpToolHandler`, `GuardrailClass`, `CustomProvider` and
  `Callback(ListKey)`, with `ListKey` being `Callbacks`, `SuccessCallback`, `FailureCallback` or `AuditLogCallbacks`.
  The callers keep reading their own keys (B054, B1220, B1224, B1624, B363, B189) and pass the string value here.


  Methods, all `async` and each running the load on the pool with a 60 second deadline:

  - `load_hook(slot, value: &str) -> Result<LoadedHook, HooksError>` calls `InstanceLoader::load(value, config_path)`, the
    behavior of proxy_server.py L6771-L6811 and the other `get_instance_fn` call sites (tool_registry.py L122,
    pass_through_endpoints.py L2008, guardrail_registry.py L616). `LoadedHook` pairs the `HookObject` with its slot, and
    `call(&self, args, kwargs)` calls it with the default hook deadline of 30 seconds, the figure B054 relies on. A caller
    can pass its own deadline with `call_within`.
  - `load_callback(list_key, entry: &str) -> Result<LoadedCallback, HooksError>` ports callback_utils.py L127-L131 and the
    dotted-entry branches of proxy_server.py L6480-L6540. An entry without a dot is not Python and is returned as
    `LoadedCallback::Named(String)`, never loaded. For `ListKey::Callbacks` the loaded object is checked with `kind`: a
    class gives `HooksError::CallbackIsClass` and anything not callable gives `HooksError::CallbackNotDispatchable`. Their
    texts are the two ValueErrors at L100-L124 of callback_utils.py, word for word, including the hint that builds
    `proxy_handler_instance = {ClassName}()` and `callbacks: ["{module_path}.proxy_handler_instance"]`. The other three keys
    skip the check, as the source does.
  - `load_post_call_rules(value: &str)` returns a list of one handle, as L6434 does. A YAML list value is not supported at the
    pin and is the caller's type error.
  - `load_custom_providers(items: &[CustomProviderItem])` loads each `custom_handler` and returns `(provider,
    HookObject)` in order. Registering the provider name is B044's job.
  - `load_custom_validate(value)` loads the function and runs `check_literal_true_return` on it, the behavior of
    _types.py L5527-L5533.

  The downloader: `BucketModuleFetcher` implements pyhost's `ModuleFetcher` by calling B4143's `download_python_module`
  with the matching `BucketType`, and turns its `ModuleDownloadError` into the fetch error. It lives in this task's
  `bucket_fetcher.rs`.


  Python class: `class CustomRoutingStrategyBase` with the two no-op methods `async_get_available_deployment` and
  `get_available_deployment`, same parameter names, order and defaults as types/router.py L890-L935, each returning None.
  Put it in `python/betterlite/_custom_routing/base.py` (explicit `__all__`) and a re-export module
  `python/betterlite/_custom_routing/__init__.py`. B016 and B363 name these two methods as B165's. The class is re-exported from `betterlite.types.router` and `betterlite.router`. B162 owns both files (no B79xx part covers litellm/types/router.py) and depends on this task, so B162 adds the one import line from `betterlite._custom_routing` to each. This task does not edit them. A pytest file
  checks the signatures against LiteLLM's class with `inspect.signature` and that a subclass overriding both methods can be
  called.
scope:
  paths:
  - crates/betterlite-server/src/python_hooks.rs
  - crates/betterlite-server/src/python_hooks/**
  - crates/betterlite-server/Cargo.toml
  - crates/betterlite-python/python/betterlite/_custom_routing/**
  - crates/betterlite-python/tests/test_custom_routing.py
  lint_tables: false
references:
