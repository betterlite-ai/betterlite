deviations: []
out_of_scope:
  - "The memory handlers: B8541 over B4530. The SSO handlers: B1613, B1614, B1615, B1625, B1626, B1627 and B1628. Their composition and service graph: B063."
  - "The CLI flow, CLI poll, SAML provider and status and debug cases: B8771."
pitfalls:
  - "The SSO login entry, callbacks, SAML and CLI routes carry no auth dependency in LiteLLM; mounting them inside the key check turns every browser login into a 401."
  - "/sso/get/ui_settings and /sso/readiness do need a key, so B063's two routers must not be merged into one place."
  - "The memory key path keeps slashes, so the router B8541 returns must be merged as is, never nested under a prefix."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
