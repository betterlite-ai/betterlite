id: B1121
title: Async image generation entry point
description: >-
  Implement aimage_generation, whole, above B998's image_generation in betterlite-core::api::image_generation_plan.
  This entry owns async result normalization and context propagation, not half an Azure request. It forces
  aimg_generation=true, resolves provider for exception attribution from model and api_base, invokes generation
  once, then accepts an ImageResponse, constructs one from a dict or awaits a coroutine. Unexpected return
  types raise ValueError before B011 exception mapping. No extra SDK retry belongs here.

  Preserve the unusual positional selection: args[0] is used as the wrapper's model although image_generation's
  first argument is prompt. With no positional argument it requires kwargs[model]; a missing key fails before
  the try block. Keep that SDK behavior in B159's Python facade and test it natively through a typed invocation
  descriptor. The Rust executor propagates request context without blocking its async runtime. Provider attribution
  falls back to openai only inside the exception handler when provider resolution did not set a truthy provider.

  Use B2401's SDK HTTP driver with sync_mode=async and B998's operation encoding. Add a wrapper-specific adapter
  only for result-shape/context fault injection; it must still execute HTTP for normal calls. This function has
  39 nonblank/non-comment lines; 80 implementation/facade, 110 tests, 100 cases, 70 adapters and 40 wiring lines
  fit a 400-line integration task. Generation overloads and all Azure settings now belong to B998.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/image_generation_plan.rs
  - crates/betterlite-core/src/api/image_generation_plan/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/image_generation_plan.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/image_generation_plan.py
  - tools/oracle/cases/sdk-http/image-generation-plan/**
  - tools/oracle/fuzz/corpus/sdk_http_case/image-generation-plan-*
  - tools/oracle/helpers/b1121.py
  - tools/oracle/helpers/b1121/**
  - tools/oracle/src/helpers/core_ops/b1121.rs
  - tools/oracle/src/helpers/core_ops/b1121/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L79-L129
  why: Own the complete async wrapper, its pre-try model lookup and three accepted result shapes.
dod:
- text: >-
    async_generation_http calls aimage_generation(model="openai/dall-e-2",prompt="cat") against the mock.
    Expect one POST /v1/images/generations and {created:1,data:[{b64_json:YQ==}]} from the mock reply. A caller's
    aimg_generation=false is overwritten to true. A request-context marker remains visible in the dispatched
    call and in logging. No second call is made when the result is already an ImageResponse.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    async_generation_result_shapes injects dict {created:1,data:[]}, ImageResponse with those fields and a
    coroutine returning that response: each produces the same ImageResponse, with the coroutine awaited once.
    An integer return raises ValueError with source message "Unable to get Image Response. Please pass a valid
    llm_provider." through B011. A failure before resolved provider attribution uses openai; resolved azure
    stays azure. Failure records retain B011's SDK status/class/nullable type,param,code rather than proxy fields.
  proof: [behavior-tests]
- text: >-
    async_generation_model_lookup passes no positional args and omits model: KeyError("model") escapes before
    provider I/O or the wrapper mapper. With args=["openai/dall-e-2"], that string is used for wrapper provider
    attribution even though the callee interprets it as prompt. A native spy proves argument order is unchanged.
  proof: [behavior-tests]
- text: The async wrapper HTTP fixtures and SDK operation seeds are newly added and invoke the pinned SDK entry point.
  proof: [new-cases, sdk-corpus, oracle, sdk-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Result normalization, call count and pre-try model lookup require wrapper-specific assertions.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_generation_plan::tests::/)'
  - id: sdk-python
    why: Async generation must be compared through the actual pinned SDK.
    run: test -f tools/oracle/sdk_http/image_generation_plan.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: The async invocation tag needs a valid parser seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/image-generation-plan-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: Normal async execution must send HTTP rather than compare a prepared plan.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/image-generation-plan)"
oracle_cases:
- tools/oracle/cases/sdk-http/image-generation-plan/async-generation-http.yaml
deviations: []
out_of_scope:
- B998 owns image_generation and its overload declarations; B999 owns both edit entry points and lazy ImageEditRequestUtils import accessors; B1000 owns both variation entry points.
- B159 owns Python package exports and event-loop facades; B011 owns exception_type and B174 get_llm_provider.
pitfalls:
- Missing keyword model raises before the wrapper's try block, so it must not become the later invalid-response error.
- The wrapper uses the first positional argument as model even though generation calls name that position prompt.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 0
