id: B212
title: Parameter projections and service-tier helpers
description: >-
  Implement ModelParamHelper content-free logging/cache-key name projection, reasoning_effort_utils budget thresholds
  and service_tier_utils over plain inputs: response service_tier, usage service_tier and requested tier. B190 supplies
  those fields from its payload, so this task has no logging dependency. Derive the seven request-type name sets
  from the OpenAI SDK version locked by B001 in tools/oracle/litellm/uv.lock, plus LiteLLM typed rerank/Anthropic
  names; keep a pinned fixture of the projection. logging-projection includes one discriminating key for chat, text
  completion, embedding, transcription, rerank, Responses and Anthropic messages. Budget 190 helpers, 110 adapters,
  260 tests and 50 wiring (610 total). Write the behavior rstest functions parameter_projections_behavior_tests_behavior in adjacent
  tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have separate
  names. The helper operation parameter_projections is already registered;
  each operation has its own Rust and Python adapter file and corpus seed.


  These pure policies live in betterlite-models below the executable provider dispatcher. Use catalog/wire DTOs
  and closed config tags or caller-supplied policy projections, never an executable provider client. B010 reexports
  ProviderId and composes the provider enum; do not import betterlite-provider or betterlite-core here.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-models/Cargo.toml
  - crates/betterlite-models/src/lib.rs
  - crates/betterlite-models/src/error.rs
  - crates/betterlite-models/src/projections.rs
  - crates/betterlite-models/src/projections/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/models/parameter_projections.rs
  - tools/oracle/src/helpers/models/parameter_projections/**
  - tools/oracle/helpers/parameter_projections.py
  - tools/oracle/helpers/parameter_projections/**
  - tools/oracle/cases/helpers/parameter-projections/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/model_param_helper.py#L25-L185
  why: Standard API parameters and excluded content/metadata fields.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/reasoning_effort_utils.py#L12-L26
  why: Thinking budget thresholds.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/service_tier_utils.py#L18-L70
  why: Served, requested and logging service-tier selection.
dod:
- text: Each listed helper case compares its named production function with the pinned Python function, including
    precedence, omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::parameter_projections_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'parameter_projections' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/parameter-projections/logging-projection.yaml
- tools/oracle/cases/helpers/parameter-projections/reasoning-boundaries.yaml
- tools/oracle/cases/helpers/parameter-projections/response-tier.yaml
- tools/oracle/cases/helpers/parameter-projections/usage-tier.yaml
- tools/oracle/cases/helpers/parameter-projections/requested-tier.yaml
- tools/oracle/cases/helpers/parameter-projections/unknown-requested-tier.yaml
deviations: []
out_of_scope:
- The remaining functions in the shared covered paths belong to B175 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as parameter_projections in the models group. Replace the stub Op in tools/oracle/src/helpers/models/parameter_projections.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/parameter_projections.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
