id: B230
title: Bedrock Converse block processor
description: >-
  Implement All BedrockConverseMessagesProcessor methods as explicit typed transformations, using B227/B228/B229
  for media, tools and ordering. Inject model capabilities and forbid global reverse-name or message state. Budget
  280 transforms/types, 100 adapters, 300 tests/fuzz and 70 wiring (750 total). Write the behavior rstest functions
  bedrock_processor_behavior_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure in the
  DoD; corpus replay tests have separate names. The helper operation bedrock_processor is already registered; each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/bedrock_processor.rs
  - crates/betterlite-prompts/src/bedrock_processor/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/prompts/bedrock_processor.rs
  - tools/oracle/src/helpers/prompts/bedrock_processor/**
  - tools/oracle/helpers/bedrock_processor.py
  - tools/oracle/helpers/bedrock_processor/**
  - tools/oracle/cases/helpers/bedrock-processor/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L4312-L4713
  why: Exact function/class ownership.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::bedrock_processor_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'bedrock_processor' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/bedrock-processor/user-blocks.yaml
- tools/oracle/cases/helpers/bedrock-processor/assistant-blocks.yaml
- tools/oracle/cases/helpers/bedrock-processor/tool-blocks.yaml
- tools/oracle/cases/helpers/bedrock-processor/system-blocks.yaml
- tools/oracle/cases/helpers/bedrock-processor/mixed-media.yaml
- tools/oracle/cases/helpers/bedrock-processor/repeat-conversion.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B181 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_processor in the prompts group. Replace the stub Op in tools/oracle/src/helpers/prompts/bedrock_processor.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_processor.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
