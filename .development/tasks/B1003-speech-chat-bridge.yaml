dod:
- text: >-
    speech_chat_request sends model=gpt-4o-audio-preview,input=hello,voice=alloy,options={temperature:0,
    response_format:mp3,speed:2},headers={x:a}. One mock /v1/chat/completions request has messages=[{role:user,
    content:hello}],modalities=[audio],audio={voice:alloy,format:mp3},temperature=0 and no speed/response_format.
    A dict or None voice omits audio; string "" retains voice="". litellm_params overriding model/messages/
    modalities/audio wins over earlier fields, while its headers/provider/logging entries lose to explicit values.
    The mock's first choice audio.data=YQ== becomes byte a with audio/mpeg and status 200.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    gemini_pcm_and_wav uses gemini-2.5-flash-preview-tts and voice=Kore. Requested pcm and wav both send
    audio.format=pcm16; pcm returns decoded bytes 0000 with audio/pcm, while wav/default wraps them in RIFF/WAVE,
    PCM format=1,channels=1,sample_rate=24000,byte_rate=48000,block_align=2,bits=16,data_size=2,RIFF size=38.
    Odd-sized PCM is not padded. A supplied string mp3 raises BadRequestError 400 before HTTP with source
    message "Gemini TTS only produces raw PCM16 audio, so response_format='mp3' is not supported. Supported
    response formats: pcm, wav." Nonstring format is accepted and defaults to WAV. A response model without
    gemini/tts returns audio/mpeg even for a Gemini request.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    speech_bridge_failures supplies missing/wrong-type model,custom_llm_provider,input,optional_params,
    litellm_params,headers,logging_obj individually: ValueError("<name> is required") and zero HTTP. Empty
    strings/maps pass; voice is optional. Missing audio raises ValueError("No audio part found in the response");
    empty choices raises IndexError at the source, represented as a typed native failure. Base64 "Y Q==!"
    decodes a; invalid padding fails, not empty audio. A non-ModelResponse completion result raises Exception
    with source "Unmapped response type. Got type: <class 'dict'>" for a dict. Cost 2.0 survives, while 2,true,
    "2" and missing cost become None. A mock 429 follows B004/B011 SDK failure projection unchanged.
  proof: [behavior-tests, oracle, adapters, parser-corpus]
- text: >-
    speech_media_precedence uses upstream=" AUDIO/FLAC; charset=x ",format=mp3 and expects audio/flac.
    application/octet-stream plus WAV yields audio/wav; unknown/None format falls back to audio/mpeg.
    audio/custom is retained. Sniff RIFF....WAVE,fLaC,ID3 as audio/wav,audio/flac,audio/mpeg; OggS with OpusHead
    fully inside bytes 0..63 gives audio/opus, outside gives audio/ogg. FF F1 50 recognizes AAC; ADTS sample-rate
    index 13..15 rejects. MPEG rejects reserved version=1,layer=0,bitrate=15,sample-rate=3; valid FF FB 90 is
    audio/mpeg. Inputs shorter than 3 bytes, non-FF frames and unknown signatures return None without warning.
  proof: [behavior-tests, oracle, adapters, parser-corpus]
- text: Both SDK and pure MIME operations have new tagged seeds and the audio byte decoders replay their new corpus.
  proof: [corpora, parser-corpus, new-cases, oracle, adapters]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Bridge requests, response bytes and MIME helpers live in separate production crates.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai --no-tests=fail -E 'test(/^api::speech_chat_bridge::/) - test(/::replays_corpus$/)'
  - id: adapters
    why: Provider calls need the SDK HTTP adapter; only MIME transforms use helper dispatch.
    run: test -f tools/oracle/sdk_http/speech_chat_bridge.py && test -f tools/oracle/helpers/speech_media_type.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: parser-corpus
    why: Audio signature/base64 decoding must use bounded production functions under fuzz and replay.
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/speech_audio.rs && grep -qF decode_chat_audio_base64 crates/betterlite-openai/fuzz/fuzz_targets/speech_audio.rs && grep -qF sniff_speech_audio crates/betterlite-openai/fuzz/fuzz_targets/speech_audio.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/speech_audio)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::replays_corpus$/)'
  - id: corpora
    why: Both adapter tags need parser seeds introduced by this task.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/speech-chat-bridge-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/speech_media_type-*)" && grep -qE '^[[:space:]]+speech_media_type:' tools/oracle/fuzz/corpus/helper_case/speech_media_type-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: This branch must add both real provider-call and pure MIME fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/speech-chat-bridge)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/speech-media-type)"
oracle_cases:
- tools/oracle/cases/sdk-http/speech-chat-bridge/speech-chat-request.yaml
- tools/oracle/cases/sdk-http/speech-chat-bridge/gemini-pcm-and-wav.yaml
- tools/oracle/cases/sdk-http/speech-chat-bridge/speech-bridge-failures.yaml
- tools/oracle/cases/helpers/speech-media-type/speech-media-precedence.yaml
deviations: []
out_of_scope:
- B1001 owns every audio_utils/utils.py function through calculate_request_duration at line 331; the five MIME/sniff functions after it belong here.
- B004 owns completion execution and HttpxBinaryResponseContent; B011 owns provider error normalization; B1135's base speech interface is not called by this bridge.
pitfalls:
- The bridge does not require voice; nonstring voice omits chat audio rather than raising a voice error.
- Response model controls PCM-to-WAV conversion, so request-model detection alone is insufficient.
- Non-Gemini output is always labeled audio/mpeg here; MIME sniffing is a separate helper used by route consumers.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
