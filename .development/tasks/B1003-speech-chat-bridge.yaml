id: B1003
title: Speech through chat completions and audio MIME
description: >-
  Implement both speech_to_completion_bridge classes in betterlite-core::api::speech_chat_bridge and the
  audio_utils MIME helpers in a leaf betterlite-openai module of the same name. Own validation, request
  projection, completion invocation, base64 response extraction, PCM16-to-WAV and speech media-type resolution.
  B004 supplies completion and binary response records, B1128 MIME tables and B1087 bounds. The constructor
  merely composes these services; do not recreate Python's module singleton.

  Validate model/provider/input as strings and optional_params/litellm_params/headers as dictionaries plus a
  logging object; empty strings/maps pass. Voice is not validated. Construct model,messages=[user input],
  modalities=[audio], then allowed chat options excluding response_format, then audio, then litellm_params,
  then explicit headers/logging/provider. Drop only None values. Thus litellm_params can overwrite model,
  messages,modalities,audio; explicit trailing headers/logging/provider win. Allowed options are functions,
  function_call,temperature,top_p,n,stream,stream_options,stop,max_completion_tokens,modalities,prediction,audio,
  max_tokens,presence_penalty,frequency_penalty,logit_bias,user,request_timeout,api_base,api_version,api_key,
  deployment_id,organization,base_url,default_headers,timeout,seed,tools,tool_choice,max_retries,
  parallel_tool_calls,logprobs,top_logprobs,reasoning_effort,extra_headers,thinking,web_search_options,
  include_server_side_tool_invocations,service_tier,prompt_cache_key,prompt_cache_retention,safety_identifier,
  verbosity,store. Other option keys are silently omitted.

  Gemini TTS detection is case-insensitive substring gemini plus tts. Only response_format=pcm or wav is
  accepted when supplied as a string; missing/nonstring is allowed. Its chat audio format is always pcm16.
  Other models use a string response_format as audio.format, or omit format. A nonstring voice omits audio.
  Read only choices[0].message.audio; decode its data with Python-compatible base64. Response model, not request
  model, selects Gemini conversion. Gemini pcm stays raw with audio/pcm; every other format becomes 24kHz mono
  16-bit WAV. Other models return raw bytes with audio/mpeg regardless of requested format. Preserve response
  cost only for a Python float hidden response_cost, not int/bool/string; represent retained cost as Decimal.

  resolve_speech_media_type strips parameters/whitespace and lowercases upstream Content-Type; any audio/*
  wins, else a recognized audio response-format extension, else audio/mpeg. Byte sniffing recognizes RIFF/WAVE,
  fLaC,OggS (OpusHead within first 64 bytes),ID3 and guarded ADTS/MPEG frame signatures; it does not decode audio.
  Expose decode_chat_audio_base64 and sniff_speech_audio(bytes,limits) at actual boundaries and fuzz/replay both,
  with the first fuzz byte choosing base64 text or audio header input. Register B2401 speech_chat_bridge for
  provider HTTP and B171 speech_media_type only for pure MIME/sniff cases. Ownership is 295 nonblank/non-comment
  method lines plus the referenced option allowlist; budget 270 implementation,160 tests,125 fixtures,120 adapters,65 fuzz and 40 wiring,
  780 lines. No bridge-only streaming or cancellation behavior is invented.
