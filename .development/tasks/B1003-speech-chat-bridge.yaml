checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::speech_chat_bridge::/)
      - test(/::replays_corpus$/)'
  - id: case-speech-chat-audio-request
    why: the speech-chat-audio-request behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::speech_chat_audio_request($|::)/)'
  - id: case-voice-required
    why: the voice-required behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::voice_required($|::)/)'
  - id: case-pcm-content-type
    why: the pcm-content-type behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::pcm_content_type($|::)/)'
  - id: case-aac-mpeg-sniff
    why: the aac-mpeg-sniff behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::aac_mpeg_sniff($|::)/)'
  - id: case-explicit-response-format
    why: the explicit-response-format behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::explicit_response_format($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/speech-chat-bridge-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/speech_chat_bridge)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/speech_chat_bridge.rs && grep -qF "decode_speech_chat_bridge"
      crates/betterlite-core/fuzz/fuzz_targets/speech_chat_bridge.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::speech_chat_bridge::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/speech_chat_bridge.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/speech_chat_bridge-*)"
      && grep -qE "^[[:space:]]+speech_chat_bridge:" tools/oracle/fuzz/corpus/helper_case/speech_chat_bridge-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/speech-chat-bridge)"
