id: B1003
title: Speech chat bridge
description: >-
  Implement typed speech preparation and the speech-to-chat-audio bridge using B014, plus response content-type
  selection/sniffing. Model voice, input, response_format, speed and returned audio bytes explicitly; use B900 to
  verify binary results and preserve source format precedence.


  Provider behavior comes through B010 prepared operation/capability values; no provider umbrella is a scheduling
  dependency.


  Implement crates/betterlite-core/src/api/speech_chat_bridge.rs. Use SpeechChatBridgeInput and SpeechChatBridgeResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions speech_chat_audio_request, voice_required, pcm_content_type, aac_mpeg_sniff,
  explicit_response_format under api::speech_chat_bridge::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.REQUEST_TIMEOUT
  defaults to 6000 seconds. No environment reads occur outside betterlite-config. Test api::speech_chat_bridge::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::speech_chat_bridge::decode_speech_chat_bridge(bytes:
  &[u8], limits: &ApiLimits), for base64.b64decode input audio_part.data at litellm/endpoints/speech/speech_to_completion_bridge/transformation.py:169.
  Place its implementation in crates/betterlite-core/src/api/speech_chat_bridge.rs and call it from the actual boundary.
  The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/speech_chat_bridge.rs passes arbitrary bounded
  bytes to that exact decoder; api::speech_chat_bridge::tests::replays_corpus replays newly committed seeds through
  the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::SpeechChatBridge in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {speech_chat_bridge: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/endpoints/speech/speech_to_completion_bridge/handler.py: SpeechToCompletionBridgeHandler.__init__
  (L26-L30); litellm/endpoints/speech/speech_to_completion_bridge/handler.py: SpeechToCompletionBridgeHandler.validate_input_kwargs
  (L32-L76); litellm/endpoints/speech/speech_to_completion_bridge/handler.py: SpeechToCompletionBridgeHandler.speech
  (L78-L125); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: _completion_response_cost
  (L15-L20); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler._validate_response_format
  (L34-L52); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler._chat_completion_params
  (L54-L61); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler._chat_audio_format
  (L63-L67); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler._chat_audio_param
  (L69-L79); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler.transform_request
  (L81-L105); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler._convert_pcm16_to_wav
  (L107-L145); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler._is_gemini_tts_model
  (L147-L149); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler._gemini_tts_response_body
  (L151-L154); litellm/endpoints/speech/speech_to_completion_bridge/transformation.py: SpeechToCompletionBridgeTransformationHandler.transform_response
  (L156-L182); litellm/litellm_core_utils/audio_utils/utils.py: _speech_media_type_for_response_format (L337-L344);
  litellm/litellm_core_utils/audio_utils/utils.py: resolve_speech_media_type (L347-L354); litellm/litellm_core_utils/audio_utils/utils.py:
  _adts_aac_frame_media_type (L368-L370); litellm/litellm_core_utils/audio_utils/utils.py: _mpeg_audio_frame_media_type
  (L373-L386); litellm/litellm_core_utils/audio_utils/utils.py: speech_media_type_from_audio_bytes (L389-L403).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 298 owned nonblank/non-comment/non-docstring Python lines (311 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 318 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 30 wiring; 661 total within the 670-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B1135 (Speech provider contract), B002 (Load
  LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
