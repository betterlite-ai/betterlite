id: B923
title: Construct lifecycle and content events for chat-backed Responses
description: >-
  Implement api::chat_response_stream_items over B922's shared state. Own complete methods
  L487-L563 and L586-L898: initial response defaults, content/reasoning event builders,
  snapshot assembly, default-done progression and finished predicate. The unused
  create_output_item_added_event L565-L584 has no caller at the pin and is excluded.
  B924 owns both priming methods and all upstream reads, keeping this task's B171
  chat_response_stream_items cases pure. Inject clock and UUID generation for exact events.

  Use B904 response-ID encoding, B907 tool-choice conversion, B1115 annotations and B2227
  stream_chunk_builder. Preserve event constructor defaults from B1113 rather than stamping
  a new sequence on every event. B004/B1138 supply result types. The live ranges have
  359 nonblank/non-comment physical lines, including lengthy example docstrings; budget
  280 implementation, 185 tests, 120 fixtures, 90 adapters and 25 wiring lines: 700 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/chat_response_stream_items.rs
  - crates/betterlite-core/src/api/chat_response_stream_items/**
  - tools/oracle/src/helpers/core_ops/chat_response_stream_items.rs
  - tools/oracle/src/helpers/core_ops/chat_response_stream_items/**
  - tools/oracle/helpers/chat_response_stream_items.py
  - tools/oracle/helpers/chat_response_stream_items/**
  - tools/oracle/fuzz/corpus/helper_case/chat_response_stream_items-*
  - tools/oracle/cases/helpers/chat-response-stream-items/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/streaming_iterator.py#L487-L563
  why: Response creation/in-progress payloads have fixed defaults independent of several supplied request values.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/streaming_iterator.py#L586-L898
  why: Whole message/reasoning builders, hidden-usage snapshot preservation and ordered completion flags.
dod:
- text: >-
    lifecycle_defaults with model=m,clock=10,UUID=u creates id=resp_u,object=response,
    created_at=10,status=in_progress,error=null,incomplete_details=null,instructions=null,
    max_output_tokens=null,output=[],parallel_tool_calls=true,previous_response_id=null,
    reasoning={effort:null,summary:null},store=true,tools=[],top_p=1.0,tool_choice=auto.
    B1138 fills remaining optional fields with its null defaults. Explicit instructions,
    temperature,text,tools,top_p,truncation,user,metadata are copied even when null; request
    max_output_tokens,parallel_tool_calls,previous_response_id,reasoning,store do not replace
    the fixed defaults. Created then in-progress increments sequences 1,2 and B904 encodes
    both IDs with provider/model metadata; the raw cached ID remains stable.
  proof: [item-tests, oracle, item-adapter]
- text: >-
    message_item_indices queues output_item.added then content_part.added with one
    msg_u ID,status=in_progress,role=assistant,content=[] then part={type:output_text,
    text:"",annotations:[]},content_index=0. Without reasoning output_index=0; with a
    cached reasoning ID take next_tool_output_index and increment it. Both sequence
    numbers increment, and message/content-added flags are set before returning events.
    Repeated initial-event calls yield created,in_progress,null and never duplicate either.
  proof: [item-tests, oracle, item-adapter]
- text: >-
    snapshot_and_metadata preserves model_dump and copies hidden parameters; top-level
    usage=null/absent is filled from hidden usage when nonnull, while existing usage wins.
    Provider fields use last-value-wins for lists, so [a] then [a,b] gives [a,b], not [a,a,b].
    B2227 assembles snapshots with the logging context; accumulated provider fields merge
    into hidden provider_specific_fields, initializing a missing/null hidden map. A null
    assembly result stays null and is not replaced by a fabricated completion.
  proof: [item-tests, oracle, item-adapter]
- text: >-
    message_done_payloads uses first-choice content or "" for output_text.done and
    content_part.done, with cached msg ID,message output index,content_index=0 and B1115
    annotations. Content part includes logprobs=null. output_item.done instead reads
    self.litellm_model_response, ignores its argument's message, uses sequence_number=1
    and status=completed,role=assistant,one output_text block. Pin differing passed/stored
    contents to prove this distinction. These constructors do not increment the shared sequence.
  proof: [item-tests, oracle, item-adapter]
- text: >-
    reasoning_done_payloads takes id=rs_a,text=why,sequence=7 and emits text.done with
    output_index=0,summary_index=0,text=why; part.done has the same indices and
    part={type:summary_text,text:why}; output_item.done has output_index=0,item={id:rs_a,
    type:reasoning,summary:[{type:summary_text,text:why}]}. Each uses the supplied sequence
    and adds no status or encrypted_content to the reasoning item.
  proof: [item-tests, oracle, item-adapter]
- text: >-
    default_done_progression with no message-added flag and empty final content marks
    all three done flags true and returns null, emitting no message shell. Nonempty final
    content first queues message/content added, then successive calls yield text.done,
    content_part.done,item.done,null, marking each flag before returning. Already-added
    empty content still produces all done events. is_stream_finished is true only when
    all three flags are true; it ignores queued tool/reasoning events and the finished field.
  proof: [item-tests, oracle, item-adapter]
checks:
  optional: []
  commands:
  - id: item-tests
    why: lifecycle defaults, sequence handling or completion flags differ
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_items::/)'
  - id: item-adapter
    why: event builders have no independent pinned-value comparison
    run: test -f tools/oracle/helpers/chat_response_stream_items.py && grep -qE '^[[:space:]]+chat_response_stream_items:' tools/oracle/fuzz/corpus/helper_case/chat_response_stream_items-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/chat-response-stream-items/lifecycle-defaults.yaml
- tools/oracle/cases/helpers/chat-response-stream-items/message-item-indices.yaml
- tools/oracle/cases/helpers/chat-response-stream-items/snapshot-and-metadata.yaml
- tools/oracle/cases/helpers/chat-response-stream-items/message-done-payloads.yaml
- tools/oracle/cases/helpers/chat-response-stream-items/reasoning-done-payloads.yaml
- tools/oracle/cases/helpers/chat-response-stream-items/default-done-progression.yaml
deviations: []
out_of_scope:
- create_output_item_added_event L565-L584 has no caller at the pin; the active queue_message_item_added_events method constructs its own event.
- B922 owns state/tool queues L56-L439; B924 owns priming L441-L485 and driver/translation/final snapshot methods L900-L1291.
- B2227 owns chat chunk assembly and B1115 annotation conversion; no parser or provider transport is added here.
pitfalls:
- 'The oracle helper for this task is pre-registered as chat_response_stream_items in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/chat_response_stream_items.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/chat_response_stream_items.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Initial store=true and parallel_tool_calls=true ignore false values in the incoming request.
- Message output_item.done uses sequence 1 and the stored completion, unlike the other done builders.
- Empty final content skips message events only if a message item has never been added.
review_level: standard
budget:
  max_changed_lines: 700
  max_new_expects: 1
