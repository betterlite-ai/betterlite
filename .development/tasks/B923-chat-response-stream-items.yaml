checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_items::/)
      - test(/::replays_corpus$/)'
  - id: case-response-id-from-first-chunk
    why: the response-id-from-first-chunk behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_items::tests::response_id_from_first_chunk($|::)/)'
  - id: case-created-before-in-progress
    why: the created-before-in-progress behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_items::tests::created_before_in_progress($|::)/)'
  - id: case-reasoning-summary-done
    why: the reasoning-summary-done behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_items::tests::reasoning_summary_done($|::)/)'
  - id: case-text-part-done
