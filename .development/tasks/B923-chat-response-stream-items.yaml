id: B923
title: Chat response stream items
description: >-
  Build the message/reasoning lifecycle half of chat-to-Responses streaming with source response-ID priming, initial
  events and terminal item events. Reuse B005 chat chunk aggregation and responses-chat-output; expose a state transition
  returning a bounded event batch.


  LiteLLMCompletionStreamingIterator.create_output_item_added_event (litellm/responses/litellm_completion_transformation/streaming_iterator.py:L565-L584)
  has no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and
  no behavior case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/chat_response_stream_items.rs. Use ChatResponseStreamItemInput and ChatResponseStreamItemResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions response_id_from_first_chunk, created_before_in_progress, reasoning_summary_done,
  text_part_done, empty_stream_initial_events under api::chat_response_stream_items::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ChatResponseStreamItems in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {chat_response_stream_items: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._adopt_response_id_from_chunk
  (L441-L446); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._aprime_response_id
  (L448-L465); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._prime_response_id
  (L467-L480); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._take_buffered_chunk
  (L482-L485); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._with_encoded_response_id
  (L487-L492); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._default_response_created_event_data
  (L494-L538); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_response_created_event
  (L540-L552); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_response_in_progress_event
  (L554-L563); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_content_part_added_event
  (L586-L599); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._queue_message_item_added_events
  (L601-L627); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._merge_provider_specific_fields
  (L629-L639); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_litellm_model_response
  (L641-L655); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._snapshot_chunk_for_stream_chunk_builder
  (L658-L675); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_reasoning_summary_text_done_event
  (L677-L703); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_reasoning_summary_part_done_event
  (L705-L739); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_output_text_done_event
  (L741-L751); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_output_content_part_done_event
  (L753-L778); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_output_item_done_event
  (L780-L811); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.create_reasoning_output_item_done_event
  (L813-L855); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.return_default_done_events
  (L857-L878); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.return_default_initial_events
  (L880-L889); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.is_stream_finished
  (L891-L898). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 338 owned nonblank/non-comment/non-docstring Python lines (402 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 358 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 608 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B005 (Streaming chat completions), B171 (Direct helper oracle and URL path encoding),
  B903 (Response id codecs), B914 (Responses chat output), B1087 (Api boundaries), B904 (Response id traversal),
  B907 (Responses codex tools), B1115 (Responses output detail conversion). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
