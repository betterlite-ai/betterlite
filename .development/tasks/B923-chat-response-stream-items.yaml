    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_items::tests::text_part_done($|::)/)'
  - id: case-empty-stream-initial-events
    why: the empty-stream-initial-events behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream_items::tests::empty_stream_initial_events($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/chat_response_stream_items.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/chat_response_stream_items-*)"
      && grep -qE "^[[:space:]]+chat_response_stream_items:" tools/oracle/fuzz/corpus/helper_case/chat_response_stream_items-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/chat-response-stream-items)"
