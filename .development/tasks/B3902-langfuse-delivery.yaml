deviations:
- what: >-
    Batch halving is implemented iteratively with reduce and _Halving state rather than recursion,
    so the algorithm settles within a bounded number of rounds instead of recursive call depth.
  why: >-
    Rust prefers iteration to deep recursion; the iterative form caps rounds at O(log n + truncation_steps)
    and avoids stack growth. LiteLLM's v2 consumer did not expose batch-splitting behavior directly.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_sdk.py#L673-L694
- what: >-
    Encoder error recovery drops rejected spans silently and logs the count, rather than
    failing the entire batch if a single span cannot be encoded to protobuf.
  why: >-
    OTLP encoding errors (missing required fields, proto violations) should not block delivery of
    valid spans in the batch. The v2 consumer retried the entire batch; betterlite recovers without
    that cost.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_sdk.py#L770-L777
out_of_scope:
- OTLP protobuf encoding is a library boundary.
- Configuration of the exporter's endpoint, credentials and timeout happens in B3900 and B3903.
- The tracer that supplies spans and the provider that owns the batch export thread are B3903's channel lifetime management.
- Python SDK version headers and Langfuse compatibility are B3900's concerns.
pitfalls:
- >-
    The oracle helper for this task is pre-registered as b3902 in the logging group.
    Replace the stub Op in tools/oracle/src/helpers/logging/b3902.rs with an impl Helper
    whose Input is the typed input, and write run in tools/oracle/helpers/b3902.py.
    The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task's to edit.
- >-
    _build_span_exporter constructs an Authorization header by base64-encoding the key pair,
    which must be done synchronously at exporter construction and used on every request.
    The key pair is supplied at creation time and never again; the header is held in the exporter
    and sent to Langfuse, so treat any string containing the header as carrying sensitive material.
- >-
    The endpoint and export path are joined with rstrip('/') on base_url and lstrip('/') on the path;
    both empty, both slashed, or one slashed on the boundary must produce a single slash between them.
- >-
    The V4 SDK sends x-langfuse-ingestion-version: 4, x-langfuse-sdk-name: python and
    x-langfuse-sdk-version set to the installed langfuse package version, and includes
    the x-langfuse-public-key header with the public key plain text.
- >-
    Per-span encoding failure isolation drops only the failing span; other spans in the batch
    proceed. A batch where every span fails encodes to an empty sequence and is reported as no-op.
- >-
    Exponential backoff uses 2^attempt seconds capped at 2^6 seconds; configured_max_retries supplies
    the ceiling on the exponent, not the delay scale.
- >-
    A 413 on a multi-span batch is split in halves; a 413 on a single span triggers truncation
    of its largest field from its respective group, marked with the v2 consumer's truncation constant.
    Once all three groups (input, output, metadata) are truncated and the span is still rejected,
    it is dropped and logged.
review_level: security
