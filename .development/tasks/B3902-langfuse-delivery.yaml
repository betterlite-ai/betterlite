dod:
- text: Exporter helper cases match observable pinned behavior for each status, truncation, and encoding failure scenario.
  proof: [oracle, helper-python]
- text: Basic authorization header encodes the key pair correctly, and the endpoint and ingestion-version headers are present on every request.
  proof: [oracle, langfuse-exporter-tests]
- text: >-
    Retry status classification includes 408, 429 and 5xx; non-retryable 4xx codes are logged and
    rejected; a 413 triggers size reduction, and transport errors are retried.
  proof: [langfuse-exporter-tests]
- text: >-
    Exponential backoff uses delays of 2^n seconds up to a ceiling set by LANGFUSE_MAX_RETRIES,
    with a default ceiling of 3 retries and maximum ceiling of 1000 retries.
  proof: [langfuse-exporter-tests]
- text: >-
    A multi-span batch returning 413 is split in halves; a single span is truncated starting
    with its largest field (input, output, metadata), resent and dropped once fully truncated.
  proof: [langfuse-exporter-tests]
- text: >-
    A span the protobuf encoder rejects is dropped from the batch; other spans in the batch are
    encoded and sent; if all spans are rejected the batch is reported as no-op.
  proof: [langfuse-exporter-tests]
- text: >-
    LANGFUSE_OTEL_TRACES_EXPORT_PATH defaults to /api/public/otel/v1/traces, and is joined with base_url
    by rstrip('/') on base_url and lstrip('/') on the path with a single connecting slash.
  proof: [langfuse-exporter-tests]
- text: >-
    Mock mode's DiscardingSpanExporter accepts every span and acknowledges success without network I/O;
    flush reports the transport outcome of the real exporter.
  proof: [oracle, langfuse-exporter-tests]
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus
    replays successfully.
  proof: [helper-case-corpus]
checks:
  optional:
  - mutants
  commands:
  - id: langfuse-exporter-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-logging -p betterlite-http --no-tests=fail -E
      'test(/::langfuse_exporter_tests_behavior($|::)/) - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'langfuse_exporter' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
