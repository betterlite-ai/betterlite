id: B3902
title: Langfuse OTLP delivery and oversized batches
description: >-
  Implement Langfuse protobuf export through betterlite-http, preserving retry status classification,
  bounded exponential delays, batch halving on 413, largest-field truncation for one span, and
  per-span encoding failure isolation. The exporter takes provisioned credentials (public and secret keys)
  and a base URL that defaults to the Langfuse US cloud, and builds a request-signed OTLP HTTP endpoint
  with Basic authorization from the base64-encoded key pair. Protobuf spans are encoded through the
  OTLP library's span encoder, and any span the encoder rejects is dropped from the batch without
  losing other spans. A single span too large to encode is truncated, largest field first (input,
  output, metadata), then resent until it fits or all fields are gone; a multi-span batch is halved
  and retried. Transport errors, 408, 429 and 5xx status codes trigger exponential backoff with
  a ceiling configurable through LANGFUSE_MAX_RETRIES, defaulting to 3 retries with delays of 1, 2,
  4 seconds; HTTP 413 is caught separately and triggers size reduction rather than retry. Mock mode
  accepts spans without network I/O. Flush reports the transport outcome through the injected exporter
  interface, not queue drain: a batch counted as failed never succeeds, and a successful flush means
  delivery rather than acceptance into a queue. Every HTTP header sent to Langfuse, including
  Authorization, carries Langfuse SDK identity (SDK name, version) and ingestion-version for
  compatibility negotiation. The exporter-path and base-URL join preserves trailing and leading
  slashes: LANGFUSE_OTEL_TRACES_EXPORT_PATH defaults to /api/public/otel/v1/traces, both the path
  and base_url.rstrip('/') and the path.lstrip('/') are joined with a single slash. Implement via
  betterlite-http; do not reuse B256's generic batch policy for the distinct Langfuse truncation and
  retry algorithm.
