deviations:
- what: >-
    Path joining normalizes .. segments silently using posixpath.normpath instead of
    raising an error; if the normalized path would climb out of the base, the function
    returns the base instead of an error.
  why: >-
    This follows LiteLLM's behavior exactly. Subpaths are untrusted and must not
    escape the base the operator configured. Silent normalization is simpler than
    error-raising and matches the upstream's behavior.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L697-L705
out_of_scope:
- >-
  The is_tinyfish_agent_url predicate is built by a task that owns the TinyFish-specific
  provider helpers (gap A in the outline), so this task calls it as a dependency; the
  predicate returns false in betterlite until that task lands.
- >-
  Custom header resolution from config.yaml (set_env_variables_in_header) is built by
  the route registration task (B3616); this task uses only the header dict after
  resolution.
- >-
  The get_response_body, get_response_headers, construct_target_url_with_subpath,
  join_base_and_endpoint_path, _is_streaming_response and _should_buffer_passthrough_response
  are static helpers called by later tasks (B3605+); they are built here as pure functions
  with no dependencies on logging or request routing.
pitfalls:
- >-
  Trailing slashes must be preserved through posixpath.normpath; the Python code at line
  698-703 checks and restores them after normalization, or the behavior changes.
- >-
  posixpath.normpath preserves the leading / and collapses a sequence of /s to one,
  but "." becomes "." not "", so check for it and replace it with "" when appropriate.
- >-
  Response headers are case-insensitive; the excluded-headers check uses .lower() on both
  the header key and the set membership check.
- >-
  The fallback behavior in join_base_and_endpoint_path returns base_path + "/" when the
  combined path is not empty and does not start with the base path; this is not an error.
- >-
  Buffering logic checks status_code >= 400 separately from content-type classification;
  all error responses are buffered regardless of content type.
- >-
  The EndpointType enum has 7 variants, including Gemini at line 28 of the Python file;
  do not drop it or endpoint-type detection for Google Gemini fails silently.
review_level: standard
budget:
