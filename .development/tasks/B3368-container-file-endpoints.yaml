dod:
  - text: all_endpoint_names returns the ten names in catalog order (each name followed by its async_name) and async_endpoint_names returns the five async names.
    proof: [names-tests]
  - text: An endpoint name that is in neither the name nor the async_name column of the catalog fails with a mapped error.
    proof: [names-tests]
  - text: A mock_response (JSON string or object) is decoded into the catalog entry's model for list, upload, retrieve and delete, and returned before provider lookup, logging and HTTP.
    proof: [mock-tests]
  - text: The mock for retrieve_container_file_content comes back as a Raw JSON value, not bytes, and a mock body that does not decode is an error.
    proof: [mock-tests]
  - text: A managed container id is decoded through B3361 before the config lookup, the decoded id replaces container_id, and the decoded provider is used for the rest of the call.
    proof: [prepare-tests]
  - text: >-
      An unknown provider name and a provider without a container config both fail, the second with "Container provider config not found for: <provider>".
    proof: [prepare-tests]
  - text: Logging is updated with model "", optional params holding only the path params present in the call, litellm_params holding only litellm_call_id and the resolved provider, and no call type is set.
    proof: [prepare-tests]
  - text: The handler receives the endpoint name, config, params, logging state, headers, query, the decoded container_id, file_id, after, limit, order and file; extra_body is never forwarded.
    proof: [handler-tests]
  - text: A timeout of zero or none falls back to the default request timeout, and the default call timeout is 600 seconds.
    proof: [handler-tests]
  - text: The handler reply is returned as the ContainerFileReply variant B3363 produced for list, file, delete and bytes.
    proof: [handler-tests]
  - text: acontainer_file_call gives the same results as container_file_call through the async handler form, for mock and handler paths.
    proof: [async-tests]
  - text: Every failure reaches B185's exception mapping once, with model "" and the resolved provider after decoding and the caller's provider before it.
    proof: [error-tests]

checks:
  optional: []
  commands:
    - id: names-tests
      why: Name list or endpoint lookup tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_file_endpoints::(.*::)?names_/)'
    - id: mock-tests
      why: Mock short-circuit tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_file_endpoints::(.*::)?mock_/)'
    - id: prepare-tests
      why: Id decoding, provider lookup or logging tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_file_endpoints::(.*::)?prepare_/)'
    - id: handler-tests
      why: Handler call, timeout or reply tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_file_endpoints::(.*::)?handler_/)'
    - id: async-tests
      why: Async operation tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_file_endpoints::(.*::)?async_/)'
    - id: error-tests
      why: Exception mapping tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_file_endpoints::(.*::)?error_/)'

oracle_cases: []

deviations:
  - what: There is no _is_async flag, async_call kwarg, run_in_executor wrapper or coroutine-or-value return. The blocking and async operations are two Rust functions, and the ten generated functions become one pair keyed by endpoint name.
    why: Rust has no Union return type, and a worker thread plus a context copy adds nothing to an async fn.
  - what: Errors are mapped once, not once in the sync body and again in the async wrapper.
    why: exception_type returns an exception that is already a LiteLLM type unchanged, so the second pass changes nothing a caller can see.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2358-L2367
  - what: The import-time table, the ten module aliases and containers/__init__.py have no Rust code. The name lists are the export surface, and upload_container_file is exported like the other four.
    why: Rust modules have no import side effects or package re-exports, and the router registers all ten names anyway.

out_of_scope:
  - "list_container_files, alist_container_files, upload_container_file and aupload_container_file in containers/main.py: B3366 and B3367 own those explicit versions. The generated versions of the same names are built here."
  - "create_container, list_containers, retrieve_container and delete_container and their async forms: B3369 and B3370 own them, and __init__.py only re-exports them."
  - "The generic executor (URL building, auth headers, multipart, byte responses, error checks): B3363 owns it; this task calls its handler."
  - "decode_managed_container_id_for_request and the provider config lookup: B3361 owns them."
  - "endpoints.json, the response models and BaseContainerConfig: B3360 owns them."
  - "GenericLiteLLMParams: B010 owns it. The @client decorator that creates the logging state: B012 owns it."
  - "Logging update_from_kwargs: B247 owns it. exception_type: B185 owns it."
  - "Router registration of the ten names and the proxy file routes under /v1/containers/{container_id}/files: B094 and its proxy parts own them. No route reaches this code yet, so there are no HTTP oracle cases."

pitfalls:
  - The mock check reads mock_response with kwargs.get and comes before any provider lookup, so a mock call with an unknown provider still succeeds.
  - retrieve_container_file_content has response_type "raw", which is not in RESPONSE_TYPES, so response_type is None and the mock is returned as the parsed JSON, not as bytes or a model.
  - container_id is decoded only when the key is present and is a string; file_id is never decoded.
  - The logging optional params are built from the path_params names with the test k in kwargs, so a key present with value None is logged as None and an absent key is left out.
  - update_from_kwargs is called with the kwargs after decoding, so the logged container_id is the original provider id, not the managed one.
  - The generated functions never set a logging call type. The @client decorator derives it from the Python function name, which is endpoint_func for every sync function and async_endpoint_func for every async one, so do not invent a per-endpoint call type here.
  - extra_body is a named argument of the generated functions, so it never reaches the handler's kwargs; extra_query and extra_headers do.
  - The async wrapper's error mapping uses the provider name the caller gave, because it never sees the decoded one.
  - >-
    The error text "Container provider config not found for: <provider>" has no word "provider" before the name, unlike the text in B3370 and B3369's list operation; keep it exact.
  - The name list order is name then async_name per entry, not all sync names then all async names.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
