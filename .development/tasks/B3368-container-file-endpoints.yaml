    why: The re-export list and __all__, which leaves out upload_container_file.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L2143-L2166
    why: The router registers every generated function by name, the caller of the name lists and the generated table.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/containers/endpoints.json
