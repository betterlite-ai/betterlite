id: B3368
title: Generated container file operations and exports
description: >-
  Build the five catalog-driven container file operations of litellm/containers/endpoint_factory.py in betterlite-core, as module
  api::container_file_endpoints (crates/betterlite-core/src/api/container_file_endpoints.rs, with tests in
  container_file_endpoints/tests.rs). LiteLLM reads endpoints.json at import and builds one sync and one async function per entry:
  list_container_files, upload_container_file, retrieve_container_file, delete_container_file and retrieve_container_file_content
  (plus the five a-prefixed forms). These generated functions are the live path: the router registers all ten of them
  (router.py _initialize_container_endpoints) and the proxy file routes call them. The explicit list and upload functions in
  containers/main.py are other tasks (B3366, B3367) and nothing here calls them. The module does no HTTP. It prepares the call and
  hands it to B3363's generic container handler.

  Shape. ContainerFileEndpoints is built with its collaborators (B3363's `GenericContainerHandler`, B3361 provider config lookup and managed id
  decoder, B3360 catalog) and holds no module state. ContainerFileCall has container_id and file_id (both Option<String>), after,
  limit and order (Option<String> / Option<i64> as B3360's list params declare), file (B3363's `ContainerFileUpload`),
  timeout, api_key, api_base, api_version, custom_llm_provider, extra_headers, extra_query, extra_body, mock_response,
  litellm_call_id and an extra map for every other keyword. custom_llm_provider defaults to "openai" and timeout to 600 seconds.
  The per-call logging state (B247) and the default request timeout in seconds are arguments of each call: no config constant is
  read here, the route passes betterlite_config::env_integer::timeout::RequestTimeout (field seconds, REQUEST_TIMEOUT, 6000 by
  default, owned by B198). ContainerFileReply is B3363's enum (List, File, Deleted, Bytes and Raw), imported and not redefined here. ContainerFileOpError is this module's error
  enum (mock body that is not valid JSON or does not decode, unknown endpoint name, unknown provider name, no provider config,
  wrapped handler error) and every failure goes to B185's exception mapping with model "" and the provider name.

  Public functions: container_file_call (blocking, calls `GenericContainerHandler::handle`) and acontainer_file_call (async fn, calls
  `ahandle`), both taking the endpoint name (either name or async_name from the catalog, looked up with B3360), the call, the
  logging state and the default timeout. They share one private preparation step, so the logic is written once. The Python
  _is_async flag, the async_call kwarg, run_in_executor and the contextvars copy have no Rust form.

  Steps, in LiteLLM's order (endpoint_factory.py L56-L136). (1) Mock: if mock_response is set, a string is parsed as JSON, then
  the value is decoded into the catalog entry's response model (list into ContainerFileListResponse, upload and retrieve into
  ContainerFileObject, delete into DeleteContainerFileResponse) and returned at once with no provider lookup, logging or HTTP.
  retrieve_container_file_content has response_type "raw", which has no model, so its mock comes back as the parsed JSON value
  (Raw), never as bytes. (2) Build GenericLiteLLMParams (B010) from api_key, api_base, api_version and the extra map. (3) If
  container_id is set, call B3361's decode_managed_container_id_for_request with it, the provider and the params; it returns the
  original id, the resolved provider and updated params, and the original id replaces container_id for every later step. (4)
  Parse the resolved provider into a provider id (an unknown name is an error) and call B3361's provider config lookup; None
  gives the text "Container provider config not found for: <provider>". (5) Build the logging optional params: for each path
  param name of the catalog entry (container_id, file_id), if the call has that key at all, include it with its value. Query
  params (after, limit, order) are never logged. (6) Call B247 update_from_kwargs with model "", those optional params,
  litellm_params holding only litellm_call_id, and the resolved provider. It does not set a call type. (7) Call B3363's `handle` with a
  `ContainerFileHttpCall` holding the endpoint name, config, params, logging state, extra_headers, extra_query, the timeout (0 or none becomes the default
  request timeout) and every remaining field (container_id, file_id, after, limit, order, file, mock_response, litellm_call_id
  and the extra map) as the handler's kwargs. extra_body is accepted and never forwarded. Return the handler's reply as the
  matching ContainerFileReply variant.

  Async. acontainer_file_call runs the same steps and awaits `ahandle`. When an error happens, the sync body maps it with
  the resolved (decoded) provider name, and LiteLLM's async wrapper maps it again with the provider name the caller gave. The
  second pass returns an already mapped exception unchanged (exception_type returns any LiteLLM exception type as is), so
  Rust maps once, with the resolved name for errors raised after step 3 and the caller's name for errors before it.

  Name lists (L211-L224). all_endpoint_names returns, for each catalog entry in file order, its name then its async_name (ten
  strings). async_endpoint_names returns the five async_names in file order. Both read B3360's catalog. The router task uses
  them to register routes, so they are public.

  Exports. containers/__init__.py is only a re-export list and endpoint_factory ends with ten module-level aliases
  (list_container_files and so on). Rust has no package namespace, so no code is written for either; the public functions and
  name lists above are the whole export surface. Record the quirk in the module docs: __init__.py re-exports eight of the ten
  generated names and leaves out upload_container_file and aupload_container_file, but the router registers all ten.

  Tests (tests.rs) use a stub handler, a stub config lookup, a stub decoder and a recording logging state, all injected through
  the constructor. Name the tests names_*, mock_*, prepare_*, handler_*, async_* and error_* so each check below can filter on
  its prefix. Budget from the owned LiteLLM lines (about 150 non-blank lines of endpoint_factory.py, 26 of __init__.py): about
  280 production lines and 400 test lines.

scope:
  paths:
    - crates/betterlite-core/src/api/container_file_endpoints.rs
    - crates/betterlite-core/src/api/container_file_endpoints/**
  lint_tables: false

