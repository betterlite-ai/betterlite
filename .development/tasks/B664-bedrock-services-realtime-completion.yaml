checks:
  optional:
  - mutants
  commands:
  - id: case-content-end-text-audio
    why: The content-end-text-audio behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_completion_cases::case_[0-9]+_content_end_text_audio$/)'
  - id: case-prompt-end-response-done
    why: The prompt-end-response-done behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::realtime_completion_cases::case_[0-9]+_prompt_end_response_done$/)'
  - id: case-incremental-usage-delta
