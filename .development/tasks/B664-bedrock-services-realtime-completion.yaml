id: B664
title: Bedrock realtime end events usage and tools
description: >-
  Add realtime terminal event sequencing, usage deltas, tool-use calls and function-arguments completion projection.
  Preserve contentEnd/promptEnd/response.done ordering, leftover usage and tool call id/name/arguments exactly,
  using bounded per-call accumulators.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/realtime/transformation.py:
  BedrockRealtimeConfig._take_usage_delta L854-L875; BedrockRealtimeConfig.leftover_usage_done_events L877-L893;
  BedrockRealtimeConfig.transform_content_end_event L1001-L1101; BedrockRealtimeConfig.transform_prompt_end_event
  L1103-L1127; BedrockRealtimeConfig._response_done_events L1129-L1157; BedrockRealtimeConfig.transform_tool_use_event
  L1159-L1210.


  Named case contracts: content_end_text_audio: Require truthy output_item_id AND response_id; otherwise emit[]
  and preserve delta accumulator. For text emit response.text.done with concatenated prior delta values defaultempty,
  then response.content_part.done part{type:text,text:joined}. For audio emit response.audio.done then content_part.done
  part{type:audio,transcript:empty}. Each uses content_index0/output_index0,event_UUID,item/response ids. Unknown/None
  delta_type skips these two events. prompt_end_response_done: transform_prompt_end_event ignores event contents
  and calls _response_done_events. Without truthy response_id AND conversation_id return([],None,None,None) without
  consuming usage. Otherwise emit response.done event_UUID,response{object:realtime.response,id,status:completed,output:[],conversation_id,usage:delta},
  then reset output_item/response/delta_type toNone. Conversation id and text accumulator are not reset by this
  helper. incremental_usage_delta: Take cumulative minus previously reported counts for input_tokens,output_tokens,total_tokens
  independently and for details input/output speechTokens->audio_tokens,textTokens->text_tokens. input_token_details.cached_tokens
  is always0; output has no cached_tokens. Set reported snapshot to latest before constructing result. Negative
  deltas remain negative, no clamp or total recomputation; repeated take without update yields0. leftover_usage_done:
  If complete cumulative/reported records equal return(); any difference, including only detailed counts, consumes
  delta and returns one response.done with fresh event_/resp_/conv_ UUIDs,statuscompleted,objectrealtime.response,usage;
  no explicit output field is supplied. This is logged-only; B666/B667 must not send it to client. Compare actual
  typed defaults rather than inserting output[]. tool_use_event: Require truthy item/responseids or return([],empty,empty).
  Read toolUse.input default{}; ifstring JSON-decode, syntax failure silently{}; parsed primitives/arrays/None remain
  valid values. Nonstrings pass through. Emit one response.function_call_arguments.done,event_UUID,response_id,item_id,output_index0,call_id=toolUseId
  defaultempty,name=toolName defaultempty,arguments=json.dumps(value). Return call_id/name too; no tool-call item/add
  event or registry check. Wrong types outside JSON syntax failure propagate. multiple_content_blocks: ContentEnd
  emits per-block completion and clears text chunks while retaining response identity; final response.done is a
  separate transition selected by B665. Exercise text followed audio in one response and repeated terminal helpers
  with already-reset ids. output_item_completion: With valid ids ALWAYS then emit response.output_item.done with
  event_UUID,output_index0,response_id,item{id,object:realtime.item,type:message,status:completed,role:assistant,content:[]};
  return delta_chunks=None. ContentEnd stopReason does not affect this helper or trigger response.done here; that
  decision belongs B665.


  Implement crates/betterlite-bedrock/src/realtime_completion.rs with adjacent tests under realtime_completion/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function realtime_completion_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): content_end_text_audio, prompt_end_response_done, incremental_usage_delta, leftover_usage_done, tool_use_event,
  multiple_content_blocks, output_item_completion. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_realtime_completion* using HelperCase:
  kind: helper and the externally tagged bedrock_services_realtime_completion variant inside call. Do not put the
  Python stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_realtime_completion
  that parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on
  zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_realtime_tool_input consumes toolUse.input JSON bytes in crates/betterlite-bedrock/src/realtime_completion.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_realtime_completion.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_realtime_completion.
  The adjacent test replays_the_bedrock_services_realtime_completion_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 214 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 285 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 720 planned, 725 maximum changed lines.
