- 'The oracle helper for this task is pre-registered as bedrock_services_realtime_completion in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_realtime_completion.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_realtime_completion.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
