  paths:
  - crates/betterlite-azure/Cargo.toml
  - Cargo.toml
  - deny.toml
  - crates/betterlite-azure/src/azure_default_chain.rs
  - crates/betterlite-azure/src/azure_default_chain/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/azure/default_chain.rs
  - tools/oracle/src/helpers/azure/default_chain/**
  - tools/oracle/helpers/azure_default_chain.py
  - tools/oracle/helpers/azure_default_chain/**
  - tools/oracle/cases/helpers/providers/azure-default-chain/**
  - tools/oracle/fuzz/corpus/helper_case/azure_default_chain*
  - crates/betterlite-config/Cargo.toml
  - crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - crates/betterlite-config/src/sections/azure_default_chain.rs
  - crates/betterlite-config/src/sections/azure_default_chain/**
  lint_tables: false
