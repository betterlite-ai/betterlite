id: B677
title: Azure default and deployment credential chains
description: >-
  Implement inference and closed credential selection: explicit azure_credential then AZURE_CREDENTIAL then source
  inference. DefaultAzureCredential tries configured environment credentials, workload identity and managed identity;
  DeploymentIdentityCredential tries complete workload identity, user-assigned identity when a client id exists,
  then system-assigned identity after an unavailable result. An actual authentication error stops the chain. Preserve
  inference ordering, including the client-id branch before certificate inference. Reuse the individual grant implementations;
  Shared resolved credential inputs live in betterlite-config; B529 is the upper selector and must not be a prerequisite.
  The individual grant owners supply token caching.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  BaseAzureLLM._try_get_default_azure_credential_provider L451-L478. litellm/secret_managers/get_azure_ad_token_provider.py:
  infer_credential_type_from_environment L11-L34; get_azure_ad_token_provider L37-L135.


  The native workloads take resolved token-file bytes and use B530 OAuth exchange; unsupported AZURE_CREDENTIAL
  values have a Rust-only startup-validation test because Python getattr accepts additional class names.


  Add the Rust-only unsupported_credential_name case for startup rejection of an AZURE_CREDENTIAL value outside
  the listed enum.


  Named case contracts: explicit_credential: Truthy explicit azure_credential.value wins, then truthy AZURE_CREDENTIAL,
  then inference; an empty env string falls through. Resolve azure_scope only when None: truthy AZURE_SCOPE else
  https://cognitiveservices.azure.com/.default; explicit empty scope is forwarded. Log For Azure AD Token Provider,
  choosing credential type: {cred}. client_secret_inference: Only a truthy AZURE_CLIENT_ID+AZURE_CLIENT_SECRET+AZURE_TENANT_ID
  triplet selects ClientSecretCredential. Next any truthy AZURE_FEDERATED_TOKEN_FILE selects DefaultAzureCredential,
  even with incomplete tenant/client configuration. client_id_before_certificate: After the secret/token-file checks,
  any truthy AZURE_CLIENT_ID selects ManagedIdentityCredential before certificate. Otherwise either AZURE_CERTIFICATE_PASSWORD
  or AZURE_CERTIFICATE_PATH selects CertificateCredential, even when required client/tenant/path is missing; do
  not silently fall back when construction fails. deployment_chain_order: Construct workload only with truthy client_id,
  tenant_id and federated_token_file; add user-assigned identity only for truthy client_id; always append ManagedIdentityCredential()
  with NO client_id. Constructors are eager, tokens lazy. Return first token; fall through only CredentialUnavailableError,
  stop on other authentication/constructor failures. Do not say every failing user identity triggers system fallback.
  default_chain_fallback: DefaultAzureCredential tries environment, workload and managed identity in source order.
  Environment selection uses env value is-not-None (empty values count present), unlike LiteLLM inference: complete
  client-secret variables win, then AZURE_CLIENT_CERTIFICATE_PATH+client/tenant, then client/username/password with
  optional tenant. Incomplete environment yields its named unavailable error. Preserve actual authentication-error
  short circuit; the declared native developer-credential deviation applies after these links. credential_constructor_arguments:
  ClientSecretCredential receives required env client_id/client_secret/tenant_id; ManagedIdentityCredential receives
  required AZURE_CLIENT_ID (missing key fails even though SDK alone could do system identity). CertificateCredential
  receives required client_id/tenant_id/certificate_path; include password only when truthy. Missing env keys remain
  the corresponding KeyError before token acquisition; never substitute empty strings. default_environment_certificate:
  The default-chain certificate inputs are AZURE_CLIENT_CERTIFICATE_PATH/PASSWORD, distinct from LiteLLM AZURE_CERTIFICATE_PATH/PASSWORD.
  AZURE_CLIENT_SEND_CERTIFICATE_CHAIN uses Python bool on the env string (nonempty false is true), default False;
  pass the flag to B674. Environment username/password passes AZURE_TENANT_ID (unlike B675 direct wrapper) and emits
  Environment is configured to use username and password authentication. This authentication method is deprecated,
  as it doesn't support multifactor authentication (MFA). For more details, see https://aka.ms/azsdk/identity/mfa.
  default_credential_filter: AZURE_TOKEN_CREDENTIALS defaults empty, strips whitespace and lowercases. prod selects
  environment/workload/managed; named environmentcredential/workloadidentitycredential/managedidentitycredential
  selects only that link. dev or a named developer/interactive credential is handled by the declared native unsupported-credential
  deviation. Invalid names raise the SDK Invalid value for AZURE_TOKEN_CREDENTIALS: {value}. Valid values are: dev,
  prod, azureclicredential, azuredeveloperclicredential, azurepowershellcredential, environmentcredential, interactivebrowsercredential,
  managedidentitycredential, visualstudiocodecredential, workloadidentitycredential. No token request precedes rejection.
  default_provider_try_boundary: _try_get_default_azure_credential_provider forces DefaultAzureCredential with supplied
  scope and returns its callable. Log attempt/success; catch any construction exception, debug DefaultAzureCredential
  failed: {e}, return None. Do not catch later invocation errors or acquire a token during construction. chain_exhaustion:
  Exhaustion emits a warning and ClientAuthenticationError starting {chain class} failed to retrieve a token from
  the included credentials., followed by Attempted credentials: and ordered credential/error lines, then https://aka.ms/azsdk/python/identity/defaultazurecredential/troubleshoot.
  Preserve visited-prefix history on an authentication short circuit; use B187 to redact secret values. generic_credential_constructor:
  A supported WorkloadIdentityCredential env name invokes the SDK no-argument constructor and reads its required
  environment. UsernamePasswordCredential through AZURE_CREDENTIAL reaches a no-argument constructor and fails for
  missing required client_id/username/password; it must not silently reuse the B675 explicit-argument wrapper.


  Load AZURE_TOKEN_CREDENTIALS, AZURE_CLIENT_CERTIFICATE_PATH, AZURE_CLIENT_CERTIFICATE_PASSWORD, AZURE_CLIENT_SEND_CERTIFICATE_CHAIN
  through betterlite-config, with injected environment lookup and the defaults/precedence stated here. Deployment
  inputs use litellm_params and global inputs use litellm_settings. Add config rstest azure_default_chain_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  The newly loaded certificate env strings default absent; AZURE_TOKEN_CREDENTIALS defaults empty and certificate-chain
  flag defaults false with source Python string truthiness. Existing AZURE_SCOPE/client/tenant/secret/username/password
  and authority loader records are reused from betterlite-config without depending on upper B529. This task reads
  no deployment azure_credential key beyond the existing resolved selector input.


  Implement crates/betterlite-azure/src/azure_default_chain.rs with adjacent tests under azure_default_chain/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_default_chain_cases in betterlite-azure with these exact named cases (one per oracle
  file): explicit_credential, client_secret_inference, client_id_before_certificate, deployment_chain_order, default_chain_fallback,
  credential_constructor_arguments, default_environment_certificate, default_credential_filter, default_provider_try_boundary,
  chain_exhaustion, generic_credential_constructor. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_default_chain* using HelperCase: kind:
  helper and the externally tagged azure_default_chain variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_default_chain that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/azure_default_chain.rs
  and its loader wiring: AZURE_CREDENTIAL, AZURE_FEDERATED_TOKEN_FILE, AZURE_CERTIFICATE_PATH, AZURE_CERTIFICATE_PASSWORD.
  Module-level settings enter litellm_settings; deployment settings enter litellm_params; environment lookup is
  injected. Keep the defaults and precedence specified above and in the linked branches; existing key owners remain
  unchanged. Write config rstest azure_default_chain_config_cases with named cases loads_azure_credential, loads_azure_federated_token_file,
  loads_azure_certificate_path, loads_azure_certificate_password, plus rejects_unrelated_key. Each loads case calls
  the real config loader with that key and asserts the resolved value, default, precedence and secret redaction
  where applicable. Seed B002 config_yaml with new azure_default_chain* files for every key; reuse its parser/fuzz
  target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_default_chain_unsupported_credential_name in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_default_chain_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_default_chain_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 135 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 235 production lines, 285 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 100 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 775 planned, 775 maximum changed lines.
