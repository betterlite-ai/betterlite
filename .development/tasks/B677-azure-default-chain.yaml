deviations:
- what: >-
    AZURE_CREDENTIAL is a closed enum supporting ClientSecretCredential, CertificateCredential, UsernamePasswordCredential,
    ManagedIdentityCredential, WorkloadIdentityCredential, DefaultAzureCredential and DeploymentIdentityCredential;
    arbitrary azure.identity class names fail configuration validation.
  why: 'Architect decision: Python getattr permits classes without native equivalents; no subprocess or interactive
    credentials are available.'
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/get_azure_ad_token_provider.py#L72-L130
- what: >-
    DefaultAzureCredential omits developer CLI, PowerShell, broker and interactive credentials and reports exhaustion
    when native environment, workload and managed identity sources fail.
  why: The repository forbids subprocess credential acquisition; B673-B676 implement the native grants.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/get_azure_ad_token_provider.py#L103-L127
