id: B677
title: Azure default and deployment credential chains
description: >-
  Implement inference and closed credential selection: explicit azure_credential then AZURE_CREDENTIAL then source
  inference. DefaultAzureCredential tries configured environment credentials, workload identity and managed identity;
  DeploymentIdentityCredential tries complete workload identity, user-assigned identity when a client id exists,
  then system-assigned identity. Preserve inference ordering, including the client-id branch before certificate
  inference. Reuse the individual grant implementations; credential settings and token cache are B529.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/common_utils.py:
  BaseAzureLLM._try_get_default_azure_credential_provider L451-L478. litellm/secret_managers/get_azure_ad_token_provider.py:
  infer_credential_type_from_environment L11-L34; get_azure_ad_token_provider L37-L135.


  The native workloads take resolved token-file bytes and use B530 OAuth exchange; unsupported AZURE_CREDENTIAL
  values have a Rust-only startup-validation test because Python getattr accepts additional class names.


  Add the Rust-only unsupported_credential_name case for startup rejection of an AZURE_CREDENTIAL value outside
  the listed enum.


  Implement crates/betterlite-azure/src/azure_default_chain.rs with adjacent tests under azure_default_chain/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_default_chain in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_default_chain_cases in betterlite-azure with these exact named cases (one per oracle
  file): explicit_credential, client_secret_inference, client_id_before_certificate, deployment_chain_order, default_chain_fallback.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_default_chain* using HelperCase: kind:
  helper and the externally tagged azure_default_chain variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_default_chain that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/azure/azure_default_chain.rs
  and its loader wiring: AZURE_CREDENTIAL, AZURE_FEDERATED_TOKEN_FILE, AZURE_CERTIFICATE_PATH, AZURE_CERTIFICATE_PASSWORD.
  Module-level settings enter litellm_settings; deployment settings enter litellm_params; environment lookup is
  injected. Keep the defaults and precedence specified above and in the linked branches; existing key owners remain
  unchanged. Write config rstest azure_default_chain_config_cases with named cases loads_azure_credential, loads_azure_federated_token_file,
  loads_azure_certificate_path, loads_azure_certificate_password, plus rejects_unrelated_key. Each loads case calls
  the real config loader with that key and asserts the resolved value, default, precedence and secret redaction
  where applicable. Seed B002 config_yaml with new azure_default_chain* files for every key; reuse its parser/fuzz
  target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_default_chain_unsupported_credential_name in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_default_chain_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_default_chain_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 135 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 165 production lines, 163 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 37 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 480 planned, 500 maximum changed lines.
