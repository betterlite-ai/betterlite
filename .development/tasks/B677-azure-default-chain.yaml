checks:
  optional:
  - mutants
  commands:
  - id: case-explicit-credential
    why: The explicit-credential behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_explicit_credential$/)'
  - id: case-client-secret-inference
    why: The client-secret-inference behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_client_secret_inference$/)'
  - id: case-client-id-before-certificate
    why: The client-id-before-certificate behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_client_id_before_certificate$/)'
  - id: case-deployment-chain-order
    why: The deployment-chain-order behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_deployment_chain_order$/)'
  - id: case-default-chain-fallback
    why: The default-chain-fallback behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_default_chain_fallback$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_default_chain.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_default_chain*")"
      && grep -lq 'azure_default_chain' tools/oracle/fuzz/corpus/helper_case/azure_default_chain* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_default_chain$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-azure-credential
    why: The AZURE_CREDENTIAL setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_credential$/)'
      && grep -lq 'AZURE_CREDENTIAL' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-azure-federated-token-file
    why: The AZURE_FEDERATED_TOKEN_FILE setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_federated_token_file$/)'
      && grep -lq 'AZURE_FEDERATED_TOKEN_FILE' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-azure-certificate-path
    why: The AZURE_CERTIFICATE_PATH setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_certificate_path$/)'
      && grep -lq 'AZURE_CERTIFICATE_PATH' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-azure-certificate-password
    why: The AZURE_CERTIFICATE_PASSWORD setting is not loaded with its required defaults and precedence.
    run: >-
      cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_certificate_password$/)'
      && grep -lq 'AZURE_CERTIFICATE_PASSWORD' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: unsupported-credential-name
    why: The unsupported credential name invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_unsupported_credential_name$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_secret_safe_failure$/)'
