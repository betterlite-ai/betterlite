checks:
  optional:
  - mutants
  commands:
  - id: case-explicit-credential
    why: 'Truthy explicit azure_credential.value wins, then truthy AZURE_CREDENTIAL, then inference; an empty env
      string falls through. Resolve azure_scope only when None: truthy AZURE_SCOPE else https://cognitiveservices.azure.com/.default;
      explicit empty scope is forwarded. Log For Azure AD Token Provider, choosing credential type: {cred}.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_explicit_credential$/)'
  - id: case-client-secret-inference
    why: Only a truthy AZURE_CLIENT_ID+AZURE_CLIENT_SECRET+AZURE_TENANT_ID triplet selects ClientSecretCredential.
      Next any truthy AZURE_FEDERATED_TOKEN_FILE selects DefaultAzureCredential, even with incomplete tenant/client
      configuration.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_client_secret_inference$/)'
  - id: case-client-id-before-certificate
    why: After the secret/token-file checks, any truthy AZURE_CLIENT_ID selects ManagedIdentityCredential before
      certificate. Otherwise either AZURE_CERTIFICATE_PASSWORD or AZURE_CERTIFICATE_PATH selects CertificateCredential,
      even when required client/tenant/path is missing; do not silently fall back when construction fails.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_client_id_before_certificate$/)'
  - id: case-deployment-chain-order
    why: Construct workload only with truthy client_id, tenant_id and federated_token_file; add user-assigned identity
      only for truthy client_id; always append ManagedIdentityCredential() with NO client_id. Constructors are eager,
      tokens lazy. Return first token; fall through only CredentialUnavailableError, stop on other authentication/constructor
      failures. Do not say every failing user identity triggers system fallback.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_deployment_chain_order$/)'
  - id: case-default-chain-fallback
    why: 'DefaultAzureCredential tries environment, workload and managed identity in source order. Environment selection
      uses env value is-not-None (empty values count present), unlike LiteLLM inference: complete client-secret
      variables win, then AZURE_CLIENT_CERTIFICATE_PATH+client/tenant, then client/username/password with optional
      tenant. Incomplete environment yields its named unavailable error. Preserve actual authentication-error short
      circuit; the declared native developer-credential deviation applies after these links.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_default_chain_fallback$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_default_chain.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_default_chain*")"
      && grep -lq 'azure_default_chain' tools/oracle/fuzz/corpus/helper_case/azure_default_chain* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_default_chain$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-azure-credential
    why: The AZURE_CREDENTIAL setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_credential$/)'
      && grep -lq 'AZURE_CREDENTIAL' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-azure-federated-token-file
    why: The AZURE_FEDERATED_TOKEN_FILE setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_federated_token_file$/)'
      && grep -lq 'AZURE_FEDERATED_TOKEN_FILE' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-azure-certificate-path
    why: The AZURE_CERTIFICATE_PATH setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_certificate_path$/)'
      && grep -lq 'AZURE_CERTIFICATE_PATH' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-azure-certificate-password
    why: The AZURE_CERTIFICATE_PASSWORD setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_certificate_password$/)'
      && grep -lq 'AZURE_CERTIFICATE_PASSWORD' crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/azure_default_chain*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: unsupported-credential-name
    why: The unsupported credential name invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_unsupported_credential_name$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_secret_safe_failure$/)'
  - id: case-credential-constructor-arguments
    why: ClientSecretCredential receives required env client_id/client_secret/tenant_id; ManagedIdentityCredential
      receives required AZURE_CLIENT_ID (missing key fails even though SDK alone could do system identity). CertificateCredential
      receives required client_id/tenant_id/certificate_path; include password only when truthy. Missing env keys
      remain the corresponding KeyError before token acquisition; never substitute empty strings.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_credential_constructor_arguments$/)'
  - id: case-default-environment-certificate
    why: The default-chain certificate inputs are AZURE_CLIENT_CERTIFICATE_PATH/PASSWORD, distinct from LiteLLM
      AZURE_CERTIFICATE_PATH/PASSWORD. AZURE_CLIENT_SEND_CERTIFICATE_CHAIN uses Python bool on the env string (nonempty
      false is true), default False; pass the flag to B674. Environment username/password passes AZURE_TENANT_ID
      (unlike B675 direct wrapper) and emits Environment is configured to use username and password authentication.
      This authentication method is deprecated, as it doesn't support multifactor authentication (MFA). For more
      details, see https://aka.ms/azsdk/identity/mfa.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_default_environment_certificate$/)'
  - id: case-default-credential-filter
    why: 'AZURE_TOKEN_CREDENTIALS defaults empty, strips whitespace and lowercases. prod selects environment/workload/managed;
      named environmentcredential/workloadidentitycredential/managedidentitycredential selects only that link. dev
      or a named developer/interactive credential is handled by the declared native unsupported-credential deviation.
      Invalid names raise the SDK Invalid value for AZURE_TOKEN_CREDENTIALS: {value}. Valid values are: dev, prod,
      azureclicredential, azuredeveloperclicredential, azurepowershellcredential, environmentcredential, interactivebrowsercredential,
      managedidentitycredential, visualstudiocodecredential, workloadidentitycredential. No token request precedes
      rejection.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_default_credential_filter$/)'
  - id: case-default-provider-try-boundary
    why: '_try_get_default_azure_credential_provider forces DefaultAzureCredential with supplied scope and returns
      its callable. Log attempt/success; catch any construction exception, debug DefaultAzureCredential failed:
      {e}, return None. Do not catch later invocation errors or acquire a token during construction.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_default_provider_try_boundary$/)'
  - id: case-chain-exhaustion
    why: 'Exhaustion emits a warning and ClientAuthenticationError starting {chain class} failed to retrieve a token
      from the included credentials., followed by Attempted credentials: and ordered credential/error lines, then
      https://aka.ms/azsdk/python/identity/defaultazurecredential/troubleshoot. Preserve visited-prefix history
      on an authentication short circuit; use B187 to redact secret values.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_chain_exhaustion$/)'
  - id: case-generic-credential-constructor
    why: A supported WorkloadIdentityCredential env name invokes the SDK no-argument constructor and reads its required
      environment. UsernamePasswordCredential through AZURE_CREDENTIAL reaches a no-argument constructor and fails
      for missing required client_id/username/password; it must not silently reuse the B675 explicit-argument wrapper.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_default_chain_cases::case_[0-9]+_generic_credential_constructor$/)'
  - id: config-azure-token-credentials
    why: AZURE_TOKEN_CREDENTIALS lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_token_credentials$/)'
  - id: config-azure-client-certificate-path
    why: AZURE_CLIENT_CERTIFICATE_PATH lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_client_certificate_path$/)'
  - id: config-azure-client-certificate-password
    why: AZURE_CLIENT_CERTIFICATE_PASSWORD lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_client_certificate_password$/)'
  - id: config-azure-client-send-certificate-chain
    why: AZURE_CLIENT_SEND_CERTIFICATE_CHAIN lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::azure_default_chain_config_cases::case_[0-9]+_loads_azure_client_send_certificate_chain$/)'
