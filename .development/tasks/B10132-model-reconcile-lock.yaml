id: B10132
title: Model reconcile lock handle
description: >-
  LiteLLM serializes every change to the router's model list with one module-level asyncio.Lock, MODEL_RECONCILE_LOCK (proxy_server.py L2587-L2595). Without it two model writes each reconcile the router against their own database snapshot, and the one holding the older snapshot evicts the deployment the newer one just added: the row stays in the database and this pod stops serving it. Six places take it: add_deployment (B8381), clear_cache (done B841), reload_search_tools_from_db (B8384), delete_team_models (B836), delete_model's router eviction (B838) and the models read-through resync (B9948). They sit in betterlite-server and in the binary crate crates/betterlite, which betterlite-server may not depend on, so the one type they share sits in betterlite-server below all of them. This task builds only that type.


  Module model_reconcile_lock in betterlite-server, crates/betterlite-server/src/model_reconcile_lock.rs with its tests in model_reconcile_lock/tests.rs. The file is an empty stub its parent declares. It holds one public type:

  `ModelReconcileLock`, a tuple struct over a private `Arc<tokio::sync::Mutex<()>>`, deriving Clone, Debug and Default. Default makes a new lock, and Clone hands out another handle to the same one. It implements `Deref<Target = tokio::sync::Mutex<()>>`, so a holder writes `let _reconciling = reconcile_lock.lock().await;`, and done B841's `model_reload::cache::clear_cache`, whose `gate` parameter is `&tokio::sync::Mutex<()>`, takes `&reconcile_lock` unchanged. Add no other method: a `new()` or `lock()` that only forwards is a one-line function the hooks refuse, while the Deref impl is a trait impl and exempt.


  LiteLLM keeps the lock at module level only because llm_router is a module global. betterlite has no statics (rules.yaml inject-dependencies), so the startup builds one handle with Default where it builds DeploymentSync (B8613) and passes clones through constructors to DeploymentSync, DbObjectSync, DeploymentModelSync and the model write services. None of that wiring is built here, and no consumer is changed.


  Tests in model_reconcile_lock::tests, all #[tokio::test]. `clones_share_one_lock`: while a guard taken through one handle is alive, try_lock through its clone fails, and after the guard drops it succeeds. `separate_locks_do_not_block_each_other`: with a guard alive on one Default-built handle, try_lock on a second Default-built handle succeeds, so building a handle twice never gives a process-wide lock. `waiter_runs_after_the_holder_releases`: two futures over clones, standing for a model reconcile and a search tool refresh, run under tokio::join!; the first takes the guard, records "model start", calls tokio::task::yield_now while holding it and records "model end"; the second records "search" once it has the guard. The record reads model start, model end, search. Keep the record in an Arc<std::sync::Mutex<Vec<&str>>> or a bounded channel, never a RefCell.
scope:
  paths:
    - crates/betterlite-server/src/model_reconcile_lock.rs
    - crates/betterlite-server/src/model_reconcile_lock/**
  lint_tables: false
