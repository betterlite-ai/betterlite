    why: MODEL_RECONCILE_LOCK and the comment on why every model reconcile shares one lock.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L8101-L8130
    why: add_deployment takes the lock around _add_deployment_locked; B8381 builds it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L9039-L9057
    why: reload_search_tools_from_db takes the same lock; B8384 builds it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_management_endpoints.py#L3224-L3253
    why: clear_cache holds the lock for its whole extent and calls the locked half, since asyncio.Lock is not reentrant; done B841 takes it as a &Mutex<()> gate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_management_endpoints.py#L1798-L1809
    why: delete_team_models evicts the deleted ids from the router under the lock; B836 builds it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/model_management_endpoints.py#L2247-L2256
    why: delete_model's router eviction under the lock; B838 builds it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/registry_read_through.py#L120-L131
    why: The models read-through resync takes the lock only when a router exists; B9948 builds it.
dod:
  - text: A guard taken through one ModelReconcileLock handle blocks every clone of it until the guard drops.
    proof: [lock-tests]
  - text: Two handles built with Default are two independent locks.
    proof: [lock-tests]
  - text: A second holder waits until the first releases, even when the first yields while holding the guard.
    proof: [lock-tests]
checks:
  optional: []
  commands:
    - id: lock-tests
      why: The shared lock handle is missing, its clones do not share one mutex, or two separate handles share one.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_reconcile_lock::tests::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "add_deployment and the locked half clear_cache calls: B8381. clear_cache itself: done B841 (model_reload::cache)."
  - "reload_search_tools_from_db and the rule that load_search_tools never takes the lock: B8384."
  - "delete_team_models: B836. delete_model and its router eviction: B838. The models read-through resync: B9948."
  - "Building the one handle at startup and passing it to its holders: B8613."
  - "The agent registry's and the guardrail runtime's own reconcile locks (done B4776 and the guardrail startup) are separate locks and stay where they are."
pitfalls:
  - "Use tokio::sync::Mutex, not std::sync::Mutex: every holder keeps the guard across database and router awaits, and clippy's await_holding_lock refuses a std guard there."
  - "Derive Default and add no constructor: clippy's new_without_default fires on a bare new(), and the hooks refuse a new() that only builds the struct."
  - "No static, OnceLock or LazyLock for the shared instance, even though LiteLLM's MODEL_RECONCILE_LOCK is a module global; one handle per process comes from the startup passing clones."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
