checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^postgres_store::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/postgres_store::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/postgres_store::tests::postgres_failure_effects$/)'
oracle_cases: []
deviations:
  - what: A single = ANY($1) array parameter replaces Prisma chunked_in and its 32767-parameter splitting;
      empty input avoids a query and IDs remain deduplicated.
    why: SQLx binds the array as one parameter; reconstructing Prisma query dictionaries serves no native
      caller.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/chunked_in.py#L1-L145
