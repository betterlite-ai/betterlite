id: B700
title: Native Postgres sessions and repository result semantics
description: >-
  Create betterlite-db::postgres_store with SQLx PostgresStore, an explicit DbSession transaction
  handle, DbError and a typed RowCodec contract. Replace the live BaseRepository operations at
  repositories/base_repository.py L30-L134 and the structural protocols in prisma_protocols.py.
  Concrete SQL statements and row fields belong to their table repositories; this foundation binds
  typed parameters and supplies shared result/transaction semantics, not a Prisma dictionary query
  interpreter. It receives an already configured pool; connection URLs and pool/reconnect settings
  remain B710/B711. No cipher or stored-secret operation exists in these owned ranges.

  Preserve the missing-client error No DB Connected. See - https://docs.litellm.ai/docs/proxy/virtual_keys
  as a typed database-unavailable result; the route owner supplies HTTP status/type/param/code. A
  missing client is detected when a repository accesses its table, not when an optional repository
  wrapper is constructed. record_to_dict prefers model_dump, then dict, then Mapping identity, then
  key/value iteration with last duplicate key winning. _to_model(None) returns None; otherwise its
  concrete codec validates the record and propagates errors. _to_model_list skips null records and
  null conversion results, preserving the remaining order; it does not skip invalid records. The
  Python protocol adapters are test-only; native production uses typed SQLx rows and RowCodec.

  find_by_id/update/delete default the key column to id, with a typed alternate-column selection by
  each repository. find_many leaves skip/take/order unset by default and normalizes empty where/order
  to absence; explicit skip=0/take=0 remain present. find_by_id/update/delete return the converted row
  or None if the backend returns None. Do not catch a backend not-found/constraint error and turn it
  into None. create requires a non-null returned row, preserving a distinct internal invariant failure
  if a backend violates that contract. count passes its optional filter directly, without find_many's
  empty-map normalization; exists tests raw row presence without invoking its model decoder. None
  results do not invent rows. These operations neither hash keys nor add timestamps; those writes are
  owned by their concrete callers.

  Port find_many_in as a typed one-array membership read. Deduplicate input values in first-seen order;
  an empty list performs no SQL. A repository with no client still fails its table access before the
  standalone empty-input shortcut. A single = ANY($1) binds the array, including more than 32767 IDs,
  so native code does not reproduce the pinned 5000-value chunks or expose chunk_size. No caller at
  this pin supplies where or chunk_size to find_many_in. Preserve membership and duplicate removal;
  result ordering is unspecified without an explicit query order, and no pagination is added to this
  read. The change to read statement count/snapshot behavior is an explicit deviation below.

  is_unique_violation's live Prisma path recognizes UniqueViolationError or code P2002. Its import-
  failure fallback searches case-sensitive P2002 or case-insensitive unique constraint in the message.
  Native SQLx errors instead classify PostgreSQL SQLSTATE 23505 as unique violation and retain a
  separate category for every other SQLSTATE; no matching of database text is needed. Keep constraint
  identifiers available to route policy without logging SQL parameter values or connection credentials.
  P2002 is a compatibility classification here, not a new public response code. B061 and agent routes
  consume this predicate and own their conflict responses.

  Each ordinary operation uses the session it was given. Only callers that explicitly begin a
  transaction get joint commit/rollback: a failure on a second pool operation must not erase a first
  committed write. A transaction rolls back on error/cancellation/drop and releases its connection;
  successful commit makes all its changes visible. Use B860's betterlite-postgres-fixture with
  POSTGRES_TEST_URL when present and testcontainers otherwise; inability to connect/start fails the
  test. Run each test in a unique schema with cleanup. Use small test tables for this foundation so
  it does not depend on later migration cohorts or live proxy globals.

  Base/protocol ownership has 181 nonblank, noncomment source lines after excluding the unused
  DomainModel methods, including protocol declarations and the membership-read entry point. Allow
  220 production, 270 unit/Postgres tests, 80 pure-helper adapters and 50 crate/dispatch wiring lines,
  620 within 650. The repository_record helper compares only record projection and null/list decoding
  with the pinned BaseRepository functions; SQL/transaction behavior uses real Postgres. B171 owns
  helper-byte decoding; typed driver rows introduce no separate fuzz boundary. Split session, errors
  and row modules with adjacent tests to stay below 300 lines per Rust file.
scope:
  paths:
    - Cargo.toml
    - deny.toml
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/src/postgres_store.rs
    - crates/betterlite-db/src/postgres_store/**
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/mod.rs
    - tools/oracle/src/helpers/repository_record.rs
    - tools/oracle/helpers/dispatch.py
    - tools/oracle/helpers/repository_record.py
    - tools/oracle/cases/helpers/repository-record/**
    - tools/oracle/fuzz/corpus/helper_case/repository-record-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/base_repository.py#L17-L134
    why: Record projection priority, missing-client error, forwarding defaults, null handling and uniqueness predicate.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/prisma_protocols.py#L15-L174
    why: Replace the structural database/table/batch contracts with native sessions and typed repository methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/chunked_in.py#L19-L102
    why: Read defaults, stable deduplication, sequential chunks and empty-input behavior being replaced.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/base.py#L11-L38
    why: DomainModel is unused by production; its separate conversion rules must not be mistaken for BaseRepository behavior.
  - url: https://docs.rs/sqlx/latest/sqlx/postgres/index.html
    why: Native Postgres pool, parameter arrays and SQLSTATE access.
  - url: https://docs.rs/tokio-postgres/latest/tokio_postgres/
    why: Compare the alternative driver before adding SQLx dependencies.
dod:
  - text: 'repository_record covers model_dump_before_dict, dict_before_mapping, mapping_unchanged,
      sequence_last_duplicate_wins, null_record_returns_none, null_list_entries_dropped,
      conversion_none_dropped, list_order_preserved and invalid_record_propagates.'
    proof: [behavior-tests, oracle, helper-python, helper-corpus]
  - text: 'repository_result_semantics covers optional_client_constructs_but_access_fails,
      missing_client_exact_message, default_id_and_alternate_key, empty_where_order_absent,
      skip_take_zero_preserved, count_empty_filter_preserved, missing_result_none,
      backend_error_not_none, create_null_invariant and exists_does_not_decode.'
    proof: [behavior-tests, postgres-tests]
  - text: 'postgres_membership covers empty_no_statement, missing_client_before_empty_shortcut,
      stable_input_dedup, bound_array_sql_injection_literal and native_single_array_over_parameter_cap.
      postgres_errors covers unique_sqlstate_23505, foreign_key_not_unique, not_null_not_unique,
      constraint_identity_retained and secrets_absent_from_errors.'
    proof: [postgres-tests]
  - text: 'postgres_transaction_effects covers explicit_commit, explicit_error_rollback,
      cancellation_releases_and_rolls_back and pool_writes_remain_after_later_failure.
      Both configured_url_and_unique_schema and testcontainer_fallback are fixture contract checks.'
    proof: [postgres-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Repository projection/default/result behavior is missing or differs from the pin.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^postgres_store::tests::/)'
    - id: postgres-tests
      why: Native array, SQLSTATE or transaction behavior has no passing real-database tests.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^postgres_store::tests::postgres_/)'
    - id: helper-python
      why: The pure pinned record adapter is absent or fails Python checks.
      run: test -f tools/oracle/helpers/repository_record.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-corpus
      why: No repository_record seed exercises the shared helper decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/repository-record-*')" && grep -rlq repository_record tools/oracle/fuzz/corpus/helper_case/repository-record-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/repository-record/projection-precedence.yaml
  - tools/oracle/cases/helpers/repository-record/mapping-and-pair-sequence.yaml
  - tools/oracle/cases/helpers/repository-record/null-and-ordered-list.yaml
  - tools/oracle/cases/helpers/repository-record/invalid-model-propagates.yaml
deviations:
  - what: Membership reads bind one Postgres array, including more than 32767 IDs, instead of sequential 5000-ID statements. Operators see one statement/snapshot and no chunk_size option; empty input still makes no query and results remain deduplicated.
    why: The native driver supports array parameters; no live caller sets chunk_size, where or pagination here. No route status or error code changes for valid inputs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/chunked_in.py#L76-L102
out_of_scope:
  - DomainModel, from_db_record and to_db_dict in models/base.py have no caller at the pin; production domain rows use proxy models instead.
  - All CustomDB methods in proxy/db/base_client.py and DynamoDBWrapper.__init__/set_env_vars_based_on_arn have no live production caller at the pin; the deprecated DynamoDB adapter is not built.
  - chunked_in count_in, update_many_in and delete_many_in have no caller at the pin. Atomicity and ChunkedFieldWriteError belong only to those unused write helpers.
  - _as_clauses, _logical_clauses, _filters_field, _chunk_filter and _each_chunk are replaced here by the typed array read. Its callers never supply custom where or chunk_size, so SameFieldFilterError and chunk-size validation have no native caller.
  - B710 owns connection settings and row/config decoding, B711 connection lifecycle, B714 shared row types, B716 migration locks/recovery and B873 deployment of SQL. Table-specific statements and field validation stay in B722-B726 and other concrete repositories.
  - B860 owns the shared Postgres fixture; this task consumes it without adding another testcontainer wrapper.
pitfalls:
  - BaseRepository checks its table before find_many_in can return for empty IDs, so a missing client still fails that wrapper.
  - exists deliberately ignores record validity; routing it through find_by_id can introduce a decoder failure that LiteLLM never raises.
  - A typed SQLSTATE classifier must not mistake foreign-key or not-null violations for the P2002 compatibility category.
review_level: security
budget:
  max_changed_lines: 650
  max_new_expects: 0
