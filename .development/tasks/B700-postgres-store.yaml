id: B700
title: Native Postgres access and transaction test support
description: >-
  Create betterlite-db PostgresStore, DbSession, DbError and typed RowCodec, with SQLx Postgres bound
  parameters and explicit transactions. Future repositories receive DbSession and injected StoredCipher;
  B061 supplies encryption. Expose typed table operations that the production call sites actually use,
  without a generic JSON query engine. Empty array filters never query and duplicate IDs are removed before
  binding one ANY($1) Postgres array.


  Build the production postgres_store module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/base_repository.py:
  SupportsModelDump.model_dump (L19-L19; 1 source lines), SupportsDict.dict (L24-L24; 1 source lines),
  record_to_dict (L30-L38; 9 source lines), BaseRepository.__init__ (L44-L45; 2 source lines), BaseRepository.prisma_client
  (L48-L51; 4 source lines), BaseRepository.table (L55-L57; 3 source lines), BaseRepository.model_class
  (L61-L63; 3 source lines), BaseRepository._to_model (L65-L69; 5 source lines), BaseRepository._to_model_list
  (L71-L73; 3 source lines), BaseRepository.find_by_id (L75-L78; 4 source lines), BaseRepository.find_many
  (L80-L94; 15 source lines), BaseRepository.find_many_in (L96-L98; 3 source lines), BaseRepository.create
  (L100-L105; 6 source lines), BaseRepository.update (L107-L110; 4 source lines), BaseRepository.delete
  (L112-L115; 4 source lines), BaseRepository.count (L117-L119; 3 source lines), BaseRepository.exists
  (L121-L124; 4 source lines), is_unique_violation (L127-L134; 8 source lines). litellm/repositories/prisma_protocols.py:
  DatabaseClient.db (L17-L17; 1 source lines), TableActions.find_unique (L28-L30; 3 source lines), TableActions.find_first
  (L32-L40; 9 source lines), TableActions.find_many (L42-L51; 10 source lines), TableActions.create (L53-L53;
  1 source lines), TableActions.create_many (L55-L57; 3 source lines), TableActions.upsert (L59-L64; 6
  source lines), TableActions.update (L66-L71; 6 source lines), TableActions.update_many (L73-L73; 1 source
  lines), TableActions.delete (L75-L77; 3 source lines), TableActions.delete_many (L79-L79; 1 source lines),
  TableActions.count (L81-L88; 8 source lines), TableActions.group_by (L90-L104; 15 source lines), PrismaRecord.dict
  (L108-L108; 1 source lines), ReadOnlyTable.find_many (L112-L112; 1 source lines), SpendLinkedTable.find_many
  (L116-L116; 1 source lines), SpendLinkedTable.update_many (L118-L118; 1 source lines), FindManyTable.find_many
  (L122-L122; 1 source lines), CountTable.count (L126-L126; 1 source lines), UpdateManyTable.update_many
  (L130-L130; 1 source lines), DeleteManyTable.delete_many (L134-L134; 1 source lines), BatchTable.update
  (L138-L138; 1 source lines), BatchTable.update_many (L140-L140; 1 source lines), PrismaBatch.litellm_verificationtoken
  (L145-L145; 1 source lines), PrismaBatch.litellm_usertable (L148-L148; 1 source lines), PrismaBatch.litellm_teamtable
  (L151-L151; 1 source lines), PrismaBatch.litellm_budgettable (L154-L154; 1 source lines), PrismaBatch.litellm_teammembership
  (L157-L157; 1 source lines), PrismaBatch.litellm_organizationtable (L160-L160; 1 source lines), PrismaBatch.litellm_tagtable
  (L163-L163; 1 source lines), PrismaBatch.litellm_endusertable (L166-L166; 1 source lines), PrismaBatch.litellm_modelaccessgroupbudgettable
  (L169-L169; 1 source lines), PrismaBatch.litellm_projecttable (L172-L172; 1 source lines), PrismaBatch.commit
  (L174-L174; 1 source lines). litellm/repositories/chunked_in.py: find_many_in (L92-L102; 11 source lines).
  litellm/models/base.py: DomainModel.from_db_record (L24-L34; 11 source lines), DomainModel.to_db_dict
  (L36-L38; 3 source lines).


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 195 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  195 production, 157 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 382 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_a_single_any_1_array_parameter_replaces_prisma_chunked_in_and_its_3276.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
