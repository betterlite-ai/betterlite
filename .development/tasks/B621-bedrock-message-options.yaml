id: B621
title: Bedrock Messages cache thinking and beta policy
description: >-
  Add BedrockMessagesOptions normalization over native Anthropic records. Preserve model-specific TTL removal and
  clear-thinking budget/effort synthesis. This leaf transforms parsed native records directly; parent request assembly
  and B692 beta/context policy remain outside its ownership.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeMessagesConfig._is_claude_4_5_on_bedrock L389-L401; AmazonAnthropicClaudeMessagesConfig._remove_ttl_from_cache_control
  L158-L211; AmazonAnthropicClaudeMessagesConfig._supports_extended_thinking_on_bedrock L213-L248; AmazonAnthropicClaudeMessagesConfig._ensure_thinking_for_clear_thinking_context_management
  L250-L320; AmazonAnthropicClaudeMessagesConfig._resolve_clear_thinking_budget_tokens L323-L329; AmazonAnthropicClaudeMessagesConfig._effort_from_thinking_budget
  L332-L339; AmazonAnthropicClaudeMessagesConfig._inject_adaptive_thinking_for_clear_thinking L341-L368; AmazonAnthropicClaudeMessagesConfig._clamp_adaptive_reasoning_effort_for_bedrock
  L657-L674.


  Reuse AnthropicModelInfo._is_adaptive_thinking_model from B688 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse normalize_bedrock_opus_output_config_effort from B690 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  B692 owns beta, web-search and context-management filtering; this task only owns the effort/thinking normalization
  functions listed below.


  Named case contracts: cache_ttl_model_policy: The local _is_claude_4_5_on_bedrock wrapper calls B690 is_claude_4_5_on_bedrock.
  Only call it for a truthy model; otherwise TTL support is false. Mutate cache_control dictionaries on tools, system
  list items and message content list items, without recursively descending into nested tool results. Always remove
  scope; retain ttl only for supported models and exact 5m or 1h. Preserve type and unrelated fields, even unsupported
  ones. Ignore non-dict cache_control and content items, but do not invent guards for malformed noniterable tools/messages
  containers. No warning accompanies field removal. clear_thinking_budget: Inject only for context_management dict
  with edits list containing a dict whose type is clear_thinking_20251015, and an extended-thinking-supported model.
  Existing thinking.type=adaptive returns False untouched; enabled on a nonadaptive model also returns False. Enabled
  on an adaptive model converts its budget through int, preserving explicit 0/negative/string integers and defaulting
  only None to BEDROCK_MIN_THINKING_BUDGET_TOKENS=1024. This enabled-to-adaptive branch bypasses the max_tokens
  safety check. adaptive_clear_thinking: Adaptive injection keeps a dict output_config or replaces other types with
  {}. setdefault effort means existing None/empty/other values win; absent effort is xhigh for budget>=DEFAULT_REASONING_EFFORT_XHIGH_THINKING_BUDGET=8192,
  high for >=HIGH=4096, medium for >=MEDIUM=2048, else low. B688 loads the exact DEFAULT_REASONING_EFFORT_*_THINKING_BUDGET
  environment names and minimum above. Replace thinking with {type:adaptive}, preserving display only when its existing
  value is not None, including empty/False; discard other thinking fields. Debug-log Bedrock clear_thinking_20251015:
  injected adaptive thinking with effort=%s for model=%s. This helper does not clamp the derived effort itself.
  effort_clamp: Use the same raw-effort cases as B618: only adaptive Bedrock models with string reasoning_effort
  call B690 normalization on {effort:value}, then update the original options. Nonadaptive,nonstring and unknown/no-ceiling
  values remain as the shared helper specifies. extended_thinking_support: B688 adaptive-thinking capability for
  provider bedrock wins first. Otherwise lowercase the model and accept any substring from opus-4.5,opus_4.5,opus-4-5,opus_4_5,opus-4.1,opus_4.1,opus-4-1,opus_4_1,opus-4,opus_4,sonnet-4,sonnet_4.
  This is substring matching without version boundaries, so future suffixes matching opus-4 also pass; other families
  do not. clear_thinking_injection_limit: For other thinking dictionaries, debug-log Bedrock clear_thinking_20251015:
  replacing thinking=%s with minimal thinking config. Use the configured minimum budget, then if max_tokens is a
  Python int (including bool) and <= budget, emit warning Bedrock clear_thinking_20251015: max_tokens=%s is not
  greater than minimum thinking budget (%s); cannot inject thinking safely and return False without replacing thinking.
  Missing,non-int or larger max_tokens permit injection. Nonadaptive models get exactly {type:enabled,budget_tokens:budget},
  debug-log Bedrock clear_thinking_20251015: injected thinking with budget_tokens=%s, and return True.


  Implement crates/betterlite-bedrock/src/message_options.rs with adjacent tests under message_options/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function message_options_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): cache_ttl_model_policy, clear_thinking_budget, adaptive_clear_thinking, effort_clamp, extended_thinking_support,
  clear_thinking_injection_limit. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_message_options* using HelperCase: kind:
  helper and the externally tagged bedrock_message_options variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_message_options that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 205 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 250 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 600 planned, 600 maximum changed lines.
