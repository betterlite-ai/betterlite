id: B621
title: Bedrock Messages cache thinking and beta policy
description: >-
  Add BedrockMessagesOptions normalization over native Anthropic records. Preserve model-specific TTL removal, clear-thinking
  budget/effort synthesis, context-management filtering, tool-search betas, unsupported web-search rejection and
  field dropping with diagnostics. Parent AnthropicMessagesConfig normalization stays B081; this leaf accepts already
  prepared native messages/options and the oracle isolates only the listed overrides with a normalized-input superclass
  seam.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py:
  AmazonAnthropicClaudeMessagesConfig._remove_ttl_from_cache_control L158-L211; AmazonAnthropicClaudeMessagesConfig._supports_extended_thinking_on_bedrock
  L213-L248; AmazonAnthropicClaudeMessagesConfig._ensure_thinking_for_clear_thinking_context_management L250-L320;
  AmazonAnthropicClaudeMessagesConfig._resolve_clear_thinking_budget_tokens L323-L329; AmazonAnthropicClaudeMessagesConfig._effort_from_thinking_budget
  L332-L339; AmazonAnthropicClaudeMessagesConfig._inject_adaptive_thinking_for_clear_thinking L341-L368; AmazonAnthropicClaudeMessagesConfig._clamp_adaptive_reasoning_effort_for_bedrock
  L657-L674.


  Reuse AnthropicModelInfo._is_adaptive_thinking_model from B688 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse normalize_bedrock_opus_output_config_effort from B690 (litellm/llms/bedrock/common_utils.py); its implementation
  remains with that prerequisite.


  B692 owns beta, web-search and context-management filtering; this task only owns the effort/thinking normalization
  functions listed below.


  Implement crates/betterlite-bedrock/src/message_options.rs with adjacent tests under message_options/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_message_options in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function message_options_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): cache_ttl_model_policy, clear_thinking_budget, adaptive_clear_thinking, effort_clamp. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_message_options* using HelperCase: kind:
  helper and the externally tagged bedrock_message_options variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_message_options that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 195 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 220 production lines, 81 behavior/config-test lines,
  71 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 397 planned, 400 maximum changed lines.
