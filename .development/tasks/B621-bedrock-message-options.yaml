    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py#L158-L368
  why: >-
    Own AmazonAnthropicClaudeMessagesConfig._remove_ttl_from_cache_control, AmazonAnthropicClaudeMessagesConfig._supports_extended_thinking_on_bedrock,
    AmazonAnthropicClaudeMessagesConfig._ensure_thinking_for_clear_thinking_context_management, AmazonAnthropicClaudeMessagesConfig._resolve_clear_thinking_budget_tokens,
    AmazonAnthropicClaudeMessagesConfig._effort_from_thinking_budget, AmazonAnthropicClaudeMessagesConfig._inject_adaptive_thinking_for_clear_thinking.
    Other functions in this file remain with the owners listed below.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/messages/invoke_transformations/anthropic_claude3_transformation.py#L657-L674
  why: Own AmazonAnthropicClaudeMessagesConfig._clamp_adaptive_reasoning_effort_for_bedrock. Other functions in
    this file remain with the owners listed below.
dod:
- text: >-
    cache ttl model policy: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-options/cache-ttl-model-policy.yaml.
  proof:
  - case-cache-ttl-model-policy
  - oracle
  - helper-python
- text: >-
    clear thinking budget: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-options/clear-thinking-budget.yaml.
  proof:
  - case-clear-thinking-budget
  - oracle
  - helper-python
- text: >-
    adaptive clear thinking: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-options/adaptive-clear-thinking.yaml.
  proof:
  - case-adaptive-clear-thinking
  - oracle
  - helper-python
- text: 'effort clamp: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-message-options/effort-clamp.yaml.'
  proof:
  - case-effort-clamp
  - oracle
  - helper-python
- text: New bedrock_message_options seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-cache-ttl-model-policy
    why: The cache-ttl-model-policy behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_options_cases::case_[0-9]+_cache_ttl_model_policy$/)'
  - id: case-clear-thinking-budget
    why: The clear-thinking-budget behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_options_cases::case_[0-9]+_clear_thinking_budget$/)'
  - id: case-adaptive-clear-thinking
    why: The adaptive-clear-thinking behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_options_cases::case_[0-9]+_adaptive_clear_thinking$/)'
  - id: case-effort-clamp
    why: The effort-clamp behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::message_options_cases::case_[0-9]+_effort_clamp$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_message_options.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_message_options*")"
      && grep -lq 'bedrock_message_options' tools/oracle/fuzz/corpus/helper_case/bedrock_message_options* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_message_options$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
