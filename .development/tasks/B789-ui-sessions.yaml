    - crates/betterlite-server/src/ui_sessions.rs
    - crates/betterlite-server/src/ui_sessions/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/ui_sessions.rs
    - crates/betterlite-server/fuzz/corpus/ui_sessions/**
    - tools/oracle/cases/management/ui-sessions/**
    - tools/oracle/helpers/b789.py
    - tools/oracle/helpers/b789/**
    - tools/oracle/src/helpers/server/b789.rs
    - tools/oracle/src/helpers/server/b789/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/password_endpoints.py#L48-L170
    why: Own audit literal, session predicate, table adapter and decorated password-change route.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/session_endpoints.py#L48-L175
    why: Own best-effort revocation and the logout route with its different failure contract.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2021-L2032
    why: B124 request/response fields have no optional password or response-message defaults.
dod:
  - text: Every named password, revocation and logout branch above passes with its real envelope and cookie behavior.
    proof: [behavior-tests, oracle]
  - text: Postgres row and injected failure tests retain all source partial writes.
    proof: [postgres-tests]
  - text: The production password body decoder and fuzz corpus reject malformed or bounded input safely.
    proof: [behavior-tests, parser-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: A password/session branch or secret-redaction case is missing.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^ui_sessions::tests::/) - test(/replays_the_/)'
    - id: postgres-tests
      why: Password writes and archive/delete/cache partial effects are unproved.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/ui_sessions::tests::postgres_rows_and_failures$/)'
    - id: parser-corpus
      why: The password decoder fuzz target or replay is absent.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/ui_sessions.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_ui_sessions_corpus)'
oracle_cases:
  - tools/oracle/cases/management/ui-sessions/password-validation-order.yaml
  - tools/oracle/cases/management/ui-sessions/password-write-and-retained-session.yaml
  - tools/oracle/cases/management/ui-sessions/revocation-partial-failure.yaml
  - tools/oracle/cases/management/ui-sessions/logout-session-kinds.yaml
  - tools/oracle/cases/management/ui-sessions/logout-cookie-and-missing-row.yaml
  - tools/oracle/cases/management/ui-sessions/logout-failure-order.yaml
deviations:
  - what: Enforce inherited HTTP limits, or the repository fallback of 1048576 bytes and JSON depth 64,
      on password-change request bodies, with a typed request-limit error.
    why: README bounded parsing; password_body_limits tests the concrete decoder.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/password_endpoints.py#L70-L80
out_of_scope:
  - B2333 owns expired-session cleanup and its settings. B786 owns password policy/hash/verify/HIBP;
    B777 archives tokens, B734 evicts key objects, B2330 audits, B124 owns wire record declarations
    and outer error handling, B731 database-unavailability classification, B052 authentication.
  - All functions in the two covered endpoint modules are owned here; no cryptographic storage format is added.
pitfalls:
  - Password change keeps the caller's forced-reset session unchanged rather than widening its allowed routes.
  - Logout's missing-row success occurs after authentication and does not promise reuse of a revoked bearer.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
