id: B789
title: Password change and UI session revocation
description: >-
  Own every function in password_endpoints.py L52-L170 and session_endpoints.py L48-L175,
  registering POST /user/password/change and POST /session/logout exactly once. Neither uses
  management_endpoint_wrapper: password values must never reach generic management span kwargs.
  B2333 owns the extracted expired-session cleanup job, including its batch-size setting.

  Password change requires B124 ChangePasswordRequest.current_password and new_password strings,
  both excluded from diagnostic representations; missing/wrong-type fields return schema 422.
  Require DB first (HTTP 500 detail.error), then a session team_id exactly litellm-dashboard and
  metadata.login_method exactly username_password (HTTP 403 detail.error otherwise). Invalid
  metadata shape fails the dict validator and reaches the outer 500 handler, not the 403 branch.
  Require non-null caller.user_id (400), find_first by user_id, and require non-null stored
  password (400, including no row). Verify current password through B786 (400 if incorrect),
  reject exact equality of new/current strings (400), then B786 strength and breach validation.
  Cases change_body_required, change_db_before_session, change_session_kind,
  change_invalid_metadata, change_missing_identity, change_missing_password,
  change_wrong_current, change_same_password and change_policy_before_write prove ordering.
  Each explicit error is a detail.error message describing its failed condition, with no
  OpenAI type/param/code; route wording may follow README Decisions. No except block remaps it.

  Update password with B786 hash_password, password_reset_required=false and
  last_breach_check_at=null in one user-row write. Then await revoke_ui_session_keys retaining
  caller.token, log only user_id, await B2330 create_object_audit_log, and return required fields
  user_id and message='Password updated successfully.'. Audit action is updated, table
  LiteLLM_UserTable, object ID=user_id, changed-by header=null, after_value exactly
  '{"fields_changed": ["password"]}', and before_value absent. Cases change_write_fields,
  change_keep_current_revoke_others, change_audit_fields_only and change_write_failure_no_revoke
  inspect actual rows and submitted audit records. The retained session's metadata and allowed
  routes are not rewritten: change_forced_reset_session_unchanged proves that restriction remains
  until a new session. No new cookie is minted by password change.

  revoke_ui_session_keys returns zero silently without DB. Query by user_id and
  team_id=litellm-dashboard, excluding null tokens and keep_hashed_token after the read.
  No remaining rows returns zero. B777 archives them first, forwarding litellm_changed_by;
  delete_many by token-in-list next, B734 delete_cache_key_objects last. Return selected-token
  count, not delete_many's count. Catch ANY exception across read/validation/archive/delete/cache,
  log failure with user_id, return zero and preserve previous writes. Cases revoke_without_db,
  revoke_null_and_kept_tokens, revoke_selected_count, revoke_archive_failure,
  revoke_delete_failure_keeps_archive and revoke_cache_failure_keeps_deletion cover every stage.
  This failure does not undo the password update; change_revocation_failure_still_success proves it.

  Logout accepts no key selector or request body. Require DB (500) then UI-session team (403),
  irrespective of password/SSO login method. If caller.token is null, skip DB/cache work. Otherwise
  find_unique; archive an existing row through B777, delete_many by that token and set revoked=true,
  then evict the token even when no row existed. Finally delete cookie token with the framework's
  default path / and expiry/max-age zero, returning message='Session revoked.' or
  'Session already revoked.'. Cases logout_sso_session_allowed, logout_non_ui_denied,
  logout_null_token, logout_missing_row_evicts, logout_archive_delete_evict_cookie and
  logout_cookie_defaults pin exact behavior. A missing row after authentication is idempotent;
  a second HTTP request with an already revoked bearer may fail B052 auth before reaching this
  handler. logout_revoked_bearer_auth_failure keeps that distinction explicit.

  Logout has no catch: archive failure leaves the live row; delete failure leaves an archive;
  cache failure leaves deletion committed and does not reach cookie clearing. Cases
  logout_archive_failure, logout_delete_failure and logout_cache_failure compare those effects.
  Unexpected errors use B124's outer 500 internal_server_error message/type envelope without
  param/code, except B731 database-unavailability classification. There is no overall transaction.

  B001 route cases run against booted proxies and independent Postgres schemas, using
  POSTGRES_TEST_URL or testcontainers, never skipped on unavailable infrastructure. Inject failure
  ports only into native tests; pure row-selection assertions use source-safe fixtures. B788 owns
  the source PASSWORD_SESSION_METADATA literal; this module compares that record's declared
  login_method value without importing or invoking password-login orchestration.

  Own decode_password_change_request over bounded B003 JSON; use B770's existing server fuzz
  workspace, with ui_sessions target and valid/missing/type/duplicate/truncated/limit seeds.
  Keep request byte/depth bounds inherited from B003/B009 and the repository fallback 1048576/64.
  Native password_body_limits proves the recorded bound deviation. Other request/response record
  declarations remain B124's contract. Production files stay below 300 lines.

  Sizing: about 199 nonblank, noncomment source lines including docstrings before translation;
  allow 200 production, 330 behavior/Postgres tests, 65 HTTP wiring and 45 fuzz, 640 within 700.
  Keeping the cleanup manager, settings and helper adapter here would exceed 800.
scope:
