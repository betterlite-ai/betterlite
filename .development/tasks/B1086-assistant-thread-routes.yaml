id: B1086
title: Assistant thread and message routes
description: >-
  Build server::api::assistant_thread_routes for the four complete proxy functions create_threads,
  get_thread, add_messages and get_messages. Mount POST /v1/threads and /threads; GET /v1/threads/{thread_id}
  and /threads/{thread_id}; POST and GET /v1/threads/{thread_id}/messages and /threads/{thread_id}/messages.
  These eight paths use single-segment thread ids, unlike B1085's catch-all assistant-delete id.

  All four begin with data={} and delegate request decoration to B1103 and execution to B2489. Creating a
  thread awaits request.body but throws its contents away: messages, metadata and tool_resources in that
  body do not reach acreate_thread. Retrieval/listing also starts with empty data. Only add_messages parses
  strict JSON through B2489 decode_assistant_body. Pass thread_id as an explicit SDK argument; do not merge
  it over a body key of the same name. Schedule B012 request status on success, project B004 headers, and
  await B012 failure hooks on errors; no post-call success hook is present in these handlers.

  Ownership includes decorators at proxy_server.py:13325-13676, 302 nonblank/non-comment lines. The SDK
  functions live wholly in B1056/B1057 and are not owned here. Budget 205 routes, 185 behavioral tests,
  225 HTTP fixtures, 40 hook fixtures and 25 corpus seeds, 680 lines. Exercise actual provider HTTP through
  the booted proxies with a fixed test master key and assistant_settings; no helper case invokes a handler.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/api/assistant_thread_routes.rs
  - crates/betterlite-server/src/api/assistant_thread_routes/**
  - crates/betterlite-server/fuzz/corpus/assistant_body/message-*
  - tools/oracle/cases/api/assistant-thread-routes/**
  - tools/oracle/fixtures/assistant-thread-routes/**
  - tools/oracle/helpers/b1086.py
  - tools/oracle/helpers/b1086/**
  - tools/oracle/src/helpers/server/b1086.rs
  - tools/oracle/src/helpers/server/b1086/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L13325-L13676
  why: All eight decorators and complete thread/message handlers, including the discarded create-thread body and explicit thread_id calls.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L4325-L4385
  why: ProxyException stringifies a null code and distinguishes missing type/param attributes from explicit nulls.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2049-L2079
  why: A failed status-code conversion ends in the shared internal_server_error response, not the provider's original status.
dod:
- text: >-
    thread_and_message_aliases makes authenticated requests through all eight paths. Mock create/get thread
    returns {id:thread_a,object:thread,created_at:1,metadata:{}} with 200. Add-message sends content=hello,
    role=user,metadata={turn:first},attachments=[] and returns msg_a unchanged with 200. Omitting role
    raises TypeError before HTTP: 500,type="None",param="None",code="500", message naming missing required
    argument 'role'; neither this handler nor B1057 supplies a role default. List returns the mock
    object=list,data=[msg_a],has_more=false page with 200.
    Capture provider /v1/threads, /v1/threads/thread_a and /v1/threads/thread_a/messages methods and bodies.
    GET /threads/folder/thread_a is an unmatched route, not a request for a slash-containing thread id.
  proof: [thread-tests, oracle]
- text: >-
    create_thread_discards_body sends {messages:[{role:user,content:ignored}],metadata:{tag:ignored},
    tool_resources:{code_interpreter:{file_ids:[file_a]}},custom_llm_provider:azure}. OpenAI configured in
    assistant_settings still receives its default empty thread creation, with none of these supplied values.
    A JSON scalar body also remains ignored once authentication succeeds. SDK thread creation with messages
    is tested by B1056; adding it to this proxy handler would change the pinned behavior.
  proof: [thread-tests, oracle]
- text: >-
    message_list_drops_query sends ?limit=1&order=asc&after=msg_a&before=msg_z and a valid body with those
    keys. The provider still gets order=desc&limit=20 and neither cursor, B1057's defaults. Thread GET body
    {thread_id:other} is ignored. Query api-version is retained only by B1103's authenticated preparation,
    not by pagination parsing invented in this task. These discarded arguments produce no warning.
  proof: [thread-tests, oracle]
- text: >-
    message_body_and_path_collision posts {thread_id:other,content:hello} and {thread_id:null,content:hello}
    to /threads/thread_a/messages. Both fail before provider HTTP with TypeError for multiple values of
    keyword argument 'thread_id', producing 500,type="None",param="None",code="500". Truncated { and
    empty message bodies produce the same envelope with orjson's respective "unexpected end of data:
    line 1 column 2 (char 1)" and "Input is a zero-length, empty document: line 1 column 1 (char 0)"
    messages. Valid null/[] reaches request setup and fails there instead of becoming an empty object.
    Add collision, duplicate content keys and malformed bytes to B2489's decoder corpus.
  proof: [thread-tests, oracle, message-corpus]
- text: >-
    thread_route_failure_envelopes exercises each handler with llm_router absent: zero provider requests,
    HTTP 500,type="None",param="None",code="500",message="{'error': 'No models configured on proxy'}".
    An HTTPException(403,detail=denied) raised from a hook becomes 403,message=denied,type="None",
    param="None",code="403". For a normal exception, code attribute wins over status_code even when
    null: numeric code=409,status_code=502 gives HTTP 409,code="409"; absent code gives 502,code="502".
    With the async SDK's mapped 404 and code=null, the final status conversion fails and yields HTTP 500,
    {error:{message:"Internal server error",type:internal_server_error}}, with param/code absent. A plain
    exception without any attributes uses 500/type="None"/param="None"/code="500" and its string message.
  proof: [thread-tests, oracle]
- text: >-
    thread_response_metadata invokes the actual header helper with hidden model_id=deployment_a,
    cache_key=cache_a,api_base=https://provider.test/v1?key=secret and principal allowed_model_region=eu.
    Expect x-litellm-model-id=deployment_a,x-litellm-cache-key=cache_a,x-litellm-model-region=eu and
    x-litellm-model-api-base=https://provider.test/v1. Null/empty hidden entries omit their headers; version
    and request call-id use B004's public x-litellm names. Success schedules update_request_status with
    status=success,call id from data or ""; no success hook runs. Every caught failure invokes the failure
    hook with current data, logs the handler error and debug traceback, and does not schedule success.
  proof: [thread-tests, oracle]
- text: >-
    thread_routes_require_auth covers missing/invalid credentials on all eight aliases with a configured
    master key: 401,authentication_error,param=null,code="401", zero provider requests. A valid key sends
    the same request successfully. Shared auth policy and sanitized message text belong to B003/B732.
  proof: [thread-tests, oracle]
checks:
  optional: []
  commands:
  - id: thread-tests
    why: thread creation consumes a body the source drops, or message routing loses a path/collision/error case
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::assistant_thread_routes::tests::/) - test(/::replays_corpus$/)'
  - id: message-corpus
    why: message body bytes are not replayed through the decoder used by the route
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/assistant_body/message-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::assistant_dispatch::tests::replays_corpus$/)'
