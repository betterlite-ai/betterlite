deviations: []
out_of_scope:
- B2489 owns dispatch, assistant_settings and the JSON byte decoder; SDK thread and message callables remain B1056/B1057, reached only through that dispatcher.
- B1103 owns the complete authenticated request preparation interface, B004 response-header semantics, B012 hook/status machinery and B003 final error rendering/auth infrastructure.
- B1085 owns assistant object handlers and B089 run handling plus its complete stream generator. Other proxy_server.py callables remain with B083 audio, B1125 realtime and B124 proxy support or their existing extracted owners.
pitfalls:
- The POST /threads handler reads its body without decoding it, so SDK support for messages does not imply route support.
- A body thread_id is a duplicate keyword error rather than a value overwritten by the URL.
- These handlers prefer an existing null code attribute to status_code, exposing a sanitized 500 after error rendering fails.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
