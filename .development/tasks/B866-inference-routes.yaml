id: B866
title: Inference route permission tables
description: >-
  Build immutable ordered permission data for openai_routes, anthropic_routes and llm_api_routes.
  These arrays neither register HTTP routes nor check methods, fetch URLs or implement file/batch
  storage. B741/B882 consume their literals for matching; B207 call-type mapping is not called here.
  Use B868's lower route slices for the composite; do not depend on authentication or endpoint modules.

  Preserve openai_routes in the cited order: engine and openai/deployments {model} chat/completions,
  /chat/completions, /v1/chat/completions, /cursor/chat/completions, /cursor/models, /cursor/v1/models;
  engine and openai/deployments {model} completions then /completions and /v1/completions; the same
  four embeddings forms. Then unversioned followed by /v1 forms for /images/generations, /images/edits,
  /videos, /videos/{video_id}, /videos/{video_id}/content, /videos/{video_id}/remix,
  /audio/transcriptions, /audio/speech and /moderations. Batches and files instead put /v1 FIRST for
  each pair: /batches, /batches/{batch_id}, /batches/{batch_id}/cancel; /files, /files/{file_id},
  /files/{file_id}/content. Then unversioned first /fine_tuning/jobs and
  /fine_tuning/jobs/{fine_tuning_job_id}/cancel. Do not add fine-tuning retrieve/checkpoint paths.

  Continue /assistants then /v1/assistants, but /v1/assistants/{assistant_id} before its unversioned
  peer; unversioned-first pairs /threads, /threads/{thread_id}, /threads/{thread_id}/messages,
  /threads/{thread_id}/runs and /models. Then /utils/token_counter, /utils/model_info,
  /utils/transform_request, /rerank, /v1/rerank, /v2/rerank. Realtime uses prefixes '', /v1,
  /openai/v1 in that order for /realtime, then /realtime?{model}, /realtime/client_secrets,
  /realtime/calls and /realtime/transcription_sessions. The question-mark form is literally
  ?{model}, not ?model={model}, and is not a URL parser input here.

  Responses use those same three prefixes for /responses, /responses/{response_id},
  /responses/{response_id}/input_items, /responses/{response_id}/cancel and /responses/input_tokens.
  Finish unversioned-first /v1 pairs for /vector_stores, /vector_stores/{vector_store_id},
  /vector_stores/{vector_store_id}/search, /vector_stores/{vector_store_id}/files,
  /vector_stores/{vector_store_id}/files/{file_id}, /vector_stores/{vector_store_id}/files/{file_id}/content,
  /vector_store/list, /search, /search/{search_tool_name}, /decisions, /systemone, /ocr, /containers
  and /containers/*. Keep singular vector_store/list distinct from plural vector_stores.

  anthropic_routes is exactly /v1/messages, /v1/messages/count_tokens,
  /claude_code_gateway/v1/messages, /claude_code_gateway/v1/messages/count_tokens, /v1/skills,
  /v1/skills/{skill_id}, /claude-code/marketplace.json, /claude-code/plugins,
  /claude-code/plugins/{plugin_name}. llm_api_routes concatenates openai, anthropic, google,
  mapped_pass_through, passthrough_wildcard, apply_guardrail, mcp_inference, litellm_native,
  agent_inference and model_info in precisely that order. Preserve duplicates and {model} versus
  {model_name:path} spellings; never sort, deduplicate or expand templates into endpoint registrations.


  Build the production inference_routes module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/_types.py:
  LiteLLMRoutes.openai_routes (L339-L490; 129 source lines), LiteLLMRoutes.anthropic_routes (L551-L561;
  11 source lines), LiteLLMRoutes.llm_api_routes (L648-L659; 12 source lines).


  The B856 inference_routes helper returns exact constant arrays; Python reads the named pinned enum
  values and Rust returns production slices. No algorithm is copied into the adapter. Each family case
  compares the complete ordered table, not representative membership alone; native literal_cases uses
  a named rstest row for every literal and alias, plus nonmembers. B171 rejects unknown operation tags.


  The three declarations contain 152 nonblank noncomment source lines. Budget 155 production,
  180 table/decoder tests, 80 adapters and 30 wiring lines, 445 within 500. No Postgres fixture or
  setting is consumed; the existing HelperCase decoder owns the only input boundary.
scope:
  paths:
    - crates/betterlite-auth/src/inference_routes.rs
    - crates/betterlite-auth/src/inference_routes/**
    - crates/betterlite-auth/src/lib.rs
    - crates/betterlite-auth/Cargo.toml
    - tools/oracle/src/helpers/inference_routes.rs
    - tools/oracle/src/helpers/inference_routes/**
    - tools/oracle/helpers/inference_routes.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/auth.rs
    - tools/oracle/helpers/management/auth.py
    - tools/oracle/cases/helpers/inference-routes/**
    - tools/oracle/fuzz/corpus/helper_case/inference-routes-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L339-L490
    why: Own LiteLLMRoutes.openai_routes; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L551-L561
    why: Own LiteLLMRoutes.anthropic_routes; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L648-L659
    why: Own LiteLLMRoutes.llm_api_routes; preserve caller-visible values and failure ordering.
dod:
  - text: Full-array comparisons and per-literal rstest rows prove source order, every alias, template spelling and the ten-part concatenation without de-duplication.
    proof: [behavior-tests, oracle, helper-python]
  - text: 'Implement the owned behavior and ordered failure effects; named tests: literal_membership,
      alias_membership, group_expansion, unknown_group.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^inference_routes::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/inference_routes.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/inference-routes-*")"
        && grep -rlq "inference_routes" tools/oracle/fuzz/corpus/helper_case/inference-routes-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/inference-routes/openai-complete-ordered-table.yaml
  - tools/oracle/cases/helpers/inference-routes/anthropic-complete-ordered-table.yaml
  - tools/oracle/cases/helpers/inference-routes/llm-api-ten-part-concatenation.yaml
