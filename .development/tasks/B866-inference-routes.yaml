pitfalls:
  - Batches/files put versioned paths first, while most OpenAI pairs put them second.
  - Realtime's literal ?{model} entries must not be normalized into ordinary query parameters.
  - llm_api_routes includes model-info and native trace paths but excludes MCP and agent CRUD groups.
