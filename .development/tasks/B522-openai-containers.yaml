out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as openai_containers in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/containers.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_containers.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The initial /containers suffix builder is plain string concatenation, unlike the resource join that preserves
  api-version in the query.
- extra_query overrides the stringified limit, so converting it after the merge would change its type.
