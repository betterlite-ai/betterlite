    why: Resolve api_key then litellm.api_key then litellm.openai_key then OPENAI_API_KEY using truthiness; overwrite
      the exact Authorization key with Bearer <resolved key>, including Bearer None when unresolved.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_container_auth_chain$/)'
  - id: case-container-cost-header
    why: Only create adds B068 code-interpreter cost for sessions=1/provider=openai under _hidden_params.additional_headers.llm_provider-x-litellm-response-cost,
      preserving existing hidden entries.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_container_cost_header$/)'
  - id: case-container-response-error
    why: Metadata responses validate the operation-specific ContainerObject, ContainerListResponse, DeleteContainerResult
      or ContainerFileListResponse. Content returns raw_response.content unchanged; get_error_class raises BaseLLMException
      with the supplied status/message/headers.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_container_response_error$/)'
