  commands:
  - id: case-base-with-v1
    why: join_container_api_base_path appends a leading-slash suffix to the existing URL path with its trailing
      slashes stripped, preserving query and fragment through httpx.URL. It never adds a /v1 segment; cover an Azure
      /openai/v1/containers?api-version=v1 base.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_base_with_v1$/)'
  - id: case-base-with-containers
    why: Resolve api_base then litellm.api_base then OPENAI_BASE_URL then OPENAI_API_BASE then https://api.openai.com/v1
      using truthiness. Strip trailing slashes and append /containers even if the base already ends in /containers;
      do not deduplicate the collection suffix.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_base_with_containers$/)'
  - id: case-create-expires-after
    why: Advertise name, expires_after, file_ids, extra_headers; map params by copying all keys regardless of drop_params.
      Create removes only extra_headers; an optional name overrides the required name because options are expanded
      last.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_create_expires_after$/)'
  - id: case-list-limit-order
    why: Collection list uses api_base unchanged; resource file list appends encoded container_id/files. Include
      after, limit and order when not None, stringify limit, then let extra_query override any key; empty strings
      and zero survive.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_list_limit_order$/)'
  - id: case-retrieve-delete-id
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-containers/retrieve-delete-id.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_retrieve_delete_id$/)'
  - id: case-file-list-and-content
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-containers/file-list-and-content.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::containers_cases::case_[0-9]+_file_list_and_content$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_containers.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_containers*")"
      && grep -lq 'openai_containers' tools/oracle/fuzz/corpus/helper_case/openai_containers* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_containers$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_containers)"
      && grep -q 'decode_container_reply' crates/betterlite-openai/fuzz/fuzz_targets/openai_containers.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_containers_corpus$/)'
