id: B522
title: OpenAI containers and container files
description: >-
  Add typed ContainerCreate/ContainerReply/ContainerFile records and provider create/list/retrieve/delete, file
  list and content methods. Use the source query-preserving path join for resource IDs; the initial get_complete_url
  unconditionally appends /containers. Preserve cursor/order fields. Container file uploads and public handlers
  are B094.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/containers/transformation.py:
  OpenAIContainerConfig.__init__ L82-L83; OpenAIContainerConfig.get_supported_openai_params L85-L92; OpenAIContainerConfig.map_openai_params
  L94-L100; OpenAIContainerConfig.validate_environment L102-L113; OpenAIContainerConfig.get_complete_url L115-L129;
  OpenAIContainerConfig.transform_container_create_request L131-L150; OpenAIContainerConfig.transform_container_create_response
  L152-L174; OpenAIContainerConfig.transform_container_list_request L176-L207; OpenAIContainerConfig.transform_container_list_response
  L209-L217; OpenAIContainerConfig.transform_container_retrieve_request L219-L234; OpenAIContainerConfig.transform_container_retrieve_response
  L236-L244; OpenAIContainerConfig.transform_container_delete_request L246-L265; OpenAIContainerConfig.transform_container_delete_response
  L267-L275; OpenAIContainerConfig.transform_container_file_list_request L277-L310; OpenAIContainerConfig.transform_container_file_list_response
  L312-L320; OpenAIContainerConfig.transform_container_file_content_request L322-L343; OpenAIContainerConfig.transform_container_file_content_response
  L345-L354; OpenAIContainerConfig.get_error_class L356-L368. litellm/llms/openai/containers/utils.py: join_container_api_base_path
  L8-L20.


  Container response-cost metadata delegates to B068 StandardBuiltInToolCostTracking through a supplied cost projection;
  do not implement billing arithmetic here.


  Named case contracts: base_with_v1: join_container_api_base_path appends a leading-slash suffix to the existing
  URL path with its trailing slashes stripped, preserving query and fragment through httpx.URL. It never adds a
  /v1 segment; cover an Azure /openai/v1/containers?api-version=v1 base. base_with_containers: Resolve api_base
  then litellm.api_base then OPENAI_BASE_URL then OPENAI_API_BASE then https://api.openai.com/v1 using truthiness.
  Strip trailing slashes and append /containers even if the base already ends in /containers; do not deduplicate
  the collection suffix. create_expires_after: Advertise name, expires_after, file_ids, extra_headers; map params
  by copying all keys regardless of drop_params. Create removes only extra_headers; an optional name overrides the
  required name because options are expanded last. list_limit_order: Collection list uses api_base unchanged; resource
  file list appends encoded container_id/files. Include after, limit and order when not None, stringify limit, then
  let extra_query override any key; empty strings and zero survive. container_auth_chain: Resolve api_key then litellm.api_key
  then litellm.openai_key then OPENAI_API_KEY using truthiness; overwrite the exact Authorization key with Bearer
  <resolved key>, including Bearer None when unresolved. container_cost_header: Only create adds B068 code-interpreter
  cost for sessions=1/provider=openai under _hidden_params.additional_headers.llm_provider-x-litellm-response-cost,
  preserving existing hidden entries. container_response_error: Metadata responses validate the operation-specific
  ContainerObject, ContainerListResponse, DeleteContainerResult or ContainerFileListResponse. Content returns raw_response.content
  unchanged; get_error_class raises BaseLLMException with the supplied status/message/headers.


  Reuse B500 config loading and B129 secret resolution for the key/base chains; B171 owns encode_url_path_segment
  and B2202 owns BaseLLMException.


  Write standalone Rust test openai_containers_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_containers_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-openai/src/containers.rs with adjacent tests under containers/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function containers_cases in betterlite-openai with these exact named cases (one per oracle file):
  base_with_v1, base_with_containers, create_expires_after, list_limit_order, retrieve_delete_id, file_list_and_content,
  container_auth_chain, container_cost_header, container_response_error. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_containers* using HelperCase: kind: helper
  and the externally tagged openai_containers variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_openai_containers that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_container_reply consumes container and file-list JSON response bytes in crates/betterlite-openai/src/containers.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_containers.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_containers.
  The adjacent test replays_the_openai_containers_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 237 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 220 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 675 planned, 675 maximum changed lines.
