id: B3797
title: Straiker delivery and intervention decisions
description: >-
  Build webhook delivery, retry/fallback behavior and v1/v3 intervention application in
  betterlite-guardrails. Implement bounded webhook delivery with exponential backoff, retry logic
  for transient failures, and fail-open/fail-closed fallback on unreachability. Parse v1 and v3
  webhook responses, record verbose logging to hidden params, and apply block or intervention
  decisions to request and response phases. Preserve in-memory TTL cache for v3 replay blocking
  to prevent re-scoring conversations that Straiker has already blocked; distinguish replacement
  content from block errors. Build config model resolution and event hook registration with
  validation: api_key must be non-empty (ValueError on empty), unreachable_fallback must be
  'fail_open' or 'fail_closed' (ValueError otherwise), api_version must be None, 'v1' or 'v3'
  (ValueError on invalid), format_hint must be 'anthropic.messages' or 'openai.chat' or None
  (ValueError on invalid). Detect v3 API key by sk_agt_ prefix and route to /api/v3/detect;
  log warning if v3 key configured with api_version='v1'. Clamp numeric fields: max_retries to
  0+ int, initial_backoff to 0.0+ float, max_backoff to max(initial_backoff, configured value),
  timeout to float (default 5.0). Implement HTTP POST with timeout and retry limits, JSON
  serialization with payload-size validation, and error classification for retryable (408, 429,
  5xx, network) vs permanent failures. Handle both v1 structured webhook envelope delivery and
  v3 provider-request-passthrough mode with different response parsing. Preserve fail-on-error
  boolean (default true) that allows errors to pass through without blocking.

  Reuse B3795 for context/identity/usage/failure helpers and webhook types; B3796 for v3 payload
  and response building; B173 for pooled HTTP `post`; and B2226 for `InMemoryCache` with TTL.
  The helper operation straiker_webhook_delivery is already registered; add behavior oracle cases
  for every verdict decision, retry path, v3 replay blocking scenario, and configuration validation.
