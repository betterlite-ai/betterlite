dod:
  - text: "Config validation: api_key empty raises ValueError; unreachable_fallback not in ('fail_open', 'fail_closed') raises ValueError; api_version not in (None, 'v1', 'v3') raises ValueError; format_hint not in (None, 'anthropic.messages', 'openai.chat') raises ValueError."
    proof: [api-key-validation-cases, fallback-validation-cases, api-version-validation-cases, format-hint-validation-cases]
  - text: "V3 key prefix detection: api_key starting with sk_agt_ enables v3 routing; sk_agt_ key with api_version='v1' logs warning and routes to v3; legacy v1 configs without v3 key prefix use api_version as-is."
    proof: [v3-key-detection-cases]
  - text: "Field defaults and clamping: timeout defaults to 5.0 float; max_retries clamped to max(0, int value); initial_backoff clamped to max(0.0, float value); max_backoff clamped to max(initial_backoff, float value); unreachable_fallback defaults to 'fail_closed'; fail_on_error defaults to true; max_payload_bytes defaults to 524288; verbose defaults to false."
    proof: [field-defaults-cases, field-clamping-cases]
  - text: Webhook URL construction selects v3 detect path for v3 API version or v1 webhook path for v1, with api_base manipulation.
    proof: [webhook-url-cases]
  - text: Headers include Authorization Bearer token, Content-Type application/json, and optional X-Straiker-Webhook-Format header for v1; custom headers are added without overwriting reserved headers.
    proof: [header-composition-cases]
  - text: Payload serialization validates max_payload_bytes, handles JSON encoding errors gracefully, and retries on transient failures with exponential backoff.
    proof: [payload-delivery-cases]
  - text: HTTP timeouts, max_retries, initial_backoff and max_backoff configuration values are honored for every delivery attempt.
    proof: [retry-configuration-cases]
  - text: Status errors classify retryable (408/429/5xx) vs permanent failures; network and timeout errors are retryable; JSON decode errors are permanent.
    proof: [error-classification-cases]
  - text: V1 response parsing validates schema structure and delegates to StraikerWebhookResponse pydantic parsing; v3 response parsing calls _v3_response helper.
    proof: [response-parsing-cases]
  - text: Block verdicts raise GuardrailRaisedException for request phase or ModifyResponseException for response phase with guardrail_name and message.
    proof: [block-exception-cases]
  - text: GUARDRAIL_INTERVENED verdict applies intervention when texts are present and request is not streamed; streamed responses block instead of intervening.
    proof: [intervention-decision-cases]
  - text: Verbose mode records action and turn_id to response._hidden_params['straiker'] for every successful webhook response.
    proof: [verbose-logging-cases]
  - text: Fail-open fallback is applied when unreachable AND unreachable_fallback is fail_open, or when fail_on_error is False; all other errors block by default.
    proof: [fallback-behavior-cases]
  - text: V3 in-memory cache stores block messages by scope (principal and session) and conversation prefix; replay blocking returns the cached message without contacting Straiker.
    proof: [v3-replay-blocking-cases]
  - text: V3 session resolution uses envelope session_id, request data session, or derives a hash from principal and conversation preamble.
    proof: [v3-session-resolution-cases]
  - text: Blocked turns are cached only when input_type is request, prefixes are present and parsed.blocked_by is truthy; only these blocks survive replay.
    proof: [v3-replay-cache-cases]

