oracle_cases: []

deviations:
  - what: Payload size validation occurs before HTTP transmission; oversized payloads are rejected with an error message instead of being truncated or split across requests.
    why: LiteLLM rejects payloads exceeding max_payload_bytes; betterlite follows this behavior to fail fast and avoid partial delivery of corrupted envelopes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/straiker/straiker.py#L1057-L1061
  - what: Verbose logging is applied after successful response parsing; if parsing fails, the error message is logged but the request/response payloads are not logged to hidden params.
    why: LiteLLM only records a successful verdict action to hidden params; betterlite follows this pattern to avoid leaking partial Straiker responses into observability systems on errors.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/straiker/straiker.py#L1131-L1145
  - what: Streamed response intervention blocks instead of applying text replacements, even when texts are present in the verdict.
    why: LiteLLM cannot safely apply masked content to a stream already in flight; betterlite preserves this restriction to avoid partial block behavior where early chunks are modified but later chunks are not.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/straiker/straiker.py#L1354-L1361

out_of_scope:
  - "Guardrail initialization and configuration loading are owned by B104 (CustomGuardrail framework)."
  - "Webhook context and identity extraction are owned by B3795 (Straiker records)."
  - "V3 payload and response building are owned by B3796 (Straiker v3 envelopes)."
  - "HTTP request pooling, client creation and transport are owned by B173 (HTTP client)."
  - "In-memory TTL cache implementation is owned by B2226 (context cache)."
  - "Session ID retrieval from request data (get_session_id_from_request_data) is owned by B3664 (guardrail records)."
  - "Request-to-GuardrailRaisedException or ModifyResponseException conversion is owned by U1 (framework exception handling)."

pitfalls:
  - "Payload serialization must use _json_default for non-standard types like datetime; missing this handler will cause JSON encode errors and permanent failure."
  - "Retryable error classification must check status codes (408, 429, 5xx), RequestError/TimeoutError types and Timeout; misclassifying a permanent error as retryable will exhaust retries on unrecoverable failures."
  - "V3 session scoping uses principal (user or key) and session together as a cache key; a request with neither principal nor session (guest calls) will have an empty scope and never match replay blocks."
  - "Replay blocking only applies to request phase (input_type == request); response-phase blocks are never cached, so the same response text will be sent again on retry."
  - "Blocked-by controls are only cached when parsed.blocked_by is truthy; a block without controls (from a kill switch or state) will not be cached and will re-contact Straiker on replay."
  - "TTL cache semantics depend on B2226's implementation; verify that get_cache and set_cache use the same TTL window (V3_BLOCKED_TURN_TTL_SECONDS) and that cache keys are scoped to avoid cross-principal collisions."
  - "Fail-on-error boolean short-circuits fail-open logic; even when unreachable_fallback is fail_open, fail_on_error False will allow the request through, so the precedence is (fail_on_error || (unreachable && fallback_open))."
  - "API version selection from key prefix (sk_agt_ → v3) may log a warning if a v3 key is configured with api_version v1; this warning must be output through verbose_proxy_logger so operators are aware of the routing change."
  - "X-Straiker-Webhook-Format header is only sent for v1 API; v3 requests must not include it even if it appears in custom_headers, so reserved header filtering must exclude it from custom headers."

