    why: _encode_created_container_id and the async acreate_container wrapper (executor, context copy, await when a coroutine comes back, exception_type on error).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/containers/main.py#L126-L284
    why: create_container overloads and body, from the mock short circuit to the encode step.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/containers/main.py#L288-L353
    why: Async alist_containers wrapper.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/containers/main.py#L356-L486
    why: list_containers overloads and body.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/containers/utils.py#L97-L158
    why: encode_container_id_in_response, the only post-processing create applies (owned by B3361, read for the call).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L574-L577
    why: Call type strings create_container, acreate_container, list_containers, alist_containers.
dod:
  - text: create_container returns a mock_response (JSON string or object) as a ContainerObject before provider lookup, HTTP and id encoding; a body that does not decode is an error.
    proof: [mock-tests]
  - text: >-
      list_containers returns a mock_response as a ContainerListResponse the same way, with no id encoding.
    proof: [mock-tests]
  - text: >-
      create_container fails with "container operations are not supported for <provider>" when no provider config exists, and list_containers fails with "Container provider config not found for provider: <provider>".
    proof: [create-tests, list-tests]
  - text: create_container extracts and maps the create params, logs them with call type "create_container" and litellm_call_id, calls the B3364 create handler with the name, params, headers and timeout, and never sends extra_query.
    proof: [create-tests]
  - text: create_container encodes the returned container id through B3361 using litellm_metadata and extra_body, and leaves a direct call without routing hints unchanged.
    proof: [create-tests]
  - text: list_containers extracts after, limit, order, extra_headers and extra_query, logs with call type "list_containers", calls the B3364 list handler with them and the timeout, and returns the result with its ids untouched.
    proof: [list-tests]
  - text: A timeout of zero or none falls back to the default request timeout on both operations, and the default call timeout is 600 seconds.
    proof: [create-tests, list-tests]
  - text: acreate_container and alist_containers produce the same results as the blocking variants through the async handlers, and acreate_container encodes the id after the handler finishes.
    proof: [async-tests]
  - text: Every failure on both operations reaches B185's exception mapping with model "" and the call's custom_llm_provider.
    proof: [create-tests, list-tests, async-tests]
checks:
  optional: []
  commands:
    - id: create-tests
      why: create_container tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_create_list::(.*::)?create_/)'
    - id: list-tests
      why: list_containers tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_create_list::(.*::)?list_/)'
    - id: mock-tests
      why: mock_response short circuit tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_create_list::(.*::)?mock_/)'
    - id: async-tests
      why: async operation tests are missing or fail
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::container_create_list::(.*::)?async_/)'
oracle_cases: []
deviations:
  - what: There is no _is_async flag, run_in_executor wrapper or coroutine-or-value return type. The blocking and async operations are separate Rust functions.
    why: Rust has no Union return type, and a worker thread plus context copy adds nothing to an async fn.
  - what: The @client decorator work (litellm_logging_obj creation, callbacks, caching) is not done here. The caller passes the logging state in.
    why: B012 owns the decorator; this task only uses the object it produces.
out_of_scope:
  - "retrieve_container, delete_container and their async forms: B3370 owns them."
  - "list_container_files, upload_container_file and the endpoint-factory file operations: B3366, B3367 and B3368 own them."
  - "create and list HTTP execution (container_create_handler, container_list_handler): B3364 owns them."
  - "decode_managed_container_id_for_request, the optional-param helpers, encode_container_id_in_response and get_provider_container_config: B3361 owns them; this task calls them."
  - "ContainerObject, ContainerListResponse and the optional-param record types: B3360 owns them."
  - "GenericLiteLLMParams: B010 owns it. The @client decorator: B012 owns it."
  - "Proxy routes for /v1/containers: B094 and its proxy parts register them. No route reaches this code yet, so there are no HTTP oracle cases."
pitfalls:
  - >-
    The two no-config errors differ in wording ("container operations are not supported for X" on create, "Container provider config not found for provider: X" on list); keep each text exact.
  - >-
    mock_response is read with kwargs.get, not popped, so it still reaches GenericLiteLLMParams and logging on the non-mock path of other calls; here the mock branch simply returns first.
  - create ignores extra_query and list ignores extra_body; do not wire either through.
  - The create handler gets the id-encoded result only after the handler returns; list never encodes, so a routed list returns raw provider ids.
  - The expression timeout or DEFAULT_REQUEST_TIMEOUT treats 0 like none, so a zero timeout becomes the REQUEST_TIMEOUT default (6000 seconds), not an immediate timeout.
  - The provider name is parsed into an LlmProviders value before the config lookup, so an unknown name fails there and a known non-container provider (anthropic) fails with the no-config text.
  - Create passes the request params to logging as both optional_params and inside litellm_params next to litellm_call_id; list does the same with its own params. Do not log the mapped params for list.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
