id: B3369
title: Container create and list operations
description: >-
  Build the public create and list container operations of litellm/containers/main.py in betterlite-core, as module
  api::container_create_list (crates/betterlite-core/src/api/container_create_list.rs, with tests in
  container_create_list/tests.rs). Retrieve, delete and the file operations are other tasks; this one owns
  create_container, acreate_container, list_containers, alist_containers and the helper _encode_created_container_id.
  The module does no HTTP itself. It prepares the call and hands it to B3364's container_create_handler, acontainer_create_handler, container_list_handler and acontainer_list_handler.

  Shape. Define ContainerCreateCall (name, expires_after as an optional JSON map, file_ids as an optional list of strings,
  timeout, api_key, api_base, api_version, custom_llm_provider, extra_headers, extra_query, extra_body, mock_response,
  litellm_metadata, litellm_call_id and an extra map for the remaining keyword arguments) and ContainerListCall (after,
  limit, order and the same shared fields). custom_llm_provider defaults to "openai". timeout defaults to 600 seconds.
  Each function also takes the per-call logging state (B247) and a default request timeout in seconds. No config constant
  is read here: the route passes betterlite_config::env_integer::timeout::RequestTimeout (field seconds, REQUEST_TIMEOUT, 6000 by default, owned by B198) resolved once at startup. create_container and list_containers use container_create_handler and container_list_handler and acreate_container and
  alist_containers use acontainer_create_handler and acontainer_list_handler; the two variants share one private preparation step, so the logic is written once.
  The Python _is_async flag and the run_in_executor wrapper have no Rust form: the async functions are plain async fns.
  ContainerOpError is this module's error enum and it carries every failure to B185's exception mapping (model "",
  the call's custom_llm_provider).

  Create, in order. (1) If mock_response is set, parse it (a string is parsed as JSON first) into a ContainerObject with B3360's
  decoder and return it at once: no provider lookup, no HTTP, no id encoding. A body that fails to decode is an error. (2) Build
  GenericLiteLLMParams from api_key, api_base, api_version and the extra map (B010 owns that type). (3) Parse custom_llm_provider
  into a provider id; an unknown name is an error. (4) Call B3361's provider-config lookup; None gives the error text
  "container operations are not supported for <provider>". (5) Take the create optional params from B3361
  (get_requested_container_create_optional_param over name, expires_after, file_ids, extra_headers, extra_body and the extra map),
  then B3361's get_optional_params_container_create for the provider. (6) Pre-call logging through B247 update_from_kwargs with
  model "", optional_params equal to the create request params, and litellm_params holding litellm_call_id plus those same
  params, then set the logging call type to "create_container". (7) Call B3364's container_create_handler (acontainer_create_handler when async) with name, the request params, the
  config, the litellm params, the logging object, extra_headers and the timeout, where a timeout of zero or none means the default
  request timeout. extra_query is accepted but never sent on create. (8) Pass the returned ContainerObject through B3361's
  encode_container_id_in_response with the provider, litellm_metadata and extra_body. For the async variant this is the Python
  _encode_created_container_id: await first, then encode.

  List follows the same steps with these differences. The mock body decodes as ContainerListResponse. The no-config error text is
  "Container provider config not found for provider: <provider>". The optional params come from B3361's
  get_requested_container_list_optional_param (after, limit, order, extra_headers, extra_query) and are not mapped through the
  provider. Logging uses those params and the call type "list_containers". B3364's container_list_handler (acontainer_list_handler when async) receives after, limit, order,
  extra_headers, extra_query and the timeout. The result is returned as is: list responses never get ids encoded and extra_body
  is ignored.

  Tests (tests.rs) use stub handlers behind the B3364 and B3361 seams. Name the tests create_*, list_*, mock_* and async_* so
  each check below can filter on its prefix.
scope:
  paths:
    - crates/betterlite-core/src/api/container_create_list.rs
    - crates/betterlite-core/src/api/container_create_list/**
  lint_tables: false
references:
