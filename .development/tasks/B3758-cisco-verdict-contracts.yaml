id: B3758
title: Cisco verdict decoding and configuration contracts
description: >-
  Build Cisco AI Defense verdict envelope unwrapping, action normalization, sanitized payload
  extraction, entity-type counting and typed configuration schema. The verdict unwrapper locates
  decision-bearing dicts at various nesting levels (chat endpoint returns flat verdicts, MCP wraps
  under result, legacy SDKs may nest under data/inspection/ai_defense/aiDefense) and extracts fields
  including is_safe, action, rules, classifications, etc. Action normalization maps Cisco vocabulary
  (deny/denied/block/blocked/reject/rejected/unsafe/malicious to block; redact/redacted/sanitize/sanitized/mask
  to redact; allow/allowed/safe/ok to allow) with case-insensitive matching, warning and defaulting to block
  for unrecognized values.

  Sanitized payload extraction pulls text, messages and MCP arguments from multiple key variants
  (both snake_case and camelCase) and nesting levels (top-level and under result/data containers,
  plus inside sanitized_payload/modified_payload wrappers). Entity-type counting aggregates per-type
  detections across rule lists for audit logging. JSON-RPC error detection finds error fields inside
  HTTP 200 responses (at top level or under result) to trigger fallback_on_error policy. MCP sanitized
  arguments are extracted early from params.arguments or equivalent nested paths because the verdict
  engine consumes them before selecting redaction surfaces.

  Configuration provides api_key (required, reads CISCO_AI_DEFENSE_API_KEY), api_base (optional, default
  https://us.api.inspect.aidefense.security.cisco.com, reads CISCO_AI_DEFENSE_API_BASE), inspection_type
  (chat or mcp, default chat, selects /api/v1/inspect/chat or /api/v1/inspect/mcp endpoint), inspect_path
  (optional path override), enabled_rules (optional list of rule names with optional entity_types per rule),
  on_flagged_action (block or monitor, default block), fallback_on_error (allow or block, default block),
  timeout (1-60 seconds, default 10.0, clamped with warning on out-of-range values), and integration_profile_id/version/tenant_id/type
  fields for tenant-aware scanning.

