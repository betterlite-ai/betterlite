deviations:
  - what: Cisco configuration returns error messages with betterlite's own wording, not LiteLLM's.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status and code unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense.py#L1250-L1273
out_of_scope:
  - The configuration schema base class and its schema integration (needs F's concrete contract owner);
    this task provides the Cisco-specific model extending it.
  - Shared scan/verdict record definitions (B3759 owns _ScanContext and _CiscoVerdict shared records).
  - Verdict enforcement and final logging (B3760 owns _finalize_inspection, _apply_redaction and logging).
  - Redaction helpers that call verdict extraction (B3757 owns _redact_chat_input and _redact_chat_output).
  - MCP hooks and the verdict engine lifecycle (B3762 owns _inspect_chat, async hooks and B3761 owns MCP envelope projection).
pitfalls:
  - >-
    _unwrap_verdict_envelope checks decision fields in order: top level, then each of (result, data, inspection, ai_defense, aiDefense), then result nesting. The first match containing any decision field wins; empty nested dicts cannot mask a valid top-level verdict.
  - >-
    _has_decision_fields must return true on the first matching key, not accumulate or require multiple keys; the decision-field set includes is_safe, action, rules, classifications, sanitized_text and others.
  - >-
    Action normalization uses case-insensitive matching (strip and lowercase) before comparing. deny/denied/block/blocked/reject/rejected/unsafe/malicious map to block, redact/redacted/sanitize/sanitized/mask to redact, allow/allowed/safe/ok to allow. Unrecognized values warn with the raw string and default to block.
  - >-
    _extract_sanitized_messages searches containers in order (top-level, then under result and data) for sanitized_messages, sanitizedMessages, modified_messages, modifiedMessages keys, filters to dicts only, and checks for messages inside sanitized_payload or modified_payload before moving to the next container.
  - >-
    _extract_sanitized_mcp_arguments checks params.arguments at top level and nested containers first, then sanitized_payload or modified_payload nesting, then payload.arguments as fallback. The returned dict must be a copy (not the original reference).
  - >-
    Entity-type counting loops through rules, skipping non-dicts, then entity_types per rule (skipping non-strings), initializing the counts dict empty and returning None for zero counts. Do not error on malformed data.
  - >-
    CISCO_AI_DEFENSE_API_KEY must be marked as SecretString, never logged or shown in Debug output, and used only to construct the X-Cisco-AI-Defense-API-Key header value.
  - >-
    Timeout clamping must log a warning when values fall outside 1-60 seconds, then clamp to the valid range. Do not error or silently ignore misconfiguration.
