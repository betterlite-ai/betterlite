dod:
  - text: >-
      Verdict envelope unwrapping returns the first dict containing any decision field (is_safe, action, rules,
      classifications, sanitized_text, etc.) from top level or nested under result, data, inspection, ai_defense,
      or aiDefense; empty dicts do not mask matches at earlier nesting levels.
    proof: [oracle, verdict-tests]
  - text: >-
      Action normalization maps deny/denied/block/blocked/reject/rejected/unsafe/malicious to block, redact/redacted/sanitize/sanitized/mask
      to redact, and allow/allowed/safe/ok to allow via case-insensitive matching; unknown actions warn
      with the raw value and default to block.
    proof: [oracle, verdict-tests]
  - text: >-
      JSON-RPC error detection finds error object at top level or nested under result.error in HTTP 200
      responses and returns it so callers apply fallback_on_error policy.
    proof: [oracle, verdict-tests]
  - text: >-
      Sanitized text extraction returns the first non-empty sanitized_text or sanitizedText value found
      at top level or under result, or None if absent.
    proof: [oracle, verdict-tests]
  - text: >-
      Sanitized messages extraction returns the first non-empty array found under sanitized_messages, sanitizedMessages,
      modified_messages, modifiedMessages keys (top-level and under result/data), or under messages field
      inside sanitized_payload/modified_payload, filtering to dicts only; returns None if absent.
    proof: [oracle, verdict-tests]
  - text: >-
      Sanitized MCP arguments extraction returns a dict copy of params.arguments found at top level or
      nested under result/data containers, or from nested params inside sanitized_payload/modified_payload,
      or direct arguments field at payload level; returns None if absent.
    proof: [oracle, verdict-tests]
  - text: >-
      Entity-type count extraction aggregates detections per rule, counting each string-type entity_type
      value per rule and returning a dict mapping entity type to occurrence count, or None if no counts.
    proof: [verdict-tests]
  - text: >-
      Configuration loads api_key (required, reads CISCO_AI_DEFENSE_API_KEY env, marks as SecretString),
      api_base (optional, reads CISCO_AI_DEFENSE_API_BASE env, default https://us.api.inspect.aidefense.security.cisco.com),
      inspection_type (default chat, enum chat/mcp), enabled_rules (optional list of rule names with optional entity_types),
      on_flagged_action (default block, enum block/monitor), fallback_on_error (default block, enum allow/block),
      timeout (default 10.0, clamped to 1-60 seconds with warning), and inspect_path plus integration_profile_id/version/tenant_id/type
      fields.
    proof: [verdict-tests, config-load]

