id: B687
title: Azure thread creation and retrieval
description: >-
  Port Azure thread create/retrieve with the api-version client delta, reusing B520 records and B686 client preparation.
  B697 owns message append/list and attachments; no remote thread delete is exposed by the pin.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/assistants.py:
  AzureAssistantsAPI.async_create_thread L425-L457; AzureAssistantsAPI.create_thread L462-L476; AzureAssistantsAPI.create_thread
  L479-L493; AzureAssistantsAPI.create_thread L497-L553; AzureAssistantsAPI.async_get_thread L555-L580; AzureAssistantsAPI.get_thread
  L585-L598; AzureAssistantsAPI.get_thread L601-L614; AzureAssistantsAPI.get_thread L618-L656.


  Named case contracts: thread_create: Call B686 client preparation, then beta.threads.create. Include messages/metadata
  only when not None, retaining []/{}; no other fields or default message are added. Project response.dict() through
  Thread.model_validate, unlike OpenAI B520 four-field construction; retain fields accepted by that shared model
  and preserve validation failures. thread_retrieve: Call beta.threads.retrieve(thread_id=thread_id) and validate
  its full dict as Thread. No extra query/pagination inputs, no remote delete operation and no local error catch.
  assistants_beta_default: OpenAI-Beta: assistants=v2 is supplied for thread create/retrieve by the same SDK namespace
  used in B519/B520/B527; Azure endpoint/api-version come from B686/B531. azure_thread_async_flags: Only literal
  True acreate_thread/aget_thread selects async; all branches forward the same B686 client inputs and preserve its
  supplied-client and ignored-argument behavior. Call failures propagate; response validation runs after successful
  SDK return.


  Implement crates/betterlite-azure/src/azure_thread_messages.rs with adjacent tests under azure_thread_messages/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_thread_messages_cases in betterlite-azure with these exact named cases (one per oracle
  file): thread_create, thread_retrieve, assistants_beta_default, azure_thread_async_flags. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_thread_messages* using HelperCase: kind:
  helper and the externally tagged azure_thread_messages variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_thread_messages that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 201 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 180 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 545 planned, 550 maximum changed lines.
