id: B687
title: Azure thread creation and retrieval
description: >-
  Port Azure thread create/retrieve with the api-version client delta, reusing B520 records and B686 client preparation.
  B697 owns message append/list and attachments; no remote thread delete is exposed by the pin.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/assistants.py:
  AzureAssistantsAPI.async_create_thread L425-L457; AzureAssistantsAPI.create_thread L462-L476; AzureAssistantsAPI.create_thread
  L479-L493; AzureAssistantsAPI.create_thread L497-L553; AzureAssistantsAPI.async_get_thread L555-L580; AzureAssistantsAPI.get_thread
  L585-L598; AzureAssistantsAPI.get_thread L601-L614; AzureAssistantsAPI.get_thread L618-L656.


  Implement crates/betterlite-azure/src/azure_thread_messages.rs with adjacent tests under azure_thread_messages/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_thread_messages in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_thread_messages_cases in betterlite-azure with these exact named cases (one per oracle
  file): thread_create, thread_retrieve. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response and captured
  upstream request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_thread_messages* using HelperCase: kind:
  helper and the externally tagged azure_thread_messages variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_thread_messages that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 201 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 63 behavior/config-test lines,
  63 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 391 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - crates/betterlite-azure/src/azure_thread_messages.rs
  - crates/betterlite-azure/src/azure_thread_messages/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_thread_messages.rs
  - tools/oracle/src/helpers/azure_thread_messages/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_thread_messages.py
  - tools/oracle/cases/helpers/providers/azure-thread-messages/**
  - tools/oracle/fuzz/corpus/helper_case/azure_thread_messages*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/assistants.py#L425-L656
  why: >-
    Own AzureAssistantsAPI.async_create_thread, AzureAssistantsAPI.create_thread, AzureAssistantsAPI.create_thread,
    AzureAssistantsAPI.create_thread, AzureAssistantsAPI.async_get_thread, AzureAssistantsAPI.get_thread, AzureAssistantsAPI.get_thread,
    AzureAssistantsAPI.get_thread. Other functions in this file remain with the owners listed below.
dod:
- text: 'thread create: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-thread-messages/thread-create.yaml.'
  proof:
  - case-thread-create
  - oracle
  - helper-python
- text: 'thread retrieve: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-thread-messages/thread-retrieve.yaml.'
  proof:
  - case-thread-retrieve
  - oracle
  - helper-python
- text: New azure_thread_messages seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-thread-create
    why: The thread-create behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_thread_messages_cases::case_[0-9]+_thread_create$/)'
  - id: case-thread-retrieve
    why: The thread-retrieve behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_thread_messages_cases::case_[0-9]+_thread_retrieve$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_thread_messages.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_thread_messages*")"
      && grep -lq 'azure_thread_messages' tools/oracle/fuzz/corpus/helper_case/azure_thread_messages* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_thread_messages$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/azure-thread-messages/thread-create.yaml
- tools/oracle/cases/helpers/providers/azure-thread-messages/thread-retrieve.yaml
