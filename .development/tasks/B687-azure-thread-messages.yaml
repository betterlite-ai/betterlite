checks:
  optional:
  - mutants
  commands:
  - id: case-thread-create
    why: Call B686 client preparation, then beta.threads.create. Include messages/metadata only when not None, retaining
      []/{}; no other fields or default message are added. Project response.dict() through Thread.model_validate,
      unlike OpenAI B520 four-field construction; retain fields accepted by that shared model and preserve validation
      failures.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_thread_messages_cases::case_[0-9]+_thread_create$/)'
  - id: case-thread-retrieve
    why: Call beta.threads.retrieve(thread_id=thread_id) and validate its full dict as Thread. No extra query/pagination
      inputs, no remote delete operation and no local error catch.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_thread_messages_cases::case_[0-9]+_thread_retrieve$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_thread_messages.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_thread_messages*")"
      && grep -lq 'azure_thread_messages' tools/oracle/fuzz/corpus/helper_case/azure_thread_messages* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_thread_messages$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-assistants-beta-default
    why: 'OpenAI-Beta: assistants=v2 is supplied for thread create/retrieve by the same SDK namespace used in B519/B520/B527;
      Azure endpoint/api-version come from B686/B531.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_thread_messages_cases::case_[0-9]+_assistants_beta_default$/)'
  - id: case-azure-thread-async-flags
    why: Only literal True acreate_thread/aget_thread selects async; all branches forward the same B686 client inputs
      and preserve its supplied-client and ignored-argument behavior. Call failures propagate; response validation
      runs after successful SDK return.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_thread_messages_cases::case_[0-9]+_azure_thread_async_flags$/)'
