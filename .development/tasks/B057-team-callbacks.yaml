id: B057
title: Team callback persistence and logging controls
description: >-
  Implement team callback add/delete with B1210 validation/audit helpers, B246 credential-family checks,
  B2304 encrypt_callback_vars/decrypt_callback_vars and B1231 contracts. B1211 owns get/disable_logging.
  Both routes first require a database (500, the CommonProxyErrors db_not_connected_error detail), then
  B124's unique team read. Missing teams use B1210's anti-enumeration helper: proxy admins see add400
  or delete404 with Team id = <id> does not exist.; all other callers see403 You do not have access to
  this team. B800 TeamAccess allows proxy admin or this team's org/team admin; denial precedes callback
  validation and credential decryption. No unrelated ordinary-user write is allowed.


  Add validates callback name/vars through B1210, normalizes missing/non-list metadata.logging to [],
  decrypts stored variables for comparison, checks conflicting span scopes, then for non-proxy-admins
  checks cross-entry credential-family ownership. Family errors are HTTP400 plain detail; span errors
  use the callback_config_error detail.error shape. Duplicate exact (callback_name, callback_type) pairs
  return400 bad_request_error, param callback_name and the message naming callback, team and event;
  other event types may coexist. Deep-copy before_metadata, append the typed callback dump, assign
  logging, run encrypt_callback_vars over the whole metadata, JSON-serialize, then B724 updates metadata
  including object_permission. A missing update result is400 with the different-team-id message.
  Await B801 cache refresh, then B1210 audit projection with litellm-changed-by, then return
  status=success and the updated row. Preserve encrypted-at-rest callback values in that row.


  Delete treats non-list logging as empty; remove every dict entry with an exact callback_name across
  event types, retaining malformed nondict entries and unrelated metadata. No match, including legacy
  callback_settings-only metadata, returns404 callback_name = <name> is not registered for team_id =
  <id>. Encrypt surviving metadata before JSON serialization/update with object_permission included.
  Missing update result returns404 with Error removing team callback. Cache refresh precedes audit,
  which precedes B1210 resolution of surviving success/failure callbacks. Return status success, message
  Callback <name> removed for team <id>, and team_id plus arrays (empty for absent callback lists).
  Neither route is transactional: update remains committed when refresh/audit/resolution fails.


  Each route's own except blocks preserve HTTPException and ProxyException unchanged. Add's other
  errors log an exception; delete logs ERROR plus DEBUG traceback. Both wrap others as500
  internal_server_error, message Internal Server Error, <error>, param error.param or string None.
  B865 wraps these source-decorated routes for management effects. There is no license check here.


  Build the production team_callbacks module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_callback_endpoints.py:
  add_team_callbacks (L258-L432; 134 source lines), delete_team_callback (L442-L577; 105 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/{team_id:path}/callback -> add_team_callbacks;
  DELETE /team/{team_id:path}/callback/{callback_name} -> delete_team_callback. For each route send a
  successful request, the exact missing-team/duplicate/missing-callback branches and scoped denial through
  B001 HttpCase. Compare full response and error envelopes; inspect encrypted metadata, cache and audit
  ordering, including failed post-write effects. litellm-changed-by is request attribution, not a response header.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Use POSTGRES_TEST_URL with testcontainers fallback. Seed hashed virtual keys and explicit
  owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  B1231 decodes AddTeamCallback; the route only mutates its typed metadata. Compare add/delete against
  the MIT server with fixture callback credentials and assert ciphertext in Postgres after either write.


  Sizing: 239 production, 310 table-driven Postgres/HTTP tests and 100 route wiring lines, 649 within
  a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
