    production fallback.
  - 'litellm/proxy/management_endpoints/team_callback_endpoints.py: B1210 owns _callback_config_error
    (L59-L60), _validate_team_callback (L63-L66), _redact_callback_secrets (L69-L92), _mask_sensitive_callback_vars
    (L95-L118), _resolve_team_callbacks (L121-L161), _log_audit_task_exception (L164-L176), _emit_team_callback_audit_log
    (L179-L225), _callback_error (L228-L233), _unknown_team_error (L236-L249).'
  - 'litellm/proxy/management_endpoints/team_callback_endpoints.py: B1211 owns disable_team_logging (L586-L716),
    get_team_callbacks (L725-L815).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Preserve secret redaction, team admin policy, audit event projection and update cache refresh.
