id: B057
title: Team callback persistence and logging controls
description: >-
  Implement team callback add/delete/get and disable_logging with B189/B246 callback validation and typed
  callback configurations. Preserve secret redaction, team admin policy, audit event projection and update
  cache refresh. Credentials use B061 encryption at rest; callback execution remains the logging pipeline.


  Build the production team_callbacks module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_callback_endpoints.py:
  add_team_callbacks (L258-L432; 134 source lines), delete_team_callback (L442-L577; 105 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /team/{team_id:path}/callback -> add_team_callbacks;
  DELETE /team/{team_id:path}/callback/{callback_name} -> delete_team_callback. For each route send a
  typed successful request, an invalid or missing target, and a caller lacking that route permission through
  B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session routes instead
  prove bad credentials or invalid/expired codes. Compare status, response model including null/absent
  fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by where read.
  Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls management
  error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 239 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  239 production, 136 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 440 changed lines estimated within a 450-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
