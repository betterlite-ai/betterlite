  - 'litellm/proxy/management_helpers/object_permission_utils.py: B817 owns _dedupe_preserving_order (L240-L248), _drop_stale_object_permission_mcp_servers (L374-L390), _drop_stale_object_permission_mcp_tool_permissions (L393-L405), _drop_stale_object_permission_mcp_identifiers (L408-L422), _flatten_resolved_mcp_server_ids (L425-L428), _resolve_team_allowed_mcp_servers (L431-L463), _get_allow_all_keys_server_ids (L466-L472), _get_all_mcp_server_ids (L475-L481), _existing_object_permission_mcp_servers (L484-L495).'
  - 'litellm/proxy/management_helpers/object_permission_utils.py: B818 owns enforce_all_proxy_mcp_servers_grant_is_admin_only (L498-L528), _get_grandfathered_key_mcp_server_ids (L531-L558), _get_team_allowed_mcp_servers (L561-L599), _extract_requested_mcp_server_ids (L602-L625), _extract_requested_mcp_access_groups (L628-L638), _extract_requested_mcp_toolsets (L641-L651), validate_key_mcp_servers_against_team (L654-L794), _validate_requested_toolsets (L797-L839), _extract_requested_vector_stores (L842-L851), validate_key_vector_stores_against_team (L854-L879), _extract_requested_search_tools (L882-L891), validate_key_search_tools_against_team (L894-L941).'
  - The MCP server registry and get_registry are B4731's; the callers pass its records in.
pitfalls:
  - The query filters on server_id, alias and server_name, while the match after it also accepts name; only a registry record can match by name.
  - Database matches don't stop registry matches. The source's docstring calls the database authoritative, but the code unites both passes.
  - Every requested identifier is in the answer, an unmatched one with an empty set; B817's team read keeps such identifiers and its cleanup drops them, so neither may lose the key.
  - Several IDs for one identifier is a normal answer here. B816 decides when that is a collision, and an exact server_id among them is never one.
  - A database error must return before the registry pass, so a caller never gets a map built from the registry alone.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
