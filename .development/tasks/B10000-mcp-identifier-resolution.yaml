dod:
  - text: >-
      identifier_matches is true for an identifier equal to a present server_id, alias, server_name or name, and false for one equal to
      none of them, with a missing name never matching.
    proof: [matcher-tests, oracle, helper-python]
  - text: >-
      resolve_identifiers_to_ids returns every identifier with the union of its database and registry IDs, keeps an empty set for an
      unmatched one, keeps several IDs for a shared alias, skips an empty server_id, and returns an empty map with no query for no
      identifiers; the lookup returns no rows without a client.
    proof: [resolver-tests]
  - text: A database error comes back as ResolveError before the registry is read.
    proof: [resolver-tests]
  - text: The oracle cases run the same records and identifiers through LiteLLM's matcher and betterlite's and agree.
    proof: [oracle, helper-python]
checks:
  optional: []
  commands:
    - id: matcher-tests
      why: the matcher tests are missing or an attribute is compared differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp_identifier_resolution::tests::matches_/)'
    - id: resolver-tests
      why: the resolver tests are missing, or the database and registry matches are not united, an empty server_id counts, or an error lets the registry run
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp_identifier_resolution::tests::resolve_/)'
    - id: helper-python
      why: the oracle adapter is untouched or fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10000.py tools/oracle/helpers/b10000)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
