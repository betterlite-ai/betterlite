id: B10000
title: Resolve MCP server identifiers to server IDs
description: >-
  Port LiteLLM's MCP identifier resolver, object_permission_utils.py L251-L318: `_mcp_server_identifier_matches`, `_get_db_mcp_servers_by_identifiers` and `_resolve_mcp_server_identifiers_to_ids`. A key, team or organization grant can name an MCP server by its server_id, alias, server_name or name, and the resolver turns each such identifier into the set of server IDs it matches, from the database and from the in-memory registry. Three tasks call it: B816's ambiguity check on changed mcp_tool_permissions keys (L352), B817's team allowed-server read (L458) and B818's grandfathering, team allowed-server and key-against-team checks (L553, L584, L708). Code goes in the new module `mcp_identifier_resolution` in betterlite-server (crates/betterlite-server/src/mcp_identifier_resolution.rs and its folder), with tests in `mcp_identifier_resolution/tests.rs`. It reads no config key and no environment variable.


  The matcher. `identifier_matches(names: &ServerNames<'_>, identifier: &str) -> bool`, where `ServerNames` borrows four optional strings: server_id, alias, server_name and name. It is true when the identifier equals one of the four that is present. A registry record (B6590's `betterlite_mcp::server_record::MCPServer`, whose fields hold server_id, name, alias and server_name) fills all four. A database row fills server_id, alias and server_name only, since LiteLLM_MCPServerTable has no name column and LiteLLM's getattr gives None there.


  The database lookup. `db_servers_by_identifiers(identifiers: &BTreeSet<String>, client: Option<PrismaClient<'_>>) -> Result<Vec<ServerRow>, ResolveError>` returns an empty list when there is no client or no identifier, and otherwise runs one query on "LiteLLM_MCPServerTable" for the rows whose server_id, alias or server_name is in the identifier list. Read only those three columns into `ServerRow`. Go through B726's `PrismaTableRepository` with the `MCPServerTable` binding and its read handle, the way mcp_rotation/tables.rs reads that table with a static SQL string.


  The resolver. `resolve_identifiers_to_ids(identifiers: &BTreeSet<String>, client: Option<PrismaClient<'_>>, registry: &[&MCPServer]) -> Result<BTreeMap<String, BTreeSet<String>>, ResolveError>`. No identifiers give an empty map without a query. Otherwise every identifier starts with an empty set. For each database row with a non-empty server_id, every identifier the row matches gains that server_id. Then for each registry record with a non-empty server_id, every identifier it matches gains its server_id. A database error returns before the registry is read. The registry is an argument in the shape B4731's get_registry returns, the records in registry order, so this task doesn't wait on the MCP registry. LiteLLM keys that dict by server_id (mcp_server_manager.py L2113, L2115, L2683, L3296), so its `identifier == registry_key` test and its `server_id or registry_key` fallback both come down to the record's server_id here. Until B4731 lands, B816's route callers pass an empty registry, and only database servers can collide.


  `ResolveError` is this module's error enum and wraps the database error with its source. The three functions and `ServerNames`, `ServerRow` and `ResolveError` are public. No `unwrap`, no `expect` outside tests.


  Tests in `mcp_identifier_resolution/tests.rs`. Names start with `matches_` for the matcher and `resolve_` for the lookup and the resolver. The resolver tests use a real database from B860's PostgresFixture over POSTGRES_TEST_URL, as mcp_rotation's tests do, and build registry records in the test. They cover: an identifier matched by a database row and by a registry record gets both IDs; an alias shared by two servers gets both IDs and is not rejected here; an identifier nothing matches keeps an empty set; no identifiers or no client gives no query; a row or record with an empty server_id adds nothing; a registry record matches by name while a row can't; a database error comes back as ResolveError and the registry is not read.


  The oracle adapter is operation b10000 and covers the matcher only, since the lookup and the resolver read the database and LiteLLM's module-level registry. Its input is `{"server": {...}, "identifier": "..."}`, where server holds any of server_id, alias, server_name and name, and its answer is `{"matches": <bool>}`. The Python side builds a types.SimpleNamespace with only the given attributes and calls `_mcp_server_identifier_matches` from litellm.proxy.management_helpers.object_permission_utils, so a missing attribute reads as None the way a database row's name does.
