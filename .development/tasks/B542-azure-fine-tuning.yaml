  commands:
  - id: case-training-type-default
    why: 'Before creating the client mutate create_fine_tuning_job_data: missing/falsy/non-dict extra_body becomes
      {}, and missing/null trainingType becomes integer 1 with debug logging. Preserve other dictionary fields;
      non-null trainingType values including 0/false/empty string survive.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_training_type_default$/)'
  - id: case-explicit-training-type
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-fine-tuning/explicit-training-type.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_explicit_training_type$/)'
  - id: case-create-cancel-retrieve
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-fine-tuning/create-cancel-retrieve.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_create_cancel_retrieve$/)'
  - id: case-azure-status-normalization
    why: 'Every individual job reply invokes B518 with is_azure=True: pending/notRunning become queued, canceled/canceling
      become cancelled and unknown statuses remain; null/missing organization_id becomes empty string and result_files
      becomes []. List is inherited from B518 and does not normalize each item.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_azure_status_normalization$/)'
