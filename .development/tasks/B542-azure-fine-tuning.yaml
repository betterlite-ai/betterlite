out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_fine_tuning in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/fine_tuning.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_fine_tuning.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Azure SDK clients inherit from OpenAI/AsyncOpenAI, so the isinstance check discards them too despite the nearby
  comment implying only non-Azure clients.
- trainingType is inserted before client initialization, so a failed credential setup still leaves the caller request
  mutated.
