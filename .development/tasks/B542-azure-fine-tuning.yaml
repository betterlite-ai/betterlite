id: B542
title: Azure fine-tuning jobs
description: >-
  Add Azure fine-tuning methods over the shared job types, including training_type defaults and Azure status/null
  normalization. Preserve input extra_body precedence and delegation to the inherited list operation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/fine_tuning/handler.py:
  AzureOpenAIFineTuningAPI._ensure_training_type L22-L32; AzureOpenAIFineTuningAPI.acreate_fine_tuning_job L34-L40;
  AzureOpenAIFineTuningAPI.acancel_fine_tuning_job L42-L48; AzureOpenAIFineTuningAPI.aretrieve_fine_tuning_job L50-L56;
  AzureOpenAIFineTuningAPI.create_fine_tuning_job L58-L99; AzureOpenAIFineTuningAPI.cancel_fine_tuning_job L101-L139;
  AzureOpenAIFineTuningAPI.retrieve_fine_tuning_job L141-L179; AzureOpenAIFineTuningAPI.get_openai_client L181-L204.


  Reuse _litellm_fine_tuning_job_from_response from B518 (litellm/llms/openai/fine_tuning/handler.py); its implementation
  remains with that prerequisite.


  Named case contracts: training_type_default: Before creating the client mutate create_fine_tuning_job_data: missing/falsy/non-dict
  extra_body becomes {}, and missing/null trainingType becomes integer 1 with debug logging. Preserve other dictionary
  fields; non-null trainingType values including 0/false/empty string survive. azure_status_normalization: Every
  individual job reply invokes B518 with is_azure=True: pending/notRunning become queued, canceled/canceling become
  cancelled and unknown statuses remain; null/missing organization_id becomes empty string and result_files becomes
  []. List is inherited from B518 and does not normalize each item. azure_finetune_client_rebuild: get_openai_client
  discards any instance of OpenAI or AsyncOpenAI, including their Azure subclasses, before calling B531; preserve
  that rebuild behavior. timeout/max_retries/organization are not forwarded, and the public methods supply no litellm_params.
  sdk_client_missing: Create/retrieve/cancel raise ValueError Azure OpenAI client is not initialized. Make sure
  api_key is passed or AZURE_API_KEY is set in the environment. when construction returns None. sdk_client_wrong_async:
  Only _is_async is True selects async, and wrong async clients raise ValueError OpenAI client is not an instance
  of AsyncOpenAI. Make sure you passed an AsyncOpenAI client.; sync calls use casts without a separate guard. sdk_error_passthrough:
  Create/cancel/retrieve pass the SDK payload/ID and return the normalized projection; upstream/validation errors
  propagate without catch or new status.


  Implement crates/betterlite-azure/src/fine_tuning.rs with adjacent tests under fine_tuning/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function fine_tuning_cases in betterlite-azure with these exact named cases (one per oracle file):
  training_type_default, explicit_training_type, create_cancel_retrieve, azure_status_normalization, organization_result_files_null,
  azure_finetune_client_rebuild, sdk_client_missing, sdk_client_wrong_async, sdk_error_passthrough. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_fine_tuning* using HelperCase: kind: helper
  and the externally tagged azure_fine_tuning variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_fine_tuning that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 167 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 205 production lines, 180 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 505 planned, 525 maximum changed lines.
