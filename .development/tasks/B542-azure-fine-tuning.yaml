  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_fine_tuning*")"
      && grep -lq 'azure_fine_tuning' tools/oracle/fuzz/corpus/helper_case/azure_fine_tuning* && cargo nextest run
