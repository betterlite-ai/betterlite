id: B601
title: Bedrock Converse tool choice and structured outputs
description: >-
  Add ConverseToolConfig and output-format translation, including tool choice, computer-use tool separation, JSON-mode
  synthetic tool and native structured-output capability. Port BedrockToolSpec validation into typed constructors
  without silently filtering required fields; preserve schema additionalProperties behavior.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig.map_tool_choice_values L739-L768; AmazonConverseConfig.get_supported_image_types L770-L771;
  AmazonConverseConfig.get_supported_document_types L773-L774; AmazonConverseConfig.get_supported_video_types L776-L777;
  AmazonConverseConfig.is_computer_use_tool_used L782-L793; AmazonConverseConfig._transform_computer_use_tools L795-L833;
  AmazonConverseConfig._separate_computer_use_tools L835-L866; AmazonConverseConfig._create_json_tool_call_for_response_format
  L868-L906; AmazonConverseConfig._supports_native_structured_outputs L909-L919; AmazonConverseConfig._add_additional_properties_to_schema
  L922-L955; AmazonConverseConfig._create_output_config_for_response_format L958-L996; AmazonConverseConfig._apply_tool_call_transformation
  L998-L1008; AmazonConverseConfig._translate_response_format_param L1201-L1269. litellm/types/llms/bedrock.py:
  BedrockToolSpec.__init__ L296-L322.


  Reuse AnthropicModelInfo.forced_tool_use_downgraded from B688 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicModelInfo.forced_tool_use_unsupported from B688 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: tool_choice_values: String none returns None only when global/per-call drop_params is literal
  True; otherwise UnsupportedParamsError400 Bedrock doesn't support tool_choice=none. To drop it from the call,
  set `litellm.drop_params = True. required ->B688 forced-use downgrade gate then {any:{}} or {auto:{}}; auto ->{auto:{}}.
  Every dict, even native-shaped, goes through same downgrade gate then function.name defaultempty via B231 sanitizer
  ->{tool:{name}}. Other strings/types raise UnsupportedParamsError400 Bedrock doesn't support tool_choice=<value>.
  Supported tool_choice values=['auto', 'required', json object]. To drop it from the call, set `litellm.drop_params
  = True. (same unmatched backtick). Unknown values are not silently dropped just because drop_params=true. computer_use_tool_split:
  Computer prefixes are computer_use_preview,computer_,bash_,text_editor_; model argument unused. Detector returnsfalse
  forNone and stopsfirstmatchingtype; missingtype ignored. Stable partition into computer/regular lists without
  copies. Transformer computer_ with function ->{type:<tooltype>,name:function.name defaultcomputer,**function.parameters
  default{}}; parameters can overwrite type/name. Other hostedtools copied; missing bash name defaults bash and
  text_editor defaults str_replace_editor, but missing computer_use_preview/direct computer name is not filled.
  Existing nameNone/empty retained; nonhosted tool copiedunchanged. json_mode_tool: Synthetic function namejson_tool_call;
  schemaNone ->{type:object,additionalProperties:true,properties:{}}, supplied schema usedas-is evenempty/nonobject.
  Include description onlytruthy. B2202 appends tools preserving prior order/duplicates. _apply_tool_call_transformation
  sets fake_stream=true only if model contains meta.llama3-3-70b-instruct-v1:0 and original stream is literal True.
  native_structured_output: response_format requires type key; text is no-op before schema extraction. response_schema
  key wins over json_schema envelope, includingNone; otherwise extract required json_schema.schema plus optionalname/description.
  Native capability + schemanon-None ->outputConfig.textFormat.type=json_schema,structure.jsonSchema.schema=JSON
  string with source spacing/Unicode escapes; optionalname/description included whenevernon-None includingempty.
  No synthetictools/fake_stream set onnative; json_mode=true alwaysafter nontexttranslation. additional_properties_recursion:
  Copy schema dictionaries and known branches; add additionalProperties=false only when type exactlyobject and key
  absent. Preserve true/None/pattern schemas alreadypresent. Traverse properties values, dictitems, $defs/definitions
  values and anyOf/allOf/oneOf list entries; non-dict entriespass unchanged. Do not traverse additionalProperties
  schemas,not,patternProperties or tupleitems. Implement iterative traversal under existing parsed-input bounds
  instead of recursion. unsupported_response_format: Capabilityfalse with schemanon-None appends json_tool_call,
  forces it only supports_tool_choice && !is_thinking_enabled && !B688 forced_tool_use_unsupported; sourcewarning/downgrade
  policy staysB688. Originalstream literal True setsfake_stream even when toolcannotbe forced. Any nontext format
  with noschema (includingjson_object) setsjson_mode=true withouttool injection/fake_stream or newerror; unknown
  type is not rejectedhere. Missingtype/malformedenvelope failures propagate. strict_tool_spec: BedrockToolSpec
  requires parameters.type, copies properties default{} andrequired default[] (explicitNone retained), discards
  all other schema keys except additionalProperties when supports_strict_tools and value non-None. Always emits
  toolSpec.inputSchema.json,name,description. Include strict only when supports_strict_tools and strict truthy;
  false/None omitted. Missing required type raisesKeyError; do not silently fabricate object or preserve extras.
  supported_media_types: Image list png,jpeg,gif,webp; document pdf,csv,doc,docx,xls,xlsx,html,txt,md; video mp4,mov,mkv,webm,flv,mpeg,mpg,wmv,3gp,
  exactorder. No URL retrieval belongs to these accessors.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-bedrock/src/converse_tools.rs with adjacent tests under converse_tools/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_tools_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): tool_choice_values, computer_use_tool_split, json_mode_tool, native_structured_output, additional_properties_recursion,
  unsupported_response_format, strict_tool_spec, supported_media_types. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_tools* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_tools variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_tools that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 294 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 265 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 680 planned, 700 maximum changed lines.
