  commands:
  - id: case-tool-choice-values
    why: The tool-choice-values behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::converse_tools_cases::case_[0-9]+_tool_choice_values$/)'
  - id: case-computer-use-tool-split
