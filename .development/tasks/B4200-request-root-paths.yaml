id: B4200
title: Resolve deployment and per-request root paths
description: >-
  Add configuration for scalar and per-request root paths to betterlite-config, then build a middleware layer in betterlite-server that routes requests under different URL path prefixes to the same deployment, preserving each client's prefix for outbound URL construction.

  The scalar SERVER_ROOT_PATH works for deployments that expose one prefix per instance. For a shared gateway serving multiple prefixes from a single instance, a prefix list approach lets the router distinguish requests by their original path prefix and preserve it in URLs the gateway emits. The middleware consults the normalized prefix list per request and updates scope["root_path"] before routing, so Starlette's built-in base URL reconstruction puts outbound URLs (MCP discovery resources, 401 challenge metadata) under the prefix the client used to reach the gateway.

  Add SERVER_ROOT_PATH (scalar, defaults to "") and SERVER_ROOT_PATHS (comma-separated prefix list, defaults to "") to betterlite-config's general_settings section and load them through the environment. The scalar fallback is owned here; get_request_root_path has no dependency on the utility umbrella task.

  Build the middleware in betterlite-server. normalize_root_paths trims whitespace and trailing slashes, drops empty entries, warns and drops missing-leading-slash and bare-root entries, deduplicates and sorts longest first with stable ties. get_request_root_path returns the effective root_path for the current request, reading from a ContextVar stashed by the middleware or falling back to the scalar root. PerRequestRootPathMiddleware.__call__ matches the request path against the normalized prefixes on a whole-segment boundary; a matching prefix replaces scope["root_path"], an unmatched request retains it, and the original path remains available.

  The middleware handles HTTP and WebSocket scopes; other scopes pass through untouched. The effective root (matched prefix or the scope's existing value) is stashed in a ContextVar so code that emits URLs picks the same prefix the router resolves the request under. Restore the previous context after success, failure or cancellation with a try/finally block.

  Install the root middleware only for a nonempty normalized prefix list. Warn when a nonempty, non-"/" scalar root coexists with a nonempty prefix list, since both are active and confusion is likely.
