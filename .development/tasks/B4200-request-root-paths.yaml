  paths:
    - Cargo.toml
    - crates/betterlite-config/**
    - crates/betterlite-server/**
    - tools/oracle/cases/root-path/**
    - tools/oracle/helpers/b4200.py
    - tools/oracle/helpers/b4200/**
    - tools/oracle/src/helpers/oracle/b4200.rs
    - tools/oracle/src/helpers/oracle/b4200/**
  lint_tables: false
