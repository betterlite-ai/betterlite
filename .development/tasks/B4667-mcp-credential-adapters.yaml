id: B4667
title: "MCP credential mode resolution and client adaptation"
description: >-
  Build the v1 <-> v2 bridge and the core resolver that dispatches on credential mode and mints upstream
  credentials. The resolver is the one function that interprets the ServerSpec built by the adapter and
  produces httpx2.Auth for the upstream request. Every mode has exactly one arm; the dispatch is exhaustive
  over AuthConfig variants with assert_never tail, so adding a mode without an arm fails the type gate.

  adapter.py (the edge, v1-free internally) maps v1 MCPServer onto the resolver's ServerSpec input. to_server_spec
  is the main dispatch: it matches the server's declared auth_type and either returns ServerSpec (live modes)
  or None to defer to v1 (parity-safe). Live modes: none, static-header family (api_key, bearer, token,
  authorization, basic), oauth2 split on sub-mode (M2M explicit client_credentials, per-user authorization_code,
  delegation stays with v1), oauth2_token_exchange (OBO), oauth2_id_jag (identity assertion), and passthrough.
  Each mode builds its config through a helper: _shared_key_spec for static modes, _client_credentials_spec
  for M2M, _token_exchange_spec for OBO, _id_jag_spec for ID-JAG. Missing required fields cause deferral
  to v1 (None) so a partially configured server does not 500. Deferred modes (oauth_delegate, passthrough
  oauth2, SigV4, per-user BYOK api_key) return None to stay on v1.

  raise_public maps resolver CredError onto HTTP, the one edge that raises. Each CredError tag (unauthorized,
  misconfigured, url_credentials_not_allowed, upstream_unavailable, unsupported_mode, precondition_required,
  not_implemented) maps to a status and detail. Unauthorized responses carry optional WWW-Authenticate and
  body fields.

  oauth_protected_resource_path builds the RFC 9728 Protected Resource Metadata path the 401 challenges
  point to. The path structure differs for scalar SERVER_ROOT_PATH (prefix inserted into path per RFC 8414)
  versus per-request SERVER_ROOT_PATHS (prefix placed before .well-known); picking the wrong form 404s the
  client's discovery fetch.

  raise_user_oauth_challenge emits the 401 an authorization_code server returns at egress when the user
  has no token. The challenge points at the Protected Resource Metadata, which names the upstream authorization
  server the client must complete OAuth with. raise_token_exchange_challenge emits the 401 an OBO
  (token_exchange) server returns when the caller's subject token is missing or the IdP rejected it (or
  step-up rejected it with a Conditional Access / CAE challenge). Uses error="invalid_token" normally and
  error="insufficient_claims" when the IdP passes a claims blob; carries the claims base64-encoded so the
  client can replay them to the IdP to satisfy step-up.

  validate_static_credential and _usable_credential_value check that the upstream request headers contain
  a usable credential in the configured header for api_key and Authorization-scheme modes. prepare_mcp_client
  calls client.prepare_request_auth() to fill in the prepared request, then validates it before the server's
  first request is sent (prevents a misconfigured server from silently connecting unauthenticated).

  resolver.py is v2: no v1 imports. UpstreamCredentialProvider dispatches resolve_credentials on the server's
  config variant. Every arm (none, api_key, passthrough, client_credentials, token_exchange, id_jag,
  authorization_code) receives its own typed config; adding a mode without an arm fails basedpyright's
  reportMatchNotExhaustive. Collaborators (per-mode stores and token fetchers) are injected; live none and
  api_key read from config and need none, authorization_code reads from OAuthTokenStore, token_exchange
  swaps through TokenExchanger, client_credentials mints through ClientCredentialsTokenSource, id_jag
  exchanges through a two-leg flow. Each arm returns Result[httpx2.Auth, CredError]; the caller must
  handle every failure case.

  _none checks that the resource URL carries no credentials (url_credentials_not_allowed error if it does).
  _api_key (SharedKey source only; per-user BYOK is out of scope here) formats and returns StaticHeaderAuth.
  _passthrough forwards the caller's own inbound token verbatim (unauthenticated when absent). _client_credentials
  mints and caches the gateway's M2M token; on upstream 401 the auth's refetch callback retries once with
  a fresh token (the contract's invalid-token recovery). _authorization_code reads the user's token from
  OAuthTokenStore. _token_exchange swaps the caller's inbound token through TokenExchanger; no inbound
  token means there is nothing to exchange, so it fails closed with 401 (no fallback to weaker source).
  _id_jag runs a two-leg exchange against a subject token from the request or from SSOAssertionStore. The
  id_jag slot key is derived from subject (principal + inbound token), so two callers with empty subject
  do not contend for one slot; the entry's fingerprint (derived from config) is what guarantees a cached
  bearer matches current inputs. The fingerprint includes every exchange parameter (endpoints, audience,
  resource, scopes, client auth hashing the secret), so a rotated assertion or edited config reads as a
  cache miss and re-mints.

  has_user_token checks whether a usable per-user token exists for authorization_code (the preemptive 401's
  check). invalidate_credentials drops cached credentials after upstream 401 (id_jag and token_exchange only).
  _id_jag_subject_token reads the identity token from the request or from stored assertion for this user.
  Every miss is precondition_required (412) rather than a fallback: ID-JAG exists to assert a specific user,
  so a missing subject has no safe substitute (store outage is upstream_unavailable 503, not 412, because
  the user cannot fix it by signing in again).

  resolve_credentials_with_source wraps resolve_credentials and adds the AuthResolution tag (which credential
  source was picked), so the caller knows what kind of credential it is. Default collaborators (_NullOAuthTokenStore,
  _NullTokenExchanger) fail closed: with no token store wired, every user reads as not authorized; with no
  exchanger, token_exchange cannot produce a credential.

