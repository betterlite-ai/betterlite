checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: The adapter/resolver dispatch, bridge functions, challenge builders or cache invalidation are absent or changed.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^outbound_credentials::/)' && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::outbound_credentials::/) - test(/replays_the_/)'
    - id: helper-python
      why: The helper adapters fail strict Python checks or are missing.
      run: test -f tools/oracle/helpers/b4667.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No newly added credential-resolver operation reaches the shared parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/credential-resolver-*')" && grep -rlq credential_resolver tools/oracle/fuzz/corpus/helper_case/credential-resolver-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
