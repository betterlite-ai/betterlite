deviations:
  - what: "betterlite's adapter.py has no v1 imports and maps MCPServer -> ServerSpec in pure v2 types, whereas LiteLLM's adapter imports v1 proxy types. The wire format (ServerSpec structure) and deferral semantics (returning None to stay on v1) are preserved."
    why: "The v2 resolver is independent and requires only ServerSpec input, not the full v1 MCPServer. This isolation lets v2 grow without re-importing v1 dependencies as the system matures."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/adapter.py#L1-L10
  - what: "betterlite's UpstreamCredentialProvider is a Rust struct with injected collaborators, not a Python class with module-level singletons. The resolver pattern is identical: one dispatch function, one arm per mode, exhaustive matching."
    why: "Rust requires explicit dependency injection for testability and thread-safety. The contract is the same: a ServerSpec in, a Result[httpx2.Auth, CredError] out."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/resolver.py#L114-L157
  - what: "betterlite's id_jag slot key is computed deterministically from principal + inbound token, whereas LiteLLM stores the assertion key. Both achieve cache safety: the slot key prevents contention, and the fingerprint (stored beside the bearer) prevents stale reuse."
    why: "Deterministic slot keys let invalidation compute the slot while the assertion store is down, making id_jag resilient to transient store outages. Fingerprint-guarded reuse is the same in both."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/resolver.py#L402-L412
out_of_scope:
  - "The OAuthTokenStore, TokenExchanger, ClientCredentialsTokenSource, SSOAssertionStore and TokenEndpointClient collaborators. Those are owned by their own tasks and injected here."
  - "The AuthConfig types and Result. Those are owned by B4650."
  - "Per-user BYOK api_key source (ApiKeySource::Byok). That lands with the seam that reads the BYOK store."
  - "AWS SigV4 signing. The AwsSigV4Config type is modeled; signing logic is deferred."
  - "Helper functions strip_auth_scheme, to_basic_credentials and client.prepare_request_auth. Those are owned by B4741."
  - "Config loading and deserialization. betterlite-config reads ServerSpec and builds the adapter input."
pitfalls:
  - "to_server_spec is the only dispatch on auth_type; every newly added MCPAuthType must be routed here or explicitly deferred, and the assert_never tail will reject any that are not."
  - "Returning None (deferral to v1) is the parity-safe way to handle a mode betterlite does not support yet. A 500 or an unimplemented error surfaces the migration incomplete; None lets the server keep working on v1."
  - "Missing required fields (client_id, client_secret, token_url) in client_credentials cause deferral to v1, not 500, since v1 would connect unauthenticated and the upstream's 401 gets absorbed into an empty tool list anyway."
  - "oauth_protected_resource_path must pick the correct insertion strategy (scalar SERVER_ROOT_PATH inserts prefix into path; per-request SERVER_ROOT_PATHS places it before .well-known). Picking the wrong form 404s the client's discovery fetch."
  - "raise_user_oauth_challenge and raise_token_exchange_challenge both build WWW-Authenticate headers with Bearer scheme, but the latter adds an error parameter and optional claims (base64-encoded). They are two different challenges for two different modes."
  - "raise_token_exchange_challenge uses error=\"insufficient_claims\" only when the IdP passes a claims blob (Entra Conditional Access / CAE); without it, the error stays \"invalid_token\"."
  - "validate_static_credential is called after prepare_request_auth fills in the prepared request. A misconfigured server that has no usable credential is caught before egress, preventing silent connection unauthenticated."
  - "The resolver dispatch is exhaustive over AuthConfig variants with assert_never tail. Adding a mode without an arm fails basedpyright's reportMatchNotExhaustive, so a bypassed gate fails loudly at runtime."
  - "has_user_token queries OAuthTokenStore for the preemptive 401 check. It returns bool (no Result), so a store outage is mapped to None (no token), and the client gets the OAuth challenge instead of a 503."
  - "invalidate_credentials drops cached credentials after upstream 401. Only id_jag and token_exchange hold re-mintable cached credentials; client_credentials recovers inside its own auth flow (ClientCredentialsBearerAuth retries the request once with a fresh token)."
  - "The id_jag slot key is derived from subject (principal + inbound token), so the entry address stays deterministic when the assertion store is down; the fingerprint stored beside the bearer is what keeps the cache safe from stale reuse."
  - "SecretStr fields in the resolver (inbound_token, credentials, subject material) are masked in debug output and error messages. Do not call .expose_secret() except when writing to a request or storing in the cache."
