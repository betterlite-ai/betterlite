dod:
  - text: SecretVault is a trait with read(), write(blob), erase() methods matching LiteLLM's behavior.
    proof: [keyring-unit-tests]
  - text: Read returns SecretFound(blob), SecretMissing, KeyringNotInstalled, KeyringDisabled or KeyringUnreachable.
    proof: [keyring-unit-tests]
  - text: Write preflights with a 5-second timeout, reports stored only after read-back confirms the value, and detects null backends that discard writes.
    proof: [keyring-unit-tests]
  - text: Erase returns SecretErased, SecretStranded or an unusable keyring, never reports unreachable after detecting one.
    proof: [keyring-unit-tests]
  - text: LITELLM_CLI_DISABLE_KEYRING=1 (case-insensitive, whitespace-trimmed) disables the keyring and all three operations fall back.
    proof: [keyring-unit-tests]
  - text: Every exception from the keyring API is caught and returns an unusable result, never panics.
    proof: [keyring-unit-tests]
  - text: The preflight timeout is 5 seconds by default, configurable on KeyringVault for testing, and cached as stopped_answering for the lifetime of the instance.
    proof: [keyring-unit-tests]
  - text: Preflight deletion (delete_password for credential-preflight) happens before the real write and suppresses exceptions.
    proof: [keyring-unit-tests]
  - text: "Named cases: read_found_and_missing, read_import_missing_and_disabled, read_exception_unreachable, write_preflight_timeout_cached, write_preflight_delete_failure_suppressed, write_stored_after_readback, write_readback_mismatch_discards_writes, write_exception_in_set, write_disabled_missing_and_cache, erase_confirms_deletion_after_found, erase_missing_already_gone, erase_stranded_on_delete_failure, erase_unusable_never_tried."
    proof: [keyring-unit-tests]

checks:
  optional: []
  commands:
    - id: keyring-unit-tests
      why: Keyring read, write, erase or preflight behavior differs from source or panics.
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^keyring::/)'

oracle_cases: []

deviations:
  - what: Keyring exceptions are never raised to callers; they are caught and returned as enum variants.
    why: Python's exceptions are a control-flow mechanism and add verbosity; Rust enum variants are more explicit. The caller still has every information they need to fall back to the token file.

out_of_scope:
  - B4591 owns token record storage and loading; B4592 owns credential lifecycle (save, migrate, logout).
  - B4594 owns setup wizard terminal input and provider selection.
  - B003 owns server routes; keyring access is local SDK only.
  - Testing keyring integration against a real OS keychain is deferred to a later task.

pitfalls:
  - "A keychain that blocks forever on writes (LOGIN keychain with no usable $HOME) must be detected with a preflight probe, or `lite login` blocks forever. The 5-second timeout is the only detector."
  - "A null backend accepts every write and keeps nothing. Read-back is the only way to tell if a keychain actually stored the credential."
  - "A preflight probe that times out is still running in a background thread and blocking the keychain against the main thread. Mark it as stopped_answering and never ask again, or read() would block forever on the main thread."
  - "The preflight entry must be deleted before the real write, because a keychain that discards writes will have created it during preflight. Suppress exceptions on deletion because the entry may not have been stored."
  - "LITELLM_CLI_DISABLE_KEYRING must be case-insensitive and trimmed; whitespace and mixed case are common in CI setup."

review_level: security
budget:
  max_changed_lines: 650
  max_new_expects: 0
