id: B4590
title: CLI keyring access and verified secret storage
description: >-
  Own crates/betterlite-cli/src/keyring.rs. Build a Rust module that SDK code and CLI commands use to store and retrieve the credential from the OS keychain (macOS Keychain, Windows Credential Manager, Linux Secret Service). The `keyring` crate is optional and imported only when needed, so importing this module never pulls it in.

  The module defines enum types for every outcome: SecretFound(blob), SecretMissing, SecretStored, SecretErased, SecretStranded, KeyringNotInstalled, KeyringDisabled, KeyringUnreachable, KeyringDiscardsWrites. Type aliases SecretRead, SecretWrite, SecretErase and KeyringUnusable group the union types that each operation can return. A SecretVault trait defines three methods: read(), write(blob: str), erase().

  KeyringVault is the only implementation of SecretVault, with a read() method that returns the secret or a reason it is unreachable, write(blob) that stores only after verifying the keychain answered the write, and erase() that removes the entry and reports whether it succeeded. The service name is "litellm-cli" and account name is "credential"; a preflight probe is stored under "credential-preflight" to check whether the keychain answers writes within 5 seconds.

  Respect the original design: a write is only reported SecretStored after read-back confirms the value matches. A keychain that accepts every write and keeps nothing (null backend, `keyring --disable`, LITELLM_CLI_DISABLE_KEYRING=1 in headless CI) is detected because read-back returns nothing and the operation falls back to the token file. A keychain that blocks forever on write (the case for LOGIN keychains with no usable $HOME in containers, `sudo -H`, service accounts) is detected with a 5-second preflight, and the result is cached as KeyringUnreachable for the rest of the process to avoid blocking on the main thread. The preflight probe entry is deleted immediately after a successful preflight and before the real write; delete failures are silently suppressed since the preflight value is worthless.

  The keyring crate's Python bindings or a wrapper crate can be used; if keyring is not available, KeyringNotInstalled results on every operation. Reads succeed with SecretMissing (no entry) or SecretFound(blob). Writes catch every exception and return either KeyringUnreachable (read-back failed) or KeyringDiscardsWrites (the keychain kept nothing). Erasures return SecretErased (gone), SecretStranded (could not delete, entry still exists), or the reason the keychain is unreachable.

  Add a test module that stubs the keyring API, verifies preflight timeout behavior, catches every exception path and proves read-back detection works. The oracle is deferred because keyring integration requires secrets and CI setup; only unit tests run here.

  Consume this module from B4591 (token records), B4592 (credential lifecycle) and B4594 (setup wizard).

