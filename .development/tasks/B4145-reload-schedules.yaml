id: B4145
title: Persist reload schedules and track per-pod revisions
description: >-
  Implement reload schedule management in betterlite-db to read, write and track periodic
  reloads of the model cost map in the LiteLLM_Config table. Build ReloadSchedule to hold
  interval_hours (None or positive int), reload_revision (monotonic per-pod counter), and
  last_run_at (UTC timestamp or None). Parse LiteLLM_Config rows where param_value is JSON
  either as a string or already-decoded dict depending on the driver.

  Provide parse_reload_schedule to convert a row into ReloadSchedule with timezone-naive
  datetimes coerced to UTC. next_run_at calculates the next scheduled run from interval and
  last_run. reload_schedule_status formats the schedule as a TypedDict for API responses with
  ISO strings and boolean scheduled flag.

  pod_reload_is_due checks whether this pod should reload: when its applied_revision differs
  from the database revision (manual reload request), when the interval has never run
  anywhere (last_run_at is None), or when hours_since_data_loaded >= interval_hours.
  Pods start at revision 0 at boot and reload once per interval from their own load time,
  not from the last published run.

  Implement read_reload_schedule as async find_unique on param_name. write_reload_interval
  upserts with param_value JSON containing interval_hours, and clear_reload_interval updates
  the JSON to null interval without deleting the row (so revision is never reused).
  record_reload_run updates last_run_at only if the row still exists. record_manual_reload
  upserts with atomic increment to bump reload_revision and returns the published revision
  so the serving pod adopts it immediately. All writes call evict_config_param to invalidate
  the cache.

  Validation errors during interval parsing return None (no schedule). RELOAD_CONFIG_PARAM_NAME
  is the single param_name this module writes: "model_cost_map_reload_config". Uses B725 ConfigRepository
  table accessors and B192's safe_dumps for JSON serialization. Add helpers for interval/revision/
  last_run decisions as inline functions with behavior-driven tests, no oracle HTTP cases.

