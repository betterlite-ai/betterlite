pitfalls:
  - "parse_reload_schedule accepts param_value as either a JSON string or an already-decoded dict, mirroring how different database drivers return the Json? column type."
  - "timezone-naive datetimes get UTC applied without validation that they were already in UTC; the comment warns callers to validate before passing."
  - "clear_reload_interval nulls the interval inside the JSON value via safe_dumps, not by nulling the param_value column itself, which Prisma rejects for a Json? field."
  - "record_reload_run calls update_many with no where clause guards; if the row is deleted concurrently, the update affects zero rows and does not error."
  - "record_manual_reload returns the published revision immediately from the upserted row; a concurrent request sees a higher revision."
  - "RELOAD_CONFIG_PARAM_NAME is the singleton param_name this module uses; param_name is not a user-supplied input."
  - "The interval firing logic uses strict < comparison, so a reload fires as soon as the interval boundary is crossed, even by fractional seconds."

oracle_cases: []

deviations:
  - what: >-
      parse_reload_schedule accepts param_value as JSON string or dict depending on the database driver's
      Json column handling; absent or unparseable values return None for interval_hours rather than raising.
    why: >-
      LiteLLM's ConfigRepository.get_param does the same: it accepts both encoded and decoded JSON and returns None on ValidationError.
      Different database drivers (asyncpg, psycopg) return Json columns differently, so accepting both prevents driver-specific breakage.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/periodic_reload_schedule.py#L93-L102
  - what: >-
      Timezone-naive datetimes are coerced to UTC without validation; callers must pass pre-validated UTC naive or aware datetimes.
    why: >-
      LiteLLM's _as_utc helper does the same: it assumes a naive datetime is UTC and blindly attaches the timezone.
      This matches PostgreSQL's timestamp semantics where naive values are interpreted as client timezone.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/periodic_reload_schedule.py#L105-L108
  - what: >-
      clear_reload_interval nulls the interval inside the JSON param_value rather than setting the param_value column to null,
      preserving the row so reload_revision is never reused.
    why: >-
      LiteLLM must keep the row alive because reload_revision is a monotonic counter; deleting and recreating it risks reusing
      a revision number that other pods already applied, causing manual reloads to be silently skipped.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/periodic_reload_schedule.py#L193-L203
  - what: >-
      record_reload_run does not upsert the row if absent, leaving no trace of a reload that ran before the row was created.
      The row may be deleted mid-poll and the update will silently affect zero rows.
    why: >-
      LiteLLM uses update_many without checking affected rows; a manually deleted row is not resurrected by a background
      reload job, preserving the admin's intent to stop the schedule.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/periodic_reload_schedule.py#L206-L213

out_of_scope:
  - "B725 ConfigRepository.table and its Prisma wrapper are called but not implemented here."
  - "B192 safe_dumps function is called but not implemented here."
  - "The reload job that calls record_reload_run and pod_reload_is_due periodically is owned by another task."
  - "The admin endpoints that call write_reload_interval and record_manual_reload are owned by another task."
  - "evict_config_param (litellm/proxy/utils.py:4300-L4301) cache invalidation is owned by B124 or a task split from it; see architect question 3 in B120."
  - "The model cost map reload schedule itself is read as part of general config loading; this module manages persistence only."

