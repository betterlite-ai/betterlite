dod:
  - text: ReloadSchedule holds interval_hours (Option<u32>), reload_revision (u32), and last_run_at (Option<DateTime<Utc>>).
    proof: [schedule-struct]
  - text: parse_reload_schedule converts a LiteLLM_Config row param_value (JSON string or dict) into ReloadSchedule, applying UTC timezone to naive datetimes and defaulting reload_revision to 0.
    proof: [parse-schedule]
  - text: next_run_at returns None when interval or last_run is None, otherwise returns last_run + interval hours.
    proof: [next-run-calculation]
  - text: reload_schedule_status returns TypedDict with scheduled flag, interval_hours, and ISO-formatted last_run and next_run strings.
    proof: [status-formatting]
  - text: pod_reload_is_due returns true when pod_applied_revision differs from schedule.reload_revision, when last_run_at is None, or when hours_since_data_loaded >= interval_hours.
    proof: [pod-reload-decision]
  - text: read_reload_schedule queries LiteLLM_Config by param_name and returns parsed ReloadSchedule or None if row absent.
    proof: [read-from-db]
  - text: "write_reload_interval upserts with param_value containing {\"interval_hours\": value} and calls evict_config_param."
    proof: [write-interval]
  - text: "clear_reload_interval updates param_value to {\"interval_hours\": null} without deleting the row and calls evict_config_param."
    proof: [clear-interval]
  - text: record_reload_run updates last_run_at if the row exists and calls evict_config_param; absent row leaves no error.
    proof: [record-run]
  - text: record_manual_reload upserts with atomic reload_revision increment, returns the published revision, and calls evict_config_param.
    proof: [manual-reload-atomic]
  - text: RELOAD_CONFIG_PARAM_NAME constant is "model_cost_map_reload_config" and used by all database operations.
    proof: [param-name-constant]
  - text: Interval parsing returns None on ValidationError; timezone-naive datetimes default to UTC; all other failures propagate.
    proof: [error-handling]

