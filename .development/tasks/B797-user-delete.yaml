id: B797
title: User deletion and invitation creation
description: >-
  Implement /user/delete directly from internal_user_endpoints.py:2397-2604 and invitation creation; do
  not invoke BulkUserDeletion. Preserve per-user validation followed immediately by audit scheduling and
  team-roster rewrites inside that loop, then delete keys, invitation links, organization memberships,
  team memberships and users. A later target failure can leave earlier writes behind. V2 invitation email
  imports are unavailable without litellm_enterprise, so warn and use the MIT V1 fallback. Invitation
  expiration remains seven days.


  Build the production user_delete module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  delete_user (L2397-L2604; 163 source lines). litellm/proxy/management_helpers/user_invitation.py: create_invitation_for_user
  (L11-L49; 36 source lines). litellm/proxy/hooks/user_management_event_hooks.py: UserManagementEventHooks.async_user_created_hook
  (L32-L78; 38 source lines), UserManagementEventHooks.async_send_user_invitation_email (L81-L115; 30
  source lines), UserManagementEventHooks._send_v2_user_invitation_emails (L118-L161; 39 source lines),
  UserManagementEventHooks.send_legacy_v1_user_invitation_email (L164-L186; 19 source lines), UserManagementEventHooks.create_internal_user_audit_log
  (L189-L232; 41 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.alerting=[];
  alerting=[].


  Register these actual HTTP routes and aliases exactly once: POST /user/delete -> delete_user. For each
  route send a typed successful request, an invalid or missing target, and a caller lacking that route
  permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::user_delete::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 366 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  366 production, 154 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 635 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
