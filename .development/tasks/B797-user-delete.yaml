dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: delete_user, delete_forbidden,
      invitation_seven_days, invitation_missing_user, v1_email_payload, enterprise_absent_v1_fallback,
      earlier_roster_write_survives, audit_scheduled_before_later_error.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_delete::tests::/)
        - test(/replays_the_/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^user_delete::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/user-delete-*")"
        && grep -rlq "alerting" crates/betterlite-config/fuzz/corpus/config_yaml/user-delete-* && cargo
        nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
