id: B797
title: User deletion and invitation creation
description: >-
  Implement /user/delete directly from internal_user_endpoints.py:2397-2604 and invitation creation; do
  not invoke BulkUserDeletion. Preserve per-user validation followed immediately by audit scheduling and
  team-roster rewrites inside that loop, then delete keys, invitation links, organization memberships,
  team memberships and users. A later target failure can leave earlier writes behind. V2 invitation email
  imports are unavailable without litellm_enterprise, so warn and use the MIT V1 fallback. Invitation
  expiration remains seven days. Missing database is HTTP 500 No db connected and a null user_ids
  is HTTP 400 No user id passed in. Empty user_ids succeeds with zero deletions. Proxy admins can
  delete any user; others need a nonempty set of org-admin memberships, and every target must have
  at least one organization with ALL its organizations inside that set. Missing users are 404;
  missing admin scope, unassigned targets and mixed-organization targets are 403. Do not infer
  authorization from organization IDs supplied alongside the request. This handler has no except
  block: B003 maps its HTTPException and database failures, and B865 preserves handler errors.

  For each validated target, when B065 audit logging is enabled, schedule a deleted USER_TABLE_NAME
  audit row with UUID, UTC timestamp, updated_values="{}", before_value excluding nulls, caller API
  key and B065.get_audit_log_changed_by (authorized litellm-changed-by, caller ID, then proxy name).
  Load teams from user.teams and run B1207._cleanup_members_with_roles; write only changed rosters.
  After the loop, fetch all target keys and JWT mapping cache keys, delete keys, schedule B784 key
  audits only for a nonempty selection, run B734.delete_cache_key_objects, then B878.evict_and_broadcast
  on JWT mappings. Delete invitations matching user_id OR created_by OR updated_by, organization
  memberships, team memberships and finally user rows; evict user IDs only after that last write.
  Return the database delete count. None of this is a batch transaction or archived-key deletion.

  create_invitation_for_user uses B723's InvitationLinkRepository: missing DB is 400, otherwise one
  UTC instant supplies created_at/updated_at, expires_at adds seven days, and created_by/updated_by
  choose caller user_id or proxy admin name. A foreign-key error containing Foreign key constraint
  failed on the field becomes 400 with /user/new guidance; other insert errors are 500. Do not add
  a user preflight lookup or rewrite these errors through handle_exception_on_proxy.

  The created hook sends email before its audit try block. Build the internal_user_created USER
  WebhookEvent with Welcome to LiteLLM Proxy, token, spend=response.spend or 0, max_budget, user_id,
  user_email, team_id and key_alias. Only send_invite_email is True attempts delivery. Without the
  enterprise package, warn Defaulting to using Legacy Email Hooks and return false from the V2
  probe; enterprise logger enumeration/delivery is unreachable and is not implemented. The V1
  fallback requires email in general_settings.alerting (default []), otherwise raises ValueError
  with setup guidance BEFORE audit scheduling. B116 supplies the actual email sink; schedule its
  send_key_created_or_user_invited_email, never log the token. In the audit try, missing database,
  missing response.user_id or missing user row warns Unable to create audit log for user on /user/new
  and returns successfully. Otherwise schedule create_internal_user_audit_log with action created,
  before_value=None and the stored row excluding nulls. That helper first checks B065's enabled flag
  and writes the supplied action/before/after using the same changed-by selection.

  B065 owns litellm.store_audit_logs=None and LITELLM_STORE_AUDIT_LOGS=None resolution (explicit setting,
  then environment, then premium_user); use its policy here and test enabled/disabled branches.
  B790 supplies internal-user table accessors; B723/B724/B726 supply the concrete repositories.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  delete_user (L2397-L2604; 163 source lines). litellm/proxy/management_helpers/user_invitation.py: create_invitation_for_user
  (L11-L49; 36 source lines). litellm/proxy/hooks/user_management_event_hooks.py: UserManagementEventHooks.async_user_created_hook
  (L32-L78; 38 source lines), UserManagementEventHooks.async_send_user_invitation_email (L81-L115; 30
  source lines), UserManagementEventHooks._send_v2_user_invitation_emails (L118-L161; 39 source lines),
  UserManagementEventHooks.send_legacy_v1_user_invitation_email (L164-L186; 19 source lines), UserManagementEventHooks.create_internal_user_audit_log
  (L189-L232; 41 source lines).


  Resolve general_settings.alerting through B002 and pass its typed list to the email fallback.


  Register only POST /user/delete here. B001 HTTP cases compare count/status, content-type and
  B003's error type/param/code against the booted MIT server, ignoring message wording. Native
  Postgres tests exercise invitation and hook effects without calling later /user/new or invitation
  handlers through a helper adapter. Use POSTGRES_TEST_URL when present, otherwise testcontainers;
  failed configured connections fail tests. Check surviving rows after each injected failure.


  Config tests alerting_default_empty, email_alerting_loaded and alerting_env_resolution load actual
  YAML through B002, then exercise the email decision. There is no integer-setting fallback here.
  Add alerting seeds to the existing config_yaml corpus; B002 retains decoder/fuzz ownership.


  Sizing: 366 nonblank, noncomment lines before excluding the unreachable enterprise-only delivery
  body; allow 340 production, 340 behavior/Postgres tests, 65 route wiring and 50 config lines,
  795 within an 800-line gate.


  Wire user_delete behind B052 bearer authentication and the source's B865 management decorator.
