id: B4675
title: "MCP gateway consent and native client authorization"
description: >-
  Build the browser half of the MCP gateway's own OAuth front door (LiteLLM's gateway_dcr_flow.py, authorize and connect-flow part) in crates/betterlite-mcp, new module gateway_authorize. It covers GET /authorize for a registered DCR client, the per-flow cookie, the connect page's flow description, POST /authorize/complete (approve, deny, manual delivery), the native-client authorize verb with its loopback rule and consent page, and the /.well-known/litellm-cli-auth document. B4674 already owns the constants, sealed models, OauthError, the port traits and the single-use guard in module gateway_dcr; import them, never copy them. B4676 (token grants) opens the auth code this task seals, so the GatewayAuthCode fields must be filled exactly as below.


  Nothing here touches axum, a clock, a random source or a global. A route parses the request and passes plain values in. Every function returns a GatewayReply (defined in reply) and the route turns it into an HTTP response. The routes themselves (GET /authorize, GET /{mcp_server_name}/authorize, GET /authorize/mcp-session, GET /authorize/flow, POST /authorize/complete, GET /.well-known/litellm-cli-auth, and the session-cookie reading) are wired by the umbrella, so this task has helper cases only.


  Submodules, each with a tests.rs beside it. The test modules are named in the checks.


  reply. RequestView { base_url: String, path: String, query: Option<String>, cookies: Vec<(String, String)> }. The route computes base_url once with B4654's get_request_base_url (it is the value LiteLLM calls get_request_base_url(request) for, no trailing slash) and fills path and query from the request URL. cookies is the parsed Cookie header; when a name repeats, the last one wins (Starlette builds a dict). GatewayReply is an enum: Redirect { location: String, set_cookie: Option<FlowCookie>, delete_cookie: Option<FlowCookieDeletion> } (always status 303), Html { body: String, headers: Vec<(String, String)>, set_cookie: Option<FlowCookie> } (status 200), Json { body: serde_json::Value, headers: Vec<(String, String)> } (status 200) and Error(OauthError) from B4674. FlowCookie { name, value, max_age_seconds: i64, path, secure: bool } always means HttpOnly and SameSite=Lax. FlowCookieDeletion { name, path, secure } means Max-Age 0 and an expiry in 1970, HttpOnly, SameSite=Lax. Two traits are injected: FlowTokenSource with one method returning a fresh 24-byte url-safe token (32 characters, base64url without padding, what secrets.token_urlsafe(24) returns), used for both the flow handle and the jti, and RenderConsentPage with one method taking (client_origin, user_id, teams as a slice of (team_id, label) pairs, flow_handle, complete_url) and returning the page text. The composition root supplies a random-backed FlowTokenSource and B1612's render_native_client_consent_page behind RenderConsentPage; betterlite-server sits above this crate, so it cannot be imported here. Tests use fixed fakes.


  url_parts. flow_cookie_name(handle) is B4674's CONNECT_FLOW_COOKIE_PREFIX plus the handle. cookie_path_and_secure(base_url) parses base_url with B4654's python_url urlparse and returns (path, or "/" when empty; secure only when the scheme is https). append_query_params(url, extra pairs) parses the URL, splits the existing query like Python's parse_qsl with keep_blank_values (split on "&" only, skip empty pieces, split each piece at the first "=", a piece with no "=" becomes a name with an empty value, then percent-decode with "+" as a space and invalid UTF-8 replaced), appends the new pairs, re-encodes everything like urlencode (quote_plus: letters, digits and "_.-~" stay, a space becomes "+", every other byte becomes %XX in upper case) and rebuilds the URL with B4654's urlunparse, keeping scheme, netloc, path, params and fragment. relative_request_url(path, query) is path when query is None or empty, else path, "?" and query. origin_only(url) is scheme, "://" and netloc when the netloc is non-empty, else "". A URL that urlparse rejects gives a typed error; the callers answer 500 server_error "the gateway could not read the redirect URI", which cannot happen for a registered or sealed URI.


  scope. is_proxy_api_resource(base_url, resource): false for None, false when B4654's canonical_resource_uri gives None, else true when the canonical value equals canonicalize_url_identity(base_url). resolve_scoped_resource_server(registry, base_url, resource) returns Option<&MCPServer> from B6590, reading B4731's ServerRegistry (the route holds the read lock and passes the reference). Steps in order, each failure returns None: resource is None; canonical_resource_uri(resource) is None; base is canonicalize_url_identity(base_url); canonical equals base plus "/mcp", or does not start with base plus "/"; extract_target_server_names_from_path (B4654, path_targets) on the canonical text from the end of base onward does not return exactly one name; server_by_name(name, no client ip) from B4731 is None; the server is neither is_gateway_managed_oauth2 nor advertises_gateway_authorization_server (both B6590 methods). No client ip is passed on purpose: the lookup is about identity, not visibility. flow_target(registry, flow, reachability) returns a FlowTarget enum Unscoped, Interactive(server), M2m(server) or Stale. No resource_server_id is Unscoped. Otherwise server_by_id(id, no ip) from B4731 must exist, must be gateway-managed oauth2 or advertise the gateway authorization server, and the injected LookupServerReachability (B4674) must say true for (flow.user_id, server_id); anything else is Stale. A server is Interactive when it is_gateway_managed_oauth2 and B6760's `effective_oauth2_flow(server)` (an Option<OAuth2Flow>, from `betterlite_mcp::server_oauth`) is not Some(OAuth2Flow::ClientCredentials), else M2m. The reachability call is skipped when an earlier test already failed.


  authorize. rejected_authorize_request(client_id, redirect_uri, state, code_challenge, code_challenge_method, response_type, cipher) returns Option<OauthError>, checks in this order: open_gateway_dcr_client (B4674) is None gives 400 invalid_client "unknown or malformed client_id"; redirect_uri is not one of the client's redirect_uris (exact string match) gives 400 invalid_request "redirect_uri is not registered for this client"; response_type is not exactly "code" gives 400 unsupported_response_type "response_type must be 'code'"; a missing or empty code_challenge, or code_challenge_method not exactly "S256", gives 400 invalid_request "PKCE is required: send code_challenge with code_challenge_method=S256"; a state longer than B4674's MAX_STATE_LENGTH (count code points) gives 400 invalid_request "state must be at most 1024 characters". login_redirect(base_url, path, query) is Redirect to base_url plus "/sso/key/generate?" plus urlencode of the single pair return_to = relative_request_url(...). new_connect_flow builds B4674's ConnectFlow with jti from the token source, exp = now plus CONNECT_FLOW_TTL_SECONDS, code_challenge "" when absent. set_flow_cookie seals the flow with an empty prefix (unprefixed) through B4674's seal and builds the FlowCookie: name flow_cookie_name(handle), max_age CONNECT_FLOW_TTL_SECONDS, path and secure from cookie_path_and_secure. A seal failure becomes 500 server_error "the gateway could not seal the connect flow".


  aggregate_authorize(request view, params, session_user_id, resource, registry, cipher, tokens, now) returns a GatewayReply. Order: rejected_authorize_request first (so an anonymous caller with a bad client still gets the 400, never the login redirect); then no session_user_id gives login_redirect; then resolve_scoped_resource_server; then a fresh handle and a flow with the session user, client, redirect, state, code_challenge, resource_server_id of the scoped server and audience None; the reply is Redirect with status 303 to base_url plus "/ui/connect" with connect_flow=handle appended through append_query_params, carrying the flow cookie. The connect URL holds only the handle.


  native_client_authorize is async and takes a generic LookupConsentTeams (B4674). It runs rejected_authorize_request, then requires is_loopback_redirect_host (B4655) on the parsed redirect_uri, else 400 invalid_request "a proxy-API grant may only redirect to a loopback address"; then no session gives login_redirect; then lookup_consent_teams(user) must return teams, and a ReloadUserFailure maps through consent_lookup_failure: unavailable is 503 temporarily_unavailable with B4674's DB_UNAVAILABLE_DESCRIPTION, faulted is 503 temporarily_unavailable with DB_FAULTED_DESCRIPTION, unresolvable is 500 server_error "the gateway is not configured to resolve users", no_active_key is 403 access_denied "the signed-in user is not active". Then a flow with resource_server_id None and audience PROXY_API_AUDIENCE, and an Html reply: body from RenderConsentPage with client_origin origin_only(redirect_uri), the user id, the teams as (team_id, team_alias or team_id), the handle, and complete_url base_url plus "/authorize/complete". Headers are B4654's TOKEN_NO_CACHE_HEADERS plus X-Frame-Options DENY and Content-Security-Policy "frame-ancestors 'none'". The flow cookie is attached. The handle appears only in the form, never in a URL.


  connect. open_flow_for(request view, handle, session_user_id, now, cipher) returns Result<ConnectFlow, OauthError> in this order: no cookie named flow_cookie_name(handle), or a cookie that does not open as a ConnectFlow (open_sealed with the empty prefix and the gateway_connect_flow debug key), or now >= flow.exp, gives 400 invalid_request "unknown or expired connect flow"; no session gives 401 login_required "sign in to LiteLLM to finish connecting"; a session user that differs from flow.user_id gives 403 access_denied "the signed-in user does not match this connect flow". describe_opened_flow(flow, ...) returns ConnectFlowDescription { state: unscoped|interactive|m2m|stale, client_origin, server_id, server_name, connected: Option<bool> } or an OauthError. For Interactive it calls the injected LookupVendorCredential (B4674) with (user, server_id); unavailable gives 503 temporarily_unavailable with DB_UNAVAILABLE_DESCRIPTION; connected is true only for present. For the other states no vendor lookup happens: connected is Some(true) for m2m and None for unscoped and stale; server_id and server_name are None when there is no server. server_name is the first non-empty of server_name, alias, name. describe_connect_flow wraps open_flow_for and describe_opened_flow and answers Json with the description and TOKEN_NO_CACHE_HEADERS.


  complete_connect_flow is async and takes the ports, a SingleUseGuard (B4674) and the params delivery, team_id, decision. Order: delivery other than absent, "redirect" or "manual" gives 400 invalid_request "delivery must be 'redirect' or 'manual'"; decision other than absent, "approve" or "deny" gives 400 invalid_request "decision must be 'approve' or 'deny'"; open_flow_for; for any decision except "deny", describe_opened_flow, where an error is returned as is, state stale gives 400 invalid_request "the requested MCP server is no longer available", and connected Some(false) gives 400 invalid_request "authorize the requested MCP server before finishing"; then the single-use claim on B4674's flow-used prefix plus the flow jti with ttl CONNECT_FLOW_TTL_SECONDS + CLAIM_TTL_BUFFER_SECONDS, passed through claim_refusal with the replayed error 400 invalid_request "this connect flow was already completed; restart the connection"; then the deny or approve reply, with delete_cookie set to the flow cookie for this handle (path and secure as at set time). The server checks run before the claim, so a submit made too early can be retried after the user authorizes. A deny skips the checks. Any error before the claim leaves the cookie in place. Deny is Redirect to append_query_params(redirect_uri, error=access_denied plus state when state is non-empty). Approve seals B4674's GatewayAuthCode with the GATEWAY_AUTH_CODE_PREFIX: user_id, client_id, redirect_uri and code_challenge from the flow, a fresh jti, iat now, exp now plus the ttl, resource_server_id and audience from the flow, and team_id only when the flow audience is PROXY_API_AUDIENCE and team_id is a non-empty string. The ttl is MANUAL_DELIVERY_AUTH_CODE_TTL_SECONDS (300) when delivery is "manual" and is_loopback_redirect_host holds for the redirect URI, else GATEWAY_AUTH_CODE_TTL_SECONDS (120). The callback URL is append_query_params(redirect_uri, code plus state when non-empty). Manual delivery answers Html with TOKEN_NO_CACHE_HEADERS and a page built by manual_delivery_page(callback_url): LiteLLM's exact markup with the URL passed through html.escape(quote=True) (& < > " ' escaped to &amp; &lt; &gt; &quot; &#x27;) and "5 minutes" from 300 divided by 60; copy the page text from the reference. Every other approve answers Redirect to the callback URL.


  contract. native_client_auth_contract(base_url, token_exchange_available) returns a typed struct that serializes to the discovery document: contract_version 1 (NATIVE_CLIENT_AUTH_CONTRACT_VERSION), issuer base_url, authorization_endpoint base_url plus /authorize, token_endpoint /token, registration_endpoint /register, revocation_endpoint /revoke, resource base_url, response_types_supported ["code"], grant_types_supported from B4674's supported_grant_types, code_challenge_methods_supported ["S256"], and token_endpoint_auth_methods_supported and revocation_endpoint_auth_methods_supported both ["none"]. Keys come out in that order.


  Helper adapter. The Python side builds a Starlette Request from a scope the case supplies, registers synthetic MCPServer objects in a fresh manager for scoped cases, patches the token source so handles and jti values are fixed, and replaces render_native_client_consent_page with a function that returns the typed arguments as JSON, so the case compares the page inputs rather than HTML owned by B1612. The Rust side maps the same case to the functions above. Sealed cookie and code values differ run to run, so the helper reports what they open to (the model fields) and never the ciphertext.
