deviations:
  - what: The request base URL, the clock, the random handle and jti source, the single-use authority and the consent page renderer are passed in. LiteLLM reads request.url, datetime.now, secrets and the module-level cache inside each function.
    why: betterlite keeps no module state and the crate sits below betterlite-server, so cases fix the clock and tokens and compare what sealed values open to.
  - what: A redirect URI that urlparse rejects (never one that passed registration) is answered 500 server_error "the gateway could not read the redirect URI". LiteLLM lets the ValueError escape.
    why: A typed error is the only honest answer when parsing fails; it cannot be reached with a registered client.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/gateway_dcr_flow.py#L449-L457
out_of_scope:
  - "gateway_dcr_flow.py constants, models, OauthError, sealing, register_aggregate_client, the port traits, supported_grant_types and the single-use guard: B4674."
  - "_pkce_verifier_matches, aggregate_token, the grant functions, revoke_refresh_token and introspect_gateway_token with their helpers: B4676."
  - "The routes in discoverable_endpoints.py (/authorize, /{mcp_server_name}/authorize, /authorize/mcp-session, /authorize/flow, /authorize/complete, /.well-known/litellm-cli-auth), _session_cookie_user_id, _vendor_credential_state and _user_can_reach_mcp_server: the umbrella B137 and the discoverable endpoint route owners; this task has no route, so its cases are helper cases."
  - "lookup_consent_teams (proxy_api_credentials.py): B4658, as ActiveSubjects. This task takes it as the LookupConsentTeams port."
  - "render_native_client_consent_page: B1612, supplied through RenderConsentPage."
  - "get_request_base_url, canonical_resource_uri, canonicalize_url_identity, extract_target_server_names_from_path, TOKEN_NO_CACHE_HEADERS and the python_url helpers: B4654. is_loopback_redirect_host: B4655."
  - "MCPServer and its gateway-oauth methods: B6590. server_by_id and server_by_name: B4731. effective_oauth2_flow: B6760."
pitfalls:
  - "aggregate_authorize validates the client first and only then looks at the session, so an anonymous request with an unregistered redirect_uri gets the 400, not the sign-in redirect; native_client_authorize does the loopback test between those two."
  - "The redirect_uri must equal one of the sealed redirect_uris by exact string compare, so a trailing slash or a different case in the host fails."
  - "The connect URL carries only connect_flow=<handle>; the client origin, scoped server and state come from the sealed cookie, never from the query."
  - "append_query_params re-encodes the existing query too: a=b%20c becomes a=b+c, a blank value stays, and a fragment survives untouched."
  - "The deny redirect adds error=access_denied and state only when state is non-empty; the approve redirect adds code and the same optional state."
  - "team_id is sealed into the code only for the proxy-API audience, and an empty team_id string counts as absent; an MCP-session flow never gets one even if the form sent it."
  - "delivery=manual changes nothing for a non-loopback redirect: the code keeps its 120 second life and the reply is the normal 303."
  - "The vendor and reachability checks run before the single-use claim and are skipped on deny, so a refused submit does not burn the flow and a deny always works."
  - "A scoped M2M server reports connected true without any vendor lookup, and an unscoped flow reports connected null."
  - "Starlette's delete_cookie needs the same path and secure flag the cookie was set with; take both from cookie_path_and_secure(base_url) again."
  - "The flow expiry test is now >= exp, so a flow is dead at the exact second it expires; compare whole seconds."
  - "The consent page headers are the no-cache pair plus X-Frame-Options and Content-Security-Policy; the manual page gets only the no-cache pair."
  - "resolve_scoped_resource_server turns a resource of base_url plus /mcp into None, but base_url alone is the proxy-API resource handled by is_proxy_api_resource, not a server."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
