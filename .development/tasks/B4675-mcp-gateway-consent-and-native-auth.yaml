dod:
  - text: A bad client_id, an unregistered redirect_uri, a wrong response_type, missing or non-S256 PKCE and an over-long state each answer their own 400 and message, in LiteLLM's order, before any login redirect.
    proof: [authorize-tests, oracle]
  - text: A valid request without a session redirects to /sso/key/generate with the relative return_to, and with a session it redirects to /ui/connect with only the handle and sets a sealed per-flow cookie that opens as a ConnectFlow with the right fields and a 600 second life.
    proof: [authorize-tests, oracle]
  - text: A per-server resource narrows the flow to exactly one gateway-owned server and every other resource shape (absent, aggregate, foreign host, several servers, unknown, wrong mode) leaves it unscoped.
    proof: [scope-tests, oracle]
  - text: The native verb requires a loopback redirect, looks up consent teams, maps each lookup failure to its status, seals an audience-bound flow and renders the consent page with the no-store, frame-deny headers and no handle in any URL.
    proof: [authorize-tests, oracle]
  - text: Opening a flow refuses a missing, tampered, expired or wrong-type cookie, an anonymous caller and a different signed-in user with the listed statuses.
    proof: [connect-tests, oracle]
  - text: The flow description reports unscoped, interactive, m2m and stale states with the client origin, the server name fallback and the connected flag, and a vendor lookup fault answers 503.
    proof: [connect-tests, oracle]
  - text: Completing a flow validates delivery and decision, checks the scoped server before the single-use claim, skips those checks for a deny, rejects a replay, and clears the cookie only on success.
    proof: [connect-tests, oracle]
  - text: An approved flow seals an auth code with the right ids, ttl, scope, audience and team_id, redirects with code and state, and uses the manual page only for a loopback redirect.
    proof: [connect-tests, oracle]
  - text: The discovery document has every field, in order, and lists the token-exchange grant only when it is available.
    proof: [contract-tests, oracle]
  - text: append_query_params and the other URL helpers match Python for repeated keys, blank values, plus signs, percent escapes and fragments.
    proof: [url-parts-tests, oracle]
checks:
  optional: [mutants]
  commands:
    - id: url-parts-tests
      why: The URL helper tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_authorize::url_parts::tests::/)'
    - id: scope-tests
      why: The resource scoping or flow target tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_authorize::scope::tests::/)'
    - id: authorize-tests
      why: The aggregate or native authorize tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_authorize::authorize::tests::/)'
    - id: connect-tests
      why: The connect flow opening, description or completion tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_authorize::connect::tests::/)'
    - id: contract-tests
      why: The discovery document tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_authorize::contract::tests::/)'
    - id: helper-python
      why: The helper adapter is missing or fails strict Python checks.
      run: test -f tools/oracle/helpers/b4675.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4675 operation reaches the shared helper case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-gateway-authorize-*')" && grep -rlq b4675 tools/oracle/fuzz/corpus/helper_case/mcp-gateway-authorize-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
