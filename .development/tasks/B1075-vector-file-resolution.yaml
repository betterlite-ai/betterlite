id: B1075
title: Attached-file id, credential and provider resolution
description: >-
  Build the seven complete helpers at vector_store_files_endpoints/endpoints.py:35-452 in
  server::api::vector_file_resolution. Expose typed RequestFacts and injected B1020 authorization/credential
  lookup, B1016 unified-id parsing, B1019 legacy file routing, B1021 managed-id requirement, B1062 registry,
  B1061 endpoint permissions, B174 provider enum conversion and B2400 header/query/body accessors. The source helpers do not perform
  provider HTTP; HTTP routes in B1076/B1081 call this layer. Keep every ordering decision below visible in
  native tests; B171 adapters compare pure request/response projections with pre-resolved dependency answers.
  They must not invoke FastAPI routes or load proxy globals. Managed-id validation itself stays B1021.

  Default router/auth/managed store is null and should_lookup_registry=true. Provider fallback is openai.
  B1021 owns litellm_settings.require_managed_files=false and its loader test. The unified and legacy
  decoders are B1016/B1019; extend their existing corpora. Helpers use already-decoded JSON and add no
  parser. The 418-line source span includes long docs and 331 nonblank/non-comment physical lines;
  budget 280 implementation, 200 tests, 90 adapters, 145 fixtures and 65 wiring/corpus, 780 total.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/vector_file_resolution.rs
  - crates/betterlite-server/src/api/vector_file_resolution/**
  - crates/betterlite-core/fuzz/corpus/managed_resource_ids/vector-file-*
  - tools/oracle/src/helpers/server/vector_file_resolution.rs
  - tools/oracle/src/helpers/server/vector_file_resolution/**
  - tools/oracle/helpers/vector_file_resolution.py
  - tools/oracle/helpers/vector_file_resolution/**
  - tools/oracle/fuzz/corpus/helper_case/vector-file-resolution-*
  - tools/oracle/cases/helpers/vector-file-resolution/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_files_endpoints/endpoints.py#L35-L452
  why: Complete helper functions specify managed-id decoding, response id restoration and model/provider selection order.
dod:
- text: >-
    unified_file_routing first validates the original id through B1021. With require_managed_files=true,
    raw file_a gives 400 detail="Raw provider file ids cannot be used when require_managed_files is enabled in litellm_settings. Use the LiteLLM managed file id returned when the file was created."
    and unified id without MIT access hook gives 500 detail="Managed resource ownership validation is unavailable.".
    Otherwise decode a unified file containing target_model_names=[m1,m2],llm_output_file_id=" file_a ":
    choose m1,trim file_a, apply its credentials and return original id for restoration. Without credentials
    or router still replace file_id when extraction succeeds. Missing provider id with credentials passes null
    to prepare_data_with_credentials; malformed parsed payload leaves data unchanged but returns original id.
    Regex extraction failure is silently ignored. Legacy routing delegates with check_file_id_encoding=true;
    routed legacy id returns original for restoration, unrecognized raw id returns null restoration.
  proof: [resolution-tests, oracle, helper-python, id-corpus]
- text: >-
    restore_file_identifiers sends dict {id:provider,file_id:provider,other:x} and gets both fields replaced
    with managed. Dict without either key is unchanged. Object with both attributes changes only id;
    object with only file_id changes it, and null response stays null. This projection does not recursively
    replace ids inside list.data or vector_store_id.
  proof: [resolution-tests, oracle, helper-python]
- text: >-
    model_hint_precedence bypasses all hints when data.api_key or api_base is non-null, including "".
    Otherwise data.model wins truthy query model, which wins x-litellm-model header. Authorize a string
    only when it equals the user-controlled query/header hint; identical body and query values do authorize.
    Wildcard "team/*" uses team_id-aware lookup only with router; exact string uses get_credentials_for_model
    even without router and retains that helper's error. Auth=null makes authorization a no-op. Credentials
    are applied only when routing succeeds and lookup is non-null; otherwise enter team fallback.
  proof: [resolution-tests, oracle, helper-python]
- text: >-
    team_model_fallback ignores non-list team_models, non-string entries and literals all-team-models,
    all-proxy-models,no-default-models. For one OpenAI deployment apply its credentials after authorization;
    provider may be inferred from model=openai/gpt-4o only when custom_llm_provider is null. Two OpenAI
    matches authorize both then leave data unchanged. Duplicate names count twice. No OpenAI match and exactly
    one remaining name authorizes it and sets model only; zero or multiple names leave data unchanged.
    Missing router or identity stops fallback. Never silently select the first of two eligible deployments.
  proof: [resolution-tests, oracle, helper-python]
- text: >-
    unified_store_and_registry_overlay decodes model_id=m1 before target_model_names=[m2],replaces
    vector_store_id with truthy provider_resource_id and returns without legacy registry lookup, even for
    invalid parsed unified payload. Legacy pre-resolved store wins lookup; should_lookup_registry=false
    disables another lookup. Present top-level provider and credential copy even null, then non-null
    litellm_params overrides them and any request fields. Missing/null params contributes {}. No access
    check occurs in this helper; routes must have called B1061 first.
  proof: [resolution-tests, oracle, helper-python]
- text: >-
    provider_and_index_permissions picks truthy data.custom_llm_provider, then custom-llm-provider header,
    then custom_llm_provider query. Only if the result is null and method is POST/PUT/PATCH read body;
    final null becomes openai. A final empty string or unknown enum returns null and skips permissions;
    GET never reads a provider body. With known provider, missing/null metadata maps to {} and both
    allowed_vector_store_indexes values falsey skip checking; either truthy key/team value calls B1061
    with original path store id, request and identity. Propagate its error unchanged. Add the externally
    tagged vector_file_resolution helper seed and preserve ordered lookup/authorization traces.
  proof: [resolution-tests, oracle, helper-python, helper-corpus]
checks:
  optional: []
  commands:
  - id: resolution-tests
    why: attached-file credential precedence or original-id permission ordering is absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_file_resolution::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: projections are not compared independently from resolved request facts
    run: test -f tools/oracle/helpers/vector_file_resolution.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: id-corpus
    why: unified attached-file and store ids lack new decoder seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/managed_resource_ids/vector-file-*)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::replays_corpus$/)'
  - id: helper-corpus
    why: the new projection variant has no case-parser input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector-file-resolution-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vector-file-resolution/unified-file-routing.yaml
- tools/oracle/cases/helpers/vector-file-resolution/restore-file-identifiers.yaml
- tools/oracle/cases/helpers/vector-file-resolution/model-hint-precedence.yaml
- tools/oracle/cases/helpers/vector-file-resolution/team-model-fallback.yaml
- tools/oracle/cases/helpers/vector-file-resolution/unified-store-and-registry-overlay.yaml
- tools/oracle/cases/helpers/vector-file-resolution/provider-and-index-permissions.yaml
deviations:
- what: >-
    Keep MIT managed-file behavior pending Max's decision: require_managed_files=false permits raw and decoded
    ids; true rejects raw ids with 400 and managed ids without an ownership hook with 500 as specified above.
  why: No enterprise managed_files hook is built while the managed-files/batches policy remains open.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1062-L1118
out_of_scope:
- B1081 owns create/update/delete handlers and B1076 list/retrieve/content in this file; those tasks supply every actual route/auth HTTP case.
- B2400 owns provider-source accessors; B1020 owns get_credentials_for_model, authorize_model_for_key, prepare_data_with_credentials and handle_model_based_routing.
- B1016/B1019 own id decoding and B1021 owns managed-id validation and its flag, so no second decoder or ownership policy is introduced here.
pitfalls:
- 'The oracle helper for this task is pre-registered as vector_file_resolution in the server group. Replace the stub Op in tools/oracle/src/helpers/server/vector_file_resolution.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vector_file_resolution.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A non-null empty api_key suppresses model-hint credential lookup.
- Two eligible OpenAI team models leave the request unresolved after authorizing both.
- Unified store decoding bypasses the legacy registry even when the parsed fields are unusable.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
