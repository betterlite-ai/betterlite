  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_resolution::/)
      - test(/::replays_corpus$/)'
  - id: case-managed-file-provider-id
    why: the managed-file-provider-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_resolution::tests::managed_file_provider_id($|::)/)'
  - id: case-model-hint-authorized
    why: the model-hint-authorized behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_resolution::tests::model_hint_authorized($|::)/)'
  - id: case-cross-owner-file-denied
