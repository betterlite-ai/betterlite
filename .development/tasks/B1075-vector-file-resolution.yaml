id: B1075
title: Vector file resolution
description: >-
  Resolve managed file/vector-store IDs, model hints and provider credentials for vector-store file requests using
  managed-resource-access and file-credentials. Restore external file IDs in responses and perform permission checks
  before using a stored credential or model routing hint.


  Implement crates/betterlite-core/src/api/vector_file_resolution.rs. Use VectorFileResolutionInput and VectorFileResolutionResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions managed_file_provider_id, model_hint_authorized, cross_owner_file_denied,
  response_unified_file_id, registry_credential_precedence under api::vector_file_resolution::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorFileResolution in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_file_resolution: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/vector_store_files_endpoints/endpoints.py: _update_request_data_with_managed_file_id
  (L35-L171); litellm/proxy/vector_store_files_endpoints/endpoints.py: _replace_file_id_in_response (L174-L204);
  litellm/proxy/vector_store_files_endpoints/endpoints.py: _authorize_model_routing_hint (L207-L215); litellm/proxy/vector_store_files_endpoints/endpoints.py:
  _update_request_data_with_model_routing_hint (L218-L313); litellm/proxy/vector_store_files_endpoints/endpoints.py:
  _update_request_data_with_litellm_managed_vector_store_registry (L316-L408); litellm/proxy/vector_store_files_endpoints/endpoints.py:
  _resolve_provider (L411-L431); litellm/proxy/vector_store_files_endpoints/endpoints.py: _maybe_check_permissions
  (L434-L452). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 286 owned nonblank/non-comment/non-docstring Python lines (331 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 306 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 556 total within the 560-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1017 (Managed resource access), B1020
  (File credentials), B1061 (Vector endpoint access), B1062 (Vector store registry), B1087 (Api boundaries), B1016
  (Managed resource ids), B1021 (File upload options), B002 (Load LiteLLM config.yaml into typed config). These
  are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on
  the provider and keys/data branches.
