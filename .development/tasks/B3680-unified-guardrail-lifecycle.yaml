id: B3680
title: Unified guardrail lifecycle hooks, registry and HTTP cases
description: >-
  Build the part of `UnifiedLLMGuardrails` (litellm/proxy/guardrails/guardrail_hooks/unified_guardrail/unified_guardrail.py,
  lines 171-380) that runs a guardrail at the pre-call, during-call and post-call points, fill B3679's translation
  registry, and add the HTTP oracle cases for every endpoint family that the earlier parts left for the umbrella.
  The split parts supply the pieces: B6160 (completion, embeddings, image, speech, transcription, video), B6161
  (chat, Responses, Anthropic), B6162 (pass-through and Bedrock), B6163 (A2A) and B6164 (the incremental stream
  loop). B3679 supplies the registry type, `resolve_endpoint_translation`, `infer_call_type`,
  `ensure_request_metadata` and the stream helpers. B3681 owns the streaming iterator hook and guardrail_initializers.py.
  This task registers no route.

  Code goes in crates/betterlite-server/src/guardrails/unified_guardrail.rs and unified_guardrail/. Files:
  translation.rs, other_adapters.rs, entries.rs, hooks.rs and recorder.rs.

  `translation.rs`: the enum `UnifiedTranslation<S, H>` (generic over B6161's stamp source `S` and B6162's
  post-call hook `H`) with one variant per adapter: B6160's six, B6161's three, B6162's endpoint wrapper and Bedrock
  adapter, B6163's `A2ATranslation`, and the four adapters of `other_adapters.rs`. It implements B3661's
  `BaseTranslation` by matching on the variant and forwarding each method. This is the `T` of
  `TranslationRegistry<T>`; betterlite-guardrails cannot name these types because it cannot depend on
  betterlite-server, so the enum lives here. Forward every method, including the two class flags.

  `other_adapters.rs`: three adapters over handlers that other tasks ship as plain functions or their own types:
  `RerankTranslation` for B1419's Cohere rerank handler (rerank, arerank), `GoogleGenAiTranslation` for B1391's handler (generate_content, agenerate_content,
  generate_content_stream, agenerate_content_stream) and `McpTranslation` for B3818's MCP handler (call_mcp_tool,
  list_mcp_tools). If one of those tasks already implements `BaseTranslation` for its handler, use that type directly
  as the variant and skip its adapter. Each adapter calls the handler with the arguments it takes and keeps B3661's
  defaults for every method LiteLLM does not define.

  `entries.rs`: `pub fn build_registry(config: RegistryConfig<S, H>) -> TranslationRegistry<UnifiedTranslation<S, H>>`
  builds the explicit `Vec<TranslationEntry>`: for each table constant of B6160 (six), B6161 (three, with the
  `chat_completions` flag true for completion and acompletion only), B6163 (`A2A_CALL_TYPES`) and the three tables
  of `other_adapters.rs`, one entry per call type. For pass-through, read B6162's `PASSTHROUGH_TABLE` and
  `passthrough_provider_list`, build `LlmPassthroughRouteHandler::new(providers)` for the `LlmRoute` kind, and use the
  endpoint wrapper for the `Endpoint` kind. `RegistryConfig` carries what the adapters need and nothing is read
  from config here: the stamp source, the post-call hook, the Bedrock skip flags and user metadata. No file scanning.
  A test asserts the 14 tables of the pinned `guardrail_translation_mappings` dicts (chat, responses, anthropic, text completion,
  embeddings, image, speech, transcription, videos, pass_through, rerank, google_genai, a2a and mcp) is present once each, and that no call type appears twice.

  `hooks.rs`: three async functions on a struct `UnifiedGuardrailHooks<S, H, R>` holding the registry and a
  `R: AppliedGuardrailRecorder`. The struct holds no per-request state. Each hook takes the guardrail as a
  `&G: GuardrailContract` plus its `GuardrailBase` (B5471), the request data map, the key dict and the call type.
  Behavior follows LiteLLM exactly.
  - "`pre_call(guardrail, data, user_api_key_dict, call_type)`. The \"guardrail to apply\" key of LiteLLM's data dict"
    is a typed argument here: when it is `None`, return `data` unchanged. Event type is pre_call, or pre_mcp_call
    when `call_type` is in the MCP call types (call_mcp_tool, list_mcp_tools). Ask B3665's `should_run_guardrail(data,
    event_type, suppressed)` with an empty `suppressed` set; the gate returns `Result`, and an `Err` converts to
    `GuardrailFailure` and is returned. A false result returns `data`. Resolve the translation with B3679's
    `resolve_endpoint_translation`; unmapped returns `data`. Call B3679's `ensure_request_metadata`, then the
    translation's `process_input_messages` with the logging object from `data["litellm_logging_obj"]`. Unless the
    guardrail's `records_own_guardrail_information` is true, call the recorder with the guardrail name. Return the
    data.
  - "`moderation(...)`. Same, with during_call or during_mcp_call, and no header call."
  - "`post_call_success(guardrail, data, user_api_key_dict, response)`. No guardrail returns `None`. A false gate"
    result (post_call) returns `None`. Resolve the call type in this order: the first call type of
    `get_call_types_for_route(user_api_key_dict.request_route)` (B207) when the route is set and has any; else
    B3679's `infer_call_type(response kind)`; else the logging object's call type, accepted only when it is
    pass_through, allm_passthrough_route, ocr or aocr. Unresolved: log a warning that names the guardrail and route
    ("Guardrail '<name>' selected for route '<route>' but its call type could not be resolved; skipping post-call
    scanning.") and return the response. Resolved but unmapped: log the second warning of LiteLLM (read it at line
    347) and return the response. Otherwise call `process_output_response`. On `ModifyResponse` with no
    `original_response`, set it to the response and return the failure. Then the recorder call as in pre_call, and
    return the response.
  - "Every apply_guardrail call that a translation makes for one of these hooks is recorded the way LiteLLM's"
    log_guardrail_information records it: B3664's `GuardrailInvocation::begin` with `GuardrailHookName::ApplyGuardrail`
    and the inputs before the call, then `finish_success` with the result or `finish_failure` with the error. At the pin
    36 apply_guardrail methods carry @log_guardrail_information and CustomGuardrail.__init_subclass__ (custom_guardrail.py
    L183-L188) wraps every other subclass's own apply_guardrail, so every guardrail records here.

  `recorder.rs`: the trait `AppliedGuardrailRecorder { fn record(&self, request_data: &mut Map, guardrail_name: Option<&str>) }`
  stands in for LiteLLM's `add_guardrail_to_applied_guardrails_header` (callback_utils.py). This task also builds the real one, `MetadataGuardrailRecorder`, a unit struct whose `record` is that function (callback_utils.py L591-L599): a None name does nothing; otherwise take the request's metadata bucket the way LiteLLM's get_or_create_metadata_bucket does (read it at the pin), and append the name to its `applied_guardrails` list when the name is not there yet, or create the list holding only that name. Tests use a double; B8399 passes `MetadataGuardrailRecorder` in production.

  One source for the guardrail name. The hooks read it once, from `GuardrailBase`'s settings `guardrail_name`
  (B5471), and pass the same `Option<&str>` to the recorder and to every translation call. B6161 and B6164 take it
  from B3661's trait argument.

  Global skip flags. B3680 owns the config section `guardrail_message_skip` (crates/betterlite-config/src/sections/guardrail_message_skip.rs) with `Settings { skip_system_message: bool, skip_tool_message: bool }`, both default false. It reads the `litellm_settings` keys `skip_system_message_in_guardrail` and `skip_tool_message_in_guardrail`. LiteLLM sets them as module attributes of litellm (defaults False, litellm/__init__.py L238-L239) and reads them only in `effective_skip_system_message_for_guardrail` and `effective_skip_tool_message_for_guardrail` (llms/base_llm/guardrail_translation/utils.py L194-L209, B3663's), each as `bool(...)` when the guardrail's own value is None. Where the pinned code reads the same module attribute elsewhere (the registry's scoping check in guardrail_registry.py) B3682 takes it as its `global_skip_tool_message` argument. B3680 gives both values to the hooks: `UnifiedGuardrailHooks` is built with `skip_defaults: GuardrailSkipDefaults { system: bool, tool: bool }` filled by the server from `config.sections.guardrail_message_skip`, and the same `tool` value is what the server passes to B3682's `InMemoryGuardrailHandler::new` as `global_skip_tool_message`. In `pre_call` and `moderation`, the hook resolves the two flags with B3663's effective functions (the guardrail's own scoping value when set, else the default) and passes them in the per-call context to the translation's `process_input_messages`. Nothing else in betterlite reads the two keys.

  HTTP oracle cases. Each case boots both gateways with a `litellm_content_filter` guardrail (B3693, no network)
  that blocks a fixed word, sends the request, and compares status, error body, headers and the upstream request.
  Put them in tools/oracle/cases/guardrails/unified-lifecycle/. One file per case, named in oracle_cases below: chat pre-call block and mask, chat post-call block, chat during-call block,
  Responses, Anthropic Messages (pre-call and post-call), text completion, embeddings, image generation and pass-through
  pre-call blocks, and a post-call case for a route with no translation that must return the response unchanged. Each
  case runs against both gateways. These are the cases that B3574, B3675, B3676, B3677, B5820 and B3678 left for the
  umbrella, except speech, transcription, video, rerank and MCP. Those need provider mocks the content filter case
  cannot reuse, so B3680 lists those as a deviation below.

scope:
  paths:
    - crates/betterlite-server/src/guardrails/unified_guardrail.rs
    - crates/betterlite-server/src/guardrails/unified_guardrail/**
    - crates/betterlite-config/src/sections/guardrail_message_skip.rs
    - crates/betterlite-config/src/sections/guardrail_message_skip/**
    - tools/oracle/cases/guardrails/unified-lifecycle/**
    - tools/oracle/helpers/b3680.py
    - tools/oracle/helpers/b3680/**
    - tools/oracle/src/helpers/server/b3680.rs
    - tools/oracle/src/helpers/server/b3680/**
  lint_tables: false

