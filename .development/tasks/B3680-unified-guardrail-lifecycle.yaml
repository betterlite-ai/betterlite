dod:
  - text: The enum forwards every `BaseTranslation` method and both class flags to the variant it holds, for all variants.
    proof: [translation-enum-tests]
  - text: The three adapters for rerank, Google GenAI and MCP call their handlers and keep the trait defaults elsewhere.
    proof: [other-adapter-tests]
  - text: The registry holds every table once, only completion and acompletion carry the chat-completions flag, and no call type is listed twice.
    proof: [registry-tests]
  - text: Pre-call and moderation hooks return the data unchanged when there is no guardrail, the gate says no, or the call type is unmapped, and otherwise add metadata and run the input rewrite.
    proof: [input-hook-tests, oracle]
  - text: The pre-call hook records the applied guardrail only when the guardrail does not record its own information, and the moderation hook never does.
    proof: [recorder-tests, oracle]
  - text: Every apply_guardrail call made for the pre-call, moderation and post-call hooks gets one B3664 `GuardrailInvocation` with `ApplyGuardrail`, finished with success or with the failure, and none when the guardrail recorded its own entry, as LiteLLM's log_guardrail_information does for the 36 decorated apply_guardrail methods and the ones __init_subclass__ wraps.
    proof: [apply-record-tests]
  - text: MetadataGuardrailRecorder ignores a None name, creates applied_guardrails with the name when the metadata bucket has none, and adds a name once, never twice.
    proof: [recorder-tests]
  - text: The post-call hook resolves the call type in the order route, response kind, logging call type, warns and returns the response when unresolved or unmapped, and sets `original_response` on a block.
    proof: [post-call-tests, oracle]
  - text: The guardrail_message_skip section reads litellm_settings.skip_system_message_in_guardrail and skip_tool_message_in_guardrail as booleans that default to false, and the pre-call and moderation hooks use them only when the guardrail's own value is unset.
    proof: [skip-defaults-tests]
  - text: Pre-call, during-call and post-call blocks and masks reach clients through the booted proxy with the same status, error body and headers as LiteLLM on the endpoint families the cases cover.
    proof: [oracle, http-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: translation-enum-tests
      why: a variant misses a method or a flag in the forwarding
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::translation::tests::/)'
    - id: other-adapter-tests
      why: an adapter for rerank, Google GenAI or MCP skips its handler
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::other_adapters::tests::/)'
    - id: registry-tests
      why: a table is missing, a call type is duplicated or the chat flag is on the wrong entries
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::entries::tests::/)'
    - id: input-hook-tests
      why: a skip rule, the metadata setup or the input rewrite call is missing in pre-call or moderation
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::hooks::tests::input_/)'
    - id: recorder-tests
      why: the applied-guardrail record is written when it must not be, or not written when it must
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::hooks::tests::recorder_/)'
    - id: apply-record-tests
      why: an apply_guardrail call on the unified path leaves no guardrail invocation record, or leaves two
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::hooks::tests::apply_record_/)'
    - id: post-call-tests
      why: the call type order, a warning path or the original_response handling is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::unified_guardrail::hooks::tests::post_call_/)'
    - id: skip-defaults-tests
      why: the two global skip flags are not read from litellm_settings or do not reach the hooks
      run: cargo nextest run --locked -p betterlite-config -p betterlite-server --no-tests=fail -E 'test(/^(sections::guardrail_message_skip::|guardrails::unified_guardrail::hooks::tests::skip_)/)'
    - id: http-case-corpus
      why: the HTTP cases are not added in this change
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/guardrails/unified-lifecycle)"

oracle_cases:
  - tools/oracle/cases/guardrails/unified-lifecycle/chat-pre-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/chat-pre-call-mask.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/chat-post-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/chat-during-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/responses-pre-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/anthropic-messages-pre-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/anthropic-messages-post-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/text-completion-pre-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/embeddings-pre-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/image-generation-pre-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/passthrough-pre-call-block.yaml
  - tools/oracle/cases/guardrails/unified-lifecycle/unmapped-route-post-call-skipped.yaml

deviations:
  - what: There are no HTTP cases for the speech, transcription, video, rerank, Google GenAI and MCP guardrail paths, and none for the applied-guardrails header.
    why: The content filter cases cannot drive those provider mocks, and the applied-guardrails header case is B8399's (tools/oracle/cases/guardrails/proxy-logging/applied-guardrails-header.yaml).
  - what: The guardrail to apply is a typed argument of each hook, not the "guardrail_to_apply" key that LiteLLM pops from the request data.
    why: A typed argument keeps the guardrail out of the JSON body; clients see no difference.
  - what: The applied-guardrail header call goes through the `AppliedGuardrailRecorder` trait.
    why: Tests use a double through the trait; MetadataGuardrailRecorder here is the real function, and B8399's header case checks it through the booted proxy.

out_of_scope:
  - "The ocr and aocr entries and the Mistral OCR handler: B036 depends on tasks that depend on B3680, so B3680 cannot depend on it. B036 owns them and the architect decides how they join the registry."
  - The six adapters for completion to video; B6160 owns them.
  - The chat, Responses and Anthropic adapters and the undeliverable conversion; B6161 owns them.
  - The pass-through and Bedrock adapters; B6162 owns them.
  - The A2A handler; B6163 owns it.
  - The incremental stream loop; B6164 owns it.
  - "`async_post_call_streaming_iterator_hook`, the stream chunk predicates' use in buffering, `resolve_streaming_flag` and guardrail_initializers.py; B3681 owns them."
  - HTTP cases for streamed responses; B3681 adds them with the iterator hook.
  - The registry type, `infer_call_type`, `ensure_request_metadata` and the stream emit helpers; B3679 owns them.
  - "`should_run_guardrail`; B3665 owns it."
  - "The x-litellm-applied-guardrails header case through the booted proxy: B8399."

pitfalls:
  - The post-call hook returns `None`, not the response, when there is no guardrail or the gate is false; the other exits return the response.
  - The moderation hook must not call the recorder, and the pre-call hook skips it for guardrails that record their own information.
  - Call types come from the route first; `infer_call_type` is a fallback, and the logging call type is accepted for only four values.
  - MCP call types use the pre_mcp_call and during_mcp_call events; every other call type uses pre_call and during_call.
  - The sync `llm_passthrough_route` call type has no entry and must stay that way.
  - The cases use the content filter guardrail only, so they need no network beyond the mock provider.
  - "The global skip flags are `litellm_settings` keys, not environment variables, and a guardrail's own value of false still beats a global true: only an unset (None) own value falls back to the global."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
