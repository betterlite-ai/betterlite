id: B949
title: Responses mcp discovery
description: >-
  Discover MCP tools using the selected authorized server set and B136 manager with B137 request-scoped headers
  and credentials. Export captured tool schemas plus call context to Responses orchestration; preserve parent tags
  and never persist request credentials in registry state.


  Implement crates/betterlite-core/src/api/responses_mcp_discovery.rs. Use ResponsesMcpDiscoveryInput and ResponsesMcpDiscoveryResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions authorized_server_tools, forwarded_mcp_headers, request_context_restored,
  tool_discovery_error under api::responses_mcp_discovery::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesMcpDiscovery in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_mcp_discovery: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._get_mcp_tools_from_manager
  (L235-L352); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._process_mcp_tools_to_openai_format
  (L417-L447); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._process_mcp_tools_without_openai_transform
  (L450-L503); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._transform_mcp_tools_to_openai
  (L507-L510); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._transform_mcp_tools_to_openai
  (L514-L517); litellm/responses/mcp/litellm_proxy_mcp_handler.py: LiteLLM_Proxy_MCP_Handler._transform_mcp_tools_to_openai
  (L520-L537); litellm/responses/mcp/request_context.py: MCPRequestContext.resolve (L45-L90); litellm/responses/mcp/request_context.py:
  MCPRequestContext.resolve_guardrail_context (L93-L142). Abstract/protocol declarations map to native types and
  synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 273 owned nonblank/non-comment/non-docstring Python lines (322 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 293 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 525 total within the 530-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B136 (MCP gateway server, transports and server registry), B137 (MCP auth, OAuth flows,
  BYOK and outbound credentials), B171 (Direct helper oracle and URL path encoding), B948 (Responses mcp selection),
  B1087 (Api boundaries), B905 (Responses parameters). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
