deviations:
  - what: >-
      The sync sampling rate uses LANGSMITH_SAMPLING_RATE (a legacy name from an earlier integration),
      while the async sampling rate uses ARGILLA_SAMPLING_RATE. Both are digit-only parsers that
      fall back to 1.0 if the string is not all digits.
    why: >-
      The source code implements this distinction explicitly: sync uses a local digit-parser for
      LANGSMITH_SAMPLING_RATE (line 60-62), while async uses a pre-computed digit-parsed
      ARGILLA_SAMPLING_RATE from __init__ (line 231, 59-63).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/argilla.py#L59-L63

  - what: >-
      The async timeout value is a fixed 60000 milliseconds (60 seconds) and cannot be overridden
      by configuration or request parameters.
    why: >-
      The source hardcodes timeout=60000 in the async_send_batch call (line 324).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/argilla.py#L324

  - what: >-
      The sync _send_batch clears the queue after any HTTP response (2xx success or error status),
      while the async async_send_batch clears only on successful HTTP status before raise_for_status.
    why: >-
      Sync explicitly calls self.log_queue.clear() after the response handling block regardless of
      status (lines 192-193); async clears only after raise_for_status succeeds (implied by the
      structure at line 326).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/argilla.py#L188-L193

  - what: >-
      The async_dataset_hook from other CustomLogger instances in litellm.callbacks is applied
      before queueing the item. If any hook returns None, the item is not queued and the method
      returns early.
    why: >-
      The source iterates litellm.callbacks, checks isinstance(callback, CustomLogger), and
      awaits async_dataset_hook; if data becomes None after a hook call, it breaks the loop and
      returns (lines 248-258).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/argilla.py#L248-L258

out_of_scope:
  - B002 owns environment variable lookup and default value injection.
  - B173 owns HTTP pool and sync/async request execution (module_level_client.get/post and async_httpx_client.put).
  - B189 owns CustomLogger initialization contract and callback registry.
  - B256 owns CustomBatchLogger base class, batch_size defaults, periodic_flush task setup and flush_queue implementation.
  - Custom logger's async_dataset_hook execution is an external hook mechanism not owned by B114; B189 owns the registry but not dataset-specific hook implementations.
  - The is_serializable helper function (lines 32-39) has no callers at the pin and is not built.

pitfalls:
  - The oracle helper at tools/oracle/src/helpers/logging/b3960.rs is pre-registered by the skeleton; do not add it to registry files.
  - The sync sampling uses LANGSMITH_SAMPLING_RATE (legacy name), not ARGILLA_SAMPLING_RATE. This is a literal environment variable name in the source.
  - Digit-only parser uses str.isdigit() after stripping whitespace; a float string like "0.5" fails the check and falls back to 1.0.
  - Dataset ID caching uses the original name as key; if dataset resolution fails (empty items list), the name itself is used as the ID.
  - Transformation object validation happens in __init__ before any request; invalid objects fail eagerly.
  - async_dataset_hook is awaited; exceptions from hooks are caught and NotImplementedError is silently ignored (lines 254-255).
  - sync _send_batch clears the queue even after an error response; async _send_batch only clears after successful raise_for_status.
  - Batch size is inherited from B256's base class; override via ARGILLA_BATCH_SIZE env var or litellm.argilla_batch_size.
  - get_chat_messages and get_str_response raise plain exceptions with literal messages on missing/invalid payload shapes; these error paths must be covered in tests and oracle cases.

