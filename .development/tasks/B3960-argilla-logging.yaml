    proof: [argilla-validation-test, argilla-validation-oracle]

  - text: "Dataset GET returns items[0].id when items is non-empty list; uses name as-is otherwise. Resolution is cached for the session."
    proof: [argilla-dataset-test, argilla-dataset-oracle]

  - text: "Transformation mapping iterates transformation_object and populates fields dict from payload values, extracting messages as list and response as string."
    proof: [argilla-mapping-test, argilla-mapping-oracle]

  - text: "Sync log_success_event samples using LANGSMITH_SAMPLING_RATE (digit-only parser, fallback 1.0). Matching samples call _send_batch on batch threshold."
