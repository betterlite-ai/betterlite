    proof: [argilla-sync-batch-test, argilla-sync-batch-oracle]

  - text: "Async async_log_success_event samples using ARGILLA_SAMPLING_RATE (digit-only parser, fallback 1.0). Matching samples apply async_dataset_hook from litellm.callbacks, skip logging if hook returns None."
    proof: [argilla-async-sampling-test, argilla-async-sampling-oracle]

  - text: "Async async_log_failure_event samples using ARGILLA_SAMPLING_RATE, logs to verbose_logger.info before processing, and omits the async_dataset_hook loop entirely. Matched samples are queued and trigger flush_queue on batch threshold."
    proof: [argilla-async-failure-test, argilla-async-failure-oracle]

  - text: "Async async_send_batch PUTs to /api/v1/datasets/{dataset_id}/records/bulk with {items: queue} envelope, timeout=60000, and clears queue on success."
    proof: [argilla-async-batch-test, argilla-async-batch-oracle]

