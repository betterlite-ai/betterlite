id: B3960
title: Argilla dataset mapping and batch logging
description: >-
  Build Argilla dataset discovery, field transformation mapping, sampling control and dual-mode
  batch callbacks. Implement dataset lookup by name with ID caching, required transformation-object
  validation, sync/async batch delivery with distinct wire formats, and sampling-rate logic with
  fallback parsing.

  Read ARGILLA_API_KEY, ARGILLA_BASE_URL (default http://localhost:6900/), ARGILLA_DATASET_NAME
  (default litellm-completion), ARGILLA_BATCH_SIZE and ARGILLA_SAMPLING_RATE from B002; use B173
  for GET /api/v1/me/datasets and bulk POST/PUT requests; build on B189's CustomLogger
  initialization contract and B256's batch base and periodic flush. Validate that
  argilla_transformation_object is a dict with all values in SUPPORTED_PAYLOAD_FIELDS (messages,
  response); fail fast at initialization if invalid.

  Dataset discovery: on first initialization, GET /api/v1/me/datasets?name=<name> with
  X-Argilla-Api-Key header, extract items[0].id if items is a non-empty list, otherwise use the
  name as-is. Cache the resolved ID for the session. Message/response extraction reads messages
  from payload (list or single dict) and response as string or dict-with-choices. Field mapping
  iterates the transformation object and populates fields from payload values.

  Sync batch: POST /api/v1/datasets/{dataset_id}/records/bulk with the log_queue as JSON body
  (array of items, each an {fields: {...}} record). Sample using LANGSMITH_SAMPLING_RATE (digit-only
  parser, fallback 1.0). Clear queue on HTTP response (2xx or error); log errors but do not re-raise.
  On batch-size threshold, call _send_batch immediately.

  Async batch: PUT /api/v1/datasets/{dataset_id}/records/bulk with {items: [...]} envelope and
  timeout=60000. Sample using ARGILLA_SAMPLING_RATE (digit-only parser, fallback 1.0). Support
  async_dataset_hook chaining from other CustomLogger instances (B189): apply each hook in
  litellm.callbacks, catching NotImplementedError, and skip logging if hook returns None.
  Queue threshold triggers flush_queue from B256. async_log_failure_event omits the async_dataset_hook
  loop entirely; only sampling and verbose_logger.info logging carry over before queueing.

  Preserve the digit-only sampling parser (decimal string "0.5" falls back to 1.0). Do not change
  the async timeout value. Sync queue clears after response even on error; async queue clears only
  after successful flush from B256. Batch size defaults and overrides via env var or litellm.argilla_batch_size
  follow B256 ownership.

