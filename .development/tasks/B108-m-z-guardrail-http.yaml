dod:
  - text: Booted-proxy cases show the decision model blocking, passing, failing closed with 502 and failing open.
    proof: [oracle]
  - text: Booted-proxy cases show PromptGuard blocking input and output, redacting, allowing and both block_on_error settings.
    proof: [oracle]
  - text: Booted-proxy cases show Qostodian Nexus blocking with an unwrapped reason, replacing the request text and failing closed on a scan error, with the scan's path and content-type compared.
    proof: [oracle]
  - text: Booted-proxy cases show Qualifire blocking, monitoring, using the invoke endpoint and passing.
    proof: [oracle]
  - text: Booted-proxy cases show Singulr blocking, allowing and both block_on_error settings.
    proof: [oracle]
  - text: Booted-proxy cases show Zscaler blocking input and output, allowing, and its unavailable and rate limit errors, and an unauthenticated request is refused before any scan.
    proof: [oracle]
