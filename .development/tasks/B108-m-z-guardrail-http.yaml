deviations: []
out_of_scope:
  - "The classes and their initializers: B8210 (decision model), B8211 (PromptGuard), B8212 (Qostodian Nexus over B3770 and B3771's generic guardrail API), B8213 (Qualifire), B8215 (Singulr) and B8216 (Zscaler). Registry arms: B8521. Running a held guardrail: B8666. Installing callbacks: B8613. Proxy hook dispatch: B8399. Config guardrail startup: B3683. The decisions call: B3513 to B3515 and B524."
  - "The `/upstream/{i}/body` selector the Qostodian cases use: B9850. The fields inside the generic guardrail API body, the forwarded x-qostodian-nexus-identifiers-* headers included, are left to B3770's, B3771's and B8212's tests."
  - "Semantic guard (B8214, B3808): semantic-router is not in tools/oracle/litellm's lock file, so LiteLLM cannot load the class in the oracle (see the B108 report notes)."
  - "The four class runtimes and their cases: B9460 to B9464. Noma, Ovalix, Pangea, Prompt Security, Repello, custom code and the judge: B9465."
  - "Streamed responses: the streaming cases across guardrails are B8993's."
pitfalls:
  - "Only the Qostodian cases skip a scan body; every other case compares each captured body whole. Singulr sends litellm_call_id as correlation_id, so send x-litellm-call-id oracle-call-1 on every Singulr request (LiteLLM honors it in common_request_processing.py L273-L276)."
  - "PromptGuard and Singulr raise GuardrailRaisedException without should_wrap_with_default_message false, so the client message carries LiteLLM's default guardrail prefix; Ovalix-style unwrapped messages do not apply here."
  - "Qostodian's block uses should_wrap_with_default_message false, so its message is the blocked_reason alone, unlike PromptGuard and Singulr; a BLOCKED answer without blocked_reason gives \"Content violates policy\"."
  - "The generic guardrail API appends /beta/litellm_basic_guardrail_api to api_base unless it already ends with it, so api_base stays {{upstream}} with no path."
  - "Zscaler's api_base is the full detection URL, not a base; LiteLLM appends nothing to it."
  - "Zscaler joins every text with a space into one content field and sends one call per scan, not one per message."
  - "Singulr rejects a plain http base unless the host is localhost or 127.0.0.1; {{upstream}} is http://127.0.0.1:<port>, so it passes."
  - "The decision model's call goes through the router with num_retries 0 and no fallbacks, so one 500 is one upstream call even without router_settings."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
