id: B108
title: Booted-proxy cases for the decision model, PromptGuard, Qostodian Nexus, Qualifire, Singulr and Zscaler guardrails
description: >-
  B108's parts built the M to Z guardrail classes, and B9460 to B9465 finish the four class runtimes and the HTTP
  cases for the others. What is left is the booted-proxy proof for the classes B8210 to B8216 built, which were
  planned before any chat route ran a guardrail: B8210 the decision model, B8211 PromptGuard, B8212 Qostodian Nexus,
  B8213 Qualifire, B8215 Singulr and B8216 Zscaler AI Guard. B8521 registers the wire names, B8666 runs a held
  guardrail through its class, B8613 installs the callbacks, B8399 runs the proxy hooks, B3683 starts the config
  guardrails, B004 serves the chat route, B3515 with B524 send the decision model's decisions call through the router,
  and B9850 lets a case skip one captured request body. This task writes no code and
  registers no route, guardrail kind or class. A case that fails because a class answers differently from LiteLLM goes
  back to that class's task as a finding and is never fixed here.


  Cases go in tools/oracle/cases/guardrails/m-z-guard-http. Use the booted-proxy case format with master key
  oracle-master, one deployment `chat` on `openai/gpt-oracle` with api_base {{upstream}} and api_key oracle-key, and
  router_settings.num_retries 0. Every vendor endpoint is the same mock, so the ordered upstream queue holds the
  guardrail calls and the model call in the order the hooks make them. Configure each guardrail in the top-level
  `guardrails:` list and select it with the request body's `guardrails` list. Compare status, content-type,
  x-litellm-applied-guardrails where the class records it, and the error type, param and code. On an error ignore
  /error/message only where it embeds the HTTP client's own error text, with that reason; keep
  every structured detail field compared. Compare the upstream requests the mock captured, so a 200 cannot hide a
  skipped scan, and list the vendor headers named below in upstream_headers. Ignore generated ids and timestamps in a
  200 body with a reason, and nothing else. Every case calls /v1/chat/completions.


  Decision model (guardrail decision_model, a second deployment `decider` on `openai/jev-oracle` with api_base
  {{upstream}}, decision_model decider, one check with action block, mode pre_call; the decisions call goes to the
  mock on the path LiteLLM's OpenAI decisions transformation builds). decision-block: the decisions answer flags the
  check, so the client gets 400 with {"error": "Violated decision model guardrail policy", "guardrail_name": ...,
  "flagged_checks": [...]} and the model is never called. decision-pass: the check is not flagged and the model
  answers. decision-fail-closed: the decisions call answers 500 and the client gets 502 with {"error": "Decision model
  guardrail failed to respond"}. decision-fail-open: unreachable_fallback fail_open and a 500, so the model answers.


  PromptGuard (guardrail promptguard, api_base {{upstream}}, api_key oracle-promptguard-key, so calls go to
  /api/v1/guard; list x-api-key and content-type). promptguard-block: decision block with threat_type, confidence and
  event_id; the client gets 400 with LiteLLM's wrapped guardrail message "Blocked by PromptGuard: ...".
  promptguard-redact: decision redact with redacted_messages and the model receives them. promptguard-allow: decision
  allow and the model answers. promptguard-block-output: mode post_call, the captured payload has direction output,
  and a block answer replaces the 200. promptguard-error-block: the guard answers 500 with block_on_error at its
  default true; ignore the text after "block_on_error=True): " with the HTTP client reason. promptguard-error-open:
  block_on_error false and a 500, so the model answers.


  Qostodian Nexus (guardrail qostodian_nexus, api_base {{upstream}}, so calls go to /beta/litellm_basic_guardrail_api;
  list content-type). Its initializer passes no api_key, unreachable_fallback or fail_on_error, so no x-api-key header
  goes out and errors fail closed. The generic guardrail API body carries request_headers with the inbound Host header,
  which names each gateway's own port, plus litellm_version and the call and trace ids, so every Qostodian case names
  `/upstream/0/body` with that reason; the scan's path and content-type and the model request after it stay compared.
  qostodian-blocked: mode pre_call and the answer {"action": "BLOCKED", "blocked_reason": "pii found"}; the client gets
  400 with the unwrapped message "pii found" and the model is never called. qostodian-intervened: action
  GUARDRAIL_INTERVENED with texts ["oracle text, cleaned"], and the model receives that text in place of the user
  message. qostodian-error: the scan answers 500 and the client gets 500 with "Generic Guardrail API failed: ...";
  ignore the text after that prefix with the HTTP client reason.


  Qualifire (guardrail qualifire, api_base {{upstream}}, api_key oracle-qualifire-key; list x-qualifire-api-key and
  content-type). qualifire-block: no checks configured, so prompt_injections is on and the call goes to
  /api/evaluation/evaluate; a flagged evaluation result gives 400 with {"error": "Violated guardrail policy",
  "qualifire_response": {score, status}}. qualifire-monitor: on_flagged monitor and a flagged result, so the model
  answers. qualifire-invoke: evaluation_id set, so the call goes to /api/evaluation/invoke with the last user message
  as input. qualifire-pass: nothing flagged and the model answers.


  Singulr (guardrail singulr, singulr_api_base {{upstream}}, which is plain http on 127.0.0.1 and so allowed,
  singulr_api_key oracle-singulr-key, singulr_application_id and singulr_guardrail_id set, so calls go to
  /api/v1/ai-gateway/litellm-v2; list x-singulr-gateway-token, x-singulr-enforcement-entity-id,
  x-singulr-guardrail-id and content-type). singulr-block: should_block true with blocking_due_to and the client gets
  400 "Blocked by Singulr, Blocking due to ...". singulr-allow: should_block false and the model answers.
  singulr-error-block: the guard answers 500 with block_on_error at its default true, and the message names the status
  and echoes the mock's fixed body, so nothing is ignored. singulr-error-open: block_on_error false and a
  500, so the model answers.


  Zscaler (guardrail zscaler_ai_guard, api_base {{upstream}}/v1/detection/execute-policy as the full URL, api_key
  oracle-zscaler-key, policy_id 7; list authorization and content-type). zscaler-block: action BLOCK with
  detectorResponses and the client gets 400 with "Content blocked by Zscaler AI Guard: ..." naming the transaction id
  and blocking detectors. zscaler-allow: action ALLOW and the model answers. zscaler-block-output: mode post_call, the
  captured payload has direction OUT and a block answer replaces the 200. zscaler-unavailable: the guard answers 503
  and the client gets 500 with LiteLLM's user-facing error. zscaler-rate-limited: the guard answers 429 and the client
  gets 500 with the rate limit reason.


  no-auth: a PromptGuard guardrail with default_on true and no Authorization header; the 401 comes before any upstream
  call.
