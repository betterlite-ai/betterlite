id: B3970
title: MLflow spans and streamed event lifecycle
description: >-
  Build MLflow parent-span selection with active-span aware child/trace branching,
  inputs and attributes extraction, status events and one-span-per-stream tracking
  across streaming chunks. Use the actual source lifecycle for streaming requests:
  track the first chunk creation of a span, add subsequent chunks as events, and
  end the span on the final chunk detected through complete_streaming_response
  (sync) or async_complete_streaming_response (async) keys. Preserve both
  assembled-stream response key spellings and finally-block cleanup.

  Implement status callbacks for success (OK), failure (ERROR) and failure event
  recording from exception info. Extract and set chat messages/tools from response
  choices and input messages. Build span name from call type (litellm-completion,
  litellm-acompletion, litellm-embeddings). Handle embeddings as EMBEDDING span
  type; others default to LLM. Transform request tags from space/colon-separated
  list to dictionary, keeping both key-value pairs and standalone tags mapped to
  empty string value. Extract attributes from standard_logging_object when present,
  falling back to kwargs fields.

  Serialize streaming delta as json.dumps(choice.delta.model_dump, default=str)
  on the bound method reference, not the called result. Pop optional_params for
  functions, tools, stream, tool_choice and user keys (not other params).
  Recognize literal embeddings call type. Use threading lock for _stream_id_to_span
  dict access.

scope:
