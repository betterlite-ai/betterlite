id: B316
title: Cost-based routing with model price overrides
description: 'Add the cost selector using B013 model prices and token counting with B304 usage windows.
  Carry all price arithmetic as Decimal, including custom deployment prices. Keep ranking and capacity
  screening as distinct steps and retain file-order tie behavior. The score is the pinned selector''s
  metric, not a newly estimated whole-response price. Configuration boundary keys introduced or consumed
  here: routing_strategy. Pinned declaration defaults: routing_strategy=''simple-shuffle''. Resolve env
  values once in betterlite-config, never in router code. Implement the owned native service in crates/betterlite-router/src/cost_routing.rs.
  Add ProbeOperation::B316 in tools/oracle/src/router_probes/mod.rs and the corresponding B316 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/lowest_cost.py: LowestCostLoggingHandler.__init__
  (L19-L20), LowestCostLoggingHandler.log_success_event (L22-L95), LowestCostLoggingHandler.async_log_success_event
  (L97-L170), LowestCostLoggingHandler.async_get_available_deployments (L172-L300). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
scope:
  paths:
  - crates/betterlite-router/src/cost_routing.rs
  - crates/betterlite-router/src/cost_routing/**
  - crates/betterlite-router/src/lib.rs
  - crates/betterlite-router/src/error.rs
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/cost_routing.rs
  - crates/betterlite-server/src/routing/cost_routing/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/context.rs
  - tools/oracle/src/router_probes/cost_routing.rs
  - tools/oracle/src/router_probes/cost_routing/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/cost_routing.py
  - tools/oracle/cases/routing/cost-routing/**
  - crates/betterlite-config/src/lib.rs
  - crates/betterlite-config/src/config.rs
  - crates/betterlite-config/src/router.rs
  - crates/betterlite-config/src/cost_routing.rs
  - crates/betterlite-config/src/cost_routing/**
  - crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
  - crates/betterlite-config/fuzz/corpus/config_yaml/b316-*
  - crates/betterlite-config/fuzz/Cargo.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L22-L170
  why: Success observations and minute-window counters.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L172-L300
  why: Price fallback, override and capacity selection.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L19-L20
  why: Previously uncovered helper owned by this task.
dod:
- text: Write tests named b316_behaviors and b316_boundaries under cost_routing::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - b316-behaviors
  - b316-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/b316-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/b316-invalid.yaml;
    the valid seed contains routing_strategy. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - b316-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: b316-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::b316_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: b316-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::b316_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/cost_routing.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/cost_routing.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/b316-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/b316-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/b316-" && grep -Fq 'routing_strategy' crates/betterlite-config/fuzz/corpus/config_yaml/b316-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/cost-routing/input-plus-output-price.yaml
- tools/oracle/cases/routing/cost-routing/custom-price-over-catalog.yaml
- tools/oracle/cases/routing/cost-routing/unknown-price-fallback.yaml
- tools/oracle/cases/routing/cost-routing/zero-price-truthiness.yaml
- tools/oracle/cases/routing/cost-routing/stable-cost-tie.yaml
- tools/oracle/cases/routing/cost-routing/cheapest-at-rpm-limit.yaml
- tools/oracle/cases/routing/cost-routing/tpm-input-estimate.yaml
deviations: []
out_of_scope:
- Spend charging or budgets (B068/B020).
pitfalls:
- The pinned selector sums per-token input and output prices rather than multiplying by requested max_tokens.
- Zero-valued price overrides use Python truthiness in this selector; keep that case explicit.
- Do not use floats for missing-price sentinels.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
