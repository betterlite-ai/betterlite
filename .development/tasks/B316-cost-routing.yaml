id: B316
title: Cost-based routing with model price overrides
description: Add the cost selector using B013 model prices and token counting with B304 usage windows.
  Carry all price arithmetic as Decimal, including custom deployment prices. Keep ranking and capacity
  screening as distinct steps and retain file-order tie behavior. The score is the pinned selector's metric,
  not a newly estimated whole-response price. Use the existing Rust crate boundaries from B004 and B008;
  integrate through the server when the provider dispatcher or callbacks live in another core crate. This
  task's source slices are the linked ranges, not a port of their Python classes. Add the listed oracle
  cases and the matching adapters to B301's component runner where state is not observable over HTTP;
  adapters call production logic and never reproduce it. Use deterministic candidate sets or supplied
  random samples for comparisons, and separate seeded distribution tests for random choices. Extend the
  existing config_yaml fuzz target and committed corpus for every newly accepted config form; unsupported
  keys still fail by full path. Keep the implementation, adapters and tests within 650 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/cost-routing/**
  - tools/oracle/src/router_probes/cost-routing/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/cost_routing.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L22-L170
  why: Success observations and minute-window counters.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L172-L300
  why: Price fallback, override and capacity selection.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(cost_routing)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/cost-routing/input-plus-output-price.yaml
- tools/oracle/cases/routing/cost-routing/custom-price-over-catalog.yaml
- tools/oracle/cases/routing/cost-routing/unknown-price-fallback.yaml
- tools/oracle/cases/routing/cost-routing/zero-price-truthiness.yaml
- tools/oracle/cases/routing/cost-routing/stable-cost-tie.yaml
- tools/oracle/cases/routing/cost-routing/cheapest-at-rpm-limit.yaml
- tools/oracle/cases/routing/cost-routing/tpm-input-estimate.yaml
deviations: []
out_of_scope:
- Spend charging or budgets (B068/B020).
pitfalls:
- The pinned selector sums per-token input and output prices rather than multiplying by requested max_tokens.
- Zero-valued price overrides use Python truthiness in this selector; keep that case explicit.
- Do not use floats for missing-price sentinels.
review_level: security
budget:
  max_changed_lines: 650
  max_new_expects: 0
