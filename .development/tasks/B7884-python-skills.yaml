id: B7884
title: Python skills create, list, get and delete
description: >-
  This is the skills entry. It adds `create_skill`, `acreate_skill`, `list_skills`, `alist_skills`, `get_skill`, `aget_skill`, `delete_skill` and `adelete_skill` of litellm/skills/main.py and the `skills` package. Rust runs the calls (B3391 get and delete, B3392 create, B3393 list).


  Native side, the family `skill_calls`: `src/skill_calls.rs` with `register` that adds `NativeSkillSession` and `NativeSkillError`, and `src/skill_calls/convert.rs` with tests `request_*` and `error_*`. The architect writes the `lib.rs` line.


  Python side, `python/betterlite/skills/main.py` and `__init__.py`. The helper functions at the top of the source (`_get_user_api_key_auth_from_kwargs`, `_get_skill_request_metadata`, `_get_litellm_skills_handler`, L38-L71) are proxy-side and are not built here: the native session reads the request metadata and the LiteLLM-hosted skills handler (B3391 to B3393). `create_skill(display_title, files, file_ids, extra_headers, extra_query, extra_body, timeout, custom_llm_provider, **kwargs)` takes files as bytes, paths or open files. Python objects that cannot cross to Rust (`client`, `shared_session`) raise `UnsupportedCallArgument` from B158.
scope:
  paths:
  - crates/betterlite-python/src/skill_calls.rs
  - crates/betterlite-python/src/skill_calls/**
  - crates/betterlite-python/python/betterlite/_native_skill_calls.pyi
  - crates/betterlite-python/python/betterlite/skills/main.py
  - crates/betterlite-python/python/betterlite/skills/__init__.py
  - crates/betterlite-python/tests/test_skills.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/main.py#L1-L135
  why: helpers and acreate_skill
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/main.py#L135-L448
  why: create_skill, alist_skills and list_skills
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/main.py#L448-L772
  why: get and delete, sync and async
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/skills/__init__.py#L1-L23
  why: the exported names
dod:
- text: Every function keeps LiteLLM's name and parameters, and a keyword LiteLLM refuses is refused here.
  proof: [skills-signature]
- text: "Create, list, get and delete return the same objects as LiteLLM against one local server, and the package exports every name."
  proof: [skills-calls]
- text: A provider error keeps its class and cause, and an unsupported Python object raises `UnsupportedCallArgument`.
  proof: [skills-errors]
- text: The native register function and conversion have tests without an interpreter.
  proof: [skills-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: skills-signature
    why: A caller's keyword is accepted or refused wrongly.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_skills.py -k signature
  - id: skills-calls
    why: A result differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_skills.py -k calls
  - id: skills-errors
    why: An error class or message changes.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_skills.py -k 'error or unsupported'
  - id: skills-native
    why: A field changes on the way.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^skill_calls::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Strict typing has to hold for these calls.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: The three proxy-side helper functions are not exposed.
  why: They read proxy state that the Python package has no access to. Rust does the same work.
- what: This task has no helper oracle cases.
  why: The functions call a native session, so pytest compares both packages against one local server.
out_of_scope:
- "Provider and hosted-handler execution belongs to B3391, B3392 and B3393."
pitfalls:
- "Skills default to the `anthropic` provider when none is given, so the default is decided in Rust and Python sends None."
- "`files` may be a list of tuples, bytes or paths, and each is sent as a multipart part."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
