dod:
  - text: "get_current_spend reads Redis first (cross-pod authoritative), then in-memory, then reseeds from the database and uses caller-supplied fallback as the final fallback."
    proof: [spend-read-chain-tests]
  - text: "When max_budget is supplied and spend is below the budget, get_current_spend may perform an authoritative floor re-check that calls _authoritative_floor_spend and repairs the counter if the database spend exceeds the cached value."
    proof: [spend-read-recheck-tests]
  - text: "Strict-mode fail_closed_budget_enforcement causes get_current_spend to recheck against the authoritative floor for every request and reject with HTTP 503 if the spend cannot be verified."
    proof: [spend-read-strict-mode-tests]
  - text: "_repair_stale_spend_counter updates in-memory and uses atomic set-max in Redis to monotonically raise a stale counter without clobbering concurrent increments."
    proof: [spend-repair-monotonic-tests]
  - text: "reseed_spend_counter_from_db returns true only if a database row was found and the counter was reseeded; counters with no database row are not deleted."
    proof: [spend-reseed-behavior-tests]
  - text: "read_spend_counter_cache_value checks the active batch first and returns (value, authoritative) indicating whether the value came from Redis/batch (true) or in-memory (false)."
    proof: [spend-cache-read-tests]
  - text: "The database floor cache key is spend_db_floor:<counter_key> and the in-memory marker cache uses a 5-second TTL. When a spend reset writes a post-reset floor to the marker during a concurrent database read, the fresher cached value is kept instead of the stale pre-reset read."
    proof: [spend-floor-cache-tests]
  - text: "All cache layer exceptions (Redis failures, database errors) are logged and result in fallback behavior rather than raising to the caller."
    proof: [spend-read-error-handling-tests]
pitfalls:
  - "get_current_spend's fallback chain uses the caller's fallback_spend as the final fallback only if earlier layers return None or raise; do not substitute a constant default."
  - "The authoritative floor re-check only runs when max_budget is not None and current spend is below max_budget; above max_budget the counter is returned immediately without further checks."
  - "fail_closed_budget_enforcement is a global configuration setting read via general_settings; ensure strict mode and normal mode have different re-check frequencies."
  - "_repair_stale_spend_counter must forget the counter from the active batch before attempting Redis repair to ensure the repaired value is not overwritten by a batched increment."
  - "The database floor cache uses an in-memory marker key spend_db_floor:<counter_key> with 5-second TTL, not the counter itself; keep the cache layers distinct."
  - "read_spend_counter_cache_value's authoritative flag is False only when the value comes from the per-pod in-memory cache; a clean Redis miss (None returned) means the counter does not exist cross-pod."
  - "SpendCounterReseed methods return None when no database row exists (end-user without a row, tags, cold start) and the caller must handle None separately from 0.0 spend."
  - "Window floor reads require non-None window_entity_type, window_entity_id and window_start; if any are None the call skips the window lookup."
  - "A spend reset that commits while _authoritative_floor_spend is reading the database floor will write the post-reset floor to the marker cache before this function caches its pre-reset read; re-check the marker after the DB read completes and keep the newer cached value if present."
out_of_scope:
  - B360 owns Redis async_get_cache, async_set_max and the atomic compare-and-set transport.
  - B1718 owns active_spend_counter_batch, PendingSpendIncrement and the record/forget batch API.
  - B1735 owns SpendCounterReseed.from_db, SpendCounterReseed.end_user_from_db and the database row lookups.
  - B1736 owns SpendCounterReseed.coalesced, SpendCounterReseed.window_from_db and window aggregation logic.
  - B2226 owns spend_counter_cache local get/set/delete.
  - Budget admission policy and counter reservation; owned by B3004.
  - Counter initialization and mutations; owned by B3015.
  - Strict-mode configuration parsing; owned by B002.
