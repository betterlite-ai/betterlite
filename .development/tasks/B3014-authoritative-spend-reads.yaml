id: B3014
title: Read and repair authoritative spend counters
description: >-
  Extract betterlite-auth::spend_reads to provide read-only access to spend counters with clean Redis-miss semantics, cached database floors and monotonic repair operations. Implement functions to read the current spend with fallback chain behavior, distinguish between authoritative cross-pod values and per-pod cached estimates, and repair stale Redis counters from the database.

  get_current_spend returns the authoritative spend value for budget admission checks, reading cross-pod from Redis first, falling back to in-memory then database floors, and finally the caller-supplied fallback. When max_budget is supplied, an additional database floor re-check detects when a Redis counter has become stale-low (e.g. after a Redis restart with an older RDB snapshot) and repairs it monotonically using atomic set-max to raise stale values toward truth. Preserve the 5-second cache TTL on database floor reads to bound per-window lookup cost, and the fail_closed_budget_enforcement strict mode that rejects requests when spend cannot be verified against authoritative sources.

  _repair_stale_spend_counter restores a Redis counter to its authoritative database floor after it falls behind (e.g., Redis restart reloading a stale RDB snapshot). It updates in-memory by comparing and setting without awaiting, keeping the update atomic per pod. For Redis, it uses atomic set-max to raise the counter only; concurrent increments cannot be undone. reseed_spend_counter_from_db handles counters left in an inconsistent state by settlement (missing after a reconcile, or negative after applying a reconcile delta). It reads the database floor and uses monotonic set-max to restore the counter to that floor. Counters with no database row (window, end-user, tag counters) are never deleted; they retain their current value.

  read_spend_counter_cache_value and _read_spend_counter_estimate extract the cache layers and database fallback for reading the live counter value. Preserve that active batch reads return authoritative values, clean Redis miss is final (per-pod in-memory only holds this pod's writes), exception handling logs and falls back rather than raising, and the in-memory marker cache speeds repeated database floor reads without holding a real connection.

