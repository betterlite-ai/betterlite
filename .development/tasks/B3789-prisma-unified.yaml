    why: Tool call extraction, masking argument recovery, and writing masked arguments back onto the tool call.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/panw_prisma_airs/panw_prisma_airs.py#L1765-L1772
    why: MCP tool name fallback for /mcp-rest paths and legacy naming.
