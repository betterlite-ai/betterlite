id: B3789
title: Prisma AIRS unified text and tool selection
description: >-
  Implement the apply_guardrail unified method that handles both request and response scanning
  across multiple input shapes: chat completions, text completions, Anthropic /v1/messages,
  /v1/responses, and MCP tool invocations.

  The method unifies text selection, tool call scanning, and masking decisions. On the request
  side, it selectively scans only user/system/developer messages, with an optional mode that
  scans only the latest user/developer message (for Anthropic /v1/messages by default, configurable
  via experimental_use_latest_role_message_only). When structured messages are present, the
  method aligns scanned texts with their source messages to avoid scanning assistant or tool
  history. For Responses requests with reasoning items, those are identified and excluded from
  latest-message calculations. On the response side, all texts are scanned without selection.

  For each text: scan with PANW AIRS, apply masking if action is allow with masked_data present,
  or apply masking if action is block and the corresponding mask_*_content flag is set. Block
  the request without masking otherwise, raising HTTPException 400. Text extraction handles
  multiple content sources: message content as string or list of content parts, and for responses,
  tool call and function call arguments extracted as strings.

  Tool calls are scanned individually: function name and arguments are sent as plain text
  newline-separated (tool_event schema only accepts MCP ecosystem). Build masked_text from the
  masked AIRS response using _masked_tool_call_arguments: if the scanned text included both name
  and args, recover only the args portion from masked_text by splitting on the first newline;
  if only args were scanned, use masked_text as-is; if masked_text is None or args were never
  scanned, masking cannot be applied. MCP tool invocations via /mcp-rest/tools/call send a
  tool_event object with metadata (ecosystem, method, server_name, tool_invoked) and input
  (serialized arguments). Resolve the server name from request_data first, then the MCP server
  registry keyed on tool name. On block with mask_request_content set, rewrite arguments via
  _apply_mcp_masking: update both arguments and mcp_arguments fields if present, or raise
  HTTPException 400 if neither exists. If original arguments were structured (dict/list),
  validate masked text as JSON before applying; raise on invalid JSON. If only plain text was
  scanned, preserve the original type without re-parsing.

  Text selection requires three Responses utilities that are not in other tasks. _text_source_message_indices
  maps every text to the message index it came from by walking message texts forward and backward;
  return None if the alignment is ambiguous (safety fallback to scan all). _reasoning_item_text_indices
  identifies which texts came from Responses reasoning items, handling the optional instructions
  offset. Both return None on validation failure. _get_latest_user_text_indices combines these
  to find the latest user/developer message texts, excluding reasoning items and skipping the
  lookup if the latest message has no text.

  Resolve litellm_call_id from request_data or logging_obj fallback. For MCP requests without
  a call_id, synthesize one from the tool name (slug + UUID, max 40 chars). For direct
  /apply_guardrail endpoint calls with empty request_data and no logging_obj, synthesize a UUID
  and store it. Merge metadata from logging_obj.model_call_details.litellm_params.metadata into
  request_data.metadata on conflict.

  Deviations: text selection always includes system and developer roles, not just user. The
  experimental_use_latest_role_message_only flag controls per-request selection on Anthropic
  paths only when structured messages are available; unset, it defaults to latest-only for
  Anthropic /v1/messages and full-history otherwise. Responses reasoning item detection is
  based on the item.type field; items without text are still marked as reasoning. Structured
  message text alignment is conservative: if walk direction disagreement occurs, fall back to
  scanning all user/system/developer texts. Synthesized MCP tool name slugs are lowercase
  alphanumeric-only with hyphens, max 40 chars, never empty ("mcp-tool" fallback). On action
  allow with mask_response_content unset, mask_text returns None per AIRS schema unless the
  masked field was present. Masked tool call arguments are never re-serialized; if masked_text
  fails to deserialize as JSON when original args were structured, raise HTTPException 400.

  include_guardrail_metadata is not included in request_data extraction and is never added
  during scanning. Helper methods not in this scope are out-of-scope; they belong to B3787
  (content extraction), B3786 (scan and verdict), B058 (logging), or shared CustomGuardrail.

