    why: Unified guardrail config model with text selection and masking flags.
dod:
  - text: Text selection aligns with structured messages, skips non-scannable roles, and handles latest-only mode with Anthropic detection and reasoning item exclusion.
    proof: [unified-text-selection-tests]
  - text: Tool calls are scanned individually with name and arguments sent as newline-separated text, and masked arguments are recovered without re-parsing.
    proof: [unified-tool-call-tests]
  - text: MCP tool invocations scan via tool_event with ecosystem and method metadata, and masked arguments rewrite both request_data fields without corrupting structured types.
    proof: [unified-mcp-tool-tests]
  - text: Masking decisions (allow+masked, block+mask_*_content) are applied correctly on both request and response sides; blocks without masking raise HTTPException 400.
    proof: [unified-masking-tests]
  - text: call_id resolution from request_data, logging_obj, or synthesized MCP/UUID paths matches LiteLLM behavior without duplicates or missing traces.
    proof: [unified-call-id-tests]
checks:
  optional: []
  commands:
    - id: unified-text-selection-tests
      why: Text alignment with messages, latest-message selection, and reasoning exclusion must match LiteLLM structured message handling.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma_airs::unified_text_selection::/)' 2>&1 | head -100 || cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma.*text_selection/)' 2>&1 | head -100 || true
    - id: unified-tool-call-tests
      why: Tool call extraction, argument masking recovery, and in-place modification of tool_calls lists must match LiteLLM behavior.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma_airs::unified_tool_call::/)' 2>&1 | head -100 || cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma.*tool_call/)' 2>&1 | head -100 || true
    - id: unified-mcp-tool-tests
      why: MCP tool event construction, server name resolution, and masked argument rewriting to both request_data fields must match LiteLLM behavior.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma_airs::unified_mcp_tool::/)' 2>&1 | head -100 || cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma.*mcp/)' 2>&1 | head -100 || true
    - id: unified-masking-tests
      why: Masking application on allow and on block+mask_*_content must preserve structured arguments and raise HTTPException 400 on invalid JSON.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma_airs::unified_masking::/)' 2>&1 | head -100 || cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma.*masking/)' 2>&1 | head -100 || true
    - id: unified-call-id-tests
      why: call_id resolution from request_data, logging_obj.litellm_call_id, synthesized MCP slugs, and UUID fallbacks must be unique per request.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma_airs::unified_call_id::/)' 2>&1 | head -100 || cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^panw_prisma.*call_id/)' 2>&1 | head -100 || true
oracle_cases: []
deviations:
  - what: "Text selection always includes system and developer roles alongside user; LiteLLM includes them via role_out_of_guardrail_scope."
    why: "Consistent with existing content extraction logic and guardrail best practices."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/guardrail_translation/utils.py"
  - what: "Structured message text alignment uses a conservative bidirectional walk that falls back to scanning all user/system/developer texts on disagreement."
    why: "Guard against ambiguous text attributions when translation handlers add or reorder messages."
    link: null
  - what: "Synthesized MCP tool name slugs use max 40 characters of lowercase alphanumeric-only text with hyphens, and fall back to 'mcp-tool' if empty."
    why: "Keep call_id readable while avoiding UUID collision and unbounded length in observable server state."
    link: null
  - what: "Masked tool call arguments from AIRS response are never re-serialized; if structured arguments require JSON and masked_text fails to parse, HTTPException 400 is raised."
    why: "Prevent silent data corruption by strict validation; callers cannot recover from a mask that breaks JSON."
    link: null
  - what: "metadata enrichment from logging_obj.model_call_details.litellm_params.metadata uses dict merge with request_data values taking precedence on conflict."
    why: "Preserve explicit per-call metadata while falling back to logged context."
    link: null
out_of_scope:
  - "B3787 owns content extraction helpers: _extract_text_from_messages, _extract_text_from_content_list, _extract_response_text, _extract_text_from_sse_bytes, _extract_text_from_streaming_events, _extract_prompt_from_request."
  - "B3786 owns scan transport and verdict handling: _call_panw_api, _scan_raw_streaming_text, _scan_and_process_streaming_response, _scan_tool_calls_for_guardrail (except the call_id and metadata setup), async_pre_call_hook, async_post_call_success_hook, async_post_call_streaming_iterator_hook."
  - "B058 owns guardrail logging decorators and information recording: @log_guardrail_information, add_standard_logging_guardrail_information_to_request_data."
  - "Shared CustomGuardrail base owns: __init__, should_run_guardrail (except MCP compat map), mask application hooks for messages/responses, error detail building, API error handling with fallback logic, scan deduplication, masking configuration, get_config_model, get_supported_event_hooks."
pitfalls:
  - "Structured message text alignment fails silently and falls back to all user/system/developer texts if forward and backward walks disagree; this is conservative but may rescan non-latest messages."
  - "Reasoning items in Responses have no mandatory fields; an item with type=reasoning but no text still consumes space in the flat texts list and must be skipped."
  - "Latest user message text indices must account for both item.type=reasoning exclusion and the offset created by optional scannable_instructions prefix in Responses input."
  - "_apply_mcp_masking may raise HTTPException on JSON parse failure; this exception must propagate without being silently caught or converted to allow, since invalid masked text indicates a critical policy failure."
  - "Synthesized MCP call_ids use the tool name slug as prefix for readability, but collision is still possible if two tools are invoked concurrently with the same UUID suffix."
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
