id: B4772
title: Managed identity binding and inference policy primitives
description: >-
  Build pure binding updates, subject classification, managed-route admission predicates and effective-model selection in the agent/auth policy layer. Preserve identity retirement, revision changes, legacy-field rejection, mode/scope/role checks and 403 versus policy-unavailable 503 conversion separate from storage and caller grants.

  Legacy identity rejection: has_legacy_identity checks whether litellm_params.identity exists (not supported), reject_legacy_identity raises HTTPException 400 with constant message.

  Identity binding writes: ManagedWriteFields and IdentityFields TypedDict structures preserve absent-versus-null. raise_identity_failure raises HTTPException 503 when code is "policy_unavailable", else 403 (default). _configuration_failure validates that autonomous mode requires service_principal_id and enabling without binding checks active identity exists. managed_write_fields processes incoming updates and existing agent state, returning ManagedWriteFields or AgentIdentityFailure. _identity_write constructs DB write operations: for identity=None, unbind by setting active=False and revision=uuid; for new identity, archive retired bindings and upsert identity fields.

  Subject classification: classify_agent_subject validates JWT claims against binding (iss, tid, azp), extracts oid, checks scope claim for delegated grant, checks xms_sub_fct not user (13), validates required_scopes and required_roles are present, returns AgentSubject(kind="delegated_subject"|"application", oid, mode) or AgentIdentityFailure.

  Route authorization: managed_agent_route_allowed checks route in agent management routes (/agents, /v1/agents), realtime routes, model-inference routes and MCP routes; method restrictions apply per route. managed_inference_request resolves effective model from body/path/query/settings using resolve_inference_model, with kind-specific routing (image_generation for /images/generations, speech for /audio/speech, completion as fallback for routes not in the kind map, body for rerank/decisions/systemone/messages_count_tokens routes, path for :countTokens).

  Policy admission and invocation: managed_agent_policy(auth) returns the AgentResponse if auth is admitted as managed agent, None otherwise. actor_admission_failure checks agent enabled, identity present and active, context matches agent and binding revision, mode compatibility and delegated-mode user_id. invocation_target extracts agent_id from a2a/{agent_id} path routes or a2a/ model names in body.

