checks:
  optional: []
  commands:
    - id: legacy-identity-tests
      why: has_legacy_identity or reject_legacy_identity functions missing or do not handle legacy identity correctly.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_identity::.*legacy/)'
    - id: managed-identity-tests
      why: managed_identity module missing, fails to process writes, classify subjects or handle failures.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_identity::.*managed/)'
    - id: route-auth-tests
      why: route authorization or inference request handling missing or incorrect.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_policy::.*route/)'
    - id: policy-tests
      why: policy admission or invocation target extraction missing or incorrect.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^agent_policy::.*policy/)'

oracle_cases: []

deviations:
  - what: raise_identity_failure raises HTTPException with 503 for policy_unavailable code, else 403; the status is determined by code, not caller preference.
    why: LiteLLM distinguishes policy unavailable (managed agent requires database) from authentication failures; 503 signals temporary service state, 403 signals caller authorization.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/managed_identity.py#L68-69
  - what: managed_write_fields validates configuration and returns either ManagedWriteFields dict or AgentIdentityFailure enum (Result-like union).
    why: Rust's type system requires named union or Result; LiteLLM uses duck typing. Both raise on error; betterlite returns both results for caller flexibility (write preparation vs validation).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/managed_identity.py#L88-119
  - what: Managed routes are computed at startup as frozensets and patterns, not at request time; RouteChecks.check_route_access is a synchronous function available from B882.
    why: Rust prefers compile-time/startup collection over runtime evaluation; avoiding repeated iteration over route lists on hot paths.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/auth/managed_authorization.py#L14-45

out_of_scope:
  - Database storage of bindings, retirements and identity records. B4773 owns the identity store and persistence.
  - Caller grants and access-group resolution. B4778, B4779, B4780 own those.
  - HTTP routes and endpoint handlers. B4781, B4785 own managed admission and mutation routes.
  - Agent registry operations. B4776 owns registry reconciliation.
  - Request admission itself (that is `admit_managed_actor` and `prepare_agent_invocation`). B4781 owns admission.
  - MCP context and reload callees (G3 from outline).

pitfalls:
  - Binding revision must be a uuid4 string; generate fresh on every identity upsert so identity changes are detectable.
  - classify_agent_subject checks iss, tid, azp against binding issuer, tenant_id, client_id; a mismatch means token issued elsewhere (403 identity_denied).
  - scope claim is space-separated string of delegated scopes; scope present + allowed_mode == "autonomous" fails as a contradiction (also when oid equals service_principal_id or idtyp == "app"); scope absent + allowed_mode == "delegated" is the symmetric contradiction.
  - roles claim is a list in application tokens; required_roles is a tuple/frozenset; the subset check must match exactly.
  - xms_sub_fct = "13" in MSA user tokens; its presence with managed identity binding fails (native user auth unsupported).
  - managed_inference_request returns augmented body dict; do not mutate the original.
  - managed_agent_route_allowed is a pure boolean predicate; it does not raise or log.
  - managed_agent_policy is a read-only accessor on auth; do not assign to it here (admission does that in B4781).
  - invocation_target returns agent_id if found, None otherwise; empty string in path is None.
  - actor_admission_failure returns None on success, AgentIdentityFailure on any check fail; the caller raises or continues based on None.

