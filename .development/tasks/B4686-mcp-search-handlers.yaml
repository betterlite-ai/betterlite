id: B4686
title: Authorized MCP search and tool invocation handlers
description: >-
  Build the five virtual-tool handlers in betterlite-server::mcp::search_handlers with typed
  caller scope and result envelopes. Resolve accessible tools afresh for opaque IDs, validate
  invocation arguments against the served schema, and preserve auth headers, attribution,
  requested server identity and guardrail context through execution.

  handle_agent_search resolves agents accessible to the user, calls semantic search against
  them with top_k clamped to at least one, and returns a JSON result array or an error.
  Calls check_feature_access_for_user("agents") before search; other errors return is_error
  text results.

  handle_skill_search resolves skills available to the user, calls semantic search with
  top_k clamped to at least one and at most MAX_SKILL_SEARCH_TOP_K, and returns a JSON
  result array or an error. Other failures warn and return is_error text results.

  handle_mcp_tool_search searches MCP tools after listing those accessible to the user,
  with optional semantic ranking if embedding_model is configured. Validates config and
  embedding requirements; returns JSON search results or is_error text.

  handle_mcp_proxy_tool dispatches three virtual proxy tools: MCP_PROXY_SEARCH_TOOL_NAME
  for semantic ranking, MCP_PROXY_SCHEMA_TOOL_NAME for tool schema retrieval, and
  MCP_PROXY_CALL_TOOL_NAME for tool invocation. Resolves opaque tool_id to the
  corresponding accessible tool, validates JSON schema for call arguments, and returns
  MCP search/schema results or delegates to handle_mcp_tool_call.

  handle_mcp_tool_call checks authorization for the requested server(s). When mcp_servers
  are explicitly requested but resolve to no allowed servers, it calls raise_denied_scoped_mcp_access
  with detail before raising HTTP 403. When no servers are allowed and no local-tool fallback exists,
  it raises HTTP 403. Executes the tool via the operations layer and preserves guardrail_context
  through to execute_mcp_tool. Unknown or unauthorized IDs and invalid arguments return MCP is_error
  text results. Config or embedding failures become tool errors, not keyword fallback.

scope:
  paths:
    - crates/betterlite-server/src/mcp/search_handlers.rs
    - crates/betterlite-server/src/mcp/search_handlers/**
    - tools/oracle/cases/helpers/search-handlers/**
    - tools/oracle/helpers/b4686.py
    - tools/oracle/helpers/b4686/**
    - tools/oracle/src/helpers/server/b4686.rs
    - tools/oracle/src/helpers/server/b4686/**
  lint_tables: false

