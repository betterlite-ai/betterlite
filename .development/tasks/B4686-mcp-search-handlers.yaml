deviations:
  - what: "handle_agent_search returns MCP text tool results (is_error flag) instead of structured OpenAI Assistants response objects."
    why: "Betterlite's MCP virtual tools operate through the MCP CallToolResult wire format, not through the proxy's agent endpoints. Search results are serialized as JSON strings wrapped in CallToolResult, consistent with other MCP tool handlers."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_search.py#L386-L417
  - what: "Config or embedding failures in handle_mcp_tool_search return is_error text results instead of silently falling back to keyword search."
    why: "Betterlite preserves LiteLLM's semantics when semantic ranking is configured: config errors or embedding failures prevent search and return error text. If the caller wants graceful fallback, it must be added by a task that owns that layer."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_search.py#L469-L500

out_of_scope:
  - Agent search implementation and accessible_agents resolver; owned by agent endpoints.
  - Skill search implementation; owned by skills handler.
  - MCP tool listing and server enumeration (_list_mcp_tools, _get_allowed_mcp_servers).
  - MCP tool execution and server dispatch (execute_mcp_tool, _dispatch_virtual_mcp_tool).
  - Denial and error handling for unresolved permissions (raise_denied_scoped_mcp_access).
  - Tool call result serialization (complete_call_tool_result).
  - Semantic tool ranking and virtual schema definitions; owned by B4684.
  - Authentication and identity resolution; owned by B732.
  - RBAC feature checks for other features; owned by B864.

pitfalls:
  - Only handle_mcp_tool_call receives an optional guardrail_context parameter, which
    it must preserve through to execute_mcp_tool. It carries filter metadata, allowed_tools
    narrowing and mask decisions from the semantic pre-hook. handle_mcp_proxy_tool does not
    receive or forward guardrail_context when delegating to handle_mcp_tool_call.
  - handle_mcp_proxy_tool dispatches three distinct virtual tools by checking the name
    parameter against MCP_PROXY_* constants. An unknown name within the proxy scope raises
    HTTP 400 with HTTPException; this is different from MCP is_error text results returned
    to the client for semantic reasons (config errors, invalid args).
  - Config validation errors in handle_mcp_tool_search and handle_mcp_proxy_tool's search
    branch return a ValidationError; check isinstance before converting to text, since a valid
    config returns a settings object. The embedding model is optional but when it is set,
    llm_router must exist or an error is returned.
  - handle_mcp_proxy_tool's MCP_PROXY_SEARCH_TOOL_NAME branch validates mcp_tool_search_settings()
    and checks embedding_model without llm_router, returning is_error text on either failure.
    This mirrors handle_mcp_tool_search's config checks and must be tested separately.
  - _text_tool_result is a simple wrapper that creates an MCP CallToolResult with either
    plain JSON strings or error messages. The is_error flag determines whether the MCP SDK
    treats the result as a success or failure. Use it consistently across all handlers.
  - JSON validation for proxy tool call arguments must use jsonschema.validate against the
    tool's served input_schema. Handle JsonSchemaValidationError and return an is_error
    result with the validation message; do not raise HTTPException.
  - Authorization failures in handle_mcp_tool_call raise HTTP 403 with FastAPI HTTPException
    before execute_mcp_tool is called. This is an HTTP contract, not an MCP tool result;
    the client receives a gateway error, not a tool error. Only when the key has no accessible
    servers should the 403 be raised; if servers are present but not authorized, let the
    execute layer handle it.
  - handle_mcp_proxy_tool's MCP_PROXY_SEARCH_TOOL_NAME branch uses a hardcoded top_k=5
    (not caller-supplied) for semantic ranking; the proxy schema and call branches preserve
    caller arguments through their delegations.

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
