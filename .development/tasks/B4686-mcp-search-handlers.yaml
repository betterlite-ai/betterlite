    why: handle_agent_search checks feature access, searches agents, and returns JSON or error text.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_search.py#L420-L450
    why: handle_skill_search searches skills with clamped top_k and returns JSON or error text.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_search.py#L453-L500
    why: handle_mcp_tool_search lists accessible tools and searches with optional semantic ranking.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_search.py#L503-L591
    why: handle_mcp_proxy_tool dispatches search, schema and call tools by name with ID resolution.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_search.py#L594-L649
    why: handle_mcp_tool_call checks server access, validates args and executes MCP tools.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/tool_search.py#L377-L383
    why: _text_tool_result wraps JSON or error strings in MCP CallToolResult format with is_error field.

dod:
  - text: handle_agent_search calls check_feature_access_for_user("agents"), searches accessible agents with top_k clamped to at least one, and returns JSON results or is_error text.
    proof: [search-handlers-tests, agent-search-feature-check, agent-search-top-k]
  - text: handle_skill_search resolves available skills, searches with top_k clamped to [1, MAX_SKILL_SEARCH_TOP_K], and returns JSON results or is_error text.
    proof: [search-handlers-tests, skill-search-top-k-bounds]
  - text: handle_mcp_tool_search lists accessible MCP tools, validates config and embedding model requirements, and searches with optional semantic ranking.
    proof: [search-handlers-tests, mcp-tool-search-config, mcp-tool-search-optional-ranking]
  - text: handle_mcp_proxy_tool dispatches MCP_PROXY_SEARCH_TOOL_NAME, MCP_PROXY_SCHEMA_TOOL_NAME and MCP_PROXY_CALL_TOOL_NAME by name with opaque tool_id resolution.
    proof: [search-handlers-tests, proxy-tool-dispatch, proxy-tool-id-resolution]
  - text: handle_mcp_proxy_tool's search branch validates config and embedding model requirements, returning is_error text for invalid mcp_tool_search_settings() result or when embedding_model is set without llm_router, mirroring handle_mcp_tool_search's own checks.
    proof: [search-handlers-tests, proxy-tool-search-config, proxy-tool-search-embedding]
  - text: handle_mcp_proxy_tool validates tool call arguments against the served JSON schema and returns MCP is_error text on validation failure.
    proof: [search-handlers-tests, proxy-tool-schema-validation]
  - text: handle_mcp_tool_call checks authorization for requested_server(s), raises HTTP 403 before dispatch when no accessible servers exist and no local-tool fallback is available.
    proof: [search-handlers-tests, mcp-tool-call-auth-check]
  - text: When mcp_servers are explicitly requested, handle_mcp_tool_call calls raise_denied_scoped_mcp_access with per-reason detail before raising HTTP 403.
    proof: [search-handlers-tests, mcp-tool-call-scoped-denial]
  - text: handle_mcp_tool_call returns MCP is_error text for unknown tool IDs, invalid arguments, config errors and embedding failures, not keyword fallback.
    proof: [search-handlers-tests, mcp-tool-call-error-handling]
  - text: New oracle helper operation for search handlers integrates with pinned LiteLLM behavior and replays case corpus.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: search-handlers-types
      why: Handler types, CallToolResult or result enum missing
      run: grep -q 'fn handle_agent_search' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'fn handle_skill_search' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'fn handle_mcp_tool_search' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'fn handle_mcp_proxy_tool' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'fn handle_mcp_tool_call' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: search-handlers-tests
      why: Handler tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::search_handlers::tests::/) - test(/replays_the_/)'
    - id: agent-search-feature-check
      why: handle_agent_search does not check feature access for agents
      run: grep -qE 'check_feature_access|agents' crates/betterlite-server/src/mcp/search_handlers.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::search_handlers::tests::.*agent.*feature/)'
    - id: agent-search-top-k
      why: handle_agent_search does not clamp top_k to at least one
      run: grep -qE 'max\(.*1\)|\.max\(1\)' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: skill-search-top-k-bounds
      why: handle_skill_search does not clamp top_k to [1, MAX_SKILL_SEARCH_TOP_K]
      run: grep -qE 'min\(.*max\(.*1\)' crates/betterlite-server/src/mcp/search_handlers.rs || grep -qE 'MAX_SKILL_SEARCH_TOP_K' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: mcp-tool-search-config
      why: handle_mcp_tool_search does not validate config and embedding requirements
      run: grep -qE 'mcp_tool_search_settings|ValidationError' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: mcp-tool-search-optional-ranking
      why: handle_mcp_tool_search does not support optional semantic ranking
      run: grep -qE 'if.*embedding_model|SemanticToolRanker|rank_mcp_tools' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: proxy-tool-dispatch
      why: handle_mcp_proxy_tool does not dispatch by MCP proxy tool name
      run: grep -q 'MCP_PROXY_SEARCH_TOOL_NAME' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'MCP_PROXY_SCHEMA_TOOL_NAME' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'MCP_PROXY_CALL_TOOL_NAME' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: proxy-tool-id-resolution
      why: handle_mcp_proxy_tool does not resolve opaque tool_id to accessible tool
      run: grep -qE 'mcp_proxy_tool_id|tools_by_id' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: proxy-tool-search-config
      why: handle_mcp_proxy_tool's search branch does not validate mcp_tool_search_settings() for config errors
      run: grep -qE 'mcp_tool_search_settings|ValidationError' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'proxy-tool-search-config-invalid.yaml' tools/oracle/cases/helpers/search-handlers/*.yaml
    - id: proxy-tool-search-embedding
      why: handle_mcp_proxy_tool's search branch does not check embedding_model without llm_router
      run: grep -qE 'embedding_model.*llm_router|llm_router.*embedding_model' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'proxy-tool-search-embedding' tools/oracle/cases/helpers/search-handlers/*.yaml
    - id: proxy-tool-schema-validation
      why: handle_mcp_proxy_tool does not validate call arguments against JSON schema
      run: grep -qE 'validate|JsonSchemaValidationError|input_schema' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: mcp-tool-call-auth-check
      why: handle_mcp_tool_call does not check authorization before dispatch
      run: grep -q '_get_allowed_mcp_servers' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q '_list_mcp_tools' crates/betterlite-server/src/mcp/search_handlers.rs && grep -q 'raise_denied_scoped_mcp_access' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: mcp-tool-call-error-handling
      why: handle_mcp_tool_call does not return MCP is_error text on validation failure
      run: grep -qE '_text_tool_result.*is_error' crates/betterlite-server/src/mcp/search_handlers.rs
    - id: mcp-tool-call-scoped-denial
      why: handle_mcp_tool_call does not call raise_denied_scoped_mcp_access for explicit server denial
      run: grep -q 'raise_denied_scoped_mcp_access' crates/betterlite-server/src/mcp/search_handlers.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::b4686::/) - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails
      run: test -f tools/oracle/helpers/b4686.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or HelperCase decoder fails replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/search-handlers-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

