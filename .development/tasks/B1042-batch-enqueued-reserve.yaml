checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_reserve::/)
      - test(/::replays_corpus$/)'
  - id: case-key-team-reserve
    why: the key-team-reserve behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_reserve::tests::key_team_reserve($|::)/)'
  - id: case-enqueued-limit-exceeded
    why: the enqueued-limit-exceeded behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_reserve::tests::enqueued_limit_exceeded($|::)/)'
  - id: case-invalid-limit-warning
    why: the invalid-limit-warning behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_reserve::tests::invalid_limit_warning($|::)/)'
  - id: case-partial-reserve-rollback
    why: the partial-reserve-rollback behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_reserve::tests::partial_reserve_rollback($|::)/)'
  - id: case-redis-fallback-memory
    why: the redis-fallback-memory behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_enqueued_reserve::tests::redis_fallback_memory($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/batch_enqueued_reserve.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/batch_enqueued_reserve-*)"
      && grep -qE "^[[:space:]]+batch_enqueued_reserve:" tools/oracle/fuzz/corpus/helper_case/batch_enqueued_reserve-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/batch-enqueued-reserve)"
