id: B1042
title: Batch enqueued reserve
description: >-
  Resolve positive admin-set batch_enqueued_token_limit metadata and reserve key/team allowances atomically with
  B126 Redis or source memory fallback. Preserve exact key formats, TTL, warnings for invalid limits and rollback
  after partial scope reservation. batch_enqueued_token_limit lives in admin-controlled key/team metadata, defaults
  absent; invalid/nonpositive values warn and disable that scope. Reservation TTL is BATCH_ENQUEUED_TOKEN_TTL_SECONDS=691200
  seconds.


  Implement crates/betterlite-core/src/api/batch_enqueued_reserve.rs. Use BatchEnqueuedReserveInput and BatchEnqueuedReserveResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions key_team_reserve, enqueued_limit_exceeded, invalid_limit_warning, partial_reserve_rollback,
  redis_fallback_memory under api::batch_enqueued_reserve::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::BatchEnqueuedReserve in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_enqueued_reserve: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/hooks/batch_enqueued_tokens.py: _ScriptRunner.__call__ (L111-L111); litellm/proxy/hooks/batch_enqueued_tokens.py:
  _read_metadata_limit (L114-L128); litellm/proxy/hooks/batch_enqueued_tokens.py: resolve_batch_enqueued_token_scopes
  (L131-L144); litellm/proxy/hooks/batch_enqueued_tokens.py: canonical_provider_batch_id (L147-L159); litellm/proxy/hooks/batch_enqueued_tokens.py:
  batch_response_view (L170-L174); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore.__init__
  (L193-L214); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._counter_key (L217-L218); litellm/proxy/hooks/batch_enqueued_tokens.py:
  BatchEnqueuedTokenStore._record_key (L221-L222); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore.reserve
  (L224-L244); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._reserve_via_redis (L246-L267);
  litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._run_reserve_script (L269-L285); litellm/proxy/hooks/batch_enqueued_tokens.py:
  BatchEnqueuedTokenStore._rollback_partial_reserve (L287-L299); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._refund_via_redis
  (L301-L308); litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._reserve_in_memory (L310-L326);
  litellm/proxy/hooks/batch_enqueued_tokens.py: BatchEnqueuedTokenStore._get_local_counter (L452-L458); litellm/proxy/hooks/batch_enqueued_tokens.py:
  BatchEnqueuedTokenStore._set_local_counter (L460-L467). Abstract/protocol declarations map to native types and
  synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 194 owned nonblank/non-comment/non-docstring Python lines (207 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 214 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 464 total within the 470-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B126 (Redis, Redis Cluster and Valkey), B171 (Direct helper oracle and URL path encoding),
  B198 (Injected call context and shared settings), B1019 (File routing ids), B1087 (Api boundaries), B732 (Typed
  authentication principals and grant resolution). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
