checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_options::/)
      - test(/::replays_corpus$/)'
  - id: case-required-tool-choice
    why: the required-tool-choice behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_options::tests::required_tool_choice($|::)/)'
  - id: case-named-tool-choice
    why: the named-tool-choice behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_options::tests::named_tool_choice($|::)/)'
  - id: case-reasoning-budget
    why: the reasoning-budget behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_options::tests::reasoning_budget($|::)/)'
  - id: case-native-responses-recursion
    why: the native-responses-recursion behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_options::tests::native_responses_recursion($|::)/)'
  - id: case-json-schema-format
    why: the json-schema-format behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_options::tests::json_schema_format($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_chat_options.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_chat_options-*)"
      && grep -qE "^[[:space:]]+responses_chat_options:" tools/oracle/fuzz/corpus/helper_case/responses_chat_options-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-chat-options)"
