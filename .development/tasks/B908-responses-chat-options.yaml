id: B908
title: Responses-to-chat request options
description: >-
  Build complete Responses-to-chat request assembly in betterlite-core::api::responses_chat_options.
  Own get_supported_openai_params, derived-web-search capability checking, bridge-back probing,
  reasoning splitting, transform_responses_api_request_to_chat_completion_request and text-format
  conversion. Shared protocol declarations at L150-L178 and ChatCompletionSession at L189-L199
  are types, not partial functions. B907 owns attribute/role helpers and tool choices; B913
  maps tools, B909 maps input and B175 supplies supported parameters. Use B158's typed
  responses_api_bridge_check capability port from main.py L1083-L1194; that SDK binding owns
  its model/endpoint policy. The helper oracle injects only the capability probe result/failure;
  it must execute the production mapper and does not call a provider.

  Map max_output_tokens to max_tokens, reasoning.effort to reasoning_effort and conditionally
  summary to reasoning_summary. No numeric reasoning budget is computed here. The request's
  stream comes from the separate argument, metadata/service_tier from kwargs, and all other
  mapped options from responses_api_request. Tests and oracle must show this precedence.
  Count 249 nonblank/non-comment lines including declarations/docstrings; reserve 230
  implementation, 155 tests, 95 fixtures, 85 adapters and 25 wiring: 590 changed lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_chat_options.rs
  - crates/betterlite-core/src/api/responses_chat_options/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_chat_options.rs
  - tools/oracle/src/helpers/core_ops/responses_chat_options/**
  - tools/oracle/helpers/responses_chat_options.py
  - tools/oracle/helpers/responses_chat_options/**
  - tools/oracle/fuzz/corpus/helper_case/responses_chat_options-*
  - tools/oracle/cases/helpers/responses-chat-options/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L150-L178
  why: Structural message/tool protocols used by the bridge; no runtime method is split here.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L189-L225
  why: Session record and exact supported-parameter vocabulary owned here.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L310-L484
  why: Complete capability checks, reasoning splitting and request assembly; no tool-choice decorators are claimed.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2896-L2945
  why: JSON-schema/json-object conversion and literal response_schema/false defaults.
dod:
- text: >-
    supported_options returns exactly input,model,instructions,max_output_tokens,metadata,
    parallel_tool_calls,previous_response_id,reasoning,stream,temperature,text,tool_choice,
    tools,top_p,user, independent of model. Assembly additionally forwards present
    safety_identifier/context_management and kwargs service_tier rather than filtering by this list.
  proof: [options-tests, oracle, options-adapter]
- text: >-
    option_sources maps model=m,input=hi,max_output_tokens=7,temperature=0,top_p=1,user=u,
    safety_identifier=s,context_management=[{type:compaction}],kwargs.metadata={k:v},
    kwargs.service_tier=flex,extra_headers={x-test:yes},provider=openai into those chat fields,
    messages=[{role:user,content:hi}],max_tokens=7. Request metadata={ignored:1} and request
    service_tier=default do not win. Null values disappear; false and zero remain. With
    no mapped tools, tools/tool_choice/parallel_tool_calls all disappear, even if choice=required.
  proof: [options-tests, oracle, options-adapter]
- text: >-
    stream_usage uses stream=true to add stream_options={include_usage:true} and updates
    the supplied logging object's stream_options to the same value. Request stream_options
    cannot replace it. stream=false stays false without stream_options; null stream is omitted.
    Input conversion is invoked with replay_reasoning=true and includes truthy instructions.
  proof: [options-tests, oracle, options-adapter]
- text: >-
    reasoning_options maps null,{} or "" to absent effort/summary; "high" to effort=high;
    {effort:high} to effort=high. With {effort:high,summary:auto}, summary survives only when
    bridge_check returns mode=responses. The probe receives mapped tools, retained web search,
    kwargs.api_base,effort,summary and provider (null becomes ""). A probe exception logs
    debug "responses bridge: reasoning effort mode check failed: <error>" and drops summary,
    preserving effort; no request error is raised. Derived web_search_options drops silently
    when a non-null capability list omits it, and stays when supported or the list is null.
  proof: [options-tests, oracle, options-adapter]
- text: >-
    response_formats maps text.format={type:json_schema} to {type:json_schema,json_schema:
    {name:response_schema,schema:{},strict:false}}. Explicit name/schema/strict, including
    null, are retained. type=json_object yields {type:json_object}; type=text,unknown,
    non-dict format, missing format and falsy text yield no response_format. Tool choice
    uses B907 only when B913 returns at least one tool.
  proof: [options-tests, oracle, options-adapter]
checks:
  optional: []
  commands:
  - id: options-tests
    why: bridge assembly picks the wrong option source or leaks an unsupported derived field
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_options::/)'
  - id: options-adapter
    why: options fixtures bypass the real mapper or fail Python checking
    run: test -f tools/oracle/helpers/responses_chat_options.py && grep -qE '^[[:space:]]+responses_chat_options:' tools/oracle/fuzz/corpus/helper_case/responses_chat_options-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-chat-options/supported-options.yaml
- tools/oracle/cases/helpers/responses-chat-options/option-sources.yaml
- tools/oracle/cases/helpers/responses-chat-options/stream-usage.yaml
- tools/oracle/cases/helpers/responses-chat-options/reasoning-options.yaml
- tools/oracle/cases/helpers/responses-chat-options/response-formats.yaml
deviations: []
out_of_scope:
- The remaining transformation.py methods belong to B907 custom tools, B909 inputs, B910 merges, B911 repair, B912 results, B913 namespaces, B914 outputs, B915 history and B1115 details.
- _deduplicate_tool_call_output_messages L925-L985 and _ensure_tool_call_output_has_corresponding_tool_call L988-L995 have no caller at the pin.
- B916 executes chat HTTP; this task only prepares a parsed request and logging option update.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_chat_options in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_chat_options.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_chat_options.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A missing tools list removes parallel_tool_calls along with tools and tool_choice, even if explicitly false.
- Unsupported derived web_search_options is dropped silently here without consulting drop_params.
- reasoning.summary is forwarded only to a chat request known to bridge back to Responses.
review_level: standard
budget:
  max_changed_lines: 590
  max_new_expects: 1
