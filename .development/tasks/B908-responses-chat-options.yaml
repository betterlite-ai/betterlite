id: B908
title: Responses chat options
description: >-
  Implement the Responses-to-chat option stage: supported parameter vocabulary, tool_choice, reasoning, derived
  web_search_options and text response formats. Export ChatOptions and a typed bridge direction so native Responses
  targets cannot recurse back through the chat bridge.


  Implement crates/betterlite-core/src/api/responses_chat_options.rs. Use ResponsesChatOptionsInput and ResponsesChatOptionsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions required_tool_choice, named_tool_choice, reasoning_budget, native_responses_recursion,
  json_schema_format under api::responses_chat_options::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesChatOptions in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_chat_options: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/transformation.py: _SupportsIter.__iter__
  (L152-L152); litellm/responses/litellm_completion_transformation/transformation.py: _ResponsesToolCallItem.get
  (L169-L169); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.get_supported_openai_params
  (L205-L225); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._should_drop_derived_web_search_options
  (L311-L324); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._completion_bridges_back_to_responses_api
  (L327-L357); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._transform_reasoning_for_chat_completion
  (L360-L397); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.transform_responses_api_request_to_chat_completion_request
  (L400-L484); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._transform_text_format_to_response_format
  (L2897-L2945). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 200 owned nonblank/non-comment/non-docstring Python lines (249 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 220 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 470 total within the 470-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B175 (Provider parameter capabilities
  and mapping), B902 (Responses shapes), B1087 (Api boundaries), B913 (Responses tool namespaces), B909 (Responses
  input messages), B907 (Responses codex tools). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
