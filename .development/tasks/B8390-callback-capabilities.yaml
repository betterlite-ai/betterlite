dod:
  - text: from_callbacks sets each flag by LiteLLM's rules, including the guardrail-versus-moderation split, the Override-before-ApplyGuardrail order and the content enforcer needing a pre-call override.
    proof: [caps-tests]
  - text: CallbackCache recomputes only when the list length or a member changes.
    proof: [caps-tests]
  - text: The predicates, partition_post_call and combined_callback_list answer like LiteLLM.
    proof: [caps-tests]
  - text: is_client_error and changes_request_flow classify every ProxyHookError variant.
    proof: [caps-tests]
checks:
  optional: []
  commands:
    - id: caps-tests
      why: a capability flag, the cache, a predicate or an error classifier is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::callback_caps::/)'
oracle_cases: []
deviations:
  - what: Overrides are declared by each callback through HookOverrides instead of found by reading class dictionaries and signatures.
    why: Rust has no class dictionary or inspect.signature. The flags carry the same meaning, so what a user sees does not change.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L2802-L2860
out_of_scope:
  - "Running any hook: B8392 (guardrail execution and during_call), B8393 (pre_call), B8394 (post_call, MCP, headers, per-chunk) and B8395 (failure)."
  - "The streaming iterator chain that reads iterator_overrides: B6370."
  - "Adapters from real callbacks to ProxyCallback and the ProxyLogging value that owns CallbackCache: B8399."
pitfalls:
  - A guardrail never sets has_moderation_override, even when it defines async_moderation_hook, because the elif at L2827 only runs for non-guardrails.
  - A class that defines both the iterator hook and apply_guardrail gets one Override entry, not two.
  - has_content_enforcer needs async_pre_call_hook on the callback's own class and enforces_request_content exactly true.
  - The moderation and listing-filter checks walk parent classes up to CustomLogger, while the other flags look only at the callback's own class.
  - combined_callback_list keeps the dynamic callbacks first and drops a later duplicate, not an earlier one.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
