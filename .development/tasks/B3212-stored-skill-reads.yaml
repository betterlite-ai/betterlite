id: B3212
title: Read stored skills through owner predicates and the row cache
description: >-
  Build a reusable stored-skill read service in betterlite-core over the existing betterlite-db skill
  rows/repository, betterlite-auth principals and betterlite-context cache. Retain optional-principal ownership
  checks, descending-created-time pagination, the 60-second positive/negative row cache and the no-database/missing-row
  errors that discovery maps differently.

  Implement the five owned read functions from litellm/llms/litellm_proxy/skills/handler.py: _prisma_skill_to_litellm
  converts a Prisma skill record to LiteLLM_SkillsTable with Base64 decoding of file_content. _get_prisma_client retrieves
  the initialized Prisma client or raises ValueError if None. list_skills accepts limit and offset, filters by owner_scopes
  when a non-admin caller has scopes, and returns rows ordered descending by created_at. _load_skill implements cache-first
  read with a distinct negative-cache sentinel (__litellm_skill_not_found__) so repeated misses avoid the DB; the cache
  is per-skill not per-caller. get_skill loads a cached row and checks ownership via user_can_access_resource_owner,
  returning the same not-found message for both missing and cross-tenant cases.

  The missing-principal bypass is intentional: discovery calls list_skills(limit=1000) and get_skill(skill_id) without
  a principal. Authenticated identity-less callers still have no owner scopes; cross-owner and nonexistent reads share
  the same not-found error. Preserve base64 conversion at the Prisma-model boundary and a distinct negative-cache
  sentinel, not a cached null indistinguishable from a miss. The 60-second TTL and 10,000-entry max capacity are
  configured in B2226 separately as shared cache defaults.

  Production module: betterlite-core::api::stored_skill_reads. Write standalone Rust test stored_skill_reads_missing_principal
  in betterlite-core: identity-less list_skills(limit=1000) and get_skill(skill_id) succeed without an auth check. This
  invariant is Rust-only, not a Python oracle case, since the missing-principal path has no LiteLLM equivalent to compare.

  Reuse the Postgres fixture from B860 for database-connected read tests. Each test uses a unique schema and cleans on exit.
  Failure to connect/start is a test failure, never an ignored or skipped test.

  Sizing: 84 nonblank, noncomment pinned source lines including declarations and docstrings; allow approximately 230 production
  lines, 140 behavior/Postgres read tests, 50 Rust oracle adapter lines, 15 helper dispatch/wiring lines, 450 total within
  an 800-line gate. Do not duplicate dependency implementations.
