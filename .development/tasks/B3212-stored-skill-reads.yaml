deviations:
- what: >-
    Identity-less callers (no user_id / team_id / org_id / api_key / token) succeed on list_skills and get_skill
    without raising, returning all accessible results. LiteLLM raises ValueError on create_skill for identity-less callers
    to prevent ambiguous ownership, but discovery reads intentionally publish all stored skills regardless of caller identity.
  why: >-
    Discovery endpoints require public read access when enabled. The missing-principal bypass is intentional per the outline.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/litellm_proxy/skills/handler.py#L167-L180
out_of_scope:
- LiteLLMSkillsHandler.create_skill (litellm/llms/litellm_proxy/skills/handler.py:65-110), list_skills_for_search
  (138-149), delete_skill (182-197) and fetch_skill_from_db (199-212) remain for B048's future leaf tasks, which
  must depend on B3212 for read and conversion callees.
pitfalls:
- 'The oracle helper for this task is pre-registered as b3212 in the core group. Replace the stub Op in
  tools/oracle/src/helpers/core_ops/b3212.rs with an impl Helper whose Input is the typed input, and write run
  in tools/oracle/helpers/b3212.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are
  not this task''s to edit.'
- The negative-cache sentinel is a distinct string value, not a cached None, so the code distinguishes cache hits (including
  false negatives) from misses.
- Reads from B2226 cache happen before ownership checks; the cache is per-skill not per-caller, and discovery can map
  cache misses differently than not-found errors.
- Avoid copying the cache initialization or access patterns from B2226; call B2226 functions through dependency injection
  or through B1018's managed resource store interface.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
