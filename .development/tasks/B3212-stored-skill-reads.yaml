dod:
- text: >-
    skill_to_typed_conversion handles Base64 decoding of file_content field when converting from stored rows.
  proof:
  - behavior-tests
- text: >-
    missing_principal_bypass: list_skills(limit=1000) and get_skill(skill_id) succeed when called without a principal,
    returning no filtered results for list and not-found for get. Authenticated identity-less callers have no owner scopes.
  proof:
  - behavior-tests
  - missing-principal-invariant
- text: >-
    cache_policy: Positive and negative cache entries persist for 60 seconds. A distinct sentinel caches true "not found"
    separately from cache misses, so repeated misses avoid DB. The cache is per-skill not per-caller. Cache initialization
    accepts max_size_in_memory and default_ttl from B2226.
  proof:
  - behavior-tests
- text: >-
    ownership_checks: Calls to is_proxy_admin, get_resource_owner_scopes and user_can_access_resource_owner return
    owner-filtered results. Cross-owner and missing rows return the same not-found error message.
  proof:
  - behavior-tests
- text: >-
    list_pagination: Rows are ordered descending by created_at; limit and offset parameters control pagination. Zero
    owner_scopes returns empty list. Non-admin callers filter by created_by IN (owner_scopes).
  proof:
  - behavior-tests
- text: >-
    postgres_read_behavior: Real Postgres skill rows are read with correct ownership filtering and cache state.
  proof:
  - postgres-tests
- text: >-
    The independently invoked MIT helper matches the production operation and the new helper-case seed replays.
  proof:
  - helper-python
  - helper-case-corpus
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The named domain behavior tests are absent or pinned behavior fails.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::stored_skill_reads::tests::/) - test(/replays_the_/)'
  - id: missing-principal-invariant
    why: Identity-less list_skills and get_skill succeed without requiring an auth check.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^stored_skill_reads_missing_principal$/)'
  - id: postgres-tests
    why: Real Postgres skill row reads with ownership filtering are absent or fail.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::stored_skill_reads_postgres$/)'
  - id: helper-python
    why: The referenced helper adapter is missing or strict Python checking fails.
    run: test -f tools/oracle/helpers/b3212.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/stored-skill-reads-*")" && grep -rlq "stored_skill_reads" tools/oracle/fuzz/corpus/helper_case/stored-skill-reads-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
