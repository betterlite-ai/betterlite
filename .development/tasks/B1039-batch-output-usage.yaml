checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_output_usage::/) -
      test(/::replays_corpus$/)'
  - id: case-chat-output-usage
    why: the chat-output-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_output_usage::tests::chat_output_usage($|::)/)'
  - id: case-responses-output-usage
    why: the responses-output-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_output_usage::tests::responses_output_usage($|::)/)'
  - id: case-anthropic-result-usage
    why: the anthropic-result-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_output_usage::tests::anthropic_result_usage($|::)/)'
  - id: case-ocr-line-cost
    why: the ocr-line-cost behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_output_usage::tests::ocr_line_cost($|::)/)'
  - id: case-vertex-native-usage
    why: the vertex-native-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_output_usage::tests::vertex_native_usage($|::)/)'
  - id: case-malformed-output-line-warning
    why: the malformed-output-line-warning behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_output_usage::tests::malformed_output_line_warning($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/batch_output_usage)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/batch_output_usage.rs && grep -qF "decode_batch_output_usage"
      crates/betterlite-core/fuzz/fuzz_targets/batch_output_usage.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::batch_output_usage::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/batch_output_usage.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/batch_output_usage-*)"
      && grep -qE "^[[:space:]]+batch_output_usage:" tools/oracle/fuzz/corpus/helper_case/batch_output_usage-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/batch-output-usage)"
