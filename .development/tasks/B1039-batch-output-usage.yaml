pitfalls:
- 'The oracle helper for this task is pre-registered as batch_output_usage in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/batch_output_usage.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/batch_output_usage.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'batch_utils.py:329 emits the diagnostic ''batch output aggregate: cost=%s usage=%s models=%s successful=%d failed=%d'';
  retain its level and fallback instead of turning it into a hard error.'
- batch_utils.py:216 emits the diagnostic 'batch output line could not be costed, so it is billed at $0 and the
  rest of the batch is still billed. custom_id=%s error=%s'; retain its level and fallback instead of turning it
  into a hard error.
