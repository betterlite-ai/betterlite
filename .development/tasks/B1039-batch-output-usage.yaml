id: B1039
title: Batch output usage
description: >-
  Parse batch output JSONL into typed success/error/token/cost aggregates using B068 pricing and B013 local token
  counting. Cover chat, Responses, Anthropic, embedding, OCR and Vertex usage shapes, preserving malformed-line
  diagnostics and exact Decimal totals.


  For Bedrock embedding batch output, _get_batch_job_usage_from_response_body calls B649 titan_embedding_usage_from_batch_output
  directly; reuse its key-presence and bool-exclusion cases.


  Implement crates/betterlite-core/src/api/batch_output_usage.rs. Use BatchOutputUsageInput and BatchOutputUsageResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions chat_output_usage, responses_output_usage, anthropic_result_usage,
  ocr_line_cost, vertex_native_usage, malformed_output_line_warning under api::batch_output_usage::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::batch_output_usage::decode_batch_output_usage(bytes:
  &[u8], limits: &ApiLimits), for json.loads input line at litellm/batches/batch_utils.py:595. Place its implementation
  in crates/betterlite-core/src/api/batch_output_usage.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-core/fuzz/fuzz_targets/batch_output_usage.rs passes arbitrary bounded bytes to that exact decoder;
  api::batch_output_usage::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  Register HelperCall::BatchOutputUsage in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_output_usage: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/batches/batch_utils.py: _classify_output_line_stats (L184-L200); litellm/batches/batch_utils.py:
  _safe_output_line_stats (L203-L222); litellm/batches/batch_utils.py: _compute_output_line_stats (L225-L255); litellm/batches/batch_utils.py:
  _ocr_usage_info_from_response_body (L258-L263); litellm/batches/batch_utils.py: _output_line_cost (L266-L293);
  litellm/batches/batch_utils.py: _aggregate_batch_cost_usage_models (L296-L345); litellm/batches/batch_utils.py:
  calculate_vertex_ai_batch_cost_and_usage (L348-L406); litellm/batches/batch_utils.py: _iter_batch_input_lines
  (L562-L577); litellm/batches/batch_utils.py: _iter_batch_output_entries (L580-L590); litellm/batches/batch_utils.py:
  _parse_batch_output_line (L593-L602); litellm/batches/batch_utils.py: _estimate_batch_entry_tokens (L610-L614);
  litellm/batches/batch_utils.py: _count_entry_tokens (L617-L637); litellm/batches/batch_utils.py: _count_prompt_or_input_tokens
  (L640-L670); litellm/batches/batch_utils.py: _get_batch_job_usage_from_response_body (L673-L713); litellm/batches/batch_utils.py:
  _get_anthropic_result_from_batch_results_line (L716-L723); litellm/batches/batch_utils.py: _get_response_from_batch_job_output_file
  (L726-L738); litellm/batches/batch_utils.py: _batch_response_was_successful (L741-L756). Abstract/protocol declarations
  map to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 303 owned nonblank/non-comment/non-docstring Python lines (365 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 323 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 651 total within the 660-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B013 (Model cost map, provider capability data and token counting), B068 (Cost calculation
  for every call type), B171 (Direct helper oracle and URL path encoding), B1035 (Batch records), B1087 (Api boundaries),
  B906 (Responses usage). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
