dod:
  - text: response_total_tokens returns total_tokens for chat, embedding and text-completion responses with usage, and 0 for any other response or a missing usage.
    proof: [response-tokens-tests]
  - text: The success hook decrements the key global_max_parallel_requests by 1 with local_only=true when global_max_parallel_requests is set, and does not touch it when it is unset.
    proof: [success-global-slot-tests]
  - text: The success hook writes the API key counter as {max(requests - 1, 0), tpm + total_tokens, rpm}, with the fallback {1, 0, 0} when the cache has no entry.
    proof: [success-key-counter-tests]
  - text: The success hook writes the model group counter under {key}::{model_group}::{minute}::request_count only when the model group is set and a model limit source exists (model_rpm_limit or model_tpm_limit key in metadata, a non-None model_max_budget, or a per-model limit lookup result).
    proof: [success-model-group-tests]
  - text: The success hook writes the user, team and end-user counters with the fallback {1, total_tokens, 1}, so tokens are added twice when the cache has no entry.
    proof: [success-entity-counter-tests]
  - text: The success hook sends all new values in one batch write with ttl=60 and no local_only, in the order key, model group, user, team, end user, even when the list is empty.
    proof: [success-batch-write-tests]
  - text: An error in the success hook goes to print_verbose and the method returns normally, with the batch write skipped.
    proof: [success-swallowed-error-tests]
  - text: The failure hook does nothing when user_api_key is None or the exception text contains the max-parallel-request limit message.
    proof: [failure-skip-tests]
  - text: The failure hook reads and then decrements the global key with local_only=true when global_max_parallel_requests is set.
    proof: [failure-global-slot-tests]
  - text: The failure hook writes the key counter with requests reduced by 1 (not below 0), tokens and rpm unchanged, through one set call with ttl=60.
    proof: [failure-key-counter-tests]
  - text: 'The failure hook logs a cache error at error level with the text "Inside Parallel Request Limiter: An exception occurred - {error}" and returns normally.'
    proof: [failure-logged-error-tests]
  - text: The post-call hook writes the four x-ratelimit-* integer headers from the key counter and the key's rpm_limit and tpm_limit, keeps other additional_headers and other hidden params, and writes nothing without a counter or without hidden params.
    proof: [remaining-headers-tests]
  - text: The post-call hook reads the counter under the text "None::{minute}::request_count" when the logged api key is None.
    proof: [remaining-none-key-tests]
checks:
  optional: []
  commands:
    - id: response-tokens-tests
      why: response_total_tokens is missing or counts tokens for responses it should ignore
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::response_tokens::/)'
    - id: success-global-slot-tests
      why: the success hook does not release the global slot with local_only, or releases it when the limit is unset
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::success_event::global_slot_/)'
    - id: success-key-counter-tests
      why: the API key counter arithmetic or its fallback is wrong
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::success_event::key_counter_/)'
    - id: success-model-group-tests
      why: the model group counter is written when it should not be, or skipped when a limit source exists
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::success_event::model_group_/)'
    - id: success-entity-counter-tests
      why: the user, team or end-user counter uses the wrong fallback or is not written
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::success_event::entity_counter_/)'
    - id: success-batch-write-tests
      why: the success hook writes counters one by one, or with the wrong ttl, order or local_only
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::success_event::batch_write_/)'
    - id: success-swallowed-error-tests
      why: the success hook lets an error escape or still writes the batch after an error
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::success_event::swallowed_error_/)'
    - id: failure-skip-tests
      why: the failure hook decrements for a request that never took a slot
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::failure_event::skip_/)'
    - id: failure-global-slot-tests
      why: the failure hook does not read then decrement the global key with local_only
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::failure_event::global_slot_/)'
    - id: failure-key-counter-tests
      why: the failure hook changes tokens or rpm, skips the floor at 0, or writes with the wrong ttl
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::failure_event::key_counter_/)'
    - id: failure-logged-error-tests
      why: the failure hook returns an error or does not log it at error level with LiteLLM's text
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::failure_event::logged_error_/)'
    - id: remaining-headers-tests
      why: the post-call hook writes wrong header names or values, drops other headers, or writes without a counter
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::remaining_headers::headers_/)'
    - id: remaining-none-key-tests
      why: the post-call hook does not read the text key "None::..." for a missing logged api key
      run: cargo nextest run --locked -p betterlite-rate-limit --no-tests=fail -E 'test(/^legacy_completion_accounting::tests::remaining_headers::none_key_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "async_pre_call_hook is owned by B3049; it writes the counters this task decrements."
  - "get_internal_user_object (L769-L801) has no caller at the pin, so it is not built and has no cases."
  - "__init__, print_verbose, check_key_in_limits, time_to_next_minute, raise_rate_limit_error and get_all_cache_objects are owned by B3047."
  - "InternalUsageCache itself, and extracting the parent trace span from kwargs (`_get_parent_otel_span_from_kwargs`); the caller passes the span in."
  - "Choosing this handler over the v3 limiter from LEGACY_MULTI_INSTANCE_RATE_LIMITING (hooks/__init__.py) and the HTTP oracle cases for it belong to the task that wires hook selection."
pitfalls:
  - "The user, team and end-user fallback is {1, total_tokens, 1}, not {1, 0, 0}, and the new value adds total_tokens again, so a cache miss counts the tokens twice and leaves rpm at 1. Only the API key and model group blocks use {1, 0, 0}."
  - "precise_minute uses local server time (`datetime.now()`), not UTC, in the format %Y-%m-%d-%H-%M; the pre-call hook and these hooks must agree on it."
  - "The success hook reads metadata with `metadata[\"user_api_key\"]`, which raises when the key is absent, and LiteLLM's catch-all turns that into a verbose print with nothing written; a present key holding None just skips the key block."
  - "The model group check tests whether `model_rpm_limit` or `model_tpm_limit` is a key of the key metadata, not whether its value is truthy, and `user_api_key_model_max_budget` counts as soon as it is not None, even when empty."
  - "The failure hook's skip is a substring test on the exception text (`in str(exception)`), not an equality test."
  - "The failure hook reads the global key and drops the value before decrementing; keep the read so the recorded cache calls match."
  - "The success hook batch write has no local_only, while the global slot calls in both hooks have local_only=true."
  - "post_call_success_hook formats a None api key into the key text as `None`, and it writes header values as integers."
  - "The success and failure hooks swallow errors (verbose print and error log), but the post-call hook does not; a cache error there reaches the caller."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
