id: B3048
title: Legacy rate-limit completion accounting
description: >-
  Build the part of LiteLLM's legacy parallel request limiter that runs after a request ends, in a new module `legacy_completion_accounting` of `betterlite-rate-limit`.
  LiteLLM only uses this limiter when `LEGACY_MULTI_INSTANCE_RATE_LIMITING` is "true"; B3049 owns the admission hook that counts a request in, and this task owns what counts it out and records its tokens.
  The methods are an `impl` block on the legacy handler type that B3047 builds in `rate_limiters`, and they use its `internal_usage_cache` field, its `print_verbose` method and the clock it holds for the minute key.
  Do not call the system clock directly.

  Every counter lives in the cache under `{id}::{precise_minute}::request_count` and holds three integers: `current_requests`, `current_tpm`, `current_rpm`. `precise_minute` is the handler's local time formatted `%Y-%m-%d-%H-%M`, read fresh on each call.
  Define one typed struct for the counter value (`current_requests`, `current_tpm`, `current_rpm`, all `i64`) if B3047 has not already put one in its module. Use checked arithmetic and return an error on overflow.

  `response_total_tokens(response)` returns `usage.total_tokens` when the response is a chat, embedding or text-completion response whose usage is a real usage object, and 0 for every other response or a missing usage.
  Model the input as an enum with those three variants (each holding an optional usage with `total_tokens`) plus an `Other` variant.

  `log_success_event` (LiteLLM `async_log_success_event`) takes a typed event: the `litellm_params.metadata` fields `global_max_parallel_requests`, `user_api_key`, `user_api_key_user_id`, `user_api_key_team_id`, `user_api_key_model_max_budget`, `user_api_key_metadata`, `user_api_key_team_metadata`, plus the top-level `user` (the end user id), the response, and the parent trace span that the caller already extracted.
  It runs in this order.
  First, when `global_max_parallel_requests` is set, it calls `async_increment_cache` on the key `global_max_parallel_requests` with value -1 and `local_only=true`. There is no floor at zero.
  Then it reads the counter for each id below with a plain `async_get_cache` (no `local_only`), builds the new value, and appends `(key, new_value)` to a list.
  For the API key (when `user_api_key` is not None): the fallback when the cache has no entry is `{current_requests: 1, current_tpm: 0, current_rpm: 0}`. The new value is `{max(current_requests - 1, 0), current_tpm + total_tokens, current_rpm}`.
  For the model group, `model_group` comes from B3891's `get_model_group_from_litellm_kwargs`. This block runs when `user_api_key` and `model_group` are both not None and at least one holds: the key metadata map contains the key `model_rpm_limit`, it contains the key `model_tpm_limit` (presence of the key counts, even with an empty value), `user_api_key_model_max_budget` is not None (an empty map counts), or B745's `get_key_model_tpm_limit` or `get_key_model_rpm_limit` returns a value for `model_group`.
  Those two lookups run on a key auth value built from only `api_key`, `metadata`, `model_max_budget` and `team_metadata`. The cache key is `{user_api_key}::{model_group}::{precise_minute}::request_count`, with the same fallback and arithmetic as the API key block.
  For the user, the team and the end user (each only when its id is not None): the fallback is `{current_requests: 1, current_tpm: total_tokens, current_rpm: 1}` and the new value uses the same arithmetic as the API key. That adds the tokens twice when the cache has no entry, and LiteLLM does exactly this.
  The order of blocks is API key, model group, user, team, end user. At the end one `async_batch_set_cache` call writes the whole list with `ttl=60` (no `local_only`), even when the list is empty.
  Any error inside this method, including a missing `user_api_key` key in the metadata or a counter value that lacks a field, is caught. It is passed to `print_verbose` and the method returns normally. Writes already made (the global decrement) stay made, and the batch write does not happen.
  Each new value is also passed to `print_verbose` as "updated_value in success call: {new_val}, precise_minute: {precise_minute}".

  `log_failure_event` (LiteLLM `async_log_failure_event`) takes the metadata map (an absent or empty map is allowed), `user_api_key`, `global_max_parallel_requests`, the exception's message text and the parent span.
  It returns at once when `user_api_key` is None. It also does nothing at all when the message contains the text "Crossed TPM / RPM / Max Parallel Request Limit" (LiteLLM's `CommonProxyErrors.max_parallel_request_limit_reached`), since that request never took a slot.
  Otherwise, when `global_max_parallel_requests` is set, it reads the key `global_max_parallel_requests` with `local_only=true`, ignores the value, and then decrements it by 1 with `local_only=true`.
  Then it reads the key's counter (same fallback `{1, 0, 0}`) and writes `{max(current_requests - 1, 0), current_tpm, current_rpm}` back with a single `async_set_cache(key, value, ttl=60)`. Tokens and the request count are not changed, and the model, user, team and end-user counters are not touched.
  An error here is logged with the error-level logger and the text "Inside Parallel Request Limiter: An exception occurred - {error}" (with the trace), not through `print_verbose`.

  `post_call_success_hook` (LiteLLM `async_post_call_success_hook`) reads the counter under the logged api key with a plain `async_get_cache`. The logged key is B1106's `get_logged_api_key` (the key alias for a session token that has one, otherwise `api_key`). If that is None the cache key is the text "None::{precise_minute}::request_count", because LiteLLM formats the None into the f-string.
  When a counter exists: if the auth value's `rpm_limit` is set, remaining requests is `rpm_limit - current_rpm` and the limit is `rpm_limit`. If `tpm_limit` is set, remaining tokens is `tpm_limit - current_tpm` and the limit is `tpm_limit`. A negative remaining value is written as it is.
  When the response has hidden params (a typed struct or a map), it takes the existing `additional_headers` map (or an empty one), sets whichever of `x-ratelimit-remaining-requests`, `x-ratelimit-limit-requests`, `x-ratelimit-remaining-tokens` and `x-ratelimit-limit-tokens` it computed (as integers, not strings, replacing an existing header of the same name), and stores the hidden params again with every other field unchanged. With no hidden params it changes nothing and returns. It never fails on a missing counter. A cache error is not caught here and goes back to the caller.

  Cache failures need a small error enum owned by this module (`AccountingError`, in `legacy_completion_accounting/error.rs`) with the cache error as `#[source]`.
  Keep each file under 300 lines. Suggested files: `response_tokens.rs`, `success_event.rs`, `failure_event.rs`, `remaining_headers.rs`, `error.rs`, and the tests in `tests.rs` with `tests/response_tokens.rs`, `tests/success_event.rs`, `tests/failure_event.rs`, `tests/remaining_headers.rs`.
  Tests use an in-memory test double for the cache that records every call (method, key, value, ttl, `local_only`) in order, and a fixed test clock. Write each test as a named rstest case with literal inputs.
scope:
  paths:
    - crates/betterlite-rate-limit/src/legacy_completion_accounting.rs
    - crates/betterlite-rate-limit/src/legacy_completion_accounting/**
    - crates/betterlite-rate-limit/Cargo.toml
    - Cargo.toml
  lint_tables: false
