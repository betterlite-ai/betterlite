dod:
  - text: Named sibling, rename/delete and failure cases in the description pass, with Postgres row
      assertions for replacement order and effects that survive cache failure.
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^access_group_models::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/access_group_models.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/access-group-models-*")"
        && grep -rlq "access_group_models" tools/oracle/fuzz/corpus/helper_case/access-group-models-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/access_group_models::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/access_group_models::tests::postgres_failure_effects$/)'
oracle_cases:
  - tools/oracle/cases/helpers/access-group-models/own-id-not-sibling.yaml
  - tools/oracle/cases/helpers/access-group-models/absent-or-db-sibling.yaml
  - tools/oracle/cases/helpers/access-group-models/config-sibling-short-circuit.yaml
deviations: []
out_of_scope:
  - B844 owns catalog lookup algorithms and B819 owns concurrent cache failure handling.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - The database count includes the modified deployment if its primary rename/delete has not happened yet.
  - Replacing duplicate old names can produce duplicate new names despite first removing pre-existing new-name entries.
budget:
  max_changed_lines: 450
  max_new_expects: 0
review_level: security
