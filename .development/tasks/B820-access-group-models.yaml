    - crates/betterlite-server/src/access_group_models.rs
    - crates/betterlite-server/src/access_group_models/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/src/helpers/access_group_models.rs
    - tools/oracle/src/helpers/access_group_models/**
    - tools/oracle/helpers/access_group_models.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/models.rs
    - tools/oracle/helpers/management/models.py
    - tools/oracle/cases/helpers/access-group-models/**
    - tools/oracle/fuzz/corpus/helper_case/access-group-models-*
    - crates/betterlite-server/src/access_group_models/fixtures/**
  lint_tables: false
