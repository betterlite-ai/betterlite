    why: Own sync_access_groups_for_renamed_model; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_helpers/access_group_model_sync.py#L109-L119
    why: Own sync_access_groups_for_deleted_model; preserve caller-visible values and failure ordering.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: rename_last_deployment,
      config_sibling_retains_grant, delete_last_deployment, delete_with_sibling, array_rewrite_bound,
      cache_invalidation, postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^access_group_models::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/access_group_models.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/access-group-models-*")"
        && grep -rlq "access_group_models" tools/oracle/fuzz/corpus/helper_case/access-group-models-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/access_group_models::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/access_group_models::tests::postgres_failure_effects$/)'
oracle_cases:
  - tools/oracle/cases/helpers/access-group-models/rename-last-deployment.yaml
  - tools/oracle/cases/helpers/access-group-models/config-sibling-retains-grant.yaml
  - tools/oracle/cases/helpers/access-group-models/delete-last-deployment.yaml
  - tools/oracle/cases/helpers/access-group-models/delete-with-sibling.yaml
  - tools/oracle/cases/helpers/access-group-models/array-rewrite-bound.yaml
  - tools/oracle/cases/helpers/access-group-models/cache-invalidation.yaml
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - A remaining configuration-backed sibling preserves the public model grant.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: security
