id: B820
title: Maintain model grants across rename and delete
description: >-
  Implement model-name grant maintenance after a deployment rename or deletion. Use B844 Router
  get_model_ids/get_deployment lookups for config siblings, B726 AccessGroupRepository pinned through
  B714 writer_wrapper for SQL and B819 invalidate_access_group_caches for effects. A sibling must have
  a different deployment ID, exist in the catalog and have falsey model_info.db_model. No router yields
  false. Any such sibling short-circuits still_backed=true without SQL; otherwise SELECT COUNT(*)::int
  from LiteLLM_ProxyModelTable WHERE model_name=$1 and return whether ANY returned row has count>0.
  This count does not exclude the supplied model_id, so callers must already have completed their primary
  write. Cases own_id_not_sibling, absent_or_db_sibling, config_sibling_short_circuit and
  database_count_includes_current_id establish the exact predicate and query order.

  Rename returns immediately when old_name==new_name, even with no database/router. If the old name
  remains backed, append new_name only to groups containing old_name and not already containing new_name;
  retain old_name. Otherwise remove every pre-existing new_name then array_replace old_name with new_name
  in groups containing old_name. This preserves positions of old occurrences, including duplicate new
  names when old_name occurred more than once; do not sort or globally deduplicate. Deletion does nothing
  while the name remains backed, else removes every occurrence of that name. All SQL names are bound,
  not interpolated; only touched rows are returned. Cases rename_same_no_io, rename_backed_appends,
  replace_preserves_old_positions, delete_backed_noop and delete_last_name cover the branches.

  Own the four SQL constants and _TouchedGroupRow/_DeploymentCountRow projections as well as the
  listed functions. Parse returned rows, then pass touched IDs in returned order to B819's concurrent
  all-attempt cache invalidator, even for an empty tuple. There is no surrounding transaction here:
  an invalid row or cache failure can occur after the rewrite committed; a retry whose append/delete
  changes no rows cannot reconstruct the previous touched set. Native postgres_pinned_rows and
  postgres_failure_effects cover parameter binding, nullable arrays, duplicates and this retry boundary.
  No settings, credentials, paid-tier branch or HTTP handler belong to this component.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/access_group_model_sync.py:
  RawExecutor.query_raw (L28-L28; 1 source lines), raw_executor (L57-L59; 3 source lines), _config_sourced_sibling
  (L62-L66; 5 source lines), _served_by_a_config_deployment (L69-L75; 7 source lines), still_backed (L78-L82;
  5 source lines), _rewrite_groups (L85-L89; 5 source lines), sync_access_groups_for_renamed_model (L92-L106;
  15 source lines), sync_access_groups_for_deleted_model (L109-L119; 11 source lines).


  Restrict B856's helper operation to _config_sourced_sibling and _served_by_a_config_deployment against
  injected catalog snapshots. B171 decodes the seed and Rust calls production predicates. SQL/cache
  orchestration is exercised by native Postgres tests; it is not a pure helper operation.


  Name-array SQL cases use B860 schemas on POSTGRES_TEST_URL, with testcontainers as the unset-variable
  fallback; they fail on unavailable Postgres and compare duplicate/order behavior in stored arrays.


  Sizing: 78 nonblank, noncomment owned lines including all SQL and row declarations, excluding imports
  and module documentation; allow 110 production, 240 behavior/Postgres tests, 60 helper adapters,
  30 wiring, 0 decoder/fuzz and 0 config lines, 440 changed lines within a 450-line gate.
