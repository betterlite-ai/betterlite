id: B820
title: Maintain model grants across rename and delete
description: >-
  Implement AccessGroupModelSync over stored and configured deployment siblings. Rewrite only grants whose
  served public model name actually disappears; a remaining configuration-backed sibling keeps its access
  group name. Use the B368 catalog snapshot and atomic SQL array rewrite.


  Build the production access_group_models module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/access_group_model_sync.py:
  RawExecutor.query_raw (L28-L28; 1 source lines), raw_executor (L57-L59; 3 source lines), _config_sourced_sibling
  (L62-L66; 5 source lines), _served_by_a_config_deployment (L69-L75; 7 source lines), still_backed (L78-L82;
  5 source lines), _rewrite_groups (L85-L89; 5 source lines), sync_access_groups_for_renamed_model (L92-L106;
  15 source lines), sync_access_groups_for_deleted_model (L109-L119; 11 source lines).


  Add the access_group_models operation under B856 Management::models. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a access-group-models-* seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 52 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  65 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 314 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
