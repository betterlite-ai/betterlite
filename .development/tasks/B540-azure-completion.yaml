id: B540
title: Azure text completions
description: >-
  Implement Azure text-completion execution using the existing typed text models and stream decoder. Every call
  runs prompt_factory with azure_text, including calls already presented as text completions. Preserve explicit
  completion parameters, Cloudflare model=None, max_retries default 2 and the pinned 422 errors for a noninteger
  retry count or missing model/messages.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/completion/handler.py:
  AzureTextCompletion.__init__ L18-L19; AzureTextCompletion.validate_environment L21-L29; AzureTextCompletion.completion
  L31-L186; AzureTextCompletion.acompletion L188-L247; AzureTextCompletion.streaming L249-L300; AzureTextCompletion.async_streaming
  L302-L358. litellm/llms/azure/completion/transformation.py: AzureOpenAITextConfig.__init__ L31-L51.


  Run prompt_factory(custom_llm_provider="azure_text") on every call, including already text-like input. Cloudflare
  gateway embeds the deployment in the URL and sends model=None. max_retries defaults to 2; a non-integer max_retries
  or missing model/messages returns AzureOpenAIError 422.


  Implement crates/betterlite-azure/src/completion.rs with adjacent tests under completion/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_completion in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function completion_cases in betterlite-azure with these exact named cases (one per oracle file):
  text_prompt_request, chat_to_text_prompt, token_prompt, stream_text_choices, completion_errors, azure_text_prompt_every_call,
  cloudflare_model_null, max_retries_default_two, invalid_retries_422, missing_model_messages_422. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_completion* using HelperCase: kind: helper
  and the externally tagged azure_completion variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_completion that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 335 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 350 production lines, 135 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 605 planned, 625 maximum changed lines.
