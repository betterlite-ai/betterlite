id: B540
title: Azure text completions
description: >-
  Implement Azure text-completion execution using the existing typed text models and stream decoder. Every call
  runs prompt_factory with azure_text, including calls already presented as text completions. Preserve explicit
  completion parameters, Cloudflare model=None, max_retries default 2 and the pinned 422 errors for a noninteger
  retry count or missing model/messages.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/completion/handler.py:
  AzureTextCompletion.__init__ L18-L19; AzureTextCompletion.validate_environment L21-L29; AzureTextCompletion.completion
  L31-L186; AzureTextCompletion.acompletion L188-L247; AzureTextCompletion.streaming L249-L300; AzureTextCompletion.async_streaming
  L302-L358. litellm/llms/azure/completion/transformation.py: AzureOpenAITextConfig.__init__ L31-L51.


  Run prompt_factory(custom_llm_provider="azure_text") on every call, including already text-like input. Cloudflare
  gateway embeds the deployment in the URL and sends model=None. max_retries defaults to 2; a non-integer max_retries
  or missing model/messages returns AzureOpenAIError 422.


  Named case contracts: azure_text_prompt_every_call: Call B177 prompt_factory(custom_llm_provider=azure_text) on
  every input, not just the chat bridge. Build model/prompt then overlay every remaining optional param. Cloudflare
  selection uses gateway.ai.cloudflare.com substring and B531 client construction with data.model=None before option
  overlay. max_retries_default_two: Pop optional_params.max_retries with literal default 2, not the DEFAULT_MAX_RETRIES
  environment setting; explicit None stays None. Sync buffered rejects non-int with AzureOpenAIError 422 max retries
  must be an int (bool passes), while async buffered does not validate it. Direct sync streaming repeats the pop/check
  on data; the public caller already removed the key. missing_model_messages_422: Reject only None model/messages,
  before prompt conversion, with AzureOpenAIError 422 Missing model or messages; empty strings/lists proceed. azure_text_auth:
  validate_environment starts with content-type=application/json; non-None api_key adds api-key even when empty,
  otherwise non-None token adds Authorization=Bearer <token>. The completion headers argument is used for logging,
  not inserted into extra_headers. azure_text_stream_dispatch: Async branch streams for any truthy optional stream;
  sync requires the literal True. Public sync-stream call omits litellm_params so its helper gets {}; async preserves
  them. Both raw-create streams return B005 CustomStreamWrapper(provider=azure_text), never an async-generator facade
  that delays failures. azure_text_client_errors: Sync paths require AzureOpenAI, async require AsyncAzureOpenAI;
  other clients raise AzureOpenAIError 500 azure_client is not an instance of AzureOpenAI/AsyncAzureOpenAI respectively.
  Buffered paths preserve existing AzureOpenAIError; async-stream wraps every exception with status_code attribute
  default 500, str(error) and headers attribute or response.headers. azure_text_response_projection: Both buffered
  paths call completions.with_raw_response.create(**data,timeout=timeout), then B202 convert_to_chat_model_response_object.
  Sync first validates TextCompletionResponse; async passes model_dump directly. AzureOpenAITextConfig forwards
  frequency_penalty,logit_bias,max_tokens,n,presence_penalty,stop,temperature,top_p, each default None, to B202.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  OpenAI text config construction and optional text-to-chat conversion call B2237 directly; public text API routes
  are not prerequisites of this provider leaf.


  Implement crates/betterlite-azure/src/completion.rs with adjacent tests under completion/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function completion_cases in betterlite-azure with these exact named cases (one per oracle file):
  token_prompt, stream_text_choices, completion_errors, azure_text_prompt_every_call, cloudflare_model_null, max_retries_default_two,
  invalid_retries_422, missing_model_messages_422, azure_text_auth, azure_text_stream_dispatch, azure_text_client_errors,
  azure_text_response_projection. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_completion* using HelperCase: kind: helper
  and the externally tagged azure_completion variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_completion that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 335 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 355 production lines, 235 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 730 planned, 750 maximum changed lines.
