out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_completion in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/completion.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_completion.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The async stream selector uses truthiness while the sync selector uses is True, so the same non-boolean stream
  option follows different branches.
- A None retry value fails only where the synchronous guard runs; the async buffered path accepts it.
