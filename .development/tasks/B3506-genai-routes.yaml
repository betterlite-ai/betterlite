id: B3506
title: Serve Google generation streaming and token-count routes
description: >-
  Register HTTP routes for Google GenAI generation, streaming, and token counting in betterlite-server.
  Serve POST /v1beta/models/{model_name}:generateContent, /models/{model_name}:generateContent,
  POST /v1beta/models/{model_name}:streamGenerateContent, /models/{model_name}:streamGenerateContent,
  POST /v1beta/models/{model_name}:countTokens, and /models/{model_name}:countTokens.
  Each route receives requests from LiteLLM API clients using the Google GenAI SDK.
  Parse the JSON body (using B1100's request decoder), authenticate via B052's virtual key auth,
  extract the model name from the path, and dispatch to B3489's generation and streaming handlers.
  For generation, call the non-streaming path; for streaming, set stream=True and the GenAI-specific
  SSE flags (_litellm_skip_openai_stream_done and _litellm_raw_sse_stream) before dispatch.

  Token counting extracts contents from the request body. Translate contents to OpenAI-compatible
  messages by calling B3484's GoogleGenAIAdapter.translate_generate_content_to_completion, then
  build a TokenCountRequest with model, contents, and translated messages. Call the internal
  token_counter endpoint with call_endpoint=True. The response has three branches: (1) if
  token_response.original_response exists, return TokenCountDetailsResponse with its totalTokens
  and promptTokensDetails; (2) if token_response lacks original_response but has total_tokens,
  return totalTokens from token_response.total_tokens and promptTokensDetails as an empty array;
  (3) if token_response is None, return totalTokens=0 and promptTokensDetails=[].

  Return the same error status, type, param and code LiteLLM returns on provider errors (rule
  errors-match-litellm), with betterlite's own message. On exceptions during dispatch, extract
  the error and reraise it through the exception handler so the error response middleware (from B003)
  returns the correct HTTP response. Clients that read x-litellm-* response headers must see the
  ones LiteLLM sends: call id, model id, model group, model api base, and others the oracle cases
  show. The cost and key-limit headers wait for spend tracking and virtual keys.

