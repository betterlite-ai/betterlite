deviations:
  - what: Contents are translated to OpenAI-compatible messages via GoogleGenAIAdapter.translate_generate_content_to_completion before building TokenCountRequest for the internal token counter.
    why: The internal token counter accepts both native Google GenAI contents and OpenAI-format messages. Translation enables the existing counter handler to work with both formats without duplication.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L178
  - what: Token count response prioritizes original_response over total_tokens, and falls back to totalTokens=0 when both are absent.
    why: The three-branch response handling matches LiteLLM's internal token_counter fallback strategy, allowing graceful degradation when original response metadata is unavailable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L191-L211
  - what: betterlite sets _litellm_skip_openai_stream_done and _litellm_raw_sse_stream in streaming requests to prevent LiteLLM's OpenAI-specific stream terminator from being sent, matching LiteLLM's behavior for Google GenAI streaming.
    why: "The Google GenAI SDK expects raw SSE streaming without OpenAI's data: [DONE] terminator, per the SDK's (?alt=sse) parameter handling in LiteLLM."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/google_endpoints/endpoints.py#L110-L112
out_of_scope:
  - Interaction API routes (create, get, delete, cancel); those are owned by B3507.
  - Streaming response assembly and logging; B252 and B2227 handle buffered chunk assembly and completion callbacks.
  - Agent-specific interaction routes in agents_endpoints.py; those are owned by B3508.
  - Retries and fallbacks for generation or streaming requests.
  - Cost tracking headers (x-litellm-response-cost) and key-limit headers; they need spend tracking (B069) and virtual keys (B052).
  - The internal token counter handler itself; it is called but not implemented here.
pitfalls:
  - >-
    Set stream=True and _litellm_skip_openai_stream_done and _litellm_raw_sse_stream in the
    request data before calling the streaming dispatcher, not in the response, so the upstream
    handler sees the flags.
  - >-
    Model name extraction from the path must preserve any existing model field in the request
    body if it is already present, only setting it if missing.
  - >-
    The two routes (/v1beta/ and /) for each endpoint must share the same async handler
    function, not duplicate it, to avoid maintenance divergence.
  - >-
    When the upstream fails before sending the first byte, return the provider's error status
    and type, not a gateway error, so clients see the real failure.
  - >-
    The exception handler expects exceptions raised from the dispatcher, not errors in status
    codes; re-raise provider errors from the exception handler rather than returning them directly.
  - >-
    Contents list must be extracted as data.get("contents", []) with empty default; missing
    contents produces empty messages list, not an error.
  - >-
    Token count response branches in strict order: check token_response.original_response first,
    fall back to token_response.total_tokens second, then default to zero. Missing or None fields
    do not raise errors.
  - >-
    TokenCountDetailsResponse requires both totalTokens and promptTokensDetails fields;
    promptTokensDetails is a list, never null, and may be empty when token_response is the
    fallback source.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 2
