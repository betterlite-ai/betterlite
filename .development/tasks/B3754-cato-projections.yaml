dod:
  - text: Constructor initializes api_key (required, CATO_API_KEY env), api_base (optional, default https://api.aisec.catonetworks.com,
      CATO_API_BASE env), inspect_embeddings (boolean, default false) and raises CatoNetworksGuardrailMissingSecrets
      when api_key is absent.
    proof: [cato-tests, config-load]
  - text: Websocket SSL context is resolved from ssl_verify setting, matching HTTP client configuration for consistency.
    proof: [cato-tests]
  - text: API base is normalized by stripping trailing slashes and converted to websocket URLs by replacing http(s) protocols.
    proof: [cato-tests]
  - text: Inspection messages flatten multimodal list content into plain text and preserve chat messages 1:1 by index.
    proof: [oracle]
  - text: Extra inspection sources (input, instructions, prompt, schema strings) are appended as synthetic messages in fixed order
      so redaction slices map back to their origin field.
    proof: [cato-tests]
  - text: Schema string references are found recursively in tool/function and response_format JSON schemas, yielding description,
      title, const, default, enum and examples fields.
    proof: [cato-tests]
  - text: Request redaction applies anonymized text to messages by index, Responses input via apply_redacted_messages_back,
      instructions as a string, prompt as string or list, and schema strings in-place.
    proof: [cato-tests]
  - text: Batch-size validation rejects anonymize action when redacted message count does not match inspected message count
      and the call is string-only.
    proof: [cato-tests]
  - text: Block action raises 400 invalid_request_error with the detection message and logs enabled policies.
    proof: [oracle]
  - text: Headers for Cato include Authorization, x-cato-litellm-hook, x-cato-litellm-version, x-cato-call-id (if present),
      x-cato-user-email (if present) and x-cato-gateway-key-alias (if present).
    proof: [cato-tests]
  - text: Trusted user email is resolved from key-bound user_email only, never from caller-supplied end_user_id.
    proof: [cato-tests]
  - text: Configuration loads api_key (required, CATO_API_KEY env), api_base (optional, CATO_API_BASE env, default https://api.aisec.catonetworks.com),
      and inspect_embeddings (default false).
    proof: [cato-tests, config-load]
  - text: Unrecognized action_type (not in {monitor_action, block_action, anonymize_action}) is logged at error level and
      the request passes through unchanged.
    proof: [cato-tests, oracle]
