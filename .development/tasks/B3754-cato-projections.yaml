id: B3754
title: Cato inspection projections and request redaction
description: >-
  Build Cato's constructor initialization, trusted user-email selection, TLS settings for websocket
  connections, inspection message flattening and request redaction writeback helpers. The constructor
  reads api_key (required, CATO_API_KEY env), api_base (optional, default https://api.aisec.catonetworks.com,
  CATO_API_BASE env) and inspect_embeddings (boolean, default false). Convert api_base to websocket URLs
  by replacing http:// with ws:// and https:// with wss://, and resolve SSL context settings to pass to
  websockets.connect.

  Inspection message flattening extracts text from multimodal chat message content and appends synthetic
  user messages for Responses-API input/instructions, legacy completion prompts, and tool/function/response_format
  schema strings (description, title, const, default, enum and examples fields). Each source yields
  messages in a fixed order so redaction slices map back to their origin field, preserving the distinction
  between input, instructions, prompt and schema_strings for writeback.

  Request redaction writes anonymized text back to messages (by index), Responses input (via apply_redacted_messages_back),
  instructions (string), prompt (string or list of strings), and schema strings (in-place per their container).
  Batch-size validation rejects when redacted message count does not match inspected message count and the
  call is string-only. Log detection violations with the enabled-policies list. Raise 400 on block action
  with the detection message.

  Headers for the Cato API include Authorization (Bearer token), x-cato-litellm-hook (pre_call, moderation
  or output), x-cato-litellm-version (litellm version), x-cato-call-id (litellm_call_id if present),
  x-cato-user-email (key-bound user email if present) and x-cato-gateway-key-alias (key_alias if present).
scope:
