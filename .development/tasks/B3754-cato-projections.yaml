deviations:
  - what: Cato configuration returns detection_message with betterlite's own wording, not LiteLLM's.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status and code unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L327-L338
out_of_scope:
  - Lifecycle hook entry points (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook, async_post_call_streaming_iterator_hook
    wrapper logic); B3755 orchestrates when Cato guardrails are invoked.
  - Output inspection and redaction (call_cato_guardrail_on_output, _inspect_output_text, output fragment handling); B3755 owns those.
  - Websocket streaming and response handling (forward_the_stream_to_cato, _await_cato_message, stream message parsing); B3755 owns those.
  - Threshold-based decision whether to run inspection on a particular request; other tasks handle that.
  - Other guardrail providers (AIM, Akto, Cisco, etc.); each gets its own task.
pitfalls:
  - Schema string references must be found recursively, walking description, title, const, default, enum and examples fields,
    not stopping at the first level.
  - Inspection message flattening must preserve chat messages 1:1 by index, only flattening multimodal list content to plain text.
  - Extra inspection sources (input, instructions, prompt, schema strings) must be appended in fixed order so redaction slices
    map correctly back to their origin field.
  - Prompt inspection must handle both string (single prompt) and list (multiple prompts) forms correctly.
  - Batch-size validation error must check only when the call is string-only (is_string_batch_input), not for conversational calls.
  - Request redaction for schema strings must iterate through redactions in order, skipping missing ones, and only update if
    the redaction content is non-null.
  - Trusted user email must come from key-bound user_api_key_dict.user_email only, never from caller-supplied end_user_id,
    which is spoofable.
  - CATO_API_KEY must never be logged or shown in Debug output. Mark the field as SecretString and use it only in the
    Authorization header construction.
  - API base normalization must strip trailing slashes before converting to websocket URLs.
  - Websocket SSL kwargs must be resolved from the same ssl_verify setting as the HTTP client for consistency.
  - Unrecognized action_type must be logged at error level and the request passed through unchanged, not treated as a failure.
  - CATO_API_KEY secret handling requires security review due to its use in Authorization headers and the user identity resolution
    logic that prevents spoofing via caller-supplied end_user_id.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 1
