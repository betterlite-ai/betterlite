    why: >-
      JsonPathExtractor.extract_fields (lines 18-39) takes expressions and data,
      returns concatenated string of extracted values; JsonPathExtractor.evaluate
      (lines 41-92) supports simple keys, nested keys, and array wildcards with
      recursive remaining-path evaluation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_guardrails.py#L42-L69
    why: >-
      PassthroughGuardrailHandler.normalize_config accepts list or dict,
      returns dict form or None; handles list-to-dict conversion and type validation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_guardrails.py#L96-L113
    why: >-
      PassthroughGuardrailHandler.get_settings gets settings for a specific guardrail
      from normalized config, returns PassThroughGuardrailSettings or None.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_guardrails.py#L204-L274
    why: >-
      PassthroughGuardrailHandler.collect_guardrails merges passthrough-specific
      guardrails with org/team/key level guardrails using B1108's helper, preserves
      order and deduplicates by keeping first occurrence.

dod:
  - text: >-
      JSONPath extract_fields and evaluate implementations match LiteLLM on simple keys,
      nested keys, array wildcards and recursive remaining-path evaluation across all
      path forms.
    proof:
      - oracle
  - text: >-
      normalize_config accepts both list and dict input formats, returns dict form
      or None; list ["g1", "g2"] becomes {"g1": None, "g2": None}.
    proof:
      - behavior-tests
  - text: >-
      get_settings returns the PassThroughGuardrailSettings for a guardrail name
      from normalized config, or None if the guardrail is not found.
    proof:
      - behavior-tests
  - text: >-
      collect_guardrails merges passthrough-specific guardrails first, then inherited
      org/team/key-level guardrails from B1108's metadata helper, deduplicates by
      keeping first occurrence and returns HashMap<String, bool> or None.
    proof:
      - oracle
  - text: >-
      Field extraction concatenates matched values with newlines, skips failed
      expressions and logs debug messages on evaluation errors.
    proof:
      - behavior-tests
  - text: >-
      Array wildcard expressions like "documents[*].text" recursively evaluate the
      remaining path for each item and flatten results.
    proof:
      - oracle

