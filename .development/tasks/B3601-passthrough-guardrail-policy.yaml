id: B3601
title: Pass-through guardrail policy and JSONPath extraction
description: >-
  Implement the supported JSONPath subset and passthrough guardrail normalization,
  settings selection and inheritance in the common guardrail module. Preserve
  explicit opt-in, field selection and inherited-name deduplication; the unused
  alternate execution framework is excluded.

  Build JsonPathExtractor in crates/betterlite-guardrails/src/passthrough_policy.rs
  with methods extract_fields(data: &serde_json::Value, expressions: &[String]) -> String
  and evaluate(data: &serde_json::Value, expression: &str) -> Option<String | Vec<String>>.
  Support simple expressions like "query", nested keys like "foo.bar",
  array wildcards like "documents[*].text" returning all matching values concatenated
  with newlines. Return None on missing keys or type mismatches; log debug messages
  on evaluation failure. Preserve the optional/nullable semantics: empty strings and
  empty lists both return empty results, not None.

  Build PassthroughGuardrailsConfig and PassthroughGuardrailSettings typed records
  from the wire format. PassthroughGuardrailsConfig normalizes list (simple guardrail
  names) or dict (with request_fields/response_fields targeting) formats. Implement
  normalize_config(input) returning the dict form; get_settings(config, name) returning
  the settings for one guardrail; collect_guardrails(key_metadata, config) that merges
  passthrough-specific guardrails with inherited org/team/key-level guardrails using
  B1108's _add_guardrails_from_key_or_team_metadata call. Deduplicate guardrail names
  by insertion order (passthrough first, then inherited), keeping only the first occurrence
  of each name.

  Implement all functions as free functions in passthrough_policy module. Collect
  guardrails returns HashMap<String, bool> with each guardrail name mapped to true when
  enabled, or None when guardrails are not configured or the config is empty. Normalize
  config accepts both list and dict; on type error, log debug and return None. Field
  extraction applies JSONPath expressions in order, skipping any that fail to evaluate.

  Implement Rust/Python oracle adapters and all behavior tests under passthrough_policy::tests.

