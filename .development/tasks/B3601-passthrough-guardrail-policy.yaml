out_of_scope:
  - B1108 owns _add_guardrails_from_key_or_team_metadata for metadata-based guardrail inheritance.
  - is_enabled, get_guardrail_names, prepare_input, prepare_output, execute and get_field_targeted_text (passthrough_guardrails.py lines 71-202, 276-315) have no caller at the pin in the live graph and are not built.
  - Passthrough context storage (passthrough_context module) is out of scope; B3601 passes guardrails through parameters.

pitfalls:
  - >-
    Array wildcard expressions use [*] notation and must recursively evaluate
    the remaining path for each item in the array. A missing array or non-array
    item returns None.
  - >-
    Configuration accepts both list format like ["g1", "g2"] and dict format
    like {"g1": {"request_fields": [...]}}; both must be accepted and normalized
    to dict form.
  - >-
    Deduplication preserves insertion order, with passthrough-specific guardrails
    added first and inherited guardrails added only if not already present by name.
  - >-
    Field extraction concatenates values with newlines; empty results are empty
    strings, not None.
  - >-
    Failed JSONPath evaluations log debug messages but do not stop extraction;
    subsequent expressions continue to evaluate.
  - >-
    Inherited guardrails come from B1108's metadata helper; passthrough config and
    inherited guardrails are merged, not replaced.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
