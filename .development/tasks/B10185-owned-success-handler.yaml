id: B10185
title: One owned success handler, built once at server start
description: >-
  Three types hold the same nine owned fields of B250's borrowed `SuccessHandler` (crates/betterlite-logging/src/logging_success/handler.rs L38-L48): core's `OwnedSuccessHandler` (crates/betterlite-core/src/caching/hit_callbacks/job.rs L23-L33, B4301), betterlite-logging's `InteractionLoggingCallbacks` (logging_interactions/completion.rs L44-L55) and `StreamLoggingCallbacks` (passthrough_stream_logging/object.rs L65-L75). Four places then copy the same borrow literal from them: job.rs L88-L98, crates/betterlite-core/src/caching/lookup/hit.rs L201-L211, completion.rs L111-L121 and object.rs L102-L112. No production code builds any of the three: server.rs L110-L116 builds only the CallbackRegistry, SystemClock and ChatStreamAssembler that `LoggingWiring::start` takes, the registry goes into the private field of ServicePipeline (logging_service_events/wiring.rs L42-L47, pipeline.rs L45), and nothing calls `PayloadBuilder::new`. `HitLogging`, `SuccessHandlerDispatch` and `InteractionLoggingObject` are built only in tests. So B10177's pass-through call, B8631's router hop and the cache-hit path have no handler to log with. In LiteLLM every call's Logging object reads one process-wide callback setup (litellm.callbacks, standard_logging_payload_excluded_fields, _known_custom_logger_compatible_callbacks; __init__.py L121-L180 and L209), so the proxy has one handler setup from start.


  The merged type. A new file crates/betterlite-logging/src/logging_success/owned.rs, declared with `pub mod owned;` in logging_success.rs, holds `#[derive(Clone)] pub struct OwnedSuccessHandler` with eight public fields: `registry: Arc<CallbackRegistry>`, `payload_builder: Arc<dyn StandardPayloadBuilder>`, `stream_assembler: Arc<dyn StreamAssembler>`, `clock: Arc<dyn SuccessClock>`, `failure_counters: Vec<Arc<dyn CallbackFailureCounter + Send + Sync>>`, `excluded_fields: Vec<String>`, `known_callback: Arc<dyn Fn(&str) -> bool + Send + Sync>` and `privacy: Settings` (betterlite_config logging_privacy). The same file holds the one borrow, `impl<'handler> From<&'handler OwnedSuccessHandler> for SuccessHandler<'handler>`. The three old structs go. Core's job.rs and hit.rs, completion.rs and object.rs import the merged type and call `SuccessHandler::from(...)` where they wrote the literal. Their holders keep it behind an Arc so a request clones a pointer, never the vectors: `CacheHitCallbacks.handler`, `CacheHitSuccessJob.handler` and `HitLogging.handler` become `Arc<OwnedSuccessHandler>`, `InteractionLoggingObject.callbacks` becomes `Arc<OwnedSuccessHandler>`, and `SuccessHandlerDispatch.callbacks` too. betterlite-logging is the lowest crate all of them reach: core depends on it, and it owns SuccessHandler.


  The response stamp. The bundles carry one `ResponseStamp`, and SuccessHandler hands it to the redaction of every async callback's payload (handler.rs L190-L195, redaction.rs L14-L19). Built once at start, it would give every redacted response the same id and created time. LiteLLM builds a fresh `ModelResponse` for each redacted payload (integrations/custom_logger.py L955-L961), so each gets a new `chatcmpl-` id (types/utils.py L122-L123) and the current time. SuccessHandler loses its `stamp` field. `redacted_payload` takes `now: DateTime<FixedOffset>` in place of the stamp and builds `ResponseStamp { id: format!("chatcmpl-{}", Uuid::new_v4()), created: now.timestamp() }` itself, and handler.rs passes `handler.clock.now()` on the line that passed `handler.stamp`. B190's LoggingLifecycleConfig and LoggingLifecycle (payload/lifecycle.rs L42, L60, L80) lose the stamp they only handed to SuccessHandler (L103). The failure side's stamp (logging_failure/handlers.rs L175, L222) is not part of this bundle and stays.


  Building it once. `LoggingWiring` (wiring.rs L15-L22) is the one place the server builds its logging parts, so it also builds the handler. `LoggingWiring::start` takes one `LoggingInputs<'config>` struct, declared in wiring.rs, with `settings: &'config SettingsValues`, `clock`, `sink`, `registry` and `stream_assembler` (today's five arguments) and `success: SuccessInputs`. `SuccessInputs` holds `payload: PayloadBuilderConfig` (payload/builder.rs L22-L29), `failure_counters`, `excluded_fields` and `known_callback`. start registers the service callbacks as today, wraps the registry in one Arc, and hands `Arc::clone` of it, of the clock and of the stream assembler to both the pipeline and `OwnedSuccessHandler`; the payload builder is `Arc::new(PayloadBuilder::new(payload))` with privacy copied from `payload.privacy` first. LoggingWiring gains `pub success: Arc<OwnedSuccessHandler>`.


  The server's inputs. server.rs has 295 lines, so the call moves out: a new file crates/betterlite-server/src/server/logging_start.rs, declared with `mod logging_start;` in server.rs, holds `pub(super) fn start_logging(config: &Config, stream_assembler: Arc<dyn StreamAssembler>) -> Result<LoggingWiring, ServerError>`. run_with_listener calls it in place of L109-L116 and keeps `Arc::new(ChatStreamAssembler)` on its own line, where B8610 and B9840 look for it. start_logging builds today's SystemClock, TracingSink and `CallbackRegistry::new(config.sections.callback_settings.max_callbacks)`, and the success inputs from the config: `PayloadSources::default()` (payload/deps.rs L133-L156; every source has only its Absent implementation in production), `PayloadSettings { tag_config: TagConfig::default(), request_correlation_in_logs: false, log_client_error_tracebacks: config.sections.auth_errors.log_client_error_tracebacks }` written out in full, `Redactor::new(MINIMUM_CUSTOM_KEY_LENGTH)`, `Normalizer::new()`, `Base64Truncator::new` over `config.sections.prompt_affinity.maximum_base64_length` (the MAX_BASE64_LENGTH_FOR_LOGGING section, converted the way routing/prompt_affinity.rs L37-L39 does), `config.sections.logging_privacy`, `config.sections.payload_exclusions.excluded_fields`, an empty `failure_counters` (B8399 builds them) and `known_callback: Arc::new(|name: &str| KNOWN_CALLBACKS.contains(&name))` over betterlite-router's list (prompt_dispatch/known_callbacks.rs L1, LiteLLM's _custom_logger_compatible_callbacks_literal). A redactor, normalizer or truncator failure is a new `SuccessInputsError` in logging_start.rs, and ServerError gets one `SuccessInputs(#[from] SuccessInputsError)` variant. B8610 hands the Arc out through Shared, and B8631 and the cache-hit path take it from there.


  Tests. crates/betterlite-logging/src/logging_service_events/tests/success_wiring.rs, declared in logging_service_events/tests.rs: `wiring_builds_one_success_handler_over_its_parts` starts the wiring and asserts with Arc::ptr_eq that the handler's stream assembler and clock are the Arcs passed in, that its registry is the one the service callbacks were registered into (a service callback name from the settings is listed in it), and that excluded_fields, privacy and known_callback are the inputs. In logging_success/tests/redaction.rs, `each_redacted_payload_gets_a_fresh_response_id` redacts two payloads with message logging turned off and asserts both ids start with `chatcmpl-`, differ, and carry the test clock's second as created; `is_placeholder_response` (L22-L30) checks the prefix in place of the fixed id. crates/betterlite-server/src/server/logging_start/tests.rs: `start_logging_reads_the_handler_settings_from_the_config` builds a Config with excluded fields, turn_off_message_logging and log_client_error_tracebacks set and asserts the handler's excluded_fields and privacy and that known_callback answers true for langfuse and false for a custom name. The existing cache-hit, interaction, stream logging, lifecycle and wiring tests move to the new type and the inputs struct and stay green.
