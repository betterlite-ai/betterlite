dod:
  - text: One OwnedSuccessHandler in betterlite-logging replaces core's type, InteractionLoggingCallbacks and StreamLoggingCallbacks, and one From impl replaces their four borrow literals.
    proof: [one-type, logging-tests, core-tests]
  - text: Every redacted payload gets its own chatcmpl- id and the clock's current second, and no bundle carries a stamp.
    proof: [logging-tests]
  - text: LoggingWiring builds the handler once over the registry, clock and stream assembler the pipeline gets, and the server fills it from the config sections and KNOWN_CALLBACKS.
    proof: [logging-tests, server-tests]
  - text: A failed success callback counts once through the first registered logger whose failure_counter answers, read from the handler's registry at call time, and no failure counter slice is left in the success path.
    proof: [logging-tests, core-tests, one-type]
checks:
  optional: [mutants]
  commands:
    - id: logging-tests
      why: the merged type, the fresh stamp or the wiring's handler broke a success, interaction, stream logging, lifecycle or service event test
      run: grep -q 'fn wiring_builds_one_success_handler_over_its_parts' crates/betterlite-logging/src/logging_service_events/tests/success_wiring.rs && grep -q 'fn each_redacted_payload_gets_a_fresh_response_id' crates/betterlite-logging/src/logging_success/tests/redaction.rs && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^logging_success::/) | test(/^logging_interactions::/) | test(/^passthrough_stream_logging::/) | test(/^passthrough_logging_state::/) | test(/^logging_streams::/) | test(/^payload::/) | test(/^logging_service_events::/)'
    - id: core-tests
      why: the cache-hit job or the lookup's hit logging no longer logs through the shared handler
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^caching::hit_callbacks::/) | test(/^caching::lookup::/)'
    - id: server-tests
      why: the server builds the handler from the wrong section or the start path broke
      run: grep -q 'fn start_logging_reads_the_handler_settings_from_the_config' crates/betterlite-server/src/server/logging_start/tests.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::/)'
    - id: one-type
      why: an old bundle or a copied borrow literal is still there
      run: test -z "$(grep -rn 'pub struct InteractionLoggingCallbacks\|pub struct StreamLoggingCallbacks\|pub stamp:.&' crates/betterlite-logging/src)" && test -z "$(grep -rn 'pub struct OwnedSuccessHandler' crates/betterlite-core/src)" && test -z "$(grep -rn 'known_callback:.' crates/betterlite-core/src crates/betterlite-logging/src/logging_interactions crates/betterlite-logging/src/passthrough_stream_logging --include=*.rs | grep -v '/tests/' | grep -v 'tests.rs')" && test -z "$(grep -rn 'failure_counters' crates/betterlite-logging/src/logging_success crates/betterlite-logging/src/logging_service_events crates/betterlite-core/src/caching)"
oracle_cases: []
deviations: []
out_of_scope:
  - "B190's LoggingLifecycle (payload/lifecycle.rs L29-L62) keeps its own fields and its SuccessHandler literal (L95-L105): its failure path reads the concrete PayloadBuilder's redactor (L127-L129) and nothing builds it in production."
  - "Filling the registry with the configured loggers before start wraps it: B8399's register_callback_loggers, which B8742 calls in application(). PrometheusHooks' failure_counter override: B8399."
  - "Production payload sources: ModelCostInformation, SavedCacheCost, RequestAccessGroups and the autorouter audit have only their Absent implementations (payload/deps.rs L133-L156)."
  - "Config sections for disable_add_user_agent_to_request_tags, extra_spend_tag_headers and request_correlation_in_logs: none exists (only the reporting safe list names them, safe_proxy_config/litellm_settings.rs L62, L74, L123), so TagConfig and the flag keep their defaults."
  - "Handing the Arc to routes: B8610 keeps the wiring in ServerState, and B8631 passes the handler to the pass-through hop."
pitfalls:
  - "handler.rs has 300 lines. Removing the stamp field and passing the clock where the stamp went keeps it there; the stamp is built in redaction.rs."
  - "server.rs has 295 lines. The LoggingWiring call and its parts move to logging_start.rs, so server.rs shrinks; only Arc::new(ChatStreamAssembler), the call and the error variant stay."
  - "CallbackRegistry::register takes &mut self (registry.rs L76): register the service callbacks before the one Arc is made, as start does today."
  - "registry.rs has 269 lines; the lookup is one short method. Return the borrowed counter, never a clone of the logger Arc."
  - "Write the From impl as a trait impl: the rules forbid a constructor that only builds a struct, and they exempt trait impls."
  - "No struct update syntax with Default (the no-default-struct-update rule): write every PayloadSettings field."
  - "Clone an Arc with Arc::clone, never .clone() on the Arc."
review_level: standard
budget:
  max_changed_lines: 1050
  max_new_expects: 0
