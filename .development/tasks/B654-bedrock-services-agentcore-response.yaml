id: B654
title: Bedrock AgentCore JSON and SSE replies
description: >-
  Add AgentCoreReply decoding for JSON, textual/SSE payloads, content delta/message shapes and usage. Preserve typed
  fallback interpretations, original raw provider metadata and source error mapping while bounding parsing work.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/agentcore/transformation.py:
  AmazonAgentCoreConfig._extract_sse_json L294-L309; AmazonAgentCoreConfig._extract_usage_from_event L311-L321;
  AmazonAgentCoreConfig._extract_content_delta L323-L334; AmazonAgentCoreConfig._extract_content_from_message L336-L345;
  AmazonAgentCoreConfig._calculate_usage L347-L380; AmazonAgentCoreConfig._parse_json_response L382-L453; AmazonAgentCoreConfig._get_parsed_response
  L455-L480; AmazonAgentCoreConfig._parse_sse_stream L482-L529; AmazonAgentCoreConfig.transform_response L986-L1051.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/agentcore_response.rs with adjacent tests under agentcore_response/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_agentcore_response in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agentcore_response_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): json_openai_reply, json_content_message, sse_content_delta, sse_usage_event, plain_text_response, missing_usage,
  malformed_event_fallback. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream
  request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_agentcore_response* using HelperCase:
  kind: helper and the externally tagged bedrock_services_agentcore_response variant inside call. Do not put the
  Python stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_agentcore_response
  that parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on
  zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_agentcore_reply consumes AgentCore JSON/text response bytes in crates/betterlite-bedrock/src/agentcore_response.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_agentcore_response.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_agentcore_response.
  The adjacent test replays_the_bedrock_services_agentcore_response_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 228 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 250 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 521 planned, 525 maximum changed lines.
