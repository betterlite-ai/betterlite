pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_agentcore_response in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_agentcore_response.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_agentcore_response.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A JSON content-type selects parsing before body inspection, while text/plain JSON is treated as SSE and can yield
  empty content.
- A truthy final message replaces all collected deltas even when it has no readable text content.
