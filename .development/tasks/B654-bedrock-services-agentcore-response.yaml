checks:
  optional:
  - mutants
  commands:
  - id: case-json-openai-reply
    why: The json-openai-reply behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_response_cases::case_[0-9]+_json_openai_reply$/)'
  - id: case-json-content-message
    why: The json-content-message behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_response_cases::case_[0-9]+_json_content_message$/)'
  - id: case-sse-content-delta
    why: The sse-content-delta behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_response_cases::case_[0-9]+_sse_content_delta$/)'
  - id: case-sse-usage-event
    why: The sse-usage-event behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_response_cases::case_[0-9]+_sse_usage_event$/)'
  - id: case-plain-text-response
    why: The plain-text-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_response_cases::case_[0-9]+_plain_text_response$/)'
  - id: case-missing-usage
    why: The missing-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_response_cases::case_[0-9]+_missing_usage$/)'
  - id: case-malformed-event-fallback
    why: The malformed-event-fallback behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::agentcore_response_cases::case_[0-9]+_malformed_event_fallback$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_agentcore_response.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_agentcore_response*")"
      && grep -lq 'bedrock_services_agentcore_response' tools/oracle/fuzz/corpus/helper_case/bedrock_services_agentcore_response*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_agentcore_response$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_agentcore_response)"
      && grep -q 'decode_agentcore_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_agentcore_response.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_agentcore_response_corpus$/)'
