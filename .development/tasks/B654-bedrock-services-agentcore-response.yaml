id: B654
title: Bedrock AgentCore JSON and SSE replies
description: >-
  Add AgentCoreReply decoding for JSON, textual/SSE payloads, content delta/message shapes and usage. Preserve typed
  fallback interpretations, original raw provider metadata and source error mapping while bounding parsing work.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/agentcore/transformation.py:
  AmazonAgentCoreConfig._extract_sse_json L294-L309; AmazonAgentCoreConfig._extract_usage_from_event L311-L321;
  AmazonAgentCoreConfig._extract_content_delta L323-L334; AmazonAgentCoreConfig._extract_content_from_message L336-L345;
  AmazonAgentCoreConfig._calculate_usage L347-L380; AmazonAgentCoreConfig._parse_json_response L382-L453; AmazonAgentCoreConfig._get_parsed_response
  L455-L480; AmazonAgentCoreConfig._parse_sse_stream L482-L529; AmazonAgentCoreConfig.transform_response L986-L1051.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: json_content_message: JSON strategy order: if jsonrpc key exists (value irrelevant), use
  B2210 extract_text_from_a2a_response and return only if nonempty. Next dict result is authoritative: concatenate
  text from its content list and keep it as final_message, even if empty. Next list response concatenates text blocks.
  Then first string among result,response wins, including empty. No native OpenAI choices projection exists here;
  choices-only JSON goes to raw JSON fallback. sse_content_delta: Strip whole buffered text, split newline, strip
  each line. Only data: prefix with nonempty remainder is JSON-decoded; only dict JSON survives. Process event.contentBlockDelta.delta.text
  when truthy and concatenate in order. Empty or nondict event ignored; wrong nested shapes may fail. This buffered
  path accepts a final unterminated line, unlike B655 streaming. sse_usage_event: Read event.metadata.usage when
  metadata truthy and usage key exists; only truthy extracted usage replaces previous usage. Last truthy usage wins;
  empty/None does not clear it. Final Usage prompt_tokens=inputTokens default0,completion_tokens=outputTokens default0,total_tokens=totalTokens
  default0 independently; do not derive total. plain_text_response: Choose JSON only when lowercased content-type
  contains application/json, including parameters/case variants. Everything else, absent header and plain text use
  the SSE line parser. Bare plain text therefore produces empty content; do not return it verbatim or sniff JSON
  from the body. missing_usage: When usage absent/falsey, call B196 token_counter(model,messages), then token_counter(model,text=content,count_response_tokens=True),
  sum and set Usage. Any counter error warns Failed to calculate token usage: {error} and leaves preexisting model_response.usage
  unchanged. Counter success debug Calculated usage - prompt: {p}, completion: {c}, total: {t}. malformed_event_fallback:
  Malformed data JSON, including [DONE], debugs Skipping non-JSON line: {first100 characters} and is skipped; nondict
  valid JSON/empty lines silently skipped. No multiline SSE join, [DONE] termination or generic SSE parser. Strict
  application/json malformed body instead fails the whole transform. a2a_json_reply: Run B2210 direct parts, nested
  message, singular artifact,status message,first plural artifact and depth-limit cases through the jsonrpc branch.
  Empty A2A text falls through to normal dict-result extraction, not a second A2A implementation. json_raw_fallback:
  Nondict JSON warns AgentCore: JSON response is not a dict. Returning raw JSON as content. and emits json.dumps(value).
  Unrecognized dict warns AgentCore: Could not extract content from JSON response keys {keys}. Returning raw JSON
  as content. and emits the whole serialized dict. All JSON strategies set usage=None; a supplied usage field is
  ignored. Content extraction accepts only a list, joins dict blocks containing text without separators, ignores
  other blocks, and lets nonstring text join failures propagate. sse_final_message: Retain the last top-level message
  that is a dict, including {}. At end a truthy final_message supplies ALL content through content-list extraction,
  replacing deltas even when its content extracts empty; {} is falsey and permits delta fallback. It is not appended
  to deltas. agentcore_response_error: Mutate supplied response to one assistant choice,index0,finish_reason stop;
  model always supplied model. Keep unrelated response fields. Any outer error logs Error processing Bedrock AgentCore
  response: {error}, then B682 BedrockError message Error processing response: {error},status=raw status,headers=raw
  headers even200. There is no own HTTP-status check before parsing.


  Implement crates/betterlite-bedrock/src/agentcore_response.rs with adjacent tests under agentcore_response/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function agentcore_response_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): json_content_message, sse_content_delta, sse_usage_event, plain_text_response, missing_usage, malformed_event_fallback,
  a2a_json_reply, json_raw_fallback, sse_final_message, agentcore_response_error. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_agentcore_response* using HelperCase:
  kind: helper and the externally tagged bedrock_services_agentcore_response variant inside call. Do not put the
  Python stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_agentcore_response
  that parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on
  zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_agentcore_reply consumes AgentCore JSON/text response bytes in crates/betterlite-bedrock/src/agentcore_response.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_agentcore_response.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_agentcore_response.
  The adjacent test replays_the_bedrock_services_agentcore_response_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 228 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 295 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 750 planned, 750 maximum changed lines.
