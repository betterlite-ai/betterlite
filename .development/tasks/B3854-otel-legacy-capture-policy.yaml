id: B3854
title: Legacy OTel capture policy and span annotations
description: >-
  Build the small, shared rules that LiteLLM's legacy OpenTelemetry logger applies before and after it writes a span: the logger's settings record, the content-capture mode, the once-per-request emit guard, the span name and timestamp rules, the team, identity and service-tier attributes, the exception stamp, and the GenAI experimental-semconv attribute helpers.
  The lifecycle (B3859), the inference attributes (B3856), the metrics and events (B3857), the service hooks (B3858) and the provider assembly (B3868) all call these, so this task owns them and calls none of them back.
  Everything goes in the module `otel::legacy_policy` of betterlite-logging: `crates/betterlite-logging/src/otel/legacy_policy.rs` declares the submodules `config`, `capture`, `dedupe`, `span_time`, `annotations`, `error_recording` and `semconv_attrs`, each in `legacy_policy/<name>.rs` with its tests in `legacy_policy/<name>/tests.rs`. Nothing here can fail, so there is no error enum. Do not add a catch-all: LiteLLM's blanket `except Exception` around `_record_exception_on_span` only guards Python attribute errors that typed input cannot produce.

  Settings (`config`). `OpenTelemetryConfig` is a plain struct with LiteLLM's fields and defaults: `exporter` (enum `Console`, `InMemory` or `Named(String)`, default `Console`), `endpoint`, `headers`, `enable_metrics` (false), `enable_events` (false), `service_name`, `deployment_environment`, `model_id`, `ignore_context_propagation` (bool), `skip_set_global` (false), `capture_message_content: Option<String>`, `semconv_stability_opt_in: BTreeSet<OTELSemconvCategory>` (type from B3840, `crate::otel::vocabulary::semconv`), `baggage_team_metadata_keys: Vec<String>`, `baggage_metadata_keys: Vec<String>` and `attributes: Option<OtelModelValue>`. The last field keeps the raw `attributes` input untouched. B3857 owns the metric attribute filter type and parses this value, so this task must not name it.
  Functions read the environment only from a `&BTreeMap<String, String>` snapshot the caller passes in, never from `std::env`. `OpenTelemetryConfig::from_env(env)` follows LiteLLM: `exporter` is `OTEL_EXPORTER_OTLP_PROTOCOL`, then `OTEL_EXPORTER`, then "console"; `endpoint` is `OTEL_EXPORTER_OTLP_ENDPOINT`, then `OTEL_ENDPOINT`; `headers` is `OTEL_EXPORTER_OTLP_HEADERS`, then `OTEL_HEADERS`; `enable_metrics` and `enable_events` are true only when `LITELLM_OTEL_INTEGRATION_ENABLE_METRICS` and `LITELLM_OTEL_INTEGRATION_ENABLE_EVENTS` equal "true" after lowercasing; `service_name` is `OTEL_SERVICE_NAME` (default "litellm"), `deployment_environment` is `OTEL_ENVIRONMENT_NAME` (default "production"), `model_id` is `OTEL_MODEL_ID` (default the service name). When the exporter text is exactly "in_memory", it returns the `InMemory` exporter with every other field at its default and no endpoint or headers.
  `OpenTelemetryConfig::normalize(&mut self, env)` is LiteLLM's `__post_init__`: an endpoint with a `Console` exporter turns the exporter into `Named("otlp_http")`; an empty `service_name` becomes `OTEL_SERVICE_NAME` or "litellm"; an empty `deployment_environment` becomes `OTEL_ENVIRONMENT_NAME` or "production"; an empty `model_id` becomes `OTEL_MODEL_ID` or the service name; `ignore_context_propagation` is read from `OTEL_IGNORE_CONTEXT_PROPAGATION` when not set, where "true" and "false" (trimmed, any case) are the only recognized values and anything else, or unset, means false; the opt-in set is unioned with `parse_semconv_opt_in` of `OTEL_SEMCONV_STABILITY_OPT_IN` (B3840); `baggage_team_metadata_keys` falls back to `LITELLM_OTEL_BAGGAGE_TEAM_METADATA_KEYS` and `baggage_metadata_keys` to `LITELLM_OTEL_BAGGAGE_METADATA_KEYS` only when the field normalizes to an empty list. `normalize_metadata_keys` splits a comma-separated string, or takes a list, and returns the stripped, non-empty entries. These two functions are called from more than one place, so they are not single-use helpers.

  Capture mode (`capture`). The four modes are the enum `CaptureMode` (`NoContent`, `SpanOnly`, `EventOnly`, `SpanAndEvent`) with the exact LiteLLM names "NO_CONTENT", "SPAN_ONLY", "EVENT_ONLY" and "SPAN_AND_EVENT" in `as_str`. `CapturePolicy::from_init_state(config, env)` samples once: it takes `config.capture_message_content` if that is non-empty, else `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT`; empty or missing gives no explicit mode; uppercased "TRUE" or "1" gives `EventOnly`, "FALSE" or "0" gives `NoContent`, one of the four names gives that mode, and anything else gives no explicit mode. `CapturePolicy::resolve(&self, turn_off_message_logging: bool, message_logging: bool) -> CaptureMode` applies the order: the kill-switch forces `NoContent`; else the explicit mode; else `SpanAndEvent` when `message_logging` is true and `NoContent` when not. The caller passes the two flags in, so the kill-switch is read on every request while the explicit mode is fixed at init. `capture_in_span` is true for `SpanOnly` and `SpanAndEvent`, and `capture_in_event` for `EventOnly` and `SpanAndEvent`.

  Emit guard (`dedupe`). `emit_once` stops a sync and an async callback from writing the same span twice, and stops one guardrail entry from being written from two lifecycle points. `EmittedSpans` is the per-request record; the request context owns one and passes it as `&mut`. `emit_once(&mut self, handler: &HandlerIdentity, scope: &[ScopeValue]) -> bool` returns true the first time a (handler, scope) pair is seen and false after. `HandlerIdentity` is the logger's type name plus an instance number, so two logger instances (for example the default one and a Langfuse subclass) each emit their own span for one request. `ScopeValue` is a closed enum (`Null`, `Bool`, `Int`, `Float`, `Text`, `List`, `Set`, `Map`) and `freeze_scope` turns it into an orderable `FrozenScope`: lists keep their order, sets and maps do not, and nesting deeper than 16 levels collapses to the compact JSON text of the remaining value.

  Span names and times (`span_time`). `to_ns(time, now)` takes the enum `SpanTime` (`Missing`, `Seconds(f64)`, `DateTime(chrono::DateTime<chrono::Utc>)`) plus the caller's `now`, and returns `i64` nanoseconds: `Missing` uses `now`, and seconds or a datetime go through `f64` seconds times 1e9, truncated toward zero, exactly like `int(x * 1e9)`. `span_name(...)` returns the `generation_name` from `litellm_params.metadata` if it is non-empty; else, when the experimental semconv opt-in is on, "<operation> <model>" with the model defaulting to "unknown" when missing or empty; else "litellm_request".

  Annotations (`annotations`). All of these write through B3844's `SafeSetAttribute` on any `opentelemetry::trace::Span`.
  `set_team_attributes(span, team_id, team_alias)` writes "metadata.user_api_key_team_id" and "metadata.user_api_key_team_alias" and skips empty or missing values. `set_team_attributes_from_payload(span, payload)` reads both from the payload's `metadata` map, where the payload is `&BTreeMap<String, OtelModelValue>`.
  `set_inference_identity_attributes(span, payload, litellm_params, baggage_team_metadata_keys, baggage_metadata_keys)` writes, in this order and each only when non-empty: "http.route" from payload `metadata.user_api_key_request_route`; "litellm.team.metadata" from the allowlisted sub-keys of `user_api_key_team_metadata`, read from `litellm_params.metadata` when that map is non-empty and from `litellm_params.litellm_metadata` otherwise, serialized with B3841's `filtered_team_metadata_json`; every promoted key from B3841's `flatten_metadata` of the payload metadata and `promoted_metadata` for the configured `baggage_metadata_keys`; "litellm.model_group" from payload `model_group`; "litellm.provider.model" from payload `hidden_params.litellm_model_name`, else payload `model`. Reuse the key constants in `crate::otel::vocabulary::constants::attribute_keys` (`http::ROUTE`, `litellm::TEAM_METADATA`, `litellm::PROVIDER_MODEL`).
  `set_service_tier_attributes(span, payload)` writes "gen_ai.openai.request.service_tier" from B212's requested-tier rule and "gen_ai.openai.response.service_tier" from its served-tier rule, each only when present. Both keys carry every provider's tier, not only OpenAI's.

  Exception stamp (`error_recording`). `record_exception_on_span(span, exception, payload)` does what LiteLLM does in this order. A present exception becomes an "exception" span event with `exception.type`, `exception.message` and `exception.stacktrace` (the input is a `RecordedException { type_name, message, stacktrace }`). Then, with the payload's `error_information` map: if the payload has no `error_information` key (or it is null), it writes `error.message` from `error_str` when `error_str` is non-empty and stops; otherwise it writes, each only when non-empty, `error.code` (text), and `http.response.status_code` as an integer when the code parses as one (a code like "bad_request" only gets `error.code`), `error.type` from `error_class`, `error.message` from `error_message`, `error.llm_provider` from `llm_provider`, and `error.stack_trace` from `traceback`. B3840 has `error::TYPE` and `error::MESSAGE`; define `error.code`, `error.llm_provider` and `error.stack_trace` as constants in this module, because nobody else uses them yet.

  GenAI experimental attributes (`semconv_attrs`). `gen_ai_operation_name(call_type)` returns "embeddings" when the call type contains "embedding", else "text_completion" when it contains "text_completion", else "chat"; a missing call type is "chat". `set_semconv_request_attributes(span, optional_params)` writes `gen_ai.request.frequency_penalty`, `presence_penalty`, `top_k` and `seed` for every non-null value (so 0 is written), `gen_ai.request.stop_sequences` as a string array (a single stop value becomes a one-element array), `gen_ai.request.stream` = true only when `stream` is truthy, and `gen_ai.request.choice.count` only for an integer `n` greater than 1. The array is set straight on the span, not through `safe_set_attribute`, which would flatten it. `set_semconv_cache_token_attributes(span, payload)` writes `gen_ai.usage.cache_creation.input_tokens` and `gen_ai.usage.cache_read.input_tokens` from `metadata.usage_object` and skips zero, null and missing values. `semconv_latest_experimental(config)` is true when the opt-in set holds `GenAiLatestExperimental`.

  The inference-details event builder in the same Python file (`_build_inference_details_attrs`, `_emit_inference_details_event`, `_INFERENCE_DETAILS_EVENT_NAME`) belongs to B3857. The OTel logger is not routed by any proxy route yet, so every behavior is proven by helper cases through the oracle, not by HTTP cases; the umbrella that wires the logger adds HTTP cases.

