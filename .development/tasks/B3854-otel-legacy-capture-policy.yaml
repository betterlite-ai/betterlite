deviations:
  - what: "The emit-once record is a typed `EmittedSpans` value owned by the request context, not a hidden `_otel_internal.spans_logged` dict inside `litellm_params.metadata`."
    why: The dict travels with the request metadata, so other callbacks and the spend log can see it. A typed field keeps the dedupe state private and needs no replacement of non-dict `litellm_params` or `metadata` values.
  - what: "`OpenTelemetryConfig.attributes` is kept as the raw input value and not parsed here."
    why: B3857 owns the metric attribute filter and depends on this task, so this task cannot name its type.
  - what: Environment values come from a snapshot map the caller passes in, not from the process environment.
    why: Rule no-module-state; the single place that snapshots the environment stays outside the logging crate.
  - what: "A `datetime` in `SpanTime` is a UTC instant."
    why: LiteLLM's naive datetimes use the host's local timezone, which gave different nanoseconds on hosts with different TZ settings. Typed timestamps in betterlite are already instants.

out_of_scope:
  - "_provider_label, the metric attribute filter, _record_metrics and the semantic log events (B3857). The inference-details event builders in gen_ai_semconv.py L78 and L199-L248 are also B3857."
  - "OTELSemconvCategory and parse_semconv_opt_in (B3840); this task only calls them."
  - "safe_set_attribute and the primitive casting (B3844); cast_as_primitive_value_type has no caller at the pin."
  - "set_attributes and set_raw_request_attributes, which call the semconv attribute helpers (B3856)."
  - "_end_proxy_span_from_kwargs, _set_team_attributes_on_proxy_span_from_kwargs, _handle_success, _handle_failure and the guardrail spans (B3859); they call the functions built here."
  - "_get_span_context and get_traceparent_from_header (B3847)."
  - "OpenTelemetry.__init__, the provider caches, _init_tracing/_init_metrics/_init_logs and _init_otel_logger_on_litellm_proxy (B3868); the dynamic tracer cache and exporters (B3855); service and management hooks (B3858)."
  - "The service-tier rules themselves, get_served_service_tier and get_requested_service_tier (B212)."
  - "flatten_metadata, promoted_metadata and filtered_team_metadata_json (B3841); this task only calls them."

pitfalls:
  - '`capture_message_content` wins over the env var whenever it is non-empty, even when its text is not a valid mode; the invalid text then yields no explicit mode and the env var is not tried.'
  - '"true" and "1" map to EVENT_ONLY, not SPAN_AND_EVENT, so a user who sets `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true` gets no content on the span.'
  - "When no explicit mode exists, `message_logging` is read on every request, so the same logger flips between SPAN_AND_EVENT and NO_CONTENT with the flag; `turn_off_message_logging` beats both."
  - "`from_env` reads `OTEL_EXPORTER_OTLP_PROTOCOL` before `OTEL_EXPORTER`, so a value like http/protobuf becomes the exporter text unchanged; do not validate it here."
  - "The in_memory shortcut in `from_env` skips endpoint, headers and the two enable switches, but `normalize` still reads the service name, environment and baggage env vars."
  - "`baggage_team_metadata_keys` and `baggage_metadata_keys` fall back to their env vars only when the given list normalizes to empty, so an explicit list never merges with the env var."
  - "The emit guard key holds the handler's type name and instance, so a subclass logger and the base logger both emit for one request; only repeats from the same instance are dropped."
  - "`error_information` set to `{}` is not missing, so the `error_str` fallback runs only when the key is absent or null."
  - "`error.code` is written for any non-empty code, but `http.response.status_code` only when the code parses as an integer; a text code such as a provider error name gets the first only."
  - "In `set_inference_identity_attributes`, an empty `litellm_params.metadata` map falls through to `litellm_metadata`, while a non-empty one that lacks `user_api_key_team_metadata` does not."
  - "The team metadata attribute is dropped when the allowlist is empty or no allowlisted key is present, never written as `{}`."
  - "`gen_ai.request.stop_sequences` must be a string array, so a numeric stop value is stringified, and `n` equal to 1 or a boolean writes no choice count."
  - "Cache-token attributes skip a value of 0, while the sampling attributes (`seed`, `top_k`, penalties) are written for 0."
  - "`gen_ai_operation_name` checks `embedding` before `text_completion`, so a call type that contains both reports `embeddings`."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
