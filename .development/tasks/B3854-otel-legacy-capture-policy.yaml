dod:
  - text: OpenTelemetryConfig::from_env reads the exporter, endpoint, headers, metrics and events switches, service name, environment and model id from the env snapshot with LiteLLM's defaults, and "in_memory" returns the in-memory exporter with all other fields at default.
    proof: [config-tests, oracle, helper-python]
  - text: normalize turns a console exporter with an endpoint into otlp_http, fills empty service name, environment and model id from env, reads the ignore-context flag and the semconv opt-in, and falls back to the two baggage key env vars only when the field is empty.
    proof: [config-tests, oracle, helper-python]
  - text: normalize_metadata_keys accepts a comma-separated string or a list and returns stripped, non-empty keys.
    proof: [config-tests, oracle, helper-python]
  - text: Capture mode resolves from the config value before the env var, maps "true"/"1" to EVENT_ONLY and "false"/"0" to NO_CONTENT, accepts the four names in any case and ignores unknown text.
    proof: [capture-tests, oracle, helper-python]
  - text: resolve applies the kill-switch first, then the sampled mode, then the message_logging flag, and the span and event predicates match the four modes.
    proof: [capture-tests, oracle, helper-python]
  - text: emit_once returns true once and false afterwards for the same handler and scope, treats different handlers and different scopes as separate, ignores set and map order and keeps list order.
    proof: [dedupe-tests, oracle, helper-python]
  - text: Scope values nested deeper than 16 levels are frozen to JSON text instead of recursing.
    proof: [dedupe-tests]
  - text: to_ns uses now for a missing time and truncates seconds times 1e9 like int(x * 1e9); span_name prefers generation_name, then the semconv "<operation> <model>" form with "unknown", then "litellm_request".
    proof: [span-time-tests, oracle, helper-python]
  - text: Team attributes are written for non-empty id and alias only, from arguments and from the payload metadata.
    proof: [annotation-tests, oracle, helper-python]
  - text: Inference identity attributes come out in LiteLLM's order with the metadata/litellm_metadata first-non-empty rule, the team metadata allowlist, promoted metadata keys, model group and the hidden_params-then-model provider model.
    proof: [annotation-tests, oracle, helper-python]
  - text: Service-tier attributes write the requested and served tier independently and skip absent ones.
    proof: [annotation-tests, oracle, helper-python]
  - text: record_exception_on_span stamps the exception event, falls back to error_str only when error_information is missing, and writes error.code, an integer http.response.status_code only for numeric codes, error.type, error.message, error.llm_provider and error.stack_trace.
    proof: [error-recording-tests, oracle, helper-python]
  - text: gen_ai_operation_name maps embedding, text_completion and everything else; the request attributes write zero values, the stop array, stream only when true and choice count only for n above 1; cache-token attributes skip zero.
    proof: [semconv-attrs-tests, oracle, helper-python]
  - text: Newly added helper corpus cases replay through the shared helper-case parser independently of the native behavior tests.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: config-tests
      why: the settings record, env fallbacks or key normalization are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_policy::config::/)'
    - id: capture-tests
      why: capture mode sampling, resolve order or the span and event predicates are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_policy::capture::/)'
    - id: dedupe-tests
      why: the emit-once guard or scope freezing is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_policy::dedupe::/)'
    - id: span-time-tests
      why: nanosecond conversion or span naming is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_policy::span_time::/)'
    - id: annotation-tests
      why: team, identity or service-tier span attributes are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_policy::annotations::/)'
    - id: error-recording-tests
      why: the exception event or the error attributes are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_policy::error_recording::/)'
    - id: semconv-attrs-tests
      why: the GenAI experimental request, operation or cache-token attributes are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_policy::semconv_attrs::/)'
    - id: helper-python
      why: the LiteLLM-side helper and the betterlite helper disagree on a case
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3854::/)'
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/legacy-otel-policy/ "tools/oracle/fuzz/corpus/helper_case/legacy-otel-policy-*")" &&
        grep -rlE '^[[:space:]]+b3854:' tools/oracle/cases/helpers/legacy-otel-policy &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

