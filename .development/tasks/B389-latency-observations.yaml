references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L34-L368
  why: Implementation boundary verified against the pinned checkout.
dod:
- text: Write tests named latency_observations_behaviors and latency_observations_boundaries under latency_observations::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - latency-observations-behaviors
  - latency-observations-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/latency-observations-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/latency-observations-invalid.yaml;
    the valid seed contains ttl. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - latency-observations-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: latency-observations-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::latency_observations_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: latency-observations-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::latency_observations_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/latency_observations.py && test -n "$(git diff --name-only
      "$GATE_BASE" -- tools/oracle/litellm/probes/latency_observations.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm
      basedpyright tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/latency-observations-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/latency-observations-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/latency-observations-" && grep -Fq 'ttl' crates/betterlite-config/fuzz/corpus/config_yaml/latency-observations-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/latency-observations/stream-ttft-mean.yaml
- tools/oracle/cases/routing/latency-observations/ttft-percentile-boundary.yaml
- tools/oracle/cases/routing/latency-observations/failure-penalty.yaml
- tools/oracle/cases/routing/latency-observations/stale-window.yaml
deviations: []
out_of_scope:
- B315 owns final integration and the remaining functions listed in its implementation boundary.
- 'litellm/router_strategy/lowest_latency.py: B315 owns: LowestLatencyLoggingHandler._get_available_deployments
  (L370-L498), LowestLatencyLoggingHandler.async_get_available_deployments (L500-L523), LowestLatencyLoggingHandler.get_available_deployments
  (L525-L549).'
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
