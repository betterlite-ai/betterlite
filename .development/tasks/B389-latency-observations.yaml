id: B389
title: Latency and first-token observations
description: 'Implement LatencySamples and callback updates over B304 state, preserving response-duration
  normalization, completion-token normalization, bounded latency/TTFT windows and failure penalties. Store
  durations and normalized statistical samples; B315 owns ranking and tie selection. Configuration boundary
  keys introduced or consumed here: ttl, lowest_latency_buffer, max_latency_list_size, ttft_percentile.
  Pinned declaration defaults: ttl=1 * 60 * 60; lowest_latency_buffer=0; max_latency_list_size=10; ttft_percentile=None.
  Resolve env values once in betterlite-config, never in router code. Statistical arithmetic may use finite
  f64 only in latency_sample_math with one module-level #[expect(clippy::float_arithmetic, reason = "pinned
  statistical routing arithmetic")], counted in max_new_expects. Keep every price/spend/budget Decimal
  and compare selected model/tier exactly; diagnostic score tolerances cannot hide a selection difference.
  Implement the owned native service in crates/betterlite-router/src/latency_observations.rs. Add ProbeOperation::LatencyObservations
  in tools/oracle/src/router_probes/mod.rs and the corresponding B389 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/lowest_latency.py:
  _average_latency (L34-L37), _percentile_latency (L40-L43), _ttft_seconds (L46-L49), LowestLatencyLoggingHandler.__init__
  (L57-L59), LowestLatencyLoggingHandler.log_success_event (L61-L182), LowestLatencyLoggingHandler.async_log_failure_event
  (L184-L241), LowestLatencyLoggingHandler.async_log_success_event (L243-L368). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001
  only on its explicitly named score/probability pointer. Selection, tie order, counts, statuses, money
  and provider requests remain exact. Six-decimal wire signals are compared after the source rounding,
  without widening tolerance.'
scope:
  paths:
  - crates/betterlite-router/src/latency_observations.rs
  - crates/betterlite-router/src/latency_observations/**
  - crates/betterlite-router/src/lib.rs
  - crates/betterlite-router/src/error.rs
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/latency_observations.rs
  - crates/betterlite-server/src/routing/latency_observations/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/context.rs
  - tools/oracle/src/router_probes/latency_observations.rs
  - tools/oracle/src/router_probes/latency_observations/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/latency_observations.py
  - tools/oracle/cases/routing/latency-observations/**
  - crates/betterlite-config/src/lib.rs
  - crates/betterlite-config/src/loader.rs
  - crates/betterlite-config/src/raw.rs
  - crates/betterlite-config/tests/**
  - crates/betterlite-config/src/resolve.rs
  - crates/betterlite-config/src/types.rs
  - crates/betterlite-config/src/router.rs
  - crates/betterlite-config/src/latency_observations.rs
  - crates/betterlite-config/src/latency_observations/**
  - crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
  - crates/betterlite-config/fuzz/corpus/config_yaml/latency-observations-*
  - crates/betterlite-router/src/latency_sample_math.rs
  - crates/betterlite-router/src/latency_sample_math/**
