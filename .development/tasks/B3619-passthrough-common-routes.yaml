dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports. B8606 mounts the routes and proves them over HTTP with the oracle cases that were listed here.
    proof: [router-tests]
  - text: common_routes_router serves the eight paths for GET, POST, PUT, DELETE and PATCH, builds without an axum path conflict, and /openai_passthrough/v1/files reaches the pass-through, not a native route.
    proof: [router-tests]
  - text: is_url_streaming is true when "stream" is in the target URL text and false when it is only in the query or the body, and the Gemini and Cohere routes use it.
    proof: [target-tests]
  - text: Gemini takes the caller key from the query param key or x-goog-api-key, authenticates with "Bearer {key}", replaces the key param with the upstream key and keeps the other params, and answers 500 with the GEMINI_API_KEY message when no upstream key exists.
    proof: [gemini-tests]
  - text: Cohere, Mistral, TypeSafe and OpenRouter send the Bearer header (TypeSafe and OpenRouter add Content-Type application/json), use their env bases and defaults, and OpenRouter strips one trailing slash and one /v1 from its base.
    proof: [bearer-tests]
  - text: Anthropic merges the caller's headers without LiteLLM secrets with the proxy auth header (proxy wins), reads the base from ANTHROPIC_API_BASE then ANTHROPIC_BASE_URL, and answers 401 when neither side has a credential.
    proof: [anthropic-tests]
  - text: Cursor reads the key from get_credentials, then from the first cursor entry of the credential list (key and api_base), sends Basic base64 of "key:", and answers 401 with the Cursor message when no key exists.
    proof: [cursor-tests]
  - text: The /openai_passthrough alias calls the OpenAI handler with the same endpoint and returns its result unchanged.
    proof: [alias-tests]
checks:
  optional: []
  commands:
    - id: router-tests
      why: a path or method is missing from the router, two paths collide, or the alias loses to a native route
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_common_routes::tests::router(::|$)/)'
    - id: target-tests
      why: the streaming text test or the shared target build is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_common_routes::tests::target(::|$)/)'
    - id: gemini-tests
      why: the Gemini key lookup, auth string, query merge or missing-credential error is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_common_routes::tests::gemini(::|$)/)'
    - id: bearer-tests
      why: a Bearer header, a base default or the OpenRouter root is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_common_routes::tests::bearer(::|$)/)'
    - id: anthropic-tests
      why: the Anthropic base order, header merge or 401 is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_common_routes::tests::anthropic(::|$)/)'
    - id: cursor-tests
      why: the Cursor credential walk, Basic header or 401 is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_common_routes::tests::cursor(::|$)/)'
    - id: alias-tests
      why: the /openai_passthrough alias does not call the OpenAI handler or changes its result
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_common_routes::tests::alias(::|$)/)'
oracle_cases: []
deviations:
  - what: The TypeSafe and OpenRouter bases are read from the environment variable through betterlite-config, not through a key-management secret manager.
    why: LiteLLM's get_secret_str would ask a configured secret manager first. No secret-manager lookup has an owner for these two names yet (see notes); the environment value is what a default deployment sees.
  - what: The Cursor credential list is read from the loaded config through that registry, not from a Python module global.
    why: betterlite wires dependencies through constructors. The order of entries and the first-match rule are the same.
  - what: The Gemini missing-credential failure and the other internal errors use betterlite's common internal error response.
    why: LiteLLM raises a bare Exception and FastAPI's handler renders it. Status 500 and the message text are kept; the oracle case compares what a client sees.
out_of_scope:
  - "create_pass_through_route and the request lifecycle behind it: B3615 and B3613."
  - "provider_target_url, request_is_streaming, router relay helpers and the generic provider route: B3618."
  - "get_credentials and the credential record lookup: B3602."
  - "The caller-header filter, the Anthropic upstream-headers function and its 401 text: B3603."
  - "AnthropicModelInfo.get_auth_header and its helpers: B567."
  - "openai_proxy_route, BaseOpenAIPassThroughHandler and the OpenAI websocket routes: B3628."
  - "The Vertex, Bedrock, Fal, AssemblyAI, TinyFish, Azure, Milvus, VLLM, GigaChat and Watsonx routes: B3621, B3623, B3624, B3625, B3626 and B3627."
  - "base_passthrough_process_llm_request lives in common_request_processing.py, not in a file this task covers; B004 owns the file (see notes)."
pitfalls:
  - "Gemini runs its own auth call with the explicit string Bearer {key}, so a request with no key sends the text Bearer None to auth and must fail like a wrong key, not crash."
  - "Gemini's upstream query is the caller's params with only key replaced: a caller key in the query never reaches Google, and the other params (alt=sse and the like) do."
  - "The simple streaming test looks at the target URL string, which has no query, so ?alt=sse does not make a Gemini call streaming but a path like :streamGenerateContent does."
  - "Cohere and Mistral format a missing key into the header as the text Bearer None instead of failing; keep that, since the oracle compares upstream_headers."
  - "OpenRouter removes at most one trailing slash and then at most one /v1, so https://x/v1/ becomes https://x but https://x/v1// stays unchanged after the first step."
  - "Anthropic and Mistral pass no custom_llm_provider to the handler, while Gemini, TypeSafe, OpenRouter and Cursor do; logging relies on that difference."
  - "get_auth_header gets the key as None for an empty string and then reads ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN itself, so the env fallback happens even when get_credentials found nothing."
  - "The Cursor docstring lists the credential list before the env var, but get_credentials already reads CURSOR_API_KEY, so the env key wins over the credential list."
  - "The Cursor walk stops at the first cursor entry even when that entry has no api_key, and its api_base still replaces the base."
  - "Cursor's Basic value is base64 of the key followed by a colon, with no password part."
  - "axum may refuse /openai_passthrough/{*endpoint} next to a /{provider}/v1/files route; build both in one router test and fix the registration, never drop a path."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
