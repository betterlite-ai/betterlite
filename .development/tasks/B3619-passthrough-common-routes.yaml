id: B3619
title: Pass-through common provider HTTP routes
description: >-
  Build the seven small provider pass-through routes and the /openai_passthrough alias as the module passthrough_common_routes in crates/betterlite-server.
  They are Gemini, Cohere, Mistral, TypeSafe, OpenRouter, Anthropic and Cursor.
  Each route works out a target URL and the upstream credential headers, then hands the request to B3615's create_pass_through_route handler.
  This task builds the routers; B8606 mounts them and owns their HTTP oracle cases, so test the handlers here with tower oneshot over the router and fakes.
  Every name below is at most 30 characters.

  Registration. `common_routes_router(deps)` returns the axum router with these paths, each for GET, POST, PUT, DELETE and PATCH, where `endpoint` is the rest of the path after the prefix, without a leading slash: `/gemini/{endpoint}`, `/cohere/{endpoint}`, `/mistral/{endpoint}`, `/typesafe/{endpoint}`, `/openrouter/{endpoint}`, `/anthropic/{endpoint}`, `/cursor/{endpoint}` and `/openai_passthrough/{endpoint}`.
  `deps` is the same HandlerDeps value B3613 declares; B8606 merges the router into the app once. B8606 also owns the one GET handler of `/openai_passthrough/{endpoint}` that sends an upgrade request to B3628's WebSocket route, so expose `openai_alias_route` as a function and leave GET on that path out of this router. Expose the Gemini route as its own `gemini_router(deps)` and leave it out of common_routes_router: LiteLLM gives it no auth dependency, so B8606 mounts it outside the auth layers. No other path or alias exists for these routes at the pin.
  The composition of all provider pass-through routes is B8606's, so this module only exposes the one function.

  Shared steps. Every route except Gemini authenticates the caller through B052's key authentication, the same way the other proxy routes do. The target URL is B3618's `provider_target_url(base, endpoint)`: do not copy its path join. A base URL read from an environment variable counts as unset when the variable is empty, so the default applies (Python's `or`).
  The credential is B3602's `get_credentials(provider, None)`: a matching `use_in_pass_through` deployment first, then the `{PROVIDER}_API_KEY` environment variable. It returns an `Option`.
  The handler is B3615's create_pass_through_route with the endpoint, the target as a string, the custom headers or query params below and the streaming flag, called with the request, the response and the authenticated key. Its result is the route's result.
  The simple streaming flag (Gemini, Cohere) is `is_url_streaming(url)`: true when the text "stream" appears anywhere in the target URL string. The query is not part of that string, but the base URL's host, path and query are. Mistral and Anthropic use B3618's `request_is_streaming(request)` instead. TypeSafe, OpenRouter and Cursor never stream (false, or the factory default of false).

  Gemini (`gemini_route`). Base: env `GEMINI_API_BASE`, default `https://generativelanguage.googleapis.com`. This route has no auth dependency. It reads the caller's key from the query param `key`, else the header `x-goog-api-key` (a non-empty query value wins), and authenticates with the string `Bearer {key}` as the explicit api key through B052. When neither is present the string is literally `Bearer None` and authentication fails the way it does for a wrong key. The upstream key is `get_credentials("gemini", None)`. When it is None the route fails with an internal error (HTTP 500) whose message is "Required 'GEMINI_API_KEY'/'GOOGLE_API_KEY' in environment to make pass-through calls to Google AI Studio." The query params sent upstream are `gemini_query_params(request_params, key)`: the request's query params as a map (the last value wins for a repeated name) with `key` set to the upstream key, replacing the caller's. The handler gets custom_llm_provider "gemini", those query params, no custom headers, and is_url_streaming.

  Cohere (`cohere_route`). Base: env `COHERE_API_BASE`, default `https://api.cohere.com`. Credential `get_credentials("cohere", None)`. Header `Authorization: Bearer {key}`. When the key is None the header value is the text `Bearer None` (LiteLLM formats the None). No custom_llm_provider. is_url_streaming.

  Mistral (`mistral_route`). Base: env `MISTRAL_API_BASE`, default `https://api.mistral.ai`. Credential `get_credentials("mistral", None)`, header `Authorization: Bearer {key}` with the same `Bearer None` text. No custom_llm_provider. Streaming from request_is_streaming, which reads the body of a POST (JSON, or a form for multipart) and is true only for `stream: true`.

  TypeSafe (`typesafe_route`). Base: the setting `TYPESAFE_API_BASE`, default `https://api.typesafe.ai`. Credential `get_credentials("typesafe", None)`. Headers `Authorization: Bearer {key}` and `Content-Type: application/json`. custom_llm_provider "typesafe". Not streaming.

  OpenRouter (`openrouter_route`). Base: the setting `OPENROUTER_API_BASE`, default `https://openrouter.ai/api/v1`. `openrouter_api_root(base)` removes one trailing "/" and then one trailing "/v1" from it, in that order, and the result is the base given to provider_target_url. So the default gives `https://openrouter.ai/api` and a request to `/openrouter/v1/chat/completions` reaches `https://openrouter.ai/api/v1/chat/completions`. Credential `get_credentials("openrouter", None)`. Headers `Authorization: Bearer {key}` and `Content-Type: application/json`. custom_llm_provider "openrouter". Not streaming.

  Anthropic (`anthropic_route`). Base: env `ANTHROPIC_API_BASE`, else env `ANTHROPIC_BASE_URL`, else `https://api.anthropic.com`. Credential `get_credentials("anthropic", None)`; an empty string counts as None. The proxy's auth header is B567's get_auth_header with that key and no api_base: an OAuth-style key gives `authorization: Bearer {key}`, a normal key gives `x-api-key: {key}`, and with no key it falls back to `ANTHROPIC_API_KEY` and then `ANTHROPIC_AUTH_TOKEN`, or gives None. The custom headers are B3603's anthropic upstream-headers function (it replaces _upstream_headers_for_anthropic_route): the caller's headers minus LiteLLM secrets, then the proxy auth header on top, and HTTP 401 when there is no proxy header and the caller sent neither `authorization` nor `x-api-key`. No custom_llm_provider. Streaming from request_is_streaming.

  Cursor (`cursor_route`). Base: env `CURSOR_API_BASE`, default `https://api.cursor.com`. The key is `get_credentials("cursor", None)`. When it is None, walk the credential list (B1601's loaded `credential_list`, the registry B1601 builds) in order and stop at the FIRST entry whose credential_info `custom_llm_provider` is "cursor": its credential_values `api_key` becomes the key (possibly still None) and a non-empty credential_values `api_base` replaces the base. When the key is still None, answer HTTP 401 with detail "Cursor API key not found. Add Cursor credentials via the UI (Models + Endpoints → LLM Credentials) or set CURSOR_API_KEY environment variable." (the arrow is LiteLLM's own character in this one message; keep it byte for byte). `cursor_basic_auth(key)` is `Basic ` plus standard base64 of `{key}:` (key, then a colon, nothing after it). Header `Authorization`. custom_llm_provider "cursor". Not streaming.

  OpenAI alias (`openai_alias_route`). `/openai_passthrough/{endpoint}` accepts GET, POST, PUT, DELETE and PATCH, authenticates through B052, and calls the OpenAI pass-through handler that B3628 builds for `/openai/{endpoint}` with the same endpoint, request, response and key, returning its result unchanged. It adds no logic. It exists so that /openai_passthrough/v1/responses reaches OpenAI and not the native Responses API. Name of that handler: read it from B3628's task file; if B3628 names none, report a blocker.
