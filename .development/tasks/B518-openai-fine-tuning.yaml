- text: decode_fine_tune_job has newly committed malformed and boundary inputs replayed through production parsing.
  proof:
  - parser-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-create-method-hyperparameters
    why: The create-method-hyperparameters behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_create_method_hyperparameters$/)'
  - id: case-list-pagination
    why: The list-pagination behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_list_pagination$/)'
  - id: case-retrieve-checkpoint-fields
    why: The retrieve-checkpoint-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_retrieve_checkpoint_fields$/)'
  - id: case-cancel-job
    why: The cancel-job behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_cancel_job$/)'
  - id: case-azure-null-organization-files
    why: The azure-null-organization-files behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_azure_null_organization_files$/)'
  - id: case-azure-status-map
    why: The azure-status-map behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::fine_tuning_cases::case_[0-9]+_azure_status_map$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_fine_tuning.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_fine_tuning*")"
      && grep -lq 'openai_fine_tuning' tools/oracle/fuzz/corpus/helper_case/openai_fine_tuning* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_fine_tuning$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_fine_tuning)"
      && grep -q 'decode_fine_tune_job' crates/betterlite-openai/fuzz/fuzz_targets/openai_fine_tuning.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_fine_tuning_corpus$/)'
