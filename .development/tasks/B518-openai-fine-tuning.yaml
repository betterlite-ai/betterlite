id: B518
title: OpenAI fine-tuning jobs
description: >-
  Add FineTuneCreate/FineTuneJob and create/list/retrieve/cancel provider methods. Include the shared Azure normalization
  projection so Azure can reuse it without importing its provider crate. Preserve nested method/hyperparameters
  and typed provider extension fields.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/fine_tuning/handler.py:
  _normalize_fine_tuning_job_dict L24-L48; _litellm_fine_tuning_job_from_response L51-L52; OpenAIFineTuningAPI.__init__
  L60-L61; OpenAIFineTuningAPI.get_openai_client L63-L93; OpenAIFineTuningAPI.acreate_fine_tuning_job L95-L102;
  OpenAIFineTuningAPI.create_fine_tuning_job L104-L142; OpenAIFineTuningAPI.acancel_fine_tuning_job L144-L150; OpenAIFineTuningAPI.cancel_fine_tuning_job
  L152-L190; OpenAIFineTuningAPI.alist_fine_tuning_jobs L192-L199; OpenAIFineTuningAPI.list_fine_tuning_jobs L201-L241;
  OpenAIFineTuningAPI.aretrieve_fine_tuning_job L243-L249; OpenAIFineTuningAPI.retrieve_fine_tuning_job L251-L289.


  Implement crates/betterlite-openai/src/fine_tuning.rs with adjacent tests under fine_tuning/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation openai_fine_tuning in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function fine_tuning_cases in betterlite-openai with these exact named cases (one per oracle file):
  create_method_hyperparameters, list_pagination, retrieve_checkpoint_fields, cancel_job, azure_null_organization_files,
  azure_status_map. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_fine_tuning* using HelperCase: kind: helper
  and the externally tagged openai_fine_tuning variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_fine_tuning that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_fine_tune_job consumes fine-tuning JSON response bytes in crates/betterlite-openai/src/fine_tuning.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_fine_tuning.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_fine_tuning.
  The adjacent test replays_the_openai_fine_tuning_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 236 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 518 planned, 525 maximum changed lines.
scope:
  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/lib.rs
  - crates/betterlite-openai/src/error.rs
  - crates/betterlite-openai/src/fine_tuning.rs
  - crates/betterlite-openai/src/fine_tuning/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/openai_fine_tuning.rs
  - tools/oracle/src/helpers/openai_fine_tuning/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/openai_fine_tuning.py
  - tools/oracle/cases/helpers/providers/openai-fine-tuning/**
  - tools/oracle/fuzz/corpus/helper_case/openai_fine_tuning*
  - crates/betterlite-openai/fuzz/Cargo.toml
  - crates/betterlite-openai/fuzz/fuzz_targets/openai_fine_tuning.rs
  - crates/betterlite-openai/fuzz/corpus/openai_fine_tuning/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/fine_tuning/handler.py#L24-L289
  why: >-
    Own _normalize_fine_tuning_job_dict, _litellm_fine_tuning_job_from_response, OpenAIFineTuningAPI.__init__, OpenAIFineTuningAPI.get_openai_client,
    OpenAIFineTuningAPI.acreate_fine_tuning_job, OpenAIFineTuningAPI.create_fine_tuning_job, OpenAIFineTuningAPI.acancel_fine_tuning_job,
    OpenAIFineTuningAPI.cancel_fine_tuning_job, OpenAIFineTuningAPI.alist_fine_tuning_jobs, OpenAIFineTuningAPI.list_fine_tuning_jobs,
    OpenAIFineTuningAPI.aretrieve_fine_tuning_job, OpenAIFineTuningAPI.retrieve_fine_tuning_job. Other functions
    in this file remain with the owners listed below.
dod:
- text: >-
    create method hyperparameters: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-fine-tuning/create-method-hyperparameters.yaml.
  proof:
  - case-create-method-hyperparameters
  - oracle
  - helper-python
- text: 'list pagination: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-fine-tuning/list-pagination.yaml.'
  proof:
  - case-list-pagination
  - oracle
  - helper-python
- text: >-
    retrieve checkpoint fields: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-fine-tuning/retrieve-checkpoint-fields.yaml.
  proof:
  - case-retrieve-checkpoint-fields
  - oracle
  - helper-python
- text: 'cancel job: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-fine-tuning/cancel-job.yaml.'
  proof:
  - case-cancel-job
  - oracle
  - helper-python
- text: >-
    azure null organization files: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-fine-tuning/azure-null-organization-files.yaml.
  proof:
  - case-azure-null-organization-files
  - oracle
  - helper-python
- text: 'azure status map: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-fine-tuning/azure-status-map.yaml.'
  proof:
