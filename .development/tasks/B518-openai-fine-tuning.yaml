out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as openai_fine_tuning in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/fine_tuning.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_fine_tuning.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Azure canceling is mapped to terminal cancelled, even though the upstream job may still be cancelling.
- List returns the SDK page without per-job Azure normalization; do not apply the single-job normalizer to its entries.
