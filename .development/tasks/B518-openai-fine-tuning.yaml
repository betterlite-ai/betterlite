id: B518
title: OpenAI fine-tuning jobs
description: >-
  Add FineTuneCreate/FineTuneJob and create/list/retrieve/cancel provider methods. Include the shared Azure normalization
  projection so Azure can reuse it without importing its provider crate. Preserve nested method/hyperparameters
  and typed provider extension fields.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/fine_tuning/handler.py:
  _normalize_fine_tuning_job_dict L24-L48; _litellm_fine_tuning_job_from_response L51-L52; OpenAIFineTuningAPI.__init__
  L60-L61; OpenAIFineTuningAPI.get_openai_client L63-L93; OpenAIFineTuningAPI.acreate_fine_tuning_job L95-L102;
  OpenAIFineTuningAPI.create_fine_tuning_job L104-L142; OpenAIFineTuningAPI.acancel_fine_tuning_job L144-L150; OpenAIFineTuningAPI.cancel_fine_tuning_job
  L152-L190; OpenAIFineTuningAPI.alist_fine_tuning_jobs L192-L199; OpenAIFineTuningAPI.list_fine_tuning_jobs L201-L241;
  OpenAIFineTuningAPI.aretrieve_fine_tuning_job L243-L249; OpenAIFineTuningAPI.retrieve_fine_tuning_job L251-L289.


  Named case contracts: list_pagination: List forwards after=None and limit=None explicitly and returns the SDK
  page unchanged; individual create/retrieve/cancel responses use the shared normalizer and LiteLLMFineTuningJob
  projection. azure_null_organization_files: With is_azure=True copy the input and replace missing/null organization_id
  with empty string and result_files with []; preserve non-null values. With False return the unmodified record;
  merely supplying an Azure SDK client to this OpenAI wrapper does not enable normalization. azure_status_map: Map
  pending and notRunning to queued, canceled and canceling to cancelled; running/succeeded/failed keep their spelling
  and unknown values are preserved. sdk_client_argument_projection: Construct the SDK client only when client is
  None: api_base becomes base_url; omit None-valued api_key, timeout, max_retries and organization, but retain empty
  strings/zero. A supplied client wins without rebuilding it. Async selection requires the boolean True. sdk_client_missing:
  A fixture returning no client raises ValueError: OpenAI client is not initialized. Make sure api_key is passed
  or OPENAI_API_KEY is set in the environment. sdk_client_wrong_async: Selecting async with a non-AsyncOpenAI client
  raises ValueError: OpenAI client is not an instance of AsyncOpenAI. Make sure you passed an AsyncOpenAI client.
  sdk_error_passthrough: SDK exceptions retain their status, type, param, code and message; these lifecycle wrappers
  do not catch or normalize them. fine_tune_extra_client_args: Non-None api_version and litellm_params are included
  by get_openai_client when constructing the SDK client, with no special OpenAI filtering; preserve constructor
  failures. Async create/list/cancel accept AsyncAzureOpenAI as well as AsyncOpenAI; retrieve uses the AsyncOpenAI
  superclass check.


  Write standalone Rust test openai_fine_tuning_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_fine_tuning_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-openai/src/fine_tuning.rs with adjacent tests under fine_tuning/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation openai_fine_tuning in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function fine_tuning_cases in betterlite-openai with these exact named cases (one per oracle file):
  create_method_hyperparameters, list_pagination, retrieve_checkpoint_fields, cancel_job, azure_null_organization_files,
  azure_status_map, sdk_client_argument_projection, sdk_client_missing, sdk_client_wrong_async, sdk_error_passthrough,
  fine_tune_extra_client_args. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_fine_tuning* using HelperCase: kind: helper
  and the externally tagged openai_fine_tuning variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_openai_fine_tuning that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_fine_tune_job consumes fine-tuning JSON response bytes in crates/betterlite-openai/src/fine_tuning.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_fine_tuning.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_fine_tuning.
  The adjacent test replays_the_openai_fine_tuning_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 236 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 230 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 685 planned, 700 maximum changed lines.
