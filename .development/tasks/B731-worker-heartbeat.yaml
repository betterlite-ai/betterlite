id: B731
title: Database worker heartbeats and lifecycle
description: >-
  Implement WorkerHeartbeat with injected process instance ID and clock, same heartbeat table/TTL and
  deregistration on shutdown; emit structured migration/database logs through tracing. DynamoDBWrapper
  and set_env_vars_based_on_arn have no call sites in the MIT package at the pin and the module declares
  Postgres-only support: do not port these dead helpers; report the dynamodb database setting unsupported
  at startup. No DynamoDB fallback may bypass the Postgres schema decision. Native-only deviation tests
  (not oracle equality cases): dynamodb-startup-error.


  Build the production worker_heartbeat module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/proxy_worker_heartbeat.py:
  ProxyWorkerHeartbeat.__init__ (L61-L64; 4 source lines), ProxyWorkerHeartbeat.beat (L66-L71; 6 source
  lines), ProxyWorkerHeartbeat.deregister (L73-L77; 5 source lines), count_live_proxy_workers (L80-L93;
  14 source lines). litellm-proxy-extras/litellm_proxy_extras/_logging.py: JsonFormatter.formatTime (L8-L10;
  3 source lines), JsonFormatter.format (L12-L20; 9 source lines), _is_json_enabled (L23-L29; 6 source
  lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): JSON_LOGS='false'.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::worker_heartbeat::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 47 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  65 production, 148 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 293 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
