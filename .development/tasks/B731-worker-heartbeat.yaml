dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: heartbeat_upsert, expired_worker_excluded,
      deregister_idempotent, heartbeat_failure_diagnostic, postgres_pinned_rows, postgres_failure_effects.'
    proof:
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^worker_heartbeat::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/worker_heartbeat::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/worker_heartbeat::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^worker_heartbeat::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/worker-heartbeat-*")"
        && grep -rlq "JSON_LOGS" crates/betterlite-config/fuzz/corpus/config_yaml/worker-heartbeat-* &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
  - 'dynamo_db.py: DynamoDBWrapper.__init__ and set_env_vars_based_on_arn are dead compatibility helpers
    with no MIT-package call sites at this pin; Postgres-only support is declared at module start.'
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - 'litellm/proxy/db/dynamo_db.py::DynamoDBWrapper.__init__: no production caller at the pin; deprecated
    DynamoDBWrapper is the unused CustomDB subclass.'
  - 'litellm/proxy/db/dynamo_db.py::DynamoDBWrapper.set_env_vars_based_on_arn: no production caller at
    the pin; deprecated DynamoDBWrapper is the unused CustomDB subclass.'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Worker deregistration is joined during shutdown even if the last heartbeat failed.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: security
