dod:
  - text: Every constant, prefix, TTL, bound and claim key prefix matches LiteLLM, and supported_grant_types lists the token-exchange grant only when the flag is true.
    proof: [contracts-tests]
  - text: The refusing defaults return unresolvable, unsupported_grant_type with the fixed description, unavailable and false.
    proof: [contracts-tests]
  - text: OauthError renders the snake_case code and error_description body and carries the no-cache headers; every code the three tasks use is present.
    proof: [error-tests]
  - text: A sealed client_id opens to the same redirect URIs; a tampered, truncated, wrong-prefix or non-string value opens to None without an error.
    proof: [sealed-tests, oracle]
  - text: A sealed auth code or connect flow presented as a client_id opens to None, and a record with an extra field, an empty required string, zero or more than four redirect URIs is refused (cross-type confusion).
    proof: [sealed-tests, oracle]
  - text: Unset optional fields are absent from the sealed JSON, and a blob without them opens with those fields None.
    proof: [sealed-tests]
  - text: The decoder for client_id text never panics on arbitrary input, and its added corpus replays.
    proof: [sealed-corpus]
  - text: Registration rejects a missing, non-array, empty or over-four redirect_uris, a non-string item and an item over 256 characters, each with its own 400 and description.
    proof: [registration-tests, oracle]
  - text: Registration accepts https, loopback http and an allowlisted native callback, and rejects plain http on a non-loopback host, fragments, userinfo and backslash hosts, with the shape validator's detail text.
    proof: [registration-tests, oracle]
  - text: A successful registration answers 201 with the public-client body, the redirect URIs as sent and no cache headers, and registers as "none" whatever auth method the request asked for.
    proof: [registration-tests, oracle]
  - text: A registration whose sealed client_id would exceed 2048 characters answers 400 invalid_client_metadata.
    proof: [registration-tests]
  - text: The first claim of a key is first and every later claim is replayed, on the local store and on a shared backend.
    proof: [single-use-tests, oracle]
  - text: A shared backend error makes claim and peek answer unavailable and never reaches the local store, even when the local store already holds the key.
    proof: [single-use-tests, oracle]
  - text: The local store keeps the original expiry across increments, restarts the count after expiry, and peek reads without incrementing.
    proof: [single-use-tests]
  - text: claim_refusal passes first, returns the given replayed error for replayed and 503 temporarily_unavailable for unavailable.
    proof: [single-use-tests]
checks:
  optional: [mutants]
  commands:
    - id: contracts-tests
      why: The constants, port defaults or grant list tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_dcr::contracts::tests::/)'
    - id: error-tests
      why: The OAuth error body or header tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_dcr::oauth_error::tests::/)'
    - id: sealed-tests
      why: The sealed value, cross-type confusion or total-open tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_dcr::sealed::tests::/) - test(/replays_the_/)'
    - id: sealed-corpus
      why: The gateway_dcr_open_sealed fuzz target, its added corpus or its replay test is missing or fails.
      run: test -f crates/betterlite-mcp/fuzz/fuzz_targets/gateway_dcr_open_sealed.rs && grep -q gateway_dcr_open_sealed crates/betterlite-mcp/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/gateway_dcr_open_sealed)" && cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(replays_the_gateway_dcr_open_sealed_corpus)'
    - id: registration-tests
      why: The registration validation or response tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_dcr::registration::tests::/)'
    - id: single-use-tests
      why: The claim guard, memory store or claim refusal tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^gateway_dcr::single_use::tests::/)'
    - id: helper-python
      why: The helper adapter is missing or fails strict Python checks.
      run: test -f tools/oracle/helpers/b4674.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4674 operation reaches the shared helper case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-gateway-dcr-*')" && grep -rlq b4674 tools/oracle/fuzz/corpus/helper_case/mcp-gateway-dcr-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
