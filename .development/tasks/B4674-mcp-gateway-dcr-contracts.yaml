id: B4674
title: "MCP gateway DCR contracts, registration and replay guards"
description: >-
  Build the foundation of the MCP gateway's own OAuth front door (LiteLLM's gateway_dcr_flow.py) in crates/betterlite-mcp, module gateway_dcr. This task owns the shared constants, the wire models, the injected-port traits, the sealed-value helpers, POST /register as a pure function, and the single-use claim guard. B4675 (authorize, connect flow, consent) and B4676 (token grants, revocation, introspection) call everything here, so every name below is public inside the crate. Nothing in this task touches HTTP, a cookie or a clock: callers pass the parsed JSON body, the current time and the cipher in.


  Submodules, each with a tests.rs beside it. The test modules are named in the checks.


  contracts. Constants, exactly as LiteLLM spells them: GATEWAY_DCR_CLIENT_ID_PREFIX "llm_dcrc_", GATEWAY_AUTH_CODE_PREFIX "llm_gcode_", CONNECT_FLOW_COOKIE_PREFIX "mcp_connect_flow_", CONNECT_FLOW_TTL_SECONDS 600, GATEWAY_AUTH_CODE_TTL_SECONDS 120, MANUAL_DELIVERY_AUTH_CODE_TTL_SECONDS 300, CLAIM_TTL_BUFFER_SECONDS 60, the three claim key prefixes "mcp_gateway_dcr_code_used:", "mcp_gateway_dcr_flow_used:" and "mcp_gateway_dcr_refresh_used:", MAX_REDIRECT_URIS 4, MAX_REDIRECT_URI_LENGTH 256, MAX_CLIENT_ID_LENGTH 2048, MAX_STATE_LENGTH 1024, MIN_CODE_VERIFIER_LENGTH 43, MAX_CODE_VERIFIER_LENGTH 128, the three debug keys "gateway_dcr_client", "gateway_connect_flow" and "gateway_authorization_code", the two database-failure descriptions (DB_UNAVAILABLE_DESCRIPTION "the gateway database is unavailable; retry", and DB_FAULTED_DESCRIPTION, copied word for word from LiteLLM), and PROXY_API_AUDIENCE, which is SessionAudience::ProxyApi from B4652's types.rs. TOKEN_EXCHANGE_GRANT_TYPE is "urn:ietf:params:oauth:grant-type:token-exchange". ACCESS_TOKEN_TOKEN_TYPE is "urn:ietf:params:oauth:token-type:access_token" and SUBJECT_TOKEN_TYPES is that plus the jwt and id_token types of the same family. supported_grant_types(token_exchange_available) returns ["authorization_code", "refresh_token"] and appends the token-exchange grant only when the flag is true.


  Models, all serde with deny_unknown_fields so a sealed value of another type can never open as this one. GatewayDcrClient { redirect_uris: Vec<String> (1 to 4 items, checked on open), iat: i64 }. ConnectFlow { user_id, client_id, redirect_uri, state (may be empty), code_challenge, jti (all non-empty except state), exp: i64, resource_server_id: Option<String>, audience: Option<SessionAudience> }. GatewayAuthCode { user_id, client_id, redirect_uri, code_challenge, jti (non-empty), iat, exp, resource_server_id, audience, team_id (the three optional) }. Optional fields serialize only when set (skip_serializing_if), because LiteLLM seals with exclude_none and an older replica must still open a blob from a newer one. Opening checks the non-empty and 1-to-4 rules and fails like any other bad input. is_gateway_dcr_client_id(Option<&str>) is a prefix test.


  Port types for the callers, with no behavior beyond a refusing default. ReloadUserFailure is the enum unresolvable, unavailable, faulted, no_active_key. ReloadUser is a trait with one async method taking a user id and returning Option<ReloadUserFailure>. VendorCredentialState is present, absent, unavailable. MintedProxyCredential { key, expires_in (greater than 0), user_id, team_id } and ProxyCredentialMintFailure (ReloadUserFailure plus not_a_member and team_required) with the trait MintProxyCredential taking (user_id, team_id). SubjectIdentity { user_id, team_id }, SubjectTokenRefusal { error: unsupported_grant_type | invalid_request | temporarily_unavailable, description } and the trait ExchangeSubjectToken taking the subject token text and a caller-chosen request context type. ConsentTeam { team_id, team_alias }, and the traits LookupVendorCredential, LookupServerReachability and LookupConsentTeams with LiteLLM's argument lists. Four refusing defaults exist because LiteLLM uses them as default arguments: RefuseProxyCredential returns unresolvable, RefuseSubjectToken returns unsupported_grant_type with the description "this gateway is not configured to exchange IdP tokens", UnavailableVendorCredential returns unavailable, UnreachableServer returns false. Use native async fn in traits and generic parameters at the call sites, not boxed dyn objects.


  oauth_error. OauthError { status: u16, error: OauthErrorCode, description: String } for RFC 6749 section 5.2 and RFC 7591 section 3.2.2 bodies. OauthErrorCode lists every code the three tasks use: invalid_request, invalid_client, invalid_grant, invalid_target, invalid_redirect_uri, invalid_client_metadata, unsupported_response_type, unsupported_grant_type, access_denied, login_required, temporarily_unavailable, server_error, each rendering as its snake_case text. body() gives {"error": ..., "error_description": ...}. headers() gives B4654's TOKEN_NO_CACHE_HEADERS, which every error response carries. Descriptions never contain token, code or URL material.


  sealed. seal(prefix, payload) serializes with the optional fields omitted, encrypts with B1600's StoredCipher::encrypt_value and returns prefix plus the ciphertext. open_sealed(value, prefix, cipher, debug_key) is total: no prefix match, a failed decrypt (DecryptPolicy with log Error and value Nothing, the same as decrypt_value_helper(..., return_original_value=False)) or a JSON or model failure all return None, never an error. A prefix of "" means unprefixed (the connect-flow cookie). open_gateway_dcr_client(client_id, cipher) opens with GATEWAY_DCR_CLIENT_ID_PREFIX and the client debug key. seal returns a typed error when the cipher refuses (for example no salt key); LiteLLM would raise there, so the route answers 500.


  registration. register_aggregate_client(body, token_exchange_available, now, cipher) returns Registered(response) or Refused(OauthError). body is the already parsed JSON object. Only redirect_uris matters; every other key is ignored and every client is registered as a public client with token_endpoint_auth_method "none". Steps in order. (1) redirect_uris must be a JSON array with 1 to 4 items, else 400 invalid_redirect_uri "redirect_uris must be a list of 1 to 4 URIs". (2) every item must be a string of at most 256 characters (count Unicode code points, as Python len does), else 400 invalid_redirect_uri "each redirect URI must be a string of at most 256 characters". (3) each URI, in order, is parsed with B4654's python_url urlparse equivalent and passed to B4655's validate_redirect_uri_shape: true means an allowlisted native callback (cursor://) and the URI is accepted; an error becomes 400 invalid_redirect_uri with the validator's detail text; false falls through to the next rule; the rule is https, or http on a loopback host (B4655's is_loopback_redirect_host), else 400 invalid_redirect_uri "each redirect URI must be https, http on a loopback host, or a registered native callback". (4) seal GatewayDcrClient { redirect_uris, iat: now seconds }; a client_id longer than 2048 characters gives 400 invalid_client_metadata "registered metadata is too large". Success is status 201 with client_id, client_id_issued_at (now seconds), redirect_uris (the strings as sent), token_endpoint_auth_method "none", grant_types from supported_grant_types and response_types ["code"]. The success response carries no cache headers, unlike errors. Nothing is stored.


  single_use. The replay guard. ClaimOutcome is first, replayed, unavailable. PeekOutcome is unclaimed, claimed, unavailable. ClaimAuthority is an enum of two cases that B8623 picks, not the guard: Shared(S) where S is a trait ClaimBackend with async increment(key, ttl_seconds) returning Result<u64, ClaimBackendError> and async read(key) returning Result<Option<u64>, ClaimBackendError>, and Local(L) where L is an in-process MemoryClaimStore. SingleUseGuard<S> is built with a ClaimAuthority. claim(key, ttl_seconds): with a Shared authority, call only the shared backend; count 1 is first, anything else is replayed, and any backend error is unavailable with a warning logged ("mcp gateway single-use claim: shared cache backend unavailable, failing closed"). It never falls back to the local store. With a Local authority, the in-memory increment decides the same way. peek(key) is the read-only twin: shared read, None is unclaimed, a value is claimed, an error is unavailable; local read the same way. claim_refusal(outcome, replayed_error) returns None for first, the given replayed error for replayed, and 503 temporarily_unavailable "the single-use record is unavailable right now; try again shortly" (CLAIM_UNAVAILABLE_DESCRIPTION) for unavailable. MemoryClaimStore keeps (count, expiry) per key with an injected clock: increment on a missing or expired key starts at 1 and sets the expiry to now plus the ttl; increment on a live key adds 1 and keeps the original expiry, so a replay never extends the window. read returns None for a missing or expired key. The Redis-backed ClaimBackend implementation and the choice between Shared and Local (LiteLLM prefers redis_usage_cache, then the cache's redis_cache) belong to the wave 17 part B8623, not to this task.
