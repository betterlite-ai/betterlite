deviations:
  - what: A redirect URI that Python's urlparse cannot parse (an unmatched bracket in the host, for example) is answered with 400 invalid_redirect_uri "each redirect URI must be a valid URL". LiteLLM's urlparse call sits outside its try block, so the ValueError escapes and the route answers 500.
    why: A malformed client request should be a client error, and the registration endpoint is public.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/gateway_dcr_flow.py#L410-L418
  - what: The sealed values are encrypted with B1600's StoredCipher, so a sealed value written by LiteLLM opens in betterlite and the reverse, but the ciphertext bytes differ run to run (random nonce), as they do in LiteLLM.
    why: Cases compare what a sealed value opens to, never its text.
  - what: The shared-or-local choice and the Redis ClaimBackend are not made inside the guard. LiteLLM looks up the module global redis_usage_cache on every claim.
    why: betterlite keeps no module state; B8623 picks the authority once and the guard behaves the same for each choice.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/gateway_dcr_flow.py#L1024-L1046
out_of_scope:
  - "resolve_scoped_resource_server, aggregate_authorize, native_client_authorize, relative_request_url, _append_query_params, _cookie_path_and_secure, _flow_cookie_name, _rejected_authorize_request, _login_redirect, _new_connect_flow, _set_flow_cookie, _consent_lookup_failure_response, _origin_only, _open_flow_for, _flow_target, ConnectFlowDescription, describe_connect_flow, complete_connect_flow, the denied and approved flow responses, the manual delivery page, NativeClientAuthContract, native_client_auth_contract and is_proxy_api_resource: B4675. They use the models and ports built here."
  - "aggregate_token, _GrantIssuer, the three grant functions, _pkce_verifier_matches, _session_token_pair, _proxy_credential_response, _reload_failure_response, _subject_token_refusal_response, _mint_failure_response, _resource_conflicts_with_scope, revoke_refresh_token and introspect_gateway_token with its two response builders: B4676."
  - "SessionPrincipal, session token minting and opening, and the session signing keys: B4652. SessionAudience is imported from its types.rs."
  - "validate_redirect_uri_shape and is_loopback_redirect_host: B4655. TOKEN_NO_CACHE_HEADERS, canonical_resource_uri and python_url urlparse: B4654."
  - "encrypt_value_helper and decrypt_value_helper (the StoredCipher): B1600."
  - "The Redis ClaimBackend implementation and the choice of Shared or Local authority: B8623, over the dual-tier cache (B4293)."
  - "The HTTP routes POST /register and its parsing of a non-object body: the umbrella B137 and B4675 register routes; this task has no route yet, so its cases are helper cases."
pitfalls:
  - "Registration validates redirect_uris in two passes: the list shape and count first, then every item's type and length, and only then each URI's shape one by one, so [\"https://a.example/cb\", 5] fails on the type pass before the first URI is looked at."
  - "The length cap counts Python characters, so a 256-character string of multi-byte letters passes; count chars, not bytes."
  - "validate_redirect_uri_shape returning true means an allowlisted native callback and skips the https and loopback test, so cursor://anysegment is accepted without being https; returning false is not a rejection, it only falls through to the scheme rule."
  - "http is accepted only on a loopback host, so http://localhost/cb passes and http://localhost.evil.example/cb does not; https is accepted on any host."
  - "The success body echoes redirect_uris as the client sent them and drops everything else the client sent (client_name, grant_types, token_endpoint_auth_method); a client asking for client_secret_basic still gets \"none\"."
  - "The 2048-character client_id cap is checked after sealing, so the same four 256-character URIs may fit with ASCII and fail with long escapes; the check is on the sealed text, prefix included."
  - "extra=forbid is what stops a sealed _GatewayAuthCode (user_id, client_id, redirect_uri, code_challenge, jti, iat, exp) from opening as a GatewayDcrClient; keep deny_unknown_fields on all three models and test the cross-type direction with a real sealed code."
  - "open_sealed must map a decrypt failure to None even though decrypt_value_helper logs an error line for it; the caller turns None into an OAuth error and the log line is not a failure of the request."
  - "A guard count is compared with ==1, so a Redis value of 2.0 is replayed and 0 or a missing key is never first; the shared backend reports an unsigned count and the guard never inspects its type."
  - "On a Shared authority the local store is not consulted at all, not even to read; a test must seed the local store with the key and still see unavailable after a backend error."
  - "peek on a Local authority reads the in-process store for the exact key; it never creates the key, so peek followed by claim still returns first."
  - "MemoryClaimStore keeps the first increment's expiry: three claims inside the ttl leave the original deadline, and the first claim after that deadline starts again at 1."
  - "The claim key prefixes differ per grant (code, flow, refresh), and the same jti under two prefixes is two separate claims."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
