id: B1133
title: Batch list route
description: >-
  Register batch list aliases using configured provider selection and the pinned list visibility. Retrieve/reconcile
  remains B1051.


  Implement crates/betterlite-server/src/api/batch_list_route.rs, crates/betterlite-core/src/api/batch_list_route.rs.
  Use BatchListRouteInput and BatchListRouteResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /{provider}/v1/batches; GET /v1/batches; GET /batches. Each alias
  is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts its child
  factories without re-registering their methods/paths.


  Route input projections: data.model (absent None); request.query_params.model (absent None); request.headers.x-litellm-model
  (absent None); data.target_model_names (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:882 status_code=500, exception_detail=FastAPI detail object. Compare the actual
  source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions batch_list_provider_page, route_aliases, auth_missing, auth_invalid
  under api::batch_list_route::tests. Each named function drives production code and asserts its case result; use
  named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/batches_endpoints/endpoints.py: list_batches (L847-L1014). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 148 owned nonblank/non-comment/non-docstring Python lines (159 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 168 implementation,
  64 behavior tests, 48 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 318 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B855 (Authenticated request admission
  and budget handoff), B1035 (Batch records), B1129 (Batch provider list), B1112 (Batch route support), B171 (Direct
  helper oracle and URL path encoding), B1087 (Api boundaries), B1100 (Shared request body decoding), B1020 (File
  credentials), B1019 (File routing ids), B756 (Authentication header selection and mode dispatch), B1139 (Stateful
  HTTP oracle scenarios). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  Without the hook, list_user_batches is never called and the proxy does not filter a managed-object list by owner.
  Compare provider list results, forwarded after/limit, model-embedded response-ID encoding, and source credential
  precedence. target_model_names selects its first comma-separated model; no router is a 500 even for provider fallback.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
