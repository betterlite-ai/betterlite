deviations:
  - what: An undeliverable rewrite is the typed `StreamSyncError::Undeliverable { guardrail_name, reason }` with LiteLLM's message text, not the `UndeliverableStreamRewrite` exception of the policy pipeline.
    why: That exception belongs to B3246 in betterlite-core, which cannot be imported from here without a cycle risk. The dispatcher converts one into the other and the text is the same.
  - what: Events are JSON objects and the `hasattr(event, "get")` shim for pydantic events is not built. An event that is not an object is skipped.
    why: Rust has one JSON event type. Python's pydantic and dict branches give the same result for the same fields.
  - what: The `response` entry put into the request data is a copy of the envelope taken before the rewrite. LiteLLM stores the envelope itself, so later readers see the rewritten one.
    why: A Rust map cannot hold a second mutable reference to the event. Nothing after the guardrail call reads that entry. B3671 has the same deviation.
  - what: Case 2 reads the `function_call` or `custom_tool_call` item directly and builds the tool call with `tool_call_dict_from_output_item`, instead of running the chat stream translator on the event.
    why: For this event type the stateless translator returns a tool call only for those two item types, built by that function, and nothing else is read from its result. The `model` LiteLLM checks on the translated chunk is never set there, so the inputs carry none.
  - what: The `stream_transform_sink` parameter of `process_output_streaming_response` is dropped, and the guardrail's name is a plain `Option<&str>` argument.
    why: The Responses handler never reads the sink. The `GuardrailContract` trait has no name accessor, so the caller passes the configured name.
out_of_scope:
  - "B3671 owns extract_output, apply_guardrail_responses_to_output and write_tool_call_item (LiteLLM's _write_tool_call_item and the one-line _write_event_field are inlined there). This task calls them and does not copy them."
  - "B3670 owns ToolCallShape, tool_call_shapes, post_guardrail_tool_call_shapes, tool_call_rewrite, undeliverable_tool_call_rewrite_reason, is_tool_call_item and is_tool_call_output_item. B3663 owns stream_item_field, stream_item_items and stream_item_fingerprint."
  - "B3673 owns the Responses block events, build_stream_error_items, _next_stream_sequence_number, the open item state and ResponseOutputEnvelope and ResponsesStreamChunk. This task reads events as plain JSON and does not use those two views."
  - "B3246 owns UndeliverableStreamRewrite and the pipeline code that discards an undeliverable rewrite and releases the original events."
  - "The class attributes delivers_ended_stream_rewrites (true) and assembles_streamed_response (true) belong to the dispatcher (B3680) and its registry entry for this handler."
  - "B888 owns extract_request_tool_names, which is request-side only. Nothing in this task reads tool names from a request, so it does not call it."
  - "_has_text_content has no caller at the pin and is not built (B3671 lists it too)."
pitfalls:
  - "streaming_string_so_far keys parts by (item_id, output_index, content_index) and reads any event with a string `text` or `delta`, so `response.function_call_arguments.delta` and reasoning summary deltas end up in the scanned string. A later spread then fails as undeliverable because those events are not output_text events."
  - "In streaming_string_so_far a part with a done `text` ignores its own deltas, and two events with the same key and different done texts keep the last one, so do not append them."
  - "Case 1 runs `post_guardrail_tool_call_shapes` before the text write-back even when deliver_ended_stream_rewrites is false, so its warning is logged for every terminal scan and the envelope's tool calls stay untouched in that mode."
  - "The rewrite map in Case 1 only holds texts that differ from what was scanned, and a returned list longer than the scanned one fails inside apply_guardrail_responses_to_output before any sync runs."
  - "The sync counter for blanking deltas is per (output_index, content_index), so two items at different positions each keep one full delta, and the first delta event seen in stream order is the one that carries the text."
  - "Argument and input events carry `item_id`, not `call_id`, and a bridged stream numbers tool calls from 1 while the envelope lists them after the message, so match by call_id and never by output_index."
  - "deliver_ended_stream_tool_call_rewrites passes no payload for response.output_item.added events, so an added event only gets the new name and keeps its arguments, while the done event gets both."
  - "A rewrite whose call_id appears in no earlier event is undeliverable, but a call that was not rewritten may be missing from the events without any error."
  - "Case 2 drops what the guardrail returns, so a tool call rewritten while the last event is output_item.done is never delivered, and the request data has no `response` key there."
  - "tool_calls_in_flight in the scan key is true once any tool call event has been seen, even if the call finished, because only a terminal event switches to the envelope key."
  - "The terminal types include response.failed and response.incomplete, whose envelopes hold partial output, so those streams are scanned and rewritten like completed ones."
