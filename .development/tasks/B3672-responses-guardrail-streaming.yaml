dod:
  - text: >-
      streaming_string_so_far joins parts in first-seen order, uses the last done `text` of a part and the joined deltas
      only when the part has no done text, and counts any event with a string `text` or `delta` whatever its type.
    proof: [scan-string-tests, oracle]
  - text: >-
      streaming_has_ended is true only for a last event of type response.completed, response.failed or
      response.incomplete, and false for an empty list.
    proof: [scan-ended-tests]
  - text: >-
      streaming_scan_key returns None for an empty list, a non-object last event and a last response.output_item.done; a
      terminal last event gives the envelope's non-empty message texts, one fingerprint per tool call item and
      stream_ended true; any other last event gives the string so far with tool_calls_in_flight set by earlier tool call
      events.
    proof: [scan-key-tests, oracle]
  - text: >-
      sync_stream_events_with_rewrites puts the whole rewrite on the first delta of a position and "" on the others, sets
      the text of output_text.done, content_part.done and the output_item.done content entry, and skips events without
      integer indexes.
    proof: [sync-tests, oracle]
  - text: >-
      spread_text_rewrite_over_stream_events puts the rewrite on the first scanned position and blanks the rest, and
      returns the undeliverable error before any write when a scanned event is not an output_text event or lacks an integer
      index.
    proof: [spread-tests, oracle]
  - text: >-
      tool_call_ids_by_item_id and tool_call_event_call_id resolve a call_id through output item events and argument events
      and give None for events that carry neither.
    proof: [ids-tests]
  - text: >-
      deliver_ended_stream_tool_call_rewrites writes a rewritten name and arguments into the envelope items, the added and
      done item events and the argument events (first delta gets the arguments, later ones ""), and returns the undeliverable
      error with B3670's reason when call ids are missing, repeated, miscounted, unresolved or absent from the events.
    proof: [deliver-tests, oracle]
  - text: >-
      A terminal last event scans the envelope's texts and tool calls with the response model, writes the returned texts
      into the envelope, syncs the earlier events only when deliver_ended_stream_rewrites is true, and a guardrail
      failure is returned unchanged.
    proof: [terminal-tests]
  - text: >-
      A last response.output_item.done holding a function_call or custom_tool_call scans that one tool call with no texts
      and no model, drops the answer, and then runs the text fallback only when deliver_ended_stream_rewrites is true.
    proof: [item-done-tests]
  - text: >-
      The text fallback scans the string so far once, spreads a changed first text only when deliver_ended_stream_rewrites
      is true, and calls no guardrail for an empty string.
    proof: [fallback-tests]
