    - crates/betterlite-config/src/sections/azure_content_safety.rs
    - crates/betterlite-config/src/sections/azure_content_safety/**
    - "crates/betterlite-config/fuzz/corpus/config_yaml/azure-content-safety-*"
    - crates/betterlite-server/src/app/callbacks/azure_content_safety.rs
    - crates/betterlite-server/src/app/callbacks/azure_content_safety/**
