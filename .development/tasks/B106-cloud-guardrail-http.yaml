id: B106
title: Cloud provider guardrails over HTTP and the legacy Azure Content Safety callback
description: >-
  Finish the cloud guardrail umbrella. Its parts built the Bedrock, Azure, OpenAI moderation, Model Armor, IBM,
  Purview and Agent 365 classes (B3720 to B3742), B8290 built their initializers, B8521 registers their wire names and
  B8666 runs a held guardrail through its class. Two things are left. First, the legacy `azure_content_safety` arm of
  initialize_callbacks_on_proxy (callback_utils.py L346-L359): `litellm_settings.callbacks: [azure_content_safety]`
  plus `litellm_settings.azure_content_safety_params` builds B3728's `_PROXY_AzureContentSafety` hook and puts it in
  the proxy callbacks, and no task turns that config into a running hook (B8741 still answers it with
  ConfigError::Unsupported). Second, the parts had no route when they were planned, so they only have helper cases;
  this task adds the booted-proxy HTTP cases that show the configured guardrails really run on a chat request. It
  registers no route, no guardrail kind and no class: B8613 installs B8666's callbacks, B8399 runs the proxy hooks,
  B3683 starts the config guardrails, and B004/B005 mount the chat paths.


  Config section azure_content_safety (crates/betterlite-config/src/sections/azure_content_safety.rs and its folder;
  the skeleton adds the stub, the `pub mod` line and the sections! entry). It reads `litellm_settings.callbacks` and
  `litellm_settings.azure_content_safety_params` and exposes `AzureContentSafetySettings { params:
  Option<AzureContentSafetyParams> }` as config.sections.azure_content_safety. `AzureContentSafetyParams` holds
  `endpoint: String`, `api_key: SecretString` and `thresholds: Option<BTreeMap<String, i64>>`, the three constructor
  arguments of `_PROXY_AzureContentSafety(endpoint, api_key, thresholds=None)`. LiteLLM spreads the params dict into
  that constructor, so another key stops startup (TypeError) and a missing endpoint or api_key does too; report each
  as a config error naming the key. When `callbacks` lists azure_content_safety and the params key is absent, startup
  fails too, since LiteLLM reads it as `litellm_settings["azure_content_safety_params"]` (KeyError); the message names
  `litellm_settings.azure_content_safety_params`. When the callback is not listed the params are never read, so the
  section leaves them as None and raises nothing. The `os.environ/` loop at L351-L354 runs on values the config load
  has already resolved (B8590's env_overlay resolves the whole file first, as LiteLLM's load_config does), so the
  section reads resolved strings and resolves nothing again. Test it in sections/azure_content_safety/tests.rs through
  the real loader; the test `loaded_azure_content_safety_config` loads endpoint, api_key and thresholds, the absent
  params with the callback listed, an unknown key, and params without the callback. Add config_yaml corpus seeds named
  azure-content-safety-*.


  The binding (crates/betterlite-server/src/app/callbacks/azure_content_safety.rs and its folder) follows B8850's
  prompt_injection binding. `build(state: &ServerState)` returns an `Arc` of a concrete `AzureContentSafetyCallback`,
  coercible to `Arc<dyn ProxyCallback>`, or the module's typed BuildError. It reads config.sections.azure_content_safety
  and builds B3728's legacy hook from the params and the pooled outbound client the server state already holds; read
  B3728's merged constructor for what else it takes. The callback reports class_name `_PROXY_AzureContentSafety`,
  is_base_logger false, enforces_request_content true (a class attribute of the legacy hook), guardrail None and
  use_native_lifecycle_hooks false. `overrides()` is true for request.pre_call and post_call.success only, the two hooks
  the class defines. pre_call forwards to B3728's legacy pre-call hook and answers PreCallReturn::Unchanged on a pass,
  since LiteLLM's hook returns None. A violation becomes ProxyHookError::Http with status 400 and the hook's detail.
  post_call_success forwards to the legacy post-call hook and returns Ok(None) on a pass. A violation is the same 400,
  and any other failure (an Azure transport error) goes out as ProxyHookError::Other so the proxy answers it like any
  other hook failure. Which call types are scanned and which errors the pre-call hook swallows stay B3728's. Tests in
  app::callbacks::azure_content_safety cover the build from a loaded Config, the flags and overrides, the pass and the
  400 mapping on both hooks, and a transport failure that passes in pre_call and fails in post_call.


  HTTP cases in tools/oracle/cases/guardrails/cloud-http. Use the normal booted-proxy case format with the master key
  oracle-master, one chat deployment `chat` on `openai/gpt-oracle` with api_base {{upstream}} and api_key oracle-key,
  and router_settings.num_retries 0. Every guardrail's endpoint is the same mock, so the ordered upstream answer queue
  holds the guardrail call and the model call in the order the hooks make them. Configure each guardrail under the
  top-level `guardrails:` list and select it with the request body's `guardrails` list, except where a case says
  default_on. Compare status, content-type, x-litellm-applied-guardrails where the class adds it, and error type, param
  and code. On an error ignore only /error/message when it is a string, with the reason that betterlite writes its own
  wording around the detail; keep every structured field compared. Compare the provider requests the mock captured,
  so a 200 cannot hide a skipped scan, and list the vendor headers below in upstream_headers. Ignore generated ids and
  timestamps in a 200 body with a reason, and nothing else.


  Bedrock (guardrail `bedrock`, guardrailIdentifier gr-oracle, guardrailVersion "1", aws_region_name us-east-1, static
  aws_access_key_id and aws_secret_access_key, aws_bedrock_runtime_endpoint {{upstream}}, so the scan goes to
  /guardrail/gr-oracle/version/1/apply). bedrock-input-blocked: pre_call, the mock answers GUARDRAIL_INTERVENED with a
  topicPolicy topic whose action is BLOCKED and an outputs text; the client gets 400 with LiteLLM's "Violated guardrail
  policy" detail and the model is never called. bedrock-input-anonymized: pre_call, the answer intervenes with only an
  ANONYMIZED piiEntities assessment and outputs text "My email is {EMAIL}"; the model receives that text and the
  client gets 200. bedrock-block-as-response: the blocked answer again with disable_exception_on_block true; the
  client gets a 200 chat response whose content is the outputs text, and the model is never called.
  bedrock-output-blocked: post_call, the model answers first and the OUTPUT scan blocks with a 400. bedrock-default-on:
  default_on true and no request guardrails list, a NONE action, and both calls happen. List content-type for Bedrock,
  never authorization or x-amz-date.


  Azure Content Safety (api_key oracle-azure-key, api_base {{upstream}}; list ocp-apim-subscription-key and
  content-type). azure-prompt-shield-attack: guardrail azure/prompt_shield, pre_call, the mock answers
  userPromptAnalysis.attackDetected true and the client gets 400 with the "Violated Azure Prompt Shield guardrail
  policy" detail. azure-prompt-shield-clean: attackDetected false and the model answers. Both requests go to
  /contentsafety/text:shieldPrompt?api-version=2024-09-01. azure-text-moderation-default: guardrail
  azure/text_moderations, pre_call, Hate severity 2 with no thresholds configured blocks, since the class default is 2.
  azure-text-moderation-category: severity_threshold_by_category {Hate: 6} and Hate severity 4 passes.
  azure-text-moderation-output: post_call, the model answers and the text:analyze call on its text returns Violence 4,
  so the client gets 400.


  Legacy Azure Content Safety (litellm_settings.callbacks [azure_content_safety], azure_content_safety_params endpoint
  {{upstream}} and api_key oracle-azure-key; list ocp-apim-subscription-key). legacy-content-safety-input: the input
  analysis returns Hate 4. That meets the default threshold of 4, so the client gets 400 with source input.
  legacy-content-safety-thresholds: thresholds {Hate: 6}, the input analysis returns Hate 4, the model answers, the
  output analysis returns nothing over a threshold, and the client gets 200 after three upstream calls.
  legacy-content-safety-output: the input passes, the output analysis returns SelfHarm 6, and the client gets 400 with
  source output. These cases need the architect prerequisite in the notes: LiteLLM's hook imports the
  azure-ai-contentsafety SDK and stops startup without it.


  OpenAI moderation (guardrail openai_moderation, api_key oracle-moderation-key, api_base {{upstream}}, so calls go to
  /moderations; list authorization). B104 already covers the allowed and flagged input scan with its scan headers, so
  these two cover the rest. openai-moderation-output-flagged: post_call, the model answers and the moderation of its
  text is flagged, so the client gets 400 with "Violated OpenAI moderation policy". openai-moderation-upstream-error:
  pre_call, the moderation endpoint answers 500 and the client gets LiteLLM's answer for that HTTPException before any
  model call.


  IBM (guardrail ibm_guardrails, auth_token oracle-ibm-token, base_url {{upstream}}, detector_id hap; list
  authorization and detector-id). ibm-detector-server-block: is_detector_server left unset (true), pre_call, POST
  /api/v1/text/contents answers one detection with score 0.9, and the hook raises ValueError, not HTTPException, so
  compare whatever status and error fields LiteLLM gives for that. ibm-orchestrator-pass: is_detector_server false and
  optional_params.score_threshold 0.95; POST /api/v2/text/detection/content answers one detection with score 0.9, it
  falls under the threshold, and the model answers. ibm-detector-http-error: the detector answers 503 with a text body;
  raise_for_status raises httpx.HTTPStatusError, and _handle_llm_api_exception turns it into the detector's own 503 with
  `{"error": <body text>}` as the detail.


  Model Armor (guardrail model_armor, guardrail_name armor, template_id oracle-template, project_id oracle-project,
  location us-central1, api_endpoint {{upstream}}, so scans go to
  /v1/projects/oracle-project/locations/us-central1/templates/oracle-template:sanitizeUserPrompt and
  :sanitizeModelResponse). The token comes from B9440's Vertex lookup, so `credentials` is a JSON string of an
  authorized_user credential: {"type": "authorized_user", "client_id": "oracle-client", "client_secret":
  "oracle-secret", "refresh_token": "oracle-refresh", "token_uri": "{{upstream}}/token"}. The first upstream answer
  is the token, {"access_token": "oracle-armor-token", "token_type": "Bearer", "expires_in": 3600}, and every scan
  then sends `Authorization: Bearer oracle-armor-token`; list authorization and never content-type. google-auth posts
  the refresh as a form body and betterlite's Google auth posts it as JSON, so each case names that request with
  B9850's selector `/upstream/0/body`, with that reason, and ignores nothing else upstream. model-armor-input-blocked:
  mode pre_call, the scan answers a sanitizationResult whose filterResults hold a piAndJailbreakFilterResult with
  matchState MATCH_FOUND, and the client gets 400 with the "Content blocked by Model Armor" detail after two upstream
  calls; the model is never called. model-armor-input-masked: mask_request_content true, the scan answers an
  sdpFilterResult whose deidentifyResult has matchState MATCH_FOUND and data.text "My email is [EMAIL_ADDRESS]", and
  the model receives that text. model-armor-both-scans: mode [pre_call, post_call], both scans answer
  NO_MATCH_FOUND, the client gets 200, and the mock sees the token request, sanitizeUserPrompt, the chat call and
  sanitizeModelResponse in that order, since the second scan reuses the token.


  no-auth: a default_on Bedrock guardrail and no Authorization header; the 401 comes before any upstream call.
  Exercise the unprefixed /chat/completions alias in azure-prompt-shield-clean and the canonical /v1/chat/completions
  everywhere else.


  A case that fails because a class answers differently from LiteLLM goes back to that class's task as a finding,
  never fixed here. Purview and Agent 365 get no HTTP case (see out_of_scope), and this task builds nothing for
  them or for Model Armor.

