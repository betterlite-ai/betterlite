deviations: []

out_of_scope:
  - "The guardrail classes and their hooks: B3720 to B3742. Their initializers: B8290. Their registry arms: B8521. Running a held guardrail: B8666. Installing the callbacks: B8613. ProxyLogging and hook dispatch: B8399 and B8390. Config guardrail startup: B3683."
  - "The legacy hook itself (_PROXY_AzureContentSafety, its thresholds, test_violation and both hooks): B3728."
  - "The Model Armor class and transport: B3732 and B3733. The token source: B9440. Building the guardrail with that source: B8666. The selector that skips the token request's body: B9850."
  - "Purview and Agent 365 get no HTTP case: their token and Graph or evaluation URLs are fixed Microsoft hosts (microsoft_purview/base.py L25-L27, agent_365.py L51-L52), and Agent 365 ignores api_base, so no case can point them at the mock."
  - "The input scan with scan headers for openai_moderation: B104. The unified pre/during/post-call cases across endpoints: B3680."
  - "The other arms of initialize_callbacks_on_proxy: detect_prompt_injection is B8850; the rest stay with B189's inventory. Callback name acceptance, the resolver answer and the hooks::configured entry for azure_content_safety are architect prerequisites in B8741's and B8742's files."
  - "add_guardrail_to_applied_guardrails_header: B3680. add_guardrail_scan_id, add_guardrail_response_to_standard_logging_object and _serialize_scan_metadata_header: B8994."

pitfalls:
  - "LiteLLM reads litellm_settings[\"azure_content_safety_params\"] with brackets, so listing the callback without params stops startup, while params without the callback are never read."
  - "The legacy hook's default threshold is 4 per category and azure/text_moderations defaults to 2; a severity of 2 blocks the guardrail but passes the legacy callback."
  - "The text moderation wire name is azure/text_moderations with an s, and prompt shield is azure/prompt_shield."
  - "Bedrock builds its URL from aws_bedrock_runtime_endpoint and passes api_base=None, so api_base never moves the scan to the mock."
  - "SigV4 puts the request time into authorization and x-amz-date, so listing either in upstream_headers fails every Bedrock case."
  - "With disable_exception_on_block true a Bedrock block is a 200 chat response carrying the guardrail's outputs text, not a 400."
  - "The IBM pre-call hook raises ValueError, not HTTPException, while a detector HTTP error reaches the client with the detector's own status through the httpx.HTTPStatusError branch."
  - "The legacy pre-call hook swallows every error except HTTPException, but its post-call hook lets an Azure error through, so a transport failure passes on input and fails on output."
  - "The os.environ/ loop in the azure_content_safety arm sees values the config load already resolved; resolving them again in the section would read an env var named after a secret."
  - "A service_account credential can't drive a Model Armor case: google-auth exchanges a signed JWT at token_uri, while google-cloud-auth signs its own token and sends no request, so the captured request counts differ."
  - "Model Armor's credentials is a string field in LiteLLM's guardrail params, so the authorized_user credential goes in as JSON text, not a YAML mapping."
  - "With mask_request_content true a deidentifyResult MATCH_FOUND masks instead of blocking, while an inspectResult MATCH_FOUND still blocks."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
