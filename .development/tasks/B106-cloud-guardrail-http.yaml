dod:
  - text: The azure_content_safety section loads endpoint, api_key and thresholds, fails startup when the callback is listed without params or with an unknown or missing key, and reads nothing when the callback is absent.
    proof: [section-tests]
  - text: Fresh azure_content_safety_params corpus seeds replay through the config decoder.
    proof: [config-corpus]
  - text: A configured azure_content_safety callback builds a content-enforcing proxy callback with only the pre_call and post_call success overrides and maps passes, violations and transport failures as LiteLLM's hook does.
    proof: [binding-tests, oracle]
  - text: Booted-proxy cases show Bedrock blocking, anonymizing, answering a block as a response, scanning output and running default_on, and refuse an unauthenticated request before any scan.
    proof: [oracle]
  - text: Booted-proxy cases show Azure Prompt Shield, Azure text moderation thresholds, OpenAI moderation output and upstream errors, and IBM detector, orchestrator and detector error outcomes as LiteLLM answers them.
    proof: [oracle]
  - text: Booted-proxy cases show the legacy azure_content_safety callback blocking input and output and honoring configured thresholds.
    proof: [oracle]
  - text: Booted-proxy cases show Model Armor blocking input, masking input and scanning input and output on one token refresh.
    proof: [oracle]

checks:
  optional: [mutants]
  commands:
    - id: section-tests
      why: the azure_content_safety section misses a key, accepts an unknown one or reads params the callback does not use
      run: >-
        cargo nextest run --locked -p betterlite-config --no-tests=fail
        -E 'test(/^sections::azure_content_safety::/) - test(replays_the_config_yaml_corpus)'
    - id: config-corpus
      why: no azure_content_safety_params seed was added, or the config decoder fails on one
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/azure-content-safety-*')"
        && grep -rlq 'azure_content_safety_params' crates/betterlite-config/fuzz/corpus/config_yaml
        && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: binding-tests
      why: the legacy callback is not built, reports the wrong flags or maps a hook outcome differently
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::callbacks::azure_content_safety::/)'

