id: B860
title: Postgres-backed HTTP oracle cases
description: >-
  Extend B001's booted HTTP runner with independent Postgres fixtures for both gateways. Build the
  dev-only betterlite-postgres-fixture package under tools/postgres-fixture; no product migration or
  repository crate is a dependency. When POSTGRES_TEST_URL is set, use that server. An empty, malformed,
  unreachable or unauthorized configured URL fails setup, never silently starts a container. Only an
  absent variable selects testcontainers. CI supplies the Postgres service. Return connection options
  without displaying credentials and clean up resources on success, setup failure and cancellation.

  Expose isolated schemas for small repository tests and isolated databases for full migration/HTTP
  fixtures. Full pinned baseline SQL guards foreign keys with database-wide pg_constraint conname
  lookups, so two schemas in one database are not independent copies. Create a fresh randomly named
  database for each gateway from the configured server's administrative connection; the CI/test role
  needs CREATEDB for this mode. A privilege failure is an actionable fixture failure, not a skip.
  Apply independently pinned fixture SQL to each database, then seed typed users, keys, teams,
  memberships, budgets and JWT mappings in foreign-key order. Never seed through betterlite's product
  repositories. Scope all cleanup identifiers to resources this fixture created; close gateway/pool
  connections before dropping databases, and do not drop the database named in POSTGRES_TEST_URL.

  Start the actual betterlite binary and LiteLLM without its enterprise package. Give each its own
  general_settings.database_url and disable_prisma_schema_update=true after fixture SQL has been
  applied. At the pin that switch still permits check_prisma_schema_diff; it does not disable schema
  verification or make a partial baseline sufficient. Seed fixture virtual keys as UTF-8 SHA256 hex
  hashes, and explicit caller roles/team memberships, preserving the un-hashed request credential only
  in the test request. Compare response status, type, message, param, code, named headers and ordered
  database effects using B001's existing comparison. A public route remains public: database setup
  alone does not inject an authentication requirement.

  Add an optional typed database fixture field to HttpCase with absence preserving existing cases.
  Reject unknown fixture fields, duplicate row identities and references to missing fixture principals
  before starting either gateway. Fixtures may define controlled fault/clock inputs for tests that
  explicitly request them; do not silently replace production clocks or run FastAPI handlers in a
  helper adapter. Tests must prove a deliberately changed status, error param or principal role is
  detected, and that a first gateway's write cannot alter the second gateway's initial state.

  Add local TLS fixture support with test-owned CA/server certificates and explicit hostnames. Exercise
  a trusted matching hostname, an untrusted CA and a mismatched hostname against a real TLS Postgres
  server; parsing sslmode alone is insufficient. Keep certificate assets in fixture paths and do not
  weaken verification to make the test pass. If a test requires TLS the fixture provisions that local
  TLS server explicitly, independently of the normal configured-URL preference tests.

  Expose B001's actual decode_http_case(&[u8]) for the existing HTTP case format and extend B171's fuzz
  workspace with http_case. Replay old cases plus valid database fixtures, malformed YAML, unknown
  fields, duplicate identities, missing references and truncated nested rows. The same parser serves
  the CLI, tests and fuzz target; add no test-only decoder. Keep each module below 300 lines. This is
  native test infrastructure with no owned LiteLLM function port; budget 300 fixture/process plumbing,
  240 tests, 110 HTTP schema/comparison and 80 TLS/manifests, 730 within 800.
scope:
  paths:
    - Cargo.toml
    - deny.toml
    - tools/postgres-fixture/**
    - tools/oracle/Cargo.toml
    - tools/oracle/src/case.rs
    - tools/oracle/src/case/**
    - tools/oracle/src/http.rs
    - tools/oracle/src/http/**
    - tools/oracle/src/runner.rs
    - tools/oracle/src/runner/**
    - tools/oracle/src/process.rs
    - tools/oracle/src/process/**
    - tools/oracle/src/lib.rs
    - tools/oracle/src/main.rs
    - tools/oracle/fuzz/Cargo.toml
    - tools/oracle/fuzz/fuzz_targets/http_case.rs
    - tools/oracle/fuzz/corpus/http_case/postgres-*
    - tools/oracle/cases/management/postgres-fixture/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250326162113_baseline/migration.sql#L319-L429
    why: Foreign-key existence checks are global within a database, requiring separate databases for independent migration copies.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_cli.py#L1386-L1405
    why: disable_prisma_schema_update still runs schema-diff verification.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6691-L6704
    why: The actual database URL and master-key configuration reads used by the booted proxy.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L7119-L7125
    why: Virtual-key fixture tokens use the same UTF-8 SHA256 hex representation.
dod:
  - text: 'Fixture selection/lifecycle cases are configured_url_wins, containers_when_unset,
      empty_configured_url_fails, unreachable_configured_url_fails, createdb_privilege_failure,
      isolated_schemas, independent_databases_have_all_baseline_foreign_keys,
      existing_database_never_dropped, cleanup_after_failure, cleanup_after_cancellation,
      concurrent_fixture_roles_do_not_leak and connection_credentials_redacted.'
    proof: [fixture-tests]
  - text: 'Booted runner cases are legacy_case_without_database, public_route_without_key,
      detects_status_mismatch and detects_error_param_mismatch.'
    proof: [http-fixture-tests]
  - text: fixture_unknown_field, duplicate_identity, missing_principal, malformed_yaml and truncated_rows fail before gateway spawn; valid and legacy cases replay through decode_http_case.
    proof: [http-fixture-tests, http-case-corpus]
checks:
  optional: []
  commands:
    - id: fixture-tests
      why: Actual configured/container Postgres fixture selection, isolation or cleanup fails.
      run: >-
        list=$(cargo nextest list --locked -p betterlite-postgres-fixture -E 'test(/^tests::/)' --message-format oneline) &&
        for name in configured_url_wins containers_when_unset empty_configured_url_fails unreachable_configured_url_fails createdb_privilege_failure isolated_schemas independent_databases_have_all_baseline_foreign_keys existing_database_never_dropped cleanup_after_failure cleanup_after_cancellation concurrent_fixture_roles_do_not_leak connection_credentials_redacted; do grep -q "::$name$" <<< "$list" || { echo "missing test $name"; exit 1; }; done &&
        cargo nextest run --locked -p betterlite-postgres-fixture --no-tests=fail -E 'test(/^tests::/)'
    - id: http-fixture-tests
      why: The actual HTTP runner fails to load fixtures or detect status/role differences.
      run: >-
        list=$(cargo nextest list --locked -p betterlite-oracle -E 'test(/^http::postgres::tests::/)' --message-format oneline) &&
        for name in legacy_case_without_database public_route_without_key detects_status_mismatch detects_error_param_mismatch fixture_unknown_field duplicate_identity missing_principal malformed_yaml truncated_rows; do grep -q "::$name$" <<< "$list" || { echo "missing test $name"; exit 1; }; done &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^http::postgres::tests::/) - test(/replays_the_/)'
    - id: http-case-corpus
      why: The production HTTP case parser lacks a new database fixture seed or fails replay.
      run: test -f tools/oracle/fuzz/fuzz_targets/http_case.rs && grep -q http_case tools/oracle/fuzz/Cargo.toml
        && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/http_case/postgres-*")"
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
oracle_cases: []
deviations: []
out_of_scope:
  - The TLS cases trusted_ca_matching_hostname, untrusted_ca_rejected and wrong_hostname_rejected belong to B5077, since they need a Postgres server with TLS certificates that no fixture provides yet.
  - The booted cases that need the gateway's own database support (independent_initial_rows, first_gateway_write_not_shared, hashed_fixture_keys_and_roles, disabled_schema_update_still_checks_current_schema and detects_role_mismatch) belong to B5076, since betterlite reads general_settings.database_url and authenticates keys from Postgres only after B700 and the tasks after it.
  - Product Postgres repositories and migration behavior belong to B700 and the other database tasks.
  - B001 retains HTTP request/response comparison and process supervision; B171 provides the oracle fuzz workspace.
pitfalls:
  - A set but unreachable POSTGRES_TEST_URL is a failure, not permission to silently fall back to a container.
  - Both servers require equivalent independent data; sharing a mutated fixture can hide a persistence
    mismatch.
  - TLS verification tests require a server certificate and a mismatched hostname, not merely a parsed
    sslmode string.
  - A second schema can lack foreign keys because baseline guards match the first schema's constraint names.
budget:
  max_changed_lines: 2200
  max_new_expects: 0
review_level: security
