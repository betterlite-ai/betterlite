id: B8610
title: Shared state, server inputs, the area mount aggregator and the WebSocket auth pass
description: >-
  On main, server::run(config, chat, host, port) gets only the Config and the chat executor, so nothing the lifespan
  builds (database, Redis, caches, guardrails, plugins, router, registries) reaches a route. B1100 declares an empty
  `Shared` in crates/betterlite-server/src/state/shared.rs that application() builds once and puts into ServerState as
  `shared: Arc<Shared>`, so every Slot::new(config, shared) and every handler can read it. This task fills Shared,
  widens the server inputs to carry what the lifespan made (B8613's Started), adds the area mount aggregator with its
  startup step, and lets WebSocket upgrades reach their own auth. Area wiring parts read `state.shared.<field>` or
  `shared.<field>` and never edit these files.


  Shared fields, with exactly these names (wave 17 parts already use them). Each Arc is the one instance B8613 made or
  application() derives; nothing builds a second.

  `db: Option<Arc<PostgresStore>>`: betterlite-db's store from B051's startup, None without DATABASE_URL (if B051
  returns a wrapper around the store, hold that wrapper). `redis: SharedRedis`, a struct in shared.rs with `factory:
  Arc<LiveClientFactory>` (B5220's one factory, made by B8613 with B8501's cloud Redis credential source), `usage` and
  `buffer`, each an Option of B5630's RedisCache built through that factory (the usage client B8377 selected or
  init_cache returned, and the transaction buffer client). A part that needs the shared usage connection reads
  `redis.usage`; a part that must open its own client builds it with `redis.factory`, never with a fresh factory.
  `http: ProxiedClient`: betterlite-http's client, the clone of `chat.client`. Its task tracker is the server's
  TaskTracker (B8633, B4444, B4445, B1303 and B2318 spawn on it), and server::run keeps draining that same client at
  shutdown with OUTBOUND_DRAIN_TIMEOUT, as it does today. `auth_cache: Arc<UserApiKeyCache>` (B733). `cache:
  Arc<DualCache>`: B4293's memory and Redis cache over `redis.usage` with LiteLLM's default TTLs, built here once
  (DualCache(redis_cache=redis_usage_cache)). `response_cache: Arc<ResponseCacheSlot>`, `cache_reinit:
  Arc<ResponseCacheReinit>` and `cache_settings: Arc<CacheSettingsManager>` (B8612's CacheRuntime, B8502's manager).
  `cache_writes: Arc<CacheWriteTracker>` (B4304). `secrets: Arc<SecretLookup>` (B8500 values from B8612's builder, with
  the manager B8590 installed). `guardrails: SharedGuardrails`, a struct in shared.rs with `runtime:
  Arc<GuardrailRuntime<PostgresGuardrailRows>>` (B3683, wrapping B3682's handler; without a database the rows value answers a database error, as LiteLLM with prisma None does), `router_list: Arc<Vec<RouterGuardrail>>` (the list start_from_config returned, for B8399's GuardrailBalancer) and `classes: Arc<GuardrailClasses<PostgresGuardrailRows>>` (B8666's pub module guardrail_dispatch, the one value B8613 built over the same runtime; B8790 fills its embedder slot at start and the policy routes reuse it). `plugins:
  Arc<PluginRegistry>` (B8230). `agents: Arc<SharedAgents>` (B8612: B4776's registry and the one B8231 read-through,
  built here with SharedAgents::new over the registry B8613 made, `db` and `proxy_config`). `jwt_signer:
  Arc<JwtSignerSlot>` (B8254). `general_settings: Arc<ProxySettingsStore>` (B8612, built here over `db`,
  `proxy_config` and `plugins`). `proxy_logging: Arc<ProxyLogging>` (B8399). `router: Arc<RouterHandle>` and
  `router_views: Arc<RouterViews>` (B8611; router_views is built here over the same handle). `mcp_registry:
  Arc<McpRegistry>`, `vector_stores: Arc<VectorStores>` and `pass_through: Arc<PassThroughState>` (B8614; the
  pass-through credential router, Vertex token state and route table that startup, B8384 and B8640 share).
  `proxy_config: Arc<ProxyConfigState>` (B8380). `mcp_area: std::sync::OnceLock<Arc<crate::app::mcp::state::McpState>>`,
  created empty here: app::mcp's mount, mount_public and start need the same McpState, and B8620 fills the cell on first
  use (the skeleton stubs `pub struct McpState` in app/mcp/state.rs, so this field compiles before B8620).

  `budget: Arc<BudgetServices>` (B8481), built here once with `BudgetServices::new` over the inputs its merged
  constructor lists: the spend counter cache, made once here as LiteLLM's module-level spend_counter_cache, and the
  Shared values it asks for. The auth slots (B753, B755), B1225's admission slot and the edge's release layer all read
  this one value, so they share one limiter and one counter cache. The constructor fails when reservations are enabled
  without a settlement backend; application() returns that error and run stops before it binds. `prompts`: B4059's
  one InMemoryPromptRegistry (betterlite-prompts) that B8613 made and config load filled, read by chat and by B8672's
  prompt routes. B8293's init_prompts and B4060's mutations take &mut, so it is an Arc of a RwLock: use the lock type
  the merged prompt route modules (B4061, B4062) take. `periodic_reloads: Arc<PeriodicReloads>` (B8385, a
  betterlite-server type): the one reload state the lifespan timer checks write and B8586's routes read.
  `deployment_sync: Arc<dyn DeploymentSyncPort>` (B8611's port; B8613 implements it over B8381's DeploymentSync, which
  lives in crates/betterlite) for the add_deployment call of B8594 and B8596, and `auto_router_catalog: Arc<dyn
  AutoRouterCatalog>` (B379's trait, backed by the same DeploymentSync) for B8676. `gateway_requests:
  Arc<GatewayRequestAccumulator>` (B3102, betterlite-db): the one accumulator B8680's billable sink records into, the
  B8372's periodic flush job drains and B8613's stop drains last. `prometheus_registry: Arc<CollectorRegistry>` (B3875,
  betterlite-logging, which this task adds to betterlite-server's dependencies): the one registry B8613 made at startup; B8655 registers its collectors into it and B3886's
  metrics_router renders it. `spend_producer: Arc<std::sync::OnceLock<P>>`, where P is the drainable producer
  value B069's `spend::startup::start` returns (read its merged signature): B8613 makes the slot empty and keeps a
  clone, B8662 sets it from what start returns in app::spend::start, and B8613's stop drains it at L1625. It stays
  empty without a database or collector.


  Server inputs. crates/betterlite-server/src/server/inputs.rs (declared in server.rs) holds `StartupOutputs`, one public
  field per value B8613 made (every field above except http, cache, router_views, agents, general_settings, mcp_area
  and budget, which application() derives; agents arrives as the bare AgentRegistry) plus `shutdown:
  Arc<ShutdownState>` and `in_flight` (B022's in-flight source that ShutdownState reads), and `ServerInputs { config, chat, host, port, startup: StartupOutputs }`. `server::run(inputs:
  ServerInputs)` replaces the four-argument run. `application(config, chat, startup)` builds Shared once, puts it into
  ServerState as B1100 does, keeps the RootPaths wrap and returns the router and the Arc<ServerState>. run then awaits `app::start(&state)` once, before it binds the listener,
  so no request arrives before every area finished its startup work. In crates/betterlite/src/lifespan.rs, run_proxy
  turns B8613's `Started` into StartupOutputs (cloning the Arcs, so stop still holds its own) and calls the new run. If
  main.rs still calls server::run itself, change that call too. Update the callers of application() in server/tests.rs
  to pass StartupOutputs built from in-memory values.

  Shutdown state and the health slot. ServerState (crates/betterlite-server/src/state.rs) holds `shutdown:
  Arc<ShutdownState>`, B4448's value from StartupOutputs (B8613 made it; B8374's teardown calls start_shutdown and
  wait_for_drain on it), in place of the Arc<AtomicBool> application() takes today. run keeps its local accept-loop flag
  and its signal task; when the signal fires it also calls start_shutdown on that ShutdownState, so the health routes
  answer 503 from SIGTERM on as they do today. state.rs also declares `pub mod health;` and gives ServerState `health:
  health::HealthSlot`, built with `HealthSlot::new(&config, &shared)` like every B1100 slot. This task writes
  state/health.rs with an empty HealthSlot and that constructor, since Shared comes from this task. B8540 fills it. The in-flight
  layer B022 installs counts with `startup.in_flight`, the source ShutdownState reads, never a fresh one.

  The health area. B003's three handlers (GET /health/liveliness, /health/liveness and /health/readiness) move out of
  routes.rs into the app/health.rs stub's mount_public, with the same bodies (liveliness and liveness 200 "I'm alive!",
  readiness 200 {"status": "healthy"}, all three 503 {"status": "shutting_down"} once shutdown started), now reading
  `state.shutdown.is_shutting_down()`. They keep answering
  without a key until B8540 replaces the stub, and routes.rs registers none of them, so no health path is registered
  twice.


  Area aggregator. crates/betterlite-server/src/app.rs declares `pub mod <area>;` (pub, not pub(crate), so a part whose
  ports nothing calls yet passes its own dead_code lint) for mcp, inference, pass_through, agents, cache_secrets,
  callbacks, spend, guardrails, management, admin, health and edge, in that order. The skeleton leaves each app/<area>.rs empty, since ServerState comes from B1100, and this task stubs each with
  `mount(router, state)`, `mount_public(router, state)` and `async fn start(state)`, all returning at once or the router
  unchanged, and app/edge.rs also with `wrap(router, state)`. app.rs has four functions, each calling every area once
  in that order: `pub fn mount(router: Router, state: &Arc<ServerState>) -> Router` (routes that need a key),
  `pub fn mount_public(router: Router, state: &Arc<ServerState>) -> Router` (routes LiteLLM serves with no key check),
  `pub fn wrap(router: Router, state: &Arc<ServerState>) -> Router`, which calls only edge::wrap, and `pub async fn
  start(state: &Arc<ServerState>)`.

  routes.rs router() changes in three places. It calls app::mount after it merges chat, embeddings and B1100's route
  modules and before the two auth layers, so area routes pass the same auth stages as every other route. After the auth
  layers it merges app::mount_public, so public routes skip them. Then it calls app::wrap last, so edge's outer layers
  (CORS preflight, the outer 500 handler of B789 and B8591) sit outside everything. Fallback: axum keeps one fallback,
  and Router::merge panics when both routers carry one. routes.rs keeps setting its Not Found fallback before app::mount,
  the pass-through area's mount replaces it with B8643's configured_fallback (same 404 body when nothing matches), and
  nothing after app::mount sets a fallback: mount_public and wrap must merge only routers without one.


  WebSocket auth. LiteLLM's WebSocket routes authenticate with user_api_key_auth_websocket (user_api_key_auth.py L644,
  B052), which also reads the key from the WebSocket subprotocol, so the global HTTP master key stage must not reject
  their upgrade first. In routes.rs, the auth_route_patterns stage layer is replaced by `http_auth_stage`, which calls
  `next` directly when the request is a GET whose `upgrade` header equals "websocket" (ASCII case-insensitive) and whose
  path is one LiteLLM serves as a WebSocket: /v1/realtime, /realtime, /openai/v1/realtime, /v1/responses, /responses,
  /vertex_ai/live, /deepgram/v1/listen, /deepgram/listen, or a path under /openai/ or /openai_passthrough/. Every other
  request goes through auth_route_patterns::stage unchanged, and the route_match stage still runs for all.

  Reusable key auth. Some public routers key only some of their paths (B4720's CatalogViews keys every path but
  /v1/mcp/registry.json; B7321's OauthRoot keys only /introspect). So routes.rs exposes `pub fn with_key_auth(router:
  Router, state: &Arc<ServerState>) -> Router`, which applies exactly the auth layers router() applies to keyed routes
  (http_auth_stage with B052's key auth, then the route_match stage), and router() itself uses it for those layers. An
  area builds the keyed part of a public router, passes it through with_key_auth, merges the unkeyed part, and returns
  the result from mount_public.


  Tests in state/shared/tests.rs (names start with `shared_`) build Shared from StartupOutputs with in-memory values and
  assert that http is the chat client clone, cache uses the usage Redis when one is given and memory only when not,
  router_views reads the same RouterHandle (installing a router makes current() answer), agents and
  general_settings use the given registry and database, budget is built once (two reads give the same Arc), and
  spend_producer is the slot passed in StartupOutputs and starts empty. Tests
  in server/tests.rs (names start with `inputs_`) boot application() and assert the health routes and the Not Found
  fallback still answer, start_shutdown on the ShutdownState passed in StartupOutputs turns the three health routes to
  503 shutting_down, app::start ran before the first request, a route merged through mount_public answers without a key while one merged through mount answers 401, and
  for WebSocket: an upgrade GET on /v1/realtime without a key reaches a test handler at that path, the same GET without
  the upgrade header gets 401, and an upgrade GET on /key/info without a key gets 401; a router passed through with_key_auth and merged through mount_public answers 401 without a key on its keyed path and 200 on its unkeyed one. Every existing server, routes and
  lifespan test stays green. No new oracle case: the area parts add cases for the routes they mount, and the realtime
  route task adds the WebSocket ones.
