dod:
  - text: Shared carries every listed field under its fixed name, pass_through, an empty mcp_area and an empty spend_producer slot included, built once in application() from StartupOutputs plus the derived http, cache, router_views, agents, general_settings, mcp_area and budget, and a failing budget build stops run before it binds.
    proof: [shared-tests]
  - text: server::run takes ServerInputs, awaits app::start before it listens, drains the chat client at shutdown, the lifespan hands over its values without building a second copy, and the health routes and fallback still answer.
    proof: [inputs-tests, server-regression]
  - text: app.rs declares every area as pub mod and calls each area's mount, mount_public and start once, and edge's wrap once; router() calls app::mount inside the auth layers, app::mount_public outside them and app::wrap last, and sets no fallback after app::mount.
    proof: [app-mount, inputs-tests]
  - text: ServerState holds the ShutdownState from StartupOutputs and the HealthSlot, the signal calls start_shutdown while the accept loop still stops only on the signal, and the three health routes answer from app::health mount_public, read ShutdownState and are not registered in routes.rs.
    proof: [inputs-tests, app-mount]
  - text: A WebSocket upgrade GET on a LiteLLM WebSocket path skips the HTTP master key stage, any other request, an upgrade on another path included, still needs a key, and with_key_auth gives a public router the same key check on the paths an area chooses.
    proof: [inputs-tests]
checks:
  optional: []
  commands:
    - id: shared-tests
      why: a Shared field is missing, built twice or derived from the wrong value
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^state::shared::/)'
    - id: inputs-tests
      why: the server ignores its startup inputs, skips app::start, puts a public route behind auth or a keyed route outside it, or lets an upgrade header skip auth on a path that is not a WebSocket route
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::tests::inputs_/)'
    - id: app-mount
      why: an area is not declared or not called exactly once in one of the aggregator functions, or router() calls an aggregator twice
      run: |-
        for call in 'app::mount(' 'app::mount_public(' 'app::wrap('; do
          test "$(grep -cF "$call" crates/betterlite-server/src/routes.rs)" = 1 || { echo "routes.rs must call $call once"; exit 1; }
        done
        test "$(grep -cF 'edge::wrap(' crates/betterlite-server/src/app.rs)" = 1 || exit 1
        if grep -qF '.route("/health/' crates/betterlite-server/src/routes.rs; then echo "routes.rs still registers a health route"; exit 1; fi
        for area in mcp inference pass_through agents cache_secrets callbacks spend guardrails management admin health edge; do
          grep -qE "^pub mod $area;" crates/betterlite-server/src/app.rs || { echo "area $area is not declared pub"; exit 1; }
          for f in mount mount_public start; do
            test "$(grep -cF "$area::$f(" crates/betterlite-server/src/app.rs)" = 1 || { echo "area $area $f is not called once"; exit 1; }
          done
        done
    - id: server-regression
      why: the wider inputs broke the existing server, route or lifespan tests
      run: grep -q 'pub struct StartupOutputs' crates/betterlite-server/src/server/inputs.rs && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::/) | test(/^routes::/)' && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^lifespan::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The router, router views, shared port and registry types: B8611, B8612 and B8614. The values made during startup: B8613."
  - "Each area's mount, mount_public, start and edge's wrap: the area wiring parts, in app/<area>.rs and app/<area>/**."
  - "The route and state registry, ServerState and the stub modules: B1100. user_api_key_auth_websocket: B052."
  - "HealthSlot's contents and the five health routers: B8540. ShutdownState and its drain: B4448. The in-flight counter and the admission layer: B022."
  - "A router embedder field: not in Shared; the router's embedding call is built by the inference part from ServerState (see the report notes)."
pitfalls:
  - axum applies a layer only to routes added before it, so an area route merged after the auth layers would skip authentication, and a public route merged before them would need a key.
  - Router::merge panics when both routers have a fallback, so a mount_public router or the wrap step that sets one crashes the server at boot.
  - The WebSocket pass must check both the upgrade header and the path; an upgrade header alone would let any GET skip the master key stage.
  - The usage Redis in Shared must be the client B8613 attached to the router, not a fresh one built from REDIS_*, or rate limits and router cooldowns count in different places.
  - The http field is the chat client's clone because run drains that client on shutdown and other tasks spawn on its tracker; a second ProxiedClient would leave its requests undrained.
  - The accept loop must keep stopping on the signal only. B4448's /health/drain also calls start_shutdown, and a loop that stopped on ShutdownState would refuse new connections after a preStop drain.
  - ShutdownState counts in-flight requests through B022's source, so the in-flight layer in routes.rs must count with that same source; a second one leaves wait_for_drain at zero and the drain returns at once.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
