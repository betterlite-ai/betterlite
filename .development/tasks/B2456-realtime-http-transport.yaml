  - crates/betterlite-provider/fuzz/fuzz_targets/realtime_sdp.rs
  - crates/betterlite-provider/fuzz/corpus/realtime_sdp/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/realtime_http_transport.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/realtime_http_transport.py
  - tools/oracle/cases/sdk-http/realtime-http-transport/**
  - tools/oracle/fuzz/corpus/sdk_http_case/realtime-http-transport-*
  - tools/oracle/helpers/b2456.py
  - tools/oracle/helpers/b2456/**
  - tools/oracle/src/helpers/provider/b2456.rs
  - tools/oracle/src/helpers/provider/b2456/**
