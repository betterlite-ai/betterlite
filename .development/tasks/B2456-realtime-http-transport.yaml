id: B2456
title: Realtime HTTP session and SDP transport
description: >-
  Own async_realtime_client_secret_handler,async_realtime_transcription_session_handler,
  _async_realtime_session_post and async_realtime_calls_handler, whole methods at
  llm_http_handler.py:6297-6511, in betterlite-provider::api::realtime_http_transport.
  B1004 supplies the HTTP config interface, B173 the async client and B2402 send-error mapping.
  An AsyncHTTPHandler supplied by the caller is reused; absent or sync clients select the pooled
  OPENAI client even for another provider. Return the raw response without parsing or encrypting it.

  Session POSTs choose the config's endpoint URL and validated headers, or append /v1/realtime/
  plus client_secrets/transcription_sessions to rstrip(api_base). Fallback headers are Authorization
  Bearer key and Content-Type application/json. extra_headers is applied last and may replace auth.
  Calls use the ephemeral key, multipart sdp/text/plain and session/application/json, with no filenames.
  Supply default session.type=realtime and model only when absent, preserving explicit null values.
  Logging uses api_key="" and the complete request/session and URL with B012's header redaction.

  decode_realtime_sdp(bytes,limits) validates UTF-8 before send and is fuzzed/replayed in this crate;
  B1087 supplies the body cap. There is no SDP grammar parser. Add sdk_http.realtime_http_transport
  through B2401, capturing actual JSON and multipart requests. Count196 nonblank/non-comment lines;
  budget 155 transport,120 tests,115 fixtures,90 adapters,55 fuzz/replay and 25 wiring =560 lines.
scope:
  paths:
  - crates/betterlite-provider/src/api.rs
  - crates/betterlite-provider/src/api/**
  - crates/betterlite-provider/src/api/realtime_http_transport.rs
  - crates/betterlite-provider/src/api/realtime_http_transport/**
