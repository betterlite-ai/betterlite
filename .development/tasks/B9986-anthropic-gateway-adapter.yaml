id: B9986
title: Anthropic chat through the gateway adapter
description: >-
  Wire Anthropic chat into the gateway's provider path. Today impl Adapter for Anthropic in
  crates/betterlite-provider/src/anthropic_dispatch.rs holds only NAME, so a proxy POST /v1/chat/completions on an
  anthropic/ deployment answers OperationError::UnavailableAdapter. This task fills prepare, execute and decode for
  buffered and streaming chat. It calls what B027 and B584 built: anthropic_dispatch::completion::complete with the
  anthropic_dispatch::native::Native handler, and that handler runs B584's chat_call. Never reimplement a request transform, a
  send path, a response transform or a stream decoder that already exists; call it.


  Order. B9984 makes the B027 and B584 futures Send, so execute can return them. B9988 changes answer_chat and
  provider_chat in crates/betterlite-server/src/server/chat_setup/provider_call.rs to return the decoded
  OperationResult with the upstream headers and time, provider_stream in
  crates/betterlite-server/src/routes/completions/streaming.rs to return (OperationResult, HeaderMap), and ChatCalls
  in crates/betterlite-server/src/routes/chat/streaming.rs to a struct of executor and counter built by
  ChatCalls::new(config, executor). ChatCalls::new loads the bundled catalog with BundledCatalog::default().get(). This task
  builds on those shapes.


  Surface. Anthropic becomes pub struct Anthropic { pub surface: Surface }, with Surface from
  anthropic_dispatch::base, deriving Debug, Clone, Copy, PartialEq and Eq. Drop Default: nothing calls
  Anthropic::default(). Provider::from_slug in crates/betterlite-provider/src/provider.rs maps anthropic to
  Surface::Messages and anthropic_text to Surface::Legacy. A Legacy adapter answers OperationError::UnavailableAdapter
  from prepare, as both slugs do today.


  Runtime. Add the module crates/betterlite-provider/src/anthropic_dispatch/gateway.rs, declared by pub mod gateway;
  in anthropic_dispatch.rs, with its children under gateway/. gateway/runtime.rs holds two structs. pub struct
  AnthropicBases { pub globals: Globals, pub environment: Environment, pub disable_suffix: bool } has pub fn
  new(config: &Config) -> Self: globals.api_base and globals.api_key come from config.sections.resource_sdk_settings
  (litellm_settings.api_base and api_key) and globals.anthropic_key is None; environment.api_base is
  Some(config.sections.anthropic_credentials.api_base), and that section already reads it from
  ANTHROPIC_API_BASE, then ANTHROPIC_BASE_URL, then the default; environment.base_url is None; environment.api_key is that section's
  api_key; disable_suffix is its disable_url_suffix. pub struct AnthropicRuntime is built once by pub fn new(config:
  &Config, client: &ProxiedClient, catalog: Arc<ModelCatalog>) -> Result<Self, RuntimeError> and owns every value
  the Native handler borrows. native/tests/support/fixture.rs and execution.rs list them; take each from its
  production source. The bases are an AnthropicBases. AnthropicSettings takes api_key, auth_token, api_base and
  use_bearer_for_custom_base from config.sections.anthropic_credentials and the version AnthropicSettings::default()
  sets. The beta matrix comes from betterlite_core::api::anthropic_beta_config::BetaConfigLoader::new(client.clone(),
  config.sections.anthropic_beta_config.clone(), ApiLimits::default()), and execute awaits its matrix(). The loader caches
  the matrix after the first load. ModelCatalog is the shared Arc. ModelCostMap::parse and RawCatalog (serde_json::from_slice)
  read the bytes of (BundledCatalog::default().asset)() once. CandidatePatterns::new(),
  CatalogGeneralizations::default(), betterlite_models::fireworks_catalog_metadata::Catalog::new(), NoDynamicMetadata
  and HfConfigClient { client: NoHfConfig, base_url: HF_CONFIG_BASE_URL } fill the capability environment, with a
  ResolutionContext built the way chat_setup.rs builds the one it passes to chat_deployments. The encoding is the
  bundled cl100k TiktokenEngine the fixture loads. Media goes through B5083's
  betterlite_prompts::media_fetch::fetcher::Fetcher::new(client.clone(), UserUrlFetcher { validator:
  UrlValidator::new(SystemResolver, &config.sections.user_url_policy.user_url_allowed_hosts, &Verification::Enabled),
  validation: config.sections.user_url_policy.user_url_validation }, config.sections.image_url_download
  .max_download_size_mb, a wall clock), never a refusing fetcher. OptionDefaults and max_tokens come from
  config.sections.anthropic_option_primitives (litellm_settings and default_chat_max_tokens), and the legacy
  OptionValues from config.sections.anthropic_completion.litellm_settings. The runtime owns the Redactor the logging builder
  needs, Redactor::new(MINIMUM_CUSTOM_KEY_LENGTH). The legacy PromptFactory uses
  Hub::Unreachable with a one-line comment that the Messages surface never reads it. A value no config section reads
  at the pin takes LiteLLM's module default, with a one-line comment naming it. Implement Debug for AnthropicRuntime by
  hand with debug_struct("AnthropicRuntime").finish_non_exhaustive(), since Deployment derives Debug.


  The deployment's own credentials, in betterlite-server. ChatDeployment::resolve_with fills a missing api_base and
  api_key from the OpenAI chain, so today an anthropic/ deployment without its own key would send OPENAI_API_KEY to
  Anthropic. Add the child module crates/betterlite-server/src/server/chat_setup/anthropic_defaults.rs, declared by
  mod anthropic_defaults; in chat_setup.rs, with pub(super) fn apply_anthropic_defaults(resolved: &mut
  ChatDeployment, deployment: &ModelDeployment, bases: &AnthropicBases, surface: Surface) -> Result<(),
  ChatSetupError>. chat_deployments builds AnthropicBases::new(config) once and calls it for Ok(Provider::Anthropic(
  adapter)), next to the aiohttp branch, with adapter.surface. It sets resolved.api_key to
  deployment.litellm_params.api_key only, resolved.api_base to resolve_base(surface,
  deployment.litellm_params.api_base.as_deref(), &bases.globals, &bases.environment, bases.disable_suffix).url,
  resolved.endpoint to that URL parsed (a new ChatSetupError::AnthropicBase { model_name, source } on failure) and
  resolved.organization to None. resolve_base keeps a URL that already ends in the suffix, so complete() resolving it
  again gives the same URL.


  The runtime reaches the adapter through the deployment. Add pub anthropic: Option<Arc<AnthropicRuntime>> to
  Deployment in crates/betterlite-provider/src/prepared/deployment.rs: from_chat and from_params set None, and so does
  every Deployment literal in the test files in scope. answer_chat, provider_chat and provider_stream take a new last
  argument anthropic: Option<&Arc<AnthropicRuntime>> and set inputs.anthropic = anthropic.cloned() before prepare.
  ChatCalls gains anthropic: Arc<AnthropicRuntime>; ChatCalls::new builds it with AnthropicRuntime::new(config,
  &executor.client, Arc::clone(&catalog)) from the catalog it already loads for runtime_counter, and its error becomes
  a ChatCallsError enum with the counter's CountError and the runtime's RuntimeError, and server.rs maps it into one
  ServerError variant. ChatCall::complete and ChatCall::stream pass Some(&self.anthropic). The completions bridge in
  routes/completions.rs passes None, so an Anthropic deployment reached through /v1/completions keeps answering
  UnavailableAdapter.


  prepare. For Surface::Messages, RequestKind::Chat(chat) gives PreparedRequest::Anthropic(AnthropicPrepared { chat:
  Box<ChatOperation>, stream: false }) and RequestKind::Stream(chat) the same with stream: true. Any other kind answers
  OperationError::UnsupportedOperation { provider: anthropic, operation }. AnthropicPrepared derives only Debug and
  Clone, since PreparedRequest derives those two. With deployment.anthropic None, prepare answers UnavailableAdapter.


  execute, in gateway/call.rs. It takes the runtime from deployment.anthropic and builds the call LiteLLM's
  _complete_anthropic builds. The borrowing structs (ResolutionContext, CapabilityEnvironment, CatalogSources,
  PromptDeps, Preparation, Runtime and Native) are built inside execute from &runtime, once per call. Split the request with the logic chat_fields in
  crates/betterlite-provider/src/prepared/body.rs already runs: move its request_fields, messages, REMOVED_KEYS and
  KNOWN_PARAMS partition into one pub(crate) function there that both chat_fields and the Anthropic path call. The
  known params, without messages and extra_headers, are the non_default_params for B576's
  betterlite_anthropic::params::map_openai_params with a ParamsRequest for deployment.model and provider anthropic, budgets
  &config.sections.anthropic_capability_catalog kept on the runtime and default_max_tokens the runtime's max_tokens;
  the forwarded params then go into optional_params at the top level, skipping nulls, as
  add_provider_specific_params_to_optional_params does for a non-OpenAI provider. extra_headers string values become
  CompletionCall.headers. The CompletionCall carries deployment.model, provider anthropic, the messages,
  ResponseEnvelope::new with a chatcmpl- id from a new UUID, the optional params, api_key deployment.api_key, api_base
  Some(deployment.api_base), stream from AnthropicPrepared, acompletion true, client None, the runtime's encoding and
  deployment.timeout. CompletionSettings borrows the runtime's bases with selection None, and selected_config turns that
  into ChatConfigTag::Anthropic. The Native handler borrows the runtime with pooled set to execute's client and now
  set to Utc::now(). gateway/logging.rs holds the production sinks: a LogSink that writes each LogRecord with
  tracing::debug!, as TracingCompletionLog does for the text bridge, and a StreamLogger whose post_call does the same.
  The per-call LoggingState and PrePostEnv come from one pub(crate) builder there that takes the sink, the model and a
  call id; fixtures/runtime.rs::logging calls it with its Discard sink and its fixed values instead of keeping its
  own copy. completion::complete(Surface::Messages, call, &settings, &mut handler, &mut log) runs the call.
  Reply::Messages(outcome) becomes Upstream::Anthropic(Box<AnthropicUpstream>), a new variant in
  crates/betterlite-provider/src/prepared.rs. AnthropicUpstream { pub headers: HeaderMap, pub outcome:
  ChatOutcome<StreamFailure, Counter> } lives in gateway.rs; headers holds the projected provider headers B584 already
  built: additional_headers from the envelope's hidden params on a reply, response_headers on a stream.
  Upstream::headers() returns them. ChatOutcome::Embedding and Reply::Legacy answer UnsupportedOperation.


  decode. ChatOutcome::Reply(envelope) becomes OperationResult::Anthropic(AnthropicResult::Reply(Box<AnthropicReply>)).
  AnthropicReply in gateway/reply.rs is the client view of ResponseEnvelope: id, object, created, model,
  system_fingerprint, choices and usage, without _hidden_params, since LiteLLM never sends those to the client. model is the
  client's requested model name when the ChatRequest has one, as ChatResponse::for_client does. ChatOutcome::Stream
  becomes OperationResult::Anthropic(AnthropicResult::Stream(frames)), frames being a BoxStream<'static,
  Result<Vec<u8>, HttpError>> built in gateway/frames.rs. AnthropicResult turns from the B010 unit struct into this
  two-variant enum with no derives; OperationResult derives nothing.


  Stream frames. LiteLLM wraps the Anthropic stream in CustomStreamWrapper with custom_llm_provider anthropic.
  betterlite-streaming already holds the shared chunk_creator, and crates/betterlite-openai/src/text_completion_transport/stream.rs
  holds the only wrapper loop around it. Move that loop's provider-neutral part into the new module
  crates/betterlite-streaming/src/provider_chunk_decode/wrapper.rs, declared by pub mod wrapper; in
  provider_chunk_decode.rs: pub struct StreamWrapper { pub shaper: ChunkShaper, pub decode: DecodeState, pub
  has_stream_options: bool, pub sent_stream_usage: bool }, pub fn new(provider: &str, setup: StreamSetup) -> Self
  with the ChunkShaper and DecodeState completion_stream builds today, pub fn push(&mut self, chunk: &ProviderChunk)
  -> Result<Option<StreamChunk>, WrapperError> (today's chunk_creator call, record and attach_usage) and pub fn
  finish(&mut self) -> Option<Result<StreamChunk, WrapperError>> (today's finalize). StreamSetup moves into wrapper.rs
  with its fields unchanged, and text_completion_transport/stream.rs replaces its own definition with pub use of the
  moved one, so text_completion_transport.rs keeps building StreamSetup and calling completion_stream(bytes, setup)
  untouched. WrapperError has Chunk(ProviderChunkError) and Usage(serde_json::Error), and
  the text path maps them to its ErrorSource::Chunk and ErrorSource::Serialize. text_completion_transport/stream.rs
  keeps its SSE reading and calls StreamWrapper with provider text-completion-openai. frames.rs builds a
  StreamWrapper with provider anthropic, the request's stream_options and model, and reads the WrappedStream's
  completion_stream: DecodedChunk::Event becomes ProviderChunk::Json of the serialized event and DecodedChunk::Generic
  becomes ProviderChunk::Generic. Each shaped StreamChunk goes through
  betterlite_openai::text_completion_stream::chat_chunk(chunk, model, include_usage), the projection the server's
  TextSource already uses. Its chat_choice writes only role and content today, so it also writes the delta's tool_calls
  when present, each with only index, id, type and function, since the relay's ToolCall denies unknown fields; the text path never fills them, so its output does not change. The chunk is
  written as a data: frame with a blank line after it. After the source ends, finish
  gives the closing chunks. A failed read or shaping step logs with tracing::warn! and ends the stream with
  HttpError::Timeout, as TextSource does. The server's relay_bytes then adds data: [DONE] as for any upstream stream.


  Errors, in gateway/error.rs. DispatchError::Completion(Failure::Chat(error)) whose ChatCallError carries an
  Anthropic status, message and headers becomes OperationError::Provider with an UpstreamResponse of that status,
  those headers and the message as body, so the server renders it as it renders any provider error. A transport
  timeout becomes OperationError::Timeout and a missing key OperationError::MissingApiKey. Every other failure becomes
  a new OperationError::Anthropic { #[source] source: Box<AnthropicCallError> } in
  crates/betterlite-provider/src/operation.rs; chat_error in provider_call.rs and its twin in
  provider_call/embedding.rs send it to CallError::Operation, next to TransformRetry.


  The server arms. ChatCall::complete in routes/chat/streaming.rs serializes
  OperationResult::Anthropic(AnthropicResult::Reply(reply)) with serde_json::to_vec as it does a ChatCompletion.
  ChatCall::stream turns OperationResult::Anthropic(AnthropicResult::Stream(frames)) into ChatStreamAnswer { body:
  frames, upstream_headers: the returned headers, upstream_time }. Any other Anthropic shape answers
  ChatFailure::Mismatched.


  The other Upstream matches. openai_dispatch.rs and aiohttp_openai_dispatch.rs add Upstream::Anthropic(_) to their
  unsupported arms. anthropic_dispatch/native/legacy.rs gets an arm for it that answers
  Failure::Http(OperationError::UnsupportedOperation), since the legacy send never yields it.


  Media and file blocks. Move RemoteFileBlocks and FileBlockError out of
  crates/betterlite-provider/src/snowflake/messages/files.rs into the new module
  crates/betterlite-prompts/src/anthropic_invokes/file_blocks.rs, declared by pub mod file_blocks; in
  anthropic_invokes.rs, next to process_openai_file_message: pub struct RemoteFileBlocks<'call, Source> { pub
  fetcher: &'call Source } bound on RemoteMediaFetcher + Sync, the bound snowflake's Fetcher already stands for.
  snowflake imports it from there, and the Anthropic PromptDeps uses it with the B5083 Fetcher.


  Oracle. tools/oracle/cases/chat/anthropic_provider-dispatch-http.yaml copies the shape of
  openai_provider-dispatch-http.yaml: model anthropic/claude-3-haiku-20240307 with api_base "{{upstream}}" and api_key
  oracle-key, a POST /v1/chat/completions with temperature and max_tokens, and an upstream that answers Anthropic
  Messages JSON with request-id and anthropic-ratelimit-requests-limit headers. It compares upstream_headers
  [x-api-key, anthropic-version, content-type] and ignores /id and /created, since LiteLLM generates both.


  Tests. Extend the rstest anthropic_dispatch_cases in crates/betterlite-provider/src/anthropic_dispatch/tests.rs with
  a Family enum the way openai_dispatch/tests.rs does: Family::Helper keeps the ten helper-case files, and
  Family::Gateway drives Anthropic prepare, execute and decode against a loopback upstream from the new child module
  anthropic_dispatch/tests/gateway.rs. Add the named cases anthropic_provider_dispatch_http (a buffered reply, the
  request's x-api-key and anthropic-version, the client view without _hidden_params),
  anthropic_provider_dispatch_stream (frames that relay_bytes parses, a tool_use block arriving as delta
  tool_calls, a closing finish_reason chunk) and
  anthropic_provider_dispatch_error (a 400 from the upstream becomes OperationError::Provider with that status). The
  loopback is native/tests/support/wire.rs::server; widen it and the modules above it to pub(crate) instead of writing
  a second one. In crates/betterlite-provider/src/provider/tests.rs the case anthropic becomes anthropic_text, built
  with Surface::Legacy and still asserting the refusal. Write rstest function stream_wrapper_cases in
  crates/betterlite-streaming/src/provider_chunk_decode/wrapper/tests.rs with named cases closing_finish_reason,
  usage_chunk_when_asked and silent_usage_chunk_dropped. Write rstest function anthropic_route_cases in the new child
  module crates/betterlite-server/src/routes/chat/tests/anthropic.rs, declared by mod anthropic; in
  routes/chat/tests.rs, with named cases buffered_reply, stream_frames, upstream_error and own_key_only (a deployment
  without api_key sends no OPENAI_API_KEY value upstream), booting chat_routes_with_call_id against a loopback
  upstream the way the tests beside it do. Test configs set LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS so the beta matrix
  never leaves the machine.
