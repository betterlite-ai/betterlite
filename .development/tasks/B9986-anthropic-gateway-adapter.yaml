dod:
- text: >-
    anthropic buffered: a proxy chat call on an anthropic/ deployment gets the Anthropic reply as LiteLLM's client
    view, through Anthropic prepare, execute and decode, B027's complete() and the Native handler, and matches
    tools/oracle/cases/chat/anthropic_provider-dispatch-http.yaml.
  proof:
  - adapter-buffered
  - route-cases
  - oracle
- text: >-
    anthropic stream: a streaming proxy chat call gets data frames shaped by the shared StreamWrapper from the
    WrappedStream, a closing finish_reason chunk and data [DONE].
  proof:
  - adapter-stream
  - route-cases
- text: >-
    anthropic upstream error: a non-2xx Anthropic answer reaches the client with its status as a provider error,
    the way the OpenAI path renders one.
  proof:
  - adapter-error
  - route-cases
- text: >-
    anthropic own key: an Anthropic deployment sends only its own api_key, litellm_settings.api_key or
    ANTHROPIC_API_KEY, never a key from the OpenAI chain, and its base resolves through B027's resolve_base.
  proof:
  - route-cases
- text: >-
    anthropic_text stays refused: an anthropic_text deployment still answers UnavailableAdapter.
  proof:
  - adapter-surface
- text: >-
    shared wrapper: the CustomStreamWrapper loop lives once in betterlite-streaming's StreamWrapper, and the text
    completion stream and the Anthropic frames both call it.
  proof:
  - stream-wrapper
- text: >-
    nothing regresses: the provider, prompts and server modules this task changes keep passing.
  proof:
  - provider-regressions
  - server-regressions
checks:
  optional:
  - mutants
  commands:
  - id: adapter-buffered
    why: Anthropic prepare, execute and decode do not turn a buffered loopback reply into the client view.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_http$/)'
  - id: adapter-stream
    why: Anthropic execute and decode do not turn a loopback event stream into relayable data frames.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_stream$/)'
  - id: adapter-error
    why: An Anthropic 400 does not become OperationError::Provider with that status.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_error$/)'
  - id: adapter-surface
    why: The anthropic_text adapter no longer refuses, or the anthropic case was not split by surface.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::provider_framework_tests_behavior::case_[0-9]+_anthropic_text$/)'
  - id: stream-wrapper
    why: StreamWrapper does not send the closing chunk or the usage chunk, or the text completion stream broke when
      it moved to the shared wrapper.
    run: cargo nextest run --locked -p betterlite-streaming --no-tests=fail -E 'test(/::stream_wrapper_cases::/)' && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^text_completion_transport::/) | test(/^text_completion_stream::/)'
  - id: route-cases
    why: The booted chat routes do not answer the Anthropic reply, the frames or the provider error, or a deployment
      without its own key sends an OpenAI key upstream.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::anthropic_route_cases::/)'
  - id: provider-regressions
    why: The Upstream variant, the Deployment field, the body split or the file block move broke a provider or
      prompts test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_http$/)' && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^anthropic_dispatch::/) | test(/^provider::tests::/) | test(/^operation::/) | test(/^snowflake::/) | test(/^aiohttp_openai_dispatch::/) | test(/^embedding_rerank_providers::/) | test(/::openai_dispatch_cases::/)' && cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^anthropic_invokes::/)'
  - id: server-regressions
    why: The new arguments, the ChatCalls field or the credential reset broke a chat setup, chat route or completions
      test.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::anthropic_route_cases::case_[0-9]+_buffered_reply$/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::/) | test(/^routes::chat::/) | test(/^routes::completions::/)'
oracle_cases:
- tools/oracle/cases/chat/anthropic_provider-dispatch-http.yaml
deviations:
- what: >-
    An OpenAI param the Anthropic config does not support is dropped on an Anthropic deployment, where LiteLLM raises
    UnsupportedParamsError unless drop_params is set.
  why: >-
    B175's get_optional_params port answers Absent capabilities for Anthropic and keeps its unsupported check
    private, and copying that check here is not allowed. map_openai_params drops what it does not map. The check
    moves here once B175's mapper accepts provider capabilities.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4509-L4537
- what: >-
    Stream deltas carry role, content and tool calls only; reasoning_content and thinking_blocks from an Anthropic
    thinking stream do not reach the client.
  why: >-
    The gateway relay parses each frame into betterlite_openai::stream::chunk::Chunk, whose Delta rejects other
    fields, and chat_chunk projects to that shape; this task teaches chat_chunk the tool calls only. Widening the
    relay's Chunk is its own change.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L9830-L10081
- what: >-
    A remote file_data URL inside a chat message on an Anthropic deployment fails the call, where LiteLLM fetches it.
  why: >-
    The FileBlocks seam is synchronous and RemoteFileBlocks fails a fetch it would have to wait for. Inline base64
    file data works as in LiteLLM.
  link: null
out_of_scope:
- >-
  The anthropic_text surface on the gateway (Surface::Legacy, _complete_anthropic_text). The Native handler already
  serves it; wiring its decode and stream is a separate change, and its adapter keeps answering UnavailableAdapter.
- >-
  Anthropic chat through the /v1/completions bridge in routes/completions.rs. It passes None for the runtime and its
  bridge reads only ChatCompletion::OpenAi.
- >-
  The /v1/messages route, count tokens, batches and files through the gateway. B027's dispatch() serves them as
  helpers; their routes belong to their own tasks.
- >-
  The output-limit recovery and the 422 retry are B9988. This task adds its arms next to B9988's and changes none of
  them.
- >-
  The rest of LiteLLM's CustomStreamWrapper (logging callbacks, the stream cache, hooks, rules) is not ported here.
  StreamWrapper carries only the shaping loop the text stream already ran.
- >-
  Shared transport pooling, timeout, TLS and proxy settings are B173; build no second outbound client.
pitfalls:
- >-
  Dispatched runs cannot compile, so follow the type names in the description and check each trait bound against
  the code: native::Native's CompletionHandler impl needs Client: ChatTransport + legacy::Transport, Fetcher:
  RemoteMediaFetcher + Sync, Blocks: FileBlocks + Sync and Ids: Fn() -> String + Sync.
- >-
  map_openai_params takes IndexMap<String, betterlite_models::decisions::Json> while prepared/body.rs works in
  betterlite_models::controls::json_value::JsonValue; convert through serde_json once at that seam, not per field.
- >-
  The projected provider headers already carry the llm_provider- prefix and the x-ratelimit- aliases from
  RATE_LIMIT_ALIASES. The server's provider_prefixed_name keeps names that contain llm_provider, so do not strip
  the prefix before handing them over.
- >-
  B9984 replaces LocalBoxFuture with Send futures in anthropic_dispatch and chat_call and bans LocalBoxFuture and
  LocalBoxStream in clippy.toml, so frames.rs builds a futures_util BoxStream, never a local one.
- >-
  BetaConfigLoader fetches the remote beta matrix unless LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS is set. Tests set it,
  and the oracle case leaves it unset on both sides as LiteLLM does.
- >-
  File sizes. Every file stays at or under 300 lines. crates/betterlite-server/src/routes/chat/streaming.rs is 295
  today; if its new arms do not fit, move streamed_result and answered_result into streaming/relay.rs (113 lines)
  rather than growing it. chat_setup.rs is 270, so apply_anthropic_defaults lives in
  chat_setup/anthropic_defaults.rs.
- >-
  The rstest anthropic_dispatch_cases keeps its ten helper cases under their current names; only the Family wrapper
  and the three gateway cases are new, so the helper replays still match their YAML files.
- >-
  Deployment literals in operation/tests.rs, provider/tests/openai.rs, aiohttp_openai_dispatch/tests.rs and
  embedding_rerank_providers/tests.rs gain anthropic None; every caller of answer_chat, provider_chat and
  provider_stream in the server tests passes None unless it tests Anthropic.
- >-
  docs/deviations/B9986.yaml holds the three deviations above with their links.
budget:
  max_changed_lines: 2000
  max_new_expects: 0
review_level: security
