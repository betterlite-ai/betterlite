out_of_scope:
- >-
  The proxy routes are B9990: the deployment's own credentials, the runtime on ChatCalls, the route arms for
  AnthropicResult, the route tests and the HTTP oracle case.
- >-
  The anthropic_text surface on the gateway (Surface::Legacy, _complete_anthropic_text). The Native handler already
  serves it; its adapter keeps answering UnavailableAdapter.
- >-
  The /v1/messages route, count tokens, batches and files through the gateway. B027's dispatch() serves them as
  helpers; their routes belong to their own tasks.
- >-
  The rest of LiteLLM's CustomStreamWrapper (logging callbacks, the stream cache, hooks, rules) is not ported here.
  StreamWrapper carries only the shaping loop.
- >-
  Shared transport pooling, timeout, TLS and proxy settings are B173; build no second outbound client.
- >-
  A deployment's own litellm_params.drop_params and additional_drop_params are B9992; here only the request's
  values and the proxy-wide flag count.
pitfalls:
- >-
  Dispatched runs cannot compile, so follow the type names in the description and check each trait bound against
  the code: native::Native's CompletionHandler impl needs Client: ChatTransport + legacy::Transport, Fetcher:
  RemoteMediaFetcher + Sync, Blocks: FileBlocks + Sync and Ids: Fn() -> String + Sync. ChatTransport extends
  StreamTransport, so ProxiedClient's failure type is StreamFailure on both.
- >-
  map_openai_params takes IndexMap<String, betterlite_models::decisions::Json>, ParameterMapping holds serde_json
  Value maps and chat_request_fields returns betterlite_models::controls::json_value::JsonValue; convert through
  serde_json once at each seam, not per field.
- >-
  Delta literals that list every field: oci_chat_wire/generic/reply.rs, oci_chat_wire/cohere/reply.rs,
  langgraph_stream/iterator.rs, adapters/vertex_agent_stream/chunks.rs, chatgpt/chat/normalizer/tests.rs,
  betterlite-core mock/stream.rs, betterlite-bedrock sagemaker_stream/project.rs and agentcore_stream.rs. Search for
  Delta { followed by refusal: before handing in, since a missed literal only shows in CI.
- >-
  The projected provider headers already carry the llm_provider- prefix and the x-ratelimit- aliases from
  RATE_LIMIT_ALIASES. Hand them over as they are; the server's provider_prefixed_name keeps names that contain
  llm_provider.
- >-
  B9984 bans LocalBoxFuture and LocalBoxStream in clippy.toml, so frames.rs builds a futures_util BoxStream.
- >-
  BetaConfigLoader fetches the remote beta matrix unless LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS is set, so every test
  config sets it.
- >-
  The rstest anthropic_dispatch_cases keeps its ten helper cases under their current names, so the helper replays
  still match their YAML files.
- >-
  File sizes. Every file stays at or under 300 lines, and every function at or under 40. gateway/parameters.rs,
  gateway/files.rs and gateway/logging.rs keep those steps out of gateway/call.rs; split call.rs further if it still
  grows past that.
- >-
  B9988 and this task share files: server/chat_setup/provider_call.rs, provider_call/embedding.rs,
  crates/betterlite-provider/src/operation.rs, operation/tests.rs, prepared/deployment.rs,
  aiohttp_openai_dispatch/tests.rs and provider/tests/openai.rs. free.pl runs them one after the other, so the second
  one merges main and finds the other's variants: B9988 adds OperationError::RejectedFields, OperationResult::OutputLimit
  and Deployment.global_drop_params. Keep its arms in chat_error and its embedding twin, add the two arms here beside
  them, and set every field B9988 added in the Deployment literals.
