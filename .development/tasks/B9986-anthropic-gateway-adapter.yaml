id: B9986
title: Anthropic chat adapter in betterlite-provider
description: >-
  Fill impl Adapter for Anthropic so betterlite-provider answers buffered and streaming Anthropic chat. Today the impl
  in crates/betterlite-provider/src/anthropic_dispatch.rs holds only NAME, so every Anthropic chat answers
  OperationError::UnavailableAdapter. prepare, execute and decode call what B027 and B584 built:
  anthropic_dispatch::completion::complete with the anthropic_dispatch::native::Native handler, and that handler runs
  B584's chat_call. Never reimplement a request transform, a send path, a response transform or a stream decoder that
  already exists; call it. B9984 makes those futures Send. B9989 moves the stream wrapper, the file blocks, the chat
  field split and B175's listed parameter mapping to where this task calls them. B9990 wires the result into the proxy
  routes; this task changes betterlite-server only where a new OperationError variant needs an arm.


  Surface. Anthropic becomes pub struct Anthropic { pub surface: Surface }, with Surface from anthropic_dispatch::base,
  deriving Debug, Clone, Copy, PartialEq and Eq. Drop Default, since nothing calls Anthropic::default().
  Provider::from_slug in crates/betterlite-provider/src/provider.rs maps anthropic to Surface::Messages and
  anthropic_text to Surface::Legacy. A Legacy adapter answers OperationError::UnavailableAdapter from prepare, as both
  slugs do today.


  Runtime. Add the module crates/betterlite-provider/src/anthropic_dispatch/gateway.rs, declared by pub mod gateway;
  in anthropic_dispatch.rs, with its children under gateway/. gateway/runtime.rs holds two structs. pub struct
  AnthropicBases { pub globals: Globals, pub environment: Environment, pub disable_suffix: bool } has pub fn
  new(config: &Config) -> Self. globals.api_base and globals.api_key come from config.sections.resource_sdk_settings
  (litellm_settings.api_base and api_key), and globals.anthropic_key is None. environment.api_base is
  Some(config.sections.anthropic_credentials.api_base); that section already reads it from ANTHROPIC_API_BASE, then
  ANTHROPIC_BASE_URL, then the default. environment.base_url is None, environment.api_key is that section's api_key
  and disable_suffix is its disable_url_suffix. B9990 calls AnthropicBases::new for the deployment defaults.


  pub struct AnthropicRuntime is built once by pub fn new(config: &Config, client: &ProxiedClient, catalog:
  Arc<ModelCatalog>) -> Result<Self, RuntimeError> and owns every value the Native handler borrows.
  native/tests/support/fixture.rs and execution.rs list them; take each from its production source. The bases are an
  AnthropicBases. AnthropicSettings takes api_key, auth_token, api_base and use_bearer_for_custom_base from
  config.sections.anthropic_credentials and the version AnthropicSettings::default() sets. The beta matrix comes from
  betterlite_core::api::anthropic_beta_config::BetaConfigLoader::new(client.clone(),
  config.sections.anthropic_beta_config.clone(), ApiLimits::default()); execute awaits its matrix(), and the loader
  caches the matrix after the first load. ModelCatalog is the shared Arc. ModelCostMap::parse and RawCatalog
  (serde_json::from_slice) read the bytes of (BundledCatalog::default().asset)() once. CandidatePatterns::new(),
  CatalogGeneralizations::default(), betterlite_models::fireworks_catalog_metadata::Catalog::new(), NoDynamicMetadata
  and HfConfigClient { client: NoHfConfig, base_url: HF_CONFIG_BASE_URL } fill the capability environment, with a
  ResolutionContext built from the same config the way crates/betterlite-server/src/server/chat_setup.rs builds the
  one it passes to chat_deployments. The encoding is the bundled cl100k TiktokenEngine the fixture loads. Media goes
  through B5083's betterlite_prompts::media_fetch::fetcher::Fetcher::new(client.clone(), UserUrlFetcher { validator:
  UrlValidator::new(SystemResolver, &config.sections.user_url_policy.user_url_allowed_hosts,
  &Verification::Enabled), validation: config.sections.user_url_policy.user_url_validation },
  config.sections.image_url_download.max_download_size_mb, a wall clock), never a refusing fetcher; file blocks go
  through B9989's betterlite_prompts::anthropic_invokes::file_blocks::RemoteFileBlocks over that fetcher. OptionDefaults
  and max_tokens come from config.sections.anthropic_option_primitives (litellm_settings and default_chat_max_tokens),
  the legacy OptionValues from config.sections.anthropic_completion.litellm_settings, the capability budgets from
  config.sections.anthropic_capability_catalog and global_drop_params from
  config.sections.drop_params.policy.global_drop_params. The runtime owns the Redactor the logging builder needs,
  Redactor::new(MINIMUM_CUSTOM_KEY_LENGTH). The legacy PromptFactory uses Hub::Unreachable with a one-line comment that
  the Messages surface never reads it. A value no config section reads at the pin takes LiteLLM's module default, with
  a one-line comment naming it. Implement Debug for AnthropicRuntime by hand with
  debug_struct("AnthropicRuntime").finish_non_exhaustive(), since Deployment derives Debug.


  The runtime reaches the adapter through the deployment. Add pub anthropic: Option<Arc<AnthropicRuntime>> to
  Deployment in crates/betterlite-provider/src/prepared/deployment.rs. from_chat and from_params set None, and so does
  every Deployment literal in the test files in scope. B9990 sets it on the chat route.


  prepare. For Surface::Messages, RequestKind::Chat(chat) gives PreparedRequest::Anthropic(AnthropicPrepared { chat:
  Box<ChatOperation>, stream: false }), and RequestKind::Stream(chat) gives the same with stream: true. Any other kind
  answers OperationError::UnsupportedOperation { provider: anthropic, operation }. With deployment.anthropic None,
  prepare answers UnavailableAdapter. AnthropicPrepared derives only Debug and Clone, since PreparedRequest derives
  those two.


  execute, in gateway/call.rs. It takes the runtime from deployment.anthropic and builds the call LiteLLM's
  _complete_anthropic builds. The borrowing structs (ResolutionContext, CapabilityEnvironment, CatalogSources,
  PromptDeps, Preparation, Runtime and Native) are built inside execute from &runtime, once per call.


  Parameters, in gateway/parameters.rs, follow get_optional_params at the pin. B9989's
  chat_request_fields(&chat.request) gives the messages and
  the remaining fields. Take drop_params, additional_drop_params and allowed_openai_params out of the fields into a
  betterlite_models::params::ParameterPolicy, with drop_params true when the request sets it or the runtime's
  global_drop_params is on. Take extra_headers out into CompletionCall.headers, and extra_body out into
  optional_params under extra_body, as LiteLLM's non-OpenAI branch keeps it. Remove the other names in
  betterlite_models::params::classification::RESERVED_PARAMETER_NAMES, since LiteLLM reads them as call arguments,
  then deserialize the rest into ChatParameters.
  betterlite_anthropic::capabilities::supported_params::get_supported_openai_params(&deployment.model,
  Some(anthropic), &mut environment, &catalogs) gives the supported list, and B9989's
  map_listed_parameters(&supported, &deployment.model, CallType::ChatCompletion, &parameters, &policy) runs LiteLLM's
  _check_valid_arg. Every ParameterError becomes a new OperationError::Parameters { #[source] source: ParameterError }
  in crates/betterlite-provider/src/operation.rs; ParameterError::Unsupported is the UnsupportedParamsError LiteLLM
  raises with status 400 unless drop_params is set. The mapping's standard map is the non_default_params for B576's
  betterlite_anthropic::params::map_openai_params with a ParamsRequest for deployment.model, provider anthropic, the
  runtime's budgets and default_max_tokens the runtime's max_tokens. The mapping's provider_fields then go into
  optional_params at the top level, as add_provider_specific_params_to_optional_params does for a non-OpenAI provider.


  Remote file data, in gateway/files.rs. LiteLLM's anthropic_process_openai_file_message fetches a file_data value
  that starts with http through convert_url_to_base64 while it builds the messages. The FileBlocks seam is
  synchronous, so RemoteFileBlocks answers FileBlockError::Pending for such a URL today. Before the call, walk the
  messages in order, collect every file content part whose file.file_data is a text starting with http, and fetch
  each distinct URL once with the runtime's Fetcher through RemoteMediaFetcher::convert_url; write no new fetch code.
  The results go into a BTreeMap<String, Result<String, Arc<ImageFetchError>>> keyed by URL. The walk stops at the
  first failed fetch, so no URL after it is fetched, as LiteLLM stops at its first raise. In
  crates/betterlite-prompts/src/anthropic_invokes/file_blocks.rs, RemoteFileBlocks gains pub fetched: &'call
  BTreeMap<String, Result<String, Arc<ImageFetchError>>> and FileBlockError gains Prefetched(Arc<ImageFetchError>)
  with #[error(transparent)]. file_block looks an http file_data up in fetched first: a fetched data URL replaces
  file_data in a copy of the element before process_openai_file_message runs, a stored failure answers
  FileBlockError::Prefetched with that error, and a URL not in the map keeps today's path. The failure then reaches
  the client the way LiteLLM's does: prompt assembly wraps it in RequestError::Prompt, the 400 AnthropicError with
  the Received Messages text. snowflake/messages/files.rs passes an empty map, since its own prefetch rewrites the
  parts first. execute builds RemoteFileBlocks per call with the runtime's Fetcher and the map.


  The call. The CompletionCall carries deployment.model, provider anthropic, the messages, ResponseEnvelope::new with
  a chatcmpl- id from a new UUID, the optional params, api_key deployment.api_key, api_base Some(deployment.api_base),
  stream from AnthropicPrepared, acompletion true, client None, the runtime's encoding and deployment.timeout.
  CompletionSettings borrows the runtime's bases with selection None, and selected_config turns that into
  ChatConfigTag::Anthropic. The Native handler borrows the runtime with pooled set to execute's client and now set to
  Utc::now(). gateway/logging.rs holds the production sinks: a LogSink that writes each LogRecord with
  tracing::debug!, as TracingCompletionLog does for the text bridge, and a StreamLogger whose post_call does the same.
  The per-call LoggingState and PrePostEnv come from one pub(crate) builder there that takes the sink, the redactor,
  the model and a call id; fixtures/runtime.rs::logging calls it with its Discard sink and its fixed values instead of
  keeping its own copy. completion::complete(Surface::Messages, call, &settings, &mut handler, &mut log) runs the call.
  Reply::Messages(outcome) becomes Upstream::Anthropic(Box<AnthropicUpstream>), a new variant in
  crates/betterlite-provider/src/prepared.rs. AnthropicUpstream { pub headers: HeaderMap, pub outcome:
  ChatOutcome<StreamFailure, Counter> } lives in gateway.rs. headers holds the projected provider headers B584 already
  built: additional_headers from the envelope's hidden params on a reply, response_headers on a stream.
  Upstream::headers() returns them. ChatOutcome::Embedding and Reply::Legacy answer UnsupportedOperation.


  decode. ChatOutcome::Reply(envelope) becomes OperationResult::Anthropic(AnthropicResult::Reply(Box<AnthropicReply>)).
  AnthropicReply in gateway/reply.rs is the client view of ResponseEnvelope: id, object, created, model,
  system_fingerprint, choices and usage, without _hidden_params, since LiteLLM never sends those to the client. model
  is the client's requested model name when the ChatRequest has one, as ChatResponse::for_client does.
  ChatOutcome::Stream becomes OperationResult::Anthropic(AnthropicResult::Stream(frames)), frames being a
  BoxStream<'static, Result<Vec<u8>, HttpError>> built in gateway/frames.rs. AnthropicResult turns from the B010 unit
  struct into this two-variant enum with no derives; OperationResult derives nothing.


  Stream frames. LiteLLM wraps the Anthropic stream in CustomStreamWrapper with custom_llm_provider anthropic.
  frames.rs builds B9989's StreamWrapper with provider anthropic, the request's stream_options and model, and reads the
  WrappedStream's completion_stream: DecodedChunk::Event becomes ProviderChunk::Json of the serialized event and
  DecodedChunk::Generic becomes ProviderChunk::Generic. Each StreamChunk from push goes through
  betterlite_openai::text_completion_stream::chat_chunk(chunk, model, include_usage), the projection the server's
  TextSource already uses, and is written as a data: frame with a blank line after it. After the source ends, finish
  gives the closing chunks. A failed read or shaping step logs with tracing::warn! and ends the stream with
  HttpError::Timeout, as TextSource does.


  Delta fields, in betterlite-openai. The gateway relay parses every frame into
  betterlite_openai::stream::chunk::Chunk, whose Delta denies unknown fields and today has only role, content,
  refusal, tool_calls and function_call. LiteLLM's Anthropic stream deltas also carry reasoning_content and
  thinking_blocks. Add pub reasoning_content: Option<String> and pub thinking_blocks: Option<Vec<ThinkingBlock>> to
  Delta in crates/betterlite-openai/src/stream/chunk.rs, with pub struct ThinkingBlock { pub kind: ThinkingKind (serde
  rename type), pub thinking: Option<String>, pub signature: Option<String>, pub data: Option<String> } and pub enum ThinkingKind {
  Thinking, RedactedThinking } (snake_case), with skip_serializing_none and deny_unknown_fields on the struct. Every
  Delta literal sets the two new fields to None. chat_choice in
  crates/betterlite-openai/src/text_completion_stream.rs writes only role and content today; it also writes the
  delta's tool_calls (each with only index, id, type and function, since ToolCall denies unknown fields),
  reasoning_content and thinking_blocks when present. The text path never fills them, so its output does not change.


  Errors, in gateway/error.rs. LiteLLM raises an AnthropicError with a status for an upstream error and for a failed
  request build, so a failure that carries a status keeps it. DispatchError::Completion(Failure::Chat(error)) with
  Some(status) from ChatCallError::status_code, and DispatchError::Completion(Failure::Prepare(error)) with
  Some(status) from RequestError::status_code, become OperationError::Provider with an UpstreamResponse of that
  status, the provider headers the error carries (none for a request build failure) and the error's message as
  body. Failure::Http(error) passes its OperationError on. A transport timeout becomes OperationError::Timeout and a
  missing key OperationError::MissingApiKey. Every other failure becomes a new OperationError::Anthropic { #[source]
  source: Box<AnthropicCallError> } in crates/betterlite-provider/src/operation.rs. chat_error in
  crates/betterlite-server/src/server/chat_setup/provider_call.rs and its twin in provider_call/embedding.rs match
  OperationError exhaustively, so both gain the two arms here: OperationError::Anthropic goes to CallError::Operation
  next to TransformRetry, a 500. OperationError::Parameters with ParameterError::Unsupported { names, .. } goes to
  ChatError::Request with RequestError::Unsupported { name: names joined with a comma and a space }, the 400 the route
  already answers for a rejected parameter, and any other ParameterError goes to CallError::Operation, a 500.


  The other Upstream matches. openai_dispatch.rs and aiohttp_openai_dispatch.rs add Upstream::Anthropic(_) to their
  unsupported arms. anthropic_dispatch/native/legacy.rs gets an arm for it that answers
  Failure::Http(OperationError::UnsupportedOperation), since the legacy send never yields it.


  Tests. Extend the rstest anthropic_dispatch_cases in crates/betterlite-provider/src/anthropic_dispatch/tests.rs with
  a Family enum the way openai_dispatch/tests.rs does: Family::Helper keeps the ten helper-case files under their
  current names, and Family::Gateway drives Anthropic prepare, execute and decode against a loopback upstream from the
  new child module anthropic_dispatch/tests/gateway.rs. The loopback is native/tests/support/wire.rs::server; widen it
  and the modules above it to pub(crate) instead of writing a second one. Add the named cases
  anthropic_provider_dispatch_http (a buffered reply, the request's x-api-key and anthropic-version, the client view
  without _hidden_params), anthropic_provider_dispatch_stream (frames that Chunk::parse accepts, a tool_use block
  arriving as delta tool_calls, a closing finish_reason chunk), anthropic_provider_dispatch_thinking (a thinking block
  arriving as delta reasoning_content and thinking_blocks after Chunk::parse), anthropic_provider_dispatch_error (a 400
  from the upstream becomes OperationError::Provider with that status), anthropic_provider_unsupported_param
  (logit_bias answers OperationError::Parameters with ParameterError::Unsupported and nothing is sent), anthropic_provider_dropped_param (the
  same request with drop_params true is sent without logit_bias), anthropic_provider_remote_file (a file_data URL the
  loopback serves as a PDF is fetched once and sent as a base64 document block) and anthropic_provider_remote_file_error
  (a file_data URL the loopback answers with 404 becomes OperationError::Provider with status 400, a body naming the
  URL, and no Messages request upstream). In crates/betterlite-provider/src/provider/tests.rs the case anthropic
  becomes anthropic_text, built with Surface::Legacy and still asserting the refusal. Test configs set
  LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS so the beta matrix never leaves the machine, and set litellm_settings.user_url_validation:
  false so the fetcher reaches the loopback.
