dod:
- text: >-
    anthropic buffered: Anthropic prepare, execute and decode turn a loopback Messages reply into LiteLLM's client
    view through B027's complete() and the Native handler.
  proof:
  - adapter-buffered
- text: >-
    anthropic stream: an Anthropic event stream becomes data frames shaped by StreamWrapper that Chunk::parse accepts,
    with tool calls in the delta and a closing finish_reason chunk.
  proof:
  - adapter-stream
- text: >-
    anthropic thinking: a thinking block reaches the frames as delta reasoning_content and thinking_blocks, and the
    relay's Delta accepts both.
  proof:
  - adapter-thinking
- text: >-
    anthropic upstream error: a non-2xx Anthropic answer becomes OperationError::Provider with its status and body.
  proof:
  - adapter-error
- text: >-
    unsupported params: a param outside Anthropic's supported list answers OperationError::Parameters (Unsupported) unless
    drop_params is set, and with drop_params the call is sent without it.
  proof:
  - adapter-params
- text: >-
    remote file data: a file_data URL is fetched once through the runtime's Fetcher before the call and sent as a
    document block, and a failed fetch answers LiteLLM's 400 with nothing sent upstream.
  proof:
  - adapter-files
- text: >-
    anthropic_text stays refused: an anthropic_text deployment still answers UnavailableAdapter.
  proof:
  - adapter-surface
- text: >-
    nothing regresses: the provider, OpenAI stream, core mock, bedrock stream and server chat setup modules this task
    changes keep passing.
  proof:
  - regressions
checks:
  optional:
  - mutants
  commands:
  - id: adapter-buffered
    why: Anthropic prepare, execute and decode do not turn a buffered loopback reply into the client view.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_http$/)'
  - id: adapter-stream
    why: Anthropic execute and decode do not turn a loopback event stream with a tool_use block into parseable frames.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_stream$/)'
  - id: adapter-thinking
    why: A thinking block does not reach the frames, or Chunk::parse rejects reasoning_content or thinking_blocks.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_thinking$/)'
  - id: adapter-error
    why: An Anthropic 400 does not become OperationError::Provider with that status.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_dispatch_error$/)'
  - id: adapter-params
    why: An unsupported param is sent, is dropped without drop_params, or is not dropped with it.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_(unsupported|dropped)_param$/)'
  - id: adapter-files
    why: A file_data URL is not fetched before the call, is fetched twice, or a failed fetch does not answer 400
      before anything is sent upstream.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::anthropic_dispatch_cases::case_[0-9]+_anthropic_provider_remote_file(_error)?$/)'
  - id: adapter-surface
    why: The anthropic_text adapter no longer refuses, or the anthropic case was not split by surface.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::provider_framework_tests_behavior::case_[0-9]+_anthropic_text$/)'
  - id: regressions
    why: The Upstream variant, the Deployment field, the OperationError variants, the Delta fields or the file block
      map broke a test in a module this task changes.
