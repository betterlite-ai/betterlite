id: B3671
title: Responses guardrail request and output rewriting
description: >-
  Build the handler that applies a guardrail to an OpenAI Responses API request and to a finished
  (non-streamed) Responses API response. It is LiteLLM's `OpenAIResponsesHandler` without its streaming
  and block-event methods. Handlers are plain async functions generic over `G: GuardrailContract`
  (B5471's `guardrail_base`, which also gives `GuardrailApiInputs`, `GuardrailInputType` and
  `GuardrailLogTarget`), as in B5820 and B3674. The dispatcher (B3679, B3680) calls them. Nothing here
  knows about routes or call types, and nothing here catches, logs or rewrites a `GuardrailFailure`:
  it goes straight to the caller. Request bodies are `BTreeMap<String, GuardrailValue>` and the
  response is a `GuardrailValue`, both as B5820 uses them. B3670's helpers take `serde_json::Value`,
  so move between the two with serde in one place per module and do not write a converter module.
  Raw Responses items and output items are JSON that betterlite does not model, so they stay JSON.
  LiteLLM branches between pydantic objects and dicts in many places. In Rust both are one JSON
  object, so only the dict behavior is built.

  Two modules, in crates/betterlite-server/src/guardrails/responses_translation/. Each owns an error
  enum in its own `error.rs` with `thiserror`: `RequestRewriteError` and `OutputRewriteError`. Their
  variants wrap, with `#[source]`, the `GuardrailFailure` (box it if `clippy::result_large_err` fires),
  B3663's unappliable-rewrite error, and the typed errors of B909's input converter, B917's
  chat-to-Responses converter, B3669's tool merge and B3670's provenance. A conversion error is never
  turned into "no change". Add the crates this task imports to crates/betterlite-server/Cargo.toml
  (betterlite-guardrails, betterlite-core and betterlite-config; none depends on betterlite-server).
  Read the finished modules of B909, B913, B917, B3663, B3669 and B3670 for their exact Rust names and
  signatures. Where this text uses LiteLLM's names, those are the functions meant.

  Module `request_rewrite` (request_rewrite.rs). `get_structured_messages(data) ->
  Result<Option<Vec<ChatMessage>>, RequestRewriteError>`: None when `data.input` is missing or null,
  otherwise B909's input-to-messages function over `data.input` with `data` as the request (so a
  truthy `instructions` becomes a leading system message), and None when the result is empty.
  `scannable_instructions(data, skip_system: bool) -> Option<&str>` is the `instructions` string only
  when it is non-empty and `skip_system` is false. It is public because other guardrails read it.
  `ExtractedInputs { inputs: GuardrailApiInputs, task_mappings: Vec<(usize, Option<usize>)>,
  instructions: Option<String> }` and `RequestFields { input: Vec<Value>, instructions: Option<String> }`
  are the two small structs.

  `extract_guardrail_inputs(data, input_data, flattened_tool_groups, skip_system) -> ExtractedInputs`
  builds what the guardrail sees. `texts` starts with the scannable instructions, if any. A string
  `input` adds itself as one text. An array `input` walks its items with their index. An item that is
  not an object is skipped. The item's role is its `role` when that is a string, lowercased, else "".
  B3663's `role_out_of_guardrail_scope(role, skip_system, skip_tool = false)` skips the item. For the
  rest, a missing or null `content` adds nothing. A string `content` adds one text and the mapping
  `(msg_idx, None)`. An array `content` walks its entries; an entry that is an object with a string
  `text` adds that text and the mapping `(msg_idx, Some(content_idx))`, and an entry whose `type` is
  "image_url" with an `image_url` object holding a non-empty string `url` adds that url to `images`.
  `tools` is a deep copy of every tool of every group in `flattened_tool_groups` (each group is the
  `chat_tools` of one form returned by B913's `responses_tools_to_chat_forms` over `data.tools`).
  `images` and `tools` are set only when not empty. `model` is set whenever `data.model` is a string,
  even an empty one.

  `process_input_messages(data: &mut BTreeMap<String, GuardrailValue>, guardrail: &G, logging_obj:
  Option<&mut GuardrailLogTarget>) -> Result<(), RequestRewriteError>` runs in this order. (1) If
  `data.input` is neither a string nor an array, return. (2) `skip_system` comes from B3663's
  `effective_skip_system_message_for_guardrail` for this guardrail. (3) `get_structured_messages`. (4)
  `scoped_indices` is B3663's `scoped_structured_message_indices` over those messages (or none) with
  `scan_only_tool_results` false, the `skip_system` above and `skip_tool` false. `scoped_messages` is
  the messages at those indices when the full list is not empty, else None. (5) `original_tools` is
  `data.tools` when it is an array, else empty; `flattened_tool_groups` come from B913. (6)
  `extract_guardrail_inputs`. If its `texts` is empty, return with `data` untouched. (7) When
  `scoped_messages` is Some and not empty, set `inputs.structured_messages` to it (moved from the
  converter's message type to `GuardrailMessage` with serde). (8) Call the guardrail with `inputs`,
  `data` itself as `request_data`, `GuardrailInputType::Request` and `logging_obj`. (9)
  `apply_guardrailed_tools_to_data`: when the answer has `tools` (even an empty list), set `data.tools`
  to B3669's `merge_guardrailed_tools(original_tools, flattened_tool_groups, returned_tools)`; when
  the answer has no `tools`, do nothing. This happens before the message write-back and stays even if
  the write-back later falls back. (10) `written_back_request_fields`. When it gives Some, set
  `data.input` to its input list and set `data.instructions` to its instructions, or remove the key
  when they are None. When it gives None, run `apply_guardrailed_texts`. (11) Keep LiteLLM's debug
  line `OpenAI Responses API: Processed input messages: {input}`.

  `written_back_request_fields(data, structured_messages, scoped_indices, scoped_messages, guardrail,
  answer) -> Result<Option<RequestFields>, RequestRewriteError>` returns None when the answer has no
  `structured_messages` or they equal `scoped_messages` (see deviations). `covers_full_request` is true
  when `scoped_indices.len() == structured_messages.len()`, or when
  `guardrail.structured_messages_cover_full_request()` is true and the returned list has the same
  length as `structured_messages`. A covering list is used as it is; any other is put back into the
  full list with B3663's `merge_guardrailed_scoped_messages(full, scoped_indices, returned)`. The
  result goes to `patch_or_convert_request_fields`. That function first tries
  `patched_request_fields`; when that gives None it converts the merged messages with B917's
  `convert_chat_completion_messages_to_responses_api`, whose items become the new input and whose
  instructions become the new instructions. So a string `input` always ends as an array after a
  structured rewrite.

  `patched_request_fields(raw_input, instructions, original_messages, merged_messages) ->
  Result<Option<RequestFields>, RequestRewriteError>` rewrites only the raw input items whose message
  changed, so untouched items keep every field the chat form cannot hold. It returns None (so the
  caller converts) in each of these cases. `raw_input` is not an array. The two message lists differ in
  length. `offset` is 1 when the raw `instructions` is truthy (a non-empty string), else 0, and it
  does not depend on `skip_system`. B3670's `input_item_provenance(raw_input, original_messages[offset..])`
  gives None. A rewritten `instructions` is present but not a string. A changed message after `offset` is
  in B3670's `tainted` set or has no entry in `item_for_message`. Two changed messages map to one item.
  `rewritten_input_item` gives None for any changed item. Otherwise: a message is changed when the
  original and merged messages differ as JSON values (serialize the original with serde, leaving out
  absent fields, so an echoed row compares equal). Only index 0 can be an instructions rewrite when
  `offset` is 1. The new instructions are that row's `content` when the row is an object, and
  the old `instructions` when no row changed. A rewritten instructions row without a `content` yields
  None, which removes `instructions`. A changed body message `i` replaces raw item
  `item_for_message[i - offset]` with B3670's `rewritten_input_item`. The result keeps every other raw
  item as it was.

  `apply_guardrailed_texts(data, input_data, extracted, guardrail, answer)`: no returned `texts` (absent
  or empty) changes nothing. Otherwise `offset` is 1 when `extracted.instructions` is Some, else 0, and
  `expected` is 1 for a string input, else the number of `task_mappings`. A returned length other than
  `offset + expected` fails with B3663's `unappliable_request_rewrite(guardrail_name)` before anything is
  written. Then `data.instructions` is set to the first returned text when `offset` is 1, a string
  input is replaced by the next text, and an array input goes to
  `apply_guardrail_responses_to_input(messages: &mut [Value], responses, task_mappings)`. That function
  pairs the two lists to the shorter, skips an item whose `content` is missing or null, sets a string
  `content` only for a `None` mapping, and sets `text` of `content[content_idx]` only for a `Some`
  mapping, when `content` is an array and that entry is an object. It edits `data.input` in place.

  Module `output_rewrite` (output_rewrite.rs). `extract_output(output_items: &[Value]) -> ExtractedOutput {
  texts, task_mappings: Vec<(usize, usize)>, tool_calls: Vec<Value> }` replaces LiteLLM's per-item
  `_extract_output_text_and_images` (its `images` list is never filled, so it is not built). B3672 calls
  it on the stream's completed envelope. For each item with its index: if B3670's
  `tool_call_output_item_mapping` is Some (type `function_call` or `custom_tool_call`), B917's
  `tool_call_dict_from_output_item(item, output_idx)` is added to `tool_calls` and the item adds no
  text. Otherwise an item that is an object with a non-empty array `content` is walked; each entry
  that is an object with a non-empty string `text` adds the text and the mapping `(output_idx,
  content_idx)`. Any other item adds nothing. Keep the debug line `OpenAI Responses API: Processing
  output item: {item}` for each item that has content to walk.

  `apply_guardrail_responses_to_output(response: &mut Value, responses: &[String], task_mappings) ->
  Result<(), OutputRewriteError>` is also called by B3672. It reads `response.output` (an array, else
  returns). For returned text number `i` it takes `task_mappings[i]` and skips it when the output index
  is past the end of the output; otherwise, when that item is an object whose `content` is an array longer
  than the content index and the entry is an object, it sets the entry's `text`. A returned list longer
  than `task_mappings` returns `OutputRewriteError::TooManyTexts` at the first extra text, after the earlier
  writes (see deviations). `write_tool_call_item(item: &mut Value, name: Option<&str>, payload:
  Option<&str>)` sets the item's `name` when `name` is Some, and sets `arguments` (type `function_call`)
  or `input` (type `custom_tool_call`) when `payload` is Some and the item has one of those two types. A
  non-object item is left alone. B3672 also calls it. `write_tool_call_rewrites_to_output(response,
  pre, post)` collects the output items that are tool call items and does nothing unless their count
  equals `post.len()`. For each triple of item, before and after shape whose shapes differ, it calls
  `write_tool_call_item` with B3670's `tool_call_rewrite(before, after)` (name only when changed, arguments
  always). The pairs stop at the shortest list.

  `process_output_response(response: &mut GuardrailValue, guardrail: &G, logging_obj:
  Option<&mut GuardrailLogTarget>, user_api_key_dict: Option<&BTreeMap<String, GuardrailValue>>,
  request_data: Option<&mut BTreeMap<String, GuardrailValue>>) -> Result<(), OutputRewriteError>`: a
  response that is not an object logs the debug line `OpenAI Responses API: No output found in
  response` and returns. A missing, null or empty `output` logs `OpenAI Responses API: Empty output in
  response` and returns. Then `extract_output`. No texts and no tool calls means no call. Otherwise
  prepare the request data with B5820's `response_context::add_response_context` (an absent
  `request_data` starts from an empty map; the key `response` is inserted only when missing), build
  `GuardrailApiInputs` with `texts`, `tool_calls` only when not empty, and `model` when
  `response.model` is a non-empty string. `pre` is B3670's `tool_call_shapes` over the scanned calls.
  Call the guardrail with `GuardrailInputType::Response`. `post` is B3670's
  `post_guardrail_tool_call_shapes(answer.tool_calls, pre, guardrail_name)`. Write the returned texts
  with `apply_guardrail_responses_to_output` (no returned `texts` means none), then the tool call
  rewrites. Keep the debug line `OpenAI Responses API: Processed output response: {response}`.

  Tests live in `tests.rs` of each module, with a small fake guardrail defined there that records the
  `GuardrailApiInputs`, the input type and a copy of the request data, and returns scripted `texts`,
  `tools`, `structured_messages` and `tool_calls`. Test names start with: `instructions_`,
  `extract_inputs_`, `texts_`, `patch_`, `write_back_`, `process_input_` in request_rewrite; and
  `extract_output_`, `apply_output_`, `tool_rewrite_`, `process_output_` in output_rewrite. The handlers
  are not reachable from a route yet, so the HTTP cases come with the dispatcher umbrella (B3680);
  this task gets helper cases for the pure functions only.
