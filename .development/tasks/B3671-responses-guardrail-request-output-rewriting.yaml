  - "B3672 owns process_output_streaming_response, the ended-stream tool call delivery, the stream event sync and spread helpers, get_streaming_string_so_far, the scan key, the ended-stream check, _has_streamed_tool_call_events, _completed_response_scan_key and the event type constants. It calls this task's extract_output, apply_guardrail_responses_to_output and write_tool_call_item."
  - "B3673 owns build_block_sse_chunks, build_stream_error_items, _next_stream_sequence_number, the blocked payload types and the open item state helpers."
  - "B888 owns extract_request_tool_names. It moves into betterlite-auth, so this task does not build it."
  - "B3669 owns merge_guardrailed_tools (tool_merge.py). B3663 owns the scope helpers, merge_guardrailed_scoped_messages and unappliable_request_rewrite. B5820 owns add_response_context."
  - "B909 owns transform_responses_api_input_to_messages, B913 owns responses_tools_to_chat_forms and B917 owns convert_chat_completion_messages_to_responses_api and tool_call_dict_from_output_item. This task only calls them."
  - "_has_text_content on the Responses handler has no caller at the pin (only the chat and Anthropic handlers call their own copies), so it is not built and has no cases."
  - "_write_event_field is a one-line key write on a JSON object. write_tool_call_item inlines it, and B3672 does the same for stream events."
  - "OpenAIResponsesHandler's class attributes delivers_ended_stream_rewrites and assembles_streamed_response belong to the streaming task and the dispatcher."
pitfalls:
  - "`offset` in patched_request_fields comes from the raw `instructions` being truthy, not from skip_system. With skip_system on, the system row still sits in the structured messages (out of the guardrail's scope) and the offset still skips it when looking up items."
  - "The scope list is empty and not sent when every message is out of scope, but the texts check comes first: with no texts the guardrail is never called at all, even when the request has messages."
  - "Compare original and merged messages as JSON with absent fields left out. If a typed message serializes `null` fields, every echoed row looks changed and every request falls back to full conversion."
  - "A rewritten instructions row without `content` removes `instructions` from the body, and a rewritten row whose `content` is not a string sends the whole request to full conversion."
  - "`data.tools` is set from the guardrail's tools even when the returned list is empty, and before the message write-back, so a later fallback does not undo it."
  - "In apply_guardrailed_texts the length check compares the returned list with `offset + expected`, where expected counts the mappings, not the messages. A text-less content entry has no mapping and no text."
  - "`model` is set for any string on the request side, even an empty one, but only for a non-empty string on the response side."
  - "extract_output skips a tool call item for text even when its `content` has entries, and an entry with an empty `text` adds nothing and gets no mapping."
  - "write_tool_call_rewrites_to_output compares the count of tool call items in the output with the post-guardrail call count. A guardrail that adds a call is ignored silently, and one that drops a call is ignored the same way."
  - "write_tool_call_item with `payload` None must leave `arguments` and `input` alone. B3672 relies on this for the `output_item.added` events."
