dod:
  - text: >-
      get_structured_messages returns None for a missing or null input and for an input that converts to no
      messages, and turns a truthy instructions string into a leading system message.
    proof: [request-structured-tests, oracle]
  - text: >-
      scannable_instructions returns the instructions only when they are a non-empty string and system
      messages are not skipped.
    proof: [request-instructions-tests, oracle]
  - text: >-
      extract_guardrail_inputs collects instructions, string content and text entries with their
      mappings, skips out-of-scope roles and non-object items, collects image_url urls, deep-copies the
      flattened tools, sets model for any string, and leaves images and tools out when empty.
    proof: [request-extract-tests, oracle]
  - text: >-
      apply_guardrailed_texts writes returned texts to instructions, a string input or the mapped
      content, changes nothing for an absent or empty answer, and fails with the unappliable-rewrite
      error, before any write, when the returned count does not fit.
    proof: [request-texts-tests, oracle]
  - text: >-
      patched_request_fields rewrites only the changed raw items and keeps the others untouched, and
      returns None for a non-array input, a length mismatch, an untraceable or tainted message, two
      changes in one item, a non-string rewritten instructions row, or an item that cannot be patched.
    proof: [request-patch-tests, oracle]
  - text: >-
      A returned structured_messages list is used whole when it covers the request and merged into the
      full list otherwise, an unchanged list is ignored, and a failed patch falls back to the B917
      conversion, which sets or removes instructions and turns a string input into an array.
    proof: [request-write-back-tests, oracle]
  - text: >-
      process_input_messages makes no call without texts, sends structured_messages only when the scope
      is not empty, merges returned tools before the write-back, writes back through structured messages
      first and texts second, and passes a guardrail failure through unchanged.
    proof: [request-process-tests]
  - text: >-
      extract_output collects non-empty text entries with (output index, content index) mappings, turns
      function_call and custom_tool_call items into chat tool calls with no text, and skips other items.
    proof: [output-extract-tests, oracle]
  - text: >-
      apply_guardrail_responses_to_output writes returned texts by mapping, skips an out-of-range output
      index or content index, and returns a typed error for a returned text with no mapping.
    proof: [output-apply-tests, oracle]
  - text: >-
      write_tool_call_item and write_tool_call_rewrites_to_output rewrite arguments for function_call and
      input for custom_tool_call, rename only when the name is given, and change nothing when the item
      count differs from the returned call count.
    proof: [output-tool-rewrite-tests, oracle]
  - text: >-
      process_output_response returns early for a missing or empty output, makes no call and adds no
      response key when nothing was extracted, otherwise prepares the request data, calls the guardrail
      with the Response input type and writes texts, then tool call rewrites.
    proof: [output-process-tests]
checks:
  optional: []
  commands:
    - id: request-structured-tests
      why: the Responses get_structured_messages tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::request_rewrite::tests::structured_messages_/)'
    - id: request-instructions-tests
      why: the scannable_instructions tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::request_rewrite::tests::instructions_/)'
    - id: request-extract-tests
      why: the request input extraction tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::request_rewrite::tests::extract_inputs_/)'
    - id: request-texts-tests
      why: the text write-back and length check tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::request_rewrite::tests::texts_/)'
    - id: request-patch-tests
      why: the item-level request patch tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::request_rewrite::tests::patch_/)'
    - id: request-write-back-tests
      why: the structured message write-back and conversion fallback tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::request_rewrite::tests::write_back_/)'
    - id: request-process-tests
      why: the process_input_messages flow tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::request_rewrite::tests::process_input_/)'
    - id: output-extract-tests
      why: the output text and tool call extraction tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::output_rewrite::tests::extract_output_/)'
    - id: output-apply-tests
      why: the output text write-back tests are missing
