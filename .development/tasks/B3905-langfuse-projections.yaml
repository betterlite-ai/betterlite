oracle_cases: []
deviations:
  - what: >-
      Unresolved dependencies str_to_bool, get_logging_id, _get_preset_cache_key_from_kwargs
      and the configured masking callable are injected or resolved externally; str_to_bool
      is called from _as_steering_flag with None fallback, get_logging_id is delegated
      directly, cache key lookup uses dynamic introspection with litellm.cache as a guard,
      and masking callable is optional at logger construction.
    why: >-
      These functions are owned by other tasks (dynamic validation, utils, cache, config)
      not yet assigned leaf ownership. B3905 builds the projections that call them;
      calling an unavailable function is a configuration error deferred to logger construction.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse.py#L162-L163
out_of_scope:
  - Logger construction and lifecycle, owned by B3907.
  - Langfuse export channel and tracing setup, owned by B3903 and B3901.
  - Rest client for prompt fetches, owned by B3904.
  - Generation assembly and trace ID resolution, owned by B3906.
  - Child observation creation, owned by B3912.
pitfalls:
  - Session-header detection lowercases header keys via isinstance(key, str) filter and
    dict comprehension in _is_session_header_trace; comparison is case-insensitive to match
    LiteLLM header lookup behavior.
  - Metadata injection via add_metadata_from_header does not check isinstance on header keys;
    it relies on proxy_server_request.headers being a dict and key.startswith checking for
    langfuse_ prefix without case normalization.
  - Session-header detection uses re.fullmatch for trace ID validation, not re.match or
    re.search; the pattern must match the entire ID, not just a prefix.
  - Steering flag conversion with str_to_bool can return None; the code falls back to
    bool(value) truthiness only when str_to_bool returns None, not when it returns False.
  - Cache key lookup uses hasattr/getattr on prompt_tokens_details; accessing a missing
    attribute returns None, not an AttributeError, so the fallback always succeeds.
  - _extract_cache_read_input_tokens returns int, but an input with float cached_tokens
    (from Gemini) is compared as > 0 before conversion, preserving the numeric comparison.
  - Requester metadata separation preserves all non-requester keys alongside the nested
    requester_metadata field; no keys are dropped or hidden.
  - Masking applies recursively to list items; an empty dict or list in the data tree is
    passed to the masking function unchanged and returned if the function succeeds.
  - Response ID extraction uses isinstance(response_obj, _ResponseWithId) which is true for
    dicts; getattr with a default of None returns None when the dict has no "id" key.
  - Cache key lookup uses hasattr and getattr for optional prompt_tokens_details access
    when checking Gemini format; a missing attribute is treated as if cached_tokens is None,
    matching LiteLLM's runtime check order.
  - Masking function failures are caught, logged as warnings, and the original data is
    returned unmasked; exceptions do not block logging, preserving lenient behavior.
