    why: Requester metadata preservation
dod:
  - text: Content extraction dispatches correctly by response type; ModelResponse
      returns first choice's message, TextCompletionResponse returns first choice's
      text, ResponsesAPIResponse returns output list, ImageResponse returns data,
      TranscriptionResponse returns text, RerankResponse returns results, speech
      returns "speech-output", embedding returns None.
    proof: [content-extraction-tests]
  - text: _get_langfuse_input_output_content returns (prompt, content) tuple or
      (prompt, status_message) on ERROR level, with input=None for embedding calls.
    proof: [input-output-dispatch-tests]
  - text: _get_langfuse_input_output_content handles _arealtime call_type by returning
      (kwargs.get("input"), response_obj) when response_obj is a list.
    proof: [realtime-dispatch-tests]
  - text: _get_langfuse_input_output_content handles pass_through_endpoint call_type
      by returning (prompt, response_obj.get("response", "")) when response_obj is a dict.
    proof: [pass-through-dispatch-tests]
  - text: Metadata projection overwrites existing keys from langfuse_* headers,
      logs a warning when overwriting, and returns the modified metadata dict.
    proof: [metadata-header-tests]
  - text: Session-header detection checks for explicit langfuse_session_id or
      x-litellm-session-id headers first; falls back to pattern-matching custom
      session-id headers; respects codex user-agent detection.
    proof: [session-header-tests]
  - text: Steering flag conversion falls back unrecognized strings to their truthiness;
      steering key sequence splits comma-separated strings or accepts iterables.
    proof: [steering-tests]
  - text: Cache read token extraction checks both cache_read_input_tokens at top
      level and prompt_tokens_details.cached_tokens for Gemini/OpenAI format.
    proof: [cache-tests]
  - text: Logging ID delegates to litellm.utils.get_logging_id; lookup_ids returns
      mapping with litellm_call_id and response_id when present.
    proof: [id-tests]
  - text: Default Langfuse tags append cache_hit and cache_key when configured in
      langfuse_default_tags setting, with cache_key falling back to preset cache key.
    proof: [tag-tests]
  - text: Masking function application recurses through dicts and lists, logs
      exceptions and returns original data on failure.
    proof: [masking-tests]
  - text: Requester metadata separation preserves non-requester fields alongside
      the requester_metadata field.
    proof: [requester-metadata-tests]
