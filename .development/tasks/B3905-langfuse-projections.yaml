id: B3905
title: Langfuse content and trace steering projections
description: >-
  Build reusable content, metadata-header, trace-steering, cache-usage and
  masking projections in betterlite-logging. Extract text from responses in the
  order chat-completion-choices first, text-completion next, Responses API output,
  speech-output, images, transcription or rerank results based on response type.
  Preserve header overwrite behavior and session-header detection without
  constructing or invoking a logger instance.

  Functions to port:

  - Content extraction via response type: _get_chat_content_for_langfuse,
    _get_text_completion_content_for_langfuse, _get_responses_api_content_for_langfuse,
    _get_langfuse_input_output_content (distinguishes error, embedding, speech, image,
    transcription and rerank responses by explicit isinstance checks)

  - Metadata projection: add_metadata_from_header (injects langfuse_* headers as metadata,
    overwrites existing keys, logs overwrite warnings)

  - Trace steering and session detection: _is_session_header_trace (checks for
    explicit langfuse_session_id or x-litellm-session-id headers, searches custom
    session-id headers by pattern matching, respects codex user-agent), _as_steering_flag
    (falls back unrecognized strings to truthiness), _as_steering_key_sequence
    (splits comma-separated values or accepts iterables)

  - ID and tag handling: _logging_id (delegates to litellm.utils.get_logging_id),
    _lookup_ids (returns generation and response ids), _get_langfuse_tags
    (extracts request_tags from StandardLoggingPayload), add_default_langfuse_tags
    (appends cache_hit and cache_key tags when configured), _apply_masking_function
    (recursively masks dicts, lists and strings, logs failures and returns original)

  - Cache usage projection: _extract_cache_read_input_tokens (checks cache_read_input_tokens
    at top level and fallback to prompt_tokens_details.cached_tokens for Gemini/OpenAI)

  - Metadata preservation: log_requester_metadata (separates requester_metadata from
    other metadata fields)

  - Protocol helpers: _object_mapping (typed dict view), _widened_items (header pairs),
    _optional_str (converts non-string to string or None), _trace_public_flag
    (converts bool or string steering flag to bool or None), _UsageObject and
    _ResponseWithId protocol declarations for duck-typed usage and response accessors

  Direct dependencies: B002 for config loader (litellm_settings.langfuse_default_tags);
  B254 for StandardLoggingPayload response and usage contracts. Unresolved direct
  calls: str_to_bool (dynamic-validation or secret-manager leaf), get_logging_id
  (utils leaf), _get_preset_cache_key_from_kwargs (cache leaf). Masking callable
  is configured Python, injected at logger construction.
