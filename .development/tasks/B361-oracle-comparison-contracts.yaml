id: B361
title: Explicit numerical and deviation comparison contracts
description: Extend the oracle comparator shared by legacy HTTP cases, B300 scenarios and B301 component
  probes with two strict opt-in rules. A numerical rule names one JSON pointer, a nonnegative Decimal
  absolute tolerance and a reason; exact comparison remains the default. An expected-difference rule names
  one pointer with exact expected LiteLLM and betterlite values plus the task's deviation reason/reference.
  Assert each side before excluding that pointer from the remaining structural comparison. Reject duplicate,
  overlapping, missing and type-incompatible paths. During --self-check assert the LiteLLM value on both
  sides. Never permit a tolerance for selected models, tiers, status codes, counts, spend, provider requests
  or permission outcomes. Add this format to the existing strict case parser and its corpus; no case may
  hide an unexpected difference behind ignore. This tooling-only slice is estimated at 500 to 700 changed
  lines including comparator tests.
scope:
  paths:
  - tools/oracle/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/llm_v2.py#L200-L220
  why: Floating-point epsilon and diagnostic formatting require an explicit comparison policy.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L124-L175
  why: A deliberate failure-recovery improvement needs separate expected outcomes, not a blanket ignore.
dod:
- text: Exact comparison stays the default; approved diagnostic tolerances accept only their bounded numerical
    difference and malformed or overbroad rules fail.
  proof:
  - comparison-tests
- text: Each expected-difference pointer asserts both sides, self-check asserts reference outcomes on
    both sides, and corrupting either expectation fails.
  proof:
  - comparison-tests
  - oracle
- text: New comparison fields are covered by the strict parser's fuzz target and corpus replay.
  proof:
  - comparison-corpus
checks:
  optional:
  - mutants
  commands:
  - id: comparison-tests
    why: comparison-contract regression tests fail or do not run
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(comparison_contract)'
  - id: comparison-corpus
    why: comparison rules are missing from the probe corpus or corpus replay fails
    run: test -f tools/oracle/fuzz/fuzz_targets/router_probe.rs && test -f tools/oracle/fuzz/corpus/router_probe/comparison_rules.yaml
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_router_probe_corpus)'
oracle_cases:
- tools/oracle/cases/routing/probes/comparison-exact.yaml
- tools/oracle/cases/routing/probes/comparison-diagnostic.yaml
deviations: []
out_of_scope:
- Choosing floating-point exceptions or numerical tolerances for algorithm tasks; those require the architect's
  decision.
- Changing the pinned package or suppressing mismatched deployment choices.
pitfalls:
- Seed probe cases still call the production one-candidate selector; comparator-only edge values belong
  in unit tests.
- Document each deliberate difference in the owning task and assert it in a case rather than normalizing
  it away.
review_level: standard
budget:
  max_changed_lines: 700
  max_new_expects: 0
