id: B10155
title: MCP client per-server auth header lookup and pass-through predicates
description: >-
  A client can send a token meant for one upstream MCP server as an x-mcp-{alias}-{header} header. LiteLLM picks that token for a server with lookup_mcp_server_auth_in_headers (utils.py L151-L216) and asks whether the request already carries an upstream token with _client_has_per_server_auth_header and _client_has_passthrough_authorization (operations.py L681-L731). These were B8196's and B4726's, but the callers need nothing else from those tasks: B8725's preemptive_challenge decides whether to answer 401 with them, B8196's _prepare_mcp_server_headers and B4726's server_auth_header pick the per-server header with the lookup, and B8460's OpenAPI auth and B8462's tool listing do the same. So the five functions live here, below all of them, and every caller uses them instead of writing the rules again.


  Code goes in betterlite-mcp, module client_auth_headers (crates/betterlite-mcp/src/client_auth_headers.rs, an empty stub lib.rs already declares). Put the lookup in the submodule lookup (client_auth_headers/lookup.rs, declared in client_auth_headers.rs) with its tests in client_auth_headers/lookup/tests.rs, and the two predicates in client_auth_headers.rs with their tests in client_auth_headers/tests.rs. Everything here is a pure function: no I/O, no setting, no clock. The header map is the type B4654's request_headers::client_headers::server_auth_headers returns, BTreeMap<String, BTreeMap<String, SecretString>> (alias, then header name, then value), and the top-level map is the BTreeMap<String, SecretString> its oauth2_headers returns. The server is B6590's server_record::MCPServer, read through its fields alias, server_name and access_groups.


  The value type. LiteLLM declares the lookup's map values as str | dict[str, str], but every producer at the pin builds the nested form (_get_mcp_server_auth_headers_from_headers, responses/utils.py L1118-L1126, mcp_streaming_iterator.py L396-L404), and only sink signatures name the plain string. The Rust map holds only the nested form, so the string arm of _client_has_per_server_auth_header has no input here and is not built.


  lookup.

  1. sanitize_alias_for_header(alias: &str) -> String is sanitize_mcp_alias_for_header: lowercase with str::to_lowercase, trim whitespace, replace every char outside a-z, 0-9 and underscore with one underscore (per char, not per run), collapse runs of underscores to one, then trim underscores from both ends. It must give the same bytes as the dashboard's TypeScript helper, which LiteLLM keeps in step with it.

  2. header_keys(identifier) is _header_keys_for_identifier: the lowercase form, then the sanitized form when that is non-empty and differs from the lowercase one. The lowercase form is not trimmed.

  3. lookup_server_auth(headers: &BTreeMap<String, BTreeMap<String, SecretString>>, alias: Option<&str>, server_name: Option<&str>, access_groups: &[String]) -> Option<&BTreeMap<String, SecretString>> is lookup_mcp_server_auth_in_headers. An empty map gives None. Index the map by lowercase key (B4654's reader already lowercases every alias, so two keys never fold into one in production). Walk alias, then server_name, skipping a missing or empty one; for each, try its header_keys in order, and the first key present decides: return its value. When no server key matches, walk access_groups in order without skipping empty names, take the first present key of each group, and collect those values. None collected gives None. When the collected maps are not all equal (same keys, same exposed values), log at debug "Ambiguous MCP group auth headers for server alias=<alias> (groups=<groups>); not forwarding any group credential" and return None, so a token never reaches a server it may not have been meant for. Otherwise return the first one. secrecy's SecretString has no PartialEq, so compare through expose_secret inside the function and never format a value.


  client_auth_headers.

  4. client_has_per_server_auth_header(server: &MCPServer, server_auth_headers: Option<&BTreeMap<String, BTreeMap<String, SecretString>>>) -> bool: None or an empty map gives false. Otherwise lookup_server_auth with the server's alias, server_name and access_groups (None reads as an empty list); a resolved map is true when one of its keys equals "authorization" ignoring ASCII case, and no match is false.

  5. client_has_passthrough_authorization(server, oauth2_headers: Option<&BTreeMap<String, SecretString>>, server_auth_headers) -> bool: true when oauth2_headers has a key equal to "authorization" ignoring ASCII case; otherwise client_has_per_server_auth_header(server, server_auth_headers).


  Tests, each calling the production functions with synthetic aliases and token values that start with test-: lookup::tests::sanitize_alias (rstest: mixed case, inner and outer spaces, dashes, dots, an underscore run, leading and trailing symbols, an empty result, the Kelvin sign and a dotted capital I), lookup::tests::server_key_order (rstest: an empty map, a match by the lowercase alias, a match only through the sanitized alias, alias winning over server_name, an empty alias skipped for server_name, the lowercase key tried before the sanitized one, uppercase map keys, no match), lookup::tests::group_default (rstest: one group with a header, two groups with equal maps, two groups with different maps giving None, one group without a header beside one with a header, an empty group name matching an empty alias key, a server key winning over a group key; and the ambiguous case asserting the debug line with the alias and groups and no token in any captured log), tests::per_server_authorization (rstest: None, an empty map, Authorization in any case, an Authorization with an empty value, a resolved map without one, a group credential, an ambiguous group) and tests::passthrough_authorization (rstest: a top-level Authorization in any case with any value, an empty oauth2 map falling through to the per-server header, both missing).


  Oracle. The helper operation is b10155 in the mcp group. Its input is a list of calls, each naming one function with its typed input: sanitize_alias with an alias; lookup with the header map, alias, server_name and access_groups; per_server_authorization and passthrough_authorization with a server object (alias, server_name, access_groups), the per-server map and, for the second, the top-level map. The Python adapter imports the pinned functions (the predicates through operations) and builds MCPServer from the server object plus server_id "test-server", name "test-server" and transport "http"; the Rust adapter builds B6590's MCPServer from the same fields. Both return the sanitized text, the resolved map or None, and the two booleans. No route reaches these functions on their own, so B8725 and the routes that mount it carry the HTTP cases.
