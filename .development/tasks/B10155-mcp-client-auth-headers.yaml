deviations: []
out_of_scope:
  - "Everything else in operations.py: B8195 (scoping and display names), B8196 (OAuth prefetch, header preparation, BYOK, token exchange and initialize handling, from L734), B8197 (listing), B8198 (execution and logging) and B8199 (gateway dispatch and prepare_context)."
  - "Everything else in utils.py: B4716 (normalize_server_name and the payload and name validators), B4682 (header sanitizing and the server-local prefix helpers), B6594 (tool-name, allowlist, env var, header merge and synthetic request helpers) and B3818 (result content rewriting)."
  - "The header readers server_auth_headers and oauth2_headers: B4654, on main. The 401 they gate: B8725. _get_server_auth_header and its shared-header fallback: B4726."
pitfalls:
  - "Lowercase with str::to_lowercase, not to_ascii_lowercase: Python's lower() turns the Kelvin sign (U+212A) into an ASCII k that survives sanitizing, and a dotted capital I (U+0130) into i plus a combining dot, so \"İ\" sanitizes to \"i\"."
  - "Empty or missing alias and server_name are skipped, but access group names are not, so a group named \"\" matches the key a header like x-mcp--authorization produces."
  - "A resolved per-server map counts as an upstream token when it has an authorization key, whatever its value; an empty x-mcp-{alias}-authorization still skips the 401."
  - "The top-level check looks only for the Authorization key B4654's oauth2_headers writes; it never reads the value, so it can't tell a gateway key from an upstream token, and the caller decides what that map holds."
  - "The ambiguity check compares whole header maps, not only the Authorization entry: two groups that send the same token with different extra headers still return None."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
