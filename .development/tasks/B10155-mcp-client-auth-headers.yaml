dod:
  - text: sanitize_alias_for_header lowercases, trims, turns each char outside a-z, 0-9 and underscore into one underscore, collapses underscore runs and trims underscores, and matches LiteLLM on mixed case, spaces, dashes and non-ASCII input.
    proof: [case-sanitize-alias, oracle, helper-python]
  - text: lookup_server_auth returns None for an empty map, tries the lowercase then the sanitized form of the alias and then of server_name, skips a missing or empty identifier, and matches uppercase map keys.
    proof: [case-server-key-order, oracle, helper-python]
  - text: Without a server key, lookup_server_auth returns a group map only when every matching group carries an equal map, returns None for different maps, does not skip an empty group name, and logs the ambiguity at debug without any header value.
    proof: [case-group-default, oracle, helper-python]
  - text: client_has_per_server_auth_header is true only when the resolved map has an Authorization key in any case, empty value included, and false for no map, an empty map, no match or an ambiguous group.
    proof: [case-per-server-authorization, oracle, helper-python]
  - text: client_has_passthrough_authorization is true for a top-level Authorization key in any case and otherwise gives the per-server answer.
    proof: [case-passthrough-authorization, oracle, helper-python]
  - text: The b10155 adapters compare the pinned functions with this module on new cases, and every new seed replays through the shared helper case parser.
    proof: [new-oracle-cases, oracle, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: case-sanitize-alias
      why: an alias sanitizes to different bytes than LiteLLM and the dashboard
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client_auth_headers::lookup::tests::sanitize_alias($|::)/)'
    - id: case-server-key-order
      why: the alias, server name or candidate key order differs from LiteLLM's lookup
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client_auth_headers::lookup::tests::server_key_order($|::)/)'
    - id: case-group-default
      why: a group credential is forwarded when groups disagree, or the ambiguity log leaks a value
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client_auth_headers::lookup::tests::group_default($|::)/)'
    - id: case-per-server-authorization
      why: the per-server Authorization check disagrees with LiteLLM, so a client is challenged wrongly
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client_auth_headers::tests::per_server_authorization($|::)/)'
    - id: case-passthrough-authorization
      why: the pass-through check misses a top-level Authorization or skips the per-server fallback
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client_auth_headers::tests::passthrough_authorization($|::)/)'
    - id: helper-python
      why: the b10155 adapter is missing or fails the strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10155.py tools/oracle/helpers/b10155)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no new b10155 seed reaches the shared helper case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/mcp-client-auth-headers-*")" &&
        grep -lE 'b10155"?:' tools/oracle/fuzz/corpus/helper_case/mcp-client-auth-headers-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-mcp --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: new-oracle-cases
      why: no new client auth header case was added on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-client-auth-headers)"
