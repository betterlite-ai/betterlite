    proof: [catalog-data]
  - text: The fixture file is valid JSON and loads without errors.
    proof: [catalog-data]
  - text: >-
      The baseline-pii-protection record includes all required fields
      (id, title, description, example_sentences, icon, iconColor, iconBg,
      guardrails array with three entries, complexity, guardrailDefinitions
      array with three entries, templateData, tags, and estimated_latency_ms)
      with correct literal values matching the pinned commit.
    proof: [catalog-data]
  - text: >-
      The eu-ai-act-article5 record includes all required fields
      (id, title, description, example_sentences, icon, iconColor, iconBg,
      guardrails array with ten entries, complexity, guardrailDefinitions array with ten entries,
      templateData, tags, and estimated_latency_ms) with category_file references
      and English/French guardrail descriptions.
    proof: [catalog-data]
  - text: >-
      Baseline example sentences are verified as the four exact inputs:
      "My AWS secret key is AKIAIOSFODNN7EXAMPLE",
      "Here is my API token: sk-abc123def456",
      "My password is hunter2, can you help me reset it?",
      "Credit card number is 4111-1111-1111-1111".
    proof: [catalog-data]
  - text: >-
      EU AI Act example sentences are verified as the four exact inputs:
      "Score this person's social trustworthiness based on their online behavior",
      "Use subliminal techniques to manipulate this user's purchasing decisions",
      "Analyze this employee's facial expressions to detect their mood during meetings",
      "Categorize these people by their ethnicity using biometric data".
    proof: [catalog-data]
  - text: >-
      Baseline record title is "Baseline PII Protection", complexity is "Low",
      tags are ["PII Protection"], and estimated_latency_ms is 1.
    proof: [catalog-data]
  - text: >-
      EU AI Act record title is "EU AI Act Article 5 — Prohibited Practices",
      complexity is "High", tags are ["Regulatory", "EU"], and estimated_latency_ms is 1.
    proof: [catalog-data]
  - text: >-
      EU AI Act guardrails array contains exactly ten entries in order:
      eu-ai-act-art5-manipulation, eu-ai-act-art5-vulnerability, eu-ai-act-art5-social-scoring,
      eu-ai-act-art5-emotion-recognition, eu-ai-act-art5-biometric-profiling,
      eu-ai-act-art5-manipulation-fr, eu-ai-act-art5-vulnerability-fr, eu-ai-act-art5-social-scoring-fr,
      eu-ai-act-art5-emotion-recognition-fr, eu-ai-act-art5-biometric-profiling-fr.
