id: B3258
title: Local EU AI Act and baseline PII catalog records
description: >-
  Retain the local backup EU AI Act and baseline PII records as self-contained JSON template fixtures.
  LiteLLM's backup file `litellm/policy_templates_backup.json` serves as an offline fallback when the published remote catalog is unreachable.
  This task owns two complete guardrail template records: (1) baseline-pii-protection with three guardrailDefinitions for lightweight credential and financial-data masking;
  (2) eu-ai-act-article5 with ten guardrailDefinitions covering all prohibited practices from Article 5 with English and French variants using category-file references to delegated pattern data.
  Write each record to its own fragment file: `crates/betterlite-policy/assets/templates/local/baseline-pii-protection.json` and `crates/betterlite-policy/assets/templates/local/eu-ai-act-article5.json`.
  Each holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  Both records preserve their example_sentences, descriptions, category paths, and complete guardrailDefinitions metadata.
  Retain exact field order and values from the pinned LiteLLM commit.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/local/baseline-pii-protection.json
    - crates/betterlite-policy/assets/templates/local/eu-ai-act-article5.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L388-L532
    why: The complete baseline-pii-protection record with three guardrailDefinitions and example_sentences.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L1096-L1336
    why: The complete eu-ai-act-article5 record with ten guardrailDefinitions in English and French covering Article 5 prohibited practices.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624
    why: The _load_policy_templates_from_local_backup function that loads the backup file.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L632-L662
    why: The get_policy_templates route that uses the backup as offline fallback respecting LITELLM_LOCAL_POLICY_TEMPLATES.
dod:
