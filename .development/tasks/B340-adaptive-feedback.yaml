id: B340
title: Adaptive feedback signals and caller attribution
description: 'Wire B376 feedback signals to B339 learning cells using B012 final-call observations and
  B052 caller identity. Maintain caller-scoped session context, attribute prior-response feedback correctly
  and produce typed state deltas for B341. Enforce bounded session history and exclude raw prompt/tool
  text from persistable snapshots. Nonmonetary statistical arithmetic uses f64 only in feedback_math;
  put one module-level #[expect(clippy::float_arithmetic, reason = "pinned statistical routing arithmetic")]
  there, counted in this task budget. Money, prices, spend and budgets stay rust_decimal::Decimal, including
  database and wire boundaries. Reject nonfinite statistical input. Assert selected model/tier exactly;
  any opt-in tolerance is for diagnostic scores only, never a different selection. Keep OWNER_CACHE_TTL_SECONDS=86400
  and sweep threshold 1024. Add a hard cap of 1024 live session records; evict the least recently used
  record after sweeping expired entries, warn and continue without altering the served model. Implement
  the owned native service in crates/betterlite-router/src/adaptive_feedback.rs. Add ProbeOperation::AdaptiveFeedback
  in tools/oracle/src/router_probes/mod.rs and the corresponding B340 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/adaptive_router/adaptive_router.py:
  AdaptiveRouter.get_or_create_session_state (L322-L347), AdaptiveRouter._evict_expired_session_states
  (L349-L355), AdaptiveRouter.record_turn (L357-L487), AdaptiveRouter._persistable_session_snapshot (L490-L499),
  AdaptiveRouter._compute_bandit_delta (L502-L515). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Function coverage in litellm/router_strategy/adaptive_router/hooks.py: _resolve_session_key (L44-L86),
  _last_user_content (L89-L103), _recent_tool_results (L106-L135), _assistant_content_and_tool_calls (L138-L170),
  AdaptiveRouterPostCallHook.__init__ (L176-L177), AdaptiveRouterPostCallHook.async_post_call_response_headers_hook
  (L179-L201), AdaptiveRouterPostCallHook.async_log_success_event (L203-L204), AdaptiveRouterPostCallHook.async_log_failure_event
  (L206-L211), AdaptiveRouterPostCallHook._record (L213-L255). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports. If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001 only
  on its explicitly named score/probability pointer. Selection, tie order, counts, statuses, money and
  provider requests remain exact. Six-decimal wire signals are compared after the source rounding, without
  widening tolerance.'
