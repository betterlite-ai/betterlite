id: B340
title: Adaptive feedback signals and caller attribution
description: Implement the pinned feedback detectors and bounded per-session feedback context around B339.
  Attribute the current user's feedback to the preceding response model and current response signals to
  the current model, using B012 call metadata and B052 identity. Wire hooks to final responses/failures
  and accumulate typed state deltas for B341. Persistable snapshots exclude prompt, assistant text and
  tool arguments. Use the existing Rust crate boundaries from B004 and B008; integrate through the server
  when the provider dispatcher or callbacks live in another core crate. This task's source slices are
  the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target
  and committed corpus for every newly accepted config form; unsupported keys still fail by full path.
  Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle cases are
  budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/adaptive-feedback/**
  - tools/oracle/src/router_probes/adaptive-feedback/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/adaptive_feedback.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/signals.py#L105-L330
  why: Signal detection, deduplication and state progression.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/hooks.py#L44-L255
  why: Scoped session identity and hook extraction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L322-L515
  why: Feedback ownership, bounded contexts and delta mapping.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(adaptive_feedback)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/adaptive-feedback/current-versus-previous-model.yaml
- tools/oracle/cases/routing/adaptive-feedback/general-turn-keeps-original-type.yaml
- tools/oracle/cases/routing/adaptive-feedback/signal-minimum-message-gate.yaml
- tools/oracle/cases/routing/adaptive-feedback/satisfaction-credit-once.yaml
- tools/oracle/cases/routing/adaptive-feedback/repeated-tool-loop.yaml
- tools/oracle/cases/routing/adaptive-feedback/exhaustion-not-quality-failure.yaml
- tools/oracle/cases/routing/adaptive-feedback/session-caller-isolation.yaml
- tools/oracle/cases/routing/adaptive-feedback/context-expiry-and-cap.yaml
- tools/oracle/cases/routing/adaptive-feedback/snapshot-excludes-text.yaml
deviations: []
out_of_scope:
- Database queue and reload (B341).
- An LLM judge or embedding-based feedback detector.
pitfalls:
- A session identifier alone is insufficient to isolate two API keys.
- A closing thanks message must not move code feedback into the general request bucket.
- Do not persist raw transcript fields just because the in-memory detector needs them.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
