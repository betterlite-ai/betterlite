deviations:
- what: Adaptive feedback context has a hard cap of 1024 live sessions with LRU eviction after expiry
    sweep.
  why: The source only sweeps expired sessions at 1024 and remains unbounded while all sessions are active.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L322-L360
