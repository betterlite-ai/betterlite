dod:
  - text: Routing, supported params, base URL, account id rules, endpoint URLs and auth headers match LiteLLM for JWT and pat/ keys and for Claude and other models.
    proof: [config-tests, helper-python, helper-case-corpus]
  - text: The OpenAI-family body keeps LiteLLM's key order and max token rule, and the Claude body matches in system, tools, tool_choice, max_tokens and cache control handling.
    proof: [request-tests, helper-python, helper-case-corpus]
  - text: Claude message conversion matches LiteLLM for system parts, tool_use and tool_result grouping, signed thinking blocks and image_url and document blocks.
    proof: [message-tests, helper-python, helper-case-corpus]
  - text: Chat and embedding replies match LiteLLM for the model prefix, stop reason map, usage, hidden model and nested embeddings.
    proof: [response-tests, reply-corpus, helper-python, helper-case-corpus]
  - text: The stream parser routes OpenAI and Anthropic chunks the way LiteLLM does and never reports usage on the OpenAI path.
    proof: [stream-tests, reply-corpus, helper-python, helper-case-corpus]
  - text: New helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: config-tests
      why: the routing, params, URL or header tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^snowflake::config::/)'
    - id: request-tests
      why: the chat or embedding request body tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^snowflake::request::/)'
    - id: message-tests
      why: the Claude message, tool or tool_choice tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^snowflake::messages::/)'
    - id: response-tests
      why: the chat or embedding response tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^snowflake::response::/) + test(/^snowflake::embedding::/) - test(replays_the_snowflake_reply_corpus)'
    - id: stream-tests
      why: the stream chunk tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^snowflake::stream::/)'
    - id: reply-corpus
      why: the reply fuzz target or its fresh replay corpus is missing
      run: >-
        test -f crates/betterlite-provider/fuzz/fuzz_targets/snowflake_reply.rs &&
        grep -q 'name = "snowflake_reply"' crates/betterlite-provider/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/snowflake_reply)" &&
        cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_snowflake_reply_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5844)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5844 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5844/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added Snowflake helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/snowflake-*")" &&
        grep -lE '^[[:space:]]+b5844:' tools/oracle/fuzz/corpus/helper_case/snowflake-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/snowflake/url-and-account.yaml
  - tools/oracle/cases/helpers/snowflake/headers-and-key.yaml
  - tools/oracle/cases/helpers/snowflake/supported-and-mapped-params.yaml
  - tools/oracle/cases/helpers/snowflake/openai-request.yaml
  - tools/oracle/cases/helpers/snowflake/claude-request-options.yaml
  - tools/oracle/cases/helpers/snowflake/claude-messages.yaml
  - tools/oracle/cases/helpers/snowflake/claude-tools.yaml
  - tools/oracle/cases/helpers/snowflake/openai-response.yaml
  - tools/oracle/cases/helpers/snowflake/claude-response.yaml
  - tools/oracle/cases/helpers/snowflake/stream-chunks.yaml
  - tools/oracle/cases/helpers/snowflake/embedding.yaml
deviations: []
out_of_scope:
  - B042 owns _complete_snowflake and the embedding branch in main.py (L7297-L7298), the SNOWFLAKE_JWT and SNOWFLAKE_ACCOUNT_ID env reads, get_llm_provider_logic (L811-L815), the HTTP calls, provider registration in dispatch and the HTTP oracle cases.
  - SnowflakeBase.validate_environment in common_utils.py has no caller at the pin (the configs use SnowflakeBaseConfig), so it is not built and has no case.
  - SnowflakeConfig.get_config only calls the parent and the class has no config attributes, so B2202's get_config covers it.
  - "The Anthropic helpers stay with their owners and are only called here: B578 extract_response_content, B579 calculate_usage, B571 normalize_cache_control_in_anthropic_payload, B581 and B582 the Anthropic chunk parser, B222 convert_to_anthropic_tool_result and create_anthropic_image_param, B223 select_anthropic_content_block_type_for_file and anthropic_process_openai_file_message, B183 async_inline_remote_media."
  - B2214 owns the base iterator and its line decoding, B668 owns OpenAIError, and B2202 owns BaseLLMException and the base config.
pitfalls:
  - 'The Claude test needs the dash or underscore: "claude-3-5-sonnet" and "Snowflake/CLAUDE_x" are Claude, "claude3" and "mistral-large" are not.'
  - The body model uses a case-sensitive removeprefix("snowflake/"), so "Snowflake/claude-3-5-sonnet" routes as Claude and still sends the model with its capital S prefix.
  - The account id regex uses re.match with "$", which also accepts one trailing newline after a valid id, and an api_base that is given skips it and leaves account_id in optional_params to reach the body.
  - An empty-string api_key is not None, so validate_environment sends "Bearer " and KEYPAIR_JWT, and "pat/" alone gives an empty PAT token.
  - validate_environment overwrites Content-Type and Accept on the headers it was given but keeps every other header.
  - OpenAI body merge order lets extra_body override stream and model, and a max_tokens inside extra_body survives next to the max_completion_tokens the code adds.
  - 'max_completion_tokens 0 with max_tokens 5 sends 5 on the OpenAI path, and 0 with no max_tokens sends no limit at all.'
  - The Claude max_tokens default 4096 is applied after extra_body is merged, and system is added to the body after the cache control normalization, so it is normalized on its own.
  - A tool message joins the previous user entry only when that entry's first content block is a tool_result, so a user text turn between two tool messages starts a fresh user entry.
  - An assistant text block is built from content as it is whenever tool_calls exist, even when content is a list.
  - Tool call arguments that decode to a non-object JSON value (for example 5) are used as the tool_use input without a check.
  - Embedding requests keep the "snowflake/" prefix in model, while chat bodies drop it.
  - Embedding replies fail on an item whose embedding array is empty, and each item is replaced by element 0 only.
  - The OpenAI stream path sets usage to None, so a final usage-only chunk produces the empty chunk and no usage is ever reported on it.
  - 'Only delta.tool_calls[0] is read, and delta.reasoning_content is ignored on the OpenAI stream path.'
  - A stream chunk with a "choices" key goes to the OpenAI path even when it also has a type key.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
