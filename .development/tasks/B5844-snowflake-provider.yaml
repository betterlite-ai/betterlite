id: B5844
title: Snowflake Cortex chat, Claude messages and embedding transforms
description: >-
  Build the Snowflake Cortex transforms in betterlite-provider as one module, snowflake, with submodules config, request,
  messages, response, stream and embedding (litellm/llms/snowflake/**). Everything is a pure function. Credentials, the
  base URL and the account id are plain arguments: B042 reads SNOWFLAKE_JWT and SNOWFLAKE_ACCOUNT_ID and does the HTTP
  calls. The module needs betterlite-provider to depend on betterlite-anthropic and betterlite-prompts (neither depends
  on betterlite-provider, so there is no cycle). Define SnowflakeError for the three ValueError texts and the embedding
  error class SnowflakeException (message, status_code, headers) on top of the B2202 base error.

  Routing. A model is a Claude model when, lowercased and with a leading "snowflake/" removed, it starts with "claude-"
  or "claude_". Claude models use the Anthropic Messages dialect, every other model uses OpenAI chat completions. The
  test is lowercase but the body model is cut with a case-sensitive removeprefix("snowflake/") and never lowercased.

  Config (utils.py L16-L102, chat L198-L264). get_supported_openai_params for chat is temperature, max_tokens,
  max_completion_tokens, top_p, stream, tools, tool_choice, plus thinking for Claude models. The embedding config uses
  the base list: temperature, max_tokens, top_p, stream, response_format, tools, tool_choice. map_openai_params copies
  every supported key of non_default_params into optional_params and ignores the rest, with no drop or error.
  _get_api_base(api_base, optional_params, account_id_env): a falsy api_base takes account_id from optional_params
  (popped when the key exists, whatever its value) and otherwise from the env argument; None raises "Missing snowflake
  account_id"; a value that fails re.match of ^[a-zA-Z0-9_-]+$ raises "Invalid account_id format"; the base becomes
  https://{id}.snowflakecomputing.com/api/v2. Then trailing "/" characters are stripped and "/api/v2" is appended when
  missing. A given api_base is never validated and leaves account_id in optional_params. get_complete_url appends
  /cortex/v1/messages for Claude models, /cortex/v1/chat/completions for the rest, and /cortex/inference:embed for
  embeddings. validate_environment raises "Missing Snowflake JWT key" for a None key; an api_key starting with "pat/"
  loses that prefix and sets X-Snowflake-Authorization-Token-Type to PROGRAMMATIC_ACCESS_TOKEN, otherwise it is
  KEYPAIR_JWT. It updates the given headers with Content-Type and Accept application/json, Authorization "Bearer {key}"
  and that token type, and Claude models add anthropic-version 2023-06-01. _get_openai_compatible_provider_info returns
  api_base unchanged and api_key or the JWT env argument. The chat error class is OpenAIError (B668), the embedding one
  SnowflakeException.

  Chat request. transform_request pops stream (default false) and extra_body (default empty) from optional_params, then
  builds the body for the model family. OpenAI body keys, in order: model without "snowflake/", messages, stream, the
  remaining optional_params, extra_body. max_tokens and max_completion_tokens are both popped first and the value
  max_completion_tokens-or-max_tokens (the Python "or", so 0 falls through) is written last as max_completion_tokens
  when it is not None. Claude body: pop system from optional_params as the passthrough system; split the messages with
  _extract_system_and_messages; system is the passthrough when it is not None, else the extracted list or none. Convert
  tools with _transform_tools_to_anthropic and tool_choice with _transform_tool_choice_to_anthropic. Pop
  max_completion_tokens and copy it to max_tokens only when it is truthy and max_tokens is absent. Build model
  (prefix removed), messages, stream, optional_params, extra_body, run normalize_cache_control_in_anthropic_payload
  (B571) on that body, then set system from the same function applied to {"system": system} when system is not None,
  and set max_tokens 4096 when the body still has none. The async variant inlines remote media with B183 for Claude
  models only, then calls the same sync transform; take the fetcher B183 needs as an injected argument.

  Claude messages (L298-L396). system messages: a non-empty string becomes one text block; a list keeps only blocks of
  type text, with text defaulting to "" and cache_control carried when the key exists; empty strings and other
  contents add nothing. assistant with tool_calls: signed thinking blocks first (a block with a truthy signature or
  type redacted_thinking, copied), then a text block when content is truthy, then one tool_use per call with id, name
  and input; string arguments are JSON-decoded and a decode error gives {}, a non-string value is used as it is.
  assistant without tool_calls but with signed thinking blocks: list content becomes thinking blocks then a deep copy of
  the content, string content becomes thinking blocks then one text block when non-empty. Any other assistant keeps its
  content untouched. tool messages: tool_call_id counts only when it is a string, else "". Non-list content becomes a
  tool_result block with content as the string or its JSON text; list content goes through B222's
  convert_to_anthropic_tool_result with force_base64 true; the message-level cache_control is added to the block when
  not None. The block joins the previous conversation entry when that is a user message whose list content starts with
  a tool_result block, else it starts a new user message. Every other role keeps its role and its content passes
  through _convert_image_url_blocks_to_anthropic: a list content has each image_url block replaced. The URL is the
  image_url string or its url field; no URL leaves the block as it is. A data URI whose media type
  (data:([^;,]+)) B223's select_anthropic_content_block_type_for_file maps to "document" goes through B223's
  anthropic_process_openai_file_message as file_data; otherwise B222's create_anthropic_image_param runs with the
  image_url object or string, its format field when a string, and is_bedrock_invoke true. A block cache_control that is
  not None is added to the converted block. Tools: a function tool becomes name (default ""), description when the key
  exists, input_schema from parameters minus a top-level "$schema" key or {type: object, properties: {}} when parameters
  is absent; any other tool keeps its shape and only cleans a present input_schema the same way. tool_choice: strings
  auto, required, none map to {type: auto}, {type: any}, {type: none} and unknown strings to auto; a dict of type
  function becomes {type: tool, name}; any other dict passes through; any other value is {type: auto}.

  Responses. OpenAI family: the JSON body is the response; model becomes "snowflake/" + (model or ""), and the
  request model is stored in hidden_params.model; the raw body is logged through post_call first. Claude family: log the
  body, take text, thinking blocks, reasoning content and tool calls from B578's extract_response_content, map
  stop_reason end_turn, max_tokens, tool_use, stop_sequence to stop, length, tool_calls, stop (missing is end_turn,
  unknown is stop), build one choice at index 0 whose message content is the text or None, tool_calls or None, plus
  thinking_blocks and reasoning_content, and set usage with B579's calculate_usage over the usage object (default {})
  and the whole body. The response model is "snowflake/" + (body model, default the request model), id is the body id
  or "", and hidden_params.model is the request model. Embedding: every data item's embedding is replaced by its first
  element (the Cortex array is nested), model becomes "snowflake/" + (model or ""), hidden_params.model is the request
  model. The embedding request is {"text": input, "model": model, ...optional_params} with the model unchanged and
  later keys overriding earlier ones.

  Stream. get_model_response_iterator builds SnowflakeStreamingHandler over B2214's base iterator with the sync flag
  and json_mode (default false), and also an Anthropic chunk parser (B581/B582) over the same stream. chunk_parser
  sends a chunk that has a "choices" key to the OpenAI path and every other chunk to the Anthropic parser. The OpenAI
  path returns an empty chunk (empty text, not finished, empty finish reason, no usage, index 0, no tool call) for an
  empty choices list. Otherwise it reads only choices[0]: text is delta.content or "", finish_reason is the choice
  value or "", is_finished is finish_reason != "", index is the choice index (default 0), and only the first entry of
  delta.tool_calls becomes a tool chunk with id, function name and arguments defaulting to "", type function and index
  default 0. usage is always None on this path.

  The response bodies and stream chunks come from the network, so add a cargo-fuzz target snowflake_reply in
  crates/betterlite-provider/fuzz that feeds arbitrary bytes to the chat reply decoder, the embedding reply decoder and
  the chunk parser, plus a check that replays its corpus.

  Sizing: about 680 nonblank, noncomment LiteLLM lines. Plan 560 transform lines, 430 tests, 120 fuzz and exports and
  190 helper adapters.
scope:
  paths:
    - crates/betterlite-provider/src/snowflake.rs
    - crates/betterlite-provider/src/snowflake/**
    - crates/betterlite-provider/Cargo.toml
    - crates/betterlite-provider/fuzz/Cargo.toml
    - crates/betterlite-provider/fuzz/fuzz_targets/snowflake_reply.rs
    - crates/betterlite-provider/fuzz/corpus/snowflake_reply/**
    - tools/oracle/cases/helpers/snowflake/**
    - "tools/oracle/fuzz/corpus/helper_case/snowflake-*"
    - tools/oracle/helpers/b5844.py
    - tools/oracle/helpers/b5844/**
    - tools/oracle/src/helpers/provider/b5844.rs
    - tools/oracle/src/helpers/provider/b5844/**
  lint_tables: false
