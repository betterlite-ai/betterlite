  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/snowflake/chat/transformation.py#L50-L264
    why: Claude model test, image block conversion, thinking block filter, supported params, URL and headers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/snowflake/chat/transformation.py#L266-L396
    why: Tool conversion and the system, assistant and tool message split.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/snowflake/chat/transformation.py#L398-L516
