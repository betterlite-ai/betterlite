id: B8606
title: Mount the common provider and OpenAI pass-through routes
description: >-
  B8640 builds the shared pass-through state and calls `openai_common::mount` and `openai_common::mount_public` with a stub body. This task fills crates/betterlite-server/src/app/pass_through/routes/openai_common.rs (and its folder for tests) so the routes of B3619 and B3628 answer through the booted proxy, and it takes over their HTTP oracle cases, which could not pass at their own gates.
  Read everything from B8640's `PassThroughState`; never read Shared here. Read each deps struct's merged fields and fill them from PassThroughState; when a field has no source there, stop and report.

  `mount(router, ps)` merges:
  - B3619's `common_routes_router` with B3613's HandlerDeps from ps: `/cohere/{*endpoint}`, `/mistral/{*endpoint}`, `/typesafe/{*endpoint}`, `/openrouter/{*endpoint}`, `/anthropic/{*endpoint}`, `/cursor/{*endpoint}`, and POST, PUT, DELETE and PATCH on `/openai_passthrough/{*endpoint}`;
  - B3628's router: GET, POST, PUT, DELETE and PATCH on `/openai/{*endpoint}` (its own GET handler picks the WebSocket route for an upgrade), the WebSocket paths `/deepgram/v1/listen` and `/deepgram/listen`, and `/nvidia_nim/{*endpoint}`. Its deps take ps's `AxumSocketServe` as the `SocketServePort`, B8641's AllowlistAdapter as `ModelAllowlistPort`, ps's WebSocketRelay as `WebSocketRelayPort`, the router hop for the NVIDIA relay, and `config.sections.passthrough_websocket` for the switch;
  - one GET handler on `/openai_passthrough/{*endpoint}`. A request with `connection: upgrade` and `upgrade: websocket` (case-insensitive) goes to ps's SocketServePort with `SocketAuth::Key` and a route closure that calls B3628's `openai_websocket_route`. Every other GET goes to B3619's `openai_alias_route`. LiteLLM serves both forms on this path (llm_passthrough_endpoints.py L3105 and openai_passthrough_endpoints.py), and axum allows only one GET handler per path.
  `mount_public(router, ps)` merges B3619's `gemini_router` (`/gemini/{*endpoint}`), outside the auth layers: LiteLLM's Gemini route has no auth dependency and authenticates the `key` query value or the `x-goog-api-key` header itself through B052.

  Oracle cases. Take over B3619's 15 cases and the seven HTTP cases of B3628 (the openai-route and nvidia ones) at their paths; do not move or rename the files. Add two cases of your own under tools/oracle/cases/server/pass-through-openai/: `GET /openai/v1/models` with no Authorization header (the auth error through the booted proxy), and `GET /openai_passthrough/v1/models` with the master key and OPENAI_API_KEY unset in the case environment (a plain GET on a path that also serves WebSockets still reaches the HTTP route and answers LiteLLM's 500 with the missing key message).
