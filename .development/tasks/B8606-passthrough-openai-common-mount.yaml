deviations: []
out_of_scope:
  - "The route logic: B3619 and B3628. The shared state and AxumSocketServe: B8640. The socket bridge: B8642."
  - "The realtime WebSocket routes (/openai/v1/realtime, /v1/realtime, /realtime): the inference wiring part. axum's static path wins over /openai/{*endpoint}, as the earlier app.websocket registration wins in LiteLLM."
pitfalls:
  - "An upgrade request is a GET, so a WebSocket route and an HTTP GET route on one path collide in axum; one handler picks by the upgrade headers."
  - "The Gemini route must not sit behind the global auth stage, or a request that carries its key only as `?key=` gets a 401 that LiteLLM never sends."
  - "OPENAI_API_KEY and FAL_AI_API_KEY style env values must be set or unset per case, since the oracle boots both proxies with the case environment."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
