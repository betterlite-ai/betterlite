  paths:
    - crates/betterlite-server/src/app/pass_through/routes/openai_common.rs
    - crates/betterlite-server/src/app/pass_through/routes/openai_common/**
    - tools/oracle/cases/server/pass-through-openai/**
    - tools/oracle/cases/server/passthrough-common-routes/**
    - tools/oracle/cases/server/passthrough-relays/openai-route-forwards-chat.yaml
    - tools/oracle/cases/server/passthrough-relays/openai-route-missing-key.yaml
    - tools/oracle/cases/server/passthrough-relays/openai-route-threads-beta.yaml
    - tools/oracle/cases/server/passthrough-relays/nvidia-infer-forwards.yaml
    - tools/oracle/cases/server/passthrough-relays/nvidia-no-group-400.yaml
    - tools/oracle/cases/server/passthrough-relays/nvidia-mixed-group-400.yaml
    - tools/oracle/cases/server/passthrough-relays/nvidia-stream-sse.yaml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L3105-L3110
    why: The two WebSocket decorators that share their paths with the HTTP routes of /openai and /openai_passthrough.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/openai_passthrough_endpoints.py#L1-L42
    why: The /openai_passthrough HTTP route and its methods.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L313-L379
    why: gemini_proxy_route, registered without the user_api_key_auth dependency.
dod:
  - text: Every path of B3619 and B3628 reaches its handler through the merged app, and the merge does not panic.
    proof: [registration-tests, oracle]
  - text: On /openai_passthrough an upgrade GET reaches openai_websocket_route after WebSocket auth and every other GET reaches openai_alias_route.
    proof: [shared-path-tests, oracle]
  - text: The Gemini route answers a request whose key is only in the query or in x-goog-api-key, so it sits outside the auth layers.
    proof: [registration-tests, oracle]
  - text: The common provider, OpenAI and NVIDIA routes answer through the booted proxy as LiteLLM does.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: registration-tests
      why: a common provider or OpenAI path is not mounted, sits on the wrong side of the auth layers, or two routers collide
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::pass_through::routes::openai_common::tests::registration(::|$)/)'
    - id: shared-path-tests
      why: a GET on /openai_passthrough reaches the wrong form or a socket runs without auth
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::pass_through::routes::openai_common::tests::shared_path(::|$)/)'
