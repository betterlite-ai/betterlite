id: B3007
title: Enforce agent session budgets
description: >-
  Implement `betterlite-auth::session_budget` with pre-call admission and successful-response
  charging for registered agents. Keep `LITELLM_MAX_BUDGET_PER_SESSION_TTL=3600`, `{session_budget:<session_id>}:spend`,
  metadata precedence, positive-cost-only increments and warning-backed Redis-to-memory fallback.
  Pre-call admission extracts session_id from request metadata, falling back to litellm_metadata,
  and checks if current spend exceeds max_budget_per_session from the agent's litellm_params.
  Post-call success charging reads session_id and agent_id only from kwargs['litellm_params']['metadata']
  with no litellm_metadata fallback (this asymmetry from LiteLLM's own behavior is preserved).
  Spend increments only for positive response_cost values. Agents are resolved via the registry
  at both pre-call and success time (the success callback uses the live registry, not the pre-call
  auth snapshot). Cache reads try Redis first, fall back to in-memory on exception, and log
  warnings without failing the request. The Lua script atomically increments and sets TTL only
  on first write. Expose a typed session-budget handler class in the session-budget module;
  task B071 registers it once at server startup.

scope:
  paths:
    - crates/betterlite-auth/src/session_budget.rs
    - crates/betterlite-auth/src/session_budget/**
    - tools/oracle/cases/auth/session-budget/**
  lint_tables: false

