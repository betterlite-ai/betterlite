id: B914
title: Assemble Responses output from chat completions
description: >-
  Implement chat-to-Responses assembly in betterlite-core::api::responses_chat_output. Own
  the live status/incomplete-detail, response/choice assembly, interpreter-result extraction,
  thinking serialization, reasoning/message extraction and output-text methods in the references.
  Reuse B913's tool outputs, B1115's image/citation/usage conversion and B907's response
  tool choice. B004/B902/B1138 provide records. Inject UUIDs for rs_/msg_ IDs; preserve the
  chat response id and timestamp exactly. request_input is accepted but unused at the pin.

  Register responses_chat_output in B171 and compare public JSON plus the hidden-parameter
  projection used by later routing/logging. This task parses no new external bytes; dictionaries
  enter through B004's ModelResponse constructor. Remove the dead output-to-chat conversion
  pair from planned implementation: its only internal call is from an otherwise uncalled function.
  Live source totals 242 nonblank/non-comment lines. Allow 250 implementation, 165 tests,
  100 fixtures, 85 adapters and 25 wiring, totaling 625.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_chat_output.rs
  - crates/betterlite-core/src/api/responses_chat_output/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_chat_output.rs
  - tools/oracle/src/helpers/core_ops/responses_chat_output/**
  - tools/oracle/helpers/responses_chat_output.py
  - tools/oracle/helpers/responses_chat_output/**
  - tools/oracle/fuzz/corpus/helper_case/responses_chat_output-*
  - tools/oracle/cases/helpers/responses-chat-output/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2266-L2304
  why: Response status and incomplete_details depend on the first choice's finish reason.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2405-L2597
  why: Complete response assembly, output ordering, interpreter replacement and reasoning extraction.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2692-L2722
  why: Image-bearing choices take precedence over visible message content.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2768-L2782
  why: OutputText uses message.content and B1115's annotation conversion without altering text.
dod:
- text: >-
    output_defaults converts chat id=chat_a,created=1,model=m,assistant content=hi,finish=stop
    to id=chat_a,created_at=1,model=m,object=response,status=completed,metadata={},
    parallel_tool_calls=false,temperature=0,tool_choice=auto,tools=[],reasoning=null,text={},
    null optional error/instructions/top_p/max_output_tokens/previous_response_id/truncation/user,
    and B1115 usage. Existing attributes, including explicit null, override getattr defaults.
    _hidden_params is copied; truthy hidden provider_specific_fields is surfaced publicly.
  proof: [output-tests, oracle, output-adapter]
- text: >-
    finish_status maps null,stop,tool_calls,function_call,unknown to completed and
    length,content_filter,refusal to incomplete. Missing incomplete_details becomes
    {reason:max_output_tokens} for length and {reason:content_filter} for content_filter/refusal;
    existing incomplete_details wins. The first choice controls overall status, while each
    output message/reasoning item uses its own choice's finish reason. No choices yields completed.
  proof: [output-tests, oracle, output-adapter]
- text: >-
    output_order places reasoning first, all message/image items second, then B913 tool items.
    A choice with truthy images uses B1115 image outputs even if it also has content=hi;
    if all its images normalize away, text is still omitted. content=null gives no message,
    content="" gives a message with id=msg_<UUID>,role copied,one output_text block and citations.
    Request tool_choice is normalized by B907; response.tools comes from the chat result.
  proof: [output-tests, oracle, output-adapter]
- text: >-
    reasoning_output selects the first choice with nonempty reasoning_content or preserved
    thinking blocks, not necessarily choice zero. Blocks with truthy signature or data are
    serialized compactly into encrypted_content regardless of block type; other blocks drop.
    Reasoning text creates one output_text block with annotations=[]; signed-only reasoning
    creates content=[] and encrypted_content. Output id starts rs_,role=assistant and status
    follows that choice. No reasoning produces no reasoning item; absent cipher remains null
    internally and B1138 strips it on serialization.
  proof: [output-tests, oracle, output-adapter]
- text: >-
    interpreter_replacement reads message.provider_specific_fields.code_interpreter_results
    only from a dict with a nonempty list. Dict items construct OutputCodeInterpreterCall;
    typed items pass through and malformed dicts raise validation errors. A result id=c
    replaces only function_call with call_id=c in place, never custom calls; unmatched results
    are not appended. Duplicate result IDs use the last result. Other output ordering is preserved.
  proof: [output-tests, oracle, output-adapter]
checks:
  optional: []
  commands:
  - id: output-tests
    why: response defaults, finish status or output replacement/order differs
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_chat_output::/)'
  - id: output-adapter
    why: response assembly lacks independent typed Python comparison
    run: test -f tools/oracle/helpers/responses_chat_output.py && grep -qE '^[[:space:]]+responses_chat_output:' tools/oracle/fuzz/corpus/helper_case/responses_chat_output-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-chat-output/output-defaults.yaml
- tools/oracle/cases/helpers/responses-chat-output/finish-status.yaml
- tools/oracle/cases/helpers/responses-chat-output/output-order.yaml
- tools/oracle/cases/helpers/responses-chat-output/reasoning-output.yaml
- tools/oracle/cases/helpers/responses-chat-output/interpreter-replacement.yaml
deviations: []
out_of_scope:
- _transform_responses_api_outputs_to_chat_completion_messages L2725-L2752 has no caller at the pin; its sole-use callee _transform_responses_output_tool_call_to_chat_completion_output_tool_call L2755-L2766 is unreachable too, so neither has a case.
- Other transformation.py methods belong to B907 custom tools, B908 options, B909 inputs, B910 merges, B911 repair, B912 results, B913 namespaces, B915 sessions, B1115 details and B2411 content; the deduplicate/correspondence pair at L925-L995 is also unused.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_chat_output in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_chat_output.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_chat_output.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Interpreter results replace matching function calls; appending unmatched server-side results would add output LiteLLM does not return.
- The first choice determines overall status but the first choice carrying reasoning determines the reasoning item.
- A truthy images field suppresses text even when image extraction yields no usable image.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
