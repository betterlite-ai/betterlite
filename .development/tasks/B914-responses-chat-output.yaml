id: B914
title: Responses chat output
description: >-
  Assemble Responses outputs from typed chat choices, tool results, reasoning, image-generation calls and annotations
  using the split tool and usage converters. Export response assembly with injected clock/ID source, preserving
  output item order and incomplete_details; no network or logging lives in this transformer.


  LiteLLMCompletionResponsesConfig._transform_responses_api_outputs_to_chat_completion_messages (litellm/responses/litellm_completion_transformation/transformation.py:L2725-L2752)
  has no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and
  no behavior case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/responses_chat_output.rs. Use ResponsesChatOutputInput and ResponsesChatOutputResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions length_incomplete, tool_result_output_order, reasoning_thinking_blocks
  under api::responses_chat_output::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesChatOutput in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_chat_output: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._map_chat_completion_finish_reason_to_responses_status
  (L2267-L2292); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._incomplete_details_for_finish_reason
  (L2295-L2304); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.transform_chat_completion_response_to_responses_api_response
  (L2406-L2468); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._transform_chat_completion_choices_to_responses_output
  (L2471-L2526); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._extract_tool_result_output_items
  (L2529-L2557); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._encode_thinking_blocks
  (L2560-L2563); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._extract_reasoning_output_items
  (L2566-L2597); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._extract_message_output_items
  (L2693-L2722); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._transform_responses_output_tool_call_to_chat_completion_output_tool_call
  (L2755-L2765); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._transform_chat_message_to_response_output_text
  (L2768-L2782). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 244 owned nonblank/non-comment/non-docstring Python lines (262 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 264 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 478 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B198 (Injected call context and shared
  settings), B902 (Responses shapes), B906 (Responses usage), B912 (Responses tool results), B913 (Responses tool
  namespaces), B1087 (Api boundaries), B1115 (Responses output detail conversion), B907 (Responses codex tools),
  B909 (Responses input messages). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.
