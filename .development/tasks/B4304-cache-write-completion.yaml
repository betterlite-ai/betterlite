id: B4304
title: Finish response cache writes across stream completion and cancellation
description: >-
  Add the module `write_completion` to betterlite-cache. It holds the write side of LiteLLM's
  LLMCachingHandler: how a finished response becomes a background cache write, how a streamed
  response becomes one write after its last chunk, and how a write that is cancelled still finishes.
  B4300 owns the handler state (request kwargs, original function name, preset key, dual cache),
  `should_store_result_in_cache`, `is_call_type_supported_by_cache` and `convert_args_to_kwargs`; call
  them, do not copy them. B4297 owns `add_cache` and `async_add_cache`, and B4298 owns
  `async_add_cache_pipeline`; call them as they are.

  Build `CacheWriteTracker`, a struct created once by the cache runtime and passed in through
  constructors (no static, no global set). `CacheWriteTracker::spawn(write: impl Fn() -> BoxFuture<'static,
  Result<(), CacheError>>) -> CacheWriteHandle` starts the write on the tokio runtime inside the
  post-response phase from B198 (`Phase::PostResponse` in betterlite-context call_context), so work the
  write spawns is also post-response. The tracker keeps every unfinished task and drops it when it ends,
  so a task is never lost before it completes. Python's `_complete_cache_write_despite_cancellation` runs
  the write, and if the task is cancelled it runs the write once more under
  `asyncio.wait_for(..., CACHE_WRITE_SHUTDOWN_FLUSH_TIMEOUT_SECONDS)` (5.0 seconds), logs a failure of that
  second run at warning level ("LiteLLM Cache: pending cache write failed during event loop shutdown: ..."),
  and then re-raises the cancellation. Rust has no implicit cancel, so the tracker takes a
  `tokio_util::sync::CancellationToken` in its constructor and `spawn` selects the write against it. When
  the token fires, the task runs the write factory once more with a 5 second `tokio::time::timeout`, logs
  a failed or timed-out second run at warn level with the same text, and ends as cancelled.
  `CacheWriteTracker::wait_idle` waits for all tracked tasks and is what shutdown calls after it fires the
  token. A write that returns `Err` on a normal run is the write's own business: the writers in B4297 and
  B4298 already log through `_log_add_cache_failure`, so the tracker does not retry and does not log again.

  Build `store_response(result: &CacheableResult, original_function: &str, kwargs, args)` for
  `async_set_cache` and `store_response_sync` for `sync_set_cache`. Both do nothing when no cache is
  configured. Both copy the kwargs, merge in the positional arguments with B4300's argument projection (the
  merge overwrites kwargs of the same name), and check `should_store_result_in_cache`. The async version
  then adds `parent_otel_span` from the kwargs (B110's helper) and picks one of three writes. A chat,
  embedding, transcription, rerank or Responses result that is an embedding response and whose cache
  backend is not S3 goes to `async_add_cache_pipeline` with the handler's dual cache and the kwargs (S3 has
  no bulk write, so embeddings go the single-write way there). Any other typed result is serialized to its
  JSON string first (`model_dump_json`) and goes to `async_add_cache` with the dual cache. Any other result
  value goes to `async_add_cache` as it is, without the dual cache. Each write is started with
  `CacheWriteTracker::spawn`, and `store_response` returns once the task is started, not when it ends. The
  sync version calls B4297's `add_cache` directly with the result and kwargs and has no tracker and no
  pipeline. `CacheableResult` is a closed enum of the five typed responses plus `Other(Json)`; a caller
  that has none of these passes `Other`.

  Build `add_streaming_response_to_cache` and its sync twin. Each takes the processed chunk, calls B252's
  `assemble_complete_response_from_streaming_chunks` with the handler's start time, now, the request
  kwargs, its own chunk buffer (`async_streaming_chunks` or `sync_streaming_chunks`) and the async flag, and
  writes the assembled complete response through `store_response` or `store_response_sync` only when the
  assembly returns one. The assembled response is built on the last chunk (finish reason set); earlier
  chunks only grow the buffer. The streaming wrapper calls these only when the stream is not itself a cache
  hit, and only when the logging object has a caching handler; that guard lives in B252's wrapper and is
  not rebuilt here.

  Build `wrap_streaming_result_for_cache(result_kind, call_type, handler)` as a decision, returning
  `StreamCacheWrap::Wrap` or `StreamCacheWrap::PassThrough`. It wraps only for call types
  `anthropic_messages` and `aanthropic_messages`, only when a cache is configured, only when
  `should_store_result_in_cache` is true for the handler's own function and request kwargs, and only when
  the result is an async stream (`ResultKind::AsyncStream`). The wrapper type `AnthropicMessagesStreamCacheWriter`
  and its use of `CacheWriteTracker::spawn` belong to B980; this task only exports `spawn` and the decision.

  Name independent native tests under `write_completion::tests`: `tracker_runs_write_once_when_not_cancelled`,
  `tracker_reruns_write_after_cancel`, `tracker_logs_failed_flush_and_ends_cancelled`,
  `tracker_flush_times_out_after_five_seconds` (use tokio's paused clock), `tracker_forgets_finished_tasks`,
  `tracker_runs_write_in_post_response_phase`, `store_skips_without_cache`, `store_skips_unsupported_call_type`,
  `store_skips_no_store_control`, `store_merges_positional_args_over_kwargs`, `store_embedding_uses_pipeline`,
  `store_embedding_on_s3_uses_single_write`, `store_typed_result_writes_json_string_with_dual_cache`,
  `store_other_result_writes_raw_without_dual_cache`, `sync_store_writes_directly`, `stream_chunks_wait_for_final_chunk`,
  `stream_writes_assembled_response_once`, `stream_without_assembly_writes_nothing`, `stream_wrap_decision_cases`.
  Cancellation tests use a fake write that counts calls and a fake cache that records which method got the call.
scope:
