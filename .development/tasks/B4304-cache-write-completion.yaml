    - crates/betterlite-cache/src/write_completion.rs
    - crates/betterlite-cache/src/write_completion/**
    - tools/oracle/cases/helpers/response-cache-writes/**
    - "tools/oracle/fuzz/corpus/helper_case/response_cache_writes-*"
    - tools/oracle/helpers/b4304.py
    - tools/oracle/helpers/b4304/**
    - tools/oracle/src/helpers/cache/b4304.rs
    - tools/oracle/src/helpers/cache/b4304/**
    - crates/betterlite-cache/Cargo.toml
  lint_tables: false
