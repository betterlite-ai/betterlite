dod:
  - text: A spawned write runs once on a normal finish, runs inside the post-response phase and leaves the tracker when it ends.
    proof: [tracker-tests]
  - text: When the cancellation token fires, the write runs once more with a 5 second limit, a failed or timed-out second run is logged at warn level, and the task ends as cancelled.
    proof: [tracker-tests]
  - text: Async store skips when no cache is set, the call type is unsupported or the no-store control is true, and merges positional arguments over kwargs first.
    proof: [store-tests, oracle, helper-python]
  - text: Async store picks the pipeline for non-S3 embedding responses, the JSON-string write with the dual cache for other typed responses, and the raw write without the dual cache for anything else.
    proof: [store-tests, oracle, helper-python]
  - text: Sync store calls add_cache directly, with no tracker and no pipeline.
    proof: [store-tests]
  - text: A stream writes one assembled response after the final chunk, none before it, and none when assembly returns nothing.
    proof: [stream-tests]
  - text: The Anthropic Messages wrap decision matches LiteLLM for call type, cache presence, store eligibility and async-stream results.
    proof: [stream-tests, oracle, helper-python]
  - text: Newly added helper corpus cases replay through the shared helper-case parser independently of the native behavior tests.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: tracker-tests
      why: write completion, cancellation flush, flush logging or task bookkeeping is missing
      run: >-
        cargo nextest run --locked -p betterlite-cache --no-tests=fail
        -E 'test(/^write_completion::tests::tracker_/)'
    - id: store-tests
      why: store eligibility, argument merge or result routing is missing
      run: >-
        cargo nextest run --locked -p betterlite-cache --no-tests=fail
        -E 'test(/^write_completion::tests::(store_|sync_store_)/)'
    - id: stream-tests
      why: stream completion writes or the wrap decision are missing
      run: >-
        cargo nextest run --locked -p betterlite-cache --no-tests=fail
        -E 'test(/^write_completion::tests::stream_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4304)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4304 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4304/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added response-cache-write cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/response_cache_writes-*")" &&
        grep -lE '^[[:space:]]+b4304:' tools/oracle/fuzz/corpus/helper_case/response_cache_writes-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/response-cache-writes/store-eligibility.yaml
  - tools/oracle/cases/helpers/response-cache-writes/store-routing.yaml
  - tools/oracle/cases/helpers/response-cache-writes/stream-wrap-decision.yaml
deviations:
  - what: The cancellation flush is driven by a CancellationToken that shutdown fires, not by asyncio task cancellation.
    why: Tokio tasks are not cancelled implicitly, so the tracker needs an explicit signal to keep the "run the write once more, 5 seconds at most" behavior.
  - what: Serialization of typed results to a JSON string happens in the caller's typed response, not through a Python model_dump_json call.
    why: Rust responses are typed records with their own serde output; the stored text is the same JSON the helper cases compare.
out_of_scope:
  - "handler state, should_store_result_in_cache, is_call_type_supported_by_cache, convert_args_to_kwargs: B4300 owns them and this task calls them."
  - "add_cache, async_add_cache and the timestamp envelope: B4297. async_add_cache_pipeline: B4298."
  - "AnthropicMessagesStreamCacheWriter and the cached-stream iterator in response_cache.py: B980. It calls CacheWriteTracker::spawn from this task."
  - "_assemble_complete_response_from_streaming_chunks and stream_chunk_builder use: B252."
  - "Cache hit reads, replay and callbacks (_async_get_cache, _sync_get_cache, _convert_cached_result_to_model_response): B4305, B4302, B4301."
  - "The sleep-free shutdown hook that fires the token: the runtime wiring task for cache lifecycle; this task only exposes wait_idle."
pitfalls:
  - The streaming path assembles on the final chunk only; a chunk with `finish_reason` null just grows the buffer, so an early write would store a partial response.
  - "`async_set_cache` copies the kwargs before merging positional arguments, so the caller's request kwargs must stay unchanged after the call."
  - The embedding branch skips the pipeline only for an S3 cache (`S3Cache` has no bulk write); Redis, memory and disk caches all use `async_add_cache_pipeline`.
  - Typed results are stored as a JSON string, but the pipeline and the raw branch receive the result object itself, so the three branches do not share one serialization step.
  - The second run after cancellation re-calls the write factory, so a write must be safe to run twice; B4297's envelope write overwrites the same key.
  - The sync path never uses the dual cache and never reads `parent_otel_span`; only the async path adds it.
  - The wrap decision reads the handler's own `original_function` and `request_kwargs`, not the call's, so it can differ from the store check made later with merged kwargs.
  - "Add tokio-util 0.7.20 (other crates already use that version) to betterlite-cache with the rt and sync features."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
