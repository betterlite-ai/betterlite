id: B3964
title: Galileo authentication health and buffered delivery
description: >-
  Build Galileo configuration, API-key or login-token authentication, health probing, and
  trace delivery with retained failed batches. Implement initialization with environment
  variable lookup for GALILEO_API_KEY, GALILEO_PROJECT_ID, GALILEO_LOG_STREAM_ID, GALILEO_USERNAME,
  GALILEO_PASSWORD, and GALILEO_BASE_URL (default https://api.galileo.ai for API-key auth).
  Build authentication with two paths: direct API-key header (Galileo-API-Key) for v2 API,
  or username/password login POST for token-based auth. Implement health check against /current_user
  with configuration validation and authentication probe. Build ingest request construction
  for both /ingest/traces/{project_id} (v2 API) and /v2/projects/{project_id}/traces (username/password).
  Implement buffering with configurable batch size (default 1), capping in-memory records to 1000
  with drop-oldest retention and warning. On successful flush, remove only the captured prefix;
  on 401/403 rejection with token auth, invalidate cached headers for re-authentication on next flush.
