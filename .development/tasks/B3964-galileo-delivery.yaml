deviations: []
out_of_scope:
  - >-
      Payload projection (trace/span building, timestamp conversion, token metrics); owned by B3963.
  - >-
      Callback record construction, queue admission and batch triggering; owned by B3965.
  - >-
      Configuration defaults and environment variable loading beyond these fields; owned by B002.
  - >-
      HTTP pooling and request execution; owned by B173.
  - >-
      Callback registration and lifecycle; owned by B189.
pitfalls:
  - >-
      Bearer token login is form-encoded POST to /login with username/password data; the response is
      JSON with access_token field, which is read by _login_access_token helper.
  - >-
      The default API base URL is https://api.galileo.ai and applies only when api_key is set; username/password
      auth requires GALILEO_BASE_URL to be explicitly set.
  - >-
      The v2 API path is /ingest/traces/{project_id}, while username/password auth uses /v2/projects/{project_id}/traces.
      The use_v2_api flag determines both header style and endpoint selection.
  - >-
      A successful flush removes only the captured prefix (records_in_payload count from before the await),
      preserving concurrent appends made during the POST. Failed flushes keep all records.
  - >-
      Auth rejection with 401/403 clears headers only for token auth (not v2_api); the next flush will
      re-login. v2 API key auth retains headers since the key is static.
  - >-
      In-memory buffer is capped at 1000 (GALILEO_MAX_IN_MEMORY_RECORDS) and drops oldest records with warning
      when exceeded. The warning mentions checking Galileo connectivity/credentials.
  - >-
      Header redaction masks Authorization and Galileo-API-Key values to first 8 and last 4 chars,
      or "***" for values 12 chars or shorter. Other headers (accept, Content-Type) pass through unchanged.
review_level: security
budget:
