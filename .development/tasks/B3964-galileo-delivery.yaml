dod:
  - text: >-
      Configuration loads GALILEO_API_KEY, GALILEO_PROJECT_ID, GALILEO_LOG_STREAM_ID, GALILEO_USERNAME,
      GALILEO_PASSWORD and GALILEO_BASE_URL from the environment; batch_size defaults to 1 and api_key
      selects v2 API (Galileo-API-Key header) while username/password uses token auth (/login POST).
    proof: [galileo-delivery-tests]
  - text: >-
      Base URL normalization removes trailing slashes; default is https://api.galileo.ai for v2 API.
    proof: [galileo-delivery-tests]
  - text: >-
      _is_configured returns true when project_id and base_url are set, and either api_key is set
      (v2 API) or both username and password are set (token auth).
    proof: [galileo-delivery-tests]
  - text: >-
      Health check validates project_id, base_url and authentication availability, calls async_health_check
      which probes /current_user with authentication, and returns IntegrationHealthCheckStatus with status
      and error_message fields.
    proof: [galileo-delivery-tests, oracle]
  - text: >-
      Authentication with API key sets Galileo-API-Key header and Content-Type/accept; authentication
      with username/password calls POST /login with form data, reads access_token from response body
      and sets Bearer Authorization header.
    proof: [galileo-delivery-tests, oracle]
  - text: >-
      _ensure_headers checks if headers are cached, returns cached headers if present, or builds headers
      (API key immediately or username/password via login). Login failures log at debug level and return false.
    proof: [galileo-delivery-tests, oracle]
  - text: >-
      Ingest request returns URL and payload tuple: /ingest/traces/{project_id} for v2 API or
      /v2/projects/{project_id}/traces for token auth. Payload is built by B3963's _build_traces_payload.
    proof: [galileo-delivery-tests]
  - text: >-
      Header redaction masks Galileo-API-Key and Authorization values to first 8 and last 4 chars,
      or "***" for values 12 characters or shorter; other headers pass through unchanged.
    proof: [galileo-delivery-tests]
  - text: >-
      Flush captures the record count before await, posts payload to endpoint, and on 2xx removes only
      the captured prefix from in_memory_records. On 401/403 with token auth (not v2 API), sets headers to None
      for re-authentication on next flush.
    proof: [galileo-delivery-tests, oracle]
  - text: >-
      Failed flush (non-2xx response or exception) logs diagnostic details and retains all records;
      successful flush returns without exception.
    proof: [galileo-delivery-tests, oracle]
