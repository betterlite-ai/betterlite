    why: Push url check, caller identity, backend auth choice, forwarding headers, JSON-RPC error body, trace id check and the buffered forward.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/a2a_routing.py
    why: The whole "a2a/<name>" routing function.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L706-L717
    why: The one caller of route_a2a_agent_request.
dod:
  - text: jsonrpc_error returns the JSON-RPC 2.0 error body with the given id, code and message.
    proof: [oracle, forwarding-tests]
  - text: caller_identity_headers prefers the agent caller over the key, orders user then team, and drops None and empty values.
    proof: [oracle, forwarding-tests]
  - text: forwarding_headers drops x-litellm- and backend-auth names from the agent's extra headers, adds trace id, lets later sources win on an exact-name clash, and returns None when empty.
    proof: [oracle, forwarding-tests]
  - text: resolve_backend_auth uses the Databricks side when the OAuth param is truthy and the hop auth port otherwise.
    proof: [forwarding-tests]
  - text: enforce_inbound_trace_id fails with the exact LiteLLM message only when the agent requires a trace id and none is given.
    proof: [forwarding-tests]
  - text: validate_push_url rejects non-https urls with "Push notification URL must use HTTPS" and passes the rest through UrlValidator.
    proof: [oracle, forwarding-tests]
  - text: forward_jsonrpc sends Content-Type then extra headers, returns a JSON object even on a non-2xx status that has "error", and fails on a non-2xx status without it.
    proof: [forwarding-tests]
  - text: route_a2a_model returns None for a model that is not a string or lacks the "a2a/" prefix, and calls nothing.
    proof: [routing-tests]
  - text: route_a2a_model fails with ModelNotFound for an unknown agent, and with Forbidden (exact message) when the gate refuses. A proxy admin skips the gate unless the agent is identity managed.
    proof: [routing-tests]
  - text: route_a2a_model sets api_base to the agent card url and returns the bridge result.
    proof: [routing-tests]
checks:
  optional: [mutants]
  commands:
    - id: forwarding-tests
      why: the a2a_forwarding behavior tests fail or do not exist
      run: >-
        cargo nextest run --locked -p betterlite-proxy --no-tests=fail
        -E 'test(/^agent_endpoints::a2a_forwarding::(.*::)?a2a_forwarding_tests_behavior($|::)/) - test(/replays_the_/)'
    - id: routing-tests
      why: the a2a_routing behavior tests fail or do not exist
      run: >-
        cargo nextest run --locked -p betterlite-proxy --no-tests=fail
        -E 'test(/^agent_endpoints::a2a_routing::(.*::)?a2a_routing_tests_behavior($|::)/) - test(/replays_the_/)'
    - id: helper-python
      why: the oracle adapter fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/agents/a2a-forwarding/jsonrpc-error-body.yaml
  - tools/oracle/cases/agents/a2a-forwarding/identity-agent-caller-wins.yaml
  - tools/oracle/cases/agents/a2a-forwarding/identity-empty-values-dropped.yaml
  - tools/oracle/cases/agents/a2a-forwarding/headers-passthrough-filtered.yaml
  - tools/oracle/cases/agents/a2a-forwarding/headers-backend-auth-wins.yaml
  - tools/oracle/cases/agents/a2a-forwarding/headers-trace-id.yaml
  - tools/oracle/cases/agents/a2a-forwarding/headers-empty-is-none.yaml
  - tools/oracle/cases/agents/a2a-forwarding/push-url-http-rejected.yaml
  - tools/oracle/cases/agents/a2a-forwarding/push-url-private-host-rejected.yaml
deviations:
  - what: Failures return typed ForwardingError and RoutingError values. LiteLLM raises HTTPException (400, 403) and ProxyModelNotFoundError. The messages are the same; the caller picks the status.
    why: The route layer is B8589's, and Rust errors carry no HTTP framework.
  - what: The no-url branch of route_a2a_agent_request is dropped.
    why: AgentCard.url is a required field in betterlite, so the state cannot exist.
  - what: forward_jsonrpc fails with ForwardingError::Status for a non-2xx answer with a non-JSON body. LiteLLM calls httpx raise_for_status, which raises HTTPStatusError.
    why: There is no httpx. The caller turns both into the same internal error.
out_of_scope:
  - "The message/send, message/stream and card routes, the SSE relay (_a2a_sse_event_source, _forward_jsonrpc_sse, _handle_stream_message) are B4789 and B8589."
  - "_build_message_send_params is B6950."
  - "_served_version and the 0.3/1.0 conversion are B4811 and B4812."
  - "resolve_a2a_hop_auth_header stays B050's. This task only calls it through the HopAuth port."
  - "get_chain_id_from_headers, ROUTE_ENDPOINT_MAPPING and ProxyModelNotFoundError have no owner in the backlog. The callers pass their results in."
pitfalls:
  - The header map keeps names with their exact case. "x-trace" and "X-Trace" are two entries, but the passthrough filter and the backend-auth filter compare lowercase.
  - Python's `if user_id` drops an empty string as well as None. Do the same.
  - agent_caller set but with user_id None means no X-LiteLLM-User-Id header at all, not a fallback to the key's user id.
  - is_proxy_admin is the proxy admin role only. Other admin-like roles still go through the gate.
  - Do not add a retry or a fallback around forward_jsonrpc.
  - The oracle adapter returns the header list as ordered pairs, because order matters in forwarding_headers.
review_level: standard
budget:
  max_changed_lines: 1400
  max_new_expects: 0
