out_of_scope:
- HTTP route handlers; B4307, B4308 and B125 own the management endpoints.
- Encryption and decryption (B1600 owns litellm/proxy/common_utils/encrypt_decrypt_utils.py).
- Redis environment overlay (B4307 owns _overlay_environment and _redis_kwargs_from_environment consumption).
- SensitiveDataMasker implementation (B244 owns the classifier).

pitfalls:
- "Redaction marker is the exact string ***REDACTED***; the form round-trip logic recognizes it on the way back in."
- >-
  URL with embedded password is a credential even though "password" is not in its field name;
  keep "url" in the explicit sensitive set.
- >-
  Port values arrive as strings or ints from JSON; normalize both to the same form (json.dumps for lists/dicts, str() for scalars) for target comparison.
- >-
  Cluster mode (redis_startup_nodes present) exempts url from precedence: a url and redis_startup_nodes in one payload are separate branches, not conflicting.
- "Empty list/dict is falsy in Python but a valid config; distinguish from None/empty-string in _has_connection_target."
- "When the caller omits a redacted credential and there is no stored row, drop the field rather than persisting the marker."
- "Connection-target normalization must use json.dumps(sort_keys=True) so dict/list order does not break matches."
- "Parse stored settings must never json.loads an already-parsed dict; the prisma client may return either form."

review_level: security

