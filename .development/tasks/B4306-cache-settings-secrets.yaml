dod:
- text: Settings parsed from JSON string and dict both become a single dict type.
  proof: [secrets-tests]
- text: _resolve_cache_url_precedence drops host/port/db/password/username when url is present and non-empty, unless redis_startup_nodes is set.
  proof: [secrets-tests]
- text: _redact_credentials replaces values for explicit sensitive fields and SensitiveDataMasker-detected keys with the marker.
  proof: [secrets-tests]
- text: _is_credential_field returns true for password/sentinel_password/url and for any key the classifier detects.
  proof: [secrets-tests]
- text: _has_connection_target returns false only for None, empty string, empty list, empty dict and the redaction marker.
  proof: [secrets-tests]
- text: _target_repr normalizes lists/dicts to json.dumps(sort_keys=True) and other values to str().
  proof: [secrets-tests]
- text: _saved_secret_is_reusable returns true only when all stored pinned connection-target fields match the incoming request, with url exempt.
  proof: [secrets-tests]
- text: _merge_over_saved restores stored secrets for omitted or redacted fields, drops url when switching to discrete target, and takes explicit values verbatim.
  proof: [secrets-tests]
- text: _redact_settings replaces every value with the marker.
  proof: [secrets-tests]
- text: Settings parser has a cargo-fuzz target at crates/betterlite-server/fuzz/fuzz_targets/cache_settings_parser.rs and replays_the_cache_settings_secrets_corpus parses every file without a panic.
  proof: [secrets-fuzz-corpus]
- text: Every mutant in the parsing and validation logic is caught by a test.
  proof: [mutants]

checks:
  optional: [mutants]
  commands:
  - id: secrets-tests
    why: parsing, redaction or reuse validation tests fail or do not exist
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_secrets::/)'
  - id: secrets-fuzz-corpus
    why: parser fuzz target or corpus is missing, or replaying the corpus fails
    run: >-
      test -f crates/betterlite-server/fuzz/fuzz_targets/cache_settings_parser.rs && test -n "$(ls -A crates/betterlite-server/fuzz/corpus/cache_settings_parser)"
      && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_cache_settings_secrets_corpus)'

