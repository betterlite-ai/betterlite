id: B4306
title: Bind saved cache credentials to their connection targets
description: >-
  Build pure helpers that parse and validate cache settings before mutations: URL precedence resolution,
  credential masking, and saved-secret reuse policy. These nine functions enforce the invariant that
  a redacted or omitted secret is restored from the stored row only when the connection target has not changed.

  Stored cache_settings arrives from the database as either a JSON string or already-parsed dict;
  normalize both to a single dict type without decryption (B1600 and the route callers own encryption/decryption).
  _resolve_cache_url_precedence drops host/port/db/password/username when a non-empty url is supplied,
  unless redis_startup_nodes pins cluster mode, which authenticates via discrete fields.
  _redact_credentials masks credential-bearing values with a fixed marker on outbound reads.
  _is_credential_field checks both explicit names (password, sentinel_password, url) and the SensitiveDataMasker.
  _has_connection_target validates whether a value names a live target vs. empty/None/marker.
  _target_repr normalizes targets for equality (json.dumps for lists/dicts, str() for others).
  _saved_secret_is_reusable compares the six connection-mode fields (host, port, url, redis_startup_nodes,
  sentinel_nodes, service_name) across stored and incoming in normalized form.
  _merge_over_saved keeps the stored secret for any credential the caller omitted or echoed back redacted,
  drops url when switching to discrete target, and honors explicit new values.
  _redact_settings replaces all values with the marker for audit logs.
  Associated constants belong here: sensitive-field names, redaction marker, URL-override field set, and connection-target field tuple.

  Stored JSON parsing is a real outside-byte decoder; add a cargo-fuzz target seeded with oracle case payloads.

