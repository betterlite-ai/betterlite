id: B747
title: Model allowlist patterns and alias resolution
description: >-
  Implement ModelGrantPattern and ModelAccessDecision over configured deployment/catalog views. Preserve
  literal/wildcard/provider-prefix semantics, team and key alias resolution, all-team-model sentinels
  and access-group resources. Client-facing model-denied errors stay generic while diagnostics retain
  typed causes without model-list leakage.


  Build the production auth_model_patterns module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _get_resources_from_access_groups (L4237-L4297; 54 source lines), _get_models_from_access_groups (L4300-L4316;
  17 source lines), _get_mcp_server_ids_from_access_groups (L4319-L4337; 19 source lines), _get_agent_ids_from_access_groups
  (L4340-L4358; 19 source lines), _resolve_all_team_model_sentinel_for_auth_check (L4361-L4372; 12 source
  lines), _check_model_access_helper (L4375-L4420; 33 source lines), _can_object_call_model (L4423-L4516;
  86 source lines), _resolve_team_alias (L4519-L4529; 11 source lines), _live_team_alias_target (L4532-L4543;
  12 source lines), _model_in_team_aliases (L4643-L4658; 14 source lines), key_model_aliases_for_auth_check
  (L4661-L4662; 2 source lines), _resolve_key_models_for_auth_check (L4665-L4680; 14 source lines), is_model_allowed_by_pattern
  (L6525-L6541; 14 source lines), _model_matches_any_wildcard_pattern_in_list (L6544-L6570; 23 source
  lines), _model_custom_llm_provider_matches_wildcard_pattern (L6573-L6600; 24 source lines), _is_wildcard_pattern
  (L6603-L6609; 6 source lines). litellm/proxy/auth/model_access_denied.py: model_access_denied_client_message
  (L11-L12; 2 source lines), ModelAccessDeniedHTTPException.__init__ (L16-L18; 3 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DEFAULT_MAX_RECURSE_DEPTH=100.
  Reuse the DEFAULT_MAX_RECURSE_DEPTH config field installed by B730; this task consumes that
  field and must not register a second environment binding or a YAML alias.


  Add the auth_model_patterns operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-model-patterns-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::auth_model_patterns::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 365 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  365 production, 151 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 696 changed lines estimated within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_model_patterns::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
