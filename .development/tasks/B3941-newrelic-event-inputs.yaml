checks:
  optional: [mutants]
  commands:
    - id: newrelic-extraction-tests
      why: extraction functions fail, do not exist, or behavior does not match the owned LiteLLM code
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(newrelic_extraction_tests_behavior)'
deviations:
  - what: Content is omitted (not replaced by a marker) when recording is off.
    why: New Relic schema expects absent fields rather than placeholder strings; simplifies event structure.
    link: null
  - what: Span IDs are never extracted or emitted from inbound traceparent headers.
    why: Any recoverable span ID is the caller's parent span, not betterlite's; emitting it would create incorrect parent relationships.
    link: null
out_of_scope:
  - Event assembly and delivery to New Relic (B3942 owns async_log_success_event, async_log_failure_event and the NewRelic agent integration).
  - Service failure/success event hooks (B3934 for Datadog handles adjacent-service logging; New Relic does not implement service hooks).
  - Initialization, agent registration and version resolution (B3942 owns __init__, _get_newrelic_params, _get_litellm_version and agent lifecycle).
  - Summary and message event recording (B3942 owns _record_summary_event and _record_message_events).
pitfalls:
  - Traceparent header lookup must be case-insensitive per W3C spec; use a loop or filter over lowercase keys.
  - Boolean environment variables accept the full set (true/false, 1/0, yes/no, on/off); validate and warn on unrecognized values instead of defaulting silently.
  - StandardLoggingPayload.messages can be a string (serialized/redacted), not always a list; only use it when isinstance(slo_messages, list).
  - Message content gating requires BOTH self.record_content AND not should_redact_message_logging(kwargs); async streaming without this gate leaks content even when disabled.
  - Timestamp fields (startTime, endTime) in StandardLoggingPayload are Decimal seconds; convert to milliseconds as int via _to_epoch_ms.
  - Tool calls and multimodal content (lists) are serialized to JSON strings; fallback to str() if JSON encoding fails.
review_level: standard
budget:
