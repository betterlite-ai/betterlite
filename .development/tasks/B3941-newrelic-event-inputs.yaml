id: B3941
title: New Relic AI event input and content projection
description: >-
  Build New Relic trace/model/usage/duration resolution and ordered request/response message
  projections that NewRelicLogger needs to emit AI summary and message events. Preserve case-insensitive
  traceparent header lookup with its permissive four-part parsing, fallback IDs, tool-call and
  multimodal content serialization, and the combined live content-recording/privacy decision.
  Implement record_content as a property that gates on both NEW_RELIC_AI_MONITORING_RECORD_CONTENT_ENABLED
  environment variable (default true) and turn_off_message_logging parameter, reading env at call time so UI
  configuration changes take effect without restart. Extract trace_id through W3C traceparent header first (case-insensitive),
  then StandardLoggingPayload.trace_id, then generated UUID; never emit span IDs from inbound parent trace.
  Parse boolean environment variables accepting true/false, 1/0, yes/no, on/off (case-insensitive, whitespace-tolerant),
  falling back with a warning on unrecognized values. Extract completion_id from response.id,
  then litellm_call_id, then generated UUID. Extract vendor/provider from StandardLoggingPayload.custom_llm_provider
  (preferred) or litellm_params.custom_llm_provider (fallback to "litellm"). Extract request and response model names
  preferring StandardLoggingPayload.model, falling back to kwargs.model for request and response_obj.model for response.
  Extract usage statistics (prompt_tokens, completion_tokens, total_tokens) from StandardLoggingPayload fields (preferred)
  or response_obj.usage, defaulting to zero. Extract finish_reason from first choice in response, defaulting to "unknown".
  Convert timestamps to epoch milliseconds through hasattr(timestamp, "timestamp") for datetime or direct float multiplication.
  Extract duration in milliseconds from StandardLoggingPayload.response_time (converted from seconds),
  then kwargs.llm_api_duration_ms, then calculate from start_time and end_time. Extract request parameters
  (temperature, max_tokens) from StandardLoggingPayload.model_parameters (preferred) or kwargs.optional_params,
  omitting absent parameters. Extract message content handling tool_calls as JSON, multimodal content (lists) as JSON,
  None/missing as empty string, and non-string as str(). Extract all messages (request from StandardLoggingPayload.messages
  preferred or kwargs.messages, response from response_obj.choices) with sequential numbers starting at 0,
  role defaulting to "user"/"assistant", response.model and vendor fields on every message, and optional timestamp
  (converted to milliseconds). Gate message content on self.record_content AND not should_redact_message_logging(kwargs),
  so async streaming never bypasses redaction even when content recording is on.
