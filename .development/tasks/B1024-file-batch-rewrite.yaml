id: B1024
title: Batch guardrail scan windows and rewrite spools
description: >-
  Build _scan_window, _spool, _worst, scan_batch_input_file (including drain), _read_spooled and
  rewrite_batch_input_file in betterlite-core::api::file_batch_rewrite. Each remains wholly owned
  here and calls B1023 row policy through its typed port. Scan at most 32 rows concurrently, wait
  for every started row, then decide whether another window can begin. Preserve physical row order
  in reports even when hooks complete out of order. No file or provider upload is started here.

  Both redaction and rewritten-output spools roll from memory to disk after 1048576 bytes. Store
  redactions by byte offset/length, not one retained string per row. Rust owns each temporary file
  and joined hook future through success, failure and cancellation; move blocking disk operations
  behind the existing bounded runtime I/O port. This is temporary spooling, not an atomic published
  file transaction, so B192's private JSON writer is not used.

  Keep source rewind/close ordering: scanning rewinds input in finally, closes redactions on failure
  and also when no changes exist, and returns an open redaction spool only when there are changes.
  Rewriting closes its output on error, always rewinds input, and returns output positioned at 0.
  The caller owns the scan result's spool after rewriting. All-dropped results are valid scan results
  with submitted_records=0; B1031 decides whether to call B1023.raise_nothing_to_submit.

  Tests in api::file_batch_rewrite::tests drive real temporary buffers and an injected hook barrier.
  Only _worst has a B171 helper case (file_batch_rewrite operation); runtime scheduling and filesystem
  cleanup are native assertions, never comparisons of two runtimes' timings. Reuse B1023 byte records,
  so no parser is added. The span is 125 nonblank, non-comment source lines; budget 145 implementation,
  160 tests, 35 pure fixtures, 65 adapters and 35 wiring lines, 440 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_batch_rewrite.rs
  - crates/betterlite-core/src/api/file_batch_rewrite/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/file_batch_rewrite.rs
  - tools/oracle/src/helpers/core_ops/file_batch_rewrite/**
  - tools/oracle/helpers/file_batch_rewrite.py
  - tools/oracle/helpers/file_batch_rewrite/**
  - tools/oracle/fuzz/corpus/helper_case/file_batch_rewrite-*
  - tools/oracle/cases/helpers/file-batch-rewrite/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/batch_guardrails.py#L428-L568
  why: Owns complete window, spool, error-priority, scan and rewrite functions with their cleanup paths.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/batch_guardrails.py#L34-L40
  why: B1023 declares the fixed 32-record window and 1 MiB rollover values used here.
dod:
- text: >-
    window_failure_barrier supplies 65 valid rows and fails line 2 while other rows in the first
    window wait on a barrier. Exactly 32 hooks start; all 32 are observed before returning; lines
    33-65 never start. Without failure windows are 32,32,1 and scanned_records=65. Reversed completion
    order does not reorder change records. No next window is read ahead while the first is running.
  proof: [behavior-tests]
- text: >-
    worst_problem_priority supplies a shape failure at line 1 and exceptions at lines 5 and 3;
    _worst returns the exception at line 3. With only failures at 5 and 2 it returns line 2.
    Content-block RecordDropped outcomes are changes, not problems. Exceptions are rethrown with
    their original class/status/type/param/code; non-exception scan failures are returned unchanged.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    redaction_spool_offsets appends UTF-8 text é then x and expects offsets 0,2 and lengths 2,1.
    Reading either span returns exactly its bytes. At 1048576 bytes the spool is in memory and
    at 1048577 it rolls to disk. Both spool types use this threshold and close owned files on drop.
  proof: [behavior-tests]
- text: >-
    rewrite_preserves_unedited supplies an unchanged CRLF record, a blank line, a dropped row and
    a redacted row. Output keeps the unchanged row's spaces and trailing CR, drops the blank and
    blocked rows, inserts one LF separator and appends the stored redaction bytes without a final LF.
    A source without trailing newline also works; all rows dropped gives empty output. Source and
    output offsets are both 0 on success.
  proof: [behavior-tests]
- text: >-
    scan_and_spool_cleanup verifies no-change scans close their redaction spool and still report
    all rows, changed scans return it open, and parse/hook/write failures and cancellation close
    owned spools and attempt to rewind source to 0. Cancellation propagates through gather to
    already-started hooks; do not add a successful completion callback. A failing final seek can
    replace an earlier error, and is not a promise of successful rewind. A rewrite
    failure closes output but leaves the scan result's redaction ownership with its caller.
  proof: [behavior-tests]
- text: Failure priority has a new pure oracle fixture and the file_batch_rewrite helper tag is exercised.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: concurrent scan or temporary file lifetime assertions are missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_rewrite::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: the pure error-order adapter is absent or invalid
    run: test -f tools/oracle/helpers/file_batch_rewrite.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the error-priority helper has no new seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_batch_rewrite-*)" && grep -qE '^[[:space:]]+file_batch_rewrite:' tools/oracle/fuzz/corpus/helper_case/file_batch_rewrite-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no pure failure-order comparison was added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-batch-rewrite)"
oracle_cases:
- tools/oracle/cases/helpers/file-batch-rewrite/worst-problem-priority.yaml
deviations: []
out_of_scope:
- B1023 owns every earlier class/function in batch_guardrails.py, including line iteration, _scan_record, public errors and report generation.
- B1031 attaches scan reports and submits files; B1032 compares the resulting HTTP upload behavior.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_batch_rewrite in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_batch_rewrite.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_batch_rewrite.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An exception at a later line outranks an earlier shape failure; earliest-line ordering applies only within the winning category.
- rstrip removes LF only, so an untouched CRLF record keeps CR in the rewritten file.
- A no-change scan returns a result containing a closed redaction spool; consumers must not read it when changes is empty.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
