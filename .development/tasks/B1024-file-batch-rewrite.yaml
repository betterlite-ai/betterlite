id: B1024
title: File batch rewrite
description: >-
  Scan batch input in source-sized bounded windows and spool accepted/replaced rows using the guardrail service.
  Preserve summary counts, worst failure and nothing-to-submit errors; own temporary files and remove them on failure/cancellation
  before any upstream upload.


  Implement crates/betterlite-core/src/api/file_batch_rewrite.rs. Use FileBatchRewriteInput and FileBatchRewriteResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions batch_scan_window, rewrite_accepted_rows, nothing_to_submit, spool_failure_cleanup,
  cancel_removes_spool under api::file_batch_rewrite::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileBatchRewrite in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_batch_rewrite: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/openai_files_endpoints/batch_guardrails.py: _scan_window (L428-L439); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  _spool (L442-L453); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _worst (L456-L459); litellm/proxy/openai_files_endpoints/batch_guardrails.py:
  scan_batch_input_file (L462-L527); litellm/proxy/openai_files_endpoints/batch_guardrails.py: _read_spooled (L530-L532);
  litellm/proxy/openai_files_endpoints/batch_guardrails.py: rewrite_batch_input_file (L535-L568). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 107 owned nonblank/non-comment/non-docstring Python lines (125 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 127 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 377 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B192 (Private JSON serialization and
  atomic files), B1023 (File batch guardrails), B1087 (Api boundaries). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
