checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_rewrite::/) -
      test(/::replays_corpus$/)'
  - id: case-batch-scan-window
    why: the batch-scan-window behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_rewrite::tests::batch_scan_window($|::)/)'
  - id: case-rewrite-accepted-rows
    why: the rewrite-accepted-rows behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_rewrite::tests::rewrite_accepted_rows($|::)/)'
  - id: case-nothing-to-submit
    why: the nothing-to-submit behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_rewrite::tests::nothing_to_submit($|::)/)'
  - id: case-spool-failure-cleanup
    why: the spool-failure-cleanup behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_rewrite::tests::spool_failure_cleanup($|::)/)'
  - id: case-cancel-removes-spool
    why: the cancel-removes-spool behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_batch_rewrite::tests::cancel_removes_spool($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_batch_rewrite.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_batch_rewrite-*)"
      && grep -qE "^[[:space:]]+file_batch_rewrite:" tools/oracle/fuzz/corpus/helper_case/file_batch_rewrite-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-batch-rewrite)"
