checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::vector_management_read::/)
      - test(/::replays_corpus$/)'
  - id: case-managed-vector-list
    why: the managed-vector-list behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::managed_vector_list($|::)/)'
  - id: case-managed-vector-info
    why: the managed-vector-info behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::managed_vector_info($|::)/)'
  - id: case-managed-vector-page
    why: the managed-vector-page behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::managed_vector_page($|::)/)'
  - id: case-nested-secret-never-returned
    why: the nested-secret-never-returned behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::nested_secret_never_returned($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::route_aliases($|::)/)'
  - id: case-auth-missing
    why: the auth-missing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::auth_missing($|::)/)'
  - id: case-auth-invalid
    why: the auth-invalid behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::auth_invalid($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/vector_management_read)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/vector_management_read.rs && grep -qF "decode_vector_management_read"
      crates/betterlite-server/fuzz/fuzz_targets/vector_management_read.rs && cargo nextest run --locked -p betterlite-server
      --no-tests=fail -E 'test(/^api::vector_management_read::tests::replays_corpus$/)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/vector-management-read)"
