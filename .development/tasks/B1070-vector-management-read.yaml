id: B1070
title: Vector management read
description: >-
  Implement /vector_store/list and info with owner-scoped visibility, source pagination and redacted registry/database
  views. Reuse management redaction and expose is_config ownership without returning connection or embedding credentials.


  Implement crates/betterlite-server/src/api/vector_management_read.rs, crates/betterlite-core/src/api/vector_management_read.rs.
  Use VectorManagementReadInput and VectorManagementReadResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /vector_store/list; GET /v1/vector_store/list; POST /vector_store/info.
  Each alias is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts
  its child factories without re-registering their methods/paths.


  Extraction uses the typed path/query/body records named by the owned handler signatures.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): management_endpoints.py:450 status_code=500, exception_detail=FastAPI detail string; management_endpoints.py:548
  status_code=500, exception_detail=FastAPI detail string; management_endpoints.py:602 status_code=500, exception_detail=FastAPI
  detail string; management_endpoints.py:558 status_code=403, exception_detail=FastAPI detail string. Compare the
  actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions managed_vector_list, managed_vector_info, managed_vector_page, nested_secret_never_returned,
  route_aliases, auth_missing, auth_invalid under api::vector_management_read::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  The production external-byte decoder is betterlite-server::api::vector_management_read::decode_vector_management_read(bytes:
  &[u8], limits: &ApiLimits), for json.loads input vector_store_metadata at litellm/proxy/vector_store_endpoints/management_endpoints.py:567.
  Place its implementation in crates/betterlite-server/src/api/vector_management_read.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-server/fuzz/fuzz_targets/vector_management_read.rs passes arbitrary
  bounded bytes to that exact decoder; api::vector_management_read::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/vector_store_endpoints/management_endpoints.py: list_vector_stores (L356-L450);
  litellm/proxy/vector_store_endpoints/management_endpoints.py: get_vector_store_info (L538-L602). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 132 owned nonblank/non-comment/non-docstring Python lines (143 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 152 implementation,
  82 behavior tests, 84 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 416 total within the 420-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1060 (Vector store access), B1069
  (Vector management write), B1087 (Api boundaries), B726 (Managed resources and transaction repositories), B858
  (Typed managed-resource and analytics rows), B1062 (Vector store registry), B003 (HTTP server, health routes and
  master key auth), B756 (Authentication header selection and mode dispatch), B1139 (Stateful HTTP oracle scenarios),
  B856 (Management oracle namespaces and Postgres test fixture), B002 (Load LiteLLM config.yaml into typed config).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
