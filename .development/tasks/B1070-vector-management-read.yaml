id: B1070
title: Vector-store management list and info
description: >-
  Register GET /vector_store/list and /v1/vector_store/list plus POST /vector_store/info in
  server::api::vector_management_read. Own complete list_vector_stores and get_vector_store_info.
  B864's vector_stores feature check follows B003 auth and precedes repository work. Its
  disable_vector_stores_for_internal_users=false and allow_vector_stores_for_team_admins=false settings
  are loaded by B864. Use B1062's DB loader/registry, B1060 list visibility, B2486 credential projection,
  ownership and fetch/access, and B732/B1131 response records. No provider operation is performed.

  List defaults page=1,page_size=100 but never slices data. DB rows first populate an ordered map;
  config entries win duplicates, missing non-config cache entries are deleted, and returned DB rows update
  the registry in order. Then filter access, redact params and count visible records. Info requires a DB
  connection even for cached entries, prefers cache, and parses cached metadata JSON with B2486's decoder.
  143 owned nonblank/non-comment lines allow 190 code, 200 tests, 160 HTTP fixtures and 50 corpus/wiring,
  600 total. Extend existing B1131/B2486 corpora rather than adding a decoder.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/vector_management_read.rs
  - crates/betterlite-server/src/api/vector_management_read/**
  - crates/betterlite-server/fuzz/corpus/management_json/info-*
  - tools/oracle/cases/api/vector-management-read/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/management_endpoints.py#L344-L450
  why: Both list aliases reconcile DB/cache before filtering and compute pagination metadata without slicing.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/management_endpoints.py#L532-L602
  why: Info's cached path shapes nullable fields while the DB fallback retains the row and both preserve access errors.
dod:
- text: >-
    list_reconciles_config_and_database starts DB=[vs_db,vs_shared],cache=[vs_stale,vs_shared(is_config=true),vs_config(is_config=true)].
    Both aliases return object=list with the DB order, shared entry replaced by config, and appended vs_config;
    vs_stale is removed from memory. DB updates cannot replace config-owned registry records. Missing/empty ids
    are skipped. Registry=null returns just DB entries; DB=null yields an empty DB list and removes non-config
    cache records, retaining config entries. Access filtering occurs after these effects. Params are redacted,
    is_config defaults false, and underlying DB/cache secrets remain usable. Pin info/debug removal diagnostics.
  proof: [read-tests, oracle, new-cases]
- text: >-
    list_pagination_is_metadata_only loads three accessible records. Defaults return all three,
    total_count=3,current_page=1,total_pages=1. ?page=2&page_size=2 still returns all three, current_page=2,
    total_pages=2. page=0 is retained; page_size=-2 computes total_pages=0 for three records; page_size=0
    gives 500 detail="integer division or modulo by zero" and leaves preceding cache reconciliation effects.
    ?page=bad is 422 detail validation at query.page before handler. Exceptions inside list, including access
    helper exceptions, become 500 detail=<exception text> and log "Error listing vector stores".
  proof: [read-tests, oracle]
- text: >-
    info_prefers_cached_record posts {vector_store_id:vs_a}. No DB gives 500 detail="Database not connected"
    even if cache has vs_a. With DB and cache, return 200 {vector_store:<record>} without DB lookup; blank
    name/description/team_id/user_id/created_at/updated_at normalize to null, missing provider/id to "",
    absent is_config to false and credential name remains its original value. Metadata JSON string
    {"tag":"x"} becomes {tag:x}; dict remains dict; other scalar becomes null. Invalid JSON logs and gives
    500 detail=<JSON decode error>, no fallback. B2486 redacts params without echoing secrets.
  proof: [read-tests, oracle, metadata-corpus]
- text: >-
    info_database_access_errors uses no cache hit: B2486 fetches DB, preserves its full row, redacts params
    only if present and returns 200. Missing id gives 404 detail="Vector store with ID vs_a not found";
    denied cache or DB row gives 403 detail="Access denied: You do not have permission to access this vector store".
    Those HTTPExceptions remain 403/404, never the catch-all 500. Framework missing required id is 422 detail.
  proof: [read-tests, oracle]
- text: >-
    management_read_auth_and_flags covers every alias with absent/invalid key (401,authentication_error,
    param=null,code="401") and valid key. The B864 disable flag rejects ordinary user with 403
    detail={error:"Access to vector_stores is disabled for your role. Contact your proxy admin."}; admin and
    view-only admin bypass, and allow flag=true exempts verified team admin. Unset flags allow authenticated
    calls subject to store visibility. Detail envelopes have absent type/param/code and application/json;
    no HTTP request reaches a provider. Message wording alone follows the error-message ignore rule.
  proof: [read-tests, oracle]
checks:
  optional: []
  commands:
  - id: read-tests
    why: cache reconciliation, unusual pagination or cached info conversion differs
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_read::tests::/) - test(/::replays_corpus$/)'
  - id: new-cases
    why: real HTTP list/info routes lack parity fixtures
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/vector-management-read)"
  - id: metadata-corpus
    why: info metadata JSON has no new persisted-byte regression case
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/management_json/info-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_boundaries::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/api/vector-management-read/list-reconciles-config-and-database.yaml
- tools/oracle/cases/api/vector-management-read/list-pagination-is-metadata-only.yaml
- tools/oracle/cases/api/vector-management-read/info-prefers-cached-record.yaml
- tools/oracle/cases/api/vector-management-read/info-database-access-errors.yaml
- tools/oracle/cases/api/vector-management-read/management-read-auth-and-flags.yaml
deviations: []
out_of_scope:
- B1069 owns create helper and new/delete/update routes. B2486 owns all shared functions at 52-176, including metadata JSON decoding and its list-credential redaction deviation.
- Feature flag parsing is B864; response record defaults are B732/B1131. Use B1060's distinct list visibility and direct-access rules.
pitfalls:
- page_size changes total_pages but never limits returned data.
- An unavailable DB represented by null can purge non-config registry entries during list.
- Info checks the DB connection before using a cache hit and preserves HTTP 403/404 from either source.
review_level: security
budget:
  max_changed_lines: 690
  max_new_expects: 0
