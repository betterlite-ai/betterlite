id: B3039
title: Tag MCP agent and session rate-limit descriptors
description: >-
  Build descriptor builders for per-tag, per-MCP-server, agent-level and session-level rate limits, preserving
  deduplication, source-team charging for MCP, and key-owned-agent precedence. Resolve configured tag budgets
  through the existing batched lookup service and agent policy through an injected registry port.

  Ownership includes:

  - Tag rate limits: _tag_rate_limit_descriptor constructs a descriptor from a tag name and its TagRateLimit (rpm_limit,
  tpm_limit), returning a RateLimitDescriptor with key="tag"; resolve_tag_rate_limits_from_db fetches tags via B740's
  get_tag_objects_batch and returns an immutable mapping of tag names to TagRateLimit objects with budget limits.

  - Tag-per-key descriptors: _add_tag_per_key_rate_limit_descriptor appends per-tag per-key RPM descriptors
  (key="tag_per_key", value="{api_key}:{tag}") for every request tag with a configured per-key limit, deduplicating
  by dict.fromkeys() order. Tags without a configured limit fall through to key-level descriptor.

  - MCP-per-key descriptors: _add_mcp_per_key_rate_limit_descriptor appends a single per-MCP-server RPM descriptor
  (key="mcp_per_key", value="{api_key}:{mcp_server_name}") if the server has a configured per-key limit; MCP tool
  calls have no token usage, so tokens_per_unit stays None.

  - MCP-per-team descriptors: _add_mcp_per_team_rate_limit_descriptor appends one descriptor per applicable team
  (key="mcp_per_team", value="{team_id}:{mcp_server_name}"), reading both key.team_id and all source_team_rpm_limits
  supplied by a keyless MCP grant; every applicable team's ceiling binds and no arbitrary team is picked when several
  grant the same server.

  - Agent-level descriptors: _create_agent_rate_limit_descriptors returns agent-global RPM/TPM descriptor
  (key="agent") if the agent policy defines rpm_limit or tpm_limit; agent policy comes from an injected registry or
  is supplied for testing.

  - Session-level descriptors: _create_agent_rate_limit_descriptors appends session-scoped descriptor
  (key="agent_session", value="{agent_id}:{session_id}") when session_id is present in data and agent policy defines
  session_rpm_limit or session_tpm_limit.

  - Agent and session resolution: _get_resolved_agent_id checks key.agent_id first (key-agent precedence), then
  metadata.agent_id and returns None if neither is set; _get_session_id_from_data extracts session_id from data.litellm_session_id,
  data.metadata.session_id, or data.litellm_metadata.session_id in order; _get_agent_from_registry looks up an agent by
  id in the global registry.

  - Tag deduplication: _create_tag_rate_limit_descriptors deduplicates request tags with dict.fromkeys() and filters
  to only tags present in the tag_limits mapping; awaits the tag-rate-limit resolver.

  Direct dependencies: B732 supplies UserAPIKeyAuth validation with team_id and mcp_source_team_rpm_limits fields;
  B740 supplies get_tag_objects_batch to fetch tag budget metadata; B745 supplies get_key_tag_rpm_limit, get_key_mcp_rpm_limit,
  get_team_mcp_rpm_limit lookups; B1102 supplies get_tags_from_request_body; B3031 supplies RateLimitDescriptor,
  TagRateLimit and handler window_size configuration; B4776 supplies AgentRegistry.get_agent_by_id for agent policy
  lookup.

