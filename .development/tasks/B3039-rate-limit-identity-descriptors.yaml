deviations:
  - what: Tag and agent policy resolution use injected registry and batch lookup services; when a service or registry is unavailable, tag limits return empty mapping and agent lookup returns None, causing those rate-limit descriptors to be absent.
    why: LiteLLM's tag resolution calls get_tag_objects_batch and returns empty mapping when prisma_client is None; agent lookup behavior depends on global_agent_registry implementation. betterlite mirrors this pattern.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L680-L698
  - what: MCP source-team charging appends descriptors for all applicable teams (both key.team_id and all source_team_rpm_limits entries); no team is arbitrarily selected when a keyless MCP request is granted by multiple teams.
    why: A keyless MCP subject reaches servers through several teams at once and has no single team_id; every applicable team's ceiling must bind, preserving the grant structure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L2927-L2937
  - what: Key-owned agent_id takes precedence over metadata-supplied agent_id; session_id is resolved from litellm_session_id, then metadata.session_id, then litellm_metadata.session_id in that order.
    why: API key agent assignment is stronger than per-request override; session resolution spans multiple metadata sources for backward compatibility.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L3029-L3053

out_of_scope:
  - AgentRegistry.get_agent_by_id implementation; this task calls the registry but does not implement it.
  - Rate-limit descriptor window enforcement and atomic check logic belong to B3033–B3036.
  - Tag rate-limit settlement belongs to B3045.
  - Request body parsing (get_tags_from_request_body) belongs to B1102; this task uses the output.
  - Auth context and UserAPIKeyAuth validation belong to B732.

pitfalls:
  - "Tag deduplication uses dict.fromkeys() to preserve order; tags are processed in request order with duplicates removed."
  - "MCP tool calls (key='mcp_per_key' and key='mcp_per_team') have tokens_per_unit=None; they are RPM-only, not TPM."
  - "MCP source-team charging appends a descriptor for every team in mcp_source_team_rpm_limits, not just key.team_id; all teams' limits bind."
  - "Agent precedence: key.agent_id wins over metadata.agent_id; absence of both returns None without error."
  - "Session ID is resolved in order: litellm_session_id, metadata['session_id'], litellm_metadata['session_id']; first non-None value is used."
  - "resolve_tag_rate_limits_from_db returns immutable mapping (MappingProxyType); only tags with non-None rpm_limit or tpm_limit in litellm_budget_table are included."
  - "Agent policy comes from registry lookup or test-supplied policy parameter; registry implementation determines available fields (rpm_limit, session_rpm_limit, etc.)."

