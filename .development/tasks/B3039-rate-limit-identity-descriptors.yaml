dod:
  - text: _tag_rate_limit_descriptor constructs a RateLimitDescriptor from tag name and TagRateLimit with key="tag", value=tag_name, window_size from handler.
    proof: [tag-descriptor-tests]
  - text: resolve_tag_rate_limits_from_db calls get_tag_objects_batch for tag_names and returns immutable mapping of tag names to TagRateLimit objects (rpm_limit, tpm_limit) from litellm_budget_table entries with non-None limits.
    proof: [tag-resolution-tests]
  - text: resolve_tag_rate_limits_from_db returns empty mapping when prisma_client is None or tag_names is empty, never null.
    proof: [tag-resolution-tests]
  - text: _add_tag_per_key_rate_limit_descriptor returns early if api_key is None or no tag_rpm_limit configured; appends one RPM-only descriptor per request tag with a configured limit.
    proof: [tag-per-key-tests]
  - text: _add_tag_per_key_rate_limit_descriptor deduplicates request tags using dict.fromkeys() to preserve order; skips tags without a limit mapping.
    proof: [tag-per-key-dedup-tests]
  - text: _add_tag_per_key_rate_limit_descriptor descriptor key is "tag_per_key", value is "{api_key}:{tag}", tokens_per_unit is None.
    proof: [tag-per-key-tests]
  - text: _add_mcp_per_key_rate_limit_descriptor returns early if mcp_server_name is None or api_key is None or no per-key limit configured; appends single RPM-only descriptor if server has configured limit.
    proof: [mcp-per-key-tests]
  - text: _add_mcp_per_key_rate_limit_descriptor descriptor key is "mcp_per_key", value is "{api_key}:{mcp_server_name}", tokens_per_unit is None.
    proof: [mcp-per-key-tests]
  - text: _add_mcp_per_team_rate_limit_descriptor returns early if mcp_server_name is None; appends descriptor for key.team_id (if present) and all source_team_rpm_limits entries in key.mcp_source_team_rpm_limits.
    proof: [mcp-per-team-tests]
  - text: _add_mcp_per_team_rate_limit_descriptor appends one descriptor per team with a configured limit; all applicable teams are charged (no arbitrary selection).
    proof: [mcp-per-team-tests]
  - text: _add_mcp_per_team_rate_limit_descriptor descriptor key is "mcp_per_team", value is "{team_id}:{mcp_server_name}", tokens_per_unit is None.
    proof: [mcp-per-team-tests]
  - text: _get_agent_from_registry calls global_agent_registry.get_agent_by_id(agent_id) and returns agent or None; method behavior depends on registry implementation.
    proof: [agent-registry-tests]
  - text: _get_resolved_agent_id checks key.agent_id first, returns it if non-None; otherwise checks metadata.agent_id; returns None if both absent.
    proof: [agent-resolution-tests]
  - text: _get_session_id_from_data extracts session_id from litellm_session_id, metadata.session_id, or litellm_metadata.session_id (in that order); converts result to string; returns None if all absent.
    proof: [session-resolution-tests]
  - text: _create_agent_rate_limit_descriptors returns empty list if agent is None; appends agent-global descriptor (key="agent", value=agent_id) if agent.rpm_limit or agent.tpm_limit non-None.
    proof: [agent-descriptor-tests]
  - text: _create_agent_rate_limit_descriptors appends session descriptor (key="agent_session", value="{agent_id}:{session_id}") if session_id non-None and agent.session_rpm_limit or agent.session_tpm_limit non-None.
    proof: [agent-descriptor-tests]
  - text: _create_agent_rate_limit_descriptors accepts optional policy parameter (for testing); uses supplied agent or looks up via _get_agent_from_registry.
    proof: [agent-descriptor-tests]
  - text: _create_tag_rate_limit_descriptors deduplicates request tags using dict.fromkeys(); returns tuple of descriptors only for tags present in tag_limits mapping.
    proof: [tag-dedup-tests]
  - text: _create_tag_rate_limit_descriptors awaits tag_rate_limit_resolver (async callable) with deduped tag tuple; returns immutable tuple.
    proof: [tag-dedup-tests]

