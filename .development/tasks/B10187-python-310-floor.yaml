out_of_scope:
- >-
  Moving the enums to LiteLLM's (str, Enum). str() of every member would change on 3.11 and later, and the guardrail
  code hands str(event_type) to the native module (_integrations/custom_guardrail_support.py lines 97, 106, 147, 152
  and 201, _integrations/custom_guardrail_recording.py line 59).
- >-
  The StrEnum rows in docs/deviations for B7921, B7922, B7925, B7926, B7928, B7929, B7930, B7931, B7933, B7934, B7939,
  B7940, B7943, B7950, B7951, B7953 and B8584. The text they describe doesn't change.
- >-
  Checking the tests or tools/python-release at 3.10. They run in tools/oracle/litellm and read TOML with tomllib, and
  smoke_wheel.py itself runs on 3.10 in the imports-on-310 check and in python-wheels.yml.
- The root ruff.toml, which the oracle helpers share at py311, and the Rust side of the wheel.
pitfalls:
- pydantic raises typed-dict-version only when a TypeAdapter or a model first reads a typing.TypedDict and basedpyright accepts typing.TypedDict at 3.10, so TypedDict moves with the other names even where nothing complains yet.
- ruff's isort counts typing_extensions as third-party, so its import goes in the block with pydantic, httpx2 and dotenv (last there by name), never beside `from typing import`, and `from betterlite._str_enum import StrEnum` goes in the betterlite block.
- Inside one import ruff sorts constants, then classes, then functions, as in `from typing_extensions import NotRequired, TypedDict, override`, and a `from typing import` line left with no names is deleted.
- No `if sys.version_info` branch anywhere, neither for the typing names nor in _str_enum.py, since the typing_extensions names and the one StrEnum work on every version.
- pkgutil.walk_packages skips folders without __init__.py, and python/betterlite/anthropic_interface and python/betterlite/types/proxy/guardrails have none, so build the module list from importlib.metadata's files for the installed betterlite distribution.
- Test files keep `from typing import Self` and `datetime.UTC`, since at py311 UP035 and UP017 flag the typing_extensions and timezone.utc forms there; of the existing tests only test_types_mcp_types.py changes, because its `type[StrEnum]` annotations must name the shared class.
- Give `__str__`, `__format__` and the `@staticmethod` `_generate_next_value_` the signatures typeshed gives enum.StrEnum, and mark each with typing_extensions.override, which keeps ruff's ARG004 quiet about the unused start, count and last_values.
- >-
  GUARDRAIL_DEFINITION_LOCATION keeps its functional form, `StrEnum("GUARDRAIL_DEFINITION_LOCATION", {"DB": "db", "CONFIG": "config"})`, now built from the shared class.
- test_smoke_wheel.py runs on Python 3.10 with no litellm, as smoke_wheel.py's main requires, so it imports only the standard library, pytest, smoke_wheel and betterlite, and the check keeps `--no-project` so the oracle environment stays out.
- A dispatched run can't run ruff or basedpyright, so make the import edits with one perl script over the scope list and read the diff per folder rather than one Read and Edit per file.
- A file that another task merges after 6a51ccf2b26 and that imports one of these names fails basedpyright at 3.10 from outside this scope; answer blocked with its path.
- Importing every module can surface an import cycle that `import betterlite` hides through its order; answer blocked with the traceback when the fix lies outside the scope.
review_level: standard
