id: B10187
title: The Python package imports and type-checks on Python 3.10
description: >-
  The wheel says it runs on Python 3.10 and it doesn't. crates/betterlite-python/pyproject.toml declares
  `requires-python = ">=3.10"`, the floor LiteLLM declares too (">=3.10, <3.15"), but pyrightconfig.json checks the
  package with `"pythonVersion": "3.11"` (set in B5369) and the crate's ruff.toml extends the root ruff.toml's
  `target-version = "py311"`, so no check has ever seen 3.10. The smoke test in .github/workflows/python-wheels.yml
  fails on 3.10 on every platform
  (https://github.com/betterlite-ai/betterlite/actions/runs/46037447114/job/140636337504) with
  `ImportError: cannot import name 'NotRequired' from 'typing'` at python/betterlite/_completion/errors.py line 2.


  Counted on main at 6a51ccf2b26 under crates/betterlite-python/python (main at 09d3fd41b17 changes no file there),
  four things break on 3.10. 105 `from typing import` statements in 105 files import a name typing only has from 3.11
  (Required 60, NotRequired 18, Self 18, Unpack 14, Never 1, one of them the multi-line import in types/utils/base.py),
  and two return annotations are the string "typing.Self" (types/proxy/carried_budget_state.py line 20 and
  anthropic_interface/exceptions/exception_mapping_utils.py line 124). 35 files use enum.StrEnum, also new in 3.11: 34
  import it and exceptions/_rate_limit.py writes `enum.StrEnum`, for 53 classes and the functional call that builds
  GUARDRAIL_DEFINITION_LOCATION in types/guardrails/params.py. Two files import datetime.UTC
  (_integrations/custom_guardrail_hooks.py and types/management_endpoints/auto_router_endpoints.py). And 49 files
  import TypedDict from typing. pydantic 2.14.1 refuses a typing.TypedDict below Python 3.12 with PydanticUserError
  code typed-dict-version as soon as a TypeAdapter or a model reads one, so 3.10 and 3.11 fail there even after every
  import resolves.


  Nothing else in the package needs 3.11: no tomllib, ExceptionGroup or except*, asyncio.TaskGroup or asyncio.timeout,
  LiteralString, assert_never, hashlib.file_digest, operator.call or the newer enum helpers, no 3.12 syntax (ruff at
  py310 reports none), and no value check like `"pre_call" in GuardrailEventHooks`. The one datetime.fromisoformat
  (_model_info/cost_map.py line 150) reads the text the native side writes with
  `to_rfc3339_opts(SecondsFormat::Micros, false)`, and 3.10 parses that.


  Import Never, NotRequired, Required, Self, Unpack and TypedDict from typing_extensions. The wheel already pins
  typing-extensions==4.16.0 and 252 package files import from it today. The two "typing.Self" strings become Self from
  typing_extensions, and datetime.UTC becomes datetime.timezone.utc. At py311 ruff's UP035 turns Never, NotRequired,
  Required and Self back into typing imports, UP017 turns timezone.utc back into datetime.UTC and UP042 rejects a
  (str, Enum) base; at py310 none of them fires, so ruff moves to py310 in the same change.


  Python 3.10 has no StrEnum, and LiteLLM uses none: at the pin every one of these classes is `class X(str, Enum)` or
  `class X(str, enum.Enum)` with explicit values, for example
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp.py#L27-L54.
  Declare each ported class the way LiteLLM declares it, with LiteLLM's explicit values, and add no shared enum
  module. MCPAuth's twelve `auto()` members become LiteLLM's twelve string values; ruff S105 reads bearer_token, token
  and oauth2_token_exchange as passwords, so those three lines carry `# noqa: S105` with a link to LiteLLM's line
  (litellm/types/mcp.py lines 44, 49 and 50). GUARDRAIL_DEFINITION_LOCATION becomes LiteLLM's class statement
  (litellm/types/guardrails.py line 1320) with `# noqa: N801` and that link, since basedpyright ignores the functional
  form's `type=str` and would type its members as a plain Enum. httpxSpecialProvider's class line keeps its N801
  noqa, so the edit counts as a new one too: five in all. Every class has a LiteLLM counterpart.
  AnthropicHostedToolNames and AnthropicBetaHeaderValues are LiteLLM's ANTHROPIC_HOSTED_TOOLS and
  ANTHROPIC_BETA_HEADER_VALUES under the CapWords names B7926 gave them, and they keep those names and the
  module-level aliases. Role is the one LiteLLM declares as a plain Enum (litellm/types/guardrails.py line 155). B7930
  made it a str enum on purpose so a member fits the protocol's str inputs, so it becomes (str, Enum) and B7930's row
  says so. DynamicPromptManagementParamLiteral is (str, Enum) already.


  After this change str() and %s of a member give `Class.MEMBER`, and format() and f-strings give the value on 3.10
  and `Class.MEMBER` from 3.11, as LiteLLM's members do on the same Python: CPython 3.10's Enum.__format__ formats a
  mixed-in member's value, and 3.11 and later return `str.__format__(str(self), format_spec)`. On main, with StrEnum,
  all four gave the value from 3.11. Equality with a str, hashing, json.dumps, pydantic validation and dumps, `in`
  against a set of str and the native module's String arguments read the str value either way. So every place in
  the package that turns a member into text through str(), format(), an f-string or %s reads `.value` instead, the
  way LiteLLM does where it needs the text. Swept on main, these are the hook names handed to the native module in
  _integrations/custom_guardrail_support.py (lines 97, 106, 147, 152 and 201) and
  _integrations/custom_guardrail_recording.py (line 59); RateLimitError's category and rate_limit_type in
  exceptions/_server.py (lines 67 and 68), which take a member's value and keep a str as given, as LiteLLM's
  litellm/exceptions.py lines 477 to 483 do; and the two "cache type is not built yet" messages in caching/caching.py
  (lines 174 and 206), whose text betterlite writes itself. Log arguments stay as they are. No other package line
  formats a member: the other str() and f-string calls in the 95 files that name these enums take a str, a number or
  an exception, and the Rust side calls no __str__ on what Python hands it.


  The 17 deviation files that list the StrEnum base lose those rows, since the base now matches LiteLLM: B7921,
  B7922, B7925, B7928, B7929, B7933, B7934, B7939, B7940, B7950, B7951, B7953 and B8584 drop the row, and B7931 drops
  its row for ContentFilterAction, GuardrailEventHooks and GUARDRAIL_DEFINITION_LOCATION. Four rows mix in another
  difference and are rewritten: B7926's says only that the two Anthropic enums carry CapWords names with LiteLLM's
  names bound to them, B7930's says Role is (str, Enum) where LiteLLM's is a plain Enum, B7931's guardrailConfig row
  drops its sentence about GUARDRAIL_DEFINITION_LOCATION, and B7943's row keeps only the parse_pinned_tools
  difference. Three tests pin the old text or the old base and change with it: test_names_enum_strings in
  tests/test_types_router.py asserts that ours differs from LiteLLM's and now asserts they match, test_enum_names in
  tests/test_types_guardrail_hooks_b.py expects `str(DynamoTextType.MODEL_INPUT) == "MODEL_INPUT"` and now expects
  LiteLLM's text, and tests/test_types_mcp_types.py annotates its pairs as `type[StrEnum]` and names `type[Enum]`
  instead. Add tests/test_enum_parity.py, which compares str(), format(), an f-string, %s, name and value of members
  of MCPAuth, MCPTransport, GuardrailEventHooks, GUARDRAIL_DEFINITION_LOCATION, PiiAction, Role, LiteLLMCacheType,
  CacheMode, RouterErrorTypes, RequestType, RateLimitErrorCategory, ResponsesAPIStreamEvents and AlertType with
  LiteLLM's, checks every MCPAuth value against LiteLLM's, checks that a RateLimitError built from members holds plain
  str values, and checks that `Cache(type=LiteLLMCacheType.S3)` fails with "s3 cache type is not built yet".


  The package moves to 3.10 and the tests stay at 3.11. The tests only ever run in tools/oracle/litellm, whose
  requires-python is ">=3.11,<3.14", and tests/test_package.py reads TOML with tomllib. In
  crates/betterlite-python/ruff.toml set `target-version = "py310"` and `per-file-target-version = { "tests/*" =
  "py311" }`, and ban typing.TypedDict with flake8-tidy-imports banned-api (TID251), with a message that names
  pydantic's 3.12 limit and with tests/* exempt. basedpyright accepts typing.TypedDict at 3.10, so the ban is what
  keeps a new file from bringing it back. python/betterlite/fine_tuning/ruff.toml and
  python/betterlite/_model_info/ruff.toml extend the root ruff.toml directly and so skip the crate's settings; point
  both at "../../../ruff.toml", as _tokens, _genai, _cost and _text already do. That brings the three
  typing.TypedDict imports in _model_info under the ban and nothing else.


  At py310 ruff reports 22 noqa comments as unused (RUF100): 21 `# noqa: ASYNC109` in 9 files, since ASYNC109 only
  applies from 3.11, and the `# noqa: UP042` on DynamicPromptManagementParamLiteral in types/utils/small_types.py line
  256. Delete those noqa comments with their links and keep the code, DynamicPromptManagementParamLiteral's
  (str, Enum) base included. It also reports PERF203 at _completion/retries.py lines 61 and 81, where the retry loop
  has to catch each attempt's error; give retries.py its own per-file-ignores entry for PERF203 with that reason.


  Claude Code refuses worker writes to pyrightconfig.json, so the architect commits this content to
  crates/betterlite-python/pyrightconfig.json on the task branch before the first worker run, and the worker keeps
  that commit:
  `{"include": ["python", "tests"], "extraPaths": ["python"], "typeCheckingMode": "strict", "pythonVersion": "3.10",
  "reportMissingModuleSource": "none", "executionEnvironments": [{"root": "tests", "pythonVersion": "3.11"}]}`. An
  execution environment inherits the top-level extraPaths, so the tests still find the package. The python-lint
  check passes `--pythonversion 3.10` too: basedpyright 1.40.2 applies command-line options over the config file
  outside the language server and builds the execution environments afterwards, each keeping its own pythonVersion,
  so tests/ stays at 3.11 while the check fails on main by itself, and the committed file makes every other task's
  python-lint check run at 3.10 from the day this merges.


  tools/python-release/smoke_wheel.py only imports betterlite, so a module that `import betterlite` never reaches can
  still fail on 3.10. Make it import every .py module the installed wheel has under betterlite/, the two folders
  without __init__.py included (anthropic_interface and types/proxy/guardrails), and let the first failure raise with
  its traceback. It keeps its `smoke_wheel.py <version>` command line, so python-wheels.yml runs the walk on 3.10 and
  3.14 on all five platforms without an edit. Add tools/python-release/tests/test_smoke_wheel.py, which runs on
  Python 3.10 with only the wheel and pytest installed: it checks that the module list matches the .py files the
  installed distribution has under betterlite/ and that smoke_wheel.py's main passes with the installed version, and
  the imports-on-310 check runs it there.
