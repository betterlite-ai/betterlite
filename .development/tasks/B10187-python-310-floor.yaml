  why: LiteLLM runs on Python 3.10 to 3.14, the floor the wheel declares too.
- url: https://github.com/pydantic/pydantic/blob/v2.14.1/pydantic/_internal/_generate_schema.py#L1447-L1451
  why: pydantic raises typed-dict-version for a typing.TypedDict below Python 3.12 (_SUPPORTS_TYPEDDICT at L130).
- url: https://docs.python.org/3.11/library/enum.html#enum.StrEnum
  why: What the shared StrEnum copies, str(), format() and auto().
- url: https://docs.astral.sh/ruff/settings/#per-file-target-version
  why: How the tests keep py311 while the package moves to py310.
- url: https://docs.astral.sh/ruff/settings/#lint_flake8-tidy-imports_banned-api
  why: The TID251 ban on typing.TypedDict.
dod:
- text: >-
    The wheel built from this branch installs on Python 3.10 with nothing else, and every .py module it puts under
    betterlite/ imports there, the modules in the two folders without __init__.py included.
  proof: [imports-on-310]
- text: >-
    smoke_wheel.py lists every .py module the installed wheel has under betterlite/ and imports each, and
    test_smoke_wheel.py checks that list against the installed files, naming
    betterlite.anthropic_interface.exceptions.exception_mapping_utils and
    betterlite.types.proxy.guardrails.guardrail_hooks.hiddenlayer, and runs main with the installed version.
  proof: [imports-on-310]
- text: >-
    No package file imports Never, NotRequired, Required, Self, Unpack or TypedDict from typing, names typing.Self in a
    string, or reads datetime.UTC, and ruff bans typing.TypedDict in the package outside tests/.
  proof: [no-311-names, floor-config, python-lint]
- text: >-
    python/betterlite/_str_enum.py holds the one StrEnum the package's string enums subclass. str(), format(), an
    f-string and %s of a member give its value, auto() gives the lowercase member name, the functional call builds
    GUARDRAIL_DEFINITION_LOCATION, and no file imports enum.StrEnum. test_str_enum.py checks these on MCPAuth,
    GuardrailEventHooks, LiteLLMCacheType and GUARDRAIL_DEFINITION_LOCATION, and checks each MCPAuth value against
    LiteLLM's.
  proof: [str-enum, no-stdlib-strenum]
- text: >-
    crates/betterlite-python/ruff.toml targets py310 with tests/* at py311, the fine_tuning and _model_info ruff.toml
    files extend it, pyrightconfig.json checks python/ at 3.10 and tests/ at 3.11, and the package, its tests and
    tools/python-release pass ruff and strict basedpyright, with the 22 unused noqa comments gone.
  proof: [floor-config, python-lint]
- text: >-
    The ported enums still equal LiteLLM's members, and the guardrail, cache, router and alert code that reads them
    behaves as before.
  proof: [enum-regressions]
checks:
  optional: []
  commands:
  - id: imports-on-310
    why: The wheel still fails to install or to import a module on Python 3.10.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && uv run --no-project --python 3.10 --with pytest==9.1.1 --with "$(ls target/python-wheel/betterlite-*.whl)" pytest tools/python-release/tests/test_smoke_wheel.py
  - id: str-enum
    why: The shared StrEnum gives other text than the value, or auto() stops giving LiteLLM's MCPAuth values.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_str_enum.py -k str_enum
  - id: enum-regressions
    why: A ported enum lost a member or a value, or code that reads one changed.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_mcp_types.py crates/betterlite-python/tests/test_custom_guardrail.py crates/betterlite-python/tests/test_types_guardrails_params.py crates/betterlite-python/tests/test_cache_setup.py crates/betterlite-python/tests/test_types_router.py crates/betterlite-python/tests/test_types_integration_alerts.py
  - id: no-311-names
    why: A package file still imports a name Python 3.10's typing or datetime lacks, or typing.TypedDict.
    run: |-
      test -z "$(grep -rn -E '^[[:space:]]*from typing import [^#(]*\b(Never|NotRequired|Required|Self|Unpack|TypedDict)\b|"typing\.(Never|NotRequired|Required|Self|Unpack)\b|from datetime import [^#]*\bUTC\b|\bdatetime\.UTC\b' crates/betterlite-python/python)"
  - id: no-stdlib-strenum
    why: A file still imports the standard library StrEnum, which Python 3.10 lacks.
    run: |-
      test -z "$(grep -rn -E 'from enum import [^#]*\bStrEnum\b|\benum\.StrEnum\b' crates/betterlite-python/python crates/betterlite-python/tests)"
  - id: floor-config
    why: The configs other tasks' checks read still check the package at 3.11 or let typing.TypedDict in.
    run: |-
      set -e
      grep -q -F '"pythonVersion": "3.10"' crates/betterlite-python/pyrightconfig.json
      grep -q -E '^target-version = "py310"$' crates/betterlite-python/ruff.toml
      grep -q -F '"typing.TypedDict"' crates/betterlite-python/ruff.toml
      grep -q -F 'extend = "../../../ruff.toml"' crates/betterlite-python/python/betterlite/fine_tuning/ruff.toml
      grep -q -F 'extend = "../../../ruff.toml"' crates/betterlite-python/python/betterlite/_model_info/ruff.toml
  - id: python-lint
    why: A 3.11-only name, a stale noqa or a strict type error in the package or the release scripts.
    run: |-
      set -e
      uv run --locked --project tools/oracle/litellm ruff check --target-version py310 crates/betterlite-python/python crates/betterlite-python/tests
      uv run --locked --project tools/oracle/litellm ruff check tools/python-release
      uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json --pythonversion 3.10
      uv run --locked --project tools/oracle/litellm basedpyright --project tools/python-release/pyrightconfig.json
