dod:
- text: >-
    The wheel built from this branch installs on Python 3.10 with nothing else, and every .py module it puts under
    betterlite/ imports there, the modules in the two folders without __init__.py included.
  proof: [imports-on-310]
- text: >-
    smoke_wheel.py lists every .py module the installed wheel has under betterlite/ and imports each, and
    test_smoke_wheel.py checks that list against the installed files, naming
    betterlite.anthropic_interface.exceptions.exception_mapping_utils and
    betterlite.types.proxy.guardrails.guardrail_hooks.hiddenlayer, and runs main with the installed version.
  proof: [imports-on-310]
- text: >-
    No package file imports Never, NotRequired, Required, Self, Unpack or TypedDict from typing, names typing.Self in a
    string, or reads datetime.UTC, and ruff bans typing.TypedDict in the package outside tests/.
  proof: [no-311-names, floor-config, python-lint]
- text: >-
    Every string enum in the package is declared (str, Enum) as LiteLLM declares it, with LiteLLM's explicit values,
    MCPAuth's and GUARDRAIL_DEFINITION_LOCATION's included, Role is (str, Enum), and no package file, test or deviation
    file names StrEnum. test_enum_parity.py checks that str(), format(), an f-string, %s, name and value of members of
    MCPAuth, MCPTransport, GuardrailEventHooks, GUARDRAIL_DEFINITION_LOCATION, PiiAction, Role, LiteLLMCacheType,
    CacheMode, RouterErrorTypes, RequestType, RateLimitErrorCategory, ResponsesAPIStreamEvents and AlertType equal
    LiteLLM's, and that every MCPAuth value equals LiteLLM's.
  proof: [enum-parity, no-strenum]
- text: >-
    The guardrail hook names sent to the native module, RateLimitError's category and rate_limit_type and the "cache
    type is not built yet" messages read a member's value: test_enum_parity.py checks that a RateLimitError built from
    members holds plain str values and that `Cache(type=LiteLLMCacheType.S3)` fails with "s3 cache type is not built
    yet", and the guardrail tests still pass.
  proof: [enum-parity, enum-regressions]
- text: >-
    The 17 deviation files keep no StrEnum row, B7926, B7930, B7931 and B7943 keep their rewritten rows, and
    test_names_enum_strings and test_enum_names assert LiteLLM's str() text.
  proof: [no-strenum, enum-regressions]
- text: >-
    crates/betterlite-python/ruff.toml targets py310 with tests/* at py311, the fine_tuning and _model_info ruff.toml
    files extend it, pyrightconfig.json checks python/ at 3.10 and tests/ at 3.11, and the package, its tests and
    tools/python-release pass ruff and strict basedpyright, with the 22 unused noqa comments gone.
  proof: [floor-config, python-lint]
- text: >-
    The ported enums still equal LiteLLM's members, and the guardrail, cache, router, alert and exception code that
    reads them behaves as before.
  proof: [enum-regressions]
checks:
  optional: []
  commands:
  - id: imports-on-310
    why: The wheel still fails to install or to import a module on Python 3.10.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && uv run --no-project --python 3.10 --with pytest==9.1.1 --with "$(ls target/python-wheel/betterlite-*.whl)" pytest tools/python-release/tests/test_smoke_wheel.py
  - id: enum-parity
    why: A ported enum formats a member differently from LiteLLM's, or a value that leaves the package is still a member's str().
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_enum_parity.py
  - id: enum-regressions
    why: A ported enum lost a member or a value, or code that reads one changed.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_types_mcp_types.py crates/betterlite-python/tests/test_custom_guardrail.py crates/betterlite-python/tests/test_types_guardrails_params.py crates/betterlite-python/tests/test_cache_setup.py crates/betterlite-python/tests/test_types_router.py crates/betterlite-python/tests/test_types_integration_alerts.py crates/betterlite-python/tests/test_exceptions_server.py crates/betterlite-python/tests/test_types_guardrail_hooks_b.py
  - id: no-311-names
    why: A package file still imports a name Python 3.10's typing or datetime lacks, or typing.TypedDict.
    run: |-
      test -z "$(grep -rn -E '^[[:space:]]*from typing import [^#(]*\b(Never|NotRequired|Required|Self|Unpack|TypedDict)\b|"typing\.(Never|NotRequired|Required|Self|Unpack)\b|from datetime import [^#]*\bUTC\b|\bdatetime\.UTC\b' crates/betterlite-python/python)"
  - id: no-strenum
    why: A file still uses StrEnum, which Python 3.10 lacks and LiteLLM never declares, MCPAuth still takes auto() values, or a deviation row still lists the StrEnum base.
    run: |-
      set -e
      test -z "$(grep -rn -w StrEnum crates/betterlite-python/python crates/betterlite-python/tests docs/deviations)"
      test -z "$(grep -n -E '\bauto\(' crates/betterlite-python/python/betterlite/types/mcp/enums.py)"
  - id: floor-config
    why: The configs other tasks' checks read still check the package at 3.11 or let typing.TypedDict in.
    run: |-
      set -e
      grep -q -F '"pythonVersion": "3.10"' crates/betterlite-python/pyrightconfig.json
      grep -q -E '^target-version = "py310"$' crates/betterlite-python/ruff.toml
      grep -q -F '"typing.TypedDict"' crates/betterlite-python/ruff.toml
      grep -q -F 'extend = "../../../ruff.toml"' crates/betterlite-python/python/betterlite/fine_tuning/ruff.toml
      grep -q -F 'extend = "../../../ruff.toml"' crates/betterlite-python/python/betterlite/_model_info/ruff.toml
  - id: python-lint
    why: A 3.11-only name, a stale noqa or a strict type error in the package or the release scripts.
    run: |-
      set -e
      uv run --locked --project tools/oracle/litellm ruff check --target-version py310 crates/betterlite-python/python crates/betterlite-python/tests
      uv run --locked --project tools/oracle/litellm ruff check tools/python-release
      uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json --pythonversion 3.10
      uv run --locked --project tools/oracle/litellm basedpyright --project tools/python-release/pyrightconfig.json
oracle_cases: []
deviations: []
out_of_scope:
- >-
  Log arguments that format a member, such as the event_hook in _integrations/custom_guardrail_state.py line 97. Log
  text isn't part of the contract, and LiteLLM's own log lines format members the same way.
- >-
  Role as a plain Enum like LiteLLM's. B7930 chose a str enum so a member fits the protocol's str inputs and
  tests/test_types_guardrails_core.py puts one in a JSON payload.
- >-
  Checking the tests or tools/python-release at 3.10. They run in tools/oracle/litellm and read TOML with tomllib, and
  smoke_wheel.py itself runs on 3.10 in the imports-on-310 check and in python-wheels.yml.
- The root ruff.toml, which the oracle helpers share at py311, and the Rust side of the wheel.
pitfalls:
- pydantic raises typed-dict-version only when a TypeAdapter or a model first reads a typing.TypedDict and basedpyright accepts typing.TypedDict at 3.10, so TypedDict moves with the other names even where nothing complains yet.
- ruff's isort counts typing_extensions as third-party, so its import goes in the block with pydantic, httpx2 and dotenv (last there by name), never beside `from typing import`.
- Inside one import ruff sorts constants, then classes, then functions, as in `from typing_extensions import NotRequired, TypedDict, override`, and a `from typing import` or `from enum import` line left with no names is deleted.
- No `if sys.version_info` branch anywhere, since the typing_extensions names and (str, Enum) work on every version.
- >-
  A field typed `str | RateLimitErrorCategory` needs a match with `case RateLimitErrorCategory():` before `.value`,
  where LiteLLM writes isinstance; a bare str() of a member gives Class.MEMBER.
- >-
  `Literal[MCPTransport.sse, ...]` aliases, `case MCPAuth.oauth2:` patterns, `==` against a str and the `in` tests
  against frozensets of str keep working with (str, Enum); leave them as they are.
- Each new noqa line ends with the pinned LiteLLM link, as the Python rules hook wants, and the five of them are the whole expect budget.
- Tests keep the 3.11 forms (`from typing import Self`, `datetime.UTC`) and declare no (str, Enum) class, since at py311 UP035, UP017 and UP042 flag those in tests/.
- In each deviation file delete or rewrite only the StrEnum row; keep `task:`, the other rows and kept_bugs exactly as they are.
- pkgutil.walk_packages skips folders without __init__.py, and python/betterlite/anthropic_interface and python/betterlite/types/proxy/guardrails have none, so build the module list from importlib.metadata's files for the installed betterlite distribution.
- test_smoke_wheel.py runs on Python 3.10 with no litellm, as smoke_wheel.py's main requires, so it imports only the standard library, pytest, smoke_wheel and betterlite, and the check keeps `--no-project` so the oracle environment stays out.
- A dispatched run can't run ruff or basedpyright, so make the import and base edits with one perl script over the scope list and read the diff per folder rather than one Read and Edit per file.
- A file another task merges after this plan that imports one of these names, declares a StrEnum or adds a StrEnum deviation row fails these checks from outside this scope; answer blocked with its path.
- Importing every module can surface an import cycle that `import betterlite` hides through its order; answer blocked with the traceback when the fix lies outside the scope.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 5
