dod:
  - text: >-
      is_true_passthrough is true only when every resolved target is true_passthrough, and false for no target, an unresolved target or a mixed set.
    proof: [fallback-tests]
  - text: >-
      single_bridge_target returns the target only for one name whose server has is_oauth_delegate and is_dcr_bridge both true and a server_name or alias, and keeps the requested spelling.
    proof: [fallback-tests]
  - text: >-
      The two cold-start checks follow LiteLLM for passthrough servers, oauth2 delegates and client_credentials delegates.
    proof: [fallback-tests]
  - text: >-
      has_client_supplied_mcp_auth, the gateway challenge and the bridge challenge return LiteLLM's status, detail, header name and header value for the aggregate URL, a server URL, and the invalid_token form.
    proof: [fallback-tests, oracle]
  - text: >-
      admission_failure_fallback returns the anonymous auth, the gateway challenge or the original error in LiteLLM's order, and refuses the bypass when client MCP auth is present or the error is not a 401.
    proof: [fallback-tests]
checks:
  optional: []
  commands:
    - id: fallback-tests
      why: The target resolution, cold-start, challenge or fallback tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::admission_fallback::/)'
deviations:
  - what: The registry, the challenge context and the client IP are arguments, and the caught exception arrives as error_is_401 plus the original error value.
    why: betterlite keeps no global manager and no Starlette request in these functions. LiteLLM reads global_mcp_server_manager and the request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/auth/user_api_key_auth_mcp.py#L311-L361
out_of_scope:
  - "process_mcp_request, _admit_dcr_bridge_delegate, _open_dcr_bridge_envelope, _admit_dcr_bridge_dual_credential, _admit_dcr_bridge_authorization, _admit_gateway_session, _run_pre_db_read_auth_checks, _reload_admitted_principal and reload_admitted_user: B4673, which calls this task."
  - "extract_target_server_names_from_path, resolve_target_server_names, cold_start_server_names (_parse_mcp_server_names_from_path), the header parsers and the URL builders: B4654."
  - "_is_litellm_auth_admission_error, _is_mcp_admitted_user_subject, _explicit_credential_matches_envelope and the scrub: B4679."
  - "UnloadableEntitlementError, _as_list, _agent_capped_servers, MCPServerAccess: B4671 and the grant tasks."
  - "get_mcp_server_by_name and the IP filter: B4731. The MCPServer record and its properties: B6590. effective_oauth2_flow: B6760. get_mcp_client_ip: B743."
pitfalls:
  - The gateway challenge writes the header name as "WWW-Authenticate" and the bridge challenge writes "www-authenticate", so each test asserts the exact spelling LiteLLM sent.
  - The bridge challenge detail is a plain string and the gateway challenge detail is an object with error and message, so the two are not interchangeable.
  - A header naming a server the path does not name refuses the cold-start bypass, because the path decides routing and a mismatch is a hostile or confused caller.
  - is_passthrough_cold_start needs every name to be a passthrough server, so one other server in a co-targeted set closes the bypass for all of them.
  - The legacy delegate bypass applies only when no bearer was presented, but the passthrough bypass applies either way.
  - Aggregate /mcp is the only route with no path target that gets the gateway challenge; a named target that does not advertise gateway sign-in fails closed to the original error.
  - A server_name or alias of None or empty makes single_bridge_target None, because egress finds the injected token only by those names.
