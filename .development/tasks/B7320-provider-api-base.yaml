id: B7320
title: Provider api_base lookup
description: >-
  Add the module `api_base_lookup` to betterlite-models: a pure function that answers "which URL does this model call",
  the port of `get_api_base` in litellm_core_utils/llm_response_utils/get_api_base.py (113 lines, one public function and
  two private helpers). Alerts (B4026 outage, B4027 slow and hanging requests), response hidden params (B2413 and the
  streaming wrapper) and exception context all call it, so it must be callable without a router, a logging object or any
  network access.

  Public API, all in `crates/betterlite-models/src/api_base_lookup.rs` (the worker may split private code into
  `api_base_lookup/`): `pub fn get_api_base(model: &str, params: &ApiBaseParams, context: &ApiBaseContext<'_>) ->
  Result<Option<String>, ApiBaseError>`. `ApiBaseParams` is a plain struct with `Option<String>` fields api_base,
  base_url, custom_llm_provider, api_key, vertex_location, vertex_project, plus `stream: bool`. It stands for the
  `LiteLLM_Params` object or kwargs dict LiteLLM receives, so callers build it from their own typed params (betterlite-models
  cannot import the router types). `base_url` is the extra key LiteLLM reads from `model_extra`. Set `stream` to true only
  where LiteLLM's getattr would find it (see pitfalls). `ApiBaseContext<'a>` holds `model_alias_map: &'a BTreeMap<String,
  String>` (LiteLLM's `litellm.model_alias_map`, empty by default), `hooks: &'a dyn ApiBaseHooks`, and whatever B174's
  resolver needs by reference (read `crates/betterlite-models/src/resolution.rs` once B174 has landed and pass its input
  type through, do not copy its fields). `ApiBaseError` is this module's own thiserror enum with one variant for an invalid
  vertex location, carrying the message.

  `ApiBaseHooks` is a trait defined here for the two things betterlite-models cannot reach: `fn login_free_api_base(&self,
  provider: LoginFreeProvider) -> Option<String>` where `LoginFreeProvider` is a closed enum `GithubCopilot | Chatgpt`, and
  `fn vertex_claude_url(&self, location: &str, project: &str, model: &str, stream: bool) -> Result<String, ApiBaseError>`.
  B8634 writes the real implementations (ProviderApiBaseHooks) (copilot and chatgpt config in betterlite-openai, B1304's create_vertex_url
  with partner claude in betterlite-vertex). Tests use fakes. Do not add a dependency on betterlite-openai or
  betterlite-vertex: both depend on betterlite-models.

  Behavior, in LiteLLM's order. (1) `params.api_base` set (even an empty string) is returned unchanged. (2) `params.base_url`
  returned when it is a non-empty string. (3) If `model` is a key of `model_alias_map`, replace it with the mapped value;
  the replaced model is used for every later step. (4) Call B209's `declared_authenticating_provider(model,
  custom_llm_provider)`. When it names github_copilot or chatgpt, return `hooks.login_free_api_base(..)` and stop, so the
  device login never starts. (5) Call B174's get_llm_provider with the model, custom_llm_provider, api_base and api_key.
  A failure is logged at debug level and treated as no provider and no dynamic base; it is never returned. On success the
  returned model replaces `model` and the returned provider is kept. (6) A dynamic api base from step 5 is returned. (7)
  When both vertex_location and vertex_project are set: if the model contains "claude", return `hooks.vertex_claude_url(..)`
  and pass its error up; otherwise return the string `{location}-aiplatform.googleapis.com/v1/projects/{project}/locations/
  {location}/publishers/google/models/{model}:streamGenerateContent` when stream is true and `:generateContent` when it is
  false. That string has no `https://` prefix and is not validated; copy it as is. (8) Otherwise the provider default:
  provider "gemini" gives `https://generativelanguage.googleapis.com/v1beta/models/{model}:{action}` with action
  streamGenerateContent or generateContent by stream; provider "openai" gives `https://api.openai.com`; anything else
  gives None.

  LiteLLM wraps only the `LiteLLM_Params` construction in a try that returns None. Typed input cannot fail that way, so
  there is no such branch (listed under deviations). Name the native tests so their module path starts with
  `api_base_lookup::tests::` and holds one of the words precedence, alias, declared, resolution, vertex or default, which
  the check filters match. Add the helper operation cases below. Budget: 140 implementation, 230 tests, 90 adapters and 40
  wiring, about 500 lines.
scope:
  paths:
    - crates/betterlite-models/src/api_base_lookup.rs
    - crates/betterlite-models/src/api_base_lookup/**
    - tools/oracle/cases/helpers/provider-api-base/**
    - "tools/oracle/fuzz/corpus/helper_case/provider_api_base-*"
    - tools/oracle/helpers/b7320.py
    - tools/oracle/helpers/b7320/**
    - tools/oracle/src/helpers/models/b7320.rs
    - tools/oracle/src/helpers/models/b7320/**
  lint_tables: false

references:
