    why: The login-free base for github_copilot and chatgpt, and the gemini and openai default URLs.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/get_api_base.py#L30-L113
    why: get_api_base itself, including the only try/except, the alias map step and the vertex branch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L134-L143
    why: declared_authenticating_provider, which decides the early return before any resolution.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L293-L321
    why: create_vertex_url, the claude partner URL the vertex_claude_url hook must return.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/common_utils.py#L422-L459
    why: validate_vertex_location and get_vertex_base_url, the source of the invalid-location error.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/streaming_handler.py#L255-L258
    why: A caller that passes the litellm_params dict, so stream is always false.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L218
    why: A caller that passes a dict and one more at L963 that passes a LiteLLM_Params object (B4026, B4027).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L522-L528
    why: LiteLLM_Params allows extra keys, which is where base_url and a stray stream come from.

dod:
  - text: An api_base in params wins over everything, an empty string included, and base_url is used only when non-empty and api_base is None.
    proof: [lookup-precedence-tests, oracle, helper-python]
  - text: A model found in model_alias_map is replaced before the declared-provider check and before resolution, and the replaced model reaches the gemini and vertex URLs.
    proof: [lookup-alias-tests, oracle, helper-python]
  - text: github_copilot or chatgpt, by custom_llm_provider or by model prefix, returns the hook's login-free base and never calls the resolver.
    proof: [lookup-declared-tests]
  - text: A resolver failure is swallowed and the lookup goes on with no provider, while a dynamic api base from the resolver is returned as is.
    proof: [lookup-resolution-tests, oracle, helper-python]
  - text: With vertex_location and vertex_project set, a non-claude model gives the unprefixed generateContent or streamGenerateContent string by stream, and a claude model returns the hook's URL or its error.
    proof: [lookup-vertex-tests, oracle, helper-python]
  - text: Provider gemini and openai give their fixed defaults, any other provider gives None.
    proof: [lookup-default-tests, oracle, helper-python]
  - text: The Rust function get_api_base and the types ApiBaseParams, ApiBaseContext, ApiBaseHooks and ApiBaseError are exported from the module for B4026, B4027 and B2413 to call.
    proof: [lookup-precedence-tests]
  - text: The helper operation b7320 and its Python adapter exist, and the new helper corpus replays.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: lookup-precedence-tests
      why: api_base and base_url precedence, or the exported API, is missing
      run: >-
        cargo nextest run --locked -p betterlite-models --no-tests=fail
        -E 'test(/^api_base_lookup::tests::.*precedence/)'
    - id: lookup-alias-tests
      why: the model_alias_map step is missing or runs after resolution
      run: >-
        cargo nextest run --locked -p betterlite-models --no-tests=fail
        -E 'test(/^api_base_lookup::tests::.*alias/)'
    - id: lookup-declared-tests
      why: the github_copilot and chatgpt early return is missing
      run: >-
        cargo nextest run --locked -p betterlite-models --no-tests=fail
        -E 'test(/^api_base_lookup::tests::.*declared/)'
    - id: lookup-resolution-tests
      why: resolver failure handling or the dynamic api base return is missing
      run: >-
        cargo nextest run --locked -p betterlite-models --no-tests=fail
        -E 'test(/^api_base_lookup::tests::.*resolution/)'
    - id: lookup-vertex-tests
      why: the vertex URL branches or the invalid location error are missing
      run: >-
        cargo nextest run --locked -p betterlite-models --no-tests=fail
        -E 'test(/^api_base_lookup::tests::.*vertex/)'
    - id: lookup-default-tests
      why: the gemini and openai defaults or the None fallback are missing
      run: >-
        cargo nextest run --locked -p betterlite-models --no-tests=fail
        -E 'test(/^api_base_lookup::tests::.*default/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b7320)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b7320 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b7320/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added api_base cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/provider_api_base-*")" &&
        grep -lE '^[[:space:]]+b7320:' tools/oracle/fuzz/corpus/helper_case/provider_api_base-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/provider-api-base/explicit-and-alias-base.yaml
  - tools/oracle/cases/helpers/provider-api-base/model-alias-map.yaml
  - tools/oracle/cases/helpers/provider-api-base/resolver-base-and-failure.yaml
  - tools/oracle/cases/helpers/provider-api-base/vertex-gemini-urls.yaml
  - tools/oracle/cases/helpers/provider-api-base/provider-defaults.yaml

deviations:
  - what: The function takes typed params and cannot hit LiteLLM's "LiteLLM_Params(**optional_params) failed, return None" branch.
    why: A pydantic validation failure on a wrongly typed value has no typed-input equivalent; callers build ApiBaseParams from fields that are already typed.
  - what: An invalid vertex_location for a claude model comes back as Err(ApiBaseError), where LiteLLM lets a ValueError escape.
    why: Rust has no exceptions; callers (B4026 catches everything, others decide) get the same fact as a value.
  - what: github_copilot and chatgpt bases and the claude vertex URL come through the ApiBaseHooks trait, not from module state and imports.
    why: betterlite-models sits below betterlite-openai and betterlite-vertex, and betterlite has no module-level state.

out_of_scope:
  - "get_llm_provider and the model and key resolution it does belong to B174; declared_authenticating_provider belongs to B209. This task only calls them."
  - "The github_copilot api_base_without_login (GITHUB_COPILOT_API_BASE, api-key.json endpoint) belongs to B1513/B1514 and the chatgpt one (CHATGPT_API_BASE) to B1510; they implement the hook, B8634 wires it."
  - "create_vertex_url and get_vertex_base_url belong to B1304 and B1305; B8634 wires them to vertex_claude_url."
  - "Building ApiBaseParams from LiteLLM_Params, a kwargs dict or a deployment is each caller's job (B4026, B4027, B2413 and the response metadata code in B004)."
  - "Loading litellm.model_alias_map from litellm_settings into the map passed in ApiBaseContext; no task in this entry owns that key."
  - "Calls at exception_mapping_utils.py L2404 and response_metadata.py L126 are wired by the tasks that own those files."

pitfalls:
  - "`stream` comes from `getattr(optional_params, \"stream\", False)` on the original argument, so a plain dict always gives false and only a LiteLLM_Params object with an extra `stream` key can give true; streaming_handler.py L255 and the alert callers pass dicts."
  - "The vertex non-claude string has no `https://` scheme and does not validate the location, while the claude URL goes through create_vertex_url and fails on an invalid location."
  - "The vertex branch runs after the resolver step, so `model` is the resolver's stripped model (no `vertex_ai/` prefix) when resolution worked and the alias-mapped model when it failed."
  - "A resolver failure leaves the provider None, so gemini and openai defaults are skipped for an unknown model prefix and the answer is None."
  - "The provider default for gemini uses the model name after resolution, so `gemini/gemini-pro` gives `.../models/gemini-pro:generateContent`."
  - "base_url is read only when it is a non-empty string; an empty api_base still wins because the check is `is not None`."
  - "declared_authenticating_provider ignores the resolver, so github_copilot never reaches get_llm_provider here; that is why it must run before step 5 and before the vertex branch."
  - "model_alias_map is checked only when it is non-empty and the model is an exact key; there is no prefix or pattern matching."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
