oracle_cases: []

deviations:
  - what: >-
      Background flush task failures log diagnostics via verbose_logger.exception but
      do not break the relay; the original bytes, status and headers are returned to
      the caller unchanged. Flush scheduling failure is itself logged with the chunk count
      in the failure message.
    why: >-
      Spend tracking is best-effort and must never interrupt request/response relay. LiteLLM
      uses the same approach: spend tracking exceptions are caught and logged, not propagated.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/main.py#L144-L149

  - what: >-
      Async initialization reads and closes error responses before rethrowing; the aread
      and aclose calls in the except block suppress all exceptions (BLE001 S110), so cleanup
      errors do not change the raised exception. The same safe-catch-all is applied to
      aclose during iteration termination.
    why: >-
      Cleanup failures (e.g., socket already closed) must not mask the original error.
      LiteLLM preserves this order: read the body, close the resource, then rethrow.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/main.py#L114-L126

out_of_scope:
  - B3570 owns the collector contract and provider_config.create_stream_collector; this task only calls it.
  - B173 owns the HTTPHandler and AsyncHTTPHandler send/iter/aiter/read/aread/close/aclose; this task only calls them through the client interface.
  - B252 owns Logging.flush_passthrough_collected_chunks and async_flush_passthrough_collected_chunks; this task only calls them via the logging object.
  - Stream relay composition and guardrail translation owned by B101; this task only implements the lifecycle primitives.
  - The llm_passthrough_route decorator and its request/response preparation are owned by B101.
  - AsyncPassthroughStreamingResponse.asend/athrow and PassthroughStreamingResponse.send/throw have no caller at the pin and are not implemented.

pitfalls:
  - "AsyncPassthroughStreamingResponse must throw RuntimeError if status_code or headers are accessed before __await__ completes; accessing them before initialization is a contract violation."
  - "The __await__ method returns the result of _init().__await__(), not a direct coroutine; pyright requires an ignore comment on the await inside _init."
  - "Flush is scheduled only once: the _flush_scheduled flag prevents the same collector from being flushed on both __anext__ exception and aclose."
  - "Background task tracking via _background_tasks.add and task.add_done_callback(discard) prevents the task set from growing without bound; a failed flush task is still removed."
  - "The _hidden_params dict is noted as mutable-ok because the router attaches response headers there in place; this is a known side effect preserved from LiteLLM."
  - "Collector failures set _failed = True and subsequent add() calls return immediately, so a collector exception stops all future collection but does not rethrow during iteration."
  - "Sync close() is a final cleanup method that may suppress exceptions; calling it twice (e.g., in a finally and a __del__) is safe because _flush_scheduled remains true."
  - "Empty streams (zero chunks fed to collector) do not schedule a flush; should_flush returns false when chunk_count is 0."

