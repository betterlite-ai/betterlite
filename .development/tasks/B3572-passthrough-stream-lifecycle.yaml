id: B3572
title: Passthrough stream relay and collector lifecycle
description: >-
  Build async and sync stream relay wrappers that expose upstream status and
  headers, closing resources on terminal iteration and scheduling spend
  collection once per response. Implement spend tracking collection that tolerates
  collector failures without breaking byte delivery to the caller, logging dropped
  spend but passing through unchanged bytes.

  AsyncPassthroughStreamingResponse wraps an async coroutine to httpx.Response,
  implements the async generator protocol (awaitable, iterable, closeable), and
  reads status/headers from the resolved response before exposing them. The
  __await__ method initializes via an inner _init coroutine that reads the
  response, captures headers and status, calls raise_for_status, and catches
  cleanup errors. Properties throw RuntimeError when accessed before awaiting.
  Iteration calls __anext__ which awaits the inner iterator, feeds each chunk to
  the spend collector, and starts the flush task on iteration end or exception.
  The aclose method schedules the flush once and closes the iterator/response,
  suppressing exceptions during cleanup. An asyncio.Task set tracks pending flush
  tasks for lifecycle accounting.

  PassthroughStreamingResponse is the sync equivalent: takes an httpx.Response
  directly, exposes status/headers immediately, iterates over response.iter_bytes(),
  feeds chunks to spend tracking, and calls executor.submit for the flush callback
  (not awaitable tasks). The __next__ method handles iteration and failure paths
  identically to async; close() schedules the flush.

  _SpendCollection wraps a provider_config's collector and defers failures: when
  the collector throws, _failed becomes true and subsequent add() calls return
  immediately. The should_flush property returns true only if chunks were added
  and collection did not fail. Failures are logged with verbose_logger.exception
  and the dropped chunk count.

  _as_async_generator and _as_generator are control-flow passthrough: async yields
  from an AsyncIterator[bytes], sync yields from Iterator[bytes]. Their docstrings
  and signatures match the source.

  _async_passthrough_request is the async entry point called by llm_passthrough_route
  when allm_passthrough_route=True. It calls client.client.send (which returns a
  coroutine for async clients), awaits it, and for non-streaming responses reads the
  body before calling raise_for_status. For streaming requests it returns an awaited
  AsyncPassthroughStreamingResponse. Non-coroutine responses raise an exception
  indicating expected async behavior was violated.

  Implement in betterlite-core::passthrough_stream. Every default, literal, env var
  and error code a user can observe is named in cases. Preserve the async task set
  mutable-ok comments, catch-all exception comments, and closure docstrings and
  type ignore comments from the source. The three sync resource-close exception
  handlers (response.close, response.aclose, iterator.aclose) are safe catch-alls
  for cleanup; do not change their scope. The once-only flush flag prevents the
  same collector from being flushed twice.

