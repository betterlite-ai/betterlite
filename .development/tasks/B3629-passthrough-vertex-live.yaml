id: B3629
title: Pass-through Vertex Live WebSocket route
description: >-
  Build the Vertex AI Live WebSocket pass-through of llm_passthrough_endpoints.py as the module passthrough_vertex_live in crates/betterlite-server. The route serves `/vertex_ai/live`: it picks the Vertex project, location and credentials, gets an access token, builds the upstream `wss://` URL and headers, and hands the socket to B3612's WebSocketRelay with a rewriter for the `setup` frame's model.
  This task owns the route function and its helpers only. The relay loops come from B3612, the setup-frame rewrite and model read from B3611, the credential store from B3602, the base URL from B3622 and the token calls from B1303 and B1304. Call them; do not copy them.
  Reuse the names B3628 declares in passthrough_openai_routes: `WebSocketRelayPort` (the port B3612's WebSocketRelay implements). The route reads the socket through B3612's `ClientSocket` only, because Vertex Live accepts without a subprotocol and needs no path or query read, so B3628's `RouteSocket` is not needed here.
  The three query values and the authenticated key arrive as arguments. The wrapper that binds them is the `@app.websocket("/vertex_ai/live")` function in proxy_server.py (L12813-L12842). It reads the query parameters `model`, `vertex_project` and `vertex_location` (all optional) and authenticates with B756's user_api_key_auth_websocket. This task also registers the path: `/vertex_ai/live` sends a WebSocket upgrade request to the live handler and every other request on that path (a POST, or a plain GET) to B3623's `vertex_aiplatform_route`, because axum lets a static path win over the `/vertex_ai/{endpoint}` capture and LiteLLM falls through to the HTTP route there.
  Every name below is at most 30 characters; LiteLLM's longer names are renamed on purpose.

  Entry point. `vertex_live_route(args: &VertexLiveArgs, socket: &dyn ClientSocket, auth: &UserApiKeyAuth) -> Result<(), VertexLiveError>` replaces vertex_ai_live_websocket_passthrough. `VertexLiveArgs` holds `model`, `vertex_project` and `vertex_location` (each `Option<String>`). `VertexLiveDeps` is built once by the architect and holds the credential router (B3602's PassthroughEndpointRouter), one shared B1302 token state, the B1304 region helpers, `WebSocketRelayPort`, an optional `LiveModelPort` and a `LiveFailurePort`.
  Both ports are declared in this module so tests use fakes. `LiveModelPort` has one method, `model_list() -> Vec<Deployment>`, backed by B844's router.get_model_list() with no arguments; no router means no `LiveModelPort`. `LiveFailurePort` has one async method, `post_call_failure(auth, error_text)`, backed by ProxyLogging.post_call_failure_hook (B8395 builds it and the wave 17 pass-through wiring part backs this port with it), called with an empty request data object.
  `VertexLiveError` is a thiserror enum for the one error the route can return, an invalid location in the host (see step 6). Each failure that LiteLLM handles inside the route is a socket close, not an error value.

  Steps of vertex_live_route, in this order:
  1. Accept the socket with ClientSocket::accept (no subprotocol). Read the client headers once into a map.
  2. `resolve_live_credentials(vertex_project, vertex_location, model)` replaces _resolve_vertex_live_credentials and returns `Option<VertexPassThroughCredentials>` (B3602's record at `crate::pass_through_credentials::VertexPassThroughCredentials`). Order: (a) B3602's get_vertex_credentials(project_id, location) with the query values; when it returns a record that has a vertex_project, use it. (b) Otherwise get_vertex_credentials_from_router_deployments(model); when it returns a record, use it. (c) Otherwise, when (a) returned a record without a project, use that one. (d) Otherwise call set_default_vertex_config() with no argument and return get_vertex_credentials(project_id, location) again.
  3. Merge. `configured_project` is the query vertex_project when it is non-empty, else the record's vertex_project, else none. `configured_location` follows the same rule with vertex_location. The credential value is the record's vertex_credentials, or none without a record. An empty query string counts as missing, as Python's `or` does.
  4. Region and token, inside one failure scope. `resolved_location` is B1304's get_vertex_region(configured_location or `us-central1`, model) when `model` is non-empty, else `configured_location` or `us-central1` (B1304's get_default_vertex_location). Then call B1303's `_ensure_access_token_async` with the credential value, `configured_project` and custom_llm_provider `vertex_ai_beta`; it returns the token and `resolved_project`. Use the one shared token state, not a fresh one per call: LiteLLM keeps one module-level VertexBase here, so tokens are cached across calls.
  5. Failure scope. Any error from step 4 is logged with the error text (never the token or the credential value) and then: call LiveFailurePort.post_call_failure with the key and the error text; when the client side of the socket is not disconnected (B3612's client state read), close with code 1011 and reason `Vertex AI auth failed: set a use_in_pass_through vertex model, default_vertex_config, or DEFAULT_VERTEXAI_* env`; return Ok. Steps 2 and 3 are outside the scope: their errors are not turned into a close.
  6. Upstream URL. `host_location` is resolved_location, or `us-central1` when empty. The host is B3622's passthrough_vertex_base_url(host_location) with the leading `https://` and the trailing `/` removed. The URL is `wss://{host}/ws/google.cloud.aiplatform.v1.LlmBidiService/BidiGenerateContent`. A host_location that fails B3622's check (for example an uppercase client location with no model that supplies a region) gives VertexLiveError, which the architect's adapter turns into a 1011 close with no reason, as an uncaught exception does in Starlette. The socket is already accepted, so no HTTP status exists.
  7. Upstream headers, as an insertion-ordered map: `Authorization: Bearer <token>` and `Content-Type: application/json`, then `x-goog-user-project: <resolved_project>` when resolved_project is non-empty. Then walk the client headers in order: a header whose lower-cased name starts with `x-goog-` is added under its own name when that exact name is not already a key of the map. The token is a secret value and never appears in a log or an error text.
  8. Call WebSocketRelayPort.relay with `WebSocketArgs { target: <url>, custom_headers, forward_headers: false, endpoint: Some("/vertex_ai/live"), cost_per_request: None, accept_websocket: false, setup_model_rewriter }` and the same socket and key. The endpoint text is what B3612 tests for the Vertex Live setup handling, so it must be exactly `/vertex_ai/live`, not the request path.

  Setup rewriter. `build_setup_rewriter(project, location, router)` replaces _build_vertex_live_setup_model_rewriter and returns the rewriter type that B3611 takes (read its merged name). LiteLLM returns none when the project or location is None; both are always set here (the token call returns a string project, possibly empty), so the rewriter is always built. It maps the `setup.model` string of the client's first frame:
  - A model that starts with `projects/` is returned unchanged.
  - Otherwise resolve the alias with `alias_to_upstream`, take its suffix with `publisher_model_suffix`, and return `projects/{project}/locations/{location}/{suffix}`.
  `alias_to_upstream(setup_model, router)` replaces _resolve_alias_to_upstream_model. No router returns the input. The candidates are the input and the part after its last `/`. Walk the router's model list in order and take the `litellm_params.model` of the first deployment whose `model_name` equals a candidate; the first match decides, even when its model is missing, which gives none. None returns the input. Otherwise run B174's get_llm_provider on the upstream model; its bad-request error returns the upstream model unchanged, and success returns the upstream model with a leading `{provider}/` removed (once, only as a prefix).
  `publisher_model_suffix(model)` replaces _vertex_publisher_model_suffix. When the text `publishers/` occurs anywhere, return the substring from its first occurrence to the end. Otherwise return `publishers/google/models/` followed by the part after the last `/` (the whole text when it has no `/`).
  Examples: `gemini-live-2.5-flash` gives `publishers/google/models/gemini-live-2.5-flash`; `models/gemini-live-2.5-flash` and `vertex_ai/gemini-live-2.5-flash` give the same; `projects/p/locations/l/publishers/acme/models/m` keeps `publishers/acme/models/m`.
