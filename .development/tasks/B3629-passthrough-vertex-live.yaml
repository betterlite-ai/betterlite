deviations:
  - what: The route takes the authenticated key as a required argument. LiteLLM's `user_api_key_dict=None` default and its `ValueError("user_api_key_dict is required ...")` after the credential work are not built.
    why: The key is always present because the wrapper authenticates first. The Rust type cannot express the missing case.
  - what: The route reads the socket through B3612's ClientSocket, the relay through WebSocketRelayPort, the router model list through LiveModelPort and the failure hook through LiveFailurePort.
    why: Python reads proxy_server globals (llm_router, proxy_logging_obj) with local imports. Rust needs seams for tests, and the architect wires the real values. What a client sees is the same.
  - what: An invalid host location after accept ends the socket with 1011 and no reason through the adapter.
    why: LiteLLM raises ValueError from get_vertex_base_url outside its try block, and Starlette closes with 1011 for an uncaught exception. B3622 also rejects a trailing newline, which Python accepts (see its deviations).
out_of_scope:
  - "user_api_key_auth_websocket: B756. The proxy_server.py app object and the one merge of all routers into the app: the architect with the skeleton."
  - "create_vertex_ai_live_websocket_endpoint (L3742-L3756): no caller at the pin. No cases."
  - "create_websocket_passthrough_route and the generic websocket helpers: B3612 and B3628 own them; this task only calls the relay port."
  - "get_vertex_region, get_default_vertex_location: B1304. _ensure_access_token_async: B1303. get_vertex_base_url: B3622 (passthrough_vertex_base_url). get_vertex_credentials, get_vertex_credentials_from_router_deployments, set_default_vertex_config and VertexPassThroughCredentials: B3602."
  - "_rewrite_vertex_live_setup_model, _resolved_vertex_live_setup and extract_model_from_vertex_ai_setup, which apply the rewriter to frames: B3611. The relay loops, the logging of the model and the cost: B3612."
  - "Vertex Live usage logging (vertex_ai_live_passthrough_handler in success_handler.py and its logging handler): the pass-through logging tasks own it, not the route."
  - "The production axum ClientSocket and tokio-tungstenite connector adapters, and the real LiveModelPort and LiveFailurePort: not built here; the task that wires the routes supplies them."
pitfalls:
  - "The relay endpoint must be the fixed text `/vertex_ai/live`; B3612 tests it as a substring to turn on the setup rewrite, so passing the request path breaks the model read."
  - "The socket is accepted before the credentials are looked up, so an auth failure is a 1011 close after the handshake, not a failed handshake."
  - "get_vertex_credentials with a project-less record is kept only as a third choice: router deployments are tried before it, and the default config only after it."
  - "set_default_vertex_config() runs only in the last branch, and it changes the shared credential router, so later calls see the defaults too."
  - "Empty query strings count as missing for project and location because LiteLLM uses `or`; `?vertex_project=` falls through to the record."
  - "get_vertex_region runs only when `model` is non-empty. Without a model the region is the configured one or us-central1, with no supported_regions check."
  - "The token state is shared across calls here, unlike the per-call VertexBase in B3622's HTTP auth; do not create a fresh state per socket."
  - "A caller `x-goog-user-project` is dropped only when the gateway also sends that header: the exact-name check compares the lower-case client name with the lower-case gateway name, so the client copy goes through when resolved_project is empty."
  - "The auth failure scope covers the region lookup and the token call only. The credential resolution before it and the base URL after it are outside it."
  - "The rewriter needs the router's model list on each setup frame; a first deployment with a matching model_name but no `model` stops the search and leaves the alias unchanged."
  - "The prefix strip uses the provider that get_llm_provider returns, so `vertex_ai/gemini-x` loses `vertex_ai/` but a model that merely contains it later is untouched."
  - "A POST or a plain GET to /vertex_ai/live must reach B3623's catch-all, so register the path with a method router that handles the upgrade and falls through for everything else; a GET-only static route would answer 405 or 400."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
