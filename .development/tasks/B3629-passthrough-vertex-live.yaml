dod:
  - text: publisher_model_suffix keeps everything from the first `publishers/`, and otherwise prefixes `publishers/google/models/` to the part after the last slash.
    proof: [suffix-tests, oracle]
  - text: The setup rewriter leaves a `projects/` model alone, resolves a gateway alias through the first matching deployment, strips only a leading provider prefix, and keeps the upstream model when provider resolution fails.
    proof: [rewriter-tests, oracle]
  - text: resolve_live_credentials follows the order explicit key with project, router deployments, projectless record, default config, and calls set_default_vertex_config only in the last case.
    proof: [credential-order-tests]
  - text: vertex_live_route merges query values over the record, treats empty strings as missing, derives the region with get_vertex_region only when a model is named, and calls the token function with `vertex_ai_beta`.
    proof: [route-merge-tests]
  - text: A region or token error runs the failure hook once, closes with 1011 and the exact auth reason only while the client is connected, and never reaches the relay; no token appears in a log line.
    proof: [auth-failure-tests]
  - text: The upstream URL is `wss://` plus the B3622 host plus the BidiGenerateContent path, and the headers hold the Bearer token, Content-Type, x-goog-user-project when a project exists, and caller x-goog-* headers whose exact name is not taken.
    proof: [upstream-tests, oracle]
  - text: The relay call carries forward_headers false, accept_websocket false, endpoint exactly `/vertex_ai/live`, no cost and the rewriter, and the socket is accepted once before any credential work.
    proof: [relay-call-tests]
  - text: A WebSocket upgrade request to /vertex_ai/live reaches vertex_live_route, and a POST or a plain GET to the same path reaches B3623's vertex_aiplatform_route.
    proof: [registration-tests]
checks:
  optional: []
  commands:
    - id: suffix-tests
      why: the publisher path suffix is built wrongly for a bare, prefixed or full model name
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::suffix(::|$)/)'
    - id: rewriter-tests
      why: the setup model rewrite or the alias lookup picks the wrong model or path
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::rewriter(::|$)/)'
    - id: credential-order-tests
      why: the credential sources are tried in the wrong order or the default config is set too early
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::credential_order(::|$)/)'
    - id: route-merge-tests
      why: project, location or region come out wrong, or the token call gets wrong arguments
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::route_merge(::|$)/)'
    - id: auth-failure-tests
      why: an auth failure skips the hook, closes with a wrong code or reason, or leaks the token
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::auth_failure(::|$)/)'
    - id: upstream-tests
      why: the upstream URL or headers are wrong, or a caller header overrides a gateway one
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::upstream(::|$)/)'
    - id: relay-call-tests
      why: the relay is called with wrong arguments or the socket is accepted at the wrong time
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::relay_call(::|$)/)'
    - id: registration-tests
      why: a request to /vertex_ai/live reaches the wrong handler or the route panics beside B3623's catch-all
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_vertex_live::tests::registration(::|$)/)'
