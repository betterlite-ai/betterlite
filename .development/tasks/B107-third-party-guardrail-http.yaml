deviations: []
out_of_scope:
  - "Every class, initializer argument and registry arm: B3750 to B3779, B8217, B8521 and B8522. Hook bodies: B9450 and B9451. Running held guardrails from ProxyLogging: B8666, assembled by B8399 and B8613."
  - "Headroom and Compresr get no HTTP case here: B8666 runs no hook for the Compression variant, and B3546 owns those requests."
  - "Conduct gets no HTTP case: LiteLLM does not start with a Conduct guardrail unless a separate package is installed (B9451)."
  - "callback_utils.py: the other initialize_callbacks_on_proxy arms stay with B189 and B8850 (detect_prompt_injection); add_guardrail_to_applied_guardrails_header is B3680; the helpers B8850's out_of_scope lists keep their owners."
  - "Starting lakera_prompt_injection or aporia_prompt_injection from litellm_settings.guardrails goes through B3683's RegistryStarter. It can't reach this module and drops callback_args, so the architect routes it."
pitfalls:
  - "The Aporia variables are APORIO_API_KEY and APORIO_API_BASE, with an O; APORIA_ spellings are not read."
  - "Without moderation_check pre_call the legacy Lakera callback only runs in the during-call hook. That hook races the model call, so HTTP cases must set pre_call."
  - "callback_settings sits at the top level of the config file, not under litellm_settings."
  - "The shipped example puts guardrail_name and litellm_params under litellm_settings.guardrails; a loader that accepts it hides a startup failure LiteLLM has."
  - "Lakera's enabled roles come from a legacy guardrail named prompt_injection, so a case that sets no legacy list sends system, user and assistant."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
