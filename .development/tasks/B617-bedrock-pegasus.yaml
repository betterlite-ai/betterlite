id: B617
title: Bedrock TwelveLabs Pegasus video chat
description: >-
  Add Pegasus input-media source and text prompt projection, response-format normalization and reply transformation.
  Preserve provider-supported S3 references as descriptors without downloading them at request transformation time;
  supplied inline bytes use the bounded media helper.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py:
  AmazonTwelveLabsPegasusConfig.get_supported_openai_params L46-L52; AmazonTwelveLabsPegasusConfig.map_openai_params
  L54-L68; AmazonTwelveLabsPegasusConfig._normalize_response_format L70-L101; AmazonTwelveLabsPegasusConfig.transform_request
  L103-L130; AmazonTwelveLabsPegasusConfig._build_media_source L132-L156; AmazonTwelveLabsPegasusConfig._convert_messages_to_prompt
  L158-L180; AmazonTwelveLabsPegasusConfig.transform_response L182-L270.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/pegasus.rs with adjacent tests under pegasus/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation bedrock_pegasus in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function pegasus_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  pegasus_media_source, text_video_prompt, response_format_json, segments_and_response, usage_and_finish_reason.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_pegasus* using HelperCase: kind: helper
  and the externally tagged bedrock_pegasus variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_pegasus that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_pegasus_reply consumes Pegasus response JSON bytes in crates/betterlite-bedrock/src/pegasus.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_pegasus.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_pegasus.
  The adjacent test replays_the_bedrock_pegasus_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 189 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 460 planned, 475 maximum changed lines.
