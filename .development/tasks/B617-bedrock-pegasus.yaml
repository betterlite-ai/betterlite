id: B617
title: Bedrock TwelveLabs Pegasus video chat
description: >-
  Add Pegasus input-media source and text prompt projection, response-format normalization and reply transformation.
  Preserve provider-supported S3 references as descriptors without downloading them at request transformation time;
  supplied inline bytes use the bounded media helper.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py:
  AmazonTwelveLabsPegasusConfig.get_supported_openai_params L46-L52; AmazonTwelveLabsPegasusConfig.map_openai_params
  L54-L68; AmazonTwelveLabsPegasusConfig._normalize_response_format L70-L101; AmazonTwelveLabsPegasusConfig.transform_request
  L103-L130; AmazonTwelveLabsPegasusConfig._build_media_source L132-L156; AmazonTwelveLabsPegasusConfig._convert_messages_to_prompt
  L158-L180; AmazonTwelveLabsPegasusConfig.transform_response L182-L270.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: pegasus_media_source: Choose truthy mediaSource or media_source; if the resulting value
  is a dict, return it unchanged, including an empty dict selected as the second value. A truthy non-dict first
  value prevents using a later dict alias but allows the next source branch. Then choose truthy video_base64 or
  base64_string, wrap B183 get_base64_str as base64String without decoding/validation. Finally choose truthy video_s3_uri,s3_uri,media_source_s3_uri
  in order, and optional truthy video_s3_bucket_owner,s3_bucket_owner,media_source_bucket_owner as bucketOwner inside
  s3Location. No source yields None; never download S3 or other descriptors. text_video_prompt: Default missing
  role to user and content to empty string, retaining explicit None through Python string formatting. For list content
  join fragments with spaces: dict text uses text default empty, image_url/video_url/audio_url become <image>/<video>/<audio>,
  string items pass through, other items/types drop. Build {role}: {content} for each message, join with newline
  and strip the complete result; keep role prefixes even for empty content. Content URLs are placeholders only,
  with no outbound access. response_format_json: For a dict, json_schema key presence wins even when jsonSchema
  also exists: use json_schema.schema when that nested key exists, otherwise the complete json_schema value, under
  jsonSchema. This discards name/type and unrelated envelope fields. Dicts without json_schema pass unchanged, including
  jsonSchema and {}. Non-dicts call B2202 type_to_response_format_param and use its truthy result or the original
  value; Python class-object schema conversion belongs to B160 and is out of scope for HTTP JSON records. segments_and_response:
  Use only the message field for visible text and mapped finishReason for the first choice. Ignore segments,response
  and any body usage; those aliases are not handled in this owned implementation. Preserve other response choices
  and id. usage_and_finish_reason: Use the same header-count cases as B612: x-amzn-bedrock-input-token-count and
  x-amzn-bedrock-output-token-count truthy values go through int, including "0" and negatives; empty/missing values
  call B196 token_counter(messages=...) or token_counter(text=reply,count_response_tokens=True). Errors occur outside
  the content catch. Set created to integer epoch seconds, model to the request model, and usage total to input
  plus output. pegasus_options: Supported names are exactly max_tokens,max_completion_tokens,temperature,response_format.
  Both token aliases write maxOutputTokens in input order, temperature copies unchanged, response_format writes
  normalized responseFormat; ignore other names. Build inputPrompt first, then mediaSource if present, temperature/maxOutputTokens
  by key presence including None, and responseFormat only when its normalized value is truthy. Do not mutate options
  or send unrelated keys. pegasus_reply_errors: decode_pegasus_reply parses raw JSON. Decode errors raise B682 BedrockError
  with upstream status/headers and Error parsing response: {raw_text}, error: {error}. The decoded record is debug-logged
  with indent=4/default=str. Read message default empty and finishReason default stop, mapping through B206; explicit
  None is not replaced by the defaults. Require truthy message plus choices[0].message with tool_calls None; even
  [] tool_calls fails with Unable to set message content. The assignment catch uses original status/headers and
  Error setting response content: {error}. Response: {completion_response}. Nonobject JSON and finish mapping failures
  before that catch propagate separately.


  B183 get_base64_str is a parsed-string projection only. This task introduces no media decoder or pixel validation;
  the only new outside-byte decoder is the existing decode_pegasus_reply named below.


  Implement crates/betterlite-bedrock/src/pegasus.rs with adjacent tests under pegasus/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation bedrock_pegasus in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function pegasus_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  pegasus_media_source, text_video_prompt, response_format_json, segments_and_response, usage_and_finish_reason,
  pegasus_options, pegasus_reply_errors. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_pegasus* using HelperCase: kind: helper
  and the externally tagged bedrock_pegasus variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_pegasus that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_pegasus_reply consumes Pegasus response JSON bytes in crates/betterlite-bedrock/src/pegasus.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_pegasus.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_pegasus.
  The adjacent test replays_the_bedrock_pegasus_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 189 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 225 production lines, 235 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines.
