    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L46-L270
  why: >-
    Own AmazonTwelveLabsPegasusConfig.get_supported_openai_params, AmazonTwelveLabsPegasusConfig.map_openai_params,
    AmazonTwelveLabsPegasusConfig._normalize_response_format, AmazonTwelveLabsPegasusConfig.transform_request, AmazonTwelveLabsPegasusConfig._build_media_source,
