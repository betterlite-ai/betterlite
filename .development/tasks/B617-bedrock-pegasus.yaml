- text: 'pegasus media source: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-pegasus/pegasus-media-source.yaml.'
  proof:
  - case-pegasus-media-source
  - oracle
  - helper-python
- text: 'text video prompt: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-pegasus/text-video-prompt.yaml.'
  proof:
  - case-text-video-prompt
  - oracle
  - helper-python
- text: 'response format json: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-pegasus/response-format-json.yaml.'
  proof:
  - case-response-format-json
  - oracle
  - helper-python
- text: 'segments and response: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-pegasus/segments-and-response.yaml.'
  proof:
