  - tools/oracle/helpers/bedrock_pegasus.py
  - tools/oracle/cases/helpers/providers/bedrock-pegasus/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_pegasus*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
