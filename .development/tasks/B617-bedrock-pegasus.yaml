checks:
  optional:
  - mutants
  commands:
  - id: case-pegasus-media-source
    why: The pegasus-media-source behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::pegasus_cases::case_[0-9]+_pegasus_media_source$/)'
  - id: case-text-video-prompt
    why: The text-video-prompt behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::pegasus_cases::case_[0-9]+_text_video_prompt$/)'
  - id: case-response-format-json
    why: The response-format-json behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::pegasus_cases::case_[0-9]+_response_format_json$/)'
  - id: case-segments-and-response
    why: The segments-and-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::pegasus_cases::case_[0-9]+_segments_and_response$/)'
  - id: case-usage-and-finish-reason
    why: The usage-and-finish-reason behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::pegasus_cases::case_[0-9]+_usage_and_finish_reason$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_pegasus.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_pegasus*")"
      && grep -lq 'bedrock_pegasus' tools/oracle/fuzz/corpus/helper_case/bedrock_pegasus* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_pegasus$/)' && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_pegasus)"
      && grep -q 'decode_pegasus_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_pegasus.rs && cargo
      nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_pegasus_corpus$/)'
