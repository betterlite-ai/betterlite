id: B885
title: Intersect entity model allowlists
description: >-
  Assemble the model allowlists actually enforced at each level and stamp budgeted access groups used
  for spend attribution. This task does not itself intersect model permissions or override a team denial;
  those checks belong to B886/B747. It returns ordered allowlist collections and sorted group names.

  B747 resolves the key's model list. Without a DB, enforced_model_allowlists returns exactly key models
  and tuple(token.team_models or []). With a DB, fetch the team through B737 when team_id is non-null;
  only without a team object load the user through B736, with upsert disabled. Suppress UserNotFoundError
  alone, not outages. Fetch a non-null project through B879. Return five lists in key, team, member,
  user, project order; organization is deliberately absent from this enforcement helper. Missing rows
  contribute empty lists and other lookup failures propagate.

  Member scope requires a team object and user_id. If team_membership_loaded is false, B2318 loads it;
  if true, reuse even a supplied None without another query. B2315 extracts allowed_models; None gives
  an empty sequence. For attribution, _granted_model_lists instead returns key, team, member, project,
  org, deliberately excluding user scope. The org ID is truthy key org_id before team.organization_id;
  only None bypasses the lookup. B879 errors are debug-logged and contribute no org grants.

  Collecting groups returns empty immediately if model, token, router or DB is missing. Load B740's
  budget registry before any allowlist walk: empty set means no work; None means conservatively treat
  all covering groups as budgeted. Union B302's get_model_access_groups across requested models using
  the token's team_id. Intersect with a known registry, then with the union of literal names in the
  five attribution lists. Wildcard/empty lists do not name a group, and a model's group membership
  alone does not charge that group. Sort and deduplicate the matched names.

  stamp_matched_model_access_groups returns empty for no token, catches every collection failure with
  a debug log and returns empty, and writes matched_model_access_groups only when the result is nonempty.
  Empty/error results leave any existing stamp untouched. This is best-effort attribution, not a new
  authorization denial. There are no settings, DB writes, secret writes or agent lookups in these ranges.


  Build the production model_grant_intersection module in betterlite-auth; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _model_access_groups_serving_model (L4683-L4694; 12 source lines), _team_member_granted_models (L4697-L4718;
  21 source lines), _org_granted_models (L4721-L4743; 22 source lines), _granted_model_lists (L4746-L4777;
  32 source lines), _user_object_or_none (L4780-L4795; 16 source lines), enforced_model_allowlists (L4798-L4850;
  53 source lines), collect_matched_model_access_groups (L4853-L4914; 56 source lines), stamp_matched_model_access_groups
  (L4917-L4954; 37 source lines).


  Add the model_grant_intersection operation under B856 Management::auth. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a model-grant-intersection-* seed to B171 helper_case, which already owns this decoder.


  Intersections use independently seeded user/team/member/project grants in B860 Postgres, from
  POSTGRES_TEST_URL or testcontainers. Drive denial cases through the auth pipeline and inspect the
  contributing entity sets in pure cases, particularly the different enforcement and attribution inputs.


  Sizing: 249 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  240 production, 240 behavior tests, 75 adapters and 65 wiring lines, 620 within a 650-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::model_grant_intersection::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
