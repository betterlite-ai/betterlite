dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: layered_grant_intersection,
      member_narrowing, matched_group_stamping, no_db_two_lists, db_five_list_order,
      team_suppresses_user_lookup, user_not_found_only_suppressed, team_project_errors_escape,
      membership_loaded_none_no_query, missing_member_inputs_empty, attribution_five_list_order,
      key_org_before_team_org, org_error_debug_empty, missing_collection_inputs,
      empty_registry_short_circuit, unknown_registry_all_covering, team_scoped_group_union,
      group_name_must_be_granted, wildcard_no_attribution, matched_sorted_deduplicated,
      stamp_exception_debug_drop and empty_stamp_keeps_previous.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^model_grant_intersection::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/model_grant_intersection.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/model-grant-intersection-*")"
        && grep -rlq "model_grant_intersection" tools/oracle/fuzz/corpus/helper_case/model-grant-intersection-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::model_grant_intersection::tests::/)
        - test(/replays_the_/)'
