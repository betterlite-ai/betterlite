  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/credential_endpoints/endpoints.py#L76-L141
    why: create_credential records user_api_key_dict.user_id as created_by and updated_by.
dod:
  - text: >-
      key_context builds its principal with B870's principal_from_key and resolve_as's projection: the user id is the
      key's user_id, an empty one included, the email is the key's user_email, the subject falls back to key_alias
      and then the hashed token, and credential_ref carries only the token. A key without a user_id has no user.
    proof: [key-stage-user]
  - text: >-
      master_key_context fills user with id "default_user_id" and no other field and roles with Role::PlatformAdmin,
      and keeps subject "master_key", principal_type ServiceAccount and no source key.
    proof: [master-stage-user]
  - text: management_admins' AdminCaller reads the master key as a proxy admin with user id default_user_id.
    proof: [master-admin-role]
  - text: >-
      A non-admin key with user_id u1 gets /usage/ai/chat's streamed answer scoped to u1 instead of the
      service-account 403.
    proof: [usage-chat]
  - text: >-
      The invitation routes see a key's user: /invitation/new records it as creator, /invitation/update as updater,
      and an org admin's key may delete the invitation it created.
    proof: [invitations]
  - text: /global/spend/logs and /global/spend/keys scope an internal user's key to its user_id instead of answering that the user id is missing.
    proof: [spend-totals]
  - text: /credentials records the key's user_id as creator, and default_user_id for the master key.
    proof: [credential-actor]
  - text: >-
      The key stage calls principal_from_key, and the key lookup, auth stage and reader test suites still pass with
      master_key_context moved.
    proof: [module-tests]
checks:
  optional: []
  commands:
    - id: key-stage-user
      why: key_context still builds its own principal, leaves the user out, drops an empty user id, loses the email or keeps key_name as subject or key_id.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^auth::auth_key_lookup::tests::(key_context_fills_the_key_user|key_context_fills_an_empty_user_id|key_context_leaves_a_userless_key_without_a_user)$/)'
    - id: master-stage-user
      why: The master key's principal has no user or no PlatformAdmin role, or the fill changed its subject, type or source key.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^auth::auth_key_lookup::tests::master_key_context_carries_the_admin_user_and_role$/)'
    - id: master-admin-role
      why: A role-only admin check still sees the master key as a non-admin.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^management_admins::tests::the_master_key_is_a_proxy_admin_caller$/)'
    - id: usage-chat
      why: A user-bound non-admin key still gets the service-account 403 from /usage/ai/chat.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat_route::tests::caller_answers_a_user_bound_key_from_the_key_stage$/)'
    - id: invitations
      why: An invitation route still sees no user on a key, so it records the wrong creator or updater or refuses an org admin its own invitation.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^invitation_routes::tests::invitations::(new_invitation_by_an_org_admin_key_records_its_user|update_by_a_user_bound_key_records_its_user|delete_lets_an_org_admin_key_delete_its_own_invitation)$/)'
    - id: spend-totals
      why: The spend totals still answer an internal user's key that its user id is missing.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^spend::totals::tests::routes::(logs_scope_a_user_bound_key_to_its_user|keys_scope_a_user_bound_key_to_its_user)$/)'
    - id: credential-actor
      why: /credentials still records no creator for a key or for the master key.
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^credentials::tests::create::(create_records_the_key_user_as_actor|create_records_the_master_key_admin_user_as_actor)$/)'
    - id: module-tests
      why: The key stage does not use principal_from_key, or the projection or the move broke another key lookup, auth stage or reader test.
      run: >-
        grep -q -F 'principal_from_key' crates/betterlite-server/src/auth/auth_key_lookup.rs
        && cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^(auth::|usage_ai_chat_route::|invitation_routes::|spend::|credentials::|tracing_routes::|api::claude_plugin_write::|guardrails::chat_guardrail_translation::|guardrails::submissions::|management_guards::|management_admins::|plugin_routes::|organization_create::)/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The about 28 route modules that grant master rights on principal.subject == \"master_key\", the master principal's subject, and LiteLLM's master key record as its source_key: B10171."
  - "The readers: none of them changes here. Their master-key fallbacks to default_user_id and their key-first reads stay, and so do the server modules' own \"default_user_id\" constants."
  - "KeyIdentity and key_identity in betterlite-auth, which other planned tasks name; they lose their server caller but stay."
  - "The JWT, OAuth2 and SSO stages, which don't exist on main yet; their tasks build their own principals."
  - "HTTP oracle cases, for the reasons in the description."
pitfalls:
  - "Fill the user whenever the key's user_id is Some, an empty string included: store.py L172 tests `is not None`, and caller_user_id_for_non_admin refuses only a missing id. principal_from_key already does; don't add a filter in key_context."
  - "Pass resolve_as's projection exactly: subject_fallback and token_id are the hashed token, key_id is None. A different projection gives the same key two principals depending on which path ran."
  - "The subject now falls back to key_alias, which the key's owner picks, so until B10171 lands a key aliased \"master_key\" (or owned by a user with that id) passes the subject comparisons. No booted request authenticates with a virtual key yet, and B10171 removes the comparisons; don't add a guard here."
  - "Keep the master key's subject \"master_key\", principal_type ServiceAccount and source_key None. The route modules recognize the master by that subject until B10171, and about twenty auth stage tests assert it."
  - "guardrails/submissions/teams.rs caller() reads the email from principal.user whenever a user is set, so the key's user_email must reach UserIdentity.email; principal_from_key takes it from the key's extra fields."
  - "auth_identity.rs counts 300 lines for the file-size check on main and 299 after B870, so the master fill can't stay there; the move is what makes room. B870 and several running auth tasks edit the same import block, so read the imports again after merging main."
  - "Use betterlite_db::model_secrets::DEFAULT_USER_ID for the master user; don't add another \"default_user_id\" literal."
  - "A route test whose caller is a hand-written Principal with user or roles set passes on main and proves nothing. Leave the existing fixtures as they are: new_invitation_by_the_master_key_has_no_actor and caller_takes_an_admins_own_user_id_and_allows_null still pass, because their master principals are hand-built."
  - "invitation_routes/tests/support.rs already has a key_caller(fields) that builds a hand-written principal with no user; the invitation tests import caller_through_key_stage from crate::auth::auth_key_lookup::tests, not that one."
  - "The file-size count frees only `mod` and `pub mod` lines, so `pub(crate) mod tests;` counts as one line in auth_key_lookup.rs, which stays far under 300."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
