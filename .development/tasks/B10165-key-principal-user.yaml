    why: _principal_from_key, the projection LiteLLM's auth seam applies to every resolved key and B870's principal_from_key ports; L172 sets the user from user_id and user_email whenever user_id is not None.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L3224-L3245
    why: _resolve_request_principal, where the seam calls _principal_from_key with the token as subject fallback and credential_ref token_id.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L2085-L2098
    why: The master key's UserAPIKeyAuth carries user_role PROXY_ADMIN and user_id litellm_proxy_admin_name.
