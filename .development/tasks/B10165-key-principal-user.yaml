id: B10165
title: API-key and master-key authentication fill the principal's user and the master key's admin role
description: >-
  No auth stage on main fills Principal.user. key_context in crates/betterlite-server/src/auth/auth_key_lookup.rs (B738) turns a resolved virtual key into the request's Principal with `user: None`, although key_identity hands it the key's user_id and key_context even uses that id as the subject. master_key_context in crates/betterlite-server/src/auth/auth_identity.rs does the same for the master key, and it leaves `roles` empty too. The route code that ports LiteLLM's `user_api_key_dict.user_id` reads `principal.user`, so every API-key caller looks like a service account. On the route modules: /usage/ai/chat (B8271) answers "Service-account keys cannot query user analytics. Use a user-bound key, or call as a proxy admin." with 403 to every non-admin key. /global/spend/logs answers "/global/spend/logs Error: User ID is None" and /global/spend/keys and /global/spend/models answer "No user_id found" (B1724). An org admin's key never passes the admin check of /invitation/new and /invitation/delete, since management_admins' AdminCaller reads its user id from principal.user, and /invitation/delete refuses it with "Organization admins can only delete invitations they created." /invitation/update cannot identify the caller, a proxy admin's key makes /invitation/new record default_user_id as creator (B8599), /credentials records no creator (B1601), and a proxy admin's key registers a /claude-code/plugins entry without created_by. The guardrail translation leaves user_api_key_user_id and user_api_key_user_email out of the metadata, and skills and container files stamp a user-bound key's resources with its team or key scope where LiteLLM stamps the user id, so the user's team mates can open them. With no roles, the master key fails every admin check that reads the PlatformAdmin role without also comparing the subject to "master_key": betterlite-core's managed_resource_store::is_proxy_admin, management_admins' AdminCaller.proxy_admin (B863) and PollCaller.platform_admin.


  LiteLLM reads the key's user_id in every one of these places. Its auth seam projects the resolved key with IdentityStore._principal_from_key, which sets `user = UserIdentity(id=key.user_id, email=key.user_email)` whenever user_id is not None (resolvers/store.py L172, called from _resolve_request_principal L3224-L3245). The master key authenticates as a UserAPIKeyAuth with user_role PROXY_ADMIN and user_id litellm_proxy_admin_name (user_api_key_auth.py L2085-L2098), the constant LITELLM_PROXY_ADMIN_NAME = "default_user_id" (constants.py L1738). The Rust role for PROXY_ADMIN is Role::PlatformAdmin: map_role in crates/betterlite-auth/src/auth_identity/roles.rs maps UserRole::ProxyAdmin to it, and key_roles gives the same for a key whose user_role is proxy_admin.


  B870 (PR #3304) adds principal_from_key and Projection in betterlite_auth::identity_store::principal, the whole _principal_from_key projection, and its identity-store path uses them once a composition root installs the store's ports. After B870 two places still build a principal by hand, and this task fixes both. The first is the fallback path: key_context in auth_key_lookup.rs, which the key stage uses whenever the identity store's ports are not installed, today on every request. The second is the master key: master_key_context, which the master stage, the key lookup prefetch and B870's identity-store prefetch all call.


  The fallback path. key_context builds its principal with `principal_from_key(&outcome.auth, Projection { auth_method: AuthMethod::ApiKey, issuer: None, subject_fallback: Some(&outcome.hashed_token), scopes: &[], credential_ref: Some(CredentialRef { key_id: None, token_id: Some(outcome.hashed_token.clone()) }), network: None })`, the projection IdentityStore::resolve_as passes on B870's path, so a key gets the same principal on both paths. The user is then LiteLLM's: id from the key's user_id (an empty one included), email from its user_email, every other UserIdentity field None, and no user when the key has no user_id. Other fields change on this path too, each toward LiteLLM: the subject is the user id, then key_alias (key_name before), then the hashed token; principal_type is ServiceAccount for a key without a user id; credential_ref.key_id is None; organization, project and end_user come from the key; a team's role comes from its team_member row instead of always Member. Their readers on main: tracing_routes/access.rs takes token_id before key_id, so nothing changes there; betterlite-core's managed_resource_store loses the "key:<key_name>" owner scope and keeps "key:<hashed token>", as LiteLLM's CredentialRef(token_id=...) gives; spend/reports/caller.rs and the guardrail translation read teams, org and end user as LiteLLM does. KeyIdentity and key_identity stay in betterlite-auth.


  The master key. master_key_context sets `user` to `Some(UserIdentity { id: DEFAULT_USER_ID.to_owned(), external_id: None, user_name: None, email: None, display_name: None })`, with betterlite_db::model_secrets::DEFAULT_USER_ID, the constant that already holds LiteLLM's "default_user_id", and `roles` to `vec![Role::PlatformAdmin]`. Its subject stays "master_key", its principal_type ServiceAccount and its source_key empty: about 28 route modules still grant master rights on `principal.subject == "master_key"`, and B10171 replaces them and gives the master principal LiteLLM's whole master key record. auth_identity.rs counts 300 lines for the gate's file-size check on main and 299 after B870 (the `mod tests;` line is free), so master_key_context moves next to key_context in auth_key_lookup.rs, together with the imports only it uses (subtle's ConstantTimeEq among them). auth_identity.rs keeps `pub(crate) use crate::auth::auth_key_lookup::master_key_context;`, so master_key_stage, which stays in auth_identity.rs, and every import through auth_identity keep working, B870's server identity_store.rs among them. Move it whatever the file's size is when you start.


  The readers then behave as LiteLLM does without a change of their own. The ones that read the key's user_id first and fall back to principal.user (organization_create/caller.rs, plugin_routes/routes.rs caller_identity, invitation_routes/queue/request.rs queue_user_id) answer as before. The master fallbacks to default_user_id in invitation_routes/invitations/update.rs, api/claude_plugin_write/access.rs creator_id and the invitation store give the same id the master principal now carries. For the master key, /credentials now records default_user_id as creator, and the role-only admin checks named above see an admin, as LiteLLM does.


  Tests. crates/betterlite-server/src/auth/auth_key_lookup/tests.rs is declared with `pub(crate) mod tests;`, as routes::tests is, and gains `pub(crate) fn caller_through_key_stage(fields: &str) -> AuthContext`: it builds a UserAPIKeyAuth from a JSON object of key fields with UserAPIKeyAuth::construct(AuthInput::Dict(..)) and returns key_context's AuthContext for it with hashed_token "hashed-key". The new route tests build their caller with caller_through_key_stage or master_key_context, never with a hand-written Principal: the existing fixtures set `user` and `roles` by hand, which is how this bug passed every route test.


  In auth::auth_key_lookup::tests: key_context_fills_the_key_user (fields key_name "key-name", key_alias "alias-1", user_id "u1", user_email "u1@example.com", team_id "t1": user is UserIdentity with id "u1" and that email and nothing else, subject "u1", principal_type Human, credential_ref key_id None and token_id "hashed-key"), key_context_fills_an_empty_user_id (user_id "" gives a user with id "" and principal_type ServiceAccount), key_context_leaves_a_userless_key_without_a_user (key_name "svc", key_alias "svc-alias" and team_id "t1": user None, subject "svc-alias", principal_type ServiceAccount) and master_key_context_carries_the_admin_user_and_role (user id "default_user_id" with every other field None, roles exactly [Role::PlatformAdmin], subject "master_key", principal_type ServiceAccount, source_key None).


  In management_admins::tests: the_master_key_is_a_proxy_admin_caller takes master_key_context's principal through AdminCaller::from_principal: proxy_admin is true, user_id is Some("default_user_id"), and user_has_admin_privileges answers true without a call to the users store.


  In usage_ai_chat_route/tests/caller.rs: caller_answers_a_user_bound_key_from_the_key_stage sends the tool body as caller_through_key_stage(r#"{"user_id":"u1"}"#) with the real GuardCallerId and gets 200 with the done event, the source sees user id Some("u1"), and the model gets one tool, as caller_uses_the_real_guard_id_for_a_user_bound_non_admin expects for its hand-built principal.


  In invitation_routes/tests/invitations.rs: new_invitation_by_an_org_admin_key_records_its_user (caller_through_key_stage over user_id "u1" and user_role "org_admin", open scope, body {"user_id":"alice"}: 200 and created is [("alice", Some("u1"))]), update_by_a_user_bound_key_records_its_user (caller_through_key_stage over user_id "u1", record inv-1: 200, updated_by "u1" in the body and in the store) and delete_lets_an_org_admin_key_delete_its_own_invitation (org-admin key over user_id "u1", privileged scope, record inv-1 created by "u1": 200 and deleted is ["inv-1"]).


  In spend/totals/tests/routes.rs: logs_scope_a_user_bound_key_to_its_user (caller_through_key_stage over user_id "u1" and user_role "internal_user" on /global/spend/logs?api_key=sk-one: 200 and the store call is user_daily_spend(u1,Some("sk-one"))) and keys_scope_a_user_bound_key_to_its_user (the same key on /global/spend/keys: the store call is user_keys_by_spend for u1).


  In credentials/tests/create.rs: create_records_the_key_user_as_actor (caller_through_key_stage over user_id "u1": the store's created actor is Some("u1")) and create_records_the_master_key_admin_user_as_actor (the principal from master_key_context: Some("default_user_id")).


  There are no HTTP oracle cases. The booted proxy installs no KeyAuthenticator (state/auth_key_lookup.rs leaves the slot None) and no identity-store ports, so no booted request authenticates with a virtual key, and the usage chat, invitation, spend totals and credentials routers are not composed into the app yet. Each route test drives that route's own router. B870's oracle cases already compare principal_from_key with _principal_from_key.
scope:
  paths:
    - crates/betterlite-server/src/auth/auth_key_lookup.rs
    - crates/betterlite-server/src/auth/auth_key_lookup/tests.rs
    - crates/betterlite-server/src/auth/auth_identity.rs
    - crates/betterlite-server/src/management_admins/tests.rs
    - crates/betterlite-server/src/usage_ai_chat_route/tests/caller.rs
    - crates/betterlite-server/src/invitation_routes/tests/invitations.rs
    - crates/betterlite-server/src/spend/totals/tests/routes.rs
    - crates/betterlite-server/src/credentials/tests/create.rs
  lint_tables: false
