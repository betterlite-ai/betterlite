id: B755
title: Validate resolved virtual keys and session expiry
description: >-
  Implement VirtualKeyValidation over a resolved principal, cloning cached rows before request-local updates.
  Compose expiry, blocked/deactivated users, budget and model/fallback services in pinned order. Return
  AuthContext plus response metadata needed by B004/B012; key hashes never become valid external bearer
  credentials.


  For a nonnull token first apply B751 temporary budget increase, then reject blocked is true with
  Key is blocked. Update via `/key/unblock` if you're an admin. Next B889 authorizes key and fallback
  models, then B735 prefetches referenced objects. A nonnull user_id loads B736 with upsert=false;
  any error logs DEBUG and treats the user as absent. A returned user replaces user_model_max_budget.
  Only dict metadata.scim_active exactly false denies, with the user ID and SCIM deactivation message.
  Both ordinary exceptions become B757 auth_error 401. Resolve the model through B881;
  B750 zero-cost recognition requires a router and nonnull model and logs INFO when budgets are skipped.


  Before expiry, non-skipped budgets with nonnull token.team_member_spend and database/user/team IDs
  read B733's membership cache; misses query B726 TeamMembershipRepository.find_first with budget
  included. Cache a returned typed row for exactly five seconds. Read errors, conversion and cache-write
  errors propagate. No row or relation skips. B2310 effective_max_budget uses the UTC clock; only a
  positive ceiling reads B2321 spend:team_member:<user>:<team>, using token spend as fallback. At
  equality first call B751 member alert with team alias/metadata, org, user email and costs, then raise
  BudgetExceededError with entity team_member, user:team ID and TeamMember=<user>:<team> message.


  Expiry accepts datetime or ISO text; naive timestamps become UTC. Log DEBUG then reject only expiry
  strictly before now, allowing equality. The 401 expired_key error includes both timestamps and B881's
  abbreviated bearer param (sk-... below MINIMUM_CUSTOM_KEY_LENGTH, otherwise sk-... plus last four).
  Invalid ISO input propagates through B757; zero-cost requests still expire. For non-skipped budgets,
  run B751 threshold alerts before hard budget (LLM routes only), then soft budget. Resolve current
  models; a nonempty dict key budget plus database, models and nonnull token invokes B753 fallback
  checks in order. Re-resolve the models after possible rewrites; then user model checks and nonempty
  dict end-user model budgets with a nonnull end-user ID. The limiter port defined here exposes
  is_end_user_within_model_budget; B071 supplies it, and its boolean return is ignored unless it raises.


  Fetch a team for nonnull team_id, treating UI_TEAM_ID as TeamNotFoundError. Catch HTTPException only
  and build a team from the token's max/soft/model budgets, spend, tpm/rpm/tpd, blocked, models, metadata,
  permission ID and B738 permission resolution. Refresh token.team_object_permission and team_metadata
  from this row; without a team clear only the permission. B879 fetches a nonnull project ID and refreshes
  project metadata/alias only for a returned row. A positive global max_budget and database invoke
  B753 coordinated spend lookup even for a zero-cost model. Known spend schedules proxy_budget with
  token, spend, max_budget, admin user_id, team_id and PROXY event group.


  Missing token.token raises HTTP401 Invalid API key, no token associated. Otherwise use that internal
  token for the result, serialize nonnull fields excluding token, and manually retain request-only
  budget_throttle_pct. Only when an end-user row exists overlay end_user_params and its object permission.
  A null input token ultimately raises Invalid proxy server token passed. The nested Invalid API key
  null-token guard is unreachable after entering the nonnull branch; do not invent an HTTP case for it.
  B889 builds the returned auth object; set via_virtual_key=true. This function itself never invokes
  common_checks despite its comment; B855/B1221 own that later admission step. There are no database writes.


  Build the production auth_key_validation module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  validate_resolved_virtual_key (L2211-L2622; 333 source lines).


  Budget helpers retain authority over their own arithmetic and finite guards; validation forwards
  the carried limits and snapshots without treating a missing field as zero.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.max_budget=0.0.


  Add the auth_key_validation operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-key-validation-*
  seed to B171 helper_case, which already owns this decoder.


  Resolved-key HTTP cases use B732 state on chat requests, proving expiration still applies to free
  models and that fallback selection recomputes cost classification before later budget checks.


  B860/Postgres fixtures run through POSTGRES_TEST_URL or testcontainers with stale token team
  fields, live user/SCIM state and an early team-member budget. Assert the observed refresh order.


  Write betterlite-config::auth_key_validation::tests::max_budget_defaults_zero,
  positive_global_budget_triggers_read, nonpositive_global_budget_skips_read and invalid_budget_rejected.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  Resolved tokens have already passed B2314 validation; no second credential parser or license
  policy belongs in this stage. Common checks remain a later caller-owned operation.


  Sizing: 333 source lines translate to 270 production lines using existing typed row constructors;
  allow 300 table-driven tests, 75 helper adapters, 90 wiring and 50 config lines, 785 within an 800-line
  gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_key_validation::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
