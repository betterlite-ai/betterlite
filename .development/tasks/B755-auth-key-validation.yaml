dod:
  - text: 'Named cases: temp_increase_before_blocked_key, access_before_prefetch_before_user_lookup,
      user_lookup_failure_debug_and_no_upsert, live_user_model_budget_refresh, scim_exact_false_only,
      zero_cost_info_skips_budgets_not_expiry, member_cache_miss_query_and_five_second_ttl,
      member_missing_context_and_nonpositive_budget_skip, member_effective_temp_budget,
      member_counter_equality_alert_then_error, member_read_decode_and_cache_errors_propagate,
      expiry_datetime_iso_naive_utc_and_equal_now, expired_key_message_and_masked_param,
      malformed_expiry_maps_through_auth_errors, threshold_hard_soft_budget_order,
      hard_budget_llm_only, key_budget_prerequisites, fallback_recomputed_for_user_and_end_user,
      limiter_false_returns_ignored, ui_team_and_http_lookup_failure_use_token_fields,
      team_nonhttp_failure_propagates, team_metadata_and_permission_refresh,
      missing_team_clears_only_permission, project_metadata_alias_refresh,
      zero_cost_still_loads_global_spend_and_alerts, global_alert_payload,
      null_token_and_missing_internal_token_errors, result_excludes_null_and_token_carries_throttle,
      end_user_overlay_requires_row, returned_object_marks_virtual_key_without_common_checks.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_key_validation::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_key_validation.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-key-validation-*")"
        && grep -rlq "auth_key_validation" tools/oracle/fuzz/corpus/helper_case/auth-key-validation-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::auth_key_validation::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-key-validation-*")"
        && grep -rlq "max_budget" crates/betterlite-config/fuzz/corpus/config_yaml/auth-key-validation-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_key_validation::tests::/)
        - test(/replays_the_/)'
