deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- Within _failure_details\'s not isinstance(body, Mapping) branch, preserve return mapped and its nested guards.
- Within _status_error_code\'s status_code is None or not HTTPStatus.BAD_REQUEST <= status_code < HTTPStatus.INTERNAL_SERVER_ERROR
  branch, preserve return 'server_error' and its nested guards.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 1
