id: B937
title: Responses stream errors
description: >-
  Translate pre-first-event and committed Responses stream failures into the pinned HTTP or SSE response.failed/error
  envelopes. Reuse typed B011 error facts and expose the endpoint wrapper separately from routing fallback so B370
  can consume native stream error information later.


  Implement crates/betterlite-core/src/api/responses_stream_errors.rs. Use ResponsesStreamErrorsInput and ResponsesStreamErrorsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions error_before_first_event, error_after_text, failed_response_frame,
  disconnect_not_error_frame under api::responses_stream_errors::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesStreamErrors in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_stream_errors: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/common_utils/responses_stream_errors.py: _FailureDetails.normalize_message (L41-L42);
  litellm/proxy/common_utils/responses_stream_errors.py: _FailureDetails.normalize_code (L46-L47); litellm/proxy/common_utils/responses_stream_errors.py:
  _FailureDetails.normalize_type (L51-L52); litellm/proxy/common_utils/responses_stream_errors.py: _original_failure
  (L55-L59); litellm/proxy/common_utils/responses_stream_errors.py: _failure_details (L62-L73); litellm/proxy/common_utils/responses_stream_errors.py:
  _status_error_code (L87-L90); litellm/proxy/common_utils/responses_stream_errors.py: _response_error_code (L93-L101);
  litellm/proxy/common_utils/responses_stream_errors.py: ResponsesStreamErrorState.__init__ (L105-L111); litellm/proxy/common_utils/responses_stream_errors.py:
  ResponsesStreamErrorState.observe_chunk (L113-L114); litellm/proxy/common_utils/responses_stream_errors.py: ResponsesStreamErrorState.mark_emitted
  (L116-L129); litellm/proxy/common_utils/responses_stream_errors.py: ResponsesStreamErrorState.format_failure (L131-L165).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 136 owned nonblank/non-comment/non-docstring Python lines (136 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 156 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 388 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B011 (Exception types and provider error mapping), B171 (Direct helper oracle and URL
  path encoding), B925 (Responses stream events), B1087 (Api boundaries). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
