checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_errors::/)
      - test(/::replays_corpus$/)'
  - id: case-error-before-first-event
    why: the error-before-first-event behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_errors::tests::error_before_first_event($|::)/)'
  - id: case-error-after-text
    why: the error-after-text behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_errors::tests::error_after_text($|::)/)'
  - id: case-failed-response-frame
    why: the failed-response-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_errors::tests::failed_response_frame($|::)/)'
  - id: case-disconnect-not-error-frame
    why: the disconnect-not-error-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_errors::tests::disconnect_not_error_frame($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_stream_errors.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_stream_errors-*)"
      && grep -qE "^[[:space:]]+responses_stream_errors:" tools/oracle/fuzz/corpus/helper_case/responses_stream_errors-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-stream-errors)"
oracle_cases:
- tools/oracle/cases/helpers/responses-stream-errors/error-before-first-event.yaml
