id: B937
title: Responses stream failure state
description: >-
  Implement ResponsesStreamErrorState and its detail/code helpers in betterlite-core::api::responses_stream_errors.
  Own the complete file. observe_chunk stages a parsed event; only mark_emitted commits its
  identity, sequence and terminal state. format_failure emits one SSE response.failed frame
  unless a terminal frame was already emitted. This state machine neither opens HTTP nor
  decides whether a disconnected client can receive another frame. B080 owns those transport decisions.
  Inject B198 clock and UUID sources; B1113/B1138 supply event/response records, B184 supplies
  MidStreamFallbackError causes, and B012 supplies client-message redaction from _logging.py.

  The responses_stream_errors helper calls the pinned state and methods with parsed records
  and independently constructed exceptions. Compare exact frame structure after masking only
  newly generated UUID/time; fixed observed identity and sequence must compare literally.
  No parser is added: frame inputs to mark_emitted are returned without inspection. Source
  count is 136 nonblank/non-comment lines; allow 155 implementation, 130 tests, 85 fixtures,
  80 adapters and 20 wiring lines, 470 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_stream_errors.rs
  - crates/betterlite-core/src/api/responses_stream_errors/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_stream_errors.rs
  - tools/oracle/src/helpers/core_ops/responses_stream_errors/**
  - tools/oracle/helpers/responses_stream_errors.py
  - tools/oracle/helpers/responses_stream_errors/**
  - tools/oracle/fuzz/corpus/helper_case/responses_stream_errors-*
  - tools/oracle/cases/helpers/responses-stream-errors/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/responses_stream_errors.py#L1-L165
  why: Failure attribute normalization, code precedence and state committed only after a frame is emitted.
dod:
- text: >-
    first_failure starts with no events and RuntimeError("broken"); expect exactly
    "event: response.failed\ndata: <json>\n\n", type=response.failed,sequence_number=0,
    response.id matching resp_ plus 32 hex digits,object=response,status=failed,output=[],
    created_at=injected integer time,error={code:server_error,message:broken}. Null model,
    type,param and usage fields are absent from the serialized response, not explicit nulls.
    A second format_failure returns null.
  proof: [failure-tests, oracle, failure-adapter]
- text: >-
    committed_identity observes response.created with id=resp_a,model=m,created_at=0,
    sequence_number=4. Before mark_emitted it does not change failure identity. After emitting
    the original bytes unchanged, a lower sequence=2 cannot decrease the high-water mark;
    failure uses id=resp_a,model=m,created_at=0,sequence_number=5. Empty later id/model do
    not erase prior values. observe_chunk(non-mapping) clears the pending event and mark_emitted
    leaves committed state unchanged. Completed,failed,incomplete prevent failure only after emission.
  proof: [failure-tests, oracle, failure-adapter]
- text: >-
    failure_details unwraps nested MidStreamFallbackError.original_exception until the original.
    A mapping body message=upstream,code=0,type=provider overrides exception message=mapped,
    code=old,type=old; empty body message/type fall back, but code=0 does not. Body status_code
    is ignored in favor of the exception's status_code. Non-string message/type and boolean
    code become null; integer/string codes remain. A non-mapping body leaves attributes alone.
  proof: [failure-tests, oracle, failure-adapter]
- text: >-
    error_codes maps status 401->authentication_error,403->permission_error,404->not_found_error,
    408->request_timeout,429->rate_limit_exceeded,400/422/499->invalid_request_error and
    null/399/500->server_error. code or type=insufficient_quota yields insufficient_quota;
    code/type=429,"429" or rate_limit_custom yields rate_limit_exceeded. code=rate_limit_custom
    beats type=insufficient_quota because code is inspected first. A nonempty nondigit string
    code=custom wins over status, numeric strings fall back to status. With default B012
    redaction enabled, message="upstream http://service.internal:8080/v1 failed" becomes
    "upstream http://REDACTED:8080/v1 failed". With its explicit redaction-disable setting,
    that message remains unchanged. A missing message uses str(original) before redaction.
  proof: [failure-tests, oracle, failure-adapter]
checks:
  optional: []
  commands:
  - id: failure-tests
    why: failure identity, event commitment or error-code precedence is wrong
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_errors::/)'
  - id: failure-adapter
    why: the pure failure state lacks independent pinned comparison
    run: test -f tools/oracle/helpers/responses_stream_errors.py && grep -qE '^[[:space:]]+responses_stream_errors:' tools/oracle/fuzz/corpus/helper_case/responses_stream_errors-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-stream-errors/first-failure.yaml
- tools/oracle/cases/helpers/responses-stream-errors/committed-identity.yaml
- tools/oracle/cases/helpers/responses-stream-errors/failure-details.yaml
- tools/oracle/cases/helpers/responses-stream-errors/error-codes.yaml
deviations: []
out_of_scope:
- B080 chooses HTTP versus SSE delivery and handles disconnects; there is no disconnect branch in this owned file.
- B012 owns _logging.redact_internal_details_from_client_message and its redaction setting; B184 owns exception construction. B925 decodes provider events before this state observes them.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_stream_errors in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_stream_errors.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_stream_errors.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Observing response.completed does not make it terminal until mark_emitted runs; a serialization failure must still emit failure.
- Numeric upstream codes do not survive as response.error.code unless they match the special rate-limit rule.
- The failure frame carries response.error.code/message, not an OpenAI HTTP error envelope or a separate event:error frame.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 1
