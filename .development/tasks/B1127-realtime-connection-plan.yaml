id: B1127
title: Realtime health probes and stored credentials
description: >-
  Replace the line-split connection plan with ownership of the complete _realtime_health_check,
  _model_params_with_stored_credentials,_is_transcription_only_realtime_model,
  _azure_realtime_health_protocol and _realtime_health_check_auth_headers functions in
  betterlite-core::api::realtime_connection_plan. B1011 now owns the complete live connector and
  bounded Vertex token helpers. Health probes establish a connection and immediately return true
  inside its context; they do not wait for a session event, send audio or return false on failure.

  Merge B061 stored values underneath explicit model_params, including explicit None values.
  Named api_key/base/version then use truthy precedence over that merged map. Azure uses B545
  URL/auth helpers and B529 AD resolution; OpenAI uses B528, xAI B1402. B2225 model metadata detects
  Azure transcription models; metadata exceptions mean false. Vertex uses B1301 safe parameter
  accessors, B1304 region selection, B1356 speech-model detection, B1011 bounded tokens and B1365
  Live config. B173 supplies shared SSL settings with no local compatibility conversion.

  Reuse B002 settings LITELLM_AZURE_REALTIME_PROTOCOL (unset), REALTIME_CREDENTIAL_RESOLUTION_TIMEOUT_SECONDS
  (20.0) and REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES (native16777216; source None). Add
  loads_realtime_probe_settings loader cases and new YAML seeds; do not re-declare fields already
  implemented by connection tasks. B901 realtime_probe service executes actual independent mock
  handshakes. Native resolvers exercise unavailable/expired credentials without live cloud access.
  No new parser is needed. Own 149 nonblank/non-comment function lines; budget 145 implementation,
  125 tests,110 transcripts,85 adapters,55 config tests/seeds and 30 wiring =550 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/realtime_connection_plan.rs
  - crates/betterlite-core/src/api/realtime_connection_plan/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/realtime_connection_plan.rs
  - crates/betterlite-config/src/api/realtime_connection_plan/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/realtime-probe-*
  - tools/oracle/src/websocket_driver.rs
  - tools/oracle/src/websocket_driver/realtime_probe.rs
  - tools/oracle/helpers/websocket_dispatch.py
  - tools/oracle/helpers/realtime_probe_websocket.py
  - tools/oracle/cases/websocket/realtime-probe/**
  - tools/oracle/fuzz/corpus/websocket_oracle/realtime-probe-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/realtime_api/main.py#L62-L69
  why: Stored credential merge preserves explicit model_params even when their value is None.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/realtime_api/main.py#L590-L742
  why: All health-probe helpers and complete connection flow, including Azure transcription detection and Vertex rejection.
dod:
- text: >-
    realtime_probe_stored_precedence uses stored {api_key:stored,api_base:stored-base,api_version:stored-version}
    under litellm_credential_name=c. Explicit model_params key/base/version override stored, including None;
    named nonempty arguments override the merged map. A nonstring credential name performs no lookup;
    an empty string still calls the credential accessor. Non-Azure api_key=None sends no auth header,
    key="" sends Authorization="Bearer ". Azure truthy key skips AD; absent/empty key resolves AD from
    the merged model_params. Each successful probe returns true after one handshake and closes without frames.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_probe_azure_protocol classifies mode=audio_transcription or supported_endpoints containing
    /v1/realtime/transcription_sessions as transcription and supplies only intent=transcription. Other or
    failing metadata gives query_params=None. Protocol precedence is named > model_params > environment;
    no configured string gives GA, while configured beta is retained. A truthy nonstring model_params
    protocol suppresses the environment and falls back to GA. Base defaults "", version defaults
    2024-10-01-preview, and B545 constructs the exact URL. OpenAI defaults https://api.openai.com/ and xAI
    https://api.x.ai/v1; both always supply query model, including for transcription-named models.
  proof: [behavior-tests, config-tests, oracle, service-python]
- text: >-
    realtime_probe_vertex_and_failures rejects a B1356-recognized Speech-to-Text model m before connect
    with "Realtime health checks are not supported for Speech-to-Text streaming model m; health check it
    with mode audio_transcription". Other Vertex models resolve location/token/project and build a Live
    config, validating headers with api_key=None; a caller API key does not replace the OAuth Bearer header.
    Use B1011's20.0-second bounded token resolver and its exact timeout error. Unsupported provider/model=m
    raises "Unsupported model: m". Mock401/503 handshake failures propagate as exceptions, not false and not
    client-facing WebSocket error events. URL/config/TLS errors also propagate; no retries are added here.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_probe_connection_settings passes the shared SSL context and configured max_size directly to
    connect, without an open_timeout override. Native default 16777216 matches the established connection
    policy; explicit1024 is used for parity captures. The probe exits immediately on upgrade, so it does not
    claim to observe later oversized frames. loads_realtime_probe_settings checks unset, explicit numeric
    overrides and malformed text using the real config loader; connection and health settings are shared.
  proof: [behavior-tests, config-tests, config-corpus, service-corpus, new-cases, oracle, service-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Health probes need credential precedence and exception tests rather than a fabricated boolean status.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_connection_plan::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: Probe environment values must come from the supported shared loader.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::realtime_connection_plan::tests::loads_realtime_probe_settings($|::)/)'
  - id: config-corpus
    why: Probe-specific setting seeds must reach existing YAML parsing.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/realtime-probe-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: service-python
    why: Health checks must open independent mock connections in each implementation.
    run: test -f tools/oracle/helpers/realtime_probe_websocket.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: service-corpus
    why: A new realtime_probe service seed must exercise its typed decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle/realtime-probe-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: new-cases
    why: Probe handshakes and errors need fresh source comparisons.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-probe)"
oracle_cases:
- tools/oracle/cases/websocket/realtime-probe/realtime-probe-stored-precedence.yaml
- tools/oracle/cases/websocket/realtime-probe/realtime-probe-azure-protocol.yaml
- tools/oracle/cases/websocket/realtime-probe/realtime-probe-vertex-and-failures.yaml
- tools/oracle/cases/websocket/realtime-probe/realtime-probe-connection-settings.yaml
deviations:
- what: Health connections use betterlite's existing 16777216-byte default max_size rather than LiteLLM's None/unlimited value.
  why: Reuse the bounded WebSocket setting established by B528/B545/B2457; probes do not create a separate unlimited client.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L336-L339
out_of_scope:
- B1011 owns metadata merging, Vertex token helpers and all of _arealtime; B1010 owns _with_resolved_session_model, HTTP config resolution and the three HTTP SDK methods in realtime_api/main.py.
- B061 owns stored credential lookup; B2225 model metadata; B528/B545/B1402 provider URLs; B1301/B1304/B1356/B1365 Vertex helpers. No proxy route is registered here.
pitfalls:
- Explicit None in model_params erases a stored credential before named-argument fallback is applied.
- The probe returns true on handshake alone; it never waits to learn whether the provider accepts the session model.
- Only Azure health probes infer intent=transcription from model metadata.
review_level: security
budget:
  max_changed_lines: 550
  max_new_expects: 0
