dod:
  - text: A request whose `custom_llm_provider` names a table entry is handed to that provider handler with the same data, guardrail and logging object, and the call returns what the provider handler returned.
    proof: [dispatch-input-tests]
  - text: A request whose `custom_llm_provider` is missing, null, empty, not text, differently cased or not in the table makes no provider call and returns the data untouched.
    proof: [dispatch-input-tests]
  - text: A response whose `request_data["custom_llm_provider"]` names a table entry reaches that provider handler with the response, guardrail, logging object, user key dict and request data all unchanged, and the call returns what it returned.
    proof: [dispatch-output-tests]
  - text: A response with a missing `request_data`, or a `request_data` without a usable provider, makes no provider call and comes back untouched, even when the response itself carries a `custom_llm_provider` key.
    proof: [dispatch-output-tests]
  - text: An error from the provider handler, input or output, reaches the caller unchanged.
    proof: [dispatch-input-tests, dispatch-output-tests]
  - text: When two entries of the provider list share a name, the later one is used.
    proof: [dispatch-input-tests]
  - text: Streaming, scan key, block chunks, stream error items, structured messages and tool names on LlmPassthroughRouteHandler return the trait defaults and never call a provider handler.
    proof: [dispatch-defaults-tests]
  - text: The registration table has exactly two rows, `PassThroughEndpoint` mapped to `Endpoint` and `AllmPassthroughRoute` mapped to `LlmRoute`, and `LlmPassthroughRoute` is not in it.
    proof: [dispatch-mapping-tests]
checks:
  optional: []
  commands:
    - id: dispatch-input-tests
      why: the provider lookup for requests, its skip cases or the error passthrough are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^llm_passthrough_dispatch::tests::input_/)'
    - id: dispatch-output-tests
      why: the provider lookup for responses, its skip cases or the argument passthrough are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^llm_passthrough_dispatch::tests::output_/)'
    - id: dispatch-defaults-tests
      why: the default behaviors of the other trait methods are missing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^llm_passthrough_dispatch::tests::defaults_/)'
    - id: dispatch-mapping-tests
      why: the registration table is missing or has the wrong rows
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^llm_passthrough_dispatch::tests::mapping_/)'
oracle_cases: []
deviations:
  - what: The provider table is passed in as an explicit list and the registration rows are a constant, not discovered by scanning llms/ for `guardrail_translation_mappings` and not built by a lazy import.
    why: Rules forbid auto-discovery and module-level state, and the lazy import in LiteLLM only avoids a Python import cycle. A user sees no difference; the same two call types and the same single provider are served.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/__init__.py#L83-L162
  - what: The five static event-stream helpers of LlmPassthroughRouteHandler are not built.
    why: Nothing calls them at the pinned commit, so no request path can reach them.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/pass_through/guardrail_translation/handler.py#L262-L311
out_of_scope:
  - "PassThroughEndpointHandler logic (_get_guardrail_settings, _extract_text_for_guardrail, process_input_messages, process_output_response) is B3573, which also owns handler.py lines 24 to 193."
  - "BedrockPassthroughGuardrailHandler, its event-stream functions and is_event_stream_content_type, event_stream_media_type, event_stream_endpoint_is_de_anonymizable and de_anonymize_event_stream are B3678."
  - "The static LlmPassthroughRouteHandler helpers is_event_stream_response, event_stream_media_type, _resolve_event_stream_de_anonymizer, supports_event_stream_de_anonymization and de_anonymize_event_stream have no caller at the pin."
  - "discover_guardrail_translation_mappings, load_guardrail_translation_mappings and get_guardrail_translation_mapping are replaced by B3679's TranslationRegistry; B3680 builds the entries from PASSTHROUGH_TRANSLATION_KINDS."
  - "The README.md under guardrail_translation is documentation only and has no behavior to build."
pitfalls:
  - "The request path reads the provider from `data[\"custom_llm_provider\"]` but the response path reads it from `request_data`, so a response that arrives with no `request_data` is never scanned, whatever its own fields say."
  - "LiteLLM writes `provider or \"\"` before the lookup, so `None` and `\"\"` both skip; the match is exact, so `\"Bedrock\"` or `\"bedrock \"` skip too."
  - "A skip is silent for the client: only a debug line is written, and the data or response goes on unchanged. Do not raise for an unknown provider such as `vertex_ai` or `openai`."
  - "The process methods return whatever the provider handler returns, and the bedrock handler may rewrite the body, so do not return the original input after the call."
  - "The call types `llm_passthrough_route` and `allm_passthrough_route` are two values; only the async one is in `guardrail_translation_mappings`."
  - "`CallTypes.pass_through` has the wire value `pass_through_endpoint`; B207's variant for it is `PassThroughEndpoint`."
  - "Only the two process methods are overridden. The other BaseTranslation methods are not forwarded to the provider handler, so bedrock streaming behavior is not reachable through this dispatcher."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
