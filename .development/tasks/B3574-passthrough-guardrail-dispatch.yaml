    why: llm_passthrough_route and allm_passthrough_route are separate call types; only the async one is mapped.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/passthrough/guardrail_translation/handler.py#L254-L270
