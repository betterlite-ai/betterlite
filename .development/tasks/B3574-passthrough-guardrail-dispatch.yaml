id: B3574
title: Native passthrough guardrail dispatch and registration
description: >-
  Build the part of LiteLLM's pass_through guardrail translation package that picks a handler: the provider router behind the `allm_passthrough_route` call type, and the table that says which handler serves `pass_through_endpoint` and `allm_passthrough_route`. The handler for `pass_through_endpoint` itself (field extraction, the check-only guardrail call) is B3573 and is not built here.

  Add the module `llm_passthrough_dispatch` to betterlite-guardrails (crates/betterlite-guardrails/src/llm_passthrough_dispatch.rs and its folder). The crate already depends on betterlite-core, where B3573 keeps `PassThroughEndpointHandler`, so nothing new is needed in Cargo.toml. Types come from earlier tasks: the `BaseTranslation` trait is B3661's (crates/betterlite-guardrails/src/guardrail_translation.rs), the guardrail trait `GuardrailContract`, `GuardrailLogTarget` and `GuardrailFailure` are B5471's `guardrail_base`, request bodies are `BTreeMap<String, GuardrailValue>` from `betterlite_config::sections::guardrail_identity::item`, and the call type enum is B207's `CallType` in betterlite-core `routes`. Read B3661's trait first and copy its exact method signatures; this text says what each method does, not how the trait spells it.

  `LlmPassthroughRouteHandler<H: BaseTranslation>` is LiteLLM's `LlmPassthroughRouteHandler` (handler.py lines 210 to 260). It owns `providers: BTreeMap<String, H>`, built by `LlmPassthroughRouteHandler::new(providers: Vec<(String, H)>)`. A later entry with the same name replaces an earlier one. Nothing is looked up by scanning or by reflection. LiteLLM fills the table lazily in `_get_provider_handlers` with one entry, `"bedrock"` mapped to `BedrockPassthroughGuardrailHandler`. That lazy import only avoids a Python import cycle, so Rust has no equivalent: whoever builds the handler (B3680) passes the list, and for now it holds only `("bedrock", <B3678's bedrock handler>)`. This module must not import the bedrock handler. LiteLLM creates a new provider handler object for every call (`handler_cls()`); a handler here is stateless, so calling the stored value gives the same result.

  The type implements `BaseTranslation`, and only two of its methods do work, as in LiteLLM. `process_input_messages(data, guardrail, logging_obj)` reads `data["custom_llm_provider"]`. When that key is missing, null, not text or an empty text, or no table entry has exactly that name (the match is exact and case-sensitive), it logs at debug `LlmPassthroughRouteHandler: no handler for provider={provider}, skipping guardrail` and returns the data untouched. For a missing provider `{provider}` prints `None`, as Python's `%s` does. Otherwise it calls the provider handler's `process_input_messages` with the same data, guardrail and logging object and returns exactly what that call returns. `process_output_response(response, guardrail, logging_obj, user_api_key_dict, request_data)` is the same, with two differences. The provider is read from `request_data["custom_llm_provider"]`, never from the response, and an absent `request_data` counts as an empty map, so the call is skipped. The skip returns the response untouched. When a handler is found, all five arguments pass through unchanged, `request_data` included. Both methods return the provider handler's error as it is: no catch, no log, no rewrite of a guardrail failure.

  Every other `BaseTranslation` method of `LlmPassthroughRouteHandler` keeps the trait default, which LiteLLM's base class gives it too: streaming returns `responses_so_far` as it came, `get_streaming_scan_key` is `None`, `build_block_sse_chunks` and `build_stream_error_items` are `None`, `get_structured_messages` is `None`, `extract_request_tool_names` is empty, and both class flags (`delivers_ended_stream_rewrites`, `assembles_streamed_response`) are false. If B3661's trait has no default for one of these, write the default here; do not forward the call to the provider handler, because LiteLLM does not.

  The registration table is `PASSTHROUGH_TRANSLATION_KINDS: [(CallType, PassthroughTranslationKind); 2]`, LiteLLM's `guardrail_translation_mappings` in __init__.py. `PassthroughTranslationKind` has two variants, `Endpoint` (B3573's `PassThroughEndpointHandler`) and `LlmRoute` (`LlmPassthroughRouteHandler`). `CallType::PassThroughEndpoint` (wire name `pass_through_endpoint`, LiteLLM's `CallTypes.pass_through`) maps to `Endpoint` and `CallType::AllmPassthroughRoute` to `LlmRoute`. Nothing else maps: the sync `llm_passthrough_route` call type has no entry and must stay without one. This task does not build the registry. B3679 owns `TranslationRegistry` and `TranslationEntry<T>`, and B3680 builds the entries; it reads this constant, wraps each kind in its own handler enum, and calls `LlmPassthroughRouteHandler::new` with the provider list. Do not add a second registry or a global table here.

  `PassThroughEndpointHandler` needs a `BaseTranslation` impl for the registry to hold it. B3573 builds the handler logic in betterlite-core as plain functions on a type of that name. Add the trait impl for it in this module, a thin forwarder that calls B3573's two entry points and nothing else, if B3573's code does not already provide one. Read crates/betterlite-core/src/passthrough_guardrail.rs; if the trait cannot be implemented from outside because of a signature mismatch, record that in notes of the report and do not change B3573's files, they are not in this task's scope.

  Out of the build on purpose: LlmPassthroughRouteHandler.is_event_stream_response, event_stream_media_type, _resolve_event_stream_de_anonymizer, supports_event_stream_de_anonymization and de_anonymize_event_stream (handler.py lines 262 to 311). Nothing at the pinned commit calls any of them outside the class itself; the bedrock handler defines the methods they look up, and B3678 decides what to do with those.

  Tests live in `llm_passthrough_dispatch::tests` and use a small fake provider handler defined there: a struct that implements `BaseTranslation`, records the arguments it was called with and returns a scripted value. Test names start with `input_`, `output_` and `mapping_`, which the checks filter on. The handler is not reachable from a route yet and the helper adapters cannot build a guardrail, so there are no oracle cases; the HTTP cases for passthrough guardrails come with the dispatcher umbrella (B3680).
scope:
  paths:
    - crates/betterlite-guardrails/src/llm_passthrough_dispatch.rs
    - crates/betterlite-guardrails/src/llm_passthrough_dispatch/**
  lint_tables: false
