id: B1074
title: Vector file write
description: >-
  Implement vector-store file update/delete through B010, preserving attributes and deletion payloads. Caller-supplied
  fields cannot override registry/provider credentials or managed ownership.


  Implement crates/betterlite-core/src/api/vector_file_write.rs. Use VectorFileWriteInput and VectorFileWriteResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions vector_file_update_attributes, vector_file_delete, vector_file_delete_missing,
  vector_file_update_error under api::vector_file_write::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.REQUEST_TIMEOUT
  defaults to 6000 seconds. No environment reads occur outside betterlite-config. Test api::vector_file_write::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorFileWrite in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_file_write: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/vector_store_files/main.py: aupdate (L524-L566); litellm/vector_store_files/main.py:
  update (L570-L641); litellm/vector_store_files/main.py: adelete (L645-L683); litellm/vector_store_files/main.py:
  delete (L687-L749). Abstract/protocol declarations map to native types and synchronous/async wrappers share one
  implementation; a partial function span is the explicit preparation/transition stage described above, with typed
  values passed to the following stage.


  Sizing: 205 owned nonblank/non-comment/non-docstring Python lines (205 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 225 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 490 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B1071 (Vector file contracts), B1087 (Api boundaries), B527 (OpenAI vector stores
  and attached files), B1111 (Vector file provider selection), B002 (Load LiteLLM config.yaml into typed config).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
