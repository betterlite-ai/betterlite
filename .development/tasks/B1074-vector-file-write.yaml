id: B1074
title: Update attached-file attributes and delete attachments
description: >-
  Implement update/aupdate/delete/adelete in core::api::vector_file_write, owning the complete functions
  at vector_store_files/main.py:523-749. The required ids are keyword arguments; update also requires
  attributes. B1111 chooses openai for a falsey provider and overlays registry credentials on kwargs.
  Construct GenericLiteLLMParams with the store id afterwards, while keeping the original local provider
  for B174 enum conversion and B010 config selection with B527 transforms. Update filters merged locals/kwargs through B1071 then restores the explicit
  attributes argument, including null. Its extra_body goes to B2482; delete has no extra-body parameter.

  Record model=null, both ids and update attributes in optional_params. Logged litellm_params combines
  the store id,call id (default null) and non-null GenericLiteLLMParams. Preserve context in async calls;
  only boolean true aupdate/adelete selects async. timeout=null/0 uses REQUEST_TIMEOUT, default 6000,
  through betterlite-config. B2482 owns the actual HTTP send and B011 maps public SDK exceptions.
  Add B2401 VectorFileWrite with update/delete and both modes. Tests belong in api::vector_file_write;
  the config loader has loads_write_timeout in that module. The owned functions have 206 nonblank/
  non-comment lines; allow 205 code, 145 tests, 90 adapters, 90 fixtures, 55 config/corpus/wiring, 585
  total under 630. Decode through the existing B1071/B2401 boundaries.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_file_write.rs
  - crates/betterlite-core/src/api/vector_file_write/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/**
  - crates/betterlite-config/src/api/vector_file_write.rs
  - crates/betterlite-config/src/api/vector_file_write/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/vector-file-write-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/vector_file_write.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/vector_file_write.py
  - tools/oracle/cases/sdk-http/vector-file-write/**
  - tools/oracle/fuzz/corpus/sdk_http_case/vector-file-write-*
  - tools/oracle/helpers/b1074.py
  - tools/oracle/helpers/b1074/**
  - tools/oracle/src/helpers/core_ops/b1074.rs
  - tools/oracle/src/helpers/core_ops/b1074/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_store_files/main.py#L523-L749
  why: Whole file-write wrappers restore explicit attributes after filtering and retain id/call context for logging.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L576
  why: File writes use the same REQUEST_TIMEOUT default for missing and zero per-call timeouts.
dod:
- text: >-
    update_file_attributes sends vs_a,file_a,attributes={tag:x,count:2,enabled:false},unknown=1.
    Expect POST /v1/vector_stores/vs_a/files/file_a with {attributes:{tag:x}} after B527 cleaning.
    attributes={} stays {}, and explicit null stays null because update restores it after the filter.
    extra_body={attributes:{replacement:y}} replaces the explicit map downstream. Mock 200
    {id:file_a,object:vector_store.file,attributes:{replacement:y}} returns those values in both modes.
  proof: [write-tests, oracle, python-adapter]
- text: >-
    delete_file_attachment sends vs_a,file_a with kwargs extra_body={ignored:true},extra_query={ignored:true}.
    DELETE /v1/vector_stores/vs_a/files/file_a has no body or query. Mock 200
    {id:file_a,object:vector_store.file.deleted,deleted:true} is returned. extra_headers={X-Trace:t}
    reaches both write methods. No ordinary Files API delete and no registry mutation occurs.
  proof: [write-tests, oracle, python-adapter]
- text: >-
    file_write_provider_resolution defaults null/"" to openai. Registry key=sk-registry replaces caller
    key=sk-caller; registry failure leaves caller credentials usable, without warning. A registry provider
    azure does not replace local openai. Explicit azure fails with source "Vector store file update is not supported for azure"
    or "Vector store file delete is not supported for azure"; bogus fails enum conversion. All three
    failures map to SDK APIConnectionError,status=500,type=null,param=null,code=null before HTTP.
  proof: [write-tests, oracle, python-adapter]
- text: >-
    file_write_error_mapping returns HTTP 404 {error:{message:missing,type:invalid_request_error,param:null,code:missing}}
    for each method. SDK NotFoundError has status=404,type=null,param=null,code=null with one request and
    no retry. Ignore only failure.message for betterlite wording, never the outbound request or status.
  proof: [write-tests, oracle, python-adapter]
- text: >-
    write_context_and_timeout checks handler timeout=null/0/7 becomes 6000/6000/7 or 12/12/7 with
    REQUEST_TIMEOUT=12. Logs retain model=null,store/file ids,update's pre-cleaning attributes and call id
    null or call-a; delete has no attributes in optional_params. Async retains context, while flag=1 does
    not select async. loads_write_timeout loads absent=6000,"12"=12 and rejects "bad" through Config.
    New config and SDK seeds replay through both existing case decoders.
  proof: [write-tests, config-tests, corpora]
checks:
  optional: [mutants]
  commands:
  - id: write-tests
    why: file writes lose explicit-null attributes, delete semantics or credential ordering
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_write::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: REQUEST_TIMEOUT is not exercised by a real config loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::vector_file_write::tests::loads_write_timeout($|::)/)'
  - id: python-adapter
    why: the file mutation comparison cannot capture real public SDK HTTP
    run: test -f tools/oracle/sdk_http/vector_file_write.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpora
    why: new mutation/config inputs bypass corpus replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-file-write-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/vector-file-write-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/sdk-http/vector-file-write/update-file-attributes.yaml
- tools/oracle/cases/sdk-http/vector-file-write/delete-file-attachment.yaml
- tools/oracle/cases/sdk-http/vector-file-write/file-write-provider-resolution.yaml
- tools/oracle/cases/sdk-http/vector-file-write/file-write-error-mapping.yaml
deviations: []
out_of_scope:
- B1111 owns file SDK provider/credential helpers; B1072 owns create/list and B1073 retrieve/content in this same source file.
- B2482 owns HTTP mutation handlers, B527 OpenAI transformations and B1071 records/filtering. B011 owns public SDK exception mapping.
pitfalls:
- Explicit attributes=null reappears after null filtering and is sent by update, unlike create's omission behavior.
- Deleting an attachment does not delete its underlying file resource or its vector-store registry entry.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
