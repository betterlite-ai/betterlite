id: B162
title: Python Router catalog and settings methods
description: >-
  After B8356 a betterlite `Router` can be built and called, but LiteLLM users also read and change the router they built: `router.get_model_names()`, `router.get_model_list()`, `router.add_deployment(...)`, `router.delete_deployment(id)`, `router.update_settings(num_retries=3)`, `router.get_available_deployment("gpt-4o")`. None of these exist on the betterlite class. Their logic is already planned in Rust (B844, B845, B846, B847, B368, B016, B9711), so this task is wiring: a native class that reaches that logic through the `NativeRouter` the constructor built, a Python mixin with LiteLLM's method names and signatures, and the mixin added to `Router`. It is the last part of the Python Router umbrella.


  Native side. Put it in `crates/betterlite-python/src/router_call/catalog.rs` and `src/router_call/catalog/**`. `src/router_call.rs` is B6022's and isn't on main yet, so add its two lines yourself: `mod catalog;` and `catalog::register(module)?;` in B6022's `register`. Touch nothing else in that file, and never edit `lib.rs`, `_native.pyi` or `betterlite/__init__.py`. `NativeRouterCatalog` is a `#[pyclass]` built from a `NativeRouter`, sharing its deployment catalog and its router settings, so a deployment added here is one the next `acompletion` can pick. Each method takes JSON text and gives JSON text, and none holds routing logic: `model_list(model_name, team_id)` (B844), `model_names(team_id)` (B844), `model_ids(model_name, exclude_team_models)` (B844), `has_model_id(id)` (B844), `deployment(model_id)` (B844), `model_info(id)` (B845), `model_group_info(model_group)` (B846), `model_access_groups(model_name, model_access_group, team_id)` (B847), `set_model_list(list)`, `add_deployment(deployment)`, `upsert_deployment(deployment)` and `delete_deployment(id)` (B368), `get_settings()` and `update_settings(pairs)` (B9711), and `available_deployment(request)`, which blocks inside `py.detach`, plus `aavailable_deployment(request)`, which returns an awaitable through `future_into_py` (B016's selection; LiteLLM's sync form runs the same selection). `update_settings` needs a `RouterSettingsTarget` (B9711): implement it in `catalog/settings_target.rs` over the strategy, pre-call checks and routing groups the native router holds, calling B395's strategy init and args step, B350's lar1 step, B364's pre-call checks and B323's group build. `SettingsView` gets the router's dumped groups from B323 and, for `latency-based-routing`, the latency handler's args text. Errors reuse B5659's `NativeError`; a B9711 `NotAnInteger` or `RetryPolicy` error reaches Python as `ValueError` naming the key, and a missing deployment is `null`, not an error. Stubs go in `python/betterlite/_native_router_call.pyi` next to B6022's.


  Python side. `python/betterlite/_router/catalog.py` holds the mixin `RouterCatalog` with these methods and LiteLLM's exact parameter names, kinds and defaults: `set_model_list(self, model_list)`, `add_deployment(self, deployment)`, `upsert_deployment(self, deployment)`, `delete_deployment(self, id)`, `get_deployment(self, model_id)`, `get_model_info(self, id)`, `get_model_group_info(self, model_group)`, `get_model_ids(self, model_name=None, exclude_team_models=False)`, `has_model_id(self, candidate_id)`, `get_model_names(self, team_id=None)`, `get_model_list(self, model_name=None, team_id=None)`, `get_model_access_groups(self, model_name=None, model_access_group=None, team_id=None)`, `get_settings(self)`, `update_settings(self, **kwargs)`, `get_available_deployment(self, model, messages=None, input=None, specific_deployment=False, request_kwargs=None)` and `async def async_get_available_deployment(self, model, request_kwargs, messages=None, input=None, specific_deployment=False)`. A `Deployment` argument goes over as `model_dump(exclude_none=True)`; `get_deployment`, `add_deployment`, `upsert_deployment` and `delete_deployment` answer B8584's `Deployment` or None, `get_model_group_info` answers B8584's `ModelGroupInfo` or None, and the list and dict methods answer plain lists and dicts. `get_settings` turns a stored retry policy back into B8584's `RetryPolicy`, as LiteLLM's attribute holds one. `update_settings` sends its kwargs as pairs in call order, with `RetryPolicy` and `RoutingStrategy` values dumped first. After any method that changes the router, refresh the attributes B8356 keeps (`model_list`, `model_names`, `num_retries`, `retry_policy`, `fallbacks`, `context_window_fallbacks`, `routing_strategy`) from the native answers, so they match what LiteLLM's attributes would show. `set_custom_routing_strategy(self, CustomRoutingStrategy)` raises `NotImplementedError` with the text "set_custom_routing_strategy is not supported by betterlite: custom routing strategies written in Python cannot run inside the native router".


  Wiring. `python/betterlite/_router/__init__.py` is B8356's file; change only its class line to `class Router(RouterCalls, RouterEndpoints, RouterCatalog)` and its import, nothing else.


  Tests: `cargo nextest` covers the JSON conversions in `router_call/catalog/tests.rs` (names start with `catalog_`). `tests/test_router_catalog.py` builds a betterlite `Router` and a LiteLLM `Router` from the same two-group model list in the same process and checks that each method's `inspect.signature` matches LiteLLM's; that `get_model_names`, `get_model_ids`, `get_model_list`, `get_model_info`, `get_model_group_info` and `get_model_access_groups` answer the same (pydantic answers compared by `model_dump()`); that `add_deployment`, `upsert_deployment` and `delete_deployment` change both routers the same way and that an added deployment answers `acompletion` against a local mock server; that `update_settings(num_retries="3", timeout=30.5, retry_policy={"RateLimitErrorRetries": 2})` leaves both `get_settings()` answers equal after `fastapi.encoders.jsonable_encoder`; and that `get_available_deployment` returns a deployment of the asked group.
