dod:
  - text: Every catalog and settings method has LiteLLM's signature.
    proof: [router-catalog-signature]
  - text: The read methods answer what LiteLLM's Router answers for the same model list.
    proof: [router-catalog-read]
  - text: Adding, upserting and deleting deployments change the router like LiteLLM's, and an added deployment serves a completion.
    proof: [router-catalog-write]
  - text: "`update_settings` and `get_settings` match LiteLLM's after `jsonable_encoder`, including the `int()` casts and the retry policy object."
    proof: [router-catalog-settings]
  - text: "`get_available_deployment` and `async_get_available_deployment` pick a deployment of the asked group, and `set_custom_routing_strategy` raises `NotImplementedError` with the documented text."
    proof: [router-catalog-select]
  - text: The JSON conversions turn bad input into `NativeError`, never a panic.
    proof: [router-catalog-native]
  - text: The files pass strict basedpyright and ruff.
    proof: [python-lint]
checks:
  optional: []
  commands:
  - id: router-catalog-native
    why: A conversion panics or loses a field.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^router_call::catalog::tests::catalog_/)'
  - id: router-catalog-signature
    why: A parameter name, kind or default differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_catalog.py -k signature
  - id: router-catalog-read
    why: A read method answers differently from LiteLLM's Router.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_catalog.py -k read
  - id: router-catalog-write
    why: A change to the deployments differs, or does not reach completions.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_catalog.py -k write
  - id: router-catalog-settings
    why: Settings are cast, stored or shown unlike LiteLLM.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_catalog.py -k settings
  - id: router-catalog-select
    why: The selection ignores the group, or the custom strategy call fails silently.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_router_catalog.py -k select
  - id: python-lint
    why: Type drift against the mixins, the stubs and B8584's models.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
  - what: "`Router.set_custom_routing_strategy` raises `NotImplementedError` instead of installing the strategy."
    why: The native router picks deployments in Rust and cannot call a Python strategy object per request yet.
  - what: "The other public Router helpers (for example `get_model_group_usage`, `arefresh_model_info`, `get_deployment_credentials`, `async_get_fully_unhealthy_model_names`, `validate_fallbacks`) are not on the betterlite Router, so calling one raises `AttributeError`."
    why: They are proxy internals with Rust owners; each needs its own native bridge, and this task exposes the methods LiteLLM's routing docs show.
out_of_scope:
  - "The logic behind every method: B844 (model list, names, ids, deployment lookup), B845 (model info), B846 (group info), B847 (access groups), B368 (set, add, upsert and delete), B016 (deployment selection), B9711 (settings). B9710 prices an added deployment, called by B368."
  - "B8356 owns the Router class, its constructor and its attributes; B5078 and B8355 the call methods; B6022 `NativeRouter`."
  - "The `router` argument of the vector store search helpers stays refused with `UnsupportedCallArgument` (B7875); this task gives that code no native handle."
  - "`_redact_prompt_text_if_needed` (router.py L14121-L14151) is called only by `_record_routing_decision`, so it goes with B362."
  - "`aguardrail` and `_aguardrail_helper` have no caller at the pin; `get_available_guardrail` and `guardrail_list` are B9711's and B3683's, and the proxy, not the SDK, fills the list."
  - "Every other function in litellm/router.py has the owner the router tasks' shared out_of_scope line names (B016 carries it), except the pricing helpers it credits to B013, which are B9710's. litellm/types/router.py: B8584 ports its pydantic models into the wheel and B165 owns `CustomRoutingStrategyBase`."
pitfalls:
  - "`async_get_available_deployment` takes `request_kwargs` as its second, required parameter, while the sync form takes it last with a default of None."
  - "With no `model_name`, `get_model_list` puts the alias rows and the routing group rows before the deployments, so the read test compares the lists in order."
  - "`add_deployment` answers None, without changing anything, when a deployment with the same `model_info.id` is already there."
  - "`delete_deployment(id)` and `get_model_info(id)` name their parameter `id`, so keyword callers pass `id=`; do not rename it to dodge the builtin."
  - "`update_settings(timeout=30.5)` stores 30, because LiteLLM casts the five integer settings with `int()`."
  - "After `set_model_list` or `add_deployment` the Python attributes `model_list` and `model_names` must change too; LiteLLM users read them directly."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
