id: B4320
title: Refresh Redis cloud credentials and authenticate connections
description: >-
  Build refresh-aware cloud credential providers that fetch and cache GCP IAM tokens,
  Azure AD access tokens, and AWS ElastiCache signatures. Preserve the 3300-second GCP
  cache TTL, 900-second ElastiCache query signature TTL, lowercased cache hostname,
  optional ServerlessCache query parameter, Azure credential selection via environment
  or config, and explicit provider precedence (GCP > Azure > AWS) without logging
  credentials or exposing API fields in diagnostics.

  Implement three redis.credentials.CredentialProvider subclasses: GCPIAMCredentialProvider
  with sync/async get_credentials methods that call _get_cached_gcp_iam_token, ElastiCacheIamProvider
  (32 chars or fewer) that constructs SigV4 signed URLs from resolved AWS credentials or
  a caller-injected credentials resolver, and AzureADCredentialProvider that wraps an
  azure-identity credential object for transparent token refresh and caching.

  Add sync connection callbacks (redis_connect_func) for GCP IAM and Azure AD that perform
  AUTH handshakes with fallback to password auth if the provider's AUTH fails. Implement
  _credential_provider_from_connect_func to extract providers from GCP/Azure callbacks
  for async or cluster paths, and _credential_provider_auth_kwargs to drop conflicting
  static credentials (username, password, redis_connect_func) when a provider is active.

  Load IAM settings from config (gcp_service_account, gcp_ssl_ca_certs, azure_redis_ad_token,
  azure_client_id/tenant_id/client_secret, aws_iam_auth, aws_iam_user_name/cache_name/region/serverless)
  or environment (REDIS_GCP_SERVICE_ACCOUNT, REDIS_AZURE_AD_TOKEN, AZURE_CLIENT_ID/TENANT_ID/SECRET).
  Implement _build_azure_credential to pick DefaultAzureCredential, ManagedIdentityCredential,
  or ClientSecretCredential based on what is configured. Implement _build_elasticache_iam_provider
  to validate required settings and wire them into ElastiCacheIamProvider.

  Implement create_gcp_iam_redis_connect_func and create_azure_ad_redis_connect_func as
  factory functions that capture GCP service account or Azure credential objects in closures
  and return sync connection callbacks that call on_connect, send AUTH with the credential,
  and fall back gracefully. Attach _gcp_service_account and _azure_credential attributes
  to the callbacks so async paths can extract and wrap them. Do not log credentials, and
  do not expose frozen credentials or raw client_id/tenant_id/secret on callback attributes.

  Implement _str_to_bool and _coerces_to_true helpers to parse environment string values
  (redis_kwargs_from_environment returns only strings). When credential_provider is set,
  call _url_without_userinfo to strip userinfo from URLs before passing them to redis-py,
  since the provider handles authentication. Keep AWS ElastiCache's TLS requirement check
  and the three-way provider precedence warning in the resolution logic.

  Load this module into betterlite-config as redis_credentials::* so config tests can assert
  on which credentials resolve and what environment snapshots they read. Every auth success,
  missing setting, and SDK ImportError gets a named case.
