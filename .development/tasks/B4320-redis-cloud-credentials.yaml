dod:
  - text: GCP IAM tokens are cached for 3300 seconds (55 minutes) with a module-level cache shared across connections and a double-checked locking pattern that blocks only one thread on expiry.
    proof: [redis-credentials-config-tests]
  - text: ElastiCacheIamProvider generates SigV4-signed URLs with the Action=connect query string, User parameter, optional ResourceType=ServerlessCache for serverless caches, and the cache hostname lowercased.
    proof: [redis-credentials-config-tests]
  - text: Azure credentials are built once and reused with transparent token refresh, selecting DefaultAzureCredential, ManagedIdentityCredential with explicit client_id, or ClientSecretCredential based on what is configured in environment or config.
    proof: [redis-credentials-config-tests]
  - text: GCP and Azure connection callbacks authenticate with AUTH, fall back to password auth if AUTH fails with AuthenticationWrongNumberOfArgsError, and extract the live credential object for async paths.
    proof: [redis-credentials-config-tests]
  - text: Provider precedence (GCP > Azure > AWS) is enforced and warnings are logged when conflicting providers are configured.
    proof: [redis-credentials-config-tests]
  - text: When credential_provider is set, conflicting static credentials (username, password, redis_connect_func) are removed and userinfo is stripped from URLs.
    proof: [redis-credentials-config-tests]
  - text: No credential value is logged, and frozen credentials or raw client_id/tenant_id/secret are never exposed on callback attributes.
    proof: [redis-credentials-config-tests]
  - text: AWS ElastiCache IAM authentication requires TLS, validated before building the provider.
    proof: [redis-credentials-config-tests]
  - text: The redis_credentials helper has its adapter in tools/oracle/helpers/redis_credentials.py, with committed test cases under tools/oracle/cases/helpers/redis-credentials/.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: redis-credentials-config-tests
      why: required redis_credentials tests fail, do not exist, or missing config key support
      run: >-
        grep -rlq 'redis_credentials' crates/betterlite-config/fuzz/corpus/config_yaml &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^redis_credentials::/)'
    - id: helper-case-corpus
      why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/redis-credentials)" &&
        test -f tools/oracle/helpers/redis_credentials.py &&
        grep -rlq 'redis_credentials' tools/oracle/fuzz/corpus/helper_case &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/redis-credentials/gcp-token-caching.yaml
  - tools/oracle/cases/helpers/redis-credentials/elasticache-sig-generation.yaml
  - tools/oracle/cases/helpers/redis-credentials/azure-credential-selection.yaml
deviations:
  - what: Azure credentials are fetched and cached by the azure-identity SDK; betterlite wraps them in AzureADCredentialProvider so the SDK's internal cache and silent refresh apply across connections.
    why: Fetching a new token per connection would waste latency and discard the SDK's refresh logic; the provider keeps it alive.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis_credential_provider.py#L203-L229
  - what: GCP IAM tokens are generated with google.cloud.iam_credentials_v1.IAMCredentialsClient; betterlite reuses the same cached-token contract but models it as a typed provider to fit the redis-py credential interface.
    why: The interface unifies GCP, Azure, and AWS providers into one redis-py contract, and the 3300-second cache applies the same deduplication benefit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis_credential_provider.py#L41-L102
out_of_scope:
  - The _generate_azure_ad_redis_token function in LiteLLM (no caller at the pin); the active Azure flows use the credential object and get_token directly.
  - The get_redis_url_from_environment function in LiteLLM (no caller at the pin); the active clients resolve targets through _get_redis_client_logic and the config loader.
  - The rest of _redis.py beyond the owned spans, including cluster and sentinel initialization (handled by B4321–B4323).
  - Secret manager behavior beyond environment variable lookup; B002's config loader surfaces that, and G4 owns the full get_secret_str contract.
pitfalls:
  - 'The oracle helper for this task is pre-registered as redis_credentials in the config group. Replace the stub Op in tools/oracle/src/helpers/config/redis_credentials.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/redis_credentials.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - GCP token generation raises ImportError when google-cloud-iam is not installed; preserve the error message with pip install instructions.
  - ElastiCache signature generation with SigV4 needs botocore.auth.SigV4QueryAuth and botocore.awsrequest.AWSRequest, and the cache hostname must be lowercased before signing or caching will fail on repeated queries.
  - Azure credential objects cache tokens internally; do not rebuild the credential on every connection, or the internal cache is discarded and latency explodes.
  - REDIS_USERNAME is read from os.environ directly in the Azure callback to avoid duplicating it in every config/struct; it is optional and None if not set.
  - Provider precedence logs warnings but does not fail; GCP silently wins over Azure and AWS, Azure wins over AWS.
  - AuthenticationWrongNumberOfArgsError fallback in connect callbacks handles Redis < 6.0 / no ACL that does not recognize two-argument AUTH; preserve the fallback.
  - The cache_name in ElastiCache resolution is lowercased once, early in the constructor, and the lowercased value is reused for every signature so queries match.
