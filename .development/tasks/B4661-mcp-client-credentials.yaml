deviations:
  - what: The token POST goes through the pooled betterlite-http client with its response size cap and deadlines, and a body over the cap is Unreachable.
    why: LiteLLM's handler reads any body size; the bounded-inputs rule and B173 set the caps for every outbound call.
  - what: expires_in strings accept ASCII digits only, and a value outside the i64 range is treated as unparsable (the default TTL applies).
    why: Python int() also accepts other Unicode digits and arbitrary-size integers; bounded integer handling needs a fixed width.
  - what: Warning logs carry the status code and the scheme and host of the token URL, not request headers or body previews.
    why: LiteLLM's describe_upstream_response prints masked headers and body previews; that debug module belongs to another task and a token endpoint reply is a place secrets can leak.
  - what: The retry is a send_with_retry method on the bearer auth, driven by the caller's call object, instead of an httpx2.Auth generator.
    why: The Rust client has no auth-flow generator; the observable behavior (one retry with a fresh token, the second response stands) is the same.
out_of_scope:
  - "litellm/proxy/_experimental/mcp_server/oauth2_token_cache.py (MCPOAuth2TokenCache, MCPPerUserTokenCache, resolve_mcp_auth, resolved_token_header) is B4662. It is the older cache keyed by server and has its own request code; nothing in this task calls it and it does not call this task."
  - "The resolver arm that builds the source with default arguments and wraps the token in ClientCredentialsBearerAuth, and the call sites that run send_with_retry on a real MCP request, are B4667 and the MCP client tasks."
  - "describe_upstream_http_failure, describe_upstream_response and safe_upstream_url in mcp_debug.py belong to the MCP server umbrella (B136); this task logs status and origin only."
  - "OAuthToken, TokenCacheBackend and InMemoryTokenCacheBackend are B4656. The client authentication helper and the credential types are B4650."
  - "Redis-backed or cross-replica caching of the M2M token: LiteLLM passes no shared backend here, so each worker mints its own."
pitfalls:
  - "The Python edge relies on litellm's handler raising HTTPStatusError on 4xx and 5xx, so the Success outcome only ever carries a 2xx body; check the status before decoding in Rust."
  - "A 2xx body that is valid JSON but not an object (a list, a string, null) is Denied with the response's own status code (200), not an error from the source."
  - "A Success body with no access_token is logged at the edge but still returned as Success; the Misconfigured \"missing 'access_token'\" error comes from the source, so the two checks must not be merged."
  - "The cache backend is keyed by (user, server) but has no user here: pass the identity key as the first part. Using the server id alone would serve a token minted under an old secret or scope."
  - "get reads the backend before taking the lock and again after, and refetch never reads before the lock; dropping the second read in get makes ten concurrent misses make ten grants."
  - "refetch compares the cached access token with the one the upstream rejected; if you compare expiry instead, a burst of 401s mints one token per caller."
  - "A failed refetch has already deleted the cache entry, so the next get mints again; do not restore the old token."
  - "The TTL floor is min(expires_in, min_cache_seconds), not min_cache_seconds, so a 5 second token is cached for 5 seconds and not for 10; expires_in of 0 or below stores nothing."
  - "expires_in of 3600.5 (a float) and true are unparsable and fall back to default_ttl_seconds 300 with expires_at None, while the string \"3600\" parses; do not use a lenient number cast."
  - "The scope field of the response fills OAuthToken.scopes; the configured scopes only go into the request form."
  - "audience and resource are sent only when non-empty, and resource comes from upstream_resource; sending an empty audience breaks IdPs that reject unknown parameters."
  - "client_secret_basic puts the credentials in the Authorization header and nothing in the form, so a client_id in the body as well is a bug."
  - "The retry reuses the same request; a retried request must carry the fresh token under the carrier's header name (default Authorization with the Bearer prefix), not a hard-coded header."
  - "The second send's output is returned even when it is a 401; a third attempt would hide a real credential problem from the caller."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
