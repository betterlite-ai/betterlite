dod:
  - text: >-
      prepare_grant builds the form in the order grant_type, client auth body, scope, audience, resource, leaves out scope, audience and resource when empty, and uses the Basic Authorization header and an empty body for client_secret_basic.
    proof: [grant-tests, helper-tests, helper-oracle]
  - text: >-
      prepare_grant returns Misconfigured "client_credentials config is missing: ..." naming every missing field of client_id, client_secret and token_url in that order, and treats an empty string as missing.
    proof: [grant-tests, helper-tests, helper-oracle]
  - text: >-
      identity_key is the SHA-256 hex of the seven values joined with a newline, and changing the secret, a scope, the audience, the auth method, the token URL or the resource changes it.
    proof: [grant-tests, helper-tests, helper-oracle]
  - text: >-
      parse_expires_in returns None for booleans, floats, null and unparsable strings, and parses integers and Python-style integer strings; parse_granted_scopes splits a non-empty string and returns an empty list otherwise.
    proof: [grant-tests, helper-tests, helper-oracle]
  - text: >-
      get serves a cached token without a grant, and ten concurrent misses on one server make exactly one grant; the bounded lock table drops the oldest lock at max_locks.
    proof: [source-tests]
  - text: >-
      An unreachable endpoint, a 5xx, a 4xx and a body without access_token give the four distinct CredError values and messages listed in the description.
    proof: [source-tests, helper-tests, helper-oracle]
  - text: >-
      The cache TTL is max(expires_in - skew, min(expires_in, min_cache), 0) when expires_in parsed and default_ttl_seconds when it did not, and a zero TTL stores nothing.
    proof: [source-tests, helper-tests, helper-oracle]
  - text: >-
      Rotating the secret or changing the scopes of the config makes get mint a new token instead of serving the cached one.
    proof: [source-tests]
  - text: >-
      refetch returns a token another caller already replaced without a grant, deletes and re-mints when the cached token is the failed one, and returns None when the config is incomplete or the grant fails.
    proof: [source-tests]
  - text: >-
      send_with_retry sends once on a non-401, retries exactly once with the refetched token on a 401, returns the first output when refetch gives None, and returns the second output even when it is a 401.
    proof: [bearer-tests, helper-tests, helper-oracle]
  - text: >-
      HttpGrantPost sends the form with Accept: application/json, maps non-2xx to Denied with the status code, maps a refused connection to Unreachable, and keeps URL, form and body out of the detail and the logs.
    proof: [token-post-tests]
  - text: >-
      parse_token_response never panics on arbitrary bytes, and its corpus replays.
    proof: [parser-corpus]
  - text: >-
      The helper operation and the shared helper corpus reach the grant, TTL and retry code.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: grant-tests
      why: prepare_grant, identity_key or the expires_in and scope parsers are missing or wrong.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::client_credentials::grant::/)'
    - id: source-tests
      why: the token source's caching, single flight, TTL, error mapping or refetch is missing or wrong.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::client_credentials::source::/)'
    - id: bearer-tests
      why: the bearer auth does not retry exactly once.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::client_credentials::bearer_auth::/)'
    - id: token-post-tests
      why: the token endpoint POST or the response decoder is missing or wrong.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::outbound_credentials::client_credentials::token_post::/) - test(/replays_the_/)'
    - id: parser-corpus
      why: the token_response fuzz target, its added corpus or its replay test is missing or fails.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/token_response.rs && grep -q token_response crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/token_response)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_token_response_corpus)'
    - id: helper-tests
      why: the oracle helper for this task is missing or its tests fail.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::server::b4661::/) - test(/replays_the_/)'
    - id: helper-oracle
      why: the helper cases do not match LiteLLM's answers.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-client-credentials)" && cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/helpers/mcp-client-credentials
    - id: helper-python
      why: the helper adapter is missing or fails the strict Python checks.
      run: test -f tools/oracle/helpers/b4661.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added helper case reaches the shared helper corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-client-credentials-*')" && grep -rlq b4661 tools/oracle/fuzz/corpus/helper_case/mcp-client-credentials-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
