id: B4661
title: MCP client credentials grants and one-shot retry
description: >-
  Build the machine-to-machine (client_credentials) token source for MCP upstreams and the bearer auth that retries a rejected request once.
  The code lives in betterlite-server under mcp::outbound_credentials::client_credentials, in these files: client_credentials.rs (module root and public re-exports), grant.rs, token_post.rs, source.rs and bearer_auth.rs.
  It uses ClientCredentialsConfig, CredError, CredResult, HeaderCarrier, TokenEndpointClientAuth, build_token_client_auth, the Auth trait and StaticHeaderAuth from betterlite-mcp (B4650), and OAuthToken, TokenCacheBackend and InMemoryTokenCacheBackend from B4656. betterlite-server does not depend on betterlite-mcp yet, so add that dependency (plus any small crate you need, such as sha2) to crates/betterlite-server/Cargo.toml. Never edit a B4650 or B4656 file. If a B4656 trait signature differs from what is written here, adapt at the call site.

  grant.rs holds the pure part. prepare_grant(config) returns a PreparedGrant { token_url, form, headers, identity_key } or CredError::Misconfigured. A config is complete only when client_id, client_secret and token_url are all non-empty; an empty string counts as missing. The error text is "client_credentials config is missing: " followed by the missing names joined with ", " in the order client_id, client_secret, token_url. The client is authenticated with build_token_client_auth from the config's token_endpoint_auth_method. If that call returns its config error (it cannot, because the fields were just checked), map it to CredError::Misconfigured with the error's text. The form is built in this order: grant_type=client_credentials, then the fields of the client auth body (client_id and client_secret for client_secret_post, nothing for client_secret_basic), then scope (the scopes joined by one space, only when the list is not empty), then audience (only when set and non-empty), then resource taken from upstream_resource (only when set and non-empty). The headers are the client auth headers (the Basic Authorization header for client_secret_basic, otherwise none). Form values and header values that hold secrets are SecretString and are exposed only when the request is written.
  identity_key is the lowercase hex SHA-256 of these values joined with a single "\n": token_url, client_id, client_secret (exposed), the auth method name ("client_secret_post", "client_secret_basic" or the empty string when unset), the scopes joined with a space, audience, upstream_resource. Unset values are the empty string. The key names the client identity, so rotating the secret, changing a scope or changing the audience gives a new key and a stale token is never served for the new identity. The key never appears in a log line or an error.
  parse_expires_in takes the JSON value of expires_in and returns Option<i64>: a JSON boolean is None, an integer is itself, a string is parsed the way Python int() parses it (surrounding whitespace, an optional sign, digits with single underscores between them) and is None when that fails, and anything else (null, float, array, object, missing) is None. A float such as 3600.5 is None. parse_granted_scopes takes the JSON value of scope and returns the whitespace-split words when it is a non-empty string, otherwise an empty list.

  token_post.rs holds the token endpoint seam and its decoder. TokenEndpointOutcome is an enum: Success { body } (a JSON object), Denied { status_code, detail } (the endpoint answered but granted nothing) and Unreachable { detail } (no usable answer). M2mTokenEndpointPost is a trait with one async method post(url, form, headers) returning a TokenEndpointOutcome, so the source can be tested without a live server. The production implementation, HttpGrantPost, sends the form as application/x-www-form-urlencoded with the header Accept: application/json first and the grant headers after it (a grant header with the same name wins), through the pooled client of betterlite-http (B173). A non-2xx status is Denied with the status code and the detail "token endpoint returned HTTP <code>"; the response body is not read into the detail. A transport failure (DNS, TLS, connect, timeout, body over the pool's cap) is Unreachable with only the error kind as detail, never the URL or the body. A 2xx body goes to parse_token_response(bytes), the decoder for outside input: it returns Success when the bytes are a JSON object and otherwise Denied with the response's status code and the detail "token endpoint returned a non-JSON-object body". It never panics on any bytes. When the object has no non-empty string access_token, the edge logs a warning with the status code and still returns Success; the source then rejects it. Logs carry the status and the scheme and host of the token URL only (no path, query, credentials, form values or body).

  source.rs holds ClientCredentialsTokenSource. Its constructor takes the poster, an optional TokenCacheBackend (default: an InMemoryTokenCacheBackend sharing the same clock), a clock, and the tunables default_ttl_seconds (default 300.0), expiry_skew_seconds (60.0), min_cache_seconds (10.0) and max_locks (1024). These are constructor arguments, not the MCP_OAUTH2_* environment constants; the resolver builds the source with the defaults. Tokens are cached in the backend under the pair (identity_key, server_id): the backend's user slot holds the identity key, because there is no user here.
  get(server_id, config) runs prepare_grant (an error is returned as is), then reads the backend, and on a hit returns that token. On a miss it takes the per-server lock, reads the backend again, and only if it is still empty posts the grant and caches the result. So concurrent misses on one server produce one grant. The lock table is bounded: when server_id is not in it and it already holds max_locks entries, the oldest-inserted lock is dropped before the new one is added (use an insertion-ordered map). Dropping a lock that a task still holds only lets one extra grant run; it is not a correctness problem.
  Mapping a grant outcome: Unreachable gives CredError::UpstreamUnavailable("OAuth2 token endpoint unreachable: <detail>"); Denied with status 500 or more gives UpstreamUnavailable("OAuth2 token endpoint failed: <detail>"); Denied below 500 gives Misconfigured("OAuth2 client_credentials grant rejected: <detail>"); Success without a non-empty string access_token gives Misconfigured("OAuth2 token response is missing 'access_token'"). A good token becomes OAuthToken { access_token, expires_at: now + expires_in when expires_in parsed (otherwise None), scopes: the granted scope words, no refresh token, no identity proof }.
  The cache TTL is: when expires_in parsed, max(expires_in - expiry_skew_seconds, min(expires_in, min_cache_seconds), 0); when it did not parse, default_ttl_seconds. The token is stored only when the TTL is above zero, and it is returned either way. The floor min_cache_seconds is capped at the token's own lifetime so a short token is never served after it expires, and an expires_in of zero or less caches nothing, so each request mints again (serialized by the lock).
  refetch(server_id, config, failed_access_token) returns Option<SecretString>: None when prepare_grant fails. Otherwise it takes the same per-server lock, reads the backend, and if a token is there whose access_token differs from the failed one, returns it with no grant (a burst of 401s yields one fetch). If the cached token equals the failed one, or nothing is cached, it deletes the backend entry, grants and caches as above, and returns the new access token, or None when the grant failed. The deleted entry stays deleted after a failed grant.
  Nothing in this module reads a Subject or any user context: every caller shares the one client identity.

  bearer_auth.rs holds ClientCredentialsBearerAuth, the Rust shape of LiteLLM's httpx auth that retries once. It is built from the resolved access token, a Refetch trait object (one async method taking the rejected token and returning Option<SecretString>; SourceRefetch binds a source, a server id and a config to it, as LiteLLM binds them with functools.partial) and the config's HeaderCarrier. It holds the current token behind a lock and implements the Auth trait: apply writes carrier.header(token) into the header map, so a later request already uses a replaced token. Its method send_with_retry takes a call object (a trait with an async send taking an &dyn Auth and an is_unauthorized check on the output) and does this: send with the current token; if the output is not a 401, return it; otherwise call refetch with the token that was just used; when refetch returns None, return the first output unchanged; when it returns a fresh token, store it, send once more with it, and return that second output whatever it is, even a second 401. There is never a third send. A fresh token that cannot be written as a header value is CredError::Misconfigured. Tokens are SecretString everywhere and never appear in Debug output.

  No route reaches this code until the resolver task (B4667) wires it in, so the oracle checks are helper cases on pure behavior, and the umbrella that wires the resolver adds HTTP cases.
