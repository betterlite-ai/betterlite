oracle_cases: []

deviations:
  - what: When _stream_apply_output_masking detects a mixed stream (ModelResponseStream followed by non-bytes) or an unknown event type, it logs a warning, flushes buffered chunks, and switches to transparent passthrough instead of raising an exception.
    why: LiteLLM warns and continues for incompatible stream shapes. betterlite preserves this fail-open behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L1471-L1483
  - what: When _mask_anthropic_sse_stream cannot assemble the Anthropic response, it logs a warning and returns the original bytes chunks untouched instead of raising.
    why: LiteLLM treats assembly failure as a non-fatal condition and passes through. betterlite preserves this behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L1502-L1517
  - what: When _stream_apply_output_masking buffers zero chunks or cannot assemble them, it logs a warning and returns early without masking instead of raising.
    why: LiteLLM treats empty streams as a non-fatal condition. betterlite preserves this behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L1484-L1493
  - what: >-
      When _unmask_sse_bytes_chunk encounters a UTF-8 decode error, JSON parse error, or missing delta field,
      it silently skips the malformed line and returns the original chunk unchanged.
    why: Robust handling of malformed SSE bytes prevents exceptions in streaming paths. LiteLLM skips bad lines.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L1520-L1549
  - what: When _stream_pii_unmasking sees a non-chat event (non-ModelResponseStream, non-bytes), it flushes all buffered ModelResponseStream chunks before passing the event through.
    why: Flushing prevents buffered chunks from being reordered or dropped when the stream mixes OpenAI chat and /v1/responses API events.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L1604-L1616
  - what: Anthropic SSE frame boundary detection happens at the first complete frame with a data line; frames are compared against is_anthropic_sse_stream() for shape detection.
    why: The shape decision must be made on a whole frame to avoid false positives from transport-split lines. Delegating to is_anthropic_sse_stream() reuses the existing detection.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L1457-L1470

out_of_scope:
  - "is_anthropic_sse_stream, assemble_anthropic_sse_stream, anthropic_sse_chunks_from_response, model_response_text: owned by B3669 (Anthropic SSE assembly and projection)."
  - "split_complete_sse_frames: owned by B005 (SSE keepalive and frame boundaries)."
  - "stream_chunk_builder, convert_model_response_to_streaming: owned by B2227 (streaming response assembly)."
  - "_process_response_for_pii: owned by B3806 (response transformations)."
  - "_unmask_pii_text: owned by B3805 (entity actions and unmasking)."
  - "_SsePreface helper class/type: owned by framework marshaling, not built by this task. Used as a type marker in streaming."
  - "apply_to_output, output_parse_pii configuration checks and defaults: owned by lifecycle/constructor tasks."
  - "Guardrail observation and exception handling in framework: owned by U1 (framework leaves)."

pitfalls:
  - "SSE frame detection relies on finding 'data' on a line after full line breaks (\\r\\n or \\n); a split line does not count, hence coalescing is required."
  - "Leading empty SSE frames (comments, empty lines) must be yielded before buffering starts, to preserve their role as keepalives."
  - "The byte cap _MAX_FIRST_SSE_FRAME_BYTES on coalescing prevents unbounded buffering of unterminated frames; a frame larger than the cap is treated as the first data frame."
  - "ModelResponseStream chunks are buffered, but bytes chunks trigger Anthropic-specific assembly; mixing the two requires switching to passthrough."
  - "Usage metadata can be missing from assembled responses when stream_chunk_builder reconstructs from chunks; the last chunk's usage must be preserved."
  - "Anthropic SSE streams converted back from a masked ModelResponse may differ from the original if masking changed the text content; returning original chunks on no-change preserves byte-for-byte identity."
  - "Responses API events (non-ModelResponseStream, non-bytes) interrupt stream buffering and force immediate passthrough to prevent reordering."
  - "Truncated PII tokens in the unmasking buffer only appear at the end of text (due to max_tokens truncation); tokens at the beginning or middle are never checked for truncation."
  - "SSE lines starting with 'data' but not containing valid JSON (e.g., 'data [DONE]') are silently skipped without attempting JSON parse."

