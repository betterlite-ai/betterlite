dod:
  - text: _split_sse_preface returns (preface_bytes, classifiable_bytes) where preface holds leading empty SSE frames and classifiable holds the first frame with "data:" line and everything after.
    proof: [split-sse-preface]
  - text: _flush_unmaskable_buffer logs a warning and yields buffered chunks when mixed stream shapes are detected.
    proof: [flush-unmaskable]
  - text: _coalesce_first_sse_frame coalesces bytes chunks until a complete SSE frame containing a data line is found, relaying non-bytes chunks and stopping at _MAX_FIRST_SSE_FRAME_BYTES if no data line is found.
    proof: [coalesce-sse-frame]
  - text: _coalesce_first_sse_frame yields pending bytes if the stream ends without finding a data-line frame and returns early.
    proof: [coalesce-stream-end]
  - text: _mask_buffered_model_response_stream assembles buffered ModelResponseStream chunks using stream_chunk_builder, applies PII masking with _process_response_for_pii, and converts back to streaming with convert_model_response_to_streaming.
    proof: [mask-buffered]
  - text: _mask_buffered_model_response_stream returns original chunks unchanged if the assembled response is not a ModelResponse.
    proof: [mask-buffered-invalid]
  - text: _stream_apply_output_masking coalesces the first SSE frame to classify stream shape, detects Anthropic versus other patterns, dispatches to _mask_anthropic_sse_stream or buffers ModelResponseStream chunks.
    proof: [stream-apply-shape-detect]
  - text: _stream_apply_output_masking switches to passthrough and logs warnings when mixed stream shapes are detected (ModelResponseStream followed by non-bytes) or unknown event types are seen.
    proof: [stream-apply-mixed]
  - text: _stream_apply_output_masking flushes all buffered chunks and logs warnings when assembly fails or no chunks were buffered.
    proof: [stream-apply-flush]
  - text: _stream_apply_output_masking re-raises BlockedPiiEntityError immediately or when no chunks were buffered, without yielding the original chunks.
    proof: [stream-apply-blocked-raise]
  - text: _mask_anthropic_sse_stream collects all remaining bytes chunks, assembles them with assemble_anthropic_sse_stream, and calls _process_response_for_pii with mode="mask".
    proof: [mask-anthropic]
  - text: _mask_anthropic_sse_stream converts the masked response back to raw SSE chunks with anthropic_sse_chunks_from_response and returns original chunks unchanged if no masking occurred.
    proof: [mask-anthropic-convert]
  - text: >-
      _unmask_sse_bytes_chunk decodes UTF-8, finds "data: " SSE lines, parses the JSON event,
      and replaces PII tokens in delta.text for content_block_delta events with type="text_delta".
    proof: [unmask-sse-delta]
  - text: _unmask_sse_bytes_chunk skips lines that fail UTF-8 decode, JSON parse, or key/type checks and returns the original chunk.
    proof: [unmask-sse-errors]
  - text: _unmask_responses_api_completed_chunk walks response.output message items and their content blocks (both dict and object forms) and replaces PII tokens in text fields using _unmask_pii_text.
    proof: [unmask-responses-api]
  - text: _stream_pii_unmasking buffers ModelResponseStream chunks and checks incoming chunks against pii_tokens from request_data.metadata.
    proof: [stream-pii-unmask]
  - text: _stream_pii_unmasking calls _unmask_sse_bytes_chunk for raw bytes and _unmask_responses_api_completed_chunk for response.completed events, and passes other chunks through unchanged.
    proof: [stream-pii-dispatch]
  - text: _stream_pii_unmasking switches to passthrough when a non-chat chunk is seen, flushing buffered ModelResponseStream chunks before yielding it.
    proof: [stream-pii-mixed]
  - text: _stream_pii_unmasking assembles buffered ModelResponseStream chunks only if no non-chat chunks were seen, and returns early if no chunks are buffered.
    proof: [stream-pii-assemble]
  - text: _stream_pii_unmasking calls _preserve_usage_from_last_chunk to copy usage from the last buffered chunk when stream_chunk_builder does not set it.
    proof: [stream-pii-usage]
  - text: _stream_pii_unmasking calls _process_response_for_pii with mode="unmask" on the assembled response.
    proof: [stream-pii-process]
  - text: _stream_pii_unmasking logs an error and yields remaining_chunks when an unexpected exception occurs during unmasking.
    proof: [stream-pii-exception]
  - text: async_post_call_streaming_iterator_hook dispatches to _stream_apply_output_masking when apply_to_output is true.
    proof: [hook-apply-to-output]
  - text: async_post_call_streaming_iterator_hook dispatches to _stream_pii_unmasking when output_parse_pii is true and pii_tokens exist.
    proof: [hook-output-parse]
  - text: async_post_call_streaming_iterator_hook passes response chunks through unchanged when neither apply_to_output nor (output_parse_pii and pii_tokens) is true.
    proof: [hook-passthrough]
  - text: _preserve_usage_from_last_chunk copies the usage attribute from the last buffered ModelResponseStream chunk to the assembled response when stream_chunk_builder did not set it.
    proof: [preserve-usage]

