id: B3807
title: Presidio streamed masking and unmasking
description: >-
  Implement buffered streaming response assembly for PII masking and incremental token
  unmasking across split placeholders. Build SSE frame coalescing to classify stream shape,
  Anthropic native SSE handling with response reconstruction, and fallback modes when mixed
  stream types or unknown events prevent safe reassembly. Preserve role-preface handling,
  unbuffered passthrough for non-reconstructible streams, usage preservation from last
  chunk, and per-request token mapping for unmasking. Implement masking for both regular
  chat streaming and /v1/responses API events, with handling for Anthropic SSE text_delta
  unmasking and Responses API completed text mutations.

  Key behavior: async_post_call_streaming_iterator_hook acts as the streaming response
  post-hook. When apply_to_output is true, call _stream_apply_output_masking to buffer
  ModelResponseStream chunks, assemble them with stream_chunk_builder, mask with
  _process_response_for_pii(mode="mask"), convert back to streaming with
  convert_model_response_to_streaming, and handle errors with unbuffered passthrough on
  assembly failure. When output_parse_pii and pii_tokens exist, call _stream_pii_unmasking
  to unmask SSE bytes chunks with _unmask_sse_bytes_chunk and Responses API completed events
  in-place with _unmask_responses_api_completed_chunk, preserving non-token streams as-is.
  _stream_apply_output_masking coalesces leading non-data SSE frames, detects first-frame
  stream shape (Anthropic versus OpenAI versus Responses), switches to raw Anthropic SSE
  handling when detected, or buffers and assembles ModelResponseStream chunks, or flushes
  buffered chunks and passes through on unknown events. _coalesce_first_sse_frame joins
  raw bytes chunks until a complete SSE frame with a data line is found or _MAX_FIRST_SSE_FRAME_BYTES
  is reached, relaying non-bytes chunks untouched and returning the joined frame after
  leading empty frames. _mask_anthropic_sse_stream assembles the first chunk and all
  remaining bytes into a complete Anthropic response, processes for PII, converts masked
  response back to raw SSE chunks, or returns original chunks unchanged if no masking
  occurred. Error handling logs warnings instead of raising for mixed/empty/non-chat streams,
  but raises BlockedPiiEntityError immediately. _unmask_sse_bytes_chunk decodes SSE lines,
  finds delta text fields in Anthropic content_block_delta events, replaces tokens and
  re-encodes the line as JSON. _unmask_responses_api_completed_chunk walks response.output
  message items and their content blocks to unmask text fields in-place.

