dod:
- text: 'minimal_thinking_floor: None or none maps to no thinking; adaptive model maps every remaining input to
    {type:adaptive,display:summarized} before string validation. Legacy minimal uses max(configured minimal=128,
    literal1024); low/medium/high/xhigh/max budgets use B688 loaded defaults1024/2048/4096/8192/16384. Unknown legacy
    input raises BadRequestError with Unmapped reasoning effort: <repr>. Must be one of: ''minimal'', ''low'', ''medium'',
    ''high'', ''xhigh'', ''max'', ''none''.'
  proof:
  - case-minimal-thinking-floor
  - oracle
  - helper-python
- text: 'max_token_budget_cap: Absent max_tokens or noninteger budget returns thinking unchanged (Python bool is
    int). max_tokens<=1024 drops thinking even when its existing budget is smaller; otherwise budget<max_tokens
    stays unchanged. Capping reconstructs only type (default enabled) and budget_tokens=max_tokens-1, dropping display
    and other fields.'
  proof:
  - case-max-token-budget-cap
  - oracle
  - helper-python
- text: 'effort_validation: max is allowed by adaptive-thinking capability or supports_max_reasoning_effort, else
    return effort=''max'' is not supported by this model. Got model: <model>; xhigh requires supports_xhigh_reasoning_effort
    and has analogous text. Other levels return None here. Effort-param support is supports_output_config OR any
    low/minimal/medium/high/xhigh/max capability. Invalid input error is BadRequestError with model/provider and
    Invalid reasoning_effort: <repr>. Must be one of: ''minimal'', ''low'', ''medium'', ''high'', ''xhigh'', ''max'',
    ''none''.'
  proof:
  - case-effort-validation
  - oracle
  - helper-python
- text: 'speed_policy: Only provider None/anthropic can use exact-model supports_speed=True; no fallback capability
    inference. Absent speed key is no-op. Unsupported present key (including None) raises UnsupportedParamsError400
    <model> does not support speed=<repr>. To drop unsupported params, set `litellm.drop_params = True`. Global
    OR per-call drop_params instead warns Dropping unsupported `speed` for model=<model> (drop_params=True). Fast
    mode is only supported on select Opus models. and removes speed.'
  proof:
  - case-speed-policy
  - oracle
  - helper-python
- text: New anthropic_capabilities seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
