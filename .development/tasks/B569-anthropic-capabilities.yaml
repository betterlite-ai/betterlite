id: B569
title: Anthropic model capability and thinking policy
description: >-
  Implement AnthropicConfig effort, speed, supported parameter and thinking-budget gates over B688 catalog/capability
  projections. Preserve effort gates, minimum thinking budget and max-token cap; capability lookup and legacy-to-adaptive
  translation remain B688.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig._supports_effort_level L399-L403; AnthropicConfig._validate_effort_for_model L406-L415; AnthropicConfig._model_supports_effort_param
  L418-L431; AnthropicConfig._model_supports_speed_param L434-L444; AnthropicConfig._maybe_drop_speed_param L447-L471;
  AnthropicConfig._raise_invalid_reasoning_effort L474-L494; AnthropicConfig.get_supported_openai_params L496-L527;
  AnthropicConfig._map_reasoning_effort L1251-L1309; AnthropicConfig.cap_thinking_budget_to_max_tokens L1312-L1326.


  Named case contracts: minimal_thinking_floor: None or none maps to no thinking; adaptive model maps every remaining
  input to {type:adaptive,display:summarized} before string validation. Legacy minimal uses max(configured minimal=128,
  literal1024); low/medium/high/xhigh/max budgets use B688 loaded defaults1024/2048/4096/8192/16384. Unknown legacy
  input raises BadRequestError with Unmapped reasoning effort: <repr>. Must be one of: 'minimal', 'low', 'medium',
  'high', 'xhigh', 'max', 'none'. max_token_budget_cap: Absent max_tokens or noninteger budget returns thinking
  unchanged (Python bool is int). max_tokens<=1024 drops thinking even when its existing budget is smaller; otherwise
  budget<max_tokens stays unchanged. Capping reconstructs only type (default enabled) and budget_tokens=max_tokens-1,
  dropping display and other fields. effort_validation: max is allowed by adaptive-thinking capability or supports_max_reasoning_effort,
  else return effort='max' is not supported by this model. Got model: <model>; xhigh requires supports_xhigh_reasoning_effort
  and has analogous text. Other levels return None here. Effort-param support is supports_output_config OR any low/minimal/medium/high/xhigh/max
  capability. Invalid input error is BadRequestError with model/provider and Invalid reasoning_effort: <repr>. Must
  be one of: 'minimal', 'low', 'medium', 'high', 'xhigh', 'max', 'none'. speed_policy: Only provider None/anthropic
  can use exact-model supports_speed=True; no fallback capability inference. Absent speed key is no-op. Unsupported
  present key (including None) raises UnsupportedParamsError400 <model> does not support speed=<repr>. To drop unsupported
  params, set `litellm.drop_params = True`. Global OR per-call drop_params instead warns Dropping unsupported `speed`
  for model=<model> (drop_params=True). Fast mode is only supported on select Opus models. and removes speed. supported_parameter_list:
  Base ordered list: stream,stop,temperature,top_p,max_tokens,max_completion_tokens,tools,tool_choice,extra_headers,parallel_tool_calls,response_format,user,web_search_options,speed,context_management,cache_control.
  Append thinking,reasoning_effort if case-sensitive claude-3-7-sonnet substring, B688 adaptive capability or B174
  supports_reasoning. Speed remains advertised even when speed gate later rejects it.


  Existing output_config.effort preservation is B576 mapping, not this task. Reuse B688 thinking-budget loaders
  and B206 global/per-call drop_params configuration; no independent environment reads.


  Shared supports/declared capability functions are B2221; raw Anthropic catalog flags are B2216 where the owned
  code calls those functions. These are lower prerequisites, not B157 SDK calls.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-anthropic/src/capabilities.rs with adjacent tests under capabilities/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function capabilities_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): minimal_thinking_floor, max_token_budget_cap, effort_validation, speed_policy, supported_parameter_list.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_capabilities* using HelperCase: kind:
  helper and the externally tagged anthropic_capabilities variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_capabilities that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 184 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 220 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 560 planned, 575 maximum changed lines.
