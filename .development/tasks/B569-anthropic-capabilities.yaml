    Append thinking,reasoning_effort if case-sensitive claude-3-7-sonnet substring, B688 adaptive capability or
    B174 supports_reasoning. Speed remains advertised even when speed gate later rejects it.'
  proof:
  - case-supported-parameter-list
  - oracle
  - helper-python
checks:
  optional:
  - mutants
  commands:
  - id: case-minimal-thinking-floor
    why: 'None or none maps to no thinking; adaptive model maps every remaining input to {type:adaptive,display:summarized}
      before string validation. Legacy minimal uses max(configured minimal=128, literal1024); low/medium/high/xhigh/max
      budgets use B688 loaded defaults1024/2048/4096/8192/16384. Unknown legacy input raises BadRequestError with
      Unmapped reasoning effort: <repr>. Must be one of: ''minimal'', ''low'', ''medium'', ''high'', ''xhigh'',
      ''max'', ''none''.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::capabilities_cases::case_[0-9]+_minimal_thinking_floor$/)'
  - id: case-max-token-budget-cap
    why: Absent max_tokens or noninteger budget returns thinking unchanged (Python bool is int). max_tokens<=1024
      drops thinking even when its existing budget is smaller; otherwise budget<max_tokens stays unchanged. Capping
      reconstructs only type (default enabled) and budget_tokens=max_tokens-1, dropping display and other fields.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::capabilities_cases::case_[0-9]+_max_token_budget_cap$/)'
  - id: case-effort-validation
    why: 'max is allowed by adaptive-thinking capability or supports_max_reasoning_effort, else return effort=''max''
      is not supported by this model. Got model: <model>; xhigh requires supports_xhigh_reasoning_effort and has
      analogous text. Other levels return None here. Effort-param support is supports_output_config OR any low/minimal/medium/high/xhigh/max
      capability. Invalid input error is BadRequestError with model/provider and Invalid reasoning_effort: <repr>.
      Must be one of: ''minimal'', ''low'', ''medium'', ''high'', ''xhigh'', ''max'', ''none''.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::capabilities_cases::case_[0-9]+_effort_validation$/)'
  - id: case-speed-policy
    why: Only provider None/anthropic can use exact-model supports_speed=True; no fallback capability inference.
      Absent speed key is no-op. Unsupported present key (including None) raises UnsupportedParamsError400 <model>
      does not support speed=<repr>. To drop unsupported params, set `litellm.drop_params = True`. Global OR per-call
      drop_params instead warns Dropping unsupported `speed` for model=<model> (drop_params=True). Fast mode is
      only supported on select Opus models. and removes speed.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::capabilities_cases::case_[0-9]+_speed_policy$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_capabilities.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_capabilities*")"
      && grep -lq 'anthropic_capabilities' tools/oracle/fuzz/corpus/helper_case/anthropic_capabilities* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_capabilities$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-supported-parameter-list
    why: 'Base ordered list: stream,stop,temperature,top_p,max_tokens,max_completion_tokens,tools,tool_choice,extra_headers,parallel_tool_calls,response_format,user,web_search_options,speed,context_management,cache_control.
      Append thinking,reasoning_effort if case-sensitive claude-3-7-sonnet substring, B688 adaptive capability or
      B174 supports_reasoning. Speed remains advertised even when speed gate later rejects it.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::capabilities_cases::case_[0-9]+_supported_parameter_list$/)'
