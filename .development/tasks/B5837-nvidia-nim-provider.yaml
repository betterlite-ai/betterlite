deviations:
  - what: A rerank reply whose ranking entry lacks index or logit, or has an index below minus the passage count, fails with a typed error that names the field, status 500.
    why: LiteLLM raises a raw KeyError or IndexError there. The Rust decoder must return an error, and 500 is the status LiteLLM's generic exception mapping gives an unclassified exception (to be confirmed by the architect, see notes).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/nvidia_nim/rerank/transformation.py#L314-L326
out_of_scope:
  - B2324 owns is_nvidia_nim_deployment, nvidia_nim_model_groups, nvidia_nim_model_group_in_path and nvidia_nim_router_model_in_endpoint (passthrough L28-L62, betterlite-auth resource_hints).
  - B668, B503 and B504 own everything NvidiaNimConfig inherits from OpenAIGPTConfig (request and reply conversion, URL, headers, streaming). B2230 owns choosing NvidiaNimConfig for the nvidia_nim provider.
  - B1013 owns BaseRerankConfig and the rerank records. B3570 owns BasePassthroughConfig, format_url, strip_leading_model_segment, model_group_from and relayed_body. B2202 owns BaseLLMException.
  - 'The key and base defaults (chat and embedding base https://integrate.api.nvidia.com/v1 in get_llm_provider_logic.py L645, rerank base in rerank_api/main.py L334-L343), the lazy litellm.nvidiaNimConfig instances, get_supported_openai_params in litellm_core_utils (None for request types other than chat_completion and embeddings) and the utils.py L4839 and L3872 call sites are B211 (get_llm_provider defaults), B8310 (the rerank base and dispatch) and the get_optional_params owners; the lazy litellm.nvidiaNimConfig instances are Python module glue and are not built.'
  - B8310 owns dispatch wiring of all four families, the rerank credential step and the HTTP oracle cases; the OpenAI-client embedding call is B044's arm (main.py L6504-L6555). This task touches no dispatch.rs or operation.rs.
  - The proxy routes and the path-to-model-group lookup that call B2324's functions (auth_utils.py L2057, llm_passthrough_endpoints.py L2111) belong to B746 and B3628.
pitfalls:
  - max_completion_tokens is rewritten to max_tokens before the supported-list check, so it reaches nvidia/nemotron-4-340b-reward and the gemma models even though their lists do not include it.
  - gemma-2-9b-it appears twice in the first branch, with and without the google/ prefix, and the match is exact, so nvidia_nim/google/gemma-2-9b-it must have its nvidia_nim/ removed by the caller first.
  - In the embedding map an extra_body key inside non_default_params replaces the empty extra_body made at the start, and the kwargs merge then lands in that replacement.
  - validate_environment lowercases accept and content-type in the defaults, so a caller header Content-Type is added next to content-type and both are sent.
  - The retrieval URL tests /retrieval/ before it drops /v1, so a base like https://h/v1/retrieval/m/reranking is returned untouched, but https://h/v1/ becomes https://h/v1/retrieval/{model}/reranking.
  - The path keeps underscores (llama-3_2) while the body model has them turned into periods (llama-3.2), and this replace covers the whole model string, including any other underscore.
  - The selector tests the raw model for ranking/, so nvidia_nim/ranking/x selects the retrieval config, which then sends the body model ranking/x.
  - A response index below zero but within the passage count picks the passage from the end, as Python does. Image-only passages have no text, so they give no document.
  - The ranking config sorts only when there are more results than top_n, and a top_n of 0 in optional_params falls back to the kept value.
  - get_complete_url in the ranking config tests endswith /ranking, so a base already ending in /v1/ranking is used as is.
  - without_repeated_version_prefix drops the query from the base and compares only the last base segment with the first native segment, case-sensitive and only for v followed by digits.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
