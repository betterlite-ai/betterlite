id: B5837
title: NVIDIA NIM chat, embedding, rerank and passthrough transforms
description: >-
  Build the pure transforms of the nvidia_nim provider (litellm/llms/nvidia_nim). Four modules, one per family. B2324
  already built the four path-hint functions in nvidia_nim/passthrough/transformation.py L28-L62 (is_nvidia_nim_deployment,
  nvidia_nim_model_groups, nvidia_nim_model_group_in_path, nvidia_nim_router_model_in_endpoint) in betterlite-auth, so
  do not write them again. Nothing here reads an environment variable or a global setting. The caller passes every key
  and base as a plain argument. Dispatch wiring, the credential call sites in main.py and rerank_api/main.py, and the
  HTTP cases belong to B8310.

  Chat (crates/betterlite-openai/src/nvidia_nim_chat.rs, NvidiaNimConfig over B668's OpenAI base config). It overrides
  two methods and inherits the rest. get_supported_openai_params(model) matches the model string exactly, with no prefix
  stripping. The models google/recurrentgemma-2b, google/gemma-2-27b-it, google/gemma-2-9b-it and gemma-2-9b-it give
  stream, temperature, top_p, max_tokens, stop, seed. nvidia/nemotron-4-340b-instruct gives stream, temperature, top_p,
  max_tokens, max_completion_tokens. nvidia/nemotron-4-340b-reward gives only stream. google/codegemma-1.1-7b gives
  stream, temperature, top_p, frequency_penalty, presence_penalty, max_tokens, max_completion_tokens, stop. Every other
  model gives stream, temperature, top_p, frequency_penalty, presence_penalty, max_tokens, max_completion_tokens, stop,
  seed, tools, tool_choice, parallel_tool_calls, response_format, in that order. map_openai_params walks
  non_default_params in order. max_completion_tokens always writes optional_params["max_tokens"], whether or not the
  model lists it. Any other param in the supported list is copied, and anything else is silently dropped. drop_params
  is accepted and never read. The map the caller passed in is returned with the additions.

  Embedding (crates/betterlite-openai/src/nvidia_nim_embedding.rs, NvidiaNimEmbeddingConfig). get_supported_openai_params
  takes no model and returns encoding_format, user, dimensions. map_openai_params(non_default_params, optional_params,
  kwargs) first adds an empty extra_body when optional_params has none. Then for each non_default_params entry in order,
  input_type and truncate go into extra_body and every other key, including extra_body itself, is written to
  optional_params[key]. A non-None kwargs map is merged into whatever extra_body is by then, so it is present (maybe empty)
  after the call even when kwargs is empty. The constructor that copies its arguments onto the class and get_config have
  no caller at the pin, so they are not built.

  Rerank (crates/betterlite-provider/src/nvidia_nim_rerank.rs, over B1013's BaseRerankConfig and rerank records).
  Two configs and one selector. select_nvidia_nim_rerank_config(model) returns the ranking config when the model starts
  with ranking/ and the retrieval config otherwise (common_utils.py L5-L27). The retrieval config (NvidiaNimRerankConfig)
  has default base https://ai.api.nvidia.com. Its URL: trim trailing slashes from the base (default when None or empty);
  if the base contains /retrieval/ return it as is; otherwise drop a trailing /v1 and return
  {base}/v1/retrieval/{model without a leading nvidia_nim/}/reranking. Supported cohere params are query, documents,
  top_n. map_cohere_rerank_params starts from {query, documents}, adds top_k = top_n when top_n is not None, then
  overlays every entry of non_default_params, so those win. validate_environment: an absent key becomes the
  NVIDIA_NIM_API_KEY secret, then the global litellm api_key (both passed in as arguments), and still absent raises
  ValueError "Nvidia NIM API key is required. Please set 'NVIDIA_NIM_API_KEY' in your environment". Defaults are
  Authorization "Bearer {key}", accept application/json and content-type application/json, then the caller headers
  overlay all of them. transform_rerank_request needs query and documents (ValueErrors "query is required for Nvidia NIM
  rerank" and "documents is required for Nvidia NIM rerank"). The query becomes {text}. A string document becomes {text}.
  A map document keeps its text field, and its image field only on the ranking config (SUPPORTED_PASSAGE_FIELDS is text
  for retrieval, text and image for ranking). A map with neither field becomes {text: JSON of the map}, per
  docs/compatibility.md for the JSON text. Any other document becomes {text: its string form}. The body model is the
  model without a leading nvidia_nim/ and with every _ replaced by a period. top_k is added when present and not None.
  truncate is added only when it is NONE or END, and any other value is dropped without an error.

  transform_rerank_response parses the body as JSON; a body that is not JSON raises BaseLLMException (B2202) with the
  upstream status, the body text and the headers. Each ranking {index, logit} becomes {index, relevance_score: logit},
  and when the index is below the request's passage count and that passage has text, the result gets document {text}.
  The id is the body id or a new UUID4. meta.billed_units.total_tokens is usage.total_tokens when above 0, else the
  number of results. decode_nvidia_nim_rerank_reply(bytes) is the typed decoder for this body and gets a fuzz target.
  get_error_class builds a BaseLLMException from message, status and headers.

  The ranking config (NvidiaNimRankingConfig, ranking_transformation.py) is for models like ranking/nvidia/...
  and talks to {base}/v1/ranking. Its URL: default base as above, return the base when it ends with /ranking, else drop a
  trailing /v1 and append /v1/ranking. Its clean model name removes a leading nvidia_nim/ and then a leading ranking/.
  The endpoint rejects top_k, so top_n stays in the mapped params (top_n is not mapped to top_k, and any top_k from
  non_default_params is removed). transform_rerank_request checks top_n: an int below 1 raises ValueError "top_n must be
  a positive integer, got: {top_n}", and a valid one is kept on the config instance. Then top_n and top_k are removed
  from the params and the retrieval request transform runs on the clean model. transform_rerank_response runs the
  retrieval conversion, picks top_n as optional_params.top_n when truthy else the kept value, and only when there are
  more results than top_n sorts them by relevance_score descending (stable, ties keep their order) and keeps the first
  top_n. With fewer or equal results the order is untouched. In Rust the kept top_n lives in the config value, which the
  caller makes fresh for each request as LiteLLM does.

  Passthrough (crates/betterlite-openai/src/nvidia_nim_passthrough.rs, NvidiaNimPassthroughConfig over B3570's
  BasePassthroughConfig and format_url). is_streaming_request is bool(request_data.stream), default false.
  get_complete_url: base is api_base or the NVIDIA_NIM_API_BASE secret (passed in); none raises ValueError "NVIDIA NIM api
  base not found: set `api_base` on the deployment or NVIDIA_NIM_API_BASE". The native endpoint is the endpoint after
  B3570's strip_leading_model_segment with the model and the model_group from litellm_params. The root is
  without_repeated_version_prefix(base, native_endpoint): split the base path into non-empty segments; if the first
  segment of the native endpoint (leading slashes removed) is v followed by digits and equals the last base segment,
  drop that last base segment; rebuild the base with that path and no query, trailing slashes removed. The result is
  (format_url(native_endpoint, root, request_query_params), root). validate_environment returns the headers unchanged
  when api_key is None, else the headers plus Authorization "Bearer {key}" (overwrites). get_api_key and get_api_base
  return the argument or the secret passed in. get_base_model returns the model, get_models returns an empty list.
  logging_non_streaming_response returns relayed_body(response) (B3570) as the logged response object.

  The LiteLLM code owned here is about 560 nonblank non-comment lines (chat 70, embedding 45, rerank 270, ranking 110,
  selector 10, passthrough 60). Plan 330 production, 260 tests, 150 adapters, 60 fuzz and 20 wiring lines. No split.
