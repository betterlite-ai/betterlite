dod:
  - text: Chat supported params differ by model as listed, and map_openai_params rewrites max_completion_tokens and drops unsupported params.
    proof: [nim-chat-tests, oracle]
  - text: Embedding params fold input_type, truncate, a passed extra_body and the leftover kwargs into extra_body.
    proof: [nim-embedding-tests, oracle]
  - text: Retrieval rerank URL, params, headers, passages and response conversion match LiteLLM, including the missing-key error and the negative-index document lookup.
    proof: [nim-rerank-tests, oracle]
  - text: The ranking config builds /v1/ranking, keeps top_n out of the body and applies it to the response with the sort rule.
    proof: [nim-rerank-tests, oracle]
  - text: A rerank reply that is not valid JSON or lacks index or logit fails without panicking and the decoder corpus replays.
    proof: [nim-rerank-corpus]
  - text: Passthrough URL, repeated version removal, credentials and logged body match LiteLLM.
    proof: [nim-passthrough-tests, oracle]
checks:
  optional: [mutants]
  commands:
    - id: nim-chat-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^nvidia_nim_chat::/)'
      why: A generic OpenAI config would keep tools and seed for the models that reject them and would not rewrite max_completion_tokens.
    - id: nim-embedding-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^nvidia_nim_embedding::/)'
      why: Without this module input_type and truncate would be sent as top-level fields instead of extra_body.
    - id: nim-rerank-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^nvidia_nim_rerank::/) - test(/replays_the_/)'
      why: The two rerank configs differ in URL, passage fields, model name and top_n handling, and a Cohere-shaped body is rejected by NIM.
    - id: nim-rerank-corpus
      run: test -f crates/betterlite-provider/fuzz/fuzz_targets/nvidia_nim_rerank_reply.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/nvidia_nim_rerank_reply)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_nvidia_nim_rerank_reply_corpus)'
      why: The reply body comes from the network and needs a fuzz target with a replayed corpus.
    - id: nim-passthrough-tests
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^nvidia_nim_passthrough::/)'
      why: Without it a base ending in /v1 and a native path starting with /v1 produce /v1/v1.
