id: B588
title: Anthropic native file lifecycle
description: >-
  Add AnthropicFileObject mapping and native upload/retrieve/list/delete/content methods over shared file records.
  Preserve created_at parsing, size_bytes and purpose semantics and omission of downloadable/MIME metadata, file
  API beta headers and id-encoded paths.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/files/transformation.py:
  AnthropicFilesConfig.__init__ L56-L57; AnthropicFilesConfig.custom_llm_provider L60-L61; AnthropicFilesConfig.get_complete_url
  L63-L73; AnthropicFilesConfig.get_error_class L75-L85; AnthropicFilesConfig.validate_environment L87-L111; AnthropicFilesConfig.get_supported_openai_params
  L113-L114; AnthropicFilesConfig.map_openai_params L116-L123; AnthropicFilesConfig.transform_create_file_request
  L125-L153; AnthropicFilesConfig.transform_create_file_response L155-L176; AnthropicFilesConfig.transform_retrieve_file_request
  L178-L186; AnthropicFilesConfig.transform_retrieve_file_response L188-L195; AnthropicFilesConfig.transform_delete_file_request
  L197-L205; AnthropicFilesConfig.transform_delete_file_response L207-L219; AnthropicFilesConfig.transform_list_files_request
  L221-L232; AnthropicFilesConfig.transform_list_files_response L234-L251; AnthropicFilesConfig.transform_file_content_request
  L253-L264; AnthropicFilesConfig.transform_file_content_response L266-L272; AnthropicFilesConfig._parse_anthropic_file
  L275-L302.


  Named case contracts: file_upload_multipart: Only file=None raises ValueError File data is required. B235 extract_file_data
  supplies content/filename/type; falsey filename -> file_<inttime>, content_type defaults application/octet-stream
  onlywhen keymissing (None staysNone). Multipart file tuple=(filename,content,type),purpose tuple=(None, create_file_data.get(purpose,messages));
  explicitNone purpose retained. Supported params onlypurpose but mapper returns supplied optional_params unchanged.
  native_file_object: id/filename defaultempty, bytes uses size_bytes by keypresence then bytes then0, object=file,purpose
  defaultmessages,status=uploaded,status_details=None. Ignore downloadable,mime_type and original type. Create/retrieve
  use same projection without status/error-body checks. created_at_timezone: Truthy created_at replaces Z with +00:00
  then takes first19characters, parses %Y-%m-%dT%H:%M:%S and treats them as UTC with calendar.timegm: explicit offset/fraction
  discarded. Missing/falsey value or ValueError/TypeError -> injectedcurrenttime; unrelated AttributeError is not
  caught. file_list_pagination: List request sends only truthy purpose; ignores optional pagination keys. Response
  returns projection of data default[], discarding has_more/first_id/last_id; no automatic next-page request. file_delete_shape:
  Delete/retrieve routes resolve only params.api_base via B567, rstrip then /v1/files/<B171 encoded file_id>, return
  {}body/query. Delete response reads id defaultempty and always deleted=true,object=file regardless of upstream
  deleted field. file_content_bytes: Encode file_id first; exact case-sensitive original msgbatch_ prefix chooses
  /v1/messages/batches/<id>/results, otherwise /v1/files/<id>/content. Return raw binary response wrapper with original
  status/headers/content; no JSON decoding or request-URL fetch. file_beta_header: Base defaults https://api.anthropic.com
  via B567; always append /v1/files, even when base already contains it. Validator fills base from dictparams onlywhen
  argNone, uses B567 auth defaultcustom-bearerfalse, missingauth ValueError Anthropic API key is required. Set ANTHROPIC_API_KEY
  or ANTHROPIC_AUTH_TOKEN environment variable or pass api_key parameter. Auth plus anthropic-version2023-06-01
  and anthropic-beta files-api-2025-04-14 overwrite matching caller keys; no content-type added. get_error_class
  forwards status/message/headers to B567 without normalizing dict headers.


  Write standalone Rust test files_credential_identity_isolation in betterlite-anthropic: Distinct configured identities
  cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle case.


  Write standalone Rust test files_secret_safe_failure in betterlite-anthropic: Debug and owned failure paths do
  not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-anthropic/src/files.rs with adjacent tests under files/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation anthropic_files in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function files_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  file_upload_multipart, native_file_object, created_at_timezone, file_list_pagination, file_delete_shape, file_content_bytes,
  file_beta_header. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_files* using HelperCase: kind: helper
  and the externally tagged anthropic_files variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_files that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_anthropic_file consumes file metadata JSON response bytes in crates/betterlite-anthropic/src/files.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_files.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_files.
  The adjacent test replays_the_anthropic_files_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 222 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 225 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
