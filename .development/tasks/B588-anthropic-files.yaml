    AnthropicFilesConfig.transform_delete_file_request, AnthropicFilesConfig.transform_delete_file_response, AnthropicFilesConfig.transform_list_files_request,
    AnthropicFilesConfig.transform_list_files_response, AnthropicFilesConfig.transform_file_content_request, AnthropicFilesConfig.transform_file_content_response,
    AnthropicFilesConfig._parse_anthropic_file. Other functions in this file remain with the owners listed below.
