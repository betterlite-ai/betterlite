checks:
  optional:
  - mutants
  commands:
  - id: case-file-upload-multipart
    why: Only file=None raises ValueError File data is required. B235 extract_file_data supplies content/filename/type;
      falsey filename -> file_<inttime>, content_type defaults application/octet-stream onlywhen keymissing (None
      staysNone). Multipart file tuple=(filename,content,type),purpose tuple=(None, create_file_data.get(purpose,messages));
      explicitNone purpose retained. Supported params onlypurpose but mapper returns supplied optional_params unchanged.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_file_upload_multipart$/)'
  - id: case-native-file-object
    why: id/filename defaultempty, bytes uses size_bytes by keypresence then bytes then0, object=file,purpose defaultmessages,status=uploaded,status_details=None.
      Ignore downloadable,mime_type and original type. Create/retrieve use same projection without status/error-body
      checks.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_native_file_object$/)'
  - id: case-created-at-timezone
    why: 'Truthy created_at replaces Z with +00:00 then takes first19characters, parses %Y-%m-%dT%H:%M:%S and treats
      them as UTC with calendar.timegm: explicit offset/fraction discarded. Missing/falsey value or ValueError/TypeError
      -> injectedcurrenttime; unrelated AttributeError is not caught.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_created_at_timezone$/)'
  - id: case-file-list-pagination
    why: List request sends only truthy purpose; ignores optional pagination keys. Response returns projection of
      data default[], discarding has_more/first_id/last_id; no automatic next-page request.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_file_list_pagination$/)'
  - id: case-file-delete-shape
    why: Delete/retrieve routes resolve only params.api_base via B567, rstrip then /v1/files/<B171 encoded file_id>,
      return {}body/query. Delete response reads id defaultempty and always deleted=true,object=file regardless
      of upstream deleted field.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_file_delete_shape$/)'
  - id: case-file-content-bytes
    why: Encode file_id first; exact case-sensitive original msgbatch_ prefix chooses /v1/messages/batches/<id>/results,
      otherwise /v1/files/<id>/content. Return raw binary response wrapper with original status/headers/content;
      no JSON decoding or request-URL fetch.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_file_content_bytes$/)'
  - id: case-file-beta-header
    why: Base defaults https://api.anthropic.com via B567; always append /v1/files, even when base already contains
      it. Validator fills base from dictparams onlywhen argNone, uses B567 auth defaultcustom-bearerfalse, missingauth
      ValueError Anthropic API key is required. Set ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN environment variable
      or pass api_key parameter. Auth plus anthropic-version2023-06-01 and anthropic-beta files-api-2025-04-14 overwrite
      matching caller keys; no content-type added. get_error_class forwards status/message/headers to B567 without
      normalizing dict headers.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_cases::case_[0-9]+_file_beta_header$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_files.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_files*")"
      && grep -lq 'anthropic_files' tools/oracle/fuzz/corpus/helper_case/anthropic_files* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_files$/)' && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-anthropic/fuzz/corpus/anthropic_files)"
      && grep -q 'decode_anthropic_file' crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_files.rs && cargo
      nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::replays_the_anthropic_files_corpus$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::files_secret_safe_failure$/)'
