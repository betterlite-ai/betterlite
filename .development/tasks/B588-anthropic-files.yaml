- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- File timestamps discard offset and fractional seconds before treating the remaining wall time as UTC.
- List pagination metadata is discarded, and msgbatch_ file ids route to batch results.
