id: B5102
title: Error classes answer the provider's status when LiteLLM passes its response
description: >-
  LiteLLM's response classes answer the status of the response they are given. BadRequestError sets status_code 400,
  keeps the passed response when it is an httpx.Response with a _request, falls back to _get_minimal_error_response
  (a 400) otherwise, and hands that response to openai.BadRequestError
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L119-L251).
  openai.APIStatusError.__init__ then sets status_code from response.status_code, so the passed status wins
  (https://github.com/openai/openai-python/blob/v2.54.0/src/openai/_exceptions.py#L93-L104). AuthenticationError and
  NotFoundError keep any passed response and build a 401 or 404 one only when none is passed (same lines).
  ContextWindowExceededError, ContentPolicyViolationError and ImageFetchError hand their response to BadRequestError
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L535-L554,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L619-L645,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L270-L290).
  PermissionDeniedError and UnprocessableEntityError require a response
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L403-L423,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L317-L338).
  The other classes keep a fixed status. RateLimitError, ServiceUnavailableError, BadGatewayError and
  InternalServerError build their own 429, 503, 502 and 500 response
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L442-L790).
  Timeout answers exception_status_code or 408, APIError the status it is given, and InvalidRequestError builds its
  own 400 response
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L1028-L1041).
  So this task changes seven ErrorClass variants: Authentication, NotFound, PermissionDenied, BadRequest,
  UnprocessableEntity, ContextWindowExceeded and ContentPolicyViolation.


  On the real path the original exception always carries a response. BaseLLMException builds
  httpx.Response(status_code=status_code, request=self.request) when none is given
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/chat/transformation.py#L41-L64),
  and openai SDK errors carry the HTTP response. The chat route hands the mapped exception to
  _handle_llm_api_exception
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12096-L12100).
  That handler answers the exception's status_code when it is an int from 400 to 599
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L3740-L3774).
  So an upstream 422 mapped to BadRequestError reaches the client as 422, and context window text on an upstream 500
  stays 500. The same handler takes error.type from openai_error_type. It falls back to the status when the exception
  carries no type: 401 authentication_error, 403 permission_error, 429 rate_limit_error, any other 4xx
  invalid_request_error
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/openai_error_payload.py#L16-L50).
  The seven classes carry type None unless a body sets one, so their client type follows the status too. betterlite
  derives that type in the gateway, so ErrorClass::metadata keeps error_type as it is, and only status_code and code
  change here.


  betterlite answers one fixed status per class today. ErrorClass::metadata in crates/betterlite-error/src/error.rs
  answers 401, 404, 403, 400, 422, 400 and 400 for the seven variants whatever the provider sent. The mappers
  betterlite ported from exception_mapping_utils.py raise these classes 109 times: 84 raises pass
  original_exception.response, 7 pass an explicit httpx.Response or _response_or_stub, and 18 pass nothing. A raise
  that passes nothing keeps the class default in LiteLLM too.


  Branch by branch. _map_openai_exception passes its response on the context window, model_not_found, content
  policy, 400, 401, 404 and 422 branches
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L275-L463).
  _map_replicate_exception passes it on every branch of these classes, so replicate 413 answers 413 and 422 answers
  UnprocessableEntityError with 422
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L640-L698).
  _map_bedrock_exception passes it on every branch of these classes, the AccessDeniedException
  PermissionDeniedError included
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L872-L1008),
  and so does _map_sagemaker_exception
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1036-L1116).
  _map_azure_exception and _map_openrouter_exception pass it on every branch of these classes
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1926-L2190),
  and so does Azure's content policy raise
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/exception_mapping.py#L37-L42).
  _map_cloudflare_exception, _map_cohere_exception, _map_huggingface_exception and _map_ai21_exception pass
  getattr(original_exception, "response", None) on all of theirs
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1366-L1607).
  _map_nlp_cloud_exception, _map_together_ai_exception and _map_aleph_alpha_exception do the same, except
  aleph_alpha's 401 AuthenticationError
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1625-L1857).
  _map_ollama_exception passes it on both BadRequestError branches. A dict cause has no response, and a text cause
  from an OllamaError has one
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1863-L1897).
  _map_openai_like_exception passes it on the "authorization denied for" and context window branches and a stub on
  403. Its 400, 401, 404 and 422 or 424 branches pass nothing
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L742-L830).
  _map_anthropic_exception passes a response only on 403, where the status is 403 anyway, so anthropic keeps every
  default
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L537-L598).


  _map_vertex_exception passes explicit responses, and only one differs from its class. The "403" rule raises
  BadRequestError with httpx.Response(status_code=403)
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1195-L1212).
  B5099 left that rule to this task, and case::forbidden_string in crates/betterlite-error/src/vertex_errors/tests.rs
  asserts 400 today. _map_exception_by_status passes the original response on 401, on 404 and on the BadRequestError
  for any other 4xx, and _response_or_stub on 403
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2236-L2345).
  exception_type's catchall calls it with the original exception, so an unmapped provider's 409 answers 409
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2670-L2683).
  For litellm_proxy, extract_and_raise_litellm_exception re-raises the class named in the text and passes
  response=_litellm_proxy_response(...) when the constructor takes it
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L213-L272,
  called at
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L2459-L2468).
  BadRequestError, ImageFetchError and every other response class it names follow it. InvalidRequestError takes no
  response and stays 400.


  The type. In crates/betterlite-error/src/error/details.rs, next to TimeoutStatus, add ResponseStatus<const DEFAULT:
  u16>(pub u16), serde transparent, whose Default is DEFAULT. Add ResponseDetails<const DEFAULT: u16> with
  #[serde(flatten)] context: ErrorContext and #[serde(default)] status: ResponseStatus<DEFAULT>. The seven variants
  hold Box<ResponseDetails<401>> (Authentication), <404> (NotFound), <403> (PermissionDenied), <400> (BadRequest,
  ContextWindowExceeded, ContentPolicyViolation) and <422> (UnprocessableEntity). ErrorClass::metadata answers
  details.status.0 as status_code, and code follows it. The wire JSON stays flat with one more key, "status", and
  JSON without it decodes to the class default. This keeps ErrorContext and its struct literals as they are, keeps
  each default in the type instead of at the call site, and needs no Option, since every branch knows its status.
  Five named status newtypes would do the same with five types, and a status on ErrorContext would touch every other
  family.


  Where the status comes from. A mapper whose typed input has status_code (openai, replicate, bedrock, sagemaker,
  azure, openrouter, nlp_cloud, together_ai, aleph_alpha) answers that status on a branch that passes the response,
  and the class default when status_code is None. map_cloudflare_exception gains a status_code: Option<u16>
  argument. OllamaOriginalException::Text gains #[serde(default)] status_code: Option<u16>, and Dict keeps the
  default. The mappers that read ProviderErrorFacts (cohere, huggingface, ai21, openai_like and status.rs) answer
  facts.response's status when that response has a request, and the default otherwise, the way BadRequestError drops
  a response without _request. PermissionDenied on 403 keeps response_or_stub. anthropic, aleph_alpha's 401 and
  every branch that passes nothing build ResponseStatus::default(). vertex's "403" rule answers 403. In dispatch.rs,
  catchall gives its facts the stub response response_or_stub builds (POST https://docs.litellm.ai/docs) whenever
  raw.status_code is set. dispatch/litellm_proxy.rs passes raw.status_code to every response class but
  InvalidRequestError. dispatch's caller reads the status from ErrorMetadata.status_code, and B5095 (planned) needs
  exactly that when it moves chat.rs and embeddings.rs onto dispatch. crates/betterlite-azure/src/azure_content_policy.rs
  builds ContentPolicyViolation on its own path and only changes its constructor; it keeps the default 400.


  The oracle helpers hide the gap today. provider_error.py and azure_openrouter_errors.py compare status_code but give
  the fake exception no response, so BadRequestError falls back to 400. aws_errors.py always attaches
  httpx.Response(status_code or 500), and anthropic_replicate_errors.py attaches one when a status is given, but
  neither reports the status. vertex_errors.py, openai_like_errors.py, native_errors_a.py and native_errors_b.py
  neither attach nor report it. Every one of the eight adapters attaches httpx.Response(status_code,
  request=httpx.Request("POST", "https://docs.litellm.ai/docs")) exactly when the case gives a status, the way
  BaseLLMException builds one. The six adapters that answer {"family", **context} add "status" with the raised
  exception's status_code for the seven families; the Rust side gets that key from serde on its own.
  native_errors_a.py's CloudflareInput and native_errors_b.py's OllamaTextException gain status_code:
  NotRequired[int | None], and an ollama text with a status becomes a _ProviderCauseError carrying a response. In
  tools/oracle/src/helpers/error, native_errors_a.rs (CloudflareInput, cohere, huggingface, ai21) and
  openai_like_errors.rs build that stub response from status_code instead of response: None. Keep each adapter's
  style. These helpers belong to B185 and B237 to B245, all done, so this task scopes them the way B5092 did.


  Cases. New cases, each failing on main: openai-errors/unprocessable-status.yaml (raw, openai, gpt-4, error_str "an
  unmatched failure", status_code 422: BadRequestError 422), openai-errors/context-on-server-status.yaml (raw,
  openai, "This model's maximum context length is 4096 tokens", 500: ContextWindowExceededError 500),
  openai-errors/catchall-status.yaml (raw, triton, "an unmatched failure", 409: BadRequestError 409),
  openai-errors/proxy-unprocessable.yaml (raw, litellm_proxy, "litellm.BadRequestError: bad input", 422:
  BadRequestError 422), azure-openrouter-errors/azure-context-on-server-status.yaml (azure, exception_provider Azure,
  "This model's maximum context length is 4096 tokens", 500), azure-openrouter-errors/openrouter-unprocessable.yaml
  (openrouter, exception_provider OpenRouterException, "an unmatched failure", 422, not synthesized),
  anthropic-replicate-errors/replicate-context-on-server-status.yaml (replicate, exception_type APIError, "input is
  too long", 500), aws-errors/bedrock-access-denied-status.yaml (bedrock, "AccessDeniedException: no permission",
  400: PermissionDeniedError 400), native-errors-a/cohere-498-status.yaml (cohere, exception_type "", "unrecognized
  failure", 498), native-errors-a/cloudflare-auth-status.yaml (cloudflare, "Authentication error: invalid token",
  403), native-errors-b/nlp-cloud-406-status.yaml and native-errors-b/nlp-cloud-403-status.yaml (nlp_cloud,
  error_str and message "boom"), native-errors-b/ollama-text-status.yaml (text "no such file or directory",
  status_code 500) and openai-like-errors/context-on-server-status.yaml (my_provider, "this model's maximum context
  length is 4096 tokens", 500). Existing cases that flip: anthropic-replicate-errors/branch-686.yaml (413),
  aws-errors/branch-1001.yaml and branch-1109.yaml (422), vertex-errors/branch-1199.yaml (403),
  native-errors-a/branch-1601.yaml (ai21 422), native-errors-b/branch-1776.yaml (together_ai 422) and
  openai-like-errors/auth.yaml (403). aws-errors/branch-936.yaml sends AccessDeniedException with status_code null,
  and PermissionDeniedError cannot build without a response, so the case sends status_code 403. A new case copies
  its folder's model names and compare block.
