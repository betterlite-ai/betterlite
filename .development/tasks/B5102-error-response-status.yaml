deviations:
- link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/chat/transformation.py#L41-L64
  what: >-
    A mapper with a typed status_code input (openai, replicate, bedrock, sagemaker, azure, openrouter, cloudflare,
    nlp_cloud, together_ai, aleph_alpha, ollama, the litellm_proxy branch and the catchall) answers that status on a
    branch that passes a response, though the input carries no response object. LiteLLM answers it only when the
    exception has a response with a request. Without one, BadRequestError and its subclasses answer 400,
    AuthenticationError and NotFoundError answer 401 and 404, and PermissionDeniedError and UnprocessableEntityError
    fail to build. A facts mapper given a response without a request answers the class default, where LiteLLM's
    AuthenticationError and NotFoundError fail on response.request.
  why: >-
    On the real path every original exception carries a response with a request and its own status, since
    BaseLLMException builds one and openai SDK errors carry theirs. So a status without a response, or a response
    without a request, never reaches a mapper there, and the status betterlite answers is the one LiteLLM answers on
    that path.
out_of_scope:
- crates/betterlite-openai/src/chat/provider_error.rs and the client error type derived from the status; the gateway keeps its own classify until B5095 (planned) moves chat.rs and embeddings.rs onto dispatch.
- azure_content_policy.rs's own guardrail path; it keeps the default 400 and changes only its constructor.
- The response model in parse.rs, the facts helper's status operation and error_facts.py.
- The BadRequestError branch for the openai SDK's missing param bug (exception_mapping_utils.py L2660-L2668); dispatch does not port it.
- UnsupportedParamsError, InvalidRequestError, RateLimitError, Timeout, InternalServerError, ServiceUnavailableError, BadGatewayError and APIError, whose status LiteLLM already fixes or carries.
- TimeoutStatus and MidStreamStatus; they stay as they are.
- The error class helper (class.rs, error_class.py); its cases send no status and keep the default.
pitfalls:
- azure.rs has 254 lines and dispatch.rs 268 against the 300 line limit for source files, so new code there goes into a child module.
- anthropic's 403 branch reads original_exception.response directly, so anthropic_replicate_errors.py must attach a response whenever a case gives a status.
- The websearch tests, the anthropic messages_errors tests, tools/oracle/src/helpers/oracle/b4113.rs and the error class helper decode ErrorClass from JSON without "status", so the serde default must stay.
- serde does not support deny_unknown_fields together with flatten, so neither ErrorContext nor ResponseDetails gains it.
- Rust serializes "status" for the seven families as soon as the variants change, so every case in the six class JSON folders fails until its adapter adds the key.
- PermissionDeniedError and UnprocessableEntityError need a response, so a litellm_proxy case that names them without a status crashes in Python; add none.
- extract_and_raise_litellm_exception filters its kwargs by the constructor, so litellm.InvalidRequestError stays 400 with any status.
- openai_like's 422 and 424 branch passes no response and answers 400 while its text branches answer the status.
- openrouter skips its status branches when status_code_is_synthesized is true, so openrouter-fallback.yaml keeps its class and status.
- vertex's "403" rule builds its own response, so branch-1199.yaml answers 403 with status_code null.
- A missing status takes ResponseStatus's Default; no call site writes a literal 400 or 401 as a fallback.
