checks:
  optional: [mutants]
  commands:
  - id: status-type
    why: the seven classes still answer a fixed status, or JSON without a status no longer decodes
    run: >-
      list=$(cargo nextest list --locked -p betterlite-error -E 'test(/^error::tests::/)' --message-format oneline) &&
      for name in metadata_answers_the_carried_response_status response_class_wire_input_without_a_status_keeps_the_class_default; do grep -qE " error::tests::$name(::case_|$)" <<< "$list" || { echo "missing test $name"; exit 1; }; done &&
      cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/^error::tests::/)'
  - id: mapper-tests
    why: a mapper branch that passes a response still answers the class default, or a branch without one stopped answering it
    run: >-
      list=$(cargo nextest list --locked -p betterlite-error --message-format oneline) &&
