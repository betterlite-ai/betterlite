pitfalls:
- There is no stream field or fake_stream execution path in image_edit at this pin.
- Within image_edit\'s custom_llm_provider in litellm._custom_providers branch, preserve raise LiteLLMUnknownProvider(model=model,
  custom_llm_provider=custom_llm_provider) and its nested guards.
