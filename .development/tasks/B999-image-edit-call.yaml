id: B999
title: Image edit call
description: >-
  Execute image edits with repeated image parts, optional mask and source edit parameter mapping through prepared
  provider operations. Preserve async multipart finalization and the nonstreaming ImageResponse; the pinned image_edit
  does not pass fake_stream.


  Here compare the ordered typed multipart parts captured at the native provider seam; B082 compares the serialized
  upstream multipart with B900 decoded parts, where the real HTTP route exists. Custom providers use B045; bedrock
  image edits use B638, stability B046 and black_forest_labs B046 prepared contracts; do not build these algorithms
  here. The runnable provider fixture is OpenAI B512.


  Implement crates/betterlite-core/src/api/image_edit_call.rs. Use ImageEditCallInput and ImageEditCallResult with
  typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions single_image_edit, multi_image_edit, mask_and_prompt, edit_provider_json_mode
  under api::image_edit_call::tests. Each named function drives production code and asserts its case result; use
  named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ImageEditCall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {image_edit_call: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/images/main.py: _get_ImageEditRequestUtils (L67-L75); litellm/images/main.py: image_edit
  (L712-L960); litellm/images/main.py: aimage_edit (L964-L1043); litellm/images/main.py: __getattr__ (L1046-L1056).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 291 owned nonblank/non-comment/non-docstring Python lines (304 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 311 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 543 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B171 (Direct helper oracle and URL path encoding),
  B997 (Image contracts), B1087 (Api boundaries), B512 (OpenAI image edit multipart mapping). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
