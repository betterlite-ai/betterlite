checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_edit_call::/) - test(/::replays_corpus$/)'
  - id: case-single-image-edit
    why: the single-image-edit behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_edit_call::tests::single_image_edit($|::)/)'
  - id: case-multi-image-edit
    why: the multi-image-edit behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_edit_call::tests::multi_image_edit($|::)/)'
  - id: case-mask-and-prompt
    why: the mask-and-prompt behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_edit_call::tests::mask_and_prompt($|::)/)'
  - id: case-edit-provider-json-mode
    why: the edit-provider-json-mode behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::image_edit_call::tests::edit_provider_json_mode($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/image_edit_call.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/image_edit_call-*)"
      && grep -qE "^[[:space:]]+image_edit_call:" tools/oracle/fuzz/corpus/helper_case/image_edit_call-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/image-edit-call)"
