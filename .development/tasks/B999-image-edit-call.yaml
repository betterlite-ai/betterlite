id: B999
title: Image edit SDK calls
description: >-
  Build image_edit and aimage_edit whole in betterlite-core::api::image_edit_call, plus native equivalents of
  _get_ImageEditRequestUtils and __getattr__ as typed linkage rather than runtime imports. A missing sync model
  uses dall-e-2; image=None becomes [], a single image becomes [image], and a list preserves its order. Named
  prompt,mask,n,quality,response_format,size,user,extra_headers,extra_query,extra_body,timeout default None.
  Merge dictionary kwargs.headers followed by dictionary extra_headers. _is_async is true only for the boolean
  async_call=true removed from kwargs, not any truthy value. GenericLiteLLMParams captures the remaining controls.

  Custom providers bypass config lookup and option projection, receive image as a list and optional_params=kwargs,
  and choose the last matching handler from B044. Otherwise resolve with B174 and select a config with B157, merge kwargs over
  locals and call B1120 with provider-supported extensions intersected with filtered non-default params. B176
  owns flatten_form_field_values: multipart OpenAI/Azure/compatible calls merge flattened nondefault fields then
  extra_body over mapped options. JSON providers do not take that path. Log a copy of the mapped options before
  Bedrock/Stability/BFL merge their nondefault options. B2451 owns generic edit sending. B638's Bedrock and
  B046's Stability/BFL adapters are downstream of B082; inject B010 prepared operations for those send paths.

  Bedrock receives timeout unchanged, including None/0; generic/Stability/BFL use timeout or REQUEST_TIMEOUT,
  whose default is 6000. extra_query is accepted and never forwarded. Async resolution looks for base_url in
  locals, where no such named argument exists; do not add api_base-based resolution. It forces async_call=true,
  preserves context, invokes sync preparation once and awaits a coroutine result only when returned. B011 maps
  failures with the source model/provider and locals. B159 owns public Python import behavior.

  Exercise the SDK through B2401 HTTP, using B512 for OpenAI and injected configured operations for downstream
  adapters. No route is added and no raw image decoder is duplicated. Test REQUEST_TIMEOUT in the production
  config loader. Ownership is 305 nonblank/non-comment lines, including lazy accessors; budget 270 implementation,
  160 tests, 125 fixtures, 80 adapters, 45 config/corpus and 40 wiring lines, 720 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/image_edit_call.rs
  - crates/betterlite-core/src/api/image_edit_call/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/image-edit-call-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/image_edit_call.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/image_edit_call.py
  - tools/oracle/cases/sdk-http/image-edit-call/**
  - tools/oracle/fuzz/corpus/sdk_http_case/image-edit-call-*
  - crates/betterlite-config/src/sections/image_edit_call.rs
  - crates/betterlite-config/src/sections/image_edit_call/**
  - tools/oracle/helpers/b999.py
  - tools/oracle/helpers/b999/**
  - tools/oracle/src/helpers/core_ops/b999.rs
  - tools/oracle/src/helpers/core_ops/b999/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L711-L1056
  why: Full sync/async edit entry points, including option merge order, dispatch and lazy public attribute lookup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L67-L75
  why: The edit helper accessor caches one utility class and introduces no provider behavior.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L574-L577
  why: REQUEST_TIMEOUT supplies the generic edit timeout fallback.
dod:
- text: >-
    edit_openai_upload sends model=openai/gpt-image-1,images=[a.png:abc,b.png:def],mask=m.png:ghi,prompt=change,
    n=1,quality=high,size=1024x1024,response_format=b64_json,user=u. Expect ordered image[] uploads, the first
    mask, those supported fields and one POST /v1/images/edits. Mock {created:1,data:[{b64_json:YQ==}]} is returned
    unchanged. A single image is normalized to a one-element list. model absent resolves dall-e-2; image absent
    passes [] to the config rather than a new SDK-level required-image error.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    edit_option_merge sends headers={x:old},extra_headers={x:new},extra_body={settings:{strength:2},tags:[a,b]},
    nondefault settings.strength=1 and extra_query={ignored:yes}. The provider receives x=new; multipart contains
    settings[strength]=2 and both tags parts, while the URL has no ignored parameter. A JSON config receives
    only its mapped options and the unchanged extra_body argument to B2451, which does not merge it. No stream
    or fake_stream execution is introduced. B1120's unsupported field/drop tests supply the same call controls.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    edit_dispatch_and_timeout sets REQUEST_TIMEOUT=7: generic/Stability/BFL timeout=None or 0 uses 7, explicit
    3 uses 3; Bedrock keeps None,0,3. With the env unset the generic fallback is 6000. Missing config raises
    ValueError("image edit is not supported for <provider>") before HTTP. Injected Bedrock/BFL model=None raises
    "Model needs to be set for bedrock"/"Model needs to be set for black_forest_labs". The normal default-model
    path never fabricates these impossible resolver outputs. Logging occurs before branch-specific option merges.
  proof: [behavior-tests, config-tests, oracle, sdk-python]
- text: >-
    edit_custom_and_async uses two custom map entries and expects the last, with kwargs-only options and list
    images. async_call=1 is false under the identity test; async wrapper always sets true. Matching client kind
    survives and the wrong kind becomes None. Missing registered handler raises LiteLLMUnknownProvider. The
    async OpenAI call makes one real HTTP request, awaits one coroutine, preserves context and returns the mock
    ImageResponse. A mock 400 error keeps B011 SDK failure class/status/nullable fields with no proxy code coercion.
  proof: [behavior-tests, oracle, sdk-python]
- text: New request-timeout config and edit SDK seeds parse through their existing decoders and the adapter passes strict checks.
  proof: [corpora, sdk-python, new-cases, oracle]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Edit option ordering and async dispatch must run in production core and config tests.
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api|sections)::image_edit_call::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: REQUEST_TIMEOUT must be loaded, defaulted and used by edit execution.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::image_edit_call::tests::loads_settings($|::)/)'
  - id: sdk-python
    why: Edit parity requires a real SDK HTTP adapter.
    run: test -f tools/oracle/sdk_http/image_edit_call.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpora
    why: The edit SDK tag and timeout settings need newly added parser inputs.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/image-edit-call-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/image-edit-call-*)" && cargo nextest run --locked -p betterlite-oracle -p betterlite-config --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/) | test(replays_the_config_yaml_corpus)'
  - id: new-cases
    why: Ordered image parts must be captured from HTTP, not a helper's prepared record.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/image-edit-call)"
oracle_cases:
- tools/oracle/cases/sdk-http/image-edit-call/edit-openai-upload.yaml
- tools/oracle/cases/sdk-http/image-edit-call/edit-option-merge.yaml
- tools/oracle/cases/sdk-http/image-edit-call/edit-dispatch-and-timeout.yaml
- tools/oracle/cases/sdk-http/image-edit-call/edit-custom-and-async.yaml
deviations: []
out_of_scope:
- B998 owns image_generation/overloads; B1121 owns aimage_generation; B1000 owns image_variation/aimage_variation.
- B157 owns ProviderConfigManager.get_provider_image_edit_config; B176 owns flatten_form_field_values and its recursive helpers in llm_request_utils.py; B1120 owns all ImageEditRequestUtils methods; B512 owns multipart file naming and image MIME.
- B638 owns Bedrock sending and B046 Stability/BFL transforms/polling, injected at composition because both depend transitively on B082; B044 owns custom provider execution. B159 owns import/export mechanics and local path opening.
pitfalls:
- extra_query is unused; accepting it does not mean it reaches the upstream URL.
- Only async_call is popped; custom handlers receive remaining kwargs without the named image options merged in.
- Bedrock's zero timeout is retained while other edit handlers replace zero with REQUEST_TIMEOUT.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
