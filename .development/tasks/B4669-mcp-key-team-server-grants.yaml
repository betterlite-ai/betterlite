id: B4669
title: MCP key and team server and toolset grants
description: >-
  Build the key level and team level MCP server grants that MCPRequestHandler resolves before any
  end-user, agent, user or org ceiling is applied. The result of every function here is a plain list of
  MCP server ids (or the literal `no-mcp-servers` for a key). Combining key and team, the require_key_mcp_access_defined
  rule and all later ceilings belong to get_mcp_server_access (B4671), which calls this module.
  Put the code in `crates/betterlite-mcp/src/server_grants.rs` and `server_grants/**`, with its own
  `ServerGrantsError` enum. Reuse B4668's auth record, `ObjectPermission` row type (fields `mcp_servers`,
  `mcp_access_groups`, `mcp_tool_permissions`, `mcp_toolsets`), `UnloadableEntitlementError`, the hydrated key
  permission read (`_key_object_permission_hydrated`) and `_toolset_tool_permissions`. Do not rebuild them.

  Everything that reads outside this module goes through one trait, `GrantReads`, that the struct `ServerGrants<R: GrantReads>`
  receives in its constructor (generic, no trait object, no global). Its methods, all async and all returning
  `Result<_, GrantReadError>`: `team(team_id, fresh) -> Option<TeamRecord>` (B737's team read: `blocked`, `access_group_ids`,
  `object_permission`), `user_team_ids(user_id, fresh) -> Option<Vec<String>>` (B736's user read, `None` for a missing user),
  `access_group_server_ids(access_group_ids, fresh) -> Vec<String>` (B737's unified access group read, the
  `access_mcp_server_ids` of each group), `db_servers_with_any_access_group(groups, use_writer) -> Vec<String>` (rows of the
  MCP server table whose `mcp_access_groups` overlap the groups, over B4711's table handle and B2305's server record),
  `toolset_grants(toolset_ids, fresh) -> Map<server_id, Vec<tool>>`, `expand_permission_list(names) -> Vec<String>` and
  `expand_tool_permissions(map) -> Map<server_id, Vec<tool>>` (the server manager's registry expansion), and
  `registry_server_ids()` plus `config_servers_access_groups() -> Map<server_id, Vec<String>>`. Write `DbGrantReads`, the production
  implementation, for the methods whose owners are named above, and keep the registry and toolset-resolver methods on a second small
  trait that the server manager's task implements (no owner exists at the pin of this plan, see notes). Tests use an in-memory fake of `GrantReads`.

  Functions to build (LiteLLM names in backticks, each one a method on `ServerGrants`):
  1. `key_servers` (`_get_allowed_mcp_servers_for_key`). No auth gives an empty list. Take the key's hydrated permission; none gives an empty list.
  If `mcp_servers` contains `no-mcp-servers`, return exactly `["no-mcp-servers"]` before any expansion. Otherwise the result is the de-duplicated
  union of: `expand_permission_list(mcp_servers)`, `servers_from_access_groups(mcp_access_groups, fresh)`, the keys of `expand_tool_permissions(mcp_tool_permissions)`,
  and the keys of `toolset_grants(mcp_toolsets, fresh)` (called only when `mcp_toolsets` is non-empty). Order is not part of the contract. Any error anywhere
  in this function, including one raised because `requires_fresh_policy` is true, is logged as a warning and the function returns an empty list (an empty key
  list means "the key does not restrict", so this fails open; keep that, it is LiteLLM's behavior). Key `access_group_ids` are not resolved here.
  2. `key_access_group_servers` (`_get_key_access_group_mcp_server_extras`). No auth gives an empty list. Resolve the key's `access_group_ids` through
  `access_group_server_ids`, return an empty list when nothing comes back, otherwise `expand_permission_list` of the ids. Any error is warned and gives an empty list.
  3. `team_servers` (`_get_allowed_mcp_servers_for_team`) and `team_ids_for_grant` (`_team_ids_for_mcp_grant`). The caller's `team_id` alone counts: no auth, no
  `team_id` or `team_id == "litellm-dashboard"` (UI_TEAM_ID) gives no team ids, otherwise a one-element list. Never fan out over the user's teams. With no team id the
  result is an empty list, else `single_team_servers(team_ids[0])`.
  4. `single_team_servers` (`_allowed_mcp_servers_for_single_team`). An empty id, UI_TEAM_ID, or a reader without a database gives an empty list. Read the team row
  (a missing row gives an empty list), and a row with `blocked == true` grants nothing (empty list). Read the team's `access_group_ids` servers, then call `team_granted_servers`.
  Error rule: an `UnloadableEntitlementError`, or any error while `requires_fresh_policy` is true, is returned to the caller; every other error is warned and gives an empty list.
  5. `team_granted_servers` (`_team_granted_servers`), the pure part. Team permission absent: only the team's access group servers. `mcp_servers` containing
  `all-proxy-mcpservers`: exactly the registry server ids and nothing else (the access group servers and tool grants are not added). Otherwise the set union of
  `expand_permission_list(mcp_servers)`, `servers_from_access_groups(mcp_access_groups)`, the keys of `expand_tool_permissions(mcp_tool_permissions)`, the keys of B4668's
  `_toolset_tool_permissions` (which fails with `UnloadableEntitlementError` when toolsets are declared but resolve to nothing) and the team's access group servers.
  6. `user_team_ids` (`_resolve_user_team_ids`). No database, a read error, a missing user or a user without teams gives an empty list (a read error is warned).
  Otherwise the user's teams in first-seen order, without duplicates, without empty strings and without UI_TEAM_ID.
  7. `servers_from_access_groups` (`_get_mcp_servers_from_access_groups`) with its two helpers `config_server_ids_for_access_groups`
  (`_get_config_server_ids_for_access_groups`) and `db_server_ids_for_access_groups` (`_get_db_server_ids_for_access_groups`). The config helper returns the id of every config server
  that has a non-empty `access_groups` list sharing at least one name with the request. The database helper returns an empty set for an empty group list or no database;
  otherwise it asks `db_servers_with_any_access_group`. Its read error is re-raised when `use_writer` is true and logged at debug level and swallowed (empty set)
  otherwise. The combined function unions config and database ids; `requires_fresh_policy` becomes `use_writer` and, on any error, is re-raised when true and warned
  with an empty list when false. B817's resolver, B3815's permission filter and the object-permission helper call this function, so keep it public.

  All names, sentinels and defaults are LiteLLM's: `no-mcp-servers` (SpecialMCPServerNames.no_mcp_servers), `all-proxy-mcpservers` (SpecialMCPServerName.all_proxy_servers),
  `litellm-dashboard` (UI_TEAM_ID). There is no config key or env var in these functions. They run on every MCP request, so keep reads to what the list above names.

