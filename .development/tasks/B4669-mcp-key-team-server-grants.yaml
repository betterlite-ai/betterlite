dod:
  - text: A key whose mcp_servers contains no-mcp-servers returns exactly that one literal, unexpanded, even when it also lists other servers, groups or toolsets.
    proof: [key-tests, oracle]
  - text: >-
      A key's list is the de-duplicated union of its expanded mcp_servers, mcp_access_groups servers, mcp_tool_permissions keys and mcp_toolsets server keys;
      a name or alias in mcp_servers becomes server ids and an unknown entry passes through.
    proof: [key-tests, oracle]
  - text: A key with no auth, no permission, or any read error (also when requires_fresh_policy is true) returns an empty list and never an error.
    proof: [key-tests]
  - text: Key access_group_ids resolve to expanded server ids; no auth, no result, or a read error returns an empty list.
    proof: [key-tests]
  - text: Team grants use only the caller's own team_id; a missing team_id or the dashboard team id gives an empty list and the user's other teams are never added.
    proof: [team-tests]
  - text: A blocked team, a missing team row and a reader without a database all give an empty team list.
    proof: [team-tests]
  - text: all-proxy-mcpservers in a team's mcp_servers returns exactly the registry server ids and ignores the team's access group servers and tool grants.
    proof: [team-tests, oracle]
  - text: A team's grant is the union of expanded mcp_servers, access group servers, tool permission keys, toolset server keys and the team's access_group_ids servers; a team without a permission row gets only the last of these.
    proof: [team-tests, oracle]
  - text: A team that declares toolsets that resolve to nothing makes team_servers return UnloadableEntitlementError, and so does any error while requires_fresh_policy is true; other errors give an empty list.
    proof: [team-error-tests]
  - text: user_team_ids returns the user's teams in first-seen order without duplicates, empty strings or the dashboard team id, and an empty list for a missing user, no teams, no database or a read error.
    proof: [user-team-tests, oracle]
  - text: >-
      Config access group lookup returns the ids of servers whose access_groups share a name with the request; the database lookup is skipped for no groups or no database,
      its error is swallowed without use_writer and returned with it; the combined lookup returns an empty list on error unless requires_fresh_policy is true.
    proof: [access-group-tests, oracle]
  - text: Helper cases for the key and team pure compositions are present, replay through the shared parser and agree with LiteLLM.
    proof: [helper-case-corpus, helper-python, helper-tests, oracle]

