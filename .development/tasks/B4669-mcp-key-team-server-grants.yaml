deviations:
  - what: Reads go through a typed `GrantReads` trait instead of importing proxy_server globals (prisma_client, user_api_key_cache, global_mcp_server_manager).
    why: betterlite has no module-level state; the observable results are the same.
  - what: Lists that LiteLLM builds from a Python set come back de-duplicated in first-seen order.
    why: Python's set order is not stable, so no client can rely on it; tests and cases compare as sets.

out_of_scope:
  - "get_mcp_server_access, get_allowed_mcp_servers and the key/team intersection, require_key_mcp_access_defined and all later ceilings: B4671."
  - "_get_key_object_permission, _get_team_object_permission, _key_object_permission_hydrated, _key_or_team_declares_toolsets, _toolset_tool_permissions, _toolset_tools_for_server, _union_tool_grants, _load_named_object_permission and UnloadableEntitlementError: B4668. This task calls them."
  - "The org, end-user, user and agent levels (_get_allowed_mcp_servers_for_org, _for_end_user, _for_user, get_allowed_mcp_servers_for_agent): B4670 and B4668 per their covers."
  - "Tool-level grants (get_allowed_tools_for_server, tool_is_granted): B4672."
  - "admitted_subject_sources and resolve_admitted_subject_servers, the callers of user_team_ids: B4671."
  - "get_mcp_access_groups, _get_mcp_access_groups_for_key, _get_mcp_access_groups_for_team, get_mcp_access_groups_from_headers and get_mcp_access_groups_from_scope (L3667-L3795): no caller at the pin outside their own file, so no code and no cases. The x-mcp-access-groups header is only forwarded by the header parsing in B4654."
  - "MCPServerManager.expand_permission_list, expand_tool_permissions, get_registry and resolve_toolset_tool_permissions bodies: the server manager task that covers mcp_server_manager.py. This task only declares the reads it needs."

pitfalls:
  - The key function turns every failure into an empty list, and an empty key list means the key does not restrict, so a database fault while requires_fresh_policy is true widens the key rather than denying it. Do not add the raise the team path has.
  - The no-mcp-servers check on a key looks at the raw mcp_servers before expansion and returns the literal alone, so a key with ["no-mcp-servers", "github"] gets no github.
  - all-proxy-mcpservers is special only for a team; a key listing it just passes the literal through expand_permission_list as an unknown name.
  - A team with all-proxy-mcpservers returns the registry keys and skips its own access group servers, but a team with no permission row still returns its access_group_ids servers.
  - team_servers never unions the user's teams. Only user_team_ids (for the admitted-subject fan-out in B4671) reads them, so a keyless user with no team_id gets nothing from the team level.
  - The blocked flag is checked only on the team row read here, because a keyless admitted subject has no key whose policy gate would catch a blocked team.
  - resolve_toolset_tool_permissions swallows a read fault into an empty map when requires_fresh_policy is false, so the key path then adds no toolset servers, while the team path's _toolset_tool_permissions raises on that same empty map when toolsets were declared.
  - The database lookup of access groups swallows its own error without use_writer, so a key on a read replica outage loses its access group servers silently; with use_writer it re-raises and the combined function either re-raises (fresh policy) or warns and returns an empty list.
  - mcp_tool_permissions keys are names, aliases or ids, so the server ids must come from expand_tool_permissions, not from the raw keys.
  - Config servers with an empty or missing access_groups list never match, even for an empty group request.

review_level: security

