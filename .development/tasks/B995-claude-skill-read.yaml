    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_skill_read::tests::skill_list_search($|::)/)'
  - id: case-skill-pagination
    why: the skill-pagination behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_skill_read::tests::skill_pagination($|::)/)'
  - id: case-route-aliases
    why: the route-aliases behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_skill_read::tests::route_aliases($|::)/)'
  - id: case-auth-missing
    why: the auth-missing behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_skill_read::tests::auth_missing($|::)/)'
  - id: case-auth-invalid
    why: the auth-invalid behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_skill_read::tests::auth_invalid($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/claude_skill_read)"
      && test -f crates/betterlite-server/fuzz/fuzz_targets/claude_skill_read.rs && grep -qF "decode_claude_skill_read"
      crates/betterlite-server/fuzz/fuzz_targets/claude_skill_read.rs && cargo nextest run --locked -p betterlite-server
      --no-tests=fail -E 'test(/^api::claude_skill_read::tests::replays_corpus$/)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/claude-skill-read)"
