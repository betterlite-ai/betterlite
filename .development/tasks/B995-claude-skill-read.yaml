id: B995
title: Claude skill read
description: >-
  Implement local skill list/get with the same user/team/object-permission predicates as skill writes, including
  source search and pagination. Preserve tenant filtering in the repository query rather than filtering a public
  page after retrieval.


  Implement crates/betterlite-server/src/api/claude_skill_read.rs, crates/betterlite-core/src/api/claude_skill_read.rs.
  Use ClaudeSkillReadInput and ClaudeSkillReadResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /v1/skills; GET /v1/skills/{skill_id}. Each alias is exercised
  through the booted proxy. Every route factory is mounted once; a family composer mounts its child factories without
  re-registering their methods/paths.


  Route input projections: data.model (absent None); request.query_params.model (absent None); request.headers.x-litellm-model
  (absent None).


  Write adjacent tests.rs behavior functions skill_list_grants, skill_team_visibility, skill_get_denied, skill_list_search,
  skill_pagination, route_aliases, auth_missing, auth_invalid under api::claude_skill_read::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  The production external-byte decoder is betterlite-server::api::claude_skill_read::decode_claude_skill_read(bytes:
  &[u8], limits: &ApiLimits), for orjson.loads input body at litellm/proxy/anthropic_endpoints/skills_endpoints.py:262;
  orjson.loads input body at litellm/proxy/anthropic_endpoints/skills_endpoints.py:364. Place its implementation
  in crates/betterlite-server/src/api/claude_skill_read.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-server/fuzz/fuzz_targets/claude_skill_read.rs passes arbitrary bounded bytes to that
  exact decoder; api::claude_skill_read::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/anthropic_endpoints/skills_endpoints.py: list_skills (L187-L308); litellm/proxy/anthropic_endpoints/skills_endpoints.py:
  get_skill (L317-L405). Abstract/protocol declarations map to native types and synchronous/async wrappers share
  one implementation; a partial function span is the explicit preparation/transition stage described above, with
  typed values passed to the following stage.


  Sizing: 147 owned nonblank/non-comment/non-docstring Python lines (187 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 167 implementation,
  88 behavior tests, 96 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 449 total within the 450-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B726 (Managed
  resources and transaction repositories), B858 (Typed managed-resource and analytics rows), B994 (Claude skill
  write), B1140 (Claude plugin and skill policy), B003 (HTTP server, health routes and master key auth), B756 (Authentication
  header selection and mode dispatch), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces
  and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
