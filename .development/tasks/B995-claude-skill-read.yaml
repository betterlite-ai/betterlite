checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::claude_skill_read::/)
      - test(/::replays_corpus$/)'
  - id: case-skill-list-grants
    why: the skill-list-grants behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::claude_skill_read::tests::skill_list_grants($|::)/)'
  - id: case-skill-team-visibility
    why: the skill-team-visibility behavior or its assertions are absent
