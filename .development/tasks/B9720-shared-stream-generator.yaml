deviations:
- what: The iterator hook, the per-chunk hook, the failure hook, the cost injection, the reservation release and the cleanup reach the generator through ports and constructor values instead of proxy_logging_obj and litellm module globals.
  why: betterlite wires dependencies through constructors; the frames a client sees are the same.
- what: The reservation release and the cleanup of a dropped body are handed to sync ports that the server runs on its task tracker, so they run side by side instead of the release finishing before the cleanup starts.
  why: Rust cannot await in Drop and rules.yaml async-hygiene forbids detached tasks; the two touch different state (the budget counter, and the logging object and parallel-request slot).
- what: An HTTP failure ends the body with a StreamAbort value that the route turns into a cut connection, where LiteLLM raises the HTTPException out of the generator.
  why: A Rust stream cannot raise; once the status line is sent both cut the connection.
- what: An Anthropic error frame that B958 cannot build (a WireDecodeError) ends the body with a StreamAbort of 500.
  why: LiteLLM's frame builder cannot fail; betterlite's checks decode limits, and cutting the stream is the only honest answer left.
