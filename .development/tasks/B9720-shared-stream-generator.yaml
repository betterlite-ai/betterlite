dod:
- text: >-
    Every stream passes wrap_iterator; with no per-chunk hook and no cost injection chunk_hook is never called, and otherwise every item
    passes chunk_hook with str_so_far "" first and then the text so far, and then the cost injection.
  proof: [shared-stream-tests]
- text: >-
    The SSE flavor writes a chunk as a data frame with nulls kept, bytes and text as they are, restamps the message_start model only with a
    restamp model, writes the restamper's held bytes at the end, and messages_stream fills idle gaps with the Anthropic ping event.
  proof: [shared-stream-tests]
- text: >-
    A failure runs the failure hook, then writes one frame: the Anthropic error event with the status, the redacted message and the 429 or
    401 code for the router messages, as AnthropicError when nothing was written before and sealed after a torn frame; an HTTP failure or a
    hook replacement ends the body with StreamAbort and no frame.
  proof: [shared-stream-tests, oracle, helper-python]
- text: >-
    advance_sse_tail with seal_open_sse_frame and return_raw_model_name match LiteLLM.
  proof: [shared-stream-tests, oracle, helper-python]
- text: >-
    The cleanup runs exactly once with the snapshot handle, stream_completed true after a clean end or an error frame and false after an
    HTTP failure, and client_disconnected true when the body is dropped mid-stream.
  proof: [shared-stream-tests]
- text: >-
    A body dropped before any delivered chunk, a ping bytes chunk not counting, releases the reservation once, unless the source reports
    buffered provider output; a body dropped after a delivered chunk does not.
  proof: [shared-stream-tests]
- text: >-
    A2aStreamHooks passes JSON objects, strings and other JSON values through the generator and back unchanged, turns a failure into Failed
    with the redacted message and an HTTP failure into Rejected.
  proof: [shared-stream-tests]
