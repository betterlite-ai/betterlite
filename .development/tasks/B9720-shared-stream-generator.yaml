pitfalls:
- 'str_so_far reaches the per-chunk hook as "" on the first chunk, not as None; B8604''s generator passes None there, this one does not.'
- 'The iterator hook runs on every stream here, even with no override, because LiteLLM calls it unconditionally and its pass-through path fires the deferred stream logging; skipping it loses that logging.'
- 'Only Bytes equal to `event: ping\ndata: {"type": "ping"}\n\n` leave delivered_chunk false; Text with the same characters counts as delivered, as a str never equals bytes in LiteLLM.'
- 'delivered_chunk is set before the item is written, so a client that leaves while the first real chunk is being written keeps its reservation charged.'
- 'An HTTP failure runs the cleanup with stream_completed false and client_disconnected false and writes nothing, while a plain failure sets stream_completed before it writes the error frame.'
- 'The error frame is AnthropicError only while the seal is empty; once a seal is prepended it is plain bytes, so create_response can no longer turn it into a JSON answer.'
- 'The seal starts with a line break only when the tail does not already end in "\n" or "\r", and the tail starts as "\n\n", so an error before any write is never sealed.'
- 'The restamper turns a Text item into bytes and may return empty bytes while it holds a torn message_start frame; its flush output is written as it is and does not advance the tail.'
- 'The router 429 and 401 code rules look at the redacted message, and the Anthropic error status is that code, so a "No deployments available" failure with status 500 is sent as 429.'
- 'In the A2A flavor a failure message is final: A2A''s serializers read proxy_exc.message, so do not add "Streaming error: " to it.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
