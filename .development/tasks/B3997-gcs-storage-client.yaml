id: B3997
title: Authenticate GCS storage requests and isolate bucket credentials
description: >-
  Build the reusable GCS bucket client with dynamic bucket and credential selection.
  Implement GCSBucketBase as a service that handles authentication via Vertex AI,
  constructs request headers for both async and sync contexts, and manages per-credential
  Vertex client instances. The class reads bucket name and service account path from
  environment variables (GCS_BUCKET_NAME, GCS_PATH_SERVICE_ACCOUNT) or accepts them
  dynamically through callbacks. Cache Vertex instances by their credential string,
  using "IAM_AUTH" as the key when credentials are absent. Install mock GCS behavior
  when should_use_gcs_mock() is true at initialization. Provide upload and download
  operations that preserve URL and body contracts for reuse by the GCS logger, caching,
  and secret retrieval. Sync headers include GOOGLE_SECRET_MANAGER_PROJECT_ID from
  the environment; async headers pass no project. Bucket names may contain folder paths;
  split them and prepend the path to object names. Download returns bytes only for
  200 status; upload posts JSON and returns parsed response or logs non-200 errors.
scope:
  paths:
    - crates/betterlite-logging/src/gcs_client.rs
    - crates/betterlite-logging/src/gcs_client/**
    - crates/betterlite-logging/src/types.rs
    - tools/oracle/cases/logging/gcs-storage-auth/**
    - tools/oracle/helpers/b3997.py
    - tools/oracle/helpers/b3997/**
    - tools/oracle/src/helpers/logging/b3997.rs
    - tools/oracle/src/helpers/logging/b3997/**
    - crates/betterlite-logging/src/types/**
  lint_tables: false
