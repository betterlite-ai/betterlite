dod:
  - text: >-
      GCSBucketBase.__init__ reads GCS_BUCKET_NAME and GCS_PATH_SERVICE_ACCOUNT from
      environment; calls should_use_gcs_mock() and when true invokes mock_vertex_auth_methods()
      and create_mock_gcs_client(); obtains an async httpx client with LoggingCallback provider;
      initializes an empty vertex_instances dict and calls super().__init__() with any kwargs.
    proof: [initialization-tests]
  - text: >-
      construct_request_headers calls _ensure_access_token_async on the provided or default vertex instance,
      extracts token and project, calls _get_token_and_url with model="gcs-bucket",
      and returns a dict with Authorization header "Bearer {token}" and Content-Type "application/json".
    proof: [header-construction-tests]
  - text: >-
      sync_construct_request_headers mirrors the async version, reads GOOGLE_SECRET_MANAGER_PROJECT_ID
      from environment, uses _ensure_access_token (sync) and _get_token_and_url (sync),
      and returns the same header structure.
    proof: [header-construction-tests]
  - text: >-
      _handle_folders_in_bucket_name splits bucket name using split_configured_cloud_bucket_name,
      prepends the returned prefix (if any) to the object name separated by slash, returning
      the modified bucket and object names.
    proof: [bucket-folder-handling-tests]
  - text: >-
      get_gcs_logging_config checks for standard_callback_dynamic_params in kwargs, extracts
      gcs_bucket_name and gcs_path_service_account, falls back to instance defaults, raises
      ValueError if bucket_name is None, and returns GCSLoggingConfig with bucket_name,
      vertex_instance from get_or_create_vertex_instance, and path_service_account.
    proof: [config-resolution-tests]
  - text: >-
      get_or_create_vertex_instance caches VertexBase instances by credential key from
      _get_in_memory_key_for_vertex_instance, creates and initializes new instances on cache miss,
      and returns the cached instance on subsequent calls.
    proof: [vertex-caching-tests]
  - text: >-
      _get_in_memory_key_for_vertex_instance returns credentials as-is if non-None,
      otherwise returns the literal string "IAM_AUTH".
    proof: [caching-key-tests]
  - text: >-
      download_gcs_object constructs GCS config and headers, handles folder-prefixed bucket names,
      encodes object name for URL, performs GET to storage.googleapis.com/storage/v1/b/{bucket}/o/{object}?alt=media,
      returns response.content on 200 status, returns None on non-200 or exception.
    proof: [download-tests]
  - text: >-
      _log_json_data_on_gcs accepts headers, bucket_name, object_name, and logging_payload (string or StandardLoggingPayload),
      serializes payload to JSON with default=str if not a string, handles folder-prefixed bucket names,
      encodes object name, performs POST to storage.googleapis.com/upload/storage/v1/b/{bucket}/o?uploadType=media&name={object},
      logs non-200 response with verbose_logger.error, and returns parsed JSON response.
    proof: [upload-tests]
  - text: >-
      GCSLoggingConfig TypedDict contains bucket_name (str), vertex_instance (VertexBase),
      and path_service_account (str | None). GCSLogQueueItem contains payload (StandardLoggingPayload),
      kwargs (dict), and response_obj (Any | None).
    proof: [type-definition-tests]
checks:
  optional: []
  commands:
    - id: initialization-tests
      why: __init__ must read environment, setup mocks, and call parent constructor
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::initialization_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: header-construction-tests
      why: Both async and sync header construction must produce Bearer token and Content-Type headers
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::header_construction_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: bucket-folder-handling-tests
      why: Folder paths in bucket names must be split and prepended to object names
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::bucket_folder_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: config-resolution-tests
      why: Config must resolve from dynamic params, fall back to defaults, and validate bucket_name
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::config_resolution_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: vertex-caching-tests
      why: Vertex instances must be created once per credential and reused on subsequent calls
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::vertex_caching_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: caching-key-tests
      why: Cache keys must use credential string or literal "IAM_AUTH" for None credentials
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::caching_key_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: download-tests
      why: Downloads must encode URLs correctly, handle folders, and return bytes on 200 only
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::download_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: upload-tests
      why: Uploads must serialize payloads, encode URLs, handle folders, and return parsed response
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::upload_behaviors::tests::/) - test(/::replays_corpus$/)'
    - id: type-definition-tests
      why: Type definitions must match LiteLLM schema with correct field names and types
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_storage_auth::type_definitions::tests::/) - test(/::replays_corpus$/)'
