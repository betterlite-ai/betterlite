deviations:
  - what: >-
      The LiteLLM delete_gcs_object method contains a condition `(response.status_code != 200) or (response.status_code != 204)`
      that is always true (neither status can satisfy both constraints simultaneously), so it always logs an error even on success.
      Betterlite logs errors only when status is neither 200 nor 204, treating either as success.
    why: >-
      The LiteLLM condition appears to be a bug; the intent is clearly to succeed on either 200 or 204 (POST creates with 200,
      DELETE succeeds with 204). This task focuses on download and upload paths; delete is out of scope per the outline.
      A future owner of delete should fix the condition logic.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gcs_bucket/gcs_bucket_base.py#L273
out_of_scope:
  - delete_gcs_object (lines 251-292) is not owned by this task; it has no caller at the pin and is out of scope.
  - GCS_DEFAULT_BATCH_SIZE, GCS_DEFAULT_FLUSH_INTERVAL_SECONDS, and GCS_DEFAULT_USE_BATCHED_LOGGING constants are defined in gcs_bucket.py (lines 13-15) but owned and validated by B3998's queue initialization logic.
  - B3996 owns should_use_gcs_mock, mock_vertex_auth_methods, and create_mock_gcs_client; this task calls them.
  - B256 owns CustomBatchLogger parent class; this task inherits from it.
  - B173 owns get_async_httpx_client and httpxSpecialProvider; this task uses them.
  - B1302 owns VertexBase class definition and initialization.
  - B1303 owns _ensure_access_token and _ensure_access_token_async methods.
  - B1304 owns _get_token_and_url method.
  - B2208 owns split_configured_cloud_bucket_name and encode_gcs_object_name_for_url utilities.
pitfalls:
  - >-
    Vertex instances are cached by the exact credential string or the literal "IAM_AUTH" key,
    not by bucket name. Two calls with different buckets but the same credentials reuse the same cached instance.
  - >-
    sync_construct_request_headers reads GOOGLE_SECRET_MANAGER_PROJECT_ID at call time, so changes to the environment
    are reflected in subsequent calls; async headers pass project_id=None and ignore that environment variable.
  - >-
    Bucket names may contain slashes representing folder paths. split_configured_cloud_bucket_name handles this splitting;
    the returned prefix must be prepended to the object name with a slash separator.
  - >-
    Object names are URL-encoded using encode_gcs_object_name_for_url before building the request URL;
    raw slashes and spaces in object names must not appear in the final URL.
  - >-
    The _log_json_data_on_gcs method accepts logging_payload as either a string or a StandardLoggingPayload object.
    If a string, it is posted as-is; if an object, it is serialized to JSON with default=str to handle non-serializable fields.
  - >-
    Download returns the raw bytes of the response body on 200, never a parsed JSON object.
    Callers must deserialize JSON if needed.
  - >-
    Both async and sync header construction must succeed, and failures in token generation raise exceptions up to the caller.
    No fallback or retry logic exists at this level.
  - >-
    Mock setup at initialization only happens when should_use_gcs_mock() returns true; once initialization completes,
    the decision is fixed for the instance lifetime (is_mock_mode flag).
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
