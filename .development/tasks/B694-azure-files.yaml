pitfalls:
- 'The oracle helper for this task is pre-registered as azure_files in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/files.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_files.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The deletion fallback checks the SDK FileDeleted type, so a dictionary-looking success is still replaced.
- Explicit timeout/max_retries arguments are unused in these wrappers.
