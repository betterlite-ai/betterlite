  - mutants
  commands:
  - id: case-file-upload
    why: Copy create_file_data, remove expires_after only when missing/None, preserve other values including {}.
      Send files.create and validate response.model_dump() as OpenAIFileObject; no mutation of original request.
      Async emits create_file_data/create_file_response debug records, sync does not.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_upload$/)'
  - id: case-file-content
    why: Pass every file_content_request field to files.content; return HttpxBinaryResponseContent wrapping response.response,
      preserving bytes/status/headers. This is buffered content; no streaming-content operation is implemented by
      this Azure file module.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_content$/)'
  - id: case-file-retrieve
    why: Pass only file_id to files.retrieve and return SDK FileObject unchanged; do not apply upload model_dump
      validation a second time.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_retrieve$/)'
  - id: case-file-list
    why: Forward purpose only when it is a string, including empty string; otherwise call files.list() without it.
      No pagination parameters are accepted or synthesized; return SDK cursor page unchanged.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_list$/)'
  - id: case-file-delete
    why: Pass file_id to files.delete. If response is not a FileDeleted instance (including empty string/None/dict),
      synthesize FileDeleted{id:file_id,deleted:true,object:file}; preserve a real FileDeleted even when deleted=False.
      organization argument is unused.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_delete$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_files.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_files*")"
      && grep -lq 'azure_files' tools/oracle/fuzz/corpus/helper_case/azure_files* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_files$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-azure-file-client-inputs
    why: Every operation calls B531 get_azure_openai_client with litellm_params or {},api_key,api_base,api_version,provided
      client and _is_async. The explicit timeout/max_retries arguments are NOT forwarded; values in litellm_params
      still apply. Both Azure and ordinary OpenAI client types are accepted.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_azure_file_client_inputs$/)'
  - id: case-azure-file-client-errors
    why: A missing client result raises ValueError AzureOpenAI client is not initialized. Make sure api_key is passed
      or OPENAI_API_KEY is set in the environment. Literal True _is_async requires AsyncAzureOpenAI/AsyncOpenAI
