id: B694
title: Azure file lifecycle
description: >-
  Port Azure file upload, content, retrieve, list and delete with B516 wire records and the Azure endpoint factory;
  keep expires_after behavior and api-version queries. B541 retains batches.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/files/handler.py:
  AzureOpenAIFilesAPI.__init__ L25-L26; AzureOpenAIFilesAPI._prepare_create_file_data L29-L41; AzureOpenAIFilesAPI.acreate_file
  L43-L51; AzureOpenAIFilesAPI.create_file L53-L87; AzureOpenAIFilesAPI.afile_content L89-L95; AzureOpenAIFilesAPI.file_content
  L97-L133; AzureOpenAIFilesAPI.aretrieve_file L135-L141; AzureOpenAIFilesAPI.retrieve_file L143-L179; AzureOpenAIFilesAPI.adelete_file
  L181-L190; AzureOpenAIFilesAPI.delete_file L192-L232; AzureOpenAIFilesAPI.alist_files L234-L243; AzureOpenAIFilesAPI.list_files
  L245-L285.


  Named case contracts: file_upload: Copy create_file_data, remove expires_after only when missing/None, preserve
  other values including {}. Send files.create and validate response.model_dump() as OpenAIFileObject; no mutation
  of original request. Async emits create_file_data/create_file_response debug records, sync does not. file_content:
  Pass every file_content_request field to files.content; return HttpxBinaryResponseContent wrapping response.response,
  preserving bytes/status/headers. This is buffered content; no streaming-content operation is implemented by this
  Azure file module. file_retrieve: Pass only file_id to files.retrieve and return SDK FileObject unchanged; do
  not apply upload model_dump validation a second time. file_list: Forward purpose only when it is a string, including
  empty string; otherwise call files.list() without it. No pagination parameters are accepted or synthesized; return
  SDK cursor page unchanged. file_delete: Pass file_id to files.delete. If response is not a FileDeleted instance
  (including empty string/None/dict), synthesize FileDeleted{id:file_id,deleted:true,object:file}; preserve a real
  FileDeleted even when deleted=False. organization argument is unused. azure_file_client_inputs: Every operation
  calls B531 get_azure_openai_client with litellm_params or {},api_key,api_base,api_version,provided client and
  _is_async. The explicit timeout/max_retries arguments are NOT forwarded; values in litellm_params still apply.
  Both Azure and ordinary OpenAI client types are accepted. azure_file_client_errors: A missing client result raises
  ValueError AzureOpenAI client is not initialized. Make sure api_key is passed or OPENAI_API_KEY is set in the
  environment. Literal True _is_async requires AsyncAzureOpenAI/AsyncOpenAI or raises AzureOpenAI client is not
  an instance of AsyncAzureOpenAI. Make sure you passed an AsyncAzureOpenAI client. Sync does not add a type guard.
  Preserve SDK errors without catches. azure_file_routes: Reuse B516 SDK file bodies/replies with B531 Azure URLs:
  create/list /files, retrieve/delete /files/{id}, content /files/{id}/content under the resolved Azure API base
  and api-version query. This task reads no direct env/config beyond the resolved client inputs and adds no route
  registration.


  Implement crates/betterlite-azure/src/azure_files.rs with adjacent tests under azure_files/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_files_cases in betterlite-azure with these exact named cases (one per oracle file):
  file_upload, file_content, file_retrieve, file_list, file_delete, azure_file_client_inputs, azure_file_client_errors,
  azure_file_routes. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_files* using HelperCase: kind: helper and
  the externally tagged azure_files variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_files that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 236 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 245 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 640 planned, 650 maximum changed lines.
