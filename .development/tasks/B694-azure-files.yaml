id: B694
title: Azure file lifecycle
description: >-
  Port Azure file upload, content, retrieve, list and delete with B516 wire records and the Azure endpoint factory;
  keep expires_after behavior and api-version queries. B541 retains batches.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/files/handler.py:
  AzureOpenAIFilesAPI.__init__ L25-L26; AzureOpenAIFilesAPI._prepare_create_file_data L29-L41; AzureOpenAIFilesAPI.acreate_file
  L43-L51; AzureOpenAIFilesAPI.create_file L53-L87; AzureOpenAIFilesAPI.afile_content L89-L95; AzureOpenAIFilesAPI.file_content
  L97-L133; AzureOpenAIFilesAPI.aretrieve_file L135-L141; AzureOpenAIFilesAPI.retrieve_file L143-L179; AzureOpenAIFilesAPI.adelete_file
  L181-L190; AzureOpenAIFilesAPI.delete_file L192-L232; AzureOpenAIFilesAPI.alist_files L234-L243; AzureOpenAIFilesAPI.list_files
  L245-L285.


  Implement crates/betterlite-azure/src/azure_files.rs with adjacent tests under azure_files/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_files in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_files_cases in betterlite-azure with these exact named cases (one per oracle file):
  file_upload, file_content, file_retrieve, file_list, file_delete. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_files* using HelperCase: kind: helper and
  the externally tagged azure_files variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_files that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 236 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 465 planned, 475 maximum changed lines.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - crates/betterlite-azure/src/azure_files.rs
  - crates/betterlite-azure/src/azure_files/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_files.rs
  - tools/oracle/src/helpers/azure_files/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_files.py
  - tools/oracle/cases/helpers/providers/azure-files/**
  - tools/oracle/fuzz/corpus/helper_case/azure_files*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/files/handler.py#L25-L285
  why: >-
    Own AzureOpenAIFilesAPI.__init__, AzureOpenAIFilesAPI._prepare_create_file_data, AzureOpenAIFilesAPI.acreate_file,
    AzureOpenAIFilesAPI.create_file, AzureOpenAIFilesAPI.afile_content, AzureOpenAIFilesAPI.file_content, AzureOpenAIFilesAPI.aretrieve_file,
    AzureOpenAIFilesAPI.retrieve_file, AzureOpenAIFilesAPI.adelete_file, AzureOpenAIFilesAPI.delete_file, AzureOpenAIFilesAPI.alist_files,
    AzureOpenAIFilesAPI.list_files. Other functions in this file remain with the owners listed below.
dod:
- text: 'file upload: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-files/file-upload.yaml.'
  proof:
  - case-file-upload
  - oracle
  - helper-python
- text: 'file content: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-files/file-content.yaml.'
  proof:
  - case-file-content
  - oracle
  - helper-python
- text: 'file retrieve: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-files/file-retrieve.yaml.'
  proof:
  - case-file-retrieve
  - oracle
  - helper-python
- text: 'file list: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-files/file-list.yaml.'
  proof:
  - case-file-list
  - oracle
  - helper-python
- text: 'file delete: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-files/file-delete.yaml.'
  proof:
  - case-file-delete
  - oracle
  - helper-python
- text: New azure_files seeds parse as the intended call variant and replay through the shared production parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-file-upload
    why: The file-upload behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_upload$/)'
  - id: case-file-content
    why: The file-content behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_content$/)'
  - id: case-file-retrieve
    why: The file-retrieve behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_retrieve$/)'
  - id: case-file-list
    why: The file-list behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_list$/)'
  - id: case-file-delete
    why: The file-delete behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_file_delete$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_files.py)" && uv run --locked --project
      tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
      --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_files*")"
      && grep -lq 'azure_files' tools/oracle/fuzz/corpus/helper_case/azure_files* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_files$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
