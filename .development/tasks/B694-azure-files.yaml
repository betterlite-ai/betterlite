      client. Sync does not add a type guard. Preserve SDK errors without catches.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_azure_file_client_errors$/)'
  - id: case-azure-file-routes
    why: 'Reuse B516 SDK file bodies/replies with B531 Azure URLs: create/list /files, retrieve/delete /files/{id},
      content /files/{id}/content under the resolved Azure API base and api-version query. This task reads no direct
      env/config beyond the resolved client inputs and adds no route registration.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_files_cases::case_[0-9]+_azure_file_routes$/)'
