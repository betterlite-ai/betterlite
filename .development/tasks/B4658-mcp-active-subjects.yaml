  paths:
    - crates/betterlite-auth/src/subject_state.rs
    - crates/betterlite-auth/src/subject_state/**
    - crates/betterlite-auth/Cargo.toml
    - crates/betterlite-server/src/mcp/active_subjects.rs
    - crates/betterlite-server/src/mcp/active_subjects/**
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/cases/helpers/mcp-active-subjects/**
    - "tools/oracle/fuzz/corpus/helper_case/mcp-active-subjects-*"
    - tools/oracle/helpers/b4658.py
    - tools/oracle/helpers/b4658/**
    - tools/oracle/src/helpers/auth/b4658.rs
    - tools/oracle/src/helpers/auth/b4658/**
  lint_tables: false
