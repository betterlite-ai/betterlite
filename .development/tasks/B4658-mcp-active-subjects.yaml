deviations:
  - what: When the CLI token can't be built (no salt key and no master key), the mint gives unresolvable, so B4676's route answers 500 with the OAuth error server_error.
    why: LiteLLM lets the ValueError escape and answers an uncaught 500. B4674's MintProxyCredential port has no error channel beyond its failure enum, and the status stays 500.
  - what: An expiry text of a bare date followed by Z, such as 2099-01-01Z, parses as midnight UTC instead of counting as unparseable.
    why: decode_billed_at rewrites Z to +00:00 before it parses, and that text then reads as a date with a time of 00:00. The key table's expires column is a DateTime, so a stored row can't hold this text.
  - what: key_owner_deactivated gives false for an inactive key without reading its owner.
    why: The owner comes from active_key_user_id because UserAPIKeyAuth fields are crate-private. Both callers also reject an inactive key, so the answer a client sees is the same and only one user read is skipped.
out_of_scope:
  - "bridge_token_flow.py: B4666 owns _extract_user_id_from_request (L408), authorize_oauth_credential_request (L418), _resolve_request_auth (L429), can_store_oauth_credential (L441) and _resolve_jwt_auth (L469)."
  - "bridge_token_flow.py: B4666 owns _UpstreamGrantRejection (L542), _classify_upstream_lifetime (L551), _bridge_grant_from_token_response (L573), _BridgeMintError (L621), _BridgeMintReady (L637), _bridge_mint_error_response (L649), _key_resolution_failure_to_mint_error (L734) and _upstream_rejection_to_mint_error (L751)."
  - "bridge_token_flow.py: B4666 owns _prepare_bridge_mint (L762), _BridgeRefreshReady (L824), _refresh_key_failure_to_mint_error (L838), _prepare_bridge_refresh (L857), _finish_bridge_mint (L894), _upstream_refresh_credential (L936) and _mint_refresh_envelope_value (L965)."
  - B4679 owns _reload_admitted_key and the rest of user_api_key_auth_mcp.py, and calls master_key_admin_auth.
  - B4659 owns oauth_identity_binding.py and calls load_active_user.
  - B4675 and B4676 own the routes and the authorize and token flows that take ActiveSubjects as their ports. B8621 builds ActiveSubjects and LiveSubjectStore.
  - B1614 owns fetch_cli_sso_team_details and selected_cli_sso_team_detail. B1223 owns the token encoding and the CLI_JWT_EXPIRATION_HOURS setting. B1217 owns outage classification. B738, B736 and B870 own the reads, their caches and their reconnects.
pitfalls:
  - Plain SHA-256 hex is not safe_hash_api_key, since that function leaves a token without sk- unchanged and prefixes a JWT with hashed-jwt-, so the two disagree on every UI or JWT bearer.
  - A header value of "Bearer " trims to the word Bearer before the prefix check, so the token is the literal text Bearer, not an empty value.
  - A present but empty x-litellm-api-key answers true in uses_gateway_credential and is skipped by litellm_key_from_request, so the first check reads the header's presence and not the helper's result.
  - An empty Authorization header gives no token, yet "authorization" in the headers still answers true.
  - The key path asks whether the error itself is an outage and the user path walks the chain, because get_user_object wraps a failure in a ValueError, so a wrapped key error stays unresolvable while a wrapped user outage is unavailable.
  - Other means unresolvable on the key path and no_active_key on the user path, so one shared mapping for both is a bug.
  - A missing user row is no_active_key in load_active_user and false in key_owner_deactivated, because a key may outlive its owner record while a user subject can't.
  - The master key check runs before has_database and skips key_is_active, so the admin keeps working with no database.
  - A master key of "" counts as unset, in master_key_admin_auth and in the master key comparison of uses_gateway_credential.
  - The raw master key comparison in uses_gateway_credential compares encoded bytes, so betterlite_secrets::master_key::matches_raw is the wrong call here since it answers false for non-ASCII text.
  - UserAPIKeyAuth::construct strips via_virtual_key from the dict as a server-only field, so it has to be set on extra.provenance after construct.
  - scim_active is checked with Python's "is False", so 0, null and "false" all leave the user active.
  - The mint reads the user with Database and every other caller with Cache, so a user a writer deactivated can't mint from a stale cached row.
  - The token takes team_id from the grant, not from the selected detail, and the user row passed to it must have no teams or B1223's first-team fallback attributes the credential to a team nobody chose.
  - team_required looks at live details and not at user.teams, so a user whose only membership points at a deleted team mints with no team.
  - The consent lookup calls team_details even for an empty team list while the mint skips the call, so only the mint's test can assert that team_details was never called.
