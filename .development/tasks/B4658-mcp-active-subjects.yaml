dod:
  - text: key_is_active is false for a blocked key, for an expiry strictly before now and for an expiry text that can't be parsed, true at exactly now and for a key with no user_id, and a naive expiry text counts as UTC.
    proof: [key-state-tests, helper-oracle, helper-tests, helper-python]
  - text: active_key_user_id gives the user_id of an active key and nothing for a blocked key, an expired key or a key with no user_id.
    proof: [key-state-tests, helper-oracle, helper-tests, helper-python]
  - text: user_scim_deactivated is true only for scim_active equal to JSON false, and false for missing metadata, a missing entry, null, 0 and the string "false".
    proof: [user-state-tests, helper-oracle, helper-tests, helper-python]
  - text: master_key_admin_auth matches only the SHA-256 hex of a non-empty master key and gives a proxy admin key with api_key litellm_proxy_master_key, the given user_id and via_virtual_key true.
    proof: [master-key-tests]
  - text: litellm_key_from_request prefers x-litellm-api-key, strips a bearer prefix in any case, falls through empty values, decodes bytes as Latin-1 and gives None when nothing is usable.
    proof: [presented-key-tests, helper-oracle, helper-tests, helper-python]
  - text: uses_gateway_credential answers true for a present x-litellm-api-key header, an sk- token, the master key, custom auth and OIDC userinfo, answers from the authorization header's presence when no token exists, and keeps LiteLLM's step order.
    proof: [classify-header-tests]
  - text: For a JWT, a missing, non-string or empty iss or an unset global issuer gives true, and otherwise only a match on the global issuer or a configured issuer gives true.
    proof: [classify-jwt-tests]
  - text: An opaque token is a gateway credential when it is an envelope, a refresh envelope, a v2:gcm value, a decodable UI session key, a known key or a lookup that faulted, and not when the lookup says the key is not found.
    proof: [classify-opaque-tests]
  - text: reload_active_key returns the master key admin without a database, and otherwise maps no database, Refused, Unavailable, Faulted, Other and an inactive key to unresolvable, no_active_key, unavailable, faulted, unresolvable and no_active_key.
    proof: [key-reload-tests]
  - text: resolve_active_key gives no_active_key with no presented token, and hashes a presented token with plain SHA-256 hex, for an sk- key and for a token without that prefix.
    proof: [key-reload-tests]
  - text: load_active_user maps no database to unresolvable, Unavailable and Faulted to the same names, and Refused, Other, a missing row and a SCIM-deactivated row to no_active_key, and passes the requested source to the store.
    proof: [user-load-tests]
  - text: key_owner_deactivated is true only for an owner row with scim_active false, and false for no owner, no database, a read error and a missing row.
    proof: [owner-check-tests]
  - text: revalidate_subject gives None for a live key and a live user, returns the key or user failure, gives no_active_key for an active key whose owner is deactivated, and reads a user subject through the cache source.
    proof: [revalidate-tests]
  - text: The consent lookup reads through the cache source, returns the user failure, gives unavailable when team details are unknown and drops details with no team_id.
    proof: [consent-tests]
  - text: The mint reads through the database source and refuses in order with the user failure, not_a_member before any team read, unavailable, team_required and not_a_member for a member whose team row is gone.
    proof: [mint-refusal-tests]
  - text: A user whose memberships all point at deleted teams, and a user with no teams, mint with no team without a team read failing them, and a user with no teams never calls team_details.
    proof: [mint-refusal-tests]
  - text: A minted credential carries the grant's team_id, the selected team's alias, models and aliases, the effective role for a row with no role, the user's models, no team list on the user row, and expires_in of cli_token_hours times 3600, and it decodes through B1223.
    proof: [mint-token-tests]
  - text: LiveSubjectStore maps a refused key read, a direct outage, a wrapped key error, a wrapped user outage, a missing user error and a permanent fault to the SubjectReadError values the description gives, and maps KeyNotFoundError and other identity errors to NotFound and Faulted.
    proof: [live-store-tests]
  - text: The oracle cases and the corpus seeds agree with LiteLLM on the four pure operations.
    proof: [helper-oracle, helper-tests, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: key-state-tests
      why: the active key gate or the active key user id is missing or wrong
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^subject_state::tests::key_/)'
    - id: user-state-tests
      why: the SCIM check accepts something other than a literal JSON false
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^subject_state::tests::user_/)'
    - id: master-key-tests
      why: the master key admin is missing, matches the wrong digest or lacks via_virtual_key
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^subject_state::tests::master_/)'
    - id: presented-key-tests
      why: the presented key is read from the wrong header or stripped differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::presented_key::/)'
    - id: classify-header-tests
      why: the header, master key or auth mode steps of the classification are missing or out of order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::classify::tests::header_/)'
    - id: classify-jwt-tests
      why: the issuer step lets a JWT fall through to the cookie when it should not, or the reverse
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::classify::tests::jwt_/)'
    - id: classify-opaque-tests
      why: an opaque token is misread, or a lookup fault permits the cookie fallback
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::classify::tests::opaque_/)'
    - id: key-reload-tests
      why: a key failure gets the wrong name, or the master key path needs a database
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::key_reload::/)'
    - id: user-load-tests
      why: a user failure gets the wrong name, or the source is not passed through
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::user_reload::tests::load_/)'
    - id: owner-check-tests
      why: the owner check fails closed, so a database blip would revoke a live key
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::user_reload::tests::owner_/)'
    - id: revalidate-tests
      why: an envelope subject is revalidated through the wrong path or skips the owner check
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::revalidate::/)'
    - id: consent-tests
      why: the consent lookup reads the wrong source or keeps a detail with no team_id
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::proxy_credentials::tests::consent_/)'
    - id: mint-refusal-tests
      why: the mint refuses in the wrong order or lets a user step outside their teams
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::proxy_credentials::tests::mint_refusal_/)'
    - id: mint-token-tests
      why: the minted credential carries the wrong team, role, models or lifetime
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::proxy_credentials::tests::mint_token_/)'
    - id: live-store-tests
      why: the production store maps a lookup error to the wrong SubjectReadError or IdentityLookup value
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::active_subjects::live_store::/)'
    - id: helper-tests
      why: the helper adapter does not reach the production functions
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::auth::b4658::/) - test(/replays_the_/)'
    - id: helper-oracle
      why: the helper cases are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-active-subjects)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/mcp-active-subjects
    - id: helper-python
      why: the Python helper adapter is unchanged or fails the strict checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4658.py tools/oracle/helpers/b4658)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-active-subjects seed reaches the shared parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-active-subjects-*')" &&
        grep -rlq b4658 tools/oracle/fuzz/corpus/helper_case/mcp-active-subjects-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
