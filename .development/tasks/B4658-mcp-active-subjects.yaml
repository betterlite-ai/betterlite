id: B4658
title: MCP active subjects and proxy API credential minting
description: >-
  The MCP OAuth endpoints have to ask two questions before they trust a caller: does this request carry a gateway credential at all, and is the key or user behind it still live. A consented native sign-in then has to turn into the same credential `lite login` stores. In LiteLLM that code is the first part of bridge_token_flow.py (L35-L405) and all of proxy_api_credentials.py. B4666 owns the rest of bridge_token_flow.py and calls this code, and so do B4675, B4676, B4659 and B4679, so every name below is public and spelled as written here.


  The code goes in two modules. UserAPIKeyAuth keeps its fields pub(crate), so whatever reads them or sets via_virtual_key lives in betterlite-auth, in the new module subject_state. Everything that reads a store goes in betterlite-server, in the new module mcp::active_subjects, because it needs B1614's team details from that crate and B4674's port types and B4651's envelope helpers from betterlite-mcp. Add betterlite-models and subtle (subtle.workspace = true) to crates/betterlite-auth/Cargo.toml and betterlite-mcp to crates/betterlite-server/Cargo.toml. None of those crates depend back on the crate that adds them.


  Dependency code sits in these modules: betterlite_auth::auth_key_lookup (B738), betterlite_auth::auth_user_lookup (B736), betterlite_auth::identity_store (B870), betterlite_auth::jwt_claims (B760), betterlite_auth::session_token_codec (B1223), betterlite_db::database_availability (B1217), betterlite_db::database_faults (B872), betterlite_mcp::gateway_dcr (B4674), betterlite_mcp::envelope (B4651) and betterlite_server::cli_poll_grants (B1614). LiteLLMUserTable is in crates/betterlite-db/src/identity_rows/user.rs.


  subject_state, pure checks with no store. key_is_active(key: &UserAPIKeyAuth, now: DateTime<Utc>) -> bool reads view.token.blocked and view.token.expires. A blocked key is inactive. No expiry is active. Expiry::DateTime compares as it stands. Expiry::Text goes through betterlite_models::savings_evidence::billed_at::decode_billed_at, the existing port of datetime.fromisoformat that reads a naive value as UTC, and a text it can't parse makes the key inactive, never an error. The key is inactive only when the expiry is strictly before now. A user_id is not required, since team and service-account keys have none. active_key_user_id(key, now) -> Option<&str> gives the key's user_id only when key_is_active is true. user_scim_deactivated(user: &LiteLLMUserTable) -> bool is true only when metadata holds scim_active with the value JsonData::Bool(false).


  master_key_admin_auth(key_hash: &str, master_key: Option<&SecretString>, admin_name: &str) -> Result<Option<UserAPIKeyAuth>, SubjectStateError> gives Ok(None) when the master key is missing or empty, or when key_hash differs from the lowercase SHA-256 hex of the master key, compared with subtle's ConstantTimeEq. On a match it builds a key with api_key "litellm_proxy_master_key" (LITELLM_PROXY_MASTER_KEY_ALIAS), user_role proxy_admin (UserRole::ProxyAdmin.to_string()) and user_id admin_name through UserAPIKeyAuth::construct(AuthInput::Dict(..)), then sets extra.provenance.via_virtual_key to true. SubjectStateError wraps AuthError.


  mcp::active_subjects, in crates/betterlite-server/src/mcp/active_subjects.rs with the submodules presented_key, classify, key_reload, user_reload, revalidate, proxy_credentials and live_store, each with a tests.rs beside it. The root file holds the types. UserRowSource is Cache or Database. ResolvedKey { key_hash: String, key: UserAPIKeyAuth }. There is no second failure enum: LiteLLM's _KeyResolutionFailure has the same four values as B4674's ReloadUserFailure, so that type is used everywhere. SubjectReadError is Refused (ProxyException or HTTPException in LiteLLM), Unavailable, Faulted and Other. IdentityLookup is Found, NotFound and Faulted.


  SubjectStore is the injected port, native async fn in a trait taken as a generic parameter like B4674's ports, not dyn. Its methods are now() -> DateTime<Utc>, has_database() -> bool, key_by_hash(key_hash) -> Result<UserAPIKeyAuth, SubjectReadError>, user_by_id(user_id, source: UserRowSource) -> Result<Option<LiteLLMUserTable>, SubjectReadError>, identity_by_hash(key_hash) -> IdentityLookup and team_details(teams: &[String]) -> Option<Vec<CliSsoTeamDetail>>. None from team_details means the lookup failed.


  ActiveSubjects<S: SubjectStore> has public fields store and settings, plus the secret, clock and random source that B1223's token functions take, and callers write the struct literal. ActiveSubjectSettings holds what LiteLLM reads from proxy_server globals, and the MCP identity wiring part B8621 fills it. master_key: Option<SecretString> is the master key. admin_name: String is litellm_proxy_admin_name, default LITELLM_PROXY_ADMIN_NAME "default_user_id". custom_auth: bool is true when user_custom_auth is set. oidc_userinfo_enabled: bool is litellm_jwtauth.oidc_userinfo_enabled, default false. global_issuer: Option<String> is the env var JWT_ISSUER, default unset. issuers: Vec<String> holds the issuer of each litellm_jwtauth.issuers entry, default empty. cli_token_hours: i64 is B1223's CLI_JWT_EXPIRATION_HOURS, default 24. This task reads no config key or env var itself.


  presented_key. litellm_key_from_request(headers: &HeaderMap) -> Option<String> tries x-litellm-api-key, then Authorization. For each it skips a missing or empty value, decodes the bytes as Latin-1 the way Starlette does (each byte is one char), trims, removes a case-insensitive "bearer " prefix and trims again. The first non-empty result wins, otherwise None. Take only the first value of a repeated header, like HeaderMap::get.


  classify. uses_gateway_credential(&self, headers: &HeaderMap) -> bool answers whether the browser authorize step must treat the bearer as a gateway credential, so a denied credential can't fall back to the session cookie. Keep this order. A present x-litellm-api-key header gives true, even when empty. With no token from litellm_key_from_request, the answer is whether an authorization header exists. A token starting with "sk-" or equal to a non-empty master key gives true. custom_auth or oidc_userinfo_enabled gives true. A token that is not a JWT (betterlite_auth::resolved_key::credential::is_jwt, on main) goes to the opaque check. For a JWT, read iss from B760's get_unverified_claims. A missing, non-string or empty iss, or an unset or empty global_issuer, gives true, because the unscoped global validator can accept issuers the list doesn't name. Otherwise the answer is whether iss equals global_issuer or any entry of issuers.


  The opaque check gives true for a token with EnvelopePrefix::is_envelope, is_refresh_envelope or the prefix betterlite_db::encryption_scan::V2_GCM_PREFIX, and true when B1223's get_key_object_from_ui_hash_key decodes it. Otherwise it calls store.identity_by_hash with the SHA-256 hex of the token: Found and Faulted give true, NotFound gives false. An error from the B1223 call counts as Faulted, since a lookup fault must not permit the cookie fallback.


  key_reload. resolve_active_key(&self, headers) -> Result<ResolvedKey, ReloadUserFailure> gives no_active_key when no token is presented and otherwise calls reload_active_key with the SHA-256 hex of the token. reload_active_key(&self, key_hash) -> Result<ResolvedKey, ReloadUserFailure> first tries master_key_admin_auth and returns that key with no database and no active check. An Err from it is unresolvable. Then has_database false gives unresolvable. Then key_by_hash: Refused gives no_active_key, Unavailable gives unavailable, Faulted gives faulted, Other logs at debug "_reload_active_key_by_hash: unexpected key-resolution error (%s)" and gives unresolvable. A key that fails key_is_active at store.now() gives no_active_key.


  user_reload. load_active_user(&self, user_id, source) -> Result<LiteLLMUserTable, ReloadUserFailure>: has_database false gives unresolvable. Then user_by_id: Refused gives no_active_key, Unavailable and Faulted give the same names, Other logs at debug "_reload_active_user_by_id: user-resolution error (%s)" and gives no_active_key, Ok(None) gives no_active_key. A row with user_scim_deactivated gives no_active_key. ActiveSubjects implements B4674's ReloadUser by calling load_active_user with Cache and keeping only the failure. key_owner_deactivated(&self, key) -> bool is the opposite policy and fails open. It takes the owner from active_key_user_id(key, store.now()). No owner, no database, any read error (debug "refresh: key-owner SCIM lookup failed, not revoking (%s)") and a missing row all give false. It reads with Cache and answers user_scim_deactivated for a row it finds.


  revalidate. revalidate_subject(&self, identity: &EnvelopeIdentity) -> Option<ReloadUserFailure> matches on identity.subject_type. KeyHash calls reload_active_key(identity.subject), returns its failure, and gives no_active_key when key_owner_deactivated is true. UserId is the ReloadUser path with Cache. None means the subject is live.


  proxy_credentials. ActiveSubjects implements B4674's LookupConsentTeams and MintProxyCredential. The consent lookup calls load_active_user with Cache and returns its failure, then team_details(user.teams), where None gives unavailable. It returns one ConsentTeam { team_id, team_alias } for each detail whose team_id is present, in the order the details came.


  The mint takes (user_id, team_id) and checks in this order. load_active_user with Database, returning its failure. A given team_id not in user.teams gives not_a_member, before any team read. details is team_details(user.teams) when user.teams is non-empty, otherwise empty, and None gives unavailable. team_id absent with any detail holding a team_id gives team_required. B1614's selected_cli_sso_team_detail(details, team_id) giving nothing is not_a_member. Then call B1223's get_cli_jwt_auth_token with a user row holding only user_id, the role from betterlite_auth::auth_identity::roles::effective_user_role(user.user_role) and user.models, with no teams, and pass team_id from the grant plus team_alias, team_models and team_model_aliases from the selected detail. Return MintedProxyCredential { key, expires_in: cli_token_hours * 3600, user_id: user.user_id, team_id }. A failed token build gives unresolvable.


  live_store. LiveSubjectStore is the production SubjectStore. Its constructor arguments are the B738 key lookup, B736 UserLookup, B870 IdentityStore, the database handle for B1614's fetch_cli_sso_team_details, and the wall clock, as a struct literal with no database meaning has_database false. key_by_hash calls get_key_object. A ProxyException, including the 401 token_not_found_in_db for a missing row, is Refused. Any other error is an outage only when B1217's is_database_service_unavailable_error accepts the error itself, otherwise Other. user_by_id calls get_user_object with user_id_upsert false and check_db_only true only for Database. ProxyException is Refused. Any other error, B732's UserNotFoundError included, is an outage when B1217's find_database_service_unavailable_error_in_chain finds one, otherwise Other. An outage is Faulted when B872's is_permanent_database_fault holds for the fault (the one the chain search finds, or the error itself when it finds none) and otherwise Unavailable. identity_by_hash calls IdentityStore::resolve with the hash: success is Found, KeyNotFoundError is NotFound, anything else logs at debug "OAuth bearer ownership could not be checked (%s)" and is Faulted, B732's NoDatabaseConnectionError included. team_details returns None with no database. Keep the error mapping in plain functions over those error values, so its tests run without Postgres.


  Tests use a fake SubjectStore that records calls, a fixed now and synthetic rows, and test names start with the prefixes the check filters name. No route reaches this code yet, so the helper operation b4658 covers the pure functions and the umbrella adds HTTP cases. The Python side calls bridge_token_flow's _litellm_key_from_request with a Starlette Request built from the case's raw headers, and _key_is_active, _active_key_user_id and _active_user_record on UserAPIKeyAuth and LiteLLM_UserTable built from the case. The Rust side calls litellm_key_from_request, key_is_active, active_key_user_id and user_scim_deactivated. Expiry cases use dates far in the past or future, because LiteLLM reads the real clock. Each operation returns its value, and an inactive user compares as the string no_active_key. Add an mcp-active-subjects-* seed to the helper_case corpus for each operation.
