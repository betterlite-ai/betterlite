checks:
  optional:
  - mutants
  commands:
  - id: case-chat-dispatch
    why: The normal branch calls B004 chat with the resolved organization, original custom_prompt_dict, shared_session
      and supplied HTTP/client handle; the experimental branch calls B010 HTTP composition with explicit stream/provider_config
      and B196 encoding. Preserve both sync and async return shapes and the provider identifier.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_chat_dispatch$/)'
  - id: case-embeddings-dispatch
    why: The installed embedding operation calls B006 through the existing OpenAI adapter and preserves B507/B508
      dimensions, encoding_format, usage and error contracts; it does not enter the chat/default metadata branch.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_embeddings_dispatch$/)'
  - id: case-explicit-param-before-config
    why: Resolve base using B500; key uses truthy explicit api_key, litellm.api_key, litellm.openai_key, OPENAI_API_KEY.
      Organization uses explicit, litellm.organization, OPENAI_ORGANIZATION, then None. headers uses truthy supplied
      map or litellm.headers. Merge B668 OpenAIConfig defaults only for absent optional keys, retaining explicit
      None, False, 0 and empty values.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_explicit_param_before_config$/)'
  - id: case-experimental-handler
    why: EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER defaults False through B129 boolean parsing. Only the normal
      path inserts extra_headers when non-None, including an empty map overwriting an earlier optional extra_headers;
      experimental dispatch does not perform this insertion. Both still receive headers separately.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_experimental_handler$/)'
  - id: case-preview-metadata
    why: enable_preview_features defaults False. When enabled and metadata is non-None, get_requester_metadata first
      sanitizes a nested dict requester_metadata using B668; return it only if the cleaned dict is truthy. Otherwise
      sanitize the entire outer metadata, retaining string values only, excluding hidden_params and taking the first
      16. Empty results return None. A non-None cleaned result overwrites existing optional metadata before default
      merging; disabled preview leaves it unchanged.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_preview_metadata$/)'
  - id: case-openai-provider-dispatch-http
    why: the production result, omission or failure matches tools/oracle/cases/chat/openai_provider-dispatch-http.yaml.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_openai_provider_dispatch_http$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_provider.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_provider*")"
      && grep -lq 'openai_provider' tools/oracle/fuzz/corpus/helper_case/openai_provider* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_provider$/)' && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: config-experimental-openai-base-llm-http-handler
    why: The EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_provider_config_cases::case_[0-9]+_loads_experimental_openai_base_llm_http_handler$/)'
      && grep -lq 'EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER' crates/betterlite-config/fuzz/corpus/config_yaml/openai_provider*
  - id: config-enable-preview-features
    why: The enable_preview_features setting is not loaded with its required defaults and precedence.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_provider_config_cases::case_[0-9]+_loads_enable_preview_features$/)'
      && grep -lq 'enable_preview_features' crates/betterlite-config/fuzz/corpus/config_yaml/openai_provider*
  - id: config-unknown-key
    why: The extension silently accepts unrelated unsupported configuration.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_provider_config_cases::case_[0-9]+_rejects_unrelated_key$/)'
  - id: config-corpus
    why: New operation-specific config seeds are absent or do not replay through B002.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/openai_provider*")"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_provider_unsupported_operation$/)'
  - id: case-text-defaults
    why: Text dispatch uses api_type=openai, api_version=None; base precedence is explicit, litellm.api_base, OPENAI_BASE_URL,
      OPENAI_API_BASE, https://api.openai.com/v1; key uses explicit, global api_key, openai_key, OPENAI_API_KEY.
