      no explicit or environment organization lookup occurs in this branch.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_text_defaults$/)'
  - id: case-text-chat-projection
    why: After B510 returns, convert text to chat only when optional stream is literally False, acompletion is literally
      False and text_completion is literally False. None/0 are not identical to False. Text post_call runs for truthy
      stream or acompletion is True; chat post_call runs only for truthy stream, with additional_args.headers.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_text_chat_projection$/)'
  - id: case-call-failure-logging
    why: Normal/experimental chat execution exceptions log the original error string and headers through B249, then
      rethrow unchanged. Credential/config/metadata preparation errors happen before this try and have no owned
      post_call. Text has no owned catch. Test credential-safe logged events using B187 while matching the original
      status/type/param/code through B184.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_dispatch_cases::case_[0-9]+_call_failure_logging$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_provider_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_provider_secret_safe_failure$/)'
