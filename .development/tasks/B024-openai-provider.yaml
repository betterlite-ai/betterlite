id: B024
title: OpenAI provider endpoint composition
description: >-
  Compose OpenAI chat, embeddings and text/moderation calls using the installed provider modules and
  the closed operation dispatcher. B668 supplies base parameter policy before B004, B502 and B504; B669 installs
  media, B670 resources and B671 assistants/session operations. Own the OpenAI branch of main.py _complete_custom_openai
  and _complete_text_completion_openai, including configuration default merging without replacing explicit call
  parameters. Reuse B500 resolved key/base/organization values rather than rereading environment at dispatch.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/main.py: _complete_text_completion_openai
  L1771-L1850; _complete_custom_openai OpenAI/common branch L2590-L2632 and L2648-L2728. litellm/utils.py: get_requester_metadata
  L10327-L10341.


  unsupported_operation is a Rust-only dispatcher test, because no corresponding LiteLLM operation exists. Cases
  cover the normal and EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER branches (default false), extra_headers precedence
  and enable_preview_features metadata forwarding; This slice owns get_requester_metadata and uses B668 add_openai_metadata.


  Provider composition changes existing chat dispatch, not route registration: add the HTTP dispatch case through
  the booted proxy for POST /v1/chat/completions and /chat/completions with the source provider prefix. Assert upstream
  request, auth, response status, error type/param/code and response headers. Keep the existing router as the sole
  route owner; pure helper cases exercise the other typed provider operations without calling FastAPI globals.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Named case contracts: chat_dispatch: The normal branch calls B004 chat with the resolved organization, original
  custom_prompt_dict, shared_session and supplied HTTP/client handle; the experimental branch calls B010 HTTP composition
  with explicit stream/provider_config and B196 encoding. Preserve both sync and async return shapes and the provider
  identifier. embeddings_dispatch: The installed embedding operation calls B006 through the existing OpenAI adapter
  and preserves B507/B508 dimensions, encoding_format, usage and error contracts; it does not enter the chat/default
  metadata branch. The OpenAI Responses operation is not installed here: the Responses operation variant belongs
  to the API-family dispatcher, so B080 binds OpenAI's B507/B508 transformation into it and this provider task
  never depends on a route task. B669/B670/B671 install the media/resource/assistant families without registering
  their routes again. explicit_param_before_config:
  Resolve base using B500; key uses truthy explicit api_key, litellm.api_key, litellm.openai_key, OPENAI_API_KEY.
  Organization uses explicit, litellm.organization, OPENAI_ORGANIZATION, then None. headers uses truthy supplied
  map or litellm.headers. Merge B668 OpenAIConfig defaults only for absent optional keys, retaining explicit None,
  False, 0 and empty values. experimental_handler: EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER defaults False through
  B129 boolean parsing. Only the normal path inserts extra_headers when non-None, including an empty map overwriting
  an earlier optional extra_headers; experimental dispatch does not perform this insertion. Both still receive headers
  separately. preview_metadata: enable_preview_features defaults False. When enabled and metadata is non-None, get_requester_metadata
  first sanitizes a nested dict requester_metadata using B668; return it only if the cleaned dict is truthy. Otherwise
  sanitize the entire outer metadata, retaining string values only, excluding hidden_params and taking the first
  16. Empty results return None. A non-None cleaned result overwrites existing optional metadata before default
  merging; disabled preview leaves it unchanged. text_defaults: Text dispatch uses api_type=openai, api_version=None;
  base precedence is explicit, litellm.api_base, OPENAI_BASE_URL, OPENAI_API_BASE, https://api.openai.com/v1; key
  uses explicit, global api_key, openai_key, OPENAI_API_KEY. Merge B510 text defaults by missing key only. Set the
  per-call SDK organization only for a truthy global organization; no explicit or environment organization lookup
  occurs in this branch. text_chat_projection: After B510 returns, convert text to chat only when optional stream
  is literally False, acompletion is literally False and text_completion is literally False. None/0 are not identical
  to False. Text post_call runs for truthy stream or acompletion is True; chat post_call runs only for truthy stream,
  with additional_args.headers. call_failure_logging: Normal/experimental chat execution exceptions log the original
  error string and headers through B249, then rethrow unchanged. Credential/config/metadata preparation errors happen
  before this try and have no owned post_call. Text has no owned catch. Test credential-safe logged events using
  B187 while matching the original status/type/param/code through B184.


  SDK module assignments become isolated per-call values in Rust: do not leak organization/api_type/api_version
  between deployments. Loader ownership for global key/base/organization/headers is B500, preview and experimental
  settings are owned here. Existing public routes are B004/B006; the helper cases call the executable operation
  dispatcher, while the named HTTP case drives both existing chat aliases.


  Write standalone Rust test openai_provider_credential_identity_isolation in betterlite-provider: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_provider_secret_safe_failure in betterlite-provider: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  The OpenAI text provider call path is now below the API layer: B2237 owns completion/transformation.py and completion/utils.py
  plus the text config selector; B2238 owns completion/handler.py. Call these leaves directly, including config
  defaults, prompt preparation, optional chat conversion and sync/async send/stream behavior. Public routes and
  bridges remain with B202/B203.


  Implement crates/betterlite-provider/src/openai_dispatch.rs with adjacent tests under openai_dispatch/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; leaf crates
  remain below this dispatcher and never import it. The production function is the only Rust implementation used
  by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function openai_dispatch_cases in betterlite-provider with these exact named cases (one per oracle
  file): chat_dispatch, embeddings_dispatch, explicit_param_before_config, experimental_handler,
  preview_metadata, openai_provider_dispatch_http, text_defaults, text_chat_projection, call_failure_logging. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases
  use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_provider* using HelperCase: kind: helper
  and the externally tagged openai_provider variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_openai_provider that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/openai/openai_dispatch.rs
  and its loader wiring: EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER, enable_preview_features. Module-level settings
  enter litellm_settings; deployment settings enter litellm_params; environment lookup is injected. Keep the defaults
  and precedence specified above and in the linked branches; existing key owners remain unchanged. Write config
  rstest openai_provider_config_cases with named cases loads_experimental_openai_base_llm_http_handler, loads_enable_preview_features,
  plus rejects_unrelated_key. Each loads case calls the real config loader with that key and asserts the resolved
  value, default, precedence and secret redaction where applicable. Seed B002 config_yaml with new openai_provider*
  files for every key; reuse its parser/fuzz target.


  Write standalone openai_provider_unsupported_operation in betterlite-provider for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 188 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 270 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 670 planned, 725 maximum changed lines.
