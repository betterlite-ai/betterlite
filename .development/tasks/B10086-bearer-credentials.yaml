id: B10086
title: Bearer credential parsing and the no-auth dev mode check
description: >-
  Three tasks need two small pieces of LiteLLM's user_api_key_auth.py and nothing else of B756. B3603's pass-through header filter strips a caller's credential scheme exactly as authentication does, and treats no caller value as a LiteLLM secret in no-auth dev mode. B756's get_api_key and get_api_key_from_custom_header read the presented key through the same parser. B1221's central checks skip authorization in no-auth dev mode. This task builds the parser and the dev mode check, so those tasks wait on it instead of on all of B756.


  Layout. Two modules in betterlite-auth: bearer_credentials (crates/betterlite-auth/src/bearer_credentials.rs, tests in bearer_credentials/tests.rs) and dev_auth_mode (crates/betterlite-auth/src/dev_auth_mode.rs, tests in dev_auth_mode/tests.rs). Both files are empty stubs lib.rs already declares. They sit outside B756's auth_headers on purpose, so the two tasks never share files. Neither module reads config, a header map or a request; callers pass the values in.


  The parser. LiteLLM has two copies of one parser: _get_bearer_token (L585-L610) returns "" for a value it does not recognize, and _get_bearer_token_or_received_api_key (L491-L511) returns that value unchanged. Everything else is the same, so build it once as `get_bearer_token(api_key: &str) -> Option<SecretString>`. None means no scheme was recognized, or an AWS4-HMAC-SHA256 value had no Credential= field. A caller wanting the strict form treats None as an empty key; a caller wanting the permissive form falls back to the value it passed. Write no wrapper for either form (rules.yaml no-one-line-functions). The rules, checked in this order: a value starting with "Bearer " loses every occurrence of "Bearer " anywhere in it, since LiteLLM uses str.replace and not a prefix strip; a value starting with "Basic " loses every "Basic " the same way, with the base64 kept as it is (decoding it is B756's langfuse branch); a value starting with lowercase "bearer " loses every "bearer ". Any other casing, such as "BEARER x", and a scheme without its space are unrecognized. A value starting with "AWS4-HMAC-SHA256", with or without a space after it, takes the first match anywhere in the value of `Credential=Bearer\s+([^/\s,]+)`, else the first match of `Credential=([^/\s,]+)`, else None. Use the regex crate betterlite-auth already depends on. A recognized scheme with nothing after it, such as "Bearer ", gives Some of an empty key and not None: LiteLLM's permissive helper returns "" there, and B3603's `_get_bearer_token(value) or value` falls back to the original value only because the strict result is empty.


  The dev mode check. `AuthModeFlags { enable_jwt_auth: bool, enable_oauth2_auth: bool, enable_oauth2_proxy_auth: bool }`, public, Default with all three false, and `is_no_auth_dev_mode(master_key: Option<&SecretString>, flags: &AuthModeFlags) -> bool`, true only when master_key is None and all three flags are false. An empty master key is Some, so it is not dev mode. Custom auth is not one of the flags: B3603's caller checks user_custom_auth on its own. The three general_settings keys are bools in LiteLLM's settings schema, so they arrive as bools (docs/compatibility.md covers truthiness). Loading them is the config owners' work, B756's auth_headers section and B875's auth_backend_dispatch section, and the master key comes from B002's general_settings; this task loads no key.


  Oracle. Helper cases on the b10086 operation with two variants. bearer takes the raw value and answers both the strict and the permissive result as text. dev_mode takes master_key (null or a string) and the three flags and answers the bool. The Python adapter calls the pinned _get_bearer_token, _get_bearer_token_or_received_api_key and is_no_auth_dev_mode from litellm.proxy.auth.user_api_key_auth; the Rust side calls get_bearer_token and is_no_auth_dev_mode and exposes the key only to build the answer. Add helper_case corpus seeds named bearer-credentials-*.


  Tests. bearer_credentials/tests.rs is one rstest table over every rule above and every pitfall below, each row asserting the strict and the permissive result. dev_auth_mode/tests.rs covers no master key with all flags false, no master key with each flag set alone, an empty master key and a set one. No test prints a key, and an assertion failure message never shows one.
scope:
  paths:
    - crates/betterlite-auth/src/bearer_credentials.rs
    - crates/betterlite-auth/src/bearer_credentials/**
    - crates/betterlite-auth/src/dev_auth_mode.rs
    - crates/betterlite-auth/src/dev_auth_mode/**
    - tools/oracle/cases/helpers/bearer-credentials/**
    - tools/oracle/fuzz/corpus/helper_case/bearer-credentials-*
    - tools/oracle/helpers/b10086.py
    - tools/oracle/helpers/b10086/**
    - tools/oracle/src/helpers/auth/b10086.rs
    - tools/oracle/src/helpers/auth/b10086/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L585-L610
    why: Owned. _get_bearer_token, the parser that answers "" for a value it does not recognize.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L491-L511
    why: Owned. _get_bearer_token_or_received_api_key, the same parser keeping an unrecognized value.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L2747-L2751
    why: Owned. is_no_auth_dev_mode.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L820-L828
    why: Call site. get_api_key uses the permissive form for the custom key header and the strict form for Authorization, in B756's code.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L2814-L2819
    why: Call site. _run_centralized_common_checks returns early in dev mode, in B1221's code.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L2460-L2471
    why: Call site. _normalize_credential_value, `_get_bearer_token(value) or value`, in B3603's code.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L2531-L2550
    why: Call site. _is_authenticated_caller_secret checks dev mode together with user_custom_auth, in B3603's code.
dod:
  - text: get_bearer_token removes every occurrence of "Bearer ", "Basic " or "bearer " once the value starts with it, answers None for other casings and unknown schemes, and gives an empty key for a bare scheme, so the strict and permissive results match LiteLLM's two helpers.
    proof: [bearer-tests, oracle, helper-python]
  - text: An AWS4-HMAC-SHA256 value gives the Credential=Bearer token first, then the plain Credential= value, each stopping at a slash, whitespace or comma, and None when neither pattern matches.
    proof: [bearer-tests, oracle]
  - text: is_no_auth_dev_mode is true only for no master key with all three flags false; an empty master key or any single flag makes it false.
    proof: [dev-mode-tests, oracle]
  - text: New bearer-credentials seeds for b10086 replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: bearer-tests
      why: The parser strips only a leading prefix, accepts another casing or misreads an AWS credential.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^bearer_credentials::/)'
    - id: dev-mode-tests
      why: Dev mode turns on with an empty master key or with one auth flag set.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^dev_auth_mode::/)'
    - id: helper-python
      why: The b10086 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10086.py tools/oracle/helpers/b10086)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10086 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bearer-credentials-*")" &&
        grep -lE '^[[:space:]]+b10086:' tools/oracle/fuzz/corpus/helper_case/bearer-credentials-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-auth --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/bearer-credentials/prefix-schemes.yaml
  - tools/oracle/cases/helpers/bearer-credentials/every-occurrence-removed.yaml
  - tools/oracle/cases/helpers/bearer-credentials/unrecognized-values.yaml
  - tools/oracle/cases/helpers/bearer-credentials/aws-credential-forms.yaml
  - tools/oracle/cases/helpers/bearer-credentials/no-auth-dev-mode.yaml
deviations: []
out_of_scope:
  - "litellm/proxy/auth/user_api_key_auth.py: get_api_key, get_api_key_from_custom_header, check_api_key_for_custom_headers_or_pass_through_endpoints, the routing override selectors, the public-route checks and get_rbac_role: B756, which calls get_bearer_token."
  - "litellm/proxy/auth/user_api_key_auth.py: _run_centralized_common_checks: B1221. Every other function: the owners B756's out_of_scope lists."
  - "_normalize_credential_value and _is_authenticated_caller_secret in llm_passthrough_endpoints.py: B3603, which calls both functions here."
  - "Loading general_settings.enable_jwt_auth, enable_oauth2_auth and enable_oauth2_proxy_auth: the config sections of B756 and B875. Loading master_key: B002."
  - "Decoding the Basic payload and capping credential bytes: B756's langfuse branch and its decode_auth_headers."
pitfalls:
  - "str.replace removes every \"Bearer \" in the value, so \"Bearer aBearer b\" gives \"ab\"; strip_prefix keeps the inner one and yields a different key."
  - "Only the exact prefixes \"Bearer \", \"Basic \" and \"bearer \" count, so \"BEARER x\" and \"Bearer\\tx\" are unrecognized: strict \"\", permissive unchanged."
  - "The AWS branch checks startswith(\"AWS4-HMAC-SHA256\") without a space and searches the whole value, so \"AWS4-HMAC-SHA256Credential=k/x\" gives \"k\"."
  - "\"Credential=Bearer/x\" has no whitespace after Bearer, so the first pattern misses and the plain one returns \"Bearer\"."
  - "Python's \\s also matches the separators U+001C to U+001F and Rust's regex \\s does not; spell the class out in both patterns so such a value splits where LiteLLM's does."
  - "An AWS value without a Credential= field is None: strict \"\", permissive the whole value."
  - "master_key \"\" is not None, so a proxy configured with an empty master key is not in dev mode."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
