checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::messages_dispatch::/)
      - test(/::replays_corpus$/)'
  - id: case-messages-public-context
    why: the messages-public-context behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_dispatch::tests::messages_public_context($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::messages_dispatch::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/messages-dispatch-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_dispatch.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_dispatch-*)"
      && grep -qE "^[[:space:]]+messages_dispatch:" tools/oracle/fuzz/corpus/helper_case/messages_dispatch-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-dispatch)"
oracle_cases:
- tools/oracle/cases/helpers/messages-dispatch/messages-public-context.yaml
deviations: []
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- Within _public_request\'s fields is None branch, preserve return None and its nested guards.
- Within _public_request\'s not isinstance(model, str) or messages is None or (not isinstance(max_tokens, int))
  branch, preserve return None and its nested guards.
