id: B1134
title: Messages public dispatch
description: >-
  Bind the native Messages public request/context projection to the typed executor; Python sync/async imports remain
  later bindings and never run inside the gateway.


  Implement crates/betterlite-core/src/api/messages_dispatch.rs. Use MessagesDispatchInput and MessagesDispatchResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions messages_public_context under api::messages_dispatch::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.DEFAULT_MAX_TOKENS
  defaults to 4096. No environment reads occur outside betterlite-config. Test api::messages_dispatch::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesDispatch in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_dispatch: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/messages/dispatch.py: _python_messages (L33-L37); litellm/messages/dispatch.py: _python_amessages
  (L40-L44); litellm/messages/dispatch.py: _public_request (L53-L73); litellm/messages/dispatch.py: _resolved_provider
  (L76-L80); litellm/messages/dispatch.py: _context (L83-L88); litellm/messages/dispatch.py: anthropic_messages_handler
  (L105-L116); litellm/messages/dispatch.py: anthropic_messages (L119-L127); litellm/anthropic_interface/messages/__init__.py:
  acreate (L27-L83); litellm/anthropic_interface/messages/__init__.py: create (L86-L146). Abstract/protocol declarations
  map to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 193 owned nonblank/non-comment/non-docstring Python lines (241 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 213 implementation,
  46 behavior tests, 12 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 424 total within the 430-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B982 (Messages native
  call), B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries), B002 (Load LiteLLM config.yaml
  into typed config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
