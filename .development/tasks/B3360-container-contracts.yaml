  - tools/oracle/cases/helpers/container-contracts/delete-file-both-literals.yaml
  - tools/oracle/cases/helpers/container-contracts/field-access-unknown.yaml
  - tools/oracle/cases/helpers/container-contracts/endpoint-catalog.yaml
