  - tools/oracle/cases/helpers/container-contracts/config-default-error-class.yaml
deviations:
  - what: Response transforms take the raw body bytes and return a typed Result, and drop the logging_obj argument.
    why: Python passes an httpx.Response and a Logging object, but no container provider reads logging_obj and the HTTP layer is B3363's.
  - what: litellm_params is a JSON object map, not the GenericLiteLLMParams model.
    why: That model belongs to the router types; the container providers only read keys from it.
  - what: A body that fails a record shape returns ContainerError::Decode, not a pydantic ValidationError.
    why: Rust has no pydantic. The accept and reject outcome is the same, which the oracle cases compare.
  - what: BaseLlmException is a small struct local to this module.
    why: The Rust error shape of B2202's BaseLLMException is not importable from here yet; the fields (status_code, message, headers) are the same.
out_of_scope:
  - "litellm/llms/base_llm/containers/transformation.py: BaseContainerConfig.get_config (L253-L270) has no caller at the pin, so it is not built."
  - "litellm/containers/endpoints.json lookup by name, URL building and response model selection: B3363 owns container_handler.py."
  - "OpenAIContainerConfig and AzureContainerConfig implementations: B522 and B547."
  - "ContainerRequestUtils param filtering and provider selection: B3361."
  - "litellm/containers/endpoint_factory.py and main.py, which read the catalog to build SDK functions: B3368, B3366, B3367."
  - "The isinstance(ContainerObject) check in litellm_logging.py L2615 that marks container results billable: the logging task that owns that file."
pitfalls:
  - ContainerObject.object is only "container" but ContainerFileObject.object also allows "container_file", and DeleteContainerFileResponse.object also allows "container_file.deleted"; do not make one shared literal enum.
  - model_dump writes null for absent expires_after, last_active_at, name, first_id and last_id, so a record encodes every key; only the three TypedDict param structs skip None.
  - hidden_params must stay out of both decode and encode, since LiteLLM keeps it as a private attribute and B522 writes additional_headers into it after decoding.
  - ContainerListResponse.has_more has no default, so a list body without it is rejected, while first_id and last_id may be missing.
  - ExpiresAfter.anchor is a one-value literal; an OpenAI body with another anchor fails the whole container decode.
  - endpoints.json has a trailing space after two of its commas (the async_name lines of list_container_files and upload_container_file) and uneven key spacing; copy it byte for byte so the file is the pinned one, and parse it with serde_json.
  - retrieve_container_file_content has response_type "raw" and returns_binary true, and upload_container_file has is_multipart true; the other three have neither flag, so the defaults must be false.
  - get_complete_url returns api_base unchanged, with no /containers suffix; the suffix is added by the OpenAI override in B522.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
