dod:
  - text: Each record decodes the LiteLLM wire JSON, ignores unknown keys, and rejects a wrong object literal, a missing required field and a wrong anchor.
    proof: [record-tests, oracle, helper-python]
  - text: Encoding writes every declared field with absent options as null, leaves hidden_params out, and field(name) returns None for undeclared names.
    proof: [record-tests, oracle, helper-python]
  - text: The file records accept both the dotted and the underscore object literal, and ContainerFileObject.bytes may be null.
    proof: [record-tests, oracle, helper-python]
  - text: The three request param structs drop None fields when encoded and keep the declared key names.
    proof: [params-tests]
  - text: container_endpoints() returns the five endpoints of the pinned endpoints.json in file order with every field, and the defaults for is_multipart and returns_binary are false.
    proof: [catalog-tests, oracle, helper-python]
  - text: BaseContainerConfig is object safe, has the 17 methods, and the validate_environment, get_complete_url and get_error_class defaults behave as LiteLLM's base class.
    proof: [config-default-tests, oracle, helper-python]
  - text: Newly added helper cases replay through the shared helper corpus.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: record-tests
      why: record decoding, literal checks, encoding or field access is missing
      run: >-
        cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^api::container_contracts::(.*::)?record_/)'
    - id: params-tests
      why: the optional request param structs or their None skipping is missing
      run: >-
        cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^api::container_contracts::(.*::)?params_/)'
    - id: catalog-tests
      why: the embedded endpoint catalog or its defaults is missing
      run: >-
        cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^api::container_contracts::(.*::)?catalog_/)'
    - id: config-default-tests
      why: the provider trait or its three default bodies is missing
      run: >-
        cargo nextest run --locked -p betterlite-openai --no-tests=fail
        -E 'test(/^api::container_contracts::(.*::)?config_default_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3360)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3360 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3360/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added container contract cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/container_contracts-*")" &&
        grep -lE '^[[:space:]]+b3360:' tools/oracle/fuzz/corpus/helper_case/container_contracts-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
