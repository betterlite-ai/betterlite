id: B3360
title: Container contracts and endpoint catalog
description: >-
  Build the container record types, the provider contract and the container-file endpoint catalog in betterlite-openai
  as module api::container_contracts, in files records.rs, config.rs, error.rs, catalog.rs and endpoints.json under
  crates/betterlite-openai/src/api/container_contracts/. They live in betterlite-openai so the OpenAI and Azure
  container providers, the HTTP executors and the core selector can all import them without a cycle. Nothing here does
  HTTP, picks a provider or reads config.


  Records (records.rs, serde, field names equal LiteLLM's wire names). ExpiresAfter has anchor (only the string
  "last_active_at" is accepted) and minutes (i64). ContainerObject has id, object (only "container"), created_at (i64),
  status, expires_after (Option), last_active_at (Option<i64>), name (Option<String>) and hidden_params, a
  serde_json::Map that is never read from or written to JSON (LiteLLM's private _hidden_params, default empty).
  DeleteContainerResult has id, object (only "container.deleted") and deleted (bool). ContainerListResponse has object
  (only "list"), data (Vec<ContainerObject>), first_id and last_id (Option<String>) and has_more (bool, required).
  ContainerFileObject has id, object ("container.file" or "container_file"), container_id, bytes (Option<i64>),
  created_at, path, source and hidden_params. ContainerFileListResponse mirrors ContainerListResponse over
  ContainerFileObject. DeleteContainerFileResponse has id, object ("container.file.deleted" or "container_file.deleted")
  and deleted. Unknown JSON keys are ignored on decode, as pydantic does. A missing required field or a wrong literal is
  a decode error. Encoding is LiteLLM's model_dump: every field is written, absent options as null, hidden_params left out,
  in declaration order. Each record also gets field(name), the Rust form of get() and __getitem__: it returns the encoded
  value of a declared field, or None for any other name. Keep the objects as plain structs with an enum for each object
  literal, so a wrong literal cannot be built.


  Optional request params (records.rs). ContainerCreateOptionalParams has expires_after (Option<Map<String, Value>>),
  file_ids (Option<Vec<String>>), extra_headers and extra_body (Option<BTreeMap<String, String>>).
  ContainerCreateRequestParams is those four plus name (Option<String>). ContainerListOptionalParams has after
  (Option<String>), limit (Option<i64>), order (Option<String>), extra_headers and extra_query
  (Option<BTreeMap<String, String>>). All three skip None fields when encoded, because the Python types are
  TypedDict(total=False). Callers that filter params (B3361) build these structs; this task only declares them.


  Provider contract (config.rs). Trait BaseContainerConfig is object safe and has these methods in LiteLLM's order:
  get_supported_openai_params, map_openai_params(params, drop_params), validate_environment(headers, api_key),
  get_complete_url(api_base, litellm_params), transform_container_create_request, transform_container_create_response,
  transform_container_list_request, transform_container_list_response, transform_container_retrieve_request,
  transform_container_retrieve_response, transform_container_delete_request, transform_container_delete_response,
  transform_container_file_list_request, transform_container_file_list_response, transform_container_file_content_request,
  transform_container_file_content_response and get_error_class. Parameter names and order are LiteLLM's. Headers and
  request bodies are BTreeMap<String, String> and serde_json::Map<String, Value>; litellm_params is a serde_json::Map<String, Value>
  because the typed GenericLiteLLMParams belongs to the router types. Response transforms take the raw body as &[u8] and
  return Result<_, ContainerError>; the logging_obj argument is dropped because no container provider reads it. The
  request transforms that return a tuple in LiteLLM return (String, Map) for URL and params. Required methods have no
  body. Three have LiteLLM's base body as a default: validate_environment returns an empty map, get_complete_url returns
  api_base unchanged or ContainerError::ApiBaseRequired (message "api_base is required") when it is None, and
  get_error_class returns a BaseLlmException carrying status_code, message and headers.


  Errors (error.rs). BaseLlmException is a struct with status_code (u16), message and headers (BTreeMap<String, String>);
  its Display is the message. ContainerError has ApiBaseRequired, Decode(String) for a body that fails the record shapes,
  and Upstream(BaseLlmException). Use thiserror.


  Catalog (catalog.rs plus endpoints.json). Copy the pinned litellm/containers/endpoints.json byte for byte into
  endpoints.json and include it with include_str!. ContainerEndpoint has name, async_name, path, method, path_params,
  query_params, response_type, is_multipart (default false) and returns_binary (default false). container_endpoints()
  parses the embedded text once and returns the five entries in file order: list_container_files, upload_container_file,
  retrieve_container_file, delete_container_file, retrieve_container_file_content. The embedded text is trusted source data, so a parse
  failure is a build-time bug that a test catches, not a runtime error path. Lookup by name or async_name, URL building and
  the response model selection are B3363's, not here.


  Budget from the owned LiteLLM lines (about 335 non-blank lines): about 240 production lines, 250 test lines, 100 oracle
  adapter lines and 20 module wiring lines.
scope:
  paths:
    - crates/betterlite-openai/src/api/container_contracts.rs
    - crates/betterlite-openai/src/api/container_contracts/**
    - tools/oracle/cases/helpers/container-contracts/**
    - "tools/oracle/fuzz/corpus/helper_case/container_contracts-*"
    - tools/oracle/helpers/b3360.py
    - tools/oracle/helpers/b3360/**
    - tools/oracle/src/helpers/openai/b3360.rs
    - tools/oracle/src/helpers/openai/b3360/**
  lint_tables: false
