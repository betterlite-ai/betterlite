id: B318
title: Usage v2 batched reads and pre-call accounting
description: 'Implement usage-based-routing-v2 candidate selection using B371 accounting and B382 request-scoped
  batched reads. Rank by absolute TPM and preserve candidate/tie order with an injected random choice.
  Wire the variant into B016 and consume B013 estimates; no callback or reservation logic is duplicated.
  Configuration boundary keys introduced or consumed here: routing_strategy. Pinned declaration defaults:
  routing_strategy=''simple-shuffle''. Resolve env values once in betterlite-config, never in router code.
  Implement the owned native service in crates/betterlite-router/src/usage_routing_v2.rs. Add ProbeOperation::UsageRoutingV2
  in tools/oracle/src/router_probes/mod.rs and the corresponding B318 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_strategy/lowest_tpm_rpm_v2.py:
  LowestTPMLoggingHandler_v2._return_potential_deployments (L340-L391), LowestTPMLoggingHandler_v2._common_checks_available_deployment
  (L393-L452), LowestTPMLoggingHandler_v2.usage_counter_keys (L454-L465), LowestTPMLoggingHandler_v2.async_get_available_deployments
  (L467-L573), LowestTPMLoggingHandler_v2.get_available_deployments (L575-L672). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports.'
