deviations: []
out_of_scope:
- Optional strategy-independent limit enforcement (B319).
- B371 owns usage v2 reservation and callback accounting; consume its tested public interface.
- 'litellm/router_strategy/lowest_tpm_rpm_v2.py: B371 owns: LowestTPMLoggingHandler_v2.__init__ (L91-L99),
  LowestTPMLoggingHandler_v2.pre_call_check (L101-L174), LowestTPMLoggingHandler_v2.async_pre_call_check
  (L176-L250), LowestTPMLoggingHandler_v2.log_success_event (L252-L292), LowestTPMLoggingHandler_v2.async_log_success_event
  (L294-L338).'
- 'litellm/router_strategy/lowest_tpm_rpm_v2.py: B382 owns: PrefetchedUsage.covers (L51-L52), PrefetchedUsage.values_for
  (L54-L57), PrefetchedUsage.scoped (L61-L66), PrefetchedUsage.active (L69-L70).'
pitfalls:
- V2 selection uses an RPM equality boundary that differs from its increment-after-selection check.
- Fail-open storage behavior must be distinguished from an explicit RateLimitError.
- Do not reuse a prefetched result across requests.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
