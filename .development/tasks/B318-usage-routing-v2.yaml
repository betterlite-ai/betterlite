id: B318
title: Usage v2 batched reads and pre-call accounting
description: Implement usage-based-routing-v2 on B304's batched store. Separate candidate selection, pre-call
  RPM increments and success TPM updates so hooks do not double-count requests already observed by B016.
  Respect B013 estimates and request-scoped prefetch ownership. Exercise concurrent reservations with
  an injected store and local Redis, including a failed shared read. Use the existing Rust crate boundaries
  from B004 and B008; integrate through the server when the provider dispatcher or callbacks live in another
  core crate. This task's source slices are the linked ranges, not a port of their Python classes. Add
  the listed oracle cases and the matching adapters to B301's component runner where state is not observable
  over HTTP; adapters call production logic and never reproduce it. Use deterministic candidate sets or
  supplied random samples for comparisons, and separate seeded distribution tests for random choices.
  Extend the existing config_yaml fuzz target and committed corpus for every newly accepted config form;
  unsupported keys still fail by full path. Keep the implementation, adapters and tests within 800 changed
  lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/usage-routing-v2/**
  - tools/oracle/src/router_probes/usage_routing_v2/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/usage_routing_v2.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L91-L338
  why: Atomic pre-call RPM increments and success usage.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L340-L672
  why: Batched candidate selection, limits and tie selection.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the usage_routing_v2 prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(usage_routing_v2)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/usage-routing-v2/batched-counter-read.yaml
- tools/oracle/cases/routing/usage-routing-v2/lowest-tpm-random-tie-set.yaml
- tools/oracle/cases/routing/usage-routing-v2/rpm-local-versus-shared-boundary.yaml
- tools/oracle/cases/routing/usage-routing-v2/concurrent-last-slot.yaml
- tools/oracle/cases/routing/usage-routing-v2/pre-call-cache-failure.yaml
- tools/oracle/cases/routing/usage-routing-v2/success-counted-once.yaml
- tools/oracle/cases/routing/usage-routing-v2/prefetch-not-reused.yaml
deviations: []
out_of_scope:
- Optional strategy-independent limit enforcement (B319).
pitfalls:
- V2 selection uses an RPM equality boundary that differs from its increment-after-selection check.
- Fail-open storage behavior must be distinguished from an explicit RateLimitError.
- Do not reuse a prefetched result across requests.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
