  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L493-L498
    why: A request with api_key or api_base in data goes to the router when one exists, else to the SDK function.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L611-L660
    why: Eight video kinds with no model go straight to the SDK function; then the team, recognized-model, pass-through, default-deployment and deployment-name branches.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L682-L723
    why: The video try/except around the router call, the A2A branch, the user_model branch and the final ProxyModelNotFoundError.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L93-L103
    why: The route type to path map for the nine video call types.
dod:
  - text: VideoCallKind names the nine calls with LiteLLM's call type text, and VideoRouterCalls has one method per call with the signature in the description.
    proof: [plan-types]
  - text: With no model (none or empty) and a router, every kind except Generation plans Direct, and Generation plans NotFound with an empty model when the model is missing.
    proof: [plan-no-model]
  - text: A recognized model, a team-mapped model and an admin-without-team public model plan Router with the right model name, and a request carrying api_key or api_base plans Router with a router and Direct without one.
    proof: [plan-known-model]
  - text: For an unknown model, pass_through_all_models plans Direct, a default deployment or wildcard plans Router, a deployment name plans Router with specific_deployment true, and the seven fallback kinds plan Router while Generation and List plan NotFound.
    proof: [plan-unknown-model]
  - text: With no router, user_model set plans Direct and user_model unset plans NotFound.
    proof: [plan-no-router]
  - text: The nine executors are returned by video_executors under the nine call type names, and a call type that is not a video call is not among them.
    proof: [executor-names]
  - text: Each executor reads its arguments by the names the SDK call uses, passes other keys as loose keywords, and returns Bytes for avideo_content and Json for the rest.
    proof: [executor-calls]
  - text: custom_llm_provider and client are removed from the arguments before the generic call, and an upload survives the JSON round trip with filename, content type and bytes unchanged.
    proof: [wrapper-args]
  - text: A wrapper error from the router or the SDK call comes back as VideoRouterError with the original error inside.
    proof: [wrapper-errors]
checks:
  optional: [mutants]
  commands:
    - id: plan-types
      why: a call kind, its name text or a trait method is missing
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_router_calls::tests::types_/)'
    - id: plan-no-model
      why: a modelless call does not go direct, or Generation takes the shortcut
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_router_calls::tests::plan_no_model/)'
    - id: plan-known-model
      why: a recognized, team or admin model, or an api_key request, plans the wrong path
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_router_calls::tests::plan_known_model/)'
    - id: plan-unknown-model
      why: the pass-through, default deployment, deployment name or fallback-kind branch is missing or out of order
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_router_calls::tests::plan_unknown_model/)'
    - id: plan-no-router
      why: a request with no router ignores user_model
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::video_router_calls::tests::plan_no_router/)'
    - id: executor-names
      why: a video call has no executor, or a foreign call type is registered
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_video::tests::executor_names/)'
    - id: executor-calls
      why: an executor reads the wrong argument names or returns the wrong reply form
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_video::tests::executor_calls/)'
    - id: wrapper-args
      why: custom_llm_provider or client reaches the generic call, or an upload changes in the round trip
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_video::tests::(wrapper_args|upload_)/)'
    - id: wrapper-errors
      why: a router or SDK error is swallowed or replaced
      run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_video::tests::wrapper_errors/)'
oracle_cases: []
deviations:
  - what: A Generation request with no model key gets the model-not-found error with an empty model name.
    why: LiteLLM reads data["model"] directly and raises a KeyError (a 500) at that point; betterlite reports the same error as every other unmatched model.
  - what: Uploads cross the generic call as base64 inside the JSON argument map.
    why: B6021's GenericRequest is a JSON map and cannot hold raw buffers. The provider sees the same filename and bytes, so no client can tell.
  - what: The nine synchronous Router.video_* methods are not built.
    why: Nothing calls them at the pin and the gateway has no blocking SDK surface; see out_of_scope.
out_of_scope:
  - "Router.video_generation, video_list, video_status, video_content, video_remix, video_create_character, video_get_character, video_edit and video_extension (router.py L2123-L2141, built by the sync branch of factory_function): no caller at the pin. The proxy only calls the a-prefixed names."
  - "The generic engine (_ageneric_api_call_with_fallbacks, its helper and _dispatch_generic_call_type) is B6021; selection, retries, slots and the refusal check are B016, B017, B303 and B310. This task only plugs executors into it."
  - "The branches of _route_request_single_attempt that are not video-specific (user_config, router_settings_override, batch completion, the blocked-model check, the A2A branch) belong to B014 and B004."
  - "The SDK functions the executors call: B3338 (generation), B3339 (status, content), B3340 (remix, list), B3341 (characters) and B3342 (edit, extension). Route handlers, provider and model lookup from the video id: B3343, B3344, B3345 and B6360."
  - "The server implementation of VideoRouteView over B016 and B302 and the construction of RouterGeneric with video_executors: B8631 builds RouterGeneric with video_executors; VideoRouteView stays with the architect, see notes."
pitfalls:
  - "The proxy's try/except around the router call for the seven fallback kinds never catches a router failure: async_wrapper is an async def, so the call returns an unawaited coroutine and the error surfaces at the caller's await, outside the try. plan_video_route therefore returns Router with no fallback."
  - "async_wrapper takes custom_llm_provider and client as named parameters and does not pass them on, so a status call that the route set to custom_llm_provider=openai reaches the provider with the deployment's provider instead."
  - "avideo_list is in the factory and in the router branch for a known model, but it is left out of the try/except list, so an unknown model on a list call ends in ProxyModelNotFoundError rather than a router attempt."
  - "avideo_generation is missing from the no-model shortcut list (route_llm_request.py L616-L636); with a router it always needs a model."
  - "Step 5 uses is_recognized_model, which also matches a deployment id and a model_group_alias; a model in model_names that an admin with a team does not match falls through to NotFound."
  - "specific_deployment=True is added only for the deployment_names branch, and the generic attempt pops it before selection, so it never reaches the SDK call."
  - "The api_key or api_base check runs before the model checks, so a status call with api_base in data goes to the router even when the model is empty."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
