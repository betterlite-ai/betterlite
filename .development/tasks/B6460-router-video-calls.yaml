  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L6835-L6935
    why: async_wrapper takes custom_llm_provider and client as named parameters and sends the nine video call types to _dispatch_generic_call_type without them.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L5272-L5414
    why: The generic call with fallbacks and its attempt, which B6021 builds; the video wrappers run on it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L1598-L1611
