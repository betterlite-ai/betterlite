id: B6460
title: Router video call wrappers and router-first route choice
description: >-
  Give the nine async video calls a router path, and decide when a video request takes it. LiteLLM builds avideo_generation, avideo_list, avideo_status, avideo_content,
  avideo_remix, avideo_create_character, avideo_get_character, avideo_edit and avideo_extension on the Router with factory_function (router.py L2122-L2141), and
  route_llm_request.py picks router or SDK for each. No other task owns either part, so the four route tasks (B3343, B3344, B3345, B6360) call the SDK functions directly today. This task
  builds the wrappers and the choice, in two places that do not form a cycle. betterlite-core cannot import betterlite-sdk (the sdk crate depends on core), so the core side
  holds only plain types and traits, and the sdk side implements them.

  Core side, module `api::video_router_calls` in betterlite-core. (1) `VideoCallKind`, an enum with the nine calls, and one method `name` that returns the LiteLLM call type text
  ("avideo_generation", "avideo_status" and so on). (2) `VideoCallArgs`, a struct with `fields: serde_json::Map<String, Value>` (every key the SDK call would get as an argument or loose keyword,
  including `model`, `video_id`, `prompt`, `extra_headers`), `uploads: Vec<VideoUpload>` and `specific_deployment: bool` (default false). `VideoUpload` has `field` (the key it belongs to, such as
  "input_reference" or "video"), `filename`, `content_type: Option<String>` and `bytes: Vec<u8>`. (3) `VideoReply`, an enum: `Json(Value)` for a video object, a list page or a character, and `Bytes(Vec<u8>)` for avideo_content.
  (4) `VideoRouterCalls`, an async trait with nine methods named exactly like the LiteLLM calls, each `async fn avideo_status(&self, model: &str, args: VideoCallArgs) -> Result<VideoReply, VideoRouterError>`.
  The route dispatch entries call these. `VideoRouterError` wraps the router error and the SDK error as two cases, each by `#[from]`, and reports `NotFound` for an unmatched model.

  Route choice, the same module. `VideoRouteView` is a trait the server implements over B8351's `CatalogQueries` and B302's catalog (`is_recognized_model` and `map_team_model` forward to `CatalogQueries::is_recognized_model` and `CatalogQueries::map_team_model`); its methods are `is_recognized_model(&self, model: &str) -> bool`,
  `map_team_model(&self, model: &str, team_id: &str) -> Option<String>`, `team_public_model_names_has(&self, model: &str) -> bool`, `model_names_has(&self, model: &str) -> bool`,
  `pass_through_all_models(&self) -> bool`, `has_default_or_pattern(&self) -> bool` and `deployment_names_has(&self, model: &str) -> bool`.
  `plan_video_route(input: &VideoRouteInput, view: Option<&dyn VideoRouteView>) -> VideoRoute` copies the video part of `_route_request_single_attempt` (route_llm_request.py L493-L723). `VideoRouteInput` holds
  the `VideoCallKind`, `model: Option<&str>`, `team_id: Option<&str>`, `is_proxy_admin_without_team: bool`, `has_api_key_or_base: bool` (data has `api_key` or `api_base`) and `user_model: Option<&str>`.
  `VideoRoute` is `Direct`, `Router { model: String, specific_deployment: bool }` or `NotFound { model: String }`. The caller runs `Direct` through the B3338-B3342 SDK function and `Router` through `VideoRouterCalls`.
  Rules, in LiteLLM's order. (1) `has_api_key_or_base`: with a router the plan is `Router` with the given model, without one it is `Direct`. (2) No router (view is none): `Direct` when `user_model` is set, else `NotFound`.
  (3) With a router, every kind except Generation goes `Direct` when the model is none or "". Generation has no such shortcut. (4) A team id that `map_team_model` answers with a name gives `Router` with that name.
  (5) `is_recognized_model(model)` is true, or the request is a proxy admin without a team and the model is not in `model_names` but is in the team public names: `Router`. (6) Otherwise, if the model is not in `model_names`:
  `pass_through_all_models` gives `Direct`; a default deployment or any wildcard pattern gives `Router`; a model in `deployment_names` gives `Router` with `specific_deployment` true; and for the seven kinds Status, Content, Remix, CreateCharacter,
  GetCharacter, Edit and Extension the plan is `Router` (LiteLLM wraps this call in a try/except that falls back to the SDK function; see pitfalls for why that fallback never runs). Anything left, including Generation and List, is `NotFound`.
  A model in `model_names` that step 5 did not take (an admin with a team) falls to `NotFound` too, as in LiteLLM. A missing model on Generation is `NotFound` with an empty name (see deviations).

  Sdk side, module `router_video` in betterlite-sdk. It plugs the nine calls into B6021's `RouterGeneric`: one `GenericCallExecutor` per call kind (a small struct holding the matching B3338-B3342 entry point by constructor), named
  `VideoCallExecutor`, plus `RouterVideo`, which implements `VideoRouterCalls` by building a B6021 generic request and running the dispatch for that call type name. B6021's `GenericRequest` is a JSON map, so `RouterVideo` turns each `VideoUpload`
  into a JSON object `{"filename", "content_type", "data_base64"}` under its `field` key, and the executor turns it back into the named buffer the SDK call takes (add `base64` to betterlite-sdk's Cargo.toml). An executor reads its arguments from the
  map by the same names the route tasks use for the SDK call (B3338 for generation, B3339 for status and content, B3340 for remix and list, B3341 for the two character calls, B3342 for edit and extension), passes every other key as a loose keyword, and
  returns `VideoReply::Json` of the result, or `VideoReply::Bytes` for avideo_content. `RouterVideo::new` takes the `RouterGeneric` handle and returns the nine executors through `video_executors(...)`, a function that returns `Vec<(String, Arc<dyn GenericCallExecutor>)>`
  for the caller that builds `RouterGeneric` (see notes). `RouterVideo` removes `custom_llm_provider` and `client` from the arguments before it hands them to the generic call, because the router wrapper swallows both as named
  parameters; the deployment's own provider (B014's `provider_for_generic_call`) is put back by B6021's attempt.

  Counts: about 40 non-blank LiteLLM lines in factory wiring and about 110 in the route branches. Budget 330 implementation, 330 tests, 60 for the base64 upload round trip. No oracle cases: the choice sits inside an async proxy function that reads proxy_server
  globals, and the route tasks own the HTTP cases. No fuzz target: nothing here parses bytes. Tests are rstest functions with fakes for the view, the generic dispatch and the SDK calls. Core tests are in `api::video_router_calls::tests` with prefixes `plan_` and `types_`;
  sdk tests are in `router_video::tests` with prefixes `wrapper_`, `executor_` and `upload_`.
scope:
  paths:
    - crates/betterlite-core/src/api/video_router_calls.rs
    - crates/betterlite-core/src/api/video_router_calls/**
    - crates/betterlite-sdk/src/router_video.rs
    - crates/betterlite-sdk/src/router_video/**
    - crates/betterlite-sdk/Cargo.toml
  lint_tables: false
references:
