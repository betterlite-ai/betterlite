- text: 'compile_classification: Non-dict rules are skipped silently. Require string pattern and dict model_info,
    compile with IGNORECASE re.search semantics (no implicit anchors). Missing fill_missing_for_providers means
    empty; when present it must be list/tuple of strings (empty allowed), then becomes a set. No provider key means
