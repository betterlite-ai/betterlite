deviations:
- what: Unsupported valid Python regex constructs or exhausted regex work emit a warning naming the pattern and
    skip that rule; oversized rule-list input fails the typed configuration decoder.
  why: Retain B313 bounded-regex and 1048576-byte policy without unbounded expression execution.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L143-L152
out_of_scope:
- All functions in fallback_generalizations.py are owned here; B313 is integration only. Catalog parsing/reload
  orchestration stays B193, provider inference B174, metadata lookup B2219.
pitfalls:
- A matched empty capability rule returns an empty map, while an empty fill-missing result returns None.
budget:
  max_changed_lines: 725
  max_new_expects: 0
review_level: standard
