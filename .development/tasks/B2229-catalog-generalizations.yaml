id: B2229
title: Shared catalog generalization engine
description: >-
  Move the pure fallback-generalization rule engine below provider resolution and metadata lookup. B313 keeps router/server
  integration; B193 installs parsed catalog rules. Compile case-insensitive Python-compatible regular expressions
  once with a maintained bounded implementation, preserving ordered matching and warnings.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/litellm_core_utils/fallback_generalizations.py:
  _resolve_legacy_extends L69-L95; _parse_fill_missing_for_providers L114-L127; _compile_rule L130-L181; _FallbackGeneralizations.__init__
  L187-L191; set_rules L193-L199; match_routing L201-L207; match_capabilities L209-L215; match_fill_missing L217-L230;
  set_fallback_generalizations L236-L244; get_fallback_generalization_rules L247-L249; match_routing_generalization
  L252-L257; match_capability_generalizations L260-L266; match_fill_missing_generalizations L269-L277.


  Named case contracts: install_and_legacy_extends: Initial raw rules/list and all compiled collections are empty.
  set_rules accepts a list only, otherwise installs []; keep the original raw list for the accessor while compiling
  expanded copies. A parent index uses dict rules with string name and dict model_info; duplicate names use the
  last parent. A string extends resolves one level against raw parent model_info, child keys win; missing parent,
  nonstring extends, non-dict child info and non-dict rules pass through unchanged. No recursion/cycle traversal.
  compile_classification: Non-dict rules are skipped silently. Require string pattern and dict model_info, compile
  with IGNORECASE re.search semantics (no implicit anchors). Missing fill_missing_for_providers means empty; when
  present it must be list/tuple of strings (empty allowed), then becomes a set. No provider key means capability-only,
  even empty model_info. A string litellm_provider as the sole key means routing-only; mixed provider and other
  keys means both. A present nonstring provider rejects the rule. Ignore other rule fields including description.
  malformed_rule_warnings: Malformed pattern/info warns LiteLLM: skipping malformed fallback generalization rule
  {name-or-pattern} (needs string 'pattern' and dict 'model_info'). Invalid regex warns LiteLLM: skipping fallback
  generalization rule with invalid regex {pattern!r}: {error}. Bad fill list warns LiteLLM: skipping malformed fallback
  generalization rule {name-or-pattern} ('fill_missing_for_providers' must be a list of provider strings). Bad provider
  warns LiteLLM: skipping invalid fallback generalization rule {name-or-pattern}: 'litellm_provider' in 'model_info'
  must be a string. Warning order follows compile order; use name by key presence, including None. first_routing_match:
  Empty model yields None even for an empty-pattern rule. Otherwise return the first matching routing provider (including
  empty string), with case-insensitive substring search unless the expression anchors itself. Later matches do not
  override routing. capability_union: Empty model or no matching capability rule returns None. Merge all matching
  rule maps in file order, later keys win, including explicit None/False and legacy provider keys. A matched empty
  capability map returns {}, not None. Return a new map without mutating stored rules. fill_missing_projection:
  Empty model/provider or no flagged matching rule returns None. Provider membership is case-sensitive. Merge matching
  flagged capability maps in file order, removing litellm_provider; an empty merged result becomes None. This returns
  proposed fields only; B2219 fills absent entry keys and retains explicit null/False values.


  Outside-byte boundary: decode_generalization_rules consumes bounded rule-list JSON bytes, maximum 1048576
  bytes, used by catalog/config installation before compilation in crates/betterlite-models/src/catalog_generalizations.rs
  or its scoped child module. Use that production decoder from the request path, Rust oracle adapter and cargo-fuzz
  target crates/betterlite-models/fuzz/fuzz_targets/model_generalization_rules.rs. Add valid, malformed, truncated
  and boundary corpus inputs and adjacent test replays_the_model_generalization_rules_corpus that checks outcome
  categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Implement crates/betterlite-models/src/catalog_generalizations.rs with adjacent tests under catalog_generalizations/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation catalog_generalizations in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function catalog_generalizations_cases in betterlite-models with these exact named cases (one per
  oracle file): install_and_legacy_extends, compile_classification, malformed_rule_warnings, first_routing_match,
  capability_union, fill_missing_projection. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/catalog_generalizations* using HelperCase: kind:
  helper and the externally tagged catalog_generalizations variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_catalog_generalizations that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 160 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 260 production lines, 250 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 65 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 720 planned, 725 maximum changed lines.
