deviations: []
out_of_scope:
- Image/document accounting and maximum-output adjustment are B197.
- Monetary cost calculation is B068.
- Tool formatting and catalog-based model-name normalization are B259; engine/backend selection is B195, including
  the undecided HF acquisition policy.
pitfalls:
- 'The oracle helper for this task is pre-registered as token_count in the tokenizer group. Replace the stub Op in tools/oracle/src/helpers/tokenizer/token_count.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/token_count.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Rust byte length is not Python string length.
- A named tool_choice contributes a different overhead from none or auto.
- Keep default normalization parity separate from whether a future provider offers an exact native token-count endpoint.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
