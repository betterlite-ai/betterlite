id: B196
title: Text, message and tool token counting
description: >-
  Build text/message/tool token accounting on B195's engines in betterlite-tokenizer/count. Compose B259 model normalization,
  encoding selection and tool-schema formatting with this task's legacy message constants, function argument counts,
  completion priming and tool_choice adjustments. Implement disable_token_counter and supported bundled-engine selection
  through injected settings. Include the pinned long-input sampling/extrapolation algorithm, measuring Unicode scalar
  counts rather than UTF-8 byte counts and using checked integer/rational arithmetic with Python's ties-to-even
  rounding. Add token_count helper cases for threshold boundaries and known/unknown model mappings; avoid declaring
  all counts exact because LiteLLM itself samples large inputs. Add a token_request fuzz target for the typed helper
  input while reusing B004's chat parser at the HTTP boundary.  Seed B171's shared helper_case corpus with every
  added operation and replay it through the common typed parser. Depend directly on B193 for open_ai_chat_completion_models,
  anthropic_models and cohere_models. For tiktoken counts, encode successive Unicode-scalar slices of TIKTOKEN_ENCODE_CHUNK_SIZE_CHARS
  (default 1024, range 1-4096) and sum; whole-string BPE differs at boundaries. Config resolves TOKEN_COUNTER_MAX_EXACT_CHARS
  (default 4000000, range 1-1000000000); threshold cases set a small value in their environment. Above the exact
  threshold sample/extrapolate rather than reject; the HTTP body limit supplies the oversized-request cap. Invalid
  bounded-integer settings warn and fall back. Do not implement undecided HF family selection or model_info.custom_tokenizer
  from B195. Write the behavior rstest functions text_tokens_token_count_tests_behavior in adjacent tests.rs files, with
  a named case for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation token_count is already registered; each operation
  has its own Rust and Python adapter file and corpus seed. Own token_counter.py 364-662 and use B259 for 663-690
  and 954-1051. The utils.py tokenizer backend and supported bundled-engine selection are B195; do not add HF acquisition
  or decide its fallback. Budget 300 counting/sampling, 100 adapters, 240 tests, 70 fuzz/replay and 60 config/wiring
  (770 total).


  Own main.py _load_module_encoding L9379-L9382 and _get_encoding L9385-L9391 as the shared default-tokenizer access
  seam. It loads the module encoding on the first access only and returns the same cached engine subsequently; initialization
  failures do not populate the cache. B195 owns the actual default engine construction and lazy encoding export.
  Inject that engine into callers; no Python globals in production. Count 11 nonblank source lines; add 10 production
  and 20 test/adapter lines to the 770-line budget (800 total). Add token_count helper case shared_default_encoding
  and standalone test default_encoding_initializes_once.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-tokenizer/Cargo.toml
  - crates/betterlite-tokenizer/src/count.rs
  - crates/betterlite-tokenizer/src/count/**
  - crates/betterlite-tokenizer/fuzz/**
  - crates/betterlite-config/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/tokenizer/token_count.rs
  - tools/oracle/src/helpers/tokenizer/token_count/**
  - tools/oracle/helpers/token_count.py
  - tools/oracle/helpers/token_count/**
  - tools/oracle/cases/helpers/token-count/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L374-L690
  why: Request validation, message overhead, tool choice, extrapolation and encoding choice.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L364-L370
  why: Chunk every tiktoken count before summing.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L450-L467
  why: Chunk, exactness and concurrency defaults/ranges.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L9379-L9397
  why: Lazy default engine accessor.
dod:
- text: All listed text, message, tool and long-input count cases match Python exactly as integers.
  proof:
  - oracle
  - helper-python
- text: Unicode chunk/sample boundaries, checked arithmetic and disabled counting work; accepted large inputs sample
    rather than fail, and HTTP body limits remain the request cap.
  proof:
  - token-count-tests
- text: The token request and extended config parser corpora replay through the production entry points.
  proof:
  - token-request-corpus
  - config-yaml-corpus
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
- text: Shared default encoding initializes once and a failed initialization can retry.
  proof:
  - shared-default-encoding
  - oracle
  - helper-python
checks:
  optional:
  - mutants
  commands:
  - id: token-count-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/::text_tokens_token_count_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: token-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-tokenizer/fuzz/corpus/token_request)"
      && test -f crates/betterlite-tokenizer/fuzz/fuzz_targets/token_request.rs && test -n "$(ls -A crates/betterlite-tokenizer/fuzz/corpus/token_request)"
      && cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(replays_the_token_request_corpus)'
  - id: config-yaml-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml)"
      && grep -rlq 'TOKEN_COUNTER_MAX_EXACT_CHARS' crates/betterlite-config/fuzz/corpus/config_yaml && grep -rlq
      'TIKTOKEN_ENCODE_CHUNK_SIZE_CHARS' crates/betterlite-config/fuzz/corpus/config_yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs
      && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)" && cargo nextest run --locked -p betterlite-config
      --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'token_count' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: shared-default-encoding
    why: Default encoding is re-created or a failed initialization is cached.
    run: cargo nextest run --locked -p betterlite-tokenizer --no-tests=fail -E 'test(/::default_encoding_initializes_once$/)'
