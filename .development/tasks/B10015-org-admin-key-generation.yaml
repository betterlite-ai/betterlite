id: B10015
title: Org admin key generation switch
description: >-
  Implement check_org_admin_can_generate_keys (rbac_utils.py L71-L96) and its one setting. B055's
  /key/generate and service-account generation call it to check organization-admin scope. B864 keeps
  check_feature_access_for_user, the agents and vector stores guard, and calls nothing here.


  The guard. Module org_admin_keys in betterlite-server, crates/betterlite-server/src/org_admin_keys.rs
  with its tests in org_admin_keys/tests.rs. The file is an empty stub its parent declares, and it sits
  outside B864's management_rbac on purpose, so the two tasks never share files.
  check_org_admin_can_generate_keys returns immediately for every role except exact org_admin (enum or
  equivalent string). For that role, falsy disable_key_generate_for_org_admin passes and truthy fails
  HTTP 403 detail.error 'key generation is disabled for org admins. Contact your proxy admin.'. A caller
  with an org-admin membership but global role internal_user is not blocked by this helper; general key
  permissions remain the caller's responsibility. No paid-tier branch, license bypass, local
  ProxyException type/param/code or warning is added.


  The setting. Config section org_admin_keys in betterlite-config,
  crates/betterlite-config/src/sections/org_admin_keys.rs with its tests in org_admin_keys/tests.rs, an
  empty stub sections.rs declares. It reads general_settings.disable_key_generate_for_org_admin, default
  False, with no environment binding. The Python branch uses truthiness, not 'is True': null, empty and
  zero are false and a nonempty string such as 'false' is true if present in the runtime settings map. Do
  not invent int parsing, startup fallback or a warn-and-ignore path. The guard takes the loaded section
  value as an argument and reads no global.


  Config tests loads_org_key_switch, org_key_switch_defaults_false and org_key_runtime_truthiness call
  B002's loader and consume the value in the guard, with true, false, null and the accepted scalar
  truthiness cases. Add config_yaml seeds org-admin-keys-* with the key nested under general_settings; no
  second settings parser is introduced.


  Oracle. Helper cases on the b10015 operation with an injected immutable settings snapshot and no
  database; Python calls the pinned guard, not an endpoint or a copied predicate. Compare exact 403
  detail objects.
scope:
  paths:
    - crates/betterlite-server/src/org_admin_keys.rs
    - crates/betterlite-server/src/org_admin_keys/**
    - crates/betterlite-config/src/sections/org_admin_keys.rs
    - crates/betterlite-config/src/sections/org_admin_keys/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/org-admin-keys-*
    - tools/oracle/cases/helpers/org-admin-keys/**
    - tools/oracle/fuzz/corpus/helper_case/org-admin-keys-*
    - tools/oracle/helpers/b10015.py
    - tools/oracle/helpers/b10015/**
    - tools/oracle/src/helpers/server/b10015.rs
    - tools/oracle/src/helpers/server/b10015/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/rbac_utils.py#L71-L96
    why: Owned. check_org_admin_can_generate_keys; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/rbac_utils.py#L90-L95
    why: general_settings.disable_key_generate_for_org_admin default and read site.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L2052
    why: Call site in generate_key_fn; B055 calls the guard here and in service-account generation.
dod:
  - text: An org_admin caller is refused with the exact 403 detail when disable_key_generate_for_org_admin is truthy and passes when it is falsy; every other role passes without reading the setting.
    proof: [behavior-tests, oracle, helper-python]
  - text: A caller whose global role is internal_user passes even with an org-admin membership, and the 403 detail carries no type, param or code.
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: disable_key_generate_for_org_admin loads through the production config boundary with its False default and the source's truthiness.
    proof: [config-tests, config-corpus]
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The org admin guard is missing, reads the wrong role or answers the wrong detail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^org_admin_keys::tests::/)'
    - id: helper-python
      why: The b10015 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10015.py tools/oracle/helpers/b10015)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10015 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/org-admin-keys-*")" &&
        grep -lE 'b10015"?:' tools/oracle/fuzz/corpus/helper_case/org-admin-keys-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-server --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The config loader rejects, ignores or misresolves disable_key_generate_for_org_admin.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::org_admin_keys::/)'
    - id: config-corpus
      why: No new config seed carries the key, or the production config replay fails.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/org-admin-keys-*")" &&
        grep -rlq "disable_key_generate_for_org_admin" crates/betterlite-config/fuzz/corpus/config_yaml/org-admin-keys-* &&
        cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/org-admin-keys/org-admin-disabled.yaml
  - tools/oracle/cases/helpers/org-admin-keys/org-role-not-membership.yaml
deviations: []
out_of_scope:
  - "check_feature_access_for_user and the four agents and vector stores settings: B864."
  - "The key generation routes and their order of checks: B055."
pitfalls:
  - disable_key_generate_for_org_admin checks the global role, not membership rows.
  - A nonempty string 'false' is truthy in the source's runtime settings map.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
