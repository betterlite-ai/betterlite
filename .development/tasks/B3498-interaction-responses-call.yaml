  - text: "_events_for_chunk returns empty list for falsy chunks; on OutputTextDeltaEvent extracts delta_text and item_id, accumulates text, synthesizes missing interaction.created and step.start events, appends delta event and returns list; on ResponseCreatedEvent or ResponseInProgressEvent synthesizes interaction.created if not sent, resolves _interaction_id and returns list; on ResponseCompletedEvent synthesizes step.stop (if content started), appends completion event, sets _sent_completion_event and finished flags and returns list."
    proof: [responses-handler-tests]
  - text: "ID fallback: when OutputTextDeltaEvent provides item_id, use it; fallback to interaction_{id(self)} if missing. Preserve _interaction_id once set so terminal events use the same ID as start events for correlation."
    proof: [responses-handler-tests]
  - text: "Text accumulation in collected_text appends delta_text from every OutputTextDeltaEvent chunk; empty string default."
    proof: [responses-handler-tests]
  - text: "_build_terminal_events_on_eof returns empty list if _sent_completion_event already; otherwise synthesizes step.stop (if sent_content_start is true), builds completion event with fallback ID (either _interaction_id or id(self) hash), sets _sent_completion_event and returns list."
    proof: [responses-handler-tests]
  - text: "__iter__ and __next__ use deque drain to return pending events before fetching next chunk, call _events_for_chunk to build event list, extend _pending_events, and raise StopIteration after flushing _build_terminal_events_on_eof on upstream StopIteration."
    proof: [responses-handler-tests]
  - text: "__aiter__ and __anext__ follow sync logic but with async iteration (await __anext__) and raise StopAsyncIteration instead of StopIteration."
