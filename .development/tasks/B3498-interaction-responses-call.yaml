  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/streaming_iterator.py#L215-L265
    why: Sync (__iter__/__next__) and async (__aiter__/__anext__) iterator protocols with event queue drain logic

