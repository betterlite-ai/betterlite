    proof: [responses-handler-tests]
  - text: "_build_text_delta_event returns a StreamingResponse with event_type step.delta, index 0 and delta with type text and the given text string."
    proof: [responses-handler-tests]
  - text: "_build_content_stop_event returns a StreamingResponse with event_type step.stop and index 0, with no other fields."
