deviations:
  - what: "The Responses operation is called through unresolved dynamic dispatch (vars(litellm)[\"responses\"] and vars(litellm)[\"aresponses\"]) rather than a direct import, since B932 cannot be a direct prerequisite while the reverse umbrella dependency exists."
    why: "This preserves LiteLLM's own dynamic lookup and keeps the circular dependency in the outline until the architect resolves it by restructuring the dependencies."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/handler.py#L81-L83
  - what: "ID fallback uses object memory address (id(self) in Python) for stable correlation when chunks do not carry an explicit ID; Rust uses a Uuid or counter to ensure stability across event sequences."
    why: "Memory addresses are non-deterministic and unsafe to rely on; Rust generates a stable identifier once per iterator instance to preserve event correlation in tests and logs."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/streaming_iterator.py#L144

out_of_scope:
  - "_transform_responses_chunk_to_interactions_chunk (streaming_iterator.py L272-289) has no caller at the pin and is not implemented; only tests call it."
  - The Responses API operation itself (owned by B932, unresolved).
  - Interaction request preparation (owned by B3497).
  - Interaction response transformation from complete Responses responses (owned by B3497).
  - Interactions API response type construction (owned by B3481).
  - HTTP routing and endpoint registration (owned by B3507 for the /interactions route).

pitfalls:
  - "Event buffering: a single upstream chunk may produce multiple downstream Interactions API events (e.g. a first text delta emits interaction.created + step.start + step.delta). Store them in _pending_events deque and drain before requesting the next chunk, not emitting them one at a time without queueing."
  - "ID correlation: _interaction_id is set once by the first event carrying an ID (from item_id on a delta or response.id on response.created) and reused in all subsequent events to keep them correlated, including the fallback ID on EOF. If later chunks carry a different ID source, prefer the stored ID for consistency."
  - "EOF synthesis: stream ends when next() or __anext__() raises StopIteration/StopAsyncIteration. At that point, _build_terminal_events_on_eof() must emit step.stop (if step.start was sent) and interaction.completed (if any content was seen or interaction.created was sent), using the stored _interaction_id or a fallback. Do not emit terminal events twice."
  - "Text accumulation: collected_text appends delta_text to a string across all chunks; it is not overwritten or truncated. The final completion event contains the full accumulated text."
  - "Falsy chunks: _events_for_chunk returns [] for empty/None chunks without raising or trying to process them."
  - "Streaming detection: a BaseResponsesAPIStreamingIterator response triggers wrapping; a ResponsesAPIResponse (non-streaming) is transformed directly and returned as a single response, never wrapped in an iterator."
  - "Async/sync branching: _is_async=true in the handler calls async_interactions_api_handler and awaits it. The sync path calls litellm.responses() directly and does not await. Both paths wrap streaming responses but non-streaming responses branch based on the input request."

