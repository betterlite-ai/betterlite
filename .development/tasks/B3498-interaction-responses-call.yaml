id: B3498
title: Execute Responses compatibility and synthesize interaction events
description: >-
  Build `betterlite-core::api::responses_handler` to invoke the existing Responses
  operation and emit the ordered Interactions API event sequence to the caller.
  The handler calls litellm.responses() or litellm.aresponses() with the request
  prepared by B3497's transform functions, then wraps the streaming iterator to
  emit interaction.created, step.start, step.delta events for each chunk, step.stop
  when content ends, and interaction.completed at the terminal. Accumulate full
  text across chunks and synthesize the terminal completion event if the upstream
  stream ends without an explicit completion marker. Preserve the interaction ID
  across all events for caller correlation, using a stable fallback when the ID
  comes from a delta and later events use a different source. The handler returns
  either a complete InteractionsAPIResponse (non-streaming) or an iterator of
  InteractionsAPIStreamingResponse, with both sync and async entry points.

scope:
