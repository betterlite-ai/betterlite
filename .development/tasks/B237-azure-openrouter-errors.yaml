id: B237
title: Azure and OpenRouter error classifiers
description: >-
  Implement _map_azure_exception and _map_openrouter_exception (1926-2233) over B236 facts and B184 taxonomy. Preserve
  ordered body-code, message and status predicates; each specialized predicate and generic fallback has its own
  helper invocation. No network or SDK clients. Budget 280 classification, 100 adapters, 300 tests and 50 wiring
  (730 total). Write the behavior rstest functions azure_openrouter_errors_behavior_tests_behavior in adjacent tests.rs files, with
  a named case for each behavior and failure in the DoD; corpus replay tests have separate names. Register helper
  operations azure_openrouter_errors in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py; each
  operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-error/Cargo.toml
  - crates/betterlite-error/src/lib.rs
  - crates/betterlite-error/src/error.rs
  - crates/betterlite-error/src/azure_openrouter.rs
  - crates/betterlite-error/src/azure_openrouter/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/error/azure_openrouter_errors.rs
  - tools/oracle/src/helpers/error/azure_openrouter_errors/**
  - tools/oracle/helpers/azure_openrouter_errors.py
  - tools/oracle/helpers/azure_openrouter_errors/**
  - tools/oracle/cases/helpers/azure-openrouter-errors/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1926-L2233
  why: Azure and OpenRouter classifier ownership.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-error --no-tests=fail -E 'test(/::azure_openrouter_errors_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'azure_openrouter_errors' tools/oracle/fuzz/corpus/helper_case && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/azure-openrouter-errors/azure-body-code.yaml
- tools/oracle/cases/helpers/azure-openrouter-errors/azure-content-policy.yaml
- tools/oracle/cases/helpers/azure-openrouter-errors/azure-status.yaml
- tools/oracle/cases/helpers/azure-openrouter-errors/openrouter-provider-error.yaml
- tools/oracle/cases/helpers/azure-openrouter-errors/openrouter-context.yaml
- tools/oracle/cases/helpers/azure-openrouter-errors/openrouter-fallback.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B185 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_openrouter_errors in the error group. Replace the stub Op in tools/oracle/src/helpers/error/azure_openrouter_errors.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_openrouter_errors.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
