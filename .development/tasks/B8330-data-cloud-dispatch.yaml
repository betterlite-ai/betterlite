dod:
  - text: _complete_databricks, _complete_snowflake and _complete_oci resolve base, key and headers in LiteLLM's order and call their configs through the shared handler.
    proof: [data-cloud-dispatch-tests, oracle]
  - text: Databricks and Snowflake log post_call on a handler failure and return the same error, and Databricks logs it again for a stream.
    proof: [data-cloud-dispatch-tests]
  - text: The databricks, snowflake and oci embedding arms reach their configs with the same arguments as LiteLLM.
    proof: [data-cloud-dispatch-tests, oracle]
  - text: The OAuth M2M request and the OCI stream request send the same URL, headers and body and map failures to the same errors.
    proof: [data-cloud-dispatch-tests, oracle]
  - text: The arms reach these functions through the dispatch table, and an unknown provider still fails as before.
    proof: [data-cloud-dispatch-tests]
  - text: litellm_settings.databricks_key loads into the data_cloud_credentials section.
    proof: [data-cloud-config-tests]
  - text: New HTTP cases for these providers exist.
    proof: [data-cloud-cases, oracle]
checks:
  optional: []
  commands:
    - id: data-cloud-dispatch-tests
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^data_cloud_dispatch::/)'
      why: Without the dispatch module there are no such tests, so the check fails on the base branch.
    - id: data-cloud-config-tests
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::data_cloud_credentials::/)'
      why: The section is a stub on the base branch and has no tests.
    - id: data-cloud-cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/data-cloud)"
      why: Without new case files the oracle proof passes with nothing compared.
oracle_cases:
  - tools/oracle/cases/providers/data-cloud/databricks-chat.yaml
  - tools/oracle/cases/providers/data-cloud/databricks-chat-stream.yaml
  - tools/oracle/cases/providers/data-cloud/databricks-upstream-500.yaml
  - tools/oracle/cases/providers/data-cloud/databricks-oauth-m2m.yaml
  - tools/oracle/cases/providers/data-cloud/databricks-embedding.yaml
  - tools/oracle/cases/providers/data-cloud/snowflake-chat.yaml
  - tools/oracle/cases/providers/data-cloud/snowflake-embedding.yaml
  - tools/oracle/cases/providers/data-cloud/snowflake-upstream-400.yaml
  - tools/oracle/cases/providers/data-cloud/oci-chat.yaml
  - tools/oracle/cases/providers/data-cloud/oci-chat-stream.yaml
  - tools/oracle/cases/providers/data-cloud/oci-embedding.yaml
deviations:
  - what: Reply ids LiteLLM generates and token usage it estimates are compared as present, not equal, and the OCI signature header is compared as present.
    why: The ids are random, usage depends on each side's tokenizer and the OCI signature covers the date header.
out_of_scope:
  - "B5841, B5980, B5844, B5940, B5941, B5942 and B5843 own every provider transform, the OAuth reply decoder and the SSE decoder; only calls to them are here."
  - "B211 owns the snowflake branch of get_llm_provider (get_llm_provider_logic.py L811-L815) and its SNOWFLAKE_JWT default."
  - "The other branches of the embedding and Responses config selection stay with B157 and the family tasks that extract them; only the three named branches are here."
  - "The other main.py functions of B042 belong to B8331 (SAP, watsonx, SageMaker) and B8332 (Hugging Face, Replicate, Predibase); heroku, datarobot and gdc belong to B038 and ovhcloud to B039."
pitfalls:
  - "_complete_databricks reads DATABRICKS_API_BASE with os.getenv and the embedding arm with get_secret; both treat an empty value as unset, so one lookup serves both."
  - "In the Databricks key chain litellm.api_key comes before litellm.databricks_key, so a global key hides the Databricks one."
  - "The token URL keeps only scheme and host: https://x.cloud.databricks.com/serving-endpoints gives https://x.cloud.databricks.com/oidc/v1/token."
  - "The OCI embedding arm turns headers None into an empty map before the call, while the chat path passes headers as they are."
  - "The Responses branch lowers the model before the gpt check, so GPT-5 matches and a model without gpt gets no config at all."
  - "The snowflake arm also matches a model in the snowflake catalog list when the provider is something else, so keep it after the arms that come before it at L6043."
  - "databricks-oauth-m2m.yaml scripts both replies in the case field upstream, a list the mock answers in arrival order: the token reply first, then the chat reply. A request past the end fails with provider answer sequence exhausted. Only case env values get the mock address, through {{upstream}} (DATABRICKS_API_BASE: {{upstream}}/serving-endpoints); reply bodies are sent as written."
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: security
