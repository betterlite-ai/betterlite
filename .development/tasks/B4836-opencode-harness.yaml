dod:
  - text: OpenCodeHarnessConfig validates that OpenCodeOptions.config does not set managed keys (provider, model, small_model, permission, tools, enabled_providers, disabled_providers, plugin) and raises OptionsMismatch with the conflicting key names.
    proof: [opencode-validation-tests]
  - text: permission_rules maps read-only/edit/full to OpenCode permission rules with disable_tools applied as trailing deny rules.
    proof: [opencode-validation-tests]
  - text: build_opencode_config merges user config underneath LiteLLM-managed keys and appends extra instructions and skills.
    proof: [opencode-config-tests]
  - text: Session setup creates files for token and instructions, sets OPENCODE_ISOLATION_ENV and XDG remappings, and passes config as OPENCODE_CONFIG_CONTENT JSON.
    proof: [opencode-setup-tests]
  - text: >-
      First turn argv is (opencode, run, --pure, --format, json, --thinking, -m, litellm/model,
      --agent, build) and ends with `--title litellm-harness` when there is no native_session_id.
      Resume turn includes `--session <native_session_id>` instead of `--title`. OpenCodeOptions.agent
      defaults to "build"; `--agent build` appears in the default case.
    proof: [opencode-argv-tests]
  - text: build_instructions appends structured output instruction when ctx.output is not None.
    proof: [opencode-setup-tests]
  - text: turn_prompt repeats the schema instruction in the user turn.
    proof: [opencode-setup-tests]
  - text: JSONL stream parsing (step_start, text, reasoning, tool_use, error events) populates OpenCodeStreamState and emits correct event sequences.
    proof: [opencode-parsing-tests]
  - text: Tool call events normalize tool names through NATIVE_TO_NORMALIZED, set is_error=True only for invalid tools, and synthesize ToolResult from state.output and state.status.
    proof: [opencode-parsing-tests]
  - text: "Turn response checks state.error first and raises HarnessTurnError even if exit_code is 0; checks exit_code second;
           extracts output_json via last_json_object only when ctx.output is not None."
    proof: [opencode-response-tests]
  - text: OpenCodeHarnessConfig.capabilities has structured_output=True, tool_approval=False, tool_filtering=True, skills=True, resume=True, and permission_modes={read-only, edit, full}.
    proof: [opencode-response-tests]
  - text: Every JSONL fixture from LiteLLM is copied byte-for-byte under tools/oracle/cases/opencode/fixtures/.
    proof: [opencode-fixtures-pinned]
  - text: Every oracle helper case parses the matching fixture and verifies event sequences.
    proof: [opencode-oracle-cases]
checks:
  optional: []
  commands:
    - id: opencode-validation-tests
      why: Config key conflict detection and permission rule building fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::opencode::.*validation/)'
    - id: opencode-config-tests
      why: Config assembly and instructions building fail or miss managed keys
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::opencode::.*config/)'
    - id: opencode-setup-tests
      why: Session setup, XDG remapping, or file creation fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::opencode::.*setup/)'
    - id: opencode-argv-tests
      why: First turn or resume turn argv construction misses flags or model format
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::opencode::.*argv/)'
    - id: opencode-parsing-tests
      why: JSONL event parsing skips event types, tool normalization or error accumulation
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::opencode::.*parsing/)'
    - id: opencode-response-tests
      why: Turn response handling misses error-first checking or structured output extraction
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^providers::opencode::.*response/)'
    - id: opencode-fixtures-pinned
      why: a JSONL fixture is missing or differs from LiteLLM's file at the pinned commit
      run: |
        test -d tools/oracle/cases/opencode/fixtures && test "$(ls tools/oracle/cases/opencode/fixtures | wc -l)" -ge 5 && cd tools/oracle/cases/opencode/fixtures && sha256sum --check --quiet <<'SUMS'
        4748140c0df04e2a226e2cc612807243e13f6b73890888337d3ef77713972cda  api_error.jsonl
        4358894a7049f2d183f4417cc08906b07d0b8294c686ca5066d05ee7b5258227  endpoint_requests.jsonl
        706db45b717993126d5b4bc972e2b44d32b0389d7b59bbe1e5be258a6290eb1b  readonly_denied_bash.jsonl
        59a0795c1b01dfe01a18996d6ad664f09409dae3adcbcd3f1d93cf392b4ca59a  turn1_write_read.jsonl
        9afe125d718d763a28889f37650dc4140bf27cbefb2704733d6f6c52e6f473e8  turn2_session_skill.jsonl
        SUMS
    - id: opencode-oracle-cases
      why: oracle helper cases for OpenCode event parsing are missing, invalid, or fail to run
      run: >-
        test -d tools/oracle/cases/opencode/fixtures &&
        test -f tools/oracle/cases/opencode/api_error.yaml &&
        test -f tools/oracle/cases/opencode/turn1_write_read.yaml &&
        test -f tools/oracle/cases/opencode/readonly_denied_bash.yaml &&
        test -f tools/oracle/cases/opencode/turn2_session_skill.yaml &&
        test -f tools/oracle/cases/opencode/endpoint_requests.yaml &&
        cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/opencode/*.yaml
oracle_cases: []
deviations:
  - what: "Session token is never in argv or environment; the config references it with `{file:<path>}` inside OPENCODE_CONFIG_CONTENT JSON."
    why: "Command-line arguments are visible in process listings. The token is a secret and must stay out of argv and env."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/opencode/harness/transformation.py#L324-L333
  - what: "XDG_*_HOME environment variables are set to persist session state across resume, overriding user's ~/.opencode."
    why: "OpenCode reads XDG dirs by default. This deployment isolates each session with its own persisted directories so previous sessions do not interfere."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/opencode/harness/transformation.py#L340-L342
  - what: "`--pure` flag is always passed to disable plugins, even though opencode.json in the repo might define them."
    why: "Plugins run arbitrary code as the host user before any tool permission applies. The flag is always on for security."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/opencode/harness/transformation.py#L363-L367
  - what: "An error event in OpenCode fails a turn even when the process exits with code 0."
    why: "OpenCode may report errors via JSONL events after successfully starting. state.error is checked before exit code."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/opencode/harness/transformation.py#L419-L421
out_of_scope:
  - B4830 owns event_list, Harness enum, Capabilities dataclass, Event/Text/Reasoning/ToolCall/ToolResult constructors and Sandbox.host_url contract.
  - B4831 owns native_tool_names, normalize_tool_name, structured_output_instruction, last_json_object, stderr_tail_text helpers.
  - B4844 owns parse_output schema validation; this task produces output_json only.
  - OpenCode process execution and sandbox integration (handled by handler tasks and B4831/B4832).
  - LiteLLM's enterprise OpenCode options or features not in the open-source version.
pitfalls:
  - OpenCode configuration merges user config underneath LiteLLM-managed keys; keys in MANAGED_CONFIG_KEYS must be rejected before merging, not silently overridden.
  - Later keys win in opencode, so disable_tools denies go last in the permission rules dict; construct rules as allowed entries then denied entries.
  - OPENCODE_CONFIG_CONTENT is JSON; validate_user_config checks the Python dict before JSON serialization.
  - XDG_*_HOME variables must all point to the same persisted session directory under different subdirs (config, data, state, cache); remapping is cumulative, not a single override.
  - Token file path must use forward slashes even on Windows; opencode's `{file:...}` reference is POSIX-style.
  - The `invalid` pseudo-tool marks a call to an unavailable tool; set is_error=True for that tool name only.
  - step_finish events have token counts that are ignored; the session endpoint does accounting, not the harness.
  - Session ID appears only in sessionID field of JSONL lines; native_session_id is used in --session flag but state.session_id is the OpenCode sessionID.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
