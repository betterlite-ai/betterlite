id: B4836
title: Translate OpenCode permissions, isolated configuration and events
description: >-
  Manage OpenCode session configuration, tool permissions, and event stream parsing.
  Configuration is built once per session and passed through OPENCODE_CONFIG_CONTENT, a JSON
  environment variable, because opencode applies OPENCODE_CONFIG_CONTENT after global and project
  config, so neither the user's opencode.json nor a repo's own config file can redirect the model call.
  The session token lives in a file and is referenced in the config; token, instructions and
  skill paths are never in argv or environment. Persist XDG_*_HOME directories (config, data,
  state, cache) to a LiteLLM-owned directory so the session database survives a resume and
  the user's own opencode config and auth are never loaded. Verify against opencode 1.14.41.

  Build config validation: validate_user_config rejects OpenCodeOptions.config keys that LiteLLM
  manages (provider, model, small_model, permission, tools, enabled_providers, disabled_providers,
  plugin) with OptionsMismatch listing the invalid keys. The agent.* and mode.* sub-entries are
  also checked for AGENT_MANAGED_KEYS (permission, tools, model).

  Build permission rules: permission_rules maps ctx.permissions (read-only, edit, full) to OpenCode
  permission config using PERMISSION_RULES constant (read-only denies edit/bash/webfetch, edit allows
  edit/webfetch and denies bash, full allows all). disable_tools are applied as deny rules that win
  by coming last in the rules dict (later keys override in opencode).

  Build config assembly: build_opencode_config merges user config underneath LiteLLM-managed keys.
  Managed keys set provider (litellm/@ai-sdk/openai-compatible with baseURL and apiKey file ref),
  enabled_providers, model, small_model, permission rules, autoupdate=false, share=disabled.
  Extra instructions are appended to user instructions; extra skills are appended to skills.paths.

  Build session setup: transform_session_setup creates files for token and instructions, sets
  OPENCODE_ISOLATION_ENV to keep opencode off the network (no autoupdate, no fetch, no LSP, no
  plugins, no share, no external skills, no Claude Code), then overlays options.env and XDG remappings,
  and passes the full config as OPENCODE_CONFIG_CONTENT JSON. Persist the xdg subdir (config, data,
  state, cache) across resume. Set skills_dir to "skills" for session skill installation.

  Build instructions: build_instructions appends structured output instruction to ctx.instructions
  when ctx.output is not None. turn_prompt repeats the schema instruction in the user turn since
  system instructions alone are too weak for opencode.

  Build turn request: transform_turn_request builds argv for `opencode run --pure --format json
  --thinking -m litellm/model` with `--agent build` by default. On first turn (no native_session_id),
  append `--title litellm-harness`; on resume, append `--session <native_session_id>` instead.
  OpenCodeOptions.agent defaults to "build"; `--agent` is included whenever agent is present.
  The prompt goes on stdin. Workdir is ctx.sandbox.workdir.

  Build stream parsing: transform_stream_line parses JSONL lines into OpenCodeStreamState and returns
  events. Track sessionID, final_text (joined step_texts), and error (accumulated error messages).
  Parse step_start (clear step_texts), text (append to step_texts, emit Text delta), reasoning
  (emit Reasoning delta), tool_use (parse tool events), and error (record error message).

  Parse tool events (_tool_events): extract tool name (native), callID/id (call_id), state.input
  (tool_input), and state.status/error/output. Emit ToolCall with name normalized through
  NATIVE_TO_NORMALIZED, native_name preserved, input as dict or `{input: value}`, and builtin flag
  (tool in OPENCODE_BUILTIN_TOOLS). On state.status==error emit ToolResult with is_error=True and
  error message. Otherwise emit ToolResult with output (string or JSON-stringified), and is_error=True
  only when native tool is "invalid" (unavailable tool placeholder).

  Turn response: transform_turn_response checks state.error first; if set, raise HarnessTurnError with
  the error message (even if exit_code is 0). If exit_code is nonzero, raise HarnessTurnError with exit
  code and stderr tail. Otherwise extract final_text from state.final_text and output_json via last_json_object
  only when ctx.output is not None.

  Implement OpenCodeHarnessConfig class with harness=Harness.OPENCODE, options_type=OpenCodeOptions,
  and capabilities (structured_output=True, tool_approval=False, tool_filtering=True, history=False,
  custom_tools=False, skills=True, resume=True, permission_modes={read-only, edit, full}). Methods:
  get_binary() returns "opencode", get_install_hint() says "npm install -g opencode-ai (or brew install
  sst/tap/opencode)", validate_environment(ctx) calls validate_user_config on options.config.

  Copy every JSONL fixture from LiteLLM (tests/unit/llms/opencode/harness/fixtures/*.jsonl) as
  tools/oracle/cases/opencode/fixtures/*.jsonl, byte for byte: api_error.jsonl, endpoint_requests.jsonl,
  readonly_denied_bash.jsonl, turn1_write_read.jsonl, turn2_session_skill.jsonl. For each of the four
  event fixtures (all except endpoint_requests.jsonl), write a helper test case under tools/oracle/cases/opencode/
  with the fixture name, operations to parse the fixture and check that no event is missed and every ToolCall
  precedes its ToolResult. For endpoint_requests.jsonl, write a distinct case that verifies the recorded HTTP
  requests carry the session auth_prefix, Content-Type header, the tool list and message counts the fixture shows.
  The helper cases run through oracle operation b4836, registered with a stub in the harness helper group.
scope:
