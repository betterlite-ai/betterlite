id: B1060
title: Managed vector-store grants and index lifecycle policy
description: >-
  Implement all thirteen complete functions at proxy/vector_store_endpoints/utils.py:25-257 in
  core::api::vector_store_access. This layer normalizes stored parameters, checks admin/index lifecycle,
  builds effective auth contexts and applies key/team grants. B732 supplies auth records, B735 object
  permission lookup, B737 team lookup, and B137 UI-session identification/team membership through injected
  runtime seams; never import proxy_server globals into native policy code. Route owners apply the resulting
  errors to HTTP and retain their own error envelopes.

  Direct access permits proxy_admin, then any store with team_id=null, then a key grant, team grant or
  matching team. List filtering permits admin, otherwise only those grants/team matches; it has no
  teamless-store exemption. user_id is never checked. UI sessions preserve their key grants in a context
  with team fields cleared and add one context per real team. Failed team lookup propagates; failed
  object-permission lookup logs debug and returns no permission. Keep the first successful grant's
  short circuit so later repositories are not touched.

  decode_vector_store_access(bytes,limits) parses a string-valued litellm_params JSON into an object,
  returning {} for malformed JSON or a non-object. It is shared with the vector_store_access fuzz target
  and replays_corpus. Non-string fields bypass normalization. Add B171 VectorStoreAccess for deterministic
  typed policy inputs and scripted auth lookups. The source has 190 nonblank/non-comment lines; budget
  195 code, 190 tests, 95 adapters, 120 fixtures, 60 fuzz/replay and 35 wiring, 695 within 740.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/vector_store_access.rs
  - crates/betterlite-core/src/api/vector_store_access/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/vector_store_access.rs
  - crates/betterlite-core/fuzz/corpus/vector_store_access/**
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/vector_store_access.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/vector_store_access.py
  - tools/oracle/cases/helpers/vector-store-access/**
  - tools/oracle/fuzz/corpus/helper_case/vector_store_access-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/utils.py#L25-L257
  why: Whole normalization, lifecycle and grant functions distinguish individual access from list visibility and session-team contexts.
dod:
- text: >-
    parameter_string_normalization takes {litellm_params:'{"api_key":"k"}',vector_store_id:vs_a} and
    produces an equal copied record with params={api_key:k}. Strings "[]","null","1","broken" yield
    {}; an existing object,null or absent field stays unchanged without parsing. Native decoder replay
    covers malformed bytes and its size limit; credential values never appear in Debug output.
  proof: [access-tests, oracle, helper-python, parser-corpus]
- text: >-
    admin_and_lifecycle accepts only role proxy_admin, including the equivalent enum value. proxy_admin_viewer
    and internal_user get HTTPException status=403,detail="Only proxy admins can create vector store indexes. Contact your LiteLLM administrator."
    for default operation=create; delete/update/list substitute those literals. Helper error type,param,code
    are absent because this is HTTPException, not ProxyException. Lifecycle detects POST/PUT/DELETE/PATCH
    on /indexes/name and /indexes/name?x=1; GET is false. /indexes/name/docs/search and /docsanything are
    false; /indexes/name/ with trailing slash is false. POST /indexes or /indexes/?x=1 is true. Name
    "a.b" is regex-escaped and does not match axb; /indexes/name2 does not match name.
  proof: [access-tests, oracle, helper-python]
- text: >-
    store_grant_precedence uses store vs_a,team_id=t. Key object_permission.vector_stores=[vs_a] grants
    before any team read. Otherwise team allowlist grants; otherwise auth team_id=t grants; team=u denies.
    Null/empty permission records do not grant, and a missing store id compares as "". Inline permission
    objects, even empty, suppress lookup by their corresponding ids. A falsey permission id or no database
    returns null without lookup. Lookup failure logs "Failed to load object_permission id=%s: %s" and
    continues to later grants. A user_id match alone has no effect.
  proof: [access-tests, oracle, helper-python]
- text: >-
    teamless_access_is_not_listing permits direct access when team_id is missing/null even without grants,
    but excludes that store from a non-admin list unless explicitly allowlisted. team_id="" is not the
    null exemption. Admin list preserves all stores and order without auth-context lookups; ordinary list
    returns only granted entries in original order. Direct admin access short-circuits before team checks.
  proof: [access-tests, oracle, helper-python]
- text: >-
    dashboard_effective_teams supplies a UI-session auth record with synthetic team=s, key grant vs_key,
    and resolved real teams [a,b]. First context clears team_id,team_object_permission,team_object_permission_id
    but retains key grants; then team contexts replace those three fields with each B737 result and keep
    the other auth fields and parent_otel_span. Stores belonging to a/b or granted by these contexts are
    accessible/listable; synthetic-team-only ownership is not. Non-session credentials use exactly their
    original context. Empty team resolution still keeps the key context; a team lookup error propagates.
  proof: [access-tests, oracle, helper-python]
- text: The new vector_store_access helper seeds and external JSON corpus replay the actual policy decoder.
  proof: [helper-corpus, parser-corpus]
checks:
  optional: []
  commands:
  - id: access-tests
    why: grant precedence, lifecycle classification or session context handling loses an access boundary
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_access::tests::/) - test(/::replays_corpus$/)'
  - id: helper-python
    why: managed-store policies lack a checked pinned comparison
    run: test -f tools/oracle/helpers/vector_store_access.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: parser-corpus
    why: stored litellm_params JSON is parsed outside the fuzzed production function
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/vector_store_access.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/vector_store_access)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_access::tests::replays_corpus$/)'
  - id: helper-corpus
    why: the access operation has no newly added helper input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_store_access-*)" && grep -qE '^[[:space:]]+vector_store_access:' tools/oracle/fuzz/corpus/helper_case/vector_store_access-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/vector-store-access/parameter-string-normalization.yaml
- tools/oracle/cases/helpers/vector-store-access/admin-and-lifecycle.yaml
- tools/oracle/cases/helpers/vector-store-access/store-grant-precedence.yaml
- tools/oracle/cases/helpers/vector-store-access/teamless-access-is-not-listing.yaml
- tools/oracle/cases/helpers/vector-store-access/dashboard-effective-teams.yaml
deviations: []
out_of_scope:
- B1061 owns utils.py:260-559 managed-id resolution and endpoint allowlist checks; route tasks own their final HTTP responses.
- B735/B737 own permission/team cache and database lookups. B137 owns UI-session identification and team membership; native policy receives those results through an injected seam.
pitfalls:
- A teamless store is directly accessible but hidden from ordinary listing without an explicit grant.
- Inline empty permission objects prevent id-based permission reload; absence and emptiness are different.
- The lifecycle matcher accepts the exact index path or query suffix, but not an otherwise similar trailing slash.
review_level: security
budget:
  max_changed_lines: 740
  max_new_expects: 0
