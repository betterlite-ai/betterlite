checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_access::/) -
      test(/::replays_corpus$/)'
  - id: case-vector-object-grant
    why: the vector-object-grant behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_access::tests::vector_object_grant($|::)/)'
  - id: case-team-store-visibility
    why: the team-store-visibility behavior or its assertions are absent
