    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_access::tests::view_only_index_denied($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/vector_store_access)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/vector_store_access.rs && grep -qF "decode_vector_store_access"
      crates/betterlite-core/fuzz/fuzz_targets/vector_store_access.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::vector_store_access::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/vector_store_access.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_store_access-*)"
      && grep -qE "^[[:space:]]+vector_store_access:" tools/oracle/fuzz/corpus/helper_case/vector_store_access-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/vector-store-access)"
