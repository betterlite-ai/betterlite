id: B1060
title: Vector store access
description: >-
  Build vector-store object/team/admin permission and list visibility predicates using B052/B058. Authorize index
  lifecycle operations separately from data search, and never let a supplied vector store ID grant access to its
  credentials.


  user_id is never checked. A store with no team_id is accessible to every key, though list filtering hides it without
  grants; _is_proxy_admin accepts PROXY_ADMIN only. Index mutations denied to non-admin return 403 detail Only proxy
  admins can {operation} vector store indexes. Use B137 ui_session_utils for team auth contexts.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-core/src/api/vector_store_access.rs. Use VectorStoreAccessInput and VectorStoreAccessResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): utils.py:55 status_code=403, exception_detail=FastAPI detail string. Compare the actual source
  status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions vector_object_grant, team_store_visibility, admin_index_management,
  unauthorized_index_lifecycle, list_visible_only, no_team_store_open, no_team_list_hidden, view_only_index_denied
  under api::vector_store_access::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::vector_store_access::decode_vector_store_access(bytes:
  &[u8], limits: &ApiLimits), for json.loads input litellm_params at litellm/proxy/vector_store_endpoints/utils.py:32.
  Place its implementation in crates/betterlite-core/src/api/vector_store_access.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/vector_store_access.rs passes arbitrary
  bounded bytes to that exact decoder; api::vector_store_access::tests::replays_corpus replays newly committed seeds
  through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::VectorStoreAccess in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_store_access: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/vector_store_endpoints/utils.py: _normalize_litellm_params (L25-L37); litellm/proxy/vector_store_endpoints/utils.py:
  _is_proxy_admin (L40-L44); litellm/proxy/vector_store_endpoints/utils.py: assert_proxy_admin_for_vector_store_index_management
  (L47-L58); litellm/proxy/vector_store_endpoints/utils.py: _suffix_after_index_name (L61-L66); litellm/proxy/vector_store_endpoints/utils.py:
  _is_vector_store_index_lifecycle_request (L69-L99); litellm/proxy/vector_store_endpoints/utils.py: _object_permission_allows_vector_store
  (L102-L112); litellm/proxy/vector_store_endpoints/utils.py: _get_object_permission_for_id (L115-L145); litellm/proxy/vector_store_endpoints/utils.py:
  can_user_access_vector_store (L148-L175); litellm/proxy/vector_store_endpoints/utils.py: _is_vector_store_granted
  (L178-L196); litellm/proxy/vector_store_endpoints/utils.py: _team_auth_context (L199-L222); litellm/proxy/vector_store_endpoints/utils.py:
  _vector_store_auth_contexts (L225-L235); litellm/proxy/vector_store_endpoints/utils.py: _is_vector_store_granted_to_any
  (L238-L245); litellm/proxy/vector_store_endpoints/utils.py: filter_listable_vector_stores (L248-L257). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 164 owned nonblank/non-comment/non-docstring Python lines (190 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 184 implementation,
  88 behavior tests, 96 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 548 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B058 (Organizations, projects, access groups and object permissions), B171 (Direct helper
  oracle and URL path encoding), B1087 (Api boundaries), B137 (MCP auth, OAuth flows, BYOK and outbound credentials),
  B732 (Typed authentication principals and grant resolution), B855 (Authenticated request admission and budget
  handoff), B756 (Authentication header selection and mode dispatch). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
