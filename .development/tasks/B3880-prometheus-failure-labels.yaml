id: B3880
title: Prometheus failure identity and cardinality checks
description: >-
  Resolve failure status, safe exception/provider labels, authenticated identity fallback
  and bounded requested-model labels. Keep the invalid-key filter available to SDK/deployment
  emitters while the proxy-failure hook still counts rejected requests with a cleared key hash.

  Extract HTTP status codes from enum_values.status_code, exception.code, exception.status_code,
  or kwargs["exception"] in that order, returning None when unresolvable. Validate 401
  responses and auth-error patterns (virtual key expected, expected to start with 'sk-',
  authentication error, invalid api key, api key not valid) to identify requests that should
  skip all metrics rather than emit with a missing key label.

  For deployment failures, extract label values (api_key_alias, user_email, team, team_alias,
  hashed_api_key, client_ip, user_agent) by cascading through standard_logging_payload metadata,
  litellm_params metadata, and user_api_key_auth fallback. Nested identity getters resolve
  each label independently while merging sources. Return None for each label when absent after
  fallback.

  For exception attribution, extract the class name with optional legacy prometheus_exception_class_name
  marker to preserve dashboard compatibility; special-case BudgetExceededError to avoid
  provider-prefixed rendering that would break back-compat. Prefix the class name with the
  uppercased llm_provider when present and not already handled.

  Bound requested_model label cardinality to router-recognized names (model names, deployment
  ids, aliases, routing groups, team public-model names, and matched via global or team
  wildcard/pattern routes), collapsing unrecognized client-supplied strings to "other" while
  passing through router_originated values when no proxy router exists. Return None when
  requested_model is None. Rate-limit labels (category, rate_limit_type) are validated
  through error validation enums before emission.

  For provider attribution before deployment resolution, try the resolved custom_llm_provider
  on litellm_params first, then any provider on standard_logging_payload (partial/stream
  recovery), then infer from the model name via get_llm_provider, returning None if the
  model cannot be parsed. When extraction fails, a diagnostic debug log is emitted and None
  is returned without affecting request/failure handling.

