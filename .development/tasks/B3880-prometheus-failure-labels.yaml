dod:
  - text: >-
      Status code extraction tries enum_values.status_code first (converted to int), then
      exception.status_code or exception.code (converted to int), then kwargs["exception"]'s
      status_code or code (converted to int), returning None if all fail or conversion raises.
    proof: [status-code-extraction]
  - text: >-
      Invalid API key detection returns true on 401, or when the exception message lowercased
      contains "virtual key expected", "expected to start with 'sk-'", "authentication error",
      "invalid api key", or "api key not valid", then returns false. Debug logging records skipped metrics.
    proof: [invalid-key-detection]
  - text: >-
      Deployment failure label extraction cascades through standard_logging_payload.metadata
      (dict or object), litellm_params.metadata, and user_api_key_auth fallback, with five
      nested getters for api_key_alias, user_email, team_id, team_alias, and hashed_api_key,
      each reading its own path independently. Client IP and user agent merge standard payload
      and litellm_params sources.
    proof: [deployment-failure-labels]
  - text: >-
      Exception class name honors prometheus_exception_class_name attribute when set, preserves
      "BudgetExceededError" without provider prefix, and otherwise prefixes the class name with
      uppercased llm_provider and a dot (e.g., "Openai.RateLimitError").
    proof: [exception-class-name]
  - text: >-
      Requested-model cardinality is bounded: returns None when requested_model is None,
      returns an empty string unchanged, returns "other" when requested_model is not a string,
      checks router.is_recognized_model and team_public_model_names, tests pattern_router.route
      and all team_pattern_routers.route, and collapses unrecognized client strings to "other"
      unless router_originated is true.
    proof: [bounded-model-label, bounded-model-non-string-collapse]
  - text: >-
      Rate-limit labels extract category and rate_limit_type from exception and validate them
      through validate_rate_limit_category and validate_rate_limit_type, returning None, None
      when the exception is None.
    proof: [rate-limit-labels]
  - text: >-
      _extract_api_provider_from_exception returns None for non-RateLimitError exceptions,
      returns None when llm_provider is unset or equals "litellm_proxy", and returns the
      llm_provider value when present and not equal to the fallback placeholder.
    proof: [provider-from-exception, provider-from-exception-oracle]
  - text: >-
      Provider attribution tries custom_llm_provider on litellm_params, then standard_logging_payload,
      then infers from model via get_llm_provider, returning None without breaking on BadRequestError
      or unexpected exceptions (logged at debug).
    proof: [provider-attribution]

checks:
  optional: []
  commands:
    - id: status-code-extraction
      why: Status code must extract from multiple sources in priority order.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::extract_status_code::/)'
    - id: invalid-key-detection
      why: Invalid API key detection must recognize 401 and auth-error patterns.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::invalid_key::/)'
    - id: deployment-failure-labels
      why: Deployment failure labels must cascade through metadata sources with nested getters.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::deployment_labels::/)'
    - id: exception-class-name
      why: Exception class name must honor legacy markers and preserve BudgetExceededError.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::exception_name::/)'
    - id: bounded-model-label
      why: Requested-model label must bound cardinality while allowing router_originated values.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::model_cardinality::/)'
    - id: rate-limit-labels
      why: Rate-limit labels must extract and validate category and type.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::rate_limit::/)'
    - id: provider-attribution
      why: Provider attribution must cascade through sources and infer from model.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::provider::/)'
    - id: provider-from-exception
      why: Rate-limit exception provider extraction must handle unset, fallback and real providers.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^prometheus_failure::provider_from_exception::/)'
    - id: provider-from-exception-oracle
      why: Oracle cases for provider-from-exception with unset/fallback/real llm_provider variants must replay through the helper.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3880::provider_from_exception/)'
    - id: bounded-model-non-string-collapse
      why: Non-string requested_model must collapse to "other".
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(prometheus_failure::model_cardinality::non_string_collapse)'
    - id: helper-python
      why: The independently invoked MIT helper semantics must match the production functions.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3880::/)'
    - id: helper-case-corpus
      why: Oracle helper cases and corpus must replay with the new failure labels decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/prometheus-failure)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

