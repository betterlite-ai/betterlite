deviations:
  - what: >-
      The _get_proxy_llm_router function imports llm_router from litellm.proxy.proxy_server
      as an optional ambient global. In betterlite, router catalog view is passed as an optional
      injected parameter instead, keeping logging independent of server and allowing test mocking.
    why: >-
      Ambient globals break isolation and make testing harder. Betterlite's dependency injection
      pattern passes the router view through method parameters rather than importing globals.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L209-L214
  - what: >-
      Invalid API key requests skip all metrics emission in betterlite (they do not enter
      the metrics callbacks), whereas LiteLLM's filter occurs later during failure event processing.
      The SDK/deployment success/failure emitters receive the invalid-key predicate for conditional use.
    why: >-
      Catching invalid authentication early prevents any metrics inference on sensitive requests.
      The filter function is exposed to callers that do not go through the proxy failure hook.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L2518-L2560
  - what: >-
      Rate-limit exception provider attribution returns None when llm_provider is unset or equals
      PROXY_LLM_PROVIDER_FALLBACK ("litellm_proxy"), following LiteLLM's existing behavior of not
      emitting the fallback placeholder value as a label.
    why: >-
      PROXY_LLM_PROVIDER_FALLBACK is an internal sentinel value that indicates the provider could not be determined
      at error time. Emitting it as a label would leak this internal detail into user-facing metrics cardinality.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L2599-L2606

out_of_scope:
  - Status code validation logic (determining success vs failure); owned by B184.
  - Rate-limit error category and type enum definitions and parsing; owned by B184.
  - Router model catalog lookup and pattern matching; owned by B367.
  - Model group projection for callback metadata; owned by B3891.
  - Provider resolution via get_llm_provider; owned by B174.
  - Label value sanitization and formatting; owned by B3870.
  - Prometheus metrics registry and collector operations; owned by B3874.

pitfalls:
  - >-
      _bounded_requested_model_label with no proxy router returns the raw value for
      router_originated=true (SDK emitters), but collapses unrecognized strings to "other"
      when router_originated=false (proxy emitters). The distinction is critical to avoid
      unbounded label cardinality from proxy requests while trusting the SDK's own models.
  - >-
      Exception class name extraction reads prometheus_exception_class_name via getattr
      without a fastapi import to keep this core module free of transitive dependencies.
      Legacy back-compat labels must be honored exactly; overriding them breaks dashboards.
  - >-
      BudgetExceededError is special-cased to avoid rendering it as (e.g.) "Openai.BudgetExceededError"
      even when llm_provider is set, because the error system attached the field for unified
      handling but the dashboards expect the plain name.
  - >-
      Provider attribution cascades model→custom_llm_provider→standard_logging and stops at
      the first non-None value. get_llm_provider is only called if model is available and
      prior sources returned None; BadRequestError and unexpected exceptions log at debug
      and return None without breaking metrics.
  - >-
      Identity fallback in deployment_failure_label_values reads user_api_key_auth from
      metadata["user_api_key_auth"], which the proxy injects and is skipped in the merge.
      Each nested getter (api_key_alias, user_email, etc.) tries standard_logging → litellm_params
      → user_api_key_auth independently, allowing partial recovery from partially-populated sources.
  - >-
      Rate-limit label validation returns (None, None) when the exception is None, and runs
      each exception field (category, rate_limit_type) through its validation function.
      Third-party exceptions that declare .category/.rate_limit_type cannot leak invalid
      values into Prometheus; only known enum members pass validation.

review_level: standard

