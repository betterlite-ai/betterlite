id: B929
title: Responses id security
description: >-
  Implement response-ID ownership authorization and advertised-ID encryption using B732 authenticated principals
  and B061's established secret encryption helper. Add general_settings.disable_responses_id_security=false and
  allow_unmanaged_response_ids=false; resolve LITELLM_SALT_KEY with master-key fallback through config. Keep request-scoped
  encryption reuse and authorize retained addressed IDs before decoding routing IDs.
  Install the policy by default: PROXY_HOOKS contains responses_id_security without an opt-in. A normal key with
  a signing key cannot address an unmanaged resp_external; it raises HTTPException 403. The provider-flow HTTP
  mapper produces permission_error, param=null and code="403". PROXY_ADMIN, either disabling setting or no signing
  key permits unmanaged ids. Only disable_responses_id_security also bypasses encrypted owner mismatch and stops
  advertised-id encryption; allow_unmanaged_response_ids does neither.

  Apply pre-call authorization to aresponses, aget_responses, adelete_responses, acancel_responses and alist_input_items.
  Other call types return None. A nonempty string _litellm_addressed_response_id wins over the body field, which is
  previous_response_id for aresponses and response_id otherwise. Missing, empty or nonstring addressed values leave
  data unchanged. After authorization, store the provider id in that body field and retain the original addressed id.

  Encrypt the plaintext litellm_proxy:responses_api:response_id:resp_test;user_id:user_a;team_id:team_a with B061,
  then advertise resp_ plus its ciphertext. Empty user/team become empty fields and enforce no corresponding check.
  Nonstream ResponsesAPIResponse objects are rewritten regardless of request route. Streaming rewrites only typed
  response events on /responses, /v1/responses, /openai/responses and /openai/v1/responses. Reuse one encrypted id
  per original id within a stream; separate requests use fresh nonces. Rewrite a top-level id beginning resp_ before
  trying nested response.id; nested ResponsesAPIResponse and mapping values have separate branches. Nonmapping
  nested values and mappings without a string id pass through unchanged.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Place the policy in betterlite-core::api::responses_id_security, consuming B732 principals and B1138 response
  objects. Inject the config snapshot and B061 encryption service; B1087 limits bound ids before decryption.


  The three 403 branches distinguish an unmanaged id, mismatched user and mismatched team. Source details start
  "Forbidden. This response id was not issued by this proxy", "Forbidden. The response id is not associated with
  the user" and "Forbidden. The response id is not associated with the team". Check user before team; disabling
  security logs the corresponding debug diagnostic and returns early. Helper cases compare exception status and
  absence of type/param/code attributes, while B938 supplies the HTTP permission_error envelope test.


  Write adjacent tests.rs behavior functions same_user_team, cross_user_forbidden, cross_team_forbidden, proxy_admin_unmanaged,
  no_signing_key_debug_fallback, stream_id_consistency, malformed_owned_id_payload under api::responses_id_security::tests.
  Add default_unmanaged_denial, setting_overrides, empty_owners, retained_addressed_id and response_rewrite_routes
  with the exact inputs below. Name parameterized inputs with rstest so every owner and setting combination is visible.


  betterlite-config::api::responses_id_security::tests::loads_settings loads both flags omitted as false and each
  explicitly true. LITELLM_SALT_KEY absent falls back to general_settings.master_key; when both are absent the result
  is None. An explicitly empty salt key remains empty rather than falling back. Test salt=test-salt with
  master_key=test-master selects test-salt. Commit matching config_yaml seeds and assert none of these keys is unsupported.


  B061 owns encrypted-byte decoding. Fuzz the bounded id boundary decode_owned_response_id(bytes, crypto, limits)
  in this crate as well, including UTF-8, ciphertext failure and malformed decrypted field counts. Its replay test
  calls the production decoder with a fixed non-secret encryption key; a two-field payload must return an error,
  never panic. Preserve the caller-visible 500 failure of LiteLLM's IndexError with a typed internal error.


  HelperCall::ResponsesIdSecurity selects call: {responses_id_security: ...}; register it in the Rust and Python
  dispatchers. Python invokes the pinned hook with injected settings/principals and B061's real helper. Compare
  decrypted payloads, authorization outcomes and within-stream id equality, not randomized ciphertext strings.
  Normalize malformed-payload failures as an internal-error outcome while retaining their source diagnostic class.


  Callable ownership: litellm/proxy/hooks/responses_id_security.py: _proxy_general_settings (L43-L46); litellm/proxy/hooks/responses_id_security.py:
  _proxy_signing_key (L49-L55); litellm/proxy/hooks/responses_id_security.py: _response_payload (L61-L65); litellm/proxy/hooks/responses_id_security.py:
  _rewrite_advertised_id (L68-L93); litellm/proxy/hooks/responses_id_security.py: _is_responses_api_create_route
  (L96-L104); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.__init__ (L108-L114); litellm/proxy/hooks/responses_id_security.py:
  ResponsesIDSecurity.async_pre_call_hook (L116-L143); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._authorize_response_id
  (L145-L158); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._unmanaged_response_ids_allowed
  (L160-L169); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.check_user_access_to_response_id
  (L171-L212); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._is_encrypted_response_id (L214-L227);
  litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._decrypt_response_id (L229-L267); litellm/proxy/hooks/responses_id_security.py:
  ResponsesIDSecurity._get_signing_key (L269-L270); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._encrypt_response_id
  (L272-L303); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.async_post_call_success_hook (L305-L326);
  litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.async_post_call_streaming_iterator_hook (L328-L343).
  This task owns every function in responses_id_security.py and its policy constants, without splitting any method.


  Sizing: the callable range L43-L343 contains 241 nonblank/non-comment physical lines, 230 excluding docstrings;
  the complete file including imports/constants has 273 physical lines. Allow 265 implementation, 155 behavior
  tests, 125 fixtures, 95 adapters, 55 fuzz/replay, 40 config tests/seeds and 30 wiring, 765 changed lines.


  B002 resolves settings, B061 supplies interoperable encryption, B171 runs pure-helper comparisons,
  B1138/B1113 provide response/event records, and B732 supplies principals. B903 is not called by this hook.
