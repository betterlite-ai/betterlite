dod:
- text: same_user_team decrypts an id carrying user_a/team_a for a user_a/team_a principal and returns the original resp_test.
  proof:
  - case-same-user-team
  - oracle
  - helper-python
- text: >-
    cross_user_forbidden sends user_a/team_a ownership with user_b/team_a; authorization raises HTTPException
    status=403,detail="Forbidden. The response id is not associated with the user, who this key belongs to. To
    disable this security feature, set general_settings::disable_responses_id_security to True in the config.yaml file."
    before returning a routing id. Both owner mismatches select this user error before the team check.
    Helper type,param,code are absent; the consuming HTTP route produces permission_error,null,"403".
  proof:
  - case-cross-user-forbidden
  - oracle
  - helper-python
- text: >-
    cross_team_forbidden keeps user_a but changes team_a to team_b; expect HTTPException status=403,
    detail="Forbidden. The response id is not associated with the team, who this key belongs to. To disable this
    security feature, set general_settings::disable_responses_id_security to True in the config.yaml file."
    The helper has no type,param,code attributes.
  proof:
  - case-cross-team-forbidden
  - oracle
  - helper-python
- text: proxy_admin_unmanaged accepts resp_external and mismatched encrypted owners for PROXY_ADMIN, represented by either enum or value.
  proof:
  - case-proxy-admin-unmanaged
  - oracle
  - helper-python
- text: >-
    no_signing_key_debug_fallback supplies signing_key=None; resp_external is permitted and output resp_test
    remains plaintext with debug "Response ID encryption is enabled but no signing key is configured. Please
    set LITELLM_SALT_KEY environment variable or configure a master_key. Skipping response ID encryption. See:
    https://docs.litellm.ai/docs/proxy/prod#5-set-litellm-salt-key". An explicitly empty signing key does not
    take this fallback. No database writer is called despite the stale upstream docstring.
  proof:
  - case-no-signing-key-debug-fallback
  - oracle
  - helper-python
- text: >-
    stream_id_consistency emits response.created and response.completed for resp_test in one stream: both advertise
    the same encrypted id. Another stream advertises a fresh ciphertext; all decrypt to the same resp_test/user_a/team_a payload.
  proof:
  - case-stream-id-consistency
  - oracle
  - helper-python
- text: >-
    malformed_owned_id_payload supplies decrypted litellm_proxy:responses_api:response_id:resp_test;user_id:user_a
    with no third field: Python raises IndexError and native returns a typed internal failure, mapped by callers
    to 500 internal_server_error/param=null/code="500". A one-field litellm_proxy payload falls back to the original
    addressed id with absent owners; a nonmanaged ciphertext is unmanaged, and a two-field payload never panics in Rust.
  proof:
  - case-malformed-owned-id-payload
  - oracle
  - helper-python
- text: >-
    default_unmanaged_denial uses a normal user_a key, signing key=test-master and both flags omitted;
    resp_external raises HTTPException status=403,detail="Forbidden. This response id was not issued by this
    proxy, so the proxy cannot tell who owns it. To let keys address responses this proxy did not issue, set
    general_settings::allow_unmanaged_response_ids to True in the config.yaml file." Helper type,param,code
    are absent. The same default holds without a callbacks entry because startup installs the hook.
  proof: [case-default-denial, oracle, helper-python]
- text: >-
    setting_overrides separately sets disable_responses_id_security=true and allow_unmanaged_response_ids=true:
    either permits resp_external. A mismatched encrypted owner is permitted only by disable_responses_id_security,
    which logs debug and leaves output ids unencrypted; allow_unmanaged_response_ids still denies that owner with 403.
  proof: [case-settings, oracle, helper-python]
- text: empty_owners encrypts resp_test for a principal with no user or team; another ordinary principal passes because both owner fields are empty.
  proof: [case-empty-owners, oracle, helper-python]
- text: >-
    retained_addressed_id uses aresponses with previous_response_id=resp_wrong and a retained valid owned id;
    previous_response_id becomes resp_test and the retained field stays unchanged. Repeat all four lifecycle call
    types with response_id. Empty/missing/nonstring fields leave data unchanged; acompletion returns None.
  proof: [case-addressed-id, oracle, helper-python]
- text: >-
    response_rewrite_routes encrypts typed chunks on all four create aliases, but leaves chunks on /v1/responses/resp_test,
    /chat/completions and a missing route unchanged. A nonstream ResponsesAPIResponse still encrypts on those routes.
    Test top-level resp_test, nested typed response, nested {id:"resp_test"}, nested {id:7} and nested null; the last
    two remain unchanged. A top-level resp_ id takes precedence over a simultaneous nested response id.
    A top-level id=other is skipped but nested {id:other} is encrypted. Untyped dict chunks stay unchanged.
    Trailing-slash /v1/responses/ and /azure/v1/responses are not create routes for this hook.
  proof: [case-rewrite-routes, oracle, helper-python]
- text: >-
    encrypted_prefix_split supplies prefixresp_<valid ciphertext> and resp_<valid ciphertext>resp_ignored;
    both use the first segment after resp_ and recover resp_test. A string with no resp_ returns false from
    _is_encrypted_response_id and unchanged/null/null from _decrypt_response_id. Decryption returning null
    has the same fallback; decrypted non-litellm_proxy content is unmanaged. Compare these through the
    existing malformed_owned_id_payload test with full rstest case names.
  proof: [case-malformed-owned-id-payload, oracle, helper-python]
- text: The production owned-id decoder and fuzz replay reject truncated UTF-8 and malformed encrypted payloads without panics.
  proof: [id-corpus]
- text: loads_settings proves both false defaults, independent true overrides, absent salt fallback and empty-salt precedence using the config loader.
  proof:
  - config-tests
  - config-corpus
- text: responses_id_security helper fixtures compare decrypted identities and authorization results through the registered native and Python adapters.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: All twelve security fixtures are newly added, with production core/config behavior tests and independent pinned-hook comparison.
  proof:
  - new-oracle-cases
  - behavior-tests
  - oracle
  - helper-python
  - helper-corpus
