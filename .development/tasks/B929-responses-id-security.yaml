  - id: case-stream-id-consistency
    why: the stream-id-consistency behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_id_security::tests::stream_id_consistency($|::)/)'
  - id: case-malformed-owned-id-payload
    why: the malformed-owned-id-payload behavior or its assertions are absent
