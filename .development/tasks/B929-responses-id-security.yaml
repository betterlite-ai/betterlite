  - mutants
  commands:
  - id: case-default-denial
    why: startup defaults permit an ordinary key to address an unmanaged provider id
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_id_security::tests::default_unmanaged_denial($|::)/)'
  - id: case-settings
    why: the two security flags incorrectly have identical effects
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_id_security::tests::setting_overrides($|::)/)'
  - id: case-empty-owners
    why: empty owner fields unexpectedly enforce identity matching
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_id_security::tests::empty_owners($|::)/)'
  - id: case-addressed-id
    why: routing-decoded ids overwrite the retained authorization target
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_id_security::tests::retained_addressed_id($|::)/)'
  - id: case-rewrite-routes
    why: streaming and nonstream output rewriting apply the same route restriction
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_id_security::tests::response_rewrite_routes($|::)/)'
  - id: id-corpus
    why: encrypted response-id parsing has no newly committed malformed-input corpus
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/owned_response_id.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/owned_response_id)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_id_security::tests::replays_corpus$/)'
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::responses_id_security::/)
      - test(/::replays_corpus$/)'
  - id: case-same-user-team
