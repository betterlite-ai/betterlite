deviations:
- what: A decrypted two-field payload returns a typed internal failure in betterlite instead of Python IndexError; consuming routes retain status=500,type=internal_server_error,param=null,code="500".
  why: The no-panics rule prohibits reproducing the unchecked third-field access; the helper projection records the different diagnostic class explicitly.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/responses_id_security.py#L250-L260
out_of_scope:
- B061 owns the encryption algorithms and salt-key material; this task owns the identity payload and authorization policy.
- B080/B938 own creation/lifecycle HTTP registration and its final status, error envelope and header comparisons.
pitfalls:
- SecretBox uses a random nonce; compare decrypted fields and within-stream reuse, never ciphertext strings from independent gateways.
- len(parts)>=2 does not make parts[2] safe; the malformed two-field input needs an error path rather than Rust indexing.
- A no-user/no-team id carries empty owner fields and is accepted by other ordinary principals at this pin.
- The nonstream success hook encrypts any ResponsesAPIResponse, while the streaming hook is restricted to create-route aliases.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 1
