id: B929
title: Responses id security
description: >-
  Implement response-ID ownership authorization and advertised-ID encryption using B732 authenticated principals
  and B061's established secret encryption helper. Add general_settings.disable_responses_id_security=false and
  allow_unmanaged_response_ids=false; resolve LITELLM_SALT_KEY with master-key fallback through config. Keep request-scoped
  encryption reuse and authorize retained addressed IDs before decoding routing IDs.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-core/src/api/responses_id_security.rs. Use ResponsesIdSecurityInput and ResponsesIdSecurityResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): responses_id_security.py:158 status_code=403, exception_detail=FastAPI detail string; responses_id_security.py:193
  status_code=403, exception_detail=FastAPI detail string; responses_id_security.py:207 status_code=403, exception_detail=FastAPI
  detail string. Compare the actual source status, error type, param and code; ignore only error wording except
  in message-extraction tests.


  Write adjacent tests.rs behavior functions same_user_team, cross_user_forbidden, cross_team_forbidden, proxy_admin_unmanaged,
  no_signing_key_debug_fallback, stream_id_consistency, malformed_owned_id_payload under api::responses_id_security::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.LITELLM_SALT_KEY
  defaults to None; general_settings.disable_responses_id_security defaults to False; general_settings.allow_unmanaged_response_ids
  defaults to False. No environment reads occur outside betterlite-config. Test api::responses_id_security::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesIdSecurity in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_id_security: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/hooks/responses_id_security.py: _proxy_general_settings (L43-L46); litellm/proxy/hooks/responses_id_security.py:
  _proxy_signing_key (L49-L55); litellm/proxy/hooks/responses_id_security.py: _response_payload (L61-L65); litellm/proxy/hooks/responses_id_security.py:
  _rewrite_advertised_id (L68-L93); litellm/proxy/hooks/responses_id_security.py: _is_responses_api_create_route
  (L96-L104); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.__init__ (L108-L114); litellm/proxy/hooks/responses_id_security.py:
  ResponsesIDSecurity.async_pre_call_hook (L116-L143); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._authorize_response_id
  (L145-L158); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._unmanaged_response_ids_allowed
  (L160-L169); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.check_user_access_to_response_id
  (L171-L212); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._is_encrypted_response_id (L214-L227);
  litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._decrypt_response_id (L229-L267); litellm/proxy/hooks/responses_id_security.py:
  ResponsesIDSecurity._get_signing_key (L269-L270); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity._encrypt_response_id
  (L272-L303); litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.async_post_call_success_hook (L305-L326);
  litellm/proxy/hooks/responses_id_security.py: ResponsesIDSecurity.async_post_call_streaming_iterator_hook (L328-L343).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 257 owned nonblank/non-comment/non-docstring Python lines (273 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 277 implementation,
  82 behavior tests, 84 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 39 config tests/seeds and
  30 wiring; 602 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B061 (Stored credentials and their
  encryption), B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B903 (Response id codecs),
  B1087 (Api boundaries), B732 (Typed authentication principals and grant resolution). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
