- responses_id_security.py:187 emits the diagnostic 'Responses ID Security is disabled. User %s is accessing response
  id %s which is not associated with them.'; retain its level and fallback instead of turning it into a hard error.
- responses_id_security.py:200 emits the diagnostic 'Responses ID Security is disabled. Response belongs to team
  %s but user %s is accessing it with team id %s.'; retain its level and fallback instead of turning it into a hard
  error.
