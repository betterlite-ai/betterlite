id: B753
title: Per-model auth budget checks and fallback selection
description: >-
  Implement ModelBudgetAdmission with typed limiter/spend ports for key, user, team and end-user limits,
  coordinated global spend lookup. Caller context and resolved
  fallback target are preserved across a budget fallback; no budget reservation or spend mutation occurs
  in this helper.


  User budget lookup skips null user/database, calls B736 with user_id_upsert=false and returns the
  row's model_max_budget; every read error logs DEBUG and returns null. User enforcement skips null
  user IDs and missing/nonmapping/empty budgets. Team enforcement skips null team IDs or falsey team
  budgets; pass the key budget map unchanged so the limiter can implement overrides. Both visit every
  input model in order, including duplicates, ignore the limiter's boolean return and propagate errors.
  The three limiter protocols owned here are the dependency boundary; B071 installs their implementation.


  A key check catches only BudgetExceededError. Nested-model requests whose top-level model differs
  immediately rethrow it. Ask the limiter once for a fallback; null rethrows. Authorize that target via
  B886 then, only for a nonempty team model list, B747 with team aliases, key aliases and team ID.
  ProxyException from either authorization rethrows the original budget error; other exceptions escape.
  Only after authorization mutate request_data.model, B1100 parsed-body cache, request JSON cache,
  serialized body, then an existing dict path_params.model. Missing path keys are not created. Keep
  these effects ordered; serialization failure can follow earlier body mutations. False limiter returns
  without an exception neither select a fallback nor deny.


  Applying end-user budget fields copies nonnull tpm/rpm/tpd/max/model_max_budget, including zero and
  empty maps, then logs DEBUG. Updating the token always assigns end_user_id, even null, but only
  nonnull tpm/rpm/tpd/allowed_model_region/model_max_budget overwrite custom-auth values. It does not
  copy end_user_max_budget. Global spend requires max_budget > 0 and a database. Use the shared cache
  coordinator with prefix [GLOBAL SPEND], cache key default_user_id:spend and B715 bounded lookup
  named proxy_budget of B723 UserRepository user_id=litellm-proxy-budget. Return float spend or null.
  Cache/coordinator failures propagate; null does not schedule an alert, but any known spend including
  zero schedules proxy_budget with the caller-supplied admin name, token, ceiling and PROXY event group.
  B4025 owns budget alert delivery. This task never reserves spend or writes a database row.


  B4291 owns the EventDrivenCacheCoordinator invoked by global-spend singleflight; B126 Redis transport is not
  called directly by this slice. Build the production auth_model_budgets module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _KeyModelBudgetLimiter.is_key_within_model_budget (L307-L307; 1 source lines), _KeyModelBudgetLimiter.get_fallback_model_within_budget
  (L309-L309; 1 source lines), _UserModelBudgetLimiter.is_user_within_model_budget (L313-L315; 3 source
  lines), _TeamModelBudgetLimiter.is_team_within_model_budget (L319-L325; 7 source lines), _TokenTeamModels.team_models
  (L330-L330; 1 source lines), _RawCacheRead.async_get_cache (L334-L334; 1 source lines), _raw_cache (L337-L341;
  5 source lines), _token_team_models (L344-L345; 2 source lines), _read_user_model_max_budget (L348-L374;
  26 source lines), _check_user_model_budget (L377-L395; 18 source lines), _check_team_model_budget (L398-L414;
  17 source lines), _check_key_model_budget_with_fallback (L417-L488; 69 source lines), _apply_budget_limits_to_end_user_params
  (L613-L641; 23 source lines), update_valid_token_with_end_user_params (L710-L726; 13 source lines),
  _fetch_global_spend_with_event_coordination (L733-L757; 22 source lines), get_global_proxy_spend (L760-L790;
  30 source lines).


  Model-budget limiters retain their own numeric contracts; this task forwards limits and spend
  without recomputing costs or normalizing an unknown spend to zero.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.max_budget=0.0.


  Add the auth_model_budgets operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-model-budgets-*
  seed to B171 helper_case, which already owns this decoder.


  Booted chat cases prove the fallback changes the provider-bound model and all request snapshots;
  inaccessible fallback models must preserve the original budget exception and avoid dispatch.


  Use B860/Postgres through POSTGRES_TEST_URL or testcontainers for global spend and optional user
  budget reads, distinguishing known zero from an unavailable aggregate.


  Write betterlite-config::auth_model_budgets::tests::max_budget_default_zero,
  positive_budget_enables_read, zero_negative_and_nan_skip_read and invalid_budget_rejected.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  B1100 owns body serialization/decoding. Compare mutation order under an injected serialization
  failure because this stage does not roll back the already changed parsed model.


  Sizing: 239 owned source lines; allow 239 production, 260 behavior/Postgres tests, 80 helper adapters,
  90 route/manifests/wiring and 50 config lines, 719 changed lines within a 775-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_model_budgets::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
