    why: function/custom requires function.name; missing parameters defaults {type:object,properties:{}} and delegates
      B217 sanitization. Output type=custom and non-None description (including empty) are preserved. B568 eager
      flag is copied only when non-None, including false.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::tools_cases::case_[0-9]+_function_input_schema$/)'
  - id: case-computer-hosted-tools
    why: 'computer_ prefix requires function.parameters, else ValueError Missing required parameter: parameters;
      width/height None raises Missing required parameter: display_width_px or display_height_px. Zero sizes are
      accepted, function.name defaults computer only when absent, optional display_number copied when non-None.
