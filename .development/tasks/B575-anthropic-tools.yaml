    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::tools_cases::case_[0-9]+_eager_input_streaming_defer_loading$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_tools.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_tools*")"
      && grep -lq 'anthropic_tools' tools/oracle/fuzz/corpus/helper_case/anthropic_tools* && cargo nextest run --locked
