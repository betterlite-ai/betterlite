pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_tools in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/tools.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_tools.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- tool_search_tool in the hosted prefix enum shadows both later specialized tool-search branches.
- Native input_schema bypasses parameter validation; namespace expansion is only one level.
