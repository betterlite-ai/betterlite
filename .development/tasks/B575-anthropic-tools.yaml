id: B575
title: Anthropic tools and tool-choice conversion
description: >-
  Add native ToolDefinition variants for functions, hosted/computer tools, advisor, MCP servers and programmatic
  tool calls, using the existing argument/schema helpers. Preserve cache_control, input_examples, allowed_callers,
  eager_input_streaming, defer_loading and parallel choice fields. This layer serializes MCP descriptors but never
  contacts an MCP server.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/transformation.py:
  AnthropicConfig._map_tool_choice L680-L721; AnthropicConfig._map_tool_helper L723-L922; AnthropicConfig._map_openai_mcp_server_tool
  L924-L951; AnthropicConfig._map_tools L953-L997.


  Named case contracts: function_input_schema: function/custom requires function.name; missing parameters defaults
  {type:object,properties:{}} and delegates B217 sanitization. Output type=custom and non-None description (including
  empty) are preserved. B568 eager flag is copied only when non-None, including false. computer_hosted_tools: computer_
  prefix requires function.parameters, else ValueError Missing required parameter: parameters; width/height None
  raises Missing required parameter: display_width_px or display_height_px. Zero sizes are accepted, function.name
  defaults computer only when absent, optional display_number copied when non-None. Hosted prefixes web_search,bash,text_editor,code_execution,web_fetch,memory,tool_search_tool
  need string name from top-level presence then function.name, else Missing required parameter: name; empty name
  accepted, all other fields including function copied. tool_choice_any_none_auto: Strings auto/required/none map
  to auto/any/none; unrecognized strings return None. Dict with type and no function supports auto/required/any/none
  only; native {type:tool,name:...} does not select the tool. Otherwise non-None function.name becomes {type:tool,name:...},
  including empty name. parallel_tool_use: Non-None parallel flag adds inverted disable_parallel_tool_use or creates
  default auto choice if no mapped choice. Only literal string none suppresses the flag; dict {type:none} receives
  it. Missing parallel leaves choice unchanged. mcp_server_configuration: type=url passes through as an MCP descriptor;
  type=mcp maps server_url/server_label to url/name with type=url, includes tool_configuration.allowed_tools whenever
  non-None (including []), and reads only exact headers.Authorization. Remove every occurrence of Bearer , not only
  a prefix, and retain empty authorization_token; ignore other headers and require_approval. advisor_tool: advisor_20260301
  requires a string model (empty accepted), else ValueError Advisor tool must have a valid model; output name=advisor
  plus non-None max_uses/caching. Unknown type raises ValueError Unsupported tool type: <type>. cache_examples_callers:
  Top-level non-None cache_control wins verbatim; otherwise dict function.cache_control is copied, except both exact
  search types suppress cache. For eligible tools top-level non-None allowed_callers wins over nested and must be
  a list of strings (empty valid), else ValueError allowed_callers must be a list of strings. input_examples applies
  only custom/no-type named tools, accepting top-level list or falling back to nested list when top-level is wrong-shaped;
  otherwise silently ignore. eager_input_streaming_defer_loading: Reuse B568 strict eager validation only for function/custom.
  For defer_loading require actual bool at top-level non-None then nested, else ValueError defer_loading must be
  a boolean. Suppress defer_loading and allowed_callers for exact computer_20241022/computer_20250124 and the two
  exact search types, not future computer versions. namespace_and_native_tools: Namespace expands only one level:
  nested input_schema passes unchanged, flat name without function wraps all non-type fields into function (type
  default function), nested function maps normally, other nested shapes are silently skipped. Nonnamespace input_schema
  passes unchanged and bypasses all validation/option copying; preserve separate tool and MCP order. search_tool_branch_shadowing:
  tool_search_tool_regex_20251119 and tool_search_tool_bm25_20251119 are caught by the earlier hosted prefix. Missing
  name raises Missing required parameter: name; there is no default tool_search_tool_regex/bm25 name and the later
  specialized invalid-name message is unreachable. Record these dead branches as no caller at the pin, without fake
  seam oracle cases.


  Write standalone Rust test tools_credential_identity_isolation in betterlite-anthropic: Distinct configured identities
  cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle case.


  Write standalone Rust test tools_secret_safe_failure in betterlite-anthropic: Debug and owned failure paths do
  not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-anthropic/src/tools.rs with adjacent tests under tools/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function tools_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  function_input_schema, computer_hosted_tools, tool_choice_any_none_auto, parallel_tool_use, mcp_server_configuration,
  advisor_tool, cache_examples_callers, eager_input_streaming_defer_loading, namespace_and_native_tools, search_tool_branch_shadowing.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_tools* using HelperCase: kind: helper
  and the externally tagged anthropic_tools variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_anthropic_tools that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 271 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 305 production lines, 275 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 735 planned, 750 maximum changed lines.
