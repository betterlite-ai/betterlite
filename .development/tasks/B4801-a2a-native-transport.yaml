id: B4801
title: Native A2A client transport and bounded localhost retry
description: >-
  Build the native A2A client handle with protocol record conversion, final-message selection and two-attempt send loops. Keep HTTP client ownership and per-agent headers attached to the handle so recovery can recreate the protocol client without exchanging credentials between requests. The task reuses the SDK's native client and conversion boundary, calling create_client and conversions.to_core_send_message_request without reimplementing the A2A wire format.

  The client handle wraps a2a.client.Client with three attached fields: the configured HTTP client (_litellm_httpx_client), a ClientCallContext with extra_headers scoped to the principal (_litellm_call_context), and the resolved agent card (_litellm_agent_card). Provide functions to access these fields and construct the protocol request from the compat-v0.3 SendMessageRequest. Non-streaming send requires the last event to be a Message or Task and fails on an empty stream; streaming accepts empty streams and retries only before the first chunk is yielded. Timeout defaults to DEFAULT_A2A_AGENT_TIMEOUT from litellm.constants (6000 seconds). Both send and stream loops make up to two attempts: the original request and one retry after detecting a localhost URL in a connection error.

  The task builds pure Rust functions that call the injected HTTP pool to resolve the agent card, construct the a2a SDK client with retained handles, and implement the retry loops. Error classification (connection vs localhost vs other) is delegated to B4813. Configuration injection comes through B002. The completion bridge dispatcher (B4809) and recovery logic (B4813) depend on the created client and its attached state.
