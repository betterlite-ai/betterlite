oracle_cases: []
deviations:
  - what: >-
      The default timeout is 6000 seconds despite the LiteLLM constant's "10 minutes" comment being stale.
    why: The comment in litellm/constants.py:578 is incorrect; the actual default value is 6000 seconds (100 minutes), which is preserved here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L578-L589
  - what: >-
      Streaming retries only before any chunk escapes; after the first chunk is yielded, all errors propagate immediately.
    why: Clients cannot restart a partially-consumed stream without retransmitting chunks already sent; LiteLLM enforces this boundary at line 374.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/main.py#L355-L400
out_of_scope:
  - a2a_protocol/main.py:555-582 (send_message), owned by no caller at the pin; the async function asend_message is the canonical entry point.
  - a2a_protocol/main.py:848-890 (aget_agent_card), owned by no caller at the pin outside unused examples; card resolution is built into create_a2a_client.
  - a2a_protocol/client.py (unused class), owned by no caller at the pin; the native client export and entry points are never invoked.
  - A2A SDK creation, protobuf conversion, and transport, sourced from the a2a crate at its pinned version.
  - Request retry and backoff policies beyond the two-attempt localhost retry; B017 owns general request retry semantics.
pitfalls:
  - The SDK's to_core_send_message_request and to_compat_stream_response are pure protocol conversions that require the SDK at the exact pinned version; confirm the API matches before calling.
  - Attaching the HTTP client to the A2A client requires raw field assignment or similar mechanism; the SDK does not provide a public API for injecting a pre-configured client.
  - Localhost retry reconstruction must reuse the same HTTP client and call context without clearing headers or credentials; a fresh client defeats the purpose of recovery.
  - The response_started flag must be set before yielding the first chunk, not after; once a chunk escapes, retries cannot hide the error.
  - An empty non-streaming response (zero events) is an error; an empty streaming response (no chunks) is success.
