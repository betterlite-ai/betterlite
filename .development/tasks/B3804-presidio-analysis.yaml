deviations:
  - what: When the analyzer returns an HTTP error, non-JSON content-type, unparsable JSON, error dict, or unexpected type, the response is treated as fail-closed if pii_entities_config is set or output_parse_pii or apply_to_output is true, raising GuardrailRaisedException; otherwise an empty list is returned with a warning.
    why: LiteLLM returns a sanitized empty list on errors when fail_closed is false, and raises on fail_closed=true. betterlite preserves this behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/presidio.py#L446-L457
  - what: Per-chunk analysis results are filtered by score and deny list before merging; the same filters are applied again downstream in check_pii as a no-op.
    why: Filtering before merge prevents below-threshold detections from winning overlap resolution.
  - what: The chunk semaphore is shared per event loop across all concurrent chunked calls on an instance, so many oversized blocks or concurrent requests still hold at most PRESIDIO_ANALYZE_CHUNK_CONCURRENCY in-flight analyzer calls per loop.
    why: LiteLLM bounds fan-out per instance/loop to prevent analyzer saturation; the proxy's main-thread session lock additionally serializes HTTP calls.

out_of_scope:
  - "get_guardrail_dynamic_request_body_params from CustomGuardrail (line 386 in litellm): owned by B104, which has no task file yet. B3804 calls it but does not implement it. The merge of dynamic request body params into the analyze payload is in scope; the base method is deferred to B104."
  - "_close_http_session (lines 333-342 in litellm): only called in __del__, which is a no-op. Code owns the session, not this cleanup; proper cleanup belongs to B3805 or the lifecycle caller."
  - "_has_block_action (lines 347-351 in litellm): no caller at the pin outside tests. Checked dynamically in check_pii (B3805), not here."
  - "check_pii and raise_exception_if_blocked_entities_detected and anonymize_text and their callees: owned by B3805."
  - "_post_presidio_anonymize and anonymize_text and _finalize_* methods: owned by B3805."
  - "get_supported_event_hooks, __init__, async_pre_call_hook, apply_guardrail and other hooks: owned by lifecycle/application tasks after B3804."
  - "Example Presidio fixture at litellm/proxy/hooks/example_presidio_ad_hoc_recognizer.json: owned by the lifecycle task that loads ad-hoc recognizers."

pitfalls:
  - "JSON-escaped byte length includes the quotes around the string; subtract 2 from the json.dumps result to measure the content."
  - "Chunk boundary overlap is calculated per-chunk, not globally; capping at len(chunk) // 2 prevents infinite overlap loops."
  - "A chunk can be as small as 1 character; the binary search maintains low >= 1 to keep the algorithm advancing."
  - "Overlapping detections in the merge are resolved by longest span (highest score on ties) only within the same entity type; different types may still overlap."
  - "The semaphore is cached by event loop; a new loop or a main-thread context gets a new or reused semaphore as needed."
  - "Fail-closed is true when pii_entities_config is set OR output_parse_pii OR apply_to_output; any one triggers guardrail exception on analyzer errors."
  - "Empty or whitespace-only text is skipped before the try block; it never reaches the analyzer."

