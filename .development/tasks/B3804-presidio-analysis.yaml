dod:
  - text: _JsonResponse protocol and _json_body async function exist and accept a response with a json() method.
    proof: [json-response-protocol]
  - text: _json_escaped_len calculates UTF-8 byte length of text as it appears in a JSON request body (json.dumps escaping).
    proof: [json-escaped-len]
  - text: _get_session_iterator returns an async context manager that yields an aiohttp.ClientSession, using the shared main-thread session or creating a loop-bound session for background threads.
    proof: [session-iterator]
  - text: _get_presidio_analyze_request_payload returns a PresidioAnalyzeRequest with text, language, ad_hoc_recognizers (if set), entities (if pii_entities_config is set), and merged dynamic request body params.
    proof: [analyze-payload]
  - text: analyze_text sends a POST request to the analyzer endpoint with the constructed payload and returns a list of PresidioAnalyzeResponseItem on success.
    proof: [analyze-success]
  - text: analyze_text raises GuardrailRaisedException with guardrail_name and a sanitized message when the analyzer returns HTTP >= 400, non-JSON content-type, unparsable JSON, error dict, or unexpected type, if pii_entities_config is set or output_parse_pii or apply_to_output is true.
    proof: [analyze-fail-closed]
  - text: analyze_text returns an empty list with a warning when the analyzer returns errors and fail_closed is false.
    proof: [analyze-fail-open]
  - text: analyze_text skips empty or whitespace-only text and returns an empty list.
    proof: [analyze-empty-text]
  - text: _analyze_text_chunked splits oversized text into overlapping chunks and concurrently analyzes each chunk with at most PRESIDIO_ANALYZE_CHUNK_CONCURRENCY requests in flight per event loop.
    proof: [chunk-concurrency]
  - text: _analyze_text_chunked filters per-chunk results by score and deny list before merging, and raises if any chunk fails.
    proof: [chunk-filtering]
  - text: _get_chunk_semaphore returns a per-event-loop semaphore shared by all chunked analyze calls on the instance.
    proof: [chunk-semaphore]
  - text: _coerce_analyze_chunk_size returns DEFAULT_PRESIDIO_ANALYZE_CHUNK_SIZE_BYTES for None, zero or negative values, and max(value, 4) for positive values.
    proof: [chunk-size-coercion]
  - text: _split_text_for_analysis splits text into (offset, chunk) pairs where each chunk's JSON-escaped form is at most chunk_size_bytes, with up to overlap_chars character overlap between consecutive chunks.
    proof: [text-splitting]
  - text: _split_text_for_analysis uses binary search to find the largest chunk prefix that fits the byte budget, and ensures every chunk advances by at least 1 character.
    proof: [text-split-binary-search]
  - text: _merge_chunked_analyze_results remaps per-chunk offsets to the original text and deduplicates overlapping same-entity-type detections by keeping the longest span (highest score on ties).
    proof: [chunk-merge]
  - text: _merge_chunked_analyze_results sorts the final result by position and allows different entity types to overlap.
    proof: [merge-sort]
  - text: filter_analyze_results_by_score drops detections below per-entity score thresholds or in the deny list, and returns the results unchanged if no thresholds or deny list is configured.
    proof: [filter-by-score]

