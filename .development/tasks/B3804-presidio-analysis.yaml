id: B3804
title: Presidio analysis chunking and entity filtering
description: >-
  Implement Presidio text analysis with overlapping chunk splitting, concurrent analysis
  bounding, and filtered result merging. Build JSON-escaped byte budgeting for chunk
  boundaries, semaphore-based concurrency control per event loop, and offset remapping
  for overlapping detections. Preserve score and deny-list filtering, fail-closed
  behavior when PII protection is configured, and separate error handling for analysis
  versus anonymization paths.

  Key behavior: texts larger than presidio_analyze_chunk_size_bytes (UTF-8 encoded in
  the JSON request body) are split into overlapping chunks with PRESIDIO_ANALYZE_CHUNK_OVERLAP_CHARS
  character overlap, analyzed concurrently with at most PRESIDIO_ANALYZE_CHUNK_CONCURRENCY
  in-flight requests per event loop, and results are remapped to the original text
  with deduplication of overlapping same-type detections by longest span. When
  pii_entities_config is set or output_parse_pii or apply_to_output is true, analyzer
  HTTP errors (status >= 400), non-JSON responses, or unparsable result shapes raise
  GuardrailRaisedException with guardrail_name and a sanitized message; otherwise they
  return an empty list with a warning. Per-chunk results are filtered by score threshold
  and deny list before merging. The default chunk size is DEFAULT_PRESIDIO_ANALYZE_CHUNK_SIZE_BYTES;
  zero or negative configured sizes fall back to the default; sizes below 4 bytes are
  floored to 4.

