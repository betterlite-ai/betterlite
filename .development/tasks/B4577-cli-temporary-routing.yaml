deviations:
- what: >-
    betterlite uses native Rust signal-hook and once_cell for signal handling and one-time cleanup instead of
    Python's signal.signal and atexit.register. Signal delivery and cleanup timing match LiteLLM's: both signals
    set a stop event, and the process restores settings once on first exit path and then exits.
  why: >-
    Rust does not expose Python's atexit module; signal-hook and once_cell provide safe, idiomatic equivalents
    with the same observable behavior. File system operations use native Rust crates instead of Python os module.
  link: https://docs.rs/signal-hook/latest/signal_hook/
out_of_scope:
- Dev config overrides to suppress fresh-login enforcement (LiteLLM has none in the code path covered here).
- Streaming or interactive terminal features beyond TTY detection and error messages.
- Autoroute process launching (`lite up autoroute`); that is B4584's responsibility.
pitfalls:
- >-
  Signal handlers must not allocate memory or call async code. Use a simple atomic event flag for stop signaling and
  always acquire the restore lock before attempting I/O; if the lock is already held, return silently so concurrent
  signals do not race.
- >-
  The backup JSON parser must reject invalid UTF-8 and unexpected fields via serde::Deserialize strict validation,
  not silently default them, so a user who edits the backup cannot corrupt the restore.
- >-
  Fresh-login check must call B4574's `get_stored_api_key` with the resolved base URL, not the CLI context's base URL
  directly, since the two may differ when the user provides an explicit --api-key flag.
- >-
  One-time restore is critical: if the restore lock is held across an atexit call, the lock never releases and a second
  signal will deadlock. Use a non-blocking acquire and return early if the lock is already held.
- >-
  The source's `click.ClickException` carries a message meant for users; preserve it exactly in UpError so the CLI
  layer can render it without extra formatting.
- >-
  Test with explicit signal sending (via the signal crate in test helpers) to verify SIGINT/SIGTERM/atexit all invoke
  cleanup exactly once, with no double-restore or deadlock.
review_level: security
