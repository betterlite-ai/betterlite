dod:
- text: >-
    ensure_fresh_login rejects an API key when the stored login token is missing or stale (checked via B4574's logic),
    invokes `login` interactively only when stdin is a TTY, and raises an error with the exact command suggestion when
    a non-TTY caller cannot login.
  proof:
  - oracle
- text: >-
    The `up` command patches ~/.claude/settings.json with the resolved key as a static token, merges the status line
    script, and holds open until Ctrl-C is pressed; every signal (SIGINT, SIGTERM) and atexit cleanup restores the
    original file exactly once.
  proof:
  - oracle
  - up-signal-tests
- text: >-
    A backup file that already exists is refused with a message matching LiteLLM's, and a corrupted backup JSON raises
    UpError with the path and "invalid or unexpected JSON" text.
  proof:
  - oracle
- text: >-
    The proxy key is verified via B4564's `verify_proxy_key` before settings are patched, and a failed verification
    raises an error with the exact proxy-check failure message.
  proof:
  - oracle
- text: >-
    Settings restoration skips the restore if no backup exists, restores the file if backup.existed=true and
    backup.content is present, removes the file if backup.existed=false, and deletes the backup file in all success cases.
  proof:
  - oracle
  - up-restore-tests
- text: >-
    Fresh-login enforcement applies even when an explicit --api-key is supplied, and the stored key is checked via
    B4574's `get_stored_api_key` with the resolved base URL.
  proof:
  - oracle
