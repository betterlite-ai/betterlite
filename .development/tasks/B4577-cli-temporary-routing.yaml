id: B4577
title: Temporarily route Claude sessions through the gateway
description: >-
  Build the foreground `up` command that temporarily patches ~/.claude/settings.json to route Claude Code sessions
  through the LiteLLM proxy until stopped. Enforce fresh-login requirements: a stored API key must be recent
  (checked via B4574's token freshness logic), and if none exists or is stale, invoke `login` interactively.
  Extract the resolved key via B4585's `resolve_api_key`, verify it works with B4564's `verify_proxy_key`,
  back up the original settings file (recording whether it existed and saving its JSON content via B4575's BackupRecord),
  merge the key as a static token with B4562's `merge_claude_settings` and `install_statusline_script`, then hold
  the process open with signal handlers (SIGINT, SIGTERM) until Ctrl-C. On normal exit or signals, restore the original
  file exactly once using B4575's `_restore_and_report` and exit. Refuse to run if a backup already exists, indicating
  a prior `lite up` is still running or crashed. Preserve one-time-restore semantics via a lock so concurrent signals
  do not race, and error messages must match LiteLLM's when backup JSON is corrupted, settings writes fail or the
  proxy rejects the key. Build as native Rust under crates/betterlite-cli/src/up.rs, not as a Python module.
