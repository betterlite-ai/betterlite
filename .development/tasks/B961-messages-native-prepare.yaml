id: B961
title: Messages native prepare
description: >-
  Prepare native Messages URLs, environment headers, supported fields, billing-header stripping and system-role
  placement through B027/B010. Implement base capability/retry contracts as explicit enums and typed records; use
  configured credentials and preserve mid-turn system ordering around tool results.


  Implement crates/betterlite-core/src/api/messages_native_prepare.rs, crates/betterlite-provider/src/api/messages_native_prepare.rs.
  Use MessagesNativePrepareInput and MessagesNativePrepareResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions system_role_after_tool_results, billing_system_header, cache_control_scope,
  native_messages_url, native_retry_contract under api::messages_native_prepare::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesNativePrepare in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_native_prepare: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


