  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 319 owned nonblank/non-comment/non-docstring Python lines (409 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 339 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 597 total within the 600-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B176 (Trusted controls, provider headers and affinity), B958 (Messages errors),
  B1087 (Api boundaries), B960 (Anthropic beta filter), B570 (Anthropic request headers and model discovery). These
  are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on
  the provider and keys/data branches.
