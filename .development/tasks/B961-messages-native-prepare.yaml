    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::messages_native_prepare::/)
      - test(/::replays_corpus$/)'
  - id: case-system-role-after-tool-results
    why: the system-role-after-tool-results behavior or its assertions are absent
