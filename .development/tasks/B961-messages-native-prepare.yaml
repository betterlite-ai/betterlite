id: B961
title: Native Messages headers, system placement and retry contract
description: >-
  Add Messages preparation to the B010 provider contract and implement Anthropic preparation in
  betterlite-core::api::messages_native_prepare. Own messages/transformation.py L59-L284, the complete
  mid_conversation_system.py and base_llm/anthropic_messages/transformation.py. Express base defaults as provider
  enum behavior, not an open implementation registry. B567 supplies resolved credentials, OAuth handling and
  base URLs; B960 injects beta features, B571 supplies invalid-thinking detection/stripping, B2221 answers
  supports_mid_conversation_system, and B958 supplies response/error records.

  The native request transform deliberately does not call system normalization: subclasses opt into it.
  Leading system turns are hoisted; on models without supports_mid_conversation_system, later system turns
  become user reminders and move after a following tool-result turn. Preserve the top-level system prefix and
  all earlier conversation content. Only content is carried from converted system messages, never their other fields.

  HelperCall::MessagesNativePrepare compares complete URL/header projections, system transformations and retry
  decisions against the pinned methods. It never sends HTTP; B1118 tests actual attempts. Inputs are decoded
  records, so there is no new byte parser. Test both core implementation and provider contract defaults.
  Count 393 nonblank/non-comment source lines in the owned ranges, including docstrings. Allow 310 implementation,
  180 tests, 135 fixtures, 95 adapters and 45 contract wiring lines, 765 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_native_prepare.rs
  - crates/betterlite-core/src/api/messages_native_prepare/**
  - crates/betterlite-provider/src/lib.rs
  - crates/betterlite-provider/src/api.rs
  - crates/betterlite-provider/src/api/messages_native_prepare.rs
  - crates/betterlite-provider/src/api/messages_native_prepare/**
  - crates/betterlite-provider/src/operation.rs
  - crates/betterlite-provider/src/prepared.rs
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/messages_native_prepare.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/messages_native_prepare.py
  - tools/oracle/fuzz/corpus/helper_case/messages_native_prepare-*
  - tools/oracle/cases/helpers/messages-native-prepare/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/transformation.py#L59-L284
  why: Own native capability lists, credential/version defaults, URL suffixing, cache scope removal and system normalization.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/anthropic_messages/transformation.py#L21-L181
  why: Own the base Messages contract, no-op signing and two-attempt invalid-thinking retry policy.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/messages/mid_conversation_system.py#L1-L75
  why: Own all helpers that convert system content and keep tool results adjacent to tool calls.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/mid_conversation_system.py#L47-L49
  why: The converted system turn starts with this exact operator-note text; the chat-template implementation remains B221.
dod:
- text: >-
    native_supported_fields returns messages,model,system,max_tokens,stop_sequences,temperature,top_p,top_k,tools,
    tool_choice,thinking,context_management,compaction,output_format,inference_geo,speed,output_config,reasoning_effort,
    safeguards in that order for anthropic. A subclass provider=bedrock omits only compaction; a null provider
    resolves to anthropic. metadata and stream are absent. Native beta filtering is false, cross-provider true,
    and should_strip_billing_metadata is false by default.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    native_url_suffix uses no configured base and gets https://api.anthropic.com/v1/messages. Given
    https://configured.test it appends /v1/messages; a base already ending /v1/messages stays unchanged;
    https://configured.test/ becomes https://configured.test//v1/messages. B567's ANTHROPIC_API_BASE beats
    ANTHROPIC_BASE_URL, and an explicit nonempty base beats both; this helper never consults litellm.api_base.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    environment_header_precedence keeps caller X-API-Key=caller or Authorization=Bearer caller, without adding
    a second credential. With neither, api_key=sk-test yields x-api-key=sk-test; no key/token raises SDK
    AuthenticationError status=401, type/param/code absent, with source message naming ANTHROPIC_API_KEY and
    ANTHROPIC_AUTH_TOKEN. Default anthropic-version=2023-06-01 and content-type=application/json are inserted;
    lowercase explicit values survive, but mixed-case versions coexist with these lowercase defaults. OAuth
    sk-ant-oat-test runs B567's projection and adds oauth-2025-04-20 and anthropic-dangerous-direct-browser-access=true.
    The returned api_base equals the supplied value, including null. Ignore only error message wording for failures.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    billing_and_cache_fields removes a string starting exactly x-anthropic-billing-header: and text blocks with
    that prefix, returning null if none remain. Leading whitespace, non-text blocks and non-dict list members stay.
    Cache sanitization removes scope=global only from dict cache_control in top-level system list and message
    content lists; ttl=1h and type=ephemeral stay. Message-level cache_control and tool cache_control remain intact.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    system_turn_placement sends top-level system=base, leading system content=initial, user=question, assistant
    tool_use id=t, system content=reminder, user tool_result id=t and user=next. On an older model, top-level system
    becomes text blocks base,initial; the tool_result precedes a new user turn whose content begins "Operator note
    (not from the user): the following was originally a mid-conversation system-role reminder." then reminder.
    With supports_mid_conversation_system=true, the middle system turn stays in place. Missing/non-list messages
    cause no change; empty/all-system messages, trailing system runs, multiple reminders and a tool_result that
    is not the first content block test the placement boundaries. Billing text is filtered even when nothing hoists.
    as_system_content_blocks maps null to [], string x to [{type:text,text:x}], lists to copies and other values
    to one-element lists. Converted message cache_control is not carried.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    base_retry_defaults keeps headers and returns signed_body=null; base URL null resolves to empty string,
    handles_web_search_natively=true, uses_get_llm_provider_api_base=false and beta filtering=true. Missing stream
    implementation raises NotImplementedError "Subclasses must implement this method". Error conversion preserves
    status=418,message=teapot,headers={retry-after:2}. max_retry_on_anthropic_messages_http_error=2; HTTP 400 with
    "Invalid signature in thinking block" retries and strips thinking/redacted_thinking history, whereas status=500
    or a 400 "bad tool" neither retries nor mutates the body. Retry execution stays with B1118.
  proof: [behavior-tests, oracle, helper-python]
- text: Preparation fixtures and the messages_native_prepare tag are newly present and run both independent implementations.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: native header rules or provider contract defaults have no behavior tests
    run: cargo nextest run --locked -p betterlite-core -p betterlite-provider --no-tests=fail -E 'test(/^api::messages_native_prepare::/)'
  - id: helper-python
    why: preparation comparison does not call the pinned implementation
    run: test -f tools/oracle/helpers/messages_native_prepare.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: native preparation has no helper dispatch seed
    run: grep -qE '^[[:space:]]+messages_native_prepare:' tools/oracle/fuzz/corpus/helper_case/messages_native_prepare-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: there are no new native preparation comparisons
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-native-prepare)"
oracle_cases:
- tools/oracle/cases/helpers/messages-native-prepare/native-supported-fields.yaml
- tools/oracle/cases/helpers/messages-native-prepare/native-url-suffix.yaml
- tools/oracle/cases/helpers/messages-native-prepare/environment-header-precedence.yaml
- tools/oracle/cases/helpers/messages-native-prepare/billing-and-cache-fields.yaml
- tools/oracle/cases/helpers/messages-native-prepare/system-turn-placement.yaml
- tools/oracle/cases/helpers/messages-native-prepare/base-retry-defaults.yaml
deviations: []
out_of_scope:
- B960 owns _messages_carry_output_config and _update_headers_with_anthropic_beta in messages/transformation.py.
- B2430 owns thinking mapping and request transformation L287-L570; B962 owns response transformation and the stream factory L572-L608.
- B567 owns OAuth, key/token and base environment resolution; B571 owns invalid-thinking recognition and history stripping.
- B982 owns native call dispatch and status handling; B009 owns HTTP attempts. This task supplies the signing contract, not transport execution.
pitfalls:
- Authentication header detection ignores case, but anthropic-version and content-type default insertion does not.
- First-party Anthropic forwards system-role messages unchanged unless a subclass explicitly invokes normalization.
- Moving a converted reminder before a tool_result makes an otherwise valid tool exchange invalid upstream.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
