id: B3182
title: Provider form catalog from Azure Speech through Cortecs
description: >-
  Preserve the fifteen provider definitions spanning from Azure Speech through Cortecs in the bundled catalog.
  Carry their credential field order, display names, and model placeholders exactly as LiteLLM defines them.
  Include Azure Speech's subscription-key guidance, ChatGPT's empty credentials, and provider-specific endpoint placeholders such as Cognition's https://api.cognition.ai/v1 and Cortecs' https://api.cortecs.ai/v1.
  These forms are consumed as static catalog data by B3190's `get_provider_fields` loader.
  Asset path: `crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json`.
  This task supplies no executable code, only data that B3190 incorporates into its provider-field response.
  Count: 369 preserved data lines from LiteLLM.
scope:
  paths:
    - crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/provider_create_fields.json#L677-L1045
    why: Fifteen complete provider records Azure_Speech through CORTECS with credential fields, display names, and model placeholders.
dod:
  - text: Add crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json preserving all fifteen provider definitions (Azure_Speech, AZURE_TEXT, BASETEN, BYTEZ, Cerebras, CHATGPT, CLARIFAI, CLOUDFLARE, CODESTRAL, Cognition, Cohere, COHERE_CHAT, COMETAPI, COMPACTIFAI, CORTECS) with exact field structure, ordering, credential labels and tooltips.
    proof:
      - catalog-data-present
  - text: Catalog records match LiteLLM line-for-line for every field key, placeholder, tooltip, required flag, field_type and default_value. All fifteen providers have exact credential_fields array, default_model_placeholder, provider_display_name and litellm_provider values.
    proof:
      - catalog-data-exact
      - azure-text-fields
      - baseten-fields
      - bytez-fields
      - cerebras-fields
      - chatgpt-empty-credentials
      - clarifai-fields
      - cloudflare-fields
      - codestral-fields
      - cognition-fields
      - cohere-fields
      - cohere-chat-fields
      - cometapi-fields
      - compactifai-fields
      - cortecs-fields
      - azure-speech-fields
  - text: The asset excludes any records outside the owned range; it contains no partial objects or formatting anomalies that would break JSON parsing.
    proof:
      - catalog-json-valid
checks:
  optional: []
  commands:
    - id: catalog-data-present
      why: the asset file is missing or incomplete
      run: test -f crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json | grep -Fq "provider_create_fields_speech_cortecs.json" && test -s crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: catalog-data-exact
      why: catalog record count does not match the expected fifteen providers
      run: jq -e 'length == 15 and .[0].provider == "Azure_Speech" and .[-1].provider == "CORTECS"' crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: azure-speech-fields
      why: Azure_Speech credential_fields, display_name or default_model_placeholder do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "Azure_Speech") | (.credential_fields | length == 1 and .[0].key == "api_key" and .[0].field_type == "password" and .[0].required == true and (.[0].tooltip | contains("Ocp-Apim-Subscription-Key"))) and .default_model_placeholder == "azure_speech/short-audio"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: azure-text-fields
      why: AZURE_TEXT credential_fields, field_type values or default_model_placeholder do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "AZURE_TEXT") | (.credential_fields | length == 2 and .[0].key == "api_base" and .[0].field_type == "text" and .[0].required == false and .[1].key == "api_key" and .[1].field_type == "password" and .[1].required == false) and .default_model_placeholder == "gpt-3.5-turbo"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: baseten-fields
      why: BASETEN credential_fields, field_type values or default_model_placeholder do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "BASETEN") | (.credential_fields | length == 2 and .[0].key == "api_base" and .[1].key == "api_key" and .[0].field_type == "text" and .[1].field_type == "password") and .default_model_placeholder == "gpt-3.5-turbo"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: bytez-fields
      why: BYTEZ credential_fields or field_type values do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "BYTEZ") | .credential_fields | length == 2 and .[0].key == "api_base" and .[1].key == "api_key" and .[0].field_type == "text" and .[1].field_type == "password"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: cerebras-fields
      why: Cerebras credential_fields, required flag or field_type do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "Cerebras") | .credential_fields | length == 1 and .[0].key == "api_key" and .[0].required == true and .[0].field_type == "password"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: chatgpt-empty-credentials
      why: ChatGPT credential_fields is not an empty array
      run: >-
        jq -e '.[] | select(.provider == "CHATGPT") | .credential_fields == [] and .default_model_placeholder == "chatgpt/gpt-5.4"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: clarifai-fields
      why: CLARIFAI credential_fields, keys or required flags do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "CLARIFAI") | .credential_fields | length == 2 and .[0].key == "api_base" and .[1].key == "api_key" and .[0].required == false and .[1].required == false'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: cloudflare-fields
      why: CLOUDFLARE credential_fields, field_type or required flags do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "CLOUDFLARE") | .credential_fields | length == 2 and .[0].field_type == "text" and .[1].field_type == "password" and .[0].required == false and .[1].required == false'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: codestral-fields
      why: CODESTRAL credential_fields, field_type or required flags do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "CODESTRAL") | .credential_fields | length == 2 and .[0].field_type == "text" and .[1].field_type == "password" and .[0].required == false and .[1].required == false'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: cognition-fields
      why: Cognition endpoint placeholder, api_key required flag or fields do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "Cognition") | (.credential_fields | length == 2 and .[0].key == "api_base" and .[0].placeholder == "https://api.cognition.ai/v1" and .[1].key == "api_key" and .[1].required == true) and .default_model_placeholder == "cognition/swe-1.7"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: cohere-fields
      why: Cohere credential_fields, required flag or field_type do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "Cohere") | .credential_fields | length == 1 and .[0].key == "api_key" and .[0].required == true and .[0].field_type == "password"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: cohere-chat-fields
      why: COHERE_CHAT credential_fields, keys or required flags do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "COHERE_CHAT") | .credential_fields | length == 2 and .[0].key == "api_base" and .[1].key == "api_key" and .[0].required == false and .[1].required == false'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: cometapi-fields
      why: COMETAPI credential_fields, keys or required flags do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "COMETAPI") | .credential_fields | length == 2 and .[0].key == "api_base" and .[1].key == "api_key" and .[0].required == false and .[1].required == false'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: compactifai-fields
      why: COMPACTIFAI credential_fields, keys or required flags do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "COMPACTIFAI") | .credential_fields | length == 2 and .[0].key == "api_base" and .[1].key == "api_key" and .[0].required == false and .[1].required == false'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: cortecs-fields
      why: CORTECS endpoint placeholder, api_key required flag or default_model_placeholder do not match LiteLLM
      run: >-
        jq -e '.[] | select(.provider == "CORTECS") | (.credential_fields | length == 2 and .[0].key == "api_base" and .[0].placeholder == "https://api.cortecs.ai/v1" and .[1].key == "api_key" and .[1].required == true) and .default_model_placeholder == "cortecs/gpt-6-sol"'
        crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
    - id: catalog-json-valid
      why: the JSON does not parse or contains malformed structures
      run: jq -e 'type == "array"' crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json
oracle_cases: []
deviations: []
out_of_scope:
  - Provider adapter implementations or authentication logic (belong to individual provider tasks).
  - JSON assembly or ordering beyond preserving the pinned sequence (B3190 handles composition).
  - Config keys or environment variables (belong to B002).
  - HTTP routes or responses (belong to B3190).
pitfalls:
  - The asset must be placed at crates/betterlite-server/assets/provider_create_fields_speech_cortecs.json so B3190's asset-bundling loader can locate and assemble it alongside the other provider-field fragments.
  - ChatGPT is the only provider in this range with no credential fields. The credential_fields array must be empty, not omitted, to preserve the exact structure.
  - Azure Speech's tooltip refers to AZURE_SPEECH_REGION and AZURE_SPEECH_API_BASE environment variables; drop this guidance and users lose the multi-region setup path.
  - Every nested credential field must preserve its exact key, label, placeholder value (including null) and tooltip text; mismatched quotes or escaped characters break LiteLLM compatibility.
  - Cognition and Cortecs both have api_base fields with placeholder URLs that are not generic gpt-3.5-turbo; preserve them verbatim.
  - default_model_placeholder values are model identifiers, not instructions; preserve them exactly (e.g., azure_speech/short-audio, cortecs/gpt-6-sol).
review_level: standard
budget:
  max_changed_lines: 625
  max_new_expects: 0
