id: B3428
title: Eval run creation and listing routes
description: >-
  Register POST and GET `/v1/evals/{eval_id}/runs` routes in `betterlite-server::api::eval_run_create_list_routes`.
  The module exports a function that registers these two routes with the server and returns a router factory.
  For create_run, decode the request body with orjson and apply model selection precedence: header `x-litellm-model`,
  then query `model`, then body `model`, then `completion.model` (only when completion is a dictionary).
  Overwrite `eval_id` from the path parameter unconditionally. A present body `custom_llm_provider`, even when null,
  is not replaced by the query default `openai`; only apply the default when the key is entirely absent from the body.
  For list_runs, never read a request body. Build request data entirely from path and query parameters, populating
  `limit`, `after`, `before`, and `order` fields including null values, with `limit` defaulting to 20 when not in the query.
  Apply model selection precedence: header `x-litellm-model`, then query `model`. Overwrite `eval_id` from the path.
  Decode request bodies before the try/catch block so malformed JSON is a 400 parse error, not caught by exception handlers.
  Hand off to authenticated common processing through `ProxyBaseLLMRequestProcessing.base_process_llm_request` on route_type
  `acreate_run` or `alist_runs`, and catch exceptions through `ProxyBaseLLMRequestProcessing._handle_llm_api_exception`.
  Response models are `Run` and `ListRunsResponse` from B3420's contracts.
scope:
  paths:
    - crates/betterlite-server/src/api/eval_run_create_list_routes.rs
    - crates/betterlite-server/src/api/eval_run_create_list_routes/**
    - tools/oracle/cases/evals/runs/**
    - Cargo.toml
    - deny.toml
    - tools/oracle/helpers/b3428.py
    - tools/oracle/helpers/b3428/**
    - tools/oracle/src/helpers/server/b3428.rs
    - tools/oracle/src/helpers/server/b3428/**
  lint_tables: false
references:
