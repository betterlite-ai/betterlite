deviations:
  - what: "For create_run: request body decoding (JSON parse errors) occurs before the try/catch block so malformed bodies return 400 with a parse error, not a 500 from the handler."
    why: "LiteLLM's FastAPI route handler implicitly parses bodies as part of the request lifecycle; betterlite's explicit decode before try/catch preserves the same error surface (400 on bad JSON) without changing the visible contract."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_evals_endpoints/endpoints.py#L629"
  - what: "For list_runs: request data is built entirely from path and query parameters; the body is never read, even if present."
    why: "LiteLLM's list_runs GET route in FastAPI does not accept a request body parameter, so no body is available. Betterlite's implementation avoids reading request bytes when the operation does not use them, matching LiteLLM's behavior."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_evals_endpoints/endpoints.py#L677-L693"
out_of_scope:
  - "ProxyBaseLLMRequestProcessing.base_process_llm_request implementation and its internal processing steps; B004 owns that in litellm/proxy/common_request_processing.py, and routes only call it."
  - "ProxyBaseLLMRequestProcessing._handle_llm_api_exception implementation and error envelope construction; B004 owns that in litellm/proxy/common_request_processing.py, and routes only catch and delegate to it."
  - "Authentication and user_api_key_auth dependency injection; B756 or another auth task owns that."
  - "The concrete operation implementations (acreate_run, alist_runs) owned by B3424; routes only dispatch to them."
pitfalls:
  - "For create_run: model selection must check header (x-litellm-model) first, then query, then body, then completion.model only if completion is a dict. The line order in LiteLLM is the authority."
  - "For create_run: completion.model is checked only when completion is a dict; if completion is null or not a dict, this fallback does not apply."
  - "For list_runs: the body must never be read, even if the client sends one. Query parameters alone define the request; all pagination fields (limit, after, before, order) go into the data dict with their actual values including null."
  - "For list_runs: limit defaults to 20 only when absent from the query; if the query provides any value for limit (including None or 0 if the client sends it), that value is used."
  - "For both routes: custom_llm_provider must never default to openai when a body value (including null) is present. Only apply the default when the key is entirely absent from the body."
  - "Path eval_id overwrites body eval_id unconditionally in create_run; this is not a precedence rule, it is always the source of truth."
  - "Body parsing with orjson must happen outside the try block in create_run so parse errors are visible as 400 responses, not caught by exception handlers."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
