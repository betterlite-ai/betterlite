    why: "POST /v1/evals/{eval_id}/runs: the create_run route, model selection precedence (header > query > body > completion.model), path eval_id override, custom_llm_provider handling, delegation to base_process_llm_request and exception handling."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_evals_endpoints/endpoints.py#L677-L767
    why: "GET /v1/evals/{eval_id}/runs: the list_runs route, path parameter and query-only data building (never reads body), pagination defaults including limit=20, model selection (header > query only), custom_llm_provider defaults."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L2461-L2524
    why: "ProxyBaseLLMRequestProcessing.base_process_llm_request and its signature, including route_type, user_api_key_dict and other parameters passed by every route."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L3625-L3774
    why: "ProxyBaseLLMRequestProcessing._handle_llm_api_exception and the error envelope it produces."
dod:
  - text: "The two routes POST /v1/evals/{eval_id}/runs (create_run) and GET /v1/evals/{eval_id}/runs (list_runs) are registered with the correct HTTP methods and paths."
    proof: [http-routes]
  - text: "For create_run: model selection uses header x-litellm-model first, then query model, then body model, then completion.model (only when completion is a dict), matching every listed oracle case."
    proof: [create-model-selection]
  - text: "For list_runs: model selection uses header x-litellm-model first, then query model only; body is never read."
    proof: [list-model-selection]
  - text: "For create_run: path eval_id overwrites any eval_id value from the request body unconditionally."
    proof: [create-path-id-override]
  - text: "For list_runs: path eval_id is set in the data dict and list_runs never reads a request body."
    proof: [list-no-body]
  - text: "For both routes: a present body custom_llm_provider, even null, is not replaced by the query default openai."
    proof: [provider-null-handling]
  - text: "For create_run: request body decoding (JSON parse errors) happens before the try/catch block, so malformed bodies return 400 with parse error details."
    proof: [create-malformed-body]
  - text: "For create_run: model is resolved only from header, query, body, and completion.model when completion is a dict; other fields in completion are not checked."
    proof: [completion-dict-check]
  - text: "For list_runs: pagination fields (limit, after, before, order) are included in the data dict with their values including null, and limit defaults to 20 when absent from the query."
    proof: [list-pagination]
  - text: "Every route delegates to ProxyBaseLLMRequestProcessing.base_process_llm_request with route_type acreate_run or alist_runs."
    proof: [processor-delegation]
  - text: "Exceptions are caught and passed to ProxyBaseLLMRequestProcessing._handle_llm_api_exception."
    proof: [error-handling]
  - text: "Response models use Run and ListRunsResponse from B3420."
    proof: [response-contracts]
checks:
  optional: []
  commands:
    - id: http-routes
      why: the two routes are not registered or use wrong methods/paths
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::http_routes(::|$)/)'
    - id: create-model-selection
      why: create_run model selection precedence (header > query > body > completion.model) is not correct or cases fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::create_model_selection(::|$)/)'
    - id: list-model-selection
      why: list_runs model selection (header > query) is not correct or does not skip body entirely
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::list_model_selection(::|$)/)'
    - id: create-path-id-override
      why: path eval_id does not override body eval_id in create_run
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::create_path_id_override(::|$)/)'
    - id: list-no-body
      why: list_runs reads a request body or does not set path eval_id
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::list_no_body(::|$)/)'
    - id: provider-null-handling
      why: body custom_llm_provider null is incorrectly replaced by default in either route
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::provider_null_handling(::|$)/)'
    - id: create-malformed-body
      why: malformed JSON body in create_run does not return 400 or is caught after the try block
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::create_malformed_body(::|$)/)'
    - id: completion-dict-check
      why: create_run model resolution from completion.model does not check that completion is a dict first
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::completion_dict_check(::|$)/)'
    - id: list-pagination
      why: list_runs does not include all pagination fields or limit does not default to 20
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::list_pagination(::|$)/)'
    - id: processor-delegation
      why: routes do not delegate to base_process_llm_request or use wrong route_type values
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::processor_delegation(::|$)/)'
    - id: error-handling
      why: exceptions are not caught or not passed to _handle_llm_api_exception
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::error_handling(::|$)/)'
    - id: response-contracts
      why: response models do not use Run and ListRunsResponse from B3420
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::eval_run_create_list_routes::tests::response_contracts(::|$)/)'
