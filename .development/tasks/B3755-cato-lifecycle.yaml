id: B3755
title: Cato lifecycle hooks and Lakera threshold checks
description: >-
  Build Cato lifecycle hooks and Lakera threshold decision helpers.

  Cato Networks lifecycle hooks (`async_pre_call_hook`, `async_moderation_hook`, `async_post_call_success_hook`,
  `async_post_call_streaming_iterator_hook` and their helpers) inspect requests and responses at each stage,
  call `call_cato_guardrail` to send messages to Cato's API, handle block/anonymize actions and redact
  responses back to the caller. Websocket streaming connects to Cato's output analyzer, consumes verified
  chunks and block signals, and propagates sender failures and cancellation.

  Lakera AI (`_check_response_flagged`) provides legacy score/flag decision logic independent of B107's
  moderation call site. The method compares prompt_injection and jailbreak scores against configured
  `category_thresholds`, and returns a block decision when flagged is true with no thresholds set.

  Register helper operation `lakera_moderation_threshold_check` to verify that a Lakera response above a
  configured threshold blocks the request.
scope:
  paths:
    - crates/betterlite-guardrails/src/cato/**
    - crates/betterlite-guardrails/src/lakera.rs
    - crates/betterlite-config/src/sections/cato_lifecycle.rs
    - crates/betterlite-config/src/sections/cato_lifecycle/**
    - crates/betterlite-guardrails/src/lakera/**
  lint_tables: false
