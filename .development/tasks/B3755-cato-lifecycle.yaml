dod:
  - text: Cato pre_call and moderation hooks call call_cato_guardrail with inspection messages, handle block action by raising a 400 error, and handle anonymize action by redacting the request.
    proof: [cato-lifecycle-tests]
  - text: Cato post_call_success_hook and async_post_call_streaming_iterator_hook inspect and redact response fragments, propagate block actions as 400 errors and handle websocket connection failures and stream sender failures.
    proof: [cato-lifecycle-tests]
  - text: Cato websocket streaming consumes verified_chunks, passes them through, yields on done signal and raises on blocking_message from the upstream Cato service.
    proof: [cato-lifecycle-tests]
  - text: Lakera _check_response_flagged method compares prompt_injection and jailbreak scores against configured thresholds and returns block decision when flagged is true with no thresholds set.
    proof: [lakera-moderation-tests, lakera-threshold-helper]
  - text: Every mutant in the Cato and Lakera lifecycle logic is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: cato-lifecycle-tests
      why: Cato lifecycle hooks tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/cato_lifecycle/)'
    - id: lakera-moderation-tests
      why: Lakera moderation tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/lakera_moderation/)'
    - id: lakera-threshold-helper
      why: the lakera_moderation_threshold_check oracle helper does not exist or fails its tests
      run: test -f tools/oracle/helpers/b3755.py && test -f tools/oracle/src/helpers/guardrails/b3755.rs && grep -q "lakera_moderation_threshold_check" tools/oracle/src/helpers/guardrails/b3755.rs
oracle_cases: []
deviations:
  - what: Cato and Lakera guardrails are initialized and invoked through the betterlite-guardrails module, not loaded as Python callbacks.
    why: betterlite is Rust; guardrail dispatch is built into the proxy request handling, not registered as callbacks.
  - what: Enabled roles for Lakera are loaded at proxy startup from the guardrail config, not dynamically from litellm.guardrail_name_config_map at request time.
    why: betterlite loads all configuration before startup and does not mutate it per request.
out_of_scope:
  - Lakera v2 API (lakera_ai_v2.py); only the v1 implementation is ported.
  - Cato inspection message flattening and request redaction primitives; those are covered by B3754.
  - The proxy hook entry points that route guardrail events to individual guardrails.
  - The websocket transport layer (websockets crate); betterlite builds guardrail-specific websocket logic on top.
pitfalls:
  - Environment variable lookup for CATO_API_KEY must happen at guardrail initialization time, not at hook invocation time, so a changed env var does not affect running proxies.
  - Lakera tool_calls extraction must handle nested function structures; iterate tool_calls and extract function.arguments from each tool dict.
  - The moderation_check mode in Lakera is "pre_call" or "in_parallel"; "in_parallel" must queue the check without blocking the proxy response.
  - Lakera category_scores are floats (0.0 to 1.0); thresholds are floats; comparisons must be >= not >.
  - Enabled roles must be case-insensitive; LiteLLM accepts "System", "User", "Assistant" but normalizes to lowercase role values.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
