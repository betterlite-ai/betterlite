dod:
  - text: >-
      A plain Bedrock call signs with `Authorization: Bearer` when AWS_BEARER_TOKEN_BEDROCK is in the map, and with SigV4 from the source's credentials otherwise, at the region from litellm_params, AWS_REGION_NAME, AWS_REGION or the session region; its URL host comes from api_base, AWS_BEDROCK_RUNTIME_ENDPOINT or that region.
    proof: [sdk-call-tests, python-session-tests]
  - text: A Mantle call resolves its endpoint from BEDROCK_MANTLE_API_BASE, else a region from the model prefix, BEDROCK_MANTLE_REGION, AWS_REGION_NAME, AWS_REGION or us-east-1, and its key from api_key, BEDROCK_MANTLE_API_KEY or AWS_BEARER_TOKEN_BEDROCK; an invalid region is BadRequestError with status 400 in Python and a 400 in the proxy dispatch.
    proof: [sdk-call-tests, aws-tests, python-session-tests, dispatch-tests]
  - text: Core keeps the AwsPassthrough trait and no Bedrock or Mantle code; the call asks the port only for the two AWS tags, and asks for the Mantle endpoint only after a MissingMantleEndpoint resolve.
    proof: [no-copies, aws-tests, passthrough-tests]
  - text: B658's plan and the port run one URL path and one signing path, and B658's, B625's and B2207's tests still pass.
    proof: [bedrock-tests]
  - text: bedrock_mantle_inputs reads AWS_BEARER_TOKEN_BEDROCK into a secret field.
    proof: [config-tests, mutants]
  - text: B8690's SigV4 and Mantle Bearer rows are gone, its environment and rebuilt-config rows name only VLLM, and docs/deviations/B10166.yaml has the credential chain row.
    proof: [deviation-rows]
checks:
  optional: [mutants]
  commands:
    - id: aws-tests
      why: the call does not reach the port for Bedrock or Mantle, asks it for other providers, or maps its answers wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::passthrough_call::tests::aws::/)'
    - id: passthrough-tests
      why: the new argument or the deletions broke a request, stream, params, environment or error test of the call
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::passthrough_call::/)'
    - id: dispatch-tests
      why: the proxy dispatch does not answer the Mantle endpoint error with a 400, or its other mappings broke
      run: grep -q 'MantleEndpoint' crates/betterlite-core/src/dispatch/llm_passthrough/rejection.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^dispatch::llm_passthrough::/)'
    - id: sdk-call-tests
      why: the Bedrock port misses an environment name, a Bearer source, the SigV4 path or the Mantle endpoint rules
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^passthrough::sdk_call::/)'
    - id: bedrock-tests
      why: sharing the URL and signing code changed what B658's plan or B625's and B2207's Mantle helpers do
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E '(test(/^passthrough::/) | test(/^mantle_settings::/) | test(/^mantle_inputs::/)) - test(/replays_the_/)'
    - id: config-tests
      why: AWS_BEARER_TOKEN_BEDROCK is not read, or the section's other names broke
      run: grep -q 'AWS_BEARER_TOKEN_BEDROCK' crates/betterlite-config/src/sections/bedrock_mantle_inputs.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::bedrock_mantle_inputs::/)'
    - id: python-session-tests
      why: the Python session does not build the port from its environment, or does not answer the Mantle endpoint error as BadRequestError
      run: grep -q 'fn call_signs_bedrock_with_the_session_token' crates/betterlite-python/src/passthrough_calls/session/tests.rs && grep -q 'fn call_refuses_an_invalid_mantle_region' crates/betterlite-python/src/passthrough_calls/session/tests.rs && cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^passthrough_calls::session::tests::/)'
    - id: no-copies
      why: core still holds a copy of the Bedrock or Mantle region, endpoint, model id or credentials code
      run: test ! -e crates/betterlite-core/src/api/passthrough_call/mantle.rs && test -z "$(grep -nE 'fn (bedrock_url|runtime_endpoint|default_runtime_endpoint|region|validate_region|is_region|region_from_model_arn|mantle_region_from_host|encoded_model_id|rewrite_model_path|split_region|text_param)[(<]|NO_CREDENTIALS|MANTLE_HOST_PATTERN|DEFAULT_BEDROCK_REGION|DEFAULT_MANTLE_REGION|mod mantle;' crates/betterlite-core/src/api/passthrough_call.rs crates/betterlite-core/src/api/passthrough_call/urls.rs crates/betterlite-core/src/api/passthrough_call/auth.rs)"
    - id: deviation-rows
      why: B8690 still lists the fixed Bedrock rows or names the providers B10164 fixed, or this task's row is missing
      run: test -s docs/deviations/B10166.yaml && test -z "$(grep -nE 'not SigV4-signed|bearer token only from|AZURE_|GIGACHAT_|WATSONX_' docs/deviations/B8690.yaml)"
oracle_cases: []
deviations:
  - what: >-
      In the Python package a plain Bedrock or Bedrock Mantle pass-through with no Bearer token fails with a synthesized 500 ("AWS credential provider is unavailable"), even when litellm_params carry aws_access_key_id and aws_secret_access_key. LiteLLM resolves those keys or boto3's default chain and signs with SigV4.
    why: >-
      betterlite builds no production AWS credential chain yet, so the session passes NoCredentialChain until a task builds one. Bearer tokens from api_key, BEDROCK_MANTLE_API_KEY and AWS_BEARER_TOKEN_BEDROCK work.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L1697-L1699
out_of_scope:
  - "A production AWS credential chain (static keys from litellm_params, environment keys, profiles, roles, web identity, instance metadata): AwsCredentialResolver (crates/betterlite-bedrock/src/credentials.rs L19-L25) needs a CredentialCache, NativeSources, SecretLookup and StsClientKwargs, and no production code builds one; the server's only NativeSources build is a private function in crates/betterlite-server/src/bucket_config/s3_reader.rs L261-L276. No task owns it yet; the architect decides."
  - "VLLM_API_BASE and the last config B8690 rebuilt in core: B10168."
  - "Bedrock spend and reply logging: the call keeps NoSpendCollector (config.rs L150-L158) and the trait's empty logging_non_streaming_response, so B658's event stream collector and reply logging and B625's reply shaping stay unused; reported to the architect."
  - "The Mantle /openai/v1 path for models the cost map marks with use_openai_responses_path: the call resolves with an empty catalog, so the port gets an empty model cost map and B8690's row stays."
  - "Passing the port from the router executor, the router call assembly and the proxy's direct call: B8691, B8631 and B8694."
  - "The three identical CredentialSource traits in betterlite-bedrock (embedding_call.rs L64-L70, image_call/plan.rs L61-L67, rerank/plan.rs L59-L65): this task uses rerank's and leaves the merge to a cleanup task."
pitfalls:
  - "allm_passthrough_route now has five parameters, the rules' limit, so nothing else goes on it."
  - "passthrough_call.rs had 245 of its 300 allowed lines before B10164; put the two-step resolve in aws.rs or another file under passthrough_call/."
  - "The first resolve must pass `mantle: None`; only MissingMantleEndpoint asks the port, so a bad AWS_REGION never breaks an OpenAI or VLLM call."
  - "The async_trait future must be Send, so every argument of the port's methods, PassthroughSigning's borrowed params included, has to be Sync."
  - "The Mantle pass-through signs through BedrockPassthroughConfig.sign_request, not BedrockMantleAuthMixin, so its no-credential failure is the credential error, never mantle_settings::error's AUTH_FAILURE_MESSAGE."
  - "bedrock_bearer_token counts an empty token as none, so an empty AWS_BEARER_TOKEN_BEDROCK falls through to SigV4; a BTreeMap lookup returns an empty value as Some(\"\"), and docs/compatibility.md counts it as unset."
  - "B658's signing keeps a caller's Authorization header that is not a SigV4 one (base_aws_llm.py L1716-L1728) and drops content-length unless the caller sent a length or transfer-encoding (passthrough.rs L141-L161); the shared function keeps both."
  - "Keep BedrockPassthroughPlan's public fields as they are: betterlite-provider's bedrock_interactive_dispatch/passthrough.rs holds one."
  - "The call's litellm_params are a serde_json Object, while pop_aws_auth_params and request_target read `BTreeMap<String, Box<RawValue>>`; convert once at the port's edge."
  - "Test maps leave out HOME, AWS_CONFIG_FILE and AWS_SHARED_CREDENTIALS_FILE, so the session region never comes from the developer's ~/.aws/config; a BTreeMap lookup has no system home."
  - "SigV4 assertions use the fixed clock's date, never SystemTime::now."
