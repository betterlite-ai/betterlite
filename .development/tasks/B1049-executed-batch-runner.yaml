id: B1049
title: Executed batch runner
description: >-
  Run proxy-executed batches with bounded concurrency, owned tasks, source cancellation/heartbeat/stale deadlines
  and 24-hour completion window. Dispatch rows through B014, persist heartbeats/status through B726 typed repositories,
  and upload result/error JSONL via file-storage-service; abandon stale runs explicitly and preserve per-row errors.
  Resolve LITELLM_EXECUTED_BATCH_CONCURRENCY=max(1, parsed integer), default 4. Keep cancellation polling 1 second,
  heartbeat 30 seconds, stale age 180 seconds, files probe timeout 5 seconds and completion window 86400 seconds.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-core/src/api/executed_batch_runner.rs. Use ExecutedBatchRunnerInput and ExecutedBatchRunnerResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions executed_batch_success, partial_row_failure, batch_cancel_race, stale_runner_failed,
  completion_window_expired, result_files_published under api::executed_batch_runner::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.LITELLM_EXECUTED_BATCH_CONCURRENCY
  defaults to '4'. No environment reads occur outside betterlite-config. Test api::executed_batch_runner::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ExecutedBatchRunner in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {executed_batch_runner: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner.__init__
  (L412-L436); litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner.create (L438-L495);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner.cancel (L497-L511); litellm/proxy/batches_endpoints/litellm_executed_batches.py:
  LiteLLMExecutedBatchRunner.fail_abandoned (L513-L528); litellm/proxy/batches_endpoints/litellm_executed_batches.py:
  LiteLLMExecutedBatchRunner._body_rejection (L530-L543); litellm/proxy/batches_endpoints/litellm_executed_batches.py:
  LiteLLMExecutedBatchRunner._download_input (L545-L559); litellm/proxy/batches_endpoints/litellm_executed_batches.py:
  LiteLLMExecutedBatchRunner._run (L561-L576); litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._heartbeat
  (L578-L584); litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._touch (L586-L587);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._execute (L589-L615);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._run_row (L617-L629);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._row_outcome (L631-L638);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._dispatch (L640-L644);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._router_call (L646-L650);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._row_metadata (L652-L659);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._upload_results (L661-L682);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: LiteLLMExecutedBatchRunner._advance (L684-L699);
  litellm/proxy/batches_endpoints/litellm_executed_batches.py: _record_batch_created (L702-L712). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 282 owned nonblank/non-comment/non-docstring Python lines (282 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 302 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 603 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B014 (Call dispatch across providers
  and call types, shared settings and helpers), B171 (Direct helper oracle and URL path encoding), B1027 (File storage
  service), B1041 (Batch managed records), B1048 (Executed batch input), B1087 (Api boundaries), B726 (Managed resources
  and transaction repositories), B858 (Typed managed-resource and analytics rows), B1106 (Principal metadata and
  tags). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.
