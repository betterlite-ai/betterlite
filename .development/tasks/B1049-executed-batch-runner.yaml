pitfalls:
- 'The oracle helper for this task is pre-registered as executed_batch_runner in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/executed_batch_runner.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/executed_batch_runner.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'litellm_executed_batches.py:584 emits the diagnostic ''LiteLLM-executed batch %s heartbeat failed: %s''; retain
  its level and fallback instead of turning it into a hard error.'
- 'Within LiteLLMExecutedBatchRunner.create\''s isinstance(parsed, InvalidBatchInput) branch, preserve raise batch_error(400,
  f''Invalid batch input file: {parsed.describe()}'') and its nested guards.'
