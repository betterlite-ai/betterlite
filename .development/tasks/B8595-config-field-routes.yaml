    why: /config/field/update.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L18511-L18580
    why: _declared_general_setting and /config/field/info.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L18581-L18727
    why: The UI litellm field specs, validation, persist and reset.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L18728-L18903
    why: /config/list.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L18904-L18990
    why: /config/field/delete.
dod:
  - text: /config/field/update validates, stores, re-applies and audits like LiteLLM, including the UI litellm fields and alerting_args.
    proof: [config-field-tests]
  - text: /config/field/info and /config/list answer LiteLLM's values, sources, stored_in_db flags and redaction for admins and admin viewers.
    proof: [config-field-tests]
  - text: /config/field/delete refuses, pops, re-serves and audits like LiteLLM, and resets UI litellm fields to their defaults.
    proof: [config-field-tests]
  - text: Updating or deleting pass_through_endpoints hands the written list, or an empty one when it is not a list, to ConfigOverlayPort::serve_pass_through_endpoints, other fields never call it, and a port error stops before the audit with 503 no_db_connection for DatabaseUnavailable and 500 internal_server_error for Reload and PassThrough.
    proof: [pass-through-reserve]
  - text: Persisting or resetting a UI litellm field loads config only through ConfigOverlayPort::reload_config, and a port error leaves the runtime value and the stored config unchanged with 503 no_db_connection for DatabaseUnavailable and 500 internal_server_error otherwise.
    proof: [config-field-tests]
checks:
  optional: [mutants]
  commands:
    - id: config-field-tests
      why: a /config/field or /config/list answer differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^config_fields::/)'
    - id: pass-through-reserve
      why: a pass_through_endpoints write skips the re-serve, hands the port the wrong list, calls it for another field, audits after a failed re-serve or answers a database outage with 500
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^config_fields::.*::pass_through_reserve_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "Mounting the routes and their HTTP oracle cases: B8675."
  - "Redaction and the audit log: B8594. Plugin key preservation and plugin registration: B8230. Pass-through re-serve and its ConfigOverlayPort: B8379; the production port value: B8613 and B8610. SSRF re-apply: B5082. Config-owned guards and saves: B8380. Settings sources: B4140."
pitfalls:
  - Only update and delete need PROXY_ADMIN; info and list accept an admin viewer and redact for them.
  - A null in-memory value falls back to the database value in /config/list only when the source is not "config".
  - Booleans are numbers in Python, so Float and Dollar checks must refuse true and false first.
  - Deleting a UI litellm field writes the default into litellm but removes the key from the stored config.
  - Deleting pass_through_endpoints still calls the port, with an empty list, so the published list falls back to the startup config entries.
  - "This task builds _preserve_redacted_plugin_keys (proxy_server.py L18225; its only caller is update_config_general_settings at L18341) and the _types.py records ConfigFieldDelete (L2560) and FieldDetail (L2569); no other task builds them."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
