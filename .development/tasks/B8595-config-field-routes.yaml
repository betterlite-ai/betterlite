id: B8595
title: /config/field update, info and delete and /config/list routes
description: >-
  The admin UI edits one general setting at a time through four routes. Build them in
  crates/betterlite-server/src/config_fields.rs (declared by the skeleton) with `pub fn routes()` and the info and update services as pub functions B8612 calls without HTTP, error enum
  ConfigFieldError. Every refusal is 400 {"error": ...} with LiteLLM's CommonProxyErrors text unless stated.


  UI litellm fields. GENERAL_SETTINGS_UI_LITELLM_FIELDS lists budget_exceeded_throttle_percentage (Float),
  enable_anthropic_prompt_caching (Boolean, tab prompt_caching), anthropic_prompt_caching_ttl (Select 5m or 1h),
  openai_system_messages_first (Boolean), budget_rollover (Boolean) and max_ui_session_budget (Dollar, default 1.0),
  each with LiteLLM's description. Their default is the spec default, else false for Boolean, else null. Validation: null
  or "" gives the default; Boolean needs a bool; Select needs one of the options; Float needs a non-bool number in (0,
  1]; Dollar needs a non-bool number above 0; each failure has LiteLLM's message. Persisting sets
  litellm_settings.<field> through B8380's config save after reject_config_owned_writes on litellm_settings and audits
  it; reset removes the key and writes the default. Both load the current config first with reload_config on the
  ConfigOverlayPort described below (LiteLLM's get_config at proxy_server.py L18703 and L18717), take the before value
  from its litellm_settings, then set the runtime value and save; a port error stops them before the runtime value
  changes and is answered as in the re-serve step. Tests named `ui_field_reload_*` drive persist and reset with a
  ConfigOverlayPort fake that returns a config, DatabaseUnavailable or Reload.


  POST /config/field/update: no database, then not PROXY_ADMIN, then a UI litellm field goes to the persist path; an
  unknown ConfigGeneralSettings field or a value that fails its type gives "Invalid field=<name> passed in." or "Invalid
  type of field value=<type> passed in."; alerting_args must also pass SlackAlertingArgs. It loads the general_settings
  row, runs reject_config_owned_writes, keeps stored plugin keys with B8230's preserve step for plugins, upserts the row,
  invalidates it, applies it to the settings store, re-serves pass-through endpoints (below) when the field is a
  resource list, audits, re-registers plugins, and re-applies the SSRF settings through B5082. It returns the upserted
  row. GET /config/field/info?field_name=: admin view needed; an unknown field is invalid; `declared_setting` reads the
  writer row for resource lists and the store otherwise; absent is "Field name=<name> is not set"; the value goes
  through B8594's redact_setting_value, plugin keys show "***", and the answer carries source and editable (source not
  "config"). GET /config/list?config_type=general_settings: admin view needed; one entry per field in
  GENERAL_SETTINGS_CONFIG_LIST_FIELD_TYPES in ConfigGeneralSettings order, with stored_in_db true (in the row), false (in
  memory only) or null, nested fields for pass_through_endpoints, then one entry per UI litellm field. POST
  /config/field/delete: no database, not PROXY_ADMIN, UI litellm fields go to reset, unknown field is invalid, B8380's
  reject_config_owned_deletes runs, a missing row is "Field name=<name> not in config", else the key is popped, upserted,
  invalidated, applied, pass-through endpoints re-served and the delete audited.


  Pass-through re-serve. B8379's serve_pass_through_endpoints lives in the binary crate and this crate cannot depend
  on it, so update and delete reach it through B8379's `ConfigOverlayPort` (betterlite-server's config_overlay_port):
  `routes` takes it as an `Arc<dyn ConfigOverlayPort>` argument, and the update and delete services take it as
  `&dyn ConfigOverlayPort`. When `Section::GeneralSettings.is_resource_list(field)` (B4140) holds, they call
  serve_pass_through_endpoints with the written row's pass_through_endpoints list, or an empty list when that value is
  missing or not a list; any other field never calls it. A ConfigOverlayPortError ends the request with the row
  already stored and applied, and before the audit, the plugin re-registration and the SSRF re-apply. Its answer
  follows LiteLLM's unhandled-error handler (proxy_server.py L2049-L2080): DatabaseUnavailable is 503 with B1217's
  projection, `betterlite_db::database_availability::projection::service_unavailable_error(&Chain::default())` (type
  no_db_connection, param "None", code "503", the transient message), sent as {"error": {"message", "type", "param",
  "code"}}; Reload and PassThrough are 500 {"error": {"message": "Internal server error", "type":
  "internal_server_error"}}. Tests for this step are named `pass_through_reserve_*` and use a recording
  ConfigOverlayPort fake; the ones named `pass_through_reserve_database_unavailable_*` make it return
  DatabaseUnavailable and assert the 503 body and that nothing is audited.
