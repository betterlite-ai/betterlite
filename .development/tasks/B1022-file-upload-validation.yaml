checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_validation::/)
      - test(/::replays_corpus$/)'
  - id: case-unsafe-dotdot-filename
    why: the unsafe-dotdot-filename behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::unsafe_dotdot_filename($|::)/)'
  - id: case-nul-filename
    why: the nul-filename behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::nul_filename($|::)/)'
  - id: case-extension-casefold
    why: the extension-casefold behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::extension_casefold($|::)/)'
  - id: case-file-too-large-413
    why: the file-too-large-413 behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::file_too_large_413($|::)/)'
  - id: case-empty-batch
    why: the empty-batch behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::empty_batch($|::)/)'
  - id: case-batch-row-missing-body
    why: the batch-row-missing-body behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::batch_row_missing_body($|::)/)'
  - id: case-vertex-native-request-row
    why: the vertex-native-request-row behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::vertex_native_request_row($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::file_upload_validation::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/file-upload-validation-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/file_upload_validation)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/file_upload_validation.rs && grep -qF "decode_file_upload_validation"
      crates/betterlite-core/fuzz/fuzz_targets/file_upload_validation.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::file_upload_validation::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_upload_validation.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_upload_validation-*)"
      && grep -qE "^[[:space:]]+file_upload_validation:" tools/oracle/fuzz/corpus/helper_case/file_upload_validation-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-upload-validation)"
