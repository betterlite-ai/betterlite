id: B1022
title: File upload validation
description: >-
  Validate every file upload before forwarding, then validate batch JSONL rows for purpose=batch. Add general_settings.max_file_size_mb,
  allowed_file_extensions, blocked_file_extensions and batch size/validation settings from the pinned declarations
  with their exact defaults; integer settings reject booleans. Preserve source status/type/param/code for unsafe
  filename, wrong extension, empty file and malformed rows. The concrete general_settings keys are max_file_size_mb=None,
  max_batch_file_size_mb=None, allowed_file_extensions=None and blocked_file_extensions=None; absent/nonpositive
  size settings disable that logical limit, while streaming/parser memory remains bounded by transport ownership.


  Implement crates/betterlite-core/src/api/file_upload_validation.rs. Use FileUploadValidationInput and FileUploadValidationResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): general_upload_validation.py:144 type='invalid_request_error', param='file', code=413; general_upload_validation.py:154
  type='invalid_request_error', param='file', code=400; general_upload_validation.py:165 type='invalid_request_error',
  param='file', code=400; general_upload_validation.py:175 type='invalid_request_error', param='file', code=400;
  batch_file_validation.py:143 type='invalid_request_error', param='file', code=413; batch_file_validation.py:153
  type='invalid_request_error', param='file', code=400; batch_file_validation.py:163 type='invalid_request_error',
  param='file', code=400; batch_file_validation.py:170 type='invalid_request_error', param='file', code=400; batch_file_validation.py:180
  type='invalid_request_error', param='file', code=400; batch_file_validation.py:190 type='invalid_request_error',
  param=key, code=400. Compare the actual source status, error type, param and code; ignore only error wording except
  in message-extraction tests.


  Write adjacent tests.rs behavior functions unsafe_dotdot_filename, nul_filename, extension_casefold, file_too_large_413,
  empty_batch, batch_row_missing_body, vertex_native_request_row under api::file_upload_validation::tests. Each
  named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): general_settings.max_file_size_mb
  defaults to None; nonpositive disables logical size limit; general_settings.max_batch_file_size_mb defaults to
  None; nonpositive disables logical size limit; general_settings.allowed_file_extensions defaults to None; general_settings.blocked_file_extensions
  defaults to None. No environment reads occur outside betterlite-config. Test api::file_upload_validation::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::file_upload_validation::decode_file_upload_validation(bytes:
  &[u8], limits: &ApiLimits), for json.loads input raw_line at litellm/proxy/openai_files_endpoints/batch_file_validation.py:91.
  Place its implementation in crates/betterlite-core/src/api/file_upload_validation.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/file_upload_validation.rs passes arbitrary
  bounded bytes to that exact decoder; api::file_upload_validation::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::FileUploadValidation in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_upload_validation: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/openai_files_endpoints/general_upload_validation.py: coerce_optional_int_setting
  (L21-L31); litellm/proxy/openai_files_endpoints/general_upload_validation.py: coerce_optional_str_list_setting
  (L34-L39); litellm/proxy/openai_files_endpoints/general_upload_validation.py: _file_size_bytes (L68-L75); litellm/proxy/openai_files_endpoints/general_upload_validation.py:
  check_upload_file_size (L78-L87); litellm/proxy/openai_files_endpoints/general_upload_validation.py: _normalized_extension
  (L90-L96); litellm/proxy/openai_files_endpoints/general_upload_validation.py: check_allowed_extension (L99-L109);
  litellm/proxy/openai_files_endpoints/general_upload_validation.py: check_blocked_extension (L112-L122); litellm/proxy/openai_files_endpoints/general_upload_validation.py:
  check_unsafe_filename (L125-L138); litellm/proxy/openai_files_endpoints/general_upload_validation.py: raise_upload_validation_failure
  (L141-L185); litellm/proxy/openai_files_endpoints/batch_file_validation.py: _file_size_bytes (L73-L79); litellm/proxy/openai_files_endpoints/batch_file_validation.py:
  _iter_lines (L82-L86); litellm/proxy/openai_files_endpoints/batch_file_validation.py: _check_line (L89-L99); litellm/proxy/openai_files_endpoints/batch_file_validation.py:
  _scan_lines (L102-L119); litellm/proxy/openai_files_endpoints/batch_file_validation.py: check_batch_file_upload
  (L122-L137); litellm/proxy/openai_files_endpoints/batch_file_validation.py: raise_batch_file_validation_failure
  (L140-L201). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 304 owned nonblank/non-comment/non-docstring Python lines (318 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 324 implementation,
  82 behavior tests, 84 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 42 config tests/seeds
  and 30 wiring; 712 total within the 720-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B002 (Load LiteLLM config.yaml into typed config), B171 (Direct helper oracle and URL
  path encoding), B1015 (File contracts), B1087 (Api boundaries). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
