id: B1022
title: File upload validation
description: >-
  Implement both general_upload_validation.py and batch_file_validation.py completely in
  betterlite-core::api::file_upload_validation, using B2460's safe_filename for extension extraction.
  The result is a typed failure or success; the corresponding raise functions preserve ProxyException
  type=invalid_request_error, param and string code. The route in B1032 owns HTTP ordering and mapping.
  Every message below ends with the literal "The file was not forwarded to the provider." unless
  already quoted in full. Assert the source message for each named input as well as status/type/param/code.

  Add general_settings.max_file_size_mb and max_batch_file_size_mb (both default null, <=0 disables
  the logical size cap), allowed_file_extensions and blocked_file_extensions (both default null).
  General max_file_size_mb accepts integers excluding booleans; extensions accept lists containing
  only strings. max_batch_file_size_mb uses the route's separate Pydantic int-or-null coercion:
  "1" and true become 1, fractional 1.5 fails; B1032 owns that adapter. Preserve general coercion failures
  as typed configuration-value errors. The source coercers raise
  TypeError, with "expected an integer, got <repr>" or "expected a list of strings, got <repr>".
  Use the existing config loader and add api::file_upload_validation::tests::loads_settings there.
  No environment variables are read by these modules.

  decode_file_upload_validation(bytes, line_shape, limits) is the production bounded JSONL decoder.
  It reports physical line numbers starting at 1, skips blank lines, and tests key presence rather
  than value types. OpenAI rows require custom_id, method, url, body in that order; Vertex-native
  rows require request. Fuzz this decoder, including BOM/UTF-16/UTF-32 input and escaped surrogate
  strings accepted by Python's json.loads(bytes); parsing must not be stricter than the validator.
  A typed JSON-token representation may retain strings for validation without materializing invalid
  Unicode. All checks use finite B1087 limits while file bodies remain streamed.

  Named behavior tests live under api::file_upload_validation::tests. The file_upload_validation
  helper compares pure validation outcomes over bytes and controlled seekable buffers; it never
  calls a FastAPI handler. The owned spans contain 299 nonblank, non-comment lines. Budget 280 production,
  170 tests, 115 fixtures, 75 adapters, 55 fuzz/replay, 65 config and 30 wiring lines: 790 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_upload_validation.rs
  - crates/betterlite-core/src/api/file_upload_validation/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/file-upload-validation-*
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/file_upload_validation.rs
  - crates/betterlite-core/fuzz/corpus/file_upload_validation/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/file_upload_validation.rs
  - tools/oracle/src/helpers/core_ops/file_upload_validation/**
  - tools/oracle/helpers/file_upload_validation.py
  - tools/oracle/helpers/file_upload_validation/**
  - tools/oracle/fuzz/corpus/helper_case/file_upload_validation-*
  - tools/oracle/cases/helpers/file-upload-validation/**
  - Cargo.lock
  - crates/betterlite-config/src/sections/file_upload_validation.rs
  - crates/betterlite-config/src/sections/file_upload_validation/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/general_upload_validation.py#L18-L185
  why: Owns setting coercion, size/extension/filename failure records and their exact error projection.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/batch_file_validation.py#L11-L201
  why: Owns both line shapes, streaming line validation, size-before-content order and all batch failure variants.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2860-L2876
  why: Public general_settings declarations consumed by the upload route.
dod:
- text: >-
    unsafe_filename_components accepts null, "", .env, report..pdf, report.v2.pdf and dir/file.pdf;
    ../file, dir/../file, backslash traversal and a NUL produce 400/invalid_request_error/file/"400".
    The source message is "Filename '../file' is not allowed: directory traversal sequences are not
    permitted in uploaded file names. The file was not forwarded to the provider."
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    extension_policy sends REPORT.PDF with allow=[.pdf] and block=[.PDF] and gets allow success then
    blocked failure. allow=[] denies every name; block=[] denies none. allow=[pdf] does not match
    .pdf; missing filename, .env and an unsafe name normalize to "". Allow failure is 400/file/"400"
    with invalid_request_error and "File extension '.pdf' is not in this proxy's allowed_file_extensions
    setting. The file was not forwarded to the provider." Missing extension substitutes "A file without
    an extension". Block failure says "File extension '.pdf' is blocked by this proxy's blocked_file_extensions
    setting. The file was not forwarded to the provider."
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    upload_size_boundaries tests max_file_size_mb=1 at 1048576 bytes (success) and 1048577 (413,
    invalid_request_error, file, "413"). Its source message is "Uploaded file exceeds the configured
    max_file_size_mb of 1 MB (read stopped at 1.0 MB). The file was not forwarded to the provider."
    Null, 0 and -1 disable this cap. A seekable buffer positioned at 7 returns to 7 after sizing.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    batch_size_and_extension sends absent filename and x.txt even with oversized content and gets
    400/file/"400", source "Invalid file format for Batch API: 'x.txt'. Batch input files must be
    .jsonl files. The file was not forwarded to the provider." Absent name renders ''. x.JSONL is
    accepted. With cap=1, valid JSONL padded with blank bytes to 1048576 passes and 1048577 gives
    413/file/"413", source "Batch input file is 1.0 MB, which exceeds the configured max_batch_file_size_mb
    of 1 MB. The file was not forwarded to the provider." Nonpositive/null caps are disabled.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    batch_line_failures sends blank bytes (400/file/"400", "Batch input file has no request lines.");
    a blank first line then malformed JSON or invalid UTF-8 (400/file/"400", "Batch input file line 2
    is not valid JSON."); and [] on line 2 (400/file/"400", "Batch input file line 2 must be a JSON
    object."). Each has invalid_request_error and the common not-forwarded suffix. The first failing
    physical line wins, and successful or failed scans rewind seekable input to 0.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    required_batch_keys supplies {} then progressively adds custom_id, method, url and body:
    missing-key errors are 400/invalid_request_error with param equal to the first missing key and
    code="400". For missing body on line 1 the source message is "Missing required parameter: 'body'
    (batch input file line 1). Each line must be a JSON object with keys custom_id, method, url, body.
    The file was not forwarded to the provider." All four keys set to null pass shape validation.
    Vertex shape accepts {request: null}; {} fails with param=request and hint "A passthrough upload
    takes native Vertex batch rows, so each line must be a JSON object with a request key".
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    json_byte_compatibility accepts valid BOM-prefixed UTF-8, UTF-16 and UTF-32 object rows and
    escaped lone-surrogate values without changing the presence-only result. Numeric values,
    duplicate keys and null values are not content-type validation errors here.
  proof: [behavior-tests, oracle, helper-python, parser-corpus]
- text: >-
    loads_settings loads every absent/default, integer and string-list override through Config.
    General max_file_size_mb coercion rejects true, 1.5 and "1"; max_batch_file_size_mb preserves
    the separate route adapter's "1"/true-to-1 semantics and rejects 1.5. Extension settings reject
    strings or mixed lists; [] and null stay distinct. The four keys do not appear as unsupported.
  proof: [config-tests, config-corpus, behavior-tests, oracle, helper-python]
- text: New validation and helper decoder corpora exercise actual production entry points.
  proof: [parser-corpus, helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: upload or batch validation assertions are absent
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api|sections)::file_upload_validation::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: upload policy keys are not loaded by the real config loader
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::file_upload_validation::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: upload settings have no new YAML input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/file-upload-validation-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: batch byte parsing is not connected to fuzz/replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/file_upload_validation)" && grep -qF decode_file_upload_validation crates/betterlite-core/fuzz/fuzz_targets/file_upload_validation.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_upload_validation::tests::replays_corpus$/)'
  - id: helper-python
    why: independent validation adapter is missing or invalid
    run: test -f tools/oracle/helpers/file_upload_validation.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: no newly tagged validation seed exists
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_upload_validation-*)" && grep -qE '^[[:space:]]+file_upload_validation:' tools/oracle/fuzz/corpus/helper_case/file_upload_validation-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: validation outcomes lack new oracle cases
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-upload-validation)"
oracle_cases:
- tools/oracle/cases/helpers/file-upload-validation/unsafe-filename-components.yaml
- tools/oracle/cases/helpers/file-upload-validation/extension-policy.yaml
- tools/oracle/cases/helpers/file-upload-validation/upload-size-boundaries.yaml
- tools/oracle/cases/helpers/file-upload-validation/batch-size-and-extension.yaml
- tools/oracle/cases/helpers/file-upload-validation/batch-line-failures.yaml
- tools/oracle/cases/helpers/file-upload-validation/required-batch-keys.yaml
- tools/oracle/cases/helpers/file-upload-validation/json-byte-compatibility.yaml
- tools/oracle/cases/helpers/file-upload-validation/setting-coercion.yaml
deviations: []
out_of_scope:
- B1032 applies these checks to HTTP multipart requests and owns auth, purpose selection and response headers.
- B2460 owns path_utils.safe_filename; this task must not use an uploaded filename as a local path.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_upload_validation in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/file_upload_validation.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_upload_validation.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A batch extension failure precedes its size test; general upload policy runs in the separate route-defined order.
- General sizing restores the old offset but batch scanning resets to zero, including failure paths.
- The batch shape validator permits null body; guardrail scanning later rejects it as unparseable.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
