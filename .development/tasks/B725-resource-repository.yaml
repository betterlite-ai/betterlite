  - tools/oracle/cases/helpers/resource-repository/encrypted-model-roundtrip.yaml
  - tools/oracle/cases/helpers/resource-repository/cipher-failure-no-write.yaml
  - tools/oracle/cases/helpers/resource-repository/permission-upsert.yaml
  - tools/oracle/cases/helpers/resource-repository/budget-partial-update.yaml
  - tools/oracle/cases/helpers/resource-repository/config-json-string.yaml
  - tools/oracle/cases/helpers/resource-repository/credential-name-query.yaml
