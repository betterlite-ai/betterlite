id: B725
title: Model, permissions, budget and config repositories
description: >-
  Implement ModelRepository, BudgetRepository, ObjectPermissionRepository, ConfigRepository and CredentialsRepository
  over their typed rows. Model/credential writes take injected StoredCipher and never invent plaintext
  fallback; test with deterministic cipher doubles and assert call direction. Keep literal JSON columns,
  unblocked/team model filters and nested budget field omission.


  Build the production resource_repository module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/repositories/model_repository.py:
  ModelRepository.__init__ (L29-L31; 3 source lines), ModelRepository.table (L34-L35; 2 source lines),
  ModelRepository.model_class (L38-L39; 2 source lines), ModelRepository._encrypt_litellm_params (L41-L49;
  9 source lines), ModelRepository._decrypt_litellm_params (L51-L61; 11 source lines), ModelRepository._to_model
  (L63-L78; 12 source lines), ModelRepository.find_by_id (L80-L81; 2 source lines), ModelRepository.find_by_name
  (L83-L86; 4 source lines), ModelRepository.find_all (L88-L91; 4 source lines), ModelRepository.find_unblocked
  (L93-L96; 4 source lines), ModelRepository.find_all_except (L98-L101; 4 source lines), ModelRepository.find_by_team_id
  (L103-L111; 8 source lines), ModelRepository.create_model (L113-L140; 26 source lines), ModelRepository.update_model
  (L142-L164; 22 source lines), ModelRepository.delete_model (L166-L168; 3 source lines), ModelRepository.block_model
  (L170-L172; 3 source lines), ModelRepository.unblock_model (L174-L176; 3 source lines). litellm/repositories/budget_repository.py:
  _BudgetDb.litellm_budgettable (L20-L20; 1 source lines), _PrismaClientView.db (L27-L27; 1 source lines),
  BudgetRepository.table (L34-L36; 3 source lines), BudgetRepository.model_class (L39-L40; 2 source lines),
  BudgetRepository.find_by_id (L42-L43; 2 source lines), BudgetRepository.create_budget (L45-L79; 34 source
  lines), BudgetRepository.update_budget (L81-L113; 32 source lines), BudgetRepository.delete_budget (L115-L117;
  3 source lines). litellm/repositories/object_permission_repository.py: ObjectPermissionRepository.__init__
  (L18-L20; 3 source lines), ObjectPermissionRepository.table (L23-L25; 3 source lines), ObjectPermissionRepository.model_class
  (L28-L29; 2 source lines), ObjectPermissionRepository.find_by_id (L31-L34; 4 source lines), ObjectPermissionRepository.create_permission
  (L36-L75; 39 source lines), ObjectPermissionRepository.update_permission (L77-L117; 40 source lines),
  ObjectPermissionRepository.delete_permission (L119-L121; 3 source lines). litellm/repositories/config_repository.py:
  _decoded_json (L13-L15; 3 source lines), _ConfigRow.param_name (L20-L20; 1 source lines), _ConfigRow.param_value
  (L23-L23; 1 source lines), _ConfigTable.find_unique (L27-L27; 1 source lines), _ConfigTable.find_many
  (L29-L29; 1 source lines), _ConfigTable.upsert (L31-L31; 1 source lines), _ConfigTable.delete (L33-L33;
  1 source lines), ConfigParam.__init__ (L39-L41; 3 source lines), ConfigRepository.__init__ (L47-L49;
  3 source lines), ConfigRepository.prisma_client (L52-L55; 4 source lines), ConfigRepository._config_table
  (L58-L60; 3 source lines), ConfigRepository.table (L63-L64; 2 source lines), ConfigRepository.get_param
  (L66-L74; 9 source lines), ConfigRepository.set_param (L76-L86; 11 source lines), ConfigRepository.delete_param
  (L88-L94; 7 source lines), ConfigRepository.get_all_params (L96-L105; 10 source lines). litellm/repositories/credentials_repository.py:
  _PrismaCredentialsDb.litellm_credentialstable (L25-L25; 1 source lines), _PrismaClientView.db (L30-L30;
  1 source lines), CredentialsRepository.__init__ (L36-L37; 2 source lines), CredentialsRepository.prisma_client
  (L40-L44; 5 source lines), CredentialsRepository.table (L47-L51; 5 source lines), CredentialsRepository._to_model
  (L54-L64; 11 source lines), CredentialsRepository.find_all (L66-L67; 2 source lines), CredentialsRepository.create
  (L69-L70; 2 source lines), CredentialsRepository.find_by_name (L72-L74; 3 source lines), CredentialsRepository.update_by_name
  (L76-L79; 4 source lines), CredentialsRepository.delete_by_name (L81-L82; 2 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the resource_repository operation under B856 Management::database. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a resource-repository-* seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 393 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  393 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 642 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
