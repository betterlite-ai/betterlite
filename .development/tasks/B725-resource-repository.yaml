id: B725
title: Model, permissions, budget and config repositories
description: >-
  Implement the live resource repository paths in betterlite-db::resource_repository over B700's base
  operations and B721/B2310's native rows. B714 supplies db versus writer_db routing. Preserve direct table access for the management callers;
  do not add convenience methods that only unused Python methods call. No HTTP endpoint or setting
  loader is owned here. B2303 supplies the actual stored-secret decoder, not a deferred cipher port.

  Own model_repository.py _ProxyModelTableRepository.table_name="litellm_proxymodeltable",
  ModelRepository.__init__, table, model_class, _decrypt_litellm_params, _to_model and find_all_except.
  B726's PrismaTableRepository supplies the table and its config-sync wrapper. The live query excludes
  the supplied model_id and converts all returned rows to an immutable sequence. _to_model returns
  None for None, uses record.dict when available, decodes string litellm_params and model_info as JSON,
  and propagates JSON/model-validation failures. A truthy params map decrypts each string through
  B2303 with exception_type=debug and return_original_value=true; non-string values are unchanged.
  Thus legacy plaintext and wrong-key/corrupt ciphertext are retained after a debug diagnostic. The
  constructor's encryption_key does not select the decryption key. Direct .table reads/writes are raw
  and do not run _to_model or encrypt anything. Model writes in B836 own their encryption before those
  calls; no production path calls this repository's create_model/update_model convenience methods.

  Own BudgetRepository.table, model_class and find_by_id, plus the _BudgetDb/_PrismaClientView row
  access contracts. find_by_id defaults its key column to budget_id and delegates to B700. Own
  ObjectPermissionRepository.__init__, table and model_class; use_writer defaults false and selects
  writer_db only when true. Both expose the exact litellm_budgettable/litellm_objectpermissiontable
  actions used by their callers; B700 owns CRUD semantics and B2310 owns budget/permission row shapes. Their
  unused create/update/delete convenience methods do not justify new business validations here.

  Own ConfigRepository.__init__, prisma_client, _config_table, table, get_param and set_param,
  ConfigParam.__init__, _decoded_json and the _ConfigRow/_ConfigTable protocols. use_writer=false
  selects db, true selects writer_db. Missing client raises RuntimeError "No DB Connected. See -
  https://docs.litellm.ai/docs/proxy/virtual_keys" before a query. get_param returns None for a missing
  row, otherwise JSON-decodes any string param_value and leaves non-string values unchanged. set_param
  JSON-encodes non-strings but stores strings verbatim, then upserts by param_name, creating name/value
  or updating only value. It returns the original caller value, not the stored encoding or returned DB
  row. Consequently storing bare string abc succeeds and returns abc, but a later get raises a JSON
  decode error; quoted JSON text returns a string on read. No error swallowing or publish hook belongs
  to these config methods. B4144 owns config publication and subscriber reloads for any caller.

  Own every CredentialsRepository function and its two table/client view protocols. It reads
  litellm_credentialstable through B4144.wrap_table_actions_for_config_sync; a write completes before
  publication. B4144's production publisher skips absent Redis and warns 'config sync publish for
  litellm_credentialstable failed: ...' on an ordinary Redis error, preserving the successful write
  result. An explicitly injected publisher exception can instead propagate after the commit; do
  not confuse that test seam with the production best-effort publisher. A missing client uses the same
  RuntimeError above. find_all returns raw rows. create, update_by_name and delete_by_name pass data
  through verbatim and key operations by credential_name. find_by_name alone uses _to_model: None
  remains None, B700.record_to_dict supplies fields, credential_name is required, and falsey
  credential_values/credential_info become {} before B721.CredentialItem validation. These methods
  never encrypt or decrypt credential values; B061's credential service prepares stored ciphertext.

  Native Postgres tests use POSTGRES_TEST_URL when supplied, otherwise testcontainers, with independent
  schemas and cleanup. Failure to connect/start fails the test. Compare raw rows to independently
  initialized pinned fixtures and check write/publication order with actual database mutations.
  Only _decoded_json's pure conversion enters Management::database operation resource_repository;
  do not call repository methods from a helper adapter or simulate a database in Python.

  This task's database JSON boundary decode_config_json validates stored config values using a bounded
  JSON decoder; B2307 supplies the fuzz workspace, not the parser implementation. The
  resource_config_json fuzz target calls the production entry point.
  Add malformed JSON, scalar, array, object, duplicate-key, byte-limit and depth-limit seeds. Limit
  otherwise unbounded JSON input to 1048576 bytes/depth 64, returning the row decode error on excess;
  native_config_value_limits covers this recorded difference. No configuration setting is introduced.

  Caller search leaves 133 nonblank, noncomment function lines plus the model table-name declaration.
  Budget 170 production, 230 behavior/Postgres tests, 55 pure-helper adapters, 55 decoder/fuzz and
  40 wiring lines, 550 total within 600. Keep native modules below 300 lines; SQL counts toward the gate.
scope:
  paths:
    - crates/betterlite-db/src/resource_repository.rs
    - crates/betterlite-db/src/resource_repository/**
    - crates/betterlite-db/Cargo.toml
    - crates/betterlite-db/fuzz/Cargo.toml
    - crates/betterlite-db/fuzz/fuzz_targets/resource_config_json.rs
    - crates/betterlite-db/fuzz/corpus/resource_config_json/**
    - tools/oracle/src/helpers/db/resource_repository.rs
    - tools/oracle/src/helpers/db/resource_repository/**
    - tools/oracle/helpers/resource_repository.py
    - tools/oracle/helpers/resource_repository/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/resource-repository/**
    - tools/oracle/fuzz/corpus/helper_case/resource-repository-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/model_repository.py#L22-L111
    why: Live raw-table access, read decryption and excluded-ID lookup; unused convenience queries are excluded below.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/budget_repository.py#L16-L43
    why: Budget row/table access and the find_by_id call used by key reassignment.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/object_permission_repository.py#L15-L28
    why: Permission table's explicit writer selection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/config_repository.py#L13-L86
    why: Live config get/set path, JSON strings and upsert fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/credentials_repository.py#L23-L82
    why: Raw credential storage with publication wrapper and named read conversion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/config_sync_pubsub.py#L101-L160
    why: B4144 supplies write-then-publish ordering and catches ordinary production Redis failures.
dod:
  - text: 'postgres_pinned_rows covers raw_model_table, excluded_model_id, model_json_columns,
      model_nonstring_params, model_decrypt_valid_plaintext_and_corrupt, constructor_key_not_read_key,
      budget_id_column, permission_writer_choice, config_writer_choice, config_missing,
      config_create_update_fields, config_original_return_value, config_verbatim_string,
      credential_verbatim_writes, credential_raw_list, credential_named_lookup and falsey_credential_maps.'
    proof: [behavior-tests, postgres-tests]
  - text: 'postgres_failure_effects covers missing_client_before_query, invalid_model_json,
      config_bare_string_read_failure, config_upsert_failure, credential_missing_name,
      model_raw_write_before_publication, credential_write_before_publication,
      credential_redis_absent_noop, credential_redis_failure_warns_but_succeeds,
      injected_publisher_error_after_commit and read_has_no_publication.'
    proof: [behavior-tests, postgres-tests]
  - text: 'config_json_conversion compares object_array_scalar_null, quoted_string, duplicate_last_value
      and malformed_json with the pure pinned helper. native_config_value_limits covers bounded failure
      and the actual decoder replays all resource_config_json fuzz seeds.'
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus, parser-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: A live repository's row conversion or read/write behavior differs from the pin.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^resource_repository::tests::/) - test(replays_the_resource_config_json_corpus)'
    - id: postgres-tests
      why: Raw row or failure-order assertions are absent or fail on real Postgres.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/resource_repository::tests::postgres_pinned_rows$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/resource_repository::tests::postgres_failure_effects$/)'
    - id: helper-python
      why: The pure config-value adapter is missing or fails strict Python checks.
      run: test -f tools/oracle/helpers/resource_repository.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new resource_repository operation reaches the shared HelperCase decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/resource-repository-*')" && grep -rlq resource_repository tools/oracle/fuzz/corpus/helper_case/resource-repository-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: The config-row decoder lacks its registered target or production replay coverage.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/resource_config_json.rs && grep -q resource_config_json crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/resource_config_json)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_resource_config_json_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/resource-repository/config-json-shapes.yaml
  - tools/oracle/cases/helpers/resource-repository/config-json-invalid.yaml
deviations:
  - what: Config-row JSON over 1048576 bytes or depth 64 raises a bounded row-decode error.
    why: The new outside-byte entry point must satisfy bounded-inputs; the pin has no equivalent bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/config_repository.py#L13-L15
out_of_scope:
  - 'model_repository.py: _encrypt_litellm_params, find_by_id, find_by_name, find_all, find_unblocked,
    find_by_team_id, create_model, update_model, delete_model, block_model and unblock_model have no
    production caller at the pin; calls among those unused convenience methods do not make them live.'
  - 'budget_repository.py: create_budget, update_budget and delete_budget have no caller at the pin.'
  - 'object_permission_repository.py: find_by_id, create_permission, update_permission and
    delete_permission have no caller at the pin; live callers use table actions.'
  - 'config_repository.py: delete_param and get_all_params have no caller at the pin.'
  - B700 owns BaseRepository and record_to_dict; B714 owns reader/writer handle selection; B726 owns PrismaTableRepository including publication wiring.
  - B2303 owns decryption; B061's credential routes and B836's model writes own encryption before raw storage.
pitfalls:
  - 'The oracle helper for this task is pre-registered as resource_repository in the db group. Replace the stub Op in tools/oracle/src/helpers/db/resource_repository.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/resource_repository.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A credential repository write preserves the caller's bytes and cannot be credited with at-rest encryption.
  - The model repository's encryption_key constructor argument is not used by read decryption.
  - set_param accepts a bare string that get_param later rejects as invalid JSON.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
