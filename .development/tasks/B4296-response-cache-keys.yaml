deviations:
  - what: >-
      Changing value serialization format (JSON, string representation, parameter ordering, numeric formatting)
      breaks cache-key compatibility with entries cached using the previous format. A cache key hash mismatch
      makes old cache entries unretrievable.
    why: >-
      The get_cache_key function produces SHA-256 hashes of ordered parameter material; any change to how
      that material is serialized produces a different hash for identical logical input, silently degrading
      cache hit rates. Users must decide whether compatibility with old entries is required and whether
      a cache flush/migration is acceptable before upgrading betterlite.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L358-L407

  - what: >-
      litellm.enable_caching_on_provider_specific_optional_params is accessed as a module-level global flag,
      not loaded from betterlite's configuration. This task respects the global value when building cache keys.
    why: >-
      LiteLLM exposes this as a runtime toggle in __init__.py. Betterlite does not currently expose configuration
      hooks to change this per-request or per-proxy-instance, so the feature flag remains a global setting.
      If betterlite's configuration model changes to support per-instance toggles, this behavior should be revisited.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L397

out_of_scope:
  - B212 owns ModelParamHelper._get_all_llm_api_params; this task calls it to get the canonical param list.

  - B2228 owns is_litellm_owned_kwarg predicate; this task calls it to distinguish owned from provider-specific params.

  - B4290 owns CacheMode, DynamicCacheControl, SemanticCacheScope, backend tag enums and all semantic-cache type
    declarations; this task references them in enum checks and scope-field handling.

  - B2239 owns litellm_settings.set_verbose configuration loading and the verbose_hooks module; get_cache_key calls
    print_verbose which uses the loaded setting to guard console output.

  - Cache policy (no-cache, no-store) is owned by higher-level cache orchestration tasks; should_use_cache checks
    these policies but does not define them.

  - Preset cache-key storage and retrieval in kwargs (preset_cache_key field) is handled by request-scoping tasks
    (B4300-B4305); this task only reads/writes the field as a pass-through mechanism.

pitfalls:
  - The _get_semantic_cache_tenant_scope function searches for identity fields across both kwargs and
    litellm_params.metadata/litellm_metadata, in that nested order. A missing field in all metadata sources
    silently omits it from the tenant scope string. Never assume a field is present; the tenant-scope string
    is built from only the non-None fields found.

  - Preset cache keys must be extracted and returned before any parameter iteration happens. If a preset key
    is supplied, the entire pipeline (scope iteration, hashing, namespace assignment) is bypassed. This is
    a short-circuit, not a supplementary step.

  - The caching_group is extracted from metadata.caching_groups (a list), which is searched for a group containing
    the model_group. If a caching_group is found, it is returned as a string; do not concatenate or index into it
    without understanding LiteLLM's caching-group contract first.

  - File identity for transcription requests hashes the file content, not the file name. A file with the same
    content as another file (different name) will map to the same cache entry. Different uploads of the same
    audio file will share a cache hit if content is identical.

  - provider-specific optional parameters are any kwarg outside the canonical ModelParamHelper list that also
    fails is_litellm_owned_kwarg. These are only included in the cache key when the feature flag is true; do not
    silently add or remove them based on a different heuristic.

  - Python's value formatting (str() representation of objects, JSON serialization of nested dicts) is not
    canonical across Python versions or custom types. Match LiteLLM's exact string representation by testing
    against the oracle cases and the pinned commit; do not apply custom JSON encoding without a deviation entry.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
