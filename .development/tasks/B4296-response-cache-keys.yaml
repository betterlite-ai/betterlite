id: B4296
title: Derive exact and tenant-scoped semantic cache keys
description: >-
  Implement the semantic cache key derivation pipeline: ordered parameter material collection with excluded
  prompt content, model/caching group resolution, transcription file identity handling, preset-key bypass,
  SHA-256 hashing and namespace prefixing. Semantic cache keys omit prompt content (messages/prompt/input
  parameters) but include all other request material: model, file checksums, temperature, max_tokens, tools
  and other provider-specific optional parameters. Tenant-scoped keys add server-set identity fields
  (user_api_key, user_api_key_team_id, user_api_key_org_id) and optionally end-user identity. Caching groups
  and model_group metadata allow multiple deployments to share cached responses.

  Implement ordered key material by iterating ModelParamHelper._get_all_llm_api_params in the order that
  LiteLLM's get_cache_key uses, excluding prompt content for semantic caches. Build cache mode (default_on for
  always cached, default_off for opt-in) as a simple enum. Derive caching groups from metadata when present,
  falling back to model_group, then the model parameter itself. For file parameters (used in transcription),
  extract file identity from file_checksum, file.name, file_name or the file_name inside litellm_params,
  in that order.

  Implement preset cache keys: when a caller provides a cache key inline through litellm_params.preset_cache_key,
  skip derivation and use it directly. Cache the derived key back into litellm_params.preset_cache_key so
  repeated calls with the same arguments reuse the key without re-hashing.

  Hash the ordered cache key material with SHA-256 to produce a fixed-width key. When a redis namespace is
  provided (either through cache.namespace, metadata.redis_namespace, or the Cache.namespace property),
  prepend it with a colon separator. Use print_verbose for debug logging at key derivation, including source
  material length; litellm.set_verbose is loaded by B2239's configuration.

  Cache mode determines whether cache is opt-in (no-cache and no-store policies remain separate from the mode).
  Enable the cache with mode=default_on to always cache, or mode=default_off to require cache.use-cache=true
  in the request. should_use_cache returns true only if the mode permits it.

  Semantic cache scope fields include the tenant scope (key/team/org) from server-set metadata and optionally
  end-user identity. Extract them from both kwargs metadata and litellm_params.metadata when one is a dict.
  When semantic_cache_scope is "end_user", include the user_api_key_end_user_id field; otherwise stop at
  tenant scope fields. Append each scope value as "field: value" to the cache key only when present and not None.
  Tenant isolation must be airtight: a similar prompt from another tenant's identity must hash to a different key.

  Consume B212 ModelParamHelper._get_all_llm_api_params and B2228 is_litellm_owned_kwarg to distinguish
  LiteLLM parameters from provider-specific ones. Consume B4290 DynamicCacheControl, SemanticCacheScope and
  backend type tags to check cache type. Consume B2239 for the loaded litellm.set_verbose setting used by
  print_verbose. The feature flag litellm.enable_caching_on_provider_specific_optional_params is accessed as
  a module-level global (not from config); betterlite respects its value for parameter inclusion. Never sort
  request parameters or replace Python value formatting with canonical JSON.

