dod:
  - text: Semantic cache excludes messages, prompt and input parameters from the key material so similar prompts map to the same tenant/identity bucket.
    proof: [cache-key-domain-tests]

  - text: get_cache_key returns the exact SHA-256 hash that LiteLLM produces for identical input kwargs, verified by oracle helper cases comparing both implementations with the same request material.
    proof: [cache-key-oracle-identity]

  - text: Tenant scope fields (user_api_key, user_api_key_team_id, user_api_key_org_id) and optional end-user field (user_api_key_end_user_id) are extracted from kwargs metadata or litellm_params metadata in that order of precedence.
    proof: [cache-key-domain-tests, cache-key-oracle-tenant-scope]

  - text: Preset cache keys supplied upstream bypass the pipeline and return immediately without re-hashing or namespace assignment.
    proof: [cache-key-domain-tests]

  - text: Model parameter is resolved via caching_group (if metadata specifies caching_groups), then model_group (if metadata specifies model_group), then the model kwarg itself.
    proof: [cache-key-domain-tests]

  - text: File parameter identity uses file content hash for transcription requests, preserving identity across different copies of the same file.
    proof: [cache-key-domain-tests]

  - text: Namespace assignment prepends a user-supplied or backend-inferred prefix to the hashed key, preventing collisions across multiple semantic engines or customer isolation schemes.
    proof: [cache-key-domain-tests]

  - text: Provider-specific optional parameters are included in the cache key only when litellm.enable_caching_on_provider_specific_optional_params is true; other provider params are excluded to preserve cache hits across compatible model aliases.
    proof: [cache-key-domain-tests]

  - text: should_use_cache returns true only when the cache is configured, the request mode matches (opt-in or always-on), and no no-cache or no-store policy is active.
    proof: [cache-key-domain-tests]

  - text: Oracle helper cases feed identical kwargs to both LiteLLM's Cache.get_cache_key and betterlite's implementation, comparing hash strings for exact format match. Cases cover semantic vs non-semantic modes, preset-key reuse, tenant-scope variants and namespace prefixing.
    proof: [cache-key-oracle-identity, cache-key-oracle-tenant-scope]

checks:
  optional: []
  commands:
    - id: cache-key-domain-tests
      why: Cache key derivation logic does not match LiteLLM behavior, or tenant isolation fields are wrong.
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^cache_key::/)'

    - id: cache-key-oracle-identity
      why: get_cache_key does not produce the exact SHA-256 hash LiteLLM produces for matching input, or preset keys are handled incorrectly.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/cache_key/)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^cache_key::oracle::(exact_hash|preset_key)/)'

    - id: cache-key-oracle-tenant-scope
      why: Tenant scope fields (user_api_key, team_id, org_id, end_user_id) are not extracted correctly or are in wrong order.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/cache_key/)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^cache_key::oracle::tenant_scope/)'

