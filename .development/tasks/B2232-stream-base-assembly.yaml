id: B2232
title: Stream base response assembly
description: >-
  Implement shared typed chunk assembly in betterlite-streaming, below provider and SSE execution. Parsed chunk
  DTOs come from B004; this task does not create another SSE/JSON parser. Use bounded outputs and injected clock/counters
  where the source reads them.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/litellm_core_utils/streaming_chunk_builder_utils.py:
  ChunkProcessor.__init__ L227-L230; _sort_chunks L232-L259; update_model_response_with_hidden_params L261-L269;
  _get_provider_response_model L271-L285; apply_provider_assembled_streaming_metadata L287-L331; _get_chunk_id L333-L342;
  _get_role_from_chunks L344-L346; _role_of_choice L348-L354; _get_model_from_chunks L356-L371; _get_service_tier_from_chunks
  L373-L378; build_base_response L380-L441.


  Named case contracts: conditional_sort_original_first: Only a truthy created_at in the original first chunk hidden
  dict enables stable ascending sorting; absent timestamps sort last, non-dict hidden fields act absent. created_at=0
  does not enable sorting. first_chunk always remains the original first input, even after sorting; empty construction
  raises on chunks[0]. base_metadata: Required object/created/model and optional system_fingerprint come from original
  first chunk. ID is first truthy ID in supplied chunks or empty; model is first truthy model different from original
  or original; service_tier is last nonempty string. Role comes from the first chunk with choices and its first
  choice only, default assistant even if later roles exist. Initialize one index=0 choice with empty content and
  zero usage. finish_and_hidden: Last non-None first-choice finish_reason wins, including empty string; default
  stop. Hidden params are copied from the last loop chunk, default {} (not necessarily original first). provider_response_model
  is first nonempty hidden string differing from original model, otherwise first such string; overlay that only
  when present. assembled_provider_metadata: No chunks or falsey response.model is a no-op. Prefer truthy logging
  custom_llm_provider, otherwise B174 resolution; B2230 selects config. Invoke injected ProviderAssembledMetadataProjection
  for that tag when installed. Resolver, enum, selector or projection exceptions are swallowed with debug apply_provider_assembled_streaming_metadata
  failed for model=%s: %s. Test each failure before/after projection; redact diagnostics via B187.


  ProviderAssembledMetadataProjection is an injected typed callback over the selected B2230 config tag; the installed
  provider implementation supplies the callback at the outer call site. It does not construct/import provider crates
  here. Preserve the source debug-and-return exception boundary around resolution, selection and callback. B2227
  composes this helper; B005 streams then calls B2227, never the reverse.


  Implement crates/betterlite-streaming/src/stream_base_assembly.rs with adjacent tests under stream_base_assembly/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_base_assembly_cases in betterlite-streaming with these exact named cases (one per
  oracle file): conditional_sort_original_first, base_metadata, finish_and_hidden, assembled_provider_metadata.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/stream_base_assembly* using HelperCase: kind:
  helper and the externally tagged stream_base_assembly variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_stream_base_assembly that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 187 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 205 production lines, 245 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 595 planned, 600 maximum changed lines.
