id: B3420
title: Eval wire contracts and inherited provider errors
description: >-
  Build the live eval request/response contracts in crates/betterlite-openai::evals, using
  the EvalDefinition and EvalRun names already specified by B523 so its transforms consume
  these models. Add the inherited provider-error construction below core/server and preserve
  the base constructor's lack of side effects.

  Export from betterlite-openai::evals: DataSourceConfigCustom, DataSourceConfigLogs,
  DataSourceConfigStoredCompletions, DataSourceConfig union, LLMAsJudgeGraderConfig,
  GroundTruthGraderConfig, CustomGraderConfig, GraderConfig union, CreateEvalRequest,
  UpdateEvalRequest, ListEvalsParams, Eval, ListEvalsResponse, DeleteEvalResponse,
  CancelEvalResponse, CreateRunRequest, ListRunsParams, ResultCounts, PerTestingCriteriaResult,
  Run, ListRunsResponse, CancelRunResponse, RunDeleteResponse. These classes have no user-defined
  methods. Also export the base class BaseEvalsAPIConfig with all transformation hooks
  (validate_environment, sign_request, get_complete_url, transform_*_request,
  transform_*_response, get_error_class) and the inherited provider-error construction.

scope:
  paths:
    - crates/betterlite-openai/src/evals/**
    - crates/betterlite-openai/src/lib.rs
    - crates/betterlite-openai/tests/fixtures/evals/**
    - crates/betterlite-openai/Cargo.toml
  lint_tables: false

