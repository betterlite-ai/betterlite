checks:
  optional: []
  commands:
    - id: eval-types-test
      why: eval type definitions do not parse, serialize, or have missing fields
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^eval_types::/ || /^eval_contracts::/)'
    - id: base-config-test
      why: BaseEvalsAPIConfig initialization or error class construction fails
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^base_evals_config::/ || /^eval_error_class::/)'

oracle_cases: []

deviations:
  - what: RunDeleteResponse.object and RunDeleteResponse.deleted are both Option types that default to specific values ("eval.run.deleted" and true respectively), matching LiteLLM's wire contract.
    why: The response may omit these fields on the wire, so they must be Optional in the model to allow deserialization of partial responses while preserving LiteLLM's default values.

out_of_scope:
  - Unused types DataSourceDatasetConfig (205-212), DataSourceSampleSetConfig (215-222), DataSourceInlineConfig (225-232), RunDataSourceConfig (235), and CompletionConfig (238-257) have no callers at the pinned commit; they are documented but not built. These union types and completion model are not referenced by any create_run flow at the pin.
  - Abstract transformation hooks in BaseEvalsAPIConfig (validate_environment, get_complete_url, transform_*_request, transform_*_response) have no callers at the pin in open-source LiteLLM; their OpenAI subclass implementations belong to B523.
  - All non-abstract BaseEvalsAPIConfig methods beyond __init__ and get_error_class (custom_llm_provider property, sign_request, etc.) are abstract and belong with their concrete provider implementations in B523.
  - HTTP transport and request dispatch; that belongs to later transport-layer tasks.
  - Provider selection and routing; that is owned by external router tasks.

pitfalls:
  - "RunDeleteResponse.object defaults to Some(\"eval.run.deleted\") when omitted from the wire; RunDeleteResponse.deleted defaults to Some(true) when omitted. Both may be None if explicitly set to null, but the default values match LiteLLM's wire contract."
  - "Eval.object always defaults to \"eval\" (not a union); ListEvalsResponse.object always defaults to \"list\"; Run.object always defaults to \"eval.run\"; DeleteEvalResponse.object always defaults to \"eval.deleted\"; CancelEvalResponse.object always defaults to \"eval\"; CancelRunResponse.object always defaults to \"eval.run\". These constants are part of the wire format contract."
  - "ListEvalsResponse.has_more defaults to false, not None; ListRunsResponse.has_more defaults to false. Omitted has_more is treated as false, not as missing data."
  - "CreateEvalRequest.data_source_config is required; the union (DataSourceConfig) does not include the unused dataset/sample-set/inline variants (those belong to run requests only). Do not conflate the request and response data source types."
  - "ResultCounts.passed, ResultCounts.failed, and ResultCounts.error all default to 0 when omitted. A response that omits these counts should deserialize to zero, not None."
  - "Run fields started_at, completed_at, model, per_model_usage, per_testing_criteria_results, report_url, result_counts, shared_with_openai, metadata, and error are all optional and may be null. None of these should have unexpected defaults."
  - "BaseEvalsAPIConfig.get_error_class is inherited by concrete provider configs; it calls BaseLLMException.__init__ from B2202, which is owned upstream. The inherited method must not add side effects or raise exceptions (except the expected ones from BaseLLMException itself)."

review_level: standard

