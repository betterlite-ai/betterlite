    why: Live eval request types (DataSourceConfigCustom, DataSourceConfigLogs, DataSourceConfigStoredCompletions, DataSourceConfig union, LLMAsJudgeGraderConfig, GroundTruthGraderConfig, CustomGraderConfig, GraderConfig union, CreateEvalRequest, UpdateEvalRequest, ListEvalsParams) and response types (Eval, ListEvalsResponse, DeleteEvalResponse, CancelEvalResponse) through line 204; lines 205-257 contain unused types DataSourceDatasetConfig, DataSourceSampleSetConfig, DataSourceInlineConfig, RunDataSourceConfig, CompletionConfig which are out_of_scope but documented here for reference.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai_evals.py#L258-416
    why: Run API request types (CreateRunRequest, ListRunsParams) and response types (ResultCounts, PerTestingCriteriaResult, Run, ListRunsResponse, CancelRunResponse, RunDeleteResponse) with all fields and defaults preserved.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/evals/transformation.py#L1-39
    why: BaseEvalsAPIConfig class declaration and imports preamble.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/evals/transformation.py#L40-41
    why: BaseEvalsAPIConfig.__init__ method with no-side-effects base initializer.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/evals/transformation.py#L507-518
    why: BaseEvalsAPIConfig.get_error_class inherited method that constructs BaseLLMException with status_code, message and headers.
