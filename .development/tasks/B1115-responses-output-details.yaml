id: B1115
title: Responses image, citation and usage details
description: >-
  Add the five output-detail methods from LiteLLMCompletionResponsesConfig to
  betterlite-core::api::responses_output_details. Convert parsed chat choices, annotations
  and Usage into B902 output items and B1138 usage. Inject UUID generation for ig_ IDs.
  These methods do no downloads: the image helper removes a data-URL prefix without
  validating or decoding base64. A URL string is treated as an opaque result string too.
  B906 is not called; this is the opposite direction of usage conversion and preserves
  the supplied total instead of recomputing it.

  Add the responses_output_details B171 adapter and domain tests image_results,
  image_finish_status, citation_fields and usage_details. Mask only the random ig_ UUID
  in oracle output. The 168 nonblank/non-comment source lines fit 180 implementation,
  125 tests, 90 fixtures, 75 adapters and 20 wiring lines: 490 total. Work on decoded
  records requires no new byte decoder or fuzz target.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_output_details.rs
  - crates/betterlite-core/src/api/responses_output_details/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_output_details.rs
  - tools/oracle/src/helpers/core_ops/responses_output_details/**
  - tools/oracle/helpers/responses_output_details.py
  - tools/oracle/helpers/responses_output_details/**
  - tools/oracle/fuzz/corpus/helper_case/responses_output_details-*
  - tools/oracle/cases/helpers/responses-output-details/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2599-L2690
  why: Own image extraction, image-status mapping and the first-comma data-URL operation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L2784-L2894
  why: Own URL-citation projection and chat-to-Responses usage including grounding/cache counters.
dod:
- text: >-
    image_results supplies message.images=[{image_url:{url:"data:image/png;base64,YQ=="}}];
    expect one {type:image_generation_call,id:ig_<UUID>,status:completed,result:YQ==}.
    Raw "YQ==" stays unchanged; "data:x,a,b" yields "a,b"; empty URL,missing image_url,
    "data:missing-comma" and a data URL with empty suffix produce no item. No images yields [].
    image_url=7 or url=7 fails the pinned type adapter, while https://a.test/image is returned
    verbatim without fetching. Preserve input order for multiple images.
  proof: [detail-tests, oracle, detail-adapter]
- text: >-
    image_finish_status maps stop->completed,length->incomplete,content_filter/error->failed,
    null/tool_calls/unknown->completed. It never emits queued,cancelled or in_progress from a
    finish reason, even though in_progress is an allowed image-output status.
  proof: [detail-tests, oracle, detail-adapter]
- text: >-
    citation_fields turns {type:url_citation,url_citation:{start_index:1,end_index:4,url:https://a.test,title:A}}
    into the flat annotation with those fields. An empty nested citation produces null
    start_index,end_index,url,title. Null annotations become []; a non-url type or missing
    url_citation is silently omitted. It does not fetch the cited URL or invent a title.
  proof: [detail-tests, oracle, detail-adapter]
- text: >-
    usage_details supplies prompt=2,completion=3,total=99,cost=0.125; expect input=2,output=3,
    total=99,cost=0.125. Missing ModelResponse.usage yields zeros with null details. Input
    cached_tokens=null becomes 0; audio,text,image,video counts and a typed CachedTokensDetails
    survive. A raw untyped cached_tokens_details mapping is dropped by the isinstance check.
    cache_write_tokens=0 with cache_creation_tokens=7 selects 7, while cache_write_tokens=4
    selects 4. web_search_requests=0 and google_maps_grounding_requests=2 both survive.
    Output reasoning_tokens=null becomes 0; provided audio_tokens=0,text_tokens=5,image_tokens=2
    survive, absent ones remain null and unrelated provider usage extras are not copied.
  proof: [detail-tests, oracle, detail-adapter]
checks:
  optional: []
  commands:
  - id: detail-tests
    why: image status, annotation flattening or usage counter projection changes
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_output_details::/)'
  - id: detail-adapter
    why: output detail fixtures do not invoke the pinned transformation independently
    run: test -f tools/oracle/helpers/responses_output_details.py && grep -qE '^[[:space:]]+responses_output_details:' tools/oracle/fuzz/corpus/helper_case/responses_output_details-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-output-details/image-results.yaml
- tools/oracle/cases/helpers/responses-output-details/image-finish-status.yaml
- tools/oracle/cases/helpers/responses-output-details/citation-fields.yaml
- tools/oracle/cases/helpers/responses-output-details/usage-details.yaml
deviations: []
out_of_scope:
- In the same transformation.py, B907 owns custom-tool helpers, B908 request options, B909 input dispatch, B910 reasoning merging, B911 tool repair, B912 tool-result conversion, B913 namespaces, B914 response assembly/status and B915 session-backed input preparation.
- B904 wraps container IDs after assembly and B906 normalizes Responses usage into chat usage; neither is called by these detail methods.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_output_details in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_output_details.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_output_details.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- cache_write_tokens uses Python or, so an explicit zero falls through to cache_creation_tokens.
- The base64 extractor accepts arbitrary nonempty strings; validating a URL or fetching it changes this method's behavior.
- Missing output reasoning tokens become zero only when a completion-details object exists; absent details remain null.
review_level: standard
budget:
  max_changed_lines: 490
  max_new_expects: 1
