dod:
  - text: blank_to_none, uses_issuer_anchor, has_discovery_source and obo_needs_discovery follow the rules above, including blank text and an issuer on a non-discovery auth type.
    proof: [oauth-basics-tests]
  - text: endpoints_yield_to_issuer returns three Nones for an anchored issuer and logs the discarded fields in sorted order, and returns the inputs unchanged otherwise.
    proof: [oauth-basics-tests]
  - text: flow_endpoints_missing, endpoints_unresolved and requires_discovery cover the token exchange, entra_obo scope, dcr_bridge registration and client_credentials cases.
    proof: [oauth-unresolved-tests]
  - text: endpoints_corroborate and restrict_to_corroborated drop only the token and registration urls on a mismatch and never touch scopes.
    proof: [oauth-trust-tests]
  - text: carry_forward_endpoints copies the previous endpoints only under the corroboration rule, and an anchored server carries scopes only.
    proof: [oauth-trust-tests]
  - text: explicit_oauth2_flow, resolve_oauth2_flow, effective_oauth2_flow and flow_for_request infer client_credentials only from the M2M field shape and warn on an inferred change.
    proof: [oauth-flow-tests]
  - text: merge_discovered, extract_scopes, discovery_leaves_unresolved and warn_unresolved match the item text, including the origin fallback issuer and the two warning variants.
    proof: [oauth-merge-tests]

checks:
  optional: []
  commands:
    - id: oauth-basics-tests
      why: the blank, anchor, discovery source, token exchange or issuer yield rules are missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_oauth::tests::basics_/)'
    - id: oauth-unresolved-tests
      why: the unresolved endpoint decision is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_oauth::tests::unresolved_/)'
    - id: oauth-trust-tests
      why: the corroboration gate or the carry forward rule is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_oauth::tests::trust_/)'
    - id: oauth-flow-tests
      why: oauth2_flow resolution or the request-time backstop is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_oauth::tests::flow_/)'
    - id: oauth-merge-tests
      why: the metadata merge, the scope extraction or the unresolved warning is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_oauth::tests::merge_/)'

oracle_cases: []

deviations:
  - what: flow_for_request returns a Cow of the server and extract_scopes takes a typed ScopesInput, not a Python value.
    why: Rust has no model_copy or duck typing, and docs/compatibility.md leaves Python runtime typing out of scope.

out_of_scope:
  - "Fetching and parsing authorization server and protected resource metadata: B6761."
  - "Discovery slots, background tasks and ensure_oauth_metadata_discovered: B6762."
  - "Building a record from a table row or config entry with these rules: B6763 and B6764."
  - "The MCPServer record, its effective url getters and is_dcr_bridge: B6590."
  - "canonicalize_url_identity and redact_mcp_resource_url: B4654."

pitfalls:
  - "resolve_oauth2_flow returns None for any non-empty unknown flow text and does not fall through to the shape inference; only an empty or missing value is inferred."
  - "carry_forward_endpoints copies authorization_url without the corroboration check, but only when the new one is None; the check guards token_url, registration_url and scopes."
  - "An issuer anchored server never gets its endpoints carried forward, so a failed issuer fetch keeps them None (fail closed)."
  - "extract_scopes keeps list entries untrimmed, while a whitespace separated text is split and trimmed."
  - "merge_discovered uses an empty string as unset, like Python's or, so a blank stored url is replaced by the discovered one."
  - "endpoints_unresolved reads the flow from effective_oauth2_flow, not the stored column, so an unstamped M2M row does not trigger discovery on every reload."
  - "The entra_obo rule needs scopes, and scopes only come from resource discovery, so a server with both endpoints but no scopes stays unresolved."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
