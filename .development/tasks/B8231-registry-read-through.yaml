dod:
  - text: A recent miss is answered false with no resync, a found object is not remembered, a miss is remembered for the ttl and a resync error returns false without remembering it.
    proof: [attempt-tests]
  - text: At most 20 resyncs run per 5 second window, the 21st call logs a warning and returns false without remembering the miss, and a new window restores the budget.
    proof: [budget-tests]
  - text: Two tasks that ask for the same missing key at once run the resync once.
    proof: [attempt-tests]
  - text: The model, guardrail and agent resyncs follow the stated order of lookups and return false when db-backed registries are disabled.
    proof: [resync-tests]
  - text: The two lookup helpers return the registry hit without calling attempt, and look again after a true attempt.
    proof: [lookup-tests]
  - text: The merge patch follows RFC 7386 for the cases in the task, never mutates the target, and fails at the 65th nested object.
    proof: [patch-tests]
