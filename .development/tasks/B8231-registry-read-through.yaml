oracle_cases: []
deviations:
  - what: The recent-miss map is a plain map of key to expiry capped at 1000 keys, and not LiteLLM's InMemoryCache.
    why: The cache class is a Python helper; the observable rule (a miss is remembered for the ttl, at most 1000 keys) is the same.
  - what: A resync error is a typed ResyncError that is logged and turned into false, as in LiteLLM, but the log line carries the error's Display text and not a Python exception repr.
    why: The line is a log, not a wire contract.
out_of_scope:
  - "The real database adapters behind the ports (ModelSync, GuardrailSync, AgentSync) and the callers that pass a missing model, guardrail or agent name into attempt: the model, guardrail and agent registry tasks (B4776, B3683) and the router lookup tasks."
  - "Who owns proxy_config.add_deployment and the model reconcile lock: the proxy_config part of B124 (named in the final note)."
  - "The callers of apply_json_merge_patch (team metadata update): the team route tasks."
pitfalls:
  - A resync runs while the lock is held, so a slow database call blocks other keys of the same instance. That is LiteLLM's behavior and keeps the load on the database low; do not release the lock around the call.
  - The budget is consumed before the resync runs, so a resync that fails still used one slot.
  - A budget refusal does not remember the miss, so the next call after the window opens may retry. A resync that returns false does remember it.
  - 'In the merge patch, a nested null for a key the target does not have still creates the empty object for the parent: patch {"a": {"b": null}} on {} gives {"a": {}}.'
  - A patch that is an array or a scalar replaces the target whole, and a target that is not an object is treated as {} only when the patch is an object.
  - The depth check runs only for object patches, so a deep array or scalar leaf is fine.
review_level: standard
