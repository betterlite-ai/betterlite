id: B3623
title: Pass-through Vertex HTTP and discovery routes
description: >-
  Build the three Vertex AI pass-through HTTP routes and the shared function behind them, as the module vertex_passthrough_routes in crates/betterlite-server.
  The shared function is LiteLLM's _base_vertex_proxy_route. It authenticates the caller, works out the Vertex project, location and model, picks the credentials, builds the Google target URL and hands the request to B3615's create_pass_through_route handler.
  This task builds the routers; B8608 mounts them and owns their HTTP oracle cases, so test the handlers here with tower oneshot over the router and fakes. The Live WebSocket route at /vertex_ai/live belongs to B3629 and is not built here.
  Every name below is at most 30 characters; LiteLLM's longer names are renamed on purpose.

  Registration. `vertex_routes_router(deps: VertexRouteDeps)` returns the axum router with these paths, each for GET, POST, PUT, DELETE and PATCH, where `endpoint` is the rest of the path without a leading slash: `/vertex_ai/discovery/{endpoint}`, `/vertex_ai/{endpoint}` and `/vertex-ai/{endpoint}`. The hyphen path is an alias of the underscore one and is left out of the OpenAPI schema. B8608 adds the router to the app once beside B3629's WebSocket route.
  `VertexRouteDeps` holds the ports below, built once by B8608 from B8641's adapters. This task declares each port as a small trait with one async method, so tests use recording fakes and nothing global is read:
  - `VertexKeyAuth`: B052's key authentication with an explicit api key string, returns the authenticated key or the auth error unchanged.
  - `VertexStoreAccess`: `managed_store(vector_store_id)` and `assert_access(store, key)`, backed by B1061 (get_litellm_managed_vector_store and assert_user_can_access_vector_store in betterlite-core::api::vector_endpoint_access; read the merged names). A lookup failure is B1061's own 500 "Unable to validate vector store access"; a denied caller is its 403.
  - `VertexCredentialLookup`: `credentials(project, location) -> Option<VertexPassThroughCredentials>`, backed by B3602's get_vertex_credentials (record at `crate::pass_through_credentials::VertexPassThroughCredentials`).
  - B3622's `VertexDeploymentLookup`, as an Option (no router means no model resolution).
  - `VertexRelay`: one method `relay(endpoint, target, custom_headers, is_streaming, request, response, key) -> Result<Response, RelayError>`, backed by B3615's create_pass_through_route handler. `RelayError` has the variant `Proxy(ProxyException)`, where ProxyException is the error type of B3613 PassThroughHandler::handle and the error B3615 names for its relay (read the merged name from the exception module; stop and report if it is not there), and `Other`.
  - Request state is not a port. Step 5 calls B3615 set_passthrough_state on the request extensions with a PassThroughState that carries the deployment model info (stored under B3600 MODEL_INFO_STATE_KEY). B3615 relay cleans it up with take_passthrough_state after the call. If B3615 has not merged these two functions, stop and report.

  The two route handlers.
  `vertex_discovery_route` (LiteLLM vertex_discovery_proxy_route) has no auth dependency. It searches the endpoint for the regex `dataStores/([^/]+)` (first match, anywhere in the text). With a match it asks VertexStoreAccess for the managed store of that id; None is not an error (an unknown id keeps the direct pass-through). It then calls the shared function with the discovery base handler and the store as router credentials.
  `vertex_aiplatform_route` (vertex_proxy_route) authenticates through the normal dependency first, like every proxy route, then calls the shared function with the aiplatform base handler and no router credentials. The shared function authenticates again, as LiteLLM does, so a failure of either gives the auth error.
  The base URL handlers: discovery always gives `https://discoveryengine.googleapis.com/` and ignores the location. aiplatform with no location is HTTP 400 with the detail "No Vertex AI location for this request. Include /projects/<project>/locations/<location>/ in the route, set vertex_location in default_vertex_config (or DEFAULT_VERTEXAI_LOCATION), or add the model to model_list with use_in_pass_through: true." (one line, no line break). Otherwise it calls B3622's passthrough_vertex_base_url; its InvalidFormat error is an internal error (HTTP 500), as the unhandled ValueError is in LiteLLM. Model the two handlers as one enum `VertexBaseKind { Discovery, AiPlatform }`.

  The shared function `vertex_proxy_core(kind, endpoint, request, response, router_credentials)`, in order:
  1. `encoded_endpoint` is the path of the endpoint as httpx parses it (B3618's provider_target_url takes the path the same way): query and fragment dropped. Debug-log the requested endpoint.
  2. Authenticate with VertexKeyAuth using the string from B3603's get_litellm_virtual_key(request): `Bearer {x-litellm-api-key}` when that header is non-empty, otherwise the Authorization header, otherwise an empty string.
  3. When router credentials exist, call assert_access on them with the authenticated key.
  4. vertex_project = B1304's get_vertex_project_id_from_url(endpoint), vertex_location = get_vertex_location_from_url(endpoint). Then B3622's override_vertex_params with the router credentials.
  5. model_id = B1304's get_vertex_model_id_from_url(endpoint). When it is non-empty and a router exists, call B3622's resolve_vertex_router_model and take back the new encoded endpoint, endpoint, project and location. When its model info is a non-empty map, store it with B3615 set_passthrough_state. An empty map is not stored.
  6. vertex_credentials = VertexCredentialLookup(project, location) on the values from steps 4 and 5.
  7. B3622's prepare_vertex_auth_headers with the request, those credentials, the router credentials, the project, the location and the key. Take its headers, headers_passed_through, project and location.
  8. The base target URL from the base handler and the location from step 7.
  9. When encoded_endpoint does not start with `/`, add one. Build the target with B1304's construct_target_url(base, encoded_endpoint, location, project) as a string.
  10. Streaming. When the target text contains `:rawPredict` or `:streamRawPredict`, ask B3618's request_is_streaming(request). Otherwise streaming is true when the text `stream` is anywhere in the target string. When streaming, append `?alt=sse` to the target text.
  11. Call VertexRelay with the endpoint from step 5 (not the encoded one), the target, B3622's vertex_upstream_headers(endpoint, headers) as the custom headers, the streaming flag, the request, the response and the key.
  12. On a RelayError::Proxy whose headers_passed_through is true, change its message to "No credentials found on proxy for project_name={project} + location={location}, check `/model/info` for allowed project + region combinations with `use_in_pass_through: true`. Headers were passed through directly but request failed with error: {original message}" and return it with every other field unchanged. Project and location are the values from step 7, printed as Python would: a None shows as the word None. Any other error goes up unchanged. The relay result is the route's result.
  This task adds no new setting. DEFAULT_VERTEXAI_LOCATION and default_vertex_config are read by B3602.
