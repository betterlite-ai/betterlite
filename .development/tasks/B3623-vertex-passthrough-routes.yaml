dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports. B8608 mounts the routes and proves them over HTTP with the oracle cases that were listed here.
    proof: [router-tests]
  - text: vertex_routes_router serves /vertex_ai/discovery/{endpoint}, /vertex_ai/{endpoint} and /vertex-ai/{endpoint} for GET, POST, PUT, DELETE and PATCH, builds without an axum path conflict, and the discovery path is not captured by the generic one.
    proof: [router-tests]
  - text: The discovery route looks up a managed store only for an endpoint with dataStores/<id>, treats an unknown id as no credentials, and checks the caller's access to a found store before anything else happens.
    proof: [discovery-tests]
  - text: The aiplatform base handler answers 400 with the exact location-required detail for no location, gives B3622's host otherwise and turns an invalid location into a 500, and the discovery handler always gives the discoveryengine host.
    proof: [base-handler-tests]
  - text: vertex_proxy_core authenticates with the string from get_litellm_virtual_key, applies the vector store override, then the router model resolution, and stores the model info only when it is a non-empty map.
    proof: [core-order-tests]
  - text: The target is built from the base, the slash-prefixed encoded endpoint and the final project and location, with the version and project segments B1304 adds, and the relay gets the resolved endpoint and B3622's upstream headers.
    proof: [target-tests]
  - text: Streaming is decided by the request body for rawPredict and streamRawPredict, by the text stream in the target for every other route, and a streaming target ends in ?alt=sse.
    proof: [streaming-tests]
  - text: A ProxyException from the relay gets the "No credentials found on proxy" text only when the headers were passed through, with project and location as printed by Python, and keeps its other fields.
    proof: [proxy-error-tests]
checks:
  optional: []
  commands:
    - id: router-tests
      why: a path or method is missing or two routes clash
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_routes::tests::router(::|$)/)'
    - id: discovery-tests
      why: the dataStores lookup or the access check is missing or runs in the wrong order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_routes::tests::discovery(::|$)/)'
    - id: base-handler-tests
      why: the missing-location 400, the host or the invalid-location 500 is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_routes::tests::base_handler(::|$)/)'
    - id: core-order-tests
      why: the steps of the shared function run in another order or with other inputs
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_routes::tests::core_order(::|$)/)'
    - id: target-tests
      why: the target URL, the relayed endpoint or the upstream headers are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_routes::tests::target(::|$)/)'
    - id: streaming-tests
      why: the streaming decision or the alt=sse suffix is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_routes::tests::streaming(::|$)/)'
    - id: proxy-error-tests
      why: the passed-through-headers text is added when it should not be, or is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^vertex_passthrough_routes::tests::proxy_error(::|$)/)'
oracle_cases: []
deviations:
  - what: An invalid location in the URL answers with the plain body "Internal Server Error", the same as LiteLLM's unhandled ValueError.
    why: Kept as is so a client sees no difference; the notes ask whether to return a typed 400 instead.
  - what: The OpenAPI schema entries and tags ("Vertex AI Pass-through", "pass-through") are not reproduced.
    why: betterlite builds its schema from the typed routes; no client behavior depends on the tags.
out_of_scope:
  - "get_vertex_base_url, get_vertex_ai_allowed_incoming_headers, _is_vertex_anthropic_count_tokens_route, _upstream_headers_for_vertex_route, _override_vertex_params_from_router_credentials, _resolve_vertex_model_from_router and _prepare_vertex_auth_headers: B3622 owns them and this task calls them."
  - "The credential-filter helpers (_normalize_credential_value to _forwarded_headers_for_credentialless_vertex_passthrough) and get_litellm_virtual_key: B3603 owns them."
  - "get_vertex_credentials and VertexPassThroughCredentials: B3602. get_vertex_project_id_from_url, get_vertex_location_from_url, get_vertex_model_id_from_url, construct_target_url: B1304."
  - "is_streaming_request_fn: B3618. create_pass_through_route and the request-state cleanup: B3615."
  - "_vertex_publisher_model_suffix, _resolve_vertex_live_credentials, _build_vertex_live_setup_model_rewriter, _resolve_alias_to_upstream_model, vertex_ai_live_websocket_passthrough and create_vertex_ai_live_websocket_endpoint: B3629 owns the Live WebSocket route."
  - "get_vertex_pass_through_handler as a function: replaced by the VertexBaseKind enum, its only two values are the two route kinds."
pitfalls:
  - "The URL readers search the endpoint text for `/projects/`, `/locations/` and `/models/` with a leading slash, and the endpoint has none at its start, so `projects/p/locations/l/...` without a `v1/` prefix reads no project; keep that."
  - "Step 5 uses the endpoint with the model replaced for the relay and the headers, but the encoded endpoint for the target; replacing only one of them sends the original model name to Google."
  - "The check `if deployment_model_info` is false for an empty map, so an empty model info is not stored on the request state."
  - "The streaming test `stream` in the target string also matches a project or model whose name contains stream, and the host aiplatform.googleapis.com does not match; do not narrow it to streamGenerateContent."
  - "For :rawPredict and :streamRawPredict the body decides, so a POST with stream false to :streamRawPredict is not streaming and gets no ?alt=sse."
  - "Location is checked after the credentials are prepared, so a credential-less request with no location gets B3603's 401 before the 400."
  - "The vertex route authenticates twice (dependency, then the explicit api key from get_litellm_virtual_key); the discovery route only once. Do not drop the second call from the vertex route, since its api key string differs (x-litellm-api-key wins over Authorization)."
  - "A 4xx or 5xx from Google reaches the client as the relay's ProxyException; the passed-through-headers sentence is prepended only for that error type, never for the 401 and 400 that this module raises itself."
  - "The discovery route builds its store lookup from the first dataStores/<id> in the whole endpoint text; an id with a dot or a dash is part of the match, only a slash ends it."
  - "B3629 owns the registration of /vertex_ai/live: a WebSocket upgrade there goes to its live handler and every other request on that path comes to vertex_aiplatform_route, so do not register /vertex_ai/live here."
review_level: security
budget:
