dod:
  - text: Each inherit step fills only null fields, skips on a lookup error, and keeps its own early returns (all cache fields set, PTU terms with attribution on, no base price for off-peak, every tier with an output rate).
    proof: [deployment-pricing-inherit, oracle]
  - text: The payload folds custom pricing from `litellm_params` into the model info and runs the four steps in LiteLLM's order, with the service tier step on the base model.
    proof: [deployment-pricing-payload, oracle]
  - text: Registration writes the full entry under the id with the model as warning name, the shared entry under every backend key, strips custom pricing for a strategy router alias, and keeps a `responses` or existing mode.
    proof: [deployment-pricing-register, oracle, helper-python]
  - text: Replay registers every readable deployment again in order and logs and skips an unreadable one.
    proof: [deployment-pricing-replay]
  - text: New helper corpus seeds call `b9710` and replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional:
  - mutants
  commands:
  - id: deployment-pricing-inherit
    why: A user price is overwritten, or a step runs where LiteLLM returns early.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^deployment_pricing::tests::inherit_/)'
  - id: deployment-pricing-payload
    why: Custom prices are lost from the payload, or the steps run in another order.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^deployment_pricing::tests::payload_/)'
  - id: deployment-pricing-register
    why: A deployment's prices leak onto the shared key, an alias keeps a price, or the shared mode is downgraded.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^deployment_pricing::tests::register_/)'
  - id: deployment-pricing-replay
    why: A reload drops a live deployment's prices, or one bad row stops the rebuild.
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^deployment_pricing::tests::replay_/)'
  - id: helper-python
    why: The b9710 adapter must exist and pass ruff and basedpyright.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b9710)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b9710 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b9710/pyrightconfig.json
  - id: helper-case-corpus
    why: b9710 needs fresh seeds that replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/router-deployment-pricing-*")" && grep -lE '^[[:space:]]+b9710:' tools/oracle/fuzz/corpus/helper_case/router-deployment-pricing-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/router-deployment-pricing
deviations: []
out_of_scope:
  - "Calling these functions is the callers' job: B401 (`_create_deployment`, which runs the same steps inline at L8996-L9028), B368 (`add_deployment`), B303 (`_handle_clientside_credential`) and the router catalog that registers the replay with B5365."
  - "`_cost_value_as_float` is B846's; `_cost_map_backend_model` and `_backend_cost_map_keys` are B013's, already in betterlite-models."
  - "`register_model`, the cost map and the replay slot are B5365's; `get_model_info` is B2225's; `ptu_terms` and the custom pricing field list are B1664's; `shared_backend_model_info` is B5650's."
  - "`_provider_unresolved_deployments` (the first step of the replay) belongs to B401, and `_invalidate_model_group_info_cache` to B846."
pitfalls:
  - "Cache pricing is inherited only when `input_cost_per_token` is set after the custom fields are folded in, so a deployment that sets only `output_cost_per_token` keeps cache reads unpriced."
  - "Service tier inheritance looks up `model_info.base_model`, then `litellm_params.base_model`, then `litellm_params.model`; the other three steps always look up `litellm_params.model`."
  - "Off-peak and service tier copy from the raw cost map entry under the lookup's `key`, not from the lookup result, because the lookup fills a missing flat rate with 0."
  - "A tiered output rate of 0 from the lookup is not copied (`if backend_rate:`), since a tiered-only backend reports 0."
  - "The mode rule keeps the shared mode only for `responses` to `chat` or for a missing deployment mode; `chat` to `responses` still applies, and the warning is logged only when the deployment named a mode."
  - "The by-id entry keeps `id`, `db_model` and any custom key, while the shared entry keeps only cost map schema fields; never register the full map under the backend key."
  - "A strategy router alias (`auto_router/...`) loses its custom prices on both keys, so an explicit 0 price there cannot make requests look free and skip budget checks."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
