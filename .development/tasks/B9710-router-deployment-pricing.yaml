id: B9710
title: Router deployment pricing in the cost map
description: >-
  When a deployment carries its own prices (`input_cost_per_token` and friends in `litellm_params`), LiteLLM's router writes them into the live cost map so spend for that deployment is billed at those prices. It also fills prices the user left out from the backend model's built-in entry, so a deployment that only sets token prices does not bill cache reads at 0. Nothing in betterlite does this yet: the router tasks that add deployments (B401's `_create_deployment`, B368's `add_deployment`, B303's client-side credential path) call these functions, and every task's out_of_scope credited them to B013, which only built the two cost key helpers. Build them here so those callers have something to call.


  Put the code in `crates/betterlite-router/src/deployment_pricing.rs` and `deployment_pricing/**`, and move `betterlite-models` from the dev-dependencies to the dependencies of crates/betterlite-router/Cargo.toml. Work on JSON maps, the way B8350 does, so the module needs no deployment type from a task above it: a deployment is its `litellm_params` map and its `model_info` map, both `serde_json::Map<String, Value>`. The caller passes `model_info` the way `ModelInfo.model_dump(exclude_none=True)` gives it, so `id` is set and `db_model` and `member_auto_router` are present as false when the user did not set them. No static and no global: the cost map is B5365's `ModelRegistry`, passed in by `&mut`.


  `PricingInputs` is a small struct the caller fills once: `ptu_cost_attribution: bool` (from `betterlite_config::ptu_pricing::load_ptu_cost_flag`, which reads `LITELLM_ENABLE_PTU_COST_ATTRIBUTION`, default false) and `is_strategy_router: fn(&str) -> bool`. The router crate cannot name B377's `classify_strategy_router_model`, since it lives in betterlite-server, so the caller passes a non-capturing closure that is true when that function returns a kind (a model that starts with `auto_router/`).


  The four inherit steps fill a model info map in place and never overwrite a field that is already non-null. Each looks up the backend model with B2225's `get_model_info(backend_model, custom_llm_provider)`, and any lookup error means no change. `inherit_cache_pricing` (router.py L8799-L8826) copies the five cache fields `cache_creation_input_token_cost`, `cache_creation_input_token_cost_above_1hr`, `cache_creation_input_token_cost_above_200k_tokens`, `cache_read_input_token_cost` and `cache_read_input_token_cost_above_200k_tokens` from the lookup result, and returns at once when all five are set. `inherit_service_tier_pricing` (L8838-L8861) returns when PTU attribution is on and B1664's `ptu_terms` finds terms in the map, or when both `input_cost_per_token` and `output_cost_per_token` are null; otherwise it takes the raw cost map entry under the lookup's `key` and deep-copies every field whose name ends with `_balanced`, `_flex`, `_priority` or `_ultrafast` (LiteLLM's `SERVICE_TIER_COST_KEY_SUFFIXES`). `inherit_base_rates_for_off_peak` (L8863-L8907) runs only when `off_peak_pricing` is truthy and none of `input_cost_per_token`, `input_cost_per_second`, `cost_per_second` and `tiered_pricing` is set, and then deep-copies every non-null field of the raw backend entry. `inherit_tiered_output_rate` (L8909-L8940) runs only when `tiered_pricing` is a non-empty list, `output_cost_per_token` is null and at least one tier is not a map holding `output_cost_per_token`; it copies the lookup's `output_cost_per_token` when that is truthy, so a synthesized 0 never lands.


  `deployment_cost_payload(params, model_info, registry, inputs)` is `_deployment_model_cost_payload` (L10031-L10066): start from a copy of `model_info`, copy every non-null custom pricing field from `params` (the names in B1664's `ptu_pricing::pricing_fields::CUSTOM_PRICING_FIELDS`, LiteLLM's `CustomPricingLiteLLMParams.model_fields`), then run off-peak, cache (only when `input_cost_per_token` is now set), service tier and tiered output, in that order. Off-peak, cache and tiered output look up `params.model`; service tier looks up B013's `cost_map_backend_model`, so a `base_model` decides its tiers. `custom_llm_provider` comes from `params.custom_llm_provider`.


  `register_deployment_in_model_cost(registry, model_id, model_info, model, custom_llm_provider, inputs)` is L10083-L10155. For a strategy router alias, drop every custom pricing field first. When `model_id` is set, call `register_model` with `{model_id: model_info}`, `persist_across_reloads` false and `warning_display_name` set to `model`. Then take B013's `backend_cost_map_keys(model, custom_llm_provider)`, build the shared entry with B5650's `shared_backend_model_info`, and keep the mode the shared key already has when the deployment would turn `responses` into `chat` or would clear it (a deployment with no `mode` while the shared entry has one). Only when the deployment named a different mode, log the warning "Router: preserving existing mode=%s for shared backend key %s instead of the deployment-specified mode=%s (prevents alias registration from downgrading the shared backend mode)." Then call `register_model` once with every backend key mapped to the shared entry and `persist_across_reloads` false. `register_deployment_pricing(registry, params, model_info, inputs)` (L10068-L10081) is the payload followed by that registration.


  `replay_deployment_pricing(registry, deployments, inputs)` is the body of `_replay_model_cost_registrations` (L10157-L10181) after its first step: for each deployment the router still serves, in list order, register its payload again. A deployment whose maps cannot be read (not an object, or `litellm_params.model` missing) logs "Router: could not rebuild cost-map entry for a deployment during a price data reload" at error and the loop goes on. The caller runs the deferred provider-unresolved creations before it (B401 keeps them) and clears the group info cache after it (B846), and hands the whole replay to B5365's `set_live_deployment_replay`, which is what LiteLLM's module-level `_replay_live_router_model_cost` (L700-L713) does with its weak set of live routers.


  Tests go in `deployment_pricing/tests.rs` with names that start with `inherit_`, `payload_`, `register_` and `replay_`. The helper operation for this task takes `deployment` (`model_name`, `litellm_params`, `model_info` with an `id`) and an optional `shared_before` (an entry to place under the backend key first, to test the mode rule). The Python side copies `litellm.model_cost`, writes `shared_before` when given, calls `Router._register_deployment_pricing(Deployment(**deployment))`, reads the entries under the id and under every backend key, and restores the copy. The Rust side does the same with a registry built from the bundled cost map. Both answer `{"by_id": entry or null, "shared": {key: entry}}`. Run the oracle with `LITELLM_LOCAL_MODEL_COST_MAP=True` so both sides read the same map.
