id: B1231
title: Team management request and response contracts
description: >-
  Define typed team/member wire contracts and production decode_team_request, preserving absent, null,
  empty and zero values separately. B859 supplies TeamBase, Member and team/membership/deleted rows;
  B2310 supplies object permissions and B2317 budget_duration_error. B801 owns metadata-validator registry
  and route integration. There are no DB writes, secret encryption or permission checks in these models.


  NewTeamRequest inherits B859 TeamBase defaults and makes whitespace-only team_id None before validation;
  nonblank IDs keep their whitespace. Its added fields all default None: router_settings, model_aliases,
  model_max_budget, tags, guardrails, policies, prompts, object_permission, allowed_passthrough_routes,
  disable_global_guardrails, secret_manager_settings, model_rpm_limit, rpm_limit_type, tpm_limit_type,
  model_tpm_limit, default_estimated_output_tokens, default_estimated_output_tokens_per_model, mcp_rpm_limit,
  team_member_budget, team_member_rpm_limit, team_member_tpm_limit, team_member_key_duration,
  team_member_budget_duration, allowed_vector_store_indexes, enforced_batch_output_expires_after and
  enforced_file_expires_after. rpm/tpm limit types accept only guaranteed_throughput/best_effort_throughput;
  estimated output tokens and per-model values must be positive integers. Router settings are dictionaries
  checked by B008 validate_router_settings_dict, including nested weights. Other unvalidated dictionaries
  and duration strings must not acquire new policy checks here. model_max_budget uses BudgetConfig aliases.


  UpdateTeamRequest requires team_id and does not apply the create-only blank-ID normalization. Every other
  declared field defaults None: team_alias, organization_id, metadata, tpm_limit, rpm_limit, tpd_limit,
  max_budget, soft_budget, models, blocked, budget_duration, tags, model_aliases, guardrails, policies,
  object_permission, disable_global_guardrails, team_member_budget, team_member_budget_duration,
  team_member_rpm_limit, team_member_tpm_limit, team_member_key_duration, allowed_passthrough_routes,
  secret_manager_settings, prompts, model_rpm_limit, model_tpm_limit, default_estimated_output_tokens,
  default_estimated_output_tokens_per_model, mcp_rpm_limit, allowed_vector_store_indexes,
  enforced_batch_output_expires_after, enforced_file_expires_after, router_settings, access_group_ids,
  budget_limits, default_team_member_models and model_max_budget. Preserve fields-set tracking for
  exclude_unset versus exclude_none; reuse the positive-token, router and nested budget/permission types.
  Also own PatchTeamRequest L2284-L2293: inherit UpdateTeamRequest and override only team_id to nullable
  with default None. B2370 checks a supplied ID against the path; this decoder does not infer the path ID.


  Permission get/update requests require team_id; update also requires team_member_permissions. The get
  response requires team_id/all_available_permissions and defaults nullable team_member_permissions to [].
  Bulk permissions require permissions as KeyManagementRoutes values, with team_ids=None and
  apply_to_all_teams=false. Its docstring says mutually exclusive, but there is no model validator enforcing
  that selection; route policy owns it. Response requires message/teams_updated and defaults
  permissions_appended=None. TeamIdSearchMatch accepts exactly exact/prefix. TeamListItem adds
  members_count=0, keys_count=0 and nullable access_group_models/access_group_mcp_server_ids/
  access_group_agent_ids=None. TeamListResponse requires teams (enriched/live/deleted row union), total,
  page, page_size and total_pages; it does not impose positive pagination or compute those values.


  BulkTeamMemberAddRequest requires team_id, defaults members/max_budget_in_team=None and nullable
  all_users=false; this model does not require exactly one selection. Each result requires success, with
  user_id/user_email/error/updated_user/updated_team_membership=None. Its response requires team_id, results,
  total_requested, successful_additions and failed_additions, with updated_team=None. TeamMemberRef inherits
  the missing-both identity error Either user id or user email must be provided; its own validator rejects
  both non-null IDs with Each member must be identified by exactly one of user_id or user_email. Empty
  strings count as identifiers. Extra fields are forbidden on refs, member budget patches, both bulk
  delete/update bodies and metadata field declarations; other owned BaseModel declarations ignore extras.


  Bulk member delete/update bodies require members tuples of length 1..500 inclusive, preserve duplicates
  and order, and use constants MAX_BULK_TEAM_MEMBER_DELETES/MAX_BULK_TEAM_MEMBER_BUDGET_UPDATES=500.
  TeamMemberBudgetPatch adds max_budget_in_team/tpm_limit/rpm_limit/budget_duration/allowed_models=None;
  only budget_duration calls B2317 persistability validation. Missing limits, explicit null, zero and
  allowed_models=[] remain distinguishable; no positivity rule exists for these numeric limits.
  Delete results require success and default user_id/user_email/error=None. Budget-update results also
  default budget_id/max_budget/max_budget_source/tpm_limit/rpm_limit/budget_duration/allowed_models=None,
  with source restricted to member/team_default. Both responses are ResourceResponse {data:[...]} without
  pagination. TeamMemberInfoResponse extends membership with role/user_email/team_alias=None.


  TeamMetadataFieldSchema requires a nonempty key (whitespace counts), label=None and no extra fields;
  TeamMetadataSchemaResponse requires a fields tuple, including empty, rather than supplying a default.
  TeamUserSpendRow requires team_id/user_id, defaults team_alias/user_email/user_alias=None, spend=0.0 and
  prompt_tokens/completion_tokens/total_tokens/api_requests/successful_requests/failed_requests=0.
  TeamUserSpendResponse requires start_date/end_date strings and results tuple; dates are not parsed here.
  Preserve response arrays and nullable fields exactly, with checked Decimal conversions for money.


  Build the production team_request_contracts module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/types/proxy/management_endpoints/team_endpoints.py:
  team_request_contracts (L1-L255; 174 source lines). litellm/proxy/_types.py: NewTeamRequest (L2164-L2210;
  44 source lines), UpdateTeamRequest (L2219-L2281; 61 source lines), PatchTeamRequest (L2284-L2293; 2 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the team_request_contracts operation under B856 Management::teams. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a team-request-contracts-* seed to B171 helper_case, which already owns this decoder.


  This task owns the outside-byte boundary team_request_contracts::decode_team_request(&[u8]) -> Result<TypedValue,DecodeError>
  for team/member management request JSON. Production calls this decoder before its typed policy functions;
  the cargo-fuzz target team_request_contracts calls that same function. Seed valid, truncated, malformed,
  duplicate-field and limit-boundary inputs and add team_request_contracts::tests::replays_the_team_request_contracts_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B770 owns crates/betterlite-server/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 281 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  281 production, 300 contract tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 721 changed lines estimated within a 750-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: request_byte_limit and request_json_depth_limit.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
