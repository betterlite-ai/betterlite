dod:
  - text: 'Named field-table cases cover every declaration/default above through team_create_all_fields,
      create_blank_id_only, team_update_all_fields, patch_optional_team_id, update_absent_null_empty_zero, positive_output_estimates,
      throughput_enum_values, router_weights_validation, budget_config_aliases, permission_request_defaults,
      permission_selection_left_to_route, permission_response_fields, team_id_search_modes,
      list_live_deleted_enriched_union, list_count_defaults, bulk_add_defaults_and_no_selection_validator,
      bulk_add_response_counts, member_identity_missing_both_and_present_both, empty_identifier_accepted,
      forbidden_vs_ignored_extra_fields, bulk_members_one_and_five_hundred, bulk_members_empty_and_over_limit,
      duplicates_and_order_retained, member_budget_patch_presence, member_budget_duration_errors,
      budget_source_enum_and_data_envelope, membership_info_optional_fields, metadata_key_and_required_fields,
      spend_row_zero_defaults and spend_response_unparsed_dates.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The production decode_team_request decoder is used by the service and its fuzz target and rejects
      malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'Native request_byte_limit and request_json_depth_limit assert typed failures above the declared bounds.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_request_contracts::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/team_request_contracts.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/team-request-contracts-*")"
        && grep -rlq "team_request_contracts" tools/oracle/fuzz/corpus/helper_case/team-request-contracts-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/team_request_contracts.rs && grep -q "team_request_contracts"
        crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-server/fuzz/corpus/team_request_contracts)" && cargo nextest run --locked
        -p betterlite-server --no-tests=fail -E 'test(replays_the_team_request_contracts_corpus)'
