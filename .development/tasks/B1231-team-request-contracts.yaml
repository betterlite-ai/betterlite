pitfalls:
  - 'The oracle helper for this task is pre-registered as team_request_contracts in the server group. Replace the stub Op in tools/oracle/src/helpers/server/team_request_contracts.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/team_request_contracts.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Only NewTeamRequest converts whitespace-only team_id to None; the update request retains it.
  - Bulk permission selection exclusivity is documentation, not a validator on this request model.
  - TeamMemberBudgetPatch accepts zero limits and distinguishes an omitted field from explicit null.
