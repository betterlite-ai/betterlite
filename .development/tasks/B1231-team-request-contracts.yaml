id: B1231
title: Team management request and response contracts
description: >-
  Define the complete typed team/member request and response wire contracts, including field declarations,
  absent/null patch states, one-identifier validation, permission operations, member budget windows and
  response paging. decode_team_request(&[u8]) calls serde on the production closed request enum and preserves
  source validation errors. B801 owns metadata-validator registry and policy integration; callers that
  decode these requests depend directly on this contract part, avoiding a dependency on route implementations.


  Build the production team_request_contracts module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/types/proxy/management_endpoints/team_endpoints.py:
  team_request_contracts (L1-L255; 174 source lines). litellm/proxy/_types.py: NewTeamRequest (L2164-L2210;
  44 source lines), UpdateTeamRequest (L2219-L2281; 61 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the team_request_contracts operation under B856 Management::teams. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a team-request-contracts-* seed to B171 helper_case, which already owns this decoder.


  This task owns the outside-byte boundary team_request_contracts::decode_team_request(&[u8]) -> Result<TypedValue,DecodeError>
  for team/member management request JSON. Production calls this decoder before its typed policy functions;
  the cargo-fuzz target team_request_contracts calls that same function. Seed valid, truncated, malformed,
  duplicate-field and limit-boundary inputs and add team_request_contracts::tests::replays_the_team_request_contracts_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B770 owns crates/betterlite-server/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 279 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  279 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 564 changed lines estimated within a 575-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
scope:
  paths:
    - crates/betterlite-server/src/team_request_contracts.rs
    - crates/betterlite-server/src/team_request_contracts/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/src/helpers/team_request_contracts.rs
    - tools/oracle/src/helpers/team_request_contracts/**
    - tools/oracle/helpers/team_request_contracts.py
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/management/teams.rs
    - tools/oracle/helpers/management/teams.py
    - tools/oracle/cases/helpers/team-request-contracts/**
    - tools/oracle/fuzz/corpus/helper_case/team-request-contracts-*
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/team_request_contracts.rs
    - crates/betterlite-server/fuzz/corpus/team_request_contracts/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/management_endpoints/team_endpoints.py#L1-L255
    why: Own team_request_contracts; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2164-L2210
    why: Own NewTeamRequest; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2219-L2281
    why: Own UpdateTeamRequest; preserve caller-visible values and failure ordering.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: team_create_fields,
      team_patch_null, member_one_identifier, member_permission_fields, budget_duration_validation.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The production decode_team_request decoder is used by the service and its fuzz target and rejects
      malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_request_contracts::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/team_request_contracts.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/team-request-contracts-*")"
        && grep -rlq "team_request_contracts" tools/oracle/fuzz/corpus/helper_case/team-request-contracts-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/team_request_contracts.rs && grep -q "team_request_contracts"
        crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-server/fuzz/corpus/team_request_contracts)" && cargo nextest run --locked
        -p betterlite-server --no-tests=fail -E 'test(replays_the_team_request_contracts_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/team-request-contracts/team-create-fields.yaml
  - tools/oracle/cases/helpers/team-request-contracts/team-patch-null.yaml
  - tools/oracle/cases/helpers/team-request-contracts/member-one-identifier.yaml
