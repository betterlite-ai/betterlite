  - tools/oracle/cases/helpers/mcp-connector-import/entry-errors.yaml
  - tools/oracle/cases/helpers/mcp-connector-import/alias-spellings.yaml

deviations:
  - what: submitted_at on NewMCPServerRequest is kept as the raw string and not parsed as a datetime.
    why: The create route always overwrites it, so a parsed value is never read; a malformed value is accepted here where LiteLLM answers 422.
  - what: Rules and the stdio policy are passed in, where LiteLLM reads MCP_TOOL_PREFIX_SEPARATOR, LITELLM_ENABLE_MCP_STDIO and LITELLM_MCP_STDIO_EXTRA_COMMANDS from the environment at call time.
    why: No module-level state or env reads in library code; the mcp_env_values config section reads the same variables once, so a user sees the same behavior until the process restarts.
  - what: The required field list comes from the mcp_required_fields config section, where LiteLLM reads proxy_server.general_settings on every call.
    why: Settings reach this crate as a config section; a change through the config update route takes effect when the section reloads.

out_of_scope:
  - "The routes that call these checks and turn PayloadError into HTTP bodies: B4721 (create, import, update, delete)."
  - "Everything in mcp_management_endpoints.py after line 401: the public registry entries (B4720), temporary servers and draft lookup (B4718), credential redaction and inheritance (B4717), the other routes (B4719 to B4725)."
  - "The rest of mcp_server/utils.py (tool prefixing, short prefixes, allowlist helpers): owners are the MCP tool and registry tasks, not this one."
  - "id_jag_assertion_capture_gap: B1617. The caller passes its result to warn_if_id_jag_server_outruns_sso."
  - "The conflict lookup that produces McpIdentifierConflict: B4711."
  - "MCPServer, the runtime record: B6590."

pitfalls:
  - "Pydantic runs before-validators in reverse order of definition, so a payload that breaks both per_server_oauth_discovery and the stdio rule reports the discovery error."
  - "A payload with no transport key skips the transport checks entirely, so an HTTP-shaped create without transport and without url still passes the before-validators."
  - "stdio checks run gate, command, args, allowed list in that order, and the allowed list is matched on the basename of the command, so /usr/bin/node passes and npx.exe does not."
  - "The display name pattern is ^[a-zA-Z0-9_-]+$ with Python's $, which also matches before one trailing newline, so 'abc\\n' passes. Mirror that, do not tighten it."
  - "Alias normalization runs before validate_tool_name, so a server_name with a space gets an alias with an underscore but still fails the server_name check on the space."
  - "validate_tool_name counts length in characters, and lists each invalid character once in first-seen order."
  - "The unknown required field error is raised before any missing check and as a 500, but an empty mcp_required_fields returns before the unknown check."
  - "Presence in validate_required_fields follows Python types: an empty env dict is present, an empty args list is absent, false and 0 are present, and auth_type 'none' is absent."
  - "AliasChoices selects by key presence, so {\"mcp_servers\": null, \"mcpServers\": {...}} fails on the null instead of falling back."
  - "Only the first Authorization-like header is read, but every header whose lowercase name is authorization is dropped from static_headers."
  - "Bearer detection is case-insensitive on the seven characters 'bearer ', so 'Bearer' alone with no space is an authorization scheme, not bearer_token."
  - "The Unsupported connector type text prints the type as sent, not lowercased, and an empty or missing type is accepted as a URL connector."
  - "A list entry with a name is converted with its raw name in the outcome and only the sanitized name goes into server_name and alias."

review_level: security

