dod:
  - text: Both request models carry LiteLLM's fields and defaults, keep dict key order, and run the before-validators in reverse definition order, with the stdio, dcr_bridge and per_server_oauth_discovery messages exact.
    proof: [request-tests, oracle]
  - text: Update tolerates a missing auth_type or oauth2_flow key where New does not, a missing transport skips the transport checks, and is_per_server_oauth_discovery_eligible matches LiteLLM.
    proof: [request-tests, oracle]
  - text: validate_and_normalize_payload checks the separator, display names, alias defaulting, tool prefix validity and upstream_token_header in LiteLLM's order with exact messages, and validate_tool_name returns LiteLLM's warnings.
    proof: [names-tests, oracle]
  - text: stamp_omitted_oauth2_flow picks client_credentials only for the machine-to-machine shape and never overwrites a sent flow.
    proof: [rules-tests, oracle]
  - text: validate_required_fields fails with the unknown-name error before the missing-name error, treats empty strings, empty lists and auth_type none as absent and empty dicts and false as present.
    proof: [rules-tests]
  - text: The identifier conflict message, the ID-JAG warning and does_mcp_server_exist behave as in LiteLLM.
    proof: [rules-tests, oracle]
  - text: The mcp_required_fields section loads general_settings.mcp_required_fields and defaults to the empty list.
    proof: [config-tests]
  - text: The mcp_env_values section reads the three MCP env variables once, treats an empty string as unset, and returns the parsed separator (default "-") and stdio policy.
    proof: [config-tests]
  - text: Connector requests parse the mapping and list shapes and both alias spellings, picking the first present key, and keep entry order.
    proof: [import-request-tests, oracle]
  - text: Connector conversion sanitizes names, rejects each invalid entry with LiteLLM's text, and maps authorization_token, Authorization headers and stdio entries to the same create payloads.
    proof: [convert-tests, oracle]
  - text: ConnectorImportRequest::from_slice has a cargo-fuzz target whose corpus replays without a panic.
    proof: [import-corpus]
  - text: The oracle helper adapter passes strict Python checks and the new helper cases replay through the shared parser.
    proof: [helper-python, helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: request-tests
      why: the request models, their before-validators or the OrderedMap are missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_payload::request::tests::/)'
    - id: names-tests
      why: the name, prefix, display name or upstream header validation is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_payload::names::tests::/)'
    - id: rules-tests
      why: the oauth2 flow stamp, required fields, conflict message, warning or server lookup is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^server_payload::rules::tests::/)'
    - id: config-tests
      why: the mcp_required_fields or mcp_env_values section is missing or does not load its values
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_required_fields::/)'
    - id: import-request-tests
      why: the connector request parsing, alias choice or ordering is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^connector_import::request::tests::/) - test(/replays_the_/)'
    - id: convert-tests
      why: the connector name sanitizing, entry errors or auth mapping is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^connector_import::convert::tests::/)'
    - id: import-corpus
      why: the connector_import_request fuzz target, its added corpus or its replay test is missing or fails
      run: >-
        test -f crates/betterlite-mcp/fuzz/fuzz_targets/connector_import_request.rs &&
        grep -q connector_import_request crates/betterlite-mcp/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-mcp/fuzz/corpus/connector_import_request)" &&
        cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(replays_the_connector_import_request_corpus)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        git diff --name-only "$GATE_BASE" -- tools/oracle/helpers | grep -q b4716 &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added payload and connector cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-payload-validation-*' 'tools/oracle/fuzz/corpus/helper_case/mcp-connector-import-*')" &&
        grep -lE '^[[:space:]]+b4716:' tools/oracle/fuzz/corpus/helper_case/mcp-payload-validation-* tools/oracle/fuzz/corpus/helper_case/mcp-connector-import-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

