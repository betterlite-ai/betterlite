id: B3975
title: Rubrik moderation payloads and block decisions
description: >-
  Build Rubrik's normalized message and tool-call payloads, correlation
  helpers and refusal/block detection. These are pure payload-building and
  decision functions that live below transport and moderation delivery, preparing
  data for the webhook endpoints and detecting whether the response or prompt
  was blocked.

  Normalize tool calls from streaming chunks, message shapes and ChatCompletion
  objects into ChatCompletionMessageToolCall. Preserve tool-ID multiplicity
  (Counter catches duplicates). Flatten message content parts, including
  Anthropic-style content arrays, for the webhook. Extract all text segments
  including tool-call arguments. Build the OpenAI-format payloads the webhooks
  consume: response moderation takes the assistant's text and tool calls,
  prompt moderation takes the full request.

  Detect blocks by diffing what was sent against what came back: tool-block
  when a tool call is missing (cardinality or count), text-block when content
  was replaced wholesale (not appended). The webhook appends explanations with
  `original + "\n\n"` separator; detect this to distinguish replacement from
  append. Use Counter to handle duplicate tool call IDs correctly. Return None
  when nothing was blocked, a BlockedResponseResult with explanation otherwise.
  Extract prompt refusals from the webhook's synthetic chat.completion response.

  Manage correlation IDs so moderation logs (blocking, response/failure) are
  joined by shared filenames. Use litellm_call_id throughout; it is assigned
  at request start and immune to races with response object population.
  Prepend system prompts onto block payloads using a new messages list (never
  mutating the source), handling dict/list/str message shapes and tolerating
  errors with a warning.

