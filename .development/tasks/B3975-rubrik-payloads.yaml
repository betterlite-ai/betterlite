dod:
  - text: _normalize_tool_calls and _normalize_tool_call convert ChatCompletionToolCallChunk, ChatCompletionMessageToolCall, dict and protocol-object tool calls to ChatCompletionMessageToolCall tuples, raising TypeError for unrecognized shapes.
    proof: [rubrik-payload-tests]
  - text: _join_texts concatenates response text segments with newlines, returning empty string when no segments.
    proof: [rubrik-payload-tests]
  - text: _build_response_moderation_payload constructs an OpenAI chat.completion dict with the joined content, tool calls (model_dump with exclude_none), finish_reason (tool_calls or stop), id falls back to f"chatcmpl-{uuid.uuid4()}" when request_id is None (rubrik.py:564), and model is always the literal empty string, never the real model name (rubrik.py:567).
    proof: [rubrik-payload-tests]
  - text: _flatten_messages_for_moderation builds a tuple of dicts with role and newline-joined text parts for each dict message, converting content arrays via B218's convert_content_list_to_str.
    proof: [rubrik-payload-tests]
  - text: _moderation_text_parts returns a tuple of all text segments coerced to str, including message content, tool call arguments and deprecated function_call arguments.
    proof: [rubrik-payload-tests]
  - text: _build_prompt_moderation_payload builds a bare OpenAI request dict with model, flattened messages, optional tools (when non-None), optional user, and correlation_key (fallback to litellm_call_id).
    proof: [rubrik-payload-tests]
  - text: _extract_request_data returns a dict with messages, model and tools from call_details/optional_params or request_data (never forwarding proxy_server_request body).
    proof: [rubrik-payload-tests]
  - text: _resolve_model returns response.model (if response exists and has model attr) or call_details.get(model, unknown), never None.
    proof: [rubrik-payload-tests]
  - text: _correlation_id returns litellm_call_id from call_details or request_data (in that order), returning None if missing.
    proof: [rubrik-payload-tests]
  - text: _apply_correlation_id overwrites payload["id"] with the correlation ID in place when present, leaving it unchanged when None.
    proof: [rubrik-payload-tests]
  - text: _prepend_system_prompt builds a new messages list with system scaffold at head and original messages, tolerates shape mismatches with warnings, and is a no-op when system is absent.
    proof: [rubrik-payload-tests]
  - text: _extract_prompt_refusal returns message content from choices[0].message when choices is non-empty, returns None on passthrough (empty choices).
    proof: [rubrik-payload-tests]
  - text: _extract_response_block detects text block when returned_content differs from sent_content and is not an append (does not start with sent_content + "\n\n"), and returns BlockedResponseResult with the explanation or "Response blocked by policy." when returned_content is empty (rubrik.py:1236).
    proof: [rubrik-payload-tests]
  - text: _extract_response_block detects tool block when cardinality or count of returned tool call IDs differs from sent (using Counter to preserve ID multiplicity), and returns BlockedResponseResult with appended explanation or "Tool call blocked by policy." when the appended explanation is empty (rubrik.py:1245).
    proof: [rubrik-payload-tests]
  - text: _extract_response_block returns None when no text and no tool calls are blocked, raises _MalformedToolBlockingResponseError when choices is empty.
    proof: [rubrik-payload-tests]
  - text: _extract_response_block correctly extracts appended tool-block explanation (returned_content minus the original text and leading newlines) for reconstruction.
    proof: [rubrik-payload-tests]

checks:
  optional: []
  commands:
    - id: rubrik-payload-tests
      why: the rubrik payload and block-detection tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^rubrik_payloads::/)'

oracle_cases: []

deviations:
  - what: _sanitize_proxy_server_request is not built; _extract_request_data no longer forwards proxy_server_request after the pin and the function is dead code.
    why: The source function filters the proxy_server_request after the LiteLLM version at the pin; betterlite skips it entirely for security.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L684-L692

out_of_scope:
  - Rubrik's logger constructor and configuration (handled by B3976).
  - Transport layer POST to webhook endpoints (handled by B3976).
  - Moderation hook wiring and request/response guardrail dispatch (handled by B3978).
  - Logging queue insertion and delivery (handled by B3977).
  - ModifyResponseException construction and exception handling (owned by framework layer not yet assigned).

pitfalls:
  - _normalize_tool_call type-checks for ChatCompletionMessageToolCall first, so subclass checks never run; dicts must use isinstance(tc, dict) before falling through to protocol.
  - _extract_response_block uses Counter to preserve tool-ID multiplicity; set-based checks miss duplicate-ID attacks where one occurrence is silently removed by the service.
  - _extract_response_block distinguishes text replacement from tool-block append via the `\n\n` separator; without it, a replacement like "Hello, blocked." where original was "Hello" passes through as an append.
  - _flatten_messages_for_moderation filters to dict messages only; other types (None, str, list) are skipped, matching the webhook's string-only content expectation.
  - _moderation_text_parts safely coerces all segments to str, handling missing/None attributes; the signature promises a tuple even when a segment is falsy.
  - _prepend_system_prompt builds a new messages list by tuple unpacking; mutating the copy never affects the shared source dict.
  - _apply_correlation_id mutates payload["id"] in place on a deep-copied dict; the copy ensures source objects are not modified.
  - _extract_prompt_refusal returns a default "Request blocked by policy." when content is missing/None, matching webhook behavior.
  - _extract_response_block returns BlockedResponseResult with explanation (possibly empty) that callers must handle; the None state means no block.
  - Prompt payload construction omits correlation_key when it resolves to empty string; the webhook skips the S3 write when key is absent.

