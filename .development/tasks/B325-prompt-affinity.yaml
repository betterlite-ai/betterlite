id: B325
title: Prompt cache prefix affinity
description: 'Add the prompt-caching optional check using B304 state and B013 token counts. Canonicalize
  the typed messages and cache-control boundaries into bounded prefix digests, look up eligible deployment
  pins, and record successful selections. Use B010''s structured-message normalization for native request
  forms rather than creating a new request parser. The cache stores routing affinity only and never caches
  full model responses. Configuration boundary keys introduced or consumed here: optional_pre_call_checks.
  Pinned declaration defaults: optional_pre_call_checks=None. Resolve env values once in betterlite-config,
  never in router code. Implement the owned native service in crates/betterlite-router/src/prompt_affinity.rs.
  Add ProbeOperation::PromptAffinity in tools/oracle/src/router_probes/mod.rs and the corresponding B325 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_utils/pre_call_checks/prompt_caching_deployment_check.py:
  _get_min_token_count_for_deployments (L26-L48), PromptCachingDeploymentCheck.__init__ (L52-L55), PromptCachingDeploymentCheck.async_filter_deployments
  (L57-L112), PromptCachingDeploymentCheck.async_log_success_event (L114-L161). Implement these behaviors
  through the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. Function coverage in litellm/router_utils/prompt_caching_cache.py: _sorted_pairs
  (L51-L52), _canonical_bytes (L55-L56), _block_unit (L59-L67), _message_units (L70-L78), _chain_digest
  (L81-L82), _seed (L85-L92), _positions_of (L95-L108), _lookback_keys (L111-L115), _pinned_value (L118-L122),
  _first_pin (L125-L128), PromptCachingCache.__init__ (L132-L133), PromptCachingCache.extract_cacheable_prefix
  (L136-L222), PromptCachingCache.prefix_positions (L225-L253), PromptCachingCache.async_prefix_positions
  (L256-L262), PromptCachingCache.get_prompt_caching_cache_key (L265-L270), PromptCachingCache.add_model_id
  (L272-L282), PromptCachingCache.async_add_model_id (L284-L298), PromptCachingCache.async_get_model_id
  (L300-L320), PromptCachingCache.get_model_id (L322-L337). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports.'
