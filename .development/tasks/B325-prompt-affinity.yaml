- tools/oracle/cases/routing/prompt-affinity/success-records-pin.yaml
deviations: []
out_of_scope:
- Response caching (B125).
- Cache-aware cost prediction (B337).
pitfalls:
- Include all content before the last cacheable block, not only annotated blocks.
- A cache hint never authorizes access to another caller's deployment.
- Bound prefix work and retain no raw prompt text in cache keys or logs.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
