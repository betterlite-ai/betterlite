  why: Token threshold, cache hit filtering and success write.
dod:
- text: Write tests named prompt_affinity_behaviors and prompt_affinity_boundaries under prompt_affinity::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - prompt-affinity-behaviors
  - prompt-affinity-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/prompt-affinity-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/prompt-affinity-invalid.yaml;
    the valid seed contains optional_pre_call_checks. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - prompt-affinity-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: prompt-affinity-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::prompt_affinity_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: prompt-affinity-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::prompt_affinity_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/prompt_affinity.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/prompt_affinity.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/prompt-affinity-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/prompt-affinity-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/prompt-affinity-" && grep -Fq 'optional_pre_call_checks' crates/betterlite-config/fuzz/corpus/config_yaml/prompt-affinity-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/routing/prompt-affinity/last-ephemeral-block.yaml
- tools/oracle/cases/routing/prompt-affinity/message-level-cache-control.yaml
- tools/oracle/cases/routing/prompt-affinity/no-cacheable-prefix.yaml
- tools/oracle/cases/routing/prompt-affinity/canonical-key-order.yaml
- tools/oracle/cases/routing/prompt-affinity/lookback-prefix.yaml
