id: B3503
title: Send managed-agent deletion and version-list requests
description: >-
  Build the outbound HTTP calls that delete an agent and list an agent's versions, in the new module betterlite_http::interactions::agents_delete_versions (crates/betterlite-http/src/interactions/agents_delete_versions.rs).
  LiteLLM's AgentsHTTPHandler has six request methods; this task owns delete_agent and list_agent_versions, each with a sync and an async form. Create, list and get belong to B3502, which built them in its own module agents_create_read. Do not touch that module.
  The Rust form has no _is_async switch. Write one blocking function and one async function per operation (delete_agent and async_delete_agent, list_agent_versions and async_list_agent_versions). Client resolution comes from B3492's base module: the blocking form calls its sync client resolver, the async form calls its async client resolver, and both pass the optional caller-supplied client first. Error conversion also comes from B3492's handle_error, called with the agents config; never rebuild either here.
  All four functions take the agents config (B1392's Studio agent config, behind the same trait B3501 selects), the agent name, the litellm params, the logging object, optional extra headers and an optional timeout.
  Delete flow: headers = config.validate_environment(extra headers or an empty map, params); url = config.transform_delete_request(name, params.api_base, params); pre_call with input = name, api_key = "" and additional_args holding only api_base = url and headers; send DELETE to url with headers and timeout = the caller's timeout, or the global request_timeout (REQUEST_TIMEOUT env var, default 6000 seconds, owned by B198) when the caller gave none; any error goes through handle_error with the agents config and is returned as that value; on success post_call with original_response = the response text and empty additional_args, then return config.transform_delete_response(response, name).
  List-versions flow: headers as above; (url, params) = config.transform_list_versions_request(name, params.api_base, params); pre_call exactly as in delete (input = name, additional_args api_base and headers); GET url with headers and the query params and no timeout, so the client default applies and the timeout argument is accepted and ignored; errors through handle_error; post_call with the response text and empty additional_args; return config.transform_list_versions_response(response, name).
  The call order inside each function is fixed: resolve the client first, then validate_environment, then URL building, then pre_call, then the request. A failing validate_environment therefore still creates the client and never logs.
  LiteLLM ends the file with a module-level agents_http_handler = AgentsHTTPHandler() that B3504 and B3505 import. betterlite has no module-level state and AgentsHTTPHandler holds none, so this task builds no static and no wrapper type. B3504 and B3505 call the free functions of agents_create_read (B3502) and agents_delete_versions (this task) directly.
  The module is a thin transport layer. It does not pick the provider (B3501), build URLs or parse responses (B1392), or create the logging object (B3501). It must not call a provider crate directly; it sees only the config trait object.
