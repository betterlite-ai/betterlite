dod:
  - text: delete_agent and async_delete_agent build headers and URL through the config, send DELETE with the caller's timeout or the 6000 second request_timeout default, and return the config's transformed delete response with the name.
    proof: [agent-delete-tests]
  - text: Delete logs pre_call with the name as input, an empty api_key and additional_args holding api_base and headers, and post_call with the response text and empty additional_args.
    proof: [agent-delete-tests]
  - text: list_agent_versions and async_list_agent_versions GET the URL and query params from transform_list_versions_request with no timeout, log the name as input with api_base and headers, and return transform_list_versions_response with the name.
    proof: [agent-versions-tests]
  - text: A transport status error in any of the four functions is converted by handle_error with the agents config, and no post_call is logged for it.
    proof: [agent-delete-tests, agent-versions-tests]
  - text: A caller-supplied client is used as is, and without one the sync form resolves a sync client and the async form an async client, both through B3492's base module.
    proof: [agent-delete-client-tests]
checks:
  optional: []
  commands:
    - id: agent-delete-tests
      why: delete_agent or async_delete_agent use the wrong timeout, log the wrong fields, skip error conversion or drop the name from the response transform
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^interactions::agents_delete_versions::delete_/)'
    - id: agent-versions-tests
      why: list_agent_versions or async_list_agent_versions send a timeout, drop the query params, log the wrong fields or skip error conversion
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^interactions::agents_delete_versions::versions_/)'
    - id: agent-delete-client-tests
      why: the four functions do not use the supplied client or do not resolve one through B3492's base module
      run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^interactions::agents_delete_versions::client_/)'
oracle_cases: []
deviations:
  - what: Each operation is a blocking function plus an async function, with no _is_async flag and no function that returns either a value or a coroutine.
    why: Rust has no dynamic return type of that kind; B3504 and B3505 pick the form from the caller's adelete_agent or alist_agent_versions flag.
  - what: There is no agents_http_handler singleton and no AgentsHTTPHandler type; callers use the free functions of the two modules.
    why: The class holds no state, and the rules forbid module-level state and one-line wrappers. B3502's note gave this singleton to B3503, so the architect should confirm.
  - what: The async functions accept an optional async client, which LiteLLM's dispatcher never forwards.
    why: LiteLLM's async_* methods already have a client parameter, and the dispatcher drops it only by omission; no caller at the pin supplies one, so a direct async call keeps the parameter.
out_of_scope:
  - "create_agent, async_create_agent, list_agents, async_list_agents, get_agent and async_get_agent: B3502 owns them in agents_create_read."
  - "Provider selection, header merging and the logging object: B3501."
  - "The transform_delete_*, transform_list_versions_* methods, validate_environment and get_complete_url bodies: B1392."
  - "_handle_error, _sync_client and _async_client: B3492."
  - "The public delete_agent and list_agent_versions entry points that read adelete_agent and alist_agent_versions from kwargs: B3505."
pitfalls:
  - Delete sends timeout or request_timeout, but list_agent_versions calls GET with url, headers and params only, so a timeout argument there has no effect.
  - Both operations log pre_call with additional_args {api_base, headers} and the agent name as input; unlike create, there is no complete_input_dict.
  - post_call carries an empty additional_args for both operations; do not add the URL or headers there.
  - transform_delete_request returns only a URL, but transform_list_versions_request returns a (url, params) pair; do not mix them up.
  - transform_delete_response and transform_list_versions_response both get the name as a second argument; losing it changes the returned id.
  - validate_environment gets headers = extra_headers or {}, so None and an empty map behave the same.
  - The error from a failed request is returned through handle_error, which only converts httpx HTTPStatusError; connection and timeout errors pass through unchanged.
  - LiteLLM's _is_async dispatcher calls the async method without the client argument, so a sync client given to delete_agent is never used on the async path.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
