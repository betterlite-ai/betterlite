id: B1016
title: Managed resource ids
description: >-
  Implement bounded unified resource ID generation/parsing with typed resource kind, UUID, target model list and
  provider mapping. Preserve native passthrough IDs, base64 detection and legacy encodings without treating decoded
  fields as proof of ownership.


  Legacy unified ids encode litellm_proxy:<type>;unified_id,<uuid>;target_model_names,<a,b>;resource_id,<id>;model_id,<id>
  using urlsafe base64 with stripped padding. The detector requires litellm_proxy:; it does not recognize batch
  ids beginning litellm_proxy;. BaseManagedResource.generate_unified_resource_id/extract_model_mappings_from_responses
  have no MIT subclass/caller and are excluded rather than inventing a concrete hook.


  Implement crates/betterlite-core/src/api/managed_resource_ids.rs. Use ManagedResourceIdsInput and ManagedResourceIdsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions unified_file_id, resource_type_extraction, native_id_pass_through,
  malformed_base64, target_model_list under api::managed_resource_ids::tests. Each named function drives production
  code and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name
  replays_corpus.


  The production external-byte decoder is betterlite-core::api::managed_resource_ids::decode_managed_resource_ids(bytes:
  &[u8], limits: &ApiLimits), for base64.urlsafe_b64decode input padded at litellm/llms/base_llm/managed_resources/utils.py:65;
  base64.urlsafe_b64decode input padded at litellm/llms/base_llm/managed_resources/utils.py:345. Place its implementation
  in crates/betterlite-core/src/api/managed_resource_ids.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-core/fuzz/fuzz_targets/managed_resource_ids.rs passes arbitrary bounded bytes to that
  exact decoder; api::managed_resource_ids::tests::replays_corpus replays newly committed seeds through the same
  function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ManagedResourceIds in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {managed_resource_ids: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/managed_resources/utils.py: resolve_passthrough_managed_id_provider
  (L15-L39); litellm/llms/base_llm/managed_resources/utils.py: is_base64_encoded_unified_id (L42-L71); litellm/llms/base_llm/managed_resources/utils.py:
  extract_target_model_names_from_unified_id (L74-L108); litellm/llms/base_llm/managed_resources/utils.py: extract_resource_type_from_unified_id
  (L111-L144); litellm/llms/base_llm/managed_resources/utils.py: extract_unified_uuid_from_unified_id (L147-L180);
  litellm/llms/base_llm/managed_resources/utils.py: extract_model_id_from_unified_id (L183-L222); litellm/llms/base_llm/managed_resources/utils.py:
  extract_provider_resource_id_from_unified_id (L225-L265); litellm/llms/base_llm/managed_resources/utils.py: generate_unified_id_string
  (L268-L314); litellm/llms/base_llm/managed_resources/utils.py: encode_unified_id (L317-L327); litellm/llms/base_llm/managed_resources/utils.py:
  decode_unified_id (L330-L353); litellm/llms/base_llm/managed_resources/utils.py: parse_unified_id (L356-L395).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 160 owned nonblank/non-comment/non-docstring Python lines (285 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 180 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 490 total within the 490-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1087 (Api boundaries). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
