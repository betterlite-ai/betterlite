id: B1016
title: Managed resource id readers
description: >-
  Implement the live managed_resources/utils.py readers in betterlite-core::api::managed_resource_ids:
  resolve_passthrough_managed_id_provider, is_base64_encoded_unified_id, the five extract_* functions,
  decode_unified_id and parse_unified_id. Decode URL-safe base64 with restored padding and Python's
  permissive alphabet handling, then UTF-8. Detection returns the decoded string or false, while
  decode returns a string or null. parse accepts either an encoded id or raw litellm_proxy: text.
  These ids supply routing hints, never ownership proof. There is no setting or environment lookup.

  Add decode_managed_resource_ids(bytes, limits) at the production boundary, a cargo-fuzz target of
  the same name and replays_corpus in the adjacent tests module. Reuse B1087 input limits. Keep
  individual extractors' permissive regex behavior: only model_id is anchored at a field boundary;
  other fields may be found inside otherwise unrecognized raw text. No UUID validation is implied.
  Register B171's managed_resource_ids helper operation with typed operation/input/output records;
  Python invokes the actual functions and Rust invokes this module. Use local test base64 encoding
  to construct inputs; the unused public generation helpers are not production work.

  The owned spans have 228 nonblank, non-comment physical lines, largely docstrings. Budget 165
  implementation, 130 native assertions, 110 cases, 80 adapters, 55 fuzz/replay and 30 wiring lines,
  570 total. Source guards for non-string Python input belong in the typed SDK boundary tests too.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/managed_resource_ids.rs
  - crates/betterlite-core/src/api/managed_resource_ids/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/managed_resource_ids.rs
  - crates/betterlite-core/fuzz/corpus/managed_resource_ids/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/managed_resource_ids.rs
  - tools/oracle/src/helpers/core_ops/managed_resource_ids/**
  - tools/oracle/helpers/managed_resource_ids.py
  - tools/oracle/helpers/managed_resource_ids/**
  - tools/oracle/fuzz/corpus/helper_case/managed_resource_ids-*
  - tools/oracle/cases/helpers/managed-resource-ids/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/managed_resources/utils.py#L12-L265
  why: Owns provider scope normalization, encoded-prefix detection and field extraction, including model_id anchoring.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/managed_resources/utils.py#L330-L395
  why: Owns nullable decoding and parse_unified_id's five-field projection with raw-text fallback.
dod:
- text: >-
    provider_namespace supplies null, "", OPENAI, LlmProviders.openai, AZURE_AI, x.azure and
    openai_compatible. Results are null, null, openai, openai, azure, azure and null; azure also
    maps to azure, x.azure_ai to azure and x.openai to openai. No upstream URL influences the result.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    encoded_prefix_detection encodes litellm_proxy:file;unified_id,u as padded and unpadded URL-safe
    base64 and expects the decoded text from detection and decoding. Encoding litellm_proxy;file
    gives false/null with the default prefix; detection with prefix=litellm_proxy; succeeds, while
    decode still returns null. Raw file-1, invalid UTF-8 base64 /w== and malformed A give false/null.
    An ignorable nonalphabet character inserted into a correctly padded encoding follows Python's
    urlsafe_b64decode result rather than a strict-alphabet rejection; include whitespace and !.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    unified_field_projection parses raw and encoded
    litellm_proxy:vector_store;unified_id,u;target_model_names,a, b,,a;resource_id,vs_1;model_id,m
    into resource_type=vector_store, unified_uuid=u, target_model_names=[a,b,"",a],
    provider_resource_id=vs_1 and model_id=m. Spaces around captured fields are stripped. A bare
    litellm_proxy: parses with all scalar fields null and target_model_names=[]; file-1 parses null.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    field_precedence supplies resource_id,r;vector_store_id,v;file_id,f and expects r regardless
    of field order; removing resource_id yields v, removing that yields f. Repeated fields use
    the first regex match. llm_output_file_model_id,deploy does not yield a model_id, while
    ;model_id,m does. An empty field followed by ; is absent. Unanchored target_model_names and
    unified_id extraction from arbitrary raw prefixes remains accepted; parse rejects that prefix.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    nonstring_inputs passes null and an integer through the helper's typed Python-input union:
    detection=false, targets=[], scalar extractors=null and parse=null, with no exception or log.
  proof: [behavior-tests, oracle, helper-python]
- text: Production base64/UTF-8 decoding is fuzzed with malformed, padded, duplicate-field and nonalphabet seeds.
  proof: [parser-corpus, helper-corpus]
- text: Fresh id-reader fixtures and both independently checked adapters are present.
  proof: [new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the id readers have only replay tests or no branch assertions
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::/) - test(/::replays_corpus$/)'
  - id: parser-corpus
    why: the production id decoder is not exercised by a new fuzz corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/managed_resource_ids)" && grep -qF decode_managed_resource_ids crates/betterlite-core/fuzz/fuzz_targets/managed_resource_ids.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::replays_corpus$/)'
  - id: helper-python
    why: the managed-id reader adapter is absent or invalid
    run: test -f tools/oracle/helpers/managed_resource_ids.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: no managed_resource_ids tag was added to the shared helper decoder corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/managed_resource_ids-*)" && grep -qE '^[[:space:]]+managed_resource_ids:' tools/oracle/fuzz/corpus/helper_case/managed_resource_ids-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: new id behavior has no differential scenarios
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/managed-resource-ids)"
oracle_cases:
- tools/oracle/cases/helpers/managed-resource-ids/provider-namespace.yaml
- tools/oracle/cases/helpers/managed-resource-ids/encoded-prefix-detection.yaml
- tools/oracle/cases/helpers/managed-resource-ids/unified-field-projection.yaml
- tools/oracle/cases/helpers/managed-resource-ids/field-precedence.yaml
- tools/oracle/cases/helpers/managed-resource-ids/nonstring-inputs.yaml
deviations: []
out_of_scope:
- generate_unified_id_string and encode_unified_id in utils.py have no caller at the pin, apart from documentation and exports; do not add minting cases.
- All protocols and methods in base_managed_resource.py have no MIT subclass/caller at the pin; B1018 documents the absent enterprise lifecycle.
- B1019 owns the separate file/batch id format in openai_files_endpoints/common_utils.py.
pitfalls:
- 'The oracle helper for this task is pre-registered as managed_resource_ids in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/managed_resource_ids.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/managed_resource_ids.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  litellm_proxy; batch encodings do not pass this reader's litellm_proxy: default prefix.
- Regex model_id must not substring-match llm_output_file_model_id, or a deployment UUID becomes an authorization model.
- Successful parsing is possible with missing fields and duplicate target names; adding schema validation here rejects accepted legacy ids.
review_level: security
budget:
  max_changed_lines: 570
  max_new_expects: 0
