checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::/)
      - test(/::replays_corpus$/)'
  - id: case-unified-file-id
    why: the unified-file-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::unified_file_id($|::)/)'
  - id: case-resource-type-extraction
    why: the resource-type-extraction behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::resource_type_extraction($|::)/)'
  - id: case-native-id-pass-through
    why: the native-id-pass-through behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::native_id_pass_through($|::)/)'
  - id: case-malformed-base64
    why: the malformed-base64 behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::malformed_base64($|::)/)'
  - id: case-target-model-list
    why: the target-model-list behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::target_model_list($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/managed_resource_ids)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/managed_resource_ids.rs && grep -qF "decode_managed_resource_ids"
      crates/betterlite-core/fuzz/fuzz_targets/managed_resource_ids.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::managed_resource_ids::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/managed_resource_ids.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/managed_resource_ids-*)"
      && grep -qE "^[[:space:]]+managed_resource_ids:" tools/oracle/fuzz/corpus/helper_case/managed_resource_ids-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/managed-resource-ids)"
