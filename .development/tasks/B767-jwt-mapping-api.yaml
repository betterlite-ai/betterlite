checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^jwt_mapping_api::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/jwt_mapping_api::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/jwt_mapping_api::tests::postgres_failure_effects$/)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-server/fuzz/fuzz_targets/jwt_mapping_api.rs && grep -q "jwt_mapping_api"
        crates/betterlite-server/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-server/fuzz/corpus/jwt_mapping_api)" && cargo nextest run --locked -p betterlite-server
        --no-tests=fail -E 'test(replays_the_jwt_mapping_api_corpus)'
