id: B767
title: JWT key mapping management routes
description: >-
  Add typed JWT mapping create/update/delete/list/info routes behind shared administrator policy. Use
  issuer+claim identity and validate the referenced key hash; update/remove both old and new cache identities
  after each individual write commits. Responses omit both plaintext keys and token hashes.
  B2314 provides hash_token and user_api_key_has_admin_view (imported as _user_has_admin_view),
  B726 provides JWTKeyMappingRepository, B738 supplies jwt_key_mapping_cache_key, and B878
  evict_and_broadcast performs the post-write cache operation.

  create_key_or_hash requires exactly one non-null key/token; update_key_or_hash allows neither
  but rejects both. hash_lower_hex rejects anything outside exactly 64 lowercase hex characters
  with HTTP 400; plaintext_key_hashed hashes the supplied key exactly once. Nullable request
  fields default None; create requires jwt_claim_name and jwt_claim_value, update/delete require
  id. No claim rename fields exist on UpdateJWTKeyMappingRequest. create_global_issuer stores
  null/empty issuer as '', records created_by=updated_by=caller.user_id and omits description
  unless non-null. response_redacts_hash includes all ten response fields, mapping '' back to null.

  update_unset_vs_null uses exclude_unset, excludes id/key/token, normalizes explicit issuer null
  to '', permits explicit description null and writes updated_by even on an empty patch.
  update_invalidates_old reads old row, updates, then evicts old/new identities once each; same
  identity is evicted once. delete_mapping reads, deletes, evicts and returns {status: success}.
  postgres_failure_effects proves a write remains after a later eviction failure. There is no
  multi-write transaction. Unknown keys are rejected by the DB foreign key, not a preflight read.

  mutations_admin_only rejects admin-viewers and ordinary callers with 403; read_admin_viewer
  allows both admin roles for info/list. database_disconnected gives 500 before DB operations.
  create_duplicate and update_duplicate map 'unique'/'p2002' to 409; create_foreign_key and
  update_foreign_key map 'foreign'/'p2003' to 400. update_missing, update_result_missing,
  delete_missing and info_missing give 404. create_failure, update_failure, delete_failure,
  list_failure and info_failure give their operation-specific 500 details; HTTPException passes
  through. These route-owned except blocks return FastAPI {detail: ...}, with no error.type,
  error.param or error.code. The B052 auth middleware can fail earlier with its own envelope.
  Compare the shape and status, ignoring /detail only for betterlite's diagnostic wording.

  list_defaults uses page=1, size=50, ordered created_at desc; page_minimum and size_bounds
  reject page<1 or size outside 1..100 with framework 422. list_empty has total_pages=0;
  list_partial_page uses ceiling division, current_page and total_count. missing_info_id and
  malformed_mapping_body exercise required-field 422. No invented invalid-target case for list.


  Build the production jwt_mapping_api module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/jwt_key_mapping_endpoints.py:
  _validated_token_hash (L28-L38; 11 source lines), _token_hash_for_create (L49-L57; 9 source lines),
  _token_hash_for_update (L60-L68; 9 source lines), _JWTKeyMappingRecord.id (L75-L75; 1 source lines),
  _JWTKeyMappingRecord.jwt_issuer (L78-L78; 1 source lines), _JWTKeyMappingRecord.jwt_claim_name (L81-L81;
  1 source lines), _JWTKeyMappingRecord.jwt_claim_value (L84-L84; 1 source lines), _JWTKeyMappingRecord.description
  (L87-L87; 1 source lines), _JWTKeyMappingRecord.is_active (L90-L90; 1 source lines), _JWTKeyMappingRecord.created_at
  (L93-L93; 1 source lines), _JWTKeyMappingRecord.updated_at (L96-L96; 1 source lines), _JWTKeyMappingRecord.created_by
  (L99-L99; 1 source lines), _JWTKeyMappingRecord.updated_by (L102-L102; 1 source lines), _JWTKeyMappingTable.create
  (L108-L108; 1 source lines), _JWTKeyMappingTable.find_unique (L110-L110; 1 source lines), _JWTKeyMappingTable.update
  (L112-L112; 1 source lines), _JWTKeyMappingTable.delete (L114-L114; 1 source lines), _JWTKeyMappingTable.find_many
  (L116-L116; 1 source lines), _JWTKeyMappingTable.count (L118-L118; 1 source lines), _mapping_table (L121-L123;
  3 source lines), _to_response (L126-L139; 14 source lines), create_jwt_key_mapping (L147-L195; 43 source
  lines), update_jwt_key_mapping (L203-L263; 47 source lines), delete_jwt_key_mapping (L267-L298; 23 source
  lines), list_jwt_key_mappings (L305-L336; 28 source lines), info_jwt_key_mapping (L344-L365; 18 source
  lines). litellm/proxy/_types.py: CreateJWTKeyMappingRequest (L4908-L4914; 7 source lines), UpdateJWTKeyMappingRequest
  (L4917-L4923; 7 source lines), DeleteJWTKeyMappingRequest (L4926-L4927; 2 source lines), JWTKeyMappingResponse
  (L4930-L4940; 11 source lines).


  Register these actual HTTP routes and aliases exactly once: POST /jwt/key/mapping/new -> create_jwt_key_mapping;
  POST /jwt/key/mapping/update -> update_jwt_key_mapping; POST /jwt/key/mapping/delete -> delete_jwt_key_mapping;
  GET /jwt/key/mapping/list -> list_jwt_key_mappings; GET /jwt/key/mapping/info -> info_jwt_key_mapping.
  Send the named mapping cases through B001 HttpCase against both booted servers. Check JSON
  content-type and the exact response fields; these routes set no cookie, redirect or changed-by
  header. Keep partial database writes visible to the Postgres assertions.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This task owns the outside-byte boundary jwt_mapping_api::decode_jwt_mapping_request(&[u8]) -> Result<TypedValue,DecodeError>
  for mapping HTTP request JSON and token hash syntax. Production calls this decoder before its typed
  policy functions; the cargo-fuzz target jwt_mapping_api calls that same function. Seed valid, truncated,
  malformed, duplicate-field and limit-boundary inputs and add jwt_mapping_api::tests::replays_the_jwt_mapping_api_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B770 owns crates/betterlite-server/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 248 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  248 production, 320 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 45 decoder/fuzz
  and 0 config lines, 678 changed lines estimated within a 725-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: mapping_body_limits.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. This route is not assigned a management effects
  decorator unless its owned source function has one.
