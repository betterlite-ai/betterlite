id: B998
title: Image generation call
description: >-
  Implement configured image generation through B010/B014, preserving model resolution, response_format, n/size/quality/style/user
  and provider passthrough fields. Reuse provider transforms from B024 and other M3 tasks; return typed image objects,
  revised_prompt and exact usage rather than decoding provider image bytes. B046 consumes this family's base contract
  and adds its provider-specific executable variants later; keep the generic prepared-call seam independent of those
  downstream adapters.


  The source image_generation function is factored at provider execution: B1121 returns ImageGenerationPlan; B998
  executes it. Synchronous and asynchronous wrappers share the plan, with no back-call into B998 during preparation.


  Implement crates/betterlite-core/src/api/image_generation_call.rs. Use ImageGenerationCallInput and ImageGenerationCallResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions generation_url_result, generation_base64_result, revised_prompt, provider_error
  under api::image_generation_call::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.api_base
  defaults to None. No environment reads occur outside betterlite-config. Test api::image_generation_call::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ImageGenerationCall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {image_generation_call: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/images/main.py: aimage_generation (L80-L129); litellm/images/main.py: image_generation
  (L136-L154); litellm/images/main.py: image_generation (L160-L178); litellm/images/main.py: image_generation (L366-L561).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 246 owned nonblank/non-comment/non-docstring Python lines (254 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 266 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 531 total within the 540-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B014 (Call dispatch
  across providers and call types, shared settings and helpers), B171 (Direct helper oracle and URL path encoding),
  B997 (Image contracts), B1087 (Api boundaries), B1121 (Image generation call preparation), B511 (OpenAI image
  generation variants), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners,
  not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
