references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_store_files/main.py#L54-L303
  why: Whole SDK create/list functions establish credential-before-parameter ordering and the different extra_query handling.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9563-L9573
  why: The file provider selector supports only OpenAI at this pin.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L576
  why: Public attachment calls use REQUEST_TIMEOUT's 6000-second default when their timeout is falsey.
dod:
- text: >-
    attach_file_projection sends vs_a,file_a,attributes={tag:x,count:2},chunking_strategy={type:static,
    static:{max_chunk_size_tokens:800,chunk_overlap_tokens:400}},unknown=1,extra_query={ignored:y}.
    POST /v1/vector_stores/vs_a/files contains file_id=file_a,attributes={tag:x},the static chunking map,
    no unknown and no query. Missing optionals produce only file_id; explicit attributes={} remains {}.
    extra_body={file_id:file_b} overrides the body's id in the downstream handler. Mock 200
    {id:file_b,object:vector_store.file,status:in_progress} is returned, in sync and async modes.
  proof: [sdk-tests, oracle, python-adapter]
- text: >-
    list_attachment_query sends after=file_a,before=file_z,filter=failed,limit=0,order=asc,
    extra_query={limit:2,trace:x}. GET query retains after,before,filter,order,trace and uses limit=2.
    With no options it sends no pagination query; null fields disappear and an empty after survives.
    Mock {object:list,data:[],first_id:null,last_id:null,has_more:false} returns unchanged.
  proof: [sdk-tests, oracle, python-adapter]
- text: >-
    attachment_registry_precedence starts with provider omitted or "",caller api_key=sk-caller and
    registry {api_key:sk-registry,custom_llm_provider:azure}. Provider selection remains openai and
    Authorization is "Bearer sk-registry"; registry api_base points to the mock. Registry failure silently
    uses the caller key. Explicit azure fails before HTTP with source message "Vector store file create is not supported for azure"
    or "Vector store file list is not supported for azure"; unknown "bogus" fails enum conversion. Final
    SDK failure is APIConnectionError,status=500,type=null,param=null,code=null. Compare message only with
    the betterlite wording exclusion; no proxy code="500" is added.
  proof: [sdk-tests, oracle, python-adapter]
- text: >-
    attachment_timeout_context observes handler timeouts 6000,6000,7 for null,0,7 and 12,12,7 with
    REQUEST_TIMEOUT=12. Native logging includes model=null,vector_store_id=vs_a,call id null or call-a
    and the untransformed create/list optional fields. Boolean true selects async; integer 1 does not.
    loads_request_timeout uses the config loader to assert unset=6000,"12"=12 and "bad" is an error;
    committed config seeds replay. B2480 separately tests that list omits this value at its HTTP send.
  proof: [sdk-tests, config-tests, config-corpus]
- text: >-
    attachment_provider_failure supplies HTTP 401 {error:{message:bad,type:invalid_api_key,param:null,code:invalid_api_key}}.
    Both operations make one request with retries disabled and return SDK AuthenticationError,status=401,
    type=null,param=null,code=null through B011. New SDK seeds cover both operation tags and modes.
  proof: [sdk-tests, oracle, python-adapter, sdk-corpus]
checks:
  optional: [mutants]
  commands:
  - id: sdk-tests
    why: public attachment creation/listing loses filtering, registry precedence or async context
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_create::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: attachment timeout settings do not use the real configuration loader
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::vector_file_create::tests::loads_request_timeout($|::)/)'
  - id: config-corpus
    why: REQUEST_TIMEOUT has no new attachment configuration corpus input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/vector-file-create-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: python-adapter
    why: public create/list SDK requests lack a checked independent adapter
    run: test -f tools/oracle/sdk_http/vector_file_create_list.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: attachment create/list SDK calls lack new parser seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-file-create-list-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/vector-file-create-list/attach-file-projection.yaml
- tools/oracle/cases/sdk-http/vector-file-create-list/list-attachment-query.yaml
- tools/oracle/cases/sdk-http/vector-file-create-list/attachment-registry-precedence.yaml
- tools/oracle/cases/sdk-http/vector-file-create-list/attachment-provider-failure.yaml
deviations: []
out_of_scope:
- B1111 owns _ensure_provider/_prepare_registry_credentials; B1073 owns SDK retrieve/content and B1074 owns SDK update/delete in this file.
- B2480 owns actual create/list handlers, B527 provider transforms, B1071 record/filter logic and B011 final SDK exception mapping.
pitfalls:
- Registry custom_llm_provider does not change the local provider selected before the registry overlay.
- Create ignores extra_query while list forwards it, so one generic argument projection would change one of them.
- OpenAI cleans numeric attributes after this wrapper logs the uncleaned request fields.
review_level: security
budget:
  max_changed_lines: 680
  max_new_expects: 0
