  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/vector_file_create_list.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/vector_file_create_list.py
  - tools/oracle/cases/sdk-http/vector-file-create-list/**
  - tools/oracle/fuzz/corpus/sdk_http_case/vector-file-create-list-*
  - tools/oracle/helpers/b1072.py
