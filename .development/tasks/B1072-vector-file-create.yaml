id: B1072
title: Attach vector files and list attachments through the SDK
description: >-
  Implement create/acreate/list/alist from vector_store_files/main.py:54-303 in core::api::vector_file_create.
  B1111 defaults a falsey provider to openai and overlays registry credentials before GenericLiteLLMParams
  is constructed with vector_store_id. B174 converts the local provider string to its enum before B010's
  provider-config selection, using the provider already resolved before
  that overlay. Create/list filter merged locals plus kwargs through B1071; create then explicitly restores
  its file_id argument. Call B2480's HTTP handlers with B527's provider config and preserve B011 exception
  mapping. extra_query is dropped by create and forwarded by list. All optionals default null.

  Logging records model=null, optional_params containing vector_store_id plus filtered request fields,
  and litellm_params containing vector_store_id,litellm_call_id then non-null GenericLiteLLMParams fields.
  Async wrappers retain context and await either the returned coroutine or immediate result. Their flags
  acreate/alist are popped and select async only for true. timeout=null or 0 falls back to REQUEST_TIMEOUT,
  default 6000; load the existing setting through betterlite-config. Add VectorFileCreateList to B2401,
  with actual public SDK calls and production Rust execution. Keep all tests under api::vector_file_create.
  Count 225 nonblank/non-comment lines; budget 225 code, 160 tests, 95 adapters, 100 fixtures and 55 config/
  corpus/wiring lines, 635 within 680. B1071 owns byte parsing; no helper adapter or new parser is needed.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_file_create.rs
  - crates/betterlite-core/src/api/vector_file_create/**
