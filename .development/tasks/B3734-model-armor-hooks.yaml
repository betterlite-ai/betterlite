id: B3734
title: Model Armor request response and logging hooks
description: >-
  Build Model Armor event hook implementations for pre-call (sanitizing user prompts),
  during-call moderation (parallel scan), post-call success (sanitizing model responses),
  and logging-only (deferred scanning for audit). Wire the core decision logic from B3732,
  file scanning and transport from B3733, and message content extraction from B219.

  The four hook methods handle the guardrail lifecycle. Pre-call scans user messages before
  the LLM receives them; moderation scans in parallel while the LLM works; post-call success
  scans and masks the completed response or blocks it; logging-only defers verdict recording
  until the response is logged, without blocking the request. When masking is enabled
  (mask_request_content or mask_response_content), sanitized content replaces the original
  in place; when blocked, an HTTPException with status 400 and sanitized detail is raised.
  When fail_on_error is false, guardrail API errors pass through (request continues);
  when true, they block. Metadata buckets store per-request scan results and status
  to prevent race conditions in concurrent request handling.

  Preserve defaults: fail_on_error defaults true, mask_request_content and
  mask_response_content default false, sanitize_error_detail defaults true.
  Every hook calls should_run_guardrail to check if the guardrail is enabled
  for this call type and event. Pre-call and moderation both scan request files
  before scanning message text, accumulating responses so a file scan is not
  dropped by a text scan. Post-call success extracts content from ModelResponse
  objects via the common_utils helper, skipping non-text types (TTS, images).
  Logging-only scans completed responses and records the verdict without blocking,
  respecting logging_only mode in the event_hook config so the same guardrail
  instance can serve both blocking and audit-only deployments.

  Event type translation: when call_type is call_mcp_tool, pre-call becomes
  pre_mcp_call and moderation becomes during_mcp_call. All hooks mark the guardrail
  as applied via add_guardrail_to_applied_guardrails_header BEFORE potential blocking,
  ensuring it is recorded even when the request is refused.

  Standard logging guardrail information differs between the native hooks and the
  apply_guardrail method. Pre-call, moderation, and post-call success hooks store a
  per-request status in metadata that is {success, blocked} to reflect whether content
  passed or was blocked. The apply_guardrail method records guardrail_status in the
  request_data logging object with values {success, guardrail_flagged, guardrail_failed_to_respond}
  to capture success, policy violations, and API failures respectively.

