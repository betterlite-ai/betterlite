dod:
  - text: async_pre_call_hook calls _scan_request_files, then make_model_armor_request on the last user message, stores response and status in metadata, marks guardrail as applied, and blocks or masks content based on configuration.
    proof: [pre-call-tests]
  - text: async_moderation_hook has identical structure to async_pre_call_hook for parallel scanning during LLM execution, using during_call and during_mcp_call event types.
    proof: [moderation-tests]
  - text: async_post_call_success_hook extracts content from ModelResponse via common_utils helper, skips non-text types, scans responses, and blocks or masks based on configuration.
    proof: [post-call-tests]
  - text: apply_guardrail scans request or response content depending on input_type (request or response), records verdict in logging without blocking, respects _event_hook_is_event_type(logging_only) to gate blocking behavior.
    proof: [logging-only-tests]
  - text: "_process_response reads per-request metadata bucket (_model_armor_response and _model_armor_status keys populated by other hooks) and calls add_standard_logging_guardrail_information_to_request_data with the read status."
    proof: [logging-tests]
  - text: All hooks check should_run_guardrail before processing; pre-call and moderation translate call_mcp_tool to pre_mcp_call and during_mcp_call event types.
    proof: [event-type-tests]
  - text: All hooks call add_guardrail_to_applied_guardrails_header BEFORE potential blocking to ensure guardrail is recorded even when request is refused.
    proof: [applied-guardrails-tests]
  - text: Pre-call and moderation masks message content in place using set_last_user_message when mask_request_content is true and sanitized content differs from original.
    proof: [masking-tests]
  - text: Post-call success masks response choices in place when mask_response_content is true and sanitized content differs from original.
    proof: [response-masking-tests]
  - text: All hooks fail_on_error=true (default) raises ModelArmorAPIError on guardrail API errors; fail_on_error=false logs a warning and continues.
    proof: [error-handling-tests]
  - text: Metadata buckets use get_or_create_metadata_bucket to ensure unique per-request state, preventing race conditions when the same guardrail instance handles concurrent requests.
    proof: [metadata-isolation-tests]
  - text: "Post-call success hook records StandardLoggingGuardrailInformation via add_guardrail_response_to_standard_logging_object with hardcoded guardrail_status=success at the top level (the actual block/pass outcome lives in guardrail_response.model_armor_status); includes start_time, end_time, duration and sanitized model_armor_response dict."
    proof: [logging-information-tests]
  - text: "apply_guardrail (logging-only path) records guardrail verdict via add_standard_logging_guardrail_information_to_request_data with guardrail_status in {success, guardrail_flagged, guardrail_failed_to_respond}, without raising even when flagged."
    proof: [logging-information-tests]

