oracle_cases: []

deviations:
  - what: "The metadata bucket for per-request guardrail state uses get_or_create_metadata_bucket(data), ensuring unique storage per request even when multiple concurrent requests use the same guardrail instance."
    why: "LiteLLM's comment at line 692 notes race conditions between concurrent requests sharing the same guardrail instance. Using a unique metadata bucket per request prevents stale responses from one request overwriting another's results."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L692-L695"
  - what: "Pre-computed guardrail_status in metadata (success, blocked, guardrail_failed_to_respond) allows logging to be correct even when fail_on_error=false suppresses exception raising."
    why: "When fail_on_error=false, the exception is not raised but the correct status must still be recorded in logs. Pre-computing status in metadata ensures logging is accurate."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L704-L710"
  - what: "The add_guardrail_to_applied_guardrails_header is called BEFORE potential blocking to record the guardrail as applied even when the request is refused."
    why: "Audit and logging must record which guardrails examined the request, even if they refused it. Calling this before raising the exception ensures the guardrail is counted."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L712-L714"
  - what: "Post-call success hook receives only ModelResponse objects; non-text types (TTS, images) return empty string from _extract_content_from_response and the guardrail is skipped."
    why: "Text-only guardrails should not process non-text outputs. LiteLLM explicitly skips processing for TTS and image responses (line 217-219)."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L215-L219"
  - what: "apply_guardrail respects _event_hook_is_event_type(logging_only) to determine whether to block on a flagged verdict (blocks only when logging_only is NOT set)."
    why: "A guardrail can be configured for both blocking and audit-only modes. The logging_only event type gate ensures the same guardrail instance can run in audit-only mode for some deployments while blocking in others."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L1283-L1290"
  - what: "When masking is enabled and sanitized content matches original content (no change), masking is skipped to avoid unnecessary updates."
    why: "Model Armor may not find anything to sanitize, in which case the original content is acceptable. Skipping the update when sanitized_content == original avoids unnecessary field updates."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L725-L726"
  - what: "The async_post_call_success_hook uses add_guardrail_response_to_standard_logging_object with hardcoded guardrail_status=success at the top level, while apply_guardrail uses add_standard_logging_guardrail_information_to_request_data with guardrail_status in {success, guardrail_flagged, guardrail_failed_to_respond}. The post-call hook is called only on successful LLM responses, so the top-level status is always success; the actual verdict lives in guardrail_response.model_armor_status. The apply_guardrail path runs independently and must capture all possible status values."
    why: "These two code paths log via different methods with different status semantics. Post-call success logging lives in the response object lifecycle (called only on success), while apply_guardrail logging lives in the request_data dict and must record verdicts for both success and failure cases."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L851-L887,https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/model_armor/model_armor.py#L1259-L1291"

out_of_scope:
  - "Streaming response assembly and iterator hooks; those belong to B3735."
  - "_scan_request_files, make_model_armor_request, file scanning and transport logic owned by B3733."
  - "_log_request_debug and _log_response_debug (L244-L280) owned by B3733 and not called from this task."
  - "Filter result decision logic (_should_block_content, _get_sanitized_content) owned by B3732."
  - "Message and response content extraction helpers from common_utils (B219) and core_helpers (B206); those are used but not built here."
  - "Callback utilities add_guardrail_to_applied_guardrails_header and add_guardrail_response_to_standard_logging_object (callback_utils.py:591, :672) owned by B189."
  - "should_run_guardrail, _event_hook_is_event_type, add_standard_logging_guardrail_information_to_request_data, and log_guardrail_information decorator (custom_guardrail.py) owned by B3664/B3665/B3666."

pitfalls:
  - "Pre-call and moderation hooks use identical logic; they differ only in event_type translation (pre_call vs during_call, pre_mcp_call vs during_mcp_call). Do not duplicate the implementation; factor shared logic."
  - "Metadata buckets must be unique per request; use get_or_create_metadata_bucket(data) to ensure each request gets its own bucket, not a shared one overwritten by concurrent requests."
  - "The _append_armor_response function returns a single response object on first call and a list on subsequent calls. File scans and text scans both append, so the order (file first, text second) must be preserved."
  - "When masking is enabled, sanitized_content from Model Armor is used ONLY if it differs from the original content. Applying an identical sanitized_content is a no-op and should be skipped."
  - "HTTPException detail for blocking may be a dict (with 'error' and optional 'model_armor_response' keys) or a string; both forms are accepted. Use _build_block_error_detail to construct the detail."
  - "ModelArmorAPIError must be caught separately from HTTPException to apply fail_on_error logic; HTTPException (from file scanning, blocking decisions) is always re-raised."
  - "The apply_guardrail method for logging_only must check _event_hook_is_event_type(logging_only) to decide whether to raise on a flagged verdict; if logging_only is set, the verdict is logged but not raised."
  - "Common_utils helpers (get_last_user_message, set_last_user_message, get_content_from_model_response) are imported inside the function, not at module level, to avoid circular imports."

review_level: standard

