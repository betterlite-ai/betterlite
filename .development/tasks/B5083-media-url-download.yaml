dod:
  - text: Reading a response matches LiteLLM for the status check, the Content-Length check, the counted body limit, the media type and the data URL, with the same texts.
    proof: [response-reading, oracle, helper-python]
  - text: convert passes data URLs through, honors a 0 limit and the cache, tries three times, does not retry an ImageFetchError and turns an SSRF error into the rejection text, all as ImageFetchError.
    proof: [url-conversion, oracle, helper-python]
  - text: fetch_all keeps at most 20 fetches in flight, returns results in input order and cancels the rest on the first failure.
    proof: [parallel-fetches]
  - text: MAX_IMAGE_URL_DOWNLOAD_SIZE_MB loads as a Python float with default 50, and a value Python can't parse stops startup.
    proof: [download-limit]
checks:
  optional:
    - mutants
  commands:
    - id: response-reading
      why: the response reading tests are missing or a text, limit or data URL differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^media_fetch::tests::response_reading_matches_litellm($|::)/)'
    - id: url-conversion
      why: the conversion tests are missing or the pass-through, cache, retry or rejection path differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^media_fetch::tests::url_conversion_matches_litellm($|::)/)'
    - id: parallel-fetches
      why: the concurrency test is missing or more than 20 fetches run, results lose their order, or a failure leaves fetches running
      run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/^media_fetch::tests::parallel_fetches_are_bounded($|::)/)'
    - id: download-limit
      why: the size limit setting test is missing or the value loads differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::image_url_download::tests::download_limit_follows_litellm($|::)/)'
    - id: helper-python
      why: the oracle adapter fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
