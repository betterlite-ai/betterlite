    why: The cache and fetch limits, _process_image_response with every text, and _rejected_image_fetch.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/image_handling.py#L84-L136
    why: async_convert_url_to_base64 and convert_url_to_base64 with the data URL pass-through, the 0 limit, the cache and the three tries.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/image_handling.py#L289-L303
    why: _fetch_data_url and _fetch_data_urls with the 20-fetch semaphore and cancel-on-failure.
