  - tools/oracle/cases/helpers/media-fetch/bad-port-retried.yaml
deviations:
  - what: A body that grows past the limit fails as soon as the count passes it, with the size text. A body that never ends, or drips slower than the read timeout allows, fails the same way once it passes the limit, where LiteLLM keeps reading until the read timeout and then answers "after 3 attempts".
    why: >-
      LiteLLM's safe_get reads the whole body into memory before _process_image_response counts it, so an endless or huge body uses unbounded memory. Stopping at the limit keeps memory bounded and gives the same text for every body LiteLLM can finish reading.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L713-L745
  - what: Each try also has a total deadline equal to the request timeout (6000 seconds unless request_timeout or REQUEST_TIMEOUT sets it); a try that passes it counts as a failed try.
    why: >-
      LiteLLM's module-level clients give connect and every read the request timeout but have no total limit, so a server that sends one byte just inside each read timeout holds the request without end. B173's transport always takes a total deadline, and the request timeout is the largest one LiteLLM ever waits on a single read.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_lazy_imports.py#L425-L452
out_of_scope:
  - Finding remote media in messages and putting the data URLs back (image_handling.py L142-L288 and L306-L334, inline_remote_media and async_inline_remote_media) belongs to B183.
  - The SSRF check, redirects and the user_url_* settings belong to B5082; the outgoing query string and default headers belong to B173.
  - Bedrock's own image fetch (factory.py get_image_details) has no cap, cache or retry and belongs to B227, which reads through this task's capped reader.
  - Provider transforms that call convert directly (factory.py L179, L806 and L851, openai gpt_transformation.py L244-L253, gemini transformation.py L162, bedrock anthropic_claude3_transformation.py L331) belong to their provider tasks.
pitfalls:
  - httpx's iter_bytes(chunk_size=8192) hands out exact 8192-byte chunks whatever the network sends, so a 52,428,801-byte body fails at 52,428,801 bytes ("50.00MB") and a 60,000,000-byte body at 52,436,992 bytes ("50.01MB"); count in the same steps.
  - The limit prints as a Python float in the size text ("50.0MB", "0.5MB", "1e-05MB"), never as Rust's "50".
  - A limit of inf or nan makes LiteLLM's int(limit * 1048576) raise inside the read, so every fetch ends with the "after 3 attempts" text; keep that rather than reading without a limit.
  - B5082 reports a bad port or an unclosed IPv6 bracket as a URL parse error, not an SSRF error, so convert retries it three times and answers "after 3 attempts", not the rejection text.
  - Only status 200 passes; 201, 203 and 204 fail with the status text even though they are successes.
  - The Content-Length check runs before any body byte is read and uses the header's number, so a Content-Length of 62914560 fails with "60.00MB" even when the body is short.
  - asyncio.gather reports the failure that happens first in time, so fetch_all must not use futures' buffered(), which reports errors in input order.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
