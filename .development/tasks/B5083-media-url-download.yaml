id: B5083
title: Download request media URLs into data URLs
description: >-
  When a provider needs bytes and a request carries an http or https image or file URL, LiteLLM downloads it and turns it into a `data:{type};base64,...` URL (convert_url_to_base64 and async_convert_url_to_base64 in litellm/litellm_core_utils/prompt_templates/image_handling.py). betterlite does the same, through B5082's SSRF-checked fetch, with LiteLLM's size cap, cache, retries, messages and concurrency (Max, 2026-10-31: media URLs are fetched like LiteLLM). Build it in crates/betterlite-prompts/src/media_fetch.rs and media_fetch/** as one async fetcher that B183's traversal and the provider transforms call. Its client, cache and limits come in through its constructor; nothing is module state.


  Size limit. MAX_IMAGE_URL_DOWNLOAD_SIZE_MB is read once at startup as a Python float, default 50 (constants.py L134-138). Read it in the config section image_url_download (crates/betterlite-config/src/sections/image_url_download.rs and image_url_download/**) through the config's environment lookup; a value Python's float() rejects stops startup with a config error naming the variable, where LiteLLM fails at import. The section exposes the float as config.sections.image_url_download. The comment at constants.py L135 says 0 disables the limit, but the code makes 0 disable downloads, and betterlite follows the code.


  convert(url). A URL that starts with "data:" and holds ";base64," comes back unchanged. When the limit equals 0, fail with "Error: Image URL download is disabled (MAX_IMAGE_URL_DOWNLOAD_SIZE_MB=0). url={url}". Then look the URL up in the cache and return a hit. Otherwise try up to 3 times: fetch through B5082 (validation and allowlist from its user_url_policy section) and read the response as below. An ImageFetchError from reading is returned at once. An SSRF error from B5082 logs the warning "Image fetch of {url} rejected before any request went out: {error}" and fails with "Error: Unable to fetch image from URL. The proxy could not resolve this host or its URL policy rejected it; an admin can check the proxy log and `user_url_allowed_hosts` in litellm_settings. url={url}". Any other error (B5082's URL parse errors, connect and read failures, timeouts, too many redirects with validation off) is logged at error level the way convert_url_to_base64 logs it (the async copy drops it without a log) and the next try starts; after the third, fail with "Error: Unable to fetch image from URL after 3 attempts. url={url}". Every failure is an ImageFetchError, a 400 BadRequestError for the caller, and every text names the URL the caller passed.


  Reading a response (_process_image_response). A status other than 200 fails with "Error: Unable to fetch image from URL. Status code: {status}, url={url}". A Content-Length header is read as an integer before the body; when it divided by 1048576 is above the limit, fail with "Error: Image size ({size:.2f}MB) exceeds maximum allowed size ({limit}MB). url={url}", where limit prints the way Python prints a float (50.0, 0.5). Then read the decoded body and count it in 8192-byte steps the way httpx's iter_bytes(chunk_size=8192) does; as soon as the count passes int(limit * 1048576), fail with the same size text for the count so far. Base64 the bytes and take the media type from B235's infer_content_type_from_url_and_content with the URL, the bytes and the Content-Type header; when it can't tell, fail with "Error: Unable to determine image content type from the server's headers, the URL, or the image bytes. url={url}". Store `data:{type};base64,{b64}` in the cache under the URL and return it. Make the limited body read (the 8192-step count and the size text, without the status and media type steps) a public function of its own, since B227 reads Bedrock image bodies through it.


  Cache and client. The cache is B2226's LocalTtlCache built the way InMemoryCache(max_size_in_memory=10) is: 10 entries, the 600-second default TTL and the 1024 KiB item limit, so a data URL of 1 MiB or more is never kept. The client is B173's shared client with the timeout LiteLLM gives its module-level clients: litellm_settings.request_timeout, else REQUEST_TIMEOUT, else 6000 seconds (B198's CoreSettings), for connect and for each read.


  Many URLs (_fetch_data_url and _fetch_data_urls). fetch_all(urls) converts every URL with at most 20 in flight (MAX_CONCURRENT_REMOTE_MEDIA_FETCHES), returns the results in input order, and on the first failure cancels the rest and returns that failure.


  Tests. media_fetch::tests::response_reading_matches_litellm covers the status, Content-Length, body count, media type and cache store paths. media_fetch::tests::url_conversion_matches_litellm runs a local server on 127.0.0.1 with 127.0.0.1 allowlisted and covers the data URL pass-through, a 0 limit, a cache hit, three tries then the attempts text, no retry after an ImageFetchError, the SSRF rejection text and the total deadline. media_fetch::tests::parallel_fetches_are_bounded checks the 20-fetch limit, the result order and cancel-on-failure. sections::image_url_download::tests::download_limit_follows_litellm loads the default, a set value, 0, a value with spaces and a bad value. The skeleton gives this task the helper operation b5083 with two calls: `{call: read_response, status, headers, body_base64 | body_repeat: {byte, count}, url}`, which builds an httpx.Response (dropping the Content-Length httpx adds by itself unless the case sets one) and runs _process_image_response, and `{call: convert, url}`, which runs async_convert_url_to_base64 for URLs that never reach the network.
