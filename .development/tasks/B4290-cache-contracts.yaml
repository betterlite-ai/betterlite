  - tools/oracle/cases/backend/base-cache-contract-get.yaml
  - tools/oracle/cases/backend/base-cache-contract-set.yaml
  - tools/oracle/cases/backend/base-cache-test-connection-unsupported.yaml
  - tools/oracle/cases/backend/memory-async-get-absolute-ttl.yaml
  - tools/oracle/cases/backend/memory-async-increment-pipeline.yaml
  - tools/oracle/cases/backend/dynamic-cache-control-ttl.yaml
  - tools/oracle/cases/backend/semantic-scope-key-and-user.yaml
  - tools/oracle/cases/backend/cached-embedding-format-version-2.yaml
  - tools/oracle/cases/backend/supported-call-types.yaml
  - tools/oracle/cases/backend/cache-type-round-trip.yaml
  - tools/oracle/cases/backend/ping-response-health-check.yaml
  - tools/oracle/cases/backend/redis-pipeline-increment.yaml
  - tools/oracle/cases/backend/redis-pipeline-set.yaml
  - tools/oracle/cases/backend/redis-pipeline-rpush.yaml
  - tools/oracle/cases/backend/redis-pipeline-lpop.yaml
  - tools/oracle/cases/backend/async-get-oldest-n-keys-ordering.yaml

deviations:
  - what: Rust trait methods use Result<T> for fallible operations; async adapters propagate errors instead of silent fallback.
    why: Rust does not permit None/missing return value equivalents to LiteLLM's absence-means-success pattern.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/base_cache.py#L35-L39

out_of_scope:
  - B2226 owns InMemoryCache.__init__, check_value_size, evict_cache, _is_key_expired, _remove_key,
    allow_ttl_override, set_cache, evict_element_if_expired, get_cache and delete_cache; they are
    reused as-is, not reimplemented.

  - B390 owns async_set_cache, async_set_cache_pipeline, async_set_cache_sadd, batch_get_cache
    and increment_cache in in_memory_cache.py; async adapters call them through dependency injection.

  - Redis backend, disk backend, cluster/semantic/object-store factories and their failing operation
    handlers belong to later cache orchestration tasks (B4291-B4299, B126-B128).

pitfalls:
  - The async_get_ttl trait method returns the stored absolute expiration timestamp (seconds since epoch), not the remaining TTL; a user seeking remaining seconds must subtract the current time on their side.

  - Cache controls and semantic scope enums serialize to lowercase string forms in the wire format, but Rust enum variants use SCREAMING_SNAKE_CASE for readability; serde renames must map correctly.

  - The InMemoryCache default_ttl is 600 seconds (10 minutes) and max_size is 200 items; exceeding these limits requires explicit construction parameters, never silent downgrades.

budget:
  max_changed_lines: 1500
  max_new_expects: 0

review_level: standard
