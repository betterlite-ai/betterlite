id: B4810
title: A2A logging context and stream completion accounting
description: >-
  Build request-owned A2A logging metadata and the stream iterator's terminal usage and cost delivery.
  Implement _set_usage_on_logging_obj, _set_agent_id_on_logging_obj, _a2a_cost_params, _set_litellm_params_on_logging_obj,
  _get_a2a_model_info, _build_streaming_logging_obj and the A2AStreamingIterator class.
  The iterator collects streaming response chunks, extracts projected text for token counting, tracks completion state,
  and on stream termination calculates final usage, updates the logging object, and dispatches success handlers.
  Only the three pricing keys (cost_per_query, input_cost_per_token, output_cost_per_token) enter the logging object;
  agent credentials never do. Reused non-streaming logging params are merged while preserving proxy and user metadata.
  Streaming completion sets the logging stream flag to false and catches accounting failures; stream errors do not
  run the normal exhausted-stream completion branch. The iterator is owned by stream callers and tracks callback
  delivery rather than detaching work.
