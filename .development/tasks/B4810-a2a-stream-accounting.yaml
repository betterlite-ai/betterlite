dod:
- text: >-
    Each listed helper case compares its named function output with the pinned Python behavior, including
    usage tuple structure, logging object mutation, pricing key filtering and agent info extraction.
  proof:
  - oracle
  - helper-python
- text: >-
    A2AStreamingIterator collects all chunks, preserves the final completion marker, extracts text from
    each chunk independently, counts input/output tokens correctly, and invokes success handlers on stream termination.
  proof:
  - behavior-tests
- text: >-
    On non-streaming logging reuse, cost parameters merge into existing litellm_params while preserving
    proxy_server_request and metadata keys.
  proof:
  - behavior-tests
- text: >-
    Streaming completion sets stream flag to false, calculates decimal cost through A2ACostCalculator,
    and dispatches success handlers with asyncio.create_task.
  proof:
  - behavior-tests
- text: >-
    The pricing-key constant and all main.py helper functions are registered exports through betterlite-a2a.
  proof:
  - clippy
checks:
