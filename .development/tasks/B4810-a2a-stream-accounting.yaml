deviations:
- what: >-
    The iterator calls asyncio.create_task to dispatch success handlers asynchronously after stream termination.
  why: >-
    Streaming callbacks must execute after text collection completes. The caller holds the iterator for the
    stream lifetime, so the task is implicitly tracked by the retained iterator object.
out_of_scope:
- >-
  The remaining functions in litellm/a2a_protocol/main.py belong to other tasks (B4801 transport,
  B4814 send entry points, B4809 dispatch), and litellm/a2a_protocol/streaming_iterator.py's imports
  and external protocol types are owned by their defining modules.
- >-
  Enterprise logging behavior, exporter-specific delivery, prompt management and MCP hooks belong
  to other logging tasks.
pitfalls:
- >-
  The iterator stores chunks as a mutable list; final_chunk is set only if a completed chunk is seen
  during iteration, otherwise it is the last chunk on StopAsyncIteration. Do not accumulate text;
  extract and count each chunk independently.
- >-
  _a2a_cost_params returns a MappingProxyType to prevent mutation of the filtered dict. Tests must
  not rely on mutability.
- >-
  Pricing key precedence in A2ACostCalculator is explicit cost_per_query, then token rates, then zero;
  only these three keys ever enter the logging object, never credentials or auth metadata.
- >-
  Logging object reuse on non-streaming calls must preserve proxy_server_request and metadata keys
  that were set by earlier proxy middleware. Merge cost parameters in, do not replace the whole litellm_params.
- >-
  A2AStreamingIterator receives a request and logging_obj already initialized; do not rebuild them or
  lose request fields during text extraction.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
