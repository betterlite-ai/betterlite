dod:
  - text: _not_run_reason returns "no scannable content after message scoping" when any text or tool_call content exists after scoping; returns None when texts and tool_calls are both empty but images exist (images-only, never scanned); returns "no scannable content" when texts, tool_calls and images are all empty.
    proof: [not-run-reason-cases]
  - text: extract_request_tool_names collects all function.name values from tools[].function and all name values from functions[], preserving order.
    proof: [tool-name-extraction-cases]
  - text: _extract_inputs populates texts_to_check, images_to_check, and tool_calls_to_check with content filtered by role_out_of_guardrail_scope, mapping indices into text_task_mappings and tool_call_task_mappings.
    proof: [input-extraction-cases]
  - text: >-
      _apply_guardrail_responses_to_input_texts applies guarded text responses
      back to messages by (msg_idx, content_idx) mapping, handling both string
      content and list content items.
    proof: [input-text-rewrite-cases]
  - text: _apply_guardrail_responses_to_input_tool_calls applies guardrailed tool_calls back to input messages by (msg_idx, tool_call_idx) mapping.
    proof: [input-tool-rewrite-cases]
  - text: _narrowed_to_choice returns a response copy with choices filtered to a single index.
    proof: [narrowed-to-choice-cases]
  - text: build_stream_error_items returns one-element sequence with sse_error_payload-formatted error chunk.
    proof: [error-items-cases]
  - text: _accumulate_string_content_by_choice_index returns dict mapping choice.index to concatenated string delta.content, skipping non-string content.
    proof: [accumulate-string-cases]
  - text: _streamed_tool_call_fingerprints returns tuple of fingerprints from _streamed_delta_tool_calls per choice across all responses_so_far.
    proof: [tool-fingerprint-cases]
  - text: _first_choice_has_finished returns true if any first choice across responses_so_far has finish_reason != None.
    proof: [first-choice-finish-cases]
  - text: >-
      _combine_streaming_texts maps (choice_idx, content_idx) to concatenated
      text from list content or (choice_idx, None) to concatenated text from
      string content.
    proof: [combine-texts-cases]
  - text: _has_text_content returns true when response (ModelResponse or ModelResponseStream) contains non-None string content or non-empty tool_calls.
    proof: [has-text-cases]
  - text: _extract_output_text_images_and_tool_calls populates texts, images, and tool_calls lists from Choices or StreamingChoices content, using _convert_tool_call_to_dict to handle tool_call objects.
    proof: [output-extraction-cases]
  - text: _convert_tool_call_to_dict returns dict when input is already dict, converts object with id and function attributes to dict (type defaults to "function" when absent), and returns None for invalid objects (no logging).
    proof: [tool-call-convert-cases]
  - text: _apply_guardrail_responses_to_output_texts applies text responses back to response.choices[choice_idx].message.content by (choice_idx, content_idx) mapping.
    proof: [output-text-rewrite-cases]
  - text: _apply_guardrail_responses_to_output_tool_calls updates response.choices[choice_idx].message.tool_calls[tool_call_idx] with guardrailed function.arguments and function.name.
    proof: [output-tool-rewrite-cases]
  - text: _check_streaming_has_ended returns true once any choice across responses_so_far has finish_reason != None.
    proof: [streaming-ended-cases]
  - text: >-
      build_block_sse_chunks returns two bytes chunks (message then final) with
      observed upstream stream identity (id, created, model) or synthesized
      identity (uuid.uuid4(), time.time(), exc.model) when responses_so_far is
      empty, using standalone delta (role + content) for pre-stream blocks and
      continuation delta (content only) for mid-stream blocks.
    proof: [block-sse-cases]
  - text: Block chunk final frame includes usage (prompt_tokens, completion_tokens, total_tokens) extracted from blocked_chat_stream_usage.
    proof: [block-usage-cases]
  - text: >-
      _chat_sse_chunk encodes payload dict as JSON with "data: " prefix and
      "\n\n" suffix.
    proof: [chat-sse-chunk-cases]
  - text: _stream_chunk_choices returns tuple of choices from stream_item_field(item, "choices") when it is a Sequence (not str/bytes), returns empty tuple otherwise.
    proof: [stream-chunk-choices-cases]
  - text: _streamed_delta_tool_calls returns tuple of tool_calls and legacy function_call from delta via stream_item_items and stream_item_field.
    proof: [streamed-delta-tool-cases]
  - text: >-
      _blocked_stream_identity returns (chunk_id, created, model) by searching
      responses_so_far for first item with id, or synthesizes all three when
      responses_so_far is empty or contains no id.
    proof: [blocked-identity-cases]

