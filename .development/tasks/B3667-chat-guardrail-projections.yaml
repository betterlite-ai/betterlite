oracle_cases: []

deviations:
  - what: Invalid tool_call objects (those with missing id, function, or other required attributes) are silently dropped from texts_to_check without logging during _extract_inputs and _extract_output_text_images_and_tool_calls.
    why: LiteLLM drops invalid objects without logging to avoid noisy warnings for malformed streamed data. betterlite preserves this silent-failure behavior.
  - what: >-
      _combine_streaming_texts reconstructs text per (choice_idx, content_idx)
      tuple from all chunks' delta.content, which may diverge from the original
      message structure if list content boundaries shift during streaming.
    why: >-
      This reconstruction supports guardrail application to streaming responses;
      the choice-based grouping matches how unified guardrails consume text for
      scanning, not how the client views final structure.
  - what: _blocked_stream_identity always uses stream_item_field to extract id, created, and model from responses_so_far, never trusting exc.original_response for those fields.
    why: The exception may not carry complete response metadata, so observed stream identity from successfully relayed chunks is authoritative for block replacement.

out_of_scope:
  - get_structured_messages (B3668) owned by chat request/response orchestration.
  - process_input_messages (B3668) owned by chat request/response orchestration.
  - process_output_response (B3668) owned by chat request/response orchestration.
  - process_output_streaming_response (B3669) owned by chat streaming orchestration.
  - _process_streaming_block_only (B3669) owned by chat streaming block-only scans.
  - _process_ended_stream (B3668) owned by chat ended-stream rewrite machinery.
  - _rebuild_ended_stream_per_choice (B3668) owned by chat ended-stream rewrite machinery.
  - _process_streaming_transform (B3669) owned by chat incremental transform scans.
  - get_streaming_scan_key (B3669) owned by chat streaming scan key projection.
  - _apply_guardrail_responses_to_output_streaming (B3669, handler.py:1199) owned by chat streaming/ended-stream rewrite machinery.
  - _string_choice_contents (B3668) owned by chat ended-stream rewrite machinery.
  - _write_ended_stream_text_rewrites (B3668) owned by chat ended-stream text rewrite.
  - _function_tool_call_shapes (B3668) owned by chat ended-stream tool call rewrite.
  - _function_tool_call_fragments (B3668) owned by chat ended-stream tool call rewrite.
  - _write_ended_stream_tool_call_rewrites (B3668) owned by chat ended-stream tool call rewrite.
  - sse_error_payload (litellm/proxy/common_request_processing.py) is external and supplied by the unified guardrail dispatcher or B3687 direct-apply path.
  - role_out_of_guardrail_scope predicate (B3663) is supplied by message-scoping; this task only calls it.
  - blocked_chat_stream_usage (B3663) extracts usage from completed-response metadata; this task only calls it for block-frame building.
  - stream_item_field and stream_item_items helpers are supplied by B3663; this task uses them for generic stream traversal.
  - ChatCompletionToolParam and Choices/StreamingChoices types are LiteLLM's wire types; this task only manipulates them.
  - The unified guardrail dispatcher (B3680) consumes these extraction/rewriting functions; this task does not orchestrate them.

pitfalls:
  - >-
    _extract_inputs requires pre-allocated lists (texts_to_check,
    images_to_check, tool_calls_to_check) that it mutates in place; callers
    must pass empty lists every call.
  - >-
    text_task_mappings appends (msg_idx, content_idx_or_none) where
    content_idx_or_none is None for string content and int for
    list[content_item] index; the None value is distinct from 0.
  - >-
    tool_call_task_mappings appends (msg_idx, tool_call_idx) with no optional
    element; all indices are int.
  - >-
    _combine_streaming_texts keying on (choice.index, content_idx) requires
    choice.index to exist and be an int; if missing or None, code must default
    to 0.
  - >-
    _accumulate_string_content_by_choice_index uses getattr(choice, "index", 0)
    with fallback to 0; choice indices that are None or missing still accumulate
    under index 0.
  - >-
    _convert_tool_call_to_dict returns None for invalid objects, leaving gaps in
    tool_calls_to_check if some objects fail conversion; tool_call_task_mappings
    indices still correspond to the pre-conversion list.
  - >-
    _blocked_stream_identity synthesizes id as "chatcmpl-" + uuid4 str, created
    as int(time.time()), and reuses model from exc; if no upstream id is found,
    the synthetic id differs from every previous chunk.
  - >-
    build_block_sse_chunks standalone_delta includes role="assistant" only when
    stream_started=false; continuation delta never includes role, only content.
  - >-
    Block final chunk finish_reason is always "content_filter" (string literal),
    not the original finish_reason or exc.status.
  - >-
    stream_item_field and stream_item_items are generic helpers that may return
    None, empty tuple, or unexpected types; callers must check types before
    iterating.

