id: B3667
title: Chat guardrail extraction and block framing
description: >-
  Extract and restore chat text, images and function-tool calls without disturbing
  unrelated message fields. Build block SSE frames with the observed stream identity
  and preserved usage reporting.

  Implement message extraction and rewriting for chat guardrail scoping: extract text
  content (string or list of text/image blocks), images, and tool-call function
  parameters from request messages, returning task index mappings for guardrail
  application. Apply guardrailed text responses and tool calls back to original
  messages. For response handling, extract text, images, and tool calls from completed
  Choices or streamed StreamingChoices, handle both dict and object tool-call formats,
  and apply guardrailed responses back by choice index.

  Support streaming: combine all delta.content chunks per (choice_idx, content_idx)
  tuple to rebuild complete texts, produce deterministic tool-call fingerprints for
  deduplication, detect stream termination from finish_reason presence. Provide stream
  helpers: extract choices field from chunk items, extract tool_calls and legacy
  function_call from delta field, determine when streaming has ended.

  Build block SSE frames: standalone frames with role delta when stream_started=false
  (buffered/pre-stream block), continuation frames with content-only delta when
  stream_started=true (sampled/mid-stream block). Both frame types include usage
  extracted from the original response inside the ModifyResponseException, or zero
  tokens when usage is missing. Extract and reuse upstream stream identity (id, created,
  model) from successfully relayed chunks, synthesizing new values (uuid4 id, current
  timestamp, exc.model) when responses_so_far is empty or contains no id.

  Preserve silent-drop behavior for invalid tool-call objects (those missing required
  attributes) and empty/None content. sse_error_payload is externally supplied by the
  unified dispatcher.

