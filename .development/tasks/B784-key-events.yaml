  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/key_management_event_hooks.py#L97-L154
    why: Own KeyManagementEventHooks.async_key_updated_hook; preserve caller-visible values and failure
