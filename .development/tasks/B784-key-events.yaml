id: B784
title: Key lifecycle audit and secret-manager events
description: >-
  Implement key lifecycle event orchestration and create_key_deleted_audit_logs over typed KeyEvent and
  B2330's concrete audit policy, masked records and sink. Call B898 for secret-manager and legacy
  email effects in the pinned order. B065 owns only the later audit endpoint umbrella; no key event
  depends on it. The concrete shared sink is split into B2330 to stay below 800 changed lines.

  Generated events first await the B898 created-email sink only when send_invite_email is exactly
  true; failures warn and continue. If audit policy is enabled, schedule a created audit with
  fresh UUID/aware UTC time, B2330 changed-by resolution, caller.api_key, table
  LiteLLM_VerificationToken, object_id=response.token_id or empty string, updated_values=response
  JSON excluding nulls and before_value=null. Then always attempt B898 secret storage with
  data.key_alias or virtual-key-<response.token_id>, response.key and data.team_id; failures warn
  and return normally. Cases generated_email_true_only, generated_email_failure_continues,
  generated_audit_projection, generated_null_token_fallback and generated_store_failure_warning
  capture order, including no rollback of earlier email or audit scheduling.

  Updated events rename a secret only when request.key_alias is non-null and differs from the
  old alias; empty string still requests rename. Use old alias or virtual-key-<old token> and
  the OLD team's ID. Rename errors warn and do not suppress audit. Build updated fields by
  excluding null request fields, then explicitly restore project_id when present, including
  null detach. The audit object ID uses B770's sk- prefix hash; action is updated and identity
  uses caller.api_key. The source before_value applies json.dumps to existing_row.json, producing
  a JSON string value rather than the generated/rotated object's encoding; retain that shape
  through B2330's record constructor. After masking, restore an explicit null project_id again
  via model_copy. response is unused. Cases update_alias_unchanged_no_rename,
  update_empty_alias_rename_old_team, update_rename_failure_continues,
  update_project_null_survives_masking, update_before_value_encoding and update_response_unused
  pin these details, including constructor failure before task scheduling.

  Rotated events attempt secret rotation only when response.token_id is non-null, using old
  alias or virtual-key-<old token> as current name; new name prefers truthy response.key_alias,
  then truthy requested alias (data may be null), then current name. Pass response.key and the
  old row's team_id. Rotation failure warns and continues. Always attempt rotated-email next,
  passing response without nulls and old alias; email errors warn and continue. Schedule audit
  last only if enabled AND old token is non-null. Its object_id is the OLD token, action rotated,
  before_value old row JSON, updated_values response JSON, and changed_by_api_key is caller.token,
  not caller.api_key. Cases rotation_name_precedence, rotation_no_new_token_skips_store,
  rotation_store_warning_still_emails, rotation_email_warning_still_audits,
  rotation_missing_old_token_skips_audit and rotation_audit_identity distinguish the branches.

  Deleted events synchronously prepare/schedule audit records first, then await B898 secret
  deletion; data and response are unused. Disabled audit exits before validating rows. With audit
  enabled, validate every row from attributes, skip only null token, and schedule one audit per
  remaining row in source order with action deleted, object_id=row.token, updated_values='{}',
  before_value=row JSON excluding nulls, caller.token and B2330 changed-by selection. Empty-token
  strings are not skipped. Invalid later rows can leave earlier audit tasks scheduled and prevent
  the secret-delete call; this wrapper has no catch around B898 deletion. Cases delete_audit_first,
  delete_disabled_skips_validation, delete_null_vs_empty_token, delete_invalid_later_row_partial,
  delete_sink_exception_propagates and delete_unused_request_fields cover it.

  All audit payloads use B2330 masking, not stored-secret encryption. Raw new virtual keys go only
  to the designated B898 secret/email sinks, never diagnostics or unmasked audit fields. Native
  audit_no_raw_key tests actual B2330 construction; source equality cases compare submitted masked
  records before the MIT sink's premium guard, using injected sinks, clock and task scheduler.
  Spawned audit work is not awaited by these hooks; event preparation failures can propagate while
  later asynchronous sink failures are B2330's responsibility. No hook owns a database transaction.


  Build the production key_events module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/hooks/key_management_event_hooks.py:
  KeyManagementEventHooks.async_key_generated_hook (L36-L94; 53 source lines), KeyManagementEventHooks.async_key_updated_hook
  (L97-L154; 55 source lines), KeyManagementEventHooks.async_key_rotated_hook (L157-L224; 62 source lines),
  KeyManagementEventHooks.async_key_deleted_hook (L227-L245; 18 source lines), KeyManagementEventHooks.create_key_deleted_audit_logs
  (L248-L286; 37 source lines).


  Add the key_events operation under B856 Management::keys. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-events-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 225 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  225 production, 315 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 635 changed lines estimated within a 700-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
