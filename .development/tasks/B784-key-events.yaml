  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/key_management_event_hooks.py#L157-L224
    why: Own KeyManagementEventHooks.async_key_rotated_hook; preserve caller-visible values and failure
      ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/key_management_event_hooks.py#L227-L245
    why: Own KeyManagementEventHooks.async_key_deleted_hook; preserve caller-visible values and failure
