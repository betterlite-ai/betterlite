  - tools/oracle/cases/helpers/key-events/audit-no-raw-key.yaml
deviations: []
out_of_scope:
  - B2330 owns is_audit_logging_enabled, get_audit_log_changed_by, create_audit_log_for_update and
    LiteLLM_AuditLogs masking. B770 owns request/response fields and _hash_token_if_needed;
    B720 owns stored key rows. B898 owns actual secret storage and email delivery.
  - 'litellm/proxy/hooks/key_management_event_hooks.py: B898 owns KeyManagementEventHooks._store_virtual_key_in_secret_manager
    (L289-L318), KeyManagementEventHooks._rotate_virtual_key_in_secret_manager (L321-L345), KeyManagementEventHooks._stored_virtual_key_secret_manager
    (L348-L356), KeyManagementEventHooks._rename_virtual_key_in_secret_manager (L359-L395), KeyManagementEventHooks._get_secret_name
    (L398-L402), KeyManagementEventHooks._delete_virtual_keys_from_secret_manager (L405-L438), KeyManagementEventHooks._get_secret_manager_optional_params
    (L441-L484), KeyManagementEventHooks._is_email_sending_enabled (L487-L514), KeyManagementEventHooks._send_key_created_email
    (L517-L589), KeyManagementEventHooks._send_key_rotated_email (L592-L645).'
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as key_events in the server group. Replace the stub Op in tools/oracle/src/helpers/server/key_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/key_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Generated/updated audits use caller.api_key, but rotated/deleted audits use caller.token.
  - A null project_id detach must survive exclude_none and the audit masking pass.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
