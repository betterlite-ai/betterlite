    why: The two context variables and the CompactionExecutor protocol. The compaction_executor variable at L56 is B336's per-call argument instead.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/context_compaction.py#L78-L91
    why: native_compaction_call and native_compaction_parent, built here.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/context_compaction.py#L153-L154
    why: is_native_compaction_call, built here.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/context_compaction.py#L317-L336
    why: B336's _generate_summary, the caller that enters the scope with no pair and awaits the executor.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/native_compaction.py#L38-L84
    why: The proxy executor B8291 ports, which enters the scope with the parent and the compactor inside a fresh task.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks.py#L4465-L4467
    why: The child's model access check reads native_compaction_parent.
dod:
  - text: CompactionExecutor is object safe with the four-argument execute over B3545's protocol and Mapping, and CompactionExecutorError shows only its source's text and returns that source.
    proof: [executor-scope-tests]
  - text: native_compaction_call sets the child flag for its future and the parent pair only when both names are non-empty, nested scopes restore the outer pair, and a spawned task does not inherit the scope.
    proof: [executor-scope-tests]
  - text: native_compaction_parent answers the parent only for the matching compactor inside a scope, and is_native_compaction_call only inside one.
    proof: [executor-scope-tests]
  - text: Mutants in the new router module are caught.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: executor-scope-tests
      why: the executor trait, its error, or the child-call scope and its two readers are missing or wrong
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^compaction_executor::tests::/)'
oracle_cases: []
deviations:
  - what: CompactionExecutor's execute takes logging_disabled as a fourth argument; LiteLLM's executor reads turn_off_message_logging from the privacy context variable the summary call inherits.
    why: Rust has no inherited context variables, and the value depends on the parent payload, so the summary caller passes it on each call.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/native_compaction.py#L39-L42
out_of_scope:
  - "litellm/router_strategy/complexity_router/context_compaction.py: B336 owns surface_for_call (L68-L69), initialize_compaction_state (L94-L96), arm_compaction (L99-L123), _has_compactor (L126-L138), _client_managed (L141-L150), reject_recursive_compactor (L157-L159), compaction_pending (L162-L164), _reject (L167-L170), _generate_summary (L317-L336), compact_to_fit (L360-L371), _check_client_managed_admission (L374-L387) and _compact_to_fit (L416-L515), and passes the executor per call in place of the compaction_executor variable (L56)."
  - "litellm/router_strategy/complexity_router/context_compaction.py: B385 owns _unavailable (L173-L176), _blocks (L179-L181), _tool_ids (L184-L202), _history (L205-L232), _count (L235-L241), _budget (L244-L263), _compactor_model (L266-L297), _native_prefix (L300-L314), _compactor_input (L339-L357) and _portable_history (L390-L413)."
  - "The loopback executor that implements the trait: B8291. Building it per request: B100. Passing it to compact_to_fit on the gateway routes: B9810."
pitfalls:
  - A tokio task-local is not inherited by tokio::spawn, unlike a Python context variable copied into asyncio.create_task, so the scope covers only the future given to native_compaction_call; code that reads it from a spawned task must enter the scope there.
  - "LiteLLM sets the parent pair only when `parent_model and compactor` holds, so Some(\"\") for either name leaves the pair empty while the child flag is still set."
  - The trait cannot carry a generic method or an associated error type, or `&dyn CompactionExecutor` stops compiling in B336's compact_to_fit.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
