id: B10084
title: Compaction executor trait and child-call scope
description: >-
  When context compaction needs a summary on the gateway, LiteLLM does not call the compactor model directly: it
  hands the summary request to a CompactionExecutor, and the proxy's executor sends it to itself as a child
  request (native_compaction.py). Both sides also mark that child call, so the router does not compact or
  auto-route it again and the child's model check can fall back to the parent's model. Those few names sit in
  context_compaction.py next to B336's 800-line compaction service, but B8291's loopback executor needs only them.
  This task builds them in betterlite-router, so B8291 can implement the trait and hold the scope without waiting
  on B336, and B336 calls them from here.


  Layout. Module compaction_executor in crates/betterlite-router/src/compaction_executor.rs, with its tests in
  compaction_executor/tests.rs. The skeleton declares it in lib.rs. Payloads and the protocol are B3545's types
  in betterlite-anthropic's native_compaction::protocol (`Mapping`, an IndexMap<String, Json>, and
  `CompactionProtocol` with Chat and Messages); add betterlite-anthropic to betterlite-router's Cargo.toml for
  them. B336 needs that dependency for B3545's dispatch anyway, and betterlite-anthropic depends on no router or
  server crate.


  The trait. `CompactionExecutor` is LiteLLM's protocol of L50-L53 as an #[async_trait] trait with `Send + Sync`
  (the crate already uses async-trait), because B336's compact_to_fit takes it as `Option<&dyn
  CompactionExecutor>`. Its one method is `execute(&self, protocol: CompactionProtocol, payload: &Mapping,
  parent_model: Option<&str>, logging_disabled: bool) -> Result<Mapping, CompactionExecutorError>`. The fourth
  argument is the message logging privacy flag that LiteLLM's executor reads from an inherited context variable
  (native_compaction.py L42); B336 decides it over the parent payload and passes it. `CompactionExecutorError`
  keeps whatever the executor failed with as a #[source] Box<dyn std::error::Error + Send + Sync>, and its Display
  is that source's text, nothing added. Every failure LiteLLM's executor raises is a BadRequestError (model
  "context_compaction", provider ""), so B336 answers it as one; B8291 puts its LoopbackError inside.


  The child-call scope. LiteLLM keeps two context variables, `_native_child` (default False) and
  `_native_parent` (default None), L46-L47. Here they become one tokio task-local that holds the parent pair, set
  only through `native_compaction_call`. Being inside the scope at all is the child flag.
  `native_compaction_call(parent_model: Option<&str>, compactor: Option<&str>, call: F) -> F::Output`, an async fn
  over any future F, runs `call` inside the scope (L79-L86). The parent pair is (parent_model, compactor) only when
  both are given and neither is empty, as LiteLLM's `parent_model and compactor` decides; otherwise the scope
  holds no pair. A nested call replaces the pair for its own future and the outer one comes back after it, as the
  context variable reset does. `native_compaction_parent(model: &str) -> Option<String>` (L89-L91) is the parent
  model when the current task is inside a scope whose pair has `model` as its compactor, else None.
  `is_native_compaction_call() -> bool` (L153-L154) says whether the current task is inside any scope. Callers:
  B336's summary call runs inside `native_compaction_call(None, None, ...)` (L326) and its fit check and
  reject_recursive_compactor read is_native_compaction_call; B8291 enters the scope with the parent and the
  compactor inside the task that runs the child request; the router's session resolver (router.py L13760) reads
  is_native_compaction_call; and the server code that builds betterlite-auth's CompactionContext for
  can_object_call_model (auth_checks.py L4465-L4467) reads native_compaction_parent.


  tokio's task_local! macro keeps its slot in a thread-local RefCell, which the workspace's disallowed_types
  denies, so the module carries one module-level #[expect(clippy::disallowed_types, reason = ...)] as
  betterlite-redis's request_batch::scope does; that is the one expect this task's budget allows.


  Tests in compaction_executor::tests: outside any scope is_native_compaction_call is false and
  native_compaction_parent is None; inside native_compaction_call(None, None) the flag is true and there is no
  parent; inside ("gpt-parent", "claude-compactor") native_compaction_parent("claude-compactor") is
  Some("gpt-parent") and native_compaction_parent("other") is None; an empty parent or compactor sets no pair; an
  inner scope with no pair hides the outer pair and the outer pair is back after it; a task spawned inside a scope
  does not see it, and a scope entered inside the spawned task does; a fake executor held as `&dyn
  CompactionExecutor` receives the protocol, payload, parent model and flag it was called with; and a
  CompactionExecutorError's Display equals its source's text and source() returns it. There is no oracle case:
  the scope only means something inside a running request, so nothing here is a pure function a helper could
  compare, and B336's router probes and B8291's executor tests run it in context.
scope:
  paths:
    - crates/betterlite-router/Cargo.toml
    - crates/betterlite-router/src/compaction_executor.rs
    - crates/betterlite-router/src/compaction_executor/**
  lint_tables: false
