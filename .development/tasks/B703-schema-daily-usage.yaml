id: B703
title: Postgres migrations for daily usage
description: >-
  Add the 28 scoped migrations, from add_daily_user_table through add_mcp_info_column_mcp_servers,
  as exact production SQL bytes and ordered MigrationCatalog entries after B702. Test each relevant
  historical checkpoint as well as the final cohort. B873 owns deployment/ledger/restart behavior;
  this task only provides SQL and schema_daily_usage tests. Existing columns/rows survive these ALTERs,
  but foreign-key delete behavior changes twice and must not be collapsed into its final definition.

  DailyUserSpend, DailyTeamSpend and DailyTagSpend have TEXT id primary keys, required date/api_key/
  model, initially required user_id/team_id/tag, nullable model_group/custom_llm_provider, required
  spend DOUBLE PRECISION 0 and TIMESTAMP(3) created_at now/updated_at without default. Their prompt,
  completion, cache-read/cache-creation token and API/successful/failed request counters are required
  INTEGER default 0 when introduced, then all seven become BIGINT. Check every intermediate addition
  and retain existing counts across widening. Each table has date, entity, api_key and model indexes
  plus uniqueness over (entity,date,api_key,model,custom_llm_provider). DailyTagSpend initially also
  makes tag globally unique; the next migration drops that index, retaining compound uniqueness.
  The later allow_null_entity_id drops NOT NULL on all three entity columns, with no backfill or
  replacement default. Preserve PostgreSQL's distinct-null behavior in these unique indexes.

  CronJob introduces JobStatus ENUM ('ACTIVE','INACTIVE'), required TEXT cronjob_id/pod_id, status
  default INACTIVE, last_updated TIMESTAMP(3) default now and required ttl without default. CREATE TYPE
  has no IF NOT EXISTS, so repeating that file fails with duplicate_object SQLSTATE 42710 even though
  its table creation is guarded. TeamTable.team_member_permissions and VerificationToken.allowed_routes
  are nullable TEXT arrays default []; SpendLogs.proxy_server_request is nullable JSONB {} and
  session_id/status nullable TEXT, with a later nonunique session_id index.

  ManagedFileTable has TEXT id primary key, unique and separately indexed unified_file_id, required
  JSONB model_mappings and initially required JSONB file_object. created_at defaults now and updated_at
  is required without default. Later add nullable created_by/updated_by and flat_model_file_ids TEXT[]
  default [], then allow file_object NULL. The plural ManagedVectorStoresTable requires TEXT
  vector_store_id/provider, has nullable name/description/metadata/credential_name, and the same
  required creation/update timestamps. These migration records do not activate enterprise managed
  file/batch hooks or load the named credential; B087 owns that pending runtime decision.

  MCPServerTable starts with required server_id/url, transport='sse', spec_version='2025-03-26',
  nullable alias/description/auth_type/actors and nullable created_at/updated_at default now. Add
  nullable status='unknown', last_health_check, health_check_error and finally mcp_info JSONB {}.
  ObjectPermissionTable has required TEXT object_permission_id primary key and nullable mcp_servers,
  later vector_stores TEXT arrays default []. Organization/Team/User/VerificationToken receive nullable
  object_permission_id foreign keys with delete SET NULL and update CASCADE. Keep their source
  database-wide conname guards; no extra permission rows or application grants are created by SQL.

  GuardrailsTable requires TEXT guardrail_id/name, unique name, JSONB litellm_params, nullable
  guardrail_info, created_at now and required updated_at without default. ManagedObjectTable requires
  TEXT id/unified_object_id/model_object_id/file_purpose and JSONB file_object, nullable actors, created_at
  now and required updated_at; unified_object_id/model_object_id each have both unique and nonunique
  indexes. Its added status is nullable TEXT. HealthCheckTable requires health_check_id/model_name/
  status, INTEGER healthy_count/unhealthy_count default 0, checked_at/created_at default now and
  updated_at without default. model_id/error_message/checked_by, DOUBLE PRECISION response_time_ms and
  JSONB details are nullable without defaults; indexes cover model_name, checked_at and status.

  TeamMembership.budget_id changes from SET NULL to ON DELETE CASCADE in cascade_budget_changes,
  then returns to SET NULL in cascade_budget_and_loosen_managed_file_json. Both retain ON UPDATE
  CASCADE. Test a budget deletion at both checkpoints: the first deletes membership rows, the later
  one preserves them with a null budget. Each migration drops the old constraint before adding the
  new definition. Because the guards only match conname, a constraint in another schema can trigger
  a DROP against a missing local constraint, yielding undefined_object 42704; preserve the SQL rather
  than silently repairing it in this task.

  B860 provides separate temporary databases for upstream/candidate migration copies through
  POSTGRES_TEST_URL, falling back to testcontainers only when absent. Use B700 typed sessions to
  compare every column/default/nullability, index column order and foreign-key action, and clean up
  even on failure. No HTTP helper or external-byte parser is needed for static SQL. The cohort has
  264 nonblank, noncomment SQL lines but exact copying includes 418 physical lines; allocate 320
  Postgres/identity test lines and 30 registration lines, 768 within 800. Keep test modules below 300 lines.
