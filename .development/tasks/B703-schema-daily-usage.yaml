dod:
  - text: pinned_sql_checksums checks all 28 byte hashes and original ordered directory identities against upstream fixtures; postgres_catalog checks each intermediate column and final index definition independently.
    proof: [behavior-tests, postgres-tests]
  - text: 'postgres_daily_counters covers user_counter_additions, team_counter_additions,
      tag_counter_defaults, seven_counters_widen_preserving_values, values_above_i32_after_widen,
      entity_date_key_model_provider_uniqueness, tag_global_unique_then_dropped,
      nullable_entities_and_distinct_null_uniqueness and required_updated_at_without_default.'
    proof: [postgres-tests]
  - text: 'postgres_resource_defaults covers cron_inactive_and_required_ttl, cron_enum_repeat_42710,
      team_permissions_and_key_routes_empty_nullable_arrays, spend_proxy_json_session_status_and_index,
      managed_file_initial_required_json_then_nullable, managed_file_actor_and_flat_ids,
      plural_vector_store_fields, mcp_sse_protocol_and_unknown_health,
      mcp_info_empty_object, object_permission_empty_arrays_and_four_set_null_foreign_keys,
      guardrail_unique_name_and_required_params, managed_object_two_unique_and_two_lookup_indexes,
      managed_object_nullable_status and health_check_defaults_and_three_indexes.'
    proof: [postgres-tests]
  - text: 'postgres_budget_foreign_key_history covers intermediate_budget_delete_cascades_membership,
      final_budget_delete_sets_membership_null, budget_id_update_cascades,
      prior_rows_unchanged_by_constraint_replacement and other_schema_constraint_drop_42704.'
    proof: [postgres-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_daily_usage::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Historical defaults, index definitions or foreign-key effects differ from independently applied SQL.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_daily_usage::tests::postgres_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B702 supplies the baseline; B704-B709 own later migration cohorts and B701 the final schema comparison.
  - B873 deploys migration files and writes their ledger; B716 owns locking/recovery, neither is duplicated here.
  - B087 owns managed-file/batch hook behavior; these schema definitions alone install no hook or credential processing.
pitfalls:
  - The file named cascade_budget_and_loosen_managed_file_json changes the budget foreign key back to SET NULL.
  - CronJob's CREATE TYPE is unguarded, so the whole cohort is not safe to replay merely because most tables use IF NOT EXISTS.
  - The tag-only unique index exists at one checkpoint and is intentionally absent at the next.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: standard
