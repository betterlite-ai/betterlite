id: B1061
title: Vector endpoint access
description: >-
  Resolve managed vector stores and authorize vector-store and file endpoint paths against the source permission
  map. Apply path suffix and operation-specific rules before data lookup or credential resolution, reusing vector-store-access
  decisions.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-core/src/api/vector_endpoint_access.rs. Use VectorEndpointAccessInput and VectorEndpointAccessResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): utils.py:331 status_code=403, exception_detail=FastAPI detail string; utils.py:479 status_code=403,
  exception_detail=FastAPI detail string; utils.py:497 status_code=403, exception_detail=FastAPI detail string;
  utils.py:554 status_code=403, exception_detail=FastAPI detail string; utils.py:318 status_code=500, exception_detail=FastAPI
  detail string; utils.py:286 status_code=500, exception_detail=FastAPI detail string. Compare the actual source
  status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions vector_search_permission, vector_file_write_permission, unknown_endpoint_rule,
  managed_store_not_found, suffix_boundary under api::vector_endpoint_access::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::VectorEndpointAccess in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {vector_endpoint_access: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/vector_store_endpoints/utils.py: get_litellm_managed_vector_store (L260-L321);
  litellm/proxy/vector_store_endpoints/utils.py: assert_user_can_access_vector_store (L324-L331); litellm/proxy/vector_store_endpoints/utils.py:
  assert_user_can_access_vector_store_id (L334-L351); litellm/proxy/vector_store_endpoints/utils.py: _does_endpoint_match
  (L354-L361); litellm/proxy/vector_store_endpoints/utils.py: check_vector_store_permission (L364-L411); litellm/proxy/vector_store_endpoints/utils.py:
  is_allowed_to_call_vector_store_endpoint (L414-L502); litellm/proxy/vector_store_endpoints/utils.py: is_allowed_to_call_vector_store_files_endpoint
  (L505-L559). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 208 owned nonblank/non-comment/non-docstring Python lines (244 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 228 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 478 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B207 (Route and call-type metadata
  matching), B1060 (Vector store access), B1087 (Api boundaries), B726 (Managed resources and transaction repositories),
  B858 (Typed managed-resource and analytics rows), B002 (Load LiteLLM config.yaml into typed config). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.
