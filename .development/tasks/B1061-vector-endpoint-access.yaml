checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_endpoint_access::/)
      - test(/::replays_corpus$/)'
  - id: case-vector-search-permission
    why: the vector-search-permission behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_endpoint_access::tests::vector_search_permission($|::)/)'
  - id: case-vector-file-write-permission
    why: the vector-file-write-permission behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_endpoint_access::tests::vector_file_write_permission($|::)/)'
  - id: case-unknown-endpoint-rule
    why: the unknown-endpoint-rule behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_endpoint_access::tests::unknown_endpoint_rule($|::)/)'
  - id: case-managed-store-not-found
    why: the managed-store-not-found behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_endpoint_access::tests::managed_store_not_found($|::)/)'
  - id: case-suffix-boundary
    why: the suffix-boundary behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_endpoint_access::tests::suffix_boundary($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/vector_endpoint_access.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/vector_endpoint_access-*)"
      && grep -qE "^[[:space:]]+vector_endpoint_access:" tools/oracle/fuzz/corpus/helper_case/vector_endpoint_access-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/vector-endpoint-access)"
