references: []
dod:
  - text: Each of the four contracts has one trait, its associated types carry no bound, and none of the ten copies, the two provider ClientError copies or the two SuppliedClient copies is left.
    proof: [no-copies, homes]
  - text: Every user names the home trait and bounds the client where it sends through it, and the owners' tests in core, provider, openai and python pass unchanged.
    proof: [core-tests, provider-tests, openai-tests, python-tests]
checks:
  optional: []
  commands:
    - id: no-copies
      why: a merged client-source trait, a provider ClientError copy, a SuppliedClient copy or CollectionClientSource is still in place
      run: |-
        test -z "$(grep -lE '^pub trait ClientSource\b' crates/betterlite-core/src/api/vector_file_http_write/service.rs crates/betterlite-core/src/api/vector_file_http_read/service.rs crates/betterlite-core/src/api/vector_file_http_create_list/service.rs crates/betterlite-core/src/api/responses_read_http/service.rs crates/betterlite-core/src/api/file_http_upload/service.rs crates/betterlite-core/src/api/responses_create_http/service.rs crates/betterlite-provider/src/api/speech_http.rs crates/betterlite-provider/src/api/image_edit_http/service.rs crates/betterlite-provider/src/api/rerank_http/client.rs)" &&
        test -z "$(grep -lE '^pub enum ClientError\b' crates/betterlite-provider/src/api/speech_http/error.rs crates/betterlite-provider/src/api/rerank_http/error.rs)" &&
        test -z "$(grep -lE '^pub struct SuppliedClient\b' crates/betterlite-core/src/api/vector_file_http_write/service.rs crates/betterlite-core/src/api/vector_file_http_create_list/service.rs)" &&
        test -z "$(grep -rn 'CollectionClientSource' crates tools --include=*.rs)"
    - id: homes
      why: a home trait still bounds its client, so the merged users cannot implement it
      run: |-
        grep -qx '    type Client;' crates/betterlite-core/src/api/vector_store_http_write/service.rs &&
        grep -qx '    type Client;' crates/betterlite-core/src/api/responses_compact_http/service.rs &&
        grep -qx '    type Client;' crates/betterlite-core/src/api/file_http_content/service.rs &&
        grep -qx '    type Blocking;' crates/betterlite-openai/src/containers/container_file_http/transport.rs &&
        grep -qx '    type Asynchronous;' crates/betterlite-openai/src/containers/container_file_http/transport.rs
    - id: core-tests
      why: a merged trait user in core lost its client selection, its timeout or its error mapping
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(vector_store_http_write|vector_file_http_write|vector_file_http_read|vector_file_http_create_list|vector_file_read|vector_store_http_create_read|vector_store_search|vector_search_execution|file_http_metadata|file_http_upload|file_http_content|responses_read_http|responses_lifecycle_call|responses_compact_http|responses_compact_call|responses_create_http|responses_create_call|responses_create|container_collection_http|container_create_list|container_file_endpoints|container_file_list|container_resource_http|container_resource_ops)::/) - test(/replays_/)'
    - id: provider-tests
      why: the speech, image edit or rerank transport lost its client seam, or SpeechError or RerankHttpError changed with core's ClientError
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^(api::(speech_http|image_edit_http|rerank_http)|azure_media_dispatch)::/) - test(/replays_/)'
    - id: openai-tests
      why: the container file transport no longer selects its blocking or async client
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^containers::container_file_http::/)'
    - id: python-tests
      why: the container sources no longer build both clients through the one trait
      run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^container_(calls|files)::transport::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "The client-source traits with a different contract, listed in the description: responses_write_http, genai_http, videos_http_transport, transcription_http, image_generation_http, the two azure seams, the three video sync-and-async seams and realtime_http_transport."
  - "The rest of the same family, for a later plan: ClientKind copies (core responses_read_http/service.rs L34, responses_compact_http/service.rs L35, responses_write_http/service.rs L31, provider image_edit_http/service.rs L25, rerank_http/client.rs L16, image_generation_http.rs L23), SuppliedClient copies over their own ClientKind or a `mode: Mode` field (responses_read_http L54, responses_compact_http L44, responses_write_http L62, file_http_upload L39, provider speech_http.rs L88, image_edit_http/service.rs L30, rerank_http/client.rs L31, image_generation_http.rs L43, videos_http_transport/client.rs L84), and request structs that match field for field (vector_store_http_write::WriteRequest L56, responses_write_http::WriteRequest L67, responses_compact_http::CompactRequest L93 and provider SpeechWireRequest L64; vector_file_http_write::WriteRequest L34 and vector_file_http_create_list::FileRequest L52) with the transport traits over them."
  - "B7876's ProxiedSource in crates/betterlite-python/src/vector_manage/source.rs implements the contract 1 home at its current path and needs no change."
pitfalls:
  - "B7877 must land first: its ProxiedSource implements three of the deleted traits for one type, which cannot compile once they are one trait. Its ProxiedClient implements FileTransport, ReadTransport and WriteTransport, so one impl with `type Client = ProxiedClient` serves every bound."
  - "On main only betterlite-python's container_calls Source implements two of the merged traits, and its forwarding impl goes; no other type does, so no impl clashes. Check that again for anything B7877 or a merge from main adds."
  - "Only fns and impl blocks that reach the client need the bound. A struct definition keeps `S: ClientSource`; writing the bound there too forces it on every user of the struct."
  - "Bounds follow the deleted trait's own line: image_edit_http keeps `+ Clone`, and vector_file_http_write's WriteTransport is its own trait, not vector_store_http_write's."
  - "Files near the line caps: core file_http_upload/tests.rs has 994 of 1000 lines, responses_create/tests/support.rs 996 of 1000, vector_file_read/service.rs 292 of 300, responses_compact_http/service.rs 291 of 300 and container_collection_http.rs 291 of 300. Keep each bound on the line it replaces so rustfmt does not grow them."
  - "A dispatched run builds nothing, so find every site with the rg line in the description before committing; each missed bound costs a CI round."
  - "speech_http's and rerank_http's tests and the oracle fixtures call `ClientError::Pool` and `ClientError::Tls`; core's enum has the same variants, so only the import changes."
review_level: standard
budget:
  max_changed_lines: 1100
  max_new_expects: 0
