deviations:
  - what: Reads that fail are logged and returned as a miss (`None`) exactly as LiteLLM does, but the failure is a typed `BatchReadsError` value logged through B393's helper, not a caught Python `Exception`.
    why: Rust has no catch-all exception; the observable result (None plus one ERROR log line) is the same.

out_of_scope:
  - LimitedSizeOrderedDict, the DualCache constructor, _backfill_kwargs, single-key get_cache and async_get_cache, and every write, increment and delete operation of dual_cache.py; B4293 and B4295 own them and this module only reads their fields.
  - RedisBatch, BatchResult and the request pipeline (`mget`, `active_request_redis_batch`); B4330 and B4331 own them. declare_batch_get receives the batch from its caller.
  - The Redis client's own batch_get_cache and async_batch_get_cache and the circuit breaker; B360 and B393.
  - The memory tier's batch_get_cache and async_batch_get_cache; B2226 and B4290.
  - Arming the routing and update_cache prefetch slots in routing_read_batch.py and proxy_server.py; B382 and the proxy server tasks call this module.

pitfalls:
  - The sync read returns the memory result as is (a tuple in LiteLLM) when nothing goes to Redis, but a fresh list after a Redis read; the Rust return type is one `Vec<Option<Json>>` and callers see equal contents either way.
  - The reservation stores the new time for a due key before the Redis call, so a key skipped inside `redis_batch_cache_expiry` stays skipped until the window passes; only the rollback after a failed read lifts it.
  - A repeated key in one `keys` list is fetched once when throttled (its second occurrence sees the time just stored) and twice when `throttle_redis` is false, which is what `declare_batch_get` uses.
  - "`LimitedSizeOrderedDict` drops its oldest entry when it holds `max_size` items, even on an update of an existing key; the reservation relies on B4293's behavior and must not add its own eviction."
  - In the shared read, the shared client is the first pair's client; if that cache has no Redis, every other cache with Redis is read on its own, and caches that also lack Redis go through the prepare path with no Redis keys.
  - In the shared read an empty `reads` slice returns an empty list and no Redis call; the other early return (no Redis keys) returns the memory results, with a failed prepare still `None`.
  - After a non-circuit failure of the shared read only caches that had Redis keys become `None`; a cache served entirely from memory keeps its result.
  - "`apply_batch_get` gets only a cache's own keys in the shared read, so one cache's backfill never writes another cache's keys into its memory tier."
  - "`async_resolve_batch_get` is the only read that does not swallow errors; the proxy caller decides what a failed declared read means."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
