    - id: batch-reads-sync
      why: sync batch_get_cache behavior is missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^batch_reads::tests::sync_read_/)'
    - id: batch-reads-async
      why: async batch_get_cache or prepare and apply behavior is missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^batch_reads::tests::async_read_/)'
    - id: batch-reads-declared
      why: declared read or its resolve behavior is missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^batch_reads::tests::declared_/)'
    - id: batch-reads-shared
      why: shared multi-cache read behavior is missing
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^batch_reads::tests::shared_/)'
