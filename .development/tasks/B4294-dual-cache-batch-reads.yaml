dod:
  - text: The reservation picks only memory-missed keys that have no recorded access time or one at least redis_batch_cache_expiry old, stores the new time under one lock hold, and rollback restores or removes each key.
    proof: [batch-reads-reserve, oracle, helper-python]
  - text: reserve_redis_batch_reads returns empty results without Redis and otherwise reserves from the memory tier's current contents.
    proof: [batch-reads-reserve]
  - text: Sync batch_get_cache returns the memory result for full hits, local_only and missing Redis, backfills Redis values with the memory TTL, keeps the memory result on a circuit-open error and returns None on any other error, rolling back reservations in both cases.
    proof: [batch-reads-sync, oracle, helper-python]
  - text: Async batch_get_cache honors throttle_redis, merges Redis values over memory misses only, leaves the result untouched for an all-None Redis result, and handles errors like the sync read.
    proof: [batch-reads-async, oracle, helper-python]
  - text: declare_batch_get takes every missing key without throttling and issues no MGET for an empty list, and async_resolve_batch_get applies the awaited result with backfill.
    proof: [batch-reads-declared]
  - text: async_batch_get_cache_shared sends one merged, de-duplicated Redis read for caches on the same client, reads other clients on their own, and reports a failed read per cache as None, or as the memory result for a circuit-open error.
    proof: [batch-reads-shared, oracle, helper-python]

