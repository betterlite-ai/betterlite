id: B4294
title: Reserve and share dual-cache batch reads
description: >-
  Add the `batch_reads` module to betterlite-cache. It holds every batch-read operation of LiteLLM's DualCache as
  an `impl DualCache` block, so B4293's `DualCache` struct is reused and not copied. B4293 must make the fields this
  module touches visible to the crate: the memory tier, the optional Redis tier, `last_redis_batch_access_time`
  (the `LimitedSizeOrderedDict` and its lock), `redis_batch_cache_expiry` and `default_in_memory_ttl`. It also
  owns `_backfill_kwargs`, which this module calls to put the memory TTL on every value read back from Redis.

  Types. `PendingBatchRead` is the state between the memory half and the Redis half of a read: `keys`, `result`
  (one `Option<Json>` per key, from memory), `redis_keys` (the keys that must go to Redis) and
  `previous_access_times` (key to the reserved access time it replaced, `None` when there was none).
  `DeclaredBatchRead` has `keys`, a `PendingBatchRead` and an optional `BatchResult` of the Redis MGET (B4330);
  it is `None` when no key needs Redis. Values are the `arguments::json::Json` type, as in B4293.

  Reservation. `reserve_redis_batch_keys(current_time, keys, result)` takes the access-time lock once and walks the
  keys in order. A key whose memory value is present is skipped. A key with no recorded access time, or whose
  recorded time is at least `redis_batch_cache_expiry` seconds old, is added to the returned key list, its old time
  is remembered (or `None`) and `current_time` is stored as its new access time. Everything happens under one lock
  hold, so two concurrent callers never both fetch the same key. `rollback_redis_batch_key_reservations` puts every
  remembered time back, and removes the key when there was none, also under the lock. The public
  `reserve_redis_batch_reads(keys)` returns two empty collections when Redis is absent. Otherwise it reads the
  memory tier with `batch_get_cache` (all `None` if the tier gives nothing), calls the reservation with the wall
  clock, and returns the keys and previous times. B382's routing prefetch calls it, then rolls back through the
  same function if its read fails.

  Sync read. `batch_get_cache(keys, parent_otel_span, local_only, kwargs)` reads memory first. It returns the memory
  result right away when every key hit, when Redis is absent, or when `local_only` is set. Otherwise it reserves,
  returns the memory result if no key is due, and calls Redis `batch_get_cache` with the due keys. On a Redis error
  it rolls back the reservations; for B393's circuit-open error it logs at debug level and returns the memory
  result, and for any other error it falls to the outer handler. On success it backfills every non-`None` Redis
  value into memory with the backfill kwargs and returns the memory result with each `None` slot replaced by the
  Redis value for that key. The outer handler logs through B393's `log_redis_failure` at ERROR with the message
  "LiteLLM Cache: exception in batch_get_cache" and returns `None`, so a failed read is a miss, not an error.

  Async read. `prepare_batch_get(keys, local_only, throttle_redis, kwargs)` reads memory with
  `async_batch_get_cache`, and when a key is missing, Redis is present and `local_only` is false it picks the Redis
  keys: the reservation when `throttle_redis` is true, and every missing key (no throttle, duplicates kept) when it
  is false. `apply_batch_get(pending, redis_result, kwargs)` returns `pending.result` unchanged when the Redis
  result is absent or holds only `None`; otherwise it merges (the Redis value wins for keys in the Redis result,
  the memory value stays for the rest) and backfills each non-`None` Redis value into memory with the backfill
  kwargs. `async_batch_get_cache(keys, parent_otel_span, local_only, throttle_redis, kwargs)` runs prepare, returns
  `pending.result` when there are no Redis keys, calls the Redis `async_batch_get_cache`, handles the circuit-open
  error and other errors exactly like the sync read, then applies. The outer handler logs
  "LiteLLM Cache: exception in async_batch_get_cache" and returns `None`.

  Declared read. `declare_batch_get(keys, batch)` runs prepare with `local_only` false and `throttle_redis` false
  (declared reads take every missing key, since B4331's request pipeline already de-duplicates the round trip),
  and returns a `DeclaredBatchRead` whose result is `batch.mget(redis_keys)` or `None` when the list is empty.
  `async_resolve_batch_get(declared)` awaits that result if there is one and applies it. An error from the awaited
  result propagates; it is not caught here. proxy_server.py:3879 and :3891 are the callers.

  Shared read. `async_batch_get_cache_shared(reads, parent_otel_span)` takes a slice of `(DualCache, keys)` pairs and
  returns one `Option<Vec<Option<Json>>>` per pair, in order. The first pair's Redis client is the shared one. A
  cache whose Redis client is not that same client (compare identity, not equality) is read on its own with
  `async_batch_get_cache`. For each other cache, prepare runs with `local_only` false and throttling on, and a
  prepare error is logged (see below) and leaves that slot `None`. The Redis keys of all prepared caches are
  merged in first-seen order without duplicates and sent in one `async_batch_get_cache` call on the shared client;
  if there are no keys, or no shared client, the memory results are returned as they are. If the shared read fails,
  every prepared cache rolls back its reservations. For the circuit-open error the memory results stay and one
  debug line "LiteLLM Cache: async_batch_get_cache_shared served from memory only: <error>" is logged. For any
  other error, each cache that had Redis keys gets `None` and one error is logged. On success each cache is given
  only its own keys from the shared result (the ones in its `redis_keys` that appear in the result), runs apply, and
  a failed apply gives `None` for that slot and logs. The log helper writes "LiteLLM Cache: exception in
  async_batch_get_cache_shared" through `log_redis_failure` at ERROR with the traceback.

  Errors. The module owns a `BatchReadsError` enum for failures of the memory tier or of Redis; the read operations
  above turn it into the logged-and-`None` result, never into a panic or a returned `Err`. Only
  `async_resolve_batch_get` returns the error to its caller. Use the typed error names from B2226, B4290, B360
  and B393 as sources, and no `unwrap` or `expect` in the module.

  Crate: betterlite-cache. No config key or environment variable is read here; `redis_batch_cache_expiry` is set
  by B4293's constructor (default 10 seconds from `litellm.default_redis_batch_cache_expiry`).

  Tests. Native tests live under `batch_reads::tests`. Name them by branch: `reserve_` (skip on memory hit, first
  reserve, still throttled inside the expiry, due again at exactly the expiry, rollback restoring and removing),
  `sync_read_` (all hit, local_only, Redis absent, backfill with the memory TTL, circuit-open, other error returns
  `None`), `async_read_` (throttle on and off, duplicate keys, merge, all-`None` Redis result), `declared_` (empty
  list gives no result, resolve applies and backfills) and `shared_` (different Redis client, merged keys without
  duplicates, circuit-open, other failure, per-cache slice, apply failure).

