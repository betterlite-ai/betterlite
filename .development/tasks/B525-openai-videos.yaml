id: B525
title: OpenAI video create list and retrieval
description: >-
  Add typed VideoCreate/VideoObject and provider create/list/status/content/remix/delete calls. Reuse B672 provider
  video/character ID and multipart helpers and B1120 MIME inference. Represent duration exactly and preserve binary
  content; this task owns API request/reply mapping, not the shared ID codec.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/videos/transformation.py:
  OpenAIVideoConfig.__init__ L47-L48; OpenAIVideoConfig.get_supported_openai_params L50-L63; OpenAIVideoConfig.map_openai_params
  L65-L72; OpenAIVideoConfig.validate_environment L74-L91; OpenAIVideoConfig.get_complete_url L93-L105; OpenAIVideoConfig.use_multipart_form_data
  L107-L108; OpenAIVideoConfig.transform_video_create_request L110-L146; OpenAIVideoConfig.transform_video_create_response
  L177-L200; OpenAIVideoConfig.transform_video_content_request L202-L232; OpenAIVideoConfig.transform_video_remix_request
  L234-L262; OpenAIVideoConfig.transform_video_content_response L264-L270; OpenAIVideoConfig.transform_video_remix_response
  L272-L299; OpenAIVideoConfig.transform_video_list_request L301-L334; OpenAIVideoConfig.transform_video_list_response
  L336-L375; OpenAIVideoConfig.transform_video_delete_request L377-L399; OpenAIVideoConfig.transform_video_delete_response
  L401-L412; OpenAIVideoConfig.transform_video_status_retrieve_request L414-L434; OpenAIVideoConfig.transform_video_status_retrieve_response
  L436-L452; OpenAIVideoConfig.get_error_class L454-L461.


  Use B672 video/character id and multipart helpers and B1120 get_image_content_type. input_reference strings remain
  multipart file bodies, including URL-shaped strings; no download or URL rejection occurs. seconds="4" produces
  usage.duration_seconds=4.0, retaining the JSON decimal shape through the exact-number wire type.


  Reuse encode_video_id_with_provider from B672 (litellm/types/videos/utils.py); its implementation remains with
  that prerequisite.


  Reuse extract_original_video_id from B672 (litellm/types/videos/utils.py); its implementation remains with that
  prerequisite.


  Named case contracts: video_create_multipart: Advertise model,prompt,input_reference,seconds,size,characters,user,extra_headers
  and copy every option regardless of drop_params. Create strips option model,prompt,extra_headers, uses required
  model/prompt, decodes character IDs through B672, removes input_reference from form data and adds it as a file
  only when not None; always multipart. list_and_status: List keeps api_base unchanged, decodes after through B672
  when non-None, stringifies non-None limit, preserves non-None order and merges extra_query last. When provider
  is truthy and data exists, wrap each dictionary id with its model, and wrap truthy first_id/last_id using the
  first/last data-item model; status wraps id with model=None but adds no usage. remix_request: Decode provider
  video ID then path-encode with field_name=video_id; append /<id>/remix. Body starts with prompt and extra_body
  can overwrite it. Remix responses wrap a truthy id with model=None and replace usage with duration conversion
  just like create. delete_response: Delete/retrieve append /<encoded original id> with {}. Delete validates VideoObject
  without ID wrapping or synthetic usage. get_error_class raises BaseLLMException preserving supplied status/message/headers.
  duration_seconds_decimal: Create wraps a truthy id with provider and requested model. Create/remix replace usage
  with {}; a truthy parseable seconds adds duration_seconds=float(seconds), including string 0 becoming 0.0; numeric
  zero skips conversion. Invalid float text/type is silently retained in seconds with no duration usage. video_auth_chain:
  Use explicit api_key, then litellm_params.api_key, then litellm.api_key, litellm.openai_key and OPENAI_API_KEY,
  all by truthiness; overwrite Authorization with Bearer <key> or Bearer None. Default only a None api_base to https://api.openai.com/v1,
  strip trailing slashes and append /videos. video_content_variant: Content appends /<encoded original id>/content
  and adds ?variant=<percent-encoded value> whenever variant is not None, including empty; thumbnail&extra=1 cannot
  inject another query key. Return {} alongside the URL and preserve raw content bytes.


  Write standalone Rust test openai_videos_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_videos_secret_safe_failure in betterlite-openai: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B2202 BaseLLMException for get_error_class; do not duplicate its synthetic request/response defaults.


  Implement crates/betterlite-openai/src/videos.rs with adjacent tests under videos/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function videos_cases in betterlite-openai with these exact named cases (one per oracle file): video_create_multipart,
  input_reference, list_and_status, remix_request, delete_response, binary_content, invalid_seconds_kept_without_usage,
  duration_seconds_decimal, video_auth_chain, video_content_variant. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_videos* using HelperCase: kind: helper
  and the externally tagged openai_videos variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_openai_videos that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_video_reply consumes video create/list/status JSON response bytes in crates/betterlite-openai/src/videos.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_videos.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_videos.
  The adjacent test replays_the_openai_videos_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 299 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 325 production lines, 240 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
