pitfalls:
- 'The oracle helper for this task is pre-registered as openai_videos in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/videos.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_videos.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- List cursor wrapping is inside the data-key branch, so first_id/last_id alone remain native even with a provider.
- Deletion returns VideoObject without wrapping its id; applying the retrieve response transform would change it.
