checks:
  optional:
  - mutants
  commands:
  - id: case-video-create-multipart
    why: The video-create-multipart behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_video_create_multipart$/)'
  - id: case-input-reference
    why: The input-reference behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_input_reference$/)'
  - id: case-list-and-status
    why: The list-and-status behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_list_and_status$/)'
  - id: case-remix-request
    why: The remix-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_remix_request$/)'
  - id: case-delete-response
    why: The delete-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_delete_response$/)'
  - id: case-binary-content
    why: The binary-content behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_binary_content$/)'
  - id: case-invalid-seconds-kept-without-usage
    why: The invalid-seconds-kept-without-usage behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_invalid_seconds_kept_without_usage$/)'
  - id: case-duration-seconds-decimal
    why: The duration-seconds-decimal behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::videos_cases::case_[0-9]+_duration_seconds_decimal$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_videos.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_videos*")"
      && grep -lq 'openai_videos' tools/oracle/fuzz/corpus/helper_case/openai_videos* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_videos$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_videos)"
      && grep -q 'decode_video_reply' crates/betterlite-openai/fuzz/fuzz_targets/openai_videos.rs && cargo nextest
      run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_videos_corpus$/)'
