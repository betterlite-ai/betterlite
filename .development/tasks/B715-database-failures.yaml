id: B715
title: Database outage classification and bounded lookup
description: >-
  Implement bounded database lookup and a single reconnect-and-retry for idempotent reads over DbFault.
  Preserve PROXY_DB_LOOKUP_DEADLINE_SECONDS=10, reconnect timeout 2 seconds and lock timeout 0.1 seconds.
  Cancellation releases permits and owned abandoned lookups; metrics carry safe operation metadata without
  SQL parameters.


  Build the production database_failures module in betterlite-db; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/db_lookup_gate.py:
  LoopBoundSemaphore.__init__ (L17-L20; 4 source lines), LoopBoundSemaphore.current (L22-L27; 6 source
  lines), DBLookupDeadlineExceeded.__init__ (L31-L34; 4 source lines), DBLookupStallTracker.__init__ (L40-L42;
  3 source lines), DBLookupStallTracker.record_hit (L44-L45; 2 source lines), DBLookupStallTracker.clear
  (L47-L48; 2 source lines), DBLookupStallTracker.stalled_within (L50-L53; 4 source lines), _consume_abandoned_lookup
  (L60-L62; 3 source lines), bounded_db_lookup (L65-L90; 26 source lines). litellm/proxy/db/log_db_metrics.py:
  _safe_db_event_metadata (L17-L25; 8 source lines), log_db_metrics (L28-L103; 61 source lines), _is_exception_related_to_db
  (L106-L114; 7 source lines), _handle_logging_db_exception (L117-L140; 21 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): PROXY_DB_LOOKUP_DEADLINE_SECONDS='10'.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::database_failures::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 151 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  151 production, 145 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 376 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
