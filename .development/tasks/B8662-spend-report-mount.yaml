deviations: []
out_of_scope:
  - "The handlers and the composed router: B1721 to B1727, B1729 to B1732 and B069. The callback itself: B069 and B1719."
  - "The spend log and capture rate HTTP cases: B8663. The daily activity routes: B8482. The analytics and agent activity routes: B8661."
  - "Draining B1708's producer at shutdown: B069 owns the drain, and the area hooks have no stop step."
pitfalls:
  - "routes/callback_replay is already in router(); merging B1709's router again here panics on the duplicate path."
  - "Merge the spend routes before B8661's analytics lines, not after, so /openapi.json lists them in LiteLLM's include order."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
