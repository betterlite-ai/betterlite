id: B3817
title: Derive MCP identity scopes and access-token claims
description: >-
  Implement pure claim validation, identity resolution, least-privilege scopes, ordered claim overrides and the channel/debug projections. Accept already-resolved options, auth fields and a clock value so these helpers can be tested independently of key creation and HTTP verification.

  `_validate_required_claims` checks that every claim in the configured `required_claims` list has a truthy value in the verified incoming token; missing or falsey claims raise HTTP 403 with a list of what is missing and guidance to configure the IdP. An empty or absent required_claims list passes through.

  `_resolve_end_user_identity` returns the outbound JWT "sub" claim using the ordered `end_user_claim_sources` list. Each source has a prefix: `token:claim_name` reads from verified incoming JWT/introspection claims (or the LiteLLM jwt_claims context if available), `litellm:user_id` / `litellm:email` / `litellm:end_user_id` / `litellm:team_id` read the corresponding field from UserAPIKeyAuth. Unknown sources log a warning and continue. The first source that yields a truthy value is returned; if none do, fall back to a stable hash of the API token (`apikey:` prefix plus the first 16 hex chars of SHA256) for service-account callers, or `litellm-proxy` if no token exists. Stable API-key hash fallback is never logged.

  `_build_scope` returns the JWT scope string. When `allowed_scopes` is configured to a nonempty list, join them verbatim. Otherwise auto-generate least-privilege scopes: tool call with a name yields `mcp:tools/call mcp:tools/<sanitized_name>:call`, a tool call without a name yields `mcp:tools/call` only (never a list permission), and a tools/list request yields `mcp:tools/list`. Tool names are sanitized by replacing characters outside [a-zA-Z0-9_-] with underscores. An explicit empty allowed_scopes list (empty but configured) produces an empty scope string.

  `_apply_claim_operations` applies add_claims (insert only when key absent), set_claims (always override, highest priority), and remove_claims (delete listed keys) in that order. Modify the input dict in place and return it.

  `_passthrough_optional_claims` forwards every claim named in `optional_claims` that exists in the verified incoming JWT and is absent from the outbound claims dict. Return early if either the config list or the incoming claims are absent/empty.

  `_build_claims` builds JWT claims for the outbound MCP access token. Call `_resolve_end_user_identity` for "sub", include "iss", "aud", "iat", "exp", "nbf" timestamps (expiry is iat + ttl_seconds), pass "email" when user_email exists, set "act" to {sub: team_id or org_id or "litellm-proxy"}, pass "end_user_id" when set separately, call `_build_scope` for the scope claim, apply `_passthrough_optional_claims`, then apply claim operations. Accept already-resolved auth/options so these helpers can be unit tested independently.

  `_build_channel_token_claims` builds claims for the channel token (two-token model). Copy sub, act, and scope from the access token (base_claims), but override aud to channel_token_audience and replace iat, exp, nbf with fresh now/channel_token_ttl timestamps.

  `_build_debug_header` is a static method that formats the x-litellm-mcp-debug header value: `v=1; kid=<kid>; sub=<sub>; iss=<iss>; exp=<exp>; scope=<scope>`. Scope is truncated to 77 characters plus "..." when longer than 80 characters. Field order matters for compatibility.

  All helpers accept already-resolved options so they can be tested as pure functions without constructing MCPJWTSigner or verifying incoming tokens. Tests pass a test clock as a parameter instead of calling time.time() (which B3816 calls at the signer boundary, not here).

