dod:
  - text: >-
      Required claims validation rejects HTTP 403 when any claim in required_claims is absent or falsey, lists the missing claims and advises configuring the IdP. Empty required_claims passes through.
    proof: [claim-validation-tests]
  - text: >-
      End-user identity resolves using the ordered end_user_claim_sources list, trying token: / litellm: prefixes in order, falling back to API-key SHA256 hash prefixed with "apikey:" for service accounts without identity, and finally "litellm-proxy". Unknown sources log a warning and continue.
    proof: [identity-resolution-tests]
  - text: >-
      Scope building returns configured allowed_scopes when non-empty, else auto-generates least-privilege scopes: tool call with name yields "mcp:tools/call mcp:tools/<name>:call", tool call without name yields "mcp:tools/call" only, tools/list yields "mcp:tools/list". Tool names sanitize non-alphanumeric characters to underscores.
    proof: [scope-building-tests]
  - text: >-
      Claim operations apply add_claims (insert absent keys only), set_claims (override), and remove_claims (delete) in that order.
    proof: [claim-operations-tests]
  - text: >-
      Optional claims passthrough copies every claim in optional_claims that exists in the incoming JWT and is absent from the outbound claims dict.
    proof: [optional-claims-tests]
  - text: >-
      Core claims builder includes iss/aud/iat/exp/nbf/sub, email when present, act delegation with team/org context, end_user_id when set, scope from _build_scope, and applies optional_claims passthrough then claim operations.
    proof: [claims-builder-tests]
  - text: >-
      Channel token claims copy sub/act/scope from access token and replace aud/iat/exp/nbf with channel-specific audience and TTL.
    proof: [channel-token-tests]
  - text: >-
      Debug header formats v=1; kid=<kid>; sub=<sub>; iss=<iss>; exp=<exp>; scope=<scope> with scope truncated to 77 characters plus "..." when longer than 80 characters.
    proof: [debug-header-tests]

checks:
  optional: []
  commands:
    - id: claim-validation-tests
      why: Required claims validation fails when required claim is absent, or passes when list is empty.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::validate_required_claims::/)'
    - id: identity-resolution-tests
      why: Identity resolves from configured sources in order, falls back to API-key hash, and warns on unknown sources.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::resolve_end_user_identity::/)'
    - id: scope-building-tests
      why: Scope generation follows least-privilege rules, sanitizes tool names, and respects configured allowed_scopes.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::build_scope::/)'
    - id: claim-operations-tests
      why: Add/set/remove operations apply in correct order with correct semantics.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::apply_claim_operations::/)'
    - id: optional-claims-tests
      why: Optional claims pass through from incoming JWT when absent in outbound claims.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::passthrough_optional_claims::/)'
    - id: claims-builder-tests
      why: Core builder combines all claim sources, timestamps, identity and scope correctly.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::build_claims::/)'
    - id: channel-token-tests
      why: Channel token claims inherit access token claims and apply separate audience/TTL.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::build_channel_token_claims::/)'
    - id: debug-header-tests
      why: Debug header formats correctly and truncates scope at 77 characters plus "...".
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^mcp_token_claims::build_debug_header::/)'

oracle_cases: []

deviations:
  - what: >-
      Truncation of debug header scope uses 77 characters plus "..." when longer than 80 characters, preserving LiteLLM's exact limit and format.
    why: Header safety and compatibility with MCP spec.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/mcp_jwt_signer/mcp_jwt_signer.py#L785-L786

out_of_scope:
  - >-
      Key generation and storage (B3816); these helpers accept already-resolved options. HTTP verification and OIDC discovery fetch (B3816); these helpers validate resolved claims after verification. MCPJWTSigner initialization and constructor; these helpers are pure functions accepting resolved state. Outbound signing and header injection (B109); call-site decision and composition.

pitfalls:
  - >-
      Scope building with an explicit empty allowed_scopes list (configured but empty) produces an empty scope string, not auto-generated scopes. Check for `is not None` on the configured list, not truthiness.
  - >-
      Tool call without a tool name falls back to "mcp:tools/call" only (not list permission), preserving separation of concerns between tool listing and tool invocation.
  - >-
      Identity sources are tried in configured order and the first truthy value wins; unknown sources log a warning and continue rather than raising. API-key hash fallback is stable (SHA256 is deterministic) but never logged even for service accounts.
  - >-
      Claim operations run in order (add, set, remove) so set_claims can override add_claims and remove_claims can delete both. Order matters for composition with external overrides.
  - >-
      Optional claims fill gaps only (absent from outbound claims), so add_claims and set_claims take precedence. They run before claim operations, which have final say.
  - >-
      Channel token claims inherit numeric timestamps (iat/exp/nbf) from base_claims as-is but replace them with fresh now values. Only copy string/object claims like sub/act/scope; timestamps must be recalculated.
  - >-
      Debug header truncation preserves field order (v, kid, sub, iss, exp, scope in that sequence) and uses exactly "..." for truncation marker when scope exceeds 80 characters.

review_level: security
