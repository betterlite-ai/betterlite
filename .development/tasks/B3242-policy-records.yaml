references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/policy_engine/resolver_types.py#L66-L433
    why: Own all response records from PolicyScopeResponse through AttachmentImpactResponse; preserve exact field names, defaults, nullability and descriptions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_registry.py#L58-L160
    why: Own _PolicyRow, _PolicyVersionSourceRow protocols and _PolicyTableClient; own _policy_table, _policy_version_source_table factory functions and _row_to_policy_db_response adapter.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_registry.py#L564-L588
    why: Own get_policy_by_id_from_db; preserve exception logging and None return on not found.
dod:
  - text: Policy CRUD request records capture all input fields with proper nullability and description; database response records match every Prisma column.
    proof: [behavior-tests]
  - text: Versioning records preserve version status enumeration, version_number defaults, parent_version_id, publication/production dates and is_latest flag.
    proof: [behavior-tests]
  - text: Attachment records capture scope fields (teams, keys, models, tags), priority and default marker with proper descriptions and types.
    proof: [behavior-tests]
  - text: Inspection records project policy values to response formats via B3240 accessors; resolved_guardrails and inheritance_chain are lists; summary dict key-values preserve policy names.
    proof: [behavior-tests]
  - text: Resolution records encode policy match context, pipeline test inputs, effective guardrails and match reasons with metadata.
    proof: [behavior-tests]
  - text: Row protocol properties match database types exactly; adapter converts rows to PolicyDBResponse using property access with correct defaults for optional columns.
    proof: [behavior-tests]
  - text: Single-version lookup queries database by policy_id, returns None on not found, logs and re-raises on error with no fallback.
    proof: [behavior-tests]
  - text: The independent helper operations policy_records_records and policy_records_lookup match the production implementation in every case.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Record fields or defaults missing or row adapter mismapping database columns.
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^records::tests::/) + test(/^row_adapter::tests::/) + test(/^lookup::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Helper adapters missing or Python checks fail.
      run: test -f tools/oracle/helpers/b3242.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No seed corpus or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/policy-records-*")" && grep -rlq '"b3242' tools/oracle/fuzz/corpus/helper_case/policy-records-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
