id: B3242
title: Policy database records and single-version lookup
description: >-
  Build typed request/response records for policy CRUD, versioning, attachment,
  inspection and resolution. Adapt database rows to policy records and provide
  single-version lookup by ID without loading or publishing registry state.

  PolicyDBResponse and PolicyListDBResponse model a policy row: ID, name, version,
  status, parent version, publication/production dates, inheritance, description,
  guardrails add/remove lists, condition and pipeline objects, metadata fields
  (created_at, updated_at, created_by, updated_by) and source (db or config).
  PolicyVersionCreateRequest captures source_policy_id for cloning a version.
  PolicyVersionStatusUpdateRequest and PolicyVersionListResponse handle version
  management. PolicyVersionCompareResponse lists differing fields between two versions.
  PolicyAttachmentCreateRequest/Response and PolicyAttachmentListResponse model
  attachment scope, priority and default marker. PolicyAttachmentDBResponse adds
  metadata and source.

  Inspection records export policy fields in three formats: PolicyInfoResponse
  shows a single policy with resolved guardrails and inheritance chain;
  PolicySummaryItem is a flat view for /policy/list; PolicyListResponse wraps
  a summary dict with total_count. PolicyTestResponse shows matching result.
  Resolution records: PipelineTestRequest carries pipeline definition and test
  messages; PolicyResolveRequest describes a context (team_alias, key_alias,
  model, tags); PolicyResolveResponse returns effective guardrails and policy
  match details with matched_via reason; PolicyMatchDetail names a matched
  policy and its contributed guardrails. AttachmentImpactResponse previews
  attachment impact: affected counts (keys, teams), unnamed counts and samples.

  Policy condition and scope in responses project exact add/remove, teams, keys,
  models, tags, and inherit fields from Policy and PolicyScope values via B3240
  accessors, preserving empty-list defaults and None fields.

  _PolicyRow and _PolicyVersionSourceRow protocols define database row interfaces:
  properties for every column matching Prisma types (strings, ints, nullables,
  JSON objects as dicts). _PolicyTableClient provides async methods (create,
  find_unique, find_many, update, update_many, delete, delete_many) accepting
  dicts for where/data clauses and returning rows. _policy_table returns a typed
  client from PolicyRepository; _policy_version_source_table returns the same
  client as TableActions[_PolicyVersionSourceRow]. _row_to_policy_db_response
  converts a row to PolicyDBResponse using property access with defaults for
  optional fields (version_number defaults 1, version_status defaults production,
  is_latest defaults true). get_policy_by_id_from_db queries by policy_id,
  catches exceptions, logs errors and returns None if not found.
