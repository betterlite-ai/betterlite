    - tools/oracle/cases/helpers/policy-records/**
    - tools/oracle/cases/helpers/policy-records-attachment/**
    - tools/oracle/cases/helpers/policy-db-lookup/**
    - tools/oracle/fuzz/corpus/helper_case/policy-records-*
    - tools/oracle/fuzz/corpus/helper_case/policy-db-lookup-*
    - tools/oracle/helpers/b3242.py
    - tools/oracle/helpers/b3242/**
    - tools/oracle/src/helpers/policy/b3242.rs
    - tools/oracle/src/helpers/policy/b3242/**
