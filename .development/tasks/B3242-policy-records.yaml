deviations: []
out_of_scope:
  - B3240 owns Policy, PolicyScope, PolicyGuardrails, PolicyCondition, PolicyAttachment value types and their accessors; this task uses them to populate response records.
  - B726 owns PolicyRepository and TableActions interface in betterlite-db::auxiliary_repository; this task reuses them via protocol.
  - B3241 owns in-memory registry and policy parsing; this task does not interact with registry state.
pitfalls:
  - >-
    PolicyDBResponse and PolicyListDBResponse are database response models; PolicyCreateRequest
    and PolicyUpdateRequest are CRUD input models. GuardrailsAdd and GuardrailsRemove in
    inputs map to guardrails_add and guardrails_remove in responses; the database stores
    lists which become lists in the response, not dicts.
  - >-
    PolicyInfoResponse and PolicySummaryItem both have resolved_guardrails and
    inheritance_chain lists, but Info shows a single policy while Summary is a flat
    view for list endpoints. List endpoint's summary dict keys are policy names.
  - >-
    PolicyAttachmentCreateRequest uses scope (string "*" for global) plus optional
    teams/keys/models/tags lists; PolicyAttachmentDBResponse adds attachment_id, source,
    timestamps and metadata (created_by, updated_by). Config attachments have synthetic
    IDs.
  - >-
    Version status is one of "draft", "published", "production" (not "active" or "live").
    is_latest reflects version_number ordering, not publication state. published_at and
    production_at are nullable and set by version operations.
  - >-
    Condition object in responses is dict[str, Any] because JSON columns store dicts;
    PolicyConditionRequest has model field only, but full condition objects can appear
    in CRUD and DB responses.
  - >-
    AttachmentImpactResponse has affected_keys_count, affected_teams_count (total) and
    unnamed_keys_count, unnamed_teams_count (subset without aliases), plus sample lists
    up to 10 items each. Negative affected counts are possible (-1 for global scope
    unbounded).
  - >-
    _row_to_policy_db_response uses property access with defaults for version_number (1),
    version_status (production), is_latest (true), and parent_version_id (None).
    Other fields are taken directly or default to empty lists (guardrails_add/remove).
review_level: standard
