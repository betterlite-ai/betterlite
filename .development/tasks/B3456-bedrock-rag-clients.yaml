id: B3456
title: Bedrock RAG clients and knowledge base resource primitives
description: >-
  Build the first half of LiteLLM's BedrockRAGIngestion in a new module of the betterlite-rag crate:
  its typed settings, its signed AWS request client, and the knowledge base resource steps that need no
  OpenSearch. B3457 builds the rest (OpenSearch collection and index, IAM role, the provisioning flow,
  store and the wait loop) on top of this module, so keep every public name stable and documented.
  The module must not import betterlite-core. The caller (B3457, later B3460) builds the settings from
  the vector_store_config map, so this task takes plain typed inputs. The Python class also inherits
  BaseRAGIngestion; that wiring is B3457's. Boto3 does not exist in Rust: every boto3 call becomes a
  SigV4-signed HTTPS request sent through an injected transport trait, using B595's AwsSignedRequest
  and B594's AwsCredentialResolver. Never hand-roll SigV4 and never add an AWS SDK service crate.

  Settings (`BedrockRagSettings`, built from a serde_json map by a `from_vector_store_config` function).
  knowledge_base_id is vector_store_id, else knowledge_base_id (an empty string counts as absent, since
  Python uses `or`). data_source_id and s3_bucket are optional strings. configured s3_prefix is kept only
  when truthy; the working s3_prefix defaults to "data/". embedding_model defaults to
  "amazon.titan-embed-text-v2:0". wait_for_ingestion defaults to false (the class docstring says True,
  the code says False; the code wins). ingestion_timeout defaults to 300: an absent or null value gives
  300, a number is truncated toward zero, a numeric string is parsed, anything else is a typed error
  (Python int() would raise ValueError). aws_region_name is resolved through B591's non-LLM region
  function (explicit value, then AWS_REGION_NAME, then AWS_REGION, then us-west-2, validated); an
  empty explicit string counts as absent here. The ten credential keys aws_access_key_id,
  aws_secret_access_key, aws_session_token, aws_session_name, aws_profile_name, aws_role_name,
  aws_web_identity_token, aws_sts_endpoint, aws_external_id are each kept as `str(value)` when present and
  not null (an empty string is kept), held as secrecy values where secret. Resource state
  (`BedrockRagState`) starts with data_source_id and s3_bucket empty, s3_prefix set, and a
  `CreatedResources` record with Option<String> fields s3_bucket, opensearch_collection, iam_role,
  knowledge_base and data_source (B3457 fills the collection and role fields).

  Client (`BedrockRagClients`). `signed_request(service, method, url, body)` resolves credentials with
  the full set of keys above and the resolved region on every call (B594 owns the cache), signs with
  AwsSignedRequest for the given service name and region, sends through the injected `AwsRagTransport`
  trait and returns status and body bytes. A non-2xx status becomes `BedrockIngestionError::Aws` with
  operation, status and the first 1024 bytes of the body (never the headers or credentials). Endpoints
  come from the region partition (B198 `get_aws_partition` dns_suffix): bedrock-agent is
  https://bedrock-agent.{region}.{dns_suffix}. S3 CreateBucket goes to https://{bucket}.s3.{region}.{dns_suffix}/
  (https://{bucket}.s3.{dns_suffix}/ for us-east-1, as boto3 does) and falls back to path style
  https://s3.{region}.{dns_suffix}/{bucket} when the bucket name contains a dot or uppercase letter.
  Request and response bodies are typed serde structs whose JSON field names are the AWS API names
  (knowledgeBaseId, dataSourceSummaries, inclusionPrefixes and so on). Each operation is a plain method
  on `BedrockRagClients`. STS, IAM, OpenSearch Serverless and S3 PutObject calls belong to B3457,
  which reuses `signed_request_with(service, signing_region, method, url, headers, body)`: the same
  call with extra request headers (Content-Type, X-Amz-Target) and an explicit signing region, since IAM
  signs in the partition global region (us-east-1, cn-north-1 or us-gov-west-1). `signed_request` calls it
  with no headers and the resolved region.

  Operations and wire shapes (check each against the AWS API reference before writing the struct):
  ListDataSources is POST /knowledgebases/{knowledgeBaseId}/datasources/ with an empty JSON object;
  GetDataSource is GET /knowledgebases/{knowledgeBaseId}/datasources/{dataSourceId};
  CreateKnowledgeBase is PUT /knowledgebases/; GetKnowledgeBase is GET /knowledgebases/{knowledgeBaseId};
  CreateDataSource is PUT /knowledgebases/{knowledgeBaseId}/datasources/. The two Create calls also carry
  a random clientToken (uuid v4), which boto3 adds by itself. S3 CreateBucket is PUT with an XML body
  <CreateBucketConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><LocationConstraint>REGION</LocationConstraint></CreateBucketConfiguration>
  only when the region is not us-east-1, plus the x-amz-content-sha256 header.

  Resource steps (methods on `BedrockRagState` plus clients, in `resources.rs`).
  `auto_detect_config` (L141-L188): list data sources for the knowledge base; an empty
  dataSourceSummaries list is the error "No data sources found for Knowledge Base {id}. Please create a data source first or provide data_source_id and s3_bucket.".
  The configured data_source_id wins, otherwise the first summary's dataSourceId. Then GetDataSource and read
  dataSource.dataSourceConfiguration.s3Configuration (missing parts count as empty). With a non-empty
  bucketArn the bucket is the configured s3_bucket, else the text after the last ":" of the ARN; the
  working prefix becomes the first inclusionPrefixes entry only when the list is non-empty and no s3_prefix
  was configured. With no bucketArn the configured s3_bucket is used, and without one the error is
  "Could not auto-detect S3 bucket for data source {data_source_id}. Please provide s3_bucket in config.".
  Only the first page of data sources is read, as in Python.
  `create_s3_bucket(unique_id)` (L229-L244): name "litellm-kb-{unique_id}", LocationConstraint only when
  the region is not us-east-1, records created_resources.s3_bucket and returns the name.
  `create_knowledge_base(kb_name, role_arn, collection_arn)` (L516-L562): body exactly as the source
  (type VECTOR, embeddingModelArn "{arn_prefix}bedrock:{region}::foundation-model/{embedding_model}",
  storage type OPENSEARCH_SERVERLESS with the collectionArn, fieldMapping metadataField
  AMAZON_BEDROCK_METADATA, textField AMAZON_BEDROCK_TEXT_CHUNK, vectorField
  bedrock-knowledge-base-default-vector, vectorIndexName bedrock-kb-index). Record
  created_resources.knowledge_base right after the create call, then call GetKnowledgeBase up to 30 times,
  stopping at status ACTIVE and sleeping 2 seconds (tokio::time::sleep) after each non-ACTIVE check, so a
  never-ready knowledge base does 30 checks, 30 sleeps, then fails with `KnowledgeBaseTimeout`.
  `create_data_source(kb_name)` (L564-L585): name "{kb_name}-s3-source", S3 configuration with bucketArn
  "{arn_prefix}s3:::{bucket}" and inclusionPrefixes [s3_prefix]; records created_resources.data_source and
  returns dataSourceId. `normalize_principal_arn(caller_arn, account_id)` (L41-L62): an ARN containing
  ":assumed-role/" becomes "arn:{partition}:iam::{account_id}:role/{role_name}" where partition is the second
  colon part and role_name the second "/" part; every other ARN is returned unchanged.
  Tests that wait use `#[tokio::test(start_paused = true)]`, so no real sleeping.

