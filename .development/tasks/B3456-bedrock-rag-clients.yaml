deviations:
  - what: AWS calls are SigV4-signed HTTPS requests built by betterlite, not boto3 clients. Oracle cases compare the operation name and its AWS-named parameters, and native tests check the wire method, path and signing.
    why: Rust has no boto3, and the rules forbid pulling an AWS SDK service crate for four calls.
  - what: Endpoints come only from region and partition. AWS_ENDPOINT_URL, AWS_ENDPOINT_URL_S3 and shared-config endpoint overrides that boto3 reads are ignored.
    why: Overrides are hidden global destinations; betterlite sends requests only to the URLs this task derives. Open question in notes.
  - what: A non-numeric ingestion_timeout is a typed error returned from settings parsing.
    why: Python int() raises ValueError at construction too, so the only change is the error type.
  - what: The missing-boto3 ImportError branch of _get_boto3_client does not exist.
    why: There is no optional dependency to import.

out_of_scope:
  - "_ensure_config_initialized, _create_knowledge_base_infrastructure, _create_opensearch_collection, _create_opensearch_index and _create_bedrock_role: B3457 owns provisioning and calls the primitives here; they need STS, IAM, OpenSearch Serverless and opensearch-py equivalents."
  - "embed (returns None) and store (S3 PutObject, StartIngestionJob and the wait loop): B3457 implements them on the ingestion trait from B3451."
  - "BaseRAGIngestion state, credential overlay from litellm_credential_name and upload, OCR and chunking: B3451 owns them."
  - "Credential resolution, region validation, SigV4 signing and partition lookup: B594, B591, B595 and B198 own them; this task only calls them."
  - "The async_safe_get and pooled HTTP client: B173 owns them; this task defines only the small transport trait the adapter implements."

pitfalls:
  - ListDataSources is a POST in the AWS API even though it only reads; a GET returns 403 or 404.
  - The two Create calls need clientToken in the body, and the same uuid must not be reused across calls.
  - The S3 us-east-1 case sends no body at all; an empty LocationConstraint element is rejected by S3 with InvalidLocationConstraint.
  - bucketArn "arn:aws:s3:::my-bucket" gives "my-bucket" by taking the text after the last colon, and an empty bucketArn means "not detected", not an error by itself.
  - A configured s3_bucket beats the ARN bucket, but a configured s3_prefix is the only thing that blocks the inclusionPrefixes override.
  - The knowledge base wait sleeps after the 30th failed check before it raises, so the total virtual time is 60 seconds.
  - created_resources.knowledge_base is recorded before the wait, so a timeout still reports the id for cleanup.
  - "Region cn-north-1 and us-gov-west-1 change both the ARN prefix and the DNS suffix, so never hard-code arn:aws: or amazonaws.com."
  - Credential keys are str()-cast, and an empty string stays an empty string instead of becoming absent.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
