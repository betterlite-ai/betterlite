dod:
  - text: Settings read vector_store_id before knowledge_base_id, treat an empty id as absent, and apply the defaults for embedding model, prefix "data/", wait_for_ingestion false and ingestion_timeout 300.
    proof: [settings-tests]
  - text: ingestion_timeout accepts null, numbers and numeric strings and returns a typed error for other values; the region follows the B591 non-LLM precedence.
    proof: [settings-tests]
  - text: normalize_principal_arn rewrites assumed-role ARNs to IAM role ARNs in every partition and returns other ARNs unchanged.
    proof: [principal-tests, oracle]
  - text: signed_request resolves credentials with all ten keys, signs for the named service and region, sends through the injected transport and turns a non-2xx status into a typed error that carries no credentials.
    proof: [client-tests]
  - text: signed_request_with signs the extra headers and uses the given signing region instead of the resolved one; signed_request is signed_request_with with no headers and the resolved region.
    proof: [client-tests]
  - text: Bedrock Agent and S3 endpoints, methods and paths match the AWS API for the commercial, China and GovCloud partitions, including us-east-1 and path-style S3 bucket names.
    proof: [client-tests]
  - text: auto_detect_config picks the configured or first data source, derives bucket and prefix from the data source, and fails with the two exact messages.
    proof: [detect-tests, oracle]
  - text: create_s3_bucket sends a LocationConstraint only outside us-east-1 and records the bucket.
    proof: [bucket-tests, oracle]
  - text: create_knowledge_base sends the exact VECTOR and OPENSEARCH_SERVERLESS body, records the knowledge base, waits through 30 checks with 2 second sleeps and then fails with KnowledgeBaseTimeout.
    proof: [kb-tests, oracle]
  - text: create_data_source sends the S3 configuration with the partition ARN prefix and records the data source.
    proof: [source-tests, oracle]
  - text: The helper adapter passes strict lint and type checks.
    proof: [helper-python]

checks:
  optional: []
  commands:
    - id: settings-tests
      why: settings parsing, defaults, id precedence or region resolution is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::(.*::)?tests::settings_/)'
    - id: principal-tests
      why: assumed-role ARN normalization is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::(.*::)?tests::principal_/)'
    - id: client-tests
      why: signed requests, endpoints, request paths or error mapping are missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::(.*::)?tests::client_/)'
    - id: detect-tests
      why: data source auto-detection is missing or its errors differ
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::(.*::)?tests::detect_/)'
    - id: bucket-tests
      why: S3 bucket creation or its region rule is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::(.*::)?tests::bucket_/)'
    - id: kb-tests
      why: knowledge base creation, its body or its wait loop is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::(.*::)?tests::kb_/)'
    - id: source-tests
      why: data source creation is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_ingestion::(.*::)?tests::source_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3456)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3456 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3456/pyrightconfig.json

