id: B1301
title: Vertex credential sources and configuration precedence
description: >-
  Add VertexSettings and the secret-bearing CredentialSource descriptor to betterlite-config;
  betterlite-vertex consumes that descriptor to construct credential handles. Own
  VertexBase.load_auth, its six _credentials_from_* constructors and the project, credential
  and location getters at the end of vertex_llm_base.py. Resolve vertex_project before
  vertex_ai_project before litellm_settings.vertex_project before VERTEXAI_PROJECT; resolve
  vertex_credentials before vertex_ai_credentials before VERTEXAI_CREDENTIALS. Location uses
  vertex_location, vertex_ai_location, litellm_settings.vertex_location, VERTEXAI_LOCATION,
  then VERTEX_LOCATION, remaining absent here. Keep explicit-location lookup free of fallback.
  Credentials may be a JSON object, JSON string or existing local filename; never treat a
  missing filename as empty credentials. betterlite-config::decode_vertex_credentials takes bounded UTF-8 JSON
  bytes and produces a secret-bearing enum. Choose service-account, authorized-user,
  external-account identity pool or AWS WIF by the source predicates; B1300 supplies explicit
  AWS credentials. Use a maintained Google auth implementation for exchange and ADC, passing
  an environment snapshot resolved in config (including GOOGLE_APPLICATION_CREDENTIALS and
  the SDK's documented ADC project/location inputs), local-file reader and HTTP policy rather
  than allowing an SDK to spawn gcloud. Refresh before checking the resulting project; explicit
  project wins, authorized-user quota_project_id is next, service-account/ADC project follows.
  Keep source errors and redact private_key/client_secret/refresh_token in Debug and logs.
  Register vertex_credentials helper cases only for the pure safe_get_vertex_ai_project,
  safe_get_vertex_ai_location, safe_get_vertex_ai_credentials and explicit-location projections.
  Native source tests cover local versus inline JSON, quota-project recovery, refresh-before-
  missing-project failure, ADC and external-account selection using injected SDK constructors.
  Neither helper adapter opens files, calls load_auth or refreshes a token. In config,
  vertex_settings::tests::loads_vertex_sources loads every alias,
  environment fallback and absent default through the actual loader. Credential decoder tests
  replay fuzz/corpus/vertex_credentials; helper seeds select call.vertex_credentials.
  The owned ranges total 219 nonblank noncomment lines. Allow 250 production, 190 tests,
  100 adapters, 90 decoder/fuzz and 100 configuration/wiring lines, within 780.
scope:
  paths:
    - crates/betterlite-vertex/Cargo.toml
    - crates/betterlite-vertex/src/credential_sources.rs
    - crates/betterlite-vertex/src/credential_sources/**
    - crates/betterlite-config/fuzz/Cargo.toml
    - crates/betterlite-config/fuzz/fuzz_targets/vertex_credentials.rs
    - crates/betterlite-config/fuzz/corpus/vertex_credentials/**
    - tools/oracle/Cargo.toml
    - tools/oracle/src/helpers/vertex/credentials.rs
    - tools/oracle/src/helpers/vertex/credentials/**
    - tools/oracle/helpers/vertex_credentials.py
    - tools/oracle/helpers/vertex_credentials/**
    - tools/oracle/cases/helpers/vertex-credentials/**
    - tools/oracle/fuzz/corpus/helper_case/vertex_credentials*
    - crates/betterlite-config/src/sections/vertex_credential_sources.rs
    - crates/betterlite-config/src/sections/vertex_credential_sources/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L123-L282
    why: Credential source selection, refresh ordering and project validation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L1149-L1247
    why: Mutating and safe getters share these exact setting priorities.
  - url: https://docs.rs/google-cloud-auth/latest/google_cloud_auth/credentials/index.html
    why: Native service-account, user-account and external-account builders.
dod:
  - text: JSON, path, ADC and authorized-user credentials retain their source selection, project recovery and refresh order.
    proof: [source-tests]
  - text: Safe settings getters preserve explicit, module and environment precedence without mutating their inputs.
    proof: [source-tests, oracle, credentials-python]
  - text: The config loader honors each Vertex spelling and refuses executable credentials without running anything.
    proof: [vertex-settings]
  - text: Credential JSON and helper variants survive their committed parser corpora.
    proof: [credential-corpora]
checks:
  optional: [mutants]
  commands:
    - id: source-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^credential_sources::/)'
      why: Credential selection, project recovery or redaction is incorrect.
    - id: vertex-settings
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/vertex_settings::tests::/) - test(/replays_the_/)'
      why: Loaded deployment aliases or executable-source rejection lack real loader tests.
    - id: credentials-python
      run: test -f tools/oracle/helpers/vertex_credentials.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: Source-oracle setup must remain independently executable and typed.
    - id: credential-corpora
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/vertex_credentials)" && test -f crates/betterlite-config/fuzz/fuzz_targets/vertex_credentials.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_vertex_credentials_corpus)' && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/vertex_credentials*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::vertex::credentials::/)'
      why: A new credential parser or helper input lacks a nonempty replayed corpus.
oracle_cases:
  - tools/oracle/cases/helpers/vertex-credentials/project-aliases.yaml
  - tools/oracle/cases/helpers/vertex-credentials/location-fallbacks.yaml
  - tools/oracle/cases/helpers/vertex-credentials/credential-aliases.yaml
  - tools/oracle/cases/helpers/vertex-credentials/explicit-location-only.yaml
deviations:
  - what: A credential_source.executable entry stops startup naming vertex_credentials. No command runs and no HTTP listener starts.
    why: The no-subprocess rule forbids Google's pluggable executable source; local credential files remain supported.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_llm_base.py#L181-L185
out_of_scope:
  - B1302 owns credential state and synchronous cache/refresh methods at L50-L94, L368-L521, L767-L815 and L872-L991.
  - B1303 implements background refresh, asynchronous token lookup and ensure-token wrappers at L523-L619, L817-L870 and L993-L1136.
  - B1304 handles the remaining URL/region/header functions at L31-L36, L96-L121, L284-L366, L621-L765 and L1138-L1147.
pitfalls:
  - 'The oracle helper for this task is pre-registered as vertex_credentials in the vertex group. Replace the stub Op in tools/oracle/src/helpers/vertex/credentials.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/vertex_credentials.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Empty project strings fail after refresh, whereas an omitted project may be recovered from credentials.
  - An authorized_user record exposes quota_project_id rather than the service-account project_id field.
  - VERTEXAI_CREDENTIALS has no litellm.vertex_credentials fallback in these getters.
budget:
  max_changed_lines: 780
  max_new_expects: 0
review_level: security
