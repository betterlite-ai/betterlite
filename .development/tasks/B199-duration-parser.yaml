deviations: []
out_of_scope:
- Budget persistence, admission and scheduled reset jobs belong to M4; this part supplies pure calculations.
- Do not add new accepted config keys until their owning feature consumes them.
pitfalls:
- 'The oracle helper for this task is pre-registered as duration in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/duration.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/duration.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The monthly word alias is a fixed duration while mo is calendar-dependent.
- >-
  The source regex accepts a valid prefix, so a library that enforces whole-string matching changes compatibility.
- Pin timezone inputs in oracle cases so the host timezone cannot decide the expected result.
- >-
  Jiff compares instants by default; Python same-tzinfo comparisons and naive local Nmo subtraction ignore offset
  changes.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
