  why: Zero intervals return current_time; monthly resets require exactly one month.
dod:
- text: Fixed and calendar durations, all reset units and injected timezone cases match Python on exact instants.
  proof:
  - oracle
  - helper-python
- text: >-
    Overflow, invalid forms/zones and trailing input have typed outcomes; no helper reads the wall clock or environment
    implicitly.
  proof:
  - duration-tests
- text: The duration parser corpus replays malformed inputs and calendar boundaries without panic or hang.
  proof:
  - duration-spec-corpus
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: duration-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/::duration_parser_duration_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: duration-spec-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/duration_spec)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/duration_spec.rs && test -n "$(ls -A crates/betterlite-core/fuzz/corpus/duration_spec)"
      && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(replays_the_duration_spec_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'duration' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
