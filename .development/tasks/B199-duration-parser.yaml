id: B199
title: Duration parsing and calendar resets
description: >-
  Add bounded duration parsing and calendar reset helpers in betterlite-core/duration, taking explicit current time,
  local timezone and reset policy. Reproduce the pinned duration/word-alias and standardized reset helpers through
  differential cases, keeping calendar months distinct from fixed-day aliases. Use the existing time dependency
  or compare jiff/chrono-tz before selecting a maintained timezone implementation; never implement a timezone database
  or call ambient local-time APIs in business logic. Preserve the pinned prefix parser behavior only with an explicit
  trailing-input diagnostic rather than silent truncation, and expose typed errors/warnings for invalid zones, overflow
  and unsupported forms. The Python helper controls its clock and timezone per case, and Rust uses the same injected
  values. Add duration_spec cargo-fuzz target and replay, including DST folds/gaps, leap dates and very large quantities.  Seed
  B171's shared helper_case corpus with every added operation and replay it through the common typed parser. Invalid
  reset timezone falls back to UTC; unparseable reset duration and unknown reset units fall back to next midnight
  with a typed warning. duration_in_seconds raises typed errors where Python raises. Retain reset-path exceptions
  too: _handle_month_reset rejects Nmo for N != 1, while zero day/week/hour/minute/second intervals return current_time
  unchanged (zero months still raises). For aware datetimes sharing a tzinfo, compare/subtract civil wall times
  as Python does; Nmo duration subtracts naive local datetimes, so DST shifts do not add/subtract an hour. Convert
  to an instant only when returning a reset, not during those civil comparisons. Write the behavior rstest functions
  duration_parser_duration_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure in the
  DoD; corpus replay tests have separate names. The helper operation duration is already registered; each operation has its own Rust and Python adapter file and corpus seed.
  Budget 270 duration/calendar logic, 110 adapters, 290 tests and 90 fuzz/replay wiring (760 total).
