id: B3697
title: Competitor intent classification and airline policy
description: >-
  Add competitor intent classification to betterlite-guardrails: implement the
  run() method for generic classification with ambiguous token resolution,
  and build the airline-specific AirlineCompetitorIntentChecker with travel/
  location versus airline context disambiguation. Load major airlines from
  competitor_intent/major_airlines.json, excluding the customer's brand_self
  from the competitors list.

  Extend crates/betterlite-guardrails/src/content_filter/mod.rs to export
  both implementations and create crates/betterlite-guardrails/src/
  content_filter/competitor_intent_airline.rs.

  Implement the following from litellm/proxy/guardrails/guardrail_hooks/
  litellm_content_filter/competitor_intent/:

  - BaseCompetitorIntentChecker::_classify_ambiguous() method: returns
  ("OTHER_MEANING", 0.5) for any token in the base implementation. Subclasses
  override for industry-specific logic.

  - BaseCompetitorIntentChecker::_find_matches(text) method: find normalized
  competitor and alias tokens using word-boundary matching, mark ambiguous
  tokens (in both competitor and location sets), return list of
  (token, canonical, is_ambiguous) tuples with deduplication on
  (token, canonical).

  - BaseCompetitorIntentChecker::run(text) method: main entry point that
  normalizes input, finds competitor matches, classifies ambiguous tokens,
  detects comparison and domain language, applies confidence thresholds, and
  returns CompetitorIntentResult with intent, confidence, entities,
  signals, action_hint and evidence list. When no competitors found: check for
  category_ranking (comparison + domain language, confidence 0.65) or return
  non-competitor. When competitors found but below OTHER_MEANING_THRESHOLD
  (0.65), treat as non-competitor. Otherwise classify intent: competitor_comparison
  at >= threshold_high (0.70), possible_competitor_comparison at >=
  threshold_medium (0.45), log_only at >= threshold_low (0.30), other below
  that. Confidence is 0.75 with comparison language, 0.55 without, 0.65 for
  category_ranking.

  - AirlineCompetitorIntentChecker class: subclass that configures airline-
  specific signals if not provided in config, loads major airlines dictionary
  excluding brand_self, adds airline domain_words (airline, airlines, carrier),
  and overrides _classify_ambiguous with airline context detection.

  - load_competitors_excl_brand(brand_self) function: load major_airlines.json
  from competitor_intent folder, parse match variants (pipe-separated), exclude
  airlines whose id or match variants overlap with brand_self, return flat list
  of match variants as competitor tokens. Return empty list if file missing or
  parse fails.

  - AirlineCompetitorIntentChecker::_classify_ambiguous(text, token) method:
  check explicit competitor/other-meaning markers first (confidence 0.85 if
  match). Treat operational-only signals (baggage/lounge/check-in/refund) with
  no comparison as OTHER_MEANING (0.85). Score travel/location context signals
  vs airline signals; return OTHER_MEANING when ratio >= 0.6 with confidence
  min(0.9, 0.5 + 0.4 * ratio), COMPETITOR when ratio >= 0.6 with same formula,
  else OTHER_MEANING (0.5). Operational-only signals plus comparison language
  skip the OTHER_MEANING shortcut and fall through to ratio-based scoring.

  - competitor_intent/__init__.py module: add AirlineCompetitorIntentChecker and
  BaseCompetitorIntentChecker to the re-exports B3696 already made public
  (normalize, text_for_entity_matching); keep exports-only, no logic.

  Include crates/betterlite-guardrails/src/content_filter/
  competitor_intent/major_airlines.json with 351 airline entries from LiteLLM
  major_airlines.json.

  Depend on betterlite-guardrails::content_filter::competitor_intent_base
  (B3696) for BaseCompetitorIntentChecker::__init__, normalize(),
  text_for_entity_matching(), _word_boundary_match(), _count_signals() and
  _compile_marker(). Depend on betterlite-config for CompetitorIntentResult
  and evidence types (B3690). Regex patterns must match LiteLLM's behavior
  exactly: case-insensitive matching, word boundaries, overlapping matches
  preserved. The module exports AirlineCompetitorIntentChecker and
  BaseCompetitorIntentChecker alongside B3696's normalize and text_for_entity_matching.

