oracle_cases: []

deviations:
  - what: "The base _classify_ambiguous implementation returns ('OTHER_MEANING', 0.5) for any ambiguous token, treating all ambiguities as non-competitor by default. This conservative behavior is preserved from LiteLLM and prioritizes not blocking legitimate content."
    why: "The base implementation provides a safe default; subclasses like AirlineCompetitorIntentChecker override with context-specific logic. Task description explicitly says 'do not correct that behavior based on the examples' description'."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/competitor_intent/base.py#L108-L112"
  - what: "The OTHER_MEANING_THRESHOLD constant (0.65) is checked after _classify_ambiguous returns COMPETITOR with low confidence, allowing a competitor to be downgraded to non-competitor if its confidence is below the threshold."
    why: "This two-stage classification (first by _classify_ambiguous, then by threshold check) matches LiteLLM's logic and prevents high-confidence ambiguities from being silently promoted."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/competitor_intent/base.py#L197-L206"

out_of_scope:
  - "Base text normalization and helper functions (belong to B3696)"
  - "CompetitorIntentResult and detection type definitions (belong to B3690)"
  - "Configuration loading and parsing from YAML (belongs to betterlite-config)"
  - "Integration with the content filter executor (belongs to B105)"
  - "Caching or performance optimization of competitor matching"
  - "HTTP routes for competitor intent configuration updates"
  - "Logging of competitor intent classification results (belongs to B3698)"

pitfalls:
  - "The normalize() call is from the base module (B3696), not repeated here; ensure the text passed to _classify_ambiguous is already normalized."
  - "Evidence entries for OTHER_MEANING have match but no value field; CompetitorIntentEvidenceEntry from B3690 must handle this with Option<String> or serde skip."
  - "Confidence values are rounded to 2 decimal places; use round(confidence * 100.0) / 100.0 or equivalent Rust method."
  - "The other_meaning_default signal carries confidence as a formatted string (e.g. 'confidence 0.45'); store this in evidence.match, not as a separate field."
  - "A token in both _competitor_tokens and _other_meaning_tokens is ambiguous (is_ambig=true); check the set intersection when populating the return list."
  - "Major airlines JSON parsing must handle pipe-separated match variants; 'air arabia|g9' expands to ['air arabia', 'g9']; words in each variant must be split for exclusion checking."
  - "Brand exclusion checks both the whole variant AND individual words within it; 'qatar airways' must exclude 'qatar' if brand_self contains 'qatar'."
  - "Explicit markers (EXPLICIT_COMPETITOR_MARKER, EXPLICIT_OTHER_MEANING_MARKER) are compiled as regex patterns; compile_marker returns None on error, requiring proper null handling."
  - "Operational-only signals (baggage, lounge, check-in, refund) only return OTHER_MEANING when comparison signals are absent; if comparison signals are present, fall through to ratio-based scoring."
  - "Ratio-based scoring computes other_count / (other_count + comp_count); division by zero is prevented by checking total == 0 first."
  - "The policy dict values are cast to CompetitorActionHint ('allow', 'reframe', 'refuse', 'log_only'); cast must be safe or use explicit enum conversion."
  - "OTHER_MEANING_THRESHOLD is 0.65; EXPLICIT_COMPETITOR_MARKER and EXPLICIT_OTHER_MEANING_MARKER are regex constants; load_competitors_excl_brand loads the airline dictionary."

review_level: standard

