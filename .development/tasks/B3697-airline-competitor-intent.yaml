dod:
  - text: "BaseCompetitorIntentChecker::_classify_ambiguous returns ('OTHER_MEANING', 0.5) for any token in the base implementation."
    proof: [classify-ambiguous-base-tests]
  - text: "_find_matches returns competitor and alias tokens as (token, canonical, is_ambiguous) tuples with deduplication on (token, canonical)."
    proof: [find-matches-tests]
  - text: "run() classifies text as competitor_comparison (confidence >= threshold_high), possible_competitor_comparison (>= threshold_medium), log_only (>= threshold_low), category_ranking (comparison + domain without competitors), or other."
    proof: [run-method-tests]
  - text: "Confidence is 0.75 when competitors are found and comparison language is present, 0.55 without comparison, and 0.65 for category_ranking."
    proof: [run-confidence-tests]
  - text: "Ambiguous tokens (in both competitor and location sets) are passed to _classify_ambiguous and classified as COMPETITOR or OTHER_MEANING."
    proof: [run-ambiguous-tests]
  - text: "Evidence entries are built with type (entity or signal), key (competitor, brand_self, comparison, category_ranking, other_meaning, other_meaning_default), match (matched substring) and value (resolved canonical form for entities)."
    proof: [evidence-building-tests]
  - text: "action_hint is resolved from policy or defaults (allow for non-competitor, reframe for category_ranking, log_only for intent=='log_only')."
    proof: [action-hint-tests]
  - text: "load_competitors_excl_brand loads major_airlines.json, parses match variants and excludes airlines overlapping with brand_self."
    proof: [load-airlines-tests]
  - text: "AirlineCompetitorIntentChecker initializes with airline-specific signals and domain_words if not provided in config."
    proof: [airline-init-tests]
  - text: "AirlineCompetitorIntentChecker::_classify_ambiguous detects explicit markers (confidence 0.85), operational-only signals (confidence 0.85), and scores location/airline context signals."
    proof: [airline-classify-tests]
  - text: "Airline context scoring: ratio >= 0.6 returns confidence min(0.9, 0.5 + 0.4 * ratio); total==0 returns OTHER_MEANING 0.5."
    proof: [airline-scoring-tests]
  - text: "All signal patterns (airline-specific OTHER_MEANING_SIGNALS, COMPETITOR_SIGNALS, OPERATIONAL_SIGNALS, COMPARISON_SIGNALS, explicit markers) match LiteLLM's patterns exactly."
    proof: [signal-patterns-tests]

