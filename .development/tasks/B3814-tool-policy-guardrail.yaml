id: B3814
title: Enforce stored tool policies and conversation trust chains
description: >-
  Add the module `tool_policy` to betterlite-guardrails. It is LiteLLM's ToolPolicyGuardrail: a guardrail that reads the stored per-tool policies and refuses a request or a response that breaks them. It builds on `GuardrailBase`, `GuardrailSettings`, `GuardrailContract`, `GuardrailApiInputs`, `GuardrailInputType` and `GuardrailFailure` from B5471. Request bodies are `BTreeMap<String, GuardrailValue>`. The guardrail owns no storage. B1606 owns the policy registry in betterlite-db, and betterlite-guardrails must not depend on that crate or on betterlite-auth, so the guardrail takes two injected traits and the server implements them.

  `ToolPolicyLookup` (Sync) has three methods. `is_initialized(&self) -> bool`. `effective_policies(&self, tool_names: &[String], key_permission_id: Option<&str>, team_permission_id: Option<&str>) -> BTreeMap<String, String>` returns the effective input policy per tool name (`blocked`, `trusted` or `untrusted`). `output_policy(&self, tool_name: &str) -> String` returns `trusted` or `untrusted`, and `untrusted` for a tool the store has never seen. `RequestToolNames` (Sync) has one method, `names(&self, route: &str, request_data: &BTreeMap<String, GuardrailValue>) -> Vec<String>`, which is B888's extract_request_tool_names. `ToolPolicyGuardrail { base: GuardrailBase, policies: Arc<dyn ToolPolicyLookup + Send + Sync>, names: Arc<dyn RequestToolNames + Send + Sync> }` is built by `ToolPolicyGuardrail::new(settings: GuardrailSettings, strict_modes: bool, policies, names) -> Result<Self, ToolPolicyError>`. When `settings.supported_event_hooks` is None, `new` sets it to `pre_call`, `post_call`, `during_call` before it calls `GuardrailBase::new`. A hook list already given is kept. `ToolPolicyError` wraps `GuardrailBaseError`.

  `initialize_tool_policy(params: &LitellmParams, guardrail_name: Option<&str>, strict_modes: bool, policies, names) -> Result<ToolPolicyGuardrail, ToolPolicyError>` is LiteLLM's initialize_guardrail. The name is the given one, else `tool_policy`. `event_hook` is `params.mode` and `default_on` is `params.default_on`; nothing else is read from the params. Callback-manager registration is the registry's job (B3682), not this task's.

  `apply_guardrail` implements `GuardrailContract` and follows the source in this order.

  1. Collect tool names. For `GuardrailInputType::Request`, take `inputs.tools` and keep the `function.name` of each tool that has a non-empty name. Tools without a function block or name are skipped. When that gives nothing, read the route with `request_route_from_data` and, only if the route is non-empty, ask `RequestToolNames::names(route, request_data)`. For `Response`, take `function.name` of each entry in `inputs.tool_calls` that has a non-empty one. Duplicates and order are kept.
  2. No names: return `inputs` unchanged.
  3. Read the permission ids with `permission_ids_from_data`. Then, if `is_initialized()` is false, return `inputs` unchanged. The ids are read before this check, which only matters for ordering of side effects, so keep the order.
  4. Stage 1, blocked tools. Call `effective_policies(names, key_id, team_id)`. Every name whose policy is `blocked` goes in the `blocked` list, in the order of `tool_names`, duplicates kept. When the list is not empty, log a warning `ToolPolicyGuardrail: blocking tool(s) {blocked:?} (input_policy=blocked)` and return `GuardrailFailure::HttpObject { status: 400, detail }`. `detail` is an IndexMap with the keys, in this order, `error` = `Violated tool policy`, `blocked_tools` (the list) and `message` = `Tool(s) {blocked} are blocked by policy.` where `{blocked}` prints the list the way Python prints a list of strings: `['a', 'b']`.
  5. Stage 2, trust chain, `Response` only. Let `trusted_input_tools` be the names whose policy is `trusted`. When it is empty, return `inputs`. Otherwise read `request_data["messages"]` (empty when missing or null) and build a map from tool call id to tool name with `tool_call_names_from_messages`. Then walk the messages in order; for each message with `role` equal to `tool`, look up its `tool_call_id` in the map. A message without an id, or with an id that no assistant message announced, is skipped. When `output_policy(source_tool)` is exactly `untrusted`, add the source tool to `untrusted_sources` once, in first-seen order. When `untrusted_sources` is not empty, log a warning `ToolPolicyGuardrail: trust chain violation, {trusted_input_tools:?} require trusted input but conversation has untrusted output from {untrusted_sources:?}` and return `GuardrailFailure::HttpObject { status: 400, detail }`. The detail object has the keys `error` = `Violated tool policy`, `blocked_tools` (the trusted tools), `untrusted_sources` and `message` = `{trusted joined by ", "} requires trusted input but conversation contains untrusted output from {sources joined by ", "}.`
  6. Otherwise return `inputs` unchanged.

  Helpers, all private to the module and named as in the source. `permission_ids_from_data(request_data) -> (Option<String>, Option<String>)`: an empty body gives `(None, None)`. For the keys `litellm_metadata` then `metadata`, skip a value that is not an object. If that object has `user_api_key_auth` as an object, read its `object_permission_id` and `team_object_permission_id`; when either is not null, return both. Otherwise read the flat keys `user_api_key_object_permission_id` and `user_api_key_team_object_permission_id` of the same object; when either is not null, return both. Each returned id is the value's text trimmed, and a falsy value (null or empty string) becomes None. Once a bucket holds a non-null id, the search stops there even when both ids end up None after trimming rules. When nothing matches in either bucket, return `(None, None)`. `request_route_from_data(request_data) -> Option<String>` returns the top-level `user_api_key_request_route` when it is a non-empty string. Otherwise it takes the object under `metadata` when that is a non-empty object, else the one under `litellm_metadata`, else an empty one, and returns its `user_api_key_request_route`. `tool_call_names_from_messages(messages) -> BTreeMap<String, String>`: for each message with `role` equal to `assistant`, for each entry of its `tool_calls` (missing or null means none), take `id` and `function.name`; when both are non-empty, store `id -> name`. A later call with the same id overwrites an earlier one.

  Python reads the auth object with getattr and accepts class instances as tool calls. betterlite reads only JSON objects, as docs/compatibility.md says for declared types, so there is no attribute branch. The native tests live in `tool_policy::tests` and use a fake `ToolPolicyLookup` that holds three maps. Name them with the prefixes in the checks below.

