    - tools/oracle/helpers/b3814.py
    - tools/oracle/helpers/b3814/**
    - tools/oracle/src/helpers/guardrails/b3814.rs
    - tools/oracle/src/helpers/guardrails/b3814/**
  lint_tables: false
