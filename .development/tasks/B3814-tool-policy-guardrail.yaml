    why: initialize_guardrail.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/tool_registry_writer.py#L367-L430
    why: What is_initialized, get_output_policy and get_effective_policies return, which the lookup trait mirrors.
dod:
  - text: A request with a tool whose effective policy is blocked fails with status 400 and a detail holding error, blocked_tools and message in that order, with duplicates kept and the names in request order.
    proof: [blocked-tests, oracle, helper-python, helper-case-corpus]
  - text: Request tool names come from tools[].function.name first, from the injected route extractor only when that list is empty and a route is set, and from tool_calls on a response.
    proof: [names-tests, oracle, helper-python, helper-case-corpus]
  - text: An uninitialized store, or no tool names, returns the inputs unchanged and never fails.
    proof: [passthrough-tests, oracle, helper-python, helper-case-corpus]
  - text: A response that calls a trusted-input tool fails when a tool message in the request's messages comes from a tool whose output policy is untrusted, and the detail lists each source once in first-seen order.
    proof: [trust-chain-tests, oracle, helper-python, helper-case-corpus]
  - text: The trust chain is not checked on the request side, and tool messages with no id or an unknown id are ignored.
    proof: [trust-chain-tests, oracle, helper-python, helper-case-corpus]
  - text: Key and team permission ids are read from the nested auth object first and the flat metadata keys second, trimmed, with litellm_metadata searched before metadata.
    proof: [permission-id-tests, oracle, helper-python, helper-case-corpus]
  - text: The route is read from the top-level key first and from metadata, then litellm_metadata, after that.
    proof: [permission-id-tests]
  - text: The constructor defaults the supported hooks to pre_call, post_call and during_call, keeps a list the caller gives, and initialize_tool_policy reads only name, mode and default_on.
    proof: [constructor-tests]
checks:
  optional: []
  commands:
    - id: blocked-tests
      why: the blocked stage is missing or reports the wrong status or detail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_policy::tests::blocked_/)'
    - id: names-tests
      why: tool names are collected from the wrong place or the route fallback fires too early
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_policy::tests::names_/)'
    - id: passthrough-tests
      why: an uninitialized store or an empty name list blocks or changes a request
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_policy::tests::passthrough_/)'
    - id: trust-chain-tests
      why: the trust chain stage is missing, runs on requests, or lists the sources wrongly
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_policy::tests::trust_/)'
    - id: permission-id-tests
      why: permission ids or the route are read from the wrong place or are not trimmed
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_policy::tests::ids_/)'
    - id: constructor-tests
      why: the default hooks or the initializer are wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^tool_policy::tests::constructor_/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3814)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3814 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3814/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added tool policy guardrail cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/policy-guardrail-*")" &&
        grep -lE '^[[:space:]]+b3814:' tools/oracle/fuzz/corpus/helper_case/policy-guardrail-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/tool-policy-guardrail/blocked-request-tool.yaml
  - tools/oracle/cases/helpers/tool-policy-guardrail/blocked-by-key-and-team.yaml
  - tools/oracle/cases/helpers/tool-policy-guardrail/blocked-response-tool-call.yaml
  - tools/oracle/cases/helpers/tool-policy-guardrail/uninitialized-store.yaml
  - tools/oracle/cases/helpers/tool-policy-guardrail/trust-chain-violation.yaml
  - tools/oracle/cases/helpers/tool-policy-guardrail/trust-chain-unknown-call-id.yaml
  - tools/oracle/cases/helpers/tool-policy-guardrail/trust-chain-request-side.yaml
  - tools/oracle/cases/helpers/tool-policy-guardrail/permission-id-flat-keys.yaml
deviations:
  - what: >-
      The policy registry and the route tool-name extractor are injected traits, and the guardrail returns `GuardrailFailure::HttpObject { status: 400, detail }` where LiteLLM raises HTTPException with a dict detail.
    why: betterlite-guardrails cannot depend on betterlite-db or betterlite-auth, and B5471's `HttpObject` variant carries the dict detail as an ordered map.
  - what: A tool call or auth value that is a Python object instead of a JSON object is not read.
    why: docs/compatibility.md leaves duck typing to the runtime; requests are JSON.
out_of_scope:
  - B1606 owns ToolPolicyRegistry, its refresh and get_tool_policy_registry. The server implements ToolPolicyLookup over it.
  - B888 owns extract_request_tool_names and the extractors behind it. The server implements RequestToolNames over it.
  - B3664 owns log_guardrail_information, which wraps apply_guardrail in LiteLLM. The caller of the hook starts and finishes the invocation record.
  - B3682 owns the guardrail registry that calls the initializer by name, and the registration with the callback manager.
  - B5471 owns CustomGuardrail's constructor checks, should_run_guardrail's callers and the other shared behavior.
pitfalls:
  - The trust chain reads `request_data["messages"]`, the request's own history, not the model response being checked, so the response tool_calls only supply the names.
  - A tool the store has never seen has output policy `untrusted`, so a trusted-input tool fails after any tool message whose tool is unknown to the store.
  - Only the exact text `untrusted` counts as tainted; `trusted` and any other value do not.
  - Stage 1 runs on both request and response, and it runs before the trust chain, so a blocked tool wins over a trust failure.
  - The nested `user_api_key_auth` branch stops the search for a bucket only when one of its ids is not null; otherwise the flat keys of the same bucket are tried before the next bucket.
  - The route lookup tries `metadata` before `litellm_metadata` and treats an empty `metadata` object as missing, the opposite order of the permission id lookup.
  - Tools without `function.name` give an empty list on purpose, and that is what triggers the route fallback, for example Responses API tools sent to /v1/responses.
  - Python's `str(x).strip()` of a number gives its text, so an id sent as the number 7 becomes `7`.
  - The blocked list keeps duplicates, so a request that sends the same blocked tool twice lists it twice in `blocked_tools` and in the message.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
