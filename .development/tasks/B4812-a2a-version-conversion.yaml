id: B4812
title: A2A request, response and card version conversion
description: >-
  Build the best-effort 0.3/1.0 conversion layer for JSON-RPC replies, stream events, forwarded task requests and extended cards. Detect wire-format versions at runtime from payload shape, convert between the two protocol versions for responses and requests, and retain the original value on unknown shapes or conversion failures.

  Implement version detection functions that infer whether a payload carries 0.3 format (discriminated by `kind` field) or 1.0 format (protobuf JSON with envelope keys like `message`, `task`, `statusUpdate`, `artifactUpdate`). Build conversion functions for JSON-RPC responses (send results), stream events, task objects, task lists, and agent cards. For request parameters, implement 0.3-downconversion from 1.0 when LiteLLM serves 1.0 to agents expecting 0.3; support seven task method variants plus tasks/list. On any conversion failure, return the input unchanged so a conversion bug never breaks an otherwise-valid response.

  The module uses a best-effort pattern: conversion failures are caught, logged at debug level and the original payload is returned. Card downgrade drops `additionalInterfaces` to prevent the conversion from re-exposing backend authentication. Request ID extraction handles string and integer wire values. Task state enum mapping translates protobuf enum names to 0.3 wire strings by dropping the `TASK_STATE_` prefix, replacing underscores with dashes and validating against the 0.3 enum's allowed values.

