    proof: [version-conversion-tests]
  - text: normalize_jsonrpc_response converts a JSON-RPC result to target version, passing through errors and non-dict results unchanged.
    proof: [version-conversion-tests]
  - text: normalize_stream_event converts a streamed event result to target version, passing through errors and non-dict results unchanged.
    proof: [version-conversion-tests]
  - text: normalize_request_params down-converts 1.0 request parameters to 0.3 when served version is 1.0; no-op when already 0.3.
    proof: [version-conversion-tests]
  - text: normalize_agent_card converts an agent card to target version, detecting version from protocolVersion field or supportedInterfaces presence.
    proof: [version-conversion-tests]
  - text: Card downgrade to 0.3 strips additionalInterfaces to prevent re-exposing backend URLs; upgrade to 1.0 keeps all fields.
    proof: [version-conversion-tests]
  - text: Send result conversion handles both 0.3 (kind field) and 1.0 (message/task envelope) formats; fails gracefully on conversion errors.
    proof: [version-conversion-tests]
  - text: Task list conversion infers version from the first item, preserves non-dict items, and fails the whole list if a typed item fails.
    proof: [version-conversion-tests]
  - text: Request parameter lowering supports tasks/get, tasks/cancel, tasks/resubscribe, tasks/pushNotificationConfig/set, /get, /list, /delete, and tasks/list methods.
    proof: [version-conversion-tests]
  - text: Task state enum mapping drops TASK_STATE_ prefix, replaces underscores with dashes and validates against 0.3 enum values; unmapped states drop the status field.
    proof: [version-conversion-tests]
  - text: The create_push_notification_params flattening merges nested config/pushNotificationConfig and parent/configId fields for proto compatibility.
    proof: [version-conversion-tests]
  - text: On conversion failure, the original payload is returned unchanged and logged at debug level.
    proof: [version-conversion-tests]
  - text: Request ID extraction accepts string and integer values; non-string-int values become None.
    proof: [version-conversion-tests]
