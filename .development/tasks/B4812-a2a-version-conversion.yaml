deviations:
  - what: >-
      Wire format detection infers version from payload shape at runtime instead of relying on a stored version tag. 0.3 payloads carry a `kind` field; 1.0 payloads use protobuf JSON with envelope keys like `message`, `task`, `statusUpdate`, `artifactUpdate`.
    why: Payloads may arrive in either format from upstream agents; version detection happens at the conversion boundary, not when storing or routing the card.
  - what: >-
      Conversion failures are caught broadly, logged at debug level and the original payload is returned. This best-effort pattern prevents a conversion bug from breaking an otherwise-valid response.
    why: The proxy sits between clients and agents; a conversion failure should not destroy data that could be useful to troubleshoot the real problem.
  - what: >-
      Card downgrade to 0.3 strips additionalInterfaces after successful conversion; a failed best-effort conversion retains the original card unchanged.
    why: additionalInterfaces may expose backend authentication URLs that the LiteLLM-fronting merge in B4811 deliberately removes; a failed conversion returns the input as-is so the caller can decide whether to serve it.
  - what: >-
      Task state enum mapping validates the converted state against 0.3's enum values; an unmapped or unspecified state drops the status field from the lowered parameters instead of passing an unknown value.
    why: The 0.3 enum has a fixed set of valid values; sending an invalid state to an agent expecting 0.3 would be rejected, so omitting it is safer than inventing a fallback.
out_of_scope:
  - The A2A SDK protobuf conversions (to_core_*, to_compat_*, pb2_v10 types, MessageToDict, ParseDict), sourced from the a2a crate's own compat module.
  - HTTP request/response I/O and routing decisions; conversion functions receive already-parsed JSON dicts.
  - URL sanitization on the response path; the eventual route owner (B142) retains responsibility for rewriting stored URLs before serving to clients.
pitfalls:
  - >-
    Version detection for send results checks for `kind` field (0.3) or intersection with {message, task} keys (1.0). For stream events, the envelope key set includes statusUpdate and artifactUpdate. Empty dicts or dicts with no envelope keys return None (unknown version).
  - >-
    Card version detection uses `protocolVersion` as the authoritative indicator; only when absent or unrecognized does it fall back to checking for `supportedInterfaces` (1.0-only field). Cards with neither signal are treated as 0.3.
  - >-
    Request ID extraction handles string and integer JSON values; null, object and array request IDs become None. The bare string representation is used in protobuf wrappers even for integer IDs.
  - >-
    The create_push_notification_params flattening handles both 1.x shapes: `{config: {...}}` and `{pushNotificationConfig: {...}}`, and extracts taskId from a parent field like `"tasks/TASK-ID/config"`.
  - >-
    Task list conversion preserves non-dict items unchanged; only dict items are converted. If the version detection finds no suitable first item, no conversion happens.
  - >-
    The proto task state name mapping handles the UNSPECIFIED sentinel by returning None; the result is validated against the 0.3 enum's allowed values, and unrecognized names also return None.
  - >-
    Card downgrade must use best-effort conversion: the additionalInterfaces removal happens after successful conversion, but a failed conversion returns the original card, preventing data loss.
  - >-
    Stream event validation dispatches on `kind` field: "task" → Task, "status-update" → TaskStatusUpdateEvent, "artifact-update" → TaskArtifactUpdateEvent, otherwise Message.
