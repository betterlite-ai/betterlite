deviations: []

out_of_scope:
  - The full agentic loop execution (B4115, B4118, B4119).
  - Callback registration and configuration (B4116).
  - Search tool authorization (B4114).
  - The _agentic_loop_api_surface kwarg is set by B2415 (Responses-surface hooks) and its
    Chat Completions counterpart in the chat-surface task series; this gate only reads the
    kwarg value to dispatch.
  - The `AgenticLoopPlan`, `AgenticLoopRequestPatch` or callback contract types, owned by
    B189; gates return only metadata (tool_calls list and format hints), not plan objects.

pitfalls:
  - >-
    Thinking blocks appear only in Anthropic Messages responses, in the content array
    under type "thinking" or "redacted_thinking". Extract them as dicts, handling both
    dict and object (pydantic) response types. Only the Anthropic gate adds them to
    tools_dict; Chat Completions and Responses gates never include this key.
  - >-
    The three tool detectors have different strict levels: `is_web_search_tool_chat_completion`
    rejects native types, `is_web_search_tool_responses` accepts them with `web_search_`
    prefixes, and `is_web_search_tool` accepts all. Use the exact function per surface.
  - >-
    The enabled_providers filter is on custom_llm_provider (a string like "anthropic",
    "openai", "bedrock"), not on the raw provider field in the request. Use equality
    check against the list, not substring or prefix matching.
  - >-
    When `WebSearchTransformation.transform_request` returns `should_intercept=False`,
    it means no web search tool calls were detected in the response (including when stream=true).
    Return (False, {}) immediately; do not build or return a tools_dict.
  - >-
    The tools_dict keys must match LiteLLM exactly: "tool_calls" (list), "tool_type"
    (string "websearch"), "provider" (string), "response_format" (string "anthropic",
    "openai", or "responses"), and "thinking_blocks" (list, Anthropic gate only).

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
