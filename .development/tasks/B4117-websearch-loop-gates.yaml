  paths:
    - crates/betterlite-websearch/src/loop_eligibility.rs
    - crates/betterlite-websearch/src/loop_eligibility/**
    - crates/betterlite-websearch/src/tests.rs
    - tools/oracle/cases/chat/**
    - tools/oracle/helpers/b4117.py
    - tools/oracle/helpers/b4117/**
    - tools/oracle/src/helpers/websearch/b4117.rs
    - tools/oracle/src/helpers/websearch/b4117/**
    - crates/betterlite-websearch/src/tests/**
  lint_tables: false

references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/websearch_interception/handler.py#L677-L787
    why: The dispatcher that routes by _agentic_loop_api_surface and the Anthropic gate with thinking block extraction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/websearch_interception/handler.py#L789-L847
    why: The Chat Completions-specific gate with strict tool detection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/websearch_interception/handler.py#L849-897
    why: The Responses API gate with native type support in tool detection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/integrations/custom_logger.py#L1-L50
    why: The CHAT_COMPLETION_AGENTIC_SURFACE and RESPONSES_AGENTIC_SURFACE constants used to dispatch.

dod:
  - text: >-
      The dispatcher routes by `_agentic_loop_api_surface` kwarg value:
      "chat_completions" calls Chat Completions gate, "responses" calls Responses gate,
      all others (including absent) call Anthropic Messages gate (default).
    proof: [websearch-dispatcher]
  - text: >-
      The Anthropic Messages gate (default dispatcher path) calls `is_web_search_tool`,
      detects tool calls via `WebSearchTransformation.transform_request("anthropic")`,
      and extracts thinking/redacted_thinking blocks from response content, returning
      them in the dict under "thinking_blocks" key.
    proof: [websearch-anthropic-gate, websearch-gates-oracle]
  - text: >-
      The Chat Completions gate calls `is_web_search_tool_chat_completion`, detects
      tool calls via `WebSearchTransformation.transform_request("openai")`, and does
      not extract thinking blocks (response_format is "openai").
    proof: [websearch-chat-gate, websearch-gates-oracle]
  - text: >-
      The Responses API gate calls `is_web_search_tool_responses`, detects tool calls
      via `WebSearchTransformation.transform_request("responses")`, and does not extract
      thinking blocks (response_format is "responses").
    proof: [websearch-responses-gate, websearch-gates-oracle]
  - text: >-
      Every gate filters by enabled_providers: returns (False, {}) when provider is
      present in the enabled_providers list and custom_llm_provider is not in it.
    proof: [websearch-provider-filter]
  - text: >-
      Every gate returns (False, {}) when tools list has no web search tool (all three
      use their respective is_web_search_tool_* detection function).
    proof: [websearch-tool-check]
  - text: >-
      Every gate returns (False, {}) when WebSearchTransformation.transform_request
      returns should_intercept=False (no tool calls detected in response).
    proof: [websearch-no-calls-oracle, websearch-gates-oracle]
  - text: >-
      When should_intercept is True, every gate returns (True, tools_dict) with
      keys "tool_calls", "tool_type"="websearch", "provider", "response_format".
      The Anthropic gate adds "thinking_blocks" key; Chat and Responses gates omit it.
    proof: [websearch-return-format, websearch-gates-oracle]
  - text: >-
      When stream=true, WebSearchTransformation.transform_request (B4112) returns
      (should_intercept=false, tool_calls=[]), and the gate returns (False, {}) as a result.
      Integration oracle cases verify the composed outcome across all three formats.
    proof: [websearch-no-calls-oracle, websearch-gates-oracle]

checks:
  optional: []
  commands:
    - id: websearch-dispatcher
      why: the dispatcher does not exist or fails to route by _agentic_loop_api_surface
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/dispatcher/)'
    - id: websearch-anthropic-gate
      why: the Anthropic Messages gate does not exist or fails its unit tests
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/anthropic_gate|thinking_blocks/)'
    - id: websearch-chat-gate
      why: the Chat Completions gate does not exist or fails its unit tests
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/chat_completion_gate/)'
    - id: websearch-responses-gate
      why: the Responses API gate does not exist or fails its unit tests
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/responses_gate/)'
    - id: websearch-provider-filter
      why: provider filtering does not work or is not tested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/provider_filter/)'
    - id: websearch-tool-check
      why: tool detection in gates does not use strict recognizers or is not tested
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/tool.*check/)'
    - id: websearch-return-format
      why: return dict format is wrong or lacks required keys
      run: cargo nextest run --locked -p betterlite-websearch --no-tests=fail -E 'test(/return.*format|keys/)'
    - id: websearch-gates-oracle
      why: oracle cases for all three gates fail against LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/chat)" &&
        cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/chat/websearch-gates-*.yaml
    - id: websearch-no-calls-oracle
      why: oracle cases for non-WebSearch responses fail against LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/chat)" &&
        cargo run --locked --quiet -p betterlite-oracle -- tools/oracle/cases/chat/websearch-no-intercept-*.yaml

