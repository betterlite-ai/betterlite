id: B4117
title: Gate search reruns by API surface and preserve thinking
description: >-
  Build the three search-loop eligibility checkers in crates/betterlite-websearch and their
  dispatcher, deciding when an agentic loop should execute. `async_should_run_agentic_loop`
  checks the `_agentic_loop_api_surface` kwarg to route between Anthropic Messages, Chat
  Completions and Responses implementations. Each checker filters by enabled providers,
  verifies that tools include a web search tool via the strict dialect-specific recognizer
  from B4111, calls the call-detection function from B4112 to find search tool calls in the
  response, and returns whether the loop should run plus a dict of tool call metadata.
  For Anthropic, extract and preserve thinking/redacted_thinking blocks from the response
  content, prepending them to follow-up messages to maintain model reasoning context.

  The public interface is a single async method on a logger/state object with signature
  `async_should_run_agentic_loop(response, model, messages, tools, stream, custom_llm_provider, kwargs)
  -> tuple[bool, dict]` with two overloaded paths for Chat Completions and Responses via
  `_agentic_loop_api_surface` value. When the value is neither recognized surface, use
  the Anthropic-Messages gate (default path). Return `(True, {"tool_calls": [...], "provider": "...",
  "response_format": "anthropic"|"openai"|"responses", "thinking_blocks": [...]})` when
  a search loop should run, or `(False, {})` when it should not.

  Preserve enabled_providers filtering, exact tool name checks per API surface (permissive
  for Anthropic, strict for Chat Completions, permissive with native types for Responses),
  and the precise order of extraction and return fields matching LiteLLM's behavior.
  Stream handling is delegated to B4112's transform_request; when stream=true, B4112 returns
  should_intercept=false, and the gate returns (false, {}) like any other non-match.

