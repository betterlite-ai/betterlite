id: B7879
title: Python assistant messages, runs, run streams and the assistants package
description: >-
  This is the last part of the assistants entry. It adds `add_message`, `a_add_message`, `get_messages`, `aget_messages`,
  `run_thread`, `arun_thread`, `run_thread_stream` and `arun_thread_stream`, the two helpers of litellm/assistants/utils.py
  and the `assistants` package files. Rust does the provider calls (B1057 messages, B2488 runs and streams).


  Native side, the family `assistant_runs`: `src/assistant_runs.rs` with `register` that adds `NativeAssistantRunSession`,
  `NativeAssistantStream` and `NativeAssistantRunError`. `run_thread` with `stream=True` returns a `NativeAssistantStream`
  with `next_event()`, `anext_event()`, `close()` and `aclose()` that give event JSON or None at the end. Conversion is in
  `src/assistant_runs/convert.rs` with tests `request_*` and `error_*`. The architect writes the `lib.rs` lines.


  Python side, `python/betterlite/assistants/_runs.py` and `_utils.py`, plus `main.py` and `__init__.py` that re-export the
  names of B7878 and this task. `add_message(custom_llm_provider, thread_id, role, content, attachments, metadata, client,
  **kwargs)`, `get_messages(custom_llm_provider, thread_id, client, **kwargs)` and `run_thread(custom_llm_provider, thread_id,
  assistant_id, additional_instructions, instructions, metadata, model, stream, tools, client, event_handler, **kwargs)`
  follow the source. `arun_thread` has the same parameters minus `event_handler`. `run_thread_stream(*, event_handler=None,
  **kwargs)` calls `run_thread(stream=True, ...)`, and `arun_thread_stream` sets `kwargs["arun_thread"] = True` first, so it
  returns an async stream manager (L1165-L1171 and L1231-L1236). `get_optional_params_add_message` and
  `get_optional_params_image_gen` (assistants/utils.py L10-L122) are built here as plain functions with the same output.
  A stream manager is a context manager (sync or async) that gives itself, iterates events as `AssistantStreamEvent` objects
  and closes on exit. `event_handler` must be an object with an `on_event(event)` method, called for every event. Any other
  handler raises `UnsupportedCallArgument` naming it.
