id: B4419
title: Load custom Python secret managers and expose their live methods
description: >-
  Build a standalone custom-manager interface and config-relative Python loader, with an explicit native operation bridge to custom secret manager implementations.
  Implement `load_custom_secret_manager` that reads a config path, extracts the custom_secret_manager field from key_management_settings, splits it into file_name.class_name, loads the .py file adjacent to the config, verifies the class is a CustomSecretManager subclass, instantiates it with no arguments, and sets it as the secret manager client.
  Implement CustomSecretManager as an abstract base with __init__ setting secret_manager_name to the supplied name or "custom_secret_manager", and abstract contracts for async_read_secret and sync_read_secret.
  Provide async_write_secret and async_delete_secret as optional overrides that raise NotImplementedError if not implemented by the subclass.
  Do not require validation/health hooks that LiteLLM never calls at the pin: validate_environment, async_health_check and __repr__ are left uncovered.
  Preserve the existing loader's imports, class declaration and documentation examples, and the default manager name custom_secret_manager.
scope:
  paths:
    - crates/betterlite-secret-managers/src/custom_loader.rs
    - crates/betterlite-secret-managers/src/custom_loader/**
    - crates/betterlite-secret-managers/src/custom_interface.rs
    - crates/betterlite-secret-managers/src/custom_interface/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/custom_secret_manager_loader.py#L17-L87
    why: The load_custom_secret_manager function that initializes a custom manager from a config path.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_secret_manager.py#L88-L211
    why: CustomSecretManager class with abstract read contracts and optional write/delete operations.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/base_secret_manager.py
    why: BaseSecretManager contract that CustomSecretManager extends.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/secret_managers/main.py
    why: KeyManagementSystem and KeyManagementSettings types used by the loader.
dod:
  - text: load_custom_secret_manager reads the config path, extracts custom_secret_manager from key_management_settings, splits it into file/class, loads and validates the .py file, instantiates with no arguments, and sets the manager client.
    proof: [custom-loader-behavior]
  - text: CustomSecretManager.__init__ accepts an optional name parameter and defaults to "custom_secret_manager".
    proof: [custom-loader-behavior]
  - text: async_read_secret and sync_read_secret are abstract, requiring implementation in subclasses.
    proof: [custom-interface-tests]
  - text: async_write_secret and async_delete_secret raise NotImplementedError when not overridden.
    proof: [custom-interface-tests]
  - text: Omitted validate_environment, async_health_check and __repr__ are not built or tested.
    proof: [coverage-unused]
  - text: Loading fails with distinct errors for missing config_file_path, missing/invalid key_management_settings, missing custom_secret_manager field, invalid file/class split, file not found, class not subclass of CustomSecretManager, and instantiation errors.
    proof: [custom-loader-behavior]
  - text: Behavior tests cover each error path and the happy-path initialization.
    proof: [custom-loader-behavior]
checks:
  optional: []
  commands:
    - id: custom-loader-behavior
      why: the loader function or its error handling is missing or tests fail
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^custom_loader_behaviors($|::)/)'
    - id: custom-interface-tests
      why: the CustomSecretManager interface tests fail or are missing
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^custom_interface_behaviors($|::)/)'
    - id: coverage-unused
      why: unused methods from LiteLLM are implemented when they should not be
      run: |
        ! grep -r "validate_environment" crates/betterlite-secret-managers/src/custom_interface.rs && \
        ! grep -r "async_health_check" crates/betterlite-secret-managers/src/custom_interface.rs && \
        ! grep -r "__repr__" crates/betterlite-secret-managers/src/custom_interface.rs
oracle_cases: []
deviations:
  - what: Unused methods validate_environment, async_health_check and __repr__ are not built.
    why: LiteLLM declares them but production code never calls them at the pinned commit, and adding them invites incorrect implementations.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_secret_manager.py#L213-L244
  - what: The default manager name is "custom_secret_manager", matching LiteLLM's default.
    why: LiteLLM allows customization but defaults to this name when not supplied.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_secret_manager.py#L102
out_of_scope:
  - Python runtime integration and interpreter lifecycle management. The loader returns a typed interface; supplying the runtime is B129's responsibility.
  - The custom write/delete route implementation. Those hooks belong to later virtual-key task owners.
  - Validation/health hooks. The loader does not call them and betterlite does not require them.
pitfalls:
  - Split on exactly one dot to separate file_name and class_name. A class name like "MyManager.Inner" is invalid; the file must be "MyManager.py" with the Inner class defined as a top-level export.
  - Load the .py file from the directory of config_file_path, not from the current working directory or PYTHONPATH.
  - Verify the loaded class is a subclass of CustomSecretManager before instantiation to catch misconfigured managers early.
  - Instantiate with no arguments and no keyword args; the caller supplies any state the manager needs through its config.
  - >-
    Preserve the error messages: "config_file_path is required", "key_management_settings is required", "custom_secret_manager field is required", and "must be a subclass of CustomSecretManager". The split into file/class raises a bare ValueError when the path lacks exactly one dot; betterlite may wrap or propagate it.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
