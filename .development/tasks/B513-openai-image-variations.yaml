checks:
  optional:
  - mutants
  commands:
  - id: case-variation-image-part
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-variations/variation-image-part.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_variation_image_part$/)'
  - id: case-n-size-format-user
    why: 'Supported list is n,size,response_format,user, but mapping updates optional_params with every non_default_params
      entry and lets the new entry win; the transform emits data={image: supplied image, **options}, without adding
      model.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_n_size_format_user$/)'
  - id: case-omitted-default-fields
    why: Pop max_retries with literal default 2, choose provider config with model or empty string and provider
      OPENAI, and honor litellm_params.async_call default false. Reuse a supplied client; otherwise pass api_key,base_url,http_client=client_session,timeout,max_retries,organization
      to SDK construction.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_omitted_default_fields$/)'
  - id: case-provider-error
    why: Both sync/async wrap failures as B668 OpenAIError using status_code or 500, text or str(error), headers
      from the exception or its response; they do not keep an unrelated exception class.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_provider_error$/)'
  - id: case-binary-file-descriptor
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-variations/binary-file-descriptor.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_binary_file_descriptor$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_image_variations.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_image_variations*")"
      && grep -lq 'openai_image_variations' tools/oracle/fuzz/corpus/helper_case/openai_image_variations* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_image_variations$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-variation-missing-config-data
    why: Missing config or a false data field raises ValueError at the inner seam and is wrapped as OpenAIError
      500 by image_variations, with a diagnostic identifying the missing provider/data.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_variation_missing_config_data$/)'
  - id: case-variation-reply-identity
    why: Both send with_raw_response.create_variation, parse ImageResponse, and return the provider transform result
      unchanged; the transform receives a synthetic status-200 GET https://litellm.ai response, so do not invent
      forwarding of actual response headers.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_variation_reply_identity$/)'
