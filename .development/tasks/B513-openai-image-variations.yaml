id: B513
title: OpenAI image variation requests
description: >-
  Add ImageVariationRequest and execute variations with the common image reply parser and multipart transport. Preserve
  omission of SDK defaults and caller-supplied upload metadata; do not expose a new public endpoint in this provider
  slice.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/image_variations/handler.py:
  OpenAIImageVariationsHandler.get_sync_client L21-L32; OpenAIImageVariationsHandler.get_async_client L34-L41; OpenAIImageVariationsHandler.async_image_variations
  L43-L110; OpenAIImageVariationsHandler.image_variations L112-L227. litellm/llms/openai/image_variations/transformation.py:
  OpenAIImageVariationConfig.get_supported_openai_params L19-L20; OpenAIImageVariationConfig.map_openai_params L22-L30;
  OpenAIImageVariationConfig.transform_request_image_variation L32-L44; OpenAIImageVariationConfig.async_transform_response_image_variation
  L46-L59; OpenAIImageVariationConfig.transform_response_image_variation L61-L74; OpenAIImageVariationConfig.get_error_class
  L76-L81.


  Reuse the existing image reply decoder from the image-generation result owner; this slice adds no parallel JSON
  parser.


  Implement crates/betterlite-openai/src/image_variations.rs with adjacent tests under image_variations/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_image_variations in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_variations_cases in betterlite-openai with these exact named cases (one per oracle
  file): variation_image_part, n_size_format_user, omitted_default_fields, provider_error, binary_file_descriptor.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_image_variations* using HelperCase: kind:
  helper and the externally tagged openai_image_variations variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_image_variations that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 245 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 460 planned, 475 maximum changed lines.
