  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/openai_image_variations.rs
  - tools/oracle/src/helpers/openai_image_variations/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/openai_image_variations.py
  - tools/oracle/cases/helpers/providers/openai-image-variations/**
  - tools/oracle/fuzz/corpus/helper_case/openai_image_variations*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/image_variations/handler.py#L21-L227
  why: >-
    Own OpenAIImageVariationsHandler.get_sync_client, OpenAIImageVariationsHandler.get_async_client, OpenAIImageVariationsHandler.async_image_variations,
    OpenAIImageVariationsHandler.image_variations. Other functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/image_variations/transformation.py#L19-L81
  why: >-
    Own OpenAIImageVariationConfig.get_supported_openai_params, OpenAIImageVariationConfig.map_openai_params, OpenAIImageVariationConfig.transform_request_image_variation,
    OpenAIImageVariationConfig.async_transform_response_image_variation, OpenAIImageVariationConfig.transform_response_image_variation,
    OpenAIImageVariationConfig.get_error_class. Other functions in this file remain with the owners listed below.
dod:
- text: 'variation image part: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-variations/variation-image-part.yaml.'
  proof:
  - case-variation-image-part
  - oracle
  - helper-python
- text: 'n size format user: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-variations/n-size-format-user.yaml.'
  proof:
  - case-n-size-format-user
  - oracle
  - helper-python
- text: >-
    omitted default fields: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-variations/omitted-default-fields.yaml.
  proof:
  - case-omitted-default-fields
  - oracle
  - helper-python
- text: 'provider error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-variations/provider-error.yaml.'
  proof:
  - case-provider-error
  - oracle
  - helper-python
- text: >-
    binary file descriptor: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-image-variations/binary-file-descriptor.yaml.
  proof:
  - case-binary-file-descriptor
  - oracle
  - helper-python
- text: New openai_image_variations seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-variation-image-part
    why: The variation-image-part behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_variation_image_part$/)'
  - id: case-n-size-format-user
    why: The n-size-format-user behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_n_size_format_user$/)'
  - id: case-omitted-default-fields
    why: The omitted-default-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_omitted_default_fields$/)'
  - id: case-provider-error
    why: The provider-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_provider_error$/)'
  - id: case-binary-file-descriptor
    why: The binary-file-descriptor behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::image_variations_cases::case_[0-9]+_binary_file_descriptor$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_image_variations.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_image_variations*")"
      && grep -lq 'openai_image_variations' tools/oracle/fuzz/corpus/helper_case/openai_image_variations* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_image_variations$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
