out_of_scope:
- B024 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as openai_image_variations in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/image_variations.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_image_variations.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The method accepts a model but transform_request_image_variation does not include it unless optional_params does.
- The async handler calls the synchronous transform_response_image_variation; its async-named counterpart is not
  selected by this path.
- headers are passed to logging/transform preparation, not injected into create_variation as extra_headers by this
  handler.
