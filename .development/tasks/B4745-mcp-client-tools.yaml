    why: list_tools implementation, raise_on_error logging levels, cancellation handling, broken-stream detection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L873-L876
    why: error_tool_result static method and delegation to error_text_result.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L878-L958
    why: call_tool implementation, on_progress callback, _call_tool_operation session runner, exception handling, cancellation timeout, broken-connection detection, raise_on_error behavior.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/result_conversion.py#L60-L64
    why: Unresolved error_text_result helper that constructs the error result from exception type and message.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L6031
    why: Direct invocation of MCPClient.error_tool_result in OBO retry path.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L6287
    why: Direct invocation of MCPClient.error_tool_result in multi-server dispatch path.

dod:
  - text: >-
      list_tools returns an empty list when raise_on_error=False and an exception
      occurs, or re-raises when raise_on_error=True, while logging at the
      correct level (debug when caller owns, error when this layer is the only
      surface) and detecting broken-connection errors.
    proof: [list-tools-behavior-tests, oracle-mcp-client-tools]

  - text: >-
      call_tool accepts InputRequiredResult when allow_input_required=True, forwards
      progress to a host callback with warning-only callback failure, returns an
      error result on exception or the session result on success, with
      raise_on_error-dependent logging and broken-connection detection.
    proof: [call-tool-behavior-tests, oracle-mcp-client-tools]

  - text: >-
      error_tool_result constructs the result type using the unresolved
      error_text_result helper and is invoked directly by manager call sites.
    proof: [error-tool-result-tests, oracle-mcp-client-tools]

  - text: >-
      CancelledError and timeout messages propagate without recovery, logging only
      the timeout context, not a trace.
    proof: [call-tool-cancellation-tests, oracle-mcp-client-tools]

checks:
  optional: []
  commands:
    - id: list-tools-behavior-tests
      why: list_tools error handling, logging levels, and broken-connection detection are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client::tools::list_tools_tests::/)
        - test(/replays_the_/)'
    - id: call-tool-behavior-tests
      why: call_tool progress callback, error result, logging levels, and cancellation are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client::tools::call_tool_tests::/)
        - test(/replays_the_/)'
    - id: error-tool-result-tests
      why: error_tool_result construction and manager invocation points are missing or incorrect.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client::tools::error_tool_result_tests::/)
        - test(/replays_the_/)'
    - id: call-tool-cancellation-tests
      why: Cancellation and timeout handling do not propagate correctly or log unexpectedly.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^client::tools::cancellation_tests::/)
        - test(/replays_the_/)'
    - id: oracle-mcp-client-tools
      why: The HTTP oracle does not replay list_tools and call_tool behavior with real or scripted MCP peers.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-client-tools)" &&
        test -f tools/oracle/cases/helpers/mcp-client-tools/*.yaml &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

