id: B4745
title: MCP client tool listing and execution
description: >-
  Build the client-facing list and call operations with their different failure
  policies and progress forwarding. Preserve `raise_on_error` logging levels and
  propagation, cancellation, and optional `InputRequiredResult` acceptance
  without retrying an executed tool.

  Implement MCPClient.list_tools to use the B4740 pagination helper with a
  per-server listing deadline that extends the global timeout, returning an empty
  list on error by default or re-raising when the caller owns the exception.
  Distinguish debug-level logs when raise_on_error=True (caller will surface the
  failure) from error-level logs when False (this is the only error surface).
  Detect broken-connection errors by substring and log a separate diagnostic.
  CancelledError always propagates without recovery attempt.

  Implement the error_tool_result static method to return the result type that
  call_tool uses when swallowing an exception. It constructs the result by calling
  the unresolved error_text_result helper. Manager call sites at
  mcp_server_manager.py:6031,6287 also invoke this directly.

  Implement MCPClient.call_tool with a nested on_progress callback that logs tool
  progress and forwards to a host callback if provided, catching and warning on
  callback failure without failing the tool. The nested _call_tool_operation
  invokes the session runner with allow_input_required. Both exception and
  success paths log at the tool level, with the same raise_on_error-dependent
  logging strategy as list_tools: debug when the caller owns the exception,
  error when this layer is the only surface. Return error_tool_result on exception
  or the session result on success.

  Cancel-timed-out messages follow the self.timeout deadline, not the tool
  request itself. Trace exception types to detect broken-connection patterns and
  log a separate diagnostic; traceback appears only at debug level.

  All error messages and exception types remain betterlite's own; the oracle
  ignores only /error/message. Progress callback failure does not affect the tool
  result. An InputRequiredResult accepted through allow_input_required=True is
  returned as is, and re-execution does not retry the same tool invocation.

scope:
