    - crates/betterlite-mcp/src/client/tools.rs
    - crates/betterlite-mcp/src/client/tools/**
    - crates/betterlite-mcp/src/client/tools/tests.rs
    - tools/oracle/helpers/b4745.py
    - tools/oracle/helpers/b4745/**
    - tools/oracle/src/helpers/mcp/b4745.rs
    - tools/oracle/src/helpers/mcp/b4745/**
  lint_tables: false

