deviations:
  - what: >-
      On CancelledError, the tool call log message names the context (timeout
      after X seconds for URL) but does not propagate the full traceback to the
      caller.
    why: >-
      Cancellation is an expected control flow signal, not a failure to surface
      with a full stack trace. The timeout context helps operators understand why
      the request did not complete.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L925-L927

out_of_scope:
  - >-
      error_text_result (litellm/proxy/_experimental/mcp_server/result_conversion.py:60-64)
      is called by error_tool_result but is not owned by any task in depends_on. Its owner
      is pending resolution of B136 (umbrella, unsplit). This helper must be available
      and owned by a lower task before error_tool_result can build and pass tests.

pitfalls:
  - The max(self.timeout, MCP_TOOL_LISTING_TIMEOUT) deadline applies to the entire list walk, not each page, so a slow cursor replacement can consume the deadline before pagination completes.
  - Progress callback failure logs a warning but does not propagate as a tool error; the tool result stands.
  - Broken-connection detection uses substring matching on exception type names; ensure the pinned SDK exception types match the patterns used in list_tools and call_tool.
  - "raise_on_error distinguishes two failure paths: when True, this layer logs at debug because the caller will surface the exception; when False, it logs at error because this is the only error surface."
  - InputRequiredResult acceptance depends on allow_input_required=True and the upstream MCP protocol version; it is not retried as a separate tool invocation.

budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: standard
