id: B257
title: Catalog integrity and fetch retry policy
description: >-
  Implement get_model_cost_map.py _count_model_entries, git_blob_id, GetModelCostMap validation methods 107-198
  and fetch result/classification/retry functions 212-361. Reuse B193 catalog parsing and B009 transport, with injected
  client, clock and randomness. Preserve raw-byte git blob revision, ETag, minimum count and shrink-ratio integrity
  checks, retryable statuses, numeric nonnegative Retry-After capped at the pinned maximum, bounded exponential
  jitter and retry exhaustion outcomes. No global snapshot or startup environment loading is owned here. Compare
  Python helpers using synthetic HTTP replies and explicit local map inputs, never import-time networking. Budget
  290 policy/types, 120 adapters, 300 tests and 60 wiring (770 total). Write the behavior rstest functions catalog_fetch_policy_behavior_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. The helper operation catalog_fetch_policy is already registered;
  each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-models/Cargo.toml
  - crates/betterlite-models/src/fetch_policy.rs
  - crates/betterlite-models/src/fetch_policy/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/models/catalog_fetch_policy.rs
  - tools/oracle/src/helpers/models/catalog_fetch_policy/**
  - tools/oracle/helpers/catalog_fetch_policy.py
  - tools/oracle/helpers/catalog_fetch_policy/**
  - tools/oracle/cases/helpers/catalog-fetch-policy/**
  - "tools/oracle/fuzz/corpus/helper_case/catalog_fetch_policy-*"
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L55-L198
  why: Revision and validation helpers.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L212-L361
  why: Fetch outcomes and bounded retry policy.
dod:
- text: >-
    Each listed helper case compares its named production function with the pinned Python function, including precedence,
    omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: >-
    Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: >-
      cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::catalog_fetch_policy_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: strict adapters fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/catalog_fetch_policy-*")" &&
      grep -lq 'catalog_fetch_policy' tools/oracle/fuzz/corpus/helper_case/catalog_fetch_policy-* && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/catalog-fetch-policy/raw-blob-revision.yaml
- tools/oracle/cases/helpers/catalog-fetch-policy/valid-remote.yaml
- tools/oracle/cases/helpers/catalog-fetch-policy/shrunken-map.yaml
- tools/oracle/cases/helpers/catalog-fetch-policy/invalid-json.yaml
- tools/oracle/cases/helpers/catalog-fetch-policy/retry-after.yaml
- tools/oracle/cases/helpers/catalog-fetch-policy/nonretryable.yaml
- tools/oracle/cases/helpers/catalog-fetch-policy/retry-exhaustion.yaml
deviations: []
out_of_scope:
- >-
  The remaining functions in the shared covered paths belong to B194 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
pitfalls:
- 'Name every corpus seed tools/oracle/fuzz/corpus/helper_case/catalog_fetch_policy-<case>.yaml. The rest of that folder belongs to other tasks.'
- 'The oracle helper for this task is pre-registered as catalog_fetch_policy in the models group. Replace the stub Op in tools/oracle/src/helpers/models/catalog_fetch_policy.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/catalog_fetch_policy.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
