id: B359
title: Keyword, plan-mode and stall overrides
description: 'Build a typed per-turn override result for B335''s session lifecycle: lexical and semantic
  keywords, plan/housekeeping recognition and bounded tool-failure stall detection. Reuse B330''s structured
  message/context handling and B327''s semantic index. Keep this module pure except its injected semantic
  lookup; it must not read or mutate session pins. Use the existing Rust crate boundaries from B004 and
  B008; integrate through the server when the provider dispatcher or callbacks live in another core crate.
  This task''s source slices are the linked ranges, not a port of their Python classes. Add the listed
  oracle cases and the matching adapters to B301''s component runner where state is not observable over
  HTTP; adapters call production logic and never reproduce it. Use deterministic candidate sets or supplied
  random samples for comparisons, and separate seeded distribution tests for random choices. Extend the
  existing config_yaml fuzz target and committed corpus for every newly accepted config form; unsupported
  keys still fail by full path. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.'
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/complexity-turn-overrides/**
  - tools/oracle/src/router_probes/complexity-turn-overrides/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/complexity_turn_overrides.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L3156-L3224
  why: Plan and housekeeping matching.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L3423-L3450
  why: Plan floor and escalation matching.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L3915-L4066
  why: Lexical and semantic override precedence.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/stall_detector.py#L32-L118
  why: Failed tool-call sequence detection.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(complexity_turn_overrides)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/complexity-turn-overrides/plan-floor-canonical-sentinel.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/fake-sentinel-in-untrusted-text.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/housekeeping-cheapest.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/keyword-before-classifier.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/lexical-before-semantic.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/semantic-index-single-init.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/semantic-failure-policy.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/repeated-failed-tool-escalates.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/tool-result-matching-call-id.yaml
- tools/oracle/cases/routing/complexity-turn-overrides/stall-window-bounded.yaml
deviations: []
out_of_scope:
- Session cache storage or adaptive floor/ceiling scoring.
pitfalls:
- Bind tool results to call IDs rather than treating adjacent messages as paired.
- A plan signal is transient and must never mutate the long-lived pin here.
- Use the semantic adapter's existing attribution and request deadline.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
