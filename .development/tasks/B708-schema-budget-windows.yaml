      attempt_judge_cost_zero_and_nullable_details, one_unstopped_job_including_expired,
      direction_forward_allows_other_direction, group_id_null_fill_before_not_null,
      existing_group_id_preserved, stopped_future_only_unknown_backfill,
      stopped_equal_now_or_expired_unchanged, budget_and_comparison_cost_defaults,
      funnel_four_zero_counters, target_type_key_and_renamed_id,
      partial_uniqueness_per_target_type_and_direction and router_names_models_empty_attempt_router_null.'
    proof: [postgres-tests]
  - text: 'postgres_budget_and_usage covers heartbeat_timestamp_defaults,
