id: B708
title: Postgres migrations for budget windows
description: >-
  Preserve the 37 scoped migrations following B707, from add_shadow_eval through password-reset
  columns, as exact SQL and ordered catalog data. schema_budget_windows tests verify historical
  backfills, partial indexes and defaults through real Postgres. B873 owns deploying these files and
  maintaining their ledger; B718 builds the request-log indexes whose migration files now say SELECT 1.
  Do not turn those two no-op files into CREATE INDEX statements or duplicate B718's background work.

  ShadowEvalJob initially requires id/api_key_id/router_name/judge_model, DOUBLE PRECISION
  shadow_percentage, INTEGER max_turns, created_at now and ends_at without default; created_by/stopped_at
  are nullable. ShadowEvalAttempt requires id/job_id/request_id/outcome, judge_cost=0 and created_at now,
  with nullable tier/real_model/shadow_model/confidence/error. Index job key/created_at and attempt job_id.
  The first partial unique index permits one job per key where stopped_at IS NULL; an expired but
  unstopped job still conflicts. Direction adds nullable baseline_model and required direction='forward',
  replacing uniqueness with (key,direction) under the same predicate. Multi-key support adds nullable
  group_id, fills only NULL group_id from id, then sets NOT NULL and adds its index. Preserve that write
  order and existing non-null groups.

  stopped_by is added nullable, then updated to the literal unknown only when stopped_at is not NULL
  and ends_at > (NOW() AT TIME ZONE 'utc'). Do not tag unstopped, expired or exactly-at-now rows. Job
  max_budget is nullable; attempts gain shadow_cost=0, nullable real_cost, real_classifier_cost/
  shadow_classifier_cost=0 and real_cache_hit=false. ShadowEvalFunnel has job_id primary key and INTEGER
  not_sampled/unjudgeable/shed/withheld default 0, without an invented job foreign key. Typed-target
  migration renames api_key_id to target_id, adds target_type='key', replaces the partial unique index
  with (target_type,target_id,direction) and replaces the key lookup index with (target_type,target_id).
  Its rename guard is unqualified. Later required router_names/models TEXT arrays default []; attempt
  router_name stays nullable. Required numerical job fields have no range CHECK or inferred defaults.

  ProxyWorkerHeartbeat requires worker_id/hostname and started_at/last_heartbeat_at timestamp defaults
  now. DailyGuardrailUsageUnits has composite (guardrail_id,date,team_id,api_key,usage_unit), BIGINT
  units=0, created_at now/required updated_at and date index; later cost is nullable DOUBLE PRECISION
  and untracked_units required BIGINT 0. SpendLogs gains required created_at/updated_at default now
  and nullable litellm_call_id. DailyUser/Organization/EndUser/Agent/Team/TagSpend each gain required
  gateway_injected_caching_savings_spend DOUBLE PRECISION 0, then total_response_time_ms/timed_requests
  BIGINT 0. Existing counters/spend remain unchanged.

  ModelAccessGroupBudgetTable has access_group_name primary key, spend=0, nullable budget_id/actors,
  timestamp defaults now and budget DELETE SET NULL/UPDATE CASCADE. ManagedObject.org_id is nullable
  TEXT without attribution backfill. MCP per_server_oauth_discovery is required false.
  ObjectPermission.skills and Agent.access_group_ids are nullable TEXT arrays default []. Budget,
  live/deleted teams and live/deleted keys gain nullable BIGINT tpd_limit without defaults. Budget
  temp_budget_increase DOUBLE PRECISION and temp_budget_expiry TIMESTAMP(3) are nullable. Live/deleted
  keys get total_spend=0 without copying their current spend. PolicyAttachment.priority is nullable
  INTEGER; later is_default is required false. User.password_reset_required and last_breach_check_at
  are nullable, with no false/now default. ManagedFileContent has required TEXT id/BYTEA content and
  created_at default now; its data type is not base64 TEXT and SQL adds no storage hook.

  AutoRouterSession gains classifier_cost DOUBLE PRECISION 0, classifier_cost_recorded_turns INTEGER 0,
  baseline_models JSONB {}, savings_estimated_turns INTEGER 0, savings_estimated_actual_spend/
  savings_estimated_saved_spend DOUBLE PRECISION 0 and savings_estimated_baseline_models JSONB {}.
  AutoRouterUserSession uses primary key (user_id,api_key,session_id,router_name) and requires router_type,
  first_turn_at/last_turn_at/last_model without defaults. models/tier_turns/baseline_models/
  savings_estimated_baseline_models are JSONB {}; turns/unordered_turns/covered_turns/cache_hits/
  same_model_turns/same_model_hits/first_visit_turns/first_visit_hits/return_turns/return_hits/
  return_expired_misses/return_within_ttl_misses/ttl_5m_turns/ttl_1h_turns/savings_estimated_turns/
  classifier_cost_recorded_turns are INTEGER 0; total_tokens BIGINT 0; spend/saved_spend/classifier_cost/
  savings_estimated_actual_spend/savings_estimated_saved_spend DOUBLE PRECISION 0. Index last_turn_at
  and (user_id,last_turn_at), without merging user rollups into the existing key rollup table.

  DailyGlobalSpend requires id/date, nullable model/model_group/provider/tool/endpoint, required
  created_at now and updated_at without default. BIGINT prompt_tokens/completion_tokens/cache_read_input_tokens/
  cache_creation_input_tokens/compression_saved_tokens/api_requests/successful_requests/failed_requests/
  total_response_time_ms/timed_requests and DOUBLE PRECISION compression_savings_spend/
  prompt_caching_savings_spend/gateway_injected_caching_savings_spend/autorouter_savings_spend/spend
  all default 0. Add date lookup and unique (date,model,model_group,custom_llm_provider,
  mcp_namespaced_tool_name,endpoint), retaining distinct-null semantics and no api_key column.

  JWT issuer scoping first drops old claim indexes, adds required jwt_issuer TEXT default '', then
  creates lookup (issuer,claim_name,claim_value,is_active) and uniqueness (issuer,claim_name,claim_value).
  The non-null empty-string backfill makes unscoped duplicates collide; differing issuers may reuse
  a claim pair. Do not replace '' with NULL or include is_active in the unique key.

  AutoRouterBaselineComparison has scope TEXT primary key, required api_key/session_id/router_name/
  initial_equivalent, BIGINT revision/published_revision=0, nullable history/attempted_at, retired=false
  and updated_at now. Index the session tuple, updated_at and the partial dirty key
  (attempted_at,updated_at,scope) WHERE NOT retired AND revision <> published_revision. Observation
  has request_id primary key, required scope/DOUBLE PRECISION started_at/BIGINT revision/TEXT data,
  nullable publication, conflicted=false, and (scope,started_at,request_id)/(scope,revision,started_at)
  indexes. No foreign key is added between these tables.


  Exercise the upstream and candidate SQL in independent B860 databases using POSTGRES_TEST_URL,
  testcontainers only if absent, and B700 sessions. Fix database transaction time for boundary backfill
  tests; compare every column, exact partial-index predicate and intermediate uniqueness outcome.
  Setup failures fail tests and cleanup runs on every exit. The cohort contains 276 nonblank,
  noncomment SQL lines but 413 physical production lines; allow 335 tests and 30 registration lines,
  778 within 800. Static SQL adds no parser, environment setting or HTTP adapter.
