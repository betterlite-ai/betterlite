out_of_scope:
  - B707 supplies the prior checkpoint, B709 the final cohort and B701 the final schema contract, including SQL-only partial indexes.
  - B718 builds api_key/startTime and litellm_call_id request-log indexes; these two migration files are SELECT 1 only.
  - B873 owns ordered deployment/ledger behavior. B087 owns managed-file/batch activation; content storage DDL changes no hook behavior.
pitfalls:
  - Shadow jobs with past ends_at still occupy the partial unique index until stopped_at is set.
  - jwt_issuer must be non-null with default '' to keep unscoped claim pairs unique.
  - The two request-log index migrations are intentional no-ops despite their names.
