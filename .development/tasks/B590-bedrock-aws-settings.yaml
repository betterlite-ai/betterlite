id: B590
title: Bedrock AWS credential inputs and local sources
description: >-
  Implement AWS native credential source selection and local-source cache using the resolved AwsSettings from B682.
  Preserve session/profile/static priority, canonical session tags, bearer absent-versus-empty values and credential
  expiry. Compare aws-config native provider modules with hand-written discovery; reuse supported profile, environment
  and metadata sources over injected IO while excluding credential_process. Do not read ambient environment or create
  another HTTP client.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/base_aws_llm.py:
  _canonical_aws_session_tags L61-L71; _assume_role_params L81-L97; build_web_identity_session_policy L155-L168;
  pop_aws_auth_params L171-L176; bedrock_bearer_token L192-L194; AwsAuthError.__init__ L203-L208; BaseAWSLLM.__init__
  L240-L256; BaseAWSLLM._get_ssl_verify L258-L271; BaseAWSLLM.get_cache_key L273-L279; BaseAWSLLM._get_or_set_cached_credentials
  L281-L311; BaseAWSLLM._is_auth_with_web_identity_token L314-L319; BaseAWSLLM._is_auth_with_aws_role L322-L323;
  BaseAWSLLM._is_auth_with_aws_profile L326-L327; BaseAWSLLM._is_auth_with_aws_session_token_tuple L330-L335; BaseAWSLLM._is_auth_with_access_key_and_secret_key
  L338-L343; BaseAWSLLM._auth_with_aws_profile L1393-L1402; BaseAWSLLM._auth_with_aws_session_token L1405-L1423;
  BaseAWSLLM._auth_with_access_key_and_secret_key L1426-L1448; BaseAWSLLM._auth_with_env_vars L1451-L1460; BaseAWSLLM._get_default_ttl_for_boto3_credentials
  L1463-L1469. litellm/llms/bedrock/common_utils.py: s3_static_key_pair L132-L140.


  B682 owns all config/env reads and creates AwsSettings; this task consumes that snapshot and owns native source
  selection/cache only. Reuse aws-config providers with injected environment/files/transport; disable credential_process
  and automatic SDK environment loading. SDK-owned profile parsing is not a new betterlite byte parser.


  Named case contracts: session_tags_canonical: None remains None; accept sequence/tuple of dicts with required
  string Key/Value via AwsSessionTag adapter, ignoring extra tag fields as source validation does. Stable-sort by
  Key, preserve duplicate Keys and their relative order, retain empty strings. Invalid entries raise ValueError
  with Invalid 'aws_session_tags' value. Expected a list of {'Key': <str>, 'Value': <str>} dicts, e.g. [{'Key':
  'team', 'Value': 'genai'}]. Got: <repr>. Validate before signing. assume_role_parameter_presence: Always emit
  RoleArn and RoleSessionName. ExternalId is omitted only for None, so empty string survives. Tags is omitted for
  None/empty sequence, otherwise canonical tuple retained. No invented default session name here. web_identity_policy:
  Emit Version=2012-10-17 and four ordered Allow statements, each Resource=* and Condition.Bool.aws:SecureTransport="true".
  Sid BedrockLiteLLM actions bedrock:InvokeModel,InvokeModelWithResponseStream,CountTokens,Rerank,Retrieve,ListKnowledgeBases,InvokeAgent,ApplyGuardrail,GetGuardrail,ListGuardrails
  (each bedrock: prefix); Sid BedrockAgentCoreLiteLLM actions bedrock-agentcore:InvokeAgentRuntime,InvokeAgentRuntimeForUser,InvokeGateway;
  Sid ClaudePlatformLiteLLM actions aws-external-anthropic:CreateInference,CreateBatchInference,CancelBatchInference,DeleteBatchInference,CountTokens,Get*,List*;
  Sid BedrockMantleLiteLLM action bedrock-mantle:CreateInference. Preserve exact order and capitalization. auth_parameters_popped_before_validation:
  Pop aws_access_key_id,aws_secret_access_key,aws_session_token,aws_session_name,aws_profile_name,aws_role_name,aws_web_identity_token,aws_sts_endpoint,aws_external_id,aws_session_tags
  from optional_params, supplying None for missing; aws_region_name and aws_bedrock_runtime_endpoint remain. AwsAuthParams
  is frozen and ignores extras; invalid typed strings fail after all keys were popped. Preserve this mutation order.
  bearer_presence_not_truthiness: api_key wins whenever non-None including empty; only None reads AWS_BEARER_TOKEN_BEDROCK
  via resolved B682 settings. Convert selected falsey string to None. Blank explicit api_key suppresses a configured
  env token; whitespace survives. Bearer and SigV4 credentials are separate. credential_cache_key_and_bound: Share
  one in-process IAM cache across instances, maximum1000 entries,64 striped single-flight fetch locks. Key is SHA256
  of sorted-key JSON of all passed credential parameters including ssl_verify; session name/tags/endpoint/identity
  differences isolate entries. On truthy hit return; falsey hit fetches. Write fetched credentials with supplied
  TTL even None; ambient default600 seconds delegates B2226 in-memory cache. Concurrent same-key misses perform
  one fetch; exceptions do not cache a successful identity. local_credential_sources: Profile passes profile_name
  to SDK Session then get_credentials, no TTL; explicit access/secret/session token creates Credentials directly,
  no TTL. Static access+secret+region uses SDK Session and get_credentials with3540-second TTL; ambient uses SDK
  Session() with TTLNone. Profiles/session-token triples bypass the cache in B594, not this helper. SDK absence/failures
  propagate; do not synthesize credentials. auth_selector_presence: Web identity requires token,role,session name
  all non-None; role/profile predicates test non-None, session triple tests all three non-None, static branch requires
  access/secret/region non-None. Empty strings count present at these selection predicates; s3_static_key_pair separately
  requires both nonempty strings and returns None otherwise. aws_auth_error_projection: AwsAuthError preserves supplied
  status/message, request POST https://us-west-2.console.aws.amazon.com/bedrock, response with same status/request
  and no invented param/code. get_ssl_verify delegates B172 TLS policy including bool or custom CA path.


  The constructor exposes aws_access_key_id,aws_secret_access_key,aws_session_token,aws_region_name,aws_session_name,aws_profile_name,aws_role_name,aws_web_identity_token,aws_sts_endpoint,aws_bedrock_runtime_endpoint,aws_external_id,aws_session_tags
  as authentication parameter names. Settings are B682; secret-reference resolution is B187, credential selectors
  are B594, TLS resolution B172 and shared memory cache B173. No provider request or HTTP oracle is owned here.


  Load s3_access_key_id, s3_secret_access_key through betterlite-config, with injected environment lookup and the
  defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest bedrock_aws_settings_config_cases; each named loads_<key> case invokes the real B002 loader,
  checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  The shared s3_static_key_pair reads exact s3_access_key_id and s3_secret_access_key, each default None. Both must
  be nonempty strings; whitespace is retained. It has no S3-specific environment fallback. B594 owns credential
  construction from this pair and callers reuse these two loader cases.


  The memory-only DualCache get/set path is B2226, below this provider; the provider-specific cache key, credential
  lifetime and single-flight policy stay here. B173 remains the outbound HTTP/client pool only.


  Implement crates/betterlite-bedrock/src/aws_settings.rs with adjacent tests under aws_settings/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_aws_settings in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function aws_settings_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  static_key_pair, session_token_triple, profile_precedence, default_native_chain, canonical_session_tags, credential_cache_expiry,
  bearer_token_empty_versus_absent, auth_params_removed_from_body, session_tags_canonical, assume_role_parameter_presence,
  web_identity_policy, auth_parameters_popped_before_validation, bearer_presence_not_truthiness, credential_cache_key_and_bound,
  local_credential_sources, auth_selector_presence, aws_auth_error_projection. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_aws_settings* using HelperCase: kind:
  helper and the externally tagged bedrock_aws_settings variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_aws_settings that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_aws_settings_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_aws_settings_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 209 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 235 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 100 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 735 planned, 750 maximum changed lines.
