      Got: <repr>. Validate before signing.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_session_tags_canonical$/)'
  - id: case-assume-role-parameter-presence
    why: Always emit RoleArn and RoleSessionName. ExternalId is omitted only for None, so empty string survives.
      Tags is omitted for None/empty sequence, otherwise canonical tuple retained. No invented default session name
      here.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_assume_role_parameter_presence$/)'
  - id: case-web-identity-policy
    why: 'Emit Version=2012-10-17 and four ordered Allow statements, each Resource=* and Condition.Bool.aws:SecureTransport="true".
      Sid BedrockLiteLLM actions bedrock:InvokeModel,InvokeModelWithResponseStream,CountTokens,Rerank,Retrieve,ListKnowledgeBases,InvokeAgent,ApplyGuardrail,GetGuardrail,ListGuardrails
      (each bedrock: prefix); Sid BedrockAgentCoreLiteLLM actions bedrock-agentcore:InvokeAgentRuntime,InvokeAgentRuntimeForUser,InvokeGateway;
      Sid ClaudePlatformLiteLLM actions aws-external-anthropic:CreateInference,CreateBatchInference,CancelBatchInference,DeleteBatchInference,CountTokens,Get*,List*;
      Sid BedrockMantleLiteLLM action bedrock-mantle:CreateInference. Preserve exact order and capitalization.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_web_identity_policy$/)'
  - id: case-auth-parameters-popped-before-validation
    why: Pop aws_access_key_id,aws_secret_access_key,aws_session_token,aws_session_name,aws_profile_name,aws_role_name,aws_web_identity_token,aws_sts_endpoint,aws_external_id,aws_session_tags
      from optional_params, supplying None for missing; aws_region_name and aws_bedrock_runtime_endpoint remain.
      AwsAuthParams is frozen and ignores extras; invalid typed strings fail after all keys were popped. Preserve
      this mutation order.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_auth_parameters_popped_before_validation$/)'
  - id: case-bearer-presence-not-truthiness
    why: api_key wins whenever non-None including empty; only None reads AWS_BEARER_TOKEN_BEDROCK via resolved B682
      settings. Convert selected falsey string to None. Blank explicit api_key suppresses a configured env token;
      whitespace survives. Bearer and SigV4 credentials are separate.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_bearer_presence_not_truthiness$/)'
  - id: case-credential-cache-key-and-bound
    why: Share one in-process IAM cache across instances, maximum1000 entries,64 striped single-flight fetch locks.
      Key is SHA256 of sorted-key JSON of all passed credential parameters including ssl_verify; session name/tags/endpoint/identity
      differences isolate entries. On truthy hit return; falsey hit fetches. Write fetched credentials with supplied
      TTL even None; ambient default600 seconds delegates B2226 in-memory cache. Concurrent same-key misses perform
      one fetch; exceptions do not cache a successful identity.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_credential_cache_key_and_bound$/)'
  - id: case-local-credential-sources
    why: Profile passes profile_name to SDK Session then get_credentials, no TTL; explicit access/secret/session
      token creates Credentials directly, no TTL. Static access+secret+region uses SDK Session and get_credentials
      with3540-second TTL; ambient uses SDK Session() with TTLNone. Profiles/session-token triples bypass the cache
      in B594, not this helper. SDK absence/failures propagate; do not synthesize credentials.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_local_credential_sources$/)'
  - id: case-auth-selector-presence
    why: Web identity requires token,role,session name all non-None; role/profile predicates test non-None, session
      triple tests all three non-None, static branch requires access/secret/region non-None. Empty strings count
      present at these selection predicates; s3_static_key_pair separately requires both nonempty strings and returns
      None otherwise.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_auth_selector_presence$/)'
  - id: case-aws-auth-error-projection
    why: AwsAuthError preserves supplied status/message, request POST https://us-west-2.console.aws.amazon.com/bedrock,
      response with same status/request and no invented param/code. get_ssl_verify delegates B172 TLS policy including
      bool or custom CA path.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::aws_settings_cases::case_[0-9]+_aws_auth_error_projection$/)'
  - id: config-s3-access-key-id
    why: s3_access_key_id lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_aws_settings_config_cases::case_[0-9]+_loads_s3_access_key_id$/)'
  - id: config-s3-secret-access-key
    why: s3_secret_access_key lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_aws_settings_config_cases::case_[0-9]+_loads_s3_secret_access_key$/)'
