dod:
- text: >-
    The transport sends method, path, query string, Authorization and Content-Type exactly as requests does for LiteLLM's
    calls, and raise_for_status raises HTTPError with the requests message text for 4xx and 5xx.
  proof: [transport]
- text: >-
    A connection failure or timeout surfaces as RequestError with the original error as its cause, not as a bare urllib error.
  proof: [transport]
- text: >-
    UnauthorizedError and NotFoundError keep a redacted copy of the wrapped HTTPError (same response) or string, and a
    secret in the message never reaches `str()`.
  proof: [exceptions]
- text: >-
    HTTPClient joins the URL the way LiteLLM does, lets the key override a caller Authorization header, encodes json, form
    and bytes bodies, returns parsed JSON and raises HTTPError, never UnauthorizedError, on 401.
  proof: [http-client]
- text: Health, model-group and user clients send the same requests as LiteLLM's and return or raise the same things.
  proof: [resource-clients]
- text: >-
    The native bridge redacts with betterlite-redact's patterns and returns None for the gateway key when no token is stored
    or the stored URL differs from the expected one.
  proof: [native-bridge, bridge-python]
- text: Python files pass ruff and basedpyright in strict mode.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: transport
    why: A request line, header or error text differs from requests.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_proxy_client_base.py -k transport_
  - id: exceptions
    why: An exception keeps a secret or loses its response.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_proxy_client_base.py -k exceptions_
  - id: http-client
    why: The generic request builds a different URL, header or body.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_proxy_client_base.py -k http_client_
  - id: resource-clients
    why: A health, model-group or user call differs from LiteLLM's.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_proxy_client_base.py -k "health_ or model_groups_ or users_"
  - id: native-bridge
    why: The Rust side redacts or looks up the key differently from the Python original.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^proxy_client::/)'
  - id: bridge-python
    why: The Python wrapper does not reach the native class.
    run: >-
      uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_proxy_client_base.py -k bridge_
  - id: python-lint
    why: Strict typing has to hold for every new module.
    run: >-
      uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: The gateway key comes from the token file only. A key stored only in the OS keychain is not found.
  why: The wheel must not link the keyring or betterlite-cli. LiteLLM falls back to the file the same way when the keychain is unavailable.
- what: The clients use the standard library `urllib`, and `return_request=True` returns betterlite's `Request` dataclass, not a `requests.Request`. Errors are `betterlite.proxy.client.HTTPError` and `RequestError`, not `requests.exceptions.HTTPError` and `RequestException`.
  why: The wheel depends only on python-dotenv, so `requests` is not there. A script that catches the requests classes must catch these.
- what: >-
    `HTTPClient.request` takes `params` as a named argument and raises `TypeError` for any other extra keyword.
  why: LiteLLM forwards `**kwargs` to `requests.request`, which has no counterpart here. `params` is the one extra the other clients in LiteLLM need.
- what: This task has no helper oracle cases.
  why: The pytest file imports both packages and compares them against one recording server, and helper cases speak to Rust functions only.
out_of_scope:
- The keys and credentials clients are B7791. The models, chat and teams clients are B7792.
- '`Client` in client.py, the package `__init__.py` and the README belong to B169.'
- The Rust token store, keyring and `get_litellm_gateway_api_key` itself are B4590 to B4592. This task only calls it.
- LiteLLM's `litellm/rust_bridge` fallback in `redact_string` (the pure Python regex copy) is not built. betterlite-redact is the one implementation.
pitfalls:
- >-
  Users `list_users` returns `response.json().get("users", response.json())`, so a reply without a `users` key comes back whole.
- >-
  `get_user` and `get_user_v2` send no query at all when `user_id` is empty or None, and `UsersManagementClient` puts
  `Content-Type: application/json` on GET requests too, while `ModelGroupsManagementClient` sends only `Authorization`.
- >-
  UsersManagementClient raises `UnauthorizedError(response.text)` with a string, ModelGroupsManagementClient raises it with the
  `HTTPError`. Both stay as they are, and `str()` is redacted either way.
- >-
  `HTTPClient` strips only trailing slashes from `base_url` and only leading slashes from `uri`, so `"/health/x"` and
  `"health/x"` give the same URL and a double slash in the middle is left alone.
- >-
  LiteLLM raises `UnauthorizedError` inside the `except` block, so the original `HTTPError` is the implicit context. Raise
  with `from error` so the cause is kept.
- >-
  urllib follows redirects and adds its own `User-Agent: Python-urllib`. Keep the redirect default and do not assert on
  `User-Agent` in tests.
- >-
  `Redactor::new` can fail with `RedactionError`. The class constructor turns that into a Python `RuntimeError` carrying the
  message, and nothing else in the family unwraps.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
