id: B674
title: Azure certificate grant
description: >-
  Implement CertificateCredential using pure-Rust PKCS#12/PEM reading and RS256 client assertions, never openssl
  or azure_identity certificate support. Use jsonwebtoken with its rust_crypto feature and p12-keystore; receive
  an operator-selected file reader, password, tenant/client/scope, transport and clock. Preserve the Python azure-identity
  certificate assertion claims and thumbprint encoding using captured SDK requests.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Compare p12-keystore (pure Rust PKCS#12/PKCS#8) plus jsonwebtoken rust_crypto RS256 with azure_identity 1.0.0
  CertificateCredential; reject the latter because its certificate path requires openssl. Reject non-RSA keys as
  Python does; SHA-1 certificate fingerprint is an identifier, not the signature algorithm.


  Named case contracts: pem_certificate: A byte sequence containing -----BEGIN selects the PEM parser; load the
  RSA private key and signing certificate from the same material. The configured path is read as binary; no request-controlled
  URL is fetched. pkcs12_password: Otherwise parse PKCS#12 using optional UTF-8 string/byte password. Missing private
  key raises The certificate must include its private key; bad data/password or missing certificate raises Failed
  to deserialize certificate in PEM or PKCS12 format. Preserve encrypted PEM separately from decrypted in-memory
  PKCS#12 key bytes. client_assertion_claims: RS256 JWT has aud equal to the discovered token endpoint, iss/sub
  client_id, iat clock, exp clock+600 and UUID jti; no nbf by default. x5t is URL-safe base64 of the SHA-1 certificate
  fingerprint WITH padding; do not use SHA-256 or strip padding. No x5c because LiteLLM never requests send_certificate_chain.
  Reuse an assertion for 540 seconds, then regenerate at equality. invalid_certificate: Reject non-RSA keys with
  The certificate must have an RSA private key because RS256 is used for signing. Path/data both truthy raises ValueError
  Please specify either "certificate_path" or "certificate_data", not both; neither truthy raises ValueError CertificateCredential
  requires a value for either "certificate_path" or "certificate_data"; file-read and PEM parse failures propagate
  before HTTP. Do not collapse every failure into invalid_client. token_response: Use B673 authority discovery and
  OAuth transport for grant_type=client_credentials, client_id, scope, client_assertion and client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer.
  No client_secret field. Preserve Authentication failed: {error_description or error}, expiry at request_time+int(expires_in),
  token_type default Bearer and optional refresh_on. certificate_argument_boundary: Validate tenant with B673 SDK
  input policy before file access. The public LiteLLM selector passes certificate_path and passes password only
  when its environment value is truthy; certificate_data/send_certificate_chain are not newly exposed config keys.
  certificate_chain_header: When B677 supplies send_certificate_chain=true, extract all PEM certificates between
  the first BEGIN CERTIFICATE and last END CERTIFICATE, remove line breaks, and supply the public certificate chain
  to MSAL for x5c. Otherwise omit x5c. Private key data never enters the public header.


  Pin SDK fixture capture to azure-identity 1.25.2 and msal 1.37.0 from LiteLLM uv.lock; reject fixture generation
  with a different version. The old 1.26.0 references were not the locked dependency. Capture the public credential
  transport path, not unused legacy request factories retained in the SDK.


  Implement crates/betterlite-azure/src/azure_certificate.rs with adjacent tests under azure_certificate/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_certificate_cases in betterlite-azure with these exact named cases (one per oracle
  file): pem_certificate, pkcs12_password, client_assertion_claims, invalid_certificate, token_response, certificate_argument_boundary,
  certificate_chain_header. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_certificate* using HelperCase: kind: helper
  and the externally tagged azure_certificate variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_certificate that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_certificate_material consumes operator-supplied PEM/PKCS#12 bytes through the selected
  pure-Rust parser in crates/betterlite-azure/src/azure_certificate.rs (or its scoped child module). Add cargo-fuzz
  target crates/betterlite-azure/fuzz/fuzz_targets/azure_certificate.rs calling that exact production function,
  with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_certificate.
  The adjacent test replays_the_azure_certificate_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_certificate_credential_identity_isolation in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_certificate_secret_safe_failure in betterlite-azure for this Rust-specific invariant; it
  is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 295 production lines, 270 behavior/config-test lines, 135 combined
  Rust/Python adapter lines, 65 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 800 planned, 800 maximum changed lines. The production allowance includes 220 lines for the referenced
  SDK protocol that LiteLLM delegates.
