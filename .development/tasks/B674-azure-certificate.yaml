id: B674
title: Azure certificate grant
description: >-
  Implement CertificateCredential using pure-Rust PKCS#12/PEM reading and RS256 client assertions, never openssl
  or azure_identity certificate support. Use jsonwebtoken with its rust_crypto feature and p12-keystore; receive
  an operator-selected file reader, password, tenant/client/scope, transport and clock. Preserve the Python azure-identity
  certificate assertion claims and thumbprint encoding using captured SDK requests.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Compare p12-keystore (pure Rust PKCS#12/PKCS#8) plus jsonwebtoken rust_crypto RS256 with azure_identity 1.0.0
  CertificateCredential; reject the latter because its certificate path requires openssl. Reject non-RSA keys as
  Python does; SHA-1 certificate fingerprint is an identifier, not the signature algorithm.


  Implement crates/betterlite-azure/src/azure_certificate.rs with adjacent tests under azure_certificate/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation azure_certificate in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_certificate_cases in betterlite-azure with these exact named cases (one per oracle
  file): pem_certificate, pkcs12_password, client_assertion_claims, invalid_certificate, token_response. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use
  the booted proxy and assert both client response and captured upstream request. Existing API tasks retain route
  registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_certificate* using HelperCase: kind: helper
  and the externally tagged azure_certificate variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_certificate that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_certificate_material consumes operator-supplied PEM/PKCS#12 bytes through the selected
  pure-Rust parser in crates/betterlite-azure/src/azure_certificate.rs (or its scoped child module). Add cargo-fuzz
  target crates/betterlite-azure/fuzz/fuzz_targets/azure_certificate.rs calling that exact production function,
  with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_certificate.
  The adjacent test replays_the_azure_certificate_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_certificate_credential_identity_isolation in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone azure_certificate_secret_safe_failure in betterlite-azure for this Rust-specific invariant; it
  is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 255 production lines, 120 behavior/config-test lines, 95 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 565 planned, 575 maximum changed lines. The production allowance includes 220 lines for the referenced
  SDK protocol that LiteLLM delegates.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - Cargo.toml
  - deny.toml
  - crates/betterlite-azure/src/azure_certificate.rs
  - crates/betterlite-azure/src/azure_certificate/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_certificate.rs
  - tools/oracle/src/helpers/azure_certificate/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_certificate.py
  - tools/oracle/cases/helpers/providers/azure-certificate/**
  - tools/oracle/fuzz/corpus/helper_case/azure_certificate*
  - crates/betterlite-azure/fuzz/Cargo.toml
  - crates/betterlite-azure/fuzz/fuzz_targets/azure_certificate.rs
  - crates/betterlite-azure/fuzz/corpus/azure_certificate/**
  lint_tables: false
references:
- url: https://docs.rs/p12-keystore/0.4.1/p12_keystore/
  why: Pure-Rust PKCS#12 reader, supported key/encryption formats.
- url: https://docs.rs/azure_identity/1.0.0/azure_identity/
  why: Identity crate does not provide the full Python credential family set.
- url: https://docs.rs/jsonwebtoken/latest/jsonwebtoken/
  why: RS256 with rust_crypto rather than OpenSSL.
- url: https://github.com/Azure/azure-sdk-for-python/blob/azure-identity_1.26.0/sdk/identity/azure-identity/azure/identity/_credentials/certificate.py#L64-L192
  why: Credential behavior in the installed oracle azure-identity 1.26.0; capture its transport seam instead of
    copying its Python SDK internals.
dod:
- text: 'pem certificate: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-certificate/pem-certificate.yaml.'
  proof:
  - case-pem-certificate
  - oracle
  - helper-python
- text: 'pkcs12 password: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-certificate/pkcs12-password.yaml.'
  proof:
  - case-pkcs12-password
  - oracle
  - helper-python
- text: 'client assertion claims: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-certificate/client-assertion-claims.yaml.'
  proof:
  - case-client-assertion-claims
  - oracle
  - helper-python
- text: 'invalid certificate: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-certificate/invalid-certificate.yaml.'
  proof:
  - case-invalid-certificate
  - oracle
  - helper-python
- text: 'token response: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-certificate/token-response.yaml.'
  proof:
  - case-token-response
  - oracle
  - helper-python
- text: New azure_certificate seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_certificate_material has newly committed malformed and boundary inputs replayed through production
    parsing.
  proof:
  - parser-corpus
- text: credential identity isolation holds at this task’s owned boundary.
  proof:
  - credential-identity-isolation
- text: secret safe failure holds at this task’s owned boundary.
  proof:
  - secret-safe-failure
checks:
  optional:
  - mutants
  commands:
  - id: case-pem-certificate
    why: The pem-certificate behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_pem_certificate$/)'
  - id: case-pkcs12-password
    why: The pkcs12-password behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_pkcs12_password$/)'
  - id: case-client-assertion-claims
    why: The client-assertion-claims behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_client_assertion_claims$/)'
  - id: case-invalid-certificate
    why: The invalid-certificate behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_invalid_certificate$/)'
  - id: case-token-response
    why: The token-response behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_token_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_certificate.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_certificate*")"
      && grep -lq 'azure_certificate' tools/oracle/fuzz/corpus/helper_case/azure_certificate* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_certificate$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_certificate)"
      && grep -q 'decode_certificate_material' crates/betterlite-azure/fuzz/fuzz_targets/azure_certificate.rs &&
      cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_certificate_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_secret_safe_failure$/)'
oracle_cases:
- tools/oracle/cases/helpers/providers/azure-certificate/pem-certificate.yaml
- tools/oracle/cases/helpers/providers/azure-certificate/pkcs12-password.yaml
- tools/oracle/cases/helpers/providers/azure-certificate/client-assertion-claims.yaml
- tools/oracle/cases/helpers/providers/azure-certificate/invalid-certificate.yaml
- tools/oracle/cases/helpers/providers/azure-certificate/token-response.yaml
deviations: []
out_of_scope: []
pitfalls:
- PKCS#12 decoding and RS256 signing need pure-Rust implementations; the Azure identity certificate feature pulls
  OpenSSL.
budget:
  max_changed_lines: 575
  max_new_expects: 0
review_level: security
