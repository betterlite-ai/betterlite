checks:
  optional:
  - mutants
  commands:
  - id: case-pem-certificate
    why: A byte sequence containing -----BEGIN selects the PEM parser; load the RSA private key and signing certificate
      from the same material. The configured path is read as binary; no request-controlled URL is fetched.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_pem_certificate$/)'
  - id: case-pkcs12-password
    why: Otherwise parse PKCS#12 using optional UTF-8 string/byte password. Missing private key raises The certificate
      must include its private key; bad data/password or missing certificate raises Failed to deserialize certificate
      in PEM or PKCS12 format. Preserve encrypted PEM separately from decrypted in-memory PKCS#12 key bytes.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_pkcs12_password$/)'
  - id: case-client-assertion-claims
    why: RS256 JWT has aud equal to the discovered token endpoint, iss/sub client_id, iat clock, exp clock+600 and
      UUID jti; no nbf by default. x5t is URL-safe base64 of the SHA-1 certificate fingerprint WITH padding; do
      not use SHA-256 or strip padding. No x5c because LiteLLM never requests send_certificate_chain. Reuse an assertion
      for 540 seconds, then regenerate at equality.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_client_assertion_claims$/)'
  - id: case-invalid-certificate
    why: Reject non-RSA keys with The certificate must have an RSA private key because RS256 is used for signing.
      Path/data both truthy raises ValueError Please specify either "certificate_path" or "certificate_data", not
      both; neither truthy raises ValueError CertificateCredential requires a value for either "certificate_path"
      or "certificate_data"; file-read and PEM parse failures propagate before HTTP. Do not collapse every failure
      into invalid_client.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_invalid_certificate$/)'
  - id: case-token-response
    why: 'Use B673 authority discovery and OAuth transport for grant_type=client_credentials, client_id, scope,
      client_assertion and client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer. No client_secret
      field. Preserve Authentication failed: {error_description or error}, expiry at request_time+int(expires_in),
      token_type default Bearer and optional refresh_on.'
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_token_response$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_certificate.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_certificate*")"
      && grep -lq 'azure_certificate' tools/oracle/fuzz/corpus/helper_case/azure_certificate* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_certificate$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_certificate)"
      && grep -q 'decode_certificate_material' crates/betterlite-azure/fuzz/fuzz_targets/azure_certificate.rs &&
      cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_certificate_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_secret_safe_failure$/)'
  - id: case-certificate-argument-boundary
    why: Validate tenant with B673 SDK input policy before file access. The public LiteLLM selector passes certificate_path
      and passes password only when its environment value is truthy; certificate_data/send_certificate_chain are
      not newly exposed config keys.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_certificate_argument_boundary$/)'
  - id: case-certificate-chain-header
    why: When B677 supplies send_certificate_chain=true, extract all PEM certificates between the first BEGIN CERTIFICATE
      and last END CERTIFICATE, remove line breaks, and supply the public certificate chain to MSAL for x5c. Otherwise
      omit x5c. Private key data never enters the public header.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_certificate_cases::case_[0-9]+_certificate_chain_header$/)'
