- text: 'certificate_argument_boundary: Validate tenant with B673 SDK input policy before file access. The public
    LiteLLM selector passes certificate_path and passes password only when its environment value is truthy; certificate_data/send_certificate_chain
    are not newly exposed config keys.'
  proof:
