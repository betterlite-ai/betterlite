references:
- url: https://docs.rs/p12-keystore/0.4.1/p12_keystore/
  why: Pure-Rust PKCS#12 reader, supported key/encryption formats.
- url: https://docs.rs/azure_identity/1.0.0/azure_identity/
  why: Identity crate does not provide the full Python credential family set.
- url: https://docs.rs/jsonwebtoken/latest/jsonwebtoken/
  why: RS256 with rust_crypto rather than OpenSSL.
- url: https://github.com/Azure/azure-sdk-for-python/blob/azure-identity_1.25.2/sdk/identity/azure-identity/azure/identity/_credentials/certificate.py#L64-L192
  why: Credential behavior in the azure-identity 1.25.2 from the pinned LiteLLM uv.lock; capture its transport seam
    instead of copying its Python SDK internals.
- url: https://github.com/Azure/azure-sdk-for-python/blob/azure-identity_1.25.2/sdk/identity/azure-identity/azure/identity/_credentials/certificate.py#L64-L192
  why: Certificate selection, errors and RSA constraint.
- url: https://github.com/AzureAD/microsoft-authentication-library-for-python/blob/1.37.0/msal/oauth2cli/assertion.py#L18-L135
  why: Assertion claims, padded thumbprint and 540-second regeneration.
dod:
- text: 'pem_certificate: A byte sequence containing -----BEGIN selects the PEM parser; load the RSA private key
    and signing certificate from the same material. The configured path is read as binary; no request-controlled
    URL is fetched.'
  proof:
  - case-pem-certificate
  - oracle
  - helper-python
- text: 'pkcs12_password: Otherwise parse PKCS#12 using optional UTF-8 string/byte password. Missing private key
    raises The certificate must include its private key; bad data/password or missing certificate raises Failed
    to deserialize certificate in PEM or PKCS12 format. Preserve encrypted PEM separately from decrypted in-memory
    PKCS#12 key bytes.'
  proof:
  - case-pkcs12-password
  - oracle
  - helper-python
- text: 'client_assertion_claims: RS256 JWT has aud equal to the discovered token endpoint, iss/sub client_id, iat
    clock, exp clock+600 and UUID jti; no nbf by default. x5t is URL-safe base64 of the SHA-1 certificate fingerprint
    WITH padding; do not use SHA-256 or strip padding. No x5c because LiteLLM never requests send_certificate_chain.
    Reuse an assertion for 540 seconds, then regenerate at equality.'
  proof:
  - case-client-assertion-claims
  - oracle
  - helper-python
- text: 'invalid_certificate: Reject non-RSA keys with The certificate must have an RSA private key because RS256
    is used for signing. Path/data both truthy raises ValueError Please specify either "certificate_path" or "certificate_data",
    not both; neither truthy raises ValueError CertificateCredential requires a value for either "certificate_path"
    or "certificate_data"; file-read and PEM parse failures propagate before HTTP. Do not collapse every failure
    into invalid_client.'
  proof:
  - case-invalid-certificate
  - oracle
  - helper-python
- text: 'token_response: Use B673 authority discovery and OAuth transport for grant_type=client_credentials, client_id,
    scope, client_assertion and client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer. No
    client_secret field. Preserve Authentication failed: {error_description or error}, expiry at request_time+int(expires_in),
    token_type default Bearer and optional refresh_on.'
  proof:
  - case-token-response
  - oracle
  - helper-python
- text: New azure_certificate seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_certificate_material has newly committed malformed and boundary inputs replayed through production
    parsing.
  proof:
  - parser-corpus
- text: credential identity isolation holds at this task’s owned boundary.
  proof:
  - credential-identity-isolation
- text: secret safe failure holds at this task’s owned boundary.
  proof:
