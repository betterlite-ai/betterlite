  - oracle
  - helper-python
- text: 'certificate_chain_header: When B677 supplies send_certificate_chain=true, extract all PEM certificates
    between the first BEGIN CERTIFICATE and last END CERTIFICATE, remove line breaks, and supply the public certificate
    chain to MSAL for x5c. Otherwise omit x5c. Private key data never enters the public header.'
