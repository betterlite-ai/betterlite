deviations: []
out_of_scope: []
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_certificate in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/certificate.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_certificate.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The x5t value retains base64 padding even though the JWT segments themselves do not.
- PKCS#12 detection is based on absence of -----BEGIN, not the file extension.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
