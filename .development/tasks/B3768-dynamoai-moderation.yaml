  - text: Pre-call hook forwards the raw messages list unchanged from data["messages"] into the DynamoAI request payload.
    proof: [dynamoai-tests]
  - text: During-call hook forwards the raw messages list unchanged from data["messages"] into the DynamoAI request payload for inspection.
    proof: [dynamoai-tests]
  - text: Post-call hook extracts role and content from response.choices[].message, skipping non-string content silently.
