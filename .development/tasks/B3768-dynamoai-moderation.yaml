  - text: Configuration loads api_key (required, DYNAMOAI_API_KEY env), api_base (optional, DYNAMOAI_API_BASE env, default https://api.dynamo.ai),
      policy_ids (optional, DYNAMOAI_POLICY_IDS env, comma-separated), and model_id (optional, DYNAMOAI_MODEL_ID env).
