    proof: [oracle]
  - text: Applied policies are extracted from appliedPolicies list with policy name, id, method, description, message and action.
    proof: [dynamoai-tests]
  - text: A BLOCK action without an explicit BLOCK policy in appliedPolicies produces an empty violation list (no violations).
    proof: [dynamoai-tests]
  - text: WARN, REDACT and SANITIZE actions do not become new local blocking actions; they are logged only.
    proof: [dynamoai-tests]
  - text: HTTP requests include Authorization header with Bearer token.
