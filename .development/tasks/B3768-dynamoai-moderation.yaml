id: B3768
title: DynamoAI moderation transport and decisions
description: >-
  Implement DynamoAI guardrail's request/response contracts, constructor initialization with api_key (required,
  reads DYNAMOAI_API_KEY), api_base (optional, default https://api.dynamo.ai, reads DYNAMOAI_API_BASE), policy_ids
  (optional comma-separated, reads DYNAMOAI_POLICY_IDS), and model_id (optional, reads DYNAMOAI_MODEL_ID). HTTP POST
  transport to /v1/moderation/analyze/ with Bearer token authorization. Policy decision extraction from finalAction
  field (BLOCK, WARN, REDACT, SANITIZE, NONE) and formatted violation details from appliedPolicies list. Pre-call
  and during-call hooks forward the raw messages list unchanged into the DynamoAI request payload; post-call output
  inspection extracts role and content from response.choices, skipping non-string content silently. Determine guardrail
  status by classifying the response into success (finalAction is NONE), guardrail_intervened (finalAction is BLOCK)
  or guardrail_failed_to_respond (API error or malformed response). A final BLOCK action without an explicit BLOCK
  policy in appliedPolicies produces no violations (an empty violation list); WARN/REDACT/SANITIZE actions do not
  become new local request-blocking actions (they are logged only). Configuration api_key reads DYNAMOAI_API_KEY
  environment variable and is required; missing key raises ValueError. Request/response contracts model the DynamoAI
  API schema with messages, policyIds, modelId, textType and appliedPolicies. Supported event hooks are pre_call,
  during_call and post_call.

