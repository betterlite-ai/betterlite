deviations:
  - what: DynamoAI error messages use betterlite's own wording in failure scenarios, not LiteLLM's exact text.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status codes unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/dynamoai/dynamoai.py#L255-L287
out_of_scope:
  - The should_run_guardrail gate (true/false decision based on call type and event filters); CustomGuardrail base class guard logic is owned by a concrete framework task.
  - add_guardrail_to_applied_guardrails_header call; a shared callback header helper is owned by a dedicated task.
  - Framework hook dispatch and event-hook registration; CustomGuardrail base class orchestration of hook invocation is owned by B164 (litellm/integrations/custom_guardrail.py).
  - Other guardrail providers (AIM, Akto, Cisco, etc.); each gets its own task.
pitfalls:
  - >-
    api_key is assigned at __init__ line 55 from the DYNAMOAI_API_KEY environment variable and used only in the
    Authorization header at line 119; mark the field as SecretString to prevent accidental logging in Debug output.
  - >-
    Pre-call and during-call hooks forward data.get("messages") unchanged into the DynamoAI request, not extracting
    or filtering individual message fields; post-call hook alone builds a new list by extracting role and content
    from response.choices[].message.
  - >-
    Non-string content in post-call response messages must be skipped silently, not raising an error.
  - >-
    A BLOCK finalAction without an explicit BLOCK policy in appliedPolicies must return an empty violation
    list, not raise an error.
  - >-
    WARN/REDACT/SANITIZE actions are informational only and must not cause the request to be rejected
    locally; only BLOCK causes rejection.
  - >-
    HTTP Authorization header must use the format Bearer <token>, not Bearer: <token> or other variations.
  - >-
    Policy ID defaults must match LiteLLM's: empty list if not specified, not a computed default.
  - >-
    api_base URL must support both http and https prefixes when constructing the /v1/moderation/analyze/
    endpoint.
review_level: security
