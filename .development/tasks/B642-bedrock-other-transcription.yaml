id: B642
title: Bedrock audio transcription payload and Converse calls
description: >-
  Add BedrockAudioInput and transcription execution for supplied wav/mp3/flac/ogg bytes. The pinned Python module
  only prepares _audio_payload and dispatches into a native binding with NO_PYTHON; helper oracle cases compare
  that actual preparation function and binding arguments using a capture stub, never betterlite against itself or
  the excluded rust_bridge implementation. Native request/reply fixture tests separately verify the referenced pinned
  native source contract: Converse user audio plus transcription instruction, system transcription assistant, maxTokens=4096,
  optional language/prompt/temperature, and text-only transcript output. Keep that limited oracle coverage explicit
  in the report; the provider still executes through normal signed HTTP.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/audio_transcription/__init__.py:
  BedrockAudioTranscriptionRustDispatch._audio_payload L21-L40; BedrockAudioTranscriptionRustDispatch.audio_transcriptions
  L42-L73; BedrockAudioTranscriptionRustDispatch.async_audio_transcriptions L75-L106.


  Named case contracts: wav_mime_payload: First call B1001 process_audio_file and preserve its filename/content_type/file_content
  behavior. Exact MIME audio/wav or audio/x-wav selects wav; audio/flac selects flac and audio/ogg selects ogg.
  Base64-encode bytes with the standard alphabet and ASCII output, returning data,format,filename, with no audio
  decoding or re-encoding. MIME matching is case-sensitive. mp3_mime_alias: Exact audio/mpeg and audio/mp3 both
  select mp3, even when the filename extension disagrees. All recognized MIME values take precedence over filename
  fallback; preserve the B1001 selected filename verbatim. filename_format_fallback: For an unrecognized MIME, use
  only the lowercased suffix after the final dot in filename, or an empty string if no dot exists. Accept exactly
  wav,mp3,flac,ogg; a filename ending in a dot yields an empty format. Do not infer content by inspecting magic
  bytes. unsupported_audio_format: If neither MIME nor suffix selects an allowed format, raise ValueError Unsupported
  Bedrock audio format for file {filename!r}. Preserve B1001 errors before this check. Python preparation can base64-encode
  empty bytes; the native request validator then rejects empty audio.data, so do not move that native error into
  the oracle preparation case. transcription_binding_arguments: Both dispatch methods use Route.TRANSCRIPTION with
  supplied provider and model, select NATIVE_TRANSCRIPTION or NATIVE_ATRANSCRIPTION and runtime.NO_PYTHON, pass
  the prepared audio plus model,api_key,api_base,custom_llm_provider,extra_headers,optional_params unchanged, and
  wrap the binding mapping as TranscriptionResponse. timeout_seconds is None for None, timeout.read for httpx.Timeout
  (not connect/write/pool), otherwise float(timeout). Capture the callable arguments at the excluded bridge binding
  seam and compare both sync/async paths; a binding or response-construction failure propagates. Do not port the
  excluded rust_bridge runtime or compare betterlite with itself.


  Standalone Rust fixture case native_audio_validation: Use the pinned native contract in normal Rust fixture tests:
  audio must be an object, otherwise InvalidType expected object with the actual JSON type. data must be a nonempty
  string, otherwise MissingField audio.data. Missing, wrong-type or unsupported format raises InvalidRequest audio.format
  must be wav, mp3, flac, or ogg; accept only exact lowercase formats. Ignore filename after preparation and do
  not decode the base64 payload. This validates the referenced native contract, not a Python oracle result.


  Standalone Rust fixture case native_transcription_request: Supported params are language,prompt,temperature,response_format.
  Start instruction exactly Transcribe the audio. Respond with only the transcript.; append The audio language is
  {language}. preceded by one space for a nonempty string language, then Additional context: {prompt} preceded by
  one space for a nonempty string prompt. Ignore wrong-type/empty language and prompt. Emit one user message whose
  content is first audio={format,source:{bytes:data}}, then text=instruction; system is [{text: You are a transcription
  assistant.}]. inferenceConfig starts maxTokens=4096 and copies temperature by key presence including null. response_format
  does not alter this body or produce a URL. This validates the referenced native contract, not a Python oracle
  result.


  Standalone Rust fixture case native_transcription_url: Implement the local transcription model/region selector
  for this native contract: remove the first matching prefix bedrock/converse/,bedrock/,converse/; take an optional
  leading region segment when its length exceeds3, it contains a hyphen and consists only of ASCII alphanumeric/hyphen;
  then remove one nova-2/ or nova/ prefix. If no path region exists, extract nonempty ARN region from the full ARN
  colon field3. Choose optional string aws_region_name, then model region, AWS_REGION_NAME, AWS_REGION, then us-west-2;
  retain empty strings at these choices. Endpoint chooses a string aws_bedrock_runtime_endpoint before api_base,
  trims it and uses https://bedrock-runtime.{region}.amazonaws.com if empty/missing; an explicitly empty runtime
  string suppresses api_base before falling back. Strip endpoint trailing slashes and append /model/{model_id}/converse;
  the native function does not percent-encode model_id. No AWS_DEFAULT_REGION or AWS_BEDROCK_RUNTIME_ENDPOINT environment
  read occurs in this URL function. This validates the referenced native contract, not a Python oracle result.


  Standalone Rust fixture case native_transcription_auth: Default Content-Type is application/json. Native environment
  validation preserves supplied headers and selects AwsSigV4 with service bedrock and the same region policy; it
  does not itself turn api_key into Bearer auth. B590/B594 credentials use host-supplied nonempty trimmed aws_access_key_id
  and aws_secret_access_key (optional trimmed session token) before ambient profile/role settings; otherwise use
  the shared chain with optional string aws_access_key_id,aws_secret_access_key,aws_session_token,aws_region_name,aws_session_name,aws_profile_name,aws_role_name,aws_web_identity_token,aws_sts_endpoint,aws_external_id
  before corresponding uppercase env vars. Secret names are exactly AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION_NAME,AWS_REGION,AWS_SESSION_NAME,AWS_PROFILE_NAME,AWS_ROLE_NAME,AWS_WEB_IDENTITY_TOKEN,AWS_STS_ENDPOINT,AWS_EXTERNAL_ID.
  Reuse shared loaders and sign through B595, keeping the native precedence fixture separate from Python signing
  paths. This validates the referenced native contract, not a Python oracle result.


  Standalone Rust fixture case native_transcript_reply: decode_transcription_reply parses the pinned Converse reply
  contract: require output.message.content array. Each block with text must hold a string; concatenate texts in
  order with no separator. A block lacking text, even a scalar, causes InvalidResponse Bedrock response contains
  non-text transcript content; a text key with a wrong type instead yields InvalidResponse invalid Converse response:
  {decoder_error}. Unknown extra keys on a text block are ignored. Empty content returns text empty string. Missing
  usage is allowed; when usage is present, require unsigned inputTokens/outputTokens and validate optional cache/total
  fields as in the native record, even though no usage is returned. Optional stopReason must be a string or null.
  Return only {text}; malformed structural JSON uses invalid Converse response: {decoder_error}. This validates
  the referenced native contract, not a Python oracle result.


  Outside-byte boundary: decode_transcription_reply consumes HTTP Converse response JSON bytes on the native transcription
  path in crates/betterlite-bedrock/src/transcription.rs or its scoped child module. Use that production decoder
  from the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_transcription_reply.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_bedrock_transcription_reply_corpus
  that checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Write standalone Rust test transcription_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test transcription_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  The 82-line count covers the owned Python binding/preparation ranges. The 245 production and 300 test lines also
  budget the separately referenced native transcription contract; Rust-only native fixtures are deliberately distinct
  from Python oracle coverage. Report that limitation when this task runs.


  Implement crates/betterlite-bedrock/src/transcription.rs with adjacent tests under transcription/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function transcription_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  wav_mime_payload, mp3_mime_alias, filename_format_fallback, unsupported_audio_format, transcription_binding_arguments.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_transcription* using HelperCase:
  kind: helper and the externally tagged bedrock_other_transcription variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_transcription that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 82 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 245 production lines, 300 behavior/config-test lines, 100 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 730 planned, 750 maximum changed lines.
