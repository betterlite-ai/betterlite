id: B642
title: Bedrock audio transcription payload and Converse calls
description: >-
  Add BedrockAudioInput and transcription execution for supplied wav/mp3/flac/ogg bytes. The pinned Python module
  only prepares _audio_payload and dispatches into a native binding with NO_PYTHON; helper oracle cases compare
  that actual preparation function and binding arguments using a capture stub, never betterlite against itself or
  the excluded rust_bridge implementation. Native request/reply fixture tests separately verify the referenced pinned
  native source contract: Converse user audio plus transcription instruction, system transcription assistant, maxTokens=4096,
  optional language/prompt/temperature, and text-only transcript output. Keep that limited oracle coverage explicit
  in the report; the provider still executes through normal signed HTTP.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/audio_transcription/__init__.py:
  BedrockAudioTranscriptionRustDispatch._audio_payload L21-L40; BedrockAudioTranscriptionRustDispatch.audio_transcriptions
  L42-L73; BedrockAudioTranscriptionRustDispatch.async_audio_transcriptions L75-L106.


  Implement crates/betterlite-bedrock/src/transcription.rs with adjacent tests under transcription/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_transcription in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function transcription_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  wav_mime_payload, mp3_mime_alias, filename_format_fallback, unsupported_audio_format, transcription_binding_arguments.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_transcription* using HelperCase:
  kind: helper and the externally tagged bedrock_other_transcription variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_transcription that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 82 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 115 production lines, 90 behavior/config-test lines, 75 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 305 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/transcription.rs
  - crates/betterlite-bedrock/src/transcription/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_other_transcription.rs
  - tools/oracle/src/helpers/bedrock_other_transcription/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_other_transcription.py
  - tools/oracle/cases/helpers/providers/bedrock-other-transcription/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_transcription*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-rust/crates/llms/src/bedrock/audio_transcription/mod.rs#L1-L253
  why: Native-only transcription contract; verify in normal Rust fixtures, not a nonexistent Python implementation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/audio_transcription/__init__.py#L21-L106
  why: >-
    Own BedrockAudioTranscriptionRustDispatch._audio_payload, BedrockAudioTranscriptionRustDispatch.audio_transcriptions,
    BedrockAudioTranscriptionRustDispatch.async_audio_transcriptions. Other functions in this file remain with the
    owners listed below.
dod:
- text: 'wav mime payload: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-transcription/wav-mime-payload.yaml.'
  proof:
  - case-wav-mime-payload
  - oracle
  - helper-python
- text: 'mp3 mime alias: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-transcription/mp3-mime-alias.yaml.'
  proof:
  - case-mp3-mime-alias
  - oracle
  - helper-python
- text: >-
    filename format fallback: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-transcription/filename-format-fallback.yaml.
  proof:
  - case-filename-format-fallback
  - oracle
  - helper-python
- text: >-
    unsupported audio format: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-transcription/unsupported-audio-format.yaml.
  proof:
  - case-unsupported-audio-format
  - oracle
  - helper-python
- text: >-
    transcription binding arguments: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-transcription/transcription-binding-arguments.yaml.
  proof:
  - case-transcription-binding-arguments
  - oracle
  - helper-python
- text: New bedrock_other_transcription seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-wav-mime-payload
    why: The wav-mime-payload behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_wav_mime_payload$/)'
  - id: case-mp3-mime-alias
    why: The mp3-mime-alias behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_mp3_mime_alias$/)'
  - id: case-filename-format-fallback
    why: The filename-format-fallback behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_filename_format_fallback$/)'
  - id: case-unsupported-audio-format
    why: The unsupported-audio-format behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_unsupported_audio_format$/)'
  - id: case-transcription-binding-arguments
    why: The transcription-binding-arguments behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_transcription_binding_arguments$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_transcription.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_transcription*")"
      && grep -lq 'bedrock_other_transcription' tools/oracle/fuzz/corpus/helper_case/bedrock_other_transcription*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_transcription$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/providers/bedrock-other-transcription/wav-mime-payload.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-transcription/mp3-mime-alias.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-transcription/filename-format-fallback.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-transcription/unsupported-audio-format.yaml
- tools/oracle/cases/helpers/providers/bedrock-other-transcription/transcription-binding-arguments.yaml
deviations: []
out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- The Python transcription function reaches NO_PYTHON native bindings, so the oracle can compare payload preparation
  only.
budget:
