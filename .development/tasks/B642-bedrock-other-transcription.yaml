  - id: case-wav-mime-payload
    why: First call B1001 process_audio_file and preserve its filename/content_type/file_content behavior. Exact
      MIME audio/wav or audio/x-wav selects wav; audio/flac selects flac and audio/ogg selects ogg. Base64-encode
      bytes with the standard alphabet and ASCII output, returning data,format,filename, with no audio decoding
      or re-encoding. MIME matching is case-sensitive.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_wav_mime_payload$/)'
  - id: case-mp3-mime-alias
    why: Exact audio/mpeg and audio/mp3 both select mp3, even when the filename extension disagrees. All recognized
      MIME values take precedence over filename fallback; preserve the B1001 selected filename verbatim.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_mp3_mime_alias$/)'
  - id: case-filename-format-fallback
    why: For an unrecognized MIME, use only the lowercased suffix after the final dot in filename, or an empty string
      if no dot exists. Accept exactly wav,mp3,flac,ogg; a filename ending in a dot yields an empty format. Do not
      infer content by inspecting magic bytes.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_filename_format_fallback$/)'
  - id: case-unsupported-audio-format
    why: If neither MIME nor suffix selects an allowed format, raise ValueError Unsupported Bedrock audio format
      for file {filename!r}. Preserve B1001 errors before this check. Python preparation can base64-encode empty
      bytes; the native request validator then rejects empty audio.data, so do not move that native error into the
      oracle preparation case.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_unsupported_audio_format$/)'
  - id: case-transcription-binding-arguments
    why: Both dispatch methods use Route.TRANSCRIPTION with supplied provider and model, select NATIVE_TRANSCRIPTION
      or NATIVE_ATRANSCRIPTION and runtime.NO_PYTHON, pass the prepared audio plus model,api_key,api_base,custom_llm_provider,extra_headers,optional_params
      unchanged, and wrap the binding mapping as TranscriptionResponse. timeout_seconds is None for None, timeout.read
      for httpx.Timeout (not connect/write/pool), otherwise float(timeout). Capture the callable arguments at the
      excluded bridge binding seam and compare both sync/async paths; a binding or response-construction failure
      propagates. Do not port the excluded rust_bridge runtime or compare betterlite with itself.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_cases::case_[0-9]+_transcription_binding_arguments$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_transcription.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_transcription*")"
      && grep -lq 'bedrock_other_transcription' tools/oracle/fuzz/corpus/helper_case/bedrock_other_transcription*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_transcription$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: native-audio-validation
    why: The native transcription contract is absent or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_native_cases::case_[0-9]+_native_audio_validation$/)'
  - id: native-transcription-request
    why: The native transcription contract is absent or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_native_cases::case_[0-9]+_native_transcription_request$/)'
  - id: native-transcription-url
    why: The native transcription contract is absent or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_native_cases::case_[0-9]+_native_transcription_url$/)'
  - id: native-transcription-auth
    why: The native transcription contract is absent or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_native_cases::case_[0-9]+_native_transcription_auth$/)'
  - id: native-transcript-reply
    why: The native transcription contract is absent or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_native_cases::case_[0-9]+_native_transcript_reply$/)'
  - id: parser-corpus
    why: Outside bytes lack replay through the actual decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_transcription_reply)"
      && grep -q 'decode_transcription_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_transcription_reply.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_transcription_reply_corpus$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::transcription_credential_identity_isolation$/)'
