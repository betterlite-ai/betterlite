out_of_scope:
- B029 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- Excluded litellm/rust_bridge runtime, catalog and native binding loaders remain excluded; capture their call seam
  only. B1001 owns process_audio_file and SDK upload handling. Reuse B590/B594/B595 credential and signing primitives;
  this task owns the local native model/region selector and the host-supplied credential selection before passing
  a typed credential source to that chain. These local policy functions preserve the referenced native contract,
