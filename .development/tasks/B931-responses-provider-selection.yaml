id: B931
title: Responses provider selection
description: >-
  Build responses_provider_selection in betterlite-core. Own all complete helpers at main.py 427-572
  and 764-964, including _AsyncPromptManagementOutcome. These helpers select native versus chat
  execution, preserve prompt mutations and prevent already resolved credentials crossing providers.
  They do not send provider requests. B174 supplies model resolution; B157 supplies a typed provider
  config lookup and B1114 the capability contract. Also own the complete OpenAILikeResponsesConfig
  class in betterlite-openai::response_compatible: its three overrides supply identity, headers
  and URL; inherited operations reuse B506/B507/B508/B509. B117 supplies
  synchronous prompt hooks through an injected PromptManager port; return merged messages, model and
  optional parameters without implementing its remote stores here. B905 converts and merges prompt
  input. B234 owns supplied file/vector ID mapping, B184 exception records, B185/B186 exception_type and B010 generic
  request parameters. B171 runs pure helper comparisons with scripted resolver and prompt outcomes.

  Native support is the actual config lookup, with model_info.supported_endpoints containing the
  exact /v1/responses string as a fallback opt-in. Missing config or use_chat_completions_api=true
  selects chat. Resolve provisional prompt behavior with that same predicate. Carry
  _litellm_carry_unmatched_cache_control_points=true only during a bridged hook and remove it in
  finally, even if it existed beforehand. Async merged outcomes are consumed once and bypass the
  sync hook. The fallback config resolves OPENAI_LIKE_API_KEY and OPENAI_LIKE_API_BASE through
  B129's get_secret_str port, both default unset; B002 supplies the environment snapshot and
  its production loader tests. No global OpenAI key/base fallback is added. DEFAULT_MAX_TOKENS
  is not read by these functions. The provider leaf takes typed values, never imports core.

  Register HelperCall::ResponsesProviderSelection with a tagged responses_provider_selection seed,
  independent Rust/Python adapters and effect traces for local_vars, kwargs, resolver calls and
  prompt calls. Python executes the actual helpers. Use named rstest rows under
  api::responses_provider_selection::tests for the cases below. Inputs are typed; decoding belongs
  to B171. Selection owns 296 nonblank/non-comment lines and the compatible class 31. Allow
  310 implementation, 160 tests, 110 fixtures, 95 adapters, 45 settings/seeds and 30 wiring
  lines, 750 total under 780.
