- tools/oracle/cases/helpers/responses-provider-selection/supplied-file-mapping.yaml
deviations:
- what: Encrypted-task compatibility failure retains APIConnectionError/status=500 and null SDK type/param/code, with bounded public wording instead of Python traceback text.
  why: Reuse the established B184/B187 diagnostic policy and assert the original literal cause separately.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L473-L487
out_of_scope:
- B038 owns dynamic JSON-provider class generation; it reuses this lower OpenAILikeResponsesConfig contract. B129 owns secret-store retrieval, exposed here through get_secret_str without remote I/O in the helper adapter.
- B1078 owns the whole responses function and mock response builder; B932 owns aresponses.
- B955 owns MCP/file-search dispatch functions; B1116 owns delete/cancel, B933 retrieve/input-items, B934 compact and B943 websocket functions in main.py.
- B117 owns prompt-store access; B234 owns the mapping algorithms. This task invokes their typed interfaces only.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_provider_selection in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_provider_selection.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_provider_selection.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An empty api_key or api_base still prevents a prompt from crossing the credential boundary.
- The bridged prompt context removes an existing _litellm_carry_unmatched_cache_control_points value instead of restoring it.
- A string use_chat_completions_api="false" is truthy, while the bridge predicate itself uses identity with true.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
