id: B931
title: Responses provider selection
description: >-
  Resolve Responses model prefixes and provider capability into a typed NativeOrChat target using B010/B174 and
  prompt-manager results. Preserve provisional prompt messages, provider re-resolution after prompt swaps and managed
  file/tool IDs from B234; do not construct transport URLs from client fields.


  Implement crates/betterlite-core/src/api/responses_provider_selection.rs. Use ResponsesProviderSelecInput and
  ResponsesProviderSelecResult with typed nested records; inject only the clock, repositories, transports and resolved
  settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment
  or duplicate credential resolution.


  Write adjacent tests.rs behavior functions openai_chat_completions_prefix, prompt_swapped_provider, encrypted_task_incompatible,
  managed_file_tool_mapping, explicit_use_chat_completions under api::responses_provider_selection::tests. Each
  named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.DEFAULT_MAX_TOKENS
  defaults to 4096. No environment reads occur outside betterlite-config. Test api::responses_provider_selection::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesProviderSelection in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns
  the re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_provider_selection:
  <typed input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this
  production service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare
  values and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/main.py: _bridges_to_chat_completions (L427-L431); litellm/responses/main.py:
  _bridge_kwargs (L437-L455); litellm/responses/main.py: _encrypted_task_support_failure (L461-L470); litellm/responses/main.py:
  _raise_responses_compatibility_failure (L473-L486); litellm/responses/main.py: _deployment_passes_through_responses
  (L489-L494); litellm/responses/main.py: _deployment_model_info_after_prompt_swap (L497-L501); litellm/responses/main.py:
  _resolve_responses_api_provider_config (L510-L518); litellm/responses/main.py: _api_base_kwarg (L521-L523); litellm/responses/main.py:
  _will_bridge_to_chat_completions (L526-L547); litellm/responses/main.py: _prompt_management_sees_a_provisional_message_list
  (L551-L572); litellm/responses/main.py: _resolve_prompt_swapped_provider (L764-L790); litellm/responses/main.py:
  _apply_prompt_management_to_responses_call (L793-L874); litellm/responses/main.py: _normalize_openai_chat_completions_responses_model
  (L881-L891); litellm/responses/main.py: _pop_use_chat_completions_api_kw (L894-L897); litellm/responses/main.py:
  _strip_responses_routing_prefix (L903-L906); litellm/responses/main.py: _resolve_model_provider_for_responses
  (L909-L931); litellm/responses/main.py: _apply_managed_file_id_mapping (L934-L964). Abstract/protocol declarations
  map to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 271 owned nonblank/non-comment/non-docstring Python lines (296 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 291 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 574 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B174 (Provider identity and model resolution), B234 (Supplied model-file and vector-ID
  mappings), B905 (Responses parameters), B909 (Responses input messages), B1087 (Api boundaries), B002 (Load LiteLLM
  config.yaml into typed config). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.
