references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L427-L572
  why: Config fallback, bridge filtering, encrypted-task refusal and temporary cache-control signal.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/main.py#L764-L964
  why: Credential boundary on prompt swaps, one-shot async results, prefix normalization and ID mapping calls.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/anthropic_cache_control_hook.py#L146-L146
  why: Literal name of the temporary prompt-management signal.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai_like/responses/transformation.py#L17-L51
  why: Whole fallback class; a nonempty explicit key replaces Authorization, while URL construction always appends /responses.
dod:
- text: >-
    provider_capability_selection compares config=null, compatible config and encrypted-unsupported config.
    Missing config bridges; a config with use_chat_completions_api=false stays native. supported_endpoints
    as ["/v1/responses"] or a tuple supplies the fallback config only if the lookup returned null;
    ["/responses"], the string "/v1/responses" and non-object model_info do not. api_base="" is passed
    through, but api_base=7 becomes null. Unknown provider in the provisional check returns bridged=true.
    Encrypted classification returns encrypted_task_unsupported for missing config, an explicit bridge
    or unsupported native config, and null for a capable native config. Raising it normalizes ValueError
    with message "Encrypted task classification requires a compatible native Responses deployment" via B185/B186.
    For provider=openai expect APIConnectionError,status=500,type/param/code null; the exact
    local cause is retained and the public message follows the existing bounded diagnostic policy.
  proof: [capabilities, oracle, python-adapter]
- text: >-
    compatible_provider_environment and loads_compatible_provider_settings resolve absent env to
    no key/base. Explicit api_key=sk-explicit beats OPENAI_LIKE_API_KEY=sk-env and overwrites
    Authorization="Bearer caller" with "Bearer sk-explicit"; api_key="" uses sk-env. With neither
    key, preserve the caller header and add none if absent. Identity is openai_like; inherited
    native_file_search=true but encrypted_agent_messages=false because the identity is not openai/azure.
    Explicit base=https://provider.test/v1/// beats OPENAI_LIKE_API_BASE and yields
    https://provider.test/v1/responses; empty explicit base uses the environment. Missing both
    raises ValueError "api_base is required for openai_like provider", with no status/type/param/code.
    Whitespace is not trimmed: key=" " becomes "Bearer  " and base=" " becomes " /responses".
    base=https://provider.test/responses becomes https://provider.test/responses/responses;
    base=https://provider.test/v1?x=1 becomes https://provider.test/v1?x=1/responses. These are
    pure config results; URL validity and provider I/O remain transport concerns.
  proof: [compatible-config, compatible-settings, compatible-corpus, oracle, python-adapter]
- text: >-
    model_prefix_and_bridge_parameters sends openai/chat_completions/gpt-4o and gets openai/gpt-4o,true;
    openai/chat_completions/ remains unchanged,false. responses/responses/gpt-4o loses only the first
    responses/; responses/ becomes empty. Pop use_chat_completions_api for absent,false,0,"",true,"false":
    expect false,false,false,false,true,true and removal in every case. Config-less bridge kwargs drop
    client_metadata alone, retaining an unknown vendor_option; with a config vendor_option is dropped
    unless explicitly allowed. client_metadata stays dropped even if allowed; temperature and api_key survive.
    Dynamic resolver key/base="" replace existing values, null does not; resolved provider updates local_vars.
  proof: [prefixes, oracle, python-adapter]
- text: >-
    prompt_swap_credential_boundary uses prompt_id=p, original openai/gpt-4o and swapped anthropic/claude-3-5-sonnet.
    With api_key and api_base both null the swap succeeds and model_info becomes null. Either present,
    including an empty string, rejects before any provider send with BadRequestError/status=400 and message
    "prompt_id 'p' swaps model 'openai/gpt-4o' -> 'anthropic/claude-3-5-sonnet', which changes the provider from
    'openai' to 'anthropic' after credentials for 'openai' were already resolved. Refusing to send them to
    'anthropic'. Point the request at a model whose provider matches the prompt's metadata.model, or set
    ignore_prompt_manager_model on the prompt to keep the requested model." A same-provider swap keeps
    model_info. An unresolvable original provider caught as BadRequestError allows the resolved new provider.
  proof: [credential-boundary, oracle, python-adapter]
- text: >-
    prompt_hook_mutation_order feeds input=hello and a hook adding a system message, model=openai/gpt-4o-mini,
    optional temperature=0.2. Expect B905's merged input and updated input/model/provider/temperature locals;
    prompt_label=production,prompt_version=2,prompt_variables={name:Ada} reach the hook unchanged. No eligible
    logging object returns original input/model/provider/model_info. An _async_prompt_merged_params outcome
    applies temperature=0.2, returns its deployment metadata, removes the outcome and makes zero hook calls.
    The bridged hook observes the temporary signal=true; successful and throwing hooks both remove it.
    A native hook neither adds nor removes an existing signal. Resolver calls occur only for a changed model.
  proof: [prompt-order, oracle, python-adapter]
- text: >-
    supplied_file_mapping passes input_file file_id=file_global, model_info.id=deployment_a and the B234 mapping
    to file_provider_a; expect only the mapped ID changed in returned input and local_vars.input. Absent or
    non-object model_info supplies model_id=null. Nonempty file_search tools pass through B234's vector-ID
    mapper and update local_vars.tools; null and [] skip that call and leave the tools local untouched.
    Unmapped IDs stay unchanged; these helpers do not fetch, persist, authorize or create managed files.
  proof: [file-mapping, oracle, python-adapter]
- text: The new responses_provider_selection tag is accepted by the shared helper-case decoder and replayed.
  proof: [helper-corpus, oracle, python-adapter]
checks:
  optional: [mutants]
  commands:
  - id: compatible-config
    why: the fallback loses its actual provider identity or silently normalizes credentials and URL
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^response_compatible::tests::compatible_provider_environment($|::)/)'
  - id: compatible-settings
    why: the production config loader ignores either OpenAI-like environment variable
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_provider_selection::tests::loads_compatible_provider_settings($|::)/)'
  - id: compatible-corpus
    why: compatible-provider environment settings lack new shared-loader seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/responses-compatible-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: capabilities
    why: fallback config or encrypted-task capability changes the selected API
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_provider_selection::tests::provider_capability_selection($|::)/)'
  - id: prefixes
    why: routing prefixes or bridge kwargs leak Responses-only parameters
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_provider_selection::tests::model_prefix_and_bridge_parameters($|::)/)'
  - id: credential-boundary
    why: prompt replacement can send credentials to another provider
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_provider_selection::tests::prompt_swap_credential_boundary($|::)/)'
  - id: prompt-order
    why: prompt hooks run twice or retain the temporary cache-control signal
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_provider_selection::tests::prompt_hook_mutation_order($|::)/)'
  - id: file-mapping
    why: supplied deployment mappings are ignored or falsy tools are unexpectedly rewritten
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_provider_selection::tests::supplied_file_mapping($|::)/)'
  - id: python-adapter
    why: provider-selection parity does not execute the pinned helpers
    run: test -f tools/oracle/helpers/responses_provider_selection.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: no new selection input exercises the common decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_provider_selection-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
