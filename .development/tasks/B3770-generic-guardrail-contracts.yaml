id: B3770
title: Generic guardrail contracts and inbound header policy
description: >-
  Build typed request and response contracts for the generic guardrail API, implement
  inbound header value sanitization with allowlisting, and handle echoed-row reconciliation
  for structured message rewrites. The request contracts preserve extra tool fields via
  explicit allow policy and include constructor settings for streaming, holdback coercion,
  and error fallback behavior.

  Headers are sanitized before forwarding to the guardrail service. A predefined allowlist
  includes host, accept-encoding, connection, accept, content-type, user-agent, glob patterns
  for x-stainless-* and x-litellm-*, and content-length. Headers outside the allowlist
  (and extra_headers if provided) have their values replaced with "[present]" so the service
  knows they existed without exposing them. Disallowed values are Falsy and become strings.

  The constructor (GenericGuardrailAPI.__init__) defaults unreachable_fallback to "fail_closed"
  and fail_on_error to True when None, setting streaming_sampling_rate to 5 and
  streaming_transform_mode to "block_only" when unset, so unset optional_params does not
  shadow top-level litellm_params. The async_handler is built once per instance via
  get_async_httpx_client.

  Echoed-row reconciliation preserves original message objects when the server echoes rows
  back unchanged; a server that modifies any row returns the guardrail's version except
  where the server echoed the shown message verbatim, in which case the original row is
  restored for the caller to see what changed.
