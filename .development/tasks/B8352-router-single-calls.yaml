  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4619-L4734
    why: Blocking and async image generation, with the empty counter key.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4736-L4910
    why: Transcription and speech, with the voice fallback.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4912-L4969
    why: Rerank.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4971-L5154
    why: Text completion in both forms and the adapter completion.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L5863-L5994
    why: Blocking and async embeddings, with the client key check.
dod:
  - text: Each async call sets its main argument, runs the fallback executor with its attempt, and returns an error unchanged; the adapter call skips update-before-fallbacks.
    proof: [single-calls-embedding, single-calls-image, single-calls-audio, single-calls-rerank, single-calls-adapter]
  - text: Each attempt passes LiteLLM's fake messages to selection, builds the arguments in LiteLLM's order, holds the slot and keys the counters as LiteLLM does.
    proof: [single-calls-embedding, single-calls-image, single-calls-audio, single-calls-rerank, single-calls-text]
  - text: The blocking embedding, image and text calls use sync selection; text completion runs once without the fallback executor and merges router defaults.
    proof: [single-calls-blocking]
  - text: A text completion with a priority goes to the scheduler.
    proof: [single-calls-text]
  - text: The batch call keeps model order, turns failures into values and regroups answers by message list.
    proof: [single-calls-batch]
checks:
  optional: []
  commands:
  - id: single-calls-embedding
    why: An embedding call loses its input or keys a counter wrongly.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::embedding_/)'
  - id: single-calls-image
    why: An image call drops the prompt or holds no slot.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::image_/)'
  - id: single-calls-audio
    why: The speech voice fallback or the transcription file is lost.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::audio_/)'
  - id: single-calls-rerank
    why: A rerank call sends messages to selection or loses caching.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::rerank_/)'
  - id: single-calls-text
    why: The prompt is not the selection message, or a priority skips the scheduler.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::text_/)'
  - id: single-calls-adapter
    why: The adapter id or the metadata group is lost.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::adapter_/)'
  - id: single-calls-blocking
    why: A blocking call holds an async slot, retries text completion, or keeps a client with another key.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::blocking_/)'
  - id: single-calls-batch
    why: A batch loses order or raises for one failed model.
    run: cargo nextest run --locked -p betterlite-sdk --no-tests=fail -E 'test(/^router_single_calls::tests::batch_/)'
oracle_cases: []
deviations:
  - what: "`arerank` does not put anything under `input`."
    why: LiteLLM sets `kwargs[\"input\"] = input`, which is Python's builtin `input` function; it cannot cross into Rust and the provider call ignores it.
  - what: Each call type reaches its provider function through an injected executor, and no `litellm.<call>` module function is looked up.
    why: Rust has no module state, and the rules ask for constructor wiring.
out_of_scope:
  - "B6020 owns the chat calls, the counters' first owner and RouterCompletionParts; B6021 the GenericCallExecutor trait; B016 selection; B017 the error stamp; B303 slots, clients and request update; B306 the blocking fallback executor; B310 the async one and update-before-fallbacks; B346 the scheduler; B364 the routing strategy pre-call check."
  - "B8355 passes the executors for these call types from the Python crate, and B8356 builds the Python Router that calls them."
  - "B014 and the provider tasks own the provider functions behind each executor."
pitfalls:
  - "`aspeech` sends no `caching` key, unlike every other call here."
  - "Blocking `image_generation` counts every call under the key `\"\"`, because LiteLLM never assigns the model name there."
  - "`text_completion` copies a router default only when the request lacks the key, except `metadata`, whose map is merged into the request's map."
  - "In `abatch_completion` an answer without an index goes to the first list, so keep the pair (answer, index) from each task."
  - "The adapter attempt passes `[{\"role\":\"user\",\"content\":\"default text\"}]` to selection, not the request's messages."
  - "There is no exception alert sink: `router_settings.alerting_config` is refused at config load with an error naming the key, so LiteLLM's `send_llm_exception_alert` call point is left out."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
