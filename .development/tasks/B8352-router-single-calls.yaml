id: B8352
title: Router embedding, image, audio, rerank and text calls
description: >-
  B6020 gives the Python `Router` its chat calls and B6021 its generic engine, but `Router.embedding`, `aembedding`, `image_generation`, `aimage_generation`, `atranscription`, `aspeech`, `arerank`, `text_completion`, `atext_completion`, `aadapter_completion` and `abatch_completion` have no Rust side. Each one is the same two steps in LiteLLM: a public call that sets the arguments and runs the fallback executor, and an underscore attempt that picks a deployment, merges its params and calls the provider function. Build them in one object next to B6020's.


  Put the code in the new module `crates/betterlite-sdk/src/router_single_calls.rs` and its folder. `RouterSingleCalls` is built from B6020's `RouterCompletionParts` (selection, fallback executor, slots, counters, scheduler, `cache_responses`) and one `GenericCallExecutor` (B6021's trait) per call type name, passed as a `Vec` of (name, executor) in the constructor: `embedding`, `aembedding`, `image_generation`, `aimage_generation`, `atranscription`, `aspeech`, `arerank`, `text_completion`, `atext_completion` and `aadapter_completion`. A missing executor answers B6021's `GenericError::UnknownCallType` with the name. It shares the counters `total_calls`, `success_calls` and `fail_calls` with B6020's object, so a Python `Router` reports one set. Every router service comes through B6020's ports, because betterlite-sdk may not depend on betterlite-router. B306's blocking fallback executor and B364's routing strategy pre-call check are not among them, so this module defines a small trait for each, and B8631 implements both in betterlite-server.


  The async public calls (router.py L4673-L4691, L4736-L4776, L4819-L4869, L4912-L4931, L5007-L5042, L5086-L5112, L5930-L5953) set `model` and the call's main argument on the request (`prompt`, `file`, `input` and `voice`, `adapter_id`), put the matching attempt under `original_function`, call B310's update-before-fallbacks step and run B310's fallback-with-retries executor. `aadapter_completion` does not call that step; it only merges `model_group` into `metadata`. On an error return the error unchanged. `atext_completion` with a non-null `priority` first removes it and goes to B346's scheduled call with the same arguments, as `acompletion` does.


  The async attempts (L4693-L4734, L4778-L4817, L4871-L4910, L4933-L4969, L5044-L5084, L5114-L5154, L5955-L5994) pick a deployment with B016's async selection, taking `specific_deployment` out of the request and passing the fake message LiteLLM passes for that call: `[{"role":"user","content":"prompt"}]` for images, transcription and speech, the real prompt for text completion, `default text` for the adapter, `input` for embeddings, and no messages for rerank. Then update the request with the deployment (B303), copy its params, take the client from B303, add one to `total_calls`, hold the deployment slot (B303) for the call, and call the executor with the arguments in this order: deployment params, the main argument, `caching` set to `cache_responses`, `client`, then the request. On success add one to `success_calls`. On an error add one to `fail_calls`, stamp the failed deployment id (B017) and return the error.


  Keep each call's counter key as LiteLLM has it: images and embeddings and rerank count by the deployment's model, transcription and speech by the group name, text completion and the adapter count successes by the deployment's model but failures by the group name. `aspeech` sends `voice` from the request, or the deployment's `voice` when the request has none, and sends no `caching`. Rerank sets no main argument.


  The blocking calls. `embedding` (L5863-L5928) and `image_generation` (L4619-L4671) run B306's blocking fallback executor with a blocking attempt that uses B016's sync selection, runs B364's routing strategy pre-call check instead of holding a slot. In `image_generation` the counter key is the empty string for every call, as in LiteLLM. The blocking `embedding` drops the client when the request's `api_key` differs from the client's key. `text_completion` (L4971-L5005) has no fallback executor at all: it sets `num_retries` from the request or the router, merges `model_group` into `metadata`, picks a deployment with the sync selection, copies the router's `default_litellm_params` into the request for each missing key (merging `metadata` maps), and calls the executor once with params, `prompt`, `caching` and the request.


  `abatch_completion(models, messages, request)` (L4156-L4247) runs B6020's `acompletion` for each model, all at once. With one message list it returns one answer per model in model order, where a failure is an error value. With a list of message lists it returns one list per message list, each holding that list's answers in model order; an error value that lost its index goes to the first list, as LiteLLM does.


  Tests are in `router_single_calls/tests.rs`, driven by fake executors and fake router services, with names that start with `embedding_`, `image_`, `audio_`, `rerank_`, `text_`, `adapter_`, `blocking_` and `batch_`. There is no fuzz target, because this task parses no bytes.
scope:
  paths:
  - crates/betterlite-sdk/src/router_single_calls.rs
  - crates/betterlite-sdk/src/router_single_calls/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4156-L4247
