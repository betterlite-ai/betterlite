id: B777
title: Delete keys and retain archived audit rows
description: >-
  Implement POST /key/delete and its delete services in source order. B124 KeyRequest defaults keys
  and key_aliases to null and rejects two falsey lists with 422; when both are supplied keys wins.
  Echo the original requested keys or aliases in deleted_keys, including duplicates and missing
  members of a partially matching request. The route's count assertion compares the request to its
  own echo, not to the actual deletion count. An entirely missing set raises 404; a missing subset
  does not. Normalize a non-string litellm-changed-by to null; the normal HTTP header is a string.
  Cases delete_keys_precede_aliases, delete_empty_lists_422, delete_partial_missing_echo,
  delete_duplicates_echo, delete_aliases_echo and delete_changed_by cover these distinctions.


  B770 hashes only sk- prefixed input. Query all matching token rows, authorize all of them before
  any write, then archive them. Proxy administrators and the exact internal-job api_key
  litellm_internal_jobs may delete any key. A team key requires the team to exist even for its
  owner; a team administrator or its non-null user_id owner is allowed. A personal key requires
  the same non-null owner. Cases delete_proxy_admin, delete_internal_job, delete_team_admin,
  delete_owner, delete_null_owner_denied, delete_missing_team_denied and delete_foreign_aborts_all
  distinguish these paths. B737 loads teams without cache; B800 checks team membership.


  Archive transformation samples one aware UTC deleted_at for the batch, copies deleted_by from
  caller.user_id, deleted_by_api_key from caller.api_key, and litellm_changed_by from the header.
  Rename a non-null org_id to organization_id. JSON encode non-null aliases, config, permissions,
  metadata, model_spend, model_max_budget, budget_fallbacks and router_settings. Drop relations
  litellm_budget_table, litellm_organization_table, object_permission, id and budget_limits.
  Preserve record order; empty transformation/save does nothing. An explicitly supplied transaction
  is used for create_many, otherwise use B770's archived-token repository adapter. Cases
  archive_audit_identity, archive_json_columns, archive_relation_removal, archive_empty_no_clock
  and archive_supplied_transaction cover every field and branch. Never recover plaintext secrets.


  After archive insertion snapshot B738 JWT mapping cache keys before the schema's delete cascade.
  Administrators call B124 delete_data once with all normalized requested tokens; other callers
  gather deletions for authorized rows and report those row tokens. Preserve failed_tokens in
  the service result, including missing requested tokens when the lengths differ; the HTTP result
  still echoes its request. Broadcast JWT mapping evictions through B878, evict each normalized
  token and hash_token(normalized_token) from the cache, then B819 syncs access-group membership
  from previous groups to null. Schedule B784's deleted-key hook only after the service succeeds.
  Cases delete_jwt_snapshot_before_cascade, delete_admin_and_owner_results,
  delete_hash_and_double_hash_eviction and delete_access_groups_last pin the order. Postgres
  cases archive_failure_keeps_live_keys, delete_failure_retains_archive,
  mapping_eviction_failure_keeps_delete and group_sync_failure_keeps_delete prove there is no
  enclosing transaction or rollback of preceding effects.


  Build the production key_delete module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  delete_key_fn (L4071-L4175; 90 source lines), can_modify_verification_token (L4895-L4963; 47 source
  lines), delete_verification_tokens (L4966-L5093; 110 source lines), _transform_verification_tokens_to_deleted_records
  (L5096-L5149; 47 source lines), _save_deleted_verification_token_records (L5152-L5168; 16 source lines),
  _persist_deleted_verification_tokens (L5171-L5188; 18 source lines), delete_key_aliases (L5191-L5208;
  17 source lines).


  Register POST /key/delete once and exercise it through B001 HttpCase. Its own except block
  at L4172-L4175 calls B124 handle_exception_on_proxy: no database and ordinary failures become
  500 internal_server_error; missing rows 404 and denied ownership 403 also use internal_server_error,
  with openai_error_param and numeric status code. A null delete result raises a 500 ProxyException
  with param keys and passes through unchanged. Messages identify the missing key set, denied
  key or unavailable database; use betterlite wording under the README error-message decision.
  Cases delete_no_database, delete_missing_all, delete_denied_error_shape and delete_null_result
  assert status/type/param/code. The request decoder's 422 precedes this except block.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 345 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  345 production, 355 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 765 changed lines estimated within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
