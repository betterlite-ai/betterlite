id: B060
title: Model group information and deprecation routes
description: >-
  Own proxy_server.py model_deprecations L16290-L16317, _get_model_group_info L16320-L16351 and
  model_group_info L16359-L16581. Register authenticated GET /model/deprecations and
  /v1/model/deprecations with ModelDeprecationResponse, and GET /model_group/info. Deprecations pass
  warn_within_days (default B843 DEFAULT_DEPRECATION_WARN_DAYS=30, an integer without a route-level
  lower bound) and the router to B843 collect_model_deprecations. No extra visibility filter or
  administrator check is present in this route. B052 owns general route permission checks.

  Group info returns {data: []} immediately for missing/empty llm_model_list or missing router. Otherwise
  proxy admin/view callers use B759 get_complete_model_list with empty key/team grants, B302 router
  names, injected user_model, general_settings.infer_model_from_keys default false, return_wildcard_routes
  false and the router. Other callers use B124 get_available_models_for_user with their full auth,
  database/cache/logger/settings, team_id=None and include/only model access groups both false. Filter
  B842 undiscoverable names using the actual caller team_id before group construction.

  _get_model_group_info preserves first occurrence order, filters an optional exact model_group string
  (empty is a real filter), calls B846 Router.get_model_group_info and validates returned data into
  ModelGroupInfoProxy. Missing group metadata produces a row with model_group and providers=[] plus
  schema defaults, not404. Mark is_public_model_group=true only for membership in the nonnull
  litellm_settings.public_model_groups list (default absent); public marking does not grant visibility.

  Next B141 append_agents_to_model_group runs even when the model_group filter matched no model;
  agents can therefore survive that filter. Its own lookup/access failures DEBUG-log and preserve
  prior rows. B007 TeamModelNameTranslator builds internal-to-public names for the callback filtering
  step. B124 _names_hidden_by_listing_callbacks receives unique public names in first-seen order;
  filter by those names but return the original group objects, without renaming their model_group.
  Preserve source order and null/default schema fields. No route-owned except block or
  handle_exception_on_proxy call exists; dependency errors flow through B003's global handler.
  These are read-only routes and do not invalidate catalogs or register unrelated management routes.

  Implement model_management in betterlite-server with files below 300 lines and adjacent tests.
  B002 loader tests public_groups_default_none_empty_and_marking, infer_models_default_false_and_true
  and invalid_typed_settings_fail exercise the real nested settings and their consumers; seed config_yaml.
  B860 fixtures use POSTGRES_TEST_URL or testcontainers for visibility queries. B001 HttpCase compares
  full bodies/errors for the real MIT server and betterlite. Shared query/config parsers remain with
  B003/B002. Allow 150 production, 270 table-driven tests, 90 wiring and 60 config lines, 570 within
  a 625-line gate; source docstring examples are not production implementation lines.
scope:
  paths:
    - crates/betterlite-server/src/model_management.rs
    - crates/betterlite-server/src/model_management/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/fuzz/corpus/config_yaml/model-management-*
    - tools/oracle/cases/management/model-management/**
    - crates/betterlite-config/src/sections/model_management.rs
    - crates/betterlite-config/src/sections/model_management/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L16278-L16351
    why: Deprecation aliases/default, group metadata conversion and public-group setting read.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L16505-L16581
    why: Actual group route, infer_model_from_keys read, visibility and callback filtering order.
dod:
  - text: 'Named cases: deprecation_alias_default30_negative_and_custom_window,
      deprecation_route_no_extra_grant_filter, group_missing_router_or_models_empty,
      admin_view_catalog_arguments, ordinary_caller_scope_arguments,
      undiscoverable_before_group_lookup, first_seen_dedup_and_exact_empty_filter,
      missing_group_metadata_default_row, public_group_marking_not_authorization,
      agents_appended_after_model_filter, agent_failure_retains_rows,
      callback_unique_public_names_original_group_objects, dependency_errors_not_locally_wrapped,
      authenticated_routes_no_database_writes.'
    proof: [behavior-tests, oracle]
  - text: Real config-loader tests and a new config_yaml seed prove both settings and invalid-value behavior.
    proof: [config-tests, config-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Listing ordering, fields or route behavior differs from source.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_management::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: A setting is ignored or uses an invented default.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::model_management::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: The new production-loader seed is absent or fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/model-management-*")" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/management/model-management/deprecation-aliases-and-window.yaml
  - tools/oracle/cases/management/model-management/empty-installation.yaml
  - tools/oracle/cases/management/model-management/admin-and-scoped-group-visibility.yaml
  - tools/oracle/cases/management/model-management/exact-group-filter-and-agent-append.yaml
  - tools/oracle/cases/management/model-management/public-marking-and-callback-filter.yaml
deviations: []
out_of_scope:
  - B843 owns date bucketing and deprecation collection; B846 owns router group metadata.
  - B007/B759/B124 own list construction and name translation; B842 owns discovery policy.
  - B141 owns agent append policy; stored-model writes remain B832-B840 and their existing owners.
pitfalls:
  - The public-name map affects callback filtering but does not rename the returned group objects.
  - Appended agents are outside the model_group filter applied earlier.
budget:
  max_changed_lines: 625
  max_new_expects: 0
review_level: security
