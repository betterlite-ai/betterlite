  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L708-L748
    why: >-
      Sentinel connection kwargs, auth separation (no credential_provider on monitors),
