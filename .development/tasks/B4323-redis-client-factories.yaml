id: B4323
title: Construct Redis, Sentinel and Cluster clients and pools
description: >-
  Construct reusable sync and async transports for Redis, supporting direct targets,
  URLs, Sentinel and Cluster deployment modes. Preserve pool timeout 5 seconds,
  Sentinel socket fallback 0.1 seconds, async Cluster health interval 25 seconds,
  and keepalive true unless explicitly overridden. Separate Sentinel-monitor
  authentication (sentinel_password only) from data-node credentials so monitors
  never receive the data node's credential provider or static password. Supply
  redacted diagnostics that mask credential_provider and redis_connect_func values,
  then pass the entire kwargs dict through B244's SensitiveDataMasker.mask_dict
  to also mask any key matching credential-like patterns (password, secret, key,
  token, auth, credential, access, private, certificate, fingerprint, tenancy).

  The client factories dispatch on redis_kwargs from B4321's resolution logic:
  startup_nodes selects RedisCluster (sync via redis.RedisCluster, async via the
  isolated node-failure transport from B4322), url selects Redis.from_url, sentinel_nodes
  and service_name select Sentinel (with separate monitor auth), and neither selects
  direct Redis. Each path coerces settings through B4321's _get_redis_client_logic,
  _get_redis_kwargs, _get_redis_url_kwargs and _get_redis_cluster_kwargs; apply
  credential providers from B4320 via _credential_provider_auth_kwargs before
  dispatching, and strip conflicting static credentials and IAM callbacks. Connection
  pools are built for URL and direct targets only, not Cluster or Sentinel. The
  pool timeout and Cluster defaults are from litellm.constants, and the socket
  fallback comes from environment variables or config keys. Redacted logging calls
  the two credential-masking functions (credential_provider, redis_connect_func)
  to substitute placeholders, then masks the whole kwargs dict via B244 before
  printing configuration tables with rich or plain logging when debug is enabled.

  Named cases cover client factory inputs and outputs: pool timeouts, socket timeouts,
  async Cluster health intervals, Sentinel auth separation, monitoring node isolation,
  literal environment defaults, and configuration that reaches the driver as kwargs.
  Redaction tests confirm credential providers, IAM callbacks and password-like fields
  never appear in logs.
scope:
  paths:
    - crates/betterlite-redis/src/redis_client_factories.rs
    - crates/betterlite-redis/src/redis_client_factories/**
  lint_tables: false
