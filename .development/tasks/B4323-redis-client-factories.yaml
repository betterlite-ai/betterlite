  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L751-L772
    why: >-
      Async Sentinel initialization mirrors sync, also with monitor auth separation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L809-L830
    why: >-
      Sync client dispatch: Cluster, URL, Sentinel or direct Redis.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L833-L903
    why: >-
      Async client dispatch and connection pool reuse, Cluster health check and
