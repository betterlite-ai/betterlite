id: B2333
title: Expired UI session cleanup worker
description: >-
  Extract the entire expired_ui_session_key_cleanup_manager.py L30-L158 from B789. Own its
  row protocol, manager constructor, cleanup, count normalization and expired-row query in
  betterlite-server::ui_session_cleanup. B124 startup owns job registration and the enabled/interval
  controls; this task supplies a callable worker, not a second scheduler.

  Constructor retains DB, auth cache and optional pod-lock manager default null. Acquire a
  B070 PodLockManager lock only when both manager and its Redis cache are truthy, with cronjob_id
  exactly litellm_expired_ui_session_key_cleanup_job. False/null acquisition logs debug and returns
  zero without querying. Without Redis proceed locally. Cases cleanup_without_distributed_lock,
  cleanup_lock_denied and cleanup_lock_key pin this behavior. Always release an acquired lock in
  finally, including empty results and failures; release exceptions escape that finally rather
  than being swallowed by the body catch. cleanup_release_on_all_exits and
  cleanup_release_failure_propagates cover the distinction.

  Query VerificationTokenRepository where team_id=litellm-dashboard AND expires<fresh aware UTC
  now, with take=LITELLM_EXPIRED_UI_SESSION_KEY_CLEANUP_BATCH_SIZE and no explicit ordering.
  Equal expiry and null expiry are excluded. Empty rows or all-null tokens return zero; empty
  string tokens are retained. Cases cleanup_expiry_boundary, cleanup_batch_take,
  cleanup_empty_or_null_tokens and cleanup_empty_token_retained exercise each branch.

  B2314 supplies the exact internal-jobs identity. Call B777 delete_verification_tokens with
  selected tokens, auth cache, that identity and litellm_changed_by=litellm_internal_jobs.
  Then await B784 async_key_deleted_hook with KeyRequest(keys=tokens), actual fetched deletion
  rows and response or {}, before computing the count. Cases cleanup_internal_identity,
  cleanup_delete_before_hook and cleanup_hook_failure_keeps_deleted_rows inspect the ordered effects.
  Any exception whose status_code is 404 logs debug and returns zero; every other body exception
  logs error and returns zero. The hook can therefore fail after deletion while the worker reports
  zero. cleanup_raced_delete_404 and cleanup_body_failure_error distinguish those diagnostics.

  Count normalization returns len(tokens) for null response. Prefer deleted_keys list length,
  then integer verbatim (Python bool is an integer), then the same two shapes nested under a
  deleted_keys dict. Otherwise use max(len(tokens)-len(set(failed_tokens)),0) when failures are
  truthy, else len(tokens). Do not silently normalize malformed failures: exceptions reach the
  worker catch. Cases cleanup_count_shapes, cleanup_count_bool_and_negative,
  cleanup_count_distinct_failures and cleanup_count_bad_failure_shape pin every branch.

  The batch env value defaults to 1000 and uses int() at module import; malformed text stops
  startup, it does not warn and fall back. Whitespace integer text is accepted; zero and negative
  integers are not rejected by this parser and are passed to repository take semantics. B002
  production config tests cleanup_batch_default, cleanup_batch_integer_values and
  cleanup_batch_invalid_startup load and consume the value. B124 owns
  LITELLM_EXPIRED_UI_SESSION_KEY_CLEANUP_ENABLED default 'false' and interval default 86400
  at their startup read sites; do not duplicate their parser or registration here.

  The helper oracle calls the undecorated manager with injected clock, lock and deletion/event
  collaborators; never invoke a route adapter. Real deletion integration uses POSTGRES_TEST_URL
  else testcontainers, unique schemas and no skipped infrastructure failures. No new external-byte
  decoder is added; B002 owns the existing configuration boundary and corpus. Production files
  stay below 300 lines. Allow 125 logic, 230 tests, 65 helper adapters, 50 config and 30 wiring
  lines, 500 within 550; the source contributes about 109 nonblank noncomment lines before
  removing docstrings, plus its imported constants.
