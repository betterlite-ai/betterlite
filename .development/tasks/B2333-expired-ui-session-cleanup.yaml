references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/expired_ui_session_key_cleanup_manager.py#L30-L158
    why: Own all worker methods, lock and deletion ordering and count normalization.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1725-L1732
    why: Actual int environment read for batch size and neighboring startup-owned controls.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1773-L1773
    why: Exact distributed lock job name.
dod:
  - text: Every worker branch and count shape above matches the pinned helper, including release failures.
    proof: [behavior-tests, oracle, helper-python, helper-case-corpus]
  - text: The real config loader preserves integer parsing and startup failures.
    proof: [config-tests, config-corpus]
  - text: Deletion and later hook failures preserve actual archived/live Postgres rows.
    proof: [postgres-tests]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Cleanup branch, diagnostic or count behavior is absent.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^ui_session_cleanup::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: The batch-size setting has not been loaded and consumed by production.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^ui_session_cleanup::tests::/) - test(/replays_the_/)'
    - id: postgres-tests
      why: The real archive/delete failure effects are unproved.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/ui_session_cleanup::tests::postgres_cleanup_effects$/)'
    - id: helper-python
      why: The pinned worker adapter is missing or incorrectly typed.
      run: test -f tools/oracle/helpers/ui_session_cleanup.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new worker seed replays the helper decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/ui-session-cleanup-*')" && grep -rlq ui_session_cleanup tools/oracle/fuzz/corpus/helper_case/ui-session-cleanup-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-corpus
      why: No batch-size seed exercises the existing config decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/ui-session-cleanup-*')" && grep -rlq LITELLM_EXPIRED_UI_SESSION_KEY_CLEANUP_BATCH_SIZE crates/betterlite-config/fuzz/corpus/config_yaml/ui-session-cleanup-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/ui-session-cleanup/lock-lifetime.yaml
  - tools/oracle/cases/helpers/ui-session-cleanup/expiry-and-token-selection.yaml
  - tools/oracle/cases/helpers/ui-session-cleanup/delete-hook-failure-order.yaml
  - tools/oracle/cases/helpers/ui-session-cleanup/count-shapes.yaml
deviations: []
out_of_scope:
  - B124 owns startup job registration and enabled/interval settings; B070 owns PodLockManager,
    B722 token queries, B777 deletion/archive, B784 events, B2314 internal-jobs identity and
    B002 configuration decoding. All functions in the covered cleanup module belong here.
pitfalls:
  - 'The oracle helper for this task is pre-registered as ui_session_cleanup in the server group. Replace the stub Op in tools/oracle/src/helpers/server/ui_session_cleanup.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/ui_session_cleanup.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Hook failure returns zero even when token deletion already committed.
  - A release_lock exception escapes the finally block despite the worker's otherwise catch-and-return-zero behavior.
budget:
  max_changed_lines: 550
  max_new_expects: 0
review_level: security
