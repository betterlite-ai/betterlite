id: B605
title: Bedrock Converse usage and thinking details
description: >-
  Add ConverseUsage projection for synchronous responses, batch output and cache details, keeping additionalModelResponseFields
  reasoning counts and separate cache read/write totals. Preserve source coercion and totals, including unknown
  versus zero thinking tokens; do not clamp counts or recompute explicit totals before the shared wire Usage model
  applies its own rules.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig._transform_reasoning_content L2107-L2117; AmazonConverseConfig._transform_thinking_blocks
  L2119-L2139; AmazonConverseConfig._parse_cache_details L2142-L2159; AmazonConverseConfig.thinking_tokens_from_additional_fields
  L2162-L2170; AmazonConverseConfig.is_converse_usage_shape L2173-L2175; AmazonConverseConfig._usage_count L2178-L2183;
  AmazonConverseConfig._cache_read_count L2186-L2188; AmazonConverseConfig._cache_write_count L2191-L2192; AmazonConverseConfig.usage_from_batch_output
  L2194-L2215; AmazonConverseConfig.transform_usage L2217-L2265.


  Reuse AnthropicConfig.thinking_tokens_from_usage from B579 (litellm/llms/anthropic/chat/transformation.py); its
  implementation remains with that prerequisite.


  Named case contracts: cache_read_write_tokens: Cache counts prefer cacheReadInputTokens/cacheWriteInputTokens
  then Invoke cacheReadInputTokenCount/cacheWriteInputTokenCount. First int/float excludingbool wins, truncating
  towardzero, including zero/negative; invalidfirst letssecond win. Live usage requires inputTokens/outputTokens
  and adds both cache counts to prompt_tokens; prompt details text_tokens=rawinput,cached_tokens=read,cache_creation_tokens=write,
  plus top-level cache_creation_input_tokens/cache_read_input_tokens. Do not add detail TTL counts again. cache_detail_ttl:
  Falsey cacheDetails ->None. Sum raw inputTokens for entries ttl exactly5m and1h; only return ephemeral_5m_input_tokens/ephemeral_1h_input_tokens
  when sum equals resolved cache-write count exactly. Unknown TTL entries skipped, so an unknown-only nonempty list
  with write0 yields zero/zero details. Partial/excess/mismatched sum ->None, no warning. Required inputTokens errors
  for recognized TTL propagate; do not int-normalize each detail before sum. additional_thinking_tokens: additionalModelResponseFields
  and its usage must be mappings; otherwiseNone. Delegate B579 thinking count extraction. transform_usage estimates
  B196 token_counter(text=reasoning_content,count_response_tokens=True) whenever contenttruthy, even if provider
  count present. Provider countnon-None wins via min(max(0,count),output_tokens); estimate has no completion-token
  cap. Positive reasoning ->details reasoning_tokens and output-reasoning text_tokens. Nonpositive reasoning ->bothNone
  if thinking_ran else reasoning0/textoutput, even provider explicitly reported0. Tokenizer errors propagate. batch_usage_shape:
  Converse shape detection uses presence of inputTokens or outputTokens, evenNone, not cache/total keys alone. Batch
  normalizes input/output/cache with numeric helper, supplies both cache key aliases, and totalTokens = numeric
  suppliedtotal iftruthy else input+output, excluding caches from fallback total. It does not forward cacheDetails
  or additional reasoning fields to live transformer. Unknown counts become0. negative_or_missing_counts: _usage_count
  scans aliases in order, accepts int/float but rejectsbool/numericstrings; truncates fractional values and retains
  negatives. Live input/output remain required raw values, so missing keys fail; no fallback zeros at this layer.
  Include invalid floats in typed parser boundary and preserve its rejection rather than overflow or saturation.
  total_token_normalization: Live totalTokens key, includingzero/None/negative, is passed through unchanged; only
  absence defaults expandedprompt+output. Batch explicitzero instead uses rawinput+output because of or. Compare
  constructor-produced Usage with supplied inconsistent totals, and do not silently make batch/live equal when the
  pin differs. reasoning_and_thinking_blocks: Reasoning text concatenates every reasoningText.text without separators
  and requires text when reasoningText exists. Thinking projection chooses reasoningText before redactedContent;
  emit type=thinking with thinking/signature only when respective value non-None (empty retained). A signature-only
  reasoningText can become a thinking block but separately fail required-text concatenation in a caller. Redacted
  block ->{type:redacted_thinking,data:<raw value>}; unknown blocks ignored.


  Implement crates/betterlite-bedrock/src/converse_usage.rs with adjacent tests under converse_usage/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_converse_usage in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_usage_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): cache_read_write_tokens, cache_detail_ttl, additional_thinking_tokens, batch_usage_shape, negative_or_missing_counts,
  total_token_normalization, reasoning_and_thinking_blocks. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_usage* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_usage variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_usage that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 140 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 230 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 550 planned, 550 maximum changed lines.
