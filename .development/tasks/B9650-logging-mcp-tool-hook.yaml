    why: MCPPostCallResponseObject; hidden_params has no default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/base.py#L45-L52
    why: HiddenParams and its response_cost field.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/operations.py#L2265-L2273
    why: The gateway caller runs post_call(original_response=result) before the hook, so loggers see the live result in kwargs.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/mcp/litellm_proxy_mcp_handler.py#L876-L886
    why: The Responses caller does the same and logs its own line when the hook path raises.
dod:
  - text: CallbackLogger has the defaulted MCP post-call method, and a logger that does not override it leaves the result unchanged.
    proof: [logger-trait-tests, hook-tests]
  - text: Loggers run once each in combined-list order, string entries are skipped, and a failing logger logs the non-blocking line without stopping the walk.
    proof: [hook-tests, oracle, new-hook-cases]
  - text: A replacement writes response_cost into model_call_details and carries its hidden params to the next logger; an in-place edit counts as hook content.
    proof: [hook-tests, oracle, new-hook-cases]
  - text: Changed content clears structured_content and sets is_error, unless the logger rewrote structured_content to match, as LiteLLM decides it.
    proof: [hook-tests, oracle, new-hook-cases, helper-python]
  - text: New helper corpus seeds call b9650 and replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: hook-tests
      why: The walk, the content replacement or the structured_content rule differs from LiteLLM.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^mcp_tool_hook::/)'
    - id: logger-trait-tests
      why: The new trait method is missing or its default does something.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^callback_logger::/)'
    - id: new-hook-cases
      why: No new helper case for the hook exists on this branch.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/logging-mcp-tool-hook)"
    - id: helper-python
      why: The b9650 adapter must exist and pass ruff and basedpyright.
      run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b9650)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b9650 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b9650/pyrightconfig.json
    - id: helper-case-corpus
      why: b9650 needs fresh seeds that replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/logging-mcp-tool-hook-*")" && grep -lE '^[[:space:]]+b9650:' tools/oracle/fuzz/corpus/helper_case/logging-mcp-tool-hook-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/logging-mcp-tool-hook
deviations: []
out_of_scope:
  - "The rest of litellm_logging.py belongs to B190's parts (B247 to B254) and the owners their out_of_scope lists name."
  - "Calling the hook: B950 (Responses and chat tool execution) and B8198 (_fire_mcp_tool_call_logging); each needs this task in its depends_on."
  - "Cisco AI Defense's async_post_mcp_tool_call_hook (cisco_ai_defense_mcp.py L97-L173), the only open-source logger that overrides the method. B9450 owns it; that task implements this trait method in betterlite-guardrails, registers CiscoMcpToolHook with the success callbacks this task's dispatch reads, and depends on this one."
  - "post_mcp_call guardrails (ProxyLogging.post_mcp_call_hook): B8394."
pitfalls:
  - "The originals are copied per logger, not once for the walk, so the second logger compares against what the first one left."
  - "Ok(None) still counts as hook content: the logger's copy, edited or not. Only an error means no hook content, and then a structured_content change the logger made on the live result survives."
  - "response_cost is written even when the reply's cost is None, as JSON null, because LiteLLM assigns the attribute unconditionally."
  - "Content equality is JSON value equality of the whole list; an item that only reorders keys is equal, an extra item is not."
  - "A logger in both the request list and the global list runs once: get_combined_callback_list dedupes by Arc identity, so the test must reuse the same Arc."
  - "The hidden params start from a fresh default for every call of the hook, never from a previous tool call."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
