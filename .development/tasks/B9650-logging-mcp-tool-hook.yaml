  paths:
    - crates/betterlite-logging/src/mcp_tool_hook.rs
    - crates/betterlite-logging/src/mcp_tool_hook/**
    - crates/betterlite-logging/src/callback_logger.rs
    - crates/betterlite-logging/src/callback_logger/tests.rs
    - tools/oracle/cases/helpers/logging-mcp-tool-hook/**
    - "tools/oracle/fuzz/corpus/helper_case/logging-mcp-tool-hook-*"
    - tools/oracle/helpers/b9650.py
    - tools/oracle/helpers/b9650/**
    - tools/oracle/src/helpers/logging/b9650.rs
    - tools/oracle/src/helpers/logging/b9650/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L1633-L1709
    why: The hook and _parse_post_mcp_call_hook_response, the whole range this task builds.
