id: B9650
title: Logging MCP post-call content hook
description: >-
  After an MCP tool call, LiteLLM hands the result to every success logger before the result goes back to the caller, and a logger may rewrite the content. That is Logging.async_post_mcp_tool_call_hook with its helper _parse_post_mcp_call_hook_response (litellm_logging.py L1633-L1709). The logging tasks B247 to B253 left exactly this range to B140. Two callers wait on it: B950's Responses tool execution (litellm_proxy_mcp_handler.py L876-L884) and B8198's _fire_mcp_tool_call_logging for the gateway's own tool calls (operations.py L2267-L2273). Both depend on this task, so the hook lives in betterlite-logging, which both crates already reach.


  Code goes in crates/betterlite-logging/src/mcp_tool_hook.rs and crates/betterlite-logging/src/mcp_tool_hook/ (types.rs, dispatch.rs, tests.rs). The skeleton declares `pub mod mcp_tool_hook;` in lib.rs. betterlite-logging can't depend on betterlite-mcp (betterlite-mcp already depends on betterlite-logging), so the result types here are plain JSON. `McpToolResult { content: Vec<serde_json::Value>, structured_content: Option<serde_json::Value>, is_error: bool }` is the CallToolResult the caller holds; each content item keeps its wire shape (a text, image or embedded resource object). `McpPostCallResponse { mcp_tool_call_response: Vec<serde_json::Value>, hidden_params: McpHiddenParams }` is MCPPostCallResponseObject, and `McpHiddenParams { response_cost: Option<f64> }` is the one HiddenParams field LiteLLM reads back. `McpToolHookCall<'call>` is what one logger receives: `kwargs: &'call IndexMap<String, serde_json::Value>` (the logging state's model_call_details), `response: &'call mut McpPostCallResponse` (the logger's own copy), `original: &'call mut McpToolResult` (the live result, which LiteLLM exposes to loggers as kwargs["original_response"] after the caller's post_call), `start_time` and `end_time` as `DateTime<FixedOffset>`.


  B8740's CallbackLogger trait (crates/betterlite-logging/src/callback_logger.rs) gets one more method with a default body, the way CustomLogger.async_post_mcp_tool_call_hook returns None (custom_logger.py L587-L600): `async fn async_post_mcp_tool_call_hook(&self, call: McpToolHookCall<'_>) -> Result<Option<McpPostCallResponse>, LoggerError>` returning Ok(None). Change nothing else in that file. Every existing logger keeps compiling because of the default.


  dispatch.rs holds `pub async fn async_post_mcp_tool_call_hook(state: &mut LoggingState, registry: &CallbackRegistry, result: McpToolResult, start_time, end_time) -> McpToolResult`. The callback list is B248's get_combined_callback_list over the request's success list (`DynamicCallbackLists::from(&state.dynamic_callbacks).success`) and the registry's `loggers(CallbackPhase::Success)`, each wrapped as `DynamicCallback::Logger`. A `DynamicCallback::Name` entry is skipped, since LiteLLM's `isinstance(callback, CustomLogger)` is false for a string. One `McpHiddenParams::default()` value starts the walk and carries from logger to logger. For each logger, in list order:

  1. Copy the result's content and structured_content as they are now (the originals for this logger).
  2. Build the logger's `McpPostCallResponse` from a copy of that content and the carried hidden params, and call the trait method.
  3. Ok(Some(reply)): write `reply.hidden_params.response_cost` into `state.model_call_details["response_cost"]` (JSON null when None), take reply's content as the hook content, and carry reply's hidden params on. Ok(None): the hook content is the logger's copy as the logger left it, so an in-place edit counts, and the hidden params stay. Err(error): log at error level "LiteLLM.LoggingError: [Non-Blocking] Exception occurred while logging {error}" and there is no hook content.
  4. The structured replacement matches when the result's structured_content now differs from the original and either there is no hook content, the hook content equals the original content, or the result's content equals the hook content.
  5. When there is hook content and it differs from the original content, it replaces the result's content.
  6. When the result's content now differs from the original content, the result has structured_content, and the structured replacement does not match, set structured_content to None and is_error to true.

  Return the result. Nothing in the walk fails the call: LiteLLM wraps each logger in a try block and logs the same line for anything that escapes.


  Oracle helper cases in tools/oracle/cases/helpers/logging-mcp-tool-hook/ call this task's helper with a starting result, the request's dynamic success list and the global success list, each logger given as a scripted behavior: none (returns None, no edit), edit_in_place (appends a text item to its copy and returns None), replace (returns a new response with given content and response_cost), replace_unchanged (returns the original content), fail (raises), rewrite_live (sets the live result's content and structured_content, as Cisco's guardrail does through kwargs, and returns None). The output is the final content, structured_content and is_error, model_call_details' response_cost when present, and the number of error lines. Cases: no-loggers, in-place-edit-clears-structured, replacement-sets-cost, replacement-equal-content, failing-logger-continues, live-rewrite-keeps-structured, two-loggers-carry-hidden-params, logger-in-both-lists-runs-once, name-entries-skipped. The Python adapter builds a real Logging object, sets litellm.success_callback for the global list, and stores the result under model_call_details["original_response"] before the call, as both callers do through post_call.


  Behavior tests in mcp_tool_hook::tests use rstest cases with the names above plus result_without_structured_content_keeps_is_error, and one test that a logger implementing only the default method leaves the result unchanged. callback_logger::tests gets one test that the default method returns Ok(None).
