id: B4143
title: Read bucket configs and download configured Python modules
description: >-
  Build crates/betterlite-server/src/bucket_config.rs and its folder: the code that reads a config.yaml out of an S3 or GCS bucket, resolves its `include` entries inside the same bucket, and downloads a module object from a bucket into a local file.
  LiteLLM does this in litellm/proxy/common_utils/load_config_utils.py. Nothing in betterlite reads a bucket yet, and this task does not wire it into the startup path.


  Bucket source. Define BucketConfigSource { bucket_type: BucketType, bucket_name: String, object_key: String } and BucketType { S3, Gcs }.
  BucketConfigSource::from_environment is generic over the EnvironmentLookup trait of betterlite-config and returns Result<Option<BucketConfigSource>, BucketConfigError>.
  It reads LITELLM_CONFIG_BUCKET_NAME, LITELLM_CONFIG_BUCKET_OBJECT_KEY and LITELLM_CONFIG_BUCKET_TYPE.
  No bucket name gives Ok(None). A bucket name without an object key is the error "LITELLM_CONFIG_BUCKET_OBJECT_KEY must be set to load the config from a bucket.".
  The type is Gcs only for the exact text "gcs"; unset, "s3" and any other text mean S3, as in LiteLLM's `bucket_type != "gcs"` test.


  Object readers. One reader is built per config load, so an include tree costs one client. A reader returns Ok(None) for a missing or unreadable object and logs the cause, as LiteLLM does.
  The S3 reader resolves AWS credentials once through B594 (the same default resolution LiteLLM gets from bedrock_converse_chat_completion.get_credentials(): no explicit keys, so the fixed AWS_* env names, profile and ambient sources apply) and signs each GET with aws-sigv4 over the B173 pooled client.
  If the credentials cannot be resolved, the reader is still returned and every read gives None after one logged error, which is what LiteLLM does when boto3 cannot build its client.
  The URL is https://{bucket}.s3.{region}.amazonaws.com/{key} with the key percent-encoded per path segment, or https://s3.{region}.amazonaws.com/{bucket}/{key} when the bucket name contains a dot (boto3 does the same, since a dotted name breaks the wildcard certificate).
  The region is AWS_DEFAULT_REGION, else us-east-1.
  The GCS reader builds one B3997 bucket client for the bucket name and calls its download_gcs_object. If the client cannot be built it logs and every read gives None.
  Bytes that are None or not UTF-8 give None after a logged error. Text that is not valid YAML gives None after a logged error naming the object key. An empty YAML document reads as an empty mapping.


  Config loading. load_config_from_bucket(source) reads the root object. A root that is not a YAML mapping is the error "Config object in bucket is not a YAML mapping: {key}". A root that is missing, unreadable or an empty mapping gives Ok(None), and the caller raises "Unable to load config from given source." (that caller is not in this task).
  A non-empty root then goes through include resolution.


  Includes. resolve_include_object_key(config_object_key, include_entry) works on POSIX paths with normpath rules.
  An entry starting with "/" is normalized and its leading slashes are removed, so it names a key from the bucket root.
  Any other entry is joined to the directory part of the declaring object's key and normalized. A leading ".." is kept (normpath does not drop it above the root).
  Unlike the file loader of B4142, there is no fallback to a root-relative key.
  resolve_bucket_includes walks the entries in order, the same way as B4142's resolve_includes: it reads each object once (a key already loaded is skipped, and the root's own key counts as loaded), merges it so lists are extended and every other value replaces, queues the included object's own includes after the existing queue, and drops the `include` key at the end.
  An included object that reads as None is the error "Included config could not be read from bucket: {key}. The underlying bucket error is logged above.".
  An included object that is not a mapping is the same "not a YAML mapping" error as the root. An `include` value that is not a list of strings is B4142's IncludeError.
  Reuse B4142's merge and include-entry code: edit crates/betterlite-config/src/sections/includes.rs only to make `merge` and `without_include` pub and to split the entry validation out of queue_includes into a pub function that returns the validated entries. Keep the file under 300 lines and keep B4142's behavior and tests unchanged.


  Module download. download_python_module(source_type, bucket_name, object_key, local_file_path) fetches the object with the same S3 or GCS client code, decodes it as UTF-8, creates the parent directories of local_file_path and writes the text there.
  Unlike the config readers, this path resolves credentials per call (LiteLLM builds a fresh BaseAWSLLM() each time) and a GCS client per call.
  LiteLLM returns True or False and logs the cause. betterlite returns Result<(), ModuleDownloadError>, with the cause kept as #[source], so its caller (B124's get_instance_fn work) can raise the same "Failed to download {object_key} from {storage_type} bucket {bucket_name}" ImportError text from the Err.
  The download must write nothing when the fetch or decode fails.


  Errors: BucketConfigError for the source, mapping and include failures, ModuleDownloadError for the download, each in the module's own files with #[source] causes.
  Add Cargo.toml dependencies in crates/betterlite-server for betterlite-bedrock, betterlite-logging and aws-sigv4 (same version as betterlite-config), and a serde-saphyr use already in the workspace for YAML.
  Fuzz target bucket_config_yaml in crates/betterlite-server/fuzz decodes arbitrary bytes through the function that turns an object body into a config value (parse_bucket_object(object_key, bytes)); it must never panic.
scope:
  paths:
    - crates/betterlite-server/src/bucket_config.rs
    - crates/betterlite-server/src/bucket_config/**
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/bucket_config_yaml.rs
    - crates/betterlite-server/fuzz/corpus/bucket_config_yaml/**
    - crates/betterlite-config/src/sections/includes.rs
    - crates/betterlite-config/src/sections/includes/**
    - tools/oracle/cases/helpers/bucket-config/**
    - "tools/oracle/fuzz/corpus/helper_case/bucket_config-*"
    - tools/oracle/helpers/b4143.py
    - tools/oracle/helpers/b4143/**
    - tools/oracle/src/helpers/server/b4143.rs
    - tools/oracle/src/helpers/server/b4143/**
  lint_tables: false
