    why: The only callers of the two download functions (_load_instance_from_remote_storage and _download_gcs_file_wrapper); they show the s3:// and gcs:// URL split and the ImportError text built from a False result.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/config_includes.py#L1-L140
    why: The shared include walker that resolve_bucket_includes plugs into; B4142 already ported it for files.
dod:
  - text: BucketConfigSource::from_environment returns None without a bucket name, the missing-object-key error with a name and no key, and Gcs only for the exact type text "gcs".
    proof: [source-tests]
  - text: An object body becomes a mapping; empty YAML becomes an empty mapping; invalid YAML and non-UTF-8 bytes read as missing.
    proof: [object-parse-tests, bucket-decoder-corpus]
  - text: resolve_include_object_key matches posixpath.normpath for relative entries, a leading "/" (bucket root), "..", "." and doubled slashes, with no root fallback.
    proof: [include-key-tests, helper-case-corpus]
  - text: resolve_bucket_includes extends lists, replaces other values, skips a key already loaded, handles a cycle, queues nested includes after the existing queue and strips `include`.
    proof: [bucket-include-tests, helper-case-corpus]
  - text: A missing included object gives the exact "Included config could not be read from bucket" message, and a non-mapping object gives the "not a YAML mapping" message.
    proof: [bucket-include-tests]
  - text: The S3 reader signs each GET with credentials resolved once by B594, uses virtual-hosted or path-style URLs by bucket name, and reads a non-200 answer or a transport error as a missing object.
    proof: [s3-reader-tests]
  - text: The GCS reader builds its client once and reads a missing object or a client that cannot be built as a missing object.
    proof: [gcs-reader-tests]
  - text: load_config_from_bucket returns None for a missing or empty root, errors for a root that is not a mapping, and returns the merged config for a root with includes.
    proof: [bucket-include-tests]
  - text: download_python_module writes the object text to the local path after creating parent folders, leaves no file when the fetch or decode fails, and returns a typed error with the cause for both S3 and GCS.
    proof: [module-download-tests]
  - text: B4142's merge and include-entry code is reused from betterlite-config and its own tests still pass.
    proof: [config-includes-regression]
  - text: The decoder fuzz target exists and its corpus replays.
    proof: [bucket-decoder-corpus]
checks:
  optional: [mutants]
  commands:
    - id: source-tests
      why: the env var source, its error or the exact "gcs" type test is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bucket_config::source::/)'
    - id: object-parse-tests
      why: object body parsing tests are missing or fail
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^bucket_config::object::/) - test(replays_the_bucket_config_yaml_corpus)'
    - id: include-key-tests
      why: include key resolution tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bucket_config::include_key::/)'
    - id: bucket-include-tests
      why: bucket include walking or load_config_from_bucket tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bucket_config::includes::/)'
    - id: s3-reader-tests
      why: S3 reader tests against a local test server are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bucket_config::s3_reader::/)'
    - id: gcs-reader-tests
      why: GCS reader tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bucket_config::gcs_reader::/)'
    - id: module-download-tests
      why: module download tests are missing or fail
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^bucket_config::module_download::/)'
    - id: config-includes-regression
      why: B4142's include tests fail after the merge helpers were made public, or the helpers are not public
      run: >-
        grep -q "pub fn merge" crates/betterlite-config/src/sections/includes.rs &&
        grep -q "pub fn without_include" crates/betterlite-config/src/sections/includes.rs &&
        INSTA_UPDATE=no cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::includes::/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4143)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4143 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4143/pyrightconfig.json
    - id: helper-case-corpus
      why: bucket-config helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bucket_config-*")" &&
        grep -lE '^[[:space:]]+b4143:' tools/oracle/fuzz/corpus/helper_case/bucket_config-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: bucket-decoder-corpus
      why: the object-body fuzz target or its replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/bucket_config_yaml.rs &&
        grep -q 'name = "bucket_config_yaml"' crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/bucket_config_yaml)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_bucket_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/bucket-config/include-relative-key.yaml
  - tools/oracle/cases/helpers/bucket-config/include-root-key.yaml
  - tools/oracle/cases/helpers/bucket-config/include-dotdot-key.yaml
  - tools/oracle/cases/helpers/bucket-config/includes-merge-lists.yaml
  - tools/oracle/cases/helpers/bucket-config/includes-cycle.yaml
  - tools/oracle/cases/helpers/bucket-config/include-missing-object.yaml
  - tools/oracle/cases/helpers/bucket-config/include-not-mapping.yaml
deviations:
  - what: betterlite downloads a Python module from s3:// or gcs:// and writes it to the local path, but does not run it.
    why: betterlite has no Python interpreter. LiteLLM's exec_module step is in get_instance_fn, which B124's remaining work owns; a callback given as an s3:// or gcs:// module URL needs the architect's decision (see notes).
  - what: The S3 region is AWS_DEFAULT_REGION, else us-east-1; boto3 also reads the shared config file and the SDK profile region.
    why: betterlite has no botocore config loader, and the region only picks the signing scope and the host for reading a bucket. A bucket in another region answers with a redirect error, which reads as a missing object.
  - what: A dotted bucket name is read with a path-style URL.
    why: boto3 switches to path style for such names so that the wildcard certificate still matches; the sent request differs in the host only.
  - what: A failed module download is a typed Rust error, not a False result.
    why: Rust rules forbid dropping the cause. The caller turns it into the same ImportError text.
out_of_scope:
  - "Calling this module at startup (the LITELLM_CONFIG_BUCKET_* branch in ProxyConfig.get_config, proxy_server.py L6031-L6048) and raising 'Unable to load config from given source.'; B124's remaining proxy_server.py work owns the call."
  - "get_instance_fn and _load_instance_from_remote_storage in litellm/proxy/types_utils/utils.py (URL splitting, temp file, exec_module, getattr of the instance); B124 owns them and calls download_python_module."
  - "GCSBucketBase and download_gcs_object; B3997 owns them."
  - "AWS credential resolution; B594 owns it."
  - "S3 log upload signing (s3_v2.py); B3993 owns it."
  - "get_file_contents_from_s3 and get_config_file_contents_from_gcs as separate public functions: nothing calls them at the pin outside this file, so only their reader code is built."
  - "Recursive include merging for files on disk; B4142 owns it and is only reused."
pitfalls:
  - The bucket type test is `bucket_type != "gcs"`, so "GCS", "Gcs" and "s3" and an unset LITELLM_CONFIG_BUCKET_TYPE all read from S3.
  - resolve_include_object_key must follow posixpath.normpath, not a path library for files; an entry such as "../shared/models.yaml" from "team/a.yaml" gives "shared/models.yaml", but from "a.yaml" it stays "../shared/models.yaml".
  - A leading "/" entry is the bucket root, and all leading slashes are stripped after normalizing, so "//x.yaml" is "x.yaml".
  - The root object's own key counts as already loaded, so a config that includes itself is skipped silently.
  - get_config_from_bucket returns None for an empty mapping, but a root that is a list or a string is an error, not None. Do not merge the two cases.
  - An included object that is an empty YAML document reads as an empty mapping and merges nothing; only a read failure is the FileNotFoundError text.
  - The S3 config reader reuses one client, but download_python_file_from_s3 builds credentials on every call; do not share the config reader's cached credentials with the module download.
  - download_python_file_from_s3 logs the full file text at debug level in LiteLLM; do not log module text, since it can hold secrets.
  - The GCS download sets bucket names that contain a folder path through B3997's own folder split; pass the LITELLM_CONFIG_BUCKET_NAME text through unchanged.
  - A key containing spaces, plus signs or non-ASCII characters must be percent-encoded per segment before signing, and the slash stays a slash.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
