id: B4778
title: Resolve agent access ceilings and forwarded caller identities
description: >-
  Build the pieces that cap an agent's own key: the access group ceiling of an agent, the stand-in auth record for the user and team an agent echoes back, the loaders for that caller's team and user rows, and the agent access set with its key-and-team intersection. All of it goes in crates/betterlite-auth, in two modules: `agent_access_groups` (files agent_access_groups.rs and agent_access_groups/**) and `agent_caller` (agent_caller.rs and agent_caller/**). Each module owns its error enum in its own files (`AccessGroupsError`, `AgentCallerError`). Neither module imports betterlite-core, because betterlite-core depends on betterlite-auth.

  Reuse, do not rebuild. B2313 (module `agent_policy`) owns the records `AgentCaller` (user_id and team_id, both optional) and `AgentResponse`. B2314 (module `resolved_key`) owns `UserApiKeyAuth`, which has the fields `agent_id`, `agent_caller`, `user_id`, `team_id` and `requires_fresh_policy`. B721 owns the access group row with the lists `access_model_names`, `access_mcp_server_ids` and `access_agent_ids`. B736 owns the user row read (get_user_object) and B737 owns the team row read (get_team_object) and the access group read (get_access_object). B4776 owns `AgentRegistry` with `stable_agent_id`. The caller headers x-litellm-user-id and x-litellm-team-id and `agent_caller_from_headers` are not here: B052 reads the headers and sets `agent_caller` on the key.

  Ports. Nothing reads a database or the registry directly. The first port is the trait `AccessGroupReads` (agent_access_groups/reads.rs, native async fn, no trait object), received by the constructor of `AgentAccessGroups<R: AccessGroupReads>`. Its methods: `has_database(&self) -> bool` (sync, false when no database is connected); `agent_access_group_ids(&self, agent_id: &str) -> Vec<String>` (the access_group_ids of the agent found by id or by name, in the registry first and then through the read-through that resyncs one row from the database; empty when the agent is unknown; it cannot fail, because LiteLLM swallows a failed resync and answers as if the agent was missing); `access_group(&self, access_group_id: &str, check_db_only: bool) -> Result<AccessGroup, AuthError>` (B737's get_access_object, where `AuthError` is the error type B737's access group read returns, and check_db_only=true bypasses the cache and reads the writer). The second port is the trait `CallerReads` (agent_caller/reads.rs), received by the constructor of `AgentCallerLoaders<R: CallerReads>`: `team(&self, team_id: &str) -> Result<TeamObject, AuthError>` (B737's get_team_object with default flags, where `TeamObject` is the row type that read returns) and `user(&self, user_id: &str) -> Result<Option<UserRow>, AuthError>` (B736's get_user_object with user_id_upsert false, check_db_only unset, and no sso id or email). The server builds the production implementations; that wiring is not in this task (see the notes). Tests use in-memory fakes.

  `AgentAccessGroupCeiling` (agent_access_groups/ceiling.rs) is a plain struct: `access_group_ids: Vec<String>` (the attached ids in the order the agent lists them, duplicates kept), and the BTreeSets `models`, `mcp_server_ids` and `agent_ids`. An empty set means that resource kind is denied. `AgentAccessGroups` has three methods.
  - `resolve_agent_access_group_ceiling(agent_id, check_db_only) -> Result<Option<AgentAccessGroupCeiling>, AccessGroupsError>`. It asks `agent_access_group_ids`; an empty answer returns None (nothing is capped) and reads no group. Otherwise it reads every attached group (LiteLLM reads them concurrently; the result does not depend on the order, so reading them one after another is fine) and unions the three lists of the groups that loaded. One group read goes through the private step `load_group`: with no database it logs the warning "Agent access group {id} cannot be loaded without a DB" and gives None, whatever check_db_only says; with check_db_only false a failed read logs the warning "Agent access group {id} could not be loaded, treating it as empty: {error}" and gives None; with check_db_only true a failed read returns the error as `AccessGroupsError::Read` (source kept). Ids whose group did not load stay in `access_group_ids` and add nothing to the sets, so a group that vanished denies instead of opening up. When check_db_only is true every read passes check_db_only=true to the port; when false every read passes false.
  - `agent_access_group_server_ids(agent_id) -> Result<Option<Vec<String>>, AccessGroupsError>`: the non-strict ceiling's `mcp_server_ids` as a sorted Vec, or None when no group is attached. B4670 (module `ceilings` in betterlite-mcp) calls this under the same name, and its production CeilingReads forwards to it.
  - `resolve_managed_agent_ceilings(agent_id, access_group_ids: &[String]) -> Result<Vec<AgentAccessGroupCeiling>, AccessGroupsError>`: for a managed agent, the ids come from the agent record the caller already holds (not from the registry) and every group is read with check_db_only=true, so a read error propagates. It returns an empty Vec when the agent has no ids and a Vec of one ceiling otherwise. LiteLLM takes the whole AgentResponse here; betterlite takes the two fields it reads, so this module needs no AgentResponse (see the deviations).

  `agent_caller_auth(auth: &UserApiKeyAuth) -> Option<UserApiKeyAuth>` (agent_caller/caller_auth.rs, a plain sync function, same name and argument as the method B4670's CeilingReads trait declares; the async trait method in betterlite-mcp wraps it). It returns None when `auth.agent_caller` is None. Otherwise it returns a fresh record built with `user_id` and `team_id` of the caller, a copy of the key's trace handle field as B2314 holds it, and `requires_fresh_policy` copied from the key; every other field is the record's default, so `agent_id` is None and the result never counts as an agent key itself. LiteLLM sets requires_fresh_policy after construction with model_copy, which skips validation. Build it the same way here so the copied value is exactly the key's value.

  `AgentCallerLoaders` (agent_caller/loaders.rs):
  - `load_agent_caller_team(&self, auth) -> Result<Option<TeamObject>, AgentCallerError>`: None when the key has no `agent_caller` or the caller has no team_id; otherwise `CallerReads::team(team_id)`. A read error returns `AgentCallerError::Team` with the cause as source. A caller we cannot resolve must never be treated as unrestricted, so there is no fallback.
  - `load_agent_caller_user(&self, auth) -> Result<Option<UserRow>, AgentCallerError>`: None when there is no `agent_caller` or no user_id; otherwise `CallerReads::user(user_id)`. A None row logs at debug "agent caller user {id} not found; no user ceiling applied" and returns None. A read error returns `AgentCallerError::User`.

  Oracle helper b4778 has four operations. `ceiling` and `managed_ceilings` call LiteLLM's resolvers with `agent_access_group_ids` and a `groups` map (group id to its three lists, or null for a group that does not load) as the loaders and print the ceiling or null. `caller_auth` builds a UserAPIKeyAuth from `agent_id`, `models`, `agent_caller` and `requires_fresh_policy`, calls agent_caller_auth, and prints user_id, team_id, agent_id, models and requires_fresh_policy of the result or null. `intersect_access` loads `config_agents` into a fresh registry, turns each access side into an AgentAccess (`unrestricted`, or a restricted set made of `restricted_ids` as given, `restricted_by_legacy_name` as the legacy id of the named config agent and `restricted_by_stable_name` as its stable id), calls _intersect_agent_access, and prints the sorted ids or unrestricted.

  Agent access (agent_access_groups/access.rs): `enum AgentAccess { Unrestricted, Restricted(BTreeSet<String>) }` (an empty set denies every agent); `to_stable_ids(registry: &AgentRegistry, ids: &BTreeSet<String>) -> BTreeSet<String>` maps each id through `registry.stable_agent_id`; `intersect_agent_access(registry, key_access, team_access) -> AgentAccess` maps both sides through to_stable_ids first and then: both Unrestricted gives Unrestricted; one Restricted side gives Restricted with that side's stable ids; both Restricted gives the intersection. B4779 and B4780 call these; the other methods of LiteLLM's AgentRequestHandler stay with them.
