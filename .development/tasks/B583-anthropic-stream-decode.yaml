id: B583
title: Anthropic SSE decoding and cancellation
description: >-
  Connect the existing SSE framing parser to bounded native event decoding and owned async iteration. Preserve the
  source iterator line handling and JSON-fragment accumulation, including its different bytes/string and passthrough
  behavior; do not invent standard SSE dispatch semantics at this boundary. Synchronous Python iteration remains
  B158 over the same Rust stream; no duplicate parser is allowed.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  _loads_stream_chunk L68-L69; ModelResponseIterator._parse_sse_data L1151-L1174; ModelResponseIterator.__iter__
  L1177-L1178; ModelResponseIterator.__next__ L1180-L1219; ModelResponseIterator.__aiter__ L1222-L1224; ModelResponseIterator.__anext__
  L1226-L1265; ModelResponseIterator.convert_str_chunk_to_generic_chunk L1267-L1290.


  Named case contracts: split_event_data: A line must start exact data:; strip first5 characters without trimming.
  Try JSON directly while chunk_type=valid_json; first JSONDecodeError switches permanently to accumulated_json
  and B582 accumulation. Already parsed nondict JSON reaches chunk_parser and can fail by source attribute/key errors;
  only accumulation skips nondict values. split_unicode: Native sync/async iterator bytes are UTF-8 decoded per
  yielded chunk, then scanned to first data: substring; a split UTF-8 sequence at this boundary raises decode ValueError
  wrapped as RuntimeError Error parsing chunk: <error>,\nReceived chunk: <chunk>. B005 transport line decoding may
  reassemble network UTF-8 before this boundary; test that separately without changing the direct helper oracle.
  multi_line_sse: String iterator chunks are not scanned for an embedded data: prefix; byte chunks are. Non-data/comment/event/blank
  chunks emit GenericStreamingChunk text empty,is_finished=false,finish_reason empty,usage=None,index0,tool_use=None.
  Multiple data lines in one string are not normalized/concatenated as standard SSE here. done_marker: There is
  no [DONE] special case. data:[DONE] fails JSON and remains an incomplete accumulator; EOF drains complete dict
  values then ends without a terminal marker. A valid message_stop chunk itself does not end iteration. invalid_json_event:
  Malformed/incomplete JSON switches to accumulation and may be silently left at EOF. Receiving ValueError wraps
  as RuntimeError Error receiving chunk from stream: <error>; parsing ValueError wraps as Error parsing chunk: <error>,\nReceived
  chunk: <chunk>; other exceptions retain their class. Native AnthropicError500 is not swallowed by either ValueError
  handler. native_error_event: Replay B582 type=error statuses/messages through sync and async iteration; rate-limit
  error event is still AnthropicError500, distinct from the byte/JSON parser failures. truncated_final_event: On
  each StopIteration/StopAsyncIteration, drain B582 with empty fragment and is_final=True if buffer truthy; return
  one remaining dict chunk per invocation, then stop when no complete dict remains. Truncated trailing bytes produce
  no invented error or finish chunk. passthrough_chunk_conversion: convert_str_chunk_to_generic_chunk scans first
  data: for both bytes and strings, JSON-decodes the entire remaining string once (no accumulation), then dispatches
  B582. Invalid JSON propagates JSONDecodeError directly; no data yields a default ModelResponseStream with state
  id. Preserve this asymmetry with native iteration.


  Implement crates/betterlite-anthropic/src/stream_decode.rs with adjacent tests under stream_decode/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_decode_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): split_event_data, split_unicode, multi_line_sse, done_marker, invalid_json_event, native_error_event, truncated_final_event,
  passthrough_chunk_conversion. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_stream_decode* using HelperCase: kind:
  helper and the externally tagged anthropic_stream_decode variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_stream_decode that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_anthropic_event consumes native Anthropic SSE data bytes from the shared framing
  parser in crates/betterlite-anthropic/src/stream_decode.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_stream_decode.rs calling that exact production function,
  with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_stream_decode.
  The adjacent test replays_the_anthropic_stream_decode_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 114 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 175 production lines, 235 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 600 planned, 600 maximum changed lines.
