checks:
  optional:
  - mutants
  commands:
  - id: case-split-event-data
    why: A line must start exact data:; strip first5 characters without trimming. Try JSON directly while chunk_type=valid_json;
      first JSONDecodeError switches permanently to accumulated_json and B582 accumulation. Already parsed nondict
      JSON reaches chunk_parser and can fail by source attribute/key errors; only accumulation skips nondict values.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_split_event_data$/)'
  - id: case-split-unicode
    why: 'Native sync/async iterator bytes are UTF-8 decoded per yielded chunk, then scanned to first data: substring;
      a split UTF-8 sequence at this boundary raises decode ValueError wrapped as RuntimeError Error parsing chunk:
      <error>,\nReceived chunk: <chunk>. B005 transport line decoding may reassemble network UTF-8 before this boundary;
      test that separately without changing the direct helper oracle.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_split_unicode$/)'
  - id: case-multi-line-sse
    why: 'String iterator chunks are not scanned for an embedded data: prefix; byte chunks are. Non-data/comment/event/blank
      chunks emit GenericStreamingChunk text empty,is_finished=false,finish_reason empty,usage=None,index0,tool_use=None.
      Multiple data lines in one string are not normalized/concatenated as standard SSE here.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_multi_line_sse$/)'
  - id: case-done-marker
    why: There is no [DONE] special case. data:[DONE] fails JSON and remains an incomplete accumulator; EOF drains
      complete dict values then ends without a terminal marker. A valid message_stop chunk itself does not end iteration.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_done_marker$/)'
  - id: case-invalid-json-event
    why: 'Malformed/incomplete JSON switches to accumulation and may be silently left at EOF. Receiving ValueError
      wraps as RuntimeError Error receiving chunk from stream: <error>; parsing ValueError wraps as Error parsing
      chunk: <error>,\nReceived chunk: <chunk>; other exceptions retain their class. Native AnthropicError500 is
      not swallowed by either ValueError handler.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_invalid_json_event$/)'
  - id: case-native-error-event
    why: Replay B582 type=error statuses/messages through sync and async iteration; rate-limit error event is still
      AnthropicError500, distinct from the byte/JSON parser failures.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_native_error_event$/)'
  - id: case-truncated-final-event
    why: On each StopIteration/StopAsyncIteration, drain B582 with empty fragment and is_final=True if buffer truthy;
      return one remaining dict chunk per invocation, then stop when no complete dict remains. Truncated trailing
      bytes produce no invented error or finish chunk.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_truncated_final_event$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/anthropic_stream_decode.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/anthropic_stream_decode*")"
      && grep -lq 'anthropic_stream_decode' tools/oracle/fuzz/corpus/helper_case/anthropic_stream_decode* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_anthropic_stream_decode$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-anthropic/fuzz/corpus/anthropic_stream_decode)"
      && grep -q 'decode_anthropic_event' crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_stream_decode.rs
      && cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::replays_the_anthropic_stream_decode_corpus$/)'
  - id: case-passthrough-chunk-conversion
    why: 'convert_str_chunk_to_generic_chunk scans first data: for both bytes and strings, JSON-decodes the entire
      remaining string once (no accumulation), then dispatches B582. Invalid JSON propagates JSONDecodeError directly;
      no data yields a default ModelResponseStream with state id. Preserve this asymmetry with native iteration.'
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::stream_decode_cases::case_[0-9]+_passthrough_chunk_conversion$/)'
