id: B583
title: Anthropic SSE decoding and cancellation
description: >-
  Connect the existing SSE framing parser to bounded native event decoding and owned async iteration. Preserve split
  UTF-8/events, comments and multi-line data, and separate parser errors from valid native error events. Synchronous
  Python iteration remains B158 over the same Rust stream; no duplicate parser is allowed.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  _loads_stream_chunk L68-L69; ModelResponseIterator._parse_sse_data L1151-L1174; ModelResponseIterator.__iter__
  L1177-L1178; ModelResponseIterator.__next__ L1180-L1219; ModelResponseIterator.__aiter__ L1222-L1224; ModelResponseIterator.__anext__
  L1226-L1265; ModelResponseIterator.convert_str_chunk_to_generic_chunk L1267-L1290.


  Implement crates/betterlite-anthropic/src/stream_decode.rs with adjacent tests under stream_decode/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_stream_decode in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_decode_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): split_event_data, split_unicode, multi_line_sse, done_marker, invalid_json_event, native_error_event, truncated_final_event.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_stream_decode* using HelperCase: kind:
  helper and the externally tagged anthropic_stream_decode variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_stream_decode that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_anthropic_event consumes native Anthropic SSE data bytes from the shared framing
  parser in crates/betterlite-anthropic/src/stream_decode.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_stream_decode.rs calling that exact production function,
  with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_stream_decode.
  The adjacent test replays_the_anthropic_stream_decode_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 114 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 145 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 416 planned, 425 maximum changed lines.
