checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_namespaces::/)
      - test(/::replays_corpus$/)'
  - id: case-namespace-tool-flatten
    why: the namespace-tool-flatten behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_namespaces::tests::namespace_tool_flatten($|::)/)'
  - id: case-namespace-name-collision
    why: the namespace-name-collision behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_namespaces::tests::namespace_name_collision($|::)/)'
  - id: case-namespace-restore
    why: the namespace-restore behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_namespaces::tests::namespace_restore($|::)/)'
  - id: case-allowed-tool-choice
    why: the allowed-tool-choice behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_namespaces::tests::allowed_tool_choice($|::)/)'
  - id: case-custom-tool-namespace
    why: the custom-tool-namespace behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_namespaces::tests::custom_tool_namespace($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_tool_namespaces.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_tool_namespaces-*)"
      && grep -qE "^[[:space:]]+responses_tool_namespaces:" tools/oracle/fuzz/corpus/helper_case/responses_tool_namespaces-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-tool-namespaces)"
