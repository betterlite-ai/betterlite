id: B913
title: Responses tool namespaces and tool output
description: >-
  Implement every tool-form, namespace and tool-output method at transformation.py L1886-L2264
  in betterlite-core::api::responses_tool_namespaces. Namespace descriptions join with "\n\n";
  nested function names flatten to namespace__name, while custom tools keep their own name.
  B907 supplies custom schemas, argument serialization and item IDs. B2226 owns the injected
  in-memory tool-call cache shared with B911/B912; output conversion stores each call before
  deciding its public output type. Use B004 chat records and B902 output shapes.

  Register responses_tool_namespaces in B171 with cache writes and ordered warnings in its
  result projection. This is parsed-record mapping, not tool execution. Count 301 nonblank,
  non-comment source lines; allow 290 implementation, 190 tests, 110 fixtures, 85 adapters
  and 25 wiring, 700 changed lines. No additional byte parser belongs here.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_tool_namespaces.rs
  - crates/betterlite-core/src/api/responses_tool_namespaces/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_tool_namespaces.rs
  - tools/oracle/src/helpers/core_ops/responses_tool_namespaces/**
  - tools/oracle/helpers/responses_tool_namespaces.py
  - tools/oracle/helpers/responses_tool_namespaces/**
  - tools/oracle/fuzz/corpus/helper_case/responses_tool_namespaces-*
  - tools/oracle/cases/helpers/responses-tool-namespaces/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L1886-L2264
  why: Complete namespace flattening/collision checks, both tool-list directions and cached output conversion.
dod:
- text: >-
    namespace_flatten maps namespace=ns,description=Group,tools=[{type:function,name:f,description:Fn}]
    to function ns__f,description="Group\n\nFn",parameters={type:object},strict=false.
    Missing member description uses Group; no group description uses Fn. Nested custom edit
    keeps name=edit and uses the combined description in B907's schema. Other nested types
    are dropped silently. Non-sequence/string tools invokes the flat namespace fallback,
    producing name=ns. Null/non-mapping parameters become {type:object}; strict uses bool().
    allowed_callers is strictly validated by B907, including preserving [].
  proof: [namespace-tests, oracle, namespace-adapter]
- text: >-
    namespace_collisions rejects a top-level function ns__f plus namespace ns/function f
    with ValueError("Top-level function names conflict with flattened namespace tools: ns__f").
    Multiple conflicts are sorted and joined by ", ". Name restoration maps ns__f -> (f,ns)
    and bare f only if it appears once across namespaces and is not top-level. Ambiguous
    bare f stays (f,null). Custom members are excluded from this map/collision check.
  proof: [namespace-tests, oracle, namespace-adapter]
- text: >-
    tool_forms preserves mcp and unknown tool maps. web_search/web_search_preview becomes
    web_search_options with search_context_size as supplied (missing=null), user_location
    falsy->null; the last search tool wins. Function defaults name/description="",
    parameters.type=object,strict=false. cache_control,defer_loading,allowed_callers,input_examples
    copy only when truthy; eager_input_streaming=false copies because it is non-null.
    Reverse conversion copies these five fields when non-null, including false/[]/{},
    and passes non-functions through as dictionaries. Null/empty tools returns [] and no search options.
  proof: [namespace-tests, oracle, namespace-adapter]
- text: >-
    unsupported_builtins supplies computer_use,image_generation,local_shell,shell,tool_search;
    each is removed with warning "Dropping Responses API tool of type '<type>': it has no
    Chat Completions equivalent and the target provider would reject the request." Other
    types are not included in that drop list. Duplicate builtins emit one warning per occurrence.
  proof: [namespace-tests, oracle, namespace-adapter]
- text: >-
    tool_outputs caches every tool call in every Choices entry under tool.id before filtering
    to type=function outputs. A function named ns__f yields type=function_call,name=f,
    namespace=ns,call_id=c,id=fc_c,arguments serialized by B907,status=completed unless the
    function has a truthy status. Provider-specific fields on the tool beat fields on its
    function; truthy attribute objects are converted only if they have __dict__. Custom edit
    yields type=custom_tool_call,id=ctc_c,input unwrapped by B907 and no namespace.
  proof: [namespace-tests, oracle, namespace-adapter]
- text: >-
    hosted_search_output reads message.provider_specific_fields.web_search_calls from a
    mapping's values or a sequence, validates each item, silently ignores invalid items and
    indexes valid ws_c under c. A matching function call c becomes that web_search_call
    instead of a custom/function call. Later entries with the same stripped ID overwrite
    earlier entries; non-mapping provider fields are ignored and malformed items do not fail the response.
  proof: [namespace-tests, oracle, namespace-adapter]
checks:
  optional: []
  commands:
  - id: namespace-tests
    why: namespace correlation, tool filtering or cache/output ordering changes
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_tool_namespaces::/)'
  - id: namespace-adapter
    why: namespace helpers lack checked independent mappings and ordered diagnostics
    run: test -f tools/oracle/helpers/responses_tool_namespaces.py && grep -qE '^[[:space:]]+responses_tool_namespaces:' tools/oracle/fuzz/corpus/helper_case/responses_tool_namespaces-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-tool-namespaces/namespace-flatten.yaml
- tools/oracle/cases/helpers/responses-tool-namespaces/namespace-collisions.yaml
- tools/oracle/cases/helpers/responses-tool-namespaces/tool-forms.yaml
- tools/oracle/cases/helpers/responses-tool-namespaces/unsupported-builtins.yaml
- tools/oracle/cases/helpers/responses-tool-namespaces/tool-outputs.yaml
- tools/oracle/cases/helpers/responses-tool-namespaces/hosted-search-output.yaml
deviations: []
out_of_scope:
- Other transformation.py functions belong to B907 custom tools, B908 options, B909 input dispatch, B910 reasoning merges, B911 repair, B912 results, B914 assembly, B915 sessions, B1115 details and B2411 input content.
- The legacy deduplicate/correspondence helpers at L925-L995 have no caller at the pin.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_tool_namespaces in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_tool_namespaces.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_tool_namespaces.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Top-level function allowed_callers is passed through on truthiness, unlike strict custom/namespace allowed_callers validation.
- Only the last web-search tool's options survive; combining search options would differ from the pinned result.
- Cache writes precede public-type filtering, so even a call omitted from output can affect later tool-result reconstruction.
review_level: standard
budget:
  max_changed_lines: 700
  max_new_expects: 1
