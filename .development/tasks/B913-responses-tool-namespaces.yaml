id: B913
title: Responses tool namespaces
description: >-
  Implement namespace flattening and restoration for Responses tools, including collision detection and model-visible
  names. Export NamespaceMap and transformed tool lists for request and response use; map server tools separately
  from user functions.


  Implement crates/betterlite-core/src/api/responses_tool_namespaces.rs. Use ResponsesToolNamespaceInput and ResponsesToolNamespaceResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions namespace_tool_flatten, namespace_name_collision, namespace_restore,
  allowed_tool_choice, custom_tool_namespace under api::responses_tool_namespaces::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesToolNamespaces in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_tool_namespaces: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._build_ns_chat_tool
  (L1887-L1926); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._namespace_chat_tools
  (L1929-L1951); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._validate_namespace_name_collisions
  (L1954-L1972); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._responses_tool_to_chat_form
  (L1975-L2034); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.responses_tools_to_chat_forms
  (L2037-L2039); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.transform_responses_api_tools_to_chat_completion_tools
  (L2042-L2058); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.transform_chat_completion_tool_params_to_responses_api_tools
  (L2061-L2099); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.namespace_tool_name_map
  (L2102-L2129); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._restore_namespace_tool_name
  (L2132-L2137); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig.transform_chat_completion_tools_to_responses_tools
  (L2140-L2235); litellm/responses/litellm_completion_transformation/transformation.py: LiteLLMCompletionResponsesConfig._web_search_calls_by_call_id
  (L2238-L2264). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 340 owned nonblank/non-comment/non-docstring Python lines (354 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 360 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 610 total within the 610-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B178 (Tool argument parsing and schema
  transforms), B907 (Responses codex tools), B1087 (Api boundaries). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
