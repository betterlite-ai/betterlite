  why: Own AzureFoundryMAIImageGenerationConfig.get_mai_image_generation_url, AzureFoundryMAIImageGenerationConfig.get_mai_image_edit_url,
    AzureFoundryMAIImageGenerationConfig.is_mai_model, AzureFoundryMAIImageGenerationConfig.normalize_mai_image_usage,
    AzureFoundryMAIImageGenerationConfig.get_supported_openai_params, AzureFoundryMAIImageGenerationConfig.map_openai_params,
    AzureFoundryMAIImageGenerationConfig._unsupported, AzureFoundryMAIImageGenerationConfig._image_count, AzureFoundryMAIImageGenerationConfig._map_size_param,
    AzureFoundryMAIImageGenerationConfig._validate_dimensions, AzureFoundryMAIImageGenerationConfig.transform_image_generation_response.
    Other functions in this file remain with the owners listed below.
