id: B554
title: Foundry MAI images and usage
description: >-
  Add MaiImageOptions and image usage normalization with Decimal-free integer token counts and checked pixel arithmetic.
  Missing width/height default to 1024 each; n is not inserted when absent, and the endpoint returns one image;
  minimum dimension is 768 pixels and maximum total pixels is 1,056,768. Preserve native field precedence, explicit
  drop policy and exact response size. No pixel download or image decoder is needed for this map.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/image_generation/mai_transformation.py:
  AzureFoundryMAIImageGenerationConfig.get_mai_image_generation_url L31-L50; AzureFoundryMAIImageGenerationConfig.get_mai_image_edit_url
  L53-L72; AzureFoundryMAIImageGenerationConfig.is_mai_model L75-L77; AzureFoundryMAIImageGenerationConfig.normalize_mai_image_usage
  L80-L134; AzureFoundryMAIImageGenerationConfig.get_supported_openai_params L136-L137; AzureFoundryMAIImageGenerationConfig.map_openai_params
  L139-L183; AzureFoundryMAIImageGenerationConfig._unsupported L186-L187; AzureFoundryMAIImageGenerationConfig._image_count
  L189-L195; AzureFoundryMAIImageGenerationConfig._map_size_param L197-L224; AzureFoundryMAIImageGenerationConfig._validate_dimensions
  L226-L238; AzureFoundryMAIImageGenerationConfig.transform_image_generation_response L240-L277.


  Reuse OpenAIError.__init__ from B668 (litellm/llms/openai/common_utils.py); its implementation remains with that
  prerequisite.


  Named case contracts: mai_generation_edit_url: None base raises ValueError api_base is required for Azure AI MAI
  image generation/editing respectively. Falsy version defaults preview. Partition on first ?, trim path trailing
  slashes, and if /mai/ appears rewrite from the first /images/ to /images/generations or /images/edits; otherwise
  append /mai/v1/images/<operation>. Any original ? preserves its query verbatim, even empty, instead of injecting
  api-version. Family detector lowercases and removes hyphens/underscores before matching maiimage. default_dimensions:
  Existing optional_params keys win by skipping matching non-default inputs. Missing width/height become1024; explicit
  width/height are passed through without the size-dimension validation, and size is always popped at the end. n
  is not defaulted into the request. known_and_custom_size: For a truthy size accept the named 1024x1024,1792x1024,1024x1792,512x512,256x256
  or custom text containing lowercase x; parse after lowercasing, then validate dimensions. Uppercase X alone takes
  the unsupported-value diagnostic before parsing. Malformed split/int yields Invalid size format, and other names
  yield Unsupported size value with the custom WIDTHxHEIGHT advice. dimension_and_pixel_limit: Size-derived width/height
  must each be at least768 before checking product <=1056768; violations raise UnsupportedParamsError azure_ai with
  the minimum-pixel or total-pixel diagnostic and actual dimensions/product. This validation runs even when drop_params=True.
  n_one_only: n is int directly (bool included), otherwise int(str(n)); invalid conversion raises UnsupportedParamsError
  n=<repr> is not a whole number of images for model <model>. A count unequal1 raises the exactly-one-image advice
  unless drop_params=True, which omits it; valid n=1/None is retained in its original representation. drop_unsupported_fields:
  Advertise n,size, additionally accept width/height in mapping. Unknown non-default keys absent from optional_params
  raise UnsupportedParamsError naming key/model and n,size,width/height unless drop_params=True, when omitted; existing
  optional unknown keys survive. usage_alias_priority: For None usage return zero input/output/total plus image/text
  details. Text priority: num_input_text_tokens, details.text_tokens, input_tokens or0. Image: num_input_image_tokens,details.image_tokens,0.
  Output: output_tokens,num_output_tokens,output_image_tokens,0. Explicit non-None input/total win, else sum; preserve
  unrelated top-level usage fields but replace details with only image_tokens/text_tokens. response_size: Only normalize
  usage if the response has a usage key; absent stays absent. JSON failure becomes B668 OpenAIError with raw text/status;
  B004 projects image_generation. Always set response.size=<optional width default1024>x<optional height default1024>,
  independent of returned image fields.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-foundry/src/mai_images.rs with adjacent tests under mai_images/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function mai_images_cases in betterlite-foundry with these exact named cases (one per oracle file):
  mai_generation_edit_url, default_dimensions, known_and_custom_size, dimension_and_pixel_limit, n_one_only, drop_unsupported_fields,
  usage_alias_priority, response_size. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_mai_images* using HelperCase: kind: helper
  and the externally tagged foundry_mai_images variant inside call. Do not put the Python stdin operation field
  in a HelperCase. Add oracle test helper_seeds_select_foundry_mai_images that parses every prefixed seed with the
  production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_mai_image_reply consumes MAI image JSON response bytes in crates/betterlite-foundry/src/mai_images.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-foundry/fuzz/fuzz_targets/foundry_mai_images.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-foundry/fuzz/corpus/foundry_mai_images.
  The adjacent test replays_the_foundry_mai_images_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 210 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 255 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 660 planned, 675 maximum changed lines.
