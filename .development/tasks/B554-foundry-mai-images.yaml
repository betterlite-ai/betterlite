checks:
  optional:
  - mutants
  commands:
  - id: case-mai-generation-edit-url
    why: None base raises ValueError api_base is required for Azure AI MAI image generation/editing respectively.
      Falsy version defaults preview. Partition on first ?, trim path trailing slashes, and if /mai/ appears rewrite
      from the first /images/ to /images/generations or /images/edits; otherwise append /mai/v1/images/<operation>.
      Any original ? preserves its query verbatim, even empty, instead of injecting api-version. Family detector
      lowercases and removes hyphens/underscores before matching maiimage.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_mai_generation_edit_url$/)'
  - id: case-default-dimensions
    why: Existing optional_params keys win by skipping matching non-default inputs. Missing width/height become1024;
      explicit width/height are passed through without the size-dimension validation, and size is always popped
      at the end. n is not defaulted into the request.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_default_dimensions$/)'
  - id: case-known-and-custom-size
    why: For a truthy size accept the named 1024x1024,1792x1024,1024x1792,512x512,256x256 or custom text containing
      lowercase x; parse after lowercasing, then validate dimensions. Uppercase X alone takes the unsupported-value
      diagnostic before parsing. Malformed split/int yields Invalid size format, and other names yield Unsupported
      size value with the custom WIDTHxHEIGHT advice.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_known_and_custom_size$/)'
  - id: case-dimension-and-pixel-limit
    why: Size-derived width/height must each be at least768 before checking product <=1056768; violations raise
      UnsupportedParamsError azure_ai with the minimum-pixel or total-pixel diagnostic and actual dimensions/product.
      This validation runs even when drop_params=True.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_dimension_and_pixel_limit$/)'
  - id: case-n-one-only
    why: n is int directly (bool included), otherwise int(str(n)); invalid conversion raises UnsupportedParamsError
      n=<repr> is not a whole number of images for model <model>. A count unequal1 raises the exactly-one-image
      advice unless drop_params=True, which omits it; valid n=1/None is retained in its original representation.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_n_one_only$/)'
  - id: case-drop-unsupported-fields
    why: Advertise n,size, additionally accept width/height in mapping. Unknown non-default keys absent from optional_params
      raise UnsupportedParamsError naming key/model and n,size,width/height unless drop_params=True, when omitted;
      existing optional unknown keys survive.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_drop_unsupported_fields$/)'
  - id: case-usage-alias-priority
    why: 'For None usage return zero input/output/total plus image/text details. Text priority: num_input_text_tokens,
      details.text_tokens, input_tokens or0. Image: num_input_image_tokens,details.image_tokens,0. Output: output_tokens,num_output_tokens,output_image_tokens,0.
      Explicit non-None input/total win, else sum; preserve unrelated top-level usage fields but replace details
      with only image_tokens/text_tokens.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_usage_alias_priority$/)'
  - id: case-response-size
    why: Only normalize usage if the response has a usage key; absent stays absent. JSON failure becomes B668 OpenAIError
      with raw text/status; B004 projects image_generation. Always set response.size=<optional width default1024>x<optional
      height default1024>, independent of returned image fields.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_response_size$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_mai_images.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_mai_images*")"
      && grep -lq 'foundry_mai_images' tools/oracle/fuzz/corpus/helper_case/foundry_mai_images* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_mai_images$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_mai_images)"
