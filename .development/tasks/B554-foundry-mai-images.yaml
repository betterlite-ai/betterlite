checks:
  optional:
  - mutants
  commands:
  - id: case-mai-generation-edit-url
    why: The mai-generation-edit-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_mai_generation_edit_url$/)'
  - id: case-default-dimensions
    why: The default-dimensions behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_default_dimensions$/)'
  - id: case-known-and-custom-size
    why: The known-and-custom-size behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_known_and_custom_size$/)'
  - id: case-dimension-and-pixel-limit
    why: The dimension-and-pixel-limit behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_dimension_and_pixel_limit$/)'
  - id: case-n-one-only
    why: The n-one-only behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_n_one_only$/)'
  - id: case-drop-unsupported-fields
    why: The drop-unsupported-fields behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_drop_unsupported_fields$/)'
  - id: case-usage-alias-priority
    why: The usage-alias-priority behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_usage_alias_priority$/)'
  - id: case-response-size
    why: The response-size behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::mai_images_cases::case_[0-9]+_response_size$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_mai_images.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_mai_images*")"
      && grep -lq 'foundry_mai_images' tools/oracle/fuzz/corpus/helper_case/foundry_mai_images* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_mai_images$/)' &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-foundry/fuzz/corpus/foundry_mai_images)"
      && grep -q 'decode_mai_image_reply' crates/betterlite-foundry/fuzz/fuzz_targets/foundry_mai_images.rs && cargo
      nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::replays_the_foundry_mai_images_corpus$/)'
