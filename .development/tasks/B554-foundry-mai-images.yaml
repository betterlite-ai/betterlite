  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_mai_images in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/mai_images.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_mai_images.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
