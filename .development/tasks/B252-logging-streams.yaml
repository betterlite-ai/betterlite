id: B252
title: Bounded stream logging and served text
description: >-
  Implement the stream gate and chat branch of _get_assembled_streaming_response, chat/embedding stream/result normalization, flush_passthrough_collected_chunks/async_flush_passthrough_collected_chunks,
  logging_utils _assemble_complete_response_from_streaming_chunks/_set_duration_in_model_call_details and served_output_texts
  chat/stream extraction and overlay. Aggregate incrementally with bounded tool/text buffers and sparse-index checks;
  no per-chunk retained list. Text completion stream assembly stays with B203.


  The assembly branch is `pub struct ChatStreamAssembler` in logging_streams, a unit struct that implements B250's
  StreamAssembler (crates/betterlite-logging/src/logging_success/ports.rs) for litellm_logging.py L4116-L4119 and
  L4143-L4144. assemble(state, result, mode) returns None unless state.stream is Some(true); then a SuccessResult::Chat
  result, and an Other result whose object is "text_completion" (the TextCompletionResponse B203's text stream hands
  over), come back unchanged, and every other result gives None. The Responses branch (L4120-L4140) and the interaction
  branch (L4141-L4171) are B9840's, whose LoggedStreamAssembler holds this type and hands it every result it does not
  answer itself; that composed type is the production assembler, so nothing here reaches betterlite-core. The Anthropic
  /v1/messages stream hands the success handlers an assembled ModelResponse, so it needs no branch beyond the chat one.
  Name its tests chat_stream_assembler_* in logging_streams's tests.rs: a streamed Chat result, a streamed text
  completion, a streamed chunk and a plain object, and each of them with stream None and Some(false).
  Budget 280 logic/types, 120 Rust/Python adapters, 300 tests and 60 wiring (760 total). Write the behavior rstest
  functions logging_streams_behavior_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure
  in the DoD; corpus replay tests have separate names. The helper operation logging_streams is already registered; each operation has its own Rust and Python adapter file and corpus seed.
  normalize_logging_result 2309-2359 is this task for chat/embeddings; later endpoints add their typed variants.


  Own the three stream_chunk_builder call sites in streaming_handler.py L1851-L1856, L2105-L2110 and L2230-L2235,
  supplied to B005 through its existing completion/failure callback. Call B2227 with chunks, messages, logging object
  and count_prompt_tokens. These are assembly handoffs, not duplicated ChunkProcessor algorithms. Include successful,
  failed and partial stream handoffs in logging_streams. Budget 790 including 30 integration lines.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-logging/Cargo.toml
  - crates/betterlite-logging/src/logging_streams.rs
  - crates/betterlite-logging/src/logging_streams/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/logging/streams.rs
  - tools/oracle/src/helpers/logging/streams/**
  - tools/oracle/helpers/logging_streams.py
  - tools/oracle/helpers/logging_streams/**
  - tools/oracle/cases/helpers/logging-streams/**
  - "tools/oracle/fuzz/corpus/helper_case/logging_streams-*"
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L4108-L4144
  why: Primary source seam; additional named methods below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L2703-L2710
  why: flush_passthrough_collected_chunks
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L2712-L2716
  why: async_flush_passthrough_collected_chunks
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L4108-L4144
  why: _get_assembled_streaming_response; ChatStreamAssembler is its stream gate and chat branch (L4116-L4119, L4143-L4144), and B9840 builds the Responses and interaction branches between them.
dod:
- text: ChatStreamAssembler returns a streamed chat or text completion result unchanged and None for every other result
    and for every call that is not streamed.
  proof:
  - chat-assembler-tests
- text: Each listed helper case compares its named production function with the pinned Python function, including
    precedence, omissions and error facts.
  proof:
  - oracle
  - helper-python
- text: Adjacent behavior tests exercise every branch described above, bounds, injected dependencies and typed failures
    independently of corpus replay.
  proof:
  - behavior-tests
- text: Each operation has a newly committed seed consumed by the shared helper parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: new behavior tests are missing or fail
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::logging_streams_behavior_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: chat-assembler-tests
    why: the chat branch of the stream assembler is missing, passes on a result it should drop or ignores the stream flag
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^logging_streams::.*chat_stream_assembler_/)'
  - id: helper-python
    why: strict adapters fail
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: new helper seeds are missing or fail replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/logging_streams-*")"
      && grep -lq 'logging_streams' tools/oracle/fuzz/corpus/helper_case/logging_streams-* && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/logging-streams/stream-tools-usage.yaml
- tools/oracle/cases/helpers/logging-streams/served-text-overlay.yaml
- tools/oracle/cases/helpers/logging-streams/sparse-choices.yaml
- tools/oracle/cases/helpers/logging-streams/cancel-partial.yaml
- tools/oracle/cases/helpers/logging-streams/many-chunks.yaml
deviations: []
out_of_scope:
- The remaining functions in the shared covered paths belong to B190 and its explicitly named sibling parts; this
  part implements only the functions/ranges listed above.
- Exporter-specific setup/delivery B110-B118; prompt management methods 1012-1312 B8560; MCP hooks 1633-1709 B140;
  cost and baseline helpers 1719-2115/2395-2451 B068/B069/B125; background interactions B3481/B3496; interaction stream shape B098; the Responses and
  interaction branches of _get_assembled_streaming_response 4120-4142 and _assemble_completed_interaction_response
  4146-4171 B9840; record_streamed_anthropic_message_id 4174-4175 B976; the call-type result conversion in
  _success_handler_helper_fn 2519-2527 and the Anthropic messages, Responses, GenAI and A2A conversions it calls
  4177-4343 B9840.
- Building the production StreamAssembler is B9840's LoggedStreamAssembler, which wraps ChatStreamAssembler; handing
  one value of it to the server's success handlers is the server composition root's.
- Enterprise callback controls are excluded by repository licensing rules; no enterprise implementation is read
  or ported.
pitfalls:
- 'Name every corpus seed tools/oracle/fuzz/corpus/helper_case/logging_streams-<case>.yaml. The rest of that folder belongs to other tasks.'
- 'The oracle helper for this task is pre-registered as logging_streams in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/streams.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/logging_streams.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Adapters compare independently executed implementations; error cases ignore /error/message with the betterlite-owned
  wording reason.
- ChatStreamAssembler tests the stream flag before the result, so a complete Chat result on a call whose stream is None
  assembles nothing; a ModelResponseStream chunk gives None too, since the stream wrapper hands over the built response.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
