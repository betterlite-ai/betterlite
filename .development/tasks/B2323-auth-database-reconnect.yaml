    - tools/oracle/src/helpers/db/auth_reconnect.rs
    - tools/oracle/src/helpers/db/auth_reconnect/**
    - tools/oracle/helpers/auth_reconnect.py
    - tools/oracle/helpers/auth_reconnect/**
