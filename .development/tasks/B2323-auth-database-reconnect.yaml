dod:
  - text: 'Cases equal_generation_different_handle, stale_live_waives_once, failed_repair_cooldown,
      force_bypasses_both_checks, queued_caller_rechecks, completion_time_cooldown,
      lock_timeout_and_acquire_error, cancellation_acquire_race_releases, escalation_marks_dead,
      generation_snapshotted_before_await, missing_database_url_error,
      dead_recreate_failure_keeps_marker, direct_writable_short_circuit,
      readonly_or_probe_error_recreates, forced_skips_probe, direct_select_one_after_recreate,
      forced_decline_false_resets_failures, failures_record_original_target and overall_timeout
      compare the actual MIT policy and production transitions.'
    proof: [behavior-tests, helper-python, oracle]
  - text: Each real env setting is loaded, malformed input stops startup and new config/helper seeds replay.
    proof: [config-tests, config-corpus, helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: The reconnect state machine or Postgres observations differ.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^auth_reconnect::tests::/) - test(/replays_the_/)'
    - id: config-tests
      why: A reconnect env default, parser or clamp is missing.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_reconnect::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: New real reconnect env configuration seeds are absent.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-reconnect-*")" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: helper-python
      why: The injected MIT reconnect adapter fails strict checking.
      run: test -f tools/oracle/helpers/auth_reconnect.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new reconnect operation has no shared decoder seed.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-reconnect-*")" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/auth-reconnect/cooldown-and-generation.yaml
  - tools/oracle/cases/helpers/auth-reconnect/lock-races.yaml
  - tools/oracle/cases/helpers/auth-reconnect/probes-and-failures.yaml
deviations:
  - what: Reconnect observes native pool generations and emits pool diagnostics instead of Prisma PID and zombie diagnostics.
    why: B713/B714 replace subprocess engines; native_failed_pool_recovery preserves stop-before-connect and failure visibility without fake processes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L6191-L6309
out_of_scope:
  - B124 retains other utils.py functions, watchdog scheduling and OS watcher/reaping functions; these are not native dependencies.
  - B713/B714 own replacement and routing primitives; B710 owns URL resolution; B738 owns auth-query retry decisions.
pitfalls:
  - 'The oracle helper for this task is pre-registered as auth_reconnect in the db group. Replace the stub Op in tools/oracle/src/helpers/db/auth_reconnect.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/auth_reconnect.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A false forced-recreate result can mean another generation already recovered, so it must not increment the failure count.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
