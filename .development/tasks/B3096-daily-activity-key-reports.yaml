dod:
  - text: The key page route answers DailyActivityKeyPageResponse on every prefix, with limit default 50 and maximum 100, offset default 0 and minimum 0, and offset and limit echoed from the request.
    proof: [routes-tests]
  - text: The model leaders route requires a non-empty model_group, defaults by_model_group to true and limit to 5 (maximum 100), and echoes model_group in the model field.
    proof: [routes-tests]
  - text: The cache leakage route exists on /user only, with limit default 20 and maximum 100; the same path under /team answers as an unknown route.
    proof: [routes-tests]
  - text: Out of range limit or offset values and malformed timezone or include_current_utc_day values answer 422 instead of being clamped.
    proof: [routes-tests]
  - text: A missing or non-canonical date, a reversed range and a range of more than 400 days answer 400 with detail.error before the scope resolver runs.
    proof: [routes-tests]
  - text: A scope denial from the entity resolver answers 403 or 404 with detail.error, and a non-admin asking for another user gets "Non-admin users can only view their own spend data.".
    proof: [routes-tests]
  - text: A missing database answers 500 with the db_not_connected_error text before any parameter validation error.
    proof: [routes-tests]
  - text: key_activity_rows reads metadata once for the set of all returned keys with the spend logs window of the scope dates, keeps row order, and gives a key without a metadata row a KeyMetadata of nulls.
    proof: [mapping-tests]
  - text: >-
      A repository error that is not an HTTP error answers 500 with the detail.error text starting "Failed to fetch analytics" and the error text, and logs the route's own line.
    proof: [failure-tests]
  - text: The response bodies serialize with LiteLLM's field names and order, with None metadata fields as null.
    proof: [wire-tests]
checks:
  optional: []
  commands:
    - id: routes-tests
      why: the routes, their parameter bounds, route set per prefix, date check order, scope denial or database check are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_routes::tests::route_/)'
    - id: mapping-tests
      why: key_metadata, key_activity_row or key_activity_rows map rows wrongly or read metadata with the wrong keys or window
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_routes::tests::mapping_/)'
    - id: failure-tests
      why: repository errors are not turned into the 500 body and log line LiteLLM uses
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_routes::tests::failure_/)'
    - id: wire-tests
      why: the response types serialize with other field names, order or null handling than LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_routes::tests::wire_/)'
oracle_cases: []
deviations:
  - what: >-
      A repository failure answers 500 with "Failed to fetch analytics" and a colon, followed by the Rust error's display text, not Python's exception text.
    why: The wording of an internal error cannot match Python's exception strings; the prefix, the status and the detail.error shape do.
  - what: The six resolver callables become a match on B3094's Entity enum, as B3094 already records, so a route function takes the entity and calls B3095's dispatch instead of a stored function.
    why: rules.yaml requires an enum matched exhaustively in place of a registry of callables.
out_of_scope:
  - "B3097 owns the aggregated route and the search route, plus _sum_metrics, _fold_key_metrics and _search_rows (L97-L116, L187-L200, L240-L310, L356-L402). They use resolved_scope and the response types from this task."
  - "B3098 owns the export route and _export_filename, _content_disposition, _csv_cell, _csv_row and _stream_export_rows (L165-L184, L203-L237, L455-L513)."
  - "B8482 composes the routes of B3096 to B3098 and owns register_daily_activity_routes with its loop over the six resolvers (L560-L579); this task only exposes the per-resolver route functions."
  - "B3094 and B3095 own the resolvers, query shapes and EntityQuery; B729 owns the repository methods and B3092 owns daily_activity_repository and spend_logs_window; B3090 owns SpendMetrics, KeyMetadata, ScopeDenied, InvalidDateRange and raise_public; B815 owns aggregated_date_range_error."
  - "LiteLLM_DailyUserSpend (types file L175-L195) has no caller at the pin outside the types file, so it is not built. GroupedData (L198-L201) is used only by common_daily_activity.py L617, so B3091 or B3093 owns it, not this task."
  - "get_daily_activity_prisma_client and get_daily_activity_repository (L63-L68) are built here only as the two lookups of the database handle and the repository for these handlers; B3097 and B3098 call the same two."
pitfalls:
  - The missing-database 500 comes from a dependency, so it beats the 422 for a bad limit or timezone; a test with no database and limit=0 must still answer 500.
  - The model leaders response field `model` is the model_group query value; the entity query's own `model` filter is a different parameter and is not echoed.
  - cache_leakage_keys exists only under /user; asking for /team/daily/activity/aggregated/cache_leakage_keys must not reach a handler, because the team resolver's operation_names has no such name.
  - /end_user is the same handler set as /customer but hidden from /openapi.json, and it must not be registered twice or answer differently from /customer.
  - These three routes pass user_aggregated=false, so even the user entity gets the 400-day cap and the "Please provide start_date and end_date" message; only B3097's aggregate route skips the cap.
  - limit and offset are validated, not clamped, so limit=101 is a 422, and limit=0 is a 422 on all three routes (minimum 1).
  - key_activity_rows must pass the window of the scope's start_date and end_date to the metadata read; the window is built from a set of those two strings, so equal dates give a set of one.
  - A key page row for a key with no metadata row still returns the row, with metadata all null, not an error and not a dropped key.
  - 'Query values that FastAPI treats as booleans for by_model_group are true, false, t, f, 1, 0, yes, no, y, n, on and off in any case; anything else is 422.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
