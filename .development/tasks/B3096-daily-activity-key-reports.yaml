id: B3096
title: Serve scoped key pages, model leaders and cache leakage reports
description: >-
  Build the module `daily_activity_routes` in betterlite-server. It serves three daily activity reports for
  every entity that has daily activity routes, and it holds the helpers that B3097 (aggregate and search) and
  B3098 (export) reuse, which is why they depend on this task. Each report returns a list of API keys with
  their spend counters and owner details. The scope of the caller (which users, teams, tags and so on they may
  see) is decided before any query runs, by B3094 and B3095.

  Routes. For each prefix of an entity's resolver (`route_prefixes`: /user, /team, /tag, /organization,
  /customer and /end_user, /agent) register GET `{prefix}/daily/activity/aggregated/keys` (key page) and GET
  `{prefix}/daily/activity/aggregated/model_top_keys`. Only the user prefix also gets GET
  `/user/daily/activity/aggregated/cache_leakage_keys`; a team, tag, organization, customer or agent prefix has
  no such route and answers like any unknown path. That makes 15 routes. /end_user is an alias of /customer
  that LiteLLM leaves out of /openapi.json; keep it out of the schema too. Each route is authenticated by B052
  and carries the resolver's tags and the operation name from `operation_names` (key_page, model_top_keys,
  cache_leakage_keys; B3094's `OperationNames`). Each handler runs inside B865's management completion wrapper,
  like `@management_endpoint_wrapper`. The route functions are named after those operation names. Expose one
  public function that returns the axum routes for a resolver; B8482 composes and mounts them, and this task adds no
  registration loop over all entities and mounts nothing.

  Query parameters. The entity's own parameters (user: start_date, end_date, model, api_key, user_id, timezone,
  include_current_utc_day; team: team_ids, exclude_team_ids, and so on; the other four come from B3095) are
  parsed by B3094 and B3095 types, and this task turns the query string into them. Malformed values (an integer
  `timezone` that is not an integer, a boolean that is not a boolean) answer 422 in the same envelope B003 uses
  for other query validation errors. Added by this task, with LiteLLM's constants from litellm/constants.py
  L2166-L2175:
  key page `offset` (integer, at least 0, default 0) and `limit` (1 to 100, default 50, USAGE_KEY_PAGE_MAX);
  model leaders `model_group` (required string, at least 1 character), `by_model_group` (boolean, default true)
  and `limit` (1 to 100, default 5, USAGE_MODEL_TOP_KEYS_MAX); cache leakage `limit` (1 to 100, default 20,
  USAGE_CACHE_LEAKAGE_KEYS_MAX). These are fixed constants, not environment settings. Values out of range answer
  422, never a clamped value.

  Order inside every handler. First the dependencies run in this order: the entity query, the caller (B052), the
  daily activity repository, the database handle. A missing database stops there with HTTP 500 and detail
  `{"error": <CommonProxyErrors.db_not_connected_error text>}` (litellm/proxy/_types.py L4391-L4395), before
  any 422 for the handler's own parameters is reported. Then `resolved_scope` runs: it checks the date range, then
  calls the entity's resolve step, and turns a failure into an HTTP error through B3090's `raise_public` (400 for a
  bad range, 403 or 404 for a denied scope; detail is `{"error": <reason>}`). The date check on these routes is
  B815's `aggregated_date_range_error` (missing dates, non-canonical dates, reversed range, more than 400 days),
  wrapped as B3090's `InvalidDateRange`. `resolved_scope` takes the `user_aggregated` flag that LiteLLM has: when true it checks only the canonical date parser with no 400-day cap. Every handler here passes false. B3097 passes true for the user entity on its aggregate route, so build the flag.

  Helpers built here, with LiteLLM's names in snake case: `date_range_error`, `resolved_scope`, `key_metadata`
  (a key's row from the metadata map, or `KeyMetadata` with every field None when the key has no row),
  `key_activity_row` (a `KeySpendRow` plus metadata becomes a `KeySpendActivityRow`; the nine
  `KeySpendMetrics` fields are copied one to one) and `key_activity_rows` (asks B729's repository for
  `key_metadata` of the set of all returned api keys, with the window from B3092's `spend_logs_window` over the
  scope's start and end date, then maps every row in order). The repository is built with B3092's
  `daily_activity_repository` factory from the database handle. `key_activity_rows` runs the metadata read even
  for an empty row list; B729's `key_metadata` returns early for an empty set, so no query happens.

  Handlers. Key page: resolve the scope, call the repository's `key_page(scope, offset, limit)`, answer
  `DailyActivityKeyPageResponse { api_keys, total_api_keys, offset, limit }`, where offset and limit echo the
  request and total_api_keys comes from the page. Model leaders: resolve, call `model_top_keys(scope,
  model_group, by_model_group, limit)`, answer `ModelTopKeysResponse { model, by_model_group, api_keys }`; the
  `model` field repeats the `model_group` parameter, not the entity query's `model` filter. Cache leakage:
  resolve, call `cache_leakage_keys(scope, limit)`, answer `CacheLeakageKeysResponse { api_keys }`. Any error
  from the repository or the metadata read that is not already an HTTP error answers 500 with detail
  `{"error": "Failed to fetch analytics: <error text>"}` and logs at error level one line per route:
  "Daily activity key page failed: %s", "Daily activity model top keys failed: %s" and "Daily activity cache
  leakage keys failed: %s". An HTTP error from the scope step passes through unchanged.

  Response types, in this task's files. Fields keep LiteLLM's names and order (types/proxy/management_endpoints/
  common_daily_activity.py L127-L172): `KeyActivityRow { api_key, metrics: SpendMetrics, metadata: KeyMetadata }`,
  `KeySpendMetrics { spend: f64 = 0.0, prompt_tokens, completion_tokens, total_tokens, api_requests,
  successful_requests, failed_requests, cache_read_input_tokens, cache_creation_input_tokens }` (all integers
  default 0), `KeySpendActivityRow { api_key, metrics: KeySpendMetrics, metadata: KeyMetadata }`,
  `DailyActivityKeySearchResponse { api_keys: Vec<KeyActivityRow> }`, `DailyActivityKeyPageResponse`,
  `ModelTopKeysResponse` and `CacheLeakageKeysResponse`. `SpendMetrics` and `KeyMetadata` come from B3090. A None
  metadata field is serialized as `null`, never left out. B3097 imports `KeyActivityRow` and
  `DailyActivityKeySearchResponse` from here.

  This task has unit tests only. Its routes answer over HTTP once B8482 mounts them, so B8482 owns their HTTP oracle cases (tools/oracle/cases/management/daily-activity-keys/) and proves the defaults, bounds, date errors, access errors and missing database over HTTP. Here native tests call the per-resolver routes on a test router with fake dependencies for the parameter bounds, the route set per prefix, the date check order, scope denials and the missing database, and cover row mapping and error paths.
scope:
  paths:
    - crates/betterlite-server/src/daily_activity_routes.rs
    - crates/betterlite-server/src/daily_activity_routes/**
    - tools/oracle/helpers/b3096.py
    - tools/oracle/helpers/b3096/**
    - tools/oracle/src/helpers/server/b3096.rs
    - tools/oracle/src/helpers/server/b3096/**
  lint_tables: false
