id: B595
title: Bedrock SigV4 and bearer request signing
description: >-
  Add AwsSignedRequest using a maintained SigV4 library, not handwritten cryptography. Preserve exact serialized
  bytes, service/region, signing-header filtering, computed header replacement, session token and the source explicit
  non-AWS Authorization override. Bearer-compatible operations skip credential discovery; operations that cannot
  use bearer explicitly request SigV4. Keep all signing inputs request-local and derive destinations only from settings.
  Async credential work stays off blocking paths.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/base_aws_llm.py:
  BaseAWSLLM._get_boto_credentials_from_optional_params L1520-L1525; BaseAWSLLM._get_boto_credentials_from_optional_params
  L1528-L1534; BaseAWSLLM._get_boto_credentials_from_optional_params L1536-L1568; BaseAWSLLM.get_request_headers
  L1571-L1627; BaseAWSLLM._filter_headers_for_aws_signature L1629-L1655; BaseAWSLLM._sign_request L1657-L1730; sign_aws_json_post
  L1733-L1749; run_aws_signing L1758-L1767; sign_request_off_loop_if_aws L1770-L1779. litellm/llms/bedrock/common_utils.py:
  CommonBatchFilesUtils.sign_aws_request L1906-L1963.


  Named case contracts: signed_header_allowlist: Case-insensitive signing filter keeps non-None host,content-type,date,x-amz-date,x-amz-security-token,x-amz-content-sha256,x-amz-algorithm,x-amz-credential,x-amz-signedheaders,x-amz-signature
  and every x-amz-/x-amzn- prefix, retaining original spelling; drop unrelated headers only from signature calculation.
  computed_header_replacement: After SigV4 signing reattach all non-None original headers except case-insensitive
  authorization,x-amz-date,x-amz-security-token,date. Forwarded headers survive unsigned; computed signature/session
  token must not be overwritten by stale incoming values. Use fixed time/credentials and actual serialized bytes
  for botocore/Rust comparison. bearer_skips_sts: get_request_headers uses B590 api_key/env bearer only when supports_bearer_token=true;
  bearer sets canonical Authorization=Bearer <token>, POST with unchanged supplied body and no SigV4 or extra_headers
  override. _sign_request bearer branch also sets canonical Content-Type=application/json even if a differently
  cased key exists, returns json.dumps bytes and skips auth validation/region lookup/pops entirely. explicit_non_aws_auth_override:
  get_request_headers override only exact extra_headers.Authorization, when not starting AWS4-HMAC-SHA256; lowercase
  key ignored. _sign_request instead takes the first non-None Authorization case-insensitively from its headers,
  overriding SigV4 unless it starts AWS4-HMAC-SHA256. Empty string overrides; prefix check is case-sensitive. Keep
  these distinct call paths in sibling cases. empty_credentials_error: SigV4 get_request_headers with credentialsNone
  raises NoCredentialsError; preserve dependency error message Unable to locate credentials without inventing HTTP
  status/type/param here. Python missing boto3 is oracle-environment failure Missing boto3 to call bedrock. Run
  'pip install boto3'. (generic helper substitutes service_name), not a runtime Rust package-install requirement.
  body_bytes_match_signature: get_request_headers signs servicebedrock with supplied str/bytes unchanged. _sign_request
  supports bedrock,sagemaker,bedrock-agentcore,s3vectors,aws-external-anthropic, POST api_base, json.dumps default
  spacing/Unicode escapes, preserving body-byte equivalence. It adds Content-Type=application/json only if no case-insensitive
  content-type key exists, so an existing key with None suppresses insertion. stream/fake_stream unused. sign_aws_json_post
  signs supplied serialized body and all supplied headers directly, no allowlist or bearer override. auth_inputs_pop_even_bearer:
  Resolve region B591 then pop aws_region_name, pop/validate B590 auth keys, then pop aws_bedrock_runtime_endpoint.
  A non-None bearer_token including empty returns target with credentialsNone and skips B594 acquisition, but not
  region/auth validation or pops. A malformed auth field still fails even on this bearer target branch. signing_off_loop:
  run_aws_signing preserves context and all arguments/results/errors through the dedicated16-worker aws-signing
  executor. sign_request_off_loop_if_aws offloads only SignsRequestsWithAWS configs; other callbacks run inline
  and once. Rust equivalent uses bounded blocking work and preserves request tracing/identity; cancellation must
  not expose another request credentials. batch_service_signing: CommonBatchFilesUtils.sign_aws_request gets B591
  region with model empty string, validates optional_params as AwsAuthParams, then resolves B594 credentials. Uppercase
  method default POST. GET always uses empty-string data and no initial headers, ignoring supplied data; every other
  method JSON-dumps dict data or retains other data and starts Content-Type=application/json. Sign through standard
  SigV4Auth (not S3SigV4Auth) using supplied service_name, region and endpoint, then return prepared headers and
  original selected request_data encoded UTF-8 only when it was a string. No bearer shortcut, S3-specific credentials,
  KMS header or non-LLM signing-region rewrite is applied. Python missing-import message is Missing boto3 to call
  bedrock. Run 'pip install boto3'.; reuse the compiled Rust signing library.


  Implement crates/betterlite-bedrock/src/signing.rs with adjacent tests under signing/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function signing_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  fixed_clock_sigv4, session_token_signature, signed_header_allowlist, computed_header_replacement, bearer_skips_sts,
  explicit_non_aws_auth_override, empty_credentials_error, body_bytes_match_signature, auth_inputs_pop_even_bearer,
  signing_off_loop, batch_service_signing. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_signing* using HelperCase: kind: helper
  and the externally tagged bedrock_signing variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_signing that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_signing_credential_identity_isolation in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone bedrock_signing_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant; it
  is not a Python oracle case.


  Budget from 261 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 310 production lines, 315 behavior/config-test lines,
  130 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 780 planned, 800 maximum changed lines.
