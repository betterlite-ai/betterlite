id: B595
title: Bedrock SigV4 and bearer request signing
description: >-
  Add AwsSignedRequest using a maintained SigV4 library, not handwritten cryptography. Preserve exact serialized
  bytes, service/region, signing-header filtering, computed header replacement, session token and the source explicit
  non-AWS Authorization override. Bearer-compatible operations skip credential discovery; operations that cannot
  use bearer explicitly request SigV4. Keep all signing inputs request-local and derive destinations only from settings.
  Async credential work stays off blocking paths.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/base_aws_llm.py:
  BaseAWSLLM._get_boto_credentials_from_optional_params L1520-L1525; BaseAWSLLM._get_boto_credentials_from_optional_params
  L1528-L1534; BaseAWSLLM._get_boto_credentials_from_optional_params L1536-L1568; BaseAWSLLM.get_request_headers
  L1571-L1627; BaseAWSLLM._filter_headers_for_aws_signature L1629-L1655; BaseAWSLLM._sign_request L1657-L1730; sign_aws_json_post
  L1733-L1749; run_aws_signing L1758-L1767; sign_request_off_loop_if_aws L1770-L1779.


  Implement crates/betterlite-bedrock/src/signing.rs with adjacent tests under signing/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation bedrock_signing in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function signing_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  fixed_clock_sigv4, session_token_signature, signed_header_allowlist, computed_header_replacement, bearer_skips_sts,
  explicit_non_aws_auth_override, empty_credentials_error, body_bytes_match_signature. Each case exercises its named
  outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy
  and assert both client response and captured upstream request. Existing API tasks retain route registration; this
  task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_signing* using HelperCase: kind: helper
  and the externally tagged bedrock_signing variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_bedrock_signing that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_signing_credential_identity_isolation in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Write standalone bedrock_signing_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant; it
  is not a Python oracle case.


  Budget from 214 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 240 production lines, 147 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 499 planned, 500 maximum changed lines.
