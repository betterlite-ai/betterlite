deviations:
  - what: >-
      When a facet name is not one of `providers`, `modes` or `features`, the 400 response lists
      the accepted names in a problem document body, whereas the source does a 422 HTTPException.
    why: The list framework's problem-document boundary is the sole failure surface for v1 public
      routes, and 400 is the standard for invalid operation parameters across betterlite.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_v1/model_hub.py#L282-L284

out_of_scope:
  - B060 owns `_get_model_group_info` (litellm/proxy/proxy_server.py:16320-16351), which
    supplies model-group records by calling llm_router.get_model_group_info without checking
    for a None router; B3193 calls it to populate the published groups.
  - B130 or a health-read leaf owns `PrismaClient.get_all_latest_health_checks` and
    `PrismaClient.get_latest_health_checks_for_models` (litellm/proxy/utils.py:6984-6990),
    which fetch the stored latest checks; B3193 uses them for health enrichment.
  - B130 or a health-read leaf owns `_convert_health_check_to_dict` (litellm/proxy/health_endpoints/_health_endpoints.py:615-630),
    which serializes a check to a dict; the legacy route uses it before returning.
  - B052 owns `user_api_key_auth` (litellm/proxy/auth/user_api_key_auth.py:3433-3529),
    a FastAPI Depends callback; B3193's v1 routes use it to authenticate without requiring a
    master key.

pitfalls:
  - The oracle helper for this task is pre-registered as b3193 in the server group. Replace
    the stub Op in tools/oracle/src/helpers/server/b3193.rs with an impl Helper whose Input
    is ModelHubRequest, and write run in tools/oracle/helpers/b3193.py. The registry files
    (helpers/mod.rs, the group files, dispatch.py) are not this task's to edit.
  - Health enrichment returns a read-only proxy, not a mutable copy, so concurrent requests
    never see each other's added fields; use row.model_copy(update=...) or equivalent.
  - The list framework invokes callbacks like _cells and _serialize on every row it touches,
    including during facet operations, so they must be fast and handle every published record.
  - Facet names are matched as case-sensitive exact strings; modes are the `mode` field,
    providers come from the `providers` array and features are the sorted `supports_*` flags.

