dod:
  - text: Legacy and v1 list routes return the exact published groups as the source, with
      default sort, paging and population from `litellm.public_model_groups`.
    proof: [model-hub-tests, oracle]
  - text: Health enrichment fetches and attaches the latest check per model when the database
      is available; legacy failures are silent and v1 failures are problem documents; facets
      never fetch health.
    proof: [model-hub-tests, oracle, model-hub-corpus]
  - text: List and facet handlers reject unsupported facets, filter operators and sort fields
      with 400 problem documents listing the accepted set, exactly as the source does.
    proof: [model-hub-tests, oracle]
  - text: Authentication dependency is resolved and public routes are registered at the correct
      prefix under the composition module B077.
    proof: [oracle]

