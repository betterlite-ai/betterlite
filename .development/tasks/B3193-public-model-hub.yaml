id: B3193
title: Legacy and paginated public model hub queries
description: >-
  Build GET `/public/model_hub`, `/public/v1/model_hub` and `/public/v1/model_hub/{facet}` in
  `betterlite-server::public_endpoints::model_hub`. The legacy route fetches published model
  groups and their latest health snapshots, swallowing health lookup failures so the models
  still return. The v1 list and facet routes page, sort and filter the same groups through
  the shared list framework, enriching each page's rows with health only when the database
  is available, translating other failures to problem documents. Accept only three facet names
  (`providers`, `modes`, `features`) and reject others with a 400 problem. Preserve default
  page size 50, maximum 100, model-group ascending order with model-group tiebreaker, repeated
  capability filters with OR semantics, and unconditional public scope. Reuse the list framework's
  existing `handle_list` and `handle_facet` from B1702, construct typed list specs and exception
  records through B1701 and B1665, and call `user_api_key_auth` for v1 route authentication,
  though the missing entry point is a prerequisite. Load `litellm_settings.public_model_groups`
  (default `None`) through B002. Install the three routes in B003's server and use its error
  integration to map failures to problem documents where needed. Invoke B860's Postgres
  fixture for health rows and lookup failures in tests. Every call to an unresolved callee
  (`_get_model_group_info`, Prisma health methods, `_convert_health_check_to_dict`,
  `user_api_key_auth` entry) must wait for that task to exist.

