  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2941-L3095
    why: Server update decorator and field handling.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L3185-L3450
    why: Discovery, OpenAPI registry and all toolset decorators, with no additional aliases.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/discovery_endpoints/ui_discovery_endpoints.py#L16-L46
    why: B3211/B8670's public discovery aliases include the stdio flag read by the form.
dod:
  - text: Server create, edit, import and delete use the complete page payloads and preserve visible fields without leaking stored credentials.
    proof: [catalog-transcripts, oracle]
  - text: Health, discovery, stdio discovery, approval and toolset workflows match the page's query/body/envelope contracts under the appropriate caller.
    proof: [catalog-transcripts, oracle]
checks:
  optional: []
  commands:
    - id: catalog-transcripts
      why: The source intake alone does not exercise any MCP form against a running proxy.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/mcp-catalog)"
oracle_cases:
  - tools/oracle/cases/ui/mcp-catalog/create-edit-clear-delete.yaml
  - tools/oracle/cases/ui/mcp-catalog/import-config-results.yaml
  - tools/oracle/cases/ui/mcp-catalog/health-and-discovery.yaml
  - tools/oracle/cases/ui/mcp-catalog/submit-approve-reject.yaml
  - tools/oracle/cases/ui/mcp-catalog/toolset-edit-delete.yaml
  - tools/oracle/cases/ui/mcp-catalog/stdio-ui-discovery.yaml
  - tools/oracle/cases/ui/management-selectors/mcp-servers-and-group-labels.yaml
  - tools/oracle/cases/ui/management-selectors/mcp-toolsets-and-tools.yaml
deviations: []
out_of_scope:
  - B9090 retains all functions and tests in the covered dashboard files; no TypeScript port or patch is required by this plan.
  - B4720, B4721, B4722 and B4725 retain every backend function referenced above; B9761 covers credentials and sessions, B9762 tools and settings.
  - Shared catalogs are B9735; browser boot and authenticated static navigation are B144.
pitfalls:
  - Sending an empty object to approve differs from the page's bodyless PUT.
  - MCP imports report individual skipped and failed records even when the outer request succeeds.
  - Clearing an edit field with null is not equivalent to omitting it.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
