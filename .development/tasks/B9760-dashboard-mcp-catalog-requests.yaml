id: B9760
title: Exercise MCP server forms, submissions and toolsets over HTTP
description: >-
  Add the missing booted-proxy HTTP transcripts for the retained MCP administration pages.
  B9090 imports every component, payload builder and existing test in these covers unchanged;
  this task writes cases only, about 650 lines, and reimplements zero LiteLLM functions.
  Default requests use Authorization Bearer with the dashboard session key; a configured
  auth_header_name replaces that header. JSON writes use application/json, GETs and deletes
  have no body. Capture generated identifiers independently on each oracle side and create
  records through the real management endpoints with B860's isolated PostgreSQL fixture.

  Catalog audit. MCPServers and MCPServerSelector GET /v1/mcp/server, optionally team_id,
  reading the raw array's server_id,server_name,alias,url,transport,auth_type,mcp_info,
  mcp_access_groups,allowed_tools and credential/redaction metadata. GET /v1/mcp/access_groups
  reads access_groups[]. These exact requests are already planned by B9735; include its
  mcp-servers-and-group-labels case, do not write another selector case. B4720 implements
  these reads and B8625 mounts them. The health hook additionally GETs
  /v1/mcp/server/health?include_reachability=true, initially without server_ids and then with
  repeated server_ids for refresh; it reads server_id,status per result. MCP discovery GETs
  /v1/mcp/discover without filters, reading categories[] and servers[] with
  name,title,description,category,url,transport and authentication metadata. GET
  /v1/mcp/openapi-registry reads apis[].name,title,description,icon_url,spec_url,
  oauth.authorization_url/token_url/pkce/docs_url and key_tools[].name/description to
  fill the create form. Those two and health are also B4720/B8625.

  CreateMCPServer POST /v1/mcp/server and EditMCPServer PUT /v1/mcp/server use
  createServerPayload and editServerPayload, not hand-normalized partial samples. Include
  server_name,url,transport,auth_type,alias,mcp_access_groups,mcp_info with server_name,
  description,optional logo_url,mcp_server_cost_info and tool_allowlist_enforced; include
  allowed_tools,display-name/description maps,allow_all_keys,available_on_public_internet,
  delegate_auth_to_upstream,oauth_passthrough,dcr_bridge,static_headers,env_vars and the
  selected authentication fields. Default allow_all_keys is false and public internet is
  true; openapi form transport becomes http. Create sends empty maps/arrays where the
  builder does; edit adds server_id,extra_headers,disallowed_tools and sends cleared maps
  as null. Its untouched allowlist is omitted. Preserve client-forwarded credential omission
  and clearing stored app credentials with {client_id:null,client_secret:null}. Create reads
  response.server_id before saving user credentials; update/delete success triggers refetch.
  DELETE /v1/mcp/server/{server_id} has no body. B4721 implements all three, B8627 mounts them.
  Import POST /v1/mcp/server/import accepts the UI's parsed {mcpServers:{name:config}} and
  {mcp_servers:[...]}; read imported[].name/server_id/alias,skipped[].name/reason and
  errors[].name/error. This is the same B4721/B8627 ownership, including partial import.

  Review audit. Non-admin submission POST /v1/mcp/server/register uses the same server form;
  GET /v1/mcp/server/submissions returns items with approval_status and review metadata
  plus total,pending_review,active,rejected counts. PUT /v1/mcp/server/{id}/approve
  sends no body; PUT /v1/mcp/server/{id}/reject
  sends {review_notes:string|null}. These are B4722 handlers mounted by B8625. Compare both
  submitting user and reviewing admin, and a denied review, without enterprise modules.
  Submission-rules config requests are covered with the other settings in B9762.

  Toolsets audit. GET /v1/mcp/toolset returns a bare array of toolset_id,toolset_name,
  description and tools[{server_id,tool_name}]; reuse B9735's toolset/tool selector case.
  POST /v1/mcp/toolset sends {toolset_name,description?,tools:[{server_id,tool_name}]}; PUT
  on the same path adds toolset_id; DELETE /v1/mcp/toolset/{id} has no body. The tab consumes
  mutations only by refetching. All four belong to B4725/B8701. Prove that an edited
  selection survives a list and is removed by deletion, and that team visibility is retained.
  StdioAvailability's direct public GET /.well-known/litellm-ui-config has no auth or body
  and reads mcp_stdio_enabled. B3211 implements it and B8670 mounts it; test
  LITELLM_ENABLE_MCP_STDIO=false by default and true explicitly, not an invented config key.
  The same owner serves /litellm/.well-known/litellm-ui-config for root-mounted discovery;
  StdioAvailability calls only the first spelling.

  No on-disk HTTP case currently sends these management requests. B8625/B8627/B8701 have
  planned generic route cases, but not the create/edit builder's null/omission choices,
  import-result projection or review/toolset sequence. The shared B9735 cases are planned,
  not existing evidence. Use B136's /__mcp_fixture/ protocol and $mcp_request_id substitution
  for local MCP health targets; compare status, response
  envelopes, content-type, auth error type/param/code and secret redaction. Limit comparison
  exclusions to generated IDs, timestamps and human error text at their actual pointers.
