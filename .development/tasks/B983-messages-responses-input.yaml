id: B983
title: Messages responses input
description: >-
  Translate Anthropic messages, documents, images, tool results and grouped thinking into Responses input. Reuse
  B183 media and the existing Responses shapes; preserve encrypted thinking and assistant-group boundaries without
  fetching request URLs.


  Implement crates/betterlite-core/src/api/messages_responses_input.rs. Use MessagesResponsesInputInput and MessagesResponsesInputResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions document_file_data, image_url_pass_through, tool_result_output, thinking_summary_group,
  midturn_system_responses under api::messages_responses_input::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesResponsesInput in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_responses_input: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_responses_api_usage_to_anthropic_usage
  (L63-L78); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._translate_anthropic_image_source_to_url
  (L85-L96); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._translate_anthropic_document_block_to_file_part
  (L99-L128); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._tool_result_output_value
  (L131-L139); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._translate_midturn_system_content_to_responses
  (L142-L154); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._summary_part_text
  (L157-L161); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._thinking_block_from_reasoning_item
  (L164-L186); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._assistant_block_group_key
  (L189-L192); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter._assistant_group_to_input_items
  (L195-L212); litellm/llms/anthropic/pass_through/responses_adapters/transformation.py: LiteLLMAnthropicToResponsesAPIAdapter.translate_messages_to_responses_input
  (L214-L384). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 273 owned nonblank/non-comment/non-docstring Python lines (299 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 293 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 543 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B183 (Bounded inline media conversion),
  B902 (Responses shapes), B958 (Messages errors), B1087 (Api boundaries), B906 (Responses usage), B966 (Messages
  chat output). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids
  retain ownership on the provider and keys/data branches.
