checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_input::/)
      - test(/::replays_corpus$/)'
  - id: case-document-file-data
    why: the document-file-data behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_input::tests::document_file_data($|::)/)'
  - id: case-image-url-pass-through
    why: the image-url-pass-through behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_input::tests::image_url_pass_through($|::)/)'
  - id: case-tool-result-output
    why: the tool-result-output behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_input::tests::tool_result_output($|::)/)'
  - id: case-thinking-summary-group
    why: the thinking-summary-group behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_input::tests::thinking_summary_group($|::)/)'
  - id: case-midturn-system-responses
    why: the midturn-system-responses behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_responses_input::tests::midturn_system_responses($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_responses_input.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_responses_input-*)"
      && grep -qE "^[[:space:]]+messages_responses_input:" tools/oracle/fuzz/corpus/helper_case/messages_responses_input-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-responses-input)"
