    why: LiteLLM_ModelTable (aliases column) and LiteLLM_TeamTable (team_alias, models, model_id and the litellm_model_table relation).
dod:
  - text: CliSsoTeamDetail decodes only with team_models present, reads a missing team_id, team_alias or team_model_aliases as None, ignores unknown keys, and serializes all four keys with null for None.
    proof: [records-tests]
  - text: cli_sso_team_detail copies team_id, team_alias and models, parses alias text into a map, reads other text and a missing alias table as no aliases, and refuses a stored alias map with a value that is not text.
    proof: [records-tests, oracle, helper-python]
  - text: selected_cli_sso_team_detail gives the teamless detail for no team_id, the first detail with a matching team_id, and None when none matches.
    proof: [selection-tests]
  - text: selected_cached_cli_sso_team_detail gives the teamless detail for no team_id whatever the cached value holds, and None for a missing value, null, a value that is not an array or an entry without team_models.
    proof: [selection-tests, oracle, helper-python]
  - text: fetch_cli_sso_team_details gives an empty list for no teams without opening a session, the rows of the named teams with their alias tables, leaves out a team id with no row, and gives None for a failed query or a row whose alias column fails.
    proof: [lookup-tests]
  - text: The b10114 adapters lint and type-check, and new cli-team-grants seeds replay through the shared helper case parser.
    proof: [helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: records-tests
      why: The team detail decodes without team_models, drops a key when serialized, or the row projection reads aliases differently from LiteLLM.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cli_team_grants::records::/)'
    - id: selection-tests
      why: An unknown grant is selected as a real one, or a teamless login reads the cached value first.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cli_team_grants::selection::/)'
    - id: lookup-tests
      why: The lookup queries for no teams, keeps a deleted team, misses the alias table, or answers a failed lookup with a list.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cli_team_grants::lookup::/)'
    - id: helper-python
      why: The b10114 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10114.py tools/oracle/helpers/b10114)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10114 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/cli-team-grants-*")" &&
        grep -lE '^[[:space:]]+b10114:' tools/oracle/fuzz/corpus/helper_case/cli-team-grants-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-server --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/cli-team-grants/select-teamless-ignores-cache.yaml
  - tools/oracle/cases/helpers/cli-team-grants/select-first-match.yaml
  - tools/oracle/cases/helpers/cli-team-grants/select-no-match.yaml
  - tools/oracle/cases/helpers/cli-team-grants/select-missing-team-models.yaml
  - tools/oracle/cases/helpers/cli-team-grants/select-not-a-list.yaml
  - tools/oracle/cases/helpers/cli-team-grants/select-unknown-keys.yaml
  - tools/oracle/cases/helpers/cli-team-grants/project-alias-text.yaml
  - tools/oracle/cases/helpers/cli-team-grants/project-bad-alias-text.yaml
  - tools/oracle/cases/helpers/cli-team-grants/project-no-alias-table.yaml
deviations:
  - what: A team row whose stored alias column is a map with a value that is not text, or is neither text nor a map, makes fetch_cli_sso_team_details give None with the lookup's error log, where LiteLLM lets pydantic's ValidationError escape the function.
    why: Both callers already refuse on None. B1614's CLI callback answers the same 500 its error mapping gives an escaped exception, and B4658's consent and mint answer unavailable (503 temporarily_unavailable) instead of an uncaught 500. LiteLLM's writers store the column as json.dumps text of a text-to-text map, so only a row written outside LiteLLM gets here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/ui_sso.py#L2259-L2274
out_of_scope:
  - "_TeamDetailRow and _team_detail_db (ui_sso.py L206-L211): Prisma typing seams with no native counterpart; the lookup runs its own select."
  - "_cli_sso_session_teams, cli_poll_key, the CLI callback and storing the details in the login flow: B1614 owns them and calls this module."
  - "lookup_consent_teams, mint_proxy_credential and the SubjectStore port that wraps the lookup: B4658."
  - "_validate_login in anthropic_endpoints/gateway_endpoints.py also calls selected_cli_sso_team_detail; it belongs to the Claude gateway OAuth task B989."
  - "The other functions of ui_sso.py: B063's ownership inventory assigns them."
pitfalls:
  - "With no team_id, LiteLLM returns the teamless detail before it validates the cached value, so a corrupt cache must not turn a teamless poll into unknown grants."
  - "Only a missing team_id selects the teamless detail; an empty string goes through the lookup like any other id."
  - "A missing team_models is unknown authority, not an empty grant, so a serde default on that field would mint an unrestricted credential."
  - "An empty teams slice is a known answer of no teams and must not query, while None means the lookup itself failed; the callers refuse the second and accept the first."
  - "The alias column is aliases in the table and model_aliases in Prisma and in the Python row, so the SQL selects m.aliases."
  - "The team id comes from the row, not from the requested list, so a requested id with no row never shows up as a detail."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
