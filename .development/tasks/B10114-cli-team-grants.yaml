id: B10114
title: CLI team grant records, lookup and selection
description: >-
  A `lite login` credential carries the models and model aliases of the team it was minted for, and two flows mint one: B1614's CLI SSO login (its callback stores the user's team snapshots in the login flow, its poll picks one) and B4658's MCP consent and credential mint. Both read team snapshots the same way, through CliSsoTeamDetail, fetch_cli_sso_team_details and selected_cli_sso_team_detail in ui_sso.py (L217-L234, L2248-L2274 and L2287-L2296). B1614 owned them next to its poll route, so B4658 waited on the whole CLI login for about 50 lines. This task builds them on their own; B1614 and B4658 call them.


  Layout. Module cli_team_grants in betterlite-server, crates/betterlite-server/src/cli_team_grants.rs, an empty stub the crate's lib.rs already declares, with the submodules records, selection and lookup, each with a tests.rs beside it. It sits outside B1614's cli_poll_grants on purpose, so the two tasks never share a file. SQL is plain tokio-postgres through B700's PostgresStore with `$n` parameters only.


  records. `CliSsoTeamDetail { team_id: Option<String>, team_alias: Option<String>, team_models: Vec<String>, team_model_aliases: Option<BTreeMap<String, String>> }` with public fields, deriving Clone, Debug, PartialEq, Serialize and Deserialize. team_models is required when deserializing, with no serde default, while a missing team_id, team_alias or team_model_aliases reads as None and unknown keys are ignored, as pydantic's model does. Serialize writes all four keys with null for None, like model_dump; B1614 stores that list in the login flow and echoes it on poll. `TEAMLESS_CLI_SSO_TEAM_DETAIL` is a const with no team_id, no alias, empty team_models and no aliases: the grant of a login with no team, and it restricts nothing. `TeamGrantRow { team_id: String, team_alias: Option<String>, models: Vec<String>, model_aliases: Option<ModelAliases> }` is LiteLLM's _TeamRowGrants with the alias table's one column pulled up, where ModelAliases is B859's betterlite_db::team_rows::aliases::ModelAliases. `cli_sso_team_detail(row: TeamGrantRow) -> Result<CliSsoTeamDetail, TeamColumnsError>` is _cli_sso_team_detail: team_id becomes Some(team_id), team_alias stays, models becomes team_models, and model_aliases goes through B871's betterlite_auth::identity_grants::team_grants::decode_model_aliases, so alias text holding a JSON object of text values parses into the map, other text reads as None, a stored map of text values is kept and a stored map with any other value is B871's TeamColumnsError::AliasNotText (pydantic's ValidationError). No alias table gives None.


  selection. `selected_cli_sso_team_detail(details: &[CliSsoTeamDetail], team_id: Option<&str>) -> Option<CliSsoTeamDetail>` gives TEAMLESS_CLI_SSO_TEAM_DETAIL for no team_id and otherwise a clone of the first detail whose team_id equals it, or None. B4658 calls this one with the details it fetched. `selected_cached_cli_sso_team_detail(cached: Option<&serde_json::Value>, team_id: Option<&str>) -> Option<CliSsoTeamDetail>` is LiteLLM's selected_cli_sso_team_detail over the team_details value a login flow holds. B1614's poll passes that value as it found it. With no team_id it gives the teamless detail before it looks at the value. Otherwise the value must decode with serde_json::from_value as a JSON array of CliSsoTeamDetail (_CLI_SSO_TEAM_DETAILS_ADAPTER), and a missing value, null, anything but an array, or one entry that fails (team_models missing, a number where text belongs) gives None. A decoded list goes to selected_cli_sso_team_detail. None means the team's grants are unknown, and both callers refuse rather than mint a credential without the team's restrictions.


  lookup. `fetch_cli_sso_team_details(store: &PostgresStore, teams: &[String]) -> Option<Vec<CliSsoTeamDetail>>`. An empty teams slice gives Some(empty) without opening a session, since a user with no teams is a known answer. Otherwise run one select, `SELECT t.team_id, t.team_alias, t.models, m.aliases FROM "LiteLLM_TeamTable" t LEFT JOIN "LiteLLM_ModelTable" m ON m.id = t.model_id WHERE t.team_id = ANY($1)`, with teams bound as a TEXT[] and no ORDER BY, like Prisma's find_many without an order. B724's team repository reads one team by id or an organization's teams and never joins the alias table, so this select is the lookup's own. Read the jsonb aliases column as a serde_json::Value and convert it with serde_json::from_value into ModelAliases, where SQL NULL and a JSON null both give None. Each row becomes a TeamGrantRow and goes through cli_sso_team_detail. A team id with no row is left out, and that is how a membership in a deleted team disappears. A failed session, query or row read logs at error "Error fetching team details for CLI SSO session: {error}" and gives None. That is the unknown answer, and callers keep it apart from an empty list. A row whose aliases column can't be read as text or a map of text values gives None with the same log line (see deviations).


  Tests. records and selection tests are pure. lookup tests run on real Postgres through betterlite-postgres-fixture's PostgresFixture with the baseline catalogs applied, as crates/betterlite-server/src/agent_rows/tests/support.rs does, inserting LiteLLM_ModelTable and LiteLLM_TeamTable rows per case: teams with and without an alias table, alias text, an unknown team id skipped, an empty teams slice that never opens a session (a store whose database is gone still answers Some), a failed query (a database without the team table) giving None, and an alias map with a number value giving None. Compare fetched lists without assuming row order.


  Helper. No route reaches this code yet, so the helper operation b10114 compares the two pure functions with LiteLLM and B1614 and B4658 add the HTTP cases through their routes. The Python side calls ui_sso's selected_cli_sso_team_detail with the case's team_details and team_id, and _cli_sso_team_detail with the case's team row (team_id, team_alias, models and litellm_model_table with model_aliases), and returns model_dump() or None. The Rust side calls selected_cached_cli_sso_team_detail and cli_sso_team_detail, building the TeamGrantRow from the same row. Rows in cases hold alias text, a map of text values or no alias table, since a failing row raises in LiteLLM. Add a cli-team-grants-* seed to the helper_case corpus for each of the two calls.
