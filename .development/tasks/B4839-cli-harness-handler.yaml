id: B4839
title: Drive CLI harness turns and install private session assets
description: >-
  Implement CLIHarnessHandler in crates/betterlite-harness, which spawns and manages
  CLI-based agent runtimes (Claude Code, Codex, OpenCode). The handler validates the
  binary is present, prepares a private directory with config files and cached directories,
  streams JSON-delimited events from stdout, collects stderr into a bounded ring buffer,
  and cleans up processes on disconnection. Complete the BaseHarnessHandler protocol with
  async start(), turn(), stop() methods, native_session_id(), and resume().

  start() calls config.validate_environment, checks the binary exists via sandbox.which(),
  creates a private temp directory, calls config.transform_session_setup to build config
  and file lists, creates symbolic links for persisted cache directories (with 'sh -c'
  scripts that fail safely), writes config files and skills to the sandbox, and stores
  the setup and private directory for later turns.

  turn() assembles a turn request, spawns the process with env and cwd, establishes stdin,
  reads stdout in HARNESS_STREAM_READ_CHUNK_BYTES chunks to avoid the StreamReader's 64KiB
  limit, decodes each line as JSON with decode_json_line, streams parsed events through
  config.transform_stream_line, tracks native session ids from the state, collects stderr
  asynchronously into a deque with maxlen=HARNESS_STDERR_TAIL_LINES (40 lines), and on
  early exit kills the process. Finally, calls config.transform_turn_response with the
  accumulated state, exit code and stderr tail, then sets ctx.final_text and ctx.output_json.

  Implement async helpers: iter_stream_lines (read chunks until EOF, yield newline-split
  lines), drain_stderr (stream stderr lines into a bounded ring, decoding UTF-8 with
  replacement), send_stdin (write and close), private_dir_for (call sandbox.tempdir()),
  sandbox_path (prepend private_dir if path is relative), persist_dir (run shell script
  that links directories to ~/.cache/litellm-harness/<subpath>), and copy_skills (read
  skill files and write them to the sandbox with OS separators converted to forward slashes).

  Add a cargo-fuzz target at crates/betterlite-harness/fuzz/fuzz_targets/cli_jsonl_framing.rs
  that feeds arbitrary bytes to iter_stream_lines, and seed its corpus with JSON lines from
  the turn() test cases (each chunk arriving separately, then arriving in one read, then split
  mid-line, then with no newline at the end). Replay the corpus in a normal test named
  replays_the_cli_jsonl_framing_corpus that parses every file without a panic or hang.

  Every behavior at the pinned LiteLLM commit is present. Shell script linking may fail
  gracefully with debug logging. Process shutdown is owned by sandbox.exec; this handler
  only calls proc.kill() on early exit from turn().

  send_stdin closes the pipe the way LiteLLM's proc.stdin.close() does. tokio's ChildStdin
  shutdown() is a no-op on Unix, so only dropping the handle gives the child EOF, and the
  Process trait in crates/betterlite-harness/src/sandbox.rs only lends stdin out. Add
  `fn close_stdin(&mut self);` to Process, implement it in SubprocessHandle
  (sandbox/local/process.rs) by dropping its stdin, give the two NoProcess test doubles
  (crates/betterlite-harness/src/snapshots/tests.rs and
  crates/betterlite-deepagents-harness/src/sandbox_backend/tests/host.rs) an empty body,
  and call it from send_stdin after the write.
