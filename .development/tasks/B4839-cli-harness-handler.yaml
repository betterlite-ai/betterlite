dod:
  - text: CLIHarnessHandler stores the config, private dir, setup, native session id and current process; start() validates the binary exists and prepares the private directory.
    proof: [cli-handler-tests]
  - text: Every turn spawns a process, streams stdout JSON lines without truncation, collects stderr in a bounded ring, and yields events from config.transform_stream_line.
    proof: [cli-handler-tests]
  - text: Early process exit kills the subprocess, and process shutdown is idempotent.
    proof: [cli-handler-tests]
  - text: Session resumption preserves the native session id across turns when config.get_native_session_id updates state.
    proof: [cli-handler-tests]
  - text: stdin is closed before stdout is read, unblocking the subprocess.
    proof: [cli-handler-tests]
  - text: stderr is collected asynchronously and does not block event processing.
    proof: [cli-handler-tests]
  - text: Every helper function preserves LiteLLM's semantics. iter_stream_lines reads chunks until EOF. drain_stderr appends to a deque. send_stdin encodes, writes and closes. persist_dir runs a shell script safely. copy_skills resolves the skill name and converts OS separators to forward slashes.
    proof: [cli-handler-tests]
  - text: The cargo-fuzz target crates/betterlite-harness/fuzz/fuzz_targets/cli_jsonl_framing.rs exists, replays a nonempty corpus, and every file parses without a panic or hang.
    proof: [cli-jsonl-framing-corpus]
  - text: A fuzz corpus seed covers chunks arriving separately, in one read, split mid-line and without a trailing newline.
    proof: [cli-jsonl-framing-corpus]
checks:
  optional: [mutants]
  commands:
    - id: cli-handler-tests
      why: CLI handler tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^cli_handler::/) - test(replays_the_cli_jsonl_framing_corpus)'
    - id: cli-jsonl-framing-corpus
      why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
      run: test -f crates/betterlite-harness/fuzz/fuzz_targets/cli_jsonl_framing.rs && test -n "$(ls -A crates/betterlite-harness/fuzz/corpus/cli_jsonl_framing)" && cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(replays_the_cli_jsonl_framing_corpus)'
oracle_cases: []
deviations:
  - what: Shell script linking with persist_dir logs failures at debug level and continues; cache persistence is optional.
    why: LiteLLM logs errors from subprocess failures and does not block on cache unavailability; betterlite's verbose_logger preserves that behavior.
  - what: Process shutdown on early turn() exit calls proc.kill(), leaving the sandbox to track process group cleanup.
    why: The LocalSandbox (B4832) owns process group cleanup; CLIHarnessHandler signals early exit but does not manage SIGTERM/SIGKILL timing or session groups.
out_of_scope:
  - Harness-specific config transformations. Each harness implements transform_session_setup, transform_turn_request, create_stream_state, transform_stream_line, get_native_session_id and transform_turn_response in its own config (B4834–B4839 parts).
  - Skill file format validation beyond SKILL.md presence check (owned by read_skill_files in B4831).
  - Logging beyond debug-level messages for setup failures.
  - Process group isolation and SIGTERM/SIGKILL handling (owned by LocalSandbox in B4832).
pitfalls:
  - iter_stream_lines must yield buffered partial lines on EOF, not lose them; test with input that has no trailing newline.
  - drain_stderr appends decoded lines to a deque with maxlen; oldest lines are silently dropped when the buffer is full.
  - Process stdout is read before wait() is called; if the process fills stdout and blocks, turn() blocks on draining chunks. Never change the order.
  - The native_session_id is captured from state after every line parse; config.get_native_session_id may return None early in the turn.
  - A process that closes stderr before stdout will not deadlock because drain_stderr is concurrent; ensure both streams are drained.
  - AsyncWriteExt::shutdown() on a tokio ChildStdin leaves the pipe open on Unix, so `cat` or `codex exec ... -` waits for EOF forever; send_stdin must call Process::close_stdin.
  - PERSIST_DIR_SCRIPT uses shell variable substitution with HOME fallback; it runs in the sandbox and must reference paths the sandbox can create.
  - Skill names are resolved with os.path.realpath before use, so symlink targets must be readable; the copy loop includes os.sep replacement for Windows compatibility even on Unix.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
