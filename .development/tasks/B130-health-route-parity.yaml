id: B130
title: Health routes answer like LiteLLM through the booted proxy
description: >-
  The health parts each build a router function and stop there: B4444 GET /health/shared-status, B4445 GET /health,
  /health/history and /health/latest, B4446 POST /health/test_connection, B4447 GET /test and GET /health/services. Only
  B8540 mounts them, and B8540 depends on all four, so the HTTP cases those parts list can never pass on their own branches:
  the booted proxy answers 404 for every one of those paths until B8540 merges. B8540 already took B4448's 17 cases for
  that reason. This task takes the other parts' 28 HTTP cases, and adds the GET /health cases that run a real probe against
  the mock provider, which no part has: B4443's cycle has no cases, B4440 and B7640 have helper cases only, and B4445's
  four cases never reach a probe. It writes no new module. When a case shows betterlite answering differently from LiteLLM,
  fix the module that owns that behavior (the owner is named in the part's task file) with the smallest change that makes
  the answer match, and add a test for it next to that module's existing tests.

  Moved cases. Write each from the owning task's description, DoD and pitfalls and from the LiteLLM lines it cites, under
  the new folder with the file name the part listed. The architect removes them from the parts.

  tools/oracle/cases/health/routes/shared-status/ (B4444, _health_endpoints.py L1369-L1409): shared-status-disabled.yaml
  (no use_shared_health_check, 200 `{"shared_health_check_enabled": false, "message": "Shared health check is not
  enabled"}`), shared-status-no-redis.yaml (`general_settings: {use_shared_health_check: true}` and no Redis, 200 with
  redis_available false and "Redis is not configured"), shared-status-enabled.yaml (the same with Redis, the status object
  with its pod_id and ages ignored) and shared-status-error.yaml (the 500 "Failed to retrieve shared health check status:
  ..." as B4444 describes it).

  tools/oracle/cases/health/routes/status/ (B4445): history-no-database.yaml and latest-no-database.yaml (500
  `{"detail": {"error": "Database not initialized"}}` from _check_prisma_client), history-limit-zero-422.yaml (GET
  /health/history?limit=0, the query validation 422 before any database check) and health-unknown-model-id-404.yaml (GET
  /health?model_id=missing-id, 404 `{"detail": {"error": "Model with ID missing-id not found"}}`).

  tools/oracle/cases/health/routes/access/ (B4446, the visibility helpers at L909-L1039 and POST /health/test_connection at
  L2016-L2234): admin-and-view-only-see-routing-fields.yaml, non-admin-hides-routing-fields.yaml,
  team-isolation-blocks-probe.yaml, scoped-grant-limits-team-access.yaml, deployment-id-lookup-preferred.yaml,
  fallback-to-model-name-then-provider-string.yaml, os-environ-reference-rejected-400.yaml,
  mismatched-credential-name-strips-config-fields.yaml, connection-test-200-with-error-status.yaml and
  model-call-auth-rejects-unprivileged.yaml. The test_connection cases need a database (L2114 answers 500 without one), and
  the non-admin and team cases need virtual keys, so seed keys, teams and roles with the case's `database:` fixture.

  tools/oracle/cases/health/routes/services/ (B4447, L240-L612): services-no-key.yaml, services-unknown-name.yaml,
  services-missing-name.yaml, services-mock-braintrust.yaml, services-unmatched-null.yaml, services-webhook-null.yaml,
  services-slack-not-configured.yaml, services-teams-not-configured.yaml, services-teams-no-url.yaml and test-route.yaml.

  New probe cases in tools/oracle/cases/health/probe/. Every config uses the deployment `{model_name: probe-a,
  litellm_params: {model: openai/gpt-4o-mini, api_base: "{{upstream}}", api_key: oracle-key-a}, model_info: {id:
  probe-a-id}}` unless the case says otherwise, every config sets `general_settings: {master_key: oracle-master}`, every
  request is a GET with `authorization: Bearer oracle-master`, and every case compares the upstream authorization header. A healthy upstream answer is a 200 chat.completion with
  content-type application/json, `x-ratelimit-remaining-requests: "99"` and `x-ratelimit-remaining-tokens: "9999"`; an
  unhealthy one is a 401 with `{"error": {"message": "Incorrect API key provided", "type": "invalid_request_error", "param":
  null, "code": "invalid_api_key"}}`. LiteLLM probes chat with a random pick of two messages and `max_tokens` 16
  (health_check.py L139-L145, L785-L792), so no case compares the upstream body.

  chat-healthy.yaml: GET /health, one healthy answer. LiteLLM answers healthy_endpoints with the model, api_base, both rate
  limit headers copied from the upstream response and model_id, an empty unhealthy list and the two counts.

  chat-unhealthy-401.yaml: the same with the 401 answer; the unhealthy endpoint carries model, api_base, error,
  raw_request_typed_dict, model_id and exception_status 401. Ignore /unhealthy_endpoints/0/error (B6750's deviation: the
  stack text after the message is the cause chain, not a Python traceback) and
  /unhealthy_endpoints/0/raw_request_typed_dict/raw_request_body/messages (the random message).

  details-off.yaml: chat-healthy with `health_check_details: false` added to general_settings (B9580's key); the endpoint
  keeps only model and model_id.

  two-deployments-in-order.yaml: probe-a and a second deployment probe-b with id probe-b-id, the same api_key on both so the
  order the two probes reach the mock doesn't matter, two healthy answers; the lists follow model_list order.

  model-name-filter.yaml: probe-a and probe-b with api keys oracle-key-a and oracle-key-b, GET /health?model=probe-a, one
  answer; only probe-a is probed.

  model-name-unhealthy-503.yaml: GET /health?model=probe-a with the 401 answer. A targeted request with no healthy
  endpoint is status 503 with the usual body (L1182-L1183); ignore the same two pointers as chat-unhealthy-401.

  model-id-filter.yaml: two deployments both named probe-shared with ids probe-a-id and probe-b-id and keys oracle-key-a and
  oracle-key-b, GET /health?model_id=probe-b-id, one answer; only probe-b-id is probed and reported.

  health-check-model-shown.yaml: probe-a with `model_info.health_check_model: openai/gpt-4o`. LiteLLM writes the override
  into the copied litellm_params in place (L800-L802) and later builds the endpoint from that same dict (L627-L631), so the
  healthy endpoint reports model openai/gpt-4o.

  no-key-401.yaml: GET /health with no key header and no upstream answer; the auth pipeline answers 401 before the handler.
  Ignore /error/message only, as tools/oracle/cases/auth/wrong-key.yaml does.

  Run the cases with `cargo run --locked -p betterlite-oracle -- --self-check <folder>` first, to see that LiteLLM answers the
  same twice and that each ignore is needed, then without --self-check against the built gateway.
