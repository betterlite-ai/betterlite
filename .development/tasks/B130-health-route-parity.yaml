dod:
  - text: The 28 moved cases of B4444, B4445, B4446 and B4447 match LiteLLM through the booted proxy.
    proof: [route-cases, oracle]
  - text: GET /health probes the mock provider and reports healthy and unhealthy endpoints, the details switch, the model and model_id filters, the targeted 503 and the health_check_model display exactly as LiteLLM does.
    proof: [probe-cases, oracle]
checks:
  optional: []
  commands:
    - id: route-cases
      why: Without the moved case files the oracle proof checks none of the four parts' routes
      run: >-
        test "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/health/routes | wc -l)" -eq 28
    - id: probe-cases
      why: Without the probe case files the oracle proof never runs a health probe
      run: >-
        test "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/health/probe | wc -l)" -eq 9
