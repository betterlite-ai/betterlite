deviations: []
out_of_scope:
  - "Building any health route, helper or adapter: B4440 to B4449, B6750 and B7640 own the logic, B8540 mounts the routers and implements the adapters, B9580 parses the general_settings keys. This task only adds cases and fixes what they show."
  - "B4448's readiness, drain, backlog, license, OPTIONS, /settings and /active/callbacks cases and B8540's four wiring cases: B8540 holds them."
  - "Embedding and text completion probes through GET /health: B8540 records them as a deviation (UnavailableProbe), so no case here uses a non-chat mode."
  - "GET /health with background_health_checks on: the first background cycle races the request at startup (proxy_server.py L1523-L1524), so the cache path is proven by B8540's start test and B4445's health_ tests, not by a case."
  - "The CLI model path (user_model from `litellm --model`): the oracle boots both proxies from a config file only, so B4445's tests cover it."
pitfalls:
  - The healthy endpoint copies x-ratelimit-remaining-requests, x-ratelimit-remaining-tokens and x-ms-region from the upstream response headers only when present, so a mock answer without them gives an endpoint without them.
  - exception_status and model_id appear only on a deployment that has model_info.id; keep the id in every probe config or the shape changes.
  - Two probes run concurrently, so a case with two deployments and different upstream answers or keys is order-dependent; give both the same answer and key unless a filter leaves one probe.
  - A request with model or model_id and no healthy endpoint is 503 with the normal body, while the same failure on plain GET /health stays 200.
  - The master key caller is a proxy admin, so api_base stays in every probe case; the non-admin stripping and the Litellm-Health-Field-Notice header are proven by the moved access cases.
  - The shared-status cases read general_settings.use_shared_health_check through B9580's section; without it the config fails to load.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
