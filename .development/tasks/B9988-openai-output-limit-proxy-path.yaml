id: B9988
title: OpenAI output-limit and rejected-field recovery on the proxy chat path
description: >-
  Wire B505's output-limit and rejected-field recovery into the path real proxy chat calls take. An output-limit 400
  becomes a 200 length-truncated reply, or on a stream the two frames LiteLLM's stream wrapper sends; a 422 is resent
  once without the fields it rejects when the proxy-wide drop_params is on. This is the provider-specific repair,
  not a router retry policy. Split from B505 on 11-18: B505 builds the pure functions in
  crates/betterlite-openai/src/output_limits.rs and output_limits/**, impl PromptTokens for Counter, and
  runtime_counter in crates/betterlite-tokenizer/src/count/runtime.rs. Call them; never reimplement them here.


  Own the callers' repair branches in litellm/llms/openai/openai.py: the BadRequestError branch of
  make_openai_chat_completion_request and the UnprocessableEntityError branches of acompletion and async_streaming,
  ported where the proxy runs them, in betterlite-provider and betterlite-server as described below.


  Why the repair lives on the provider path: B505's first plan put the repair in ChatExecutor::send and ChatExecutor::stream. Since B010 a
  proxy chat call that no mock answers goes through provider_chat in
  crates/betterlite-server/src/server/chat_setup/provider_call.rs and provider_stream in
  crates/betterlite-server/src/routes/chat/streaming.rs, and both run betterlite-provider's OpenAi prepare, execute
  and decode. The executor only serves mocked calls and the oracle's SDK harness, so with the repair there the three
  chat oracle cases got a 400 from betterlite where LiteLLM answers 200. The 422 case also needs the proxy-wide flag:
  its config sets litellm_settings.drop_params, and LiteLLM's retry reads litellm.drop_params, never the call's own
  drop_params.


  The proxy-wide drop_params, in betterlite-openai and betterlite-provider. Add pub global_drop_params: bool to
  OpenAiDefaults and to ChatDeployment in crates/betterlite-openai/src/chat/deployment.rs; resolve_with sets
  global_drop_params: defaults.global_drop_params. openai_defaults in crates/betterlite-server/src/server/chat_setup.rs
  and in tools/oracle/src/sdk_http/native.rs set it from config.sections.drop_params.policy.global_drop_params, the
  value of litellm_settings.drop_params or LITELLM_DROP_PARAMS. Every other OpenAiDefaults and ChatDeployment literal
  sets false. Add pub global_drop_params: bool to Deployment in crates/betterlite-provider/src/prepared/deployment.rs:
  from_chat copies deployment.global_drop_params, and from_params sets false since its params never carry the
  proxy-wide setting.


  The 422 retry, in betterlite-provider. In crates/betterlite-provider/src/transform_retry.rs the hook becomes
  fallible: fn transform_request(&self, _prepared: &mut PreparedRequest, _response: &UpstreamResponse, _deployment:
  &Deployment) -> Result<(), OperationError>, with a default body of Ok(()), and send_with_retry propagates it with
  ?. Add OperationError::RejectedFields { #[source] source: RejectedFieldsError } in
  crates/betterlite-provider/src/operation.rs. In crates/betterlite-provider/src/openai_dispatch.rs, chat_request sets
  retry to TransformRetry::bounded(2)? when deployment.global_drop_params is true and TransformRetry::DISABLED
  otherwise, matching LiteLLM's for _ in range(2) loop. Delete the empty impl TransformOnUnprocessable for OpenAi {}
  there and write the filled impl in the new child module crates/betterlite-provider/src/openai_dispatch/recovery.rs,
  declared by mod recovery; at the bottom of openai_dispatch.rs. should_retry answers response.status == 422, the
  status of openai.UnprocessableEntityError. transform_request takes the body of a PreparedRequest::Chat or
  PreparedRequest::Stream (any other variant returns Ok(())), parses it into a Map<String, Value>
  (OperationError::Encode on failure), builds the SDK's exception body from the 422 (the response JSON's error member
  when the body is a JSON object holding one, else the whole JSON value, else the body text as a JSON string),
  calls without_rejected_fields(ErrorBody::Sdk(&error_body), &sent) (OperationError::RejectedFields on failure) and
  writes the result back as the request body. It drops whatever loc[1] names, model and messages included, as the
  async and streaming handlers do with data.


  The output-limit seam, in betterlite-provider. Add OperationResult::OutputLimit { sent: Box<Map<String, Value>> } in
  operation.rs: the request body as sent, for the caller to rebuild the reply from. recovery.rs also owns pub(super)
  fn output_limit(chat: &PreparedChat, response: &UpstreamResponse) -> Result<Option<OperationResult>,
  OperationError>: it answers Ok(None) unless response.status is 400 and ErrorBody::Http(&response.body)
  .reaches_output_limit(), and otherwise parses chat.http.body into the sent map (OperationError::Encode on failure).
  OpenAi::decode calls it first in its (PreparedKind::Chat(chat), Upstream::Buffered(response)) and
  (PreparedKind::Stream(chat), Upstream::Buffered(response)) arms and returns the Some value; with None both arms run
  as today, so every other 400 stays OperationError::Provider.


  The reply, in betterlite-server. answer_chat and provider_chat in provider_call.rs return Result<(OperationResult,
  HeaderMap, Duration), CallError<ChatError>>: provider_chat drops its let-else and hands the decoded result on, and
  the mock path wraps its reply as OperationResult::Chat(ChatCompletion::OpenAi(..)). provider_stream in
  streaming.rs returns Result<(OperationResult, HeaderMap), CallError<ChatError>>, with the headers read from
  Upstream::headers() before decode. chat_error in provider_call.rs and its embedding twin in
  provider_call/embedding.rs send OperationError::RejectedFields to CallError::Operation next to TransformRetry, a 500
  as LiteLLM's AttributeError gives. ChatCalls in streaming.rs becomes pub(crate) struct ChatCalls { pub(crate)
  executor: Arc<ChatExecutor>, pub(crate) counter: Counter } with pub(crate) fn new(config: &Config, executor:
  Arc<ChatExecutor>) -> Result<Self, CountError>; it builds the counter with runtime_counter(config,
  &Arc::new(executor.client.clone()), &BundledCatalog::default().get()). ChatCall::complete matches the result:
  OperationResult::Chat goes on as today, OperationResult::OutputLimit { sent } goes to recovery::completion and any
  other variant answers ChatFailure::Mismatched. ChatCall::stream does the same with OperationResult::Stream and
  recovery::stream.


  The new module crates/betterlite-server/src/routes/chat/streaming/recovery.rs, declared by mod recovery; in
  streaming.rs, holds pub(super) async fn completion(calls: &ChatCalls, sent: &Map<String, Value>, headers: HeaderMap,
  client_model: Option<&str>) -> Result<(ChatCompletion, HeaderMap), ChatFailure> and pub(super) async fn
  stream(calls: &ChatCalls, sent: &Map<String, Value>, headers: HeaderMap, upstream_time: Duration) ->
  Result<ChatStreamAnswer, ChatFailure>. Both call build_limit_response with Recovery { clock: calls.executor.clock,
  next_id: calls.executor.next_id, tokens: &calls.counter } and the 400's headers. A PromptCountError answers
  ChatFailure::Internal { message: error.to_string() }, and a RecoveredBody of the other shape answers
  ChatFailure::Mismatched. completion returns ChatCompletion::OpenAi(Box::new(response.for_client(client_model))) with
  the returned headers. stream yields two SSE frames (data: {json}, then a blank line) as a BoxStream of Ok(Vec<u8>)
  items, the shape mock_stream already builds: first the recovered chunk with finish_reason null, then the same chunk
  with an empty delta (Delta::default()) and finish_reason length. That is what LiteLLM's CustomStreamWrapper makes of
  the one chunk; relay_bytes then adds data: [DONE] as for any upstream stream.


  Wiring. crates/betterlite-server/src/routes/chat.rs: mod streaming; becomes pub(crate) mod streaming;, and
  chat_routes_with_call_id takes calls: Arc<ChatCalls> in place of executor: Arc<ChatExecutor>. Its three-line
  ChatCalls construction becomes exactly these two lines: let executor = Arc::clone(&calls.executor); and let calls:
  Arc<dyn ChatCall> = calls;. In crates/betterlite-server/src/server.rs, application builds ChatCalls::new(config,
  Arc::clone(&executor)) and passes Arc::new of it; ServerError gains TokenCounter { #[source] source: CountError }
  with the message the token counter limits are invalid: {source}. Every test that calls chat_routes_with_call_id
  builds ChatCalls::new the same way; a test with no Config at hand loads one with ConfigLoader { lookup:
  BTreeMap::new() }.load("").




  Oracle. The three chat cases tools/oracle/cases/chat/openai-output-limit-buffered.yaml,
  openai-output-limit-stream.yaml and openai-422-drop-retry.yaml run the real gateway against LiteLLM; their
  recovered replies carry the real prompt count. B505's first run already wrote them: read them with git show
  672ada1dc5:tools/oracle/cases/chat/<name>.yaml and keep them unless the CI oracle run says LiteLLM answers
  otherwise.


  Tests. Write rstest function openai_recovery_cases in crates/betterlite-provider/src/openai_dispatch/recovery/tests.rs
  with named cases output_limit_chat, output_limit_stream, unrelated_400_stays_provider, retry_drops_rejected_fields,
  retry_needs_global_flag and malformed_detail_fails_the_call, driving OpenAi prepare, execute and decode against a
  loopback upstream. Write rstest function output_limit_route_cases in
  crates/betterlite-server/src/routes/chat/streaming/recovery/tests.rs with named cases buffered_length_reply,
  stream_two_frames, unrelated_400_answers_400 and drop_params_resend, booting chat_routes_with_call_id against a
  loopback upstream and asserting both the client response and the captured upstream requests. Each case exercises
  its named outcome independently with stable clocks and IDs. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Budget: about 120 changed lines in betterlite-provider, about 200 in betterlite-server and about 30 for the
  global_drop_params field and its literals, plus the deviations log. Test files and oracle cases do not count.
