dod:
- text: 'openai output limit buffered: a proxy chat call whose OpenAI upstream answers the output-limit 400 gets a
    200 length-truncated completion with the real prompt count and the 400''s headers, through OpenAi::decode''s
    OperationResult::OutputLimit and the server''s recovery::completion, and matches tools/oracle/cases/chat/openai-output-limit-buffered.yaml.'
  proof:
  - provider-recovery
  - route-recovery
  - oracle
- text: 'openai output limit stream: a streaming proxy chat call whose upstream answers the output-limit 400 gets
    the two frames LiteLLM''s stream wrapper sends (the chunk with finish_reason null, then an empty delta with
    finish_reason length) and data: [DONE], and matches tools/oracle/cases/chat/openai-output-limit-stream.yaml.'
  proof:
  - provider-recovery
  - route-recovery
  - oracle
- text: 'openai 422 drop retry: with litellm_settings.drop_params true, a 422 is resent once without the fields its
    detail names and the second answer reaches the client; without the proxy-wide flag no retry happens, whatever
    the call or deployment drop_params says; a malformed detail fails the call. Matches tools/oracle/cases/chat/openai-422-drop-retry.yaml.'
  proof:
  - provider-recovery
  - route-recovery
  - oracle
- text: The chat routes build their Counter with B505's runtime_counter through ChatCalls::new; nothing in
    betterlite-server builds a second one by hand.
  proof:
  - route-recovery
checks:
  optional:
  - mutants
  commands:
  - id: provider-recovery
    why: OpenAi decode does not answer OperationResult::OutputLimit for the output-limit 400, another 400 is recovered,
      the 422 resend keeps a rejected field, the retry runs without the proxy-wide flag, or a malformed detail does not
      fail the call.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::openai_recovery_cases::/)'
  - id: route-recovery
    why: The booted chat routes do not answer the length-truncated reply, the two stream frames, the unrelated 400
      or the 422 resend the way the named cases assert.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/::output_limit_route_cases::/)'
oracle_cases:
- tools/oracle/cases/chat/openai-output-limit-buffered.yaml
- tools/oracle/cases/chat/openai-output-limit-stream.yaml
- tools/oracle/cases/chat/openai-422-drop-retry.yaml
deviations: []
out_of_scope:
- B505 owns the output_limits functions, the Azure raw-send wrappers, impl PromptTokens for Counter, runtime_counter
  and the helper oracle cases. Call them as they are; a gap in them goes back to the architect, not into a copy here.
- ChatExecutor::send and ChatExecutor::stream stay as on main. They serve only mocked calls and the oracle's SDK
  harness; a later task that wants the repair there calls the same output_limits functions.
- The gateway relay passes ordinary upstream stream chunks through one to one and does not port LiteLLM's
  CustomStreamWrapper. Only the recovered stream's two frames are built here.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- Dispatched runs cannot compile, so follow the signatures in the description exactly. Chunk in
  betterlite_openai::stream::chunk derives no Clone, so write the second stream frame by serializing the same chunk
  again after the change (take the choice's finish_reason before the first frame, put it back and set the delta to
  Delta::default() before the second). A failed serialization answers ChatFailure::Route(ChatError::Encode { source })
  as mock_stream does.
- 'Imports a dispatched run cannot see go unused: openai_dispatch.rs drops TransformOnUnprocessable from its
  crate::transform_retry import (recovery.rs imports it). The Rewrite test hook in transform_retry/tests.rs overrides
  transform_request, so it takes the new return type and returns Ok(()).'
- 'File sizes: the file-size check counts every line except bare mod x; and pub mod x; lines, so pub(crate) mod
  streaming; counts. crates/betterlite-server/src/routes/chat.rs is exactly 300 today and must stay at or under
  300. That is why its ChatCalls construction shrinks to the two lines given. streaming.rs is 259, so the recovery
  bodies go to streaming/recovery.rs. crates/betterlite-server/src/routes/embeddings.rs is 298, so do not add a
  CallError variant: its embedding_port_failure match would need a new arm.'
- The 422 retry is gated by the proxy-wide flag only. A request's own drop_params and a deployment's
  litellm_params.drop_params never turn it on, since openai.py reads litellm.drop_params or the handler's drop_params
  argument and main.py never passes that argument.
- The resend drops whatever loc[1] names, model and messages included, as the async and streaming handlers drop
  from data. After the second 422 the provider's error reaches the client; LiteLLM's loop returns None there, and
  this task's deviations log records that.
- 'The second stream frame comes from reading streaming_handler.py, not from a LiteLLM run: frame 0 is the recovered
  chunk with delta {role: assistant, content: ""} and finish_reason null, frame 1 has an empty delta and finish_reason
  length. openai-output-limit-stream.yaml ignores /0 and /1 ids and timestamps, and that fits two frames. If the first
  CI oracle run shows another shape for frame 1, match LiteLLM''s.'
- B024 (https://github.com/betterlite-ai/betterlite/pull/2247, merged) turned OpenAiResult into an enum and added
  module lines at the top of openai_dispatch.rs. Put mod recovery; at the bottom of openai_dispatch.rs, keep the
  decode and chat_request edits in their own hunks and leave OpenAiResult alone.
- 'docs/deviations/B9988.yaml holds the second-422 row: after the second 422 the provider''s error reaches the
  client, where LiteLLM''s two-iteration loop falls out of the function and returns None. Copy its what, why and link
  from B505''s log at 672ada1dc5:docs/deviations/B505.yaml; B505 drops it from its own log.'
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
