id: B519
title: OpenAI assistant definitions
description: >-
  Add AssistantCreate/AssistantObject and list/create/delete provider calls with the Assistants beta header. Wire
  tool resources and response-format fields as typed structures. Public lifecycle routes remain B089, and Python
  sync/async wrapper overloads share these calls.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/openai.py: OpenAIAssistantsAPI.__init__
  L2251-L2252; OpenAIAssistantsAPI.get_openai_client L2254-L2277; OpenAIAssistantsAPI.async_get_openai_client L2279-L2302;
  OpenAIAssistantsAPI.async_get_assistants L2306-L2338; OpenAIAssistantsAPI.get_assistants L2343-L2353; OpenAIAssistantsAPI.get_assistants
  L2356-L2366; OpenAIAssistantsAPI.get_assistants L2370-L2414; OpenAIAssistantsAPI.async_create_assistants L2417-L2438;
  OpenAIAssistantsAPI.create_assistants L2440-L2471; OpenAIAssistantsAPI.async_delete_assistant L2474-L2495; OpenAIAssistantsAPI.delete_assistant
  L2497-L2528.


  Named case contracts: list_assistants_pagination: Sync list defaults order=desc and limit=20; always pass those
  two keys, even when explicitly None, and include before/after only when truthy. Calling the public method with
  aget_assistants=True drops all four pagination inputs and the async helper receives its defaults desc/20/None/None;
  direct async helper calls retain their inputs. assistant_error: Create forwards create_assistant_data without
  rewriting; delete passes assistant_id; every method returns the SDK result and propagates SDK failures unchanged.
  Only the literal boolean True selects async. sdk_client_argument_projection: Construct the SDK client only when
  client is None: api_base becomes base_url; omit None-valued api_key, timeout, max_retries and organization, but
  retain empty strings/zero. A supplied client wins without rebuilding it. Separate sync/async constructors select
  the client type. assistants_beta_default: The SDK beta assistants namespace supplies OpenAI-Beta: assistants=v2
  for list/create/delete. Capture all three operations through the same header case as threads/messages and vector
  stores.


  Write standalone Rust test openai_assistants_credential_identity_isolation in betterlite-openai: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test openai_assistants_secret_safe_failure in betterlite-openai: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-openai/src/assistants.rs with adjacent tests under assistants/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function assistants_cases in betterlite-openai with these exact named cases (one per oracle file):
  list_assistants_pagination, create_tools_resources, delete_assistant, assistant_error, sdk_client_argument_projection,
  assistants_beta_default. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_assistants* using HelperCase: kind: helper
  and the externally tagged openai_assistants variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_openai_assistants that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_assistant_object consumes assistant JSON response bytes in crates/betterlite-openai/src/assistants.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-openai/fuzz/fuzz_targets/openai_assistants.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-openai/fuzz/corpus/openai_assistants.
  The adjacent test replays_the_openai_assistants_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 244 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 265 production lines, 190 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 635 planned, 650 maximum changed lines.
