checks:
  optional:
  - mutants
  commands:
  - id: case-list-assistants-pagination
    why: Sync list defaults order=desc and limit=20; always pass those two keys, even when explicitly None, and
      include before/after only when truthy. Calling the public method with aget_assistants=True drops all four
      pagination inputs and the async helper receives its defaults desc/20/None/None; direct async helper calls
      retain their inputs.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::assistants_cases::case_[0-9]+_list_assistants_pagination$/)'
  - id: case-create-tools-resources
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-assistants/create-tools-resources.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::assistants_cases::case_[0-9]+_create_tools_resources$/)'
  - id: case-delete-assistant
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/openai-assistants/delete-assistant.yaml.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::assistants_cases::case_[0-9]+_delete_assistant$/)'
  - id: case-assistant-error
    why: Create forwards create_assistant_data without rewriting; delete passes assistant_id; every method returns
      the SDK result and propagates SDK failures unchanged. Only the literal boolean True selects async.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::assistants_cases::case_[0-9]+_assistant_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_assistants.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_assistants*")"
      && grep -lq 'openai_assistants' tools/oracle/fuzz/corpus/helper_case/openai_assistants* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_assistants$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/openai_assistants)"
      && grep -q 'decode_assistant_object' crates/betterlite-openai/fuzz/fuzz_targets/openai_assistants.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::replays_the_openai_assistants_corpus$/)'
  - id: case-sdk-client-argument-projection
    why: 'Construct the SDK client only when client is None: api_base becomes base_url; omit None-valued api_key,
      timeout, max_retries and organization, but retain empty strings/zero. A supplied client wins without rebuilding
      it. Separate sync/async constructors select the client type.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::assistants_cases::case_[0-9]+_sdk_client_argument_projection$/)'
  - id: case-assistants-beta-default
    why: 'The SDK beta assistants namespace supplies OpenAI-Beta: assistants=v2 for list/create/delete. Capture
      all three operations through the same header case as threads/messages and vector stores.'
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::assistants_cases::case_[0-9]+_assistants_beta_default$/)'
  - id: credential-identity-isolation
    why: Distinct configured identities cannot share credentials, headers or cache entries.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_assistants_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: Debug and owned failure paths do not expose fixture credentials.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/::openai_assistants_secret_safe_failure$/)'
