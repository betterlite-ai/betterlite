pitfalls:
- 'The oracle helper for this task is pre-registered as openai_assistants in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/assistants.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_assistants.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The public async-list branch fails to forward pagination even though the async helper supports it; wiring all
  arguments through would change the pin.
- A supplied SDK client is used as-is, without the explicit missing/wrong-async checks used by files and batches.
