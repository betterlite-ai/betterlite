budget:
  max_changed_lines: 400
  max_new_expects: 0
checks:
  commands:
  - id: helper-python
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_invoke_stream.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
    why: The operation adapter is absent, unchanged or fails strict Python checks.
  - id: helper-case-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_stream*")"
      && grep -lq 'bedrock_invoke_stream' tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_stream* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_invoke_stream$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
  - id: case-stream-transport-arguments
    why: Both wrappers serialize data with json.dumps, pass model/messages/headers/api_base/json_mode and the B2205
      provider selector to B691, and get stream_chunk_size from B176 stored_control_options. fake_stream is true
      when api_base contains the case-sensitive substring ai21, regardless of model. No body decoder belongs here.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_stream_cases::case_[0-9]+_stream_transport_arguments$/)'
  - id: case-async-sync-signed-bytes
    why: The async wrapper ignores signed_json_body and sends serialized data. The sync wrapper forwards signed_json_body,
      including empty bytes; B691 chooses those bytes. Sync chooses B173 _get_httpx_client(params={}) when client
      is None or an AsyncHTTPHandler, otherwise preserves the caller client.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_stream_cases::case_[0-9]+_async_sync_signed_bytes$/)'
  - id: case-wrapper-identity
    why: Construct B004 CustomStreamWrapper with custom_llm_provider=bedrock even when the argument differs, retaining
      model/logging context and returned response headers. has_custom_stream_wrapper is True; supports_stream_param_in_request_body
      is False. Use the shared B004 wrapper and B691 response owner rather than a second wrapper or frame decoder.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::invoke_stream_cases::case_[0-9]+_wrapper_identity$/)'
  optional:
  - mutants
description: >-
  Compose the inherited Invoke streaming transport below model-specific adapters and the buffered response selector.
  Preserve sync/async differences in signed-body and client selection; transport and frame lifetimes remain with
  B691/B609.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py:
  AmazonInvokeConfig.get_async_custom_stream_wrapper L443-L480; AmazonInvokeConfig.get_sync_custom_stream_wrapper
  L482-L523; AmazonInvokeConfig.has_custom_stream_wrapper L525-L527; AmazonInvokeConfig.supports_stream_param_in_request_body
  L529-L534.


  Named case contracts: stream_transport_arguments: Both wrappers serialize data with json.dumps, pass model/messages/headers/api_base/json_mode
  and the B2205 provider selector to B691, and get stream_chunk_size from B176 stored_control_options. fake_stream
  is true when api_base contains the case-sensitive substring ai21, regardless of model. No body decoder belongs
  here. async_sync_signed_bytes: The async wrapper ignores signed_json_body and sends serialized data. The sync
  wrapper forwards signed_json_body, including empty bytes; B691 chooses those bytes. Sync chooses B173 _get_httpx_client(params={})
  when client is None or an AsyncHTTPHandler, otherwise preserves the caller client. wrapper_identity: Construct
  B004 CustomStreamWrapper with custom_llm_provider=bedrock even when the argument differs, retaining model/logging
  context and returned response headers. has_custom_stream_wrapper is True; supports_stream_param_in_request_body
  is False. Use the shared B004 wrapper and B691 response owner rather than a second wrapper or frame decoder.


  Implement crates/betterlite-bedrock/src/invoke_stream.rs with adjacent tests under invoke_stream/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_invoke_stream in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function invoke_stream_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  stream_transport_arguments, async_sync_signed_bytes, wrapper_identity. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_invoke_stream* using HelperCase: kind:
  helper and the externally tagged bedrock_invoke_stream variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_invoke_stream that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task handles parsed records and delegates external bytes to B691/B609; it adds no provider decoder.


  Budget from 89 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 110 production lines, 150 behavior/config-test lines, 100 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 400 planned, 400 maximum changed lines.
