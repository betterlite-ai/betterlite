deviations:
- what: "A router whose dependency resolves to no deployment (missing alias or unknown model name) marks it with an error. Missing dependencies fail the router immediately, no partial evidence allowed."
  why: A dependency that vanishes is a configuration error that prevents the router from serving any request, unlike a probe that never happened.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_check.py#L348-L364
