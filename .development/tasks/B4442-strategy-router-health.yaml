pitfalls:
- "A strategy router is identified via classify_strategy_router_model on the model string in litellm_params, not by a type field. Never call probe logic directly on a marker; _run_model_health_check returns {} for markers."
- "Dependency expansion follows routers through routers, one hop per round. Bounds by len(universe) so a cycle terminates; without that bound, a cycle spins forever."
- "Verdicts settle iteratively: each round consumes the last round's failures plus the current round's probed unhealthy ids. A router cannot red in round 1 because no routers were probed yet, only their dependencies."
- "A deployment probed only to reach a router must be dropped from results; a caller never asked for it and the router verdict now answers the question of whether it could serve."
- "_resolved_deployment_ids uses get_model_list exactly like a request would route to the name; a missing alias or unknown name returns None, not an empty set."
- "Deduplication happens by id only, preserving order; filter_deployments_by_id keeps one row per unique id and must run after narrowing to the requested set, not before, to avoid dropping valid rows."
review_level: standard
budget:
