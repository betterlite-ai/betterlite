id: B4442
title: Strategy router health from reachable deployment evidence
description: >-
  Implement strategy router health verdicts derived from reachable deployment probes.
  Deploy only the deployments directly requested, plus transitively every deployment a strategy
  router depends on, then compute verdicts that mark routers unhealthy when any dependency
  has no healthy deployment behind it. Cycle bounds by router count and handles router cycles
  the same way LiteLLM does: every round expands to fresh dependencies and settles verdicts
  iteratively, terminating when no new routers red.

  Every strategy router (via classifier, embedding, evaluation, or tier model dependencies from
  auto_router_model_naming) is a marker that is never probed directly. Markers return {} from
  _run_model_health_check, representing no probe; the verdict here is what makes them fail the
  cached result. A router whose dependency resolves to no deployment is an error reason; when
  it resolves to some deployments and all are unhealthy, the same error marks the router. A router
  whose dependencies all have at least one healthy deployment stays healthy; partial evidence (one
  replica never checked, opted out of health checks) leaves the verdict green.

  Implement the native services in crates/betterlite-server/src/health/router.rs:
  deployment_id extracts model_info.id from a deployment, safely; resolved_deployment_ids
  resolves a model name to the frozenset of ids for every deployment a request for that name
  routes to (using the router's get_model_list, so a missing alias fails like a missing name);
  dependency_deployments_to_probe walks the full expansion of strategy router dependencies
  reachable from the probed set, returns the IDs to reach them, and dedupes by id. Then implement
  strategy_router_verdicts to settle dependency faults and finalize_strategy_router_endpoints
  to apply verdicts and drop the probed-only deployments from results.

  Add ProbeOperation::StrategyRouterHealth in tools/oracle/src/router_probes/mod.rs and the
  corresponding B4442 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services and do not repeat vendor-specific logic.
