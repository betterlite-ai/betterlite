    - crates/betterlite-provider/src/manus_responses/**
    - tools/oracle/cases/helpers/manus-responses/**
    - tools/oracle/helpers/b8104.py
    - tools/oracle/helpers/b8104/**
    - tools/oracle/src/helpers/provider/b8104.rs
    - tools/oracle/src/helpers/provider/b8104/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L34-L76
    why: Provider name, fake streaming and agent profile extraction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L78-L121
    why: The API_KEY header and URL building.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L123-L162
    why: Create request additions and extra_body merge.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L164-L234
    why: Reply decoding with the createdAt conversion and field defaults.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L236-L320
    why: Retrieve URL and the second copy of the reply decoding.
  - url: https://open.manus.im/docs/openai-compatibility
    why: Manus differences from the OpenAI Responses API.
dod:
  - text: Headers carry API_KEY and Content-Type, and a missing key raises the ValueError text.
    proof: [manus-responses-tests, oracle]
  - text: The URL handles the default base, a trailing slash and a base that already ends with /v1.
    proof: [manus-responses-tests, oracle]
  - text: The create body gets task_mode agent, the agent_profile and the extra_body keys on top.
    proof: [manus-responses-tests, oracle]
  - text: Replies convert createdAt and fill reasoning, text, output, usage and id defaults, for create and retrieve alike.
    proof: [manus-responses-tests, oracle]
  - text: A body that fails record validation is still returned.
    proof: [manus-responses-tests]
  - text: Streaming is faked and websockets are off.
    proof: [manus-responses-tests]
checks:
  optional: []
  commands:
    - id: manus-responses-tests
      why: the manus_responses behavior tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^manus_responses::/)'
oracle_cases:
  - tools/oracle/cases/helpers/manus-responses/agent-profile.yaml
  - tools/oracle/cases/helpers/manus-responses/url-default.yaml
  - tools/oracle/cases/helpers/manus-responses/url-base-with-v1.yaml
  - tools/oracle/cases/helpers/manus-responses/request-task-mode.yaml
  - tools/oracle/cases/helpers/manus-responses/request-extra-body-override.yaml
  - tools/oracle/cases/helpers/manus-responses/response-created-at-camel.yaml
  - tools/oracle/cases/helpers/manus-responses/response-defaults.yaml
  - tools/oracle/cases/helpers/manus-responses/get-request-encoded-id.yaml
deviations:
  - what: The generated unknown- id suffix is random in both implementations, so cases ignore the id when the body had none.
    why: A uuid4 cannot be compared.
out_of_scope:
  - "The OpenAI Responses base behavior (request building, reply decoding, retrieve) belongs to B506, B507, B508 and B509; the provider contract belongs to B1114."
  - "Choosing ManusResponsesAPIConfig for the manus provider (utils.py L9201) and the manus branch in get_llm_provider_logic.py L922-L925 (MANUS_API_BASE default https://api.manus.im, MANUS_API_KEY) have no owner yet, see the notes."
  - "The Manus files API belongs to B8105."
pitfalls:
  - "The manus selection arm and the config live here. The get_llm_provider base and key defaults are B211's merged table, so do not add a second copy of them."
  - The header is API_KEY in upper case with an underscore; the Authorization header is not sent.
  - extra_body is merged after task_mode and agent_profile, so it can replace them.
  - A createdAt value is ignored when created_at is already present, but created_at is still passed through the converter.
  - "A reply with reasoning set to null gets an empty object because the OpenAI record rejects None."
  - The validation fallback means a malformed Manus body returns a loosely built record instead of an error; only invalid JSON raises.
  - The retrieve URL is built from api_base as given (already ending in /v1/responses); do not add the path again.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
