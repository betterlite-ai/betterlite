id: B8104
title: Manus Responses API config
description: >-
  Build the Manus provider for the Responses API, model manus/{agent_profile}, in the module manus_responses of betterlite-provider.
  It covers litellm/llms/manus/responses/transformation.py (ManusResponsesAPIConfig, 239 code lines). The class extends the OpenAI
  Responses config; call B507's request builder, B508's reply decoding and B509's retrieve path through the provider contract of
  B1114 and override only what this file overrides. litellm/llms/manus/__init__.py and the two responses and files __init__.py files
  hold no code.


  Provider. custom_llm_provider is manus. should_fake_stream is true exactly when stream is true (Manus runs a task and returns it,
  so streaming is faked). supports_native_websocket is false. The agent profile is the text after the first "/" in the model, else
  the whole model (manus/manus-1.6 gives manus-1.6).


  Headers. The key is litellm_params api_key, else the global api_key, else MANUS_API_KEY (read through the shared secret getter). No
  key raises ValueError "Manus API key is required. Set MANUS_API_KEY environment variable or pass api_key parameter." Headers get
  API_KEY set to the key (the header name is exactly API_KEY, not Authorization) and Content-Type application/json, which is also
  needed for GET requests.


  URL. The base is api_base, else the global api_base, else MANUS_API_BASE, else https://api.manus.im, with trailing slashes
  removed. The URL is {base}/responses when the base already ends with /v1, else {base}/v1/responses.


  Create request. Start from the OpenAI request body. Then set task_mode = "agent" and agent_profile = the profile. Then, when the
  optional request params hold a non-empty extra_body object, merge its keys on top of the body, so extra_body can overwrite
  task_mode and agent_profile.


  Replies (create and retrieve share one routine in LiteLLM, but they are two functions; build one routine and call it twice).
  Log the raw text through post_call first. Parse JSON; a parse failure raises the OpenAI error type with the raw text as message and
  the HTTP status. When createdAt is present and created_at is absent, created_at takes createdAt converted by the shared created-field
  converter; then any present created_at is converted. Missing or null reasoning and text become empty objects, missing or null output
  becomes an empty list, missing or null usage becomes input_tokens 0, output_tokens 0, total_tokens 0, and a missing or null id
  becomes "unknown-" plus the first 8 hex characters of a new uuid4. The body is validated as the Responses reply record; when
  validation fails it is built without validation (debug log "Error constructing ResponsesAPIResponse: ..."). The processed response
  headers go into additional_headers and the raw headers into headers of the hidden params.


  Retrieve. transform_get_response_api_request returns the URL {api_base}/{encoded id} with the id encoded by B171's
  encode_url_path_segment (field name response_id), and an empty body. The api_base argument is already the full responses URL.


  Provider selection. utils.py L9201 returns ManusResponsesAPIConfig for provider manus in the native Responses selector (B2202 lists it, B1440 consults it first). This task adds that manus arm and builds the config value the arm returns. The get_llm_provider defaults for manus (MANUS_API_BASE with default https://api.manus.im, MANUS_API_KEY; get_llm_provider_logic.py L922-L925) are already merged by B211 in betterlite-models, so this task does not rebuild them.
