id: B699
title: Azure hosted managed-identity protocols
description: >-
  Implement the four hosted managed-identity protocols reached through azure-identity 1.25.2/MSAL 1.37.0 from LiteLLM
  uv.lock. B676 owns outer selection/IMDS and B2213 owns Arc challenge/file handling; call those lower helpers directly.
  Do not port the unused legacy SDK _get_client_args factories.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Named case contracts: app_service_header: GET IDENTITY_ENDPOINT with api-version=2019-08-01, resource, optional
  client_id and headers X-IDENTITY-HEADER: {IDENTITY_HEADER}, Metadata: true. Truthy access_token/expires_on convert
  expiry epoch with int; missing fields yield invalid_scope and {statusCode}, {message}; SDK failure uses App Service
  managed identity configuration not found in environment. Token request error: ({error}) {description}. cloud_shell_no_client_id:
  POST MSI_ENDPOINT as application/x-www-form-urlencoded resource with Metadata: true, no api-version. A truthy
  client_id raises ValueError client_id should not be set for cloud shell managed identity. directly; inside DefaultAzureCredential
  the SDK skips this guard. Preserve that distinction and reject object/resource identity config only when actually
  supplied. service_fabric_thumbprint: GET IDENTITY_ENDPOINT with api-version=2019-07-01-preview, resource and Secret:
  {IDENTITY_HEADER}. IDENTITY_SERVER_THUMBPRINT selects the host but the active MSAL transport ignores its value.
  Preserve normal TLS verification; the unused legacy connection_verify=False path is not called. token_sha256_to_refresh/xms_cc
  are omitted for the ordinary no-challenge request. service_fabric_client_id_rejected: The public ServiceFabricCredential
  rejects truthy client_id or identity_config with ClientAuthenticationError and exact SERVICE_FABRIC_ERROR_MESSAGE
  before MSAL. Do not copy the inner MSAL behavior that ignores identity. azure_ml_numeric_expiry: GET MSI_ENDPOINT
  with api-version=2017-09-01, resource, optional clientid (not client_id), secret: {MSI_SECRET}. The active MSAL
  path converts expires_on with int; integer/numeric string work, Linux/Windows date strings fail. Missing token/expiry
  yields invalid_scope and the payload string, then Azure ML managed identity configuration not found in environment.
  prefix. cloud_shell_reply: The non-MSAL ManagedIdentityClient requires a mapping with access_token and either
  expiry field. Empty mapping raises No token received.; missing fields raises Unexpected response "{content}" with
  token redacted as ****. Truthy expires_on wins, otherwise request_time+int(expires_in); token_type defaults Bearer.
  Duration>=7200 supplies refresh_in=duration//2 only when absent; explicit refresh_in controls refresh_on. Final
  cache insertion indexes content["resource"]: missing resource raises KeyError after token validation, not a successful
  token; no inferred replacement resource. service_fabric_reply: Truthy access_token/expires_on require token_type
  (no Bearer default in MSAL), with expiry numeric-string allowed. Map SecretHeaderNotFound to unauthorized_client,
  ManagedIdentityNotFound to invalid_client, ArgumentNullOrEmpty to invalid_scope, other/missing codes to invalid_request;
  description is raw response text and outer unavailable prefix identifies Service Fabric. hosted_errors: Malformed
  JSON raises in App Service/Azure ML/Service Fabric; Arc uses B2213 invalid_request fallback. SDK wraps MSAL ManagedIdentityError
  as ClientAuthenticationError, while returned OAuth error records become CredentialUnavailableError. Do not flatten
  these categories or convert every HTTP400 into IMDS unavailable. hosted_inner_selection: Once a MSAL-backed credential
  is selected, inspect environment key presence in order Service Fabric, App Service, Azure ML, Arc, VM. This may
  differ from the truthy outer B676 selector when variables are present but empty; use the selected live path in
  captured fixtures.


  SERVICE_FABRIC_ERROR_MESSAGE is Specifying a client_id or identity_config is not supported by the Service Fabric
  managed identity environment. The managed identity configuration is determined by the Service Fabric cluster resource
  configuration. See https://aka.ms/servicefabricmi for more information. Read hosted environment settings from
  the lower betterlite-config records (all absent by default), without depending on upper B676 selector. B2213 supplies
  Arc and B673 shared token grant/error records; reuse B187 redaction for secret-bearing failures.


  Cloud Shell JSON parse failure becomes ClientAuthenticationError Failed to deserialize JSON from response when
  Content-Type starts application/json; otherwise CredentialUnavailableError Unexpected content type "{content_type}".
  Include both rows in cloud_shell_reply.


  Implement crates/betterlite-azure/src/azure_hosted_identity.rs with adjacent tests under azure_hosted_identity/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_hosted_identity_cases in betterlite-azure with these exact named cases (one per oracle
  file): app_service_header, cloud_shell_no_client_id, service_fabric_thumbprint, service_fabric_client_id_rejected,
  azure_ml_numeric_expiry, cloud_shell_reply, service_fabric_reply, hosted_errors, hosted_inner_selection. Each
  case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_hosted_identity* using HelperCase: kind:
  helper and the externally tagged azure_hosted_identity variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_hosted_identity that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_hosted_identity_token consumes hosted-identity JSON token response bytes and expires_on
  formats in crates/betterlite-azure/src/azure_hosted_identity.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-azure/fuzz/fuzz_targets/azure_hosted_identity.rs calling that exact production function, with
  new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_hosted_identity.
  The adjacent test replays_the_azure_hosted_identity_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_hosted_identity_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_hosted_identity_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 285 production lines, 265 behavior/config-test lines, 115 combined
  Rust/Python adapter lines, 60 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines. The production allowance includes 310 lines for the referenced
  SDK protocol that LiteLLM delegates.
