id: B699
title: Azure hosted managed-identity protocols
description: >-
  Implement App Service, Azure ML, Cloud Shell, Service Fabric and Azure Arc managed-identity HTTP protocol variants
  over B173; B676 owns selection and IMDS. Mirror the installed azure-identity request factories through captured
  SDK transport fixtures. App Service uses GET api-version=2019-08-01 and X-IDENTITY-HEADER; Azure ML uses GET 2017-09-01
  and secret with clientid; Cloud Shell uses POST resource with Metadata=true and rejects client_id. Service Fabric
  uses GET 2019-07-01-preview with Secret header and the pinned connection_verify=false behavior. Azure Arc uses
  GET 2020-06-01 and its operator-host challenge secret through an injected restricted reader, never an arbitrary
  request path.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  The pinned Service Fabric SDK requires IDENTITY_SERVER_THUMBPRINT to select the environment but does not validate
  it; it uses connection_verify=false and rejects a supplied client_id. The oracle fixture must preserve that behavior
  through the trusted provider HTTP policy, not invent thumbprint validation.


  Implement crates/betterlite-azure/src/azure_hosted_identity.rs with adjacent tests under azure_hosted_identity/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_hosted_identity in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_hosted_identity_cases in betterlite-azure with these exact named cases (one per oracle
  file): app_service_header, azure_ml_date_expiry, cloud_shell_no_client_id, service_fabric_thumbprint, azure_arc_challenge,
  service_fabric_client_id_rejected. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream
  request. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_hosted_identity* using HelperCase: kind:
  helper and the externally tagged azure_hosted_identity variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_hosted_identity that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_hosted_identity_token consumes hosted-identity JSON token response bytes and expires_on
  formats in crates/betterlite-azure/src/azure_hosted_identity.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-azure/fuzz/fuzz_targets/azure_hosted_identity.rs calling that exact production function, with
  new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_hosted_identity.
  The adjacent test replays_the_azure_hosted_identity_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone azure_hosted_identity_credential_identity_isolation in betterlite-azure for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone azure_hosted_identity_secret_safe_failure in betterlite-azure for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 345 production lines, 129 behavior/config-test lines, 99 combined
  Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 668 planned, 675 maximum changed lines. The production allowance includes 310 lines for the referenced
  SDK protocol that LiteLLM delegates.
