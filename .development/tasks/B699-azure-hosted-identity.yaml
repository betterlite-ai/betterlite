pitfalls:
- 'The oracle helper for this task is pre-registered as azure_hosted_identity in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/hosted_identity.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_hosted_identity.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The retained Azure ML _parse_expires_on helper has no caller in this SDK path; date-string success fixtures would
  test dead code.
- The live Service Fabric request has neither thumbprint pinning nor the old TLS verification bypass.
