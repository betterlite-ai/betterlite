checks:
  optional:
  - mutants
  commands:
  - id: case-app-service-header
    why: The app-service-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_cases::case_[0-9]+_app_service_header$/)'
  - id: case-azure-ml-date-expiry
    why: The azure-ml-date-expiry behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_cases::case_[0-9]+_azure_ml_date_expiry$/)'
  - id: case-cloud-shell-no-client-id
    why: The cloud-shell-no-client-id behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_cases::case_[0-9]+_cloud_shell_no_client_id$/)'
  - id: case-service-fabric-thumbprint
    why: The service-fabric-thumbprint behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_cases::case_[0-9]+_service_fabric_thumbprint$/)'
  - id: case-azure-arc-challenge
    why: The azure-arc-challenge behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_cases::case_[0-9]+_azure_arc_challenge$/)'
  - id: case-service-fabric-client-id-rejected
    why: The service-fabric-client-id-rejected behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_cases::case_[0-9]+_service_fabric_client_id_rejected$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_hosted_identity.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_hosted_identity*")"
      && grep -lq 'azure_hosted_identity' tools/oracle/fuzz/corpus/helper_case/azure_hosted_identity* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_hosted_identity$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_hosted_identity)"
      && grep -q 'decode_hosted_identity_token' crates/betterlite-azure/fuzz/fuzz_targets/azure_hosted_identity.rs
      && cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_hosted_identity_corpus$/)'
  - id: credential-identity-isolation
    why: The credential identity isolation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_credential_identity_isolation$/)'
  - id: secret-safe-failure
    why: The secret safe failure invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::azure_hosted_identity_secret_safe_failure$/)'
