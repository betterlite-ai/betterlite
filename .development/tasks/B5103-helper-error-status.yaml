deviations: []
out_of_scope:
- The provider error mapper helpers (provider_error.py, aws_errors.py, azure_openrouter_errors.py, native_errors_a.py, native_errors_b.py, openai_like_errors.py, vertex_errors.py, anthropic_replicate_errors.py) return the mapped exception as a value. B5102 covers their status, and none of them raises through dispatch.py's except block.
- type, param and code on the helper wire stay None, for the reasons in the description.
- Adapters that catch a status exception and return it as a value keep their output (b3779.py, bedrock_request_policy.py, azure_content_policy.py, bedrock_services_file_content.py, provider_base_helpers.py, database_faults.py, messages_errors.py, error_class.py, error_facts.py, openai_base_config.py).
- tools/oracle/src/helpers/bedrock/request_policy.rs already writes the BedrockError status.
- httpx.HTTPStatusError has no status_code attribute, so dispatch.py writes None for it. blog_feed's fetch_rss_feed could raise one, but no case gives it an error status.
- A status method on product error types, and B3771's GraySwanGuardrailAPIError::status_code() answering 400 for every variant. The helper maps the variants itself.
- HTTP cases. Their status already goes through the proxy and belongs to each feature's own task.
pitfalls:
- Editing dispatch.py changes the answer cache key of every helper case (KEYED_FILES in tools/oracle/src/helpers/answers.rs), so the first oracle run asks LiteLLM again for all of them and takes long.
- bool is a subclass of int in Python, so isinstance(value, int) alone lets True through as status 1.
- getattr returns Any and reportAny is an error here, so declare the value as object before narrowing it.
- A stale /error/message ignore fails a case before its status is compared; remove the entry before reading a status difference.
- GuardrailRaisedException gets its 400 from the constructor default, so deepkeep.py and generic_guardrail_api.py never write status_code=400.
- Gray Swan's 408 comes from litellm.Timeout inside the HTTP handler, not from GraySwanGuardrailAPIError and not from B3771's status_code().
- The proxy answers 500 for an exception with no status, but the helper wire keeps None for it on both sides; never write 500 for a status-less exception.
