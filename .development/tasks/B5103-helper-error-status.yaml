dod:
- text: >-
    dispatch.py writes /error/status from the exception's status_code when it is an int and not a bool, and None
    otherwise. type, param and code stay None, and ruff and basedpyright pass. python_failures_carry_the_exception_status
    proves 400 for the ollama role call and None for the url_path ValueError.
  proof:
  - python-status
  - helper-python
- text: >-
    Each native helper named in the description writes the status of the exception it mirrors and None where that
    exception has none. lasso_failures_carry_the_python_status, deepkeep_failures_carry_the_python_status,
    role_error_carries_status_400, factory_role_error_carries_status_400, provider_error_carries_its_status,
    grayswan_failures_carry_the_python_status and generic_block_carries_status_400 prove it.
  proof:
  - native-status
- text: >-
    The status cases match LiteLLM: lasso/block-action-raises-400, deepkeep/blocked-action,
    bedrock-other-image-models/image-provider-error, builtin-prompts/ollama-role, prompt-template/factory-ollama-role,
    grayswan/violation-block-action, grayswan/error-timeout, grayswan/error-fail-open-false and
    generic_guardrail_api/blocked-verdict. So do the None cases lasso/api-429-rate-limit,
    deepkeep/unreachable-fail-closed, grayswan/error-connection-failure and generic_guardrail_api/error-5xx-fail-closed.
  proof:
  - oracle
- text: >-
    helper_comparison_skips_every_warning_message strips the message of both warnings on each side, and
    helper_comparison_names_the_differing_warning_subject asserts the pointer /warnings/1/subject.
    helper_comparison_skips_warning_messages is gone.
  proof:
  - warning-comparison
- text: >-
    No helper case ignores /error/class or /error/message in block or JSON style, and the thirteen cleaned cases match
    LiteLLM.
  proof:
  - no-skipped-ignores
  - oracle
checks:
  optional: []
  commands:
  - id: python-status
    why: dispatch.py still writes None for a Python exception that carries a status
    run: |-
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(=helpers::tests::python_failures_carry_the_exception_status)'
  - id: helper-python
    why: dispatch.py fails ruff or basedpyright
    run: |-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: native-status
    why: a native helper still writes None where the Python exception carries a status
    run: |-
      list=$(cargo nextest list --locked -p betterlite-oracle -E 'test(/^helpers::(guardrails|prompts|bedrock)::/)' --message-format oneline) && for name in guardrails::b3778::tests::lasso_failures_carry_the_python_status guardrails::b3767::tests::deepkeep_failures_carry_the_python_status guardrails::b3771::tests::grayswan_failures_carry_the_python_status guardrails::b3771::tests::generic_block_carries_status_400 prompts::builtin_prompts::tests::role_error_carries_status_400 prompts::prompt_factory::tests::factory_role_error_carries_status_400 bedrock::other_image_models::tests::provider_error_carries_its_status; do grep -q "helpers::$name$" <<< "$list" || { echo "missing test $name"; exit 1; }; done && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::(guardrails::(b3778|b3767|b3771)|prompts::(builtin_prompts|prompt_factory)|bedrock::other_image_models)::tests::/)'
  - id: warning-comparison
    why: a warning message past index 0 is still compared, or a subject difference names the wrong pointer
    run: |-
      ! grep -q 'fn helper_comparison_skips_warning_messages' tools/oracle/src/tests.rs && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(=tests::helper_comparison_skips_every_warning_message)' && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(=tests::helper_comparison_names_the_differing_warning_subject)'
  - id: no-skipped-ignores
    why: a helper case still ignores /error/class or /error/message, in block or JSON style
    run: |-
      test -z "$(grep -rlE 'pointer"?: "?/error/(class|message)([^a-z_/]|$)' tools/oracle/cases | xargs -r grep -lE '^kind: helper|"kind": "helper"')" && grep -qE 'pointer"?: "?/error/(class|message)([^a-z_/]|$)' tools/oracle/cases/chat/upstream-429.yaml
