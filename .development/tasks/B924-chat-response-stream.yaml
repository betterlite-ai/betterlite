id: B924
title: Chat response stream
description: >-
  Compose the tool and message transition stages into the incremental async stream used by responses-chat-call.
  Preserve streamed output IDs in the completed response, stop on terminal events, and close upstream on cancellation;
  synchronous SDK iteration later wraps this same state machine.


  Implement crates/betterlite-core/src/api/chat_response_stream.rs. Use ChatResponseStreamInput and ChatResponseStreamResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions text_to_completed_order, tool_only_stream, empty_choices_usage, stream_cancel_drops_upstream,
  interleaved_reasoning_text under api::chat_response_stream::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ChatResponseStream in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {chat_response_stream: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.common_done_event_logic
  (L900-L930); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._ensure_output_item_for_chunk
  (L932-L974); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.__anext__
  (L976-L1079); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.__iter__
  (L1081-L1082); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator.__next__
  (L1084-L1139); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._transform_chat_completion_chunk_to_response_api_chunk
  (L1141-L1232); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._get_delta_string_from_streaming_choices
  (L1234-L1246); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._output_with_streamed_item_ids
  (L1248-L1264); litellm/responses/litellm_completion_transformation/streaming_iterator.py: LiteLLMCompletionStreamingIterator._emit_response_completed_event
  (L1266-L1291). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 296 owned nonblank/non-comment/non-docstring Python lines (312 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 316 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 566 total within the 570-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B916 (Responses chat call), B922 (Chat
  response stream tools), B923 (Chat response stream items), B1087 (Api boundaries), B1115 (Responses output detail
  conversion), B914 (Responses chat output). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
