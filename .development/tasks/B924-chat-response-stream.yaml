id: B924
title: Drive chat-backed Responses streams over provider HTTP
description: >-
  Implement api::chat_response_stream for full sync/async iteration, priming, chunk
  translation and terminal snapshot assembly. Move all priming methods L441-L485 from
  B923 here; do not split the two iteration functions or their shared finalization.
  Compose B922 state/tool queues, B923 item builders, B914 result assembly and B1115
  annotations. This driver owns stream sequencing, not a second SSE parser; B005 handles
  network framing and B004 decodes chat chunks.

  Add B2401 sdk_http operation chat_response_stream. Both sides call the real OpenAI chat
  executor against the mock with stream=true and wrap its returned stream in this driver;
  Python constructs LiteLLMCompletionStreamingIterator directly, without importing B916.
  Capture the POST and emitted events for each mode, normalizing only injected UUID/time
  and B904's encoded identity projection. Use unit tests for impossible upstream null
  chunks and internal queue states. Count 354 nonblank/non-comment lines; budget 330
  implementation, 180 tests, 135 HTTP cases, 100 adapters and 25 wiring: 770 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/chat_response_stream.rs
  - crates/betterlite-core/src/api/chat_response_stream/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/chat_response_stream.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/chat_response_stream.py
  - tools/oracle/cases/sdk-http/chat-response-stream/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/streaming_iterator.py#L441-L485
  why: Priming pulls and buffers the first nonnull provider chunk before advertising a response ID.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/streaming_iterator.py#L900-L1291
  why: Whole iteration and translation methods expose async-only reasoning closure, priority and completed-response latching.
dod:
- text: >-
    primed_identity sends one POST /v1/chat/completions,model=gpt-4o-mini,messages=[user hi],
    stream=true,Bearer sk-test. Mock first chunk id=chat_a is read before response.created;
    created,in_progress and completed all decode to chat_a, and that first chunk's text
    is emitted exactly once. A nonempty string first ID is adopted; no usable ID uses
    B923's resp_<UUID>. Null priming chunks are skipped and EOF is latched without another
    read. Priming runs once, buffered take clears the slot, and later chunk IDs do not win.
  proof: [driver-tests, oracle, driver-adapter]
- text: >-
    text_stream_order with delta=hi then finish=stop yields created,in_progress,message
    added,content part added,text delta hi,text.done,content_part.done,message.done,
    response.completed in that order, preserving B923's sequence defaults/gaps. Pending
    response events precede pending tool events and both precede another provider read.
    Only first-choice text is used; an initial role-only choice still creates a message
    shell, while choices=[] does not. All chunks are snapshotted before early event returns,
    so a finish_reason=content_filter on the first content chunk reaches the final snapshot.
  proof: [driver-tests, oracle, driver-adapter]
- text: >-
    reasoning_transition emits a reasoning item at output_index=0 for truthy reasoning
    text or any signed thinking block. On async text/tool/finish transition, join accumulated
    reasoning fragments without separators and emit summary_text.done,summary_part.done,
    reasoning item.done before the new content event, each with its own incremented sequence.
    The sync iterator does not run this reasoning-close block and must not gain those events.
    A tool-first chunk creates no message shell; the final snapshot still includes B914
    reasoning/tools and replaces only the first typed message/reasoning IDs with streamed IDs.
  proof: [driver-tests, oracle, driver-adapter]
- text: >-
    chunk_priority chooses reasoning before text before tool calls before pending annotations
    before older pending tools. A chunk containing reasoning=x,text=y emits only reasoning
    now, while the final B914 assembly still sees the full snapshot. Text="" emits no delta.
    Only the first nonempty annotation batch is converted with B1115 and queued, with
    output_index=message index,content_index=0,annotation_index starting 0; subsequent batches
    are ignored. Annotation events need a later chunk with no higher-priority data to drain;
    EOF does not add a new annotation-drain pass. Pin this omission in the terminal snapshot comparison.
  proof: [driver-tests, oracle, driver-adapter]
- text: >-
    final_tools_and_snapshot reserves hosted-search indices before conversion and merges
    chunk provider fields then first delta provider fields, so delta values win. At EOF,
    assemble via B923,queue B922 missing tool done events,then message done events,then
    response.completed. Latch completed_response for later ownership hooks. The event type
    remains response.completed even if its response.status=incomplete from length/content_filter.
    Cached response ID overrides assembly ID before B904 encoding; request_input and request
    options reach B914. Null assembly ends iteration without inventing a completed response.
  proof: [driver-tests, oracle, driver-adapter]
- text: >-
    transport_failure_and_split uses provider JSON split across arbitrary byte reads and
    verifies identical text/events after B005 framing. A provider 401 before the first chunk
    returns B011 AuthenticationError,status=401 with no created event; a transport error
    after text sets finished=true and propagates the same mapped error, then later polls
    stop. Async skips null chunks after priming; sync does not have that guard and its
    invalid-chunk access fails. Releasing a cancelled driver releases the underlying
    B005 stream without retrying or producing a false terminal success.
  proof: [driver-tests, oracle, driver-adapter]
checks:
  optional: []
  commands:
  - id: driver-tests
    why: stream priming, event order or terminal state is missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream::/)'
  - id: driver-adapter
    why: stream-pump behavior has only fabricated helper inputs instead of provider traffic
    run: test -f tools/oracle/sdk_http/chat_response_stream.py && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/chat-response-stream)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/sdk-http/chat-response-stream/primed-identity.yaml
- tools/oracle/cases/sdk-http/chat-response-stream/text-stream-order.yaml
- tools/oracle/cases/sdk-http/chat-response-stream/reasoning-transition.yaml
- tools/oracle/cases/sdk-http/chat-response-stream/chunk-priority.yaml
- tools/oracle/cases/sdk-http/chat-response-stream/final-tools-and-snapshot.yaml
- tools/oracle/cases/sdk-http/chat-response-stream/transport-failure-and-split.yaml
deviations: []
out_of_scope:
- B922 owns L56-L439, B923 owns live methods L487-L898; create_output_item_added_event L565-L584 has no caller at the pin.
- B004/B005 own chat provider HTTP, decoding and cancellation; B916 is a caller of this driver and must not be a dependency.
- B914 assembles final Responses output and B904 encodes response identity through B923.
pitfalls:
- response.created waits for the first upstream chunk, so provider errors can happen before any event is emitted.
- Only async iteration closes a reasoning segment before later text or tools.
- Pending annotation events are not drained merely because the provider reaches EOF.
review_level: standard
budget:
  max_changed_lines: 770
  max_new_expects: 1
