  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream::/)
      - test(/::replays_corpus$/)'
  - id: case-text-to-completed-order
    why: the text-to-completed-order behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream::tests::text_to_completed_order($|::)/)'
  - id: case-tool-only-stream
    why: the tool-only-stream behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::chat_response_stream::tests::tool_only_stream($|::)/)'
  - id: case-empty-choices-usage
