id: B10217
title: The Sync and Async client class copies in bedrock, vertex, soniox and bfl take core's ClientKind and SuppliedClient
description: >-
  Four more handler families spell the httpx client class `Sync, Async` instead of core's `Sync, Asynchronous`, and three of them pair it with a borrowed transport in a struct of their own. They mean what core's `ClientKind` and `SuppliedClient<'client, Client>` in crates/betterlite-core/src/api/vector_store_http_write/service.rs (L30-L34 and L51-L54) mean: the class LiteLLM's isinstance check tests on a supplied client, and that client. betterlite-bedrock and betterlite-vertex already depend on betterlite-core, and soniox and bfl are core modules, so all of them take the core home with no new crate edge, and none of their files is in B10200's or B10216's scope, so this lands without waiting for either. It is a refactor: what each family sends, logs and raises stays the same.


  The copies. betterlite-bedrock's bedrock_embedding_io/transport.rs L97-L107, image_call/transport.rs L49-L59 and rerank/transport.rs L59-L69 each declare `ClientKind { Sync, Async }` with its one-line comment and `SuppliedClient<'client, Client> { kind, transport: &'client Client }`. betterlite-vertex's gemini_http/call.rs L30-L34 declares the same ClientKind; its `SuppliedClient` (L36-L39) holds an owned `Arc<dyn GeminiPost>`, which the core home cannot hold, so that struct stays and only its `kind` field takes the core type. Core's soniox/pipeline/client.rs is nothing but the two copies (L1-L11), so the file goes with `pub mod client;` in soniox/pipeline.rs L2, and pipeline.rs L18 imports the home. bfl's generation_call/submit.rs L53-L63 calls them `TransportKind` and `SuppliedTransport<'client, T>`, and both take the home's names.


  The variant. Every `ClientKind::Async` and `TransportKind::Async` in these families and their users becomes `ClientKind::Asynchronous`, and `TransportKind::Sync` becomes `ClientKind::Sync`. The users: bedrock's bedrock_embedding_io (tests/cases.rs, tests/secrets.rs), embedding_call (embedding_call.rs L28, execute.rs L17, execute/bridge.rs L20 and its tests), image_call (execute.rs and its tests), image_edits (execute.rs L10 and its tests), rerank (execute.rs and its tests) and converse_call, which takes rerank's ClientKind (converse_call.rs L31, buffered.rs L22, streaming.rs L17, transport.rs L5, tests.rs, tests/fixtures/transport.rs); betterlite-provider's bedrock_image_dispatch (call.rs L4, test_support.rs L9 and its tests); vertex's gemini_http (call.rs and its tests) and gemini_call (sync_call.rs L14, tests/support.rs, tests/ordered_effects.rs); core's soniox pipeline (pipeline.rs L75-L77, tests/selection.rs) and bfl (generation_call.rs, edit_call.rs L27 and both modules' tests); and the oracle helpers that build these clients: tools/oracle/src/helpers/bedrock embedding_io (http.rs, transport.rs), other_embedding_call/fixtures/harness.rs, other_image_call (other_image_call.rs, fixtures.rs, handlers.rs), other_image_edits (driver.rs, fixtures/harness.rs, fixtures/support.rs) and other_rerank/driver.rs, and helpers/core_ops bfl_edit_call/job.rs, bfl_jobs/job.rs and soniox_pipeline/perform.rs. Each imports `ClientKind` and `SuppliedClient` from betterlite-core's vector_store_http_write::service, as `crate::api::vector_store_http_write::service` inside core.


  Tests. No new test: the families' tests already pick the supplied client by class and rebuild the other class, and they pass with only the import and the variant name changed.


  What users see: nothing.
