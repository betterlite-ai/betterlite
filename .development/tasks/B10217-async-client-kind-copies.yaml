references: []
dod:
  - text: Bedrock's three transports, vertex's gemini_http, soniox's pipeline and bfl's submit declare no client class enum or supplied client pair of their own, and soniox's client.rs is gone.
    proof: [async-kind-copies]
  - text: Every user names core's ClientKind with the Asynchronous variant and core's SuppliedClient, and the families' tests in bedrock, provider, vertex and core pass unchanged.
    proof: [async-variants, bedrock-kind-tests, bedrock-dispatch-kind-tests, vertex-kind-tests, core-kind-tests]
checks:
  optional: []
  commands:
    - id: async-kind-copies
      why: a family still declares its own Sync and Async client class or its own supplied client pair
      run: |-
        test -z "$(grep -lE '^pub (enum (ClientKind|TransportKind)|struct (SuppliedClient|SuppliedTransport))\b' crates/betterlite-bedrock/src/bedrock_embedding_io/transport.rs crates/betterlite-bedrock/src/image_call/transport.rs crates/betterlite-bedrock/src/rerank/transport.rs crates/betterlite-core/src/api/bfl/generation_call/submit.rs)" &&
        test -z "$(grep -l '^pub enum ClientKind' crates/betterlite-vertex/src/gemini_http/call.rs)" &&
        test ! -e crates/betterlite-core/src/api/soniox/pipeline/client.rs &&
        test -z "$(grep -rnwE 'TransportKind|SuppliedTransport' crates/betterlite-core/src/api/bfl tools/oracle/src/helpers/core_ops/bfl_edit_call tools/oracle/src/helpers/core_ops/bfl_jobs --include=*.rs)"
    - id: async-variants
      why: a user still spells the async client class Async, so it names a deleted enum
      run: |-
        test -z "$(grep -rnE '\b(ClientKind|TransportKind)::Async\b' crates/betterlite-bedrock/src crates/betterlite-provider/src/bedrock_image_dispatch crates/betterlite-vertex/src/gemini_http crates/betterlite-vertex/src/gemini_call crates/betterlite-core/src/api/soniox crates/betterlite-core/src/api/bfl tools/oracle/src/helpers/bedrock tools/oracle/src/helpers/core_ops/bfl_edit_call tools/oracle/src/helpers/core_ops/bfl_jobs tools/oracle/src/helpers/core_ops/soniox_pipeline --include=*.rs)"
    - id: bedrock-kind-tests
      why: a bedrock family no longer reuses a supplied client of the matching class or rebuilds the other one
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^(bedrock_embedding_io|image_call|rerank|converse_call|embedding_call|image_edits)::/) - test(/replays_/)'
    - id: bedrock-dispatch-kind-tests
      why: the provider's Bedrock image dispatch no longer hands its supplied client to bedrock's image call
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^bedrock_image_dispatch::/)'
    - id: vertex-kind-tests
      why: the Gemini HTTP call no longer picks the supplied poster by class
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^(gemini_http|gemini_call)::/) - test(/replays_/)'
    - id: core-kind-tests
      why: soniox's pipeline or bfl's jobs no longer pick the supplied transport by class
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::(soniox::pipeline|bfl::(generation_call|edit_call))::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "B10216's families in core and provider, which already spell the class `Asynchronous` and also share the request and transport."
  - "The same class in crates below betterlite-core, which cannot import this home: betterlite-anthropic's chat_call/transport.rs (ClientKind and SuppliedChatClient) and betterlite-foundry's embeddings/call.rs (EmbeddingMode and its SuppliedClient with `mode` and `client`)."
  - "vertex gemini_http's own `SuppliedClient` with an `Arc<dyn GeminiPost>` transport, and gemma_call's four-way `SuppliedClientKind` (gemma_call/plan.rs L27), which tells HTTPHandler from a raw httpx client."
pitfalls:
  - "converse_call never declares a ClientKind: it borrows rerank::transport's, so it breaks as soon as rerank's enum goes, and its six files need the core import too."
  - "soniox's pipeline.rs L18 imports `self::client::{ClientKind, SuppliedClient}`; once client.rs and `pub mod client;` are gone that line reads `crate::api::vector_store_http_write::service::{ClientKind, SuppliedClient}`."
  - "vertex gemini_http/call.rs keeps a struct named SuppliedClient, so it imports only ClientKind from core; importing core's SuppliedClient there clashes with the local name."
  - "betterlite-provider's bedrock_image_dispatch and the oracle's bedrock helpers reach the types through `betterlite_bedrock::image_call::transport` and its siblings today; they import betterlite_core's path directly, since a `pub use` left in bedrock would be one more copy of the name."
review_level: standard
budget:
  max_changed_lines: 450
  max_new_expects: 0
