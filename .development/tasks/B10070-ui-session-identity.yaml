deviations:
  - what: The resolver reads the user through the UiSessionTeams port instead of importing proxy_server's prisma_client and user_api_key_cache.
    why: betterlite has no module-level state; the port's UserLookup implementation runs the same get_user_object read, so the returned list is the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/ui_session_utils.py#L53-L73

out_of_scope:
  - "clone_user_api_key_auth_with_team, admitted_user_context, acting_user_auth, build_effective_auth_contexts, can_access_mcp_server, _restricts_mcp, is_keyless_mcp_subject, toolset_grant_contexts, _own_toolset_ids, _inherited_toolset_ids, _context_toolset_ids and granted_toolset_ids: B4672, which calls the two functions here."
  - "get_user_object: B736. This task calls it through the UserLookup implementation and does not copy its cache or database rules."
  - "Callers: reject_disallowed_mcp_client (B8724), _vector_store_auth_contexts (B1060), the connected_app_view flag in mcp_management_endpoints.py (B4720) and the MCP dashboard contexts (B4672)."

pitfalls:
  - The session check runs before the database check, so a plain virtual key never reaches has_database or user_teams and never logs the debug line.
  - user_id "" is not a session credential even with the dashboard team id, since LiteLLM tests bool(user_id).
  - resolve_ui_session_team_ids keeps "litellm-dashboard" when the user's row lists it, while B4669's user_team_ids drops it; do not reuse that read here.
  - A missing user is an error from get_user_object (LiteLLM raises UserNotFoundError, B736 returns UserLookupError), so it takes the warning branch; the None branch only covers a lookup without a user_id.
  - check_db_only follows the auth's requires_fresh_policy, so a fresh-policy session skips the user cache; a hard-coded false would serve a cached team list after a membership change.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
