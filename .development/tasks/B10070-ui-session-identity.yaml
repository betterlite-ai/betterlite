id: B10070
title: UI session credential and its team ids
description: >-
  A dashboard session token is a key whose team_id is "litellm-dashboard" and that carries the signed-in user's id. Three callers ask whether a request carries one: the MCP client allowlist in server.py lets it through (B8724), the vector store access checks widen it to the user's real teams (B1060), and the MCP dashboard contexts build on it (B4672). This task builds the two functions they share from ui_session_utils.py, is_ui_session_credential and resolve_ui_session_team_ids, and nothing else from that file. B4672 builds the rest of ui_session_utils.py and calls these two.


  Layout. Module ui_session_identity in betterlite-auth: crates/betterlite-auth/src/ui_session_identity.rs with its tests in ui_session_identity/tests.rs, and the UserLookup implementation of the port in ui_session_identity/user_lookup.rs with its tests in ui_session_identity/user_lookup/tests.rs. The module file is an empty stub that lib.rs declares. The code lives in betterlite-auth because UserAPIKeyAuth keeps team_id, user_id and requires_fresh_policy pub(crate) there, so the functions read those fields directly and no public reader is added. It sits outside B4672's session_auth module on purpose, so the two tasks never share files. betterlite-mcp (B4672), betterlite-core (B1060) and betterlite-server (B8724) already depend on betterlite-auth; no Cargo.toml changes.


  1. UI_SESSION_TOKEN_TEAM_ID is the pub constant "litellm-dashboard" (LiteLLM's constant of that name; no env var, no config key). is_ui_session_credential(auth: &UserAPIKeyAuth) -> bool is true when team_id equals that constant and user_id is set and not empty.


  2. UiSessionTeams is the port for the one read the resolver makes, an async_trait with Send + Sync like UserCache in auth_user_lookup. has_database(&self) -> bool is sync and answers LiteLLM's `prisma_client is None` question. user_teams(&self, user_id: &str, fresh: bool) -> Result<Option<Vec<String>>, UserLookupError> returns the user's teams list, or None when there is no user. The production implementation is for B736's UserLookup: has_database is whether its store is set, and user_teams calls get_user_object with a UserLookupRequest whose user_id is the given id, sso_user_id and user_email are None, user_id_upsert is false and check_db_only is Some(fresh), then maps the user to its teams. A lookup error comes back unchanged.


  3. resolve_ui_session_team_ids<T>(auth: &UserAPIKeyAuth, teams: &T) -> Vec<String> where T: UiSessionTeams + ?Sized, async. A credential that is not a session credential gives an empty list before any port call. has_database false logs at debug "Cannot resolve UI session team ids without DB access" and gives an empty list without calling user_teams. Otherwise it calls user_teams with the auth's user_id and its requires_fresh_policy as fresh. An Err logs the warning "Failed to load teams for UI session token user." with the error as a field and gives an empty list; Ok(None) and an empty teams list give an empty list. Otherwise the result is the teams in first-seen order, each once, with empty strings dropped. The dashboard team id stays in the result when the user's row lists it.


  B1060 and B4672 take the port as a generic parameter and script it in their tests; route wiring passes the UserLookup.


  Oracle. No route reaches this code yet, so the helper operation b10070 compares both functions with LiteLLM. Its input names the function and gives the auth's team_id, user_id and requires_fresh_policy; for the resolver it also scripts whether a database exists and what the user lookup answers (a teams list, no user, or a failure). The Rust side builds the auth with UserAPIKeyAuth::construct from a dict and runs a scripted UiSessionTeams that records whether user_teams ran and with which fresh flag. The Python adapter builds LiteLLM's UserAPIKeyAuth and, for the resolver, patches litellm.proxy.proxy_server.prisma_client (None, or a stand-in object) and litellm.proxy.auth.auth_checks.get_user_object (the function imports both at call time, so the module attributes are what it reads) with a stand-in that returns a LiteLLM_UserTable carrying the scripted teams, returns None or raises, and records its check_db_only. The answer is the boolean or the list, plus whether the lookup ran and its fresh flag.

