dod:
  - text: >-
      is_ui_session_credential is true only for team_id "litellm-dashboard" with a non-empty user_id,
      and false for an empty or missing user_id, another team id or no team id.
    proof: [identity-tests, helper-case-corpus, helper-python, helper-tests, oracle]
  - text: >-
      resolve_ui_session_team_ids returns an empty list for a non-session credential without calling the port, for no database without calling user_teams,
      and for a lookup error, no user or no teams; otherwise it returns the teams once each in first-seen order without empty strings, keeps "litellm-dashboard",
      and reads with the auth's requires_fresh_policy as fresh.
    proof: [identity-tests, helper-case-corpus, helper-python, helper-tests, oracle]
  - text: >-
      The UserLookup implementation reports has_database from its store, asks get_user_object with user_id_upsert false and check_db_only set to fresh,
      maps the user to its teams and passes a lookup error through.
    proof: [lookup-teams-tests]
  - text: New helper cases cover both functions, parse through the shared helper case parser and give LiteLLM's answers.
    proof: [helper-case-corpus, helper-python, helper-tests, oracle]

checks:
  optional: []
  commands:
    - id: identity-tests
      why: the session predicate or the team id resolution is missing or differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^ui_session_identity::tests::/)'
    - id: lookup-teams-tests
      why: the production port does not read the user through B736's lookup with the right flags
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^ui_session_identity::user_lookup::tests::/)'
    - id: helper-tests
      why: the b10070 adapter does not call the production predicate and resolver
      run: cargo nextest run --locked -p betterlite-oracle-auth --no-tests=fail -E 'test(/^b10070::/) - test(/replays_the_/)'
    - id: helper-python
      why: tools/oracle/helpers/b10070.py is missing or fails ruff or basedpyright
      run: test -f tools/oracle/helpers/b10070.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added ui-session-identity helper case reaches the shared parser
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/ui-session-identity-*')" && grep -qE '^[[:space:]]+b10070:' tools/oracle/fuzz/corpus/helper_case/ui-session-identity-* && cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-auth --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

