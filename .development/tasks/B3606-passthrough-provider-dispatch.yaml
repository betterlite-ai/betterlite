deviations:
  - what: The handlers are reached through a ProviderLogHandlers struct of trait objects, and a handler failure is an Err returned from normalize_llm_passthrough_logging_payload.
    why: Rust has no exceptions and tests need fakes; the error reaches B3607 at the same point where LiteLLM's exception would.
  - what: The module lives in betterlite-server as free functions and a ProviderLogDispatcher struct, not as methods on PassThroughEndpointLogging in betterlite-logging.
    why: The leaf handlers sit in crates that depend on betterlite-logging, so the logging crate cannot call them without a cycle.
  - what: Handlers return typed outcomes, so LiteLLM's `["result"]` and `["kwargs"]` dict reads become fields.
    why: The declared TypedDict return type is the contract; a handler that omits a key is a type error in Rust.
out_of_scope:
  - "pass_through_async_success_handler (success_handler.py:412-517), its early returns for TinyFish, AssemblyAI, Langfuse and Transcribe job starts, the StandardPassThroughResponseObject fallback and _set_cost_per_request wiring belong to B3607."
  - "PassThroughEndpointLogging's constructor, route tables, _handle_logging, _safe_response_text and the predicates that need no provider handler (anthropic, cohere, assemblyai, comprehend medical, azure speech, transcribe, typesafe, openrouter decisions, langfuse, vertex live, cursor) belong to B3605; this task calls them."
  - "The provider handlers themselves, their cost math and their logging payloads belong to the leaf tasks named in the description."
  - "The AssemblyAI handler is not part of the elif chain (pass_through_async_success_handler calls it before this step); B3607 owns that call and B3647 the handler."
  - "The streaming counterpart (_route_streaming_logging_to_handler) belongs to B3608."
pitfalls:
  - "The chain order is part of the behavior: Gemini is tested before Vertex, so a Vertex-style route sent with custom_llm_provider 'gemini' goes to the Gemini handler, while the same route with another provider goes to Vertex."
  - "The OpenAI branch needs is_openai_route and is_supported_openai_endpoint together; an OpenAI host with an unsupported path (a files route, say) is not logged by the OpenAI handler and falls through to the later branches, ending with no response object."
  - "is_vertex_route tests ':' plus the method name as a substring of the whole route, but the batchPredictionJobs resource is tested without the colon."
  - "Transcribe sits before Typesafe and after AzureSpeech, and AzureSpeech and Transcribe are picked by custom_llm_provider alone, so a route that looks like Anthropic ('/messages') with provider 'azure_speech' still goes to Anthropic first."
  - "The Deepgram and Fal handlers take the kwargs as one map argument, while every other handler gets them spread, so a kwargs key named 'result' or 'cache_hit' cannot collide with a Deepgram or Fal argument."
  - "Deepgram keeps only the object members of a list body and reads the upstream URL from the httpx response's request, not from url_route."
  - "Vertex Live is built fresh per call in LiteLLM, so the adapter must keep no state between calls."
  - "A list response body is not an object: Anthropic, Cohere, OpenAI, Cursor and Typesafe see an empty object, and only AzureSpeech sees the list."
  - "Typesafe gets custom_llm_provider as '' when it is None, so the leaf never sees a missing provider."
  - "Tinyfish gets None for a list or missing body, not an empty object, because the leaf treats None as 'no run to price'."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
