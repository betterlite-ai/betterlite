dod:
  - text: is_vertex_route is true for a route with ":" plus a tracked vertex method, a batchPredictionJobs resource or a Vertex interactions path, and false otherwise.
    proof: [predicate-tests, dispatch-oracle]
  - text: is_gemini_route is false for any provider but "gemini", and for "gemini" is true for an interactions route or a route with a tracked gemini method.
    proof: [predicate-tests, dispatch-oracle]
  - text: is_openai_route and is_supported_openai_endpoint follow B3635's classifiers, an empty route is not OpenAI, and a non-OpenAI Azure host is not OpenAI.
    proof: [predicate-tests, dispatch-oracle]
  - text: is_tinyfish_route is true for provider "tinyfish" or a TinyFish agent URL, and false otherwise.
    proof: [predicate-tests]
  - text: select_provider_branch returns the first match in LiteLLM's order for each of the fourteen branches and None for an unmatched route.
    proof: [select-order-tests, dispatch-oracle, helper-python]
  - text: A route that two branches both match picks the earlier one, and an OpenAI URL for an unsupported endpoint falls through to the later branches.
    proof: [select-order-tests, dispatch-oracle]
  - text: With no branch selected the payload has no response object and the input kwargs; with a branch exactly that handler runs once.
    proof: [normalize-tests]
  - text: A handler's kwargs replace the input kwargs even when its result is None, and a handler error is returned to the caller.
    proof: [normalize-tests]
  - text: Each branch's adapter passes the leaf handler the arguments listed in the description, including the empty-object and None defaults for the response body.
    proof: [adapter-shape-tests, dispatch-oracle]
  - text: Newly added helper cases replay through the shared helper-case parser and the strict Python adapter lints clean.
    proof: [helper-case-corpus, helper-python]
checks:
  optional: []
  commands:
    - id: predicate-tests
      why: a route predicate for Vertex, Gemini, OpenAI or TinyFish is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::provider_dispatch::tests::predicate_/)'
    - id: select-order-tests
      why: branch selection is missing, in the wrong order or lets an unsupported OpenAI route stop the chain
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::provider_dispatch::tests::select_/)'
    - id: normalize-tests
      why: the normalize step calls the wrong handler, drops a handler's kwargs or swallows its error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::provider_dispatch::tests::normalize_/)'
    - id: adapter-shape-tests
      why: an adapter passes a leaf handler the wrong response body, extra argument or missing argument
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::provider_dispatch::tests::adapter_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3606)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3606 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3606/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/provider_dispatch-*")" &&
        grep -lE '^[[:space:]]+b3606:' tools/oracle/fuzz/corpus/helper_case/provider_dispatch-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: dispatch-oracle
      why: newly added helper cases are absent or betterlite and LiteLLM disagree on them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/server/pass-through-logging/provider-dispatch)" &&
        grep -rlE '^[[:space:]]+b3606:' tools/oracle/cases/server/pass-through-logging/provider-dispatch &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/server/pass-through-logging/provider-dispatch
