id: B3606
title: Pass-through provider response logging dispatch
description: >-
  Build the step that picks the provider logging handler for a finished pass-through response and runs it, in the new module
  provider_dispatch in betterlite-server (crates/betterlite-server/src/pass_through_logging/provider_dispatch.rs and its folder).
  It is LiteLLM's PassThroughEndpointLogging.normalize_llm_passthrough_logging_payload plus the five route predicates that need a
  provider handler's own helper. B3607 (success completion) calls it for every response that no early return handled. It never writes a
  spend row itself: the handler it picks does the pricing, and B3607 dispatches the result. The module sits in betterlite-server because
  the provider handlers live in different crates (core, vertex, streaming, transcribe, server) and only the server crate can depend on
  all of them. It uses B3605's PassThroughEndpointLogging route tables and predicates, response-object enum, typed kwargs map and
  UpstreamBodyText, all from betterlite-logging.

  Route predicates, as free functions over the route string, all pure. `is_vertex_route(url_route)` is true when the route contains
  ":" plus any vertex method from B3605's table (substring test, so ":generateContent" matches), or contains any vertex resource
  (batchPredictionJobs, no colon), or B3638's is_vertex_interactions_route says so. `is_gemini_route(url_route, custom_llm_provider)` is
  false unless the provider is exactly "gemini"; then it is true when B3638's is_interactions_route says so or the route contains any
  gemini route string from B3605. `is_openai_route(url_route)` is false for an empty route, otherwise B3635's openai-compatible URL
  test (the helper that keeps Azure Speech, Vision and Language hosts out). `is_supported_openai_endpoint(url_route)` is true when B3635's
  chat completions, embeddings, image generation, image editing or responses predicate is true. `is_tinyfish_route(url_route,
  custom_llm_provider)` is true for provider "tinyfish" or when B3648's is_tinyfish_agent_url is true.

  Branch selection. `select_provider_branch(url_route: &str, custom_llm_provider: Option<&str>) -> Option<ProviderBranch>` returns the
  first match in LiteLLM's elif order, and None when nothing matches. `ProviderBranch` has these variants in this order: Gemini
  (is_gemini_route), Vertex (is_vertex_route), Anthropic (B3605's is_anthropic_route), Cohere (is_cohere_route), OpenAi (is_openai_route
  and is_supported_openai_endpoint), Cursor (is_cursor_route), ComprehendMedical, Tinyfish, AzureSpeech, Transcribe, Typesafe (provider
  "typesafe", or is_openrouter_decisions_route), VertexAiLive (is_vertex_ai_live_route), DeepgramListen (B3653's is_deepgram_listen_route
  on the route), FalAi (B3653's is_fal_ai_route). The OpenAi test needs both conditions, so an OpenAI-looking URL for an unsupported
  endpoint falls through to the later branches. The route and provider are the only inputs; the response body never changes the choice.

  Handler call. Define `ProviderLogInput` with the logging object handle, the upstream response view (status code, request method,
  request URL, headers, and B3605's UpstreamBodyText), `response_body: Option<PassThroughResponseBody>` (enum Object(serde_json::Map)
  or List(Vec<serde_json::Map>); LiteLLM's `dict | list[dict] | None`), request_body (serde_json::Map), url_route, result (&str),
  start_time, end_time, cache_hit, custom_llm_provider and the kwargs map. Define `ProviderLogOutcome { result: Option<response-object
  enum from B3605>, kwargs }`, the trait `ProviderLogHandler { fn handle(&self, input: &ProviderLogInput) -> Result<ProviderLogOutcome,
  ProviderLogError> }` and the struct `ProviderLogHandlers` with one `Arc<dyn ProviderLogHandler>` per ProviderBranch variant.
  `ProviderLogHandlers::production(...)` builds the real adapters. Each adapter is a short function that reshapes ProviderLogInput into
  the arguments of one leaf handler and calls it. The leaves are the merged tasks this one depends on: Gemini B3640, Vertex B3642,
  Anthropic B3634, Cohere B3650, OpenAI B3637, Cursor, Typesafe and ComprehendMedical B3651, Tinyfish B3649, AzureSpeech B3652,
  Transcribe B3646, VertexAiLive B3643, DeepgramListen and FalAi B3653. Read each leaf's public handler function in the merged code and
  call it; do not copy its logic. Tests inject fakes through the trait, so the real adapters need no test beyond one per branch that
  checks the reshaped arguments with the leaf stubbed at its input.

  `ProviderLogDispatcher::new(handlers: ProviderLogHandlers)` has `normalize_llm_passthrough_logging_payload(&self, input:
  ProviderLogInput) -> Result<NormalizedPassthroughPayload, ProviderLogError>`. `NormalizedPassthroughPayload { standard_logging_response_object:
  Option<response-object enum>, kwargs }`. With no branch selected it returns None and the input kwargs unchanged. With a branch it
  calls that handler once, and takes both the result and the kwargs from the outcome, so a handler's kwargs replace the input kwargs
  even when its result is None. A handler error goes back to the caller unchanged (LiteLLM has no try around the call here; B3607's caller
  decides what to do with it). No other branch's handler is called.

  Input shaping per branch, which the adapters must keep exactly. Anthropic, Cohere, OpenAi, Cursor and Typesafe get the
  response body as an object, or an empty object when it is absent or a list. Gemini gets the raw response body bytes and the response headers from
  the upstream response view, not a parsed object: the adapter builds `GeminiPassthroughLogger::new(cost)`, then calls the sync
  `gemini_passthrough_handler(&self, input: GeminiPassthroughInput<'_>) -> Result<HandlerOutcome, GeminiPassthroughError>` (fields logging_obj, url_route,
  response_headers: &http::HeaderMap, response_body: &[u8], request_body, start_time, end_time, kwargs) and maps the HandlerOutcome into a
  ProviderLogOutcome. The module path is betterlite_server::pass_through_logging::gemini_passthrough_logging, in the same crate as this task. It gets no result string and no cache_hit. Tinyfish gets the object or None. AzureSpeech gets the body as
  it is (object, list or None). Vertex, ComprehendMedical and Transcribe get no response body. Typesafe also gets custom_llm_provider, or ""
  when it is None. VertexAiLive gets only the websocket messages (the list body, or an empty list for anything else), the logging object,
  url_route, the times and the request body; no response, result or cache_hit. DeepgramListen gets only the object members of the list body
  (empty for anything else), the logging object, the upstream request URL as text, and the kwargs as one map. FalAi gets the object body or
  an empty object, request_body, the logging object, url_route and the kwargs as one map; it gets no times or result. Every other
  handler (not Gemini) also gets the result string, both times, cache_hit and request_body, and the kwargs spread as extra arguments.

  Tests live under pass_through_logging::provider_dispatch::tests and are named by group (see checks). The module has no HTTP route yet
  (B3607 and B102 wire it), so it gets helper cases for the pure parts and native tests for the dispatch.
