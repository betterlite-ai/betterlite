dod:
  - text: "The handlers are tested with tower's oneshot over the module's own Router and fake ports; B8675 runs the HTTP oracle cases through the booted proxy."
    proof: [route-oneshot]
  - text: replace_from_settings validates every entry before it swaps, treats a non-list as empty, keeps the first position of a duplicate name, and leaves the old registry on a bad entry.
    proof: [config-tests]
  - text: A claim round-trips with the per-plugin HMAC key, expires after 30 seconds, fails for another plugin name and for a tampered token, and carries no litellm key.
    proof: [claim-tests]
  - text: The strip set removes hop-by-hop headers, cookie, the six credential headers and the live custom key header, and the response rewrite drops the four wire headers and forces the sandbox CSP and nosniff.
    proof: [header-tests]
  - text: The proxy route answers 403 for a non-admin before the registry lookup, 404 for an unknown plugin, 502 when the send fails, builds the target url with the query, injects the plugin key and the two identity headers, and does not follow redirects. B8675 proves it over HTTP.
    proof: [proxy-tests]
  - text: GET /api/plugins lists name, display_name and url without plugin_key, and auth-token answers 503 without LITELLM_SALT_KEY, then 404 for an unknown plugin, else a claim. B8675 proves it over HTTP.
    proof: [route-tests]
  - text: The router mounts exactly the three paths and all seven methods on the proxy path.
    proof: [router-tests]
checks:
  optional: []
  commands:
    - id: route-oneshot
      why: the handlers are not tested with tower's oneshot over the module's own Router and fake ports
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^plugin_routes::tests::oneshot_/)'
    - id: config-tests
      why: the plugin registry replace is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^plugin_routes::config::/)'
    - id: claim-tests
      why: the plugin session claim is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^plugin_routes::claim::/)'
    - id: header-tests
      why: the header strip set or the response rewrite is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^plugin_routes::headers::/)'
    - id: proxy-tests
      why: the plugin reverse proxy is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^plugin_routes::proxy::/)'
    - id: route-tests
      why: the list and auth-token routes are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^plugin_routes::routes::/)'
    - id: router-tests
      why: the route table is missing or mounts a wrong route
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^plugin_routes::router::/)'
oracle_cases: []
deviations:
  - what: The claim JSON is written by serde_json, so a non-ASCII user_id is raw UTF-8 and not the \uXXXX escapes of Python's json.dumps.
    why: The plugin decrypts the Fernet token and parses the JSON, so both texts are the same value; only the encrypted bytes differ, and Fernet already adds a random IV and a timestamp.
  - what: A malformed entry in general_settings.plugins returns a typed PluginError that names the entry's field, where LiteLLM raises a pydantic ValidationError.
    why: The error text of a Python library is not part of the wire contract; the old registry is kept in both.
out_of_scope:
  - "The startup callers of register_plugins_from_config: B8379 (config load and the database general settings sync) and B8374 (its lifespan calls PluginRegistry::replace_from_settings). The config/field/update caller: B8595. _preserve_redacted_plugin_keys: B8595 (its only caller is update_config_general_settings). Mounting the plugin routes: B8675."
  - "The auth layer itself and who may reach /api/plugins and /plugin-proxy/ without a key: B003, B052 and the route tables in B866 to B868. B4470 already lists /api/plugins and /plugin-proxy/ as gateway-or-backend prefixes."
  - "The pooled outbound client: B173."
  - "Redacting plugin_key in /config/field/info: the config routes."
pitfalls:
  - The 403 check runs before the registry lookup, so a non-admin asking for an unknown plugin gets 403, not 404.
  - /api/plugins/auth-token checks LITELLM_SALT_KEY before the plugin name, so an unset salt is 503 even for an unknown plugin.
  - 'The proxy route answers errors as plain text, not the usual {"detail": ...} JSON, and the auth-token route answers them as JSON.'
  - verify_plugin_session_claim has no caller inside LiteLLM at the pin; it is the contract the plugin side follows, so test it and keep it public.
  - LITELLM_SALT_KEY is read with os.getenv and an empty default, so an empty salt derives a valid but guessable key; the route refuses before that happens, the functions do not.
  - HEAD and OPTIONS are forwarded to the plugin like any other method, and a missing plugin_key means no authorization header is sent at all, not an empty one.
  - The custom key header comes from general_settings at request time, so a reload that changes litellm_key_header_name applies to the next request without a restart.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
