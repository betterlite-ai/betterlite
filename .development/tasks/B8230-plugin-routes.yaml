id: B8230
title: Plugin registry, iframe claims and plugin reverse proxy
description: >-
  Build litellm/proxy/plugin_routes.py as the module `plugin_routes` of betterlite-server (crates/betterlite-server/src/plugin_routes.rs and the folder beside it). It lets an admin register external web services (UI plugins) in general_settings.plugins, shows them to the dashboard, hands the dashboard a short-lived identity claim for the plugin iframe, and reverse-proxies admin calls to the plugin backend. It registers three routes and nothing else; B8675 mounts `plugin_routes::router(state)` once.

  Types. `PluginConfig { name: String, display_name: Option<String>, url: String, plugin_key: Option<SecretString> }` (LiteLLM's PluginConfig in proxy/_types.py L2611-L2620; every field but name and url defaults to None; name and url are required strings; a missing field is a validation error). `PluginRegistry` holds an `RwLock<IndexMap<String, PluginConfig>>` and is built once and shared by the server in state; there is no static. `PluginRegistry::replace_from_settings(&self, settings: &serde_json::Map<String, Value>) -> Result<(), PluginError>` is `register_plugins_from_config`: read the `plugins` key; when it is not a JSON array use an empty list; validate every entry as a PluginConfig FIRST and build the new map keyed by name (a later entry with the same name replaces the value and keeps the first position, as a Python dict comprehension does); only when all entries validated, swap it in. A bad entry returns the error and leaves the old registry untouched. The swap replaces, it never merges, so a plugin removed from config is unreachable at once. The three callers (config load L6689, database load L7894 and config/field/update L18367 in proxy_server.py) belong to the proxy_server parts of B124; this task only exposes the method.

  Claims. `issue_plugin_session_claim(plugin_name, user_id: Option<&str>, user_role: Option<&str>) -> String` and `verify_plugin_session_claim(plugin_name, ciphertext) -> Result<Claim, PluginError>`. The key for a plugin is `base64url(HMAC-SHA256(key = bytes of env LITELLM_SALT_KEY, message = plugin_name bytes))`, which is a valid 32-byte Fernet key. Read the env var directly with an empty default, exactly like LiteLLM (this is NOT the salt resolver of B1600, and a master key never stands in). Use the `fernet` crate on crates.io with its RustCrypto backend (no openssl), plus hmac and sha2; add them to betterlite-server's Cargo.toml and run `cargo deny --locked check`. The plaintext is the JSON object `{"plugin": name, "user_id": user_id or "", "user_role": user_role or "", "exp": now_unix + 30}`, and the token is the Fernet token text. Verify decrypts with a 30 second ttl and parses the JSON; any failure (bad token, tampered, expired by ttl, bad JSON) becomes the one error "Invalid, tampered, or expired plugin session claim"; then a claim whose plugin differs from plugin_name is "Plugin claim audience mismatch", and exp before now is "Plugin session claim expired". The claim never holds a litellm key.

  Routes, all behind the key auth layer from B003/B052 (LiteLLM's `Depends(user_api_key_auth)`; any valid key, no role check except in the third).
  GET /api/plugins: a JSON array with one `{name, display_name (the name when None), url}` per registered plugin in registry order. plugin_key is never returned.
  GET /api/plugins/auth-token?plugin_name=litellm-platform-plugin (that default): when env LITELLM_SALT_KEY is unset or empty, 503 `{"detail": "LITELLM_SALT_KEY is not configured; plugin iframe auth unavailable."}`; when the plugin is not registered, 404 `{"detail": "Plugin '<name>' is not registered."}` (the salt check comes first); else `{"session_claim": <claim for the caller's user_id and user_role>}`.
  GET, POST, PUT, DELETE, PATCH, OPTIONS and HEAD /plugin-proxy/{plugin_name}/{path:path} (hidden from the OpenAPI document; {path} may be empty, so /plugin-proxy/x/ matches and /plugin-proxy/x does not). A caller whose user_role is not exactly proxy_admin gets 403 with the plain-text body "Plugin proxy access requires proxy_admin role." (not JSON, note the order: role first). An unregistered plugin gets 404 plain text "Plugin '<name>' not registered". Otherwise the target is `<url with trailing slashes removed>/<path>` plus `?<raw query>` when the query is not empty; the body is read whole. Forward request headers except the strip set: host, connection, transfer-encoding, te, trailers, upgrade, cookie, the six litellm credential headers (authorization, api-key, x-api-key, x-goog-api-key, ocp-apim-subscription-key, x-litellm-api-key; SpecialHeaders.litellm_credential_header_names at _types.py L4956-L4976, which does not include the x-mcp-* names) and the lowercased general_settings.litellm_key_header_name when it is a non-empty string, read live at each request and not cached. Then, when the plugin has a plugin_key, set `authorization: Bearer <plugin_key>`; when the caller has a user_id set `x-litellm-user-id`, and when it has a user_role set `x-litellm-user-role` (both informational). Send with the PassThroughEndpoint client policy from B173 (the same outbound client the pass-through routes use) and do not follow redirects. Any send error is 502 plain text "Cannot connect to plugin '<name>' at <url>" (the url as configured). Answer with the plugin's status and body. Response headers: drop content-encoding, transfer-encoding, content-length and set-cookie (case-insensitive), then set content-security-policy: sandbox and x-content-type-options: nosniff last so a plugin cannot override them.

  Files in plugin_routes/: error.rs (PluginError, a thiserror enum), config.rs (PluginConfig, PluginRegistry), claim.rs, headers.rs (strip set and the two header functions), proxy.rs, router.rs, tests.rs. Tests use a fake outbound sender trait (`PluginUpstream`, native async fn, injected through state) and the in-memory registry.
