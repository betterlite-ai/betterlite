id: B553
title: Foundry image model selection and Flux parameters
description: >-
  Add FoundryImageConfig selection and FluxImageOptions over shared image wire types. Support DALL-E/GPT inherited
  aliases and explicit Flux2 route/model-path normalization, size mapping and native parameter names. MAI is selected
  here through its separate typed implementation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/image_generation/__init__.py:
  get_azure_ai_image_generation_config L21-L37. litellm/llms/azure_ai/image_generation/flux_transformation.py: AzureFoundryFluxImageGenerationConfig.get_flux2_image_generation_url
  L22-L55; AzureFoundryFluxImageGenerationConfig.is_flux2_model L58-L69; AzureFoundryFluxImageGenerationConfig.get_flux2_provider_model_path
  L72-L74; AzureFoundryFluxImageGenerationConfig.get_supported_openai_params L76-L92; AzureFoundryFluxImageGenerationConfig._map_parameter
  L95-L118; AzureFoundryFluxImageGenerationConfig.map_openai_params L120-L154.


  Named case contracts: dalle_gpt_model_selection: Lowercase and remove hyphens/underscores; choose empty/dalle2,
  then dalle3, then B554 maiimage, then flux substring, else GPT image with debug fallback. Preserve this priority
  for names containing more than one marker. flux2_model_route: Normalize case plus dots/underscores to hyphens;
  flux-2 or flux2 substring selects Flux2. Missing None base raises ValueError api_base is required for Azure AI
  FLUX 2 image generation. Trim trailing slashes, default falsy version to preview. If /providers/ appears anywhere
  in base, retain it entirely when any ? exists, otherwise append ?api-version=<version>. Other bases append /providers/blackforestlabs/v1/<model
  path>?api-version=<version>. flux_model_path: Choose flux-2-flex only when that exact normalized substring exists;
  every other model path falls back flux-2-pro, including flux2-flex without the separating hyphen. flux_size_parameter_map:
  For Flux2 advertise n,size,output_format,seed,safety_tolerance,aspect_ratio,width,height,num_images,guidance,steps
  plus background,moderation,output_compression,quality,user. Silently omit those last five regardless of drop_params.
  Map n to num_images; string count/dimension/steps/seed/safety_tolerance use int, guidance uses float, preserving
  their conversion errors. flux_native_fields: size case-insensitive auto emits nothing; otherwise parse exactly
  two int dimensions split by x after lowercasing. Invalid size raises BadRequestError provider azure_ai with Invalid
  size format <quoted value>. Expected 'WxH', for example '1024x1024'. Unknown parameters raise UnsupportedParamsError
  naming the ordered tuple/model/allowlist and Set drop_params=True advice unless drop_params is truthy. Mapped
  non-default values overwrite optional_params; existing optional keys are not filtered. flux_non_v2_policy: Non-Flux2
  allowlist and mapping delegate B511 GPT image config with copied input maps; do not apply the Flux2 silent-drop/size
  rules to Flux1.


  Implement crates/betterlite-foundry/src/image_generation.rs with adjacent tests under image_generation/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function image_generation_cases in betterlite-foundry with these exact named cases (one per oracle
  file): dalle_gpt_model_selection, flux2_model_route, flux_model_path, flux_size_parameter_map, flux_native_fields,
  flux_non_v2_policy. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_image_generation* using HelperCase: kind:
  helper and the externally tagged foundry_image_generation variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_image_generation that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 131 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 150 production lines, 185 behavior/config-test lines,
  100 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 460 planned, 475 maximum changed lines.
