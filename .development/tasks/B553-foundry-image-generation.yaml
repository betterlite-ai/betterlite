checks:
  optional:
  - mutants
  commands:
  - id: case-dalle-gpt-model-selection
    why: Lowercase and remove hyphens/underscores; choose empty/dalle2, then dalle3, then B554 maiimage, then flux
      substring, else GPT image with debug fallback. Preserve this priority for names containing more than one marker.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_dalle_gpt_model_selection$/)'
  - id: case-flux2-model-route
    why: Normalize case plus dots/underscores to hyphens; flux-2 or flux2 substring selects Flux2. Missing None
      base raises ValueError api_base is required for Azure AI FLUX 2 image generation. Trim trailing slashes, default
      falsy version to preview. If /providers/ appears anywhere in base, retain it entirely when any ? exists, otherwise
      append ?api-version=<version>. Other bases append /providers/blackforestlabs/v1/<model path>?api-version=<version>.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_flux2_model_route$/)'
  - id: case-flux-model-path
    why: Choose flux-2-flex only when that exact normalized substring exists; every other model path falls back
      flux-2-pro, including flux2-flex without the separating hyphen.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_flux_model_path$/)'
  - id: case-flux-size-parameter-map
    why: For Flux2 advertise n,size,output_format,seed,safety_tolerance,aspect_ratio,width,height,num_images,guidance,steps
      plus background,moderation,output_compression,quality,user. Silently omit those last five regardless of drop_params.
      Map n to num_images; string count/dimension/steps/seed/safety_tolerance use int, guidance uses float, preserving
      their conversion errors.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_flux_size_parameter_map$/)'
  - id: case-flux-native-fields
    why: size case-insensitive auto emits nothing; otherwise parse exactly two int dimensions split by x after lowercasing.
      Invalid size raises BadRequestError provider azure_ai with Invalid size format <quoted value>. Expected 'WxH',
      for example '1024x1024'. Unknown parameters raise UnsupportedParamsError naming the ordered tuple/model/allowlist
      and Set drop_params=True advice unless drop_params is truthy. Mapped non-default values overwrite optional_params;
      existing optional keys are not filtered.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_flux_native_fields$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_image_generation.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_image_generation*")"
      && grep -lq 'foundry_image_generation' tools/oracle/fuzz/corpus/helper_case/foundry_image_generation* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_image_generation$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-flux-non-v2-policy
    why: Non-Flux2 allowlist and mapping delegate B511 GPT image config with copied input maps; do not apply the
      Flux2 silent-drop/size rules to Flux1.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::image_generation_cases::case_[0-9]+_flux_non_v2_policy$/)'
