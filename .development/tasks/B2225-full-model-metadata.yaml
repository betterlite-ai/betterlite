  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/full_model_metadata.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/full_model_metadata*")"
      && grep -lq 'full_model_metadata' tools/oracle/fuzz/corpus/helper_case/full_model_metadata* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_full_model_metadata$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-full-query-order
    why: Call B175 get_supported_openai_params(model, provider) first, then B2219 _get_model_info_helper with model/provider/base/key,
      then B2220 get_provider_info. For a truthy provider-info map overlay every non-None value, including False/0/empty
      strings, over helper metadata. Build ModelInfo with supported_openai_params even when None. Preserve exceptions
