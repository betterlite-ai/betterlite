id: B2225
title: Cached full model metadata queries
description: >-
  Compose full model metadata queries and their two bounded caches below callers, keeping B2219 free of supported-parameter
  recursion. The public Python get_model_info aliases in B157 reuse this implementation. Keep explicit api_key out
  of shared cache keys and do not cache an explicitly authenticated result.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/utils.py: _cached_get_model_info_helper
  L5870-L5885; _build_model_info L6380-L6404; _cached_get_model_info L6407-L6413; get_model_info L6416-L6497; cache
  aliases L6500-L6501.


  Named case contracts: full_query_order: Call B175 get_supported_openai_params(model, provider) first, then B2219
  _get_model_info_helper with model/provider/base/key, then B2220 get_provider_info. For a truthy provider-info
  map overlay every non-None value, including False/0/empty strings, over helper metadata. Build ModelInfo with
  supported_openai_params even when None. Preserve exceptions and ordering; a parameter-query failure prevents dynamic
  metadata HTTP. provider_overlay: A provider default can override an explicitly false model-map flag when building
  full model_info; the helper-only B2219 result is unchanged. Skip only None overlay values. Preserve source duplicate
  supported_openai_params construction failure if a dynamic result unexpectedly contains that key. credential_cache_bypass:
  When api_key is not None, including empty string, call _build_model_info directly with that key on every call,
  without reading/writing the shared LRU. With api_key=None cache by model/custom_llm_provider/api_base, preserving
  None versus empty values; do not add headers or caller identity to this credential-free cache key. helper_and_full_caches:
  Use two separate bounded LRU caches with DEFAULT_MAX_LRU_CACHE_SIZE parsed from the same-named environment variable,
  default 64. Cache successful results only; source returns the same mutable record on hits. Capacity 0 disables
  caching and negative maxsize behaves as 0. Expose full-query cache_clear/cache_info and helper cache clearing
  to B2217 invalidation; retain hit/miss/maxsize/currsize statistics. Do not cache exceptions. invalidation_generation:
  B2217 explicit catalog mutation invalidation clears both caches even when catalog length/object identity is unchanged.
  Verify a value replacement is visible after invalidation and that existing cache hits remain stable before it.
  Config reload supplies a fresh cache/settings instance rather than changing process globals. cached_record_mutation:
  Mutate a field in a returned cached metadata record, then read the same cache key and observe that changed field
  without rebuilding; clear/invalidate and observe the fresh source value. Explicit-key uncached calls do not mutate
  an existing cached entry.


  Load DEFAULT_MAX_LRU_CACHE_SIZE through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest full_model_metadata_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Malformed DEFAULT_MAX_LRU_CACHE_SIZE integer strings fail the config loader. Inject two cache instances and constructor
  settings; get_model_info uses no TTL. Return a constructor-owned shared record handle for a cache hit; mutations
  through that handle must be visible on the next hit, as with the source cached dict. Keep synchronization bounded
  and use no process-global cache. The oracle compares values and call counts, with an explicit mutate-then-read
  fixture.


  Implement crates/betterlite-models/src/full_model_metadata.rs with adjacent tests under full_model_metadata/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function full_model_metadata_cases in betterlite-models with these exact named cases (one per oracle
  file): full_query_order, provider_overlay, credential_cache_bypass, helper_and_full_caches, invalidation_generation,
  cached_record_mutation. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/full_model_metadata* using HelperCase: kind:
  helper and the externally tagged full_model_metadata variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_full_model_metadata that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 120 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 140 production lines, 230 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 550 planned, 550 maximum changed lines.
