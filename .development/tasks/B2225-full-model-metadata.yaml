    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::full_model_metadata_cases::case_[0-9]+_credential_cache_bypass$/)'
  - id: case-helper-and-full-caches
    why: Use two separate bounded LRU caches with DEFAULT_MAX_LRU_CACHE_SIZE parsed from the same-named environment
      variable, default 64. Cache successful results only; source returns the same mutable record on hits. Capacity
      0 disables caching and negative maxsize behaves as 0. Expose full-query cache_clear/cache_info and helper
      cache clearing to B2217 invalidation; retain hit/miss/maxsize/currsize statistics. Do not cache exceptions.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::full_model_metadata_cases::case_[0-9]+_helper_and_full_caches$/)'
  - id: case-invalidation-generation
    why: B2217 explicit catalog mutation invalidation clears both caches even when catalog length/object identity
      is unchanged. Verify a value replacement is visible after invalidation and that existing cache hits remain
      stable before it. Config reload supplies a fresh cache/settings instance rather than changing process globals.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::full_model_metadata_cases::case_[0-9]+_invalidation_generation$/)'
  - id: config-default-max-lru-cache-size
    why: DEFAULT_MAX_LRU_CACHE_SIZE lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::full_model_metadata_config_cases::case_[0-9]+_loads_default_max_lru_cache_size$/)'
  - id: case-cached-record-mutation
    why: Mutate a field in a returned cached metadata record, then read the same cache key and observe that changed
