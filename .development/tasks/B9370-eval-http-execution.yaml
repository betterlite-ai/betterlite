  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1435-L1569
    why: GET returns any status, POST raises for status, which decides which replies reach _handle_error.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1630-L1680
    why: DELETE raises for status too.
dod:
  - text: The six handlers send the method, body, query and timeout LiteLLM sends, with cancel posting `{}` and list and get sending no timeout.
    proof: [eval-http-tests]
  - text: Each handler logs pre_call with LiteLLM's input and additional_args before it sends.
    proof: [eval-http-tests]
  - text: POST and DELETE replies at 400 or above and transport failures go through `_handle_error`; GET replies of any status go to the transform.
    proof: [eval-http-tests]
  - text: eval_exchange is public and takes the method, body, query, timeout and logged fields, so the run handlers reuse it.
    proof: [eval-http-tests]
checks:
  optional: []
  commands:
    - id: eval-http-tests
      why: a handler sends the wrong method, body, query or timeout, logs the wrong fields, or converts the wrong replies
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::eval_http::/)'
oracle_cases: []
deviations:
  - what: create_eval_handler logs the body's `name` as the pre_call input on every call, including calls from the sync create_eval.
    why: LiteLLM's sync handler reads `display_name`, a key CreateEvalRequest doesn't have, so it always logs "", while the async handler the proxy uses reads `name`; betterlite has one async handler and keeps the async behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L12550-L12552
out_of_scope:
  - "The eval operations that call these handlers (create_eval, list_evals, get_eval, update_eval, delete_eval, cancel_eval and their async twins in litellm/evals/main.py): B3421, B3422 and B3423."
  - "The eval run handlers at L13139-L13652: B9371, which calls eval_exchange from here."
  - "_handle_error: B2402. The pooled client, ssl_verify and timeouts inside the client: B173. pre_call logging: B249. The provider transforms and get_error_class: B3420 and B523."
  - "Every other handler in llm_http_handler.py belongs to the API family that calls it (containers B3363-B3365, vector stores B2402 and the like)."
pitfalls:
  - "update_eval_handler logs `display_name` and create_eval_handler logs `name`; UpdateEvalRequest has no display_name either, so update logs \"\" for every LiteLLM-shaped body, and that is the pinned behavior."
  - "cancel posts the literal `{}` and drops the body transform_cancel_eval_request returned; OpenAI's transform returns `{}` today, so a test needs a fake config that returns a non-empty body to see the difference."
  - "list and get pass no timeout to the client, so the request deadline is the pool's default and not the operation's `timeout or request_timeout`."
  - "A GET that answers 404 must not go through `_handle_error`; the error comes from the transform failing to read the body, and B3422's exception mapping decides what the caller sees."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
