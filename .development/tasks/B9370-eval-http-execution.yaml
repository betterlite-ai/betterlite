id: B9370
title: Eval create, list, get, update, delete and cancel HTTP execution
description: >-
  The six eval operations (B3421, B3422, B3423) end in BaseLLMHTTPHandler's eval handlers in litellm/llms/custom_httpx/llm_http_handler.py (L12514-L13137), and no task builds them, so every eval call stops before the upstream request. This task builds them in betterlite-core, module `api::eval_http` (crates/betterlite-core/src/api/eval_http.rs, tests in eval_http/tests.rs). The operations call these functions; this module never calls back into them.


  One function per LiteLLM handler pair. LiteLLM writes a sync handler that hands off to an async twin when `_is_async` is set; betterlite-http (B173) has one async client, so each pair becomes one async function with LiteLLM's sync name and no `_is_async` flag: `create_eval_handler`, `list_evals_handler`, `get_eval_handler`, `update_eval_handler`, `delete_eval_handler` and `cancel_eval_handler`. Each takes the URL the operation got from the provider transform, the headers the operation got back from `validate_environment` (LiteLLM's `extra_headers`, an empty map when absent), the provider config as `&dyn BaseEvalsAPIConfig` (B3420, crates/betterlite-openai/src/evals/transformation.rs), `custom_llm_provider`, the litellm params, B249's logging state, the timeout and the pooled client from B173. Create and update also take the request body map, list takes the query map. Read the merged signatures of B173's client and B249's pre_call before you write yours.


  Every handler runs the same four steps, and only the method, the timeout, the logged fields and the response transform differ, so write the steps once as `eval_exchange` (a public function B9371's run handlers call too) that takes a small `EvalExchange` value naming the method, the optional JSON body, the optional query, the optional timeout and the logged input text and additional_args. Step 1: log through B249's pre_call with `api_key` "" and the input and additional_args below. Step 2: send through the pooled client. Step 3: a transport failure goes through B2402's `_handle_error` conversion with the provider config, so `get_error_class` builds the error. Step 4: hand the reply's status, headers and text to the provider transform as B3420's `EvalsHttpResponse`.


  Per handler, from the pinned lines. create: POST the body as JSON with the timeout; input is the body's `name` string, else ""; additional_args are complete_input_dict (the body), api_base (the URL) and headers. list: GET with the query as params and no timeout, so the client's own deadline holds; input ""; additional_args complete_input_dict (the query), api_base, headers. get: GET with no params and no timeout; input ""; additional_args api_base and headers only. update: POST the body as JSON with the timeout; input is the body's `display_name` string, else ""; additional_args complete_input_dict, api_base, headers. delete: DELETE with no body and the timeout; input ""; api_base and headers. cancel: POST the JSON body `{}` with the timeout, whatever body the transform built; input ""; api_base and headers. Then call the matching transform_*_response.


  Status handling follows LiteLLM's client, not a uniform rule. LiteLLM's HTTPHandler.post and .delete call raise_for_status (http_handler.py L1514, L1669), so a POST or DELETE reply with status 400 or above goes through `_handle_error` with the reply's status, text and headers. HTTPHandler.get never does (L1435-L1455), so a GET reply with any status goes to the transform, and a 404 error body reaches transform_get_eval_response, which fails to read it as an Eval. Keep both paths.


  Tests in api::eval_http::tests run every handler against a local axum upstream on 127.0.0.1 that records method, path, query, headers and body: the method and body per handler, cancel sending `{}`, the timeout passed for create, update, delete and cancel and not for list and get, the logged input and additional_args per handler (a recording logger), a POST 404 and a DELETE 500 converted through `_handle_error` with the upstream status and text, a GET 404 handed to the transform, and a connection refused converted through `_handle_error` with status 500 marked synthesized. No oracle case here: the handlers do I/O, so helper cases can't reach them, and B8775's HTTP cases prove them through the booted proxy once B3421-B3423 call them.
