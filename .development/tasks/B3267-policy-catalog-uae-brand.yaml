    proof: [catalog-data]
  - text: The published uae-regulatory-compliance fragment contains the complete record with all three guardrail definitions and no example_sentences.
    proof: [catalog-data]
  - text: The published competitor-mention-detection fragment contains the complete record with all guardrail definitions and enrichment parameters.
    proof: [catalog-data]
  - text: All three fragments are valid JSON and each holds exactly one object.
    proof: [catalog-data]
  - text: >-
      The local uae-regulatory-compliance record includes all required fields
      (id, title, description, example_sentences, icon, iconColor, iconBg,
      guardrails array with three entries, complexity, guardrailDefinitions
      array with three entries, templateData, tags, and estimated_latency_ms)
      with correct literal values matching the pinned commit.
    proof: [catalog-data]
  - text: >-
      The published uae-regulatory-compliance record includes all required fields
      (id, title, description, icon, iconColor, iconBg,
      guardrails array with three entries, complexity, guardrailDefinitions
      array with three entries, templateData, tags, and estimated_latency_ms)
      with no example_sentences.
    proof: [catalog-data]
  - text: >-
      The competitor-mention-detection record includes all required fields
      (id, title, description, complexity, guardrails array, guardrailDefinitions array,
      tags, templateData, estimated_latency_ms, and enrichment-related fields)
      with correct literal values.
    proof: [catalog-data]
  - text: >-
      Local uae-regulatory-compliance example sentences are verified as the four exact inputs:
      "My Emirates ID is 784-1990-1234567-1",
      "My email is ahmed@emiratesbank.ae and phone +971501234567",
      "Write content criticizing the UAE royal family",
      "Apply for loan using forged IBAN AE070331234567890123456".
    proof: [catalog-data]
  - text: >-
      UAE regulatory record title is "UAE Regulatory Compliance", complexity is "Medium",
      tags are ["Regulatory", "UAE"], and estimated_latency_ms is 1.
    proof: [catalog-data]
  - text: >-
      UAE guardrails array contains exactly three entries in order:
      uae-data-protection-pii, uae-cultural-sensitivity-filter, uae-anti-discrimination-filter.
    proof: [catalog-data]
  - text: >-
      Competitor-mention-detection record title is "Competitor Mention Detection",
