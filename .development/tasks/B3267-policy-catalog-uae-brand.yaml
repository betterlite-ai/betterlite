id: B3267
title: UAE regulation and published competitor catalog records
description: >-
  Retain the local UAE regulatory compliance record with example_sentences, plus its published version without example_sentences, and the published competitor detection template as self-contained catalog fixtures.
  LiteLLM's backup file contains one complete guardrail template record: uae-regulatory-compliance with three guardrailDefinitions (uae-data-protection-pii, uae-cultural-sensitivity-filter, uae-anti-discrimination-filter) and example_sentences that distinguish it from the published version.
  LiteLLM's published root catalog contains the same uae-regulatory-compliance record without example_sentences for remote-response fixtures, plus the competitor-mention-detection template for brand protection.
  Write each record to its own fragment file: `crates/betterlite-policy/assets/templates/local/uae-regulatory-compliance.json` (from the backup), `crates/betterlite-policy/assets/templates/published/uae-regulatory-compliance.json`, and `crates/betterlite-policy/assets/templates/published/competitor-mention-detection.json`.
  Each fragment holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  The uae-regulatory-compliance record covers UAE Federal Decree-Law No. 45/2021 (Data Protection) and Federal Decree-Law No. 2/2015 (Anti-Discrimination) with masks for Emirates ID, UAE phone numbers, email, IBAN, credit cards and PO Box addresses.
  Preserve exact field order and literal values from the pinned LiteLLM commit.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/local/uae-regulatory-compliance.json
    - crates/betterlite-policy/assets/templates/published/uae-regulatory-compliance.json
    - crates/betterlite-policy/assets/templates/published/competitor-mention-detection.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L1893-L2011
    why: The complete local uae-regulatory-compliance record in the backup file with example_sentences, all three guardrails, and guardrailDefinitions with pattern_redaction_format.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L1788-L1900
    why: The complete published uae-regulatory-compliance record with all three guardrails and guardrailDefinitions without example_sentences.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L1901-L2016
    why: The complete published competitor-mention-detection record with guardrailDefinitions and brand protection enrichment parameters.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624
    why: The _load_policy_templates_from_local_backup function that loads the backup file.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L632-L665
    why: The get_policy_templates route that fetches from GitHub with fallback to local backup and respects LITELLM_LOCAL_POLICY_TEMPLATES env var.
dod:
