  - text: >-
      All guardrailDefinitions entries include complete litellm_params blocks
      with correct pattern or category references.
    proof: [catalog-data]
checks:
  optional: []
  commands:
    - id: catalog-data
      why: a fragment is missing, is not one valid JSON object, or the UAE records or competitor template differ from the pinned LiteLLM records in keys, key order or literal values
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["uae-data-protection-pii", "uae-cultural-sensitivity-filter", "uae-anti-discrimination-filter"] as $names
          | keys_unsorted == ["id", "title", "description", "example_sentences", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "uae-regulatory-compliance"
          and .title == "UAE Regulatory Compliance"
          and .example_sentences | length == 4
          and .icon == "ShieldCheckIcon"
          and .iconColor == "text-red-500"
          and .iconBg == "bg-red-50"
          and .guardrails == $names
          and .complexity == "Medium"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[]; has("litellm_params"))
          and .templateData.policy_name == "uae-regulatory-compliance"
          and .tags == ["Regulatory", "UAE"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/local/uae-regulatory-compliance.json \
        && jq -e -s 'length == 1 and (.[0]
          | ["uae-data-protection-pii", "uae-cultural-sensitivity-filter", "uae-anti-discrimination-filter"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "uae-regulatory-compliance"
          and .title == "UAE Regulatory Compliance"
          and (has("example_sentences") | not)
          and .icon == "ShieldCheckIcon"
          and .iconColor == "text-red-500"
          and .iconBg == "bg-red-50"
          and .guardrails == $names
          and .complexity == "Medium"
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[]; has("litellm_params"))
          and .templateData.policy_name == "uae-regulatory-compliance"
          and .tags == ["Regulatory", "UAE"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/uae-regulatory-compliance.json \
        && jq -e -s 'length == 1 and (.[0]
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "parameters", "llm_enrichment", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "competitor-mention-detection"
          and .title == "Competitor Mention Detection"
          and .complexity == "Medium"
          and .tags == ["Brand Protection"]
          and .estimated_latency_ms == 1
          and (.guardrails | length) > 0
          and (.guardrailDefinitions | length) > 0
          and all(.guardrailDefinitions[]; has("litellm_params")))' crates/betterlite-policy/assets/templates/published/competitor-mention-detection.json
oracle_cases: []
deviations: []
out_of_scope:
  - Template loading and initialization. The loader _load_policy_templates_from_local_backup is covered by B3252. The route that uses the backup and published catalogs (get_policy_templates) is covered by B3253.
  - Guardrail implementation behavior and pattern matching. The template records define only the policy structure and metadata; actual content filtering and guardrail application happen during policy execution.
  - Other policy templates in the backup or published files. Those are owned by other catalog tasks (Australian PII, EU AI Act, aviation, safety, financial, etc.).
  - Competitor enrichment implementation details. The competitor-mention-detection template references enrichment parameters; the actual LLM-based competitor discovery is covered by B3252.
pitfalls:
  - All three fragments must be valid JSON holding one object each. Syntax errors prevent loading during policy initialization; malformed JSON does not fall back to LiteLLM's defaults.
  - The local uae-regulatory-compliance fragment requires exactly three guardrailDefinitions in their original order (uae-data-protection-pii, uae-cultural-sensitivity-filter, uae-anti-discrimination-filter); do not reorder, duplicate, or omit any.
  - The local backup variant must include example_sentences (four sentences); the published variant must not include example_sentences. Do not mix the two.
  - The published uae-regulatory-compliance and competitor-mention-detection records must preserve their exact field order from the pinned commit; reordering breaks policy matching and initialization.
  - The published competitor-mention-detection record has a different key order than the regulatory record (with llm_enrichment and parameters fields); preserve the exact key order from LiteLLM.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
