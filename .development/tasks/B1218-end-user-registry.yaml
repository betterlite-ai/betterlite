dod:
  - text: >-
      Cases each_restricted_column_nonnull, blocked_true_only, cache_tuple_and_redis_list,
      nonstring_entries_dropped, empty_registry_usable, sentinel_unusable, malformed_cache_miss,
      unrestricted_registry_hit, exact_capacity_fits, registry_overflow_fallback,
      database_error_warns_thirty_seconds, cache_write_warning_preserves_result,
      cache_read_error_propagates, singleflight_waiter_rechecks, failed_cache_write_waiter_reloads,
      max_budget_id_disables, empty_budget_id_disables, key_budget_disables, validation_disables,
      token_zero_budget_disables, registry_key_literal and restricted_id_requires_lookup cover states,
      TTLs and bypass guards.
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^end_user_registry::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/end_user_registry.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/end-user-registry-*")"
        && grep -rlq "end_user_registry" tools/oracle/fuzz/corpus/helper_case/end-user-registry-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^end_user_registry::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/end-user-registry-*")"
        && grep -rlq "validate_end_user_id_in_db" crates/betterlite-config/fuzz/corpus/config_yaml/end-user-registry-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
