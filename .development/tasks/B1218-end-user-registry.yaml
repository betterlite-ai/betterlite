id: B1218
title: Bounded restricted end-user registry cache
description: >-
  Cache the restricted end-user IDs, preserving three states: uncached, a usable set (including empty),
  and unusable None. The restriction predicate ORs blocked=true with non-null budget_id,
  allowed_model_region, default_model and object_permission_id. Empty strings still satisfy non-null.
  Query B726 EndUserRepository with take=5001 (fixed END_USER_RESTRICTED_REGISTRY_MAX_SIZE=5000).
  B2315 provides typed table/cache access, and B733 provides the key end_user_restricted_registry, overflow sentinel and
  management-object TTL. Own the worker-wide end-user load lock and the shared bounded-registry logic;
  tag/model-group callers pass their own locks, keys and fetchers.

  Cache reads recognize __end_user_restricted_registry_overflow__ as None, list/tuple as a frozenset of
  string elements, and anything else as uncached. Keep duplicates collapsed and [] a successful answer.
  Fetch failure warns that per-ID lookups will run and caches the sentinel for exactly 30 seconds
  (REGISTRY_ERROR_NEGATIVE_CACHE_TTL). More than 5000 fetched IDs caches the sentinel at B733's management
  TTL without an overflow warning; equality fits. Successful IDs are cached as a tuple at the same TTL.
  Cache-write failure warns Failed to cache registry and preserves the computed result; cache-read
  failures propagate. Under the load lock, recheck the cache only if the caller observed it locked before
  waiting. A waiting caller seeing no cached result performs its own load, including after a failed write.

  _end_user_is_known_unrestricted skips the optimization when litellm_settings.max_end_user_budget_id
  is not None (default None), key_end_user_budget_id is not None (default None),
  litellm_settings.validate_end_user_id_in_db is true (default False), or token_end_user_max_budget is
  not None, including zero. Otherwise return true only for an ID absent from a usable registry. Neither
  overflow nor database failure proves unrestricted access. Preserve this dependency-free decision for
  B739/B880 callers; real registry reads use POSTGRES_TEST_URL or testcontainers, not fake SQL assertions.


  Build the production end_user_registry module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  _column_is_set (L1691-L1693; 3 source lines), _restricted_end_user_where (L1696-L1698; 3 source lines),
  _cached_registry (L1713-L1725; 12 source lines), _cache_registry_answer (L1728-L1738; 11 source lines),
  _fetch_and_cache_registry (L1741-L1782; 40 source lines), _load_bounded_registry (L1785-L1816; 29 source
  lines), _load_end_user_restricted_registry (L1819-L1839; 19 source lines), _end_user_is_known_unrestricted
  (L1842-L1872; 29 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.validate_end_user_id_in_db=False;
  litellm_settings.max_end_user_budget_id=None.


  Compare only _column_is_set and _restricted_end_user_where through B856 Management::auth and B171
  helper_case. Registry cache I/O, lock contention, budget guards and fallback decisions belong to native
  integration tests; use the production cache and database implementations rather than an oracle table fake.


  Write betterlite-config::end_user_registry::tests::default_optimization_enabled, validation_disables_skip and default_budget_disables_skip.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 146 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  146 production, 240 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 531 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
