    - id: call-tests
      why: an AWS request shape, endpoint, signing region or answer parser is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_provisioning::(.*::)?tests::call_/)'
    - id: collection-tests
      why: collection creation, its wait loop or the propagation sleep is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_provisioning::(.*::)?tests::collection_/)'
    - id: index-tests
      why: index creation, its retry rule or the endpoint check is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_provisioning::(.*::)?tests::index_/)'
    - id: role-tests
      why: IAM role creation, its policy or its sleep is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_provisioning::(.*::)?tests::role_/)'
    - id: flow-tests
      why: the initialization flow or its step order is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_provisioning::(.*::)?tests::flow_/)'
    - id: store-tests
      why: embed, store, the job polling or the trait impl is missing
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^bedrock_provisioning::(.*::)?tests::store_/)'
