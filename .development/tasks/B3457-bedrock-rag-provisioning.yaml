dod:
  - text: The policy builders produce the exact encryption, network, data access, index, trust and permissions documents, with root-first principals deduplicated and the partition ARN prefix everywhere.
    proof: [plan-tests, oracle]
  - text: STS, IAM, OpenSearch Serverless, Bedrock Agent job and S3 PutObject requests use the right method, URL, service name, signing region, headers and AWS-named body fields in the commercial, China and GovCloud partitions, and the XML and JSON answers are read into typed structs.
    proof: [call-tests]
  - text: The collection step sends the three policies in order, records the collection, waits through 60 checks with 5 second sleeps then fails with CollectionTimeout, and sleeps 60 seconds before returning.
    proof: [collection-tests, oracle]
  - text: The index step retries only authorization and security errors, 8 times with 20 second waits, returns other failures at once, and rejects a collection endpoint that is not https on the aoss host.
    proof: [index-tests, oracle]
  - text: The role step records the role name after CreateRole, attaches the policy named `{role}-policy`, sleeps 10 seconds and returns the ARN.
    proof: [role-tests, oracle]
  - text: ensure_config_initialized auto-detects with a knowledge base id, creates all resources in order without one, and stays uninitialized after a failure.
    proof: [flow-tests, oracle]
  - text: store uploads under the trimmed prefix, starts the job, polls by status for the wait setting and timeout, and returns the knowledge base id and key, or the early (id, None) result for missing content.
    proof: [store-tests, oracle]
  - text: embed returns None, and the ingestion trait impl from B3451 forwards to these methods.
    proof: [store-tests]
  - text: HttpRagTransport sends the signed request through the pooled client and returns status and body unchanged, and a transport failure becomes a typed error with no headers.
    proof: [transport-tests]
  - text: The helper adapter passes strict lint and type checks.
    proof: [helper-python]

