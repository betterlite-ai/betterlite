deviations:
  - what: AWS calls are SigV4-signed HTTPS requests, not boto3 or opensearch-py clients. Oracle cases compare operation names and AWS-named parameters from a recording fake on the Python side, and native tests check the wire method, URL, service and signing region.
    why: Rust has neither library and the rules forbid an AWS SDK service crate for these calls.
  - what: The OpenSearch index call is signed through B3456's credential resolution with all ten credential keys, where Python gives requests_aws4auth only the access key, secret key and session token.
    why: One signing path for every AWS call; the role-based keys Python ignores here only widen what already works.
  - what: A collection endpoint that is not https or whose host does not end with `.aoss.{dns_suffix}` is a typed error before signing. Python sends to whatever host the answer names.
    why: The signed credentials must not go to a host an unexpected answer picked. Open question in notes.
  - what: Data access policy principals keep root first and the caller second. Python builds the list with set(), so its order is random.
    why: A stable order is observable and harmless.
  - what: Endpoints for STS, IAM and OpenSearch Serverless come only from region and partition. AWS_ENDPOINT_URL overrides that boto3 reads are ignored.
    why: Same rule as B3456.

out_of_scope:
  - "BedrockRAGIngestion.__init__ settings, _auto_detect_config, _create_s3_bucket, _create_knowledge_base, _create_data_source, _normalize_principal_arn, _get_int, _get_str_or_none and _get_boto3_client: B3456 owns them; this task only calls them."
  - "BaseRAGIngestion state, upload, ocr and chunk, and the call entry points: B3451 and B3460 own them."
  - "The missing-boto3 and missing-opensearch-py ImportError branches: no optional dependency exists in Rust."
  - "The pooled client, its limits and shutdown: B173 owns them; this task only wraps ProxiedClient."
  - "Building the settings from the request vector_store_config and choosing the deployment client: B3460 composes them."

pitfalls:
  - IAM has one global endpoint per partition. Signing it with the configured region (for example us-west-2) fails with a signature error; use us-east-1, cn-north-1 or us-gov-west-1.
  - STS and IAM answer in XML even for a JSON-looking client, and OpenSearch Serverless answers JSON; do not read both with one parser.
  - The data access policy must list the account root and the normalized caller ARN; an assumed-role ARN left as is makes index creation fail forever with a security_exception.
  - The index retry sleeps 20 seconds after the 8th failed attempt too, so the exhausted case takes 160 virtual seconds before it raises.
  - A 403 with no `security_exception` text in the body is not retried; the match is on the body text, not on the status code.
  - created_resources.iam_role holds the role name while the knowledge base entry holds the id, and the collection entry holds the name, so cleanup code can tell them apart.
  - The collection wait uses status `ACTIVE` from BatchGetCollection by id, but the index step looks the collection up again by name.
  - "`not file_content` is true for empty bytes, so an empty upload takes the early return and still runs initialization first."
  - The s3 key is `data/file.txt` for prefix `data/` and `data//file.txt` must never appear; trim every trailing slash before joining.
  - wait_for_ingestion polls with a wall-clock limit, so use tokio::time::Instant, which a paused test clock moves, and never std::time.
  - Form-encoded IAM policy documents contain `+`, `/` and `:`; encode them or CreateRole answers MalformedPolicyDocument.

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
