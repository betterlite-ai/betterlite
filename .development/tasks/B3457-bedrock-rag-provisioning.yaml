id: B3457
title: Bedrock RAG OpenSearch provisioning and ingestion
description: >-
  Build the second half of LiteLLM's BedrockRAGIngestion in a new sibling module `bedrock_provisioning` of the betterlite-rag crate.
  B3456 (module `bedrock_ingestion`) already owns the settings, `BedrockRagState`, `CreatedResources`, `BedrockRagClients::signed_request`,
  `normalize_principal_arn`, `auto_detect_config`, `create_s3_bucket`, `create_knowledge_base` (with its 30-check wait) and `create_data_source`.
  Import those and never copy them. This task adds everything that needs STS, IAM, OpenSearch Serverless, S3 PutObject and the ingestion job API,
  the lazy initialization flow, `embed`, `store`, and the production `AwsRagTransport` adapter over B173's pooled client.
  Python uses boto3 and opensearch-py. Rust has neither, so every call becomes a SigV4-signed HTTPS request through
  `BedrockRagClients::signed_request` (B595 signs, B594 resolves credentials, B198 `get_aws_partition` gives the dns_suffix). Never add an AWS SDK service crate.
  Wire work for the architect: B3456's `signed_request(service, method, url, body)` has no header and no signing-region input. This task needs both (IAM signs in the
  partition's global region, and every JSON call needs Content-Type and X-Amz-Target). It calls `BedrockRagClients::signed_request_with(service, signing_region, method, url, headers, body)`,
  which B3456 must expose (see notes). Do not start before that method exists.

  Module `plan`. Pure builders, no I/O. Each takes the region, the ARN prefix (`arn:{partition}:` from B198) and plain strings, and returns a `serde_json::Value` or a typed struct that is serialized to a compact JSON string.
  (1) Encryption policy for collection `C`: `{"Rules":[{"ResourceType":"collection","Resource":["collection/C"]}],"AWSOwnedKey":true}`.
  (2) Network policy: an array with one object, Rules for ResourceType `collection` and `dashboard`, both with Resource `["collection/C"]`, and `"AllowFromPublic":true`.
  (3) Data access policy: an array with one object, Rules `index` (Resource `["index/C/*"]`, Permission `["aoss:*"]`) and `collection` (Resource `["collection/C"]`, Permission `["aoss:*"]`), and Principal.
  Principal is `["{arn_prefix}iam::{account_id}:root", normalize_principal_arn(caller_arn, account_id)]` with the second entry dropped when equal to the first. Python deduplicates with `list(set(..))`, whose order is random; betterlite keeps root first.
  (4) Index body: settings.index `{"knn":true,"knn.algo_param.ef_search":512}`; mappings.properties `bedrock-knowledge-base-default-vector` = `{"type":"knn_vector","dimension":1024,"method":{"engine":"faiss","name":"hnsw","space_type":"l2"}}`,
  `AMAZON_BEDROCK_METADATA` = `{"type":"text","index":false}`, `AMAZON_BEDROCK_TEXT_CHUNK` = `{"type":"text"}`.
  (5) Role trust policy: Version `2012-10-17`, one Allow statement, Principal Service `bedrock.amazonaws.com`, Action `sts:AssumeRole`, Condition StringEquals `aws:SourceAccount` = account id and ArnLike `aws:SourceArn` = `{arn_prefix}bedrock:{region}:{account_id}:knowledge-base/*`.
  (6) Role permissions policy: Version `2012-10-17`, three Allow statements in this order: `bedrock:InvokeModel` on `{arn_prefix}bedrock:{region}::foundation-model/{embedding_model}`; `aoss:APIAccessAll` on the collection ARN;
  `s3:GetObject` and `s3:ListBucket` on `{arn_prefix}s3:::{bucket}` and `{arn_prefix}s3:::{bucket}/*`.
  Python writes these with json.dumps; spacing is not compared (docs/compatibility.md), so compact serde_json output is fine.

  Module `calls`. One typed request and response struct per operation, serde field names exactly as AWS names them, plus the URL, header and body for each.
  STS GetCallerIdentity: POST `https://sts.{region}.{dns_suffix}/`, service `sts`, Content-Type `application/x-www-form-urlencoded; charset=utf-8`, body `Action=GetCallerIdentity&Version=2011-06-15`. The answer is XML; read Account and Arn under GetCallerIdentityResult with quick-xml (already a workspace dependency).
  IAM is a global service with no regional endpoint, so it needs the partition's global host and signing region: partition `aws` is `https://iam.amazonaws.com/` signed for `us-east-1`; `aws-cn` is `https://iam.cn-north-1.amazonaws.com.cn/` signed for `cn-north-1`; `aws-us-gov` is `https://iam.us-gov.amazonaws.com/` signed for `us-gov-west-1`. Use the `iam` service name, form body, Version `2010-05-08`.
  CreateRole sends RoleName and AssumeRolePolicyDocument and reads Role/Arn from the XML answer. PutRolePolicy sends RoleName, PolicyName and PolicyDocument and needs no answer fields. Percent-encode every form value with the percent-encoding crate; the policy JSON contains `/`, `:`, `*` and quotes.
  OpenSearch Serverless control plane: POST `https://aoss.{region}.{dns_suffix}/`, service `aoss`, Content-Type `application/x-amz-json-1.0`, header `X-Amz-Target: OpenSearchServerless.<Operation>`. Operations: CreateSecurityPolicy `{name,type,policy}` with type `encryption` then `network`,
  CreateAccessPolicy `{name,type:"data",policy}`, CreateCollection `{name,type:"VECTORSEARCH"}` answering `createCollectionDetail.id`, BatchGetCollection `{ids:[..]}` or `{names:[..]}` answering `collectionDetails[]` with `status`, `arn` and `collectionEndpoint`.
  boto3 adds a random `clientToken` to the three Create calls; send a fresh uuid v4 each time. Policy names are `{collection_name}-enc`, `{collection_name}-net` and `{collection_name}-access`; collection and role names use the unique id (below).
  Bedrock Agent (reuse B3456's endpoint builder and its `bedrock-agent` service name): StartIngestionJob is PUT `/knowledgebases/{kb}/datasources/{ds}/ingestionjobs/` with a `clientToken` and answers `ingestionJob.ingestionJobId`;
  GetIngestionJob is GET `/knowledgebases/{kb}/datasources/{ds}/ingestionjobs/{job}` and answers `ingestionJob.status`, `statistics.numberOfNewDocumentsIndexed` and `failureReasons`.
  S3 PutObject: PUT to the object URL, built with B3456's bucket host rule (virtual-hosted, path style when the bucket has a dot or uppercase) followed by the key. Percent-encode each key segment and keep `/`. Headers `Content-Type` (the given type, else `application/octet-stream`) and `x-amz-content-sha256`. A non-2xx answer is B3456's `BedrockIngestionError::Aws`.
  Collection data endpoint: the BatchGetCollection `collectionEndpoint` is `https://{id}.{region}.aoss.{dns_suffix}`. Accept it only when the scheme is https and the host ends with `.aoss.{dns_suffix}`; otherwise return a typed error before anything is signed (the credentials are sent to that host). Python trusts it. See deviations.

  Module `provision`. `BedrockProvisioner` holds `BedrockRagClients`, the settings and state from B3456, `ingest_name: Option<String>`, and `unique_id: String` (8 lowercase hex characters, given by the caller; Python takes `uuid4().hex[:8]`).
  Method `ensure_config_initialized` (L127-L139): returns at once when already initialized; with a knowledge_base_id it calls B3456 `auto_detect_config`, else `create_infrastructure`; it sets the initialized flag only after success, so a failed run is retried from scratch and creates a second set of resources (Python does the same, with no cleanup).
  `create_infrastructure` (L190-L227), in this order: kb_name is ingest_name when non-empty, else `litellm-kb-{unique_id}`; STS GetCallerIdentity; the bucket is the configured s3_bucket, else B3456 `create_s3_bucket(unique_id)`; `create_opensearch_collection`; `create_opensearch_index`; `create_bedrock_role`; B3456 `create_knowledge_base(kb_name, role_arn, collection_arn)`; B3456 `create_data_source(kb_name)`. Store knowledge_base_id and data_source_id in the state.
  `create_opensearch_collection(unique_id, account_id, caller_arn)` (L246-L354): name `litellm-kb-{unique_id}`; send encryption, network and access policies in that order; create the collection and record `created_resources.opensearch_collection` right after that call; then call BatchGetCollection by id up to 60 times, stop on status `ACTIVE`, sleep 5 seconds after each non-ACTIVE check (a never-ready collection does 60 checks, 60 sleeps, then fails with `CollectionTimeout`);
  then sleep 60 seconds for policy propagation; return the name and the ARN from the last answer.
  `create_opensearch_index(collection_name)` (L356-L440): BatchGetCollection by `names:[collection_name]`, take collectionDetails[0].collectionEndpoint (an empty list is a typed error; Python would raise IndexError), validate it as above, and send PUT `{endpoint}/bedrock-kb-index` with the index body, service `aoss`, Content-Type `application/json`.
  Retry up to 8 attempts. A non-2xx answer whose body, lowercased, contains `authorization_exception` or `security_exception` waits 20 seconds and tries again (the sleep also happens after the 8th failure); any other failure, including a connection error, is returned at once. After 8 auth failures return `IndexRetriesExhausted` carrying the last status and the first 1024 bytes of the last body.
  Python signs with requests_aws4auth and the credentials of `get_credentials(access key, secret key, token, region)` only; betterlite signs through `signed_request_with`, which resolves all ten keys. See deviations.
  `create_bedrock_role(unique_id, account_id, collection_arn)` (L442-L514): role name `litellm-bedrock-kb-{unique_id}`; CreateRole, record `created_resources.iam_role` right after it (the role name, not the ARN), PutRolePolicy with policy name `{role_name}-policy`, then sleep 10 seconds; return the role ARN.

  Module `ingest`. `embed(chunks)` returns `None` and ignores its input (L618-L628). `store(file_content, filename, content_type, chunks, embeddings, existing_file_id)` (L630-L720):
  call `ensure_config_initialized` first, then if file_content is None or empty, or filename is None or empty, log a warning and return `(knowledge_base_id, None)` (the id is None when empty).
  Otherwise the key is `{s3_prefix.trim_end_matches('/')}/{filename}`; PutObject; StartIngestionJob; when `wait_for_ingestion` is true, poll GetIngestionJob while the elapsed time (tokio::time::Instant) is below `ingestion_timeout` seconds: `COMPLETE` logs the new-document count (0 when absent) and stops;
  `FAILED` logs the failure reasons at error level and stops; `STARTING` and `IN_PROGRESS` sleep 2 seconds and continue; any other status logs a warning and stops. Running out of time ends the loop silently, with no error (Python too). Return `(knowledge_base_id, Some(key))`.
  `existing_file_id` is ignored (the class does not set supports_existing_file_id). Wire `ensure_config_initialized`, `embed` and `store` to the ingestion trait that B3451 declares in betterlite-core `rag::ingestion`; read its exact trait and method names in crates/betterlite-core/src/rag/ingestion.rs before writing the impl, and add the betterlite-core path dependency to betterlite-rag only for this impl.
  B3456's module must stay free of betterlite-core; this task's impl lives in `bedrock_provisioning::ingest` only.

  Module `transport`. `HttpRagTransport` implements B3456's `AwsRagTransport` trait (read its exact method in crates/betterlite-rag/src/bedrock_ingestion before writing) over betterlite-http's `ProxiedClient` (B173), received through the constructor as an `Arc<ProxiedClient>` for the deployment. It builds an `OutboundRequest` with the given method, url, headers and `RequestBody::Bytes` (or `Empty` for no body), a 60 second deadline, calls `send_buffered`, and returns status and body bytes.
  Every status passes through unchanged (the 2xx check is B3456's job), and a `TransportError` becomes a typed error of this task's own enum that keeps the source and never prints headers. Add betterlite-http as a dependency of betterlite-rag; betterlite-http depends on betterlite-config only, so no cycle forms.
  Tests drive it against a local fake, with B173's `network_mock` client or an in-process hyper listener (whichever the existing betterlite-http tests use), and do not open real AWS hosts.

  Each module that can fail owns its error enum (`ProvisionError`, `CallError`, `IngestError`, `HttpRagTransportError`), none with a variant that carries a credential. Tests that wait use `#[tokio::test(start_paused = true)]` and a recording fake transport, so no real sleeping; assert the total virtual time of each wait.

