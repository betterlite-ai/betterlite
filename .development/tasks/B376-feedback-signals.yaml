id: B376
title: Adaptive feedback signal detectors
description: 'Implement typed FeedbackSignals and bounded transcript feature extraction for satisfaction,
  misalignment, stagnation, repeated tools and clean-trace credit. Keep detector thresholds and request-type
  attribution separate from persistence. Inputs are B010 typed messages; no provider calls or session
  storage are added. Nonmonetary statistical arithmetic uses f64 only in signal_math; put one module-level
  #[expect(clippy::float_arithmetic, reason = "pinned statistical routing arithmetic")] there, counted
  in this task budget. Money, prices, spend and budgets stay rust_decimal::Decimal, including database
  and wire boundaries. Reject nonfinite statistical input. Assert selected model/tier exactly; any opt-in
  tolerance is for diagnostic scores only, never a different selection. Implement the owned native service
  in crates/betterlite-router/src/feedback_signals.rs. Add ProbeOperation::FeedbackSignals in tools/oracle/src/router_probes/mod.rs
  and the corresponding B376 entry in tools/oracle/litellm/probes/registry.py; the adapters only call
  production services. Shared exports and dispatch files are explicitly in scope. Budget allocation: at
  most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration
  lines (800 total); fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor
  services instead of copying their algorithms. Function coverage in litellm/router_strategy/adaptive_router/signals.py:
  SignalDelta.any_fired (L43-L54), _tokens (L105-L108), _jaccard (L111-L115), _detect_misalignment (L134-L141),
  _detect_stagnation (L144-L149), _detect_disengagement (L152-L155), _detect_satisfaction (L158-L161),
  _detect_failure (L164-L174), _signature (L177-L185), _detect_loop (L188-L198), _detect_exhaustion (L213-L220),
  detect_user_feedback (L223-L234), detect_response_signals (L237-L254), merge_signal_deltas (L257-L266),
  apply_signal_delta (L269-L276), advance_session_state (L279-L294), apply_turn (L300-L330). Implement
  these behaviors through the typed Rust services above; synchronous facades and structural accessors
  reuse the same primitive instead of separate ports. If floating diagnostics differ, a case may use absolute_tolerance=0.000000000001
  only on its explicitly named score/probability pointer. Selection, tie order, counts, statuses, money
  and provider requests remain exact. Six-decimal wire signals are compared after the source rounding,
  without widening tolerance.'
scope:
  paths:
  - crates/betterlite-router/src/feedback_signals.rs
  - crates/betterlite-router/src/feedback_signals/**
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-server/src/routing/mod.rs
  - crates/betterlite-server/src/routing/mod/**
  - crates/betterlite-server/src/routing/feedback_signals.rs
  - crates/betterlite-server/src/routing/feedback_signals/**
  - crates/betterlite-router/src/strategy.rs
  - crates/betterlite-router/src/strategy/**
  - crates/betterlite-router/src/context.rs
  - crates/betterlite-router/src/context/**
  - tools/oracle/src/router_probes/feedback_signals.rs
  - tools/oracle/src/router_probes/feedback_signals/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/feedback_signals.py
  - tools/oracle/cases/routing/feedback-signals/**
  - crates/betterlite-router/src/signal_math.rs
  - crates/betterlite-router/src/signal_math/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/signals.py#L1-L330
  why: Implementation boundary verified against the pinned checkout.
dod:
- text: Write tests named feedback_signals_behaviors and feedback_signals_boundaries under feedback_signals::tests. The first
    asserts the listed successful and warning/fallback outcomes; the second asserts error fields, bounds,
    cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot
    satisfy either check.
  proof:
  - feedback-signals-behaviors
  - feedback-signals-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Mutants in changed router/config/wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: feedback-signals-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::feedback_signals_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: feedback-signals-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::feedback_signals_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/feedback_signals.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/feedback_signals.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/feedback-signals/satisfaction-credit-once.yaml
- tools/oracle/cases/routing/feedback-signals/repeated-tool-loop.yaml
- tools/oracle/cases/routing/feedback-signals/exhaustion-not-quality-failure.yaml
deviations: []
out_of_scope:
- B340 owns final integration and the remaining functions listed in its implementation boundary.
pitfalls:
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 1
