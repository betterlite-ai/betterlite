id: B2304
title: Transform and strip stored callback credential fields
description: >-
  Move callback_utils.py's stored credential transforms below callback registration and management
  writes. In betterlite-secrets::callback_vars own strip_callback_config, encrypt_callback_vars,
  decrypt_callback_vars, _transform_callback_vars, is_sensitive_callback_key, _encrypt_if_plaintext
  and _decrypt_or_passthrough (L710-L793), plus their constants at L40-L53 except the public
  CALLBACK_VAR_ENCRYPTED_PREFIX at L47, which B2303 supplies. B189 retains callback
  registration/configuration; B804 and other persistence callers use this concrete service directly.

  strip_callback_config preserves non-dict metadata and otherwise returns a shallow copy without the
  three top-level slots logging, callback_settings and secret_manager_settings. It does not strip
  similarly named nested fields or mutate the original. Encryption/decryption instead deep-copy dict
  metadata. Transform callback_vars only within dict entries of a logging list, and within a dict
  callback_settings whose callback_vars is a dict. Skip non-dict entries, malformed slots, and all
  other metadata, including secret_manager_settings. Do not recursively encrypt arbitrary nested
  strings; the selected callback_vars values alone are the storage boundary.

  is_sensitive_callback_key first honors an exact key in the optional extra set, then lowercases for
  the extra literal gcs_path_service_account, then delegates to B244.SensitiveDataMasker.is_sensitive_key.
  That default predicate recognizes underscore/hyphen-separated credential segments, including plural
  credentials, but a cost segment overrides sensitivity. Thus api_key/access-token/vertex_credentials
  encrypt, input_cost_per_token and max_tokens do not; a caller's exact extra key can override the cost
  exemption. Test the integration with the real B244 predicate rather than copying its pattern table.

  Encryption leaves non-string or empty values and nonsensitive fields untouched. A sensitive string
  already beginning litellm_enc:: is retained without decrypting or checking its contents; this keeps
  old ciphertext unchanged when the salt changes. Otherwise call B2303.encrypt_value_helper and prefix
  the result with litellm_enc::. On ANY encryption error, silently return the original value; no warning
  or hard failure is present in the pin. Keep that observable plaintext-storage fallback and test it
  explicitly. A caller that wants mandatory encryption must be a separately recorded deviation, not an
  accidental change to this helper. Keep secret values out of Debug, tracing and helper effect logs.

  Decryption does not test the key's sensitivity: any nonempty string with litellm_enc:: is unwrapped
  and sent to B2303.decrypt_value_helper with the field name, exception_type=debug and
  return_original_value=false. Return the decrypted result even when it is empty; when it is None,
  retain the entire original prefixed string. Legacy plaintext, non-string and empty values pass through.
  This means a corrupted prefixed value is preserved by both encrypt and decrypt, not double-encrypted.

  Inputs are already-decoded metadata records from their route/config owner. No new environment read,
  setting or byte parser is introduced; B2303 resolves encryption_algorithm, salt and master key and
  owns ciphertext decoding/fuzzing. Pure predicates/structural transforms with a deterministic cipher
  enter B171's callback_secret_fields operation. Cross-codec vectors also call the real B2303 codec
  with pinned deterministic randomness; comparisons expose only fixture-safe values, never live secrets.
  Real Postgres raw-row assertions live with B804 and each persistence caller rather than this pure layer.

  The functions have 61 nonblank, noncomment source lines, plus three constant declarations and the
  masker construction. Allow 110 implementation, 190 tests, 75 adapters and 35 wiring lines, 410 within 450.
scope:
  paths:
    - crates/betterlite-secrets/src/callback.rs
    - crates/betterlite-secrets/src/callback/**
    - crates/betterlite-secrets/src/lib.rs
    - tools/oracle/src/helpers/db/stored_cipher/callback_vars.rs
    - crates/betterlite-secrets/src/callback_vars.rs
    - crates/betterlite-secrets/src/callback_vars/**
    - crates/betterlite-secrets/Cargo.toml
    - tools/oracle/src/helpers/secrets/callback_secret_fields.rs
    - tools/oracle/src/helpers/secrets/callback_secret_fields/**
    - tools/oracle/helpers/callback_secret_fields.py
    - tools/oracle/helpers/callback_secret_fields/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/callback-secret-fields/**
    - tools/oracle/fuzz/corpus/helper_case/callback-secret-fields-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/callback_utils.py#L40-L53
    why: Credential prefix, extra sensitive key and exact top-level removal slots.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/callback_utils.py#L710-L793
    why: Own structural transforms, sensitivity selection and encryption/decryption failure passthrough.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/sensitive_data_masker.py#L74-L93
    why: B244 supplies the segment-based predicate and cost exemption.
dod:
  - text: 'callback_metadata_shapes covers non_dict_unchanged, deep_copy_no_mutation,
      logging_and_callback_settings_slots, malformed_slots_ignored, nested_values_not_recursed,
      secret_manager_not_encrypted, strip_three_top_level_slots and strip_nested_names_preserved.'
    proof: [behavior-tests, oracle, helper-python, helper-corpus]
  - text: 'callback_secret_values covers credential_segments, gcs_key_casefold, cost_exemption,
      plural_credentials, extra_exact_match, empty_and_non_string, nonsensitive_unchanged,
      prefix_without_validation, salt_rotation_idempotence, successful_encrypt_prefix,
      encryption_error_plaintext_silent, legacy_plaintext_decrypt, decrypt_ignores_key_sensitivity,
      decrypted_empty_string and corrupt_ciphertext_retains_prefix. secret_debug_redaction proves
      neither success nor error paths expose the credential value.'
    proof: [behavior-tests, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Callback slot selection, secret transformation or failure compatibility is absent or incorrect.
      run: cargo nextest run --locked -p betterlite-secrets --no-tests=fail -E 'test(/^callback_vars::tests::/)'
    - id: helper-python
      why: The independent pinned callback-field adapter is missing or fails typing.
      run: test -f tools/oracle/helpers/callback_secret_fields.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-corpus
      why: No new callback_secret_fields operation exercises the shared HelperCase parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/callback-secret-fields-*')" && grep -rlq callback_secret_fields tools/oracle/fuzz/corpus/helper_case/callback-secret-fields-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/callback-secret-fields/metadata-slots.yaml
  - tools/oracle/cases/helpers/callback-secret-fields/sensitive-key-selection.yaml
  - tools/oracle/cases/helpers/callback-secret-fields/prefix-and-legacy-values.yaml
  - tools/oracle/cases/helpers/callback-secret-fields/encrypt-failure-passthrough.yaml
  - tools/oracle/cases/helpers/callback-secret-fields/decrypt-failure-passthrough.yaml
deviations: []
out_of_scope:
  - B189 owns other callback_utils.py functions and the callback registry/configuration facade.
  - B2303 owns secret codecs and configuration; B244 owns sensitive-key classification.
  - Team/key/model repositories and routes own when transformed metadata is written and any partial effects.
pitfalls:
  - 'The oracle helper for this task is pre-registered as callback_secret_fields in the secrets group. Replace the stub Op in tools/oracle/src/helpers/secrets/callback_secret_fields.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/callback_secret_fields.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - 'litellm_enc:: is enough to prevent re-encryption even when the suffix is corrupt or uses an old salt.'
  - Encryption failure silently leaves plaintext, whereas successful metadata transformation normally stores ciphertext.
  - secret_manager_settings is stripped from request metadata but is not one of the encrypted callback slots.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
