  - oracle
  - helper-python
- text: 'stability_image: Parameterize Stability1 and Stability3 generation through B634 so their request schemas
    cannot be conflated.'
  proof:
  - case-stability-image
  - oracle
  - helper-python
- text: 'canvas_image: Dispatch B634 Nova Canvas TEXT_IMAGE with its own parameters and reply mapping.'
  proof:
  - case-canvas-image
  - oracle
  - helper-python
- text: 'canvas_edit: Dispatch B638 Canvas editing, preserving mode/image/mask preparation and its double-decoded
