checks:
  optional:
  - mutants
  commands:
  - id: case-titan-image
    why: Dispatch B634 Titan generation with signed fixture transport, including the first image result and provider
      error.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_titan_image$/)'
  - id: case-stability-image
    why: Parameterize Stability1 and Stability3 generation through B634 so their request schemas cannot be conflated.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_stability_image$/)'
  - id: case-canvas-image
    why: Dispatch B634 Nova Canvas TEXT_IMAGE with its own parameters and reply mapping.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_canvas_image$/)'
  - id: case-canvas-edit
    why: Dispatch B638 Canvas editing, preserving mode/image/mask preparation and its double-decoded image reply.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_canvas_edit$/)'
  - id: case-stability-edit
    why: Dispatch B638 Stability edit with base64 image data and the distinct output-format/size policy.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_stability_edit$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_image_dispatch.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_image_dispatch*")"
      && grep -lq 'bedrock_image_dispatch' tools/oracle/fuzz/corpus/helper_case/bedrock_image_dispatch* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_image_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_unsupported_operation$/)'
