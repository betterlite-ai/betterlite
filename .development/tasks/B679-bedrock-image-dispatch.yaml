dod:
- text: 'titan image: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-image-dispatch/titan-image.yaml.'
  proof:
  - case-titan-image
  - oracle
  - helper-python
- text: 'stability image: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-image-dispatch/stability-image.yaml.'
  proof:
  - case-stability-image
  - oracle
  - helper-python
- text: 'canvas image: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-image-dispatch/canvas-image.yaml.'
  proof:
  - case-canvas-image
  - oracle
  - helper-python
- text: 'canvas edit: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-image-dispatch/canvas-edit.yaml.'
  proof:
  - case-canvas-edit
  - oracle
  - helper-python
- text: 'stability edit: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-image-dispatch/stability-edit.yaml.'
  proof:
  - case-stability-edit
  - oracle
  - helper-python
- text: New bedrock_image_dispatch seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: unsupported operation holds at this task’s owned boundary.
  proof:
  - unsupported-operation
checks:
  optional:
  - mutants
  commands:
  - id: case-titan-image
    why: The titan-image behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_titan_image$/)'
  - id: case-stability-image
    why: The stability-image behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_stability_image$/)'
  - id: case-canvas-image
    why: The canvas-image behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_canvas_image$/)'
  - id: case-canvas-edit
    why: The canvas-edit behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_canvas_edit$/)'
  - id: case-stability-edit
    why: The stability-edit behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_cases::case_[0-9]+_stability_edit$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_image_dispatch.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_image_dispatch*")"
      && grep -lq 'bedrock_image_dispatch' tools/oracle/fuzz/corpus/helper_case/bedrock_image_dispatch* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_image_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_image_dispatch_unsupported_operation$/)'
