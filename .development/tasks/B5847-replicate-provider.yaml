    why: "Predictions API shape: urls.get, status values and output."
dod:
  - text: Supported list and parameter mapping match, including the dropped parameters, the max_tokens targets and stop passthrough.
    proof: [request-tests, oracle-replicate, helper-python]
  - text: The URL, headers and request body match for models, deployments, versioned models, a system prompt, a custom prompt and defaults, and no version key is sent.
    proof: [request-tests, oracle-replicate, helper-python]
  - text: Create and prediction replies give the same text, usage, model name and 400 or 422 errors.
    proof: [reply-tests, oracle-replicate]
  - text: Non-stream polling waits delay plus twice the retry, retries only on processing or starting, and ends in the 500 error.
    proof: [poll-tests, oracle-replicate]
  - text: Stream polling yields only the new text with status, ends on the three final statuses, fails on "failed" with 400, ignores non-200 replies, and applies Strict and Lenient output handling.
    proof: [poll-tests, oracle-replicate]
  - text: The new helper seeds select the b5847 variant.
    proof: [seeds]
checks:
  optional: [mutants]
  commands:
    - id: request-tests
      why: A parameter, URL, header or body rule differs, or the guarded version key appears.
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^replicate::(params|request)::/)'
    - id: reply-tests
      why: Text joining, usage or the 400 and 422 errors differ.
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^replicate::(reply|error)::/)'
    - id: poll-tests
      why: Delays, retry limit, chunk slicing or the two output policies differ.
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^replicate::poll::/)'
    - id: oracle-replicate
      why: A request, delay or error differs from the one LiteLLM produces for the same input.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/providers/replicate)" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: helper-python
      why: The Python side of the helper fails type checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: seeds
      why: A seed parses as another helper and tests nothing here.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/b5847-*")" &&
        grep -lq 'b5847' tools/oracle/fuzz/corpus/helper_case/b5847-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/providers/replicate/map-params.yaml
  - tools/oracle/cases/helpers/providers/replicate/url-model-and-deployment.yaml
