  - tools/oracle/cases/helpers/providers/replicate/poll-stream-increments.yaml
  - tools/oracle/cases/helpers/providers/replicate/poll-stream-failed.yaml
deviations:
  - what: One async implementation serves the sync and async LiteLLM paths, with OutputPolicy keeping their different output handling.
    why: Two copies would drift. The sync face is B158's, and the visible results (chunks, errors, delays) stay those of each LiteLLM path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/replicate/chat/handler.py#L26-L123
out_of_scope:
  - B042 owns the dispatch and operation wiring, key and base resolution (REPLICATE_API_KEY, REPLICATE_API_TOKEN, REPLICATE_API_BASE), the stream post-call log from main.py, and the HTTP cases. No dispatch.rs or operation.rs file is touched here.
  - B5653 owns handle_replicate_chunk in streaming_handler.py and B5654 the stream driver; this task only yields the {output, status} chunks.
  - B238 owns the Replicate branch of the exception mapper, and B1689 owns get_replicate_completion_pricing.
  - B177 owns custom_prompt and prompt_factory, B218 the content-to-string projection and B196 the token counts; only calls into them are here.
  - Provider resolution by model name in get_llm_provider_logic.py (the 64 character version check) is not here.
  - The ReplicateConfig class-attribute store (get_config and the setter in __init__) is replaced by the typed ReplicateDefaults argument; nothing in betterlite or the proxy sets it.
  - The unused completion arguments (print_verbose, logger_fn, custom_prompt_dict, version_id) have no behavior and are not built.
pitfalls:
  - get_complete_url never reads api_base, so REPLICATE_API_BASE and a deployment's api_base have no effect on the Replicate URL.
  - For "owner/model:<hash>" the URL is `models/<hash>/predictions`, because model_to_version_id keeps only the part after the colon.
  - validate_environment drops every incoming header, including an Authorization the caller set.
  - transform_request reads the custom prompt table from `litellm.custom_prompt_dict` by the full model string, so an entry keyed by the short name is not found.
  - prompt_factory is called with no custom_llm_provider, so only model-name families (such as llama-2) pick a template.
  - The stream poller sleeps before its first GET, and a persistent non-200 loops forever; do not add a limit.
  - A "failed" status yields the final output chunk first when `output` is present, then raises.
  - An empty joined output becomes one space in transform_response, and usage counts that space.
  - The create POST status is not checked, so an error body without `urls.get` surfaces as the 400 prediction-url error.
review_level: standard
budget: {max_changed_lines: 1500, max_new_expects: 0}
