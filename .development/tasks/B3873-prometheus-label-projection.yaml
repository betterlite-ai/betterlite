deviations:
  - what: Custom metadata labels and custom tags come through config (B002) and are passed at metric time, not read from module state.
    why: Betterlite has no module-level mutable state; callers pass these values at metric time, making functions pure and testable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4690-L4715
  - what: PrometheusLabelFactoryContext is constructed once per request and passed to prometheus_label_factory to amortize precomputation across multiple metric label sets.
    why: LiteLLM recomputes enum_dict, tag labels and end-user on every call; betterlite precomputes these once via context to improve performance when a request emits many metrics.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4626-L4683
  - what: End-user resolution respects the existing cost-tracking policy's opt-in flag; if the policy rejects Prometheus, end-user is not resolved.
    why: LiteLLM calls the cost-tracking resolver, which checks its own opt-in setting; betterlite defers to that policy decision rather than reimplementing it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4658-L4663

out_of_scope:
  - Emitting metrics or calling label methods on actual Prometheus collectors; that is in B3876 and B3874.
  - Config loading for custom_prometheus_metadata_labels and custom_prometheus_tags; that is in B002.
  - The cost-tracking policy itself; that is in B1716.
  - Wildcard pattern compilation and matching beyond calling PatternMatchRouter._pattern_to_regex; that is in B367.

pitfalls:
  - "PrometheusLabelFactoryContext uses a dedicated sentinel (_END_USER_NOT_COMPUTED) to distinguish \"not computed yet\" from \"computed to None\", so that None can be cached as a valid result."
  - "Custom metadata keys are dot-notation (e.g. \"metadata.foo.bar\" or plain \"foo\"); the function handles both and traverses nested dicts but returns only string values, never dict/list/None."
  - "Tag labels are prefixed with \"tag_\" and their names are sanitized, so a configured tag \"User-Agent: curl/*\" produces label name \"tag_user_agent_curl\"."
  - "Wildcard patterns use \"*\" as a glob, not a regex; they are compiled via PatternMatchRouter._pattern_to_regex, which handles escaping."
  - "End-user resolution is lazy within the context: it is computed only when explicitly requested via get_resolved_end_user, not during context construction."
  - "Combined metadata merge order: top-level scalar fields override values from nested subobjects, so if a top-level \"foo\" and requester_metadata.foo both exist, top-level wins."
  - "The source's late import of get_custom_labels_from_tags (inside PrometheusLabelFactoryContext.__init__) avoids a circular dependency; replicate this if B3873 and B3877/B3876 end up in the same crate."

review_level: standard

