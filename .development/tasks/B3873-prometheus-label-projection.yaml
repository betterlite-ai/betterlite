id: B3873
title: Prometheus request labels and custom metadata
description: >-
  Build per-request label projection with reusable context, custom metadata precedence,
  and wildcard tag matching. Resolve end-user identity through the existing cost-tracking
  policy with its exact-true Prometheus opt-in.

  Port litellm/integrations/prometheus.py:4595-4824 and
  litellm/integrations/prometheus_helpers/__init__.py:1-78 to crates/betterlite-logging.

  PrometheusLabelFactoryContext precomputes per-request label inputs (sanitized enum,
  custom metadata by key, tag labels, cached end-user) so prometheus_label_factory
  can subset per metric without repeated work. The context amortizes model_dump,
  tag-label computation, and end-user resolution across multiple label sets per request.
  A sentinel value (_END_USER_NOT_COMPUTED) caches None as a valid result to distinguish
  "not computed yet" from "computed to None".

  prometheus_label_factory accepts either a context (fast path, reusing precomputed
  state) or raw enum values (slow path, used only when no context is available). It
  filters supported labels, sanitizes values, resolves end-user through the cost-tracking
  resolver, and merges custom metadata labels and tag labels into the result. Missing
  labels fill with None so every supported label appears in every result.

  Custom metadata labels come from litellm.custom_prometheus_metadata_labels (a config
  list of dot-notation keys), traversing nested dicts and returning only string values.
  The combined metadata source includes top-level scalar fields from standard logging
  metadata plus requester_metadata, user_api_key_auth_metadata and spend_logs_metadata
  subobjects, merged with left bias (top-level scalars override subobject values).

  Wildcard tag matching uses PatternMatchRouter._pattern_to_regex to compile "*"
  patterns (e.g. "User-Agent: curl/*") into regexes for exact-or-wildcard tag matching.
  Tag labels are emitted with "tag_" prefix and label names sanitized. get_custom_labels_from_tags
  returns a dict of label_name: "true"/"false" for each configured tag, indicating whether
  any request tag matches that pattern or exact match.

  End-user resolution calls the cost-tracking policy's get_end_user_id_for_cost_tracking
  with service_type="prometheus", reusing its opt-in logic (only when prometheus flag is
  exactly true in the end-user budget setting). Cache the function via lazy import
  in _get_cached_end_user_id_for_cost_tracking to avoid loading utils.py at module
  import time.

  The source's late import of get_custom_labels_from_tags inside PrometheusLabelFactoryContext
  (from litellm.integrations.prometheus) is handled by having label_factory_context in a separate
  module file, avoiding a circular dependency where the main prometheus module imports its helper
  and the helper would import back.

