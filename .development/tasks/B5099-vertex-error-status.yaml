deviations: []
out_of_scope:
- crates/betterlite-error/src/error.rs and its ErrorClass::metadata mapping. PermissionDenied already reports
  status 403 with null type and param there, so retagging the phrase rule's family is enough. No shared taxonomy
  change and no block on B184 is needed.
- classify_envelope's own one-expression shape (no-one-line-functions, no-padded-one-line-functions). B5094 owns
  every padded one-line function in the repository, including this one. This task only changes which function
  classify_envelope calls, not its shape.
pitfalls:
- Name the new corpus seed tools/oracle/fuzz/corpus/helper_case/vertex_errors-branch-1250-message-wrong-type.yaml,
  matching its case file under tools/oracle/cases/helpers/vertex-errors. The rest of that folder belongs to other
  tasks.
- The vertex_errors operation is already registered. Change only the existing Input and run in
  tools/oracle/src/helpers/error/vertex_errors.rs's module if the new case needs it, and tools/oracle/helpers/vertex_errors.py.
  helpers/mod.rs, the group files and dispatch.py are not this task's to edit.
- The Python adapter keys family on type(error).__name__ alone today. Add the status_code 403 special case for
  BadRequestError without changing how any other family is read; no other family here has the same quirk.
review_level: standard
budget:
  max_changed_lines: 150
  max_new_expects: 0
