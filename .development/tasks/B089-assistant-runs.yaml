id: B089
title: Assistant run routes and stream framing
description: >-
  Own the complete proxy run_thread handler, including both decorators and its nested stream producer and
  late-failure callback, plus the entire async_assistants_data_generator through line 9341. The earlier
  range stopped inside this generator and omitted its error policy. SDK run functions move whole to B2488;
  B2489 dispatches them. Register only POST /v1/threads/{thread_id}/runs and /threads/{thread_id}/runs.

  Decode raw body with B2489 decode_assistant_body, prepare authenticated data through B1103, and call the
  dispatcher with an explicit thread_id. Only data.stream is exactly true selects streaming. Polling results
  schedule B012 success status and B004 custom headers. Streaming enters the returned manager, calls the
  streaming hook once on the entered iterator, serializes each event with null fields excluded, and emits
  data-only SSE frames. Compose B004 create_response/open_sse_before_first_byte and B005 keepalive interval
  resolution; do not implement another HTTP response relay or SSE decoder.

  Load litellm_settings.sse_keepalive_ping_interval_seconds through B002, default null. B005's existing
  per-deployment litellm_params.keepalive_seconds takes precedence only when candidates agree, including
  zero as a hard disable; a client keepalive_seconds never enables it. Config tests own the newly supported
  global key, while B005 retains interval coercion and B004 the generic relay. There is no environment alias.

  Implement api::assistant_runs in the server crate. The two complete source ranges contain 143 nonblank/
  non-comment lines; budget 170 route/framing, 190 tests, 210 HTTP/SSE fixtures, 65 config/tests, 35 callback
  fixtures and 40 wiring/corpus seeds, 710 lines. HTTP oracle fixtures use a fixed master key, mock provider,
  assistant_settings, no enterprise package and no SDK retries. Provider frames and hook effects are real;
  no helper case stands in for the stream pump.
