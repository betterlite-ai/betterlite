deviations: []
out_of_scope:
- B2488 owns all four SDK run functions and B2489 owns the dispatch/config seam and strict assistant JSON decoder. The run route does not depend on other assistant routes.
- B004 owns create_response, ttft_keepalive_interval, open_sse_before_first_byte and final header behavior; B005 owns SSE parsing and keepalive resolution. This task wires their existing services and owns only assistant-specific generator framing.
- B1103 supplies authenticated request preparation, B012 hook/status operations, B003 shared error rendering and B002 config decoding. B1085/B1086 own other assistant HTTP handlers; B083/B1125 and B124 or its extracted owners retain the remaining proxy_server.py functions.
pitfalls:
- Assistant provider event names remain inside the serialized event JSON; this generator never emits an SSE event line.
- The generator's error frame omits DONE, while B004's late-failure relay deliberately emits it.
- stream=1 takes the polling path even though it is truthy in Python.
- Streaming starts with empty custom headers and returns before the success-status block below it.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
