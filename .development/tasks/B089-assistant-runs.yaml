references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L13679-L13798
  why: Both run aliases, the literal-true stream switch, empty streaming headers and late-failure hook wiring.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L9290-L9341
  why: The whole assistant generator drops event labels, excludes nulls and terminates errors without its normal DONE marker.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/__init__.py#L267-L267
  why: SSE keepalives are off until an operator configures the nullable global interval.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L979-L1288
  why: B004 buffers the first event, converts first errors to JSON and emits late errors under an already committed 200.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/sse_keepalive.py#L180-L210
  why: Candidate agreement and operator-only interval selection must survive composition with assistant routes.
dod:
- text: >-
    assistant_run_aliases posts {assistant_id:asst_a,stream:false,additional_instructions:extra,metadata:
    {turn:first}} to both aliases with valid auth. Observe POST /v1/threads/thread_a/runs and real SDK
    polling queued->completed; return the final run_a record,200. Terminal requires_action retains its
    required_action.submit_tool_outputs.tool_calls, and failed retains last_error, still HTTP 200.
    stream absent/null/false/1/"true" all select this polling path, not SSE. No run-specific deadline is added.
  proof: [run-tests, oracle]
- text: >-
    assistant_run_event_frames supplies stream=true and provider events thread.run.created,
    thread.message.delta,thread.run.requires_action,thread.run.failed followed by provider [DONE]. Expect
    200,text/event-stream, data: <event JSON> followed by two newlines for each event; no event: field is
    emitted. Null fields are omitted while false,0,"" and empty arrays remain. Normal exhaustion appends
    exactly data: [DONE]\n\n. Run statuses are events, not proxy exceptions. Arbitrary network splits must
    not change the sequence. Expect Cache-Control=no-cache and X-Accel-Buffering=no from B004; this branch
    supplies headers={} and does not run the polling custom-header/status-success block.
  proof: [run-tests, oracle]
- text: >-
    assistant_stream_hook_lifetime records one async_post_call_streaming_hook call after manager entry,
    with the entered iterator and request data; a replacement iterator determines the emitted events. It
    is not called once per chunk. On disconnect, close the iterator and manager and cancel upstream work;
    test before the first event, after an event and while waiting for a keepalive. Native scheduling uses
    tracked tasks and deterministic mock barriers. Successful polling schedules status=success with the
    call id or "" and no post_call_success_hook; streaming does neither of those success actions.
  proof: [run-tests, oracle]
- text: >-
    assistant_generator_failures injects a plain RuntimeError("stream broke") after one event. The client
    retains HTTP 200 and receives data: {"error":{"message":"stream broke","type":"None",
    "param":"None","code":"500"}} followed by a blank line and EOF, with no DONE. A status_code=429,
    type=rate_limit_error,param=null,message=slow down exception instead emits those fields and code="429";
    its separate code attribute is ignored by this generator. Before any event, B004 detects this error
    frame and returns application/json with status 500 or 429 and the same envelope. Tracebacks go only to
    logs. Failures in manager entry, hook, event serialization or iteration follow this path and call the
    failure hook once from the generator. An exception thrown into a suspended normal yield produces
    data: <exception string>\n\n via its inner catch; cover that exceptional iterator path natively.
  proof: [run-tests, oracle]
- text: >-
    assistant_stream_http_exception raises HTTPException(403,detail=blocked) from the streaming hook.
    The generator calls the failure hook then rethrows; it does not convert this to its own JSON frame.
    Before a first event B004 yields status 403 with SSE error type=permission_error,param=null,code="403",
    message=blocked followed by DONE. After an event this exception terminates the existing 200 stream;
    there is no invented generator error frame or normal DONE. Native tests also verify the generator's
    debug entry and exception/debug logging without copying tracebacks into wire data.
  proof: [run-tests, oracle]
- text: >-
    assistant_run_keepalive delays the first provider event past an operator interval=1. Expect initial
    : ping\n\n under 200,Cache-Control=no-cache,X-Accel-Buffering=no, then ordinary run frames. If the
    late producer fails, audit_late_failure invokes the failure hook and B004 emits its sanitized error
    frame plus DONE under the already committed 200. A hook returning or raising HTTPException(403,detail=
    replaced) makes that frame message=replaced,type=permission_error,param=null,code="403"; original
    provider details disappear. Without an interval, or with agreed deployment keepalive_seconds=0, no ping
    precedes the first event. A client body keepalive_seconds=1 cannot override the operator's null setting.
  proof: [run-tests, settings-tests, oracle]
- text: >-
    config::api::assistant_keepalive::tests::loads_keepalive_interval loads the production Config with the
    global key absent/null,0,-1,"bad","nan","inf",{},[] and expects disabled, matching B005 coercion;
    1,"1.5",true become 1,1.5,1 seconds and false disables. The key is not reported as unsupported. These
    settings and stream-body edge cases enter the existing config_yaml and assistant_body corpora.
  proof: [settings-tests, config-corpus, body-corpus]
- text: >-
    assistant_run_input_errors uses malformed {,empty body,null/[] and a duplicate body thread_id to
    exercise decode/setup/keyword failures before HTTP. Their route envelope is 500,type="None",param=
    "None",code="500"; truncated/empty messages are the strict orjson diagnostics, while duplicate-id
    message names multiple values for keyword argument 'thread_id'. No router gives the same fields with
    message="{'error': 'No models configured on proxy'}". A polling SDK 404 with null code instead fails
    ProxyException's int("None") rendering and returns 500,{error:{message:"Internal server error",
    type:internal_server_error}}, param/code absent. HTTPException status is retained with code stringified;
    an ordinary numeric code=409 wins over status_code=502. Failure hooks see the current request data.
    B003/B732 deny missing/invalid auth on both aliases with 401,authentication_error,param=null,code="401"
    and no provider requests. Header tests pin request call id, model/cache/base and empty-value omission
    through B004 on polling only, including removal of the api_base query from x-litellm-model-api-base.
  proof: [run-tests, oracle, body-corpus]
checks:
  optional: [mutants]
  commands:
  - id: run-tests
    why: run routing or the complete assistant generator loses an event, error, lifecycle effect or alias
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::assistant_runs::tests::/) - test(/::replays_corpus$/)'
  - id: settings-tests
    why: the operator keepalive key is never accepted by the real Config loader
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::assistant_keepalive::tests::loads_keepalive_interval($|::)/)'
  - id: config-corpus
    why: nullable or malformed keepalive settings have no new configuration replay seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/assistant-keepalive-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: body-corpus
    why: run-body malformed JSON and stream scalar cases do not reach the production decoder replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/assistant_body/run-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::assistant_dispatch::tests::replays_corpus$/)'
