id: B350
title: LAR-1 confidence routing
description: 'Add the typed LAR-1 metadata parser and async deployment selector as a native closed routing-strategy
  variant over B016''s healthy candidate pipeline. Use Decimal confidence and thresholds, preserve metadata
  defaults and typed enums, and return the existing no-candidate outcome rather than inventing another
  dispatch path. Configuration boundary keys introduced or consumed here: routing_strategy, routing_strategy_args.
  Pinned declaration defaults: routing_strategy=''simple-shuffle''; routing_strategy_args=None. Resolve
  env values once in betterlite-config, never in router code. routing_strategy_args confidence_threshold_low/medium/high
  default to 0.3/0.5/0.7. Non-numeric arguments fall back to defaults; normalized numeric thresholds must
  satisfy 0 < low < medium < high < 1. metadata.lar1 defaults act=INF, time=NOW, mind=REF, confidence=0.5,
  evidence=[]. Malformed metadata warns and uses defaults. Implement the owned native service in crates/betterlite-router/src/lar1_routing.rs.
  Add ProbeOperation::Lar1Routing in tools/oracle/src/router_probes/mod.rs and the corresponding B350 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/router_strategy/lar1_routing.py: _coerce_threshold
  (L27-L30), lar1_thresholds_from_args (L33-L41), apply_lar1_routing_strategy (L44-L53), _normalize_thresholds
  (L56-L65), _parse_lar1_metadata (L68-L77), LAR1RoutingStrategy.__init__ (L81-L87), LAR1RoutingStrategy.async_get_available_deployment
  (L89-L132), LAR1RoutingStrategy._classify_request (L134-L153), LAR1RoutingStrategy._select_deployment
  (L155-L174), LAR1RoutingStrategy.get_available_deployment (L176-L179). Implement these behaviors through
  the typed Rust services above; synchronous facades and structural accessors reuse the same primitive
  instead of separate ports. Bound the lar1_meta outside-byte parser to 1048576 bytes before decoding;
  on excess use its typed invalid-input outcome (classifier/observation consumers keep their pinned warning/fallback
  path).'
