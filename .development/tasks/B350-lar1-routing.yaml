deviations:
- what: The lar1_meta byte parser rejects inputs over 1048576 bytes before allocation.
  why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite
    limit. Existing structural field limits remain unchanged.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L24-L179
out_of_scope:
- A synchronous SDK wrapper, which belongs to the later SDK layer.
- litellm/types/lar1.py has no functions at the pin; its exports/data are accounted for by the owning
  native module, with no Python wrapper port.
pitfalls:
- Do not let request metadata revive deployments excluded by health, authentication or budget policy.
- Invalid LAR-1 metadata is a documented defaulting path, while invalid strategy configuration fails startup.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
