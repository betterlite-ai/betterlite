checks:
  optional:
  - mutants
  commands:
  - id: lar1-routing-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::lar1_routing_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: lar1-routing-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/::lar1_routing_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/lar1_routing.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/lar1_routing.py)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: config-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/lar1-routing-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/lar1-routing-invalid.yaml
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml
      | grep -Fq "/lar1-routing-" && grep -Fq 'routing_strategy' crates/betterlite-config/fuzz/corpus/config_yaml/lar1-routing-valid.yaml
      && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked
      -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-router/fuzz/corpus/lar1_meta/lar1-routing-valid.json && test -f crates/betterlite-router/fuzz/corpus/lar1_meta/lar1-routing-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/lar1_meta
      | grep -Fq "/lar1-routing-" && test -f crates/betterlite-router/fuzz/fuzz_targets/lar1_meta.rs && cargo
      nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_lar1_meta_corpus)'
  - id: chat-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f crates/betterlite-openai/fuzz/corpus/chat_request/lar1-routing-valid.json && test -f crates/betterlite-openai/fuzz/corpus/chat_request/lar1-routing-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request
      | grep -Fq "/lar1-routing-" && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && cargo
      nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
