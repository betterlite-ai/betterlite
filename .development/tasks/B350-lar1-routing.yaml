dod:
- text: Write tests named lar1_routing_behaviors and lar1_routing_boundaries under lar1_routing::tests. The first asserts
    the listed successful and warning/fallback outcomes; the second asserts error fields, bounds, cancellation
    and the exact selection at boundaries. Use rstest cases for tables; corpus replay cannot satisfy either
    check.
  proof:
  - lar1-routing-behaviors
  - lar1-routing-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add crates/betterlite-config/fuzz/corpus/config_yaml/lar1-routing-valid.yaml and crates/betterlite-config/fuzz/corpus/config_yaml/lar1-routing-invalid.yaml;
    the valid seed contains routing_strategy. The cargo-fuzz target config_yaml and normal replays_the_config_yaml_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - config-corpus
  - lar1-routing-boundaries
- text: Add crates/betterlite-router/fuzz/corpus/lar1_meta/lar1-routing-valid.json and crates/betterlite-router/fuzz/corpus/lar1_meta/lar1-routing-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target lar1_meta and normal replays_the_lar1_meta_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - lar1-routing-boundaries
- text: Add crates/betterlite-openai/fuzz/corpus/chat_request/lar1-routing-valid.json and crates/betterlite-openai/fuzz/corpus/chat_request/lar1-routing-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target chat_request and normal replays_the_chat_request_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - chat-corpus
  - lar1-routing-boundaries
- text: Mutants in changed router/config/wire code are caught.
  proof:
