id: B350
title: LAR-1 confidence routing
description: Add the typed LAR-1 metadata parser and async deployment selector as a native closed routing-strategy
  variant over B016's healthy candidate pipeline. Use Decimal confidence and thresholds, preserve metadata
  defaults and typed enums, and return the existing no-candidate outcome rather than inventing another
  dispatch path. Use the existing Rust crate boundaries from B004 and B008; integrate through the server
  when the provider dispatcher or callbacks live in another core crate. This task's source slices are
  the linked ranges, not a port of their Python classes. Add the listed oracle cases and the matching
  adapters to B301's component runner where state is not observable over HTTP; adapters call production
  logic and never reproduce it. Use deterministic candidate sets or supplied random samples for comparisons,
  and separate seeded distribution tests for random choices. Extend the existing config_yaml fuzz target
  and committed corpus for every newly accepted config form; unsupported keys still fail by full path.
  Add a cargo-fuzz target lar1_metadata under crates/betterlite-router/fuzz and a normal replays_the_lar1_metadata_corpus
  test using the production parser. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/lar1-routing/**
  - tools/oracle/src/router_probes/lar1-routing/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/lar1_routing.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L24-L177
  why: Thresholds, metadata recovery and first eligible deployment.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/lar1.py#L1-L40
  why: Wire enum values and defaults.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: The new outside-byte parser has a cargo-fuzz target and committed corpus that the production parser
    replays.
  proof:
  - parser-corpus
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(lar1_routing)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the parser fuzz target or seed corpus is missing, or replay fails
    run: test -f crates/betterlite-router/fuzz/fuzz_targets/lar1_metadata.rs && test -n "$(ls -A crates/betterlite-router/fuzz/corpus/lar1_metadata)"
      && cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_lar1_metadata_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/lar1-routing/threshold-equalities.yaml
- tools/oracle/cases/routing/lar1-routing/unverified-precedes-memory.yaml
- tools/oracle/cases/routing/lar1-routing/memory-precedes-confidence.yaml
- tools/oracle/cases/routing/lar1-routing/invalid-metadata-defaults.yaml
- tools/oracle/cases/routing/lar1-routing/first-type-match.yaml
- tools/oracle/cases/routing/lar1-routing/missing-type-first-healthy.yaml
- tools/oracle/cases/routing/lar1-routing/specific-deployment.yaml
- tools/oracle/cases/routing/lar1-routing/invalid-threshold-order.yaml
deviations: []
out_of_scope:
- A synchronous SDK wrapper, which belongs to the later SDK layer.
pitfalls:
- Do not let request metadata revive deployments excluded by health, authentication or budget policy.
- Invalid LAR-1 metadata is a documented defaulting path, while invalid strategy configuration fails startup.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
