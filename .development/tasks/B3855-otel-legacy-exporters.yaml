dod:
  - text: normalize_otel_endpoint appends "/v1/<signal>" (or "/<signal>" after "/v1"), swaps another signal's path, leaves a correct path, the Splunk "/v2/trace/otlp" path and the langtrace "/api/trace" path alone, strips trailing slashes, and returns a missing or empty endpoint as given.
    proof: [endpoint-tests, oracle, helper-python]
  - text: headers_dictionary splits text on commas and first equals signs without trimming or decoding, copies a map, returns an empty map for missing or empty input, and reports a part without an equals sign as an error that holds no header text.
    proof: [headers-tests, oracle, helper-python]
  - text: The headers decoder has a fuzz target and a corpus that replays without a panic.
    proof: [headers-fuzz]
  - text: legacy_resource writes service.name, deployment.environment and model_id (falling back to the service name), then lets OTEL_RESOURCE_ATTRIBUTES and OTEL_SERVICE_NAME from the env snapshot win.
    proof: [resource-tests, oracle, helper-python]
  - text: span_processor_plan picks the shared exporter with a simple processor, console and unknown text as console with a batch processor, and OTLP HTTP and gRPC by their exact names, taking dynamic headers over the config headers and a config override over the logger's exporter and endpoint.
    proof: [selection-tests, oracle, helper-python]
  - text: log_exporter_plan lets OTEL_LOGS_EXPORTER=console win over an OTLP exporter, normalizes the endpoint for logs, and falls back to console with a warning for unknown text; metric_reader_plan does the same for metrics and treats the in-memory exporter as unknown.
    proof: [selection-tests, oracle, helper-python]
  - text: A headers string that does not parse fails every plan function, console exporters included.
    proof: [selection-tests]
  - text: The builder returns a processor that exports into the caller's in-memory exporter for the shared plan, a batch processor for console, and OTLP exporters that send to the normalized endpoint with the plan's headers.
    proof: [build-tests]
  - text: The tracer cache builds once per key, moves a hit to the most recent place, removes the least recently used provider above the maximum, floors the maximum at 1, and keeps one provider when two callers race on a key.
    proof: [tracer-cache-tests, oracle, helper-python]
  - text: A dropped provider is shut down only when it owns its exporter, off the caller's thread, and a failed build is returned without caching anything.
    proof: [tracer-cache-tests]
  - text: Newly added helper corpus cases replay through the shared helper-case parser independently of the native behavior tests.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: endpoint-tests
      why: the per-signal endpoint rewrite is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_exporters::endpoint::/)'
    - id: headers-tests
      why: the headers string and map decoder is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_exporters::headers::/) - test(replays_the_legacy_headers_corpus)'
    - id: headers-fuzz
      why: the headers fuzz target or its corpus is missing, or a corpus file makes the decoder panic
      run: test -f crates/betterlite-logging/fuzz/fuzz_targets/legacy_headers_dictionary.rs && test -n "$(ls -A crates/betterlite-logging/fuzz/corpus/legacy_headers_dictionary)" && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(replays_the_legacy_headers_corpus)'
    - id: resource-tests
      why: the resource attributes or the environment merge are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_exporters::resource::/)'
    - id: selection-tests
      why: the exporter choice for spans, logs or metrics is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_exporters::selection::/)'
    - id: build-tests
      why: the span processor, log exporter or metric reader builders are missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_exporters::build::/)'
    - id: tracer-cache-tests
      why: the dynamic tracer provider cache, its eviction or its shutdown rule is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::legacy_exporters::tracer_cache::/)'
    - id: helper-python
      why: the LiteLLM-side helper and the betterlite helper disagree on a case
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3855::/)'
    - id: helper-case-corpus
      why: newly added helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/legacy-otel-exporters/ "tools/oracle/fuzz/corpus/helper_case/legacy-otel-exporters-*")" &&
        grep -rlE '^[[:space:]]+b3855:' tools/oracle/cases/helpers/legacy-otel-exporters &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

