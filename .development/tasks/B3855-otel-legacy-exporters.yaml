deviations:
  - what: Header names sent by OTLP exporters are lower-cased, a percent-encoded value is decoded, and a header entry whose name or value is not valid HTTP text is dropped with a warning.
    why: The exporters are built through B3848, which parses the headers text with its own W3C Baggage rules. `headers_dictionary` itself keeps LiteLLM's raw split, and the difference shows only for values that hold "%" escapes or characters HTTP does not allow.
  - what: A dynamic header value that holds a comma is split in two when the exporter is built.
    why: The map is joined back into "name=value,name=value" text for B3848's builder. Header values with commas are rare, and the alternative is a second copy of B3848's header client.
  - what: When the legacy exporter is the in-memory one, the log exporter is a fresh `InMemoryLogExporter`.
    why: LiteLLM hands the span exporter object to the log pipeline, which cannot take log records. The Rust SDK has a typed log exporter for this.
  - what: A dropped provider is shut down on its own short-lived `std::thread`, not on a pool of 4 workers, and no provider registers an exit hook (`shutdown_on_exit`).
    why: Evictions are rare (above 256 distinct credential sets) and the Rust SDK has no interpreter-exit hook. The shared-exporter provider that LiteLLM kept out of the hook is also never shut down here.
  - what: The resource has no `telemetry.sdk.*` attributes.
    why: It starts from an empty builder so the SDK cannot read the process environment, which this crate only receives as a snapshot.
  - what: Debug lines do not print header values.
    why: LiteLLM redacts them with `redact_string`; leaving them out is simpler and cannot leak a key.

out_of_scope:
  - "get_tracer_to_use_for_request, _get_dynamic_otel_headers_from_kwargs, _get_dynamic_otel_config_from_kwargs and the base construct_dynamic_otel_headers and construct_dynamic_otel_config (B3859); they call tracer_for_config and tracer_for_headers."
  - "OpenTelemetry.__init__, _init_tracing, _init_metrics, _init_logs, the log processor choice and the global provider rules (B3868); they call the plan and build functions, legacy_resource and legacy_tracer_name."
  - "OpenTelemetryConfig, from_env and normalize (B3854); this task only reads the record."
  - "The V2 exporter registry, build_span_exporter and the OTLP builders themselves (B3848), and OTLP HTTP TLS resolution (B3842, already inside HttpClients)."
  - "Subclass overrides of the dynamic header and config hooks for Arize, Langfuse and the other vendor callbacks (B3862, B3863)."

pitfalls:
  - "Exporter text is matched exactly and case-sensitively here: `OTLP_HTTP` or `GRPC` is unknown and falls back to console, while B3848's `classify` lower-cases first. Pass B3848 only the canonical lower-case kinds `console`, `otlp_http` and `otlp_grpc`."
  - "LiteLLM wraps a console exporter in a batch processor; only the caller's shared exporter gets the simple one. B3848's `processor_for` picks simple for console when its flag is `None`, so always pass `Some(..)`."
  - "`http/json` builds the protobuf exporter in the legacy code. Passing `http/json` to B3848 would switch the body to JSON."
  - "The headers are parsed before the exporter is looked at, so `OTEL_HEADERS=oops` fails for a console exporter too, and a trailing comma in the text fails like a missing equals sign."
  - "`dynamic_headers or otel_headers` means an empty dynamic map falls back to the logger's own headers text, so `tracer_for_headers` with an empty map uses the configured headers."
  - "`_normalize_otel_endpoint` returns an empty endpoint as given and only swaps a sibling path at the very end of the URL, so `http://h/v1/logs/extra` becomes `http://h/v1/logs/extra/v1/traces` for traces."
  - "An endpoint that ends in `/v1` gets only `/<signal>` appended, which `plumbing::endpoints::signal_endpoint` does not do (it would give `/v1/v1/traces`)."
  - "The langtrace and Splunk exceptions apply to traces only; the metrics and logs endpoints of a Splunk host are rewritten like any other."
  - "`OTEL_LOGS_EXPORTER=console` beats an OTLP exporter for logs only; spans and metrics ignore it. The variable is read from the env snapshot on each call."
  - "The metric reader treats the in-memory exporter as unknown text, while the span processor and log exporter treat it as the shared exporter."
  - "The cache key for a headers request is the whole header map, so two requests with the same credentials but different map order share one provider, and the key never includes the logger's endpoint."
  - "The cache decides shutdown from the dropped entry's own `owns_exporter`. A request that evicts a provider which owns its exporter must not skip the shutdown just because the request itself uses the shared exporter."
  - "Do not hold the cache lock while `build` runs. The race rule only works if the second lock section checks the key again."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
