id: B3855
title: Legacy OTel exporters and dynamic provider cache
description: >-
  Build the exporter side of LiteLLM's legacy OpenTelemetry logger: pick and build the span processor, the log exporter and the metric reader from the logger's settings, normalize the OTLP endpoint per signal, split the headers string, build the resource, and keep the bounded cache of per-credential tracer providers that the logger creates when a request carries its own headers or exporter settings.
  The lifecycle (B3859) picks a tracer by calling the cache built here, and the provider assembly (B3868) calls the span processor, log exporter, metric reader and resource builders from `_init_tracing`, `_init_logs` and `_init_metrics`. Both depend on this task, so this task calls neither.
  Everything goes in the module `otel::legacy_exporters` of betterlite-logging: `crates/betterlite-logging/src/otel/legacy_exporters.rs` declares the submodules `error`, `endpoint`, `headers`, `resource`, `selection`, `build` and `tracer_cache`, each in `legacy_exporters/<name>.rs` with its tests in `legacy_exporters/<name>/tests.rs`. The settings record is B3854's `OpenTelemetryConfig` in `otel::legacy_policy::config`, and this task only reads it. Environment values come from a `&BTreeMap<String, String>` snapshot the caller passes in, never from `std::env`.

  Reuse what exists. `otel::plumbing::exporters` (B3848) already builds OTLP HTTP and gRPC exporters, console sinks and the SDK sinks `SpanSink`, `LogSink` and `MetricSink`, and `otel::plumbing::providers::build_metric_reader` builds the 5 second periodic reader. This task decides which exporter LiteLLM's legacy rules would pick, then calls those builders with an `ExporterSpec` or a `betterlite_config::sections::otel_settings::Settings` whose every field is written out (no `..Default::default()`) that holds the already normalized endpoint, the kind text `console`, `otlp_http` or `otlp_grpc`, and the headers re-joined as `name=value,name=value`. The existing endpoint rewrite `plumbing::endpoints::signal_endpoint` leaves an endpoint that already ends in the right signal path unchanged, so it does not undo the legacy result. Do not reuse `signal_endpoint` or `plumbing::headers::parse_headers` for the legacy rules themselves, because both differ from LiteLLM's legacy code (see pitfalls).

  Errors (`error`). `LegacyExporterError` has two variants, `Headers(HeadersError)` and `Exporter(ExporterError)` (B3848's), both with `#[from]`. Nothing here panics and nothing is swallowed.

  Endpoint (`endpoint`). `normalize_otel_endpoint(endpoint: Option<&str>, signal: Signal, callback_name: Option<&str>) -> Option<String>` follows `_normalize_otel_endpoint`; `Signal` is `crate::otel::config::Signal` (`Traces`, `Metrics`, `Logs`). A missing or empty endpoint comes back as given. Otherwise: strip every trailing "/"; for `Traces`, return it unchanged when it contains "/v2/trace/otlp" (Splunk); for `Traces` with `callback_name == Some("langtrace")` and an endpoint that ends with "/api/trace" (the constant `LANGTRACE_TRACE_PATH`, defined in this module), return it unchanged; return it unchanged when it already ends with "/v1/<signal>"; when it ends with the "/v1/<other signal>" path of another signal, swap the last path segment for the wanted signal; otherwise append "/v1/<signal>", or only "/<signal>" when it already ends with "/v1". The invalid-signal warning in LiteLLM cannot happen with a typed `Signal`, so it is not ported.

  Headers (`headers`). `HeadersInput` is the enum `None`, `Text(&str)` or `Map(&BTreeMap<String, String>)`. `headers_dictionary(input) -> Result<BTreeMap<String, String>, HeadersError>` follows `_get_headers_dictionary`: `None`, empty text and an empty map give an empty map; a map is copied; text is split on "," and each part on its first "=" with no trimming, no percent decoding and no case change, and a later duplicate name wins. A part without "=" (including the empty part left by a trailing comma) is `HeadersError::MissingSeparator { position }` with the 1-based position of the part. The error never contains the header text, because it may hold a credential. This is the decoder of outside text, so it gets a cargo-fuzz target `crates/betterlite-logging/fuzz/fuzz_targets/legacy_headers_dictionary.rs` that feeds UTF-8 input to `headers_dictionary(HeadersInput::Text(..))`, and a corpus folder `crates/betterlite-logging/fuzz/corpus/legacy_headers_dictionary` with at least three seeds, replayed by the test `replays_the_legacy_headers_corpus` in the headers tests.

  Resource (`resource`). `legacy_resource(config: &OpenTelemetryConfig, env: &BTreeMap<String, String>) -> opentelemetry_sdk::Resource` follows `_get_litellm_resource`. The base attributes are `service.name` from `config.service_name`, `deployment.environment` from `config.deployment_environment` and `model_id` from `config.model_id`, falling back to the service name when the model id is empty; empty or missing values are not written. Then the environment resource is merged over the base, so it wins: each "name=value" pair of `OTEL_RESOURCE_ATTRIBUTES` (split on ",", then on the first "=", name and value trimmed, value percent-decoded, a pair without "=" skipped with a `warn`), then `OTEL_SERVICE_NAME` replaces `service.name` when set. Start from `Resource::builder_empty()` so the SDK does not read the process environment on its own. LiteLLM freezes the resource at first use; here the caller builds it once and passes it to the cache.

  Selection (`selection`). Three pure functions decide what to build and return plain records, so the choice is tested and compared with LiteLLM without opening a network connection. All three parse the headers first (so a bad headers string fails even for a console exporter) and compare exporter text exactly and case-sensitively. The mapping from `config.exporter`: `InMemory` is the shared exporter (LiteLLM's "has an export method" branch); `Console` and `Named("console")` are console; `Named("otlp_http")`, `Named("http/protobuf")` and `Named("http/json")` are OTLP HTTP; `Named("otlp_grpc")` and `Named("grpc")` are OTLP gRPC; any other text is unknown.
  `span_processor_plan(base, dynamic_headers: Option<&BTreeMap<String, String>>, config_override: Option<&OpenTelemetryConfig>, callback_name) -> Result<SpanProcessorPlan, HeadersError>` follows `_get_span_processor`. The exporter, endpoint and headers come from `config_override` when given, else from `base`; headers come from `dynamic_headers` when that map is non-empty, else from the chosen config's headers text. The plan holds `kind` (`Shared`, `Console`, `OtlpHttp` or `OtlpGrpc`), `endpoint` (normalized for `Traces`, set only for the two OTLP kinds), `headers` and `processor` (`Simple` for `Shared`, `Batch` for everything else, console included). An unknown exporter text becomes `Console` with a `debug` line, as LiteLLM does.
  `log_exporter_plan(config, callback_name, env) -> Result<LogExporterPlan, HeadersError>` follows `_get_log_exporter`: `InMemory` is `Shared`; else `Console` when the exporter is console or `env["OTEL_LOGS_EXPORTER"] == "console"` (this wins over an OTLP exporter); then OTLP HTTP and gRPC with the endpoint normalized for `Logs`; an unknown text is `Console` plus a `warn` line "OpenTelemetry: Unknown log exporter '<text>', defaulting to console. Supported: console, otlp_http, otlp_grpc".
  `metric_reader_plan(config, callback_name) -> Result<MetricReaderPlan, HeadersError>` follows `_get_metric_reader`: console, OTLP HTTP and gRPC (endpoint normalized for `Metrics`) and everything else, `InMemory` included, is `Console` plus the matching `warn` line with "metric" in place of "log". The metric reader has no shared-exporter branch.

  Build (`build`). `LegacyExporterBuilder::new(clients: HttpClients, shared_exporter: InMemorySpanExporter)` keeps an `ExporterFactories::new(clients.clone(), BTreeMap::new())` from B3848. `span_processor(&self, plan) -> Result<ExportProcessor, LegacyExporterError>` builds `SpanSink::InMemory(shared_exporter.clone())` for `Shared` (so spans land in the exporter the caller holds), otherwise calls `ExporterFactories::exporter_from_spec`, and wraps the sink with `processor_for(sink, Some(plan.processor == Simple))`. `log_exporter(&self, plan)` returns `LogSink` through `build_log_exporter`, and `metric_reader(&self, plan)` returns the `PeriodicReader<MetricSink>` through `build_metric_reader`. For `OtlpHttp` pass the kind text `otlp_http`, never `http/json`, because LiteLLM's legacy code builds the protobuf exporter for all three HTTP names. The OTLP TLS policy already sits in `HttpClients` (one client per signal), so nothing here reads certificate files.

  Tracer cache (`tracer_cache`). `DynamicTracerCache` is constructed with the logger's `OpenTelemetryConfig`, the `callback_name`, a `LegacyExporterBuilder`, the `Resource` from `legacy_resource`, a tracer name, and a maximum size. `DEFAULT_MAX_DYNAMIC_TRACER_PROVIDERS` is 256 and a given maximum below 1 is raised to 1. `legacy_tracer_name(env) -> String` is `env["OTEL_TRACER_NAME"]` or "litellm"; B3868 calls it too. The cache is a `Mutex<IndexMap<CacheKey, CachedProvider>>` where the map order is the recency order (the first entry is the least recently used; a hit moves its entry to the end). `CachedProvider` holds the `SdkTracerProvider` and `owns_exporter`. `CacheKey` is `Config { exporter: String, endpoint: Option<String>, headers: Option<String> }` or `Headers(BTreeMap<String, String>)`, with the exporter as its text ("console", "in_memory" or the named text) and the endpoint and headers as given, not normalized.
  `tracer_for_config(&self, dynamic_config: &OpenTelemetryConfig) -> Result<SdkTracer, LegacyExporterError>` and `tracer_for_headers(&self, dynamic_headers: &BTreeMap<String, String>) -> Result<SdkTracer, LegacyExporterError>` follow `_get_tracer_with_dynamic_config` and `_get_tracer_with_dynamic_headers`. The first builds the processor from `span_processor_plan` with `config_override` set; the second uses the logger's own exporter and endpoint with `dynamic_headers`. Both build a provider with the shared resource and that one processor, and both go through `cached_dynamic_tracer(&self, key, owns_exporter, build: F) -> Result<SdkTracer, LegacyExporterError>` with `F: FnOnce() -> Result<SdkTracerProvider, LegacyExporterError>` as a generic parameter (no `impl Trait` argument), which is public so tests can pass their own providers. `owns_exporter` is false only when the exporter is `InMemory` (LiteLLM's `_provider_owns_exporter`: the shared exporter must stay alive for the whole process).
  `cached_dynamic_tracer` follows LiteLLM step by step. Under the lock: on a hit, move the entry to the end and return a tracer from it. On a miss, drop the lock and run `build`, since exporter construction can block; a build error is returned and nothing is cached. Then take the lock again: if another caller cached the same key meanwhile, move that entry to the end, use it, and drop the provider just built; otherwise insert the new one at the end and, when the map now holds more than the maximum, remove the first entry. A dropped provider is shut down only when its own `owns_exporter` is true (never by the flag of the request that evicted it), on a separate `std::thread` so the caller does not wait for the exporter flush, with a `debug` line if `shutdown()` returns an error. A poisoned lock is recovered with `PoisonError::into_inner`, because the map is valid after a panic elsewhere. The tracer comes from `provider.tracer(tracer_name)` with the configured name.

  Helper cases (pure functions only). The skeleton adds the helper operation `b3855` with these functions, and every case calls one of them, with LiteLLM running the same call through its real code: `normalize_otel_endpoint` (endpoint, signal, callback_name), `headers_dictionary` (text or map), `span_processor_plan`, `log_exporter_plan` and `metric_reader_plan` (a config with exporter, endpoint and headers, plus dynamic headers, config override, callback name and env where they apply; the answer holds kind, normalized endpoint, headers and processor kind), `tracer_cache_sequence` (maximum size and a list of requests with key and owns_exporter; the answer holds, per request, whether it built, then the final key order and the keys whose provider was shut down) and `litellm_resource` (config and env; the answer holds the resource attributes except `telemetry.sdk.*`). An `InMemory` exporter is sent as the in-memory marker, which the Python side turns into an `InMemorySpanExporter`. No HTTP case exists: no proxy route reaches the OTel logger yet, and the umbrella that wires it adds those.

