- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/claude_platform/transformation.py#L21-L104
  why: Own BedrockClaudePlatformConfig.custom_llm_provider, BedrockClaudePlatformConfig.should_strip_billing_metadata,
    BedrockClaudePlatformConfig.validate_environment, BedrockClaudePlatformConfig.transform_request, BedrockClaudePlatformConfig.get_model_response_iterator.
    Other functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/claude_platform/messages_transformation.py#L20-L88
  why: Own BedrockClaudePlatformMessagesConfig.should_filter_anthropic_beta_headers, BedrockClaudePlatformMessagesConfig.validate_anthropic_messages_environment,
    BedrockClaudePlatformMessagesConfig.transform_anthropic_messages_request. Other functions in this file remain
    with the owners listed below.
