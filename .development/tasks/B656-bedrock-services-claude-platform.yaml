id: B656
title: Bedrock Claude Platform workspace routes
description: >-
  Add ClaudePlatformSettings and workspace-scoped native chat/Message request overrides. Resolve workspace_id/aws_workspace_id/anthropic-workspace-id/anthropic_workspace_id
  before ANTHROPIC_AWS_WORKSPACE_ID then ANTHROPIC_WORKSPACE_ID; no workspace default exists. Resolve api_base before
  ANTHROPIC_AWS_BASE_URL then ANTHROPIC_AWS_API_BASE, otherwise require aws_region_name/AWS_REGION_NAME/AWS_REGION/AWS_DEFAULT_REGION
  and build https://aws-external-anthropic.{region}.api.aws/v1/messages. ANTHROPIC_AWS_API_KEY selects key auth,
  otherwise sign service aws-external-anthropic. Preserve unsupported override handling and warnings for default
  context_management removal or malformed claude_platform_unsupported_params. No request-provided workspace can
  bypass the configured deployment scope.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/claude_platform/common_utils.py:
  filter_claude_platform_request_body L29-L48; resolve_unsupported_override L51-L72; strip_claude_platform_route
  L75-L78; BedrockClaudePlatformMixin.get_error_class L82-L88; BedrockClaudePlatformMixin._get_workspace_id L91-L104;
  BedrockClaudePlatformMixin._get_required_aws_region_name L106-L123; BedrockClaudePlatformMixin.get_complete_url
  L125-L145; BedrockClaudePlatformMixin.sign_request L147-L170. litellm/llms/bedrock/claude_platform/transformation.py:
  BedrockClaudePlatformConfig.custom_llm_provider L21-L22; BedrockClaudePlatformConfig.should_strip_billing_metadata
  L24-L25; BedrockClaudePlatformConfig.validate_environment L27-L71; BedrockClaudePlatformConfig.transform_request
  L73-L90; BedrockClaudePlatformConfig.get_model_response_iterator L92-L104. litellm/llms/bedrock/claude_platform/messages_transformation.py:
  BedrockClaudePlatformMessagesConfig.should_filter_anthropic_beta_headers L20-L21; BedrockClaudePlatformMessagesConfig.validate_anthropic_messages_environment
  L23-L67; BedrockClaudePlatformMessagesConfig.transform_anthropic_messages_request L69-L88.


  Reuse ModelResponseIterator.__init__ from B581 (litellm/llms/anthropic/chat/handler.py); its implementation remains
  with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/claude_platform.rs with adjacent tests under claude_platform/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_claude_platform in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function claude_platform_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): workspace_id_required, explicit_region_required, platform_route_prefix, unsupported_override_drop_or_error,
  filtered_body_fields, native_anthropic_stream, platform_auth, invalid_override_warning, workspace_alias_precedence,
  api_base_before_region. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_claude_platform* using HelperCase:
  kind: helper and the externally tagged bedrock_services_claude_platform variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_claude_platform that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/bedrock/claude_platform.rs
  and its loader wiring: ANTHROPIC_AWS_WORKSPACE_ID, ANTHROPIC_WORKSPACE_ID, ANTHROPIC_AWS_BASE_URL, ANTHROPIC_AWS_API_BASE,
  ANTHROPIC_AWS_API_KEY, claude_platform_unsupported_params. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest bedrock_services_claude_platform_config_cases
  with named cases loads_anthropic_aws_workspace_id, loads_anthropic_workspace_id, loads_anthropic_aws_base_url,
  loads_anthropic_aws_api_base, loads_anthropic_aws_api_key, loads_claude_platform_unsupported_params, plus rejects_unrelated_key.
  Each loads case calls the real config loader with that key and asserts the resolved value, default, precedence
  and secret redaction where applicable. Seed B002 config_yaml with new bedrock_services_claude_platform* files
  for every key; reuse its parser/fuzz target.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_claude_platform_credential_identity_isolation in betterlite-bedrock for this
  Rust-specific invariant; it is not a Python oracle case.


  Write standalone bedrock_services_claude_platform_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 272 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 295 production lines, 207 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 43 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
