out_of_scope:
- B030 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- All common_utils.py functions/constants are B2211; inherited Anthropic bodies/header helpers and stream iterator
  have the direct prerequisite owners named in the description.
- 'Function ownership inventory litellm/llms/bedrock/claude_platform/common_utils.py: filter_claude_platform_request_body
  L29-L48; resolve_unsupported_override L51-L72; strip_claude_platform_route L75-L78; BedrockClaudePlatformMixin.get_error_class
  L82-L88; BedrockClaudePlatformMixin._get_workspace_id L90-L104; BedrockClaudePlatformMixin._get_required_aws_region_name
  L106-L123; BedrockClaudePlatformMixin.get_complete_url L125-L145; BedrockClaudePlatformMixin.sign_request L147-L170
  belong to B2211.'
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_claude_platform in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_claude_platform.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_claude_platform.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Chat-generated headers override caller x-api-key, while native Messages preserves an existing exact x-api-key
  entry even when empty.
- Native header preparation suppresses unsupported-option warnings; request transformation emits them once at its
  normal filter call.
