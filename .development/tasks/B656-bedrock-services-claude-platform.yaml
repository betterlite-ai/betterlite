id: B656
title: Bedrock Claude Platform workspace routes
description: >-
  Compose Claude Platform chat and native Messages with B2211 shared workspace/URL/body policy. These provider methods
  do not install an HTTP route; API tasks retain routing.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/claude_platform/transformation.py:
  BedrockClaudePlatformConfig.custom_llm_provider L21-L22; BedrockClaudePlatformConfig.should_strip_billing_metadata
  L24-L25; BedrockClaudePlatformConfig.validate_environment L27-L71; BedrockClaudePlatformConfig.transform_request
  L73-L90; BedrockClaudePlatformConfig.get_model_response_iterator L92-L104. litellm/llms/bedrock/claude_platform/messages_transformation.py:
  BedrockClaudePlatformMessagesConfig.should_filter_anthropic_beta_headers L20-L21; BedrockClaudePlatformMessagesConfig.validate_anthropic_messages_environment
  L23-L67; BedrockClaudePlatformMessagesConfig.transform_anthropic_messages_request L69-L88.


  Reuse ModelResponseIterator.__init__ from B581 (litellm/llms/anthropic/chat/handler.py); its implementation remains
  with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: workspace_id_required: Run B2211 alias precedence cases through BOTH validate methods. Only
  workspace_id is None raises AuthenticationError401 provider bedrock,model supplied,message Missing workspace ID
  for Claude Platform on AWS. Pass `workspace_id` or configure the provider workspace setting. Empty string returned
  by the selector is sent as anthropic-workspace-id. This source does not enforce deployment-over-request workspace
  priority. chat_platform_headers: Choose api_key or ANTHROPIC_AWS_API_KEY then B570 get_anthropic_headers(auth_token=None),
  supplying B568 predicates for computer/cache/PDF/file/MCP/web-search/tool-search/programmatic/input-examples/code-execution/skills
  and B688 effort predicate custom_llm_provider anthropic. Parse caller anthropic-beta through B570, compare its
  comma values as a set. Generated headers override caller keys, and anthropic-workspace-id always overrides caller
  header. Run B570 beta/default literals and feature combinations through this composition. native_platform_headers:
  Native Messages preserves caller anthropic-version if key exists else2023-06-01, content-type if key exists else
  application/json; always set workspace header. Resolve API key same as chat but set x-api-key only when key truthy
  AND exact x-api-key key absent; explicit empty existing key remains. Return api_base unchanged. B960 _update_headers_with_anthropic_beta
  receives filtered options with log_invalid=False/log_dropped=False; all its beta cases apply with should_filter_anthropic_beta_headers=False.
  chat_platform_body: custom_llm_provider bedrock,should_strip_billing_metadata=True. Filter optional params through
  B2211 then delegate B577 AnthropicConfig.transform_request with original model/messages/params/headers; run its
  defaults/body rewrites here. Unlike native Messages, this method does not strip claude_platform/ itself. native_platform_body:
  Strip one leading claude_platform/ with B2211, filter optional request params with normal warning behavior, then
  delegate B962 AnthropicMessagesConfig.transform_anthropic_messages_request. Reuse its thinking/beta/body behavior;
  no independently copied native Messages mapper. Invalid override warns during request transform even though environment/header
  preparation suppressed it. native_anthropic_stream: Return B581 ModelResponseIterator(streaming_response,sync_stream,json_mode=bool(json_mode));
  preserve provider-independent Anthropic SSE framing through B583 instead of AWS binary event decoding. No buffering
  or stream capability policy is added here.


  Implement crates/betterlite-bedrock/src/claude_platform.rs with adjacent tests under claude_platform/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function claude_platform_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): workspace_id_required, chat_platform_headers, native_platform_headers, chat_platform_body, native_platform_body,
  native_anthropic_stream. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_claude_platform* using HelperCase:
  kind: helper and the externally tagged bedrock_services_claude_platform variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_claude_platform that
  parses every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero
  seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Configuration loaders belong to B2211; reuse its exact field defaults and precedence.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_services_claude_platform_credential_identity_isolation in betterlite-bedrock for this
  Rust-specific invariant; it is not a Python oracle case.


  Write standalone bedrock_services_claude_platform_secret_safe_failure in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Budget from 143 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 185 production lines, 285 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 610 planned, 625 maximum changed lines.
