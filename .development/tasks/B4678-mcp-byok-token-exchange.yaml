dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports; B8624 mounts the routes and proves the items below over HTTP with the cases that moved there.
    proof: [route-tests]
  - text: >-
      verify_pkce matches LiteLLM for the RFC 7636 example, a wrong verifier, a challenge with padding, an empty verifier and a non-ASCII verifier.
    proof: [pkce-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      The metadata documents have LiteLLM's keys in order and its values for the bare base, the oauth issuer, a prefixed base and the protected resource (path dropped from resource, authorization_servers as an array).
    proof: [metadata-tests]
  - text: >-
      exchange_authorization_code runs the twelve steps in the listed order: each failing step gives its exact TokenError, steps 5 to 8 leave the code stored, step 4 removes it, and step 9 fails before the code is removed.
    proof: [exchange-tests]
  - text: >-
      A successful exchange removes the code, stores the credential, invalidates the cache and returns a bearer grant with expires_in 3600. A failing store_credential or invalidate_cache gives ServerError after the code is gone, and a missing database still returns a grant.
    proof: [exchange-tests]
  - text: >-
      issue_session_token signs an HS256 token whose claims are user_id, server_id, type byok_session, iat and exp = iat + 3600, and it verifies with the master key and fails with another key.
    proof: [session-jwt-tests]
  - text: >-
      The routes answer the discovery documents and the token endpoint on the listed paths with the listed status codes and no-cache headers, register each root prefix once, and answer a missing form field with the 422 body.
    proof: [route-tests]
checks:
  optional: [mutants]
  commands:
    - id: pkce-tests
      why: The PKCE tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^byok_token_exchange::pkce::tests::/)'
    - id: exchange-tests
      why: The code exchange step order or credential write tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^byok_token_exchange::exchange::tests::/)'
    - id: session-jwt-tests
      why: The session token tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^byok_token_exchange::session_jwt::tests::/)'
    - id: metadata-tests
      why: The discovery document tests are missing or fail.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^byok_oauth_metadata::tests::/)'
    - id: route-tests
      why: The route tests for the discovery paths and the token endpoint are missing or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^routes::mcp_byok_oauth::/)'
    - id: helper-python
      why: The helper adapter is missing or fails strict Python checks.
      run: test -f tools/oracle/helpers/b4678.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b4678 operation reaches the shared helper case parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-byok-pkce-*')" && grep -rlq b4678 tools/oracle/fuzz/corpus/helper_case/mcp-byok-pkce-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/mcp-byok-pkce/rfc7636-example.yaml
  - tools/oracle/cases/helpers/mcp-byok-pkce/wrong-verifier.yaml
  - tools/oracle/cases/helpers/mcp-byok-pkce/padded-challenge.yaml
  - tools/oracle/cases/helpers/mcp-byok-pkce/empty-verifier.yaml
  - tools/oracle/cases/helpers/mcp-byok-pkce/non-ascii-verifier.yaml
deviations:
  - what: >-
      A request under /.well-known/oauth-authorization-server/<prefix>/v1/mcp/oauth whose prefix is not in SERVER_ROOT_PATHS gets the router's generic 404 body, not {"detail": "Unknown proxy root path"}. The prefix list is read once at startup.
    why: axum cannot put a literal segment after a catch-all, so betterlite registers one static route per configured prefix, and LiteLLM's {root_path:path} route and its per-request env read have no equivalent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L677-L684
  - what: >-
      The session token's header keys are written in the jsonwebtoken crate's order (typ before alg), so the token text differs from PyJWT's for the same claims.
    why: Clients treat the token as opaque and the oracle compares decoded header and claims. PyJWT sorts header keys and the crate does not.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L944
  - what: >-
      The no-database warning says no database is configured instead of "prisma_client is None".
    why: betterlite has no Prisma client. It is a log line, not wire output.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L930-L931
out_of_scope:
  - "_byok_auth_codes, _AUTH_CODE_TTL_SECONDS, _AUTH_CODES_MAX_SIZE, _purge_expired_codes and the two /v1/mcp/oauth/authorize routes: B4677. This task reaches the store only through AuthCodeLookup."
  - "_build_authorize_html: B4687."
  - "_user_id_from_session_cookie, _session_identity_from_cookie, _session_key_is_live and _byok_session_auth: B4655 (its description lists them). Nothing in this task calls them."
  - "store_user_credential: B4713. _invalidate_byok_cred_cache (operations.py) and the cache removal it calls: B136 and B5121, with the peer publish in B878. B8624 wires them into ByokCredentialSink."
  - "get_request_base_url, well_known_root_suffix, BYOK_RESOURCE_METADATA_PATH, TOKEN_NO_CACHE_HEADERS: B4654. The trusted-proxy decision: B743. get_server_root_paths: B4200. B8624 passes all three in."
  - "oauth_authorization_server_mcp and the other well-known routes in discoverable_endpoints.py: B7321. This task never calls them."
  - "Success-path HTTP oracle cases for POST /v1/mcp/oauth/token: a valid code only exists after a session-cookie POST to /authorize, and one oracle case sends one request, so the success path is covered by the exchange tests."
pitfalls:
  - Steps 5 to 8 of the exchange return invalid_grant without removing the code, while an expired code is removed and a good one is removed only after the master key check.
  - The redirect_uri check runs only when both the stored and the submitted value are non-empty, but the client_id check runs whenever the stored one is non-empty, so a token request with no client_id fails it.
  - The code is removed before store_credential runs, so a database failure leaves the user with no code and a 500 server_error, and a failing invalidate_cache after a successful write also gives 500 with the credential already saved.
  - The grant_type test comes before the code lookup, so an unknown code with grant_type=refresh_token answers unsupported_grant_type, not invalid_grant.
  - A form that omits server_id still succeeds and stores the credential under server_id "", as LiteLLM does.
  - The session token claim type must be exactly "byok_session", since B4655's cookie decoder rejects that value, and nothing else at the pin verifies this token.
  - base64url here is the URL-safe alphabet with the "=" padding removed, and an empty verifier is hashed like any other string.
  - The token endpoint sends Cache-Control no-store and Pragma no-cache on errors too, and the discovery documents send neither.
  - The prefixed route rebuilds the base from scheme and netloc only, so a base_url that already carries a root path loses it before the prefix is added.
  - LiteLLM also declares GET /.well-known/oauth-authorization-server in discoverable_endpoints.py, so this task owns that path alone; B7321 must not register it again.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
