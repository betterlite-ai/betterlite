    why: >-
      _verify_pkce and _oauth_token_error (the {"error": code} body with TOKEN_NO_CACHE_HEADERS).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/byok_oauth_endpoints.py#L647-L696
