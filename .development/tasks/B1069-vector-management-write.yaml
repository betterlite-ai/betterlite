id: B1069
title: Vector-store management writes
description: >-
  Implement complete create_vector_store_in_db and POST /vector_store/new, /vector_store/delete and
  /vector_store/update in server::api::vector_management_write. These register existing provider stores
  in the shared Postgres schema; they do not create or delete provider resources. Use B2486 shared
  boundaries, B726/B858 persistence, B1062 registry, B192 safe_dumps, B010 GenericLiteLLMParams and
  B1131 request records. B003/B732 authenticate, then B864 checks feature vector_stores outside each
  handler try. Its general_settings.disable_vector_stores_for_internal_users and
  allow_vector_stores_for_team_admins both default false and remain B864-owned settings.

  Create's optional name,description,metadata,params,credential,team_id,user_id default null. Store raw
  litellm_embedding_model references; never resolve deployment embedding credentials into a row.
  Write DB first, then cache, then redact the returned params through B2486. Errors do not roll back
  earlier effects. Complete ranges 179-341,453-529,605-697 contain 242 nonblank/non-comment lines;
  budget 245 implementation, 210 tests, 170 HTTP fixtures and 65 wiring, 690 under 780. Framework JSON
  decoding uses B1131's existing records and corpus; no new parser or helper oracle is needed.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/vector_management_write.rs
  - crates/betterlite-server/src/api/vector_management_write/**
  - crates/betterlite-openai/fuzz/corpus/vector_store_records/management-write-*
  - tools/oracle/cases/api/vector-management-write/**
  - tools/oracle/helpers/b1069.py
  - tools/oracle/helpers/b1069/**
  - tools/oracle/src/helpers/server/b1069.rs
  - tools/oracle/src/helpers/server/b1069/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/management_endpoints.py#L179-L341
  why: Database creation validates duplicate ids, serializes only present metadata and returns a redacted row through the new route.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/management_endpoints.py#L453-L529
  why: Delete checks both stores, then config ownership and access, before ordered DB/cache deletion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_endpoints/management_endpoints.py#L605-L697
  why: Update distinguishes omitted fields from explicit null and authorizes the existing row before mutation.
dod:
- text: >-
    register_store_preserves_raw_embedding_reference posts {vector_store_id:vs_a,custom_llm_provider:openai,
    litellm_params:{litellm_embedding_model:embed,api_key:secret},team_id:forged,user_id:forged} as user u/team t.
    DB stores team_id=t,user_id=u and the raw embedding name, without fetching embedding deployment credentials.
    Response 200 is {status:success,message:"Vector store vs_a created successfully",vector_store:<row>},
    with credentials REDACTED_BY_LITELM and original DB/cache credentials intact. Missing/falsey id or provider
    gives 400 detail="vector_store_id and custom_llm_provider are required". Config-owned id uses B2486's
    400 before DB. Duplicate DB id gives 400 detail="Vector store with ID vs_a already exists".
  proof: [write-tests, oracle, new-cases]
- text: >-
    create_optional_database_values posts name="",description="",metadata={},params=null,credential="".
    Empty strings are persisted, metadata becomes JSON {}, params always JSON {}; omitted optional fields
    are absent from create data. Non-dict metadata is silently dropped after request validation permits it.
    Truthy params are GenericLiteLLMParams.model_dump(exclude_none=true), then serialized with safe_dumps.
    Null DB yields 500 detail="Database not connected". A cache-add failure after successful insert yields
    500 detail=<failure text> and leaves the DB row; successful insert logs info with vs_a.
  proof: [write-tests, oracle]
- text: >-
    delete_database_before_cache posts {vector_store_id:vs_a}. A DB or memory match suffices, DB row wins
    access when both exist, and both absent gives 404 detail="Vector store with ID vs_a not found".
    Config-owned match gives B2486 400 before access; denied access gives 403 detail="Access denied: You do not have permission to delete this vector store".
    Allowed DB+cache removes DB first then cache and returns 200 {status:success,message:"Vector store vs_a deleted successfully"}.
    Cache-only skips DB delete; DB-only skips cache delete. Cache failure leaves DB deletion committed and
    returns 500 detail=<failure text>. Null DB rejects even a cache-only store with 500 "Database not connected".
  proof: [write-tests, oracle]
- text: >-
    update_uses_exclude_unset posts {vector_store_id:vs_a,vector_store_description:null,litellm_params:null,
    vector_store_metadata:null}. Remove only id from update data; description/metadata null remain, params
    becomes JSON {}. Omitted name is not written. Non-null metadata is JSON-serialized and params excludes
    null fields. Config-owned is 400 before fetch; missing row or null update result is 404 detail="Vector store with ID vs_a not found";
    denied row is 403 detail="Access denied: You do not have permission to access this vector store".
    Success updates DB then registry and returns {status:success,message:"Vector store vs_a updated successfully",vector_store:<redacted row>}.
    Updating description alone still redacts existing credentials. Registry failure preserves the DB change.
  proof: [write-tests, oracle, wire-corpus]
- text: >-
    management_write_auth_and_feature_gate covers every route with missing/invalid key (401,
    authentication_error,param=null,code="401") and valid key. With disable_vector_stores_for_internal_users=true,
    ordinary user gets 403 detail={error:"Access to vector_stores is disabled for your role. Contact your proxy admin."}
    before DB validation; default false allows access, proxy admin/view-only admin bypass, and allow flag=true
    permits a verified team admin through B864. These HTTPException detail responses have no type/param/code.
    Missing update/delete required id produces framework 422 detail validation. All success bodies use
    application/json. No route emits provider HTTP and catch-all failures log the operation before 500 detail.
  proof: [write-tests, oracle]
checks:
  optional: []
  commands:
  - id: write-tests
    why: database writes, authorization order or post-write cache failure semantics are missing
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_management_write::tests::/) - test(/::replays_corpus$/)'
  - id: new-cases
    why: management mutation routes have no new authenticated HTTP evidence
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/vector-management-write)"
  - id: wire-corpus
    why: omitted and explicit-null management fields lack wire decoder seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/vector_store_records/management-write-*)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::vector_store_records::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/api/vector-management-write/register-store-preserves-raw-embedding-reference.yaml
- tools/oracle/cases/api/vector-management-write/create-optional-database-values.yaml
- tools/oracle/cases/api/vector-management-write/delete-database-before-cache.yaml
- tools/oracle/cases/api/vector-management-write/update-uses-exclude-unset.yaml
- tools/oracle/cases/api/vector-management-write/management-write-auth-and-feature-gate.yaml
deviations: []
out_of_scope:
- B2486 owns every shared helper at lines 52-176; create_vector_store_in_db begins at 179 and belongs whole here.
- B1070 owns list/info. B864 owns feature settings and their loader tests; no enterprise license gate is introduced.
- B2486's documented list-credential redaction deviation applies to returned rows. Native provider-store creation/deletion is B1064/B1066.
pitfalls:
- A successful DB write is not undone when the following in-memory registry operation fails.
- Create ignores caller team_id/user_id and uses the authenticated identity.
- Explicit litellm_params=null clears params to an empty JSON object on update; omission leaves it untouched.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
