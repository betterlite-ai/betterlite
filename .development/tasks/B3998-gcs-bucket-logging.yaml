id: B3998
title: Group GCS log uploads and retrieve request payloads
description: >-
  Implement bounded queue draining, credential-separated NDJSON groups and legacy
  individual-object upload modes for GCS. Provide the three-date request lookup used
  by spend-log retrieval with individual naming and custom sanitized IDs.
  Inherit from GCSBucketBase and read environment variables GCS_BATCH_SIZE (default 2048),
  GCS_FLUSH_INTERVAL (default 20 seconds) and GCS_USE_BATCHED_LOGGING (default true).
  Enqueue StandardLoggingPayload items from success and failure events, flushing immediately
  when the queue reaches its configured capacity before dropping any queued item. Group
  items by their effective bucket plus service-account credentials; batched uploads combine
  grouped items into NDJSON format under date/batch-{uuid}.ndjson, while individual uploads
  use response ID or failure UUID under date/{id}. Both paths use construct_request_headers
  to obtain Vertex authentication and _log_json_data_on_gcs to POST the formatted payload.
  Implement request-payload retrieval by trying the start date, then start+1 and start-1
  until a success-object lookup finds the response. Omit the async_health_check method
  (no caller at the pin) and remove paid-tier eligibility checks without consulting
  enterprise implementations.
