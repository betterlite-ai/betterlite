    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::async_send_behaviors::tests::/) - test(/::replays_corpus$/)'
  - id: object-naming-tests
    why: Object names must use response ID for success, UUID for failure, and custom gcs_log_id when present
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::object_naming_behaviors::tests::/) - test(/::replays_corpus$/)'
  - id: payload-retrieval-tests
    why: Payload retrieval must try three dates and return None when all fail
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::payload_retrieval_behaviors::tests::/) - test(/::replays_corpus$/)'
  - id: naming-format-tests
    why: Object naming formats must match expected date/id patterns
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::naming_format_behaviors::tests::/) - test(/::replays_corpus$/)'
  - id: flush-tests
    why: Queue flushing and periodic flush must call async_send_batch and update timestamps
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::flush_behaviors::tests::/) - test(/::replays_corpus$/)'
