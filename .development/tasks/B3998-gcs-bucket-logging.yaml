deviations:
- what: >-
    GCSBucketLogger.__init__ (lines 48-51) and async_log_success_event (lines 58-61)
    raise ValueError if premium_user is not True.
    Betterlite removes these paid-tier eligibility checks entirely per project policy.
  why: >-
    LiteLLM's enterprise package enforces paid-tier restrictions; betterlite has no paid tier.
    All features are always available and nothing gates users or teams.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/gcs_bucket/gcs_bucket.py#L48-L61
out_of_scope:
- async_health_check (line 374) is not owned by this task; it has no caller at the pin and raises NotImplementedError.
- GCS_DEFAULT_BATCH_SIZE, GCS_DEFAULT_FLUSH_INTERVAL_SECONDS and GCS_DEFAULT_USE_BATCHED_LOGGING constants are
  defined in gcs_bucket.py (lines 11-15) but owned and validated by B002's environment and config loading.
- B3997 owns GCSBucketBase parent class, get_gcs_logging_config and construct_request_headers; this task calls them.
- B2208 owns sanitize_cloud_object_component utility; this task uses it.
- get_secret_str general secret-manager dispatcher needs a lower owner (question 2 in outline).
- CustomLogger and AdditionalLoggingUtils base classes and their methods need assignment (outlined as architectural decisions).
pitfalls:
- >-
  Config key extraction reads both standard_callback_dynamic_params (dynamic per-call overrides)
  and instance-level BUCKET_NAME and path_service_account (set at initialization). Fallback order
  is dynamic params first, then instance, then literal defaults.
- >-
  A full queue calls flush_queue immediately before enqueuing new items. This prevents
  blocking and data loss but does not guarantee delivery; failed groups are not requeued.
- >-
  Batched logging groups items by config key (bucket plus credentials), so multiple keys
  result in multiple uploads even within one batch_send call. Individual mode sends each
  item as a separate request.
- >-
  NDJSON combines payloads with newline separators, using json.dumps with default=str
  to serialize non-JSON-serializable fields. No trailing newline exists.
- >-
  Object naming for batches uses current UTC time and a UUID suffix: date/batch-{timestamp}-{uuid}.ndjson.
  Success individuals use response_obj.get("id", ""), and failures use failure-{uuid}.
- >-
  custom gcs_log_id from litellm_params.metadata overrides standard naming entirely, formatted as
  date/custom-{uuid}-{sanitized_id}. If sanitization produces an empty string, the override is skipped.
- >-
  Request-payload retrieval searches three dates in order: start_date, start_date+1, start_date-1.
  It cannot recover individual items from NDJSON batches, only individually-uploaded success objects.
- >-
  Paid-tier eligibility checks (premium_user is True) are removed entirely, not replaced with
  a warning or fallback. betterlite has no paid tier.
review_level: security
