dod:
- text: >-
    GCSBucketLogger.__init__ reads GCS_BATCH_SIZE, GCS_FLUSH_INTERVAL and GCS_USE_BATCHED_LOGGING
    from environment with documented defaults, creates an asyncio queue with max size from
    LITELLM_ASYNCIO_QUEUE_MAXSIZE, calls super().__init__() to initialize GCSBucketBase,
    and launches periodic_flush as an async task.
  proof: [initialization-tests]
- text: >-
    async_log_success_event and async_log_failure_event obtain standard_logging_object from
    kwargs, flush the queue when full to make room without blocking, and enqueue the item
    with payload, kwargs and response_obj. Exceptions are logged and do not propagate.
  proof: [event-enqueue-tests]
- text: >-
    _drain_queue_batch removes items from the queue non-blocking without exceeding batch_size,
    returning a list of up to batch_size items. Empty queue stops the loop.
  proof: [drain-batch-tests]
- text: >-
    _get_config_key extracts bucket_name and path_service_account from standard_callback_dynamic_params,
    falls back to instance defaults, combines them with pipe-delimiter and returns the key.
    Sanitization for logging hashes this key and returns "config-{hex[:8]}".
  proof: [config-key-tests]
- text: >-
    _group_items_by_config partitions items by their config key, returning a dict mapping
    config_key to lists of items with matching keys.
  proof: [grouping-tests]
- text: >-
    _combine_payloads_to_ndjson serializes each item's payload to JSON with default=str,
    joins lines with newline, producing complete NDJSON format.
  proof: [ndjson-tests]
- text: >-
    _send_grouped_batch obtains config and headers, generates current-date batch object name,
    combines payloads, calls _log_json_data_on_gcs and returns success/error counts. Exceptions
    count all items as errors.
  proof: [grouped-batch-tests]
- text: >-
    _send_individual_logs iterates items and calls _send_single_log_item for each.
  proof: [individual-logs-tests]
- text: >-
    _send_single_log_item obtains config and headers, generates object name, calls
    _log_json_data_on_gcs with the single payload, logs exceptions without propagating.
  proof: [single-item-tests]
- text: >-
    async_send_batch drains up to batch_size items; if use_batched_logging is true,
    groups by config and sends grouped batches; otherwise sends items individually.
    Empty drain does nothing.
  proof: [async-send-tests]
- text: >-
    _get_object_name checks for error_str to determine success vs failure naming,
    reads custom gcs_log_id from litellm_params.metadata, sanitizes it and uses it to
    override the standard date/id naming.
  proof: [object-naming-tests]
- text: >-
    get_request_response_payload tries start_time_utc, start_time_utc+1 day and start_time_utc-1 day,
    generates success object names by date, calls download_gcs_object and deserializes JSON.
    Returns None if all three dates fail.
  proof: [payload-retrieval-tests]
- text: >-
    _generate_success_object_name formats as date/response_id and _generate_failure_object_name
    as date/failure-{uuid}. _get_object_date_from_datetime formats as YYYY-MM-DD.
  proof: [naming-format-tests]
- text: >-
    flush_queue calls async_send_batch and updates last_flush_time. periodic_flush sleeps
    flush_interval seconds in a loop and calls flush_queue, logging when each flush completes.
  proof: [flush-tests]
checks:
  optional: []
  commands:
  - id: initialization-tests
    why: __init__ must read environment, create queue and launch periodic flush
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::initialization_behaviors::tests::/) - test(/::replays_corpus$/)'
  - id: event-enqueue-tests
    why: Success and failure events must enqueue items and flush when queue is full
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::event_enqueue_behaviors::tests::/) - test(/::replays_corpus$/)'
  - id: drain-batch-tests
    why: Queue drain must respect batch_size limit and handle empty queue
    run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^gcs_bucket_logging::drain_batch_behaviors::tests::/) - test(/::replays_corpus$/)'
  - id: config-key-tests
