  - tools/oracle/cases/helpers/mcp-server-auth-lookup/lookup-no-match.yaml

deviations:
  - what: The helpers take the client ip, the user id and the toolset name as plain arguments, where LiteLLM reads them from the FastAPI request, the auth object and Query defaults.
    why: Rust handlers extract typed values, so the _as_query_str guard that drops FastAPI's unresolved Query default has no counterpart and is not built.
  - what: resolve_allowed_servers_with_ip_filter returns the allowed records in registry order.
    why: LiteLLM iterates a Python set, so its order is unspecified; a fixed order keeps the response stable.
  - what: "A missing database in resolve_acting_auth is status 500 with an object detail whose error is \"Database not available. Connect a database to your proxy\", the same body LiteLLM builds, returned through RestAccessError::Http."
    why: the port reports a missing database as a typed error instead of raising from a global lookup.

out_of_scope:
  - "_resolve_allowed_mcp_servers_for_tool_call (L790-L812): no caller at the pin; B4728's call route uses the ip filter version instead."
  - "_as_query_str: Rust extractors give Option<String> directly, see deviations."
  - "_list_server_tools, _get_tools_for_single_server, fetch_pinnable_tool_catalog, _list_tools_for_single_server, _create_tool_response_objects and the /tools/list route: B4727."
  - "_stamp_mcp_tool_metadata, the post-call logging wrappers, _relay_upstream_auth_http_exception, _handle_virtual_mcp_tool and the /tools/call route: B4728."
  - "The connection error messages, _extract_credentials, _stage_server_test, _execute_with_mcp_client and the /test routes: B4729 and B4730."
  - "client_headers readers (_get_mcp_auth_header_from_headers, _get_mcp_server_auth_headers_from_headers, _get_oauth2_headers_from_headers) and RawHeaders: B4654. get_mcp_client_ip: B743."
  - "acting_user_auth and build_effective_auth_contexts: B4672. get_allowed_mcp_servers: B6591. server_by_id, server_by_name and is_accessible_from_ip: B4731. get_toolset_by_name_cached: B6592. to_server_spec: B4667."
  - "get_user_oauth_credential and list_user_oauth_credentials: B4713. resolve_valid_user_oauth_token: B4715."

pitfalls:
  - "lookup_mcp_server_auth_in_headers lowercases the map keys but not the alias it looks up by, then tries the lowercase form first and the sanitized form second; an alias like 'My Server' matches the header key my_server only through the sanitized form."
  - "A group header is a default only when all matching groups carry equal values; one group with no header and one with a header still returns that header, and two groups with different values return nothing."
  - "_get_server_auth_header checks the per-server map for truthiness, so an empty map falls through to the shared x-mcp-auth header."
  - "is_v1_oauth2_server asks to_server_spec, not auth_type alone: an oauth2 server with a client_credentials flow belongs to the new resolver and gets no stored-token header here."
  - "With prefetched credentials, resolve_valid_user_oauth_token still runs for the entry (it may refresh), and a server id missing from the map passes None to it, not an error."
  - "The 404 for an unknown server and the 403 for an ip block look the requested id up with server_by_id and server_by_name and no client ip, so a server hidden from the caller's ip is still found and reported as ip_filtering, not as not found."
  - "A requested server name is only resolved to an id when that id is already in the filtered allowed set; otherwise the raw text is compared and the refusal quotes the raw text."
  - "The toolset 404 detail is a plain string while every other refusal here is an object with error and message."
  - "resolve_acting_auth never touches a toolset when the name is empty text, the same as an absent name."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
