dod:
  - text: sanitize_alias_for_header lowercases, trims, turns each character outside a-z, 0-9 and underscore into one underscore, collapses underscore runs and trims underscores, and matches LiteLLM on mixed case, spaces, dashes and non-ASCII input.
    proof: [header-tests, oracle]
  - text: lookup_server_auth tries the lowercase and sanitized form of the alias, then of the server name, before the access groups, uses a group default only when every matching group carries the same value, and returns None for an ambiguous or empty case.
    proof: [header-tests, oracle]
  - text: server_auth_header returns the per-server value when one resolves and the shared header otherwise, and extract_mcp_headers returns the shared header, the per-server map and the full header map from B4654's readers without a global.
    proof: [header-tests]
  - text: is_v1_oauth2_server is true only for an oauth2 server that to_server_spec leaves to v1, and v1_oauth2_server_ids skips ids the registry does not know.
    proof: [user-token-tests]
  - text: user_oauth_extra_headers returns a Bearer Authorization header for a usable stored token, reads the prefetched map instead of the store when given one, and returns None with a warning for every failure, the missing database included.
    proof: [user-token-tests]
  - text: prefetch_user_oauth_creds returns the user's credentials by server id, an empty map without a user id, and an empty map with a warning on a store error.
    proof: [user-token-tests]
  - text: resolve_server_id_for_rest maps a server name or alias to its id only when that id is allowed, and otherwise returns the input unchanged.
    proof: [allowed-tests]
  - text: filter_server_ids_by_ip_with_info passes the list through without an ip, drops blocked and unknown ids, and counts only blocked records.
    proof: [allowed-tests]
  - text: resolve_allowed_servers_with_ip_filter unions every effective context, filters by ip, returns the allowed records with the canonical id, and refuses with the exact ip_filtering 403, server_not_found 404 or access_denied 403 payload in LiteLLM's order.
    proof: [allowed-tests]
  - text: resolve_acting_auth returns the acting user for no toolset name, a 404 with plain text for an unknown toolset, a 500 object detail without a database, and the toolset scoped auth otherwise.
    proof: [acting-tests]
  - text: LiveRestReads maps store results and errors to the port values, and a missing database to the documented message.
    proof: [reads-tests]
  - text: The oracle helper cases for the alias sanitizer and the server auth lookup agree with LiteLLM, and the helper adapter is typed and lint clean.
    proof: [oracle, helper-python, helper-case-corpus]

checks:
  optional: []
  commands:
    - id: header-tests
      why: the alias sanitizer, the server auth lookup or the header extraction is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^rest_access::headers::tests::/)'
    - id: user-token-tests
      why: the stored OAuth2 token header, the prefetch or the v1 resolved test is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^rest_access::user_tokens::tests::/)'
    - id: allowed-tests
      why: the server id resolution, the ip filter or the allowed server refusals are missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^rest_access::allowed::tests::/)'
    - id: acting-tests
      why: the acting credential or the toolset name branch is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^rest_access::acting::tests::/)'
    - id: reads-tests
      why: the production token reads or their error mapping are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::rest_reads::tests::/)'
    - id: helper-python
      why: the helper adapter is missing or fails strict Python checks
      run: test -f tools/oracle/helpers/b4726.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no new b4726 operation reaches the shared helper case parser
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-server-auth-lookup-*')" && grep -rlq b4726 tools/oracle/fuzz/corpus/helper_case/mcp-server-auth-lookup-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

