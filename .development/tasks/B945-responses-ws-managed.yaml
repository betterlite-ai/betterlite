id: B945
title: Responses ws managed
description: >-
  Implement the four whole callables in litellm/responses/streaming_iterator.py that service a
  managed Responses WebSocket turn over LiteLLM's asynchronous HTTP Responses call:
  _stream_and_forward L2862-L2890, _save_turn_history L2892-L2911, _process_response_create
  L2917-L2990, and run L2996-L3016. The caller supplies raw WebSocket text and this service
  has no route, HTTP status, query parameter, environment variable, config key, or database
  write. Its only persistence is the connection-local _session_history map. B944 owns the
  map and preparation helpers, B942 owns the quota callback, B932 owns litellm.aresponses,
  and B901 owns the transcript driver. Put the Rust service and typed injected test records
  in the listed core and oracle paths; add no decoder or fuzz target.

  For raw not-json, B944's parser results in exactly one JSON error frame with type error,
  nested error.type invalid_request_error, and nested error.message Invalid JSON in
  response.create event. For {"type":"ping"} and every parsed object whose exact type is
  not response.create, send no frame and perform no quota callback, provider call, or history
  write. B944 owns valid non-object JSON behavior and the response-create allowlist; B945
  passes the parsed request through without adding fields.

  A response-create whose selected source has generate: false is a local warmup. B944 selects
  the nonempty nested response object, otherwise the top-level fields except type. B945 sends
  no quota request or provider call and drives two acknowledgements in order: response.created
  with response status in_progress, then response.completed with response status completed.
  Each response has object response, output [], usage input_tokens 0, output_tokens 0 and
  total_tokens 0, an integer created_at Unix second, and an id matching
  resp_warmup_[0-9a-f]{32}. The model is truthy source model, otherwise model_group,
  otherwise the connection model. Thus nested {"generate":false} on connection model
  openai/gpt-4o-mini with model group router-model acknowledges router-model, while the
  same frame with no model group acknowledges openai/gpt-4o-mini. If either acknowledgement
  send_text raises, the boundary logs ManagedResponsesWS: error sending warmup ack: %s,
  returns normally, sends no error frame, and does not call a provider or write history.

  For non-warmup response-create, call B942's quota gate first with the raw frame and
  model_group or connection model. A callback raising RateLimitError("quota exceeded")
  sends exactly {"type":"error","error":{"type":"rate_limit_exceeded","message":"quota exceeded"}}
  and makes no provider request. Otherwise obtain non-null fields from B925's response-create
  allowlist, set stream to true, pop model and previous_response_id for local routing, and
  resolve a missing model or a requested model equal to the connection model_group to the
  connection model. A requested model that differs from both remains the provider-call model.
  Copy non-None connection api_key, api_base and timeout, and copy custom_llm_provider only
  when B944's same-provider check is true. For connection vertex_ai/gemini-2.0-flash, model
  group router-model, custom provider vertex_ai, and requested model openai/gpt-4o-mini,
  the provider call uses exactly openai/gpt-4o-mini and omits custom_llm_provider. For the
  same-provider alias case with connection openai/gpt-4o-mini, model group router-model,
  and custom provider openai, the call uses openai/gpt-4o-mini and includes
  custom_llm_provider: openai. Copy nonempty litellm_metadata, update the proxy request,
  and apply constructor extra_kwargs last, so an extra stream: false replaces stream: true.
  The proxy body receives input, store, and exactly requested_model or model_group or
  resolved connection model, then non-null tools, tool_choice, instructions and metadata
  in that order.

  Decode previous_response_id before the history lookup. A decoded id beginning resp_warmup_
  is ignored; found history changes provider input to prior_history plus current_messages;
  absent history leaves the exact previous id for B932's database reconstruction. After the
  provider stream, a usable completed id writes exactly once to the connection map with
  prior_history plus current_messages plus extracted output in that order. Missing completion,
  missing/non-string/empty completion id, and provider or stream exceptions write nothing.
  A completion with response.id absent, numeric 7, or empty string therefore produces no map
  write. B944 owns response-id decoding and output extraction; this lifecycle preserves the first
  completion and the ordered map write.

  _stream_and_forward drops None chunks and chunks whose B944 serializer returns None; the
  latter produces debug ManagedResponsesWS: failed to serialize chunk: %s. It captures only
  the first response.completed before sending it, forwards serialized chunks in provider order,
  and on a client send_text exception logs ManagedResponsesWS: error sending chunk to client: %s,
  stops forwarding, returns the captured completion, and permits the history write. A
  provider-call or async-stream exception logs ManagedResponsesWS: error processing response.create: %s,
  sends B944's default error frame with error.type server_error and error.message equal to the
  exception string, and skips history. run processes non-None first_message before receive_text,
  awaits each turn sequentially, logs ManagedResponsesWS: client disconnected: %s and ends
  silently when receive raises, and for an exception escaping the loop logs
  ManagedResponsesWS: unexpected error: %s before sending error.type server_error with message
  Internal server error: <exception>.

  Provider-backed WebSocket transcripts use the mock HTTP provider through B932 and compare
  client frames, provider-call kwargs and body, diagnostics, quota ordering, and ordered
  connection-local history. They exercise both warmup model fallbacks and both credential
  injection branches.

