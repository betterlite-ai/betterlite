deviations: []
out_of_scope:
- 'B944 owns the constructor and helpers L2519-L2860: __init__, _serialize_chunk, _send_error, _get_history_messages, _store_history, _extract_response_id, _extract_output_messages, _input_to_messages, _parse_message, _is_warmup_frame, _is_warmup_response_id, _warmup_source_params, _build_warmup_response, _send_warmup_ack, _build_base_call_kwargs, _apply_history, _resolve_provider, _same_provider, _inject_credentials, and _update_proxy_request; its managed-kwargs skip set is litellm_logging_obj, litellm_call_id, aresponses, _aresponses_websocket, and user_api_key_dict; B945 supplies inputs and observes ordered effects.'
- 'B942 owns _enforce_frame_project_quota L1787-L1814; B945 supplies raw frame text, user key data, and model_group or connection model, and maps only RateLimitError to rate_limit_exceeded.'
- 'B932 owns the asynchronous litellm.aresponses dispatch reached at L2871; B945 supplies the resolved model and kwargs, consumes its async stream, and handles stream failures.'
- 'B925 owns _optional_str, _load_json_object, _is_json_object, _is_json_array, response-create parameter declarations, and shared error/event types consumed by the helper and lifecycle.'
- 'B927, B926, B928, and B943 own the other streaming-iterator functions and native Responses WebSocket forwarding/state ranges; B945 does not duplicate them.'
- 'B901 owns the bounded WebSocket transcript parser, scripted peers, service dispatch registration, and gateway driver; B945 only implements the managed service adapter and its cases.'
- 'B941 and B1125 own gateway route registration, /v1/responses and /responses aliases, authentication, handshake statuses, and route-level failure frames; this task registers no route.'
- 'Provider-specific HTTP transformations remain with their provider tasks; the mock exchange proves the managed request and stream boundary, not provider transformation internals.'
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_ws_managed in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_ws_managed.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_ws_managed.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'The completion discriminator is read from chunk.type before serialization, or from a dict chunk["type"]; a serializer that only inspects emitted JSON can miss the first completion and lose the history write.'
- 'The try around _stream_and_forward begins after quota, routing, history application, credential injection, proxy projection, and extra_kwargs.update; a non-RateLimit quota exception therefore reaches run as Internal server error: <exception>, while a provider exception uses the error processing response.create diagnostic.'
- 'An unknown previous_response_id is popped from the allowlist and then deliberately reinserted by B944; removing it again before B932 prevents cross-connection database reconstruction even though no local map entry exists.'
- 'The first completion is captured before its send, so a later completion cannot replace it; a client failure after that point is a successful history-save path, not the provider-failure path.'
- 'The final call_kwargs.update(self.extra_kwargs) can overwrite model, credentials, proxy metadata, or stream; the explicit stream:false case must inspect the provider call rather than only the pre-update map.'
budget:
  max_changed_lines: 700
  max_new_expects: 0
review_level: security
