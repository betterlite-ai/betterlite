dod:
- text: 'invalid_and_ignored sends one frame for raw not-json with error.type invalid_request_error and message Invalid JSON in response.create event, while {"type":"ping"} sends no frame and makes no quota callback, provider call, or history write.'
  proof: [case-invalid-and-ignored, behavior-tests, oracle]
- text: 'warmup sends no quota/provider request for nested {"type":"response.create","response":{"generate":false,"model":"gpt-4o-mini"}}; it sends response.created/in_progress then response.completed/completed, with model gpt-4o-mini, output [], usage counts 0, integer created_at, and resp_warmup_[0-9a-f]{32}.'
  proof: [case-warmup, behavior-tests, oracle]
- text: 'warmup_model_fallback sends {"type":"response.create","response":{"generate":false}} on connection model openai/gpt-4o-mini with model group router-model and both ack models are router-model; with the model group absent, both ack models are openai/gpt-4o-mini, with no provider or history effect in either variant.'
  proof: [case-warmup-model-fallback, behavior-tests, oracle]
- text: 'warmup_send_failure makes the first warmup send_text raise warmup send failed; the service logs ManagedResponsesWS: error sending warmup ack: %s, emits no error frame, returns normally, and makes no provider request.'
  proof: [case-warmup-send-failure, behavior-tests, oracle]
- text: 'rate_limit runs before provider preparation: RateLimitError("quota exceeded") produces exactly error.type rate_limit_exceeded and message quota exceeded, with zero provider requests.'
  proof: [case-rate-limit, behavior-tests, oracle]
- text: 'routing_and_metadata uses connection openai/gpt-4o-mini, group router-model, and requested router-model to call the provider with model openai/gpt-4o-mini and custom_llm_provider openai; proxy_server_request.body.model remains router-model, its fields are input, store, tools, tool_choice, instructions, metadata in that order, and an extra stream:false replaces stream:true.'
  proof: [case-routing-and-metadata, behavior-tests, oracle]
- text: 'different_provider_model uses connection vertex_ai/gemini-2.0-flash, group router-model, custom provider vertex_ai, and requested openai/gpt-4o-mini; aresponses receives exactly openai/gpt-4o-mini and no custom_llm_provider key, while the proxy body model is openai/gpt-4o-mini.'
  proof: [case-different-provider-model, behavior-tests, oracle]
- text: 'stream_forwarding gives the mock HTTP 200 stream None, serializable chunks, one serializer failure, and two response.completed events; only serializable chunks are sent in source order, ManagedResponsesWS: failed to serialize chunk: %s is logged, and the first completion supplies history.'
  proof: [case-stream-forwarding, behavior-tests, oracle]
- text: 'stream_send_failure yields completion id r-send and then makes send_text raise client send failed; forwarding stops after the failure, ManagedResponsesWS: error sending chunk to client: %s is logged, and decoded id r-send still receives completed turn messages in the map.'
  proof: [case-stream-send-failure, behavior-tests, oracle]
- text: 'two_turn_history stores first completed id r1, then for previous_response_id:r1 sends prior messages before new input, omits the field when history exists, and writes the second turn as prior history plus current messages plus extracted output; a successful write logs ManagedResponsesWS: stored %d messages for response_id=%s.'
  proof: [case-two-turn-history, behavior-tests, oracle]
- text: 'history_fallback_and_failure keeps unknown id missing as previous_response_id:missing in the provider call without a map write; provider exception upstream boom logs ManagedResponsesWS: error processing response.create: %s, sends server_error message upstream boom, and writes no history.'
  proof: [case-history-fallback-and-failure, behavior-tests, oracle]
- text: 'history_guards sends a stream with no response.completed, then completions with response.id absent, numeric 7, and empty string; every variant emits its provider chunks but performs no connection-map write.'
  proof: [case-history-guards, behavior-tests, oracle]
- text: 'run_lifecycle processes first_message before queued frames without overlap, treats receive exception client disconnected as debug ManagedResponsesWS: client disconnected: %s plus silent exit, and turns escaping unexpected boom into debug ManagedResponsesWS: unexpected error: %s plus server_error message Internal server error: unexpected boom.'
  proof: [case-run-lifecycle, behavior-tests, oracle]
- text: 'The managed adapter runs the thirteen named transcripts against the same scripted mock HTTP provider and compares frames, kwargs, diagnostics, and ordered map effects, including both warmup fallback variants and same-provider/different-provider credential injection.'
  proof: [service-python, oracle, new-oracle-cases]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The managed WebSocket module or one of its named lifecycle assertions is absent, incomplete, or only corpus replay.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::/) - test(/::replays_corpus$/)'
  - id: case-invalid-and-ignored
    why: The exact invalid-json frame or silent non-response.create path is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::invalid_and_ignored($|::)/)'
  - id: case-warmup
    why: The nested model warmup acknowledgement, statuses, zero usage, or no-provider effect is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::warmup($|::)/)'
  - id: case-warmup-model-fallback
    why: The model_group and connection-model warmup fallback branches are not both asserted.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::warmup_model_fallback($|::)/)'
  - id: case-warmup-send-failure
    why: The swallowed warmup send exception, diagnostic, and no-error outcome is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::warmup_send_failure($|::)/)'
  - id: case-rate-limit
    why: The rate_limit_exceeded frame or quota-before-provider ordering is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::rate_limit($|::)/)'
  - id: case-routing-and-metadata
    why: Same-provider alias routing, proxy-body field order, credentials, and last-write extra kwargs are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::routing_and_metadata($|::)/)'
  - id: case-different-provider-model
    why: A requested model distinct from both connection model and model_group does not prove exact provider routing and custom-provider omission.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::different_provider_model($|::)/)'
  - id: case-stream-forwarding
    why: None/serializer drops, first-completion capture, ordered sends, or its diagnostic is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::stream_forwarding($|::)/)'
  - id: case-stream-send-failure
    why: A client send failure does not stop forwarding while preserving the captured completion for history.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::stream_send_failure($|::)/)'
  - id: case-two-turn-history
    why: Prior/current/output ordering, previous-id removal, and the successful map-write diagnostic are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::two_turn_history($|::)/)'
  - id: case-history-fallback-and-failure
    why: Unknown-id provider fallback or provider-failure no-write behavior is missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::history_fallback_and_failure($|::)/)'
  - id: case-history-guards
    why: A missing, numeric, or empty completion id, or a stream without completion, incorrectly writes connection history.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::history_guards($|::)/)'
  - id: case-run-lifecycle
    why: First-message precedence, sequential turns, receive disconnect, and outer unexpected-error handling are missing.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::run_lifecycle($|::)/)'
  - id: service-python
    why: The managed WebSocket transcript adapter is absent or fails the locked strict Python checks.
    run: test -f tools/oracle/helpers/responses_ws_managed.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: new-oracle-cases
    why: The branch adds no managed WebSocket transcript, including the two required model-routing transcripts.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/responses-ws-managed)"
