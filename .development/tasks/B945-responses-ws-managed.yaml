  why: These lines establish per-frame ordering from parse and warmup through quota, model routing, history, credentials, proxy projection, extra kwargs, provider failure, and history save.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L2996-L3016
