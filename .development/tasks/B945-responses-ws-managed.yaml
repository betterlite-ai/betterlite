id: B945
title: Responses ws managed
description: >-
  Run managed response.create WebSocket turns over responses-create-call with responses-ws-history and frame policy,
  serializing incremental chunks and committing history only after each turn. Implement the native stream service
  seam B370 will later wrap, without depending on that downstream task.


  B901 transcripts use the service driver managed_responses_turns with typed arguments and scripted client frames.
  Python calls responses.streaming_iterator managed response.create turn service directly with injected transport/clock/logging
  interfaces; Rust calls this production service. No FastAPI route/global proxy state is recreated. Route authentication
  and alias parity are exclusively B941/B1125 gateway-driver transcripts.


  Implement crates/betterlite-core/src/api/responses_ws_managed.rs. Use ResponsesWsManagedInput and ResponsesWsManagedResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions managed_two_turn_history, warmup_then_create, failed_turn_no_history,
  cancel_during_stream under api::responses_ws_managed::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Use B901 kind: websocket transcripts with the typed managed_responses_turns service driver, comparing upstream
  handshake status, negotiated subprotocol, per-direction frame ordering and close code/reason. Route gateway cases
  also compare pre-accept HTTP status. No helper calls a WebSocket route function.


  Callable ownership: litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._stream_and_forward
  (L2862-L2890); litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._save_turn_history (L2892-L2911);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler._process_response_create (L2917-L2990);
  litellm/responses/streaming_iterator.py: ManagedResponsesWebSocketHandler.run (L2996-L3016). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 91 owned nonblank/non-comment/non-docstring Python lines (119 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 111 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 343 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B932 (Responses create call), B942
  (Responses ws frame policy), B944 (Responses ws history), B1087 (Api boundaries), B925 (Responses stream events),
  B901 (Websocket oracle). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
