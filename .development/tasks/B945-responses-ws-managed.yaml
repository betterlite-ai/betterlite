checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::/)
      - test(/::replays_corpus$/)'
  - id: case-managed-two-turn-history
    why: the managed-two-turn-history behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::managed_two_turn_history($|::)/)'
  - id: case-warmup-then-create
    why: the warmup-then-create behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::warmup_then_create($|::)/)'
  - id: case-failed-turn-no-history
    why: the failed-turn-no-history behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::failed_turn_no_history($|::)/)'
  - id: case-cancel-during-stream
    why: the cancel-during-stream behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_ws_managed::tests::cancel_during_stream($|::)/)'
  - id: service-python
    why: the native WebSocket service adapter is absent or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_ws_managed.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/responses-ws-managed)"
