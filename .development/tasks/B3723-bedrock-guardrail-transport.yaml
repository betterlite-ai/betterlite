dod:
  - text: BedrockGuardrail class inherits from both CustomGuardrail and BaseAWSLLM, with class-level use_native_during_call_hook = True.
    proof: [class-declaration]
  - text: __init__ accepts guardrailIdentifier, guardrailVersion, disable_exception_on_block, checks, three threshold parameters (content_filter/prompt_attack/pii_confidence), chunk_budget_chars, contextual_grounding_from_messages, streaming parameters and kwargs; validates that only one API path (checks or guardrailIdentifier+guardrailVersion) is configured.
    proof: [init-signature]
  - text: __init__ calls _set_streaming_params with BedrockGuardrailStreamingParams.from_extras, calls BaseAWSLLM.__init__, and logs initialization with guardrail type and resolved checks.
    proof: [init-setup]
  - text: get_supported_event_hooks returns [pre_call, post_call, during_call, pre_mcp_call, during_mcp_call].
    proof: [event-hooks]
  - text: _normalize_checks accepts BedrockChecksConfigModel or dict, filters to contentFilter/promptAttack/sensitiveInformation, logs warning on unknown keys, and returns None when no usable check remains.
    proof: [normalize-checks]
  - text: _normalize_checks raises ValueError with specific message when all keys are unrecognized or all known-key values are None.
    proof: [normalize-checks-error]
  - text: _load_credentials returns (None, aws_region_name) when bearer_token is not None, preventing AWS credential fetching for bearer requests.
    proof: [bearer-credentials-none]
  - text: _load_credentials calls B591's get_aws_region_name_for_non_llm_api_calls to resolve aws_region_name from optional_params.
    proof: [region-resolution]
  - text: _load_credentials calls B594's get_credentials when bearer_token is None, passing all AWS configuration parameters.
    proof: [credential-fetch]
  - text: _prepare_request calls B591's get_runtime_endpoint to form the base Bedrock endpoint URL from aws_bedrock_runtime_endpoint.
    proof: [endpoint-resolution]
  - text: _prepare_request interpolates guardrailIdentifier/guardrailVersion into /guardrail/{id}/version/{version}/apply when request_path is None (ApplyGuardrail).
    proof: [apply-guardrail-path]
  - text: _prepare_request uses request_path directly when supplied (InvokeGuardrailChecks path).
    proof: [checks-path]
  - text: _prepare_request with bearer token creates unsigned AWSRequest and sets Authorization header to Bearer {token}.
    proof: [bearer-request]
  - text: _prepare_request without bearer token creates AWSRequest, applies SigV4Auth directly, then overrides Authorization header if extra_headers contains one.
    proof: [sigv4-override]
  - text: _sign_and_post calls B173's AsyncHTTPHandler.post with url, body, headers from the prepared request.
    proof: [post-call]
  - text: _sign_and_post propagates HTTPException directly; on other exceptions with httpx.Response, parses error via _parse_bedrock_guardrail_error_response and raises HTTPException.
    proof: [exception-handling]
  - text: _sign_and_post logs guardrail_failed_to_respond when log_transport_failure=True; connection errors log unconditionally.
    proof: [transport-logging]
  - text: >-
      _parse_bedrock_guardrail_error_response extracts message from JSON shapes with
      top-level message, nested error.message, or top-level error string;
      falls back to response.text.
    proof: [error-parsing]
  - text: Module-level constants GUARDRAIL_NAME, _BEDROCK_DYNAMIC_BODY_DENYLIST, _BEDROCK_TOO_LARGE_ERROR_SUBSTRINGS, _BEDROCK_APPLY_GUARDRAIL_MAX_THROTTLE_RETRIES, _BEDROCK_APPLY_GUARDRAIL_BASE_BACKOFF_SECONDS, _BEDROCK_INVOKE_GUARDRAIL_CHECKS_PATH, _BEDROCK_CHECKS_KNOWN_KEYS, _CONTENT_TYPE_TO_QUALIFIER, _GROUNDING_SOURCE_TRUSTED_ROLES are defined and match LiteLLM's values.
    proof: [constants]

checks:
  optional: []
  commands:
    - id: class-declaration
      why: BedrockGuardrail class not found or missing inheritance
      run: grep -q "class BedrockGuardrail.*CustomGuardrail.*BaseAWSLLM" crates/betterlite-bedrock-guardrails/src/*.rs && grep -q "use_native_during_call_hook.*true" crates/betterlite-bedrock-guardrails/src/*.rs
    - id: init-signature
      why: __init__ method signature is missing or incomplete
      run: grep -q "fn __init__" crates/betterlite-bedrock-guardrails/src/*.rs && grep -q "guardrailIdentifier\|guardrail_identifier" crates/betterlite-bedrock-guardrails/src/*.rs && grep -q "checks" crates/betterlite-bedrock-guardrails/src/*.rs
    - id: init-setup
      why: __init__ initialization logic tests fail or are missing
      run: cargo nextest run --locked -p betterlite-bedrock-guardrails --no-tests=fail -E 'test(/^bedrock_transport::init/)'
    - id: event-hooks
      why: get_supported_event_hooks not found or returns incorrect list
      run: grep -q "GuardrailEventHooks::pre_call" crates/betterlite-bedrock-guardrails/src/*.rs && grep -q "GuardrailEventHooks::during_call" crates/betterlite-bedrock-guardrails/src/*.rs
