oracle_cases: []

deviations:
  - what: "Authorization header override happens even after SigV4 signing; LiteLLM preserves this behavior in lines 856-858, allowing explicit auth headers to override signed ones when extra_headers supplies Authorization."
    why: "The guardrail may need to override AWS credentials with a different token or bearer path; preserving the override ensures custom auth semantics are not lost."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L854-858"
  - what: "Bearer token requests skip AWS credential resolution entirely, returning (None, region) from _load_credentials to prevent botocore from fetching ephemeral session credentials."
    why: "When a bearer token is supplied, the request uses AWS's SigV4 bearer flow instead of IAM credentials; fetching credentials in this path would waste resources and risk stale tokens."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L781-782"
  - what: "Error response parsing handles AWS error shapes with nested 'error' keys and falls back to plain text; response.text is used only when JSON decode fails or the shape is unrecognized."
    why: "AWS Bedrock returns errors in multiple formats depending on the source (service vs gateway); parsing both nested and flat shapes ensures no error messages are lost."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2159-2174"

out_of_scope:
  - "CustomGuardrail.__init__, update_in_memory_litellm_params (parent contract) are in B104."
  - "BedrockGuardrailStreamingParams.from_extras is in B104 (guardrail streaming params framework)."
  - "make_bedrock_api_request and all ApplyGuardrail/InvokeGuardrailChecks execution is in B3724/B3725."
  - "Masking, message selection and response building are in B3721."
  - "Chunk management and content splitting are in B3720."
  - "Tracing, logging and usage computation are in B3722."
  - "Native hook dispatch and streaming is in B3726."
  - "AsyncHTTPHandler.post is in B173."
  - "BaseAWSLLM and bedrock_bearer_token are in B590."
  - "get_aws_region_name_for_non_llm_api_calls and get_runtime_endpoint are in B591."
  - "get_credentials and AwsCredentialResolver are in B594."

pitfalls:
  - "Bearer token takes precedence over AWS credentials: _load_credentials returns (None, region) when bearer_token is not None, preventing credential resolution entirely."
  - "Authorization header override happens after SigV4 signing: build the signed request first, then unconditionally replace Authorization if extra_headers supplies one."
  - "The guardrailIdentifier and guardrailVersion are part of the path only for ApplyGuardrail; InvokeGuardrailChecks uses request_path directly without interpolation."
  - "_normalize_checks filters to only three known keys: contentFilter, promptAttack, sensitiveInformation; unknown keys log a warning and are dropped (not an error)."
  - "Retry sleep backoff starts at 0.5 seconds, then 1, then 2; _BEDROCK_APPLY_GUARDRAIL_BASE_BACKOFF_SECONDS is the starting duration, not the final one."
  - "Error response parsing must handle both JSON and text fallback; a malformed response body still returns a message string, never null."
  - "_BEDROCK_CHECKS_PII_LOCATION_KEYS contains four field names (beginOffset, endOffset, messageIndex, contentIndex) that are stripped from sensitiveInformation results before logging to prevent PII reconstruction."
  - "The timeout for HTTP POST is read from self.timeout (inherited from BaseAWSLLM), not hardcoded; ensure BaseAWSLLM sets a default."
  - "_BEDROCK_TOO_LARGE_ERROR_SUBSTRINGS is a tuple of partial error message keywords that B3724 uses to detect size-related failures; keep all lowercase for case-insensitive matching."
  - "log_transport_failure=False suppresses guardrail_failed_to_respond logging for one-shot HTTP errors in the ApplyGuardrail retry loop; connection-level errors still log unconditionally."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
