id: B3723
title: Bedrock guardrail settings and signed transport
description: >-
  Build the BedrockGuardrail class initialization, guardrail/checks configuration resolution,
  credential loading with AWS region discovery, and signed HTTP transport for both ApplyGuardrail
  and InvokeGuardrailChecks APIs. Keep bearer-token requests from fetching AWS credentials
  (return None for credentials when bearer token is present), and preserve explicit Authorization
  header overrides even after SigV4 signing adds its own Authorization header.

  Class initialization reads guardrailIdentifier/guardrailVersion (ApplyGuardrail) or checks
  (InvokeGuardrailChecks) configuration and validates that only one API path is chosen. Set
  streaming parameters from extras and establish the httpx async handler for transport. The
  get_supported_event_hooks method returns a list of the native during-call hook, pre/post/pre-MCP/during-MCP
  event types that this guardrail listens to. The _normalize_checks helper accepts a pydantic
  BedrockChecksConfigModel or dict, filters to only the three known check keys (contentFilter,
  promptAttack, sensitiveInformation), and returns None if no usable check remains.

  _load_credentials reads aws_secret_access_key, aws_access_key_id, aws_session_token, aws_region_name,
  aws_role_name, aws_session_name, aws_profile_name, aws_web_identity_token, aws_sts_endpoint
  and aws_external_id from optional_params. When a bearer_token is supplied, return (None, region)
  without constructing Credentials; when bearer_token is absent, fetch credentials through B594's
  get_credentials method. Resolve aws_region_name by calling B591's
  get_aws_region_name_for_non_llm_api_calls (not the provider wrapper; this guardrail reads its own region
  setting and does not share provider credentials/region logic).

  _prepare_request builds the signed request for POST to a Bedrock guardrail endpoint. Read
  aws_bedrock_runtime_endpoint from optional_params and call B591's get_runtime_endpoint to form
  the base URL. When request_path is None (ApplyGuardrail), interpolate guardrailIdentifier and
  guardrailVersion into the default path /guardrail/{id}/version/{version}/apply; when request_path
  is supplied (InvokeGuardrailChecks at /guardrail-checks/invoke), use it as-is. Encode the body
  to JSON bytes, set Content-Type to application/json, and merge any extra_headers.

  When aws_bearer_token (from B591's bedrock_bearer_token helper) is not None, create an unsigned
  AWSRequest and set Authorization to Bearer {token}. When bearer_token is absent, build an AWSRequest
  and apply SigV4Auth directly to sign the request, then override the Authorization header with any
  extra_headers["Authorization"] if present (the explicit override is preserved even after signing).
  Return the prepared (wire-ready) AWSRequest.

  _sign_and_post submits the signed request via B173's AsyncHTTPHandler.post, passing prepared_request.url,
  prepared_request.body and prepared_request.headers. Catch HTTPException and re-raise it directly.
  On other exceptions, check for an httpx.Response; if present, parse it via _parse_bedrock_guardrail_error_response
  and raise HTTPException with (status_code, message) tuple. Log guardrail_failed_to_respond when
  log_transport_failure=True (the consolidating ApplyGuardrail retry path suppresses per-attempt logging).
  On connection/timeout/other errors (no response), log unconditionally and re-raise the original exception.

  _parse_bedrock_guardrail_error_response decodes error bodies from AWS. Try JSON decode and check for
  {"message": "..."} or {"error": {"message": "..."}} or {"error": "..."}; fall back to response.text if not
  JSON. Return (status_code, message) for HTTPException construction.

  Constants and defaults:
  - GUARDRAIL_NAME = "bedrock"
  - _BEDROCK_DYNAMIC_BODY_DENYLIST = frozenset({"content", "source"}) — fields never replaced by dynamic params
  - _BEDROCK_TOO_LARGE_ERROR_SUBSTRINGS: Bedrock error message keywords indicating a size failure
  - _BEDROCK_APPLY_GUARDRAIL_MAX_THROTTLE_RETRIES = 3
  - _BEDROCK_APPLY_GUARDRAIL_BASE_BACKOFF_SECONDS = 0.5 (retry sleep durations: 0.5, 1, 2 seconds)
  - _BEDROCK_WHITESPACE: compiled regex to detect whitespace
  - _NO_TRACING_DETAIL: empty dict {} for no-detail responses
  - _BEDROCK_INVOKE_GUARDRAIL_CHECKS_PATH = "/guardrail-checks/invoke"
  - _BEDROCK_CHECKS_MAX_CONTENT_BLOCKS = 10 (per-message limit for InvokeGuardrailChecks)
  - _BEDROCK_CHECKS_KNOWN_KEYS = frozenset({"contentFilter", "promptAttack", "sensitiveInformation"})
  - _BEDROCK_CHECKS_PII_LOCATION_KEYS: tuple of field names stripped from sensitiveInformation logs
  - _CONTENT_TYPE_TO_QUALIFIER: dict mapping OpenAI content types to Bedrock qualifiers
  - _GROUNDING_SOURCE_TRUSTED_ROLES = frozenset({"system", "developer"})

  Do not build the apply_guardrail, make_bedrock_api_request or any execution hooks in this task;
  B3724/B3725 own those. Do not implement CustomGuardrail __init__ or update methods; B104 owns
  the guardrail lifecycle and config contracts. BedrockGuardrailStreamingParams.from_extras is
  unresolved (U1); accept it as a call from __init__ and build the _set_streaming_params receiver.

