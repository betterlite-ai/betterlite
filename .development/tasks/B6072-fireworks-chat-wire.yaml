id: B6072
title: Fireworks AI chat request, response, stream chunk and model list transforms
description: >-
  Build fireworks_ai_chat in betterlite-openai (crates/betterlite-openai/src/fireworks_ai_chat.rs and its folder), the wire side of
  FireworksAIConfig and FireworksAIChatCompletionStreamingHandler in litellm/llms/fireworks_ai/chat/transformation.py. It covers
  validate_environment, _transform_tools, _transform_messages_helper, transform_request, _handle_message_content_with_tool_calls,
  transform_response, get_model_response_iterator, _get_openai_compatible_provider_info, get_models, get_api_key,
  _extract_fireworks_hidden_params and chunk_parser. B2222 built the catalog lookups (lines 534 to 651 of that file) and B6071 the option
  mapping; use them. The module makes no HTTP call and reads no env var. The caller passes api_key, api_base and a FireworksEnv value
  from B6070 (the four key variables plus FIREWORKS_API_BASE and FIREWORKS_ACCOUNT_ID, an empty value counts as unset). Ids come from an
  injected id source so cases can fix them.


  Auth. validate_environment resolves the key with B6070 (argument first, then the env chain) and fails with MissingApiKey when none is
  found. It builds headers with B504's chat auth rule (Authorization "Bearer {key}", caller content-type kept in either casing,
  else Content-Type application/json) and then applies B6070 session affinity from litellm_params. This differs from the mixin merge in B6070.
  _get_openai_compatible_provider_info returns (api_base or FIREWORKS_API_BASE or "https://api.fireworks.ai/inference/v1", key chain result).
  get_api_key is the same key chain and is B6070's resolve_api_key.


  Request. transform_request resolves the model with B2222 resolve_resource_name, runs the message helper with that resolved name, and, when
  optional_params.tools is non-None, runs the tool helper. When stream is truthy: stream_options None becomes {include_usage: true}; a map
  keeps its entries and gets include_usage true unless include_usage is explicitly false. Then it calls B503's transform_request with the
  resolved model. The tool helper removes function.strict from each tool of type "function" and, when its parameters value is a map,
  applies B217 unpack_legacy_defs to it; other tool types pass through. The message helper first reads
  capability_exact(resolved_model, supports_vision) from B2222. For each message: a user message with list content is scanned in order;
  a map block of type "file" is a 400 BadRequestError (text says Fireworks AI chat completions does not support file content blocks and
  suggests images or extracted text); an "image_url" block when the exact vision flag is false is a 400 naming the model. Non-map blocks
  are skipped. Then every message loses cache_control through B219 filter_value_from_dict, and the keys provider_specific_fields and
  thinking_blocks.


  Response. transform_response decodes the body with the existing chat response decoder B504 uses (no second JSON parser). A body that is
  not JSON is FireworksError with message "Unable to get json response - ..." plus the raw text, the HTTP status and the headers.
  The model gets the prefix "fireworks_ai/" when it is not None. For each choice,
  when optional_params.tools is non-None, the message content is non-None and tool_calls is None, the content is parsed as a JSON object
  and read as a function: arguments is the "arguments" value (a map is serialized to a JSON string), else the "parameters" map serialized,
  else the empty string; name is the "name" value. If the name differs from "json_tool_call" and is one of the declared tool function
  names, the message gets one tool call {id: fresh uuid4, type: function, function} and content becomes None. Any content that does not
  parse as an object, or has no matching name, is left alone with no error. Hidden params are additional_headers (the response headers
  through B2202's header helper) plus _extract_fireworks_hidden_params: from a payload, "perf_metrics" and "prompt_token_ids" copy to
  fireworks_perf_metrics and fireworks_prompt_token_ids when the key is present; among choices that are maps, fireworks_raw_outputs
  collects each present raw_output and fireworks_token_ids each present token_ids, and a key is added only when at least one choice has it.


  Stream. chunk_parser calls B504's chunk_parser, then runs the same hidden-params extraction on the raw chunk and, when it is non-empty,
  merges it over the parsed chunk's provider_specific_fields (kept entries first). get_model_response_iterator just builds this handler.


  Models. get_models_request(api_base, api_key, env) resolves base and key as above; a missing base or key is a typed error with
  LiteLLM's FIREWORKS_API_BASE or FIREWORKS_API_KEY text, a missing FIREWORKS_ACCOUNT_ID another. It trims trailing "/" and a final "/v1"
  from the base and returns GET "{base}/v1/accounts/{account_id}/models" with only the Authorization Bearer header. decode_models_response(status,
  bytes) fails on a status other than 200 with the status and body in the error, else reads models[].name and returns "fireworks_ai/" +
  name in order. It is the fuzz entry point (1 MiB cap, typed error above it).


  Helper cases (helper b6072) call the pinned FireworksAIConfig and handler with fixed ids and the local model map. LiteLLM size: about
  230 lines.
scope:
  paths:
    - crates/betterlite-openai/src/fireworks_ai_chat.rs
    - crates/betterlite-openai/src/fireworks_ai_chat/**
    - crates/betterlite-openai/fuzz/Cargo.toml
    - crates/betterlite-openai/fuzz/fuzz_targets/fireworks_ai_models_response.rs
    - crates/betterlite-openai/fuzz/corpus/fireworks_ai_models_response/**
    - tools/oracle/cases/helpers/fireworks-ai-chat/**
    - "tools/oracle/fuzz/corpus/helper_case/fireworks_ai_chat-*"
    - tools/oracle/helpers/b6072.py
    - tools/oracle/helpers/b6072/**
    - tools/oracle/src/helpers/openai/b6072.rs
    - tools/oracle/src/helpers/openai/b6072/**
  lint_tables: false
