dod:
  - text: Headers combine the OpenAI auth rule with session affinity, and the base and key lookups follow the env order.
    proof: [fw-chat-tests, oracle]
  - text: Tool and message cleanup strips strict, cache_control and the two extra keys and raises both 400 errors.
    proof: [fw-chat-tests, oracle]
  - text: stream_options and the resolved model reach the OpenAI request transform as LiteLLM sends them.
    proof: [fw-chat-tests, oracle]
  - text: Tool calls sent as content become tool_calls only for declared names, and hidden params carry the Fireworks fields on replies and chunks.
    proof: [fw-chat-tests, oracle, helper-python]
  - text: The model list request and decoder follow LiteLLM, and the decoder rejects over 1 MiB with a typed error and replays its corpus.
    proof: [fw-chat-models-corpus, fw-chat-tests]
  - text: The new helper cases replay through the shared parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: fw-chat-tests
      why: Auth, cleanup, request, reply repair, stream metadata or the model list rule is missing.
      run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^fireworks_ai_chat::/) - test(replays_the_models_response_corpus)'
    - id: fw-chat-models-corpus
      why: The models decoder fuzz target or its replay corpus is missing or fails.
      run: >-
        test -f crates/betterlite-openai/fuzz/fuzz_targets/fireworks_ai_models_response.rs &&
        grep -q 'name = "fireworks_ai_models_response"' crates/betterlite-openai/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/fireworks_ai_models_response)" &&
        cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_models_response_corpus)'
    - id: helper-python
      why: The strict oracle adapter lint or type checks fail.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b6072.py)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: Newly added cases are absent or do not replay.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/fireworks_ai_chat-*")" &&
        grep -lE '^[[:space:]]+b6072:' tools/oracle/fuzz/corpus/helper_case/fireworks_ai_chat-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/fireworks-ai-chat/validate-environment.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/provider-info-and-key.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/tool-cleanup.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/message-cleanup.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/file-and-image-errors.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/stream-options.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/tool-call-in-content.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/hidden-params.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/stream-chunk-fields.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/models-request.yaml
  - tools/oracle/cases/helpers/fireworks-ai-chat/models-response.yaml
deviations:
  - what: The model list is built as a request and a decoder, and the caller sends it; a non-200 status is a typed error with the status and body, not a bare ValueError.
    why: A provider leaf makes no HTTP call, and the compatibility rules ask for typed errors; the status mapping follows B2454.
  - what: A malformed JSON reply is a FireworksError that keeps the raw text, status and headers.
    why: Same as LiteLLM's FireworksAIException; only the transport call moved to the caller.
out_of_scope:
  - B2222 owns lines 534 to 651 of chat/transformation.py (capability lookups, get_model_cost_key, get_provider_info). B6071 owns the option side of FireworksAIConfig. B6070 owns FireworksAIMixin and the key chain.
  - B503 owns the OpenAI transform_request and B504 owns the OpenAI response decoder and chunk_parser this module calls.
  - B2227 owns _complete_fireworks_ai in litellm/main.py and B041 wires the config into dispatch and the HTTP cases.
pitfalls:
  - 'Fireworks sends a tool call as the message content, often as {"name": ..., "parameters": {...}} with no "arguments", so the parameters map must be serialized into arguments.'
  - The repair runs only when optional_params.tools is non-None, content is non-None and tool_calls is None, and the name "json_tool_call" is never converted.
  - The message helper is given the resolved accounts/fireworks/models/... name, so the exact vision lookup uses that name and its short forms.
  - stream_options with include_usage false is kept as false, because the test is "is not False", not truthiness.
  - validate_environment goes through the OpenAI auth rule, which keeps a caller Content-Type in either casing, while the mixin in B6070 appends it only when no content-type header exists.
  - Hidden-params keys appear only when a choice carries the field, so a reply with raw_output on one of two choices lists one entry.
  - get_models strips a trailing "/v1" before appending "/v1/accounts/...", so a base with and without /v1 give the same URL.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
