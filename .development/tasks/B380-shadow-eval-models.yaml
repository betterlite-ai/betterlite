id: B380
title: Shadow evaluation lifecycle response models
description: 'Implement typed ShadowJob, ShadowLeg and lifecycle response construction over B051 stored
  job rows. Derive pending/running/exhausted/stopped status, budget spent and immutable arm/target configuration.
  Keep Decimal spend and omit key secrets. Share these types with B356 writes and B357 reads; no endpoint
  or scheduler is added. Implement the owned native service in crates/betterlite-server/src/shadow_eval_models.rs.
  Add ProbeOperation::ShadowEvalModels in tools/oracle/src/router_probes/mod.rs and the corresponding B380 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/types/management_endpoints/auto_router_endpoints.py:
  ShadowEvalJobTargetResponse.budget_spent (L667-L669), ShadowEvalJobResponse.router_name (L729-L732),
  ShadowEvalJobResponse.status (L736-L752). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
