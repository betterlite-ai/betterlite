checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_file_search_loop::/)
      - test(/::replays_corpus$/)'
  - id: case-file-search-follow-up
    why: the file-search-follow-up behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_file_search_loop::tests::file_search_follow_up($|::)/)'
  - id: case-multiple-vector-stores
    why: the multiple-vector-stores behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_file_search_loop::tests::multiple_vector_stores($|::)/)'
  - id: case-no-tool-call-final
    why: the no-tool-call-final behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_file_search_loop::tests::no_tool_call_final($|::)/)'
  - id: case-failed-search-outcome
    why: the failed-search-outcome behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_file_search_loop::tests::failed_search_outcome($|::)/)'
  - id: case-stream-synthetic-result
    why: the stream-synthetic-result behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_file_search_loop::tests::stream_synthetic_result($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_file_search_loop)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/responses_file_search_loop.rs && grep -qF "decode_responses_file_search_"
      crates/betterlite-core/fuzz/fuzz_targets/responses_file_search_loop.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::responses_file_search_loop::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_file_search_loop.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_file_search_loop-*)"
      && grep -qE "^[[:space:]]+responses_file_search_loop:" tools/oracle/fuzz/corpus/helper_case/responses_file_search_loop-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-file-search-loop)"
