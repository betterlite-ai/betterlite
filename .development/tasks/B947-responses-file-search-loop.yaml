id: B947
title: Responses file search loop
description: >-
  Execute the emulated file-search round using B090's authorized vector-search service and responses-create-call.
  Capture upstream searches, bounded follow-up calls and final output with the split file-search formatter; keep
  user/team authorization attached to every search.


  Implement crates/betterlite-core/src/api/responses_file_search_loop.rs. Use ResponsesFileSearchLooInput and ResponsesFileSearchLooResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions file_search_follow_up, multiple_vector_stores, no_tool_call_final,
  failed_search_outcome, stream_synthetic_result under api::responses_file_search_loop::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::responses_file_search_loop::decode_responses_file_search_(bytes:
  &[u8], limits: &ApiLimits), for json.loads input raw_args at litellm/responses/file_search/emulated_handler.py:455.
  Place its implementation in crates/betterlite-core/src/api/responses_file_search_loop.rs and call it from the
  actual boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/responses_file_search_loop.rs
  passes arbitrary bounded bytes to that exact decoder; api::responses_file_search_loop::tests::replays_corpus replays
  newly committed seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesFileSearchLoop in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the
  re-export) and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_file_search_loop: <typed
  input>}; operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production
  service and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values
  and ordered diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming
  route tasks.


  Callable ownership: litellm/responses/file_search/emulated_handler.py: _run_vector_searches (L140-L178); litellm/responses/file_search/emulated_handler.py:
  _call_aresponses (L392-L395); litellm/responses/file_search/emulated_handler.py: _execute_file_search_tool_calls
  (L440-L486); litellm/responses/file_search/emulated_handler.py: _build_follow_up_input (L489-L512); litellm/responses/file_search/emulated_handler.py:
  aresponses_with_emulated_file_search (L515-L629). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 170 owned nonblank/non-comment/non-docstring Python lines (189 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 190 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 500 total within the 500-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B090 (Vector stores), B171 (Direct helper oracle and URL path encoding), B928 (Response
  synthetic events), B932 (Responses create call), B946 (Responses file search tools), B1087 (Api boundaries), B732
  (Typed authentication principals and grant resolution). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
