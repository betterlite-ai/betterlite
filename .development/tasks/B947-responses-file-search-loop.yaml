pitfalls:
- 'The oracle helper for this task is pre-registered as responses_file_search_loop in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_file_search_loop.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_file_search_loop.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'emulated_handler.py:171 emits the diagnostic "file_search emulated: search failed for query=''%s'', vector_store_id=''%s'':
  %s"; retain its level and fallback instead of turning it into a hard error.'
- 'emulated_handler.py:463 emits the diagnostic "file_search emulated: model picked vector_store_id=%r outside the
  request''s vector_store_ids %s; searching the request''s stores instead"; retain its level and fallback instead
  of turning it into a hard error.'
