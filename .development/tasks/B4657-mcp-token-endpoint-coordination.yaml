out_of_scope:
  - Multi-leg flows that compose the token endpoint client (ID-JAG, token exchange, client credentials). Those live in resolver arms.
  - Credential reading and persistence. OAuthTokenStore implementations are B4656.
  - In-process single-flight without Redis. InProcessRefreshCoordinator lives in B4656.
  - Configuration parsing and validation. No config keys are owned by this task.

pitfalls:
  - "LockAcquisition.ERROR is kept distinct from HELD so the coordinator can tell \"someone else is refreshing\" (wait) from \"the lock backend is down\" (refresh anyway). Conflating them would serve stale tokens on a Redis outage."
  - "The holder renews the lock lease (PX) up to refresh_budget_seconds, not indefinitely, so a hung endpoint doesn't hold losers forever. Losers wait up to wait_timeout_seconds, which must be > refresh_budget_seconds + one lock_ttl_seconds tail; otherwise a loser bails while the holder is still legitimately refreshing and re-reads a still-expired token."
  - "Cache TTL subtracts MCP_OAUTH2_TOKEN_EXPIRY_BUFFER_SECONDS from the lifetime and floors at MCP_OAUTH2_TOKEN_CACHE_MIN_TTL, so a 65-second token that buffers 60 seconds is cached for only 5 seconds, floored to 10. A missing expires_in uses MCP_OAUTH2_TOKEN_CACHE_DEFAULT_TTL (3600 seconds)."
  - "ExchangedTokenCache stores (fingerprint, token) pairs in a weak-keyed dict. An invalidate overlapping a compute reaches the same _KeyGuard and bumps its generation, preventing the compute from storing a token that predates the eviction."
  - "RedisDistributedLock uses Lua scripts for extend and release to check the token still matches, so a holder whose PX-expired lock was re-acquired by another cannot delete the new lock."
  - "Client assertion signing (RFC 7523 JWT) requires client_private_key in SecretStr form and a signing_alg; a missing or invalid field returns CredError.of_misconfigured, not a panic."
  - "The token endpoint POST uses httpx from LiteLLM's handler (get_async_httpx_client) which is partially typed; the boundary is contained in _post_form, which the token endpoint type-checks against _TokenEndpointResponse."

review_level: security

