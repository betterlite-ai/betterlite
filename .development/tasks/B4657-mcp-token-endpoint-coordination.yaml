dod:
  - text: >-
      TokenEndpointClient.fetch signs RFC 7523 JWTs for PrivateKeyJwtAuth (iss, sub, aud, jti, iat, exp fields, 60-second lifetime) and posts grant_params + auth to the endpoint.
      Every error case (2xx required, access_token required, JSON required, JWT signing) maps to the correct CredError variant with the observed behavior.
    proof: [token-endpoint-tests, token-endpoint-coordination-oracle]
  - text: >-
      ExchangedTokenCache memoizes token strings per cache_key with a fingerprint field.
      Concurrent misses on the same key share one endpoint call via a per-key single-flight lock.
      Invalidate evicts the cached token so a subsequent get_or_compute re-mints.
    proof: [token-endpoint-tests]
  - text: >-
      Cache TTL is max(expires_in - MCP_OAUTH2_TOKEN_EXPIRY_BUFFER_SECONDS, MCP_OAUTH2_TOKEN_CACHE_MIN_TTL) with MCP_OAUTH2_TOKEN_CACHE_DEFAULT_TTL used when expires_in is None.
      The four env vars read their defaults from litellm.constants (60, 10, 3600, 500).
    proof: [token-endpoint-tests]
  - text: >-
      RedisRefreshCoordinator acquires a distributed lock to elect one worker to refresh.
      The holder renews the lock lease (every lock_ttl_seconds/2) while refresh runs, up to refresh_budget_seconds total.
      Losers wait for the lock to be released or to expire, then re-read the persisted token.
    proof: [refresh-coordinator-tests, token-endpoint-coordination-oracle]
  - text: >-
      RedisDistributedLock.acquire is SET key token NX PX ttl; extend and release are Lua scripts that check the token matches.
      On any Redis error, acquire returns LockAcquisition.ERROR (distinct from HELD) and extend/is_held degrade gracefully.
    proof: [refresh-coordinator-tests]
  - text: >-
      LockAcquisition is an enum with three values: ACQUIRED (this worker won), HELD (another holds it), ERROR (backend unreachable).
      The coordinator's run method branches on the acquisition result.
    proof: [refresh-coordinator-tests]
  - text: >-
      runtime_refresh_coordinator reads user_api_key_cache from the proxy module and returns RedisRefreshCoordinator if Redis is wired, None otherwise.
      Every credential arm that renews a rotating grant uses one shared coordinator.
    proof: [refresh-coordinator-tests]

