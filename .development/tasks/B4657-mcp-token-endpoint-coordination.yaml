id: B4657
title: MCP token endpoint client and distributed refresh coordination
description: >-
  Build the token endpoint client and distributed refresh coordination in betterlite-server::mcp::outbound_credentials.

  TokenEndpointClient.fetch POSTs one OAuth grant to a token endpoint, authenticating the gateway as a client via RFC 7523 private-key JWT (PrivateKeyJwtAuth) or HTTP Basic auth (ClientSecretAuth from B4650), and returns a minted token or a typed CredError.

  ExchangedTokenCache memoizes the final token string per opaque cache key with per-key single-flight, so concurrent callers share one round-trip and a hit skips the endpoint entirely. A fingerprint field (typically a principal) lets a caller address a slot by something stable while guaranteeing the token was minted for the current inputs. Invalidate evicts one cached token so the next get_or_compute re-mints (e.g. after an upstream 401). The cache stores (fingerprint, token) pairs; anything else in the slot is treated as absent.

  Cache TTL math uses four environment variables from litellm.constants: MCP_OAUTH2_TOKEN_CACHE_DEFAULT_TTL (default 3600 seconds), MCP_OAUTH2_TOKEN_EXPIRY_BUFFER_SECONDS (default 60 seconds, subtracted from lifetime to avoid issuing a token that expires before it can be used), MCP_OAUTH2_TOKEN_CACHE_MIN_TTL (default 10 seconds, the floor even if a short lifetime remains), and MCP_TOKEN_EXCHANGE_CACHE_MAX_SIZE (default 500 entries).

  Redis-distributed refresh coordination ensures one refresh runs per (user_id, server_id) pair across all workers. RedisRefreshCoordinator uses a DistributedLock (injected, Redis in production) to elect one worker to refresh while the rest wait and re-read. The lock is a single-flight optimization, not a correctness mutex: on lock backend failure, the coordinator refreshes anyway rather than wait on a holder that may not exist. The holder renews the lock lease while refresh runs (up to refresh_budget_seconds, default 20), so a hung endpoint doesn't hold losers indefinitely. Losers wait up to wait_timeout_seconds (default 35), which must outlast the holder's max lock-hold (refresh_budget_seconds + one lock_ttl_seconds tail).

  RedisDistributedLock uses SET NX PX / owner-only renew / delete. Acquire is atomic (only the first caller wins; the entry self-expires). Extend renews the PX lease only when the token still matches. Release deletes the key only when it still holds this caller's token, so a holder whose PX-expired lock was re-acquired by another cannot delete the new lock. Is_held is EXISTS. Every key is run through an injected namespace_key before reaching Redis. Transport errors on acquire report LockAcquisition.ERROR (distinct from HELD) so the coordinator refreshes anyway, degrading to "each worker may refresh" instead of serving stale on a Redis blip.

  runtime_refresh_coordinator builds a RedisRefreshCoordinator over the proxy's shared Redis, or returns None when Redis is absent so the caller keeps the foundation's in-process default (correct for a single replica). Shared by every credential arm that renews a rotating grant.

  Every token endpoint call handles errors: 401 and non-2xx HTTP status return CredError.of_upstream_unavailable with the status code; unreachable endpoints (httpx.RequestError, Timeout) also return of_upstream_unavailable with the exception type; non-JSON responses and missing access_token in the JSON both return of_upstream_unavailable with a detail message. Client assertion signing failures (JWT encoding, missing key, invalid algorithm) return CredError.of_misconfigured with "could not sign the client assertion; check client_private_key and client_assertion_signing_alg". The single authenticated POST is owned by this task; multi-leg flows that compose it live in resolver arms.
