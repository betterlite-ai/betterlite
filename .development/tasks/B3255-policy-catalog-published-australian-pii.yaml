id: B3255
title: Published advanced Australian PII catalog record
description: >-
  Retain the published advanced Australian PII record as an independently pinned remote-response fixture. Keep it distinct from the backup version in B3254, which adds example_sentences.
  LiteLLM's published root catalog `policy_templates.json` serves as the remote-response fixture for fetch requests by B3253. This task owns the complete published advanced-au-pii-protection guardrail template record with all guardrailDefinitions (au-pii-tax-identifiers, au-pii-passports, international-pii-identifiers, contact-information-pii, financial-pii, credentials-api-keys, network-infrastructure-pii and protected-class-information).
  Write it to `crates/betterlite-policy/assets/templates/published/advanced-au-pii-protection.json`, a fragment file holding exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  Preserve the exact field order and values from the pinned LiteLLM commit. The record includes the policy_name "advanced-pii-protection-australia", description text, eight guardrails in guardrails_add, no guardrails in guardrails_remove, PII Protection and Australia tags, and 1ms estimated_latency_ms.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/published/advanced-au-pii-protection.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L1-L381
    why: The opening array bracket and complete advanced-au-pii-protection record with all guardrailDefinitions.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/policy_templates.json#L2712-L2712
    why: The closing array bracket.
dod:
  - text: The published fragment holds the complete advanced-au-pii-protection record with all eight guardrail definitions, as one valid JSON object with the published keys in order and no example_sentences.
    proof: [catalog-data]
checks:
  optional: []
  commands:
    - id: catalog-data
      why: the published advanced-au-pii-protection fragment is missing, is not one valid JSON object, or its keys, key order or values differ from the pinned LiteLLM record
      run: |-
        jq -e -s 'length == 1 and (.[0]
          | ["au-pii-tax-identifiers", "au-pii-passports", "international-pii-identifiers", "contact-information-pii", "financial-pii", "credentials-api-keys", "network-infrastructure-pii", "protected-class-information"] as $names
          | keys_unsorted == ["id", "title", "description", "icon", "iconColor", "iconBg", "guardrails", "complexity", "guardrailDefinitions", "templateData", "tags", "estimated_latency_ms"]
          and .id == "advanced-au-pii-protection"
          and .title == "Advanced PII Protection (Australia)"
          and .guardrails == $names
          and [.guardrailDefinitions[].guardrail_name] == $names
          and all(.guardrailDefinitions[].litellm_params; has("guardrail") and has("mode") and has("patterns") and has("pattern_redaction_format"))
          and .templateData.policy_name == "advanced-pii-protection-australia"
          and .templateData.guardrails_add == $names
          and .templateData.guardrails_remove == []
          and .tags == ["PII Protection", "Australia"]
          and .estimated_latency_ms == 1)' crates/betterlite-policy/assets/templates/published/advanced-au-pii-protection.json
oracle_cases: []
deviations: []
out_of_scope:
  - Code that loads or references this catalog. B3252 loads the backup; B3253 fetches the published version.
  - Guardrail implementations referenced by these template records. The records only define policy patterns and metadata.
pitfalls:
  - The fragment must be valid JSON holding one object. Syntax errors break both the local loader and remote fetch fallback.
  - Each guardrailDefinitions entry in this record includes a complete litellm_params block with guardrail, mode, patterns array and pattern_redaction_format. Do not drop any definitions.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
