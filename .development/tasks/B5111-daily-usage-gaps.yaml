dod:
  - text: >-
      Every crates/betterlite-db/migrations/<dir>/migration.sql, every .sql copy under a
      schema_*/fixtures folder and tools/postgres-fixture/fixtures/baseline.sql equals LiteLLM's file
      byte for byte, so its sha256 is the checksum LiteLLM writes to _prisma_migrations. The six folders
      holding them carry "*.sql -whitespace" and git diff --check passes.
    proof:
      - litellm-bytes
      - whitespace-attributes
  - text: >-
      Every MigrationFile sha256 literal, in the production consts and in the fixtures.rs consts,
      equals LiteLLM's sum for its directory, and the schema, row and postgres-fixture tests that load
      these files pass on the restored bytes.
    proof:
      - pinned-consts
  - text: >-
      pinned_sql_checksums is an rstest with 28 cases that each compare a daily usage migration's bytes
      and const with LiteLLM's sum written as a literal, and pinned_sql_catalog_size pins 28 files.
      Today's self-hash version passes for any bytes.
    proof:
      - daily-usage-checksums
  - text: >-
      The five TEXT[] defaults (team_member_permissions, allowed_routes, flat_model_file_ids,
      mcp_servers, vector_stores) are asserted equal to "ARRAY[]::text[]" instead of default.is_some().
    proof:
      - array-defaults
  - text: >-
      seven_counters_widen_preserving_values covers all seven counters on DailyUserSpend,
      DailyTeamSpend and DailyTagSpend, both type and kept value, instead of DailyUserSpend.prompt_tokens
      alone.
    proof:
      - counter-widening
  - text: >-
      nullable_entities_and_distinct_null_uniqueness covers tag, team_id and user_id, instead of
      user_id alone.
    proof:
      - null-entities
  - text: >-
      postgres_catalog_columns pins every column of the 11 tables the cohort creates, and
      postgres_catalog_added_columns pins the columns it adds to five baseline tables: name, type,
      nullability, default, udt_name and precision, in ordinal order.
    proof:
      - catalog-columns
  - text: >-
      No deviation log records a byte change: docs/deviations/B702.yaml, B704.yaml, B705.yaml,
      B706.yaml and B707.yaml are deleted, and neither B703 nor B5111 has one.
    proof:
      - stale-deviations
checks:
  optional: []
  commands:
    - id: litellm-bytes
      why: A migration.sql, a module fixture copy or the postgres-fixture baseline differs from LiteLLM's bytes, so its checksum differs from the one LiteLLM records.
      run: >-
        M=crates/betterlite-db/src/schema_contract/fixtures/sql.sha256 && sed 's#^\([0-9a-f]\{64\}\)  \(.*\)\.sql$#\1  crates/betterlite-db/migrations/\2/migration.sql#' "$M" | sha256sum --check --quiet --strict && for f in crates/betterlite-db/src/schema_*/fixtures/*.sql; do grep -qxF "$(sha256sum "$f" | cut -c1-64)  ${f##*/}" "$M" || { echo "$f differs from LiteLLM"; exit 1; }; done && grep -qxF "$(sha256sum tools/postgres-fixture/fixtures/baseline.sql | cut -c1-64)  20250326162113_baseline.sql" "$M"
    - id: whitespace-attributes
      why: A folder of restored files lacks its .gitattributes, so git diff --check rejects LiteLLM's trailing spaces or final blank lines.
      run: >-
        for d in crates/betterlite-db/migrations crates/betterlite-db/src/schema_identity_history/fixtures crates/betterlite-db/src/schema_policy_resources/fixtures crates/betterlite-db/src/schema_routing_state/fixtures crates/betterlite-db/src/schema_budget_windows/fixtures tools/postgres-fixture/fixtures; do grep -qxF '*.sql -whitespace' "$d/.gitattributes" || { echo "$d/.gitattributes lacks *.sql -whitespace"; exit 1; }; done && git diff --check "$GATE_BASE" HEAD
    - id: pinned-consts
      why: A MigrationFile sha256 literal still holds the hash of the old bytes, or a test that loads the migrations fails on LiteLLM's bytes.
      run: >-
        ! awk -F'"' '/directory: "/{d=$2} /sha256: "/{print $2"  "d".sql"}' crates/betterlite-db/src/schema_*.rs crates/betterlite-db/src/schema_*/migrations.rs crates/betterlite-db/src/schema_*/fixtures.rs | grep -vxFf crates/betterlite-db/src/schema_contract/fixtures/sql.sha256 && cargo nextest run --locked -p betterlite-db -p betterlite-postgres-fixture --no-tests=fail -E '(test(/^schema_(baseline|daily_usage|managed_resources|identity_history|policy_resources|routing_state|budget_windows|contract)::tests::/) | test(/^(resource_rows|identity_rows|team_rows|budget_permission_rows)::tests::/) | package(betterlite-postgres-fixture)) - test(/replays_the_/)'
    - id: daily-usage-checksums
      why: pinned_sql_checksums still compares each file with its own hash instead of LiteLLM's sum, or a case is missing.
      run: >-
        for s in $(sed -n '2,29s/  .*//p' crates/betterlite-db/src/schema_contract/fixtures/sql.sha256); do grep -qF "\"$s\"" crates/betterlite-db/src/schema_daily_usage/tests/pinned_sql_checksums.rs || { echo "pinned_sql_checksums lacks LiteLLM sum $s"; exit 1; }; done && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_daily_usage::tests::pinned_sql_(checksums::|catalog_size$)/)'
    - id: array-defaults
      why: A TEXT[] default is still checked with is_some(), so any default passes.
      run: >-
        F=crates/betterlite-db/src/schema_daily_usage/tests/postgres_resource_defaults.rs && ! grep -qF 'default.is_some()' "$F" && grep -qF 'ARRAY[]::text[]' "$F" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_daily_usage::tests::(team_permissions_and_key_routes_empty_nullable_arrays|managed_file_actor_and_flat_ids|object_permission_empty_arrays_and_four_set_null_foreign_keys)$/)'
    - id: counter-widening
      why: The bigint widening test still covers one counter on one table.
      run: >-
        F=crates/betterlite-db/src/schema_daily_usage/tests/postgres_daily_counters.rs && for c in user_counters team_counters tag_counters; do grep -qF "#[case::$c(" "$F" || { echo "seven_counters_widen_preserving_values lacks case $c"; exit 1; }; done && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_daily_usage::tests::seven_counters_widen_preserving_values::case_/)'
    - id: null-entities
      why: The nullable entity test still covers user_id alone.
      run: >-
        F=crates/betterlite-db/src/schema_daily_usage/tests/postgres_daily_counters.rs && for c in null_user_id null_team_id null_tag; do grep -qF "#[case::$c(" "$F" || { echo "nullable_entities_and_distinct_null_uniqueness lacks case $c"; exit 1; }; done && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_daily_usage::tests::nullable_entities_and_distinct_null_uniqueness::case_/)'
    - id: catalog-columns
      why: No test pins the columns, types, defaults and precision LiteLLM's CREATE and ALTER statements produce.
      run: >-
        D=crates/betterlite-db/src/schema_daily_usage && grep -qxF 'include!("tests/postgres_catalog_columns.rs");' "$D/tests.rs" && for c in daily_user_spend cron_job managed_file_table daily_team_spend daily_tag_spend managed_vector_stores_table mcp_server_table object_permission_table guardrails_table managed_object_table health_check_table team_table verification_token user_table organization_table spend_logs; do grep -qF "#[case::$c(" "$D/tests/postgres_catalog_columns.rs" || { echo "postgres_catalog_columns.rs lacks case $c"; exit 1; }; done && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_daily_usage::tests::postgres_catalog_(added_)?columns::case_/)'
    - id: stale-deviations
      why: A deviation log still records a byte change betterlite no longer makes.
      run: >-
        for t in B702 B703 B704 B705 B706 B707 B5111; do test ! -e "docs/deviations/$t.yaml" || { echo "docs/deviations/$t.yaml records a byte change LiteLLM does not have"; exit 1; }; done
oracle_cases: []
deviations: []
out_of_scope:
  - Padded one-line functions in the schema test files. They belong to B5094. It clears the no-one-line-functions and no-padded-one-line-functions legacy lists. This task does not touch .ast-grep/rules/.
  - The fixed status per error class. B5102 owns it and has merged.
  - migration_deploy and how betterlite writes or recovers _prisma_migrations rows. That is B873's; this task only makes the bytes it hashes equal LiteLLM's.
  - The final schema contract under crates/betterlite-db/src/schema_contract, its sql.sha256 manifest and its sql/ copies. B701 owns them and they already hold LiteLLM's bytes.
  - The test shapes of the other schema modules (B702, B704 to B708). Their pinned_sql_checksums tests keep their form; this task changes only the sha256 literals and fixture bytes they read, and the litellm-bytes check guards their files.
pitfalls:
  - Three LiteLLM files end without a final newline, 20250507161527_add_health_check_fields_to_mcp_servers and 20250806095134_rename_alias_to_server_name_mcp_table in "TEXT; " with a trailing space and 20251119131227_add_prompt_versioning in ");", so copy bytes with cp and never retype a file in an editor that adds a newline.
  - The folder "20251122125322_Add organization_id to spend logs" has spaces in its name, so quote every path and read the manifest with while IFS= read -r, not a for loop over words.
  - ADD_CONFIGS_OVERRIDE_TABLE in schema_policy_resources.rs and PINNED_CONFIG_OVERRIDE in schema_policy_resources/fixtures.rs pin e49454e7f5be2ba0e46da7e5be61900942398f971dcfb0ab70ff4fcef9cfd50e, the sum of 20260220124742_add_spec_path_to_mcp_servers, because LiteLLM's 20260306175056_add_configs_override_table repeats that ALTER; with its extra blank line restored its own sum is f4b1682d40d1999b98215a0677481980372e4cb5659d071e878a343a7a65944b.
  - harness.rs pins sql.sha256's own hash at c2a1e005f73eda0bb5f5496f90299688872f1e56e71f749b52d81009eae0d5ee, so read the manifest and the sql/ copies but never edit them.
  - migration_sql_through and its siblings in support.rs join file bytes with no separator. That stays safe because the three files without a final newline end in ";".
  - The worker sandbox can't reach docker, so the Postgres tests first run in the dispatcher's gate and CI; write Postgres's exact renderings, "ARRAY[]::text[]", "'{}'::jsonb", "'unknown'::text", "'sse'::text", "CURRENT_TIMESTAMP", "0.0", "0" for an integer or bigint counter, "false", data_type "ARRAY" with udt_name "_text", and "timestamp without time zone" with datetime_precision Some(3).
  - CronJob.status reads data_type USER-DEFINED, udt_name JobStatus and column_default 'INACTIVE'::"JobStatus".
  - ALTER COLUMN TYPE and DROP NOT NULL keep a column's ordinal position while ADD COLUMN appends, so after migration_sql_all() DailyUserSpend.user_id, DailyTeamSpend.team_id, DailyTagSpend.tag and ManagedFileTable.file_object are nullable in place and every counter is bigint in place.
  - rstest zero-pads case numbers past nine (case_01_add_daily_user_table), so a filter names the rstest module path and never a case number.
  - B5094 is changing pinned_sql_checksums.rs and schema_baseline/tests/identity.rs; merge main before starting and keep its changes.
review_level: standard
