id: B5111
title: Close the B703 daily usage migration audit gaps
description: >-
  B703 added LiteLLM's 28 migrations from 20250326171002_add_daily_user_table through
  20250707212517_add_mcp_info_column_mcp_servers to crates/betterlite-db/migrations, with their
  MigrationFile consts in crates/betterlite-db/src/schema_daily_usage.rs and Postgres tests under
  crates/betterlite-db/src/schema_daily_usage/tests/. An Opus review after merge found one behavior
  gap and five tests that can't fail on the behavior they name. This task closes all six in the same
  crate and module. The byte gap is not B703's alone, so the task restores every migration file the
  sibling schema tasks changed the same way.


  Gap one, the migration bytes. LiteLLM records the sha256 of each migration.sql's raw bytes in
  _prisma_migrations.checksum. migration_files hashes every file
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migration_recovery.py#L82-L86),
  baseline_current_schema writes those sums into the ledger
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migration_recovery.py#L137-L152),
  and recover_completed_migration and confirms_completion only accept a ledger row whose checksum
  equals the file's sum
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migration_recovery.py#L26-L31
  and https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migration_recovery.py#L52-L65). On main 95 of the 195 files under crates/betterlite-db/migrations differ from
  LiteLLM's. 94 lost a final blank line or a trailing space to a whitespace hook. The 95th,
  20250918083359_drop_spec_version_column_from_mcp_table/migration.sql, moved its statement above
  the /* Warnings */ block LiteLLM's file opens with
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250918083359_drop_spec_version_column_from_mcp_table/migration.sql#L1-L8).
  So for those 95 migrations an operator who shares one database between LiteLLM and betterlite
  gets ledger checksums the other side never matches. By module the 95 are 1 baseline
  (schema_baseline), 28 daily usage (schema_daily_usage), 27 managed resources, 21 identity
  history, 12 policy resources, 5 routing state and 1 budget windows.


  Restore every file byte for byte. crates/betterlite-db/src/schema_contract/fixtures/sql/<dir>.sql
  already holds LiteLLM's exact bytes for all 195 migrations, and
  crates/betterlite-db/src/schema_contract/fixtures/sql.sha256 lists LiteLLM's sum for each one as
  "<sum>  <dir>.sql", in catalog order. Copy with cp from those files, or from
  litellm-proxy-extras/litellm_proxy_extras/migrations/<dir>/migration.sql in the LiteLLM checkout;
  `sha256sum` of the checkout file prints the same sum the manifest lists. The same stale bytes sit
  in 39 test fixture copies (21 in schema_identity_history/fixtures, 12 in
  schema_policy_resources/fixtures, 5 in schema_routing_state/fixtures, 1 in
  schema_budget_windows/fixtures) and in tools/postgres-fixture/fixtures/baseline.sql. Restore them
  from the same copies. Then every MigrationFile sha256 literal takes LiteLLM's sum for its
  directory: 95 production consts in schema_baseline.rs, schema_daily_usage.rs,
  schema_managed_resources.rs, schema_identity_history.rs, schema_policy_resources.rs,
  schema_routing_state/migrations.rs and schema_budget_windows/migrations.rs, and 39 consts in the
  four fixtures.rs files. The awk half of the pinned-consts check prints every stale const as
  "<old sum>  <dir>.sql", and the manifest line for that <dir>.sql holds the sum to write.
  schema_baseline/tests/identity.rs pins PINNED_SHA256 to
  35afca4826335f8bd2bc2b733c0540de51c6a199d39c27a2d1910c53e1a02647 and the baseline length to 15_828
  bytes, LiteLLM's size.


  LiteLLM's files keep trailing spaces and final blank lines, and the gate's whitespace check and CI
  both run git diff --check. Add a .gitattributes file holding the one line "*.sql -whitespace" to
  crates/betterlite-db/migrations, to the four module fixtures folders above and to
  tools/postgres-fixture/fixtures, the way crates/betterlite-db/src/schema_contract/fixtures/.gitattributes
  already does. A parent folder's attribute reaches every nested migration.sql. migration_deploy's
  catalog only reads entries that are folders, so the new file in migrations/ is never taken for a
  migration. The pre-commit global exclude on main already skips crates/betterlite-db/migrations/
  and every /fixtures/ path, so no hook rewrites the files again.


  Once the bytes match, betterlite has no deviation here. There is no docs/deviations/B703.yaml and
  this task adds none. docs/deviations/B702.yaml, B704.yaml, B705.yaml, B706.yaml and B707.yaml
  record only the byte changes this task undoes (a dropped final blank line, a dropped trailing
  space, the moved warning block). They become false, so delete them.


  Gap two. pinned_sql_checksums in schema_daily_usage/tests/pinned_sql_checksums.rs hashes each
  file's bytes and compares the result with the sha256 field of the same const. Both come from the
  committed file, so it passes for any bytes and could not catch gap one. Replace it with an rstest
  named pinned_sql_checksums with 28 cases, one per migration, named after the directory without its
  timestamp (case::add_daily_user_table and so on). Each case carries the catalog position, the
  directory and LiteLLM's sum as a string literal, taken from lines 2 to 29 of sql.sha256. It
  asserts the directory at that position of MIGRATION_CATALOG.files, that the sha256 of the file's
  bytes equals the literal, and that the const's sha256 field equals the literal. A plain test,
  pinned_sql_catalog_size, asserts the catalog holds exactly 28 files.


  Gap three. LiteLLM gives team_member_permissions, allowed_routes and flat_model_file_ids the
  default ARRAY[]::TEXT[]
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250412081753_team_member_permissions/migration.sql#L2,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250416185146_add_allowed_routes_litellm_verification_token/migration.sql#L2,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250522223020_managed_object_table/migration.sql#L2-L4),
  and the same to ObjectPermissionTable.mcp_servers and vector_stores
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250507184818_add_mcp_key_team_permission_mgmt/migration.sql#L14-L19,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250528185438_add_vector_stores_to_object_permissions/migration.sql#L2).
  In postgres_resource_defaults.rs, team_permissions_and_key_routes_empty_nullable_arrays,
  managed_file_actor_and_flat_ids and object_permission_empty_arrays_and_four_set_null_foreign_keys
  only assert default.is_some() for these five columns, so any default passes. Each of the five
  becomes an exact assert that column_default is "ARRAY[]::text[]", Postgres's rendering of that
  default.


  Gap four. 20250509141545_use_big_int_for_daily_spend_tables widens all seven counters
  (prompt_tokens, completion_tokens, api_requests, successful_requests, failed_requests,
  cache_creation_input_tokens, cache_read_input_tokens) to BIGINT on DailyTagSpend, DailyTeamSpend and
  DailyUserSpend
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250509141545_use_big_int_for_daily_spend_tables/migration.sql#L1-L26).
  seven_counters_widen_preserving_values in postgres_daily_counters.rs checks the type and kept
  value of DailyUserSpend.prompt_tokens only, so 20 of the 21 widenings can be dropped and it still
  passes. It becomes an rstest with cases user_counters, team_counters and tag_counters, each giving
  the table and its entity column. Each case migrates through 20250508072103_add_status_to_spendlogs,
  inserts one row with the seven counters set to seven different nonzero values, applies the bigint
  migration, then asserts all seven data types are bigint with one information_schema query and all
  seven values are kept with one SELECT.


  Gap five. 20250526154401_allow_null_entity_id drops NOT NULL on DailyTagSpend.tag,
  DailyTeamSpend.team_id and DailyUserSpend.user_id
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/migrations/20250526154401_allow_null_entity_id/migration.sql#L1-L8).
  nullable_entities_and_distinct_null_uniqueness checks only user_id. It becomes an rstest with cases
  null_user_id, null_team_id and null_tag. Each case asserts the column is nullable after the
  migration and inserts two rows with a NULL entity and the same date, api_key and model, proving
  NULLs stay distinct under the table's unique index.


  Gap six. No test reads the columns LiteLLM's CREATE TABLE statements make: types, nullability,
  defaults such as spend DOUBLE PRECISION DEFAULT 0.0 and created_at TIMESTAMP(3) DEFAULT
  CURRENT_TIMESTAMP, or precision. postgres_catalog only checks index names, so a dropped column or
  a changed default passes. Add tests/postgres_catalog_columns.rs, included from
  schema_daily_usage/tests.rs. postgres_catalog_columns is an rstest with one case per table the
  cohort creates: daily_user_spend, cron_job, managed_file_table, daily_team_spend, daily_tag_spend,
  managed_vector_stores_table, mcp_server_table, object_permission_table, guardrails_table,
  managed_object_table and health_check_table. Each case applies migration_sql_all() and compares
  the table's full column list, in ordinal order, with a literal list written from LiteLLM's SQL
  (the CREATE plus every later ALTER in the cohort). Each entry gives column_name, data_type,
  nullable, column_default, udt_name and datetime_precision, the ColumnSpec shape
  schema_routing_state/tests/support.rs uses. postgres_catalog_added_columns does the same for the
  columns the cohort adds to baseline tables, read by name in ordinal order: team_table
  (team_member_permissions, object_permission_id), verification_token (allowed_routes,
  object_permission_id), user_table and organization_table (object_permission_id), and spend_logs
  (proxy_server_request, session_id, status). Extend columns_in in schema_daily_usage/tests/support.rs
  to also select udt_name and datetime_precision after the five columns it reads now, so column()
  keeps its indexes. The source lines are in the references.


  Foreign-key actions are already pinned by postgres_budget_foreign_key_history.rs and
  object_permission_empty_arrays_and_four_set_null_foreign_keys, so gap six adds no FK test.
