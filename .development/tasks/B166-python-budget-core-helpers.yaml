- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/core_helpers.py#L758-L799
  why: Hidden params cost and header helpers.
dod:
- text: "`BudgetManager` local and hosted flows give LiteLLM's return values, write the same `user_cost.json`, and raise the same errors."
  proof: [budget-manager]
- text: "Every listed core helper returns what LiteLLM's returns on plain, nested, exception-bearing and cyclic inputs, and changes its input the same way."
  proof: [core-helpers]
- text: "`betterlite.utils` names are the same objects as in the parts, and `betterlite.litellm_core_utils.core_helpers` re-exports the helpers."
  proof: [utils-names]
- text: The new modules pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: budget-manager
    why: A budget total, saved file or error differs from LiteLLM's.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_budget_helpers.py -k "budget"
  - id: core-helpers
    why: A core helper returns or mutates differently.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_budget_helpers.py -k "helper"
  - id: utils-names
    why: A utils name is missing or a copy.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_budget_helpers.py -k "utils"
  - id: python-lint
    why: A strict type error in the new modules.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`BudgetManager.create_budget` default `created_at` is read when the class body runs, as in LiteLLM."
  why: Same behaviour, kept on purpose so tests that freeze the clock match.
out_of_scope:
- "The Rust copies of the core helpers belong to B206, B2204 (done), B1717, B1719, B3688 and B3847, and B017 and B024 for their call sites. This task does not call them."
- "`budget_reservation_from_metadata`, `bind_budget_reservation_to_callbacks`, `unbind_budget_reservation_from_callbacks` (B1719), `redact_nested_match_and_regex_keys` (B3688) and `_get_parent_otel_span_from_kwargs` (B3847) are not exposed here."
- "Proxy budget limits, `litellm.budget_manager` wiring in the proxy and the rest of utils.py belong to their own entries."
pitfalls:
- "`user_dict` is saved by a background thread, so tests must join it before reading the file."
- "`created_at=time.time()` as a default is fixed at import time in LiteLLM, and copying that is intended."
- "`safe_deep_copy` has a depth limit and handles exceptions and `datetime`; read L514-L563 before writing it."
- "`filter_exceptions_from_params` stops at `max_depth=20` and must not loop on a cycle."
budget:
  max_changed_lines: 1400
  max_new_expects: 0
review_level: standard
