- B2402 owns provider HTTP update/delete execution and metadata cleanup; this task owns the public SDK wrappers and argument filtering.
- 'litellm/vector_stores/main.py: B1064 owns _direct_vector_store_embedding_executor L46-L53, mock_vector_store_search_response
  L56-L77, mock_vector_store_create_response L80-L105, acreate L109-L169, create L173-L282, asearch L286-L355, search
  L359-L491.'
- 'litellm/vector_stores/main.py: B1065 owns aretrieve L495-L543, retrieve L547-L623, alist L627-L681, list L685-L775.'
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- Within update\'s vector_store_provider_config is None branch, preserve raise ValueError(f'Vector store update
  is not supported for {custom_llm_provider}') and its nested guards.
- update uses kwargs.get('litellm_logging_obj'); retain its missing-value behavior and field spelling in the typed
  projection.
