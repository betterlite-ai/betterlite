id: B1066
title: Vector store update and delete SDK calls
description: >-
  Implement complete aupdate/update and adelete/delete functions from vector_stores/main.py in
  betterlite-core::api::vector_store_write. Omitted custom_llm_provider becomes openai; values containing
  slash go through B174 get_llm_provider for api_type and provider. B010 selects the provider configuration; then
  call B2402's HTTP write service. Keep B011 SDK exception mapping and B012 logging context active in
  both execution modes. The aupdate/adelete flags select async only for boolean true.

  Update overlays kwargs on locals before B1058's create-parameter filter; file_ids and chunking_strategy
  therefore pass on updates. extra_query is accepted but never forwarded. Optional arguments default to
  null. timeout=null or 0 selects REQUEST_TIMEOUT, default 6000 seconds, while a nonzero timeout wins.
  Reuse betterlite-config's existing timeout field and loader. Log model=null, the provider and
  litellm_call_id (null by default), plus update's id/name/filtered params or delete's id alone.
  Neither operation changes the proxy registry.

  Add SdkHttpCall::VectorStoreWrite to B2401, with public SDK calls against the mock in Python and
  production execution in Rust. Implement the named tests below in api::vector_store_write::tests,
  and loads_request_timeout in betterlite-config. Reuse the SDK-case and config YAML decoders; these
  wrappers introduce no byte parser. The four functions contain 247 nonblank/non-comment lines.
  Budget 245 implementation, 155 tests, 90 adapters, 90 fixtures and 50 config/corpus/wiring lines,
  630 total within 650.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_store_write.rs
  - crates/betterlite-core/src/api/vector_store_write/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/**
  - crates/betterlite-config/src/api/vector_store_write.rs
  - crates/betterlite-config/src/api/vector_store_write/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-write-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/vector_store_write.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/vector_store_write.py
  - tools/oracle/cases/sdk-http/vector-store-write/**
  - tools/oracle/fuzz/corpus/sdk_http_case/vector-store-write-*
  - tools/oracle/helpers/b1066.py
  - tools/oracle/helpers/b1066/**
  - tools/oracle/src/helpers/core_ops/b1066.rs
  - tools/oracle/src/helpers/core_ops/b1066/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/main.py#L778-L1062
  why: Whole write functions show provider parsing, update's create-field filtering and the unused extra_query.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/utils.py#L39-L54
  why: B1058 retains recognized non-null create fields without imposing an update schema.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L576
  why: REQUEST_TIMEOUT is converted to float with default 6000 before call-level truthy selection.
dod:
- text: >-
    update_accepts_create_fields sends vs_a,name=notes,metadata={owner:alice,count:2},
    expires_after={anchor:last_active_at,days:3},file_ids=[file_a],chunking_strategy={type:auto},unknown=1.
    Expect POST /v1/vector_stores/vs_a with those five recognized fields, metadata={owner:alice}, no unknown
    and no vector_store_id body field. Null fields disappear; empty name and metadata remain. Mock 200
    {id:vs_a,object:vector_store,name:notes} is returned in sync and async modes.
  proof: [write-tests, oracle, sdk-python]
- text: >-
    write_ignores_extra_query sends update and delete with extra_query={trace:lost},extra_headers={X-Trace:kept}
    and extra_body={name:replacement}. Both requests omit query trace and retain X-Trace=kept. Update's
    body name is replacement; DELETE has no body and returns mock 200
    {id:vs_a,object:vector_store.deleted,deleted:true}. A repository spy records no registry write.
  proof: [write-tests, oracle, sdk-python]
- text: >-
    write_provider_selection compares absent provider with openai; their requests match. Provider
    openai/gpt-4o resolves provider=openai,api_type=gpt-4o before config selection. Unknown not_a_provider
    fails enum conversion with cause "'not_a_provider' is not a valid LlmProviders" and no request.
    Known unsupported anthropic fails with source ValueError
    "Vector store update is not supported for anthropic" or "Vector store delete is not supported for anthropic".
    B011 maps these failures to APIConnectionError,status=500,type=null,param=null,code=null in both modes.
    Record the source cause above; only traceback-dependent failure.message wording may be ignored.
  proof: [write-tests, oracle, sdk-python]
- text: >-
    write_timeout_and_logging passes timeout=null,0,7 with REQUEST_TIMEOUT unset and then 12. The handler
    receives 6000,6000,7 then 12,12,7; B2402 owns client application of that value. Logging carries
    model=null,litellm_call_id=null or the supplied call-a, update's name/filtered fields and delete's id.
    Async execution retains context; integer 1 in aupdate/adelete does not select async.
    loads_request_timeout loads absent=6000,"12"=12 and rejects "bad" through the production config loader.
  proof: [write-tests, config-tests, config-corpus]
- text: >-
    write_provider_errors supplies HTTP 404 with type=invalid_request_error,param=null,code=missing and
    message="vector store not found" for each method. Expect NotFoundError,status=404,type=null,param=null,
    code=null and one captured request; ignore only failure.message for betterlite wording. The SDK code is not replaced
    with the proxy string "404". New vector_store_write corpus seeds cover update and delete.
  proof: [write-tests, oracle, sdk-python, sdk-corpus]
checks:
  optional: [mutants]
  commands:
  - id: write-tests
    why: public writes lose argument filtering, provider selection or logging before the HTTP send
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_write::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: REQUEST_TIMEOUT is declared without being loaded
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::vector_store_write::tests::loads_request_timeout($|::)/)'
  - id: config-corpus
    why: timeout configuration has no new production-decoder coverage
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-write-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: sdk-python
    why: the provider comparison lacks its independent public SDK adapter
    run: test -f tools/oracle/sdk_http/vector_store_write.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: the SDK HTTP decoder has no write-operation seeds
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-store-write-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/vector-store-write/update-accepts-create-fields.yaml
- tools/oracle/cases/sdk-http/vector-store-write/write-ignores-extra-query.yaml
- tools/oracle/cases/sdk-http/vector-store-write/write-provider-selection.yaml
- tools/oracle/cases/sdk-http/vector-store-write/write-provider-errors.yaml
deviations: []
out_of_scope:
- B2402 owns four HTTP write handlers and _handle_error; B668 cleans metadata there after this task filters arguments.
- B1064 owns create/search, mock responses and the direct embedding executor in vector_stores/main.py; B1065 owns list/retrieve.
- B1058 owns VectorStoreRequestUtils and provider contracts; B1131 owns wire records; B527 owns OpenAI transformations.
- B174 resolves provider names, B010 owns config selection/GenericLiteLLMParams, B011 maps SDK exceptions and B012 supplies logging.
pitfalls:
- An update accepts file_ids and chunking_strategy because it uses the create allowlist.
- extra_query appears in the public signature but neither write passes it to the HTTP handler.
- timeout=0 selects REQUEST_TIMEOUT rather than disabling the deadline.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
