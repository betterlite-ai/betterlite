id: B976
title: Messages stream usage
description: >-
  Implement streamed Messages usage/stop-reason retention, initial usage, compaction events, refusal details and
  content-block start decisions. Keep state per response and feed the event driver only typed transitions.


  Implement crates/betterlite-core/src/api/messages_stream_usage.rs. Use MessagesStreamUsageInput and MessagesStreamUsageResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions held_stop_reason_usage, compaction_event_before_text, blank_delta_no_block,
  tool_boundary_new_block, refusal_stop_details under api::messages_stream_usage::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesStreamUsage in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_stream_usage: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper.__init__
  (L320-L366); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper.chunks
  (L369-L372); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper.messages
  (L375-L378); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._merge_usage_into_held_stop_reason_chunk
  (L380-L403); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._handle_choiceless_chunk
  (L405-L423); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._ensure_context_management_attached
  (L425-L438); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._augment_message_delta_usage
  (L440-L472); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._next_compaction_event
  (L474-L525); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._create_initial_usage_delta
  (L527-L546); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._increment_content_block_index
  (L1046-L1047); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._with_refusal_stop_details
  (L1049-L1068); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._delta_has_content
  (L1071-L1107); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._is_blank_delta
  (L1110-L1137); litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py: AnthropicStreamWrapper._should_start_new_content_block
  (L1139-L1201). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 210 owned nonblank/non-comment/non-docstring Python lines (292 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 230 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 480 total within the 480-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B968 (Messages context clear), B975
  (Messages stream split), B1087 (Api boundaries), B966 (Messages chat output), B963 (Messages options). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.
