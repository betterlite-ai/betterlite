id: B976
title: Maintain Messages stream state, usage and compaction blocks
description: >-
  Build api::messages_stream_usage from AnthropicStreamWrapper's constructor/defaults, properties and state
  helpers at adapters/streaming_iterator.py L310-L546 and L1046-L1201. This task never advances a live provider
  stream: B977 and its synchronous part drive these transitions. Store every mutable field per instance, wrap
  the input with B975's splitter, use B966's usage/content translation, B963 refusal helpers and B571's empty
  unsigned-thinking predicate. B968 supplies compaction result records.

  Generate one msg_<UUID> id per instance and report it through an injected B247 logging-state recorder when
  present. B247's task does not yet name record_streamed_anthropic_message_id; keep that narrow setter seam
  explicit for the architect rather than adding logging persistence here. HelperCall::MessagesStreamUsage
  applies finite typed state operations, returning each event and state snapshot; Python constructs a real
  wrapper with an inert input. Normalize only the generated UUID while comparing equality across recording and
  output. No byte parser or provider request is hidden in this helper. Own 301 nonblank/non-comment physical
  lines including defaults. Budget 255 implementation, 170 tests, 160 fixtures, 100 adapters and 35 wiring,
  720 total. Place tests under api::messages_stream_usage.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/messages_stream_usage.rs
  - crates/betterlite-core/src/api/messages_stream_usage/**
  - tools/oracle/src/helpers/core_ops/messages_stream_usage.rs
  - tools/oracle/src/helpers/core_ops/messages_stream_usage/**
  - tools/oracle/helpers/messages_stream_usage.py
  - tools/oracle/helpers/messages_stream_usage/**
  - tools/oracle/cases/helpers/messages-stream-usage/**
  - tools/oracle/fuzz/corpus/helper_case/messages_stream_usage-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py#L310-L546
  why: Per-instance construction, held-stop usage replacement, context edits and one-at-a-time synthetic compaction events.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py#L1046-L1201
  why: Refusal precedence, nonempty-delta predicates and transitions between text, thinking and named tools.
dod:
- text: >-
    stream_state_initialization has index0,type=text,start={type:text,text:""},all sent/queued flags false,
    empty queue/refusal text/tool map/applied edits and null held chunks. Initial usage is exactly input_tokens=0,
    output_tokens=0,cache_creation_input_tokens=0,cache_read_input_tokens=0. Two instances get independent queues,
    mutable block starts and msg_<UUID> ids; the optional recorder receives that exact id once. chunks/messages
    properties forward through the splitter, or return null when absent. Copy the applied-edit list.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    held_usage_replaces_placeholder holds a message_delta with stop_reason=end_turn and usage0/0, then merges
    a chunk whose B966 usage maps to input5,output2,cache_read3. Preserve stop fields, add delta={} if missing,
    replace rather than add usage and attach applied edits only if context_management is absent. Choiceless
    chunk with non-null usage and a held stop queues this result, sets queued_usage_chunk=true and clears the
    held stop. Without both prerequisites return false with no queue or state change. Merge without a held
    stop is an invalid-state error, not an unchecked panic in native code.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    compaction_usage_iterations uses summary iterations [{type:compaction,input_tokens:12,output_tokens:3}]
    and message usage5/2 to append {type:message,input_tokens:5,output_tokens:2}. With0/0 or null/missing counters,
    include only the supplied summary iterations. An existing iterations key, including null/[], blocks replacement;
    absent/non-dict usage also prevents it. iterations_usage=null does nothing but still attaches nonempty
    applied_edits when context_management is absent; an existing context_management=null is retained.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    compaction_three_step_lifecycle starts at index0 with compaction content=S. Consecutive calls yield
    content_block_start index0 content_block={type:compaction,content:""}, content_block_delta index0
    delta={type:compaction_delta,content:S}, then content_block_stop index0. Only the third increments index to1
    and marks sent_compaction_block; none changes sent_content_block_finish. Fourth call returns null. Null/empty
    summary becomes "" in the delta; absent block emits nothing. Flags change only when their event is returned.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    nonempty_delta_predicates accepts only content_block_delta with dict delta and a truthy text,partial_json,
    thinking or signature selected by text_delta,input_json_delta,thinking_delta,signature_delta. Unknown type,
    compaction_delta,empty payload and other outer types return false. A raw chunk is blank only when it has no
    finish,tools,content,refusal,reasoning_content or nonempty/signed thinking block. Signed empty thinking is
    nonblank; all empty unsigned thinking and non-dict entries are blank. A finish_reason="" is still nonblank.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    content_boundary_and_tool_restore supplies text then reasoning then named tool short with map short->long.
    Type change updates current type/start and returns true; tool name is restored to long before storage.
    A further named tool of the same type starts another block; nameless argument continuation does not.
    Same-type text returns false without replacing the current start. A finish chunk returns false before
    refusal collection. Refusal fragments concatenate in arrival order even on same-type content chunks.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    refusal_stop_precedence accumulates "No" and " thanks". A final message_delta end_turn becomes
    stop_reason=refusal,stop_details={type:refusal,category:null,explanation:"No thanks"}; max_tokens remains max_tokens without
    inserted stop_details. Nonterminal content and empty refusal leave the processed event unchanged. Other
    fields in delta and the outer event survive this copied update.
  proof: [behavior-tests, oracle, helper-python]
- text: State fixtures are new, use independent wrapper transitions and select messages_stream_usage through the oracle parser.
  proof: [new-cases, corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: stream usage or a state transition has no adjacent production test
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_usage::/)'
  - id: helper-python
    why: the inert-wrapper comparison is absent or fails strict checking
    run: test -f tools/oracle/helpers/messages_stream_usage.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: corpus
    why: state-transition inputs cannot enter the helper protocol
    run: grep -qE '^[[:space:]]+messages_stream_usage:' tools/oracle/fuzz/corpus/helper_case/messages_stream_usage-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no new usage, refusal or compaction-state fixtures were authored
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-stream-usage)"
oracle_cases:
- tools/oracle/cases/helpers/messages-stream-usage/stream-state-initialization.yaml
- tools/oracle/cases/helpers/messages-stream-usage/held-usage-replaces-placeholder.yaml
- tools/oracle/cases/helpers/messages-stream-usage/compaction-usage-iterations.yaml
- tools/oracle/cases/helpers/messages-stream-usage/compaction-three-step-lifecycle.yaml
- tools/oracle/cases/helpers/messages-stream-usage/nonempty-delta-predicates.yaml
- tools/oracle/cases/helpers/messages-stream-usage/content-boundary-and-tool-restore.yaml
- tools/oracle/cases/helpers/messages-stream-usage/refusal-stop-precedence.yaml
deviations: []
out_of_scope:
- B975 owns adapters/streaming_iterator.py L43-L293 splitter/error helpers; B977 and its sync part own all iteration/SSE methods L548-L1044 and AnthropicSSEStream L1212-L1233.
- B966 owns usage arithmetic and chunk translation; B571 defines empty unsigned thinking, B963 refusal extraction/details.
- B247 owns the logging record setter. Logging persistence and main completion HTTP are not state-helper work.
pitfalls:
- 'The oracle helper for this task is pre-registered as messages_stream_usage in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/messages_stream_usage.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/messages_stream_usage.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Presence of context_management or usage.iterations blocks augmentation even when its value is null.
- The compaction stop advances the index without marking an ordinary content block finished.
- Refusal cannot override max_tokens, and its fragments must accumulate before the terminal event.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
