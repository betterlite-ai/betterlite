    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_usage::/)
      - test(/::replays_corpus$/)'
  - id: case-held-stop-reason-usage
    why: the held-stop-reason-usage behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_usage::tests::held_stop_reason_usage($|::)/)'
  - id: case-compaction-event-before-text
