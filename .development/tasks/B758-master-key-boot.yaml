id: B758
title: Master key startup checks and stored-secret refusal
description: >-
  Implement MasterKeyBootVerdict over configured key origin and stored-ciphertext counts, keeping exact
  refusal categories and exit outcome while using betterlite text. Inject stderr/reporting and terminate
  only in the binary after draining startup work. Existing encrypted data cannot become unreadable through
  an unnoticed master-key change. dangerously_permit_weak_or_unset_master_key=false and LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY=false
  retain the source development override. Refuse None, whitespace-only and the stripped publicly known
  key sk-1234; this code adds no minimum-length or entropy rule for other keys. Count stored secrets only
  for the source migration case; keep the development override warning.


  Build the production master_key_boot module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/master_key_boot_check.py:
  master_key_boot_verdict (L76-L105; 30 source lines), with_stored_secrets_counted (L108-L114; 7 source
  lines), enforce_master_key_boot_verdict (L117-L133; 17 source lines), announce_on_stderr_at_exit (L136-L138;
  3 source lines), _flush_stdout_then_write_stderr (L141-L143; 3 source lines), render_refusal (L146-L153;
  8 source lines), _unsafe_reason (L200-L208; 9 source lines), _config_label (L211-L212; 2 source lines),
  _source_line (L215-L232; 18 source lines), _fix_steps (L235-L238; 4 source lines), _config_steps (L241-L251;
  11 source lines), _key_steps (L254-L272; 19 source lines), _migrate_from_assignment (L275-L278; 4 source
  lines), _migration_lead (L281-L291; 11 source lines).


  Add the master_key_boot operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a master-key-boot-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 146 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  146 production, 157 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 398 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
