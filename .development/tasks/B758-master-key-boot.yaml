deviations: []
out_of_scope:
  - B730 owns the shared MIGRATE_FROM_MASTER_KEY_ENV_VAR name at master_key_boot_check.py L18
    and the stored-value counting/migration service; use its lower config field instead of defining it here.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as master_key_boot in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/master_key_boot.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/master_key_boot.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Only the stripped known default sk-1234 is specially refused; do not invent minimum entropy rules.
