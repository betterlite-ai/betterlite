  - tools/oracle/helpers/azure_native_speech.py
  - tools/oracle/helpers/azure_native_speech/**
  - tools/oracle/cases/helpers/providers/azure-native-speech/**
  - tools/oracle/fuzz/corpus/helper_case/azure_native_speech*
  lint_tables: false
