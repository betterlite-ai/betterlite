checks:
  optional:
  - mutants
  commands:
  - id: case-plain-text-ssml-escaping
    why: The plain-text-ssml-escaping behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::native_speech_cases::case_[0-9]+_plain_text_ssml_escaping$/)'
  - id: case-speed-rate-boundaries
    why: The speed-rate-boundaries behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::native_speech_cases::case_[0-9]+_speed_rate_boundaries$/)'
  - id: case-voice-language
    why: The voice-language behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::native_speech_cases::case_[0-9]+_voice_language$/)'
  - id: case-style-role-element
    why: The style-role-element behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::native_speech_cases::case_[0-9]+_style_role_element$/)'
  - id: case-existing-ssml
    why: The existing-ssml behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::native_speech_cases::case_[0-9]+_existing_ssml$/)'
  - id: case-cognitive-to-tts-endpoint
    why: The cognitive-to-tts-endpoint behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::native_speech_cases::case_[0-9]+_cognitive_to_tts_endpoint$/)'
  - id: case-response-format-header
