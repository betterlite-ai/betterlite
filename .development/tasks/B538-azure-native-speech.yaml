out_of_scope:
- B025 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- 'Function ownership inventory litellm/llms/azure/text_to_speech/transformation.py: AzureAVATextToSpeechConfig.dispatch_text_to_speech
  L62-L134; AzureAVATextToSpeechConfig.get_supported_openai_params L136-L143 belong to B537.'
pitfalls:
- 'The oracle helper for this task is pre-registered as azure_native_speech in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/native_speech.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_native_speech.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A generic XML serializer would escape source attribute values and normalize whitespace, changing the pinned SSML
  request.
- The SSML detector accepts a matching substring in arbitrary text and is not an XML validity check.
