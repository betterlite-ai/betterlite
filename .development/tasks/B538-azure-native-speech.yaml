    AzureAVATextToSpeechConfig._get_voice_language, AzureAVATextToSpeechConfig.map_openai_params, AzureAVATextToSpeechConfig.validate_environment,
    AzureAVATextToSpeechConfig.get_complete_url, AzureAVATextToSpeechConfig._is_cognitive_services_endpoint, AzureAVATextToSpeechConfig._is_tts_endpoint,
    AzureAVATextToSpeechConfig._extract_region_from_hostname, AzureAVATextToSpeechConfig._build_tts_url, AzureAVATextToSpeechConfig.is_ssml_input,
    AzureAVATextToSpeechConfig.transform_text_to_speech_request, AzureAVATextToSpeechConfig.transform_text_to_speech_response.
    Other functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/text_to_speech/transformation.py#L37-L60
