id: B538
title: Azure native SSML synthesis
description: >-
  Add NativeSpeechRequest and typed SSML construction, preserving voice language, speed-to-rate conversion, style/styledegree/role,
  output formats and region hostname detection. Compare an XML writer with the source literal builder; preserve
  its exact string construction and raw-input pass-through, without adding XML validation. Stream binary results
  with configured deadlines.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/text_to_speech/transformation.py:
  AzureAVATextToSpeechConfig._convert_speed_to_azure_rate L145-L161; AzureAVATextToSpeechConfig._build_express_as_element
  L163-L194; AzureAVATextToSpeechConfig._get_voice_language L196-L223; AzureAVATextToSpeechConfig.map_openai_params
  L225-L280; AzureAVATextToSpeechConfig.validate_environment L282-L311; AzureAVATextToSpeechConfig.get_complete_url
  L313-L349; AzureAVATextToSpeechConfig._is_cognitive_services_endpoint L351-L353; AzureAVATextToSpeechConfig._is_tts_endpoint
  L355-L357; AzureAVATextToSpeechConfig._extract_region_from_hostname L359-L369; AzureAVATextToSpeechConfig._build_tts_url
  L371-L375; AzureAVATextToSpeechConfig.is_ssml_input L377-L383; AzureAVATextToSpeechConfig.transform_text_to_speech_request
  L385-L478; AzureAVATextToSpeechConfig.transform_text_to_speech_response L480-L495.


  SSML construction receives typed text/options and XML-escapes only the input text; if passing raw ssml_body through
  unchanged, do not add an XML parser merely to validate it.


  Named case contracts: plain_text_ssml_escaping: For generated SSML replace &,<,>,double quote,single quote in
  that order with &amp;,&lt;,&gt;,&quot;,&apos;. Preserve the pinned newlines/indentation and single-quoted attributes
  around speak/voice/prosody; do not escape rate/voice/lang/style attributes differently. speed_rate_boundaries:
  Convert speed with int((speed-1.0)*100), truncating toward zero, then signed decimal percent: 1.0 gives +0%, 2
  gives +100%, 0.5 gives -50%. Do not clamp to the 0.25..4 docstring range. Absent/None speed adds no mapped rate;
  request assembly defaults missing rate to 0%. voice_language: Only a truthy explicit lang adds xml:lang to voice;
  never infer language from its name. The root speak always has version=1.0, xmlns=http://www.w3.org/2001/10/synthesis
  and xml:lang=en-US, regardless of voice/lang. style_role_element: Copy style/styledegree/role/lang only when present
  in kwargs. Truthy style/styledegree/role wrap prosody in mstts:express-as with attributes in that order and add
  xmlns:mstts=https://www.w3.org/2001/mstts; absent/falsy values do neither. Attribute values are interpolated literally,
  without escaping or validation, as at the pin. existing_ssml: Any case-sensitive substring <speak> or <speak plus
  a space triggers unchanged ssml_body, even if not at the start or invalid XML. Set X-Microsoft-OutputFormat before
  the passthrough; no parser or entity resolution runs. cognitive_to_tts_endpoint: Missing None api_base raises
  ValueError with the Azure AVA required-base diagnostic and both domain examples. Trim trailing slashes; exact
  api.cognitive.microsoft.com or its dot suffix converts to https://<region>.tts.speech.microsoft.com/cognitiveservices/v1,
  dropping original scheme/path/query. TTS domains retain the string if it ends /cognitiveservices/v1, otherwise
  append it; custom bases always append that path. response_format_header: Map mp3/aac/flac to audio-24khz-48kbitrate-mono-mp3,
  opus to ogg-48khz-16bit-mono-opus, wav to riff-24khz-16bit-mono-pcm, pcm to raw-24khz-16bit-mono-pcm; unknown
  formats pass through. Missing response_format defaults MP3. Request overwrites X-Microsoft-OutputFormat with mapped
  output_format, using MP3 only when the key is absent. native_voice_map: Map alloy=en-US-JennyNeural, echo=en-US-GuyNeural,
  fable=en-GB-RyanNeural, onyx=en-US-DavisNeural, nova=en-US-AmberNeural, shimmer=en-US-AriaNeural; other strings
  pass through, non-strings map to None. Request assembly falls back from falsy voice to en-US-AriaNeural. native_speech_headers:
  Copy caller headers; a truthy api_key overwrites Ocp-Apim-Subscription-Key, then overwrite Content-Type=application/ssml+xml
  and User-Agent=litellm. No token is generated here; binary response simply wraps raw_response.


  Write standalone Rust test azure_native_speech_credential_identity_isolation in betterlite-azure: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test azure_native_speech_secret_safe_failure in betterlite-azure: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-azure/src/native_speech.rs with adjacent tests under native_speech/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function native_speech_cases in betterlite-azure with these exact named cases (one per oracle file):
  plain_text_ssml_escaping, speed_rate_boundaries, voice_language, style_role_element, existing_ssml, cognitive_to_tts_endpoint,
  response_format_header, binary_native_speech, native_voice_map, native_speech_headers. Each case exercises its
  named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_native_speech* using HelperCase: kind:
  helper and the externally tagged azure_native_speech variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_native_speech that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 252 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 280 production lines, 235 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 650 planned, 650 maximum changed lines.
