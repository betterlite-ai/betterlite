dod:
  - text: count_outage_alerts counts 408 as Timeout Errors, 500 and above as API Errors and every other code as Unknown Errors, and prints only non-zero counts in that order.
    proof: [outage-message-tests]
  - text: The outage message has the exact layout with Minor or Major, Model or Region name, Provider, API Base only when present, the Errors block and the Last Check seconds rounded to 4 decimals.
    proof: [outage-message-tests]
  - text: Records serialize deployment_ids as a sorted list and read a list back into a set.
    proof: [outage-record-tests]
  - text: The per-deployment detector ignores statuses other than 408 and 500 and above, and ignores a missing status, a missing router lookup and an unknown deployment.
    proof: [outage-deployment-tests]
  - text: The first qualifying error stores a record with outage_alert_ttl and sends nothing, and later updates are stored with no TTL.
    proof: [outage-deployment-tests]
  - text: A Minor alert at level Medium goes out once at the minor threshold, a Major alert at level High once at the major threshold, and the alerts list stops growing at max_outage_alert_list_size.
    proof: [outage-deployment-tests]
  - text: Provider falls back to get_llm_provider when custom_llm_provider is None, and to an empty string when that fails.
    proof: [outage-deployment-tests]
  - text: Any error from the store, the lookup or the sender inside the per-deployment detector is dropped and nothing is raised.
    proof: [outage-deployment-tests]
  - text: The region detector keys its cache on provider plus region name, takes the region from region_name first and then from _get_model_region, and does nothing when neither gives a region.
    proof: [outage-region-tests]
  - text: The region detector never alerts while only one deployment id is recorded, and alerts Minor or Major once the list and the deployment count both qualify.
    proof: [outage-region-tests]
  - text: The first qualifying region error stores a record with region_outage_alert_ttl and sends nothing.
    proof: [outage-region-tests]
  - text: on_failure runs each detector only when its alert type name is listed and the failure is an ApiError, and a region error does not escape.
    proof: [outage-entry-tests]
checks:
  optional: []
  commands:
    - id: outage-message-tests
      why: error counting or outage message layout tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^outage_alerts::.*message/)'
    - id: outage-record-tests
      why: record serialization tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^outage_alerts::.*record/)'
    - id: outage-deployment-tests
      why: per-deployment detector tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^outage_alerts::.*deployment/)'
    - id: outage-region-tests
      why: region detector tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^outage_alerts::.*region/)'
    - id: outage-entry-tests
      why: failure entry point tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^outage_alerts::.*entry/)'
oracle_cases: []
deviations:
  - what: Cached deployment_ids are written as a sorted list.
    why: Python writes list(set), whose order is arbitrary, and a stable order makes tests and cached values repeatable.
  - what: Cache, router lookup, api_base, sender and clock are injected traits, not the proxy logging object's internal_usage_cache, llm_router and litellm.get_api_base.
    why: betterlite has no module state, and betterlite-logging cannot depend on the router or cache crates.
  - what: This task has no oracle cases.
    why: No route reaches this code yet. The wiring umbrella adds the HTTP cases, and the message text is covered by exact-string native tests.
out_of_scope:
  - Registering the alerting callback when daily_reports, outage_alerts or region_outage_alerts is listed (proxy/utils.py L1329-L1338) belongs to the proxy wiring, not this task.
  - async_log_failure_event's daily_reports branch and async_log_success_event belong to B4028, and B8656 calls B4028's update and on_failure from SlackAlerting's two log events.
  - send_alert and the Slack, Teams and webhook delivery behind it belong to B4024 and B4021.
  - The outage_alerts and region_outage_alerts alert type names, SlackAlertingArgs and its defaults belong to B4020.
  - get_llm_provider belongs to B174, _get_model_region to B5365, and Router.get_deployment to B844.
  - litellm.get_api_base (litellm_core_utils/llm_response_utils/get_api_base.py) belongs to B7320, and B7320 builds the real lookup. This task only defines the OutageApiBase trait, and B8656 wires B7320's lookup to it.
  - deployment_in_cooldown (slack_alerting.py L194-L195) is a bare pass and nothing calls it at the pin.
  - The health endpoint test alert for outage_alerts (_health_endpoints.py L506-L507) is owned by the health route task.
pitfalls:
  - Update writes after the first one pass no TTL, so the cache default TTL replaces the 60 second window; do not pass outage_alert_ttl on later writes.
  - The Minor and Major checks are if and elif, so a single call sends at most one alert, and Major is only checked while the minor condition is false.
  - A single error never alerts, because the first error only creates the record and returns; with thresholds of 1 the second error is the first one that can alert.
  - The region detector reads the cache and returns on a bad status after it, so its order is lookup, provider, region, cache read, status check; keep the order for error behavior.
  - The region cache key is provider + region_name with no separator, so "vertex_ai" and "us-east1" give "vertex_aius-east1".
  - len(deployment_ids) > 1 is checked on the set after adding this deployment, and the per-deployment detector has no such check.
  - "A 429 or 401 does not count: only 408 and codes at or above 500 pass the filter, even though the docstring of outage_alerts lists 401 and 429."
  - Python prints round(x, 4) as 3.0 or 0.0001, so the Last Check text must show at least one decimal digit; Rust's Debug format for f64 does this.
  - The per-deployment detector reads the cache before checking the status, and the status check does not remove the cached record.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
