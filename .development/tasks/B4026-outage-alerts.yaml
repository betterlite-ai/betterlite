id: B4026
title: Deployment and provider region outage alerts
description: >-
  Build the outage detector that turns failed requests into "Minor" and "Major" Service Outage alerts, in
  crates/betterlite-logging/src/outage_alerts.rs and src/outage_alerts/. It has two detectors, one per deployment and
  one per provider region, that share a message builder. Both only count errors with status 408 or 500 and above.

  Records. `OutageRecord` (model_id, alerts, minor_alert_sent, major_alert_sent, last_updated_at) and
  `RegionOutageRecord` (provider_region_id, the same four fields, and deployment_ids) are the cached values.
  `alerts` is a list of i64 status codes and `last_updated_at` is Unix seconds as f64. deployment_ids is a
  `BTreeSet<String>` that serializes as a sorted JSON list and reads back from a list, which is what LiteLLM's
  `_prepare_outage_value_for_cache` and `_restore_outage_value_from_cache` do with a Python set. The thresholds and TTLs
  are read from B4020's alert args: outage_alert_ttl 60, region_outage_alert_ttl 60, minor_outage_alert_threshold 5,
  major_outage_alert_threshold 10, max_outage_alert_list_size 10.

  Outside parts come in through small traits defined in this module, so the crate adds no dependency. `OutageStore`
  reads and writes the two record kinds by cache key, and a write takes an optional TTL in seconds. `OutageDeployments`
  looks up a deployment by id and returns a small `OutageDeployment` view (model, custom_llm_provider, region_name,
  vertex_location, aws_region_name, watsonx_region_name) or None, and its error type is a typed error. `OutageApiBase`
  returns LiteLLM's get_api_base for a deployment. B7320 builds the real lookup behind it: `betterlite_models::api_base_lookup::get_api_base`. `OutageSender` calls B4024's send entry point with the message, a
  level, alert type outage_alerts and empty alerting metadata. A clock trait gives the current Unix seconds as f64.
  B8656 wires the real implementations (ProxyLogging's internal usage cache, the router view lookup), so tests use fakes.

  Message text. `count_outage_alerts(alerts)` counts 408 as "Timeout Errors", anything else at 500 or above as "API
  Errors" and the rest as "Unknown Errors", then writes `\n{name}: {count}\n` for each count above zero, in that order.
  `outage_alert_message` builds the Slack text exactly as `_outage_alert_msg_factory` does: header lines `*{key} Name:*
  `{value}``, `*Provider:* `{provider}``, and `*API Base:* `{api_base}`` only when api_base is present, then the
  "Service Outage" title with the warning sign, the Errors block, and `*Last Check:* `{seconds}s ago`` where seconds is
  now minus last_updated_at rounded to 4 decimals and printed like Python prints a float (3.0, 0.0001). Copy the
  blank lines and leading and trailing newlines from the Python source lines 759-785.

  Per-deployment detector, `outage_alerts(status_code, deployment_id)`. The whole body is wrapped in a catch-all, so any
  error from the store, the lookup or the sender ends the call silently and nothing is raised. Read the cached
  OutageRecord first. Return when the status is missing, is not 408 and is below 500, or when no router lookup exists.
  Look up the deployment and return on None. Take model and provider from the deployment. When custom_llm_provider is
  None, resolve the provider with B174's get_llm_provider on the model, and use "" as provider and the unchanged model
  when that fails. api_base comes from OutageApiBase. With no cached record, store a new one (alerts of just this
  status, both flags false, last_updated_at now) with the outage_alert_ttl and return without sending. Otherwise append
  the status when the list is shorter than max_outage_alert_list_size, set last_updated_at, then send a Minor alert
  (level "Medium") when minor_alert_sent is false and the list reached the minor threshold, else a Major alert (level
  "High") when major_alert_sent is false and the list reached the major threshold, and set the matching flag. Finally
  store the record again with no TTL.

  Region detector, `region_outage_alerts(status_code, deployment_id)`. It has no catch-all, so errors return to the
  caller. Return when there is no router lookup or the deployment is None. Provider is custom_llm_provider, or comes from
  get_llm_provider when None (an error here is returned). Region is the deployment's region_name, else B5365's
  `_get_model_region` result for the provider, and return when both are None. The cache key is provider followed
  directly by region_name, with no separator. Read the cached RegionOutageRecord, then apply the same status filter as
  above. With no record, store a new one (deployment_ids holding this id) with region_outage_alert_ttl and return. Else
  append the status under the same cap, add the deployment id, set last_updated_at, and send Minor or Major with the same
  flag and threshold rules plus one more condition: deployment_ids must hold more than one id, so a single bad
  deployment never alerts. The message uses key "Region", the region name and no api_base. Store the record again with
  no TTL.

  Entry point from the failure callback. `on_failure(alert_types, failure, deployment_id)` takes `FailureKind`, either
  `ApiError { status_code: Option<i64> }` or `Other`. Only ApiError triggers anything. It runs outage_alerts when the
  alert type name "outage_alerts" is in alert_types, then region_outage_alerts when "region_outage_alerts" is in it, and
  drops any error from the region call, like the try/except in `async_log_failure_event`. Name the native tests so their
  module path holds message, record, deployment, region or entry, which the five check filters match. deployment_id is the
  deployment's model_info id, "" when missing.
scope:
  paths:
    - crates/betterlite-logging/src/outage_alerts.rs
    - crates/betterlite-logging/src/outage_alerts/**
  lint_tables: false
