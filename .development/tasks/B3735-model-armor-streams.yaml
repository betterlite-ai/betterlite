out_of_scope:
  - Framework dispatch of the streaming iterator hook through callback registration and event type filtering.
  - "should_run_guardrail and log_guardrail_information from the guardrail decorator, owned by B3664."
  - "Anthropic SSE classifiers, framing and assembly helpers (is_anthropic_sse_stream, anthropic_sse_error_frames, assemble_anthropic_sse_stream), owned by B3669."
  - "OpenAIResponsesHandler._extract_output_text_and_images and build_stream_error_items, owned by B3670."
  - "MockResponseIterator and response record constructors, owned by B2214."
  - "add_guardrail_to_applied_guardrails_header callback helper, owned by B189."
  - Non-streaming masking decisions and content rewriting in async_post_call_success_hook (B3734).
pitfalls:
  - "The source's _resolve_streaming_outcome returns (blocked, sanitized_content) where blocked is true even when sanitized_content is None, so failed-closed cases never try to yield a None rewrite."
  - "Terminal error streams are identified by is_sse_error_stream() or by checking that every chunk's type attribute equals 'error', not by catching exceptions."
  - "Responses API deltas come from events whose type attribute starts with 'response.' or is in _RESPONSES_DELTA_EVENT_TYPES; fields are accessed via _RESPONSES_DELTA_FIELD_ATTRS."
  - "A Responses stream cut short before response.done is missing its body, so _final_responses_api_response reads the last response.* event but returns None if the stream ends on an input event or incomplete event."
  - "The source collects all chunks into a tuple before classifying, not streaming; assemble_anthropic_sse_stream expects a restored identity, not the original fragment sequence."
  - "Anthropic SSE error frames are produced by anthropic_sse_error_frames(message) and must be yielded as individual SSE items; MockResponseIterator is used only when the response can be yielded back as OpenAI SSE."
review_level: standard
