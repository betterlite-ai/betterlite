dod:
  - text: Four wire format cases return the correct _StreamSurface discriminant for Anthropic SSE, Responses events, opaque non-Anthropic SSE, and standard chat completion SSE.
    proof: [format-classification]
  - text: Terminal error streams (error-only and SSE errors) pass through without scanning.
    proof: [error-stream-passthrough]
  - text: A stream that cannot be assembled into a scannable response fails closed when fail_on_error is true and forwards unscanned when it is false.
    proof: [assembly-failure-handling]
  - text: For Responses API, every delta field that the terminal body does not contain is collected and scanned alongside the body text.
    proof: [responses-delta-collection]
  - text: When mask_response_content is enabled, de-identify matches without a possible rewrite on the current surface block instead of releasing unscanned content.
    proof: [deidentify-fail-closed]
  - text: Sanitized content replaces message content in every non-empty choice of a ModelResponse; other surfaces are not rewritten.
    proof: [content-rewriting]
  - text: Chat completion streams assemble through stream_chunk_builder; Anthropic streams through assemble_anthropic_sse_stream; Responses through extracting the terminal response body.
    proof: [format-assembly]
  - text: Blocking errors are framed as Anthropic SSE error lines, Responses error events, or generic SSE for opaque surfaces, so create_response() recognizes them as failures.
    proof: [error-framing]
  - text: Oracle cases cover buffered streaming on chat, Anthropic, and Responses surfaces with and without masking, and error cases for assembly failure and deidentify-without-rewrite.
    proof: [streaming-oracle]
checks:
  optional: []
  commands:
    - id: format-classification
      why: _classify_stream does not correctly map all chunk types to their surface
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*classify/)'
    - id: error-stream-passthrough
      why: terminal error streams are scanned or blocked instead of passing through
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*terminal_error/)'
    - id: assembly-failure-handling
      why: unscannable streams fail open when fail_on_error is false or fail closed unconditionally
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*assemble/)'
    - id: responses-delta-collection
      why: delta-only fields in Responses streams are not collected or are lost during assembly
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*responses_delta/)'
    - id: deidentify-fail-closed
      why: de-identify matches without a rewrite target do not block or block when the rewrite is possible
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*resolve_outcome/)'
    - id: content-rewriting
      why: sanitized content is not applied to the right choice(s) or is applied to surfaces that cannot emit it
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*apply_sanitized/)'
    - id: format-assembly
      why: streams do not assemble through the correct builder for their surface type
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*assembly/)'
    - id: error-framing
      why: errors are not framed correctly for their surface or do not reach create_response as terminal items
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^guardrails::model_armor::streams::.*error/)'
    - id: streaming-oracle
      why: buffered streaming responses do not match LiteLLM on chunk content, order or error handling
      run: cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/guardrails/model-armor-streams
