id: B3735
title: Model Armor buffered stream enforcement
description: >-
  Build buffered streaming enforcement for Model Armor's post-call hook that scans responses before they reach the client, covering three wire formats: chat completions, Anthropic messages, and Responses API.

  The async_post_call_streaming_iterator_hook collects all chunks from the response stream, assembles them into a complete response body, scans the full text, and yields back either the original chunks or a sanitized version. For Responses API streams, also extract and scan reasoning and tool-call deltas that do not appear in the terminal response body, since those are visible to the client.

  Three _classify_stream cases map chunks to wire format: raw SSE streams are either Anthropic or opaque, event-type streams with response.* are Responses, and standard OpenAI SSE is chat completions. Terminal error streams (purely error items, or SSE errors from earlier guardrails) bypass scanning. Unscannable streams fail closed unless fail_on_error is disabled.

  When de-identification masking is enabled, _resolve_streaming_outcome decides whether to block or emit sanitized text, checking that the rewrite can be delivered on the current surface. Rewriting Responses and opaque SSE is not possible, so when a de-identify match requires masking, block instead of releasing unscanned content.

  Error frames use anthropic_sse_error_frames for Anthropic, _build_responses_error_items for Responses, and fallback SSE encoding for chat. Both blocking and non-blocking errors are emitted as terminal stream items so create_response() detects them.
