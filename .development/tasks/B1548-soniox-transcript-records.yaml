id: B1548
title: Render Soniox speaker, language and subtitle token records
description: >-
  Add api::soniox::records for common_utils.py and the reachable Soniox transcription configuration
  methods: supported parameters, mapping, environment validation, base URL, error construction and
  _build_response_from_payload. Load SONIOX_API_BASE default https://api.soniox.com and unset
  SONIOX_API_KEY in betterlite-config; soniox_record_settings proves their loader behavior. Truthy
  explicit values precede environment, base loses trailing slashes, and missing key is Soniox 401.
  Build Bearer authorization then overlay caller headers, allowing caller Authorization to win.
  Expose source polling/cleanup constants for the handler without implementing its effects here.

  A truthy language becomes the first language_hints member unless already included; subsequent
  native language_hints input can overwrite that merge. response_format is copied by presence and
  all non-null SONIOX_PASSTHROUGH_PARAMS/HANDLER_ONLY_PARAMS retain their values. Preserve source
  sequence behavior for existing hints. Typed response input can be a transcript or a merged
  transcription/transcript envelope; the presence of transcript selects the envelope even when null.
  Choose plain text by speaker/language token rendering first, then truthy transcript.text, then
  concatenated token text. Speaker changes emit Speaker N: and reset language state; later speaker
  changes insert two newlines. Language changes insert a newline, optional [Translation] prefix and
  language tag, stripping leading whitespace only from that token's text. Translation status alone
  does not force a repeated language tag.

  Reuse B1002 subtitles after dropping translation tokens and projecting text/start_ms/end_ms/speaker;
  retain Python int acceptance for bool timestamp/speaker values. SRT/VTT conversion is selected only
  for a nonempty token list; empty lists follow the ordinary text fallback. Update the supplied
  response, set task=transcribe, best-effort duration from audio_duration_ms/1000, and language only
  when truthy token languages have one unique value. verbose_json emits every token's text and any
  non-null timings, including translation tokens, with strict timing conversion. Preserve existing
  hidden parameters and add soniox_raw containing both selected records. Use Decimal seconds.

  call.soniox_records exercises hints_override, caller_authorization, speaker_language_reset,
  translation_same_language, subtitle_translation_filter, empty_subtitle_tokens, metadata_best_effort
  and verbose_translation_words through actual source methods. These services consume parsed records;
  B1549 will own network JSON decoding. Owned source is 100 common plus 174 reachable transformation
  lines after excluding the two unused HTTP methods; plan 240 implementation/config, 230 tests and
  140 adapters/fixtures, maximum 700 changed lines.
scope:
  paths:
    - crates/betterlite-core/src/api.rs
    - crates/betterlite-core/src/api/**
    - crates/betterlite-core/src/api/soniox.rs
    - crates/betterlite-core/src/api/soniox/**
    - crates/betterlite-core/src/api/soniox/records.rs
    - crates/betterlite-core/src/api/soniox/records/**
    - crates/betterlite-config/src/providers.rs
    - crates/betterlite-config/src/providers/**
    - crates/betterlite-config/src/providers/soniox.rs
    - crates/betterlite-config/src/providers/soniox/**
    - tools/oracle/src/helpers/core_ops/soniox_records.rs
    - tools/oracle/src/helpers/core_ops/soniox_records/**
    - tools/oracle/helpers/soniox_records.py
    - tools/oracle/helpers/soniox_records/**
    - tools/oracle/cases/helpers/soniox-records/**
    - tools/oracle/fuzz/corpus/helper_case/soniox_records*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/soniox/common_utils.py#L15-L168
    why: Provider defaults, speaker/language token rendering and shared subtitle projection.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/soniox/audio_transcription/transformation.py#L36-L271
    why: Native parameter mapping and merged transcript response shaping; unused HTTP methods are excluded below.
dod:
  - text: Loaded Soniox settings and parameter mappings preserve native hint precedence and caller header overlay.
    proof: [soniox-record-tests, oracle, soniox-record-python]
  - text: Speaker/language text, subtitles and verbose words retain their distinct translation and missing-token behavior.
    proof: [soniox-record-tests, oracle, soniox-record-python]
checks:
  optional: [mutants]
  commands:
    - id: soniox-record-tests
      why: Soniox configuration or token-response projection lacks behavior coverage
      run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::soniox::records::/) | test(soniox_record_settings)'
    - id: soniox-record-python
      why: Soniox text/subtitle results do not run against the source implementation
      run: grep -qE '^[[:space:]]+soniox_records:' tools/oracle/fuzz/corpus/helper_case/soniox_records* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/soniox_records.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/helpers/soniox-records/hints-override.yaml
  - tools/oracle/cases/helpers/soniox-records/caller-authorization.yaml
  - tools/oracle/cases/helpers/soniox-records/speaker-language-reset.yaml
  - tools/oracle/cases/helpers/soniox-records/translation-same-language.yaml
  - tools/oracle/cases/helpers/soniox-records/subtitle-translation-filter.yaml
  - tools/oracle/cases/helpers/soniox-records/empty-subtitle-tokens.yaml
  - tools/oracle/cases/helpers/soniox-records/metadata-best-effort.yaml
  - tools/oracle/cases/helpers/soniox-records/verbose-translation-words.yaml
deviations: []
out_of_scope:
  - transform_audio_transcription_request at 141-163 and transform_audio_transcription_response at 164-187 have no caller at the pin on the Soniox dispatch path; its dedicated handler builds requests and calls _build_response_from_payload directly, so omit these HTTP-contract wrappers and their isolated cases.
pitfalls:
  - 'The oracle helper for this task is pre-registered as soniox_records in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/soniox_records.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/soniox_records.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Empty VTT token input can return transcript.text rather than a WEBVTT header.
  - Translation tokens disappear from subtitles but remain in verbose_json words.
  - Native language_hints supplied in the same mapping call overrides the earlier language merge.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 1
