id: B4741
title: MCP client credential headers and discovery fingerprints
description: >-
  Build credential header construction and discovery identity fingerprinting in the MCP client.
  Implement the immutable client settings/credential state that resolves bare username:password,
  encoded Basic ..., case-insensitive schemes, whole-header authorization, token, OAuth bearer forms
  and dictionary credentials into request headers. A named credential slot protected from case-insensitive
  extra-header shadowing preserves the operator's intent; without a named slot, the pin's extra-header
  precedence stands unchanged. Keep a resolved auth flow's authenticated URL and all sorted header pairs
  in its SHA-256 fingerprint, closing the auth flow even on failure. Implementations span five pure functions
  (to_basic_auth, strip_auth_scheme, to_basic_credentials, _strip_header_whitespace, _hash_discovery_auth)
  and six MCPClient methods (__init__, discovery_auth_fingerprint, prepare_request_auth, update_auth_value,
  _header_slot, _get_auth_headers). Fingerprinting previews only _resolved_auth, not _aws_auth; do not
  silently sign the preview. Runtime callers include manager constructors, discovery caches at
  mcp_server_manager.py:4701,4749,4797, and outbound credential adapter prepare_request_auth at
  outbound_credentials/adapter.py:453.

  Unresolved direct callees are litellm/types/mcp.py:319-321 has_header and :324-335 without_header; protocol/auth
  enum and validation records in that file also need a lower owner. See architect question 1; do not add a gateway
  or auth umbrella as a substitute.

  Depends on B002 for config environment lookup (client timeout default). The constructor consumes the feature
  settings from configuration, not a global environment read. Depends on B4652 which creates crates/betterlite-mcp.
scope:
  paths:
    - crates/betterlite-mcp/src/credentials.rs
    - crates/betterlite-mcp/src/credentials_tests.rs
    - crates/betterlite-mcp/src/credentials/**
    - crates/betterlite-mcp/src/credentials_tests/**
  lint_tables: false
