out_of_scope:
  - AWS SigV4 credential acquisition and request signing (B4742).
  - Session transport lifecycle and HTTP session establishment (B4744).
  - Tool listing and execution (B4745).
  - Prompts and resources operations (B4746).
  - Integration with chat and Responses calls (B140).
  - The has_header and without_header helper functions and MCP auth/protocol type definitions in litellm/types/mcp.py.
pitfalls:
  - >-
    The _credential_slot is the single source of truth for which header carries the credential throughout
    the client's lifetime. Every _get_auth_headers call uses it; setting it only at construction from auth_header_name
    or resolved_auth.header_name ensures no derivation divergence.
  - >-
    Dictionary auth_value bypasses scheme processing and slot logic, merging directly into the final headers dict.
    This matches LiteLLM's behavior of carrying operator-defined header dicts as-is.
  - >-
    Base64 validation in to_basic_credentials uses base64.b64decode with validate=True to detect invalid encoding,
    catching the case where a schemed value carries non-base64 text in the credentials part, which means it is a literal
    pair with the scheme text prepended, not a pre-encoded credential.
  - >-
    strip_auth_scheme uses split(None, 1) to split on any whitespace, per the original code. The return value
    is untouched when parts has fewer than 2 elements (no whitespace or no remainder), preserving both a scheme-only
    value and a scheme-less credential.
  - >-
    _strip_header_whitespace runs on the final headers dict, not intermediate auth headers, so whitespace in scheme
    separators (e.g., "Bearer  <token>") is preserved until build time if it comes from the pin's auth_value.
  - >-
    discovery_auth_fingerprint materializes only _resolved_auth, not aws_auth or static headers, so an AWS-signed
    request's dynamic signature is never hashed. The fingerprint is a preview of resolved auth identity, not a
    cryptographic commitment to a signed request.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 2
