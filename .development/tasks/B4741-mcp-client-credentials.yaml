dod:
  - text: >-
      The MCPClient constructor accepts and stores auth_type, auth_value, auth_header_name (credential slot),
      timeout (from B002 config or default), extra_headers, resolved_auth, and aws_auth as passed.
      Bare auth_value is processed through update_auth_value only when provided at construction time.
    proof: [credentials-tests]
  - text: >-
      update_auth_value processes bare username:password strings through to_basic_credentials when auth_type
      is MCPAuth.basic, preserving already-encoded Basic ... credentials and encoding unencoded pairs.
      Dictionary auth_value is stored as-is. All other auth_type variants store the bare value unchanged.
    proof: [credentials-tests]
  - text: >-
      _get_auth_headers produces the complete request headers dict, honoring auth_type Bearer, Basic, api_key,
      authorization, oauth2, token and oauth2_token_exchange; returning empty dict when auth_value is None.
      Dictionary auth_value is merged directly; extra_headers override auth headers unless a credential slot
      is named and that slot carries a credential, in which case extra_headers are filtered to remove the slot case-insensitively.
    proof: [credentials-tests]
  - text: >-
      The _header_slot method returns the configured credential slot (auth_header_name) or falls back to
      the resolved_auth object's header_name attribute when present, or the default slot name argument.
    proof: [credentials-tests]
  - text: >-
      strip_auth_scheme removes a leading scheme and single whitespace separator (case-insensitive match per RFC 7235)
      when present, returning the credential unchanged when the scheme text is absent or incomplete (no separator or empty remainder).
      Surrounding whitespace is preserved for _strip_header_whitespace at header-build time.
    proof: [credentials-tests]
  - text: >-
      to_basic_credentials detects already-encoded Basic ... credentials by scheme stripping and base64 validation,
      forwarding them as-is. Bare username:password strings (including those with scheme text prepended) are base64-encoded.
      Invalid base64 in a schemed value is treated as a bare pair with the scheme text literal, then encoded.
    proof: [credentials-tests]
  - text: >-
      to_basic_auth encodes a string as base64 with UTF-8 encoding.
    proof: [credentials-tests]
  - text: >-
      _strip_header_whitespace removes leading/trailing whitespace from all header keys and values, preserving
      non-string types unchanged (though all values are strings in this client).
    proof: [credentials-tests]
  - text: >-
      discovery_auth_fingerprint returns the SHA-256 hex digest of JSON-encoded (server_url, sorted header pairs)
      from prepare_request_auth. prepare_request_auth builds a POST request to server_url with _get_auth_headers,
      applies _resolved_auth.async_auth_flow if present, and closes the flow even on exception, returning the
      authenticated request. When _resolved_auth is None, the request is returned unchanged.
    proof: [credentials-tests]
  - text: >-
      Every header slot and extra-header interaction is case-insensitive: a slot named "Authorization" shadows
      "authorization" in extra_headers when the slot carries a credential; a named slot protects the operator's
      intended header from override by injected values. Dictionary auth_value merges directly and may override auth headers.
    proof: [credentials-tests]
  - text: >-
      All credential processing functions are pure, total over hostile input and take all parameters explicitly.
      No globals, environment reads, or side effects occur in credential building.
    proof: [mcp-credentials-clippy]
