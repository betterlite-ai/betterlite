id: B712
title: RDS IAM and Azure database token authentication
description: >-
  Implement DatabaseTokenAuth, IamEndpoint and token-expiry parsing with injected AWS credential/token
  and Azure token providers. Use maintained AWS signing and Azure identity libraries, not handwritten
  signing. Match IAM_TOKEN_DB_AUTH and AZURE_POSTGRESQL_AUTH flags (both false by default), conflicting-mode
  errors, token URL quoting and optional expiration. Tokens remain SecretString and logs contain only
  endpoint identity. AWS credential source selection in init_rds_client belongs here; reuse B010 HTTP/provider
  facilities only when actually needed, never spawn aws CLI.


  Use aws-config credential providers and aws-sigv4 directly for the RDS auth signature, plus the maintained
  Azure identity provider; no B010 provider-framework dependency or handwritten signer. Token refresh
  orchestration belongs to B854. Missing writer/reader IAM endpoint fields fail with their exact environment
  names.


  Build the production database_tokens module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/token_auth.py:
  token_auth_flag_enabled (L42-L67; 24 source lines), _quote (L70-L71; 2 source lines), _normalize_quote
  (L74-L82; 8 source lines), IAMEndpoint.build_url (L101-L115; 14 source lines), parse_iam_endpoint_from_url
  (L118-L138; 20 source lines), RdsIamTokenAuth.label (L146-L147; 2 source lines), RdsIamTokenAuth.env_var
  (L150-L151; 2 source lines), AzureEntraTokenAuth.label (L165-L166; 2 source lines), AzureEntraTokenAuth.env_var
  (L169-L170; 2 source lines), mint_database_token (L176-L186; 10 source lines), parse_database_token_expiration
  (L189-L201; 12 source lines), _parse_rds_token_expiration (L204-L217; 14 source lines), _parse_entra_token_expiration
  (L224-L236; 13 source lines), build_azure_entra_token_provider (L240-L251; 10 source lines), build_database_token_auth
  (L254-L262; 9 source lines), resolve_database_token_auth (L265-L274; 10 source lines). litellm/proxy/auth/rds_iam_token.py:
  init_rds_client (L7-L151; 112 source lines), generate_iam_auth_token (L154-L173; 17 source lines). litellm/proxy/db/db_url_settings.py:
  DatabaseURLSettings.token_auth (L364-L373; 9 source lines), DatabaseURLSettings._assemble_writer_url.token_branch
  (L410-L435; 26 source lines), DatabaseURLSettings._assemble_reader_url.token_branch (L476-L500; 25 source
  lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): AWS_REGION_NAME=None;
  AWS_REGION=None; AWS_ACCESS_KEY_ID=None; AWS_SECRET_ACCESS_KEY=None; AWS_SESSION_NAME=None; AWS_PROFILE_NAME=None;
  AWS_ROLE_NAME=os.getenv('AWS_ROLE_ARN'); AWS_WEB_IDENTITY_TOKEN=os.getenv('AWS_WEB_IDENTITY_TOKEN_FILE');
  AWS_ROLE_ARN=None; AWS_WEB_IDENTITY_TOKEN_FILE=None.


  IAM_TOKEN_DB_AUTH=false and AZURE_POSTGRESQL_AUTH=false are mutually exclusive. AWS region is explicit
  aws_region_name, then AWS_REGION_NAME, then AWS_REGION, otherwise an error. AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  AWS_SESSION_NAME, AWS_PROFILE_NAME default absent; AWS_ROLE_NAME falls back to AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN
  to AWS_WEB_IDENTITY_TOKEN_FILE, all absent by default. Resolve os.environ/ references for all seven
  RDS auth parameters before credential selection.


  Add the database_tokens operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a database-tokens-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::database_tokens::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 343 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  343 production, 148 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 636 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
