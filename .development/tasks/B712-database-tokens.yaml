  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/token_auth.py#L25-L38
    why: Literal env names, Azure scope, conflict message and port default.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/token_auth.py#L70-L274
    why: Endpoint normalization, strategy labels, token encoding, expiry parsing and cached provider creation.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L364-L373
    why: Resolved settings delegate to the strategy selector.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L408-L435
    why: Writer pooled-marker check, missing-field error and replacement of a pinned URL under token auth.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L463-L500
    why: Reader gating precedes token resolution, with exact missing-field text.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L560-L578
    why: Successful writer updates normalize enabled flags only after URL assembly.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/pgbouncer.py#L341-L342
    why: Actual marker read site uses exact equality to the string true.
dod:
  - text: 'Native strategy tests cover no_token_strategy, conflicting_flags_exact_error_before_provider,
      strategy_labels_and_env_names, azure_scope_ignores_azure_scope_env, azure_provider_cached_once,
      failed_provider_creation_retried, azure_mint_quotes_fresh_token, rds_mint_delegates_endpoint,
      provider_error_no_password_fallback, writer_token_overwrites_pinned_url,
      pooled_writer_skips_mint_after_conflict_check, writer_missing_fields_order_and_message,
      enabled_flag_update_after_success_only, reader_gates_before_strategy,
      reader_missing_fields_exact_message, reader_mints_with_pooled_writer.'
    proof: [behavior-tests]
  - text: 'Pure endpoint/expiry cases cover normalized_url_components, token_inserted_verbatim,
      absent_or_empty_schema, endpoint_missing_host_user, endpoint_missing_name,
      endpoint_first_schema_and_default_port, endpoint_bad_port, rds_expiry_first_values,
      rds_missing_fields_silent, rds_invalid_fields_debug, rds_negative_expiry,
      encoded_rds_password_not_parsed, entra_segment_count_silent, entra_base64_padding,
      entra_exp_required_and_extra_claims, entra_invalid_claim_debug, entra_timestamp_overflow_propagates,
      entra_expired_unsigned_token_is_hint and naive_utc_expiry.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Actual loader tests prove flags_default_false, flags_all_strict_spellings,
      invalid_flag_stops_loading, both_flags_conflict and pooled_marker_exact_true_only.'
    proof: [config-tests, config-corpus]
  - text: 'native_expiry_size_depth_limits and native_expiry_debug_redaction test the recorded differences;
      the real token decoder replays the added boundary corpus.'
    proof: [behavior-tests, parser-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Endpoint, expiry, strategy and failure ordering must pass beyond corpus replay.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tokens::tests::/) - test(replays_the_database_token_expiry_corpus)'
    - id: config-tests
      why: Strict auth flags and the exact pooled marker must reach production strategy selection.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_tokens::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Pure adapters must use the actual pinned endpoint and expiry functions.
      run: test -f tools/oracle/helpers/database_tokens.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: New endpoint/expiry calls must replay through the existing HelperCase decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-tokens-*")" && grep -rlq database_tokens tools/oracle/fuzz/corpus/helper_case/database-tokens-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-corpus
      why: Auth env-resolution seeds must be newly added and accepted by the actual config decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-tokens-*")" && grep -rlq IAM_TOKEN_DB_AUTH crates/betterlite-config/fuzz/corpus/config_yaml/database-tokens-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The production expiry parser must be the fuzz target and replay new malformed/boundary inputs.
      run: test -f crates/betterlite-db/fuzz/fuzz_targets/database_token_expiry.rs && grep -q database_token_expiry crates/betterlite-db/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-db/fuzz/corpus/database_token_expiry)" && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(replays_the_database_token_expiry_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/database-tokens/endpoint-encoding.yaml
  - tools/oracle/cases/helpers/database-tokens/endpoint-parse-errors.yaml
  - tools/oracle/cases/helpers/database-tokens/rds-expiry-fields.yaml
  - tools/oracle/cases/helpers/database-tokens/rds-invalid-and-encoded.yaml
  - tools/oracle/cases/helpers/database-tokens/entra-expiry-claims.yaml
  - tools/oracle/cases/helpers/database-tokens/entra-invalid-and-overflow.yaml
deviations:
  - what: Token-expiry input over 1048576 bytes or Entra JSON depth 64 is treated as unreadable with a
      redacted debug reason, so the existing refresh scheduler uses its fixed-interval fallback.
    why: Bound the new token parser without turning an expiry hint into authentication validation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/token_auth.py#L204-L236
  - what: Expiry-parser debug logs retain the RDS/Azure failure prefix but omit raw validation values
      that could contain tokens or credential claims.
    why: The reference exception representation can expose secret input in operator logs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/token_auth.py#L215-L236
out_of_scope:
  - B2308 owns init_rds_client and generate_iam_auth_token, AWS env precedence, STS selection and signing.
  - B2307 owns token_auth_flag_enabled, URL byte parsing and query projection; B710 owns the settings
    declarations, TLS parameter defaults, password branches and reader field fallback.
  - B711 owns translate_libpq_ssl_params and native TLS/pool policy; B051 sequences apply_to_env and
    applies successful typed updates without changing process globals. B854 owns extraction of the
    decoded password, refresh intervals and reconnect/pool replacement.
  - B129 owns get_azure_ad_token_provider and its credential types/env selectors. This task passes
    the PostgreSQL scope and caches the returned provider; it does not duplicate Azure credential logic.
  - All pgbouncer.py functions except database_url_is_pooled remain excluded under B711's recorded
    embedded-process deviation; the marker predicate is retained for externally supplied compatibility state.
pitfalls:
  - RDS expiry expects a decoded password containing a literal question mark, not the quoted token returned by minting.
  - Entra timestamp conversion happens outside the caught validation block, so a huge valid exp is not a None fallback.
  - A pinned reader URL suppresses token resolution before the reader reaches the conflicting-flag check.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
