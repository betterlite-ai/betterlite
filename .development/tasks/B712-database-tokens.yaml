id: B712
title: RDS IAM and Azure database token authentication
description: >-
  Implement betterlite-db::database_tokens with DatabaseTokenAuth, IamEndpoint, token URL construction
  and expiry hints. Own token_auth.py except B2307's token_auth_flag_enabled; own db_url_settings.py's
  token_auth and token branches L410-L435/L476-L500, and pgbouncer.py::database_url_is_pooled. Consume
  B2308's RDS signer, B129's Azure credential provider and B710's resolved endpoint fields. The parent
  startup service chooses this strategy before invoking the password-only branch; B710 never calls
  back up into this task. Token refresh and connection replacement remain in B854.

  IAM_TOKEN_DB_AUTH and AZURE_POSTGRESQL_AUTH default false and use B2307's strict boolean parser.
  Resolve IAM first, Azure second, and reject both enabled before constructing a provider, reading
  endpoint fields or minting. Preserve the exact RuntimeError message: 'IAM_TOKEN_DB_AUTH and
  AZURE_POSTGRESQL_AUTH are both enabled, but the database password can only come from one token
  source. Keep IAM_TOKEN_DB_AUTH for AWS RDS IAM auth, or AZURE_POSTGRESQL_AUTH for Azure Database for
  PostgreSQL with Microsoft Entra ID, and unset the other one.' Neither enabled returns None. RDS
  exposes label 'RDS IAM token' and env_var IAM_TOKEN_DB_AUTH; Azure exposes 'Azure Entra token' and
  AZURE_POSTGRESQL_AUTH. Azure builds one process-wide provider for the explicit scope
  https://ossrdbms-aad.database.windows.net/.default, regardless of AZURE_SCOPE. Reuse that provider
  across writer, reader and refresh calls; a failed provider construction is retried on a later call,
  while successful caching does not freeze one token forever. B129 owns credential inference and its
  Azure env inputs, errors and logging.

  IamEndpoint stores host, string port, user, database name and optional schema=None. build_url
  normalizes user/name/schema by percent-decoding once then quote(safe=''), avoiding double-encoding
  a pre-encoded '@'; spaces become %20, not B710's '+'. Host and port are retained, and an empty schema
  is omitted. The token is inserted verbatim as an already encoded password. RDS minting delegates
  host/port/user unchanged to B2308; Azure invokes its provider each mint and quote(safe='')-encodes
  the returned token. Provider failures propagate without switching auth style.

  parse_iam_endpoint_from_url rejects missing/empty host or username with ValueError
  'Cannot parse IAM endpoint from URL: missing host or username', then decodes the path after removing
  all leading '/' and rejects an empty name with 'Cannot parse IAM endpoint from URL: missing database name'.
  Decode username once; use parsed lower-case hostname, parsed port converted to a string or '5432'
  when absent/zero, and the first nonblank schema query value. Bad ports/brackets propagate URL errors.
  Parsing is not a database connection and does not inspect or validate the password.

  Writer token assembly resolves the strategy before consulting LITELLM_PGBOUNCER_POOLED_DATABASE_URL.
  Only the exact string 'true' marks a pooled URL and returns no replacement; 'True', '1', empty and
  absent do not. In other cases token auth overwrites even a truthy pinned DATABASE_URL. Require
  truthy DATABASE_HOST, DATABASE_USER (already resolved from B710's aliases) and DATABASE_NAME in
  that order. The RuntimeError names the enabled auth env, the missing fields and the strategy label:
  '{env} is enabled but required DB env var(s) are unset: {fields}. Set them so the writer DATABASE_URL
  can be assembled with a minted {label}.' Port defaults '5432' through B710, schema remains optional.
  After successful assembly the typed update result normalizes only enabled token toggles to 'True'.
  A failed mint produces no URL/toggle update; the native pool policy never sets the pooled marker itself.

  Reader host opt-in and pinned-URL preservation occur before resolving its token strategy. For a
  reader that needs assembly, use B710's truthy reader-or-writer field fallback, then require resolved
  user and name in that order. Missing fields are spelled DATABASE_USER[_READ_REPLICA] and
  DATABASE_NAME[_READ_REPLICA]; preserve the source RuntimeError ending '(no *_READ_REPLICA value and
  no writer fallback). Set the reader fields or the writer defaults.' Reader token minting is not
  disabled by the pooled writer marker. B710 wraps assembled endpoints with its missing-only TLS
  params; neither this task nor the lower password module recursively resolves the other strategy.

  Expiry parsing consumes the decoded password supplied by B854, not the percent-encoded URL. RDS
  requires a literal '?', reads the first nonblank X-Amz-Date and X-Amz-Expires values, parses UTC
  '%Y%m%dT%H%M%SZ', adds int(expires) seconds and returns naive UTC. Missing query/fields returns None
  without a log; invalid date/integer or overflow returns None with the debug prefix 'Failed to parse
  RDS IAM token expiration:'. Negative expiry seconds are not rejected. Azure requires exactly three
  dot-separated segments, restores base64url padding on the middle segment, and validates JSON with
  required exp:int and ignored extra fields. It does not verify a JWT signature or require an unexpired
  token: this is only a scheduling hint. Wrong segment count returns None silently; base64/JSON/claim
  ValueError returns None with 'Failed to parse Azure Entra token expiration:'. A valid integer outside
  the platform timestamp range fails after validation and propagates an error, rather than taking
  the caught-malformed-token fallback. Both successful paths return naive UTC; None lets B854 choose
  its existing fixed refresh interval, whose constants belong to B854.

  Add decode_database_token_expiry(&[u8], auth_kind) and its database_token_expiry fuzz target to
  B2307's database fuzz workspace. The production parser and replay use the same path; do not bolt
  a fuzz-only parser onto the adapter. Bound token input at 1048576 bytes and Entra JSON depth at 64;
  exceeding those bounds yields the unreadable-expiry result with a redacted debug reason. Test exact
  boundary values, malformed UTF-8/base64/JSON, duplicate exp fields, integer extremes and encoded-vs-raw
  RDS passwords. This limit and diagnostic redaction are deviations below. URL decoding itself reuses
  B2307, while B129/B2308 own SDK credential responses.

  Pure oracle cases call IAMEndpoint methods and the real expiry parsers; compare values, exception
  categories, exact endpoint errors and debug-vs-silent behavior. Keep cloud provider construction,
  mint failures, cached-provider lifecycle and ordered startup updates in native service tests with
  injected providers, not a FastAPI or network HelperCall. Config tests load both strict toggles and
  the exact pooled marker through B002 and consume them. No persistent secret format or Postgres row
  is written by this task.

  After extracting 129 RDS source lines and the 24-line flag parser, the owned token helpers contain
  128 nonblank noncomment lines, plus declarations, 60 settings-branch lines and the two-line marker
  predicate. Allow 250 production/parser, 290 behavior tests, 70 config/tests, 70 adapters and 70
  fuzz/wiring lines, 750 within 800. Keep endpoint, expiry and strategy modules below 300 lines each.
