id: B191
title: Bounded callback worker and batch delivery
description: >-
  Add the owned async callback worker and batch-delivery primitive in betterlite-logging. The server will own a
  TaskTracker or JoinSet, bounded queue and explicit flush/stop handle; no detached retries, atexit cleanup or unbounded
  task list. Use constructor limits (queue 50000, concurrency 100, callback timeout 20 seconds and shutdown drain
  30 seconds) and report rejected admissions, timeouts and failures with sanitized typed outcomes. Preserve request
  context on queued events, avoid locks across await, and isolate a failed observability callback from the model
  response. Implement ordered batching with retained failed events until the next flush, a 413 split that preserves
  unsent remainder, and cancellation that retains or explicitly reports undelivered events. Add worker_trace and
  batch_delivery helper probes with deterministic synthetic callbacks and a mock transport; use paused-clock Rust
  tests for saturation, cancellation and shutdown.  Seed B171's shared helper_case corpus with every added operation
  and replay it through the common typed parser. Admission uses try_send and never awaits: on a full queue drop
  only that event, increment counters and return a sanitized outcome without delaying or changing the model result.
  B012 resolves LOGGING_WORKER_MAX_QUEUE_SIZE=50000, LOGGING_WORKER_CONCURRENCY=100, LOGGING_WORKER_MAX_TIME_PER_COROUTINE=20.
  CustomBatchLogger uses batch size 512, flush interval 5 seconds and max_queue_size 50000; failed events stay for
  the next flush and overflow drops oldest with a warning/count. Probe comparisons use event counts, final status,
  ordered delivery where defined and the delivered set; elapsed timing is explicitly excluded. Write the behavior
  rstest functions b191_logging_worker_tests_behavior in adjacent tests.rs files, with a named case for each behavior
  and failure in the DoD; corpus replay tests have separate names. Register helper operations worker_trace, batch_delivery
  in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py; each operation has its own Rust and Python
  adapter file and corpus seed.
