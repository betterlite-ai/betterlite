- tools/oracle/cases/helpers/logging-worker/oldest-overflow.yaml
- tools/oracle/cases/helpers/logging-worker/default-limits.yaml
deviations:
- what: >-
    Queue overflow returns a typed rejected-admission result with counters; no unbounded delayed-enqueue or aggressive-clear
    tasks are spawned.
  why: The async-hygiene and no-silent-drops rules require bounded ownership and explicit loss accounting.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/logging_worker.py#L249-L418
out_of_scope:
- Durable spend/audit writes must use B069's persistence path, not this best-effort observability queue.
- Concrete HTTP exporters are M5 and reuse this batch primitive.
pitfalls:
- >-
  A dequeued event waiting for a semaphore still belongs to the worker and must be included in shutdown accounting.
- Do not retry a 413 batch without reducing it, and do not retry an oversized single item forever.
- Callback context must be captured before enqueue, not read from whichever task later runs it.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
