id: B191
title: Bounded callback worker and batch delivery
description: >-
  Implement the bounded owned LoggingWorker in betterlite-logging/worker using B189 callback registration and B256
  batch delivery. Use TaskTracker or JoinSet, a bounded queue and an explicit flush/stop handle. Preserve request
  context per event, never hold locks over await, and isolate callback failures from model responses. Admission
  uses try_send and never awaits: a full queue drops only the rejected event, increments a counter and reports a
  sanitized outcome. Constructor defaults are queue 50000, concurrency 100, timeout 20 seconds and shutdown drain
  30 seconds; B012 resolves LOGGING_WORKER_MAX_QUEUE_SIZE, LOGGING_WORKER_CONCURRENCY and LOGGING_WORKER_MAX_TIME_PER_COROUTINE.
  Own pending, dequeued and running events through cancellation, flush and stop; join or account for each by the
  deadline. Implement source 27-265 and 448-531 with typed tracing replacing _safe_log; delayed retries/aggressive
  clears 267-446 are intentionally replaced by bounded admission, and _flush_on_exit is replaced by explicit shutdown.
  The helper operation worker_trace is already registered with separate Rust/Python
  adapters and a new seed. Compare event counts, final status and delivered set, not elapsed timing. Write logging_worker_tests_behavior
  rstest cases in adjacent tests.rs, separate from replay. Budget 320 worker, 100 adapters, 290 tests and 60 wiring
  (770 total).
