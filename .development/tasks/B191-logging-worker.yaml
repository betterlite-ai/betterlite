dod:
- text: >-
    Successful worker traces, callback failures, batch retry classes and 413 remainder handling match the helper
    probes.
  proof:
  - oracle
  - helper-python
- text: >-
    With a full queue, admission never awaits, only the rejected event is dropped/countable, and the successful
    model response returns unchanged without delay.
  proof:
  - logging-worker-tests
- text: >-
    Cancellation and timed-out callbacks release permits; flush/stop account for every accepted event and join all
    tasks by the deadline.
  proof:
  - logging-worker-tests
- text: A failed observability callback never replaces a successful model result.
  proof:
  - logging-worker-tests
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: logging-worker-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::b191_logging_worker_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'worker_trace' tools/oracle/fuzz/corpus/helper_case && grep -rlq 'batch_delivery' tools/oracle/fuzz/corpus/helper_case
      && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
