dod:
- text: >-
    Successful worker traces, callback failures and flush accounting match helper probes; batch behavior is proven
    by B256.
  proof:
  - oracle
  - helper-python
- text: >-
    With a full queue, admission never awaits, only the rejected event is dropped/countable, and the successful
    model response returns unchanged without delay.
  proof:
  - logging-worker-tests
- text: >-
    Cancellation and timed-out callbacks release permits; flush/stop account for every accepted event and join all
    tasks by the deadline.
  proof:
  - logging-worker-tests
- text: A failed observability callback never replaces a successful model result.
  proof:
  - logging-worker-tests
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: logging-worker-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::logging_worker_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'worker_trace' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/logging-worker/success-trace.yaml
- tools/oracle/cases/helpers/logging-worker/failure-trace.yaml
- tools/oracle/cases/helpers/logging-worker/flush-order.yaml
- tools/oracle/cases/helpers/logging-worker/default-limits.yaml
deviations:
- what: >-
    Queue overflow returns a typed rejected-admission result with counters; no unbounded delayed-enqueue or aggressive-clear
    tasks are spawned.
  why: The async-hygiene and no-silent-drops rules require bounded ownership and explicit loss accounting.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/logging_worker.py#L249-L418
out_of_scope:
- Durable spend/audit writes must use B069's persistence path, not this best-effort observability queue.
- Concrete HTTP exporters are M5 and reuse this batch primitive.
- >-
  CustomBatchLogger and every batch_utils function belong to B256; Python atexit hooks and thread/loop discovery
  have no caller in the native explicit-shutdown design.
- >-
  AdditionalLoggingUtils health-check/payload inspection is an exporter interface implemented by B110-B118 and the
  Python CustomLogger extension B164. mock_client_factory and *_mock_client provide Python monkeypatch-only exporter
  tests: their Rust equivalents are injected transport fixtures owned by each exporter task, not production mocks
  here. test_httpx.py is empty at the pin.
pitfalls:
- 'The oracle helper for this task is pre-registered as worker_trace in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/worker_trace.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/worker_trace.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- >-
  A dequeued event waiting for a semaphore still belongs to the worker and must be included in shutdown accounting.
- Callback context must be captured before enqueue, not read from whichever task later runs it.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
