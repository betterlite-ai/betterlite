id: B3061
title: Normalize and serialize FOCUS usage records
description: >-
  Build typed FOCUS rows, metadata tags, CSV and Snappy Parquet serialization in betterlite-logging,
  preserving the FOCUS schema, nullable fields, UTC timestamp strings and Decimal(18,6) monetary values.
  The schema includes all 37 standard FOCUS columns for cloud cost attribution and the Tags column holds
  JSON metadata (team_id, user_id, api_key_alias, model, etc.) consumed downstream. Empty DataFrames
  adopt the 37-column schema; non-empty frames inherit all available tag columns and return 44 columns total,
  adding seven computed fields not in the base schema (BillingAccountType, InvoiceId, AvailabilityZone,
  PricingCurrency, PricingCurrencyContractedUnitPrice, PricingCurrencyEffectiveCost, PricingCurrencyListUnitPrice).
  CSV encodes Decimal columns as floating-point to match standard CSV parsers; Parquet uses native Decimal(18,6)
  with Snappy compression. FocusTimeWindow represents export windows with start, end and frequency fields.
  The FocusDestination protocol receives serialized bytes and filename for delivery. Preserve the
  source's JSON serialization behavior for Tags, nested tag-building, UTC datetime formatting
  (%Y-%m-%dT%H:%M:%SZ) and Decimal precision of 18 total significant digits with 6 after the decimal point
  (12 before, 6 after). The CSV serializer casts Decimals to Float64; Parquet respects empty-DataFrame
  schema preservation and Snappy compression. Do not alter tag column precedence, timestamp precision
  (microseconds), null handling for unmapped columns or date-to-period conversion.
scope:
