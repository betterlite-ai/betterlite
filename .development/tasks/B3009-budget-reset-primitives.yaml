dod:
  - text: Rollover arithmetic preserves spend beyond the cap (carried spend) and enforces a cap on the next window; a 0s duration or zero cap carries everything over; rollover disabled carries nothing.
    proof: [rollover-cases]
  - text: "The chunk outcome reports rows that advanced past the reset cutoff as progress: a short chunk (fewer than 500 rows) or zero advances means the phase is drained; _run_phase_in_chunks caps one reset run at 100 chunks to prevent unbounded spinning."
    proof: [chunk-draining-cases]
  - text: Database write retries once on transport errors, and replays only when statements provably never reached the database; ambient connection loss reconnects before retrying.
    proof: [retry-cases]
  - text: Cache invalidation failures are logged as warnings and do not raise; one cache sink failing still invalidates the other.
    proof: [cache-invalidation-cases]
  - text: "Spend counter invalidation happens only after the database commit so get_current_spend cannot read a stale spending constraint; when invalidation fails, the cached value expires naturally."
    proof: [invalidation-order-cases]
  - text: Phase failure reporting passes start_time, end_time, call_type and event_metadata to the service failure hook for observability.
    proof: [phase-failure-cases]
  - text: UTC conversion handles both timezone-aware and naive datetimes; naive datetimes are treated as UTC.
    proof: [utc-conversion-cases]
checks:
  optional: []
  commands:
    - id: rollover-cases
      why: rollover arithmetic is missing, wrong or contradicts the enabled flag
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^budget_reset_policy::rollover/)'
    - id: chunk-draining-cases
      why: chunk outcome or phase draining logic is missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^budget_reset_policy::(chunk_outcome|phase_draining)/)'
    - id: retry-cases
      why: database retry logic is missing, does not handle transport errors, or retries unsafely
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^budget_reset_policy::retry/)'
    - id: cache-invalidation-cases
      why: cache invalidation does not fail gracefully or one cache failing stops the other
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^budget_reset_policy::cache_invalidation/)'
    - id: invalidation-order-cases
      why: cache is invalidated before the database commits or spend counter invalidation raises on error
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^budget_reset_policy::invalidation_order/)'
    - id: phase-failure-cases
      why: phase failure reporting is missing timing, call type or event metadata
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^budget_reset_policy::phase_failure/)'
    - id: utc-conversion-cases
      why: timezone-aware or naive datetime conversion is missing or wrong
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^budget_reset_policy::utc/)'
oracle_cases: []
deviations: []
out_of_scope:
  - "Actual phase implementations (key reset, user reset, team reset, budget cascade, window reset) are owned by B3010-B3013; this task only exports the shared machinery."
  - "Budget reset settings parsing and storage; B3000 owns those and this task reads them through the constructor."
pitfalls:
  - "Spend counter invalidation must happen after the database commits, not before. If the cache is cleared before the database write succeeds, a stale DB row with pre-reset spend could be read alongside an empty cache, allowing budget checks to incorrectly permit requests."
  - "Cache invalidation failures are logged as warnings, not exceptions; one failing sink (spend counter or user_api_key_cache) must still invalidate the other. Catch and log each sink separately."
  - "The _LazyJson wrapper only works inside a logging call; passing its __str__ result to a formatted string invokes __str__ immediately and defeats the defer."
  - "UTC conversion must handle both timezone-aware datetimes and naive ones (treat as UTC); mix the two when comparing reset_at to now without normalizing both."
  - "Phase failure reporting takes a ServiceTypes enum from litellm/types/services.py; this constant is provided by B012 and hardcoded in the failure hook invocation."
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
