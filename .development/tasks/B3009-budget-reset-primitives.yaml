id: B3009
title: Share budget reset policy, retries and cache invalidation
description: >-
  Build `betterlite-db::budget_reset_policy`, the shared primitives and retry strategy for all reset phases in the budget sweep job.
  Implement rollover arithmetic where spend beyond a cap carries to the next window and stays within it: when `litellm.budget_rollover` (default false) is true, any spend above the max_budget carries over, but in a zero-duration window or with a zero cap, everything carries. No-progress detection prevents re-reading stale chunks forever by tracking both rows fetched and rows advanced; when fewer than RESET_BUDGET_JOB_BATCH_SIZE (default 500) rows are fetched, or when zero rows advance past the reset cutoff, the phase is drained. Implement proven-safe database retries with reconnection and warning-only cache invalidation failures that are logged but don't stop the reset from landing.
  Export the rollover-cap calculation, carried-spend arithmetic, row filtering constants, chunk outcome and no-progress sentinel, phase draining logic with RESET_BUDGET_JOB_MAX_CHUNKS_PER_RUN (default 100) as the per-run cap, UTC normalization, per-row failure collection, and the lazy JSON serialization that defers work to the logger.
  The reset operation itself (zeroing and timestamp updates) stays distinct from cache invalidation to keep failure policy clear: the database write commits before any cache is dropped so a failed cache clear cannot leave a stale spending constraint in memory.
scope:
  paths:
    - crates/betterlite-db/**
    - Cargo.toml
  lint_tables: true
