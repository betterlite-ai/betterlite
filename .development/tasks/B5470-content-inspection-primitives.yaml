    why: A caller writing a provider's redacted messages back into the body.
dod:
  - text: The three public constants hold exactly the names in the description, and `responses` and `anthropic_messages` are in neither call type list.
    proof: [call-type-tests, oracle, helper-python]
  - text: iter_message_text returns fragments from `messages` first and `input` second, in order, from strings, bare strings in a list and any object with non-empty `text`, and skips image parts and non-object messages.
    proof: [text-tests, oracle, helper-python]
  - text: Each `input` item branch gives the right role and content, including `reasoning` items that yield two messages and output items that default to role `tool`.
    proof: [input-item-tests, oracle, helper-python]
  - text: An object item with both part text and a `content` key takes the part text branch, and a `reasoning` item with neither `content` nor a list `summary` yields nothing.
    proof: [input-item-tests]
  - text: build_inspection_messages joins fragments with a newline, drops messages with no text and falls back to role `user` for a missing, null or empty role.
    proof: [inspection-tests, oracle, helper-python]
  - text: is_string_batch_input is false when `messages` exists with a null value, false for an empty list and for a list with one non-string, and true for a list of strings that includes an empty one.
    proof: [batch-tests, oracle, helper-python]
  - text: A batch write-back replaces only the non-empty positions and returns true, and a count mismatch or an entry without content returns false with `data` equal to the input.
    proof: [write-back-tests, oracle, helper-python]
  - text: Outside a batch the write-back replaces `messages`, joins all fragments into a string `input`, updates both when both exist, and leaves a list `input` unchanged while still returning true.
    proof: [write-back-tests, oracle, helper-python]
  - text: has_non_string_content is true for list content and for any list `input`, and false for string or null content with string or null `input`.
    proof: [non-string-tests, oracle, helper-python]
  - text: Newly added helper corpus cases replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: call-type-tests
      why: the call type or text part constants are missing or hold other names
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_inspection::tests::call_type_/)'
    - id: text-tests
      why: fragment order, part text or the content walk is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_inspection::tests::text_/)'
    - id: input-item-tests
      why: an input item takes the wrong branch, role or content
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_inspection::tests::input_item_/)'
    - id: inspection-tests
      why: synthesized messages join, drop or name roles wrongly
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_inspection::tests::inspection_/)'
    - id: batch-tests
      why: the string batch test accepts or rejects the wrong shape
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_inspection::tests::batch_/)'
    - id: write-back-tests
      why: redacted text lands in the wrong field or a partial batch rewrite goes through
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_inspection::tests::write_back_/)'
    - id: non-string-tests
      why: multimodal content is not reported to hooks that mask by string offset
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^content_inspection::tests::non_string_/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5470)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5470 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5470/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added content inspection cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/content_inspection-*")" &&
        grep -lE '^[[:space:]]+b5470:' tools/oracle/fuzz/corpus/helper_case/content_inspection-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/content-inspection/chat-text.yaml
  - tools/oracle/cases/helpers/content-inspection/responses-input.yaml
  - tools/oracle/cases/helpers/content-inspection/reasoning-items.yaml
  - tools/oracle/cases/helpers/content-inspection/tool-output-items.yaml
  - tools/oracle/cases/helpers/content-inspection/string-batch.yaml
  - tools/oracle/cases/helpers/content-inspection/redacted-write-back.yaml
  - tools/oracle/cases/helpers/content-inspection/non-string-content.yaml
  - tools/oracle/cases/helpers/content-inspection/call-type-sets.yaml
deviations: []
out_of_scope:
  - walk_user_text has no caller at the pin, so it is not built and has no cases.
  - The local copies in ibm_hooks/data.rs (iter_message_text) and lasso_masking/lifecycle.rs (has_non_string_content) stay as they are. Moving those modules onto this one isn't part of this task.
  - The responses transform used for message lookup by call type; B3664 owns get_guardrails_messages_for_call_type.
pitfalls:
  - TEXT_CONTENT_CALL_TYPES leaves out `responses` and `anthropic_messages` on purpose, so don't widen it to match the route list.
  - 'Part text ignores `type`, so an object like `{"type": "image_url", "text": "x"}` still gives `x`, and TEXT_PART_TYPES plays no part in the walk.'
  - A string in an `input` list becomes a message even when empty, and it only disappears when the content walk skips it, so the write-back has to count non-empty strings and not messages.
  - The batch check on redacted entries runs over all of them before any write, because a partial rewrite would send the remaining originals to the model unredacted.
  - A `messages` key with a null value turns off the batch path and also gets replaced by the redacted list on write-back.
  - In `has_non_string_content` a message with null `content` is fine, a tool call message has that shape, and only non-null non-string content counts.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
