id: B5470
title: Guardrail content inspection primitives
description: >-
  Add the module `content_inspection` to betterlite-guardrails. It pulls the text out of a request body so a guardrail can send that text to its provider, and it writes redacted text back into the body. Provider hooks such as Lakera, Cato, Aim, Repello, Lasso and IBM call these functions, so this part has no dependency beyond `GuardrailValue` from `betterlite_config::sections::guardrail_identity::item`. A request body is `BTreeMap<String, GuardrailValue>` in every signature here. Nothing in this module does I/O, reads config or can fail, so it has no error enum.

  Public constants, each a plain array of `&str`: `TEXT_CONTENT_CALL_TYPES` holds `completion`, `acompletion`, `aresponses`. `NON_CONVERSATIONAL_CALL_TYPES` holds `embedding`, `aembedding`. `TEXT_PART_TYPES` holds `text`, `input_text`, `output_text`, `summary_text`, `reasoning_text`. LiteLLM's `is_text_content_call_type` and `is_non_conversational_call_type` are single membership tests and the no-one-line-functions rule rejects that body, so they are not built: a caller writes `TEXT_CONTENT_CALL_TYPES.contains(&call_type)`.

  Three private steps do the reading, under names you choose. The first takes the text of one part: an object whose `text` is a non-empty string gives that string, whatever its `type` says, and anything else gives nothing. The second walks a `content` value: a non-empty string gives itself, a list gives each non-empty bare string and each part's text in order, and every other shape gives nothing. The third lifts `input` into chat-style messages. A string becomes one `user` message. A value that is not a list becomes no messages. In a list, a string item becomes a `user` message, and an object item takes the first branch that matches, in this order: it has part text (role is the item's `role` or `user`, content is a list holding the item), its `type` is `reasoning` (when the `content` key exists a message with role `role` or `assistant`, and then when `summary` is a list a second message with the same role and the summary as content), it has a `content` key (role `role` or `user`), its `type` is `function_call_output` or `custom_tool_call_output` and it has an `output` key (role `role` or `tool`, content is the output). Other items are dropped. A body always yields the entries of a `messages` list first and then the lifted `input`, and both are read even when both exist.

  Public functions. `iter_message_text(data: &BTreeMap<String, GuardrailValue>) -> Vec<String>` returns every text fragment from those messages, skipping entries that are not objects. `build_inspection_messages(data) -> Vec<InspectionMessage>` returns one `InspectionMessage { role: String, content: String }` (derives Serialize) per message that has text, joining its fragments with one newline and dropping messages with no text. Its role is the message's non-empty `role` text, otherwise `user`. `is_string_batch_input(data) -> bool` is false whenever the `messages` key exists, even with a null value, and true for a non-empty `input` list holding only strings. `has_non_string_content(data) -> bool` is true when a message object in a `messages` list has non-null content that is not a string, or when `input` is non-null and not a string.

  `apply_redacted_messages_back(data: &mut BTreeMap<String, GuardrailValue>, redacted_messages: &[GuardrailValue]) -> bool` writes a provider's answer back. For a string batch it finds the indices of the non-empty strings in `input`. It returns false with `data` unchanged when the count of redacted messages differs from that count, or when any redacted entry is not an object or has a missing or null `content`. Otherwise the entry at each position replaces the string at the matching index, as its content fragments joined with a newline, and it returns true. Empty strings in the batch stay where they are. Outside a batch, a `messages` key that exists is replaced by the redacted list, a string `input` becomes the newline join of the fragments of every object in the redacted list, and a list `input` is left as it was. That path always returns true.

  The task's oracle helper takes `function` and the arguments of that function: `data`, and `redacted_messages` for the write-back, whose answer holds both the returned bool and the rewritten `data`. A `call_type` argument with function `call_types` answers the two membership tests. Copy each helper case into `tools/oracle/fuzz/corpus/helper_case/` with the prefix `content_inspection-`.

  Native tests live in `content_inspection::tests` and use the name prefixes in the check filters below.
scope:
  paths:
    - crates/betterlite-guardrails/src/content_inspection.rs
    - crates/betterlite-guardrails/src/content_inspection/**
    - tools/oracle/cases/helpers/content-inspection/**
    - "tools/oracle/fuzz/corpus/helper_case/content_inspection-*"
    - tools/oracle/helpers/b5470.py
    - tools/oracle/helpers/b5470/**
    - tools/oracle/src/helpers/guardrails/b5470.rs
    - tools/oracle/src/helpers/guardrails/b5470/**
  lint_tables: false
