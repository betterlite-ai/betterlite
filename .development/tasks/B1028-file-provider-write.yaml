id: B1028
title: File provider write
description: >-
  Implement provider file create/delete using B010/B009 and B024 transforms with typed upload bytes and file IDs.
  Preserve metadata, timeout and error behavior across source sync/async wrappers; reject request-selected filesystem
  paths before the transport boundary.


  Implement crates/betterlite-core/src/api/file_provider_write.rs. Use FileProviderWriteInput and FileProviderWriteResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions file_upload_provider_parts, file_delete_provider, file_upload_error,
  file_delete_missing under api::file_provider_write::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::FileProviderWrite in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_provider_write: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/files/main.py: acreate_file (L116-L157); litellm/files/main.py: create_file (L161-L295);
  litellm/files/main.py: afile_delete (L468-L507); litellm/files/main.py: file_delete (L511-L639). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 303 owned nonblank/non-comment/non-docstring Python lines (320 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 323 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 555 total within the 560-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B009 (Outbound HTTP clients, proxies, TLS and connection reuse for every provider), B010
  (Provider framework, provider resolution and parameter mapping), B171 (Direct helper oracle and URL path encoding),
  B1015 (File contracts), B1087 (Api boundaries), B516 (OpenAI file lifecycle and streaming content). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.
