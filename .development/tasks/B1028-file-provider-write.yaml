id: B1028
title: File SDK upload and delete dispatch
description: >-
  Implement betterlite-core::api::file_provider_write for whole acreate_file/create_file and
  afile_delete/file_delete functions. Consume typed file bytes and GenericLiteLLMParams;
  Python file handles and event-loop facades stay B159-B161. B2461/B2462 own generic upload/delete
  execution, B516 OpenAI-compatible methods, B694 Azure methods, B500/B2200 credentials,
  B174 provider resolution, B176 trusted controls, B012 decorator logging, B010 native operation types
  and B2464 file config/timeout selection.
  Sync compatibility is a mode of the native async service, not another transport implementation.

  Register B2401 SDK HTTP operation file_provider_write. Its Python adapter invokes the SDK
  against the mock; compare actual requests, objects and exception class/status/type/message/param/code.
  Upload bytes come from B900 fixtures, never an arbitrary request-selected local path. No new
  parser or helper adapter belongs here. Tests are in api::file_provider_write::tests. The four
  complete functions with decorators have 322 nonblank, non-comment lines; budget 235 implementation,
  170 tests, 145 fixtures, 95 adapters and 35 wiring lines, 680 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/file_provider_write.rs
  - crates/betterlite-core/src/api/file_provider_write/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/file_provider_write.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/file_provider_write.py
  - tools/oracle/cases/sdk-http/file-provider-write/**
  - tools/oracle/fuzz/corpus/sdk_http_case/file-provider-write-*
  - Cargo.lock
  - tools/oracle/helpers/b1028.py
  - tools/oracle/helpers/b1028/**
  - tools/oracle/src/helpers/core_ops/b1028.rs
  - tools/oracle/src/helpers/core_ops/b1028/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/main.py#L115-L295
  why: Complete upload wrappers, passthrough guard, deadline coercion and config-first dispatch.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/main.py#L467-L639
  why: Complete delete wrappers and best-effort model hint before compatible/Azure/config dispatch.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9410-L9445
  why: Registry evidence for reachable Gemini, Vertex, Bedrock, Manus, Anthropic, Mistral and xAI configs.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2589-L2598
  why: HTTP timeout objects survive only for openai, azure and bedrock.
dod:
- text: >-
    upload_optional_fields calls acreate_file with b"abc",purpose=batch and no provider: openai
    receives multipart. Async default is openai; undecorated sync default is None, with decorator
    behavior owned by its facade. expires_after=None is omitted; {anchor:created_at,seconds:3600}
    is included. extra_headers/extra_body pass in CreateFileRequest. assistants,batch,fine-tune,
    messages are forwarded; provider validation owns acceptance. Native undecorated upload without
    logging_obj raises ValueError "logging_obj is required" before any request.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    upload_passthrough_guard sends passthrough=true,provider=openai,purpose=batch: BadRequestError
    400,type=null,param=null,code=null,message="litellm.BadRequestError: `passthrough=True` uploads
    the file bytes unchanged for a native Vertex AI batch, so it needs custom_llm_provider='vertex_ai'
    and purpose='batch', got 'openai' and 'batch'." Zero requests occur. vertex_ai/batch succeeds;
    vertex_ai/assistants fails with those substituted literals. False and string "true" do not
    activate the identity-True guard. Error response body="passthrough needs a vertex_ai batch",
    request method=create_file, URL=https://github.com/BerriAI/litellm, model=n/a.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    write_timeout_coercion sends absent/null/zero timeout and request_timeout: fallback=600.0;
    timeout=2 wins over request_timeout=3; "2.5" becomes 2.5. HTTP timeout objects survive for
    openai/azure/bedrock, otherwise use read or 600. Invalid numeric text fails before HTTP.
    Native mode flags require literal true; acreate_file writes acreate_file=true and afile_delete
    writes is_async=true. Context is retained across the Python facade's executor handoff.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    write_provider_dispatch captures config-first upload and compatible-first delete. openai,
    hosted_vllm,litellm_proxy receive B500 credentials/organization; Azure gets api_version and
    max_retries; Anthropic exercises generic multipart/delete. Generic paths accept only matching
    HTTPHandler/AsyncHTTPHandler clients; Azure delete forwards its client, OpenAI upload/delete
    does not. Generic delete copies trusted credentials then assigns api_key/api_base even if null;
    its extra_body is unused. Provider failures preserve provider status/message/type/param/code.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    delete_model_and_logger resolves a supplied model, swallowing resolution errors and retaining
    the previous provider. Async removes model from kwargs. Missing generic logger creates model="",
    messages=[],stream=false, call_type=file_delete/afile_delete, clock start_time,
    litellm_call_id=provided value (even null) or UUID only when absent, function_id=str(id or "").
    Existing logger is retained. FileDeleted id and deleted flag are returned without reinterpretation.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    unsupported_write uses enum-valid cohere: BadRequestError 400,type=null,param=null,code=null,
    model=n/a and message prefixed "litellm.BadRequestError: ". Upload suffix is "LiteLLM doesn't
    support cohere for 'create_file'. Only ['openai', 'azure', 'vertex_ai', 'manus', 'anthropic'] are
    supported." Delete suffix is "LiteLLM doesn't support cohere for 'file_delete'. Only 'openai',
    'azure', 'gemini', 'manus', and 'anthropic' are supported." Response body="Unsupported provider";
    request method=create_file for upload, create_thread for delete. Unknown provider text fails
    LlmProviders conversion earlier. Neither sends HTTP or invents a proxy error envelope.
  proof: [behavior-tests, oracle, sdk-python]
- text: Newly added SDK seeds and HTTP cases execute upload/delete production dispatch.
  proof: [new-cases, sdk-seeds, oracle, sdk-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: upload and delete dispatch are untested outside corpus replay
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::file_provider_write::tests::/) - test(/replays_/)'
  - id: sdk-python
    why: independent file-write adapter is absent or untyped
    run: test -f tools/oracle/sdk_http/file_provider_write.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-seeds
    why: upload/delete operation seeds were not added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/file-provider-write-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: no newly captured SDK write cases exist
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/file-provider-write)"
oracle_cases:
- tools/oracle/cases/sdk-http/file-provider-write/upload-optional-fields.yaml
- tools/oracle/cases/sdk-http/file-provider-write/upload-passthrough-guard.yaml
- tools/oracle/cases/sdk-http/file-provider-write/write-timeout-coercion.yaml
- tools/oracle/cases/sdk-http/file-provider-write/write-provider-dispatch.yaml
- tools/oracle/cases/sdk-http/file-provider-write/delete-model-and-logger.yaml
- tools/oracle/cases/sdk-http/file-provider-write/unsupported-write.yaml
deviations: []
out_of_scope:
- B1029 owns retrieve/list SDK functions; B1030 owns content functions and content logging/stream selection helpers in files/main.py.
- B159-B161 own Python file and executor facades, B012 decorator callbacks, B2464 registry/timeout selection, and concrete providers their request/result transforms. B2461 and B2462 implement the generic HTTP callees.
pitfalls:
- Only upload validates passthrough; deletion has no such guard.
- Explicit-null litellm_call_id is retained by delete's fallback logger.
- The unsupported-provider messages are stale lists; the reachable registry is broader.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
