id: B1125
title: Realtime WebSocket route
description: >-
  Register the WebSocket routes /openai/v1/realtime, /v1/realtime and /realtime once in
  betterlite-server::api::realtime_websocket_route. Put the lifecycle policy in the matching core module.
  Own the whole realtime_websocket_endpoint, its nested return_body and _realtime_query_params_template,
  _release_realtime_budget_reservation, _release_realtime_max_parallel_slot and _reject_realtime_session
  at proxy_server.py:12855-13045, including the query-template LRU decorator. Reuse B901's WebSocket transcripts; this route does not
  decode provider frames or introduce a new external-byte parser.

  model, intent and guardrails query parameters default to null. B756 authenticates the handshake and B886's
  can_key_call_resolved_model checks the resolved model before accept. An absent model defaults to
  gpt-realtime-whisper only when intent=transcription. Otherwise reject before accept with attempted close
  1008 and reason "model query parameter is required". Model denial also attempts 1008 with the first 120
  characters of the denial message. On the wire both are a bare HTTP 403, without a WebSocket close frame or
  OpenAI error object. Echo the first nonempty trimmed Sec-WebSocket-Protocol token, not a protocol allowlist.

  Only the client's explicit model and intent enter query_params. The transcription routing default is not
  inserted there. Split truthy guardrails on commas, trim entries, discard empty entries and pass the list in
  data[guardrails], never as an upstream query parameter. A whitespace-only nonempty guardrails value yields
  an empty list; an empty value leaves the field absent. Build the B1004 synthetic request with raw ASGI headers,
  the original WebSocket URL and a body containing the resolved route model.

  Call B004's common_processing_pre_call_logic with route_type=_arealtime and the existing configured
  user_model/user_temperature/user_request_timeout/user_max_tokens/user_api_base values; B004 owns their
  defaults and precedence. B014 route_request selects B1011's realtime transport. B012 supplies logging and
  redaction, B071 owns release_or_invalidate_budget_reservation, and B2400 owns the ProxyLogging disconnect
  adapter to B072's limiter. B124 owns _log_model_access_denial, called only for the caught model denial.
  The query-template cache holds1000 model/intent pairs and returns a fresh dict to each connection;
  None omits a key, while an explicit empty string retains it. No guardrails or arbitrary query key is cached.

  A pre-call Exception sends {type:error,error:{type:guardrail_error,message:str(exception)}} and closes 1011
  with reason "Pre-call error". A send failure logs the debug diagnostic and still attempts close. Rejection
  cleanup awaits budget release, then parallel release. If budget release itself fails, the parallel call is
  not reached. A pre-call BaseException/cancellation instead awaits only parallel release and propagates;
  do not invent budget cleanup on this branch.

  For upstream InvalidStatus, delegate to B1004's error-event/close mapping. Other upstream exceptions are
  redacted by B012, sent as server_error, then closed with 1011 and B1004's 123-byte UTF-8-safe reason or
  "Internal server error" for an empty message. Failure to send or close is debug-logged and does not bypass
  finally. When REALTIME_SESSION_SUCCESS_LOGGED_KEY is truthy, finally releases neither resource. Otherwise
  release budget and, only if REALTIME_SESSION_FAILURE_LOGGED_KEY is false/absent, parallel capacity too.

  Configure master key sk-test and seed virtual keys through B1139/B856 for gateway cases. Compare handshake
  HTTP status and negotiated subprotocol; after accept compare events and close frames. There is no code/param
  field in realtime_error_event, and pre-accept rejection has no close reason to compare. Native lifecycle tests
  inject pending/failing release services and cancellation; do not compare scheduler timing between runtimes.
  Counted ownership is 166 nonblank/non-comment source lines including the decorator and scope template. Allow 190 implementation,
  180 behavior tests,200 transcript fixtures and 40 wiring lines,610 total under a 650-line cap.
