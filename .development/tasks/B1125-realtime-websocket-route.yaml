dod:
- text: >-
    realtime_connect opens /v1/realtime?model=realtime-a&intent=conversation&ignored=x with a valid key and
    Sec-WebSocket-Protocol=" realtime, second ". Expect HTTP 101, negotiated protocol=realtime and upstream
    query containing model=realtime-a,intent=conversation but no ignored key. A mock session.created event
    reaches the client, and a session.update frame reaches the provider in per-direction order. With no
    protocol header the handshake has no Sec-WebSocket-Protocol response. The synthetic pre-call request
    retains the original URL and headers while its body model is realtime-a and route_type is _arealtime;
    its copied ASGI scope has type=http,method=POST,path=/v1/realtime, including on both other aliases.
  proof:
  - case-realtime-connect
  - oracle
- text: >-
    realtime_model_missing_403 uses valid auth and no model, with intent absent and intent=conversation in
    separate steps. Both yield bare HTTP 403 before upgrade, zero upstream connections and no error object,
    close frame or client-visible reason. A native sink records the attempted 1008 with reason="model query
    parameter is required", followed by budget release and parallel release, once each.
  proof:
  - case-realtime-model-missing-403
  - oracle
- text: >-
    realtime_model_denied_403 seeds a key allowed only realtime-a and asks model=realtime-b. Expect bare HTTP
    403 and no upstream connection; B886's denial is logged through B124. A native denial message of 130 ASCII x
    characters attempts code=1008 with exactly 120 x characters. Do not require that reason in the HTTP response.
  proof:
  - case-realtime-model-denied-403
  - oracle
- text: >-
    transcription_default_model requests ?intent=transcription with a key allowed gpt-realtime-whisper.
    Authorization and pre-call body use model=gpt-realtime-whisper, but the upstream URL has only
    intent=transcription and no model query parameter. Expect a 101 handshake and the mock's session.created.
    Explicit model=realtime-a with the same intent uses realtime-a for both authorization and upstream query.
  proof:
  - case-transcription-default-model
  - oracle
- text: >-
    precall_guardrail_1011 connects with model=realtime-a and guardrails=" first, ,second ". Pre-call data
    contains [first,second] in that order. Configure the first guardrail's deterministic failure "blocked";
    after HTTP 101 the client receives {type:error,error:{type:guardrail_error,message:blocked}} then close
    1011,reason="Pre-call error", with no upstream connection. A successful guardrail run forwards neither
    guardrails nor unrelated query keys upstream. Empty guardrails leaves data unset; whitespace/commas yields
    an empty list. Native send-failure coverage records a debug diagnostic, then still closes and releases.
  proof:
  - case-precall-guardrail-1011
  - oracle
- text: >-
    upstream_handshake_refusal makes the mock reject with 401,403,429 and 503. After client HTTP 101, each
    transcript contains {type:error,error:{type:server_error,message:"Upstream realtime handshake rejected
    with HTTP N"}} followed by close 1008 for 401/403, 1013 for 429 and 1011 for 503. The reason equals the
    message with N substituted. The event has no param or code fields, and cleanup runs after the refusal.
  proof:
  - case-upstream-handshake-refusal
  - oracle
- text: >-
    slot_release seeds one key with max_parallel_requests=1 and a budget reservation, opens a valid session,
    then closes before a success/failure logging event. After the release barrier, a second session can acquire
    the slot and the first reservation is released or invalidated through B071. Native flag cases assert
    success=true releases neither resource; success=false,failure=true releases only budget; both false/absent
    release budget then parallel. Pre-call cancellation releases parallel only and propagates cancellation.
    Rejection close failure still reaches cleanup; budget-release failure prevents the following parallel call.
  proof:
  - case-slot-release
  - oracle
- text: >-
    route_aliases connects to /realtime, /v1/realtime and /openai/v1/realtime with model=realtime-a and valid
    auth. Each upgrades with 101, makes one provider connection, relays the mock session.created and closes
    cleanly when the provider closes 1000. No alias returns 404 or registers a duplicate handler.
  proof:
  - case-route-aliases
  - oracle
- text: >-
    auth_missing keeps model=realtime-a but omits Authorization, api-key and credential subprotocols with
    master key sk-test configured. Expect bare HTTP 403, no accepted session and zero provider connections.
  proof:
  - case-auth-missing
  - oracle
- text: >-
    auth_invalid tries Authorization="Basic wrong" and "Bearer sk-wrong" against the configured master key.
    Both fail before accept with bare HTTP 403 and no provider connection. Companion success steps authenticate
    with api-key=sk-test or Sec-WebSocket-Protocol="realtime,openai-insecure-api-key.sk-test" and receive 101,
    protocol=realtime. Putting the credential token first echoes that first token as the selected subprotocol.
  proof:
  - case-auth-invalid
  - oracle
- text: >-
    upstream_internal_failure supplies a native routing exception "api_key=abcdefgh failed" with default B012
    redaction enabled. Expect {type:error,error:{type:server_error,message:"REDACTED failed"}} and close
    1011,reason="REDACTED failed". An empty message uses close reason "Internal server error" but keeps the
    event message empty. Sixty-four é characters remain whole in the event; close reason contains sixty-one é
    characters (122 bytes). Failed sends and failed closes each log debug and still execute the flag-based
    cleanup. B012 owns LITELLM_DISABLE_REDACT_SECRETS; true passes the original message unchanged.
    The HTTP transcript also configures an authorized model whose resolved provider has no realtime handler;
    expect an accepted 101 handshake followed by server_error and close 1011, with no provider connection.
    Compare the error text across gateways while the native injected case pins redaction and empty-message behavior.
  proof: [internal-failure, oracle]
- text: >-
    realtime_query_projection_cache checks None/None ->{},model="" ->{model:""},intent="" ->{intent:""}
    and model=a,intent=transcription ->both keys. Mutating one returned dict does not alter the next cached
    projection. After1001 distinct pairs the first pair can be recomputed with identical values. Through
    /v1/realtime?model=a&model=b with both models authorized, FastAPI's last model value b is selected;
    unrelated query keys stay out of the provider request. A whitespace-only protocol list yields no
    selected subprotocol, while commas/whitespace in guardrails produce an empty list in pre-call data.
  proof: [query-projection, oracle]
- text: The new gateway transcripts compare both proxies' handshakes, frame sequences and recorded upstream query parameters.
  proof:
  - new-oracle-cases
  - oracle
