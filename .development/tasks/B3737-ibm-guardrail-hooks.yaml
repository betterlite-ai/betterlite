id: B3737
title: IBM guardrail lifecycle and examples
description: >-
  Implement guardrail hooks that integrate IBM detector results into the proxy
  request lifecycle across three event points and handle streaming responses.
  Depend on B3736 for detector clients and status/message construction.

  Implement async_pre_call_hook to call the detector on input messages before
  sending to the LLM, extract text from multimodal and Responses-API content,
  batch messages for detector server (one call) or loop for orchestrator (one
  call per text), and raise ValueError with the violation message when
  block_on_detection is true and violations are found. Implement
  async_moderation_hook to run the same detection checks in parallel with the
  LLM call, supporting the during_call mode without modifying the request.
  Implement async_post_call_success_hook to check LLM response content,
  extracting text from ModelResponse.choices, batching or looping per detector
  mode, raising violations when block_on_detection is true, and detecting when
  the response has no text content (e.g., tool calls) and skipping the check
  gracefully. Implement async_post_call_streaming_iterator_hook as a pass-through
  that yields streaming response items unchanged (the hook exists for compatibility
  and may be extended by future tasks for response redaction or content modification).

  Both async_pre_call_hook and async_moderation_hook call should_run_guardrail to
  check if the hook is enabled for the current event type, and add_guardrail_to_applied_guardrails_header
  to record that the guardrail ran. Post-call hooks do the same for guardrail_intervened
  or after checking for text content. All hooks call iter_message_text to extract
  string content from messages, respecting multimodal structures.

  Document the IBM detector integration in docs/ibm-guardrails/README.md,
  preserving features, configuration parameters (required and optional), API
  endpoint formats, response shapes, supported event hooks (pre_call, during_call,
  post_call), error handling, and environment variable usage. Remove Python-specific
  usage examples (imports, litellm CLI invocations) that do not apply to a Rust
  gateway, keeping provider-neutral documentation of parameters, response formats,
  and the distinction between detector-server batching (multiple texts in one
  request, nested list response) and orchestrator mode (one text per call, flat
  list response). Carry example_config.yaml showing detector-server and orchestrator
  configurations with required and optional parameters, and validate that the
  example parses against the guardrail configuration schema.

  IBM Guardrails has no unique risk (it does not access keys, budgets, or
  credentials beyond auth_token from configuration or environment). Review level
  is standard for all hooks and error handling code.

