deviations: []

out_of_scope:
  - "Detector HTTP clients, score filtering, status projection and violation message construction: owned by B3736 (_call_detector_server, _call_orchestrator, _filter_detections_by_threshold, both _create_error_message_* methods)."
  - "CustomGuardrail base class, decorator contract and should_run_guardrail gating: owned by framework (U1)."
  - "Text extraction utility iter_message_text: inherited from framework utility (U1)."
  - "Applied-guardrails header helper add_guardrail_to_applied_guardrails_header: owned by callback utilities (U3)."
  - "Configuration parsing and environment resolution: owned by configuration crate (U4)."
  - "ModelResponse and streaming response types: owned by wire format."

pitfalls:
  - "Detector server batches all input texts in one request returning nested lists (one per input text); orchestrator processes each text one at a time with flat list response. Hook code path must use the correct response shape for each mode via is_detector_server flag."
  - "Post-call hook must check isinstance(choice, litellm.Choices) and choice.message.content is a string before extracting text; empty content (tool calls, etc.) is gracefully skipped to avoid sending empty/non-string content to IBM detector."
  - "All hooks must call should_run_guardrail to respect event_hook configuration; returning false stops hook execution before any detector call. All hooks add guardrail name to applied_guardrails header unconditionally, even if should_run_guardrail returns false or no violations found."
  - "ValueError is raised with the exact message format from B3736's _create_error_message_* constructors; message construction differs between detector server (per-message grouping) and orchestrator (flat list) modes."
  - "Streaming iterator hook is a pass-through that yields items unchanged; it remains callable through dispatch even when never invoked, so it is not a dead-code candidate."
  - "block_on_detection is set at initialization; when false, violations are detected but ValueError is not raised; hook returns normally without modification."

review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
