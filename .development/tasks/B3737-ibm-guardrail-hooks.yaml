dod:
  - text: >-
      async_pre_call_hook extracts message text, calls detector server with
      batched messages or orchestrator one per text, and raises ValueError with
      violation message when block_on_detection is true and violations found.
    proof: [pre-call-behaviors, ibm-hooks-oracle]
  - text: >-
      async_moderation_hook calls should_run_guardrail and runs the same
      detection logic as pre_call, recording guardrail_intervened status
      without modifying the request data.
    proof: [during-call-behaviors, ibm-hooks-oracle]
  - text: >-
      async_post_call_success_hook extracts text from ModelResponse.choices,
      skips gracefully when no text content is present (e.g., tool calls),
      and raises violations when block_on_detection is true.
    proof: [post-call-behaviors, ibm-hooks-oracle]
  - text: >-
      async_post_call_streaming_iterator_hook yields streaming items unchanged;
      it is a pass-through that does not modify response content.
    proof: [streaming-behaviors]
  - text: >-
      All four hooks call should_run_guardrail to respect event_hook configuration
      and call add_guardrail_to_applied_guardrails_header to record guardrail application.
    proof: [hook-configuration-tests, ibm-hooks-oracle]
  - text: >-
      should_run_guardrail returns false when the hook is not enabled for the
      current event type, and all hooks respect this decision.
    proof: [hook-configuration-tests, ibm-hooks-oracle]
  - text: >-
      get_config_model returns the configuration model for the guardrail,
      and get_supported_event_hooks returns [pre_call, post_call, during_call]
      in that exact order.
    proof: [class-method-tests, hook-configuration-tests]
  - text: >-
      Documentation at docs/ibm-guardrails/README.md covers features,
      configuration parameters, API endpoints, response formats, supported event
      hooks, error handling and environment variables, with Python-specific usage
      examples removed. Example YAML configuration at docs/ibm-guardrails/example_config.yaml
      documents detector-server and orchestrator modes.
    proof: [docs-present, example-config-loads]
  - text: >-
      Example configuration file validates against the guardrail schema and
      parses into the configuration model.
    proof: [example-config-loads]

checks:
  optional: []
  commands:
    - id: pre-call-behaviors
      why: Pre-call hook text extraction, detector calls, violation handling or header recording absent or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_hooks::pre_call::tests::/) - test(/replays_the_/)'
    - id: during-call-behaviors
      why: During-call hook event type checking, detector calls or status logging absent or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_hooks::during_call::tests::/) - test(/replays_the_/)'
    - id: post-call-behaviors
      why: Post-call hook response parsing, text extraction, empty-response handling or violations absent or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_hooks::post_call::tests::/) - test(/replays_the_/)'
    - id: streaming-behaviors
      why: Streaming iterator hook tests missing or fail
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_hooks::streaming::tests::/) - test(/replays_the_/)'
    - id: hook-configuration-tests
      why: Hook event type checking, should_run_guardrail, get_config_model, get_supported_event_hooks or header recording absent or wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_hooks::config::tests::/) - test(/replays_the_/)'
    - id: class-method-tests
      why: Class methods get_config_model or get_supported_event_hooks absent or return wrong values
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_hooks::class_methods::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails
      run: test -f tools/oracle/helpers/b3737.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: ibm-hooks-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/ibm-hooks-*")" && grep -rlq "ibm_hooks" tools/oracle/fuzz/corpus/helper_case/ibm-hooks-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: ibm-hooks-oracle
      why: Oracle cases exercising all event hooks, violations and error handling are missing or fail
      run: test -d tools/oracle/cases/helpers/ibm-hooks && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/ibm-hooks)" && cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/ibm-hooks
    - id: docs-present
      why: Configuration documentation or examples missing from docs/ibm-guardrails/
      run: test -f docs/ibm-guardrails/README.md && test -f docs/ibm-guardrails/example_config.yaml
    - id: example-config-loads
      why: Example YAML does not validate or parse correctly
      run: test -f docs/ibm-guardrails/example_config.yaml && cargo run --locked -p betterlite-config --quiet -- validate docs/ibm-guardrails/example_config.yaml

