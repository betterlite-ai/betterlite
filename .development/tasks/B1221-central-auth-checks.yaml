  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_exception_handler.py#L47-L106
    why: Auth exceptions become public HTTP type, param and code.
dod:
  - text: >-
      Cases public_exemption, pass_through_auth_not_true, exact_path_only, no_auth_dev_skip,
      custom_common_off, forced_checks_override_skips, reuse_end_user_id, stamp_key_budget_identity,
      concurrent_positional_fetches, dashboard_team_no_read, no_user_no_upsert,
      empty_token_global_spend, first_auth_exception_propagates, missing_team_keeps_other_context,
      token_vouched_team_fallback, rejected_team_fallback, carry_before_org_inheritance,
      snapshot_rebind_preserves_null_and_zero, absent_entity_keeps_snapshot,
      admin_role_not_demoted, project_context_copied, custom_budget_overlay,
      metadata_preseed_before_header_tags, common_policy_order, priced_model_checks,
      free_model_skips_team_budget, reservation_after_checks and batch_release_on_each_exit
      assert the named call order, inputs, error envelope and downstream suppression.
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^central_auth_checks::tests::/)
        - test(/replays_the_/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^central_auth_checks::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/central-auth-checks-*")"
        && grep -rlq "pass_through_endpoints" crates/betterlite-config/fuzz/corpus/config_yaml/central-auth-checks-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::central_auth_checks::tests::/)
        - test(/replays_the_/)'
