id: B1221
title: Centralized authenticated common-check composition
description: >-
  Compose common checks once for an authenticated principal. Unless force_virtual_key_checks=true,
  skip B868 public routes/B741 additional-public routes, exact configured pass-through paths whose auth
  is not boolean true (missing, null and non-boolean values included), B756 no-auth dev mode, then
  custom auth when custom_auth_run_common_checks is false. Read only general_settings.pass_through_endpoints
  (default None) and general_settings.custom_auth_run_common_checks (default False); there are no
  top-level aliases and no pass-through registry lookup. Forced checks bypass all four exemptions.

  Reuse token.end_user_id, otherwise B880 extracts/validates it using headers and request data plus
  B739's key default budget ID. Stamp a resolved ID back only when the key budget ID is non-null.
  Concurrently B888 _safe_fetch retrieves team (except litellm-dashboard), user without upsert, project,
  end-user (only truthy ID, passing token/key budgets), and global spend with token or empty string.
  B1225 _noop_none keeps positions for absent entities. Gather exceptions per slot. In positional order
  propagate ProxyException/BudgetExceededError before any fallback. Team HTTPException falls back only
  when B888 _token_can_vouch_for_team accepts it; otherwise rethrow. Dashboard always uses the token
  team snapshot. Other exception-valued slots become None independently, preserving successful slots.

  Own carry_team_and_user_budget_state from carried_budget_state.py L18-L34, whose only production caller
  is this stage. When a team exists, replace team_budget_snapshot with B2313's budget_reset_at/max_budget
  record and copy team_model_max_budget, including None/empty values. When a user exists, replace
  user_budget_snapshot with budget_reset_at/max_budget/user_alias. Missing entities leave old snapshots
  untouched; do not clear them. Then call B888 _inherit_org_identity. PROXY_ADMIN token role
  replaces even a non-admin DB user with an admin user object, retaining only fetched spend (zero if
  absent) and token.user_id or litellm_proxy_admin_name. Copy project metadata/alias to the token. With
  truthy end_user_id, non-null key budget ID and DB, call B1225's budget overlay, preserving token limits
  only for custom auth. Compute the free-model bypass through B1225. B1106 pre-seeds litellm_metadata
  for its routes before merging x-litellm-tags, so header tags participate in budget checks.

  Bind B2316 admission counter keys, then in try/finally call B754 common_checks, B753 team-model budget
  only when budgets are not skipped (model resolution through B881), and B1225 reservation handoff.
  Always release_spend_counter_batch for failures/success in that try; earlier failures occur before
  this release scope. No admin bypass of common_checks exists here. B757 renders HTTPException as
  auth_error with its status/param (default string None), BudgetExceededError as 429 budget_exceeded
  param null, and preserves ProxyException. The individual checks own their error details.


  Build the production central_auth_checks module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/user_api_key_auth.py:
  _run_centralized_common_checks (L2755-L3110; 276 source lines).
  Also own carry_team_and_user_budget_state (carried_budget_state.py L18-L34; 17 executable lines).


  B002 config tests load the two general_settings fields and preserve their source branch semantics.


  This is stateful orchestration, so exercise it in native integration tests and booted HTTP oracle cases.
  Use actual fetch, budget and reservation implementations with POSTGRES_TEST_URL or testcontainers;
  do not add a helper adapter that replaces the pipeline with recorded collaborators.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::central_auth_checks::tests::default_common_checks, pass_through_auth_presence and custom_common_enabled.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 293 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  293 production, 345 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 753 changed lines estimated within a 775-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::central_auth_checks::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
