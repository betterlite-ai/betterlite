id: B141
title: Real backend auth for A2A forwarding, and the A2A invoke cases over HTTP
description: >-
  Last part of the agents umbrella. Its parts built every function of LiteLLM's proxy/agent_endpoints/a2a_endpoints.py, and B8648 mounts the A2A routes. Two things are left. First, B4788's `resolve_backend_auth` chooses between two ports, `AppAuth` (Databricks App OAuth) and `HopAuth` (the Entra hop), and nobody gives the A2A route state real implementations of them: B8648 passes the placeholder `NoBackendAuth`, which answers no header for every agent. LiteLLM's `_resolve_backend_auth_header` calls `resolve_databricks_app_auth_header` over the module singleton `databricks_app_oauth_token_cache`, or `resolve_a2a_hop_auth_header` with the default Entra resolver `resolve_azure_ai_agent_auth_header`. Second, the A2A parts were planned before any route existed, so nothing proves their forwarding over HTTP. This task builds the two adapters, swaps them into the state, and adds the HTTP cases.

  Where. Module `app::agents::a2a_backend_auth` in betterlite-server (crates/betterlite-server/src/app/agents/a2a_backend_auth.rs and a2a_backend_auth/**: databricks.rs, entra.rs, error.rs, tests.rs); the skeleton declares it in app/agents.rs. Add betterlite-proxy, betterlite-provider and betterlite-foundry to crates/betterlite-server/Cargo.toml if they aren't there yet. No statics, no trait objects where a generic works, native async fn. Read crates/betterlite-proxy/src/agent_endpoints/a2a_forwarding.rs first for the exact `AppAuth` and `HopAuth` signatures, crates/betterlite-proxy/src/agent_endpoints/databricks_oauth/header.rs and token_cache.rs for B4782's API, B8100's `resolve_a2a_hop_auth_header` in crates/betterlite-provider/src/a2a_chat and B549's `resolve_azure_ai_agent_auth_header` in crates/betterlite-foundry/src/credentials.

  1. `DatabricksAppAuth` (databricks.rs) implements `AppAuth`. It holds one `Arc<DatabricksAppOAuthTokenCache>` and the secret lookup. `DatabricksAppAuth::new(http: ProxiedClient, secrets: Arc<SecretLookup>, environment: Arc<BTreeMap<String, String>>)` builds the cache once with `DatabricksAppOAuthTokenCache::new(http, clock)`, where the clock returns the wall time in seconds as f64. The state is built once at mount, so the cache is shared by every A2A request, as LiteLLM's module singleton is (B4782's deviation says the caller owns one cache). Its method reads the agent's litellm_params into B4782's `AgentLitellmParams` (a serde read of the same map; a wrong shape is the error B4782's parse gives), calls `resolve_oauth_header(&cache, &params, &lookup)` and maps `Some(value)` to the one pair ("Authorization", value) and `None` to `None`. `lookup` is a small `EnvironmentLookup` impl in this module: `lookup(name)` answers `secrets.get_secret_str(environment, "os.environ/<name>", None)`, so an `os.environ/` reference in the databricks_oauth block resolves through LiteLLM's get_secret_str (secret manager first when one is configured, then the environment) and not through std::env. Use the environment map the other `shared.secrets` callers pass; don't read std::env here.

  2. `EntraHopAuth` (entra.rs) implements `HopAuth` by calling B8100's `resolve_a2a_hop_auth_header(litellm_params, custom_llm_provider, resolver)` with B549's `resolve_azure_ai_agent_auth_header` as the resolver. B8100 returns None unless custom_llm_provider is empty and one of azure_ad_token, client_secret or azure_password is truthy; then the resolver mints "Authorization: Bearer <token>". Keep that rule where B8100 wrote it; this adapter only connects the two.

  3. Errors (error.rs). `BackendAuthError` has one variant per source (`Databricks(DatabricksOauthError)`, `Entra(...)` with B549's error, and the params read). Each is `#[error(transparent)]`, because B8589 answers any error here as -32603 "Internal error: <message>" with status 500 and the message must be LiteLLM's ValueError text, for example "Databricks App OAuth config is missing required field(s): client_secret" or "Databricks App OAuth token request failed with status 401".

  4. Swap. In crates/betterlite-server/src/app/agents/a2a/state.rs replace only the `NoBackendAuth` B8648 passes to `A2aRouteState` with `DatabricksAppAuth::new(shared.http.clone(), shared.secrets.clone(), environment)` (the environment map from item 1) and `EntraHopAuth`, and delete `NoBackendAuth`. Leave the other collaborators and B7980's stream generator as they are. Read crates/betterlite-server/src/agent_endpoints/a2a_routes.rs for the parameter names A2aRouteState gives the two ports.

  Rust tests in app::agents::a2a_backend_auth::tests, against a local tokio TcpListener for the token endpoint: DatabricksAppAuth answers the bearer pair for a full block, answers None without a databricks_oauth key, resolves an os.environ/ client_secret through the secret lookup, fetches the token once for two calls with the same block (the shared cache), and returns the B4782 error unchanged for a missing field; EntraHopAuth answers the bearer from a raw azure_ad_token, None when custom_llm_provider is set, None without Entra params, and B549's error for a client_secret without tenant_id and client_id.

  HTTP oracle cases through the booted proxy, in tools/oracle/cases/agents/a2a-invoke/, with the master key and no database. Each config declares one agent under `agents` with agent_name oracle-agent and agent_card_params {name: oracle-agent, url: "{{upstream}}"}, set up like B8648's card-config-agent case, plus the litellm_params, static_headers or extra_headers the case needs. Requests go to POST /a2a/oracle-agent with a JSON-RPC 2.0 body. The tasks/* methods forward through forward_jsonrpc, so the mock answers one JSON-RPC body such as {"jsonrpc": "2.0", "id": "<same id>", "result": {"id": "task-1", "contextId": "ctx-1", "kind": "task", "status": {"state": "completed"}}}. Compare the response and the upstream request, and list the forwarded headers under upstream_headers.
  (1) forward-headers: tasks/get with x-litellm-trace-id oracle-trace-1, a header named in the agent's extra_headers (x-forward-me), a prefixed header x-a2a-oracle-agent-x-tenant, and a static header X-Static on the agent; the agent receives x-forward-me, x-tenant, x-static, x-litellm-user-id and x-litellm-trace-id. (2) pascal-case-method: method GetTask; the agent receives tasks/get and the answer is converted for A2A 1.0. (3) version-header: method tasks/get with header a2a-version 1.0, answered in the 1.0 shape. (4) extended-card: agent/getAuthenticatedExtendedCard; the agent's card comes back with url and the first supportedInterfaces url pointing at the proxy (compare the url the way B8648's card-config-agent case does). (5) push-url-http: tasks/pushNotificationConfig/set with pushNotificationConfig.url "http://example.com/hook", 400 with detail "Push notification URL must use HTTPS" and no upstream call. (6) push-config-not-object: pushNotificationConfig "hook", 400 "pushNotificationConfig must be an object". (7) push-url-not-string: params.url 42, 400 "Push notification URL must be a string". (8) method-not-found: method tasks/unknown, 400 and -32601 "Method 'tasks/unknown' not found". (9) send-invalid-params: message/send with params {"message": 5}, 400 and -32602, ignoring /error/message (B6950 logs that text as its own deviation). (10) trace-id-required: litellm_params require_trace_id_on_calls_to_agent true and no trace header, 400 with the "requires x-litellm-trace-id header on all inbound requests." detail. (11) databricks-bearer: litellm_params databricks_oauth {client_id: oracle-client, client_secret: os.environ/ORACLE_DATABRICKS_SECRET, workspace_url: "{{upstream}}"} with that env var set; the mock answers the token request (POST /oidc/v1/token) with {"access_token": "oracle-dbx-token", "expires_in": 3600}, then the tasks/get forward, and both calls list authorization under upstream_headers. (12) databricks-missing-secret: the block without client_secret, 500 and -32603 "Internal error: Databricks App OAuth config is missing required field(s): client_secret", no upstream call. (13) databricks-token-401: the token endpoint answers 401, 500 and -32603 "Internal error: Databricks App OAuth token request failed with status 401". (14) entra-bearer: litellm_params azure_ad_token oracle-entra-token and static_headers {Authorization: Bearer static-token}; the agent receives the minted bearer, not the static one. (15) entra-unresolved: litellm_params client_secret only, 500 and -32603 with B549's "Azure AI agent Entra ID credentials did not resolve to a token." message. (16) bridge-agent-no-hop-auth: the entra-bearer agent with custom_llm_provider openai also set; tasks/get still forwards and the agent receives no authorization header.

  message/send and message/stream don't go through forward_jsonrpc. LiteLLM hands them to asend_message and asend_message_streaming with api_base set to the agent's url, and its A2A client first GETs /.well-known/agent-card.json from that base and then posts the JSON-RPC call to the url inside the card it got back. B9850 makes the mock replace `{{upstream}}` in an answer with its own address, so the card answer is {"name": "oracle-agent", "description": "Oracle agent", "url": "{{upstream}}", "version": "1.0.0", "protocolVersion": "0.3.0", "preferredTransport": "JSONRPC", "capabilities": {"streaming": true}, "defaultInputModes": ["text"], "defaultOutputModes": ["text"], "skills": []} and the second call reaches the same mock at path /. a2a-sdk 1.1.0's JSON-RPC transport sends `str(uuid4())` as the id of that second call, so both cases list `{pointer: /upstream/1/body, why: ...}` under compare.ignore (B9850's body selector), compare the method, path and upstream_headers x-litellm-trace-id and x-litellm-agent-id of both calls, and send x-litellm-trace-id so the forwarded trace id is fixed. (17) message-send: POST /a2a/oracle-agent with {"jsonrpc": "2.0", "id": "oracle-send", "method": "message/send", "params": {"message": {"role": "user", "parts": [{"kind": "text", "text": "hello"}], "messageId": "oracle-msg-1"}}} and x-litellm-trace-id oracle-trace-send; the mock answers the card, then {"jsonrpc": "2.0", "id": "oracle-upstream", "result": {"kind": "task", "id": "task-1", "contextId": "ctx-1", "status": {"state": "completed"}}}, and the client gets that task under its own id oracle-send. (18) message-stream: the same request with method message/stream, id oracle-stream and trace id oracle-trace-stream; the mock answers the card, then status 200 with content-type text/event-stream and two events, a status-update for task-1 in state working with final false and one in state completed with final true, and the client gets both as data frames in order under the id oracle-stream.
