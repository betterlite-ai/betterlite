deviations: []
out_of_scope:
  - "_validate_push_notification_url, _caller_identity_headers, _resolve_backend_auth_header, _forwarding_headers, _jsonrpc_error, _enforce_inbound_trace_id, _jsonrpc_body and _forward_jsonrpc: B4788, which also owns the AppAuth and HopAuth ports."
  - "_sse_event, _to_jsonrpc_object, _a2a_sse_event_source, _sse_streaming_response, _forward_jsonrpc_sse and _handle_stream_message: B4789. _build_message_send_params: B6950."
  - "_PASCAL_TO_WIRE, _served_version, _get_agent, get_agent_card and invoke_agent_a2a: B8589. Mounting the routes and building the rest of the A2A state: B8648. The production stream generator in that state and the tasks/resubscribe cases: B7980."
  - "resolve_oauth_header, the token cache and the token fetch: B4782. resolve_a2a_hop_auth_header: B8100. The Entra token minting and resolve_azure_ai_agent_auth_header: B549."
  - "The mock's address in an answer and the body selector the message cases use: B9850. The deferred success log around message/send (a2a_endpoints.py L865-L890) gets no case: its only visible effect is that a post-call guardrail's result reaches the logged payload, and no HTTP case compares a logged payload."
pitfalls:
  - "The Databricks side is chosen on a truthy databricks_oauth value, so `databricks_oauth: {}` falls through to the hop side, while a non-empty block without client_secret is a -32603 500 and never a request without auth."
  - "Build the token cache once in DatabricksAppAuth::new; a cache made per request fetches a new token on every A2A call, where LiteLLM's databricks_app_oauth_token_cache is one per process."
  - "The minted Authorization replaces a static or extra header of the same name in any letter case (B4788 compares lowercase), which is what the entra-bearer case checks with its static Authorization."
  - "A completion-bridge agent (custom_llm_provider set) keeps its Entra params for the model provider, so the hop gets no Authorization even when azure_ad_token is set."
  - "The mock replaces authorization values with a hash, so the bearer cases compare equal hashes; the Databricks token request also carries a Basic authorization that is hashed the same way."
  - "Send x-litellm-trace-id in the forward-headers case; without a chain id header the forwarded X-LiteLLM-Trace-Id is not a fixed value."
  - "The message cases see two upstream calls per side, the card GET at index 0 and the JSON-RPC POST at index 1, so the body selector is `/upstream/1/body`; `/upstream/0/body` would hide nothing and let the uuid id fail the case."
  - "The card's url must be exactly `{{upstream}}`: a card that names another host makes LiteLLM's client fail to connect, and a localhost card url then triggers its localhost retry against api_base, a different flow from the one these cases check."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
