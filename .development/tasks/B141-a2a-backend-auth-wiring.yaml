dod:
  - text: The A2A route state gets DatabricksAppAuth over one token cache built at mount and EntraHopAuth, and NoBackendAuth is gone.
    proof: [backend-auth-tests, no-placeholder-left]
  - text: DatabricksAppAuth answers the Authorization pair for a full block, None without one, resolves os.environ/ values through the secret lookup, reuses the cached token, and passes B4782's error through with its own message.
    proof: [backend-auth-tests]
  - text: EntraHopAuth answers the Entra bearer only for an agent without custom_llm_provider that has Entra params, and passes B549's error through.
    proof: [backend-auth-tests]
  - text: Through the booted proxy the tasks/* forward sends the identity, trace, extra, prefixed and static headers and the minted Databricks or Entra bearer as LiteLLM does, and a bad Databricks or Entra setup answers -32603 with 500.
    proof: [oracle]
  - text: Through the booted proxy the PascalCase method and the a2a-version header get the 1.0 answer, the extended card points at the proxy, and the push URL, unknown method, invalid params and missing trace id answers match LiteLLM.
    proof: [oracle]
  - text: Through the booted proxy message/send and message/stream read the agent's card, call the url inside it with LiteLLM's trace and agent id headers, and answer the task or the two stream frames under the caller's id as LiteLLM does.
    proof: [oracle]
  - text: B8648's A2A state tests still pass after the swap.
    proof: [a2a-state-tests]
checks:
  optional: [mutants]
  commands:
    - id: backend-auth-tests
      why: an adapter is missing or answers the wrong header or error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::agents::a2a_backend_auth::/)'
    - id: no-placeholder-left
      why: the A2A state still forwards without backend auth
      run: grep -q 'DatabricksAppAuth' crates/betterlite-server/src/app/agents/a2a/state.rs && grep -q 'EntraHopAuth' crates/betterlite-server/src/app/agents/a2a/state.rs && ! grep -rq 'NoBackendAuth' crates/betterlite-server/src
    - id: a2a-state-tests
      why: the swap broke the A2A state tests B8648 wrote
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::agents::a2a::/)'
