oracle_cases: []

deviations:
  - what: "GraySwanGuardrail.__init__ calls get_async_httpx_client(llm_provider=httpxSpecialProvider.GuardrailCallback) directly to obtain the HTTP client; betterlite injects this client as a dependency rather than calling the factory."
    why: "HTTP client creation is a boundary between guardrails and the transport layer. B104 owns the factory; this task receives the client as a constructor parameter."
  - what: "The violation_threshold default is 0.5; on_flagged_action default is monitor in the constructor and passthrough in the config model's optional params. The constructor and config must be kept separate so the normalizer can preserve which value actually reaches constructor initialization."
    why: "Config defaults (passthrough) and constructor defaults (monitor) diverge by design; the normalizer controls which is active."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/grayswan.py#L12-L13"
  - what: "The _post_call_context function calls load_guardrail_translation_mappings() to obtain handlers for structured message extraction; this dependency is resolved at call time, not import time."
    why: "Translation mappings are loaded per-call to avoid circular dependencies and allow handler registration at runtime."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/grayswan/grayswan.py#L625"
  - what: "safe_json_loads with default={} is used to recover from JSON parsing failures in _prepare_payload; the default is restored explicitly when the parsing fails."
    why: "Malformed litellm_metadata should not block payload construction; the fallback ensures the payload is always populated with a sanitized version."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/grayswan/grayswan.py#L708"

out_of_scope:
  - "GraySwanGuardrail.apply_guardrail body and decision/enforcement (belongs to B3771)"
  - "GraySwanGuardrail._process_response_internal and violation formatting (belongs to B3771)"
  - "Lifecycle entry points and callback registration (belong to B107)"
  - "Frame dispatch and route registration (belong to B104 and gateway framework)"

pitfalls:
  - >-
    The api_key field is security-sensitive and must never be logged, printed in Debug output, or exposed
    in error messages. Mark the field as SecretString and use only in the Authorization and grayswan-api-key
    headers. Never include api_key in log messages or exception details.
  - "The _as_plain_dict function must use TypeAdapter(dict[str, object]).validate_python(item.model_dump(mode='json')) for BaseModel, not model_dump() alone, to ensure the output is a plain dict not a pydantic model."
  - "GraySwanGuardrailAPIError status_code is optional but must be stored as an attribute when present; use getattr(exc, 'status_code', None) to extract it from the original exception."
  - "on_flagged_action validation is case-insensitive (value.lower()); normalize to lowercase before storing."
  - "violation_threshold from on_flagged_action config param is 'passthrough' (string), not a boolean; distinguish it from the constructor's on_flagged_action='monitor' default."
  - "_extract_inbound_headers searches multiple paths in order of preference; only headers from proxy_server_request.headers take precedence, and it must return None (not empty dict) when no matching headers are found."
  - "_post_call_context returns ((), None) when call_type is unresolvable, not an exception; this allows graceful degradation when translation handlers are unavailable."
  - "safe_json_loads(..., default={}) on line 708 means that even if sanitized content fails to parse, the fallback dict {} is used; betterlite must preserve this exact behavior."
  - "fail_open (default true) must allow the request to proceed on any error except ModifyResponseException and GRAYSWAN_BLOCK_ERROR_MSG errors."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
