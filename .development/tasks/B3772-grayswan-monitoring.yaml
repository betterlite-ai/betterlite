id: B3772
title: Gray Swan monitoring transport and request context
description: >-
  Build Gray Swan's HTTP monitoring endpoint call, request context extraction for post-call hooks, and payload preparation logic in betterlite-guardrails. The constructor manages settings and defaults; the monitoring call sends the prepared payload and extracts inbound headers for forwarding.

  GraySwanGuardrail.__init__ accepts guardrail_name, api_key (with GRAYSWAN_API_KEY env fallback), api_base (with GRAYSWAN_API_BASE env fallback, default https://api.grayswan.ai), on_flagged_action (default monitor, validates against {block, monitor, passthrough}), violation_threshold, reasoning_mode, categories, policy_id, streaming_end_of_stream_only, streaming_sampling_rate, fail_open (default true), and guardrail_timeout (default 30.0). Constructor raises GraySwanGuardrailMissingSecrets with message "Gray Swan API key missing. Set `GRAYSWAN_API_KEY` or pass `api_key`." when neither the passed api_key parameter nor the GRAYSWAN_API_KEY environment variable provides a key. The constructor must preserve the monitor action's default and config model's separate passthrough default; normalizers must preserve which value reaches the constructor.

  _prepare_payload accepts messages (as tuple of dicts/mappings), dynamic_body (from request metadata), request_data (the original request), logging_obj (optional), and tools (optional). It builds a payload dict with messages, tools (if present), categories (from dynamic_body or self), policy_id (from dynamic_body or self), reasoning_mode (from dynamic_body or self), metadata (from dynamic_body if present), and litellm_metadata (merged from inbound headers and request metadata, sanitized with safe_json_loads/safe_dumps default={}). When litellm_metadata is not a dict or is empty after sanitization, it is omitted.

  _post_call_context accepts request_data, logging_obj, and scan_only_tool_results (bool). It extracts the call type from request_data.litellm_metadata.user_api_key_request_route or logging_obj.call_type, loads the structured message handler for that call type, extracts messages, applies scoped indices with skip_system and skip_tool flags, extracts tool definitions (if not scan_only_tool_results), and returns (tuple of message dicts, tools tuple or None). When the call type is unresolvable or structured extraction fails, it returns ((), None).

  _extract_inbound_headers accepts request_data and logging_obj. It searches for headers in proxy_server_request.headers, request_data.headers, metadata.headers, or logging_obj.model_call_details.litellm_params.metadata.headers (in order). It filters for lowercase key "shade_scan_id" only and returns a dict of forwarded headers or None if none match.

  _call_grayswan_api prepares headers with Bearer token, application/json content type, and grayswan-api-key header, then calls async_handler.post() with the monitor URL, headers, payload JSON, and timeout. On any error, wraps it as GraySwanGuardrailAPIError with extracted status_code.

  Build GraySwanGuardrailAPIError(Exception) with __init__ accepting message and optional status_code, and store status_code as an attribute.

  Build the helper functions:
  - _as_plain_dict: accept object, check isinstance(item, Mapping) and return it, check isinstance(item, BaseModel) and return item.model_dump(mode="json") as dict, otherwise cast(Mapping[str, object], item)
  - _resolve_threshold: accept optional float, return float(value) if value is not None, else try os.getenv("GRAYSWAN_VIOLATION_THRESHOLD") as float (catching ValueError), else return 0.5
  - _resolve_reasoning_mode: accept optional str, validate value.lower() in {off, hybrid, thinking}, else check os.getenv("GRAYSWAN_REASONING_MODE") with same validation, else return None
  - _is_grayswan_exception: accept Exception, return True if isinstance(exc, ModifyResponseException), or if exc.detail is dict and detail.get("error") == "Blocked by Gray Swan Guardrail"
  - _log_guardrail_failure: accept exc, request_data, start_time, end_time, optional status_code. Call add_standard_logging_guardrail_information_to_request_data with guardrail_status="guardrail_failed_to_respond", guardrail_provider="grayswan", duration=end_time - start_time. Log error with status_code if present.

  GraySwanGuardrail extends CustomGuardrail and implements get_supported_event_hooks() returning [pre_call, during_call, post_call] and should_run_guardrail(data, event_type) calling parent and logging event_type, event_hook, has_apply_guardrail, class name. GraySwanGuardrailConfigModel.ui_friendly_name() returns "Gray Swan Guardrail".

  These functions own the monitor transport and context collection; B3771 owns the decision/enforcement logic, and B107 owns lifecycle entry points.

