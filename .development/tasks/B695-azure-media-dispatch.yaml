id: B695
title: Azure image and audio operation composition
description: >-
  Install Azure image generation/edit, OpenAI/native speech and transcription through the closed provider dispatcher
  using resolved Azure settings and leaf adapters.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Install these completed leaf operations: B535 Azure image HTTP execution and operation polling; B536 Azure image
  generation and edits; B537 Azure OpenAI speech transport; B538 Azure native SSML synthesis; B539 Azure native
  and OpenAI transcription. Each dispatch fixture must reach its leaf with a fake transport and assert the resulting
  request or reply; accept already normalized settings and reuse leaf errors.


  Implement crates/betterlite-provider/src/azure_media_dispatch.rs with adjacent tests under azure_media_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_media_dispatch in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_media_dispatch_cases in betterlite-provider with these exact named cases (one per
  oracle file): image_generation, image_edit, openai_speech, native_ssml, transcription. Each case exercises its
  named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_media_dispatch* using HelperCase: kind:
  helper and the externally tagged azure_media_dispatch variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_media_dispatch that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone azure_media_dispatch_unsupported_operation in betterlite-provider for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 145 production lines, 105 behavior/config-test lines, 105 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 395 planned, 400 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
