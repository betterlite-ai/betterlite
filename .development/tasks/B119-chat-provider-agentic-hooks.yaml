id: B119
title: Provider-level chat agentic hooks for web search
description: >-
  LiteLLM runs an older agentic loop for web search on chat completions inside the provider call, before the
  main.py chat loop that B8294 ports. OpenAIChatCompletion.acompletion calls `_call_agentic_completion_hooks_openai`
  (openai.py L547-L625) on every non-stream answer, and BaseLLMHTTPHandler.async_completion calls
  `_call_agentic_chat_completion_hooks` (llm_http_handler.py L5899-L6050) with its plan executor
  `_execute_chat_completion_agentic_plan` (L5607-L5665). Both walk litellm.callbacks and call three chat-only
  CustomLogger hooks (custom_logger.py L792-L836): async_should_run_chat_completion_agentic_loop,
  async_run_chat_completion_agentic_loop and async_build_chat_completion_agentic_loop_plan. Only the web search
  interception overrides them (handler.py L789-L847 and L1092-L1152), and B4117 and B4119 built their bodies. No
  betterlite trait carries these hooks and nothing runs the two loops, so an openai deployment with
  websearch_interception would answer a search through B8294's plan path instead. That path gives the follow-up depth 1
  and the max_agentic_loops ceiling, while LiteLLM's OpenAI loop sends a follow-up with no depth and never caps it. This
  task adds the hooks, both loops and the gateway call for the OpenAI provider. It is what is left of the B119 umbrella
  after its parts.


  Trait. Edit B9820's crates/betterlite-context/src/agentic_callback.rs and add four default methods to
  `AgenticCallback`, keeping every existing item as it is:
  - `async fn should_run_chat_agentic_loop(&self, call: &AgenticCall<'_>) -> Result<AgenticGate, AgenticHookError>`,
    default `AgenticGate { run: false, tools: JsonMap::new() }`, CustomLogger's `(False, {})`.
  - `async fn build_chat_agentic_loop_plan(&self, call: &AgenticLoopCall<'_>) -> Result<AgenticLoopPlan,
    AgenticHookError>`, default `AgenticLoopPlan::default()` (run_agentic_loop false).
  - `async fn run_chat_agentic_loop(&self, call: &AgenticLoopCall<'_>) -> Result<Option<AgenticLoopRequestPatch>,
    AgenticHookError>`, default `Ok(None)`. LiteLLM's hook sends the follow-up itself and returns its answer; here it
    returns the follow-up request and the loop that called it sends that request, because this crate sits below the
    continuation (see deviations). CustomLogger's body is only a docstring, so the default returns None.
  - `fn overrides_chat_plan(&self) -> bool`, default false, read by the HTTP-handler loop the way LiteLLM compares
    `callback.__class__.async_build_chat_completion_agentic_loop_plan` with CustomLogger's (L5969-L5972).
  Tests in agentic_callback/tests.rs, names starting with `chat_`: a type that overrides nothing gets the three
  defaults and false; a type that overrides all four returns its own values through an `Arc<dyn AgenticCallback>`.


  Web search. Edit B9823's crates/betterlite-server/src/state/sdk_callbacks/websearch.rs and add the four methods to
  its `impl AgenticCallback for WebSearchCallback`. `overrides_chat_plan` is true. The gate is B4117's
  `WebSearchInterceptionState::async_should_run_agentic_loop` with the surface `Some(CHAT_COMPLETION_SURFACE)`, after the
  same input conversion B9823's generic gate does; `Ok(Some(dict))` becomes run true with the dict as the tools map, and
  `Ok(None)` run false. The plan is B4119's `ChatResponsesFollowup::build_chat_plan` with the gate dict's tool_calls and
  its response_format, "openai" when absent (handler.py L1138-L1152). The run is B4119's `build_chat_rerun` with the
  same inputs, returned as `AgenticLoopRequestPatch { model: Some(rerun.model), messages: Some(rerun.messages), tools:
  None, max_tokens: None, optional_params: rerun.params, kwargs: rerun.kwargs }`. Tests in websearch/tests.rs, names
  starting with `chat_`.


  Loops. Code goes in crates/betterlite-core/src/api/provider_chat_hooks.rs and provider_chat_hooks/ (openai.rs,
  http_handler.rs, followup.rs, error.rs, and a tests.rs beside each of the first three). Read B8294's merged
  chat_agentic_loop first and reuse its input types (messages, params and kwargs maps, the chat response, `ChatLoopResult`,
  `ChatContinuation`, `ChatCallError`) and its patch-to-call conversion. All inputs travel in one
  `ProviderChatCall<'call>` struct: the provider answer, model, messages, optional_params, kwargs (LiteLLM's
  litellm_params), the logging handle, custom_llm_provider, stream and `callbacks: &[Arc<dyn AgenticCallback>]` in
  list order. A patch is sent through `ChatContinuation::complete` with `patch.model` or the original model,
  `patch.messages`, `patch.optional_params` and `patch.kwargs`; a patch without messages is a hook error.


  `run_openai_chat_hooks(call, continuation) -> Option<ChatLoopResult>` in openai.rs ports L547-L625. It logs
  "LiteLLM.AgenticHooks: callbacks_count=<n>" and "LiteLLM.AgenticHooks: tools_count=<n>" at debug, takes tools from
  optional_params["tools"] (empty when absent) and stream false. For each callback, inside one guard whose error is
  logged at error level as "LiteLLM.AgenticHookError: Exception in agentic completion hooks for OpenAI: <error>" before
  the next callback: call `should_run_chat_agentic_loop` with the kwargs as given; on run true call
  `run_chat_agentic_loop` with the gate's tools map and a copy of kwargs with `custom_llm_provider` set; return None when
  it gives None, else send the patch and return the answer. A send error is caught by the same guard. After the loop
  return None. It never reads settings, never checks safety and never calls the plan builder.


  `run_http_chat_hooks(call, continuation) -> Result<Option<HttpHookOutcome>, ProviderHookError>` in http_handler.rs
  ports L5899-L6050. `HttpHookOutcome` is `Loop(ChatLoopResult)` or `FakeStream(response)`, the second for the caller to
  turn into one stream chunk with B010's port of convert_model_response_to_streaming. First read depth, max_loops and
  fingerprints with B2419's port of `_get_agentic_loop_settings` (L5211-L5219); its error ends the call. For each
  callback:
  1. Call the chat gate with the kwargs as given. An error logs "LiteLLM.AgenticHookError: Exception in
     async_should_run_chat_completion_agentic_loop: <error>" and moves on; run false moves on.
  2. Call B2419's port of `_check_agentic_loop_safety` (L5274-L5297) with the gate's tools map. Its error ends the call
     as `ProviderHookError::Safety`, outside the guard below.
  3. Inside one guard (error logged "LiteLLM.AgenticHookError: Exception in chat completion agentic hooks: <error>",
     then the next callback), with hook kwargs = kwargs plus `custom_llm_provider`: when `overrides_chat_plan()` is
     false, call `run_chat_agentic_loop`; return `Ok(None)` for None, else send the patch and return its answer. When
     it is true, call `build_chat_agentic_loop_plan`: a `response_override` is returned (JSON that is not a chat response
     is a hook error); `terminate` logs "Agentic chat loop terminated by callback=<name> reason=<stop_reason>" at debug
     and returns the original answer; run_agentic_loop false moves on; otherwise return followup.rs's answer.
  After the loop, when kwargs holds a true `_websearch_interception_converted_stream`, log "WebSearchInterception: No tool
  call made, converting non-streaming chat completion to fake stream" at debug and return `FakeStream` of the original
  answer. LiteLLM reads model_call_details["websearch_interception_converted_stream"], which BaseLLMHTTPHandler.completion
  copies from that litellm_params key (L712-L713). Otherwise return `Ok(None)`.


  followup.rs ports L5607-L5665 for the HTTP-handler loop only: the patch is `plan.request_patch` or an empty one, and no
  patched messages is the error "Agentic loop plan missing patched messages". The model is patch.model or the original;
  without a "/" it becomes "<custom_llm_provider>/<model>". Params are optional_params with patch.optional_params laid
  over them and "tools" set from patch.tools when that is Some; tool_choice stays. The request kwargs drop every key that
  starts with "_websearch_interception" or "_compression_interception" and the keys "_websearch_interception",
  "acompletion", "litellm_logging_obj", "custom_llm_provider", "model_alias_map", "stream_response" and
  "custom_prompt_dict"; they go with the unfiltered patch.kwargs to B4110's `build_agentic_followup_kwargs` with the
  params' keys plus "model" and "messages" as request params, then depth, max_loops, fingerprints and the fingerprint
  from step 2. Send model, patch.messages, params and those kwargs, and return the answer. No post hook, cleanup hook,
  metadata merge or fake stream runs here. `ProviderHookError` (error.rs) holds the settings and safety errors with
  #[source].


  Gateway. Code goes in crates/betterlite-server/src/app/inference/provider_chat_step.rs and provider_chat_step/
  (tests.rs). Read B9825's merged sdk_hooks.rs first. In its chat step 3, before the call to B8294's
  maybe_run_chat_agentic_loop, call the provider step with the same response, model, messages, optional params, kwargs,
  logging, provider and stream, the snapshot's `agentic_callbacks()` and the `GatewayContinuation`; a Some result replaces
  the response that B8294's loop then gets. That call is the only change to sdk_hooks.rs. The step matches the attempt's
  provider: the OpenAI provider (LiteLLM's openai_chat_completions path) runs `run_openai_chat_hooks`, every other
  provider returns None, since no provider the gateway serves yet goes through BaseLLMHTTPHandler.async_completion. Tests
  boot B8610's application the way B9825's sdk_hooks tests do, with one `openai/gpt-4o-mini` deployment against a local
  tokio TcpListener upstream, and install test callbacks with `state.sdk_callbacks.replace`; names start with
  `openai_`, `run_none_` or `empty_`. A callback whose chat gate says run and whose run returns a patch makes a second
  upstream call with the patched messages and the client gets the second answer; with `max_agentic_loops: 1` on the
  deployment and a follow-up that triggers again, a third call still runs and the client gets 200; a run that returns
  None leaves one upstream call; with no callbacks the request goes out once and unchanged.


  HTTP oracle cases in tools/oracle/cases/interception/chat-provider/, through the booted proxies. Config: an
  `openai/gpt-4o-mini` deployment `gpt-search` with `api_base: "{{upstream}}"` and `api_key: oracle-key`; a
  `search_tools` entry `oracle-search` with `search_provider: perplexity`, `api_key: oracle-key` and
  `api_base: "{{upstream}}"`; `litellm_settings.callbacks: ["websearch_interception"]` and
  `websearch_interception_params: {enabled_providers: ["openai"], search_tool_name: oracle-search}`. Compare status, the
  body and every captured upstream request (path and body); ignore only generated ids and timestamps at their
  pointers. Confirm each case with `--self-check` before comparing betterlite.
  - openai-search-loop.yaml: POST /v1/chat/completions with a `{"type": "web_search_20250305", "name": "web_search"}`
    tool; the first answer calls litellm_web_search with a query, the search provider gets it, the second chat request
    carries the assistant tool call and the tool message, and the client gets the second answer.
  - openai-search-twice.yaml: the same with `max_agentic_loops: 1` on the deployment and a follow-up answer that searches
    again with another query, then a text answer.
  - openai-forced-choice.yaml: the client also forces the web search tool through tool_choice; compare the follow-up
    request's tool_choice.
  Add one http_case corpus seed per case.
