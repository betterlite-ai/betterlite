dod:
  - text: AgenticCallback has the three chat-only hooks and overrides_chat_plan with CustomLogger's defaults, and an implementation's values reach the caller.
    proof: [chat-trait-tests]
  - text: The web search callback reports overrides_chat_plan true and answers the chat gate, plan and run through B4117 and B4119.
    proof: [websearch-chat-tests]
  - text: The OpenAI loop asks each callback's chat gate, returns the first run's follow-up answer or None, swallows every error including a failed send, and checks no ceiling.
    proof: [openai-hooks-tests]
  - text: The HTTP-handler loop reads B2419's settings, raises its safety errors outside the guard, takes the run or the plan branch by overrides_chat_plan, and returns the converted stream outcome only for the web search flag.
    proof: [http-hooks-tests]
  - text: The HTTP-handler executor builds the follow-up model, params with tool_choice kept, and kwargs through build_agentic_followup_kwargs, and runs no post or cleanup hook.
    proof: [followup-tests]
  - text: On the gateway an openai attempt runs the provider loop before B8294's loop, other providers skip it, and the edited modules' tests still pass.
    proof: [step-tests, touched-module-tests]
  - text: Through /v1/chat/completions an openai deployment with websearch_interception runs the search and the follow-up as LiteLLM's provider loop does, without a ceiling, and drops tool_choice on the follow-up.
    proof: [case-files, oracle]
  - text: The new HTTP transcripts replay through the existing HTTP-case decoder.
    proof: [http-corpus]
checks:
  optional: []
  commands:
    - id: chat-trait-tests
      why: a chat hook or overrides_chat_plan is missing or has the wrong default
      run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^agentic_callback::tests::chat_/)'
    - id: websearch-chat-tests
      why: the web search callback does not answer the chat hooks or delegates to the wrong piece
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^state::sdk_callbacks::websearch::tests::chat_/)'
    - id: openai-hooks-tests
      why: the OpenAI loop order, its guard or its return value is wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::provider_chat_hooks::openai::tests::/)'
    - id: http-hooks-tests
      why: the HTTP-handler loop branches, its safety placement or its converted stream check is wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::provider_chat_hooks::http_handler::tests::/)'
    - id: followup-tests
      why: the HTTP-handler follow-up model, params or kwargs are wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::provider_chat_hooks::followup::tests::/)'
    - id: step-tests
      why: the gateway does not run the provider loop for openai, runs it for another provider, or runs it after B8294's loop
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::provider_chat_step::tests::/)'
    - id: touched-module-tests
      why: the edits to the trait, the web search callback or the chat step broke their existing tests
      run: test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-core/src/api/provider_chat_hooks.rs crates/betterlite-core/src/api/provider_chat_hooks)" && cargo nextest run --locked -p betterlite-context -p betterlite-server --no-tests=fail -E 'test(/^agentic_callback::tests::/) | test(/^state::sdk_callbacks::websearch::tests::/) | test(/^app::inference::sdk_hooks::tests::/)'
    - id: case-files
      why: no provider-level chat interception case exists on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/interception/chat-provider)"
    - id: http-corpus
      why: the HTTP transcripts never reach the production case parser
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/http_case/interception-chat-provider-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_http_case_corpus)'
oracle_cases:
  - tools/oracle/cases/interception/chat-provider/openai-search-loop.yaml
  - tools/oracle/cases/interception/chat-provider/openai-search-twice.yaml
  - tools/oracle/cases/interception/chat-provider/openai-forced-choice.yaml
deviations:
  - what: run_chat_agentic_loop returns the follow-up request, and the OpenAI and HTTP-handler loops send it through B8294's ChatContinuation. LiteLLM's web search hook calls litellm.acompletion itself and returns the answer.
    why: The trait lives in betterlite-context, below the continuation in betterlite-core. The request, the order of calls and the answer the client gets are the same.
out_of_scope:
  - "The main.py chat loop in chat_completion_agentic_loop.py: B8294. Its call site in main.py: B5656. The gateway seam that calls it: B9825."
  - "The web search handler's other functions: B4113 (post hook and native blocks), B4114 (tool access), B4115 (search execution and short circuit), B4116 (settings, request hooks, initialize_from_proxy_config), B4117 (gates), B4118 (Anthropic plan and surface dispatcher), B4119 (chat and Responses plans and the legacy chat rerun). async_run_agentic_loop and _execute_agentic_loop: no caller at the pin, since the class overrides async_build_agentic_loop_plan and the Messages loop never reaches its run."
  - "tools.py: B4111. transformation.py: B4112, B4113. The two __init__.py files only re-export (B4113, B4120). ARCHITECTURE.md is documentation."
  - "The code interpreter and compression interceptions: B4120 to B4122 and B9824, B9822. They do not override the chat-only hooks, so both loops skip them through the defaults."
  - "The SDK callback list and the websearch_interception registration: B9821, B9823."
  - "BaseLLMHTTPHandler.completion and async_completion (llm_http_handler.py L542-L613 and L615 on), the generic HTTP chat path that calls run_http_chat_hooks: no task ports it yet; the architect assigns it, and that owner calls run_http_chat_hooks and turns FakeStream into a chunk."
  - "convert_model_response_to_streaming: B010. _get_agentic_loop_settings and _check_agentic_loop_safety: B2419. build_agentic_followup_kwargs: B4110."
  - "The rest of OpenAIChatCompletion and the EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER branch: B004, B005, B024."
  - "The other CustomLogger methods: B189, B3931, B6030, B9820. The prompt cache hook (anthropic_cache_control_hook.py): B2204, B4123 to B4126."
pitfalls:
  - "The OpenAI loop has no ceiling: it never reads settings or calls the safety check and adds no `_agentic_loop_depth`, so a follow-up that searches again runs its own provider loop at depth 0."
  - "In both loops the first callback whose gate says run decides, and a run that returns None ends the loop with None without asking later callbacks."
  - "In the OpenAI loop the follow-up send sits inside the guard, so a failed follow-up leaves the first answer, and B8294's loop then sees the litellm_web_search call and plans the search again."
  - "The gate gets kwargs as they are, while run and plan get a copy with `custom_llm_provider` set, and B4119's chat patch reads that key to prefix the model with \"openai/\"."
  - "The HTTP-handler executor keeps tool_choice, filters only the request kwargs and runs no post or cleanup hook, unlike B8294's followup.rs, so don't call that one."
  - "After the HTTP-handler loop only `_websearch_interception_converted_stream` gives the fake stream; the code interpreter and headroom flags that B8294 reads do nothing here."
  - "Add the hooks as default methods and overrides_chat_plan as a method, never as a field of AgenticOverrides, since B9822 and B9824 build that struct with a literal and may merge after this task."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
