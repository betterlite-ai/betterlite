    why: Temporary server, DCR, authorization and form token requests and their unusual headers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L7707-L7829
    why: Per-user OAuth status/storage and environment-variable request shapes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/networking.tsx#L4931-L4960
    why: Session reports and optional other-user credential deletion queries.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2010-L2078
    why: B4718's session route uses normal key auth, unlike the cookie-aware routes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2208-L2352
    why: B4719's three decorated OAuth routes, with no additional aliases.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2420-L2724
    why: Existing BYOK and per-user OAuth handlers and credential list.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L2822-L2939
    why: Environment values and readiness handlers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/mcp_management_endpoints.py#L1449-L1506
    why: Session report and both termination selectors.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L17006-L17066
    why: Setup uses B899's real login cookie without adding JWT decoding to the oracle.
dod:
  - text: A dashboard-style temporary and saved-server OAuth flow completes with the real cookie, PKCE query, form exchange and user binding.
    proof: [credential-flows, oracle]
  - text: BYOK, OAuth and environment values remain private across status/list/delete operations and session termination respects the selected user.
    proof: [credential-flows, oracle]
checks:
  optional: []
  commands:
    - id: credential-flows
      why: Error-only mounting tests cannot prove the popup's successful credential exchange.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/mcp-credentials)"
oracle_cases:
  - tools/oracle/cases/ui/mcp-credentials/temporary-pkce-cookie-and-form.yaml
  - tools/oracle/cases/ui/mcp-credentials/saved-server-oauth-status.yaml
  - tools/oracle/cases/ui/mcp-credentials/byok-save-and-admin-revoke.yaml
  - tools/oracle/cases/ui/mcp-credentials/environment-set-clear-status.yaml
  - tools/oracle/cases/ui/mcp-credentials/terminate-user-sessions.yaml
  - tools/oracle/cases/http/mcp-gateway-parity/session-report-terminate.yaml
deviations: []
out_of_scope:
  - B4718/B4719/B4723/B4724/B4725 own the server functions; B8622/B8700/B8701/B9950/B8702 construct and mount them.
  - B9090 takes every callback component, OAuth utility/hook and test in the covers from the pinned archive; a browser popup simulator is not added here.
  - Preview tool discovery and tool execution with upstream tokens are B9762.
pitfalls:
  - The token exchange's hard-coded Authorization header cannot be replaced with x-litellm-api-key in an exact page case.
  - Authorize navigation has cookies but cannot attach the dashboard's normal bearer header.
  - The temporary server route must not inherit B4719's cookie fallback.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
