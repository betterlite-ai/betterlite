id: B9761
title: Cover the dashboard MCP OAuth, credential and environment requests
description: >-
  Supply roughly 700 lines of HTTP oracle scenarios for the existing MCP credential routes.
  The popup callback, state/PKCE helpers, three OAuth hooks and credential forms are retained
  by B9090; none is ported. Use ordinary HTTP case steps, not a helper that invokes a Python
  handler. B860 supplies isolated databases; seed users/keys there and create server records
  through B4721/B8627. All external OAuth endpoints must use the mock provider.
  Obtain the authorize cookie with a real POST /v2/login (B899), JSON username/password
  matching configured UI_USERNAME/UI_PASSWORD, and capture Set-Cookie's token as a secret.
  Use the same seeded admin identity for gateway bearer requests; no JWT-claim capture or
  invented browser token is needed. Login is setup already owned by B899/B144, not a new API.

  Temporary-server flow. useMcpOAuthFlow POSTs /v1/mcp/server/oauth/session with the full
  NewMCPServerRequest, authenticating with the gateway key; it reads server_id. B4718 owns
  this handler and B8622 its SessionStore. B8702 claims all four /server/oauth routes in its
  reference but its prose omits this normal-auth session route; the architect handoff must
  make that mount explicit before these cases run. Do not duplicate add_session_server here.
  POST /v1/mcp/server/oauth/{id}/register uses trimmed, URI-encoded id, JSON
  {client_name,grant_types:[authorization_code,refresh_token],response_types:[code],
  token_endpoint_auth_method:none|client_secret_post,redirect_uris:[callback_url]} and
  Accept application/json,text/event-stream. Read client_id and client_secret.
  GET /v1/mcp/server/oauth/{id}/authorize is browser navigation without a bearer header,
  using the dashboard token cookie and query redirect_uri,state,response_type=code,
  code_challenge,code_challenge_method=S256 plus optional client_id and scope. Capture the
  Location, retaining its encoded query. POST /v1/mcp/server/oauth/{id}/token is
  application/x-www-form-urlencoded with grant_type=authorization_code,code,code_verifier,
  redirect_uri and optional client_id/client_secret. Unlike the configurable header on most
  calls, this helper explicitly sends Authorization Bearer gateway-key. Read access_token,
  refresh_token,expires_in,token_type,scope. These last three routes are B4719/B8702;
  B7971's separate /authorize and /register paths are not called by these hooks.

  Saved-server flow. useToolsOAuthFlow and useUserMcpOAuthFlow reuse those routes with a
  saved server id. POST /v1/mcp/server/{id}/oauth-user-credential sends
  {access_token,refresh_token?,expires_in?,scopes?}, splitting returned scope strings before
  saving. GET /v1/mcp/server/{id}/oauth-user-credential/status reads
  has_credential,expires_at,is_expired,connected_at. GET /v1/mcp/server/{id}/user-credentials
  reads the credential rows' user_id and credential_type and their status/times. DELETE
  /v1/mcp/server/{id}/oauth-user-credential and DELETE /v1/mcp/server/{id}/user-credential
  optionally send user_id in the query for an administrator removing another user's binding;
  their response is only checked for success. ByokCredentialModal uses fetchClient directly
  to POST /v1/mcp/server/{server_id}/user-credential with {credential:trimmed_string,save:true}
  or save:false, no response projection. All these credential handlers belong to B4723 and
  are mounted by B8700. Test own versus another user's removal and that secrets do not
  reappear in any status/list body; retain both immediate and persisted save semantics.

  Environment setup. GET /v1/mcp/server/{id}/user-env-vars returns server_id,server_name,
  alias,missing_count,setup_url and required[] definitions with name,is_set; POST on
  that path sends {values:{name:string}} and DELETE
  has no body. GET /v1/mcp/user-env-vars/status supplies the cross-server readiness map.
  B4724/B8700 owns all four. Cover setting two declared values, reload, clearing and an
  unauthorized user, comparing the set flags without exposing values.

  Session tab. GET /v1/mcp/sessions has no query and reads worker_pid,total_sessions,
  by_client,by_user and sessions[].session_id_prefix,client_name,client_version,user_id,
  user_email,key_alias,team_id,team_alias,client_ip,idle_seconds,in_flight_requests.
  Group entries have label,count. DELETE /v1/mcp/sessions has no body
  and either session_id_prefix or user_id in the query. B4725/B9950 implements both.
  B136's session-report-terminate case already plans the live prefix request; reuse it.
  Add only the user_id termination variant with two local sessions from B136's MCP fixture,
  then reread the report. The result toast reads terminated_sessions and worker_pid;
  normalize the host-specific PID and elapsed idle time, retaining the terminated count.

  No matching credential/env HTTP scenarios exist on disk. B8702 plans missing-key,
  unknown-server and missing-form-field failures, which do not establish a successful
  dashboard cookie/PKCE/form exchange. B8700 plans route basics, not these form sequences.
  Keep those owners' error cases; add the successful sequence plus wrong-user denials,
  preserving status, error envelopes and auth/redirect headers. HTTP comparisons prove
  the requests only; postMessage origin/state rejection remains in B9090's retained tests.
scope:
