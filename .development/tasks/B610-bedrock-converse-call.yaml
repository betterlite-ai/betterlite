  commands:
  - id: case-converse-signed-path
    why: The converse-signed-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::converse_call_cases::case_[0-9]+_converse_signed_path$/)'
  - id: case-converse-stream-path
