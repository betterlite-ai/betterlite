id: B610
title: Bedrock Converse transport
description: >-
  Execute Converse/converse-stream using prepared requests and signed bytes. Preserve request headers and stream
  error status, body ownership and cancellation; make_call/make_sync_call share one native async send stage. SDK
  wrappers do not introduce extra retries or global state.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_handler.py:
  BedrockConverseLLM.__init__ L89-L90; BedrockConverseLLM.async_streaming L92-L163; BedrockConverseLLM.async_completion
  L165-L262; BedrockConverseLLM.completion L264-L504.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  B691 owns make_call, make_sync_call and raw streaming transport helpers; this task calls that prerequisite.


  Implement crates/betterlite-bedrock/src/converse_call.rs with adjacent tests under converse_call/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_converse_call in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_call_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  converse_signed_path, converse_stream_path, bearer_converse, buffered_response, streaming_first_chunk, pre_stream_http_error,
  stream_exception_frame. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. HTTP cases use the booted proxy and assert both client response and captured upstream request.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_call* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_call variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_call that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 368 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 385 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 601 planned, 625 maximum changed lines.
