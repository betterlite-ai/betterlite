pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_converse_call in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/converse_call.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_converse_call.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Without an embedded full region, completion can retain a bedrock/converse/ wrapper in the encoded URL id; do not
  assume its temporary stripped view is the final id.
- Async streaming accepts timeout but does not forward it to make_call; sync client construction does use it.
