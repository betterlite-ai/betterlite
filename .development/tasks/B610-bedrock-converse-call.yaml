id: B610
title: Bedrock Converse transport
description: >-
  Execute Converse/converse-stream using prepared requests and signed bytes. Preserve request headers and stream
  error status, body ownership and cancellation; make_call/make_sync_call share one native async send stage. SDK
  wrappers do not introduce extra retries or global state.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_handler.py:
  BedrockConverseLLM.__init__ L89-L90; BedrockConverseLLM.async_streaming L92-L163; BedrockConverseLLM.async_completion
  L165-L262; BedrockConverseLLM.completion L264-L504.


  B691 owns make_call, make_sync_call and raw streaming transport helpers; this task calls that prerequisite.


  Named case contracts: converse_signed_path: Pop stream defaultNone, model_id defaultNone, fake_stream defaultfalse;
  leave json_mode in options. Explicit model_id non-None (includingempty) uses B591 one quote(safe="") pass and
  skips model-path region extraction. Otherwise strip one matching wrapper bedrock/converse/,bedrock/,converse/
  into a working copy, recognize firstslash region only from B2203 pinned list, then remove first nova-2/ or nova/
  when leading in stripped view. Only region extraction replaces the entire model-for-id with strippedview; without
  region, wrapper can remain encoded in modelId. Preserve this source distinction rather than always normalizing
  the final URL id. Inject pathregion only if aws_region_name key absent, even when an existing value isNone. converse_stream_path:
  B607 should_fake_stream runs before target selection. Resolve B591 region with original model and explicit unencoded
  model_id, pop/validate auth B590, popruntimeendpoint/region, store resolvedregion in litellm_params.aws_region_name.
  B591 returns endpoint/proxyendpoint; append /model/<encodedid>/converse-stream only stream is literal True and
  fake_stream false, otherwise /converse. Do not rstrip base slash; when no configured proxy endpoint exists, B591
  returns endpoint_url as proxy_endpoint_url. B176 stored stream_chunk_size is read only for literal True streaming.
  bearer_converse: B590 selected bearer non-None skips B594 credential acquisition but still performs region resolution/auth-param
  validation/pops. Otherwise resolve B594 credentials. Start Content-Type=application/json then overlay extra_headers
  whennon-None, so samecase caller value wins; apply B960 update_headers_with_filtered_beta(provider=bedrock_converse)
  before signing. B595 owns SigV4/bearer/explicit auth override; snapshot no credential outside this request. buffered_response:
  B604 transforms and json.dumps defaultspacing/escaping supplies exact signed/sent bytes. Async signs via B595
  run_aws_signing using litellm_params.aws_region_name-or-us-west-2; sync signs direct resolvedregion. Default buffered
  client receives timeout whennon-None, numeric converted to httpx.Timeout; supplied matching client retains its
  own timeout. On success B607 transforms with api_key empty and stream value only ifbool, then stores all provider
  response headers through shared response-header primitive. No custom prompt_dict or logger_fn behavior added.
  streaming_first_chunk: Stream literal True calls B691; fake_stream still routes through stream helper but buffers
  /converse. Async_streaming accepts timeout yet does not pass it to make_call, so a default streaming client uses
  its own timeout; sync constructs its client with timeout first. Wrap iterator using B005 CustomStreamWrapper model
  and custom_llm_provider=bedrock plus upstreamheaders. Do not consume a frame before returning this wrapper or
  add retries. pre_stream_http_error: Buffered HTTPStatusError ->B682 BedrockError originalstatus, error_response_text,
  headers and originalresponse; TimeoutException ->408 Timeout error occurred. Other buffered exceptions propagate
  (no generic500 catch here). Streaming errors use B691 distinct branch rules. Pre-call B190 logging uses api_key
  empty and complete_input_dict,api_base,headers; async_completion skip_pre_call_logging=true suppresses only that
  pre-call log, not response logging. stream_exception_frame: Replay B599 modeled exception status cases and EOF502
  through B609/B691 and B005 wrapper, including failure before first client chunk versus after emitted chunks. Preserve
  no-events first 200-byte redacted diagnostic and incomplete tail counts, original status/code projection and body
  cancellation. Source error type/param at client boundary remains B239/B005, not a new local envelope. sync_async_beta_inputs:
  Async route is selected by acompletion truthiness; discard sync HTTPHandler and pass filtered headers to B604
  async transform. Sync B604 transform receives original extra_headers, while signing receives filtered merged headers
  and original extra_headers override source. Thus a filtered beta can still influence body preparation differently
  between sync/async; replay B960 unsupported-beta and B683 client-beta cases at both seams.


  Write standalone Rust test bedrock_converse_call_credential_identity_isolation in betterlite-bedrock: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test bedrock_converse_call_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B600. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-bedrock/src/converse_call.rs with adjacent tests under converse_call/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_call_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  converse_signed_path, converse_stream_path, bearer_converse, buffered_response, streaming_first_chunk, pre_stream_http_error,
  stream_exception_frame, sync_async_beta_inputs. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_call* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_call variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_call that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 368 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 300 production lines, 295 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 745 planned, 750 maximum changed lines.
