deviations:
  - what: >-
      Native cache request dispatch and ResponseCacheRuntime integration are not implemented. The envelope
      facade operates on Python backends only; native storage integration (request/lookup_semantic/store)
      is excluded from this task.
    why: >-
      The rust_bridge package is outside the repository inventory per repository policy. Native ResponseCacheRuntime
      and native request/lookup_semantic/store dispatch are not built. Per B4299, _native_cache is never set
      in betterlite, so native dispatch has no runtime path to exercise.
    link: null

  - what: >-
      The ast.literal_eval fallback in _get_cache_logic accepts a bounded set of cached string shapes
      (dicts, strings, JSON literals) rather than unrestricted evaluation of arbitrary Python expressions.
    why: >-
      Unrestricted evaluation of cached strings is a security and correctness risk. The fuzz corpus
      defines the supported shapes; decoding failures log and return the original cached value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L562-L569

  - what: Cache lookup kwargs are safely projected to only messages, input and metadata to avoid request mutation during lookup.
    why: LiteLLM's original code modifies kwargs in place during lookup, which betterlite avoids by projecting safe fields to a new dict.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L572-L583

  - what: Failures in cache backend calls (get, set, delete) are logged but never propagate to block request execution.
    why: LiteLLM's best-effort cache behavior skips errors silently; betterlite logs them for observability.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L615-L646
out_of_scope:
  - B4296 owns should_use_cache, get_cache_key, _is_semantic_cache and print_verbose; envelope operations call them.

  - B4290 owns backend get/set/batch-write contracts and timestamp/cache control types; envelopes apply
    them without reimplementation.

  - B393 owns log_redis_failure; envelope write paths delegate Redis errors to this logging handler.

  - The rust_bridge package is excluded by the repository inventory; native ResponseCacheRuntime and
    native request/lookup/store dispatch are not built per repository policy.

  - Embedding-specific envelope writes (versioning, per-item usage) are owned by B4298; the common
    facade must not depend on them.
pitfalls:
  - The _get_cache_logic function expects cached_result to be either a dict with a "timestamp" field,
    a JSON string, or a literal string. It does not use unrestricted ast.literal_eval; it handles only
    the bounded shapes validated by the fuzz corpus. A cached string that is valid JSON takes precedence
    over literal evaluation.

  - The sync get_cache function checks freshness inline and returns None when stale. The async_get_cache
    function returns the absolute stored timestamp (not remaining TTL) so callers can implement their own
    freshness policy. Never swap the behaviors.

  - Semantic similarity metadata is stamped into kwargs metadata only when present in the cache lookup;
    if the backend does not supply it, the metadata field remains absent.

  - Cache write failures log but do not prevent response delivery. The response is returned on a best-effort
    basis, and storage errors are observed through logging, not thrown exceptions.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
