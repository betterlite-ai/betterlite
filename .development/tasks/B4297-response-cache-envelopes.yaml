id: B4297
title: Read and write response cache envelopes
description: >-
  Implement timestamped response cache envelopes with freshness validation and ordinary read/write operations.
  Build get_cache and async_get_cache with max-age handling, where a cached response with a timestamp
  older than the max-age threshold is rejected as stale. Build add_cache and async_add_cache to wrap
  results in {"timestamp": time.time(), "response": result} envelopes. Implement _get_cache_logic to
  decode cached envelopes: accept bounded literal shapes (dicts, JSON strings) and reject unrestricted
  evaluation. When a timestamp exists and response_age exceeds max-age, return None; otherwise extract
  and deserialize the response field with fallback to ast.literal_eval only for strings the JSON
  decoder rejected. Support a fuzz corpus of valid and invalid cached forms the decoder must handle.
  Preserve sync/async max-age differences and support both Redis and memory cache backends through
  dependency injection. Cache lookup kwargs are safely projected from request kwargs to preserve only
  messages, input and metadata. When no cache backend supports the operation, failures are logged but
  do not block the request.
