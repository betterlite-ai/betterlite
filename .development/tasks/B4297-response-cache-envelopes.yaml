dod:
  - text: "get_cache returns None when should_use_cache is false or cache_key is None."
    proof: [facade-cache-behavior]
  - text: "Cached responses with timestamps are checked against max-age; responses older than max-age return None."
    proof: [facade-cache-behavior]
  - text: "Sync max-age uses s-maxage from cache control, async uses s-max-age or s-maxage."
    proof: [facade-cache-behavior]
  - text: 'add_cache wraps results in {"timestamp": time.time(), "response": result} envelopes.'
    proof: [facade-cache-behavior]
  - text: "TTL precedence is applied (cache control ttl overrides Cache.ttl default)."
    proof: [facade-cache-behavior]
  - text: "Cache lookup kwargs preserve only messages, input and metadata from request."
    proof: [facade-cache-behavior]
  - text: "Semantic-similarity from lookup_semantic is stamped into metadata."
    proof: [facade-cache-behavior]
  - text: "Cache read/write failures are logged but do not block requests (best-effort)."
    proof: [facade-cache-behavior]

  - text: "The fuzz target cache_envelope_decoder accepts arbitrary bytes and replays its corpus without panic, validating the bounded decoder behavior."
    proof: [envelope-decoder-corpus]

checks:
  optional: []
  commands:
    - id: facade-cache-behavior
      why: cache envelope read/write behavior is missing or incorrect
      run: cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(/^envelope::/)'

    - id: envelope-decoder-corpus
      why: Fuzz target is missing, corpus is empty, or replaying corpus causes panic
      run: test -f crates/betterlite-cache/fuzz/fuzz_targets/cache_envelope_decoder.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-cache/fuzz/corpus/cache_envelope_decoder-*)" && cargo nextest run --locked -p betterlite-cache --no-tests=fail -E 'test(replays_the_cache_envelope_decoder_corpus)'
