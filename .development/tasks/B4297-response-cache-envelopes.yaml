    - crates/betterlite-cache/src/envelope.rs
    - crates/betterlite-cache/src/envelope/**
    - crates/betterlite-cache/fuzz/fuzz_targets/cache_envelope_decoder.rs
    - crates/betterlite-cache/fuzz/corpus/cache_envelope_decoder-*
    - crates/betterlite-cache/Cargo.toml
    - tools/oracle/cases/envelope/**
    - tools/oracle/Cargo.toml
    - tools/oracle/helpers/b4297.py
    - tools/oracle/helpers/b4297/**
    - tools/oracle/src/helpers/cache/b4297.rs
    - tools/oracle/src/helpers/cache/b4297/**
  lint_tables: false
