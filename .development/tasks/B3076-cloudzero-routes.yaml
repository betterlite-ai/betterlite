deviations:
  - what: Update returns 500 when settings do not exist and at least one field is provided, due to KeyError on accessing missing fields from an empty dict.
    why: LiteLLM's code contains unreachable dead code at lines 251-260 attempting to convert a 400 to 404; the validation at lines 223-227 raises 400 outside the try block, and _get_cloudzero_settings returns empty dict without raising at line 109, causing KeyError when accessing current_settings["api_key"] inside the try block, caught by the generic except Exception handler at line 261.
  - what: Dry-run constructs the logger from environment variables without reading database credentials.
    why: LiteLLM's dry_run_export_usage_data method on CloudZeroLogger does not require credentials; it constructs the logger from the environment and returns data without sending to CloudZero.
  - what: API key is masked with the first 4 and last 4 characters visible; betterlite uses SensitiveDataMasker identical to LiteLLM.
    why: LiteLLM's masking behavior preserves endpoint transparency across both implementations.
out_of_scope:
  - Settings accessor functions (_get_cloudzero_settings, _set_cloudzero_settings) owned by B3075.
  - Setup detection functions (is_cloudzero_setup_in_db, is_cloudzero_setup_in_config, is_cloudzero_setup) owned by B3075.
  - Request/response model definitions (CloudZeroInitRequest, CloudZeroSettingsUpdate, CloudZeroSettingsView, CloudZeroExportRequest, CloudZeroExportResponse) owned by B3079.
  - User role predicate (user_api_key_has_admin_view) owned by B3079.
  - SensitiveDataMasker implementation owned by B244.
  - Database table and configuration repository owned by B725.
  - CloudZeroLogger implementation and export methods owned by B3071.
  - Encryption/decryption utilities owned by B1600.
  - User authentication dependency injection owned by B052.
pitfalls:
  - Update endpoint has unreachable dead code at lines 251-260; the 400 validation at lines 223-227 is outside the try block and cannot be caught by the except HTTPException handler intended to convert it to 404.
  - Update endpoint returns 500 (not 404) when settings do not exist and at least one field is provided, via KeyError on accessing missing dict keys.
  - PUT endpoint rejects requests with no fields provided; at least one of api_key, connection_id, or timezone must be non-null, returning 400 "At least one field must be provided for update".
  - Dry-run endpoint does not require prior initialization; it constructs CloudZeroLogger() with no arguments and reads environment variables, not database settings.
  - Export endpoint must read stored credentials from _get_cloudzero_settings, which decrypts the API key; decryption failure raises HTTPException with 500 status.
  - DELETE endpoint must check for absent settings with find_first before attempting delete; returning 404 requires explicit presence check.
  - All error responses use CommonProxyErrors enum values, matching LiteLLM's CommonProxyErrors.not_allowed_access, CommonProxyErrors.db_not_connected_error.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 2
