    why: cloudzero_export route reading stored credentials and calling logger.export_usage_data.
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/cloudzero_endpoints.py#L518-L578"
    why: delete_cloudzero_settings route with 404 handling for absent configuration.
dod:
  - text: GET /cloudzero/settings returns 200 with masked API key and other settings, or 200 with null fields if unconfigured, accessible only to admin and admin-view roles.
    proof: [get-settings-cases]
  - text: PUT /cloudzero/settings returns 400 with message "At least one field must be provided for update" when no fields are provided, before checking database state.
    proof: [update-no-fields-cases]
  - text: PUT /cloudzero/settings updates only provided fields when at least one is supplied, accessible only to PROXY_ADMIN role.
    proof: [update-settings-cases]
  - text: POST /cloudzero/init stores encrypted API key and other settings in database, fails with 403 for non-admin, accessible only to PROXY_ADMIN.
    proof: [init-settings-cases]
  - text: POST /cloudzero/dry-run constructs CloudZeroLogger from environment variables and returns export preview without requiring prior initialization, accessible only to PROXY_ADMIN.
    proof: [dry-run-export-cases]
  - text: POST /cloudzero/export reads stored credentials from database, constructs CloudZeroLogger, and calls export_usage_data with request parameters, accessible only to PROXY_ADMIN.
    proof: [export-cases]
  - text: DELETE /cloudzero/delete removes CloudZero settings from database, fails with 404 if settings are absent, accessible only to PROXY_ADMIN.
    proof: [delete-settings-cases]
  - text: All routes return 403 (not_allowed_access) when user lacks required role; 422 when request body is malformed JSON; 500 when database is unavailable.
    proof: [auth-error-cases]
  - text: Decryption failures in update and export routes raise HTTPException with 500 status and descriptive error message.
    proof: [decryption-error-cases]
  - text: API key masking uses SensitiveDataMasker.mask_dict preserving first 4 and last 4 characters matching LiteLLM behavior.
    proof: [masking-cases]
checks:
  optional: []
  commands:
    - id: get-settings-cases
      why: GET /cloudzero/settings route does not return masked settings or handle missing configuration
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::(get_settings|missing_settings)/)'
    - id: update-no-fields-cases
      why: PUT /cloudzero/settings route does not reject requests with no fields provided
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::update_no_fields/)'
    - id: update-settings-cases
      why: PUT /cloudzero/settings route does not update provided fields
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::update_settings/)'
    - id: init-settings-cases
      why: POST /cloudzero/init route does not store encrypted settings or enforce admin role
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::init_settings/)'
    - id: dry-run-export-cases
      why: POST /cloudzero/dry-run route does not construct environment-based logger or return preview data
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::dry_run_export/)'
    - id: export-cases
      why: POST /cloudzero/export route does not read stored credentials or call export_usage_data
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::export/)'
    - id: delete-settings-cases
      why: DELETE /cloudzero/delete route does not remove settings or handle absent configuration
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::delete_settings/)'
    - id: auth-error-cases
      why: Authorization and malformed-body error responses do not match LiteLLM behavior
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::(auth_|malformed_)/)'
    - id: decryption-error-cases
      why: Decryption failure handling does not raise appropriate errors
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::decrypt/)'
    - id: masking-cases
      why: API key masking does not preserve first 4 and last 4 characters
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^finops::cloudzero_routes::mask/)'
