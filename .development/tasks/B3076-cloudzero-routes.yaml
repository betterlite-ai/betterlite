id: B3076
title: Expose CloudZero settings and export routes
description: >-
  Register six HTTP routes for CloudZero FinOps management in betterlite-server.
  Implement GET /cloudzero/settings to view current configuration with masking;
  PUT /cloudzero/settings for partial updates; POST /cloudzero/init for initial setup;
  POST /cloudzero/dry-run for export preview; POST /cloudzero/export for actual delivery;
  and DELETE /cloudzero/delete to remove configuration.
  Enforce admin-only mutations and exports, with admin-or-viewer read access for GET.
  Preserve exception handling for database unavailability and decryption failures; return 400
  when PUT receives no fields to update, 422 for malformed request bodies, 403 for authorization,
  404 when DELETE targets absent settings, and 500 for unrecoverable errors.
  Manual export reads and decrypts stored credentials; dry-run constructs a logger
  from environment variables instead, requiring no prior initialization.
  Sensitive API keys are masked with first and last 4 characters visible using B244's masker.
