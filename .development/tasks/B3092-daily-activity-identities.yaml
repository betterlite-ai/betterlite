id: B3092
title: Attach recovered key identities to daily activity reads
description: >-
  Implement the proxy-specific adapter and scope construction in `betterlite-server::daily_activity::recovery`
  to wire recovered key identities into the daily activity repository. Implement `spend_logs_window` to compute
  a time window from the date strings in a set of spend records, `_parse_spend_date` to parse individual date
  strings, `_metadata_with_recovered_owner` to merge a recovered user_id back into existing metadata, `daily_activity_repository`
  factory to inject the recovery adapter into the repository, and `daily_activity_scope` builder to construct scopes
  from query parameters.

  The `_ProxyDailyActivityReads` adapter calls five recovery functions in strict order: `recover_cli_session_key_metadata`
  (extract the user_id from LiteLLM_CliSessionKey prefix tokens), `recover_double_hashed_key_metadata` (reverse-hash
  active and deleted verification tokens), `recover_key_metadata_from_spend_logs` (read oldest and newest named rows
  within a time window), `recover_key_owner_from_daily_spend` (find unanimous user_id values from LiteLLM_DailyUserSpend),
  and `attach_user_details` (fill user_email from users table and team_id from CLI session user team field). Each step
  only enriches keys with no live metadata in the preceding step; already-resolved keys are never replaced.

  get_api_key_metadata is the only function that accepts an optional spend_logs_window override parameter
  (defaulting to None), supplied by the caller; get_daily_activity and get_daily_activity_aggregated always derive
  the window from the records they aggregate. Recovery order, window boundary enforcement and fault tolerance justify
  keeping this adapter in a separate security-focused module.
scope:
  paths:
    - crates/betterlite-server/src/daily_activity/recovery.rs
    - crates/betterlite-server/src/daily_activity/recovery/**
    - tools/oracle/cases/helpers/daily-activity-recovery/**
  lint_tables: false
