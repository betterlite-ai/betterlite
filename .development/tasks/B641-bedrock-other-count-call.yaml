id: B641
title: Bedrock CountTokens transport and failure records
description: >-
  Execute CountTokens with the exact native counter selection, signed HTTP request and fixed 30-second timeout.
  Return Bedrock API failure records rather than running a local tokenizer in this task; an upper caller owns any
  fallback after it receives None. Preserve validation, warnings and error status behavior.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  BedrockModelInfo.get_token_counter L1317-L1324. litellm/llms/bedrock/count_tokens/handler.py: BedrockCountTokensHandler.handle_count_tokens_request
  L26-L140. litellm/llms/bedrock/count_tokens/bedrock_token_counter.py: BedrockTokenCounter.should_use_token_counting_api
  L18-L25; BedrockTokenCounter.count_tokens L27-L114.


  Reuse get_bedrock_base_model from B2203 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse run_aws_signing from B595 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Named case contracts: count_token_http_request: Within one try block, call B640 validation, resolve B591 region
  from litellm_params/model with model_id=None, transform via B640, then build the B640 CountTokens endpoint from
  litellm_params.api_base and aws_bedrock_runtime_endpoint. B595 run_aws_signing calls _sign_request with service_name=bedrock,
  Content-Type=application/json, original litellm_params, transformed body, endpoint, resolved_model and litellm_params.api_key.
  POST returned signed_body/headers through a truthy supplied client or B173 BEDROCK client. Only status exactly
  200 succeeds; decode_bedrock_count_reply then B640 transforms to the Anthropic count shape. native_count_selection:
  should_use_token_counting_api is true only for exact provider string bedrock, not bedrock_converse or bedrock_mantle.
  count_tokens returns None immediately for falsey messages and does not inspect contents. Otherwise use deployment
  or {}, obtain litellm_params with absent default {}, construct request model=model_to_use/messages unchanged,
  and include tools/system only when truthy. Resolve B2203 get_bedrock_base_model before the catch block and invoke
  a fresh handler; malformed deployment/model errors before the try propagate rather than becoming API failure records.
  count_api_failure_warning: The handler rethrows BedrockError unchanged. A non-200 response logs error AWS Bedrock
  error: %s and raises B682 with status,text,headers,response; a caught HTTPStatusError logs HTTP error in CountTokens
  handler: %s and preserves its response fields. Every other exception, including timeout, decode or transformation
  failure, logs Error in CountTokens handler: %s and becomes B682 status500 message CountTokens processing error:
  {error}. The counter catches BedrockError, warns Bedrock CountTokens API error: status=%s, message=%s, and returns
  TokenCountResponse total_tokens=0,request_model,model_used=model_to_use,tokenizer_type=bedrock_api,error=True,error_message=e.message,status_code=e.status_code.
  Other caught errors warn Error calling Bedrock CountTokens API: %s and return the same record with str(error),status500.
  count_credentials: Reuse B595 signing behavior, including bearer token and explicit non-AWS Authorization precedence,
  with this handler's model/region/params. Preserve per-deployment credential identity and caller option mutation
  from the signer; do not perform a second B594 credential lookup in this layer. Shared region/env/config loader
  ownership remains B590/B591. count_timeout: Every POST passes timeout=30.0, regardless of deployment timeout configuration
  or a supplied client. A timeout exception reaches the generic handler catch and becomes status500 CountTokens
  processing error: {error}, then the counter returns its error record; do not substitute the 408 behavior of other
  Bedrock handlers. counter_factory: BedrockModelInfo.get_token_counter constructs a fresh BedrockTokenCounter without
  credential lookup, model gating, IO or fallback. BaseTokenCounter has no stateful constructor to invoke. count_result_or_none:
  A handler result other than None creates TokenCountResponse with total_tokens=result.get(input_tokens,0), request_model
  default empty string, model_used original model_to_use, tokenizer_type=bedrock_api and original_response=result;
  explicit None input_tokens goes through shared response validation rather than becoming zero. A None handler result
  returns None. No local tokenizer or Hugging Face access occurs here, and API failures return error records rather
  than None. count_debug_events: In execution order emit debug Processing CountTokens request for resolved model:
  %s, Retrieved AWS region: %s, Transformed request: %s, Making request to: %s, Response status: %s, Bedrock response:
  %s, Final response: %s, using the corresponding values. Later messages do not run after an earlier failure. Keep
  shared redaction policy for debug output.


  Write standalone Rust test count_call_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test count_call_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/count_call.rs with adjacent tests under count_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function count_call_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  count_token_http_request, native_count_selection, count_api_failure_warning, count_credentials, count_timeout,
  counter_factory, count_result_or_none, count_debug_events. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_count_call* using HelperCase: kind:
  helper and the externally tagged bedrock_other_count_call variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_count_call that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_bedrock_count_reply consumes CountTokens JSON response bytes in crates/betterlite-bedrock/src/count_call.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_count_call.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_other_count_call.
  The adjacent test replays_the_bedrock_other_count_call_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 175 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 210 production lines, 260 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 660 planned, 675 maximum changed lines.
