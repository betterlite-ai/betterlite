id: B641
title: Bedrock count-token transport and local fallback
description: >-
  Execute typed CountTokens requests with per-deployment credentials and native counter selection. Preserve count
  failure warnings and local fallback, optional configured timeout and provider-native input validation. The injected
  local tokenizer cannot fetch Hugging Face assets.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/count_tokens/handler.py:
  BedrockCountTokensHandler.handle_count_tokens_request L26-L140. litellm/llms/bedrock/count_tokens/bedrock_token_counter.py:
  BedrockTokenCounter.should_use_token_counting_api L18-L25; BedrockTokenCounter.count_tokens L27-L114.


  Reuse get_bedrock_base_model from B591 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse run_aws_signing from B595 (litellm/llms/bedrock/base_aws_llm.py); its implementation remains with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Implement crates/betterlite-bedrock/src/count_call.rs with adjacent tests under count_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation bedrock_other_count_call in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function count_call_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  count_token_http_request, native_count_selection, count_api_failure_warning, fallback_local_count, count_credentials,
  count_timeout. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_count_call* using HelperCase: kind:
  helper and the externally tagged bedrock_other_count_call variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_count_call that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_bedrock_count_reply consumes CountTokens JSON response bytes in crates/betterlite-bedrock/src/count_call.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_count_call.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_other_count_call.
  The adjacent test replays_the_bedrock_other_count_call_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 168 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 195 production lines, 99 behavior/config-test lines,
  79 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 453 planned, 475 maximum changed lines.
