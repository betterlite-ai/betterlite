checks:
  optional:
  - mutants
  commands:
  - id: case-count-token-http-request
    why: The count-token-http-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::count_call_cases::case_[0-9]+_count_token_http_request$/)'
  - id: case-native-count-selection
    why: The native-count-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::count_call_cases::case_[0-9]+_native_count_selection$/)'
  - id: case-count-api-failure-warning
    why: The count-api-failure-warning behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::count_call_cases::case_[0-9]+_count_api_failure_warning$/)'
  - id: case-fallback-local-count
    why: The fallback-local-count behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::count_call_cases::case_[0-9]+_fallback_local_count$/)'
  - id: case-count-credentials
    why: The count-credentials behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::count_call_cases::case_[0-9]+_count_credentials$/)'
  - id: case-count-timeout
    why: The count-timeout behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::count_call_cases::case_[0-9]+_count_timeout$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_count_call.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_count_call*")"
      && grep -lq 'bedrock_other_count_call' tools/oracle/fuzz/corpus/helper_case/bedrock_other_count_call* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_count_call$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_other_count_call)"
      && grep -q 'decode_bedrock_count_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_count_call.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_other_count_call_corpus$/)'
