dod:
  - text: BlockCodeExecutionGuardrail constructor accepts guardrail_name, blocked_languages, action, confidence_threshold, detect_execution_intent, event_hook and default_on; normalizes event_hook to GuardrailEventHooks list and clamps confidence_threshold to [0.0, 1.0].
    proof: [guardrail-init-tests]
  - text: FENCED_BLOCK_RE regex correctly matches markdown fenced code blocks with optional language tag and multiline content between triple backticks.
    proof: [regex-tests]
  - text: _find_blocks returns list of block tuples with (start_char, end_char, language_tag, body, confidence, action_taken) in order, with language_tag = "(none)" when no tag present.
    proof: [block-finding-tests]
  - text: Language normalization resolves aliases (js → javascript, py → python, sh → bash, ts → typescript) and compares case-insensitively.
    proof: [language-tests]
  - text: Confidence scoring returns 1.0 for tags in blocked list, 0.5 for non-executable tags in block-all mode, 1.0 for executable tags in block-all, 0.0 otherwise.
    proof: [confidence-tests]
  - text: Blocked language detection returns true when tag is in blocked_languages list, or true when block_all is set (unless confidence disqualifies action).
    proof: [language-tests]
  - text: _has_no_execution_intent returns true only when text contains a no-execution phrase and no execution-request phrase.
    proof: [intent-detection-tests]
  - text: _has_execution_intent returns true when text contains an execution-request phrase.
    proof: [intent-detection-tests]
  - text: _scan_text returns early (text, false) for requests with no-execution intent and no execution intent, skipping block detection.
    proof: [text-scanning-tests]
  - text: _scan_text applies block/mask/log_only action based on effective_block (action_taken=="block" AND (is_response OR NOT detect_execution_intent OR has_execution_intent)) when self.action=="block".
    proof: [text-scanning-tests]
  - text: _scan_text accumulates CodeBlockDetection dicts with type, language, confidence (rounded to 2 decimals), and action_taken fields.
    proof: [text-scanning-tests]
  - text: _scan_text masks blocks with MASK_PLACEHOLDER when effective_block and self.action=="mask", preserving text before/after blocks.
    proof: [text-scanning-tests]
  - text: _scan_text returns (modified_text, false) when a blocked-language block is detected but self.action=="mask", even if action_taken=="block".
    proof: [text-scanning-tests]
  - text: _scan_text returns (modified_text, true) when any block triggers effective_block with self.action=="block".
    proof: [text-scanning-tests]
  - text: _normalize_escaped_newlines replaces \\n and \\r (literal two-character sequences) with real newlines only when text contains no real newlines.
    proof: [text-scanning-tests]
  - text: apply_guardrail extracts texts from inputs, processes each via _scan_text, and raises HTTPException with language on first should_raise block.
    proof: [apply-guardrail-tests]
  - text: apply_guardrail logs GuardrailStatus "success" on clean processing, "guardrail_intervened" on HTTPException or ModifyResponseException, "guardrail_failed_to_respond" on other errors, via finally-block always.
    proof: [apply-guardrail-tests]
  - text: apply_guardrail calls add_standard_logging_guardrail_information_to_request_data with guardrail_provider "block_code_execution", tracing_detail with detection_method "fenced_code_block", and max confidence from detections.
    proof: [apply-guardrail-tests]
  - text: apply_guardrail raises ModifyResponseException for request-side blocks, setting status "guardrail_intervened" with empty exception_str.
    proof: [apply-guardrail-tests]
  - text: _raise_block_error raises HTTPException with status 400 for responses, or calls raise_passthrough_exception for requests.
    proof: [error-handling-tests]
  - text: |-
      _raise_block_error generates message "Content blocked: execution request detected" for language=="execution_request",
      or "Content blocked: executable code block detected (language: {language})".
    proof: [error-handling-tests]
  - text: Phrase lists are non-overlapping subsets (no phrase subsumes another via substring containment), as documented.
    proof: [phrase-list-validation]

