id: B3701
title: Fenced code detection and execution intent
description: >-
  Build BlockCodeExecutionGuardrail for detecting fenced code blocks with language tags, masking or blocking based on blocked-language lists, and execution-intent heuristics.

  This task implements the core guardrail for markdown fenced code block (```) detection and enforcement in betterlite-guardrails. The guardrail detects code blocks in request and response text, matches language tags against a configured blocked list, applies confidence-based filtering, and checks user requests for execution intent phrases to avoid false positives on explain-and-refactor intents.

  Build crates/betterlite-guardrails/src/block_code_execution/:
  - language_normalization.rs: Helpers for language tags: LANGUAGE_ALIASES (L37-L42), _normalize_language (L277-L280), _is_blocked_language (L283-L297), _confidence_for_block (L300-L315), NON_EXECUTABLE_TAGS (L45-L47), and MASK_PLACEHOLDER constant (L329). Normalize language tags to lowercase and resolve aliases (js → javascript, py → python, sh → bash, ts → typescript). Blocked language check returns true when tag is in list or block_all is set. Confidence is 1.0 when tag in explicit list, 0.5 for non-executable tags in block-all mode, 1.0 for other tags in block-all mode, 0.0 otherwise.
  - block_detection.rs: Fenced code block regex (L51 FENCED_BLOCK_RE) matching ````lang\n...\n```` with re.DOTALL flag. Implement _find_blocks (L382-L403 LiteLLM) returning list of (start, end, language_tag, block_content, confidence, CodeBlockActionTaken). Check tag against blocked list, compute confidence via _confidence_for_block, and assign action: allow if not blocked, block if confidence >= threshold, log_only if blocked but below threshold. Parse language tag from regex group 1, body from group 2; empty tag becomes "(none)".
  - intent_detection.rs: Phrase-list constants _NO_EXECUTION_PHRASES (L58-L110) and _EXECUTION_REQUEST_PHRASES (L118-L232) with 50+ phrases each (documented to be non-subsumed minimal set). Implement _has_no_execution_intent (L235-L240) and _has_execution_intent (L243-L248) checking substring presence via lowercase search. Phrase lists are final/frozen; no phrase subsumes another via substring containment (documented edge case).
  - escaped_newlines.rs: _normalize_escaped_newlines (L251-L274 LiteLLM) replacing literal \\n/\\r (two-character sequences) with real newlines only when text has NO real newlines present. Heuristic: if \n or \r exist, return unchanged (assume payload is already normalized). Order matters: replace \\r\\n first to avoid producing extra \\n.
  - text_scanning.rs: Async _scan_text (L405-L494 LiteLLM) analyzing one text for code blocks and applying block/mask logic. Signature: fn _scan_text(&self, text: &str, detections: &mut Vec<CodeBlockDetection>, input_type: RequestOrResponse) -> (String, bool). Find blocks via _find_blocks, check execution intent only for requests when detect_execution_intent is true. For requests with no-execution intent and no execution intent, return (text, false) early. For each block, determine effective_block: action_taken=="block" AND (is_response OR NOT detect_execution_intent OR has_execution_intent). Record detection dict with type/language/confidence/action_taken. If effective_block and self.action=="block", set should_raise=true. Build output by concatenating parts: unchanged text before block, MASK_PLACEHOLDER if effective_block else original block, unchanged text after. Return (modified_text, should_raise).

  Depend on betterlite-config for BlockCodeExecGuardrailConfig, CodeBlockDetection, CodeBlockActionTaken (from B3690); fastapi::HTTPException, asyncio traits and serde for typed payloads.

  Integration: Export async fn apply_guardrail as the public entry point called by the proxy guardrail dispatcher. The apply_guardrail method is decorated with @log_guardrail_information in LiteLLM but in Rust the logging logic lives in finally-block, so no separate decorator is needed.

