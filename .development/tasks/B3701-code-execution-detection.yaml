pitfalls:
  - "Regex finditer yields match objects with byte-based positions in Python; Rust requires character-based indexing. Test with multi-byte UTF-8 sequences (emoji, accented chars) to verify masking preserves text structure."
  - "Language alias resolution must happen before list lookup, not after. Compare normalized tags from both the input and the blocked_languages list after applying aliases."
  - "Confidence threshold clamping in constructor must clamp to [0.0, 1.0], not truncate or panic. Use .max(0.0).min(1.0) or saturating_cast patterns."
  - "Execution intent heuristics apply only to requests (input_type == 'request'), never responses. Responses always enforce blocking on detected code blocks without intent checking."
  - "No-execution intent must have no conflicting execution-request phrase. If both are present (e.g. 'don't run this, but run that'), intent heuristics do not short-circuit and normal blocking applies."
  - "MASK_PLACEHOLDER must preserve text length only when action is 'mask'. When action is 'block', text is replaced entirely and the caller (proxy) decides how to handle the exception."
  - "Phrase lists use substring search (p in text.lower()), not regex or word boundaries. 'run ' matches 'run it', 'runtime', 'rerun', etc. Keep phrases short and well-tested for false positive rate."
  - "Detection accumulation in _scan_text must preserve order and include type='code_block' for all records. Language field takes the tag from the block, or 'execution_request' when block is not found but execution intent is."

