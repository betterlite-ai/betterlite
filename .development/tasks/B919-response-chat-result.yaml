id: B919
title: Assemble chat completions from Responses output
description: >-
  Build api::response_chat_result for _handle_raw_dict_response_item,
  _convert_response_output_to_choices, _build_empty_incomplete_choice and transform_response.
  These complete functions consume B1138 responses and update B004 ModelResponse records.
  Use B917 reasoning/identity/metadata helpers, B1136 annotations, B912 typed calls and
  B906 usage. Recover an empty output through B2412; the recovery parser has its own budget.
  Move get_model_response_iterator whole to B920 so response assembly never depends on
  its streaming consumer. No new byte parser belongs in this task.

  Register response_chat_result in B171. Fixtures distinguish typed OpenAI items from raw
  dictionaries because the pin treats their text/reasoning differently; preserve that
  distinction at provider decode seams instead of normalizing it away in the adapter.
  Count 237 nonblank/non-comment source lines and budget 245 native, 165 tests, 110
  fixtures, 85 adapters and 25 wiring lines, totaling 630.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/response_chat_result.rs
  - crates/betterlite-core/src/api/response_chat_result/**
  - tools/oracle/src/helpers/core_ops/response_chat_result.rs
  - tools/oracle/src/helpers/core_ops/response_chat_result/**
  - tools/oracle/helpers/response_chat_result.py
  - tools/oracle/helpers/response_chat_result/**
  - tools/oracle/fuzz/corpus/helper_case/response_chat_result-*
  - tools/oracle/cases/helpers/response-chat-result/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L315-L358
  why: Raw messages contribute only their first output_text block; raw reasoning is ignored by this callback.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L661-L823
  why: Typed output choices, one trailing tool-call choice and the empty-incomplete reasoning fallback.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/completion_extras/litellm_responses_transformation/transformation.py#L890-L981
  why: Full result validation, SSE recovery, incomplete finish override and asymmetric hidden-header merge.
dod:
- text: >-
    typed_and_raw_messages converts typed message content [text=a,text=b] to choices
    indices 0,1 with finish_reason=stop, while the raw dict equivalent yields only a.
    Typed refusal without text becomes content=""; raw refusal is skipped. Raw missing
    role defaults assistant and missing/falsy text becomes "". Unknown output items do
    not create choices. B1136 annotations are retained without citation filtering.
  proof: [result-tests, oracle, result-adapter]
- text: >-
    reasoning_and_tool_choices holds the most recent typed reasoning item's summary
    joined with spaces until the next typed text choice, then clears it. Two reasoning
    items before text replace rather than concatenate. Raw reasoning is ignored on this
    normal path. All function/custom/apply_patch calls accumulate into one final choice
    with content=null,finish_reason=tool_calls and any unflushed reasoning. Raw calls
    use sequential indices; typed function calls preserve B912's index=0 behavior.
    With no raw callback, non-tool raw messages are ignored. No extra reasoning-only
    choice is created in a complete response.
  proof: [result-tests, oracle, result-adapter]
- text: >-
    incomplete_response_choices treats status=incomplete OR a nonnull incomplete_details.reason
    as incomplete, regardless of status. reason=content_filter overrides every choice's
    finish_reason to content_filter; missing,unknown,max_output_tokens give length,
    including a tool_calls choice. When choices are empty, create index=0,content="" and
    collect all typed/raw reasoning items, joining nonempty summaries with spaces;
    absent reasoning_content/reasoning_items becomes null. status=failed alone does not
    trigger this fallback. A complete empty output raises ValueError
    "Unknown items in responses API response: []" with no HTTP status/type/param/code.
  proof: [result-tests, oracle, result-adapter]
- text: >-
    result_recovery_and_errors first rejects a string response with ValueError
    "Unexpected response type: <class 'str'>". A response.error="bad" raises ValueError
    "Error in response: bad" before recovery. Empty output with a recorded terminal message
    hi is replaced in the raw response, produces chat content=hi and logs warning
    "Recovered empty Responses API output from raw SSE for model=%s". Nonempty output
    never consults the recording; failed/empty recovery proceeds to normal incomplete/error logic.
  proof: [result-tests, oracle, result-adapter]
- text: >-
    chat_identity_and_hidden_fields sets result.model to caller model=m rather than the
    provider model, decodes response id to its upstream resp_a and applies B906 usage.
    Preserve preexisting result.created and other fields not assigned here. Copy nonnull
    B917 provider metadata, excluding Responses-only fields. Raw hidden scalar values win,
    but additional_headers merge raw first and existing second, so existing x-request-id=old
    beats raw x-request-id=new while raw x-vendor=v is added. Empty hidden data leaves the
    existing map unchanged; missing/null existing maps are initialized before merging.
  proof: [result-tests, oracle, result-adapter]
checks:
  optional: []
  commands:
  - id: result-tests
    why: result assembly loses typed/raw distinctions, reasoning or incomplete finish reasons
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_result::/)'
  - id: result-adapter
    why: result conversion is not compared against actual pinned response objects
    run: test -f tools/oracle/helpers/response_chat_result.py && grep -qE '^[[:space:]]+response_chat_result:' tools/oracle/fuzz/corpus/helper_case/response_chat_result-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/response-chat-result/typed-and-raw-messages.yaml
- tools/oracle/cases/helpers/response-chat-result/reasoning-and-tool-choices.yaml
- tools/oracle/cases/helpers/response-chat-result/incomplete-response-choices.yaml
- tools/oracle/cases/helpers/response-chat-result/result-recovery-and-errors.yaml
- tools/oracle/cases/helpers/response-chat-result/chat-identity-and-hidden-fields.yaml
deviations: []
out_of_scope:
- B2412 owns all sse_output_recovery.py functions and transformation.py L825-L888; B920 owns get_model_response_iterator and the stream class.
- B917 history/shared helpers, B918 request mapping and B1136 content conversion own the remaining live methods; _map_responses_status_to_finish_reason has no caller at the pin.
- B921 owns provider HTTP execution and SDK error mapping around these ValueErrors.
pitfalls:
- 'The oracle helper for this task is pre-registered as response_chat_result in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/response_chat_result.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/response_chat_result.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A raw message emits one choice but a typed message emits one per content block.
- Existing additional_headers beat upstream values even though other upstream hidden fields overwrite existing values.
- Incomplete details can override finish reasons even when status is completed.
review_level: standard
budget:
  max_changed_lines: 630
  max_new_expects: 1
