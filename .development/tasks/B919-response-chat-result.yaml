checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_result::/)
      - test(/::replays_corpus$/)'
  - id: case-completed-output-choices
    why: the completed-output-choices behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_result::tests::completed_output_choices($|::)/)'
  - id: case-empty-incomplete-response
    why: the empty-incomplete-response behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_result::tests::empty_incomplete_response($|::)/)'
  - id: case-sse-output-item-recovery
    why: the sse-output-item-recovery behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_result::tests::sse_output_item_recovery($|::)/)'
  - id: case-text-delta-recovery
    why: the text-delta-recovery behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_result::tests::text_delta_recovery($|::)/)'
  - id: case-refusal-finish-reason
    why: the refusal-finish-reason behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::response_chat_result::tests::refusal_finish_reason($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/response_chat_result)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/response_chat_result.rs && grep -qF "decode_response_chat_result"
      crates/betterlite-core/fuzz/fuzz_targets/response_chat_result.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::response_chat_result::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/response_chat_result.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/response_chat_result-*)"
      && grep -qE "^[[:space:]]+response_chat_result:" tools/oracle/fuzz/corpus/helper_case/response_chat_result-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/response-chat-result)"
