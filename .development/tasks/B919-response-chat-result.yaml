id: B919
title: Response chat result
description: >-
  Convert native Responses outputs to chat choices and recover output items from captured SSE when the completed
  payload lacks them. Keep the SSE accumulator keyed by output/content index, reuse B005 framing, and expose typed
  refusal, tool-call, annotation and incomplete outcomes.


  LiteLLMResponsesTransformationHandler._map_responses_status_to_finish_reason (litellm/completion_extras/litellm_responses_transformation/transformation.py:L1313-L1325)
  has no MIT runtime caller at the pin (only its declaration; tests are not runtime callers); it is excluded, and
  no behavior case exercises that unused entry point.


  Implement crates/betterlite-core/src/api/response_chat_result.rs. Use ResponseChatResultInput and ResponseChatResultResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions completed_output_choices, empty_incomplete_response, sse_output_item_recovery,
  text_delta_recovery, refusal_finish_reason under api::response_chat_result::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::response_chat_result::decode_response_chat_result(bytes:
  &[u8], limits: &ApiLimits), for json.loads input stripped_chunk at litellm/responses/sse_output_recovery.py:36.
  Place its implementation in crates/betterlite-core/src/api/response_chat_result.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/response_chat_result.rs passes arbitrary
  bounded bytes to that exact decoder; api::response_chat_result::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponseChatResult in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {response_chat_result: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._convert_response_output_to_choices
  (L662-L802); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._build_empty_incomplete_choice
  (L805-L823); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._extract_output_from_completed_event
  (L826-L833); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._recover_output_items_from_raw_sse
  (L836-L882); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler._recover_output_items_from_logging
  (L885-L888); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler.transform_response
  (L890-L981); litellm/completion_extras/litellm_responses_transformation/transformation.py: LiteLLMResponsesTransformationHandler.get_model_response_iterator
  (L983-L989); litellm/responses/sse_output_recovery.py: parse_sse_json_chunk (L21-L41); litellm/responses/sse_output_recovery.py:
  _chunk_index (L44-L51); litellm/responses/sse_output_recovery.py: record_output_item_chunk (L54-L65); litellm/responses/sse_output_recovery.py:
  record_output_text_chunk (L68-L125). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 332 owned nonblank/non-comment/non-docstring Python lines (361 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 352 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 662 total within the 670-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B005 (Streaming chat completions), B171 (Direct helper oracle and URL path encoding),
  B902 (Responses shapes), B906 (Responses usage), B1087 (Api boundaries), B917 (Response chat history), B1136 (Responses
  chat content projection), B912 (Responses tool results). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
