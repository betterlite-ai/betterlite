deviations: []
out_of_scope:
- Router retry policy is B017; the provider-local transform-on-422 seam belongs here and B026 supplies Azure AI
  behavior.
- Python dynamic extension classes and synchronous wrappers are B157-B165.
- The stub entries carry no endpoint behavior; each owning task fills its own module's types and calls.
- base_llm.bridges chat-to-Responses conversion is B080; B010 defines its typed seam only, because Responses models
  are not yet available.
- Base transformation tool/role/thinking helpers delegate to B175-B182; iterator SSE parsing is B005 and endpoint-specific
  iterators B080-B099; no parallel parser is added.
- Shared base config/error, thinking/tool helpers and None/dict response-schema branches listed in B2202 belong
  to B2202; this framework consumes them, never implements a parallel version. Python class-object response-schema
  extraction remains B160.
pitfalls:
- B004 puts wire models and the OpenAI adapter in the same crate, so betterlite-provider may depend on betterlite-openai
  but never the reverse.
- A catalog ProviderId is metadata and must not be used as proof that an executable adapter exists.
- Do not buffer streams to make all operation result types look alike.
- The 770-line budget covers the framework, server integration and tests but not the stubs and their registry lines.
- >-
  A stub dispatch call is not an async fn, since an async fn without an await fails clippy::unused_async; it returns
  std::future::ready(Err(...)) so its owner can make it async later without touching the registry.
review_level: standard
budget:
  max_changed_lines: 2400
  max_new_expects: 0
