id: B010
title: Closed provider framework and existing route integration
description: >-
  Finish the provider framework by composing the split helpers behind betterlite-provider's closed executable Provider
  enum in src/provider.rs, with OpenAi and AiohttpOpenAi built here and the other providers registered as stubs.
  Give the framework concrete chat/stream/embedding
  operation types, prepared request/result metadata and typed unsupported-operation errors, reusing existing betterlite-openai
  models rather than creating a duplicate wire crate. Keep transformation, configured HTTP execution and response
  decoding as explicit stages; the server resolves a deployment before passing its trusted inputs to the provider.
  Provider-specific branches select their own prompt and parameter transforms, and unavailable adapters remain explicit
  errors even when the catalog recognizes their names. Adapt B004-B006 server calls to this boundary, preserve B005's
  cancellation and incremental SSE behavior, and expose typed bridge/iterator seams for B015 and future endpoints
  without implementing unneeded endpoint bodies. Add framework oracle cases and regression tests; keep reqwest confined
  to betterlite-http and update deny.toml only for the new crate edges.   B174 owns ProviderId; B010 owns executable
  Provider, PreparedRequest in src/prepared.rs, OperationRequest/OperationResult in src/operation.rs and TransformRetry
  in src/transform_retry.rs. AiohttpOpenAi is a separate variant: default base https://api.openai.com with /chat/completions
  appended (no inserted /v1), Bearer {api_key} without OPENAI_API_KEY fallback, and only id/choices/created/model/object/system_fingerprint
  copied into the response (no upstream usage). B010 wires B176 ControlOptions constructors from config/server.
  Expose the provider transform-on-422 hook with explicit bounded attempt count; default is disabled and B026 Azure
  AI is its first user. This hook is separate from B017 router retry. Budget 300 framework/variant, 130 server integration,
  340 tests (770 total); the stubs and their registry lines add about 800 lines outside it. Write the behavior
  rstest functions provider_framework_tests_behavior in adjacent tests.rs files, with a named case for each
  behavior and failure in the DoD; corpus replay tests have separate names.

  Register every entry that the provider-stubs check lists up front, so a later provider task fills only its own
  module and never edits provider.rs, operation.rs or prepared.rs. A provider row is a Provider variant wrapping a
  unit-struct stub in that module, and calling it answers the typed unavailable-adapter error. An operation row is
  an OperationRequest, OperationResult and PreparedRequest variant wrapping unit-struct stubs in that module, and
  its dispatch call answers the typed unsupported-operation error. A provider that does not run an operation answers
  that error for the whole variant and never matches inside it, so filling one stub never breaks another task's
  match. Declare the three provider/<module>.rs stubs in provider.rs; lib.rs and api.rs already declare every other
  module. Provider::OpenAi stays real, and its OpenAi operation row routes the operations B024 adds to
  openai_dispatch.rs.


  Shared provider base helper implementations are B2202: use its owned primitives directly when called by these
  ranges. Do not reintroduce a dependency on B010/B016 for these small helpers.

  The `GenericLiteLLMParams` validators in litellm/types/router.py are this task's too, in the deployment params type the server hands to a provider: `validate_provider_affinity_header` (L472-L475) checks a set header name with `validate_provider_affinity_header_name` and keeps None; `preprocess_input_data` (L479-L491) drops the keys `self`, `params` and `__class__` and turns a string `max_retries` into an integer, failing on a string that is not one; `coerce_drop_params` (L495-L503) keeps a flag value from `normalize_drop_params`, keeps any other string, and treats anything else as unset with a warning. The dict-style accessors of `GenericLiteLLMParams` and `LiteLLM_Params` (L505-L519, L530-L544) are plain field reads in Rust.
