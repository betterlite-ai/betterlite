  why: Common provider transformation interface and its extension hooks.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/bridges/completion_transformation.py#L18-L55
  why: Request/response/iterator bridge boundary.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/base_model_iterator.py#L1-L220
  why: Iterator responsibilities and end-of-stream state.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/base_utils.py#L1-L180
  why: Shared provider response helpers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/base.py#L1-L83
  why: Typed inputs shared by provider implementations.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/aiohttp_openai/chat/transformation.py#L27-L81
  why: Distinct endpoint, auth and response projection.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/chat/transformation.py#L316-L365
  why: Provider-local transform-and-retry hook used by B026.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L450-L477
  why: Bounded transformation attempts, distinct from router retries.
dod:
- text: Chat, streaming and embedding calls pass through the provider enum and retain all listed oracle behavior.
  proof:
  - oracle
  - provider-framework-tests
- text: Unsupported executable adapters and call types fail before HTTP, and parallel calls do not share mutable
    request/settings state.
  proof:
  - provider-framework-tests
- text: Disconnects drop the upstream stream and decoding remains incremental under a slow provider.
  proof:
  - provider-framework-tests
- text: Production dependency edges remain acyclic and only betterlite-http constructs outbound clients.
  proof:
  - clippy
  - deny
checks:
  optional:
  - mutants
  commands:
  - id: provider-framework-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-provider -p betterlite-server --no-tests=fail -E 'test(/::provider_framework_tests_behavior($|::)/)
      - test(/replays_the_/)'
oracle_cases:
- tools/oracle/cases/chat/openai-basic.yaml
- tools/oracle/cases/chat/openai-tools.yaml
- tools/oracle/cases/chat/openai-stream.yaml
- tools/oracle/cases/chat/openai-stream-usage.yaml
- tools/oracle/cases/embeddings/string-input.yaml
- tools/oracle/cases/provider-framework/aiohttp-alias.yaml
- tools/oracle/cases/provider-framework/aiohttp-no-key-fallback.yaml
- tools/oracle/cases/provider-framework/aiohttp-drops-usage.yaml
- tools/oracle/cases/provider-framework/aiohttp-explicit-base.yaml
deviations: []
out_of_scope:
- Router retry policy is B017; the provider-local transform-on-422 seam belongs here and B026 supplies Azure AI
  behavior.
- Python dynamic extension classes and synchronous wrappers are B157-B165.
- Additional endpoints are represented only when their owning tasks implement their concrete types.
- base_llm.bridges chat-to-Responses conversion is B080; B010 defines its typed seam only, because Responses models
  are not yet available.
- Base transformation tool/role/thinking helpers delegate to B175-B182; iterator SSE parsing is B005 and endpoint-specific
  iterators B080-B099; no parallel parser is added.
- Shared base config/error, thinking/tool helpers and None/dict response-schema branches listed in B2202 belong
  to B2202; this framework consumes them, never implements a parallel version. Python class-object response-schema
  extraction remains B160.
pitfalls:
- B004 puts wire models and the OpenAI adapter in the same crate, so betterlite-provider may depend on betterlite-openai
  but never the reverse.
- A catalog ProviderId is metadata and must not be used as proof that an executable adapter exists.
- Do not buffer streams to make all operation result types look alike.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
