dod:
- text: Chat, streaming and embedding calls pass through the provider enum and retain all listed oracle behavior.
  proof:
  - oracle
  - provider-framework-tests
- text: Unsupported executable adapters and call types fail before HTTP, and parallel calls do not share mutable
    request/settings state.
  proof:
  - provider-framework-tests
- text: >-
    Every entry in the provider-stubs list has its Provider variant, or its OperationRequest, OperationResult and
    PreparedRequest variants, and a stub in its module, and provider_framework_tests_behavior asserts that a stub
    answers the typed unavailable-adapter or unsupported-operation error before HTTP.
  proof:
  - provider-stubs
  - provider-framework-tests
- text: Disconnects drop the upstream stream and decoding remains incremental under a slow provider.
  proof:
  - provider-framework-tests
- text: Production dependency edges remain acyclic and only betterlite-http constructs outbound clients.
  proof:
  - clippy
  - deny
checks:
  optional:
  - mutants
  commands:
  - id: provider-framework-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-provider -p betterlite-server --no-tests=fail -E 'test(/::provider_framework_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: provider-stubs
    why: a planned provider or operation has no registry variant or stub module, so its task would have to edit provider.rs, operation.rs or prepared.rs
    run: |-
      while read -r registry variant module; do
        file="crates/betterlite-provider/src/$module.rs"
        name="${module##*/}"
        case "$registry" in
          provider) lists="crates/betterlite-provider/src/provider.rs" ;;
          *) lists="crates/betterlite-provider/src/operation.rs crates/betterlite-provider/src/prepared.rs" ;;
        esac
        grep -q . "$file" || { echo "$file has no stub for $variant"; exit 1; }
        for list in $lists; do
          grep -qw "$variant" "$list" && grep -qw "$name" "$list" || { echo "$list does not register $variant from $module"; exit 1; }
        done
      done <<'EOF'
      provider Azure azure_dispatch
      provider AzureAi foundry_dispatch
      provider Anthropic anthropic_dispatch
      provider Bedrock bedrock_dispatch_contract
      provider VertexAi vertex_dispatch
      provider Gemini studio_dispatch
      provider XaiMistral xai_mistral
      provider EmbeddingRerank embedding_rerank_providers
      provider Compatible compatible_providers
      provider Legacy legacy_dispatch
      provider Subscription provider/subscription
      provider MediaProviders provider/media_providers
      provider SpeechProviders provider/speech_providers
      operation OpenAi openai_dispatch
      operation Azure azure_dispatch
      operation AzureAi foundry_dispatch
      operation Anthropic anthropic_dispatch
      operation Bedrock bedrock_dispatch_contract
      operation VertexAi vertex_dispatch
      operation Gemini studio_dispatch
      operation XaiMistral xai_mistral
      operation EmbeddingRerank embedding_rerank_providers
      operation Compatible compatible_providers
      operation Legacy legacy_dispatch
      operation Image api/image_contracts
      operation Rerank api/rerank_contracts
      operation File api/file_contracts
      operation Batch api/batch_records
      operation Responses api/responses_provider_contract
      operation Transcription api/transcription_contract
      operation Speech api/speech_provider_contract
      operation Messages api/messages_native_prepare
      operation OpenAiMedia openai_media_dispatch
      operation OpenAiResource openai_resource_dispatch
      operation OpenAiAssistant openai_assistant_dispatch
      operation AzureMedia azure_media_dispatch
      operation AzureResource azure_resource_dispatch
      operation FoundryResource foundry_resource_dispatch
      operation BedrockChat bedrock_dispatch
      operation BedrockOther bedrock_other_dispatch
      operation BedrockServices bedrock_services_dispatch
      operation BedrockImage bedrock_image_dispatch
      operation BedrockAgent bedrock_agent_dispatch
