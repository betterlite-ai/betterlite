    - crates/betterlite-auth/src/spend_counter_batch/batch.rs
    - crates/betterlite-auth/src/spend_counter_batch/batch/load.rs
    - crates/betterlite-auth/src/spend_counter_batch/tests/state.rs
    - crates/betterlite-auth/src/spend_counter_batch/tests/load.rs
    - docs/deviations/B9994.yaml
  lint_tables: false
