dod:
  - text: >-
      A reply asked for before forget on a key no longer puts that key into loaded, on the direct MGET path and on the
      request batch path. The read waiting on it returns None, and the other keys of the same reply still load.
    proof: [forget-race]
  - text: >-
      After a forgotten key is bound again, read returns the newer MGET value, both when the old reply was still in
      flight and when it had already settled in the pipeline.
    proof: [forget-race, settled-reply]
  - text: A value written with record during a fetch still outranks the older reply.
    proof: [forget-race]
  - text: >-
      No test asserts the stale value any more, and the rest of the spend_counter_batch tests pass with the generation
      map and InflightRead.
    proof: [race-pins-gone, module-tests]
  - text: docs/deviations/B9994.yaml lists the fix with the pinned LiteLLM link.
    proof: [deviation-row]
checks:
  optional: []
  commands:
    - id: forget-race
      why: A reply asked for before a forget still fills loaded, drops the other keys of its MGET, or loses a recorded write.
      run: >-
        cargo nextest run --locked -p betterlite-auth --no-tests=fail
        -E 'test(/^spend_counter_batch::tests::state::reply_asked_before_a_forget::case_/)'
    - id: settled-reply
      why: A pipelined reply that settled before the forget still beats the newer reply for the rebound key.
      run: >-
        cargo nextest run --locked -p betterlite-auth --no-tests=fail
        -E 'test(/^spend_counter_batch::tests::load::rebound_key_skips_a_settled_older_reply$/)'
    - id: race-pins-gone
      why: A test that asserts the stale value from before a forget is still in the module.
      run: >-
        ! git grep -n -E 'fn (pending_reply_does_not_rebind_forgotten_key|rebound_forgotten_key_keeps_loaded_merge_precedence|first_loaded_value_wins_duplicate_reply)[(]'
        -- crates/betterlite-auth/src/spend_counter_batch
    - id: module-tests
      why: The generation map or the InflightRead entries broke another spend counter batch test.
      run: >-
        grep -q -F 'generations' crates/betterlite-auth/src/spend_counter_batch/batch.rs
        && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^spend_counter_batch::/)'
    - id: deviation-row
      why: The fix has no deviations row, or the row lacks the pinned LiteLLM link.
      run: >-
        grep -q -F 'spend_counter_batch.py#L88-L126' docs/deviations/B9994.yaml
        && grep -q -F 'forget' docs/deviations/B9994.yaml
oracle_cases: []
deviations:
  - what: >-
      A Redis MGET reply asked for before SpendCounterBatch::forget on a counter key no longer fills that key's value
      in the batch. A read that was waiting on that reply returns None, so the caller reads Redis itself, and once the
      key is bound again the next MGET's value is the one read returns. The other keys of the same reply still load,
      and a value written with record still outranks an older reply.
    why: >-
      LiteLLM's forget clears _keys, _fetched and _loaded while _load awaits _fetch or _collect_inflight awaits a
      pipelined result, and the late reply is merged back under _loaded. The value from before the write that called
      forget then stays authoritative, a later MGET for the rebound key can't replace it, and budget checks read a
      stale, lower spend. No working setup relies on a counter value older than the write that dropped it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_counter_batch.py#L88-L126
out_of_scope:
  - record and close stay as B2316 built them. record doesn't bump a generation, since or_insert already lets its value win.
  - A retry of a key whose reply was dropped inside the same load. The waiting read returns None and the caller's own Redis read covers it, as after a failed MGET.
  - Loader::load, claim_load, LoadShared and LoadFinished (the shared load and its waiters) don't change.
  - The spend-counter-batch oracle cases compare counter key sets only and never reach forget.
  - Callers of forget_spend_counter in B070, B124 and the reservation tasks; nothing outside the module calls it at 2df323e939.
pitfalls:
  - Take the generation snapshot inside take_pending, under the lock that marks the keys fetched. A snapshot taken after that lock drops lets a forget slip in between, and the stale reply passes the check.
  - Never remove a generations entry, in forget or anywhere else. A removed entry reads as None again and matches a reply asked for before the first forget.
  - Bump with wrapping_add(1). The arithmetic lints deny +=, and the check only needs a number that differs from the snapshot. One request can't bump a key 2^64 times.
  - Read the generation the same way in take_pending and merge, generations.get(key).copied(), so a key never forgotten is None on both sides and its value merges.
  - A value merge skips must leave loaded alone. Removing the key on a mismatch would also throw away a value record wrote after the forget.
  - Make both InflightRead fields pub(super), like BatchState's. cancelled_load_propagates in the tests module reaches result, and clippy denies a struct that mixes pub and private fields.
  - Build the cache and the batch for the RequestBatch cases inside request_redis_batch_scope; built outside, request_batch is None and the case quietly runs the direct path.
  - Script both MGET replies before the read starts. FakeRedis pops them in order once the hold is released, and an unused second reply is harmless.
  - Spawn the in-flight read on a JoinSet with Arc::clone(&batch), as the deleted state.rs tests did; awaiting it on the test task blocks on the held MGET.
  - declare_pending calls request_batch.mget while it holds the state lock today; keep it that way, so the snapshot, the fetched marks and the inflight push stay one step.
review_level: security
budget:
  max_changed_lines: 350
  max_new_expects: 0
