  - url: https://github.com/betterlite-ai/betterlite/blob/2df323e939/crates/betterlite-auth/src/spend_counter_batch/batch/load.rs#L62-L95
    why: collect_inflight takes the pipelined results and accept_settled hands each decoded map to merge.
