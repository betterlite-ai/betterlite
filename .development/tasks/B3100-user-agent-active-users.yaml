id: B3100
title: Report distinct user agents and daily and weekly active users
description: >-
  Implement user-agent analytics endpoints in betterlite-server::user_agent_analytics.
  Add response types for distinct tags, daily active users (DAU) and weekly active users (WAU).
  Build three GET routes: `/tag/distinct`, `/tag/dau` and `/tag/wau` that query the database
  and return active user metrics grouped by tag.

  Add response types: DistinctTagsResponse (list of tags), ActiveUsersAnalyticsResponse (results list),
  TagActiveUsersResponse (tag, active_users, date, optional period_start/period_end).

  Add internal row types _DistinctTagRow and _ActiveUsersRow for parsing SQL query results via
  TypeAdapter.

  Implement get_distinct_user_agent_tags (GET `/tag/distinct`): query all distinct tags from
  LiteLLM_DailyTagSpend filtered by pattern (User-Agent: or non-prefixed tags), order by usage count
  descending, limit to MAX_TAGS=250. Return tags with no user filtering or date range.

  Implement get_daily_active_users (GET `/tag/dau`): calculate active users per tag for last
  MAX_DAYS=7 days, where end_date is UTC today + 1 day at 0:00 UTC. Accept optional tag_filter
  (substring ILIKE match, legacy) and tag_filters (exact match list, takes precedence). Query joins
  LiteLLM_DailyTagSpend with LiteLLM_VerificationToken on api_key=token, groups by tag and date,
  counts distinct user_id. Order by date descending then active_users descending.

  Implement get_weekly_active_users (GET `/tag/wau`): calculate active users per tag for last
  MAX_WEEKS=7 weeks (49 days), where weeks are 7-day periods. End boundary is same UTC tomorrow.
  Support same tag filtering as DAU. Group data by week_offset using FLOOR division, generate
  descriptive week labels with ordinal numbers and month names (e.g., "Week 1 (Jan 15)").
  Include period_start and period_end dates in response. Order by week_offset descending
  (most recent first) then active_users descending.

  All three endpoints require user API key authentication (B052). When prisma_client is unavailable,
  return HTTP 500 with "Database not connected" error matching CommonProxyErrors.db_not_connected_error.
  Build SQL queries dynamically with parameter injection; do not use template strings for user input.

