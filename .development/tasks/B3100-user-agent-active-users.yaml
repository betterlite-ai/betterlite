deviations:
  - what: SQL parameter injection uses Rust's native parameterized query API instead of string formatting. Parameter indices match the count and order of provided values.
    why: Prevents SQL injection and matches betterlite's database abstraction patterns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/user_agent_analytics_endpoints.py#L278-L288
  - what: Week labels use Rust chrono date formatting instead of PostgreSQL TO_CHAR. Output matches LiteLLM's format (e.g., "Week 1 (Jan 15)") exactly.
    why: Simplifies query building and aligns with Rust type safety.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/user_agent_analytics_endpoints.py#L376-L402
out_of_scope:
  - "_TableOps protocol and _typed_table overloads (lines 142-155 of user_agent_analytics_endpoints.py) are used only by get_per_user_analytics, which B3101 owns. B3100 builds only _query_raw and does not use these protocol helpers."
  - get_monthly_active_users, get_tag_summary, get_per_user_analytics (owned by B3101).
  - Tag ownership scoping or authorization checks beyond user_api_key_auth (B052).
  - Caching of results or precomputed aggregations.
  - Database schema or table definitions (uses existing LiteLLM tables).
pitfalls:
  - "UTC-tomorrow boundary: end_dt is calculated as today at 0:00 UTC + 1 day; queries use `date <= end_date` (inclusive) or `date < (end_date + 1)` to include the entire end_date calendar day."
  - "Exact-list tag filtering (tag_filters) takes precedence over substring filtering (tag_filter). tag_filters must use equality comparisons; tag_filter uses ILIKE for substring matching."
  - "Empty tag_filters list means no tag filtering (fetch all), not exclude everything. Query logic must check list length before adding WHERE conditions."
  - "Distinct tags are filtered by pattern: tags starting with 'User-Agent:' or tags without colons are included. Tags with other prefixes are excluded."
  - "Week numbering counts from most recent backwards: week_offset 0 is the most recent 7-day period, week_offset 1 is 7-14 days ago, etc. Label text shows 'Week N' where N = MAX_WEEKS - week_offset."
  - "Week labels must include descriptive month names and dates. Format is 'Week N (Mon DD)' where the date is the start of that week's period, calculated as end_date - (week_offset * 7) - 6 days."
  - "Period_start is the first day of the week period; period_end is the last day (inclusive). Both are returned as YYYY-MM-DD strings."
  - "NULL user_id in VerificationToken rows are filtered out; only records with non-null user_id contribute to active user counts."
  - "TypeAdapters parse SQL results into strongly typed row objects; if SQL returns unexpected types (e.g., string instead of int), parsing fails and returns HTTP 500 error."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
