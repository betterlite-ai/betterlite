id: B4771
title: Native agent provider contracts and A2A response records
description: >-
  Build typed agent CRUD response records and the abstract interface for providers with native agents APIs under betterlite-core::agents. AgentCreateResponse, AgentDeleteResult, AgentListResponse, and AgentVersionsResponse preserve provider-specific fields via extra="allow" and wrap the provider's raw payload (e.g. Gemini returns base_agent, system_instruction, base_environment). LiteLLMSendMessageResponse wraps the A2A SDK's SendMessageResponse with betterlite's _hidden_params for cost tracking and logging. _normalize_a2a_jsonrpc_response backfills JSON-RPC request ids on error payloads when the agent SDK omits them.

  BaseAgentsAPIConfig is the abstract interface that provider-specific transformations (e.g. GeminiAgentsAPIConfig) implement. Methods map create/list/get/delete/list-versions requests to provider URLs and request bodies, and parse responses into the typed response records. A default get_error_class maps HTTP errors to a provider-agnostic exception; subclasses override when needed.

scope:
