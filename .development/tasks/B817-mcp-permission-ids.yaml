id: B817
title: Canonical MCP server identifiers in grants
description: >-
  Implement MCP identifier resolution without rewriting stored aliases into local IDs. The pure matcher
  accepts an exact server_id, alias, server_name or name; stable dedupe retains first occurrence. DB
  lookup returns [] with no client or no identifiers, otherwise performs one OR query on server_id,
  alias and server_name (not name) through B726 MCPServerRepository. Initialize every requested identifier
  to an empty set, accumulate all matching rows with truthy server_id, then union B136 registry matches
  using server.server_id or the registry key. A registry key matches even if no server attribute does.
  Empty IDs are skipped. A DB error propagates before consulting the registry; successful DB matches do
  not suppress config matches despite the source's "authoritative" comment. Native resolver_db_registry_union,
  resolver_empty_and_missing_db, registry_key_fallback and db_error_before_registry cover these branches.

  Dropping stale mcp_servers mutates only a list-valued field, preserving original identifiers that
  resolve anywhere and the literal no-mcp-servers sentinel, then deduplicating in input order. It must
  not persist resolved IDs, because shared-DB regions resolve aliases differently. For a dict-valued
  mcp_tool_permissions retain only resolving identifiers and deduplicate each list of tools; non-list
  tools become []. Other raw shapes are unchanged. An empty/null/non-dict outer permission object is
  untouched. The combined helper drops both fields, and flatten returns the union of all ID sets.
  Pure cases identity_attribute_match, stable_dedupe, retain_alias_and_no_mcp_servers,
  stale_tool_keys_and_non_list_tools, untouched_wrong_shapes and flatten_union exercise these transforms.

  Team allowed-server resolution defaults prisma_client=null. If direct mcp_servers includes the
  all-proxy-mcpservers literal, immediately return B136 registry KEYS, not the objects' server_id attributes,
  and do not consult groups/tool grants. Otherwise union direct IDs, B4669
  MCPRequestHandler._get_mcp_servers_from_access_groups results and tool-permission keys; parse a stored
  JSON tool map before extracting keys. B4669 uses requires_fresh_policy=false here, so a group lookup
  exception warns and contributes []; malformed JSON or any decoded non-map result raises instead.
  Resolve the union and then add each unresolved ORIGINAL identifier back to the result. This is the
  opposite of stale-key cleanup. Native all_proxy_uses_registry_keys, group_failure_warns_and_drops,
  team_union_retains_unresolved and stored_tool_json_errors preserve those distinctions. The shared
  byte decoder decode_mcp_tool_grants_json accepts stored JSON text and rejects malformed/non-map forms,
  including the strings "null", "[]", "false" and "0"; only falsey raw values normalize to {} before
  decoding. Its fuzz target exercises the same production path.

  _get_allow_all_keys_server_ids returns a set of B136's allow_all_keys IDs; _get_all_mcp_server_ids
  returns a set of registry keys. _existing_object_permission_mcp_servers returns [] for falsey ID,
  missing DB/row or null servers, otherwise returns the stored list unchanged with duplicates. Use
  B725 ObjectPermissionRepository, with no cache or write. Cases allow_all_keys_snapshot and
  existing_grants_falsey_missing_and_duplicates cover those projections. B816 owns collision rejection;
  this resolver intentionally returns multiple matches. No local license/config/environment switch exists.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/object_permission_utils.py:
  _dedupe_preserving_order (L240-L248; 9 source lines), _mcp_server_identifier_matches (L251-L257; 7 source
  lines), _get_db_mcp_servers_by_identifiers (L260-L276; 16 source lines), _resolve_mcp_server_identifiers_to_ids
  (L279-L318; 34 source lines), _drop_stale_object_permission_mcp_servers (L374-L390; 13 source lines),
  _drop_stale_object_permission_mcp_tool_permissions (L393-L405; 12 source lines), _drop_stale_object_permission_mcp_identifiers
  (L408-L422; 14 source lines), _flatten_resolved_mcp_server_ids (L425-L428; 4 source lines), _resolve_team_allowed_mcp_servers
  (L431-L463; 31 source lines), _get_allow_all_keys_server_ids (L466-L472; 6 source lines), _get_all_mcp_server_ids
  (L475-L481; 6 source lines), _existing_object_permission_mcp_servers (L484-L495; 12 source lines).


  The B856 helper operation calls only matching, dedupe, stale-field cleanup and flatten functions with
  supplied typed snapshots. Database/registry/group resolver tests are native; real Postgres fixtures
  use POSTGRES_TEST_URL or testcontainers when absent, failing on connection errors. B171 owns the
  existing helper seed parser. Test log/drop effects of the B4669 dependency without invoking FastAPI
  handlers from Python helpers.


  The stored JSON boundary is capped at 1048576 bytes and depth 64, with typed limit errors and the native
  mcp_tool_json_limits case outside oracle equality. Register mcp_tool_grants in B770's server fuzz workspace
  and replay valid/falsey/malformed/deep inputs in replays_the_mcp_tool_grants_corpus. No HTTP schema is added.


  Sizing: 164 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  180 production, 300 behavior/Postgres tests, 60 helper adapters, 30 route/manifests/wiring, 60 decoder/fuzz
  and 0 config lines, 630 changed lines estimated within a 650-line gate.
