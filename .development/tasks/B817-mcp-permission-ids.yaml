id: B817
title: Canonical MCP server identifiers in grants
description: >-
  Implement McpGrantIds over injected registered MCP server snapshots and stored permission rows. Resolve
  IDs/names/aliases consistently, reject ambiguous tool permission keys, remove stale identifiers according
  to source behavior and preserve stable deduplication. This is permission plumbing, not an MCP runtime.


  Build the production mcp_permission_ids module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/object_permission_utils.py:
  _dedupe_preserving_order (L240-L248; 9 source lines), _mcp_server_identifier_matches (L251-L257; 7 source
  lines), _get_db_mcp_servers_by_identifiers (L260-L276; 16 source lines), _resolve_mcp_server_identifiers_to_ids
  (L279-L318; 34 source lines), _drop_stale_object_permission_mcp_servers (L374-L390; 13 source lines),
  _drop_stale_object_permission_mcp_tool_permissions (L393-L405; 12 source lines), _drop_stale_object_permission_mcp_identifiers
  (L408-L422; 14 source lines), _flatten_resolved_mcp_server_ids (L425-L428; 4 source lines), _resolve_team_allowed_mcp_servers
  (L431-L463; 31 source lines), _get_allow_all_keys_server_ids (L466-L472; 6 source lines), _get_all_mcp_server_ids
  (L475-L481; 6 source lines), _existing_object_permission_mcp_servers (L484-L495; 12 source lines).


  Add the mcp_permission_ids operation under B856 Management::models. Python calls only the owned MIT
  helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected
  algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a mcp-permission-ids-* seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 164 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  164 production, 151 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 410 changed lines estimated within a 425-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
