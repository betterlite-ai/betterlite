dod:
  - text: 'Session payloads and encryption interoperate with the pin; named cases: ui_fixed_fields,
      ui_budget_override, ui_ignores_session_duration, expiry_milliseconds, missing_ui_role,
      missing_cli_role, invalid_role, cli_session_expiry, cli_first_team, cli_explicit_team,
      cli_without_team, cli_team_grants, cli_alias_and_budget, null_fields_omitted,
      both_sessions_clear_parallel_limit, ui_token_roundtrip,
      bearer_prefix_aad, bearer_missing_secret, bearer_empty_secret, decrypt_wrong_prefix,
      decrypt_bad_base64, decrypt_short_ciphertext, decrypt_wrong_key, decrypt_bad_utf8,
      malformed_session_json and invalid_session_fields.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The production decode_session_token decoder is used by the service and its fuzz target and rejects
      malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'session_input_limits checks byte/depth limits; session_error_redaction checks Debug, error and
      tracing output contain neither ciphertext nor decrypted credentials.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^session_token_codec::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/session_token_codec.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/session-token-codec-*")"
        && grep -rlq "session_token_codec" tools/oracle/fuzz/corpus/helper_case/session-token-codec-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::session_token_codec::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/session-token-codec-*")"
        && grep -rlq "max_ui_session_budget" crates/betterlite-config/fuzz/corpus/config_yaml/session-token-codec-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/session_token_codec.rs && grep -q "session_token_codec"
        crates/betterlite-auth/fuzz/Cargo.toml && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE"
        -- crates/betterlite-auth/fuzz/corpus/session_token_codec)" && cargo nextest run --locked -p betterlite-auth
        --no-tests=fail -E 'test(replays_the_session_token_codec_corpus)'
