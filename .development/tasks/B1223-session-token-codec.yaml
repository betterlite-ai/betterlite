  - 'The oracle helper for this task is pre-registered as session_token_codec in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/session_token_codec.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/session_token_codec.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - The selected legacy expiry value can prevent startup even when LITELLM_CLI_JWT_EXPIRATION_HOURS is valid.
