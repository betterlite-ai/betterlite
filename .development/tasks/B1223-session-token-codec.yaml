id: B1223
title: Experimental UI and CLI session token codec
description: >-
  Build session_token_codec in betterlite-auth around encrypted UserAPIKeyAuth JSON. Despite the Python
  class name these session tokens are not JWTs. Both builders serialize with exclude_none=True and
  encrypt_bearer_token prefixes the ciphertext with litellm_login_. Inject the UTC clock, random source
  and secret; live grant refresh belongs to B738.


  Call B2303's shared bearer primitives, below authentication, callback configuration and stored credentials
  in the call graph. _get_salt_key reads LITELLM_SALT_KEY, falling back to the master key only when absent, not when
  empty. _derive_key hashes UTF-8 secret bytes with SHA-256; _seal_aes_gcm and _open_aes_gcm use AES-256-GCM,
  a 12-byte nonce, the prefix as AAD, and nonce || ciphertext || 16-byte tag. encrypt_bearer_token emits
  unpadded base64url after the prefix and raises ValueError when no string secret exists. Decryption
  restores padding and strictly decodes; absent secret, wrong prefix, invalid base64, short ciphertext,
  failed authentication or invalid UTF-8 return None. Use maintained cryptographic implementations.
  B2303 also owns the separate stored-value format; session JSON remains owned here.


  Build the production session_token_codec module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_checks.py:
  ExperimentalUIJWTToken.get_experimental_ui_login_jwt_auth_token (L3622-L3652; 23 source lines), ExperimentalUIJWTToken.get_cli_jwt_auth_token
  (L3655-L3721; 52 source lines), ExperimentalUIJWTToken.get_key_object_from_ui_hash_key (L3724-L3740;
  15 source lines).


  UI sessions expire in exactly ten minutes, independently of LITELLM_UI_SESSION_DURATION. Their token,
  key_name and key_alias are ui-token, rpm_limit is 100, team_id is litellm-dashboard, models and user_id
  come from the user, and max_budget comes from litellm_settings.max_ui_session_budget (default 1.0 USD,
  nullable). Both builders explicitly set max_parallel_requests=None, which exclude_none serialization
  omits from the encrypted JSON. Preserve UserAPIKeyAuth's remaining defaults. B2314 supplies payload
  validation, credential hashing and marker stripping; B720 supplies the user row read by the factories.
  A missing user_role raises the builder-specific error before encryption; an invalid role fails enum
  conversion. Format expires to milliseconds followed by +00:00, truncating smaller fractions.


  CLI expiry uses the first nonempty CLI_JWT_EXPIRATION_HOURS, then LITELLM_CLI_JWT_EXPIRATION_HOURS, then
  24, parsed by int() at import. Invalid selected text stops startup; zero and negative hours are accepted.
  CLI token is cli-session- followed by token_urlsafe(16); key_name and key_alias are cli-session-<user_id>.
  Prefer explicit team_id, otherwise the first user team. A set team clears models to [], otherwise keep
  the user's models. Copy team_models (default []), team_model_aliases (default None), team_alias and
  the supplied max_budget (default None), and set is_session_token=true. Decryption returning None stays
  None; decrypted JSON or UserAPIKeyAuth validation failures raise a typed invalid-session error. The
  Python error echoes both ciphertext and plaintext; betterlite's error omits both as recorded below.


  Add the session_token_codec operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a session-token-codec-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::session_token_codec::tests::loads_settings, legacy_hours_win, empty_hours_fall_through,
  invalid_hours_stop_startup, signed_hours_are_accepted, ui_budget_nullable and salt_before_master.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary session_token_codec::decode_session_token(&[u8]) -> Result<TypedValue,DecodeError>
  for untrusted prefixed AES-GCM token bytes and the decrypted JSON. Production calls this decoder before its
  typed policy functions; the cargo-fuzz target session_token_codec calls that same function. Seed valid,
  truncated, malformed, duplicate-field and limit-boundary inputs and add session_token_codec::tests::replays_the_session_token_codec_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B733 owns crates/betterlite-auth/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: the three token methods own 90 source lines. B2303 owns the shared bearer primitives.
  Allow 130 production, 230 behavior tests, 75 helper adapters, 30 wiring, 60 decoder/fuzz and
  75 config lines, 600 changed lines within a 650-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: session_input_limits and session_error_redaction.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
