deviations:
  - what: Rendering happens in a Tokio blocking task (worker thread) instead of on the event loop,
      so large scrapes do not block other requests.
    why: The gateway runs inference and logging concurrently; a 50+MB scrape on the event loop
      would stall every other task. LiteLLM uses prometheus_client.make_asgi_app directly, which
      blocks the ASGI loop for the whole duration of collecting and encoding the registry.
  - what: The 401 response body when auth fails is application/json with a hint about the
      require_auth_for_metrics_endpoint setting, matching LiteLLM's message shape.
    why: Auth failures must preserve the JSON format so clients that parse responses can detect
      them and optionally log the hint. Preserve LiteLLM's helpful message.

out_of_scope:
  - The per-request budget timeout or any budget-related work that calls metrics after the scrape
    completes. That is B3884's responsibility (refresh during the scrape, emit after).
  - Multiprocess-directory cleanup and worker-exit notifications. That is B3887's responsibility.
  - The Prometheus scrape protocol details beyond what prometheus_client.exposition module provides
    (encoder selection, content-type negotiation, gzip support).
  - Routes other than /metrics and /metrics/*. This task mounts only /metrics.

pitfalls:
  - Prometheus registry rendering is CPU-intensive for large metric sets. The worker thread must
    not panic or deadlock; use a timeout or cancellation token if needed. LiteLLM does not, so
    neither does this task.
  - Starlette's get_route_path matches the literal path without query parameters. A request to
    /metrics?name[]=foo has route_path = "/metrics", and "/metrics/cpu" has route_path = "/metrics/cpu".
    This matches LiteLLM's startswith check.
  - The restricted_registry(name_list) call filters metrics by name. An empty name_list gives the
    full registry; an unknown metric name filters to nothing, returning only TYPE and HELP lines.
  - Buffering ASGI messages can hold memory during auth; set a reasonable limit or stream the body
    for large payloads. LiteLLM buffers without a limit; betterlite may be tighter if needed.
    For now match LiteLLM's approach.
  - The multiprocess directory is a deployment detail; PROMETHEUS_MULTIPROC_DIR is read at mount
    time, not startup. Changing it at runtime requires remounting or restarting the worker; this
    task does not support hot reload of the multiprocess setting.

review_level: security
