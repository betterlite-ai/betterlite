  optional: []
  commands:
    - id: scrape-request-tests
      why: ScrapeRequest, parse_scrape_request, render_scrape or _chunks are missing or fail tests
      run: cargo nextest run --locked -p betterlite-prometheus --no-tests=fail -E 'test(/^scrape_request::/)'
    - id: coalesced-scrape-tests
      why: CoalescedScrapeRenderer tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-prometheus --no-tests=fail -E 'test(/^coalesced_scrape_renderer::/)'
    - id: auth-middleware-tests
      why: PrometheusAuthMiddleware tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_auth_middleware::/)'
    - id: mount-tests
      why: Prometheus endpoint mounting tests fail or do not exist
      run: cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^prometheus_mount::/)'
    - id: oracle-prometheus-scrape
      why: HTTP oracle cases for /metrics endpoint authentication and rendering fail
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(prometheus_scrape_)'

