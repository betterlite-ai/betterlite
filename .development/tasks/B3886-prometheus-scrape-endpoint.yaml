id: B3886
title: Prometheus metrics router and authentication
description: >-
  Build the main port's /metrics router and its auth middleware in crates/betterlite-server. B8680 installs the middleware and mounts the endpoint.

  The scrape itself is B10090's make_metrics_app in betterlite-prometheus (scrape_endpoint): content negotiation,
  repeated name[] selection, gzip, coalesced rendering and 64 KiB chunks all live there, and B3887's dedicated
  listener serves the same app. This task only calls it, and adds the auth in front of it.

  Implement PrometheusAuthMiddleware in betterlite-server. It runs only on HTTP requests
  to /metrics or paths starting with /metrics/ (checked with starlette's get_route_path).
  _is_metrics_route checks if the route path equals /metrics or starts with /metrics/;
  this is true for both /metrics and /metrics/my_metric but false for /metricsfoo.

  The middleware reads require_auth_for_metrics_endpoint from the config (via betterlite-config,
  default true). If false, the request passes through to the inner app without auth.
  If true, the middleware calls virtual_key_auth on the request. On auth
  failure, send a 401 with a JSON body containing the error message and a hint about
  the require_auth_for_metrics_endpoint setting. Important: buffer the incoming ASGI
  receive messages during auth (since virtual_key_auth reads the body) and replay
  them to the inner app if auth succeeds.

  Build the endpoint router as `metrics_router(registry: Arc<CollectorRegistry>, multiproc_dir: Option<&Path>) -> Result<axum::Router, MultiprocessError>` in prometheus_auth_middleware.rs (B3875's registry type; the caller passes `shared.prometheus_registry`).
  With a folder it builds B10095's MultiProcessCollector::new(dir) and nests B10090's `make_metrics_app(ScrapeSource::Multiprocess(..))`,
  so a folder that is empty text or not a directory fails the build with B10095's error, as LiteLLM's mount fails at startup.
  Without one it nests `make_metrics_app(ScrapeSource::Registry(registry))`, the registry B8655's prometheus arm registers B3875's
  collectors into. Either way the app sits at /metrics, so it serves /metrics and every path under /metrics/.
  The folder is an argument because betterlite-server reads no environment (rules.yaml): the caller passes the folder
  PROMETHEUS_MULTIPROC_DIR names whenever the variable is set, empty text included, and None when it is unset. B8680 merges metrics_router through app::edge::mount_public and installs PrometheusAuthMiddleware in
  app::edge::wrap, between the billable metrics layer and CORS as LiteLLM orders them; this task mounts and installs nothing.

  Oracle cases, which B8680 owns because it mounts the endpoint, with the real gateway and real proxy_server: every path under /metrics/,
  requests with correct/missing/wrong auth headers (the six header names LiteLLM reads),
  gzip requests and non-gzip requests, repeated name[] parameters with valid and unknown
  metric names, and the fast-path pass-through when auth is disabled. Compare Content-Type,
  Content-Encoding, response status and chunked transfer. No oracle helper; all cases call
  the real route.

scope:
  paths:
    - crates/betterlite-server/src/prometheus_auth_middleware.rs
    - crates/betterlite-server/src/prometheus_auth_middleware/tests.rs
    - tools/oracle/helpers/b3886.py
    - tools/oracle/helpers/b3886/**
    - tools/oracle/src/helpers/prometheus/b3886.rs
    - tools/oracle/src/helpers/prometheus/b3886/**
    - crates/betterlite-server/src/prometheus_auth_middleware/tests/**
  lint_tables: false

references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/prometheus_auth_middleware.py#L22-L24
    why: _is_metrics_route check with get_route_path and startswith logic
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/prometheus_auth_middleware.py#L41-L117
    why: PrometheusAuthMiddleware.__init__, __call__, auth check, buffering and replay
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4565-L4592
    why: _mount_metrics_endpoint with PROMETHEUS_MULTIPROC_DIR handling and app.mount

dod:
  - text: _is_metrics_route returns true for /metrics and /metrics/* paths but false for /metricsfoo.
    proof: [auth-middleware-tests]
  - text: PrometheusAuthMiddleware skips auth when require_auth_for_metrics_endpoint is false,
      and runs auth when it is true or unset (default true).
    proof: [auth-middleware-tests]
  - text: On auth failure, the middleware sends 401 with a JSON body containing the error message
      and a hint about the setting.
    proof: [auth-middleware-tests]
  - text: The middleware buffers ASGI receive messages during auth and replays them to the inner
      app if auth succeeds.
    proof: [auth-middleware-tests]
  - text: metrics_router renders B10095's MultiProcessCollector over the folder it is given, fails to build for an empty
      or non-directory folder, and otherwise renders the registry it was given, so collectors registered there show in the scrape.
    proof: [mount-tests]
  - text: The /metrics endpoint is mounted at /metrics and passes all oracle cases with correct
      Content-Type, Content-Encoding, status and response body.
    proof: [mount-tests]
  - text: The middleware and metrics_router are tested with tower's oneshot over a test Router; B8680 installs and mounts them and proves the HTTP answers with the oracle cases moved there.
    proof: [auth-middleware-tests, mount-tests]

checks:
  optional: []
  commands:
    - id: auth-middleware-tests
      why: PrometheusAuthMiddleware tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_auth_middleware::/)'
    - id: mount-tests
      why: Prometheus endpoint mounting tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^prometheus_auth_middleware::(.*::)?metrics_router/)'

oracle_cases: []

deviations:
  - what: The 401 response body when auth fails is application/json with a hint about the
      require_auth_for_metrics_endpoint setting, matching LiteLLM's message shape.
    why: Auth failures must preserve the JSON format so clients that parse responses can detect
      them and optionally log the hint. Preserve LiteLLM's helpful message.

out_of_scope:
  - The per-request budget timeout or any budget-related work that calls metrics after the scrape
    completes. That is B3884's responsibility (refresh during the scrape, emit after).
  - Multiprocess-directory cleanup and worker-exit notifications. That is B3887's responsibility.
  - "MultiProcessCollector, the .db file format and merge, and the ScrapeSource seam in make_metrics_app: B10095."
  - "Reading PROMETHEUS_MULTIPROC_DIR and passing the folder in: B8680, which mounts metrics_router."
  - "litellm/integrations/prometheus_metrics_endpoint.py (ScrapeRequest, parse_scrape_request, render_scrape,
    CoalescedScrapeRenderer, _chunks, make_metrics_asgi_app) and the text encoders behind it: B10090, whose make_metrics_app this task nests."
  - Routes other than /metrics and /metrics/*. This task builds only the /metrics router; B8680 mounts it.

pitfalls:
  - Starlette's get_route_path matches the literal path without query parameters. A request to
    /metrics?name[]=foo has route_path = "/metrics", and "/metrics/cpu" has route_path = "/metrics/cpu".
    This matches LiteLLM's startswith check.
  - Buffering ASGI messages can hold memory during auth; set a reasonable limit or stream the body
    for large payloads. LiteLLM buffers without a limit; betterlite may be tighter if needed.
    For now match LiteLLM's approach.
  - metrics_router never reads PROMETHEUS_MULTIPROC_DIR itself; LiteLLM tests only that the variable is in the environment,
    so an empty value still takes the multiprocess branch and fails, and the caller must pass Some for it rather than None.

review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
