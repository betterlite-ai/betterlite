id: B3886
title: Prometheus scrape rendering and authentication
description: >-
  Port prometheus scrape rendering and endpoint authentication to Rust in three parts:
  crates/betterlite-prometheus for ASGI rendering, crates/betterlite-server for auth
  middleware, and the integration point in crates/betterlite to mount the endpoint.

  The scrape endpoint serves /metrics and /metrics/* with content negotiation, repeated
  name[] parameter selection, gzip compression, coalesced rendering (sharing one render
  per distinct output across concurrent scrapes), and 64-KiB response chunks.

  Implement ScrapeRequest, a frozen dataclass carrying the encoder, content-type, gzip
  flag and filtered metric names that normalize header spellings and metric selection so
  that concurrent identical requests share one render. parse_scrape_request reads the
  Accept and Accept-Encoding headers and the repeated name[] query parameters to build
  a request. render_scrape applies the encoder to a registry (or a restricted view of it)
  and conditionally gzips the bytes.

  Build CoalescedScrapeRenderer, which holds a Prometheus registry and tracks in-flight
  render tasks keyed by ScrapeRequest. When render() is called with a request, it checks
  if that request is already rendering; if so, it returns the inflight future. If not, it
  spawns a worker-thread task, adds it to the inflight map, registers a callback to forget
  the task when done, and returns the future. _chunks splits a byte string into 64-KiB
  chunks for streaming.

  make_metrics_asgi_app takes a registry and returns an ASGI app that calls Request() on
  the ASGI scope and receive, calls parse_scrape_request on the headers and name[] params,
  renders the scrape, and streams the response back in chunks with the appropriate
  Content-Type and optional Content-Encoding: gzip header. The app does not handle
  authentication; that is the middleware's job.

  Implement PrometheusAuthMiddleware in betterlite-server. It runs only on HTTP requests
  to /metrics or paths starting with /metrics/ (checked with starlette's get_route_path).
  _is_metrics_route checks if the route path equals /metrics or starts with /metrics/;
  this is true for both /metrics and /metrics/my_metric but false for /metricsfoo.

  The middleware reads require_auth_for_metrics_endpoint from the config (via betterlite-config,
  default true). If false, the request passes through to the inner app without auth.
  If true, the middleware calls virtual_key_auth on the request. On auth
  failure, send a 401 with a JSON body containing the error message and a hint about
  the require_auth_for_metrics_endpoint setting. Important: buffer the incoming ASGI
  receive messages during auth (since virtual_key_auth reads the body) and replay
  them to the inner app if auth succeeds.

  Wire the endpoint into the betterlite binary. At startup, check PROMETHEUS_MULTIPROC_DIR;
  if set, create a new CollectorRegistry with MultiProcessCollector, otherwise use the
  global REGISTRY. Call make_metrics_asgi_app with the registry. Mount the ASGI app at
  /metrics on the main router using axum's mount. Add the auth middleware to the stack
  before the mount (or wrap the metrics app with the middleware).

  Oracle cases with the real gateway and real proxy_server: every path under /metrics/,
  requests with correct/missing/wrong auth headers (the six header names LiteLLM reads),
  gzip requests and non-gzip requests, repeated name[] parameters with valid and unknown
  metric names, and the fast-path pass-through when auth is disabled. Compare Content-Type,
  Content-Encoding, response status and chunked transfer. No oracle helper; all cases call
  the real route.

