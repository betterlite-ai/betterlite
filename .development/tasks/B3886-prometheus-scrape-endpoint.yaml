dod:
  - text: ScrapeRequest carries encoder, content_type, gzipped flag and metric_names as a frozen
      tuple, and two requests with the same values compare equal for deduplication.
    proof: [scrape-request-tests]
  - text: parse_scrape_request reads Accept and Accept-Encoding headers and name[] params,
      normalizing them to a ScrapeRequest.
    proof: [scrape-request-tests]
  - text: render_scrape calls the encoder on the registry or its restricted view, and gzips
      the bytes only when the request flags it.
    proof: [scrape-request-tests]
  - text: CoalescedScrapeRenderer.render shares one in-flight task across concurrent identical
      requests and forgets the task when it completes.
    proof: [coalesced-scrape-tests]
  - text: _chunks splits bytes into 64-KiB chunks for streaming.
    proof: [scrape-request-tests]
  - text: make_metrics_asgi_app returns an ASGI app that calls Request, parses the scrape,
      renders, and streams with correct Content-Type and optional Content-Encoding headers.
    proof: [oracle-prometheus-scrape]
  - text: _is_metrics_route returns true for /metrics and /metrics/* paths but false for /metricsfoo.
    proof: [auth-middleware-tests]
  - text: PrometheusAuthMiddleware skips auth when require_auth_for_metrics_endpoint is false,
      and runs auth when it is true or unset (default true).
    proof: [auth-middleware-tests]
  - text: On auth failure, the middleware sends 401 with a JSON body containing the error message
      and a hint about the setting.
    proof: [oracle-prometheus-scrape]
  - text: The middleware buffers ASGI receive messages during auth and replays them to the inner
      app if auth succeeds.
    proof: [auth-middleware-tests]
  - text: The binary creates a CollectorRegistry with MultiProcessCollector when PROMETHEUS_MULTIPROC_DIR
      is set, and uses the global REGISTRY otherwise.
    proof: [mount-tests]
  - text: The /metrics endpoint is mounted at /metrics and passes all oracle cases with correct
      Content-Type, Content-Encoding, status and response body.
    proof: [oracle-prometheus-scrape]
  - text: Concurrent scrapes with identical Accept/Accept-Encoding/name[] request the same render
      exactly once and share its bytes.
    proof: [oracle-prometheus-scrape]
  - text: Scrape responses stream in 64-KiB chunks when the body is larger than that.
    proof: [oracle-prometheus-scrape]

