checks:
  optional: []
  commands:
    - id: catalog-published
      why: the policy_templates.json file is missing the Canadian record, has invalid JSON, or the canadian-pii-protection record is corrupted or missing required fields and literal values
      run: |
        python3 << 'CATALOG_CHECK'
        import json
        with open('policy_templates.json', 'r') as f:
            templates = json.load(f)

        record = None
        for t in templates:
            if t.get('id') == 'canadian-pii-protection':
                record = t
                break

        assert record is not None, 'canadian-pii-protection record not found'

        required_fields = ['id', 'title', 'description', 'icon', 'iconColor',
                          'iconBg', 'guardrails', 'complexity', 'guardrailDefinitions', 'templateData',
                          'tags', 'estimated_latency_ms']
        for field in required_fields:
            assert field in record, f'missing field: {field}'

        assert 'example_sentences' not in record, 'example_sentences should not be in published record'

        assert isinstance(record['guardrails'], list) and len(record['guardrails']) == 6, 'guardrails count wrong'
        assert isinstance(record['guardrailDefinitions'], list) and len(record['guardrailDefinitions']) == 6, 'guardrailDefinitions count wrong'
        assert isinstance(record['tags'], list) and len(record['tags']) == 4, 'tags count wrong'

        assert record['id'] == 'canadian-pii-protection', 'id value corrupted'
        assert record['title'] == 'Canadian PII Protection (PIPEDA)', 'title value corrupted'
        assert 'PIPEDA' in record['description'], 'description value corrupted'
        assert record['tags'] == ['PII Protection', 'Canada', 'PIPEDA', 'FIPPA'], 'tags values corrupted'
        assert record['icon'] == 'ShieldCheckIcon', 'icon value corrupted'
        assert record['iconColor'] == 'text-red-500', 'iconColor value corrupted'
        assert record['iconBg'] == 'bg-red-50', 'iconBg value corrupted'
        assert record['complexity'] == 'Medium', 'complexity value corrupted'
        assert record['estimated_latency_ms'] == 1, 'estimated_latency_ms not 1'
        assert record['templateData']['policy_name'] == 'canadian-pii-protection', 'policy_name corrupted'

        guardrail_names = [g['guardrail_name'] for g in record['guardrailDefinitions']]
        expected_names = ['ca-pii-government-identifiers', 'ca-pii-health-drivers', 'ca-pii-immigration',
                         'ca-pii-financial', 'ca-pii-contact-information', 'ca-pii-institutional-ids']
        assert guardrail_names == expected_names, f'guardrail names corrupted or reordered: {guardrail_names}'

        for guardrail in record['guardrailDefinitions']:
            assert 'guardrail_name' in guardrail, 'guardrail missing name'
            assert 'litellm_params' in guardrail, 'guardrail missing litellm_params'
            assert 'pattern_redaction_format' in guardrail['litellm_params'], 'pattern_redaction_format missing'
            assert guardrail['litellm_params']['pattern_redaction_format'] == '[{pattern_name}_REDACTED]', 'redaction format wrong'

        print('Canadian PII record valid and complete')
        CATALOG_CHECK
    - id: catalog-backup
      why: the litellm/policy_templates_backup.json file is missing the Airline record, has invalid JSON, or the airline-passenger-data-protection-uae record is corrupted or missing required fields and literal values
      run: |
        python3 << 'CATALOG_CHECK'
        import json
        with open('litellm/policy_templates_backup.json', 'r') as f:
            templates = json.load(f)

        record = None
        for t in templates:
            if t.get('id') == 'airline-passenger-data-protection-uae':
                record = t
                break

        assert record is not None, 'airline-passenger-data-protection-uae record not found'

        required_fields = ['id', 'title', 'description', 'example_sentences', 'icon', 'iconColor',
                          'iconBg', 'guardrails', 'complexity', 'guardrailDefinitions', 'templateData',
                          'tags', 'estimated_latency_ms']
        for field in required_fields:
            assert field in record, f'missing field: {field}'

        assert isinstance(record['example_sentences'], list) and len(record['example_sentences']) == 4, 'example_sentences wrong'
        assert isinstance(record['guardrails'], list) and len(record['guardrails']) == 4, 'guardrails count wrong'
        assert isinstance(record['guardrailDefinitions'], list) and len(record['guardrailDefinitions']) == 4, 'guardrailDefinitions count wrong'
        assert isinstance(record['tags'], list) and len(record['tags']) == 3, 'tags count wrong'

        assert record['id'] == 'airline-passenger-data-protection-uae', 'id value corrupted'
        assert record['title'] == 'Airline Passenger Data Protection (UAE)', 'title value corrupted'
        assert 'passenger' in record['description'].lower(), 'description value corrupted'
        assert record['tags'] == ['PII Protection', 'Aviation', 'UAE'], 'tags values corrupted'
        assert record['icon'] == 'ShieldCheckIcon', 'icon value corrupted'
        assert record['iconColor'] == 'text-emerald-500', 'iconColor value corrupted'
        assert record['iconBg'] == 'bg-emerald-50', 'iconBg value corrupted'
        assert record['complexity'] == 'High', 'complexity value corrupted'
        assert record['estimated_latency_ms'] == 1, 'estimated_latency_ms not 1'
        assert record['templateData']['policy_name'] == 'airline-passenger-data-protection-uae', 'policy_name corrupted'

        expected_examples = ['Look up PNR ABC123 for passenger Ahmed Al Maktoum',
                           'My Skywards number is EK123456789',
                           'Booking reference XY7890 with Emirates ID 784-1985-1234567-1',
                           'Passenger passport number is A12345678']
        assert record['example_sentences'] == expected_examples, 'example_sentences values corrupted'

        guardrail_names = [g['guardrail_name'] for g in record['guardrailDefinitions']]
        expected_names = ['airline-pnr-skywards-pii', 'airline-passport-multinational',
                         'airline-payment-financial', 'airline-contact-info-uae']
        assert guardrail_names == expected_names, f'guardrail names corrupted or reordered: {guardrail_names}'

        for guardrail in record['guardrailDefinitions']:
            assert 'guardrail_name' in guardrail, 'guardrail missing name'
            assert 'litellm_params' in guardrail, 'guardrail missing litellm_params'
            assert 'pattern_redaction_format' in guardrail['litellm_params'], 'pattern_redaction_format missing'
            assert guardrail['litellm_params']['pattern_redaction_format'] == '[{pattern_name}_REDACTED]', 'redaction format wrong'

        print('Airline Passenger record valid and complete')
        CATALOG_CHECK
oracle_cases: []
deviations: []
out_of_scope:
  - The loading code for these records. B3252 loads the airline passenger record from the backup via _load_policy_templates_from_local_backup; B3253 fetches the Canadian record from the remote published catalog via get_policy_templates. Each task owns the loading path for its record ownership.
  - Guardrail implementations or pattern definitions referenced by these templates. The records define policy patterns and metadata only.
  - Other policy templates in either catalog file. Those are owned by other catalog tasks.
  - The catalog difference itself (Canadian in published only, airline in backup only) is preserved as-is, not normalized or reconciled across files.
pitfalls:
  - >-
    The catalog split is permanent: canadian-pii-protection belongs exclusively in policy_templates.json and must not be added to the backup file; airline-passenger-data-protection-uae belongs exclusively in litellm/policy_templates_backup.json and must not be added to the published root.
  - The Airline record in the backup includes example_sentences (four sentences for PNR/Skywards/booking reference/passport lookups). The Canadian record in the published catalog does not include this field—a structural difference between backup and published, not a missing value to add.
  - >-
    Each guardrailDefinitions entry must include the complete litellm_params block with guardrail, mode, patterns array with pattern_type, pattern_name and action, and pattern_redaction_format. Do not omit or shorten these.
  - The Canadian record has six guardrails; the Airline record has four. Preserve the correct count for each.
  - >-
    Both catalog files must be valid JSON; B3252 returns an empty list when the backup is not found but raises on malformed JSON, while B3253 falls back to the local backup if the remote fetch fails.
review_level: standard
