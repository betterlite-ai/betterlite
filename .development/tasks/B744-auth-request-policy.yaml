id: B744
title: Caller-controlled request field safety
description: >-
  Implement pre-DB request checks in source order: request size, RequestBodySafety, client IP allowlist,
  then proxy allowed_routes. Own invalid-virtual-key error provenance markers and _get_request_ip_address
  for auth diagnostics. Honor the source use_x_forwarded_for switch and configured size limits; no downloading
  is introduced.


  Build the production auth_request_policy module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  is_invalid_virtual_key_error (L41-L58; 15 source lines), mark_invalid_virtual_key_error (L61-L75; 15
  source lines), _get_request_ip_address (L78-L87; 9 source lines), _check_valid_ip (L90-L108; 14 source
  lines), pre_db_read_auth_checks (L562-L618; 46 source lines), check_if_request_size_is_safe (L840-L898;
  45 source lines), check_response_size_is_safe (L901-L939; 30 source lines), bytes_to_mb (L942-L946;
  5 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.allowed_ips=None;
  general_settings.use_x_forwarded_for=False; general_settings.max_request_size_mb=None; general_settings.max_response_size_mb=None;
  general_settings.allowed_routes=required when this branch is enabled; allowed_ips=None; use_x_forwarded_for=False;
  max_request_size_mb=None; max_response_size_mb=None.


  general_settings.allowed_ips=None, allowed_routes absent, use_x_forwarded_for=false; max_request_size_mb=None
  and max_response_size_mb=None. configured allowed_routes still gates traffic when LiteLLM logs its premium
  warning.


  Add the auth_request_policy operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-request-policy-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::auth_request_policy::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 179 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  179 production, 142 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 501 changed lines estimated within a 525-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_license_checks_and_paid_tier_quotas_are_absent_the_mit_behavior_is_ava,
  native_request_supplied_upstream_api_base_base_url_and_url_valued_fallback_de. Exercise the precise
  changed setting/output branch and assert its configured status/error/side effects; do not add these
  differing results to oracle equality cases.


  Server wiring tests live under betterlite-server::auth::auth_request_policy::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
