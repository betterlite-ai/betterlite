dod:
  - text: 'Policy cases name size_before_body_safety, body_before_ip, ip_before_routes,
      allowed_ips_none_skips_ip, empty_ip_list_denies, forwarded_header_entire_value,
      forwarded_empty_value, forwarded_toggle_exact_true, client_host_fallback,
      no_client_empty_ip, routes_absent_vs_empty, exact_route_no_wildcards and route_miss_logs.
      HTTP cases compare IP/route 403 auth_error and confirm no database read.'
    proof:
      - behavior-tests
  - text: 'Size and marker cases name no_size_limit, mb_is_1048576, header_prevents_body_read,
      empty_header_reads_body, equal_size_allowed, positive_size_zero_limit,
      negative_limit_not_clamped, source_invalid_length_error,
      only_supported_error_classes, code_precedes_status, string_401_matches,
      marker_exact_true, message_cannot_mark_error, unmarked_same_error,
      non401_same_error, marked_copy_headers and marked_openai_code_string.
      MIT HTTP cases assert the request/response license warnings; native cases assert enabled limits.'
    proof: [behavior-tests, oracle, helper-python]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: 'Native behavior tests size_checks_without_license, no_route_license_diagnostic and
      response_wire_byte_limit prove the declared license/response-size differences.'
    proof:
      - behavior-tests
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth -p betterlite-server -p betterlite-config --no-tests=fail -E 'test(/^(auth::)?auth_request_policy::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_request_policy.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-request-policy-*")"
        && grep -rlq "auth_request_policy" tools/oracle/fuzz/corpus/helper_case/auth-request-policy-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_request_policy::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-request-policy-*")"
        && grep -rlq "allowed_ips" crates/betterlite-config/fuzz/corpus/config_yaml/auth-request-policy-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::auth_request_policy::tests::/)
        - test(/replays_the_/)'
