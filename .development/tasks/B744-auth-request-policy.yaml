deviations:
  - what: License checks and paid-tier quotas are absent; the MIT behavior is available without a premium_user
      entitlement.
    why: README Decisions specifies no paid tier and no user/team cap.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L41-L618
  - what: Request-supplied upstream api_base/base_url and URL-valued fallback destinations are rejected
      with a typed 400 even when client-side destination overrides were enabled in LiteLLM.
    why: The bounded-inputs rule allows upstream destinations from operator configuration only; B009 owns
      the shared URL boundary.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L477-L539
