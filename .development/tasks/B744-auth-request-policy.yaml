id: B744
title: Caller-controlled request field safety
description: >-
  Run pre-DB checks in this order: request size, B884 is_request_body_safe with request_data.model or
  empty string, exact IP membership, then exact route membership. The first rejection prevents all
  later checks and database reads. allowed_ips=None permits without resolving the client IP; []
  denies everyone. use_x_forwarded_for must be exactly true to use the entire x-forwarded-for header,
  including commas/whitespace/empty string, without parsing CIDRs or choosing the first hop. Otherwise
  use request.client.host or empty string. An IP miss is HTTP 403 with its forbidden-IP detail.
  If allowed_routes is present, test exact membership (no group/wildcard expansion); a miss logs
  ERROR and raises HTTP 403. LiteLLM logs its license ERROR but still enforces this list; betterlite
  omits only that entitlement diagnostic. B757 translates both denials to auth_error, param string
  None, code string 403. B884's own body-safety failures retain their types/statuses.

  Request size is disabled when max_request_size_mb is None. Source without premium warns and skips;
  betterlite enables the MIT check without a license. Compare bytes divided by 1048576 to the limit
  with a strict greater-than test. Prefer a nonempty content-length integer header over reading the
  body; absent/empty header uses actual body bytes. Equality passes, zero/negative limits are not
  clamped, and no body is read for a usable header. Invalid integer conversion propagates in source;
  B003/B009 own rejection of malformed HTTP framing before this stage. A size failure is ProxyException
  400 bad_request_error, param content-length and code 400. The native response-size policy uses
  serialized response bytes as the explicit deviation below; source uses sys.getsizeof(response),
  which is shallow Python object memory rather than wire length. No response-size path is dead code:
  common_request_processing.py L2970 calls it.

  Invalid-key classification accepts only HTTPException or ProxyException, gives a nonnull code
  precedence over status_code, compares its string form to '401', and requires the internal marker
  to be exactly True. Never classify by message text. Marking returns the same error when disabled
  or not 401; otherwise build a distinct ProxyException preserving message/type/param/code, copy
  headers, stringify a nonnull openai_code, preserve provider_specific_fields and set the marker.
  Caller-owned exceptions and their header map must remain unmodified.


  Build the production auth_request_policy module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  is_invalid_virtual_key_error (L41-L58; 15 source lines), mark_invalid_virtual_key_error (L61-L75; 15
  source lines), _get_request_ip_address (L78-L87; 9 source lines), _check_valid_ip (L90-L108; 14 source
  lines), pre_db_read_auth_checks (L562-L618; 46 source lines), check_if_request_size_is_safe (L840-L898;
  45 source lines), check_response_size_is_safe (L901-L939; 30 source lines), bytes_to_mb (L942-L946;
  5 source lines).


  Load only general_settings.allowed_ips=None, use_x_forwarded_for=False,
  max_request_size_mb=None, max_response_size_mb=None and absent allowed_routes. These settings have
  no dedicated environment names and are not also accepted at the YAML root.


  general_settings.allowed_ips=None, allowed_routes absent, use_x_forwarded_for=false; max_request_size_mb=None
  and max_response_size_mb=None. configured allowed_routes still gates traffic when LiteLLM logs its premium
  warning.


  Add the auth_request_policy operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-request-policy-*
  seed to B171 helper_case, which already owns this decoder.


  Use booted POST /v1/chat/completions for pre-DB rejection, forwarded-IP and size checks, comparing
  the full source error envelope and proving no key read or provider call follows a rejection.


  Pure IP/provenance helpers use in-memory request fixtures. No database fixture is needed to prove
  this stage precedes database access; use a key-read collaborator that fails if invoked.


  Config tests policy_defaults, exact_ip_and_route_lists, forwarded_header_toggle and
  fractional_zero_negative_limits load B002 and invoke production policy. Do not assert a fictitious
  invalid-value fallback. The helper oracle covers IP/marker/byte arithmetic projections only;
  checks reading proxy_server globals run as HTTP cases. No database fixture is needed for pre-DB rejection.


  B003 owns request bytes and B002 owns settings decoding. Native byte-size accounting and license
  removal have explicit tests below; neither should silently alter equal IP/provenance cases.


  Sizing: 179 source lines; allow 180 production, 270 tests, 75 adapters, 65 wiring and 65 config
  lines, 655 within 725. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native tests size_checks_without_license, no_route_license_diagnostic and response_wire_byte_limit
  prove the differences; the equality corpus asserts MIT warnings and skips instead of forcing premium_user.


  Server wiring tests live under betterlite-server::auth::auth_request_policy::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
