deviations:
  - what: Configured size limits run without a license and can return 400 bad_request_error, param content-length; allowed_routes keeps its 403 policy without the license ERROR log.
    why: README Decisions enables MIT premium_user branches; size_checks_without_license and no_route_license_diagnostic cover both effects.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L605-L618
  - what: max_response_size_mb measures serialized UTF-8 response bytes and returns 400 bad_request_error, param content-length, when exceeded.
    why: Rust has no meaningful Python sys.getsizeof response-object footprint; response_wire_byte_limit makes this observable unit explicit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L919-L937
