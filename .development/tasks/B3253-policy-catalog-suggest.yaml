deviations:
  - what: A remote body that is valid JSON but not an array (an object, a string) falls back to the local records.
    why: LiteLLM declares `-> list` and FastAPI would fail response validation with a 500; the fallback is the behavior its own docstring promises.
  - what: LITELLM_LOCAL_POLICY_TEMPLATES is read once at server start, not on each request.
    why: betterlite reads its environment into typed settings at start; LiteLLM re-reads os.getenv per call, which only differs when the environment changes while running.
  - what: The 18 local records come from embedded fragments (B3252) and the 16 published records exist only as a test fixture.
    why: A binary has no source tree next to it, and the remote file is fetched at run time, so there is nothing to embed for production.
  - what: A model failure in the suggest route is answered with the shared 500 internal-error response.
    why: LiteLLM re-raises the provider exception and the proxy picks a status from the exception type; betterlite has no provider exception classes here (open question in notes).

out_of_scope:
  - "_load_policy_templates_from_local_backup (L610-L623) is B3252's local_templates; this task calls it."
  - "apply_policies, validate, list, info and match routes (L67-L605) are B3250's and B3251's."
  - "The enrich routes, _build_refinement_prompt and the competitor builders (L667-L1084) are B3252's."
  - "test_policy_template and _test_guardrail_definitions (L1123-L1265) are B3249's."
  - "ai_policy_suggester.py has no other function than the three ported here (suggest, _build_system_prompt, _build_user_prompt)."
  - "The production implementation of PolicySuggestModel (the dispatcher call behind litellm.acompletion) is B8665's `SdkSuggestModel`."

pitfalls:
  - "A 200 answer from GitHub is returned as it is, so an empty array `[]` reaches the client; only failures fall back, not emptiness."
  - "The fallback uses the 18 local records, which carry example_sentences and `guardrails`, while the fetched published records carry `guardrails_add`, so the two lists differ in shape and a test must not treat them as equal."
  - "A plain non-200 status falls back silently; only exceptions get the `Failed to fetch policy templates from GitHub, using local backup` debug line."
  - "The suggester reads only the local records and never the remote catalog, so a template that exists only on GitHub can never be suggested (its id would be filtered out)."
  - "`model` is tested for truthiness, so an empty string means the default `gpt-4o-mini`; the provider split uses the first `/` only, so `openrouter/openai/gpt-4o` has provider `openrouter`."
  - "A model with an unknown parameter list (none) is allowed through; only a known list without `tools` is refused with 400."
  - "The 400 for missing tool support is raised before the try block in LiteLLM, so it is not logged as `AI policy suggestion failed`."
  - "`selected_templates` is set to an empty array when missing, after other keys, so `explanation` stays first in the output object."
  - "The example attacks in the system prompt are wrapped in plain double quotes without escaping, so an example holding a quote is copied raw."
  - "The user prompt numbers examples after dropping blank ones, so the numbers have no gaps, and the description line starts with a newline that follows the join newline."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
