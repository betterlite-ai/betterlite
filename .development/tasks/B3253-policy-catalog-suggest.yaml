dod:
  - text: >-
      GET /policy/templates with LITELLM_LOCAL_POLICY_TEMPLATES set to true, 1 or yes (any case, spaces trimmed) returns the 18 local records in order without a network call,
      and a false or unset value does not.
    proof: [catalog-route-tests]
  - text: >-
      GET /policy/templates returns a 200 remote body as served (an empty array included) and returns the local records on a transport error, a deadline, a non-200 status,
      invalid JSON or a body that is not an array.
    proof: [catalog-route-tests]
  - text: >-
      The published fixture holds the 16 remote records in the remote file's order and is compiled only under the `fixtures` feature.
    proof: [fixture-tests]
  - text: >-
      The tool JSON, the system prompt and the user prompt equal LiteLLM's text, including the `none` placeholder, the dropped empty examples, the numbering and the untrimmed description.
    proof: [suggester-tests, oracle, helper-python]
  - text: >-
      filter_selection keeps only entries with a known template_id, sets a missing selected_templates to an empty array, keeps extra keys and rejects a non-object result.
    proof: [suggester-tests, oracle, helper-python]
  - text: >-
      POST /policy/templates/suggest answers 400 validation_error for a model whose supported parameters lack tools, answers the fixed no-match body when the reply has no tool call,
      answers the filtered selection otherwise, and returns a logged internal error on a model failure or bad arguments.
    proof: [catalog-route-tests]
  - text: >-
      The suggest body decoder applies the defaults, rejects wrong shapes with the shared 422 without panicking and has committed corpus inputs.
    proof: [suggest-corpus, catalog-route-tests]
  - text: The handlers are tested with tower's oneshot over the module's own Router and fake ports. B8790 mounts the routes and owns their HTTP oracle cases, so write no HTTP case here.
    proof: [catalog-route-tests]
checks:
  optional: []
  commands:
    - id: suggester-tests
      why: a prompt builder, the tool JSON or the selection filter is missing or differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^policy_suggester::.*tests::/)'
    - id: fixture-tests
      why: the published fixture is missing, out of order or not feature gated
      run: cargo nextest run --locked -p betterlite-policy --features fixtures --no-tests=fail -E 'test(/^published_fixture::.*tests::/)'
    - id: catalog-route-tests
      why: the catalog route, its fallbacks, the suggest route, its fake-client behavior or the body decoder is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_catalog_routes::/) - test(replays_the_suggest_request_corpus)'
    - id: suggest-corpus
      why: the suggest body decoder has no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/suggest_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_suggest_request_corpus)'
    - id: helper-python
      why: the Python oracle helper adapter for this task fails strict Python checks
      run: test -f tools/oracle/helpers/b3253.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
