id: B8400
title: Proxy utility checks, projected spend and SMTP email
description: >-
  Port the small utils.py functions that proxy_server.py and the management routes call, and the SMTP sender that budget and invitation emails use. Code goes in crates/betterlite-server/src/proxy_helpers.rs and proxy_helpers/ (checks.rs, projected.rs, tests.rs), and crates/betterlite-logging/src/smtp_send.rs and smtp_send/ (the logging crate, so B4022's budget_email can call it), with the SMTP settings in a config section crates/betterlite-config/src/sections/smtp_transport.rs.

  checks.rs. `error_message_str(err)` is `get_error_message_str` (L8128-L8145): an HTTP error gives its text detail, its map detail as JSON, else a message attribute (text or JSON); anything else gives its text. `check_team_models(team_id, team_config, request_data)` is `_is_valid_team_configs` (L7995-L8006): with all three present and `models` in the team config, a request model not in that list fails with "Invalid model for team {team_id}: {model}.  Valid models for team are: {models}\n" (two spaces, as LiteLLM writes it), and the models key is removed from the config. `premium_user_check(premium_user, feature)` is `_premium_user_check` (L8240-L8257): HTTP 403 `{"error": "This feature is only available for LiteLLM Enterprise users: {feature}. {not_premium_user}"}`, without the feature part when none is given. `prisma_client_or_throw(db, message)` is `get_prisma_client_or_throw` (L8369-L8377): HTTP 500 `{"error": message}` when there is no database.

  projected.rs. `month_end_date(today)`, `is_projected_spend_over_limit(spend, soft_limit, today)` and `projected_spend_over_limit(spend, soft_limit, today)` (L7930-L7992). The daily rate is the spend itself on the first day of the month, else spend divided by (day minus 1); projection adds the rate times the days left to the month end. The second returns the projected spend and the date the limit is reached: today when the rate is 0 or less or nothing is left, else today plus remaining budget divided by rate days. `today` is passed in so tests do not depend on the clock.

  smtp_send.rs. `send_email(settings, receiver, subject, html)` (L7012-L7116): fails with "Trying to use SMTP, but SMTP_SENDER_EMAIL is not set", then the receiver, subject and HTML checks with LiteLLM's messages, then "Trying to use SMTP, but SMTP_HOST is not set". Implicit TLS is used for port 465 or SMTP_USE_SSL exactly "True"; otherwise STARTTLS unless SMTP_TLS is exactly "False"; login only when both username and password are set; the send runs off the async runtime with SMTP_TIMEOUT. A send error is logged as "An error occurred while sending the email:{e}" and not returned, as LiteLLM does. Use the `lettre` crate for the SMTP client. Section `smtp_transport`: SMTP_HOST, SMTP_PORT (587), SMTP_USERNAME, SMTP_PASSWORD, SMTP_SENDER_EMAIL, SMTP_USE_SSL ("False"), SMTP_TLS ("True") and SMTP_TIMEOUT (30); the password is a secret and never logged.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-logging/Cargo.toml
    - crates/betterlite-server/src/proxy_helpers.rs
    - crates/betterlite-server/src/proxy_helpers/**
    - crates/betterlite-logging/src/smtp_send.rs
    - crates/betterlite-logging/src/smtp_send/**
    - crates/betterlite-config/src/sections/smtp_transport.rs
    - crates/betterlite-config/src/sections/smtp_transport/**
    - tools/oracle/cases/helpers/proxy-helpers/**
    - tools/oracle/helpers/b8400.py
    - tools/oracle/helpers/b8400/**
    - tools/oracle/src/helpers/logging/b8400.rs
    - tools/oracle/src/helpers/logging/b8400/**
  lint_tables: false
references:
