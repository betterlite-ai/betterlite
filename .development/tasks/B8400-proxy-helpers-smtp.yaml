dod:
  - text: error_message_str, check_team_models, premium_user_check and prisma_client_or_throw answer with LiteLLM's text and status.
    proof: [helpers-tests, oracle]
  - text: Projected spend uses LiteLLM's daily rate and reaches-limit date, including the first day of the month and December.
    proof: [helpers-tests, oracle]
  - text: send_email checks its settings in LiteLLM's order, picks implicit TLS or STARTTLS by the same rules, and logs a send error without returning it.
    proof: [smtp-tests]
  - text: The smtp_transport section reads every SMTP env var with LiteLLM's default.
    proof: [config-tests]
checks:
  optional: []
  commands:
    - id: helpers-tests
      why: a proxy check or projected spend function is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^proxy_helpers::/)'
    - id: smtp-tests
      why: the SMTP sender's checks or TLS choice is missing or wrong
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^smtp_send::/)'
    - id: config-tests
      why: an SMTP setting is not read or has the wrong default
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::smtp_transport::/)'
oracle_cases:
  - tools/oracle/cases/helpers/proxy-helpers/error-message-str.yaml
  - tools/oracle/cases/helpers/proxy-helpers/team-model-check.yaml
  - tools/oracle/cases/helpers/proxy-helpers/month-end-date.yaml
deviations:
  - what: Projected spend takes today's date as an argument.
    why: Tests need a fixed date; callers pass the server's local date, as date.today() does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L7936-L7992
out_of_scope:
  - "Budget, invitation and alert email content: B4022 and B4023. Key format checks: B783. Root path and custom URL helpers: B2302, B4200 and B7323."
pitfalls:
  - lettre's default features pull native-tls, and deny.toml bans it. Turn the defaults off and enable lettre's rustls and tokio features; `cargo deny --locked check` proves the set.
  - SMTP_USE_SSL and SMTP_TLS compare to the exact strings "True" and "False", so "true" does not turn implicit TLS on.
  - check_team_models removes models from the team config even when the model is allowed.
  - The sender check runs before the host check, so a missing SMTP_SENDER_EMAIL is reported even when SMTP_HOST is also missing.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
