dod:
- text: >-
    Every provider row of `validate_environment` gives LiteLLM's `keys_in_environment` and `missing_keys` with its names
    present and absent, including rows where one of several names is enough.
  proof: [provider-rows, oracle, helper-python]
- text: >-
    A model with no resolved provider goes through the model-set chain and gets LiteLLM's answer, and no model gives false
    and an empty list.
  proof: [model-set-rows, oracle, helper-python]
- text: Passing `api_key` or `api_base` removes the matching missing names as LiteLLM does.
  proof: [missing-key-filter, oracle, helper-python]
- text: >-
    `valid_model` and `check_valid_key` send LiteLLM's calls through `ModelProbe`, `check_valid_key` returns false on any
    failure, and `valid_model` gives BadRequestError with an empty message.
  proof: [key-probes, oracle, helper-python]
- text: '`get_provider_fields` tags and `read_config_args` errors behave as in the source.'
  proof: [provider-fields-config]
- text: >-
    `_should_retry`, header parsing and `_calculate_retry_after` match LiteLLM for fixed inputs, including a header of 0,
    a header of 61, an HTTP date and a missing header.
  proof: [retry-timing, oracle, helper-python]
- text: New helper corpus seeds call `b5364` and replay through the shared parser.
  proof: [helper-case-corpus]
checks:
  optional: []
  commands:
  - id: provider-rows
    why: A provider row is missing or asks for the wrong names.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^environment_validation::.*provider_row/)'
  - id: model-set-rows
    why: The chain for models with no provider differs.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^environment_validation::.*model_set/)'
  - id: missing-key-filter
    why: Passed arguments don't clear the matching names.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^environment_validation::.*missing_filter/)'
  - id: key-probes
    why: A probe failure leaks through or the call differs.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^environment_validation::.*probe/)'
  - id: provider-fields-config
    why: The field tags or the file read are wrong.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^environment_validation::.*(provider_fields|config_args)/)'
  - id: retry-timing
    why: A retry status, the header limit or the backoff box is wrong.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^retry_after::/)'
  - id: helper-python
    why: Strict Python checks must pass on a real b5364 adapter.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5364)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers/b5364 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5364/pyrightconfig.json
  - id: helper-case-corpus
    why: The operation needs at least one parsing seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/environment_validation-*")"
      && grep -lE '^[[:space:]]+b5364:' tools/oracle/fuzz/corpus/helper_case/environment_validation-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/environment-validation/provider-rows.yaml
- tools/oracle/cases/helpers/environment-validation/model-set-rows.yaml
- tools/oracle/cases/helpers/environment-validation/missing-key-filter.yaml
- tools/oracle/cases/helpers/environment-validation/key-probes.yaml
- tools/oracle/cases/helpers/environment-validation/retry-status.yaml
- tools/oracle/cases/helpers/environment-validation/retry-after-header.yaml
- tools/oracle/cases/helpers/environment-validation/backoff.yaml
deviations:
- what: Env names, model sets, the retry constants and the random number come in as arguments.
  why: The inject-dependencies rule keeps env reads in the config crate and bars globals, and a fixed random number makes the backoff testable.
out_of_scope:
- >-
  `load_test_model` L6625-L6665 and `create_proxy_transport_and_mounts` L6684-L6706 are not built: no caller at the pin.
- >-
  Wiring `ModelProbe` to a real completion and the Python names for these functions are B158 and B166. The field lists
  behind `get_provider_fields` belong to the Databricks, Ollama and Foundry provider tasks.
- Retry loops that call `_calculate_retry_after` are the router's and B5368's. The rest of litellm/utils.py is in the B157 inventory.
pitfalls:
- >-
  Python tests `"NAME" in os.environ`, so a name set to an empty string counts as present. Don't add an emptiness check,
  and don't read values at all.
- The model-set chain is an if and elif ladder with an order. A model in two sets takes the first row.
- '`retry_after` of 0 and of -1 both fall through to backoff: the test is `0 < retry_after <= 60`.'
- A wait comes back as int or float in Python. Return `f64` and compare with a small tolerance in the helper.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
