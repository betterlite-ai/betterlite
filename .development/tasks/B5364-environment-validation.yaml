id: B5364
title: Environment validation, key checks and retry timing
description: >-
  `validate_environment` answers "which env names does this model still need?". A Python user calls it before a request,
  and the proxy uses it for setup pages. Build it in `crates/betterlite-core/src/environment_validation.rs` with the small
  helpers around it, and put the retry timing helpers in `crates/betterlite-core/src/retry_after.rs`.


  `validate_environment` (L6709-L7128) takes the model, `api_key` and `api_base` as LiteLLM does, plus two injected
  values: the set of env names that exist, as `&BTreeSet<String>`, and B5361's `ProviderModelSets`. It never reads the
  process environment and never sees a value. It returns a struct with `keys_in_environment` and `missing_keys`. No model
  gives false and an empty list. A failing `get_llm_provider` (B174) leaves the provider unset and the function moves to
  the model-set chain. With a provider it walks the provider rows; each row is a list of required names, and some rows
  accept any one of several names (ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN; the AWS rows also accept AWS_PROFILE or
  AWS_CONTAINER_CREDENTIALS_FULL_URI). Keep the rows in a table of a closed `RequiredEnv` enum. When `api_key`, `api_base`
  or an API version argument was passed, the matching names are removed from the missing list by a case-insensitive
  substring test on "api_key", "api_base" and "api_version". An empty missing list gives `keys_in_environment` true.


  `get_provider_fields` (L6668-L6681) returns a closed tag for databricks, ollama and azure_ai and `None` for other
  providers, because the field lists live in provider crates above this one.


  `valid_model` (L7135-L7144) and `check_valid_key` (L7147-L7165) make a live call. Put that behind a trait
  `ModelProbe` with a method for the OpenAI model lookup and one for a completion, so B158 can wire the real call later.
  `valid_model` looks up OpenAI chat and text models and sends "Hello World" for others, and any failure becomes
  BadRequestError with an empty message and provider. `check_valid_key` sends "Hey, how's it going?" with `max_tokens` 10
  and returns false on any failure. The key is a `SecretString`.


  `read_config_args` (L7477-L7488) reads a JSON file and returns its object. It's called from `litellm/main.py`.


  `retry_after` holds `_should_retry` (L7168-L7194: 408, 409, 429 and 500 and up),
  `_get_retry_after_from_exception_header` (L7197-L7228: an integer or an HTTP date, -1 otherwise) and
  `_calculate_retry_after` (L7231-L7254). A header wait above 0 and up to 60 wins, with jitter added. Otherwise the wait is
  `INITIAL_RETRY_DELAY * 2^(max_retries - remaining_retries)`, raised to `min_timeout`, capped at `MAX_RETRY_DELAY`, plus
  jitter. Pass the three constants (defaults 0.5, 8.0 and 0.75 at litellm/constants.py L495-L497) in a `RetryTiming`
  struct, and pass the random number in the unit range as an argument, so a test and the oracle can pin it.


  The oracle operation is `b5364`. Its Python adapter patches `os.environ` to the fixture names with `clear=True`, patches
  `litellm.completion` for the key checks and patches `random.random` for backoff.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/environment_validation.rs
  - crates/betterlite-core/src/environment_validation/**
  - crates/betterlite-core/src/retry_after.rs
  - crates/betterlite-core/src/retry_after/**
  - tools/oracle/cases/helpers/environment-validation/**
  - "tools/oracle/fuzz/corpus/helper_case/environment_validation-*"
  - tools/oracle/helpers/b5364.py
  - tools/oracle/helpers/b5364/**
  - tools/oracle/src/helpers/core_ops/b5364.rs
  - tools/oracle/src/helpers/core_ops/b5364/**
  lint_tables: false
