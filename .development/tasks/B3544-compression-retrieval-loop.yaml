- tools/oracle/cases/helpers/compression-retrieval-loop/plan-request-patch.yaml

deviations:
- what: Extraction reads only the JSON-object form of response content blocks. LiteLLM also has a branch for SDK objects that rebuilds thinking blocks with only type, thinking and signature (or type and data).
  why: A betterlite response is always JSON, so the object branch has no input to run on.
- what: A retrieval key that is not a string is treated as a missing key and returns "No retrieval key provided.". LiteLLM runs str() on it and looks the text up.
  why: str() of a non-string value is a Python repr, and the tool schema B3542 builds only allows string keys.

out_of_scope:
- B3543 owns the settings, the pre-call hook, the original-content cache and its pruning, call ID resolution (_resolve_call_id), _get_cache, has_retrieval_tool and merge_tools. This task calls them.
- B3542 owns compress(), the retrieval tool definition and the cache contents. B4119 owns AgenticLoopPlan and AgenticLoopRequestPatch (betterlite_context::agentic_loop_plan) and B189 owns the CustomLogger base.
- The Anthropic Messages driver that calls the gate and the builder, applies the patch, enforces the loop cap and wraps results (llm_http_handler.py), belongs to the Anthropic Messages task.
- The chat-completions agentic loop (chat_completion_agentic_loop.py) has no compression caller, since this callback only handles Anthropic Messages.

pitfalls:
- The gate checks has_retrieval_tool on the request's tools, not on the response, so a response that calls litellm_content_retrieve without that tool in the request does not rerun.
- Thinking blocks are copied whole from content but tool_use blocks are rebuilt with only id, type, name and input, so extra keys on a tool_use block (cache_control, caller) are dropped.
- The assistant message puts thinking_blocks before the tool_use blocks, and the tool_result content is the plain string, not a block list.
- max_tokens uses "or" semantics, so an optional-params value of 0 or null falls through to kwargs, and max_tokens is always removed from the patch's optional_params.
- The patch carries no tools field, so the rerun reuses the original request's tools; do not add compressed_tools here.
- The model comes from model_call_details["agentic_loop_params"]["model"] (the original, un-prefixed name), and only when a logging object was passed.
- Pruning runs before the cache is read, so an entry exactly 900 seconds old is still used and one older is a miss that returns the not-found text.

review_level: standard

