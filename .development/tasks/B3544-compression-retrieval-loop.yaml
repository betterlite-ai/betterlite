id: B3544
title: Compression retrieval rerun gate and follow-up plan
description: >-
  Build the part of the compression interception callback that answers the model's
  litellm_content_retrieve tool calls on the server. B3543 already owns the settings,
  the per-call original-content cache, call ID resolution, cache pruning and the tool
  helpers (has_retrieval_tool, merge_tools). This task adds the three things that run after
  the provider has answered: a gate that decides if a rerun is needed, a builder that
  turns the model's retrieval calls into a follow-up request, and the small helpers
  they use. Put the code in a new module, crates/betterlite-core/src/api/compression_retrieval_loop.rs
  (and its folder), and call B3543's types and functions from it. Do not edit B3543's files.
  Every input is a typed JSON value (arguments::json::Json) or a typed struct. The
  tool name is the constant litellm_content_retrieve that B3543 defines.

  Gate (async_should_run_agentic_loop). Return (false, empty) when the callback is
  disabled, when the request's tools do not pass B3543's has_retrieval_tool, or when
  extraction finds no retrieval call in the response. Otherwise return (true, a map
  with tool_calls, thinking_blocks and tool_type="compression_retrieval", in that
  key order).

  Extraction (_extract_retrieval_tool_calls). The response is a JSON object. Read its
  content array; if content is missing or not an array, return two empty lists. For
  each block that is an object: a block of type "thinking" or "redacted_thinking" is
  copied whole into thinking_blocks (every key kept); a block of type "tool_use" whose
  name is litellm_content_retrieve adds {id, type:"tool_use", name, input} to tool_calls,
  with id taken from the block (null when absent) and input defaulting to an empty
  object. Order inside each list follows the content order.

  Retrieval content (_resolve_retrieval_content). Read tool_call.input; when it is an
  object take its "key" string. A missing, null, empty or non-object input gives
  "No retrieval key provided.". A key found in the cache returns the cached string. A
  key not in the cache returns "[compressed content key 'KEY' not found]" with the key
  inserted.

  Follow-up kwargs (_prepare_followup_kwargs). Copy the kwargs map without any key
  that starts with "_compression_interception" and without "litellm_logging_obj".

  Plan builder (async_build_agentic_loop_plan). Steps in order: prune the cache with B3543's
  prune function; read tool_calls and thinking_blocks from the gate's map (missing means
  empty lists); resolve the call ID with B3543's function (logging object first, then
  kwargs); fetch that call's cache (empty when the ID is absent or unknown); resolve the
  content of every tool call. Build an assistant message {role:"assistant", content:
  thinking_blocks followed by one {type:"tool_use", id, name, input} per call}, where
  name defaults to litellm_content_retrieve and input to an empty object. Build a user
  message {role:"user", content: one {type:"tool_result", tool_use_id, content} per call,
  in call order}. The follow-up messages are the original messages followed by those two.
  max_tokens is the optional-params max_tokens when it is present and nonzero, otherwise
  the kwargs max_tokens, otherwise none. The optional params of the patch are the request's
  optional params without max_tokens. The patch model is the "model" inside the logging
  object's model_call_details["agentic_loop_params"] when that exists, otherwise the
  model argument. The patch kwargs come from the follow-up kwargs helper. The patch sets
  no tools. The plan is run_agentic_loop=true, the patch, and metadata {tool_type:
  "compression_retrieval", call_id: the resolved ID or ""}. response_override, terminate
  and stop_reason stay at their defaults.

  The Anthropic Messages driver in llm_http_handler.py calls the gate and the builder; that
  driver belongs to the Anthropic Messages task, so here just expose both as functions
  on the callback type from B3543 with typed inputs and outputs. AgenticLoopPlan and
  AgenticLoopRequestPatch come from B4119 (betterlite_context::agentic_loop_plan).

