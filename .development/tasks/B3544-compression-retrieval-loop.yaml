dod:
- text: The gate returns (false, empty) when disabled, when the request tools hold no litellm_content_retrieve tool, or when the response holds no retrieval call.
  proof: [gate-tests, oracle, helper-python]
- text: When all three conditions pass the gate returns (true, {tool_calls, thinking_blocks, tool_type:"compression_retrieval"}) with the keys in that order.
  proof: [gate-tests, oracle, helper-python]
- text: Extraction keeps thinking and redacted_thinking blocks whole, keeps only retrieval tool_use blocks as {id,type,name,input}, defaults input to an empty object, and returns two empty lists when content is missing or not an array.
  proof: [extract-tests, oracle, helper-python]
- text: Retrieval content returns the cached string for a known key, the not-found text for an unknown key, and the no-key text for a missing, null, empty or non-object input.
  proof: [resolve-tests, oracle, helper-python]
- text: Follow-up kwargs drop every key that starts with "_compression_interception" and the key litellm_logging_obj, and keep all others.
  proof: [followup-tests, oracle, helper-python]
- text: The plan appends the assistant tool_use message (thinking blocks first) and the user tool_result message to the original messages, in call order.
  proof: [plan-tests, oracle, helper-python]
- text: The plan picks max_tokens from optional params when nonzero, else from kwargs, removes it from the patch optional params, takes the model from agentic_loop_params when present, and writes metadata call_id as "" when no ID resolves.
  proof: [plan-tests, oracle, helper-python]
- text: The plan prunes expired cache entries first, so an entry older than 900 seconds yields the not-found text.
  proof: [plan-tests]
- text: Newly added helper corpus cases replay through the shared helper-case parser.
  proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
  - id: gate-tests
    why: the gate exits or its returned map are missing or wrong
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::compression_retrieval_loop::tests::gate_/)'
  - id: extract-tests
    why: retrieval call or thinking block extraction is missing or wrong
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::compression_retrieval_loop::tests::extract_/)'
  - id: resolve-tests
    why: key lookup or its two fallback texts are missing or wrong
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::compression_retrieval_loop::tests::resolve_/)'
  - id: followup-tests
    why: the follow-up kwargs filter is missing or wrong
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::compression_retrieval_loop::tests::followup_/)'
  - id: plan-tests
    why: message building, max_tokens or model selection, metadata or cache pruning is missing or wrong
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::compression_retrieval_loop::tests::plan_/)'
  - id: helper-python
    why: strict oracle adapter lint or type checks fail
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3544)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3544 &&
      uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3544/pyrightconfig.json
  - id: helper-case-corpus
    why: newly added retrieval-loop helper cases are absent or do not replay
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/compression_retrieval_loop-*")" &&
      grep -lE '^[[:space:]]+b3544:' tools/oracle/fuzz/corpus/helper_case/compression_retrieval_loop-* &&
      test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

