dod:
  - text: McpServerConfig deserializes every TypedDict key and keeps dcr_bridge and per_server_oauth_discovery as raw values for the checks.
    proof: [loader-config-tests]
  - text: generate_stable_server_id matches the Python formula on a fixed vector, and pinned_config_server_id accepts, trims and rejects as stated.
    proof: [loader-id-tests]
  - text: The three collision errors, the name validation and the identifier owner maps match the Python, including alias mapping order.
    proof: [loader-collision-tests]
  - text: load rejects oauth2 without an explicit flow, a non-bool dcr_bridge, dcr_bridge on a wrong auth type and a bad per_server_oauth_discovery with the exact messages.
    proof: [loader-validation-tests]
  - text: load builds records with the OAuth endpoint steps, defers discovery as the flag says, assigns short prefixes and writes them into config_servers.
    proof: [loader-build-tests]
  - text: DCR hydration never fails the load, and the redacted dump masks secrets.
    proof: [loader-side-tests]
  - text: OpenAPI registration builds the auth header per auth type, the tool names and descriptions, and writes both names into the mapping.
    proof: [loader-openapi-tests]

checks:
  optional: []
  commands:
    - id: loader-config-tests
      why: a config key is missing or the raw values are lost
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^config_loader::tests::config_/)'
    - id: loader-id-tests
      why: the id hash or pinned id rule is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^config_loader::tests::id_/)'
    - id: loader-collision-tests
      why: a collision rule or the alias map is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^config_loader::tests::collision_/)'
    - id: loader-validation-tests
      why: a config check or its message is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^config_loader::tests::validation_/)'
    - id: loader-build-tests
      why: the record build, the discovery deferral or the registry write is wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^config_loader::tests::build_/)'
    - id: loader-side-tests
      why: DCR hydration failures stop the load or the dump leaks a secret
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^config_loader::tests::side_/)'
    - id: loader-openapi-tests
      why: OpenAPI auth headers, tool names or the mapping are wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^config_loader::tests::openapi_/)'

oracle_cases: []

deviations:
  - what: The config is a typed McpServerConfig struct and the loader returns a ConfigError enum, not a TypedDict and ValueError.
    why: real types end to end; messages keep the Python text.
  - what: The DCR hydrator, the tool sink and the stdio policy are injected traits.
    why: the discoverable_endpoints module and the tool registry live elsewhere and the repo wires dependencies through constructors.

out_of_scope:
  - "The table row path: B6763. Reload from the database, add, update and remove: B6765."
  - "OpenAPI spec loading, schema and tool function building: B4683. The tool registry: B4680."
  - "validate_mcp_server_name and is_per_server_oauth_discovery_eligible: B4716."
  - "get_server_prefix is B6594's (server_utils::prefixes); the tool name mapping rebuild is B4682's."
  - "ServerRegistry reads and collections: B4731."
  - "hydrate_config_server_dcr_client is B6595's (DcrHydration implements the DcrHydrator trait); the stdio gate has no owner found, see the architect notes. merge_mcp_headers and add_server_prefix_to_name are B6594's and strip_auth_scheme is B4741's; this task calls them."

pitfalls:
  - "alias: \"\" in an entry is an explicit alias and blocks the mcp_aliases mapping; only a missing key consults the mapping."
  - "A pinned server_id is used verbatim after trim, and a blank or non-string value is an error, never a silent fallback to the hash."
  - "A derived id cannot collide with a name, so collision checks only matter for pinned ids, but the earlier-entry check applies to both."
  - "configured_scopes is the extracted scopes as a tuple, and an all-blank list becomes None so the entra_obo scope precondition still fires."
  - "The config path uses the config oauth2_flow text directly for needs_authorization_url, not the effective flow."
  - "Clearing the instructions caches happens before any entry is read, and the cache invalidation per id happens just before the insert."
  - "OpenAPI registration errors propagate and fail the load; DCR hydration errors do not."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
