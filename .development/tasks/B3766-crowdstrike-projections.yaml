      _normalize_content_list iterates over items; non-dict items are json.dumps()'d as _TextContentPart; dict items with type="text" and text string become _TextContentPart; dict items with type="image_url" become _ImageUrlContentPart with url extracted from image_url field; all other dict types are silently dropped with no replacement appended.
    proof: [crowdstrike-aidr-tests]
  - text: >-
      _normalize_content_returns_empty_list_unchanged null/empty/non-list/non-string inputs produce their correct normalized form; the caller (_build_guard_input_for_request) turns the resulting None or empty list into an empty string at lines 412-413.
    proof: [crowdstrike-aidr-tests]
  - text: >-
      _extract_text_from_content_string returns the string unchanged; null returns ""; non-string non-list returns ""; list items with type="text" and string text are concatenated with newlines.
    proof: [crowdstrike-aidr-tests]
  - text: >-
      _extract_text_from_message_string_content with content being a string returns the string; null content returns ""; list content extracts text-type parts only and joins with newlines.
    proof: [crowdstrike-aidr-tests]
  - text: >-
      _merge_metadata_bags combines request_data.metadata and request_data.litellm_metadata dicts; returns the merged dict if at least one exists, otherwise None.
