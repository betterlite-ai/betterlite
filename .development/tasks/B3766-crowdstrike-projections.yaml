deviations: []
out_of_scope:
  - "CustomGuardrail base class and log_guardrail_information decorator: B3664 covers litellm/integrations/custom_guardrail.py and owns these imports."
  - "Message skip-flag helpers effective_skip_system_message_for_guardrail and effective_skip_tool_message_for_guardrail: B3663 covers litellm/llms/base_llm/guardrail_translation/utils.py and owns these functions."
  - "HTTP client primitives get_async_httpx_client and AsyncHTTPHandler: shared transport layer has no owning task; flag for the architect."
  - "Applied guardrails header callback add_guardrail_to_applied_guardrails_header: header composition has no owning task; flag for the architect."
  - "Service invocation and higher-level apply hook orchestration: B107 owns the dispatching and lifecycle integration."
pitfalls:
  - "_normalize_content distinguishes between JSON-stringifiable items and dropped items: non-dict list items become _TextContentPart with json.dumps(item) as text, but dict items with an unrecognized or malformed type are silently dropped with no replacement; only type=\"text\" with string text or type=\"image_url\" with url-like structure are kept."
  - "Empty content normalization happens in _build_guard_input_for_request (lines 412-413), not _normalize_content: when content is None or an empty list after normalization, the caller converts it to an empty string for the guard_input."
  - "Message filtering for requests preserves system messages across all turns but includes non-system messages only from the last assistant turn onward; when the last message is already assistant, the selection includes only system and that final assistant."
  - "Redaction writeback via _redacted_messages uses Python id() to map original message objects back to positions; failing to align redaction indices with the full message list returns None so the caller preserves the unredacted messages."
  - "Streaming configuration defaults to false for all boolean flags (streaming_buffer_until_moderated, streaming_buffer_release_on_scan, streaming_end_of_stream_only) and 5 for sampling_rate; these are updated via _set_streaming_params when litellm_params change."
  - "API request failure handling distinguishes HTTPException (blocked verdict) from other exceptions: blocked verdicts are re-raised immediately; other exceptions trigger fail_on_error checks so fail_open logs and returns empty results."
  - "Malformed response handling: when transformed=true but the response shape cannot be parsed, a 500 is raised immediately to avoid dropping delivered redactions; when transformed is false or absent, validation errors re-raise naturally."
  - "Constructor's fail_on_error parameter defaults to True when None is passed, using the pattern 'True if fail_on_error is None else fail_on_error'."
