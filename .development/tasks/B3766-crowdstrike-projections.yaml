  - text: >-
      streaming_params_from_litellm_params extracts streaming_buffer_until_moderated, streaming_buffer_release_on_scan, streaming_end_of_stream_only, streaming_sampling_rate from litellm_params.model_extra and optional_params, preferring model_extra values.
