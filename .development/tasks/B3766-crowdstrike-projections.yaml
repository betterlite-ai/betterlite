id: B3766
title: CrowdStrike message projections and streaming settings
description: >-
  Build CrowdStrike AIDR's input/response data models, message selection, and
  constructor with streaming configuration. The guardrail inspects requests and
  responses through POST to the CrowdStrike AIDR /v1/guard_chat_completions
  endpoint, transforming messages into a guard_input payload with scoped message
  selection (system + messages since last assistant for requests, assistant text
  for responses) and optional tools. On success, apply transformed output back to
  the original messages via positional writeback when the guard reports
  transformed=true.

  Preserve malformed or unrecognized content-part types (e.g., untyped dicts,
  unknown type values) as dropped content rather than replacing them with empty
  strings or errors; the caller handles fail-closed semantics for incomplete
  rewrites. Streaming settings control buffering and scan frequency when the
  stream hook calls this guardrail. The constructor reads api_key and api_base
  from litellm_params, falling back to environment variables (CS_AIDR_TOKEN,
  CS_AIDR_BASE_URL) when absent, validates both are present, and fail_on_error
  defaults to true (unrecoverable API failures block).

  The architect must add five `pub mod crowdstrike_*` lines to
  crates/betterlite-guardrails/src/lib.rs before this task can compile. This
  task registers the oracle helper operation "crowdstrike_aidr" in the guardrails
  group; the architect must add `"crowdstrike_aidr" => crowdstrike_aidr` to
  tools/oracle/src/helpers/guardrails.rs before dispatch, and add "crowdstrike_aidr"
  to the OPERATIONS frozenset in tools/oracle/helpers/b3766.py before this
  task's oracle checks can pass.
scope:
  paths:
    - crates/betterlite-guardrails/Cargo.toml
    - crates/betterlite-guardrails/src/crowdstrike_aidr.rs
    - crates/betterlite-guardrails/src/crowdstrike_aidr/**
    - crates/betterlite-guardrails/src/crowdstrike_normalization.rs
    - crates/betterlite-guardrails/src/crowdstrike_normalization/**
    - crates/betterlite-guardrails/src/crowdstrike_message_selection.rs
    - crates/betterlite-guardrails/src/crowdstrike_message_selection/**
    - crates/betterlite-guardrails/src/crowdstrike_writeback.rs
    - crates/betterlite-guardrails/src/crowdstrike_writeback/**
    - crates/betterlite-guardrails/src/crowdstrike_streaming.rs
    - crates/betterlite-guardrails/src/crowdstrike_streaming/**
    - tools/oracle/cases/helpers/crowdstrike-aidr/**
    - tools/oracle/fuzz/corpus/helper_case/crowdstrike-aidr-*
    - tools/oracle/helpers/b3766.py
    - tools/oracle/helpers/b3766/**
    - tools/oracle/src/helpers/guardrails/b3766.rs
    - tools/oracle/src/helpers/guardrails/b3766/**
