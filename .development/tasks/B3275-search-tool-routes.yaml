id: B3275
title: Search tool management and connection routes
description: >-
  Build `search_tool_routes` in betterlite-server: the seven `/search_tools` management routes. There are no `/v1` or other aliases, and LiteLLM only loads the module on the first request under `/search_tools` (a lazy mount that no client can see). Expose `pub fn routes()` the way the sibling modules in crates/betterlite-server/src/ do; the architect's skeleton mounts it, so do not touch app.rs. The files are crates/betterlite-server/src/search_tool_routes.rs and search_tool_routes/. The records `SearchTool`, `SearchToolInfoResponse` and `ListSearchToolsResponse` are B3270's, the database reads and writes are B3271's `SearchToolRegistry`, the search call is B3272's `asearch`, the permission test is B749's `can_user_view_search_tool` and the team row read is B737's `get_team_object`.

  Routes, each behind the normal key check. The write routes and test_connection are admin only and the two read routes (`/search_tools/list` and `/search_tools/ui/available_providers`) are open to internal users; that role table is B742's, so register the routes and do not build a role check here. (1) `GET /search_tools/list`. (2) `POST /search_tools` with body `{"search_tool": SearchTool}`. (3) `PUT /search_tools/{search_tool_id}` with the same body. (4) `DELETE /search_tools/{search_tool_id}`. (5) `GET /search_tools/{search_tool_id}`. (6) `POST /search_tools/test_connection` with body `{"litellm_params": {...}}`. (7) `GET /search_tools/ui/available_providers`. A body that does not match the record (missing `search_tool`, missing `search_tool_name`, missing `litellm_params.search_provider`) is the usual 422 detail list, before any handler code runs.

  Database gate. Routes 1 to 5 answer 500 with `{"detail": "Prisma client not initialized"}` when no database is configured, before anything else. This check sits outside the try block in LiteLLM, so it is never wrapped. After it, any error inside the handler (other than the 404s below) becomes 500 with `{"detail": str(error)}`; an `HTTPException` raised inside the list and the id routes passes through unchanged.

  List (route 1). Read all rows with B3271's `get_all_search_tools_from_db` (newest first). Read the config tools through an injected `ConfigSearchTools` trait that returns the `search_tools:` list (or `general_settings.search_tools`) of the loaded file as `SearchTool` values; ProxyConfig.get_config and parse_search_tools have no Rust owner at this pin, so the trait is this task's seam and the architect wires it. If that trait call fails, log at debug and treat it as no config tools. Config tools with an empty name are dropped; config tools whose name is also a database name are dropped; the answer is the remaining config tools first (in file order), then every database row. Config items carry `search_tool_id` null, `created_at` and `updated_at` null, `is_from_config` true; database items carry `is_from_config` false. Every item's `litellm_params` goes through B3684's `mask_sensitive_values` (unmasked length 4, four asterisks; that function is `pub(crate)` in this crate at `crate::guardrails::admin_reads::masking`). A config item's `search_tool_info` is its object or null; a database item's is stored as read. Timestamps from the registry are already ISO strings; a value that is a datetime becomes its ISO text and null stays null.

  Visibility filter. A caller whose role is `proxy_admin` or `proxy_admin_viewer` (B732's role type) sees everything. Anyone else sees a tool only when B749's `can_user_view_search_tool(name, caller, team_object)` returns true. The team row comes from B737's `get_team_object` for the caller's `team_id`, read once per request, and only when the caller has a team id that is not the sentinel `litellm-dashboard` (every Admin UI session key carries that sentinel and it has no team row, so a lookup would 404). A failed lookup of a real team id surfaces as its own error (404 stays 404; other failures are 500 with the text). A tool with an empty name is never visible to a non-admin. Inject the team read through a `TeamObjectLookup` trait so tests can fake it.

  Create, update, delete, get (routes 2 to 5). Create calls B3271's `add_search_tool_to_db`, then refreshes the router, then returns the registry result as it is (unmasked, with the plain `api_key`). Update and delete first read the row by id with `get_search_tool_by_id_from_db`; a missing row is 404 `{"detail": "Search tool with ID {id} not found"}`; then call `update_search_tool_in_db` or `delete_search_tool_from_db`, refresh the router, and return the registry result unmasked (update returns the row, delete returns `{"message": "Search tool {id} deleted successfully", "search_tool_name": ...}`). Get reads by id, answers the same 404, and returns `SearchToolInfoResponse` with masked `litellm_params` and `is_from_config` false. Create, update and delete log the success at debug.

  Router refresh. After a successful write call an injected `RouterSearchRefresh` trait (LiteLLM's `proxy_config.reload_search_tools_from_db`). It is best effort: a refresh error is logged with `tracing::error!` and never changes the response, because the row is already committed and a 500 would make the client retry and create a duplicate. The write itself is not wrapped in a transaction with the refresh.

  Test connection (route 6). It never answers an error status for a failure, only for body validation. Read `search_provider`, `api_key` and `api_base` from `litellm_params` (every other key is ignored). A missing or empty `search_provider` is raised as a 400 inside the try block and the catch-all turns it into a 200 answer, see the pitfalls. Otherwise call B3272's `asearch` with query "test", that provider, the key and base, `max_results` 1 and a 10 second timeout, through an injected `ConnectionSearch` trait. Success is 200 `{"status": "success", "message": "Successfully connected to {provider} search provider", "test_query": "test", "results_count": N}` where N is the length of the response results, 0 when there are none. Any failure is 200 `{"status": "error", "message": str(error), "error_type": ClassName}`, logged at error level. `error_type` is the LiteLLM exception class name that B3272's error conversion produced (for example AuthenticationError); for an error that is not a LiteLLM class use the Python class name LiteLLM would show (HTTPException, ValueError).

  Available providers (route 7). Walk the `SearchProviders` values in LiteLLM's enum order (perplexity, tavily, parallel_ai, exa_ai, brave, google_pse, dataforseo, firecrawl, fastcrw, searxng, linkup, duckduckgo, searchapi, serper, you_com, apiserpent, tinyfish, agentcore, nimble, bing_grounding) and for each ask B2202's search provider lookup for the config. A provider without a config, or whose lookup fails, is skipped (debug log). The rest give `{"provider_name": value, "ui_friendly_name": config.ui_friendly_name()}` under `{"providers": [...]}`. A failure outside the loop is 500 with the text. Inject the lookup through a `ProviderCatalog` trait.

  Wiring: the traits are constructor arguments of the state struct that `routes()` takes, in the way the sibling route modules take theirs. A fake of each trait lives in tests.rs. Put the HTTP handlers in search_tool_routes.rs, the list merge and visibility filter in search_tool_routes/list.rs, and the connection test and providers in search_tool_routes/connection.rs, each with its own error enum.
