dod:
  - text: All seven routes answer on exactly their paths and methods, and every one needs a valid key (a missing key gets the usual 401 body).
    proof: [route-tests, oracle]
  - text: Routes 1 to 5 answer 500 with detail "Prisma client not initialized" when no database exists, and an invalid body gives the usual 422 before the handler.
    proof: [route-tests, oracle]
  - text: The list drops config tools shadowed by a database name, puts config tools first and database rows after, nulls the config ids and timestamps, and masks litellm_params with the 4/4 rule.
    proof: [list-tests]
  - text: Admin and admin-viewer callers see all tools; other callers see only tools that can_user_view_search_tool allows, the dashboard sentinel team is never looked up, and a failed real team lookup surfaces.
    proof: [list-tests]
  - text: Create returns the unmasked registry row; update and delete answer 404 "Search tool with ID {id} not found" for a missing id; delete returns the message and name; get masks litellm_params and sets is_from_config false.
    proof: [write-tests]
  - text: A failing router refresh after a write is logged and the write still answers its normal body; a failing registry call answers 500 with the error text.
    proof: [write-tests]
  - text: test_connection calls asearch with query "test", max_results 1 and timeout 10, answers the success body with results_count, and answers 200 with status "error", message and error_type for any failure, including a missing search_provider.
    proof: [connection-tests, oracle]
  - text: available_providers lists the providers in enum order, skips a provider with no config or a failing lookup, and returns the ui_friendly_name of each.
    proof: [connection-tests]
  - text: The oracle cases for the database gate, the 422, test_connection's missing provider and the 401 on each route exist and match LiteLLM.
    proof: [new-cases, oracle]
checks:
  optional: [mutants]
  commands:
    - id: route-tests
      why: a route path, method, body check or database gate is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^search_tool_routes::tests::routes_/)'
    - id: list-tests
      why: the list merge, masking or visibility filter is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^search_tool_routes::tests::list_/)'
    - id: write-tests
      why: a create, update, delete, get or refresh behaviour is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^search_tool_routes::tests::write_/)'
    - id: connection-tests
      why: test_connection or available_providers behaviour is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^search_tool_routes::tests::(connection_|providers_)/)'
    - id: new-cases
      why: the search tool routes have no HTTP parity cases on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/search-tools)"
oracle_cases:
  - tools/oracle/cases/search-tools/list-no-database.yaml
  - tools/oracle/cases/search-tools/create-no-database.yaml
  - tools/oracle/cases/search-tools/update-no-database.yaml
  - tools/oracle/cases/search-tools/delete-no-database.yaml
  - tools/oracle/cases/search-tools/get-no-database.yaml
  - tools/oracle/cases/search-tools/create-invalid-body.yaml
  - tools/oracle/cases/search-tools/test-connection-no-provider.yaml
  - tools/oracle/cases/search-tools/test-connection-invalid-body.yaml
  - tools/oracle/cases/search-tools/auth-required.yaml
deviations:
  - what: The route module is mounted at startup, where LiteLLM imports it on the first request under /search_tools.
    why: The lazy import has no visible effect for a client, and the paths and answers are the same.
  - what: The config search tools, the router refresh, the team row read and the provider lookup are injected traits that the architect wires.
    why: ProxyConfig's get_config, parse_search_tools and reload_search_tools_from_db are B8379's and B8384's, in the binary crate above this one, and the others live in crates that must not depend on the server.
out_of_scope:
  - "ProxyConfig.get_config, parse_search_tools, reload_search_tools_from_db, _init_search_tools_in_db and _merge_config_and_db_search_tools (proxy_server.py L6014-L6160, L8997-L9072): B8379 and B8384; B8384 implements this task's injected trait."
  - "The role table that makes the write routes admin only and the two read routes open to internal users (LiteLLMRoutes in _types.py): B742."
  - "The /search and /v1/search call routes in litellm/proxy/search_endpoints/endpoints.py: another entry."
  - "SearchToolRegistry methods: B3271. asearch and its error conversion: B3272. Search records and BaseSearchConfig: B3270."
  - "The per-provider search configs and their ui_friendly_name values: the provider tasks. This task only calls them."
pitfalls:
  - "test_connection raises HTTPException(400) for a missing search_provider inside its own try block, so the catch-all turns it into a 200 body with status error, message `400: search_provider is required in litellm_params` and error_type HTTPException."
  - "Create and update return the registry row unmasked, with the plain api_key; only list and get mask litellm_params."
  - "Masking tests the key name for the substrings token, key, secret, password, passwd, authorization and credentials, so api_key is masked and api_base is not; non-string values and short strings (4 characters or fewer) become `*****`."
  - "The dashboard session key has team_id `litellm-dashboard`, which has no team row; looking it up would give 404 for every Admin UI user, so skip the lookup and use the key allowlist alone."
  - "A config tool is hidden by a database tool of the same name, but only the config side is deduplicated, so a database row is never hidden."
  - "The router refresh runs after the row is committed and must not change the response; the 'Prisma client not initialized' check runs before the try block, so it is a 500 even where the other errors are wrapped."
  - "The ids routes `/search_tools/{search_tool_id}` and the fixed paths `/search_tools/list` and `/search_tools/ui/available_providers` share a prefix; register the fixed paths so `list` is never read as an id. PUT and DELETE on `/search_tools/list` still mean id `list`."
  - "test_connection takes api_key and api_base only from litellm_params; with no api_key, B3270's server-credential check decides whether the server's own key may go to a caller-chosen api_base, so do not add a bypass."
  - "available_providers skips a provider whose config lookup fails and logs at debug; it does not fail the route."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
