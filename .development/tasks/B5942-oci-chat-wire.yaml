deviations:
  - what: The error text for a body or chunk that does not fit its type differs from LiteLLM. LiteLLM appends the pydantic validation message. The status codes and the fixed prefix text are the same.
    why: The pydantic message has no Rust equivalent.
  - what: handle_generic_response accepts timeCreated only as RFC 3339 (for example 2025-01-01T00:00:00.000Z); Python fromisoformat also takes forms such as a date without a time. Anything else is OciError with the HTTP status.
    why: chrono parses RFC 3339 and a wider hand-written parser is not worth carrying for OCI's fixed format.
out_of_scope:
  - B5940 owns the schema cleanup helpers, the Cohere type map, OciError and OciServingMode used here.
  - B5843 owns the request payload wrapper, parameter mapping, vendor lookup, the stream wrapper state, JSON and SSE decoding of the body and chunks, and all HTTP calls.
  - B8330 owns wiring the chat route and the HTTP oracle cases.
pitfalls:
  - Cohere tool-call ids hash the key-sorted JSON of the parameters while the arguments field holds the text in the original key order, so two calls with the same keys in a different order get the same id but different arguments.
  - The message left out of chatHistory is the last user message wherever it sits, so tool messages after it stay in the history.
  - Tool results look up the originating call over every assistant message in the list, not only the one just before.
  - GENERIC skips a system, user or assistant message whose content is None, and an assistant message with tool_calls None and content falls to the content branch; only a present tool_calls list takes the tool branch.
  - An image_url detail is never copied, so OciImageUrl.detail stays None.
  - A GENERIC response whose first choice has no message, or no text part, leaves the pre-made message untouched.
  - A Cohere stream chunk with no index gets index 0, and its finish reason goes through the same normalizer, so an unknown reason becomes stop.
  - The streaming tool-call defaults are written into the raw chunk before it is typed; a chunk with a tool call missing only the id is valid.
budget: {max_changed_lines: 1500, max_new_expects: 0}
review_level: standard
