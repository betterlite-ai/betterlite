id: B5942
title: OCI chat wire types, message and tool adapters, response and chunk parsing
description: >-
  Add oci_chat_wire in betterlite-provider for litellm/llms/oci/chat/cohere.py and
  litellm/llms/oci/chat/generic.py. This task is the whole translation between OpenAI-shaped
  values and the two OCI chat wire formats, COHERE and GENERIC. B5843 builds the request payload,
  signs and sends it, and calls these functions. Credentials, URLs and signing are not touched here.

  No task ports litellm/types/llms/oci.py on its own, so define the Rust equivalents in
  this module with serde, skipping None fields on output: OciVendor (COHERE and GENERIC, with the
  GENERIC wire value as the apiFormat for any non-Cohere vendor), OciRole (SYSTEM, USER, ASSISTANT,
  TOOL), the content parts (TEXT with text, IMAGE with imageUrl url and optional detail), OciToolCall
  (optional id, name, arguments as a JSON string), OciToolDefinition, OciMessage, OciChatRequestPayload
  (apiFormat, messages, tools, isStream, numGenerations, maxTokens, maxCompletionTokens, temperature,
  topP, stop, seed, frequencyPenalty, presencePenalty, reasoningEffort, responseFormat, toolChoice,
  logitBias, logProbs), the response types OciResponseUsage, OciResponseChoice, OciChatResponse and
  OciCompletionResponse, the stream types OciStreamDelta and OciStreamChunk, and the Cohere set:
  CohereMessage with its USER, CHATBOT, SYSTEM and TOOL variants, CohereToolCall, CohereToolResult,
  CohereParameterDefinition, CohereTool, CohereChatRequest, CohereUsage, CohereChatResponse,
  CohereChatResult and CohereStreamChunk. Read litellm/types/llms/oci.py lines 1 to 410 for every
  field and which are required. The payload wrapper OCICompletionPayload and the serving mode
  belong to B5843 and B5940. Build responses with betterlite-openai's ChatResponse, ChatChoice,
  AssistantMessage, ChatUsage and ToolCall, and stream deltas with its stream Chunk and Delta.

  GENERIC messages. adapt_messages_to_generic_oci_standard walks the messages: an assistant
  message with tool_calls becomes a tool-call message (content None); system, user and assistant
  messages with content become content messages; a tool message becomes a content message with
  toolCallId; any other message (for example a system message with no content) is skipped. Content
  is a string or a list of parts; only text and image_url parts are accepted, and image_url may be
  a string or an object with url. Every check in the source raises OciError 400 with its exact
  message; keep the wording. Tool calls must be type function with a string id, a function object, a
  string name and a string arguments value (default "{}"). Tool definitions go through
  adapt_tool_definition_to_oci_standard: type must be function, the schema passes through B5940's
  refs, anyOf and sanitize steps in that order, and description defaults to "".

  COHERE messages and tools. extract_text_content keeps the plain text of a string or a list of
  text parts (non-text parts add nothing). adapt_messages_to_cohere_standard builds chatHistory
  from every message except the last user message (all messages when none is a user message). The
  caller removes system messages first. user becomes USER, assistant becomes CHATBOT with toolCalls
  parsed from the JSON arguments (an invalid JSON string gives an empty map), and tool messages become
  TOOL entries with toolResults resolved by tool_call_id against the assistant calls in the whole
  list (an unknown id gives a call with an empty name and empty parameters); consecutive tool
  messages merge into one TOOL entry. adapt_tool_definitions_to_cohere_standard turns each tool into
  a CohereTool whose parameter definitions come from the cleaned schema's properties, with type
  mapped through B5940's table (default string), the description enriched by B5940, and isRequired
  from the required list.

  Responses. normalize_oci_finish_reason maps None to None, COMPLETE to stop, MAX_TOKENS to length,
  TOOL_CALL and TOOL_CALLS to tool_calls and everything else to stop. synthesize_oci_tool_call_id is
  call_ plus the first 24 hex characters of the SHA-256 of "position|name|arguments". For Cohere
  tool calls the arguments field is the JSON text of the parameters in their own key order and the hash input uses
  the key-sorted JSON text (see pitfalls). handle_generic_response fills the passed ChatResponse: created
  from chatResponse.timeCreated (ISO 8601 with a Z suffix), model from modelId, an OciError with
  the HTTP status and "OCI response contained no choices" when choices is empty, text parts of the
  first choice concatenated into the content (non-text parts skipped, content untouched when
  there is no text part), tool calls adapted with synthesized ids when the id is missing, the
  normalized finish reason, and usage with completion_tokens defaulting to 0 and the reasoning
  token count taken from completionTokensDetails. handle_cohere_response fills model from the
  argument, created from the current time, one choice with content None when the text is empty,
  tool_calls only when present, and usage zeros when absent. A body that does not fit its type is
  OciError with the HTTP status and the "Response cannot be casted to ..." prefix.

  Stream chunks. handle_generic_stream_chunk first fills missing id, name and arguments of
  message.toolCalls with empty strings, then types the chunk (a mismatch is OciError 500 with the
  "Chunk cannot be parsed as OCIStreamChunk" prefix) and defaults index to 0. Text parts are
  concatenated into content (None when there is none). An image part is OciError 500 and
  any other part type is OciError 500. Tool calls become id, type function, name, arguments with
  synthesized ids for empty ones. handle_cohere_stream_chunk takes two flags, prior_tool_calls_emitted
  and prior_text_emitted, and drops restated text when the chunk has chatHistory or toolCalls and text was
  already sent, and restated tool calls when it has chatHistory and tool calls were already sent. The
  stream wrapper state that sets the flags belongs to B5843.

  Plan 330 lines of module code, 150 of types, 100 of tests and fixtures, 44 of oracle adapters. The
  remaining source is 624 nonblank, noncomment lines.
