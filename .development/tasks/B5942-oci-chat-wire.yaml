  - tools/oracle/cases/helpers/oci-chat-wire/cohere-chat-history-and-merged-tool-results.yaml
  - tools/oracle/cases/helpers/oci-chat-wire/cohere-tool-definitions.yaml
  - tools/oracle/cases/helpers/oci-chat-wire/generic-response-text-tools-usage.yaml
  - tools/oracle/cases/helpers/oci-chat-wire/generic-response-no-choices.yaml
  - tools/oracle/cases/helpers/oci-chat-wire/cohere-response-tool-calls-and-usage.yaml
  - tools/oracle/cases/helpers/oci-chat-wire/finish-reason-map.yaml
  - tools/oracle/cases/helpers/oci-chat-wire/generic-stream-chunks.yaml
