dod:
  - text: GENERIC and COHERE message arrays convert to the same wire values, including tool calls, tool results and the validation errors.
    proof: [oci-wire-tests, oci-wire-python, oci-wire-seeds]
  - text: Tool definitions convert with cleaned schemas for both formats.
    proof: [oci-wire-tests, oci-wire-python, oci-wire-seeds]
  - text: Non-streaming responses of both formats become the same choices, finish reasons, tool call ids and usage.
    proof: [oci-wire-tests, oci-wire-python, oci-wire-seeds]
  - text: Stream chunks of both formats become the same deltas, including Cohere duplicate suppression.
    proof: [oci-wire-tests, oci-wire-python, oci-wire-seeds]
checks:
  optional: [mutants]
  commands:
    - id: oci-wire-tests
      why: message, tool, response or chunk conversion behavior is missing
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^oci_chat_wire::/)'
    - id: oci-wire-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5942)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5942 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5942/pyrightconfig.json
    - id: oci-wire-seeds
      why: new OCI wire cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/oci_chat_wire-*")" &&
        grep -lE '^[[:space:]]+b5942:' tools/oracle/fuzz/corpus/helper_case/oci_chat_wire-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
