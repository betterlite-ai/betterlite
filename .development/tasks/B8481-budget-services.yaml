oracle_cases: []
deviations: []
out_of_scope:
  - "The limiter's checks, charging and legacy carry: B3005 and B3006. The limiter protocols and auth callers: B753 and B755. Compaction's own checks: B970."
  - "Reconcile, release, invalidate and release_unbound_budget_reservation: B3003. The release layer and its slot: B8270. The post-call coordinator and its port: B1719."
  - "reserve_budget_for_request and its lease renewal: B8480. Copying the reservation into the request: B1225."
  - "B732's BudgetAdmission port (admit over AuthContext and RequestScope) has only a test double, and its two inputs do not carry the body, token objects and settings that reserve_budget_for_request needs, so no part here implements it: B1225 calls B8480 directly after auth. B8660 removes the unused port instead of implementing it."
  - "The session budget limiter is a PROXY_HOOKS entry that B8399 registers; the reset job schedule is B124's startup work."
  - "Holding BudgetServices in Shared: B8610. Passing its accessors to the auth slots and B1225's reservation call: B8660. Installing B8270's layer with the releaser: the edge part (B8680)."
pitfalls:
  - "LiteLLM's limiter is a module global: building a second instance for compaction or for the callback list splits the in-memory counters and the legacy-carry state, so a cap checked in auth would miss spend charged elsewhere."
  - "add_litellm_callback runs at import, before startup; the limiter is in the callback list even when no callbacks are configured, so do not gate its registration on litellm_settings.callbacks."
  - "release_unbound_budget_reservation skips callback_bound reservations; the releaser adapter must not repeat that check or invert it."
  - "The end-user port's boolean is ignored by auth unless it raises; return the limiter's result as it is and let B755 decide."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
