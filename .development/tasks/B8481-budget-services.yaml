id: B8481
title: Install budget reservation, settlement and model budget services
description: >-
  Last wiring part of the budgets group. The parts build the engines but leave the module-level objects LiteLLM creates in proxy_server.py, and the ports lower tasks defined for them, to the umbrella. This task builds those objects once and plugs them into every port, in the module `budget_services` of betterlite-server. Nothing here decides a budget; each adapter is a thin call into the part that owns the logic.

  What LiteLLM does at import time, and what this task builds for each line:

  1. proxy_server.py L2614-L2617. `spend_counter_cache` is one DualCache (B3015 owns it and its counter reads and writes), and `model_max_budget_limiter = _PROXY_VirtualKeyModelMaxBudgetLimiter(dual_cache=spend_counter_cache)` is created once over it and added with `litellm.logging_callback_manager.add_litellm_callback`. Build one instance of B3006's limiter (betterlite-auth::model_budget_limiter) over that same cache and register it once in the logger list through B8399's callback registration, so its success hook charges the per-model counters. Registering it twice would charge twice.
  2. The model budget ports. B753 defined three limiter protocols for auth (`_KeyModelBudgetLimiter` with `is_key_within_model_budget` and `get_fallback_model_within_budget`, `_UserModelBudgetLimiter.is_user_within_model_budget`, `_TeamModelBudgetLimiter.is_team_within_model_budget`), B755 defined the end-user port (`is_end_user_within_model_budget`), and B970 defined injected read-only seams for the compaction checks (compact.py L417-L490 calls the key, user, team and end-user checks on `proxy_server.model_max_budget_limiter`). Implement every one of them over the single limiter instance from step 1, passing the arguments through unchanged and returning the limiter's result or error unchanged. LiteLLM imports one module global everywhere, so auth, compaction and the success hook must share counters and the legacy-carry state B3006 keeps.
  3. proxy_server.py L2470: `app.add_middleware(BudgetReservationReleaseMiddleware, release=release_unbound_budget_reservation)`. Implement B8270's `ReservationReleaser` trait with B3003's `release_unbound_budget_reservation` (budget_reservation.py L468-L478): it does nothing for a reservation whose `callback_bound` is true and otherwise calls `release_or_invalidate_budget_reservation`. The skip decision stays in B3003; the adapter only forwards.
  4. B1719's reservation settlement port (betterlite-server::spend::settlement). Its methods map one to one onto B3003: reconcile with the actual Decimal cost and the `finalize` and `apply_consistent` flags goes to `reconcile_budget_reservation`, release goes to `release_budget_reservation`, invalidation goes to `invalidate_budget_reservation_counters`. Convert the Decimal cost to the type B3003 takes with a checked conversion, as B1719 already does for its own inputs. B1719 requires that construction rejects an enabled reservation feature without its backend: `BudgetServices::new` returns the typed error when reservations are enabled and the settlement backend is missing, and no-op behavior is allowed only when there is no reservation.

  Shape. `BudgetServices::new(...)` takes the spend counter cache and the handles the limiter and the settlement code need (B3006's and B3003's constructors list them) and returns the struct; accessors hand out `Arc<dyn Port>` values for each port above, all backed by the same instances. B8610 holds the one `BudgetServices` in Shared as `budget`, B8660 passes the accessors to the auth slots and the reservation call, and the edge part (B8680) installs B8270's layer with the releaser; this task does not edit app.rs, state.rs or another task's module.

  The limiter reaches auth only after B8660 plugs these ports into the auth slots, so B8660 owns the HTTP cases in tools/oracle/cases/budget-services/ (a zero model cap refused for a key and for a team, and a key served for a model outside its map). Here the tests drive the real adapters over fake engines.

  Module layout: `crates/betterlite-server/src/budget_services.rs` for the struct and the constructor, `budget_services/model_budget.rs` for the limiter adapters, `budget_services/reservation.rs` for the releaser and settlement adapters, `budget_services/error.rs` and `budget_services/tests.rs`. Tests use the real adapters over fake engines and assert that each port reaches the one shared instance.
scope:
  paths:
    - crates/betterlite-server/src/budget_services.rs
    - crates/betterlite-server/src/budget_services/**
    - tools/oracle/helpers/b8481.py
