dod:
- text: 'openai audio speech path: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-speech/openai-audio-speech-path.yaml.'
  proof:
  - case-openai-audio-speech-path
  - oracle
  - helper-python
- text: 'v1 audio speech: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-speech/v1-audio-speech.yaml.'
  proof:
  - case-v1-audio-speech
  - oracle
  - helper-python
- text: 'native speech selection: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-speech/native-speech-selection.yaml.'
  proof:
  - case-native-speech-selection
  - oracle
  - helper-python
- text: 'speech ad token header: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-speech/speech-ad-token-header.yaml.'
  proof:
  - case-speech-ad-token-header
  - oracle
  - helper-python
- text: 'binary speech body: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-speech/binary-speech-body.yaml.'
  proof:
  - case-binary-speech-body
  - oracle
  - helper-python
- text: New azure_speech seeds parse as the intended call variant and replay through the shared production parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-openai-audio-speech-path
    why: The openai-audio-speech-path behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_openai_audio_speech_path$/)'
  - id: case-v1-audio-speech
    why: The v1-audio-speech behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_v1_audio_speech$/)'
  - id: case-native-speech-selection
    why: The native-speech-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_native_speech_selection$/)'
  - id: case-speech-ad-token-header
    why: The speech-ad-token-header behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_speech_ad_token_header$/)'
  - id: case-binary-speech-body
    why: The binary-speech-body behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_binary_speech_body$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_speech.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_speech*")"
      && grep -lq 'azure_speech' tools/oracle/fuzz/corpus/helper_case/azure_speech* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_speech$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
