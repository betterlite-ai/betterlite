id: B537
title: Azure OpenAI speech transport
description: >-
  Add the Azure speech execution and native-AVA dispatch methods selected by B025. Own the OpenAI-compatible binary
  execution path and auth header extraction; native SSML synthesis lives in native_speech. Keep response streams
  owned through cancellation.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.audio_speech
  L1362-L1426; AzureChatCompletion.async_audio_speech L1428-L1471; AzureChatCompletion.get_headers L1473-L1540.
  litellm/llms/azure/text_to_speech/transformation.py: AzureAVATextToSpeechConfig.dispatch_text_to_speech L62-L134;
  AzureAVATextToSpeechConfig.get_supported_openai_params L136-L143.


  Named case contracts: native_speech_selection: AVA dispatch resolves base from explicit, litellm_params_dict.api_base,
  litellm.api_base, AZURE_API_BASE; key from explicit, params.api_key, litellm.api_key, litellm.azure_key, AZURE_OPENAI_API_KEY,
  AZURE_API_KEY. String voice is unchanged; dict voice uses name or None; other values become None. Update params
  with resolved credentials and call the B1083/B1084 speech handler with provider=azure, client=None and _is_async=aspeech.
  binary_speech_body: audio_speech pops optional max_retries default 2, overwriting the argument, but neither retries
  nor timeout/organization/separate token arguments are forwarded to SDK construction or speech.create; B531 gets
  litellm_params. Forward model/voice/input and remaining options, then wrap response.response as HttpxBinaryResponseContent.
  Propagate SDK failures unchanged in both modes. azure_speech_supported_params: AVA advertises only voice,response_format,speed;
  SSML kwargs style/styledegree/role are handled by B538. B190 speech_request_body omits extra_headers in logging
  but the SDK call retains them. azure_rate_limit_probe: get_headers is a live B157 utils.get_api_headers caller,
  not speech auth extraction. It always sends chat.completions.with_raw_response.create, defaults messages only
  when None to [{role:user,content:Hey}], and returns only non-None x-ratelimit-remaining-requests, x-ratelimit-remaining-tokens
  and x-ms-region. azure_probe_cloudflare: Probe selects Cloudflare by gateway.ai.cloudflare.com substring, appends
  /<model> and sends model=None; other bases use azure_endpoint and raise Exception model is not set for None model
  except mode=image_generation. Missing completion/headers raises Exception invalid completion response; upstream
  failures propagate.


  Write standalone Rust test azure_speech_credential_identity_isolation in betterlite-azure: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test azure_speech_secret_safe_failure in betterlite-azure: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Implement crates/betterlite-azure/src/speech.rs with adjacent tests under speech/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation azure_speech in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function speech_cases in betterlite-azure with these exact named cases (one per oracle file): openai_audio_speech_path,
  v1_audio_speech, native_speech_selection, binary_speech_body, azure_speech_supported_params, azure_rate_limit_probe,
  azure_probe_cloudflare. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_speech* using HelperCase: kind: helper
  and the externally tagged azure_speech variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_speech that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 228 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 255 production lines, 220 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 610 planned, 625 maximum changed lines.
