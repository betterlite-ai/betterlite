  - tools/oracle/cases/helpers/providers/azure-speech/**
  - tools/oracle/fuzz/corpus/helper_case/azure_speech*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/azure.py#L1362-L1540
