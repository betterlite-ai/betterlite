    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-speech/openai-audio-speech-path.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::speech_cases::case_[0-9]+_openai_audio_speech_path$/)'
  - id: case-v1-audio-speech
