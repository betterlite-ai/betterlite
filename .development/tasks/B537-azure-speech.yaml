    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_speech*")"
      && grep -lq 'azure_speech' tools/oracle/fuzz/corpus/helper_case/azure_speech* && cargo nextest run --locked
