id: B3571
title: Passthrough header query and timeout policies
description: >-
  Implement query-source precedence, protected x-pass- header forwarding and the
  separate generic-proxy and native-SDK timeout chains. Expose the pure policies
  to both router and SDK callers, with configuration values resolved through the
  existing config boundary.

  Query merge precedence: defaults (lowest), parsed URL values, request values
  (highest); blank URL values disappear under parse_qs. The x-pass- header prefix
  strips even when forward_headers is false or None. Forwarding removes
  content-length, host and accept-encoding, then adds request headers not already
  in the target set (case-insensitive comparison). After general forwarding, loop
  over request headers looking for x-pass- prefix: strip it, check if the result
  matches a protected header name (8 literal keys: authorization, api-key,
  x-api-key, x-goog-api-key, ocp-apim-subscription-key, host, content-length,
  accept-encoding) or starts with x-amz- (any case), and skip if either matches.

  Generic timeout precedence: per-endpoint value, general_settings.pass_through_request_timeout,
  then 600 seconds. SDK streaming resolves stream_timeout first at every level
  (request, deployment, router) before the generic chain. Only the winning value
  is validated as float seconds; a value in a lower-precedence field never fails
  the call. Passing an existing client bypasses timeout resolution in B101.

  Port the protected header constants, BasePassthroughUtils.get_merged_query_parameters
  and BasePassthroughUtils.forward_headers_from_request from utils.py, plus
  resolve_pass_through_request_timeout and resolve_llm_passthrough_timeout from
  timeout_utils.py. Own utils.py:1-8,11-103 (guards, headers, query methods,
  utilities declaration); keep utils.py:9 and 106-156 (encode_bedrock_runtime_modelid_arn,
  its import, class declaration) with B2203. Own the whole timeout file. Configuration
  tests must load general_settings.pass_through_request_timeout, and query string
  decoding needs a fuzz corpus.

  Use a lower betterlite-models::passthrough_policies module for header/query
  helpers. Expose get_configured_request_timeout through B305's interface without
  pulling routing execution into provider crates. Preserve the forwarding behavior
  and validation semantics exactly, including the case-insensitive header comparison,
  the exact protected names, the x-amz- prefix wildcard, and the stream-timeout
  level-by-level precedence.
