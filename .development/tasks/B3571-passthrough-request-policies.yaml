deviations:
  - what: Header forwarding comparison for custom headers uses case-insensitive matching
      (header_name.lower()) when checking for collisions in the target set.
    why: HTTP header names are case-insensitive per RFC 7230; preserving this
      behavior ensures correct forwarding semantics whether headers arrive as Title-Case,
      lowercase or mixed case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/utils.py#L79-L82
  - what: Protected header removal uses exact lowercase literal names (authorization,
      api-key, etc.) and prefix comparison (x-amz-) before forwarding is checked.
    why: These are protocol and credential headers that must never be forwarded,
      even when forward_headers is true. LiteLLM removes them first, then adds
      request headers, so they cannot be overwritten.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/utils.py#L71-L77
  - what: x-pass- header forwarding loops over the request headers after general
      forwarding (when enabled), so x-pass- can override general-forwarding results.
    why: x-pass- mechanism is independent of forward_headers setting; its headers
      are always forwarded with the prefix stripped. This allows explicit per-call
      header override even when forward_headers is false.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/utils.py#L87-L101
  - what: Timeout resolution validates only the winning value as float. A lower-precedence
      value that is not used is never validated, even if it is an invalid type.
    why: Early validation of unused values would reject valid calls that happen to
      supply an optional timeout in the wrong type at a lower level. LiteLLM only
      validates what it uses.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/timeout_utils.py#L80-L81
  - what: generic_settings key for passthrough request timeout is "pass_through_request_timeout"
      (with underscore, not hyphen).
    why: This matches LiteLLM's config key name exactly and is loaded through B002's
      existing config boundary.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/passthrough/timeout_utils.py#L8
out_of_scope:
  - Stream timeout level precedence semantics (request.stream_timeout, deployment.stream_timeout,
    router_stream_timeout) are tested with oracle cases by B101, not in this task's
    unit tests.
  - Passthrough URL construction and signature operations owned by B3570.
  - Provider timeout resolution and SDK call orchestration owned by B101.
  - HTTP request sending and timeout enforcement owned by B173.
  - Config file parsing and schema validation owned by B002.
pitfalls:
  - >-
    Protected header removal (authorization, api-key, x-api-key, x-goog-api-key,
    ocp-apim-subscription-key) blocks credentials from being forwarded through x-pass-
    overrides. This is a security boundary: a client must not be able to override or inject
    credentials in the forwarded request, even via x-pass- prefixed headers. The x-amz-*
    prefix wildcard blocks AWS SigV4 signing headers the same way.
  - >-
    Header name comparison in custom-header collision detection uses header_name.lower()
    to match HTTP semantics, but the protected header check uses exact lowercase literal
    keys: be consistent in which comparison applies where.
  - >-
    x-pass- headers are always forwarded regardless of forward_headers setting. When
    forward_headers is true, x-pass- results can override general-forwarding results
    because the x-pass- loop runs after.
  - >-
    parse_qs returns dict[str, list[str]] with all values as lists, even single values.
    The merge must flatten single-item lists back to scalars for consistency with the
    input types.
  - >-
    Timeout precedence includes both timeout and request_timeout at the request level,
    then both at the deployment level. The order matters: check timeout before request_timeout
    at both levels.
  - >-
    accept-encoding removal is required because forwarding e.g. "br" when brotli is absent
    would relay undecodable bytes to the caller. Do not skip this header when forward_headers
    is true.
  - >-
    SDK passthrough timeout only validates the winning timeout value. A wrong type at a
    lower precedence level should not fail; only the selected value is validated as float.
  - >-
    get_configured_request_timeout() returns the explicitly-set litellm.request_timeout
    (from REQUEST_TIMEOUT env var or litellm_settings) between router_timeout and the
    general_settings fallback. When it returns a value, that is the SDK-level explicit
    timeout that beats the generic proxy fallback.
review_level: standard
budget:
