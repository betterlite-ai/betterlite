dod:
  - text: Query merge returns defaults with lowest priority, URL values overriding,
      and request values with highest priority; blank URL parse_qs values disappear.
    proof: [query-merge-tests]
  - text: Header forwarding removes content-length, host and accept-encoding, adds
      request headers not already in target set (case-insensitive), and combines them.
    proof: [forwarding-tests]
  - text: x-pass- headers strip the prefix and forward unless the result is a protected
      literal or starts with x-amz-, matching case-insensitively for all checks.
    proof: [passthrough-header-tests]
  - text: Protected header names are authorization, api-key, x-api-key, x-goog-api-key,
      ocp-apim-subscription-key, host, content-length and accept-encoding (exact literals).
    proof: [protected-header-tests]
  - text: Generic passthrough timeout resolves per-endpoint, then general_settings.pass_through_request_timeout,
      then 600 seconds.
    proof: [generic-timeout-tests]
  - text: SDK passthrough streaming timeout checks stream_timeout at request, deployment
      and router levels before the generic chain; non-streaming checks request timeout,
      request_timeout, deployment timeout, deployment request_timeout, router timeout,
      then get_configured_request_timeout (explicitly-set litellm.request_timeout),
      then generic chain.
    proof: [sdk-timeout-tests]
  - text: "Timeout resolution validates only the winning value; a lower-precedence
      value in a false branch is not validated. Precedence: request stream_timeout >
      deployment stream_timeout > router stream_timeout > request timeout > request_timeout
      > deployment timeout > deployment request_timeout > router timeout > get_configured_request_timeout
      (explicitly set) > general_settings.pass_through_request_timeout > 600s."
    proof: [sdk-timeout-tests]
  - text: Configuration tests load general_settings.pass_through_request_timeout, and
      task-specific parser seeds verify timeout config parsing. A cargo-fuzz target and
      corpus verify request query string parsing.
    proof: [config-load-test, config-corpus, query-fuzz-corpus]
  - text: The task adapter invokes production logic and passes strict ruff/basedpyright
      without Any or broad suppressions.
    proof: [probe-python]
  - text: Every mutant in the header merge, forwarding and timeout functions is caught
      by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: query-merge-tests
      why: Query merge precedence and URL parsing tests must pass
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^passthrough_policies::query_merge::/)'
    - id: forwarding-tests
      why: Header forwarding and removal tests must pass
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^passthrough_policies::header_forwarding::/)'
    - id: passthrough-header-tests
      why: x-pass- prefix stripping and protected header detection tests must pass
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^passthrough_policies::passthrough_headers::/)'
    - id: protected-header-tests
      why: Protected header literal matching tests must pass
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^passthrough_policies::protected_headers::/)'
    - id: generic-timeout-tests
      why: Generic passthrough timeout resolution tests must pass
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^passthrough_policies::generic_timeout::/)'
    - id: sdk-timeout-tests
      why: SDK passthrough timeout precedence with streaming level checks must pass
      run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/^passthrough_policies::sdk_timeout::/)'
    - id: probe-python
      why: the new adapter is missing, unchanged, untyped or fails lint
      run: test -f tools/oracle/litellm/probes/passthrough_request_policies.py && test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/litellm/probes/passthrough_request_policies.py)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
    - id: config-load-test
      why: Configuration test loading pass_through_request_timeout must pass
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::passthrough_request_policies::)'
    - id: config-corpus
      why: new task-specific parser seeds, operation/key or replay are missing
      run: test -f crates/betterlite-config/fuzz/corpus/config_yaml/passthrough-valid.yaml && test -f crates/betterlite-config/fuzz/corpus/config_yaml/passthrough-invalid.yaml && git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml | grep -Fq "/passthrough-" && grep -Fq 'pass_through_request_timeout' crates/betterlite-config/fuzz/corpus/config_yaml/passthrough-valid.yaml && test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: query-fuzz-corpus
      why: Query parsing decoder, corpus, and replay test must exist
      run: test -f crates/betterlite-models/fuzz/fuzz_targets/query_parsing.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-models/fuzz/corpus/query_parsing)" && grep -q 'decode_request_query' crates/betterlite-models/fuzz/fuzz_targets/query_parsing.rs && cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(replays_the_query_parsing_corpus)'
