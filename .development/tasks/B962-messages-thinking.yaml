dod:
- text: >-
    session_cache_key sends user_id JSON {session_id:session_a,user_id:person} and gets session_a; plain person,
    invalid JSON, [], {}, session_id=7, session_id=null, empty session_id and nonstring user_id return none.
    A 65-character ASCII session id truncates to 64 characters; a 65-character Unicode id also truncates at
    64 Unicode characters, not bytes. Extra metadata fields do not affect the key.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    reasoning_effort_degradation injects supported=[high] and maps max/xhigh to high; supported=[xhigh,high]
    maps max to xhigh; minimal with supported=[low] becomes low. If no chain member is supported but medium is,
    max becomes medium. supported=[none], [] or a metadata lookup exception returns chain floors high/high/low
    for max/xhigh/minimal. low,medium,high,none and unknown strings bypass lookup unchanged; none is never an
    alternate accepted tier. Resolve with deployment_is_mapped=true.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    bridge_identity_helpers strips one leading openai/ from openai/gpt-4o when provider=openai; keeps
    vendor/openai/gpt-4o, provider=null and nonstring providers unchanged. openai/openai/gpt becomes openai/gpt.
    Only an actual Logging instance in litellm_logging_obj is returned; null, absent and a lookalike mapping
    yield none. No new logging object is created.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    response_json_behavior supplies status=200 with {id:msg_a,model:provider,extra:7} and gets all fields unchanged
    even when requested model=alias. {} remains {}; status=429 with valid JSON still returns that JSON object.
    Status=502/body=broken produces AnthropicError status=502,message=broken, with absent type/param/code.
    Valid JSON [] or null produces an internal conversion failure, not a successful empty message.
  proof: [behavior-tests, oracle, adapters]
- text: >-
    loads_summary_settings omits both settings and gets false; global true plus env false remains true;
    global false plus env TRUE becomes true; env 1, yes or " true " remains false. The config loader accepts
    litellm_settings.reasoning_auto_summary and tests the same combinations against the runtime predicate.
  proof: [config-tests, config-corpus, oracle, adapters]
- text: >-
    native_stream_factory passes a live mock SSE response containing message_start id=msg_a/model=claude-sonnet-4-5,
    one text delta=hello and message_stop. The factory returns those events in order, uses the supplied request
    body/logging context and closes the response after consumption. Supplying model=ignored-model does not
    restamp the provider event's model. Capture the real HTTP response and B2436's B102 logging projection;
    this factory never enters B979's async_sse_wrapper and has no dependency on the later B1118 entry pipeline.
  proof: [behavior-tests, oracle, adapters]
- text: New malformed session JSON and response bytes replay through the exact production decoders; helper and HTTP variants are selectable independently.
  proof: [parser-corpus, helper-corpus, new-cases]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: bridge utilities, response decoding or the native factory have no production tests
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::messages_thinking::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: the summary settings do not load with their actual precedence
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::messages_thinking::tests::loads_summary_settings($|::)/)'
  - id: config-corpus
    why: the auto-summary key is absent from config parser replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/messages-thinking-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: provider JSON and user-id JSON bypass bounded decoder replay
    run: test -f crates/betterlite-core/fuzz/fuzz_targets/messages_thinking.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/messages_thinking)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_thinking::tests::replays_corpus$/)'
  - id: adapters
    why: utility or HTTP factory comparison lacks a typed Python implementation
    run: test -f tools/oracle/helpers/messages_thinking.py && test -f tools/oracle/sdk_http/messages_stream_factory.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: helper-corpus
    why: messages_thinking is absent from the shared helper decoder
    run: grep -qE '^[[:space:]]+messages_thinking:' tools/oracle/fuzz/corpus/helper_case/messages_thinking-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no new utility and HTTP factory scenarios exist
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-thinking)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/messages-stream-factory)"
