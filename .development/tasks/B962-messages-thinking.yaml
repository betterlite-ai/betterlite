deviations: []
out_of_scope:
- B2430 owns messages/transformation.py L287-L570 request transforms; B961 owns L59-L284 native preparation.
- B960 owns _messages_carry_output_config and native beta injection L610-L709.
- B2436 owns the constructor and pass-through chunk-processor delegation; B979 separately owns detached relay scheduling and drain limits.
- B323 and B2225 own supported reasoning-effort resolution and model metadata lookup, respectively.
pitfalls:
- A plain metadata.user_id names a person and must not become a provider prompt_cache_key.
- Degrading an unsupported effort must never choose none, even if none appears first in the accepted list.
- Response parsing does not itself call raise_for_status, so a valid JSON error body still parses successfully here.
