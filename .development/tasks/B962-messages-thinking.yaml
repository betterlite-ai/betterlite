id: B962
title: Messages response decoding and reasoning bridge utilities
description: >-
  Complete the native Messages transformation facade with the response JSON decoder and stream factory, and
  implement every function in pass_through/utils.py. B2430 now owns request/effort transforms as whole functions.
  Keep this facade in betterlite-core::api::messages_thinking, using B958 response records, B567 AnthropicError,
  B2436's native stream factory, B323's supported-effort resolver and B2225 model metadata. B012 supplies logging
  context identity; the logging-object helper accepts that type only, never a dictionary resembling it.

  decode_messages_response(bytes,status,ApiLimits) returns the decoded JSON object without replacing the provider
  model or checking HTTP status. Invalid JSON raises AnthropicError with the original status and response text;
  valid non-object JSON is a typed internal failure corresponding to Python's keyword-expansion TypeError.
  decode_messages_thinking(bytes,ApiLimits) parses Claude Code metadata.user_id JSON, returning a session cache key
  or none. Bound both byte inputs and replay them through a selector-byte fuzz target in this crate.

  The config loader owns litellm_settings.reasoning_auto_summary=false and LITELLM_REASONING_AUTO_SUMMARY=false.
  Their result is OR: a true global cannot be disabled by the environment. Only lowercasing to "true" enables
  the environment flag, without trimming. DEFAULT_MAX_TOKENS is not read by any owned function here.

  HelperCall::MessagesThinking compares response parsing and the five utility operations. A separate B2401
  messages_stream_factory variant obtains an HTTP response from the loopback mock and passes that live response
  to the real factory; it drains B2436's B102 chunk-processor stream and captures provider requests and client
  events. The supplied model is unused here; request_body, HTTP response and logging context pass unchanged to
  B2436. The result is an async stream rather than a materialized list in production.

  Remaining ownership is 108 nonblank/non-comment lines, including utility declarations and stream factory.
  Allow 140 implementation, 165 tests, 130 fixtures, 115 adapters, 65 fuzz/replay, 60 config and 40 wiring,
  715 changed lines. Config and core tests share the domain module name but have separate test functions.
