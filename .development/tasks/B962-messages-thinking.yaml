checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::messages_thinking::/)
      - test(/::replays_corpus$/)'
  - id: case-adaptive-effort-native
    why: the adaptive-effort-native behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_thinking::tests::adaptive_effort_native($|::)/)'
  - id: case-nonadaptive-budget
    why: the nonadaptive-budget behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_thinking::tests::nonadaptive_budget($|::)/)'
  - id: case-thinking-temperature-drop
    why: the thinking-temperature-drop behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_thinking::tests::thinking_temperature_drop($|::)/)'
  - id: case-metadata-user-cache-key
    why: the metadata-user-cache-key behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_thinking::tests::metadata_user_cache_key($|::)/)'
  - id: case-reasoning-auto-summary
    why: the reasoning-auto-summary behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_thinking::tests::reasoning_auto_summary($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::messages_thinking::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/messages-thinking-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/messages_thinking)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/messages_thinking.rs && grep -qF "decode_messages_thinking"
      crates/betterlite-core/fuzz/fuzz_targets/messages_thinking.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::messages_thinking::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_thinking.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_thinking-*)"
      && grep -qE "^[[:space:]]+messages_thinking:" tools/oracle/fuzz/corpus/helper_case/messages_thinking-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-thinking)"
