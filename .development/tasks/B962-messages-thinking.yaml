id: B962
title: Messages thinking
description: >-
  Translate reasoning_effort and adaptive effort into native Anthropic thinking/output_config, remove incompatible
  sampling fields through diagnostics and apply prompt_cache_key derivation. Expose normalized request and response
  transforms to the native call service, retaining target-specific thinking support.


  Implement crates/betterlite-core/src/api/messages_thinking.rs. Use MessagesThinkingInput and MessagesThinkingResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions adaptive_effort_native, nonadaptive_budget, thinking_temperature_drop,
  metadata_user_cache_key, reasoning_auto_summary under api::messages_thinking::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.DEFAULT_MAX_TOKENS
  defaults to 4096; litellm_settings.reasoning_auto_summary defaults to False; env.LITELLM_REASONING_AUTO_SUMMARY
  defaults to 'false'. No environment reads occur outside betterlite-config. Test api::messages_thinking::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::messages_thinking::decode_messages_thinking(bytes:
  &[u8], limits: &ApiLimits), for _ClaudeCodeUserId.model_validate_json input user_id at litellm/llms/anthropic/pass_through/utils.py:44.
  Place its implementation in crates/betterlite-core/src/api/messages_thinking.rs and call it from the actual boundary.
  The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/messages_thinking.rs passes arbitrary bounded bytes
  to that exact decoder; api::messages_thinking::tests::replays_corpus replays newly committed seeds through the
  same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::MessagesThinking in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_thinking: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/messages/transformation.py: AnthropicMessagesConfig._translate_reasoning_effort_to_anthropic
  (L287-L345); litellm/llms/anthropic/pass_through/messages/transformation.py: AnthropicMessagesConfig._translate_adaptive_effort_for_non_adaptive_model
  (L348-L447); litellm/llms/anthropic/pass_through/messages/transformation.py: AnthropicMessagesConfig._drop_incompatible_temperature_for_thinking
  (L450-L477); litellm/llms/anthropic/pass_through/messages/transformation.py: AnthropicMessagesConfig.transform_anthropic_messages_request
  (L479-L570); litellm/llms/anthropic/pass_through/messages/transformation.py: AnthropicMessagesConfig.transform_anthropic_messages_response
  (L572-L585); litellm/llms/anthropic/pass_through/messages/transformation.py: AnthropicMessagesConfig.get_async_streaming_response_iterator
  (L587-L608); litellm/llms/anthropic/pass_through/utils.py: prompt_cache_key_from_user_id (L34-L46); litellm/llms/anthropic/pass_through/utils.py:
  litellm_logging_obj_from_kwargs (L49-L54); litellm/llms/anthropic/pass_through/utils.py: local_model_name (L57-L59);
  litellm/llms/anthropic/pass_through/utils.py: is_reasoning_auto_summary_enabled (L62-L64); litellm/llms/anthropic/pass_through/utils.py:
  normalize_reasoning_effort_value (L67-L101). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 267 owned nonblank/non-comment/non-docstring Python lines (345 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 287 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 39 config tests/seeds
  and 30 wiring; 636 total within the 640-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B175 (Provider parameter capabilities
  and mapping), B961 (Messages native prepare), B1087 (Api boundaries), B569 (Anthropic model capability and thinking
  policy), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
