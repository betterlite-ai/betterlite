id: B894
title: Key patch fields and soft-budget persistence
description: >-
  Prepare key patches and implement only the source's soft-budget transaction. Metadata preparation
  first calls B771's logging-config validator. Omitted metadata copies the existing map; explicit
  null is retained. A previously nonnull service_account_id is immutable: null metadata or an
  explicitly different value raises HTTP 400 naming the field; omission preserves it. Own the
  reserved metadata table in _types.py L5105-L5107 below the later B124 remainder; B1200 owns the two
  shared folding catalogs at L5069-L5101. Ordinary fields
  are model_rpm_limit, model_tpm_limit, model_itpm_limit, model_otpm_limit,
  default_estimated_output_tokens, default_estimated_output_tokens_per_model, mcp_rpm_limit,
  tag_rpm_limit, rpm_limit_type, tpm_limit_type, enforced_params, temp_budget_increase,
  temp_budget_expiry, allowed_vector_store_indexes, enforced_batch_output_expires_after,
  enforced_file_expires_after, throttle_on_budget_exceeded, enable_prompt_caching and
  end_user_budget_id. The premium-labelled table is disable_global_guardrails, guardrails,
  policies, tags, team_member_key_duration, prompts, logging, secret_manager_settings and
  allowed_passthrough_routes. Copy present nonnull request fields into metadata, converting
  datetime to ISO. Source invokes _premium_user_check only for truthy premium-labelled values;
  its exception is logged and aborts the remaining loop without rejecting the request. Remove
  that paid check in native code, retain other logged partial-loop failures, then always call
  B2304.encrypt_callback_vars before returning metadata for storage. Preserve its selected callback
  slots, already-prefixed ciphertext and silent original-value fallback on encryption failure;
  do not add a caller-side rejection that the source lacks.

  Soft and maximum budget validators allow None/zero but reject negative/nonfinite values with
  HTTP 400 detail.error naming soft_budget or max_budget and the received value. Existing budget_id
  updates that row's soft_budget (including null) and updated_by; missing budget_id plus null is
  a no-op, otherwise create a budget with created_by/updated_by. Remove soft_budget from key fields
  and attach a new budget_id only when creating it. _update_key_row_with_soft_budget hashes with
  B2362.hash_if_needed, then in ONE transaction writes the budget followed by the key, applying
  B2362 JSON conversion and B770 settings_updated_at and including object_permission. Rollback
  both if the key write fails. Return {token: hash, data: row_dump_or_empty}; do not extend this
  transaction to later caller cache drops or access-group writes.

  prepare_key_update_data validates router weights when router_settings is nonnull or when it was
  omitted and an explicitly changed team_id needs the stored settings revalidated. Explicit null
  router_settings suppresses that inherited revalidation. Use B2301 with the effective team id,
  then dump only explicitly set fields and remove key/new_key/grace_period. A nonnull requested
  metadata.service_account_id requires data.team_id OR existing team_id; a null team patch therefore
  does not erase that check's existing-team fallback. Move nonnull premium fields with B861,
  exclude both metadata field tables from top-level writes, and preserve explicit null ordinary
  columns. duration null or '-1' clears expires; nonempty string parses with B199; empty duration
  removes the input without touching expires. budget_duration null clears duration/reset; nonempty
  parses B2317; empty removes the field without changing the stored duration. Nonempty budget_limits
  overwrite reset_at per window and serialize; []/None store the JSON literal null, not SQL NULL.
  Validate present model_max_budget through B1224, serialize nonnull router_settings and finish
  metadata preparation. These functions have no enclosing catch or route-level error mapper.

  Object permission is untouched if absent; if present call B816 after the caller's policy guard,
  assign/log a nonnull returned id, and keep the helper's removal behavior. is_different_team is
  false for incoming None, true for new nonnull team when existing is None, otherwise compares ids.
  Resolve update token from any nonnull data.key (including empty), else existing token; if both
  are None raise ProxyException 404 not_found_error, param key, code 404, message 'Key not found.'.
  Missing Prisma raises HTTP 500 detail.error 'Database not connected'. Requested end-user budget
  prefers nonnull top-level id; metadata None returns None, but a supplied map without a usable id
  returns empty string to clear it. _general_settings returns a validated mapping of string keys
  to objects; B002 owns loading, and malformed globals fail rather than silently using {}.


  Build the production key_patch_fields module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  prepare_metadata_fields (L2325-L2373; 39 source lines), _validate_soft_budget_value (L2376-L2381; 6
  source lines), _update_key_soft_budget (L2384-L2404; 21 source lines), _apply_soft_budget_update (L2407-L2423;
  17 source lines), _update_key_row_with_soft_budget (L2426-L2457; 32 source lines), prepare_key_update_data
  (L2460-L2563; 87 source lines), _handle_update_object_permission (L2566-L2586; 17 source lines), is_different_team
  (L2589-L2594; 6 source lines), _validate_max_budget (L2597-L2611; 13 source lines), _resolve_token_to_update
  (L2685-L2695; 11 source lines), _require_prisma_client (L2979-L2982; 4 source lines), _requested_end_user_budget_id
  (L2985-L2991; 7 source lines), _general_settings (L3018-L3023; 5 source lines).


  Add the key_patch_fields operation under B856 Management::keys. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-patch-fields-*
  seed to B171 helper_case, which already owns this decoder.


  Exercise the soft-budget transaction on actual Postgres via POSTGRES_TEST_URL, falling back to
  testcontainers only when the variable is absent. postgres_pinned_rows inspects budget/key linkage;
  postgres_failure_effects rejects the second write and proves rollback of the first. Clean each schema.


  Sizing: 265 lines before docstring exclusion plus the small metadata tables; allow 300 production,
  360 behavior/Postgres tests, 65 pure adapters and 30 wiring, 755 within an 800-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
