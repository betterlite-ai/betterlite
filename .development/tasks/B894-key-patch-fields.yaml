dod:
  - text: 'Cases metadata_omitted_copies_explicit_null_retained, reserved_id_immutable_and_preserved,
      all_metadata_field_names_and_datetime, metadata_logging_check_first,
      metadata_partial_loop_error_logged, callbacks_encrypted_before_return,
      callback_existing_ciphertext_retained, callback_encrypt_failure_original_value,
      soft_and_max_negative_nonfinite_400, soft_existing_null_clears, soft_missing_null_no_create,
      soft_create_links_budget, soft_transaction_budget_then_key,
      router_revalidation_presence_matrix, service_account_existing_team_fallback,
      request_only_fields_removed, duration_null_minus_one_empty_and_valid,
      budget_duration_null_empty_valid, windows_json_null_vs_sql_null,
      model_budget_validation_and_router_json, object_permission_absent_or_updated,
      different_team_null_semantics, update_token_empty_and_missing_404,
      no_db_500, requested_end_user_budget_clear_and_precedence, general_settings_mapping_validation,
      postgres_pinned_rows and postgres_failure_effects prove preparation and transaction boundaries.'
    proof:
      - behavior-tests
      - postgres-tests
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_patch_fields::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/key_patch_fields.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/key-patch-fields-*")"
        && grep -rlq "key_patch_fields" tools/oracle/fuzz/corpus/helper_case/key-patch-fields-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/key_patch_fields::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/key_patch_fields::tests::postgres_failure_effects$/)'
