pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_chat_call in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/chat_call.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_chat_call.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
