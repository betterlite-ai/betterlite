id: B584
title: Anthropic chat HTTP execution
description: >-
  Execute Anthropic prepared chat calls using one async HTTP path and the existing provider deadlines. Preserve
  provider error handling, streaming versus buffered response selection and the no-op embedding stub. Avoid SDK
  retry behavior here; router policies own retry decisions.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  AnthropicChatCompletion.__init__ L201-L202; AnthropicChatCompletion.acompletion_function L254-L321; AnthropicChatCompletion.completion
  preparation L323-L362; AnthropicChatCompletion.completion send/projection branches L370-L538; AnthropicChatCompletion.embedding
  L540-L542.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  B689 owns HTTP send/stream helpers; this task composes those helpers with the buffered response projection.


  Named case contracts: messages_post_request: Deep-copy messages/options; pop stream=None,json_mode=False,is_vertex_request=False
  and vertex_count_tokens_location. Validate headers via B570 before selecting the prepared config supplied by B027
  composition; pass is_vertex_request back only to config transformation. Sync transform_request vs async async_transform_request
  runs before B960 update_request_with_filtered_beta, then B190 pre_call sees filtered headers/body. buffered_success:
  Async uses supplied truthy client or B173 anthropic client, POST json=data with timeout/logging; sync keeps only
  HTTPHandler client else creates B173 with timeout, POST data=json.dumps(data) with timeout/logging. Delegate selected
  config response mapper with unmodified extracted json_mode and original optional_params (distinct from transform_params).
  stream_request: Only literal True acompletion/stream select their branches. Set data.stream=True after beta filtering;
  async stream accepts only AsyncHTTPHandler supplied client and awaits B689; sync B689 sends JSON string with speed
  and request reverse-name map then wraps provider=anthropic plus B570 headers. No retry loop in this task. pre_stream_error:
  Config preparation, beta filtering and validation failures propagate before transport. Provider lookup/None error
  belongs to B027 composition and must be tested there, not recreated in the transport leaf. native_error_body:
  Successful transport response delegates B580 parsed/native-error projection, including an error body at HTTP200;
  do not preclassify by JSON error.type. unsupported_embedding: embedding() is an empty pass body and returns None
  without sending a request; it does not raise an unsupported-operation exception. chat_failure_projection: Both
  buffered paths wrap transport exception as B567 AnthropicError: status attribute or500, message exception.text-or-str
  then truthy response.text overrides, headers exception.headers if non-None else truthy response.headers. Async
  alone emits post_call with str(exception) before wrapping. Plain timeout without status becomes500, not an invented408.


  The provider-config lookup in completion L363-L368 is owned by B027 and supplied to this lower send/prepare stage;
  do not call a factory above this leaf. BaseLLM no-op initialization is supplied by B010 framework interfaces without
  provider selection.


  Write standalone Rust test chat_call_credential_identity_isolation in betterlite-anthropic: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test chat_call_secret_safe_failure in betterlite-anthropic: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Direct shared helper ownership: B2230. Reuse these named lower helpers at the source call sites rather than reproducing
  them.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B2201. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-anthropic/src/chat_call.rs with adjacent tests under chat_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_call_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  messages_post_request, buffered_success, stream_request, pre_stream_error, native_error_body, unsupported_embedding,
  chat_failure_projection. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_chat_call* using HelperCase: kind:
  helper and the externally tagged anthropic_chat_call variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_chat_call that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 268 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 290 production lines, 225 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 655 planned, 675 maximum changed lines.
