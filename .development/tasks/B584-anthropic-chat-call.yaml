    why: The messages-post-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-anthropic --no-tests=fail -E 'test(/::chat_call_cases::case_[0-9]+_messages_post_request$/)'
  - id: case-buffered-success
