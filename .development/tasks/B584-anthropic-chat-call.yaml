id: B584
title: Anthropic chat HTTP execution
description: >-
  Execute Anthropic prepared chat calls using one async HTTP path and the existing provider deadlines. Preserve
  provider error handling, streaming versus buffered response selection and the explicit unsupported embedding method.
  Avoid SDK retry behavior here; router policies own retry decisions.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  AnthropicChatCompletion.__init__ L201-L202; AnthropicChatCompletion.acompletion_function L254-L321; AnthropicChatCompletion.completion
  L323-L538; AnthropicChatCompletion.embedding L540-L542.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  B689 owns HTTP send/stream helpers; this task composes those helpers with the buffered response projection.


  Implement crates/betterlite-anthropic/src/chat_call.rs with adjacent tests under chat_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation anthropic_chat_call in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_call_cases in betterlite-anthropic with these exact named cases (one per oracle file):
  messages_post_request, buffered_success, stream_request, pre_stream_error, native_error_body, unsupported_embedding,
  transport_timeout. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_chat_call* using HelperCase: kind:
  helper and the externally tagged anthropic_chat_call variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_chat_call that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 274 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 295 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 511 planned, 525 maximum changed lines.
