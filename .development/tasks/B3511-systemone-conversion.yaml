id: B3511
title: SystemOne conversion and decision provider contract
description: >-
  Implement the bidirectional SystemOne/IR conversions and inherited provider behavior in betterlite-openai's lower decision module, plus the small TypeSafe specialization. The conversions preserve fallback numeric question keys for unnamed questions, image rejection on OpenAI input, refusal omission in response alignment, reserved-header warnings, and the difference between invalid JSON and validated-but-invalid provider responses.

  SystemOne requests convert to IR through question keying and image screening; IR converts back to SystemOne with serialized levels and criteria mapping. OpenAI input messages concatenate into state text or reject images. Response answers reconstruct from IR through choice/score/predicate answering, dropping refusals and using numeric keys when questions lack names.

  The BaseDecisionsConfig class provides inherited provider behavior: credential resolution through environment names or defaults, header validation with reserved-header filtering, cost tracking, AWS signing detection, URL normalization, error translation and response parsing. Concrete providers (TypeSafe, Strands, OpenAI) override specific methods. TypeSafe uses TYPESAFE_API_KEY and TYPESAFE_API_BASE with default https://api.typesafe.ai.

  Copy the conversion functions and BaseDecisionsConfig from litellm/llms/base_llm/decisions/transformation.py into a new module in crates/betterlite-openai/src/decisions/, and add TypeSafeDecisionsConfig to a new decisions module in crates/betterlite-openai/src/providers/typesafe/. Validate round-trip conversions (SystemOne to IR to SystemOne, OpenAI to IR to SystemOne) in tests; B3514 will consume the transport interface.

