id: B657
title: Bedrock Responses and inline-image policy
description: >-
  Add BedrockResponsesConfig for model-selected Bedrock Runtime URLs, bearer/signature preparation and Responses
  request projection. Preserve supported parameter gates and native file-search capability. Remote image traversal
  identifies URL blocks but cannot download them under the current policy; supplied inline images use existing bounded
  media processing.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/responses/transformation.py:
  _without_chat_completions_route L80-L81; resolve_bedrock_bearer_token L84-L85; _remote_image_url L88-L94; _blocks_under
  L97-L102; _image_blocks L105-L109; collect_remote_image_urls L112-L120; _inline_block L123-L127; _inline_value
  L130-L133; _inline_item L136-L144; inline_remote_image_urls L147-L154; BedrockOpenAIResponsesConfig.__init__ L160-L167;
  BedrockOpenAIResponsesConfig.for_model L170-L184; BedrockOpenAIResponsesConfig.custom_llm_provider L187-L188;
  BedrockOpenAIResponsesConfig.get_error_class L190-L194; BedrockOpenAIResponsesConfig.get_complete_url L196-L216;
  BedrockOpenAIResponsesConfig.supports_native_file_search L218-L219; BedrockOpenAIResponsesConfig.validate_environment
  L221-L231; BedrockOpenAIResponsesConfig.sign_request L233-L256; BedrockOpenAIResponsesConfig.map_openai_params
  L258-L288; BedrockOpenAIResponsesConfig.transform_responses_api_request L290-L305; BedrockOpenAIResponsesConfig.async_transform_responses_api_request
  L307-L323; BedrockOpenAIResponsesConfig._transform_inlined_request L325-L345.


  API-family helpers are prerequisites by their plan/B080 part IDs; expose their pure records/functions below betterlite-core
  or inject a typed preparation/projection callback at provider composition. Provider leaves must never import betterlite-core,
  and no copied helper algorithm is permitted.


  remote-url-current-rejection supplies an http:// image or PDF URL requiring local bytes and expects ImageFetchError
  status 400 before transport under the current open request-download decision; inject the same failed-download
  seam into the pinned helper. Inline bytes continue to compare normally; provider-forwardable URL descriptors remain
  unchanged where the source forwards them.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse bedrock_supports_openai_responses from B690 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Named case contracts: bedrock_responses_model_route: for_model rejects falsey model or false B690 bedrock_supports_openai_responses
  after removing one leading chat_completions/. Otherwise instantiate this Runtime config (not Mantle); constructor
  stores sync/async fetch seams and delegates the no-op BaseResponses initializer B2202. custom_llm_provider bedrock.
  _without_chat_completions_route only removes a leading prefix once. responses_bearer_auth: Bearer selector is
  truthy explicit api_key then B129 AWS_BEARER_TOKEN_BEDROCK. validate_environment reads GenericLiteLLMParams.api_key,
  returns caller headers unchanged if falsey resolved token, otherwise overrides Authorization with Bearer {token}.
  sign_request returns supplied headers,None when the same selector succeeds and does not add Authorization itself.
  responses_sigv4: Without bearer, delegate B595 _sign_request service bedrock and original parameters/model/stream/fake_stream
  without passing api_key. Error factory B682 preserves status,message,headers including x-amzn-RequestId, unlike
  the OpenAI blank-response factory. response_option_gates: Call B506 map_openai_params first with original drop_params.
  Remove key background whenever present, even False/None; warn Bedrock Runtime Responses API: dropping unsupported
  parameter(s) {sorted tuple} that the endpoint rejects. This removal does not depend on drop_params. If tools not
  list, leave it untouched. Otherwise B907 retains exactly function,mcp,custom,apply_patch,namespace,tool_search,computer
  types and all nondict entries; unknown/missing types dropped. Warn Bedrock Runtime Responses API: dropping unsupported
  tool type(s) {list of sorted unique stringified types} (supported: {sorted allowed types}). when any dropped,
  omit tools if none retained, else preserve retained order. Empty original tools with no drops remains []. native_file_search_flag:
  supports_native_file_search=False. File-search/server tools are not enabled merely because an OpenAI Responses
  request format is accepted; use the same unsupported-tool case for file_search and web_search. inline_image_traversal:
  Only list input is traversed. For dict items inspect content then output in that order, each accepting a list
  or single dict. Select dict blocks of exact type input_image or computer_screenshot with string image_url starting
  case-sensitive http:// or https://. Ignore nested URL objects,input_file,nonstring URLs,uppercase schemes,s3://,data:
  and deeper nested blocks. Collect distinct URLs in first-seen order. remote_url_current_rejection: Both sync and
  async production paths reject a recognized remote image URL requiring bytes with ImageFetchError400 before transport
  and with zero network calls, under the open request-download decision. The pinned oracle uses injected failing
  fetch callbacks to compare this failure seam; test local no-network policy separately. Merge the old remote_image_no_fetch
  duplicate. No actual downloader is built. Source sync would fetch distinct URLs in order, async gathers them,
  but neither is enabled in betterlite. responses_runtime_url: Resolve region with B591 _get_aws_region_name(litellm_params,model=None).
  Override chain truthy explicit api_base,litellm_params.aws_bedrock_runtime_endpoint,AWS_BEDROCK_RUNTIME_ENDPOINT;
  else B591 partition-aware runtime endpoint. Trim trailing slashes then remove first matching suffix in order /openai/v1/responses,/v1/responses,/responses,/openai/v1,/v1;
  append /openai/v1/responses. Preserve unrecognized path/query suffixes; no Mantle host selection. inline_image_replacement:
  Pure inline_remote_image_urls returns input unchanged for nonlist input or empty supplied mapping. Otherwise shallow-copy
  items/fields only when content/output is list/dict, replace recognized block.image_url by mapping[url], preserve
  all other fields/order; missing mapping entry raises KeyError, no fallback fetch. Test this pure replacement using
  fixture data URIs without performing downloads. codex_input_rewrite: After the inline stage call B907 normalize_codex_input_items.
  If rewritten_types nonempty warn Bedrock Runtime Responses API: rewrote Codex input item type(s) {types} that
  the endpoint rejects. Then B507 transform_responses_api_request receives model without leading chat_completions/,normalized
  input and unchanged params/headers. Reuse all B907 normalization fixtures and B507 parent request/default cases;
  no hoist_additional_tools call is added here.


  Write standalone Rust test runtime_responses_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test runtime_responses_secret_safe_failure in betterlite-bedrock: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/responses.rs with adjacent tests under responses/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation bedrock_services_responses in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function responses_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  bedrock_responses_model_route, responses_bearer_auth, responses_sigv4, response_option_gates, native_file_search_flag,
  inline_image_traversal, remote_url_current_rejection, responses_runtime_url, inline_image_replacement, codex_input_rewrite.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_responses* using HelperCase:
  kind: helper and the externally tagged bedrock_services_responses variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_responses that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 225 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 300 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 710 planned, 725 maximum changed lines.
