checks:
  optional:
  - mutants
  commands:
  - id: case-bedrock-responses-model-route
    why: The bedrock-responses-model-route behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_bedrock_responses_model_route$/)'
  - id: case-responses-bearer-auth
    why: The responses-bearer-auth behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_responses_bearer_auth$/)'
  - id: case-responses-sigv4
    why: The responses-sigv4 behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_responses_sigv4$/)'
  - id: case-response-option-gates
    why: The response-option-gates behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_response_option_gates$/)'
  - id: case-native-file-search-flag
    why: The native-file-search-flag behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_native_file_search_flag$/)'
  - id: case-inline-image-traversal
    why: The inline-image-traversal behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_inline_image_traversal$/)'
  - id: case-remote-image-no-fetch
    why: The remote-image-no-fetch behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_remote_image_no_fetch$/)'
  - id: case-remote-url-current-rejection
    why: The remote-url-current-rejection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::responses_cases::case_[0-9]+_remote_url_current_rejection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_responses.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_responses*")"
      && grep -lq 'bedrock_services_responses' tools/oracle/fuzz/corpus/helper_case/bedrock_services_responses*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_responses$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
