deviations:
- what: Request http(s) images that need local bytes fail with ImageFetchError status400 before any outbound fetch.
    Inline data and source-forwarded s3:// or other descriptors keep their pinned handling.
  why: The URL-download product decision is open. Build no downloader, request-path filesystem access or follow-on
    feature that depends on fetching.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/responses/transformation.py#L80-L345
out_of_scope:
- B030 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- background is dropped by key presence, so even background=False produces the warning.
- Image traversal reaches only content/output fields, not an arbitrary recursive scan of the Responses request.
budget:
  max_changed_lines: 725
  max_new_expects: 0
review_level: security
