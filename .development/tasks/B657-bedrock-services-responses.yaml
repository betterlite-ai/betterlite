  why: >-
    Own _without_chat_completions_route, resolve_bedrock_bearer_token, _remote_image_url, _blocks_under, _image_blocks,
    collect_remote_image_urls, _inline_block, _inline_value, _inline_item, inline_remote_image_urls, BedrockOpenAIResponsesConfig.__init__,
    BedrockOpenAIResponsesConfig.for_model, BedrockOpenAIResponsesConfig.custom_llm_provider, BedrockOpenAIResponsesConfig.get_error_class,
    BedrockOpenAIResponsesConfig.get_complete_url, BedrockOpenAIResponsesConfig.supports_native_file_search, BedrockOpenAIResponsesConfig.validate_environment,
    BedrockOpenAIResponsesConfig.sign_request, BedrockOpenAIResponsesConfig.map_openai_params, BedrockOpenAIResponsesConfig.transform_responses_api_request,
    BedrockOpenAIResponsesConfig.async_transform_responses_api_request, BedrockOpenAIResponsesConfig._transform_inlined_request.
    Other functions in this file remain with the owners listed below.
