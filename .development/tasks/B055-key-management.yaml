id: B055
title: Register key generation and management routes
description: >-
  Serve /key/generate and /key/service-account/generate with the typed creation and event services, then
  register every key-management route supplied by the split tasks. Wire post-commit access-group synchronization
  and optional sinks through server state. Preserve raw generated key response only for callers authorized
  by the source policy; subsequent info responses never regenerate it.


  Depend on B864 check_org_admin_can_generate_keys and B861 _check_passthrough_routes_caller_permission
  for both POST /key/generate and POST /key/service-account/generate. Preserve litellm-changed-by request
  header attribution; it is not an invented response header. Compose the already registered key route
  modules once.


  Build the production key_management module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/key_management_endpoints.py:
  generate_key_fn (L1947-L2150; 179 source lines), generate_service_account_key_fn (L2159-L2322; 145 source
  lines).


  Register these actual HTTP routes and aliases exactly once: POST /key/generate -> generate_key_fn; POST
  /key/service-account/generate -> generate_service_account_key_fn. For each route send a typed successful
  request, an invalid or missing target, and a caller lacking that route permission through B001 HttpCase
  against the running pinned MIT proxy and betterlite. Public login/session routes instead prove bad credentials
  or invalid/expired codes. Compare status, response model including null/absent fields, error type/param/code,
  content-type, redirect/cookie headers and litellm-changed-by where read. Do not reduce endpoint checks
  to direct helper invocations. handle_exception_on_proxy controls management error mapping; keep source
  partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 324 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  324 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 537 changed lines estimated within a 550-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
  paths:
    - crates/betterlite-server/src/key_management.rs
    - crates/betterlite-server/src/key_management/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/app.rs
    - tools/oracle/cases/management/key-management/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L1947-L2322
    why: Pinned implementation and exact ownership boundary for key_management.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L1376-L1396
    why: GenerateKeyRequest request/response fields and defaults.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L1947-L2150
    why: Own generate_key_fn; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L2159-L2322
    why: Own generate_service_account_key_fn; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L1340-L1430
    why: KeyRequestBase, GenerateKeyRequest and GenerateKeyResponse wire contracts.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8205-L8321
    why: Management exception HTTP status and public error translation.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: generate_key_http, service_account_http,
      key_create_then_auth, delete_then_denied, rotation_grace_http, unauthorized_no_write.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_management::tests::/)
        - test(/replays_the_/)'
