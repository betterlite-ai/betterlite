id: B055
title: Standard and service-account key generation routes
description: >-
  Own key_management_endpoints.py generate_key_fn L1947-L2150 and generate_service_account_key_fn
  L2159-L2322. Register POST /key/generate and /key/service-account/generate once with B052 auth,
  B770 GenerateKeyRequest and B865 management effects. B770/B1224 own all request field defaults
  and validation, including custom key format, model/budget fields and key_type defaults. Both read
  optional litellm-changed-by for attribution and pass it to B773, not as a response header.

  Normal generation requires a database or HTTP500 common database detail.error, DEBUG-logs entered
  /key/generate, then B864 checks organization-admin scope. Reject nonnull max_budget when negative
  or nonfinite with HTTP400 detail.error max_budget must be a non-negative finite number. Received:
  <value>; zero is valid. B894 validates soft_budget next. B1224 supplies the optional custom generation
  hook: require a coroutine or ValueError user_custom_key_generate must be a coroutine; await once,
  use decision default true and message default Authentication Failed - Custom Auth Rule, and deny
  any falsey decision with HTTP403. A malformed result or hook error propagates to this route's catch.

  B892 checks allowed routes with the actual field-presence bit, then B861 checks pass-through routes.
  For any caller other than exact PROXY_ADMIN.value and data.user_id=None, assign caller.user_id even
  when null and WARN with that ID. A nonnull team ID invokes B737 with check_db_only=true and parent
  span. Every lookup error DEBUG-logs; nonadmins then get HTTP400 Team not found for team_id=<id>.
  Non-admin users cannot create keys for non-existent teams.; proxy admins continue with no team.
  Run B771 key_generation_check for KEY_GENERATE, then B772 team limits when a row exists, then B772
  project limits for nonnull project_id. Finally B773 performs common generation with data/caller/
  changed_by/team row. This route catches every exception, logs it, and calls B124 handle_exception_on_proxy:
  HTTP errors retain status/detail but use internal_server_error; ProxyException survives; others
  use status_code or500 and internal_server_error with openai_error_param.

  Service-account order differs: database500, B864 org scope, B892 allowed routes, B861 pass-through,
  then B771 validates service-account team ID. If metadata or service_account_id is null, copy metadata
  and stamp service_account_id from truthy key_alias or UUID4; retain existing empty/false/zero IDs.
  DEBUG-log entered /key/generate, then run the same custom hook with the stamped request. Team lookup
  uses the same writer-only settings but every error only DEBUG-logs and leaves team=None, including
  nonadmin callers. Run team limits before B771 KEY_GENERATE_SERVICE_ACCOUNT policy. Only afterward
  force data.user_id=None and invoke B773. This route has no local max/soft-budget validation or project
  limit call and no local except/handle_exception_on_proxy wrapper; preserve lower-helper/schema checks
  and B003/B865 error behavior rather than adding normal-key branches.

  Both routes delegate stored token hashing, callback-variable encryption, ordered writes, access-group
  synchronization and events to B773 and its dependencies at their existing positions. Do not move
  synchronization to a new post-commit phase or make the sequence atomic. Tests inspect partial effects
  when generation fails. Return B773's raw generated key only in the creation response; prove it
  authenticates while its persisted token is hashed. No secret is logged by new Rust diagnostics.

  Implement key_management with files below300 lines and adjacent tests. B860 provisions independent
  Postgres schemas via POSTGRES_TEST_URL or testcontainers; B001 HttpCase compares real route bodies,
  errors and writes. Reuse B770 request decoding; no parser/fuzz target. Allow 210 production, 330
  table-driven tests and 90 wiring lines, 630 within a 700-line gate.
scope:
  paths:
    - crates/betterlite-server/src/key_management.rs
    - crates/betterlite-server/src/key_management/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/key-management/**
    - tools/oracle/helpers/b055.py
    - tools/oracle/helpers/b055/**
    - tools/oracle/src/helpers/server/b055.rs
    - tools/oracle/src/helpers/server/b055/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L1940-L2150
    why: Normal route validation, custom hook, writer read, limits and local error mapper.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L2153-L2322
    why: Service-account order, metadata stamp, forced owner and absence of local error wrapping.
dod:
  - text: 'Named cases: no_database500_both_routes, org_scope_before_hook,
      normal_max_budget_null_zero_negative_nonfinite, soft_budget_before_custom_hook,
      hook_absent_async_sync_and_malformed_result, hook_decision_falsey_and_default_message,
      allowed_routes_presence_before_passthrough, nonadmin_owner_autoassign_warning,
      writer_team_lookup_parent_span_and_debug_failure, admin_missing_team_continues_nonadmin400,
      normal_policy_then_team_then_project_limits, service_team_validation_before_stamp,
      service_id_alias_uuid_null_and_existing_falsey, service_hook_sees_stamp_and_original_owner,
      service_team_error_tolerated_then_limits_before_policy, service_owner_cleared_only_after_policy,
      service_no_added_project_or_budget_route_check, changed_by_forwarded_to_common_generation,
      normal_catch_error_fields_service_no_local_wrapper, generation_order_partial_writes,
      generated_raw_key_authenticates_stored_hash_only, source_management_effects_once.'
    proof: [behavior-tests, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Generation order, fields, permissions or failure effects differ from source.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^key_management::tests::/) - test(/replays_the_/)'
oracle_cases:
  - tools/oracle/cases/management/key-management/normal-and-service-success.yaml
  - tools/oracle/cases/management/key-management/normal-budget-and-hook-denial.yaml
  - tools/oracle/cases/management/key-management/owner-assignment-and-team-failure.yaml
  - tools/oracle/cases/management/key-management/service-id-and-policy-order.yaml
  - tools/oracle/cases/management/key-management/changed-by-and-partial-generation-effects.yaml
  - tools/oracle/cases/management/key-management/route-error-mapping-difference.yaml
deviations: []
out_of_scope:
  - B773 owns common generation/write order, B893 the underlying hash/persistence operations.
  - B770/B1224 own request fields/hooks; B771/B772 own generation permission and parent-limit policy.
  - Update, deletion, rotation, lookup and listing remain their existing key task owners.
pitfalls:
  - Normal generation runs its policy before team limits; service-account generation reverses them.
  - Service-account hooks see the supplied user_id, which is cleared only after the policy check.
budget:
  max_changed_lines: 700
  max_new_expects: 0
review_level: security
