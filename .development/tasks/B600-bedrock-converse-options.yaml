id: B600
title: Bedrock Converse reasoning and model options
description: >-
  Add ConverseOptions and capability/parameter helpers for Nova, GPT reasoning, DeepSeek and Anthropic families.
  Preserve sampling policy, tool-support metadata, native Nova grounding, effort representation and the thinking-budget
  clamp with a diagnostic; model lookup uses the injected catalog.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig.__init__ L143-L154; AmazonConverseConfig.custom_llm_provider L157-L158; AmazonConverseConfig.get_config_blocks
  L161-L166; AmazonConverseConfig.get_config L299-L314; AmazonConverseConfig._is_openai_gpt_reasoning_model L388-L389;
  AmazonConverseConfig._requires_min_max_tokens L392-L393; AmazonConverseConfig._is_nova_2_model L395-L444; AmazonConverseConfig._map_web_search_options
  L446-L473; AmazonConverseConfig._transform_reasoning_effort_to_reasoning_config L475-L518; AmazonConverseConfig._handle_reasoning_effort_parameter
  L520-L569; AmazonConverseConfig._validate_anthropic_adaptive_effort L572-L591; AmazonConverseConfig._clamp_thinking_budget_tokens
  L594-L609; AmazonConverseConfig._is_deepseek_model L611-L612; AmazonConverseConfig._is_deepseek_r1_model L614-L615;
  AmazonConverseConfig._model_accepts_anthropic_thinking_param L617-L631; AmazonConverseConfig._model_rejects_reasoning_effort_param
  L633-L639; AmazonConverseConfig._supports_sampling_params L642-L656; AmazonConverseConfig.get_supported_openai_params
  L658-L733; AmazonConverseConfig._auto_tool_choice L736-L737.


  Reuse AnthropicConfig._map_reasoning_effort from B569 (litellm/llms/anthropic/chat/transformation.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicConfig._raise_invalid_reasoning_effort from B569 (litellm/llms/anthropic/chat/transformation.py);
  its implementation remains with that prerequisite.


  Reuse AnthropicConfig._validate_effort_for_model from B569 (litellm/llms/anthropic/chat/transformation.py); its
  implementation remains with that prerequisite.


  Reuse AnthropicModelInfo._get_model_capability from B688 (litellm/llms/anthropic/common_utils.py); its implementation
  remains with that prerequisite.


  Named case contracts: nova2_reasoning_config: Nova2 detector removes first matching bedrock/converse/,bedrock/,converse/
  wrapper, then one of us.,eu.,apac.; recognize leading amazon.nova-2- or nova-2/. Other region prefixes/casing
  do not match. Effort low,medium,high -> {reasoningConfig:{type:enabled,maxReasoningEffort:<value>}}. Other values
  ->BadRequestError400 Invalid reasoning_effort value '<value>' for Nova 2 models. Supported values: ['low', 'medium',
  'high']; model alwaysamazon.nova-2-lite-v1:0, providerbedrock_converse. gpt_reasoning_object: GPT detector searches
  openai\.gpt-\d anywhere, unlike B598 bounded family regex. _requires_min_max_tokens also accepts xai\.grok-. Reasoning
  handler checks case-sensitive gpt-oss or deepseek substring first, then GPT -> replaces reasoning with {effort:<raw
  string>}, then Nova2, then Anthropic. Do not validate raw GPT effort here or preserve old reasoning keys. gpt_oss_and_deepseek_effort:
  gpt-oss/deepseek handler passes raw reasoning_effort unchanged, including none/unknown strings. Separate predicates
  detect deepseek anywhere in original/base, and deepseek.r1 for R1. R1 rejects reasoning-effort in supported-param
  listing/composer, while other DeepSeek lists it; no DeepSeek accepts Anthropic-shaped thinking even when supports_reasoning
  flag true. anthropic_adaptive_effort: B569 mappingNone removes thinking and whole output_config. Otherwise set
  thinking; adaptive capability via B688 preserves an existing dict output_config and setdefault effort using minimal/low->low,medium/high/xhigh/max
  as-is; invalid mapping invokes B569 invalid-effort error. B690 normalizes ceiling then validate effective effort,
  assign output_config and _output_config_normalized=true. Existing effort wins even invalid. Validation permits
  low,medium,high,xhigh,max, otherwise BadRequestError400 Invalid reasoning_effort/output_config.effort value: <repr>.
  Must be one of: 'low', 'medium', 'high', 'xhigh', or 'max'. Model/provider original/bedrock_converse; B569 capability
  error follows membership validation. minimum_thinking_budget: Dict thinking with int budget_tokens (including
  bool) below integer BEDROCK_MIN_THINKING_BUDGET_TOKENS env default1024 clamps in place and debug Bedrock requires
  thinking.budget_tokens >= <minimum>, got <budget>. Clamping to minimum. Floating/string/None/missing budget untouched;
  no requirement thinking.type=enabled and no upper max-token clamp here. nova_web_search_only: Any case-insensitive
  nova substring returns {systemTool:{name:nova_grounding}}, ignoring all web_search_options members including search_context_size/user_location;
  empty dict enables it. Non-Nova returns None and debug web_search_options passed but model <model> is not a Nova
  model. Nova grounding is only supported on Amazon Nova models. This helper does not validate model support through
  the catalog. sampling_capabilities: B2203 base begins anthropic ->true regardless of explicit capability false
  (later Anthropic gate handles it). Else query B688 supports_sampling_params for original then global.<base>,us.<base>,eu.<base>;
  first non-None flag wins includingFalse, unknownall ->true. Literal Claude model-name shortcuts for thinking are
  claude-3-7,claude-sonnet-4,claude-opus-4, then supports_reasoning original/base. supported_param_list: Base ordered
  list max_tokens,max_completion_tokens,stream,stream_options,stop, optionaltemperature/top_p when sampling supported,extra_headers,response_format,requestMetadata,service_tier,parallel_tool_calls.
  Case-sensitive arn substring anywhere adds tools,tool_choice,thinking,reasoning_effort,output_config and web_search_options
  iff nova casefold substring, then returns. Otherwise tools for base prefixes anthropic,mistral,cohere,meta.llama3-1/3-2/3-3,meta.llama4,amazon.nova
  or supports_function_calling flag. Nova base addsweb_search_options; tool_choice requires capability on original/base.
  Reasoning order GPT-OSS/GPT original/base, DeepSeek(nonR1),Nova2,Anthropic-thinking (adds thinking,reasoning_effort,output_config).
  Anthropic base addscontext_management last. _auto_tool_choice returns {auto:{}}. converse_class_defaults: Constructor
  stores only non-None maxTokens,stopSequences,temperature,topP,topK on the class, preserving falsey values; initial
  annotations create no runtime defaults. Isolate class state in oracle fixtures. get_config reads own class dictionary,
  excludes underscore names, None, function,builtin,classmethod,staticmethod; unlike BaseConfig it does not exclude
  property descriptors, so capture their kind rather than serializing Python objects. custom_llm_provider property
  returns bedrock_converse. get_config_blocks returns guardrailConfig,performanceConfig,serviceTier block types
  in that order.


  Load BEDROCK_MIN_THINKING_BUDGET_TOKENS, AmazonConverseConfig.maxTokens, AmazonConverseConfig.stopSequences, AmazonConverseConfig.temperature,
  AmazonConverseConfig.topP, AmazonConverseConfig.topK through betterlite-config, with injected environment lookup
  and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest bedrock_converse_options_config_cases; each named loads_<key> case invokes the real B002 loader,
  checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  B688 owns the BEDROCK_MIN_THINKING_BUDGET_TOKENS loader and its tests; consume that value rather than registering
  this key again.


  Shared supports/declared capability functions are B2221; raw Anthropic catalog flags are B2216 where the owned
  code calls those functions. These are lower prerequisites, not B157 SDK calls.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  Implement crates/betterlite-bedrock/src/converse_options.rs with adjacent tests under converse_options/. Keep
  each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_converse_options in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_options_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): nova2_reasoning_config, gpt_reasoning_object, gpt_oss_and_deepseek_effort, anthropic_adaptive_effort, minimum_thinking_budget,
  nova_web_search_only, sampling_capabilities, supported_param_list, converse_class_defaults. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_options* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_options variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_options that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 322 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 270 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 110 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 765 planned, 775 maximum changed lines.
