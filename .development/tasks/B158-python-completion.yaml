id: B158
title: Python completion and acompletion, streaming iterators and response objects
description: >-
  This is the last part of the entry. With the Rust call (B5656), the native bridge (B5659) and the response classes (B5657,
  B5658) in place, build the public Python functions so `betterlite.completion(...)` works where `litellm.completion(...)`
  worked. It is a thin layer: Python collects arguments and settings into JSON, calls `NativeSession`, and builds response
  objects from the JSON that comes back. Logic that isn't about Python objects stays in Rust.


  Everything lives in the package `python/betterlite/_completion/`, in files under the 300-line limit, and
  `python/betterlite/main.py` re-exports the same names so `from betterlite.main import completion` works. `_completion/__init__.py`
  has the explicit `__all__`. `python/betterlite/__init__.py` picks those names up through one line, `from
  betterlite._completion import *`. That line is written once by the architect, the same way as the `completion` lines in
  `src/lib.rs` that B5659 describes. Never edit that file, and add a new public name by adding it to `__all__`. Each new Python
  family works the same way: its own `_<family>` package, its own `__all__`, one star line.


  `completion` and `acompletion` keep LiteLLM's parameter names, order and defaults (a test compares `inspect.signature`).
  `acreate` (litellm/utils.py L7131-L7132) returns `acompletion(*args, **kwargs)`, so it is a plain function that returns a
  coroutine. `completion` with `acompletion=True` returns a coroutine as well.


  A small number of values can't be JSON, and each has one rule. `client` and `shared_session` raise a named
  `UnsupportedCallArgument` with the parameter name, since a Python HTTP client can't drive the Rust one. `logger_fn` is
  accepted, not called, and logs one warning. `timeout` may be an `httpx.Timeout`: read `connect`, `read`, `write` and `pool`
  through a `typing.Protocol`, because httpx is no dependency of the wheel. A pydantic class in `response_format` goes through
  `model_json_schema()` and takes the shape from `type_to_response_format_param` (llms/base_llm/base_utils.py L179-L212).
  A `Message` in `messages` and a `ModelResponse` in `mock_response` go through `model_dump()`. An Exception in `mock_response`
  follows `_handle_mock_potential_exceptions`: an `openai.APIError` is raised as is, and anything else becomes `MockException`
  with `status_code`, `text` and `llm_provider` read from it, or 500, `str(e)` and the provider or `openai` when missing.


  `litellm.proxy_auth` is a Python object too. `_ProxyAuthHeadersProvider` and `_proxy_auth_headers` (main.py L1232) live here:
  call `get_auth_headers()` before the native call, log "Failed to get proxy auth headers: %s" as a warning on failure, and
  pass the map as `proxy_headers`. The settings snapshot reads only the names `CompletionSettings` lists from `_settings`, at
  call time, so a user's later assignment to `betterlite.drop_params` takes effect.


  `_completion/errors.py` holds one explicit `dict` from the `type` in B5659's `NativeError` JSON to B163's exception classes.
  Each class is built with its own fields, and `raise ... from` keeps the native error as the cause. A `type` missing from
  the table raises a named `UnknownNativeError` with the payload. It never becomes a generic error silently.


  `CustomStreamWrapper` is the Python face of `NativeChatStream`. `__iter__`, `__next__`, `__aiter__`, `__anext__`, `close` and
  `aclose` turn each chunk's JSON into `ModelResponseStream` and raise `StopIteration` or `StopAsyncIteration` at the end. A
  stream result from `completion` is one of these, and `isinstance(response, CustomStreamWrapper)` holds as it does in
  LiteLLM.


  `LiteLLM`, `Chat`, `Completions` and `AsyncCompletions` (L364-L417) follow LiteLLM: `timeout` 600, `max_retries` from
  `num_retries`, `Chat` picks `AsyncCompletions` when `acompletion` is true in params and pops it. `create` merges its kwargs
  into `self.params`, takes `model or self.params.get("model")`, and calls `router_obj.completion` when a router is set.


  `completion_with_retries` and `acompletion_with_retries` (L6087-L6136) are plain loops here, because `original_function` is a
  Python callable. Their rules match the Rust retry entry in B5656: `num_retries` pops with default 3, inner `num_retries` and
  `max_retries` are 0, `constant_retry` is the default strategy, `exponential_backoff_retry` waits `2^(attempt-1)` capped
  at 10 seconds, and the last error is raised unchanged.


  `config_completion` (L8845-L8853) calls `completion(**kwargs, **config)` with the JSON read from `betterlite.config_path`, and
  otherwise raises the same `ValueError`. `adapter_completion` and `aadapter_completion` (L7698-L7761) search
  `betterlite.adapters` by id, raise "No matching adapter given. Received 'adapter_id'={adapter_id}, litellm.adapters={...}"
  when none matches, call `translate_completion_input_params`, then `translate_completion_output_params` or
  `translate_completion_output_params_streaming` on the adapter. `acount_tokens` (L9277-L9372), `check_valid_key` and
  `valid_model` send their arguments to `NativeSession` and build `TokenCountResponse` or a bool. That last pair is how B5364's
  `ModelProbe` reaches a real completion from Python.


  The tests call `litellm` and `betterlite` with the same arguments against one local HTTP server speaking the OpenAI chat
  API (`tests/completion_server.py`) and compare results, with `id` and `created` removed. `check_valid_key` uses the same
  server through `OPENAI_API_BASE`, with a 401 for a bad key.
scope:
  paths:
  - crates/betterlite-python/python/betterlite/_completion/**
  - crates/betterlite-python/python/betterlite/main.py
  - crates/betterlite-python/tests/completion_server.py
  - crates/betterlite-python/tests/test_completion.py
  - crates/betterlite-python/tests/test_completion_stream.py
  - crates/betterlite-python/tests/test_completion_classes.py
  lint_tables: false
