- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7698-L7761
  why: The adapter functions.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8845-L8853
  why: config_completion.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L7131-L7165
  why: acreate, valid_model and check_valid_key.
dod:
- text: "`completion` and `acompletion` keep LiteLLM's signature, and a plain call gives the same `model_dump()` as LiteLLM against one server."
  proof: [completion-plain, completion-signature]
- text: "`acreate` and `completion(acompletion=True)` return a coroutine that gives the same response."
  proof: [completion-async]
- text: "`client` and `shared_session` raise `UnsupportedCallArgument`, `logger_fn` warns, and `httpx.Timeout`, a pydantic `response_format`, `Message` objects and a `ModelResponse` mock work."
  proof: [completion-values]
- text: Exception and text mocks raise what LiteLLM raises.
  proof: [completion-mock]
- text: Proxy auth headers reach the request, a failing provider logs the warning, and a later assignment to a setting takes effect.
  proof: [completion-settings]
- text: Each native error type raises the matching class with its fields and the native error as cause, and an unknown type raises `UnknownNativeError`.
  proof: [completion-errors]
- text: A stream gives the same chunks as LiteLLM on both iteration paths, stops cleanly and closes.
  proof: [stream-iteration]
- text: The client classes pass their params and route to a router as LiteLLM does.
  proof: [completion-classes]
- text: Both retry functions make the same calls and raise the same last error as LiteLLM.
  proof: [completion-retries]
- text: "`config_completion` and the adapter functions behave as in LiteLLM, including their `ValueError` messages."
  proof: [completion-config]
- text: "`check_valid_key` gives True and False by the server's answer, `valid_model` raises for a bad model, and `acount_tokens` gives LiteLLM's count, so `ModelProbe` runs a real completion."
  proof: [completion-probe]
- text: The `_completion` package and `main.py` pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: completion-plain
    why: The main call differs from LiteLLM.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k plain
  - id: completion-signature
    why: A caller's keyword is refused.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k signature
  - id: completion-async
    why: "`acreate` is missing or doesn't return a coroutine."
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k coroutine
  - id: completion-values
    why: A Python object fails in JSON, or a client is dropped silently and skips a proxy.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k python_values
  - id: completion-mock
    why: A test suite that mocks errors stops working.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k mock
  - id: completion-settings
    why: A setting is read once and goes stale, or auth headers are lost.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k settings
  - id: completion-errors
    why: "`except betterlite.RateLimitError` stops matching."
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k errors
  - id: stream-iteration
    why: Iteration differs from LiteLLM or never ends.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion_stream.py
  - id: completion-classes
    why: "`LiteLLM().chat.completions.create` stops working."
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion_classes.py -k client
  - id: completion-retries
    why: Retries run too often or change the error.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion_classes.py -k retries
  - id: completion-config
    why: A config or adapter call fails where LiteLLM's works.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion_classes.py -k "config or adapter"
  - id: completion-probe
    why: A key check doesn't reach the server, so a bad key looks good.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_completion.py -k probe
  - id: python-lint
    why: The public layer is where an untyped dict would creep back in.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: Passing `client` or `shared_session` raises `UnsupportedCallArgument`.
  why: A Python HTTP client can't drive the Rust call, and ignoring it could send a request past a caller's proxy or custom TLS.
- what: "`logger_fn` is accepted and never called, and a warning is logged once per call."
  why: The call runs in Rust and has no point to call back into Python at each step.
- what: "`LiteLLM.params` doesn't hold `self`, where LiteLLM's `locals()` does."
  why: The key is an accident of `locals()`, and it would pass the client into `create` as an argument.
- what: "`betterlite.main.encoding` raises AttributeError, where LiteLLM's `__getattr__` (L9400-L9411) gives a tiktoken encoding."
  why: Token counting is Rust and no tiktoken object exists in the wheel.
- what: The retry functions run without tenacity, so "tenacity import failed please run `pip install tenacity`" never appears.
  why: A plain loop needs no optional package.
out_of_scope:
- Wrappers in litellm/chat_completions/** go through `litellm.rust_bridge`, excluded in litellm.yaml, so they are not built.
- '`aadapter_generate_content` (L7729-L7738) calls the google_genai adapter handler and belongs to B160.'
- '`ahealth_check` is B4449.'
- '`embedding`, `aembedding`, `text_completion`, `atext_completion`, `moderation`, `amoderation` and `_resolve_dispatched_text_completion_response` are B159.'
- '`responses_with_retries` and `aresponses_with_retries` are B160.'
- '`transcription`, `atranscription`, `speech`, `aspeech` and `_transcription_response_from_cached_dict` are B1082, B1083 and B1084.'
- '`batch_completion`, `batch_completion_models` and `batch_completion_models_all_responses` are B201.'
- '`stream_chunk_builder` is B2227, and `mock_completion` is B255.'
- Everything else in litellm/main.py belongs to the parts B5650 to B5659, and everything else in litellm/utils.py belongs to the other entries that cover it.
pitfalls:
- '`__all__` drives the star line, so a name missing there is missing from `betterlite` with no error at import.'
- Both retry functions default `original_function` to `completion`, so a test has to show what the async one does with a result it can't await, and the loop keeps that outcome.
- '`Completions.create` merges into `self.params` and keeps the change for the next call, so a later call sees earlier kwargs.'
- '`LiteLLM.__init__` reads `num_retries` when the object is built, not at each call.'
- 'A caller who sets `litellm_logging_obj` passes an object, so leave it out of the JSON and do not fail on it.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
