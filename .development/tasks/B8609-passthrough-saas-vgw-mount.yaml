deviations: []
out_of_scope:
  - "The route logic: B3626 and B3627. The shared state, the router hop and the processor: B8640."
pitfalls:
  - "`/eu.assemblyai/{*endpoint}` has a dot in its first segment; register it as a literal path, not as a pattern."
  - "TinyFish refuses PUT with 405 by its method list, so register only the methods B3626 names there."
  - "The GigaChat client keeps its own pool and timeouts; building it per request drops the connect timeout LiteLLM sets."
review_level: security
