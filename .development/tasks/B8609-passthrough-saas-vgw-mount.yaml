id: B8609
title: Mount the Fal, AssemblyAI and TinyFish routes
description: >-
  B8640 builds the shared pass-through state and calls `saas_vgw::mount` with a stub body. This task fills crates/betterlite-server/src/app/pass_through/routes/saas_vgw.rs (and saas_vgw/tests.rs) so the SaaS routes of B3626 answer through the booted proxy. It takes over their HTTP oracle cases, which could not pass at their own gate. B10026 already mounts B3627's VLLM, GigaChat and Watsonx routes from saas_vgw/vgw.rs with one line in saas_vgw::mount; add the SaaS merge next to that line and leave it as it is.
  Everything comes from B8640's `PassThroughState`. B3626 needs the handler Arc for B3615's create_pass_through_route, the credential lookup and `config.sections.tinyfish_route`. Read its merged deps struct; when a field has no source in PassThroughState, stop and report.

  `mount(router, ps)` merges, inside the auth layers, B3626's router (`/fal_ai/{*endpoint}`, `/assemblyai/{*endpoint}`, `/eu.assemblyai/{*endpoint}` and `/tinyfish/{*endpoint}`, with the methods B3626 lists for each).

  Oracle cases. Take over B3626's 12 cases at their paths; do not move or rename the files. The TinyFish mock upstream answers without a run_id, as B3626 says, so the billing poller makes no second call.
scope:
  paths:
    - crates/betterlite-server/src/app/pass_through/routes/saas_vgw.rs
    - crates/betterlite-server/src/app/pass_through/routes/saas_vgw/tests.rs
    - crates/betterlite-server/src/app/pass_through/routes/saas_vgw/tests/**
    - tools/oracle/cases/server/passthrough-saas-routes/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L445-L480
    why: The /fal_ai registration.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L1873-L1940
    why: The /assemblyai and /eu.assemblyai registrations.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_passthrough_endpoints.py#L3426-L3440
    why: The /tinyfish registration and its methods.
dod:
  - text: Every Fal, AssemblyAI and TinyFish path reaches its handler through the merged app with the methods its task lists, and the merge does not panic.
    proof: [registration-tests, oracle]
  - text: The SaaS routes answer through the booted proxy as LiteLLM does.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: registration-tests
      why: a Fal, AssemblyAI or TinyFish path is missing, takes the wrong methods, or collides with another family
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::pass_through::routes::saas_vgw::tests::registration(::|$)/)'
oracle_cases:
  - tools/oracle/cases/server/passthrough-saas-routes/fal-priced-forward.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/fal-unpriced-400.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/fal-requests-path-skips-price.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/fal-missing-key-401.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-run-forward.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-list-runs-403.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-put-405.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-non-json-400.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-envelope-field-400.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-vault-field-403.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-vault-field-allowed.yaml
  - tools/oracle/cases/server/passthrough-saas-routes/tinyfish-missing-key-401.yaml
deviations: []
out_of_scope:
  - "The route logic: B3626. The shared state: B8640."
  - "The VLLM, GigaChat and Watsonx mount and their 16 HTTP cases: B10026, in saas_vgw/vgw.rs."
pitfalls:
  - "`/eu.assemblyai/{*endpoint}` has a dot in its first segment; register it as a literal path, not as a pattern."
  - "TinyFish refuses PUT with 405 by its method list, so register only the methods B3626 names there."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
