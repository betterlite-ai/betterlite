id: B905
title: Responses parameters and prompt merging
description: >-
  Implement responses_parameters in betterlite-core for requested-parameter extraction,
  provider mapping, prompt-managed inputs and forwarded/MCP header merging. Own the complete
  functions in utils.py L34-L36,L44-L307,L1035-L1137. Move _output_token_detail L39-L41 to
  its only consumer B906. Reuse B175 preprocessing/allowed overrides, B213 nested deletion,
  B668 metadata conversion, B206 flag normalization and B2202 text-format conversion.
  Provider capabilities come from B1114. B137 supplies MCP header parsing; this task merges
  its results and does not reimplement OAuth or secret-name lookup.

  Load litellm_settings.drop_params through betterlite-config, initialized from
  LITELLM_DROP_PARAMS (unset/blank=false). A provided YAML value overrides that initial flag.
  Environment invalid nonempty strings warn and become true; invalid YAML flags warn and
  become false. Request drop_params=true combines with the resolved global by OR, so false
  cannot disable global dropping. Config tests load these values through the production loader.

  The responses_parameters helper uses object-identity-aware input fixtures for prompt merges;
  copying client_input before the call would miss the pinned identity branches. Record the
  mutations to passed parameter maps and the two warning messages as well as results. These
  operations consume parsed records; B002 owns YAML decoding. Count 303 nonblank/non-comment
  lines after moving the three-line token helper. Budget 290 implementation, 215 tests, 120
  fixtures, 85 adapters, 55 config tests/seeds and 25 wiring: 790 lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_parameters.rs
  - crates/betterlite-core/src/api/responses_parameters/**
