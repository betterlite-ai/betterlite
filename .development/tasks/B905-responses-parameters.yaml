id: B905
title: Responses parameters
description: >-
  Add Responses parameter projection and prompt-managed input shaping using B175 ParameterMapping, B213 dot paths
  and B206 metadata projection. Inputs include allowed_openai_params, drop_params, additional_drop_params, stream_options,
  text_format, metadata, previous_response_id and forwarded MCP headers; distinguish omitted values from explicit
  false and preserve dropped-field diagnostics.


  Implement crates/betterlite-core/src/api/responses_parameters.rs. Use ResponsesParametersInput and ResponsesParametersResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions drop_unsupported_param, allow_explicit_param, stream_options_include_usage,
  text_format_json_schema, merge_prompt_input, mcp_header_extraction under api::responses_parameters::tests. Each
  named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.drop_params
  defaults to false; LITELLM_DROP_PARAMS uses the source flag parser; invalid nonempty env values warn and enable;
  env.LITELLM_DROP_PARAMS defaults to false; empty is false, recognized boolean strings use normalize_drop_params;
  invalid nonempty values warn and enable. No environment reads occur outside betterlite-config. Test api::responses_parameters::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesParameters in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_parameters: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/utils.py: _apply_nested_drop_params (L34-L36); litellm/responses/utils.py:
  _output_token_detail (L39-L41); litellm/responses/utils.py: _is_object_sequence (L44-L45); litellm/responses/utils.py:
  _is_object_dict (L48-L51); litellm/responses/utils.py: normalize_responses_api_stream_options (L54-L62); litellm/responses/utils.py:
  _is_chat_text_part (L65-L66); litellm/responses/utils.py: _as_input_text_part (L69-L72); litellm/responses/utils.py:
  ResponsesAPIRequestUtils.shape_prompt_managed_message_for_responses (L82-L89); litellm/responses/utils.py: ResponsesAPIRequestUtils.responses_input_to_chat_messages
  (L92-L99); litellm/responses/utils.py: ResponsesAPIRequestUtils.merge_prompt_management_input (L102-L151); litellm/responses/utils.py:
  ResponsesAPIRequestUtils.merge_client_forwarded_headers (L154-L173); litellm/responses/utils.py: ResponsesAPIRequestUtils._check_valid_arg
  (L176-L196); litellm/responses/utils.py: ResponsesAPIRequestUtils.get_optional_params_responses_api (L199-L253);
  litellm/responses/utils.py: ResponsesAPIRequestUtils.get_requested_response_api_optional_param (L256-L307); litellm/responses/utils.py:
  ResponsesAPIRequestUtils.convert_text_format_to_text_param (L1036-L1067); litellm/responses/utils.py: ResponsesAPIRequestUtils.extract_mcp_headers_from_request
  (L1070-L1137). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 271 owned nonblank/non-comment/non-docstring Python lines (306 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 291 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 36 config tests/seeds and
  30 wiring; 595 total within the 600-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B175 (Provider parameter capabilities
  and mapping), B206 (Common call metadata and response helpers), B213 (Bounded dot-path lookup and deletion), B902
  (Responses shapes), B903 (Response id codecs), B1087 (Api boundaries), B002 (Load LiteLLM config.yaml into typed
  config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.
