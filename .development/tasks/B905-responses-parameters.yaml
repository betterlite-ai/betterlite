references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L34-L36
  why: Nested additional_drop_params are applied in caller order through B213.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L44-L307
  why: Own shape predicates, stream options, prompt merge, forwarded headers and parameter extraction/mapping.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L1035-L1137
  why: Text-format flattening and ordered MCP tool-header merging are separate complete methods.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/core_helpers.py#L54-L83
  why: B206's YAML/environment flag parsers intentionally disagree on invalid values.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6618-L6619
  why: YAML drop_params uses drop_params_flag after import initializes the environment default.
dod:
- text: >-
    unsupported_params supplies provider=openai,model=m,supported=[store],params={foo:1}.
    With both drop flags false, expect UnsupportedParamsError,status=500,message="openai does
    not support parameters: {'foo': 1}, for model=m. To drop these, set `litellm.drop_params=True`
    or for proxy:\n\n`litellm_settings:\n drop_params: true`\n" (literal escapes become newlines),
    and the SDK exception fields, not a proxy status-string code. supported_params=null skips
    validation. Either true flag calls the provider mapper with drop_params=true. allowed_openai_params=[foo]
    admits foo and restores it if the mapper omitted it, but does not overwrite a mapped foo=2
    or invent an absent allowed field. Restoration pops foo from the non-default map.
  proof: [parameter-tests, oracle, parameter-adapter]
- text: >-
    stream_options retains only include_obfuscation=true/false. {},null,include_usage=true,
    include_obfuscation=1 and include_obfuscation="true" normalize to null and remove the whole
    stream_options key. An explicitly allowed stream_options may be restored by the subsequent
    override step; compare that ordering with the same malformed value allowed and disallowed.
  proof: [parameter-tests, oracle, parameter-adapter]
- text: >-
    requested_params drops null/default fields through B175, preserves explicit store=false,
    removes additional_drop_params=[reasoning.summary], restores a B903 previous_response_id
    to resp_a, and converts metadata via B668. Non-dict metadata is removed when conversion
    returns null. custom_llm_provider,kwargs,additional_drop_params are popped from the caller's
    map. text_format with {type:json_schema,json_schema:{name:X,schema:{type:object},strict:true}}
    becomes text={format:{type:json_schema,name:X,schema:{type:object},strict:true}}; existing
    text={} wins, null conversion returns null, and missing json_schema raises KeyError at this layer.
  proof: [parameter-tests, oracle, parameter-adapter]
- text: >-
    prompt_input maps null to [],"hi" to [{role:user,content:hi}], and list input to dicts
    containing role only. Non-assistant message content type=text becomes input_text while
    assistant, non-list content and other block types stay. Corresponding role/id messages
    replace their original slots without disturbing tool items. If all original message objects
    survive but new messages are inserted, preserve each original's preceding non-message
    items and the trailing items. No message slots warns "Prompt management hook returned
    messages without Responses API input messages; merged messages were ignored" and keeps
    originals. Replaced messages with changed role/id warn "Prompt management hook replaced
    Responses API messages; non-message input items were dropped" and return only shaped replacements.
  proof: [parameter-tests, oracle, parameter-adapter]
- text: >-
    forwarded_headers merges client={authorization:old,x-client:yes},extra={Authorization:new}
    to {x-client:yes,Authorization:new}; null clients return extra unchanged and empty extra
    copies client. mcp_headers starts raw={x-mcp-auth:legacy,x-mcp-github-authorization:old,
    Authorization:oauth}; expect auth=legacy,server github.Authorization=old,oauth.Authorization=oauth.
    A later mcp tool with headers={x-mcp-github-authorization:new,x-custom:v} overwrites that
    server authorization and raw fields, but does not recompute the legacy/oauth outputs.
    Empty/non-mcp/non-dict tool headers are ignored; no raw/tools yields four null results.
    The legacy header warning is B137's; credentials must not enter betterlite diagnostics.
  proof: [parameter-tests, oracle, parameter-adapter]
- text: >-
    loads_drop_params uses env unset,""," false ","0","off" -> false and "true","1","yes" -> true;
    env="wat" warns "LITELLM_DROP_PARAMS='wat' is not a flag value, treating it as on. Set it
    to true or false" and enables dropping. YAML drop_params=false overrides env=true; YAML
    drop_params="wat" warns "litellm_settings.drop_params='wat' is not a flag value, treating
    it as off" and disables it. The key is absent from unsupported-key errors.
  proof: [config-tests, oracle, parameter-adapter]
checks:
  optional: [mutants]
  commands:
  - id: parameter-tests
    why: requested options, prompt identity or header precedence changes
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_parameters::/)'
  - id: config-tests
    why: drop_params is not loaded with the pinned precedence and warning behavior
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_parameters::tests::loads_drop_params($|::)/)'
  - id: parameter-adapter
    why: parameter helper cases lack a checked independent implementation
    run: test -f tools/oracle/helpers/responses_parameters.py && grep -qE '^[[:space:]]+responses_parameters:' tools/oracle/fuzz/corpus/helper_case/responses_parameters-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
