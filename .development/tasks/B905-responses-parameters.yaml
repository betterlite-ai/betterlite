- tools/oracle/cases/helpers/responses-parameters/drop-flags.yaml
deviations: []
out_of_scope:
- B903 owns ID codecs (unused decode_container_id_to_original has no caller at the pin); B904 owns traversal and B906 owns _output_token_detail plus both usage methods in responses/utils.py.
- B137 owns MCPRequestHandler's three header extractors and get_mcp_client_side_auth_header_name, including its environment/general_settings precedence.
- B160's Python facade converts class-valued text_format through the schema bridge; native code consumes B2202's parsed format representation.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_parameters in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_parameters.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_parameters.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- include_usage is a chat-stream option; the Responses normalizer recognizes only boolean include_obfuscation.
- Prompt preservation uses object identity as well as role/id correspondence; equal copies do not exercise the insertion branch.
- Tool headers merge after OAuth extraction, so adding Authorization to a tool does not change the returned OAuth mapping.
review_level: security
budget:
  max_changed_lines: 790
  max_new_expects: 1
