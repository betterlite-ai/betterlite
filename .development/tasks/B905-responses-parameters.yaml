  - crates/betterlite-config/tests/**
  - crates/betterlite-config/src/resolve.rs
  - crates/betterlite-config/src/types.rs
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/responses_parameters.rs
  - crates/betterlite-config/src/api/responses_parameters/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/responses-parameters-*
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_parameters.rs
  - tools/oracle/src/helpers/core_ops/responses_parameters/**
  - tools/oracle/helpers/responses_parameters.py
