dod:
- text: >-
    The required-param check fails with LiteLLM's message, type, param and code for the four listed route types and never for anthropic_messages,
    and the mock gate rejects the six names in LiteLLM's order with its detail text unless dangerously_allow_mock_testing_request_params is true.
  proof: [call-steps-tests, oracle, helper-python]
- text: enable_tag_filtering is gone from the data the call gets, and a router_settings_override copies its eight keys only where the data has none.
  proof: [call-steps-tests]
- text: >-
    plan_messages_route follows LiteLLM's order: api_key or api_base, user_config, the override, the blocked check, the missing model, the team map,
    recognized and admin public models, pass-through, default or pattern, deployment names, a2a and not found, and without a router user_model or not found.
  proof: [call-steps-tests]
- text: >-
    call reaches the router, the dispatch or the a2a port for each plan, returns the blocked, missing-model, user_config and not-found errors with their
    status and detail, and retries once after a read-through that answers true.
  proof: [call-steps-tests]
- text: The standalone routing picks a deployment of the model group and writes its model, api_base, api_key, timeout and model id into the call.
  proof: [call-steps-tests]
- text: dangerously_allow_mock_testing_request_params loads as true, false and the default false, and its seeds pass the production YAML parser.
  proof: [config-tests, config-corpus]
checks:
  optional: [mutants]
  commands:
  - id: call-steps-tests
    why: a shared step, a plan rule, the override copy, a callee, an error text or the read-through retry is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^messages_call::/)'
  - id: config-tests
    why: the mock testing opt-in does not load with its type and default
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mock_testing_params::/)'
  - id: config-corpus
    why: no new mock testing seed is accepted by the production YAML parser
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/mock-testing-params-*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the two gates have no pinned LiteLLM comparison through the b9800 helper
    run: grep -qE '^[[:space:]]+b9800:' tools/oracle/fuzz/corpus/helper_case/b9800-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/messages-call/required-params.yaml
- tools/oracle/cases/helpers/messages-call/mock-params-gate.yaml
deviations:
- what: A /v1/messages request whose data still carries `user_config` after auth (an admin allowed that banned field) gets a 400 invalid_request_error "user_config is not supported on /v1/messages" instead of a router built from that config.
  why: LiteLLM builds a throwaway Router from client-sent deployment settings per request; betterlite builds routers only from config, and B8692 answers the same way for pass-through routes.
- what: Until a task swaps the production router into B081's route, the standalone routing knows only the model groups and litellm models of config.yaml, so team model maps, team public models, wildcard patterns, blocked deployments and the per-deployment keepalive_seconds have no effect on /v1/messages.
  why: The route cannot depend on the router wiring, since that sits above the routes; the chat and embeddings routes on main pick deployments the same way today.
out_of_scope:
- "_route_user_config_request (L38-L50): no router is built from request data, see deviations."
- "add_shared_session_to_data and _get_shared_session_lock (L243-L327): aiohttp session reuse; betterlite's pooled HTTP client already reuses connections."
- "The acompletion batch branch (L499-L511), the Google GenAI generationConfig rewrite (L488-L492) and the eval, container, interaction, agent, video and moderation lists (L549-L706): other route types; B004 and B014 own chat, B9372 the evals, B7430 the containers, B6460 the videos."
- "Router.anthropic_messages and its stream fallbacks: B6021 and B312, reached through MessagesRouting. route_a2a_agent_request: B4788. model_registry_read_through: B8231. The production MessagesRouting and ModelReadThrough and their swap into B081's routes(state): see B081's notes."
- "litellm.anthropic_messages and the provider call behind it: B1134 and B982."
pitfalls:
- 'The mock gate lists names in GATED_MOCK_PARAM_NAMES order, not request order, and counts a key whose value is null.'
- 'The not-found route name is "anthropic_messages" with no leading slash, since ROUTE_ENDPOINT_MAPPING has no entry for it, and the model text is "" when the data has none.'
- 'The required-param table has no anthropic_messages entry; do not reject a messages request without messages or max_tokens here.'
- 'enable_tag_filtering is removed before the override copy, so only a value from router_settings_override reaches the router.'
- 'The blocked check runs before the team model map and skips an empty or non-string model.'
- 'The read-through retry starts again from the data as it was before the first attempt, so the first attempt''s removals and override copy are not applied twice.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
