id: B1128
title: File type and MIME records
description: >-
  Put FileType, the ordered extension/MIME mappings, Gemini acceptance and native upload-plan records
  in betterlite-openai::api::file_type_records. Own the five live conversion/acceptance functions in
  types/files.py and the FileContentProvider/FileContentStreamingResult declarations in files/types.py.
  These transform typed strings or describe internal transport plans; they do not decode JSON bytes.
  Remove the invented file-type JSON decoder and fuzz task. No config, environment or I/O is needed.

  FileContentProvider accepts openai, azure, vertex_ai, bedrock, hosted_vllm, litellm_proxy, anthropic,
  manus and mistral. FileContentStreamingResult holds an iterator of bytes and headers without
  collecting it. TwoStepFileUploadRequest requires method/url/headers/data; data is text, bytes or
  a typed provider payload. TwoStepFileUploadConfig requires initial_request, upload_request and
  upload_url_location=headers|body; upload_url_key is optional, with no default installed by this
  declaration despite its docstring. StreamingMediaUploadConfig requires body_stream and optionally
  content_type. Use typed records and stream ports, not arbitrary JSON or an HTTP client here.

  Add the tests named below in api::file_type_records::tests and a B171 file_type_records helper
  variant for pure conversions. One parameterized MIME fixture carries all rows explicitly; do not
  derive expected MIME values from the production table. The owned declarations and live functions
  occupy 227 nonblank, non-comment physical lines after excluding unused category tables/accessors.
  Allow 260 implementation/declarations, 120 tests,
  100 fixtures, 70 adapters and 30 wiring lines: 580 total.
scope:
  paths:
  - crates/betterlite-openai/Cargo.toml
  - crates/betterlite-openai/src/lib.rs
  - crates/betterlite-openai/src/error.rs
  - crates/betterlite-openai/src/api.rs
  - crates/betterlite-openai/src/api/file_type_records.rs
  - crates/betterlite-openai/src/api/file_type_records/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/openai/file_type_records.rs
  - tools/oracle/src/helpers/openai/file_type_records/**
  - tools/oracle/helpers/file_type_records.py
  - tools/oracle/helpers/file_type_records/**
  - tools/oracle/fuzz/corpus/helper_case/file_type_records-*
  - tools/oracle/cases/helpers/file-type-records/**
  - Cargo.toml
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/files.py#L13-L288
  why: FileType spelling, ordered conversion tables and Gemini acceptance; the five unused accessors are excluded below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/files.py#L296-L343
  why: Required versus optional fields of the two-step and streaming upload plans, not an external JSON schema.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/types.py#L1-L11
  why: Allowed content providers and the byte-iterator/header pair consumed by file streaming.
dod:
- text: >-
    mime_extension_table checks each extension against its uppercase FileType (3gpp uses THREE_GPP
    with wire value 3GPP) and literal MIME: aac=audio/aac, csv=text/csv, doc=application/msword,
    docx=application/vnd.openxmlformats-officedocument.wordprocessingml.document, flac=audio/flac,
    flv=video/x-flv, gif=image/gif, gdoc=application/vnd.google-apps.document,
    gdraw=application/vnd.google-apps.drawing, gsheet=application/vnd.google-apps.spreadsheet,
    gslides=application/vnd.google-apps.presentation, heic=image/heic, heif=image/heif,
    html|htm=text/html, jpeg|jpg=image/jpeg, json=application/json, m4a=audio/x-m4a,
    m4v=video/x-m4v, mov=video/quicktime, mp3=audio/mpeg, mp4=video/mp4, mpeg=video/mpeg,
    mpegps=video/mpegps, mpg=video/mpg, mpa=audio/m4a, mpga=audio/mpga, ogg=audio/ogg,
    opus=audio/opus, pdf=application/pdf, pcm=audio/pcm, png=image/png, ppt=application/vnd.ms-powerpoint,
    pptx=application/vnd.openxmlformats-officedocument.presentationml.presentation, rtf=application/rtf,
    3gpp=video/3gpp, txt=text/plain, wav=audio/wav, webm=video/webm, webp=image/webp,
    wmv=video/wmv, xls=application/vnd.ms-excel,
    xlsx=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.
    Google types are GOOGLE_DOC, GOOGLE_DRAWINGS, GOOGLE_SHEETS and GOOGLE_SLIDES. Reverse MIME
    conversion chooses html and jpeg, never htm/jpg; all other rows return their sole extension.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    mime_lookup_edges sends JPG and IMAGE/JPEG and expects JPEG and jpeg. Leading dots, spaces
    and MIME parameters are not normalized: .jpg and " jpg" raise ValueError with source
    "Unknown file type for extension: .jpg" and "Unknown file type for extension:  jpg";
    image/jpeg;charset=utf-8 and application/unknown raise ValueError "Unknown extension for mime type: <input>".
    These pure exceptions have no status/type/param/code fields; empty strings fail the same way.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    gemini_file_acceptance expects true for PNG,JPEG,WEBP,AAC,FLAC,MP3,MPA,MPEG,MPGA,OPUS,PCM,WAV,
    WEBM,FLV,MOV,MPEGPS,MPG,MP4,WMV,THREE_GPP,PDF,TXT and false for every other FileType above,
    including GIF,HEIC,M4A,M4V,OGG,CSV and JSON. Include each enum as a named rstest case.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    upload_plan_fields constructs both upload_url_location variants, with absent and explicit
    upload_url_key=file_uri, and checks omission stays absent. stream_record_identity passes two
    chunks [0,255] and [10] plus content-type=application/octet-stream and retains bytes/order/headers
    without reading until polled. Native compile-time records enforce required fields.
  proof: [behavior-tests]
- text: MIME fixtures reach independent conversion implementations through a new file_type_records helper seed.
  proof: [new-cases, helper-corpus, helper-python, oracle]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: MIME lookup, accepted types or upload records lack assertions
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::file_type_records::/)'
  - id: helper-python
    why: the MIME comparison adapter is missing or fails strict checks
    run: test -f tools/oracle/helpers/file_type_records.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new MIME operation is absent from the parser corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_type_records-*)" && grep -qE '^[[:space:]]+file_type_records:' tools/oracle/fuzz/corpus/helper_case/file_type_records-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no MIME conversion scenarios were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-type-records)"
oracle_cases:
- tools/oracle/cases/helpers/file-type-records/mime-extension-table.yaml
- tools/oracle/cases/helpers/file-type-records/mime-lookup-edges.yaml
- tools/oracle/cases/helpers/file-type-records/gemini-file-acceptance.yaml
deviations: []
out_of_scope:
- get_file_extension_for_file_type, is_image_file_type, is_video_file_type, is_audio_file_type and is_text_file_type have no caller at the pin; their unused category tables need no independent implementation.
- B1015 owns files/utils.py and base files/transformation.py; provider-specific upload execution remains in each provider's file task.
pitfalls:
- 'The oracle helper for this task is pre-registered as file_type_records in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/file_type_records.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/file_type_records.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- MIME-to-extension is case-insensitive but never strips parameters, dots or whitespace.
- MPA uses audio/m4a while M4A uses audio/x-m4a, and only MPA is accepted by the Gemini predicate.
- Upload plans carry a stream capability; serializing the iterator as JSON would destroy lazy upload behavior.
review_level: standard
budget:
  max_changed_lines: 580
  max_new_expects: 0
