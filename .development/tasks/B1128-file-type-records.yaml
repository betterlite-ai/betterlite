id: B1128
title: File type and MIME records
description: >-
  Define file DTOs and the pinned MIME/extension mappings, including category membership and Gemini 1.5 accepted
  file types.


  get_file_extension_for_file_type (litellm/types/files.py:L172-L173) has no MIT runtime caller at the pin (only
  its declaration; tests are not runtime callers); it is excluded, and no behavior case exercises that unused entry
  point.


  is_image_file_type (litellm/types/files.py:L200-L201) has no MIT runtime caller at the pin (only its declaration;
  tests are not runtime callers); it is excluded, and no behavior case exercises that unused entry point.


  is_video_file_type (litellm/types/files.py:L219-L220) has no MIT runtime caller at the pin (only its declaration;
  tests are not runtime callers); it is excluded, and no behavior case exercises that unused entry point.


  is_audio_file_type (litellm/types/files.py:L236-L237) has no MIT runtime caller at the pin (only its declaration;
  tests are not runtime callers); it is excluded, and no behavior case exercises that unused entry point.


  is_text_file_type (litellm/types/files.py:L244-L245) has no MIT runtime caller at the pin (only its declaration;
  tests are not runtime callers); it is excluded, and no behavior case exercises that unused entry point.


  mime-extension-roundtrip uses get_file_extension_from_mime_type/get_file_type_from_extension/get_file_mime_type_from_extension;
  category predicates with no runtime caller are excluded.


  Implement crates/betterlite-openai/src/api/file_type_records.rs. Use FileTypeRecordsInput and FileTypeRecordsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions mime_extension_roundtrip under api::file_type_records::tests. Each
  named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-openai::api::file_type_records::decode_file_type_records(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/file_type_records.rs and call it from the actual boundary. The cargo-fuzz
  target crates/betterlite-openai/fuzz/fuzz_targets/file_type_records.rs passes arbitrary bounded bytes to that
  exact decoder; api::file_type_records::tests::replays_corpus replays newly committed seeds through the same function.
  Transform-only helpers reuse the already decoded records.


  Register HelperCall::FileTypeRecords in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {file_type_records: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/types/files.py: get_file_extension_from_mime_type (L157-L161); litellm/types/files.py:
  get_file_type_from_extension (L164-L169); litellm/types/files.py: get_file_mime_type_for_file_type (L176-L177);
  litellm/types/files.py: get_file_mime_type_from_extension (L180-L182); litellm/types/files.py: is_gemini_1_5_accepted_file_type
  (L287-L288). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 252 owned nonblank/non-comment/non-docstring Python lines (275 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 272 implementation,
  46 behavior tests, 12 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 510 total within the 510-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B171 (Direct helper oracle and URL path
  encoding), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
