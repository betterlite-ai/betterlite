dod:
- text: 'mime extension roundtrip: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-mime-extension-roundtrip
  - oracle
- text: The named external-byte decoder is shared by production, fuzz and committed replay; behavior filters exclude
    replay.
  proof:
  - parser-corpus
- text: The independent Rust/Python helper adapter and the externally tagged case seed execute through B171.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: Every listed case is a newly added parity fixture and compares independent native and pinned results.
  proof:
  - new-oracle-cases
  - oracle
  - helper-python
  - helper-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::file_type_records::/) -
      test(/::replays_corpus$/)'
  - id: case-mime-extension-roundtrip
    why: the mime-extension-roundtrip behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::file_type_records::tests::mime_extension_roundtrip($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/file_type_records)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/file_type_records.rs && grep -qF "decode_file_type_records"
      crates/betterlite-openai/fuzz/fuzz_targets/file_type_records.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::file_type_records::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/file_type_records.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/file_type_records-*)"
      && grep -qE "^[[:space:]]+file_type_records:" tools/oracle/fuzz/corpus/helper_case/file_type_records-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/file-type-records)"
