id: B1073
title: Retrieve attached vector files and indexed content
description: >-
  Add the complete retrieve/aretrieve/retrieve_content/aretrieve_content SDK functions in
  core::api::vector_file_read. Own vector_store_files/main.py:306-520. These functions require keyword
  vector_store_id and file_id, default headers,timeout,provider to null, and use B1111 for falsey-provider
  defaulting and best-effort registry credentials. Construct GenericLiteLLMParams after the credential
  overlay. B174 converts the provider enum for B010 config selection; B527 supplies OpenAI transforms
  and B2481 supplies the actual retrieve/content HTTP execution.

  Model is null in logging and exception conversion. optional_params holds only the two ids. Logged
  litellm_params starts with vector_store_id,litellm_call_id and overlays non-null GenericLiteLLMParams.
  The async flags are removed before execution and only boolean true selects the coroutine path; retain
  caller context. Use timeout or REQUEST_TIMEOUT (6000 by default), loaded through betterlite-config.
  This wrapper passes timeout even though B2481's final GET omits it. kwargs containing extra_query,
  after or limit do not become content pagination.

  Add B2401 VectorFileRead SDK operations for retrieve/content, with a real provider mock and pinned public
  SDK calls. Native api::vector_file_read tests inspect logs and prepared handler arguments; config loader
  tests have the same module name. The four functions contain 194 nonblank/non-comment lines. Budget
  195 implementation, 145 tests, 90 adapters, 90 fixtures, 50 config/corpus/wiring, 570 total within 610.
  There is no new parser or gateway route in this task.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/vector_file_read.rs
  - crates/betterlite-core/src/api/vector_file_read/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/**
  - crates/betterlite-config/src/api/vector_file_read.rs
  - crates/betterlite-config/src/api/vector_file_read/**
  - crates/betterlite-config/fuzz/corpus/config_yaml/vector-file-read-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/vector_file_read.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/vector_file_read.py
  - tools/oracle/cases/sdk-http/vector-file-read/**
  - tools/oracle/fuzz/corpus/sdk_http_case/vector-file-read-*
  - tools/oracle/helpers/b1073.py
  - tools/oracle/helpers/b1073/**
  - tools/oracle/src/helpers/core_ops/b1073.rs
  - tools/oracle/src/helpers/core_ops/b1073/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_store_files/main.py#L306-L520
  why: Complete retrieval wrappers preserve ids/context and forward no extra query, including for content.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L576
  why: REQUEST_TIMEOUT supplies the read wrapper's default before the HTTP handler's own timeout behavior.
dod:
- text: >-
    retrieve_attachment_and_text sends vs_a,file_a in both modes. Retrieve GETs
    /v1/vector_stores/vs_a/files/file_a and returns mock {id:file_a,object:vector_store.file,status:completed}.
    Content GETs the same path plus /content and returns {file_id:file_a,filename:a,attributes:{tag:x},
    content:[{type:text,text:hello},{type:text,text:world}]} preserving order. Neither returns raw file bytes.
    extra_headers={X-Trace:t} reaches both requests; no body is sent.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    content_has_no_pagination passes kwargs after=cursor,limit=1,extra_query={trace:ignored}; both read
    methods still send no query and return the whole mock content. Native optional_params logging contains
    only vector_store_id=vs_a,file_id=file_a; litellm_call_id is null or supplied call-a, model is null,
    and async calls retain request context. Boolean true flags select async, integer 1 does not.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    read_registry_and_provider passes provider=null then "",caller key=sk-caller and registry key=sk-registry;
    both use OpenAI and Authorization="Bearer sk-registry". Registry lookup failure falls back silently
    to the caller key. Registry custom_llm_provider=azure does not replace the already selected local
    provider. Explicit azure fails with source "Vector store file retrieve is not supported for azure"
    or "Vector store file content retrieve is not supported for azure". Unknown bogus fails provider enum
    conversion. Final errors are APIConnectionError,status=500,type=null,param=null,code=null with zero HTTP.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    retrieve_missing_file receives 404 {error:{message:missing,type:invalid_request_error,param:null,code:missing}}
    from each endpoint. Expect SDK NotFoundError,status=404,type=null,param=null,code=null and one captured
    GET with retries disabled; ignore only the failure message for betterlite wording.
  proof: [read-tests, oracle, python-adapter]
- text: >-
    read_timeout_argument checks null,0,7 yield 6000,6000,7 at the handler and 12,12,7 with REQUEST_TIMEOUT=12.
    loads_read_timeout loads unset=6000,"12"=12 and rejects "bad" using Config. New config and SDK
    operation seeds replay through the existing parsers, including both read modes.
  proof: [read-tests, config-tests, corpora]
checks:
  optional: [mutants]
  commands:
  - id: read-tests
    why: retrieval wrappers add pagination, lose ids or apply the wrong registry/default behavior
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_file_read::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: read timeout is not loaded through production configuration
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::vector_file_read::tests::loads_read_timeout($|::)/)'
  - id: python-adapter
    why: retrieval is represented by a helper result instead of captured SDK HTTP
    run: test -f tools/oracle/sdk_http/vector_file_read.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpora
    why: new read SDK/config inputs lack parser replay
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-file-read-*)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/vector-file-read-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)' && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
- tools/oracle/cases/sdk-http/vector-file-read/retrieve-attachment-and-text.yaml
- tools/oracle/cases/sdk-http/vector-file-read/content-has-no-pagination.yaml
- tools/oracle/cases/sdk-http/vector-file-read/read-registry-and-provider.yaml
- tools/oracle/cases/sdk-http/vector-file-read/retrieve-missing-file.yaml
deviations: []
out_of_scope:
- B1111 owns the provider/registry helpers, B1072 owns create/list and B1074 owns update/delete in vector_store_files/main.py.
- B2481 owns read HTTP handlers and timeout omission; B527 owns provider transforms, B1071 records and B011 error classification.
pitfalls:
- retrieve_content has no pagination arguments; extra_query in kwargs never reaches the HTTP call.
- The registry lookup runs after local provider selection, so its provider field cannot redirect a read to another adapter.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
