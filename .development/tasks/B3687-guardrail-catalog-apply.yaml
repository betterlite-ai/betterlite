id: B3687
title: Guardrail catalog downloads and direct apply API
description: >-
  Build four admin routes of the guardrail API in betterlite-server: the category file download, the airline list, the blocked-words file check and the direct apply route. Everything goes in crates/betterlite-server/src/guardrails/catalog_apply.rs and catalog_apply/. The list, info and form routes are B3684, create, change and delete are B3685, submissions and the custom-code test route are B3686 and the usage routes are B3689 (B104 mounts them). Expose `pub fn routes()` the way the sibling modules in crates/betterlite-server/src/guardrails/ do. The architect's skeleton mounts it, so do not touch app.rs. Every route sits behind the normal key check: any valid key, any role, no other permission.

  Files under catalog_apply/, each below 300 lines: `error.rs`, `category.rs`, `airlines.rs`, `blocked_words.rs`, `input_type.rs`, `ports.rs`, `apply.rs`, `success_logs.rs`, `tests.rs`.

  `error.rs` holds `CatalogApplyError`, a thiserror enum with one variant per HTTP outcome below and a `status()` and `detail()` for each. `ports.rs` holds the traits that cut this module off from code other tasks own (see the notes for who writes the real implementations).

  `GET /guardrails/ui/category_yaml/{category_name}` (category.rs). `category_name` is one path segment. Step 1: `safe_join(CATEGORIES_DIR, format!("{category_name}.yaml"))` from B4260's `betterlite-server::assets`; a failure (a NUL byte, or a name that resolves outside the folder) is 400 with detail "Invalid category name". `CATEGORIES_DIR` is the bundled categories folder from B3691's root constants. Step 2: `find_category_file(category_name, roots)` with B3691's `DATA_ROOTS` (a `.yaml` file wins over `.json` in the same folder, bundled folder before the legacy one). None is 404 with detail "Category file not found: {category_name} (tried .yaml and .json)". Step 3: the found path must be inside one of `category_dirs(roots)` by B4260's `is_within` (this catches a symlink that points out of the folder), else 400 "Invalid category name". Step 4: `file_type` is "yaml" when the path ends in `.yaml`, else "json". Read the file as UTF-8 text. A read failure is 500 with detail "Error reading category file: {error}". The body is `{"category_name": ..., "yaml_content": <raw file text>, "file_type": ...}`. The key stays `yaml_content` for JSON files too. The roots are passed in by the caller (LiteLLM's `content_filter_data_roots` dependency), so a test can point the route at a temporary folder.

  `GET /guardrails/ui/major_airlines` (airlines.rs) returns `{"airlines": <the parsed list>}` from B3697's `major_airlines.json` (351 entries, each `id`, `match`, `tags`), in file order, values unchanged. Read it from `pub const MAJOR_AIRLINES_JSON: &str = include_str!("competitor_intent/major_airlines.json")`, which this task adds in `crates/betterlite-guardrails/src/content_filter/competitor_intent_airline.rs` (module `betterlite_guardrails::content_filter::competitor_intent_airline`) by renaming the existing private `AIRLINES_JSON` const, making it public and updating its one use there, and parse it in airlines.rs with serde_json; the route cannot return LiteLLM's 404 "major_airlines.json not found" or its 500 "Error reading major_airlines.json: {error}", see the deviations.

  `POST /guardrails/validate_blocked_words_file` (blocked_words.rs). The body is a JSON object whose values are all text (LiteLLM's `dict[str, str]`); any other body is the normal 422 of the sibling routes. The decoder is `validate_blocked_words(body: &[u8]) -> Result<ValidationOutcome, BodyError>` and the check inside it is `check_blocked_words(file_content: &str) -> BlockedWordsVerdict`. The verdict serializes to one of these bodies, and the status is always 200:
  1. `file_content` missing or "" gives `{"valid": false, "error": "No file content provided"}`.
  2. Parse the text as YAML. A syntax error gives `{"valid": false, "error": "Invalid YAML syntax: {error}"}`.
  3. A document that is not a mapping, or has no `blocked_words` key, gives `{"valid": false, "error": "Invalid format: file must contain 'blocked_words' key with a list"}`.
  4. A `blocked_words` value that is not a list gives `{"valid": false, "error": "'blocked_words' must be a list"}` (null counts as not a list).
  5. Walk the entries by index from 0 and collect messages into `errors`: an entry that is not a mapping gives "Entry {i}: must be an object" and the walk goes on to the next entry. For a mapping: no `keyword` gives "Entry {i}: missing 'keyword' field", a `keyword` that is not text gives "Entry {i}: 'keyword' must be a string"; no `action` gives "Entry {i}: missing 'action' field", an `action` other than the text BLOCK or MASK gives "Entry {i}: action must be 'BLOCK' or 'MASK', got '{action}'"; a present `description` that is not text gives "Entry {i}: 'description' must be a string". The checks run in that order, so one entry can add up to three messages. Any message gives `{"valid": false, "errors": [...]}`.
  6. Otherwise `{"valid": true, "message": "Valid YAML file with {n} blocked word(s)"}` with n the list length (an empty list is valid with 0).
  Parse with serde-saphyr (already in the workspace, B002 chose it) into a plain value tree. Nothing may panic on any input, and `file_content` is untrusted: bound it with axum's default request body limit (2 MiB through the Json extractor, the limit every admin JSON route in betterlite-server uses today, since none sets its own) and let the parser's own depth limit apply. Add the fuzz target `blocked_words_file` at `crates/betterlite-server/fuzz/fuzz_targets/blocked_words_file.rs`, feeding bytes to `validate_blocked_words`, with a `[[bin]]` entry in `crates/betterlite-server/fuzz/Cargo.toml` shaped like the existing targets. Seed `crates/betterlite-server/fuzz/corpus/blocked_words_file/` with a valid body, a body with errors, truncated JSON, bytes that are not UTF-8 and a body with a deeply nested YAML flow list. Add `replays_the_blocked_words_file_corpus` to tests.rs, shaped like `replays_the_scim_resource_corpus` in `crates/betterlite-server/src/scim_records/tests.rs`.

  `POST /guardrails/apply_guardrail` and its alias `POST /apply_guardrail` (apply.rs, input_type.rs, success_logs.rs) run one guardrail on a text. The body is B3662's `ApplyGuardrailRequest` (`guardrail_name`, `text` required; `language`, `entities`, `input_type` default "request", `messages`, `metadata`); decode it with B3662's `decode_apply_request(body: &[u8])` and answer a bad body with the normal 422. The answer is B3662's `ApplyGuardrailResponse` (`response_text`). `language` and `entities` are accepted and never read, as in LiteLLM. Order inside the handler:
  1. `data = {"guardrail_name": name, "input": [text], "messages": request.messages or [], "metadata": {"route": "/apply_guardrail"}}`. The `metadata.route` value is "/apply_guardrail" even on the long path.
  2. Look the guardrail up by name with B8231's `get_guardrail_with_read_through` from `crate::registry_read_through::lookup` (the in-memory handler first, then one database re-sync), passing B8231's `GuardrailLookup` registry port and the guardrails `RegistryReadThrough` from state. Import that trait; do not declare a second `GuardrailLookup` in ports.rs. None is 404 with detail "Guardrail '{name}' not found. Please ensure the guardrail is configured in your LiteLLM proxy.". This 404 is raised inside the same try block as everything below, so it goes through the failure path in step 7 and the client sees the proxy's OpenAI-style error body, not `{"detail": ...}`.
  3. Run `ApplyHooks::pre_call(data, key, "apply_guardrail")`. It returns the updated data and an optional logging handle.
  4. With a logging handle, call `ApplyLog::mark_pass_through(messages)`: the handle's call type becomes "pass_through_endpoint" (also inside its call details) and its messages become `request.messages` when that is a non-empty list, else `[{"role": "user", "content": text}]`.
  5. Build `request_data` with only the keys that were sent: `messages` when `request.messages` is not null (an empty list counts) and `metadata` when `request.metadata` is not null. Resolve the input type in input_type.rs: `request` becomes `response` when the guardrail's event hook is `post_call`; `response` stays; any other text (including an unknown one) becomes `request`. Open B3664's invocation record with `GuardrailHookName::ApplyGuardrail` before the call and finish it after, since Rust cannot wrap `apply_guardrail` the way LiteLLM's `__init_subclass__` does. Call the guardrail's `apply_guardrail(GuardrailApiInputs { texts: Some(vec![text]), ..Default::default() }, &mut request_data, input_type, ..)` from B5471's `GuardrailContract`.
  6. `response_text` is the first item of the returned `texts` when the list is not empty, else the request `text`.
  7. Failure path, for any error from steps 2 to 6: with a logging handle and an error that is not an HTTP error (the 404 above is one), call the handle's async failure handler, then submit its sync failure handler to the background executor; a failure of either is logged ("apply_guardrail: async_failure_handler failed", "apply_guardrail: failure_handler submit failed") and never changes the answer. Then call `ApplyHooks::post_call_failure(key, error, data)`; when it returns a replacement error use that one, and when the hook itself fails log "apply_guardrail: post_call_failure_hook failed" and keep the original. The error then becomes the proxy's OpenAI-style error: an HTTP error keeps its status and message with type "internal_server_error"; any other error uses its own status when it has one, else 500, with its text as message.
  8. Success path (success_logs.rs), outside the failure handling above so a hook error never starts failure handlers. Call `ApplyHooks::post_call_success(data, key, response)`; a returned `ApplyGuardrailResponse` replaces the response, any failure is logged ("apply_guardrail: post_call_success_hook failed") and ignored. Build the logging payload from the response after that hook: `{"response": <response as JSON with null fields left out>}`. With a logging handle, call its async success handler with that payload, the start time, an end time taken now and `cache_hit` false, then submit the sync success handler to the background executor with the same values; failures are logged ("apply_guardrail: async_success_handler failed", "apply_guardrail: success_handler submit failed") and ignored. Return the response.

  Oracle: HTTP cases boot LiteLLM and betterlite with the same config. Use a `tool_permission` guardrail (no external service) for the success case: with text input only it hands the text back, so `response_text` equals `text`. The worker reads tool_permission.py to confirm that before writing the case and picks another local guardrail if it does not hold. The category cases use the bundled files `bias_gender` (yaml) and `harm_toxic_abuse_au` (json). The success logging and failure hook branches need the proxy's logging objects, so named Rust tests with fake ports cover them.
