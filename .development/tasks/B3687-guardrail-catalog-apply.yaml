deviations:
  - what: >-
      major_airlines never answers 404 or 500; the list is compiled into the binary.
    why: >-
      LiteLLM reads a file from its package folder at request time and only fails when the install is broken. A compiled-in file cannot go missing.
  - what: >-
      The YAML syntax error text after "Invalid YAML syntax: " comes from serde-saphyr, not PyYAML, and the parser follows YAML 1.2 (so `yes`, `no`, `on` and `off` are plain text, not booleans).
    why: >-
      PyYAML's marks and messages are not reproducible. The oracle case for bad syntax therefore compares status and `valid` only. The entry checks are unaffected because `keyword` and `action` are compared as text.
  - what: >-
      A request body that is not valid JSON or has the wrong field types gets the 422 body the sibling routes give.
    why: >-
      Same rule as every other admin route in the crate; the body decoder is B3662's.
out_of_scope:
  - "get_initialized_guardrail_with_read_through and the registry re-sync behind it (registry_read_through.py): B8231 owns the code, B3683 builds `sync_locked` and `poll_database`. B8231 also declares the `GuardrailLookup` port in registry_read_through/lookup.rs; this task imports it and calls get_guardrail_with_read_through."
  - "common_processing_pre_call_logic, post_call_failure_hook, post_call_success_hook and the proxy logging object (async_failure_handler, failure_handler, async_success_handler, success_handler, update_messages): B004, B014 and B124. This task declares `ApplyHooks` and `ApplyLog` and calls them."
  - "handle_exception_on_proxy and ProxyException (proxy/utils.py): B124. This task builds only the mapping from its own error to status and message, and the shared error renderer of the server turns it into the body."
  - "Category file decoding and loading (content_filter.py): B3692. DATA_ROOTS, category_dirs and find_category_file: B3691. safe_join and is_within: B4260. major_airlines.json and its use in the competitor intent check: B3697."
  - "The guardrail's own apply_guardrail logic and the GuardrailContract trait: B5471 and each provider task."
  - "The list, info and form routes (B3684), mutations (B3685), submissions and the custom-code test route with `_execution_timeout_response` and `_run_test_guardrail` (B3686), the usage router mount at L2457 (B104)."
pitfalls:
  - "The 404 for an unknown guardrail is raised inside the try block, so it passes post_call_failure_hook and comes out as the proxy error body with type internal_server_error and code 404, not as `{\"detail\": ...}` like the three catalog routes."
  - "category_yaml checks the traversal twice: `safe_join` on the `.yaml` name first (400), then `is_within` on the file actually found (400). A symlink inside categories/ that points elsewhere passes the first and must fail the second."
  - "A category stored as `.json` is returned under the key `yaml_content` with `file_type` \"json\"; the key name is kept for old UI clients."
  - "validate_blocked_words_file answers 200 for every verdict, including invalid ones. The no-content, wrong-shape and not-a-list cases use the key `error` (one text); the per-entry cases use `errors` (a list)."
  - "An entry that is not a mapping stops that entry only (`continue`), so later entries are still checked and their messages follow in index order."
  - "`blocked_words: null` is present but not a list, so it gets \"'blocked_words' must be a list\", not the missing-key message."
  - "`action` is compared as exact text: `block` in lower case is an error, and the message repeats the value as it was written."
  - "apply_guardrail builds `inputs` with only `texts`, so any other field of the guardrail input (images, tools, model) is empty; `language` and `entities` from the body never reach the guardrail."
  - "`request_data` holds `messages` only when the body sent the key, and an empty list still counts as sent; the `messages` in `data` use `or []` instead, so an empty list and null look the same there."
  - "The input type upgrade applies to the literal `request` only. A body of `response` or `foo` is never upgraded, and `foo` becomes `request`."
  - "Success logging runs after the try block, so an error in the success hooks never runs the failure handlers and never turns into an error answer."
  - "The sync handlers (`failure_handler`, `success_handler`) go to the background executor with positional arguments in this order: error then traceback for failure; result, start time, end time, cache_hit for success."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
