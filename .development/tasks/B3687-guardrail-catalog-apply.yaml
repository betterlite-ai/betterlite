dod:
  - text: >-
      category_yaml returns the raw file text with `category_name`, `yaml_content` and `file_type`, prefers yaml over json, answers 400 "Invalid category name" for a NUL byte and for a symlink that points out of the folder, and 404 with the exact "tried .yaml and .json" text for an unknown name.
    proof: [catalog-category-tests, oracle]
  - text: >-
      major_airlines returns the 351 entries of B3697's file as `{"airlines": [...]}` in file order.
    proof: [catalog-airlines-tests, oracle]
  - text: >-
      validate_blocked_words_file gives each verdict body exactly (missing content, YAML syntax error, wrong shape, non-list, per-entry messages in order, valid with the count) and always answers 200.
    proof: [catalog-blocked-words-tests, oracle]
  - text: >-
      The blocked-words decoder never panics, its fuzz target exists and its corpus replays.
    proof: [catalog-blocked-words-corpus]
  - text: >-
      apply_guardrail answers `response_text` from the first returned text, falls back to the request text when no text comes back, and serves both paths.
    proof: [catalog-apply-tests, oracle]
  - text: >-
      An unknown guardrail name gives the exact 404 message in the proxy's error body and runs the failure hook once.
    proof: [catalog-apply-tests, oracle]
  - text: >-
      The input type becomes response for a post_call guardrail only when `request` was sent, an unknown input type becomes request, and the invocation record is opened before the guardrail call and finished after it.
    proof: [catalog-input-type-tests]
  - text: >-
      Failure and success logging follow the order and the swallow rules (a failing hook or handler is logged and never changes the answer; the failure handlers do not run for an HTTP error or after a success-hook error).
    proof: [catalog-apply-logging-tests]
  - text: >-
      Every route needs a valid key; a request without one gets the usual 401 body.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: catalog-category-tests
      why: the category download, its traversal checks or its error texts are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::catalog_apply::tests::category_/)'
    - id: catalog-airlines-tests
      why: the airline list route or its embedded data is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::catalog_apply::tests::airlines_/)'
    - id: catalog-blocked-words-tests
      why: a blocked-words verdict or message is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::catalog_apply::tests::blocked_words_/) - test(replays_the_blocked_words_file_corpus)'
    - id: catalog-blocked-words-corpus
      why: the blocked-words fuzz target or its replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/blocked_words_file.rs &&
        grep -q 'name = "blocked_words_file"' crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/blocked_words_file)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_blocked_words_file_corpus)'
    - id: catalog-apply-tests
      why: the apply route, its lookup, its answer or its error body is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::catalog_apply::tests::apply_/)'
    - id: catalog-input-type-tests
      why: the input type rule or the invocation record order is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::catalog_apply::tests::input_type_/)'
    - id: catalog-apply-logging-tests
      why: a success or failure logging step, or its swallow rule, is missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::catalog_apply::tests::logging_/)'
