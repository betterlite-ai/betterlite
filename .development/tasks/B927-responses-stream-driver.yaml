id: B927
title: Drive live and cached Responses streams
description: >-
  Implement api::responses_stream_driver for the complete fallback helpers L954-L992 and
  four iterator classes L1009-L1326. B2413 supplies base state/duration,B925 processes one
  framed payload,B926 handles hooks/errors/logging,and B928 builds synthetic events. Live
  streams reuse B005 SSE framing over B173 HTTP; fake streams use B508 response conversion
  and cached streams receive B1138 records. Do not retain the old tail fragment of
  _process_chunk here: B925 owns that function whole.

  Add B2401 operation responses_stream_driver with live_sync,live_async,fake,cached modes.
  Live modes open a real prepared POST to the mock provider and pass its response body
  into the native/pinned iterator; they must not call a later Responses SDK orchestration
  task. Fake mode captures one JSON provider response,cached mode expects zero requests.
  Compare yielded events,failures,connection closure and ordered callback effects. The
  source owns 308 nonblank/non-comment lines; budget 300 implementation,180 tests,
  140 HTTP cases,110 adapters and 25 wiring: 755 total. No helper case or new parser is added.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_stream_driver.rs
  - crates/betterlite-core/src/api/responses_stream_driver/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/responses_stream_driver.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/responses_stream_driver.py
  - tools/oracle/cases/sdk-http/responses-stream-driver/**
  - tools/oracle/helpers/b927.py
  - tools/oracle/helpers/b927/**
  - tools/oracle/src/helpers/core_ops/b927.rs
  - tools/oracle/src/helpers/core_ops/b927/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L954-L992
  why: Yielded lifecycle events and actual output affect early-EOF/transport fallback differently.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L1009-L1326
  why: Entire live sync/async and fake/cached iterators,including callback timing and synthetic chunk size 5.
dod:
- text: >-
    live_sse_delivery sends POST /v1/responses with model=gpt-4o-mini,input=hi,stream=true
    and Bearer sk-test. Fragment UTF-8 and JSON across reads,include SSE comments/event
    lines and malformed data,then output_text.delta=hello,completed and [DONE]. B005
    framing plus B925 drops only its specified payloads; yield hello and terminal once.
    Duration checks run before a poll and after each received SSE event,not as a separate
    timer interrupting a stalled read. B926 checks errors before deployment hooks,then
    note_yielded_event records the hook's returned type. Async awaits hooks directly;
    sync uses B198's async runner.
  proof: [stream-driver-tests, oracle, stream-driver-adapter]
- text: >-
    early_stream_end with EOF or [DONE] before a completed/incomplete/failed event raises
    APIConnectionError status=500,message="litellm.APIConnectionError: openai closed the responses stream before any terminal event (response.completed, response.incomplete or response.failed)".
    Before output it is wrapped in MidStreamFallbackError with original status=500,
    generated_content="" and is_pre_first_chunk=true if no event was yielded,false after
    created/in_progress/queued. These three event types alone do not set output_started;
    any other yielded type does. After a text event,the original APIConnectionError is
    raised directly. Null provider uses "provider" in the inner message. Failure handlers run once.
  proof: [stream-driver-tests, oracle, stream-driver-adapter]
- text: >-
    transport_error_boundary treats ReadError/RemoteProtocolError before output as a
    MidStreamFallbackError,default status=503 when original has no status,generated_content="";
    after output re-raise the transport error. After any stored terminal response,those
    two transport errors end iteration normally without failure logging. Other HTTP errors
    and general exceptions still set finished=true,invoke failure and propagate even after
    a terminal. Async waits for B926 pending tasks on every exceptional exit,including
    normal exhaustion; sync does not wait. Existing B011 SDK error fields/message policy apply.
  proof: [stream-driver-tests, oracle, stream-driver-adapter]
- text: >-
    terminal_errors_and_hooks sends response.failed with code=rate_limit_exceeded,
    message=slow after text hi. B925 stores/logs it; B926 raises a 429 MidStreamFallbackError
    carrying generated_content=hi before any deployment hook or failed event is yielded.
    An invalid_request_error with non-policy 400 raises the mapped error directly.
    Successful completed/incomplete events are yielded and remembered; subsequent EOF is
    normal. An exception from processing or the duration check marks finished and invokes
    failure only once despite overlapping processing/driver handlers.
  proof: [stream-driver-tests, oracle, stream-driver-adapter]
- text: >-
    fake_response_iteration captures one nonstream JSON response with text=abcdef and
    transforms it through B508 before initializing base state with an empty HTTP 200
    response. B928 emits five-character deltas abcde,f. completed_response is preset to
    the final event before the first poll; reaching response.completed invokes success
    logging in the matching sync/async mode. Iterator exhaustion raises only stop-iteration.
    Synthetic iteration does not call live deployment hooks,duration checks or note_yielded_event.
  proof: [stream-driver-tests, oracle, stream-driver-adapter]
- text: >-
    cached_response_iteration starts provider=cached_response,metadata=null,model from
    response or "",cache_hit=true,persist_before_logging=false,chunk_size=5 and index=0.
    It yields the same B928 event list and logs success only when completed is returned,
    without recaching or provider HTTP. A partially consumed cache stream has no success
    dispatch yet even though completed_response is preset. Separate instances keep indices
    and callback flags isolated. Releasing a cancelled live stream releases its B173 body.
  proof: [stream-driver-tests, oracle, stream-driver-adapter]
checks:
  optional: []
  commands:
  - id: stream-driver-tests
    why: fallback boundaries, callback timing or synthetic iteration differs
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_driver::/)'
  - id: stream-driver-adapter
    why: live stream behavior is not exercised against independently captured HTTP
    run: test -f tools/oracle/sdk_http/responses_stream_driver.py && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/responses-stream-driver)" && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/sdk-http/responses-stream-driver/live-sse-delivery.yaml
- tools/oracle/cases/sdk-http/responses-stream-driver/early-stream-end.yaml
- tools/oracle/cases/sdk-http/responses-stream-driver/transport-error-boundary.yaml
- tools/oracle/cases/sdk-http/responses-stream-driver/terminal-errors-and-hooks.yaml
- tools/oracle/cases/sdk-http/responses-stream-driver/fake-response-iteration.yaml
- tools/oracle/cases/sdk-http/responses-stream-driver/cached-response-iteration.yaml
deviations: []
out_of_scope:
- B2413 owns base primitives/state L73-L361,B925 all of _process_chunk L363-L532,B926 hooks L534-L952,and B928 builders L1329-L1732; testing-only facades have no production caller.
- B942-B945 own websocket code after L1732; B173/B005 own HTTP body cleanup and SSE byte framing.
- B1078/B932 select this driver during SDK execution; importing those callers here would invert the dependency graph.
pitfalls:
- A lifecycle event makes is_pre_first_chunk false without preventing transport fallback.
- ReadError after a terminal is normal exhaustion,but other HTTP errors after a terminal still fail.
- Cached completed_response exists before any events are consumed,but logging waits until its terminal event is yielded.
review_level: security
budget:
  max_changed_lines: 755
  max_new_expects: 1
