pitfalls:
- 'The oracle helper for this task is pre-registered as batch_route_support in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/batch_route_support.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/batch_route_support.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'endpoints.py:193 emits the diagnostic ''create_batch: managed file lookup failed for %s: %s''; retain its level
  and fallback instead of turning it into a hard error.'
- data reads 'litellm_metadata' with default None; omission and an explicit value must not collapse into one case.
