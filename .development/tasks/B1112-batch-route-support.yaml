dod:
- text: 'batch openai fallback missing key: the named production behavior test asserts the result and effects described
    above.'
  proof:
  - case-batch-openai-fallback-missing-key
  - oracle
- text: 'batch managed hook unavailable: the named production behavior test asserts the result and effects described
    above.'
  proof:
  - case-batch-managed-hook-unavailable
  - oracle
- text: Every enumerated config/environment setting loads, defaults and changes the typed settings; existing YAML
    fuzz corpus exercises the new keys.
  proof:
  - config-tests
  - config-corpus
- text: The independent Rust/Python helper adapter and the externally tagged case seed execute through B171.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: Every listed case is a newly added parity fixture and compares independent native and pinned results.
