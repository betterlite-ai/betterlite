id: B1112
title: Batch route support
description: >-
  Provide shared batch route fallback, managed-row lookup, executed runner selection and input-file resolution.
  No route is registered here; return typed dispatch plans and MIT no-hook failures.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-core/src/api/batch_route_support.rs. Use BatchRouteSupportInput and BatchRouteSupportResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:167 type='invalid_request_error', param=None, code=404. Compare the actual source
  status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions batch_openai_fallback_mis_7880, batch_managed_hook_unavailable under
  api::batch_route_support::tests. Each named function drives production code and asserts its case result; use named
  rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.OPENAI_API_KEY
  defaults to unset means fallback cannot serve a provider-less file/batch request; litellm_settings.api_key defaults
  to None; litellm_settings.openai_key defaults to None. No environment reads occur outside betterlite-config. Test
  api::batch_route_support::tests::loads_settings uses the production Config loader and an injected environment
  map, with a named rstest case for every key above, explicit override, unset/default and invalid-value/fallback
  behavior. Keys must be accepted, applied and absent from the unsupported-key report; a grep is not proof of support.
  Add new config_yaml seeds for these keys and replay B002's existing decoder rather than introducing a second YAML
  parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::BatchRouteSupport in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_route_support: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/batches_endpoints/endpoints.py: _request_tags (L82-L86); litellm/proxy/batches_endpoints/endpoints.py:
  _litellm_executed_batch_runner (L89-L105); litellm/proxy/batches_endpoints/endpoints.py: _batch_from_database
  (L108-L131); litellm/proxy/batches_endpoints/endpoints.py: _raise_when_input_file_must_be_managed (L134-L141);
  litellm/proxy/batches_endpoints/endpoints.py: _litellm_metadata_of (L144-L155); litellm/proxy/batches_endpoints/endpoints.py:
  _raise_not_found_when_openai_fallback_unservable (L158-L172); litellm/proxy/batches_endpoints/endpoints.py: _resolve_managed_input_file_storage_url
  (L175-L197); litellm/proxy/batches_endpoints/endpoints.py: _create_provider_batch_for_managed_file (L200-L215).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 103 owned nonblank/non-comment/non-docstring Python lines (116 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 123 implementation,
  52 behavior tests, 24 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 39 config tests/seeds and
  30 wiring; 358 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B1019 (File routing ids), B1020 (File credentials), B1041 (Batch managed records), B1048
  (Executed batch input), B1049 (Executed batch runner), B171 (Direct helper oracle and URL path encoding), B1087
  (Api boundaries), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
