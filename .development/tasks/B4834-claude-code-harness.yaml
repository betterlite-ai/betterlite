id: B4834
title: Translate Claude Code sessions and stream events
description: >-
  Build Claude Code's private config/env, permission flags, resume argv and event parser.
  Implement ClaudeCodeHarnessConfig that validates credential/config conflicts, builds
  session argv with permission modes and model overrides, and parses stream-json events.
  Preserve synthetic/subagent traffic suppression via parent_tool_use_id checks,
  result-event success checks and structured-output extraction, including tool_approval=False
  and the permission mode constants. Manage MANAGED_ENV_KEYS (ANTHROPIC_BASE_URL,
  ANTHROPIC_AUTH_TOKEN, ANTHROPIC_API_KEY, ANTHROPIC_MODEL, ANTHROPIC_SMALL_FAST_MODEL,
  CLAUDE_CONFIG_DIR) so options.env cannot override them, and MANAGED_CONFIG_KEYS (env,
  apiKeyHelper, model, permissions, awsAuthRefresh, awsCredentialExport, forceLoginMethod)
  so options.config cannot override them. Build argv with --permission-mode values mapping
  ("read-only"→plan, "ask"→default, "edit"→acceptEdits, "full"→bypassPermissions), resolve
  session model group for ANTHROPIC_MODEL/ANTHROPIC_SMALL_FAST_MODEL background calls,
  and suppress disallowed tools via --disallowedTools. Parse stream-json events suppressing
  parent_tool_use_id traffic, extract text/reasoning/tool_call/tool_result from assistant/user/system/result
  events, normalize tool names through NATIVE_TO_NORMALIZED, detect session_id from init
  subtype and result events, and capture structured_output. Extract final text from result_text
  (one result event) or joined text_parts, detect errors from exit_code/result_seen/is_error,
  and select reason from result_text or joined errors before building the error message.
  Extract final structured output first from structured_output dict via json.dumps, or otherwise
  via last_json_object(final_text). Use three STATIC_ENV keys (DISABLE_TELEMETRY, DISABLE_ERROR_REPORTING,
  DISABLE_AUTOUPDATER) and CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, and set CLAUDE_CONFIG_DIR
  to the private dir to prevent reading repo .claude/settings.json or user keychain/login.
  Build STRUCTURED_OUTPUT_INSTRUCTION constant formatting output schema into instructions.
  Build persisted_dirs mapping ("projects"→claude_code/projects) for session reuse. The
  binary is "claude", install hint is "npm install -g @anthropic-ai/claude-code", and
  capabilities are tool_approval=False, structured_output=True, tool_filtering=True,
  history=False, custom_tools=False, skills=True, resume=True, permission_modes={read-only,
  edit, full}. The helper cases run through oracle operation b4834, registered with a stub
  in the harness helper group.
