dod:
  - text: ClaudeCodeHarnessConfig validates that ClaudeCodeOptions.env/config do not set or override managed keys, and raises OptionsMismatch with the key names.
    proof: [claude-code-validation-tests]
  - text: Session argv includes --permission-mode value from permission mode mapping and --disallowedTools from native tool names, with model override env vars for background calls.
    proof: [claude-code-argv-tests]
  - text: Stream-json assistant/user/system/result events are parsed into Text/Reasoning/ToolCall/ToolResult/Compaction events, suppressing parent_tool_use_id traffic and synthetic model errors.
    proof: [claude-code-parsing-tests]
  - text: Tool call events normalize tool names through NATIVE_TO_NORMALIZED and synthesize tool results from tool_result blocks in user events.
    proof: [claude-code-parsing-tests]
  - text: Session init and result events extract session_id, and result events extract structured_output field or trigger JSON extraction from final text.
    proof: [claude-code-parsing-tests]
  - text: Turn success is determined from exit_code, result_seen, and is_error, and error message is built from result_text/errors/stderr before raising HarnessTurnError.
    proof: [claude-code-response-tests]
  - text: "Structured output is extracted first from structured_output dict via json.dumps, otherwise via
           last_json_object(final_text); transform_turn_response produces only output_json, with schema
           validation (parse_output) owned by B4844."
    proof: [claude-code-response-tests]
  - text: Every JSONL fixture from LiteLLM is copied byte-for-byte under tools/oracle/cases/claude_code/fixtures/.
    proof: [claude-code-fixtures-pinned]
  - text: Every oracle helper case parses the matching fixture and verifies event sequences.
    proof: [claude-code-oracle-cases]
