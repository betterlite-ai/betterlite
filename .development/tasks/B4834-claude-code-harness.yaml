deviations: []
out_of_scope:
  - B4830 owns event_list, Harness enum, Capabilities dataclass, Event/Text/Reasoning/ToolCall/ToolResult constructors and Sandbox.host_url contract.
  - B4831 owns normalize_tool_name, native_tool_names, stderr_tail_text, last_json_object helpers.
  - B4844 owns parse_output schema validation (litellm/harness/runtime.py:247-255); this task produces output_json only.
  - Base harness container/environment/permissions setup is owned by B4830 (SessionContext, Sandbox) and infrastructure tasks.
pitfalls:
  - Synthetic model messages (model == "<synthetic>") are CLI-generated error text never surfaced as text events, only via result event.
  - Parent_tool_use_id marks subagent traffic that must be suppressed even when the event is otherwise valid.
  - Session_id appears in both system init events and result events; result event takes precedence for resume.
  - MANAGED_ENV_KEYS and MANAGED_CONFIG_KEYS rejection must list the exact clashing keys, not just say "managed".
  - Permission modes are mapped case-sensitively through PERMISSION_MODES; unknown modes pass through, not rejected here.
  - >-
    Structured output extraction is a two-step process: if isinstance(state.structured_output, dict)
    then json.dumps(structured_output), else last_json_object(state.final_text); final_text already
    prefers result_text over joined text_parts.
