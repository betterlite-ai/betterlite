oracle_cases: []
deviations:
  - what: betterlite raises HTTPException with status 500 (matching LiteLLM) and detail containing error, javelin_guardrail_response and reject_prompt, but error messages are betterlite's own wording.
    why: Error messages are betterlite's own per rule errors-match-litellm; status code and structure match LiteLLM's.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/javelin/javelin.py#L260-L267
  - what: Javelin does not parse response fields like language or other assessment types; unrecognized assessment types are silently passed over without raising an error.
    why: LiteLLM's implementation iterates through assessment types without validation and only raises on request_reject true; betterlite follows the same pattern.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/javelin/javelin.py#L216-L242
out_of_scope:
  - 'CustomGuardrail.__init__, should_run_guardrail, standard logging helpers; owned by unresolved framework owner (F).'
  - 'HTTP client initialization via get_async_httpx_client and AsyncHTTPHandler.post; owned by unresolved transport owner (H).'
  - 'Secret manager functions get_secret_str and get_secret; owned by unresolved secret manager owner (S).'
  - 'add_guardrail_to_applied_guardrails_header; owned by unresolved applied-guardrail header owner (A).'
  - 'add_litellm_callback and callback registration; owned by unresolved callback owner (R).'
  - 'Legacy Lakera moderation logic (the _check method and hooks calling it); belong to B3755 and B3779.'
  - 'Framework lifecycle and registration beyond initialize_guardrail; belongs to B107.'
pitfalls:
  - Javelin get_secret_str is called for api_key; it returns empty string if not set, unlike get_secret which may raise. Test handles both cases.
  - Javelin's rejection status is hardcoded 500, not 400; oracle cases and tests must use status 500.
  - Javelin processes assessments in order and stops at the first request_reject=true; later assessments are ignored.
  - Legacy Lakera's api_key reads os.environ.get("LAKERA_API_KEY") directly while api_base reads get_secret("LAKERA_API_BASE") for default lookup.
  - Legacy Lakera's constructor does not implement moderation hooks; those remain in B3755 and B3779; this task only builds constructor and get_supported_event_hooks.
review_level: standard
budget:
