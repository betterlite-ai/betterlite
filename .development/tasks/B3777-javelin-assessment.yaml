id: B3777
title: Javelin assessment and legacy Lakera initialization
description: >-
  Implement Javelin's pre-call assessment hook, first rejection selection and fail-open API wrapper,
  retaining the pinned rejection status 500 when a request is blocked. Javelin's async_pre_call_hook
  extracts the last user message from the request, calls the Javelin guard API at {api_base}/{api_version}/guardrail/{guardrail_name}/apply
  with JavelinGuardRequest, processes the response assessments, and rejects with status 500 and detail
  containing reject_prompt, error message and javelin_guardrail_response when request_reject is true on the first
  assessment found. API calls include x-javelin-apikey header; optional x-javelin-application is added when application
  is set. When the API fails or times out, assessment list becomes empty (fail-open). Constructor takes api_key
  (required, env var JAVELIN_API_KEY or via get_secret_str), api_base (optional, env var JAVELIN_API_BASE or default
  https://api-dev.javelin.live), api_version (default "v1"), default_on (default True), guardrail_name (default
  "trustsafety"), javelin_guard_name (optional, defaults to guardrail_name), metadata, config, and application.
  The initialize_guardrail function raises an exception when guard_name is missing. Registration with the logging
  callback manager happens in the initialize function.

  Also own legacy Lakera's constructor and event hooks (lakeraAI_Moderation.__init__ and get_supported_event_hooks)
  so its moderation hook (the _check method and hooks that call it) can depend on initialized state without
  depending on registration. Lakera v1 takes moderation_check ("pre_call" or "in_parallel"), category_thresholds
  (optional), api_base (optional, env var LAKERA_API_BASE or via get_secret, default https://api.lakera.ai), and
  api_key (optional, reads LAKERA_API_KEY env var directly via os.environ.get). The constructor builds the
  async_handler once via get_async_httpx_client. The get_supported_event_hooks method returns
  [GuardrailEventHooks.pre_call, GuardrailEventHooks.during_call].
scope:
  paths:
    - crates/betterlite-guardrails/src/javelin.rs
    - crates/betterlite-guardrails/src/javelin/**
    - crates/betterlite-guardrails/src/lakera.rs
    - crates/betterlite-guardrails/src/lakera/**
  lint_tables: false
