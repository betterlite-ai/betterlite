dod:
  - text: >-
      Javelin initialize_guardrail raises an exception when litellm_params.guard_name is None,
      with a message that mentions "JavelinGuardrailException".
    proof: [javelin-initialization-error]
  - text: >-
      Javelin constructor accepts api_key (required, reads JAVELIN_API_KEY env var via get_secret_str if not provided),
      api_base (optional, reads JAVELIN_API_BASE env var or defaults to https://api-dev.javelin.live),
      api_version (default "v1"), default_on (default True), guardrail_name (default "trustsafety"),
      javelin_guard_name (optional, defaults to guardrail_name), metadata, config, and application.
    proof: [javelin-constructor]
  - text: >-
      Javelin async_pre_call_hook extracts last user message from request messages via get_last_user_message,
      builds JavelinGuardRequest with text input, and returns early if no messages or text found.
    proof: [javelin-hook-extraction]
  - text: >-
      Javelin calls POST {api_base}/{api_version}/guardrail/{javelin_guard_name}/apply with x-javelin-apikey header;
      optional x-javelin-application header is added when application is set.
    proof: [javelin-api-call]
  - text: >-
      Javelin processes response assessments and rejects (raises HTTPException status 500) on first assessment
      where request_reject is true; reject_prompt comes from results.reject_prompt, defaulting to a standard message.
    proof: [javelin-rejection]
  - text: >-
      Javelin fail-open: when API call fails or times out, returns empty assessments list without raising,
      letting the request proceed unchanged.
    proof: [javelin-fail-open]
  - text: >-
      Javelin rejection response includes status 500 with detail containing error message, javelin_guardrail_response, and reject_prompt.
    proof: [javelin-rejection-status]
  - text: >-
      Javelin calls add_guardrail_to_applied_guardrails_header to record applied guardrail when request passes assessment.
    proof: [javelin-applied-header]
  - text: >-
      Javelin get_supported_event_hooks returns [GuardrailEventHooks.pre_call].
    proof: [javelin-hooks]
  - text: >-
      Javelin initialization registers the guardrail callback with litellm.logging_callback_manager via add_litellm_callback.
    proof: [javelin-registration]
  - text: >-
      Legacy Lakera constructor accepts moderation_check (default "in_parallel"), category_thresholds (optional),
      api_base (optional, reads LAKERA_API_BASE env var via get_secret or defaults to https://api.lakera.ai),
      and api_key (optional, reads LAKERA_API_KEY env var directly via os.environ.get).
    proof: [lakera-constructor]
  - text: >-
      Legacy Lakera get_supported_event_hooks returns [GuardrailEventHooks.pre_call, GuardrailEventHooks.during_call].
    proof: [lakera-hooks]
  - text: >-
      Legacy Lakera constructor builds async_handler once via get_async_httpx_client(llm_provider=httpxSpecialProvider.GuardrailCallback).
    proof: [lakera-handler]
