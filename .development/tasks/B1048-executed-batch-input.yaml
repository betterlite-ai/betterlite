  _resolve_transition (L381-L384); litellm/proxy/batches_endpoints/litellm_executed_batches.py: executed_batch_runner_lost
  (L387-L390); litellm/proxy/batches_endpoints/litellm_executed_batches.py: _StopWatch.__init__ (L394-L398); litellm/proxy/batches_endpoints/litellm_executed_batches.py:
  _StopWatch.stopped (L400-L408). Abstract/protocol declarations map to native types and synchronous/async wrappers
  share one implementation; a partial function span is the explicit preparation/transition stage described above,
  with typed values passed to the following stage.


  Sizing: 224 owned nonblank/non-comment/non-docstring Python lines (224 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 244 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 572 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B1035 (Batch records), B1087 (Api boundaries),
  B732 (Typed authentication principals and grant resolution), B855 (Authenticated request admission and budget
  handoff), B756 (Authentication header selection and mode dispatch). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
