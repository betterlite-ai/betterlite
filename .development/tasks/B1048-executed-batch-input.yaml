pitfalls:
- 'The oracle helper for this task is pre-registered as executed_batch_input in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/executed_batch_input.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/executed_batch_input.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
