checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::executed_batch_input::/)
      - test(/::replays_corpus$/)'
  - id: case-executed-provider-selection
    why: the executed-provider-selection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::executed_batch_input::tests::executed_provider_selection($|::)/)'
  - id: case-batch-row-post-only
    why: the batch-row-post-only behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::executed_batch_input::tests::batch_row_post_only($|::)/)'
  - id: case-unsupported-row-url
    why: the unsupported-row-url behavior or its assertions are absent
