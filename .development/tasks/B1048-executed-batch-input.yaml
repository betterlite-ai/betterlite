  - id: case-unsafe-row-body
    why: the unsafe-row-body behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::executed_batch_input::tests::unsafe_row_body($|::)/)'
  - id: case-cancelling-transition
    why: the cancelling-transition behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::executed_batch_input::tests::cancelling_transition($|::)/)'
  - id: case-row-error-envelope
    why: the row-error-envelope behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::executed_batch_input::tests::row_error_envelope($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/executed_batch_input)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/executed_batch_input.rs && grep -qF "decode_executed_batch_input"
      crates/betterlite-core/fuzz/fuzz_targets/executed_batch_input.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::executed_batch_input::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/executed_batch_input.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/executed_batch_input-*)"
      && grep -qE "^[[:space:]]+executed_batch_input:" tools/oracle/fuzz/corpus/helper_case/executed_batch_input-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/executed-batch-input)"
