id: B1048
title: Executed batch input
description: >-
  Define the proxy-executed batch provider decision, row schema and result/status transitions. Accept POST rows
  only for /v1/chat/completions, /v1/completions, /v1/embeddings and /v1/responses, preserve row line numbers and
  reject unsafe body controls using B052 before dispatch.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-core/src/api/executed_batch_input.rs. Use ExecutedBatchInputInput and ExecutedBatchInputResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): litellm_executed_batches.py:325 type=error_type, param=None, code=status_code. Compare the
  actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions executed_provider_selection, batch_row_post_only, unsupported_row_url,
  unsafe_row_body, cancelling_transition, row_error_envelope under api::executed_batch_input::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::executed_batch_input::decode_executed_batch_input(bytes:
  &[u8], limits: &ApiLimits), for BatchInputLine.model_validate_json input raw at litellm/proxy/batches_endpoints/litellm_executed_batches.py:292.
  Place its implementation in crates/betterlite-core/src/api/executed_batch_input.rs and call it from the actual
  boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/executed_batch_input.rs passes arbitrary
  bounded bytes to that exact decoder; api::executed_batch_input::tests::replays_corpus replays newly committed
  seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ExecutedBatchInput in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {executed_batch_input: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


