id: B4415
title: Create, restore, replicate and rotate AWS secrets
description: >-
  Build AWS secret writes and their ordered recovery paths, with same-name rotation using PutSecretValue.
  Replication remains best effort after creation succeeds; restore/update/tag/delete recovery preserves
  the source's sequence and failure propagation. Implement the async write, create-or-restore recovery,
  deletion check, replication, put-value, rotation and delete operations on the AWSSecretsManagerV2 client.

  The async_write_secret operation orchestrates the full lifecycle: it builds a request with optional
  description, KMS key, and tags (normalized to AWS {Key, Value} pairs from dict or list), calls
  _async_create_or_restore_secret to create or recover the secret, then attempts replication when
  replica_regions is configured. Replication failure warns after creation succeeds; do not fail or
  rollback. The _async_create_or_restore_secret method first attempts CreateSecret, and on failure checks
  if the secret is scheduled for deletion via _async_is_scheduled_for_deletion (which inspects DescribeSecret
  response for DeletedDate presence). If deletion is pending, restore via RestoreSecret, update via
  UpdateSecret with all fields except Tags, then TagResource separately. If update or tagging fails,
  delete the restored secret and propagate the error. The _async_is_scheduled_for_deletion method returns
  a boolean by posting DescribeSecret to AWS; HTTP and timeout errors yield false. The async_replicate_secret
  operation sends ReplicateSecretToRegions with regions as {Region: r} items; it returns an empty dict
  when replica_regions is empty. The async_put_secret_value operation updates an existing secret's value
  in place via PutSecretValue action, used when rotating a secret with the same name (current == new).
  The async_rotate_secret operation branches on whether names match: same-name rotations use async_put_secret_value,
  different-name rotations delegate to the base class async_rotate_secret (which calls async_write_secret
  for new name then async_delete_secret for old name via common rotation). The async_delete_secret
  operation schedules deletion with a recovery window (default 7 days) via DeleteSecret action.

  Every write operation (create, restore, update, tag, replicate, put, delete) calls _async_post_action,
  which prepares the request through _prepare_request (already owned by B4413), posts asynchronously,
  raises ValueError on HTTP errors or timeouts, and returns the JSON response. Tag normalization must
  handle dict keys/values as strings and preserve list items as {Key, Value} objects. ClientRequestToken
  is a UUID for CreateSecret and PutSecretValue. Preserve dict/list tag handling, optional description
  and KMS key, the DeleteSecret recovery default 7, restore only after DescribeSecret reports DeletedDate,
  removal of Tags from UpdateSecret, separate TagResource call, and re-deletion after update/tag ValueError.
  A failed replication logs a warning with the configured regions after successful creation. Secret names
  are already validated by B4410; do not re-validate here.

  All operations are async and use the shared httpx async client from B173. Direct dependencies: B173
  (async_client, get_async_httpx_client), B198 (UUID generation via uuid.uuid4 import), B4410 (base class
  BaseSecretManager and KeyManagementSettings shape), B4413 (_prepare_request), B4414 (async_read_secret
  is supplied to base rotation for existence checks). Callers include virtual-key create/delete/rotate/rename
  hooks and the base class async_rotate_secret for different-name rotation. Encoding is UTF-8, timeouts
  use httpx.Timeout. HTTP 400+ errors (including 409 ResourceExistsException on CreateSecret) raise ValueError
  with the response text; timeouts raise ValueError. HTTP response bodies are parsed as JSON.

  This task does not import litellm_enterprise or use the native rust_bridge. The _prepare_request function
  is owned by B4413 and called by every operation; this task implements the operations that call it, manage
  async flow, and handle recovery logic. Boto3 and botocore are imported and used only by _prepare_request
  (in B4413); this task does not duplicate those imports.

