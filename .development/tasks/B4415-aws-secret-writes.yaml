deviations:
  - what: A failed replication logs a warning after creation succeeds and does not roll back the created secret.
    why: The source implements replication as best-effort with warning-only cleanup, preserving creation success
      even when regional failover is unavailable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L328-L334

out_of_scope:
  - 'B4413 owns _prepare_request, _async_post_action, __init__, validate_environment, load_aws_secret_manager,
    and request header/signing construction via botocore.'
  - 'B4414 owns async_read_secret, sync_read_secret, _parse_primary_secret, and primary-secret lookups; read
    operations are supplied to base rotation.'
  - 'B4410 owns BaseSecretManager base class, async_rotate_secret(current_secret_name, new_secret_name, new_secret_value,
    optional_params, timeout) contract for different-name rotation, and raise_if_unsafe_secret_name validation.'
  - 'B173 owns get_async_httpx_client and the httpx async client lifecycle.'
  - 'B198 owns UUID generation and datetime utilities.'

pitfalls:
  - The oracle helper for this task is pre-registered as b4415 in the secret_managers group. Replace
    the stub Op in tools/oracle/src/helpers/secret_managers/b4415.rs with an impl Helper whose Input
    is the typed input, and write run in tools/oracle/helpers/b4415.py. The registry files (helpers/mod.rs,
    the group files, dispatch.py) are not this task's to edit.
  - CreateSecret with an existing secret name raises ValueError with HTTP 409 ResourceExistsException, which
    triggers the restore path; this is not a timeout.
  - DescribeSecret is used to check deletion status, not for a general describe operation; its DeletedDate
    field is the only concern.
  - Replication does not guarantee all regions succeeded; a partial regional success still logs a warning,
    not an error that prevents return.
  - Tag normalization is eager; invalid tag types are rejected before any AWS call.
  - Same-name rotation does not delete the old secret, only updates the value via PutSecretValue; different-name
    rotation (delegated to base) creates new then deletes old.

