dod:
  - text: >-
      Cases create_secret_success, create_with_tags_dict, create_with_tags_list, create_with_description_and_kms,
      restore_on_deletion_scheduled, restore_with_separate_tags, update_tag_re_deletion_on_tag_error,
      replicate_after_create_succeeds, replicate_warns_on_failure, replicate_empty_when_no_regions,
      same_name_rotation_uses_put_value, different_name_rotation_uses_base, put_secret_value_generates_token,
      delete_with_default_recovery_window, delete_with_custom_recovery_window, invalid_tag_type_raises_value_error
      and http_error_raises_value_error verify write, create/restore, replication, rotation and delete operations
      without altering live AWS state.
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every operation calls _async_post_action with the correct action, secret_name, request_data and
      timeout, receives the JSON response or raises ValueError, and logs warnings only for non-fatal failures
      (replication after creation).
    proof:
      - behavior-tests
  - text: Tag dict normalization produces {Key, Value} list items; list items pass through; invalid tag types
      raise ValueError.
    proof:
      - behavior-tests

checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The AWS write/delete/rotate domain tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_secrets::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b4415.py && uv run --locked --project tools/oracle/litellm ruff
        check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project
        tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/aws-secrets-*")"
        && grep -rlq "async_write_secret\|async_delete_secret\|async_replicate_secret" tools/oracle/fuzz/corpus/helper_case/aws-secrets-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

