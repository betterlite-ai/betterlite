    Framework base class for guardrail integration; no assigned task owner yet (B104 outline has no task file). Required for initialization and lifecycle; infrastructure dependency."
  - ">-
    HTTP client management (AsyncHTTPHandler.post): Infrastructure layer that provides pooled httpx clients with timeout handling; no assigned task owner yet.
    Injected as dependency rather than constructed here."
  - ">-
    Applied guardrails header addition (add_guardrail_to_applied_guardrails_header from proxy/common_utils/callback_utils.py): Callback utility to record guardrail
    application in response headers; no assigned task owner yet (label A). Use as injected dependency."
pitfalls:
  - Protected indices are calculated in B3773 and must be consistent with the compressible message set; any row in protected_indices is excluded from compression.
  - Issued-hash TTL is 900 seconds (15 minutes) using monotonic time, separate from any cache or storage TTL; hashes are pruned once per apply hook and the map can briefly grow unbounded on high call frequency before the next pruning.
  - The apply hook must preserve the caller's original inputs object when no compression occurred or it failed; returning a rebuilt copy on an unchanged request triggers unnecessary message rewrites downstream.
  - Token savings are only counted when tokens_before and tokens_after are both present as numbers (not booleans); a service that returns booleans true/false instead of numeric token counts will have tokens_saved omitted.
  - Retrieval tool is only added when hashes were successfully recorded; if ccr_retrieval is false, no tool is added even if compression succeeded.
