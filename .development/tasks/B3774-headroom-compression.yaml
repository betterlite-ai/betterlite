dod:
  - text: Bypass header x-headroom-bypass (case-sensitive, value required) skips compression and returns inputs unchanged.
    proof: [headroom-compression-tests]
  - text: Background requests (request_data.get("background") is truthy) skip compression and return inputs unchanged.
    proof: [headroom-compression-tests]
  - text: Compression request sends flattened messages to /v1/compress with model when present, and includes Authorization header when api_key is set.
    proof: [oracle]
  - text: Response parsing validates JSON structure, message array presence and count, rejecting malformed JSON and mismatched counts with fail-open or fail-closed behavior.
    proof: [oracle]
  - text: Compression statistics (tokens_before, tokens_after, compression_ratio, transforms_applied, tokens_saved) are extracted from the response payload.
    proof: [oracle]
  - text: When tokens_saved is absent, it is derived as tokens_before - tokens_after if both values are present and numeric (not boolean).
    proof: [oracle]
  - text: Issued retrieval hashes from service response are recorded in the per-call issued-hash map with 900-second (15-minute) TTL using monotonic time.
    proof: [headroom-compression-tests]
  - text: Hash pruning removes entries past their 900-second TTL once per apply_guardrail call using monotonic time comparison.
    proof: [headroom-compression-tests]
  - text: Call identity is resolved from litellm_call_id in logging object or request state, falling back to generated UUID, recorded in request_data if generated.
    proof: [headroom-compression-tests]
  - text: Protected message indices (system, final user, final assistant, tool results carrying retrieval) are excluded from compression via protected_indices calculated in B3773.
    proof: [oracle]
  - text: Protected rows are restored back into the full message list after compression service returns, preserving their original positions and shapes.
    proof: [oracle]
  - text: Original message identity is preserved when returning caller's inputs object on bypass or failure; inputs object is rebuilt only on successful compression.
    proof: [headroom-compression-tests]
  - text: Retrieval tool is added to the tools list when compression succeeded and hashes were recorded, only if not already present.
    proof: [oracle]
  - text: Applied guardrails header is updated on both success and failure of compression.
    proof: [headroom-compression-tests]
  - text: Logging guardrail information includes compression statistics on success and error details on failure.
    proof: [headroom-compression-tests]
  - text: Request-data adapter validates and reads untranslated messages to recover long MCP tool names before flattening.
    proof: [headroom-compression-tests]
