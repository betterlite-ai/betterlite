  - Content shape restoration (_restore_content_shapes, _restore_protected_messages) provided by B3773.
  - Protected indices calculation (_protected_indices, _raw_retrieve_call_ids, _retrieval_result_indices) provided by B3773.
  - Compression failure detail building (_build_compress_failure_detail) provided by B3773.
