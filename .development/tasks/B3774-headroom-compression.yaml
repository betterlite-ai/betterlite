deviations:
  - what: betterlite does not keep an unbounded map of issued hashes; entries are pruned once per apply_guardrail call based on 900-second (15-minute) monotonic expiry TTL.
    why: LiteLLM's _issued_hashes_by_call_id map can grow without bound if hash validation never calls _prune_expired_hashes. Betterlite enforces TTL-based cleanup on every compression operation with a 15-minute window to permit retrieval in subsequent turns of an agentic interaction.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/headroom/headroom.py#L66
  - what: HTTP POST requests to the compression service carry a Connection timeout separate from the full request timeout to enforce connection establishment deadlines.
    why: httpx.Timeout's connect parameter allows precise control over connection establishment time, improving diagnostic signal when the service is slow to accept connections.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/headroom/headroom.py#L556
