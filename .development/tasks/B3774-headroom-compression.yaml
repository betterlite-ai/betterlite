id: B3774
title: Headroom compression and issued hash tracking
description: >-
  Implement Headroom guardrail's compression request and apply hook that coordinates protected message handling from B3773, compression service communication, and issued-hash tracking for retrieval operations. The apply_guardrail entry point skips compression for bypass requests (x-headroom-bypass header) and background operations, extracts protected indices and compressible message subsets from the protected set defined in B3773, calls the compression service, and restores protected rows back into the result before returning. Only service-issued retrieval hashes are recorded in the per-call issued-hash map; hashes are pruned once per apply hook based on monotonic expiry time with a 900-second (15-minute) TTL.


  Build _build_headroom_retrieve_tool which generates the OpenAI-compatible function schema for the retrieval tool, with parameters for hash (required) and query (optional).


  Implement _resolve_call_id to unify call identity across pre-call and agentic-loop hooks by reading litellm_call_id from the logging object or request state, falling back to a generated UUID if neither is set, so hash scoping is per-call rather than trusting any hash-shaped string in message text.


  Implement compression request _call_compress that sends flattened message payloads to /v1/compress, handles HTTP errors, timeouts and malformed responses by delegating to _handle_compress_failure (provided by B3773), and records compression statistics (tokens_before, tokens_after, compression_ratio, transforms_applied, tokens_saved) from the response. Derive tokens_saved from tokens_before - tokens_after when the service omits it and both token counts are present as numbers.


  Implement _should_bypass to detect x-headroom-bypass headers with a value present (case-insensitive).


  Implement update_in_memory_litellm_params to re-resolve and re-clamp the timeout on parameter updates rather than nulling it, calling _resolve_timeout (provided by B3773).


  Implement _prune_expired_hashes to remove entries from the per-call issued-hash map that are past their TTL (900 seconds) using monotonic time comparison.


  Implement has_headroom_retrieve_tool utility to check whether a tools list contains a headroom_retrieve function by calling has_tool_with_name (from B226).


  Implement apply_guardrail to orchestrate compression: read bypass and background flags, validate message shape, resolve protected indices and compressible subsets, call compression service, restore protected rows, update logging and applied-guardrails header, and record issued hashes. Message identity is preserved when returning the caller's original inputs object for unchanged requests; a rebuilt copy is returned only when compression succeeded and the messages changed.


  The apply hook calls _flatten_messages_for_compression (provided by B3773) on compressible rows, _restore_content_shapes (provided by B3773) on the service output, and _restore_protected_messages (provided by B3773) to interleave protected rows back. It calls _raw_retrieve_call_ids (provided by B3773) to determine which messages carry retrieval results, and _protected_indices (provided by B3773) to expand tool exchanges. Use the request_data adapter (a Pydantic RequestData model in scope) to read untranslated messages and recover long tool names before flattening.
