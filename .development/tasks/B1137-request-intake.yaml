id: B1137
title: Request intake and safe snapshots
description: >-
  Implement add_litellm_data_to_request in litellm/proxy/litellm_pre_call_utils.py:1993-2580 as one callable. It
  receives decoded data, a Starlette Request, UserAPIKeyAuth, ProxyConfig, general_settings (a dict or None), and
  version (a string or None), mutates one request record, and returns that record. Install it in B004's existing
  POST /v1/chat/completions pipeline with a configured mock provider; this task adds no route or alias. The HTTP case
  must compare the provider request, the response status/type/param/code/message, safe headers, and the order of
  observable provider calls. The function does not write a database row; its only asynchronous side effect is the
  PROXY_PRE_CALL success event scheduled after all validation and mutations.


  The first mutation is the root-control strip. With no allow flag, pop each of these exact root keys before adding
  proxy fields: weights, _router_weights, proxy_server_request, standard_logging_object, secret_fields, mock_response,
  mock_tool_calls, disable_global_guardrails, disable_global_guardrail, enable_prompt_caching,
  opted_out_global_guardrails, applied_guardrails, applied_policies, policy_sources, guardrail_scan_ids,
  guardrail_scan_metadata, routing_decision, litellm_gateway_injected_cache, pillar_response_headers,
  _guardrail_pipelines, _pipeline_managed_guardrails, callbacks, service_callback, logger_fn,
  litellm_disabled_callbacks, _agentic_loop_depth, _agentic_loop_fingerprints, _code_interpreter_interception_active,
  _code_interpreter_interception_converted_stream, _code_interpreter_interception_sandbox_key,
  _code_interpreter_interception_session_scoped, _headroom_interception_converted_stream, max_agentic_loops, and
  client_side_timeout. Only a key or team metadata boolean allow_client_mock_response=true preserves mock_response and
  mock_tool_calls. The B1102 URL-valued model/file_id rejection happens before this function's metadata work.


  Pop metadata and litellm_metadata before validating either value. Keep a dict, or parse a JSON string whose result
  is an object; for [] the function raises the B1105 ProxyException with status 400, type bad_request_error, param
  metadata (or litellm_metadata), code 400, and message "Invalid type for '<field>': expected an object, but got an
  array instead.". Strip every key beginning user_api_key_ from both metadata dictionaries. After parsing, also strip
  these exact _UNTRUSTED_METADATA_CONTROL_FIELDS members from both dictionaries: disable_global_guardrails,
  disable_global_guardrail, opted_out_global_guardrails, pillar_response_headers, _pillar_response_headers_trusted,
  pillar_flagged, pillar_scanners, pillar_evidence, pillar_evidence_truncated, pillar_session_id_response,
  applied_guardrails, applied_policies, policy_sources, guardrail_scan_ids, guardrail_scan_metadata,
  routing_decision, litellm_gateway_injected_cache, _session_deployment_affinity_ttl, _consumed_request_tags,
  _routing_request_tags, internal_call_origin, standard_logging_object, proxy_server_request, secret_fields,
  _guardrail_pipelines, _pipeline_managed_guardrails, client_disconnected, error_information, and
  _pre_call_executed_guardrails. The selected metadata slot is metadata for chat; B1105's route selector uses
  litellm_metadata for thread/assistant and its other named metadata routes.


  Build headers in this order: x-litellm-api-key, authorization, then x-api-key marks the authentication header.
  general_settings.forward_llm_provider_auth_headers defaults false and is read by truthiness; if it is absent,
  None, false, or an empty settings dict, fall back to litellm_settings.forward_llm_provider_auth_headers through the
  module attribute litellm.forward_llm_provider_auth_headers, whose default is false/unset. With the effective value
  true, preserve a non-auth x-api-key, put its value in data.api_key, and let it override the deployment credential;
  when x-api-key authenticated the request, remove it. general_settings.litellm_key_header_name defaults None and
  selects the custom proxy-key header. Remove x-litellm-api-key and proxy credentials from the provider view, redact
  credential values as "***REDACTED***" in the logging view, remove MCP credential headers before redaction, and
  retain non-credential x-request-id. The debug records "Request Headers: %s" and "Raw Headers: %s" remain non-fatal.
  The initial proxy_server_request has url=str(request.url), method=request.method, headers=<safe logging view>,
  body=None, credential_fields=sorted names among provider_specific_header, headers, and api_key that are in data, and
  arrival_time=request.state.litellm_received_at.timestamp() or the injected current time when that state is absent.


  Continue in source order: safe_add_api_version_from_query_params; select and initialize the metadata slot; add
  backend-call metadata; add request-header metadata; add trace/session propagation; apply missing-session policy;
  expose the safe headers under metadata.headers; add model-group headers; apply internal-user mapping; read the user
  header; apply the key-hash override; write SecretFields(raw_headers=_raw_headers) with the actual unredacted header
  values behind RedactedDict's display-only redaction; read ?api-version again;
  add provider-specific headers; parse Cache-Control; strip metadata controls; strip pricing, router-reserved, and
  callback fields; apply message-redaction stripping; refresh proxy_server_request.body; snapshot requester_metadata;
  merge the secondary metadata; and then project principal data. A query ?api-version=2024-06-01 writes
  data.api_version="2024-06-01"; a missing query or a query_params KeyError writes nothing. Cache-Control="s-maxage=60,
  public" writes ttl="60"; no Cache-Control writes no ttl. A false-like turn_off_message_logging is one of false,
  "false", "0", "no", or "off" after trim/case-fold, and is stripped only when litellm.turn_off_message_logging=true
  (default false) and no key/team allow_client_message_redaction_opt_out=true; true and other values remain.
  refresh_proxy_server_request.body excludes secret_fields, proxy_server_request, litellm_logging_obj, provider_specific_header,
  headers, and api_key, and must not create a self-reference. The SecretFields write is
  data["secret_fields"] = SecretFields(raw_headers=_raw_headers), where _raw_headers is a RedactedDict containing the
  actual unredacted request-header values; RedactedDict changes only __str__ and __repr__ to
  "RedactedDict(REDACTED)". A consumer may read data["secret_fields"]["raw_headers"]["x-api-key"] and must receive the
  literal header value, not a redaction placeholder.


  The metadata merge is first-writer-wins for ordinary keys. For a selected litellm_metadata slot, promote missing
  trace-control fields from requester_metadata; for a selected metadata slot, merge tags request-first and remove the
  litellm_metadata key. Then write metadata.litellm_api_version=version (null when version is omitted), and, only when
  general_settings is supplied, metadata.global_max_parallel_requests=general_settings.get("global_max_parallel_requests",
  None), whose default is null. Apply key controls, team tags/disable_global_guardrails/opted_out_global_guardrails and
  spend_logs_metadata (request values win on duplicate keys), then project project tags. inherited_tags is the unique,
  first-seen tuple of key tags, team tags, and project tags. After the team metadata merge, re-apply only non-empty
  string key values for OTEL_SERVICE_NAME_METADATA_KEYS=("otel_service_name_override", "otel_service_name"), so a key
  value wins over its team's value. Write the team, key, and user spend/budget fields, carried budget metadata,
  callback-stripped user_api_key_metadata and user_api_key_team_metadata, object-permission ids (null when absent),
  safe headers, endpoint=str(request.url), litellm_received_at (or null), llm_api_timing_windows=(), and
  litellm_parent_otel_span. Copy allowed_model_region only when non-null.


  requester_ip_address defaults ""; when general_settings.use_x_forwarded_for is exactly true and
  x-forwarded-for exists use that complete header value, otherwise use request.client.host when available. user_agent
  defaults "" and uses the request's user-agent header when present. B1109 may set drop_params=true for a Claude Code
  or Codex user-agent only when the body has no drop_params and litellm_settings.drop_params is not configured; an
  explicit body drop_params=false or configured litellm_settings.drop_params prevents insertion. Caller tags come from
  x-litellm-tags split on commas with each item trimmed, plus body tags (or metadata.tags on a litellm_metadata route);
  body tags are merged after header tags, caller_tags is a de-duplicated tuple of those request values, and inherited_tags
  never includes caller tags.


  Finish with the exact handoff order: callback variables from B1109, key litellm_disabled_callbacks when it is a
  non-empty list, await B1108 move_guardrails_to_metadata, save the pre-alias data.model, call B1107 team alias then
  key alias, emit the existing debug record, call B1107 credential overrides with the pre-alias model, run B1107's
  enforced-parameter check, and schedule async_service_success_hook(service=PROXY_PRE_CALL, call_type=
  "add_litellm_data_to_request", duration=end_time-start_time, start_time, end_time, and parent_otel_span). B1107
  and B1108 retain their own errors and warnings; this task does not translate them. No enterprise hook is loaded.


  Implement crates/betterlite-server/src/api/request_intake.rs and crates/betterlite-core/src/api/request_intake.rs
  with typed RequestIntakeInput/RequestIntakeResult, an injected clock, and resolved settings; never read ambient
  environment. Reuse ApiLimits from B1087. B002 loads these settings and its production YAML decoder: general_settings
  forward_llm_provider_auth_headers=false, general_settings.litellm_key_header_name=null,
  general_settings.global_max_parallel_requests=null, general_settings.use_x_forwarded_for=null,
  litellm_settings.forward_llm_provider_auth_headers=false/unset, litellm_settings.overwrite_user_with_key_hash=false,
  and litellm_settings.turn_off_message_logging=false. Each gets an omitted/default, explicit override, and invalid
  value case and is absent from unsupported-key diagnostics; no environment variable is read by request_intake.
  These are already-decoded records, so add no parser or fuzz target.


  Add server/core behavior tests named forged_controls, invalid_metadata, provider_auth_forwarding,
  snapshot_and_metadata_order, query_version_and_cache, principal_budget_projection,
  turn_off_logging_and_agentic_drop, and final_handoff_order. Add config tests named loads_settings. Corpus replay, if
  needed by B002, keeps the separate name replays_corpus.
