dod:
- text: >-
    forged_controls sends POST /v1/chat/completions with every named root control set to "attacker", and with every
    _UNTRUSTED_METADATA_CONTROL_FIELDS member set to "attacker" in both metadata and litellm_metadata. The mock
    provider receives none of those client values and does
    receive metadata.tenant="kept". With authenticated key metadata allow_client_mock_response=true,
    mock_response={"ok":true} and mock_tool_calls=[{"id":"t1"}] survive, while disable_global_guardrails and
    enable_prompt_caching cannot replace key/team values.
  proof: [case-forged-controls, behavior-tests, oracle]
- text: >-
    invalid_metadata sends metadata=[] and litellm_metadata=[] in separate POST /v1/chat/completions requests. Each
    request stops before the mock provider with HTTP 400, type=bad_request_error, code=400, param equal to the
    offending field, and message exactly "Invalid type for '<field>': expected an object, but got an array instead.".
    metadata="{\"tenant\":\"t\"}" reaches the provider as an object and is stripped only of user_api_key_* keys.
  proof: [case-invalid-metadata, behavior-tests, oracle]
- text: >-
    provider_auth_forwarding sends x-litellm-api-key=proxy-key, authorization=Bearer proxy-key, x-api-key=provider-key,
    x-request-id=req_1, and Cache-Control=s-maxage=60, public. general_settings true forwards provider-key upstream
    and writes data.api_key=provider-key, while proxy_server_request.headers and metadata.headers show
    x-api-key=***REDACTED*** and no x-litellm-api-key. SecretFields.raw_headers["x-api-key"] is the literal
    unredacted string "provider-key", and its display/repr is "RedactedDict(REDACTED)". When only x-api-key=proxy-key
    authenticates, it is not forwarded. An absent/false general setting with
    litellm.forward_llm_provider_auth_headers=true forwards provider-key through the module fallback; the
    absent/default-false module setting removes it. The case also checks marker priority
    x-litellm-api-key > authorization > x-api-key and that x-request-id=req_1 survives.
  proof: [case-provider-auth-forwarding, behavior-tests, oracle]
- text: >-
    snapshot_and_metadata_order sends metadata={tenant:body,user_api_key_forged:bad,tags:[body]},
    litellm_metadata={tenant:secondary,trace_id:body-trace,tags:[secondary]}, api_key=secret,
    headers={x-internal:secret}, provider_specific_header=secret, and a fixed received_at timestamp. It asserts the
    post-strip proxy_server_request.body excludes secret_fields, proxy_server_request, litellm_logging_obj,
    provider_specific_header, headers, and api_key; requester_metadata is a deep copy of cleaned metadata; metadata
    wins tenant="body", tags are [body,secondary], and litellm_metadata is removed for chat. It also asserts
    endpoint=str(request.url), arrival_time=received_at.timestamp(), metadata.litellm_api_version=null, and
    llm_api_timing_windows=().
  proof: [case-snapshot-and-metadata-order, behavior-tests, oracle]
- text: >-
    query_version_and_cache posts /v1/chat/completions?api-version=2024-06-01 with Cache-Control="s-maxage=60, public"
    and observes api_version="2024-06-01" and ttl="60" upstream. A request with no query and no Cache-Control adds
    neither field; a request whose query_params conversion raises KeyError treats the query as empty and is not an
    HTTP error.
  proof: [case-query-version-and-cache, behavior-tests, oracle]
- text: >-
    principal_budget_projection seeds key/team/project tags [key,same], [team,same], [project], request tags
    [request,same], request spend_logs_metadata {request:wins}, team {team:adds}, key {key:adds}, all spend and budget
    fields, object permission ids, allowed_model_region=eu, and key OTel values
    {otel_service_name_override:key-override,otel_service_name:key} against team values
    {otel_service_name_override:team-override,otel_service_name:team}. It asserts inherited_tags=(key,same,team,project),
    caller_tags=(request,same), request spend_logs_metadata.request="wins" wins duplicate keys, key OTel values
    survive the team merge, and every seeded user_api_key_* budget/metadata/permission field, endpoint, safe headers,
    receive time, parent span, allowed_model_region="eu", and empty timing tuple is present. With
    litellm_settings.overwrite_user_with_key_hash=true and a stampable hash "key_hash", data.user is "key_hash";
    with the default false it retains the supplied user value.
  proof: [case-principal-budget-projection, behavior-tests, oracle]
- text: >-
    turn_off_logging_and_agentic_drop loads turn_off_message_logging=true and sends root turn_off_message_logging="off"
    plus metadata.turn_off_message_logging="false" without the opt-out, so both false-like values disappear;
    allow_client_message_redaction_opt_out=true preserves them. Claude Code and Codex user agents with no body
    drop_params and no configured litellm_settings.drop_params receive drop_params=true; body drop_params=false and
    configured drop_params=false each prevent insertion. Missing user-agent and client address yield user_agent=""
    and requester_ip_address=""; use_x_forwarded_for=true with x-forwarded-for=198.51.100.7 wins over client.host,
    while false/null use client.host.
  proof: [case-turn-off-logging-and-agentic-drop, behavior-tests, oracle]
- text: >-
    final_handoff_order seeds callback variables, a non-empty key litellm_disabled_callbacks list, guardrails, and a
    model with team and key aliases. The resulting data contains callback variables and the key list;
    move_guardrails_to_metadata completes before aliases; the team alias changes data.model before the key alias;
    credential overrides receive the pre-alias model after the returned-data debug record; _enforced_params_check is
    last. The scheduled event has service=PROXY_PRE_CALL, call_type="add_litellm_data_to_request", start_time,
    end_time, duration=end_time-start_time, and parent_otel_span. No database row is written and helper-owned
    warning/error status, type, param, code, and message are unchanged.
  proof: [case-final-handoff-order, behavior-tests, oracle]
- text: >-
    loads_settings uses B002's production decoder with omitted/default, valid override, and invalid-value inputs for
    general_settings.forward_llm_provider_auth_headers=false, litellm_settings.forward_llm_provider_auth_headers=false/
    unset, general_settings.litellm_key_header_name=null, general_settings.global_max_parallel_requests=null,
    general_settings.use_x_forwarded_for=null, litellm_settings.overwrite_user_with_key_hash=false, and
    litellm_settings.turn_off_message_logging=false. Each omitted key resolves to the stated default, each valid
    override changes the typed setting, each invalid value follows B002's named diagnostic/fallback, and each accepted
    key is absent from unsupported-key diagnostics; no request_intake code reads an environment variable.
  proof: [config-tests, config-corpus]
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: The request-intake production tests or one of their named cases is absent, so a missing mutation can pass an oracle fixture alone.
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^(api|sections)::request_intake::/) - test(/::replays_corpus$/)'
  - id: case-forged-controls
    why: Root and metadata control stripping, the gateway cache key, and the authenticated mock exception are not all exercised.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::forged_controls($|::)/)'
  - id: case-invalid-metadata
    why: The two exact 400 metadata-field cases and JSON-object string acceptance are missing or wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::invalid_metadata($|::)/)'
  - id: case-provider-auth-forwarding
    why: Header priority, module-level auth forwarding fallback, provider forwarding, and safe redaction are missing or wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::provider_auth_forwarding($|::)/)'
  - id: case-snapshot-and-metadata-order
    why: The post-strip snapshot exclusions, requester copy, and merge order are missing or wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::snapshot_and_metadata_order($|::)/)'
  - id: case-query-version-and-cache
    why: Query api-version, cache-control ttl, and the KeyError fallback are absent or wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::query_version_and_cache($|::)/)'
  - id: case-principal-budget-projection
    why: Principal budgets, tag provenance, and key-over-team OTel service-name precedence are absent or wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::principal_budget_projection($|::)/)'
  - id: case-turn-off-logging-and-agentic-drop
    why: False-like logging strips, the opt-out, identity defaults, forwarded IP choice, and agentic drop policy are absent or wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::turn_off_logging_and_agentic_drop($|::)/)'
  - id: case-final-handoff-order
    why: Callback, guardrail, alias, credential, enforced-parameter, and service-event order is absent or wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_intake::tests::final_handoff_order($|::)/)'
  - id: config-tests
    why: A declared request-intake setting is rejected, has the wrong default, does not override, or lacks its loader test.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::request_intake::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: No new request-intake YAML seed reaches B002's production decoder replay with the declared settings.
