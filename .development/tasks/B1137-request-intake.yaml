pitfalls:
- 'The root tuple contains litellm_gateway_injected_cache between routing_decision and pillar_response_headers, while metadata also strips it under the literal name; omitting either location leaves a forged cache marker.'
- 'The metadata membership check is separate from the user_api_key_ prefix check and runs on both metadata and litellm_metadata after JSON-string parsing; a sample only in root data does not prove all 29 exact metadata controls are removed.'
- 'An explicit general_settings.forward_llm_provider_auth_headers=false falls through to litellm.forward_llm_provider_auth_headers because the code tests truthiness twice; a false config test must also set the module fallback true to expose this precedence.'
- 'The team metadata merge is followed by a second key-only merge for otel_service_name_override and otel_service_name; applying team metadata last reverses the documented key-over-team result.'
- 'proxy_server_request.body is refreshed only after all strips and excludes proxy_server_request itself; taking an early snapshot leaks user_api_key_forged and recursing through body creates a self-reference.'
- 'The else branch labels authentication as x-api-key even when no x-api-key header exists, so a request with only another header must not accidentally forward that other credential.'
- 'The service-success hook is scheduled with asyncio.create_task after _enforced_params_check and is not awaited; treating it as an inline database write changes the return/error timing.'
