id: B792
title: Update users and invalidate live entitlements
description: >-
  Implement authenticated POST /user/update with B865 effects and an injected update service reusable
  by login and bulk routes. Defaults litellm_changed_by=null,password_prevalidated=false,hibp_client=null
  apply to the service; the route passes neither changed-by nor a header. B124 owns request validation:
  both selectors null fails with 422 before the handler, but empty strings reach the helper and raise
  ValueError 'Either user_id or user_email must be provided'. Missing DB raises 'Not connected to DB!'
  first. Then B892 caller-permission validation, exclude_unset dump, patch preparation and B790 password
  validation/hash run BEFORE loading the existing row or checking user authorization. Cases
  selectors_absent_vs_empty, database_first, permission_before_password and password_before_target_authz.

  Patch preparation retains max_budget and budget_duration only if explicitly sent, including null.
  Explicit model_max_budget validates dict[str,float|B2214 BudgetConfig], treats null as {}, and stores
  the ORIGINAL value rather than coerced validation output. ValidationError becomes HTTPException
  400 with validation text. Other fields drop null,[],{} and management metadata fields, but preserve
  false,0 and empty string. Explicit duration validates through B861, then sets reset_at via B2317
  or null. An explicitly requested internal_user role fills ONLY omitted max_budget/duration from
  non-null litellm settings, setting reset_at for default duration without the explicit-field validator.
  Cases patch_omitted_null_empty, patch_false_zero_empty_string, model_budget_null_clear,
  model_budget_invalid_400, model_budget_validation_not_coercion, duration_clear_and_reset,
  internal_role_defaults and explicit_null_suppresses_defaults cover these branches. Own the adapter
  declaration at L116 and cache-field set at L118; B795 owns the batch-size constant at L117.

  Find first row by truthy user_id, otherwise exact case-sensitive user_email. Any non-null requested
  role requires exact proxy_admin, even an unchanged role (403 'Only proxy admins can modify user roles.').
  Existing users permit proxy_admin or exact self only; other callers get 403 detail.error explaining
  only PROXY_ADMIN can update others. Missing users permit only proxy_admin; others get 404 detail.error
  'User not found. Only PROXY_ADMIN can create users via /user/update; use /user/new instead.'.
  Self non-admin writes reject the FIRST explicitly sent/prepared field in max_budget,model_max_budget,
  soft_budget,spend,object_permission, including null/empty/no-op, with 403 naming that field and
  'Contact your proxy admin.'. Cases role_change_admin_only, self_allowed_fields, other_user_denied,
  silent_create_admin_only, self_protected_fields and protected_field_error_order cover every guard.

  Next call B894 prepare_metadata_fields with existing metadata-or-{}: retain its reserved-field
  and warn-and-continue rules, and its encrypt_callback_vars call BEFORE persisting callback variables.
  Then B861 rejects nonfinite spend before any write. B816 upserts a nonempty object_permission and
  removes it from the user payload, linking its returned non-null ID. Explicit null or a model whose
  exclude_unset/exclude_none dump is empty clears the link; omission preserves it. An explicit list
  such as mcp_servers=[] is not an empty model dump and uses the upsert branch. Cases callback_vars_encrypted,
  metadata_reserved_failure, spend_nonfinite_before_write, permission_omit_clear_empty_list and
  permission_upsert_before_user_write prove these differences, including orphaned permission rows on
  a later user-write failure. No transaction joins these operations.

  A truthy ID calls B124 update_data(table_name=user). Otherwise fetch ALL exact-email matches and
  update only the first list row; a missing/nonlist result inserts a UUID user with the requested
  email. Authorization used an earlier find_first, so preserve the second query and its race window.
  Cases id_update_precedence, email_first_match_only, email_missing_insert and email_race_second_read
  inspect actual rows. An absent write response raises HTTPException 400 detail.error 'Failed to update user'.

  For a non-null response, revoke ALL target UI sessions through B789 if a password was prepared,
  with no kept token; its swallowed revocation failure does not undo the write. Then reread updated
  user for an asynchronously scheduled B797 audit with action=updated, changed_by=explicit-or-caller,
  before/after JSON excluding nulls. No DB skips audit; missing reread skips it; any reread/scheduling
  exception warns and continues, including the bare-model email-insert response indexing failure.
  Then invalidate spend:user:{id} through B124 when prepared spend is non-null; invalidate/broadcast
  user ID through B878 only for prepared max_budget/model_max_budget or explicitly supplied metadata.
  Other fields alone do not trigger this broadcast. These failures can surface AFTER persistence.
  Cases password_revokes_all_after_write, password_revoke_failure_success, audit_missing_and_warning,
  email_insert_audit_warning, spend_zero_invalidates, budget_metadata_broadcast_predicate and
  failure_write_order prove the sequence without promising rollback.

  If object_permission_id was written, deduplicate outgoing then incoming string permission IDs,
  delete B733 object-permission cache keys, then user-to-permission link and bare user ID if non-null.
  Each deletion catches every exception, warns and continues independently. Cases
  entitlement_both_ids_and_link, entitlement_dedup_and_null_user and entitlement_failure_continues
  check keys and order. Strip password via B790 before returning: its bare-model limitation remains.
  Cases response_password_shapes and missing_response_400 pin the final projection.

  The route's OWN except maps HTTPException to auth_error, original status, detail as message and
  param attribute default string 'None'; existing ProxyException passes through; ordinary exceptions
  become 400 auth_error with message 'Authentication Error, '+str(error) and param default 'None'.
  It does not use handle_exception_on_proxy. Cases http_error_auth_mapping, proxy_error_passthrough
  and ordinary_error_400 compare status,type,message,param,code through the real route.


  Build the production user_update module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _update_internal_user_params (L1286-L1341; 48 source lines), _schedule_user_update_audit_log (L1344-L1371;
  27 source lines), _check_user_update_authz (L1374-L1399; 24 source lines), _invalidate_user_spend_counter_if_changed
  (L1402-L1416; 13 source lines), _clears_object_permission (L1419-L1428; 9 source lines), _invalidate_cached_user_entitlement
  (L1431-L1458; 24 source lines), _update_single_user_helper (L1461-L1648; 143 source lines), can_user_call_user_update
  (L1651-L1663; 13 source lines), user_update (L1672-L1753; 78 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.max_internal_user_budget=None;
  litellm_settings.internal_user_budget_duration=None.


  B001 HTTP cases use the running gateways, comparing whole responses and persisted/cached effects.
  Native fault injection covers audit scheduling and independent cache failures unreachable by ordinary
  HTTP fixtures. No adapter calls the FastAPI handler, and no new route alias is introduced.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Config tests internal_role_defaults, explicit_null_suppresses_defaults and default_duration_errors
  call B002, consume both settings (default null) and verify prepared fields/reset times. Invalid
  configured duration propagates from B2317; it is not replaced with a fallback. Password settings
  belong to B786/B790 and callback encryption to B894/B2304, without duplicate parsers here.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 379 source lines before removing long route/helper docstrings, plus two declarations;
  allow 290 production, 380 behavior/Postgres tests, 65 wiring and 50 config lines, 785 changed
  lines within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
