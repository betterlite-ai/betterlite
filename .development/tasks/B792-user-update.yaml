id: B792
title: Update users and invalidate live entitlements
description: >-
  Implement /user/update with UserPatch fields, password policy and session revocation, role/ownership
  authorization, spend-counter invalidation and audit event projection. Preserve omitted-versus-cleared
  object permission, source update behavior and post-commit cache invalidation.


  Build the production user_update module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/internal_user_endpoints.py:
  _update_internal_user_params (L1286-L1341; 48 source lines), _schedule_user_update_audit_log (L1344-L1371;
  27 source lines), _check_user_update_authz (L1374-L1399; 24 source lines), _invalidate_user_spend_counter_if_changed
  (L1402-L1416; 13 source lines), _clears_object_permission (L1419-L1428; 9 source lines), _invalidate_cached_user_entitlement
  (L1431-L1458; 24 source lines), _update_single_user_helper (L1461-L1648; 143 source lines), can_user_call_user_update
  (L1651-L1663; 13 source lines), user_update (L1672-L1753; 78 source lines).


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_settings.max_internal_user_budget=None;
  litellm_settings.internal_user_budget_duration=None.


  Register these actual HTTP routes and aliases exactly once: POST /user/update -> user_update. For each
  route send a typed successful request, an invalid or missing target, and a caller lacking that route
  permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::user_update::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 379 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  379 production, 154 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 648 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
